      - name: attachment_soft_void_filter_semantics
        claim_type: soft_delete
        grounds: [entities.AppealAttachment.fields.status]
        distinguishing_aspect: "Voiding is a soft delete: the attachment vanishes from the status=ACTIVE listing, appears under status=VOIDED, and remains addressable by id."
        test_recipe:
          setup: ["payer A with level-1 policy; code CO-16; denial CLM-2608 QUEUED; appeal DRAFT with CLINICAL_NOTES and PHYSICIAN_LETTER attachments; physician letter voided"]
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 1, timely_filing_days: 60, response_window_days: 30, required_attachment_types: ["CLINICAL_NOTES"], effective_from: "2026-01-01" }
              as: RevenueCycleDirector
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-2608", patient_account_number: "PA-2608", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 300000, denied_amount_cents: 250000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id }
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { d_v: $.data.version }
            - call: "POST /rcm/denial-cases/${d1}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d_v}" }
              as: DenialsManager
            - call: "POST /rcm/appeals"
              payload: { denial_case_id: "${d1}" }
              as: DenialsSpecialist
              captures: { ap1: $.data.id }
            - call: "POST /rcm/appeal-attachments"
              payload: { appeal_id: "${ap1}", document_type: "CLINICAL_NOTES", file_reference: "doc-2608-notes" }
              as: DenialsSpecialist
              captures: { att1: $.data.id }
            - call: "POST /rcm/appeal-attachments"
              payload: { appeal_id: "${ap1}", document_type: "PHYSICIAN_LETTER", file_reference: "doc-2608-letter" }
              as: DenialsSpecialist
              captures: { att2: $.data.id }
            - call: "POST /rcm/appeal-attachments/${att2}/void"
              payload: { reason: "Superseded by updated letter" }
              as: DenialsSpecialist
          trigger:
            - call: "GET /rcm/appeal-attachments"
              payload: { appeal_id: "${ap1}", status: "ACTIVE" }
              as: DenialsSpecialist
              captures: { active0: "$.data[0].id" }
            - call: "GET /rcm/appeal-attachments"
              payload: { appeal_id: "${ap1}", status: "VOIDED" }
              as: DenialsSpecialist
              captures: { voided0: "$.data[0].id" }
            - call: "GET /rcm/appeal-attachments/${att2}"
              payload: {}
              as: DenialsSpecialist
              captures: { att2_status: $.data.status }
          assert:
            - "status=ACTIVE listing contains exactly the CLINICAL_NOTES attachment"
            - "status=VOIDED listing contains exactly the voided PHYSICIAN_LETTER attachment"
            - "direct GET of the voided attachment succeeds with status == VOIDED (referential integrity preserved)"

      - name: expiry_cascade_end_to_end
        claim_type: cascading_side_effects
