    path: /adjunct-hr/retention-entries/{id}
    description: "Fetch one retention entry"
    roles: [HRAdmin, HRReviewer, DepartmentChair, Dean]
    code: 200
    input: []
    output: RetentionEntry
    side_effects: []
  - method: GET
    path: /adjunct-hr/retention-entries
    description: "List retention entries"
    roles: [HRAdmin, HRReviewer, DepartmentChair, Dean]
    code: 200
    input: [ "faculty_id?", "department_id?", "list_term_code?", "entry_status?", "limit?", "offset?"]
    output: RetentionEntry[]
    side_effects: []
  - method: POST
    path: /adjunct-hr/retention-entries/{id}/reappoint
    description: "LISTED -> REAPPOINTED (OCC-guarded on faculty version; requires COMPLIANT)"
    roles: [Dean]
    code: 200
    input: [expected_faculty_version]
    output: RetentionEntry
    side_effects: ["increments RetentionEntry.version by 1", "increments AdjunctFaculty.version by 1"]
  - method: POST
    path: /adjunct-hr/retention-entries/{id}/mark-non-reappointed
    description: "LISTED -> NON_REAPPOINTED (OCC-guarded); cascades faculty retention_status and voids future ISSUED contracts"
    roles: [Dean]
    code: 200
    input: [expected_faculty_version]
    output: RetentionEntry
    side_effects: ["faculty retention_status -> NON_REAPPOINTED", "future ISSUED contracts -> VOIDED", "faculty load aggregates recomputed", "increments RetentionEntry.version by 1"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/malformed X-User-Role or X-User-ID, or undeclared role" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "authenticated role not in the endpoint's role list" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path id or *_id body reference does not resolve (left-to-right: path first)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, invalid enum member, numeric range violated, malformed date" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "requested action has no transition from the entity's current state (includes terminal-state lockdown and double-action idempotency failures)" }
  - { id: ERR_POSTING_NOT_OPEN, http: 409, condition: "application filed against a posting not in OPEN status or outside [open_date, close_date]" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "approving HRReviewer verified one or more credentials on the same application" }
  - { id: ERR_CREDENTIALS_INCOMPLETE, http: 422, condition: "approval blocked: PENDING credentials remain, required TRANSCRIPT/DEGREE not VERIFIED, or no VERIFIED tier meets posting minimum" }
  - { id: ERR_COMPLIANCE_INCOMPLETE, http: 422, condition: "compliance gate failed: reinstatement lacks VERIFIED background check, or reappointment target not COMPLIANT" }
  - { id: ERR_DUPLICATE, http: 409, condition: "uniqueness violation on department code, term code, period code, section natural key, or applicant email within a posting" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "date ordering/span violated: term span < 14 days, census ordering broken, inverted schedule/period/posting dates" }
  - { id: ERR_SCHEDULE_OVERLAP, http: 409, condition: "publish would create overlapping PUBLISHED rate schedules for same (department_id, education_tier) under half-open interval semantics" }
  - { id: ERR_PAYROLL_PERIOD_OVERLAP, http: 409, condition: "new payroll period's closed interval intersects a non-CLOSED period (touching endpoints count as overlap)" }
  - { id: ERR_CANCELLATION_POLICY, http: 422, condition: "LOW_ENROLLMENT cancel requires enrollment < min_enrollment and current date strictly before early census" }
  - { id: ERR_CONTRACT_REFERENCE_INVALID, http: 422, condition: "contract issuance reference invalid: schedule not PUBLISHED, tier/department mismatch, schedule window doesn't cover term start, section terminal, faculty NON_REAPPOINTED, or term ROLLED_OVER" }
  - { id: ERR_LOAD_CAP_EXCEEDED, http: 422, condition: "issuance would push faculty prospective term load beyond load_cap_units + 1.00 overage allowance" }
  - { id: ERR_PAYROLL_CLOSE_ORDER, http: 422, condition: "closing a period while an earlier-starting period is not yet CLOSED, or closing an already-CLOSED period" }
  - { id: ERR_STALE_FACULTY_VERSION, http: 412, condition: "expected_faculty_version does not match AdjunctFaculty.version at write time" }
  - { id: ERR_REFERENCE_IN_USE, http: 409, condition: "retire/archive/deactivate blocked by live references (ISSUED/ACTIVE contracts, in-flight applications, OPEN postings)" }
  - { id: ERR_REVISION_LIMIT, http: 422, condition: "return-for-revision when revision_count == MAX_REVISIONS (3)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: HRAdmin
    description: "Central HR administrator; owns departments, terms, rate schedules; voids contracts; drives the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /adjunct-hr/departments, PATCH /adjunct-hr/departments/{id}"
      - "POST /adjunct-hr/terms, /terms/{id}/open, /terms/{id}/rollover"
      - "POST /adjunct-hr/rate-schedules, /rate-schedules/{id}/publish, /rate-schedules/{id}/retire"
      - "POST /adjunct-hr/contracts/{id}/void"
      - "POST /adjunct-hr/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: HRReviewer
    description: "HR credential reviewer; files and processes applications, verifies credentials; CANNOT approve an application whose credentials they personally verified"
    identity: "opaque"
    exclusive_operations:
      - "POST /adjunct-hr/applications and application lifecycle actions (start-review, return-for-revision, resubmit, approve, reject, withdraw)"
      - "POST /adjunct-hr/credentials, /credentials/{id}/verify, /credentials/{id}/reject"
      - "POST /adjunct-hr/faculty/{id}/reinstate-compliance"
    shared_operations: ["all GET endpoints"]
  - name: DepartmentChair
    description: "Department chair; owns pool postings, course sections, and issues contracts"
    identity: "opaque"
    exclusive_operations:
      - "POST /adjunct-hr/postings and posting lifecycle actions (publish, suspend, resume, close, archive)"
      - "POST /adjunct-hr/sections, PATCH /adjunct-hr/sections/{id}, /sections/{id}/cancel, /sections/{id}/complete"
      - "POST /adjunct-hr/contracts"
    shared_operations: ["all GET endpoints"]
  - name: Dean
    description: "Academic dean; records evaluations and administers the retention list"
    identity: "opaque"
    exclusive_operations:
      - "POST /adjunct-hr/evaluations"
      - "POST /adjunct-hr/retention-entries, /retention-entries/{id}/reappoint, /retention-entries/{id}/mark-non-reappointed"
    shared_operations: ["all GET endpoints"]
  - name: PayrollOfficer
    description: "Payroll officer; owns payroll periods and runs payroll close"
    identity: "opaque"
    exclusive_operations:
      - "POST /adjunct-hr/payroll-periods, /payroll-periods/{id}/lock, /payroll-periods/{id}/close"
    shared_operations: ["all GET endpoints"]
