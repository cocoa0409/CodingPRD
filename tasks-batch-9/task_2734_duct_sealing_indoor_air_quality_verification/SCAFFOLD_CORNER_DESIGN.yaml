      - name: resume_is_only_legal_from_paused
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /duct-sealing/seal-jobs/{id}/resume]
          - endpoints[POST /duct-sealing/seal-jobs/{id}/pause]
        excluded_because:
          difficulty_instance: non_linear_state_machine / seal_job_injecting_pause_resume_cycle
          rationale: "That §1.8 instance walks INJECTING -> PAUSED -> INJECTING twice, asserts pause_count and the rejection of resume from INJECTING and of a sample while PAUSED."

      - name: duct_system_ledger_read_after_an_abort
        claim_type: computed_read
        grounds:
          - endpoints[GET /duct-sealing/duct-systems/{id}]
          - endpoints[POST /duct-sealing/seal-jobs/{id}/abort]
        excluded_because:
          difficulty_instance: compensating_invariant / abort_restores_duct_leakage_ledger_identity
          rationale: "That §1.8 instance reads the duct system before and after the abort and asserts working_leakage_cfm25 + sealed_leakage_reduction_cfm == baseline_leakage_cfm25 on both sides."

  - section: errors
    intent: >
      Walk the §1.6 catalog and prove every declared code is reachable. Nine codes had no
      trigger anywhere in §1.8 or in the earlier §1.9 sections — the five thin NOT_FOUNDs
      (utility program, technician, leakage test, verification report, comfort complaint),
      ERR_COMPLAINT_INVALID_STATE, ERR_STALE_SEAL_JOB_VERSION, ERR_INJECTION_PRESSURE_LIMIT
      and ERR_SEGREGATION_OF_DUTIES — so this section triggers the first eight and the rbac
      section below triggers the ninth. The remaining codes are already fired by a named
      instance and are recorded here as stubs so the audit trail is complete.
    instances:
      - name: every_unknown_identifier_reaches_its_own_not_found_code
        claim_type: error_triggerable
        grounds:
          - errors.ERR_UTILITY_PROGRAM_NOT_FOUND
          - errors.ERR_TECHNICIAN_NOT_FOUND
          - errors.ERR_LEAKAGE_TEST_NOT_FOUND
          - errors.ERR_VERIFICATION_REPORT_NOT_FOUND
          - errors.ERR_COMFORT_COMPLAINT_NOT_FOUND
          - errors.ERR_REBATE_CLAIM_NOT_FOUND
          - validations[priority=40]
        distinguishing_aspect: "Priority 40 declares nine distinct NOT_FOUND codes; a lazy implementation collapses them into one generic 404. Six of them are exercised here against BOTH shapes of reference — an unknown id in the request BODY (utility_program_id on a project create, technician_id on a seal-job create) and an unknown id in the PATH (a leakage test, a report, a complaint's nested collection, a claim) — with everything else in the request valid so nothing else can shadow the 404."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one programme, one ACTIVE technician, one project, one CLEARED duct system and one ACCEPTED PRE leakage test — so every reference except the deliberately bogus one resolves"
          setup_api_calls:
            - call: "POST /duct-sealing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /duct-sealing/utility-programs"
              payload: { name: "Metro Gas Duct Seal 2026", rebate_basis: "PER_CFM", rate_cents_per_cfm_reduced: 1200, pct_of_invoice_bps: 3000, cap_cents: 500000, annual_budget_cents: 5000000, min_reduction_pct: 80.00, requires_inspector_verification: true, combustion_safety_required: true }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /duct-sealing/technicians"
              payload: { full_name: "Dana Ruiz", license_number: "AS-4417", certification_status: "ACTIVE", certification_expires_at: "2027-06-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { tech1_id: $.data.id }
            - call: "POST /duct-sealing/projects"
              payload: { utility_program_id: "${prog_id}", address_line: "18 Larkspur Ln", conditioned_floor_area_sqft: 2000, gas_appliance_count: 1, invoice_amount_cents: 480000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /duct-sealing/projects/${proj_id}/duct-systems"
              payload: { system_label: "AHU-1", total_register_count: 9, design_cfm: 1200.0, duct_material: "SHEET_METAL", condition_grade: "B" }
              as: ProgramAdmin
              captures: { ds1_id: $.data.id }
            - call: "POST /duct-sealing/duct-systems/${ds1_id}/asbestos-screening"
              payload: { asbestos_screening_result: "CLEARED", lab_reference: "LAB-1001" }
              as: QAVerifier
              as_user_id: "qa-1"
            - call: "POST /duct-sealing/leakage-tests"
              payload: { duct_system_id: "${ds1_id}", phase: "PRE", method: "DUCT_BLASTER", window_start_at: "2026-08-01T13:00:00Z", window_end_at: "2026-08-01T15:00:00Z" }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { pre1_id: $.data.id }
            - call: "POST /duct-sealing/leakage-tests/${pre1_id}/pressurize"
              payload: { test_pressure_pa: 25.0, fan_ring_config: "RING_2", masked_register_count: 9 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/leakage-tests/${pre1_id}/record"
              payload: { measured_leakage_cfm: 300.0, ambient_temp_f: 78.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/leakage-tests/${pre1_id}/review"
              payload: { decision: "ACCEPT", review_note: "baseline accepted" }
              as: QAVerifier
              as_user_id: "qa-1"
            - call: "GET /duct-sealing/duct-systems/${ds1_id}"
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { ds1_v: $.data.version }
          trigger:
            - call: "POST /duct-sealing/projects"
              payload: { utility_program_id: "up-does-not-exist", address_line: "2 Nowhere Rd", conditioned_floor_area_sqft: 1500, gas_appliance_count: 0, invoice_amount_cents: 300000 }
              as: ProgramAdmin
              captures: { e_prog: $.data.error_id }
            - call: "POST /duct-sealing/seal-jobs"
              payload: { duct_system_id: "${ds1_id}", pre_test_id: "${pre1_id}", technician_id: "tech-does-not-exist", scheduled_start_at: "2026-08-02T13:00:00Z", scheduled_end_at: "2026-08-02T18:00:00Z", target_leakage_cfm: 60.0, expected_duct_system_version: "${ds1_v}" }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { e_tech: $.data.error_id }
            - call: "GET /duct-sealing/leakage-tests/lt-does-not-exist"
              as: QAVerifier
              as_user_id: "qa-1"
              captures: { e_test: $.data.error_id }
            - call: "GET /duct-sealing/verification-reports/vr-does-not-exist"
              as: QAVerifier
              as_user_id: "qa-1"
              captures: { e_report: $.data.error_id }
            - call: "GET /duct-sealing/comfort-complaints/cc-does-not-exist/airflow-readings"
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { e_complaint: $.data.error_id }
            - call: "GET /duct-sealing/rebate-claims/rc-does-not-exist"
              as: ProgramAdmin
              captures: { e_claim: $.data.error_id }
          assert:
            - "${e_prog} == ERR_UTILITY_PROGRAM_NOT_FOUND with HTTP 404 — the unknown reference sits in the body, not the path"
            - "${e_tech} == ERR_TECHNICIAN_NOT_FOUND with HTTP 404: the duct system, the pre-test and the version are all valid, so only the technician can be at fault"
            - "${e_test} == ERR_LEAKAGE_TEST_NOT_FOUND, ${e_report} == ERR_VERIFICATION_REPORT_NOT_FOUND, ${e_claim} == ERR_REBATE_CLAIM_NOT_FOUND, each with HTTP 404"
            - "${e_complaint} == ERR_COMFORT_COMPLAINT_NOT_FOUND with HTTP 404 — a nested collection under an unknown parent is a 404, NOT a 200 with an empty array"
            - "All six responses carry response_type == error and a non-empty data.message; none of them returns a shared generic code"
            - "No side effect landed: GET /duct-sealing/projects still reports total_count == 1 and GET /duct-sealing/seal-jobs still reports total_count == 0"

      - name: resume_after_the_pressure_cutoff_reports_the_cutoff_not_the_state
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INJECTION_PRESSURE_LIMIT
          - validations[priority=60]
          - validations[priority=80]
          - state_machines.SealJob[INJECTING->ABORTED_SAFETY]
