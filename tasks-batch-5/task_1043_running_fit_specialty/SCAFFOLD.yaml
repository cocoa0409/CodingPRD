scenario: |
  1031. Running & Fit Specialty Store: gait analysis & fitment, shoe rotation & mileage-reminder,
  subscription/club & training-group, race-packet & event, wear/return policy, loyalty,
  nutrition/gear, inventory
domain_name: running-fit-specialty
api_prefix: ""   # flat multi-resource API: each entity is its own top-level collection (/stores, /members, /orders, ...)

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
  notes: |
    Flat peer entities linked by FK (no nested ownership URLs beyond convenience sub-resources).
    RaceRegistration carries two independent state dimensions (payment_status x packet_status);
    Subscription runs a cyclic ACTIVE<->PAST_DUE loop. Temporal overlap is enforced on two
    different resource entities with different interval geometry: FittingAppointment on a
    StaffMember (pairwise buffer) and TrainingSession on a Store (aggregate room capacity).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Store
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Store display name.
      - name: region_code
        type: string
        source: input
        description: Two-letter region/state code for the store location.
      - name: session_room_count
        type: integer
        source: input
        default: 1
        description: Number of coaching rooms available for concurrent training sessions at this store; the aggregate-overlap capacity used to reject over-booked session windows.
        constraints: ">= 1"

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the store this fitter/coach is assigned to."
      - name: full_name
        type: string
        source: input
        description: Staff member display name.
      - name: role_type
        type: enum
        source: input
        description: Whether the staff member performs fittings, coaching, or both.
        constraints: "one of FITTER, COACH, BOTH"
      - name: active
        type: boolean
        source: input
        default: true
        description: Whether the staff member currently accepts bookings.

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Member contact email; unique per member.
      - name: full_name
        type: string
        source: input
        description: Member display name.
      - name: loyalty_points
        type: integer
        source: computed
        default: 0
        description: Earned loyalty points; floor(sum of final_total_cents over FULFILLED Orders / POINTS_PER_CENT_DIVISOR). Recomputed as a side effect of Order fulfillment.
      - name: loyalty_tier
        type: enum
        source: computed
        default: BRONZE
        description: Current loyalty tier derived from loyalty_points via LOYALTY_TIER_THRESHOLDS. Recomputed whenever loyalty_points changes.
        constraints: "one of BRONZE, SILVER, GOLD, PLATINUM"
      - name: wallet_credit_cents
        type: integer
        source: computed
        default: 0
        description: Store credit balance in cents, increased by race registration refunds and order returns.

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: Stock keeping unit code; unique per product.
      - name: category
        type: enum
        source: input
        description: Product category.
        constraints: "one of SHOE, NUTRITION, GEAR, APPAREL"
      - name: name
        type: string
        source: input
        description: Product display name.
      - name: price_cents
        type: integer
        source: input
        description: Unit list price in cents.
        constraints: ">= 0"
      - name: stock_on_hand
        type: integer
        source: input
        default: 0
        description: Units physically available and not reserved.
        constraints: ">= 0"
      - name: stock_reserved
        type: integer
        source: computed
        default: 0
        description: Units reserved by PLACED orders that are not yet fulfilled or cancelled.
        constraints: ">= 0"
      - name: max_mileage_km
        type: integer
        source: input
        default: null
        description: For SHOE products, the mileage-reminder threshold in km copied onto a ShoePair as reminder_threshold_km; null for non-shoe products.

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the subscribing member."
      - name: tier
        type: enum
        source: input
        description: Club subscription tier.
        constraints: "one of CLUB_BASIC, CLUB_PRO"
      - name: status
        type: enum
        source: system
        default: PENDING
        description: Subscription lifecycle state.
        constraints: "one of PENDING, ACTIVE, PAST_DUE, CANCELLED"
      - name: monthly_fee_cents
        type: integer
        source: computed
        description: Monthly fee derived from tier via TIER_MONTHLY_FEE_CENTS.
      - name: included_fittings_per_month
        type: integer
        source: computed
        description: Number of fee-free fittings per period derived from tier via TIER_INCLUDED_FITTINGS.
      - name: fittings_used_this_period
        type: integer
        source: computed
        default: 0
        description: Count of included (fee-free) fittings consumed in the current period; incremented when an appointment completes under the included allowance.
      - name: started_at
        type: datetime
        source: system
        default: null
        description: Logical-clock timestamp when the subscription first became ACTIVE.
      - name: current_period_end
        type: datetime
        source: computed
        default: null
        description: started_at + SUBSCRIPTION_PERIOD_DAYS; informational period boundary.

  - name: FittingAppointment
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member being fitted."
      - name: fitter_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the fitter (role_type FITTER or BOTH) performing the appointment. This is the resource whose calendar is buffer-checked."
      - name: service_type
        type: enum
        source: input
        description: Type of fitting service.
        constraints: "one of GAIT_ANALYSIS, SHOE_FITTING, FOLLOWUP"
      - name: start_at
        type: datetime
        source: input
        description: Appointment start instant (ISO 8601 UTC).
      - name: end_at
        type: datetime
        source: input
        description: Appointment end instant; must be strictly after start_at.
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: Appointment lifecycle state.
        constraints: "one of SCHEDULED, COMPLETED, CANCELLED"
      - name: gait_result
        type: object
        source: computed
        default: null
        description: Gait analysis outcome captured at completion (e.g., pronation classification); null until COMPLETED.
      - name: fee_cents
        type: integer
        source: computed
        default: null
        description: Fitting fee charged, computed by fitting_fee at completion; null until COMPLETED.

  - name: TrainingSession
    parent: null
    common_fields: true
    fields:
      - name: coach_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the coach (role_type COACH or BOTH) leading the session. Buffer-free pairwise overlap on this coach is rejected."
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the store hosting the session, whose session_room_count bounds concurrent overlapping sessions."
      - name: level
        type: enum
        source: input
        description: Training group difficulty level.
        constraints: "one of BEGINNER, INTERMEDIATE, ADVANCED"
      - name: start_at
        type: datetime
        source: input
        description: Session start instant (ISO 8601 UTC).
      - name: end_at
        type: datetime
        source: input
        description: Session end instant; must be strictly after start_at.
      - name: capacity
        type: integer
        source: input
        description: Maximum number of ENROLLED members before further enrollments are WAITLISTED.
        constraints: ">= 1"
      - name: enrolled_count
        type: integer
        source: computed
        default: 0
        description: Count of SessionEnrollment rows for this session with status ENROLLED.
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: Session lifecycle state.
        constraints: "one of SCHEDULED, CANCELLED"

  - name: SessionEnrollment
    parent: null
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> TrainingSession.id; the session being enrolled into."
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the enrolling member."
      - name: status
        type: enum
        source: system
        default: WAITLISTED
        description: Enrollment state; set to ENROLLED or WAITLISTED at creation depending on capacity, promoted from WAITLISTED to ENROLLED when a spot frees.
        constraints: "one of ENROLLED, WAITLISTED, CANCELLED"

  - name: RaceEvent
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Race event name.
      - name: event_date
        type: datetime
        source: input
        description: Date/time of the race event.
      - name: packet_capacity
        type: integer
        source: input
        description: Total number of race packets available; bounds active_registrations.
        constraints: ">= 1"
      - name: entry_fee_cents
        type: integer
        source: input
        description: Entry fee per registration in cents.
        constraints: ">= 0"
      - name: packets_allocated
        type: integer
        source: computed
        default: 0
        description: Count of RaceRegistration rows for this event with packet_status ALLOCATED.
      - name: active_registrations
        type: integer
        source: computed
        default: 0
        description: Count of RaceRegistration rows for this event with packet_status in {RESERVED, ALLOCATED} (i.e., not RELEASED); must never exceed packet_capacity.
      - name: status
        type: enum
        source: system
        default: OPEN
        description: Event registration state.
        constraints: "one of OPEN, CLOSED"

  - name: RaceRegistration
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> RaceEvent.id; the event registered for."
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the registering member."
      - name: payment_status
        type: enum
        source: system
        default: UNPAID
        description: Payment dimension, evolves independently of packet_status.
        constraints: "one of UNPAID, PAID, REFUNDED"
      - name: packet_status
        type: enum
        source: system
        default: RESERVED
        description: Packet fulfillment dimension, evolves independently of payment_status.
        constraints: "one of RESERVED, ALLOCATED, RELEASED"
      - name: entry_fee_cents
        type: integer
        source: computed
        description: Entry fee snapshotted from the RaceEvent at registration time.
      - name: amount_paid_cents
        type: integer
        source: computed
        default: 0
        description: Amount actually charged when payment moved to PAID.
      - name: refund_cents
        type: integer
        source: computed
        default: 0
        description: Amount refunded to the member wallet on cancellation of a PAID registration.

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the ordering member."
      - name: status
        type: enum
        source: system
        default: CART
        description: Order lifecycle state.
        constraints: "one of CART, PLACED, FULFILLED, RETURNED, CANCELLED"
      - name: lines
        type: array
        source: computed
        default: []
        description: Order line items appended while in CART; each item is an object { product_id, qty, unit_price_cents, line_gross_cents } where unit_price_cents is snapshotted from the Product at add-line time.
      - name: subtotal_cents
        type: integer
        source: computed
        default: 0
        description: Sum of line_gross_cents across all lines.
      - name: provisional_discount_cents
        type: integer
        source: computed
        default: null
        description: Discount computed at PLACE time by order_pricing (provisional variant); recomputed as a cascade side effect when the member's loyalty_tier changes while this order is still PLACED.
      - name: provisional_total_cents
        type: integer
        source: computed
        default: null
        description: subtotal_cents - provisional_discount_cents, set at PLACE and kept reconciled while PLACED.
      - name: final_discount_cents
        type: integer
        source: computed
        default: null
        description: Discount computed at FULFILL time by order_pricing (final variant); null until FULFILLED.
      - name: final_total_cents
        type: integer
        source: computed
        default: null
        description: subtotal_cents - final_discount_cents, set at FULFILL; the amount that earns loyalty points.
      - name: refund_cents
        type: integer
        source: computed
        default: 0
        description: Amount credited to the member wallet on RETURN, net of restocking fee.
      - name: placed_at
        type: datetime
        source: system
        default: null
        description: Logical-clock timestamp when the order moved to PLACED.
      - name: fulfilled_at
        type: datetime
        source: system
        default: null
        description: Logical-clock timestamp when the order moved to FULFILLED; the anchor for the return window.

  - name: ShoePair
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the shoe owner."
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the SHOE product this pair instantiates."
      - name: reminder_threshold_km
        type: integer
        source: computed
        description: Mileage-reminder threshold copied from Product.max_mileage_km at creation.
      - name: total_mileage_km
        type: number
        source: computed
        default: 0
        description: Sum of distance_km across all run_logs; drives the REORDER_DUE transition.
      - name: run_logs
        type: array
        source: computed
        default: []
        description: Appended run entries; each item is an object { distance_km, logged_at }.
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: Rotation state; ACTIVE until total_mileage_km reaches reminder_threshold_km, then REORDER_DUE.
        constraints: "one of ACTIVE, REORDER_DUE"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Subscription
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/activate"
        actor: Member
        preconditions:
          - "subscription.status == PENDING"
          - "acting member owns the subscription (X-User-ID == subscription.member_id)"
        side_effects:
          - "set started_at = current logical clock"
          - "set current_period_end = started_at + SUBSCRIPTION_PERIOD_DAYS"
          - "set fittings_used_this_period = 0"
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /subscriptions/{id}/renew with payment_outcome=FAILED"
        actor: StoreManager
        preconditions:
          - "subscription.status == ACTIVE"
        side_effects:
          - "member loses ACTIVE-tier gear/training discounts (subsequent order/fitting pricing recomputes with subscription gear/training discount = 0 while PAST_DUE)"
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/renew with payment_outcome=SUCCEEDED"
        actor: StoreManager
        preconditions:
          - "subscription.status == PAST_DUE"
        side_effects:
          - "advance current_period_end by SUBSCRIPTION_PERIOD_DAYS"
          - "reset fittings_used_this_period = 0"
        note: "PAST_DUE -> ACTIVE is the reactivation half of the ACTIVE<->PAST_DUE cycle."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Member
        preconditions:
          - "subscription.status == ACTIVE"
          - "acting member owns the subscription"
        side_effects:
          - "member reverts to non-subscriber pricing (subscription gear/training discount = 0) on future orders/fittings"
      - from: PAST_DUE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Member
        preconditions:
          - "subscription.status == PAST_DUE"
          - "acting member owns the subscription"
        side_effects:
          - "no refund; subscription closed"

  - entity: FittingAppointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /fitting-appointments/{id}/complete"
        actor: Staff
        preconditions:
          - "appointment.status == SCHEDULED"
          - "acting staff is the fitter (X-User-ID == appointment.fitter_id)"
        side_effects:
          - "set gait_result from request body"
          - "compute fee_cents via fitting_fee"
          - "if the appointment was priced as an included (fee-free) fitting, increment the member's ACTIVE subscription fittings_used_this_period by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /fitting-appointments/{id}/cancel"
        actor: Member
        preconditions:
          - "appointment.status == SCHEDULED"
          - "acting member owns the appointment (X-User-ID == appointment.member_id)"
        side_effects:
          - "the fitter's buffered time window is released so a later appointment may reuse it"

  - entity: TrainingSession
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /training-sessions/{id}/cancel"
        actor: Staff
        preconditions:
          - "session.status == SCHEDULED"
        side_effects:
          - "cascade: every SessionEnrollment for this session with status in {ENROLLED, WAITLISTED} transitions to CANCELLED"
          - "set enrolled_count = 0"

  - entity: SessionEnrollment
    initial_state: WAITLISTED
    terminal_states: [CANCELLED]
    transitions:
      - from: null
        to: ENROLLED
        trigger: "POST /training-sessions/{id}/enrollments (creation, capacity available)"
        actor: Member
        preconditions:
          - "session.status == SCHEDULED"
          - "session.enrolled_count < session.capacity"
          - "member has no existing non-CANCELLED enrollment for this session"
        side_effects:
          - "increment session.enrolled_count by 1"
      - from: null
        to: WAITLISTED
        trigger: "POST /training-sessions/{id}/enrollments (creation, session full)"
        actor: Member
        preconditions:
          - "session.status == SCHEDULED"
          - "session.enrolled_count == session.capacity"
          - "member has no existing non-CANCELLED enrollment for this session"
        side_effects:
          - "no change to enrolled_count"
      - from: WAITLISTED
        to: ENROLLED
        trigger: "system: promotion when an ENROLLED spot frees on the same session"
        actor: system
        preconditions:
          - "enrollment.status == WAITLISTED"
          - "this enrollment has the earliest created_at among WAITLISTED enrollments of the session"
          - "session.enrolled_count < session.capacity"
        side_effects:
          - "increment session.enrolled_count by 1"
      - from: ENROLLED
        to: CANCELLED
        trigger: "POST /session-enrollments/{id}/cancel"
        actor: Member
        preconditions:
          - "enrollment.status == ENROLLED"
          - "acting member owns the enrollment"
        side_effects:
          - "decrement session.enrolled_count by 1"
          - "cascade: promote the earliest-created WAITLISTED enrollment of the same session to ENROLLED (which itself re-increments enrolled_count)"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /session-enrollments/{id}/cancel"
        actor: Member
        preconditions:
          - "enrollment.status == WAITLISTED"
          - "acting member owns the enrollment"
        side_effects:
          - "no change to enrolled_count; no promotion (no ENROLLED spot freed)"

  - entity: RaceEvent
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /race-events/{id}/close"
        actor: StoreManager
        preconditions:
          - "event.status == OPEN"
        side_effects:
          - "further registrations and allocations are rejected"

  - entity: RaceRegistration
    initial_state: RESERVED
    terminal_states: [RELEASED]
    note: "Parallel dimensions: payment_status (UNPAID->PAID->REFUNDED) and packet_status (RESERVED->ALLOCATED, RESERVED->RELEASED) advance independently. Terminal is packet_status RELEASED; a RELEASED registration may still carry payment_status PAID or REFUNDED."
    transitions:
      - from: RESERVED
        to: RESERVED
        trigger: "POST /race-registrations/{id}/pay (payment dimension: UNPAID -> PAID)"
        actor: Member
        preconditions:
          - "registration.payment_status == UNPAID"
          - "registration.packet_status == RESERVED"
          - "acting member owns the registration"
        side_effects:
          - "set payment_status = PAID"
          - "set amount_paid_cents = entry_fee_cents"
      - from: RESERVED
        to: ALLOCATED
        trigger: "POST /race-registrations/{id}/allocate (packet dimension)"
        actor: Staff
        preconditions:
          - "registration.packet_status == RESERVED"
          - "registration.payment_status == PAID"
          - "parent RaceEvent.status == OPEN"
        side_effects:
          - "set packet_status = ALLOCATED"
          - "increment event.packets_allocated by 1"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /race-registrations/{id}/cancel"
        actor: Member
        preconditions:
          - "registration.packet_status in {RESERVED, ALLOCATED}"
          - "acting member owns the registration"
        side_effects:
          - "set packet_status = RELEASED"
          - "decrement event.active_registrations (frees a packet slot)"
          - "if packets were ALLOCATED, decrement event.packets_allocated by 1"
          - "if payment_status == PAID: set payment_status = REFUNDED, set refund_cents = amount_paid_cents - RACE_CANCELLATION_FEE_CENTS (floored at 0), credit that amount to member.wallet_credit_cents"
      - from: ALLOCATED
        to: RELEASED
        trigger: "POST /race-registrations/{id}/cancel"
        actor: Member
        preconditions:
          - "registration.packet_status == ALLOCATED"
          - "acting member owns the registration"
        side_effects:
          - "set packet_status = RELEASED"
          - "decrement event.packets_allocated by 1 and event.active_registrations by 1"
          - "if payment_status == PAID: set payment_status = REFUNDED, set refund_cents = amount_paid_cents - RACE_CANCELLATION_FEE_CENTS (floored at 0), credit member.wallet_credit_cents"

  - entity: Order
    initial_state: CART
    terminal_states: [FULFILLED, RETURNED, CANCELLED]
    transitions:
      - from: CART
        to: PLACED
        trigger: "POST /orders/{id}/place"
        actor: Member
        preconditions:
          - "order.status == CART"
          - "order has >= 1 line"
          - "for every line, Product.stock_on_hand >= line.qty"
          - "acting member owns the order"
        side_effects:
          - "for each line: Product.stock_on_hand -= qty and Product.stock_reserved += qty"
          - "compute provisional_discount_cents and provisional_total_cents via order_pricing (provisional variant)"
          - "set placed_at = current logical clock"
      - from: PLACED
        to: FULFILLED
        trigger: "POST /orders/{id}/fulfill"
        actor: Staff
        preconditions:
          - "order.status == PLACED"
        side_effects:
          - "for each line: Product.stock_reserved -= qty (units leave inventory)"
          - "compute final_discount_cents and final_total_cents via order_pricing (final variant) using the member's loyalty_tier and subscription state at this instant"
          - "set fulfilled_at = current logical clock"
          - "add floor(final_total_cents / POINTS_PER_CENT_DIVISOR) to member.loyalty_points"
          - "recompute member.loyalty_tier from the new loyalty_points"
          - "cascade: if loyalty_tier changed, recompute provisional_discount_cents/provisional_total_cents on every other PLACED order of the member"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Member
        preconditions:
          - "order.status == PLACED"
          - "acting member owns the order"
        side_effects:
          - "for each line: Product.stock_reserved -= qty and Product.stock_on_hand += qty (release reservation)"
      - from: CART
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Member
        preconditions:
          - "order.status == CART"
          - "acting member owns the order"
        side_effects:
          - "no inventory to release (nothing reserved while in CART)"
      - from: FULFILLED
        to: RETURNED
        trigger: "POST /orders/{id}/return"
        actor: Member
        preconditions:
          - "order.status == FULFILLED"
          - "current clock <= fulfilled_at + RETURN_WINDOW_DAYS"
          - "acting member owns the order"
        side_effects:
          - "compute refund_cents = final_total_cents - round_half_up(final_total_cents * RESTOCK_FEE_PCT)"
          - "credit refund_cents to member.wallet_credit_cents"
          - "for each line: Product.stock_on_hand += qty (returned units restocked)"

  - entity: ShoePair
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: REORDER_DUE
        trigger: "system: run-log append pushes total_mileage_km >= reminder_threshold_km"
        actor: system
        preconditions:
          - "shoe_pair.status == ACTIVE"
          - "new total_mileage_km >= reminder_threshold_km"
        side_effects:
          - "set status = REORDER_DUE (mileage reminder fires)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: subscription-create-stale-member
    parent_entity: Member
    write_endpoint: "POST /members/{id}/subscription"
    occ_field: "expected_member_version"
    description: |
      Creating a Subscription for a Member whose version has advanced since the client
      last observed it is rejected. A new subscription legitimately supersedes any prior
      subscription of that member (cancelling the prior one), so a second create off a
      stale member view is a real supersede race rather than a state precondition. The
      loser presents an expected_member_version that no longer matches Member.version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_pricing
    trigger: "on POST /orders/{id}/place (provisional variant) and on POST /orders/{id}/fulfill (final variant)"
    algorithm: tiered_pricing
    formula: |
      # Per-line rounding is pinned: round EACH line's discount to whole cents,
      # THEN sum. (round-per-line-then-sum, NOT sum-then-round.)
      eff_gear_pct = min(
        (subscription.gear_discount_pct if member has a subscription with status == ACTIVE else 0.0)
          + LOYALTY_DISCOUNT_PCT[member.loyalty_tier],
        ORDER_MAX_DISCOUNT_PCT)
      subtotal_cents = sum(line.line_gross_cents for line in order.lines)     # line_gross_cents = unit_price_cents * qty
      discount_cents = sum( round_half_up(line.line_gross_cents * eff_gear_pct) for line in order.lines )
      total_cents = subtotal_cents - discount_cents
    input_set: "All lines currently on the order. Member subscription status and loyalty_tier are read at the instant the variant runs."
    constants:
      ORDER_MAX_DISCOUNT_PCT: 0.35
      LOYALTY_DISCOUNT_PCT: { BRONZE: 0.00, SILVER: 0.05, GOLD: 0.10, PLATINUM: 0.15 }
      TIER_GEAR_DISCOUNT_PCT: { CLUB_BASIC: 0.10, CLUB_PRO: 0.20 }
    precision: "whole cents, round_half_up applied per line item before summing"
    variants:
      - name: provisional
        when: "at PLACE time; also re-run as a cascade when the member's loyalty_tier changes while the order is PLACED"
        difference: "reads member.loyalty_tier and subscription.status as of PLACE time (or the cascade instant); writes provisional_discount_cents / provisional_total_cents"
      - name: final
        when: "at FULFILL time"
        difference: "reads member.loyalty_tier and subscription.status as of FULFILL time (which may differ from PLACE, e.g., subscription lapsed to PAST_DUE or tier upgraded); writes final_discount_cents / final_total_cents. Same lines can yield final_total_cents != provisional_total_cents."

  - name: loyalty_standing
    trigger: "on GET /members/{id}/loyalty; earned component also written as a side effect of Order fulfillment"
    algorithm: aggregation
    formula: |
      earned_points   = floor( sum(order.final_total_cents for order in member.orders if order.status == FULFILLED)
                               / POINTS_PER_CENT_DIVISOR )
      projected_points = floor( ( sum(order.final_total_cents for order if status == FULFILLED)
                                  + sum(order.provisional_total_cents for order if status == PLACED) )
                               / POINTS_PER_CENT_DIVISOR )
      current_tier   = tier_from_points(earned_points)
      projected_tier = tier_from_points(projected_points)
      # tier_from_points: PLATINUM if p >= 3000; GOLD if p >= 1500; SILVER if p >= 500; else BRONZE
    input_set: "FULFILLED orders feed earned_points; FULFILLED plus PLACED orders feed projected_points. CART/RETURNED/CANCELLED orders excluded."
    constants:
      POINTS_PER_CENT_DIVISOR: 100
      LOYALTY_TIER_THRESHOLDS: { SILVER: 500, GOLD: 1500, PLATINUM: 3000 }
    precision: "integer points, floor"
    variants:
      - name: earned
        when: "reflects only realized (FULFILLED) spend"
        difference: "excludes PLACED orders; drives the persisted member.loyalty_tier used by order_pricing and fitting_fee"
      - name: projected
        when: "what-if standing including open PLACED orders"
        difference: "adds provisional_total_cents of PLACED orders; projected_tier can exceed current_tier"

  - name: fitting_fee
    trigger: "on POST /fitting-appointments/{id}/complete"
    algorithm: threshold
    formula: |
      base = FITTING_BASE_CENTS[appointment.service_type]                      # tiered selection by service_type
      sub = the member's subscription
      if sub is not null and sub.status == ACTIVE and sub.fittings_used_this_period < sub.included_fittings_per_month:
          fee = 0                                                              # included/fee-free branch
          included = true                                                      # consume one included fitting on completion
      elif sub is not null and sub.status == ACTIVE:
          disc = min(TIER_TRAINING_DISCOUNT_PCT[sub.tier] + LOYALTY_DISCOUNT_PCT[member.loyalty_tier],
                     FITTING_MAX_DISCOUNT_PCT)                                  # nested min over >= 3 inputs
          fee = round_half_up(base * (1 - disc))
          included = false
      else:
          fee = base                                                          # no active subscription: full price
          included = false
    input_set: "service_type base price, subscription status/tier/included-allowance counter, member.loyalty_tier."
    constants:
      FITTING_BASE_CENTS: { GAIT_ANALYSIS: 6000, SHOE_FITTING: 3000, FOLLOWUP: 2000 }
      TIER_TRAINING_DISCOUNT_PCT: { CLUB_BASIC: 0.10, CLUB_PRO: 0.20 }
      LOYALTY_DISCOUNT_PCT: { BRONZE: 0.00, SILVER: 0.05, GOLD: 0.10, PLATINUM: 0.15 }
      FITTING_MAX_DISCOUNT_PCT: 0.30
    precision: "whole cents, round_half_up"

  - name: shoe_mileage_rollup
    trigger: "on POST /shoe-pairs/{id}/run-logs"
    algorithm: aggregation
    formula: |
      total_mileage_km = sum(entry.distance_km for entry in shoe_pair.run_logs)   # includes the just-appended entry
      if shoe_pair.status == ACTIVE and total_mileage_km >= reminder_threshold_km:
          shoe_pair.status = REORDER_DUE
    input_set: "All run_logs entries on the shoe pair, including the newest append."
    constants: {}
    precision: "1 decimal place on km, round_half_up; threshold comparison uses >= (exactly reaching the threshold triggers)"

  - name: race_packet_accounting
    trigger: "on registration create, allocate, and cancel"
    algorithm: aggregation
    formula: |
      active_registrations = count(reg for reg in event.registrations if reg.packet_status in {RESERVED, ALLOCATED})
      packets_allocated    = count(reg for reg in event.registrations if reg.packet_status == ALLOCATED)
      # Registration is admitted only while active_registrations < packet_capacity.
    input_set: "All RaceRegistration rows of the event; RELEASED rows excluded from active_registrations."
    constants: {}
    precision: "integer counts"

  - name: session_waitlist_promotion
    trigger: "on POST /session-enrollments/{id}/cancel of an ENROLLED enrollment (frees a spot)"
    algorithm: waterfall_allocation
    formula: |
      if freed a spot and any WAITLISTED enrollment exists for the session:
          promote the WAITLISTED enrollment with the earliest created_at (tie-break: none needed;
          created_at is unique per row) to ENROLLED and increment enrolled_count.
    input_set: "WAITLISTED SessionEnrollment rows of the session, ordered by created_at ASC."
    constants: {}
    precision: "n/a; ordering key is created_at ASC (never id)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /members and POST /_clock/set_current_utc"
  - priority: 2
    category: auth
    check: "acting role is permitted for the operation per §1.7 RBAC; for entity_backed ownership actions, X-User-ID matches the owning FK on the target resource"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all mutating endpoints"
  - priority: 3
    category: business_constraint
    check: "request body well-formed: required fields present; enum values legal; numeric amounts/qty >= their declared minimum; end_at strictly after start_at; expected_member_version present on subscription create"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST endpoints with a request body"
  - priority: 4
    category: existence
    check: "every id referenced in the path and in FK body fields resolves to an existing resource, validated left-to-right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND (per resource: MEMBER, STORE, STAFF, PRODUCT, SUBSCRIPTION, APPOINTMENT, SESSION, ENROLLMENT, EVENT, REGISTRATION, ORDER, SHOE_PAIR)"
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"
  - priority: 5
    category: state
    check: "OCC guard: expected_member_version equals the current Member.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /members/{id}/subscription"
  - priority: 5
    category: state
    check: "target resource is in a state from which the requested transition is defined (else generic invalid-state)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition action endpoints"
  - priority: 6
    category: state
    check: "cross-entity state: enrollment create requires parent TrainingSession.status == SCHEDULED"
    error_id: ERR_SESSION_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /training-sessions/{id}/enrollments"
  - priority: 6
    category: state
    check: "cross-entity state: race registration create and packet allocate require parent RaceEvent.status == OPEN"
    error_id: ERR_EVENT_CLOSED
    http_status: 409
    applies_to: "POST /race-events/{id}/registrations, POST /race-registrations/{id}/allocate"
  - priority: 6
    category: state
    check: "packet allocate requires the registration's payment_status == PAID"
    error_id: ERR_REGISTRATION_NOT_PAID
    http_status: 409
    applies_to: "POST /race-registrations/{id}/allocate"
  - priority: 7
    category: business_temporal
    check: "appointment start_at is at or after the current logical clock (no past-dated bookings)"
    error_id: ERR_APPOINTMENT_IN_PAST
    http_status: 422
    applies_to: "POST /fitting-appointments"
  - priority: 7
    category: business_temporal
    check: "order return requested no later than fulfilled_at + RETURN_WINDOW_DAYS"
    error_id: ERR_RETURN_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /orders/{id}/return"
  - priority: 8
    category: business_safety
    check: "fitter has no other SCHEDULED appointment whose window is within FITTING_BUFFER_MINUTES of the requested window (pairwise buffer: reject if requested.start_at < other.end_at + buffer AND other.start_at < requested.end_at + buffer)"
    error_id: ERR_FITTER_UNAVAILABLE
    http_status: 409
    applies_to: "POST /fitting-appointments"
  - priority: 8
    category: business_safety
    check: "coach has no other SCHEDULED session whose half-open window [start_at, end_at) overlaps the requested one (no buffer; back-to-back allowed)"
    error_id: ERR_COACH_UNAVAILABLE
    http_status: 409
    applies_to: "POST /training-sessions"
  - priority: 8
    category: business_constraint
    check: "at the store, the number of SCHEDULED sessions whose half-open windows overlap the requested window is < store.session_room_count (aggregate room capacity; no buffer)"
    error_id: ERR_SESSION_ROOM_CONFLICT
    http_status: 409
    applies_to: "POST /training-sessions"
  - priority: 8
    category: business_constraint
    check: "member has no existing non-RELEASED registration for this event (uniqueness)"
    error_id: ERR_ALREADY_REGISTERED
    http_status: 409
    applies_to: "POST /race-events/{id}/registrations"
  - priority: 8
    category: business_constraint
    check: "for every order line, Product.stock_on_hand >= line.qty at PLACE time"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /orders/{id}/place"
  - priority: 8
    category: business_constraint
    check: "shoe pair create requires the referenced Product.category == SHOE"
    error_id: ERR_PRODUCT_NOT_SHOE
    http_status: 422
    applies_to: "POST /shoe-pairs"
  - priority: 9
    category: business_fiscal
    check: "event registration admitted only while active_registrations < packet_capacity (packet pool not exhausted)"
    error_id: ERR_EVENT_FULL
    http_status: 409
    applies_to: "POST /race-events/{id}/registrations"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Logical clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [StoreManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock advanced to to_iso8601"]

  # ---- Stores ----
  - method: POST
    path: "/stores"
    description: "Create a store."
    roles: [StoreManager]
    code: 201
    input: [name, region_code, "session_room_count?"]
    output: Store
    side_effects: []
  - method: GET
    path: "/stores/{id}"
    description: "Fetch one store."
    roles: [Member, Staff, StoreManager]
    code: 200
    input: []
    output: Store
    side_effects: []
  - method: GET
    path: "/stores/{id}/staff"
    description: "List staff assigned to a store (reverse lookup for StaffMember.store_id)."
    roles: [Staff, StoreManager]
    code: 200
    input: ["limit?", "offset?"]
    output: StaffMember[]
    side_effects: []

  # ---- Staff ----
  - method: POST
    path: "/staff"
    description: "Create a fitter/coach."
    roles: [StoreManager]
    code: 201
    input: [store_id, full_name, role_type, "active?"]
    output: StaffMember
    side_effects: []

  # ---- Members ----
  - method: POST
    path: "/members"
    description: "Register a new member (open registration)."
    roles: [Anonymous]
    code: 201
    input: [email, full_name]
    output: Member
    side_effects: ["member created with loyalty_points 0, loyalty_tier BRONZE, wallet_credit_cents 0, version 1"]
  - method: GET
    path: "/members/{id}"
    description: "Fetch one member."
    roles: [Member, Staff, StoreManager]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: GET
    path: "/members/{id}/loyalty"
    description: "Computed loyalty standing: earned vs projected points and tiers (loyalty_standing calculation)."
    roles: [Member, StoreManager]
    code: 200
    input: []
    output: "{ earned_points: integer, current_tier: string, projected_points: integer, projected_tier: string }"
    side_effects: []
  - method: GET
    path: "/members/{id}/subscriptions"
    description: "List a member's subscriptions (reverse lookup for Subscription.member_id)."
    roles: [Member, StoreManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: POST
    path: "/members/{id}/subscription"
    description: "Create a subscription for the member, superseding any prior non-CANCELLED subscription. OCC-guarded on Member.version."
    roles: [Member]
    code: 201
    input: [tier, expected_member_version]
    output: Subscription
    side_effects:
      - "new Subscription created in PENDING with monthly_fee_cents and included_fittings_per_month derived from tier"
      - "any prior non-CANCELLED subscription of the member transitions to CANCELLED (superseded)"
      - "increments Member.version by 1"

  # ---- Subscriptions ----
  - method: GET
    path: "/subscriptions/{id}"
    description: "Fetch one subscription."
    roles: [Member, StoreManager]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: POST
    path: "/subscriptions/{id}/activate"
    description: "Activate a PENDING subscription (payment assumed captured)."
    roles: [Member]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status PENDING -> ACTIVE; started_at and current_period_end set; fittings_used_this_period reset to 0"]
  - method: POST
    path: "/subscriptions/{id}/renew"
    description: "Attempt a renewal charge. payment_outcome SUCCEEDED keeps/returns ACTIVE; FAILED moves ACTIVE -> PAST_DUE."
    roles: [StoreManager]
    code: 200
    input: [payment_outcome]
    output: Subscription
    side_effects: ["ACTIVE -> PAST_DUE on FAILED; PAST_DUE -> ACTIVE on SUCCEEDED (period advanced, fittings_used_this_period reset)"]
  - method: POST
    path: "/subscriptions/{id}/cancel"
    description: "Cancel a subscription."
    roles: [Member]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status -> CANCELLED"]

  # ---- Products ----
  - method: POST
    path: "/products"
    description: "Create a catalog product."
    roles: [StoreManager]
    code: 201
    input: [sku, category, name, price_cents, "stock_on_hand?", "max_mileage_km?"]
    output: Product
    side_effects: ["stock_reserved initialized to 0"]
  - method: GET
    path: "/products/{id}"
    description: "Fetch one product."
    roles: [Member, Staff, StoreManager]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: POST
    path: "/products/{id}/inventory-adjustments"
    description: "Adjust on-hand stock by a signed delta (operator restock/shrinkage)."
    roles: [StoreManager]
    code: 200
    input: [delta]
    output: Product
    side_effects: ["stock_on_hand += delta (must not drop below 0)"]

  # ---- Fitting appointments ----
  - method: POST
    path: "/fitting-appointments"
    description: "Book a gait-analysis/fitting appointment with a fitter."
    roles: [Member]
    code: 201
    input: [member_id, fitter_id, service_type, start_at, end_at]
    output: FittingAppointment
    side_effects: ["status SCHEDULED; fitter time window reserved with FITTING_BUFFER_MINUTES buffer"]
  - method: GET
    path: "/fitting-appointments/{id}"
    description: "Fetch one appointment."
    roles: [Member, Staff, StoreManager]
    code: 200
    input: []
    output: FittingAppointment
    side_effects: []
  - method: GET
    path: "/fitting-appointments"
    description: "List appointments (reverse lookup for member_id and fitter_id)."
    roles: [Member, Staff, StoreManager]
    code: 200
    input: ["member_id?", "fitter_id?", "limit?", "offset?"]
    output: FittingAppointment[]
    side_effects: []
  - method: POST
    path: "/fitting-appointments/{id}/complete"
    description: "Complete an appointment; capture gait_result and charge fee_cents via fitting_fee."
    roles: [Staff]
    code: 200
    input: [gait_result]
    output: FittingAppointment
    side_effects: ["status -> COMPLETED; fee_cents computed; included-fitting allowance consumed if applicable"]
  - method: POST
    path: "/fitting-appointments/{id}/cancel"
    description: "Cancel a scheduled appointment."
    roles: [Member]
    code: 200
    input: []
    output: FittingAppointment
    side_effects: ["status -> CANCELLED; fitter window freed"]

  # ---- Training sessions ----
  - method: POST
    path: "/training-sessions"
    description: "Schedule a group training session at a store with a coach."
    roles: [StoreManager]
    code: 201
    input: [coach_id, store_id, level, start_at, end_at, capacity]
    output: TrainingSession
    side_effects: ["status SCHEDULED; enrolled_count 0"]
  - method: GET
    path: "/training-sessions/{id}"
    description: "Fetch one session."
    roles: [Member, Staff, StoreManager]
    code: 200
    input: []
    output: TrainingSession
    side_effects: []
  - method: GET
    path: "/training-sessions"
    description: "List sessions (reverse lookup for coach_id and store_id)."
    roles: [Member, Staff, StoreManager]
    code: 200
    input: ["coach_id?", "store_id?", "limit?", "offset?"]
    output: TrainingSession[]
    side_effects: []
  - method: POST
    path: "/training-sessions/{id}/cancel"
    description: "Cancel a session; cascades to its enrollments."
    roles: [Staff, StoreManager]
    code: 200
    input: []
    output: TrainingSession
    side_effects: ["status -> CANCELLED; all ENROLLED/WAITLISTED enrollments -> CANCELLED; enrolled_count -> 0"]
  - method: POST
    path: "/training-sessions/{id}/enrollments"
    description: "Enroll the member into a session; ENROLLED if capacity available, else WAITLISTED."
    roles: [Member]
    code: 201
    input: [member_id]
    output: SessionEnrollment
    side_effects: ["enrolled_count incremented when ENROLLED"]

  # ---- Session enrollments ----
  - method: GET
    path: "/session-enrollments/{id}"
    description: "Fetch one enrollment."
    roles: [Member, Staff, StoreManager]
    code: 200
    input: []
    output: SessionEnrollment
    side_effects: []
  - method: GET
    path: "/session-enrollments"
    description: "List enrollments (reverse lookup for session_id and member_id)."
    roles: [Member, Staff, StoreManager]
    code: 200
    input: ["session_id?", "member_id?", "limit?", "offset?"]
    output: SessionEnrollment[]
    side_effects: []
  - method: POST
    path: "/session-enrollments/{id}/cancel"
    description: "Cancel an enrollment; ENROLLED cancel frees a spot and promotes the earliest WAITLISTED enrollment."
    roles: [Member]
    code: 200
    input: []
    output: SessionEnrollment
    side_effects: ["status -> CANCELLED; on ENROLLED cancel: enrolled_count decremented then waitlist promotion re-increments it"]

  # ---- Race events ----
  - method: POST
    path: "/race-events"
    description: "Create a race event with a finite packet pool."
    roles: [StoreManager]
    code: 201
    input: [name, event_date, packet_capacity, entry_fee_cents]
    output: RaceEvent
    side_effects: ["status OPEN; packets_allocated 0; active_registrations 0"]
  - method: GET
    path: "/race-events/{id}"
    description: "Fetch one event."
    roles: [Member, Staff, StoreManager]
    code: 200
    input: []
    output: RaceEvent
    side_effects: []
  - method: POST
    path: "/race-events/{id}/close"
    description: "Close registration for an event."
    roles: [StoreManager]
    code: 200
    input: []
    output: RaceEvent
    side_effects: ["status OPEN -> CLOSED"]
  - method: POST
    path: "/race-events/{id}/registrations"
    description: "Register the member for the event, reserving a packet."
    roles: [Member]
    code: 201
    input: [member_id]
    output: RaceRegistration
    side_effects: ["RaceRegistration created UNPAID/RESERVED; entry_fee_cents snapshotted; event.active_registrations incremented"]

  # ---- Race registrations ----
  - method: GET
    path: "/race-registrations/{id}"
    description: "Fetch one registration."
    roles: [Member, Staff, StoreManager]
    code: 200
    input: []
    output: RaceRegistration
    side_effects: []
  - method: GET
    path: "/race-registrations"
    description: "List registrations (reverse lookup for event_id and member_id)."
    roles: [Member, Staff, StoreManager]
    code: 200
    input: ["event_id?", "member_id?", "limit?", "offset?"]
    output: RaceRegistration[]
    side_effects: []
  - method: POST
    path: "/race-registrations/{id}/pay"
    description: "Pay the entry fee (payment dimension UNPAID -> PAID)."
    roles: [Member]
    code: 200
    input: []
    output: RaceRegistration
    side_effects: ["payment_status -> PAID; amount_paid_cents = entry_fee_cents"]
  - method: POST
    path: "/race-registrations/{id}/allocate"
    description: "Hand out the reserved packet (packet dimension RESERVED -> ALLOCATED); requires PAID and event OPEN."
    roles: [Staff]
    code: 200
    input: []
    output: RaceRegistration
    side_effects: ["packet_status -> ALLOCATED; event.packets_allocated incremented"]
  - method: POST
    path: "/race-registrations/{id}/cancel"
    description: "Cancel a registration; releases the packet and refunds a PAID registration net of RACE_CANCELLATION_FEE_CENTS to wallet."
    roles: [Member]
    code: 200
    input: []
    output: RaceRegistration
    side_effects: ["packet_status -> RELEASED; event counters decremented; if PAID: payment_status -> REFUNDED, refund_cents credited to member.wallet_credit_cents"]

  # ---- Orders ----
  - method: POST
    path: "/orders"
    description: "Open a new cart order for the member."
    roles: [Member]
    code: 201
    input: [member_id]
    output: Order
    side_effects: ["status CART; empty lines"]
  - method: GET
    path: "/orders/{id}"
    description: "Fetch one order."
    roles: [Member, StoreManager]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/orders"
    description: "List orders (reverse lookup for member_id)."
    roles: [Member, StoreManager]
    code: 200
    input: ["member_id?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: "/orders/{id}/lines"
    description: "Append a line item to a CART order; unit price snapshotted from the product."
    roles: [Member]
    code: 201
    input: [product_id, qty]
    output: Order
    side_effects: ["line appended with unit_price_cents and line_gross_cents; subtotal_cents recomputed"]
  - method: POST
    path: "/orders/{id}/place"
    description: "Place the order: reserve inventory and compute provisional pricing."
    roles: [Member]
    code: 200
    input: []
    output: Order
    side_effects: ["status CART -> PLACED; stock reserved; provisional_discount_cents/provisional_total_cents set; placed_at stamped"]
  - method: POST
    path: "/orders/{id}/fulfill"
    description: "Fulfill the order: finalize pricing, award loyalty points, cascade tier recompute."
    roles: [Staff]
    code: 200
    input: []
    output: Order
    side_effects: ["status PLACED -> FULFILLED; final pricing; loyalty_points/tier updated; cascade recompute of other PLACED orders' provisional pricing; fulfilled_at stamped"]
  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel a CART or PLACED order; releases any reserved inventory."
    roles: [Member]
    code: 200
    input: []
    output: Order
    side_effects: ["status -> CANCELLED; reserved stock released back to on-hand"]
  - method: POST
    path: "/orders/{id}/return"
    description: "Return a FULFILLED order within the return window; refund to wallet net of restocking fee and restock units."
    roles: [Member]
    code: 200
    input: ["reason?"]
    output: Order
    side_effects: ["status FULFILLED -> RETURNED; refund_cents credited to wallet; units restocked to on-hand"]

  # ---- Shoe pairs ----
  - method: POST
    path: "/shoe-pairs"
    description: "Register a purchased shoe pair for mileage tracking; product must be category SHOE."
    roles: [Member]
    code: 201
    input: [member_id, product_id]
    output: ShoePair
    side_effects: ["reminder_threshold_km copied from product.max_mileage_km; status ACTIVE; total_mileage_km 0"]
  - method: GET
    path: "/shoe-pairs/{id}"
    description: "Fetch one shoe pair."
    roles: [Member, StoreManager]
    code: 200
    input: []
    output: ShoePair
    side_effects: []
  - method: GET
    path: "/shoe-pairs"
    description: "List shoe pairs (reverse lookup for member_id and product_id)."
    roles: [Member, StoreManager]
    code: 200
    input: ["member_id?", "product_id?", "limit?", "offset?"]
    output: ShoePair[]
    side_effects: []
  - method: POST
    path: "/shoe-pairs/{id}/run-logs"
    description: "Append a run log; rolls up total_mileage_km and fires REORDER_DUE at the threshold."
    roles: [Member]
    code: 201
    input: [distance_km, "logged_at?"]
    output: ShoePair
    side_effects: ["run entry appended; total_mileage_km recomputed; status -> REORDER_DUE when total_mileage_km >= reminder_threshold_km"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID on an endpoint that requires authentication."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Authenticated role is not permitted for the operation, or an entity_backed owner acts on a resource they do not own."
  - id: ERR_VALIDATION
    http: 400
    condition: "Malformed request: missing required field, illegal enum value, non-positive qty/amount, end_at not strictly after start_at, or missing expected_member_version."
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "Referenced member id does not exist."
  - id: ERR_STORE_NOT_FOUND
    http: 404
    condition: "Referenced store id does not exist."
  - id: ERR_STAFF_NOT_FOUND
    http: 404
    condition: "Referenced staff (fitter/coach) id does not exist."
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "Referenced product id does not exist."
  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "Referenced subscription id does not exist."
  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "Referenced fitting appointment id does not exist."
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "Referenced training session id does not exist."
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "Referenced session enrollment id does not exist."
  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "Referenced race event id does not exist."
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "Referenced race registration id does not exist."
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "Referenced order id does not exist."
  - id: ERR_SHOE_PAIR_NOT_FOUND
    http: 404
    condition: "Referenced shoe pair id does not exist."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_member_version does not match the current Member.version on subscription create (OCC)."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the target resource's current state (e.g., activating a non-PENDING subscription, fulfilling a non-PLACED order, returning a non-FULFILLED order, cancelling a terminal resource)."
  - id: ERR_SESSION_NOT_SCHEDULED
    http: 409
    condition: "Enrollment create against a session whose status is not SCHEDULED."
  - id: ERR_EVENT_CLOSED
    http: 409
    condition: "Register or allocate against a race event whose status is not OPEN."
  - id: ERR_REGISTRATION_NOT_PAID
    http: 409
    condition: "Packet allocate on a registration whose payment_status is not PAID."
  - id: ERR_APPOINTMENT_IN_PAST
    http: 422
    condition: "Fitting appointment start_at is before the current logical clock."
  - id: ERR_RETURN_WINDOW_EXPIRED
    http: 422
    condition: "Order return requested after fulfilled_at + RETURN_WINDOW_DAYS."
  - id: ERR_FITTER_UNAVAILABLE
    http: 409
    condition: "Requested appointment window is within FITTING_BUFFER_MINUTES of another SCHEDULED appointment on the same fitter."
  - id: ERR_COACH_UNAVAILABLE
    http: 409
    condition: "Requested session window overlaps another SCHEDULED session led by the same coach."
  - id: ERR_SESSION_ROOM_CONFLICT
    http: 409
    condition: "Number of SCHEDULED sessions overlapping the requested window at the store would meet or exceed session_room_count."
  - id: ERR_ALREADY_REGISTERED
    http: 409
    condition: "Member already holds a non-RELEASED registration for the event."
  - id: ERR_INSUFFICIENT_STOCK
    http: 409
    condition: "A line's Product.stock_on_hand is less than the line qty at PLACE time."
  - id: ERR_PRODUCT_NOT_SHOE
    http: 422
    condition: "Shoe pair create references a product whose category is not SHOE."
  - id: ERR_EVENT_FULL
    http: 409
    condition: "Race event registration attempted when active_registrations already equals packet_capacity."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only self-register and set the clock is NOT permitted (StoreManager only)."
    identity: opaque
    exclusive_operations:
      - "POST /members (self-registration)"
    shared_operations: []
  - name: Member
    description: "A registered customer acting on their own subscriptions, appointments, enrollments, registrations, orders, and shoe pairs."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /members/{id}/subscription"
      - "POST /subscriptions/{id}/activate"
      - "POST /subscriptions/{id}/cancel"
      - "POST /fitting-appointments"
      - "POST /fitting-appointments/{id}/cancel"
      - "POST /training-sessions/{id}/enrollments"
      - "POST /session-enrollments/{id}/cancel"
      - "POST /race-events/{id}/registrations"
      - "POST /race-registrations/{id}/pay"
      - "POST /race-registrations/{id}/cancel"
      - "POST /orders"
      - "POST /orders/{id}/lines"
      - "POST /orders/{id}/place"
      - "POST /orders/{id}/cancel"
      - "POST /orders/{id}/return"
      - "POST /shoe-pairs"
      - "POST /shoe-pairs/{id}/run-logs"
    shared_operations:
      - "GET reads of resources the member owns and public catalog (stores, products, events, sessions)"
  - name: Staff
    description: "A fitter/coach operating appointments, sessions, packet allocation, and order fulfillment."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /fitting-appointments/{id}/complete"
      - "POST /training-sessions/{id}/cancel"
      - "POST /race-registrations/{id}/allocate"
      - "POST /orders/{id}/fulfill"
    shared_operations:
      - "GET reads of appointments, sessions, enrollments, registrations, staff rosters"
  - name: StoreManager
    description: "Back-office operator managing stores, staff, products, inventory, events, sessions, subscription renewals, and the clock."
    identity: opaque
    exclusive_operations:
      - "POST /stores"
      - "POST /staff"
      - "POST /products"
      - "POST /products/{id}/inventory-adjustments"
      - "POST /training-sessions"
      - "POST /race-events"
      - "POST /race-events/{id}/close"
      - "POST /subscriptions/{id}/renew"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across all collections"
      - "POST /training-sessions/{id}/cancel (shared with Staff)"

