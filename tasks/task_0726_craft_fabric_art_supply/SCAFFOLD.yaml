# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "role not permitted for this operation" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "malformed body, missing required field, or type mismatch" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Product id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Order id does not exist" }
  - { id: ERR_WORKSHOP_NOT_FOUND, http: 404, condition: "Workshop id does not exist" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "WorkshopSession id does not exist" }
  - { id: ERR_REGISTRATION_NOT_FOUND, http: 404, condition: "WorkshopRegistration id does not exist" }
  - { id: ERR_FRAMING_NOT_FOUND, http: 404, condition: "FramingOrder id does not exist" }
  - { id: ERR_SPECIAL_ORDER_NOT_FOUND, http: 404, condition: "SpecialOrder id does not exist" }
  - { id: ERR_REFERENCED_ENTITY_NOT_FOUND, http: 404, condition: "body FK reference does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_order_version does not match current Order.version (OCC)" }
  - { id: ERR_EMPTY_ORDER, http: 409, condition: "submit attempted on an order with no lines" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 409, condition: "available_yards less than requested_yards at submit" }
  - { id: ERR_ORDER_NOT_PAID, http: 409, condition: "ready/pickup attempted while payment_status != PAID" }
  - { id: ERR_CUT_NOT_RECORDED, http: 409, condition: "ready attempted while a BY_YARD line has no actual_cut_yards" }
  - { id: ERR_INSUFFICIENT_POINTS, http: 409, condition: "points_redeemed_on_order exceeds loyalty points_balance" }
  - { id: ERR_INVALID_CUT_INCREMENT, http: 422, condition: "BY_YARD requested_yards not a positive multiple of min_cut_increment_yards" }
  - { id: ERR_ROOM_CONFLICT, http: 409, condition: "session collides with another in same room within cleanup buffer" }
  - { id: ERR_CUSTOMER_SESSION_OVERLAP, http: 409, condition: "customer already registered in a time-overlapping session" }
  - { id: ERR_REGISTRATION_CLOSED, http: 422, condition: "registration attempted when workshop not OPEN or clock now >= session.starts_at" }
  - { id: ERR_COUPON_EXPIRED, http: 422, condition: "clock now outside coupon [valid_from, valid_to)" }
  - { id: ERR_COUPON_NOT_STACKABLE, http: 422, condition: "applying multiple coupons where not all are stackable" }
  - { id: ERR_COUPON_MIN_NOT_MET, http: 422, condition: "coupon min_basket_cents not met by current subtotal" }
  - { id: ERR_LINKED_ORDER_NOT_READY, http: 409, condition: "framing approve while linked order not SUBMITTED/READY_FOR_PICKUP" }
  - { id: ERR_NO_SESSIONS, http: 409, condition: "open attempted on workshop with no sessions" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "Shopper: builds orders, pays, registers for workshops, requests special orders and framing"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /orders/{id}/pay — pay own order"
    shared_operations:
      - "POST /orders — create order"
      - "POST /orders/{id}/lines — add line"
      - "POST /orders/{id}/coupons — apply coupon"
      - "POST /orders/{id}/submit — submit"
      - "POST /orders/{id}/cancel — cancel"
      - "POST /workshops/{id}/register — register"
      - "POST /workshop-registrations/{id}/cancel — cancel registration"
      - "POST /framing-orders — create framing"
      - "POST /framing-orders/{id}/approve — approve framing"
      - "POST /project-bundles — create bundle"
      - "POST /special-orders — request special order"
      - "POST /special-orders/{id}/confirm — confirm special order"
      - "GET endpoints"

  - name: StoreAssociate
    description: "Front-line staff: cutting counter, fulfillment, BOPIS pickup"
    identity: "opaque"
    exclusive_operations:
      - "PATCH /order-lines/{id}/record-cut — record actual cut"
      - "POST /orders/{id}/ready — mark ready"
      - "POST /orders/{id}/pickup — complete pickup"
      - "POST /special-orders/{id}/receive — receive special order"
    shared_operations:
      - "POST /customers — register customer"
      - "POST /orders, /orders/{id}/lines, /orders/{id}/coupons, /orders/{id}/submit, /orders/{id}/cancel"
      - "POST /workshops/{id}/register, /workshop-registrations/{id}/cancel"
      - "POST /project-bundles, /special-orders"
      - "GET endpoints"

  - name: StoreManager
    description: "Manager: catalog, inventory, coupons, workshop lifecycle, special-order quoting"
    identity: "opaque"
    exclusive_operations:
      - "POST /products, /products/{id}/inventory-lots"
      - "POST /coupons"
      - "POST /rooms"
      - "POST /workshops, /workshops/{id}/sessions"
      - "POST /workshops/{id}/open, /close, /cancel"
      - "POST /special-orders/{id}/quote"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints"

  - name: FramingSpecialist
    description: "Custom-framing staff: production workflow"
    identity: "opaque"
    exclusive_operations:
      - "POST /framing-orders/{id}/start — begin production"
      - "POST /framing-orders/{id}/complete — mark ready"
    shared_operations:
      - "POST /framing-orders — create framing"
      - "POST /framing-orders/{id}/cancel"
      - "GET framing endpoints"
