      - name: dispute_filing_holds_the_scheduled_statement_but_not_the_submission
        claim_type: cross_entity
        grounds:
          - state_machines.SettlementStatement.transitions.SCHEDULED_to_HELD
          - state_machines.SubmissionLot.transitions.LOT_REJECTED_to_DISPUTED
          - entities.Retailer.fields.unpaid_balance_cents
        distinguishing_aspect: |
          Filing a dispute on one rejected lot freezes the payment without
          unwinding the intake: the statement goes SCHEDULED -> HELD with
          hold_reason DISPUTE_OPEN and the retailer's unpaid_balance_cents drops
          to 0 because the balance counts SCHEDULED statements only, while the
          Submission deliberately stays STATEMENT_ISSUED with hold_reason null —
          the opposite of the invoice-shortfall path, which does move the
          submission.
