            - call: "POST /racks"
              payload: { hall_id: "${hall_id}", containment_zone_id: "${zone1_id}", grid_row: "1", grid_col: 1, design_kw: 12.00, u_height: 45, required_feed_count: 2 }
              as: FacilityPlanner
              captures: { rack1_id: $.data.id }
            - call: "POST /halls/${hall_id}/advance-phase"
