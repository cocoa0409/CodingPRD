      Accepting the third subscription must not only mint a third InvestorAccount but
      re-prorate the two existing accounts. With three equal 60,000,000 units against a
      180,000,000 target the shares are 0.333333 each, which sums to 0.999999, so the
      residue of 0.000001 is pinned on the earliest-created account, giving
      [0.333334, 0.333333, 0.333333] with an exact sum of 1.000000. An implementation
      that only writes the new account leaves the first two at 0.500000; one that
      rounds without a residue rule sums to 0.999999.
