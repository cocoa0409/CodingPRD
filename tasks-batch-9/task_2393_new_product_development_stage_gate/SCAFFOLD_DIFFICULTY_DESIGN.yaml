              payload: { decision: "APPROVE" }
              as: FunctionalReviewer
              as_user_id: "rev-mfg"
            - call: "POST /deliverables/${d_sales_id}/submit"
              payload: { evidence_url: "https://npd.example/ph/sell-in-plan" }
              as: SalesAccountManager
              as_user_id: "sub-sales"
            - call: "POST /deliverables/${d_sales_id}/decide"
              payload: { decision: "APPROVE" }
              as: FunctionalReviewer
              as_user_id: "rev-mfg"
            - call: "POST /innovation-projects/${ph_id}/gate-reviews"
              payload: { gate_id: "${g3h_id}", scheduled_at: "2026-08-20T09:00:00Z" }
              as: GateChair
              as_user_id: "chair-ph"
              captures: { grh3_id: $.data.id }
            - call: "POST /gate-reviews/${grh3_id}/open"
              payload: {}
              as: GateChair
              as_user_id: "chair-ph"
            - call: "POST /gate-reviews/${grh3_id}/votes"
              payload: { function: "OPERATIONS", vote: "APPROVE" }
              as: FunctionalReviewer
              as_user_id: "rev-ops"
            - call: "POST /gate-reviews/${grh3_id}/close"
              payload: {}
              as: GateChair
              as_user_id: "chair-ph"
            - call: "POST /innovation-projects/${ph_id}/sell-in-presentations"
              payload: { retailer_id: "${reth_id}", shelf_reset_window_id: "${winh_id}", scheduled_at: "2026-09-10T15:00:00Z", proposed_sku_count: 4 }
              as: SalesAccountManager
              captures: { presh_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T15:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /sell-in-presentations/${presh_id}/present"
              payload: {}
              as: SalesAccountManager
            - call: "POST /sell-in-presentations/${presh_id}/record-outcome"
              payload: { outcome: "ACCEPTED", accepted_sku_count: 4 }
              as: SalesAccountManager
            - call: "POST /innovation-projects/${ph_id}/launch-lock"
              payload: { launch_date: "2026-10-26T00:00:00Z", shelf_reset_window_id: "${winh_id}" }
              as: GateChair
              as_user_id: "chair-ph"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-26T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /innovation-projects/${ph_id}/launch"
              payload: {}
              as: GateChair
              as_user_id: "chair-ph"
            - call: "POST /innovation-projects/${ph_id}/post-launch-periods"
              payload: { period_index: 1, actual_units: 34000, actual_net_revenue_usd: 190000.00, actual_gross_margin_usd: 62000.00, attainment_basis: "CUMULATIVE" }
              as: PortfolioAdmin
              captures: { per1_id: $.data.id }
          trigger:
            - call: "POST /innovation-projects/${ph_id}/post-launch-periods"
              payload: { period_index: 2, actual_units: 26000, actual_net_revenue_usd: 141000.00, actual_gross_margin_usd: 44000.00, attainment_basis: "TRAILING" }
              as: PortfolioAdmin
              captures: { per2_id: $.data.id }
          assert:
            - "BusinessCase.${bch_id}.annual_units == 153216 and BusinessCase.${bch_id}.status == LOCKED"
            - "PostLaunchPeriod.${per1_id}.plan_units_per_period == 38304.00"
            - "PostLaunchPeriod.${per1_id}.attainment_cumulative_pct == 88.76 and PostLaunchPeriod.${per1_id}.attainment_trailing_pct == 88.76"
            - "PostLaunchPeriod.${per1_id}.attainment_pct == 88.76 and PostLaunchPeriod.${per1_id}.decision == FIX"
            - "PostLaunchPeriod.${per2_id}.attainment_cumulative_pct == 78.32"
            - "PostLaunchPeriod.${per2_id}.attainment_trailing_pct == 67.88"
            - "PostLaunchPeriod.${per2_id}.attainment_pct == 67.88 and PostLaunchPeriod.${per2_id}.decision == DISCONTINUE"
            - "the two stored bases on ${per2_id} straddle FIX_FLOOR_PCT 70.00, so the basis alone flips the decision"
            - "InnovationProject.${ph_id}.dev_status == DISCONTINUED and InnovationProject.${ph_id}.post_launch_decision == DISCONTINUE"

  # ---------------------------------------------------------------- Rule 2 ---
  - rule_id: combinatorial_formula
    instances:
      - name: screening_weight_vector_with_capped_margin_norm
        grounds:
          - calculations.screening_score
          - entities.InnovationProject.fields.project_type
          - state_machines.InnovationProject.dev_status.IDEA_to_SCREENED
        distinguishing_aspect: |
          Mode (a): four inputs interact non-linearly because the weight vector is selected by
          project_type and the margin criterion passes through min(100, gm/40*100) — identical
          inputs (8, 7, 36, 7) yield 78.00 as NEW_BRAND, 79.00 as LINE_EXTENSION and 77.00 as
          RENOVATION, and a 60 percent margin is clamped so the score is 79.00 rather than 91.50.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T00:00:00Z."
            - "A BEVERAGE gate 2 configuration exists so the passing screen branch is reachable."
            - "Four BEVERAGE projects sharing input vectors, differing only in project_type or margin."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "BEVERAGE", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: ["CONSUMER_CONCEPT_TEST", "PRELIM_BUSINESS_CASE", "FINAL_BUSINESS_CASE", "PILOT_SCALE_UP_REPORT", "SHELF_LIFE_REPORT", "REGULATORY_CLEARANCE"], quorum_size: 3, veto_functions: ["FINANCE", "QUALITY"], npv_hurdle_usd: 500000.00, payback_months_max: 24, gross_margin_floor_pct: 45.00, readiness_floor_index: 70.00 }
              as: PortfolioAdmin
            - call: "POST /innovation-projects"
              payload: { name: "Weight Probe NB", brand: "AquaVida", category: "BEVERAGE", project_type: "NEW_BRAND", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 100000.00 }
              as: InnovationLead
              captures: { pr_nb_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Weight Probe LE", brand: "AquaVida", category: "BEVERAGE", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 100000.00 }
              as: InnovationLead
              captures: { pr_le_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Weight Probe RN", brand: "AquaVida", category: "BEVERAGE", project_type: "RENOVATION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 100000.00 }
              as: InnovationLead
              captures: { pr_rn_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Margin Cap Probe", brand: "AquaVida", category: "BEVERAGE", project_type: "NEW_BRAND", strategic_fit_score: 7, consumer_need_score: 8, target_gross_margin_pct: 60, category_attractiveness_score: 6, development_budget_cap_usd: 100000.00 }
              as: InnovationLead
              captures: { pr_cap_id: $.data.id }
            - call: "POST /innovation-projects/${pr_nb_id}/screen"
              payload: {}
              as: GateChair
            - call: "POST /innovation-projects/${pr_le_id}/screen"
              payload: {}
              as: GateChair
            - call: "POST /innovation-projects/${pr_rn_id}/screen"
              payload: {}
              as: GateChair
          trigger:
            - call: "POST /innovation-projects/${pr_cap_id}/screen"
              payload: {}
              as: GateChair
          assert:
            - "InnovationProject.${pr_nb_id}.screening_score == 78.00"
            - "InnovationProject.${pr_le_id}.screening_score == 79.00"
            - "InnovationProject.${pr_rn_id}.screening_score == 77.00"
            - "the three scores differ although strategic_fit_score, consumer_need_score, target_gross_margin_pct and category_attractiveness_score are identical"
            - "InnovationProject.${pr_cap_id}.screening_score == 79.00"
            - "InnovationProject.${pr_cap_id}.screening_score != 91.50, proving margin_norm was clamped at 100 rather than reaching 150"
            - "all four projects have dev_status == SCREENED and screening_decision == PASSED"

      - name: forecast_per_line_rounding_before_summation
        grounds:
          - calculations.forecast_volume_and_revenue
          - entities.ForecastLine.fields.line_units
          - entities.ForecastLine.fields.line_revenue_usd
          - entities.BusinessCase.fields.annual_units
        distinguishing_aspect: |
          Mode (b): the scaffold pins round-per-line-then-sum, and this fixture makes the order
          observable — raw line units 402265.5 and 418981.5 round to 402266 and 418982 so
          annual_units is 821248 rather than the 821247 that sum-then-round would give, and
          gross_revenue_usd is 2781915.07 rather than 2781915.06.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T00:00:00Z."
            - "One BEVERAGE NEW_BRAND project in dev_status IDEA with a BOTTOM_UP business case."
            - "The first channel line already added; the second line carries the other half-unit remainder."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /innovation-projects"
