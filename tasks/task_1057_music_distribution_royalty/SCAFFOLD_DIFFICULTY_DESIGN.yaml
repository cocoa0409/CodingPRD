          Category pair `state` (priority 7, ERR_INVALID_STATE) versus `business_fiscal`
          (priority 25, ERR_RELEASE_SLOTS_EXHAUSTED): a release already in SUBMITTED on a 1-slot
          plan violates both, and the response must be ERR_INVALID_STATE with HTTP 409.
