      - name: picking_twice_through_one_slot_returns_invalid_state_on_the_second_attempt
        claim_type: idempotency
        grounds:
          - state_machines.SelectionSlot.slot_status.transitions.SCHEDULED_to_CONSUMED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          A slot is a one-shot right: after SCHEDULED -> CONSUMED, replaying pick
          on the same slot must fail with 409 ERR_INVALID_STATE even when the
          second attempt targets a DIFFERENT, genuinely AVAILABLE seat carrying a
          correctly captured expected_seat_version. That isolates slot
          consumption from the seat-level guards (priority 8, 17, 18) — an
          implementation that only checks seat availability would wrongly mint a
          second SeatAssignment for the same donor.
        test_recipe:
          setup:
            - "Section SEC-T, OPEN, seat_capacity 2, per_seat_requirement_cents 100000, required_points_per_seat 0, holding seats T/1 and T/2, both AVAILABLE."
