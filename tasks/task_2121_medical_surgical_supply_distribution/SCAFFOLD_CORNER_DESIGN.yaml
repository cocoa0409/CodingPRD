      - name: second_claim_on_a_claimed_order_and_premature_reconcile_are_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CLAIM_ALREADY_OPEN]
          - errors[ERR_CLAIM_STATE_INVALID]
          - validations[priority=9]
          - validations[priority=8]
          - state_machines.ChargebackClaim.ACCEPTED_to_RECONCILED
        distinguishing_aspect: "An order may carry only one non-DISPUTED claim, so a second POST /chargeback-claims returns ERR_CLAIM_ALREADY_OPEN 409; and RECONCILE is only defined out of ACCEPTED, so issuing it against a SUBMITTED claim returns ERR_CLAIM_STATE_INVALID 409 - the priority 8 state check fires ahead of the priority 14 two-person rule even though the acting user is the submitter."
        test_recipe:
          setup:
