              as: SalesRep
              captures: { adv_id: "$.data.id"}
            - call: "POST /traffic/programs"
              payload: { title: "DF P", daypart_code: "PRIME", airs_weekday: 6, start_time_local: "20:00", duration_minutes: 60, rating_estimate: 5.0 }
              as: TrafficManager
