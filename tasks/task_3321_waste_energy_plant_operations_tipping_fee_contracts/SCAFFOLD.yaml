    path: /wte/_clock/set_current_utc
    description: "Test-driving logical clock. Sets the server's logical time. Startup default (before any call) is exactly 2026-09-01T00:00:00Z; the logical clock never falls back to wall-clock time."
    roles: [Regulator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["advance system transitions whose preconditions depend on the clock (agreement/PPA expiry)"]
