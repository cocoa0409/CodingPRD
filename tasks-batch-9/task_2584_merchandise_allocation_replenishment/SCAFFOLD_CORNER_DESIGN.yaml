            - "Every store holds the same position of SKU-1001: on_hand 8 (S 2 / M 3 / L 2 / XL 1), on_order 0, min 6, max 40, forecast 3"
            - "SKU-1001 is SEASONAL so the run is DEMAND_DRIVEN / FORWARD_LOOKING; with no promo event the lift is neutral, giving target 3 x 4 = 12 and need 12 - 8 = 4 at every store"
            - "The receipt holds 12 units (S 2 / M 4 / L 4 / XL 2) so the pool is exactly half the network need of 24"
