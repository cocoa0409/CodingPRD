              payload: { payment_id: "${refund_id}" }
              as: OpsAdmin
          assert:
            - "Project.${proj_id}.deposit_paid_cents == 129470"
            - "Project.${proj_id}.amount_refunded_cents == 129470"
            - "net collected (deposit_paid_cents + balance_paid_cents - amount_refunded_cents) == 0"
            - "Project.${proj_id}.outstanding_balance_cents == 0 (display floor of signed 431568-129470+129470)"

      # --- Instance 2: crew capacity-time conserved across schedule then abort
      - name: crew_window_freed_by_abort
        grounds:
          - state_machines.InstallJob.SCHEDULED_to_ABORTED
          - validations[priority=15]
          - entities.InstallJob.fields.crew_id
        distinguishing_aspect: |
          Conserved quantity #2 — crew occupancy (a DIFFERENT conserved quantity than cash):
          scheduling an install occupies the crew window; aborting it (compensating action)
          must release the window so a NEW install in the identical window on the same crew
          succeeds. Sum of occupied non-terminal crew-windows returns to its pre-schedule state.
        test_recipe:
          setup:
            - "Two STANDARD deposit-paid projects on one crew. P1 has a SCHEDULED install 09:00..17:00 that is then ABORTED."
          setup_api_calls:
