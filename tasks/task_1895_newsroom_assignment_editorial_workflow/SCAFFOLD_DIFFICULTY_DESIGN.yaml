  - rule_id: transitive_cascade
    instances:
      - name: breaking_activation_bump_chain
        grounds:
          - state_machines.Assignment.ACCEPTED_to_BUMPED
          - state_machines.Story.SCHEDULED_to_ON_HOLD
          - calculations.slot_reserved_count
          - calculations.active_assignment_count
        distinguishing_aspect: |
          Depth-3 cascade from event activation: activate -> Assignment BUMPED
          -> Story SCHEDULED->ON_HOLD (because its last active reporter was
          bumped) -> PublicationSlot.reserved_count 1->0. Each hop is caused by
          the previous mutation, and the trigger differs from
          retraction_issue_chain's correction issuance.
        test_recipe:
          setup:
            - "Full editorial staff; a STANDARD FEATURES story (priority_score 22.00 < BUMP_FLOOR[2]=60) driven to SCHEDULED in a PRINT slot (capacity 2); its single ACCEPTED reporter assignment runs [2026-08-01T10:00, 2026-08-01T12:00)"
            - "A band-2 breaking event covering [2026-08-01T09:00, 2026-08-01T13:00) with call_in_pool_size 0 sits DECLARED"
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk Seven", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep Seven", role_capability: REPORTER, home_desk: FEATURES, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
