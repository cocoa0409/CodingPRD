            - "D_a window 2026-09-10 -> 2026-09-13 (nights 09-10, 09-11, 09-12) confirmed: rooms_occupied 1."
            - "D_b window 2026-09-11 -> 2026-09-15 (nights 09-11..09-14) confirmed even though it OVERLAPS D_a: rooms_occupied 2."
            - "D_c window 2026-09-12 -> 2026-09-14 (nights 09-12, 09-13) confirmed: on night 09-12 the aggregate is 1+1+1 == 3 == rooms_total, the last accepting value. rooms_occupied 3, rooms_available 0, block flips ACTIVE -> EXHAUSTED."
            - "D_d window 2026-09-20 -> 2026-09-23 (nights 09-20, 09-21, 09-22) shares no night with any confirmed deployment, so the nightly aggregate on each of its nights is just 1 <= 3."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-802", peril_type: "FLOOD", jurisdiction_state: "LA", event_start_utc: "2026-07-29T00:00:00.000Z", exposure_count: 900, avg_insured_value: 175000, expected_severity_index: 0.1300 }
