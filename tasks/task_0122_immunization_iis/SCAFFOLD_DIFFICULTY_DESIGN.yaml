scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: catchup_vs_routine_next_due_on_patient_schedule
        grounds:
          - calculations.cdc_catchup_eligibility_decision
          - entities.AdministeredDose.fields.catchup_flag
          - entities.AntigenScheduleRule.fields.routine_recommended_age_days
          - entities.AntigenScheduleRule.fields.catchup_min_interval_days
          - state_machines.AdministeredDose.SCHEDULED_to_ADMINISTERED
        distinguishing_aspect: |
          Operates on a Patient's schedule projection: for identical Patient.date_of_birth
          and AdministeredDose history, the ROUTINE variant returns next_due_date
          anchored on routine_recommended_age_days while the CATCHUP variant returns
          last_admin + catchup_min_interval_days. The two values diverge for any
          patient who missed at least one routine window. Lives in the Patient
          schedule domain, not the provider domain.
        test_recipe:
          setup:
            - "Public health creates AntigenScheduleRule for antigen=DTAP_DIPHTHERIA, seq=1, routine_min_age_days=42, routine_recommended_age_days=60, routine_max_age_days=90, catchup_min_interval_days=28."
            - "Public health creates AntigenScheduleRule for antigen=DTAP_DIPHTHERIA, seq=2, routine_min_age_days=120, routine_recommended_age_days=120, routine_max_age_days=180, catchup_min_interval_days=28, prerequisite_rule_id=seq1.id."
            - "Public health creates VaccineProduct cvx=01, antigens=[DTAP_DIPHTHERIA], min_age_days=42, max_age_days=2555."
            - "Public health creates VaccineLot lot_number='L1', doses_on_hand=10."
            - "Create Patient P with date_of_birth=2025-01-01."
            - "Schedule and administer dose 1 to P at administered_at=2025-08-01 (age 212 days, beyond seq1 routine_max=90 -> already in catchup region)."
          trigger:
            - "GET /patients/{P.id}/next-due"
          assert:
            - "Response contains an entry with antigen=DTAP_DIPHTHERIA, variant='catchup', next_due_date='2025-08-29' (last_admin 2025-08-01 + 28 days, since the patient is already in catchup territory)."
            - "AdministeredDose for dose 1 has catchup_flag == true."
            - "When the same patient is re-projected after creating a SECOND patient born 2025-08-01 with identical schedule but dose 1 administered at age 60 days, the response for THAT patient has variant='routine' and next_due_date = '2025-11-29' (DOB 2025-08-01 + routine_recommended_age_days of seq 2 = 120 days = 2025-11-29)."

      - name: vaers_reportable_vs_provider_compliance_dual_perspective
        grounds:
          - calculations.vaers_reportable_determination
          - calculations.provider_reporting_compliance_score
          - entities.AdverseEvent.fields.vaers_required
          - entities.ProviderOrganization.fields.reporting_compliance_score
        distinguishing_aspect: |
          Operates on different entity domains: vaers_reportable_determination is
          a federal-reporting decision on AdverseEvent (boolean flag), while
          provider_reporting_compliance_score is a continuous rolling score on
          ProviderOrganization. Both take 'lag_hours from administration' as a
          core input but produce qualitatively different outputs (binary
          reportability vs scalar score) and apply to different entity classes
          (event-driven AE vs aggregate provider state).
        test_recipe:
          setup:
            - "Advance clock to 2026-01-01T00:00:00Z."
            - "Create Patient P, ProviderOrganization PO, VaccineProduct VP, VaccineLot VL with doses_on_hand=5."
            - "Schedule dose D1; advance clock to 2026-01-02T00:00:00Z (24h after dose creation)."
            - "POST /administer for D1 with administered_at=2026-01-01T00:00:00Z (reported_at will be set to now=2026-01-02T00:00:00Z, so lag_hours = 24)."
            - "Create AdverseEvent AE1 with dose_id=D1, onset_at=2026-01-02T00:00:00Z (lag from admin = 24h exactly), seriousness=NON_SERIOUS."
          trigger:
            - "GET /provider-organizations/{PO.id}"
            - "GET /adverse-events/{AE1.id}"
          assert:
            - "ProviderOrganization.reporting_compliance_score == 100.00 (lag_hours=24 hits the on-time inclusive bound)."
            - "AdverseEvent.vaers_required == true (lag_hours=24 hits the rapid-onset inclusive bound)."
            - "Both outputs derive from the same lag=24h input but live on different entities and carry different shapes (float vs boolean)."

  # =========================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes (a)(b)(c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: catchup_eligibility_three_input_nested_max
        grounds:
          - calculations.cdc_catchup_eligibility_decision
        distinguishing_aspect: |
          Mode (a): formula with three inputs and non-linear interaction.
          eligible_date = max(DOB + routine_min_age_days, last_admin + catchup_min_interval_days)
          combines (a) DOB, (b) routine_min_age_days from AntigenScheduleRule, and
          (c) last_admin + catchup_min_interval_days under a max(). The branch
          selection between ROUTINE and CATCHUP itself depends on a conditional
          over current_age vs routine_max_age_days. Three inputs, nested max,
          conditional branch on patient state.
        test_recipe:
          setup:
            - "Create AntigenScheduleRule for HEPB seq=2: routine_min_age_days=30, routine_recommended_age_days=60, routine_max_age_days=120, catchup_min_interval_days=28."
            - "Create AntigenScheduleRule for HEPB seq=1: routine_min_age_days=0, routine_recommended_age_days=1, routine_max_age_days=30, catchup_min_interval_days=0."
            - "Create VaccineProduct for HEPB, Patient born 2025-01-01."
            - "Administer HEPB seq=1 at age 5 days (2025-01-06) -- on-time, no catchup."
            - "Advance clock to 2025-04-01 (age 90 days)."
          trigger:
            - "GET /patients/{P.id}/next-due"
          assert:
            - "Response.HEPB.variant == 'routine' (current age 90 <= routine_max_age_days 120)."
            - "Response.HEPB.next_due_date == '2025-03-02' (DOB 2025-01-01 + routine_recommended_age_days=60 days)."

      - name: compliance_score_pinned_rounding_order
        grounds:
          - calculations.provider_reporting_compliance_score
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The scaffold explicitly
          pins ROUND-THEN-SUM (round per-dose score to 2 dp, then sum, then
          divide and round average to 2 dp), and the formula comment shows the
          alternate SUM-THEN-ROUND ordering yields a different cent for inputs
          like 30.555 and 30.554. A second formula on the same metric would
          satisfy only (a); this falsifies the alternate ordering.
        test_recipe:
          setup:
            - "Advance clock to 2026-06-01T00:00:00Z."
            - "Create ProviderOrganization PO."
            - "Create Patient P, VaccineProduct VP, VaccineLot VL doses_on_hand=10."
            - "Schedule dose D1; administer at 2026-05-30T00:00:00Z; advance clock so reported_at = 2026-05-31T07:33:36Z (lag = 31.56h -> per_dose_score = 100 - (31.56-24)*1.25 = 90.55, rounded to 90.55)."
            - "Schedule dose D2; administer at 2026-05-30T00:00:00Z; advance clock so reported_at = 2026-05-31T07:34:12Z (lag = 31.57h -> per_dose_score = 100 - (31.57-24)*1.25 = 90.5375, rounded HALF_UP to 90.54)."
          trigger:
            - "GET /provider-organizations/{PO.id}"
          assert:
            - "reporting_compliance_score == 90.55 (round-then-sum: round(90.55+90.54)/2=round(90.545,2)=90.55 ROUND_HALF_UP). The sum-then-round alternative would have produced round((100-(31.56-24)*1.25 + 100-(31.57-24)*1.25)/2, 2) = round((90.55 + 90.5375)/2, 2) = round(90.54375, 2) = 90.54, a 1-cent divergence."

      - name: school_coverage_circular_evaluation_order
        grounds:
          - calculations.school_coverage_evaluation
          - state_machines.SchoolEnrollmentCertificate.DRAFT_to_ISSUED
          - entities.Patient.fields.medical_exemption_on_file
        distinguishing_aspect: |
          Mode (c): circular-looking dependency where evaluation order is pinned.
          Coverage status depends on missing_antigens; missing_antigens depends
          on Patient.medical_exemption_on_file; but exemption itself bypasses
          the missing_antigens computation. The scaffold pins the evaluation
          order explicitly: exemption flag is checked FIRST, returns
          (EXEMPTION_GRANTED, []), short-circuiting the set arithmetic that
          would otherwise compute missing_antigens. The alternative order
          (compute missing first, then apply exemption) would still leave
          missing_antigens populated, breaking the contract that EXEMPTION_GRANTED
          carries missing_antigens=[].
        test_recipe:
          setup:
            - "Create AntigenScheduleRule for MMR_MEASLES seq=1 with school_enrollment_required=true."
            - "Create Patient P with medical_exemption_on_file=true and NO doses administered."
            - "Create SchoolEnrollmentCertificate C for P."
          trigger:
            - "POST /patients/{P.id}/certificates/{C.id}/issue"
          assert:
            - "Certificate.certificate_status == 'EXEMPTION_GRANTED'."
            - "Certificate.missing_antigens == [] (the pinned evaluation order short-circuits the set diff)."
            - "The alternative order (compute missing first) would have returned missing_antigens=['MMR_MEASLES'] with status DEFICIENT or EXEMPTION_GRANTED; the scaffold contractually rejects that."

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on DIFFERENT entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: adverse_event_parallel_dimensions
        grounds:
          - state_machines.AdverseEvent
          - entities.AdverseEvent.fields.clinical_review_status
          - entities.AdverseEvent.fields.vaers_submission_status
        distinguishing_aspect: |
          AdverseEvent runs parallel state dimensions on a single row:
          clinical_review_status (PENDING_REVIEW -> UNDER_REVIEW -> {CAUSALLY_RELATED,
          NOT_RELATED}) evolves independently of vaers_submission_status
          (NOT_SUBMITTED -> SUBMITTED -> {ACK_RECEIVED, REJECTED}). The two axes
          have independent transitions, terminal states, and triggering endpoints;
          a single row can sit at (CAUSALLY_RELATED, NOT_SUBMITTED) for arbitrarily
          long.
        test_recipe:
          setup:
            - "Create Patient, dose, AdverseEvent AE with seriousness=SERIOUS so vaers_required=true."
          trigger:
            - "POST /adverse-events/{AE.id}/start-review with reviewing clinician != administering clinician."
            - "POST /adverse-events/{AE.id}/conclude-review with conclusion=NOT_RELATED."
            - "GET /adverse-events/{AE.id}"
          assert:
            - "AE.clinical_review_status == 'NOT_RELATED'."
            - "AE.vaers_submission_status == 'NOT_SUBMITTED' (the conclude action does NOT touch the submission axis)."
            - "A subsequent POST /adverse-events/{AE.id}/submit-vaers transitions only vaers_submission_status to SUBMITTED, leaving clinical_review_status unchanged at NOT_RELATED."

      - name: school_certificate_branching_with_revert
        grounds:
          - state_machines.SchoolEnrollmentCertificate
          - state_machines.AdministeredDose.ADMINISTERED_to_INVALIDATED
        distinguishing_aspect: |
          SchoolEnrollmentCertificate exhibits branching with revert: DRAFT branches
          to {ISSUED, DEFICIENT, EXEMPTION_GRANTED}; ISSUED can revert to DEFICIENT
          via the lot-recall cascade; DEFICIENT can re-advance to ISSUED when a
          new dose is administered. This is a non-linear shape on a different
          entity than AdverseEvent's parallel dimensions.
        test_recipe:
          setup:
            - "Create the full set of MMR/DTAP/HEPB AntigenScheduleRules with school_enrollment_required=true for seq=1 of each antigen."
            - "Administer one dose covering each antigen for Patient P."
            - "Create and issue SchoolEnrollmentCertificate C -> status becomes ISSUED."
          trigger:
            - "POST /vaccine-lots/{MMR_lot.id}/recall reason=CONTAMINATION."
          assert:
            - "Before recall: C.certificate_status == 'ISSUED'."
            - "After recall: C.certificate_status == 'DEFICIENT' and C.missing_antigens contains 'MMR_MEASLES' (revert step in branching shape)."
            - "Administering a fresh MMR dose from another lot then auto-promotes C.certificate_status back to 'ISSUED' (re-advance step)."

  # =========================================================================
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: recall_to_dose_to_certificate_to_review_chain
        grounds:
          - state_machines.VaccineLot.AVAILABLE_to_RECALLED
          - state_machines.AdministeredDose.ADMINISTERED_to_INVALIDATED
          - state_machines.SchoolEnrollmentCertificate.ISSUED_to_DEFICIENT
          - state_machines.AdverseEvent
        distinguishing_aspect: |
          Depth >= 3 cascade with EACH link causally chained from the previous:
          (1) POST /vaccine-lots/{id}/recall mutates VaccineLot -> RECALLED.
          (2) That mutation triggers AdministeredDose.dose_state ADMINISTERED -> INVALIDATED
              (caused by VaccineLot's recall transition, not by the original API call).
          (3) That dose mutation in turn triggers school_coverage_evaluation, which mutates
              SchoolEnrollmentCertificate.certificate_status ISSUED -> DEFICIENT
              (caused by the dose's invalidation, not by the original recall API call).
          (4) That same dose mutation also triggers AdverseEvent.clinical_review_status
              PENDING_REVIEW -> UNDER_REVIEW.
          Total chain length from the trigger = 3 (recall -> dose -> {cert, AE}).
        test_recipe:
          setup:
            - "Create MMR ScheduleRule (school-required), VaccineProduct VP, VaccineLot VL1 with doses_on_hand=2."
            - "Create Patient P; administer one MMR dose D1 from VL1."
            - "Create SchoolEnrollmentCertificate C for P; issue C -> ISSUED."
            - "Create AdverseEvent AE referencing D1, seriousness=NON_SERIOUS, onset within 24h."
          trigger:
            - "POST /vaccine-lots/{VL1.id}/recall reason=MANUFACTURER_DEFECT."
          assert:
            - "VaccineLot VL1.status == 'RECALLED'."
            - "AdministeredDose D1.dose_state == 'INVALIDATED' and D1.invalidation_reason == 'LOT_RECALL'."
            - "SchoolEnrollmentCertificate C.certificate_status == 'DEFICIENT' and 'MMR_MEASLES' in C.missing_antigens."
            - "AdverseEvent AE.clinical_review_status == 'UNDER_REVIEW' (auto-advanced from PENDING_REVIEW)."

      - name: data_error_invalidation_to_certificate_chain
        grounds:
          - state_machines.AdministeredDose
          - state_machines.SchoolEnrollmentCertificate.ISSUED_to_DEFICIENT
          - calculations.school_coverage_evaluation
          - calculations.provider_reporting_compliance_score
        distinguishing_aspect: |
          Different triggering transition from the recall cascade: the trigger is
          POST /patients/{patient_id}/doses/{dose_id}/invalidate (manual data-error
          correction by PublicHealthOfficer), NOT a lot recall. Chain depth >= 2:
          (1) dose ADMINISTERED -> INVALIDATED (caused by the API call),
          (2) school_coverage_evaluation re-runs and certificate ISSUED -> DEFICIENT
              (caused by the dose's invalidation, not by the original call).
          Distinct propagation pattern from recall: data-error invalidation
          ALWAYS restores doses_on_hand, while recall invalidation only restores
          when recall_reason != EXPIRED.
        test_recipe:
          setup:
            - "Create HEPB ScheduleRule (school-required), VaccineProduct, VaccineLot VL2 doses_on_hand=1, Patient P."
            - "Administer dose D from VL2 -> VL2.doses_on_hand decrements to 0, VL2.status -> EXHAUSTED."
            - "Create SchoolEnrollmentCertificate C for P with HEPB as the only required antigen and one dose covering it -> issue C -> ISSUED."
          trigger:
            - "POST /patients/{P.id}/doses/{D.id}/invalidate body={reason:'DATA_ERROR'}."
          assert:
            - "AdministeredDose D.dose_state == 'INVALIDATED' and D.invalidation_reason == 'DATA_ERROR'."
            - "VaccineLot VL2.doses_on_hand == 1 (data-error always restores stock) and VL2.status == 'AVAILABLE' (auto-back from EXHAUSTED)."
            - "SchoolEnrollmentCertificate C.certificate_status == 'DEFICIENT' and 'HEPB' in C.missing_antigens."

  # =========================================================================
  # Rule 5 — Validation priority conflicts across DIFFERENT error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_business_safety_on_administer
        grounds:
          - validations[priority=50]                  # ERR_LOT_RECALLED (state)
          - validations[priority=60]                  # ERR_ALLERGY_CONTRAINDICATION (business_safety)
        distinguishing_aspect: |
          Pair: state (priority 50, ERR_LOT_RECALLED) vs business_safety (priority 60,
          ERR_ALLERGY_CONTRAINDICATION). The scaffold pins state precedence: when both
          would fail, ERR_LOT_RECALLED wins. Falsifiable: if ERR_ALLERGY_CONTRAINDICATION
          is returned instead, the priority order is wrong.
        test_recipe:
          setup:
            - "Create VaccineProduct VP with contraindication_flags=['EGG']."
            - "Create VaccineLot VL of VP."
            - "Create Patient P with AllergyRecord allergen_code=EGG, severity=ANAPHYLAXIS."
            - "Schedule dose D using VL."
            - "Recall VL (POST /vaccine-lots/{VL.id}/recall) so VL.status='RECALLED'."
          trigger:
            - "POST /patients/{P.id}/doses/{D.id}/administer"
          assert:
            - "Response error_id == 'ERR_LOT_RECALLED' (state check at priority 50 wins over allergy check at priority 60)."
            - "Response http status == 409."

      - name: business_safety_vs_business_constraint_on_administer
        grounds:
          - validations[priority=60]                  # ERR_ALLERGY_CONTRAINDICATION (business_safety)
          - validations[priority=70]                  # ERR_AGE_OUT_OF_RANGE (business_constraint)
        distinguishing_aspect: |
          Pair: business_safety (priority 60, ERR_ALLERGY_CONTRAINDICATION) vs
          business_constraint (priority 70, ERR_AGE_OUT_OF_RANGE). DIFFERENT
          pair from the state-vs-safety conflict above. The scaffold pins
          safety precedence: anaphylactic allergy must reject before age check.
        test_recipe:
          setup:
            - "Create VaccineProduct VP with contraindication_flags=['NEOMYCIN'], min_age_days=42, max_age_days=2555."
            - "Create VaccineLot VL of VP with doses_on_hand>=1, status AVAILABLE."
            - "Create Patient P born 2026-04-01 with AllergyRecord NEOMYCIN/ANAPHYLAXIS."
            - "Schedule dose D using VL."
            - "Advance clock to 2026-04-15 (Patient age = 14 days, BELOW VP.min_age_days=42)."
          trigger:
            - "POST /patients/{P.id}/doses/{D.id}/administer administered_at=2026-04-15T00:00:00Z."
          assert:
            - "Response error_id == 'ERR_ALLERGY_CONTRAINDICATION' (priority 60 wins over priority 70)."
            - "Response http status == 422."

  # =========================================================================
  # Rule 6 — Boundary-precision checks on DIFFERENT metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: age_min_inclusive_boundary_on_administer
        grounds:
          - validations[priority=70]                # ERR_AGE_OUT_OF_RANGE
          - entities.VaccineProduct.fields.min_age_days
          - endpoints["/patients/{patient_id}/doses/{dose_id}/administer"]
        distinguishing_aspect: |
          Metric: integer age in days. Boundary: exactly VP.min_age_days is
          allowed; min_age_days - 1 is rejected. Endpoint: POST .../administer.
          Numeric threshold crossing.
        test_recipe:
          setup:
            - "Create VaccineProduct VP min_age_days=42, max_age_days=null."
            - "Create VaccineLot VL of VP, status AVAILABLE, doses_on_hand=2."
            - "Create Patient P_old born 2026-01-01."
            - "Create Patient P_young born 2026-01-02."
            - "Schedule dose D_old for P_old and dose D_young for P_young."
          trigger:
            - "Advance clock to 2026-02-12T00:00:00Z (P_old age = 42 days exactly; P_young age = 41 days)."
            - "POST /patients/{P_old.id}/doses/{D_old.id}/administer administered_at=2026-02-12T00:00:00Z."
            - "POST /patients/{P_young.id}/doses/{D_young.id}/administer administered_at=2026-02-12T00:00:00Z."
          assert:
            - "P_old admin: 200 response, D_old.dose_state == 'ADMINISTERED'."
            - "P_young admin: 422 response, error_id == 'ERR_AGE_OUT_OF_RANGE'."

      - name: empty_required_antigen_set_school_coverage
        grounds:
          - calculations.school_coverage_evaluation
          - state_machines.SchoolEnrollmentCertificate.DRAFT_to_ISSUED
          - endpoints["/patients/{patient_id}/certificates/{cert_id}/issue"]
        distinguishing_aspect: |
          DIFFERENT metric (empty-set boundary, not numeric threshold).
          When no AntigenScheduleRule has school_enrollment_required=true, the
          required_antigens set is empty; missing_antigens = empty - covered = [].
          The certificate must transition DRAFT -> ISSUED via the path that
          treats an empty required-set as fully covered (vacuously true).
          Endpoint: POST /certificates/{cert_id}/issue.
        test_recipe:
          setup:
            - "Public health creates exactly one AntigenScheduleRule but with school_enrollment_required=false."
            - "Create Patient P (no exemption, no doses)."
            - "Create SchoolEnrollmentCertificate C for P."
          trigger:
            - "POST /patients/{P.id}/certificates/{C.id}/issue"
          assert:
            - "Response code 200, C.certificate_status == 'ISSUED', C.missing_antigens == []."
            - "If the empty-set boundary were mishandled (treating empty required_antigens as 'no rules => DEFICIENT'), the response would incorrectly be DEFICIENT; the scaffold forbids that."

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across DIFFERENT entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: dose_admin_depends_on_lot_status
        grounds:
          - state_machines.AdministeredDose.SCHEDULED_to_ADMINISTERED
          - state_machines.VaccineLot
          - validations[priority=50]
        distinguishing_aspect: |
          Entity pair: AdministeredDose <- VaccineLot. The transition
          SCHEDULED -> ADMINISTERED is gated by VaccineLot.status == AVAILABLE.
          A RECALLED or EXHAUSTED lot blocks the transition regardless of the
          dose's own field values.
        test_recipe:
          setup:
            - "Create lot VL with doses_on_hand=0 (-> auto-EXHAUSTED). Create Patient P, schedule dose D using VL."
          trigger:
            - "POST /patients/{P.id}/doses/{D.id}/administer"
          assert:
            - "error_id == 'ERR_LOT_EXHAUSTED', http 409 (VaccineLot.status drives AdministeredDose's allowed transitions)."

      - name: vaers_submission_depends_on_adverse_event_review_state
        grounds:
          - state_machines.AdverseEvent
          - validations[priority=52]
          - endpoints["/adverse-events/{id}/submit-vaers"]
        distinguishing_aspect: |
          DIFFERENT entity pair from the AdministeredDose<-VaccineLot dependency:
          AdverseEvent's vaers_submission_status dimension transition NOT_SUBMITTED
          -> SUBMITTED requires that clinical_review_status ∈ {UNDER_REVIEW,
          CAUSALLY_RELATED, NOT_RELATED}. A submission attempt while
          clinical_review_status is still PENDING_REVIEW is rejected. This is a
          dependency between two state DIMENSIONS on the same AdverseEvent
          entity, not between two separate entities -- and is a distinct
          dependency pattern from the lot/dose case (intra-entity inter-axis
          rather than inter-entity).
        test_recipe:
          setup:
            - "Create Patient, dose, AdverseEvent AE with seriousness=SERIOUS so vaers_required=true. Do NOT start review."
          trigger:
            - "POST /adverse-events/{AE.id}/submit-vaers"
          assert:
            - "error_id == 'ERR_INVALID_STATE' (vaers_submission_status transition gated on clinical_review_status not being PENDING_REVIEW)."

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across DIFFERENT interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: dose_min_interval_closed_lower_bound
        grounds:
          - validations[priority=71]              # ERR_MIN_INTERVAL_VIOLATION
          - calculations.cdc_catchup_eligibility_decision
          - entities.AntigenScheduleRule.fields.catchup_min_interval_days
        distinguishing_aspect: |
          Resource: Patient's dose-sequence timeline for a single antigen series.
          Interval semantics: CLOSED LOWER BOUND -- a candidate dose at exactly
          (last_admin + catchup_min_interval_days) IS accepted; (last_admin +
          catchup_min_interval_days - 1 day) is rejected. The 'collision' is with
          the prior dose's minimum-interval window, treated as a half-open
          forward-looking interval [last_admin, last_admin + min_interval).
        test_recipe:
          setup:
            - "Create DTAP_PERTUSSIS ScheduleRule seq=1 (routine_min_age_days=42, routine_recommended=42, routine_max=90, catchup_min_interval_days=0)."
            - "Create DTAP_PERTUSSIS ScheduleRule seq=2 (routine_min_age_days=120, routine_recommended=120, routine_max=180, catchup_min_interval_days=28, prerequisite_rule_id=seq1)."
            - "Create VaccineProduct VP (min_age_days=42, max_age_days=2555, antigens=[DTAP_PERTUSSIS])."
            - "Create VaccineLot VL of VP, doses_on_hand=5, status AVAILABLE."
            - "Create Patient P born 2026-01-01."
            - "Schedule and POST /administer dose D1 at administered_at=2026-02-12T00:00:00Z (age 42 days, satisfies seq=1)."
            - "Schedule a second dose D_short for P (different dose row)."
            - "Schedule a third dose D_ok for P (different dose row)."
          trigger:
            - "Advance clock to 2026-03-10T00:00:00Z. POST /administer for D_short with administered_at=2026-03-10T00:00:00Z (interval since D1 = 26 days, one short of catchup_min_interval_days=28)."
            - "Advance clock to 2026-03-12T00:00:00Z. POST /administer for D_ok with administered_at=2026-03-12T00:00:00Z (interval since D1 = 28 days exactly)."
          assert:
            - "D_short admin: 422 response, error_id == 'ERR_MIN_INTERVAL_VIOLATION' (interval 26 < 28 = closed-lower-bound violated)."
            - "D_ok admin: 200 response, dose_state == 'ADMINISTERED' (interval 28 == 28 satisfies closed lower bound)."

      - name: adverse_event_onset_window_open_upper_bound
        grounds:
          - validations[priority=90]              # ERR_ONSET_OUT_OF_WINDOW
          - entities.AdverseEvent.fields.onset_at
        distinguishing_aspect: |
          DIFFERENT interval semantics from the dose min-interval check: this is
          a CLOSED-CLOSED window [administered_at, administered_at + 42 days]
          on a DIFFERENT resource entity (AdverseEvent vs Patient's dose
          timeline). Aggregate-capacity flavor: an AdverseEvent occupying a slot
          inside this window is accepted; one outside is rejected. Inclusive on
          both ends (administered_at exactly OK; administered_at + 42 days
          exactly OK; administered_at + 42 days + 1 second NOT OK).
        test_recipe:
          setup:
            - "Create Patient P, administer dose D at administered_at=2026-01-01T00:00:00Z."
          trigger:
            - "POST /adverse-events body.onset_at=2026-01-01T00:00:00Z (== administered_at, closed lower)."
            - "POST /adverse-events body.onset_at=2026-02-12T00:00:00Z (= administered_at + 42d exactly, closed upper)."
            - "POST /adverse-events body.onset_at=2026-02-12T00:00:01Z (1s past 42d window)."
            - "POST /adverse-events body.onset_at=2025-12-31T23:59:59Z (1s before administered_at)."
          assert:
            - "1st: 201 accepted."
            - "2nd: 201 accepted."
            - "3rd: 422 error_id='ERR_ONSET_OUT_OF_WINDOW'."
            - "4th: 422 error_id='ERR_ONSET_OUT_OF_WINDOW'."

  # =========================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: dose_inventory_conservation_under_data_error_invalidation
        grounds:
          - state_machines.AdministeredDose.SCHEDULED_to_ADMINISTERED
          - state_machines.AdministeredDose.ADMINISTERED_to_INVALIDATED
          - entities.VaccineLot.fields.doses_on_hand
        distinguishing_aspect: |
          Conserved quantity: doses_on_hand of the VaccineLot. Forward action:
          /administer decrements doses_on_hand by 1. Compensating action:
          /invalidate (reason=DATA_ERROR) increments doses_on_hand by 1.
          Pinned invariant: VaccineLot.doses_on_hand BEFORE administer ==
          VaccineLot.doses_on_hand AFTER (administer then invalidate).
        test_recipe:
          setup:
            - "Create VL with doses_on_hand=7."
            - "Schedule dose D using VL."
          trigger:
            - "Record initial_count = VL.doses_on_hand. Administer D. Record mid_count. Invalidate D with reason=DATA_ERROR. Record final_count."
          assert:
            - "initial_count == 7."
            - "mid_count == 6 (decremented by administer)."
            - "final_count == 7 (incremented back by data-error invalidate)."
            - "initial_count == final_count (inventory conserved)."

      - name: school_coverage_set_conservation_under_recall_then_revaccinate
        grounds:
          - calculations.school_coverage_evaluation
          - state_machines.SchoolEnrollmentCertificate
          - entities.SchoolEnrollmentCertificate.fields.missing_antigens
        distinguishing_aspect: |
          DIFFERENT conserved quantity: the SET of covered_antigens for the
          patient (a set-valued quantity, not a numeric one). Forward action:
          recall invalidates a dose, removing its antigen from covered_antigens.
          Compensating action: administering a replacement dose for the same
          antigen from a different lot restores the antigen to covered_antigens.
          Pinned invariant: covered_antigens BEFORE recall ==
          covered_antigens AFTER (recall then revaccinate), so
          SchoolEnrollmentCertificate.missing_antigens returns to []. Cascade
          must leave NO drift in the set.
        test_recipe:
          setup:
            - "Create MMR ScheduleRule seq=1 school_required=true. Create VP MMR, lots VL_A doses=1 and VL_B doses=1."
            - "Patient P; administer MMR dose D_A from VL_A. Create+issue certificate C -> ISSUED."
            - "Record covered_before = ['MMR_MEASLES'], missing_before = [], status_before = 'ISSUED'."
          trigger:
            - "POST /vaccine-lots/{VL_A.id}/recall reason=CONTAMINATION."
            - "Schedule a new dose D_B from VL_B and POST /administer."
          assert:
            - "After recall only: C.certificate_status == 'DEFICIENT', C.missing_antigens == ['MMR_MEASLES']."
            - "After revaccinate: C.certificate_status == 'ISSUED', C.missing_antigens == []."
            - "covered_antigens(after) == covered_antigens(before) == {'MMR_MEASLES'} -- set invariant restored, no drift."
