  - { method: POST, path: "/wc/disputes", description: "File a class code dispute", roles: [EmployerAdmin], code: 201, input: [policy_id, policy_class_code_id, requested_class_code, effective_from, "supersedes_dispute_id?"], output: ClassCodeDispute, side_effects: ["records filed_by"] }
  - { method: GET, path: "/wc/disputes", description: "List disputes, filterable", roles: [Underwriter, EmployerAdmin], code: 200, input: ["policy_class_code_id?", "supersedes_dispute_id?", "status?", "limit?", "offset?"], output: "ClassCodeDispute[]", side_effects: [] }
  - { method: GET, path: "/wc/disputes/{id}", description: "Get a dispute", roles: [Underwriter, EmployerAdmin], code: 200, input: [], output: ClassCodeDispute, side_effects: [] }
