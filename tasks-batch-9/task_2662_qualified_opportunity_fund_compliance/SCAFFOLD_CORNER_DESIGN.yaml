      - name: fund_asset_dispose_twice_already_terminal_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.FundAsset.terminal_states
          - validations[priority=14]
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "DISPOSED is terminal for FundAsset, and priority 13 explicitly carves terminal states out, so a second dispose answers ERR_ALREADY_TERMINAL (409) rather than ERR_INVALID_STATE_TRANSITION; the recorded proceeds and disposal instant are immune to the retry."
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund holding one CASH asset of 200000.00."
            - "The asset is disposed once at the clock instant 2026-08-01 for proceeds 210000.00, leaving it in the terminal status DISPOSED."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Terminal Asset Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "CASH", acquisition_date: "2026-02-01T00:00:00Z", unadjusted_cost_basis: 200000.00, afs_fair_value: 200000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { asset_id: $.data.id }
            - call: "POST /qof/fund-assets/${asset_id}/dispose"
              payload: { proceeds_amount: 210000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { first_status: $.data.status, first_proceeds: $.data.proceeds_amount }
          trigger:
            - call: "POST /qof/fund-assets/${asset_id}/dispose"
              payload: { proceeds_amount: 5000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { err: $.data.error_id }
          assert:
            - "${first_status} == DISPOSED and ${first_proceeds} == 210000.00"
            - "${err} == ERR_ALREADY_TERMINAL with HTTP 409 (priority 14, because priority 13 never fires on a terminal row)"
            - "FundAsset.${asset_id}.proceeds_amount == 210000.00 and disposed_at == 2026-08-01T00:00:00Z (unchanged by the retry)"
            - "FundAsset.${asset_id}.version == 2"
            - "Fund.${fund_id}.aggregate_asset_basis == 0.00 and aggregate_afs_value == 0.00 (the single disposal already removed the asset once, and only once)"

      - name: fund_self_certify_twice_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Fund.DRAFT_to_SELF_CERTIFIED
          - validations[priority=13]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "Self-certification is not idempotent and not replayable: the second call carries a DIFFERENT first_taxable_month, and the declared machine has no SELF_CERTIFIED -> SELF_CERTIFIED arc, so it is refused 409 and the originally stamped election month and certification instant survive."
        test_recipe:
          setup:
            - "One Fund self-certified at the clock instant 2026-08-01 with first_taxable_month_iso8601 2026-01-01."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Once Only Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id, v_created: $.data.version }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { v_certified: $.data.version, cert_status: $.data.certification_status }
          trigger:
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-02-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { err: $.data.error_id }
          assert:
            - "${v_created} == 1 and ${v_certified} == 2 and ${cert_status} == SELF_CERTIFIED"
            - "${err} == ERR_INVALID_STATE_TRANSITION with HTTP 409"
            - "Fund.${fund_id}.first_taxable_month_iso8601 == 2026-01-01T00:00:00Z (the second month is not applied)"
            - "Fund.${fund_id}.self_certification_date == 2026-08-01T00:00:00Z"
            - "Fund.${fund_id}.version == 2 (the refused replay does not bump the fund)"
            - "Fund.${fund_id}.compliance_posture == UNTESTED"

      - name: penalty_assessment_cure_loop_termination_corner
        claim_type: cyclic
        grounds:
          - state_machines.PenaltyAssessment
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "The cyclic-shape corner — the row loops CURE_REQUESTED -> ASSESSED and the loop's termination condition is respected."
        excluded_because:
          difficulty_instance: penalty_assessment_cure_cycle_returns_to_assessed
          rationale: "That §1.8 non_linear_state_machine instance already walks ASSESSED -> CURE_REQUESTED -> ASSESSED -> CURE_REQUESTED -> UPHELD and asserts which arc a DENY takes from the cure_basis, which is exactly the loop-and-termination claim for the only cyclic machine in §1.2."

      - name: fund_asset_creation_updates_fund_aggregates
        claim_type: side_effect_execution
        grounds:
          - endpoints[POST /qof/fund-assets]
          - entities.Fund.fields.aggregate_qualified_basis
          - entities.FundAsset.fields.qualification
        distinguishing_aspect: "Every side effect of an asset create is observable at once and the four Fund rollups split differently: with a QUALIFIED asset at cost 600000.00 / AFS 700000.00 and a NONQUALIFIED cash asset at 150000.00, the basis pair is 750000.00 / 600000.00 while the AFS pair is 850000.00 / 700000.00 — four distinct numbers from two rows."
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund holding nothing."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Rollup Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
          trigger:
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZ_BUSINESS_PROPERTY", acquisition_date: "2026-01-15T00:00:00Z", unadjusted_cost_basis: 600000.00, afs_fair_value: 700000.00, original_use_in_zone: true }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { good_id: $.data.id, good_qual: $.data.qualification, good_status: $.data.status }
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "CASH", acquisition_date: "2026-01-20T00:00:00Z", unadjusted_cost_basis: 150000.00, afs_fair_value: 150000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { cash_id: $.data.id, cash_qual: $.data.qualification }
            - call: "GET /qof/funds/${fund_id}"
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { agg_basis: $.data.aggregate_asset_basis, agg_qual_basis: $.data.aggregate_qualified_basis, agg_afs: $.data.aggregate_afs_value, agg_qual_afs: $.data.aggregate_qualified_afs_value }
          assert:
            - "${good_qual} == QUALIFIED (QOZ_BUSINESS_PROPERTY with original_use_in_zone true) and ${good_status} == HELD"
            - "${cash_qual} == NONQUALIFIED (CASH is never qualified)"
            - "FundAsset.${good_id}.adjusted_basis == 600000.00 (equal to unadjusted_cost_basis before any expenditure)"
            - "FundAsset.${good_id}.disposition_sequence_index == null and proceeds_amount == 0.00"
            - "${agg_basis} == 750000.00 and ${agg_qual_basis} == 600000.00"
            - "${agg_afs} == 850000.00 and ${agg_qual_afs} == 700000.00"
            - "FundAsset.${cash_id}.version == 1 (each asset is created at version 1)"

      - name: partial_inclusion_event_updates_election_and_investor
        claim_type: cross_entity
        grounds:
          - state_machines.DeferralElection.DEFERRED_to_INCLUDED_PARTIAL
          - endpoints[POST /qof/deferral-elections/{id}/inclusion-events]
          - entities.Investor.fields.included_gain_total
        distinguishing_aspect: "One inclusion event adjusts three entities in a single request: the InclusionEvent is priced at UNDER_FIVE (step_pct 0.00 so net == gross == 40000.00), the election becomes INCLUDED_PARTIAL with deferred_remaining 60000.00, and the Investor's two rollups move in opposite directions to 60000.00 / 40000.00 while the EligibleGain is untouched."
        test_recipe:
          setup:
            - "One ATTESTED Investor with a 100000.00 LONG_TERM_CAPITAL gain realized 2026-07-01 on the SALE_DATE basis."
            - "One SELF_CERTIFIED Fund and one DEFERRED election of the full 100000.00 made at the clock instant 2026-08-01 (31 days from basis, well inside the window)."
          setup_api_calls:
            - call: "POST /qof/investors"
              payload: { legal_name: "Ines Partial", taxpayer_type: "INDIVIDUAL", compliance_attestation_status: "ATTESTED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { inv_id: $.data.id }
            - call: "POST /qof/eligible-gains"
              payload: { investor_id: "${inv_id}", gain_character: "LONG_TERM_CAPITAL", eligible_amount: 100000.00, realization_date: "2026-07-01T00:00:00Z", deadline_basis: "SALE_DATE" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { gain_id: $.data.id }
            - call: "POST /qof/funds"
              payload: { name: "Inclusion Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { fund_v: $.data.version }
            - call: "POST /qof/deferral-elections"
              payload: { eligible_gain_id: "${gain_id}", fund_id: "${fund_id}", elected_amount: 100000.00, expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { elect_id: $.data.id }
          trigger:
            - call: "POST /qof/deferral-elections/${elect_id}/inclusion-events"
              payload: { event_type: "PARTIAL_REDEMPTION", included_fraction: 0.4000 }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { ev_id: $.data.id, gross: $.data.gross_inclusion_amount, offset: $.data.basis_offset_amount, net: $.data.net_inclusion_amount, is_full: $.data.is_full }
            - call: "GET /qof/investors/${inv_id}"
              as: Investor
              as_user_id: "${inv_id}"
              captures: { inv_outstanding: $.data.deferred_gain_outstanding, inv_included: $.data.included_gain_total }
          assert:
            - "HTTP 201; InclusionEvent.${ev_id}.holding_days == 0 and holding_tier_applied == UNDER_FIVE"
            - "${gross} == 40000.00, ${offset} == 0.00 (step_pct 0.00 under five years), ${net} == 40000.00, ${is_full} == false"
            - "DeferralElection.${elect_id}.status == INCLUDED_PARTIAL"
            - "DeferralElection.${elect_id}.included_amount == 40000.00 and included_fraction_total == 0.4000"
            - "DeferralElection.${elect_id}.deferred_remaining == 60000.00 == round(100000.00 * (1.0000 - 0.4000), 2)"
            - "DeferralElection.${elect_id}.version == 2"
            - "${inv_outstanding} == 60000.00 and ${inv_included} == 40000.00"
            - "EligibleGain.${gain_id}.status == FULLY_INVESTED with elected_amount 100000.00 and unelected_amount 0.00 (inclusion does not give gain dollars back)"
            - "Fund.${fund_id}.deferred_gain_committed == 100000.00 (the fund's committed capital tracks elected_amount, not inclusion)"

      - name: fund_asset_disposal_reduces_fund_aggregate_ledger
        claim_type: ledger_sync
        grounds:
          - state_machines.FundAsset.HELD_to_DISPOSED
          - entities.Fund.fields.aggregate_asset_basis
          - endpoints[POST /qof/fund-assets/{id}/dispose]
        distinguishing_aspect: "Before/after reconciliation of the fund's derived basis ledger across one disposal: all four aggregates are read, the QUALIFIED asset is disposed, and all four are re-read — 750000.00/600000.00/850000.00/700000.00 collapses to 150000.00/0.00/150000.00/0.00, exactly the remaining HELD row."
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund holding a QUALIFIED asset (cost 600000.00, AFS 700000.00) and a CASH asset (cost and AFS 150000.00)."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Ledger Sync Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZ_BUSINESS_PROPERTY", acquisition_date: "2026-01-15T00:00:00Z", unadjusted_cost_basis: 600000.00, afs_fair_value: 700000.00, original_use_in_zone: true }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { good_id: $.data.id }
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "CASH", acquisition_date: "2026-01-20T00:00:00Z", unadjusted_cost_basis: 150000.00, afs_fair_value: 150000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { cash_id: $.data.id }
            - call: "GET /qof/funds/${fund_id}"
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { basis_before: $.data.aggregate_asset_basis, qual_before: $.data.aggregate_qualified_basis, afs_before: $.data.aggregate_afs_value, qual_afs_before: $.data.aggregate_qualified_afs_value }
          trigger:
            - call: "POST /qof/fund-assets/${good_id}/dispose"
              payload: { proceeds_amount: 800000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { disp_status: $.data.status, disp_at: $.data.disposed_at }
            - call: "GET /qof/funds/${fund_id}"
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { basis_after: $.data.aggregate_asset_basis, qual_after: $.data.aggregate_qualified_basis, afs_after: $.data.aggregate_afs_value, qual_afs_after: $.data.aggregate_qualified_afs_value }
          assert:
            - "${basis_before} == 750000.00, ${qual_before} == 600000.00, ${afs_before} == 850000.00, ${qual_afs_before} == 700000.00"
            - "HTTP 200; ${disp_status} == DISPOSED and ${disp_at} == 2026-08-01T00:00:00Z"
            - "FundAsset.${good_id}.proceeds_amount == 800000.00 (proceeds are recorded on the asset, never added to any Fund aggregate)"
            - "${basis_after} == 150000.00 and ${qual_after} == 0.00"
            - "${afs_after} == 150000.00 and ${qual_afs_after} == 0.00"
            - "each after-value equals the sum over the remaining HELD/IMPROVING rows, i.e. FundAsset.${cash_id} alone"
            - "FundAsset.${cash_id}.status == HELD and version == 1 (the sibling row is untouched)"

      - name: eligible_gain_revocation_reverses_every_side_effect_corner
        claim_type: compensation
        grounds:
          - state_machines.DeferralElection.DEFERRED_to_REVOKED
          - state_machines.EligibleGain
        distinguishing_aspect: "The compensation corner — an undo transition reverses all of the forward transition's side effects with no drift."
        excluded_because:
          difficulty_instance: eligible_gain_dollars_conserved_across_revocation
          rationale: "That §1.8 compensating_invariant instance elects, revokes and then re-reads the gain, the election, the fund and the investor, asserting unelected_amount is restored to the cent and the gain's status has cycled back — the full no-drift claim for the only undo transition in §1.2."

      - name: business_test_at_risk_branch_does_not_promote_assets
        claim_type: conditional_cascade
        grounds:
          - state_machines.BusinessTest.MEASURED_to_FAILED
          - state_machines.QOZBusiness.UNTESTED_to_AT_RISK
          - calculations.qozb_prong_evaluation
        distinguishing_aspect: "The FAILED branch's asset cascade is conditional on WHICH prong failed: with nqfp_prong PASS and gross_income_prong FAIL the business only warns (AT_RISK) and the QOZB_EQUITY asset's qualification is deliberately left alone, so the fund's qualified basis stays 0.00 and no DISQUALIFIED cascade runs."
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund, one UNTESTED QOZBusiness (declared_nqfp_amount 10000.00, total_asset_value 1000000.00) and one QOZB_EQUITY FundAsset of 400000.00 pointing at it."
            - "One BusinessTest measured by co-measurer-1 under GROSS_INCOME_ACTUAL with zone income 300000.00 of 1000000.00 (30.0000, FAIL), intangibles 500000.00 of 1000000.00 (50.0000, PASS) and NQFP 10000.00 of 1000000.00 (1.0000, PASS)."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "At Risk Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/qoz-businesses"
              payload: { fund_id: "${fund_id}", legal_name: "At Risk Operating LLC", zone_tract_code: "12345678910", declared_nqfp_amount: 10000.00, total_asset_value: 1000000.00, total_tangible_property_basis: 800000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { biz_id: $.data.id }
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZB_EQUITY", qoz_business_id: "${biz_id}", acquisition_date: "2026-02-01T00:00:00Z", unadjusted_cost_basis: 400000.00, afs_fair_value: 400000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { asset_id: $.data.id, qual_before: $.data.qualification }
            - call: "POST /qof/qoz-businesses/${biz_id}/business-tests"
              payload: { testing_date: "2026-06-30T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { bt_id: $.data.id }
            - call: "POST /qof/business-tests/${bt_id}/measure"
              payload: { safe_harbor_used: "GROSS_INCOME_ACTUAL", gross_income_zone_amount: 300000.00, gross_income_total_amount: 1000000.00, intangibles_zone_use_amount: 500000.00, intangibles_total_amount: 1000000.00, total_asset_value_measured: 1000000.00 }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { gi_pct: $.data.gross_income_pct, int_pct: $.data.intangibles_pct, nqfp_pct: $.data.nqfp_pct, nqfp_prong: $.data.nqfp_prong }
          trigger:
            - call: "POST /qof/business-tests/${bt_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
              captures: { bt_status: $.data.status }
            - call: "GET /qof/fund-assets/${asset_id}"
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { qual_after: $.data.qualification }
          assert:
            - "${gi_pct} == 30.0000 with gross_income_prong FAIL, ${int_pct} == 50.0000 with intangibles_prong PASS, ${nqfp_pct} == 1.0000 with ${nqfp_prong} == PASS"
            - "HTTP 200 and ${bt_status} == FAILED with certified_by_user_id == co-certifier-1"
            - "QOZBusiness.${biz_id}.qualification_status == AT_RISK and consecutive_failed_business_tests == 1"
            - "${qual_before} == NONQUALIFIED and ${qual_after} == NONQUALIFIED (the AT_RISK branch touches no FundAsset)"
            - "Fund.${fund_id}.aggregate_qualified_basis == 0.00 and aggregate_asset_basis == 400000.00"
            - "Fund.${fund_id}.compliance_posture == UNTESTED (no AssetTest was certified, so no penalty path opened)"
            - "no PenaltyAssessment row exists for Fund.${fund_id}"

      - name: consecutive_fail_decertification_cascade_corner
        claim_type: cascade_down
        grounds:
          - state_machines.Fund.compliance_posture.DEFICIENT_to_FAILED_FINAL
          - state_machines.Fund.certification_status.SELF_CERTIFIED_to_DECERTIFIED
        distinguishing_aspect: "The cascade-down corner — one parent change propagates to children, with only the non-terminal children affected."
        excluded_because:
          difficulty_instance: second_consecutive_failed_test_decertification_chain
          rationale: "That §1.8 transitive_cascade instance certifies a second consecutive FAIL and walks all four links to the InclusionEvent fan-out over every non-terminal DeferralElection and the Investor rollups, which is the deepest cascade-down chain declared in §1.2."

      - name: asset_test_measure_guarded_by_fund_certification_corner
        claim_type: guarded_transitions
        grounds:
          - state_machines.AssetTest.DRAFT_to_MEASURED
          - validations[priority=11]
        distinguishing_aspect: "The guarded-transition corner — AssetTest DRAFT -> MEASURED is legal only while a different entity (the owning Fund) sits in SELF_CERTIFIED."
        excluded_because:
          difficulty_instance: asset_test_measure_requires_self_certified_fund
          rationale: "That §1.8 cross_entity_state_dependency instance measures the same DRAFT test twice — once under a DRAFT fund (refused with ERR_FUND_NOT_CERTIFIED) and once after self-certification (accepted) — which is precisely the cross-entity guard claim for this transition."

  - section: calculations
    instances:
      - name: business_test_fifty_pct_hours_prong_uses_declared_percentage
        claim_type: correct_result
        grounds:
          - calculations.qozb_prong_evaluation
          - endpoints[POST /qof/business-tests/{id}/measure]
          - state_machines.QOZBusiness.UNTESTED_to_QUALIFIED
        distinguishing_aspect: "The FIFTY_PCT_HOURS branch of the gross-income prong takes hours_zone_pct verbatim (62.5000) and IGNORES the supplied zone/total income amounts, which would have produced 10.0000 and a failing prong; all three prongs then pass and the QUALIFIED cascade promotes the QOZB_EQUITY asset."
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund, one UNTESTED QOZBusiness with declared_nqfp_amount 20000.00 and total_asset_value 1000000.00, and one QOZB_EQUITY FundAsset of 400000.00 pointing at it."
            - "One DRAFT BusinessTest on testing_date 2026-06-30."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Hours Harbor Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/qoz-businesses"
              payload: { fund_id: "${fund_id}", legal_name: "Hours Harbor Operating LLC", zone_tract_code: "12345678910", declared_nqfp_amount: 20000.00, total_asset_value: 1000000.00, total_tangible_property_basis: 850000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { biz_id: $.data.id }
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZB_EQUITY", qoz_business_id: "${biz_id}", acquisition_date: "2026-02-01T00:00:00Z", unadjusted_cost_basis: 400000.00, afs_fair_value: 400000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { asset_id: $.data.id }
            - call: "POST /qof/qoz-businesses/${biz_id}/business-tests"
              payload: { testing_date: "2026-06-30T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { bt_id: $.data.id }
          trigger:
            - call: "POST /qof/business-tests/${bt_id}/measure"
              payload: { safe_harbor_used: "FIFTY_PCT_HOURS", hours_zone_pct: 62.5000, gross_income_zone_amount: 100000.00, gross_income_total_amount: 1000000.00, intangibles_zone_use_amount: 450000.00, intangibles_total_amount: 1000000.00, total_asset_value_measured: 1000000.00 }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { gi_pct: $.data.gross_income_pct, gi_prong: $.data.gross_income_prong, int_pct: $.data.intangibles_pct, nqfp_pct: $.data.nqfp_pct, nqfp_measured: $.data.nqfp_amount_measured }
            - call: "POST /qof/business-tests/${bt_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
              captures: { bt_status: $.data.status }
            - call: "GET /qof/fund-assets/${asset_id}"
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { asset_qual: $.data.qualification }
          assert:
            - "${gi_pct} == 62.5000 == round_half_up(hours_zone_pct, 4), NOT 10.0000 from the income amounts, and ${gi_prong} == PASS (>= 50.0000)"
            - "${int_pct} == 45.0000 == round_half_up(450000.00 / 1000000.00 * 100, 4) with intangibles_prong PASS (>= 40.0000)"
            - "${nqfp_measured} == 20000.00 and ${nqfp_pct} == 2.0000 with nqfp_prong PASS (<= 5.0000)"
            - "BusinessTest.${bt_id}.measured_by_user_id == co-measurer-1 and status == MEASURED after the measure call"
            - "${bt_status} == PASSED (all three prongs PASS)"
            - "QOZBusiness.${biz_id}.qualification_status == QUALIFIED and consecutive_failed_business_tests == 0"
            - "${asset_qual} == QUALIFIED and Fund.${fund_id}.aggregate_qualified_basis == 400000.00"

      - name: wcsh_land_acquisition_expenditure_excluded_from_spent_total
        claim_type: input_set_filtering
        grounds:
          - calculations.wcsh_pacing_compliance
          - entities.WorkingCapitalPlan.fields.spent_total
          - entities.CapitalExpenditure.fields.expenditure_kind
        distinguishing_aspect: "spent_total admits only OPERATING_WORKING_CAPITAL and CAPITALIZED_IMPROVEMENT dollars: a 50000.00 LAND_ACQUISITION row on the same ACTIVE plan leaves spent_total at 0.00 and gets no schedule_month_index, while an identical 50000.00 OPERATING_WORKING_CAPITAL row moves spent_total, unspent_amount, the business's shelter and its nqfp_amount."
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund and one QOZBusiness with declared_nqfp_amount 300000.00."
            - "One ACTIVE WorkingCapitalPlan covering 300000.00 over three buckets of 100000.00 each, window_start 2026-01-01."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Kind Filter Fund", entity_type: "PARTNERSHIP", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/qoz-businesses"
              payload: { fund_id: "${fund_id}", legal_name: "Kind Filter Operating LLC", zone_tract_code: "12345678910", declared_nqfp_amount: 300000.00, total_asset_value: 1000000.00, total_tangible_property_basis: 700000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { biz_id: $.data.id }
            - call: "POST /qof/wcsh-plans"
              payload: { qoz_business_id: "${biz_id}", window_start: "2026-01-01T00:00:00Z", covered_amount: 300000.00, written_plan_reference: "WP-2662-KIND-1", schedule_month_count: 3, spend_schedule: [ { month_index: 1, planned_amount: 100000.00 }, { month_index: 2, planned_amount: 100000.00 }, { month_index: 3, planned_amount: 100000.00 } ] }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { plan_id: $.data.id }
            - call: "POST /qof/wcsh-plans/${plan_id}/activate"
              payload: {}
              as: FundManager
              as_user_id: "mgr-fund-1"
          trigger:
            - call: "POST /qof/wcsh-plans/${plan_id}/expenditures"
              payload: { amount: 50000.00, expenditure_kind: "LAND_ACQUISITION" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { land_id: $.data.id, land_month: $.data.schedule_month_index, land_counts: $.data.counts_toward_basis }
            - call: "GET /qof/wcsh-plans/${plan_id}"
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { spent_after_land: $.data.spent_total, unspent_after_land: $.data.unspent_amount }
            - call: "POST /qof/wcsh-plans/${plan_id}/expenditures"
              payload: { amount: 50000.00, expenditure_kind: "OPERATING_WORKING_CAPITAL" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { ops_id: $.data.id, ops_month: $.data.schedule_month_index }
            - call: "GET /qof/qoz-businesses/${biz_id}"
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { prot_final: $.data.wcsh_protected_amount, nqfp_final: $.data.nqfp_amount }
          assert:
            - "${spent_after_land} == 0.00 and ${unspent_after_land} == 300000.00 (the LAND_ACQUISITION row is outside the input set)"
            - "${land_month} == null (the excluded row never enters the waterfall) and ${land_counts} == false"
            - "${ops_month} == 1 (the operating dollars land in the first bucket, which has 100000.00 of room)"
            - "WorkingCapitalPlan.${plan_id}.spent_total == 50000.00 and unspent_amount == 250000.00"
            - "WorkingCapitalPlan.${plan_id}.overspill_amount == 0.00 and status == ACTIVE"
            - "${prot_final} == 250000.00 == covered_amount - spent_total"
            - "${nqfp_final} == 50000.00 == max(0.00, 300000.00 + 0.00 - 250000.00)"
            - "both CapitalExpenditure rows exist with wcsh_plan_id == ${plan_id} and improvement_project_id == null (${land_id} and ${ops_id})"

      - name: failed_test_penalty_constants_corner
        claim_type: constants_applied
        grounds:
          - calculations.failed_test_penalty
          - calculations.penalty_cure_credit_netting
        distinguishing_aspect: "The constants corner — UNDERPAYMENT_ANNUAL_RATE, the cure-credit tier break, caps and floor must all be applied at their declared values and in the declared order."
        excluded_because:
          difficulty_instance: failed_test_penalty_per_month_rounding_order
          rationale: "That §1.8 combinatorial_formula instance pins 0.08/12 per-month rounding for two different shortfalls (1999.98 and 4000.02) and then nets the credits through the tier ladder, exercising every constant in both money formulas."

      - name: inclusion_amount_rounds_half_up_at_the_half_cent
        claim_type: precision
        grounds:
          - calculations.inclusion_event_amount
          - entities.InclusionEvent.fields.gross_inclusion_amount
          - entities.DeferralElection.fields.deferred_remaining
        distinguishing_aspect: "An odd-cent election of 99999.99 halved lands exactly on a half cent: round_half_up(49999.995, 2) is 50000.00 at BOTH the inclusion figure and the deferred remainder, so the two halves visibly sum to 100000.00 — one cent above the election — which is the declared consequence of rounding each field independently rather than deriving one from the other."
        test_recipe:
          setup:
            - "One ATTESTED Investor with a 99999.99 LONG_TERM_CAPITAL gain realized 2026-07-01 on the SALE_DATE basis."
            - "One SELF_CERTIFIED Fund and one DEFERRED election for the entire 99999.99 filed at the clock instant 2026-08-01."
          setup_api_calls:
            - call: "POST /qof/investors"
              payload: { legal_name: "Odette Halfcent", taxpayer_type: "INDIVIDUAL", compliance_attestation_status: "ATTESTED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { inv_id: $.data.id }
            - call: "POST /qof/eligible-gains"
              payload: { investor_id: "${inv_id}", gain_character: "LONG_TERM_CAPITAL", eligible_amount: 99999.99, realization_date: "2026-07-01T00:00:00Z", deadline_basis: "SALE_DATE" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { gain_id: $.data.id }
            - call: "POST /qof/funds"
              payload: { name: "Half Cent Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { fund_v: $.data.version }
            - call: "POST /qof/deferral-elections"
              payload: { eligible_gain_id: "${gain_id}", fund_id: "${fund_id}", elected_amount: 99999.99, expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { elect_id: $.data.id }
          trigger:
            - call: "POST /qof/deferral-elections/${elect_id}/inclusion-events"
              payload: { event_type: "SALE_OF_INTEREST", included_fraction: 0.5000 }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { gross: $.data.gross_inclusion_amount, offset: $.data.basis_offset_amount, net: $.data.net_inclusion_amount }
            - call: "GET /qof/deferral-elections/${elect_id}"
              as: Investor
              as_user_id: "${inv_id}"
              captures: { inc_total: $.data.included_amount, remaining: $.data.deferred_remaining, frac_total: $.data.included_fraction_total }
          assert:
            - "${gross} == 50000.00 == round_half_up(99999.99 * 0.5000, 2); round_half_down or banker's rounding would give 49999.99 and fail"
            - "${offset} == 0.00 (UNDER_FIVE step_pct 0.00) and ${net} == 50000.00"
            - "${frac_total} == 0.5000 and ${inc_total} == 50000.00"
            - "${remaining} == 50000.00 == round_half_up(99999.99 * (1.0000 - 0.5000), 2)"
            - "included_amount + deferred_remaining == 100000.00, one cent above elected_amount 99999.99, because each field rounds half-up independently"
            - "DeferralElection.${elect_id}.status == INCLUDED_PARTIAL (0.5000 < 1.0000) and InclusionEvent.is_full == false"

      - name: asset_test_threshold_boundary_corner
        claim_type: threshold
        grounds:
          - calculations.semiannual_asset_test_ratio
          - entities.AssetTest.fields.ratio_pct
        distinguishing_aspect: "The threshold corner — the 90-percent comparison must be inclusive and must be taken on the rounded 4-dp ratio."
        excluded_because:
          difficulty_instance: asset_test_ratio_exactly_ninety_passes
          rationale: "That §1.8 boundary_precision_check instance measures two sibling funds at 90.0000 and 89.9900 across the inclusive threshold and asserts the PASS/FAIL flip plus the shortfall figures, covering threshold-1 / at-threshold behaviour for this calculation."

      - name: improvement_project_running_total_after_second_expenditure
        claim_type: aggregation
        grounds:
          - calculations.substantial_improvement_ratio
          - entities.ImprovementProject.fields.qualified_additions_total
          - endpoints[POST /qof/improvement-projects/{id}/expenditures]
        distinguishing_aspect: "The improvement running total is correct after each add, not only at the end: 200000.00 against a 500000.00 basis reads 40.0000 and stays OPEN, the second 300000.00 lifts it to exactly 100.0000, and only then does evaluate reach SATISFIED and promote the asset."
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund holding one QOZ_BUSINESS_PROPERTY asset of 500000.00 with original_use_in_zone false, so it is IMPROVEMENT_PENDING."
            - "One OPEN ASSET_BY_ASSET ImprovementProject on that asset with window_start 2026-01-01 (window_end 2028-07-01), version captured."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Running Total Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZ_BUSINESS_PROPERTY", acquisition_date: "2026-01-05T00:00:00Z", unadjusted_cost_basis: 500000.00, afs_fair_value: 500000.00, original_use_in_zone: false }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { asset_id: $.data.id }
            - call: "POST /qof/improvement-projects"
              payload: { fund_asset_id: "${asset_id}", window_start: "2026-01-01T00:00:00Z", aggregation_method: "ASSET_BY_ASSET" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { proj_id: $.data.id, proj_v1: $.data.version, basis_snapshot: $.data.basis_at_acquisition }
          trigger:
            - call: "POST /qof/improvement-projects/${proj_id}/expenditures"
              payload: { amount: 200000.00, expenditure_kind: "CAPITALIZED_IMPROVEMENT", expected_project_version: "${proj_v1}" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "GET /qof/improvement-projects/${proj_id}"
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { proj_v2: $.data.version, add1: $.data.qualified_additions_total, ratio1: $.data.improvement_ratio_pct, status1: $.data.status }
            - call: "POST /qof/improvement-projects/${proj_id}/expenditures"
              payload: { amount: 300000.00, expenditure_kind: "CAPITALIZED_IMPROVEMENT", expected_project_version: "${proj_v2}" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/improvement-projects/${proj_id}/evaluate"
              payload: {}
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { add2: $.data.qualified_additions_total, ratio2: $.data.improvement_ratio_pct, status2: $.data.status }
            - call: "GET /qof/fund-assets/${asset_id}"
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { asset_status: $.data.status, asset_qual: $.data.qualification, asset_basis: $.data.adjusted_basis }
          assert:
            - "${basis_snapshot} == 500000.00 and ${proj_v1} == 1"
            - "${add1} == 200000.00, ${ratio1} == 40.0000, ${status1} == OPEN, ${proj_v2} == 2"
            - "${add2} == 500000.00 and ${ratio2} == 100.0000 == round_half_up(500000.00 / 500000.00 * 100, 4)"
            - "${status2} == SATISFIED (ratio >= SI_REQUIRED_PCT 100.0000 and the clock 2026-08-01 is inside the window)"
            - "${asset_status} == HELD and ${asset_qual} == QUALIFIED (the SATISFIED cascade)"
            - "${asset_basis} == 1000000.00 == 500000.00 + 200000.00 + 300000.00 (both rows count_toward_basis)"
            - "Fund.${fund_id}.aggregate_qualified_basis == 500000.00 (aggregates use unadjusted_cost_basis, not adjusted_basis)"

      - name: wcsh_expenditure_fills_earliest_bucket_first
        claim_type: waterfall_allocation
        grounds:
          - calculations.wcsh_pacing_compliance
          - entities.CapitalExpenditure.fields.schedule_month_index
          - endpoints[POST /qof/wcsh-plans/{id}/evaluate-checkpoint]
        distinguishing_aspect: "A single 120000.00 spend against three 100000.00 buckets fills bucket 1 completely before spilling 20000.00 into bucket 2, so schedule_month_index is 2 with zero overspill, and the month-1 checkpoint then sees actual_cumulative 100000.00 against required 100000.00 — pacing_shortfall 0.00 and the plan survives."
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund and one QOZBusiness with declared_nqfp_amount 300000.00."
            - "One ACTIVE WorkingCapitalPlan covering 300000.00 over three buckets of 100000.00 each, window_start 2026-01-01."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Waterfall Fund", entity_type: "PARTNERSHIP", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/qoz-businesses"
              payload: { fund_id: "${fund_id}", legal_name: "Waterfall Operating LLC", zone_tract_code: "12345678910", declared_nqfp_amount: 300000.00, total_asset_value: 1000000.00, total_tangible_property_basis: 700000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { biz_id: $.data.id }
            - call: "POST /qof/wcsh-plans"
              payload: { qoz_business_id: "${biz_id}", window_start: "2026-01-01T00:00:00Z", covered_amount: 300000.00, written_plan_reference: "WP-2662-WATERFALL-1", schedule_month_count: 3, spend_schedule: [ { month_index: 1, planned_amount: 100000.00 }, { month_index: 2, planned_amount: 100000.00 }, { month_index: 3, planned_amount: 100000.00 } ] }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { plan_id: $.data.id }
            - call: "POST /qof/wcsh-plans/${plan_id}/activate"
              payload: {}
              as: FundManager
              as_user_id: "mgr-fund-1"
          trigger:
            - call: "POST /qof/wcsh-plans/${plan_id}/expenditures"
              payload: { amount: 120000.00, expenditure_kind: "OPERATING_WORKING_CAPITAL" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { exp_id: $.data.id, reached: $.data.schedule_month_index }
            - call: "POST /qof/wcsh-plans/${plan_id}/evaluate-checkpoint"
              payload: { checkpoint_month_index: 1 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { cp_status: $.data.status, cp_shortfall: $.data.pacing_shortfall, cp_index: $.data.last_checkpoint_month_index }
          assert:
            - "${reached} == 2 (bucket 1 absorbed 100000.00, bucket 2 absorbed the remaining 20000.00)"
            - "WorkingCapitalPlan.${plan_id}.overspill_amount == 0.00 (every dollar found a bucket)"
            - "WorkingCapitalPlan.${plan_id}.spent_total == 120000.00 and unspent_amount == 180000.00"
            - "${cp_shortfall} == 0.00 == max(0.00, 100000.00 - 100000.00) at month 1"
            - "${cp_status} == ACTIVE and ${cp_index} == 1"
            - "QOZBusiness.${biz_id}.wcsh_protected_amount == 180000.00 and nqfp_amount == 120000.00"
            - "CapitalExpenditure.${exp_id}.counts_toward_basis == false (OPERATING_WORKING_CAPITAL never adds basis)"

      - name: wcsh_blowout_propagation_corner
        claim_type: constraint_propagation
        grounds:
          - calculations.wcsh_pacing_compliance
          - calculations.qozb_prong_evaluation
          - state_machines.WorkingCapitalPlan.ACTIVE_to_BLOWN
        distinguishing_aspect: "The constraint-propagation corner — one changed figure must travel the whole chain and settle at a fixed point."
        excluded_because:
          difficulty_instance: wcsh_blowout_disqualifies_business_chain
          rationale: "That §1.8 transitive_cascade instance blows a plan at a checkpoint and follows the released dollars through nqfp_amount, the re-derived nqfp prong, the DISQUALIFIED business, the flipped QOZB_EQUITY asset and the fund's qualified aggregates — the full propagation chain."

      - name: asset_test_valuation_variant_divergence_corner
        claim_type: variant_divergence
        grounds:
          - calculations.semiannual_asset_test_ratio.variants
        distinguishing_aspect: "The variant-divergence corner — identical asset rows measured under both valuation variants must produce different ratios and opposite verdicts."
        excluded_because:
          difficulty_instance: asset_test_valuation_variant_divergence
          rationale: "That §1.8 dual_variant_calc instance measures the same two asset rows under UNADJUSTED_COST_BASIS (85.0000, FAIL, shortfall 50000.00) and APPLICABLE_FINANCIAL_STATEMENT (95.0000, PASS), asserting both sides and the delta."

      - name: asset_test_valuation_method_resolved_at_creation_from_fund_default
        claim_type: variant_selection
        grounds:
          - entities.AssetTest.fields.valuation_method
          - endpoints[POST /qof/funds/{id}/asset-tests]
          - entities.Fund.fields.asset_test_valuation_method
        distinguishing_aspect: "Variant SELECTION rather than divergence: on one fund whose default is APPLICABLE_FINANCIAL_STATEMENT, the test created without an override inherits AFS and passes at 95.0000, while an adjacent-period test created with valuation_method_override UNADJUSTED_COST_BASIS is pinned to cost and fails at 80.0000 — the method is frozen at creation, not resolved at measurement."
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund created with asset_test_valuation_method APPLICABLE_FINANCIAL_STATEMENT."
            - "It holds one QUALIFIED QOZ_BUSINESS_PROPERTY asset (cost 800000.00, AFS 950000.00) and one CASH asset (cost 200000.00, AFS 50000.00)."
            - "Two DRAFT AssetTests over the adjacent half-open periods [2026-01-01, 2026-07-01) and [2026-07-01, 2027-01-01)."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Selection Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1", asset_test_valuation_method: "APPLICABLE_FINANCIAL_STATEMENT" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZ_BUSINESS_PROPERTY", acquisition_date: "2026-01-10T00:00:00Z", unadjusted_cost_basis: 800000.00, afs_fair_value: 950000.00, original_use_in_zone: true }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "CASH", acquisition_date: "2026-01-10T00:00:00Z", unadjusted_cost_basis: 200000.00, afs_fair_value: 50000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
          trigger:
            - call: "POST /qof/funds/${fund_id}/asset-tests"
              payload: { measurement_date: "2026-06-30T00:00:00Z", period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { test_default: $.data.id, method_default: $.data.valuation_method }
            - call: "POST /qof/funds/${fund_id}/asset-tests"
              payload: { measurement_date: "2026-12-31T00:00:00Z", period_start: "2026-07-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", valuation_method_override: "UNADJUSTED_COST_BASIS" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { test_override: $.data.id, method_override: $.data.valuation_method }
            - call: "POST /qof/asset-tests/${test_default}/measure"
              payload: {}
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { ratio_default: $.data.ratio_pct, result_default: $.data.result }
            - call: "POST /qof/asset-tests/${test_override}/measure"
              payload: {}
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { ratio_override: $.data.ratio_pct, result_override: $.data.result, shortfall_override: $.data.shortfall_amount, months_override: $.data.failed_month_count }
          assert:
            - "${method_default} == APPLICABLE_FINANCIAL_STATEMENT (inherited from the fund at creation, no override supplied)"
            - "${method_override} == UNADJUSTED_COST_BASIS (the request override wins for this test only)"
            - "${ratio_default} == 95.0000 == round_half_up(950000.00 / 1000000.00 * 100, 4) and ${result_default} == PASS"
            - "${ratio_override} == 80.0000 == round_half_up(800000.00 / 1000000.00 * 100, 4) and ${result_override} == FAIL"
            - "${shortfall_override} == 100000.00 == round_half_up(0.90 * 1000000.00 - 800000.00, 2)"
            - "${months_override} == 6 == (12 - 7) + 1 for measurement_date 2026-12-31 against period_start 2026-07-01"
            - "both tests read included_asset_count == 2; neither measurement changed the other's valuation_method"
            - "Fund.${fund_id}.last_test_measurement_date == 2026-12-31T00:00:00Z after the second measurement"

  - section: validations
    instances:
      - name: cure_basis_treated_as_failure_cannot_be_approved
        claim_type: violation_to_error
        grounds:
          - validations[priority=39]
          - errors[ERR_CURE_BASIS_NOT_APPROVABLE]
          - state_machines.PenaltyAssessment.CURE_REQUESTED_to_CURED
        distinguishing_aspect: "Priority 39 is the only rule keyed on the basis of the pending request rather than on the decision: APPROVE against a TREATED_AS_FAILURE basis is 422 ERR_CURE_BASIS_NOT_APPROVABLE, and because the refused decision writes nothing, the assessment stays CURE_REQUESTED with cure_credit_amount 0.00 and the fund's conserved month count untouched at 6."
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund holding a single 1000000.00 CASH asset, so its asset test measures 0.0000 and fails."
            - "One AssetTest over [2026-01-01, 2026-07-01) with measurement_date 2026-06-30, measured by co-measurer-1 and certified CERTIFIED_FAIL by co-certifier-1, which creates the PenaltyAssessment (shortfall 900000.00, 6 failed months, gross penalty 36000.00)."
            - "A cure request already filed on the TREATED_AS_FAILURE basis, leaving the assessment CURE_REQUESTED."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Cure Basis Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "CASH", acquisition_date: "2026-01-05T00:00:00Z", unadjusted_cost_basis: 1000000.00, afs_fair_value: 1000000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/funds/${fund_id}/asset-tests"
              payload: { measurement_date: "2026-06-30T00:00:00Z", period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { at_id: $.data.id }
            - call: "POST /qof/asset-tests/${at_id}/measure"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { shortfall: $.data.shortfall_amount, months: $.data.failed_month_count }
            - call: "POST /qof/asset-tests/${at_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
            - call: "GET /qof/penalty-assessments?fund_id=${fund_id}"
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
              captures: { pa_id: "$.data[0].id" }
            - call: "POST /qof/penalty-assessments/${pa_id}/cure-requests"
              payload: { cure_basis: "TREATED_AS_FAILURE", narrative_reference: "NARR-2662-TAF-1" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { pa_status: $.data.status }
          trigger:
            - call: "POST /qof/penalty-assessments/${pa_id}/cure-decisions"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
              captures: { err: $.data.error_id }
          assert:
            - "${shortfall} == 900000.00 and ${months} == 6 and ${pa_status} == CURE_REQUESTED"
            - "${err} == ERR_CURE_BASIS_NOT_APPROVABLE with HTTP 422"
            - "PenaltyAssessment.${pa_id}.status == CURE_REQUESTED (unchanged; the row is neither CURED nor UPHELD)"
            - "PenaltyAssessment.${pa_id}.gross_penalty_amount == 36000.00 == 6000.00 * 6, cure_credit_amount == 0.00, net_penalty_amount == 36000.00"
            - "PenaltyAssessment.${pa_id}.decided_by_user_id == null and cure_attempt_count == 1"
            - "Fund.${fund_id}.cumulative_penalty_months == 6 and compliance_posture == CURE_PENDING"

      - name: related_party_cash_asset_passes_the_related_party_bar
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=18]
          - errors[ERR_RELATED_PARTY_ACQUISITION]
          - entities.FundAsset.fields.acquired_from_related_party
        distinguishing_aspect: "The related-party bar is scoped to QOZ_BUSINESS_PROPERTY only: the identical acquired_from_related_party true flag is accepted (201) on a CASH holding and refused (422) on property, so the rule must be read as a class-conditioned bar rather than a blanket flag check."
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund holding nothing."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Related Party Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
          trigger:
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "CASH", acquisition_date: "2026-02-01T00:00:00Z", unadjusted_cost_basis: 250000.00, afs_fair_value: 250000.00, acquired_from_related_party: true }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { cash_id: $.data.id, cash_qual: $.data.qualification }
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZ_BUSINESS_PROPERTY", acquisition_date: "2026-02-01T00:00:00Z", unadjusted_cost_basis: 250000.00, afs_fair_value: 250000.00, acquired_from_related_party: true, original_use_in_zone: true }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { err: $.data.error_id }
          assert:
            - "the CASH create returns HTTP 201 with ${cash_qual} == NONQUALIFIED (accepted, but never in the numerator)"
            - "${err} == ERR_RELATED_PARTY_ACQUISITION with HTTP 422 for the property create"
            - "Fund.${fund_id}.aggregate_asset_basis == 250000.00 (only the cash row landed)"
            - "Fund.${fund_id}.aggregate_qualified_basis == 0.00"
            - "GET /qof/fund-assets returns total_count == 1 with FundAsset.${cash_id} as the only row"

      - name: fund_gate_before_window_priority_corner
        claim_type: priority_ordering
        grounds:
          - validations[priority=11]
          - validations[priority=19]
        distinguishing_aspect: "The priority-ordering corner — when two rules are violated at once the lower-numbered rule's error must be the one returned."
        excluded_because:
          difficulty_instance: fund_state_gate_precedes_180_day_window
          rationale: "That §1.8 priority_pair_validation_conflict instance elects into a DRAFT fund with a gain whose 180-day window has already closed and asserts the state-category error wins over the temporal one, with each rule shown firing alone."

      - name: attestation_before_ceiling_priority_corner
        claim_type: priority_conflict
        grounds:
          - validations[priority=16]
          - validations[priority=35]
        distinguishing_aspect: "The priority-conflict corner — a violation at priority P and another at priority P+N must answer with P's error."
        excluded_because:
          difficulty_instance: attestation_gate_precedes_amount_ceiling
          rationale: "That §1.8 instance files an over-ceiling election for a PENDING investor and asserts ERR_INVESTOR_NOT_ATTESTED rather than ERR_ELECTED_AMOUNT_EXCEEDS_GAIN, plus each rule in isolation."

      - name: election_depends_on_investor_state_corner
        claim_type: cross_entity
        grounds:
          - validations[priority=16]
          - entities.Investor.fields.compliance_attestation_status
        distinguishing_aspect: "The cross-entity-validation corner — the legality of a write depends on a different entity's state, tested both valid and invalid."
        excluded_because:
          difficulty_instance: deferral_election_blocked_by_investor_attestation
          rationale: "That §1.8 cross_entity_state_dependency instance refuses the election while the Investor is PENDING, flips the attestation via PATCH /qof/investors/{id}/attestation and replays the identical body to success, which is the both-sides cross-entity claim."

      - name: improvement_expenditure_after_window_close_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=23]
          - errors[ERR_EXPENDITURE_OUTSIDE_WINDOW]
          - entities.ImprovementProject.fields.window_end
        distinguishing_aspect: "The same expenditure body is legal at one clock instant and illegal at another: 200000.00 is accepted while the clock sits inside [2026-01-01, 2028-07-01) and refused 422 once the clock is advanced to 2028-08-01, because the 30-month window bound is exclusive and evaluated against the logical clock, not against the project's status."
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund holding a 500000.00 QOZ_BUSINESS_PROPERTY asset with original_use_in_zone false."
            - "One OPEN ASSET_BY_ASSET ImprovementProject with window_start 2026-01-01, so window_end is 2028-07-01."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Window Close Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZ_BUSINESS_PROPERTY", acquisition_date: "2026-01-05T00:00:00Z", unadjusted_cost_basis: 500000.00, afs_fair_value: 500000.00, original_use_in_zone: false }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { asset_id: $.data.id }
            - call: "POST /qof/improvement-projects"
              payload: { fund_asset_id: "${asset_id}", window_start: "2026-01-01T00:00:00Z", aggregation_method: "ASSET_BY_ASSET" }
              as: FundManager
              as_user_id: "mgr-fund-1"
