          - entities.Account.fields.balance_cents
          - "endpoints['POST /able/accounts/{id}/contributions']"
        distinguishing_aspect: "The contribution response itself (same request) reflects the updated Account version, and an immediately-following GET shows balance_cents already updated (no lag)."
        test_recipe:
          setup: ["OPEN account, empty ledger."]
          setup_api_calls:
            - call: "POST /able/programs"
              payload: { name: "CA ABLE", state_code: "CA", annual_contribution_cap_cents: 1900000, able_to_work_fpl_cents: 1506000, program_fee_bps: 30 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /able/investment-options"
              payload: { program_id: "${prog_id}", name: "Moderate", risk_tier: "MODERATE" }
              as: ProgramAdministrator
              captures: { opt_id: $.data.id }
            - call: "POST /able/beneficiaries"
              payload: { program_id: "${prog_id}", full_name: "Imm I", birth_date: "2005-03-01", disability_onset_date: "2018-06-01", state_code: "CA" }
              as: ProgramAdministrator
              captures: { ben_id: $.data.id }
            - call: "POST /able/beneficiaries/${ben_id}/certifications"
              payload: { basis: "SSI_SSDI_ENTITLEMENT", effective_date: "2026-01-01", expires_on: "2027-01-01" }
              as: ProgramAdministrator
              captures: { cert_id: $.data.id }
            - call: "POST /able/certifications/${cert_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
            - call: "POST /able/accounts"
              payload: { beneficiary_id: "${ben_id}", investment_option_id: "${opt_id}" }
              as: ProgramAdministrator
              captures: { acct_id: $.data.id, acct_v: $.data.version }
          trigger:
            - call: "POST /able/accounts/${acct_id}/contributions"
              payload: { contribution_type: "REGULAR", amount_cents: 250000, expected_account_version: "${acct_v}" }
              as: ProgramAdministrator
            - call: "GET /able/accounts/${acct_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { bal: $.data.balance_cents }
          assert:
            - "GET immediately after contribution shows Account.${acct_id}.balance_cents == 250000"
