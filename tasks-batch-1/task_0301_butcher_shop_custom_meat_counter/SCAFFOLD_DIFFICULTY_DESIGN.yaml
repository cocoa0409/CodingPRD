              as: Butcher
              captures: { lot_v: "$.data.version" }
            - call: "POST /custom-orders"
              payload: { customer_id: "${q_id}", order_kind: "STANDARD", lines: [ { cut_type_id: "${dr_id}", ordered_weight_g: 500 } ] }
              as: CounterClerk
              as_user_id: "${q_id}"
