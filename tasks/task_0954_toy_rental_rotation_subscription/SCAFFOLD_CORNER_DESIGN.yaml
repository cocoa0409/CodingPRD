scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: member_register_creation_and_defaults
        claim_type: creation_and_defaults
        grounds: [entities.Member, entities.Member.fields.status, entities.Member.fields.wallet_credit_cents]
        distinguishing_aspect: "Register with all required fields returns 201; system defaults applied: status ACTIVE, wallet_credit_cents 0, version 1, server-minted id."
        test_recipe:
          setup: ["Empty database; clock at default 2026-05-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.new@x.com", full_name: "New Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
          assert:
            - "Response 201; data.id is a server-minted UUID; status == ACTIVE; wallet_credit_cents == 0; version == 1; created_at/updated_at stamped"

      - name: member_register_duplicate_email_rejected
        claim_type: uniqueness_constraint
        grounds: [entities.Member.fields.email, "errors[ERR_EMAIL_TAKEN]"]
        distinguishing_aspect: "Second register with the same email fails ERR_EMAIL_TAKEN 409 (uniqueness is global, not per-status)."
        test_recipe:
          setup: ["Member with email dup@x.com already registered"]
          setup_api_calls:
            - call: "POST /toy-rental/members/register"
              payload: { email: "dup@x.com", full_name: "First", password: "pw" }
              as: Anonymous
          trigger:
            - call: "POST /toy-rental/members/register"
              payload: { email: "dup@x.com", full_name: "Second", password: "pw" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_EMAIL_TAKEN (HTTP 409); only one member with that email exists"

      - name: child_create_missing_required_birthdate_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.ChildProfile.fields.birthdate, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required field birthdate yields ERR_VALIDATION 400 before any state or business check."
        test_recipe:
          setup: ["Member M registered"]
          setup_api_calls:
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.req@x.com", full_name: "Req Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /toy-rental/members/${m_id}/children"
              payload: { name: "KidNoDate" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION (HTTP 400); no ChildProfile created"

      - name: child_create_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.ChildProfile.fields.developmental_stage, entities.ChildProfile.fields.age_months]
        distinguishing_aspect: "Client-supplied computed fields (developmental_stage, age_months) are rejected/ignored per strict-input rule ERR_VALIDATION; the server derives them from birthdate + clock."
        test_recipe:
          setup: ["Member M registered"]
          setup_api_calls:
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.cmp@x.com", full_name: "Cmp Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /toy-rental/members/${m_id}/children"
              payload: { name: "Kid", birthdate: "2025-01-15", developmental_stage: "EARLY_SCHOOL" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION (HTTP 400): computed/system fields are not accepted as input"

      - name: entity_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_MEMBER_NOT_FOUND]", "errors[ERR_BOX_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns the resource-specific 404 error id."
        test_recipe:
          setup: ["Member M registered (to authenticate reads)"]
          setup_api_calls:
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.nf@x.com", full_name: "NF Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /toy-rental/members/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: CustomerService
              captures: { err1: $.data.error_id }
            - call: "GET /toy-rental/rotation-boxes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: OperationsManager
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_MEMBER_NOT_FOUND (HTTP 404)"
            - "err2 == ERR_BOX_NOT_FOUND (HTTP 404)"

      - name: credit_ledger_entry_immutable_event
        claim_type: immutability
        grounds: [entities.CreditLedgerEntry]
        distinguishing_aspect: "CreditLedgerEntry is append-only (common_fields false): no update/delete endpoint exists; reads expose id + created_at only among common fields."
        test_recipe:
          setup: ["Member M with one +300 PROMO_CREDIT adjustment"]
          setup_api_calls:
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.led@x.com", full_name: "Led Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/wallet/adjustments"
              payload: { amount_cents: 300, reason: "PROMO_CREDIT", note: "seed" }
              as: CustomerService
          trigger:
            - call: "GET /toy-rental/members/${m_id}/wallet/ledger"
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Exactly 1 entry: amount_cents == 300, reason == PROMO_CREDIT; entry exposes id and created_at but no updated_at/version (append-only)"

      - name: list_pagination_envelope_defaults
        claim_type: listing
        grounds: [response_envelope, entities.CatalogItem]
        distinguishing_aspect: "List endpoints honor limit/offset with total_count and has_more; defaults limit=10 offset=0."
        test_recipe:
          setup: ["3 catalog items created"]
          setup_api_calls:
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "T1", min_age_months: 0, max_age_months: 12, developmental_stages: [INFANT], piece_count: 1, retail_value_cents: 1000, replacement_value_cents: 500 }
              as: PlatformAdmin
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "T2", min_age_months: 0, max_age_months: 12, developmental_stages: [INFANT], piece_count: 1, retail_value_cents: 1000, replacement_value_cents: 500 }
              as: PlatformAdmin
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "T3", min_age_months: 0, max_age_months: 12, developmental_stages: [INFANT], piece_count: 1, retail_value_cents: 1000, replacement_value_cents: 500 }
              as: PlatformAdmin
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.pag@x.com", full_name: "Pag Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /toy-rental/catalog-items?limit=2&offset=0"
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /toy-rental/catalog-items?limit=2&offset=2"
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Page 1: 2 items, total_count == 3, has_more == true"
            - "Page 2: 1 item, total_count == 3, has_more == false"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_subscription_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Subscription.ACTIVE_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel fails ERR_INVALID_STATE and fires no side effects."
        test_recipe:
          setup: ["Plan STD; member M; subscription cancelled once"]
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.term@x.com", full_name: "Term Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id }
            - call: "POST /toy-rental/subscriptions/${s_id}/cancel"
              payload: { reason: "first" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /toy-rental/subscriptions/${s_id}/cancel"
              payload: { reason: "second" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (HTTP 409); Subscription.${s_id}.status remains CANCELLED; cancel_reason still 'first'"

      - name: ship_empty_box_rejected_box_empty
        claim_type: precondition_enforcement
        grounds: [state_machines.RotationBox.PLANNED_to_SHIPPED, "errors[ERR_BOX_EMPTY]"]
        distinguishing_aspect: "Ship with zero slotted items fails ERR_BOX_EMPTY 422 (state passes PLANNED; the item-count precondition fails)."
        test_recipe:
          setup: ["Plan STD; member M; subscription; empty PLANNED box"]
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.empty@x.com", full_name: "Empty Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /toy-rental/subscriptions/${s_id}/rotation-boxes"
              payload: { expected_subscription_version: "${s_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /toy-rental/rotation-boxes/${b_id}/ship"
              payload: { carrier: "UPS", tracking_number: "1Z-EMPTY" }
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_BOX_EMPTY (HTTP 422); RotationBox.${b_id}.status remains PLANNED; no Shipment created"

      - name: shipment_exception_recovery_loop
        claim_type: valid_transition
        grounds: [state_machines.Shipment.IN_TRANSIT_to_EXCEPTION, state_machines.Shipment.EXCEPTION_to_IN_TRANSIT]
        distinguishing_aspect: "Shipment supports the EXCEPTION -> IN_TRANSIT recovery loop; events append in order and delivery still works afterwards."
        test_recipe:
          setup: ["Plan STD; member M with child born 2025-01-15; one-item box SHIPPED with outbound shipment IN_TRANSIT"]
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.exc@x.com", full_name: "Exc Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/children"
              payload: { name: "Kid", birthdate: "2025-01-15" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Ball", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 1, retail_value_cents: 2000, replacement_value_cents: 1500 }
              as: PlatformAdmin
              captures: { ci_id: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_id}/copies"
              payload: { barcode: "BC-EXC-1", condition_grade: "NEW" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /toy-rental/subscriptions/${s_id}/rotation-boxes"
              payload: { expected_subscription_version: "${s_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/items"
              payload: { toy_copy_id: "${c1}", expected_rotation_box_version: "${b_v}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/rotation-boxes/${b_id}/ship"
              payload: { carrier: "UPS", tracking_number: "1Z-EXC" }
              as: OperationsManager
              captures: { sh_out: $.data.id }
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "IN_TRANSIT", occurred_at: "2026-05-02T00:00:00Z" }
              as: OperationsManager
          trigger:
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "EXCEPTION", occurred_at: "2026-05-03T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "IN_TRANSIT", occurred_at: "2026-05-04T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "DELIVERED", occurred_at: "2026-05-05T00:00:00Z" }
              as: OperationsManager
          assert:
            - "Shipment.${sh_out}.status == DELIVERED after the EXCEPTION->IN_TRANSIT loop; events array holds 4 entries in recorded order"
            - "RotationBox.${b_id}.status == DELIVERED with delivered_at == 2026-05-05T00:00:00Z and due_date == 2026-06-02T00:00:00Z (28-day rental)"

      - name: hold_accept_at_exact_expiry_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.WishlistEntry.HELD_to_FULFILLED, "errors[ERR_HOLD_EXPIRED]"]
        distinguishing_aspect: "Accept requires clock STRICTLY before hold_expires_at: at exactly hold_expires_at the accept fails ERR_HOLD_EXPIRED."
        test_recipe:
          setup:
            - "Plan STD (max_holds 2); item X age [12,36] with NEW copy C1 AVAILABLE; member M with child born 2025-01-15, ACTIVE subscription, WAITING entry rank 1"
            - "Ops run at clock 2026-05-01T00:00:00Z promotes the entry -> HELD, hold_expires_at == 2026-05-04T00:00:00Z; a PLANNED box exists for M"
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Xylophone", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 6, retail_value_cents: 5000, replacement_value_cents: 4000 }
              as: PlatformAdmin
              captures: { ci_x: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_x}/copies"
              payload: { barcode: "BC-HEX-1", condition_grade: "NEW" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.hex@x.com", full_name: "Hex Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/children"
              payload: { name: "Kid", birthdate: "2025-01-15" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /toy-rental/members/${m_id}/wishlist-entries"
              payload: { catalog_item_id: "${ci_x}", rank: 1 }
              as: Member
              as_user_id: "${m_id}"
              captures: { e_id: $.data.id }
            - call: "POST /toy-rental/ops/allocation-runs"
              as: OperationsManager
            - call: "POST /toy-rental/subscriptions/${s_id}/rotation-boxes"
              payload: { expected_subscription_version: "${s_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id }
            - call: "POST /toy-rental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /toy-rental/wishlist-entries/${e_id}/accept-hold"
              payload: { rotation_box_id: "${b_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_HOLD_EXPIRED (HTTP 409): clock == hold_expires_at is already expired (strict <)"
            - "WishlistEntry.${e_id}.status remains HELD (sweep has not run since expiry); no BoxItem created in box ${b_id}"

      - name: ops_run_auto_resume_at_pause_end
        claim_type: valid_transition
        grounds: [state_machines.Subscription.PAUSED_to_ACTIVE, calculations.rotation_cadence_schedule]
        distinguishing_aspect: "Scheduled/deferred action: an ops run at clock == current_pause_end auto-resumes the subscription (no member call) and shifts next_cycle_due_at by the full window."
        test_recipe:
          setup: ["Plan STD; member M; subscription PAUSED with window [2026-05-01, 2026-05-15); clock advanced to 2026-05-15T00:00:00Z"]
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.auto@x.com", full_name: "Auto Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id }
            - call: "POST /toy-rental/subscriptions/${s_id}/pause"
              payload: { start_date: "2026-05-01", duration_days: 14 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /toy-rental/ops/allocation-runs"
              as: OperationsManager
              captures: { resumed: $.data.resumed_count }
          assert:
            - "resumed == 1; Subscription.${s_id}.status == ACTIVE without any member call"
            - "next_cycle_due_at == 2026-05-15T00:00:00Z (2026-05-01 anchor + 14 consumed days); paused_days_used_365d == 14"

      - name: outbound_lost_in_transit_cancels_box
        claim_type: side_effect_execution
        grounds: [state_machines.RotationBox.SHIPPED_to_CANCELLED, state_machines.ToyCopy]
        distinguishing_aspect: "Outbound LOST_IN_TRANSIT cascades: box CANCELLED, slotted copies LOST, no member fees, next_cycle_due_at reset to clock + cadence."
        test_recipe:
          setup: ["Plan STD; member M with child born 2025-01-15; one-item box SHIPPED, outbound shipment IN_TRANSIT"]
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.lost@x.com", full_name: "Lost Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/children"
              payload: { name: "Kid", birthdate: "2025-01-15" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Ball", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 1, retail_value_cents: 2000, replacement_value_cents: 1500 }
              as: PlatformAdmin
              captures: { ci_id: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_id}/copies"
              payload: { barcode: "BC-LOST-1", condition_grade: "NEW" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /toy-rental/subscriptions/${s_id}/rotation-boxes"
              payload: { expected_subscription_version: "${s_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/items"
              payload: { toy_copy_id: "${c1}", expected_rotation_box_version: "${b_v}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/rotation-boxes/${b_id}/ship"
              payload: { carrier: "UPS", tracking_number: "1Z-LOST" }
              as: OperationsManager
              captures: { sh_out: $.data.id }
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "IN_TRANSIT", occurred_at: "2026-05-02T00:00:00Z" }
              as: OperationsManager
          trigger:
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "LOST_IN_TRANSIT", occurred_at: "2026-05-04T00:00:00Z" }
              as: OperationsManager
          assert:
            - "RotationBox.${b_id}.status == CANCELLED; ToyCopy.${c1}.status == LOST"
            - "GET /toy-rental/rotation-boxes/${b_id}/fees returns an empty array (no member fee for carrier loss)"
