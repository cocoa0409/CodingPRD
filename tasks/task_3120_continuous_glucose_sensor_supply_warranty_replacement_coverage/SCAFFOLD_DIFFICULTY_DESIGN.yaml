scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: adjudication_pharmacy_vs_dme_route_diverges
        grounds:
          - calculations.benefit_adjudication_rule
          - entities.SensorOrder.fields.plan_paid_cents
          - entities.SensorOrder.fields.patient_paid_cents
        distinguishing_aspect: |
          Two valid adjudication algorithms on SensorOrder — PHARMACY route
          (deductible-first then pharmacy_copay_pct) vs DME route
          (no deductible, dme_coinsurance_pct on full allowed) — produce
          different patient_paid_cents for identical order inputs.
        test_recipe:
          setup:
            - "Two patients, two prescribers, two payers (one PHARMACY route with pharmacy_copay_pct=0.20 and deductible_cap_cents=50000, one DME route with dme_coinsurance_pct=0.10), one product (list_price_cents=8900, generation=3, wear_days=14, reader_channel=HYBRID), one lot with 10 units, two prescriptions (quantity_per_fill=2, fills_authorized=12), two APPROVED coverage verifications, two sensor orders with quantity=2, logical clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /cgm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cgm/patients"
              payload: { full_name: "P1", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
              captures: { pt1: $.data.id }
            - call: "POST /cgm/patients"
              payload: { full_name: "P2", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
              captures: { pt2: $.data.id, pt2_v: $.data.version }
            - call: "POST /cgm/prescribers"
              payload: { full_name: "DRX", npi: "1234567890", specialty: "ENDOCRINOLOGY" }
              as: PlatformAdmin
              captures: { dr: $.data.id }
            - call: "POST /cgm/sensor-products"
              payload: { sku: "FSL3", generation: 3, wear_days: 14, reader_channel: "HYBRID", compatible_prior_generations: [2], list_price_cents: 8900 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /cgm/sensor-products/${prod}/sensor-lots"
              payload: { lot_code: "L1", quantity_manufactured: 20, manufacture_date: "2026-08-01", expiry_date: "2027-08-01" }
              as: PlatformAdmin
              captures: { lot: $.data.id }
            - call: "POST /cgm/payers"
              payload: { name: "PharmPayer", plan_code: "PH1", benefit_route: "PHARMACY", cgm_coverage_policy: "STANDARD", pharmacy_copay_pct: 0.20, dme_coinsurance_pct: 0.0, deductible_cap_cents: 50000 }
              as: PlatformAdmin
              captures: { py_pharm: $.data.id }
            - call: "POST /cgm/payers"
              payload: { name: "DmePayer", plan_code: "DM1", benefit_route: "DME", cgm_coverage_policy: "STANDARD", pharmacy_copay_pct: 0.0, dme_coinsurance_pct: 0.10, deductible_cap_cents: 50000 }
              as: PlatformAdmin
              captures: { py_dme: $.data.id }
            - call: "POST /cgm/patients"
              payload: { full_name: "PX", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
              captures: { pt_pharm: $.data.id, pt_pharm_v: $.data.version }
            - call: "POST /cgm/patients/${pt_pharm}/prescriptions"
              payload: { prescriber_id: "${dr}", product_id: "${prod}", diagnosis_code: "E11.9", insulin_use: "INTENSIVE", documentation_attached: true, quantity_per_fill: 2, fills_authorized: 12, written_on: "2026-08-15", expected_patient_version: "${pt_pharm_v}" }
              as: Prescriber
              as_user_id: "${dr}"
              captures: { rx_pharm: $.data.id }
            - call: "POST /cgm/prescriptions/${rx_pharm}/coverage-verifications"
              payload: { payer_id: "${py_pharm}" }
              as: CoverageReviewer
              captures: { cv_pharm: $.data.id }
            - call: "POST /cgm/coverage-verifications/${cv_pharm}/decide"
              payload: { decision: "APPROVED" }
              as: CoverageReviewer
            - call: "POST /cgm/patients/${pt_pharm}/sensor-orders"
              payload: { prescription_id: "${rx_pharm}", coverage_verification_id: "${cv_pharm}", lot_id: "${lot}", quantity: 2 }
              as: FulfillmentAgent
              captures: { ord_pharm: $.data.id, ord_pharm_v: $.data.version }
            - call: "POST /cgm/patients/${pt2}/prescriptions"
              payload: { prescriber_id: "${dr}", product_id: "${prod}", diagnosis_code: "E11.9", insulin_use: "INTENSIVE", documentation_attached: true, quantity_per_fill: 2, fills_authorized: 12, written_on: "2026-08-15", expected_patient_version: "${pt2_v}" }
              as: Prescriber
              as_user_id: "${dr}"
              captures: { rx_dme: $.data.id }
            - call: "POST /cgm/prescriptions/${rx_dme}/coverage-verifications"
              payload: { payer_id: "${py_dme}" }
              as: CoverageReviewer
              captures: { cv_dme: $.data.id }
            - call: "POST /cgm/coverage-verifications/${cv_dme}/decide"
              payload: { decision: "APPROVED" }
              as: CoverageReviewer
            - call: "POST /cgm/patients/${pt2}/sensor-orders"
              payload: { prescription_id: "${rx_dme}", coverage_verification_id: "${cv_dme}", lot_id: "${lot}", quantity: 2 }
              as: FulfillmentAgent
              captures: { ord_dme: $.data.id, ord_dme_v: $.data.version }
          trigger:
            - call: "POST /cgm/sensor-orders/${ord_pharm}/adjudicate"
              payload: { expected_order_version: "${ord_pharm_v}" }
              as: BillingAgent
            - call: "POST /cgm/sensor-orders/${ord_dme}/adjudicate"
              payload: { expected_order_version: "${ord_dme_v}" }
              as: BillingAgent
          assert:
            - "SensorOrder.${ord_pharm}.allowed_amount_cents == 17800"
            - "SensorOrder.${ord_pharm}.patient_paid_cents == 17800  (deductible 17800 fully absorbed; cap 50000 not reached; coinsurance_base = 0)"
            - "SensorOrder.${ord_pharm}.plan_paid_cents == 0"
            - "SensorOrder.${ord_dme}.allowed_amount_cents == 17800"
            - "SensorOrder.${ord_dme}.patient_paid_cents == 1780  (floor(8900*0.10)*2 = 890*2)"
            - "SensorOrder.${ord_dme}.plan_paid_cents == 16020"
            - "SensorOrder.${ord_pharm}.patient_paid_cents != SensorOrder.${ord_dme}.patient_paid_cents"

      - name: warranty_credit_pro_rata_vs_flat_replacement
        grounds:
          - calculations.warranty_credit_rule
          - entities.WarrantyClaim.fields.replacement_credit_cents
        distinguishing_aspect: |
          Two valid warranty-credit algorithms on WarrantyClaim — PRO_RATA
          (gen>=3, scales by unused wear fraction) vs FLAT_REPLACEMENT
          (gen<3, full list price) — produce different replacement_credit_cents
          for identically-shaped claims on different-generation products. Entity
          domain differs from instance adjudication_pharmacy_vs_dme_route_diverges
          (WarrantyClaim vs SensorOrder).
        test_recipe:
          setup:
            - "Two products: gen-3 (list 8900c, wear 14) and gen-2 (list 5000c, wear 14); two lots; patients with activated units on each, then early-failure reported at day 7, warranty claims approved"
          setup_api_calls:
            - call: "POST /cgm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cgm/patients"
              payload: { full_name: "PA", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
              captures: { pta: $.data.id, pta_v: $.data.version }
            - call: "POST /cgm/patients"
              payload: { full_name: "PB", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
              captures: { ptb: $.data.id, ptb_v: $.data.version }
            - call: "POST /cgm/prescribers"
              payload: { full_name: "DRY", npi: "1234567891", specialty: "ENDOCRINOLOGY" }
              as: PlatformAdmin
              captures: { dr: $.data.id }
            - call: "POST /cgm/sensor-products"
              payload: { sku: "G3", generation: 3, wear_days: 14, reader_channel: "HYBRID", compatible_prior_generations: [], list_price_cents: 8900 }
              as: PlatformAdmin
              captures: { prod_g3: $.data.id }
            - call: "POST /cgm/sensor-products"
              payload: { sku: "G2", generation: 2, wear_days: 14, reader_channel: "READER", compatible_prior_generations: [], list_price_cents: 5000 }
              as: PlatformAdmin
              captures: { prod_g2: $.data.id }
            - call: "POST /cgm/sensor-products/${prod_g3}/sensor-lots"
              payload: { lot_code: "LG3", quantity_manufactured: 10, manufacture_date: "2026-08-01", expiry_date: "2027-08-01" }
              as: PlatformAdmin
              captures: { lot_g3: $.data.id }
            - call: "POST /cgm/sensor-products/${prod_g2}/sensor-lots"
              payload: { lot_code: "LG2", quantity_manufactured: 10, manufacture_date: "2026-08-01", expiry_date: "2027-08-01" }
              as: PlatformAdmin
              captures: { lot_g2: $.data.id }
            - call: "POST /cgm/sensor-lots/${lot_g3}/sensor-units"
              payload: { serial_number: "S-A1" }
              as: PlatformAdmin
              captures: { u_a1: $.data.id }
            - call: "POST /cgm/sensor-lots/${lot_g3}/sensor-units"
              payload: { serial_number: "S-A2" }
              as: PlatformAdmin
              captures: { u_a2: $.data.id }
            - call: "POST /cgm/sensor-lots/${lot_g2}/sensor-units"
              payload: { serial_number: "S-B1" }
              as: PlatformAdmin
              captures: { u_b1: $.data.id }
            - call: "POST /cgm/sensor-lots/${lot_g2}/sensor-units"
              payload: { serial_number: "S-B2" }
              as: PlatformAdmin
              captures: { u_b2: $.data.id }
            - call: "POST /cgm/payers"
              payload: { name: "PY", plan_code: "PY1", benefit_route: "PHARMACY", cgm_coverage_policy: "STANDARD", pharmacy_copay_pct: 0.20, dme_coinsurance_pct: 0.0, deductible_cap_cents: 0 }
              as: PlatformAdmin
              captures: { py: $.data.id }
            - call: "POST /cgm/patients/${pta}/prescriptions"
              payload: { prescriber_id: "${dr}", product_id: "${prod_g3}", diagnosis_code: "E11.9", insulin_use: "INTENSIVE", documentation_attached: true, quantity_per_fill: 1, fills_authorized: 12, written_on: "2026-08-15", expected_patient_version: "${pta_v}" }
              as: Prescriber
              as_user_id: "${dr}"
              captures: { rx_a: $.data.id }
            - call: "POST /cgm/prescriptions/${rx_a}/coverage-verifications"
              payload: { payer_id: "${py}" }
              as: CoverageReviewer
              captures: { cv_a: $.data.id }
            - call: "POST /cgm/coverage-verifications/${cv_a}/decide"
              payload: { decision: "APPROVED" }
              as: CoverageReviewer
            - call: "POST /cgm/patients/${pta}/sensor-orders"
              payload: { prescription_id: "${rx_a}", coverage_verification_id: "${cv_a}", lot_id: "${lot_g3}", quantity: 1 }
              as: FulfillmentAgent
              captures: { ord_a: $.data.id, ord_a_v: $.data.version }
            - call: "POST /cgm/sensor-orders/${ord_a}/adjudicate"
              payload: { expected_order_version: "${ord_a_v}" }
              as: BillingAgent
            - call: "POST /cgm/sensor-orders/${ord_a}/pick"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /cgm/sensor-orders/${ord_a}/ship"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /cgm/sensor-orders/${ord_a}/deliver"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /cgm/patients/${pta}/device-bindings"
              payload: { sensor_unit_id: "${u_a1}", channel: "READER" }
              as: Patient
              as_user_id: "${pta}"
            - call: "POST /cgm/patients/${ptb}/prescriptions"
              payload: { prescriber_id: "${dr}", product_id: "${prod_g2}", diagnosis_code: "E11.9", insulin_use: "INTENSIVE", documentation_attached: true, quantity_per_fill: 1, fills_authorized: 12, written_on: "2026-08-15", expected_patient_version: "${ptb_v}" }
              as: Prescriber
              as_user_id: "${dr}"
              captures: { rx_b: $.data.id }
            - call: "POST /cgm/prescriptions/${rx_b}/coverage-verifications"
              payload: { payer_id: "${py}" }
              as: CoverageReviewer
              captures: { cv_b: $.data.id }
            - call: "POST /cgm/coverage-verifications/${cv_b}/decide"
              payload: { decision: "APPROVED" }
              as: CoverageReviewer
            - call: "POST /cgm/patients/${ptb}/sensor-orders"
              payload: { prescription_id: "${rx_b}", coverage_verification_id: "${cv_b}", lot_id: "${lot_g2}", quantity: 1 }
              as: FulfillmentAgent
              captures: { ord_b: $.data.id, ord_b_v: $.data.version }
            - call: "POST /cgm/sensor-orders/${ord_b}/adjudicate"
              payload: { expected_order_version: "${ord_b_v}" }
              as: BillingAgent
            - call: "POST /cgm/sensor-orders/${ord_b}/pick"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /cgm/sensor-orders/${ord_b}/ship"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /cgm/sensor-orders/${ord_b}/deliver"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /cgm/patients/${ptb}/device-bindings"
              payload: { sensor_unit_id: "${u_b1}", channel: "READER" }
              as: Patient
              as_user_id: "${ptb}"
            - call: "POST /cgm/sensor-units/${u_a1}/report-early-failure"
              payload: {}
              as: Patient
              as_user_id: "${pta}"
            - call: "POST /cgm/sensor-units/${u_b1}/report-early-failure"
              payload: {}
              as: Patient
              as_user_id: "${ptb}"
            - call: "POST /cgm/sensor-units/${u_a1}/warranty-claims"
              payload: { reported_failure_day_index: 6, failure_category: "SENSOR_ERROR", device_data_attached: true }
              as: Patient
              as_user_id: "${pta}"
              captures: { wc_a: $.data.id }
            - call: "POST /cgm/sensor-units/${u_b1}/warranty-claims"
              payload: { reported_failure_day_index: 6, failure_category: "SENSOR_ERROR", device_data_attached: true }
              as: Patient
              as_user_id: "${ptb}"
              captures: { wc_b: $.data.id }
            - call: "POST /cgm/warranty-claims/${wc_a}/begin-review"
              payload: {}
              as: WarrantyReviewer
            - call: "POST /cgm/warranty-claims/${wc_b}/begin-review"
              payload: {}
              as: WarrantyReviewer
          trigger:
            - call: "POST /cgm/warranty-claims/${wc_a}/decide"
              payload: { decision: "APPROVED", review_notes: "gen3 claim approved after data review" }
              as: WarrantyReviewer
            - call: "POST /cgm/warranty-claims/${wc_b}/decide"
              payload: { decision: "APPROVED", review_notes: "gen2 claim approved after data review" }
              as: WarrantyReviewer
          assert:
            - "WarrantyClaim.${wc_a}.replacement_credit_cents == 4450  (pro-rata: floor(8900 * (14 - 7) / 14) = floor(8900*0.5))"
            - "WarrantyClaim.${wc_b}.replacement_credit_cents == 5000  (flat: full list price for gen<3)"
            - "WarrantyClaim.${wc_a}.replacement_credit_cents != WarrantyClaim.${wc_b}.replacement_credit_cents"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: refill_cadence_mode_a_threshold_formula
        grounds:
          - calculations.refill_cadence_rule
          - validations[priority=12]
        distinguishing_aspect: |
          Mode (a): refill_cadence_rule has 4 inputs (quantity_per_fill,
          wear_days, fill_date, EARLY_REFILL_TOLERANCE_FRACTION) with non-linear
          ceil interaction; boundary computed against inclusive >= on
          logical_date. Distinct mode from the per-line rounding variant.
        test_recipe:
          setup:
            - "Patient with prescription (quantity_per_fill=3, wear_days=14 → supply=42d; tolerance 0.25 → ceil(42*0.75)=32); first fill on 2026-09-01; clock advanced to day +31 (one day before earliest_refill_date)"
          setup_api_calls:
            - call: "POST /cgm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cgm/patients"
              payload: { full_name: "PC", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /cgm/prescribers"
              payload: { full_name: "DRZ", npi: "1234567892", specialty: "ENDOCRINOLOGY" }
              as: PlatformAdmin
              captures: { dr: $.data.id }
            - call: "POST /cgm/sensor-products"
              payload: { sku: "G3B", generation: 3, wear_days: 14, reader_channel: "HYBRID", compatible_prior_generations: [], list_price_cents: 8900 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /cgm/sensor-products/${prod}/sensor-lots"
              payload: { lot_code: "LRC", quantity_manufactured: 30, manufacture_date: "2026-08-01", expiry_date: "2027-08-01" }
              as: PlatformAdmin
              captures: { lot: $.data.id }
            - call: "POST /cgm/payers"
              payload: { name: "PYR", plan_code: "PR1", benefit_route: "PHARMACY", cgm_coverage_policy: "STANDARD", pharmacy_copay_pct: 0.20, dme_coinsurance_pct: 0.0, deductible_cap_cents: 0 }
              as: PlatformAdmin
              captures: { py: $.data.id }
            - call: "POST /cgm/patients/${pt}/prescriptions"
              payload: { prescriber_id: "${dr}", product_id: "${prod}", diagnosis_code: "E11.9", insulin_use: "INTENSIVE", documentation_attached: true, quantity_per_fill: 3, fills_authorized: 12, written_on: "2026-08-15", expected_patient_version: "${pt_v}" }
              as: Prescriber
              as_user_id: "${dr}"
              captures: { rx: $.data.id }
            - call: "POST /cgm/prescriptions/${rx}/coverage-verifications"
              payload: { payer_id: "${py}" }
              as: CoverageReviewer
              captures: { cv: $.data.id }
            - call: "POST /cgm/coverage-verifications/${cv}/decide"
              payload: { decision: "APPROVED" }
              as: CoverageReviewer
            - call: "POST /cgm/patients/${pt}/sensor-orders"
              payload: { prescription_id: "${rx}", coverage_verification_id: "${cv}", lot_id: "${lot}", quantity: 3 }
              as: FulfillmentAgent
              captures: { ord1: $.data.id, ord1_v: $.data.version }
            - call: "POST /cgm/sensor-orders/${ord1}/adjudicate"
              payload: { expected_order_version: "${ord1_v}" }
              as: BillingAgent
            - call: "POST /cgm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /cgm/patients/${pt}/sensor-orders"
              payload: { prescription_id: "${rx}", coverage_verification_id: "${cv}", lot_id: "${lot}", quantity: 3 }
              as: FulfillmentAgent
              captures: { err: $.data.error_id }
          assert:
            - "second-order rejected with error_id == ERR_REFILL_TOO_EARLY"
            - "earliest_refill_date computed as 2026-09-01 + ceil(3*14*0.75) = 2026-09-01 + 32 = 2026-10-03"

      - name: per_line_rounding_vs_sum_then_round_mode_b
        grounds:
          - calculations.benefit_adjudication_rule
        distinguishing_aspect: |
          Mode (b): nested rounding where rounding order matters — scaffold
          pins "floor per line, then sum" rather than "sum then floor".
          With list_price 8999c, qty 3, pharmacy_copay_pct 0.33, the two
          orders differ: per-line sum is 3*floor(8999*0.33)=3*2969=8907;
          sum-then-floor is floor(26997*0.33)=8909. Distinct mode from (a).
        test_recipe:
          setup:
            - "Patient with PHARMACY payer (copay 0.33, deductible 0), product list_price 8999c, quantity_per_fill=3"
          setup_api_calls:
            - call: "POST /cgm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cgm/patients"
              payload: { full_name: "PD", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /cgm/prescribers"
              payload: { full_name: "DRW", npi: "1234567893", specialty: "ENDOCRINOLOGY" }
              as: PlatformAdmin
              captures: { dr: $.data.id }
            - call: "POST /cgm/sensor-products"
              payload: { sku: "G3R", generation: 3, wear_days: 14, reader_channel: "HYBRID", compatible_prior_generations: [], list_price_cents: 8999 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /cgm/sensor-products/${prod}/sensor-lots"
              payload: { lot_code: "LRND", quantity_manufactured: 10, manufacture_date: "2026-08-01", expiry_date: "2027-08-01" }
              as: PlatformAdmin
              captures: { lot: $.data.id }
            - call: "POST /cgm/payers"
              payload: { name: "PYR2", plan_code: "PR2", benefit_route: "PHARMACY", cgm_coverage_policy: "STANDARD", pharmacy_copay_pct: 0.33, dme_coinsurance_pct: 0.0, deductible_cap_cents: 0 }
              as: PlatformAdmin
              captures: { py: $.data.id }
            - call: "POST /cgm/patients/${pt}/prescriptions"
              payload: { prescriber_id: "${dr}", product_id: "${prod}", diagnosis_code: "E11.9", insulin_use: "INTENSIVE", documentation_attached: true, quantity_per_fill: 3, fills_authorized: 12, written_on: "2026-08-15", expected_patient_version: "${pt_v}" }
              as: Prescriber
              as_user_id: "${dr}"
              captures: { rx: $.data.id }
            - call: "POST /cgm/prescriptions/${rx}/coverage-verifications"
              payload: { payer_id: "${py}" }
              as: CoverageReviewer
              captures: { cv: $.data.id }
            - call: "POST /cgm/coverage-verifications/${cv}/decide"
              payload: { decision: "APPROVED" }
              as: CoverageReviewer
            - call: "POST /cgm/patients/${pt}/sensor-orders"
              payload: { prescription_id: "${rx}", coverage_verification_id: "${cv}", lot_id: "${lot}", quantity: 3 }
              as: FulfillmentAgent
              captures: { ord: $.data.id, ord_v: $.data.version }
          trigger:
            - call: "POST /cgm/sensor-orders/${ord}/adjudicate"
              payload: { expected_order_version: "${ord_v}" }
              as: BillingAgent
          assert:
            - "SensorOrder.${ord}.allowed_amount_cents == 26997"
            - "SensorOrder.${ord}.patient_paid_cents == 8907  (per-line floor: 3 * floor(8999 * 0.33) = 3 * 2969)"
            - "SensorOrder.${ord}.plan_paid_cents == 18090"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: sensor_order_parallel_fulfillment_x_billing
        grounds:
          - state_machines.SensorOrder
          - state_machines.SensorOrder.billing_status
        distinguishing_aspect: |
          SensorOrder carries two parallel state dimensions
          (fulfillment_status × billing_status) that evolve independently
          under separate actor roles, with legal pairs constrained (e.g., ship
          requires ADJUDICATED). Distinct entity from WarrantyClaim.
        test_recipe:
          setup:
