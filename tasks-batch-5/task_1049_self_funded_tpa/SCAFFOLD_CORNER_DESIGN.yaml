            - call: "POST /providers"
              payload: { name: "InNet", tax_id: "22-2222222", npi: "1111111111", in_network: true, ppo_discount_pct: 0.40 }
              as: TPAAdmin
              captures: { prov: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", first_name: "Mia", last_name: "N", coverage_effective_date: "2026-01-01" }
              as: TPAAdmin
              captures: { member_id: $.data.id }
            - call: "POST /claims"
              payload: { member_id: "${member_id}", provider_id: "${prov}", service_date: "2026-03-01", billed_lines: [{ billed_cents: 100000 }] }
              as: ClaimsExaminer
              as_user_id: "ex-1"
              captures: { c: $.data.id }
            - call: "POST /claims/${c}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ex-1"
            - call: "POST /fund-accounts"
              payload: { plan_id: "${plan_id}" }
              as: FundManager
              captures: { fa: $.data.id }
            - call: "POST /fund-accounts/${fa}/deposit"
              payload: { amount_cents: 60000 }
              as: FundManager
              captures: { fa_v: $.data.version }
            - call: "POST /check-runs"
              payload: { fund_account_id: "${fa}", claim_ids: ["${c}"] }
              as: FundManager
              captures: { cr: $.data.id }
          trigger:
            - call: "POST /check-runs/${cr}/release"
              payload: { expected_fund_account_version: "${fa_v}" }
              as: FundManager
          assert:
            - "CheckRun.${cr}.status == RELEASED"
