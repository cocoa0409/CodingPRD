            - "NicuUnit.${unit_a}.held_bed_count == 1, available_bed_count == 3, census_posture == OPEN, deferral_queue_depth == 0"

  # ===========================================================================
  # 5. From Table 5 (Endpoints)
  # ===========================================================================
  - section: endpoints
    instances:

      - name: patch_unit_writes_only_the_supplied_capacity_fields
        claim_type: standard_crud
        grounds:
          - endpoints.PATCH /nicu-units/{unit_id}
          - concurrency_rules.unit_capacity_profile_edit
          - entities.NicuUnit.fields.followup_clinic_daily_capacity
        distinguishing_aspect: |
          A PATCH carrying one optional field plus the OCC token leaves every
          other field byte-identical — including the derived bed counters, which
          are re-derived rather than reset — and §1.5 declares no DELETE for
          NicuUnit at all, so a unit can be shrunk but never removed.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A (4 staffed beds, clinic capacity 2, volume 400, transport capable) is capability LEVEL_III with one held bed."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_ref_n
            - *c_get_unit_a
            - *c_accept_n
          trigger:
            - *c_get_unit_a2
            - call: "PATCH /nicu-units/${unit_a}"
              payload: { expected_unit_version: "${v_a2}", followup_clinic_daily_capacity: 5 }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { v_after_patch: $.data.version }
          assert:
            - "NicuUnit.${unit_a}.followup_clinic_daily_capacity == 5 and ${v_after_patch} == 3"
            - "staffed_bed_target is still 4, annual_admission_volume still 400, transport_capable still true, designated_level still LEVEL_III"
            - "held_bed_count == 1, occupied_bed_count == 0, available_bed_count == 3 and census_posture == OPEN — the counters were re-derived, not zeroed"
            - "updated_at == 2026-08-01T00:00:00Z and created_at is unchanged"

      - name: transport_run_creation_links_a_reservation_to_an_isolette
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST /transport-runs
          - errors[ERR_ISOLETTE_UNIT_MISMATCH]
          - errors[ERR_ISOLETTE_NOT_SERVICEABLE]
          - state_machines[TransportRun].transitions.dispatch_ground
          - calculations.isolette_occupation_interval
        distinguishing_aspect: |
          Both ends of the link are validated, and by different rules at
          different priorities: a ventilator masquerading as an isolette is a
          safety fault (422 at priority 11) while a genuine isolette owned by
          the wrong unit is a referential fault (409 at priority 12). Only the
          coherent pair creates the run, whose ground dispatch stamps
          planned_return_at + 45 minutes.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A is capability LEVEL_III with an in-service TRANSPORT_ISOLETTE (ISO-1)."
            - "Community Hospital B owns its own in-service TRANSPORT_ISOLETTE (ISO-B)."
            - "Referral CASE-N1 is ACCEPTED at Regional NICU A with a HELD reservation."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_isolette
            - call: "POST /equipment-assets"
              payload: { unit_id: "${unit_b}", equipment_code: "TRANSPORT_ISOLETTE", asset_tag: "ISO-B", last_service_at: "2026-07-01T00:00:00Z", service_interval_days: 365 }
              as: UnitDirector
              as_user_id: "${unit_b}:dir-1"
              captures: { isolette_b: $.data.id }
            - *c_ref_n
            - *c_get_unit_a
            - *c_accept_n
          trigger:
            - call: "POST /transport-runs"
              payload: { reservation_id: "${res_n}", isolette_asset_id: "${vent_a}", mode: "GROUND", crew_composition: ["TRANSPORT_RN"], depart_at: "2026-08-01T01:00:00Z", planned_return_at: "2026-08-01T05:00:00Z" }
              as: TransportCoordinator
              as_user_id: "coord-1"
              captures: { e_not_isolette: $.data.error_id }
            - call: "POST /transport-runs"
              payload: { reservation_id: "${res_n}", isolette_asset_id: "${isolette_b}", mode: "GROUND", crew_composition: ["TRANSPORT_RN"], depart_at: "2026-08-01T01:00:00Z", planned_return_at: "2026-08-01T05:00:00Z" }
              as: TransportCoordinator
              as_user_id: "coord-1"
              captures: { e_iso_mismatch: $.data.error_id }
            - *c_run_n
            - call: "POST /transport-runs/${run_n}/dispatch"
              payload: {}
              as: TransportCoordinator
              as_user_id: "coord-1"
            - call: "GET /equipment-assets/${isolette_a}"
              payload: {}
              as: TransportCoordinator
              as_user_id: "coord-1"
          assert:
            - "${e_not_isolette} == ERR_ISOLETTE_NOT_SERVICEABLE with HTTP 422 — a CONVENTIONAL_VENT is not a TRANSPORT_ISOLETTE"
            - "${e_iso_mismatch} == ERR_ISOLETTE_UNIT_MISMATCH with HTTP 409 — ISO-B is in service, but at the wrong unit"
            - "The coherent pair creates TransportRun.${run_n} with status ACTIVATED, receiving unit ${unit_a}, mode GROUND and decontamination_minutes 45"
            - "GET /transport-runs?reservation_id=${res_n} reports total_count 1 — the two refused attempts left no rows"
            - "After dispatch: TransportRun.${run_n}.status == GROUND_ROLLING"
            - "EquipmentAsset.${isolette_a}.decontamination_ready_at == 2026-08-01T05:45:00Z (planned_return_at + 45 ground minutes)"

      - name: dispatch_gates_weather_crew_and_isolette_status
        claim_type: conditional_action
        grounds:
          - state_machines[TransportRun].transitions.dispatch_air
          - state_machines[TransportRun].transitions.dispatch_ground
          - validations.priority_11
          - errors[ERR_WEATHER_MINIMUMS_NOT_MET]
          - errors[ERR_CREW_COMPOSITION_INVALID]
          - errors[ERR_ISOLETTE_NOT_SERVICEABLE]
        distinguishing_aspect: |
          Three runs whose isolette intervals are deliberately disjoint isolate
          one gate each: weather blocks only the air branch, crew blocks both
          branches, and the isolette status is re-derived at dispatch time — the
          third run was legal when created and becomes illegal only because the
          asset went out of service in between, and that out-of-service does NOT
          abort the other two runs because a TRANSPORT_ISOLETTE is not required
          for LEVEL_III.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A is capability LEVEL_III with an in-service TRANSPORT_ISOLETTE."
            - "Three LEVEL_III referrals have been accepted, each with its own HELD reservation."
            - "Three ACTIVATED runs exist on the same isolette with disjoint occupation intervals: ROTOR_WING 01:00-05:00 (weather false), GROUND 07:00-08:00 (crew RT only), GROUND 09:00-10:00 (crew correct)."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_isolette
            - *c_ref_n
            - *c_get_unit_a
            - *c_accept_n
            - *c_ref_2
            - *c_get_unit_a2
            - *c_accept_2
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-D3", gestational_age_weeks: 29.0, birth_weight_grams: 1200, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_d3: $.data.id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_d3: $.data.version }
            - call: "POST /referrals/${ref_d3}/accept"
              payload: { expected_unit_version: "${v_d3}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { res_d3: $.data.reservation_id }
            - call: "POST /transport-runs"
              payload: { reservation_id: "${res_n}", isolette_asset_id: "${isolette_a}", mode: "ROTOR_WING", crew_composition: ["TRANSPORT_RN", "TRANSPORT_RT"], depart_at: "2026-08-01T01:00:00Z", planned_return_at: "2026-08-01T05:00:00Z", weather_minimums_met: false }
              as: TransportCoordinator
              as_user_id: "coord-1"
              captures: { run_air: $.data.id }
            - call: "POST /transport-runs"
              payload: { reservation_id: "${res_2}", isolette_asset_id: "${isolette_a}", mode: "GROUND", crew_composition: ["TRANSPORT_RT"], depart_at: "2026-08-01T07:00:00Z", planned_return_at: "2026-08-01T08:00:00Z" }
              as: TransportCoordinator
              as_user_id: "coord-1"
              captures: { run_crew: $.data.id }
            - call: "POST /transport-runs"
              payload: { reservation_id: "${res_d3}", isolette_asset_id: "${isolette_a}", mode: "GROUND", crew_composition: ["TRANSPORT_RN"], depart_at: "2026-08-01T09:00:00Z", planned_return_at: "2026-08-01T10:00:00Z" }
              as: TransportCoordinator
              as_user_id: "coord-1"
              captures: { run_iso: $.data.id }
          trigger:
            - call: "POST /transport-runs/${run_air}/dispatch"
              payload: {}
              as: TransportCoordinator
              as_user_id: "coord-1"
              captures: { e_weather: $.data.error_id }
            - call: "POST /transport-runs/${run_crew}/dispatch"
              payload: {}
              as: TransportCoordinator
              as_user_id: "coord-1"
              captures: { e_crew: $.data.error_id }
            - call: "POST /equipment-assets/${isolette_a}/out-of-service"
              payload: { reason: "BIOMED_FAULT" }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
            - call: "POST /transport-runs/${run_iso}/dispatch"
              payload: {}
              as: TransportCoordinator
              as_user_id: "coord-1"
              captures: { e_isolette: $.data.error_id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
          assert:
            - "${e_weather} == ERR_WEATHER_MINIMUMS_NOT_MET with HTTP 422 — the air branch has a gate the ground branch does not"
            - "${e_crew} == ERR_CREW_COMPOSITION_INVALID with HTTP 422 — TRANSPORT_RT alone is not a crew"
            - "${e_isolette} == ERR_ISOLETTE_NOT_SERVICEABLE with HTTP 422 — status is re-derived at dispatch, not frozen at creation"
            - "All three runs are still ACTIVATED; none is ABORTED — the out-of-service cascade only aborts runs whose referral's required_level now exceeds effective_level, and LEVEL_III does not require a TRANSPORT_ISOLETTE"
            - "NicuUnit.${unit_a}.effective_level == LEVEL_III and equipment_compliant == true after the isolette went out of service"
            - "All three referrals are still ACCEPTED with HELD reservations and held_bed_count == 3"

      - name: action_endpoint_preconditions_are_enforced_in_order
        claim_type: action_endpoint
        grounds:
          - endpoints.POST /transport-runs/{run_id}/depart
          - validations.priority_8
          - validations.priority_11
        distinguishing_aspect: |
          An action endpoint checks its own state before its safety gate.
        excluded_because:
          difficulty_instance: own_state_precedes_stabilization_safety_gate
          rationale: |
            That instance calls depart from ON_SCENE (wrong state) and from
            STABILIZING with an incomplete bundle, asserting ERR_INVALID_STATE
            first and ERR_STABILIZATION_INCOMPLETE only once the state is right.

      - name: capacity_projection_is_a_computed_read
        claim_type: computed_read
        grounds:
          - endpoints.GET /nicu-units/{unit_id}/capacity-projection
          - calculations.capacity_projection
        distinguishing_aspect: |
          The projection endpoint returns a forecast assembled from committed
          beds plus back-transfer-ready and soon-expiring holds.
        excluded_because:
          difficulty_instance: capacity_committed_versus_forecast_beds
          rationale: |
            That instance reads the projection endpoint and asserts every
            component of both variants, including the 60-minute expiring-hold
            horizon.

  # ===========================================================================
  # 6. From Table 6 (Errors) — codes with no live trigger elsewhere
  # ===========================================================================
  - section: errors
    instances:

      - name: milk_label_and_status_gates_are_each_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_MILK_LABEL_MISMATCH]
          - errors[ERR_MILK_NOT_ADMINISTRABLE]
          - endpoints.POST /milk-batches/{batch_id}/verify
          - endpoints.POST /milk-batches/{batch_id}/discard
        distinguishing_aspect: |
          The same batch produces ERR_MILK_NOT_ADMINISTRABLE twice for opposite
          reasons — first because it is not yet verified, then because it has
          been discarded — with the label mismatch in between, proving the milk
          gate reads status rather than a single "usable" flag.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, Regional NICU A is capability LEVEL_III, and referral CASE-N2 has been accepted and admitted."
            - "A MOTHERS_OWN batch of 120.0 ml labelled LBL-1 was received by nurse-1 and is still RECEIVED."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_ref_2
            - *c_get_unit_a
            - *c_accept_2
            - *c_admit_2
            - *c_batch_1
          trigger:
            - call: "POST /milk-batches/${batch_1}/administrations"
              payload: { volume_ml: 10.0 }
              as: BedsideNurse
              as_user_id: "nurse-2"
              captures: { e_unverified: $.data.error_id }
            - call: "POST /milk-batches/${batch_1}/verify"
              payload: { label_code: "LBL-9" }
              as: BedsideNurse
              as_user_id: "nurse-2"
              captures: { e_label: $.data.error_id }
            - *c_verify_1
            - call: "POST /milk-batches/${batch_1}/discard"
              payload: { reason: "FAMILY_REQUEST" }
              as: BedsideNurse
              as_user_id: "nurse-2"
            - call: "POST /milk-batches/${batch_1}/administrations"
              payload: { volume_ml: 10.0 }
              as: BedsideNurse
              as_user_id: "nurse-2"
              captures: { e_discarded: $.data.error_id }
            - call: "GET /admissions/${adm_2}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
          assert:
            - "${e_unverified} == ERR_MILK_NOT_ADMINISTRABLE with HTTP 422 while the batch is RECEIVED"
            - "${e_label} == ERR_MILK_LABEL_MISMATCH with HTTP 409, and the batch is still RECEIVED with verified_by_user_id null"
            - "The correct label verifies it: MilkBatch.${batch_1}.status == VERIFIED with verified_by_user_id == nurse-2"
            - "After discard: status == DISCARDED, discarded_ml == 120.0, administered_ml == 0.0, remaining_ml == 0.0"
            - "${e_discarded} == ERR_MILK_NOT_ADMINISTRABLE with HTTP 422 — same code, opposite reason"
            - "Admission.${adm_2}.milk_administered_ml == 0.0 — the discard never counted as feeding"

      - name: surge_authorization_without_staffed_capacity_is_refused
        claim_type: error_triggerability
        grounds:
          - errors[ERR_SURGE_NO_STAFFED_CAPACITY]
          - calculations.surge_escalation_authorization
          - state_machines[SurgeEscalation].transitions.authorize
          - state_machines[SurgeEscalation].transitions.deny
        distinguishing_aspect: |
          The census gate passes and the request is still refused: with 0.5 RN
          FTE, capacity_from_staff is floor(0.5 * 1.50 * 2) == 1, which the one
          occupied bed already consumes, so authorized_beds computes to 0 —
          a 422 that only appears when the tier test has already succeeded.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A holds NEO_BOARD 1.0 FTE and RN_NICU_CORE 0.5 FTE with in-service CONVENTIONAL_VENT and HFOV, so it is capability LEVEL_III."
            - "staffed_bed_target has been reduced to 1 and referral CASE-N1 has been accepted and admitted, so occupied 1 / held 0."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - call: "POST /staff-credentials"
              payload: { unit_id: "${unit_a}", credential_code: "RN_NICU_CORE", holder_reference: "rn-half", fte: 0.5, expires_on: "2027-01-01T00:00:00Z" }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { cred_rn_half: $.data.id }
            - *c_vent
            - *c_hfov
            - *c_patch_target_1
            - *c_shrink_to_1
            - *c_ref_n
            - *c_get_unit_a
            - *c_accept_n
            - call: "POST /admissions"
              payload: { referral_id: "${ref_n}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { adm_s: $.data.id }
          trigger:
            - call: "POST /surge-escalations"
              payload: { unit_id: "${unit_a}", requested_beds: 2, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-02T00:00:00Z" }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { esc_s: $.data.id }
            - call: "POST /surge-escalations/${esc_s}/authorize"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { e_no_staff: $.data.error_id }
            - call: "POST /surge-escalations/${esc_s}/deny"
              payload: { denial_reason: "No staffed capacity behind the request" }
              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
          assert:
            - "SurgeEscalation.${esc_s}.census_ratio_at_request == 1.0000, escalation_tier == TIER_3 and staffing_waiver_ratio == 1.50 — the 0.80 threshold is comfortably met"
            - "authorized_beds == 0 = max(0, min(requested 2, capacity_from_staff 1 - committed 1, cap 6))"
            - "${e_no_staff} == ERR_SURGE_NO_STAFFED_CAPACITY with HTTP 422 and the escalation stays REQUESTED"
            - "After deny: status == DENIED with the denial_reason stored and authorized_by_user_id still null"
            - "NicuUnit.${unit_a}.escalation_bed_count == 0, available_bed_count == 0 and census_posture == CLOSED"

      - name: ineligible_graduate_cannot_be_enrolled
        claim_type: error_triggerability
        grounds:
          - errors[ERR_NOT_ELIGIBLE_FOR_FOLLOWUP]
          - calculations.followup_eligibility
          - endpoints.POST /follow-up-enrollments
        distinguishing_aspect: |
          A 36-week 2400 g infant discharged with 0 ventilator days matches none
          of the five eligibility rules, so high_risk_graduate is false and the
          clinic refuses the enrollment with 422 — the negative counterpart of
          the high-risk path, and the only way this code is reachable.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A is capability LEVEL_III."
            - "A term referral (GA 36.0, 2400 g, room air, no diagnoses) has been accepted and admitted at Regional NICU A."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-TERM1", gestational_age_weeks: 36.0, birth_weight_grams: 2400, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_term: $.data.id }
            - *c_get_unit_a
            - call: "POST /referrals/${ref_term}/accept"
              payload: { expected_unit_version: "${v_a}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { res_term: $.data.reservation_id }
            - call: "POST /admissions"
              payload: { referral_id: "${ref_term}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { adm_term: $.data.id }
          trigger:
            - call: "POST /admissions/${adm_term}/care-updates"
              payload: { current_weight_grams: 2500, support_modality: "ROOM_AIR" }
              as: BedsideNurse
              as_user_id: "nurse-1"
            - call: "POST /admissions/${adm_term}/discharge"
              payload: { disposition: "HOME" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "POST /follow-up-enrollments"
              payload: { admission_id: "${adm_term}", clinic_unit_id: "${unit_a}", target_appointment_date: "2026-09-01T09:00:00Z" }
              as: FollowUpCoordinator
              as_user_id: "fu-1"
              captures: { e_not_eligible: $.data.error_id }
          assert:
            - "Referral.${ref_term}.required_level == LEVEL_I and triage_priority == 28.75 (0.40*25 + 0.25*25 + 0.20*25 + 0.15*50)"
            - "Admission.${adm_term}.ventilator_days == 0 after a care-update with ventilated omitted"
            - "Admission.${adm_term}.care_status == DISCHARGED and high_risk_graduate == false"
            - "${e_not_eligible} == ERR_NOT_ELIGIBLE_FOR_FOLLOWUP with HTTP 422 and GET /follow-up-enrollments reports total_count 0"

      - name: dependent_state_code_is_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_DEPENDENT_STATE_INVALID]
          - validations.priority_9
        distinguishing_aspect: "A cross-entity state precondition on a different row than the one being written."
        excluded_because:
          difficulty_instance: departure_depends_on_referral_status
          rationale: |
            That instance withdraws the referral under a STABILIZING run and
            asserts ERR_DEPENDENT_STATE_INVALID on depart; the enrollment and
            milk variants of the same code are covered by
            enrollment_depends_on_admission_care_status and
            milk_administration_depends_on_infection_dimension.

      - name: stabilization_incomplete_code_is_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_STABILIZATION_INCOMPLETE]
          - calculations.stabilization_score
        distinguishing_aspect: "Departure refused below a stabilization score of 85."
        excluded_because:
          difficulty_instance: own_state_precedes_stabilization_safety_gate
          rationale: "That instance asserts the code directly after the state check clears."

      - name: developmental_bundle_incomplete_code_is_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_DEVELOPMENTAL_BUNDLE_INCOMPLETE]
          - calculations.developmental_bundle_score
        distinguishing_aspect: "Back-transfer readiness refused below 60.00."
        excluded_because:
          difficulty_instance: developmental_bundle_at_exactly_sixty
          rationale: "That instance asserts the refusal at 40.00 and the pass at exactly 60.00."

      - name: milk_volume_exceeded_code_is_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_MILK_VOLUME_EXCEEDED]
          - calculations.milk_volume_ledger
        distinguishing_aspect: "An administration above remaining_ml or a reversal above administered_ml."
        excluded_because:
          difficulty_instance: milk_expiry_safety_precedes_volume_capacity
          rationale: "That instance triggers the volume code and shows the expiry code outranking it."

      - name: clinic_day_full_code_is_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_CLINIC_DAY_FULL]
          - calculations.followup_clinic_day_capacity
        distinguishing_aspect: "Calendar-day bookings at capacity."
        excluded_because:
          difficulty_instance: clinic_calendar_day_capacity_is_aggregate_not_pointwise
          rationale: "That instance fills a clinic day and asserts the code on the next booking."

      - name: appointment_outside_window_code_is_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_APPOINTMENT_OUTSIDE_WINDOW]
          - calculations.followup_clinic_day_capacity
        distinguishing_aspect: "A confirmed date outside [discharge+14d, discharge+90d]."
        excluded_because:
          difficulty_instance: duplicate_enrollment_referential_precedes_window_temporal
          rationale: "That instance asserts the window code once the referential check clears."

      - name: duplicate_enrollment_code_is_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_DUPLICATE_ENROLLMENT]
          - validations.priority_12
        distinguishing_aspect: "A second active enrollment for one admission."
        excluded_because:
          difficulty_instance: duplicate_enrollment_referential_precedes_window_temporal
          rationale: "That instance triggers the duplicate code at priority 12 ahead of the window code at 13."

      - name: isolette_unavailable_code_is_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_ISOLETTE_UNAVAILABLE]
          - calculations.isolette_occupation_interval
        distinguishing_aspect: "Overlapping isolette occupation including the decontamination buffer."
        excluded_because:
          difficulty_instance: isolette_interval_half_open_with_decontamination_buffer
          rationale: "That instance asserts the code one minute inside the buffer and the success exactly at its end."

      - name: escalation_window_overlap_code_is_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_ESCALATION_WINDOW_OVERLAP]
          - state_machines[SurgeEscalation].transitions.authorize
        distinguishing_aspect: "Two escalation windows for one unit that touch at their endpoints."
        excluded_because:
          difficulty_instance: escalation_windows_conflict_when_endpoints_touch
          rationale: "That instance authorizes a first window and asserts the code on a touching second one."

      - name: surge_threshold_not_met_code_is_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_SURGE_THRESHOLD_NOT_MET]
          - calculations.surge_escalation_authorization
        distinguishing_aspect: "census_ratio_at_request below 0.80."
        excluded_because:
          difficulty_instance: surge_authorization_excludes_its_own_beds_from_the_ratio
          rationale: |
            That instance shows the ratio computed without the escalation's own
            beds and asserts the code when it lands below 0.80.

  # ===========================================================================
  # 7. From Table 7 (RBAC)
  # ===========================================================================
  - section: rbac
    instances:

      - name: exclusive_operations_are_denied_to_every_other_role
        claim_type: exclusive_operations
        grounds:
          - rbac.roles[NetworkAdmin].exclusive_operations
          - rbac.roles[UnitDirector].exclusive_operations
          - rbac.roles[IntakeNeonatologist].exclusive_operations
          - rbac.roles[ReferringClinician].exclusive_operations
          - rbac.roles[TransportCoordinator].exclusive_operations
          - rbac.roles[BedsideNurse].exclusive_operations
          - rbac.roles[FollowUpCoordinator].exclusive_operations
          - complexity_profile.role_model
        distinguishing_aspect: |
          The model is segregation of duties, not hierarchy: NetworkAdmin — the
          most powerful role — is itself refused the UnitDirector's submit and
          the IntakeNeonatologist's accept, so no role is a superset of another.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, Regional NICU A is capability LEVEL_III, one referral is PENDING and a DRAFT review is open."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_ref_n
            - *c_review_1
            - *c_get_unit_a
          trigger:
            - call: "POST /designation-reviews/${rev_1}/submit"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { e_admin_submit: $.data.error_id }
            - call: "POST /referrals/${ref_n}/accept"
              payload: { expected_unit_version: "${v_a}" }
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { e_admin_accept: $.data.error_id }
            - call: "POST /referrals/${ref_n}/accept"
              payload: { expected_unit_version: "${v_a}" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { e_ref_accept: $.data.error_id }
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-X1", gestational_age_weeks: 29.0, birth_weight_grams: 1200, support_modality: "ROOM_AIR" }
              as: IntakeNeonatologist
              as_user_id: "${unit_b}:intake-1"
              captures: { e_intake_create_referral: $.data.error_id }
            - call: "POST /milk-batches"
              payload: { admission_id: "00000000-0000-4000-8000-000000000000", donor_type: "MOTHERS_OWN", volume_ml: 10.0, expressed_at: "2026-08-01T00:00:00Z", label_code: "LBL-X" }
              as: TransportCoordinator
              as_user_id: "coord-1"
              captures: { e_coord_milk: $.data.error_id }
            - call: "POST /follow-up-enrollments"
              payload: { admission_id: "00000000-0000-4000-8000-000000000000", clinic_unit_id: "${unit_a}", target_appointment_date: "2026-09-01T09:00:00Z" }
              as: BedsideNurse
              as_user_id: "nurse-1"
              captures: { e_nurse_enroll: $.data.error_id }
            - call: "POST /ops/run-capacity-sweep"
              payload: {}
              as: FollowUpCoordinator
              as_user_id: "fu-1"
              captures: { e_fu_sweep: $.data.error_id }
          assert:
            - "${e_admin_submit} == ERR_ROLE_NOT_PERMITTED with HTTP 403 — submit is UnitDirector-exclusive"
            - "${e_admin_accept} == ERR_ROLE_NOT_PERMITTED with HTTP 403 — accept is IntakeNeonatologist-exclusive"
            - "${e_ref_accept} == ERR_ROLE_NOT_PERMITTED with HTTP 403"
            - "${e_intake_create_referral} == ERR_ROLE_NOT_PERMITTED with HTTP 403 — creating referrals is ReferringClinician-exclusive"
            - "${e_coord_milk} == ERR_ROLE_NOT_PERMITTED with HTTP 403, returned before the nonexistent admission_id is ever looked up"
            - "${e_nurse_enroll} == ERR_ROLE_NOT_PERMITTED with HTTP 403"
            - "${e_fu_sweep} == ERR_ROLE_NOT_PERMITTED with HTTP 403"
            - "Nothing was written: DesignationReview.${rev_1}.status is still DRAFT, Referral.${ref_n}.status is still PENDING, GET /referrals reports total_count 1 and GET /milk-batches total_count 0"

      - name: shared_operations_work_for_each_listed_role
        claim_type: shared_operations
        grounds:
          - rbac.roles[NetworkAdmin].shared_operations
          - rbac.roles[UnitDirector].shared_operations
          - rbac.roles[BedsideNurse].shared_operations
          - endpoints.PATCH /nicu-units/{unit_id}
          - endpoints.POST /admissions/{admission_id}/infection-events
        distinguishing_aspect: |
          Shared operations really are shared, not merely tolerated for one
          role: the PATCH succeeds for a NetworkAdmin and again for the
          UnitDirector, the infection dimension advances once from a nurse and
          once from the director, and the unit GET answers all seven roles.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, Regional NICU A is capability LEVEL_III, and referral CASE-N2 has been accepted and admitted."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_ref_2
            - *c_get_unit_a2
            - *c_accept_2
            - *c_admit_2
          trigger:
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { v_sh1: $.data.version }
            - call: "PATCH /nicu-units/${unit_a}"
              payload: { expected_unit_version: "${v_sh1}", annual_admission_volume: 450 }
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { v_sh2: $.data.version }
            - call: "PATCH /nicu-units/${unit_a}"
              payload: { expected_unit_version: "${v_sh2}", annual_admission_volume: 500 }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
            - call: "POST /admissions/${adm_2}/infection-events"
              payload: { event: "SUSPECT" }
              as: BedsideNurse
              as_user_id: "nurse-1"
            - call: "POST /admissions/${adm_2}/infection-events"
              payload: { event: "RESOLVE" }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: FollowUpCoordinator
              as_user_id: "fu-1"
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: TransportCoordinator
              as_user_id: "coord-1"
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: ReferringClinician
              as_user_id: "${unit_a}:ref-1"
          assert:
            - "Both PATCH calls return 200: annual_admission_volume ends at 500 and the version advanced once per write"
            - "The nurse's SUSPECT moves Admission.${adm_2}.infection_status to SUSPECTED while care_status stays ADMITTED"
            - "The director's RESOLVE moves infection_status to RESOLVED — the same endpoint accepted two different roles"
            - "All three GET /nicu-units/${unit_a} calls return 200 — every role listed on the endpoint may read the unit"

      - name: two_step_operations_require_two_different_people
        claim_type: segregation_of_duties
        grounds:
          - rbac.segregation_of_duties
          - validations.priority_14
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - rbac.identity_convention
        distinguishing_aspect: |
          Identity is compared per PERSON, not per role: the same NetworkAdmin
          user cannot verify and then certify, the submitting director cannot
          return its own review, and the nurse who received a milk batch cannot
          verify it — while a second holder of the very same role may.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A is fully compliant for LEVEL_III (compliance_score 96.00)."
            - "A DRAFT LEVEL_III review is open, and referral CASE-N2 has been accepted, admitted and given a MOTHERS_OWN batch received by nurse-1."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_review_1
            - *c_ref_2
            - *c_get_unit_a2
            - *c_accept_2
            - *c_admit_2
            - *c_batch_1
          trigger:
            - call: "POST /designation-reviews/${rev_1}/submit"
              payload: {}
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
            - call: "POST /designation-reviews/${rev_1}/return"
              payload: { return_reason: "Returning my own submission" }
              as: NetworkAdmin
              as_user_id: "${unit_a}:dir-1"
              captures: { e_sod_return: $.data.error_id }
            - call: "POST /designation-reviews/${rev_1}/verify"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "POST /designation-reviews/${rev_1}/certify"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { e_sod_certify: $.data.error_id }
            - call: "POST /designation-reviews/${rev_1}/certify"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-2"
            - call: "POST /milk-batches/${batch_1}/verify"
              payload: { label_code: "LBL-1" }
              as: BedsideNurse
              as_user_id: "nurse-1"
              captures: { e_sod_milk: $.data.error_id }
            - *c_verify_1
          assert:
            - "${e_sod_return} == ERR_SEGREGATION_OF_DUTIES with HTTP 409 — the submitter may not return its own review, whatever role header it presents"
            - "${e_sod_certify} == ERR_SEGREGATION_OF_DUTIES with HTTP 409 — net-1 verified it, so net-1 may not certify it"
            - "The second administrator succeeds: DesignationReview.${rev_1}.status == CERTIFIED with verified_by_user_id net-1 and certified_by_user_id net-2"
            - "${e_sod_milk} == ERR_SEGREGATION_OF_DUTIES with HTTP 409 — nurse-1 received the batch"
            - "nurse-2 verifies the same batch with the same label: MilkBatch.${batch_1}.status == VERIFIED"
            - "The refused SoD calls left DesignationReview.${rev_1}.status at SUBMITTED then VERIFIED and MilkBatch.${batch_1}.status at RECEIVED"

  # ===========================================================================
  # 8. From Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_unit_version_on_acceptance_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.referral_acceptance_consumes_a_bed
          - complexity_profile.complexity_layers
          - errors[ERR_UNIT_VERSION_CONFLICT]
          - endpoints.POST /referrals/{referral_id}/accept
        distinguishing_aspect: |
          The declared write_endpoint for concurrency rule 1, exercised exactly
          as the layer table demands: the version a caller read BEFORE somebody
          else's acceptance is refused with 412, the freshly read version
          succeeds, and each success bumps the unit exactly once.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A is capability LEVEL_III at version 1 with 4 free beds."
            - "Two LEVEL_III referrals are PENDING; the first was accepted using the version read at v1, which left the unit at version 2."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_ref_n
            - *c_ref_2
            - *c_get_unit_a
            - *c_accept_n
          trigger:
            - call: "POST /referrals/${ref_2}/accept"
              payload: { expected_unit_version: "${v_a}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { e_occ_accept: $.data.error_id }
            - *c_get_unit_a2
            - *c_accept_2
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { v_occ_end: $.data.version }
          assert:
            - "${v_a} == 1 and ${v_a2} == 2"
            - "${e_occ_accept} == ERR_UNIT_VERSION_CONFLICT with HTTP 412 — the OCC token is the unit's version, never the referral's"
            - "Referral.${ref_2}.status stayed PENDING through the refusal and became ACCEPTED on the retry with ${v_a2}"
            - "${v_occ_end} == 3 — two successful holds, two version bumps, nothing for the refusal"
            - "NicuUnit.${unit_a}.held_bed_count == 2 and available_bed_count == 2"

      - name: stale_unit_version_on_capacity_patch_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.unit_capacity_profile_edit
          - endpoints.PATCH /nicu-units/{unit_id}
          - errors[ERR_UNIT_VERSION_CONFLICT]
        distinguishing_aspect: |
          Concurrency rule 2's own write_endpoint: two directors reading the
          same version and both PATCHing means the second is refused, and the
          refusal is total — the field it tried to write is unchanged, so a
          lost update is impossible.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A exists at version 1 with staffed_bed_target 4 and clinic capacity 2."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
          trigger:
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { v_race: $.data.version }
            - call: "PATCH /nicu-units/${unit_a}"
              payload: { expected_unit_version: "${v_race}", staffed_bed_target: 6 }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { v_race_after: $.data.version }
            - call: "PATCH /nicu-units/${unit_a}"
              payload: { expected_unit_version: "${v_race}", followup_clinic_daily_capacity: 9 }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-2"
              captures: { e_occ_patch: $.data.error_id }
            - call: "PATCH /nicu-units/${unit_a}"
              payload: { expected_unit_version: "${v_race_after}", followup_clinic_daily_capacity: 9 }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-2"
          assert:
            - "${v_race} == 1 and ${v_race_after} == 2 — version increments on every write"
            - "${e_occ_patch} == ERR_UNIT_VERSION_CONFLICT with HTTP 412"
            - "followup_clinic_daily_capacity was still 2 immediately after the refusal — the second writer's field was not applied"
            - "The retry with the fresh version succeeds: staffed_bed_target == 6, followup_clinic_daily_capacity == 9, version == 3"
            - "available_bed_count == 6 after the target change, with census_posture OPEN"

      - name: stale_admission_version_on_back_transfer_referral_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.back_transfer_referral_creation
          - endpoints.POST /admissions/{admission_id}/back-transfer-referrals
          - errors[ERR_ADMISSION_VERSION_CONFLICT]
        distinguishing_aspect: |
          The third concurrency rule guards a DIFFERENT parent with a DIFFERENT
          code: the OCC token is the admission's version, which the bedside
          care-updates and developmental rounds have been bumping all along, so
          an intake neonatologist working from a pre-round read gets 412 —
          ERR_ADMISSION_VERSION_CONFLICT, not ERR_UNIT_VERSION_CONFLICT.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A is capability LEVEL_III."
            - "Referral CASE-N1 has been accepted and admitted; the admission's version was read as 1 before any bedside write."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_ref_n
            - *c_get_unit_a
            - *c_accept_n
            - call: "POST /admissions"
              payload: { referral_id: "${ref_n}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { adm_o: $.data.id, v_adm_stale: $.data.version }
          trigger:
            - call: "POST /admissions/${adm_o}/care-updates"
              payload: { current_weight_grams: 1900, support_modality: "ROOM_AIR" }
              as: BedsideNurse
              as_user_id: "nurse-1"
            - call: "POST /admissions/${adm_o}/developmental-rounds"
              payload: { kangaroo_care_minutes: 60, family_presence_minutes: 240, cluster_care_compliant: true, light_cycling_compliant: false }
              as: BedsideNurse
              as_user_id: "nurse-1"
            - call: "POST /admissions/${adm_o}/developmental-rounds"
              payload: { kangaroo_care_minutes: 60, family_presence_minutes: 240, cluster_care_compliant: true, light_cycling_compliant: false }
              as: BedsideNurse
              as_user_id: "nurse-1"
            - call: "POST /admissions/${adm_o}/back-transfer-ready"
              payload: { back_transfer_attestation_note: "Room air, 1900 g, ready for Community Hospital B" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "POST /admissions/${adm_o}/back-transfer-referrals"
              payload: { expected_admission_version: "${v_adm_stale}", receiving_unit_id: "${unit_b}", case_reference: "CASE-BT-STALE" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { e_occ_adm: $.data.error_id }
            - call: "GET /admissions/${adm_o}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_adm_fresh: $.data.version }
            - call: "POST /admissions/${adm_o}/back-transfer-referrals"
              payload: { expected_admission_version: "${v_adm_fresh}", receiving_unit_id: "${unit_b}", case_reference: "CASE-BT-FRESH" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { ref_bt_ok: $.data.id }
          assert:
            - "${v_adm_stale} == 1 — the version the caller read before the bedside writes"
            - "${e_occ_adm} == ERR_ADMISSION_VERSION_CONFLICT with HTTP 412, and no Referral named CASE-BT-STALE exists"
            - "${v_adm_fresh} > ${v_adm_stale} — each care-update and developmental round bumped the admission"
            - "The retry succeeds: Referral.${ref_bt_ok}.referral_kind == BACK_TRANSFER with source_admission_id == ${adm_o} and required_level == LEVEL_I"
            - "Admission.${adm_o}.care_status is still BACK_TRANSFER_READY — the source admission only transfers when the community hospital admits"

      - name: cascading_side_effect_chain_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - calculations.deferral_promotion_order
        distinguishing_aspect: "A multi-level chain verified in one response, with ordering sensitivity."
        excluded_because:
          difficulty_instance: back_transfer_admission_cascades_to_queue_promotion
          rationale: |
            That instance is the N-level chain test: one POST /admissions at the
            community hospital walks four levels of side effect and the
            assertions pin the ordering (the source bed must free before the
            queue is promoted).

      - name: dual_variant_layer_produces_both_results
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.clabsi_surveillance_rates
          - calculations.referral_required_level
        distinguishing_aspect: "Both variants computed and the applied one selected."
        excluded_because:
          difficulty_instance: clabsi_crude_versus_device_adjusted_rate
          rationale: |
            That instance asserts both rate variants, the selection rule and the
            delta between them on one report; the referral-level variant pair is
            covered by referral_current_support_vs_anticipated_need_level.

      - name: derived_field_reconciliation_after_source_removal
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers
          - entities.Admission.fields.milk_administered_ml
        distinguishing_aspect: "The derived total is correct after create, after update and after the source volume is taken back."
        excluded_because:
          difficulty_instance: milk_volume_ledger_conserved_across_administration_reversal
          rationale: |
            That instance asserts the derived milk_administered_ml after the
            administration, after the partial reversal and after the reversal to
            zero, which is the create/update/delete triple for this layer.

  # ===========================================================================
  # 9. From Consistency Model
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_cascade_is_visible_in_the_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST /referrals/{referral_id}/accept
          - endpoints.POST /admissions
          - endpoints.POST /admissions/{admission_id}/discharge
          - entities.Referral.fields.reservation_id
        distinguishing_aspect: |
          Nothing in this API lags: the acceptance response already names the
          BedReservation created inside the same request, the admission response
          already shows the derived care level, and the discharge response
          already reports high_risk_graduate — so no test anywhere needs a
          second read to see a cascade.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A is capability LEVEL_III with 4 free beds."
            - "One LEVEL_III referral (GA 29.0, 1200 g) is PENDING at the unit."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_ref_n
            - *c_get_unit_a
          trigger:
            - *c_accept_n
            - call: "POST /admissions"
              payload: { referral_id: "${ref_n}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { adm_i: $.data.id, care_now: $.data.current_care_level }
            - call: "POST /admissions/${adm_i}/care-updates"
              payload: { current_weight_grams: 2200, support_modality: "ROOM_AIR" }
              as: BedsideNurse
              as_user_id: "nurse-1"
            - call: "POST /admissions/${adm_i}/discharge"
              payload: { disposition: "HOME" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { grad_flag: $.data.high_risk_graduate }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
          assert:
            - "The acceptance response itself carries reservation_id == ${res_n} — the hold created in that same request, with no second read"
            - "${care_now} == LEVEL_III in the creation response — current_care_level is derived before the response is written"
            - "${grad_flag} == true in the discharge response — eligibility (birth weight 1200 g < 1500 g) is re-derived inside the discharging request"
            - "Admission.${adm_i}.discharged_at == 2026-08-01T00:00:00Z and discharge_disposition == HOME"
            - "The immediately following unit read shows occupied_bed_count == 0, held_bed_count == 0, available_bed_count == 4 and census_posture == OPEN with no settling delay"
