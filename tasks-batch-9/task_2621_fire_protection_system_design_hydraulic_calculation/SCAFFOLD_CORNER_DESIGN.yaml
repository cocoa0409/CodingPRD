              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ft1: $.data.id }
          trigger:
            - call: "POST /water-supply-evaluations"
              payload: { project_id: "00000000-0000-4000-8000-0000000000aa", flow_test_id: "00000000-0000-4000-8000-0000000000bb", governing_hydraulic_calculation_id: "00000000-0000-4000-8000-0000000000cc", evaluation_basis: "RAW_TEST" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { err_first: $.data.error_id }
            - call: "POST /water-supply-evaluations"
              payload: { project_id: "${p1}", flow_test_id: "00000000-0000-4000-8000-0000000000bb", governing_hydraulic_calculation_id: "00000000-0000-4000-8000-0000000000cc", evaluation_basis: "RAW_TEST" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { err_second: $.data.error_id }
          assert:
            - "first trigger: HTTP 404 with error_id == ERR_PROJECT_NOT_FOUND"
            - "second trigger: HTTP 404 with error_id == ERR_FLOW_TEST_NOT_FOUND"
            - "GET /water-supply-evaluations?project_id=${p1} returns total_count == 0"

      - name: in_rack_auxiliary_cross_reference_integrity_rejects_a_class_ii_commodity
        claim_type: flat_topology
        grounds:
          - validations[priority=29]
          - calculations.auxiliary_system_demand
          - entities.AuxiliarySystem.fields.hazard_area_id
          - errors.ERR_IN_RACK_HAZARD_MISMATCH
        distinguishing_aspect: |
          Cross-reference integrity on a flat topology: the same IN_RACK request with the same 10
          heads is accepted against the CLASS_IV rack area (demand 300.0 gpm) and refused with 422
          ERR_IN_RACK_HAZARD_MISMATCH against the CLASS_II mercantile area - the FK exists in both
          cases, so only the referenced row's commodity_class can decide the outcome.
        test_recipe:
          setup:
            - "Project FP-2601 carries two hazard areas: Rack Storage Bay A (CLASS_IV) and Backstock Shelf (CLASS_II)"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
