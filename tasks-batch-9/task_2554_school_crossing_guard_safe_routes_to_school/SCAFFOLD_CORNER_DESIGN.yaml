  - section: state_machines
    instances:
      - name: corner_new_study_starts_draft_and_flips_intersection_to_under_study
        claim_type: initial_state
        grounds:
          - state_machines.WarrantStudy.initial_state
          - state_machines.Intersection.NOT_STUDIED_to_UNDER_STUDY
          - endpoints.POST_/srts/warrant-studies
        distinguishing_aspect: |
          Opening a study is a two-entity write: the study is born DRAFT with an empty
          count_sessions array, recount_round 0, warrant_score null and
          authored_by_user_id stamped from X-User-ID, and the SAME call flips the parent
          Intersection out of NOT_STUDIED into UNDER_STUDY while incrementing its version.
        test_recipe:
          setup:
            - "One school with one UNCONTROLLED intersection at 30 mph; no studies yet."
          setup_api_calls:
            - call: "POST /srts/schools"
              payload: { name: "Maple Grove Elementary", district_code: "D-07", enrollment_count: 640, session_start_date: "2026-08-24", session_end_date: "2027-06-11", am_window_start_utc: "07:15", am_window_end_utc: "08:15", pm_window_start_utc: "14:45", pm_window_end_utc: "15:45", baseline_walk_bike_mode_share_pct: 18.50 }
