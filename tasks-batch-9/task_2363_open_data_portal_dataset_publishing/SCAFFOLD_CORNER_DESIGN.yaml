      - name: arm_with_draining_runner_returns_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=25]
          - errors.ERR_RUNNER_NOT_ACTIVE
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / arm_requires_active_runner
          rationale: "That instance flips the runner to DRAINING and asserts ERR_RUNNER_NOT_ACTIVE on arm, plus the success case once the runner returns to ACTIVE."

      - name: arm_with_conflicting_runner_window_returns_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=23]
          - errors.ERR_RUNNER_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / runner_window_half_open_with_cooldown_buffer_adjacency
          rationale: "That instance asserts the conflict one minute inside the cooldown buffer and the success exactly at the buffer edge."

      - name: metadata_accept_below_completeness_floor_returns_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=26]
          - errors.ERR_METADATA_INCOMPLETE
        excluded_because:
          difficulty_instance: combinatorial_formula / metadata_completeness_round_each_contribution_then_sum_lands_at_8499
          rationale: "That instance pins completeness at 84.99 and asserts the acceptance is refused with ERR_METADATA_INCOMPLETE."

      - name: mark_ready_without_accepted_metadata_returns_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - errors.ERR_METADATA_NOT_ACCEPTED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / mark_ready_requires_accepted_metadata_and_cleared_privacy
          rationale: "That instance asserts the ERR_METADATA_NOT_ACCEPTED branch of the readiness gate on a dataset whose record is still SUBMITTED."

  - section: rbac
    instances:
      - name: portal_admin_performs_its_exclusive_registry_operations
        claim_type: exclusive_operations
        grounds:
          - roles.PortalAdmin
          - endpoints.POST /open-data/departments
          - endpoints.POST /open-data/licenses
          - endpoints.POST /open-data/ingest-runners
          - endpoints.POST /open-data/departments/{departmentId}/credit-grants
        distinguishing_aspect: "PortalAdmin owns the shared registries: department, licence, runner and credit-grant creation all succeed for it with an opaque X-User-ID, and the grant lands entirely in the balance bucket."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "Empty database"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortalAdmin
          trigger:
            - call: "POST /open-data/departments"
              payload: { name: "City Transportation Department", code: "DOT", contact_email: "opendata@dot.city.gov" }
              as: PortalAdmin
              captures: { dept_id: "$.data.id" }
            - call: "POST /open-data/licenses"
              payload: { code: "CC-BY-4.0", name: "Creative Commons Attribution 4.0", attribution_required: true, commercial_use_allowed: true, share_alike: false, attribution_text_template: "Source: City of Example, {dataset_title}" }
              as: PortalAdmin
              captures: { lic_id: "$.data.id" }
            - call: "POST /open-data/ingest-runners"
              payload: { name: "ingest-runner-a", cooldown_minutes: 15 }
              as: PortalAdmin
              captures: { runner_id: "$.data.id" }
            - call: "POST /open-data/departments/${dept_id}/credit-grants"
              payload: { credit_units: 100.00, memo: "FY27 publication credits" }
              as: PortalAdmin
          assert:
            - "All four calls return 201 with response_type == object"
            - "Department.${dept_id}.code == DOT, compliance_posture == OPEN, risk_points == 0"
            - "LicenseTerm.${lic_id}.reuse_permission_class == ATTRIBUTION and retired == false"
            - "IngestRunner.${runner_id}.status == ACTIVE, cooldown_minutes == 15, armed_window_count == 0"
            - "Department.${dept_id}.credits_issued_units == 100.00, credit_balance_units == 100.00, credits_escrowed_units == 0.00, credits_consumed_units == 0.00"
            - "GET /open-data/departments/${dept_id}/scorecard reports credit_ledger_balanced == true"

      - name: coordinator_cannot_accept_metadata_returns_403
        claim_type: denied_other_role_exclusive_operations
        grounds:
          - roles.DataCoordinator
          - roles.PortalAdmin
          - validations[priority=2]
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "Metadata acceptance is a PortalAdmin exclusive operation precisely so a department cannot sign off on its own metadata; the coordinator that drafted the record is refused at 403 by the role check."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "Dataset 'weekly-traffic-counts' in SCREENING with a SUBMITTED metadata record (completeness_score 100.00)"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortalAdmin
            - call: "POST /open-data/departments"
              payload: { name: "City Transportation Department", code: "DOT", contact_email: "opendata@dot.city.gov" }
              as: PortalAdmin
              captures: { dept_id: "$.data.id" }
            - call: "POST /open-data/licenses"
              payload: { code: "CC-BY-4.0", name: "Creative Commons Attribution 4.0", attribution_required: true, commercial_use_allowed: true, share_alike: false, attribution_text_template: "Source: City of Example, {dataset_title}" }
              as: PortalAdmin
              captures: { lic_id: "$.data.id" }
            - call: "POST /open-data/datasets"
              payload: { department_id: "${dept_id}", title: "Weekly Traffic Counts", slug: "weekly-traffic-counts", description: "Weekly Traffic Counts published by the department", update_frequency: "WEEKLY", column_count: 9, sensitivity_class: "PUBLIC", public_demand_score: 92, policy_value_score: 96 }
              as: DataCoordinator
              as_user_id: "${dept_id}"
              captures: { ds_id: "$.data.id" }
            - call: "POST /open-data/datasets/${ds_id}/screen"
              as: DataCoordinator
              as_user_id: "${dept_id}"
            - call: "POST /open-data/metadata-records"
              payload: { dataset_id: "${ds_id}", license_id: "${lic_id}", data_dictionary_field_count: 9, provenance_detail_lines: 24, contact_email: "datasets@dot.city.gov", declared_update_frequency: "WEEKLY", attribution_element_count: 6 }
              as: DataCoordinator
              as_user_id: "${dept_id}"
              captures: { md_id: "$.data.id" }
            - call: "POST /open-data/metadata-records/${md_id}/submit"
              as: DataCoordinator
              as_user_id: "${dept_id}"
          trigger:
            - call: "POST /open-data/metadata-records/${md_id}/decide"
              payload: { decision: "ACCEPT" }
              as: DataCoordinator
              as_user_id: "${dept_id}"
          assert:
            - "Response is 403 with error_id ERR_ROLE_NOT_PERMITTED"
            - "MetadataRecord.${md_id}.status == SUBMITTED and completeness_score == 100.00"
            - "The same call as PortalAdmin returns 200 with status ACCEPTED"

      - name: portal_admin_cannot_publish_dataset_returns_403
        claim_type: denied_other_role_exclusive_operations
        grounds:
          - roles.PortalAdmin
          - roles.DataCoordinator
          - validations[priority=2]
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "Publication is a DataCoordinator exclusive operation, so the programme office cannot publish on a department's behalf even though it can accept the metadata and commit the dataset as high-value."
