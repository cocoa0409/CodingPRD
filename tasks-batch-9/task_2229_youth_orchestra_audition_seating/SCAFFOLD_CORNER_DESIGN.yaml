              as: RegistrarStaff
              captures: { err3: "$.data.error_id" }
            - call: "GET /auditions/${a1_id}"
              as: ArtisticDirector
            - call: "GET /ensemble-events/${ev_conc_id}"
              as: ArtisticDirector
          assert:
            - "trigger[0] -> 422 with data.error_id == \"ERR_SLOT_INSTRUMENT_MISMATCH\" (not ERR_REPERTOIRE_REQUIREMENTS_UNMET, which the same call also violates)"
            - "trigger[1] -> 422 with data.error_id == \"ERR_REPERTOIRE_REQUIREMENTS_UNMET\" (EX9 is not covered by [\"EX1\"])"
            - "trigger[2] -> 422 with data.error_id == \"ERR_MEMBER_NOT_IN_ENSEMBLE\""
            - "trigger[3] -> 200 with data.status == \"REQUESTED\" and data.slot_id == null"
            - "trigger[4] -> 200 with data.participation_count == 0"
            - "AuditionSlot.${slot_v_id}.booked_count == 0 and AuditionSlot.${slot_c_id}.booked_count == 0"

      - name: acceptance_that_exactly_fills_the_section_is_admitted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=91]
          - errors[ERR_SECTION_FULL_AT_ACCEPTANCE]
          - validations[priority=62]
          - errors[ERR_DUPLICATE_TUITION_ACCOUNT]
        distinguishing_aspect: |
          The priority-91 guard is `filled_count < max_count` evaluated at acceptance
          time, so the acceptance that takes the section from 1 to its max of 2 must be
          ADMITTED - an implementation that used `<=` on the post-state, or that pre-counted
          the outstanding offer, would wrongly raise ERR_SECTION_FULL_AT_ACCEPTANCE on the
          second accept. The priority-62 uniqueness rule is satisfied the same way: two
          acceptances by two different members create two distinct TuitionAccounts, one per
          (member_id, season_id) pair, with no duplicate error.
        test_recipe:
          setup:
            - "Season in PLACEMENT with one PHILHARMONIC ensemble (min_total_size 2,"
            - "max_total_size 4) whose VIOLIN quota is min 1 / target 2 / max 2."
            - "Ada Strings and Ben Bow were both adjudicated at 81.80 and each holds an OFFERED"
