              as: ProgramAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "POST /servicing/daily-run"
              payload: {}
              as: CollectionsOfficer
              as_user_id: "u-coll-1"
              captures: { expired: "$.data.expired_upgrade_request_count" }
            - call: "GET /loans/${loan}"
              payload: {}
