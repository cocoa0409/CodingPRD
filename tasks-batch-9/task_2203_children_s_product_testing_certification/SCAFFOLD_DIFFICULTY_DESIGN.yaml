            - "Inside the buffer without overlapping: the same request covering 2026-04-03..2026-06-30."
            - "Different rule, same part: the same request for the phthalate rule covering 2026-01-01..2026-03-31."
            - "Different part, same rule and identical interval: POST /compliance/component-parts/${part_grip_id}/certificates for the lead rule covering 2026-01-01..2026-03-31."
            - "Release the slot: POST /compliance/component-part-certificates/${cert_shell_lead_id}/reliance-documentation with reliance_decision REJECT and reliance_documentation_ref \"REL-2026-REJ-0007\" as CertificationOfficer (user officer-vale), then retry the 2026-03-01..2026-05-31 submission on the shell."
          assert:
            - "The 2026-03-01..2026-05-31 candidate returns HTTP 409 with error_id == \"ERR_COMPONENT_COVERAGE_OVERLAP\" — capacity here is exactly 1, so a genuine overlap is fatal with no aggregate allowance, unlike the laboratory slot rule."
            - "The 2026-04-03..2026-06-30 candidate ALSO returns HTTP 409 with error_id == \"ERR_COMPONENT_COVERAGE_OVERLAP\", even though [2026-04-03, 2026-06-30] and [2026-01-01, 2026-03-31] do not intersect: the existing coverage_through widened by COVERAGE_BUFFER_DAYS 7 reaches 2026-04-07, and 2026-04-03 <= 2026-04-07."
            - "The phthalate-rule candidate on the SAME part with the SAME interval returns HTTP 201: the exclusion window is keyed on the (component_part_id, rule_id) pair, so a different rule does not collide."
