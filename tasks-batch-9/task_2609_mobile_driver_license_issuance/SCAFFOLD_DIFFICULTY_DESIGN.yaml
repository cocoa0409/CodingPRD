# =============================================================================
# 1.8 Scaffold Difficulty Design  (task_2609_mobile_driver_license_issuance)
#
# Nine §0.5 difficulty rules, two differentiated instances each (18 total).
# Every instance is reachable from an empty database using only §1.5 endpoints.
# The logical clock starts at its mandated default 2026-08-01T00:00:00Z and is
# only ever moved forward with POST /mdl/_clock/set_current_utc.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 - dual_variant_calc
  # Two variant pairs on DIFFERENT entity domains: identity proofing scoring
  # (IdentityProofingSession + ProofingEvidence) and privacy exposure scoring
  # (Verifier + PresentationLogEntry).
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: proofing_strict_latest_evidence_diverges_from_optimistic_preview
        grounds: "calculations.proofing_assurance_score, variants ADJUDICATION_STRICT and PREVIEW_OPTIMISTIC; endpoint GET /mdl/proofing-sessions/{id}/assurance-preview"
        distinguishing_aspect: "Divergence is manufactured on the IdentityProofingSession / ProofingEvidence domain by two independent levers that only the strict variant reacts to: (i) a WEAK DOCUMENT_SCAN captured LATER than a STRONG one, so recency beats strength, and (ii) submission_count == 2, so one resubmission penalty applies. The optimistic variant ignores both and lands two whole assurance bands higher (IAL1_5 vs IAL1)."
        test_recipe:
          setup: "One interop profile, one eligible holder, and one proofing session that has been through a full RETURN cycle: two evidence items, submit, RETURN adjudication, a third evidence item that is a WEAKER DOCUMENT_SCAN captured later than the first, then a second submit."
          setup_api_calls:
            - call: "POST /mdl/interop-profiles"
              payload: { profile_code: "AAMVA-MDL-2026", standard_version: "ISO_18013_5_2021" }
              as: SystemAdmin
              captures: { profile_id: "$.data.id" }
            - call: "POST /mdl/holders"
              payload: { legal_name: "Rosa Ibarra", date_of_birth: "1990-04-11", address_line1: "18 Cedar Row", city: "Waverly", state_code: "NE", postal_code: "68462", physical_credential_number: "NE-4417820", physical_credential_expires_on: "2030-06-30" }
              as: SystemAdmin
              captures: { holder_id: "$.data.id" }
            - call: "POST /mdl/proofing-sessions"
              payload: { holder_id: "${holder_id}", requested_assurance_level: "IAL2" }
              as: ProofingAgent
              as_user_id: "pa-001"
              captures: { session_id: "$.data.id" }
            - call: "POST /mdl/proofing-sessions/${session_id}/evidence"
              payload: { evidence_type: "DOCUMENT_SCAN", quality: "STRONG", captured_at: "2026-07-10T09:00:00Z", source_reference: "scan-strong-1" }
              as: ProofingAgent
              as_user_id: "pa-001"
            - call: "POST /mdl/proofing-sessions/${session_id}/evidence"
              payload: { evidence_type: "BIOMETRIC_MATCH", quality: "FAIR", captured_at: "2026-07-12T09:00:00Z", source_reference: "bio-fair-1" }
              as: ProofingAgent
              as_user_id: "pa-001"
            - call: "POST /mdl/proofing-sessions/${session_id}/submit"
              payload: {}
              as: ProofingAgent
              as_user_id: "pa-001"
            - call: "POST /mdl/proofing-sessions/${session_id}/adjudicate"
              payload: { decision: "RETURN", return_reason: "document scan predates the address of record" }
              as: CredentialAdjudicator
              as_user_id: "ca-001"
            - call: "POST /mdl/proofing-sessions/${session_id}/evidence"
              payload: { evidence_type: "DOCUMENT_SCAN", quality: "WEAK", captured_at: "2026-07-20T09:00:00Z", source_reference: "scan-weak-2" }
              as: ProofingAgent
              as_user_id: "pa-001"
            - call: "POST /mdl/proofing-sessions/${session_id}/submit"
              payload: {}
              as: ProofingAgent
              as_user_id: "pa-001"
          trigger:
            - call: "GET /mdl/proofing-sessions/${session_id}/assurance-preview"
              payload: {}
              as: CredentialAdjudicator
              as_user_id: "ca-001"
          assert:
            - "GET /mdl/proofing-sessions/${session_id}/assurance-preview responds 200"
            - "response data.preview_score == 370"
            - "response data.preview_assurance_level == \"IAL1_5\""
            - "response data.adjudication_score == 155"
            - "response data.adjudication_assurance_level == \"IAL1\""
            - "response data.submission_count == 2"
            - "response data.evidence_type_count == 2"
            - "response data.preview_score - response data.adjudication_score == 215"

      - name: verifier_exposure_rolling_window_diverges_from_since_attestation
        grounds: "calculations.verifier_exposure_index, variants ROLLING_WINDOW and SINCE_LAST_ATTESTATION; endpoint GET /mdl/verifiers/{id}/exposure-index"
        distinguishing_aspect: "A different entity domain (Verifier / PresentationLogEntry, privacy exposure scoring rather than identity proofing) and a different divergence mechanism: the two variants read the SAME weights over DIFFERENT time windows. One log entry recorded 44 days before the read sits outside the 30-day rolling window but inside the since-attestation window, so the rolling index (6) is a strict subset sum of the since-attestation index (18)."
        test_recipe:
          setup: "One approved verifier with a listed reader app under a published trust list, one active credential, a retention attestation taken at 2026-08-01 (empty log, index 0), one ROUTINE disclosure at 2026-08-02 that withholds 2 over-asked elements, then the clock advanced to 2026-09-15 and a second ROUTINE presentation consented but not yet disclosed."
          setup_api_calls:
            - call: "POST /mdl/interop-profiles"
              payload: { profile_code: "AAMVA-MDL-2026", standard_version: "ISO_18013_5_2021" }
              as: SystemAdmin
              captures: { profile_id: "$.data.id" }
            - call: "POST /mdl/holders"
              payload: { legal_name: "Rosa Ibarra", date_of_birth: "1990-04-11", address_line1: "18 Cedar Row", city: "Waverly", state_code: "NE", postal_code: "68462", physical_credential_number: "NE-4417820", physical_credential_expires_on: "2030-06-30" }
              as: SystemAdmin
              captures: { holder_id: "$.data.id" }
            - call: "POST /mdl/devices"
              payload: { holder_id: "${holder_id}", platform: "ANDROID", model_name: "Pixel 9", hardware_attestation_token: "att-tok-a1", protection_method: "BIOMETRIC" }
              as: SystemAdmin
              captures: { device_id: "$.data.id" }
            - call: "POST /mdl/devices/${device_id}/attest"
              payload: { attestation_result: "PASS", secure_element_grade: "HARDWARE_STRONGBOX" }
              as: SystemAdmin
            - call: "POST /mdl/proofing-sessions"
              payload: { holder_id: "${holder_id}", requested_assurance_level: "IAL2" }
              as: ProofingAgent
              as_user_id: "pa-001"
              captures: { session_id: "$.data.id" }
            - call: "POST /mdl/proofing-sessions/${session_id}/evidence"
              payload: { evidence_type: "DOCUMENT_SCAN", quality: "STRONG", captured_at: "2026-07-20T09:00:00Z", source_reference: "doc-1" }
              as: ProofingAgent
              as_user_id: "pa-001"
            - call: "POST /mdl/proofing-sessions/${session_id}/evidence"
              payload: { evidence_type: "BIOMETRIC_MATCH", quality: "STRONG", captured_at: "2026-07-20T09:05:00Z", source_reference: "bio-1" }
              as: ProofingAgent
              as_user_id: "pa-001"
            - call: "POST /mdl/proofing-sessions/${session_id}/submit"
              payload: {}
              as: ProofingAgent
              as_user_id: "pa-001"
            - call: "POST /mdl/proofing-sessions/${session_id}/adjudicate"
              payload: { decision: "VERIFY" }
              as: CredentialAdjudicator
              as_user_id: "ca-001"
            - call: "GET /mdl/devices/${device_id}"
              payload: {}
              as: SystemAdmin
              captures: { device_v: "$.data.version" }
            - call: "POST /mdl/credentials"
              payload: { holder_id: "${holder_id}", device_id: "${device_id}", proofing_session_id: "${session_id}", valid_from: "2026-08-01T00:00:00Z", valid_until: "2031-07-01T00:00:00Z", expected_device_version: "${device_v}" }
              as: CredentialAdjudicator
              as_user_id: "ca-001"
              captures: { credential_id: "$.data.id" }
            - call: "POST /mdl/credentials/${credential_id}/activate"
              payload: { device_unlock_proof: "BIOMETRIC" }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /mdl/verifiers"
              payload: { organization_name: "Prairie Cellars", category: "AGE_RESTRICTED_RETAIL", purpose_scope: ["family_name", "age_over_21"], retention_ceiling_days: 30 }
              as: SystemAdmin
              captures: { verifier_id: "$.data.id" }
            - call: "POST /mdl/verifiers/${verifier_id}/trust-decision"
              payload: { decision: "APPROVE" }
              as: SystemAdmin
            - call: "POST /mdl/reader-apps"
              payload: { verifier_id: "${verifier_id}", app_identifier: "till-reader", certificate_serial: "SER-A1", cert_not_before: "2026-07-01T00:00:00Z", cert_not_after: "2027-07-01T00:00:00Z", requested_elements: ["family_name", "age_over_21", "birth_date", "address"], base_rate_cents: 30 }
              as: VerifierOperator
              as_user_id: "${verifier_id}"
              captures: { reader_app_id: "$.data.id" }
            - call: "POST /mdl/reader-apps/${reader_app_id}/list-decision"
              payload: { decision: "LIST" }
              as: SystemAdmin
            - call: "GET /mdl/interop-profiles/${profile_id}"
              payload: {}
              as: SystemAdmin
              captures: { profile_v: "$.data.version" }
            - call: "POST /mdl/trust-list-snapshots"
              payload: { interop_profile_id: "${profile_id}", effective_from: "2026-08-01T00:00:00Z", effective_until: "2026-12-01T00:00:00Z", expected_interop_profile_version: "${profile_v}" }
              as: SystemAdmin
            - call: "POST /mdl/verifiers/${verifier_id}/retention-attestation"
              payload: { attested_max_retention_days: 10 }
              as: VerifierOperator
              as_user_id: "${verifier_id}"
            - call: "POST /mdl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /mdl/presentation-sessions"
              payload: { credential_id: "${credential_id}", reader_app_id: "${reader_app_id}", context: "ROUTINE", purpose: "age check at point of sale", requested_elements: ["family_name", "age_over_21", "birth_date", "address"], handset_handling: "TAP_TO_READ", retention_days: 5 }
              as: VerifierOperator
              as_user_id: "${verifier_id}"
              captures: { session_one_id: "$.data.id" }
            - call: "POST /mdl/presentation-sessions/${session_one_id}/consent"
              payload: { consent_decision: "APPROVE", unlock_method: "BIOMETRIC" }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /mdl/presentation-sessions/${session_one_id}/disclose"
              payload: {}
              as: VerifierOperator
              as_user_id: "${verifier_id}"
            - call: "POST /mdl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /mdl/presentation-sessions"
              payload: { credential_id: "${credential_id}", reader_app_id: "${reader_app_id}", context: "ROUTINE", purpose: "age check at point of sale", requested_elements: ["family_name", "age_over_21", "address"], handset_handling: "TAP_TO_READ", retention_days: 5 }
              as: VerifierOperator
              as_user_id: "${verifier_id}"
              captures: { session_two_id: "$.data.id" }
            - call: "POST /mdl/presentation-sessions/${session_two_id}/consent"
              payload: { consent_decision: "APPROVE", unlock_method: "BIOMETRIC" }
              as: Holder
              as_user_id: "${holder_id}"
          trigger:
            - call: "POST /mdl/presentation-sessions/${session_two_id}/disclose"
              payload: {}
              as: VerifierOperator
              as_user_id: "${verifier_id}"
            - call: "GET /mdl/verifiers/${verifier_id}/exposure-index"
              payload: {}
              as: PrivacyAuditor
              as_user_id: "pauditor-001"
            - call: "GET /mdl/verifiers/${verifier_id}"
              payload: {}
              as: PrivacyAuditor
              as_user_id: "pauditor-001"
          assert:
            - "POST /mdl/presentation-sessions/${session_two_id}/disclose responds 200 with data.state == \"COMPLETED\""
            - "POST /mdl/presentation-sessions/${session_two_id}/disclose response data.excess_element_count == 1"
            - "POST /mdl/presentation-sessions/${session_two_id}/disclose response data.disclosed_element_count == 2"
            - "GET /mdl/verifiers/${verifier_id}/exposure-index response data.rolling_window_index == 6"
            - "GET /mdl/verifiers/${verifier_id}/exposure-index response data.rolling_window_entry_count == 1"
            - "GET /mdl/verifiers/${verifier_id}/exposure-index response data.since_last_attestation_index == 18"
            - "GET /mdl/verifiers/${verifier_id}/exposure-index response data.since_attestation_entry_count == 2"
            - "GET /mdl/verifiers/${verifier_id} response data.exposure_index == 6"
            - "GET /mdl/verifiers/${verifier_id} response data.trust_status == \"APPROVED\""

  # ===========================================================================
  # RULE 2 - combinatorial_formula
  # Two instances in DIFFERENT modes: (b) nested rounding order, and
  # (c) circular-looking dependency with a pinned evaluation order.
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: invoice_round_each_line_then_sum_two_half_cent_lines
        grounds: "calculations.verifier_invoice_amount_cents, PINNED ROUNDING ORDER block; endpoint GET /mdl/verifiers/{id}/invoice"
        distinguishing_aspect: "MODE (b) - nested rounding order. Two invoice lines whose raw values are each exactly 34.5 cents (30 x 1 query x (1 - 0.00) x 1.15). The pinned order rounds each line half-up to 35 and then sums to 70; the natural but wrong sum-then-round order gives round_half_up(69.0) = 69. The one-cent gap is the only observable difference, and it exists solely because the rounding step is nested inside the per-line loop rather than outside the summation."
        test_recipe:
          setup: "One approved verifier on PROBATION with TWO listed reader apps, each base_rate_cents 30 and each having served exactly one billed disclosure with no withheld elements, so query_count is 1 (tier 1, no volume discount) on both lines."
          setup_api_calls:
            - call: "POST /mdl/interop-profiles"
              payload: { profile_code: "AAMVA-MDL-2026", standard_version: "ISO_18013_5_2021" }
