      - name: episode_lock_depends_on_clearance_review_posture_of_a_different_entity
        grounds:
          - validations.priority_50_business_safety
          - errors.ERR_CLEARANCE_NOT_CLEARED
          - entities.Episode.fields.clearance_posture
          - entities.ClearanceReview.fields.posture
          - entities.ClearanceReview.fields.legal_waiver_granted
          - state_machines.ClearanceReview.transitions.CONDITIONAL_to_CONDITIONAL_WAIVED
          - state_machines.Episode.script_readiness.transitions.READY_to_LOCKED
          - calculations.script_coverage_index
          - endpoints.POST_/clearance-reviews/{review_id}/waiver
          - endpoints.POST_/episodes/{episode_id}/lock-for-production
        distinguishing_aspect: |
          The episode is fully READY on its own terms - an APPROVED TELEPLAY, all milestones ACCEPTED -
          yet the lock is decided by the posture of a ClearanceReview hanging off a different entity
          (the assignment), and that posture is itself derived from ClearanceItem decisions two levels
          down. A CONDITIONAL posture blocks the lock even though nothing about the Episode row changed;
          a waiver granted by LegalCounsel on the REVIEW (not on the episode) flips
          Episode.clearance_posture to CONDITIONAL_WAIVED, which simultaneously makes the episode count
          toward Season.ready_script_count and permits the lock. Three entities must be read to predict
          the outcome of one call.
        test_recipe:
          setup:
            - "Agreement AG (clearance_item_weights DEPICTION 25, clearance_escalation_score 30); season SE with ready_script_target 1."
            - "ACTIVE room RM with W1 CONFIRMED; episode E1 with assignment A1 = TELEPLAY by W1, all three milestones delivered and A1 APPROVED, so E1.script_readiness == READY."
            - "Clearance review R1 over A1's OUTLINE milestone carries a single DEPICTION item decided CONDITIONAL, so R1.risk_score == 25, R1.posture == CONDITIONAL and E1.clearance_posture == CONDITIONAL."
          setup_api_calls:
            - call: "POST /guild-agreements"
              payload: *AGP
              as: GuildAdministrator
              captures: { ag: "$.data.id" }
            - call: "POST /writers"
              payload: { legal_name: "Sloane Reyes", guild_member_id: "GM-SHOW", agreement_id: "${ag}", career_episodic_credits: 20, is_showrunner_eligible: true }
              as: GuildAdministrator
              captures: { sr: "$.data.id" }
