            - "Property.${prop_id}.prep_state == CONSULT_BOOKED"

      - name: project_room_count_excludes_accessory_only_rooms
        claim_type: Computed Fields
        grounds: ["calculations.project_room_count", "entities.ScopeItem.fields.action", "entities.Project.fields.room_count"]
        distinguishing_aspect: "An ACCESSORY_ONLY scope room contributes its accessory_set_count but is NOT counted in Project.room_count, so three scope rows yield room_count 2 and accessory_set_count 3."
        test_recipe:
          setup: ["A HELD VACANT consultation with two PACKAGE_ROOM rooms and one ACCESSORY_ONLY room."]
          setup_api_calls: *cons_two_items
