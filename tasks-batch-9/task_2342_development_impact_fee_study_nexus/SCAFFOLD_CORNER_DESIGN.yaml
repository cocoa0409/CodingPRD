      - name: refund_is_refused_on_rows_that_are_not_refundable_collections
        claim_type: error_triggerable
        grounds:
          - errors.ERR_LEDGER_ENTRY_INVALID_STATE
          - validations[priority=31]
          - entities.FundLedgerEntry.fields.kind
          - entities.FundLedgerEntry.fields.entry_status
        distinguishing_aspect: |
          The refund endpoint accepts only a COLLECTION row in OPEN or REFUND_DUE state. Two
          rows that both exist and both belong to the same category are refused for two
          different reasons: the EXPENDITURE row fails the kind test, and the source
          COLLECTION row - now PARTIALLY_EXPENDED after the expenditure consumed part of it -
          fails the status test. Money already spent may not be refunded twice.
        test_recipe:
          setup:
            - "BP-1001 paid in full on 2026-05-10, so PARKS holds one OPEN COLLECTION row of 2617930."
            - "A 2000000 expenditure has been booked, leaving that row PARTIALLY_EXPENDED at 617930 and creating a POSTED EXPENDITURE row."
