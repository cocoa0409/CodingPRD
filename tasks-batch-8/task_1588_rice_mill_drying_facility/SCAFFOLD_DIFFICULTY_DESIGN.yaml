          assert:
            - "captured grade0 == US_NO_2 and captured line0 == 498904 (338.24 * 1475)"
            - "captured status1 == GRADED (self-loop: state unchanged by regrade)"
            - "captured score1 == 7.0 (0.6*2 + 0.6*3 + 4.0*1) and captured grade1 == US_NO_3"
            - "captured price1 == 1440 (1500 - 60) and captured line1 == 487066 (round_half_up(338.24 * 1440) = round_half_up(487065.6))"

