scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: commission_projected_vs_final_net
        grounds:
          - calculations.net_settlement_amount
          - state_machines.CommissionRecord.ACCRUED_to_SETTLED
          - state_machines.CommissionRecord.ACCRUED_to_CLAWED_BACK
          - entities.CommissionRecord.fields.net_settlement_cents
        distinguishing_aspect: |
          Same CommissionRecord row produces two different net_settlement_cents
          values depending on whether the variant evaluated is the forward-looking
          projected_net_at_accrual (returned by GET while ACCRUED) or the
          chronological final_net_at_sweep (locked when ACCRUED→SETTLED runs).
          This calculation operates on the CommissionRecord/Offer entity domain.
        test_recipe:
          setup:
            - "Verified PREMIUM Company with one ACTIVE HrUser bound."
            - "HeadhunterContract{fee_model=SUCCESS_FEE, success_fee_pct_bps=2500, trigger_event=OFFER_ACCEPTED, tax_withholding_pct_bps=1500, clawback_window_days=90}."
            - "Run an Application end-to-end with source_channel=HEADHUNTER and Offer.base_salary_cents=5000000, sign_on_bonus_cents=0 to ACCEPTED."
          trigger:
            - "GET /recruitment/commission-records/{id} while settlement_status==ACCRUED."
            - "POST /recruitment/_settlement-sweep/run after advancing clock by 30 days."
            - "GET /recruitment/commission-records/{id} again."
          assert:
            - "First GET returns CommissionRecord.gross_commission_cents == 1250000 and a projected net of 1062500 with settlement_status==ACCRUED."
            - "After sweep, second GET returns settlement_status==SETTLED, net_settlement_cents == 1062500, and a non-null settled_at."
            - "If instead the Offer is rescinded before sweep, the same record ends with settlement_status==CLAWED_BACK and net_settlement_cents == 0 — the chronological final variant yields a different value from the forward-looking projection."

      - name: offer_remaining_vs_consumed_window
        grounds:
          - calculations.offer_acceptance_deadline
          - state_machines.Offer.PENDING_FINANCE_to_ISSUED
          - state_machines.Offer.ISSUED_to_ACCEPTED
          - state_machines.Offer.ISSUED_to_EXPIRED
          - entities.Offer.fields.acceptance_deadline_at
        distinguishing_aspect: |
          On Offer entity (different entity domain from commission_projected_vs_final_net),
          a GET while ISSUED returns provisional_remaining_seconds (forward-looking,
          recomputed against now() at READ time) while a GET on the same row after
          ACCEPTED/DECLINED/EXPIRED returns the final consumed_seconds frozen at the
          terminal event time. Same Offer row, two algorithms, different numbers.
        test_recipe:
          setup:
            - "Application advanced to INTERVIEW with one PASSED InterviewRound."
            - "Offer issued at fixed time T0 with three distinct HM/HR/Finance approvers."
          trigger:
            - "GET /recruitment/offers/{id} at T0+60s while ISSUED (clock not advanced)."
            - "POST /recruitment/offers/{id}/accept at T0+120s."
            - "GET /recruitment/offers/{id} at T0+200s after ACCEPTED."
          assert:
            - "First GET returns offer_status=ISSUED and seconds_remaining == 604740 (168*3600 - 60)."
            - "Second GET returns offer_status=ACCEPTED and consumed_seconds == 120 (frozen at accepted_at - issued_at)."

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: commission_sum_then_round_order
        grounds:
          - calculations.commission_gross_amount
          - entities.CommissionRecord.fields.gross_commission_cents
          - state_machines.Offer.ISSUED_to_ACCEPTED
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The formula MUST sum
          first_slice_raw, remainder_slice_raw, bonus_share_raw, retainer_part_raw
          and apply round_half_up ONCE to the sum. Per-part-then-sum produces a
          different integer cent value for the pinned inputs below.
        test_recipe:
          setup:
            - "HeadhunterContract{fee_model=HYBRID, success_fee_pct_bps=2000, retainer_amount_cents=0, trigger_event=OFFER_ACCEPTED, tax_withholding_pct_bps=1000}."
            - "Offer.base_salary_cents=10000004, sign_on_bonus_cents=8."
          trigger:
            - "Drive the application all the way to Offer ACCEPTED via the headhunter channel."
            - "GET /recruitment/commission-records/{id}."
          assert:
            - "CommissionRecord.gross_commission_cents == 2000001 (sum-then-round; raw_total=2000000.8 → round_half_up=2000001)."
            - "CommissionRecord.gross_commission_cents != 2000000 (per-part-then-sum value, which would result from rounding each slice individually)."
            - "CommissionRecord.tax_withheld_cents == 200000."
            - "CommissionRecord.net_settlement_cents projects to 1800001 while ACCRUED."

      - name: commission_three_input_branch_selection
        grounds:
          - calculations.commission_gross_amount
          - entities.HeadhunterContract.fields.fee_model
          - entities.HeadhunterContract.fields.success_fee_pct_bps
          - entities.HeadhunterContract.fields.retainer_amount_cents
        distinguishing_aspect: |
          Mode (a): formula with ≥3 inputs (fee_model, success_fee_pct_bps,
          retainer_amount_cents) and non-linear interaction — fee_model branches
          select different subsets of inputs and apply tiered slicing (first slice
          at full rate, remainder slice at half rate, bonus share at quarter rate).
          This is a different mode from commission_sum_then_round_order, exercising
          combinatorial branch selection rather than rounding order.
        test_recipe:
          setup:
            - "Two HeadhunterContracts on the same Company: C_SUCCESS{fee_model=SUCCESS_FEE, success_fee_pct_bps=2500, retainer_amount_cents=999999, trigger_event=OFFER_ACCEPTED} and C_RETAINER{fee_model=RETAINER, success_fee_pct_bps=2500, retainer_amount_cents=750000, trigger_event=OFFER_ACCEPTED}."
            - "Two separate offers, each base_salary_cents=5000000, sign_on_bonus_cents=0, each acceptance flowing via the matching contract."
          trigger:
            - "Drive both offers to ACCEPTED."
            - "GET both CommissionRecords."
          assert:
            - "C_SUCCESS record gross_commission_cents == 1250000 (success branch ignores retainer_amount_cents)."
            - "C_RETAINER record gross_commission_cents == 750000 (retainer branch ignores success_fee_pct_bps)."
            - "Same Offer.base_salary_cents (5000000) yields different gross values under different branches — demonstrates input-set non-linearity."

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: job_posting_rejection_revision_cycle
        grounds:
          - state_machines.JobPosting.UNDER_REVIEW_to_REJECTED
          - state_machines.JobPosting.REJECTED_to_DRAFT
          - state_machines.JobPosting.DRAFT_to_UNDER_REVIEW
          - state_machines.JobPosting.UNDER_REVIEW_to_LIVE
        distinguishing_aspect: |
          JobPosting state machine contains a true cycle DRAFT → UNDER_REVIEW
          → REJECTED → DRAFT → UNDER_REVIEW → LIVE. The same DRAFT state is
          revisited after a rejection, with no monotonic progression. This is
          one of the two non-linear shapes required (cycle), on the JobPosting
          entity.
        test_recipe:
          setup:
            - "Verified BASIC Company; HrUser bound."
            - "Create JobPosting in DRAFT."
          trigger:
            - "POST submit-review (DRAFT→UNDER_REVIEW)."
            - "POST reject with review_rejection_reason=DISCRIMINATORY_WORDING (UNDER_REVIEW→REJECTED)."
            - "POST revise (REJECTED→DRAFT)."
            - "POST submit-review again (DRAFT→UNDER_REVIEW)."
            - "POST approve (UNDER_REVIEW→LIVE)."
          assert:
            - "Final posting_status == LIVE."
            - "AuditEvent rows for this JobPosting record the state sequence DRAFT→UNDER_REVIEW→REJECTED→DRAFT→UNDER_REVIEW→LIVE (six events), confirming the revisit of DRAFT and UNDER_REVIEW."

      - name: offer_approval_reject_and_resubmit_cycle
        grounds:
          - state_machines.Offer.DRAFT_to_PENDING_HM
          - state_machines.Offer.PENDING_HM_to_PENDING_HR
          - state_machines.Offer.PENDING_HR_to_DRAFT
          - state_machines.Offer.PENDING_FINANCE_to_DRAFT
        distinguishing_aspect: |
          Offer state machine (different entity from JobPosting) embeds a cycle
          DRAFT → PENDING_HM → PENDING_HR → DRAFT → PENDING_HM... and a parallel
          branching shape via the three-staged approval pipeline that can short-
          circuit at any stage. Same DRAFT state revisited; pinned by reject-
          approval transitions from each PENDING_* state.
        test_recipe:
          setup:
            - "Application advanced to INTERVIEW with one PASSED round."
            - "Three distinct HrUser ids U_HM, U_HR, U_FIN bound ACTIVE to the Company."
            - "Offer in DRAFT."
          trigger:
            - "POST submit-approval (DRAFT→PENDING_HM)."
            - "POST approve as HiringManager U_HM (PENDING_HM→PENDING_HR)."
            - "POST reject-approval as HrApprover U_HR (PENDING_HR→DRAFT, clears hm_approver_user_id)."
            - "POST submit-approval (DRAFT→PENDING_HM)."
            - "POST approve as HiringManager U_HM (PENDING_HM→PENDING_HR)."
            - "POST approve as HrApprover U_HR (PENDING_HR→PENDING_FINANCE)."
            - "POST approve as FinanceApprover U_FIN (PENDING_FINANCE→ISSUED)."
          assert:
            - "After the reject, Offer.hm_approver_user_id is null (cleared by the cyclic revert)."
            - "Final offer_status == ISSUED."
            - "AuditEvent log contains two distinct DRAFT→PENDING_HM rows, confirming the revisit."

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: jobposting_off_shelf_cascades_to_interview_rounds
        grounds:
          - state_machines.JobPosting.LIVE_to_OFF_SHELF
          - state_machines.Application.FORWARDED_to_CLOSED
          - state_machines.InterviewRound.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 transitive chain originating at JobPosting.LIVE→OFF_SHELF.
          Hop 1: take-off-shelf mutates JobPosting (LIVE→OFF_SHELF).
          Hop 2: that mutation itself moves every non-terminal Application
          referencing the posting to CLOSED.
          Hop 3: each Application closure itself cancels its non-terminal
          InterviewRound rows. Each link is caused by the previous link, not
          by the original take-off-shelf API call.
        test_recipe:
          setup:
            - "LIVE JobPosting J with two Applications A1 (FORWARDED, one SCHEDULED InterviewRound R1) and A2 (READ)."
          trigger:
            - "POST /recruitment/job-postings/{J}/take-off-shelf."
          assert:
            - "J.posting_status == OFF_SHELF."
            - "A1.application_status == CLOSED and A2.application_status == CLOSED."
            - "R1.round_status == CANCELLED."
            - "AuditEvent rows exist for each hop with subject_entity in {JobPosting, Application, InterviewRound} and event_kind=STATE_TRANSITION."

      - name: company_blacklist_cascades_to_contracts_and_postings
        grounds:
          - state_machines.Company.VERIFIED_to_BLACKLISTED
          - state_machines.JobPosting.LIVE_to_OFF_SHELF
          - state_machines.Application.FORWARDED_to_CLOSED
          - entities.HeadhunterContract.fields.contract_status
        distinguishing_aspect: |
          Different originating trigger (Company.blacklist, not JobPosting.take-off-shelf).
          Hop 1: Company VERIFIED→BLACKLISTED.
          Hop 2: that mutation cascades every JobPosting for the Company to OFF_SHELF
          AND every ACTIVE HeadhunterContract for the Company to TERMINATED.
          Hop 3: each JobPosting OFF_SHELF (hop 2) itself closes Applications, satisfying
          depth ≥ 3 along the JobPosting branch.
        test_recipe:
          setup:
            - "VERIFIED Company C with two LIVE JobPostings J1, J2 and one ACTIVE HeadhunterContract K. J1 has one Application A1 in FORWARDED state."
          trigger:
            - "POST /recruitment/companies/{C}/blacklist with blacklist_reason='fraudulent license'."
          assert:
            - "C.verification_status == BLACKLISTED."
            - "J1.posting_status == OFF_SHELF and J2.posting_status == OFF_SHELF."
            - "A1.application_status == CLOSED (depth-3 hop)."
            - "K.contract_status == TERMINATED."

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_quota_pair_on_jobposting_approve
        grounds:
          - validations[priority=8]
          - validations[priority=16]
          - state_machines.JobPosting.UNDER_REVIEW_to_LIVE
        distinguishing_aspect: |
          Pair {state (priority 8), business_fiscal (priority 16)} — when a
          JobPosting approval is attempted on a posting that is already LIVE
          (state conflict) AND the Company is at quota (fiscal conflict),
          priority demands ERR_INVALID_STATE wins because the state check
          fires before the fiscal quota check.
        test_recipe:
          setup:
            - "BASIC Company at posting_quota_limit==5, currently with active_job_posting_count==5 (all five postings LIVE)."
            - "An additional JobPosting J6 already in LIVE (created via prior approval — assume one of the five is actually J6 brought to LIVE earlier so it cannot be approved again)."
          trigger:
            - "POST /recruitment/job-postings/{J6}/approve."
          assert:
            - "HTTP 409 with error_id == 'ERR_INVALID_STATE' (state check at priority 8 wins over quota check at priority 16)."

      - name: prohibited_content_vs_duplicate_posting_pair
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - state_machines.JobPosting.UNDER_REVIEW_to_LIVE
        distinguishing_aspect: |
          Pair {business_safety (priority 9, ERR_PROHIBITED_CONTENT),
          business_constraint (priority 10, ERR_DUPLICATE_POSTING)} — when a
          job's description contains a banned word AND another LIVE posting
          with the same content_fingerprint exists, safety check wins
          (ERR_PROHIBITED_CONTENT) because priority 9 fires before priority 10.
          This is a different error-category pair from state_vs_quota_pair_on_jobposting_approve.
        test_recipe:
          setup:
            - "BASIC verified Company with one LIVE posting whose content_fingerprint matches J_NEW."
            - "JobPosting J_NEW in UNDER_REVIEW whose description contains a banned discriminatory word."
          trigger:
            - "POST /recruitment/job-postings/{J_NEW}/approve."
          assert:
            - "HTTP 422 with error_id == 'ERR_PROHIBITED_CONTENT' (priority 9 wins over priority 10)."

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: offer_acceptance_deadline_exact_boundary
        grounds:
          - calculations.offer_acceptance_deadline
          - validations[priority=12]
          - state_machines.Offer.ISSUED_to_EXPIRED
        distinguishing_aspect: |
          Numeric/temporal threshold: accept requires now() < deadline (strict);
          equality means EXPIRED. Tested on Offer entity via POST accept and
          POST clock-advance endpoints, on the Offer.acceptance_deadline_at
          metric.
        test_recipe:
          setup:
            - "Offer issued at fixed T0. acceptance_deadline_at = T0 + 168 hours."
          trigger:
            - "POST /recruitment/_clock/advance to exactly T0 + 168h."
            - "POST /recruitment/offers/{id}/accept."
          assert:
            - "HTTP 409 with error_id == 'ERR_OFFER_EXPIRED' because now() == acceptance_deadline_at counts as expired (>=)."

      - name: candidate_rate_limit_zero_count_and_strict_count
        grounds:
          - calculations.candidate_rate_limit_window
          - validations[priority=15]
          - entities.Candidate.fields.applications_last_60s_count
        distinguishing_aspect: |
          Different metric (count over half-open time window) and different
          endpoint (POST /recruitment/applications) from
          offer_acceptance_deadline_exact_boundary. Boundary: count ==
          MAX_PER_WINDOW (5) at evaluation → reject the 6th submission;
          count == 0 at evaluation → first submission always allowed.
        test_recipe:
          setup:
            - "Candidate C with zero prior Applications."
            - "Five LIVE JobPostings J1..J5 in distinct verified Companies."
          trigger:
            - "POST /recruitment/applications five times in rapid succession (within 60s window)."
            - "POST /recruitment/applications a sixth time within the same window."
          assert:
            - "First five POSTs succeed (count grows 1,2,3,4,5)."
            - "Sixth POST returns HTTP 429 with error_id == 'ERR_CANDIDATE_RATE_LIMIT' (count == 5 at evaluation; >= rule)."
            - "After advancing clock 61 seconds past the first POST, a new POST succeeds because applications_last_60s_count has decayed to <5 (window is half-open [now()-60s, now()))."

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: jobposting_approve_requires_company_verified
        grounds:
          - state_machines.JobPosting.DRAFT_to_UNDER_REVIEW
          - state_machines.Company.PENDING_to_VERIFIED
          - state_machines.Company.VERIFIED_to_EXPIRED
        distinguishing_aspect: |
          Entity pair (Company, JobPosting): JobPosting cannot transition
          DRAFT→UNDER_REVIEW (or be approved to LIVE) unless its owning
          Company.verification_status == VERIFIED. Independent attempt on a
          Company in PENDING or EXPIRED status fails.
        test_recipe:
          setup:
            - "Company in PENDING state (submit-verification done, approve-verification not yet)."
            - "JobPosting J in DRAFT for that Company."
          trigger:
            - "POST /recruitment/job-postings/{J}/submit-review."
          assert:
            - "HTTP 409 with error_id == 'ERR_INVALID_STATE' (state precondition fails because owning Company is not VERIFIED)."
            - "After admin approves Company verification and the test retries, the same POST succeeds with HTTP 200."

      - name: offer_submit_approval_requires_application_interview
        grounds:
          - state_machines.Offer.DRAFT_to_PENDING_HM
          - state_machines.Application.FORWARDED_to_INTERVIEW
          - state_machines.InterviewRound.FEEDBACK_PENDING_to_PASSED
        distinguishing_aspect: |
          Different entity pair (Application+InterviewRound, Offer):
          Offer.submit-approval requires Application.application_status==INTERVIEW
          AND ≥1 InterviewRound in PASSED. Two entities other than the Offer
          itself govern the transition; both must be in the right states.
        test_recipe:
          setup:
            - "Application advanced only to FORWARDED (no InterviewRound created yet)."
            - "Offer O in DRAFT linked to this Application."
          trigger:
            - "POST /recruitment/offers/{O}/submit-approval."
          assert:
            - "HTTP 409 with error_id == 'ERR_INVALID_STATE' (Application not yet INTERVIEW, no PASSED InterviewRound)."
            - "After creating an InterviewRound, scheduling it, advancing the clock past scheduled_end_at, and submitting feedback PASS, the same POST succeeds with HTTP 200."

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: interviewer_half_open_overlap
        grounds:
          - calculations.interview_slot_overlap
          - state_machines.InterviewRound.AWAITING_CANDIDATE_to_SCHEDULED
          - validations[priority=14]
          - entities.InterviewRound.fields.scheduled_start_at
        distinguishing_aspect: |
          Resource: HrUser (interviewer) calendar. Interval semantics: half-open
          [start, start+60min) — touching boundary (a.end == b.start) is NOT
          overlap. Two SCHEDULED rounds that share an instant collide;
          back-to-back rounds (end==start) do not.
        test_recipe:
          setup:
            - "HrUser U as interviewer on two distinct InterviewRound rows R1 (already SCHEDULED at T0..T0+60min) and R2 (AWAITING_CANDIDATE with options including T0+45min and T0+60min)."
          trigger:
            - "POST /recruitment/interview-rounds/{R2}/candidate-confirm with selected_slot=T0+45min."
            - "On a fresh fixture: POST /recruitment/interview-rounds/{R2}/candidate-confirm with selected_slot=T0+60min."
          assert:
            - "First confirm returns HTTP 409 ERR_INTERVIEWER_BUSY (collision: T0+45..T0+1h45 overlaps T0..T0+1h)."
            - "Second confirm succeeds (T0+60..T0+2h begins exactly at R1.end; touching boundary is not overlap)."

      - name: company_posting_quota_aggregate_capacity
        grounds:
          - calculations.posting_quota_consumed
          - concurrency_rules[posting_quota_exceeded_race]
          - validations[priority=16]
          - entities.Company.fields.active_job_posting_count
        distinguishing_aspect: |
          Different resource (Company aggregate slot capacity) and different
          interval semantics (no time interval — aggregate-capacity overlap on a
          single integer dimension). Rule: count of LIVE postings must remain
          strictly < posting_quota_limit. This is a temporally-stable count,
          NOT a half-open time window, and lives on a different entity from
          interviewer_half_open_overlap.
        test_recipe:
          setup:
            - "Verified BASIC Company with 5 LIVE JobPostings (active_job_posting_count == 5 == posting_quota_limit)."
            - "Sixth JobPosting J6 in UNDER_REVIEW."
          trigger:
            - "POST /recruitment/job-postings/{J6}/approve."
          assert:
            - "HTTP 409 with error_id == 'ERR_POSTING_QUOTA_EXCEEDED' (5 < 5 is false; equality is the boundary; strict <)."
            - "After taking one LIVE posting off-shelf (count==4), the same approve succeeds (4 < 5 true)."

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: posting_quota_counter_invariant
        grounds:
          - calculations.posting_quota_consumed
          - state_machines.JobPosting.UNDER_REVIEW_to_LIVE
          - state_machines.JobPosting.LIVE_to_OFF_SHELF
          - entities.Company.fields.active_job_posting_count
        distinguishing_aspect: |
          Conserved quantity: Company.active_job_posting_count MUST equal
          count(JobPosting where company_id==C.id and posting_status==LIVE) at
          all times. Forward action (approve, LIVE→count++) paired with
          compensating action (take-off-shelf, OFF_SHELF→count--) leaves the
          counter equal to the actual LIVE count.
        test_recipe:
          setup:
            - "Verified BASIC Company C; active_job_posting_count == 0."
            - "JobPosting J in UNDER_REVIEW."
          trigger:
            - "POST /recruitment/job-postings/{J}/approve (J → LIVE)."
            - "POST /recruitment/job-postings/{J}/take-off-shelf (J → OFF_SHELF)."
          assert:
            - "After approve: C.active_job_posting_count == 1 == count(LIVE JobPostings for C)."
            - "After take-off-shelf: C.active_job_posting_count == 0 == count(LIVE JobPostings for C)."
            - "Invariant active_job_posting_count == count(LIVE) holds at every checkpoint."

      - name: commission_settlement_value_invariant
        grounds:
          - calculations.commission_gross_amount
          - calculations.net_settlement_amount
          - state_machines.CommissionRecord.ACCRUED_to_SETTLED
          - state_machines.CommissionRecord.ACCRUED_to_CLAWED_BACK
          - entities.CommissionRecord.fields.gross_commission_cents
          - entities.CommissionRecord.fields.tax_withheld_cents
          - entities.CommissionRecord.fields.net_settlement_cents
          - entities.CommissionRecord.fields.clawback_amount_cents
        distinguishing_aspect: |
          Different conserved quantity (monetary, not a count). The forward
          action (Offer ACCEPTED → CommissionRecord with gross,tax) paired with
          the compensating action (Offer RESCINDED → CLAWED_BACK redirecting
          the after-tax disbursement from candidate-headhunter to platform)
          MUST leave a named global quantity unchanged. The pinned invariant:
            net_settlement_cents + clawback_amount_cents == gross_commission_cents - tax_withheld_cents
          at any terminal CommissionRecord state (SETTLED or CLAWED_BACK).
        test_recipe:
          setup:
            - "HeadhunterContract{fee_model=SUCCESS_FEE, success_fee_pct_bps=2500, trigger_event=OFFER_ACCEPTED, tax_withholding_pct_bps=1500, clawback_window_days=90}."
            - "Offer.base_salary_cents=5000000, sign_on_bonus_cents=0 issued and ACCEPTED via headhunter channel."
          trigger:
            - "POST /recruitment/offers/{id}/rescind with rescission_reason=BUSINESS_NEED before any Onboarding is created."
            - "GET /recruitment/commission-records/{id}."
          assert:
            - "CommissionRecord.gross_commission_cents == 1250000."
            - "CommissionRecord.tax_withheld_cents == 187500."
            - "CommissionRecord.clawback_amount_cents == 1062500."
            - "CommissionRecord.net_settlement_cents == 0."
            - "Invariant holds: net_settlement_cents + clawback_amount_cents == 0 + 1062500 == 1062500 == gross_commission_cents - tax_withheld_cents (1250000 - 187500)."
