              captures: { ord_cc4_disc: $.data.discount_cents, ord_cc4_total: $.data.total_cents }
          assert:
            - "Order.${ord_cc4}.discount_cents == 10500 (5% fallback, not 8%)"
            - "Order.${ord_cc4}.total_cents == 215000"

  # =========================================================================
  # Section: consistency_model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_confirm_side_effects
        claim_type: immediate_consistency
        grounds:
          - "complexity_profile.consistency_model"
          - "state_machines.Order.QUOTED_to_CONFIRMED"
        distinguishing_aspect: "Immediate consistency: the confirm response itself carries the computed subtotal/discount/total and reserved lot ids — no re-read lag."
        test_recipe:
          setup: ["QUOTED order 15 bundles at 2000, lot 100 on hand"]
          setup_api_calls:
            - call: "POST /roofing/branches"
              payload: { branch_code: "BR-CM1", name: "CM1", rooftop_delivery_capacity_per_day: 4, conveyor_fleet_size: 2, crane_available: true }
              as: PlatformAdmin
              captures: { br_cm1: $.data.id }
            - call: "POST /roofing/products"
              payload: { sku: "SH-CM1", manufacturer_name: "Acme", color_code: "BLK", bundles_per_square: 3.0, base_price_per_bundle_cents: 2000 }
              as: PlatformAdmin
              captures: { prod_cm1: $.data.id }
            - call: "POST /roofing/branches/${br_cm1}/inventory-lots"
              payload: { product_id: "${prod_cm1}", lot_code: "LOT-CM1", on_hand_bundles: 100 }
              as: WarehouseClerk
              captures: { lot_cm1: $.data.id }
            - call: "POST /roofing/contractor-accounts"
              payload: { company_name: "CM1 Co", credit_limit_cents: 10000000, pricing_tier: "STANDARD" }
              as: CreditAnalyst
              captures: { ca_cm1: $.data.id }
            - call: "POST /roofing/contractor-accounts/${ca_cm1}/job-accounts"
              payload: { job_name: "Job CM1", site_address: "51 Oak St" }
              as: CreditAnalyst
              captures: { ja_cm1: $.data.id }
            - call: "POST /roofing/job-accounts/${ja_cm1}/takeoffs"
              payload: { product_id: "${prod_cm1}", roof_squares: 5.0, waste_factor_pct: 0, valley_ridge_linear_feet: 0  }
              as: SalesRep
              captures: { tk_cm1: $.data.id }
            - call: "POST /roofing/takeoffs/${tk_cm1}/quote"
              payload: {}
              as: SalesRep
            - call: "POST /roofing/takeoffs/${tk_cm1}/convert"
              payload: { branch_id: "${br_cm1}" }
              as: Contractor
              as_user_id: "${ca_cm1}"
              captures: { ord_cm1: $.data.id }
            - call: "GET /roofing/contractor-accounts/${ca_cm1}"
              payload: {}
              as: CreditAnalyst
              captures: { ca_cm1_v: $.data.version }
          trigger:
            - call: "POST /roofing/orders/${ord_cm1}/confirm"
              payload: { expected_contractor_account_version: "${ca_cm1_v}" }
              as: Contractor
              as_user_id: "${ca_cm1}"
              captures: { ord_cm1_sub: $.data.subtotal_cents, ord_cm1_total: $.data.total_cents, ord_cm1_status: $.data.status }
          assert:
            - "Confirm response has status == CONFIRMED"
            - "Confirm response has subtotal_cents == 30000 and total_cents == 30000 in the same response"
