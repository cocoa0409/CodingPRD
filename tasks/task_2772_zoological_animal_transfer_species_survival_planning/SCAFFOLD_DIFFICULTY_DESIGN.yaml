  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: slot_conservation_across_execute_and_terminate
        grounds:
          - calculations.holding_slot_occupancy
          - state_machines.TransferAgreement.EXECUTED_to_TERMINATED
          - state_machines.Animal.RESERVED_to_HELD
          - state_machines.PopulationRecommendation.FULFILLED_to_ENDORSED
          - state_machines.SpeciesProgram.CYCLE_CLOSED_to_PUBLISHED
          - entities.Institution.fields.occupied_slots
          - entities.Institution.fields.reserved_slots
        distinguishing_aspect: |
          The conserved quantity is an INTEGER COUNT: the SLOT_CONSERVATION invariant
          sum(occupied_slots + reserved_slots) == count(non-DISPOSED animals) must hold at rest,
          after the execute that moves M1 from occupying a slot at the sender to reserving one at
          the receiver, and again after the compensating terminate. Because both fields are fully
          recomputed rather than incremented, an implementation that decrements on execute and
          increments on terminate drifts as soon as the recommendation reopens.
        test_recipe:
          setup:
            - "Clock at its 2026-08-01T00:00:00Z default for accession, then 2026-08-10T09:00:00Z for execution and termination."
            - "Two animals exist in total: M1 HELD at Cedar Ridge Zoo, F1 HELD at Harbor Bay Zoo, so the system-wide non-DISPOSED count is 2 for the whole recipe."
            - "One recommendation is endorsed and its agreement is ACCEPTED, so open_recommendation_count is 1 before the trigger."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { sender_id: $.data.id }
            - call: "POST /institutions"
              payload: { name: "Harbor Bay Zoo", jurisdiction_code: "US-TX", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { receiver_id: $.data.id }
            - call: "POST /species-programs"
              payload: { taxon_name: "Panthera uncia", program_type: "SSP_RED", target_population_size: 300, studbook_keeper_name: "K. Ahlgren" }
              as: AccreditationAdmin
              captures: { program_id: $.data.id }
            - call: "POST /species-programs/${program_id}/publish-plan"
              payload: { publication_note: "Cycle 1 published" }
              as: ProgramCoordinator
              as_user_id: "${program_id}"
            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${sender_id}", owning_institution_id: "${sender_id}", local_id: "CR-101", sex: "MALE", birth_date: "2019-05-10", founder_representation_pct: 12.45 }
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { m1_id: $.data.id, m1_v1: $.data.version }
            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${receiver_id}", owning_institution_id: "${receiver_id}", local_id: "HB-201", sex: "FEMALE", birth_date: "2020-03-15", founder_representation_pct: 30.00 }
              as: Registrar
              as_user_id: "${receiver_id}"
              captures: { f1_id: $.data.id }
            - call: "POST /population-recommendations"
              payload: { species_program_id: "${program_id}", recommendation_type: "BREED_WITH", subject_animal_id: "${m1_id}", paired_animal_id: "${f1_id}", sending_institution_id: "${sender_id}", receiving_institution_id: "${receiver_id}", analysis_mode: "PEDIGREE_ONLY", priority_rank: 1, expires_on: "2026-12-31", expected_subject_animal_version: "${m1_v1}" }
              as: ProgramCoordinator
              as_user_id: "${program_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /population-recommendations/${rec_id}/endorse"
              payload: { endorsement_note: "Endorsed by sender" }
              as: Registrar
              as_user_id: "${sender_id}"
            - call: "POST /transfer-agreements"
              payload: { recommendation_id: "${rec_id}", animal_id: "${m1_id}", sending_institution_id: "${sender_id}", receiving_institution_id: "${receiver_id}", ownership_disposition: "OWNERSHIP_TRANSFER", offspring_disposition_rule: "SPLIT_50_50", breeding_rights: "FULL", transport_cost_share_pct: 51.0 }
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { ta_id: $.data.id }
            - call: "POST /transfer-agreements/${ta_id}/offer"
              payload: { transport_cost_share_pct: 51.0 }
              as: Registrar
              as_user_id: "${sender_id}"
            - call: "POST /transfer-agreements/${ta_id}/accept"
              payload: { acceptance_note: "Terms accepted" }
              as: Registrar
              as_user_id: "${receiver_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: AccreditationAdmin
          trigger:
            - call: "GET /institutions/${sender_id}"
              payload: {}
              as: AccreditationAdmin
            - call: "GET /institutions/${receiver_id}"
              payload: {}
              as: AccreditationAdmin
            - call: "POST /transfer-agreements/${ta_id}/execute"
              payload: { execution_note: "Executed" }
              as: Registrar
              as_user_id: "${sender_id}"
            - call: "POST /transfer-agreements/${ta_id}/terminate"
              payload: { reason: "Receiving institution withdrew the holding space" }
              as: Registrar
              as_user_id: "${sender_id}"
          assert:
            - "Before the execute: Institution.${sender_id}.occupied_slots == 1, reserved_slots == 0; Institution.${receiver_id}.occupied_slots == 1, reserved_slots == 0; the invariant sum is 2"
            - "After the execute: Institution.${sender_id}.occupied_slots == 0, reserved_slots == 0"
            - "After the execute: Institution.${receiver_id}.occupied_slots == 1, reserved_slots == 1; the invariant sum is still 2"
            - "After the execute: Animal.${m1_id}.location_status == RESERVED and owning_institution_id == ${receiver_id}"
            - "After the terminate: Institution.${sender_id}.occupied_slots == 1, reserved_slots == 0"
            - "After the terminate: Institution.${receiver_id}.occupied_slots == 1, reserved_slots == 0; the invariant sum is 2 with no drift"
            - "After the terminate: Animal.${m1_id}.location_status == HELD, holding_institution_id == ${sender_id} and owning_institution_id == ${sender_id}"
            - "After the terminate: TransferAgreement.${ta_id}.status == TERMINATED and termination_reason == 'Receiving institution withdrew the holding space'"
            - "After the terminate: PopulationRecommendation.${rec_id}.status == ENDORSED and Animal.${m1_id}.pending_recommendation_id == ${rec_id}"
            - "After the terminate: SpeciesProgram.${program_id}.plan_status == PUBLISHED and open_recommendation_count == 1"

      - name: credit_ledger_zero_sum_across_execute_and_terminate
        grounds:
          - calculations.transfer_credit_ledger
          - calculations.transfer_credit_valuation
          - state_machines.TransferAgreement.EXECUTED_to_TERMINATED
          - entities.Institution.fields.transfer_credit_balance
          - entities.TransferAgreement.fields.provisional_credit_points
          - entities.TransferAgreement.fields.final_credit_points
        distinguishing_aspect: |
          The conserved quantity here is SIGNED CURRENCY, not a count: every posting is
          double-entry, so sum(transfer_credit_balance) == 0.00 must hold at rest, after the
          execute posts +62.23 / -62.23, and after the terminate reverses the RECORDED net back to
          0.00 / 0.00. The reversal must use the stored provisional_credit_points, not a fresh
          valuation - the recorded points stay on the agreement row after termination, which is
          how a re-valuing implementation is caught.
        test_recipe:
          setup:
            - "Identical fixture to slot_conservation_across_execute_and_terminate: M1 (born 2019-05-10, founder_representation_pct 12.45) moving under an OWNERSHIP_TRANSFER agreement with transport_cost_share_pct 51.0, ACCEPTED, clock 2026-08-10T09:00:00Z."
            - "Both institutions start with transfer_credit_balance 0.00."
          setup_api_calls:
