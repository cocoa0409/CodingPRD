# =============================================================================
# PRD Benchmark Scaffold — task_2628
# Resort Fee & Ancillary Charge Disclosure Compliance
# (lodging operator revenue and compliance)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2628. Resort Fee & Ancillary Charge Disclosure Compliance (lodging operator
  revenue and compliance): mandatory fee inventory with inclusion analysis of
  what services are bundled, total price display requirements at first quote
  across owned and third-party channels, itemization on folios with taxability
  determination per fee by jurisdiction, optional versus mandatory
  classification and opt-out mechanics where a fee is avoidable, disclosure
  content standards in booking flows, confirmations and check-in documents,
  guest complaint and refund policy for undisclosed charges, regulator inquiry
  and enforcement response with remediation of booking paths, revenue impact
  modeling of rolling fees into the room rate

domain_name: resort-fee-disclosure-compliance
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # graph: ChannelDisclosureProfile is a 3-way junction over
  # (Property x Channel x FeeProgram); TaxabilityRule is a junction over
  # (Jurisdiction x fee_code); FeeProgram.supersedes_program_id is a
  # self-referential edge forming a version chain; FolioLine references three
  # different aggregates (Folio, Fee, Jurisdiction). There is no single
  # ownership tree — most reads traverse edges, not nesting.

  state_machine_shape: cyclic
  # cyclic is the dominant shape:
  #   ChannelDisclosureProfile: DEPLOYED -> FLAGGED -> REMEDIATED -> DEPLOYED
  #   RegulatorInquiry: REMEDIATION_REQUIRED -> REMEDIATION_SUBMITTED ->
  #                     REMEDIATION_REQUIRED
  #   Folio: ITEMIZED -> POSTED -> ADJUSTED -> POSTED
  # plus one parallel-dimension machine (Booking: stay_status x
  # disclosure_status) and one branching fork (GuestComplaint:
  # UNDER_INVESTIGATION -> {SUBSTANTIATED, UNSUBSTANTIATED}).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The RevenueManager who authors a FeeProgram cannot be the ComplianceOfficer
  # who attests it (FeeProgram.authored_by_user_id != X-User-ID at publish), and
  # the user who drafts a regulator response cannot be the RegulatoryLiaison who
  # submits it (RegulatorInquiry.drafted_by_user_id != X-User-ID at submit).

  consistency_model: immediate

  difficulty_level: expert_plus
  # 15 entities / 72 endpoints / 60 error codes / 3 dual-variant calculations /
  # 7 state machines (3 cyclic, 1 parallel-dimension, 1 branching).

# -----------------------------------------------------------------------------
# 1.0 Response Envelope (FIXED — VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  - name: Jurisdiction
    parent: null
    common_fields: true
    description: >
      Configuration entity. A taxing/regulating authority whose disclosure and
      taxability mandates govern every Property inside it.
    fields:
      - name: code
        type: string
        source: input
        description: Stable jurisdiction code, e.g. "US-NV-CLARK".
        constraints: "unique across Jurisdiction; 3..32 chars; uppercase letters, digits and hyphens only"
      - name: name
        type: string
        source: input
        description: Human-readable jurisdiction name.
        constraints: "1..120 chars"
      - name: occupancy_tax_rate_bps
        type: integer
        source: input
        description: Default occupancy/transient-lodging tax rate in basis points applied to taxable amounts.
        constraints: "0 <= occupancy_tax_rate_bps <= 5000"
      - name: first_quote_total_required
        type: boolean
        source: input
        description: When true, a booking channel must display the all-in total (room + mandatory fees + tax) at first quote.
      - name: itemization_required_on_folio
        type: boolean
        source: input
        description: When true, every mandatory fee must appear as its own folio line at itemization.
      - name: mandatory_fee_ban
        type: boolean
        source: input
        default: false
        description: When true, a FeeProgram carrying any Fee with classification MANDATORY cannot be published for a Property in this jurisdiction.
      - name: opt_out_mandate
        type: boolean
        source: input
        default: false
        description: When true, every MANDATORY Fee that bundles avoidable services must carry avoidable=true and a non-null opt_out_window_hours.

  - name: TaxabilityRule
    parent: null
    common_fields: true
    description: >
      Junction/configuration entity over (Jurisdiction x fee_code). Decides
      whether a fee code is taxed in that jurisdiction, and at what rate.
    fields:
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; the jurisdiction whose taxability determination this rule encodes."
      - name: fee_code
        type: string
        source: input
        description: The Fee.code this rule governs. Matching is exact and case-sensitive.
        constraints: "1..32 chars; (jurisdiction_id, fee_code) is unique"
      - name: taxability
        type: enum
        source: input
        description: >
          TAXABLE = always taxed. EXEMPT = never taxed. TAXABLE_IF_MANDATORY =
          taxed only while the charge is a mandatory fee on that booking; once
          the guest is granted an opt-out the charge is no longer mandatory and
          the tax is credited back in full.
        constraints: "one of {TAXABLE, EXEMPT, TAXABLE_IF_MANDATORY}"
      - name: tax_rate_bps
        type: integer
        source: input
        default: null
        description: Per-fee-code rate override in basis points. When null the Jurisdiction.occupancy_tax_rate_bps is used.
        constraints: "null, or 0 <= tax_rate_bps <= 5000"

  - name: Property
    parent: null
    common_fields: true
    description: >
      A lodging property. Carries the derived disclosure posture that gates
      FeeProgram publication.
    fields:
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; the jurisdiction whose mandates and tax rates govern this property."
      - name: name
        type: string
        source: input
        description: Property name.
        constraints: "1..120 chars"
      - name: brand_code
        type: string
        source: input
        description: Brand/chain code used on guest-facing documents.
        constraints: "1..16 chars"
      - name: base_room_rate_cents
        type: integer
        source: input
        description: Reference nightly room rate in cents, used by FeeProgram totals and by revenue-impact modelling.
        constraints: "base_room_rate_cents >= 0"
      - name: status
        type: enum
        source: input
        default: ACTIVE
        description: Operating status. Only ACTIVE properties accept FeeProgram creation, publication and profile deployment.
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: min_channel_disclosure_score
        type: integer
        source: computed
        default: null
        description: >
          Minimum effective disclosure score over this property's
          ChannelDisclosureProfile rows whose status IN {DEPLOYED, FLAGGED,
          REMEDIATED}, where a FLAGGED profile contributes 0. null when that set
          is empty. See calculations.property_disclosure_posture.
      - name: disclosure_posture
        type: enum
        source: computed
        default: COMPLIANT
        description: >
          Derived posture gate. NON_COMPLIANT blocks FeeProgram publication. See
          calculations.property_disclosure_posture for the exact thresholds.
        constraints: "one of {COMPLIANT, AT_RISK, NON_COMPLIANT}"
      - name: open_disclosure_obligation_count
        type: integer
        source: computed
        default: 0
        description: >
          count(ChannelDisclosureProfile where property_id = this.id AND status =
          FLAGGED) + count(Booking where property_id = this.id AND
          disclosure_status IN {DISPUTED, UNDISCLOSED_CONFIRMED}) +
          count(GuestComplaint on those bookings where status IN {SUBMITTED,
          UNDER_INVESTIGATION, SUBSTANTIATED}) + count(RegulatorInquiry where
          property_id = this.id AND status NOT IN {ACCEPTED, WITHDRAWN}). The
          conserved quantity of INVARIANT_1 of
          calculations.disclosure_obligation_conservation; see also
          calculations.property_disclosure_posture, which recomputes it.
      - name: published_fee_program_count
        type: integer
        source: computed
        default: 0
        description: count(FeeProgram where property_id = this.id AND status = PUBLISHED).
      - name: aggregate_disclosure_gap_cents
        type: integer
        source: computed
        default: 0
        description: >
          sum(Booking.quote_disclosure_gap_cents) over Booking rows where
          property_id = this.id AND disclosure_status IN {DISPUTED,
          UNDISCLOSED_CONFIRMED}. Order-insensitive sum; recomputed on every
          Booking.disclosure_status transition.

  - name: Channel
    parent: null
    common_fields: true
    description: >
      A distribution channel (owned or third-party) through which quotes are
      shown and bookings are taken. Its technical capabilities constrain which
      disclosure profiles may be deployed on it.
    fields:
      - name: name
        type: string
        source: input
        description: Channel display name.
        constraints: "1..120 chars"
      - name: channel_type
        type: enum
        source: input
        description: Channel family. RegulatorInquiry.channel_scope is expressed in these members.
        constraints: "one of {OWNED_WEB, OWNED_APP, OTA, GDS, METASEARCH, VOICE}"
      - name: supports_total_price_display
        type: boolean
        source: input
        description: Whether the channel is technically able to render an all-in total at first quote.
      - name: supports_itemization
        type: boolean
        source: input
        description: Whether the channel is technically able to render a per-fee itemization at first quote.

  - name: FeeProgram
    parent: Property
    common_fields: true
    description: >
      A versioned mandatory-fee inventory for one property, effective over a
      half-open date interval. Publication is the compliance attestation event.
      Programs form a self-referential supersession chain.
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property this fee inventory belongs to."
      - name: supersedes_program_id
        type: string
        source: input
        default: null
        description: "FK -> FeeProgram.id; self-referential edge naming the PUBLISHED program this one replaces at publication. null for a first program."
      - name: version_label
        type: string
        source: input
        description: Operator-chosen label, e.g. "FY27-A".
        constraints: "1..32 chars; unique per property_id"
      - name: effective_from
        type: datetime
        source: input
        description: Inclusive start of the program's effective interval (ISO 8601 UTC, three fractional digits).
      - name: effective_to
        type: datetime
        source: input
        description: Exclusive end of the program's effective interval. The interval is half-open [effective_from, effective_to).
        constraints: "effective_to > effective_from"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Lifecycle state. See state_machines.FeeProgram.
        constraints: "one of {DRAFT, UNDER_REVIEW, PUBLISHED, SUPERSEDED}"
      - name: authored_by_user_id
        type: string
        source: system
        description: X-User-ID of the RevenueManager who created the program. Segregation-of-duties anchor.
      - name: attested_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the ComplianceOfficer who published the program. MUST differ from authored_by_user_id.
      - name: attestation_note
        type: string
        source: system
        default: null
        description: Free-text attestation captured at publication.
      - name: published_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant at which the program moved to PUBLISHED.
      - name: fee_count
        type: integer
        source: computed
        default: 0
        description: count(Fee where fee_program_id = this.id), any classification. Recomputed on every Fee create.
      - name: mandatory_fee_count
        type: integer
        source: computed
        default: 0
        description: count(Fee where fee_program_id = this.id AND classification = MANDATORY). Recomputed on every Fee create and at publication.
      - name: total_mandatory_fee_cents_per_night
        type: integer
        source: computed
        default: 0
        description: "See calculations.fee_program_rollup. Stays at 0 while the program is DRAFT or UNDER_REVIEW and is computed once, at publication."
      - name: inclusion_coverage_ratio
        type: number
        source: computed
        default: 0.0
        description: "See calculations.fee_program_rollup. Stays at 0.0 while the program is DRAFT or UNDER_REVIEW and is computed once, at publication; 0.0000 when mandatory_fee_count = 0."

  - name: Fee
    parent: FeeProgram
    common_fields: true
    description: >
      One line of the mandatory/ancillary fee inventory, with its basis, its
      avoidability and the services it bundles.
    fields:
      - name: fee_program_id
        type: string
        source: input
        description: "FK -> FeeProgram.id; the program this fee belongs to."
      - name: code
        type: string
        source: input
        description: Fee code used to join TaxabilityRule.fee_code and Booking.disclosed_fee_amounts keys.
        constraints: "1..32 chars; uppercase letters, digits and underscores; unique per fee_program_id"
      - name: label
        type: string
        source: input
        description: Guest-facing fee label.
        constraints: "1..120 chars"
      - name: classification
        type: enum
        source: input
        description: >
          MANDATORY = charged on every stay and therefore part of the all-in
          total. OPTIONAL = charged only when the guest elects the service.
          CONDITIONAL = charged only when a stay attribute triggers it; treated
          as OPTIONAL for total-price display and never itemized automatically.
        constraints: "one of {MANDATORY, OPTIONAL, CONDITIONAL}"
      - name: basis
        type: enum
        source: input
        description: How amount_cents / percent_bps expand into a stay charge. See calculations.fee_stay_amount.
        constraints: "one of {PER_NIGHT, PER_STAY, PER_PERSON_PER_NIGHT, PERCENT_OF_ROOM}"
      - name: amount_cents
        type: integer
        source: input
        default: null
        description: Flat amount in cents. Required when basis IN {PER_NIGHT, PER_STAY, PER_PERSON_PER_NIGHT}; MUST be null when basis = PERCENT_OF_ROOM.
        constraints: "null, or amount_cents >= 0"
      - name: percent_bps
        type: integer
        source: input
        default: null
        description: Percentage of the nightly room rate in basis points. Required when basis = PERCENT_OF_ROOM; MUST be null otherwise.
        constraints: "null, or 1 <= percent_bps <= 10000"
      - name: avoidable
        type: boolean
        source: input
        default: false
        description: Whether a guest may decline this fee via an OptOutRequest.
      - name: opt_out_window_hours
        type: integer
        source: input
        default: null
        description: Minimum whole hours before Booking.arrival_date by which an opt-out must be requested. Required when avoidable = true; MUST be null when avoidable = false.
        constraints: "null, or 0 <= opt_out_window_hours <= 720"
      - name: disclosure_text
        type: string
        source: input
        description: The disclosure sentence the channel must render for this fee in booking flows, confirmations and check-in documents.
        constraints: "8..500 chars"
      - name: inclusion_count
        type: integer
        source: computed
        default: 0
        description: count(FeeInclusion where fee_id = this.id). Recomputed on every FeeInclusion create.
      - name: inclusion_value_cents
        type: integer
        source: computed
        default: 0
        description: sum(FeeInclusion.included_value_cents) over FeeInclusion where fee_id = this.id. Recomputed on every FeeInclusion create.

  - name: FeeInclusion
    parent: Fee
    common_fields: true
    description: >
      One bundled service asserted to be covered by a fee. The inclusion set is
      the evidence base for inclusion analysis; a MANDATORY fee with an empty
      inclusion set cannot be published.
    fields:
      - name: fee_id
        type: string
        source: input
        description: "FK -> Fee.id; the fee that bundles this service."
      - name: service_code
        type: string
        source: input
        description: Service catalogue code, e.g. "POOL_ACCESS".
        constraints: "1..32 chars; unique per fee_id"
      - name: service_label
        type: string
        source: input
        description: Guest-facing service name.
        constraints: "1..120 chars"
      - name: retail_value_cents
        type: integer
        source: input
        description: Standalone retail value of one unit of the service, in cents.
        constraints: "retail_value_cents >= 0"
      - name: units
        type: integer
        source: input
        default: 1
        description: Units of the service bundled per stay-night.
        constraints: "1 <= units <= 100"
      - name: included_value_cents
        type: integer
        source: computed
        default: 0
        description: retail_value_cents * units. Computed at creation.

  - name: ChannelDisclosureProfile
    parent: null
    common_fields: true
    description: >
      Three-way junction over (Property x Channel x FeeProgram) describing what
      disclosure content is actually deployed on that booking path, over a
      deployment window. This is the entity a regulator remediates.
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property whose booking path this profile describes."
      - name: channel_id
        type: string
        source: input
        description: "FK -> Channel.id; the channel this booking path runs on."
      - name: fee_program_id
        type: string
        source: input
        description: "FK -> FeeProgram.id; the published fee inventory this booking path discloses."
      - name: first_quote_shows_total
        type: boolean
        source: input
        description: Whether the all-in total (room + mandatory fees + tax) is rendered at first quote on this path.
      - name: itemized_at_first_quote
        type: boolean
        source: input
        description: Whether each mandatory fee is broken out by label and amount at first quote.
      - name: disclosure_placement
        type: enum
        source: input
        description: Earliest point in the booking path at which the mandatory-fee disclosure text appears.
        constraints: "one of {FIRST_QUOTE, RATE_DETAILS, CHECKOUT, CONFIRMATION_ONLY, ABSENT}"
      - name: deployed_from
        type: datetime
        source: input
        description: Start of the deployment window for this booking path.
      - name: deployed_to
        type: datetime
        source: input
        description: End of the deployment window for this booking path.
        constraints: "deployed_to > deployed_from"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Lifecycle state. See state_machines.ChannelDisclosureProfile.
        constraints: "one of {DRAFT, DEPLOYED, FLAGGED, REMEDIATED, RETIRED}"
      - name: disclosure_score
        type: integer
        source: computed
        default: 0
        description: See calculations.channel_disclosure_score. Recomputed on create, deploy, audit, remediate and on every confirmed-undisclosed increment.
        constraints: "0 <= disclosure_score <= 100"
      - name: confirmed_undisclosed_count
        type: integer
        source: computed
        default: 0
        description: Number of GuestComplaint rows on this booking path that reached SUBSTANTIATED since the last remediation. Reset to 0 by remediation.
      - name: remediation_round
        type: integer
        source: computed
        default: 0
        description: Number of times this profile has moved FLAGGED -> REMEDIATED.
      - name: last_audited_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the most recent audit, deploy, remediate or confirm-remediation recomputation.

  - name: Booking
    parent: null
    common_fields: true
    description: >
      A reservation created through one disclosure profile. Its fee program is
      version-pinned at quote time, and it carries two independent state
      dimensions: stay progress and disclosure standing.
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property booked."
      - name: channel_id
        type: string
        source: input
        description: "FK -> Channel.id; the channel the quote was shown on. MUST equal the profile's channel_id."
      - name: channel_disclosure_profile_id
        type: string
        source: input
        description: "FK -> ChannelDisclosureProfile.id; the booking path that produced the first quote."
      - name: fee_program_id
        type: string
        source: system
        description: "FK -> FeeProgram.id; version-pinned at creation from the profile's fee_program_id. Never re-pointed afterwards, even if the program is superseded."
      - name: arrival_date
        type: datetime
        source: input
        description: Arrival instant (ISO 8601 UTC). Check-in is only permitted at or after this instant.
      - name: nights
        type: integer
        source: input
        description: Number of stay nights.
        constraints: "1 <= nights <= 30"
      - name: guests
        type: integer
        source: input
        description: Number of guests, used by PER_PERSON_PER_NIGHT fees.
        constraints: "1 <= guests <= 8"
      - name: room_rate_cents
        type: integer
        source: input
        description: Channel-quoted nightly room rate in cents. PERCENT_OF_ROOM fees are computed against this, not against Property.base_room_rate_cents.
        constraints: "room_rate_cents >= 0"
      - name: disclosed_fee_amounts
        type: object
        source: input
        default: {}
        description: >
          What the channel asserts it actually displayed at first quote, as a map
          from Fee.code to whole-stay cents. A code absent from the map counts as
          "not disclosed at all" (disclosed amount 0).
        constraints: "keys are Fee.code strings; values are integers >= 0"
      - name: quoted_room_total_cents
        type: integer
        source: computed
        description: room_rate_cents * nights. Computed at creation.
      - name: quoted_mandatory_fee_cents
        type: integer
        source: computed
        description: Mandatory fee subtotal under the per_night_rounding variant of calculations.booking_fee_subtotal. Computed at creation.
      - name: quoted_tax_cents
        type: integer
        source: computed
        description: Tax on the aggregated taxable base with a single rounding. See calculations.booking_quoted_total.
      - name: quoted_total_cents
        type: integer
        source: computed
        description: quoted_room_total_cents + quoted_mandatory_fee_cents + quoted_tax_cents. The number a total-price-display channel must show.
      - name: quote_disclosure_gap_cents
        type: integer
        source: computed
        description: See calculations.quote_disclosure_gap. Computed at creation from disclosed_fee_amounts.
      - name: folio_fee_total_cents
        type: integer
        source: computed
        default: 0
        description: Mandatory fee subtotal under the stay_aggregation variant of calculations.booking_fee_subtotal. Written at folio itemization.
      - name: folio_total_cents
        type: integer
        source: computed
        default: 0
        description: Mirror of Folio.folio_total_cents for the booking's folio. Written at itemization and on every folio adjustment.
      - name: quote_folio_variance_cents
        type: integer
        source: computed
        default: 0
        description: folio_total_cents - quoted_total_cents, written at itemization. Signed; negative means the guest was quoted more than billed.
      - name: guest_out_of_pocket_cents
        type: integer
        source: computed
        default: 0
        description: >
          sum(FolioLine.amount_cents) + sum(FolioLine.tax_cents) over every
          FolioLine whose folio_id is this booking's folio, all line_type values
          included, credits contributing negative values. The conserved quantity
          of calculations.out_of_pocket_conservation_invariant.
      - name: stay_status
        type: enum
        source: system
        default: QUOTED
        description: Stay-progress dimension. Evolves independently of disclosure_status.
        constraints: "one of {QUOTED, CONFIRMED, IN_HOUSE, CHECKED_OUT}"
      - name: disclosure_status
        type: enum
        source: system
        default: PENDING_AUDIT
        description: Disclosure-standing dimension. Evolves independently of stay_status.
        constraints: "one of {PENDING_AUDIT, DISCLOSED, DISPUTED, UNDISCLOSED_CONFIRMED, CURED}"

  - name: Folio
    parent: Booking
    common_fields: true
    description: >
      The guest bill for one booking. Created by check-in, itemized once, and
      re-postable after each adjustment.
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking this folio bills. Exactly one folio per booking."
      - name: status
        type: enum
        source: system
        default: OPEN
        description: Lifecycle state. See state_machines.Folio.
        constraints: "one of {OPEN, ITEMIZED, POSTED, ADJUSTED, CLOSED}"
      - name: line_count
        type: integer
        source: computed
        default: 0
        description: count(FolioLine where folio_id = this.id). Recomputed on every line append.
      - name: charges_subtotal_cents
        type: integer
        source: computed
        default: 0
        description: sum(FolioLine.amount_cents) over lines where line_type IN {ROOM, MANDATORY_FEE, OPTIONAL_FEE, FEE_REBILL}.
      - name: credits_total_cents
        type: integer
        source: computed
        default: 0
        description: "sum(FolioLine.amount_cents) over lines where line_type IN {FEE_CREDIT, COMPLAINT_REFUND}. Positive or zero \u2014 credit lines carry a POSITIVE amount_cents and this whole bucket is SUBTRACTED by the aggregation."
      - name: tax_total_cents
        type: integer
        source: computed
        default: 0
        description: sum(FolioLine.tax_cents) over every line of this folio, credits contributing negative values.
      - name: folio_total_cents
        type: integer
        source: computed
        default: 0
        description: charges_subtotal_cents + credits_total_cents + tax_total_cents.
      - name: itemization_complete
        type: boolean
        source: computed
        default: false
        description: True once a ROOM line plus one line per MANDATORY fee of the pinned program have been appended.
      - name: posted_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the most recent transition into POSTED.

  - name: FolioLine
    parent: Folio
    common_fields: false
    description: >
      Append-only, immutable itemization line. Adjustments never edit a line;
      they append a compensating line. Carries the per-fee taxability
      determination made against the property's jurisdiction.
    fields:
      - name: folio_id
        type: string
        source: system
        description: "FK -> Folio.id; the folio this line belongs to."
      - name: fee_id
        type: string
        source: system
        default: null
        description: "FK -> Fee.id; the fee this line charges, credits or rebills. null on ROOM lines and on COMPLAINT_REFUND lines that are not fee-specific."
      - name: jurisdiction_id
        type: string
        source: system
        description: "FK -> Jurisdiction.id; the jurisdiction whose taxability determination produced tax_rate_bps and tax_cents on this line."
      - name: line_type
        type: enum
        source: system
        description: >
          ROOM = room revenue. MANDATORY_FEE / OPTIONAL_FEE = fee charge.
          FEE_CREDIT = credit issued by a granted opt-out. FEE_REBILL = re-charge
          issued when a granted opt-out is revoked. COMPLAINT_REFUND = credit
          issued by a substantiated undisclosed-charge complaint.
        constraints: "one of {ROOM, MANDATORY_FEE, OPTIONAL_FEE, FEE_CREDIT, FEE_REBILL, COMPLAINT_REFUND}"
      - name: fee_code
        type: string
        source: system
        default: null
        description: Denormalised Fee.code for the line, null on ROOM lines.
      - name: description
        type: string
        source: system
        description: Guest-facing line description; for fee lines it is the Fee.disclosure_text in force at itemization.
      - name: amount_cents
        type: integer
        source: system
        description: "Line amount in cents, always positive on every line_type. A credit line (FEE_CREDIT, COMPLAINT_REFUND) states the magnitude of the credit here and carries the sign in tax_cents; the aggregation subtracts the credit bucket."
      - name: taxability_determination
        type: enum
        source: system
        description: >
          The taxability outcome actually applied to this line.
          TAXABLE_IF_MANDATORY_APPLIED = the TAXABLE_IF_MANDATORY rule taxed the
          line because the charge was mandatory. TAXABLE_IF_MANDATORY_WAIVED =
          the same rule un-taxed a credit line because the opt-out made the
          charge non-mandatory.
        constraints: "one of {TAXABLE, EXEMPT, TAXABLE_IF_MANDATORY_APPLIED, TAXABLE_IF_MANDATORY_WAIVED}"
      - name: tax_rate_bps
        type: integer
        source: system
        description: The rate actually applied — TaxabilityRule.tax_rate_bps when non-null, else Jurisdiction.occupancy_tax_rate_bps, else 0 for exempt outcomes.
      - name: tax_cents
        type: integer
        source: system
        description: Signed tax on this line. Negative on credit lines.
      - name: sequence_no
        type: integer
        source: system
        description: 1-based append order within the folio. The only ordering key for folio lines; never derived from id.

  - name: OptOutRequest
    parent: Booking
    common_fields: true
    description: >
      A guest's request to decline an avoidable fee. Granting it credits the
      charge and, where the taxability rule is conditional on mandatoriness, the
      tax as well. Revoking a grant rebills both.
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking the guest is opting out on."
      - name: fee_id
        type: string
        source: input
        description: "FK -> Fee.id; the avoidable fee being declined. MUST belong to the booking's pinned fee_program_id."
      - name: status
        type: enum
        source: system
        default: REQUESTED
        description: Lifecycle state. See state_machines.OptOutRequest.
        constraints: "one of {REQUESTED, GRANTED, DENIED, EXPIRED, REVOKED}"
      - name: requested_hours_before_arrival
        type: integer
        source: computed
        description: floor((Booking.arrival_date - logical_clock_now) / 3600 seconds) at creation. Negative when requested after arrival.
      - name: credit_cents
        type: integer
        source: computed
        default: 0
        description: Absolute value of the FEE_CREDIT line's amount_cents written at grant; reset to 0 at revoke.
      - name: tax_credit_cents
        type: integer
        source: computed
        default: 0
        description: Absolute value of the FEE_CREDIT line's tax_cents written at grant; reset to 0 at revoke.
      - name: credit_line_sequence_no
        type: integer
        source: system
        default: null
        description: Folio.sequence_no of the FEE_CREDIT line produced by the grant. null before grant and after revoke.
      - name: denial_reason_code
        type: enum
        source: system
        default: null
        description: Reason recorded when the request is denied.
        constraints: "null, or one of {NOT_AVOIDABLE, SERVICE_ALREADY_CONSUMED, POLICY_EXCEPTION_DENIED}"
      - name: decided_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the grant, denial, expiry or revocation.

  - name: GuestComplaint
    parent: Booking
    common_fields: true
    description: >
      A guest allegation that a posted charge was not properly disclosed.
      Adjudication forks: substantiation confirms the disclosure failure and
      propagates to the booking path; dismissal clears it.
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking whose folio is disputed."
      - name: folio_line_id
        type: string
        source: input
        description: "FK -> FolioLine.id; the specific disputed line. MUST belong to the booking's own folio."
      - name: complaint_reason
        type: enum
        source: input
        description: >
          Reason category. It selects the refund variant:
          {NOT_DISCLOSED, TOTAL_NOT_SHOWN} -> FULL_FEE_REFUND;
          {MISSTATED_AMOUNT, MANDATORY_NOT_AVOIDABLE} -> DISCLOSURE_GAP_DIFFERENTIAL.
        constraints: "one of {NOT_DISCLOSED, MISSTATED_AMOUNT, MANDATORY_NOT_AVOIDABLE, TOTAL_NOT_SHOWN}"
      - name: narrative
        type: string
        source: input
        description: The guest's account of what was and was not shown.
        constraints: "8..1000 chars"
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: Lifecycle state. See state_machines.GuestComplaint.
        constraints: "one of {SUBMITTED, UNDER_INVESTIGATION, SUBSTANTIATED, UNSUBSTANTIATED, REFUNDED}"
      - name: refund_variant
        type: enum
        source: computed
        default: null
        description: Which variant of calculations.complaint_refund_entitlement was applied. Written at substantiation.
        constraints: "null, or one of {FULL_FEE_REFUND, DISCLOSURE_GAP_DIFFERENTIAL}"
      - name: disputed_amount_cents
        type: integer
        source: computed
        default: 0
        description: The disputed FolioLine's amount_cents at substantiation (absolute value).
      - name: disclosed_amount_cents
        type: integer
        source: computed
        default: 0
        description: Booking.disclosed_fee_amounts[line.fee_code], or 0 when the code is absent or the line has no fee_code.
      - name: refund_entitlement_cents
        type: integer
        source: computed
        default: 0
        description: See calculations.complaint_refund_entitlement. Written at substantiation; forced to 0 at dismissal.
      - name: refunded_amount_cents
        type: integer
        source: system
        default: 0
        description: Amount actually refunded, written at refund. Always <= refund_entitlement_cents.
      - name: dismissal_reason_code
        type: enum
        source: system
        default: null
        description: Reason recorded when the complaint is dismissed.
        constraints: "null, or one of {DISCLOSURE_EVIDENCED, GUEST_ACKNOWLEDGED_AT_CHECK_IN, DUPLICATE_COMPLAINT}"
      - name: investigated_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the GuestServicesAgent who opened the investigation.
      - name: adjudicated_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the ComplianceOfficer who substantiated or dismissed the complaint.

  - name: RegulatorInquiry
    parent: null
    common_fields: true
    description: >
      A jurisdiction's enforcement inquiry into a property's disclosure
      practices, scoped to one or more channel families. Remediation loops until
      the regulator accepts or the inquiry is withdrawn.
    fields:
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; the inquiring authority. MUST equal the property's jurisdiction_id."
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property under inquiry."
      - name: docket_number
        type: string
        source: input
        description: Regulator's docket identifier.
        constraints: "1..64 chars; unique per jurisdiction_id"
      - name: channel_scope
        type: array
        source: input
        description: Channel families in scope. Only profiles on channels whose channel_type is in this array are flagged by remediation directives.
        constraints: "non-empty; each element is a Channel.channel_type member; no duplicates"
      - name: response_due_at
        type: datetime
        source: input
        description: Deadline for submitting the operator's response.
      - name: status
        type: enum
        source: system
        default: RECEIVED
        description: Lifecycle state. See state_machines.RegulatorInquiry.
        constraints: "one of {RECEIVED, RESPONSE_DRAFTED, RESPONSE_SUBMITTED, REMEDIATION_REQUIRED, REMEDIATION_SUBMITTED, ACCEPTED, WITHDRAWN}"
      - name: response_summary
        type: string
        source: system
        default: null
        description: Drafted response text.
      - name: remediation_directive
        type: string
        source: system
        default: null
        description: Regulator's remediation instruction recorded when remediation is required.
      - name: remediation_summary
        type: string
        source: system
        default: null
        description: Operator's description of the booking-path fixes submitted for review.
      - name: rejection_reason
        type: string
        source: system
        default: null
        description: Regulator's reason for rejecting a remediation submission.
      - name: withdrawal_reason
        type: string
        source: system
        default: null
        description: Reason recorded when the inquiry is withdrawn.
      - name: drafted_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the ComplianceOfficer who drafted the response. Segregation-of-duties anchor.
      - name: submitted_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the RegulatoryLiaison who submitted the response. MUST differ from drafted_by_user_id.
      - name: flagged_profile_ids
        type: array
        source: system
        default: []
        description: >
          Ids of the ChannelDisclosureProfile rows this inquiry flagged, in
          flagging order. Withdrawal un-flags exactly this set; acceptance clears
          it. Each element is a ChannelDisclosureProfile.id.
      - name: remediation_round
        type: integer
        source: system
        default: 0
        description: Number of times this inquiry has entered REMEDIATION_REQUIRED.
      - name: exposure_cents
        type: integer
        source: computed
        default: 0
        description: See calculations.inquiry_exposure. Recomputed when remediation is required and when a remediation submission is rejected.

  - name: RevenueImpactModel
    parent: null
    common_fields: false
    description: >
      Immutable projection comparing the status quo against rolling a subset of
      mandatory fees into the room rate. No update endpoint and no version field
      — a new scenario is a new row.
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property being modelled. base_room_rate_cents is the modelling baseline."
      - name: fee_program_id
        type: string
        source: input
        description: "FK -> FeeProgram.id; the PUBLISHED program whose mandatory fees are candidates for roll-in. MUST belong to property_id."
      - name: scenario
        type: enum
        source: input
        description: >
          STATUS_QUO requires roll_in_fee_codes = []. FULL_ROLL_IN requires
          roll_in_fee_codes to equal the program's complete MANDATORY code set.
          PARTIAL_ROLL_IN requires a non-empty proper subset of it.
        constraints: "one of {STATUS_QUO, PARTIAL_ROLL_IN, FULL_ROLL_IN}"
      - name: variant
        type: enum
        source: input
        description: >
          RATE_PARITY absorbs the rolled fees into ADR at face value and lets the
          guest bear the extra tax. TAX_ABSORBED grosses the rolled amount down
          by the occupancy tax factor so the tax-inclusive rolled amount matches
          the old fee. See calculations.revenue_impact_roll_in.
        constraints: "one of {RATE_PARITY, TAX_ABSORBED}"
      - name: roll_in_fee_codes
        type: array
        source: input
        description: Fee.code values to roll into the room rate. Every element MUST name a MANDATORY fee of fee_program_id; no duplicates.
      - name: baseline_adr_cents
        type: integer
        source: computed
        description: Property.base_room_rate_cents, restated for the model.
      - name: baseline_commission_cents
        type: integer
        source: computed
        description: Channel commission on the baseline ADR, at the tier selected by baseline_adr_cents.
      - name: baseline_tax_cents
        type: integer
        source: computed
        description: Occupancy tax on the baseline taxable base (ADR plus taxable mandatory fees).
      - name: baseline_guest_total_cents
        type: integer
        source: computed
        description: Baseline per-night guest out-of-pocket (ADR + all mandatory fees + tax).
      - name: baseline_net_revenue_cents
        type: integer
        source: computed
        description: baseline_guest_total_cents - baseline_tax_cents - baseline_commission_cents.
      - name: modeled_adr_cents
        type: integer
        source: computed
        description: Modelled per-night ADR under the selected variant.
      - name: applied_commission_bps
        type: integer
        source: computed
        description: Commission tier basis points selected by modeled_adr_cents from COMMISSION_TIER_BPS.
      - name: modeled_commission_cents
        type: integer
        source: computed
        description: Commission on modeled_adr_cents at applied_commission_bps.
      - name: modeled_tax_cents
        type: integer
        source: computed
        description: Occupancy tax on the modelled taxable base (modelled ADR plus recomputed retained taxable fees).
      - name: modeled_guest_total_cents
        type: integer
        source: computed
        description: Modelled per-night guest out-of-pocket.
      - name: modeled_net_revenue_cents
        type: integer
        source: computed
        description: modeled_guest_total_cents - modeled_tax_cents - modeled_commission_cents.
      - name: modeled_adr_delta_cents
        type: integer
        source: computed
        description: modeled_adr_cents - baseline_adr_cents. Signed.
      - name: modeled_commission_delta_cents
        type: integer
        source: computed
        description: modeled_commission_cents - baseline_commission_cents. Signed.
      - name: modeled_tax_delta_cents
        type: integer
        source: computed
        description: modeled_tax_cents - baseline_tax_cents. Signed.
      - name: modeled_guest_total_delta_cents
        type: integer
        source: computed
        description: modeled_guest_total_cents - baseline_guest_total_cents. Signed.
      - name: modeled_net_revenue_delta_cents
        type: integer
        source: computed
        description: modeled_net_revenue_cents - baseline_net_revenue_cents. Signed; the headline number of the model.

# -----------------------------------------------------------------------------
# 1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:

  - entity: FeeProgram
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    shape: linear_with_system_supersede
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /fee-programs/{id}/submit-review"
        actor: RevenueManager
        preconditions:
          - "fee_program.status == DRAFT"
          - "fee_program.fee_count >= 1"
          - "property.status == ACTIVE"
        side_effects:
          - "recompute FeeProgram.fee_count and FeeProgram.mandatory_fee_count from the program's Fee rows"
          - "increments FeeProgram.version by 1"

      - from: UNDER_REVIEW
        to: PUBLISHED
        trigger: "POST /fee-programs/{id}/publish"
        actor: ComplianceOfficer
        preconditions:
          - "fee_program.status == UNDER_REVIEW"
          - "property.status == ACTIVE"
          - "property.disclosure_posture != NON_COMPLIANT  (cross-entity: FeeProgram depends on Property)"
          - "X-User-ID != fee_program.authored_by_user_id  (segregation of duties)"
          - "NOT (jurisdiction.mandatory_fee_ban == true AND fee_program.mandatory_fee_count >= 1)"
          - "every Fee with classification == MANDATORY has inclusion_count >= 1"
          - "every Fee.code in the program has a TaxabilityRule row for the property's jurisdiction_id"
          - "when fee_program.supersedes_program_id is non-null: that program exists, has property_id == this.property_id and status == PUBLISHED"
          - "no interval collision per validations[priority=27] against other PUBLISHED programs of the same property, excluding the supersedes target"
        side_effects:
          - "sets FeeProgram.attested_by_user_id = X-User-ID, FeeProgram.attestation_note, FeeProgram.published_at = logical clock now"
          - "computes FeeProgram.mandatory_fee_count, FeeProgram.total_mandatory_fee_cents_per_night and FeeProgram.inclusion_coverage_ratio per calculations.fee_program_rollup — this is the only point at which the latter two leave their defaults"
          - "when supersedes_program_id is non-null: that FeeProgram transitions PUBLISHED -> SUPERSEDED (see next transition), which itself retires that program's live disclosure profiles"
          - "recomputes Property.published_fee_program_count"
          - "recomputes Property.min_channel_disclosure_score and Property.disclosure_posture (calculations.property_disclosure_posture)"
          - "increments Property.version by 1"
          - "increments FeeProgram.version by 1"
        note: >
          Publication is the compliance attestation. This is cascade link 1 of the
          supersede chain: publish -> predecessor SUPERSEDED -> predecessor's
          profiles RETIRED -> Property posture recomputed.

      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system: publication of a successor FeeProgram whose supersedes_program_id == this.id"
        actor: system
        preconditions:
          - "this.status == PUBLISHED"
        side_effects:
          - "every ChannelDisclosureProfile with fee_program_id == this.id and status IN {DEPLOYED, FLAGGED, REMEDIATED} transitions to RETIRED (cascade link 2)"
          - "each such profile leaving {DEPLOYED, FLAGGED, REMEDIATED} removes it from the min-score candidate set, so Property.min_channel_disclosure_score and Property.disclosure_posture are recomputed (cascade link 3)"
          - "Property.open_disclosure_obligation_count is recomputed because retired profiles no longer count as FLAGGED (cascade link 4)"
          - "increments FeeProgram.version by 1"
        note: >
          Bookings already pinned to this program keep fee_program_id pointing
          here; supersession never re-points a Booking.

  - entity: ChannelDisclosureProfile
    initial_state: DRAFT
    terminal_states: [RETIRED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: DEPLOYED
        trigger: "POST /channel-disclosure-profiles/{id}/deploy"
        actor: ChannelOperator | ComplianceOfficer
        preconditions:
          - "profile.status == DRAFT"
          - "when the caller is ChannelOperator, X-User-ID == profile.channel_id (validations[priority=4]); a ComplianceOfficer may deploy on the channel's behalf"
          - "property.status == ACTIVE"
          - "fee_program.status == PUBLISHED  (cross-entity: ChannelDisclosureProfile depends on FeeProgram)"
          - "NOT (jurisdiction.first_quote_total_required == true AND profile.first_quote_shows_total == false)"
          - "no cutover-buffer collision per validations[priority=28] against other profiles on the same (property_id, channel_id) whose status IN {DEPLOYED, FLAGGED, REMEDIATED, RETIRED}"
        side_effects:
          - "recomputes profile.disclosure_score (calculations.channel_disclosure_score) and sets last_audited_at = logical clock now"
          - "any other ChannelDisclosureProfile on the same (property_id, channel_id) with status == DEPLOYED transitions DEPLOYED -> RETIRED"
          - "recomputes Property.min_channel_disclosure_score and Property.disclosure_posture"
          - "increments Property.version by 1"
          - "increments ChannelDisclosureProfile.version by 1"

      - from: DEPLOYED
        to: FLAGGED
        trigger: "POST /channel-disclosure-profiles/{id}/audit when the recomputed disclosure_score < DISCLOSURE_FLAG_THRESHOLD (60)"
        actor: ComplianceOfficer
        preconditions:
          - "profile.status == DEPLOYED"
          - "recomputed profile.disclosure_score < 60"
        side_effects:
          - "sets last_audited_at = logical clock now"
          - "recomputes Property.min_channel_disclosure_score (this profile now contributes 0) and Property.disclosure_posture"
          - "recomputes Property.open_disclosure_obligation_count"
          - "increments Property.version by 1"
          - "increments ChannelDisclosureProfile.version by 1"
        note: >
          POST /audit is also legal from DRAFT and REMEDIATED, where it only
          recomputes disclosure_score and last_audited_at and never changes status.

      - from: DEPLOYED
        to: FLAGGED
        trigger: "system: GuestComplaint substantiation raises confirmed_undisclosed_count so the recomputed disclosure_score falls below 60"
        actor: system
        preconditions:
          - "profile.status == DEPLOYED"
          - "recomputed profile.disclosure_score < 60"
        side_effects:
          - "recomputes Property.min_channel_disclosure_score and Property.disclosure_posture"
          - "recomputes Property.open_disclosure_obligation_count"
          - "increments Property.version by 1"
          - "increments ChannelDisclosureProfile.version by 1"

      - from: DEPLOYED
        to: FLAGGED
        trigger: "system: POST /regulator-inquiries/{id}/require-remediation or POST /regulator-inquiries/{id}/reject-remediation, for in-scope profiles"
        actor: system
        preconditions:
          - "profile.status == DEPLOYED"
          - "profile.property_id == inquiry.property_id"
          - "the profile's channel.channel_type is an element of inquiry.channel_scope"
        side_effects:
          - "appends profile.id to RegulatorInquiry.flagged_profile_ids in ascending ChannelDisclosureProfile.created_at order"
          - "recomputes Property.min_channel_disclosure_score and Property.disclosure_posture"
          - "recomputes Property.open_disclosure_obligation_count"
          - "increments Property.version by 1"
          - "increments ChannelDisclosureProfile.version by 1"

      - from: FLAGGED
        to: REMEDIATED
        trigger: "POST /channel-disclosure-profiles/{id}/remediate"
        actor: ChannelOperator | RevenueManager
        preconditions:
          - "profile.status == FLAGGED"
          - "when the caller is ChannelOperator, X-User-ID == profile.channel_id (validations[priority=4]); a RevenueManager may remediate on the channel's behalf"
          - "NOT (first_quote_shows_total == true AND channel.supports_total_price_display == false)"
          - "NOT (itemized_at_first_quote == true AND channel.supports_itemization == false)"
        side_effects:
          - "overwrites profile.first_quote_shows_total, itemized_at_first_quote and disclosure_placement from the request body"
          - "resets profile.confirmed_undisclosed_count to 0"
          - "increments profile.remediation_round by 1"
          - "recomputes profile.disclosure_score and sets last_audited_at = logical clock now"
          - "recomputes Property.min_channel_disclosure_score and Property.disclosure_posture"
          - "recomputes Property.open_disclosure_obligation_count"
          - "increments Property.version by 1"
          - "increments ChannelDisclosureProfile.version by 1"

      - from: REMEDIATED
        to: DEPLOYED
        trigger: "POST /channel-disclosure-profiles/{id}/confirm-remediation"
        actor: ComplianceOfficer
        preconditions:
          - "profile.status == REMEDIATED"
          - "profile.disclosure_score >= DISCLOSURE_CONFIRM_THRESHOLD (80)"
        side_effects:
          - "sets last_audited_at = logical clock now"
          - "recomputes Property.min_channel_disclosure_score and Property.disclosure_posture"
          - "increments Property.version by 1"
          - "increments ChannelDisclosureProfile.version by 1"
        note: "Closes the cycle DEPLOYED -> FLAGGED -> REMEDIATED -> DEPLOYED."

      - from: FLAGGED
        to: DEPLOYED
        trigger: "system: POST /regulator-inquiries/{id}/withdraw, for profiles listed in inquiry.flagged_profile_ids that are still FLAGGED"
        actor: system
        preconditions:
          - "profile.status == FLAGGED"
          - "profile.id is an element of inquiry.flagged_profile_ids"
        side_effects:
          - "recomputes Property.min_channel_disclosure_score and Property.disclosure_posture"
          - "recomputes Property.open_disclosure_obligation_count"
          - "increments Property.version by 1"
          - "increments ChannelDisclosureProfile.version by 1"
        note: "The compensating action of the require-remediation flag cascade."

      - from: DEPLOYED
        to: RETIRED
        trigger: "system: a successor profile on the same (property_id, channel_id) is deployed, or the profile's FeeProgram is superseded"
        actor: system
        preconditions:
          - "profile.status == DEPLOYED"
        side_effects:
          - "recomputes Property.min_channel_disclosure_score and Property.disclosure_posture"
          - "increments ChannelDisclosureProfile.version by 1"

      - from: FLAGGED
        to: RETIRED
        trigger: "system: the profile's FeeProgram is superseded"
        actor: system
        preconditions:
          - "profile.status == FLAGGED"
        side_effects:
          - "recomputes Property.min_channel_disclosure_score, Property.disclosure_posture and Property.open_disclosure_obligation_count"
          - "increments ChannelDisclosureProfile.version by 1"

      - from: REMEDIATED
        to: RETIRED
        trigger: "system: the profile's FeeProgram is superseded"
        actor: system
        preconditions:
          - "profile.status == REMEDIATED"
        side_effects:
          - "recomputes Property.min_channel_disclosure_score and Property.disclosure_posture"
          - "increments ChannelDisclosureProfile.version by 1"

  - entity: Booking
    initial_state: "stay_status = QUOTED, disclosure_status = PENDING_AUDIT"
    terminal_states: ["stay_status = CHECKED_OUT", "disclosure_status = CURED"]
    shape: parallel
    note: >
      Two independent state dimensions on one row. stay_status advances only
      through operator stay actions; disclosure_status advances only through
      posture cascades and complaint adjudication. Every combination of the two
      is reachable, e.g. (QUOTED, DISPUTED) and (CHECKED_OUT,
      UNDISCLOSED_CONFIRMED).
    transitions:
      - dimension: stay_status
        from: QUOTED
        to: CONFIRMED
        trigger: "POST /bookings/{id}/confirm"
        actor: ChannelOperator | GuestServicesAgent
        preconditions:
          - "booking.stay_status == QUOTED"
          - "when the caller is ChannelOperator, X-User-ID == booking.channel_id (validations[priority=4]); a GuestServicesAgent may confirm on the channel's behalf"
          - "profile.status IN {DEPLOYED, REMEDIATED}  (cross-entity: Booking depends on ChannelDisclosureProfile)"
          - "fee_program.status == PUBLISHED"
        side_effects:
          - "when profile.first_quote_shows_total == true AND profile.disclosure_placement IN {FIRST_QUOTE, RATE_DETAILS} AND booking.quote_disclosure_gap_cents == 0: disclosure_status transitions PENDING_AUDIT -> DISCLOSED on the same row"
          - "increments Booking.version by 1"

      - dimension: stay_status
        from: CONFIRMED
        to: IN_HOUSE
        trigger: "POST /bookings/{id}/check-in"
        actor: GuestServicesAgent
        preconditions:
          - "booking.stay_status == CONFIRMED"
          - "logical clock now >= booking.arrival_date"
        side_effects:
          - "creates exactly one Folio for the booking with status OPEN and all monetary aggregates 0"
          - "increments Booking.version by 1"

      - dimension: stay_status
        from: IN_HOUSE
        to: CHECKED_OUT
        trigger: "POST /bookings/{id}/check-out"
        actor: GuestServicesAgent
        preconditions:
          - "booking.stay_status == IN_HOUSE"
          - "logical clock now >= booking.arrival_date + booking.nights days"
        side_effects:
          - "increments Booking.version by 1"

      - dimension: disclosure_status
        from: PENDING_AUDIT
        to: DISPUTED
        trigger: "system: Property.disclosure_posture becomes NON_COMPLIANT"
        actor: system
        preconditions:
          - "booking.disclosure_status == PENDING_AUDIT"
          - "booking.stay_status == QUOTED"
          - "booking.property_id == the property whose posture became NON_COMPLIANT"
        side_effects:
          - "recomputes Property.aggregate_disclosure_gap_cents"
          - "increments Booking.version by 1"
        note: >
          Only unconfirmed quotes are disputed by a posture change; confirmed and
          in-house bookings are left alone. This is cascade link 4 of the
          require-remediation chain.

      - dimension: disclosure_status
        from: PENDING_AUDIT
        to: UNDISCLOSED_CONFIRMED
        trigger: "system: POST /guest-complaints/{id}/substantiate on a complaint of this booking"
        actor: system
        preconditions:
          - "booking.disclosure_status IN {PENDING_AUDIT, DISCLOSED, DISPUTED}"
        side_effects:
          - "recomputes Property.aggregate_disclosure_gap_cents"
          - "increments profile.confirmed_undisclosed_count by 1 and recomputes profile.disclosure_score (cascade link 3)"
          - "increments Booking.version by 1"

      - dimension: disclosure_status
        from: DISCLOSED
        to: UNDISCLOSED_CONFIRMED
        trigger: "system: POST /guest-complaints/{id}/substantiate on a complaint of this booking"
        actor: system
        preconditions:
          - "booking.disclosure_status == DISCLOSED"
        side_effects:
          - "recomputes Property.aggregate_disclosure_gap_cents"
          - "increments profile.confirmed_undisclosed_count by 1 and recomputes profile.disclosure_score"
          - "increments Booking.version by 1"

      - dimension: disclosure_status
        from: DISPUTED
        to: UNDISCLOSED_CONFIRMED
        trigger: "system: POST /guest-complaints/{id}/substantiate on a complaint of this booking"
        actor: system
        preconditions:
          - "booking.disclosure_status == DISPUTED"
        side_effects:
          - "recomputes Property.aggregate_disclosure_gap_cents"
          - "increments profile.confirmed_undisclosed_count by 1 and recomputes profile.disclosure_score"
          - "increments Booking.version by 1"

      - dimension: disclosure_status
        from: PENDING_AUDIT
        to: DISCLOSED
        trigger: "system: POST /guest-complaints/{id}/dismiss on a complaint of this booking"
        actor: system
        preconditions:
          - "booking.disclosure_status IN {PENDING_AUDIT, DISPUTED}"
        side_effects:
          - "recomputes Property.aggregate_disclosure_gap_cents"
          - "profile.confirmed_undisclosed_count is NOT changed and profile.disclosure_score is NOT recomputed"
          - "increments Booking.version by 1"
        note: "The dismissal branch's side-effect set is deliberately disjoint from the substantiation branch's."

      - dimension: disclosure_status
        from: DISPUTED
        to: DISCLOSED
        trigger: "system: POST /guest-complaints/{id}/dismiss on a complaint of this booking"
        actor: system
        preconditions:
          - "booking.disclosure_status == DISPUTED"
        side_effects:
          - "recomputes Property.aggregate_disclosure_gap_cents"
          - "increments Booking.version by 1"

      - dimension: disclosure_status
        from: UNDISCLOSED_CONFIRMED
        to: CURED
        trigger: "system: POST /guest-complaints/{id}/refund on a complaint of this booking"
        actor: system
        preconditions:
          - "booking.disclosure_status == UNDISCLOSED_CONFIRMED"
        side_effects:
          - "recomputes Property.aggregate_disclosure_gap_cents"
          - "recomputes Booking.guest_out_of_pocket_cents and Booking.folio_total_cents"
          - "increments Booking.version by 1"

  - entity: Folio
    initial_state: OPEN
    terminal_states: [CLOSED]
    shape: cyclic
    transitions:
      - from: OPEN
        to: ITEMIZED
        trigger: "POST /folios/{id}/itemize"
        actor: GuestServicesAgent
        preconditions:
          - "folio.status == OPEN"
          - "booking.stay_status IN {IN_HOUSE, CHECKED_OUT}"
          - "every Fee.code of the booking's pinned fee_program_id has a TaxabilityRule row for the property's jurisdiction_id"
        side_effects:
          - "appends one ROOM FolioLine (sequence_no 1) then one MANDATORY_FEE FolioLine per Fee with classification == MANDATORY on the pinned program WHOSE stay amount per calculations.fee_stay_amount is strictly greater than 0, ordered by Fee.created_at ASC, sequence_no 2..N; a mandatory fee that computes to 0 cents for this stay is disclosed in the program but produces NO folio line"
          - "each fee line's taxability_determination, tax_rate_bps and tax_cents are set per calculations.folio_line_taxability"
          - "sets Folio.line_count, charges_subtotal_cents, credits_total_cents, tax_total_cents, folio_total_cents and itemization_complete = true"
          - "writes Booking.folio_fee_total_cents (stay_aggregation variant), Booking.folio_total_cents, Booking.quote_folio_variance_cents and Booking.guest_out_of_pocket_cents"
          - "when abs(Booking.quote_folio_variance_cents) > QUOTE_VARIANCE_TOLERANCE_CENTS (100): Booking.disclosure_status transitions to DISPUTED from PENDING_AUDIT or DISCLOSED"
          - "increments Folio.version by 1 and Booking.version by 1"

      - from: ITEMIZED
        to: POSTED
        trigger: "POST /folios/{id}/post"
        actor: GuestServicesAgent
        preconditions:
          - "folio.status == ITEMIZED"
          - "booking.stay_status == CHECKED_OUT  (cross-entity: Folio depends on Booking)"
          - "folio.itemization_complete == true"
        side_effects:
          - "sets Folio.posted_at = logical clock now"
          - "increments Folio.version by 1"

      - from: POSTED
        to: ADJUSTED
        trigger: "system: POST /opt-out-requests/{id}/grant or POST /guest-complaints/{id}/refund"
        actor: system
        preconditions:
          - "folio.status == POSTED"
        side_effects:
          - "appends the compensating FolioLine (FEE_CREDIT or COMPLAINT_REFUND) at the next sequence_no"
          - "recomputes Folio.line_count, charges_subtotal_cents, credits_total_cents, tax_total_cents and folio_total_cents"
          - "recomputes Booking.folio_total_cents and Booking.guest_out_of_pocket_cents"
          - "increments Folio.version by 1 and Booking.version by 1"

      - from: ADJUSTED
        to: POSTED
        trigger: "POST /folios/{id}/post"
        actor: GuestServicesAgent
        preconditions:
          - "folio.status == ADJUSTED"
          - "booking.stay_status == CHECKED_OUT"
          - "no OptOutRequest for this booking has status == REQUESTED"
        side_effects:
          - "sets Folio.posted_at = logical clock now"
          - "increments Folio.version by 1"
        note: "Closes the cycle ITEMIZED -> POSTED -> ADJUSTED -> POSTED. A folio may re-post any number of times."

      - from: POSTED
        to: CLOSED
        trigger: "POST /folios/{id}/close"
        actor: GuestServicesAgent
        preconditions:
          - "folio.status == POSTED"
          - "no GuestComplaint for this booking has status IN {SUBMITTED, UNDER_INVESTIGATION, SUBSTANTIATED}"
        side_effects:
          - "every OptOutRequest for this booking with status == REQUESTED transitions REQUESTED -> EXPIRED with decided_at = logical clock now"
          - "increments Folio.version by 1"
        note: "ADJUSTED -> CLOSED is NOT permitted; an adjusted folio must be re-posted first."

  - entity: OptOutRequest
    initial_state: REQUESTED
    terminal_states: [DENIED, EXPIRED, REVOKED]
    shape: branching_with_compensation
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /opt-out-requests/{id}/grant"
        actor: GuestServicesAgent
        preconditions:
          - "request.status == REQUESTED"
          - "the booking has a Folio whose status IN {POSTED, ADJUSTED}"
          - "a MANDATORY_FEE FolioLine exists on that folio with fee_id == request.fee_id and no FEE_CREDIT line for the same fee_id that has not been rebilled"
        side_effects:
          - "appends one FEE_CREDIT FolioLine with fee_id = request.fee_id, amount_cents = +(the MANDATORY_FEE line's amount_cents) and tax_cents = -(that line's tax_cents), per calculations.opt_out_credit; the sign convention is that a credit line carries a POSITIVE amount and a NEGATIVE tax, and the aggregation subtracts credits"
          - "the credit line's taxability_determination is TAXABLE_IF_MANDATORY_WAIVED when the fee code's rule is TAXABLE_IF_MANDATORY, else the same determination as the charged line"
          - "sets request.credit_cents, request.tax_credit_cents, request.credit_line_sequence_no and request.decided_at"
          - "folio transitions POSTED -> ADJUSTED (no status change when already ADJUSTED); folio and Booking money aggregates are recomputed"
          - "increments OptOutRequest.version by 1"

      - from: REQUESTED
        to: DENIED
        trigger: "POST /opt-out-requests/{id}/deny"
        actor: GuestServicesAgent
        preconditions:
          - "request.status == REQUESTED"
        side_effects:
          - "sets request.denial_reason_code and request.decided_at"
          - "no FolioLine is appended and no money aggregate changes"
          - "increments OptOutRequest.version by 1"

      - from: REQUESTED
        to: EXPIRED
        trigger: "system: POST /folios/{id}/close on the booking's folio"
        actor: system
        preconditions:
          - "request.status == REQUESTED"
        side_effects:
          - "sets request.decided_at = logical clock now"
          - "increments OptOutRequest.version by 1"

      - from: GRANTED
        to: REVOKED
        trigger: "POST /opt-out-requests/{id}/revoke"
        actor: GuestServicesAgent
        preconditions:
          - "request.status == GRANTED"
          - "the booking's Folio status == ADJUSTED"
        side_effects:
          - "appends one FEE_REBILL FolioLine with fee_id = request.fee_id, amount_cents = +request.credit_cents and tax_cents = +request.tax_credit_cents, taxability_determination equal to that of the original charged line"
          - "resets request.credit_cents = 0, request.tax_credit_cents = 0 and request.credit_line_sequence_no = null"
          - "recomputes folio and Booking money aggregates; Booking.guest_out_of_pocket_cents returns to its pre-grant value"
          - "increments OptOutRequest.version by 1"
        note: "The compensating action of the grant. See calculations.guest_out_of_pocket_conservation."

  - entity: GuestComplaint
    initial_state: SUBMITTED
    terminal_states: [UNSUBSTANTIATED, REFUNDED]
    shape: branching
    transitions:
      - from: SUBMITTED
        to: UNDER_INVESTIGATION
        trigger: "POST /guest-complaints/{id}/investigate"
        actor: GuestServicesAgent
        preconditions:
          - "complaint.status == SUBMITTED"
        side_effects:
          - "sets complaint.investigated_by_user_id = X-User-ID"
          - "increments GuestComplaint.version by 1"

      - from: UNDER_INVESTIGATION
        to: SUBSTANTIATED
        trigger: "POST /guest-complaints/{id}/substantiate"
        actor: ComplianceOfficer
        preconditions:
          - "complaint.status == UNDER_INVESTIGATION"
        side_effects:
          - "sets complaint.adjudicated_by_user_id = X-User-ID, refund_variant, disputed_amount_cents, disclosed_amount_cents and refund_entitlement_cents per calculations.complaint_refund_entitlement (cascade link 1)"
          - "Booking.disclosure_status transitions to UNDISCLOSED_CONFIRMED (cascade link 2)"
          - "that Booking transition increments the booking's ChannelDisclosureProfile.confirmed_undisclosed_count by 1 and recomputes profile.disclosure_score (cascade link 3)"
          - "when the recomputed disclosure_score < 60 and profile.status == DEPLOYED the profile transitions DEPLOYED -> FLAGGED, which recomputes Property.min_channel_disclosure_score, Property.disclosure_posture and Property.open_disclosure_obligation_count (cascade link 4)"
          - "increments GuestComplaint.version by 1"
        note: "Fork branch A. Its side-effect set is strictly larger than branch B's and touches four entities."

      - from: UNDER_INVESTIGATION
        to: UNSUBSTANTIATED
        trigger: "POST /guest-complaints/{id}/dismiss"
        actor: ComplianceOfficer
        preconditions:
          - "complaint.status == UNDER_INVESTIGATION"
        side_effects:
          - "sets complaint.adjudicated_by_user_id = X-User-ID and complaint.dismissal_reason_code"
          - "forces complaint.refund_entitlement_cents = 0 and leaves refund_variant null"
          - "Booking.disclosure_status transitions to DISCLOSED when it is PENDING_AUDIT or DISPUTED, and is left unchanged otherwise"
          - "ChannelDisclosureProfile.confirmed_undisclosed_count and disclosure_score are NOT touched, so no profile or property posture change occurs"
          - "increments GuestComplaint.version by 1"
        note: "Fork branch B. Divergent side-effect set: no profile mutation, no posture recomputation."

      - from: SUBSTANTIATED
        to: REFUNDED
        trigger: "POST /guest-complaints/{id}/refund"
        actor: GuestServicesAgent
        preconditions:
          - "complaint.status == SUBSTANTIATED"
          - "complaint.refund_entitlement_cents > 0"
          - "0 < refund_amount_cents <= complaint.refund_entitlement_cents"
          - "the booking's Folio status IN {POSTED, ADJUSTED}"
        side_effects:
          - "appends one COMPLAINT_REFUND FolioLine with amount_cents = +refund_amount_cents (positive, per the credit sign convention), tax_cents = 0 and taxability_determination = EXEMPT because the entitlement already includes the tax that was collected"
          - "sets complaint.refunded_amount_cents = refund_amount_cents"
          - "folio transitions POSTED -> ADJUSTED (no status change when already ADJUSTED); folio and Booking money aggregates are recomputed"
          - "Booking.disclosure_status transitions UNDISCLOSED_CONFIRMED -> CURED"
          - "increments GuestComplaint.version by 1"

  - entity: RegulatorInquiry
    initial_state: RECEIVED
    terminal_states: [ACCEPTED, WITHDRAWN]
    shape: cyclic
    transitions:
      - from: RECEIVED
        to: RESPONSE_DRAFTED
        trigger: "POST /regulator-inquiries/{id}/draft-response"
        actor: RegulatoryLiaison
        preconditions:
          - "inquiry.status == RECEIVED"
        side_effects:
          - "sets inquiry.response_summary and inquiry.drafted_by_user_id = X-User-ID"
          - "increments RegulatorInquiry.version by 1"

      - from: RESPONSE_DRAFTED
        to: RESPONSE_SUBMITTED
        trigger: "POST /regulator-inquiries/{id}/submit-response"
        actor: RegulatoryLiaison
        preconditions:
          - "inquiry.status == RESPONSE_DRAFTED"
          - "X-User-ID != inquiry.drafted_by_user_id  (segregation of duties)"
          - "logical clock now <= inquiry.response_due_at"
        side_effects:
          - "sets inquiry.submitted_by_user_id = X-User-ID"
          - "increments RegulatorInquiry.version by 1"

      - from: RESPONSE_SUBMITTED
        to: REMEDIATION_REQUIRED
        trigger: "POST /regulator-inquiries/{id}/require-remediation"
        actor: PlatformAdmin
        preconditions:
          - "inquiry.status == RESPONSE_SUBMITTED"
        side_effects:
          - "sets inquiry.remediation_directive and increments inquiry.remediation_round by 1 (cascade link 1)"
          - "every ChannelDisclosureProfile with property_id == inquiry.property_id, status == DEPLOYED and channel.channel_type in inquiry.channel_scope transitions DEPLOYED -> FLAGGED, appended to inquiry.flagged_profile_ids in ascending ChannelDisclosureProfile.created_at order (cascade link 2)"
          - "each profile becoming FLAGGED contributes 0 to Property.min_channel_disclosure_score, so the score and Property.disclosure_posture are recomputed (cascade link 3)"
          - "when the recomputed posture is NON_COMPLIANT, every Booking with property_id == inquiry.property_id, stay_status == QUOTED and disclosure_status == PENDING_AUDIT transitions disclosure_status -> DISPUTED (cascade link 4)"
          - "recomputes Property.open_disclosure_obligation_count and Property.aggregate_disclosure_gap_cents"
          - "recomputes inquiry.exposure_cents per calculations.inquiry_exposure"
          - "increments Property.version by 1 and RegulatorInquiry.version by 1"

      - from: REMEDIATION_REQUIRED
        to: REMEDIATION_SUBMITTED
        trigger: "POST /regulator-inquiries/{id}/submit-remediation"
        actor: RegulatoryLiaison
        preconditions:
          - "inquiry.status == REMEDIATION_REQUIRED"
          - "every ChannelDisclosureProfile.id in inquiry.flagged_profile_ids has status IN {REMEDIATED, DEPLOYED}  (cross-entity: RegulatorInquiry depends on ChannelDisclosureProfile)"
        side_effects:
          - "sets inquiry.remediation_summary"
          - "recomputes Property.open_disclosure_obligation_count"
          - "increments RegulatorInquiry.version by 1"

      - from: REMEDIATION_SUBMITTED
        to: REMEDIATION_REQUIRED
        trigger: "POST /regulator-inquiries/{id}/reject-remediation"
        actor: PlatformAdmin
        preconditions:
          - "inquiry.status == REMEDIATION_SUBMITTED"
        side_effects:
          - "sets inquiry.rejection_reason and increments inquiry.remediation_round by 1"
          - "every ChannelDisclosureProfile.id in inquiry.flagged_profile_ids whose status IN {DEPLOYED, REMEDIATED} transitions to FLAGGED (the list itself is not re-appended)"
          - "recomputes Property.min_channel_disclosure_score, Property.disclosure_posture and Property.open_disclosure_obligation_count"
          - "recomputes inquiry.exposure_cents"
          - "increments Property.version by 1 and RegulatorInquiry.version by 1"
        note: "Closes the cycle REMEDIATION_REQUIRED -> REMEDIATION_SUBMITTED -> REMEDIATION_REQUIRED."

      - from: REMEDIATION_SUBMITTED
        to: ACCEPTED
        trigger: "POST /regulator-inquiries/{id}/accept"
        actor: PlatformAdmin
        preconditions:
          - "inquiry.status == REMEDIATION_SUBMITTED"
        side_effects:
          - "sets inquiry.flagged_profile_ids = []"
          - "recomputes Property.open_disclosure_obligation_count"
          - "increments Property.version by 1 and RegulatorInquiry.version by 1"

      - from: RECEIVED
        to: WITHDRAWN
        trigger: "POST /regulator-inquiries/{id}/withdraw"
        actor: PlatformAdmin
        preconditions:
          - "inquiry.status IN {RECEIVED, RESPONSE_DRAFTED, RESPONSE_SUBMITTED, REMEDIATION_REQUIRED}"
        side_effects:
          - "sets inquiry.withdrawal_reason"
          - "every ChannelDisclosureProfile.id in inquiry.flagged_profile_ids whose status == FLAGGED transitions FLAGGED -> DEPLOYED"
          - "sets inquiry.flagged_profile_ids = []"
          - "recomputes Property.min_channel_disclosure_score, Property.disclosure_posture and Property.open_disclosure_obligation_count"
          - "increments Property.version by 1 and RegulatorInquiry.version by 1"
        note: >
          Withdrawal is the compensating action for the require-remediation flag
          cascade; it restores exactly the profiles this inquiry flagged and
          nothing else. WITHDRAWN is NOT reachable from REMEDIATION_SUBMITTED or
          ACCEPTED.

      - from: RESPONSE_DRAFTED
        to: WITHDRAWN
        trigger: "POST /regulator-inquiries/{id}/withdraw"
        actor: PlatformAdmin
        preconditions:
          - "inquiry.status == RESPONSE_DRAFTED"
        side_effects:
          - "sets inquiry.withdrawal_reason; flagged_profile_ids is already empty so no profile changes"
          - "increments RegulatorInquiry.version by 1"

      - from: RESPONSE_SUBMITTED
        to: WITHDRAWN
        trigger: "POST /regulator-inquiries/{id}/withdraw"
        actor: PlatformAdmin
        preconditions:
          - "inquiry.status == RESPONSE_SUBMITTED"
        side_effects:
          - "sets inquiry.withdrawal_reason; flagged_profile_ids is already empty so no profile changes"
          - "increments RegulatorInquiry.version by 1"

      - from: REMEDIATION_REQUIRED
        to: WITHDRAWN
        trigger: "POST /regulator-inquiries/{id}/withdraw"
        actor: PlatformAdmin
        preconditions:
          - "inquiry.status == REMEDIATION_REQUIRED"
        side_effects:
          - "sets inquiry.withdrawal_reason"
          - "every ChannelDisclosureProfile.id in inquiry.flagged_profile_ids whose status == FLAGGED transitions FLAGGED -> DEPLOYED"
          - "sets inquiry.flagged_profile_ids = []"
          - "recomputes Property.min_channel_disclosure_score, Property.disclosure_posture and Property.open_disclosure_obligation_count"
          - "increments Property.version by 1 and RegulatorInquiry.version by 1"

# -----------------------------------------------------------------------------
# 1.2.1 Concurrency Rules  (OCC on the parent's `version` — the only sanctioned
# mechanism; both entries are CREATE-with-supersede races)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: fee-program-create-stale-property
    parent_entity: Property
    write_endpoint: "POST /fee-programs"
    occ_field: "expected_property_version"
    description: |
      Creating a FeeProgram against a Property whose version has advanced since
      the client last observed it is rejected with a stale-version error. This
      captures the case where another writer has already created (and possibly
      published) a program that legitimately supersedes the fee inventory the
      current writer believes is in force, so the current writer's view of the
      property's published program set and disclosure posture is stale.
    error_id: ERR_STALE_PROPERTY_VERSION
    http_status: 412

  - rule_id: disclosure-profile-create-stale-fee-program
    parent_entity: FeeProgram
    write_endpoint: "POST /channel-disclosure-profiles"
    occ_field: "expected_fee_program_version"
    description: |
      Creating a ChannelDisclosureProfile against a FeeProgram whose version has
      advanced since the client last observed it is rejected with a stale-version
      error. Deploying a profile legitimately retires the prior profile for the
      same (property, channel) pair, so a writer holding a stale view of the fee
      program may be about to retire a booking path it has never seen.
    error_id: ERR_STALE_FEE_PROGRAM_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# 1.3 Calculation Rules Table
#
# Global precision rule: every monetary result is an integer number of cents.
# `round_half_up(x)` means round x to the nearest integer with ties away from
# zero. Wherever a calculation performs more than one rounding, the ORDER of
# roundings is pinned explicitly below and is observable.
#
# No random field participates in any ordering, selection or tie-break anywhere
# in this scaffold. Where a precise fallback ordering is needed, `created_at ASC`
# is used; entity `id` is NEVER a decision input.
# -----------------------------------------------------------------------------
calculations:

  - name: fee_stay_amount
    trigger: "helper invoked by booking_fee_subtotal, folio_line_taxability, fee_program_rollup and revenue_impact_roll_in"
    algorithm: tiered_basis_expansion
    formula: |
      # UNROUNDED per-night rational value of one fee against a nightly rate.
      def raw_per_night(fee, nightly_rate_cents, guests):
          if fee.basis == "PER_NIGHT":              return Rational(fee.amount_cents)
          if fee.basis == "PER_PERSON_PER_NIGHT":   return Rational(fee.amount_cents * guests)
          if fee.basis == "PERCENT_OF_ROOM":        return Rational(nightly_rate_cents * fee.percent_bps, 10000)
          if fee.basis == "PER_STAY":               return None   # not a per-night quantity

      # UNROUNDED whole-stay rational value of one fee.
      def raw_stay(fee, nightly_rate_cents, guests, nights):
          if fee.basis == "PER_STAY":  return Rational(fee.amount_cents)
          return raw_per_night(fee, nightly_rate_cents, guests) * nights
    input_set: >
      One Fee row, the nightly rate in force for the context (Booking.room_rate_cents
      for booking/folio contexts; Property.base_room_rate_cents for fee-program and
      revenue-model contexts), the guest count (Booking.guests, or
      MODEL_REFERENCE_GUESTS in revenue-model contexts) and the night count
      (Booking.nights, or MODEL_REFERENCE_NIGHTS in revenue-model contexts).
    constants:
      MODEL_REFERENCE_GUESTS: 2
      MODEL_REFERENCE_NIGHTS: 4
    precision: "returns an exact rational; rounding is the caller's responsibility and every caller pins its own rounding order"

  - name: booking_fee_subtotal
    trigger: "POST /bookings (per_night_rounding variant) and POST /folios/{id}/itemize (stay_aggregation variant)"
    algorithm: aggregation
    formula: |
      # Input set: Fee rows of Booking.fee_program_id with classification == MANDATORY,
      # ordered by Fee.created_at ASC (order does not affect either variant's value,
      # but it does fix folio line sequence_no).
      #
      # VARIANT A — per_night_rounding  (what the guest is SHOWN at first quote)
      #   round each fee's per-night value to whole cents FIRST, sum the rounded
      #   per-night values, then multiply by nights.
      per_night_sum = 0
      for fee in mandatory_fees_ordered:
          if fee.basis == "PER_STAY":
              continue                                     # handled below
          per_night_sum += round_half_up(raw_per_night(fee, booking.room_rate_cents, booking.guests))
      subtotal_A = per_night_sum * booking.nights
      for fee in mandatory_fees_ordered:
          if fee.basis == "PER_STAY":
              subtotal_A += fee.amount_cents

      # VARIANT B — stay_aggregation  (what the guest is BILLED on the folio)
      #   expand each fee across the whole stay UNROUNDED, round ONCE per fee at
      #   the stay level, then sum.
      subtotal_B = 0
      for fee in mandatory_fees_ordered:
          subtotal_B += round_half_up(raw_stay(fee, booking.room_rate_cents,
                                               booking.guests, booking.nights))
    input_set: >
      Fee rows of the booking's version-pinned fee_program_id whose classification
      == MANDATORY. OPTIONAL and CONDITIONAL fees are excluded from both variants.
      Fees credited by a granted OptOutRequest are still included here; the credit
      is a separate compensating folio line, never a re-computation of this subtotal.
    constants: {}
    precision: "whole cents, round_half_up; variant A rounds per fee per night, variant B rounds per fee per stay"
    variants:
      - name: per_night_rounding
        when: "POST /bookings — writes Booking.quoted_mandatory_fee_cents"
        difference: "rounds each fee to whole cents at the per-night level before multiplying by nights, so every fractional cent is rounded up (or down) once per night"
      - name: stay_aggregation
        when: "POST /folios/{id}/itemize — writes Booking.folio_fee_total_cents and each MANDATORY_FEE line's amount_cents"
        difference: "expands each fee across the stay unrounded and rounds once, so per-night fractions cancel across nights"
    note: >
      The two variants produce DIFFERENT integers for identical inputs whenever a
      PERCENT_OF_ROOM fee yields a fractional per-night value. Worked reference:
      room_rate_cents 29900, nights 4, guests 2, fees RESORT (PERCENT_OF_ROOM 750
      bps -> 2242.5/night), DESTINATION (PER_NIGHT 1495), WIFI_PREMIUM
      (PER_PERSON_PER_NIGHT 325 -> 650/night). Variant A = (2243 + 1495 + 650) * 4
      = 17552. Variant B = 8970 + 5980 + 2600 = 17550. Delta = -2 cents.

  - name: booking_quoted_total
    trigger: "POST /bookings"
    algorithm: threshold
    formula: |
      # Pinned evaluation order, steps 1..5.
      # 1. room
      quoted_room_total_cents = booking.room_rate_cents * booking.nights
      # 2. mandatory fee subtotal, variant per_night_rounding
      quoted_mandatory_fee_cents = booking_fee_subtotal.per_night_rounding
      # 3. taxable base — AGGREGATED, taxed with a SINGLE rounding.
      #    A fee enters the base when its TaxabilityRule for the property's
      #    jurisdiction has taxability == TAXABLE, or taxability ==
      #    TAXABLE_IF_MANDATORY (every fee in the subtotal is MANDATORY at quote
      #    time). EXEMPT fees are excluded. The room amount always enters.
      #    Each fee's contribution to the base is its VARIANT A stay amount, i.e.
      #    round_half_up(raw_per_night(...)) * nights, or amount_cents for PER_STAY.
      taxable_base_cents = quoted_room_total_cents + sum(variant_A_stay_amount(fee)
                             for fee in mandatory_fees
                             if rule(fee.code).taxability != "EXEMPT")
      # 4. one rounding over the aggregate base, at the jurisdiction rate unless
      #    every contributing rule shares one non-null tax_rate_bps override; when
      #    overrides differ, the base is split per distinct rate and each split is
      #    rounded separately, then summed in ascending tax_rate_bps order.
      quoted_tax_cents = round_half_up(taxable_base_cents * effective_rate_bps / 10000)
      # 5. total
      quoted_total_cents = quoted_room_total_cents + quoted_mandatory_fee_cents + quoted_tax_cents
    input_set: >
      The booking's pinned MANDATORY fees, the property's Jurisdiction, and the
      TaxabilityRule row for each fee code in that jurisdiction. All rules must
      exist or the booking is rejected before this calculation runs.
    constants: {}
    precision: "whole cents, round_half_up; exactly ONE rounding for the whole tax amount at a single effective rate"
    note: >
      Worked reference with the fee set of booking_fee_subtotal and jurisdiction
      occupancy_tax_rate_bps 1338 (RESORT TAXABLE, DESTINATION
      TAXABLE_IF_MANDATORY, WIFI_PREMIUM EXEMPT): room 119600, fees 17552,
      taxable base 119600 + 8972 + 5980 = 134552, tax
      round_half_up(18003.0576) = 18003, total 155155.

  - name: folio_line_taxability
    trigger: "POST /folios/{id}/itemize"
    algorithm: aggregation
    formula: |
      # Pinned line order: ROOM first (sequence_no 1), then MANDATORY fees in
      # ascending Fee.created_at order (sequence_no 2..N). created_at, never id,
      # is the ordering key.
      #
      # ROOM line
      room_line.amount_cents = booking.room_rate_cents * booking.nights
      room_line.taxability_determination = "TAXABLE"
      room_line.tax_rate_bps = jurisdiction.occupancy_tax_rate_bps
      room_line.tax_cents = round_half_up(room_line.amount_cents * room_line.tax_rate_bps / 10000)
      #
      # One MANDATORY_FEE line per mandatory fee — VARIANT B amount
      for fee in mandatory_fees_ordered_by_created_at_asc:
          line.amount_cents = round_half_up(raw_stay(fee, booking.room_rate_cents,
                                                     booking.guests, booking.nights))
          rule = taxability_rule(jurisdiction_id = property.jurisdiction_id,
                                 fee_code = fee.code)
          if rule.taxability == "EXEMPT":
              line.taxability_determination = "EXEMPT"
              line.tax_rate_bps = 0
          elif rule.taxability == "TAXABLE":
              line.taxability_determination = "TAXABLE"
              line.tax_rate_bps = rule.tax_rate_bps if rule.tax_rate_bps is not None \
                                  else jurisdiction.occupancy_tax_rate_bps
          else:  # TAXABLE_IF_MANDATORY, and this line IS a mandatory charge
              line.taxability_determination = "TAXABLE_IF_MANDATORY_APPLIED"
              line.tax_rate_bps = rule.tax_rate_bps if rule.tax_rate_bps is not None \
                                  else jurisdiction.occupancy_tax_rate_bps
          # PER-LINE rounding — the second rounding-order axis of this scaffold.
          line.tax_cents = round_half_up(line.amount_cents * line.tax_rate_bps / 10000)
      #
      folio.tax_total_cents = sum(line.tax_cents for line in folio_lines)
    input_set: >
      The ROOM amount plus one line per Fee of the pinned program with
      classification == MANDATORY. OPTIONAL and CONDITIONAL fees produce no line
      at itemization.
    constants: {}
    precision: >
      whole cents, round_half_up, ROUNDED PER LINE then summed. This is
      deliberately the opposite order from booking_quoted_total step 4, which
      rounds once over the aggregate base — the two orders are the source of
      Booking.quote_folio_variance_cents.
    note: >
      Worked reference (same fixture): ROOM 119600 tax 16002, RESORT 8970 tax
      1200, DESTINATION 5980 tax 800, WIFI_PREMIUM 2600 tax 0. tax_total 18002
      versus the quote's 18003. folio_total = 119600 + 17550 + 18002 = 155152, so
      Booking.quote_folio_variance_cents = 155152 - 155155 = -3.

  - name: quote_disclosure_gap
    trigger: "POST /bookings"
    algorithm: aggregation
    formula: |
      # How much of the mandatory-fee burden the channel failed to display.
      gap = 0
      for fee in mandatory_fees_of_pinned_program:          # created_at ASC
          charged  = variant_A_stay_amount(fee)             # what the guest will owe
          shown    = booking.disclosed_fee_amounts.get(fee.code, 0)
          gap     += max(0, charged - shown)
      quote_disclosure_gap_cents = gap
    input_set: >
      MANDATORY fees of the pinned program, compared against the
      disclosed_fee_amounts map supplied by the channel. A fee code absent from
      the map contributes its full variant-A stay amount. Over-disclosure (shown
      greater than charged) contributes 0, never a negative offset.
    constants: {}
    precision: "whole cents; no rounding beyond the variant-A amounts already rounded"
    note: >
      Worked reference: disclosed_fee_amounts {RESORT: 6000, DESTINATION: 5980}
      against charged {RESORT: 8972, DESTINATION: 5980, WIFI_PREMIUM: 2600} gives
      max(0, 2972) + max(0, 0) + max(0, 2600) = 5572. With a fully honest map
      {RESORT: 8972, DESTINATION: 5980, WIFI_PREMIUM: 2600} the gap is 0.

  - name: fee_program_rollup
    trigger: "POST /fee-programs/{id}/fees (fee_count and mandatory_fee_count only) and POST /fee-programs/{id}/publish (all four rollups)"
    algorithm: aggregation
    formula: |
      # PHASE 1 - on every Fee create only the two counts are refreshed.
      # PHASE 2 - at publication all four rollups are computed; this is the only
      #           point at which total_mandatory_fee_cents_per_night and
      #           inclusion_coverage_ratio leave their 0 / 0.0 defaults.
      program.fee_count           = count(fees of program)
      program.mandatory_fee_count = count(fees of program where classification == "MANDATORY")

      # Reference per-night mandatory burden, evaluated against the PROPERTY's
      # base_room_rate_cents and MODEL_REFERENCE_GUESTS, using the per-night
      # rounding order (round each fee, then sum).
      total = 0
      for fee in mandatory_fees_ordered_by_created_at_asc:
          if fee.basis == "PER_STAY":
              total += round_half_up(Rational(fee.amount_cents, MODEL_REFERENCE_NIGHTS))
          else:
              total += round_half_up(raw_per_night(fee, property.base_room_rate_cents,
                                                   MODEL_REFERENCE_GUESTS))
      program.total_mandatory_fee_cents_per_night = total

      # Inclusion coverage: fraction of MANDATORY fees that carry at least one
      # FeeInclusion whose included_value_cents is greater than 0.
      if program.mandatory_fee_count == 0:
          program.inclusion_coverage_ratio = 0.0000        # empty-set convention
      else:
          covered = count(fee in mandatory_fees
                          where exists inclusion of fee with included_value_cents > 0)
          program.inclusion_coverage_ratio = round_half_up_4dp(
              Rational(covered, program.mandatory_fee_count))
    input_set: >
      All Fee rows of the program for the counts; only classification == MANDATORY
      rows for total_mandatory_fee_cents_per_night and inclusion_coverage_ratio.
      FeeInclusion rows attached to OPTIONAL or CONDITIONAL fees never affect
      coverage.
    constants:
      MODEL_REFERENCE_GUESTS: 2
      MODEL_REFERENCE_NIGHTS: 4
    precision: "cents as integers with round_half_up; inclusion_coverage_ratio is a decimal with exactly 4 fractional digits, round_half_up"
    note: >
      Worked reference: base_room_rate_cents 29900, mandatory fees RESORT
      (PERCENT_OF_ROOM 750 bps -> 2243), DESTINATION (PER_NIGHT 1495),
      WIFI_PREMIUM (PER_PERSON_PER_NIGHT 325, 2 guests -> 650) gives
      total_mandatory_fee_cents_per_night 4388, mandatory_fee_count 3 and — with
      one value-bearing inclusion on each — inclusion_coverage_ratio 1.0000.
      A program whose only fee is OPTIONAL has mandatory_fee_count 0,
      total_mandatory_fee_cents_per_night 0 and inclusion_coverage_ratio 0.0000
      (never a divide-by-zero and never 1.0000).

  - name: fee_inclusion_value
    trigger: "POST /fees/{id}/inclusions"
    algorithm: aggregation
    formula: |
      inclusion.included_value_cents = inclusion.retail_value_cents * inclusion.units
      fee.inclusion_count       = count(inclusions of fee)
      fee.inclusion_value_cents = sum(i.included_value_cents for i in inclusions of fee)
    input_set: "all FeeInclusion rows of the fee; there is no state filter because FeeInclusion has no status"
    constants: {}
    precision: "whole cents, exact integer product, no rounding"
    note: >
      Worked reference: RESORT gains POOL_ACCESS 1500 x 1 = 1500 then FITNESS
      800 x 1 = 800, so inclusion_count 2 and inclusion_value_cents 2300.
      WIFI_PREMIUM gains WIFI_TIER2 400 x 2 = 800.

  - name: channel_disclosure_score
    trigger: "POST /channel-disclosure-profiles, POST /channel-disclosure-profiles/{id}/remediate, and any recomputation caused by confirmed_undisclosed_count changing"
    algorithm: weighted_scoring
    formula: |
      # Three independent switches drive this score. Mode: the disclosure_placement
      # term is a piecewise lookup, the coverage term is a floor-capped bonus, and
      # the capability term is a MAX of two penalties rather than their sum.
      base = 0
      if profile.first_quote_shows_total:   base += WEIGHT_TOTAL_AT_FIRST_QUOTE   # 40
      if profile.itemized_at_first_quote:   base += WEIGHT_ITEMIZED_AT_FIRST_QUOTE # 25

      base += PLACEMENT_POINTS[profile.disclosure_placement]
              # FIRST_QUOTE 25, RATE_DETAILS 15, CHECKOUT 8, CONFIRMATION_ONLY 3, ABSENT 0

      coverage_bonus = min(COVERAGE_BONUS_CAP,                                    # 10
                           floor(fee_program.inclusion_coverage_ratio * 10))
      base += coverage_bonus

      # Capability penalty — MAX, not sum. A channel that cannot show a total in a
      # jurisdiction that requires one is penalised 30; a channel that cannot
      # itemise where itemisation is mandated is penalised 20; when both apply the
      # penalty is 30, NOT 50.
      capability_penalty = 0
      if jurisdiction.first_quote_total_required and not channel.supports_total_price_display:
          capability_penalty = max(capability_penalty, PENALTY_NO_TOTAL_SUPPORT)   # 30
      if jurisdiction.itemization_required_on_folio and not channel.supports_itemization:
          capability_penalty = max(capability_penalty, PENALTY_NO_ITEMIZATION)     # 20
      base -= capability_penalty

      base -= PENALTY_PER_CONFIRMED_UNDISCLOSED * profile.confirmed_undisclosed_count  # 5 each

      profile.disclosure_score = max(0, min(100, base))
    input_set: >
      The profile's own three disclosure switches, the inclusion_coverage_ratio of
      the profile's fee_program_id, the capability flags of the profile's
      channel_id, the mandate flags of the property's jurisdiction, and the
      profile's own confirmed_undisclosed_count.
    constants:
      WEIGHT_TOTAL_AT_FIRST_QUOTE: 40
      WEIGHT_ITEMIZED_AT_FIRST_QUOTE: 25
      PLACEMENT_POINTS_FIRST_QUOTE: 25
      PLACEMENT_POINTS_RATE_DETAILS: 15
      PLACEMENT_POINTS_CHECKOUT: 8
      PLACEMENT_POINTS_CONFIRMATION_ONLY: 3
      PLACEMENT_POINTS_ABSENT: 0
      COVERAGE_BONUS_CAP: 10
      PENALTY_NO_TOTAL_SUPPORT: 30
      PENALTY_NO_ITEMIZATION: 20
      PENALTY_PER_CONFIRMED_UNDISCLOSED: 5
    precision: "integer 0..100 inclusive; the clamp is applied exactly once, last, after every additive and subtractive term"
    note: >
      Worked references against a jurisdiction with both mandates true and a
      program with inclusion_coverage_ratio 1.0000 (coverage_bonus 10):
      (a) channel supports both, total true, itemized true, placement FIRST_QUOTE,
          0 confirmed -> 40 + 25 + 25 + 10 = 100;
      (b) channel supports both, total true, itemized false, placement
          RATE_DETAILS, 1 confirmed -> 40 + 0 + 15 + 10 - 5 = 60 exactly;
      (c) same as (b) with 2 confirmed -> 55;
      (d) channel supports neither, total false, itemized false, placement ABSENT,
          0 confirmed -> 0 + 0 + 0 + 10 - 30 = -20, clamped to 0.

  - name: property_disclosure_posture
    trigger: "POST /channel-disclosure-profiles/{id}/deploy, /audit, /remediate, /confirm-remediation, POST /fee-programs/{id}/publish, POST /guest-complaints/{id}/substantiate, POST /regulator-inquiries/{id}/require-remediation, POST /regulator-inquiries/{id}/withdraw"
    algorithm: threshold
    formula: |
      # Candidate set: profiles of the property whose status is live-facing.
      candidates = [p for p in profiles_of(property)
                    if p.status in ("DEPLOYED", "FLAGGED", "REMEDIATED")]

      # A FLAGGED profile contributes 0 regardless of its stored score — being
      # flagged is itself a total-disclosure failure.
      def effective(p):
          return 0 if p.status == "FLAGGED" else p.disclosure_score

      if candidates == []:
          property.min_channel_disclosure_score = null
          property.disclosure_posture           = "COMPLIANT"
      else:
          m = min(effective(p) for p in candidates)
          property.min_channel_disclosure_score = m
          if   m <  DISCLOSURE_FLAG_THRESHOLD:    property.disclosure_posture = "NON_COMPLIANT"
          elif m <  DISCLOSURE_CONFIRM_THRESHOLD: property.disclosure_posture = "AT_RISK"
          else:                                   property.disclosure_posture = "COMPLIANT"

      property.published_fee_program_count = count(fee_programs of property
                                                   where status == "PUBLISHED")
      property.open_disclosure_obligation_count = (
            count(profiles of property where status == "FLAGGED")
          + count(bookings of property where disclosure_status in ("DISPUTED",
                                                                   "UNDISCLOSED_CONFIRMED"))
          + count(complaints of bookings of property where status in ("SUBMITTED",
                                                                      "UNDER_INVESTIGATION",
                                                                      "SUBSTANTIATED"))
          + count(inquiries of property where status not in ("ACCEPTED", "WITHDRAWN")))
      property.aggregate_disclosure_gap_cents = sum(b.quote_disclosure_gap_cents
            for b in bookings of property
            if b.disclosure_status in ("DISPUTED", "UNDISCLOSED_CONFIRMED"))
    input_set: >
      Only ChannelDisclosureProfile rows in DEPLOYED, FLAGGED or REMEDIATED drive
      the posture. DRAFT and RETIRED profiles are excluded entirely, so a DRAFT
      profile scoring 0 does NOT make the property NON_COMPLIANT.
    constants:
      DISCLOSURE_FLAG_THRESHOLD: 60
      DISCLOSURE_CONFIRM_THRESHOLD: 80
    precision: "integer score, or null when the candidate set is empty; comparisons are strict less-than at both thresholds"
    note: >
      The thresholds are half-open on the low side: a minimum of exactly 60 is
      AT_RISK, 59 is NON_COMPLIANT, exactly 80 is COMPLIANT and 79 is AT_RISK.
      An empty candidate set is COMPLIANT with a null score, which is how a
      freshly created property reads.

  - name: quote_variance_reconciliation
    trigger: "POST /folios/{id}/itemize"
    algorithm: aggregation
    formula: |
      booking.folio_fee_total_cents      = booking_fee_subtotal.stay_aggregation
      folio.charges_subtotal_cents       = sum(line.amount_cents for line in folio_lines
                                               if line.line_type in ("ROOM", "MANDATORY_FEE",
                                                                     "OPTIONAL_FEE", "FEE_REBILL"))
      folio.credits_total_cents          = sum(line.amount_cents for line in folio_lines
                                               if line.line_type in ("FEE_CREDIT",
                                                                     "COMPLAINT_REFUND"))
      folio.tax_total_cents              = sum(line.tax_cents for line in folio_lines)
      folio.folio_total_cents            = (folio.charges_subtotal_cents
                                            - folio.credits_total_cents
                                            + folio.tax_total_cents)
      booking.folio_total_cents          = folio.folio_total_cents
      booking.quote_folio_variance_cents = (booking.folio_total_cents
                                            - booking.quoted_total_cents)

      # Tolerance gate — a variance inside the tolerance is bookkeeping noise from
      # the two rounding orders and does NOT touch disclosure_status. A variance
      # whose ABSOLUTE value exceeds the tolerance moves the booking to DISPUTED.
      if abs(booking.quote_folio_variance_cents) > QUOTE_VARIANCE_TOLERANCE_CENTS:
          booking.disclosure_status = "DISPUTED"      # only from PENDING_AUDIT or DISCLOSED
    input_set: >
      Every FolioLine of the folio at the moment of itemization. Credit line types
      (FEE_CREDIT, COMPLAINT_REFUND) are subtracted, never added; their tax_cents
      are stored as negative values so that tax_total_cents remains a plain sum.
    constants:
      QUOTE_VARIANCE_TOLERANCE_CENTS: 100
    precision: "whole cents; the comparison is on the absolute value and is strictly greater-than, so a variance of exactly 100 does NOT dispute the booking"
    note: >
      Worked reference: folio_total 155152 against quoted_total 155155 gives
      variance -3. abs(-3) is not greater than 100, so disclosure_status stays
      PENDING_AUDIT. This is the expected steady state of the two rounding orders.

  - name: opt_out_credit
    trigger: "POST /opt-out-requests/{id}/grant"
    algorithm: aggregation
    formula: |
      # The credit reverses the folio's MANDATORY_FEE line for that fee, i.e. the
      # STAY-AGGREGATION amount, not the quote's per-night-rounded amount.
      source_line       = the folio's MANDATORY_FEE line whose fee_id == request.fee_id
      credit_cents      = source_line.amount_cents

      # Taxability re-determination: a fee whose rule is TAXABLE_IF_MANDATORY
      # ceases to be mandatory once the guest opts out, so the credit line is
      # stamped TAXABLE_IF_MANDATORY_WAIVED and the tax collected on the original
      # line is credited back in full.
      tax_credit_cents  = source_line.tax_cents
      credit_line = new FolioLine(line_type = "FEE_CREDIT",
                                  fee_id = request.fee_id,
                                  taxability_determination =
                                      "TAXABLE_IF_MANDATORY_WAIVED"
                                      if rule(fee.code).taxability == "TAXABLE_IF_MANDATORY"
                                      else source_line.taxability_determination,
                                  amount_cents = credit_cents,
                                  tax_rate_bps = source_line.tax_rate_bps,
                                  tax_cents    = -tax_credit_cents,
                                  sequence_no  = max(sequence_no of folio lines) + 1)
      request.credit_line_sequence_no = credit_line.sequence_no
      # Folio totals are then re-derived by quote_variance_reconciliation's
      # aggregation, which subtracts credits and re-sums tax.
    input_set: >
      Exactly one MANDATORY_FEE line — the one carrying request.fee_id. A fee with
      no such line cannot be opted out of, and a second granted request for the
      same fee on the same booking is rejected before this calculation runs.
    constants: {}
    precision: "whole cents, no new rounding — the credit is a byte-for-byte reversal of the source line's amount and tax"
    note: >
      Worked reference: granting opt-out on DESTINATION credits 5980 with a tax
      credit of 800, so the folio total falls from 155152 to 148372. Revoking the
      grant appends the mirror FEE_REBILL line and restores 155152 exactly, with
      no drift — that is the compensating pair.

  - name: complaint_refund_entitlement
    trigger: "POST /guest-complaints/{id}/substantiate"
    algorithm: threshold
    formula: |
      line       = the FolioLine named by complaint.folio_line_id
      jurisdiction = the property's Jurisdiction

      # VARIANT SELECTION is driven by complaint_reason, not by any caller input:
      #   NOT_DISCLOSED, TOTAL_NOT_SHOWN, MANDATORY_NOT_AVOIDABLE -> FULL_FEE_REFUND
      #   MISSTATED_AMOUNT                                        -> DISCLOSURE_GAP_DIFFERENTIAL
      #
      # VARIANT A — FULL_FEE_REFUND
      #   The guest was never told about the charge at all, so the whole line
      #   plus the tax collected on it is refunded.
      disputed_amount_cents  = line.amount_cents
      disclosed_amount_cents = booking.disclosed_fee_amounts.get(line.fee_code, 0)
      refund_A = line.amount_cents + line.tax_cents

      # VARIANT B — DISCLOSURE_GAP_DIFFERENTIAL
      #   The guest was told a smaller number, so only the DIFFERENCE plus the tax
      #   on that difference is refunded, and the tax is rounded independently of
      #   the tax already carried on the line.
      differential = max(0, line.amount_cents - disclosed_amount_cents)
      refund_B     = differential + round_half_up(differential * line.tax_rate_bps / 10000)

      complaint.refund_entitlement_cents = refund_A or refund_B per the variant
    input_set: >
      One FolioLine, which must belong to a folio of the complaint's booking and
      must have line_type in (MANDATORY_FEE, OPTIONAL_FEE). ROOM lines and credit
      lines are not complainable. The disclosed_fee_amounts map is read from the
      booking as captured at quote time and is never back-filled.
    constants: {}
    precision: >
      whole cents. Variant A reuses the line's already-rounded tax_cents and
      introduces no rounding. Variant B rounds the differential's tax
      independently, so refund_B is NOT a proportional slice of refund_A.
    variants:
      - name: FULL_FEE_REFUND
        when: "complaint_reason in (NOT_DISCLOSED, TOTAL_NOT_SHOWN, MANDATORY_NOT_AVOIDABLE)"
        difference: "refunds the entire line amount plus the tax already computed on the line, ignoring disclosed_fee_amounts entirely"
      - name: DISCLOSURE_GAP_DIFFERENTIAL
        when: "complaint_reason == MISSTATED_AMOUNT"
        difference: "refunds only line.amount_cents minus the disclosed amount, floored at 0, plus a freshly rounded tax on that differential"
    note: >
      Worked references on the canonical folio. FULL_FEE_REFUND against the
      WIFI_PREMIUM line (2600, EXEMPT, tax 0) yields 2600.
      DISCLOSURE_GAP_DIFFERENTIAL against the RESORT line (8970, tax_rate_bps
      1338) with disclosed_fee_amounts {RESORT: 6000, DESTINATION: 5980} yields
      differential 2970 and tax round_half_up(397.386) = 397, so
      refund_entitlement_cents 3367 — not 8970 + 1200 = 10170, and not a
      2970/8970 slice of 10170 (which would be 3368).

  - name: revenue_impact_roll_in
    trigger: "POST /revenue-impact-models"
    algorithm: tiered_pricing
    formula: |
      # Per-night, per-room reference economics. nights = MODEL_REFERENCE_NIGHTS and
      # guests = MODEL_REFERENCE_GUESTS are fixed so the model is comparable across
      # properties.
      #
      # === BASELINE (always computed, identical for both variants and for the
      # === STATUS_QUO scenario, whose modelled side equals its baseline side) ===
      # B1. baseline_adr_cents = property.base_room_rate_cents
      # B2. commission tier is keyed on the ADR:
      #        adr <= COMMISSION_TIER_1_MAX (19999) -> 1500 bps
      #        adr <= COMMISSION_TIER_2_MAX (34999) -> 1800 bps
      #        otherwise                            -> 2100 bps
      #     baseline_commission_cents = round_half_up(baseline_adr_cents * bps / 10000)
      # B3. every MANDATORY fee is retained; each is rounded per night against
      #     baseline_adr_cents (per-night rounding order)
      # B4. baseline_tax_cents = round_half_up((baseline_adr_cents
      #                            + retained_taxable_fee_cents) * J / 10000)
      #     where J = jurisdiction.occupancy_tax_rate_bps and retained_taxable is the
      #     sum of retained fees whose TaxabilityRule is not EXEMPT
      # B5. baseline_guest_total_cents = baseline_adr_cents + retained_taxable
      #                                  + retained_exempt + baseline_tax_cents
      # B6. baseline_net_revenue_cents = baseline_adr_cents + retained_taxable
      #                                  + retained_exempt - baseline_commission_cents
      #
      # === MODELLED SIDE — PINNED SIX-STEP ORDER ===
      # The order matters because step 2 changes the ADR, step 3's commission TIER is
      # keyed on the ADR that step 2 produced, and step 4 re-derives every
      # PERCENT_OF_ROOM fee against that same new ADR. Evaluating commission before
      # the roll-in, or holding the percent fee at its baseline value, yields
      # different integers.
      #
      # M1. rolled_fee_cents = sum over fee codes in roll_in_fee_codes of the fee's
      #     per-night amount rounded against baseline_adr_cents
      #     (PER_STAY fees contribute round_half_up(amount_cents / MODEL_REFERENCE_NIGHTS))
      # M2. modeled_adr_cents:
      #        RATE_PARITY   -> baseline_adr_cents + rolled_fee_cents
      #        TAX_ABSORBED  -> round_half_up((baseline_adr_cents + rolled_fee_cents)
      #                                       * 10000 / (10000 + J))
      # M3. applied_commission_bps = tier(modeled_adr_cents)
      #     modeled_commission_cents = round_half_up(modeled_adr_cents
      #                                              * applied_commission_bps / 10000)
      # M4. surviving fees = MANDATORY fees whose code is NOT in roll_in_fee_codes,
      #     each rounded per night against modeled_adr_cents (so a PERCENT_OF_ROOM
      #     fee grows under RATE_PARITY and shrinks under TAX_ABSORBED)
      # M5. modeled_tax_cents = round_half_up((modeled_adr_cents
      #                            + surviving_taxable_fee_cents) * J / 10000)
      # M6. modeled_guest_total_cents = modeled_adr_cents + surviving_taxable
      #                                 + surviving_exempt + modeled_tax_cents
      #     modeled_net_revenue_cents = modeled_adr_cents + surviving_taxable
      #                                 + surviving_exempt - modeled_commission_cents
      #
      # === DELTAS (modelled minus baseline, may be negative) ===
      # modeled_adr_delta_cents, modeled_commission_delta_cents,
      # modeled_tax_delta_cents, modeled_guest_total_delta_cents,
      # modeled_net_revenue_delta_cents
    input_set: >
      MANDATORY fees of the referenced fee_program_id only; OPTIONAL and
      CONDITIONAL fees never enter the model and may not appear in
      roll_in_fee_codes. STATUS_QUO requires roll_in_fee_codes to be empty and
      FULL_ROLL_IN requires it to name every MANDATORY fee code of the program;
      PARTIAL_ROLL_IN requires a non-empty proper subset.
    constants:
      COMMISSION_TIER_1_MAX: 19999
      COMMISSION_TIER_1_BPS: 1500
      COMMISSION_TIER_2_MAX: 34999
      COMMISSION_TIER_2_BPS: 1800
      COMMISSION_TIER_3_BPS: 2100
      MODEL_REFERENCE_GUESTS: 2
      MODEL_REFERENCE_NIGHTS: 4
    precision: >
      whole cents, round_half_up at every step, and the steps are NOT
      interchangeable — commission is rounded after the ADR is rebuilt, the
      percent-of-room fee is rounded against the modelled ADR, and tax is rounded
      once over the modelled aggregate base.
    variants:
      - name: RATE_PARITY
        when: "variant == RATE_PARITY — the operator moves the fee into the rate and keeps the pre-tax rate whole"
        difference: "modeled_adr_cents = baseline_adr + rolled_fee_cents, so the guest's tax base rises and the guest pays more"
      - name: TAX_ABSORBED
        when: "variant == TAX_ABSORBED — the operator holds the guest's tax-inclusive number constant and back-solves the rate"
        difference: "modeled_adr_cents = round_half_up((baseline_adr + rolled) * 10000 / (10000 + J)), which lowers the ADR below the parity figure, drops the commission tier input and shrinks every percent-of-room fee"
    note: >
      Worked reference: base_room_rate_cents 29900, J = 1338, mandatory fees
      RESORT (PERCENT_OF_ROOM 750 bps), DESTINATION (PER_NIGHT 1495),
      WIFI_PREMIUM (PER_PERSON_PER_NIGHT 325, EXEMPT), roll_in_fee_codes
      ["DESTINATION", "WIFI_PREMIUM"], scenario PARTIAL_ROLL_IN.
      Baseline: adr 29900, bps 1800, commission 5382, retained taxable 3738
      (2243 + 1495), retained exempt 650, tax base 33638, tax 4501, guest total
      38789, net 28906.
      RATE_PARITY: rolled 2145, adr 32045, bps 1800, commission 5768, surviving
      RESORT 2403, tax base 34448, tax 4609, guest total 39057, net 28680;
      deltas adr +2145, commission +386, tax +108, guest total +268, net -226.
      TAX_ABSORBED: adr 28263, bps 1800, commission 5087, surviving RESORT 2120,
      tax base 30383, tax 4065, guest total 34448, net 25296; deltas adr -1637,
      commission -295, tax -436, guest total -4341, net -3610.
      Commission-tier boundary with the same roll-in set: base_room_rate_cents
      32854 gives modeled_adr 34999, applied_commission_bps 1800 and commission
      6300; base_room_rate_cents 32855 gives modeled_adr 35000,
      applied_commission_bps 2100 and commission 7350.

  - name: inquiry_exposure
    trigger: "POST /regulator-inquiries, POST /regulator-inquiries/{id}/require-remediation, POST /regulator-inquiries/{id}/submit-remediation"
    algorithm: aggregation
    formula: |
      # Monetary exposure the regulator's docket reaches, restricted to the
      # channel types the docket names.
      exposure = 0
      for b in bookings where b.property_id == inquiry.property_id:
          if channel_of(b).channel_type not in inquiry.channel_scope:
              continue
          if b.disclosure_status not in ("DISPUTED", "UNDISCLOSED_CONFIRMED"):
              continue
          exposure += b.quote_disclosure_gap_cents
      inquiry.exposure_cents = exposure

      # flagged_profile_ids is the in-scope live profile set the docket touches,
      # captured at require-remediation time and ordered by
      # ChannelDisclosureProfile.created_at ASC.
      inquiry.flagged_profile_ids = [p.id for p in profiles_of(inquiry.property_id)
                                     if channel_of(p).channel_type in inquiry.channel_scope
                                     and p.status in ("DEPLOYED", "FLAGGED", "REMEDIATED")]
    input_set: >
      Bookings of the inquiry's property whose channel's channel_type appears in
      inquiry.channel_scope and whose disclosure_status is DISPUTED or
      UNDISCLOSED_CONFIRMED. Bookings in PENDING_AUDIT, DISCLOSED or CURED
      contribute nothing, and a booking on an out-of-scope channel contributes
      nothing even when its disclosure_status is UNDISCLOSED_CONFIRMED.
    constants: {}
    precision: "whole cents, plain integer sum of already-rounded per-booking gaps; no re-rounding"
    note: >
      Worked reference: a single OTA booking with quote_disclosure_gap_cents 5572
      moved to UNDISCLOSED_CONFIRMED, inside a docket whose channel_scope is
      ["OTA"], gives exposure_cents 5572. Re-scoping the docket to ["GDS"] gives
      exposure_cents 0 for the same booking.

  - name: guest_out_of_pocket_conservation
    trigger: "invariant — asserted after POST /folios/{id}/itemize, /post, POST /opt-out-requests/{id}/grant, /revoke, POST /guest-complaints/{id}/refund and POST /folios/{id}/close"
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY: money. Every cent the guest is asked for is either
      # still owed on the folio or has been handed back, and the two sides must
      # reconcile against the folio's own line ledger at all times.
      charges = sum(l.amount_cents + l.tax_cents for l in folio_lines
                    if l.line_type in ("ROOM", "MANDATORY_FEE", "OPTIONAL_FEE",
                                       "FEE_REBILL"))
      credits = sum(l.amount_cents - l.tax_cents for l in folio_lines
                    if l.line_type in ("FEE_CREDIT", "COMPLAINT_REFUND"))
                    # credit lines carry NEGATIVE tax_cents, so subtracting them
                    # adds the tax back into the credit side
      INVARIANT_1: booking.guest_out_of_pocket_cents == charges - credits
      INVARIANT_2: booking.guest_out_of_pocket_cents == booking.folio_total_cents
      INVARIANT_3: folio.folio_total_cents == (folio.charges_subtotal_cents
                                               - folio.credits_total_cents
                                               + folio.tax_total_cents)
      INVARIANT_4: folio.line_count == count(folio_lines)
                   and every sequence_no from 1..line_count appears exactly once
    input_set: "every FolioLine of the folio, with no state filter — FolioLine is immutable and has no status"
    constants: {}
    precision: "exact integer equality; no tolerance is permitted on this invariant"
    note: >
      Reversal is the sharp case. Granting an opt-out on DESTINATION appends a
      FEE_CREDIT of 5980 with tax_cents -800, dropping guest_out_of_pocket_cents
      from 155152 to 148372; revoking it appends a FEE_REBILL of 5980 with
      tax_cents +800 and restores exactly 155152. The invariant forbids the
      implementation from mutating the original MANDATORY_FEE line in place, which
      would satisfy the total while destroying the audit trail and breaking
      INVARIANT_4's contiguous sequence_no requirement.

  - name: disclosure_obligation_conservation
    trigger: "invariant — asserted after every write that can change a profile, booking, complaint or inquiry status"
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY: the count of open compliance obligations. This is a
      # different conserved quantity from guest_out_of_pocket_conservation (a
      # cardinality, not money) over a different entity set.
      INVARIANT_1: property.open_disclosure_obligation_count ==
            count(profiles of property where status == "FLAGGED")
          + count(bookings of property where disclosure_status in ("DISPUTED",
                                                                   "UNDISCLOSED_CONFIRMED"))
          + count(complaints of bookings of property where status in ("SUBMITTED",
                                                                      "UNDER_INVESTIGATION",
                                                                      "SUBSTANTIATED"))
          + count(inquiries of property where status not in ("ACCEPTED", "WITHDRAWN"))

      INVARIANT_2: property.aggregate_disclosure_gap_cents ==
            sum(b.quote_disclosure_gap_cents for b in bookings of property
                if b.disclosure_status in ("DISPUTED", "UNDISCLOSED_CONFIRMED"))

      INVARIANT_3: profile.confirmed_undisclosed_count ==
            count(complaints c where c.status in ("SUBSTANTIATED", "REFUNDED")
                  and booking_of(c).channel_disclosure_profile_id == profile.id)

      INVARIANT_4: property.published_fee_program_count ==
            count(fee_programs of property where status == "PUBLISHED")
            and that count is never greater than 1 for any single instant covered
            by overlapping effective windows

      INVARIANT_5: for every ChannelDisclosureProfile p,
            p.disclosure_score == channel_disclosure_score(p) recomputed from
            scratch — the stored denormalisation never drifts from the formula
    input_set: >
      Profiles in FLAGGED only; bookings in DISPUTED or UNDISCLOSED_CONFIRMED only;
      complaints in SUBMITTED, UNDER_INVESTIGATION or SUBSTANTIATED only (REFUNDED,
      UNSUBSTANTIATED are closed); inquiries in every status except ACCEPTED and
      WITHDRAWN.
    constants: {}
    precision: "exact integer equality on every counter; a curing transition must DECREMENT, never merely stop incrementing"
    note: >
      The compensating direction is what this catches. Withdrawing a regulator
      inquiry returns its FLAGGED in-scope profiles to DEPLOYED and must therefore
      decrement open_disclosure_obligation_count by 1 for the inquiry plus 1 per
      restored profile, and must restore the property's posture to whatever the
      recomputed minimum score dictates. Refunding a complaint moves the booking
      to CURED, which removes its gap from aggregate_disclosure_gap_cents while
      LEAVING profile.confirmed_undisclosed_count intact — a substantiated
      disclosure failure is never erased by paying for it.

# -----------------------------------------------------------------------------
# 1.4 Validation Rules Table (Ordered by Priority)
#
# Priority is GLOBAL and TOTAL: when a single request violates several rules, the
# response carries the error of the LOWEST-numbered violated rule, and no
# higher-numbered check is even evaluated. Ordering within a priority is
# impossible because no two rules share a priority.
#
# Domain ordering rationale: authentication, then authorization (including the two
# entity-backed ownership checks), then path existence, then request shape, then
# body-FK existence, then segregation of duties, then optimistic-concurrency
# preconditions, then target-state preconditions, then business rules in the order
# safety/compliance -> referential integrity -> uniqueness and temporal conflicts
# -> fiscal. Regulatory disclosure bans outrank referential completeness because a
# jurisdiction that forbids mandatory fees outright makes the inclusion question
# moot; fiscal refund arithmetic is last because a refund can only be mis-sized
# once everything else about the complaint is well-formed.
# -----------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty on every request except GET /_clock"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except GET /_clock"

  - priority: 2
    category: auth
    check: "X-User-Role names one of the seven roles declared in §1.7"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: "all endpoints except GET /_clock"

  - priority: 3
    category: auth
    check: "the acting role appears in the target endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints except GET /_clock"

  - priority: 4
    category: auth
    check: "when X-User-Role is ChannelOperator, X-User-ID equals an existing Channel.id, and for any endpoint that touches a ChannelDisclosureProfile, Booking or Channel, that resource's channel_id equals X-User-ID"
    error_id: ERR_CHANNEL_OWNERSHIP_REQUIRED
    http_status: 403
    applies_to: "POST /channel-disclosure-profiles, POST /channel-disclosure-profiles/{id}/deploy, POST /channel-disclosure-profiles/{id}/remediate, POST /bookings, GET /channel-disclosure-profiles/{id}, GET /bookings/{id}"

  - priority: 5
    category: auth
    check: "when X-User-Role is Guest, X-User-ID equals an existing Booking.id, and the addressed booking, folio, folio line, opt-out request or complaint resolves to that same booking"
    error_id: ERR_BOOKING_OWNERSHIP_REQUIRED
    http_status: 403
    applies_to: "GET /bookings/{id}, GET /bookings/{id}/folios, GET /folios/{id}, GET /folio-lines/{id}, GET /folio-lines, POST /bookings/{id}/opt-out-requests, POST /bookings/{id}/guest-complaints, GET /opt-out-requests/{id}, GET /guest-complaints/{id}"

  - priority: 6
    category: existence
    check: "every id embedded in the path exists, validated strictly LEFT TO RIGHT so that the leftmost missing segment determines the error (e.g. POST /fee-programs/{missing}/fees returns ERR_FEE_PROGRAM_NOT_FOUND and never evaluates the body)"
    error_id: "ERR_JURISDICTION_NOT_FOUND | ERR_PROPERTY_NOT_FOUND | ERR_CHANNEL_NOT_FOUND | ERR_FEE_PROGRAM_NOT_FOUND | ERR_FEE_NOT_FOUND | ERR_PROFILE_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_FOLIO_NOT_FOUND | ERR_FOLIO_LINE_NOT_FOUND | ERR_OPT_OUT_REQUEST_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND | ERR_INQUIRY_NOT_FOUND | ERR_REVENUE_MODEL_NOT_FOUND | ERR_TAXABILITY_RULE_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 7
    category: business_constraint
    check: >
      request shape: all required input fields present and non-null; every enum
      field is one of its declared literals; occupancy_tax_rate_bps and every
      *_bps field in 0..10000; amount_cents, retail_value_cents,
      base_room_rate_cents, room_rate_cents >= 0; nights >= 1; guests >= 1;
      units >= 1; opt_out_window_hours >= 0; effective_to strictly after
      effective_from; deployed_to strictly after deployed_from; response_due_at
      strictly after the current logical clock; amount_cents required and
      percent_bps forbidden when basis != PERCENT_OF_ROOM; percent_bps required
      and amount_cents forbidden when basis == PERCENT_OF_ROOM;
      opt_out_window_hours permitted only when avoidable is true;
      disclosed_fee_amounts is an object whose values are integers >= 0;
      channel_scope and roll_in_fee_codes are arrays of strings with no
      duplicates; refund_amount_cents >= 1
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST endpoints"

  - priority: 8
    category: existence
    check: "every id supplied in the request BODY resolves to an existing row (jurisdiction_id, property_id, channel_id, fee_program_id, supersedes_program_id, channel_disclosure_profile_id, fee_id, folio_line_id), validated in the field order declared by the endpoint's input list"
    error_id: "ERR_JURISDICTION_NOT_FOUND | ERR_PROPERTY_NOT_FOUND | ERR_CHANNEL_NOT_FOUND | ERR_FEE_PROGRAM_NOT_FOUND | ERR_FEE_NOT_FOUND | ERR_PROFILE_NOT_FOUND | ERR_FOLIO_LINE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /taxability-rules, POST /properties, POST /fee-programs, POST /channel-disclosure-profiles, POST /bookings, POST /bookings/{id}/opt-out-requests, POST /bookings/{id}/guest-complaints, POST /regulator-inquiries, POST /revenue-impact-models"

  - priority: 9
    category: auth
    check: >
      segregation of duties, enforced on X-User-ID: the ComplianceOfficer who
      publishes a fee program must not be the user recorded in
      FeeProgram.authored_by_user_id; the ComplianceOfficer who substantiates or
      dismisses a complaint must not be the user recorded in
      GuestComplaint.investigated_by_user_id; the RegulatoryLiaison who submits an
      inquiry response must not be the user recorded in
      RegulatorInquiry.drafted_by_user_id
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /fee-programs/{id}/publish, POST /guest-complaints/{id}/substantiate, POST /guest-complaints/{id}/dismiss, POST /regulator-inquiries/{id}/submit-response"

  - priority: 10
    category: state
    check: "expected_property_version equals the current Property.version (see §1.2.1 rule fee-program-create-stale-property)"
    error_id: ERR_STALE_PROPERTY_VERSION
    http_status: 412
    applies_to: "POST /fee-programs"

  - priority: 11
    category: state
    check: "expected_fee_program_version equals the current FeeProgram.version (see §1.2.1 rule disclosure-profile-create-stale-fee-program)"
    error_id: ERR_STALE_FEE_PROGRAM_VERSION
    http_status: 412
    applies_to: "POST /channel-disclosure-profiles"

  - priority: 12
    category: state
    check: "the addressed entity's current status admits the requested transition per §1.2, including terminal-state lockdown and the explicitly forbidden ADJUSTED -> CLOSED folio edge"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint that drives a state machine"

  - priority: 13
    category: state
    check: "the folio backing the requested credit, rebill or refund line is in POSTED or ADJUSTED; an OPEN, ITEMIZED or CLOSED folio cannot absorb a compensating line"
    error_id: ERR_FOLIO_NOT_ADJUSTABLE
    http_status: 409
    applies_to: "POST /opt-out-requests/{id}/grant, POST /opt-out-requests/{id}/revoke, POST /guest-complaints/{id}/refund"

  - priority: 14
    category: state
    check: "the fee_program_id supplied for a disclosure profile, and the program pinned on a booking's profile, is in status PUBLISHED"
    error_id: ERR_FEE_PROGRAM_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /channel-disclosure-profiles, POST /revenue-impact-models"

  - priority: 15
    category: state
    check: "the channel_disclosure_profile_id supplied for a booking is in status DEPLOYED or REMEDIATED; a DRAFT, FLAGGED or RETIRED profile cannot take bookings"
    error_id: ERR_PROFILE_NOT_BOOKABLE
    http_status: 409
    applies_to: "POST /bookings"

  - priority: 16
    category: state
    check: "the property named by property_id is in status ACTIVE. Property.status is fixed at creation time and there is no transition endpoint for it, so the downstream write paths (disclosure profiles, bookings, revenue models) inherit the guarantee transitively through the PUBLISHED program they pin and never re-check it."
    error_id: ERR_PROPERTY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /fee-programs"

  - priority: 17
    category: state
    check: "a fee program may not be published while the property's disclosure_posture is NON_COMPLIANT — the operator must clear its flagged channels first (cross-entity precondition FeeProgram -> Property)"
    error_id: ERR_PROPERTY_DISCLOSURE_FROZEN
    http_status: 409
    applies_to: "POST /fee-programs/{id}/publish"

  - priority: 18
    category: business_temporal
    check: "the current logical clock is at or before RegulatorInquiry.response_due_at when drafting or submitting a response; a lapsed docket must be escalated by the regulator, not answered late"
    error_id: ERR_RESPONSE_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /regulator-inquiries/{id}/draft-response, POST /regulator-inquiries/{id}/submit-response"

  - priority: 19
    category: business_safety
    check: "the property's jurisdiction does not have mandatory_fee_ban true while the program being published contains at least one Fee with classification MANDATORY"
    error_id: ERR_MANDATORY_FEE_BANNED_IN_JURISDICTION
    http_status: 422
    applies_to: "POST /fee-programs/{id}/publish"

  - priority: 20
    category: business_safety
    check: "when the property's jurisdiction has first_quote_total_required true, the profile being deployed or remediated must have first_quote_shows_total true. A profile may be DRAFTED with first_quote_shows_total false, but it can never reach DEPLOYED or REMEDIATED, which is why POST /bookings does not need to re-check the flag — validations[priority=15] already restricts bookings to DEPLOYED and REMEDIATED profiles."
    error_id: ERR_TOTAL_PRICE_DISPLAY_REQUIRED
    http_status: 422
    applies_to: "POST /channel-disclosure-profiles/{id}/deploy, POST /channel-disclosure-profiles/{id}/remediate"

  - priority: 21
    category: business_safety
    check: "a profile may not claim first_quote_shows_total true on a channel whose supports_total_price_display is false, nor itemized_at_first_quote true on a channel whose supports_itemization is false"
    error_id: ERR_CHANNEL_CAPABILITY_MISMATCH
    http_status: 422
    applies_to: "POST /channel-disclosure-profiles, POST /channel-disclosure-profiles/{id}/remediate"

  - priority: 22
    category: business_referential
    check: "every Fee with classification MANDATORY in the program being published has at least one FeeInclusion whose included_value_cents is greater than 0 — a mandatory fee must buy the guest something"
    error_id: ERR_MANDATORY_FEE_WITHOUT_INCLUSION
    http_status: 422
    applies_to: "POST /fee-programs/{id}/publish"

  - priority: 23
    category: business_referential
    check: "a TaxabilityRule row exists for (property.jurisdiction_id, fee.code) for every MANDATORY fee of the program being published. TaxabilityRule rows are immutable and undeletable, so a PUBLISHED program can never lose coverage and booking time never needs to re-check it."
    error_id: ERR_TAXABILITY_RULE_MISSING
    http_status: 422
    applies_to: "POST /fee-programs/{id}/publish"

  - priority: 24
    category: business_referential
    check: "the fee_id named in an opt-out request belongs to the booking's pinned fee_program_id"
    error_id: ERR_FEE_NOT_ON_BOOKING_PROGRAM
    http_status: 422
    applies_to: "POST /bookings/{id}/opt-out-requests"

  - priority: 25
    category: business_referential
    check: "the folio_line_id named in a complaint belongs to a folio of the addressed booking and has line_type MANDATORY_FEE or OPTIONAL_FEE"
    error_id: ERR_FOLIO_LINE_NOT_ON_BOOKING
    http_status: 422
    applies_to: "POST /bookings/{id}/guest-complaints"

  - priority: 26
    category: business_constraint
    check: "Fee.code is unique within its fee_program_id; Jurisdiction.code is globally unique; (jurisdiction_id, fee_code) is unique across TaxabilityRule; (jurisdiction_id, docket_number) is unique across RegulatorInquiry; (fee_id, service_code) is unique across FeeInclusion"
    error_id: "ERR_DUPLICATE_FEE_CODE | ERR_DUPLICATE_JURISDICTION_CODE | ERR_DUPLICATE_TAXABILITY_RULE | ERR_DUPLICATE_DOCKET_NUMBER | ERR_DUPLICATE_INCLUSION_CODE"
    http_status: 409
    applies_to: "POST /fee-programs/{id}/fees, POST /jurisdictions, POST /taxability-rules, POST /regulator-inquiries, POST /fees/{id}/inclusions"

  - priority: 27
    category: business_temporal
    check: >
      the new fee program's HALF-OPEN effective interval [effective_from,
      effective_to) must not overlap the interval of any other PUBLISHED program of
      the same property, excluding the program named by supersedes_program_id.
      Collision test: a.effective_from < b.effective_to AND b.effective_from <
      a.effective_to. Touching endpoints are therefore ALLOWED — a program ending
      exactly when the next begins is legal and leaves no gap.
    error_id: ERR_FEE_PROGRAM_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /fee-programs/{id}/publish"

  - priority: 28
    category: business_temporal
    check: >
      the new disclosure profile's CLOSED deployment window [deployed_from,
      deployed_to], inflated by CUTOVER_BUFFER_HOURS = 24 on each side, must not
      collide with the window of any other profile on the same (property_id,
      channel_id) whose status is DEPLOYED, FLAGGED, REMEDIATED or RETIRED.
      Collision test: P.deployed_from < Q.deployed_to + 24h AND Q.deployed_from <
      P.deployed_to + 24h. Touching endpoints are therefore FORBIDDEN and so is any
      gap under 24 hours; a gap of exactly 24 hours is the smallest legal one.
    error_id: ERR_CUTOVER_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /channel-disclosure-profiles, POST /channel-disclosure-profiles/{id}/deploy"

  - priority: 29
    category: business_temporal
    check: "FeeProgram.effective_from is at or after the current logical clock at publish time — a program cannot be published into the past"
    error_id: ERR_EFFECTIVE_FROM_IN_PAST
    http_status: 422
    applies_to: "POST /fee-programs/{id}/publish"

  - priority: 30
    category: business_constraint
    check: "no other OptOutRequest for the same (booking_id, fee_id) is in status REQUESTED or GRANTED"
    error_id: ERR_DUPLICATE_OPT_OUT
    http_status: 409
    applies_to: "POST /bookings/{id}/opt-out-requests"

  - priority: 31
    category: business_constraint
    check: "the fee named in an opt-out request has avoidable true and classification MANDATORY or CONDITIONAL; a non-avoidable fee cannot be opted out of at all"
    error_id: ERR_FEE_NOT_AVOIDABLE
    http_status: 422
    applies_to: "POST /bookings/{id}/opt-out-requests"

  - priority: 32
    category: business_temporal
    check: >
      the opt-out is requested early enough: hours_before_arrival =
      (booking.arrival_date - current_logical_clock) in whole hours, floored, must
      be >= fee.opt_out_window_hours. The comparison is inclusive, so a request
      landing at exactly opt_out_window_hours before arrival is accepted.
    error_id: ERR_OPT_OUT_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /bookings/{id}/opt-out-requests"

  - priority: 33
    category: business_referential
    check: "every code in roll_in_fee_codes names a Fee of the referenced fee_program_id whose classification is MANDATORY"
    error_id: ERR_ROLL_IN_FEE_NOT_MANDATORY
    http_status: 422
    applies_to: "POST /revenue-impact-models"

  - priority: 34
    category: business_constraint
    check: "roll_in_fee_codes matches the declared scenario: STATUS_QUO requires an empty array, FULL_ROLL_IN requires every MANDATORY fee code of the program, PARTIAL_ROLL_IN requires a non-empty strict subset"
    error_id: ERR_ROLL_IN_SCENARIO_MISMATCH
    http_status: 422
    applies_to: "POST /revenue-impact-models"

  - priority: 35
    category: business_constraint
    check: "channel_scope is non-empty and every member is a valid channel_type literal"
    error_id: ERR_INQUIRY_SCOPE_EMPTY
    http_status: 422
    applies_to: "POST /regulator-inquiries"

  - priority: 36
    category: business_fiscal
    check: "the complaint's refund_entitlement_cents is greater than 0 — a substantiated complaint whose differential computes to 0 cannot be refunded"
    error_id: ERR_NO_REFUND_ENTITLEMENT
    http_status: 422
    applies_to: "POST /guest-complaints/{id}/refund"

  - priority: 37
    category: business_fiscal
    check: "refund_amount_cents is less than or equal to the complaint's refund_entitlement_cents; equality is permitted, one cent over is not"
    error_id: ERR_REFUND_EXCEEDS_ENTITLEMENT
    http_status: 422
    applies_to: "POST /guest-complaints/{id}/refund"

  - priority: 38
    category: state
    check: "POST /folios/{id}/post requires the folio's booking to be in stay_status CHECKED_OUT — a folio cannot be posted while the guest is still in house (cross-entity precondition Folio -> Booking)"
    error_id: ERR_BOOKING_NOT_CHECKED_OUT
    http_status: 409
    applies_to: "POST /folios/{id}/post"

  - priority: 39
    category: state
    check: "POST /channel-disclosure-profiles/{id}/confirm-remediation requires the recomputed disclosure_score to be at or above DISCLOSURE_CONFIRM_THRESHOLD (80); exactly 80 passes, 79 does not"
    error_id: ERR_REMEDIATION_SCORE_INSUFFICIENT
    http_status: 409
    applies_to: "POST /channel-disclosure-profiles/{id}/confirm-remediation"

  - priority: 40
    category: state
    check: "POST /regulator-inquiries/{id}/submit-remediation requires every profile id in flagged_profile_ids to have left FLAGGED"
    error_id: ERR_REMEDIATION_INCOMPLETE
    http_status: 409
    applies_to: "POST /regulator-inquiries/{id}/submit-remediation"

  - priority: 41
    category: state
    check: "POST /fee-programs/{id}/submit-review requires the program to contain at least one Fee"
    error_id: ERR_FEE_PROGRAM_EMPTY
    http_status: 409
    applies_to: "POST /fee-programs/{id}/submit-review"

  - priority: 42
    category: business_temporal
    check: "POST /bookings/{id}/check-in requires the logical clock to be at or after the booking's arrival_date; exactly equal is permitted"
    error_id: ERR_ARRIVAL_NOT_REACHED
    http_status: 409
    applies_to: "POST /bookings/{id}/check-in"

  - priority: 43
    category: business_temporal
    check: "POST /bookings/{id}/check-out requires the logical clock to be at or after arrival_date plus nights days; exactly equal is permitted"
    error_id: ERR_DEPARTURE_NOT_REACHED
    http_status: 409
    applies_to: "POST /bookings/{id}/check-out"

  - priority: 44
    category: business_referential
    check: "POST /opt-out-requests/{id}/grant and /revoke require the folio to carry a MANDATORY_FEE line for the request's fee_id (grant) or the FEE_CREDIT line named by credit_line_sequence_no (revoke). The reachable case is a MANDATORY avoidable fee whose stay amount computes to 0 cents: it is a legitimate opt-out target under priorities 24 and 31, but itemization produced no folio line for it, so there is nothing to credit"
    error_id: ERR_FEE_LINE_NOT_ON_FOLIO
    http_status: 422
    applies_to: "POST /opt-out-requests/{id}/grant, POST /opt-out-requests/{id}/revoke"

# -----------------------------------------------------------------------------
# 1.5 API Endpoint Table
#
# api_prefix is "/" so every path below is the complete route. All list endpoints
# accept `limit?` and `offset?` and return the paginated envelope of §1.0 with
# `total_count` and `has_more`; default limit 50, maximum 200, default offset 0.
# List ordering is `created_at ASC, id ASC` unless stated otherwise, so pagination
# is stable under insertion.
#
# There are no PUT, PATCH or DELETE routes anywhere in this API. Every mutation is
# a POST that either creates a row or drives a declared state transition, which is
# what makes the compliance audit trail append-only.
# -----------------------------------------------------------------------------
endpoints:

  # --- logical clock -----------------------------------------------------------
  - method: GET
    path: "/_clock"
    description: "Read the server's current logical UTC instant. Before any set_current_utc call this returns exactly 2026-08-01T00:00:00Z, never real wall-clock time. This is the only endpoint exempt from authentication."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison, ChannelOperator, GuestServicesAgent, Guest]
    code: 200
    input: []
    output: { current_utc: string }
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: move the server's logical clock to an arbitrary ISO-8601 UTC instant. The clock's mandatory startup default is 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time before this endpoint is called. Every temporal rule in this API (fee-program effective windows, disclosure cutover buffers, opt-out windows, regulator response deadlines, arrival and departure dates) reads this clock and nothing else. Time may be moved forward or backward."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["no stored row is recomputed; the new instant is simply what subsequent temporal checks read"]

  # --- jurisdictions -----------------------------------------------------------
  - method: POST
    path: "/jurisdictions"
    description: "Register a taxing and regulating jurisdiction with its occupancy tax rate and its four disclosure mandate flags."
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, occupancy_tax_rate_bps, first_quote_total_required, itemization_required_on_folio, "mandatory_fee_ban?", "opt_out_mandate?"]
    output: Jurisdiction
    side_effects: []

  - method: GET
    path: "/jurisdictions/{id}"
    description: "Read one jurisdiction."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison, ChannelOperator, GuestServicesAgent]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []

  - method: GET
    path: "/jurisdictions"
    description: "List jurisdictions."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison, ChannelOperator, GuestServicesAgent]
    code: 200
    input: ["code?", "mandatory_fee_ban?", "limit?", "offset?"]
    output: Jurisdiction[]
    side_effects: []

  # --- taxability rules --------------------------------------------------------
  - method: POST
    path: "/taxability-rules"
    description: "Declare how one fee code is taxed in one jurisdiction. tax_rate_bps overrides the jurisdiction's occupancy_tax_rate_bps when supplied; when omitted the jurisdiction rate applies."
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 201
    input: [jurisdiction_id, fee_code, taxability, "tax_rate_bps?"]
    output: TaxabilityRule
    side_effects: []

  - method: GET
    path: "/taxability-rules/{id}"
    description: "Read one taxability rule."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison, ChannelOperator, GuestServicesAgent]
    code: 200
    input: []
    output: TaxabilityRule
    side_effects: []

  - method: GET
    path: "/taxability-rules"
    description: "List taxability rules, filterable by jurisdiction and fee code."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison, ChannelOperator, GuestServicesAgent]
    code: 200
    input: ["jurisdiction_id?", "fee_code?", "taxability?", "limit?", "offset?"]
    output: TaxabilityRule[]
    side_effects: []

  # --- properties --------------------------------------------------------------
  - method: POST
    path: "/properties"
    description: "Create a lodging property in a jurisdiction. disclosure_posture starts COMPLIANT with a null min_channel_disclosure_score because the profile candidate set is empty."
    roles: [PlatformAdmin]
    code: 201
    input: [jurisdiction_id, name, brand_code, base_room_rate_cents, "status?"]
    output: Property
    side_effects: ["property_disclosure_posture initialises disclosure_posture COMPLIANT, min_channel_disclosure_score null, all counters 0"]

  - method: GET
    path: "/properties/{id}"
    description: "Read one property including its denormalised disclosure posture and counters."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison, ChannelOperator, GuestServicesAgent]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: GET
    path: "/properties"
    description: "List properties, filterable by jurisdiction, operating status and disclosure posture."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison, ChannelOperator, GuestServicesAgent]
    code: 200
    input: ["jurisdiction_id?", "status?", "disclosure_posture?", "limit?", "offset?"]
    output: Property[]
    side_effects: []

  - method: GET
    path: "/properties/{id}/disclosure-summary"
    description: "Computed read: the property's live disclosure position, re-derived on read from its profiles, bookings, complaints and inquiries. Every field must equal the denormalised counterpart stored on Property, which is how disclosure_obligation_conservation is observed from outside."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison]
    code: 200
    input: []
    output:
      property_id: string
      disclosure_posture: string
      min_channel_disclosure_score: integer
      open_disclosure_obligation_count: integer
      deployed_profile_count: integer
      flagged_profile_count: integer
      published_fee_program_count: integer
      total_mandatory_fee_cents_per_night: integer
      aggregate_disclosure_gap_cents: integer
    side_effects: []

  # --- channels ----------------------------------------------------------------
  - method: POST
    path: "/channels"
    description: "Register a booking channel and declare its technical display capabilities. A channel that cannot show a total price or cannot itemise constrains every disclosure profile deployed on it."
    roles: [PlatformAdmin]
    code: 201
    input: [name, channel_type, supports_total_price_display, supports_itemization]
    output: Channel
    side_effects: []

  - method: GET
    path: "/channels/{id}"
    description: "Read one channel."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison, ChannelOperator, GuestServicesAgent]
    code: 200
    input: []
    output: Channel
    side_effects: []

  - method: GET
    path: "/channels"
    description: "List channels, filterable by type and capability."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison, ChannelOperator, GuestServicesAgent]
    code: 200
    input: ["channel_type?", "supports_total_price_display?", "supports_itemization?", "limit?", "offset?"]
    output: Channel[]
    side_effects: []

  # --- fee programs ------------------------------------------------------------
  - method: POST
    path: "/fee-programs"
    description: "Open a DRAFT fee program for a property. Requires the caller's expected_property_version to match Property.version; on success the Property's version is incremented by exactly 1, so a second create against the same read version is rejected with 412. supersedes_program_id names the PUBLISHED program this one will replace at publish time."
    roles: [RevenueManager, ComplianceOfficer]
    code: 201
    input: [property_id, version_label, effective_from, effective_to, expected_property_version, "supersedes_program_id?"]
    output: FeeProgram
    side_effects: ["status set to DRAFT", "authored_by_user_id set from X-User-ID", "Property.version incremented by 1", "fee_count 0, mandatory_fee_count 0, total_mandatory_fee_cents_per_night 0, inclusion_coverage_ratio 0.0000"]

  - method: GET
    path: "/fee-programs/{id}"
    description: "Read one fee program including its rollup counters and its current version, which is the OCC token for creating disclosure profiles."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison, ChannelOperator, GuestServicesAgent]
    code: 200
    input: []
    output: FeeProgram
    side_effects: []

  - method: GET
    path: "/fee-programs"
    description: "List fee programs, filterable by property, by the program they supersede, and by lifecycle status."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison, ChannelOperator, GuestServicesAgent]
    code: 200
    input: ["property_id?", "supersedes_program_id?", "status?", "limit?", "offset?"]
    output: FeeProgram[]
    side_effects: []

  - method: POST
    path: "/fee-programs/{id}/fees"
    description: "Add a fee to a DRAFT fee program. amount_cents is required unless basis is PERCENT_OF_ROOM, in which case percent_bps is required instead. opt_out_window_hours may only be supplied when avoidable is true."
    roles: [RevenueManager, ComplianceOfficer]
    code: 201
    input: [code, label, classification, basis, disclosure_text, "amount_cents?", "percent_bps?", "avoidable?", "opt_out_window_hours?"]
    output: Fee
    side_effects: ["fee_program_rollup recomputes fee_count and mandatory_fee_count on the parent program; total_mandatory_fee_cents_per_night and inclusion_coverage_ratio remain at their defaults until publication"]

  - method: GET
    path: "/fees/{id}"
    description: "Read one fee."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison, ChannelOperator, GuestServicesAgent, Guest]
    code: 200
    input: []
    output: Fee
    side_effects: []

  - method: GET
    path: "/fees"
    description: "List fees, filterable by program, classification and basis."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison, ChannelOperator, GuestServicesAgent, Guest]
    code: 200
    input: ["fee_program_id?", "classification?", "basis?", "limit?", "offset?"]
    output: Fee[]
    side_effects: []

  - method: POST
    path: "/fees/{id}/inclusions"
    description: "Record a service bundled into a fee — the inclusion analysis that justifies charging it. units defaults to 1 and included_value_cents is computed as retail_value_cents multiplied by units."
    roles: [RevenueManager, ComplianceOfficer]
    code: 201
    input: [service_code, service_label, retail_value_cents, "units?"]
    output: FeeInclusion
    side_effects: ["fee_inclusion_value recomputes Fee.inclusion_count and Fee.inclusion_value_cents", "the program's inclusion_coverage_ratio is NOT recomputed here — it is computed at publication from the inclusions then in force"]

  - method: GET
    path: "/fees/{id}/inclusions"
    description: "List the services bundled into one fee. This is the only discovery channel for FeeInclusion rows."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison, ChannelOperator, GuestServicesAgent, Guest]
    code: 200
    input: ["limit?", "offset?"]
    output: FeeInclusion[]
    side_effects: []

  - method: POST
    path: "/fee-programs/{id}/submit-review"
    description: "Move a DRAFT fee program to UNDER_REVIEW. The program must already contain at least one fee."
    roles: [RevenueManager, ComplianceOfficer]
    code: 200
    input: []
    output: FeeProgram
    side_effects: ["status DRAFT -> UNDER_REVIEW"]

  - method: POST
    path: "/fee-programs/{id}/publish"
    description: "Publish an UNDER_REVIEW fee program. The publishing X-User-ID must differ from authored_by_user_id. Runs the full compliance gate: jurisdiction mandatory-fee ban, inclusion coverage of every mandatory fee, taxability-rule completeness, effective_from not in the past, half-open interval non-overlap against other PUBLISHED programs of the property, and the property's posture must not be NON_COMPLIANT."
    roles: [ComplianceOfficer]
    code: 200
    input: [attestation_note]
    output: FeeProgram
    side_effects: ["status UNDER_REVIEW -> PUBLISHED", "attested_by_user_id set from X-User-ID, published_at set to the logical clock", "when supersedes_program_id is set: that program transitions PUBLISHED -> SUPERSEDED, and each of its ChannelDisclosureProfile rows in DEPLOYED, FLAGGED or REMEDIATED transitions to RETIRED", "property_disclosure_posture recomputes the property's published_fee_program_count, min_channel_disclosure_score, disclosure_posture and open_disclosure_obligation_count"]

  # --- channel disclosure profiles --------------------------------------------
  - method: POST
    path: "/channel-disclosure-profiles"
    description: "Create a DRAFT disclosure profile binding a PUBLISHED fee program to a channel for a property, with the three switches that govern what the guest sees at first quote. Requires expected_fee_program_version to match FeeProgram.version; on success FeeProgram.version is incremented by exactly 1. The deployment window is checked against the 24-hour cutover buffer at create time and again at deploy time."
    roles: [RevenueManager, ChannelOperator]
    code: 201
    input: [property_id, channel_id, fee_program_id, first_quote_shows_total, itemized_at_first_quote, disclosure_placement, deployed_from, deployed_to, expected_fee_program_version]
    output: ChannelDisclosureProfile
    side_effects: ["status set to DRAFT", "FeeProgram.version incremented by 1", "channel_disclosure_score computes disclosure_score", "confirmed_undisclosed_count 0, remediation_round 0"]

  - method: GET
    path: "/channel-disclosure-profiles/{id}"
    description: "Read one disclosure profile including its computed score and remediation round."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison, ChannelOperator, GuestServicesAgent]
    code: 200
    input: []
    output: ChannelDisclosureProfile
    side_effects: []

  - method: GET
    path: "/channel-disclosure-profiles"
    description: "List disclosure profiles, filterable by property, channel, fee program and lifecycle status."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison, ChannelOperator, GuestServicesAgent]
    code: 200
    input: ["property_id?", "channel_id?", "fee_program_id?", "status?", "limit?", "offset?"]
    output: ChannelDisclosureProfile[]
    side_effects: []

  - method: POST
    path: "/channel-disclosure-profiles/{id}/deploy"
    description: "Take a DRAFT profile live. Enforces the jurisdiction's total-price-display mandate and the cutover buffer against every other window on the same property and channel."
    roles: [ComplianceOfficer, ChannelOperator]
    code: 200
    input: []
    output: ChannelDisclosureProfile
    side_effects: ["status DRAFT -> DEPLOYED", "property_disclosure_posture recomputes min_channel_disclosure_score and disclosure_posture on the property"]

  - method: POST
    path: "/channel-disclosure-profiles/{id}/audit"
    description: "Compliance audit of a DEPLOYED profile. A profile whose recomputed disclosure_score is below DISCLOSURE_FLAG_THRESHOLD (60) is FLAGGED; a profile at or above it stays DEPLOYED with last_audited_at stamped."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ChannelDisclosureProfile
    side_effects: ["last_audited_at set to the logical clock", "conditional transition DEPLOYED -> FLAGGED when the recomputed score is below 60", "property_disclosure_posture recomputes the property's posture and open_disclosure_obligation_count"]

  - method: POST
    path: "/channel-disclosure-profiles/{id}/remediate"
    description: "Repair the booking path of a FLAGGED profile by restating its three disclosure switches. Increments remediation_round and rescores. Enforces the channel-capability and total-price-display rules against the NEW switch values."
    roles: [ChannelOperator, RevenueManager]
    code: 200
    input: [first_quote_shows_total, itemized_at_first_quote, disclosure_placement]
    output: ChannelDisclosureProfile
    side_effects: ["status FLAGGED -> REMEDIATED", "remediation_round incremented by 1", "channel_disclosure_score recomputes disclosure_score from the new switches", "property_disclosure_posture recomputes the property's posture"]

  - method: POST
    path: "/channel-disclosure-profiles/{id}/confirm-remediation"
    description: "Compliance sign-off returning a REMEDIATED profile to DEPLOYED. Requires the recomputed disclosure_score to be at or above DISCLOSURE_CONFIRM_THRESHOLD (80); a score of 79 cannot be confirmed and the profile must be remediated again, which is the cycle in this state machine."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ChannelDisclosureProfile
    side_effects: ["status REMEDIATED -> DEPLOYED", "property_disclosure_posture recomputes the property's posture and open_disclosure_obligation_count"]

  # --- bookings ----------------------------------------------------------------
  - method: POST
    path: "/bookings"
    description: "Quote and record a booking against a bookable disclosure profile. The profile's fee_program_id is PINNED onto the booking so later program supersession never re-prices a live stay. disclosed_fee_amounts is the channel's attestation of what the guest was actually shown, keyed by fee code; a code omitted from the map counts as wholly undisclosed."
    roles: [ChannelOperator, GuestServicesAgent]
    code: 201
    input: [property_id, channel_id, channel_disclosure_profile_id, arrival_date, nights, guests, room_rate_cents, "disclosed_fee_amounts?"]
    output: Booking
    side_effects: ["fee_program_id pinned from the profile", "booking_fee_subtotal per_night_rounding computes quoted_mandatory_fee_cents", "booking_quoted_total computes quoted_room_total_cents, quoted_tax_cents and quoted_total_cents", "quote_disclosure_gap computes quote_disclosure_gap_cents", "stay_status QUOTED, disclosure_status PENDING_AUDIT", "folio_fee_total_cents, folio_total_cents, quote_folio_variance_cents and guest_out_of_pocket_cents initialised to 0"]

  - method: GET
    path: "/bookings/{id}"
    description: "Read one booking including both the quoted figures and the folio-side figures, whose difference is quote_folio_variance_cents."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison, ChannelOperator, GuestServicesAgent, Guest]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/bookings"
    description: "List bookings, filterable by property, channel, disclosure profile, pinned fee program and either state dimension."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison, ChannelOperator, GuestServicesAgent, Guest]
    code: 200
    input: ["property_id?", "channel_id?", "channel_disclosure_profile_id?", "fee_program_id?", "stay_status?", "disclosure_status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: POST
    path: "/bookings/{id}/confirm"
    description: "Confirm a QUOTED booking. Independent of the disclosure_status dimension, which does not move."
    roles: [ChannelOperator, GuestServicesAgent]
    code: 200
    input: []
    output: Booking
    side_effects: ["stay_status QUOTED -> CONFIRMED"]

  - method: POST
    path: "/bookings/{id}/check-in"
    description: "Check a CONFIRMED booking in. Requires the logical clock to be at or after arrival_date. Creates the stay's OPEN folio, which is discoverable only through GET /bookings/{id}/folios."
    roles: [GuestServicesAgent]
    code: 200
    input: []
    output: Booking
    side_effects: ["stay_status CONFIRMED -> IN_HOUSE", "a Folio row is created in status OPEN with line_count 0 and all money fields 0"]

  - method: POST
    path: "/bookings/{id}/check-out"
    description: "Check an IN_HOUSE booking out. Requires the logical clock to be at or after arrival_date plus nights days."
    roles: [GuestServicesAgent]
    code: 200
    input: []
    output: Booking
    side_effects: ["stay_status IN_HOUSE -> CHECKED_OUT"]

  - method: GET
    path: "/bookings/{id}/folios"
    description: "List the folios of one booking. Exactly one folio exists per booking once check-in has occurred, and zero before; the array shape is uniform either way."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison, ChannelOperator, GuestServicesAgent, Guest]
    code: 200
    input: ["limit?", "offset?"]
    output: Folio[]
    side_effects: []

  # --- folios and folio lines --------------------------------------------------
  - method: GET
    path: "/folios/{id}"
    description: "Read one folio with its charge, credit and tax subtotals."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison, ChannelOperator, GuestServicesAgent, Guest]
    code: 200
    input: []
    output: Folio
    side_effects: []

  - method: GET
    path: "/folios"
    description: "List folios, filterable by booking and status."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison, ChannelOperator, GuestServicesAgent, Guest]
    code: 200
    input: ["booking_id?", "status?", "limit?", "offset?"]
    output: Folio[]
    side_effects: []

  - method: POST
    path: "/folios/{id}/itemize"
    description: "Generate the folio's itemised lines: one ROOM line then one MANDATORY_FEE line per mandatory fee of the pinned program, each with its own taxability determination and its own rounded tax. This is where the stay_aggregation variant is applied and where quote_folio_variance_cents is first observable."
    roles: [GuestServicesAgent]
    code: 200
    input: []
    output: Folio
    side_effects: ["status OPEN -> ITEMIZED, itemization_complete set true", "FolioLine rows created with contiguous sequence_no starting at 1", "folio_line_taxability determines each line's taxability_determination, tax_rate_bps and tax_cents", "booking_fee_subtotal stay_aggregation sets Booking.folio_fee_total_cents", "quote_variance_reconciliation sets the folio subtotals, Booking.folio_total_cents, Booking.guest_out_of_pocket_cents and Booking.quote_folio_variance_cents, and moves disclosure_status to DISPUTED when the absolute variance exceeds 100"]

  - method: POST
    path: "/folios/{id}/post"
    description: "Post an ITEMIZED or ADJUSTED folio to the ledger. Cross-entity precondition: the folio's booking must already be in stay_status CHECKED_OUT."
    roles: [GuestServicesAgent]
    code: 200
    input: []
    output: Folio
    side_effects: ["status ITEMIZED -> POSTED, or ADJUSTED -> POSTED", "posted_at set to the logical clock"]

  - method: POST
    path: "/folios/{id}/close"
    description: "Close a POSTED folio. Terminal. A folio in ADJUSTED must be re-posted first — the ADJUSTED to CLOSED edge does not exist, so an unposted adjustment can never be locked away."
    roles: [GuestServicesAgent]
    code: 200
    input: []
    output: Folio
    side_effects: ["status POSTED -> CLOSED", "guest_out_of_pocket_conservation is asserted a final time"]

  - method: GET
    path: "/folio-lines/{id}"
    description: "Read one immutable folio line, including its per-line taxability determination."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison, ChannelOperator, GuestServicesAgent, Guest]
    code: 200
    input: []
    output: FolioLine
    side_effects: []

  - method: GET
    path: "/folio-lines"
    description: "List folio lines, filterable by folio, originating fee, jurisdiction and line type. Ordered by folio_id then sequence_no ASC."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison, ChannelOperator, GuestServicesAgent, Guest]
    code: 200
    input: ["folio_id?", "fee_id?", "jurisdiction_id?", "line_type?", "limit?", "offset?"]
    output: FolioLine[]
    side_effects: []

  # --- opt-out requests --------------------------------------------------------
  - method: POST
    path: "/bookings/{id}/opt-out-requests"
    description: "Guest asks to avoid an avoidable fee. Enforces avoidability and the fee's opt_out_window_hours against the logical clock and the booking's arrival_date, and forbids a second live request for the same fee."
    roles: [Guest, GuestServicesAgent]
    code: 201
    input: [fee_id]
    output: OptOutRequest
    side_effects: ["status REQUESTED", "requested_hours_before_arrival recorded as the floored whole hours between the logical clock and arrival_date"]

  - method: GET
    path: "/opt-out-requests/{id}"
    description: "Read one opt-out request including its credit amounts once granted."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison, ChannelOperator, GuestServicesAgent, Guest]
    code: 200
    input: []
    output: OptOutRequest
    side_effects: []

  - method: GET
    path: "/opt-out-requests"
    description: "List opt-out requests, filterable by booking, fee and status."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison, ChannelOperator, GuestServicesAgent, Guest]
    code: 200
    input: ["booking_id?", "fee_id?", "status?", "limit?", "offset?"]
    output: OptOutRequest[]
    side_effects: []

  - method: POST
    path: "/opt-out-requests/{id}/grant"
    description: "Grant a REQUESTED opt-out. The folio must be POSTED or ADJUSTED so the reversal has something to reverse; a FEE_CREDIT line reversing the fee's stay-aggregated amount and its tax is appended."
    roles: [GuestServicesAgent]
    code: 200
    input: []
    output: OptOutRequest
    side_effects: ["status REQUESTED -> GRANTED, decided_at set to the logical clock", "opt_out_credit appends a FEE_CREDIT FolioLine and records credit_cents, tax_credit_cents and credit_line_sequence_no", "folio status POSTED -> ADJUSTED", "quote_variance_reconciliation re-derives the folio subtotals and Booking.guest_out_of_pocket_cents"]

  - method: POST
    path: "/opt-out-requests/{id}/deny"
    description: "Deny a REQUESTED opt-out with a coded reason. Terminal; no folio line is created."
    roles: [GuestServicesAgent]
    code: 200
    input: [denial_reason_code]
    output: OptOutRequest
    side_effects: ["status REQUESTED -> DENIED, decided_at set to the logical clock"]

  - method: POST
    path: "/opt-out-requests/{id}/revoke"
    description: "Revoke a GRANTED opt-out, for instance because the guest consumed the service after all. Appends the mirror FEE_REBILL line so the folio total returns to its pre-credit value exactly."
    roles: [GuestServicesAgent]
    code: 200
    input: []
    output: OptOutRequest
    side_effects: ["status GRANTED -> REVOKED", "a FEE_REBILL FolioLine mirroring the credit amount and tax is appended", "quote_variance_reconciliation re-derives the folio subtotals and Booking.guest_out_of_pocket_cents, which must return to its exact pre-grant value"]

  # --- guest complaints --------------------------------------------------------
  - method: POST
    path: "/bookings/{id}/guest-complaints"
    description: "Guest disputes a folio line as undisclosed or misstated. The line must belong to this booking and be a fee line, not the room line and not a credit."
    roles: [Guest, GuestServicesAgent]
    code: 201
    input: [folio_line_id, complaint_reason, narrative]
    output: GuestComplaint
    side_effects: ["status SUBMITTED", "refund_variant, disputed_amount_cents, disclosed_amount_cents and refund_entitlement_cents stay at their defaults (null, 0, 0, 0) — calculations.complaint_refund_entitlement runs only at substantiation", "property_disclosure_posture recomputes the property's open_disclosure_obligation_count"]

  - method: GET
    path: "/guest-complaints/{id}"
    description: "Read one complaint including its computed refund entitlement."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison, ChannelOperator, GuestServicesAgent, Guest]
    code: 200
    input: []
    output: GuestComplaint
    side_effects: []

  - method: GET
    path: "/guest-complaints"
    description: "List complaints, filterable by booking, folio line and status."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer, RegulatoryLiaison, ChannelOperator, GuestServicesAgent, Guest]
    code: 200
    input: ["booking_id?", "folio_line_id?", "status?", "refund_variant?", "limit?", "offset?"]
    output: GuestComplaint[]
    side_effects: []

  - method: POST
    path: "/guest-complaints/{id}/investigate"
    description: "Open the investigation on a SUBMITTED complaint and record who is investigating. The investigator's X-User-ID is what the segregation-of-duties check later compares against."
    roles: [ComplianceOfficer, GuestServicesAgent]
    code: 200
    input: []
    output: GuestComplaint
    side_effects: ["status SUBMITTED -> UNDER_INVESTIGATION", "investigated_by_user_id set from X-User-ID"]

  - method: POST
    path: "/guest-complaints/{id}/substantiate"
    description: "Uphold the complaint. The adjudicating X-User-ID must differ from investigated_by_user_id. Computes the refund entitlement under the variant selected by complaint_reason and drives the four-level disclosure cascade."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: GuestComplaint
    side_effects: ["status UNDER_INVESTIGATION -> SUBSTANTIATED", "adjudicated_by_user_id set from X-User-ID", "complaint_refund_entitlement computes refund_entitlement_cents", "Booking.disclosure_status -> UNDISCLOSED_CONFIRMED", "the booking's ChannelDisclosureProfile.confirmed_undisclosed_count is incremented by 1 and channel_disclosure_score rescores it", "when the rescored profile is DEPLOYED and falls below 60 it transitions DEPLOYED -> FLAGGED", "property_disclosure_posture recomputes posture, min_channel_disclosure_score, open_disclosure_obligation_count and aggregate_disclosure_gap_cents"]

  - method: POST
    path: "/guest-complaints/{id}/dismiss"
    description: "Reject the complaint with a coded reason. The adjudicating X-User-ID must differ from investigated_by_user_id. Terminal, and no cascade fires."
    roles: [ComplianceOfficer]
    code: 200
    input: [dismissal_reason_code]
    output: GuestComplaint
    side_effects: ["status UNDER_INVESTIGATION -> UNSUBSTANTIATED", "adjudicated_by_user_id set from X-User-ID", "Booking.disclosure_status -> DISCLOSED", "property_disclosure_posture recomputes open_disclosure_obligation_count"]

  - method: POST
    path: "/guest-complaints/{id}/refund"
    description: "Pay a SUBSTANTIATED complaint. refund_amount_cents may be any amount from 1 up to and including refund_entitlement_cents; one cent more is rejected. Appends a COMPLAINT_REFUND credit line."
    roles: [GuestServicesAgent]
    code: 200
    input: [refund_amount_cents]
    output: GuestComplaint
    side_effects: ["status SUBSTANTIATED -> REFUNDED", "refunded_amount_cents recorded", "a COMPLAINT_REFUND FolioLine is appended and the folio moves POSTED -> ADJUSTED", "Booking.disclosure_status -> CURED", "quote_variance_reconciliation re-derives the folio subtotals and Booking.guest_out_of_pocket_cents", "property_disclosure_posture recomputes open_disclosure_obligation_count and aggregate_disclosure_gap_cents, leaving the profile's confirmed_undisclosed_count untouched"]

  # --- regulator inquiries -----------------------------------------------------
  - method: POST
    path: "/regulator-inquiries"
    description: "Record an inbound regulator inquiry against a property, scoped to one or more channel types, with a response deadline. Computes the docket's monetary exposure from in-scope disputed and confirmed bookings."
    roles: [PlatformAdmin, RegulatoryLiaison]
    code: 201
    input: [jurisdiction_id, property_id, docket_number, channel_scope, response_due_at]
    output: RegulatorInquiry
    side_effects: ["status RECEIVED, remediation_round 0, flagged_profile_ids empty", "inquiry_exposure computes exposure_cents", "property_disclosure_posture recomputes open_disclosure_obligation_count"]

  - method: GET
    path: "/regulator-inquiries/{id}"
    description: "Read one regulator inquiry including its exposure and the profiles its docket has flagged."
    roles: [PlatformAdmin, ComplianceOfficer, RegulatoryLiaison]
    code: 200
    input: []
    output: RegulatorInquiry
    side_effects: []

  - method: GET
    path: "/regulator-inquiries"
    description: "List regulator inquiries, filterable by jurisdiction, property and status."
    roles: [PlatformAdmin, ComplianceOfficer, RegulatoryLiaison]
    code: 200
    input: ["jurisdiction_id?", "property_id?", "status?", "docket_number?", "limit?", "offset?"]
    output: RegulatorInquiry[]
    side_effects: []

  - method: POST
    path: "/regulator-inquiries/{id}/draft-response"
    description: "Draft the operator's response to a RECEIVED inquiry. Must land at or before response_due_at. Records the drafting X-User-ID for the later segregation-of-duties check."
    roles: [RegulatoryLiaison]
    code: 200
    input: [response_summary]
    output: RegulatorInquiry
    side_effects: ["status RECEIVED -> RESPONSE_DRAFTED", "drafted_by_user_id set from X-User-ID"]

  - method: POST
    path: "/regulator-inquiries/{id}/submit-response"
    description: "Submit the drafted response. The submitting X-User-ID must differ from drafted_by_user_id, and the deadline must not have passed."
    roles: [RegulatoryLiaison]
    code: 200
    input: []
    output: RegulatorInquiry
    side_effects: ["status RESPONSE_DRAFTED -> RESPONSE_SUBMITTED", "submitted_by_user_id set from X-User-ID", "inquiry_exposure recomputes exposure_cents"]

  - method: POST
    path: "/regulator-inquiries/{id}/require-remediation"
    description: "The regulator rejects the response and orders the booking paths repaired. Drives the deepest cascade in this API: the docket flags every in-scope live profile, which re-derives the property's posture, which disputes the property's still-unaudited bookings."
    roles: [PlatformAdmin]
    code: 200
    input: [remediation_directive]
    output: RegulatorInquiry
    side_effects: ["status RESPONSE_SUBMITTED -> REMEDIATION_REQUIRED, or REMEDIATION_SUBMITTED -> REMEDIATION_REQUIRED on a rejected round", "remediation_round incremented by 1", "every in-scope ChannelDisclosureProfile in DEPLOYED transitions DEPLOYED -> FLAGGED and its id is appended to flagged_profile_ids", "property_disclosure_posture recomputes min_channel_disclosure_score and disclosure_posture, which becomes NON_COMPLIANT because a FLAGGED profile contributes 0", "every Booking of the property in stay_status QUOTED and disclosure_status PENDING_AUDIT transitions to DISPUTED", "inquiry_exposure recomputes exposure_cents over the newly disputed bookings", "property_disclosure_posture recomputes open_disclosure_obligation_count and aggregate_disclosure_gap_cents"]

  - method: POST
    path: "/regulator-inquiries/{id}/submit-remediation"
    description: "Report the completed remediation back to the regulator. Every profile named in flagged_profile_ids must have left FLAGGED — that is, must now be REMEDIATED, DEPLOYED or RETIRED — or the submission is rejected as premature."
    roles: [RegulatoryLiaison]
    code: 200
    input: [remediation_summary]
    output: RegulatorInquiry
    side_effects: ["status REMEDIATION_REQUIRED -> REMEDIATION_SUBMITTED", "inquiry_exposure recomputes exposure_cents"]

  - method: POST
    path: "/regulator-inquiries/{id}/reject-remediation"
    description: "The regulator finds the remediation inadequate and sends the docket back for another round. This is the cycle in the inquiry state machine and it re-runs the flagging cascade."
    roles: [PlatformAdmin]
    code: 200
    input: [rejection_reason]
    output: RegulatorInquiry
    side_effects: ["status REMEDIATION_SUBMITTED -> REMEDIATION_REQUIRED", "remediation_round incremented by 1", "every in-scope DEPLOYED profile transitions DEPLOYED -> FLAGGED again", "property_disclosure_posture recomputes the property's posture and counters"]

  - method: POST
    path: "/regulator-inquiries/{id}/accept"
    description: "The regulator accepts the remediation and closes the docket. Terminal."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RegulatorInquiry
    side_effects: ["status REMEDIATION_SUBMITTED -> ACCEPTED, or RESPONSE_SUBMITTED -> ACCEPTED when no remediation was ever ordered", "property_disclosure_posture decrements open_disclosure_obligation_count by 1 for the closed docket"]

  - method: POST
    path: "/regulator-inquiries/{id}/withdraw"
    description: "The regulator withdraws the docket. Compensating transition: every profile the docket itself flagged and that is still FLAGGED returns to DEPLOYED, and the property's posture is re-derived from the restored scores, with no drift."
    roles: [PlatformAdmin]
    code: 200
    input: [withdrawal_reason]
    output: RegulatorInquiry
    side_effects: ["status RECEIVED, RESPONSE_DRAFTED, RESPONSE_SUBMITTED, REMEDIATION_REQUIRED or REMEDIATION_SUBMITTED -> WITHDRAWN", "every profile in flagged_profile_ids still in FLAGGED transitions FLAGGED -> DEPLOYED", "property_disclosure_posture recomputes min_channel_disclosure_score, disclosure_posture and open_disclosure_obligation_count, which must return to their pre-require-remediation values when nothing else changed"]

  # --- revenue impact models ---------------------------------------------------
  - method: POST
    path: "/revenue-impact-models"
    description: "Model the effect of rolling named mandatory fees into the room rate, under the RATE_PARITY or TAX_ABSORBED variant. Immutable once created; a different assumption means a new model. Both the baseline and the modelled side are computed in the pinned six-step order."
    roles: [RevenueManager, ComplianceOfficer]
    code: 201
    input: [property_id, fee_program_id, scenario, variant, roll_in_fee_codes]
    output: RevenueImpactModel
    side_effects: ["revenue_impact_roll_in computes all baseline_*, applied_commission_bps, all modeled_* and all modeled_*_delta_cents fields"]

  - method: GET
    path: "/revenue-impact-models/{id}"
    description: "Read one revenue impact model with its baseline, modelled and delta figures."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer]
    code: 200
    input: []
    output: RevenueImpactModel
    side_effects: []

  - method: GET
    path: "/revenue-impact-models"
    description: "List revenue impact models, filterable by property, fee program, scenario and variant."
    roles: [PlatformAdmin, RevenueManager, ComplianceOfficer]
    code: 200
    input: ["property_id?", "fee_program_id?", "scenario?", "variant?", "limit?", "offset?"]
    output: RevenueImpactModel[]
    side_effects: []

# -----------------------------------------------------------------------------
# 1.6 Error Code Catalog
#
# Every code below is triggerable by at least one endpoint declared in §1.5.
# Grouped: authentication and authorization, not-found, concurrency, state,
# safety and compliance, referential, uniqueness, temporal, fiscal.
# -----------------------------------------------------------------------------
errors:

  # --- authentication and authorization ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty on any endpoint other than GET /_clock"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the seven roles in §1.7"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_CHANNEL_OWNERSHIP_REQUIRED
    http: 403
    condition: "a ChannelOperator addresses a channel, disclosure profile or booking whose channel_id differs from X-User-ID, or whose X-User-ID is not an existing Channel.id"
  - id: ERR_BOOKING_OWNERSHIP_REQUIRED
    http: 403
    condition: "a Guest addresses a booking, folio, folio line, opt-out request or complaint that does not resolve to the Booking.id in X-User-ID, or whose X-User-ID is not an existing Booking.id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID equals the recorded authored_by_user_id at publish, investigated_by_user_id at substantiate or dismiss, or drafted_by_user_id at submit-response"

  # --- not found ---------------------------------------------------------------
  - id: ERR_JURISDICTION_NOT_FOUND
    http: 404
    condition: "no Jurisdiction with the given id, in the path or in a request body"
  - id: ERR_TAXABILITY_RULE_NOT_FOUND
    http: 404
    condition: "no TaxabilityRule with the given id"
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "no Property with the given id, in the path or in a request body"
  - id: ERR_CHANNEL_NOT_FOUND
    http: 404
    condition: "no Channel with the given id, in the path or in a request body"
  - id: ERR_FEE_PROGRAM_NOT_FOUND
    http: 404
    condition: "no FeeProgram with the given id, including supersedes_program_id"
  - id: ERR_FEE_NOT_FOUND
    http: 404
    condition: "no Fee with the given id, in the path or as fee_id in a body"
  - id: ERR_PROFILE_NOT_FOUND
    http: 404
    condition: "no ChannelDisclosureProfile with the given id"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "no Booking with the given id"
  - id: ERR_FOLIO_NOT_FOUND
    http: 404
    condition: "no Folio with the given id"
  - id: ERR_FOLIO_LINE_NOT_FOUND
    http: 404
    condition: "no FolioLine with the given id, in the path or as folio_line_id in a body"
  - id: ERR_OPT_OUT_REQUEST_NOT_FOUND
    http: 404
    condition: "no OptOutRequest with the given id"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "no GuestComplaint with the given id"
  - id: ERR_INQUIRY_NOT_FOUND
    http: 404
    condition: "no RegulatorInquiry with the given id"
  - id: ERR_REVENUE_MODEL_NOT_FOUND
    http: 404
    condition: "no RevenueImpactModel with the given id"

  # --- request shape -----------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "a required input field is missing or null, an enum value is not a declared literal, a numeric field is out of range, a date ordering is wrong, or a basis-conditional field pairing is violated (see §1.4 priority 7)"

  # --- optimistic concurrency --------------------------------------------------
  - id: ERR_STALE_PROPERTY_VERSION
    http: 412
    condition: "expected_property_version on POST /fee-programs does not equal the current Property.version"
  - id: ERR_STALE_FEE_PROGRAM_VERSION
    http: 412
    condition: "expected_fee_program_version on POST /channel-disclosure-profiles does not equal the current FeeProgram.version"

  # --- state -------------------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the addressed entity's current status does not admit the requested transition, including any attempt to leave a terminal state and the forbidden Folio ADJUSTED -> CLOSED edge"
  - id: ERR_FOLIO_NOT_ADJUSTABLE
    http: 409
    condition: "a credit, rebill or refund line is requested against a folio that is not POSTED or ADJUSTED"
  - id: ERR_FEE_PROGRAM_NOT_PUBLISHED
    http: 409
    condition: "a disclosure profile or a revenue impact model references a fee program that is not in status PUBLISHED"
  - id: ERR_PROFILE_NOT_BOOKABLE
    http: 409
    condition: "a booking references a disclosure profile that is not DEPLOYED or REMEDIATED"
  - id: ERR_PROPERTY_NOT_ACTIVE
    http: 409
    condition: "the referenced property's status is SUSPENDED"
  - id: ERR_PROPERTY_DISCLOSURE_FROZEN
    http: 409
    condition: "a fee program publish is attempted while the property's disclosure_posture is NON_COMPLIANT"
  - id: ERR_BOOKING_NOT_CHECKED_OUT
    http: 409
    condition: "a folio post is attempted while its booking's stay_status is not CHECKED_OUT"
  - id: ERR_REMEDIATION_SCORE_INSUFFICIENT
    http: 409
    condition: "confirm-remediation is attempted while the profile's recomputed disclosure_score is below 80"
  - id: ERR_REMEDIATION_INCOMPLETE
    http: 409
    condition: "submit-remediation is attempted while at least one profile in flagged_profile_ids is still FLAGGED"
  - id: ERR_FEE_PROGRAM_EMPTY
    http: 409
    condition: "submit-review is attempted on a fee program with no fees"

  # --- safety and compliance ---------------------------------------------------
  - id: ERR_MANDATORY_FEE_BANNED_IN_JURISDICTION
    http: 422
    condition: "a program containing a MANDATORY fee is published into a jurisdiction whose mandatory_fee_ban is true"
  - id: ERR_TOTAL_PRICE_DISPLAY_REQUIRED
    http: 422
    condition: "a profile without first_quote_shows_total is deployed or remediated, or is used for a booking, in a jurisdiction whose first_quote_total_required is true"
  - id: ERR_CHANNEL_CAPABILITY_MISMATCH
    http: 422
    condition: "a profile claims first_quote_shows_total on a channel that cannot display totals, or itemized_at_first_quote on a channel that cannot itemise"

  # --- referential -------------------------------------------------------------
  - id: ERR_MANDATORY_FEE_WITHOUT_INCLUSION
    http: 422
    condition: "a program is published while some MANDATORY fee has no FeeInclusion with included_value_cents greater than 0"
  - id: ERR_TAXABILITY_RULE_MISSING
    http: 422
    condition: "no TaxabilityRule exists for (jurisdiction, fee code) for some MANDATORY fee, at publish time or at booking time"
  - id: ERR_FEE_NOT_ON_BOOKING_PROGRAM
    http: 422
    condition: "an opt-out request names a fee that does not belong to the booking's pinned fee program"
  - id: ERR_FOLIO_LINE_NOT_ON_BOOKING
    http: 422
    condition: "a complaint names a folio line that belongs to another booking, or whose line_type is not MANDATORY_FEE or OPTIONAL_FEE"
  - id: ERR_FEE_LINE_NOT_ON_FOLIO
    http: 422
    condition: "an opt-out grant finds no MANDATORY_FEE line for the fee, or a revoke finds no FEE_CREDIT line at credit_line_sequence_no"
  - id: ERR_ROLL_IN_FEE_NOT_MANDATORY
    http: 422
    condition: "roll_in_fee_codes names a code that is not a MANDATORY fee of the referenced program"

  # --- uniqueness --------------------------------------------------------------
  - id: ERR_DUPLICATE_FEE_CODE
    http: 409
    condition: "a second Fee with the same code is added to one fee program"
  - id: ERR_DUPLICATE_JURISDICTION_CODE
    http: 409
    condition: "a second Jurisdiction with the same code is created"
  - id: ERR_DUPLICATE_TAXABILITY_RULE
    http: 409
    condition: "a second TaxabilityRule for the same (jurisdiction_id, fee_code) is created"
  - id: ERR_DUPLICATE_DOCKET_NUMBER
    http: 409
    condition: "a second RegulatorInquiry with the same docket_number is created"
  - id: ERR_DUPLICATE_INCLUSION_CODE
    http: 409
    condition: "a second FeeInclusion with the same service_code is added to one fee"
  - id: ERR_DUPLICATE_OPT_OUT
    http: 409
    condition: "an opt-out request is made while another request for the same (booking_id, fee_id) is REQUESTED or GRANTED"

  # --- temporal ----------------------------------------------------------------
  - id: ERR_FEE_PROGRAM_PERIOD_OVERLAP
    http: 409
    condition: "the published program's half-open [effective_from, effective_to) interval overlaps another PUBLISHED program of the same property; touching endpoints do not overlap"
  - id: ERR_CUTOVER_BUFFER_VIOLATION
    http: 409
    condition: "the profile's closed deployment window is within 24 hours of another window on the same (property_id, channel_id); a gap of exactly 24 hours is legal"
  - id: ERR_EFFECTIVE_FROM_IN_PAST
    http: 422
    condition: "a fee program is published with effective_from strictly before the current logical clock"
  - id: ERR_OPT_OUT_WINDOW_CLOSED
    http: 422
    condition: "the floored whole hours between the logical clock and arrival_date is less than the fee's opt_out_window_hours"
  - id: ERR_RESPONSE_WINDOW_EXPIRED
    http: 409
    condition: "an inquiry response is drafted or submitted after response_due_at"
  - id: ERR_ARRIVAL_NOT_REACHED
    http: 409
    condition: "check-in is attempted before the booking's arrival_date"
  - id: ERR_DEPARTURE_NOT_REACHED
    http: 409
    condition: "check-out is attempted before arrival_date plus nights days"

  # --- constraint and fiscal ---------------------------------------------------
  - id: ERR_FEE_NOT_AVOIDABLE
    http: 422
    condition: "an opt-out request names a fee whose avoidable is false, or whose classification is OPTIONAL"
  - id: ERR_ROLL_IN_SCENARIO_MISMATCH
    http: 422
    condition: "roll_in_fee_codes does not match the declared scenario: non-empty for STATUS_QUO, incomplete for FULL_ROLL_IN, or empty or complete for PARTIAL_ROLL_IN"
  - id: ERR_INQUIRY_SCOPE_EMPTY
    http: 422
    condition: "channel_scope is an empty array or contains a value that is not a channel_type literal"
  - id: ERR_NO_REFUND_ENTITLEMENT
    http: 422
    condition: "a refund is attempted on a substantiated complaint whose refund_entitlement_cents is 0"
  - id: ERR_REFUND_EXCEEDS_ENTITLEMENT
    http: 422
    condition: "refund_amount_cents is strictly greater than refund_entitlement_cents"

# -----------------------------------------------------------------------------
# 1.7 RBAC Matrix
#
# role_model: segregation_of_duties. Two entity-backed roles (ChannelOperator,
# Guest) carry ownership scoping; five roles are opaque operator identities.
# Three duty separations are enforced on X-User-ID rather than on role, so the
# same human cannot author and attest a fee program, cannot investigate and
# adjudicate a complaint, and cannot draft and submit a regulator response.
# -----------------------------------------------------------------------------
roles:

  - name: PlatformAdmin
    description: "Operator of the multi-property platform. Owns the reference data every property depends on (jurisdictions, channels, properties) and stands in for the regulator's own actions on a docket."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /jurisdictions"
      - "POST /properties"
      - "POST /channels"
      - "POST /regulator-inquiries/{id}/require-remediation"
      - "POST /regulator-inquiries/{id}/reject-remediation"
      - "POST /regulator-inquiries/{id}/accept"
      - "POST /regulator-inquiries/{id}/withdraw"
    shared_operations:
      - "POST /taxability-rules (with ComplianceOfficer)"
      - "POST /regulator-inquiries (with RegulatoryLiaison)"
      - "all GET endpoints except the Guest-scoped reads"

  - name: RevenueManager
    description: "Authors fee programs, fees and inclusion analysis, configures disclosure profiles, repairs flagged booking paths and runs roll-in revenue models. Cannot attest to its own program."
    identity: "opaque"
    exclusive_operations:
      - "POST /revenue-impact-models (with ComplianceOfficer)"
    shared_operations:
      - "POST /fee-programs (with ComplianceOfficer)"
      - "POST /fee-programs/{id}/fees (with ComplianceOfficer)"
      - "POST /fees/{id}/inclusions (with ComplianceOfficer)"
      - "POST /fee-programs/{id}/submit-review (with ComplianceOfficer)"
      - "POST /channel-disclosure-profiles (with ChannelOperator)"
      - "POST /channel-disclosure-profiles/{id}/remediate (with ChannelOperator)"
      - "GET endpoints for configuration, bookings, folios, complaints and revenue models"

  - name: ComplianceOfficer
    description: "Attests fee programs, audits deployed disclosure profiles, confirms remediations and adjudicates guest complaints. May also author a program, which is precisely what makes the segregation-of-duties check on publish reachable."
    identity: "opaque"
    exclusive_operations:
      - "POST /fee-programs/{id}/publish"
      - "POST /channel-disclosure-profiles/{id}/audit"
      - "POST /channel-disclosure-profiles/{id}/confirm-remediation"
      - "POST /guest-complaints/{id}/substantiate"
      - "POST /guest-complaints/{id}/dismiss"
    shared_operations:
      - "POST /taxability-rules (with PlatformAdmin)"
      - "POST /fee-programs, POST /fee-programs/{id}/fees, POST /fees/{id}/inclusions, POST /fee-programs/{id}/submit-review (with RevenueManager)"
      - "POST /channel-disclosure-profiles/{id}/deploy (with ChannelOperator)"
      - "POST /guest-complaints/{id}/investigate (with GuestServicesAgent)"
      - "POST /revenue-impact-models (with RevenueManager)"
      - "GET endpoints including the regulator-inquiry reads"

  - name: RegulatoryLiaison
    description: "Handles the operator's side of a regulator docket: records the inquiry, drafts and submits the response, and reports remediation. Cannot itself grant or reject the regulator's decision, and cannot both draft and submit one response."
    identity: "opaque"
    exclusive_operations:
      - "POST /regulator-inquiries/{id}/draft-response"
      - "POST /regulator-inquiries/{id}/submit-response"
      - "POST /regulator-inquiries/{id}/submit-remediation"
    shared_operations:
      - "POST /regulator-inquiries (with PlatformAdmin)"
      - "GET endpoints including the regulator-inquiry reads"

  - name: ChannelOperator
    description: "A booking channel acting on its own behalf. X-User-ID is the Channel.id, and every disclosure profile, booking or channel it touches must carry that channel_id."
    identity: "entity_backed:Channel"
    exclusive_operations: []
    shared_operations:
      - "POST /channel-disclosure-profiles (with RevenueManager)"
      - "POST /channel-disclosure-profiles/{id}/deploy (with ComplianceOfficer)"
      - "POST /channel-disclosure-profiles/{id}/remediate (with RevenueManager)"
      - "POST /bookings and POST /bookings/{id}/confirm (with GuestServicesAgent)"
      - "GET endpoints for its own profiles and bookings, plus configuration reads"

  - name: GuestServicesAgent
    description: "Front-desk and folio operations: check-in, check-out, itemisation, posting, closing, opt-out decisions and refund payment. Never adjudicates a complaint and never attests a program."
    identity: "opaque"
    exclusive_operations:
      - "POST /bookings/{id}/check-in"
      - "POST /bookings/{id}/check-out"
      - "POST /folios/{id}/itemize"
      - "POST /folios/{id}/post"
      - "POST /folios/{id}/close"
      - "POST /opt-out-requests/{id}/grant"
      - "POST /opt-out-requests/{id}/deny"
      - "POST /opt-out-requests/{id}/revoke"
      - "POST /guest-complaints/{id}/refund"
    shared_operations:
      - "POST /bookings and POST /bookings/{id}/confirm (with ChannelOperator)"
      - "POST /bookings/{id}/opt-out-requests and POST /bookings/{id}/guest-complaints (with Guest)"
      - "POST /guest-complaints/{id}/investigate (with ComplianceOfficer)"
      - "GET endpoints for configuration, bookings, folios, folio lines, opt-outs and complaints"

  - name: Guest
    description: "The staying guest. X-User-ID is the Booking.id, so a guest can read only its own booking, folio, folio lines, opt-out requests and complaints, and can act only on those. Has no access to fee-program configuration, disclosure profiles, regulator dockets or revenue models."
    identity: "entity_backed:Booking"
    exclusive_operations: []
    shared_operations:
      - "POST /bookings/{id}/opt-out-requests (with GuestServicesAgent)"
      - "POST /bookings/{id}/guest-complaints (with GuestServicesAgent)"
      - "GET /bookings/{id}, GET /bookings, GET /bookings/{id}/folios, GET /folios/{id}, GET /folios, GET /folio-lines/{id}, GET /folio-lines, GET /opt-out-requests/{id}, GET /opt-out-requests, GET /guest-complaints/{id}, GET /guest-complaints, GET /fees/{id}, GET /fees, GET /fees/{id}/inclusions, GET /_clock"
