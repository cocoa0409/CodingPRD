          assert:
            - "first report Q3-2026 -> 201 (gap check vacuous with zero predecessors)"
            - "contiguous Q4-2026 -> 201"
            - "start 2027-02-01 (one month after latest period_end 2027-01-01) -> 409 ERR_PERIOD_GAP"
