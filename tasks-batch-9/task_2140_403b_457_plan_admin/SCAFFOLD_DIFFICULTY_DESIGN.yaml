  - rule_id: resource_temporal_overlap
    instances:

      - name: remittance_pay_period_half_open_adjacency_admitted
        grounds:
          - validations[priority=30]
          - errors[ERR_REMITTANCE_PERIOD_OVERLAP]
          - entities.RemittanceBatch.fields.pay_period_end
          - endpoints[POST /plan-admin/remittance-batches]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [start, end) on the Plan payroll calendar. Two
          batches that merely abut (2026-07-16 is one batch's exclusive end and the next
          batch's inclusive start) are both admitted, while a batch starting 2026-07-15
          intersects the first and is rejected with ERR_REMITTANCE_PERIOD_OVERLAP.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A PUBLIC_SCHOOL employer with an ACTIVE PLAN_403B plan and one participant holding one contract."
            - "No remittance batch exists yet on the plan."
          setup_api_calls:
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
