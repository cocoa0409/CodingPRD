              as: PlatformAdmin
              as_user_id: "u-adm-1"
            - call: "POST /correspondent/products/${p_grid}/pricing-adjustments"
              payload: { adjustment_code: "LLPA-F740-L90", fico_min: 740, fico_max: 779, ltv_min_pct: 85.0, ltv_max_pct: 90.0, price_adjustment_bps: -15 }
