              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { agr_e: "$.data.id" }
            - call: "POST /agreements/${agr_e}/policies"
              payload: { insurer_id: "${insurer_1}", policy_number: "MC-E-9101", gross_premium_cents: 600000, effective_date: "2026-09-01", expiration_date: "2027-09-01", min_earned_days: 0, fully_earned: false }
