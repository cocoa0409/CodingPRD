# ============================================================================
# SCAFFOLD.yaml — Faith-Based and Nonprofit Institution Lending
# §1.0 Response Envelope · §1.1 Entities · §1.2 State Machines
# §1.2.1 Concurrency Rules · §1.3 Calculations · §1.4 Validations
# §1.5 Endpoints · §1.6 Errors · §1.7 RBAC
# ============================================================================

scenario: |
  2760. Faith-Based and Nonprofit Institution Lending (church and nonprofit lender): borrower analysis on donations, membership trends and pledge campaigns instead of conventional cash flow, governance verification of authority to borrow under bylaws and denominational approval, special-purpose collateral valuation with limited alternative use, debt service coverage covenants tied to unrestricted giving, capital campaign pledge financing with pledge attrition assumptions, construction draw administration for sanctuary and school projects, workout options recognizing mission and community impact, restricted endowment and donor-restricted asset exclusion

domain_name: faith-based-institution-lending

# Flat topology: every collection is a root-level peer; children carry FK fields
# in the request body instead of being nested in the URL path.
api_prefix: ""

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # 11 peer collections linked by FK fields; no nesting in URL paths.

  state_machine_shape: cyclic
  # LoanApplication (UNDERWRITING -> COMMITTEE_REVIEW -> REVISION_REQUESTED ->
  # UNDERWRITING), Covenant (COMPLIANT <-> BREACH_PENDING_CURE), Pledge
  # (ACTIVE <-> LAPSED), GovernanceAuthorization (DENOM_REJECTED -> DRAFT),
  # DrawRequest (APPROVED <-> SUSPENDED) are cyclic; Loan carries two
  # independent state dimensions (servicing_status x risk_posture).

  relationship_patterns:
    - one_to_many          # Institution -> GivingPeriod / PledgeCampaign / CollateralAsset
    - self_referential     # WorkoutPlan.predecessor_workout_plan_id -> WorkoutPlan.id
    - cross_aggregate      # CollateralAsset.assigned_loan_application_id crosses aggregates
    - polymorphic: false

  role_model: segregation_of_duties
  # The CreditAnalyst who prepares underwriting (LoanApplication.prepared_by_user_id)
  # is barred from rendering the committee decision; governance verification is
  # reserved to GovernanceOfficer; covenant waivers to CreditCommitteeMember.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 11 entities · 60 endpoints · 52 error codes · 9 calculations (2 with variants)
  # · 9 state-machine blocks over 8 entities (Loan carries two independent
  # dimensions), of which 4 are cyclic and 1 is compound

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================

entities:
  - name: Institution
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered legal name of the borrowing congregation, school or ministry
      - name: institution_type
        type: enum
        source: input
        description: borrower class; drives no calculation branch by itself but is reported on the underwriting summary
        constraints: "one of CONGREGATION | SCHOOL | DENOMINATIONAL_AGENCY | NONPROFIT_MINISTRY"
      - name: denomination_code
        type: string
        source: input
        description: denominational affiliation code (e.g. PCA, ELCA, SBC, INDEPENDENT)
      - name: requires_denominational_approval
        type: boolean
        source: input
        default: false
        description: when true, GovernanceAuthorization must clear a denominational decision before reaching AUTHORIZED
      - name: bylaws_borrowing_cap_cents
        type: integer
        source: input
        description: maximum aggregate borrowing the bylaws permit, in cents
        constraints: "> 0"
      - name: bylaws_quorum_pct
        type: number
        source: input
        description: fraction of the total board vote required for a valid borrowing resolution
        constraints: "> 0 and <= 1, four decimal places"
      - name: community_program_count
        type: integer
        source: input
        default: 0
        description: count of ongoing community programs (food pantry, tutoring, shelter); feeds mission_impact_score
        constraints: ">= 0"
      - name: endowment_market_value_cents
        type: integer
        source: input
        default: 0
        description: donor-restricted endowment market value; recorded for disclosure ONLY and is never an input to any calculation in §1.3
        constraints: ">= 0"
      - name: audited_period_count
        type: integer
        source: computed
        description: count of GivingPeriod rows for this institution whose source == AUDITED
      - name: period_count
        type: integer
        source: computed
        description: count of all GivingPeriod rows for this institution regardless of source
      - name: unrestricted_giving_base_cents
        type: integer
        source: computed
        description: output of calculations.institution_unrestricted_giving_base under the mandated basis; 0 when period_count < 4
      - name: net_available_for_debt_service_dollars
        type: integer
        source: computed
        description: output of calculations.net_available_for_debt_service_dollars under the mandated basis; 0 when period_count < 4
      - name: membership_trend_pct
        type: number
        source: computed
        description: fractional change in member_household_count across the four-period window, four decimal places
      - name: cumulative_forgiveness_cents
        type: integer
        source: system
        default: 0
        description: running total of principal forgiven through approved PARTIAL_FORGIVENESS workout plans

  - name: GivingPeriod
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: institution_id
        type: string
        source: input
        description: FK -> Institution.id; the congregation whose fiscal period this row reports
      - name: period_label
        type: string
        source: input
        description: human label for the fiscal period (e.g. "2025Q3")
      - name: period_start
        type: datetime
        source: input
        description: inclusive first instant of the period, ISO 8601 UTC at midnight
      - name: period_end
        type: datetime
        source: input
        description: inclusive last instant of the period, ISO 8601 UTC at midnight; intervals are CLOSED on both ends
      - name: source
        type: enum
        source: input
        description: provenance of the figures
        constraints: "one of AUDITED | INTERNAL"
      - name: total_contributions_cents
        type: integer
        source: input
        description: all contributions received in the period, in cents
        constraints: ">= 0"
      - name: restricted_contributions_cents
        type: integer
        source: input
        description: donor-restricted contributions received in the period; excluded from every lending calculation
        constraints: ">= 0"
      - name: donor_restricted_endowment_draw_cents
        type: integer
        source: input
        description: draw taken from donor-restricted endowment during the period; excluded from every lending calculation
        constraints: ">= 0"
      - name: operating_expense_cents
        type: integer
        source: input
        description: operating expenses excluding debt service, in cents
        constraints: ">= 0"
      - name: member_household_count
        type: integer
        source: input
        description: giving households of record at period_end
        constraints: ">= 0"
      - name: unrestricted_contributions_cents
        type: integer
        source: computed
        description: "max(0, total_contributions_cents - restricted_contributions_cents - donor_restricted_endowment_draw_cents)"
      - name: net_available_for_debt_service_cents
        type: integer
        source: computed
        description: "max(0, unrestricted_contributions_cents - operating_expense_cents)"

  - name: GovernanceAuthorization
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: institution_id
        type: string
        source: input
        description: FK -> Institution.id; the institution whose board adopted the borrowing resolution
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: governance packet lifecycle state
        constraints: "one of DRAFT | SUBMITTED | BOARD_VERIFIED | AUTHORIZED | DENOM_REJECTED"
      - name: resolution_date
        type: datetime
        source: input
        description: date the board adopted the borrowing resolution, ISO 8601 UTC
      - name: bylaws_citation
        type: string
        source: input
        description: article/section of the bylaws conferring authority to borrow
      - name: board_votes_for
        type: integer
        source: input
        description: affirmative votes recorded in the resolution minutes
        constraints: ">= 0"
      - name: board_votes_total
        type: integer
        source: input
        description: total seated board votes at the time of the resolution
        constraints: "> 0"
      - name: authorized_amount_cents
        type: integer
        source: input
        description: maximum principal the resolution authorizes, in cents
        constraints: "> 0"
      - name: denominational_body
        type: string
        source: input
        description: name of the presbytery/synod/conference that must approve; nullable when the institution needs no denominational approval
      - name: denominational_decision_note
        type: string
        source: system
        description: free text captured with the denominational decision; null until a decision is recorded
      - name: expires_on
        type: datetime
        source: input
        description: instant after which the authorization no longer supports a committee referral, ISO 8601 UTC
      - name: board_quorum_pct
        type: number
        source: computed
        description: "round_half_up(board_votes_for / board_votes_total, 4)"
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the GovernanceOfficer who recorded board verification; null before verification
      - name: revision_round
        type: integer
        source: system
        default: 0
        description: number of times the packet has been returned to DRAFT after a denominational rejection

  - name: PledgeCampaign
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: institution_id
        type: string
        source: input
        description: FK -> Institution.id; sponsor of the capital campaign
      - name: campaign_name
        type: string
        source: input
        description: campaign name as printed on pledge cards
      - name: goal_cents
        type: integer
        source: input
        description: announced campaign goal, in cents
        constraints: "> 0"
      - name: pledge_period_months
        type: integer
        source: input
        description: length of the pledge fulfilment window in months
        constraints: "> 0"
      - name: sponsor_collection_rate_bps
        type: integer
        source: input
        description: the sponsor's own historical collection rate in basis points; used ONLY by the SPONSOR_OPTIMISTIC valuation variant
        constraints: "0 <= value <= 10000"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: campaign lifecycle state
        constraints: "one of OPEN | UNDERPERFORMING | CLOSED"
      - name: total_pledged_cents
        type: integer
        source: computed
        description: sum of Pledge.pledged_amount_cents over ALL pledges of this campaign regardless of status
      - name: active_pledged_cents
        type: integer
        source: computed
        description: sum of Pledge.pledged_amount_cents over pledges with status == ACTIVE
      - name: lapsed_pledged_cents
        type: integer
        source: computed
        description: sum of Pledge.pledged_amount_cents over pledges with status == LAPSED
      - name: fulfilled_pledged_cents
        type: integer
        source: computed
        description: sum of Pledge.pledged_amount_cents over pledges with status == FULFILLED
      - name: collected_to_date_cents
        type: integer
        source: computed
        description: sum of Pledge.collected_cents over ALL pledges of this campaign regardless of status
      - name: attrition_adjusted_value_cents
        type: integer
        source: computed
        description: output of calculations.pledge_campaign_projected_value under the LENDER_CONSERVATIVE variant
      - name: sponsor_projected_value_cents
        type: integer
        source: computed
        description: output of calculations.pledge_campaign_projected_value under the SPONSOR_OPTIMISTIC variant

  - name: Pledge
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: pledge_campaign_id
        type: string
        source: input
        description: FK -> PledgeCampaign.id; campaign this pledge belongs to
      - name: donor_tier
        type: enum
        source: input
        description: donor band that fixes the base attrition rate
        constraints: "one of LEAD | MAJOR | GENERAL"
      - name: pledged_amount_cents
        type: integer
        source: input
        description: total amount pledged over the campaign period, in cents
        constraints: "> 0"
      - name: installment_count
        type: integer
        source: input
        description: number of installments the donor committed to
        constraints: "> 0"
      - name: collected_cents
        type: integer
        source: computed
        default: 0
        description: sum of PAID installment amounts recorded against this pledge
      - name: payments_made_count
        type: integer
        source: computed
        default: 0
        description: count of installments recorded with outcome PAID
      - name: missed_payments_count
        type: integer
        source: computed
        default: 0
        description: count of installments recorded with outcome MISSED
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: pledge lifecycle state
        constraints: "one of ACTIVE | FULFILLED | LAPSED"
      - name: lapse_reason
        type: string
        source: system
        description: reason recorded when the pledge lapsed; null while never lapsed, cleared on reinstatement
      - name: effective_attrition_pct
        type: number
        source: computed
        description: "min(0.60, tier rate + MISSED_PAYMENT_PENALTY_PCT when missed_payments_count >= 2), four decimal places"

  - name: CollateralAsset
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: institution_id
        type: string
        source: input
        description: FK -> Institution.id; owner of the special-purpose property
      - name: asset_type
        type: enum
        source: input
        description: property class; fixes the advance-rate cap and, for DONOR_RESTRICTED_ENDOWMENT, bars assignment outright
        constraints: "one of SANCTUARY | EDUCATION_WING | PARSONAGE | LAND | FELLOWSHIP_HALL | DONOR_RESTRICTED_ENDOWMENT"
      - name: description_label
        type: string
        source: input
        description: short description of the parcel or structure
      - name: appraised_value_cents
        type: integer
        source: input
        description: appraised fair value in cents as of appraisal_date
        constraints: "> 0"
      - name: appraisal_date
        type: datetime
        source: input
        description: date of the appraisal report, ISO 8601 UTC
      - name: alternative_use_score
        type: integer
        source: input
        description: 1 = single-purpose sanctuary with no alternative use, 5 = readily convertible to commercial use
        constraints: "integer 1..5"
      - name: assigned_loan_application_id
        type: string
        source: system
        description: FK -> LoanApplication.id; application currently holding the lien, null when unassigned
      - name: lien_position
        type: integer
        source: system
        description: lien rank of the current assignment (1 = first lien); null when unassigned
      - name: lien_effective_from
        type: datetime
        source: system
        description: inclusive start of the current lien occupation window; null when unassigned
      - name: lien_effective_to
        type: datetime
        source: system
        description: EXCLUSIVE end of the current lien occupation window; null when unassigned
      - name: lien_history
        type: array
        source: system
        default: []
        description: "append-only list of released occupations, each { loan_application_id, lien_position, effective_from, effective_to, released_at }, ordered by released_at ASC"
      - name: lending_value_cents
        type: integer
        source: computed
        description: output of calculations.collateral_special_purpose_lending_value; recomputed on create and on every assignment
      - name: appraisal_age_days
        type: integer
        source: computed
        description: whole days from appraisal_date to the logical clock, floor of the day difference

  - name: LoanApplication
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: institution_id
        type: string
        source: input
        description: FK -> Institution.id; borrower
      - name: governance_authorization_id
        type: string
        source: input
        description: FK -> GovernanceAuthorization.id; packet evidencing authority to borrow
      - name: pledge_campaign_id
        type: string
        source: input
        description: FK -> PledgeCampaign.id; capital campaign backing a PLEDGE_ADVANCE request, null for other purposes
      - name: purpose
        type: enum
        source: input
        description: use of proceeds
        constraints: "one of SANCTUARY_CONSTRUCTION | SCHOOL_CONSTRUCTION | REFINANCE | PLEDGE_ADVANCE"
      - name: requested_amount_cents
        type: integer
        source: input
        description: principal requested, in cents
        constraints: "> 0"
      - name: term_months
        type: integer
        source: input
        description: requested amortization term
        constraints: "one of 120 | 180 | 240"
      - name: interest_rate_bps
        type: integer
        source: input
        description: quoted note rate in basis points
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: application lifecycle state
        constraints: "one of DRAFT | UNDERWRITING | COMMITTEE_REVIEW | APPROVED | DECLINED | REVISION_REQUESTED | FUNDED"
      - name: giving_basis
        type: enum
        source: computed
        description: basis selected by calculations.institution_unrestricted_giving_base at submit-underwriting; null before
        constraints: "one of AUDITED_ONLY | BLENDED"
      - name: giving_base_cents
        type: integer
        source: computed
        description: snapshot of the unrestricted giving base taken at submit-underwriting; null before
      - name: net_available_dollars
        type: integer
        source: computed
        description: snapshot of net_available_for_debt_service_dollars taken at submit-underwriting; null before
      - name: collateral_lending_value_cents
        type: integer
        source: computed
        description: sum of lending_value_cents over first-lien assets assigned to this application, snapshotted at committee-referral; null before
      - name: max_supportable_principal_cents
        type: integer
        source: computed
        description: output of calculations.maximum_supportable_principal, snapshotted at committee-referral; null before
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID of the CreditAnalyst who last ran submit-underwriting; null before
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the CreditCommitteeMember who recorded the committee decision; null before
      - name: revision_reason
        type: string
        source: system
        description: reason recorded when the application was pushed to REVISION_REQUESTED; null before
      - name: revision_count
        type: integer
        source: system
        default: 0
        description: number of times the application has entered REVISION_REQUESTED

  - name: Loan
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: loan_application_id
        type: string
        source: input
        description: FK -> LoanApplication.id; the approved application being funded
      - name: annual_debt_service_cents
        type: integer
        source: input
        description: annual principal-plus-interest requirement from the lender's amortization schedule, in cents
        constraints: "> 0"
      - name: interest_reserve_shortfall_cents
        type: integer
        source: input
        description: interest reserve still to be funded out of future draws, in cents; swept as bucket 1 of the draw waterfall
        constraints: ">= 0"
      - name: principal_cents
        type: integer
        source: computed
        description: copied from LoanApplication.requested_amount_cents at origination and never mutated
      - name: term_months
        type: integer
        source: computed
        description: copied from LoanApplication.term_months at origination; mutated only by an approved TERM_EXTENSION workout
      - name: giving_basis
        type: enum
        source: computed
        description: copied from LoanApplication.giving_basis at origination; fixes the basis every covenant test uses
        constraints: "one of AUDITED_ONLY | BLENDED"
      - name: servicing_status
        type: enum
        source: system
        default: PENDING_FIRST_DRAW
        description: first of the two independent state dimensions — where the loan sits in its servicing lifecycle
        constraints: "one of PENDING_FIRST_DRAW | CONSTRUCTION_DRAW | AMORTIZING | PAID_OFF"
      - name: risk_posture
        type: enum
        source: computed
        default: OPEN
        description: second of the two independent state dimensions — output of calculations.loan_risk_posture, recomputed on covenant and workout events
        constraints: "one of OPEN | WATCH | RESTRICTED | WORKOUT_GATED"
      - name: disbursed_principal_cents
        type: integer
        source: computed
        default: 0
        description: cumulative gross approved draw amounts disbursed on this loan
      - name: undrawn_commitment_cents
        type: integer
        source: computed
        description: commitment still available to draw; initialized to principal_cents at origination
      - name: cancelled_commitment_cents
        type: integer
        source: computed
        default: 0
        description: commitment cancelled at construction completion; the third bucket of the commitment-conservation invariant
      - name: reserved_draw_cents
        type: integer
        source: computed
        default: 0
        description: sum of approved_amount_cents over DrawRequests of this loan in status APPROVED
      - name: retainage_held_cents
        type: integer
        source: computed
        default: 0
        description: cumulative retainage withheld from disbursed draws and not yet released
      - name: retainage_released_cents
        type: integer
        source: computed
        default: 0
        description: retainage released to the borrower at construction completion
      - name: outstanding_principal_cents
        type: integer
        source: computed
        default: 0
        description: "disbursed_principal_cents - principal_repaid_cents - forgiven_principal_cents"
      - name: principal_repaid_cents
        type: integer
        source: computed
        default: 0
        description: cumulative principal received through POST /loans/{loan_id}/payments
      - name: forgiven_principal_cents
        type: integer
        source: computed
        default: 0
        description: cumulative principal forgiven through approved PARTIAL_FORGIVENESS workout plans
      - name: deferred_payments_count
        type: integer
        source: computed
        default: 0
        description: cumulative months of payment deferral granted through approved PAYMENT_DEFERRAL workout plans

  - name: DrawRequest
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: loan_id
        type: string
        source: input
        description: FK -> Loan.id; construction loan being drawn against
      - name: project_phase
        type: enum
        source: input
        description: construction phase the draw funds
        constraints: "one of SITE_WORK | FOUNDATION | SHELL | SANCTUARY_FITOUT | SCHOOL_FITOUT | FINAL"
      - name: requested_amount_cents
        type: integer
        source: input
        description: gross draw amount requested, in cents
        constraints: "> 0"
      - name: percent_complete
        type: number
        source: input
        description: builder-certified completion fraction for the phase, four decimal places
        constraints: "> 0 and <= 1"
      - name: approved_amount_cents
        type: integer
        source: system
        description: gross amount the servicer approved; null until approval
      - name: retainage_cents
        type: integer
        source: computed
        description: retainage withheld at disbursement per calculations.draw_net_disbursement; null until disbursement
      - name: interest_reserve_applied_cents
        type: integer
        source: computed
        description: bucket 1 of the disbursement waterfall applied to the loan's interest reserve shortfall; null until disbursement
      - name: inspection_fee_cents
        type: integer
        source: computed
        description: bucket 2 of the disbursement waterfall; null until disbursement
      - name: net_disbursed_cents
        type: integer
        source: computed
        description: bucket 3 of the disbursement waterfall — cash actually released to the institution; null until disbursement
      - name: completion_pct_at_disbursement
        type: number
        source: computed
        description: post-draw cumulative completion fraction that selected the retainage tier, four decimal places; null until disbursement
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: draw lifecycle state
        constraints: "one of SUBMITTED | APPROVED | SUSPENDED | DISBURSED | REJECTED | VOIDED"
      - name: inspector_note
        type: string
        source: system
        description: note recorded at approval or rejection; null before
      - name: void_reason
        type: string
        source: system
        description: reason recorded when a disbursed draw was voided; null before

  - name: Covenant
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: loan_id
        type: string
        source: input
        description: FK -> Loan.id; loan the covenant is written on
      - name: covenant_type
        type: enum
        source: input
        description: the tested quantity
        constraints: "one of DSCR_UNRESTRICTED_GIVING | MEMBERSHIP_TREND | PLEDGE_COLLECTION_RATE"
      - name: threshold_ratio
        type: number
        source: input
        description: minimum passing ratio, four decimal places; the test passes when ratio >= threshold_ratio
        constraints: "> 0"
      - name: test_frequency
        type: enum
        source: input
        description: contractual testing cadence
        constraints: "one of QUARTERLY | ANNUAL"
      - name: status
        type: enum
        source: system
        default: COMPLIANT
        description: covenant compliance state
        constraints: "one of COMPLIANT | BREACH_PENDING_CURE | BREACHED | WAIVED"
      - name: last_test_as_of
        type: datetime
        source: system
        description: as-of date of the most recent test; null before the first test
      - name: last_test_numerator_dollars
        type: integer
        source: computed
        description: numerator of the most recent test in whole dollars, produced by the pinned per-period-then-sum rounding order
      - name: last_test_denominator_dollars
        type: integer
        source: computed
        description: denominator of the most recent test in whole dollars
      - name: last_test_ratio
        type: number
        source: computed
        description: ratio of the most recent test, four decimal places, round_half_up
      - name: last_test_result
        type: enum
        source: computed
        description: outcome of the most recent test; null before the first test
        constraints: "one of PASS | FAIL"
      - name: consecutive_fail_count
        type: integer
        source: computed
        default: 0
        description: consecutive FAIL results; reset to 0 by a PASS test or by an explicit cure
      - name: test_count
        type: integer
        source: computed
        default: 0
        description: total tests recorded against this covenant
      - name: waiver_count
        type: integer
        source: computed
        default: 0
        description: number of committee waivers granted on this covenant
      - name: cure_evidence_note
        type: string
        source: system
        description: evidence text recorded with the most recent explicit cure; null before

  - name: WorkoutPlan
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: loan_id
        type: string
        source: input
        description: FK -> Loan.id; distressed loan being restructured
      - name: predecessor_workout_plan_id
        type: string
        source: input
        description: FK -> WorkoutPlan.id; plan this proposal supersedes, null for the first plan on a loan
      - name: option
        type: enum
        source: input
        description: workout treatment requested
        constraints: "one of PAYMENT_DEFERRAL | TERM_EXTENSION | MISSION_IMPACT_FORBEARANCE | PARTIAL_FORGIVENESS"
      - name: deferral_months
        type: integer
        source: input
        description: months of payment deferral requested; required when option == PAYMENT_DEFERRAL, otherwise null
        constraints: "1..24 when present"
      - name: extension_months
        type: integer
        source: input
        description: months added to the amortization term; required when option == TERM_EXTENSION, otherwise null
        constraints: "1..120 when present"
      - name: forgiveness_amount_cents
        type: integer
        source: input
        description: principal to forgive; required when option == PARTIAL_FORGIVENESS, otherwise null
        constraints: "> 0 when present"
      - name: denominational_support_letter
        type: boolean
        source: input
        description: whether the denominational body filed a letter of support; worth 100 mission points when true
      - name: narrative
        type: string
        source: input
        description: servicer narrative on mission and community impact
      - name: mission_impact_score
        type: number
        source: computed
        description: output of calculations.mission_impact_score at creation, two decimal places
      - name: membership_trend_points
        type: integer
        source: computed
        description: membership component of mission_impact_score before weighting
      - name: giving_trend_points
        type: integer
        source: computed
        description: unrestricted-giving component of mission_impact_score before weighting
      - name: community_points
        type: integer
        source: computed
        description: community-program component of mission_impact_score before weighting
      - name: denominational_points
        type: integer
        source: computed
        description: denominational-support component of mission_impact_score before weighting
      - name: status
        type: enum
        source: system
        default: PROPOSED
        description: workout plan lifecycle state
        constraints: "one of PROPOSED | APPROVED | SUPERSEDED"
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the CreditCommitteeMember who approved the plan; null before

# ============================================================================
# §1.2 State Machine Table
# ============================================================================

state_machines:
  # ---- 1. GovernanceAuthorization: branching on requires_denominational_approval,
  #         cyclic through DENOM_REJECTED -> DRAFT ------------------------------
  - entity: GovernanceAuthorization
    initial_state: DRAFT
    terminal_states: []
    shape: branching_with_cycle
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /governance-authorizations/{governance_authorization_id}/submit"
        actor: InstitutionRepresentative
        preconditions:
          - "status == DRAFT"
          - "acting X-User-ID == institution_id"
          - "authorized_amount_cents <= Institution.bylaws_borrowing_cap_cents"
        side_effects:
          - "refreshes updated_at and increments version by 1"
        note: "ERR_BYLAWS_CAP_EXCEEDED when the resolution authorizes more than the bylaws permit."
      - from: SUBMITTED
        to: BOARD_VERIFIED
        trigger: "POST /governance-authorizations/{governance_authorization_id}/board-verification"
        actor: GovernanceOfficer
        preconditions:
          - "status == SUBMITTED"
          - "round_half_up(board_votes_for / board_votes_total, 4) >= Institution.bylaws_quorum_pct"
          - "Institution.requires_denominational_approval == true"
        side_effects:
          - "sets board_quorum_pct to round_half_up(board_votes_for / board_votes_total, 4)"
          - "sets verified_by_user_id to the acting X-User-ID"
          - "increments version by 1"
        note: "Branch A of the fork — taken only when the institution owes a denominational decision."
      - from: SUBMITTED
        to: AUTHORIZED
        trigger: "POST /governance-authorizations/{governance_authorization_id}/board-verification"
        actor: GovernanceOfficer
        preconditions:
          - "status == SUBMITTED"
          - "round_half_up(board_votes_for / board_votes_total, 4) >= Institution.bylaws_quorum_pct"
          - "Institution.requires_denominational_approval == false"
        side_effects:
          - "sets board_quorum_pct to round_half_up(board_votes_for / board_votes_total, 4)"
          - "sets verified_by_user_id to the acting X-User-ID"
          - "increments version by 1"
        note: "Branch B of the fork — the same trigger lands two states apart depending on the institution's denominational obligation."
      - from: BOARD_VERIFIED
        to: AUTHORIZED
        trigger: "POST /governance-authorizations/{governance_authorization_id}/denominational-decision with decision == APPROVE"
        actor: GovernanceOfficer
        preconditions:
          - "status == BOARD_VERIFIED"
          - "denominational_body is not null"
        side_effects:
          - "sets denominational_decision_note to the submitted note"
          - "increments version by 1"
      - from: BOARD_VERIFIED
        to: DENOM_REJECTED
        trigger: "POST /governance-authorizations/{governance_authorization_id}/denominational-decision with decision == REJECT"
        actor: GovernanceOfficer
        preconditions:
          - "status == BOARD_VERIFIED"
          - "denominational_body is not null"
        side_effects:
          - "sets denominational_decision_note to the submitted note"
          - "increments version by 1"
      - from: DENOM_REJECTED
        to: DRAFT
        trigger: "POST /governance-authorizations/{governance_authorization_id}/return-to-draft"
        actor: InstitutionRepresentative
        preconditions:
          - "status == DENOM_REJECTED"
          - "acting X-User-ID == institution_id"
        side_effects:
          - "increments revision_round by 1"
          - "clears denominational_decision_note and verified_by_user_id to null"
          - "increments version by 1"
        note: "Closes the governance cycle: a rejected packet can be re-worked and resubmitted without creating a new authorization."

  # ---- 2. PledgeCampaign: compound state derived from child pledges ----------
  - entity: PledgeCampaign
    initial_state: OPEN
    terminal_states: [CLOSED]
    shape: compound
    transitions:
      - from: OPEN
        to: UNDERPERFORMING
        trigger: "system — recomputation of attrition_adjusted_value_cents after any Pledge create / installment record / lapse"
        actor: system
        preconditions:
          - "total_pledged_cents >= floor(goal_cents * CAMPAIGN_MATURITY_PCT)"
          - "attrition_adjusted_value_cents < floor(goal_cents * CAMPAIGN_UNDERPERFORM_PCT)"
        side_effects:
          - "for every LoanApplication with pledge_campaign_id == this campaign, purpose == PLEDGE_ADVANCE and status == UNDERWRITING: transitions that application UNDERWRITING -> REVISION_REQUESTED (see the LoanApplication machine)"
          - "increments version by 1"
        note: "The maturity gate keeps a brand-new campaign with zero pledges in OPEN; the underperformance test only bites once 90% of the goal has been pledged."
      - from: UNDERPERFORMING
        to: OPEN
        trigger: "system — recomputation of attrition_adjusted_value_cents after a Pledge reinstatement or installment payment"
        actor: system
        preconditions:
          - "attrition_adjusted_value_cents >= floor(goal_cents * CAMPAIGN_UNDERPERFORM_PCT)"
        side_effects:
          - "increments version by 1"
        note: "Cyclic: the campaign returns to OPEN when the conservative value recovers. Applications already pushed to REVISION_REQUESTED are NOT rolled back — the pledged-dollar invariant is restored, the application decision is not."
      - from: OPEN
        to: CLOSED
        trigger: "POST /pledge-campaigns/{pledge_campaign_id}/close"
        actor: InstitutionRepresentative
        preconditions:
          - "status == OPEN"
          - "acting X-User-ID == institution_id"
        side_effects:
          - "freezes the campaign: no further Pledge creation or installment recording is accepted"
          - "increments version by 1"
      - from: UNDERPERFORMING
        to: CLOSED
        trigger: "POST /pledge-campaigns/{pledge_campaign_id}/close"
        actor: InstitutionRepresentative
        preconditions:
          - "status == UNDERPERFORMING"
          - "acting X-User-ID == institution_id"
        side_effects:
          - "freezes the campaign"
          - "increments version by 1"

  # ---- 3. Pledge: cyclic ACTIVE <-> LAPSED ----------------------------------
  - entity: Pledge
    initial_state: ACTIVE
    terminal_states: [FULFILLED]
    shape: cyclic
    transitions:
      - from: ACTIVE
        to: FULFILLED
        trigger: "system — POST /pledges/{pledge_id}/payments raises collected_cents to pledged_amount_cents or more"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "collected_cents >= pledged_amount_cents after applying the installment"
        side_effects:
          - "moves pledged_amount_cents out of PledgeCampaign.active_pledged_cents into PledgeCampaign.fulfilled_pledged_cents"
          - "recomputes PledgeCampaign.attrition_adjusted_value_cents and sponsor_projected_value_cents"
          - "increments version by 1"
      - from: ACTIVE
        to: LAPSED
        trigger: "system — POST /pledges/{pledge_id}/payments with outcome == MISSED raises missed_payments_count to AUTO_LAPSE_MISSED_COUNT"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "missed_payments_count == AUTO_LAPSE_MISSED_COUNT after applying the installment"
        side_effects:
          - "sets lapse_reason to 'AUTO_THREE_MISSED_INSTALLMENTS'"
          - "moves pledged_amount_cents out of PledgeCampaign.active_pledged_cents into PledgeCampaign.lapsed_pledged_cents"
          - "recomputes PledgeCampaign.attrition_adjusted_value_cents; may drive the campaign OPEN -> UNDERPERFORMING"
          - "increments version by 1"
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /pledges/{pledge_id}/lapse"
        actor: LoanServicer
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "sets lapse_reason to the submitted reason"
          - "moves pledged_amount_cents out of PledgeCampaign.active_pledged_cents into PledgeCampaign.lapsed_pledged_cents"
          - "recomputes PledgeCampaign.attrition_adjusted_value_cents; may drive the campaign OPEN -> UNDERPERFORMING which itself pushes PLEDGE_ADVANCE applications in UNDERWRITING to REVISION_REQUESTED"
          - "increments version by 1"
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /pledges/{pledge_id}/reinstate"
        actor: LoanServicer
        preconditions:
          - "status == LAPSED"
          - "PledgeCampaign.status != CLOSED"
        side_effects:
          - "clears lapse_reason to null; preserves collected_cents, payments_made_count and missed_payments_count exactly"
          - "moves pledged_amount_cents out of PledgeCampaign.lapsed_pledged_cents back into PledgeCampaign.active_pledged_cents"
          - "recomputes PledgeCampaign.attrition_adjusted_value_cents; may drive the campaign UNDERPERFORMING -> OPEN"
          - "increments version by 1"
        note: "Compensating action for the lapse: the pledged-dollar conservation identity is restored bucket for bucket."

  # ---- 4. LoanApplication: cyclic revision loop + branching committee fork --
  - entity: LoanApplication
    initial_state: DRAFT
    terminal_states: [DECLINED, FUNDED]
    shape: cyclic_with_branching
    transitions:
      - from: DRAFT
        to: UNDERWRITING
        trigger: "POST /loan-applications/{loan_application_id}/submit-underwriting"
        actor: CreditAnalyst
        preconditions:
          - "status == DRAFT"
          - "Institution.period_count >= MIN_GIVING_PERIODS"
          - "requested_amount_cents <= Institution.bylaws_borrowing_cap_cents"
          - "when purpose == PLEDGE_ADVANCE: pledge_campaign_id is not null"
        side_effects:
          - "runs calculations.institution_unrestricted_giving_base and snapshots giving_basis and giving_base_cents"
          - "runs calculations.net_available_for_debt_service_dollars and snapshots net_available_dollars"
          - "sets prepared_by_user_id to the acting X-User-ID"
          - "increments version by 1"
      - from: REVISION_REQUESTED
        to: UNDERWRITING
        trigger: "POST /loan-applications/{loan_application_id}/submit-underwriting"
        actor: CreditAnalyst
        preconditions:
          - "status == REVISION_REQUESTED"
          - "Institution.period_count >= MIN_GIVING_PERIODS"
          - "requested_amount_cents <= Institution.bylaws_borrowing_cap_cents"
        side_effects:
          - "re-runs the giving snapshot, overwriting giving_basis, giving_base_cents and net_available_dollars"
          - "sets prepared_by_user_id to the acting X-User-ID"
          - "clears revision_reason to null"
          - "increments version by 1"
        note: "Closes the revision cycle — the same endpoint serves the first submission and every re-submission."
      - from: UNDERWRITING
        to: COMMITTEE_REVIEW
        trigger: "POST /loan-applications/{loan_application_id}/committee-referral"
        actor: CreditAnalyst
        preconditions:
          - "status == UNDERWRITING"
          - "GovernanceAuthorization.status == AUTHORIZED"
          - "GovernanceAuthorization.expires_on >= logical clock now"
          - "at least one CollateralAsset has assigned_loan_application_id == this application and lien_position == 1"
          - "requested_amount_cents <= calculations.maximum_supportable_principal output"
        side_effects:
          - "snapshots collateral_lending_value_cents as the sum of lending_value_cents over first-lien assigned assets"
          - "runs calculations.maximum_supportable_principal and snapshots max_supportable_principal_cents"
          - "increments version by 1"
      - from: UNDERWRITING
        to: REVISION_REQUESTED
        trigger: "system — the backing PledgeCampaign transitions OPEN -> UNDERPERFORMING"
        actor: system
        preconditions:
          - "status == UNDERWRITING"
          - "purpose == PLEDGE_ADVANCE"
          - "pledge_campaign_id == the campaign that just transitioned"
        side_effects:
          - "sets revision_reason to 'PLEDGE_CAMPAIGN_UNDERPERFORMING'"
          - "increments revision_count by 1"
          - "increments version by 1"
        note: "Third hop of the pledge-lapse cascade."
      - from: COMMITTEE_REVIEW
        to: APPROVED
        trigger: "POST /loan-applications/{loan_application_id}/committee-decision with decision == APPROVE"
        actor: CreditCommitteeMember
        preconditions:
          - "status == COMMITTEE_REVIEW"
          - "acting X-User-ID != prepared_by_user_id"
          - "requested_amount_cents <= GovernanceAuthorization.authorized_amount_cents"
          - "GovernanceAuthorization.expires_on >= logical clock now"
        side_effects:
          - "sets decided_by_user_id to the acting X-User-ID"
          - "increments version by 1"
      - from: COMMITTEE_REVIEW
        to: DECLINED
        trigger: "POST /loan-applications/{loan_application_id}/committee-decision with decision == DECLINE"
        actor: CreditCommitteeMember
        preconditions:
          - "status == COMMITTEE_REVIEW"
          - "acting X-User-ID != prepared_by_user_id"
        side_effects:
          - "sets decided_by_user_id to the acting X-User-ID and revision_reason to the submitted note"
          - "releases every CollateralAsset assigned to this application: clears assigned_loan_application_id, lien_position, lien_effective_from and lien_effective_to, and appends the released occupation to lien_history"
          - "increments version by 1"
      - from: COMMITTEE_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /loan-applications/{loan_application_id}/committee-decision with decision == REQUEST_REVISION"
        actor: CreditCommitteeMember
        preconditions:
          - "status == COMMITTEE_REVIEW"
          - "acting X-User-ID != prepared_by_user_id"
        side_effects:
          - "sets revision_reason to the submitted note and decided_by_user_id to the acting X-User-ID"
          - "increments revision_count by 1"
          - "keeps every collateral assignment intact"
          - "increments version by 1"
        note: "Third arm of the committee fork; the only arm that re-enters the cycle."
      - from: APPROVED
        to: FUNDED
        trigger: "POST /loans"
        actor: LoanServicer
        preconditions:
          - "status == APPROVED"
          - "no Loan already references this application"
        side_effects:
          - "creates the Loan with principal_cents = requested_amount_cents, undrawn_commitment_cents = requested_amount_cents, servicing_status = PENDING_FIRST_DRAW, risk_posture = OPEN"
          - "copies term_months and giving_basis onto the Loan"
          - "increments version by 1"

  # ---- 5. Loan, dimension A: servicing_status -------------------------------
  - entity: Loan
    dimension: servicing_status
    initial_state: PENDING_FIRST_DRAW
    terminal_states: [PAID_OFF]
    shape: parallel_dimension_a
    transitions:
      - from: PENDING_FIRST_DRAW
        to: CONSTRUCTION_DRAW
        trigger: "system — the first POST /draw-requests/{draw_request_id}/disburse on this loan"
        actor: system
        preconditions:
          - "servicing_status == PENDING_FIRST_DRAW"
          - "disbursed_principal_cents == 0 before the disbursement"
        side_effects:
          - "increments version by 1"
        note: "Dimension A moves on cash movement only; risk_posture (dimension B) is untouched by this transition."
      - from: CONSTRUCTION_DRAW
        to: PENDING_FIRST_DRAW
        trigger: "system — POST /draw-requests/{draw_request_id}/void reduces disbursed_principal_cents to 0"
        actor: system
        preconditions:
          - "servicing_status == CONSTRUCTION_DRAW"
          - "disbursed_principal_cents == 0 after the void"
        side_effects:
          - "increments version by 1"
        note: "Cyclic on dimension A: voiding the only disbursed draw returns the loan to its pre-draw servicing state."
      - from: PENDING_FIRST_DRAW
        to: AMORTIZING
        trigger: "POST /loans/{loan_id}/construction-completion"
        actor: LoanServicer
        preconditions:
          - "servicing_status == PENDING_FIRST_DRAW"
          - "no DrawRequest on this loan has status in {SUBMITTED, APPROVED, SUSPENDED}"
          - "final_inspection_passed == true in the request"
        side_effects:
          - "moves undrawn_commitment_cents into cancelled_commitment_cents and sets undrawn_commitment_cents to 0"
          - "moves retainage_held_cents into retainage_released_cents and sets retainage_held_cents to 0"
          - "increments version by 1"
      - from: CONSTRUCTION_DRAW
        to: AMORTIZING
        trigger: "POST /loans/{loan_id}/construction-completion"
        actor: LoanServicer
        preconditions:
          - "servicing_status == CONSTRUCTION_DRAW"
          - "no DrawRequest on this loan has status in {SUBMITTED, APPROVED, SUSPENDED}"
          - "final_inspection_passed == true in the request"
        side_effects:
          - "moves undrawn_commitment_cents into cancelled_commitment_cents and sets undrawn_commitment_cents to 0"
          - "moves retainage_held_cents into retainage_released_cents and sets retainage_held_cents to 0"
          - "increments version by 1"
      - from: AMORTIZING
        to: PAID_OFF
        trigger: "system — POST /loans/{loan_id}/payments reduces outstanding_principal_cents to 0"
        actor: system
        preconditions:
          - "servicing_status == AMORTIZING"
          - "outstanding_principal_cents == 0 after applying the payment"
        side_effects:
          - "increments version by 1"
        note: "Terminal on dimension A. risk_posture is frozen at whatever value dimension B last held."

  # ---- 6. Loan, dimension B: risk_posture (independent of dimension A) ------
  - entity: Loan
    dimension: risk_posture
    initial_state: OPEN
    terminal_states: []
    shape: parallel_dimension_b
    transitions:
      - from: OPEN
        to: WATCH
        trigger: "system — calculations.loan_risk_posture re-runs after a Covenant on this loan enters BREACH_PENDING_CURE"
        actor: system
        preconditions:
          - "no WorkoutPlan on this loan has status == APPROVED"
          - "no Covenant on this loan has status == BREACHED"
          - "at least one Covenant on this loan has status == BREACH_PENDING_CURE"
        side_effects:
          - "increments version by 1"
        note: "servicing_status is deliberately NOT changed — a WATCH loan keeps drawing construction funds."
      - from: WATCH
        to: OPEN
        trigger: "system — calculations.loan_risk_posture re-runs after a covenant cure, waiver, or passing test"
        actor: system
        preconditions:
          - "every Covenant on this loan has status in {COMPLIANT, WAIVED}"
          - "no WorkoutPlan on this loan has status == APPROVED"
        side_effects:
          - "increments version by 1"
      - from: WATCH
        to: RESTRICTED
        trigger: "system — calculations.loan_risk_posture re-runs after a Covenant on this loan enters BREACHED"
        actor: system
        preconditions:
          - "at least one Covenant on this loan has status == BREACHED"
          - "no WorkoutPlan on this loan has status == APPROVED"
        side_effects:
          - "for every DrawRequest on this loan with status == APPROVED: transitions APPROVED -> SUSPENDED (see the DrawRequest machine), which itself decrements reserved_draw_cents by that draw's approved_amount_cents"
          - "increments version by 1"
        note: "Second hop of the covenant-breach cascade; the draw suspension is hop three and the reserved-commitment release is hop four."
      - from: RESTRICTED
        to: WATCH
        trigger: "system — calculations.loan_risk_posture re-runs after the BREACHED covenant is waived or cured while another covenant remains in BREACH_PENDING_CURE"
        actor: system
        preconditions:
          - "no Covenant on this loan has status == BREACHED"
          - "at least one Covenant on this loan has status == BREACH_PENDING_CURE"
          - "no WorkoutPlan on this loan has status == APPROVED"
        side_effects:
          - "increments version by 1"
      - from: RESTRICTED
        to: OPEN
        trigger: "system — calculations.loan_risk_posture re-runs after every covenant reaches COMPLIANT or WAIVED"
        actor: system
        preconditions:
          - "every Covenant on this loan has status in {COMPLIANT, WAIVED}"
          - "no WorkoutPlan on this loan has status == APPROVED"
        side_effects:
          - "increments version by 1"
        note: "Suspended draws are NOT auto-reinstated; POST /draw-requests/{draw_request_id}/reinstate is the explicit compensating call."
      - from: WATCH
        to: WORKOUT_GATED
        trigger: "system — POST /workout-plans/{workout_plan_id}/approve"
        actor: system
        preconditions:
          - "at least one WorkoutPlan on this loan has status == APPROVED"
        side_effects:
          - "increments version by 1"
      - from: RESTRICTED
        to: WORKOUT_GATED
        trigger: "system — POST /workout-plans/{workout_plan_id}/approve"
        actor: system
        preconditions:
          - "at least one WorkoutPlan on this loan has status == APPROVED"
        side_effects:
          - "increments version by 1"
        note: "WORKOUT_GATED outranks every covenant-derived posture and persists while any plan on the loan is APPROVED."

  # ---- 7. DrawRequest: branching with revert (APPROVED <-> SUSPENDED) -------
  - entity: DrawRequest
    initial_state: SUBMITTED
    terminal_states: [DISBURSED, REJECTED, VOIDED]
    shape: branching_with_revert
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /draw-requests/{draw_request_id}/approve"
        actor: LoanServicer
        preconditions:
          - "status == SUBMITTED"
          - "Loan.servicing_status in {PENDING_FIRST_DRAW, CONSTRUCTION_DRAW}"
          - "approved_amount_cents <= requested_amount_cents"
          - "approved_amount_cents <= Loan.undrawn_commitment_cents - Loan.reserved_draw_cents"
        side_effects:
          - "sets approved_amount_cents and inspector_note"
          - "increases Loan.reserved_draw_cents by approved_amount_cents"
          - "increments version by 1 on the draw and on the loan"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /draw-requests/{draw_request_id}/reject"
        actor: LoanServicer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "sets inspector_note to the submitted note"
          - "leaves every Loan ledger field unchanged"
          - "increments version by 1"
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /draw-requests/{draw_request_id}/disburse"
        actor: LoanServicer
        preconditions:
          - "status == APPROVED"
          - "Loan.servicing_status in {PENDING_FIRST_DRAW, CONSTRUCTION_DRAW}"
          - "every Covenant on Loan has status in {COMPLIANT, WAIVED}"
          - "calculations.draw_net_disbursement bucket 3 output > 0"
        side_effects:
          - "runs calculations.draw_net_disbursement and stores completion_pct_at_disbursement, retainage_cents, interest_reserve_applied_cents, inspection_fee_cents and net_disbursed_cents"
          - "decreases Loan.reserved_draw_cents by approved_amount_cents"
          - "increases Loan.disbursed_principal_cents by approved_amount_cents and decreases Loan.undrawn_commitment_cents by the same amount"
          - "increases Loan.retainage_held_cents by retainage_cents"
          - "decreases Loan.interest_reserve_shortfall_cents by interest_reserve_applied_cents"
          - "increases Loan.outstanding_principal_cents by approved_amount_cents"
          - "when it is the first disbursement: drives Loan.servicing_status PENDING_FIRST_DRAW -> CONSTRUCTION_DRAW"
          - "increments version by 1 on the draw and on the loan"
      - from: APPROVED
        to: SUSPENDED
        trigger: "system — Loan.risk_posture becomes RESTRICTED"
        actor: system
        preconditions:
          - "status == APPROVED"
          - "Loan.risk_posture == RESTRICTED"
        side_effects:
          - "decreases Loan.reserved_draw_cents by approved_amount_cents"
          - "increments version by 1 on the draw and on the loan"
        note: "Hops three and four of the covenant-breach cascade: the suspension is caused by the posture change, and the reserved-commitment release is caused by the suspension."
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /draw-requests/{draw_request_id}/reinstate"
        actor: LoanServicer
        preconditions:
          - "status == SUSPENDED"
          - "Loan.risk_posture in {OPEN, WATCH}"
          - "approved_amount_cents <= Loan.undrawn_commitment_cents - Loan.reserved_draw_cents"
        side_effects:
          - "increases Loan.reserved_draw_cents by approved_amount_cents"
          - "increments version by 1 on the draw and on the loan"
        note: "Revert arm: the draw returns to APPROVED only after the posture recovers."
      - from: DISBURSED
        to: VOIDED
        trigger: "POST /draw-requests/{draw_request_id}/void"
        actor: LoanServicer
        preconditions:
          - "status == DISBURSED"
          - "Loan.servicing_status in {PENDING_FIRST_DRAW, CONSTRUCTION_DRAW}"
        side_effects:
          - "sets void_reason to the submitted reason"
          - "decreases Loan.disbursed_principal_cents by approved_amount_cents and increases Loan.undrawn_commitment_cents by the same amount"
          - "decreases Loan.retainage_held_cents by retainage_cents"
          - "increases Loan.interest_reserve_shortfall_cents by interest_reserve_applied_cents"
          - "decreases Loan.outstanding_principal_cents by approved_amount_cents"
          - "when disbursed_principal_cents reaches 0: drives Loan.servicing_status CONSTRUCTION_DRAW -> PENDING_FIRST_DRAW"
          - "increments version by 1 on the draw and on the loan"
        note: "Compensating action for a disbursement: every ledger field the disbursement moved is moved back by the identical amount."

  # ---- 8. Covenant: cyclic breach / cure / waiver --------------------------
  - entity: Covenant
    initial_state: COMPLIANT
    terminal_states: []
    shape: cyclic
    transitions:
      - from: COMPLIANT
        to: BREACH_PENDING_CURE
        trigger: "POST /covenants/{covenant_id}/tests producing result FAIL"
        actor: LoanServicer
        preconditions:
          - "status == COMPLIANT"
          - "Loan.servicing_status != PAID_OFF"
        side_effects:
          - "stores last_test_as_of, last_test_numerator_dollars, last_test_denominator_dollars, last_test_ratio and last_test_result"
          - "increments test_count by 1 and sets consecutive_fail_count to 1"
          - "re-runs calculations.loan_risk_posture on the loan, which moves risk_posture OPEN -> WATCH"
          - "increments version by 1"
      - from: BREACH_PENDING_CURE
        to: COMPLIANT
        trigger: "POST /covenants/{covenant_id}/tests producing result PASS"
        actor: LoanServicer
        preconditions:
          - "status == BREACH_PENDING_CURE"
          - "Loan.servicing_status != PAID_OFF"
        side_effects:
          - "stores the test fields and increments test_count by 1"
          - "resets consecutive_fail_count to 0"
          - "re-runs calculations.loan_risk_posture, which may move risk_posture WATCH -> OPEN"
          - "increments version by 1"
        note: "Auto-cure applies to a first breach only."
      - from: BREACH_PENDING_CURE
        to: BREACHED
        trigger: "POST /covenants/{covenant_id}/tests producing a second consecutive result FAIL"
        actor: LoanServicer
        preconditions:
          - "status == BREACH_PENDING_CURE"
          - "Loan.servicing_status != PAID_OFF"
        side_effects:
          - "stores the test fields, increments test_count by 1 and sets consecutive_fail_count to 2"
          - "re-runs calculations.loan_risk_posture, which moves risk_posture WATCH -> RESTRICTED and thereby suspends every APPROVED draw"
          - "increments version by 1"
      - from: BREACH_PENDING_CURE
        to: COMPLIANT
        trigger: "POST /covenants/{covenant_id}/cure"
        actor: LoanServicer
        preconditions:
          - "status == BREACH_PENDING_CURE"
          - "last_test_result == PASS"
        side_effects:
          - "stores cure_evidence_note, resets consecutive_fail_count to 0"
          - "re-runs calculations.loan_risk_posture"
          - "increments version by 1"
      - from: BREACHED
        to: BREACHED
        trigger: "POST /covenants/{covenant_id}/tests (either result)"
        actor: LoanServicer
        preconditions:
          - "status == BREACHED"
          - "Loan.servicing_status != PAID_OFF"
        side_effects:
          - "stores last_test_as_of, last_test_numerator_dollars, last_test_denominator_dollars, last_test_ratio and last_test_result, and increments test_count by 1"
          - "sets consecutive_fail_count to 0 on PASS, or increments it by 1 on FAIL"
          - "leaves status at BREACHED and leaves Loan.risk_posture at RESTRICTED"
          - "increments version by 1"
        note: "Self-transition, not a no-op: it is the ONLY way to record last_test_result == PASS on a hard-breached covenant, which POST /covenants/{covenant_id}/cure then requires as its evidence precondition."
      - from: BREACHED
        to: COMPLIANT
        trigger: "POST /covenants/{covenant_id}/cure"
        actor: LoanServicer
        preconditions:
          - "status == BREACHED"
          - "last_test_result == PASS"
        side_effects:
          - "stores cure_evidence_note, resets consecutive_fail_count to 0"
          - "re-runs calculations.loan_risk_posture, which may move risk_posture RESTRICTED -> WATCH or RESTRICTED -> OPEN"
          - "increments version by 1"
        note: "A passing test alone does NOT lift a hard breach — the servicer must file cure evidence. That is why BREACHED has no test-driven exit."
      - from: BREACHED
        to: WAIVED
        trigger: "POST /covenants/{covenant_id}/waive"
        actor: CreditCommitteeMember
        preconditions:
          - "status == BREACHED"
        side_effects:
          - "increments waiver_count by 1"
          - "re-runs calculations.loan_risk_posture, which may move risk_posture RESTRICTED -> WATCH or RESTRICTED -> OPEN"
          - "increments version by 1"
      - from: WAIVED
        to: COMPLIANT
        trigger: "POST /covenants/{covenant_id}/tests producing result PASS"
        actor: LoanServicer
        preconditions:
          - "status == WAIVED"
          - "Loan.servicing_status != PAID_OFF"
        side_effects:
          - "stores the test fields, increments test_count by 1 and resets consecutive_fail_count to 0"
          - "re-runs calculations.loan_risk_posture"
          - "increments version by 1"
      - from: WAIVED
        to: BREACH_PENDING_CURE
        trigger: "POST /covenants/{covenant_id}/tests producing result FAIL"
        actor: LoanServicer
        preconditions:
          - "status == WAIVED"
          - "Loan.servicing_status != PAID_OFF"
        side_effects:
          - "stores the test fields, increments test_count by 1 and sets consecutive_fail_count to 1"
          - "re-runs calculations.loan_risk_posture, which may move risk_posture back to WATCH"
          - "increments version by 1"
        note: "Closes the covenant cycle: a waived covenant that fails again re-enters the breach loop rather than jumping straight to BREACHED."

  # ---- 9. WorkoutPlan: linear with supersede ------------------------------
  - entity: WorkoutPlan
    initial_state: PROPOSED
    terminal_states: [SUPERSEDED]
    shape: linear_with_supersede
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /workout-plans/{workout_plan_id}/approve"
        actor: CreditCommitteeMember
        preconditions:
          - "status == PROPOSED"
          - "Loan.risk_posture in {WATCH, RESTRICTED, WORKOUT_GATED}"
          - "option == PARTIAL_FORGIVENESS implies mission_impact_score >= PARTIAL_FORGIVENESS_MIN_SCORE"
          - "option == MISSION_IMPACT_FORBEARANCE implies mission_impact_score >= FORBEARANCE_MIN_SCORE"
          - "option == PARTIAL_FORGIVENESS implies forgiveness_amount_cents <= Loan.outstanding_principal_cents"
        side_effects:
          - "sets approved_by_user_id to the acting X-User-ID"
          - "when predecessor_workout_plan_id is not null: transitions that predecessor APPROVED -> SUPERSEDED"
          - "option TERM_EXTENSION: sets Loan.term_months to term_months + extension_months and Loan.annual_debt_service_cents to floor(old_annual_debt_service_cents * old_term_months / new_term_months)"
          - "option PAYMENT_DEFERRAL: increases Loan.deferred_payments_count by deferral_months"
          - "option PARTIAL_FORGIVENESS: increases Loan.forgiven_principal_cents and Institution.cumulative_forgiveness_cents by forgiveness_amount_cents and reduces Loan.outstanding_principal_cents by the same amount"
          - "option MISSION_IMPACT_FORBEARANCE: leaves every Loan ledger field unchanged"
          - "re-runs calculations.loan_risk_posture, which moves Loan.risk_posture to WORKOUT_GATED"
          - "increments version by 1 on the plan and on the loan"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system — a successor WorkoutPlan whose predecessor_workout_plan_id points at this plan is approved"
        actor: system
        preconditions:
          - "status == APPROVED"
        side_effects:
          - "increments version by 1"
        note: "Terminal. The successor's own ledger effects apply on top of this plan's; nothing is unwound."

# ============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# ============================================================================

concurrency_rules:
  - rule_id: workout-plan-create-stale-loan
    parent_entity: Loan
    write_endpoint: "POST /workout-plans"
    occ_field: "expected_loan_version"
    description: |
      Proposing a WorkoutPlan against a Loan whose version has advanced since
      the client last read it is rejected with a stale-version error. A workout
      proposal is sized against the loan's outstanding principal, term and
      posture, and a previously approved plan legitimately supersedes the
      lender's earlier view of those figures, so the request is otherwise
      well-formed and would succeed on its own terms — the stale version is the
      only signal that the proposal was priced against a superseded loan state.
    error_id: ERR_STALE_LOAN_VERSION
    http_status: 412

  - rule_id: pledge-create-stale-campaign
    parent_entity: PledgeCampaign
    write_endpoint: "POST /pledges"
    occ_field: "expected_pledge_campaign_version"
    description: |
      Recording a Pledge against a PledgeCampaign whose version has advanced
      since the client last read it is rejected with a stale-version error.
      Pledges are additive, so a second create observes a campaign whose
      attrition-adjusted value, status and bucket totals have all moved, yet
      would still satisfy every state precondition; OCC on the campaign version
      is what makes the stale-basis create deterministically refusable.
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412

# ============================================================================
# §1.3 Calculation Rules Table
# ============================================================================

calculations:
  # ---- C1 ------------------------------------------------------------------
  - name: institution_unrestricted_giving_base
    trigger: "POST /loan-applications/{loan_application_id}/submit-underwriting (snapshotted onto the application); GET /loan-applications/{loan_application_id}/underwriting-summary (recomputed for the basis named in the query); recomputed on Institution reads"
    algorithm: aggregation
    formula: |
      # Window selection (identical for both variants):
      #   candidates = GivingPeriod rows with institution_id == institution
      #                and period_end <= as_of
      #   order       = period_end DESC, tie-break created_at ASC
      # as_of is the logical clock instant of the call.
      per_period_unrestricted(p) =
          max(0, p.total_contributions_cents
                 - p.restricted_contributions_cents
                 - p.donor_restricted_endowment_draw_cents)

      variant AUDITED_ONLY:
          window = first 4 candidates whose source == AUDITED
          base   = sum over window of per_period_unrestricted(p)

      variant BLENDED:
          window = first 4 candidates regardless of source
          base   = sum over window of (
                       per_period_unrestricted(p)                 if p.source == AUDITED
                       floor(per_period_unrestricted(p) * (1 - INTERNAL_HAIRCUT_PCT))
                                                                  if p.source == INTERNAL
                   )

      # Mandated basis when the value is snapshotted (submit-underwriting):
      #   AUDITED_ONLY when Institution.audited_period_count >= 4
      #   BLENDED      otherwise
      # When Institution.period_count < 4 the base is 0 and the caller is
      # rejected with ERR_INSUFFICIENT_GIVING_HISTORY.
    input_set: "GivingPeriod rows of one Institution with period_end <= as_of; AUDITED_ONLY additionally filters source == AUDITED. Donor-restricted contributions and donor-restricted endowment draws are subtracted out of every period and Institution.endowment_market_value_cents is never read."
    constants:
      MIN_GIVING_PERIODS: 4
      INTERNAL_HAIRCUT_PCT: 0.15
    precision: "integer cents; the INTERNAL haircut is floored per period before summation"
    variants:
      - name: AUDITED_ONLY
        when: "Institution.audited_period_count >= 4, or the caller passes giving_basis=AUDITED_ONLY to the underwriting summary"
        difference: "restricts the four-period window to audited periods and applies no haircut"
      - name: BLENDED
        when: "Institution.audited_period_count < 4, or the caller passes giving_basis=BLENDED to the underwriting summary"
        difference: "takes the four most recent periods of either provenance and floors each INTERNAL period at 85% before summing, so the same rows yield a different base"

  # ---- C2 ------------------------------------------------------------------
  - name: net_available_for_debt_service_dollars
    trigger: "POST /loan-applications/{loan_application_id}/submit-underwriting; POST /covenants/{covenant_id}/tests; GET /loan-applications/{loan_application_id}/underwriting-summary"
    algorithm: aggregation
    formula: |
      # Same window and ordering as institution_unrestricted_giving_base for the
      # basis in force (application snapshot basis, Loan.giving_basis, or the
      # query basis).
      per_period_net(p) =
          max(0, per_period_unrestricted(p) - p.operating_expense_cents)
          # under BLENDED, an INTERNAL period contributes
          #   max(0, floor(per_period_unrestricted(p) * 0.85) - p.operating_expense_cents)

      # PINNED ROUNDING ORDER — round each period to whole dollars FIRST, then sum:
      numerator_dollars = sum over the 4-period window of
                              round_half_up(per_period_net(p) / 100)

      # The forbidden alternative, which the implementation MUST NOT use, is
      #   round_half_up( (sum of per_period_net(p)) / 100 )
      # For the reference fixture the two orders differ by exactly one dollar
      # (432001 vs 432000).
    input_set: "the same four GivingPeriod rows the giving base uses; periods whose operating expense exceeds unrestricted giving contribute 0, not a negative amount"
    constants:
      DOLLARS_PER_CENT_DIVISOR: 100
    precision: "whole dollars, round_half_up applied per period before summation"

  # ---- C3 ------------------------------------------------------------------
  - name: dscr_covenant_ratio
    trigger: "POST /covenants/{covenant_id}/tests"
    algorithm: threshold
    formula: |
      numerator_dollars   = net_available_for_debt_service_dollars(
                                institution = Loan.LoanApplication.institution_id,
                                basis       = Loan.giving_basis,
                                as_of       = request.as_of_date)
      denominator_dollars = round_half_up(Loan.annual_debt_service_cents / 100)
      ratio               = round_half_up(numerator_dollars / denominator_dollars, 4)
      result              = PASS when ratio >= Covenant.threshold_ratio else FAIL
      # Boundary is inclusive: ratio exactly equal to threshold_ratio PASSES.
    input_set: "the four-period window of the borrowing institution under Loan.giving_basis, plus the loan's current annual_debt_service_cents (which an approved TERM_EXTENSION workout may have lowered)"
    constants:
      MIN_DSCR: 1.2000
    precision: "ratio to 4 decimal places, round_half_up; numerator and denominator in whole dollars"

  # ---- C4 ------------------------------------------------------------------
  - name: pledge_campaign_projected_value
    trigger: "POST /pledges; POST /pledges/{pledge_id}/payments; POST /pledges/{pledge_id}/lapse; POST /pledges/{pledge_id}/reinstate; GET /pledge-campaigns/{pledge_campaign_id}/valuation"
    algorithm: decay_function
    formula: |
      collected = PledgeCampaign.collected_to_date_cents      # cash already in hand, never discounted

      variant LENDER_CONSERVATIVE:
          for each Pledge p with status == ACTIVE:
              base_rate   = ATTRITION_PCT_BY_TIER[p.donor_tier]
              penalty     = MISSED_PAYMENT_PENALTY_PCT if p.missed_payments_count >= 2 else 0
              rate        = min(ATTRITION_RATE_CEILING, base_rate + penalty)
              remaining   = p.pledged_amount_cents - p.collected_cents
              contribution = floor(remaining * (1 - rate))     # floored per pledge
          value = collected + sum of contributions

      variant SPONSOR_OPTIMISTIC:
          remaining_total = sum over Pledge p with status == ACTIVE of
                                (p.pledged_amount_cents - p.collected_cents)
          value = collected + floor(remaining_total
                                    * PledgeCampaign.sponsor_collection_rate_bps / 10000)

      # LAPSED and FULFILLED pledges contribute nothing beyond the cash already
      # counted in `collected`.
    input_set: "Pledge rows of one campaign with status == ACTIVE for the discounted leg; collected_to_date_cents spans pledges in every status"
    constants:
      ATTRITION_PCT_BY_TIER: { LEAD: 0.05, MAJOR: 0.12, GENERAL: 0.22 }
      MISSED_PAYMENT_PENALTY_PCT: 0.15
      ATTRITION_RATE_CEILING: 0.60
      CAMPAIGN_MATURITY_PCT: 0.90
      CAMPAIGN_UNDERPERFORM_PCT: 0.80
      AUTO_LAPSE_MISSED_COUNT: 3
    precision: "integer cents; the discount is floored per pledge under LENDER_CONSERVATIVE and once over the aggregate under SPONSOR_OPTIMISTIC"
    variants:
      - name: LENDER_CONSERVATIVE
        when: "always, for PledgeCampaign.attrition_adjusted_value_cents, for the UNDERPERFORMING gate, and for PLEDGE_ADVANCE loan sizing"
        difference: "discounts each active pledge at its own tier rate plus a missed-payment penalty and floors per pledge"
      - name: SPONSOR_OPTIMISTIC
        when: "reported as PledgeCampaign.sponsor_projected_value_cents and returned by the valuation endpoint with basis=SPONSOR_OPTIMISTIC; never used for credit decisions"
        difference: "applies the sponsor's single historical collection rate to the aggregate remaining balance and floors once, ignoring tier mix and missed payments"

  # ---- C5 ------------------------------------------------------------------
  - name: collateral_special_purpose_lending_value
    trigger: "POST /collateral-assets; POST /collateral-assets/{collateral_asset_id}/assignments"
    algorithm: tiered_pricing
    formula: |
      score_rate    = ADVANCE_RATE_BY_ALT_USE_SCORE[asset.alternative_use_score]
      type_cap      = ADVANCE_RATE_CAP_BY_ASSET_TYPE[asset.asset_type]
      effective     = min(score_rate, type_cap)               # nested min #1
      lien_factor   = LIEN_FACTOR_BY_POSITION[min(3, coalesce(asset.lien_position, 1))]
      seasoning     = SEASONED_APPRAISAL_FACTOR
                          if asset.appraisal_age_days > APPRAISAL_SEASONING_DAYS
                          else 1.00
      v1 = floor(asset.appraised_value_cents * effective)     # floor step 1
      v2 = floor(v1 * lien_factor)                            # floor step 2
      lending_value_cents = floor(v2 * seasoning)             # floor step 3
      # Evaluation order is pinned: advance rate, then lien factor, then
      # seasoning, flooring after each step. An unassigned asset is valued as if
      # it would take a first lien.
    input_set: "one CollateralAsset row plus the logical clock (for appraisal_age_days); DONOR_RESTRICTED_ENDOWMENT assets are valued at 0 and can never be assigned"
    constants:
      ADVANCE_RATE_BY_ALT_USE_SCORE: { 1: 0.40, 2: 0.50, 3: 0.60, 4: 0.70, 5: 0.75 }
      ADVANCE_RATE_CAP_BY_ASSET_TYPE:
        SANCTUARY: 0.55
        EDUCATION_WING: 0.65
        PARSONAGE: 0.70
        LAND: 0.50
        FELLOWSHIP_HALL: 0.60
        DONOR_RESTRICTED_ENDOWMENT: 0.00
      LIEN_FACTOR_BY_POSITION: { 1: 1.00, 2: 0.60, 3: 0.00 }
      APPRAISAL_SEASONING_DAYS: 365
      SEASONED_APPRAISAL_FACTOR: 0.90
      APPRAISAL_STALE_DAYS: 730
    precision: "integer cents, floored after each of the three multiplication steps"

  # ---- C6 ------------------------------------------------------------------
  - name: maximum_supportable_principal
    trigger: "POST /loan-applications/{loan_application_id}/committee-referral; GET /loan-applications/{loan_application_id}/underwriting-summary"
    algorithm: constraint_propagation
    formula: |
      capacity_ads_dollars = floor(application.net_available_dollars / MIN_DSCR)
      ds_capacity_cents    = floor(capacity_ads_dollars
                                   * TERM_FACTOR_BY_TERM_MONTHS[application.term_months]) * 100
      collateral_cents     = sum of lending_value_cents over CollateralAsset rows with
                                 assigned_loan_application_id == application.id
                                 and lien_position == 1
      caps = [ ds_capacity_cents,
               collateral_cents,
               Institution.bylaws_borrowing_cap_cents,
               GovernanceAuthorization.authorized_amount_cents ]
      if application.purpose == PLEDGE_ADVANCE:
          caps += [ floor(PledgeCampaign.attrition_adjusted_value_cents
                          * PLEDGE_ADVANCE_LTV) ]
      max_supportable_principal_cents = min(caps)
    input_set: "the application's own snapshotted net_available_dollars, its first-lien assigned collateral, the institution's bylaws cap, the governance authorization's authorized amount, and — for PLEDGE_ADVANCE only — the campaign's LENDER_CONSERVATIVE value"
    constants:
      MIN_DSCR: 1.2000
      TERM_FACTOR_BY_TERM_MONTHS: { 120: 5.5, 180: 7.0, 240: 8.5 }
      PLEDGE_ADVANCE_LTV: 0.60
    precision: "integer cents; the debt-service capacity is floored in dollars before conversion to cents"

  # ---- C7 ------------------------------------------------------------------
  - name: draw_net_disbursement
    trigger: "POST /draw-requests/{draw_request_id}/disburse"
    algorithm: waterfall_allocation
    formula: |
      A = draw.approved_amount_cents

      # Step 1 — completion tier is read from the POST-DRAW cumulative position,
      # i.e. the tier this very draw creates. Evaluation order is pinned so the
      # apparent circularity (retainage depends on the tier the draw produces)
      # is well defined.
      post_draw_gross = Loan.disbursed_principal_cents + A      # pre-draw balance
      completion_pct  = floor(post_draw_gross * 10000 / Loan.principal_cents) / 10000

      # Step 2 — retainage rate from the post-draw tier
      retainage_rate  = 0.10 if completion_pct <  0.5000
                        0.05 if 0.5000 <= completion_pct < 0.9000
                        0.00 if completion_pct >= 0.9000
      retainage_cents = floor(A * retainage_rate)

      # Step 3 — waterfall over the net pool, in this exact bucket order
      pool     = A - retainage_cents
      bucket1  = min(pool, Loan.interest_reserve_shortfall_cents)   # interest reserve sweep
      pool    -= bucket1
      bucket2  = min(pool, INSPECTION_FEE_CENTS)                    # inspection fee
      pool    -= bucket2
      bucket3  = pool                                               # cash to the institution

      interest_reserve_applied_cents = bucket1
      inspection_fee_cents           = bucket2
      net_disbursed_cents            = bucket3
      # bucket3 must be strictly positive; bucket3 == 0 is rejected with
      # ERR_DRAW_NET_NONPOSITIVE.
    input_set: "one APPROVED DrawRequest plus its Loan's disbursed_principal_cents, principal_cents and interest_reserve_shortfall_cents as they stand immediately before the disbursement"
    constants:
      RETAINAGE_TIER_1_PCT: 0.10
      RETAINAGE_TIER_2_PCT: 0.05
      RETAINAGE_TIER_3_PCT: 0.00
      RETAINAGE_TIER_1_CEILING: 0.5000
      RETAINAGE_TIER_2_CEILING: 0.9000
      INSPECTION_FEE_CENTS: 45000
    precision: "integer cents; completion_pct floored to 4 decimal places; retainage floored"

  # ---- C8 ------------------------------------------------------------------
  - name: mission_impact_score
    trigger: "POST /workout-plans (computed once at creation and frozen on the plan)"
    algorithm: weighted_scoring
    formula: |
      # Window: the four most recent GivingPeriod rows of the borrowing
      # institution with period_end <= logical clock now, ordered period_end DESC
      # with tie-break created_at ASC, regardless of source. oldest = the last
      # element of that window, newest = the first.
      hh_change  = (newest.member_household_count - oldest.member_household_count)
                   / oldest.member_household_count
      giv_change = (newest.unrestricted_contributions_cents
                    - oldest.unrestricted_contributions_cents)
                   / oldest.unrestricted_contributions_cents

      points(change) = 100 if change >= 0
                        70 if change >= -0.05
                        40 if change >= -0.15
                        10 otherwise

      membership_trend_points  = points(hh_change)
      giving_trend_points      = points(giv_change)
      community_points         = min(100, Institution.community_program_count * 20)
      denominational_points    = 100 if plan.denominational_support_letter else 0

      mission_impact_score = round_half_up(
            0.35 * membership_trend_points
          + 0.25 * giving_trend_points
          + 0.20 * community_points
          + 0.20 * denominational_points, 2)
    input_set: "the four most recent GivingPeriod rows of the institution regardless of source, the institution's community_program_count, and the plan's denominational_support_letter flag"
    constants:
      WEIGHT_MEMBERSHIP: 0.35
      WEIGHT_GIVING: 0.25
      WEIGHT_COMMUNITY: 0.20
      WEIGHT_DENOMINATIONAL: 0.20
      COMMUNITY_POINTS_PER_PROGRAM: 20
      PARTIAL_FORGIVENESS_MIN_SCORE: 92.00
      FORBEARANCE_MIN_SCORE: 50.00
    precision: "2 decimal places, round_half_up; component points are integers"

  # ---- C9 ------------------------------------------------------------------
  - name: loan_risk_posture
    trigger: "POST /covenants; POST /covenants/{covenant_id}/tests; POST /covenants/{covenant_id}/cure; POST /covenants/{covenant_id}/waive; POST /workout-plans/{workout_plan_id}/approve"
    algorithm: threshold
    formula: |
      if any WorkoutPlan with loan_id == loan.id has status == APPROVED:
          posture = WORKOUT_GATED
      elif any Covenant with loan_id == loan.id has status == BREACHED:
          posture = RESTRICTED
      elif any Covenant with loan_id == loan.id has status == BREACH_PENDING_CURE:
          posture = WATCH
      else:
          posture = OPEN
      # Evaluated in this exact order; the first matching clause wins. The
      # posture dimension never reads or writes servicing_status.
    input_set: "every Covenant row and every WorkoutPlan row whose loan_id equals this loan, in any status"
    constants: {}
    precision: "enum, no rounding"

# ============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority; the first
#      violated rule determines the response, and every priority below is unique so
#      dual-failure scenarios have exactly one correct error_id)
# ============================================================================

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "when the acting role is InstitutionRepresentative, X-User-ID equals the institution_id that owns the target resource (directly, or through PledgeCampaign.institution_id / LoanApplication.institution_id / Loan -> LoanApplication.institution_id)"
    error_id: ERR_INSTITUTION_SCOPE_VIOLATION
    http_status: 403
    applies_to: "every endpoint whose roles include InstitutionRepresentative"

  # ---- existence: path segments left-to-right, then body foreign keys -------
  - priority: 4
    category: existence
    check: "institution_id in the path or body resolves to an Institution"
    error_id: ERR_INSTITUTION_NOT_FOUND
    http_status: 404
    applies_to: "GET /institutions/{institution_id}; POST /giving-periods; POST /governance-authorizations; POST /pledge-campaigns; POST /collateral-assets; POST /loan-applications"
  - priority: 5
    category: existence
    check: "giving_period_id in the path resolves to a GivingPeriod"
    error_id: ERR_GIVING_PERIOD_NOT_FOUND
    http_status: 404
    applies_to: "GET /giving-periods/{giving_period_id}"
  - priority: 6
    category: existence
    check: "governance_authorization_id in the path or body resolves to a GovernanceAuthorization"
    error_id: ERR_GOVERNANCE_AUTHORIZATION_NOT_FOUND
    http_status: 404
    applies_to: "GET and POST endpoints under /governance-authorizations; POST /loan-applications"
  - priority: 7
    category: existence
    check: "pledge_campaign_id in the path or body resolves to a PledgeCampaign"
    error_id: ERR_PLEDGE_CAMPAIGN_NOT_FOUND
    http_status: 404
    applies_to: "GET and POST endpoints under /pledge-campaigns; POST /pledges; POST /loan-applications"
  - priority: 8
    category: existence
    check: "pledge_id in the path resolves to a Pledge"
    error_id: ERR_PLEDGE_NOT_FOUND
    http_status: 404
    applies_to: "GET /pledges/{pledge_id}; POST /pledges/{pledge_id}/*"
  - priority: 9
    category: existence
    check: "collateral_asset_id in the path resolves to a CollateralAsset"
    error_id: ERR_COLLATERAL_ASSET_NOT_FOUND
    http_status: 404
    applies_to: "GET /collateral-assets/{collateral_asset_id}; POST /collateral-assets/{collateral_asset_id}/*"
  - priority: 10
    category: existence
    check: "loan_application_id in the path or body resolves to a LoanApplication"
    error_id: ERR_LOAN_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "GET and POST endpoints under /loan-applications; POST /loans; POST /collateral-assets/{collateral_asset_id}/assignments"
  - priority: 11
    category: existence
    check: "loan_id in the path or body resolves to a Loan"
    error_id: ERR_LOAN_NOT_FOUND
    http_status: 404
    applies_to: "GET /loans/{loan_id}; POST /loans/{loan_id}/*; POST /draw-requests; POST /covenants; POST /workout-plans"
  - priority: 12
    category: existence
    check: "draw_request_id in the path resolves to a DrawRequest"
    error_id: ERR_DRAW_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "GET /draw-requests/{draw_request_id}; POST /draw-requests/{draw_request_id}/*"
  - priority: 13
    category: existence
    check: "covenant_id in the path resolves to a Covenant"
    error_id: ERR_COVENANT_NOT_FOUND
    http_status: 404
    applies_to: "GET /covenants/{covenant_id}; POST /covenants/{covenant_id}/*"
  - priority: 14
    category: existence
    check: "workout_plan_id in the path, and predecessor_workout_plan_id in the body, resolve to a WorkoutPlan"
    error_id: ERR_WORKOUT_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "GET /workout-plans/{workout_plan_id}; POST /workout-plans/{workout_plan_id}/approve; POST /workout-plans"

  # ---- request shape -------------------------------------------------------
  - priority: 15
    category: business_constraint
    check: "request body conforms to the endpoint's input schema: required fields present, enums within their declared sets, integer cent amounts >= 0 (and > 0 where §1.1 says so), percent_complete in (0, 1], lien_effective_to > lien_effective_from, period_end > period_start, decision within its allowed set, outcome == MISSED implies amount_cents == 0 and outcome == PAID implies amount_cents > 0, option-specific workout fields present (deferral_months for PAYMENT_DEFERRAL, extension_months for TERM_EXTENSION, forgiveness_amount_cents for PARTIAL_FORGIVENESS), and final_inspection_passed == true on a construction completion"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"

  # ---- optimistic concurrency ---------------------------------------------
  - priority: 16
    category: state
    check: "expected_loan_version equals the target Loan's current version"
    error_id: ERR_STALE_LOAN_VERSION
    http_status: 412
    applies_to: "POST /workout-plans"
  - priority: 17
    category: state
    check: "expected_pledge_campaign_version equals the target PledgeCampaign's current version"
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412
    applies_to: "POST /pledges"

  # ---- state preconditions -------------------------------------------------
  - priority: 18
    category: state
    check: "the GovernanceAuthorization is in the state the requested transition declares as `from` in §1.2"
    error_id: ERR_AUTHORIZATION_INVALID_STATE
    http_status: 409
    applies_to: "POST /governance-authorizations/{governance_authorization_id}/{submit,board-verification,denominational-decision,return-to-draft}"
  - priority: 19
    category: state
    check: "the LoanApplication is in the state the requested transition declares as `from` in §1.2. On POST /loans this priority answers every non-APPROVED status EXCEPT a FUNDED application that a Loan already references, which is deferred to priority 26 so that ERR_LOAN_ALREADY_ORIGINATED stays reachable."
    error_id: ERR_APPLICATION_INVALID_STATE
    http_status: 409
    applies_to: "POST /loan-applications/{loan_application_id}/{submit-underwriting,committee-referral,committee-decision}; POST /loans"
  - priority: 20
    category: state
    check: "Loan.servicing_status is in {PENDING_FIRST_DRAW, CONSTRUCTION_DRAW}"
    error_id: ERR_LOAN_NOT_IN_DRAW_PHASE
    http_status: 409
    applies_to: "POST /draw-requests; POST /draw-requests/{draw_request_id}/{approve,disburse,void}"
  - priority: 21
    category: state
    check: "the DrawRequest is in the state the requested transition declares as `from` in §1.2, and on a construction completion no DrawRequest of the loan has status in {SUBMITTED, APPROVED, SUSPENDED}"
    error_id: ERR_DRAW_INVALID_STATE
    http_status: 409
    applies_to: "POST /draw-requests/{draw_request_id}/{approve,disburse,reject,void,reinstate}; POST /loans/{loan_id}/construction-completion"
  - priority: 22
    category: state
    check: "the Covenant is in the state the requested transition declares as `from`, and an explicit cure additionally requires last_test_result == PASS"
    error_id: ERR_COVENANT_INVALID_STATE
    http_status: 409
    applies_to: "POST /covenants/{covenant_id}/{cure,waive}"
  - priority: 23
    category: state
    check: "the Pledge is ACTIVE for a lapse or an installment record, and LAPSED for a reinstatement"
    error_id: ERR_PLEDGE_INVALID_STATE
    http_status: 409
    applies_to: "POST /pledges/{pledge_id}/{payments,lapse,reinstate}"
  - priority: 24
    category: state
    check: "PledgeCampaign.status != CLOSED"
    error_id: ERR_CAMPAIGN_CLOSED
    http_status: 409
    applies_to: "POST /pledges; POST /pledges/{pledge_id}/{payments,reinstate}; POST /pledge-campaigns/{pledge_campaign_id}/close"
  - priority: 25
    category: state
    check: "the WorkoutPlan named in the path is PROPOSED; on POST /workout-plans there is no target plan yet, so a create is judged by the posture clause alone and any predecessor is left to priority 41. Loan.risk_posture must be in {WATCH, RESTRICTED, WORKOUT_GATED}"
    error_id: ERR_WORKOUT_INVALID_STATE
    http_status: 409
    applies_to: "POST /workout-plans; POST /workout-plans/{workout_plan_id}/approve"
  - priority: 26
    category: state
    check: "no Loan already references the application being funded; this is the answer for a repeat POST /loans on the FUNDED application that the first origination produced"
    error_id: ERR_LOAN_ALREADY_ORIGINATED
    http_status: 409
    applies_to: "POST /loans"
  - priority: 27
    category: state
    check: "Loan.servicing_status != PAID_OFF"
    error_id: ERR_LOAN_TERMINAL
    http_status: 409
    applies_to: "POST /covenants; POST /covenants/{covenant_id}/tests; POST /loans/{loan_id}/{payments,construction-completion}"

  # ---- business_safety: governance and compliance --------------------------
  - priority: 28
    category: business_safety
    check: "round_half_up(board_votes_for / board_votes_total, 4) >= Institution.bylaws_quorum_pct"
    error_id: ERR_BOARD_QUORUM_NOT_MET
    http_status: 422
    applies_to: "POST /governance-authorizations/{governance_authorization_id}/board-verification"
  - priority: 29
    category: business_safety
    check: "the amount under review does not exceed Institution.bylaws_borrowing_cap_cents (authorized_amount_cents at submit, requested_amount_cents at submit-underwriting)"
    error_id: ERR_BYLAWS_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /governance-authorizations/{governance_authorization_id}/submit; POST /loan-applications/{loan_application_id}/submit-underwriting"
  - priority: 30
    category: business_safety
    check: "GovernanceAuthorization.status == AUTHORIZED"
    error_id: ERR_GOVERNANCE_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /loan-applications/{loan_application_id}/committee-referral"
  - priority: 31
    category: business_safety
    check: "GovernanceAuthorization.expires_on >= the logical clock instant of the call"
    error_id: ERR_GOVERNANCE_AUTHORIZATION_EXPIRED
    http_status: 409
    applies_to: "POST /loan-applications/{loan_application_id}/{committee-referral,committee-decision}"
  - priority: 32
    category: business_safety
    check: "denominational_body is not null when a denominational decision is recorded, and the institution that requires denominational approval cannot reach AUTHORIZED without one"
    error_id: ERR_DENOMINATIONAL_APPROVAL_REQUIRED
    http_status: 422
    applies_to: "POST /governance-authorizations/{governance_authorization_id}/denominational-decision"
  - priority: 33
    category: business_safety
    check: "the acting X-User-ID differs from LoanApplication.prepared_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /loan-applications/{loan_application_id}/committee-decision"
  - priority: 34
    category: business_safety
    check: "CollateralAsset.asset_type != DONOR_RESTRICTED_ENDOWMENT"
    error_id: ERR_ENDOWMENT_COLLATERAL_INELIGIBLE
    http_status: 422
    applies_to: "POST /collateral-assets/{collateral_asset_id}/assignments"
  - priority: 35
    category: business_safety
    check: "CollateralAsset.appraisal_age_days <= APPRAISAL_STALE_DAYS (730)"
    error_id: ERR_COLLATERAL_APPRAISAL_STALE
    http_status: 422
    applies_to: "POST /collateral-assets/{collateral_asset_id}/assignments"

  # ---- business_temporal: interval occupation ------------------------------
  - priority: 36
    category: business_temporal
    check: "the new GivingPeriod's CLOSED interval [period_start, period_end] shares no instant with any existing period of the same institution: reject when new.period_start <= existing.period_end AND existing.period_start <= new.period_end (touching endpoints collide)"
    error_id: ERR_GIVING_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /giving-periods"
  - priority: 37
    category: business_temporal
    check: "the new lien occupation's HALF-OPEN interval [lien_effective_from, lien_effective_to) clears every prior occupation of the same asset (current assignment and every lien_history entry) after the prior interval's end is extended by LIEN_RELEASE_BUFFER_DAYS (30): reject when new.lien_effective_from < prior.effective_to + 30 days AND prior.effective_from < new.lien_effective_to"
    error_id: ERR_COLLATERAL_LIEN_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /collateral-assets/{collateral_asset_id}/assignments"

  # ---- business_referential ------------------------------------------------
  - priority: 38
    category: business_referential
    check: "at least one CollateralAsset has assigned_loan_application_id == the application and lien_position == 1"
    error_id: ERR_COLLATERAL_LINK_BROKEN
    http_status: 409
    applies_to: "POST /loan-applications/{loan_application_id}/committee-referral"
  - priority: 39
    category: business_referential
    check: "cross-referenced rows belong to the same Institution: GovernanceAuthorization.institution_id and PledgeCampaign.institution_id must equal LoanApplication.institution_id, and CollateralAsset.institution_id must equal the target application's institution_id"
    error_id: ERR_INSTITUTION_MISMATCH
    http_status: 409
    applies_to: "POST /loan-applications; POST /collateral-assets/{collateral_asset_id}/assignments"
  - priority: 40
    category: business_referential
    check: "CollateralAsset.assigned_loan_application_id is null for an assignment, and is not null for a release"
    error_id: ERR_COLLATERAL_ALREADY_ASSIGNED
    http_status: 409
    applies_to: "POST /collateral-assets/{collateral_asset_id}/{assignments,release}"
  - priority: 41
    category: business_referential
    check: "predecessor_workout_plan_id, when supplied, references a WorkoutPlan with the same loan_id and status == APPROVED"
    error_id: ERR_PREDECESSOR_WORKOUT_INVALID
    http_status: 409
    applies_to: "POST /workout-plans"

  # ---- business_constraint -------------------------------------------------
  - priority: 42
    category: business_constraint
    check: "Institution.period_count >= MIN_GIVING_PERIODS (4)"
    error_id: ERR_INSUFFICIENT_GIVING_HISTORY
    http_status: 422
    applies_to: "POST /loan-applications/{loan_application_id}/submit-underwriting"
  - priority: 43
    category: business_constraint
    check: "restricted_contributions_cents + donor_restricted_endowment_draw_cents <= total_contributions_cents"
    error_id: ERR_RESTRICTED_EXCEEDS_TOTAL
    http_status: 422
    applies_to: "POST /giving-periods"
  - priority: 44
    category: business_constraint
    check: "mission_impact_score >= PARTIAL_FORGIVENESS_MIN_SCORE (92.00) for PARTIAL_FORGIVENESS and >= FORBEARANCE_MIN_SCORE (50.00) for MISSION_IMPACT_FORBEARANCE"
    error_id: ERR_MISSION_IMPACT_SCORE_TOO_LOW
    http_status: 422
    applies_to: "POST /workout-plans/{workout_plan_id}/approve"
  - priority: 45
    category: business_constraint
    check: "every Covenant on the loan has status in {COMPLIANT, WAIVED}"
    error_id: ERR_DRAW_BLOCKED_BY_COVENANT_BREACH
    http_status: 409
    applies_to: "POST /draw-requests/{draw_request_id}/disburse"
  - priority: 46
    category: business_constraint
    check: "pledge_campaign_id is not null when purpose == PLEDGE_ADVANCE"
    error_id: ERR_PLEDGE_CAMPAIGN_REQUIRED
    http_status: 422
    applies_to: "POST /loan-applications/{loan_application_id}/submit-underwriting"

  # ---- business_fiscal -----------------------------------------------------
  - priority: 47
    category: business_fiscal
    check: "requested_amount_cents <= calculations.maximum_supportable_principal output"
    error_id: ERR_LTV_COVERAGE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /loan-applications/{loan_application_id}/committee-referral"
  - priority: 48
    category: business_fiscal
    check: "the AGGREGATE draw on the resolution stays inside it: requested_amount_cents + sum of requested_amount_cents over OTHER LoanApplications carrying the same governance_authorization_id whose status is in {APPROVED, FUNDED} <= GovernanceAuthorization.authorized_amount_cents. Priority 47 already caps a single request at the authorized amount, so only the aggregate can breach here."
    error_id: ERR_AUTHORIZED_AMOUNT_EXCEEDED
    http_status: 422
    applies_to: "POST /loan-applications/{loan_application_id}/committee-decision with decision == APPROVE"
  - priority: 49
    category: business_fiscal
    check: "the draw amount is within the free commitment: requested_amount_cents (create) or approved_amount_cents (approve, reinstate) <= Loan.undrawn_commitment_cents - Loan.reserved_draw_cents"
    error_id: ERR_DRAW_EXCEEDS_COMMITMENT
    http_status: 422
    applies_to: "POST /draw-requests; POST /draw-requests/{draw_request_id}/{approve,reinstate}"
  - priority: 50
    category: business_fiscal
    check: "bucket 3 of calculations.draw_net_disbursement is strictly greater than 0"
    error_id: ERR_DRAW_NET_NONPOSITIVE
    http_status: 422
    applies_to: "POST /draw-requests/{draw_request_id}/disburse"
  - priority: 51
    category: business_fiscal
    check: "forgiveness_amount_cents <= Loan.outstanding_principal_cents"
    error_id: ERR_FORGIVENESS_EXCEEDS_OUTSTANDING
    http_status: 422
    applies_to: "POST /workout-plans/{workout_plan_id}/approve"
  - priority: 52
    category: business_fiscal
    check: "amount_cents <= Loan.outstanding_principal_cents"
    error_id: ERR_PAYMENT_EXCEEDS_OUTSTANDING
    http_status: 422
    applies_to: "POST /loans/{loan_id}/payments"

# ============================================================================
# §1.5 API Endpoint Table
#      Flat topology: every collection is a root-level peer (api_prefix: "").
#      Every FK declared in §1.1 is reverse-reachable through the filtered-list
#      form (`GET /<children>` with `<fk_field>?` in input, output <Child>[]).
# ============================================================================

endpoints:
  # ---- Institution ---------------------------------------------------------
  - method: POST
    path: "/institutions"
    description: "Onboards a borrowing congregation, school, agency or ministry with its bylaws borrowing cap, quorum requirement and denominational-approval obligation."
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, institution_type, denomination_code, "requires_denominational_approval?", bylaws_borrowing_cap_cents, bylaws_quorum_pct, "community_program_count?", "endowment_market_value_cents?"]
    output: Institution
    side_effects:
      - "initializes audited_period_count, period_count, unrestricted_giving_base_cents, net_available_for_debt_service_dollars and cumulative_forgiveness_cents to 0"
      - "defaults requires_denominational_approval to false, community_program_count to 0 and endowment_market_value_cents to 0 when omitted"
  - method: GET
    path: "/institutions/{institution_id}"
    description: "Reads one institution including its computed giving aggregates."
    roles: [PlatformAdmin, CreditAnalyst, CreditCommitteeMember, LoanServicer, InstitutionRepresentative]
    code: 200
    input: []
    output: Institution
    side_effects: []
  - method: GET
    path: "/institutions"
    description: "Lists institutions, newest first by created_at DESC, with offset pagination."
    roles: [PlatformAdmin, CreditAnalyst, CreditCommitteeMember, LoanServicer]
    code: 200
    input: ["institution_type?", "denomination_code?", "limit?", "offset?"]
    output: Institution[]
    side_effects: []

  # ---- GivingPeriod --------------------------------------------------------
  - method: POST
    path: "/giving-periods"
    description: "Records one fiscal period of contributions, restricted giving, endowment draw, operating expense and member households for an institution. Periods are CLOSED intervals and may not touch or overlap another period of the same institution."
    roles: [CreditAnalyst, InstitutionRepresentative]
    code: 201
    input: [institution_id, period_label, period_start, period_end, source, total_contributions_cents, restricted_contributions_cents, donor_restricted_endowment_draw_cents, operating_expense_cents, member_household_count]
    output: GivingPeriod
    side_effects:
      - "computes unrestricted_contributions_cents and net_available_for_debt_service_cents"
      - "increments Institution.period_count, and Institution.audited_period_count when source == AUDITED"
      - "recomputes Institution.unrestricted_giving_base_cents, net_available_for_debt_service_dollars and membership_trend_pct"
      - "increments Institution.version by 1"
  - method: GET
    path: "/giving-periods/{giving_period_id}"
    description: "Reads one giving period."
    roles: [PlatformAdmin, CreditAnalyst, CreditCommitteeMember, LoanServicer, InstitutionRepresentative]
    code: 200
    input: []
    output: GivingPeriod
    side_effects: []
  - method: GET
    path: "/giving-periods"
    description: "Lists giving periods, ordered period_end DESC then created_at ASC. Reverse-reachability for GivingPeriod.institution_id."
    roles: [PlatformAdmin, CreditAnalyst, CreditCommitteeMember, LoanServicer, InstitutionRepresentative]
    code: 200
    input: ["institution_id?", "source?", "limit?", "offset?"]
    output: GivingPeriod[]
    side_effects: []

  # ---- GovernanceAuthorization --------------------------------------------
  - method: POST
    path: "/governance-authorizations"
    description: "Opens a DRAFT governance packet capturing the board resolution, the bylaws citation, the vote tally, the authorized amount and the expiry of the authority to borrow."
    roles: [InstitutionRepresentative]
    code: 201
    input: [institution_id, resolution_date, bylaws_citation, board_votes_for, board_votes_total, authorized_amount_cents, "denominational_body?", expires_on]
    output: GovernanceAuthorization
    side_effects:
      - "sets status to DRAFT and revision_round to 0"
  - method: GET
    path: "/governance-authorizations/{governance_authorization_id}"
    description: "Reads one governance packet."
    roles: [PlatformAdmin, GovernanceOfficer, CreditAnalyst, CreditCommitteeMember, InstitutionRepresentative]
    code: 200
    input: []
    output: GovernanceAuthorization
    side_effects: []
  - method: GET
    path: "/governance-authorizations"
    description: "Lists governance packets, newest first by created_at DESC. Reverse-reachability for GovernanceAuthorization.institution_id."
    roles: [PlatformAdmin, GovernanceOfficer, CreditAnalyst, CreditCommitteeMember, InstitutionRepresentative]
    code: 200
    input: ["institution_id?", "status?", "limit?", "offset?"]
    output: GovernanceAuthorization[]
    side_effects: []
  - method: POST
    path: "/governance-authorizations/{governance_authorization_id}/submit"
    description: "Submits a DRAFT packet for governance review; rejects a resolution authorizing more than the bylaws borrowing cap."
    roles: [InstitutionRepresentative]
    code: 200
    input: []
    output: GovernanceAuthorization
    side_effects:
      - "transitions status DRAFT -> SUBMITTED"
      - "increments version by 1"
  - method: POST
    path: "/governance-authorizations/{governance_authorization_id}/board-verification"
    description: "Records the governance officer's verification of the board vote. Lands on BOARD_VERIFIED when the institution requires denominational approval and on AUTHORIZED when it does not."
    roles: [GovernanceOfficer]
    code: 200
    input: [minutes_reference]
    output: GovernanceAuthorization
    side_effects:
      - "sets board_quorum_pct and verified_by_user_id"
      - "transitions status SUBMITTED -> BOARD_VERIFIED or SUBMITTED -> AUTHORIZED per Institution.requires_denominational_approval"
      - "increments version by 1"
  - method: POST
    path: "/governance-authorizations/{governance_authorization_id}/denominational-decision"
    description: "Records the presbytery/synod/conference decision on a BOARD_VERIFIED packet."
    roles: [GovernanceOfficer]
    code: 200
    input: [decision, "note?"]
    output: GovernanceAuthorization
    side_effects:
      - "sets denominational_decision_note"
      - "transitions status BOARD_VERIFIED -> AUTHORIZED on APPROVE or BOARD_VERIFIED -> DENOM_REJECTED on REJECT"
      - "increments version by 1"
  - method: POST
    path: "/governance-authorizations/{governance_authorization_id}/return-to-draft"
    description: "Returns a denominationally rejected packet to DRAFT for rework, closing the governance cycle."
    roles: [InstitutionRepresentative]
    code: 200
    input: [rework_note]
    output: GovernanceAuthorization
    side_effects:
      - "transitions status DENOM_REJECTED -> DRAFT"
      - "increments revision_round by 1 and clears denominational_decision_note and verified_by_user_id"
      - "increments version by 1"

  # ---- PledgeCampaign -----------------------------------------------------
  - method: POST
    path: "/pledge-campaigns"
    description: "Launches a capital campaign with its announced goal, pledge window and the sponsor's own historical collection rate."
    roles: [InstitutionRepresentative]
    code: 201
    input: [institution_id, campaign_name, goal_cents, pledge_period_months, sponsor_collection_rate_bps]
    output: PledgeCampaign
    side_effects:
      - "sets status to OPEN and every pledged/collected bucket and both projected values to 0"
  - method: GET
    path: "/pledge-campaigns/{pledge_campaign_id}"
    description: "Reads one campaign including its pledged-dollar buckets and both projected values."
    roles: [PlatformAdmin, CreditAnalyst, CreditCommitteeMember, LoanServicer, InstitutionRepresentative]
    code: 200
    input: []
    output: PledgeCampaign
    side_effects: []
  - method: GET
    path: "/pledge-campaigns"
    description: "Lists campaigns, newest first by created_at DESC. Reverse-reachability for PledgeCampaign.institution_id."
    roles: [PlatformAdmin, CreditAnalyst, CreditCommitteeMember, LoanServicer, InstitutionRepresentative]
    code: 200
    input: ["institution_id?", "status?", "limit?", "offset?"]
    output: PledgeCampaign[]
    side_effects: []
  - method: POST
    path: "/pledge-campaigns/{pledge_campaign_id}/close"
    description: "Closes an OPEN or UNDERPERFORMING campaign; no further pledge or installment activity is accepted afterwards."
    roles: [InstitutionRepresentative]
    code: 200
    input: ["close_note?"]
    output: PledgeCampaign
    side_effects:
      - "transitions status OPEN -> CLOSED or UNDERPERFORMING -> CLOSED"
      - "increments version by 1"
  - method: GET
    path: "/pledge-campaigns/{pledge_campaign_id}/valuation"
    description: "Computed read: returns calculations.pledge_campaign_projected_value under the requested basis (default LENDER_CONSERVATIVE) together with the bucket totals it was derived from."
    roles: [PlatformAdmin, CreditAnalyst, CreditCommitteeMember, LoanServicer, InstitutionRepresentative]
    code: 200
    input: ["basis?"]
    output:
      basis: "LENDER_CONSERVATIVE | SPONSOR_OPTIMISTIC — echo of the applied basis"
      projected_value_cents: "integer — calculations.pledge_campaign_projected_value under `basis`"
      collected_to_date_cents: "integer"
      active_pledged_cents: "integer"
      lapsed_pledged_cents: "integer"
      fulfilled_pledged_cents: "integer"
      total_pledged_cents: "integer"
      goal_cents: "integer"
      underperform_threshold_cents: "integer — floor(goal_cents * CAMPAIGN_UNDERPERFORM_PCT)"
      maturity_threshold_cents: "integer — floor(goal_cents * CAMPAIGN_MATURITY_PCT)"
      status: "OPEN | UNDERPERFORMING | CLOSED"
    side_effects: []

  # ---- Pledge -------------------------------------------------------------
  - method: POST
    path: "/pledges"
    description: "Records a donor pledge against an open campaign. OCC: expected_pledge_campaign_version must equal the campaign's current version, because every pledge shifts the campaign's buckets and projected values."
    roles: [InstitutionRepresentative, CreditAnalyst]
    code: 201
    input: [pledge_campaign_id, donor_tier, pledged_amount_cents, installment_count, expected_pledge_campaign_version]
    output: Pledge
    side_effects:
      - "sets status to ACTIVE, collected_cents, payments_made_count and missed_payments_count to 0 and effective_attrition_pct to the tier rate"
      - "increases PledgeCampaign.total_pledged_cents and active_pledged_cents by pledged_amount_cents"
      - "recomputes PledgeCampaign.attrition_adjusted_value_cents and sponsor_projected_value_cents; may drive OPEN -> UNDERPERFORMING once the maturity gate is met"
      - "increments PledgeCampaign.version by 1"
  - method: GET
    path: "/pledges/{pledge_id}"
    description: "Reads one pledge including its collection counters and effective attrition rate."
    roles: [PlatformAdmin, CreditAnalyst, CreditCommitteeMember, LoanServicer, InstitutionRepresentative]
    code: 200
    input: []
    output: Pledge
    side_effects: []
  - method: GET
    path: "/pledges"
    description: "Lists pledges, ordered created_at ASC. Reverse-reachability for Pledge.pledge_campaign_id."
    roles: [PlatformAdmin, CreditAnalyst, CreditCommitteeMember, LoanServicer, InstitutionRepresentative]
    code: 200
    input: ["pledge_campaign_id?", "donor_tier?", "status?", "limit?", "offset?"]
    output: Pledge[]
    side_effects: []
  - method: POST
    path: "/pledges/{pledge_id}/payments"
    description: "Records one installment outcome against an ACTIVE pledge. outcome PAID requires amount_cents > 0; outcome MISSED requires amount_cents == 0 and can auto-lapse the pledge at the third miss."
    roles: [LoanServicer, InstitutionRepresentative]
    code: 200
    input: [installment_month, outcome, amount_cents]
    output: Pledge
    side_effects:
      - "on PAID: increases collected_cents by amount_cents and payments_made_count by 1; on MISSED: increases missed_payments_count by 1"
      - "recomputes effective_attrition_pct (tier rate + MISSED_PAYMENT_PENALTY_PCT once missed_payments_count >= 2, capped at ATTRITION_RATE_CEILING)"
      - "may transition ACTIVE -> FULFILLED (collected_cents >= pledged_amount_cents) or ACTIVE -> LAPSED (missed_payments_count == AUTO_LAPSE_MISSED_COUNT)"
      - "recomputes the campaign's buckets and both projected values and increments PledgeCampaign.version by 1"
  - method: POST
    path: "/pledges/{pledge_id}/lapse"
    description: "Lapses an ACTIVE pledge on servicer judgement, moving its pledged dollars from the active bucket to the lapsed bucket."
    roles: [LoanServicer]
    code: 200
    input: [lapse_reason]
    output: Pledge
    side_effects:
      - "transitions status ACTIVE -> LAPSED and stores lapse_reason"
      - "moves pledged_amount_cents from PledgeCampaign.active_pledged_cents to lapsed_pledged_cents and recomputes both projected values"
      - "may drive the campaign OPEN -> UNDERPERFORMING, which pushes PLEDGE_ADVANCE applications in UNDERWRITING to REVISION_REQUESTED"
      - "increments version by 1 on the pledge and on the campaign"
  - method: POST
    path: "/pledges/{pledge_id}/reinstate"
    description: "Compensating action for a lapse: returns a LAPSED pledge to ACTIVE on a non-closed campaign, restoring the pledged-dollar conservation identity bucket for bucket."
    roles: [LoanServicer]
    code: 200
    input: [reinstatement_note]
    output: Pledge
    side_effects:
      - "transitions status LAPSED -> ACTIVE, clears lapse_reason and preserves collected_cents, payments_made_count and missed_payments_count exactly"
      - "moves pledged_amount_cents from PledgeCampaign.lapsed_pledged_cents back to active_pledged_cents and recomputes both projected values"
      - "may drive the campaign UNDERPERFORMING -> OPEN"
      - "increments version by 1 on the pledge and on the campaign"

  # ---- CollateralAsset ----------------------------------------------------
  - method: POST
    path: "/collateral-assets"
    description: "Registers a special-purpose property with its appraisal and its alternative-use score, valuing it immediately under calculations.collateral_special_purpose_lending_value as if it would take a first lien."
    roles: [CreditAnalyst, InstitutionRepresentative]
    code: 201
    input: [institution_id, asset_type, description_label, appraised_value_cents, appraisal_date, alternative_use_score]
    output: CollateralAsset
    side_effects:
      - "computes appraisal_age_days against the logical clock and lending_value_cents (0 for DONOR_RESTRICTED_ENDOWMENT)"
      - "leaves assigned_loan_application_id, lien_position, lien_effective_from and lien_effective_to null and lien_history empty"
  - method: GET
    path: "/collateral-assets/{collateral_asset_id}"
    description: "Reads one collateral asset including its current lien occupation, its released-occupation history and its lending value."
    roles: [PlatformAdmin, CreditAnalyst, CreditCommitteeMember, LoanServicer, InstitutionRepresentative]
    code: 200
    input: []
    output: CollateralAsset
    side_effects: []
  - method: GET
    path: "/collateral-assets"
    description: "Lists collateral assets, newest first by created_at DESC. Reverse-reachability for CollateralAsset.institution_id and CollateralAsset.assigned_loan_application_id."
    roles: [PlatformAdmin, CreditAnalyst, CreditCommitteeMember, LoanServicer, InstitutionRepresentative]
    code: 200
    input: ["institution_id?", "assigned_loan_application_id?", "asset_type?", "limit?", "offset?"]
    output: CollateralAsset[]
    side_effects: []
  - method: POST
    path: "/collateral-assets/{collateral_asset_id}/assignments"
    description: "Pledges an unassigned asset to a loan application for a half-open lien window [lien_effective_from, lien_effective_to). Bars donor-restricted endowment assets outright, refuses appraisals older than APPRAISAL_STALE_DAYS, and refuses a window that lands inside another occupation extended by the 30-day release buffer."
    roles: [CreditAnalyst]
    code: 200
    input: [loan_application_id, lien_position, lien_effective_from, lien_effective_to]
    output: CollateralAsset
    side_effects:
      - "sets assigned_loan_application_id, lien_position, lien_effective_from and lien_effective_to"
      - "re-runs calculations.collateral_special_purpose_lending_value with the assigned lien factor and rewrites lending_value_cents"
      - "increments version by 1"
  - method: POST
    path: "/collateral-assets/{collateral_asset_id}/release"
    description: "Releases the current lien occupation, appending it to lien_history and returning the asset to unassigned."
    roles: [CreditAnalyst]
    code: 200
    input: [release_note]
    output: CollateralAsset
    side_effects:
      - "appends { loan_application_id, lien_position, effective_from, effective_to, released_at } to lien_history"
      - "clears assigned_loan_application_id, lien_position, lien_effective_from and lien_effective_to to null"
      - "re-values the asset at first-lien factor and rewrites lending_value_cents"
      - "increments version by 1"

  # ---- LoanApplication ----------------------------------------------------
  - method: POST
    path: "/loan-applications"
    description: "Opens a DRAFT credit request tied to a governance packet, optionally backed by a capital campaign for a PLEDGE_ADVANCE. Every cross-referenced row must belong to the same institution."
    roles: [CreditAnalyst, InstitutionRepresentative]
    code: 201
    input: [institution_id, governance_authorization_id, "pledge_campaign_id?", purpose, requested_amount_cents, term_months, interest_rate_bps]
    output: LoanApplication
    side_effects:
      - "sets status to DRAFT, revision_count to 0 and every snapshot field (giving_basis, giving_base_cents, net_available_dollars, collateral_lending_value_cents, max_supportable_principal_cents, prepared_by_user_id, decided_by_user_id, revision_reason) to null"
  - method: GET
    path: "/loan-applications/{loan_application_id}"
    description: "Reads one application including its underwriting snapshots and its segregation-of-duties audit fields."
    roles: [PlatformAdmin, CreditAnalyst, CreditCommitteeMember, LoanServicer, InstitutionRepresentative]
    code: 200
    input: []
    output: LoanApplication
    side_effects: []
  - method: GET
    path: "/loan-applications"
    description: "Lists applications, newest first by created_at DESC. Reverse-reachability for LoanApplication.institution_id, LoanApplication.governance_authorization_id and LoanApplication.pledge_campaign_id."
    roles: [PlatformAdmin, CreditAnalyst, CreditCommitteeMember, LoanServicer, InstitutionRepresentative]
    code: 200
    input: ["institution_id?", "governance_authorization_id?", "pledge_campaign_id?", "status?", "purpose?", "limit?", "offset?"]
    output: LoanApplication[]
    side_effects: []
  - method: POST
    path: "/loan-applications/{loan_application_id}/submit-underwriting"
    description: "Moves a DRAFT or REVISION_REQUESTED application into UNDERWRITING, snapshotting the giving basis, the unrestricted giving base and the net-available-for-debt-service figure. Requires at least MIN_GIVING_PERIODS recorded periods."
    roles: [CreditAnalyst]
    code: 200
    input: ["analyst_note?"]
    output: LoanApplication
    side_effects:
      - "runs calculations.institution_unrestricted_giving_base and calculations.net_available_for_debt_service_dollars and snapshots giving_basis, giving_base_cents and net_available_dollars"
      - "sets prepared_by_user_id to the acting X-User-ID and clears revision_reason"
      - "transitions status DRAFT -> UNDERWRITING or REVISION_REQUESTED -> UNDERWRITING"
      - "increments version by 1"
  - method: POST
    path: "/loan-applications/{loan_application_id}/committee-referral"
    description: "Refers an underwritten application to committee. Requires an AUTHORIZED, unexpired governance packet, a first-lien collateral assignment, and a requested amount within calculations.maximum_supportable_principal."
    roles: [CreditAnalyst]
    code: 200
    input: ["referral_note?"]
    output: LoanApplication
    side_effects:
      - "snapshots collateral_lending_value_cents over first-lien assigned assets"
      - "runs calculations.maximum_supportable_principal and snapshots max_supportable_principal_cents"
      - "transitions status UNDERWRITING -> COMMITTEE_REVIEW"
      - "increments version by 1"
  - method: POST
    path: "/loan-applications/{loan_application_id}/committee-decision"
    description: "Records the committee's APPROVE, DECLINE or REQUEST_REVISION decision. The analyst who prepared the underwriting may not decide (segregation of duties)."
    roles: [CreditCommitteeMember]
    code: 200
    input: [decision, "note?"]
    output: LoanApplication
    side_effects:
      - "sets decided_by_user_id to the acting X-User-ID"
      - "APPROVE: transitions COMMITTEE_REVIEW -> APPROVED after re-checking the packet expiry and the AGGREGATE authorized amount across the other APPROVED/FUNDED applications on the same resolution"
      - "DECLINE: transitions COMMITTEE_REVIEW -> DECLINED and releases every collateral assignment on the application into lien_history"
      - "REQUEST_REVISION: transitions COMMITTEE_REVIEW -> REVISION_REQUESTED, increments revision_count and keeps every collateral assignment intact"
      - "increments version by 1"
  - method: GET
    path: "/loan-applications/{loan_application_id}/underwriting-summary"
    description: "Computed read: re-runs the giving base, the net-available figure and the maximum supportable principal under the requested basis (default: the application's snapshotted giving_basis, or the mandated basis when no snapshot exists) without mutating the application."
    roles: [PlatformAdmin, CreditAnalyst, CreditCommitteeMember, InstitutionRepresentative]
    code: 200
    input: ["giving_basis?"]
    output:
      giving_basis: "AUDITED_ONLY | BLENDED — echo of the applied basis"
      period_count: "integer — Institution.period_count"
      audited_period_count: "integer — Institution.audited_period_count"
      window_period_labels: "string[] — the four period_labels used, ordered period_end DESC"
      giving_base_cents: "integer — calculations.institution_unrestricted_giving_base under `giving_basis`"
      net_available_dollars: "integer — calculations.net_available_for_debt_service_dollars under `giving_basis`, per-period rounding order"
      membership_trend_pct: "number — four decimal places"
      collateral_lending_value_cents: "integer — sum over first-lien assigned assets"
      max_supportable_principal_cents: "integer — calculations.maximum_supportable_principal"
      binding_cap: "DEBT_SERVICE | COLLATERAL | BYLAWS_CAP | AUTHORIZED_AMOUNT | PLEDGE_ADVANCE_LTV — which cap produced the minimum; on a tie the FIRST cap achieving the minimum in the fixed order [DEBT_SERVICE, COLLATERAL, BYLAWS_CAP, AUTHORIZED_AMOUNT, PLEDGE_ADVANCE_LTV] is reported"
      requested_amount_cents: "integer"
    side_effects: []

  # ---- Loan ---------------------------------------------------------------
  - method: POST
    path: "/loans"
    description: "Originates the loan for an APPROVED application, copying principal, term and giving basis, and opening the commitment ledger at PENDING_FIRST_DRAW / OPEN."
    roles: [LoanServicer]
    code: 201
    input: [loan_application_id, annual_debt_service_cents, interest_reserve_shortfall_cents]
    output: Loan
    side_effects:
      - "sets principal_cents and undrawn_commitment_cents to LoanApplication.requested_amount_cents and copies term_months and giving_basis"
      - "sets servicing_status to PENDING_FIRST_DRAW and risk_posture to OPEN, with every other ledger field 0"
      - "transitions LoanApplication.status APPROVED -> FUNDED and increments its version by 1"
  - method: GET
    path: "/loans/{loan_id}"
    description: "Reads one loan including both state dimensions and every commitment-ledger bucket."
    roles: [PlatformAdmin, CreditAnalyst, CreditCommitteeMember, LoanServicer, InstitutionRepresentative]
    code: 200
    input: []
    output: Loan
    side_effects: []
  - method: GET
    path: "/loans"
    description: "Lists loans, newest first by created_at DESC. Reverse-reachability for Loan.loan_application_id."
    roles: [PlatformAdmin, CreditAnalyst, CreditCommitteeMember, LoanServicer, InstitutionRepresentative]
    code: 200
    input: ["loan_application_id?", "servicing_status?", "risk_posture?", "limit?", "offset?"]
    output: Loan[]
    side_effects: []
  - method: POST
    path: "/loans/{loan_id}/payments"
    description: "Applies a principal payment to an AMORTIZING or drawing loan; the loan reaches PAID_OFF when outstanding principal hits 0 from AMORTIZING."
    roles: [LoanServicer]
    code: 200
    input: [amount_cents, payment_date]
    output: Loan
    side_effects:
      - "increases principal_repaid_cents by amount_cents and decreases outstanding_principal_cents by the same amount"
      - "transitions servicing_status AMORTIZING -> PAID_OFF when outstanding_principal_cents reaches 0"
      - "increments version by 1"
  - method: POST
    path: "/loans/{loan_id}/construction-completion"
    description: "Closes out the construction phase: cancels the undrawn commitment, releases held retainage and moves the loan to AMORTIZING. Requires no open draw in SUBMITTED, APPROVED or SUSPENDED."
    roles: [LoanServicer]
    code: 200
    input: [final_inspection_passed, "completion_note?"]
    output: Loan
    side_effects:
      - "moves undrawn_commitment_cents into cancelled_commitment_cents and zeroes it"
      - "moves retainage_held_cents into retainage_released_cents and zeroes it"
      - "transitions servicing_status PENDING_FIRST_DRAW -> AMORTIZING or CONSTRUCTION_DRAW -> AMORTIZING"
      - "increments version by 1"

  # ---- DrawRequest --------------------------------------------------------
  - method: POST
    path: "/draw-requests"
    description: "Submits a construction draw request against a loan still in its draw phase, sized within the free commitment (undrawn less already-reserved)."
    roles: [LoanServicer, InstitutionRepresentative]
    code: 201
    input: [loan_id, project_phase, requested_amount_cents, percent_complete]
    output: DrawRequest
    side_effects:
      - "sets status to SUBMITTED and leaves approved_amount_cents and every waterfall field null"
  - method: GET
    path: "/draw-requests/{draw_request_id}"
    description: "Reads one draw request including the stored waterfall breakdown once disbursed."
    roles: [PlatformAdmin, CreditAnalyst, CreditCommitteeMember, LoanServicer, InstitutionRepresentative]
    code: 200
    input: []
    output: DrawRequest
    side_effects: []
  - method: GET
    path: "/draw-requests"
    description: "Lists draw requests, ordered created_at ASC. Reverse-reachability for DrawRequest.loan_id."
    roles: [PlatformAdmin, CreditAnalyst, CreditCommitteeMember, LoanServicer, InstitutionRepresentative]
    code: 200
    input: ["loan_id?", "status?", "project_phase?", "limit?", "offset?"]
    output: DrawRequest[]
    side_effects: []
  - method: POST
    path: "/draw-requests/{draw_request_id}/approve"
    description: "Approves a submitted draw at or below the requested amount, reserving the approved amount against the loan's commitment."
    roles: [LoanServicer]
    code: 200
    input: [approved_amount_cents, inspector_note]
    output: DrawRequest
    side_effects:
      - "sets approved_amount_cents and inspector_note and transitions status SUBMITTED -> APPROVED"
      - "increases Loan.reserved_draw_cents by approved_amount_cents"
      - "increments version by 1 on the draw and on the loan"
  - method: POST
    path: "/draw-requests/{draw_request_id}/disburse"
    description: "Disburses an approved draw through calculations.draw_net_disbursement (post-draw retainage tier, then the interest-reserve / inspection-fee / net-to-borrower waterfall). Blocked while any covenant on the loan is breached."
    roles: [LoanServicer]
    code: 200
    input: ["disbursement_date?"]
    output: DrawRequest
    side_effects:
      - "stores completion_pct_at_disbursement, retainage_cents, interest_reserve_applied_cents, inspection_fee_cents and net_disbursed_cents and transitions status APPROVED -> DISBURSED"
      - "decreases Loan.reserved_draw_cents, increases Loan.disbursed_principal_cents and Loan.outstanding_principal_cents, decreases Loan.undrawn_commitment_cents, increases Loan.retainage_held_cents and decreases Loan.interest_reserve_shortfall_cents"
      - "drives Loan.servicing_status PENDING_FIRST_DRAW -> CONSTRUCTION_DRAW on the first disbursement"
      - "increments version by 1 on the draw and on the loan"
  - method: POST
    path: "/draw-requests/{draw_request_id}/reject"
    description: "Rejects a submitted draw on inspection; no ledger field moves."
    roles: [LoanServicer]
    code: 200
    input: [inspector_note]
    output: DrawRequest
    side_effects:
      - "sets inspector_note and transitions status SUBMITTED -> REJECTED"
      - "increments version by 1"
  - method: POST
    path: "/draw-requests/{draw_request_id}/void"
    description: "Compensating action for a disbursement: unwinds every ledger movement the disbursement made and voids the draw."
    roles: [LoanServicer]
    code: 200
    input: [void_reason]
    output: DrawRequest
    side_effects:
      - "sets void_reason and transitions status DISBURSED -> VOIDED"
      - "reverses the disbursement on the loan bucket for bucket: disbursed_principal_cents, undrawn_commitment_cents, outstanding_principal_cents, retainage_held_cents and interest_reserve_shortfall_cents"
      - "drives Loan.servicing_status CONSTRUCTION_DRAW -> PENDING_FIRST_DRAW when disbursed_principal_cents reaches 0"
      - "increments version by 1 on the draw and on the loan"
  - method: POST
    path: "/draw-requests/{draw_request_id}/reinstate"
    description: "Explicit compensating call for a covenant-driven suspension: returns a SUSPENDED draw to APPROVED once the loan's risk posture has recovered to OPEN or WATCH and the free commitment still covers it."
    roles: [LoanServicer]
    code: 200
    input: [reinstatement_note]
    output: DrawRequest
    side_effects:
      - "transitions status SUSPENDED -> APPROVED"
      - "increases Loan.reserved_draw_cents by approved_amount_cents"
      - "increments version by 1 on the draw and on the loan"

  # ---- Covenant -----------------------------------------------------------
  - method: POST
    path: "/covenants"
    description: "Writes a financial covenant on a live loan, starting COMPLIANT with no test history."
    roles: [CreditAnalyst]
    code: 201
    input: [loan_id, covenant_type, threshold_ratio, test_frequency]
    output: Covenant
    side_effects:
      - "sets status to COMPLIANT, every counter to 0 and every last_test_* field to null"
      - "re-runs calculations.loan_risk_posture on the loan (no posture change: the new covenant is COMPLIANT)"
  - method: GET
    path: "/covenants/{covenant_id}"
    description: "Reads one covenant including the numerator, denominator, ratio and result of its most recent test."
    roles: [PlatformAdmin, CreditAnalyst, CreditCommitteeMember, LoanServicer, InstitutionRepresentative]
    code: 200
    input: []
    output: Covenant
    side_effects: []
  - method: GET
    path: "/covenants"
    description: "Lists covenants, ordered created_at ASC. Reverse-reachability for Covenant.loan_id."
    roles: [PlatformAdmin, CreditAnalyst, CreditCommitteeMember, LoanServicer, InstitutionRepresentative]
    code: 200
    input: ["loan_id?", "covenant_type?", "status?", "limit?", "offset?"]
    output: Covenant[]
    side_effects: []
  - method: POST
    path: "/covenants/{covenant_id}/tests"
    description: "Runs the covenant test as of a date, computing the DSCR numerator with the pinned per-period-then-sum rounding order and comparing the ratio inclusively against threshold_ratio."
    roles: [LoanServicer]
    code: 200
    input: [as_of_date]
    output: Covenant
    side_effects:
      - "stores last_test_as_of, last_test_numerator_dollars, last_test_denominator_dollars, last_test_ratio and last_test_result and increments test_count by 1"
      - "updates consecutive_fail_count and moves status along the breach cycle (COMPLIANT -> BREACH_PENDING_CURE -> BREACHED on consecutive failures; BREACH_PENDING_CURE -> COMPLIANT on a pass; BREACHED -> BREACHED recording the pass that a cure requires as evidence)"
      - "re-runs calculations.loan_risk_posture, which can move Loan.risk_posture OPEN -> WATCH -> RESTRICTED and, on reaching RESTRICTED, suspend every APPROVED draw and release its reserved commitment"
      - "increments version by 1 on the covenant and on the loan whenever the posture changes"
  - method: POST
    path: "/covenants/{covenant_id}/cure"
    description: "Files cure evidence against a breached covenant. Requires last_test_result == PASS — a passing test alone never lifts a hard breach."
    roles: [LoanServicer]
    code: 200
    input: [cure_evidence_note]
    output: Covenant
    side_effects:
      - "stores cure_evidence_note, resets consecutive_fail_count to 0 and transitions status BREACH_PENDING_CURE -> COMPLIANT or BREACHED -> COMPLIANT"
      - "re-runs calculations.loan_risk_posture, which may move Loan.risk_posture RESTRICTED -> WATCH or RESTRICTED -> OPEN"
      - "increments version by 1 on the covenant and on the loan whenever the posture changes"
  - method: POST
    path: "/covenants/{covenant_id}/waive"
    description: "Grants a committee waiver on a hard-breached covenant."
    roles: [CreditCommitteeMember]
    code: 200
    input: [waiver_note]
    output: Covenant
    side_effects:
      - "increments waiver_count by 1 and transitions status BREACHED -> WAIVED"
      - "re-runs calculations.loan_risk_posture, which may move Loan.risk_posture RESTRICTED -> WATCH or RESTRICTED -> OPEN"
      - "increments version by 1 on the covenant and on the loan whenever the posture changes"

  # ---- WorkoutPlan --------------------------------------------------------
  - method: POST
    path: "/workout-plans"
    description: "Proposes a workout treatment on a distressed loan, scoring mission and community impact at creation. OCC: expected_loan_version must equal the loan's current version, since posture, term and outstanding principal all move underneath a proposal."
    roles: [LoanServicer]
    code: 201
    input: [loan_id, "predecessor_workout_plan_id?", option, "deferral_months?", "extension_months?", "forgiveness_amount_cents?", denominational_support_letter, narrative, expected_loan_version]
    output: WorkoutPlan
    side_effects:
      - "runs calculations.mission_impact_score and freezes mission_impact_score, membership_trend_points, giving_trend_points, community_points and denominational_points on the plan"
      - "sets status to PROPOSED; no Loan ledger field moves at proposal time"
  - method: GET
    path: "/workout-plans/{workout_plan_id}"
    description: "Reads one workout plan including its frozen mission-impact components."
    roles: [PlatformAdmin, CreditAnalyst, CreditCommitteeMember, LoanServicer, InstitutionRepresentative]
    code: 200
    input: []
    output: WorkoutPlan
    side_effects: []
  - method: GET
    path: "/workout-plans"
    description: "Lists workout plans, ordered created_at ASC. Reverse-reachability for WorkoutPlan.loan_id and WorkoutPlan.predecessor_workout_plan_id."
    roles: [PlatformAdmin, CreditAnalyst, CreditCommitteeMember, LoanServicer, InstitutionRepresentative]
    code: 200
    input: ["loan_id?", "predecessor_workout_plan_id?", "option?", "status?", "limit?", "offset?"]
    output: WorkoutPlan[]
    side_effects: []
  - method: POST
    path: "/workout-plans/{workout_plan_id}/approve"
    description: "Approves a proposed workout. PARTIAL_FORGIVENESS requires a mission-impact score of at least 92.00 and MISSION_IMPACT_FORBEARANCE at least 50.00; approval gates the loan at WORKOUT_GATED and supersedes the predecessor plan."
    roles: [CreditCommitteeMember]
    code: 200
    input: ["approval_note?"]
    output: WorkoutPlan
    side_effects:
      - "sets approved_by_user_id and transitions status PROPOSED -> APPROVED"
      - "TERM_EXTENSION: extends Loan.term_months and rescales Loan.annual_debt_service_cents to floor(old_annual_debt_service_cents * old_term_months / new_term_months)"
      - "PAYMENT_DEFERRAL: increases Loan.deferred_payments_count by deferral_months"
      - "PARTIAL_FORGIVENESS: increases Loan.forgiven_principal_cents and Institution.cumulative_forgiveness_cents and reduces Loan.outstanding_principal_cents by forgiveness_amount_cents"
      - "transitions any predecessor plan APPROVED -> SUPERSEDED"
      - "re-runs calculations.loan_risk_posture, moving Loan.risk_posture to WORKOUT_GATED"
      - "increments version by 1 on the plan, on the loan and on any superseded predecessor"

  # ---- test-driving endpoint (last rung of the §1.5 priority ladder) -------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock, which every appraisal-age, authorization-expiry, giving-window and lien-window rule reads. The clock's startup default is exactly 2026-08-01T00:00:00Z and it MUST NOT fall back to wall-clock time before any call to this endpoint."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output:
      current_utc: "string — ISO 8601 UTC instant the logical clock now reports"
    side_effects:
      - "rebases every subsequent computation of CollateralAsset.appraisal_age_days, the giving-period window (period_end <= now), governance-authorization expiry and lien-window comparisons"
      - "mutates no stored entity and bumps no version"

# ============================================================================
# §1.6 Error Code Catalog — one entry per §1.4 priority; every code is
#      triggerable through at least one §1.5 endpoint
# ============================================================================

errors:
  # ---- auth / shape --------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's §1.5 roles (e.g. a LoanServicer attempting POST /covenants/{covenant_id}/waive)"
  - id: ERR_INSTITUTION_SCOPE_VIOLATION
    http: 403
    condition: "an InstitutionRepresentative acts on a resource belonging to a different institution than its X-User-ID"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required input field, enum value outside its declared set, negative cent amount, percent_complete outside (0, 1], period_end <= period_start, lien_effective_to <= lien_effective_from, outcome/amount_cents mismatch on an installment, a workout option missing its option-specific field, or final_inspection_passed == false on a construction completion"

  # ---- existence ----------------------------------------------------------
  - id: ERR_INSTITUTION_NOT_FOUND
    http: 404
    condition: "institution_id in a path or body does not resolve to an Institution"
  - id: ERR_GIVING_PERIOD_NOT_FOUND
    http: 404
    condition: "giving_period_id in the path does not resolve to a GivingPeriod"
  - id: ERR_GOVERNANCE_AUTHORIZATION_NOT_FOUND
    http: 404
    condition: "governance_authorization_id in a path or body does not resolve to a GovernanceAuthorization"
  - id: ERR_PLEDGE_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "pledge_campaign_id in a path or body does not resolve to a PledgeCampaign"
  - id: ERR_PLEDGE_NOT_FOUND
    http: 404
    condition: "pledge_id in the path does not resolve to a Pledge"
  - id: ERR_COLLATERAL_ASSET_NOT_FOUND
    http: 404
    condition: "collateral_asset_id in the path does not resolve to a CollateralAsset"
  - id: ERR_LOAN_APPLICATION_NOT_FOUND
    http: 404
    condition: "loan_application_id in a path or body does not resolve to a LoanApplication"
  - id: ERR_LOAN_NOT_FOUND
    http: 404
    condition: "loan_id in a path or body does not resolve to a Loan"
  - id: ERR_DRAW_REQUEST_NOT_FOUND
    http: 404
    condition: "draw_request_id in the path does not resolve to a DrawRequest"
  - id: ERR_COVENANT_NOT_FOUND
    http: 404
    condition: "covenant_id in the path does not resolve to a Covenant"
  - id: ERR_WORKOUT_PLAN_NOT_FOUND
    http: 404
    condition: "workout_plan_id in the path, or predecessor_workout_plan_id in the body, does not resolve to a WorkoutPlan"

  # ---- optimistic concurrency ---------------------------------------------
  - id: ERR_STALE_LOAN_VERSION
    http: 412
    condition: "expected_loan_version on POST /workout-plans does not equal the Loan's current version"
  - id: ERR_STALE_CAMPAIGN_VERSION
    http: 412
    condition: "expected_pledge_campaign_version on POST /pledges does not equal the PledgeCampaign's current version"

  # ---- state --------------------------------------------------------------
  - id: ERR_AUTHORIZATION_INVALID_STATE
    http: 409
    condition: "the governance packet is not in the state the requested transition declares as `from` (e.g. board-verification on a DRAFT packet)"
  - id: ERR_APPLICATION_INVALID_STATE
    http: 409
    condition: "the application is not in the state the requested transition declares as `from` (e.g. committee-referral on a DRAFT application, or POST /loans against a DRAFT, UNDERWRITING, COMMITTEE_REVIEW, REVISION_REQUESTED or DECLINED application); a repeat POST /loans on the FUNDED application answers ERR_LOAN_ALREADY_ORIGINATED instead"
  - id: ERR_LOAN_NOT_IN_DRAW_PHASE
    http: 409
    condition: "a draw operation is attempted while Loan.servicing_status is AMORTIZING or PAID_OFF"
  - id: ERR_DRAW_INVALID_STATE
    http: 409
    condition: "the draw is not in the state the requested transition declares as `from` (e.g. disburse on a SUBMITTED draw, reinstate on an APPROVED draw, void on a REJECTED draw), or a construction completion is attempted while any DrawRequest on the loan is still in SUBMITTED, APPROVED or SUSPENDED"
  - id: ERR_COVENANT_INVALID_STATE
    http: 409
    condition: "cure on a COMPLIANT covenant, cure while last_test_result is not PASS, or waive on a covenant that is not BREACHED"
  - id: ERR_PLEDGE_INVALID_STATE
    http: 409
    condition: "installment recording or lapse on a pledge that is not ACTIVE, or reinstatement of a pledge that is not LAPSED"
  - id: ERR_CAMPAIGN_CLOSED
    http: 409
    condition: "pledge creation, installment recording, reinstatement or a second close against a CLOSED campaign"
  - id: ERR_WORKOUT_INVALID_STATE
    http: 409
    condition: "a workout proposal on a loan whose risk_posture is OPEN, or approval of a plan that is not PROPOSED"
  - id: ERR_LOAN_ALREADY_ORIGINATED
    http: 409
    condition: "POST /loans for an application that a Loan already references"
  - id: ERR_LOAN_TERMINAL
    http: 409
    condition: "covenant creation, a covenant test, a payment or a construction completion on a PAID_OFF loan"

  # ---- business_safety: governance, compliance, collateral eligibility -----
  - id: ERR_BOARD_QUORUM_NOT_MET
    http: 422
    condition: "round_half_up(board_votes_for / board_votes_total, 4) is below Institution.bylaws_quorum_pct at board verification"
  - id: ERR_BYLAWS_CAP_EXCEEDED
    http: 422
    condition: "the authorized amount at submit, or the requested amount at submit-underwriting, exceeds Institution.bylaws_borrowing_cap_cents"
  - id: ERR_GOVERNANCE_NOT_AUTHORIZED
    http: 409
    condition: "committee referral while the governance packet is not AUTHORIZED"
  - id: ERR_GOVERNANCE_AUTHORIZATION_EXPIRED
    http: 409
    condition: "committee referral or committee decision after GovernanceAuthorization.expires_on has passed on the logical clock"
  - id: ERR_DENOMINATIONAL_APPROVAL_REQUIRED
    http: 422
    condition: "a denominational decision is recorded on a packet whose denominational_body is null"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the committee decision is attempted by the same X-User-ID recorded in LoanApplication.prepared_by_user_id"
  - id: ERR_ENDOWMENT_COLLATERAL_INELIGIBLE
    http: 422
    condition: "assignment of a DONOR_RESTRICTED_ENDOWMENT asset to a loan application"
  - id: ERR_COLLATERAL_APPRAISAL_STALE
    http: 422
    condition: "assignment of an asset whose appraisal_age_days exceeds APPRAISAL_STALE_DAYS (730)"

  # ---- business_temporal --------------------------------------------------
  - id: ERR_GIVING_PERIOD_OVERLAP
    http: 409
    condition: "a new giving period's CLOSED interval shares any instant — including a single touching endpoint — with an existing period of the same institution"
  - id: ERR_COLLATERAL_LIEN_WINDOW_CONFLICT
    http: 409
    condition: "the requested half-open lien window overlaps a prior occupation of the same asset after that occupation's end is extended by LIEN_RELEASE_BUFFER_DAYS (30)"

  # ---- business_referential -----------------------------------------------
  - id: ERR_COLLATERAL_LINK_BROKEN
    http: 409
    condition: "committee referral with no first-lien CollateralAsset assigned to the application"
  - id: ERR_INSTITUTION_MISMATCH
    http: 409
    condition: "a cross-referenced governance packet, pledge campaign or collateral asset belongs to a different institution than the application"
  - id: ERR_COLLATERAL_ALREADY_ASSIGNED
    http: 409
    condition: "assignment of an asset that already holds a lien, or release of an unassigned asset"
  - id: ERR_PREDECESSOR_WORKOUT_INVALID
    http: 409
    condition: "predecessor_workout_plan_id references a plan on another loan or a plan that is not APPROVED"

  # ---- business_constraint ------------------------------------------------
  - id: ERR_INSUFFICIENT_GIVING_HISTORY
    http: 422
    condition: "submit-underwriting while Institution.period_count is below MIN_GIVING_PERIODS (4)"
  - id: ERR_RESTRICTED_EXCEEDS_TOTAL
    http: 422
    condition: "restricted_contributions_cents + donor_restricted_endowment_draw_cents exceeds total_contributions_cents on a giving period"
  - id: ERR_MISSION_IMPACT_SCORE_TOO_LOW
    http: 422
    condition: "approval of a PARTIAL_FORGIVENESS plan scoring below 92.00, or a MISSION_IMPACT_FORBEARANCE plan scoring below 50.00"
  - id: ERR_DRAW_BLOCKED_BY_COVENANT_BREACH
    http: 409
    condition: "disbursement while any Covenant on the loan is BREACH_PENDING_CURE or BREACHED"
  - id: ERR_PLEDGE_CAMPAIGN_REQUIRED
    http: 422
    condition: "submit-underwriting of a PLEDGE_ADVANCE application whose pledge_campaign_id is null"

  # ---- business_fiscal ----------------------------------------------------
  - id: ERR_LTV_COVERAGE_INSUFFICIENT
    http: 422
    condition: "committee referral of a request exceeding calculations.maximum_supportable_principal"
  - id: ERR_AUTHORIZED_AMOUNT_EXCEEDED
    http: 422
    condition: "an APPROVE decision whose requested_amount_cents, added to the requested_amount_cents of the other LoanApplications on the same governance_authorization_id already in status APPROVED or FUNDED, exceeds GovernanceAuthorization.authorized_amount_cents"
  - id: ERR_DRAW_EXCEEDS_COMMITMENT
    http: 422
    condition: "a draw create, approval or reinstatement exceeding Loan.undrawn_commitment_cents - Loan.reserved_draw_cents"
  - id: ERR_DRAW_NET_NONPOSITIVE
    http: 422
    condition: "the disbursement waterfall leaves bucket 3 (net to the institution) at 0 after retainage, the interest-reserve sweep and the inspection fee"
  - id: ERR_FORGIVENESS_EXCEEDS_OUTSTANDING
    http: 422
    condition: "approval of a PARTIAL_FORGIVENESS plan whose forgiveness_amount_cents exceeds Loan.outstanding_principal_cents"
  - id: ERR_PAYMENT_EXCEEDS_OUTSTANDING
    http: 422
    condition: "a principal payment exceeding Loan.outstanding_principal_cents"

# ============================================================================
# §1.7 RBAC Matrix — segregation of duties
# ============================================================================

roles:
  - name: PlatformAdmin
    description: "Lender platform operator: onboards institutions and controls the logical clock. Holds no credit authority."
    identity: "opaque"
    exclusive_operations:
      - "POST /institutions"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint except GET /governance-authorizations reads, which it also shares"
      - "GET /institutions, GET /institutions/{institution_id} and every other read listing PlatformAdmin in §1.5"
  - name: InstitutionRepresentative
    description: "Officer of the borrowing congregation, school, agency or ministry. Acts only within its own institution: X-User-ID is the Institution id."
    identity: "entity_backed:Institution"
    exclusive_operations:
      - "POST /governance-authorizations"
      - "POST /governance-authorizations/{governance_authorization_id}/submit"
      - "POST /governance-authorizations/{governance_authorization_id}/return-to-draft"
      - "POST /pledge-campaigns"
      - "POST /pledge-campaigns/{pledge_campaign_id}/close"
    shared_operations:
      - "POST /giving-periods (with CreditAnalyst)"
      - "POST /collateral-assets (with CreditAnalyst)"
      - "POST /loan-applications (with CreditAnalyst)"
      - "POST /pledges (with CreditAnalyst)"
      - "POST /pledges/{pledge_id}/payments (with LoanServicer)"
      - "POST /draw-requests (with LoanServicer)"
      - "reads of its own institution's resources"
  - name: GovernanceOfficer
    description: "Lender-side governance reviewer who verifies the board vote against the bylaws and records the denominational decision. Cannot underwrite, decide credit or service loans."
    identity: "opaque"
    exclusive_operations:
      - "POST /governance-authorizations/{governance_authorization_id}/board-verification"
      - "POST /governance-authorizations/{governance_authorization_id}/denominational-decision"
    shared_operations:
      - "GET /governance-authorizations and GET /governance-authorizations/{governance_authorization_id}"
  - name: CreditAnalyst
    description: "Underwriter who assembles the giving analysis, registers and assigns collateral, and refers applications to committee. Barred by segregation of duties from deciding any application it prepared."
    identity: "opaque"
    exclusive_operations:
      - "POST /loan-applications/{loan_application_id}/submit-underwriting"
      - "POST /loan-applications/{loan_application_id}/committee-referral"
      - "POST /collateral-assets/{collateral_asset_id}/assignments"
      - "POST /collateral-assets/{collateral_asset_id}/release"
      - "POST /covenants"
    shared_operations:
      - "POST /giving-periods (with InstitutionRepresentative)"
      - "POST /collateral-assets (with InstitutionRepresentative)"
      - "POST /loan-applications (with InstitutionRepresentative)"
      - "POST /pledges (with InstitutionRepresentative)"
      - "every read endpoint"
  - name: CreditCommitteeMember
    description: "Credit committee voter: renders application decisions, waives covenant breaches and approves workout plans. Never prepares underwriting."
    identity: "opaque"
    exclusive_operations:
      - "POST /loan-applications/{loan_application_id}/committee-decision"
      - "POST /covenants/{covenant_id}/waive"
      - "POST /workout-plans/{workout_plan_id}/approve"
    shared_operations:
      - "every read endpoint"
  - name: LoanServicer
    description: "Servicing and construction-administration desk: originates approved loans, administers draws, runs covenant tests and files cures, and proposes workout plans. Cannot approve its own workout proposals."
    identity: "opaque"
    exclusive_operations:
      - "POST /loans"
      - "POST /loans/{loan_id}/payments"
      - "POST /loans/{loan_id}/construction-completion"
      - "POST /draw-requests/{draw_request_id}/approve"
      - "POST /draw-requests/{draw_request_id}/disburse"
      - "POST /draw-requests/{draw_request_id}/reject"
      - "POST /draw-requests/{draw_request_id}/void"
      - "POST /draw-requests/{draw_request_id}/reinstate"
      - "POST /covenants/{covenant_id}/tests"
      - "POST /covenants/{covenant_id}/cure"
      - "POST /pledges/{pledge_id}/lapse"
      - "POST /pledges/{pledge_id}/reinstate"
      - "POST /workout-plans"
    shared_operations:
      - "POST /draw-requests (with InstitutionRepresentative)"
      - "POST /pledges/{pledge_id}/payments (with InstitutionRepresentative)"
      - "reads of institutions, giving periods, campaigns, pledges, collateral, applications, loans, draws, covenants and workout plans"
