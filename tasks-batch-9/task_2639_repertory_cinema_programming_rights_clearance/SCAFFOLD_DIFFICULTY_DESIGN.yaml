          Depth 4, and the trigger is not the displaced row: confirming the event (1) grows the HOST
          showtime's on-screen block from 141 to 171 minutes, which (2) retroactively collides with a
          LATER showtime that was perfectly legal when created, so that showtime is cancelled, which
