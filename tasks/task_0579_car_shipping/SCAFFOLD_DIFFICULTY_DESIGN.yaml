      - name: terminal_dock_buffered_closed_interval_overlap
        grounds:
          - validations[priority=10]
          - entities.Terminal.fields.dock_count
          - entities.Terminal.fields.buffer_minutes
          - entities.ShipmentOrder.fields.terminal_slot_start
        distinguishing_aspect: |
          Terminal resource, CLOSED-interval + 60min buffer + dock_count=1 aggregate
          capacity: order1 slot [10:00,12:00] buffered to [09:00,13:00] collides with
          order2 slot [12:30,14:00]; since dock_count is 1 the second TERMINAL order
          creation fails with ERR_TERMINAL_SLOT_CONFLICT. Distinct interval semantics
          (buffer + capacity) and resource from the carrier half-open overlap.
        test_recipe:
          setup:
            - "Terminal dock_count=1 buffer_minutes=60; order1 (TERMINAL) already created with slot 10:00-12:00 on 2026-06-01."
          setup_api_calls:
