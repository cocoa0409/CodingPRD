              as: PlatformOperator
          trigger:
            - call: "POST /compliance/plan-years/00000000-0000-4000-8000-0000000000ff/activate"
              payload: {}
              as: PlanSponsorAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response HTTP status == 404 and ${err} == \"ERR_PLAN_YEAR_NOT_FOUND\""
            - "GET /compliance/plan-years -> total_count == 0 (no row was created by the failed action)"

  - section: rbac
