            - call: "POST /bureau/composition-jobs/${ec_job_id}/presort"
              payload: {}
              as: CompositionOperator
            - call: "GET /bureau/mail-pieces?composition_job_id=${ec_job_id}"
              payload: {}
              as: IntegrityAuditor
              captures: { ec_p1_id: "$.data[0].id", ec_p1_bar: "$.data[0].imb_barcode", ec_p2_id: "$.data[1].id", ec_p2_bar: "$.data[1].imb_barcode" }
            - call: "POST /bureau/composition-jobs/${ec_job_id}/schedule"
              payload: { window_start: "2026-08-02T09:00:00Z", press_line_id: "${ec_line_id}" }
