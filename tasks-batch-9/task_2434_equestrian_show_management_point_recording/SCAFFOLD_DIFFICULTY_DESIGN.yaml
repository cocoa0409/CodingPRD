    instances:

      - name: slot_start_requires_active_vet_coverage
        grounds:
          - validations.priority_25
          - errors.ERR_VET_COVERAGE_MISSING
          - state_machines.RingSlot.SCHEDULED_to_RUNNING
          - state_machines.CoverageShift.SCHEDULED_to_ACTIVE
          - entities.CoverageShift.fields.coverage_type
        distinguishing_aspect: |
          A RingSlot transition is gated on the state of an unrelated CoverageShift row that
          the request body never mentions, and the gate has three independent dimensions:
          the shift's status must be ACTIVE, its coverage_type must be VETERINARIAN, and its
          window must fully contain the slot. Three distinct near-misses each produce the
          same 422, so passing requires all three, not any one.
