      - name: stream_activate_not_hazardous_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STREAM_NOT_HAZARDOUS]
          - state_machines.WasteStream.CHARACTERIZED_to_ACTIVE
        distinguishing_aspect: "A stream characterized as non-hazardous reaches CHARACTERIZED but cannot be activated as a hazardous waste stream."
        test_recipe:
          setup: ["Site with a stream characterized with is_hazardous == false"]
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_id}", name: "cardboard", waste_codes: [], physical_state: "SOLID" }, as: WasteCoordinator, captures: { stream_id: "$.data.id", stream_v: "$.data.version" } }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: false, waste_codes: [], ldr_treatment_standard: "NONE", expected_waste_stream_version: "${stream_v}" }, as: WasteCoordinator }
          trigger:
            - { call: "POST /hazwaste/waste-streams/${stream_id}/activate", as: EHSManager, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_STREAM_NOT_HAZARDOUS and status stays CHARACTERIZED"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: unknown_role_header_unauthenticated
        claim_type: role_denied
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "An X-User-Role value that names no declared role is rejected with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any role check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: Wizard, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER and HTTP status == 400"

      - name: waste_coordinator_cannot_sign_generator
        claim_type: role_denied
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
          - roles.EHSManager.exclusive_operations
        distinguishing_aspect: "Generator signature is exclusive to EHSManager; a WasteCoordinator (the manifest's drafting role) gets ERR_FORBIDDEN at p2, before any state or SoD check."
        test_recipe:
          setup: ["Default clock; manifest DRAFT with LDR notice attached (creator wc-1)"]
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
