            - "Payer.${payer_id}.status == ACTIVE and the enrollment is EFFECTIVE, so neither of the other two conditions is the cause"
            - "Clinician.${clinician_id}.billing_posture == BILLABLE, so the priority 5 gate passed"
            - "the code 90837 is absent from Payer.${payer_id}.allowed_cpt_codes, which contains only 90834"
            - "Session.${session_id}.billing_state == UNBILLED and GET /network/claims?session_id=${session_id} returns 0 rows"

      - name: enrollment_activation_before_its_effective_date_returns_invalid_state
        claim_type: Violation -> Error
        grounds:
          - state_machines.PayerEnrollment.transitions.PENDING_to_EFFECTIVE
          - errors.ERR_INVALID_STATE
          - errors.ERR_OUTSIDE_ENROLLMENT_WINDOW
          - endpoints.POST_/network/payer-enrollments/{id}/activate
        distinguishing_aspect: "The activation precondition is a future-dated window rather than a bad payload, so the refusal is a 409 ERR_INVALID_STATE and the enrollment stays PENDING rather than being rejected or partially written."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z; a clinician credentialed and a payer on file, with the enrollment effective_from set to 2026-12-01, far ahead of the clock."
          setup_api_calls:
            - *c_clock
            - *c_payer
            - *c_clinician
            - *c_license
            - call: "POST /network/clinicians/${clinician_id}/licenses/${license_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /network/clinicians/${clinician_id}/malpractice-policies"
              payload: { carrier_name: "TherapyGuard Mutual", coverage_cents: 500000000, effective_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z", tail_coverage: false }
              as: OpsAdmin
            - call: "POST /network/payer-enrollments"
              payload: { clinician_id: "${clinician_id}", payer_id: "${payer_id}", delegated: true, effective_from: "2026-12-01T00:00:00Z" }
              as: OpsAdmin
              captures: { enrollment_id: $.data.id }
          trigger:
            - call: "POST /network/payer-enrollments/${enrollment_id}/activate"
              payload: {}
              as: OpsAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "PayerEnrollment.${enrollment_id}.status == PENDING and rate_set_version_pinned is null"
            - "Clinician.${clinician_id}.enrolled_payer_count == 0 and billing_posture == GATED"
            - "error_id != ERR_ENROLLMENT_WINDOW_INVALID, which concerns the window's own length rather than the clock"

      - name: locking_a_batch_before_its_period_closes_returns_batch_not_lockable
        claim_type: Violation -> Error
        grounds:
          - state_machines.PayoutBatch.transitions.OPEN_to_LOCKED
          - errors.ERR_BATCH_NOT_LOCKABLE
          - endpoints.POST_/network/payout-batches/{id}/lock
        distinguishing_aspect: "The lock gate is expressed on the period close rather than on the line count, so a batch opened with a future period_end is refused with 409 ERR_BATCH_NOT_LOCKABLE even before the zero-line condition could be reached."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-05T00:00:00Z; one open batch whose period_end is 2026-06-08, still ahead of the clock."
          setup_api_calls:
            - &c_clock_june
              call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-06-05T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /network/payout-batches"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-08T00:00:00Z", schedule: "WEEKLY" }
              as: OpsAdmin
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /network/payout-batches/${batch_id}/lock"
              payload: {}
              as: OpsAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_BATCH_NOT_LOCKABLE"
            - "PayoutBatch.${batch_id}.status == OPEN and line_count == 0"
            - "PayoutBatch.${batch_id}.total_net_cents == 0 and total_gross_cents == 0"
            - "after POST /network/_clock/set_current_utc to 2026-06-08T00:00:00Z the same lock still fails, now on the zero-line condition, with the same error_id"

      - name: paying_an_unlocked_batch_returns_batch_not_payable
        claim_type: Violation -> Error
        grounds:
          - state_machines.PayoutBatch.transitions.LOCKED_to_PAID
          - errors.ERR_BATCH_NOT_PAYABLE
          - endpoints.POST_/network/payout-batches/{id}/pay
        distinguishing_aspect: "Pay is declared only from LOCKED, so an open batch whose period has already closed is refused with 409 ERR_BATCH_NOT_PAYABLE while the immediately preceding lock on the same batch succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z then 2026-06-09T00:00:00Z; one open batch whose period has closed but which has not been locked."
          setup_api_calls:
            - *c_clock
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-06-09T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /network/payout-batches"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-08T00:00:00Z", schedule: "WEEKLY" }
              as: OpsAdmin
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /network/payout-batches/${batch_id}/pay"
              payload: {}
              as: OpsAdmin
              captures: { error_id: $.data.error_id }
            - call: "POST /network/payout-batches/${batch_id}/lock"
              payload: {}
              as: OpsAdmin
              captures: { error_id_lock: $.data.error_id }
          assert:
            - "the pay request returns status 409 and error_id == ERR_BATCH_NOT_PAYABLE"
            - "the lock request on the same batch returns status 409 with ${error_id_lock} == ERR_BATCH_NOT_LOCKABLE, because no line supports the lock"
            - "PayoutBatch.${batch_id}.status == OPEN throughout, so neither rejection advanced it"
            - "the two errors are distinct, isolating the status gate from the line gate"

      - name: write_off_before_the_recovery_deadline_returns_write_off_not_allowed
        claim_type: Violation -> Error
        grounds:
          - state_machines.Claim.transitions.DENIED_to_WRITTEN_OFF
          - errors.ERR_WRITE_OFF_NOT_ALLOWED
          - endpoints.POST_/network/claims/{id}/write-off
        distinguishing_aspect: "Write-off eligibility is the mirror of resubmission eligibility, so a denial inside its filing window is refused with 409 ERR_WRITE_OFF_NOT_ALLOWED while the resubmit on the same claim succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z, then 2026-06-03T18:00:00Z, with a denied claim and the clock well inside the 90-day filing window."
          setup_api_calls:
            - *c_clock
            - *c_payer
            - *c_rate
            - *c_clinician
            - *c_license
            - call: "POST /network/clinicians/${clinician_id}/licenses/${license_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /network/clinicians/${clinician_id}/malpractice-policies"
              payload: { carrier_name: "TherapyGuard Mutual", coverage_cents: 500000000, effective_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z", tail_coverage: false }
              as: OpsAdmin
            - *c_enroll
            - call: "POST /network/payer-enrollments/${enrollment_id}/activate"
              payload: {}
              as: OpsAdmin
            - *c_patient
            - *c_verification
            - *c_session
            - call: "POST /network/sessions/${session_id}/schedule"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { session_v1: $.data.version }
            - call: "POST /network/sessions/${session_id}/notes"
              payload: { diagnosis_code: "F41.1", duration_minutes: 60, cpt_code: "90837", narrative: "Note for the premature write-off corner.", expected_session_version: "${session_v1}" }
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { note_id: $.data.id }
            - call: "POST /network/sessions/${session_id}/notes/${note_id}/sign"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-06-03T18:00:00Z" }
              as: OpsAdmin
            - call: "POST /network/sessions/${session_id}/complete"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
            - call: "POST /network/claims"
              payload: { session_id: "${session_id}" }
              as: OpsAdmin
              captures: { claim_id: $.data.id }
            - call: "POST /network/claims/${claim_id}/adjudicate"
              payload: { outcome: "DENIED", denial_code: "NOT_COVERED" }
              as: OpsAdmin
          trigger:
            - call: "POST /network/claims/${claim_id}/write-off"
              payload: {}
              as: OpsAdmin
              captures: { error_id: $.data.error_id }
            - call: "POST /network/claims/${claim_id}/resubmit"
              payload: {}
              as: OpsAdmin
              captures: { after_resubmit: $.data.claim_status }
          assert:
            - "the write-off returns status 409 and error_id == ERR_WRITE_OFF_NOT_ALLOWED"
            - "the resubmit on the same claim succeeds: ${after_resubmit} == REPROCESSING"
            - "Claim.${claim_id}.resubmission_count == 1 after the resubmit"
            - "error_id != ERR_TIMELY_FILING_EXPIRED, which is the opposite-direction failure the resubmit would have hit after the deadline"

      - name: required_field_check_precedes_the_role_check_when_both_would_fail
        claim_type: Priority Ordering
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors.ERR_UNAUTHENTICATED
          - endpoints.POST_/network/claims
        distinguishing_aspect: "Authentication at priority 1 is evaluated before authorization at priority 2, so a caller that both lacks a valid role and targets a nonexistent session gets 401 ERR_UNAUTHENTICATED rather than the 403 or 404 the other checks would give."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /network/claims"
              payload: { session_id: "00000000-0000-4000-8000-000000000003" }
              as: Anonymous
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 401 and error_id == ERR_UNAUTHENTICATED"
            - "error_id != ERR_UNAUTHORIZED and error_id != ERR_SESSION_NOT_FOUND"
            - "the answer is identical to the valid-role-but-nonexistent-session case only after the header is supplied, so the header check is the sole differentiator"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: clinician_submit_credentials_transitions_to_credentialing
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/network/clinicians/{id}/submit-credentials
          - state_machines.Clinician.transitions.ONBOARDING_to_CREDENTIALING
        distinguishing_aspect: "The action endpoint exercises its declared guards in order: a clinician with no license is refused, and once a license and a malpractice policy exist the same call succeeds and moves the status."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z; one clinician with no license and no policy yet."
          setup_api_calls:
            - *c_clock
            - *c_clinician
          trigger:
            - call: "POST /network/clinicians/${clinician_id}/submit-credentials"
              payload: {}
              as: ComplianceOfficer
              captures: { error_id: $.data.error_id }
            - call: "POST /network/clinicians/${clinician_id}/licenses"
              payload: { license_number: "LCSW-CA-55401", license_type: "LCSW", issuing_state: "CA", expires_on: "2027-06-30T00:00:00Z", telehealth_eligible: true }
              as: OpsAdmin
            - call: "POST /network/clinicians/${clinician_id}/malpractice-policies"
              payload: { carrier_name: "TherapyGuard Mutual", coverage_cents: 500000000, effective_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z", tail_coverage: false }
              as: OpsAdmin
            - call: "POST /network/clinicians/${clinician_id}/submit-credentials"
              payload: {}
              as: ComplianceOfficer
              captures: { final_status: $.data.status }
          assert:
            - "the first attempt returns status 409 and ${error_id} == ERR_INVALID_STATE, because no license exists"
            - "Clinician.${clinician_id}.status == ONBOARDING after the rejection"
            - "after the license and policy are recorded the same call succeeds and ${final_status} == CREDENTIALING"
            - "Clinician.${clinician_id}.billing_posture == GATED throughout, because the license is recorded but not yet verified"

      - name: clinician_payout_lines_read_returns_one_row_across_batches
        claim_type: Computed read
        grounds:
          - endpoints.GET_/network/clinicians/{id}/payout-lines
          - calculations.payout_batch_totals
        distinguishing_aspect: "The clinician-scoped payout-line read aggregates lines across batches and filters by line status, so the same three lines are returned as one PENDING row under one filter and two PAID rows under another."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z, then 2026-06-03T18:00:00Z, then 2026-06-09T00:00:00Z; two batches, the first locked and paid and the second locked but unpaid, for one clinician with one completed and billed session in each period."
          setup_api_calls:
            - *c_clock
            - *c_payer
            - *c_rate
            - *c_clinician
            - *c_license
            - call: "POST /network/clinicians/${clinician_id}/licenses/${license_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /network/clinicians/${clinician_id}/malpractice-policies"
              payload: { carrier_name: "TherapyGuard Mutual", coverage_cents: 500000000, effective_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z", tail_coverage: false }
              as: OpsAdmin
            - *c_enroll
            - call: "POST /network/payer-enrollments/${enrollment_id}/activate"
              payload: {}
              as: OpsAdmin
            - *c_patient
            - *c_verification
            - *c_session
            - call: "POST /network/sessions/${session_id}/schedule"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { session_v1: $.data.version }
            - call: "POST /network/sessions/${session_id}/notes"
              payload: { diagnosis_code: "F41.1", duration_minutes: 60, cpt_code: "90837", narrative: "First-period note for the payout-line read corner.", expected_session_version: "${session_v1}" }
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { note_id: $.data.id }
            - call: "POST /network/sessions/${session_id}/notes/${note_id}/sign"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-06-03T18:00:00Z" }
              as: OpsAdmin
            - call: "POST /network/sessions/${session_id}/complete"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-06-16T18:00:00Z" }
              as: OpsAdmin
            - call: "POST /network/sessions"
              payload: { clinician_id: "${clinician_id}", patient_id: "${patient_id}", scheduled_start: "2026-06-16T16:00:00Z", scheduled_end: "2026-06-16T17:00:00Z", cpt_code: "90837", modality: "VIDEO" }
              as: OpsAdmin
              captures: { session_2: $.data.id }
            - call: "POST /network/sessions/${session_2}/schedule"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { session2_v1: $.data.version }
            - call: "POST /network/sessions/${session_2}/notes"
              payload: { diagnosis_code: "F41.1", duration_minutes: 60, cpt_code: "90837", narrative: "Second-period note for the payout-line read corner.", expected_session_version: "${session2_v1}" }
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { note_2: $.data.id }
            - call: "POST /network/sessions/${session_2}/notes/${note_2}/sign"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
            - call: "POST /network/sessions/${session_2}/complete"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-06-09T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /network/payout-batches"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-08T00:00:00Z", schedule: "WEEKLY" }
              as: OpsAdmin
              captures: { batch_1: $.data.id }
            - call: "POST /network/payout-batches/${batch_1}/lock"
              payload: {}
              as: OpsAdmin
          trigger:
            - call: "GET /network/clinicians/${clinician_id}/payout-lines"
              payload: { line_status: "PENDING", limit: 10, offset: 0 }
              as: OpsAdmin
              captures: { pending_total: $.data.0.id }
            - call: "GET /network/clinicians/${clinician_id}/payout-lines"
              payload: { limit: 10, offset: 0 }
              as: OpsAdmin
              captures: { all_total: $.data.0.id }
            - call: "GET /network/payout-batches/${batch_1}/lines"
              payload: { limit: 10, offset: 0 }
              as: OpsAdmin
              captures: { batch_line_total: $.data.0.id }
          assert:
            - "the PENDING filter returns exactly 1 row and total_count == 1"
            - "the unfiltered read returns exactly 1 row with total_count == 1, since only the first period has been locked"
            - "the batch-scoped read returns exactly 1 row with total_count == 1, matching the clinician-scoped read for that period"
            - "the single line reports gross_cents == 15000, adjustment_cents == 0 and net_cents == 15000"
            - "GET /network/payout-batches/${batch_1}/lines?line_status=PAID returns 0 rows, since the batch was locked but never paid"

      - name: payer_rates_read_supports_every_declared_filter
        claim_type: Standard CRUD
        grounds:
          - endpoints.GET_/network/payers/{id}/rates
          - entities.PayerRate
        distinguishing_aspect: "Each declared filter narrows the rate schedule independently, and a filter value that matches no row returns an empty array with total_count zero rather than a 404."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z; one payer with three rate rows spanning two geographies and two codes."
          setup_api_calls:
            - *c_clock
            - *c_payer
            - call: "POST /network/payers/${payer_id}/rates"
              payload: { rate_set_version: 1, license_type: "LCSW", geography: "CA", cpt_code: "90837", rate_cents: 15000, effective_from: "2026-01-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /network/payers/${payer_id}/rates"
              payload: { rate_set_version: 1, license_type: "LCSW", geography: "CA", cpt_code: "90834", rate_cents: 12000, effective_from: "2026-01-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /network/payers/${payer_id}/rates"
              payload: { rate_set_version: 1, license_type: "LMFT", geography: "TX", cpt_code: "90837", rate_cents: 13000, effective_from: "2026-01-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /network/payers/${payer_id}/rates"
              payload: { rate_set_version: 1, license_type: "LCSW", geography: "CA", cpt_code: "90837", rate_cents: 15000, effective_from: "2026-01-01T00:00:00Z" }
              as: OpsAdmin
              captures: { error_id: $.data.error_id }
          trigger:
            - call: "GET /network/payers/${payer_id}/rates"
              payload: { geography: "CA", limit: 10, offset: 0 }
              as: OpsAdmin
              captures: { ca_total: $.data.0.id }
            - call: "GET /network/payers/${payer_id}/rates"
              payload: { license_type: "LMFT", limit: 10, offset: 0 }
              as: OpsAdmin
              captures: { lmft_total: $.data.0.id }
            - call: "GET /network/payers/${payer_id}/rates"
              payload: { cpt_code: "90999", limit: 10, offset: 0 }
              as: OpsAdmin
              captures: { empty_total: $.data.0.id }
          assert:
            - "the duplicate publish is refused with status 409 and ${error_id} == ERR_DUPLICATE_RATE"
            - "the CA filter returns exactly 2 rows with total_count == 2"
            - "the LMFT filter returns exactly 1 row with total_count == 1"
            - "the unmatched code filter returns an empty array with total_count == 0 and response_type array, not a 404"
            - "the unfiltered read returns exactly 3 rows with total_count == 3"

      - name: payer_status_patch_cascades_through_enrollments_to_clinician_posture
        claim_type: Conditional action
        grounds:
          - endpoints.PATCH_/network/payers/{id}
          - state_machines.Payer.transitions.ACTIVE_to_SUSPENDED_AT_PAYER
          - calculations.clinician_billing_posture_derived
        distinguishing_aspect: "The status patch is a conditional action whose effect depends on how many effective enrollments the payer holds: with two enrolled clinicians both lose a count, and the identity of the session cancellations depends on which clinician was driven to zero."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z; two clinicians each with exactly one EFFECTIVE enrollment with the same payer, so both are BILLABLE with enrolled_payer_count 1."
          setup_api_calls:
            - *c_clock
            - *c_payer
            - *c_clinician
            - *c_license
            - call: "POST /network/clinicians/${clinician_id}/licenses/${license_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /network/clinicians/${clinician_id}/malpractice-policies"
              payload: { carrier_name: "TherapyGuard Mutual", coverage_cents: 500000000, effective_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z", tail_coverage: false }
              as: OpsAdmin
            - *c_enroll
            - call: "POST /network/payer-enrollments/${enrollment_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /network/clinicians"
              payload: { full_name: "Zara Whitfield", license_type: "LCSW", primary_state: "CA", specialty_tags: ["ANXIETY"], weekly_caseload_target: 6, availability_blocks: [{ weekday: 4, start_minute: 480, end_minute: 1080 }] }
              as: OpsAdmin
              captures: { other_clinician: $.data.id }
            - call: "POST /network/clinicians/${other_clinician}/licenses"
              payload: { license_number: "LCSW-CA-90211", license_type: "LCSW", issuing_state: "CA", expires_on: "2027-06-30T00:00:00Z", telehealth_eligible: true }
              as: OpsAdmin
              captures: { other_license: $.data.id }
            - call: "POST /network/clinicians/${other_clinician}/licenses/${other_license}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /network/clinicians/${other_clinician}/malpractice-policies"
              payload: { carrier_name: "TherapyGuard Mutual", coverage_cents: 500000000, effective_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z", tail_coverage: false }
              as: OpsAdmin
            - call: "POST /network/payer-enrollments"
              payload: { clinician_id: "${other_clinician}", payer_id: "${payer_id}", delegated: true, effective_from: "2026-01-01T00:00:00Z" }
              as: OpsAdmin
              captures: { other_enrollment: $.data.id }
            - call: "POST /network/payer-enrollments/${other_enrollment}/activate"
              payload: {}
              as: OpsAdmin
          trigger:
            - call: "PATCH /network/payers/${payer_id}"
              payload: { status: "SUSPENDED_AT_PAYER" }
              as: OpsAdmin
            - call: "GET /network/payers/${payer_id}/payer-enrollments"
              payload: { status: "SUSPENDED", limit: 10, offset: 0 }
              as: OpsAdmin
              captures: { suspended_enrollments: $.data.0.id }
            - call: "GET /network/clinicians"
