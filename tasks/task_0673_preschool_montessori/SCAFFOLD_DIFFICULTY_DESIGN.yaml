scaffold_difficulty_design:
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_forward_vs_chronological_diverge
        grounds:
          - calculations.refund_amount
          - entities.RefundRequest.fields.refund_cents
          - entities.RefundRequest.fields.earned_cents
        distinguishing_aspect: "For identical paid_to_date/effective_date, RefundRequest method FORWARD yields refund_cents=300000 while CHRONOLOGICAL yields 333333 — divergence on the RefundRequest entity domain."
        test_recipe:
          setup:
            - "Clock at 2026-09-01. PRIMARY classroom compliant with 1 staff, capacity 5."
            - "STANDARD tier base_annual_cents=1000000, deposit_pct=0.10, installments=10."
            - "Student aged 43mo enrolled; program_start_date 2026-09-01; deposit 100000 + 6 installments of 100000 captured (paid_to_date=700000)."
            - "Enrollment withdrawn; effective_date 2026-11-20."
          setup_api_calls:
            - call: "POST /montessori/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /montessori/tiers"
              payload: { code: "STANDARD", level: "PRIMARY", base_annual_cents: 1000000, deposit_pct: 0.10, installments: 10 }
              as: Registrar
              captures: { tier_id: $.data.id }
            - call: "POST /montessori/classrooms"
              payload: { name: "Primary A", level: "PRIMARY", capacity: 5, min_age_months: 36, max_age_months: 72 }
              as: ComplianceOfficer
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /montessori/staff-assignments"
              payload: { classroom_id: "${room_id}", staff_name: "Maria", expected_classroom_version: "${room_v0}" }
              as: ComplianceOfficer
            - call: "POST /montessori/students"
              payload: { parent_user_id: "parent-1", full_name: "Kid One", date_of_birth: "2022-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
              captures: { stu_id: $.data.id }
            - call: "POST /montessori/applications"
              payload: { student_id: "${stu_id}", classroom_id: "${room_id}", tier_id: "${tier_id}" }
              as: Parent
              as_user_id: "parent-1"
              captures: { app_id: $.data.id }
            - call: "POST /montessori/applications/${app_id}/start-review"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${app_id}/offer"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${app_id}/accept-offer"
              payload: { program_start_date: "2026-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
              captures: { enr_id: $.data.id, deposit: $.data.deposit_cents }
            - call: "POST /montessori/payments"
              payload: { enrollment_id: "${enr_id}", kind: "DEPOSIT", amount_cents: 100000 }
              as: Registrar
            - call: "POST /montessori/payments"
              payload: { enrollment_id: "${enr_id}", kind: "INSTALLMENT", amount_cents: 600000 }
              as: Registrar
            - call: "POST /montessori/enrollments/${enr_id}/withdraw"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /montessori/refund-requests"
              payload: { enrollment_id: "${enr_id}", effective_date: "2026-11-20T00:00:00Z", method: "FORWARD" }
              as: Registrar
              captures: { rr_fwd_refund: $.data.refund_cents }
          assert:
            - "RefundRequest.earned_cents == 400000 for the FORWARD request"
            - "RefundRequest.refund_cents == 300000 for the FORWARD request"
            - "A second RefundRequest with method CHRONOLOGICAL (after voiding the FORWARD one) yields earned_cents == 366667 and refund_cents == 333333"

      - name: tuition_net_sibling_discount_vs_none
        grounds:
          - calculations.tuition_net
          - entities.Enrollment.fields.net_annual_cents
          - entities.Student.fields.sibling_of_student_id
        distinguishing_aspect: "On the Enrollment entity domain, tuition_net produces net_annual_cents=1800000 with no enrolled sibling vs 1620000 when the applicant's sibling_of_student_id references a PLACED-enrolled sibling — a 10% divergence on a different entity than the refund variant."
        test_recipe:
          setup:
            - "Clock 2026-09-01. PREMIUM tier base 1800000, deposit_pct 0.10, installments 10, extended_day_annual_cents 200000."
            - "PRIMARY room capacity 5, staffed (compliant). Older sibling already ENROLLED+PLACED."
            - "Younger child applies with sibling_of_student_id = older sibling; no extended day, no aid."
          setup_api_calls:
            - call: "POST /montessori/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /montessori/tiers"
              payload: { code: "PREMIUM", level: "PRIMARY", base_annual_cents: 1800000, deposit_pct: 0.10, installments: 10, extended_day_annual_cents: 200000 }
              as: Registrar
              captures: { tier_id: $.data.id }
            - call: "POST /montessori/classrooms"
              payload: { name: "Primary B", level: "PRIMARY", capacity: 5, min_age_months: 36, max_age_months: 72 }
              as: ComplianceOfficer
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /montessori/staff-assignments"
              payload: { classroom_id: "${room_id}", staff_name: "Maria", expected_classroom_version: "${room_v0}" }
              as: ComplianceOfficer
            - call: "POST /montessori/students"
              payload: { parent_user_id: "parent-1", full_name: "Older Sib", date_of_birth: "2021-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
              captures: { sib_id: $.data.id }
            - call: "POST /montessori/applications"
              payload: { student_id: "${sib_id}", classroom_id: "${room_id}", tier_id: "${tier_id}" }
              as: Parent
              as_user_id: "parent-1"
              captures: { sib_app: $.data.id }
            - call: "POST /montessori/applications/${sib_app}/start-review"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${sib_app}/offer"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${sib_app}/accept-offer"
              payload: { program_start_date: "2026-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
            - call: "POST /montessori/students"
              payload: { parent_user_id: "parent-1", full_name: "Younger Sib", date_of_birth: "2022-09-01T00:00:00Z", sibling_of_student_id: "${sib_id}" }
              as: Parent
              as_user_id: "parent-1"
              captures: { ystu_id: $.data.id }
            - call: "POST /montessori/applications"
              payload: { student_id: "${ystu_id}", classroom_id: "${room_id}", tier_id: "${tier_id}" }
              as: Parent
              as_user_id: "parent-1"
              captures: { yapp_id: $.data.id }
            - call: "POST /montessori/applications/${yapp_id}/start-review"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${yapp_id}/offer"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /montessori/applications/${yapp_id}/accept-offer"
              payload: { program_start_date: "2026-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
              captures: { yenr_id: $.data.id, ynet: $.data.net_annual_cents }
          assert:
            - "Enrollment.${yenr_id}.net_annual_cents == 1620000 (sibling discount applied)"
            - "A sibling-less child on the same PREMIUM tier would get net_annual_cents == 1800000"

  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tuition_net_three_inputs_nonlinear
        grounds:
          - calculations.tuition_net
          - entities.Application.fields.financial_aid_pct
          - entities.Application.fields.extended_day_opt_in
        distinguishing_aspect: "Mode (a): tuition_net combines base, sibling discount, extended-day surcharge, and financial aid with nested conditionals; PREMIUM base 1800000 + sibling + extended-day + aid 0.20 yields net 1456000, computed in the pinned order."
        test_recipe:
          setup:
            - "Clock 2026-09-01. PREMIUM tier base 1800000, deposit_pct 0.10, installments 10, extended_day 200000."
            - "Older sibling ENROLLED+PLACED in PRIMARY room; room compliant."
            - "Younger child applies with sibling, extended_day_opt_in=true, financial_aid_pct=0.20."
          setup_api_calls:
            - call: "POST /montessori/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /montessori/tiers"
              payload: { code: "PREMIUM", level: "PRIMARY", base_annual_cents: 1800000, deposit_pct: 0.10, installments: 10, extended_day_annual_cents: 200000 }
              as: Registrar
              captures: { tier_id: $.data.id }
            - call: "POST /montessori/classrooms"
              payload: { name: "Primary C", level: "PRIMARY", capacity: 5, min_age_months: 36, max_age_months: 72 }
              as: ComplianceOfficer
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /montessori/staff-assignments"
              payload: { classroom_id: "${room_id}", staff_name: "Maria", expected_classroom_version: "${room_v0}" }
              as: ComplianceOfficer
            - call: "POST /montessori/students"
              payload: { parent_user_id: "parent-1", full_name: "Older Sib", date_of_birth: "2021-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
              captures: { sib_id: $.data.id }
            - call: "POST /montessori/applications"
              payload: { student_id: "${sib_id}", classroom_id: "${room_id}", tier_id: "${tier_id}" }
              as: Parent
              as_user_id: "parent-1"
              captures: { sib_app: $.data.id }
            - call: "POST /montessori/applications/${sib_app}/start-review"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${sib_app}/offer"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${sib_app}/accept-offer"
              payload: { program_start_date: "2026-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
            - call: "POST /montessori/students"
              payload: { parent_user_id: "parent-1", full_name: "Younger Sib", date_of_birth: "2022-09-01T00:00:00Z", sibling_of_student_id: "${sib_id}" }
              as: Parent
              as_user_id: "parent-1"
              captures: { ystu_id: $.data.id }
            - call: "POST /montessori/applications"
              payload: { student_id: "${ystu_id}", classroom_id: "${room_id}", tier_id: "${tier_id}", extended_day_opt_in: true, financial_aid_pct: 0.20 }
              as: Parent
              as_user_id: "parent-1"
              captures: { yapp_id: $.data.id }
            - call: "POST /montessori/applications/${yapp_id}/start-review"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${yapp_id}/offer"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /montessori/applications/${yapp_id}/accept-offer"
              payload: { program_start_date: "2026-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
              captures: { yenr_id: $.data.id }
          assert:
            - "Enrollment.${yenr_id}.net_annual_cents == 1456000 (1800000*0.9 -> 1620000 +200000 -> 1820000 *0.8 -> 1456000)"
            - "Enrollment.${yenr_id}.deposit_cents == 180000 (off base, not net)"

      - name: monthly_installment_round_once_not_per_month
        grounds:
          - calculations.tuition_net
          - entities.Enrollment.fields.monthly_installment_cents
        distinguishing_aspect: "Mode (b): rounding order is pinned to round_half_up(net/installments) ONCE on the quotient, not summing per-month rounded values; net 1456000 over 10 yields 145600 exactly, and a net 1000001 over 10 yields 100000 (round once) not a per-month-accumulated value."
        test_recipe:
          setup:
            - "Clock 2026-09-01. STANDARD-ODD tier base 1000001, deposit_pct 0.10, installments 10, no sibling, no extended day, no aid."
            - "PRIMARY room compliant; child aged 43mo enrolls."
          setup_api_calls:
            - call: "POST /montessori/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /montessori/tiers"
              payload: { code: "STANDARD_ODD", level: "PRIMARY", base_annual_cents: 1000001, deposit_pct: 0.10, installments: 10 }
              as: Registrar
              captures: { tier_id: $.data.id }
            - call: "POST /montessori/classrooms"
              payload: { name: "Primary D", level: "PRIMARY", capacity: 5, min_age_months: 36, max_age_months: 72 }
              as: ComplianceOfficer
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /montessori/staff-assignments"
              payload: { classroom_id: "${room_id}", staff_name: "Maria", expected_classroom_version: "${room_v0}" }
              as: ComplianceOfficer
            - call: "POST /montessori/students"
              payload: { parent_user_id: "parent-1", full_name: "Kid One", date_of_birth: "2022-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
              captures: { stu_id: $.data.id }
            - call: "POST /montessori/applications"
              payload: { student_id: "${stu_id}", classroom_id: "${room_id}", tier_id: "${tier_id}" }
              as: Parent
              as_user_id: "parent-1"
              captures: { app_id: $.data.id }
            - call: "POST /montessori/applications/${app_id}/start-review"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${app_id}/offer"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /montessori/applications/${app_id}/accept-offer"
              payload: { program_start_date: "2026-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
              captures: { enr_id: $.data.id }
          assert:
            - "Enrollment.${enr_id}.net_annual_cents == 1000001"
            - "Enrollment.${enr_id}.monthly_installment_cents == 100000 (round_half_up(1000001/10)=100000, single rounding on the quotient)"

  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_revision_cycle_under_review_changes_requested
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_CHANGES_REQUESTED
          - state_machines.Application.CHANGES_REQUESTED_to_UNDER_REVIEW
        distinguishing_aspect: "Application exhibits a cycle UNDER_REVIEW -> CHANGES_REQUESTED -> UNDER_REVIEW (the application returns to a state it already visited), distinct from the linear pipelines."
        test_recipe:
          setup:
            - "An Application in SUBMITTED owned by parent-1."
          setup_api_calls:
            - call: "POST /montessori/classrooms"
              payload: { name: "Primary E", level: "PRIMARY", capacity: 5, min_age_months: 36, max_age_months: 72 }
              as: ComplianceOfficer
              captures: { room_id: $.data.id }
            - call: "POST /montessori/tiers"
              payload: { code: "STD", level: "PRIMARY", base_annual_cents: 1000000, deposit_pct: 0.10 }
              as: Registrar
              captures: { tier_id: $.data.id }
            - call: "POST /montessori/students"
              payload: { parent_user_id: "parent-1", full_name: "Kid One", date_of_birth: "2022-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
              captures: { stu_id: $.data.id }
            - call: "POST /montessori/applications"
              payload: { student_id: "${stu_id}", classroom_id: "${room_id}", tier_id: "${tier_id}" }
              as: Parent
              as_user_id: "parent-1"
              captures: { app_id: $.data.id }
            - call: "POST /montessori/applications/${app_id}/start-review"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${app_id}/request-changes"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /montessori/applications/${app_id}/resubmit"
              payload: {}
              as: Parent
              as_user_id: "parent-1"
              captures: { st: $.data.status, v: $.data.version }
          assert:
            - "Application.${app_id}.status == UNDER_REVIEW after resubmit (returned to a prior state)"
            - "Application.${app_id}.version == 4 (submit=1, start-review=2, request-changes=3, resubmit=4)"

      - name: enrollment_parallel_placement_and_billing_dimensions
        grounds:
          - state_machines.Enrollment.placement:PLACED_to_placement:ON_LEAVE
          - state_machines.Enrollment.billing:DEPOSIT_DUE_to_billing:ACTIVE
          - entities.Enrollment.fields.placement_status
          - entities.Enrollment.fields.billing_status
        distinguishing_aspect: "On Enrollment (a different entity than Application), placement_status and billing_status evolve on independent axes: going PLACED->ON_LEAVE leaves billing_status unchanged, and DEPOSIT_DUE->ACTIVE via deposit leaves placement_status unchanged."
        test_recipe:
          setup:
            - "Clock 2026-09-01. STANDARD tier base 1000000 deposit_pct 0.10 (deposit 100000). PRIMARY room compliant, capacity 5."
            - "Child aged 43mo ENROLLED (placement PLACED, billing DEPOSIT_DUE)."
          setup_api_calls:
            - call: "POST /montessori/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /montessori/tiers"
              payload: { code: "STD", level: "PRIMARY", base_annual_cents: 1000000, deposit_pct: 0.10, installments: 10 }
              as: Registrar
              captures: { tier_id: $.data.id }
            - call: "POST /montessori/classrooms"
              payload: { name: "Primary F", level: "PRIMARY", capacity: 5, min_age_months: 36, max_age_months: 72 }
              as: ComplianceOfficer
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /montessori/staff-assignments"
              payload: { classroom_id: "${room_id}", staff_name: "Maria", expected_classroom_version: "${room_v0}" }
              as: ComplianceOfficer
            - call: "POST /montessori/students"
              payload: { parent_user_id: "parent-1", full_name: "Kid One", date_of_birth: "2022-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
              captures: { stu_id: $.data.id }
            - call: "POST /montessori/applications"
              payload: { student_id: "${stu_id}", classroom_id: "${room_id}", tier_id: "${tier_id}" }
              as: Parent
              as_user_id: "parent-1"
              captures: { app_id: $.data.id }
            - call: "POST /montessori/applications/${app_id}/start-review"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${app_id}/offer"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${app_id}/accept-offer"
              payload: { program_start_date: "2026-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
              captures: { enr_id: $.data.id }
            - call: "POST /montessori/payments"
              payload: { enrollment_id: "${enr_id}", kind: "DEPOSIT", amount_cents: 100000 }
              as: Registrar
          trigger:
            - call: "POST /montessori/enrollments/${enr_id}/leave"
              payload: {}
              as: Registrar
              captures: { ps: $.data.placement_status, bs: $.data.billing_status }
          assert:
            - "Enrollment.${enr_id}.placement_status == ON_LEAVE after leave"
            - "Enrollment.${enr_id}.billing_status == ACTIVE (unchanged by the placement transition; deposit had advanced it independently)"

  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: withdraw_frees_seat_promotes_waitlisted_depth3
        grounds:
          - state_machines.Enrollment.placement:PLACED_to_placement:WITHDRAWN
          - state_machines.Application.WAITLISTED_to_OFFERED
          - calculations.ratio_compliance
          - calculations.waitlist_priority
        distinguishing_aspect: "Depth-3 cascade from POST /enrollments/{id}/withdraw: (hop1) Enrollment->WITHDRAWN decrements Classroom.placed_count; (hop2) the freed seat causes the system to select the top WAITLISTED Application; (hop3) that selection transitions the Application WAITLISTED->OFFERED and bumps its version — each link caused by the prior link."
        test_recipe:
          setup:
            - "Clock 2026-09-01. PRIMARY room capacity 1, 1 staff (compliant). STANDARD tier."
            - "Child A ENROLLED+PLACED (fills the single seat). Child B WAITLISTED for the same room."
          setup_api_calls:
            - call: "POST /montessori/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /montessori/tiers"
              payload: { code: "STD", level: "PRIMARY", base_annual_cents: 1000000, deposit_pct: 0.10, installments: 10 }
              as: Registrar
              captures: { tier_id: $.data.id }
            - call: "POST /montessori/classrooms"
              payload: { name: "Primary G", level: "PRIMARY", capacity: 1, min_age_months: 36, max_age_months: 72 }
              as: ComplianceOfficer
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /montessori/staff-assignments"
              payload: { classroom_id: "${room_id}", staff_name: "Maria", expected_classroom_version: "${room_v0}" }
              as: ComplianceOfficer
            - call: "POST /montessori/students"
              payload: { parent_user_id: "parent-a", full_name: "Child A", date_of_birth: "2022-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-a"
              captures: { stu_a: $.data.id }
            - call: "POST /montessori/applications"
              payload: { student_id: "${stu_a}", classroom_id: "${room_id}", tier_id: "${tier_id}" }
              as: Parent
              as_user_id: "parent-a"
              captures: { app_a: $.data.id }
            - call: "POST /montessori/applications/${app_a}/start-review"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${app_a}/offer"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${app_a}/accept-offer"
              payload: { program_start_date: "2026-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-a"
              captures: { enr_a: $.data.id }
            - call: "POST /montessori/students"
              payload: { parent_user_id: "parent-b", full_name: "Child B", date_of_birth: "2022-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-b"
              captures: { stu_b: $.data.id }
            - call: "POST /montessori/applications"
              payload: { student_id: "${stu_b}", classroom_id: "${room_id}", tier_id: "${tier_id}" }
              as: Parent
              as_user_id: "parent-b"
              captures: { app_b: $.data.id }
            - call: "POST /montessori/applications/${app_b}/start-review"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${app_b}/waitlist"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /montessori/enrollments/${enr_a}/withdraw"
              payload: {}
              as: Registrar
          assert:
            - "Classroom.${room_id}.placed_count == 0 after withdraw (hop1)"
