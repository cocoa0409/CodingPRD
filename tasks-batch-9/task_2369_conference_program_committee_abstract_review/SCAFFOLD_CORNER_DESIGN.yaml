            - "CommitteeMember.${mb_r1_id}.current_review_load == 0"

      - name: weighted_score_clamps_at_the_five_point_five_ceiling
        claim_type: constants_applied
        grounds:
          - calculations.review_weighted_score
          - calculations.review_weighted_score.constants.SCORE_CEILING
