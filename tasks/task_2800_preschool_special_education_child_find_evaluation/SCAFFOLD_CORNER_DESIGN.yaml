      - name: only_a_granted_evaluation_consent_is_revocable
        claim_type: violation_to_error
        grounds:
          - validations[priority=29]
          - validations[priority=11]
        distinguishing_aspect: |
          Revocation is gated on the record's KIND as well as its state. A
          GRANTED service consent sits in a state from which REVOKED is declared,
          so it clears the priority-11 state rule and is refused by priority 29
          with ERR_CONSENT_NOT_REVOCABLE - the plan it authorised stays ACTIVE.
