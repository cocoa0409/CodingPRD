  - name: zone_venue_mismatch_rejects_foreign_zone_and_non_supervisor_report_target
    claim_type: violation_to_error
    grounds:
    - validations[priority=8]
    - errors.ERR_ZONE_VENUE_MISMATCH
    - endpoints[POST /event-security/staffing-plans/{id}/posts]
    - endpoints[POST /event-security/security-events/{id}/screening-lanes]
    - endpoints[POST /event-security/security-events/{id}/density-readings]
    distinguishing_aspect: |
      ERR_ZONE_VENUE_MISMATCH is the only §1.4 rule that bundles FOUR distinct referential-integrity claims under one error id, and each has to be probed separately because they live on different endpoints and read different relationships: a zone that exists but belongs to another venue (posts, lanes, readings) and a reports_to_post_id that resolves to a post that is simply not a SUPERVISOR. Both are 422s, not 404s — the referenced rows exist, they are just wired to the wrong parent.
