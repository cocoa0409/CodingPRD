            - call: "POST /clients/${cli}/receipts"
              payload: { sku_id: "${sku}", bin_id: "${bin}", expected_qty: 5 }
              as: ReceivingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 409"
            - "response error_id == ERR_CLIENT_SUSPENDED"

