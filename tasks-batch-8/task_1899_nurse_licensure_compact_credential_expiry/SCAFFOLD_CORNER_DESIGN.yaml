            - { call: "POST /credentialing/packet-items/${item_lv}/submit-evidence", payload: { evidence_ref: "e1" }, as: Nurse, as_user_id: "${n_id}" }
            - { call: "POST /credentialing/packet-items/${item_bls}/submit-evidence", payload: { evidence_ref: "e2" }, as: Nurse, as_user_id: "${n_id}" }
            - { call: "POST /credentialing/packet-items/${item_comp}/submit-evidence", payload: { evidence_ref: "e3" }, as: Nurse, as_user_id: "${n_id}" }
            - { call: "POST /credentialing/packet-items/${item_att}/submit-evidence", payload: { evidence_ref: "e4" }, as: Nurse, as_user_id: "${n_id}" }
            - { call: "POST /credentialing/packet-items/${item_lv}/verify", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/packet-items/${item_bls}/verify", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/packet-items/${item_comp}/verify", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/packet-items/${item_att}/verify", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/credential-packets/${pkt_id}/submit", payload: {}, as: Nurse, as_user_id: "${n_id}" }
            - { call: "POST /credentialing/credential-packets/${pkt_id}/start-review", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-2" }
          trigger:
            - { call: "POST /credentialing/credential-packets/${pkt_id}/approve", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-2" }
