      - name: corner_missing_auth_header_is_unauthorized_before_not_found
        claim_type: priority_ordering
        grounds:
          - validations[priority=10]
          - validations[priority=30]
          - errors[ERR_MISSING_AUTH_HEADER]
        distinguishing_aspect: |
          Priority 10 runs ahead of the priority-30 path-id existence tier: an unauthenticated
          GET of a non-existent order id returns 401 ERR_MISSING_AUTH_HEADER, not 404
          ERR_ORDER_NOT_FOUND, so authentication is never skipped to answer existence questions.
        test_recipe:
          setup:
            - "empty database; no setup rows are needed because neither call authenticates"
          setup_api_calls: []
          trigger:
            - call: "GET /products"
              payload: {}
              as: NONE
              captures: { err_a: $.data.error_id }
            - call: "GET /orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NONE
              captures: { err_b: $.data.error_id }
          assert:
            - "both calls omit the Authorization header entirely"
            - "first response: HTTP status 401 and data.error_id == \"ERR_MISSING_AUTH_HEADER\""
            - "second response: HTTP status 401 and data.error_id == \"ERR_MISSING_AUTH_HEADER\""
            - 'second response: data.error_id != "ERR_ORDER_NOT_FOUND"'
            - 'both responses: response_type == "error" with data.error_id and data.message present'

