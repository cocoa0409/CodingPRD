# =============================================================================
# §1.8 Scaffold Difficulty Design — task_1396
# Test Targeting Index: 9 Difficulty Rules x instances, all grounded in
# SCAFFOLD.yaml §1.1–§1.7. Every numeric literal below was computed by
# executing the §1.3 formulas with the pinned plan constants:
#   plan P1: royalty_pct 0.06, royalty_cap_cents 300000, eo_fee_cents 6000,
#            transaction_fee_cents 25000, mentor_split_pct 0.10,
#            mentor_deal_count 3, tiers [{2500000, 0.30}, {0, 0.0}]
# =============================================================================

scaffold_difficulty_design:
  # ------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_estimate_vs_final_settlement_on_debit_shift
        grounds:
          - calculations.payout_waterfall
          - endpoints: "GET /brokerage/deals/{dealId}/payout-estimate"
          - endpoints: "POST /brokerage/deals/{dealId}/settle"
          - entities.Settlement.fields.debit_recovery_cents
        distinguishing_aspect: |
          Same deal data, same formula: the provisional estimate runs BEFORE a
          debit exists (debit_recovery_cents 0, agent_net_cents 627000) while the
          final settlement runs AFTER a manual debit accrual of 150000
          (debit_recovery_cents 150000, agent_net_cents 477000) — entity domain:
          Deal/Settlement payout.
        test_recipe:
          setup:
            - "Agent ACTIVE, enrolled in plan P1 (effective 2025-09-01), joined 2025-09-01"
            - "Deal gross 1000000, closing 2026-01-15, CLOSED with trust receipt"
            - "Estimate taken while debit_balance_cents == 0; then a 150000 manual debit accrues; then settle"
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Alice Agent", email: "alice@x.com", license_number: "LIC-A1", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { ag_id: $.data.id, ag_v0: $.data.version }
            - call: "POST /brokerage/agents/${ag_id}/activate"
              payload: {}
              as: BrokerAdmin
              captures: { ag_v1: $.data.version }
            - call: "POST /brokerage/plans"
              payload: { name: "P1", royalty_pct: 0.06, royalty_cap_cents: 300000, eo_fee_cents: 6000, transaction_fee_cents: 25000, mentor_split_pct: 0.10, mentor_deal_count: 3, tiers: [ { threshold_company_dollar_cents: 2500000, broker_split_pct: 0.30 }, { threshold_company_dollar_cents: 0, broker_split_pct: 0.0 } ] }
              as: BrokerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /brokerage/plans/${plan_id}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /brokerage/agents/${ag_id}/enrollments"
              payload: { plan_id: "${plan_id}", effective_from: "2025-09-01", expected_agent_version: "${ag_v1}" }
              as: BrokerAdmin
            - call: "POST /brokerage/deals"
              payload: { agent_id: "${ag_id}", address: "1 Main St", gross_commission_cents: 1000000, closing_date: "2026-01-15" }
              as: TransactionCoordinator
              captures: { deal_id: $.data.id }
            - call: "POST /brokerage/deals/${deal_id}/submit"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /brokerage/deals/${deal_id}/close"
              payload: {}
              as: TransactionCoordinator
            - call: "GET /brokerage/deals/${deal_id}/payout-estimate"
              payload: {}
              as: TransactionCoordinator
              captures: { est_net: $.data.agent_net_cents, est_rec: $.data.debit_recovery_cents }
            - call: "POST /brokerage/agents/${ag_id}/debit-adjustments"
              payload: { amount_cents: 150000, reason: "advance E&O premium" }
              as: BrokerAdmin
          trigger:
            - call: "POST /brokerage/deals/${deal_id}/settle"
              payload: {}
              as: TransactionCoordinator
              captures: { set_net: $.data.agent_net_cents, set_rec: $.data.debit_recovery_cents, set_comp: $.data.company_dollar_cents }
          assert:
            - "estimate: ${est_rec} == 0 and ${est_net} == 627000"
            - "settlement: ${set_rec} == 150000 and ${set_net} == 477000"
            - "Settlement.company_dollar_cents == 282000 (identical deal data, variants diverge only through debit state)"
            - "Agent.${ag_id}.debit_balance_cents == 0 after settle"

      - name: tax_1099_cash_basis_vs_accrual_basis_across_year_boundary
        grounds:
          - calculations.tax_1099_totals
          - entities.TaxForm1099.fields.gross_paid_cents
          - entities.TaxForm1099.fields.accrual_gross_cents
        distinguishing_aspect: |
          Same money, two valid reportable totals on the TaxForm1099 domain (not
          Deal): cash basis keys on leg released_at, accrual on settlement
          posted_at — a deal posted 2026-12-20 but released 2027-01-05 yields
          gross_paid_cents 0 vs accrual_gross_cents 658000 for tax_year 2026.
        test_recipe:
          setup:
            - "Agent ACTIVE on plan P1 (effective 2025-09-01), joined 2025-09-01"
            - "Deal gross 1000000 closed 2026-12-20 and settled while clock is in December 2026 (posted in tax year 2026)"
            - "Agent leg stays SCHEDULED past midnight 2026-12-31; clock advances to 2027-01-05; leg authorized+released in 2027"
          setup_api_calls:
            - call: "POST /brokerage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-20T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /brokerage/agents"
              payload: { full_name: "Betty Basis", email: "betty@x.com", license_number: "LIC-B1", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { ag_id: $.data.id, ag_v0: $.data.version }
            - call: "POST /brokerage/agents/${ag_id}/activate"
              payload: {}
              as: BrokerAdmin
              captures: { ag_v1: $.data.version }
            - call: "POST /brokerage/plans"
              payload: { name: "P1", royalty_pct: 0.06, royalty_cap_cents: 300000, eo_fee_cents: 6000, transaction_fee_cents: 25000, mentor_split_pct: 0.10, mentor_deal_count: 3, tiers: [ { threshold_company_dollar_cents: 2500000, broker_split_pct: 0.30 }, { threshold_company_dollar_cents: 0, broker_split_pct: 0.0 } ] }
              as: BrokerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /brokerage/plans/${plan_id}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /brokerage/agents/${ag_id}/enrollments"
              payload: { plan_id: "${plan_id}", effective_from: "2025-09-01", expected_agent_version: "${ag_v1}" }
              as: BrokerAdmin
            - call: "POST /brokerage/deals"
              payload: { agent_id: "${ag_id}", address: "9 Year-End Ln", gross_commission_cents: 1000000, closing_date: "2026-12-20" }
              as: TransactionCoordinator
              captures: { deal_id: $.data.id }
            - call: "POST /brokerage/deals/${deal_id}/submit"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /brokerage/deals/${deal_id}/close"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /brokerage/deals/${deal_id}/settle"
              payload: {}
              as: TransactionCoordinator
              as_user_id: "tc-77"
              captures: { setl_id: $.data.id }
            - call: "GET /brokerage/disbursement-legs?settlement_id=${setl_id}&payee_type=AGENT"
              payload: {}
              as: OfficeManager
              captures: { agent_leg_id: "$.data[0].id" }
            - call: "POST /brokerage/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /brokerage/disbursement-legs/${agent_leg_id}/authorize"
              payload: {}
              as: OfficeManager
              as_user_id: "om-1"
            - call: "POST /brokerage/disbursement-legs/${agent_leg_id}/release"
              payload: {}
              as: OfficeManager
              as_user_id: "om-2"
          trigger:
            - call: "POST /brokerage/agents/${ag_id}/tax-forms"
              payload: { tax_year: 2026 }
              as: BrokerAdmin
              captures: { tf_cash: $.data.gross_paid_cents, tf_accrual: $.data.accrual_gross_cents, tf_req: $.data.filing_required }
          assert:
            - "TaxForm1099.gross_paid_cents == 0 (cash basis: nothing released inside 2026)"
            - "TaxForm1099.accrual_gross_cents == 658000 (accrual keys on the settlement's agent_gross_cents posted in 2026)"
            - "filing_required == false for tax_year 2026 despite 658000 accrued"
            - "the two variants differ by exactly the unsettled-at-year-end agent gross: cash 0 vs accrual 658000"

  # ------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: waterfall_tier_branch_with_nested_min_mode_a
        grounds:
          - calculations.tier_split_with_cap_clip
          - calculations.payout_waterfall
        distinguishing_aspect: |
          Mode (a) combinatorial: >=3 inputs (after_royalty, accrued company
          dollar, tier table, debit balance) with non-linear interaction —
          nested min() on cap room and tier-branch selection — here on a deal
          that is NOT clipped (accrued 0) so the branch is tier 0 and
          company_dollar is the unclipped 282000.
        test_recipe:
          setup:
            - "Agent ACTIVE on plan P1 effective 2025-09-01; deal gross 1000000 closing 2026-01-15 CLOSED; debit balance 150000 pre-loaded"
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Cara Combo", email: "cara@x.com", license_number: "LIC-C1", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { ag_id: $.data.id, ag_v0: $.data.version }
            - call: "POST /brokerage/agents/${ag_id}/activate"
              payload: {}
              as: BrokerAdmin
              captures: { ag_v1: $.data.version }
            - call: "POST /brokerage/plans"
              payload: { name: "P1", royalty_pct: 0.06, royalty_cap_cents: 300000, eo_fee_cents: 6000, transaction_fee_cents: 25000, mentor_split_pct: 0.10, mentor_deal_count: 3, tiers: [ { threshold_company_dollar_cents: 2500000, broker_split_pct: 0.30 }, { threshold_company_dollar_cents: 0, broker_split_pct: 0.0 } ] }
              as: BrokerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /brokerage/plans/${plan_id}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /brokerage/agents/${ag_id}/enrollments"
              payload: { plan_id: "${plan_id}", effective_from: "2025-09-01", expected_agent_version: "${ag_v1}" }
              as: BrokerAdmin
            - call: "POST /brokerage/agents/${ag_id}/debit-adjustments"
              payload: { amount_cents: 150000, reason: "seed debit" }
              as: BrokerAdmin
            - call: "POST /brokerage/deals"
              payload: { agent_id: "${ag_id}", address: "2 Nested Min Rd", gross_commission_cents: 1000000, closing_date: "2026-01-15" }
              as: TransactionCoordinator
              captures: { deal_id: $.data.id }
            - call: "POST /brokerage/deals/${deal_id}/submit"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /brokerage/deals/${deal_id}/close"
              payload: {}
              as: TransactionCoordinator
          trigger:
            - call: "POST /brokerage/deals/${deal_id}/settle"
              payload: {}
              as: TransactionCoordinator
              captures: { s: $.data }
          assert:
            - "royalty_cents == 60000 (min(round(0.06*1000000), 300000 room))"
            - "tier_index_applied == 0 and company_dollar_cents == 282000 and cap_clipped == false"
            - "agent_gross_cents == 658000; eo_fee_cents == 6000; transaction_fee_cents == 25000"
            - "debit_recovery_cents == 150000 and agent_net_cents == 477000"

      - name: per_step_rounding_order_mode_b
        grounds:
          - calculations.referral_fee
          - calculations.payout_leg_composition
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-half-up at EACH
          waterfall step before composition. On gross 105555 with referral 0.25,
          referral rounds 26388.75 up to 26389 BEFORE royalty is computed —
          royalty is round(0.06 * 79166) = 4750, whereas carrying the fractional
          referral (26388.75) and rounding later yields a different royalty
          (4749.97 territory) — the pinned per-step order is observable in
          Settlement.referral_fee_cents == 26389 and royalty_cents == 4750.
        test_recipe:
          setup:
            - "Agent ACTIVE on plan P1 effective 2025-09-01; a second agent as referral recipient"
            - "Deal gross 105555, closing 2026-01-15, referral_pct 0.25 to the second agent, CLOSED"
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Rick Referrer", email: "rick@x.com", license_number: "LIC-R1", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { ref_agent_id: $.data.id }
            - call: "POST /brokerage/agents"
              payload: { full_name: "Dana Deal", email: "dana@x.com", license_number: "LIC-D1", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { ag_id: $.data.id, ag_v0: $.data.version }
            - call: "POST /brokerage/agents/${ag_id}/activate"
              payload: {}
              as: BrokerAdmin
              captures: { ag_v1: $.data.version }
            - call: "POST /brokerage/plans"
              payload: { name: "P1", royalty_pct: 0.06, royalty_cap_cents: 300000, eo_fee_cents: 6000, transaction_fee_cents: 25000, mentor_split_pct: 0.10, mentor_deal_count: 3, tiers: [ { threshold_company_dollar_cents: 2500000, broker_split_pct: 0.30 }, { threshold_company_dollar_cents: 0, broker_split_pct: 0.0 } ] }
              as: BrokerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /brokerage/plans/${plan_id}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /brokerage/agents/${ag_id}/enrollments"
              payload: { plan_id: "${plan_id}", effective_from: "2025-09-01", expected_agent_version: "${ag_v1}" }
              as: BrokerAdmin
            - call: "POST /brokerage/deals"
              payload: { agent_id: "${ag_id}", address: "5 Rounding Way", gross_commission_cents: 105555, closing_date: "2026-01-15", referral_pct: 0.25, referral_agent_id: "${ref_agent_id}" }
              as: TransactionCoordinator
              captures: { deal_id: $.data.id }
            - call: "POST /brokerage/deals/${deal_id}/submit"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /brokerage/deals/${deal_id}/close"
              payload: {}
              as: TransactionCoordinator
          trigger:
            - call: "POST /brokerage/deals/${deal_id}/settle"
              payload: {}
              as: TransactionCoordinator
              captures: { setl_id: $.data.id, ref_fee: $.data.referral_fee_cents, roy: $.data.royalty_cents, cd: $.data.company_dollar_cents, net: $.data.agent_net_cents }
          assert:
            - "referral_fee_cents == 26389 (26388.75 rounded half-up AT the referral step)"
            - "royalty_cents == 4750 (round of 0.06 * 79166 = 4749.96, computed on the ALREADY-ROUNDED adjusted base)"
            - "company_dollar_cents == 22325 and agent_net_cents == 21091"
            - "leg conservation: sum of non-voided legs of settlement ${setl_id} == 105555"

      - name: settlement_order_governs_cap_allocation_mode_c
        grounds:
          - calculations.payout_waterfall
          - calculations.tier_split_with_cap_clip
        distinguishing_aspect: |
          Mode (c) circular-looking dependency pinned by evaluation order: tier
          selection reads the accumulator BEFORE the deal posts, and the
          settlement-time order (not closing_date order) decides which deal
          clips the 2500000 cap. Two deals with identical closings: settle the
          3000000 one first and it absorbs 846000 of company dollar; the later
          1000000 settle then sees accrued 846000 and computes its own 282000 —
          and reversing the settle order swaps which settlement carries which
          company dollar while the two totals stay identical (1128000).
        test_recipe:
          setup:
            - "Agent ACTIVE on plan P1 effective 2025-09-01"
            - "Deal BIG gross 3000000 closing 2026-01-10; Deal SMALL gross 1000000 closing 2026-01-20 (LATER closing date)"
            - "Both CLOSED; SMALL is settled FIRST despite the later closing date"
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Oliver Order", email: "oliver@x.com", license_number: "LIC-O1", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { ag_id: $.data.id, ag_v0: $.data.version }
            - call: "POST /brokerage/agents/${ag_id}/activate"
              payload: {}
              as: BrokerAdmin
              captures: { ag_v1: $.data.version }
            - call: "POST /brokerage/plans"
              payload: { name: "P1", royalty_pct: 0.06, royalty_cap_cents: 300000, eo_fee_cents: 6000, transaction_fee_cents: 25000, mentor_split_pct: 0.10, mentor_deal_count: 3, tiers: [ { threshold_company_dollar_cents: 2500000, broker_split_pct: 0.30 }, { threshold_company_dollar_cents: 0, broker_split_pct: 0.0 } ] }
              as: BrokerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /brokerage/plans/${plan_id}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /brokerage/agents/${ag_id}/enrollments"
              payload: { plan_id: "${plan_id}", effective_from: "2025-09-01", expected_agent_version: "${ag_v1}" }
              as: BrokerAdmin
            - call: "POST /brokerage/deals"
              payload: { agent_id: "${ag_id}", address: "10 Big Blvd", gross_commission_cents: 3000000, closing_date: "2026-01-10" }
              as: TransactionCoordinator
              captures: { big_id: $.data.id }
            - call: "POST /brokerage/deals"
              payload: { agent_id: "${ag_id}", address: "11 Small St", gross_commission_cents: 1000000, closing_date: "2026-01-20" }
              as: TransactionCoordinator
              captures: { small_id: $.data.id }
            - call: "POST /brokerage/deals/${big_id}/submit"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /brokerage/deals/${big_id}/close"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /brokerage/deals/${small_id}/submit"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /brokerage/deals/${small_id}/close"
              payload: {}
              as: TransactionCoordinator
          trigger:
            - call: "POST /brokerage/deals/${small_id}/settle"
              payload: {}
              as: TransactionCoordinator
              captures: { small_cd: $.data.company_dollar_cents, small_roy: $.data.royalty_cents }
            - call: "POST /brokerage/deals/${big_id}/settle"
              payload: {}
              as: TransactionCoordinator
              captures: { big_cd: $.data.company_dollar_cents, big_roy: $.data.royalty_cents }
          assert:
            - "SMALL settled first: ${small_cd} == 282000 with accrued 0 (no clip); ${small_roy} == 60000"
            - "BIG settled second: ${big_cd} == 846000 with accrued 282000 (no clip; room was 2218000); ${big_roy} == 180000 (royalty room 240000, not clipped)"
            - "AnniversaryPeriod.company_dollar_accrued_cents == 1128000 regardless of order; the per-deal allocation (which settlement carries 282000 vs 846000) depends on settle order — SMALL carried 282000 because it posted first"

  # ------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: deal_edit_cycle_and_settle_unsettle_loop
        grounds:
          - state_machines.Deal.DRAFT_to_PENDING_CLOSING
          - state_machines.Deal.PENDING_CLOSING_to_DRAFT
          - state_machines.Deal.CLOSED_to_SETTLED
          - state_machines.Deal.SETTLED_to_CLOSED
        distinguishing_aspect: |
          Deal is cyclic on TWO loops (DRAFT<->PENDING_CLOSING edit cycle, and
          CLOSED<->SETTLED via unsettle): a deal withdrawn, edited, resubmitted,
          closed, settled, then unsettled returns to CLOSED and can settle again
          with a recomputed schedule — the second settle observes accumulators
          restored by the unsettle.
        test_recipe:
          setup:
            - "Agent ACTIVE on plan P1; deal gross 1000000 closing 2026-01-15; cycled DRAFT->PENDING->DRAFT->PENDING->CLOSED->SETTLED->CLOSED"
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Cycla Cycle", email: "cycla@x.com", license_number: "LIC-CY1", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { ag_id: $.data.id, ag_v0: $.data.version }
            - call: "POST /brokerage/agents/${ag_id}/activate"
              payload: {}
              as: BrokerAdmin
              captures: { ag_v1: $.data.version }
            - call: "POST /brokerage/plans"
              payload: { name: "P1", royalty_pct: 0.06, royalty_cap_cents: 300000, eo_fee_cents: 6000, transaction_fee_cents: 25000, mentor_split_pct: 0.10, mentor_deal_count: 3, tiers: [ { threshold_company_dollar_cents: 2500000, broker_split_pct: 0.30 }, { threshold_company_dollar_cents: 0, broker_split_pct: 0.0 } ] }
              as: BrokerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /brokerage/plans/${plan_id}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /brokerage/agents/${ag_id}/enrollments"
              payload: { plan_id: "${plan_id}", effective_from: "2025-09-01", expected_agent_version: "${ag_v1}" }
              as: BrokerAdmin
            - call: "POST /brokerage/deals"
              payload: { agent_id: "${ag_id}", address: "20 Loop Ln", gross_commission_cents: 900000, closing_date: "2026-01-15" }
              as: TransactionCoordinator
              captures: { deal_id: $.data.id }
            - call: "POST /brokerage/deals/${deal_id}/submit"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /brokerage/deals/${deal_id}/withdraw"
              payload: {}
              as: TransactionCoordinator
              captures: { back_in_draft: $.data.status }
            - call: "PUT /brokerage/deals/${deal_id}"
              payload: { address: "20 Loop Ln", gross_commission_cents: 1000000, closing_date: "2026-01-15" }
              as: TransactionCoordinator
            - call: "POST /brokerage/deals/${deal_id}/submit"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /brokerage/deals/${deal_id}/close"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /brokerage/deals/${deal_id}/settle"
              payload: {}
              as: TransactionCoordinator
              captures: { first_cd: $.data.company_dollar_cents }
            - call: "POST /brokerage/deals/${deal_id}/unsettle"
              payload: {}
              as: TransactionCoordinator
              captures: { back_closed: $.data.status }
          trigger:
            - call: "POST /brokerage/deals/${deal_id}/settle"
              payload: {}
              as: TransactionCoordinator
              captures: { second_cd: $.data.company_dollar_cents, second_st: $.data.status }
          assert:
            - "${back_in_draft} == DRAFT and ${back_closed} == CLOSED (both loops traversed)"
            - "first settle company_dollar_cents == 282000 (after gross edit to 1000000)"
            - "second settle company_dollar_cents == 282000 again (unsettle restored the accumulator exactly; no double-count)"
            - "${second_st} == POSTED"

      - name: agent_suspend_reinstate_cycle_preserves_financial_state
        grounds:
          - state_machines.Agent.ACTIVE_to_SUSPENDED
          - state_machines.Agent.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Agent has a revert loop ACTIVE<->SUSPENDED (a different entity than
          Deal): the loop is traversable twice and does NOT disturb debit
          balance, settled_deal_count, or the ACTIVE enrollment — state shape
          is branching-with-revert, not a linear pipeline.
        test_recipe:
          setup:
            - "Agent ACTIVE on plan P1 with one settled deal (debit 150000 seeded then fully recovered)"
          setup_api_calls:
            - call: "POST /brokerage/agents"
