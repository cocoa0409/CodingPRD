  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # --- 8.A response-window interval semantics (point deadline, latched by first action)
      - name: sla_response_window_point_deadline_latches_on_first_action
        grounds:
          - calculations.sla_due
          - entities.Task.fields.response_due_iso
          - entities.Task.fields.first_action_at_iso
          - entities.Task.fields.sla_state
        distinguishing_aspect: |
          Interval semantics #1 (a point-in-window response deadline): the response window runs
          from assigned_at to response_due_iso and is occupied only while first_action_at_iso is
          null. With STANDARD response_minutes=60, an ASSIGNED task whose clock advances past
          2026-03-01T01:00:00Z BEFORE any first action breaches RESPONSE; once the VA starts
          (first action stamped), the response window no longer applies. Geometry: open-ended
          occupancy cleared by an event — distinct from 8.B's cumulative resolution window.
        test_recipe:
          setup:
            - "STANDARD policy response_minutes=60; task ASSIGNED at 2026-03-01T00:00:00Z, never started."
          setup_api_calls:
            - call: "POST /va-staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: StaffingManager
            - call: "POST /va-staffing/skill-tags"
              payload: { code: "RESEARCH", name: "Research", is_specialized: false }
              as: StaffingManager
              captures: { skill: $.data.id }
