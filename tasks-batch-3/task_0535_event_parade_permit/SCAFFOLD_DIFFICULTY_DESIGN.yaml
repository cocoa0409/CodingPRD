  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: capacity_vs_double_booking_priority
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_CAPACITY_EXCEEDED]
          - errors[ERR_VENUE_DOUBLE_BOOKED]
        distinguishing_aspect: |
          On submit-for-review a request that BOTH exceeds venue capacity
          (business_safety, priority 8) AND overlaps a booked window
          (business_temporal, priority 9) returns ERR_CAPACITY_EXCEEDED — the
          business_safety vs business_temporal pairing.
        test_recipe:
          setup:
            - "Venue cap 1000, buffer 60; a first app already submitted booking 10:00-14:00; a second app with attendance 2000 (>cap) and window overlapping the first, about to submit."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Small Sq", venue_type: "PLAZA", max_capacity: 1000, setup_buffer_minutes: 60 }
              as: PermitOfficer
              captures: { venue_id: $.data.id, venue_v0: $.data.version }
            - call: "POST /closure-schedules"
              payload: { corridor_name: "A St", min_gap_minutes: 30 }
              as: PermitOfficer
              captures: { sched1: $.data.id }
            - call: "POST /closure-schedules"
              payload: { corridor_name: "B St", min_gap_minutes: 30 }
              as: PermitOfficer
              captures: { sched2: $.data.id }
            - call: "POST /applicants"
              payload: { org_name: "Org G1", contact_email: "g1@x.com" }
              as: PermitOfficer
              captures: { u1: $.data.id }
            - call: "POST /applicants"
              payload: { org_name: "Org G2", contact_email: "g2@x.com" }
              as: PermitOfficer
              captures: { u2: $.data.id }
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org G1", venue_id: "${venue_id}", event_kind: "PARADE", expected_attendance: 800, occupy_start: "2026-06-09T10:00:00Z", occupy_end: "2026-06-09T14:00:00Z" }
              as: Applicant
              as_user_id: "${u1}"
              captures: { app1: $.data.id }
            - call: "POST /permit-applications/${app1}/route-segments"
              payload: { closure_schedule_id: "${sched1}", segment_label: "A 1-3", closure_start: "2026-06-09T09:00:00Z", closure_end: "2026-06-09T15:00:00Z" }
              as: Applicant
              as_user_id: "${u1}"
            - call: "POST /permit-applications/${app1}/submit-for-review"
              payload: { expected_venue_version: "${venue_v0}" }
              as: Applicant
              as_user_id: "${u1}"
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: PermitOfficer
              captures: { venue_v1: $.data.version }
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org G2", venue_id: "${venue_id}", event_kind: "FESTIVAL", expected_attendance: 2000, occupy_start: "2026-06-09T12:00:00Z", occupy_end: "2026-06-09T16:00:00Z" }
              as: Applicant
              as_user_id: "${u2}"
              captures: { app2: $.data.id }
            - call: "POST /permit-applications/${app2}/route-segments"
              payload: { closure_schedule_id: "${sched2}", segment_label: "B 1-3", closure_start: "2026-06-09T11:00:00Z", closure_end: "2026-06-09T17:00:00Z" }
              as: Applicant
              as_user_id: "${u2}"
          trigger:
            - call: "POST /permit-applications/${app2}/submit-for-review"
              payload: { expected_venue_version: "${venue_v1}" }
              as: Applicant
              as_user_id: "${u2}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CAPACITY_EXCEEDED (priority 8 wins over priority 9)"
            - "HTTP status == 409"

      - name: coverage_vs_coi_expiry_priority
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - errors[ERR_COI_EXPIRES_BEFORE_EVENT]
          - errors[ERR_COI_COVERAGE_INSUFFICIENT]
        distinguishing_aspect: |
          On COI accept a certificate that BOTH expires before the event
          (business_temporal, priority 12) AND is under-covered (business_fiscal,
          priority 13) returns ERR_COI_EXPIRES_BEFORE_EVENT — the business_temporal
          vs business_fiscal pairing, a different pair than capacity/double-booking.
        test_recipe:
          setup:
            - "A MEDIUM app (required_coverage_min 1,200,000, occupy_end 2026-06-10T14:00Z); a SUBMITTED COI with coverage 500,000 AND expires_at 2026-06-01 (before event)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PermitOfficer
            - call: "POST /venues"
              payload: { name: "V7", venue_type: "PARK", max_capacity: 6000 }
