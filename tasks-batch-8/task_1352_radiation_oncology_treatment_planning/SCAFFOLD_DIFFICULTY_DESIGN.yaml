      - name: simulator_half_open_adjacency_no_buffer
        grounds:
          - calculations.simulator_slot_overlap
          - entities.SimulationAppointment.fields.machine_id
        distinguishing_aspect: |
          Pure half-open interval semantics on SimulationAppointment/CT_SIMULATOR (different resource
          and different geometry than the LINAC buffer rule): a booking starting exactly at the
          previous appointment's end is ALLOWED (09:30 after 09:00-09:30), while a booking straddling
          the interior (09:15-09:45) is rejected; there is no turnover buffer on simulators.
        test_recipe:
          setup:
            - "Course in SIMULATION_SCHEDULED after booking sim A 2026-08-03T09:00-09:30 on CT-Sim-OV2"
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-OV-2", full_name: "Overlap Two", date_of_birth: "1966-02-02" }, as: Scheduler, captures: { pat: $.data.id } }
