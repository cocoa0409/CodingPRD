              payload: { reinstatement_note: "Access road reopened" }
              as: ProgramManager
          assert:
            - "before the reinstatement: MonitoringSite.${site_a_id}.status == SUSPENDED and MonitoringSite.${site_a_id}.suspended_at == 2026-01-05T00:00:00Z"
            - "before the reinstatement: Monitor.${mon_id}.monitor_status == OUT_OF_SERVICE and Monitor.${mon_id}.out_of_service_since == 2026-01-05T00:00:00Z"
            - "before the reinstatement: MonitoringNetwork.${net_id}.total_site_count == 1, operating_site_count == 0, suspended_site_count == 1"
            - "before the reinstatement: 1 == 0 + 0 + 0 + 1 + 0 + 0 over (proposed, approved, operating, suspended, shutdown, relocated)"
            - "after the reinstatement: MonitoringSite.${site_a_id}.status == OPERATING and MonitoringSite.${site_a_id}.suspended_at == null"
            - "after the reinstatement: Monitor.${mon_id}.monitor_status == OPERATING and Monitor.${mon_id}.out_of_service_since == null"
            - "after the reinstatement: Monitor.${mon_id}.out_of_service_day_count == 10"
            - "after the reinstatement: Monitor.${mon_id}.qc_posture == QC_CURRENT and Monitor.${mon_id}.qc_posture_in_service == QC_CURRENT"
            - "after the reinstatement: MonitoringNetwork.${net_id}.total_site_count == 1, operating_site_count == 1, suspended_site_count == 0"
            - "after the reinstatement: 1 == 0 + 0 + 1 + 0 + 0 + 0 over (proposed, approved, operating, suspended, shutdown, relocated)"
            - "SiteChangeRequest.${scr_id}.status == APPROVED and SiteChangeRequest.${scr_id}.request_type == SEASONAL_SUSPENSION"
