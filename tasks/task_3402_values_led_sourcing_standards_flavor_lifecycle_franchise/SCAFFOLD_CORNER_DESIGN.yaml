          trigger:
            - call: "POST /creamery/campaigns/${camp_id}/board-decision"
              payload: { approve: true }
              as: IndependentBoardMember
              as_user_id: "board-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SOD_CAMPAIGN_PROPOSER (HTTP 403)"

      - name: cert_window_invalid_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_CERT_WINDOW_INVALID]"]
        distinguishing_aspect: "valid_until equal to issued_at is rejected (window must be non-empty); the check is independent of overlap."
        test_recipe:
          setup: ["Supplier PROSPECT"]
          setup_api_calls:
            - call: "POST /creamery/suppliers"
              payload: { name: "Bad Window Supplier", country_code: "US", ingredient_category: "DAIRY" }
              as: SourcingManager
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /creamery/suppliers/${s_id}/certifications"
              payload: { scheme: "ORGANIC", certificate_number: "OG-BW", ingredient_scope: "DAIRY", issued_at: "2026-01-01T00:00:00Z", valid_until: "2026-01-01T00:00:00Z", declared_coverage_pct: 90 }
              as: SourcingManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CERT_WINDOW_INVALID (HTTP 422)"

      - name: commitment_window_invalid_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_COMMITMENT_WINDOW_INVALID]"]
        distinguishing_aspect: "effective_to before effective_from is rejected with ERR_COMMITMENT_WINDOW_INVALID on an otherwise valid APPROVED supplier."
        test_recipe:
          setup: ["Supplier APPROVED via PASS audit"]
          setup_api_calls:
            - call: "POST /creamery/suppliers"
              payload: { name: "Bad Commitment Window", country_code: "US", ingredient_category: "SUGAR" }
              as: SourcingManager
              captures: { s_id: $.data.id }
            - call: "POST /creamery/suppliers/${s_id}/audits"
              payload: { scheduled_for: "2026-09-05T00:00:00Z" }
              as: SourcingManager
              captures: { a_id: $.data.id }
            - call: "POST /creamery/audits/${a_id}/start"
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a_id}/complete"
              payload: { labor_score: 80, environment_score: 70, community_score: 60, findings_count: 0 }
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a_id}/verify"
              as: AuditVerifier
              as_user_id: "ver-1"
            - call: "GET /creamery/suppliers/${s_id}"
              as: SourcingManager
              captures: { s_v: $.data.version }
          trigger:
            - call: "POST /creamery/suppliers/${s_id}/commitments"
              payload: { ingredient_category: "SUGAR", fair_trade_required: true, min_social_score: 60, premium_over_commodity_pct: 5, effective_from: "2027-01-01T00:00:00Z", effective_to: "2026-01-01T00:00:00Z", expected_supplier_version: "${s_v}" }
              as: SourcingManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_COMMITMENT_WINDOW_INVALID (HTTP 422)"

      - name: slot_date_in_past_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_SLOT_DATE_PAST]"]
        distinguishing_aspect: "At the default logical date 2026-09-01, a slot dated 2026-08-01 is rejected ERR_SLOT_DATE_PAST even when capacity is free."
        test_recipe:
          setup: ["Flavor TEST_BATCH"]
          setup_api_calls:
            - call: "POST /creamery/flavors"
              payload: { name: "Past Slot", base_type: "DAIRY", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 150 }
              as: FlavorManager
              captures: { f_id: $.data.id }
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "TEST_BATCH" }
              as: FlavorManager
          trigger:
            - call: "POST /creamery/production-slots"
              payload: { plant_code: "VT_WATERBURY", flavor_id: "${f_id}", production_date: "2026-08-01", shift: "DAY", planned_pints: 500 }
              as: PlantScheduler
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SLOT_DATE_PAST (HTTP 422)"

      - name: duplicate_signature_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_DUPLICATE_SIGNATURE]"]
        distinguishing_aspect: "One email signs a revival request once; the second signature from the same email fails ERR_DUPLICATE_SIGNATURE."
        test_recipe:
          setup: ["Retired flavor with OPEN revival request already signed by fan-a@x.com"]
          setup_api_calls:
            - call: "POST /creamery/flavors"
              payload: { name: "Dupes Delight", base_type: "DAIRY", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 150 }
              as: FlavorManager
              captures: { f_id: $.data.id }
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "TEST_BATCH" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "LIMITED_RUN" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/retire"
              as: ParentOpsController
            - call: "POST /creamery/flavors/${f_id}/revival-requests"
              payload: { fan_email: "start@x.com", title: "Revive" }
              as: Fan
              captures: { r_id: $.data.id }
            - call: "POST /creamery/revival-requests/${r_id}/sign"
              payload: { fan_email: "fan-a@x.com", count: 1 }
              as: Fan
          trigger:
            - call: "POST /creamery/revival-requests/${r_id}/sign"
              payload: { fan_email: "fan-a@x.com", count: 3 }
              as: Fan
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_SIGNATURE (HTTP 409); count and signature_count unchanged"

      - name: revival_adopt_from_open_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RevivalRequest.QUALIFIED_to_ADOPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "adopt requires QUALIFIED; an OPEN request (100 signatures) cannot be adopted no matter the board's enthusiasm."
        test_recipe:
          setup: ["Retired flavor with OPEN revival request at 100 signatures"]
          setup_api_calls:
            - call: "POST /creamery/flavors"
              payload: { name: "Almost Famous", base_type: "DAIRY", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 150 }
              as: FlavorManager
              captures: { f_id: $.data.id }
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "TEST_BATCH" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "LIMITED_RUN" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/retire"
              as: ParentOpsController
            - call: "POST /creamery/flavors/${f_id}/revival-requests"
              payload: { fan_email: "start@x.com", title: "Revive" }
              as: Fan
              captures: { r_id: $.data.id }
            - call: "POST /creamery/revival-requests/${r_id}/sign"
              payload: { fan_email: "hundred@x.com", count: 100 }
              as: Fan
          trigger:
            - call: "POST /creamery/revival-requests/${r_id}/adopt"
              as: IndependentBoardMember
              as_user_id: "board-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (HTTP 409); QUALIFIED is required"

  - section: endpoints
    instances:
      - name: clock_regression_rejected
        claim_type: conditional_action
        grounds: ["validations[priority=16]", "errors[ERR_CLOCK_REGRESSION]"]
        distinguishing_aspect: "The logical clock is monotone: after setting 2026-09-02, setting 2026-09-01 fails ERR_CLOCK_REGRESSION."
        test_recipe:
          setup: ["clock at default 2026-09-01T00:00:00Z, then advanced"]
          setup_api_calls:
            - call: "POST /creamery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: ParentOpsController
          trigger:
            - call: "POST /creamery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ParentOpsController
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CLOCK_REGRESSION (HTTP 422)"

      - name: clock_default_is_fixed_epoch
        claim_type: conditional_action
        grounds: ["endpoints: POST /creamery/_clock/set_current_utc", state_machines.Certification.PENDING_to_EXPIRED]
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-09-01T00:00:00Z: a cert valid_until 2026-08-01 reads EXPIRED without any clock call, proving no wall-clock fallback."
        test_recipe:
          setup: ["Supplier PROSPECT; cert window [2026-01-01, 2026-08-01) created with NO prior clock call"]
          setup_api_calls:
            - call: "POST /creamery/suppliers"
              payload: { name: "Epoch Supplier", country_code: "US", ingredient_category: "DAIRY" }
              as: SourcingManager
              captures: { s_id: $.data.id }
            - call: "POST /creamery/suppliers/${s_id}/certifications"
              payload: { scheme: "ORGANIC", certificate_number: "OG-E1", ingredient_scope: "DAIRY", issued_at: "2026-01-01T00:00:00Z", valid_until: "2026-08-01T00:00:00Z", declared_coverage_pct: 90 }
              as: SourcingManager
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /creamery/suppliers/${s_id}/certifications"
              as: SourcingManager
              captures: { st: "$.data[0].status" }
          assert:
            - "st == EXPIRED (default logical time 2026-09-01T00:00:00Z is past valid_until)"

      - name: commitment_list_pagination_envelope
        claim_type: listing_pagination
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "List responses carry limit/offset/total_count/has_more; with 2 commitments and limit 1, total_count == 2 and has_more == true."
        test_recipe:
          setup: ["Supplier APPROVED with two ACTIVE commitments in different categories (COCOA, SUGAR)"]
          setup_api_calls:
            - call: "POST /creamery/suppliers"
              payload: { name: "Page Supplier", country_code: "GH", ingredient_category: "COCOA" }
              as: SourcingManager
              captures: { s_id: $.data.id }
            - call: "POST /creamery/suppliers/${s_id}/audits"
              payload: { scheduled_for: "2026-09-05T00:00:00Z" }
              as: SourcingManager
              captures: { a_id: $.data.id }
            - call: "POST /creamery/audits/${a_id}/start"
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a_id}/complete"
              payload: { labor_score: 80, environment_score: 70, community_score: 60, findings_count: 0 }
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a_id}/verify"
              as: AuditVerifier
              as_user_id: "ver-1"
            - call: "GET /creamery/suppliers/${s_id}"
              as: SourcingManager
              captures: { s_v1: $.data.version }
            - call: "POST /creamery/suppliers/${s_id}/commitments"
              payload: { ingredient_category: "COCOA", fair_trade_required: true, min_social_score: 60, premium_over_commodity_pct: 5, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", expected_supplier_version: "${s_v1}" }
              as: SourcingManager
            - call: "GET /creamery/suppliers/${s_id}"
              as: SourcingManager
              captures: { s_v2: $.data.version }
            - call: "POST /creamery/suppliers/${s_id}/commitments"
              payload: { ingredient_category: "SUGAR", fair_trade_required: true, min_social_score: 60, premium_over_commodity_pct: 5, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", expected_supplier_version: "${s_v2}" }
              as: SourcingManager
          trigger:
            - call: "GET /creamery/suppliers/${s_id}/commitments?limit=1"
              as: SourcingManager
              captures: { page: $.data }
          assert:
            - "page contains exactly 1 element (limit honored)"
            - "envelope reports total_count == 2 and has_more == true"

      - name: enrollment_payments_reverse_reach_list
        claim_type: parent_relationships
        grounds: [entities.PremiumPayment.fields.enrollment_id, "endpoints: GET /creamery/enrollments/{id}/premium-payments"]
        distinguishing_aspect: "Children are reachable from the parent: the enrollment's payment list returns exactly the payments created under it."
        test_recipe:
          setup: ["Enrollment ASSESSED with one payment"]
          setup_api_calls:
            - call: "POST /creamery/enrollments"
              payload: { farm_name: "List Farm", region: "VT", herd_size: 60, season_year: 2026, baseline_volume_liters: 5000 }
              as: DairyProgramManager
              captures: { e_id: $.data.id }
            - call: "POST /creamery/enrollments/${e_id}/assess"
              payload: { env_practice_score: 80, welfare_practice_score: 70 }
              as: DairyProgramManager
            - call: "POST /creamery/enrollments/${e_id}/premium-payments"
              payload: { period: "Q1", declared_volume_liters: 5000, commodity_price_cents_per_liter: 40 }
              as: DairyProgramManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /creamery/enrollments/${e_id}/premium-payments"
              as: DairyProgramManager
              captures: { first_id: "$.data[0].id" }
          assert:
            - "first_id == ${p_id}"

      - name: campaign_none_impact_launches_without_notices
        claim_type: conditional_action
        grounds: [state_machines.Campaign.approval_status.OPS_SCHEDULED_to_LAUNCHED, entities.Campaign.fields.retail_notice_status]
        distinguishing_aspect: "Impact NONE initializes retail_notice_status NOT_REQUIRED, so launch succeeds without dispatch-retail-notices; the notice gate only bites when PENDING."
        test_recipe:
          setup: ["Campaign impact NONE approved and ops-scheduled; no dispatch call made"]
          setup_api_calls:
            - call: "POST /creamery/campaigns"
              payload: { title: "Silent Launch", issue_area: "CLIMATE", retail_partner_impact: "NONE" }
              as: IndependentBoardMember
              as_user_id: "board-1"
              captures: { camp_id: $.data.id }
            - call: "POST /creamery/campaigns/${camp_id}/board-decision"
              payload: { approve: true }
              as: IndependentBoardMember
              as_user_id: "board-2"
            - call: "POST /creamery/campaigns/${camp_id}/schedule-ops"
              as: ParentOpsController
          trigger:
            - call: "POST /creamery/campaigns/${camp_id}/launch"
              as: ParentOpsController
              captures: { st: $.data.approval_status }
          assert:
            - "st == LAUNCHED (NOT_REQUIRED notice dimension does not gate launch)"

