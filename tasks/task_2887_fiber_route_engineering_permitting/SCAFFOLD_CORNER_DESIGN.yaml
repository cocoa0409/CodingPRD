            - "the second trigger returns 2 rows with total_count 3, limit 2, offset 0 and has_more true"
            - "the third trigger returns 3 rows with total_count 3, because every segment is still NOT_REQUIRED"
            - "the filtered page never contains ${seg1_id}, whose engineering_status is WALKED"
