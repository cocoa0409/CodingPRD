              captures: { err_late: $.data.error_id }
          assert:
            - "${a_open} == \"2028-05-02\" and ${a_grace} == \"2028-09-29\""
            - "${err_early} == \"ERR_RENEWAL_WINDOW_NOT_OPEN\" with HTTP 422 — one day before the inclusive open date"
            - "${ok_start} == \"2028-08-01\" and ${ok_kind} == \"RENEWAL\" — the open date itself is inside the window"
            - "${err_late} == \"ERR_GRACE_PERIOD_EXPIRED\" with HTTP 422 — one day past the inclusive grace_end_date 2028-09-29"
            - "GET /cosmetics/facilities/${fac_b}/registration-periods still returns exactly one row with sequence_index == 1"
            - "Facility ${fac_a}.registration_cycle_count == 2 while Facility ${fac_b}.registration_cycle_count == 1"

      - name: abbreviated_renewal_is_barred_after_an_accepted_ownership_change
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=46]
          - errors[ERR_ABBREVIATED_RENEWAL_NOT_ELIGIBLE]
          - state_machines.OwnershipChangeUpdate.FILED_to_ACCEPTED
        distinguishing_aspect: |
          Eligibility for the abbreviated path is destroyed by a sibling entity: an ACCEPTED
          OwnershipChangeUpdate clears abbreviated_renewal_eligible on the Facility, so a renewal filed
          inside a perfectly open window is rejected with ERR_ABBREVIATED_RENEWAL_NOT_ELIGIBLE (422) while
          the STANDARD kind on the same facility at the same instant succeeds.
        test_recipe:
          setup:
            - "one REGISTERED facility whose ownership change has been filed and accepted, clock then moved into the renewal window"
          setup_api_calls:
            - call: "POST /cosmetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "OPS-1"
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { fac_v: $.data.version, elig_before: $.data.abbreviated_renewal_eligible }
            - call: "POST /cosmetics/facilities/${fac_id}/ownership-changes"
              payload: { new_owner_operator_name: "Brightline Beauty Holdings", change_effective_date: "2026-08-01", expected_facility_version: "${fac_v}" }
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
              captures: { oc_id: $.data.id }
            - call: "POST /cosmetics/ownership-changes/${oc_id}/decision"
              payload: { decision: "ACCEPT" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/_clock/set_current_utc"
              payload: { current_utc: "2028-06-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "OPS-1"
          trigger:
            - call: "POST /cosmetics/facilities/${fac_id}/renewals"
              payload: { renewal_kind: "ABBREVIATED" }
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
              captures: { err: $.data.error_id }
            - call: "POST /cosmetics/facilities/${fac_id}/renewals"
              payload: { renewal_kind: "STANDARD" }
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
              captures: { ok_start: $.data.period_start }
          assert:
            - "${elig_before} == true — a freshly approved facility starts eligible for the abbreviated path"
            - "${err} == \"ERR_ABBREVIATED_RENEWAL_NOT_ELIGIBLE\" with HTTP 422 — the ACCEPTED ownership change cleared the flag"
            - "${ok_start} == \"2028-08-01\" — the STANDARD kind is accepted in the same window, so the window itself was never the problem"
            - "Facility ${fac_id}.owner_operator_name == \"Brightline Beauty Holdings\" and abbreviated_renewal_eligible == false"
            - "GET /cosmetics/facilities/${fac_id}/registration-periods returns two rows; the sequence_index 2 row has period_kind \"RENEWAL\""

      - name: adverse_event_received_at_may_equal_now_but_never_exceed_it
