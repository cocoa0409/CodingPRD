            - *k_sch_s1_appraise
            - *k_sch_s1_decide
            - *k_tr_t1_create
            - *k_tr_t1_meta
            - *k_tr_t1_accession
            - *k_res_ada
            - *k_res_ada_act
            - call: "POST /records/foia-requests"
              payload: { researcher_id: "${res_ada}", collection_id: "${col_c1}", description_of_records: "twice probe" }
