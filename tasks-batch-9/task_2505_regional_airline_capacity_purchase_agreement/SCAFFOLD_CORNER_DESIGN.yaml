            - "FlightLeg.${l2}.status == \"SCHEDULED\" and cancel_cause_code == null"
            - "ScheduleCycle.${cyc}.cancelled_controllable_count == 1, metric_completed_departures == 0, departure_ledger_total == 1"
            - "GET /cpa/cancellation-claims?cycle_id=${cyc} returns total_count == 1"

      - name: flight_leg_with_in_training_captain_rejected
