  - method: GET
    path: "/fca/funding-scenarios/{id}"
    description: Get one funding scenario
    roles: [Consultant, FacilityManager, CapitalPlanner, Approver]
    code: 200
    input: []
    output: FundingScenario
    side_effects: []
  - method: POST
    path: "/fca/funding-scenarios/{id}/run"
