            - "The application still reads gross_assessed_cents 2541680, admin_charge_cents 76250, net_due_cents 2617930 and exactly one assessed line for PARKS."

      - name: higher_priority_error_wins_when_two_rules_are_violated
        claim_type: priority_ordering
        grounds:
          - validations[priority=30]
          - validations[priority=53]
        excluded_because:
          difficulty_instance: refund_obligation_outranks_insufficient_fund_balance
          rationale: "That instance violates both rules with one call and asserts the priority-30 error is returned, which is exactly the priority-ordering claim for this pair; two further pairs (41 vs 42 and 7 vs 12) are covered by their own difficulty instances."

      - name: individually_valid_credits_collectively_exceed_the_cap
        claim_type: aggregate_validation
        grounds:
          - validations[priority=12]
          - entities.FeeProgram.fields.credit_cap_bp
          - calculations.application_assessment
        excluded_because:
          difficulty_instance: credit_cap_bites_on_gross_fee_before_the_admin_charge
          rationale: "That instance is the aggregate claim: each claim is individually below the cap and separately approvable, while their sum breaches credit_cap_bp and is clipped at the aggregate level rather than per claim."

