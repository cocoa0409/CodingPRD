  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: second_reading_adoption_five_hop_recertification_cascade
        grounds:
          - state_machines.PolicyVersion.FIRST_READING_PASSED_to_ADOPTED
          - state_machines.PolicyVersion.ADOPTED_to_SUPERSEDED
          - state_machines.LegalMandate.IN_PROGRESS_to_SATISFIED
          - calculations.policy_compliance_state
          - calculations.manual_publication_snapshot
          - entities.ManualPublication.fields.certification_state
        distinguishing_aspect: |
          Depth-5 chain, each hop caused by the hop before it, all fired by ONE record-vote:
          (1) the agenda item is ACTED, which (2) adopts version 2 and supersedes version 1 and
          rewrites Policy.adopted_version_no, which (3) satisfies the REVISE_EXISTING legal mandate
          because the policy now has a newer adopted version, which (4) drops
          Policy.open_mandate_count to zero and flips compliance_state to COMPLIANT, which (5) drops
          the published manual edition's compliance_gap_count to zero and flips its
          certification_state from LAPSED to CERTIFIED. The trigger is the second-reading vote,
          distinct from the revoke trigger of the other cascade instance.
