            - { call: "POST /ehs/training-assignments/${tr}/complete", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "FK-1", chemical_name: "Ethanol", hazard_class: "FLAMMABLE", quantity_value: 1.0 }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { c1: $.data.id } }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "FK-2", chemical_name: "Methanol", hazard_class: "FLAMMABLE", quantity_value: 1.0 }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { c2: $.data.id } }
            - { call: "POST /ehs/accumulation-areas", payload: { lab_id: "${l}", name: "SAA-1", area_type: "SAA", capacity_containers: 10 }, as: EHSAdmin, captures: { area: $.data.id } }
            - { call: "POST /ehs/containers/${c1}/tag-waste", payload: { accumulation_area_id: "${area}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/containers/${c2}/tag-waste", payload: { accumulation_area_id: "${area}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests", payload: { lab_id: "${l}" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { p: $.data.id } }
            - { call: "POST /ehs/waste-pickup-requests/${p}/add-item", payload: { container_id: "${c1}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
          trigger:
            - { call: "GET /ehs/containers?pickup_request_id=${p}", as: EHSAdmin }
          assert:
            - "exactly 1 container returned and it is ${c1}"
      - name: add_item_to_submitted_pickup_rejected
        claim_type: invalid_transition
        grounds: [state_machines.WastePickupRequest, "errors[ERR_PICKUP_STATE]"]
        distinguishing_aspect: "Item edits are valid only in DRAFT/REJECTED: add-item against a SUBMITTED request -> ERR_PICKUP_STATE."
        test_recipe:
          setup: ["lab with trained PI; two tagged containers; pickup with first item SUBMITTED"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab AI", department: "Chemistry", building: "Hall A", room: "121" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "POST /ehs/training-assignments", payload: { lab_id: "${l}", worker_id: "${pi}", hazard_class: "FLAMMABLE", due_date: "2027-01-01T00:00:00Z" }, as: EHSAdmin, captures: { tr: $.data.id } }
            - { call: "POST /ehs/training-assignments/${tr}/complete", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "AI-1", chemical_name: "Ethanol", hazard_class: "FLAMMABLE", quantity_value: 1.0 }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { c1: $.data.id } }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "AI-2", chemical_name: "Methanol", hazard_class: "FLAMMABLE", quantity_value: 1.0 }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { c2: $.data.id } }
            - { call: "POST /ehs/accumulation-areas", payload: { lab_id: "${l}", name: "SAA-1", area_type: "SAA", capacity_containers: 10 }, as: EHSAdmin, captures: { area: $.data.id } }
            - { call: "POST /ehs/containers/${c1}/tag-waste", payload: { accumulation_area_id: "${area}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/containers/${c2}/tag-waste", payload: { accumulation_area_id: "${area}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests", payload: { lab_id: "${l}" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { p: $.data.id } }
            - { call: "POST /ehs/waste-pickup-requests/${p}/add-item", payload: { container_id: "${c1}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests/${p}/submit", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
          trigger:
            - { call: "POST /ehs/waste-pickup-requests/${p}/add-item", payload: { container_id: "${c2}" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_PICKUP_STATE (HTTP 409); estimated_quantity_total stays 1.0"]

  - section: errors
    instances:
      - name: request_missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call without X-User-Role/X-User-ID is rejected 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["one lab exists"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab AU", department: "Chemistry", building: "Hall A", room: "122" }, as: EHSAdmin, captures: { l: $.data.id } }
          trigger:
            - { call: "GET /ehs/labs/${l}", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_UNAUTHENTICATED (HTTP 401)"]
      - name: lab_member_cannot_create_area_forbidden
        claim_type: rbac_exclusive_denial
        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN_ROLE]", roles]
        distinguishing_aspect: "Exclusive operation: POST /ehs/accumulation-areas is EHSAdmin-only; a LabMember caller gets ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["lab with a RESEARCHER worker (LabMember identity)"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab RB", department: "Chemistry", building: "Hall A", room: "123" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Rita Res", role_in_lab: "RESEARCHER" }, as: EHSAdmin, captures: { m: $.data.id } }
          trigger:
            - { call: "POST /ehs/accumulation-areas", payload: { lab_id: "${l}", name: "SAA-X", area_type: "SAA", capacity_containers: 5 }, as: LabMember, as_user_id: "${m}", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_FORBIDDEN_ROLE (HTTP 403)"]
      - name: closeout_by_other_labs_pi_forbidden
        claim_type: rbac_ownership_denial
        grounds: ["validations[priority=4]", "errors[ERR_FORBIDDEN_OWNERSHIP]", roles]
        distinguishing_aspect: "Ownership scope: a PrincipalInvestigator whose X-User-ID is the PI of lab B cannot close out lab A -> ERR_FORBIDDEN_OWNERSHIP (403), while EHSAdmin can."
        test_recipe:
          setup: ["labs A and B each with their own PI worker"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab OA", department: "Chemistry", building: "Hall A", room: "124" }, as: EHSAdmin, captures: { la: $.data.id } }
            - { call: "POST /ehs/labs", payload: { name: "Lab OB", department: "Chemistry", building: "Hall A", room: "125" }, as: EHSAdmin, captures: { lb: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${la}", full_name: "Dr. Ay", role_in_lab: "PI" }, as: EHSAdmin, captures: { pia: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${lb}", full_name: "Dr. Bee", role_in_lab: "PI" }, as: EHSAdmin, captures: { pib: $.data.id } }
          trigger:
            - { call: "POST /ehs/labs/${la}/closeout", payload: {}, as: PrincipalInvestigator, as_user_id: "${pib}", captures: { err: $.data.error_id } }
            - { call: "POST /ehs/labs/${la}/closeout", payload: {}, as: PrincipalInvestigator, as_user_id: "${pia}" }
          assert:
            - "foreign PI: error_id == ERR_FORBIDDEN_OWNERSHIP (HTTP 403)"
            - "owning PI succeeds: Lab.${la}.status == CLOSING"
      - name: worker_cannot_complete_others_training_forbidden
        claim_type: rbac_ownership_denial
        grounds: ["validations[priority=4]", "errors[ERR_FORBIDDEN_OWNERSHIP]", state_machines.TrainingAssignment.ASSIGNED_to_COMPLETED]
        distinguishing_aspect: "A LabMember completing a training assignment owned by a different worker is ERR_FORBIDDEN_OWNERSHIP; the assigned worker succeeds."
        test_recipe:
          setup: ["lab with workers w1 (owner of assignment) and w2"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab OW", department: "Biology", building: "Hall B", room: "212" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Rita Res", role_in_lab: "RESEARCHER" }, as: EHSAdmin, captures: { w2: $.data.id } }
            - { call: "POST /ehs/training-assignments", payload: { lab_id: "${l}", worker_id: "${pi}", hazard_class: "TOXIC", due_date: "2027-01-01T00:00:00Z" }, as: EHSAdmin, captures: { ta: $.data.id } }
          trigger:
            - { call: "POST /ehs/training-assignments/${ta}/complete", payload: {}, as: LabMember, as_user_id: "${w2}", captures: { err: $.data.error_id } }
            - { call: "POST /ehs/training-assignments/${ta}/complete", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
          assert:
            - "other worker: error_id == ERR_FORBIDDEN_OWNERSHIP (HTTP 403)"
            - "owning worker succeeds: TrainingAssignment.${ta}.status == COMPLETED"

  - section: complexity_layers
    instances:
      - name: registration_create_stale_lab_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[registration-create-stale-lab]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC: after a PI-worker creation bumped Lab.version from 1 to 2, a registration create carrying expected_lab_version == 1 (stale) is rejected 412 ERR_STALE_VERSION; retrying with the fresh version 2 succeeds and bumps Lab.version to 3."
        test_recipe:
          setup: ["lab created (version 1); PI worker created (version now 2); client holds the stale version 1 observed before the worker creation"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab OC", department: "Pharmacy", building: "Hall D", room: "405" }, as: EHSAdmin, captures: { l: $.data.id, lv_stale: $.data.version } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
          trigger:
            - { call: "POST /ehs/registrations", payload: { lab_id: "${l}", material_type: "CONTROLLED_SUBSTANCE", registration_number: "REG-S", expected_lab_version: "${lv_stale}" }, as: EHSAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /ehs/labs/${l}", as: EHSAdmin, captures: { lv_fresh: $.data.version } }
            - { call: "POST /ehs/registrations", payload: { lab_id: "${l}", material_type: "CONTROLLED_SUBSTANCE", registration_number: "REG-S", expected_lab_version: "${lv_fresh}" }, as: EHSAdmin, captures: { reg: $.data.id } }
          assert:
            - "stale create: error_id == ERR_STALE_VERSION (HTTP 412)"
            - "fresh create succeeds: Registration.${reg}.status == PENDING"
            - "Lab.${l}.version == 3 after the successful create (1 create + 1 worker side effect + 1 registration side effect)"
      - name: registration_create_supersedes_pending_same_type
        claim_type: side_effect_execution
        grounds: [state_machines.Registration.PENDING_to_SUPERSEDED, endpoints]
        distinguishing_aspect: "Create-with-supersede: a new PENDING registration of the same (lab_id, material_type) flips the prior PENDING one to SUPERSEDED; a different material_type leaves it alone."
        test_recipe:
          setup: ["lab with PENDING registration REG-1 for CONTROLLED_SUBSTANCE"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab SP", department: "Pharmacy", building: "Hall D", room: "406" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "GET /ehs/labs/${l}", as: EHSAdmin, captures: { lv1: $.data.version } }
            - { call: "POST /ehs/registrations", payload: { lab_id: "${l}", material_type: "CONTROLLED_SUBSTANCE", registration_number: "REG-1", expected_lab_version: "${lv1}" }, as: EHSAdmin, captures: { r1: $.data.id } }
            - { call: "GET /ehs/labs/${l}", as: EHSAdmin, captures: { lv2: $.data.version } }
          trigger:
            - { call: "POST /ehs/registrations", payload: { lab_id: "${l}", material_type: "CONTROLLED_SUBSTANCE", registration_number: "REG-2", expected_lab_version: "${lv2}" }, as: EHSAdmin, captures: { r2: $.data.id } }
            - { call: "GET /ehs/labs/${l}/registrations", as: EHSAdmin }
          assert:
            - "Registration.${r1}.status == SUPERSEDED"
            - "Registration.${r2}.status == PENDING"
      - name: open_high_incident_restricts_then_close_restores
        claim_type: derived_field_reconciliation
        grounds: [calculations.lab_posture_derivation, state_machines.Incident.REPORTED_to_CLOSED]
        distinguishing_aspect: "Derived field reconciliation: reporting one HIGH incident degrades posture to RESTRICTED; closing it recomputes posture back to NORMAL in the same request's read."
        test_recipe:
          setup: ["lab with PI, posture NORMAL"]
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab DF", department: "Chemistry", building: "Hall A", room: "126" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
          trigger:
            - { call: "POST /ehs/incidents", payload: { lab_id: "${l}", title: "Acid splash", description: "minor splash, no injury", severity: "HIGH", near_miss: true }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { inc: $.data.id } }
            - { call: "GET /ehs/labs/${l}", as: EHSAdmin, captures: { post_mid: $.data.posture } }
            - { call: "POST /ehs/incidents/${inc}/close", payload: { resolution: "reviewed, PPE retrained" }, as: EHSAdmin }
            - { call: "GET /ehs/labs/${l}", as: EHSAdmin }
          assert:
            - "after report: posture == RESTRICTED (one open HIGH incident)"
            - "after close: posture == NORMAL (immediate consistency)"
            - "Incident.${inc}.near_miss == true"
