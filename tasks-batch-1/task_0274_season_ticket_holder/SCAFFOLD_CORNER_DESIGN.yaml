            - call: "POST /season-plans"
              payload: { name: "Full Own", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Owner A", email: "ownera@x.com" }
              as: BoxOfficeAgent
              captures: { accA_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Other B", email: "otherb@x.com" }
              as: BoxOfficeAgent
              captures: { accB_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${accA_id}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub_id: $.data.id }
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub_id}", seat_id: "${seat_id}" }
              as: BoxOfficeAgent
              captures: { sa_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: BoxOfficeAgent
          trigger:
            - call: "POST /ticket-transfers"
              payload: { seat_assignment_id: "${sa_id}", transfer_type: "RESALE", listing_price_cents: 20000 }
              as: AccountHolder
              as_user_id: "${accB_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "error_id == ERR_NOT_RESOURCE_OWNER"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: unauthenticated
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no/unknown X-User-Role -> 401 ERR_UNAUTHENTICATED before any business logic."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /sections"
              payload: { name: "NoAuth", tier: "STANDARD", base_price_cents: 200000 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response status == 401"
            - "error_id == ERR_UNAUTHENTICATED"

  # =========================================================================
  # Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: relocate_begin_correct_version_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.relocate-begin-stale-subscription, entities.Subscription.fields.version]
        distinguishing_aspect: "relocate with expected_subscription_version equal to the current version succeeds, moves status to RELOCATING, and increments Subscription.version by 1 (OCC happy path)."
        test_recipe:
          setup: ["ACTIVE subscription with one ASSIGNED seat; client has read its current version"]
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Lower 490", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "A", seat_number: 1, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat_id: $.data.id }
            - call: "POST /season-plans"
              payload: { name: "Full OCC", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "OCC Holder", email: "occ@x.com" }
              as: BoxOfficeAgent
              captures: { acc_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acc_id}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub_id: $.data.id }
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub_id}", seat_id: "${seat_id}" }
              as: BoxOfficeAgent
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: BoxOfficeAgent
              captures: { v_active: $.data.version }
          trigger:
            - call: "POST /subscriptions/${sub_id}/relocate"
              payload: { expected_subscription_version: "${v_active}" }
              as: BoxOfficeAgent
              captures: { v_after: $.data.version }
          assert:
            - "Subscription.${sub_id}.status == RELOCATING"
            - "Subscription.${sub_id}.version == ${v_active} + 1"

      - name: renewal_accept_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.renewal-accept-stale-subscription, "errors[ERR_STALE_SUBSCRIPTION_VERSION]"]
        distinguishing_aspect: "Accepting a renewal with a stale expected_subscription_version (one less than current, after the offer bumped it) -> 412 ERR_STALE_SUBSCRIPTION_VERSION."
        test_recipe:
          setup: ["a RENEWAL_OFFERED subscription; the offer transition has already incremented the version since the holder last observed it"]
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Lower 500", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "A", seat_number: 1, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat_id: $.data.id }
            - call: "POST /season-plans"
              payload: { name: "Full Renew", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Renew Holder", email: "renew@x.com" }
              as: BoxOfficeAgent
              captures: { acc_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acc_id}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub_id: $.data.id }
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub_id}", seat_id: "${seat_id}" }
              as: BoxOfficeAgent
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: BoxOfficeAgent
              captures: { v_active: $.data.version }
            - call: "POST /subscriptions/${sub_id}/renewal/offer"
              payload: {}
              as: BoxOfficeAgent
          trigger:
            - call: "POST /subscriptions/${sub_id}/renewal/accept"
              payload: { expected_subscription_version: "${v_active}" }
              as: AccountHolder
              as_user_id: "${acc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "error_id == ERR_STALE_SUBSCRIPTION_VERSION"

      - name: cancel_releases_parking_addon_derived_count_reconciled
        claim_type: derived_field_reconciliation
        grounds: [state_machines.Subscription.ACTIVE_to_CANCELLED, entities.ParkingZone.fields.active_pass_count, entities.ParkingAddOn.fields.status]
        distinguishing_aspect: "Cancelling a subscription with an ACTIVE parking add-on releases it (status->RELEASED) and decrements ParkingZone.active_pass_count from 1 back to 0 (cascade + derived reconciliation)."
        test_recipe:
          setup: ["ACTIVE subscription with one ASSIGNED seat and one ACTIVE parking add-on in a zone (active_pass_count=1)"]
          setup_api_calls:
            - call: "POST /parking-zones"
              payload: { name: "Lot Cancel", capacity: 10, price_cents: 30000 }
              as: BoxOfficeAgent
              captures: { zone_id: $.data.id }
            - call: "POST /sections"
              payload: { name: "Lower 510", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "A", seat_number: 1, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat_id: $.data.id }
            - call: "POST /season-plans"
              payload: { name: "Full PkCancel", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "PkCancel Holder", email: "pkc@x.com" }
              as: BoxOfficeAgent
              captures: { acc_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acc_id}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub_id: $.data.id }
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub_id}", seat_id: "${seat_id}" }
              as: BoxOfficeAgent
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: BoxOfficeAgent
            - call: "POST /parking-addons"
              payload: { subscription_id: "${sub_id}", parking_zone_id: "${zone_id}" }
              as: BoxOfficeAgent
              captures: { addon_id: $.data.id }
          trigger:
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: BoxOfficeAgent
          assert:
            - "ParkingAddOn.${addon_id}.status == RELEASED"
            - "ParkingZone.${zone_id}.active_pass_count == 0"

  # =========================================================================
  # Consistency Model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: activation_side_effects_visible_in_same_response
        claim_type: immediate
        grounds: [state_machines.Subscription.PENDING_to_ACTIVE, entities.Subscription.fields.locked_price_cents]
        distinguishing_aspect: "The activate response itself already reflects locked_price_cents and seat_count (immediate consistency: pricing and counters are atomic within the activate request)."
        test_recipe:
          setup: ["PENDING FULL subscription (base 200000, BRONZE) with one ASSIGNED seat"]
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Lower 520", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "A", seat_number: 1, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat_id: $.data.id }
            - call: "POST /season-plans"
              payload: { name: "Full Imm", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Imm Holder", email: "imm@x.com" }
              as: BoxOfficeAgent
              captures: { acc_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acc_id}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub_id: $.data.id }
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub_id}", seat_id: "${seat_id}" }
              as: BoxOfficeAgent
          trigger:
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: BoxOfficeAgent
          assert:
            - "Subscription.${sub_id}.status == ACTIVE"
            - "Subscription.${sub_id}.locked_price_cents == 200000"
            - "Subscription.${sub_id}.seat_count == 1"
