  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: invoice_then_late_deliver_outstanding_equals_fee_total
        grounds:
          - state_machines.InspectionOrder.UNPAID_to_INVOICED
          - state_machines.InspectionOrder.REPORTED_to_DELIVERED
          - entities.Account.fields.outstanding_balance_cents
          - entities.InspectionOrder.fields.fee_total_cents
          - entities.InspectionOrder.fields.estimated_fee_cents
        distinguishing_aspect: |
          Conserved quantity = Account.outstanding_balance_cents. Invoicing adds estimated_fee (41300) to the
          balance; delivering LATE finalizes fee_total to 35000 and the deliver side-effect applies the delta
          (-6300). After both, the named invariant holds: outstanding_balance_cents == fee_total_cents == 35000
          (sum over the single INVOICED order), with no drift from the estimated figure.
        test_recipe:
          setup:
            - "DEALER account (net_terms 30, rush_discount 0.10); EXPRESS order; dispatched, reported, INVOICED; clock advanced past deadline; delivered LATE."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { tier_code: "PREMIUM", base_fee_cents: 25000, vin_history_fee_cents: 4000, per_mile_dispatch_cents: 150 }
              as: OpsAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_type: "DEALER", legal_name: "Acme Motors", email: "ops4@acme.test", net_terms_days: 30, rush_discount_pct: 0.10 }
              as: OpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "1HGCM82633A004352", year: 2019, make: "Honda", model: "Accord" }
              as: OpsAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Pat Inspector", base_lat: 34.0, base_lng: -118.0, certified_tiers: ["PREMIUM"], max_daily_jobs: 3 }
              as: OpsAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /inspection-orders"
              payload: { account_id: "${acct_id}", vehicle_id: "${veh_id}", fee_schedule_id: "${fs_id}", location_lat: 34.05, location_lng: -118.25, include_vin_history: true, rush_tier: "EXPRESS" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id, ord_v1: $.data.version }
            - call: "POST /dispatch-assignments"
              payload: { order_id: "${ord_id}", inspector_id: "${insp_id}", window_start: "2026-06-02T09:00:00Z", window_end: "2026-06-02T11:00:00Z", dispatch_miles: 40, expected_order_version: "${ord_v1}" }
              as: OpsAdmin
              captures: { asg_id: $.data.id }
            - call: "POST /dispatch-assignments/${asg_id}/accept"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-reports"
              payload: { order_id: "${ord_id}", assignment_id: "${asg_id}", odometer_reading: 60000, points_total: 120, points_failed: 2, road_test_done: true }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /inspection-reports/${rep_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /vin-reports"
              payload: { order_id: "${ord_id}" }
              as: OpsAdmin
            - call: "POST /inspection-orders/${ord_id}/invoice"
              payload: {}
              as: OpsAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /inspection-orders/${ord_id}/deliver"
              payload: {}
              as: OpsAdmin
          assert:
            - "InspectionOrder.${ord_id}.fee_total_cents == 35000"
            - "InspectionOrder.${ord_id}.estimated_fee_cents == 41300"
            - "Account.${acct_id}.outstanding_balance_cents == 35000"

      - name: accept_then_release_conserves_inspector_slot_count
        grounds:
          - state_machines.DispatchAssignment.OFFERED_to_ACCEPTED
          - state_machines.DispatchAssignment.ACCEPTED_to_RELEASED
          - validations[priority=13]
          - entities.Inspector.fields.max_daily_jobs
        distinguishing_aspect: |
          Conserved quantity = the inspector's count of ACCEPTED assignments whose window_start is on a given
          UTC date (the value the daily-cap rule reads). Accepting an assignment increments it by 1; releasing
          it decrements by 1, so after accept+release a fresh accept at the SAME single-slot inspector
          (max_daily_jobs=1) succeeds — proving the slot count returned to its pre-accept value with no drift.
        test_recipe:
          setup:
            - "Inspector with max_daily_jobs=1. Order A accepted then released (slot freed). Order B has an OFFERED assignment same date for the same inspector."
          setup_api_calls:
            - call: "POST /fee-schedules"
