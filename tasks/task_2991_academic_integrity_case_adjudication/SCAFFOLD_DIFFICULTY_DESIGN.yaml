  # =========================================================================
  # RULE 9 - compensating_invariant
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: room_minutes_ledger_is_released_exactly_on_cancel_but_never_on_adjourn
        grounds:
          - invariants.inv-room-minutes-conserved
          - endpoints[POST /integrity/hearing-sessions]
          - endpoints[POST /integrity/hearing-sessions/{id}/cancel]
          - endpoints[POST /integrity/hearing-sessions/{id}/adjourn]
          - state_machines.HearingSession.SCHEDULED_to_CANCELLED
          - state_machines.HearingSession.CONVENED_to_ADJOURNED
        distinguishing_aspect: |
          Two transitions leave the same room reservation behind, and only ONE of them is a compensation.
          Cancelling a SCHEDULED session must release exactly the duration + 2 * buffer_minutes it reserved,
          returning booked_minutes_total to the value it held before scheduling and freeing the geometric
          slot for a re-booking of the identical interval. Adjourning a CONVENED session must release
          NOTHING, because the room was genuinely occupied - yet it too returns the case to FORMAL_REFERRED
          and permits a further booking, so an implementation that treats "the session is over" as the
          release condition will drift. The final cancel then has to land on 150 and not on 0, which is only
          possible if the two paths were accounted for differently all along.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z"
            - "ROOM-A with buffer_minutes 30 and sessions_per_day_cap 2, booked_minutes_total 0"
            - "one FORMAL case on ENGL-201, NOTIFIED on 2026-08-01T00:00:00Z with the ALLEGATION_NOTICE acknowledged"
            - "a trained chair and three panelists, none of them the reporter"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/departments"
              payload: { code: "ENGL", name: "English", enrolled_student_count: 2000, faculty_headcount: 5 }
              as: IntegrityOfficer
              captures: { dept_engl_id: $.data.id }
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Rita Reporter", email: "rita@u.edu" }
              as: IntegrityOfficer
              captures: { reporter_id: $.data.id }
            - call: "POST /integrity/faculty-members/${reporter_id}/training-completions"
              payload: { module_code: "AI-101", completed_at: "2026-01-15T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Cora Chair", email: "cora@u.edu" }
              as: IntegrityOfficer
              captures: { chair_id: $.data.id }
            - call: "POST /integrity/faculty-members/${chair_id}/training-completions"
              payload: { module_code: "AI-101", completed_at: "2026-02-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/faculty-members"
