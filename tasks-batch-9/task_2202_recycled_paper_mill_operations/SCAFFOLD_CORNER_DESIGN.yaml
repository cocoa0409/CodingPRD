        distinguishing_aspect: "The strongest form of `immediate`: a multi-entity compensating cascade must be wholly observable in the reads that follow the aborting call, with no intermediate window in which the batch reservation is released but the order is still SCHEDULED or the scrapped roll has no ledger row. The abort's own response body must also already show run_status ABORTED with quality_status CONDEMNED, and the solids ledger must reconcile to imbalance 0.000 at that instant."
