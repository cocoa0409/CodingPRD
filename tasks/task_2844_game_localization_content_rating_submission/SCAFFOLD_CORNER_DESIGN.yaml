      - name: mandatory_disclosure_gap_is_the_winning_error_on_a_german_submission
        claim_type: error_triggerable
        grounds:
          - errors[ERR_MANDATORY_DISCLOSURE_MISSING]
          - validations[priority 51]
          - calculations.submission_fee_cents
        distinguishing_aspect: "MANDATORY_DISCLOSURES is keyed on market_code, not on the board or the rating: a DE package must declare GAMBLING_SIM even when nothing in the questionnaire hints at it. There is no PATCH on a submission, so the fix is a new round - which supersedes the DRAFT and adds ROUND_SURCHARGE_CENTS to the fee."
