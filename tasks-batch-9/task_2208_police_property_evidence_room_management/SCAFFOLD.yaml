# =============================================================================
# PRD Benchmark Scaffold — Task 2208
# Police Property and Evidence Room Management
# Difficulty target: above the §0.4 Expert band (13 entities / 60 endpoints /
# 10 state machines / 14 calculations / 46 errors), density-first.
# =============================================================================

scenario: |
  2208. Police Property and Evidence Room Management (police evidence unit): intake with chain of custody
  documentation, packaging standards and barcode assignment, storage assignment by category including
  refrigerated, high-value and oversized items, chain of custody transfers for laboratory analysis, court
  presentation and investigative review with signature capture, retention determination by case status,
  offense type and statutory preservation requirements, disposition workflows for return to owner, auction,
  destruction or conversion with court authorization, periodic audits and inventory reconciliation with
  discrepancy investigation, found property and unclaimed item processing with owner notification

domain_name: police-evidence-room

# Flat peer-entity topology: every entity is addressed at the API root
# (`/evidence-items/{itemId}`, `/custody-transfers/{transferId}`, …) and parents
# are referenced by FK fields in the request body, never by URL nesting.
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat

  # Headline shape is `parallel`: EvidenceItem carries two independent state
  # dimensions (custody_state × disposition_state). Case adds a cycle
  # (ADJUDICATED → APPEAL_PENDING → ADJUDICATED) and PropertyRoom.posture is a
  # posture_driven derived gate over every child operation.
  state_machine_shape: parallel

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential_none

  role_model: segregation_of_duties

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: PropertyRoom
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human-readable name of the property and evidence unit"
        constraints: "1-120 characters"
      - name: agency_code
        type: string
        source: input
        description: "Agency identifier used as the barcode prefix"
        constraints: "3-5 characters, uppercase A-Z or 0-9; unique across PropertyRoom"
      - name: posture
        type: enum
        source: computed
        description: "Derived operating posture gating child operations; recomputed by calculations.room_posture"
        default: "OPEN"
        constraints: "OPEN | RESTRICTED | LOCKED_DOWN"
      - name: open_discrepancy_count
        type: integer
        source: computed
        description: "Count of Discrepancy rows with status in {OPEN, UNDER_INVESTIGATION} whose EvidenceItem belongs to a Case of this room"
        default: 0
      - name: missing_high_risk_count
        type: integer
        source: computed
        description: "Subset of open_discrepancy_count with kind == MISSING and EvidenceItem.category in {FIREARM, CURRENCY, NARCOTICS}"
        default: 0
      - name: sealed_location_count
        type: integer
        source: computed
        description: "Count of StorageLocation rows of this room with status == SEALED_FOR_AUDIT"
        default: 0
      - name: disposal_eligible_count
        type: integer
        source: computed
        description: "Count of EvidenceItem rows in this room with disposition_state in {DISPOSAL_ELIGIBLE, UNCLAIMED_ELIGIBLE}"
        default: 0
      - name: escrow_balance_cents
        type: integer
        source: computed
        description: "Auction proceeds currently held; conserved quantity of calculations.room_escrow_balance"
        default: 0
      - name: last_sweep_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent POST /property-rooms/{roomId}/daily-sweep; null before the first sweep"
        default: null

  - name: OffenseStatute
    parent: null
    common_fields: true
    fields:
      - name: offense_code
        type: string
        source: input
        description: "Statute/offense code"
        constraints: "1-16 characters; unique across OffenseStatute"
      - name: description
        type: string
        source: input
        description: "Offense description"
      - name: preservation_class
        type: enum
        source: input
        description: "Statutory preservation class governing retention and destruction"
        constraints: "STANDARD | DRUG_SCHEDULE | BIOLOGICAL_INDEFINITE | HOMICIDE_PERMANENT"
      - name: statutory_retention_days
        type: integer
        source: input
        description: "Base statutory retention period in whole days"
        constraints: ">= 0 and <= 36500"
      - name: appeal_window_days
        type: integer
        source: input
        description: "Post-adjudication appeal window in whole days, added by the FINAL retention variant"
        constraints: ">= 0 and <= 3650"
      - name: destruction_requires_court_order
        type: boolean
        source: input
        description: "When true, a DESTRUCTION DispositionOrder can never be auto-authorized"

  - name: StorageLocation
    parent: null
    common_fields: true
    fields:
      - name: property_room_id
        type: string
        source: input
        description: "FK -> PropertyRoom.id; the room that owns this storage location"
      - name: code
        type: string
        source: input
        description: "Bin/shelf code"
        constraints: "1-16 characters; unique per property_room_id"
      - name: category
        type: enum
        source: input
        description: "Storage category this location provides"
        constraints: "GENERAL | REFRIGERATED | HIGH_VALUE_VAULT | OVERSIZED_YARD"
      - name: capacity_slots
        type: integer
        source: input
        description: "Total slots available in this location"
        constraints: ">= 1 and <= 1000"
      - name: occupied_slots
        type: integer
        source: computed
        description: "Derived occupancy; conserved quantity of calculations.location_occupied_slots"
        default: 0
      - name: temperature_c
        type: number
        source: input
        description: "Last recorded storage temperature in Celsius; required when category == REFRIGERATED, otherwise must be null. The recorded reading is accepted as-is (a chiller may be running warm); compliance with the 4.0 C ceiling is enforced at assignment time by validations priority 17, not at creation"
        default: null
        constraints: "when category == REFRIGERATED: >= -30.0 and <= 30.0; a value above 4.0 is accepted here but makes the bin ineligible for assignment (ERR_REFRIGERATION_OUT_OF_RANGE) and excludes it from calculations.storage_location_autoselect"
      - name: requires_dual_signature
        type: boolean
        source: input
        description: "When true, releasing an item from this location requires a witness signature in addition to the releasing signature"
        default: false
      - name: status
        type: enum
        source: system
        description: "Location availability; sealed while an AuditSession holds it"
        default: "OPEN"
        constraints: "OPEN | SEALED_FOR_AUDIT"
      - name: sealed_by_audit_session_id
        type: string
        source: system
        description: "FK -> AuditSession.id; the session currently holding the seal, null when status == OPEN"
        default: null

  - name: Custodian
    parent: null
    common_fields: true
    fields:
      - name: property_room_id
        type: string
        source: input
        description: "FK -> PropertyRoom.id; the room this custodian is assigned to"
      - name: badge_number
        type: string
        source: input
        description: "Badge identifier"
        constraints: "1-16 characters; unique per property_room_id"
      - name: full_name
        type: string
        source: input
        description: "Custodian full name printed on chain of custody documents"
      - name: role_type
        type: enum
        source: input
        description: "Functional role; must match the acting X-User-Role per validations[priority=4]"
        constraints: "EVIDENCE_TECH | INVESTIGATOR | LAB_ANALYST | AUDITOR"
      - name: certification_expires_at
        type: datetime
        source: input
        description: "Evidence-handling certification expiry; custody and disposition actions require this to be strictly after the logical clock"
      - name: status
        type: enum
        source: system
        description: "Employment/eligibility status"
        default: "ACTIVE"
        constraints: "ACTIVE | SUSPENDED"
      - name: suspension_reason
        type: string
        source: system
        description: "Reason recorded by POST /custodians/{custodianId}/suspend; null while ACTIVE"
        default: null
      - name: open_escort_count
        type: integer
        source: computed
        description: "Count of CustodyTransfer rows with to_custodian_id == this id and status in {REQUESTED, RELEASED, OVERDUE}"
        default: 0

  - name: Case
    parent: null
    common_fields: true
    fields:
      - name: property_room_id
        type: string
        source: input
        description: "FK -> PropertyRoom.id; the room holding this case's evidence"
      - name: offense_statute_id
        type: string
        source: input
        description: "FK -> OffenseStatute.id; the offense that drives retention and destruction rules"
      - name: case_number
        type: string
        source: input
        description: "Agency case number, embedded in every item barcode"
        constraints: "matches ^[0-9]{2}-[0-9]{5}$; unique per property_room_id"
      - name: status
        type: enum
        source: system
        description: "Case lifecycle status; drives the FINAL retention variant"
        default: "OPEN"
        constraints: "OPEN | CHARGED | ADJUDICATED | APPEAL_PENDING | CLOSED"
      - name: charged_at
        type: datetime
        source: system
        description: "Logical-clock instant of POST /cases/{caseId}/charge"
        default: null
      - name: adjudicated_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent adjudication (charge->ADJUDICATED or resolve-appeal); anchor of the FINAL retention variant"
        default: null
      - name: appeal_opened_at
        type: datetime
        source: system
        description: "Logical-clock instant of POST /cases/{caseId}/appeal"
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant of POST /cases/{caseId}/close"
        default: null
      - name: item_count
        type: integer
        source: computed
        description: "Count of EvidenceItem rows with case_id == this id"
        default: 0
      - name: undisposed_item_count
        type: integer
        source: computed
        description: "Count of EvidenceItem rows of this case with disposition_state != DISPOSED"
        default: 0

  - name: EvidenceItem
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case this item was seized under"
      - name: item_description
        type: string
        source: input
        description: "Description of the item as logged at intake"
      - name: category
        type: enum
        source: input
        description: "Evidence category; drives required_storage_category and packaging standards"
        constraints: "GENERAL | BIOLOGICAL | CURRENCY | FIREARM | NARCOTICS | OVERSIZED"
      - name: packaging_type
        type: enum
        source: input
        description: "Packaging applied at intake; must be permitted for category per validations[priority=16]"
        constraints: "SEALED_ENVELOPE | PAPER_BAG | RIGID_BOX | SHARPS_TUBE | PALLET_WRAP | CHAIN_TAG_ONLY"
      - name: appraised_value_cents
        type: integer
        source: input
        description: "Appraised value in cents; feeds required_storage_category, auction estimates and audit risk weighting"
        constraints: ">= 0 and <= 100000000"
      - name: is_found_property
        type: boolean
        source: input
        description: "True for found/unclaimed property intake; widens the owner-notice window and exempts UNCLAIMED_ELIGIBLE items from the case-disposability gate"
        default: false
      - name: seized_at
        type: datetime
        source: input
        description: "Instant the item was seized or found in the field"
      - name: item_sequence
        type: integer
        source: system
        description: "1-based sequence within the case, assigned at intake and never reused"
      - name: barcode
        type: string
        source: computed
        description: "Assigned by calculations.barcode_assignment; unique across EvidenceItem"
      - name: intake_at
        type: datetime
        source: system
        description: "Logical-clock instant of POST /evidence-items; anchor of the PRELIMINARY retention variant and of storage-cost recovery"
      - name: required_storage_category
        type: enum
        source: computed
        description: "Storage category this item must occupy, per calculations.required_storage_category"
        constraints: "GENERAL | REFRIGERATED | HIGH_VALUE_VAULT | OVERSIZED_YARD"
      - name: storage_location_id
        type: string
        source: system
        description: "FK -> StorageLocation.id; assigned bin, null until storage assignment; retained after PURGED for audit history"
        default: null
      - name: custody_state
        type: enum
        source: system
        description: "Physical-custody dimension; evolves independently of disposition_state"
        default: "LOGGED"
        constraints: "LOGGED | STORED | CHECKED_OUT | MISSING | PURGED"
      - name: disposition_state
        type: enum
        source: system
        description: "Retention/disposition dimension; evolves independently of custody_state"
        default: "RETAINED"
        constraints: "RETAINED | COURT_HOLD | DISPOSAL_ELIGIBLE | UNCLAIMED_ELIGIBLE | ORDER_PENDING | DISPOSED"
      - name: current_holder_id
        type: string
        source: system
        description: "FK -> Custodian.id; custodian physically holding the item while custody_state == CHECKED_OUT, else null"
        default: null
      - name: retention_release_at
        type: datetime
        source: computed
        description: "Earliest instant the item may leave the room, per calculations.retention_release_at; null means never (indefinite preservation or court hold)"
        default: null
      - name: retention_basis
        type: enum
        source: computed
        description: "Basis actually applied by the most recent RetentionDetermination"
        default: "PRELIMINARY"
        constraints: "PRELIMINARY | FINAL | INDEFINITE | COURT_HOLD"
      - name: open_transfer_count
        type: integer
        source: computed
        description: "Count of CustodyTransfer rows for this item with status in {REQUESTED, RELEASED, OVERDUE}"
        default: 0

  - name: RetentionDetermination
    parent: null
    common_fields: true
    fields:
      - name: evidence_item_id
        type: string
        source: input
        description: "FK -> EvidenceItem.id; the item whose retention this determination fixes"
      - name: basis
        type: enum
        source: input
        description: "Requested determination variant"
        constraints: "PRELIMINARY | FINAL"
      - name: resolved_basis
        type: enum
        source: computed
        description: "Variant actually applied after preservation-class and court-hold overrides"
        constraints: "PRELIMINARY | FINAL | INDEFINITE | COURT_HOLD"
      - name: anchor_at
        type: datetime
        source: computed
        description: "Anchor instant used by the applied variant: EvidenceItem.intake_at for PRELIMINARY, Case.adjudicated_at for FINAL"
        default: null
      - name: statute_days_applied
        type: integer
        source: computed
        description: "Whole days added to anchor_at by the applied variant; 0 when resolved_basis in {INDEFINITE, COURT_HOLD}"
        default: 0
      - name: computed_release_at
        type: datetime
        source: computed
        description: "Release instant this determination produced; copied onto EvidenceItem.retention_release_at"
        default: null
      - name: superseded
        type: boolean
        source: computed
        description: "True once a later determination for the same evidence_item_id exists"
        default: false

  - name: CustodyTransfer
    parent: null
    common_fields: true
    fields:
      - name: evidence_item_id
        type: string
        source: input
        description: "FK -> EvidenceItem.id; the item being moved"
      - name: to_custodian_id
        type: string
        source: input
        description: "FK -> Custodian.id; the receiving custodian who will hold the item"
      - name: purpose
        type: enum
        source: input
        description: "Transfer purpose; selects the maximum window length"
        constraints: "LAB_ANALYSIS | COURT_PRESENTATION | INVESTIGATIVE_REVIEW"
      - name: released_at
        type: datetime
        source: input
        description: "Planned start of the custody window; interval start for overlap checks"
      - name: due_back_at
        type: datetime
        source: input
        description: "Planned end of the custody window; must be strictly after released_at"
      - name: from_custodian_id
        type: string
        source: system
        description: "FK -> Custodian.id; the evidence technician who executed the release, null until released"
        default: null
      - name: status
        type: enum
        source: system
        description: "Transfer lifecycle status"
        default: "REQUESTED"
        constraints: "REQUESTED | RELEASED | RETURNED | OVERDUE | DENIED | LOST"
      - name: released_signature
        type: string
        source: system
        description: "Signature captured from the releasing technician at POST /custody-transfers/{transferId}/release"
        default: null
      - name: witness_signature
        type: string
        source: system
        description: "Second signature captured at release when the source location requires_dual_signature"
        default: null
      - name: receipt_signature
        type: string
        source: system
        description: "Signature captured from the returning custodian at POST /custody-transfers/{transferId}/return"
        default: null
      - name: returned_at
        type: datetime
        source: system
        description: "Logical-clock instant of return; closes the custody interval"
        default: null
      - name: denial_reason
        type: string
        source: system
        description: "Reason recorded when the transfer moves to DENIED or LOST"
        default: null

  - name: DispositionOrder
    parent: null
    common_fields: true
    fields:
      - name: evidence_item_id
        type: string
        source: input
        description: "FK -> EvidenceItem.id; the item being disposed"
      - name: type
        type: enum
        source: input
        description: "Disposition pathway"
        constraints: "RETURN_TO_OWNER | AUCTION | DESTRUCTION | CONVERSION"
      - name: requested_by_custodian_id
        type: string
        source: input
        description: "FK -> Custodian.id; custodian requesting the disposition; may not also execute it"
      - name: owner_claim_id
        type: string
        source: input
        description: "FK -> OwnerClaim.id; required when type == RETURN_TO_OWNER, otherwise must be null"
        default: null
      - name: reserve_price_cents
        type: integer
        source: input
        description: "Auction reserve floor in cents; required when type == AUCTION, otherwise must be null"
        default: null
        constraints: ">= 0 when present"
      - name: status
        type: enum
        source: system
        description: "Order lifecycle status"
        default: "PENDING_COURT_AUTH"
        constraints: "PENDING_COURT_AUTH | AUTHORIZED | EXECUTED | SETTLED | DISBURSED | REJECTED"
      - name: auto_authorized
        type: boolean
        source: computed
        description: "True when the order skipped court authorization per calculations.auto_authorization_predicate"
        default: false
      - name: court_order_number
        type: string
        source: system
        description: "Court order reference captured at POST /disposition-orders/{orderId}/authorize; null for auto-authorized orders"
        default: null
      - name: estimated_net_proceeds_cents
        type: integer
        source: computed
        description: "ESTIMATED variant of calculations.disposition_proceeds, computed at creation"
        default: 0
      - name: gross_sale_cents
        type: integer
        source: system
        description: "Hammer price captured at settlement; null until settled"
        default: null
      - name: commission_cents
        type: integer
        source: computed
        description: "Auctioneer commission from the SETTLED variant"
        default: null
      - name: storage_recovery_cents
        type: integer
        source: computed
        description: "Capped storage-cost recovery from the SETTLED variant"
        default: null
      - name: settled_net_proceeds_cents
        type: integer
        source: computed
        description: "SETTLED variant of calculations.disposition_proceeds; 0 for non-AUCTION types"
        default: null
      - name: settlement_status
        type: enum
        source: computed
        description: "Escrow posture of this order's proceeds"
        default: "NONE"
        constraints: "NONE | HELD | DISBURSED"
      - name: executed_by_custodian_id
        type: string
        source: system
        description: "FK -> Custodian.id; custodian who executed the disposition"
        default: null
      - name: witness_custodian_id
        type: string
        source: system
        description: "FK -> Custodian.id; witness present at execution"
        default: null
      - name: authorized_at
        type: datetime
        source: system
        description: "Logical-clock instant of authorization (court or automatic)"
        default: null
      - name: executed_at
        type: datetime
        source: system
        description: "Logical-clock instant of execution; anchor of storage-cost recovery and of the settlement window"
        default: null
      - name: settlement_deadline_at
        type: datetime
        source: computed
        description: "executed_at + SETTLEMENT_WINDOW_DAYS for AUCTION orders; null otherwise"
        default: null
      - name: settled_at
        type: datetime
        source: system
        description: "Logical-clock instant of settlement"
        default: null
      - name: payee_reference
        type: string
        source: system
        description: "Treasury/payee reference captured at disbursement"
        default: null

  - name: OwnerClaim
    parent: null
    common_fields: true
    fields:
      - name: evidence_item_id
        type: string
        source: input
        description: "FK -> EvidenceItem.id; the item the notice concerns"
      - name: claimant_name
        type: string
        source: input
        description: "Name of the noticed owner or claimant"
      - name: claimant_contact
        type: string
        source: input
        description: "Mailing address or contact string used for the notice"
      - name: notice_method
        type: enum
        source: input
        description: "Notification channel; PUBLICATION extends the claim window"
        constraints: "CERTIFIED_MAIL | PUBLICATION | IN_PERSON"
      - name: notified_at
        type: datetime
        source: system
        description: "Logical-clock instant the notice was issued; anchor of claim_deadline_at"
      - name: claim_deadline_at
        type: datetime
        source: computed
        description: "Deadline for the owner to file, per calculations.owner_claim_deadline"
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle status"
        default: "NOTICE_SENT"
        constraints: "NOTICE_SENT | CLAIM_FILED | VERIFIED | RELEASED | EXPIRED"
      - name: proof_document_ref
        type: string
        source: system
        description: "Proof-of-ownership document reference captured at filing"
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: "Logical-clock instant of verification"
        default: null

  - name: AuditSession
    parent: null
    common_fields: true
    fields:
      - name: storage_location_id
        type: string
        source: input
        description: "FK -> StorageLocation.id; the location under audit"
      - name: auditor_id
        type: string
        source: input
        description: "FK -> Custodian.id; the auditor conducting the session; must equal the acting X-User-ID"
      - name: scheduled_start_at
        type: datetime
        source: input
        description: "Planned window start; interval start for the audit-buffer overlap check"
      - name: scheduled_end_at
        type: datetime
        source: input
        description: "Planned window end; must be strictly after scheduled_start_at"
      - name: status
        type: enum
        source: system
        description: "Session lifecycle status"
        default: "SCHEDULED"
        constraints: "SCHEDULED | IN_PROGRESS | RECONCILED | CLOSED"
      - name: started_at
        type: datetime
        source: system
        description: "Logical-clock instant the seal was applied"
        default: null
      - name: reconciled_at
        type: datetime
        source: system
        description: "Logical-clock instant reconciliation ran"
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant the session closed"
        default: null
      - name: expected_evidence_item_ids
        type: array
        source: computed
        description: "Snapshot taken at start: ids of EvidenceItem rows with storage_location_id == this location and custody_state == STORED, ordered by created_at ASC"
        default: []
      - name: expected_item_count
        type: integer
        source: computed
        description: "Length of expected_evidence_item_ids"
        default: 0
      - name: scanned_evidence_item_ids
        type: array
        source: computed
        description: "Ids recorded by POST /audit-sessions/{sessionId}/scan, in scan order"
        default: []
      - name: scanned_item_count
        type: integer
        source: computed
        description: "Length of scanned_evidence_item_ids"
        default: 0
      - name: missing_count
        type: integer
        source: computed
        description: "Count of Discrepancy rows of this session with kind == MISSING"
        default: 0
      - name: misplaced_count
        type: integer
        source: computed
        description: "Count of Discrepancy rows of this session with kind == MISPLACED"
        default: 0
      - name: risk_index
        type: number
        source: computed
        description: "Weighted discrepancy risk per calculations.audit_risk_index; 0.00 until reconciliation"
        default: 0.00

  - name: Discrepancy
    parent: null
    common_fields: true
    fields:
      - name: evidence_item_id
        type: string
        source: input
        description: "FK -> EvidenceItem.id; the item the discrepancy concerns"
      - name: audit_session_id
        type: string
        source: input
        description: "FK -> AuditSession.id; the session that raised it, null when raised by POST /custody-transfers/{transferId}/report-lost"
        default: null
      - name: kind
        type: enum
        source: system
        description: "Discrepancy kind; MISSING is expected-but-absent, MISPLACED is present-in-the-wrong-location"
        constraints: "MISSING | MISPLACED"
      - name: status
        type: enum
        source: system
        description: "Investigation status"
        default: "OPEN"
        constraints: "OPEN | UNDER_INVESTIGATION | RESOLVED_FOUND | RESOLVED_WRITTEN_OFF"
      - name: weight_contribution
        type: number
        source: computed
        description: "This row's rounded contribution to AuditSession.risk_index, per calculations.audit_risk_index"
        default: 0.00
      - name: resolution_note
        type: string
        source: system
        description: "Investigator note captured at resolution"
        default: null
      - name: resolved_at
        type: datetime
        source: system
        description: "Logical-clock instant of resolution"
        default: null

  - name: ChainEvent
    parent: null
    common_fields: false
    fields:
      - name: evidence_item_id
        type: string
        source: system
        description: "FK -> EvidenceItem.id; the item whose chain of custody this entry documents"
      - name: actor_custodian_id
        type: string
        source: system
        description: "FK -> Custodian.id; acting custodian, null for system-generated entries (sweep, cascade)"
        default: null
      - name: event_type
        type: enum
        source: system
        description: "Chain of custody event kind"
        constraints: "INTAKE | STORAGE_ASSIGN | RELEASE | RECEIPT | AUDIT_SCAN | DISCREPANCY_RAISED | RETENTION_SET | NOTICE_SENT | DISPOSITION_EXECUTED"
      - name: sequence_no
        type: integer
        source: system
        description: "1-based, gapless sequence per evidence_item_id, assigned in ascending occurred_at then created_at order"
      - name: occurred_at
        type: datetime
        source: system
        description: "Logical-clock instant the documented event occurred"
      - name: actor_role
        type: enum
        source: system
        description: "X-User-Role of the acting principal, or SYSTEM for cascade/sweep entries"
        constraints: "PropertyRoomManager | EvidenceTechnician | Investigator | LabAnalyst | CourtClerk | InternalAuditor | SYSTEM"
      - name: signature_ref
        type: string
        source: system
        description: "Signature string captured with the event, null when the event carries no signature"
        default: null
      - name: detail
        type: string
        source: system
        description: "Human-readable detail line for the chain of custody document"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- EvidenceItem dimension 1 of 2: physical custody -----------------------
  - entity: EvidenceItem
    state_field: custody_state
    initial_state: LOGGED
    terminal_states: [PURGED]
    note: "Parallel dimension 1 of 2 on EvidenceItem; evolves independently of disposition_state."
    transitions:
      - from: LOGGED
        to: STORED
        trigger: "POST /evidence-items/{itemId}/storage-assignment"
        actor: EvidenceTechnician
        preconditions:
          - "room posture != LOCKED_DOWN"
          - "target StorageLocation.status == OPEN"
          - "target StorageLocation.category == EvidenceItem.required_storage_category"
          - "target StorageLocation.occupied_slots < capacity_slots"
          - "when target category == REFRIGERATED: temperature_c <= 4.0"
        side_effects:
          - "sets EvidenceItem.storage_location_id"
          - "increments StorageLocation.occupied_slots by 1 and StorageLocation.version by 1"
          - "appends ChainEvent(event_type=STORAGE_ASSIGN)"
          - "recomputes PropertyRoom.posture"
      - from: STORED
        to: CHECKED_OUT
        trigger: "POST /custody-transfers/{transferId}/release"
        actor: EvidenceTechnician
        preconditions:
          - "room posture not in {RESTRICTED, LOCKED_DOWN}"
          - "CustodyTransfer.status == REQUESTED"
          - "the item's StorageLocation.status == OPEN"
          - "receiving Custodian.status == ACTIVE and certification_expires_at > now"
        side_effects:
          - "sets EvidenceItem.current_holder_id to CustodyTransfer.to_custodian_id"
          - "CustodyTransfer REQUESTED -> RELEASED with released_signature (and witness_signature when the location requires_dual_signature)"
          - "appends ChainEvent(event_type=RELEASE, signature_ref=released_signature)"
          - "StorageLocation.occupied_slots unchanged: the bin stays reserved while the item is out"
      - from: CHECKED_OUT
        to: STORED
        trigger: "POST /custody-transfers/{transferId}/return"
        actor: EvidenceTechnician
        preconditions:
          - "CustodyTransfer.status in {RELEASED, OVERDUE}"
          - "the item's StorageLocation.status == OPEN"
        side_effects:
          - "clears EvidenceItem.current_holder_id"
          - "CustodyTransfer -> RETURNED with receipt_signature and returned_at = now, closing the custody interval"
          - "appends ChainEvent(event_type=RECEIPT, signature_ref=receipt_signature)"
      - from: STORED
        to: MISSING
        trigger: "system: Discrepancy(kind=MISSING) raised by POST /audit-sessions/{sessionId}/reconcile"
        actor: system
        preconditions:
          - "item is in AuditSession.expected_evidence_item_ids and not in scanned_evidence_item_ids"
        side_effects:
          - "decrements StorageLocation.occupied_slots by 1 (item leaves the {STORED, CHECKED_OUT} occupancy set)"
          - "increments PropertyRoom.open_discrepancy_count, and missing_high_risk_count when category in {FIREARM, CURRENCY, NARCOTICS}"
          - "recomputes PropertyRoom.posture"
          - "appends ChainEvent(event_type=DISCREPANCY_RAISED)"
      - from: CHECKED_OUT
        to: MISSING
        trigger: "POST /custody-transfers/{transferId}/report-lost"
        actor: PropertyRoomManager
        preconditions:
          - "CustodyTransfer.status in {RELEASED, OVERDUE}"
        side_effects:
          - "CustodyTransfer -> LOST with denial_reason set"
          - "clears EvidenceItem.current_holder_id"
          - "creates Discrepancy(kind=MISSING, audit_session_id=null, status=OPEN)"
          - "decrements StorageLocation.occupied_slots by 1"
          - "increments PropertyRoom.open_discrepancy_count, recomputes posture"
          - "appends ChainEvent(event_type=DISCREPANCY_RAISED)"
      - from: MISSING
        to: STORED
        trigger: "POST /discrepancies/{discrepancyId}/resolve with resolution == FOUND on a MISSING discrepancy"
        actor: PropertyRoomManager
        preconditions:
          - "Discrepancy.kind == MISSING and status in {OPEN, UNDER_INVESTIGATION}"
          - "the item's StorageLocation.occupied_slots < capacity_slots"
        side_effects:
          - "increments StorageLocation.occupied_slots by 1, restoring calculations.location_occupied_slots"
          - "decrements PropertyRoom.open_discrepancy_count and missing_high_risk_count where applicable"
          - "recomputes PropertyRoom.posture"
        note: "Cycle STORED -> MISSING -> STORED; the compensating half of the occupancy invariant."
      - from: MISSING
        to: PURGED
        trigger: "POST /discrepancies/{discrepancyId}/resolve with resolution == WRITTEN_OFF"
        actor: PropertyRoomManager
        preconditions:
          - "Discrepancy.kind == MISSING and status in {OPEN, UNDER_INVESTIGATION}"
        side_effects:
          - "sets EvidenceItem.disposition_state = DISPOSED"
          - "StorageLocation.occupied_slots unchanged (already released when the item went MISSING)"
          - "decrements PropertyRoom.open_discrepancy_count, recomputes posture"
          - "decrements Case.undisposed_item_count"
      - from: STORED
        to: PURGED
        trigger: "POST /disposition-orders/{orderId}/execute"
        actor: PropertyRoomManager
        preconditions:
          - "room posture not in {RESTRICTED, LOCKED_DOWN}"
          - "DispositionOrder.status == AUTHORIZED"
          - "EvidenceItem.custody_state == STORED"
        side_effects:
          - "sets EvidenceItem.disposition_state = DISPOSED"
          - "decrements StorageLocation.occupied_slots by 1"
          - "appends ChainEvent(event_type=DISPOSITION_EXECUTED)"
          - "decrements Case.undisposed_item_count and PropertyRoom.disposal_eligible_count"

  # --- EvidenceItem dimension 2 of 2: retention / disposition ----------------
  - entity: EvidenceItem
    state_field: disposition_state
    initial_state: RETAINED
    terminal_states: [DISPOSED]
    note: "Parallel dimension 2 of 2 on EvidenceItem; a single row can be CHECKED_OUT × DISPOSAL_ELIGIBLE."
    transitions:
      - from: RETAINED
        to: COURT_HOLD
        trigger: "POST /cases/{caseId}/appeal"
        actor: CourtClerk
        preconditions:
          - "Case.status == ADJUDICATED"
        side_effects:
          - "sets EvidenceItem.retention_release_at = null and retention_basis = COURT_HOLD"
          - "creates RetentionDetermination(basis=FINAL, resolved_basis=COURT_HOLD, computed_release_at=null) and supersedes the prior determination"
          - "appends ChainEvent(event_type=RETENTION_SET)"
      - from: DISPOSAL_ELIGIBLE
        to: COURT_HOLD
        trigger: "POST /cases/{caseId}/appeal"
        actor: CourtClerk
        preconditions:
          - "Case.status == ADJUDICATED"
        side_effects:
          - "same as RETAINED -> COURT_HOLD, and decrements PropertyRoom.disposal_eligible_count"
      - from: COURT_HOLD
        to: RETAINED
        trigger: "POST /cases/{caseId}/resolve-appeal"
        actor: CourtClerk
        preconditions:
          - "Case.status == APPEAL_PENDING"
        side_effects:
          - "sets Case.adjudicated_at = now (re-adjudication)"
          - "recomputes the FINAL retention variant against the new anchor and writes a new RetentionDetermination"
          - "when the new retention_release_at <= now, continues to DISPOSAL_ELIGIBLE in the same request"
      - from: RETAINED
        to: DISPOSAL_ELIGIBLE
        trigger: "POST /property-rooms/{roomId}/daily-sweep, or the retention recomputation cascade of POST /cases/{caseId}/adjudicate"
        actor: system
        preconditions:
          - "EvidenceItem.custody_state == STORED"
          - "retention_release_at is not null and retention_release_at <= now"
        side_effects:
          - "increments PropertyRoom.disposal_eligible_count"
      - from: RETAINED
        to: UNCLAIMED_ELIGIBLE
        trigger: "POST /property-rooms/{roomId}/daily-sweep, sweep step 2 (owner-notice expiry)"
        actor: system
        preconditions:
          - "an OwnerClaim for this item has status == NOTICE_SENT and claim_deadline_at <= now"
        side_effects:
          - "OwnerClaim -> EXPIRED"
          - "increments PropertyRoom.disposal_eligible_count"
        note: "Sweep step 2 runs before step 3, so an item whose notice just expired becomes UNCLAIMED_ELIGIBLE rather than DISPOSAL_ELIGIBLE."
      - from: DISPOSAL_ELIGIBLE
        to: ORDER_PENDING
        trigger: "POST /disposition-orders"
        actor: EvidenceTechnician
        preconditions:
          - "room posture != LOCKED_DOWN"
          - "case disposability gate per validations[priority=24]"
          - "preservation-class gate per validations[priority=23]"
        side_effects:
          - "creates DispositionOrder in PENDING_COURT_AUTH (or AUTHORIZED when auto-authorized)"
          - "computes DispositionOrder.estimated_net_proceeds_cents (ESTIMATED variant)"
      - from: UNCLAIMED_ELIGIBLE
        to: ORDER_PENDING
        trigger: "POST /disposition-orders"
        actor: EvidenceTechnician
        preconditions:
          - "same as DISPOSAL_ELIGIBLE -> ORDER_PENDING; found property is exempt from the case-status gate"
        side_effects:
          - "same as DISPOSAL_ELIGIBLE -> ORDER_PENDING"
      - from: ORDER_PENDING
        to: RETAINED
        trigger: "POST /disposition-orders/{orderId}/reject"
        actor: CourtClerk
        preconditions:
          - "DispositionOrder.status == PENDING_COURT_AUTH"
        side_effects:
          - "DispositionOrder -> REJECTED with denial recorded in court_order_number-free form"
          - "decrements PropertyRoom.disposal_eligible_count; the next sweep re-derives eligibility"
      - from: ORDER_PENDING
        to: DISPOSED
        trigger: "POST /disposition-orders/{orderId}/execute"
        actor: PropertyRoomManager
        preconditions:
          - "DispositionOrder.status == AUTHORIZED"
          - "EvidenceItem.custody_state == STORED"
          - "segregation of duties per validations[priority=14]"
        side_effects:
          - "sets EvidenceItem.custody_state = PURGED"
          - "when type == RETURN_TO_OWNER: OwnerClaim -> RELEASED"
          - "decrements PropertyRoom.disposal_eligible_count and Case.undisposed_item_count"

  # --- Case: cyclic ---------------------------------------------------------
  - entity: Case
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    note: "Cyclic: ADJUDICATED -> APPEAL_PENDING -> ADJUDICATED can repeat without bound, re-anchoring FINAL retention each pass."
    transitions:
      - from: OPEN
        to: CHARGED
        trigger: "POST /cases/{caseId}/charge"
        actor: Investigator
        preconditions:
          - "room posture != LOCKED_DOWN"
        side_effects:
          - "sets Case.charged_at = now"
      - from: CHARGED
        to: ADJUDICATED
        trigger: "POST /cases/{caseId}/adjudicate"
        actor: CourtClerk
        preconditions:
          - "room posture != LOCKED_DOWN"
        side_effects:
          - "sets Case.adjudicated_at = now"
          - "for every EvidenceItem of the case ordered by created_at ASC: creates RetentionDetermination(basis=FINAL), supersedes the prior determination, rewrites retention_release_at/retention_basis, appends ChainEvent(RETENTION_SET), and increments EvidenceItem.version"
          - "each item whose new retention_release_at <= now and custody_state == STORED continues RETAINED -> DISPOSAL_ELIGIBLE"
          - "PropertyRoom.disposal_eligible_count recomputed as a consequence of those disposition_state changes"
      - from: ADJUDICATED
        to: APPEAL_PENDING
        trigger: "POST /cases/{caseId}/appeal"
        actor: CourtClerk
        preconditions:
          - "room posture != LOCKED_DOWN"
        side_effects:
          - "sets Case.appeal_opened_at = now"
          - "every non-DISPOSED EvidenceItem of the case moves to COURT_HOLD with retention_release_at = null"
      - from: APPEAL_PENDING
        to: ADJUDICATED
        trigger: "POST /cases/{caseId}/resolve-appeal"
        actor: CourtClerk
        preconditions:
          - "room posture != LOCKED_DOWN"
        side_effects:
          - "sets Case.adjudicated_at = now, clears appeal_opened_at"
          - "recomputes the FINAL retention variant for every non-DISPOSED item against the new anchor"
        note: "Completes the cycle; the second pass produces a strictly later retention_release_at than the first."
      - from: ADJUDICATED
        to: CLOSED
        trigger: "POST /cases/{caseId}/close"
        actor: PropertyRoomManager
        preconditions:
          - "Case.undisposed_item_count == 0"
        side_effects:
          - "sets Case.closed_at = now"

  # --- CustodyTransfer: branching -------------------------------------------
  - entity: CustodyTransfer
    state_field: status
    initial_state: REQUESTED
    terminal_states: [RETURNED, DENIED, LOST]
    note: "Branching with divergent side-effect sets: RETURNED restores custody, LOST raises a Discrepancy and drives posture."
    transitions:
      - from: REQUESTED
        to: RELEASED
        trigger: "POST /custody-transfers/{transferId}/release"
        actor: EvidenceTechnician
        preconditions:
          - "room posture not in {RESTRICTED, LOCKED_DOWN}"
          - "EvidenceItem.custody_state == STORED"
          - "the item's StorageLocation.status == OPEN"
          - "witness_signature present when the location requires_dual_signature"
        side_effects:
          - "sets from_custodian_id to the acting technician, released_signature, and EvidenceItem.custody_state = CHECKED_OUT"
          - "appends ChainEvent(event_type=RELEASE)"
      - from: RELEASED
        to: RETURNED
        trigger: "POST /custody-transfers/{transferId}/return"
        actor: EvidenceTechnician
        preconditions:
          - "EvidenceItem.custody_state == CHECKED_OUT"
        side_effects:
          - "sets returned_at = now and receipt_signature; EvidenceItem.custody_state = STORED"
          - "appends ChainEvent(event_type=RECEIPT)"
      - from: RELEASED
        to: OVERDUE
        trigger: "POST /property-rooms/{roomId}/daily-sweep, sweep step 1"
        actor: system
        preconditions:
          - "due_back_at <= now"
        side_effects:
          - "status becomes OVERDUE; the custody interval remains open for overlap purposes"
      - from: OVERDUE
        to: RETURNED
        trigger: "POST /custody-transfers/{transferId}/return"
        actor: EvidenceTechnician
        preconditions:
          - "EvidenceItem.custody_state == CHECKED_OUT"
        side_effects:
          - "same as RELEASED -> RETURNED"
      - from: REQUESTED
        to: DENIED
        trigger: "system: PropertyRoom.posture transitions to LOCKED_DOWN"
        actor: system
        preconditions:
          - "the transfer's item belongs to a Case of the locked-down room"
        side_effects:
          - "sets denial_reason = 'ROOM_LOCKED_DOWN'"
          - "decrements Custodian.open_escort_count for to_custodian_id"
      - from: RELEASED
        to: LOST
        trigger: "POST /custody-transfers/{transferId}/report-lost"
        actor: PropertyRoomManager
        preconditions:
          - "EvidenceItem.custody_state == CHECKED_OUT"
        side_effects:
          - "creates Discrepancy(kind=MISSING, audit_session_id=null) and drives EvidenceItem to MISSING"
      - from: OVERDUE
        to: LOST
        trigger: "POST /custody-transfers/{transferId}/report-lost"
        actor: PropertyRoomManager
        preconditions:
          - "EvidenceItem.custody_state == CHECKED_OUT"
        side_effects:
          - "same as RELEASED -> LOST"

  # --- DispositionOrder: branching with auto-transitions --------------------
  - entity: DispositionOrder
    state_field: status
    initial_state: PENDING_COURT_AUTH
    terminal_states: [DISBURSED, REJECTED]
    note: "Branching: court path vs auto-authorization; AUCTION settles with proceeds, other types auto-settle at 0."
    transitions:
      - from: PENDING_COURT_AUTH
        to: AUTHORIZED
        trigger: "system: auto-authorization evaluated inside POST /disposition-orders"
        actor: system
        preconditions:
          - "calculations.auto_authorization_predicate holds"
        side_effects:
          - "sets auto_authorized = true, authorized_at = now, court_order_number stays null"
      - from: PENDING_COURT_AUTH
        to: AUTHORIZED
        trigger: "POST /disposition-orders/{orderId}/authorize"
        actor: CourtClerk
        preconditions:
          - "room posture != LOCKED_DOWN"
        side_effects:
          - "sets court_order_number and authorized_at = now, auto_authorized stays false"
      - from: PENDING_COURT_AUTH
        to: REJECTED
        trigger: "POST /disposition-orders/{orderId}/reject"
        actor: CourtClerk
        preconditions:
          - "room posture != LOCKED_DOWN"
        side_effects:
          - "EvidenceItem.disposition_state ORDER_PENDING -> RETAINED"
          - "decrements PropertyRoom.disposal_eligible_count"
      - from: AUTHORIZED
        to: EXECUTED
        trigger: "POST /disposition-orders/{orderId}/execute"
        actor: PropertyRoomManager
        preconditions:
          - "room posture not in {RESTRICTED, LOCKED_DOWN}"
          - "EvidenceItem.custody_state == STORED"
          - "executed_by_custodian_id != requested_by_custodian_id and witness_custodian_id != executed_by_custodian_id"
          - "when type == RETURN_TO_OWNER: OwnerClaim.status == VERIFIED"
        side_effects:
          - "sets executed_at = now; for AUCTION also settlement_deadline_at = executed_at + 30 days"
          - "EvidenceItem -> PURGED / DISPOSED, StorageLocation.occupied_slots decremented"
          - "when type == RETURN_TO_OWNER: OwnerClaim -> RELEASED"
          - "appends ChainEvent(event_type=DISPOSITION_EXECUTED)"
      - from: EXECUTED
        to: SETTLED
        trigger: "system: auto-settlement inside POST /disposition-orders/{orderId}/execute when type != AUCTION"
        actor: system
        preconditions:
          - "type in {RETURN_TO_OWNER, DESTRUCTION, CONVERSION}"
        side_effects:
          - "sets settled_net_proceeds_cents = 0, settlement_status = NONE, settled_at = now"
        note: "Rest state, not terminal: disburse is refused with ERR_NO_PROCEEDS_HELD because settlement_status != HELD."
      - from: EXECUTED
        to: SETTLED
        trigger: "POST /disposition-orders/{orderId}/settle"
        actor: PropertyRoomManager
        preconditions:
          - "type == AUCTION"
          - "gross_sale_cents >= reserve_price_cents"
          - "now <= settlement_deadline_at"
        side_effects:
          - "computes commission_cents, storage_recovery_cents, settled_net_proceeds_cents (SETTLED variant)"
          - "sets settlement_status = HELD and increments PropertyRoom.escrow_balance_cents by settled_net_proceeds_cents"
      - from: SETTLED
        to: DISBURSED
        trigger: "POST /disposition-orders/{orderId}/disburse"
        actor: PropertyRoomManager
        preconditions:
          - "settlement_status == HELD"
        side_effects:
          - "sets settlement_status = DISBURSED and payee_reference"
          - "decrements PropertyRoom.escrow_balance_cents by settled_net_proceeds_cents, restoring calculations.room_escrow_balance"

  # --- OwnerClaim: branching ------------------------------------------------
  - entity: OwnerClaim
    state_field: status
    initial_state: NOTICE_SENT
    terminal_states: [RELEASED, EXPIRED]
    transitions:
      - from: NOTICE_SENT
        to: CLAIM_FILED
        trigger: "POST /owner-claims/{claimId}/file"
        actor: EvidenceTechnician
        preconditions:
          - "now <= claim_deadline_at"
        side_effects:
          - "stores proof_document_ref"
      - from: CLAIM_FILED
        to: VERIFIED
        trigger: "POST /owner-claims/{claimId}/verify"
        actor: PropertyRoomManager
        preconditions:
          - "room posture != LOCKED_DOWN"
        side_effects:
          - "sets verified_at = now"
      - from: VERIFIED
        to: RELEASED
        trigger: "system: POST /disposition-orders/{orderId}/execute with type == RETURN_TO_OWNER"
        actor: system
        preconditions:
          - "the executing order's owner_claim_id == this claim"
        side_effects:
          - "the item is handed to the claimant; EvidenceItem -> PURGED / DISPOSED"
      - from: NOTICE_SENT
        to: EXPIRED
        trigger: "POST /property-rooms/{roomId}/daily-sweep, sweep step 2"
        actor: system
        preconditions:
          - "claim_deadline_at <= now"
        side_effects:
          - "the item's disposition_state RETAINED -> UNCLAIMED_ELIGIBLE"

  # --- AuditSession ---------------------------------------------------------
  - entity: AuditSession
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /audit-sessions/{sessionId}/start"
        actor: InternalAuditor
        preconditions:
          - "StorageLocation.status == OPEN"
        side_effects:
          - "StorageLocation -> SEALED_FOR_AUDIT with sealed_by_audit_session_id set, version incremented"
          - "snapshots expected_evidence_item_ids / expected_item_count"
          - "increments PropertyRoom.sealed_location_count and recomputes posture (OPEN -> RESTRICTED)"
      - from: IN_PROGRESS
        to: RECONCILED
        trigger: "POST /audit-sessions/{sessionId}/reconcile"
        actor: InternalAuditor
        preconditions:
          - "status == IN_PROGRESS"
        side_effects:
          - "creates Discrepancy(kind=MISSING) for every expected id absent from scanned_evidence_item_ids whose item is still STORED, ordered by EvidenceItem.created_at ASC"
          - "each new MISSING discrepancy drives EvidenceItem STORED -> MISSING, which decrements StorageLocation.occupied_slots and increments PropertyRoom.open_discrepancy_count / missing_high_risk_count"
          - "computes Discrepancy.weight_contribution and AuditSession.risk_index"
          - "recomputes PropertyRoom.posture from the new counters; a resulting LOCKED_DOWN denies every REQUESTED CustodyTransfer in the room"
      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /audit-sessions/{sessionId}/close"
        actor: InternalAuditor
        preconditions:
          - "no Discrepancy of this session has status in {OPEN, UNDER_INVESTIGATION}"
        side_effects:
          - "StorageLocation -> OPEN, sealed_by_audit_session_id cleared, version incremented"
          - "decrements PropertyRoom.sealed_location_count and recomputes posture"
      - from: RECONCILED
        to: CLOSED
        trigger: "POST /audit-sessions/{sessionId}/close"
        actor: InternalAuditor
        preconditions:
          - "no Discrepancy of this session has status in {OPEN, UNDER_INVESTIGATION}"
        side_effects:
          - "same as IN_PROGRESS -> CLOSED"

  # --- Discrepancy ----------------------------------------------------------
  - entity: Discrepancy
    state_field: status
    initial_state: OPEN
    terminal_states: [RESOLVED_FOUND, RESOLVED_WRITTEN_OFF]
    transitions:
      - from: OPEN
        to: UNDER_INVESTIGATION
        trigger: "POST /discrepancies/{discrepancyId}/investigate"
        actor: PropertyRoomManager
        preconditions:
          - "status == OPEN"
        side_effects:
          - "no counter changes: UNDER_INVESTIGATION remains inside the open set for posture and risk purposes"
      - from: OPEN
        to: RESOLVED_FOUND
        trigger: "POST /discrepancies/{discrepancyId}/resolve with resolution == FOUND"
        actor: PropertyRoomManager
        preconditions:
          - "for kind == MISSING: item's StorageLocation.occupied_slots < capacity_slots"
          - "for kind == MISPLACED: the audit session's StorageLocation.occupied_slots < capacity_slots and its category == item.required_storage_category"
        side_effects:
          - "kind == MISSING: EvidenceItem MISSING -> STORED and occupied_slots incremented"
          - "kind == MISPLACED: EvidenceItem.storage_location_id moves to the audited location; old location occupied_slots decremented, new location incremented"
          - "decrements PropertyRoom.open_discrepancy_count / missing_high_risk_count and recomputes posture"
      - from: UNDER_INVESTIGATION
        to: RESOLVED_FOUND
        trigger: "POST /discrepancies/{discrepancyId}/resolve with resolution == FOUND"
        actor: PropertyRoomManager
        preconditions:
          - "same as OPEN -> RESOLVED_FOUND"
        side_effects:
          - "same as OPEN -> RESOLVED_FOUND"
      - from: OPEN
        to: RESOLVED_WRITTEN_OFF
        trigger: "POST /discrepancies/{discrepancyId}/resolve with resolution == WRITTEN_OFF"
        actor: PropertyRoomManager
        preconditions:
          - "kind == MISSING (WRITTEN_OFF is not permitted for MISPLACED)"
        side_effects:
          - "EvidenceItem MISSING -> PURGED with disposition_state = DISPOSED"
          - "decrements PropertyRoom.open_discrepancy_count and Case.undisposed_item_count, recomputes posture"
      - from: UNDER_INVESTIGATION
        to: RESOLVED_WRITTEN_OFF
        trigger: "POST /discrepancies/{discrepancyId}/resolve with resolution == WRITTEN_OFF"
        actor: PropertyRoomManager
        preconditions:
          - "same as OPEN -> RESOLVED_WRITTEN_OFF"
        side_effects:
          - "same as OPEN -> RESOLVED_WRITTEN_OFF"

  # --- StorageLocation ------------------------------------------------------
  - entity: StorageLocation
    state_field: status
    initial_state: OPEN
    terminal_states: []
    note: "Audit seal cycle OPEN -> SEALED_FOR_AUDIT -> OPEN; a sealed location blocks storage assignment, release and return."
    transitions:
      - from: OPEN
        to: SEALED_FOR_AUDIT
        trigger: "POST /audit-sessions/{sessionId}/start"
        actor: InternalAuditor
        preconditions:
          - "status == OPEN"
        side_effects:
          - "sets sealed_by_audit_session_id and increments PropertyRoom.sealed_location_count"
      - from: SEALED_FOR_AUDIT
        to: OPEN
        trigger: "POST /audit-sessions/{sessionId}/close"
        actor: InternalAuditor
        preconditions:
          - "the closing session is the seal holder"
        side_effects:
          - "clears sealed_by_audit_session_id and decrements PropertyRoom.sealed_location_count"

  # --- PropertyRoom posture (derived gate) ----------------------------------
  - entity: PropertyRoom
    state_field: posture
    initial_state: OPEN
    terminal_states: []
    note: "Derived posture; every transition is a recomputation of calculations.room_posture triggered by a child mutation or by the daily sweep."
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system: recomputation after a location seal or after the first open Discrepancy appears"
        actor: system
        preconditions:
          - "missing_high_risk_count == 0 and open_discrepancy_count < 5 and unresolved reconciled risk sum < 25.00"
          - "open_discrepancy_count >= 1 or sealed_location_count >= 1"
        side_effects:
          - "POST /custody-transfers, .../release and .../execute are refused with ERR_ROOM_RESTRICTED"
      - from: RESTRICTED
        to: LOCKED_DOWN
        trigger: "system: recomputation after a MISSING discrepancy on a high-risk category, a fifth open discrepancy, or a reconciled risk sum reaching 25.00"
        actor: system
        preconditions:
          - "any LOCKED_DOWN branch of calculations.room_posture holds"
        side_effects:
          - "every CustodyTransfer with status == REQUESTED in this room -> DENIED"
          - "all mutating endpoints in this room except the sweep, audit-session operations, discrepancy operations and custodian suspension are refused with ERR_ROOM_LOCKED_DOWN"
      - from: LOCKED_DOWN
        to: RESTRICTED
        trigger: "system: recomputation after discrepancy resolution reduces the counters below every LOCKED_DOWN branch"
        actor: system
        preconditions:
          - "no LOCKED_DOWN branch holds and open_discrepancy_count >= 1 or sealed_location_count >= 1"
        side_effects:
          - "previously DENIED transfers are NOT revived; a new CustodyTransfer must be requested"
      - from: RESTRICTED
        to: OPEN
        trigger: "system: recomputation after the last open Discrepancy is resolved and every seal is released"
        actor: system
        preconditions:
          - "open_discrepancy_count == 0 and sealed_location_count == 0 and no LOCKED_DOWN branch holds"
        side_effects:
          - "all gated endpoints become available again"
      - from: OPEN
        to: LOCKED_DOWN
        trigger: "system: recomputation when a report-lost on a high-risk item raises the first MISSING discrepancy"
        actor: system
        preconditions:
          - "missing_high_risk_count >= 1"
        side_effects:
          - "same as RESTRICTED -> LOCKED_DOWN"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version`)
# =============================================================================
concurrency_rules:
  - rule_id: retention-determination-create-stale-item
    parent_entity: EvidenceItem
    write_endpoint: "POST /retention-determinations"
    occ_field: "expected_evidence_item_version"
    description: |
      Creating a RetentionDetermination against an EvidenceItem whose version has advanced since the
      client last read it is rejected. A new determination legitimately supersedes the prior one, so a
      second sequential create would otherwise succeed on identical observed state; the stale version
      is the only signal that the client's view of the item's retention posture is out of date (for
      example an adjudication cascade already rewrote retention_release_at).
    error_id: ERR_STALE_EVIDENCE_ITEM_VERSION
    http_status: 412

  - rule_id: audit-session-create-stale-location
    parent_entity: StorageLocation
    write_endpoint: "POST /audit-sessions"
    occ_field: "expected_storage_location_version"
    description: |
      Scheduling an AuditSession against a StorageLocation whose version has advanced since the client
      last read it is rejected. Multiple non-overlapping sessions may legitimately be scheduled on one
      location, so a second sequential create observing identical state would itself succeed; the stale
      version is what tells the scheduler that the location's occupancy or seal state has since moved.
    error_id: ERR_STALE_STORAGE_LOCATION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: required_storage_category
    trigger: "On POST /evidence-items (stored on the item) and re-read on every storage assignment or MISPLACED relocation"
    algorithm: threshold
    formula: |
      if category == BIOLOGICAL:                     return REFRIGERATED
      if category in {CURRENCY, FIREARM, NARCOTICS}: return HIGH_VALUE_VAULT
      if category == OVERSIZED:                      return OVERSIZED_YARD
      # category == GENERAL
      if appraised_value_cents >= HIGH_VALUE_THRESHOLD_CENTS: return HIGH_VALUE_VAULT
      return GENERAL
    input_set: "The item's own category and appraised_value_cents; no cross-entity inputs"
    constants:
      HIGH_VALUE_THRESHOLD_CENTS: 500000
    precision: "Integer cents; the threshold is inclusive (>=), so exactly 500000 requires the vault"

  - name: storage_location_autoselect
    trigger: "On POST /evidence-items/{itemId}/storage-assignment when storage_location_id is omitted"
    algorithm: waterfall_allocation
    formula: |
      eligible = StorageLocation where
          property_room_id == item.case.property_room_id
        AND status == OPEN
        AND category == item.required_storage_category
        AND occupied_slots < capacity_slots
        AND (category != REFRIGERATED OR temperature_c <= 4.0)
      # tightest fit first: prefer the location with the fewest free slots
      rank by (capacity_slots - occupied_slots) ASC,
              capacity_slots ASC,
              created_at ASC            # only sanctioned fallback; id is never a decision input
      if eligible is empty: reject with ERR_NO_ELIGIBLE_STORAGE
      return first ranked location
    input_set: "OPEN locations of the item's room matching required_storage_category with free capacity"
    constants: {}
    precision: "Integer slot counts; ties broken by created_at ASC, never by id"

  - name: barcode_assignment
    trigger: "On POST /evidence-items, before the item row is returned"
    algorithm: projection
    formula: |
      item_sequence = 1 + count(EvidenceItem where case_id == item.case_id)   # counts DISPOSED items too; never reused
      body   = agency_code + case_number + zero_pad(item_sequence, 4)
      digits = the decimal digits of body, left to right
      weighted_sum = sum over digits, weighting the rightmost digit 3, the next 1, alternating leftward
      check_digit  = (10 - (weighted_sum mod 10)) mod 10
      barcode = agency_code + "-" + case_number + "-" + zero_pad(item_sequence, 4) + "-" + check_digit
    input_set: "PropertyRoom.agency_code, Case.case_number, and the case's existing item count"
    constants:
      SEQUENCE_PAD_WIDTH: 4
      CHECK_WEIGHT_ODD_FROM_RIGHT: 3
      CHECK_WEIGHT_EVEN_FROM_RIGHT: 1
    precision: "Exact string; e.g. agency CPD, case 26-00001, sequence 1 -> CPD-26-00001-0001-2"

  - name: retention_release_at
    trigger: "On POST /evidence-items (PRELIMINARY), on POST /retention-determinations, and on the adjudicate / appeal / resolve-appeal cascades"
    algorithm: threshold
    formula: |
      statute = item.case.offense_statute
      # override branches, evaluated first and in this order
      if item.disposition_state == COURT_HOLD or item.case.status == APPEAL_PENDING:
          resolved_basis = COURT_HOLD;  release_at = null;  statute_days_applied = 0
      elif statute.preservation_class in {BIOLOGICAL_INDEFINITE, HOMICIDE_PERMANENT}:
          resolved_basis = INDEFINITE;  release_at = null;  statute_days_applied = 0
      elif requested basis == PRELIMINARY:
          resolved_basis = PRELIMINARY
          anchor_at = item.intake_at
          statute_days_applied = statute.statutory_retention_days
          release_at = anchor_at + statute_days_applied days
      else:   # requested basis == FINAL, requires case.status == ADJUDICATED
          resolved_basis = FINAL
          anchor_at = item.case.adjudicated_at
          statute_days_applied = statute.appeal_window_days
                              + ceil(statute.statutory_retention_days * ADJUDICATED_RETENTION_FACTOR)
          candidate = anchor_at + statute_days_applied days
          floor_at  = item.intake_at + MIN_RETENTION_DAYS days
          release_at = max(candidate, floor_at)
    input_set: "The item's intake_at and disposition_state, its case's status and adjudicated_at, and the case's OffenseStatute"
    constants:
      ADJUDICATED_RETENTION_FACTOR: 0.5
      MIN_RETENTION_DAYS: 90
    precision: "Whole days added as exact 86400-second increments on UTC instants; ceil() on the fractional half-period; the max() floor is applied after the candidate"
    variants:
      - name: PRELIMINARY
        when: "At intake, and whenever basis == PRELIMINARY is requested (case not yet adjudicated)"
        difference: "Anchors on item.intake_at and applies the full statutory_retention_days, ignoring the appeal window and the 90-day floor"
      - name: FINAL
        when: "Once the case reaches ADJUDICATED, via the adjudication cascade or an explicit basis == FINAL determination"
        difference: "Anchors on case.adjudicated_at, adds appeal_window_days plus half the statutory period (rounded up), then floors the result at intake_at + 90 days"

  - name: disposition_proceeds
    trigger: "ESTIMATED on POST /disposition-orders; SETTLED on POST /disposition-orders/{orderId}/settle"
    algorithm: tiered_pricing
    formula: |
      # --- ESTIMATED variant (order creation) ---
      if type != AUCTION: estimated_net_proceeds_cents = 0
      else:
        estimated_net_proceeds_cents = item.appraised_value_cents
              - round_half_up(item.appraised_value_cents * ESTIMATE_COMMISSION_RATE)

      # --- SETTLED variant (settlement), evaluation order is PINNED ---
      gross = gross_sale_cents
      commission_rate = COMMISSION_TIER_LOW_RATE   if gross <= COMMISSION_TIER_LOW_MAX_CENTS
                   else COMMISSION_TIER_MID_RATE   if gross <= COMMISSION_TIER_MID_MAX_CENTS
                   else COMMISSION_TIER_HIGH_RATE
      commission_cents = round_half_up(gross * commission_rate)          # step 1
      subtotal_cents   = gross - commission_cents                        # step 2
      storage_days     = floor((order.executed_at - item.intake_at) / 86400 seconds)
      raw_recovery     = storage_days * STORAGE_RATE_CENTS_PER_DAY[item.required_storage_category]
      recovery_cap     = floor(subtotal_cents * STORAGE_RECOVERY_CAP_PCT)   # step 3: cap is a share of the
                                                                           # POST-commission subtotal, not of gross
                                                                           # and not of the final net
      storage_recovery_cents      = min(raw_recovery, recovery_cap)      # step 4
      settled_net_proceeds_cents  = subtotal_cents - storage_recovery_cents   # step 5
    input_set: "The order's gross_sale_cents and executed_at, plus the item's appraised_value_cents, intake_at and required_storage_category"
    constants:
      ESTIMATE_COMMISSION_RATE: 0.10
      COMMISSION_TIER_LOW_MAX_CENTS: 50000
      COMMISSION_TIER_LOW_RATE: 0.15
      COMMISSION_TIER_MID_MAX_CENTS: 500000
      COMMISSION_TIER_MID_RATE: 0.10
      COMMISSION_TIER_HIGH_RATE: 0.07
      STORAGE_RECOVERY_CAP_PCT: 0.30
      STORAGE_RATE_CENTS_PER_DAY:
        GENERAL: 25
        REFRIGERATED: 120
        HIGH_VALUE_VAULT: 60
        OVERSIZED_YARD: 200
      SETTLEMENT_WINDOW_DAYS: 30
    precision: "Exact decimal arithmetic on integer cents, never binary floats; commission rounds half-up to whole cents; the recovery cap floors to whole cents; tier boundaries are inclusive upper bounds"
    variants:
      - name: ESTIMATED
        when: "Computed once at order creation from the appraisal, before any sale exists"
        difference: "Uses appraised_value_cents with a flat 10% commission and no storage-cost recovery"
      - name: SETTLED
        when: "Computed at settlement from the hammer price"
        difference: "Uses gross_sale_cents with the tiered commission and subtracts capped storage recovery, so it diverges from the estimate for identical items"

  - name: audit_risk_index
    trigger: "On POST /audit-sessions/{sessionId}/reconcile, and re-derived whenever one of the session's discrepancies is resolved"
    algorithm: weighted_scoring
    formula: |
      # Rounding order is PINNED: round EACH discrepancy's contribution to 2 dp,
      # THEN sum the rounded contributions. Summing raw products and rounding once
      # at the end is explicitly NOT the pinned order and yields different results.
      for each Discrepancy d of this session with status in {OPEN, UNDER_INVESTIGATION}:
          kind_weight        = KIND_WEIGHT_MISSING if d.kind == MISSING else KIND_WEIGHT_MISPLACED
          value_multiplier   = 1 + min(d.item.appraised_value_cents / VALUE_DIVISOR_CENTS,
                                       VALUE_MULTIPLIER_CAP)
          category_multiplier = SENSITIVE_CATEGORY_MULTIPLIER
                                  if session.storage_location.category in {HIGH_VALUE_VAULT, REFRIGERATED}
                                  else 1.0
          d.weight_contribution = round_half_up(kind_weight * value_multiplier * category_multiplier, 2)
      risk_index = round_half_up(sum(d.weight_contribution), 2)
    input_set: "Only discrepancies of this session with status in {OPEN, UNDER_INVESTIGATION}; resolved ones drop out and the index is re-derived"
    constants:
      KIND_WEIGHT_MISSING: 5.0
      KIND_WEIGHT_MISPLACED: 2.0
      VALUE_DIVISOR_CENTS: 1000000
      VALUE_MULTIPLIER_CAP: 2.0
      SENSITIVE_CATEGORY_MULTIPLIER: 1.5
    precision: "Exact decimal arithmetic, 2 decimal places, round_half_up applied per discrepancy and again to the sum"

  - name: room_posture
    trigger: "Recomputed at the end of every request that changes a Discrepancy status, an EvidenceItem custody_state or disposition_state, a StorageLocation status, or an AuditSession risk_index; also at the end of the daily sweep"
    algorithm: threshold
    formula: |
      open_discrepancy_count = count(Discrepancy d
            where d.item.case.property_room_id == room.id and d.status in {OPEN, UNDER_INVESTIGATION})
      missing_high_risk_count = count(those with d.kind == MISSING
            and d.item.category in {FIREARM, CURRENCY, NARCOTICS})
      unresolved_risk_sum = sum(AuditSession.risk_index
            where session.storage_location.property_room_id == room.id
              and session.status == RECONCILED
              and the session has at least one Discrepancy with status in {OPEN, UNDER_INVESTIGATION})
      sealed_location_count = count(StorageLocation where property_room_id == room.id
                                    and status == SEALED_FOR_AUDIT)

      if missing_high_risk_count >= HIGH_RISK_MISSING_LIMIT
         or open_discrepancy_count >= OPEN_DISCREPANCY_LOCKDOWN_LIMIT
         or unresolved_risk_sum >= RISK_INDEX_LOCKDOWN_THRESHOLD:
             return LOCKED_DOWN
      if open_discrepancy_count >= 1 or sealed_location_count >= 1:
             return RESTRICTED
      return OPEN
    input_set: "Open discrepancies, reconciled sessions with unresolved discrepancies, and sealed locations of this room"
    constants:
      HIGH_RISK_MISSING_LIMIT: 1
      OPEN_DISCREPANCY_LOCKDOWN_LIMIT: 5
      RISK_INDEX_LOCKDOWN_THRESHOLD: 25.00
    precision: "Integer counts; the risk sum compares with 2-decimal exactness and the threshold is inclusive (>=)"

  - name: auto_authorization_predicate
    trigger: "On POST /disposition-orders, immediately after the order row is created"
    algorithm: threshold
    formula: |
      auto_authorized = (order.type == DESTRUCTION
        and item.case.offense_statute.destruction_requires_court_order == false
        and item.category not in {FIREARM, CURRENCY, NARCOTICS, BIOLOGICAL}
        and item.appraised_value_cents < AUTO_AUTH_VALUE_CEILING_CENTS)
    input_set: "The order type, the case's statute flag, and the item's category and appraised value"
    constants:
      AUTO_AUTH_VALUE_CEILING_CENTS: 500000
    precision: "Integer cents; the ceiling is exclusive (<), so exactly 500000 still requires a court order"

  - name: owner_claim_deadline
    trigger: "On POST /owner-claims"
    algorithm: threshold
    formula: |
      base_days = FOUND_PROPERTY_NOTICE_DAYS if item.is_found_property else SEIZED_PROPERTY_NOTICE_DAYS
      extra_days = PUBLICATION_EXTRA_DAYS if notice_method == PUBLICATION else 0
      claim_deadline_at = notified_at + (base_days + extra_days) days
    input_set: "The item's is_found_property flag and the claim's notice_method"
    constants:
      FOUND_PROPERTY_NOTICE_DAYS: 90
      SEIZED_PROPERTY_NOTICE_DAYS: 30
      PUBLICATION_EXTRA_DAYS: 15
    precision: "Whole days as exact 86400-second increments; the sweep expiry comparison is inclusive (claim_deadline_at <= now)"

  - name: location_occupied_slots
    trigger: "Re-derived on storage assignment, release, return, MISSING/FOUND transitions, MISPLACED relocation and disposition execution"
    algorithm: aggregation
    formula: |
      StorageLocation.occupied_slots =
          count(EvidenceItem where storage_location_id == location.id
                             and custody_state in {STORED, CHECKED_OUT})
      # invariant, at every observable point:
      #   for every location L: L.occupied_slots == that count, and 0 <= L.occupied_slots <= L.capacity_slots
    input_set: "Items whose custody_state is STORED or CHECKED_OUT; LOGGED, MISSING and PURGED items are excluded"
    constants: {}
    precision: "Integer count; a CHECKED_OUT item keeps its slot reserved, a MISSING item releases it"

  - name: room_escrow_balance
    trigger: "Re-derived on settlement and disbursement, and recomputed by the daily sweep"
    algorithm: aggregation
    formula: |
      PropertyRoom.escrow_balance_cents =
          sum(DispositionOrder.settled_net_proceeds_cents
              where settlement_status == HELD
                and order.item.case.property_room_id == room.id)
      # invariant: settle(+net) followed by disburse(-net) returns the balance to its prior value
    input_set: "Only orders whose settlement_status == HELD; NONE and DISBURSED orders contribute 0"
    constants: {}
    precision: "Integer cents, exact; no rounding at aggregation time"

  - name: item_custody_window_conflict
    trigger: "On POST /custody-transfers, before the row is created"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN semantics [released_at, end): adjacency is allowed.
      end_of(t) = coalesce(t.returned_at, t.due_back_at)
      conflict = exists CustodyTransfer t
                   where t.evidence_item_id == candidate.evidence_item_id
                     and t.status in {REQUESTED, RELEASED, OVERDUE}
                     and candidate.released_at <  end_of(t)
                     and t.released_at        <  candidate.due_back_at
      # candidate.released_at == end_of(t) is NOT a conflict
    input_set: "Open transfers (REQUESTED, RELEASED, OVERDUE) on the same item; RETURNED, DENIED and LOST are ignored"
    constants: {}
    precision: "Millisecond instants; both comparisons strict, so touching endpoints are permitted"

  - name: escort_concurrency_load
    trigger: "On POST /custody-transfers, after the per-item window check"
    algorithm: aggregation
    formula: |
      # CLOSED semantics [released_at, end] with an AGGREGATE capacity: touching endpoints DO count.
      end_of(t) = coalesce(t.returned_at, t.due_back_at)
      load = count(CustodyTransfer t
                   where t.to_custodian_id == candidate.to_custodian_id
                     and t.status in {REQUESTED, RELEASED, OVERDUE}
                     and t.released_at        <= candidate.due_back_at
                     and candidate.released_at <= end_of(t))
      reject when load >= MAX_CONCURRENT_ESCORTS
    input_set: "Open transfers assigned to the same receiving custodian, across all items and all cases"
    constants:
      MAX_CONCURRENT_ESCORTS: 2
    precision: "Millisecond instants; both comparisons inclusive, so a transfer that merely touches another's endpoint still consumes escort capacity"

  - name: audit_window_buffer_conflict
    trigger: "On POST /audit-sessions, before the row is created"
    algorithm: interval_merge
    formula: |
      # BUFFERED semantics: each existing window is inflated by AUDIT_BUFFER_HOURS on both sides.
      buffer = AUDIT_BUFFER_HOURS hours
      conflict = exists AuditSession s
                   where s.storage_location_id == candidate.storage_location_id
                     and s.status in {SCHEDULED, IN_PROGRESS, RECONCILED}
                     and candidate.scheduled_start_at <= s.scheduled_end_at + buffer
                     and s.scheduled_start_at         <= candidate.scheduled_end_at + buffer
      # boundary is inclusive: starting exactly buffer after an existing end still conflicts
    input_set: "Non-CLOSED sessions on the same location"
    constants:
      AUDIT_BUFFER_HOURS: 48
    precision: "Millisecond instants; buffer comparisons inclusive on both sides"

  - name: transfer_window_limit
    trigger: "On POST /custody-transfers, before the overlap checks"
    algorithm: threshold
    formula: |
      max_days = MAX_WINDOW_DAYS_BY_PURPOSE[candidate.purpose]
      reject when (candidate.due_back_at - candidate.released_at) > max_days days
    input_set: "The candidate transfer's purpose and window"
    constants:
      MAX_WINDOW_DAYS_BY_PURPOSE:
        LAB_ANALYSIS: 30
        COURT_PRESENTATION: 3
        INVESTIGATIVE_REVIEW: 7
    precision: "Exact instants; a window of exactly max_days is permitted, one millisecond more is rejected"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-empty"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the six roles declared in §1.7"
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "The acting role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: auth
    check: "For entity_backed roles, X-User-ID is an existing Custodian whose role_type matches the acting role (EvidenceTechnician/EVIDENCE_TECH, Investigator/INVESTIGATOR, LabAnalyst/LAB_ANALYST, InternalAuditor/AUDITOR); additionally auditor_id on POST /audit-sessions and requested_by_custodian_id on POST /disposition-orders must equal X-User-ID when the caller is an entity_backed role"
    error_id: ERR_CUSTODIAN_ROLE_MISMATCH
    http_status: 403
    applies_to: "all endpoints whose roles include EvidenceTechnician, Investigator, LabAnalyst or InternalAuditor"

  - priority: 5
    category: existence
    check: "Every path-templated id resolves to an existing row, validated left-to-right"
    error_id: "ERR_PROPERTY_ROOM_NOT_FOUND | ERR_OFFENSE_STATUTE_NOT_FOUND | ERR_STORAGE_LOCATION_NOT_FOUND | ERR_CUSTODIAN_NOT_FOUND | ERR_CASE_NOT_FOUND | ERR_EVIDENCE_ITEM_NOT_FOUND | ERR_RETENTION_DETERMINATION_NOT_FOUND | ERR_CUSTODY_TRANSFER_NOT_FOUND | ERR_DISPOSITION_ORDER_NOT_FOUND | ERR_OWNER_CLAIM_NOT_FOUND | ERR_AUDIT_SESSION_NOT_FOUND | ERR_DISCREPANCY_NOT_FOUND | ERR_CHAIN_EVENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a templated path segment"

  - priority: 6
    category: existence
    check: "Request-shape validation: required input fields present, types and enums valid, conditionally-required fields honoured (temperature_c when category == REFRIGERATED, reserve_price_cents when type == AUCTION, owner_claim_id when type == RETURN_TO_OWNER, witness_signature when the location requires_dual_signature is handled at priority 18)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 7
    category: existence
    check: "Every FK id in the request body resolves, validated in the endpoint's declared input order; a scanned barcode must match an existing EvidenceItem (ERR_BARCODE_NOT_FOUND)"
    error_id: "ERR_PROPERTY_ROOM_NOT_FOUND | ERR_OFFENSE_STATUTE_NOT_FOUND | ERR_STORAGE_LOCATION_NOT_FOUND | ERR_CUSTODIAN_NOT_FOUND | ERR_CASE_NOT_FOUND | ERR_EVIDENCE_ITEM_NOT_FOUND | ERR_OWNER_CLAIM_NOT_FOUND | ERR_BARCODE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying FK fields or a barcode"

  - priority: 8
    category: business_safety
    check: "The room's posture is not LOCKED_DOWN. Deliberately ordered ABOVE state preconditions: a lockdown supersedes the target resource's own state, so a locked-down room rejects the request even when the target is in the wrong state. Exempt endpoints: the daily sweep, all audit-session operations, all discrepancy operations, custodian suspension, and the clock endpoint"
    error_id: ERR_ROOM_LOCKED_DOWN
    http_status: 409
    applies_to: "all mutating endpoints scoped to a room except POST /property-rooms/{roomId}/daily-sweep, POST /audit-sessions, POST /audit-sessions/{sessionId}/*, POST /discrepancies/{discrepancyId}/*, POST /custodians/{custodianId}/suspend, POST /_clock/set_current_utc"

  - priority: 9
    category: business_safety
    check: "The room's posture is not RESTRICTED for movement-sensitive operations"
    error_id: ERR_ROOM_RESTRICTED
    http_status: 409
    applies_to: "POST /custody-transfers, POST /custody-transfers/{transferId}/release, POST /disposition-orders/{orderId}/execute"

  - priority: 10
    category: state
    check: "expected_evidence_item_version equals EvidenceItem.version / expected_storage_location_version equals StorageLocation.version"
    error_id: "ERR_STALE_EVIDENCE_ITEM_VERSION | ERR_STALE_STORAGE_LOCATION_VERSION"
    http_status: 412
    applies_to: "POST /retention-determinations, POST /audit-sessions"

  - priority: 11
    category: state
    check: "The target resource is in a state that permits the requested transition, per §1.2; a sealed source or destination location blocks storage assignment, release and return. One deliberate carve-out: on POST /disposition-orders an item whose disposition_state is RETAINED or COURT_HOLD is NOT reported here — that case is reported by the domain checks at priorities 23, 24 and 25, so this priority only reports the remaining illegal disposition states ORDER_PENDING and DISPOSED (ERR_ITEM_DISPOSITION_STATE_INVALID)"
    error_id: "ERR_ITEM_CUSTODY_STATE_INVALID | ERR_ITEM_DISPOSITION_STATE_INVALID | ERR_CASE_STATE_INVALID | ERR_TRANSFER_STATE_INVALID | ERR_ORDER_STATE_INVALID | ERR_CLAIM_STATE_INVALID | ERR_AUDIT_STATE_INVALID | ERR_DISCREPANCY_STATE_INVALID | ERR_LOCATION_SEALED"
    http_status: 409
    applies_to: "all state-transition endpoints, with the POST /disposition-orders carve-out named in the check"

  - priority: 12
    category: business_constraint
    check: "Every Custodian referenced as an actor, holder, auditor, executor or witness has status == ACTIVE"
    error_id: ERR_CUSTODIAN_SUSPENDED
    http_status: 409
    applies_to: "POST /custody-transfers, POST /custody-transfers/{transferId}/release, POST /custody-transfers/{transferId}/return, POST /disposition-orders, POST /disposition-orders/{orderId}/execute, POST /audit-sessions"

  - priority: 13
    category: business_constraint
    check: "Every Custodian referenced as an actor, holder, executor or witness has certification_expires_at strictly after the logical clock"
    error_id: ERR_CUSTODIAN_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /custody-transfers, POST /custody-transfers/{transferId}/release, POST /disposition-orders/{orderId}/execute"

  - priority: 14
    category: business_constraint
    check: "Segregation of duties at execution: executed_by_custodian_id != DispositionOrder.requested_by_custodian_id and witness_custodian_id != executed_by_custodian_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /disposition-orders/{orderId}/execute"

  - priority: 15
    category: business_constraint
    check: "Scoped uniqueness: agency_code across PropertyRoom, offense_code across OffenseStatute, code per room for StorageLocation, badge_number per room for Custodian, case_number per room for Case"
    error_id: "ERR_DUPLICATE_AGENCY_CODE | ERR_DUPLICATE_OFFENSE_CODE | ERR_DUPLICATE_LOCATION_CODE | ERR_DUPLICATE_BADGE_NUMBER | ERR_DUPLICATE_CASE_NUMBER"
    http_status: 409
    applies_to: "POST /property-rooms, POST /offense-statutes, POST /storage-locations, POST /custodians, POST /cases"

  - priority: 16
    category: business_constraint
    check: "Packaging standard: packaging_type is permitted for the item's category — BIOLOGICAL {SHARPS_TUBE, RIGID_BOX}; CURRENCY {SEALED_ENVELOPE}; FIREARM {RIGID_BOX, CHAIN_TAG_ONLY}; NARCOTICS {SEALED_ENVELOPE, RIGID_BOX}; OVERSIZED {PALLET_WRAP, CHAIN_TAG_ONLY}; GENERAL any type except SHARPS_TUBE"
    error_id: ERR_PACKAGING_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /evidence-items"

  - priority: 17
    category: business_constraint
    check: "Storage suitability: the target location's category equals the item's required_storage_category, and a REFRIGERATED location's temperature_c is <= 4.0"
    error_id: "ERR_STORAGE_CATEGORY_MISMATCH | ERR_REFRIGERATION_OUT_OF_RANGE"
    http_status: 409
    applies_to: "POST /evidence-items/{itemId}/storage-assignment, POST /discrepancies/{discrepancyId}/resolve"

  - priority: 18
    category: business_constraint
    check: "Signature capture: witness_signature is present when the item's StorageLocation.requires_dual_signature is true"
    error_id: ERR_WITNESS_SIGNATURE_REQUIRED
    http_status: 422
    applies_to: "POST /custody-transfers/{transferId}/release"

  - priority: 19
    category: business_constraint
    check: "Escort capacity: calculations.escort_concurrency_load for the receiving custodian is below MAX_CONCURRENT_ESCORTS (closed-interval overlap, aggregate limit 2)"
    error_id: ERR_ESCORT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /custody-transfers"

  - priority: 20
    category: business_temporal
    check: "Window sanity and duration: due_back_at is strictly after released_at, and the window does not exceed calculations.transfer_window_limit for the purpose"
    error_id: "ERR_INVALID_TRANSFER_WINDOW | ERR_TRANSFER_WINDOW_TOO_LONG"
    http_status: 422
    applies_to: "POST /custody-transfers"

  - priority: 21
    category: business_temporal
    check: "Item custody window overlap per calculations.item_custody_window_conflict (half-open, adjacency permitted). Deliberately ordered BELOW the certification check at priority 13, so an uncertified custodian is reported even when the requested window also collides"
    error_id: ERR_CUSTODY_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /custody-transfers"

  - priority: 22
    category: business_temporal
    check: "Audit window buffer per calculations.audit_window_buffer_conflict (48-hour inflation on both sides of every non-CLOSED session on the location); scheduled_end_at must also be strictly after scheduled_start_at"
    error_id: ERR_AUDIT_WINDOW_BUFFER
    http_status: 409
    applies_to: "POST /audit-sessions"

  - priority: 23
    category: business_referential
    check: "Preservation class permits the pathway: a DESTRUCTION order is refused when the case's OffenseStatute.preservation_class is BIOLOGICAL_INDEFINITE or HOMICIDE_PERMANENT"
    error_id: ERR_PRESERVATION_CLASS_FORBIDS_DESTRUCTION
    http_status: 409
    applies_to: "POST /disposition-orders"

  - priority: 24
    category: business_referential
    check: "Case disposability: the case's status is ADJUDICATED or CLOSED, unless the item has is_found_property == true and disposition_state == UNCLAIMED_ELIGIBLE"
    error_id: ERR_CASE_NOT_DISPOSABLE
    http_status: 409
    applies_to: "POST /disposition-orders"

  - priority: 25
    category: business_referential
    check: "Retention maturity: an item whose disposition_state is RETAINED is refused because retention_release_at is null or still in the future"
    error_id: ERR_RETENTION_NOT_MATURED
    http_status: 409
    applies_to: "POST /disposition-orders"

  - priority: 26
    category: business_referential
    check: "Owner claim verification: a RETURN_TO_OWNER order's OwnerClaim has status == VERIFIED at execution time"
    error_id: ERR_CLAIM_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /disposition-orders/{orderId}/execute"

  - priority: 27
    category: business_referential
    check: "Barcode ownership: a scanned barcode's item belongs to a Case of the same PropertyRoom as the audited location"
    error_id: ERR_BARCODE_FOREIGN_ROOM
    http_status: 409
    applies_to: "POST /audit-sessions/{sessionId}/scan"

  - priority: 28
    category: business_referential
    check: "Case closure completeness: Case.undisposed_item_count == 0"
    error_id: ERR_CASE_HAS_UNDISPOSED_ITEMS
    http_status: 409
    applies_to: "POST /cases/{caseId}/close"

  - priority: 29
    category: business_referential
    check: "Resolution kind compatibility: resolution == WRITTEN_OFF is permitted only for a MISSING discrepancy"
    error_id: ERR_DISCREPANCY_RESOLUTION_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /discrepancies/{discrepancyId}/resolve"

  - priority: 30
    category: business_fiscal
    check: "Auction reserve floor: gross_sale_cents >= DispositionOrder.reserve_price_cents. Deliberately ordered ABOVE the settlement-window check at priority 32, so a below-reserve sale is reported even when the settlement window has also closed"
    error_id: ERR_SALE_BELOW_RESERVE
    http_status: 409
    applies_to: "POST /disposition-orders/{orderId}/settle"

  - priority: 31
    category: business_fiscal
    check: "Disbursement requires held proceeds: settlement_status == HELD"
    error_id: ERR_NO_PROCEEDS_HELD
    http_status: 409
    applies_to: "POST /disposition-orders/{orderId}/disburse"

  - priority: 32
    category: business_temporal
    check: "Settlement window: the logical clock is at or before DispositionOrder.settlement_deadline_at"
    error_id: ERR_SETTLEMENT_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /disposition-orders/{orderId}/settle"

  - priority: 33
    category: business_fiscal
    check: "Storage capacity: the chosen location has occupied_slots < capacity_slots; when storage_location_id is omitted, calculations.storage_location_autoselect must yield a non-empty eligible pool"
    error_id: "ERR_STORAGE_LOCATION_FULL | ERR_NO_ELIGIBLE_STORAGE"
    http_status: 409
    applies_to: "POST /evidence-items/{itemId}/storage-assignment, POST /discrepancies/{discrepancyId}/resolve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- test-driving clock ---------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock, which every deadline, retention, overlap and sweep rule reads. Before any call the clock reads exactly 2026-08-01T00:00:00Z; it never falls back to wall-clock time."
    roles: [PropertyRoomManager]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime, previous_utc: datetime }
    side_effects: ["no entity mutations; subsequent requests observe the new logical now"]

  # --- PropertyRoom ---------------------------------------------------------
  - method: POST
    path: "/property-rooms"
    description: "Registers a property and evidence unit"
    roles: [PropertyRoomManager]
    code: 201
    input: [name, agency_code]
    output: PropertyRoom
    side_effects: ["posture initialised to OPEN; all counters and escrow_balance_cents initialised to 0"]

  - method: GET
    path: "/property-rooms/{roomId}"
    description: "Reads a property room with its derived posture, counters and escrow balance"
    roles: [PropertyRoomManager, EvidenceTechnician, Investigator, LabAnalyst, CourtClerk, InternalAuditor]
    code: 200
    input: []
    output: PropertyRoom
    side_effects: []

  - method: POST
    path: "/property-rooms/{roomId}/daily-sweep"
    description: "Runs the nightly reconciliation for one room: step 1 flags overdue transfers, step 2 expires owner notices and marks items UNCLAIMED_ELIGIBLE, step 3 marks matured items DISPOSAL_ELIGIBLE, step 4 recomputes every derived counter, the escrow balance and the posture. Steps run in this order and each step processes rows ordered by created_at ASC."
    roles: [PropertyRoomManager]
    code: 200
    input: []
    output: PropertyRoom
    side_effects:
      - "CustodyTransfer RELEASED -> OVERDUE when due_back_at <= now"
      - "OwnerClaim NOTICE_SENT -> EXPIRED when claim_deadline_at <= now, and its item RETAINED -> UNCLAIMED_ELIGIBLE"
      - "EvidenceItem RETAINED -> DISPOSAL_ELIGIBLE when custody_state == STORED and retention_release_at <= now"
      - "recomputes open_discrepancy_count, missing_high_risk_count, sealed_location_count, disposal_eligible_count, escrow_balance_cents, posture; sets last_sweep_at = now"

  # --- OffenseStatute -------------------------------------------------------
  - method: POST
    path: "/offense-statutes"
    description: "Registers an offense statute with its retention and preservation parameters"
    roles: [PropertyRoomManager]
    code: 201
    input: [offense_code, description, preservation_class, statutory_retention_days, appeal_window_days, destruction_requires_court_order]
    output: OffenseStatute
    side_effects: []

  - method: GET
    path: "/offense-statutes/{statuteId}"
    description: "Reads an offense statute"
    roles: [PropertyRoomManager, EvidenceTechnician, Investigator, CourtClerk, InternalAuditor]
    code: 200
    input: []
    output: OffenseStatute
    side_effects: []

  # --- StorageLocation ------------------------------------------------------
  - method: POST
    path: "/storage-locations"
    description: "Creates a storage location (bin, shelf, vault, refrigerator or yard slot) in a room"
    roles: [PropertyRoomManager]
    code: 201
    input: [property_room_id, code, category, capacity_slots, "temperature_c?", "requires_dual_signature?"]
    output: StorageLocation
    side_effects: ["occupied_slots initialised to 0; status initialised to OPEN"]

  - method: GET
    path: "/storage-locations/{locationId}"
    description: "Reads a storage location with its derived occupancy and seal state"
    roles: [PropertyRoomManager, EvidenceTechnician, InternalAuditor]
    code: 200
    input: []
    output: StorageLocation
    side_effects: []

  - method: GET
    path: "/storage-locations"
    description: "Lists storage locations, filterable by room, category, status or sealing session"
    roles: [PropertyRoomManager, EvidenceTechnician, InternalAuditor]
    code: 200
    input: ["property_room_id?", "category?", "status?", "sealed_by_audit_session_id?", "limit?", "offset?"]
    output: StorageLocation[]
    side_effects: []

  # --- Custodian ------------------------------------------------------------
  - method: POST
    path: "/custodians"
    description: "Registers a custodian (evidence technician, investigator, lab analyst or auditor)"
    roles: [PropertyRoomManager]
    code: 201
    input: [property_room_id, badge_number, full_name, role_type, certification_expires_at]
    output: Custodian
    side_effects: ["status initialised to ACTIVE; open_escort_count initialised to 0"]

  - method: GET
    path: "/custodians/{custodianId}"
    description: "Reads a custodian with the derived open escort count"
    roles: [PropertyRoomManager, EvidenceTechnician, Investigator, LabAnalyst, InternalAuditor]
    code: 200
    input: []
    output: Custodian
    side_effects: []

  - method: GET
    path: "/custodians"
    description: "Lists custodians, filterable by room, functional role or status"
    roles: [PropertyRoomManager, EvidenceTechnician, Investigator, LabAnalyst, InternalAuditor]
    code: 200
    input: ["property_room_id?", "role_type?", "status?", "limit?", "offset?"]
    output: Custodian[]
    side_effects: []

  - method: POST
    path: "/custodians/{custodianId}/suspend"
    description: "Suspends a custodian, making them ineligible to hold, execute or witness"
    roles: [PropertyRoomManager]
    code: 200
    input: [reason]
    output: Custodian
    side_effects: ["status ACTIVE -> SUSPENDED; suspension_reason recorded; open transfers are left untouched"]

  # --- Case -----------------------------------------------------------------
  - method: POST
    path: "/cases"
    description: "Opens a case that evidence will be logged against"
    roles: [PropertyRoomManager, EvidenceTechnician]
    code: 201
    input: [property_room_id, case_number, offense_statute_id]
    output: Case
    side_effects: ["status initialised to OPEN; item_count and undisposed_item_count initialised to 0"]

  - method: GET
    path: "/cases/{caseId}"
    description: "Reads a case with its derived item counters"
    roles: [PropertyRoomManager, EvidenceTechnician, Investigator, CourtClerk, InternalAuditor]
    code: 200
    input: []
    output: Case
    side_effects: []

  - method: GET
    path: "/cases"
    description: "Lists cases, filterable by room, statute or status"
    roles: [PropertyRoomManager, EvidenceTechnician, Investigator, CourtClerk, InternalAuditor]
    code: 200
    input: ["property_room_id?", "offense_statute_id?", "status?", "limit?", "offset?"]
    output: Case[]
    side_effects: []

  - method: POST
    path: "/cases/{caseId}/charge"
    description: "Records that charges were filed"
    roles: [Investigator, PropertyRoomManager]
    code: 200
    input: []
    output: Case
    side_effects: ["status OPEN -> CHARGED; charged_at = now"]

  - method: POST
    path: "/cases/{caseId}/adjudicate"
    description: "Records adjudication and re-determines retention for every item of the case (FINAL variant)"
    roles: [CourtClerk, PropertyRoomManager]
    code: 200
    input: []
    output: Case
    side_effects:
      - "status CHARGED -> ADJUDICATED; adjudicated_at = now"
      - "for each EvidenceItem ordered by created_at ASC: creates RetentionDetermination(basis=FINAL), marks the prior determination superseded, rewrites retention_release_at and retention_basis, appends ChainEvent(RETENTION_SET), increments EvidenceItem.version by 1"
      - "each item whose new retention_release_at <= now and custody_state == STORED transitions RETAINED -> DISPOSAL_ELIGIBLE"
      - "PropertyRoom.disposal_eligible_count and posture recomputed as a consequence of those transitions"

  - method: POST
    path: "/cases/{caseId}/appeal"
    description: "Opens an appeal, placing every non-disposed item of the case under court hold"
    roles: [CourtClerk]
    code: 200
    input: []
    output: Case
    side_effects:
      - "status ADJUDICATED -> APPEAL_PENDING; appeal_opened_at = now"
      - "every non-DISPOSED item -> COURT_HOLD with retention_release_at = null and retention_basis = COURT_HOLD"
      - "a RetentionDetermination(resolved_basis=COURT_HOLD) is written per item and the prior one superseded"
      - "PropertyRoom.disposal_eligible_count recomputed"

  - method: POST
    path: "/cases/{caseId}/resolve-appeal"
    description: "Closes the appeal and re-adjudicates, re-anchoring the FINAL retention variant on the new adjudication instant"
    roles: [CourtClerk]
    code: 200
    input: []
    output: Case
    side_effects:
      - "status APPEAL_PENDING -> ADJUDICATED; adjudicated_at = now; appeal_opened_at cleared"
      - "every non-DISPOSED item leaves COURT_HOLD and receives a new FINAL RetentionDetermination against the new anchor"
      - "items whose new retention_release_at <= now and custody_state == STORED continue to DISPOSAL_ELIGIBLE"

  - method: POST
    path: "/cases/{caseId}/close"
    description: "Closes a fully disposed case"
    roles: [PropertyRoomManager]
    code: 200
    input: []
    output: Case
    side_effects: ["status ADJUDICATED -> CLOSED; closed_at = now"]

  # --- EvidenceItem ---------------------------------------------------------
  - method: POST
    path: "/evidence-items"
    description: "Logs an item into the property room: assigns the barcode, documents intake in the chain of custody and fixes a preliminary retention determination"
    roles: [EvidenceTechnician]
    code: 201
    input: [case_id, item_description, category, packaging_type, appraised_value_cents, seized_at, "is_found_property?"]
    output: EvidenceItem
    side_effects:
      - "assigns item_sequence and barcode per calculations.barcode_assignment; sets intake_at = now"
      - "computes required_storage_category; custody_state = LOGGED; disposition_state = RETAINED"
      - "creates RetentionDetermination(basis=PRELIMINARY) and sets retention_release_at / retention_basis"
      - "appends ChainEvent(event_type=INTAKE, sequence_no=1)"
      - "increments Case.item_count and Case.undisposed_item_count and Case.version by 1"

  - method: GET
    path: "/evidence-items/{itemId}"
    description: "Reads an evidence item with both state dimensions, its barcode and its retention posture"
    roles: [PropertyRoomManager, EvidenceTechnician, Investigator, LabAnalyst, CourtClerk, InternalAuditor]
    code: 200
    input: []
    output: EvidenceItem
    side_effects: []

  - method: GET
    path: "/evidence-items"
    description: "Lists evidence items, filterable by case, location, current holder or either state dimension"
    roles: [PropertyRoomManager, EvidenceTechnician, Investigator, LabAnalyst, CourtClerk, InternalAuditor]
    code: 200
    input: ["case_id?", "storage_location_id?", "current_holder_id?", "custody_state?", "disposition_state?", "limit?", "offset?"]
    output: EvidenceItem[]
    side_effects: []

  - method: POST
    path: "/evidence-items/{itemId}/storage-assignment"
    description: "Assigns an item to a storage bin. Omitting storage_location_id runs calculations.storage_location_autoselect (tightest fit)."
    roles: [EvidenceTechnician]
    code: 200
    input: ["storage_location_id?"]
    output: EvidenceItem
    side_effects:
      - "custody_state LOGGED -> STORED; storage_location_id set"
      - "increments StorageLocation.occupied_slots by 1 and StorageLocation.version by 1"
      - "appends ChainEvent(event_type=STORAGE_ASSIGN)"
      - "recomputes PropertyRoom.posture"

  # --- RetentionDetermination ----------------------------------------------
  - method: POST
    path: "/retention-determinations"
    description: "Records a retention determination for an item, superseding the prior one. Guarded by OCC on the item's version (concurrency_rules[retention-determination-create-stale-item])."
    roles: [EvidenceTechnician, PropertyRoomManager]
    code: 201
    input: [evidence_item_id, basis, expected_evidence_item_version]
    output: RetentionDetermination
    side_effects:
      - "computes resolved_basis, anchor_at, statute_days_applied and computed_release_at per calculations.retention_release_at"
      - "marks the previous determination for the item superseded = true"
      - "rewrites EvidenceItem.retention_release_at and retention_basis"
      - "appends ChainEvent(event_type=RETENTION_SET)"
      - "increments EvidenceItem.version by 1"

  - method: GET
    path: "/retention-determinations/{determinationId}"
    description: "Reads a retention determination including the anchor and the days applied"
    roles: [PropertyRoomManager, EvidenceTechnician, CourtClerk, InternalAuditor]
    code: 200
    input: []
    output: RetentionDetermination
    side_effects: []

  - method: GET
    path: "/retention-determinations"
    description: "Lists retention determinations, filterable by item, requested basis or supersession"
    roles: [PropertyRoomManager, EvidenceTechnician, CourtClerk, InternalAuditor]
    code: 200
    input: ["evidence_item_id?", "basis?", "superseded?", "limit?", "offset?"]
    output: RetentionDetermination[]
    side_effects: []

  # --- CustodyTransfer ------------------------------------------------------
  - method: POST
    path: "/custody-transfers"
    description: "Requests a chain of custody transfer for laboratory analysis, court presentation or investigative review"
    roles: [Investigator, LabAnalyst, EvidenceTechnician]
    code: 201
    input: [evidence_item_id, to_custodian_id, purpose, released_at, due_back_at]
    output: CustodyTransfer
    side_effects:
      - "status initialised to REQUESTED"
      - "increments Custodian.open_escort_count for to_custodian_id and EvidenceItem.open_transfer_count"

  - method: GET
    path: "/custody-transfers/{transferId}"
    description: "Reads a custody transfer with its captured signatures and window"
    roles: [PropertyRoomManager, EvidenceTechnician, Investigator, LabAnalyst, CourtClerk, InternalAuditor]
    code: 200
    input: []
    output: CustodyTransfer
    side_effects: []

  - method: GET
    path: "/custody-transfers"
    description: "Lists custody transfers, filterable by item, releasing or receiving custodian, or status"
    roles: [PropertyRoomManager, EvidenceTechnician, Investigator, LabAnalyst, CourtClerk, InternalAuditor]
    code: 200
    input: ["evidence_item_id?", "from_custodian_id?", "to_custodian_id?", "status?", "limit?", "offset?"]
    output: CustodyTransfer[]
    side_effects: []

  - method: POST
    path: "/custody-transfers/{transferId}/release"
    description: "Releases the item into the receiving custodian's custody with signature capture"
    roles: [EvidenceTechnician]
    code: 200
    input: [released_signature, "witness_signature?"]
    output: CustodyTransfer
    side_effects:
      - "status REQUESTED -> RELEASED; from_custodian_id = acting custodian; signatures stored"
      - "EvidenceItem custody_state STORED -> CHECKED_OUT; current_holder_id = to_custodian_id"
      - "appends ChainEvent(event_type=RELEASE, signature_ref=released_signature)"

  - method: POST
    path: "/custody-transfers/{transferId}/return"
    description: "Receives the item back into the property room with receipt signature capture"
    roles: [EvidenceTechnician]
    code: 200
    input: [receipt_signature]
    output: CustodyTransfer
    side_effects:
      - "status RELEASED|OVERDUE -> RETURNED; returned_at = now, closing the custody interval"
      - "EvidenceItem custody_state CHECKED_OUT -> STORED; current_holder_id cleared"
      - "appends ChainEvent(event_type=RECEIPT, signature_ref=receipt_signature)"
      - "decrements Custodian.open_escort_count and EvidenceItem.open_transfer_count"

  - method: POST
    path: "/custody-transfers/{transferId}/report-lost"
    description: "Reports an item lost while out of the room, raising a standalone missing-item discrepancy"
    roles: [PropertyRoomManager]
    code: 200
    input: [reason]
    output: CustodyTransfer
    side_effects:
      - "status RELEASED|OVERDUE -> LOST; denial_reason = reason"
      - "EvidenceItem custody_state CHECKED_OUT -> MISSING; current_holder_id cleared"
      - "creates Discrepancy(kind=MISSING, audit_session_id=null, status=OPEN)"
      - "decrements StorageLocation.occupied_slots by 1"
      - "increments PropertyRoom.open_discrepancy_count and missing_high_risk_count where applicable, then recomputes posture"
      - "appends ChainEvent(event_type=DISCREPANCY_RAISED)"

  # --- DispositionOrder -----------------------------------------------------
  - method: POST
    path: "/disposition-orders"
    description: "Opens a disposition order (return to owner, auction, destruction or conversion). Auto-authorizes low-value destructions per calculations.auto_authorization_predicate, otherwise waits for court authorization."
    roles: [EvidenceTechnician, PropertyRoomManager]
    code: 201
    input: [evidence_item_id, type, requested_by_custodian_id, "owner_claim_id?", "reserve_price_cents?"]
    output: DispositionOrder
    side_effects:
      - "status initialised to PENDING_COURT_AUTH, then auto-transitioned to AUTHORIZED with auto_authorized = true when the predicate holds"
      - "computes estimated_net_proceeds_cents (ESTIMATED variant of calculations.disposition_proceeds)"
      - "EvidenceItem disposition_state DISPOSAL_ELIGIBLE|UNCLAIMED_ELIGIBLE -> ORDER_PENDING"

  - method: GET
    path: "/disposition-orders/{orderId}"
    description: "Reads a disposition order with both proceeds variants and the escrow posture"
    roles: [PropertyRoomManager, EvidenceTechnician, CourtClerk, InternalAuditor]
    code: 200
    input: []
    output: DispositionOrder
    side_effects: []

  - method: GET
    path: "/disposition-orders"
    description: "Lists disposition orders, filterable by item, claim, requester, executor, witness, status or type"
    roles: [PropertyRoomManager, EvidenceTechnician, CourtClerk, InternalAuditor]
    code: 200
    input: ["evidence_item_id?", "owner_claim_id?", "requested_by_custodian_id?", "executed_by_custodian_id?", "witness_custodian_id?", "status?", "type?", "limit?", "offset?"]
    output: DispositionOrder[]
    side_effects: []

  - method: POST
    path: "/disposition-orders/{orderId}/authorize"
    description: "Records court authorization for a pending disposition order"
    roles: [CourtClerk]
    code: 200
    input: [court_order_number]
    output: DispositionOrder
    side_effects: ["status PENDING_COURT_AUTH -> AUTHORIZED; authorized_at = now; court_order_number stored"]

  - method: POST
    path: "/disposition-orders/{orderId}/reject"
    description: "Records that the court refused the disposition, returning the item to retention"
    roles: [CourtClerk]
    code: 200
    input: [reason]
    output: DispositionOrder
    side_effects:
      - "status PENDING_COURT_AUTH -> REJECTED"
      - "EvidenceItem disposition_state ORDER_PENDING -> RETAINED"
      - "decrements PropertyRoom.disposal_eligible_count and recomputes posture"

  - method: POST
    path: "/disposition-orders/{orderId}/execute"
    description: "Executes the authorized disposition under segregation of duties (the requester may not execute, the executor may not witness)"
    roles: [PropertyRoomManager]
    code: 200
    input: [executed_by_custodian_id, witness_custodian_id]
    output: DispositionOrder
    side_effects:
      - "status AUTHORIZED -> EXECUTED; executed_at = now; for AUCTION also settlement_deadline_at = executed_at + 30 days"
      - "EvidenceItem custody_state -> PURGED and disposition_state -> DISPOSED"
      - "decrements StorageLocation.occupied_slots by 1 and PropertyRoom.disposal_eligible_count"
      - "decrements Case.undisposed_item_count"
      - "when type == RETURN_TO_OWNER: OwnerClaim VERIFIED -> RELEASED"
      - "when type != AUCTION: auto-transitions EXECUTED -> SETTLED with settled_net_proceeds_cents = 0 and settlement_status = NONE"
      - "appends ChainEvent(event_type=DISPOSITION_EXECUTED)"

  - method: POST
    path: "/disposition-orders/{orderId}/settle"
    description: "Settles an executed auction from the hammer price, computing the SETTLED proceeds variant and holding the net in room escrow"
    roles: [PropertyRoomManager]
    code: 200
    input: [gross_sale_cents]
    output: DispositionOrder
    side_effects:
      - "status EXECUTED -> SETTLED; settled_at = now"
      - "computes commission_cents, storage_recovery_cents and settled_net_proceeds_cents (SETTLED variant)"
      - "settlement_status = HELD; increments PropertyRoom.escrow_balance_cents by settled_net_proceeds_cents"

  - method: POST
    path: "/disposition-orders/{orderId}/disburse"
    description: "Disburses held auction proceeds to the treasury, releasing them from room escrow"
    roles: [PropertyRoomManager]
    code: 200
    input: [payee_reference]
    output: DispositionOrder
    side_effects:
      - "status SETTLED -> DISBURSED; settlement_status = DISBURSED; payee_reference stored"
      - "decrements PropertyRoom.escrow_balance_cents by settled_net_proceeds_cents, restoring calculations.room_escrow_balance"

  # --- OwnerClaim -----------------------------------------------------------
  - method: POST
    path: "/owner-claims"
    description: "Issues an owner notification for a seized or found item and opens the claim window"
    roles: [EvidenceTechnician]
    code: 201
    input: [evidence_item_id, claimant_name, claimant_contact, notice_method]
    output: OwnerClaim
    side_effects:
      - "status initialised to NOTICE_SENT; notified_at = now"
      - "computes claim_deadline_at per calculations.owner_claim_deadline"
      - "appends ChainEvent(event_type=NOTICE_SENT)"

  - method: GET
    path: "/owner-claims/{claimId}"
    description: "Reads an owner claim with its computed deadline"
    roles: [PropertyRoomManager, EvidenceTechnician, InternalAuditor]
    code: 200
    input: []
    output: OwnerClaim
    side_effects: []

  - method: GET
    path: "/owner-claims"
    description: "Lists owner claims, filterable by item or status"
    roles: [PropertyRoomManager, EvidenceTechnician, InternalAuditor]
    code: 200
    input: ["evidence_item_id?", "status?", "limit?", "offset?"]
    output: OwnerClaim[]
    side_effects: []

  - method: POST
    path: "/owner-claims/{claimId}/file"
    description: "Records that the noticed owner filed a claim with proof of ownership"
    roles: [EvidenceTechnician]
    code: 200
    input: [proof_document_ref]
    output: OwnerClaim
    side_effects: ["status NOTICE_SENT -> CLAIM_FILED; proof_document_ref stored"]

  - method: POST
    path: "/owner-claims/{claimId}/verify"
    description: "Verifies the filed claim, unlocking a return-to-owner disposition"
    roles: [PropertyRoomManager]
    code: 200
    input: []
    output: OwnerClaim
    side_effects: ["status CLAIM_FILED -> VERIFIED; verified_at = now"]

  # --- AuditSession ---------------------------------------------------------
  - method: POST
    path: "/audit-sessions"
    description: "Schedules a periodic inventory audit of one storage location. Guarded by OCC on the location's version (concurrency_rules[audit-session-create-stale-location])."
    roles: [InternalAuditor]
    code: 201
    input: [storage_location_id, auditor_id, scheduled_start_at, scheduled_end_at, expected_storage_location_version]
    output: AuditSession
    side_effects:
      - "status initialised to SCHEDULED; risk_index initialised to 0.00"
      - "increments StorageLocation.version by 1"

  - method: GET
    path: "/audit-sessions/{sessionId}"
    description: "Reads an audit session with its expected/scanned snapshots and risk index"
    roles: [PropertyRoomManager, InternalAuditor, EvidenceTechnician]
    code: 200
    input: []
    output: AuditSession
    side_effects: []

  - method: GET
    path: "/audit-sessions"
    description: "Lists audit sessions, filterable by location, auditor or status"
    roles: [PropertyRoomManager, InternalAuditor, EvidenceTechnician]
    code: 200
    input: ["storage_location_id?", "auditor_id?", "status?", "limit?", "offset?"]
    output: AuditSession[]
    side_effects: []

  - method: POST
    path: "/audit-sessions/{sessionId}/start"
    description: "Starts the audit, sealing the location and snapshotting the expected inventory"
    roles: [InternalAuditor]
    code: 200
    input: []
    output: AuditSession
    side_effects:
      - "status SCHEDULED -> IN_PROGRESS; started_at = now"
      - "snapshots expected_evidence_item_ids (STORED items of the location, created_at ASC) and expected_item_count"
      - "StorageLocation OPEN -> SEALED_FOR_AUDIT with sealed_by_audit_session_id; increments StorageLocation.version by 1"
      - "increments PropertyRoom.sealed_location_count and recomputes posture"

  - method: POST
    path: "/audit-sessions/{sessionId}/scan"
    description: "Records a barcode scan during the audit; an item whose assigned location differs from the audited one immediately raises a MISPLACED discrepancy"
    roles: [InternalAuditor]
    code: 200
    input: [barcode]
    output: AuditSession
    side_effects:
      - "appends the item id to scanned_evidence_item_ids and increments scanned_item_count"
      - "appends ChainEvent(event_type=AUDIT_SCAN)"
      - "when the item's storage_location_id != the audited location: creates Discrepancy(kind=MISPLACED, status=OPEN), increments PropertyRoom.open_discrepancy_count and recomputes posture"

  - method: POST
    path: "/audit-sessions/{sessionId}/reconcile"
    description: "Reconciles the audit: raises a MISSING discrepancy for every expected item that was not scanned, then computes the weighted risk index"
    roles: [InternalAuditor]
    code: 200
    input: []
    output: AuditSession
    side_effects:
      - "status IN_PROGRESS -> RECONCILED; reconciled_at = now"
      - "creates Discrepancy(kind=MISSING) for each expected id absent from scanned_evidence_item_ids whose item is still STORED, ordered by EvidenceItem.created_at ASC"
      - "each new MISSING discrepancy drives its EvidenceItem STORED -> MISSING, which decrements StorageLocation.occupied_slots and increments PropertyRoom.open_discrepancy_count / missing_high_risk_count"
      - "computes Discrepancy.weight_contribution and AuditSession.risk_index per calculations.audit_risk_index"
      - "recomputes PropertyRoom.posture; if it becomes LOCKED_DOWN every REQUESTED CustodyTransfer in the room is DENIED"

  - method: POST
    path: "/audit-sessions/{sessionId}/close"
    description: "Closes the audit and releases the seal; refused while any of the session's discrepancies remains open"
    roles: [InternalAuditor, PropertyRoomManager]
    code: 200
    input: []
    output: AuditSession
    side_effects:
      - "status IN_PROGRESS|RECONCILED -> CLOSED; closed_at = now"
      - "StorageLocation SEALED_FOR_AUDIT -> OPEN; sealed_by_audit_session_id cleared; increments StorageLocation.version by 1"
      - "decrements PropertyRoom.sealed_location_count and recomputes posture"

  # --- Discrepancy ----------------------------------------------------------
  - method: GET
    path: "/discrepancies/{discrepancyId}"
    description: "Reads a discrepancy with its rounded risk contribution"
    roles: [PropertyRoomManager, InternalAuditor, EvidenceTechnician]
    code: 200
    input: []
    output: Discrepancy
    side_effects: []

  - method: GET
    path: "/discrepancies"
    description: "Lists discrepancies, filterable by session, item, kind or status; the only discovery channel for cascade-created rows"
    roles: [PropertyRoomManager, InternalAuditor, EvidenceTechnician]
    code: 200
    input: ["audit_session_id?", "evidence_item_id?", "kind?", "status?", "limit?", "offset?"]
    output: Discrepancy[]
    side_effects: []

  - method: POST
    path: "/discrepancies/{discrepancyId}/investigate"
    description: "Opens an investigation into a discrepancy"
    roles: [PropertyRoomManager]
    code: 200
    input: []
    output: Discrepancy
    side_effects: ["status OPEN -> UNDER_INVESTIGATION; counters unchanged because UNDER_INVESTIGATION stays inside the open set"]

  - method: POST
    path: "/discrepancies/{discrepancyId}/resolve"
    description: "Resolves a discrepancy as FOUND (item recovered or relocated) or WRITTEN_OFF (loss accepted, MISSING only)"
    roles: [PropertyRoomManager]
    code: 200
    input: [resolution, resolution_note]
    output: Discrepancy
    side_effects:
      - "status -> RESOLVED_FOUND or RESOLVED_WRITTEN_OFF; resolved_at = now; resolution_note stored"
      - "FOUND on a MISSING discrepancy: EvidenceItem MISSING -> STORED and StorageLocation.occupied_slots incremented, restoring calculations.location_occupied_slots"
      - "FOUND on a MISPLACED discrepancy: the item moves to the audited location; the old location's occupied_slots decremented and the new location's incremented"
      - "WRITTEN_OFF: EvidenceItem MISSING -> PURGED with disposition_state = DISPOSED; Case.undisposed_item_count decremented"
      - "decrements PropertyRoom.open_discrepancy_count and missing_high_risk_count where applicable, re-derives the session's risk_index, then recomputes posture"

  # --- ChainEvent -----------------------------------------------------------
  - method: GET
    path: "/chain-events/{eventId}"
    description: "Reads one chain of custody entry"
    roles: [PropertyRoomManager, EvidenceTechnician, Investigator, LabAnalyst, CourtClerk, InternalAuditor]
    code: 200
    input: []
    output: ChainEvent
    side_effects: []

  - method: GET
    path: "/chain-events"
    description: "Lists chain of custody entries, filterable by item, acting custodian or event type; the chain of custody document for an item is this list ordered by sequence_no"
    roles: [PropertyRoomManager, EvidenceTechnician, Investigator, LabAnalyst, CourtClerk, InternalAuditor]
    code: 200
    input: ["evidence_item_id?", "actor_custodian_id?", "event_type?", "limit?", "offset?"]
    output: ChainEvent[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_USER_CONTEXT
    http: 400
    condition: "X-User-Role or X-User-ID header absent or empty"
  - id: ERR_INVALID_ROLE
    http: 401
    condition: "X-User-Role is not one of the six declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_CUSTODIAN_ROLE_MISMATCH
    http: 403
    condition: "X-User-ID is not a Custodian whose role_type matches the acting entity_backed role, or a body field that must equal X-User-ID (auditor_id, requested_by_custodian_id) does not"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, unknown enum value, or an unsatisfied conditional requirement (temperature_c, reserve_price_cents, owner_claim_id)"
  - id: ERR_PROPERTY_ROOM_NOT_FOUND
    http: 404
    condition: "roomId or property_room_id does not resolve"
  - id: ERR_OFFENSE_STATUTE_NOT_FOUND
    http: 404
    condition: "statuteId or offense_statute_id does not resolve"
  - id: ERR_STORAGE_LOCATION_NOT_FOUND
    http: 404
    condition: "locationId or storage_location_id does not resolve"
  - id: ERR_CUSTODIAN_NOT_FOUND
    http: 404
    condition: "custodianId or a custodian FK field does not resolve"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "caseId or case_id does not resolve"
  - id: ERR_EVIDENCE_ITEM_NOT_FOUND
    http: 404
    condition: "itemId or evidence_item_id does not resolve"
  - id: ERR_RETENTION_DETERMINATION_NOT_FOUND
    http: 404
    condition: "determinationId does not resolve"
  - id: ERR_CUSTODY_TRANSFER_NOT_FOUND
    http: 404
    condition: "transferId does not resolve"
  - id: ERR_DISPOSITION_ORDER_NOT_FOUND
    http: 404
    condition: "orderId does not resolve"
  - id: ERR_OWNER_CLAIM_NOT_FOUND
    http: 404
    condition: "claimId or owner_claim_id does not resolve"
  - id: ERR_AUDIT_SESSION_NOT_FOUND
    http: 404
    condition: "sessionId does not resolve"
  - id: ERR_DISCREPANCY_NOT_FOUND
    http: 404
    condition: "discrepancyId does not resolve"
  - id: ERR_CHAIN_EVENT_NOT_FOUND
    http: 404
    condition: "eventId does not resolve"
  - id: ERR_BARCODE_NOT_FOUND
    http: 404
    condition: "A scanned barcode matches no EvidenceItem"
  - id: ERR_ROOM_LOCKED_DOWN
    http: 409
    condition: "The room's posture is LOCKED_DOWN and the endpoint is not one of the audit, discrepancy, suspension, sweep or clock exemptions"
  - id: ERR_ROOM_RESTRICTED
    http: 409
    condition: "The room's posture is RESTRICTED and the request would move an item or execute a disposition"
  - id: ERR_STALE_EVIDENCE_ITEM_VERSION
    http: 412
    condition: "expected_evidence_item_version does not equal EvidenceItem.version"
  - id: ERR_STALE_STORAGE_LOCATION_VERSION
    http: 412
    condition: "expected_storage_location_version does not equal StorageLocation.version"
  - id: ERR_ITEM_CUSTODY_STATE_INVALID
    http: 409
    condition: "The item's custody_state does not permit the requested operation"
  - id: ERR_ITEM_DISPOSITION_STATE_INVALID
    http: 409
    condition: "The item's disposition_state is COURT_HOLD, ORDER_PENDING or DISPOSED and does not permit the requested operation"
  - id: ERR_CASE_STATE_INVALID
    http: 409
    condition: "The case's status does not permit the requested transition or the requested FINAL determination"
  - id: ERR_TRANSFER_STATE_INVALID
    http: 409
    condition: "The transfer's status does not permit release, return or loss reporting"
  - id: ERR_ORDER_STATE_INVALID
    http: 409
    condition: "The order's status does not permit authorization, rejection, execution, settlement or disbursement"
  - id: ERR_CLAIM_STATE_INVALID
    http: 409
    condition: "The claim's status does not permit filing or verification"
  - id: ERR_AUDIT_STATE_INVALID
    http: 409
    condition: "The audit session's status does not permit start, scan, reconcile or close"
  - id: ERR_DISCREPANCY_STATE_INVALID
    http: 409
    condition: "The discrepancy is already resolved, or is not OPEN when investigation is requested"
  - id: ERR_LOCATION_SEALED
    http: 409
    condition: "The source or destination StorageLocation is SEALED_FOR_AUDIT"
  - id: ERR_CUSTODIAN_SUSPENDED
    http: 409
    condition: "A referenced custodian has status SUSPENDED"
  - id: ERR_CUSTODIAN_NOT_CERTIFIED
    http: 409
    condition: "A referenced custodian's certification_expires_at is at or before the logical clock"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The executor is the requester, or the witness is the executor"
  - id: ERR_DUPLICATE_AGENCY_CODE
    http: 409
    condition: "agency_code already used by another PropertyRoom"
  - id: ERR_DUPLICATE_OFFENSE_CODE
    http: 409
    condition: "offense_code already used by another OffenseStatute"
  - id: ERR_DUPLICATE_LOCATION_CODE
    http: 409
    condition: "code already used by another StorageLocation in the same room"
  - id: ERR_DUPLICATE_BADGE_NUMBER
    http: 409
    condition: "badge_number already used by another Custodian in the same room"
  - id: ERR_DUPLICATE_CASE_NUMBER
    http: 409
    condition: "case_number already used by another Case in the same room"
  - id: ERR_PACKAGING_NOT_PERMITTED
    http: 422
    condition: "packaging_type is not permitted for the item's category"
  - id: ERR_STORAGE_CATEGORY_MISMATCH
    http: 409
    condition: "The target location's category differs from the item's required_storage_category"
  - id: ERR_REFRIGERATION_OUT_OF_RANGE
    http: 409
    condition: "A REFRIGERATED target location's temperature_c exceeds 4.0"
  - id: ERR_WITNESS_SIGNATURE_REQUIRED
    http: 422
    condition: "witness_signature omitted while the item's location requires_dual_signature"
  - id: ERR_ESCORT_CAPACITY_EXCEEDED
    http: 409
    condition: "The receiving custodian already holds 2 overlapping open transfers under closed-interval semantics"
  - id: ERR_INVALID_TRANSFER_WINDOW
    http: 422
    condition: "due_back_at is not strictly after released_at, or scheduled_end_at is not strictly after scheduled_start_at"
  - id: ERR_TRANSFER_WINDOW_TOO_LONG
    http: 422
    condition: "The window exceeds the maximum for the purpose (LAB_ANALYSIS 30 days, COURT_PRESENTATION 3 days, INVESTIGATIVE_REVIEW 7 days)"
  - id: ERR_CUSTODY_WINDOW_CONFLICT
    http: 409
    condition: "The requested window strictly overlaps another open transfer on the same item"
  - id: ERR_AUDIT_WINDOW_BUFFER
    http: 409
    condition: "The requested audit window falls within 48 hours of another non-closed session on the same location"
  - id: ERR_PRESERVATION_CLASS_FORBIDS_DESTRUCTION
    http: 409
    condition: "A DESTRUCTION order is requested for an item whose statute preservation_class is BIOLOGICAL_INDEFINITE or HOMICIDE_PERMANENT"
  - id: ERR_CASE_NOT_DISPOSABLE
    http: 409
    condition: "The case is OPEN, CHARGED or APPEAL_PENDING and the item is not unclaimed found property"
  - id: ERR_RETENTION_NOT_MATURED
    http: 409
    condition: "The item is still RETAINED because retention_release_at is null or in the future"
  - id: ERR_CLAIM_NOT_VERIFIED
    http: 409
    condition: "A RETURN_TO_OWNER order is executed while its OwnerClaim is not VERIFIED"
  - id: ERR_BARCODE_FOREIGN_ROOM
    http: 409
    condition: "The scanned item belongs to a different PropertyRoom than the audited location"
  - id: ERR_CASE_HAS_UNDISPOSED_ITEMS
    http: 409
    condition: "Case closure requested while undisposed_item_count > 0"
  - id: ERR_DISCREPANCY_RESOLUTION_NOT_PERMITTED
    http: 422
    condition: "resolution WRITTEN_OFF requested for a MISPLACED discrepancy"
  - id: ERR_SALE_BELOW_RESERVE
    http: 409
    condition: "gross_sale_cents is below the order's reserve_price_cents"
  - id: ERR_NO_PROCEEDS_HELD
    http: 409
    condition: "Disbursement requested while settlement_status is not HELD"
  - id: ERR_SETTLEMENT_WINDOW_CLOSED
    http: 409
    condition: "Settlement requested after settlement_deadline_at"
  - id: ERR_STORAGE_LOCATION_FULL
    http: 409
    condition: "The chosen location has no free slot"
  - id: ERR_NO_ELIGIBLE_STORAGE
    http: 409
    condition: "Auto-selection found no eligible location for the item's required_storage_category"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PropertyRoomManager
    description: "Property room commander: configures the room, statutes, locations and custodians, runs the nightly sweep, executes and settles dispositions, and adjudicates discrepancies"
    identity: opaque
    exclusive_operations:
      - "POST /property-rooms"
      - "POST /property-rooms/{roomId}/daily-sweep"
      - "POST /offense-statutes"
      - "POST /storage-locations"
      - "POST /custodians"
      - "POST /custodians/{custodianId}/suspend"
      - "POST /cases/{caseId}/close"
      - "POST /custody-transfers/{transferId}/report-lost"
      - "POST /disposition-orders/{orderId}/execute"
      - "POST /disposition-orders/{orderId}/settle"
      - "POST /disposition-orders/{orderId}/disburse"
      - "POST /owner-claims/{claimId}/verify"
      - "POST /discrepancies/{discrepancyId}/investigate"
      - "POST /discrepancies/{discrepancyId}/resolve"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /cases"
      - "POST /cases/{caseId}/charge"
      - "POST /cases/{caseId}/adjudicate"
      - "POST /retention-determinations"
      - "POST /disposition-orders"
      - "POST /audit-sessions/{sessionId}/close"
      - "all GET endpoints"

  - name: EvidenceTechnician
    description: "Evidence technician: logs intake, packages and barcodes items, assigns storage, releases and receives transfers with signature capture, and issues owner notices"
    identity: "entity_backed:Custodian"
    exclusive_operations:
      - "POST /evidence-items"
      - "POST /evidence-items/{itemId}/storage-assignment"
      - "POST /custody-transfers/{transferId}/release"
      - "POST /custody-transfers/{transferId}/return"
      - "POST /owner-claims"
      - "POST /owner-claims/{claimId}/file"
    shared_operations:
      - "POST /cases"
      - "POST /retention-determinations"
      - "POST /custody-transfers"
      - "POST /disposition-orders"
      - "GET endpoints for cases, items, transfers, determinations, orders, claims, locations, custodians, audits, discrepancies and chain events"

  - name: Investigator
    description: "Case investigator: files charges and requests investigative-review transfers"
    identity: "entity_backed:Custodian"
    exclusive_operations: []
    shared_operations:
      - "POST /cases/{caseId}/charge"
      - "POST /custody-transfers"
      - "GET endpoints for rooms, cases, items, transfers, custodians and chain events"

  - name: LabAnalyst
    description: "Laboratory analyst: requests laboratory-analysis transfers and receives items for examination"
    identity: "entity_backed:Custodian"
    exclusive_operations: []
    shared_operations:
      - "POST /custody-transfers"
      - "GET endpoints for rooms, items, transfers, custodians and chain events"

  - name: CourtClerk
    description: "Court clerk: records adjudication, appeals and appeal resolution, and authorizes or refuses dispositions. Cannot execute a disposition, which keeps authorization and execution in different hands"
    identity: opaque
    exclusive_operations:
      - "POST /cases/{caseId}/appeal"
      - "POST /cases/{caseId}/resolve-appeal"
      - "POST /disposition-orders/{orderId}/authorize"
      - "POST /disposition-orders/{orderId}/reject"
    shared_operations:
      - "POST /cases/{caseId}/adjudicate"
      - "GET endpoints for rooms, statutes, cases, items, determinations, transfers, orders and chain events"

  - name: InternalAuditor
    description: "Internal auditor: schedules and conducts inventory audits, scans barcodes and reconciles the location. Cannot resolve the discrepancies it raises, which keeps detection and adjudication in different hands"
    identity: "entity_backed:Custodian"
    exclusive_operations:
      - "POST /audit-sessions"
      - "POST /audit-sessions/{sessionId}/start"
      - "POST /audit-sessions/{sessionId}/scan"
      - "POST /audit-sessions/{sessionId}/reconcile"
    shared_operations:
      - "POST /audit-sessions/{sessionId}/close"
      - "GET endpoints for rooms, locations, custodians, cases, items, determinations, transfers, orders, claims, audits, discrepancies and chain events"
