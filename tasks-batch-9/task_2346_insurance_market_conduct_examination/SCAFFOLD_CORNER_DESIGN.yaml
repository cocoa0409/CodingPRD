      - name: err_sample_size_below_minimum_in_both_modes
        claim_type: error_triggerable
        grounds:
          - errors.ERR_SAMPLE_SIZE_BELOW_MINIMUM
          - validations[priority 53 ERR_SAMPLE_SIZE_BELOW_MINIMUM]
          - calculations.sample_draw_plan
        distinguishing_aspect: |
          The minimum is mode-dependent, so the identical sample_size of 9 is illegal on an ON_SITE
          examination and legal on a DESK one, and 4 is illegal on both. The bound is inclusive from below:
          exactly 10 and exactly 5 are the smallest accepted samples in their respective modes.
