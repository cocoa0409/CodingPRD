            - call: "POST /campus-recruiting/seasons/${sidB}/advance"
              payload: {}
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/candidates"
              payload: { email: "b@x.com", full_name: "Candidate B", expected_graduation_date: "2027-05-15T00:00:00Z" }
              as: Anonymous
              captures: { candB: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sidB}/applications"
              payload: { candidate_id: "${candB}", school_target_id: "${stB}", relocation_distance_miles: 100 }
              as: Candidate
              as_user_id: "${candB}"
              captures: { appB: $.data.id }
            - call: "POST /campus-recruiting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-21T00:00:00Z" }
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/seasons/${sidB}/advance"
              payload: {}
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/applications/${appB}/screen"
              payload: { decision: "SHORTLIST" }
              as: Recruiter
            - call: "POST /campus-recruiting/seasons/${sidB}/employees"
              payload: { full_name: "Eve B", email: "evb@co.com" }
              as: RecruitingAdmin
              captures: { evB: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sidB}/interview-days"
              payload: { window_start_at: "2026-06-08T09:00:00Z", window_end_at: "2026-06-08T17:00:00Z", capacity: 5 }
              as: Recruiter
              captures: { dayB: $.data.id }
            - call: "POST /campus-recruiting/interview-days/${dayB}/interview-slots"
              payload: { application_id: "${appB}", evaluator_id: "${evB}", start_at: "2026-06-08T10:00:00Z", end_at: "2026-06-08T11:00:00Z" }
              as: Recruiter
              captures: { slotB: $.data.id }
            - call: "POST /campus-recruiting/interview-slots/${slotB}/evaluations"
              payload: { score: 4, recommendation: "HIRE" }
              as: Evaluator
              as_user_id: "${evB}"
            - call: "POST /campus-recruiting/seasons/${sidB}/advance"
              payload: {}
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/applications/${appA}/offers"
              payload: { weekly_rate_cents: 150000, duration_weeks: 12 }
              as: Recruiter
              captures: { offA: $.data.id }
            - call: "POST /campus-recruiting/applications/${appB}/offers"
              payload: { weekly_rate_cents: 150000, duration_weeks: 12 }
              as: Recruiter
              captures: { offB: $.data.id }
            - call: "POST /campus-recruiting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T16:00:00Z" }
              as: RecruitingAdmin
          trigger:
