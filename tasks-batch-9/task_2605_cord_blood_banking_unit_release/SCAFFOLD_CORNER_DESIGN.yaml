        grounds: "§1.7 exclusive_operations of IntakeCoordinator (POST /cbb/enrollments, POST /cbb/collection-kits), CollectionSite (POST /cbb/collections), ProcessingTechnologist (receive, processing-runs, complete, quality-tests, cryopreserve), MedicalDirector (eligibility-determination), FacilitiesEngineer (storage-tanks, temperature-readings), BillingAdministrator (storage-accounts, storage-invoices), TransplantCenter (reservations, confirm) and PlatformAdmin (ops/nightly-run, _clock/set_current_utc)."
        distinguishing_aspect: "One chain in which every bank-side role is exercised on at least one of ITS OWN exclusive endpoints and each call succeeds, establishing the positive half of the segregation-of-duties role model before any denial is asserted. The RegistryOperator triad (POST /cbb/registry-listings and its suspend/resume) is exercised in the listing instances, which need a PUBLIC_DONATION unit."
