            - { call: "POST /testing-authorizations/${ta_id}/advance", payload: { event: "SIGN" }, as: StaffAttorney, as_user_id: "atty_1" }
            - { call: "POST /cases/${case_id}/advance", payload: { event: "BEGIN_TESTING" }, as: StaffAttorney, as_user_id: "atty_1" }
          trigger:
            - call: "POST /lab-analyses"
              payload: { evidence_item_id: "${item_id}", authorization_id: "${ta_id}", lab_name: "LabPrime", test_type: "DNA_STR", required_sample_ng: 15, scheduled_start: "2026-10-01T09:00:00Z", scheduled_end: "2026-10-10T17:00:00Z" }
              as: StaffAttorney
              as_user_id: "atty_1"
              captures: { a1: $.data.id }
            - call: "GET /evidence-items/${item_id}"
              as: EvidenceAnalyst
              captures: { rem1: $.data.remaining_sample_ng }
            - { call: "POST /lab-analyses/${a1}/advance", payload: { event: "SHIP_SAMPLE" }, as: EvidenceAnalyst }
            - { call: "POST /lab-analyses/${a1}/advance", payload: { event: "RECORD_RESULT", outcome: "EXCLUSIONARY", actual_consumed_ng: 12, profile_obtained: true }, as: EvidenceAnalyst }
            - call: "GET /evidence-items/${item_id}"
              as: EvidenceAnalyst
              captures: { rem2: $.data.remaining_sample_ng }
            - call: "POST /lab-analyses"
              payload: { evidence_item_id: "${item_id}", authorization_id: "${ta_id}", lab_name: "LabPrime", test_type: "DNA_YSTR", required_sample_ng: 5, scheduled_start: "2026-10-10T17:00:00Z", scheduled_end: "2026-10-15T17:00:00Z" }
