scenario: |
  2680. Bank Merger Application & Community Impact Review (bank corporate development and
  regulatory affairs): transaction structure, pro forma capital and competitive analysis by deposit
  market concentration, application preparation with financial projections, management assessment
  and integration plans, community reinvestment record evaluation and public comment period
  management, public hearing requests, community benefits commitments and protest response, branch
  overlap divestiture and closure notice obligations, approval conditions, waiting periods and
  consummation timing, systems conversion planning with customer disclosure requirements,
  post-closing commitment monitoring and reporting
domain_name: bank-merger-application-review
api_prefix: ""

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Every entity is a top-level collection joined by explicit foreign keys (api_prefix is empty).
  # Institution x DepositMarket is a many-to-many resolved by the Branch junction; MergerApplication
  # is a peer that references two Institutions by FK rather than nesting under either one.

  state_machine_shape: parallel
  # MergerApplication carries two independent state dimensions on the same row:
  # `filing_status` (DRAFT..CONSUMMATED, with a RETURNED_FOR_AMENDMENT -> SUBMITTED cycle) and
  # `public_review_status` (NOT_OPEN..CLEARED). Branch and CommitmentPerformanceReport are cyclic;
  # HearingRequest is branching with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many        # MergerApplication -> schedules / periods / plans / decisions
    - many_to_many       # Institution <-> DepositMarket via Branch
    - cross_aggregate    # ApprovalCondition (decision aggregate) satisfied by Branch designations

  role_model: segregation_of_duties
  # The CaseAnalyst who records the staff recommendation may not be the ApprovingOfficial who issues
  # the decision (compared on X-User-ID); regulator roles are opaque, the Filer is entity-backed.

  consistency_model: immediate

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Institution
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: chartered legal name of the bank or holding company
        constraints: 1..160 chars, non-blank
      - name: charter_type
        type: enum
        source: input
        description: charter class of the institution
        constraints: "one of {NATIONAL, STATE_MEMBER, STATE_NONMEMBER, SAVINGS}"
      - name: primary_regulator
        type: enum
        source: input
        description: primary federal supervisor; must agree with charter_type
        constraints: "one of {OCC, FRB, FDIC}; NATIONAL->OCC, STATE_MEMBER->FRB, STATE_NONMEMBER->FDIC, SAVINGS->FDIC"
      - name: cet1_capital_usd
        type: integer
        source: input
        description: common equity tier 1 capital in whole USD
        default: 0
        constraints: ">= 0"
      - name: tier1_capital_usd
        type: integer
        source: input
        description: tier 1 capital in whole USD
        default: 0
        constraints: ">= 0"
      - name: total_capital_usd
        type: integer
        source: input
        description: total regulatory capital in whole USD
        default: 0
        constraints: ">= 0"
      - name: risk_weighted_assets_usd
        type: integer
        source: input
        description: risk-weighted assets in whole USD
        default: 0
        constraints: ">= 0"
      - name: average_total_assets_usd
        type: integer
        source: input
        description: average total consolidated assets used as the leverage denominator
        default: 0
        constraints: ">= 0"
      - name: total_loans_usd
        type: integer
        source: input
        description: gross loans held for investment; the stress credit mark is applied to this base
        default: 0
        constraints: ">= 0"
      - name: latest_cra_rating
        type: enum
        source: input
        description: most recent Community Reinvestment Act performance rating on record
        default: SATISFACTORY
        constraints: "one of {OUTSTANDING, SATISFACTORY, NEEDS_TO_IMPROVE, SUBSTANTIAL_NONCOMPLIANCE}"
      - name: cra_exam_closed_at
        type: datetime
        source: input
        description: close date of the CRA examination that produced latest_cra_rating
        default: null
      - name: status
        type: enum
        source: system
        description: charter lifecycle; MERGED_OUT is set when the institution is consummated away as a target
        default: ACTIVE
        constraints: "one of {ACTIVE, MERGED_OUT}"
      - name: total_deposits_usd
        type: integer
        source: computed
        description: sum of deposits_usd over this institution's branches whose status is in the includable set (see calculations.market_deposit_aggregation)
      - name: branch_count
        type: integer
        source: computed
        description: count of this institution's branches whose status is in the includable set

  - name: DepositMarket
    parent: null
    common_fields: true
    fields:
      - name: market_code
        type: string
        source: input
        description: banking-market identifier (MSA or rural county code); unique across DepositMarket
        constraints: 2..32 chars, unique
      - name: market_name
        type: string
        source: input
        description: human-readable market name
      - name: market_type
        type: enum
        source: input
        description: geographic market class; selects the post-merger HHI safe-harbour threshold
        constraints: "one of {MSA, RURAL_COUNTY}"
      - name: total_deposits_usd
        type: integer
        source: computed
        description: sum of deposits_usd over branches in this market whose status is in the includable set
      - name: participant_count
        type: integer
        source: computed
        description: count of distinct institution_id values holding at least one includable branch in this market
      - name: hhi_current
        type: integer
        source: computed
        description: Herfindahl-Hirschman Index over current branch ownership in this market, recomputed on every branch create, designate, rescind, divest, close, or ownership reassignment

  - name: Branch
    parent: null
    common_fields: true
    fields:
      - name: institution_id
        type: string
        source: input
        description: FK -> Institution.id; current owner of the branch
      - name: market_id
        type: string
        source: input
        description: FK -> DepositMarket.id; banking market the branch competes in
      - name: branch_name
        type: string
        source: input
        description: branch office name
      - name: deposits_usd
        type: integer
        source: input
        description: deposits booked at this branch in whole USD; the atomic unit of market concentration
        constraints: "> 0"
      - name: service_type
        type: enum
        source: input
        description: full-service offices carry deposit-taking capability; limited-service offices are drive-ups and kiosks
        default: FULL_SERVICE
        constraints: "one of {FULL_SERVICE, LIMITED_SERVICE}"
      - name: status
        type: enum
        source: system
        description: branch lifecycle across designation, divestiture, and closure
        default: OPEN
        constraints: "one of {OPEN, DESIGNATED_FOR_DIVESTITURE, DESIGNATED_FOR_CLOSURE, DIVESTED, CLOSED}"
      - name: designation_application_id
        type: string
        source: system
        description: FK -> MergerApplication.id; the application under which this branch was designated for divestiture or closure; null while status is OPEN
        default: null
      - name: notice_sent_at
        type: datetime
        source: input
        description: date the customer branch-closing notice was mailed; set only for closure designations
        default: null
      - name: planned_closure_date
        type: datetime
        source: input
        description: planned date the office stops accepting deposits; set only for closure designations
        default: null
      - name: notice_lead_days
        type: integer
        source: computed
        description: whole UTC days from notice_sent_at to planned_closure_date; null unless both are set
        default: null

  - name: MergerApplication
    parent: null
    common_fields: true
    fields:
      - name: acquirer_id
        type: string
        source: input
        description: FK -> Institution.id; surviving institution and the only Filer permitted to act on this application
      - name: target_id
        type: string
        source: input
        description: FK -> Institution.id; institution being acquired; must differ from acquirer_id
      - name: structure
        type: enum
        source: input
        description: legal form of the transaction; selects the base statutory waiting period
        constraints: "one of {STATUTORY_MERGER, PURCHASE_AND_ASSUMPTION, HOLDCO_ACQUISITION}"
      - name: consideration_type
        type: enum
        source: input
        description: form of merger consideration
        constraints: "one of {ALL_CASH, ALL_STOCK, MIXED}"
      - name: total_consideration_usd
        type: integer
        source: input
        description: aggregate deal consideration in whole USD
        constraints: "> 0"
      - name: officer_experience_score
        type: integer
        source: input
        description: examiner score for proposed senior officer depth and experience
        default: 0
        constraints: 0..100
      - name: risk_management_score
        type: integer
        source: input
        description: examiner score for the pro forma risk-management framework
        default: 0
        constraints: 0..100
      - name: compliance_history_score
        type: integer
        source: input
        description: examiner score for the acquirer's consumer-compliance and BSA history
        default: 0
        constraints: 0..100
      - name: integration_readiness_score
        type: integer
        source: input
        description: examiner score for the integration plan (staffing, systems, project governance)
        default: 0
        constraints: 0..100
      - name: management_composite_score
        type: number
        source: computed
        description: weighted management assessment score; see calculations.management_composite_score (per-factor rounding, then sum)
        default: 0.00
      - name: management_rating
        type: enum
        source: computed
        description: banded management_composite_score
        default: UNSATISFACTORY
        constraints: "one of {SATISFACTORY, CONDITIONAL, UNSATISFACTORY}"
      - name: filing_status
        type: enum
        source: system
        description: filing lifecycle dimension (independent of public_review_status)
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, UNDER_REVIEW, RETURNED_FOR_AMENDMENT, RECOMMENDED, DECIDED, CONSUMMATED, DENIED}"
      - name: public_review_status
        type: enum
        source: system
        description: community-review lifecycle dimension, evolving independently of filing_status
        default: NOT_OPEN
        constraints: "one of {NOT_OPEN, OPEN_FOR_COMMENT, PROTEST_PENDING, HEARING_PENDING, HEARING_GRANTED, COMMENT_CLOSED, CLEARED}"
      - name: competitive_posture
        type: enum
        source: computed
        description: worst-case screen outcome across this application's CompetitiveAnalysis rows; see calculations.competitive_posture_rollup
        default: NOT_ANALYZED
        constraints: "one of {NOT_ANALYZED, CLEARED, CLEARED_WITH_DIVESTITURE, MITIGATION_REQUIRED, BLOCKED}"
      - name: substantive_protest_count
        type: integer
        source: computed
        description: count of PublicComment rows on this application's periods with stance PROTEST, substantive true, and status in {RECEIVED, ACKNOWLEDGED, RESPONDED}
        default: 0
      - name: unresolved_protest_count
        type: integer
        source: computed
        description: count of the same population restricted to status in {RECEIVED, ACKNOWLEDGED} (i.e. not yet RESPONDED)
        default: 0
      - name: earliest_decision_at
        type: datetime
        source: computed
        description: earliest instant staff may record a recommendation; comment-period close plus POST_COMMENT_REVIEW_DAYS
        default: null
      - name: recommended_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the CaseAnalyst who recorded the staff recommendation; the segregation-of-duties comparison key
        default: null
      - name: recommendation
        type: enum
        source: input
        description: staff recommendation recorded at the recommend step
        default: null
        constraints: "one of {APPROVE, APPROVE_WITH_CONDITIONS, DENY}"
      - name: amendment_round
        type: integer
        source: system
        description: number of times this application has been re-submitted after a return for amendment
        default: 0
      - name: post_closing_monitoring_status
        type: enum
        source: system
        description: post-consummation commitment monitoring posture
        default: NOT_APPLICABLE
        constraints: "one of {NOT_APPLICABLE, MONITORING, ESCALATED}"

  - name: ProFormaCapitalSchedule
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> MergerApplication.id
      - name: basis
        type: enum
        source: input
        description: measurement basis; selects the variant of calculations.pro_forma_capital_ratios
        constraints: "one of {REGULATORY_ADJUSTED, INTERNAL_STRESS}"
      - name: goodwill_created_usd
        type: integer
        source: input
        description: goodwill recognised on the purchase-accounting opening balance sheet
        constraints: ">= 0"
      - name: core_deposit_intangible_usd
        type: integer
        source: input
        description: core deposit intangible recognised at close
        constraints: ">= 0"
      - name: aoci_markdown_usd
        type: integer
        source: input
        description: unrealised AFS securities loss recognised only under the INTERNAL_STRESS basis
        constraints: ">= 0"
      - name: deferred_tax_asset_usd
        type: integer
        source: input
        description: deferred tax asset created by the transaction
        constraints: ">= 0"
      - name: transaction_costs_usd
        type: integer
        source: input
        description: one-time merger expenses charged to capital
        constraints: ">= 0"
      - name: cash_consideration_usd
        type: integer
        source: input
        description: cash paid at close; reduces the leverage denominator
        constraints: ">= 0"
      - name: pro_forma_cet1_ratio_pct
        type: number
        source: computed
        description: pro forma CET1 ratio in percent, 2 decimal places
      - name: pro_forma_tier1_leverage_pct
        type: number
        source: computed
        description: pro forma tier 1 leverage ratio in percent, 2 decimal places
      - name: capital_adequacy_flag
        type: enum
        source: computed
        description: banded pair of computed ratios
        constraints: "one of {WELL_CAPITALIZED, ADEQUATELY_CAPITALIZED, UNDERCAPITALIZED}"
      - name: status
        type: enum
        source: system
        description: only one CURRENT schedule per (application_id, basis); a newer schedule supersedes the prior one
        default: CURRENT
        constraints: "one of {CURRENT, SUPERSEDED}"

  - name: CompetitiveAnalysis
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> MergerApplication.id
      - name: market_id
        type: string
        source: input
        description: FK -> DepositMarket.id; must be an overlap market of this application
      - name: combined_market_deposits_usd
        type: integer
        source: computed
        description: includable deposits held in this market by acquirer plus target, ignoring designations
      - name: hhi_pre_merger
        type: integer
        source: computed
        description: HHI over current ownership (step 1 of calculations.hhi_competitive_screen)
      - name: hhi_post_unmitigated
        type: integer
        source: computed
        description: HHI with acquirer and target merged into one owner and all designations ignored (step 2)
      - name: hhi_delta_unmitigated
        type: integer
        source: computed
        description: hhi_post_unmitigated minus hhi_pre_merger (step 2)
      - name: screen_result
        type: enum
        source: computed
        description: unmitigated screen outcome (step 3)
        constraints: "one of {PASS, MITIGATION_REQUIRED, PRESUMPTIVE_VIOLATION}"
      - name: required_divestiture_deposits_usd
        type: integer
        source: computed
        description: minimum in-market deposits that must be divested, derived only from step-3 inputs (step 4)
      - name: designated_divestiture_deposits_usd
        type: integer
        source: computed
        description: sum of deposits_usd over branches in this market with status DESIGNATED_FOR_DIVESTITURE and designation_application_id equal to application_id
        default: 0
      - name: hhi_post_mitigated
        type: integer
        source: computed
        description: HHI with designated divestiture deposits attributed to a single hypothetical new entrant (step 5)
      - name: mitigation_satisfied
        type: boolean
        source: computed
        description: step 6 — designated deposits meet the requirement AND the mitigated screen passes
        default: false

  - name: PublicCommentPeriod
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> MergerApplication.id
      - name: opens_at
        type: datetime
        source: input
        description: inclusive start of the comment window
      - name: duration_days
        type: integer
        source: input
        description: initial window length in whole days
        default: 30
        constraints: 1..90
      - name: closes_at
        type: datetime
        source: computed
        description: exclusive end of the comment window; opens_at plus duration_days plus extended_days_total
      - name: extension_count
        type: integer
        source: system
        description: number of extensions applied to this window
        default: 0
      - name: extended_days_total
        type: integer
        source: system
        description: cumulative days added by extensions
        default: 0
      - name: status
        type: enum
        source: system
        description: window lifecycle
        default: OPEN
        constraints: "one of {OPEN, EXTENDED, CLOSED}"
      - name: comment_count
        type: integer
        source: computed
        description: count of PublicComment rows on this period regardless of status
        default: 0
      - name: substantive_protest_count
        type: integer
        source: computed
        description: count of this period's comments with stance PROTEST, substantive true, status in {RECEIVED, ACKNOWLEDGED, RESPONDED}
        default: 0

  - name: PublicComment
    parent: null
    common_fields: true
    fields:
      - name: period_id
        type: string
        source: input
        description: FK -> PublicCommentPeriod.id
      - name: commenter_user_id
        type: string
        source: system
        description: opaque X-User-ID of the submitting PublicCommenter; ownership key for hearing requests
      - name: commenter_name
        type: string
        source: input
        description: name of the person or organisation on the record
      - name: commenter_type
        type: enum
        source: input
        description: commenter class
        constraints: "one of {INDIVIDUAL, COMMUNITY_ORGANIZATION, TRADE_GROUP, GOVERNMENT}"
      - name: stance
        type: enum
        source: input
        description: position taken on the application
        constraints: "one of {SUPPORT, OPPOSE, PROTEST}"
      - name: substantive
        type: boolean
        source: input
        description: true when the comment raises a specific, fact-based CRA or convenience-and-needs objection
        default: false
      - name: body
        type: string
        source: input
        description: comment text
        constraints: 1..4000 chars
      - name: received_at
        type: datetime
        source: system
        description: logical-clock instant the comment was received
      - name: status
        type: enum
        source: system
        description: comment disposition; UNTIMELY comments never count toward protest aggregates
        default: RECEIVED
        constraints: "one of {RECEIVED, ACKNOWLEDGED, RESPONDED, UNTIMELY}"
      - name: response_body
        type: string
        source: input
        description: filer's substantive response text; required to reach RESPONDED
        default: null
      - name: responded_at
        type: datetime
        source: system
        description: instant the filer disposition was recorded
        default: null

  - name: HearingRequest
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> MergerApplication.id
      - name: comment_id
        type: string
        source: input
        description: FK -> PublicComment.id; the substantive protest this request is founded on
      - name: requester_user_id
        type: string
        source: system
        description: opaque X-User-ID of the requesting PublicCommenter; must equal the cited comment's commenter_user_id
      - name: requested_at
        type: datetime
        source: system
        description: logical-clock instant the request was filed
      - name: basis
        type: string
        source: input
        description: why a hearing is needed
        constraints: 1..2000 chars
      - name: status
        type: enum
        source: system
        description: request lifecycle; all three outcomes are terminal
        default: PENDING
        constraints: "one of {PENDING, GRANTED, DENIED, WITHDRAWN}"
      - name: decided_at
        type: datetime
        source: system
        description: instant the ApprovingOfficial ruled on the request
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the ruling ApprovingOfficial
        default: null
      - name: decision_rationale
        type: string
        source: input
        description: rationale recorded with the ruling
        default: null
      - name: extension_days_granted
        type: integer
        source: system
        description: days added to the comment window by a grant; 0 for DENIED and WITHDRAWN
        default: 0

  - name: CommunityBenefitsPlan
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> MergerApplication.id
      - name: term_years
        type: integer
        source: input
        description: commitment term in whole years
        constraints: 1..10
      - name: measurement_basis
        type: enum
        source: input
        description: which variant of calculations.commitment_fulfillment governs this plan's report statuses
        default: CUMULATIVE_TO_DATE
        constraints: "one of {CUMULATIVE_TO_DATE, ANNUAL_PRO_RATA}"
      - name: total_committed_usd
        type: integer
        source: computed
        description: sum of committed_usd over this plan's CommitmentLineItem rows
        default: 0
      - name: annual_target_total_usd
        type: integer
        source: computed
        description: sum of per-line-item annual_target_usd (floor per item, then sum)
        default: 0
      - name: quarterly_target_total_usd
        type: integer
        source: computed
        description: floor(annual_target_total_usd / 4); the denominator of both fulfillment variants
        default: 0
      - name: credited_to_date_usd
        type: integer
        source: computed
        description: cumulative credited dollars from reviewed reports; decremented exactly on report reopen
        default: 0
      - name: remaining_commitment_usd
        type: integer
        source: computed
        description: total_committed_usd minus credited_to_date_usd; the conserved ledger partner
        default: 0
      - name: compliance_status
        type: enum
        source: computed
        description: banded consecutive_deficient_periods (0 -> COMPLIANT, 1 -> WATCH, >= 2 -> DEFICIENT)
        default: COMPLIANT
        constraints: "one of {COMPLIANT, WATCH, DEFICIENT}"
      - name: consecutive_deficient_periods
        type: integer
        source: system
        description: run length of consecutive DEFICIENT reviews; reset to 0 by an ACCEPTED review
        default: 0
      - name: filed_report_count
        type: integer
        source: computed
        description: count of this plan's CommitmentPerformanceReport rows that have completed review, i.e. status IN {ACCEPTED, DEFICIENT}; a report returned to FILED by reopen stops counting
        default: 0
      - name: status
        type: enum
        source: system
        description: plan lifecycle; a newer plan on the same application supersedes a PROPOSED one
        default: PROPOSED
        constraints: "one of {PROPOSED, EXECUTED, SUPERSEDED}"

  - name: CommitmentLineItem
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: FK -> CommunityBenefitsPlan.id
      - name: category
        type: enum
        source: input
        description: commitment category; at most one line item per (plan_id, category)
        constraints: "one of {MORTGAGE_LENDING, SMALL_BUSINESS_LENDING, PHILANTHROPY, BRANCH_RETENTION, CDFI_INVESTMENT}"
      - name: committed_usd
        type: integer
        source: input
        description: total dollars committed to this category over the plan term
        constraints: "> 0"
      - name: annual_target_usd
        type: integer
        source: computed
        description: floor(committed_usd / plan.term_years)
      - name: final_year_target_usd
        type: integer
        source: computed
        description: committed_usd minus annual_target_usd times (term_years - 1); absorbs the floor remainder
      - name: credited_usd
        type: integer
        source: computed
        description: dollars credited against this category by reviewed reports; never exceeds committed_usd
        default: 0

  - name: ApprovalDecision
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> MergerApplication.id; at most one decision per application
      - name: decision
        type: enum
        source: input
        description: order issued by the ApprovingOfficial
        constraints: "one of {APPROVED, CONDITIONALLY_APPROVED, DENIED}"
      - name: decided_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the issuing ApprovingOfficial; must differ from application.recommended_by_user_id
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant the order was issued; anchor of both consummation timestamps
      - name: expedited_processing
        type: boolean
        source: computed
        description: true when every expedited condition in calculations.statutory_waiting_period holds
        default: false
      - name: waiting_period_days
        type: integer
        source: computed
        description: days that must elapse after decided_at before consummation is permitted
      - name: consummation_window_open_at
        type: datetime
        source: computed
        description: decided_at plus waiting_period_days; consummation is permitted at this instant (inclusive)
      - name: consummation_deadline_at
        type: datetime
        source: computed
        description: decided_at plus CONSUMMATION_DEADLINE_DAYS; consummation is permitted through this instant (inclusive)
      - name: status
        type: enum
        source: system
        description: order lifecycle; DENIED orders are CLOSED on issue, approvals wait in ISSUED
        default: ISSUED
        constraints: "one of {ISSUED, CONSUMMATED, LAPSED, CLOSED}"
      - name: consummated_at
        type: datetime
        source: system
        description: instant the transaction was consummated
        default: null

  - name: ApprovalCondition
    parent: null
    common_fields: true
    fields:
      - name: decision_id
        type: string
        source: input
        description: FK -> ApprovalDecision.id
      - name: condition_type
        type: enum
        source: input
        description: subject matter of the condition
        constraints: "one of {DIVESTITURE, COMMUNITY_BENEFITS, CAPITAL_MAINTENANCE, BRANCH_RETENTION, SYSTEMS_CONVERSION}"
      - name: timing
        type: enum
        source: input
        description: PRE_CONSUMMATION conditions gate consummation; POST_CLOSING conditions are monitored afterwards
        constraints: "one of {PRE_CONSUMMATION, POST_CLOSING}"
      - name: description
        type: string
        source: input
        description: condition text
        constraints: 1..2000 chars
      - name: threshold_usd
        type: integer
        source: input
        description: dollar threshold the condition references, when applicable
        default: null
      - name: status
        type: enum
        source: system
        description: condition lifecycle; BREACHED is reachable from OPEN and from SATISFIED and can be cured back to SATISFIED
        default: OPEN
        constraints: "one of {OPEN, SATISFIED, BREACHED}"
      - name: satisfied_at
        type: datetime
        source: system
        description: instant the condition was last marked satisfied
        default: null
      - name: satisfied_by_user_id
        type: string
        source: system
        description: opaque X-User-ID that last satisfied the condition, or "system" when satisfied by cascade
        default: null

  - name: SystemsConversionPlan
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> MergerApplication.id
      - name: conversion_start_date
        type: datetime
        source: input
        description: inclusive start of the core-systems conversion window
      - name: conversion_end_date
        type: datetime
        source: input
        description: inclusive end of the core-systems conversion window; must be at or after conversion_start_date
      - name: affected_customer_count
        type: integer
        source: input
        description: number of target-bank customers receiving conversion disclosures
        constraints: "> 0"
      - name: disclosure_channels
        type: array
        source: input
        description: channels used to deliver the customer disclosure
        constraints: "non-empty; members from {MAIL, EMAIL, IN_BRANCH_NOTICE, ONLINE_BANKING}; MAIL is required"
      - name: customer_disclosure_sent_at
        type: datetime
        source: system
        description: instant the customer disclosure package was sent
        default: null
      - name: disclosure_lead_days
        type: integer
        source: computed
        description: whole UTC days from customer_disclosure_sent_at to conversion_start_date
        default: null
      - name: status
        type: enum
        source: system
        description: conversion plan lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, DISCLOSED, CONVERTED}"

  - name: CommitmentPerformanceReport
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: FK -> CommunityBenefitsPlan.id
      - name: period_label
        type: string
        source: input
        description: reporting period label such as "2027Q1"; unique per plan
        constraints: 4..16 chars
      - name: period_index
        type: integer
        source: input
        description: 1-based quarter index; must equal plan.filed_report_count + 1 at filing time, so the previous period's report must already have been reviewed
        constraints: ">= 1"
      - name: achieved_by_category
        type: object
        source: input
        description: map of commitment category to dollars achieved during the period; keys outside the plan's line-item categories are not creditable
        constraints: "non-empty; values >= 0"
      - name: credited_usd
        type: integer
        source: computed
        description: creditable dollars after per-category capping at the line item's remaining commitment
      - name: excess_uncredited_usd
        type: integer
        source: computed
        description: achieved dollars that could not be credited (unknown category, or over the category cap)
      - name: measurement_basis
        type: enum
        source: computed
        description: copied from plan.measurement_basis at filing time; selects which variant drives status
        constraints: "one of {CUMULATIVE_TO_DATE, ANNUAL_PRO_RATA}"
      - name: fulfillment_pct
        type: number
        source: computed
        description: fulfillment under measurement_basis, 2 decimal places
      - name: alternate_fulfillment_pct
        type: number
        source: computed
        description: fulfillment under the other basis, 2 decimal places; disclosure-only and never drives status
      - name: filed_at
        type: datetime
        source: system
        description: instant the report was filed
      - name: reviewed_at
        type: datetime
        source: system
        description: instant of the most recent review
        default: null
      - name: reviewed_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the reviewing ComplianceMonitor
        default: null
      - name: status
        type: enum
        source: system
        description: report lifecycle; review outcome is server-derived from fulfillment_pct, and reopen returns the row to FILED
        default: FILED
        constraints: "one of {FILED, ACCEPTED, DEFICIENT}"

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  # --- dimension 1 of 2 on MergerApplication (independent of public_review_status) ---
  - entity: MergerApplication
    state_field: filing_status
    initial_state: DRAFT
    terminal_states: [CONSUMMATED, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /merger-applications/{id}/submit"
        actor: Filer
        preconditions:
          - "acting X-User-ID == application.acquirer_id"
          - "Institution[acquirer_id].status == ACTIVE AND Institution[target_id].status == ACTIVE"
          - "Institution[acquirer_id].latest_cra_rating IN {OUTSTANDING, SATISFACTORY}"
          - "application.management_rating IN {SATISFACTORY, CONDITIONAL}"
          - "a ProFormaCapitalSchedule with basis REGULATORY_ADJUSTED and status CURRENT exists for this application"
          - "that schedule's capital_adequacy_flag == WELL_CAPITALIZED"
        side_effects:
          - "filing_status := SUBMITTED"
          - "increments MergerApplication.version by 1"
      - from: RETURNED_FOR_AMENDMENT
        to: SUBMITTED
        trigger: "POST /merger-applications/{id}/submit (re-filing after amendment)"
        actor: Filer
        preconditions:
          - "same six preconditions as DRAFT -> SUBMITTED"
        side_effects:
          - "filing_status := SUBMITTED"
          - "amendment_round := amendment_round + 1"
          - "increments MergerApplication.version by 1"
        note: "This edge closes the SUBMITTED/UNDER_REVIEW -> RETURNED_FOR_AMENDMENT -> SUBMITTED cycle; DRAFT is never re-entered."
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /merger-applications/{id}/accept"
        actor: CaseAnalyst
        preconditions:
          - "no PublicCommentPeriod exists for this application whose window contains the current clock instant"
        side_effects:
          - "filing_status := UNDER_REVIEW"
          - "creates PublicCommentPeriod with opens_at = current clock instant, duration_days = 30, status OPEN"
          - "public_review_status := OPEN_FOR_COMMENT (see the public_review_status machine)"
          - "earliest_decision_at := period.closes_at + POST_COMMENT_REVIEW_DAYS"
          - "increments MergerApplication.version by 1"
      - from: SUBMITTED
        to: RETURNED_FOR_AMENDMENT
        trigger: "POST /merger-applications/{id}/return-for-amendment"
        actor: CaseAnalyst
        preconditions:
          - "reason is present and non-blank"
        side_effects:
          - "filing_status := RETURNED_FOR_AMENDMENT"
          - "increments MergerApplication.version by 1"
      - from: UNDER_REVIEW
        to: RETURNED_FOR_AMENDMENT
        trigger: "POST /merger-applications/{id}/return-for-amendment"
        actor: CaseAnalyst
        preconditions:
          - "reason is present and non-blank"
          - "no HearingRequest on this application has status PENDING"
        side_effects:
          - "filing_status := RETURNED_FOR_AMENDMENT"
          - "every PublicCommentPeriod of this application with status IN {OPEN, EXTENDED} is closed: status := CLOSED"
          - "public_review_status := COMMENT_CLOSED"
          - "increments MergerApplication.version by 1"
      - from: UNDER_REVIEW
        to: RECOMMENDED
        trigger: "POST /merger-applications/{id}/recommend"
        actor: CaseAnalyst
        preconditions:
          - "public_review_status == COMMENT_CLOSED"
          - "current clock instant >= earliest_decision_at"
          - "no HearingRequest on this application has status PENDING"
          - "a CompetitiveAnalysis exists for every overlap market of this application"
        side_effects:
          - "filing_status := RECOMMENDED"
          - "recommendation := body.recommendation"
          - "recommended_by_user_id := acting X-User-ID"
          - "public_review_status := CLEARED when unresolved_protest_count == 0, otherwise unchanged"
          - "increments MergerApplication.version by 1"
      - from: RECOMMENDED
        to: DECIDED
        trigger: "POST /approval-decisions with decision IN {APPROVED, CONDITIONALLY_APPROVED}"
        actor: ApprovingOfficial
        preconditions:
          - "acting X-User-ID != application.recommended_by_user_id"
          - "competitive_posture != BLOCKED"
          - "no ApprovalDecision exists for this application"
        side_effects:
          - "filing_status := DECIDED"
          - "creates ApprovalDecision with status ISSUED and the computed waiting-period timestamps"
          - "increments MergerApplication.version by 1"
      - from: RECOMMENDED
        to: DENIED
        trigger: "POST /approval-decisions with decision == DENIED"
        actor: ApprovingOfficial
        preconditions:
          - "acting X-User-ID != application.recommended_by_user_id"
          - "no ApprovalDecision exists for this application"
        side_effects:
          - "filing_status := DENIED"
          - "creates ApprovalDecision with status CLOSED, waiting_period_days = 0"
          - "every Branch with designation_application_id == application.id and status IN {DESIGNATED_FOR_DIVESTITURE, DESIGNATED_FOR_CLOSURE} reverts to OPEN with designation_application_id, notice_sent_at, planned_closure_date cleared"
          - "each affected market's hhi_current is recomputed"
          - "increments MergerApplication.version by 1"
        note: "A DENIED order is issued with competitive_posture BLOCKED permitted; the posture gate applies only to approvals."
      - from: DECIDED
        to: CONSUMMATED
        trigger: "POST /approval-decisions/{id}/consummate"
        actor: Filer
        preconditions:
          - "decision.status == ISSUED"
          - "every ApprovalCondition on the decision with timing PRE_CONSUMMATION has status SATISFIED"
          - "current clock instant >= decision.consummation_window_open_at"
          - "current clock instant <= decision.consummation_deadline_at"
          - "every PublicCommentPeriod of this application has status CLOSED"
          - "if the decision carries a COMMUNITY_BENEFITS condition, an EXECUTED CommunityBenefitsPlan exists for this application"
        side_effects:
          - "filing_status := CONSUMMATED"
          - "decision.status := CONSUMMATED, decision.consummated_at := current clock instant"
          - "Institution[target_id].status := MERGED_OUT"
          - "every Branch with institution_id == target_id and status == OPEN is reassigned: institution_id := acquirer_id"
          - "every Branch with designation_application_id == application.id and status == DESIGNATED_FOR_DIVESTITURE becomes DIVESTED"
          - "hhi_current, total_deposits_usd and participant_count are recomputed for every market touched by a reassignment or divestiture"
          - "post_closing_monitoring_status := MONITORING when an EXECUTED CommunityBenefitsPlan exists, otherwise NOT_APPLICABLE"
          - "increments MergerApplication.version by 1"
        note: "CompetitiveAnalysis rows are frozen at consummation and are not recomputed thereafter."

  # --- dimension 2 of 2 on MergerApplication (evolves independently of filing_status) ---
  - entity: MergerApplication
    state_field: public_review_status
    initial_state: NOT_OPEN
    terminal_states: [CLEARED]
    transitions:
      - from: NOT_OPEN
        to: OPEN_FOR_COMMENT
        trigger: "POST /merger-applications/{id}/accept (period auto-created) or POST /comment-periods"
        actor: CaseAnalyst
        preconditions:
          - "a PublicCommentPeriod with status OPEN now exists for this application"
        side_effects:
          - "public_review_status := OPEN_FOR_COMMENT"
      - from: OPEN_FOR_COMMENT
        to: PROTEST_PENDING
        trigger: "POST /public-comments with stance PROTEST and substantive true, received inside the window"
        actor: PublicCommenter
        preconditions:
          - "the resulting substantive_protest_count >= 1"
        side_effects:
          - "public_review_status := PROTEST_PENDING"
          - "substantive_protest_count and unresolved_protest_count are recomputed"
      - from: PROTEST_PENDING
        to: HEARING_PENDING
        trigger: "POST /hearing-requests"
        actor: PublicCommenter
        preconditions:
          - "the created HearingRequest has status PENDING"
        side_effects:
          - "public_review_status := HEARING_PENDING"
      - from: HEARING_PENDING
        to: HEARING_GRANTED
        trigger: "POST /hearing-requests/{id}/decide with outcome GRANTED"
        actor: ApprovingOfficial
        preconditions:
          - "the request's comment period has status IN {OPEN, EXTENDED}"
        side_effects:
          - "public_review_status := HEARING_GRANTED"
          - "cascade link 2: the period is extended (see PublicCommentPeriod OPEN -> EXTENDED)"
          - "cascade link 3: earliest_decision_at := extended period.closes_at + POST_COMMENT_REVIEW_DAYS"
      - from: HEARING_PENDING
        to: PROTEST_PENDING
        trigger: "POST /hearing-requests/{id}/decide with outcome DENIED, or POST /hearing-requests/{id}/withdraw"
        actor: ApprovingOfficial | PublicCommenter
        preconditions:
          - "no other HearingRequest on this application has status PENDING"
          - "unresolved_protest_count >= 1"
        side_effects:
          - "public_review_status := PROTEST_PENDING"
        note: "Divergent branch: no period extension and no earliest_decision_at change occur on this edge."
      - from: HEARING_PENDING
        to: OPEN_FOR_COMMENT
        trigger: "POST /hearing-requests/{id}/decide with outcome DENIED, or POST /hearing-requests/{id}/withdraw"
        actor: ApprovingOfficial | PublicCommenter
        preconditions:
          - "no other HearingRequest on this application has status PENDING"
          - "unresolved_protest_count == 0"
        side_effects:
          - "public_review_status := OPEN_FOR_COMMENT"
      - from: OPEN_FOR_COMMENT
        to: COMMENT_CLOSED
        trigger: "POST /comment-periods/{id}/close"
        actor: CaseAnalyst
        preconditions:
          - "every PublicCommentPeriod of this application has status CLOSED after this call"
        side_effects:
          - "public_review_status := COMMENT_CLOSED"
      - from: PROTEST_PENDING
        to: COMMENT_CLOSED
        trigger: "POST /comment-periods/{id}/close"
        actor: CaseAnalyst
        preconditions:
          - "every PublicCommentPeriod of this application has status CLOSED after this call"
        side_effects:
          - "public_review_status := COMMENT_CLOSED"
      - from: HEARING_GRANTED
        to: COMMENT_CLOSED
        trigger: "POST /comment-periods/{id}/close"
        actor: CaseAnalyst
        preconditions:
          - "every PublicCommentPeriod of this application has status CLOSED after this call"
        side_effects:
          - "public_review_status := COMMENT_CLOSED"
      - from: COMMENT_CLOSED
        to: CLEARED
        trigger: "POST /merger-applications/{id}/recommend"
        actor: CaseAnalyst
        preconditions:
          - "unresolved_protest_count == 0"
        side_effects:
          - "public_review_status := CLEARED"

  - entity: PublicCommentPeriod
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: EXTENDED
        trigger: "system cascade from POST /hearing-requests/{id}/decide with outcome GRANTED"
        actor: system
        preconditions:
          - "the granted request's comment cites this period"
          - "period.status == OPEN"
        side_effects:
          - "extended_days_total := extended_days_total + HEARING_EXTENSION_DAYS"
          - "closes_at := opens_at + duration_days + extended_days_total"
          - "extension_count := extension_count + 1"
          - "status := EXTENDED"
          - "cascade link 3: MergerApplication.earliest_decision_at := closes_at + POST_COMMENT_REVIEW_DAYS"
        note: "Cascade link 2 of the hearing-grant chain; caused by link 1 (the request reaching GRANTED), not by the caller."
      - from: OPEN
        to: CLOSED
        trigger: "POST /comment-periods/{id}/close"
        actor: CaseAnalyst
        preconditions:
          - "no HearingRequest citing a comment of this period has status PENDING"
        side_effects:
          - "status := CLOSED"
          - "MergerApplication.public_review_status := COMMENT_CLOSED once every period of the application is CLOSED"
          - "MergerApplication.earliest_decision_at := closes_at + POST_COMMENT_REVIEW_DAYS"
      - from: EXTENDED
        to: CLOSED
        trigger: "POST /comment-periods/{id}/close"
        actor: CaseAnalyst
        preconditions:
          - "no HearingRequest citing a comment of this period has status PENDING"
        side_effects:
          - "status := CLOSED"
          - "MergerApplication.public_review_status := COMMENT_CLOSED once every period of the application is CLOSED"
          - "MergerApplication.earliest_decision_at := closes_at + POST_COMMENT_REVIEW_DAYS"

  - entity: PublicComment
    state_field: status
    initial_state: RECEIVED
    terminal_states: [RESPONDED, UNTIMELY]
    transitions:
      - from: RECEIVED
        to: ACKNOWLEDGED
        trigger: "POST /public-comments/{id}/respond with disposition ACKNOWLEDGED"
        actor: Filer
        preconditions:
          - "acting X-User-ID == the application's acquirer_id"
          - "comment.status == RECEIVED"
        side_effects:
          - "status := ACKNOWLEDGED"
          - "responded_at := current clock instant"
        note: "ACKNOWLEDGED still counts as unresolved; only RESPONDED clears the protest."
      - from: RECEIVED
        to: RESPONDED
        trigger: "POST /public-comments/{id}/respond with disposition RESPONDED and a non-blank response_body"
        actor: Filer
        preconditions:
          - "acting X-User-ID == the application's acquirer_id"
          - "response_body is present and non-blank"
        side_effects:
          - "status := RESPONDED, response_body and responded_at recorded"
          - "MergerApplication.unresolved_protest_count is recomputed"
          - "MergerApplication.public_review_status := OPEN_FOR_COMMENT when unresolved_protest_count reaches 0 and no HearingRequest is PENDING and the period is still OPEN or EXTENDED"
      - from: ACKNOWLEDGED
        to: RESPONDED
        trigger: "POST /public-comments/{id}/respond with disposition RESPONDED and a non-blank response_body"
        actor: Filer
        preconditions:
          - "acting X-User-ID == the application's acquirer_id"
          - "response_body is present and non-blank"
        side_effects:
          - "status := RESPONDED, response_body and responded_at recorded"
          - "MergerApplication.unresolved_protest_count is recomputed"
      - from: null
        to: UNTIMELY
        trigger: "POST /public-comments received at or after period.closes_at but strictly before period.closes_at + COMMENT_GRACE_DAYS"
        actor: PublicCommenter
        preconditions:
          - "period.status IN {OPEN, EXTENDED, CLOSED}"
        side_effects:
          - "the comment is created with status UNTIMELY"
          - "PublicCommentPeriod.comment_count is recomputed; substantive_protest_count is NOT incremented"
        note: "Initial-state override: comments inside the grace tail are born UNTIMELY and never influence protest aggregates or hearing eligibility."

  - entity: HearingRequest
    state_field: status
    initial_state: PENDING
    terminal_states: [GRANTED, DENIED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /hearing-requests/{id}/decide with outcome GRANTED"
        actor: ApprovingOfficial
        preconditions:
          - "the cited comment's period has status IN {OPEN, EXTENDED}"
          - "the application's filing_status == UNDER_REVIEW"
        side_effects:
          - "cascade link 1: status := GRANTED, decided_at, decided_by_user_id, decision_rationale recorded, extension_days_granted := HEARING_EXTENSION_DAYS"
          - "cascade link 2 (caused by link 1): the cited period transitions OPEN -> EXTENDED, adding HEARING_EXTENSION_DAYS to closes_at"
          - "cascade link 3 (caused by link 2): MergerApplication.earliest_decision_at := extended closes_at + POST_COMMENT_REVIEW_DAYS and public_review_status := HEARING_GRANTED"
      - from: PENDING
        to: DENIED
        trigger: "POST /hearing-requests/{id}/decide with outcome DENIED"
        actor: ApprovingOfficial
        preconditions:
          - "the application's filing_status == UNDER_REVIEW"
          - "decision_rationale is present"
        side_effects:
          - "status := DENIED, decided_at, decided_by_user_id, decision_rationale recorded, extension_days_granted stays 0"
          - "MergerApplication.public_review_status := PROTEST_PENDING when unresolved_protest_count >= 1, otherwise OPEN_FOR_COMMENT"
        note: "Divergent branch: the comment period keeps its original closes_at and earliest_decision_at is untouched."
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /hearing-requests/{id}/withdraw"
        actor: PublicCommenter
        preconditions:
          - "acting X-User-ID == hearing_request.requester_user_id"
        side_effects:
          - "status := WITHDRAWN"
          - "MergerApplication.public_review_status := PROTEST_PENDING when unresolved_protest_count >= 1, otherwise OPEN_FOR_COMMENT"

  - entity: Branch
    state_field: status
    initial_state: OPEN
    terminal_states: [DIVESTED, CLOSED]
    transitions:
      - from: OPEN
        to: DESIGNATED_FOR_DIVESTITURE
        trigger: "POST /branches/{id}/designate with designation_type DIVESTITURE"
        actor: Filer
        preconditions:
          - "branch.institution_id IN {application.acquirer_id, application.target_id}"
          - "application.filing_status NOT IN {CONSUMMATED, DENIED}"
        side_effects:
          - "cascade link 1: status := DESIGNATED_FOR_DIVESTITURE, designation_application_id := application_id"
          - "cascade link 2 (caused by link 1): the CompetitiveAnalysis for (application_id, branch.market_id) recomputes designated_divestiture_deposits_usd, hhi_post_mitigated and mitigation_satisfied"
          - "cascade link 3 (caused by link 2): MergerApplication.competitive_posture is re-rolled from all of its analyses"
          - "cascade link 4 (caused by link 3): every ApprovalCondition with condition_type DIVESTITURE and status OPEN on this application's decision becomes SATISFIED once competitive_posture IN {CLEARED, CLEARED_WITH_DIVESTITURE}, with satisfied_by_user_id := \"system\""
      - from: OPEN
        to: DESIGNATED_FOR_CLOSURE
        trigger: "POST /branches/{id}/designate with designation_type CLOSURE"
        actor: Filer
        preconditions:
          - "branch.institution_id IN {application.acquirer_id, application.target_id}"
          - "application.filing_status NOT IN {CONSUMMATED, DENIED}"
          - "notice_sent_at and planned_closure_date are both present"
          - "notice_lead_days >= CLOSURE_NOTICE_MIN_DAYS"
          - "the buffered closure window does not intersect the application's systems-conversion window"
        side_effects:
          - "status := DESIGNATED_FOR_CLOSURE, designation_application_id, notice_sent_at, planned_closure_date, notice_lead_days recorded"
          - "the CompetitiveAnalysis for (application_id, branch.market_id) is recomputed; closure deposits do NOT count as divestiture mitigation"
      - from: DESIGNATED_FOR_DIVESTITURE
        to: OPEN
        trigger: "POST /branches/{id}/rescind-designation"
        actor: Filer
        preconditions:
          - "application.filing_status NOT IN {CONSUMMATED, DENIED}"
        side_effects:
          - "status := OPEN, designation_application_id := null"
          - "the CompetitiveAnalysis for (application_id, market_id) recomputes designated_divestiture_deposits_usd, hhi_post_mitigated and mitigation_satisfied"
          - "MergerApplication.competitive_posture is re-rolled"
          - "every ApprovalCondition with condition_type DIVESTITURE previously satisfied by cascade returns to OPEN when competitive_posture leaves {CLEARED, CLEARED_WITH_DIVESTITURE}"
        note: "Compensating action for the divestiture designation; the market deposit base is unchanged by both edges."
      - from: DESIGNATED_FOR_CLOSURE
        to: OPEN
        trigger: "POST /branches/{id}/rescind-designation"
        actor: Filer
        preconditions:
          - "application.filing_status NOT IN {CONSUMMATED, DENIED}"
        side_effects:
          - "status := OPEN; designation_application_id, notice_sent_at, planned_closure_date, notice_lead_days := null"
          - "the CompetitiveAnalysis for (application_id, market_id) is recomputed"
      - from: DESIGNATED_FOR_DIVESTITURE
        to: DIVESTED
        trigger: "system cascade from POST /approval-decisions/{id}/consummate"
        actor: system
        preconditions:
          - "designation_application_id == the consummating application's id"
        side_effects:
          - "status := DIVESTED"
          - "the branch leaves the market's includable set: DepositMarket.total_deposits_usd, participant_count and hhi_current are recomputed"
      - from: DESIGNATED_FOR_CLOSURE
        to: CLOSED
        trigger: "system cascade from POST /systems-conversion-plans/{id}/convert"
        actor: system
        preconditions:
          - "designation_application_id == the converting application's id"
        side_effects:
          - "status := CLOSED"
          - "the branch leaves the market's includable set: DepositMarket.total_deposits_usd, participant_count and hhi_current are recomputed"

  - entity: Institution
    state_field: status
    initial_state: ACTIVE
    terminal_states: [MERGED_OUT]
    transitions:
      - from: ACTIVE
        to: MERGED_OUT
        trigger: "system cascade from POST /approval-decisions/{id}/consummate"
        actor: system
        preconditions:
          - "the institution is the target_id of the consummating application"
        side_effects:
          - "status := MERGED_OUT"
          - "its remaining OPEN branches are reassigned to the acquirer, so total_deposits_usd and branch_count fall to 0"
        note: "A MERGED_OUT institution can never again be the acquirer or target of a submitted application."

  - entity: CommunityBenefitsPlan
    state_field: status
    initial_state: PROPOSED
    terminal_states: [EXECUTED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: EXECUTED
        trigger: "POST /community-benefits-plans/{id}/execute"
        actor: Filer
        preconditions:
          - "acting X-User-ID == application.acquirer_id"
          - "the plan has at least one CommitmentLineItem"
          - "application.filing_status IN {UNDER_REVIEW, RECOMMENDED, DECIDED}"
        side_effects:
          - "status := EXECUTED"
          - "total_committed_usd, annual_target_total_usd and quarterly_target_total_usd are frozen from the current line items"
          - "compliance_status := COMPLIANT, credited_to_date_usd := 0, remaining_commitment_usd := total_committed_usd"
        note: "Line items may no longer be added once the plan is EXECUTED; the pro-rata targets are frozen at execution."
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system cascade from POST /community-benefits-plans creating a newer plan for the same application"
        actor: system
        preconditions:
          - "the incoming request carried the matching expected_application_version"
        side_effects:
          - "status := SUPERSEDED"
          - "MergerApplication.version increments by 1"
        note: "Only PROPOSED plans are superseded; an EXECUTED plan blocks creation of a replacement."

  - entity: ApprovalDecision
    state_field: status
    initial_state: ISSUED
    terminal_states: [CONSUMMATED, LAPSED, CLOSED]
    transitions:
      - from: ISSUED
        to: CONSUMMATED
        trigger: "POST /approval-decisions/{id}/consummate"
        actor: Filer
        preconditions:
          - "acting X-User-ID == application.acquirer_id"
          - "decision IN {APPROVED, CONDITIONALLY_APPROVED}"
          - "every ApprovalCondition with timing PRE_CONSUMMATION on this decision has status SATISFIED"
          - "current clock instant >= consummation_window_open_at"
          - "current clock instant <= consummation_deadline_at"
          - "every PublicCommentPeriod of the application has status CLOSED"
        side_effects:
          - "status := CONSUMMATED, consummated_at := current clock instant"
          - "MergerApplication.filing_status := CONSUMMATED and post_closing_monitoring_status := MONITORING"
          - "Institution[target_id].status := MERGED_OUT and its OPEN branches are reassigned to the acquirer"
          - "branches with status DESIGNATED_FOR_DIVESTITURE for this application become DIVESTED and every affected DepositMarket recomputes total_deposits_usd, participant_count and hhi_current"
      - from: ISSUED
        to: LAPSED
        trigger: "POST /approval-decisions/{id}/consummate attempted after consummation_deadline_at"
        actor: Filer
        preconditions:
          - "current clock instant > consummation_deadline_at"
        side_effects:
          - "status := LAPSED"
          - "ERR_CONSUMMATION_WINDOW_LAPSED is returned to the caller; the application stays in filing_status DECIDED"
        note: "The lapse is recorded before the error is returned, so a second attempt reports own-resource state instead of the temporal error."
      - from: ISSUED
        to: CLOSED
        trigger: "system cascade from POST /approval-decisions with decision DENIED"
        actor: system
        preconditions:
          - "decision == DENIED"
        side_effects:
          - "status := CLOSED with waiting_period_days := 0 and both consummation timestamps null"
          - "MergerApplication.filing_status := DENIED and every designated branch reverts to OPEN"

  - entity: ApprovalCondition
    state_field: status
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: SATISFIED
        trigger: "POST /approval-conditions/{id}/satisfy"
        actor: ComplianceMonitor
        preconditions:
          - "decision.status IN {ISSUED, CONSUMMATED}"
          - "for condition_type DIVESTITURE the application's competitive_posture IN {CLEARED, CLEARED_WITH_DIVESTITURE}"
          - "for condition_type COMMUNITY_BENEFITS an EXECUTED CommunityBenefitsPlan exists for the application"
        side_effects:
          - "status := SATISFIED, satisfied_at, satisfied_by_user_id recorded"
      - from: OPEN
        to: BREACHED
        trigger: "system cascade from POST /performance-reports/{id}/review when the plan reaches CONSECUTIVE_DEFICIENT_BREACH deficient periods"
        actor: system
        preconditions:
          - "condition_type == COMMUNITY_BENEFITS and timing == POST_CLOSING"
          - "plan.consecutive_deficient_periods >= CONSECUTIVE_DEFICIENT_BREACH"
        side_effects:
          - "cascade link 3: status := BREACHED"
          - "cascade link 4 (caused by link 3): MergerApplication.post_closing_monitoring_status := ESCALATED"
      - from: BREACHED
        to: SATISFIED
        trigger: "POST /approval-conditions/{id}/satisfy after a later report is ACCEPTED"
        actor: ComplianceMonitor
        preconditions:
          - "plan.consecutive_deficient_periods == 0"
          - "plan.compliance_status != DEFICIENT"
        side_effects:
          - "status := SATISFIED, satisfied_at, satisfied_by_user_id recorded"
          - "MergerApplication.post_closing_monitoring_status := MONITORING once no condition of the decision is BREACHED"
        note: "Cyclic recovery edge: a breach is curable, so no status of this machine is terminal."

  - entity: SystemsConversionPlan
    state_field: status
    initial_state: DRAFT
    terminal_states: [CONVERTED]
    transitions:
      - from: DRAFT
        to: DISCLOSED
        trigger: "POST /systems-conversion-plans/{id}/disclose"
        actor: Filer
        preconditions:
          - "acting X-User-ID == application.acquirer_id"
          - "customer_disclosure_sent_at is present and strictly before conversion_start_date"
          - "disclosure_lead_days >= DISCLOSURE_MIN_LEAD_DAYS"
          - "disclosure_channels contains MAIL"
        side_effects:
          - "status := DISCLOSED, customer_disclosure_sent_at and disclosure_lead_days recorded"
      - from: DISCLOSED
        to: CONVERTED
        trigger: "POST /systems-conversion-plans/{id}/convert"
        actor: Filer
        preconditions:
          - "the application's ApprovalDecision has status CONSUMMATED"
          - "every ApprovalCondition with condition_type SYSTEMS_CONVERSION on that decision has status SATISFIED"
        side_effects:
          - "status := CONVERTED"
          - "branches with status DESIGNATED_FOR_CLOSURE for this application become CLOSED and every affected DepositMarket recomputes total_deposits_usd, participant_count and hhi_current"
        note: "Guarded by a different entity's state: a DISCLOSED plan cannot convert until the decision is CONSUMMATED."

  - entity: CommitmentPerformanceReport
    state_field: status
    initial_state: FILED
    terminal_states: []
    transitions:
      - from: FILED
        to: ACCEPTED
        trigger: "POST /performance-reports/{id}/review"
        actor: ComplianceMonitor
        preconditions:
          - "plan.status == EXECUTED"
          - "the server-derived fulfillment_pct >= DEFICIENCY_THRESHOLD_PCT"
        side_effects:
          - "status := ACCEPTED, reviewed_at, reviewed_by_user_id recorded"
          - "credited_usd is applied to each CommitmentLineItem.credited_usd, capped per item at committed_usd"
          - "plan.credited_to_date_usd increases by credited_usd and remaining_commitment_usd decreases by the same amount"
          - "plan.consecutive_deficient_periods := 0 and compliance_status is recomputed"
          - "plan.filed_report_count := plan.filed_report_count + 1"
      - from: FILED
        to: DEFICIENT
        trigger: "POST /performance-reports/{id}/review"
        actor: ComplianceMonitor
        preconditions:
          - "plan.status == EXECUTED"
          - "the server-derived fulfillment_pct < DEFICIENCY_THRESHOLD_PCT"
        side_effects:
          - "cascade link 1: status := DEFICIENT, reviewed_at, reviewed_by_user_id recorded, and credited_usd is still applied to the line-item and plan ledgers"
          - "cascade link 2 (caused by link 1): plan.consecutive_deficient_periods := plan.consecutive_deficient_periods + 1 and compliance_status := WATCH at 1, DEFICIENT at CONSECUTIVE_DEFICIENT_BREACH or more"
          - "plan.filed_report_count := plan.filed_report_count + 1"
          - "cascade link 3 (caused by link 2): the OPEN COMMUNITY_BENEFITS ApprovalCondition becomes BREACHED once consecutive_deficient_periods >= CONSECUTIVE_DEFICIENT_BREACH"
          - "cascade link 4 (caused by link 3): MergerApplication.post_closing_monitoring_status := ESCALATED"
      - from: ACCEPTED
        to: FILED
        trigger: "POST /performance-reports/{id}/reopen"
        actor: ComplianceMonitor
        preconditions:
          - "no later CommitmentPerformanceReport of the same plan has been reviewed"
        side_effects:
          - "status := FILED, reviewed_at and reviewed_by_user_id := null"
          - "credited_usd is decredited from each CommitmentLineItem.credited_usd by exactly the amount applied at review"
          - "plan.credited_to_date_usd and remaining_commitment_usd return to their pre-review values"
          - "plan.filed_report_count := plan.filed_report_count - 1 and compliance_status is recomputed"
      - from: DEFICIENT
        to: FILED
        trigger: "POST /performance-reports/{id}/reopen"
        actor: ComplianceMonitor
        preconditions:
          - "no later CommitmentPerformanceReport of the same plan has been reviewed"
        side_effects:
          - "status := FILED, reviewed_at and reviewed_by_user_id := null"
          - "credited_usd is decredited from each CommitmentLineItem.credited_usd by exactly the amount applied at review"
          - "plan.consecutive_deficient_periods := plan.consecutive_deficient_periods - 1 and compliance_status is recomputed"
          - "plan.filed_report_count := plan.filed_report_count - 1"
          - "an ApprovalCondition that was BREACHED by this review returns to OPEN when consecutive_deficient_periods drops below CONSECUTIVE_DEFICIENT_BREACH, and MergerApplication.post_closing_monitoring_status := MONITORING"
        note: "Compensating edge: the ledger partition credited_to_date_usd + remaining_commitment_usd == total_committed_usd holds before and after the review/reopen pair."

concurrency_rules:
  - rule_id: pro-forma-schedule-create-stale-application
    parent_entity: MergerApplication
    write_endpoint: "POST /pro-forma-schedules"
    occ_field: "expected_application_version"
    description: |
      Creating a ProFormaCapitalSchedule against a MergerApplication whose
      version has advanced since the client last read it is rejected. A new
      schedule for a given basis legitimately supersedes the prior CURRENT
      schedule of that basis, so the request is valid on its own terms; the
      stale version is the only signal that the client's view of the
      application — including which schedule is CURRENT and which capital
      figures the submit gate will read — is out of date.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
  - rule_id: benefits-plan-create-stale-application
    parent_entity: MergerApplication
    write_endpoint: "POST /community-benefits-plans"
    occ_field: "expected_application_version"
    description: |
      Creating a CommunityBenefitsPlan against a MergerApplication whose
      version has advanced since the client last read it is rejected. A new
      PROPOSED plan legitimately supersedes the application's prior PROPOSED
      plan, so the write is not blocked by any state precondition; the stale
      version is the only signal that the client is negotiating against an
      outdated commitment baseline.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

calculations:
  - name: market_deposit_aggregation
    trigger: "on Branch creation, on any Branch status change, and on branch reassignment during consummation"
    algorithm: aggregation
    formula: |
      includable(branch) = branch.status IN {OPEN, DESIGNATED_FOR_DIVESTITURE, DESIGNATED_FOR_CLOSURE}
      DepositMarket.total_deposits_usd = sum(b.deposits_usd for b in market.branches if includable(b))
      DepositMarket.participant_count = count(distinct b.institution_id
                                              for b in market.branches if includable(b))
      Institution.total_deposits_usd  = sum(b.deposits_usd for b in institution.branches if includable(b))
      Institution.branch_count        = count(b for b in institution.branches if includable(b))
      for each institution i present in the market:
        share_pct(i) = round_half_up(institution_market_deposits(i) / total_deposits_usd * 100, 4)
      DepositMarket.hhi_current = round_half_up(sum(share_pct(i) ** 2 for i in participants), 0)
    input_set: "Branch rows whose status is OPEN, DESIGNATED_FOR_DIVESTITURE or DESIGNATED_FOR_CLOSURE; DIVESTED and CLOSED branches are excluded from every aggregate"
    constants:
      INCLUDABLE_BRANCH_STATUSES: [OPEN, DESIGNATED_FOR_DIVESTITURE, DESIGNATED_FOR_CLOSURE]
    precision: "share_pct 4 decimal places round_half_up; HHI integer round_half_up; USD amounts are whole integers"
    note: "Designating a branch does NOT remove its deposits from the market base — only actual DIVESTED/CLOSED outcomes do. This keeps the mitigation arithmetic separate from the deposit base."

  - name: hhi_competitive_screen
    trigger: "POST /competitive-analyses, and recomputed whenever a branch of either party in the market changes status"
    algorithm: threshold
    formula: |
      # step 1 - pre-merger concentration, every institution counted separately
      total = DepositMarket.total_deposits_usd            # includable branches only
      share_pct(i) = round_half_up(dep(i) / total * 100, 4)
      hhi_pre_merger = round_half_up(sum(share_pct(i) ** 2 for i in participants), 0)

      # step 2 - post-merger, unmitigated: acquirer and target counted as one firm
      combined_market_deposits_usd = dep(acquirer) + dep(target)
      shares_post = shares of all other participants, plus
                    round_half_up(combined_market_deposits_usd / total * 100, 4)
      hhi_post_unmitigated  = round_half_up(sum(s ** 2 for s in shares_post), 0)
      hhi_delta_unmitigated = hhi_post_unmitigated - hhi_pre_merger

      # step 3 - screen, evaluated in this exact order
      threshold_post = HHI_POST_THRESHOLD_MSA if market_type == MSA
                       else HHI_POST_THRESHOLD_RURAL
      if hhi_post_unmitigated <  threshold_post:                     screen_result = PASS
      elif hhi_delta_unmitigated <= HHI_DELTA_SAFE_HARBOR:           screen_result = PASS
      elif hhi_post_unmitigated >= HHI_PRESUMPTION_LEVEL
           and hhi_delta_unmitigated > HHI_PRESUMPTION_DELTA:        screen_result = PRESUMPTIVE_VIOLATION
      else:                                                          screen_result = MITIGATION_REQUIRED
    input_set: "the DepositMarket's includable branches; the acquirer and the target of the application are treated as a single post-merger firm"
    constants:
      HHI_POST_THRESHOLD_MSA: 1800
      HHI_POST_THRESHOLD_RURAL: 2200
      HHI_DELTA_SAFE_HARBOR: 200
      HHI_PRESUMPTION_LEVEL: 2500
      HHI_PRESUMPTION_DELTA: 400
    precision: "share_pct 4 decimal places round_half_up; HHI values integer round_half_up"
    note: "The absolute level is tested before the delta safe harbor, and a market may PASS on either branch. hhi_delta_unmitigated exactly 200 PASSes; exactly 400 with a post level of 2500 or more is MITIGATION_REQUIRED, not PRESUMPTIVE_VIOLATION."

  - name: required_divestiture
    trigger: "POST /competitive-analyses and every recomputation of an existing CompetitiveAnalysis"
    algorithm: constraint_propagation
    formula: |
      # This rule looks circular - the divestiture amount depends on the mitigated
      # HHI, which depends on the divestiture amount. It is resolved by pinning
      # this six-step order; steps 4 and 5 never revisit steps 1-3.
      # step 4: smallest whole multiple of DIVESTITURE_STEP_USD that clears the screen,
      #         evaluated ONLY against the step-1/step-2/step-3 inputs
      if screen_result == PASS:
        required_divestiture_deposits_usd = 0
      else:
        for X in DIVESTITURE_STEP_USD, 2*DIVESTITURE_STEP_USD, ...
                 while X <= combined_market_deposits_usd:
          combined_after = combined_market_deposits_usd - X
          shares_try     = other participants' shares (unchanged)
                           + round_half_up(combined_after / total * 100, 4)
                           + round_half_up(X / total * 100, 4)      # one hypothetical entrant
          hhi_try        = round_half_up(sum(s ** 2 for s in shares_try), 0)
          delta_try      = hhi_try - hhi_pre_merger
          if hhi_try < threshold_post or delta_try <= HHI_DELTA_SAFE_HARBOR:
            required_divestiture_deposits_usd = X
            break
        else:
          required_divestiture_deposits_usd = combined_market_deposits_usd

      # step 5: what the filer has actually designated in this market
      designated_divestiture_deposits_usd =
        sum(b.deposits_usd for b in market.branches
            if b.status == DESIGNATED_FOR_DIVESTITURE
            and b.designation_application_id == application_id)
      combined_after_designation = combined_market_deposits_usd
                                   - designated_divestiture_deposits_usd
      shares_mit = other participants' shares
                   + round_half_up(combined_after_designation / total * 100, 4)
                   + (round_half_up(designated / total * 100, 4)
                      if designated > 0 else nothing)
      hhi_post_mitigated = round_half_up(sum(s ** 2 for s in shares_mit), 0)

      # step 6: mitigation verdict
      mitigation_satisfied =
        (designated_divestiture_deposits_usd >= required_divestiture_deposits_usd)
        and (hhi_post_mitigated < threshold_post
             or hhi_post_mitigated - hhi_pre_merger <= HHI_DELTA_SAFE_HARBOR)
    input_set: "the same includable branch set as hhi_competitive_screen; only DESIGNATED_FOR_DIVESTITURE branches carrying this application's designation_application_id count as mitigation - DESIGNATED_FOR_CLOSURE deposits never do"
    constants:
      DIVESTITURE_STEP_USD: 1000000
      HHI_DELTA_SAFE_HARBOR: 200
    precision: "USD whole integers; HHI integer round_half_up"
    note: "Divested deposits are attributed to exactly one hypothetical new entrant, so they keep contributing to the HHI at a smaller share rather than vanishing from the market."

  - name: pro_forma_capital_ratios
    trigger: "POST /pro-forma-schedules"
    algorithm: threshold
    formula: |
      acq = Institution[application.acquirer_id]
      tgt = Institution[application.target_id]
      intangibles_usd = goodwill_created_usd + core_deposit_intangible_usd
      pro_forma_cet1_ratio_pct   = round_half_up(cet1_numerator / rwa_denominator * 100, 2)
      pro_forma_tier1_leverage_pct = round_half_up(tier1_numerator / ata_denominator * 100, 2)
      if pro_forma_cet1_ratio_pct >= WELL_CAPITALIZED_CET1_PCT
         and pro_forma_tier1_leverage_pct >= WELL_CAPITALIZED_LEVERAGE_PCT:
        capital_adequacy_flag = WELL_CAPITALIZED
      elif pro_forma_cet1_ratio_pct >= ADEQUATE_CET1_PCT
           and pro_forma_tier1_leverage_pct >= ADEQUATE_LEVERAGE_PCT:
        capital_adequacy_flag = ADEQUATELY_CAPITALIZED
      else:
        capital_adequacy_flag = UNDERCAPITALIZED
    input_set: "the acquirer's and the target's reported capital fields plus the transaction adjustments carried on this schedule; superseded schedules are never re-read"
    constants:
      DTA_ALLOWANCE_PCT: 0.10
      STRESS_LOSS_RATE: 0.025
      STRESS_RWA_INFLATION_PCT: 0.05
      WELL_CAPITALIZED_CET1_PCT: 7.00
      WELL_CAPITALIZED_LEVERAGE_PCT: 5.00
      ADEQUATE_CET1_PCT: 4.50
      ADEQUATE_LEVERAGE_PCT: 4.00
    precision: "ratios 2 decimal places round_half_up; every intermediate USD amount truncated toward zero to a whole integer"
    variants:
      - name: REGULATORY_ADJUSTED
        when: "schedule.basis == REGULATORY_ADJUSTED - the figures filed with the regulator"
        difference: |
          pre_deduction_cet1 = (acq.cet1_capital_usd + tgt.cet1_capital_usd) - intangibles_usd
          dta_allowance_usd  = int(DTA_ALLOWANCE_PCT * pre_deduction_cet1)      # truncated
          excess_dta_usd     = max(0, deferred_tax_asset_usd - dta_allowance_usd)
          cet1_numerator     = pre_deduction_cet1 - transaction_costs_usd - excess_dta_usd
          tier1_numerator    = (acq.tier1_capital_usd + tgt.tier1_capital_usd)
                               - intangibles_usd - transaction_costs_usd - excess_dta_usd
          rwa_denominator    = (acq.risk_weighted_assets_usd + tgt.risk_weighted_assets_usd)
                               - intangibles_usd
          ata_denominator    = (acq.average_total_assets_usd + tgt.average_total_assets_usd)
                               - intangibles_usd - cash_consideration_usd
          # aoci_markdown_usd is disclosed but NOT deducted on this basis
      - name: INTERNAL_STRESS
        when: "schedule.basis == INTERNAL_STRESS - the board's downside case"
        difference: |
          credit_mark_usd = int(STRESS_LOSS_RATE * tgt.total_loans_usd)         # truncated
          cet1_numerator  = (acq.cet1_capital_usd + tgt.cet1_capital_usd)
                            - intangibles_usd - aoci_markdown_usd
                            - deferred_tax_asset_usd            # full DTA, no allowance
                            - transaction_costs_usd - credit_mark_usd
          tier1_numerator = (acq.tier1_capital_usd + tgt.tier1_capital_usd)
                            - intangibles_usd - aoci_markdown_usd
                            - deferred_tax_asset_usd
                            - transaction_costs_usd - credit_mark_usd
          rwa_denominator = (acq.risk_weighted_assets_usd + tgt.risk_weighted_assets_usd)
                            - intangibles_usd
                            + int(STRESS_RWA_INFLATION_PCT * tgt.risk_weighted_assets_usd)
          ata_denominator = (acq.average_total_assets_usd + tgt.average_total_assets_usd)
                            - intangibles_usd - cash_consideration_usd
    note: "Only a CURRENT REGULATORY_ADJUSTED schedule gates submission; an INTERNAL_STRESS schedule is informational and never blocks a filing."

  - name: management_composite_score
    trigger: "POST /merger-applications and PATCH /merger-applications/{id} whenever any examiner score changes"
    algorithm: weighted_scoring
    formula: |
      # each weighted product is rounded to 2 dp BEFORE summing; the sum is then
      # rounded again. Summing first and rounding once gives a different answer.
      p1 = round_half_up(officer_experience_score   * W_OFFICER,    2)
      p2 = round_half_up(risk_management_score      * W_RISK,       2)
      p3 = round_half_up(compliance_history_score   * W_COMPLIANCE, 2)
      p4 = round_half_up(integration_readiness_score* W_INTEGRATION,2)
      management_composite_score = round_half_up(p1 + p2 + p3 + p4, 2)
      if management_composite_score >= SATISFACTORY_FLOOR:  management_rating = SATISFACTORY
      elif management_composite_score >= CONDITIONAL_FLOOR: management_rating = CONDITIONAL
      else:                                                 management_rating = UNSATISFACTORY
    input_set: "the four examiner scores stored on the application; each is an integer 0..100"
    constants:
      W_OFFICER: 0.35
      W_RISK: 0.30
      W_COMPLIANCE: 0.175
      W_INTEGRATION: 0.175
      SATISFACTORY_FLOOR: 70.00
      CONDITIONAL_FLOOR: 55.00
    precision: "2 decimal places, round_half_up, applied per weighted product and again to the sum"
    note: "Scores 72/68/67/73 yield 70.11 under per-product rounding but 70.10 if the products are summed before rounding; the per-product order is normative."

  - name: commitment_pro_rata
    trigger: "POST /commitment-line-items and POST /community-benefits-plans/{id}/execute"
    algorithm: waterfall_allocation
    formula: |
      for each CommitmentLineItem li of the plan:
        li.annual_target_usd     = floor(li.committed_usd / plan.term_years)
        li.final_year_target_usd = li.committed_usd
                                   - li.annual_target_usd * (plan.term_years - 1)
      plan.total_committed_usd       = sum(li.committed_usd)
      plan.annual_target_total_usd   = sum(li.annual_target_usd)
      plan.quarterly_target_total_usd= floor(plan.annual_target_total_usd / 4)
      plan.remaining_commitment_usd  = plan.total_committed_usd - plan.credited_to_date_usd
    input_set: "every CommitmentLineItem of the plan"
    constants:
      QUARTERS_PER_YEAR: 4
    precision: "whole USD integers; every division floors and the final year absorbs the remainder"
    note: "The final year absorbs the rounding remainder, so sum(annual_target_usd) * term_years may be below total_committed_usd while the per-item totals still reconcile exactly."

  - name: commitment_fulfillment
    trigger: "POST /performance-reports and POST /performance-reports/{id}/review"
    algorithm: aggregation
    formula: |
      # credit is capped per category at the line item's remaining headroom
      credited_usd = 0
      excess_uncredited_usd = 0
      for (category, achieved_usd) in report.achieved_by_category:
        li = the plan's CommitmentLineItem with this category, if any
        headroom = 0 if li is None else (li.committed_usd - li.credited_usd)
        applied  = min(achieved_usd, headroom)
        credited_usd          += applied
        excess_uncredited_usd += achieved_usd - applied
      fulfillment_pct is the plan's own measurement_basis variant below;
      alternate_fulfillment_pct is the other variant computed on the same data.
      review outcome = ACCEPTED if fulfillment_pct >= DEFICIENCY_THRESHOLD_PCT
                       else DEFICIENT
    input_set: "the report's achieved_by_category map, the plan's frozen quarterly_target_total_usd, and — for the cumulative variant — credited_usd of every ACCEPTED or DEFICIENT report of the plan up to and including this one"
    constants:
      DEFICIENCY_THRESHOLD_PCT: 90.00
      CONSECUTIVE_DEFICIENT_BREACH: 2
    precision: "percentages 2 decimal places round_half_up; USD whole integers"
    variants:
      - name: ANNUAL_PRO_RATA
        when: "plan.measurement_basis == ANNUAL_PRO_RATA - each quarter is judged on its own"
        difference: |
          fulfillment_pct = round_half_up(credited_usd
                                          / plan.quarterly_target_total_usd * 100, 2)
      - name: CUMULATIVE_TO_DATE
        when: "plan.measurement_basis == CUMULATIVE_TO_DATE - a strong quarter carries a weak one"
        difference: |
          cumulative = sum(r.credited_usd for r in the plan's reports
                           with period_index <= this report's period_index
                           and status IN {ACCEPTED, DEFICIENT}) + credited_usd
                       # (this report's own credit counted exactly once)
          fulfillment_pct = round_half_up(cumulative
                                          / (plan.quarterly_target_total_usd
                                             * report.period_index) * 100, 2)
    note: "Identical report data can be ACCEPTED on one basis and DEFICIENT on the other; the plan's stored measurement_basis decides the outcome and the other basis is retained only as alternate_fulfillment_pct."

  - name: competitive_posture_rollup
    trigger: "any create or recompute of a CompetitiveAnalysis, any Branch designation or rescission"
    algorithm: aggregation
    formula: |
      analyses = CompetitiveAnalysis rows of this application
      if analyses is empty:                       competitive_posture = NOT_ANALYZED
      elif any(a.screen_result == PRESUMPTIVE_VIOLATION
               and not a.mitigation_satisfied):   competitive_posture = BLOCKED
      elif any(a.screen_result == MITIGATION_REQUIRED
               and not a.mitigation_satisfied):   competitive_posture = MITIGATION_REQUIRED
      elif any(a.screen_result != PASS):          competitive_posture = CLEARED_WITH_DIVESTITURE
      else:                                       competitive_posture = CLEARED
    input_set: "every CompetitiveAnalysis of the application; the worst market decides the posture"
    constants:
      SEVERITY_ORDER: [BLOCKED, MITIGATION_REQUIRED, CLEARED_WITH_DIVESTITURE, CLEARED]
    precision: "not applicable - enum result"
    note: "A market that failed its screen but is fully mitigated yields CLEARED_WITH_DIVESTITURE, which still unblocks a decision but records that divestiture was needed."

  - name: statutory_waiting_period
    trigger: "POST /approval-decisions"
    algorithm: threshold
    formula: |
      base = BASE_WAIT_HOLDCO_DAYS if application.structure == HOLDCO_ACQUISITION
             else BASE_WAIT_BANK_DAYS
      hearing_granted   = any HearingRequest of the application has status GRANTED
      unresolved        = application.unresolved_protest_count > 0
      max_delta         = max(a.hhi_delta_unmitigated for a in analyses) if analyses else 0
      expedited_processing = (not unresolved) and (not hearing_granted)
                             and max_delta <= HHI_DELTA_SAFE_HARBOR
                             and application.management_rating == SATISFACTORY
      days = base
      if hearing_granted: days += HEARING_WAIT_ADDITION_DAYS
      if unresolved:      days += PROTEST_WAIT_ADDITION_DAYS
      if expedited_processing: days -= EXPEDITED_WAIT_REDUCTION_DAYS
      waiting_period_days        = max(MIN_WAIT_DAYS, days)
      consummation_window_open_at= decided_at + waiting_period_days days
      consummation_deadline_at   = decided_at + CONSUMMATION_DEADLINE_DAYS days
    input_set: "the application's structure, its hearing requests, its unresolved protest count, its analyses and its management_rating, all read at the moment the decision is issued"
    constants:
      BASE_WAIT_BANK_DAYS: 15
      BASE_WAIT_HOLDCO_DAYS: 30
      HEARING_WAIT_ADDITION_DAYS: 15
      PROTEST_WAIT_ADDITION_DAYS: 10
      EXPEDITED_WAIT_REDUCTION_DAYS: 10
      MIN_WAIT_DAYS: 5
      CONSUMMATION_DEADLINE_DAYS: 180
      HHI_DELTA_SAFE_HARBOR: 200
    precision: "whole days; all instants are UTC"
    note: "The additions and the reduction are mutually exclusive in practice because expedited_processing requires no hearing and no unresolved protest, but MIN_WAIT_DAYS still floors the result."

  - name: comment_window_semantics
    trigger: "POST /comment-periods and POST /public-comments"
    algorithm: interval_merge
    formula: |
      closes_at = opens_at + duration_days days + extended_days_total days
      # a comment period occupies the HALF-OPEN interval [opens_at, closes_at)
      overlap(p, q) = p.opens_at < q.closes_at and q.opens_at < p.closes_at
      # creating a period for an application is rejected when it overlaps any
      # existing period of that application; touching endpoints do NOT overlap,
      # so a new period may open exactly at a prior period's closes_at
      if received_at <  closes_at:                          status = RECEIVED
      elif received_at < closes_at + COMMENT_GRACE_DAYS days: status = UNTIMELY
      else:                                                 ERR_COMMENT_WINDOW_CLOSED
      substantive_protest_count = count(c for c in period.comments
                                        if c.stance == PROTEST and c.substantive
                                        and c.status IN {RECEIVED, ACKNOWLEDGED, RESPONDED})
      unresolved_protest_count  = count(c for c in the application's comments
                                        if c.stance == PROTEST and c.substantive
                                        and c.status IN {RECEIVED, ACKNOWLEDGED})
    input_set: "every PublicCommentPeriod of the application; UNTIMELY comments are stored but never counted in any protest aggregate"
    constants:
      COMMENT_GRACE_DAYS: 3
      POST_COMMENT_REVIEW_DAYS: 15
      DEFAULT_COMMENT_DURATION_DAYS: 30
      HEARING_EXTENSION_DAYS: 30
    precision: "instants are UTC to the second; the interval is half-open on the right"
    note: "Adjacent periods are legal, overlapping periods are not. The grace tail accepts a late comment as a stored record without letting it influence protest counts, hearing eligibility or the waiting period."

  - name: closure_blackout
    trigger: "POST /branches/{id}/designate with designation_type CLOSURE and POST /systems-conversion-plans"
    algorithm: interval_merge
    formula: |
      notice_lead_days = floor((planned_closure_date - notice_sent_at) / 1 day)
      # the closure occupies a CLOSED, buffered interval
      closure_window    = [notice_sent_at - CONVERSION_BUFFER_DAYS days,
                           planned_closure_date + CONVERSION_BUFFER_DAYS days]
      conversion_window = [plan.conversion_start_date, plan.conversion_end_date]  # CLOSED
      conflict = closure_window.start <= conversion_window.end
                 and conversion_window.start <= closure_window.end   # touching counts
      if notice_lead_days < CLOSURE_NOTICE_MIN_DAYS:
        ERR_CLOSURE_NOTICE_LEAD_INSUFFICIENT
      elif conflict: ERR_CONVERSION_BLACKOUT_CONFLICT
      disclosure_lead_days = floor((conversion_start_date
                                    - customer_disclosure_sent_at) / 1 day)
      if disclosure_lead_days < DISCLOSURE_MIN_LEAD_DAYS:
        ERR_DISCLOSURE_LEAD_INSUFFICIENT
    input_set: "branches of the application designated for closure and the application's SystemsConversionPlan"
    constants:
      CLOSURE_NOTICE_MIN_DAYS: 90
      CONVERSION_BUFFER_DAYS: 15
      DISCLOSURE_MIN_LEAD_DAYS: 30
    precision: "whole UTC days, floored"
    note: "Unlike the comment window this interval is closed on both ends and buffered by 15 days on each side, so two windows that merely touch after buffering are already a conflict."

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every id appearing in the request path exists, validated left to right"
    error_id: ERR_INSTITUTION_NOT_FOUND | ERR_MARKET_NOT_FOUND | ERR_BRANCH_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_SCHEDULE_NOT_FOUND | ERR_ANALYSIS_NOT_FOUND | ERR_COMMENT_PERIOD_NOT_FOUND | ERR_COMMENT_NOT_FOUND | ERR_HEARING_REQUEST_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_LINE_ITEM_NOT_FOUND | ERR_DECISION_NOT_FOUND | ERR_CONDITION_NOT_FOUND | ERR_CONVERSION_PLAN_NOT_FOUND | ERR_REPORT_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with a path parameter"
  - priority: 4
    category: existence
    check: "the request body parses, every required input field is present, every enum value is a declared member, every USD amount is a non-negative integer, every score is an integer 0..100, term_years is 1..10, duration_days is 7..90, and every timestamp is a valid UTC instant"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 5
    category: auth
    check: "for Filer-scoped operations the acting X-User-ID equals the target application's acquirer_id"
    error_id: ERR_NOT_APPLICATION_FILER
    http_status: 403
    applies_to: "PATCH /merger-applications/{id}, POST /merger-applications/{id}/submit, POST /pro-forma-schedules, POST /branches/{id}/designate, POST /branches/{id}/rescind-designation, POST /community-benefits-plans, POST /commitment-line-items, POST /community-benefits-plans/{id}/execute, POST /public-comments/{id}/respond, POST /approval-decisions/{id}/consummate, POST /systems-conversion-plans, POST /systems-conversion-plans/{id}/disclose, POST /systems-conversion-plans/{id}/convert, POST /performance-reports"
  - priority: 6
    category: auth
    check: "for PublicCommenter withdrawal the acting X-User-ID equals hearing_request.requester_user_id"
    error_id: ERR_NOT_REQUEST_OWNER
    http_status: 403
    applies_to: "POST /hearing-requests/{id}/withdraw"
  - priority: 7
    category: auth
    check: "the ApprovingOfficial issuing a decision is not the CaseAnalyst who recorded the recommendation - X-User-ID must differ from application.recommended_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /approval-decisions"
  - priority: 8
    category: existence
    check: "every foreign key carried in the request body references an existing row"
    error_id: ERR_INSTITUTION_NOT_FOUND | ERR_MARKET_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_COMMENT_PERIOD_NOT_FOUND | ERR_COMMENT_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_DECISION_NOT_FOUND
    http_status: 404
    applies_to: "all write endpoints that accept a foreign key in the body"
  - priority: 9
    category: state
    check: "expected_application_version equals the referenced MergerApplication's current version"
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
    applies_to: "POST /pro-forma-schedules, POST /community-benefits-plans"
  - priority: 10
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_APPLICATION_STATE | ERR_COMMENT_PERIOD_NOT_OPEN | ERR_INVALID_HEARING_REQUEST_STATE | ERR_INVALID_PLAN_STATE | ERR_INVALID_DECISION_STATE | ERR_INVALID_CONDITION_STATE | ERR_INVALID_CONVERSION_PLAN_STATE | ERR_INVALID_REPORT_STATE | ERR_INVALID_BRANCH_STATE
    http_status: 409
    applies_to: "every action endpoint"
  - priority: 11
    category: state
    check: "the cross-entity states the operation depends on are satisfied - both institutions ACTIVE at submission, the decision CONSUMMATED before a conversion, every comment period CLOSED before consummation, no PENDING hearing request when a period closes"
    error_id: ERR_INSTITUTION_NOT_ACTIVE | ERR_HEARING_REQUEST_PENDING | ERR_COMMENT_PERIOD_NOT_OPEN | ERR_INVALID_DECISION_STATE
    http_status: 409
    applies_to: "POST /merger-applications/{id}/submit, POST /comment-periods/{id}/close, POST /approval-decisions/{id}/consummate, POST /systems-conversion-plans/{id}/convert"
  - priority: 12
    category: business_safety
    check: "the acquirer's latest_cra_rating is OUTSTANDING or SATISFACTORY"
    error_id: ERR_CRA_RATING_INSUFFICIENT
    http_status: 422
    applies_to: "POST /merger-applications/{id}/submit"
  - priority: 13
    category: business_safety
    check: "the application's management_rating is not UNSATISFACTORY"
    error_id: ERR_MANAGEMENT_ASSESSMENT_UNSATISFACTORY
    http_status: 422
    applies_to: "POST /merger-applications/{id}/submit, POST /merger-applications/{id}/recommend"
  - priority: 14
    category: business_safety
    check: "every ApprovalCondition of the decision with timing PRE_CONSUMMATION has status SATISFIED, and every SYSTEMS_CONVERSION condition is SATISFIED before a conversion"
    error_id: ERR_CONDITION_NOT_SATISFIED
    http_status: 422
    applies_to: "POST /approval-decisions/{id}/consummate, POST /systems-conversion-plans/{id}/convert"
  - priority: 15
    category: business_safety
    check: "the application's competitive_posture is not BLOCKED"
    error_id: ERR_COMPETITIVE_POSTURE_BLOCKED
    http_status: 422
    applies_to: "POST /merger-applications/{id}/recommend, POST /approval-decisions"
  - priority: 16
    category: business_temporal
    check: "received_at is strictly before period.closes_at + COMMENT_GRACE_DAYS"
    error_id: ERR_COMMENT_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /public-comments"
  - priority: 17
    category: business_temporal
    check: "the cited comment's period has status OPEN or EXTENDED when a hearing is requested or granted"
    error_id: ERR_COMMENT_PERIOD_NOT_OPEN
    http_status: 409
    applies_to: "POST /hearing-requests, POST /hearing-requests/{id}/decide"
  - priority: 18
    category: business_temporal
    check: "the new comment period's half-open interval does not overlap any existing period of the application; touching endpoints are allowed"
    error_id: ERR_COMMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /comment-periods"
  - priority: 19
    category: business_temporal
    check: "notice_lead_days >= CLOSURE_NOTICE_MIN_DAYS for a closure designation"
    error_id: ERR_CLOSURE_NOTICE_LEAD_INSUFFICIENT
    http_status: 422
    applies_to: "POST /branches/{id}/designate"
  - priority: 20
    category: business_temporal
    check: "the buffered closure window of any DESIGNATED_FOR_CLOSURE branch of the application does not intersect the systems-conversion window"
    error_id: ERR_CONVERSION_BLACKOUT_CONFLICT
    http_status: 409
    applies_to: "POST /branches/{id}/designate, POST /systems-conversion-plans"
  - priority: 21
    category: business_temporal
    check: "disclosure_lead_days >= DISCLOSURE_MIN_LEAD_DAYS and customer_disclosure_sent_at is strictly before conversion_start_date"
    error_id: ERR_DISCLOSURE_LEAD_INSUFFICIENT
    http_status: 422
    applies_to: "POST /systems-conversion-plans/{id}/disclose"
  - priority: 22
    category: business_temporal
    check: "the current clock instant is at or after decision.consummation_window_open_at"
    error_id: ERR_WAITING_PERIOD_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /approval-decisions/{id}/consummate"
  - priority: 23
    category: business_temporal
    check: "the current clock instant is at or before decision.consummation_deadline_at"
    error_id: ERR_CONSUMMATION_WINDOW_LAPSED
    http_status: 422
    applies_to: "POST /approval-decisions/{id}/consummate"
  - priority: 24
    category: business_referential
    check: "the acquirer and the target both operate an includable branch in the market being analyzed"
    error_id: ERR_NO_MARKET_OVERLAP
    http_status: 422
    applies_to: "POST /competitive-analyses"
  - priority: 25
    category: business_referential
    check: "the cited comment is a substantive PROTEST and its period's substantive_protest_count is at least 1"
    error_id: ERR_NO_SUBSTANTIVE_PROTEST
    http_status: 422
    applies_to: "POST /hearing-requests"
  - priority: 26
    category: business_referential
    check: "a CompetitiveAnalysis exists for every DepositMarket in which both parties operate an includable branch"
    error_id: ERR_MARKET_ANALYSIS_MISSING
    http_status: 422
    applies_to: "POST /merger-applications/{id}/recommend"
  - priority: 27
    category: business_referential
    check: "a CURRENT ProFormaCapitalSchedule with basis REGULATORY_ADJUSTED exists for the application"
    error_id: ERR_PRO_FORMA_SCHEDULE_MISSING
    http_status: 422
    applies_to: "POST /merger-applications/{id}/submit"
  - priority: 28
    category: business_referential
    check: "an EXECUTED CommunityBenefitsPlan exists for the application before a performance report is filed or a COMMUNITY_BENEFITS condition is satisfied"
    error_id: ERR_BENEFITS_PLAN_NOT_EXECUTED
    http_status: 422
    applies_to: "POST /performance-reports, POST /approval-conditions/{id}/satisfy"
  - priority: 29
    category: business_constraint
    check: "the institution's primary_regulator matches its charter_type - NATIONAL requires OCC, STATE_MEMBER requires FRB, STATE_NONMEMBER and SAVINGS require FDIC"
    error_id: ERR_REGULATOR_CHARTER_MISMATCH
    http_status: 422
    applies_to: "POST /institutions"
  - priority: 30
    category: business_constraint
    check: "acquirer_id differs from target_id"
    error_id: ERR_SELF_MERGER
    http_status: 422
    applies_to: "POST /merger-applications"
  - priority: 31
    category: business_constraint
    check: "market_code is unique, at most one CompetitiveAnalysis exists per (application_id, market_id), at most one SystemsConversionPlan per application, and period_label is unique within a plan"
    error_id: ERR_DUPLICATE_MARKET_CODE | ERR_DUPLICATE_ANALYSIS | ERR_DUPLICATE_CONVERSION_PLAN | ERR_DUPLICATE_REPORT_PERIOD
    http_status: 409
    applies_to: "POST /deposit-markets, POST /competitive-analyses, POST /systems-conversion-plans, POST /performance-reports"
  - priority: 32
    category: business_constraint
    check: "period_index equals plan.filed_report_count + 1"
    error_id: ERR_REPORT_PERIOD_OUT_OF_SEQUENCE
    http_status: 422
    applies_to: "POST /performance-reports"
  - priority: 33
    category: business_constraint
    check: "both institutions report non-zero risk_weighted_assets_usd and average_total_assets_usd before a pro forma schedule is built"
    error_id: ERR_CAPITAL_DATA_MISSING
    http_status: 422
    applies_to: "POST /pro-forma-schedules"
  - priority: 34
    category: business_constraint
    check: "a CLOSURE designation carries both notice_sent_at and planned_closure_date, and a disclosure carries disclosure_channels containing MAIL"
    error_id: ERR_CLOSURE_NOTICE_REQUIRED
    http_status: 422
    applies_to: "POST /branches/{id}/designate, POST /systems-conversion-plans/{id}/disclose"
  - priority: 35
    category: business_constraint
    check: "a RESPONDED disposition carries a non-blank response_body"
    error_id: ERR_RESPONSE_BODY_REQUIRED
    http_status: 422
    applies_to: "POST /public-comments/{id}/respond"
  - priority: 36
    category: business_fiscal
    check: "the CURRENT REGULATORY_ADJUSTED schedule's capital_adequacy_flag is WELL_CAPITALIZED"
    error_id: ERR_PRO_FORMA_CAPITAL_INSUFFICIENT
    http_status: 422
    applies_to: "POST /merger-applications/{id}/submit"
  - priority: 37
    category: business_fiscal
    check: "the plan has at least one CommitmentLineItem with total_committed_usd greater than 0"
    error_id: ERR_EMPTY_BENEFITS_PLAN
    http_status: 422
    applies_to: "POST /community-benefits-plans/{id}/execute"

endpoints:
  # ---------- Institutions, markets, branches ----------
  - method: POST
    path: "/institutions"
    description: "Register a bank that can act as an acquirer, a target or a market participant."
    roles: [CaseAnalyst]
    code: 201
    input: [legal_name, charter_type, primary_regulator, "cet1_capital_usd?", "tier1_capital_usd?", "total_capital_usd?", "risk_weighted_assets_usd?", "average_total_assets_usd?", "total_loans_usd?", "latest_cra_rating?", "cra_exam_closed_at?"]
    output: Institution
    side_effects:
      - "the institution is created with status ACTIVE, total_deposits_usd 0 and branch_count 0"
      - "primary_regulator is checked against charter_type"
  - method: GET
    path: "/institutions/{id}"
    description: "Read one institution including its derived deposit total and branch count."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer, PublicCommenter]
    code: 200
    input: []
    output: Institution
    side_effects: []
  - method: GET
    path: "/institutions"
    description: "List institutions, optionally filtered by charter type, regulator or status."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer, PublicCommenter]
    code: 200
    input: ["charter_type?", "primary_regulator?", "status?", "limit?", "offset?"]
    output: Institution[]
    side_effects: []
  - method: POST
    path: "/deposit-markets"
    description: "Create a deposit market (an MSA or a rural county) in which concentration is measured."
    roles: [CaseAnalyst]
    code: 201
    input: [market_code, market_name, market_type]
    output: DepositMarket
    side_effects:
      - "the market is created with total_deposits_usd 0, participant_count 0 and hhi_current 0"
      - "market_code uniqueness is enforced"
  - method: GET
    path: "/deposit-markets/{id}"
    description: "Read one deposit market with its current aggregate deposits and HHI."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer, PublicCommenter]
    code: 200
    input: []
    output: DepositMarket
    side_effects: []
  - method: GET
    path: "/deposit-markets"
    description: "List deposit markets."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer, PublicCommenter]
    code: 200
    input: ["market_type?", "limit?", "offset?"]
    output: DepositMarket[]
    side_effects: []
  - method: POST
    path: "/branches"
    description: "Add a branch with its deposit balance to an institution in a market."
    roles: [CaseAnalyst]
    code: 201
    input: [institution_id, market_id, branch_name, deposits_usd, "service_type?"]
    output: Branch
    side_effects:
      - "the branch is created with status OPEN"
      - "runs market_deposit_aggregation: DepositMarket.total_deposits_usd, participant_count and hhi_current and the institution's total_deposits_usd and branch_count are recomputed"
      - "every CompetitiveAnalysis touching this market is recomputed"
  - method: GET
    path: "/branches/{id}"
    description: "Read one branch including its closure-notice lead days."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer, PublicCommenter]
    code: 200
    input: []
    output: Branch
    side_effects: []
  - method: GET
    path: "/branches"
    description: "List branches filtered by institution, market, designating application or status."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer, PublicCommenter]
    code: 200
    input: ["institution_id?", "market_id?", "designation_application_id?", "status?", "limit?", "offset?"]
    output: Branch[]
    side_effects: []
  - method: POST
    path: "/branches/{id}/designate"
    description: "Designate a branch of either party for divestiture or for closure under an application."
    roles: [Filer]
    code: 200
    input: [application_id, designation_type, "notice_sent_at?", "planned_closure_date?"]
    output: Branch
    side_effects:
      - "status := DESIGNATED_FOR_DIVESTITURE or DESIGNATED_FOR_CLOSURE and designation_application_id is stamped"
      - "for a CLOSURE designation notice_lead_days is computed and the buffered closure window is checked against the application's systems-conversion window"
      - "cascade: the CompetitiveAnalysis for (application_id, branch.market_id) recomputes designated_divestiture_deposits_usd, hhi_post_mitigated and mitigation_satisfied"
      - "cascade: MergerApplication.competitive_posture is re-rolled by competitive_posture_rollup"
      - "cascade: OPEN DIVESTITURE ApprovalConditions of the application's decision become SATISFIED once the posture clears"
  - method: POST
    path: "/branches/{id}/rescind-designation"
    description: "Withdraw a divestiture or closure designation and restore the branch to OPEN."
    roles: [Filer]
    code: 200
    input: []
    output: Branch
    side_effects:
      - "status := OPEN and designation_application_id, notice_sent_at, planned_closure_date, notice_lead_days are cleared"
      - "the affected CompetitiveAnalysis and the application's competitive_posture are recomputed"
      - "a DIVESTITURE ApprovalCondition satisfied by the prior designation returns to OPEN when the posture stops clearing"

  # ---------- Applications ----------
  - method: POST
    path: "/merger-applications"
    description: "Open a merger application in DRAFT between an acquirer and a target."
    roles: [Filer]
    code: 201
    input: [acquirer_id, target_id, structure, consideration_type, total_consideration_usd, "officer_experience_score?", "risk_management_score?", "compliance_history_score?", "integration_readiness_score?"]
    output: MergerApplication
    side_effects:
      - "the application is created with filing_status DRAFT, public_review_status NOT_OPEN, competitive_posture NOT_ANALYZED, amendment_round 0 and post_closing_monitoring_status NOT_APPLICABLE"
      - "runs management_composite_score to set management_composite_score and management_rating"
      - "acquirer_id must differ from target_id"
  - method: GET
    path: "/merger-applications/{id}"
    description: "Read one merger application with all of its derived review fields."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer, PublicCommenter]
    code: 200
    input: []
    output: MergerApplication
    side_effects: []
  - method: GET
    path: "/merger-applications"
    description: "List merger applications filtered by acquirer, target or filing status."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer, PublicCommenter]
    code: 200
    input: ["acquirer_id?", "target_id?", "filing_status?", "limit?", "offset?"]
    output: MergerApplication[]
    side_effects: []
  - method: PATCH
    path: "/merger-applications/{id}"
    description: "Amend the transaction structure or the examiner scores of an application that has not been decided."
    roles: [Filer, CaseAnalyst]
    code: 200
    input: ["structure?", "consideration_type?", "total_consideration_usd?", "officer_experience_score?", "risk_management_score?", "compliance_history_score?", "integration_readiness_score?"]
    output: MergerApplication
    side_effects:
      - "re-runs management_composite_score whenever any examiner score changes"
      - "increments MergerApplication.version by 1"
  - method: POST
    path: "/merger-applications/{id}/submit"
    description: "File the application with the regulator; runs the full submission gate."
    roles: [Filer]
    code: 200
    input: []
    output: MergerApplication
    side_effects:
      - "filing_status := SUBMITTED"
      - "checks both institutions are ACTIVE, the acquirer's CRA rating, the management_rating, the presence of a CURRENT REGULATORY_ADJUSTED schedule and that schedule's WELL_CAPITALIZED flag"
      - "increments MergerApplication.version by 1"
  - method: POST
    path: "/merger-applications/{id}/accept"
    description: "Accept a filed application for substantive review and open the public comment period."
    roles: [CaseAnalyst]
    code: 200
    input: []
    output: MergerApplication
    side_effects:
      - "filing_status := UNDER_REVIEW and public_review_status := OPEN_FOR_COMMENT"
      - "a PublicCommentPeriod is created for the application with duration_days DEFAULT_COMMENT_DURATION_DAYS opening at the current clock instant"
      - "increments MergerApplication.version by 1"
  - method: POST
    path: "/merger-applications/{id}/return-for-amendment"
    description: "Return a filed or in-review application to the filer for amendment."
    roles: [CaseAnalyst]
    code: 200
    input: [reason]
    output: MergerApplication
    side_effects:
      - "filing_status := RETURNED_FOR_AMENDMENT"
      - "increments MergerApplication.version by 1"
  - method: POST
    path: "/merger-applications/{id}/recommend"
    description: "Record the case analyst's recommendation once review is complete."
    roles: [CaseAnalyst]
    code: 200
    input: [recommendation]
    output: MergerApplication
    side_effects:
      - "filing_status := RECOMMENDED, recommendation and recommended_by_user_id are stamped"
      - "checks competitive_posture is not BLOCKED, management_rating is not UNSATISFACTORY and every overlapping market has a CompetitiveAnalysis"
      - "increments MergerApplication.version by 1"
  - method: GET
    path: "/merger-applications/{id}/clearance-summary"
    description: "Computed read: the consolidated competitive, capital, protest and commitment posture of an application."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer]
    code: 200
    input: []
    output: "{ application_id: string, competitive_posture: string, worst_screen_result: string, max_hhi_delta_unmitigated: integer, total_required_divestiture_usd: integer, total_designated_divestiture_usd: integer, all_markets_mitigated: boolean, current_regulatory_cet1_pct: number, current_regulatory_capital_flag: string, substantive_protest_count: integer, unresolved_protest_count: integer, granted_hearing_count: integer, earliest_decision_at: string, expedited_eligible: boolean, projected_waiting_period_days: integer }"
    side_effects: []

  # ---------- Pro forma capital ----------
  - method: POST
    path: "/pro-forma-schedules"
    description: "Build a pro forma capital schedule for an application on one of the two bases; a new schedule supersedes the prior CURRENT schedule of the same basis."
    roles: [Filer, CaseAnalyst]
    code: 201
    input: [application_id, expected_application_version, basis, goodwill_created_usd, core_deposit_intangible_usd, aoci_markdown_usd, deferred_tax_asset_usd, transaction_costs_usd, cash_consideration_usd]
    output: ProFormaCapitalSchedule
    side_effects:
      - "runs pro_forma_capital_ratios on the requested basis and stores pro_forma_cet1_ratio_pct, pro_forma_tier1_leverage_pct and capital_adequacy_flag"
      - "the prior CURRENT schedule of the same basis for this application becomes SUPERSEDED"
      - "increments MergerApplication.version by 1"
  - method: GET
    path: "/pro-forma-schedules/{id}"
    description: "Read one pro forma capital schedule."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer]
    code: 200
    input: []
    output: ProFormaCapitalSchedule
    side_effects: []
  - method: GET
    path: "/pro-forma-schedules"
    description: "List pro forma capital schedules filtered by application, basis or status."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer]
    code: 200
    input: ["application_id?", "basis?", "status?", "limit?", "offset?"]
    output: ProFormaCapitalSchedule[]
    side_effects: []

  # ---------- Competitive analysis ----------
  - method: POST
    path: "/competitive-analyses"
    description: "Run the deposit-market concentration screen for one market of an application."
    roles: [CaseAnalyst]
    code: 201
    input: [application_id, market_id]
    output: CompetitiveAnalysis
    side_effects:
      - "runs hhi_competitive_screen and required_divestiture, storing hhi_pre_merger, hhi_post_unmitigated, hhi_delta_unmitigated, screen_result, required_divestiture_deposits_usd, designated_divestiture_deposits_usd, hhi_post_mitigated and mitigation_satisfied"
      - "cascade: MergerApplication.competitive_posture is re-rolled by competitive_posture_rollup"
      - "requires both parties to hold an includable branch in the market and rejects a duplicate analysis for the same (application_id, market_id)"
  - method: GET
    path: "/competitive-analyses/{id}"
    description: "Read one competitive analysis with its pre, post and mitigated concentration figures."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer, PublicCommenter]
    code: 200
    input: []
    output: CompetitiveAnalysis
    side_effects: []
  - method: GET
    path: "/competitive-analyses"
    description: "List competitive analyses filtered by application, market or screen result."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer, PublicCommenter]
    code: 200
    input: ["application_id?", "market_id?", "screen_result?", "limit?", "offset?"]
    output: CompetitiveAnalysis[]
    side_effects: []

  # ---------- Public comment ----------
  - method: POST
    path: "/comment-periods"
    description: "Open an additional public comment period for an application; the interval must not overlap an existing period."
    roles: [CaseAnalyst]
    code: 201
    input: [application_id, opens_at, "duration_days?"]
    output: PublicCommentPeriod
    side_effects:
      - "the period is created with status OPEN and closes_at = opens_at + duration_days"
      - "the half-open interval is checked against every existing period of the application; touching endpoints are allowed"
      - "MergerApplication.public_review_status := OPEN_FOR_COMMENT"
  - method: GET
    path: "/comment-periods/{id}"
    description: "Read one public comment period with its comment and protest counts."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer, PublicCommenter]
    code: 200
    input: []
    output: PublicCommentPeriod
    side_effects: []
  - method: GET
    path: "/comment-periods"
    description: "List public comment periods filtered by application or status."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer, PublicCommenter]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: PublicCommentPeriod[]
    side_effects: []
  - method: POST
    path: "/comment-periods/{id}/close"
    description: "Close a public comment period once no hearing request against it is still pending."
    roles: [CaseAnalyst]
    code: 200
    input: []
    output: PublicCommentPeriod
    side_effects:
      - "status := CLOSED"
      - "MergerApplication.public_review_status := COMMENT_CLOSED once every period of the application is CLOSED"
      - "MergerApplication.earliest_decision_at := closes_at + POST_COMMENT_REVIEW_DAYS"
  - method: POST
    path: "/public-comments"
    description: "File a public comment or protest against an application during a comment period."
    roles: [PublicCommenter]
    code: 201
    input: [period_id, commenter_name, commenter_type, stance, body, "substantive?"]
    output: PublicComment
    side_effects:
      - "received_at is stamped from the logical clock; the comment is created with status RECEIVED, or UNTIMELY when received_at falls inside the COMMENT_GRACE_DAYS tail after closes_at"
      - "commenter_user_id is taken from the acting X-User-ID"
      - "PublicCommentPeriod.comment_count and substantive_protest_count and MergerApplication.substantive_protest_count and unresolved_protest_count are recomputed; UNTIMELY comments are excluded from every protest aggregate"
      - "MergerApplication.public_review_status := PROTEST_PENDING when a substantive PROTEST is recorded"
  - method: GET
    path: "/public-comments/{id}"
    description: "Read one public comment."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer, PublicCommenter]
    code: 200
    input: []
    output: PublicComment
    side_effects: []
  - method: GET
    path: "/public-comments"
    description: "List public comments filtered by period, stance or status."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer, PublicCommenter]
    code: 200
    input: ["period_id?", "stance?", "status?", "limit?", "offset?"]
    output: PublicComment[]
    side_effects: []
  - method: POST
    path: "/public-comments/{id}/respond"
    description: "Acknowledge or fully respond to a comment as the filer; only a full response resolves a protest."
    roles: [Filer]
    code: 200
    input: [disposition, "response_body?"]
    output: PublicComment
    side_effects:
      - "status := ACKNOWLEDGED or RESPONDED and responded_at is stamped"
      - "a RESPONDED disposition requires a non-blank response_body"
      - "MergerApplication.unresolved_protest_count is recomputed and public_review_status may return to OPEN_FOR_COMMENT"

  # ---------- Hearing requests ----------
  - method: POST
    path: "/hearing-requests"
    description: "Request a public hearing on the basis of a substantive protest."
    roles: [PublicCommenter]
    code: 201
    input: [application_id, comment_id, basis]
    output: HearingRequest
    side_effects:
      - "the request is created with status PENDING, requested_at stamped from the logical clock and requester_user_id taken from the acting X-User-ID"
      - "requires the cited comment to be a substantive PROTEST in an OPEN or EXTENDED period"
      - "MergerApplication.public_review_status := HEARING_PENDING"
  - method: GET
    path: "/hearing-requests/{id}"
    description: "Read one hearing request with its decision and granted extension."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer, PublicCommenter]
    code: 200
    input: []
    output: HearingRequest
    side_effects: []
  - method: GET
    path: "/hearing-requests"
    description: "List hearing requests filtered by application, cited comment or status."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer, PublicCommenter]
    code: 200
    input: ["application_id?", "comment_id?", "status?", "limit?", "offset?"]
    output: HearingRequest[]
    side_effects: []
  - method: POST
    path: "/hearing-requests/{id}/decide"
    description: "Grant or deny a hearing request; a grant extends the cited comment period."
    roles: [ApprovingOfficial]
    code: 200
    input: [outcome, decision_rationale]
    output: HearingRequest
    side_effects:
      - "cascade level 1: status := GRANTED or DENIED with decided_at and decided_by_user_id stamped"
      - "cascade level 2 on GRANTED: the cited PublicCommentPeriod moves OPEN -> EXTENDED, extension_count += 1 and closes_at advances by HEARING_EXTENSION_DAYS"
      - "cascade level 3 on GRANTED: MergerApplication.public_review_status := HEARING_GRANTED and earliest_decision_at := extended closes_at + POST_COMMENT_REVIEW_DAYS"
      - "on DENIED the period and earliest_decision_at are untouched and public_review_status falls back to PROTEST_PENDING or OPEN_FOR_COMMENT"
  - method: POST
    path: "/hearing-requests/{id}/withdraw"
    description: "Withdraw a pending hearing request as its original requester."
    roles: [PublicCommenter]
    code: 200
    input: []
    output: HearingRequest
    side_effects:
      - "status := WITHDRAWN"
      - "MergerApplication.public_review_status falls back to PROTEST_PENDING or OPEN_FOR_COMMENT"

  # ---------- Community benefits ----------
  - method: POST
    path: "/community-benefits-plans"
    description: "Propose a community benefits plan for an application; a new proposal supersedes the prior PROPOSED plan."
    roles: [Filer]
    code: 201
    input: [application_id, expected_application_version, term_years, "measurement_basis?"]
    output: CommunityBenefitsPlan
    side_effects:
      - "the plan is created with status PROPOSED and all monetary aggregates at 0"
      - "the application's prior PROPOSED plan becomes SUPERSEDED"
      - "increments MergerApplication.version by 1"
  - method: GET
    path: "/community-benefits-plans/{id}"
    description: "Read one community benefits plan with its targets, credits and compliance status."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer, PublicCommenter]
    code: 200
    input: []
    output: CommunityBenefitsPlan
    side_effects: []
  - method: GET
    path: "/community-benefits-plans"
    description: "List community benefits plans filtered by application or status."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer, PublicCommenter]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: CommunityBenefitsPlan[]
    side_effects: []
  - method: POST
    path: "/commitment-line-items"
    description: "Add a dollar commitment in one category to a proposed plan."
    roles: [Filer]
    code: 201
    input: [plan_id, category, committed_usd]
    output: CommitmentLineItem
    side_effects:
      - "runs commitment_pro_rata: annual_target_usd and final_year_target_usd are set on the item and the plan's total_committed_usd, annual_target_total_usd and quarterly_target_total_usd are recomputed"
      - "rejected once the plan has left PROPOSED"
  - method: GET
    path: "/commitment-line-items/{id}"
    description: "Read one commitment line item with its pro-rata targets and credited amount."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer, PublicCommenter]
    code: 200
    input: []
    output: CommitmentLineItem
    side_effects: []
  - method: GET
    path: "/commitment-line-items"
    description: "List the commitment line items of a plan."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer, PublicCommenter]
    code: 200
    input: ["plan_id?", "category?", "limit?", "offset?"]
    output: CommitmentLineItem[]
    side_effects: []
  - method: POST
    path: "/community-benefits-plans/{id}/execute"
    description: "Execute a proposed plan, freezing its pro-rata targets for the monitoring period."
    roles: [Filer]
    code: 200
    input: []
    output: CommunityBenefitsPlan
    side_effects:
      - "status := EXECUTED and the pro-rata targets are frozen"
      - "compliance_status := COMPLIANT, credited_to_date_usd := 0 and remaining_commitment_usd := total_committed_usd"
      - "rejected when the plan has no commitment line items"

  # ---------- Decision, conditions, consummation ----------
  - method: POST
    path: "/approval-decisions"
    description: "Issue the regulator's decision on a recommended application and compute the statutory waiting period."
    roles: [ApprovingOfficial]
    code: 201
    input: [application_id, decision]
    output: ApprovalDecision
    side_effects:
      - "decided_at is stamped from the logical clock, then statutory_waiting_period sets expedited_processing, waiting_period_days, consummation_window_open_at and consummation_deadline_at"
      - "on APPROVED or CONDITIONALLY_APPROVED the decision is ISSUED and MergerApplication.filing_status := DECIDED"
      - "on DENIED the decision is CLOSED, MergerApplication.filing_status := DENIED and every designated branch reverts to OPEN"
      - "the acting X-User-ID must differ from application.recommended_by_user_id"
      - "increments MergerApplication.version by 1"
  - method: GET
    path: "/approval-decisions/{id}"
    description: "Read one approval decision with its waiting period and consummation window."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer, PublicCommenter]
    code: 200
    input: []
    output: ApprovalDecision
    side_effects: []
  - method: GET
    path: "/approval-decisions"
    description: "List approval decisions filtered by application or status."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer, PublicCommenter]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: ApprovalDecision[]
    side_effects: []
  - method: POST
    path: "/approval-conditions"
    description: "Attach a pre-consummation or post-closing condition to an issued decision."
    roles: [ApprovingOfficial]
    code: 201
    input: [decision_id, condition_type, timing, description, "threshold_usd?"]
    output: ApprovalCondition
    side_effects:
      - "the condition is created with status OPEN"
  - method: GET
    path: "/approval-conditions/{id}"
    description: "Read one approval condition."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer, PublicCommenter]
    code: 200
    input: []
    output: ApprovalCondition
    side_effects: []
  - method: GET
    path: "/approval-conditions"
    description: "List approval conditions filtered by decision, timing or status."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer, PublicCommenter]
    code: 200
    input: ["decision_id?", "timing?", "status?", "condition_type?", "limit?", "offset?"]
    output: ApprovalCondition[]
    side_effects: []
  - method: POST
    path: "/approval-conditions/{id}/satisfy"
    description: "Record a condition as satisfied, or cure a previously breached condition."
    roles: [ComplianceMonitor]
    code: 200
    input: []
    output: ApprovalCondition
    side_effects:
      - "status := SATISFIED with satisfied_at and satisfied_by_user_id stamped"
      - "a DIVESTITURE condition requires the application's competitive_posture to be CLEARED or CLEARED_WITH_DIVESTITURE"
      - "a COMMUNITY_BENEFITS condition requires an EXECUTED plan and, when curing a breach, consecutive_deficient_periods back at 0"
      - "MergerApplication.post_closing_monitoring_status := MONITORING once no condition of the decision is BREACHED"
  - method: POST
    path: "/approval-decisions/{id}/consummate"
    description: "Consummate the transaction inside the approved window once every pre-consummation condition is satisfied."
    roles: [Filer]
    code: 200
    input: []
    output: ApprovalDecision
    side_effects:
      - "status := CONSUMMATED with consummated_at stamped"
      - "MergerApplication.filing_status := CONSUMMATED and post_closing_monitoring_status := MONITORING"
      - "the target Institution moves to MERGED_OUT and its OPEN branches are reassigned to the acquirer"
      - "branches DESIGNATED_FOR_DIVESTITURE under this application become DIVESTED and every affected DepositMarket recomputes total_deposits_usd, participant_count and hhi_current"
      - "an attempt after consummation_deadline_at sets status := LAPSED"

  # ---------- Systems conversion ----------
  - method: POST
    path: "/systems-conversion-plans"
    description: "Register the core-systems conversion window for an application; at most one plan per application."
    roles: [Filer]
    code: 201
    input: [application_id, conversion_start_date, conversion_end_date, affected_customer_count]
    output: SystemsConversionPlan
    side_effects:
      - "the plan is created with status DRAFT"
      - "the conversion window is checked against the buffered closure window of every DESIGNATED_FOR_CLOSURE branch of the application"
  - method: GET
    path: "/systems-conversion-plans/{id}"
    description: "Read one systems conversion plan with its disclosure lead days."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer]
    code: 200
    input: []
    output: SystemsConversionPlan
    side_effects: []
  - method: GET
    path: "/systems-conversion-plans"
    description: "List systems conversion plans filtered by application or status."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: SystemsConversionPlan[]
    side_effects: []
  - method: POST
    path: "/systems-conversion-plans/{id}/disclose"
    description: "Send the customer conversion disclosure; enforces the minimum disclosure lead time."
    roles: [Filer]
    code: 200
    input: [disclosure_channels]
    output: SystemsConversionPlan
    side_effects:
      - "status := DISCLOSED, customer_disclosure_sent_at is stamped from the logical clock and disclosure_lead_days is computed"
      - "disclosure_channels must contain MAIL and the lead time must be at least DISCLOSURE_MIN_LEAD_DAYS"
  - method: POST
    path: "/systems-conversion-plans/{id}/convert"
    description: "Complete the systems conversion after consummation, closing every branch designated for closure."
    roles: [Filer]
    code: 200
    input: []
    output: SystemsConversionPlan
    side_effects:
      - "status := CONVERTED"
      - "requires the application's ApprovalDecision to be CONSUMMATED and every SYSTEMS_CONVERSION condition SATISFIED"
      - "branches DESIGNATED_FOR_CLOSURE under this application become CLOSED and every affected DepositMarket recomputes total_deposits_usd, participant_count and hhi_current"

  # ---------- Post-closing monitoring ----------
  - method: POST
    path: "/performance-reports"
    description: "File a quarterly commitment performance report against an executed plan."
    roles: [Filer]
    code: 201
    input: [plan_id, period_label, period_index, achieved_by_category]
    output: CommitmentPerformanceReport
    side_effects:
      - "the report is created with status FILED and filed_at stamped from the logical clock"
      - "runs commitment_fulfillment to store credited_usd, excess_uncredited_usd, measurement_basis, fulfillment_pct and alternate_fulfillment_pct without yet touching the plan ledger"
      - "period_index must equal plan.filed_report_count + 1 and period_label must be unique within the plan"
  - method: GET
    path: "/performance-reports/{id}"
    description: "Read one commitment performance report with both fulfillment measures."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer, PublicCommenter]
    code: 200
    input: []
    output: CommitmentPerformanceReport
    side_effects: []
  - method: GET
    path: "/performance-reports"
    description: "List commitment performance reports filtered by plan or status."
    roles: [CaseAnalyst, ApprovingOfficial, ComplianceMonitor, Filer, PublicCommenter]
    code: 200
    input: ["plan_id?", "status?", "limit?", "offset?"]
    output: CommitmentPerformanceReport[]
    side_effects: []
  - method: POST
    path: "/performance-reports/{id}/review"
    description: "Review a filed report; the server derives acceptance from the plan's measurement basis and applies the credits."
    roles: [ComplianceMonitor]
    code: 200
    input: []
    output: CommitmentPerformanceReport
    side_effects:
      - "cascade level 1: status := ACCEPTED or DEFICIENT, reviewed_at and reviewed_by_user_id stamped, and credited_usd applied to every CommitmentLineItem and to the plan ledger"
      - "cascade level 2: plan.consecutive_deficient_periods and compliance_status are recomputed and filed_report_count advances"
      - "cascade level 3: the OPEN COMMUNITY_BENEFITS ApprovalCondition becomes BREACHED at CONSECUTIVE_DEFICIENT_BREACH consecutive deficient periods"
      - "cascade level 4: MergerApplication.post_closing_monitoring_status := ESCALATED"
  - method: POST
    path: "/performance-reports/{id}/reopen"
    description: "Reopen the most recently reviewed report, exactly reversing its credits and its compliance effects."
    roles: [ComplianceMonitor]
    code: 200
    input: []
    output: CommitmentPerformanceReport
    side_effects:
      - "status := FILED and the review stamps are cleared"
      - "the credits applied at review are removed from every CommitmentLineItem and from the plan ledger, restoring credited_to_date_usd and remaining_commitment_usd exactly"
      - "consecutive_deficient_periods, compliance_status and filed_report_count are rolled back and a condition breached by this review returns to OPEN"

  # ---------- Test-driving surface ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [CaseAnalyst]
    code: 200
    input: [now]
    output: "{ now: string }"
    side_effects:
      - "every subsequent waiting-period, comment-window, disclosure-lead and closure-notice evaluation reads this instant"

errors:
  # --- authentication and authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID is missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_APPLICATION_FILER
    http: 403
    condition: "a Filer acts on an application whose acquirer_id differs from the acting X-User-ID"
  - id: ERR_NOT_REQUEST_OWNER
    http: 403
    condition: "a PublicCommenter withdraws a hearing request they did not file"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the ApprovingOfficial issuing the decision is the same user id that recorded the recommendation"
  # --- not found ---
  - id: ERR_INSTITUTION_NOT_FOUND
    http: 404
    condition: "the referenced institution id does not exist"
  - id: ERR_MARKET_NOT_FOUND
    http: 404
    condition: "the referenced deposit market id does not exist"
  - id: ERR_BRANCH_NOT_FOUND
    http: 404
    condition: "the referenced branch id does not exist"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "the referenced merger application id does not exist"
  - id: ERR_SCHEDULE_NOT_FOUND
    http: 404
    condition: "the referenced pro forma capital schedule id does not exist"
  - id: ERR_ANALYSIS_NOT_FOUND
    http: 404
    condition: "the referenced competitive analysis id does not exist"
  - id: ERR_COMMENT_PERIOD_NOT_FOUND
    http: 404
    condition: "the referenced public comment period id does not exist"
  - id: ERR_COMMENT_NOT_FOUND
    http: 404
    condition: "the referenced public comment id does not exist"
  - id: ERR_HEARING_REQUEST_NOT_FOUND
    http: 404
    condition: "the referenced hearing request id does not exist"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "the referenced community benefits plan id does not exist"
  - id: ERR_LINE_ITEM_NOT_FOUND
    http: 404
    condition: "the referenced commitment line item id does not exist"
  - id: ERR_DECISION_NOT_FOUND
    http: 404
    condition: "the referenced approval decision id does not exist"
  - id: ERR_CONDITION_NOT_FOUND
    http: 404
    condition: "the referenced approval condition id does not exist"
  - id: ERR_CONVERSION_PLAN_NOT_FOUND
    http: 404
    condition: "the referenced systems conversion plan id does not exist"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "the referenced commitment performance report id does not exist"
  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required field is missing, an enum value is not declared, a USD amount is negative or non-integer, a score falls outside 0..100, term_years falls outside 1..10, duration_days falls outside 7..90, or a timestamp is unparseable"
  # --- optimistic concurrency ---
  - id: ERR_STALE_APPLICATION_VERSION
    http: 412
    condition: "expected_application_version does not equal the application's current version"
  # --- own-resource state ---
  - id: ERR_INVALID_APPLICATION_STATE
    http: 409
    condition: "the application's filing_status does not admit the requested transition"
  - id: ERR_INVALID_BRANCH_STATE
    http: 409
    condition: "the branch's status does not admit the requested designation or rescission"
  - id: ERR_COMMENT_PERIOD_NOT_OPEN
    http: 409
    condition: "the comment period is not OPEN or EXTENDED when the operation requires an open window"
  - id: ERR_INVALID_HEARING_REQUEST_STATE
    http: 409
    condition: "the hearing request is no longer PENDING"
  - id: ERR_INVALID_PLAN_STATE
    http: 409
    condition: "the community benefits plan is not PROPOSED when it must be, or not EXECUTED when it must be"
  - id: ERR_INVALID_DECISION_STATE
    http: 409
    condition: "the approval decision is not ISSUED, or is not CONSUMMATED when a downstream step requires consummation"
  - id: ERR_DECISION_ALREADY_ISSUED
    http: 409
    condition: "a second approval decision is issued for an application that already has one"
  - id: ERR_INVALID_CONDITION_STATE
    http: 409
    condition: "the approval condition is already SATISFIED"
  - id: ERR_INVALID_CONVERSION_PLAN_STATE
    http: 409
    condition: "the systems conversion plan is not DRAFT for a disclosure or not DISCLOSED for a conversion"
  - id: ERR_INVALID_REPORT_STATE
    http: 409
    condition: "the performance report is not FILED for a review, is already FILED for a reopen, or a later report of the plan has already been reviewed"
  # --- cross-entity state ---
  - id: ERR_INSTITUTION_NOT_ACTIVE
    http: 409
    condition: "the acquirer or the target is MERGED_OUT at submission"
  - id: ERR_HEARING_REQUEST_PENDING
    http: 409
    condition: "a comment period is closed while a hearing request citing one of its comments is still PENDING"
  # --- business safety ---
  - id: ERR_CRA_RATING_INSUFFICIENT
    http: 422
    condition: "the acquirer's latest_cra_rating is NEEDS_TO_IMPROVE or SUBSTANTIAL_NONCOMPLIANCE at submission"
  - id: ERR_MANAGEMENT_ASSESSMENT_UNSATISFACTORY
    http: 422
    condition: "the application's management_rating is UNSATISFACTORY"
  - id: ERR_CONDITION_NOT_SATISFIED
    http: 422
    condition: "a PRE_CONSUMMATION condition is still OPEN or BREACHED at consummation, or a SYSTEMS_CONVERSION condition is unsatisfied at conversion"
  - id: ERR_COMPETITIVE_POSTURE_BLOCKED
    http: 422
    condition: "the application's competitive_posture is BLOCKED"
  # --- business temporal ---
  - id: ERR_COMMENT_WINDOW_CLOSED
    http: 422
    condition: "received_at is at or after closes_at plus COMMENT_GRACE_DAYS"
  - id: ERR_COMMENT_PERIOD_OVERLAP
    http: 409
    condition: "a new comment period's half-open interval intersects an existing period of the same application"
  - id: ERR_CLOSURE_NOTICE_LEAD_INSUFFICIENT
    http: 422
    condition: "notice_lead_days is below CLOSURE_NOTICE_MIN_DAYS for a closure designation"
  - id: ERR_CONVERSION_BLACKOUT_CONFLICT
    http: 409
    condition: "a buffered branch-closure window intersects the systems-conversion window of the same application"
  - id: ERR_DISCLOSURE_LEAD_INSUFFICIENT
    http: 422
    condition: "disclosure_lead_days is below DISCLOSURE_MIN_LEAD_DAYS, or the disclosure is dated at or after conversion_start_date"
  - id: ERR_WAITING_PERIOD_NOT_ELAPSED
    http: 422
    condition: "consummation is attempted before consummation_window_open_at"
  - id: ERR_CONSUMMATION_WINDOW_LAPSED
    http: 422
    condition: "consummation is attempted after consummation_deadline_at"
  # --- business referential ---
  - id: ERR_NO_MARKET_OVERLAP
    http: 422
    condition: "an analysis is requested for a market where the acquirer and the target do not both hold an includable branch"
  - id: ERR_NO_SUBSTANTIVE_PROTEST
    http: 422
    condition: "a hearing is requested when the cited comment is not a substantive protest or the period's substantive_protest_count is 0"
  - id: ERR_MARKET_ANALYSIS_MISSING
    http: 422
    condition: "a recommendation is attempted while an overlapping deposit market has no CompetitiveAnalysis"
  - id: ERR_PRO_FORMA_SCHEDULE_MISSING
    http: 422
    condition: "submission is attempted without a CURRENT REGULATORY_ADJUSTED pro forma schedule"
  - id: ERR_BENEFITS_PLAN_NOT_EXECUTED
    http: 422
    condition: "a performance report is filed, or a COMMUNITY_BENEFITS condition satisfied, with no EXECUTED plan on the application"
  # --- business constraint ---
  - id: ERR_REGULATOR_CHARTER_MISMATCH
    http: 422
    condition: "primary_regulator does not match charter_type"
  - id: ERR_SELF_MERGER
    http: 422
    condition: "acquirer_id equals target_id"
  - id: ERR_DUPLICATE_MARKET_CODE
    http: 409
    condition: "market_code already exists"
  - id: ERR_DUPLICATE_ANALYSIS
    http: 409
    condition: "a CompetitiveAnalysis already exists for this (application_id, market_id)"
  - id: ERR_DUPLICATE_CONVERSION_PLAN
    http: 409
    condition: "the application already has a SystemsConversionPlan"
  - id: ERR_DUPLICATE_REPORT_PERIOD
    http: 409
    condition: "period_label already exists on this plan"
  - id: ERR_REPORT_PERIOD_OUT_OF_SEQUENCE
    http: 422
    condition: "period_index does not equal plan.filed_report_count + 1"
  - id: ERR_CAPITAL_DATA_MISSING
    http: 422
    condition: "either institution reports zero risk_weighted_assets_usd or zero average_total_assets_usd when a schedule is built"
  - id: ERR_CLOSURE_NOTICE_REQUIRED
    http: 422
    condition: "a CLOSURE designation omits notice_sent_at or planned_closure_date, or a disclosure omits the MAIL channel"
  - id: ERR_RESPONSE_BODY_REQUIRED
    http: 422
    condition: "a RESPONDED disposition carries a blank or missing response_body"
  # --- business fiscal ---
  - id: ERR_PRO_FORMA_CAPITAL_INSUFFICIENT
    http: 422
    condition: "the CURRENT REGULATORY_ADJUSTED schedule's capital_adequacy_flag is not WELL_CAPITALIZED at submission"
  - id: ERR_EMPTY_BENEFITS_PLAN
    http: 422
    condition: "a plan with no commitment line items, or with total_committed_usd 0, is executed"

roles:
  - name: Filer
    description: "The acquiring institution's corporate development team: builds the transaction, files the application, negotiates community benefits, responds to comments and consummates."
    identity: "entity_backed:Institution"
    exclusive_operations:
      - "POST /merger-applications"
      - "POST /merger-applications/{id}/submit"
      - "POST /branches/{id}/designate"
      - "POST /branches/{id}/rescind-designation"
      - "POST /community-benefits-plans"
      - "POST /commitment-line-items"
      - "POST /community-benefits-plans/{id}/execute"
      - "POST /public-comments/{id}/respond"
      - "POST /approval-decisions/{id}/consummate"
      - "POST /systems-conversion-plans"
      - "POST /systems-conversion-plans/{id}/disclose"
      - "POST /systems-conversion-plans/{id}/convert"
      - "POST /performance-reports"
    shared_operations:
      - "PATCH /merger-applications/{id}"
      - "POST /pro-forma-schedules"
      - "every GET endpoint"
    note: "X-User-ID must equal the target application's acquirer_id for every Filer-scoped write."
  - name: PublicCommenter
    description: "A member of the public, community organization, trade group or government body that comments, protests and requests hearings."
    identity: "opaque"
    exclusive_operations:
      - "POST /public-comments"
      - "POST /hearing-requests"
      - "POST /hearing-requests/{id}/withdraw"
    shared_operations:
      - "read access to institutions, markets, branches, applications, analyses, comment periods, comments, hearing requests, benefits plans, line items, decisions, conditions and performance reports"
  - name: CaseAnalyst
    description: "The regulator's case analyst: builds the market and institution record, runs the concentration screens, manages the comment period and recommends an outcome."
    identity: "opaque"
    exclusive_operations:
      - "POST /institutions"
      - "POST /deposit-markets"
      - "POST /branches"
      - "POST /competitive-analyses"
      - "POST /comment-periods"
      - "POST /comment-periods/{id}/close"
      - "POST /merger-applications/{id}/accept"
      - "POST /merger-applications/{id}/return-for-amendment"
      - "POST /merger-applications/{id}/recommend"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "PATCH /merger-applications/{id}"
      - "POST /pro-forma-schedules"
      - "every GET endpoint"
  - name: ApprovingOfficial
    description: "The deciding official: rules on hearing requests, issues the decision with its conditions and owns the waiting-period determination."
    identity: "opaque"
    exclusive_operations:
      - "POST /hearing-requests/{id}/decide"
      - "POST /approval-decisions"
      - "POST /approval-conditions"
    shared_operations:
      - "every GET endpoint"
    note: "Segregation of duties: the ApprovingOfficial's X-User-ID must differ from the application's recommended_by_user_id."
  - name: ComplianceMonitor
    description: "The post-closing monitor: reviews commitment performance reports, records condition satisfaction and cures, and escalates breaches."
    identity: "opaque"
    exclusive_operations:
      - "POST /approval-conditions/{id}/satisfy"
      - "POST /performance-reports/{id}/review"
      - "POST /performance-reports/{id}/reopen"
    shared_operations:
      - "every GET endpoint"
