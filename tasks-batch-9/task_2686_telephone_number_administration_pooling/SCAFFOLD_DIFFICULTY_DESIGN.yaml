              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
            - call: "POST /numbering/carriers/${carrier_a_id}/readiness-events"
              payload: { event: "VERIFY" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
