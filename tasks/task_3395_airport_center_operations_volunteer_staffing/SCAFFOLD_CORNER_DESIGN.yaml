            - call: "POST /centers/${c_id}/service-bookings"
              payload: { guest_id: "${g_id}", service_type: "SHOWER", start_at: "2026-09-01T18:00:00Z", end_at: "2026-09-01T18:30:00Z" }
              as: CenterManager
              captures: { b_ok: $.data.id }
          assert:
            - "SLEEPING_AREA booking rejected ERR_POSTURE_SERVICE_BLOCKED (posture RESTRICTED)"
            - "SHOWER booking at the same center at the same posture succeeds (${b_ok} created)"
      - name: priority_state_beats_guest_safety
        claim_type: priority_ordering
        grounds:
