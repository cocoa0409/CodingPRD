          assert:
            - "response.http_status == 409"
            - "response.error_id == ERR_WINDOW_OVERLAP (priority 8 business_temporal beats priority 9 business_constraint, though 6.0 + 6.0 > 10.0 also fails)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (>=2 instances, different metrics/endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: deposit_exact_minimum_boundary
        grounds:
          - calculations.deposit_requirement
          - validations[priority=11]
