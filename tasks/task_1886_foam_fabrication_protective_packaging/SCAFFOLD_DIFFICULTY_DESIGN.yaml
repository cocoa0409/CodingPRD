            - "error_id != ERR_UTILIZATION_INFEASIBLE (constraint, priority 9), though parts_per_sheet == 0"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: volume_tier_boundary_at_1000
        grounds:
          - calculations.quote_pricing_calc
          - entities.ProductionOrder.fields.final_unit_price_cents
        distinguishing_aspect: |
          Metric = order qty against the volume tier break. qty == 1000 takes
          VOLUME_MULT 1.00 (unit 480, total 495000); qty == 999 takes MID_RUN_MULT
          1.15 (unit 552, total 566448). Endpoint: POST /api/production-orders
          (+confirm). The tier edge is inclusive of 1000.
        test_recipe:
          setup:
            - "Approved spec + LOCKED CNC_ROUTE program (machine_seconds_per_part 40, parts_per_sheet 52)"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Widgets", account_tier: "STANDARD" }, as: SalesEngineer, captures: { cust_id: $.data.id } }
            - { call: "POST /api/materials", payload: { foam_family: "PE", density_pcf: 1.7, ild_lb_25: 130, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 2, cost_per_board_ft_cents: 250, recyclable: true, scrap_credit_per_lb_cents: 12 }, as: PlantManager, captures: { mat_id: $.data.id } }
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_id}", material_id: "${mat_id}", part_name: "Widget Tray", part_length_in: 10, part_width_in: 8, product_weight_lb: 5, required_drop_height_in: 30, max_fragility_g: 60 }, as: SalesEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "POST /api/package-specs/${spec_id}/begin-validation", payload: {}, as: QualityEngineer }
            - { call: "POST /api/drop-tests", payload: { package_spec_id: "${spec_id}", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", drop_height_in: 30, orientation: "FLAT" }, as: QualityEngineer, captures: { dt_id: $.data.id } }
            - { call: "POST /api/drop-tests/${dt_id}/record", payload: { measured_peak_g: 55 }, as: QualityEngineer }
            - { call: "POST /api/package-specs/${spec_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /api/package-specs/${spec_id}", as: DesignEngineer, captures: { spec_v: $.data.version } }
            - { call: "POST /api/cut-programs", payload: { package_spec_id: "${spec_id}", method: "CNC_ROUTE", machine_seconds_per_part: 40, expected_package_spec_version: "${spec_v}" }, as: DesignEngineer, captures: { cp_id: $.data.id } }
            - { call: "POST /api/cut-programs/${cp_id}/nest", payload: {}, as: DesignEngineer }
            - { call: "POST /api/cut-programs/${cp_id}/lock", payload: {}, as: DesignEngineer }
          trigger:
            - { call: "POST /api/production-orders", payload: { package_spec_id: "${spec_id}", cut_program_id: "${cp_id}", qty: 999 }, as: SalesEngineer, captures: { o999: $.data.id } }
            - { call: "POST /api/production-orders/${o999}/confirm", payload: { machine_id: "CNC-1", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T09:00:00Z" }, as: SalesEngineer, captures: { u999: $.data.final_unit_price_cents, t999: $.data.final_total_cents } }
            - { call: "POST /api/production-orders", payload: { package_spec_id: "${spec_id}", cut_program_id: "${cp_id}", qty: 1000 }, as: SalesEngineer, captures: { o1000: $.data.id } }
            - { call: "POST /api/production-orders/${o1000}/confirm", payload: { machine_id: "CNC-1", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z" }, as: SalesEngineer, captures: { u1000: $.data.final_unit_price_cents, t1000: $.data.final_total_cents } }
          assert:
            - "qty 999: final_unit_price_cents == 552 (round_half_up((360000/999 + 120) * 1.15)) and final_total_cents == 566448 (552*999 + 15000)"
            - "qty 1000: final_unit_price_cents == 480 ((360 + 120) * 1.00) and final_total_cents == 495000 (480*1000 + 15000)"
            - "qty == 1000 exactly takes the volume multiplier (boundary is inclusive downward into VOLUME)"

      - name: allocate_exact_available_then_zero_available
        grounds:
          - state_machines.ReleaseOrder.PENDING_to_ALLOCATED
          - entities.InventoryProgram.fields.reserved_qty
          - errors[ERR_INSUFFICIENT_STOCK]
        distinguishing_aspect: |
          Metric = stock availability (distinct from the price-tier qty metric).
          qty == on_hand - reserved exactly (equality) allocates successfully and
          drives available to zero; a subsequent allocate of even min_release_qty
          against the now-empty pool fails with ERR_INSUFFICIENT_STOCK. Endpoint:
          POST /api/release-orders/{id}/allocate.
        test_recipe:
          setup:
            - "Approved spec + LOCKED DIE program; program PROG ACTIVE (CURRENT, max 1000, reorder 200, min 50) with on_hand 1000"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Widgets", account_tier: "STANDARD" }, as: SalesEngineer, captures: { cust_id: $.data.id } }
            - { call: "POST /api/materials", payload: { foam_family: "PE", density_pcf: 1.7, ild_lb_25: 130, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 2, cost_per_board_ft_cents: 250, recyclable: true, scrap_credit_per_lb_cents: 12 }, as: PlantManager, captures: { mat_id: $.data.id } }
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_id}", material_id: "${mat_id}", part_name: "Widget Tray", part_length_in: 10, part_width_in: 8, product_weight_lb: 5, required_drop_height_in: 30, max_fragility_g: 60 }, as: SalesEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "POST /api/package-specs/${spec_id}/begin-validation", payload: {}, as: QualityEngineer }
            - { call: "POST /api/drop-tests", payload: { package_spec_id: "${spec_id}", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", drop_height_in: 30, orientation: "FLAT" }, as: QualityEngineer, captures: { dt_id: $.data.id } }
            - { call: "POST /api/drop-tests/${dt_id}/record", payload: { measured_peak_g: 55 }, as: QualityEngineer }
            - { call: "POST /api/package-specs/${spec_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /api/package-specs/${spec_id}", as: DesignEngineer, captures: { spec_v: $.data.version } }
            - { call: "POST /api/cut-programs", payload: { package_spec_id: "${spec_id}", method: "DIE_CUT", expected_package_spec_version: "${spec_v}" }, as: DesignEngineer, captures: { cp_id: $.data.id } }
            - { call: "POST /api/cut-programs/${cp_id}/nest", payload: {}, as: DesignEngineer }
            - { call: "POST /api/toolings", payload: { cut_program_id: "${cp_id}", die_cost_cents: 250000, amortization_qty: 1000, lead_time_days: 10 }, as: DesignEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /api/toolings/${tool_id}/commission", payload: {}, as: DesignEngineer }
            - { call: "POST /api/cut-programs/${cp_id}/lock", payload: {}, as: DesignEngineer }
            - { call: "POST /api/inventory-programs", payload: { customer_id: "${cust_id}", package_spec_id: "${spec_id}", pricing_mode: "CURRENT", max_stock_qty: 1000, reorder_point_qty: 200, min_release_qty: 50 }, as: SalesEngineer, captures: { prog: $.data.id } }
            - { call: "POST /api/inventory-programs/${prog}/activate", payload: {}, as: SalesEngineer }
            - { call: "POST /api/inventory-programs/${prog}/replenish", payload: { qty: 1000 }, as: PlantManager, captures: { rpo: $.data.id } }
            - { call: "POST /api/production-orders/${rpo}/confirm", payload: { machine_id: "DIE-1", window_start: "2026-08-04T08:00:00Z", window_end: "2026-08-04T09:00:00Z" }, as: SalesEngineer }
            - { call: "POST /api/production-orders/${rpo}/start", payload: {}, as: PlantManager }
            - { call: "POST /api/production-orders/${rpo}/complete", payload: {}, as: PlantManager }
          trigger:
            - { call: "POST /api/release-orders", payload: { inventory_program_id: "${prog}", qty: 1000, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { rel1: $.data.id } }
            - { call: "POST /api/release-orders/${rel1}/allocate", payload: {}, as: PlantManager, captures: { rel1_status: $.data.status } }
            - { call: "POST /api/release-orders", payload: { inventory_program_id: "${prog}", qty: 50, requested_ship_date: "2026-08-11T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { rel2: $.data.id } }
            - { call: "POST /api/release-orders/${rel2}/allocate", payload: {}, as: PlantManager, captures: { err: $.data.error_id } }
          assert:
            - "Release ${rel1} (qty 1000 == available 1000) allocates: status == ALLOCATED (equality allowed)"
            - "After exact-fit allocate: program.reserved_qty == 1000, on_hand_qty == 1000, available == 0"
            - "Release ${rel2} (qty 50 >= min_release_qty) allocate fails with ERR_INSUFFICIENT_STOCK against the zero-available pool"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: confirm_requires_spec_approved
        grounds:
          - state_machines.ProductionOrder.QUOTED_to_CONFIRMED
          - errors[ERR_SPEC_NOT_APPROVED]
        distinguishing_aspect: |
          Entity pair = ProductionOrder -> PackageSpec. Confirm is gated on the
          SPEC's state (APPROVED), not the order's own: an order in QUOTED on a
          spec stuck at VALIDATED cannot confirm; after the customer approves the
          spec, the same confirm succeeds.
        test_recipe:
          setup:
            - "Spec VALIDATED (not approved) with LOCKED DIE program + IN_SERVICE tooling; order QUOTED"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Widgets", account_tier: "STANDARD" }, as: SalesEngineer, captures: { cust_id: $.data.id } }
            - { call: "POST /api/materials", payload: { foam_family: "PE", density_pcf: 1.7, ild_lb_25: 130, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 2, cost_per_board_ft_cents: 250, recyclable: true, scrap_credit_per_lb_cents: 12 }, as: PlantManager, captures: { mat_id: $.data.id } }
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_id}", material_id: "${mat_id}", part_name: "Widget Tray", part_length_in: 10, part_width_in: 8, product_weight_lb: 5, required_drop_height_in: 30, max_fragility_g: 60 }, as: SalesEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "POST /api/package-specs/${spec_id}/begin-validation", payload: {}, as: QualityEngineer }
            - { call: "POST /api/drop-tests", payload: { package_spec_id: "${spec_id}", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", drop_height_in: 30, orientation: "FLAT" }, as: QualityEngineer, captures: { dt_id: $.data.id } }
            - { call: "POST /api/drop-tests/${dt_id}/record", payload: { measured_peak_g: 55 }, as: QualityEngineer }
            - { call: "GET /api/package-specs/${spec_id}", as: DesignEngineer, captures: { spec_v: $.data.version } }
            - { call: "POST /api/cut-programs", payload: { package_spec_id: "${spec_id}", method: "DIE_CUT", expected_package_spec_version: "${spec_v}" }, as: DesignEngineer, captures: { cp_id: $.data.id } }
            - { call: "POST /api/cut-programs/${cp_id}/nest", payload: {}, as: DesignEngineer }
            - { call: "POST /api/toolings", payload: { cut_program_id: "${cp_id}", die_cost_cents: 250000, amortization_qty: 1000, lead_time_days: 10 }, as: DesignEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /api/toolings/${tool_id}/commission", payload: {}, as: DesignEngineer }
            - { call: "POST /api/cut-programs/${cp_id}/lock", payload: {}, as: DesignEngineer }
            - { call: "POST /api/production-orders", payload: { package_spec_id: "${spec_id}", cut_program_id: "${cp_id}", qty: 500 }, as: SalesEngineer, captures: { ord_id: $.data.id } }
          trigger:
            - { call: "POST /api/production-orders/${ord_id}/confirm", payload: { machine_id: "DIE-1", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T09:00:00Z" }, as: SalesEngineer, captures: { err: $.data.error_id } }
            - { call: "POST /api/package-specs/${spec_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /api/production-orders/${ord_id}/confirm", payload: { machine_id: "DIE-1", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T09:00:00Z" }, as: SalesEngineer, captures: { after_fab: $.data.fab_status } }
          assert:
            - "First confirm fails with ERR_SPEC_NOT_APPROVED (spec VALIDATED, order itself in valid QUOTED state)"
            - "After customer approves the spec, the identical confirm succeeds: fab_status == CONFIRMED"

      - name: lock_requires_tooling_in_service
        grounds:
          - state_machines.CutProgram.NESTED_to_LOCKED
          - errors[ERR_TOOLING_NOT_IN_SERVICE]
        distinguishing_aspect: |
          Entity pair = CutProgram -> Tooling (distinct from ProductionOrder ->
          PackageSpec). Lock of a DIE_CUT program is gated on the tooling's state:
          tooling ORDERED (not commissioned) blocks the lock; commissioning the
          same tooling unblocks it.
        test_recipe:
          setup:
            - "Spec SUBMITTED (or beyond); DIE cut program NESTED; tooling exists but is ORDERED"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Widgets", account_tier: "STANDARD" }, as: SalesEngineer, captures: { cust_id: $.data.id } }
            - { call: "POST /api/materials", payload: { foam_family: "PE", density_pcf: 1.7, ild_lb_25: 130, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 2, cost_per_board_ft_cents: 250, recyclable: true, scrap_credit_per_lb_cents: 12 }, as: PlantManager, captures: { mat_id: $.data.id } }
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_id}", material_id: "${mat_id}", part_name: "Widget Tray", part_length_in: 10, part_width_in: 8, product_weight_lb: 5, required_drop_height_in: 30, max_fragility_g: 60 }, as: SalesEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "GET /api/package-specs/${spec_id}", as: DesignEngineer, captures: { spec_v: $.data.version } }
            - { call: "POST /api/cut-programs", payload: { package_spec_id: "${spec_id}", method: "DIE_CUT", expected_package_spec_version: "${spec_v}" }, as: DesignEngineer, captures: { cp_id: $.data.id } }
            - { call: "POST /api/cut-programs/${cp_id}/nest", payload: {}, as: DesignEngineer }
            - { call: "POST /api/toolings", payload: { cut_program_id: "${cp_id}", die_cost_cents: 250000, amortization_qty: 1000, lead_time_days: 10 }, as: DesignEngineer, captures: { tool_id: $.data.id } }
          trigger:
            - { call: "POST /api/cut-programs/${cp_id}/lock", payload: {}, as: DesignEngineer, captures: { err: $.data.error_id } }
            - { call: "POST /api/toolings/${tool_id}/commission", payload: {}, as: DesignEngineer }
            - { call: "POST /api/cut-programs/${cp_id}/lock", payload: {}, as: DesignEngineer, captures: { cp_status: $.data.status } }
          assert:
            - "First lock fails with ERR_TOOLING_NOT_IN_SERVICE (tooling ORDERED)"
            - "After commission (ORDERED -> IN_SERVICE), the same lock succeeds: status == LOCKED"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: machine_window_half_open_adjacency
        grounds:
          - errors[ERR_MACHINE_WINDOW_CONFLICT]
          - validations[priority=10]
          - entities.ProductionOrder.fields.window_start
        distinguishing_aspect: |
          Resource = machine (ProductionOrder windows); semantics = half-open
          [start, end): a window starting exactly at another's end is legal
          (back-to-back scheduling), while a strictly overlapping window is
          rejected with ERR_MACHINE_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "Approved spec + LOCKED CNC program; three QUOTED orders"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Widgets", account_tier: "STANDARD" }, as: SalesEngineer, captures: { cust_id: $.data.id } }
            - { call: "POST /api/materials", payload: { foam_family: "PE", density_pcf: 1.7, ild_lb_25: 130, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 2, cost_per_board_ft_cents: 250, recyclable: true, scrap_credit_per_lb_cents: 12 }, as: PlantManager, captures: { mat_id: $.data.id } }
            - { call: "POST /api/package-specs", payload: { customer_id: "${cust_id}", material_id: "${mat_id}", part_name: "Widget Tray", part_length_in: 10, part_width_in: 8, product_weight_lb: 5, required_drop_height_in: 30, max_fragility_g: 60 }, as: SalesEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /api/package-specs/${spec_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "POST /api/package-specs/${spec_id}/begin-validation", payload: {}, as: QualityEngineer }
            - { call: "POST /api/drop-tests", payload: { package_spec_id: "${spec_id}", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", drop_height_in: 30, orientation: "FLAT" }, as: QualityEngineer, captures: { dt_id: $.data.id } }
            - { call: "POST /api/drop-tests/${dt_id}/record", payload: { measured_peak_g: 55 }, as: QualityEngineer }
            - { call: "POST /api/package-specs/${spec_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /api/package-specs/${spec_id}", as: DesignEngineer, captures: { spec_v: $.data.version } }
            - { call: "POST /api/cut-programs", payload: { package_spec_id: "${spec_id}", method: "CNC_ROUTE", machine_seconds_per_part: 40, expected_package_spec_version: "${spec_v}" }, as: DesignEngineer, captures: { cp_id: $.data.id } }
            - { call: "POST /api/cut-programs/${cp_id}/nest", payload: {}, as: DesignEngineer }
            - { call: "POST /api/cut-programs/${cp_id}/lock", payload: {}, as: DesignEngineer }
            - { call: "POST /api/production-orders", payload: { package_spec_id: "${spec_id}", cut_program_id: "${cp_id}", qty: 100 }, as: SalesEngineer, captures: { o1: $.data.id } }
            - { call: "POST /api/production-orders", payload: { package_spec_id: "${spec_id}", cut_program_id: "${cp_id}", qty: 100 }, as: SalesEngineer, captures: { o2: $.data.id } }
            - { call: "POST /api/production-orders", payload: { package_spec_id: "${spec_id}", cut_program_id: "${cp_id}", qty: 100 }, as: SalesEngineer, captures: { o3: $.data.id } }
          trigger:
            - { call: "POST /api/production-orders/${o1}/confirm", payload: { machine_id: "CNC-1", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T09:00:00Z" }, as: SalesEngineer, captures: { o1_fab: $.data.fab_status } }
            - { call: "POST /api/production-orders/${o2}/confirm", payload: { machine_id: "CNC-1", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z" }, as: SalesEngineer, captures: { o2_fab: $.data.fab_status } }
            - { call: "POST /api/production-orders/${o3}/confirm", payload: { machine_id: "CNC-1", window_start: "2026-08-03T08:30:00Z", window_end: "2026-08-03T09:30:00Z" }, as: SalesEngineer, captures: { err: $.data.error_id } }
          assert:
            - "O1 confirm 08:00-09:00 succeeds: fab_status == CONFIRMED"
            - "O2 confirm 09:00-10:00 succeeds (start == prior end is legal under half-open semantics)"
            - "O3 confirm 08:30-09:30 fails with ERR_MACHINE_WINDOW_CONFLICT (strict overlap)"

      - name: lab_booking_buffer_intervals
        grounds:
          - errors[ERR_LAB_WINDOW_CONFLICT]
          - validations[priority=10]
          - entities.DropTest.fields.scheduled_start
        distinguishing_aspect: |
          Resource = the drop-test lab (DropTest bookings); semantics = buffered
          closed intervals: bookings must leave a >= 30 minute reset gap, so a
          booking starting 15 minutes after another's end is rejected while one
          starting exactly 30 minutes after is accepted — adjacency (gap 0) is NOT
          allowed, unlike machine windows.
        test_recipe:
          setup:
            - "Spec IN_VALIDATION; one booking DT1 at 09:00-10:00"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Widgets", account_tier: "STANDARD" }, as: SalesEngineer, captures: { cust_id: $.data.id } }
            - { call: "POST /api/materials", payload: { foam_family: "PE", density_pcf: 1.7, ild_lb_25: 130, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 2, cost_per_board_ft_cents: 250, recyclable: true, scrap_credit_per_lb_cents: 12 }, as: PlantManager, captures: { mat_id: $.data.id } }
