            - "machine A: ACCEPTED, with one ACTIVE ServiceContract"
            - "machine B: a second ACCEPTED InstalledMachine for a different customer, with no contract of its own"
          setup_api_calls:
            - call: "POST /packaging-oem/customers"
              payload: { legal_name: "Northwind Beverages", region_code: "NA", product_variation_pct: 4.00 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /packaging-oem/machine-models"
              payload: { model_code: "FL-600", machine_family: "FILLER", nameplate_rate_cpm: 600, guarantee_efficiency_pct: 90.00, base_price_cents: 68000000, min_container_diameter_mm: 60, max_container_diameter_mm: 110 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packaging-oem/production-lines"
              payload: { line_code: "LINE-A", machine_family: "FILLER", changeover_buffer_days: 5, capacity_days_per_quarter: 120 }
              as: PlatformAdmin
              captures: { line_id: $.data.id }
            - call: "POST /packaging-oem/product-trials"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_name: "Sparkling Cider", container_family: "PET_ROUND", container_diameter_mm: 82 }
              as: ApplicationEngineer
              captures: { trial_id: $.data.id }
            - call: "POST /packaging-oem/product-trials/${trial_id}/start-testing"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /packaging-oem/product-trials/${trial_id}/record-result"
              payload: { measured_rate_cpm: 570, outcome: "PASS" }
              as: ApplicationEngineer
            - call: "POST /packaging-oem/machine-orders"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_trial_id: "${trial_id}", equipment_price_cents: 70000000, change_parts_price_cents: 3000000, guarantee_basis: "NAMEPLATE" }
              as: ApplicationEngineer
              captures: { order_id: $.data.id }
            - call: "POST /packaging-oem/machine-orders/${order_id}/engineer"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /packaging-oem/machine-orders/${order_id}/commercial-advance"
              payload: { target_status: "PO_RECEIVED" }
              as: PlatformAdmin
              captures: { order_v: $.data.version }
            - call: "POST /packaging-oem/build-slots"
              payload: { machine_order_id: "${order_id}", production_line_id: "${line_id}", start_date: "2026-08-06", requested_slot_days: 20, expected_machine_order_version: "${order_v}" }
              as: ProductionPlanner
              captures: { slot_id: $.data.id }
            - call: "POST /packaging-oem/build-slots/${slot_id}/confirm"
              payload: {}
              as: ProductionPlanner
            - call: "POST /packaging-oem/build-slots/${slot_id}/start-build"
              payload: {}
              as: ProductionPlanner
            - call: "POST /packaging-oem/acceptance-tests"
              payload: { machine_order_id: "${order_id}", kind: "FAT", scheduled_on: "2026-08-26" }
              as: QualityInspector
              captures: { fat_id: $.data.id }
            - call: "POST /packaging-oem/acceptance-tests/${fat_id}/start"
              payload: { customer_product_supplied: true, containers_supplied_count: 500 }
              as: QualityInspector
            - call: "POST /packaging-oem/acceptance-tests/${fat_id}/finalize"
              payload: { measured_rate_cpm: 570, measured_efficiency_pct: 96.00 }
              as: QualityInspector
            - call: "POST /packaging-oem/machine-orders/${order_id}/ship"
              payload: {}
              as: ProductionPlanner
            - call: "POST /packaging-oem/installed-machines"
              payload: { machine_order_id: "${order_id}", customer_id: "${cust_id}", serial_number: "SN-2806-001", remote_diagnostics_enabled: true }
              as: ServiceManager
              captures: { machine_id: $.data.id }
            - call: "POST /packaging-oem/acceptance-tests"
              payload: { machine_order_id: "${order_id}", kind: "SAT", scheduled_on: "2026-08-27", required_operators_trained: 2 }
              as: QualityInspector
              captures: { sat_id: $.data.id }
            - call: "POST /packaging-oem/acceptance-tests/${sat_id}/start"
              payload: { customer_product_supplied: true, containers_supplied_count: 200 }
              as: QualityInspector
            - call: "POST /packaging-oem/acceptance-tests/${sat_id}/finalize"
              payload: { measured_rate_cpm: 570, measured_efficiency_pct: 96.00, operators_trained_count: 2 }
              as: QualityInspector
            - call: "POST /packaging-oem/service-contracts"
              payload: { installed_machine_id: "${machine_id}", tier: "SILVER", start_date: "2026-08-01", end_date: "2027-07-31", pm_visits_included: 2, goodwill_budget_initial_cents: 350000 }
              as: ServiceManager
              captures: { contract_id: $.data.id }
            - call: "POST /packaging-oem/service-contracts/${contract_id}/activate"
              payload: {}
              as: ServiceManager
            - call: "POST /packaging-oem/customers"
              payload: { legal_name: "Contoso Foods", region_code: "EU", product_variation_pct: 6.00 }
              as: PlatformAdmin
              captures: { cust_b_id: $.data.id }
            - call: "POST /packaging-oem/product-trials"
              payload: { customer_id: "${cust_b_id}", machine_model_id: "${model_id}", product_name: "Sparkling Cider", container_family: "PET_ROUND", container_diameter_mm: 82 }
              as: ApplicationEngineer
              captures: { trial_b_id: $.data.id }
            - call: "POST /packaging-oem/product-trials/${trial_b_id}/start-testing"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /packaging-oem/product-trials/${trial_b_id}/record-result"
              payload: { measured_rate_cpm: 570, outcome: "PASS" }
              as: ApplicationEngineer
            - call: "POST /packaging-oem/machine-orders"
              payload: { customer_id: "${cust_b_id}", machine_model_id: "${model_id}", product_trial_id: "${trial_b_id}", equipment_price_cents: 70000000, change_parts_price_cents: 3000000, guarantee_basis: "NAMEPLATE" }
              as: ApplicationEngineer
              captures: { order_b_id: $.data.id }
            - call: "POST /packaging-oem/machine-orders/${order_b_id}/engineer"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /packaging-oem/machine-orders/${order_b_id}/commercial-advance"
              payload: { target_status: "PO_RECEIVED" }
              as: PlatformAdmin
              captures: { order_b_v: $.data.version }
            - call: "POST /packaging-oem/build-slots"
              payload: { machine_order_id: "${order_b_id}", production_line_id: "${line_id}", start_date: "2026-09-01", requested_slot_days: 20, expected_machine_order_version: "${order_b_v}" }
              as: ProductionPlanner
              captures: { slot_b_id: $.data.id }
            - call: "POST /packaging-oem/build-slots/${slot_b_id}/confirm"
              payload: {}
              as: ProductionPlanner
            - call: "POST /packaging-oem/build-slots/${slot_b_id}/start-build"
              payload: {}
              as: ProductionPlanner
            - call: "POST /packaging-oem/acceptance-tests"
              payload: { machine_order_id: "${order_b_id}", kind: "FAT", scheduled_on: "2026-09-22" }
              as: QualityInspector
              captures: { fat_b_id: $.data.id }
            - call: "POST /packaging-oem/acceptance-tests/${fat_b_id}/start"
              payload: { customer_product_supplied: true, containers_supplied_count: 500 }
              as: QualityInspector
            - call: "POST /packaging-oem/acceptance-tests/${fat_b_id}/finalize"
              payload: { measured_rate_cpm: 570, measured_efficiency_pct: 96.00 }
              as: QualityInspector
            - call: "POST /packaging-oem/machine-orders/${order_b_id}/ship"
              payload: {}
              as: ProductionPlanner
            - call: "POST /packaging-oem/installed-machines"
              payload: { machine_order_id: "${order_b_id}", customer_id: "${cust_b_id}", serial_number: "SN-2806-002", remote_diagnostics_enabled: true }
              as: ServiceManager
              captures: { machine_b_id: $.data.id }
            - call: "POST /packaging-oem/acceptance-tests"
              payload: { machine_order_id: "${order_b_id}", kind: "SAT", scheduled_on: "2026-09-23", required_operators_trained: 2 }
              as: QualityInspector
              captures: { sat_b_id: $.data.id }
            - call: "POST /packaging-oem/acceptance-tests/${sat_b_id}/start"
              payload: { customer_product_supplied: true, containers_supplied_count: 200 }
              as: QualityInspector
            - call: "POST /packaging-oem/acceptance-tests/${sat_b_id}/finalize"
              payload: { measured_rate_cpm: 570, measured_efficiency_pct: 96.00, operators_trained_count: 2 }
              as: QualityInspector
          trigger:
            - call: "POST /packaging-oem/warranty-claims"
              payload: { installed_machine_id: "${machine_b_id}", service_contract_id: "${contract_id}", failure_summary: "Nozzle block cracked during production" }
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_CONTRACT_MACHINE_MISMATCH"
            - "ServiceContract.${contract_id}.installed_machine_id == ${machine_id}"
            - "InstalledMachine.${machine_b_id}.open_claim_count == 0"
            - "GET /packaging-oem/warranty-claims with installed_machine_id ${machine_b_id} returns total_count == 0"
