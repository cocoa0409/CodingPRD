      - name: recurring_route_pause_resume_cycle
        grounds:
          - state_machines.RecurringRoute.transitions.ACTIVE_to_PAUSED
          - state_machines.RecurringRoute.transitions.PAUSED_to_ACTIVE
          - calculations.ops_run_sweeps
        distinguishing_aspect: |
          RecurringRoute has a revision cycle (ACTIVE -> PAUSED -> ACTIVE) on a
          different entity than Order: generation skips PAUSED routes (no order
          spawned, last_generated_date stays null), and after resume the next
          run_ops spawns exactly one DRAFT order for 2026-05-04 (first Monday
          within lead window); a further run_ops is idempotent.
        test_recipe:
          setup:
            - "Depot cap 10; clock at Friday 2026-05-01 09:00; BAR_RESTAURANT customer; route weekday MON window 08:00-10:00 standing 1x(BLOCK,PALLET), created ACTIVE"
          setup_api_calls:
