              captures: { lic_r3_v2: $.data.version }
            - call: "POST /licensing/licensees/${lic_r3}/retailer-authorizations"
              payload: { retailer_name: "Metro Sports", channel_class: "DEPARTMENT", sku_classes: ["JERSEY"], authorized_from: "2026-01-01", authorized_to: "2028-12-31", closeout_allowed: false, expected_licensee_version: "${lic_r3_v2}" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
          assert:
            - "the first create returns 412 with data.error_id == 'ERR_STALE_LICENSEE_VERSION' (not ERR_STALE_AGREEMENT_VERSION)"
            - "GET /licensing/licensees/${lic_r3}/retailer-authorizations reported total_count == 0 after that rejection"
            - "the second create returns 201 with data.status == 'PENDING' and data.closeout_allowed == false"

      - name: stale_expected_run_version_on_lock_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.distribution-lock-stale-run
          - validations.priority_11
          - errors.ERR_STALE_DISTRIBUTION_VERSION
        distinguishing_aspect: |
          The run's own lock/unlock cycle invalidates a held version: the version
          that authorised the first lock is two writes old once the run has been
          unlocked, so replaying it is a 412 ERR_STALE_DISTRIBUTION_VERSION with
          the run's own error id (not the agreement or licensee variant). Priority
          11 puts this ahead of the state check, the run stays OPEN, and the
          re-read version makes the identical lock succeed.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "one ACTIVE club ATL with revenue_share_units 100"
            - "licensee LIC_S3 with an ACTIVE central agreement AGR_S3 whose 2026Q2 report of gross 1000000 (royalty 120000) is ACCEPTED"
