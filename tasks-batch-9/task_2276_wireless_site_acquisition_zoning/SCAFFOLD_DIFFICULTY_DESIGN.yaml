      - name: environmental_fork_join_requires_both_branches_complete
        grounds:
          - state_machines.EnvironmentalReview.NOT_STARTED_to_SCREENING
          - state_machines.EnvironmentalReview.SCREENING_to_IN_CONSULTATION
          - state_machines.EnvironmentalReview.IN_CONSULTATION_to_CLEARED
