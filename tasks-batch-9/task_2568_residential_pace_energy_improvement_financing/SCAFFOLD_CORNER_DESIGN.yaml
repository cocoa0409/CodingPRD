              as_user_id: "u_ana_1"
            - call: "GET /pace/mortgage-liens/${l1}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_comp_1"
              captures: { l1_deadline: $.data.consent_deadline_at, l1_resp1: $.data.consent_response }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T23:59:59Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/applications/${a1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_comp_1"
              captures: { err_early: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/applications/${a1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_comp_1"
              captures: { a1_status: $.data.status, a1_posture_after: $.data.consent_posture }
            - call: "GET /pace/mortgage-liens/${l1}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_comp_1"
              captures: { l1_resp2: $.data.consent_response }
            - call: "POST /pace/applications/${a2}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_comp_1"
              captures: { err_county: $.data.error_id }
            - call: "GET /pace/mortgage-liens/${l2}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_comp_1"
              captures: { l2_resp: $.data.consent_response }
          assert:
            - "l1_resp0 == 'NOT_NOTIFIED' at recording; underwrite is what notifies, so l1_resp1 == 'PENDING' with l1_deadline == '2026-09-11T00:00:00Z' (2026-08-12 + 30 days)"
            - "a1_posture == 'PENDING' at underwrite and a1_cltv == 7000, i.e. the screens passed and only consent is outstanding"
            - "One second before the deadline: 422 err_early == 'ERR_LENDER_CONSENT_PENDING' and Application.${a1}.status is still 'CONSENT_PENDING'"
            - "At the deadline instant the lapse is honoured inclusively: 200 with a1_status == 'APPROVED', a1_posture_after == 'CLEARED' and l1_resp2 == 'DEEMED_CONSENTED' (the sweep is a write, performed lazily inside approve)"
            - "Same instant, same 30-day lapse, county 12086 is not in DEEMED_CONSENT_COUNTIES: 422 err_county == 'ERR_LENDER_CONSENT_PENDING', Application.${a2}.status still 'CONSENT_PENDING' and l2_resp still 'PENDING' — the sweep did not touch it"
            - "The two parcels are independent: Property.${p2}.committed_pace_principal_cents is still 0 while ${a1} is approved with requested_principal_cents 3000000 over its APPROVED measure"

      - name: excluded_cascading_side_effects_of_a_referring_roll_run
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - endpoints[POST /pace/counties/{countyCode}/roll-runs]
        excluded_because:
          difficulty_instance: transitive_cascade / roll_run_delinquency_referral_void_cure_cascade_depth4
          rationale: |
            The 'cascading_side_effects' layer's depth-N chain, ordering sensitivity and partial-failure
            claims are all exercised by that §1.8 instance, which drives one roll run through the pinned
            4-step order (bill -> sweep+price -> refer -> cascade) and checks every downstream write:
            penalties priced while lien_status is still SENIOR_RECORDED, the referral, the VOID_STALE of
            the QUOTED transfer, the tax_delinquency_count_36m increment and the NEEDS_CURE of the
            parcel's other application. A §1.9 recipe here would be the same call with fewer assertions.

      - name: excluded_dual_variant_workmanship_scoring
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations[contractor_workmanship_score]
        excluded_because:
          difficulty_instance: dual_variant_calc / workmanship_trailing_24m_vs_lifetime_blocks_reinstatement
          rationale: |
            The 'dual_variant_calculation' layer needs a variant-divergence and a variant-selection claim.
            That §1.8 instance already computes both variants of the workmanship score over one complaint
            history (trailing-24-month for the suspension trigger, lifetime for the reinstatement gate),
            shows the two figures disagreeing on the same data, and proves the reinstatement path reads
            the lifetime variant. The CLTV assessed-vs-market pair is covered by its own §1.8 instance and
            by dual_basis_cltv_computed_read_on_one_parcel in the endpoints section above.

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: every_derived_field_is_readable_in_the_same_response_that_wrote_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /pace/applications/{id}/underwrite]
          - calculations[savings_to_investment_ratio]
        distinguishing_aspect: |
          The declared model is 'immediate', so no denormalised field may lag: the single underwrite
          response must already carry requested_principal_cents recomputed over the APPROVED subset, the
          re-blended portfolio_sir_bps and the per-measure verdicts, and an immediate re-read must return
          byte-identical values with no settling call in between. The fixture makes this observable by
          mixing one measure that clears the SIR floor (solar, 12770) with one that misses it by 105 bps
          (water efficiency, 9895): a lagging implementation still shows the submit-time principal
          3500000 and the submit-time blend 12359 after the underwrite has already dropped the weak
          measure.
        test_recipe:
          setup:
            - "Clock 2026-08-12; free-and-clear parcel P1 assessed 40000000; solar 25y 3000000/220000 -> pv 3830892, sir 12770 (passes); water efficiency 10y 500000/58000 -> pv 494752, sir 9895 (misses the 10000 floor)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/products"
              payload: { product_code: "SOLAR_PV_ROOF", category: "SOLAR_PV", useful_life_years: 25, max_annual_savings_cents: 300000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { prod_solar: $.data.id }
            - call: "POST /pace/products"
              payload: { product_code: "WATER_LOWFLOW", category: "WATER_EFFICIENCY", useful_life_years: 10, max_annual_savings_cents: 90000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { prod_water: $.data.id }
            - call: "POST /pace/contractors"
              payload: { legal_name: "Ridgeline Retrofit LLC", license_number: "CSLB-884120", license_expires_on: "2030-06-30", workmanship_warranty_years: 10, counties_served: ["06073"] }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /pace/contractors/${c1}/enroll"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/properties"
              payload: { apn: "06073-118-204-011", county_code: "06073", owner_full_name: "Ada Ruiz", owner_birth_date: "1971-04-09", owner_email: "ada@example.com", occupancy_type: "OWNER_OCCUPIED", assessed_value_cents: 40000000, annual_property_tax_cents: 420000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { p1: $.data.id }
            - call: "POST /pace/applications"
              payload: { property_id: "${p1}", contractor_id: "${c1}", requested_term_years: 20 }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { a1: $.data.id, a1_v0: $.data.version }
            - call: "POST /pace/applications/${a1}/measures"
              payload: { product_id: "${prod_solar}", installed_cost_cents: 3000000, estimated_annual_savings_cents: 220000, expected_application_version: "${a1_v0}" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { m_solar: $.data.id, m_solar_sir: $.data.sir_bps }
            - call: "GET /pace/applications/${a1}"
              payload: {}
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { a1_v1: $.data.version, principal_after_first: $.data.requested_principal_cents }
            - call: "POST /pace/applications/${a1}/measures"
              payload: { product_id: "${prod_water}", installed_cost_cents: 500000, estimated_annual_savings_cents: 58000, expected_application_version: "${a1_v1}" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { m_water: $.data.id, m_water_sir: $.data.sir_bps }
            - call: "POST /pace/applications/${a1}/submit"
              payload: {}
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { submit_principal: $.data.requested_principal_cents, submit_portfolio: $.data.portfolio_sir_bps, submit_min: $.data.min_measure_sir_bps, submit_eul: $.data.weighted_useful_life_years }
          trigger:
            - call: "POST /pace/applications/${a1}/underwrite"
              payload: { decision: "PROCEED", valuation_basis: "ASSESSED" }
              as: UnderwritingAnalyst
              as_user_id: "u_ana_1"
              captures: { uw_status: $.data.status, uw_principal: $.data.requested_principal_cents, uw_portfolio: $.data.portfolio_sir_bps, uw_min: $.data.min_measure_sir_bps }
            - call: "GET /pace/measures?application_id=${a1}&status=INELIGIBLE"
              payload: {}
              as: UnderwritingAnalyst
              as_user_id: "u_ana_1"
              captures: { inelig_first_id: "$.data[0].id" }
            - call: "GET /pace/applications/${a1}"
              payload: {}
              as: UnderwritingAnalyst
              as_user_id: "u_ana_1"
              captures: { reread_principal: $.data.requested_principal_cents, reread_portfolio: $.data.portfolio_sir_bps }
          assert:
            - "Each write's own response already carries its derived numbers: m_solar_sir == 12770 and m_water_sir == 9895, computed in the POST that created them"
            - "The parent ledger settles inside the same request too: principal_after_first == 3000000, and the submit response already carries submit_principal == 3500000, submit_portfolio == 12359 ((3830892 + 494752) * 10000 / 3500000), submit_min == 9895 and submit_eul == 22"
            - "The underwrite response is self-sufficient: uw_status == 'CONSENT_PENDING', uw_principal == 3000000 (recomputed over APPROVED only, so the 500000 water measure is already gone in this very response), uw_portfolio == 12770 (re-blended over the surviving subset) and uw_min == 12770"
            - "inelig_first_id == m_water: the per-measure verdict is visible immediately, ProjectMeasure.${m_water}.status == 'INELIGIBLE' and ProjectMeasure.${m_solar}.status == 'APPROVED'"
            - "No lag on re-read: reread_principal == uw_principal == 3000000 and reread_portfolio == uw_portfolio == 12770, so no second call was needed to settle a denormalised field"
            - "The parcel's ledger is equally immediate: Property.${p1}.committed_pace_principal_cents is still 0 (commitment attaches at agreement signature, not at underwriting) and equity_ratio_bps == 10000"

      - name: excluded_saga_style_compensation_on_rescission
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.FinancingAgreement.SIGNED_to_RESCINDED
        excluded_because:
          difficulty_instance: compensating_invariant / rescission_restores_property_committed_pace_principal
          rationale: |
            The consistency model is 'immediate', not 'saga', so there is no eventual-consistency lag to
            probe and no multi-step compensation semantics to specify here. The nearest claim — that an
            aborted workflow leaves every ledger exactly as it was before the workflow started — is
            already owned by that §1.8 instance, which rescinds a signed agreement and reconciles
            Property.committed_pace_principal_cents, the application state and the measure statuses back
            to their pre-signature values in the same response, with reversal_conserves_contractor_gross_and_clawback_ledger
            covering the disbursed-funds counterpart.
