          - errors.ERR_PROPERTY_NOT_IN_INVENTORY
        distinguishing_aspect: "A registry-only PROSPECT parcel is not land bank inventory, so securing or mowing it is 409 ERR_PROPERTY_NOT_IN_INVENTORY even though the crew, the window and the funding are all perfectly valid - the county may not spend maintenance money on land it does not hold."
        test_recipe:
          setup:
            - "A PROSPECT parcel (registered but never acquired), an ANY source authorized 1000000 and a licensed MOW crew."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Prospect Guard Line", source_type: "GRANT", authorized_cents: 1000000, restriction: "ANY", expires_on: "2029-12-31T00:00:00Z" }
