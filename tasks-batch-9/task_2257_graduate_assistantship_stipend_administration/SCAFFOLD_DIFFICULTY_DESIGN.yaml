  - rule_id: transitive_cascade
    instances:

      - name: terminate_cascade_six_levels_auto_reinstates_overcommitted_source
        grounds:
          - state_machines.Appointment.ACTIVE_to_TERMINATED
          - state_machines.StipendDisbursement.SCHEDULED_to_VOIDED
          - state_machines.FundingAllocation.COMMITTED_to_RELEASED
          - state_machines.FundingSource.SUSPENDED_to_ACTIVE
          - calculations.funding_source_balance
          - entities.FundingSource.fields.auto_reinstate_threshold_cents
        distinguishing_aspect: |
          A single terminate call propagates six levels - Appointment TERMINATED/PAY_VOIDED, four
          SCHEDULED disbursements VOIDED, allocation money fields zeroed (remission dropped because
          the 2026-08-01 termination_date precedes the 2026-11-15 remission_drop_deadline), allocation
          COMMITTED -> RELEASED, source balances recomputed to available 5000000, and finally the
          SUSPENDED/OVERCOMMITMENT source flipping back to ACTIVE because available now meets its
          5000000 auto_reinstate_threshold_cents.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default, strictly before the term's remission_drop_deadline of 2026-11-15."
            - "Term CASC2026 (2026-09-01..2026-12-31, CALENDAR_DAY) OPEN with four whole-month pay periods."
            - "StipendPolicy (RESEARCH, DOCTORAL): min_fte_monthly_stipend_cents 400000, per_credit_tuition_cents 50000, max_remission_cents_per_term 500000, term_insurance_premium_cents 0."
            - "DOCTORAL student with enrolled_credit_hours 8, so the 100 percent remission band gives exactly 400000 cents."
            - "One GRANT source authorized 5000000 with auto_reinstate_threshold_cents 5000000, funding the appointment at 100.00 percent."
            - "Appointment RESEARCH, effort_pct 75, 2026-09-01..2026-12-31, monthly_stipend_cents 300000, driven to ACTIVE with payroll SCHEDULED: total_stipend_cents 1200000, tuition_remission_cents 400000, allocation COMMITTED at allocated_stipend_cents 1200000 and allocated_remission_cents 400000, source committed 1600000 / available 3400000, four SCHEDULED disbursements of 300000."
            - "The source has then been suspended with reason OVERCOMMITMENT, so it sits SUSPENDED with available 3400000, below its 5000000 reinstatement threshold."
          setup_api_calls:
            - call: "POST /departments"
              payload: { code: "CHEM", name: "Chemistry" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { dept_id: "$.data.id" }
            - call: "POST /academic-terms"
