      - name: task_completion_cascades_vehicle_allocation_plan_four_levels
        grounds:
          - state_machines[InFleetingTask]
          - state_machines[Vehicle.fleet_status]
          - state_machines[PurchaseAllocation]
          - state_machines[FleetPlan]
          - endpoints[POST /fleet/in-fleeting-tasks/{task_id}/complete]
        distinguishing_aspect: |
          This is the four-level BUBBLE-UP chain along the ownership spine
          InFleetingTask -> Vehicle -> PurchaseAllocation -> FleetPlan, driven by a
          single client call that names only the leaf. The chain is also gated at
          every hop: hop 2 only fires when all three task types are resolved, hop 3
          only promotes the allocation past PARTIALLY_INFLEETED when in_fleeted_count
          reaches unit_count, and hop 4 only closes the plan when in_fleeted_unit_count
          reaches planned_unit_count. Completing the second-to-last task must produce
          NO movement above hop 1.
