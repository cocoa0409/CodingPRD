  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: event_poundage_conservation
        grounds:
          - entities.GleanEvent.fields.undistributed_lbs
          - calculations.event_allocation_feasibility
          - calculations.actual_poundage
        distinguishing_aspect: |
          Conserved quantity: GleanEvent pounds. Invariant pinned:
          total_harvested_lbs == total_distributed_lbs + undistributed_lbs +
          condemned_lbs(RESOLVED) for every event at all times. Forward action
          (distribution create 120.0) followed by its compensating action
          (cancel that distribution) MUST restore undistributed_lbs to the
          pre-create value 200.0 — zero drift.
        test_recipe:
          setup:
            - "Event harvested exactly 200.0; no incidents"
          setup_api_calls:
            - call: "POST /glean/farms"
              payload: { farm_name: "FZ", contact_email: "fz@x.com", county_code: "ZZZ", donor_tin: "16-3456789" }
              as: ProgramCoordinator
              captures: { farm_id: $.data.id }
            - call: "POST /glean/vehicles"
              payload: { plate: "PZ", payload_capacity_lbs: 5000, refrigerated: false }
              as: ProgramCoordinator
              captures: { veh_id: $.data.id }
            - call: "POST /glean/agencies"
              payload: { agency_name: "AGZ", county_code: "ZZZ", weekly_capacity_lbs: 100000, refrigeration_capable: false }
              as: ProgramCoordinator
              captures: { ag_id: $.data.id }
            - call: "POST /glean/volunteers"
              payload: { full_name: "Lead Z", email: "leadz@x.com", crew_leader_certified: true }
              as: ProgramCoordinator
              captures: { lead_id: $.data.id }
            - call: "POST /glean/volunteers"
              payload: { full_name: "Coord Z", email: "coordz@x.com", crew_leader_certified: false }
              as: ProgramCoordinator
              captures: { coord_id: $.data.id }
            - call: "POST /glean/offers"
              payload: { farm_id: "${farm_id}", crop_code: "ROOT_VEG", estimated_lbs: 250.0, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-20T00:00:00Z", perishability_class: "LOW", requires_refrigeration: false }
              as: ProgramCoordinator
              captures: { offer_id: $.data.id }
            - call: "POST /glean/events"
              payload: { surplus_offer_id: "${offer_id}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", crew_leader_volunteer_id: "${lead_id}", assigned_vehicle_id: "${veh_id}", crew_capacity: 1 }
              as: ProgramCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /glean/events/${event_id}/publish"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramCoordinator
            - call: "POST /glean/events/${event_id}/start"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /glean/containers"
              payload: { label: "BIN-Z1", tare_lbs: 10.0, capacity_lbs: 500, refrigerated: false }
              as: ProgramCoordinator
              captures: { cont_id: $.data.id }
            - call: "POST /glean/lots"
              payload: { glean_event_id: "${event_id}", container_id: "${cont_id}", gross_lbs: 210.0, cull_lbs: 0.0, recorded_by_volunteer_id: "${lead_id}" }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /glean/lots/${lot_id}/verify"
              payload: { verified_by_coordinator_id: "${coord_id}" }
              as: ProgramCoordinator
            - call: "POST /glean/events/${event_id}/finish"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "GET /glean/events/${event_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { pre_undist: $.data.undistributed_lbs, ev_ver: $.data.version }
          trigger:
            - call: "POST /glean/distributions"
              payload: { glean_event_id: "${event_id}", agency_id: "${ag_id}", planned_lbs: 120.0, delivery_date: "2026-08-12T10:00:00Z", expected_event_version: "${ev_ver}" }
              as: ProgramCoordinator
              captures: { dist_id: $.data.id }
            - call: "GET /glean/events/${event_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { mid_dist: $.data.total_distributed_lbs }
            - call: "POST /glean/distributions/${dist_id}/cancel"
              payload: {}
              as: ProgramCoordinator
            - call: "GET /glean/events/${event_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { post_undist: $.data.undistributed_lbs, post_dist: $.data.total_distributed_lbs }
          assert:
            - "pre_undist == 200.0"
            - "mid_dist == 120.0 (SCHEDULED planned counts toward distributed)"
            - "post_dist == 0.0 and post_undist == 200.0 (compensating cancel restores the conserved split exactly — no drift)"
            - "invariant holds at every probe: total_harvested_lbs 200.0 == total_distributed_lbs + undistributed_lbs + 0.0 condemned"

      - name: agency_weekly_commitment_conservation
        grounds:
          - entities.Agency.fields.current_week_committed_lbs
          - calculations.agency_capacity_check
          - state_machines.Distribution.SCHEDULED_to_DELIVERED
        distinguishing_aspect: |
          Conserved quantity: agency weekly commitment (different quantity from
          event poundage). Invariant: current_week_committed_lbs == sum over
          the agency's same-ISO-week distributions of (planned_lbs if SCHEDULED,
          delivered_lbs if DELIVERED/SHORTFALL, 0 if CANCELLED). Forward action
          deliver-then-cancel is impossible (DELIVERED is terminal), so the
          compensating pair is create(150.0 SCHEDULED) then cancel — committed
          returns from 250.0 to 100.0 exactly; and the SHORTFALL re-measure
          (planned 150.0 -> delivered 100.0) REDUCES commitment by the 50.0
          shortfall rather than leaving it at planned.
        test_recipe:
          setup:
            - "Two events E1 harvested 400.0, E2 harvested 300.0 (different offers); agency capacity 10000 week of 2026-08-12"
            - "distA on E1 planned 100.0 SCHEDULED; distB on E1 planned 150.0 delivered 100.0 SHORTFALL; distC on E2 planned 150.0 SCHEDULED"
          setup_api_calls:
            - call: "POST /glean/farms"
              payload: { farm_name: "FJ", contact_email: "fj@x.com", county_code: "JJJ", donor_tin: "17-3456789" }
              as: ProgramCoordinator
              captures: { farm_id: $.data.id }
            - call: "POST /glean/vehicles"
              payload: { plate: "PJ", payload_capacity_lbs: 5000, refrigerated: false }
              as: ProgramCoordinator
              captures: { veh_id: $.data.id }
            - call: "POST /glean/agencies"
              payload: { agency_name: "AGJ", county_code: "JJJ", weekly_capacity_lbs: 10000, refrigeration_capable: false }
              as: ProgramCoordinator
              captures: { ag_id: $.data.id }
            - call: "POST /glean/volunteers"
              payload: { full_name: "Lead J", email: "leadj@x.com", crew_leader_certified: true }
              as: ProgramCoordinator
              captures: { lead_id: $.data.id }
            - call: "POST /glean/volunteers"
              payload: { full_name: "Coord J", email: "coordj@x.com", crew_leader_certified: false }
              as: ProgramCoordinator
