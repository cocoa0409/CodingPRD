# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Apartment Leasing Center & Traffic Conversion
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7; 2 instances per rule.
# Clock default is 2026-08-01T00:00:00Z unless a recipe sets it.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: closing_ratio_all_vs_qualified_basis_diverge
        grounds:
          - calculations.agent_closing_ratio
          - entities.Inquiry.fields.status
          - entities.Inquiry.fields.first_responded_at
        distinguishing_aspect: |
          Same inquiry set, same window: basis ALL divides closed count by all assigned
          inquiries (1/3 = 33.3%) while basis QUALIFIED divides by first-responded
          inquiries only (1/2 = 50.0%) — a dual-variant divergence on the Inquiry/Agent
          attribution domain.
        test_recipe:
          setup:
            - "Property P (defaults), agent A1, floorplan F (rent 200000, 3 units)"
            - "I1 WEB_FORM: claimed + responded (qualified, never closed)"
            - "I2 WEB_FORM: claimed + responded + application approved + lease EXECUTED (closed → CONVERTED)"
            - "I3 WEB_FORM: claimed only, never responded (unqualified)"
            - "I4 PHONE: claimed + responded (qualified, not closed)"
          setup_api_calls:
            - call: "POST /leasing/properties"
              payload: { name: "Ratio Towers", code: "RT1" }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /leasing/agents"
              payload: { full_name: "Agent One", email: "a1@x.com", property_id: "${p_id}" }
              as: PropertyManager
              captures: { a1_id: $.data.id }
            - call: "POST /leasing/floorplans"
              payload: { property_id: "${p_id}", name: "A1 1BR", bedrooms: 1, base_rent_cents: 200000, total_units: 3 }
              as: PropertyManager
              captures: { f_id: $.data.id }
            - call: "POST /leasing/inquiries"
              payload: { property_id: "${p_id}", floorplan_id: "${f_id}", contact_name: "I1", contact_email: "i1@x.com", source: "WEB_FORM" }
              as: LeasingAgent
              as_user_id: "${a1_id}"
              captures: { i1_id: $.data.id }
            - call: "POST /leasing/inquiries/${i1_id}/claim"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a1_id}"
            - call: "POST /leasing/inquiries/${i1_id}/respond"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a1_id}"
            - call: "POST /leasing/inquiries"
              payload: { property_id: "${p_id}", floorplan_id: "${f_id}", contact_name: "I2", contact_email: "i2@x.com", source: "WEB_FORM" }
              as: LeasingAgent
              as_user_id: "${a1_id}"
              captures: { i2_id: $.data.id }
            - call: "POST /leasing/inquiries/${i2_id}/claim"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a1_id}"
            - call: "POST /leasing/inquiries/${i2_id}/respond"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a1_id}"
            - call: "POST /leasing/applications"
              payload: { inquiry_id: "${i2_id}", floorplan_id: "${f_id}", applicant_name: "Two", applicant_email: "i2@x.com", annual_income_cents: 9000000, credit_score: 750 }
              as: LeasingAgent
              as_user_id: "${a1_id}"
              captures: { app2_id: $.data.id }
            - call: "POST /leasing/applications/${app2_id}/decide"
              payload: { decision: "APPROVED" }
              as: PropertyManager
              captures: { app2_v: $.data.version }
            - call: "POST /leasing/leases"
              payload: { application_id: "${app2_id}", expected_application_version: "${app2_v}" }
              as: PropertyManager
              captures: { lease2_id: $.data.id }
            - call: "POST /leasing/leases/${lease2_id}/sign"
              payload: {}
              as: Applicant
              as_user_id: "${app2_id}"
            - call: "POST /leasing/leases/${lease2_id}/countersign"
              payload: {}
              as: PropertyManager
            - call: "POST /leasing/inquiries"
              payload: { property_id: "${p_id}", floorplan_id: "${f_id}", contact_name: "I3", contact_email: "i3@x.com", source: "WEB_FORM" }
              as: LeasingAgent
              as_user_id: "${a1_id}"
              captures: { i3_id: $.data.id }
            - call: "POST /leasing/inquiries/${i3_id}/claim"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a1_id}"
            - call: "POST /leasing/inquiries"
              payload: { property_id: "${p_id}", floorplan_id: "${f_id}", contact_name: "I4", contact_email: "i4@x.com", source: "PHONE" }
              as: LeasingAgent
              as_user_id: "${a1_id}"
              captures: { i4_id: $.data.id }
            - call: "POST /leasing/inquiries/${i4_id}/claim"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a1_id}"
            - call: "POST /leasing/inquiries/${i4_id}/respond"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a1_id}"
          trigger:
            - call: "GET /leasing/reports/closing"
              payload: { property_id: "${p_id}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z", basis: "ALL" }
              as: PropertyManager
            - call: "GET /leasing/reports/closing"
              payload: { property_id: "${p_id}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z", basis: "QUALIFIED" }
              as: PropertyManager
          assert:
            - "basis=ALL response rows contains { agent_id: ${a1_id}, source: WEB_FORM, inquiries_count: 3, closed_count: 1, closing_ratio_pct: 33.3 }"
            - "basis=QUALIFIED response rows contains { agent_id: ${a1_id}, source: WEB_FORM, inquiries_count: 2, closed_count: 1, closing_ratio_pct: 50.0 }"
            - "basis=ALL row for (${a1_id}, PHONE): inquiries_count 1, closed_count 0, closing_ratio_pct 0.0"
            - "33.3 != 50.0 — the two variants diverge on identical underlying data"

      - name: prorated_rent_calendar_vs_fixed30_diverge
        grounds:
          - calculations.prorated_first_month_rent
          - entities.MoveIn.fields.prorated_rent_cents
          - entities.Property.fields.prorate_method
        distinguishing_aspect: |
          Same move-in date (2026-08-16) and same rent (210000): CALENDAR proration
          (divisor 31, 16 days) yields 108384 cents while FIXED_30 (divisor 30, 15 days)
          yields 105000 cents — a dual-variant divergence on the MoveIn/Lease money
          domain, distinct from the Inquiry-domain closing-ratio variants.
        test_recipe:
          setup:
            - "Property P_CAL (prorate_method CALENDAR) and P_30 (prorate_method FIXED_30), each with agent, floorplan rent 210000 / 1 unit"
            - "Each property: inquiry → claim → respond → application (income 9000000, credit 750) → APPROVED → lease → sign → countersign (EXECUTED)"
          setup_api_calls:
            - call: "POST /leasing/properties"
              payload: { name: "Cal Court", code: "PCAL", prorate_method: "CALENDAR" }
              as: PropertyManager
              captures: { p_cal: $.data.id }
            - call: "POST /leasing/properties"
              payload: { name: "Thirty Court", code: "P30", prorate_method: "FIXED_30" }
              as: PropertyManager
              captures: { p_30: $.data.id }
            - call: "POST /leasing/agents"
              payload: { full_name: "Cal Agent", email: "ca@x.com", property_id: "${p_cal}" }
              as: PropertyManager
              captures: { a_cal: $.data.id }
            - call: "POST /leasing/agents"
              payload: { full_name: "Thirty Agent", email: "ta@x.com", property_id: "${p_30}" }
              as: PropertyManager
              captures: { a_30: $.data.id }
            - call: "POST /leasing/floorplans"
              payload: { property_id: "${p_cal}", name: "C-1BR", bedrooms: 1, base_rent_cents: 210000, total_units: 1 }
              as: PropertyManager
              captures: { f_cal: $.data.id }
            - call: "POST /leasing/floorplans"
              payload: { property_id: "${p_30}", name: "T-1BR", bedrooms: 1, base_rent_cents: 210000, total_units: 1 }
              as: PropertyManager
              captures: { f_30: $.data.id }
            - call: "POST /leasing/inquiries"
              payload: { property_id: "${p_cal}", floorplan_id: "${f_cal}", contact_name: "CI", contact_email: "ci@x.com", source: "WEB_FORM" }
              as: LeasingAgent
              as_user_id: "${a_cal}"
              captures: { i_cal: $.data.id }
            - call: "POST /leasing/inquiries/${i_cal}/claim"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_cal}"
            - call: "POST /leasing/inquiries/${i_cal}/respond"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_cal}"
            - call: "POST /leasing/applications"
              payload: { inquiry_id: "${i_cal}", floorplan_id: "${f_cal}", applicant_name: "Cal App", applicant_email: "ci@x.com", annual_income_cents: 9000000, credit_score: 750 }
              as: LeasingAgent
              as_user_id: "${a_cal}"
              captures: { app_cal: $.data.id }
            - call: "POST /leasing/applications/${app_cal}/decide"
              payload: { decision: "APPROVED" }
              as: PropertyManager
              captures: { app_cal_v: $.data.version }
            - call: "POST /leasing/leases"
              payload: { application_id: "${app_cal}", expected_application_version: "${app_cal_v}" }
              as: PropertyManager
              captures: { l_cal: $.data.id }
            - call: "POST /leasing/leases/${l_cal}/sign"
              payload: {}
              as: Applicant
              as_user_id: "${app_cal}"
            - call: "POST /leasing/leases/${l_cal}/countersign"
              payload: {}
              as: PropertyManager
            - call: "POST /leasing/inquiries"
              payload: { property_id: "${p_30}", floorplan_id: "${f_30}", contact_name: "TI", contact_email: "ti@x.com", source: "WEB_FORM" }
              as: LeasingAgent
              as_user_id: "${a_30}"
              captures: { i_30: $.data.id }
            - call: "POST /leasing/inquiries/${i_30}/claim"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_30}"
            - call: "POST /leasing/inquiries/${i_30}/respond"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_30}"
            - call: "POST /leasing/applications"
              payload: { inquiry_id: "${i_30}", floorplan_id: "${f_30}", applicant_name: "Thirty App", applicant_email: "ti@x.com", annual_income_cents: 9000000, credit_score: 750 }
              as: LeasingAgent
              as_user_id: "${a_30}"
              captures: { app_30: $.data.id }
            - call: "POST /leasing/applications/${app_30}/decide"
              payload: { decision: "APPROVED" }
              as: PropertyManager
              captures: { app_30_v: $.data.version }
            - call: "POST /leasing/leases"
              payload: { application_id: "${app_30}", expected_application_version: "${app_30_v}" }
              as: PropertyManager
              captures: { l_30: $.data.id }
            - call: "POST /leasing/leases/${l_30}/sign"
              payload: {}
              as: Applicant
              as_user_id: "${app_30}"
            - call: "POST /leasing/leases/${l_30}/countersign"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /leasing/move-ins"
              payload: { lease_id: "${l_cal}", scheduled_date: "2026-08-16T00:00:00Z" }
              as: LeasingAgent
              as_user_id: "${a_cal}"
              captures: { m_cal: $.data.id }
            - call: "POST /leasing/move-ins"
              payload: { lease_id: "${l_30}", scheduled_date: "2026-08-16T00:00:00Z" }
              as: LeasingAgent
              as_user_id: "${a_30}"
              captures: { m_30: $.data.id }
          assert:
            - "MoveIn.${m_cal}.prorated_rent_cents == 108384   # round_half_up(210000/31)=6774 daily; 6774*16"
            - "MoveIn.${m_30}.prorated_rent_cents == 105000    # 210000/30=7000 daily; 7000*15"
            - "MoveIn.${m_cal}.prorated_rent_cents != MoveIn.${m_30}.prorated_rent_cents"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: effective_rent_free_months_branch_and_clamps
        grounds:
          - calculations.effective_monthly_rent
          - entities.PricingOffer.fields.effective_monthly_rent_cents
        distinguishing_aspect: |
          Mode (a): a >=3-input formula with conditional branches and nested min/max —
          FREE_MONTHS with 2 of 12 months yields round_half_up(200000*10/12)=166667,
          while 14 free months clamps through min(14,12) then max(0,...) to exactly 0.
        test_recipe:
          setup:
            - "Property P, floorplan F; two DRAFT offers on F with concession FREE_MONTHS"
          setup_api_calls:
            - call: "POST /leasing/properties"
              payload: { name: "Combo Place", code: "CB1" }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /leasing/floorplans"
              payload: { property_id: "${p_id}", name: "2BR", bedrooms: 2, base_rent_cents: 200000, total_units: 5 }
              as: PropertyManager
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /leasing/pricing-offers"
              payload: { property_id: "${p_id}", floorplan_id: "${f_id}", base_rent_cents: 200000, concession_type: "FREE_MONTHS", concession_value: 2, lease_term_months: 12, effective_start: "2026-08-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: PropertyManager
              captures: { o_a: $.data.id }
            - call: "POST /leasing/pricing-offers"
              payload: { property_id: "${p_id}", floorplan_id: "${f_id}", base_rent_cents: 200000, concession_type: "FREE_MONTHS", concession_value: 14, lease_term_months: 12, effective_start: "2026-08-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: PropertyManager
              captures: { o_b: $.data.id }
          assert:
            - "PricingOffer.${o_a}.effective_monthly_rent_cents == 166667"
            - "PricingOffer.${o_b}.effective_monthly_rent_cents == 0"
            - "PricingOffer.${o_a}.status == DRAFT"

      - name: prorated_rent_rounds_daily_rate_before_days
        grounds:
          - calculations.prorated_first_month_rent
          - entities.MoveIn.fields.prorated_rent_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — daily rate rounded first then
          multiplied (round(100001/31)=3226; 3226*16=51616) beats the unpinned
          alternative (100001*16/31 then round = 51613); a different mode than
          instance effective_rent_free_months_branch_and_clamps (mode a).
        test_recipe:
          setup:
            - "Property P (CALENDAR proration), agent A, floorplan F rent 100001 / 1 unit"
            - "Full pipeline to an EXECUTED lease L with monthly_rent_cents 100001"
          setup_api_calls:
            - call: "POST /leasing/properties"
              payload: { name: "Round House", code: "RH1", prorate_method: "CALENDAR" }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /leasing/agents"
              payload: { full_name: "RA", email: "ra@x.com", property_id: "${p_id}" }
              as: PropertyManager
              captures: { a_id: $.data.id }
            - call: "POST /leasing/floorplans"
              payload: { property_id: "${p_id}", name: "Studio", bedrooms: 0, base_rent_cents: 100001, total_units: 1 }
              as: PropertyManager
              captures: { f_id: $.data.id }
            - call: "POST /leasing/inquiries"
              payload: { property_id: "${p_id}", floorplan_id: "${f_id}", contact_name: "RI", contact_email: "ri@x.com", source: "WALK_IN" }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { i_id: $.data.id }
            - call: "POST /leasing/inquiries/${i_id}/claim"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
            - call: "POST /leasing/inquiries/${i_id}/respond"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
            - call: "POST /leasing/applications"
              payload: { inquiry_id: "${i_id}", floorplan_id: "${f_id}", applicant_name: "Round App", applicant_email: "ri@x.com", annual_income_cents: 5000000, credit_score: 750 }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { app_id: $.data.id }
            - call: "POST /leasing/applications/${app_id}/decide"
              payload: { decision: "APPROVED" }
              as: PropertyManager
              captures: { app_v: $.data.version }
            - call: "POST /leasing/leases"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v}" }
              as: PropertyManager
              captures: { l_id: $.data.id }
            - call: "POST /leasing/leases/${l_id}/sign"
              payload: {}
              as: Applicant
              as_user_id: "${app_id}"
            - call: "POST /leasing/leases/${l_id}/countersign"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /leasing/move-ins"
              payload: { lease_id: "${l_id}", scheduled_date: "2026-08-16T00:00:00Z" }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { m_id: $.data.id }
          assert:
            - "MoveIn.${m_id}.prorated_rent_cents == 51616   # round-then-multiply order"
            - "MoveIn.${m_id}.prorated_rent_cents != 51613   # multiply-then-round alternative is wrong"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: waitlist_offer_decline_requeues_to_back
        grounds:
          - state_machines.WaitlistEntry.OFFERED_to_WAITING
          - calculations.waitlist_position_assignment
        distinguishing_aspect: |
          WaitlistEntry is cyclic: WAITING → OFFERED → WAITING on decline, and the
          requeue reassigns position to max+1 (3), sending the declined entry behind
          the previously waiting entry (position 2).
        test_recipe:
          setup:
            - "Property P, agent A, floorplan F rent 200000 / 1 unit, occupied by an EXECUTED lease"
            - "Waitlist entries E1 (position 1) and E2 (position 2)"
            - "Lease cancelled at default clock → E1 auto-promoted to OFFERED with offer_expires_at 2026-08-04T00:00:00Z"
          setup_api_calls:
            - call: "POST /leasing/properties"
              payload: { name: "Queue Gardens", code: "QG1" }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /leasing/agents"
              payload: { full_name: "QA", email: "qa@x.com", property_id: "${p_id}" }
              as: PropertyManager
              captures: { a_id: $.data.id }
            - call: "POST /leasing/floorplans"
              payload: { property_id: "${p_id}", name: "1BR", bedrooms: 1, base_rent_cents: 200000, total_units: 1 }
              as: PropertyManager
              captures: { f_id: $.data.id }
            - call: "POST /leasing/inquiries"
              payload: { property_id: "${p_id}", floorplan_id: "${f_id}", contact_name: "QI", contact_email: "qi@x.com", source: "PHONE" }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { i_id: $.data.id }
            - call: "POST /leasing/inquiries/${i_id}/claim"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
            - call: "POST /leasing/inquiries/${i_id}/respond"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
            - call: "POST /leasing/applications"
              payload: { inquiry_id: "${i_id}", floorplan_id: "${f_id}", applicant_name: "Q App", applicant_email: "qi@x.com", annual_income_cents: 9000000, credit_score: 750 }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { app_id: $.data.id }
            - call: "POST /leasing/applications/${app_id}/decide"
              payload: { decision: "APPROVED" }
              as: PropertyManager
              captures: { app_v: $.data.version }
            - call: "POST /leasing/leases"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v}" }
              as: PropertyManager
              captures: { l_id: $.data.id }
            - call: "POST /leasing/leases/${l_id}/sign"
              payload: {}
              as: Applicant
              as_user_id: "${app_id}"
            - call: "POST /leasing/leases/${l_id}/countersign"
              payload: {}
              as: PropertyManager
            - call: "POST /leasing/waitlist-entries"
              payload: { floorplan_id: "${f_id}", contact_name: "E1", contact_email: "e1@x.com" }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /leasing/waitlist-entries"
              payload: { floorplan_id: "${f_id}", contact_name: "E2", contact_email: "e2@x.com" }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { e2_id: $.data.id }
            - call: "POST /leasing/leases/${l_id}/cancel"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /leasing/waitlist-entries/${e1_id}/decline"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
            - call: "POST /leasing/waitlist-entries/${e2_id}/promote"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
          assert:
            - "WaitlistEntry.${e1_id} after decline: status == WAITING, position == 3, offer_expires_at == null"
            - "WaitlistEntry.${e2_id} after promote: status == OFFERED, offer_expires_at == 2026-08-04T00:00:00Z"
            - "the cycle WAITING → OFFERED → WAITING executed and reordered the queue (E1 behind E2)"

      - name: application_rescreen_loop_recomputes_recommendation
        grounds:
          - state_machines.Application.APPROVED_WITH_CONDITIONS_to_SCREENING
          - calculations.screening_recommendation
          - calculations.required_deposit
        distinguishing_aspect: |
          Application is cyclic: APPROVED_WITH_CONDITIONS → SCREENING → APPROVED via
          rescreen with an improved credit score; recommendation flips CONDITION →
          APPROVE and the conditional deposit (400000) is replaced by the standard
          deposit (200000) — a cycle on a different entity than WaitlistEntry.
        test_recipe:
          setup:
            - "Property P, agent A, floorplan F rent 200000 / 2 units"
            - "Application via inquiry with income 8000000, credit 650 → recommendation CONDITION; decided APPROVED_WITH_CONDITIONS"
          setup_api_calls:
            - call: "POST /leasing/properties"
              payload: { name: "Loop Manor", code: "LM1" }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /leasing/agents"
              payload: { full_name: "LA", email: "la@x.com", property_id: "${p_id}" }
              as: PropertyManager
              captures: { a_id: $.data.id }
            - call: "POST /leasing/floorplans"
              payload: { property_id: "${p_id}", name: "1BR", bedrooms: 1, base_rent_cents: 200000, total_units: 2 }
              as: PropertyManager
              captures: { f_id: $.data.id }
            - call: "POST /leasing/inquiries"
              payload: { property_id: "${p_id}", floorplan_id: "${f_id}", contact_name: "LI", contact_email: "li@x.com", source: "ILS_LISTING" }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { i_id: $.data.id }
            - call: "POST /leasing/inquiries/${i_id}/claim"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
            - call: "POST /leasing/inquiries/${i_id}/respond"
              payload: {}
              as: LeasingAgent
