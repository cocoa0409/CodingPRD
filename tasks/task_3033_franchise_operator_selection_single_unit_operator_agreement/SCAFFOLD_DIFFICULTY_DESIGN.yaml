              payload: { candidate_id: "${cand16_id}", restaurant_id: "${r16_id}", base_share_bps: 5000, effective_from: "2026-09-07T00:00:00Z" }
              as: SelectionCommittee
              captures: { op16_id: $.data.id }
            - call: "POST /franchise/operators/${op16_id}/attest"
              payload: { residency_verified: true, full_time_attested: true }
              as: Operator
              as_user_id: "${op16_id}"
            - call: "POST /franchise/operators/${op16_id}/agreement/execute"
              payload: {}
              as: SelectionCommittee
            - call: "POST /franchise/operators/${op16_id}/activate"
              payload: {}
              as: FieldConsultant
          trigger:
            - call: "POST /franchise/operators/${op16_id}/suspend"
              payload: {}
              as: FieldConsultant
            - call: "POST /franchise/operators/${op16_id}/reinstate"
              payload: {}
              as: FieldConsultant
          assert:
            - "after suspend: Operator.${op16_id}.operator_status == SUSPENDED and agreement SUSPENDED"
            - "after reinstate: Operator.${op16_id}.operator_status == ACTIVE and agreement EXECUTED"
            - "Restaurant.${r16_id}.restaurant_status == ASSIGNED and current_operator_id == ${op16_id} throughout (restaurant assignment conserved)"

      - name: application_withdraw_restores_candidate_to_registered
        grounds:
          - state_machines.Candidate.REGISTERED_to_IN_SELECTION
          - state_machines.Candidate.IN_SELECTION_to_REGISTERED
          - state_machines.Application
        distinguishing_aspect: |
          Conserved quantity = candidate eligibility for a new application:
          registering a candidate, submitting an application (REGISTERED ->
          IN_SELECTION, active_application_id set), then withdrawing the
          application must return the candidate to REGISTERED with
          active_application_id null, so a subsequent application create
          succeeds — forward (apply) paired with compensating (withdraw)
          leaves the candidate's apply-able state unchanged.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Candidate registered; first application submitted then withdrawn at SUBMITTED."
          setup_api_calls:
            - call: "POST /franchise/candidates"
              payload: { legal_name: "Omar Applicant", email: "omar@example.com", home_market_code: "GA", relocation_willing: true, liquid_capital_cents: 1000000 }
              as: SystemAdmin
              captures: { cand17_id: $.data.id }
            - call: "POST /franchise/candidates/${cand17_id}/applications"
              payload: { target_market_code: "GA" }
              as: Candidate
              as_user_id: "${cand17_id}"
              captures: { app17a_id: $.data.id }
            - call: "POST /franchise/applications/${app17a_id}/withdraw"
              payload: {}
              as: Candidate
              as_user_id: "${cand17_id}"
          trigger:
            - call: "POST /franchise/candidates/${cand17_id}/applications"
              payload: { target_market_code: "GA" }
              as: Candidate
              as_user_id: "${cand17_id}"
              captures: { app17b_id: $.data.id }
          assert:
            - "Candidate.${cand17_id}.candidate_status == REGISTERED after the first application's withdraw"
            - "Candidate.${cand17_id}.active_application_id is null after withdraw"
            - "the second application create succeeds (201) — ERR_DUPLICATE_APPLICATION is NOT raised"
            - "Application.${app17b_id}.stage == SUBMITTED"
