              captures: { p_direct_2: "$.data.direct_committed_cents", p_overhead_2: "$.data.overhead_fee_cents", p_total_2: "$.data.total_committed_cents", p_available_2: "$.data.available_cents", p_bcwp_2: "$.data.bcwp_cents" }
            - call: "POST /studio/outsource-partners/${partner_id}/status"
              payload: { status: "APPROVED" }
              as: OutsourceCoordinator
              as_user_id: "u-oc-01"
              captures: { partner_status_3: "$.data.status" }
            - call: "GET /studio/outsource-packages/${pkg_id}"
              as: OutsourceCoordinator
              captures: { pkg_status_3: "$.data.status", pkg_fee_3: "$.data.fee_committed_cents" }
            - call: "GET /studio/productions/${prod_id}"
              as: ProductionManager
              captures: { p_available_3: "$.data.available_cents" }
          assert:
            - "${p_available_0} == 110000000 before any commitment"
            - "${pkg_fee_1} == 4900000 and ${pkg_status_1} == DELIVERED with ${pkg_deliveries} == 1"
            - "${t_status_1} == APPROVED and ${t_pkg_1} == ${pkg_id}"
            - "${p_direct_1} == 4900000, ${p_overhead_1} == 735000, ${p_total_1} == 5635000, ${p_available_1} == 104365000 and ${p_bcwp_1} == 100000"
            - "${partner_status_2} == SUSPENDED"
            - "${pkg_status_2} == RECALLED and ${pkg_fee_2} == 0"
            - "${t_status_2} == RETAKE, ${t_pkg_2} is null and ${t_rev_2} == 1"
            - "${shot_bcwp_2} == 0, ${shot_status_2} == IN_PRODUCTION and ${shot_retakes_2} == 1 (the earned credit is compensated away too)"
            - "${p_direct_2} == 0, ${p_overhead_2} == 0, ${p_total_2} == 0, ${p_available_2} == 110000000 and ${p_bcwp_2} == 0 — the exact pre-commitment position"
            - "${partner_status_3} == APPROVED but ${pkg_status_3} == RECALLED, ${pkg_fee_3} == 0 and ${p_available_3} == 110000000: reinstatement does not re-commit the recalled fee"
            - "POST /studio/outsource-packages/${pkg_id}/deliver after the recall returns 409 with error_id ERR_PACKAGE_STATE_INVALID"
