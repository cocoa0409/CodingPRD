              as: ShopAdmin
              captures: { welder_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/ovens"
              payload: { oven_code: "OV-C2", holding_temp_c: 150, capacity_electrodes_kg: 500 }
              as: MaterialController
              captures: { oven_id: $.data.id }
            # Lot A — 239 minutes
            - call: "POST /weld-shop/shops/${shop_id}/consumable-lots"
              payload: { lot_number: "L-C2A", filler_spec: "E7018", process: "SMAW", received_kg: 50, oven_id: "${oven_id}" }
              as: MaterialController
              captures: { lot_a_id: $.data.id }
            - call: "POST /weld-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /weld-shop/shops/${shop_id}/consumable-issues"
              payload: { lot_id: "${lot_a_id}", oven_id: "${oven_id}", issued_to_welder_id: "${welder_id}", issued_kg: 5 }
              as: MaterialController
              captures: { issue_a_id: $.data.id }
            - call: "POST /weld-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T03:59:00Z" }
              as: ShopAdmin
            - call: "POST /weld-shop/shops/${shop_id}/consumable-issues/${issue_a_id}/return"
              payload: {}
              as: MaterialController
            # Lot B — 240 minutes
            - call: "POST /weld-shop/shops/${shop_id}/consumable-lots"
              payload: { lot_number: "L-C2B", filler_spec: "E7018", process: "SMAW", received_kg: 50, oven_id: "${oven_id}" }
              as: MaterialController
              captures: { lot_b_id: $.data.id }
            - call: "POST /weld-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T04:00:00Z" }
