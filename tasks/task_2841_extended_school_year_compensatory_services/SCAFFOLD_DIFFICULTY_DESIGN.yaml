  # =====================================================================
  # Rule 6 - boundary precision on different metrics at different endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: recoupment_days_threshold_boundary_across_objection_rounds
        grounds:
          - calculations.regression_recoupment_analysis
          - calculations.regression_recoupment_analysis.constants.RECOUPMENT_DAYS_THRESHOLD
          - state_machines.EligibilityDetermination.PARENT_REVIEW_to_DRAFT
          - endpoints.POST_/esy/eligibility-determinations/{determination_id}/analyze
          - entities.EligibilityDetermination.fields.criteria_met_count
        distinguishing_aspect: |
          METRIC: the integer recoupment_days_observed against
          RECOUPMENT_DAYS_THRESHOLD (20) with a >= comparison, exercised at
          threshold-1 (19), threshold (20) and threshold+1 (21) on the SAME probe
          while both probes hold regression at exactly 25.0. ENDPOINT:
          POST /esy/eligibility-determinations/{determination_id}/analyze. Because
          re-analysis is only reachable through the parent OBJECT loop, the three
          boundary readings are taken across three objection rounds, and the flip
          between 19 and 20 moves criteria_met_count from 1 to 2 and the
          recommendation from INELIGIBLE to ELIGIBLE.
        test_recipe:
          setup:
            - "Student S1 exists with no determinations."
            - "A PROBE_BASED determination is created with two probes, both 80 -> 60 (regression exactly 25.0, the >= threshold value) and trials_count 4 so data_sufficiency is SUFFICIENT."
