  - name: replaying_an_already_applied_trigger_is_rejected_not_silently_absorbed
    claim_type: idempotency
    grounds:
    - §1.2 Destination CANDIDATE -> SHORTLISTED, SupplierContract PROPOSED -> EXECUTED, Qualifier PENDING_REVIEW
      -> QUALIFIED
    - §1.4 priority 11 (per-entity state errors)
    - §1.0 complexity_layers (idempotency is deliberately NOT a declared layer)
