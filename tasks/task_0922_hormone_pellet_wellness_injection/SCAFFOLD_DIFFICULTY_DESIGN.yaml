      - name: clinical_hold_pre_empts_financial_hold_on_scheduling
        grounds:
          - validations[priority=14]
          - validations[priority=39]
          - state_machines.Patient.CLINICAL_HOLD_to_DUAL_HOLD
          - errors[ERR_PATIENT_FINANCIAL_HOLD]
        distinguishing_aspect: |
          A different category pair: business_safety (rung 14, 409) versus
          business_fiscal (rung 39, 402). A DUAL_HOLD patient scheduling a procedure
          gets ERR_PATIENT_CLINICAL_HOLD; clearing only the clinical hold makes the
          identical request return ERR_PATIENT_FINANCIAL_HOLD.
        test_recipe:
          setup:
            - "One patient carrying BOTH a clinical hold and a financial hold, so eligibility_status is DUAL_HOLD."
            - "A consult and a standing order exist so the request reaches the hold rungs."
          setup_api_calls:
            - call: "POST /clinic/providers"
              payload: { full_name: "Dr Ada Reyes", provider_type: "PHYSICIAN", npi: "1000000001" }
              as: ClinicAdmin
