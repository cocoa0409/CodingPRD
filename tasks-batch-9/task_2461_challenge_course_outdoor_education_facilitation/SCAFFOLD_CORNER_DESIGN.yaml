        distinguishing_aspect: "The safety officer who filed the DEFECT_MAJOR log is barred from clearing it: return-to-service answers ERR_SEGREGATION_OF_DUTIES at 403 (priority 10) ahead of the defect-cleared check at priority 18, and the element stays RESTRICTED."
        test_recipe:
          setup:
            - "Clock at 2026-08-10; one course; one LEVEL_3 safety officer; one low element restricted by that same officer's DEFECT_MAJOR log."
          setup_api_calls:
