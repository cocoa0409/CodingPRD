              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { st_p_id: $.data.id, st_p_v: $.data.version }
            - call: "POST /students/${st_p_id}/academic-postings"
              payload: { term_label: "2026-SPRING", term_gpa: 1.800, term_credits: 6, expected_student_version: "${st_p_v}" }
              as: EligibilityOfficer
              as_user_id: "officer-c"
            - call: "POST /students"
              payload: { school_id: "${s_id}", full_name: "Uri Nolan", birthdate: "2009-06-11", grade_level: 11 }
              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { st_u_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${se_id}", school_id: "${s_id}", title_id: "${t_id}", coach_id: "${c_a_id}", name: "North Alpha" }
              as: Coach
              as_user_id: "${c_a_id}"
              captures: { tm_id: $.data.id }
            - call: "POST /roster-slots"
