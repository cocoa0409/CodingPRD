              as: Student
              as_user_id: "${stu2}"
          trigger:
            - call: "GET /api/v1/programs/${prog_id}"
              as: ProgramCoordinator
              captures: { seats_mid: $.data.seats_taken }
            - call: "POST /api/v1/applications/${app1}/lifecycle"
              payload: { action: "RECORD_RETURN" }
              as: ProgramCoordinator
            - call: "GET /api/v1/programs/${prog_id}"
              as: ProgramCoordinator
              captures: { seats_end: $.data.seats_taken }
          assert:
            - "before return: seats_taken == 2 (COMMITTED + ABROAD both counted)"
            - "after RECORD_RETURN: seats_taken == 1 (RETURNED_HOME is outside the counted set)"

  # ===========================================================================
  # Validations (Table 4 claims)
  # ===========================================================================
  - section: validations
    instances:
      - name: gpa_below_minimum_violation
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_GPA_BELOW_MINIMUM]"
        excluded_because:
          difficulty_instance: gpa_exactly_at_minimum
          rationale: "The 2.74-rejection side is asserted there alongside the 2.75 boundary admission."
      - name: program_full_violation
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_PROGRAM_FULL]"
        excluded_because:
          difficulty_instance: capacity_last_seat
          rationale: "The seats_taken == capacity rejection is asserted there."
      - name: advisory_window_overlap_violation
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_ADVISORY_WINDOW_OVERLAP]"
        excluded_because:
          difficulty_instance: advisory_half_open_overlap
          rationale: "The intersecting-window rejection and adjacent-window acceptance are asserted there."
      - name: schedule_buffer_violation
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_PROGRAM_SCHEDULE_BUFFER]"
        excluded_because:
          difficulty_instance: program_host_schedule_buffer
          rationale: "The 6-day-gap rejection and 7-day-gap acceptance are asserted there."
      - name: commit_wrong_state_violation
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_INVALID_STATE]"
