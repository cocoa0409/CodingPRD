  # =====================================================================
  - section: rbac
    instances:

      - name: a_partner_cannot_perform_cycle_admin_exclusive_operations
        claim_type: Cannot perform other roles' exclusive_operations
        grounds:
          - roles.CycleAdmin.exclusive_operations
          - roles.Partner
          - errors[ERR_ROLE_NOT_PERMITTED]
          - validations[priority=20]
        distinguishing_aspect: |
          The priority-20 role gate fires before any business check, so a Partner calling
          the CycleAdmin-exclusive POST /comp/cycles and POST
          /comp/contribution-records/{id}/verify gets ERR_ROLE_NOT_PERMITTED 403 rather than
          ERR_DUPLICATE_CYCLE or ERR_RECORD_ALREADY_VERIFIED - even when the body is
          otherwise valid and even when the record is already verified.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 exists; partner P owns one already-verified NON_BILLABLE record."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Role Bound", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2014 }
              as: CycleAdmin
              captures: { pp: "$.data.id" }
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pp}", cycle_id: "${cy}", kind: "NON_BILLABLE", category: "RECRUITING", hours: 12.00, service_period_start: "2026-03-01", service_period_end: "2026-03-31" }
              as: CycleAdmin
              captures: { cr: "$.data.id" }
            - call: "POST /comp/contribution-records/${cr}/verify"
              payload: {}
              as: CycleAdmin
          trigger:
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: Partner
              as_user_id: "${pp}"
              captures: { e1: "$.data.error_id" }
            - call: "POST /comp/contribution-records/${cr}/verify"
              payload: {}
              as: Partner
              as_user_id: "${pp}"
              captures: { e2: "$.data.error_id" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "SELF_ASSESSMENT" }
              as: Partner
              as_user_id: "${pp}"
              captures: { e3: "$.data.error_id" }
          assert:
            - "${e1} == ERR_ROLE_NOT_PERMITTED with HTTP 403, not ERR_DUPLICATE_CYCLE - priority 20 precedes priority 120"
            - "${e2} == ERR_ROLE_NOT_PERMITTED with HTTP 403, not ERR_RECORD_ALREADY_VERIFIED - priority 20 precedes priority 70"
            - "${e3} == ERR_ROLE_NOT_PERMITTED with HTTP 403"
            - "exactly one CompensationCycle exists and CompensationCycle.${cy}.state is still OPEN_INTAKE"

      - name: audit_observer_reads_everything_except_ballots_and_writes_nothing
        claim_type: Cannot perform other roles' exclusive_operations
        grounds:
          - roles.AuditObserver
          - endpoints[GET /comp/ballots]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: |
          AuditObserver is read-only and ballot-blind: it reads awards and matters
          successfully but is refused on GET /comp/ballots by omission from that endpoint's
          roles, so the refusal is ERR_ROLE_NOT_PERMITTED at priority 20 rather than
          ERR_BALLOT_CONFIDENTIAL at priority 65.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 exists with partner P and one OPEN matter."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Aud Ited", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2014 }
              as: CycleAdmin
              captures: { pp: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-AU", client_display_name: "Audit Analytics", matter_type: "EXISTING", practice_group: "CORPORATE", opened_on: "2026-01-15", billing_attorney_id: "${pp}", responsible_attorney_id: "${pp}" }
              as: CycleAdmin
              captures: { m: "$.data.id" }
          trigger:
            - call: "GET /comp/matters/${m}"
              payload: {}
              as: AuditObserver
              captures: { mst: "$.data.state" }
            - call: "GET /comp/awards"
              payload: { cycle_id: "${cy}" }
              as: AuditObserver
            - call: "GET /comp/ballots"
              payload: { cycle_id: "${cy}" }
              as: AuditObserver
              captures: { e1: "$.data.error_id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Sneaky Admit", practice_group: "TAX", compensation_model: "FORMULA", admission_year: 2020 }
              as: AuditObserver
              captures: { e2: "$.data.error_id" }
            - call: "POST /comp/matters/${m}/status"
              payload: { target_state: "CLOSED" }
              as: AuditObserver
              captures: { e3: "$.data.error_id" }
          assert:
            - "${mst} == OPEN - AuditObserver reads the matter successfully"
            - "GET /comp/awards as AuditObserver returns 200 with an empty list"
            - "${e1} == ERR_ROLE_NOT_PERMITTED with HTTP 403, not ERR_BALLOT_CONFIDENTIAL"
            - "${e2} == ERR_ROLE_NOT_PERMITTED with HTTP 403 and no Partner row was created"
            - "${e3} == ERR_ROLE_NOT_PERMITTED with HTTP 403 and Matter.${m}.state is still OPEN"

      - name: a_committee_member_may_read_only_their_own_ballots
        claim_type: peer_roles
        grounds:
          - validations[priority=65]
          - errors[ERR_BALLOT_CONFIDENTIAL]
          - endpoints[GET /comp/ballots]
          - endpoints[GET /comp/ballots/{id}]
        distinguishing_aspect: |
          Ballot confidentiality is a read-side ownership rule between peers of the same
          role: C1 reads its own ballot and its own filtered list, but both GET
          /comp/ballots scoped to C2 and GET /comp/ballots/{id} on C2's ballot return
          ERR_BALLOT_CONFIDENTIAL 403 - while CycleAdmin reads both.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 has reached DELIBERATION."
            - "Subject S is DISCRETIONARY with an ACCEPTED assessment scored by committee members C1 and C2, so ballots exist for both members on subject S."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, discretionary_pool_pct: 0.2000, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
