              captures: { s1_id: $.data.id }
            - call: "POST /candidate-sites/${s1_id}/screen"
              payload: { transmission_headroom_mw: 240, fiber_route_count: 3, seismic_hazard_index: 0.20, flood_hazard_index: 0.45, wind_hazard_index: 0.30, craft_labor_supply_index: 1600, construction_peak_headcount: 2000, wage_premium_pct: 0.10, cooling_type: "EVAPORATIVE", annual_water_demand_mgal: 250 }
              as: SiteScreeningAnalyst
              as_user_id: "user_analyst_1"
          trigger:
            - call: "POST /interconnection-applications"
              payload: { site_id: "${s1_id}", utility_id: "${u_id}", requested_mw: 300, window_start: "2029-01-01T00:00:00Z", window_end: "2029-12-31T00:00:00Z" }
              as: SiteScreeningAnalyst
              captures: { a1_id: $.data.id }
            - call: "POST /interconnection-applications/${a1_id}/submit"
              payload: {}
              as: SiteScreeningAnalyst
