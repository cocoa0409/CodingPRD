  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: hangar_slot_half_open_adjacency
        grounds:
          - validations[priority=17]
          - entities.HangarSlot.fields.start_at
        distinguishing_aspect: |
          Resource = HangarBay; interval semantics = strict half-open
          [start_at, end_at): a slot starting exactly when another ends
          (end == start) is LEGAL, while any strict interior overlap is
          ERR_SLOT_OVERLAP.
        test_recipe:
          setup: ["Program QUOTED; bay with slot A BOOKED 2026-08-01->2026-08-10"]
          setup_api_calls:
            - { call: "POST /completion/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CenterAdmin }
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id } }
            - { call: "POST /completion/hangar-bays", payload: { name: "BAY-1", daily_rate_cents: 85000 }, as: CenterAdmin, captures: { bay_id: $.data.id } }
            - { call: "POST /completion/hangar-slots", payload: { bay_id: "${bay_id}", program_id: "${prog_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-10T00:00:00Z" }, as: ProgramManager, captures: { slot_a: $.data.id } }
          trigger:
            - { call: "POST /completion/hangar-slots", payload: { bay_id: "${bay_id}", program_id: "${prog_id}", start_at: "2026-08-10T00:00:00Z", end_at: "2026-08-20T00:00:00Z" }, as: ProgramManager, captures: { slot_b: $.data.id } }
            - { call: "POST /completion/hangar-slots", payload: { bay_id: "${bay_id}", program_id: "${prog_id}", start_at: "2026-08-09T00:00:00Z", end_at: "2026-08-11T00:00:00Z" }, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "adjacent slot B (start == A.end) is created (201) — half-open semantics"
            - "overlapping slot C -> err == ERR_SLOT_OVERLAP"

      - name: booth_booking_buffer_gap_semantics
        grounds:
          - validations[priority=18]
          - entities.PaintBooth.fields.cure_buffer_hours
        distinguishing_aspect: |
          Resource = PaintBooth; interval semantics = buffer-gap (not half-open):
          a booking starting at the exact instant the previous booking ends —
          which IS legal on a hangar bay — is REJECTED because the booth needs
          cure_buffer_hours of empty time after every booking. Different
          interval geometry on a different resource entity.
        test_recipe:
          setup: ["Program QUOTED; booth cure_buffer_hours 6; booking A 2026-08-10T08:00->16:00"]
          setup_api_calls:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id } }
            - { call: "POST /completion/paint-booths", payload: { name: "BOOTH-1", hourly_rate_cents: 25000, cure_buffer_hours: 6 }, as: CenterAdmin, captures: { booth_id: $.data.id } }
            - { call: "POST /completion/booth-bookings", payload: { booth_id: "${booth_id}", program_id: "${prog_id}", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-10T16:00:00Z" }, as: ProgramManager, captures: { bk_a: $.data.id } }
          trigger:
            - { call: "POST /completion/booth-bookings", payload: { booth_id: "${booth_id}", program_id: "${prog_id}", start_at: "2026-08-10T16:00:00Z", end_at: "2026-08-10T20:00:00Z" }, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_BOOTH_BUFFER_VIOLATION — zero-gap adjacency, legal on a bay, violates the booth's 6h cure buffer"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: bay_occupancy_book_cancel_conservation
        grounds:
          - state_machines.HangarSlot.BOOKED_to_CANCELLED
          - validations[priority=17]
        distinguishing_aspect: |
          Conserved quantity = bay occupancy: count of BOOKED/ACTIVE slots on a
          bay covering any instant. Formula: forall t, count(BOOKED/ACTIVE slots
          with start_at <= t < end_at) <= 1. Forward action (book) + compensating
          action (cancel) leaves the bay's occupant set identical to before —
          proven by an immediately re-bookable identical window.
        test_recipe:
          setup: ["Program QUOTED; bay BAY-1 empty"]
          setup_api_calls:
            - { call: "POST /completion/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CenterAdmin }
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id } }
            - { call: "POST /completion/hangar-bays", payload: { name: "BAY-1", daily_rate_cents: 85000 }, as: CenterAdmin, captures: { bay_id: $.data.id } }
            - { call: "POST /completion/hangar-slots", payload: { bay_id: "${bay_id}", program_id: "${prog_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-10T00:00:00Z" }, as: ProgramManager, captures: { slot1: $.data.id } }
          trigger:
            - { call: "POST /completion/hangar-slots/${slot1}/cancel", payload: {}, as: ProgramManager, captures: { st1: $.data.status } }
            - { call: "POST /completion/hangar-slots", payload: { bay_id: "${bay_id}", program_id: "${prog_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-10T00:00:00Z" }, as: ProgramManager, captures: { slot2: $.data.id, st2: $.data.status } }
          assert:
            - "st1 == CANCELLED (compensating action)"
            - "st2 == BOOKED — the identical window is free again; occupancy invariant restored (no CANCELLED slot counts)"

      - name: invoice_issue_void_billed_total_conservation
        grounds:
          - state_machines.Invoice.ISSUED_to_VOIDED
          - entities.RefurbProgram.fields.billed_total_cents
        distinguishing_aspect: |
          Conserved quantity = money: program.billed_total_cents ==
          sum(total_cents over Invoices with status in {ISSUED, PAID}). Issue
          (forward) + void (compensating) returns billed_total_cents to its
          prior value (1,234,567 -> 0), a different conserved quantity than bay
          occupancy or record counts.
        test_recipe:
          setup: ["Program BOOKED (DEPOSIT invoice issuable); DRAFT DEPOSIT invoice total 1,234,567"]
          setup_api_calls:
            - { call: "POST /completion/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CenterAdmin }
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id } }
            - { call: "POST /completion/hangar-bays", payload: { name: "BAY-1", daily_rate_cents: 85000 }, as: CenterAdmin, captures: { bay_id: $.data.id } }
            - { call: "POST /completion/hangar-slots", payload: { bay_id: "${bay_id}", program_id: "${prog_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-10T00:00:00Z" }, as: ProgramManager, captures: { slot_id: $.data.id } }
            - { call: "POST /completion/programs/${prog_id}/advance", payload: { to_phase: "BOOKED" }, as: ProgramManager }
            - { call: "POST /completion/invoices", payload: { program_id: "${prog_id}", kind: "DEPOSIT" }, as: FinanceClerk, captures: { inv_id: $.data.id, inv_tot: $.data.total_cents } }
          trigger:
            - { call: "POST /completion/invoices/${inv_id}/issue", payload: {}, as: FinanceClerk }
            - { call: "GET /completion/programs/${prog_id}", as: ProgramManager, captures: { billed1: $.data.billed_total_cents } }
            - { call: "POST /completion/invoices/${inv_id}/void", payload: {}, as: FinanceClerk, captures: { inv_st: $.data.status } }
            - { call: "GET /completion/programs/${prog_id}", as: ProgramManager, captures: { billed2: $.data.billed_total_cents } }
          assert:
            - "inv_tot == 1234567 (round(12345673 x 0.10)) and billed1 == 1234567 after issue"
            - "inv_st == VOIDED and billed2 == 0 — issue+void pair conserves billed_total_cents"

      - name: weight_signoff_supersede_single_signed
        grounds:
          - state_machines.WeightBalanceRecord.PREPARED_to_SIGNED_OFF
          - state_machines.WeightBalanceRecord.SIGNED_OFF_to_SUPERSEDED
        distinguishing_aspect: |
          Conserved quantity = cardinality: count of SIGNED_OFF records per
          (program, variant) <= 1. Signing a second FINAL record (forward)
          auto-supersedes the first (compensating), leaving the signed-off
          count at exactly 1 — verified via the filtered list endpoint.
        test_recipe:
          setup: ["Program QUOTED with APPROVED scheme; one FINAL WBR already SIGNED_OFF (delta 38.6)"]
          setup_api_calls:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id, prog_v0: $.data.version } }
            - { call: "POST /completion/paint-schemes", payload: { program_id: "${prog_id}", drawing_ref: "DWG-1869-A", painted_area_sqft: 2400, coat_count: 2, stripe_pct: 0.10 }, as: DesignLead, captures: { sch_id: $.data.id } }
            - { call: "POST /completion/paint-schemes/${sch_id}/submit", payload: {}, as: DesignLead }
            - { call: "POST /completion/paint-schemes/${sch_id}/approve", payload: { expected_program_version: "${prog_v0}" }, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "POST /completion/weight-balance-records", payload: { program_id: "${prog_id}", scheme_id: "${sch_id}", variant: "FINAL", removal_weight_lbs: 100.0, installed_weight_lbs: 108.0 }, as: ShopTechnician, as_user_id: "tech-1", captures: { wbr1: $.data.id } }
            - { call: "POST /completion/weight-balance-records/${wbr1}/sign-off", payload: {}, as: QualityInspector, as_user_id: "qi-1", captures: { st1: $.data.status } }
          trigger:
            - { call: "POST /completion/weight-balance-records", payload: { program_id: "${prog_id}", scheme_id: "${sch_id}", variant: "FINAL", removal_weight_lbs: 100.0, installed_weight_lbs: 108.0 }, as: ShopTechnician, as_user_id: "tech-1", captures: { wbr2: $.data.id } }
            - { call: "POST /completion/weight-balance-records/${wbr2}/sign-off", payload: {}, as: QualityInspector, as_user_id: "qi-1", captures: { st2: $.data.status } }
            - { call: "GET /completion/weight-balance-records/${wbr1}", as: QualityInspector, captures: { st1_after: $.data.status } }
            - { call: "GET /completion/weight-balance-records?program_id=${prog_id}&variant=FINAL&status=SIGNED_OFF", as: QualityInspector, captures: { only_id: "$.data[0].id" } }
          assert:
            - "st1 == SIGNED_OFF before the second sign-off; st2 == SIGNED_OFF after"
            - "st1_after == SUPERSEDED (compensating auto-transition)"
            - "filtered SIGNED_OFF list contains exactly one record and only_id == wbr2"
