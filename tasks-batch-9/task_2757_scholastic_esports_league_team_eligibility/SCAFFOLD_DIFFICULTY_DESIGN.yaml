            - "Team.${tm_b_id}.status is still REGISTERED and roster_locked_at is still null"
            - "a POST /seasons/${se_id}/advance to ROSTER_LOCKED now returns 409 with data.error_id == ERR_INVALID_SEASON_STAGE, because only one team reached ROSTER_LOCKED"

      - name: rolling_gpa_at_three_decimals_lands_exactly_on_the_min_gpa_threshold
        metric: "3-decimal credit-weighted GPA compared against District.min_gpa"
        endpoint: "POST /students/{studentId}/academic-postings"
        grounds:
          - calculations.academic_standing_evaluation
          - entities.District.fields.min_gpa
          - entities.Student.fields.effective_gpa
          - entities.Student.fields.academic_standing
        distinguishing_aspect: |
          A different metric (a rounded 3-decimal ratio, not an instant) on a different
          endpoint (academic-postings, not roster-lock). The weighted average lands on exactly
          2.275, and the comparison is >= on the ROUNDED value: at min_gpa 2.275 the student is
          GOOD, and at min_gpa 2.276 the same student is PROBATION. An implementation that
          compares before rounding, or uses a strict >, flips one of the two.
        test_recipe:
          setup:
            - "District EDGE_IN with academic_standing_basis ROLLING_CUMULATIVE, min_gpa 2.275, probation_gpa_floor 1.750"
            - "District EDGE_OUT identical except min_gpa 2.276"
            - "One school and one student under each district"
            - "Each student receives a first posting of 2.400 over 9 credits (so the trigger posting shifts it into the prior term)"
            - "Logical clock left at the 2026-08-01T00:00:00.000Z startup default"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "Edge In District", state_code: "CA", academic_standing_basis: "ROLLING_CUMULATIVE", min_gpa: 2.275, probation_gpa_floor: 1.750 }
              as: LeagueAdmin
              captures: { d_in_id: $.data.id }
            - call: "POST /districts"
              payload: { name: "Edge Out District", state_code: "OR", academic_standing_basis: "ROLLING_CUMULATIVE", min_gpa: 2.276, probation_gpa_floor: 1.750 }
              as: LeagueAdmin
              captures: { d_out_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_in_id}", name: "North High", nces_code: "N-001" }
              as: DistrictAdmin
              as_user_id: "${d_in_id}"
              captures: { s_in_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_out_id}", name: "West High", nces_code: "W-001" }
              as: DistrictAdmin
              as_user_id: "${d_out_id}"
              captures: { s_out_id: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${s_in_id}", full_name: "Ivy In", birthdate: "2009-05-10", grade_level: 11 }
              as: AthleticDirector
              as_user_id: "${s_in_id}"
              captures: { st_in_id: $.data.id, st_in_v0: $.data.version }
            - call: "POST /students"
              payload: { school_id: "${s_out_id}", full_name: "Otto Out", birthdate: "2009-05-10", grade_level: 11 }
              as: AthleticDirector
              as_user_id: "${s_out_id}"
              captures: { st_out_id: $.data.id, st_out_v0: $.data.version }
            - call: "POST /students/${st_in_id}/academic-postings"
              payload: { term_label: "2025-FALL", term_gpa: 2.400, term_credits: 9, expected_student_version: "${st_in_v0}" }
              as: EligibilityOfficer
              as_user_id: "officer-a"
              captures: { st_in_v1: $.data.version }
            - call: "POST /students/${st_out_id}/academic-postings"
              payload: { term_label: "2025-FALL", term_gpa: 2.400, term_credits: 9, expected_student_version: "${st_out_v0}" }
              as: EligibilityOfficer
              as_user_id: "officer-a"
              captures: { st_out_v1: $.data.version }
          trigger:
            - call: "POST /students/${st_in_id}/academic-postings"
              payload: { term_label: "2026-SPRING", term_gpa: 1.900, term_credits: 3, expected_student_version: "${st_in_v1}" }
              as: EligibilityOfficer
              as_user_id: "officer-a"
            - call: "POST /students/${st_out_id}/academic-postings"
              payload: { term_label: "2026-SPRING", term_gpa: 1.900, term_credits: 3, expected_student_version: "${st_out_v1}" }
              as: EligibilityOfficer
              as_user_id: "officer-a"
          assert:
            - "both trigger calls return 200"
            - "Student.${st_in_id}.effective_gpa == 2.275 exactly ((1.900*3 + 2.400*9) / 12 == 27.3 / 12) and academic_standing == GOOD"
            - "Student.${st_out_id}.effective_gpa == 2.275 as well, but academic_standing == PROBATION against min_gpa 2.276"
            - "both students report standing_basis_applied == ROLLING_CUMULATIVE, latest_term_gpa 1.900 / latest_term_credits 3 and prior_term_gpa 2.400 / prior_term_credits 9"
            - "neither student is INELIGIBLE, since 2.275 is above both probation_gpa_floor values of 1.750"

      - name: age_at_cutoff_completed_years_boundary_on_enrollment_verification
        metric: "completed whole years from verified_birthdate to Season.age_cutoff_date"
        endpoint: "POST /roster-slots/{slotId}/verify-enrollment"
        grounds:
