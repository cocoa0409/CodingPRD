        test_recipe:
          setup: ["exam with one issue"]
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "FR", agency_name: "FR", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
