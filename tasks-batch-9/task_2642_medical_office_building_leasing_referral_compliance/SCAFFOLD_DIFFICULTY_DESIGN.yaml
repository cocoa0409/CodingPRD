          setup:
            - "One 100000 sf Building at 30.00 psf market with a 5000 sf STANDARD_EXAM suite and a WAITING_ROOM shared space of 24 seats open 07:00-19:00."
            - "One non-physician-owned INDEPENDENT_PRACTICE tenant on a DIRECT lease certified at 32.00 psf, ACTIVE from 2026-09-01, with SIGNED_LEASE and SPACE_SHARING_SCHEDULE both on file."
