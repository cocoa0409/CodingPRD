      - name: parallel_dimensions_move_independently_on_athlete
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Athlete.registration_status
          - state_machines.Athlete.medical_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / athlete_parallel_registration_and_medical_dimensions
          rationale: "That §1.8 instance drives medical_status CLEARED -> HOLD with registration_status held at ACTIVE and then registration_status ACTIVE -> LAPSED with medical_status held at HOLD, which is exactly this row's claim."

      - name: guarded_transition_session_requires_certified_credential
        claim_type: guarded transitions
        grounds:
          - validations.priority_10.ERR_COACH_CREDENTIAL_INVALID
          - state_machines.PracticeSession.initial_state
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / practice_session_requires_certified_coach_credential
          rationale: "The cross-entity guard - session creation allowed only while the named Credential is CERTIFIED - is asserted there in both directions with a byte-identical request."

      - name: ledger_sync_on_attendance_and_reversal
        claim_type: Ledger sync
        grounds:
          - calculations.program_practice_minute_ledger
          - entities.Program.fields.program_practice_minutes
        excluded_because:
          difficulty_instance: compensating_invariant / session_cancel_conserves_practice_minute_ledger
          rationale: "Ancestor ledger sync and its exact reconciliation after reversal are both asserted there across AttendanceRecord, Athlete and Program."

      - name: compensation_reverses_contribution_side_effects
        claim_type: Compensation
        grounds:
          - state_machines.Contribution.RECEIVED_to_VOID
          - entities.Program.fields.family_engagement_credit_cents
        excluded_because:
          difficulty_instance: compensating_invariant / contribution_void_conserves_support_ledger
          rationale: "Undo-transition drift is asserted there per-row and per-ledger, including the rounded match credit."

      - name: cross_entity_credential_expiry_adjusts_sessions
        claim_type: Cross-entity
        grounds:
          - state_machines.Credential.CERTIFIED_to_EXPIRED
          - state_machines.PracticeSession.SCHEDULED_to_VOIDED
        excluded_because:
          difficulty_instance: transitive_cascade / sweep_credential_expiry_voids_scheduled_sessions
          rationale: "Entity A (Credential) changing and entity B (PracticeSession) adjusting - with a control session that must not move - is the whole point of that instance."

