  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: exclusivity_adjacent_flights_end_equals_start
        grounds:
          - state_machines.LineItem.DRAFT_to_ACTIVE
          - errors[ERR_CATEGORY_EXCLUSIVE_CONFLICT]
        distinguishing_aspect: |
          Metric: time. Half-open flight semantics make flight_B.start ==
          flight_A.end non-overlapping: the adjacent same-category activation
          succeeds while a one-day-overlap activation on the same show fails —
          the boundary sits exactly at end == start, exercised via the
          line-item ACTIVATE endpoint.
        test_recipe:
          setup:
            - "Show; three different TECHNOLOGY advertisers A1/A2/A3"
            - "CA [2026-08-01, 2026-09-01) ACTIVE with LI_A ACTIVE; CB [2026-09-01, 2026-10-01) ACTIVE with LI_B DRAFT; CC [2026-08-15, 2026-09-15) ACTIVE with LI_C DRAFT"
