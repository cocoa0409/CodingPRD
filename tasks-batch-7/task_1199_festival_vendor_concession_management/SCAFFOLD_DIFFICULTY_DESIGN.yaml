  - rule_id: non_linear_state_machine
    instances:
      - name: application_revision_cycle_and_waitlist_reentry
        grounds:
          - state_machines.VendorApplication.UNDER_REVIEW_to_CHANGES_REQUESTED
          - state_machines.VendorApplication.CHANGES_REQUESTED_to_SUBMITTED
          - state_machines.VendorApplication.WAITLISTED_to_UNDER_REVIEW
          - entities.VendorApplication.fields.supersedes_application_id
        distinguishing_aspect: |
          Cyclic machine on VendorApplication: the revision loop SUBMITTED ->
          UNDER_REVIEW -> CHANGES_REQUESTED -> (supersede) -> SUPERSEDED with a new
          SUBMITTED at review_round+1, AND the re-entry loop UNDER_REVIEW ->
          WAITLISTED -> UNDER_REVIEW. Both loops are traversed on the same vendor.
        test_recipe:
          setup:
            - "Festival APPLICATIONS_OPEN with one zone; vendor with application app1 (FLAT_FEE proposal)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FestivalDirector }
            - call: "POST /festivals"
              payload: { name: "Cycle Fest", event_start: "2026-07-10T12:00:00Z", event_end: "2026-07-12T23:00:00Z", category_cap_per_category: 2 }
              as: FestivalDirector
              captures: { fest: $.data.id }
            - call: "POST /zones"
              payload: { festival_id: "${fest}", name: "North", power_capacity_amps: 100, water_hookup_total: 1 }
              as: OperationsLead
            - { call: "POST /festivals/${fest}/advance-status", payload: { to_status: "APPLICATIONS_OPEN" }, as: FestivalDirector }
            - call: "POST /vendors"
              payload: { legal_name: "Cycle Vendor LLC", contact_email: "c@cycle.com" }
              as: VendorManager
              captures: { vend: $.data.id }
            - call: "POST /vendor-applications"
              payload: { vendor_id: "${vend}", festival_id: "${fest}", category: "FOOD_HOT", fee_model: "FLAT_FEE", proposed_flat_fee_cents: 70000, power_needed_amps: 20, requires_water: false }
              as: Vendor
              as_user_id: "${vend}"
              captures: { app1: $.data.id, round1: $.data.review_round }
            - { call: "POST /vendor-applications/${app1}/start-review", payload: {}, as: VendorManager }
            - { call: "POST /vendor-applications/${app1}/request-changes", payload: { notes: "fix menu" }, as: VendorManager }
          trigger:
            - call: "POST /vendor-applications"
              payload: { vendor_id: "${vend}", festival_id: "${fest}", category: "FOOD_HOT", fee_model: "FLAT_FEE", proposed_flat_fee_cents: 75000, power_needed_amps: 20, requires_water: false, supersedes_application_id: "${app1}" }
              as: Vendor
              as_user_id: "${vend}"
              captures: { app2: $.data.id, round2: $.data.review_round, app2_status: $.data.status }
            - call: "GET /vendor-applications/${app1}"
              payload: {}
              as: VendorManager
              captures: { app1_status: $.data.status }
            - { call: "POST /vendor-applications/${app2}/start-review", payload: {}, as: VendorManager }
            - call: "POST /vendor-applications/${app2}/decide"
              payload: { decision: "WAITLISTED" }
              as: VendorManager
              captures: { wl_status: $.data.status }
            - call: "POST /vendor-applications/${app2}/start-review"
              payload: {}
              as: VendorManager
              captures: { re_status: $.data.status }
            - call: "POST /vendor-applications/${app2}/decide"
              payload: { decision: "ACCEPTED", curated_fee_model: "FLAT_FEE", curated_flat_fee_cents: 75000 }
              as: VendorManager
              captures: { acc_status: $.data.status, acc_fee: $.data.curated_flat_fee_cents }
          assert:
            - "${round1} == 0 (fresh application)"
            - "after supersede-resubmit: ${app1_status} == SUPERSEDED, ${app2_status} == SUBMITTED, ${round2} == 1"
            - "revision loop closed: SUBMITTED -> UNDER_REVIEW -> CHANGES_REQUESTED -> SUPERSEDED + new SUBMITTED"
            - "waitlist re-entry loop: ${wl_status} == WAITLISTED then ${re_status} == UNDER_REVIEW"
            - "${acc_status} == ACCEPTED and ${acc_fee} == 75000"

      - name: settlement_dispute_reconciliation_cycle
        grounds:
          - state_machines.Settlement.RECONCILING_to_DISPUTED
          - state_machines.Settlement.DISPUTED_to_RECONCILING
