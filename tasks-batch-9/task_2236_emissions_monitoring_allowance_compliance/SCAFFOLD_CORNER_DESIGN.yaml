              as: QAAnalyst
              captures: { cem2_id: $.data.id }
          assert:
            - "trigger 1 returns HTTP 409 with error_id == ERR_DUPLICATE_MONITORING_SYSTEM — the slot is (unit_id, parameter), not (unit_id, parameter, span_value)"
            - "trigger 2 returns HTTP 201 — a different parameter on the same unit is a different slot"
            - "trigger 3 returns HTTP 200 with MonitoringSystem.${cem_id}.qa_status == RETIRED"
            - "trigger 4 returns HTTP 201 with MonitoringSystem.${cem2_id}.span_value == 500.0, qa_status == RECERTIFICATION_PENDING and cal_status == CAL_EXPIRED"
            - "the retired row still exists: GET /emissions/monitoring-systems/${cem_id} returns HTTP 200 with qa_status == RETIRED"
            - "GET /emissions/monitoring-systems?unit_id=${unit_id} returns total_count == 3"

      - name: sm_precondition_violation_returns_the_precondition_error
        claim_type: precondition_enforcement
        grounds:
          - state_machines.QuarterlyReport
        excluded_because:
          difficulty_instance: cross_entity_report_validate_blocked_by_invalidated_fuel_sample
          rationale: "That instance violates the validate preconditions one at a time (invalidated sample, out-of-control monitor, uncertified monitor) and asserts the specific error for each, which is exactly the precondition-enforcement claim for the busiest transition in the scaffold."

      - name: sm_parallel_dimensions_are_independent
        claim_type: parallel
        grounds:
          - state_machines.MonitoringSystem.parallel_dimensions
        excluded_because:
          difficulty_instance: non_linear_monitoring_system_qa_and_calibration_dimensions_move_independently
          rationale: "That instance drives qa_status and cal_status through four combinations on one row and asserts the combined state after each step, covering the parallel-shape claim."

      - name: sm_guarded_transition_reads_a_second_entity
        claim_type: guarded_transitions
        grounds:
          - state_machines.ControlOutageWindow
        excluded_because:
          difficulty_instance: cross_entity_outage_activation_requires_unit_off_line
          rationale: "ACTIVATE is guarded on Unit.dispatch_state, and that instance tests both the guarded-open and guarded-closed sides on the same window."

      - name: sm_cascade_down_reaches_grandchildren
        claim_type: cascade_down
        grounds:
          - state_machines.MonitoringSystem
        excluded_because:
          difficulty_instance: cascade_out_of_control_calibration_flips_hours_reverts_report_and_withdraws_event
          rationale: "The four-link LINK 1..4 chain from a single calibration down to hours, report totals, permit-limit re-evaluation and event withdrawal is asserted link by link there."

      - name: sm_cross_entity_side_effect_adjusts_a_sibling_aggregate
        claim_type: cross_entity
        grounds:
          - state_machines.AllowanceAccount
        excluded_because:
          difficulty_instance: cascade_true_up_shortfall_creates_penalty_flips_posture_and_restricts_dispatch
          rationale: "The true-up side effects reach across three aggregates (transactions, facility posture, unit dispatch) and that instance asserts each hop."

      - name: sm_ledger_sync_updates_an_ancestor_field
        claim_type: ledger_sync
        grounds:
          - state_machines.ComplianceCertification
        excluded_because:
          difficulty_instance: invariant_certified_so2_ledger_returns_to_zero_across_certify_and_revoke
          rationale: "Certification credits and revocation debits Unit.certified_so2_lbs_ytd by exactly certified_so2_lbs_snapshot; that instance reconciles the ancestor ledger before and after."

      - name: sm_compensation_reverses_every_original_side_effect
        claim_type: compensation
        grounds:
          - state_machines.AllowanceTransaction
        excluded_because:
          difficulty_instance: cascade_reversing_true_up_surrender_unlocks_account_and_releases_dispatch
          rationale: "REVERSE on the TRUE_UP_SURRENDER row is the compensation edge; that instance asserts the account, penalty row, posture and dispatch all return to their pre-true-up values with no drift."

      - name: sm_conditional_cascade_skips_children_in_the_wrong_state
        claim_type: conditional_cascade
        grounds:
          - state_machines.MonitoringSystem
        excluded_because:
          difficulty_instance: cascade_out_of_control_calibration_flips_hours_reverts_report_and_withdraws_event
          rationale: "LINK 2 flips only hours whose data_quality == MEASURED and LINK 3 reverts only a report in VALIDATED; that instance pins both conditional guards by leaving an already-SUBSTITUTED hour untouched."

  # ===========================================================================
  # From Table 3 (Calculations)
  # ===========================================================================
  - section: calculations
    instances:

      - name: calc_true_up_input_set_admits_only_accepted_reports_and_enforceable_events
        claim_type: input_set_filtering
        grounds:
          - calculations.allowance_true_up_waterfall
          - state_machines.AllowanceAccount
          - validations[priority=265]
          - validations[priority=270]
          - errors[ERR_TRUE_UP_BEFORE_DEADLINE]
          - errors[ERR_REPORTS_NOT_ALL_ACCEPTED]
        distinguishing_aspect: "The true-up counts only the ACCEPTED report of the compliance year and ignores both an EXCUSED excess event worth 17 tons and a DRAFT 2027 report, so the obligation is exactly ceil(0.438) = 1 and not 18."
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z; Facility.true_up_deadline_utc = 2026-04-05T00:00:00Z"
            - "U1 has a CERTIFIED SO2 CEM and a 2026 Q2 report with three MEASURED CEMS hours (total_so2_tons 0.438), carried to CERTIFIED"
            - "an SO2 250.0 LB_PER_HR ROLLING_3_HOUR limit produced one excess event, which the reviewer EXCUSED (penalty_allowance_debit_tons 17)"
            - "U2 owns a DRAFT 2027 Q1 report that must not participate"
            - "one ARP_SO2 2026 allowance account with prior 5.000 / current 0.000 / next 0.000"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2026-04-05T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { u1_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U2", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { u2_id: $.data.id }
            - call: "POST /emissions/units/${u1_id}/monitoring-systems"
              payload: { parameter: "SO2", system_type: "CEM", span_value: 400.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { cem_id: $.data.id, cem_v1: $.data.version }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${cem_v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 368.0 }
              as: QAAnalyst
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
            - call: "POST /emissions/units/${u1_id}/quarterly-reports"
              payload: { year: 2026, quarter: 2 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { q2_id: $.data.id, q2_v1: $.data.version }
            - call: "POST /emissions/units/${u1_id}/operating-hours/bulk"
              payload: { expected_quarterly_report_version: "${q2_v1}", hours: [{ hour_begin_utc: "2026-04-01T00:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }, { hour_begin_utc: "2026-04-01T01:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }, { hour_begin_utc: "2026-04-01T02:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }] }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
            - call: "POST /emissions/units/${u1_id}/permit-limits"
              payload: { pollutant: "SO2", limit_value: 250.0, limit_units: "LB_PER_HR", averaging_basis: "ROLLING_3_HOUR", effective_from_utc: "2026-04-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { pl_id: $.data.id }
            - call: "POST /emissions/permit-limits/${pl_id}/evaluate"
              payload: { anchor_utc: "2026-04-01T03:00:00Z" }
              as: RegulatoryReviewer
            - call: "GET /emissions/excess-emission-events"
              payload: { permit_limit_id: "${pl_id}" }
              as: RegulatoryReviewer
              captures: { ev_id: "$.data[0].id" }
            - call: "POST /emissions/excess-emission-events/${ev_id}/report"
              payload: { narrative: "Absorber bypass during a scrubber trip.", corrective_action: "Bypass damper interlock repaired." }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
            - call: "POST /emissions/excess-emission-events/${ev_id}/review"
              payload: {}
              as: RegulatoryReviewer
            - call: "POST /emissions/excess-emission-events/${ev_id}/disposition"
              payload: { decision: "EXCUSE", reason: "Sudden and unavoidable malfunction; excused under the permit." }
              as: RegulatoryReviewer
            - call: "POST /emissions/quarterly-reports/${q2_id}/validate"
              payload: {}
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
            - call: "POST /emissions/quarterly-reports/${q2_id}/submit"
              payload: { submission_format: "XML_ECMPS" }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { q2_v_submitted: $.data.version }
            - call: "POST /emissions/quarterly-reports/${q2_id}/certifications"
              payload: { expected_quarterly_report_version: "${q2_v_submitted}", statement_text: "I certify under penalty of law that the submitted data are true and complete." }
              as: DesignatedRepresentative
              as_user_id: "dr_1"
            - call: "POST /emissions/units/${u2_id}/quarterly-reports"
              payload: { year: 2027, quarter: 1 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { q2027_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/allowance-accounts"
              payload: { program: "ARP_SO2", compliance_year: 2026, holdings_current_vintage_tons: 0.000, holdings_prior_vintage_tons: 5.000, holdings_next_vintage_tons: 0.000 }
              as: RegulatoryReviewer
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /emissions/allowance-accounts/${acct_id}/true-up"
              payload: {}
              as: RegulatoryReviewer
              captures: { e_early: $.data.error_id }
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-06T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/allowance-accounts/${acct_id}/true-up"
              payload: {}
              as: RegulatoryReviewer
              captures: { e_not_accepted: $.data.error_id }
            - call: "POST /emissions/quarterly-reports/${q2_id}/disposition"
              payload: { decision: "ACCEPT" }
              as: RegulatoryReviewer
            - call: "POST /emissions/allowance-accounts/${acct_id}/true-up"
              payload: {}
              as: RegulatoryReviewer
          assert:
            - "trigger 1 returns HTTP 409 with error_id == ERR_TRUE_UP_BEFORE_DEADLINE — the clock is 2026-04-02, three days before the deadline"
            - "trigger 3 returns HTTP 409 with error_id == ERR_REPORTS_NOT_ALL_ACCEPTED — a CERTIFIED report is not an ACCEPTED report"
            - "trigger 5 returns HTTP 200 with AllowanceAccount.${acct_id}.obligation_tons == 1 — ceil(0.438) plus 0 event tons"
            - "the EXCUSED event contributed nothing: ExcessEmissionEvent.${ev_id}.penalty_allowance_debit_tons == 17 while obligation_tons is 1"
            - "the DRAFT 2027 report contributed nothing: QuarterlyReport.${q2027_id}.status == DRAFT and year == 2027"
            - "AllowanceAccount.${acct_id}.holdings_prior_vintage_tons == 4.000, holdings_current_vintage_tons == 0.000, surrendered_tons == 1.000"
            - "AllowanceAccount.${acct_id}.shortfall_tons == 0.000, penalty_deducted_tons == 0.0, status == CLOSED and true_up_utc == 2026-04-06T00:00:00Z"
            - "exactly one AllowanceTransaction exists with origin == TRUE_UP_SURRENDER, status == SETTLED, debited_prior_tons == 1.000 and debited_current_tons == 0.000; no TRUE_UP_PENALTY row was created"
            - "Facility.${fac_id}.compliance_posture == COMPLIANT"

      - name: calc_penalty_debit_applies_the_minimum_ton_floor
        claim_type: constants_applied
        grounds:
          - calculations.excess_event_penalty_debit
          - calculations.excess_event_penalty_debit.constants.MIN_PENALTY_DEBIT_TONS
        distinguishing_aspect: "A 0.1 lb/hr exceedance yields exceedance_pct 0.0342 whose ceil is 1, so the debit is pinned by MIN_PENALTY_DEBIT_TONS rather than rounded to 0, while a 42.2 lb/hr exceedance on the same hours yields ceil(16.8800) = 17."
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "U1 with a CERTIFIED SO2 CEM and three MEASURED CEMS hours of 292.2 lb SO2 each in a DRAFT 2026 Q2 report"
            - "two SO2 LB_PER_HR ROLLING_3_HOUR limits on U1: 292.1 effective 2026-03-31 and 250.0 effective 2026-04-01"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "SO2", system_type: "CEM", span_value: 400.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { cem_id: $.data.id, cem_v1: $.data.version }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${cem_v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 368.0 }
              as: QAAnalyst
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/quarterly-reports"
              payload: { year: 2026, quarter: 2 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { q2_id: $.data.id, q2_v1: $.data.version }
            - call: "POST /emissions/units/${unit_id}/operating-hours/bulk"
              payload: { expected_quarterly_report_version: "${q2_v1}", hours: [{ hour_begin_utc: "2026-04-01T00:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }, { hour_begin_utc: "2026-04-01T01:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }, { hour_begin_utc: "2026-04-01T02:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }] }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
            - call: "POST /emissions/units/${unit_id}/permit-limits"
              payload: { pollutant: "SO2", limit_value: 292.1, limit_units: "LB_PER_HR", averaging_basis: "ROLLING_3_HOUR", effective_from_utc: "2026-03-31T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { pl_tight: $.data.id }
            - call: "POST /emissions/units/${unit_id}/permit-limits"
              payload: { pollutant: "SO2", limit_value: 250.0, limit_units: "LB_PER_HR", averaging_basis: "ROLLING_3_HOUR", effective_from_utc: "2026-04-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { pl_loose: $.data.id }
          trigger:
            - call: "POST /emissions/permit-limits/${pl_tight}/evaluate"
              payload: { anchor_utc: "2026-04-01T03:00:00Z" }
              as: RegulatoryReviewer
            - call: "GET /emissions/excess-emission-events"
              payload: { permit_limit_id: "${pl_tight}" }
              as: RegulatoryReviewer
              captures: { ev_tight: "$.data[0].id" }
            - call: "POST /emissions/permit-limits/${pl_loose}/evaluate"
              payload: { anchor_utc: "2026-04-01T03:00:00Z" }
              as: RegulatoryReviewer
            - call: "GET /emissions/excess-emission-events"
              payload: { permit_limit_id: "${pl_loose}" }
              as: RegulatoryReviewer
              captures: { ev_loose: "$.data[0].id" }
          assert:
            - "PermitLimit.${pl_tight}.evaluation_status == EXCEEDED with current_rolling_value == 292.2 and window_sample_count == 3"
            - "ExcessEmissionEvent.${ev_tight}.exceedance_magnitude == 0.1000 and penalty_allowance_debit_tons == 1 — ceil(0.0342) is 1, and MIN_PENALTY_DEBIT_TONS would raise a 0 to 1 as well"
            - "ExcessEmissionEvent.${ev_loose}.exceedance_magnitude == 42.2000 and penalty_allowance_debit_tons == 17 — ceil(16.8800), not round_half_up(16.8800) == 17 by coincidence of this pair but 16 under a floor implementation"
            - "both events carry status == DETECTED, limit_value_snapshot equal to their parent's limit_value, and observed_value == 292.2"
            - "GET /emissions/excess-emission-events?unit_id=${unit_id} returns total_count == 2"

      - name: calc_rolling_limit_equality_is_in_compliance_not_exceeded
        claim_type: threshold
        grounds:
          - calculations.rolling_average_limit_check
          - entities.PermitLimit.fields.evaluation_status
        distinguishing_aspect: "With the rolling value at exactly 292.2, a 292.2 limit evaluates IN_COMPLIANCE and creates no event while a 292.1 limit evaluates EXCEEDED, pinning the comparison as strict `>`."
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "U1 with a CERTIFIED SO2 CEM and three MEASURED CEMS hours of 292.2 lb SO2 each"
            - "two SO2 LB_PER_HR ROLLING_3_HOUR limits: 292.2 effective 2026-03-31 and 292.1 effective 2026-04-01"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "SO2", system_type: "CEM", span_value: 400.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { cem_id: $.data.id, cem_v1: $.data.version }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${cem_v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 368.0 }
              as: QAAnalyst
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/quarterly-reports"
              payload: { year: 2026, quarter: 2 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { q2_id: $.data.id, q2_v1: $.data.version }
            - call: "POST /emissions/units/${unit_id}/operating-hours/bulk"
              payload: { expected_quarterly_report_version: "${q2_v1}", hours: [{ hour_begin_utc: "2026-04-01T00:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }, { hour_begin_utc: "2026-04-01T01:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }, { hour_begin_utc: "2026-04-01T02:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }] }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
            - call: "POST /emissions/units/${unit_id}/permit-limits"
              payload: { pollutant: "SO2", limit_value: 292.2, limit_units: "LB_PER_HR", averaging_basis: "ROLLING_3_HOUR", effective_from_utc: "2026-03-31T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { pl_equal: $.data.id }
            - call: "POST /emissions/units/${unit_id}/permit-limits"
              payload: { pollutant: "SO2", limit_value: 292.1, limit_units: "LB_PER_HR", averaging_basis: "ROLLING_3_HOUR", effective_from_utc: "2026-04-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { pl_under: $.data.id }
          trigger:
            - call: "POST /emissions/permit-limits/${pl_equal}/evaluate"
              payload: { anchor_utc: "2026-04-01T03:00:00Z" }
              as: RegulatoryReviewer
            - call: "GET /emissions/excess-emission-events"
              payload: { permit_limit_id: "${pl_equal}" }
              as: RegulatoryReviewer
            - call: "POST /emissions/permit-limits/${pl_under}/evaluate"
              payload: { anchor_utc: "2026-04-01T03:00:00Z" }
              as: RegulatoryReviewer
          assert:
