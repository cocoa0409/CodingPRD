              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
            - call: "POST /clients"
              payload: { agency_id: "${ag_id}", household_size: 4, county: "CENTRAL", has_infant: false }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { cl_id: "$.data.id" }
            - call: "POST /referrals"
              payload: { client_id: "${cl_id}", agency_id: "${ag_id}", requested_categories: ["BED"], urgency: "ROUTINE", home_visit_completed: true, bed_bug_attestation: true }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { ref_id: "$.data.id" }
            - call: "POST /referrals/${ref_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "${ag_id}"
            - call: "POST /referrals/${ref_id}/review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /vouchers"
              payload: { referral_id: "${ref_id}", lines: [ { category: "BED", quantity_requested: 2, min_condition: "B" } ] }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { v_id: "$.data.id", v_ver: "$.data.version" }
            - call: "POST /vouchers/${v_id}/allocate"
              payload: { expected_voucher_version: "${v_ver}" }
              as: WarehouseLead
              as_user_id: "wl-inspector-1"
          trigger:
            - call: "GET /reports/unmet-need"
              payload: { county: "SOUTH" }
              as: PlatformAdmin
              captures: { south_rows: "$.data.rows", south_unmet: "$.data.total_unmet_quantity", south_hh: "$.data.total_households_waiting" }
            - call: "GET /reports/unmet-need"
              payload: { county: "CENTRAL" }
              as: PlatformAdmin
              captures: { central_rows: "$.data.rows", central_unmet: "$.data.total_unmet_quantity", central_hh: "$.data.total_households_waiting" }
          assert:
            - "${south_rows} == []"
            - "${south_unmet} == 0"
            - "${south_hh} == 0"
            - "${central_rows} has exactly 1 element"
            - "${central_rows}[0].county == CENTRAL"
            - "${central_rows}[0].category == BED"
            - "${central_rows}[0].unmet_quantity == 2"
            - "${central_rows}[0].households_waiting == 1"
            - "${central_rows}[0].max_wait_days == 0"
            - "${central_rows}[0].fill_rate_pct == 0.0"
            - "${central_unmet} == 2"
            - "${central_hh} == 1"
