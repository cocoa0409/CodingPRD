              as: CurriculumSpecialist
              captures: { st3_id: $.data.id }
            - call: "GET /arts-standards"
              payload: { discipline: "DANCE", grade_band: "G3_5", strand: "CREATING", limit: 10, offset: 0 }
              as: TeachingArtist
              as_user_id: "roster-reader-1"
              captures: { found_id: "$.data[0].id" }
            - call: "POST /arts-standards"
              payload: { code: "DA:Cr1.1.4", discipline: "DANCE", grade_band: "G3_5", strand: "CREATING", description: "duplicate submission" }
              as: CurriculumSpecialist
              captures: { err_id: $.data.error_id }
          assert:
            - "${st1_code} == DA:Cr1.1.4"
            - "HTTP status == 201 on all three creations"
            - "filtered list: total_count == 1, has_more == false"
            - "${found_id} == ${st1_id}"
            - "${st2_id} and ${st3_id} are absent from the filtered list"
            - "${err_id} == ERR_DUPLICATE_STANDARD_CODE"
            - "HTTP status == 409 on the duplicate creation"

