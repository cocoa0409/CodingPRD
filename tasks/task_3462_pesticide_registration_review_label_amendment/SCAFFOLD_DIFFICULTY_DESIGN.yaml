          setup:
            - "GENERAL_USE FOOD_USE product REGISTERED: tolerance CORN 0.05 ESTABLISHED, tolerance WHEAT 0.1 PROPOSED (added after registration), one ACTIVE CORN use site, state registration CA GRANTED. Clock 2027-03-01T00:00:00Z; CANCELLATION proceeding heard and ready."
