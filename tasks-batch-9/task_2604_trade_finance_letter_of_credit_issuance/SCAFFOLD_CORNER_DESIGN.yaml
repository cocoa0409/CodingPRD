      - name: conditional_action_approve_endpoint_forks_on_the_decision_enum
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/credits/{id}/approve
          - state_machines.DocumentaryCredit.PENDING_CREDIT_APPROVAL_to_APPROVED
          - state_machines.DocumentaryCredit.PENDING_CREDIT_APPROVAL_to_DRAFT
        distinguishing_aspect: |
          One endpoint, two outcomes chosen purely by the decision enum: APPROVE
          moves PENDING_CREDIT_APPROVAL -> APPROVED with still NO facility debit
          (allocated_cents stays 0, because approval only grants permission),
          while RETURN_TO_DRAFT walks the cyclic edge back to DRAFT so the terms
          can be re-cut, and the credit becomes submittable again. An
          implementation that treats the endpoint as a single approve action, or
          that debits the facility at approval, fails both halves.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "The standard applicant, USD 50000000 facility, NO bank and LV beneficiary."
            - "Two standard 10000000 SIGHT_PAYMENT credits Q1 and Q2 are drafted by tfo_1 with both mandatory requirements and submitted for approval."
