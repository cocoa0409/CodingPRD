      setup:
      - Logical clock at 2026-09-12T09:00:00Z. A MOBILE_PUSH market, an ACTIVE production and an ONSALE performance starting 2026-10-05.
      - A SCHEDULED RUSH allocation with daily_quantity 6, discount_pct 0.5 and per_order_limit 2, released for epoch 2026-09-12.
      - Two patrons hold WAITING queue positions, and the allocation owns one HELD seat hold on ORCH-B-4.
