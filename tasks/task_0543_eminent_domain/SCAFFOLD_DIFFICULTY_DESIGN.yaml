            - call: "POST /utility-relocations/${ur3_id}/schedule"
              payload: { crew_name: "CX", scheduled_start: "2026-05-10T11:00:00Z", scheduled_end: "2026-05-10T12:00:00Z" }
              as: UtilityCoordinator
              captures: { ur3_sched_id: $.data.id }
          assert:
            - "the 10:30 window (30-min gap from prior 10:00 end) returns error_id == ERR_CREW_UNAVAILABLE"
            - "the 11:00 window (60-min gap from prior 10:00 end) succeeds: UtilityRelocation.${ur3_id}.status == SCHEDULED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: money_conservation_close_then_rescind
        grounds:
          - state_machines.Escrow.FUNDED_to_CLOSED
          - state_machines.Escrow.CLOSED_to_CANCELLED
          - entities.Project.fields.disbursed_cents
        distinguishing_aspect: |
          Money conservation: closing raises Project.disbursed_cents to 28,350,001; the compensating rescind returns it to exactly 0 (pre-close),
          leaving the conserved quantity Project.disbursed_cents unchanged net.
        test_recipe:
          setup:
            - "A CLOSED escrow (agreed 28,350,001) so Project.disbursed_cents == 28,350,001, produced by the full clear->appraise->negotiate->escrow->fund->close chain past the waiting period."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /projects"
              payload: { name: "P18", agency_name: "DOT", total_budget_cents: 100000000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /parcels"
              payload: { project_id: "${proj_id}", apn: "APN-D18", total_area_sqft: 10000, take_area_sqft: 5000, take_type: "PARTIAL" }
              as: RightOfWayAgent
              captures: { parcel_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/ownership-interests"
              payload: { interest_type: "FEE_OWNER", holder_name: "O1", ownership_pct: 50 }
              as: RightOfWayAgent
              captures: { o1_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/ownership-interests"
              payload: { interest_type: "FEE_OWNER", holder_name: "O2", ownership_pct: 50 }
              as: RightOfWayAgent
              captures: { o2_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/ownership-interests"
              payload: { interest_type: "LIENHOLDER", holder_name: "LH1", lien_priority: 1, lien_balance_cents: 10000000 }
              as: RightOfWayAgent
              captures: { lh1_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/ownership-interests"
              payload: { interest_type: "LIENHOLDER", holder_name: "LH2", lien_priority: 2, lien_balance_cents: 8000000 }
              as: RightOfWayAgent
              captures: { lh2_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/clear-ownership"
              payload: {}
              as: RightOfWayAgent
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: Appraiser
              captures: { parcel_v: $.data.version }
            - call: "POST /parcels/${parcel_id}/appraisals"
              payload: { appraiser_name: "AX", land_value_cents: 20000000, improvements_value_cents: 5000000, severance_damages_cents: 3000000, special_benefits_cents: 1000000, expected_parcel_version: "${parcel_v}" }
              as: Appraiser
              captures: { appr_id: $.data.id }
            - call: "POST /appraisals/${appr_id}/finalize"
              payload: {}
              as: Appraiser
            - call: "POST /parcels/${parcel_id}/negotiations"
              payload: { initial_offer_cents: 27000000 }
              as: RightOfWayAgent
              captures: { neg_id: $.data.id }
            - call: "POST /negotiations/${neg_id}/rounds"
              payload: { action: "COUNTER", amount_cents: 28350001 }
              as: PropertyOwner
              as_user_id: "${o1_id}"
            - call: "POST /negotiations/${neg_id}/rounds"
              payload: { action: "ACCEPT" }
              as: RightOfWayAgent
            - call: "POST /parcels/${parcel_id}/escrows"
              payload: { source: "NEGOTIATED" }
              as: EscrowOfficer
              captures: { escrow_id: $.data.id }
            - call: "POST /escrows/${escrow_id}/fund"
              payload: {}
              as: EscrowOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /escrows/${escrow_id}/close"
              payload: {}
              as: EscrowOfficer
          trigger:
            - call: "POST /escrows/${escrow_id}/rescind"
              payload: {}
              as: ProgramAdmin
          assert:
            - "before rescind (after close) Project.${proj_id}.disbursed_cents == 28350001"
            - "after rescind Project.${proj_id}.disbursed_cents == 0"
            - "after rescind Escrow.${escrow_id}.status == CANCELLED AND Escrow.${escrow_id}.disbursed_total_cents == 0"

      - name: area_conservation_close_then_rescind
        grounds:
