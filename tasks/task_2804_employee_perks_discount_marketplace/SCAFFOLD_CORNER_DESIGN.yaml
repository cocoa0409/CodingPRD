          trigger:
            - call: "POST /perks/offers"
              payload: { agreement_id: "${agreement_id}", title: "20 percent off dinner", discount_type: "PERCENT", discount_value_bps: 2000, min_spend_cents: 1000, region_codes: ["CA"], window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z" }
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { e_not_active: $.data.error_id }
            - call: "POST /perks/agreements/${agreement_id}/activate"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-001"
            - call: "POST /perks/offers"
              payload: { agreement_id: "${agreement_id}", title: "20 percent off dinner", discount_type: "PERCENT", discount_value_bps: 2000, min_spend_cents: 1000, region_codes: ["CA"], window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z" }
              as: Merchant
