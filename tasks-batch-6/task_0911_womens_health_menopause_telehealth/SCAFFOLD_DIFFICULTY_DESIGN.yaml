# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Depth probe: 9 Difficulty Rules x 2 instances = 18 instances.
# Every grounds ref resolves in SCAFFOLD.yaml §1.1-§1.7. Every setup_api_calls
# chain drives empty-DB -> the described precondition using only §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: charge_estimate_vs_final_diverge
        grounds:
          - calculations.patient_responsibility
          - entities.Charge.fields.estimated_patient_responsibility_cents
          - entities.Charge.fields.final_patient_responsibility_cents
          - entities.InsurancePolicy.fields.remaining_deductible_cents
        distinguishing_aspect: "On the billing domain (Charge): the second charge's estimate (20000, computed while the deductible was full) and its adjudicated final (8000, computed after charge-1 consumed the deductible) are unequal for identical allowed_amount_cents."
        test_recipe:
          setup:
            - "INSURANCE patient with a policy: deductible 25000, coinsurance 0.20, oop_max 500000."
            - "ACTIVE prescription (lab not required), two refills fulfilled -> two ESTIMATED REFILL charges of allowed 20000 each; neither adjudicated yet."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Ada Vale", email: "ada@x.com", date_of_birth: "1972-03-04", state_code: "CA", billing_mode: "INSURANCE", menopause_stage: "MENOPAUSE" }
              as: CareCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/insurance-policies"
              payload: { payer_name: "BlueGrid", deductible_cents: 25000, coinsurance_rate: 0.20, out_of_pocket_max_cents: 500000 }
              as: BillingAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr Ruiz", specialty: "GYNECOLOGY", npi: "1234567890", visit_fee_cents: 15000 }
              as: CareCoordinator
              captures: { prov_id: $.data.id }
            - call: "POST /patients/${pat_id}/intake-assessments"
              payload: { symptom_ratings: [], reported_conditions: ["NONE"] }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { intake_id: $.data.id }
            - call: "POST /intake-assessments/${intake_id}/submit"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", intake_assessment_id: "${intake_id}", scheduled_start: "2026-05-10T09:00:00Z", scheduled_end: "2026-05-10T10:00:00Z" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /prescriptions"
              payload: { visit_id: "${visit_id}", hrt_type: "ESTROGEN_PATCH", days_supply_per_fill: 30, total_refills_authorized: 2, lab_required_before_refill: false, coverage_days: 90, refill_price_cents: 20000 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /prescriptions/${rx_id}/refills"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /refills/${r1_id}/approve"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /refills/${r1_id}/fulfill"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { c1_id: $.data.charge_id }
            - call: "POST /prescriptions/${rx_id}/refills"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /refills/${r2_id}/approve"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /refills/${r2_id}/fulfill"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { c2_id: $.data.charge_id }
          trigger:
            - call: "POST /charges/${c1_id}/adjudicate"
              payload: {}
              as: BillingAdmin
            - call: "POST /charges/${c2_id}/adjudicate"
              payload: {}
              as: BillingAdmin
              captures: { est2: $.data.estimated_patient_responsibility_cents, final2: $.data.final_patient_responsibility_cents }
          assert:
            - "Charge.${c2_id}.estimated_patient_responsibility_cents == 20000"
            - "Charge.${c2_id}.final_patient_responsibility_cents == 8000"
            - "Charge.${c2_id}.insurance_paid_cents == 12000"
            - "estimate (20000) != final (8000) on the same Charge"

      - name: adherence_realized_vs_projected_pdc_diverge
        grounds:
          - calculations.adherence_pdc
          - entities.CarePlan.fields.realized_pdc
          - entities.CarePlan.fields.projected_pdc
          - entities.Refill.fields.days_supply
        distinguishing_aspect: "On the adherence domain (CarePlan): realized_pdc counts only the one FULFILLED refill (0.8) while projected_pdc also counts the pending REQUESTED refill (1.0) over the same 30-day elapsed window."
        test_recipe:
          setup:
            - "CASH patient; prescription with days_supply_per_fill 24, coverage_start 2026-06-01."
            - "One refill FULFILLED (24 days supplied); one refill REQUESTED (pending). Clock advanced to 2026-07-01 (elapsed 30 days)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /patients"
              payload: { full_name: "Mae Fox", email: "mae@x.com", date_of_birth: "1970-01-01", state_code: "NY", billing_mode: "CASH", menopause_stage: "PERIMENOPAUSE" }
              as: CareCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr Lin", specialty: "ENDOCRINOLOGY", npi: "2222222222", visit_fee_cents: 12000 }
              as: CareCoordinator
              captures: { prov_id: $.data.id }
            - call: "POST /patients/${pat_id}/intake-assessments"
              payload: { symptom_ratings: [], reported_conditions: ["NONE"] }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { intake_id: $.data.id }
            - call: "POST /intake-assessments/${intake_id}/submit"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", intake_assessment_id: "${intake_id}", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T10:00:00Z" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /prescriptions"
              payload: { visit_id: "${visit_id}", hrt_type: "ESTROGEN_ORAL", days_supply_per_fill: 24, total_refills_authorized: 3, lab_required_before_refill: false, coverage_days: 90, refill_price_cents: 18000 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { rx_id: $.data.id, cp_id: $.data.care_plan_id }
            - call: "POST /prescriptions/${rx_id}/refills"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /refills/${r1_id}/approve"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /refills/${r1_id}/fulfill"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /prescriptions/${rx_id}/refills"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "GET /care-plans/${cp_id}"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { realized: $.data.realized_pdc, projected: $.data.projected_pdc }
          assert:
            - "CarePlan.${cp_id}.realized_pdc == 0.8"
            - "CarePlan.${cp_id}.projected_pdc == 1.0"
            - "realized (fulfilled-only, 0.8) != projected (includes pending refill, 1.0)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: insurance_responsibility_nested_min_max
        grounds:
          - calculations.patient_responsibility
          - entities.InsurancePolicy.fields.out_of_pocket_max_cents
          - entities.InsurancePolicy.fields.coinsurance_rate
        distinguishing_aspect: "MODE (a): a >=3-input non-linear formula with a conditional branch on billing_mode and nested min/max (deductible min, then coinsurance, then oop-cap min) — the OOP cap (room 7000) binds below the pre-cap responsibility (8000), yielding final 7000."
        test_recipe:
          setup:
            - "INSURANCE patient; policy deductible 5000, coinsurance 0.20, oop_max 7000."
            - "One REFILL charge of allowed 20000 in ESTIMATED."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Ivy Cole", email: "ivy@x.com", date_of_birth: "1968-05-05", state_code: "CA", billing_mode: "INSURANCE", menopause_stage: "POSTMENOPAUSE" }
              as: CareCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/insurance-policies"
              payload: { payer_name: "MetroCare", deductible_cents: 5000, coinsurance_rate: 0.20, out_of_pocket_max_cents: 7000 }
              as: BillingAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr Pane", specialty: "GYNECOLOGY", npi: "3333333333", visit_fee_cents: 15000 }
              as: CareCoordinator
              captures: { prov_id: $.data.id }
            - call: "POST /patients/${pat_id}/intake-assessments"
              payload: { symptom_ratings: [], reported_conditions: ["NONE"] }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { intake_id: $.data.id }
            - call: "POST /intake-assessments/${intake_id}/submit"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", intake_assessment_id: "${intake_id}", scheduled_start: "2026-05-11T09:00:00Z", scheduled_end: "2026-05-11T10:00:00Z" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /prescriptions"
              payload: { visit_id: "${visit_id}", hrt_type: "COMBINED", days_supply_per_fill: 30, total_refills_authorized: 1, lab_required_before_refill: false, coverage_days: 90, refill_price_cents: 20000 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /prescriptions/${rx_id}/refills"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /refills/${r1_id}/approve"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /refills/${r1_id}/fulfill"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { c1_id: $.data.charge_id }
          trigger:
            - call: "POST /charges/${c1_id}/adjudicate"
              payload: {}
              as: BillingAdmin
              captures: { final1: $.data.final_patient_responsibility_cents }
          assert:
            - "Charge.${c1_id}.deductible_applied_cents == 5000"
            - "Charge.${c1_id}.final_patient_responsibility_cents == 7000"
            - "Charge.${c1_id}.insurance_paid_cents == 13000"

      - name: symptom_score_round_per_domain_then_sum
        grounds:
          - calculations.symptom_severity_score
          - entities.IntakeAssessment.fields.symptom_ratings
          - entities.IntakeAssessment.fields.symptom_severity_score
        distinguishing_aspect: "MODE (b): rounding-order-sensitive — rounding each per-domain contribution to 2 decimals FIRST then summing gives 16.84, whereas summing raw then rounding gives 16.83; the scaffold pins per-domain-then-sum."
        test_recipe:
          setup:
            - "DRAFT intake with ratings VASOMOTOR=8, SLEEP=5, MOOD=7 (weights 1.0/0.833/0.667), no contraindications."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Nia Roe", email: "nia@x.com", date_of_birth: "1971-07-07", state_code: "TX", billing_mode: "CASH", menopause_stage: "MENOPAUSE" }
              as: CareCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/intake-assessments"
              payload: { symptom_ratings: [ { domain: "VASOMOTOR", severity: 8 }, { domain: "SLEEP", severity: 5 }, { domain: "MOOD", severity: 7 } ], reported_conditions: ["NONE"] }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { intake_id: $.data.id }
          trigger:
            - call: "POST /intake-assessments/${intake_id}/submit"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
              captures: { score: $.data.symptom_severity_score, st: $.data.status }
          assert:
            - "IntakeAssessment.${intake_id}.symptom_severity_score == 16.84"
            - "IntakeAssessment.${intake_id}.symptom_severity_score != 16.83"
            - "IntakeAssessment.${intake_id}.status == CLEARED"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: prescription_active_suspended_cycle
        grounds:
          - state_machines.Prescription.ACTIVE_to_SUSPENDED
          - state_machines.Prescription.SUSPENDED_to_ACTIVE
        distinguishing_aspect: "Cycle on Prescription: ACTIVE -> SUSPENDED -> ACTIVE re-enters a prior state (non-linear), unlike a one-way pipeline."
        test_recipe:
          setup:
            - "ACTIVE prescription (lab not required); patient has no PAST_DUE subscription."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Uma Ash", email: "uma@x.com", date_of_birth: "1969-02-02", state_code: "WA", billing_mode: "CASH", menopause_stage: "MENOPAUSE" }
              as: CareCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr Cho", specialty: "FAMILY_MEDICINE", npi: "4444444444", visit_fee_cents: 10000 }
              as: CareCoordinator
              captures: { prov_id: $.data.id }
            - call: "POST /patients/${pat_id}/intake-assessments"
              payload: { symptom_ratings: [], reported_conditions: ["NONE"] }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { intake_id: $.data.id }
            - call: "POST /intake-assessments/${intake_id}/submit"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", intake_assessment_id: "${intake_id}", scheduled_start: "2026-05-12T09:00:00Z", scheduled_end: "2026-05-12T10:00:00Z" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /prescriptions"
              payload: { visit_id: "${visit_id}", hrt_type: "PROGESTERONE", days_supply_per_fill: 30, total_refills_authorized: 2, lab_required_before_refill: false, coverage_days: 90, refill_price_cents: 15000 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { rx_id: $.data.id }
          trigger:
            - call: "POST /prescriptions/${rx_id}/suspend"
              payload: { reason: "safety hold" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { s1: $.data.status }
            - call: "POST /prescriptions/${rx_id}/reactivate"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { s2: $.data.status }
          assert:
            - "after suspend Prescription.${rx_id}.status == SUSPENDED"
            - "after reactivate Prescription.${rx_id}.status == ACTIVE"

      - name: refill_request_branch_approve_vs_deny
        grounds:
          - state_machines.Refill.REQUESTED_to_APPROVED
          - state_machines.Refill.REQUESTED_to_DENIED
          - entities.Refill.fields.denial_reason
        distinguishing_aspect: "Branching fork on Refill: two refills in the same REQUESTED state diverge to APPROVED (no message) vs DENIED (sets denial_reason and appends a DENIAL_NOTICE CarePlanMessage) — divergent side-effect sets per branch, a different entity than the Prescription cycle."
        test_recipe:
          setup:
            - "ACTIVE prescription with two REQUESTED refills r1, r2."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Val Day", email: "val@x.com", date_of_birth: "1973-03-03", state_code: "OR", billing_mode: "CASH", menopause_stage: "PERIMENOPAUSE" }
              as: CareCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr Ode", specialty: "GYNECOLOGY", npi: "5555555555", visit_fee_cents: 11000 }
              as: CareCoordinator
              captures: { prov_id: $.data.id }
            - call: "POST /patients/${pat_id}/intake-assessments"
              payload: { symptom_ratings: [], reported_conditions: ["NONE"] }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { intake_id: $.data.id }
            - call: "POST /intake-assessments/${intake_id}/submit"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", intake_assessment_id: "${intake_id}", scheduled_start: "2026-05-13T09:00:00Z", scheduled_end: "2026-05-13T10:00:00Z" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /prescriptions"
              payload: { visit_id: "${visit_id}", hrt_type: "ESTROGEN_PATCH", days_supply_per_fill: 30, total_refills_authorized: 5, lab_required_before_refill: false, coverage_days: 90, refill_price_cents: 15000 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { rx_id: $.data.id, cp_id: $.data.care_plan_id }
            - call: "POST /prescriptions/${rx_id}/refills"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /prescriptions/${rx_id}/refills"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
              captures: { r2_id: $.data.id }
          trigger:
            - call: "POST /refills/${r1_id}/approve"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { s1: $.data.status }
            - call: "POST /refills/${r2_id}/deny"
              payload: { denial_reason: "duplicate request" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { s2: $.data.status, dr: $.data.denial_reason }
          assert:
            - "Refill.${r1_id}.status == APPROVED"
            - "Refill.${r2_id}.status == DENIED"
            - "Refill.${r2_id}.denial_reason == 'duplicate request'"
            - "GET /care-plans/${cp_id}/messages contains an item with message_type == DENIAL_NOTICE"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: lab_abnormal_suspends_denies_notifies
        grounds:
          - state_machines.LabOrder.PENDING_to_REVIEWED
          - state_machines.Prescription.ACTIVE_to_SUSPENDED
          - state_machines.Refill.REQUESTED_to_DENIED
          - entities.CarePlanMessage.fields.message_type
        distinguishing_aspect: "Depth-3 chain from a lab-review trigger: LabOrder REVIEWED(ABNORMAL) -> Prescription SUSPENDED -> REQUESTED Refill DENIED -> SYSTEM DENIAL_NOTICE CarePlanMessage; each hop caused by the previous, not by the resolve call directly."
        test_recipe:
          setup:
            - "ACTIVE prescription with a PENDING LabOrder and a REQUESTED refill."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Zoe Ren", email: "zoe@x.com", date_of_birth: "1966-06-06", state_code: "IL", billing_mode: "CASH", menopause_stage: "MENOPAUSE" }
              as: CareCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr Ba", specialty: "ENDOCRINOLOGY", npi: "6666666666", visit_fee_cents: 13000 }
              as: CareCoordinator
              captures: { prov_id: $.data.id }
            - call: "POST /patients/${pat_id}/intake-assessments"
              payload: { symptom_ratings: [], reported_conditions: ["NONE"] }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { intake_id: $.data.id }
            - call: "POST /intake-assessments/${intake_id}/submit"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", intake_assessment_id: "${intake_id}", scheduled_start: "2026-05-14T09:00:00Z", scheduled_end: "2026-05-14T10:00:00Z" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /prescriptions"
              payload: { visit_id: "${visit_id}", hrt_type: "COMBINED", days_supply_per_fill: 30, total_refills_authorized: 3, lab_required_before_refill: false, coverage_days: 90, refill_price_cents: 16000 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { rx_id: $.data.id, cp_id: $.data.care_plan_id }
            - call: "POST /prescriptions/${rx_id}/lab-orders"
              payload: { panel_type: "HORMONE" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { lab_id: $.data.id }
            - call: "POST /prescriptions/${rx_id}/refills"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /lab-orders/${lab_id}/resolve"
              payload: { result: "ABNORMAL" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { lab_status: $.data.status }
          assert:
            - "LabOrder.${lab_id}.status == REVIEWED"
            - "Prescription.${rx_id}.status == SUSPENDED"
            - "Refill.${r1_id}.status == DENIED"
            - "GET /care-plans/${cp_id}/messages contains an item with message_type == DENIAL_NOTICE"

      - name: refill_reverse_voids_charge_restores_deductible
        grounds:
