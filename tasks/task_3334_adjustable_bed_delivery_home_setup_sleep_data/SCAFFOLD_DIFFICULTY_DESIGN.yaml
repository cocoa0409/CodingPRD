            - call: "POST /sleep/delivery-windows"
              payload: { store_id: "${store_id}", team_id: "T1", window_start: "2026-09-02T08:00:00Z", window_end: "2026-09-02T12:00:00Z", capacity_slots: 4 }
              as: PlatformAdmin
              captures: { win1: $.data.id }
          trigger:
            - call: "POST /sleep/delivery-windows"
              payload: { store_id: "${store_id}", team_id: "T1", window_start: "2026-09-02T11:00:00Z", window_end: "2026-09-02T15:00:00Z", capacity_slots: 4 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /sleep/delivery-windows"
              payload: { store_id: "${store_id}", team_id: "T1", window_start: "2026-09-02T12:00:00Z", window_end: "2026-09-02T16:00:00Z", capacity_slots: 4 }
              as: PlatformAdmin
              captures: { win2: $.data.id }
            - call: "POST /sleep/delivery-windows"
              payload: { store_id: "${store_id}", team_id: "T2", window_start: "2026-09-02T08:00:00Z", window_end: "2026-09-02T12:00:00Z", capacity_slots: 4 }
              as: PlatformAdmin
              captures: { win3: $.data.id }
          assert:
            - "overlapping same-team window [11:00, 15:00): status 422 and error_id == ERR_WINDOW_TEAM_OVERLAP"
            - "adjacent same-team window [12:00, 16:00): 201 created (end-exclusive adjacency is NOT an overlap)"
            - "same-interval different-team window for T2 [08:00, 12:00): 201 created (timeline is per (store_id, team_id))"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: window_slots_schedule_then_cancel_conserves_capacity
        grounds:
          - calculations.window_slot_reservation
          - state_machines.DeliveryVisit.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity is SLOT COUNT: for any DeliveryWindow,
          reserved_slots == sum(slot_need over SCHEDULED visits), so a
          schedule (+3 for a removal visit) paired with its compensating
          cancel (-3) must return reserved_slots to exactly its pre-schedule
          value with zero drift. Distinct conserved quantity (slots) from the
          sibling's money invariant.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Confirmed order. Window W capacity 6, reserved 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sleep/stores"
              payload: { name: "S", zone_codes: ["941"] }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /sleep/product-models"
              payload: { sku: "MAT-1", name: "Mattress One", category: "MATTRESS", price_cents: 240000, replacement_part_price_cents: 0, warranty_months: 120 }
              as: PlatformAdmin
            - call: "POST /sleep/customers"
              payload: { home_store_id: "${store_id}", email: "a@x.com", full_name: "Ann A" }
              as: Anonymous
              captures: { cust_a: $.data.id }
            - call: "POST /sleep/fit-assessments"
              payload: { customer_id: "${cust_a}", store_id: "${store_id}", sleep_position: "BACK", weight_band: "BAND_130_230", partner_sleeper: false, preferred_feel: "MEDIUM" }
              as: SalesAssociate
              captures: { fa_a: $.data.id }
            - call: "POST /sleep/fit-assessments/${fa_a}/complete"
              payload: {}
              as: SalesAssociate
            - call: "POST /sleep/orders"
              payload: { customer_id: "${cust_a}", fit_assessment_id: "${fa_a}", line_items: [{ sku: "MAT-1", qty: 1 }] }
              as: Customer
              as_user_id: "${cust_a}"
              captures: { order_a: $.data.id }
            - call: "POST /sleep/orders/${order_a}/confirm"
              payload: { payment_method: "PAY_IN_FULL" }
              as: SalesAssociate
            - call: "POST /sleep/delivery-windows"
              payload: { store_id: "${store_id}", team_id: "T1", window_start: "2026-09-02T08:00:00Z", window_end: "2026-09-02T12:00:00Z", capacity_slots: 6 }
              as: PlatformAdmin
              captures: { win_id: $.data.id }
          trigger:
            - call: "POST /sleep/delivery-visits"
              payload: { order_id: "${order_a}", delivery_window_id: "${win_id}", remove_old_mattress: true }
              as: SalesAssociate
              captures: { visit_id: $.data.id }
            - call: "GET /sleep/delivery-windows/${win_id}"
              payload: {}
              as: PlatformAdmin
              captures: { reserved_mid: $.data.reserved_slots }
            - call: "POST /sleep/orders/${order_a}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_a}"
            - call: "GET /sleep/delivery-windows/${win_id}"
              payload: {}
              as: PlatformAdmin
              captures: { reserved_end: $.data.reserved_slots }
          assert:
            - "after scheduling a removal visit: reserved_slots == 3 (2 base + 1 removal)"
            - "after the compensating order cancel: reserved_slots == 0 exactly (schedule + cancel conserve capacity_slots - reserved_slots with no drift)"
            - "DeliveryVisit.${visit_id}.status == CANCELLED"

      - name: financing_payments_plus_refund_credit_conserve_principal
        grounds:
          - state_machines.FinancingPlan.ACTIVE_to_SETTLED_EARLY
          - state_machines.TrialReturn.INITIATED_to_REFUNDED
          - entities.FinancingPlan.fields.balance_cents
        distinguishing_aspect: |
          Conserved quantity is PRINCIPAL CENTS on a ZERO_APR plan:
          paid_cents + balance_cents + settled_credit_cents == principal_cents
          must hold after the forward action (two payments of 35834) AND after
          the compensating trial-refund credit memo (331500):
          71668 + 26832 + 331500 == 430000 exactly. Distinct conserved
          quantity (money) from the sibling's slot invariant.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Financed DELIVERED order, ZERO_APR plan principal 430000 (lines MAT 250000 + BASE 180000, no discount, fee 0), term 12, two payments recorded; trial return initiated at night 10."
