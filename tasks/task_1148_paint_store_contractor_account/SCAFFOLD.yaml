scenario: "1148. Paint Store & Contractor Account (Sherwin-Williams style): tint formula library & color match, contractor pricing tier & volume rebate, job-account tracking & delivery, custom-tint no-return policy & mistint inventory, VOC/regulation by jurisdiction, spec writing for architects & product pull-through, loyalty & rewards, product bulletin/discontinuation migration"
domain_name: paint-store-contractor-account
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: Pricing engine
  secondary_archetype: Compliance / audit
  complexity_layers:
    - Cascading side effects
    - Dual-variant calculation
    - Rate / threshold triggers
    - Version-pinning on approval
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

entities:
  - name: ContractorAccount
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Legal name of the contracting company" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", default: ACTIVE, constraints: "one of {ACTIVE, SUSPENDED}" }
      - { name: tier, type: enum, source: system, description: "Pricing tier assigned by tier_evaluation; drives tier discount and loyalty multiplier", default: STANDARD, constraints: "one of {STANDARD, SILVER, GOLD, PLATINUM}" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum allowed outstanding (unpaid) order total; >= 0" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum of total_cents over this account's orders with payment_status == UNPAID" }
      - { name: loyalty_points_balance, type: integer, source: computed, description: "Sum of points_delta over all LoyaltyTransaction rows for this account; may go negative after clawback" }
      - { name: ytd_net_volume_cents, type: integer, source: computed, description: "Merchandise basis: SUM(subtotal_cents) over orders with payment_status IN {PAID, PARTIALLY_REFUNDED, REFUNDED} and paid_at inside the current calendar year of the logical clock, MINUS SUM(refund_merchandise_cents) over those orders' ReturnRecord rows" }
      - { name: lifetime_rebate_paid_cents, type: integer, source: computed, description: "Sum of payable_cents over this account's RebateStatement rows with status == PAID" }

  - name: JobAccount
    parent: null
    common_fields: true
    fields:
      - { name: contractor_account_id, type: string, source: input, description: "FK -> ContractorAccount.id; owning contractor" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; jurisdiction of the delivery site; VOC rules are enforced against it" }
      - { name: job_name, type: string, source: input, description: "Human-readable job name" }
      - { name: site_address, type: string, source: input, description: "Delivery site address" }
      - { name: budget_cap_cents, type: integer, source: input, description: "Optional spend cap; null means uncapped", default: null, constraints: ">= 0 or null" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", default: OPEN, constraints: "one of {OPEN, ON_HOLD, COMPLETE}" }
      - { name: spent_cents, type: integer, source: computed, description: "Sum of (total_cents - refunded_cents) over orders of this job with payment_status IN {PAID, PARTIALLY_REFUNDED}" }

  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique jurisdiction code, e.g. CA-SCAQMD", constraints: "unique across Jurisdiction" }
      - { name: name, type: string, source: input, description: "Display name of the jurisdiction" }

  - name: VocRule
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; jurisdiction this rule governs" }
      - { name: category, type: enum, source: input, description: "Coating category the limit applies to", constraints: "one of {FLAT, NON_FLAT, INDUSTRIAL_MAINTENANCE}" }
      - { name: max_voc_gpl, type: integer, source: input, description: "Maximum permitted VOC in grams per liter (inclusive bound)", constraints: "> 0" }
      - { name: effective_from, type: datetime, source: input, description: "Window start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Window end (exclusive); null means open-ended", default: null }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Stock keeping unit", constraints: "unique across Product" }
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: category, type: enum, source: input, description: "Coating category used for VOC rule lookup", constraints: "one of {FLAT, NON_FLAT, INDUSTRIAL_MAINTENANCE}" }
      - { name: voc_gpl, type: integer, source: input, description: "Product VOC content in grams per liter", constraints: "> 0" }
      - { name: list_price_cents, type: integer, source: input, description: "List price per unit before tier/quantity discounts", constraints: ">= 0" }
      - { name: tintable, type: boolean, source: input, description: "Whether the product accepts custom tint formulas" }
      - { name: status, type: enum, source: system, description: "ACTIVE until discontinued by a bulletin taking effect", default: ACTIVE, constraints: "one of {ACTIVE, DISCONTINUED}" }
      - { name: replacement_product_id, type: string, source: system, description: "FK -> Product.id; replacement assigned when a discontinuation bulletin takes effect; null otherwise", default: null }

  - name: TintFormula
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; base product this formula tints" }
      - { name: color_code, type: string, source: input, description: "Color identifier, e.g. 'SW 7008'" }
      - { name: name, type: string, source: input, description: "Formula display name" }
      - { name: shots, type: array, source: input, description: "List of {colorant_code, ounces_128ths} colorant shots" }
      - { name: revision, type: integer, source: system, description: "Per-(product_id, color_code) sequence starting at 1; each new formula for the same pair increments it" }
      - { name: source, type: enum, source: system, description: "LIBRARY for direct creation; COLOR_MATCH when created by a color-match proposal", constraints: "one of {LIBRARY, COLOR_MATCH}" }
      - { name: status, type: enum, source: system, description: "ACTIVE until retired manually, superseded by a newer revision, or retired by product discontinuation", default: ACTIVE, constraints: "one of {ACTIVE, RETIRED}" }
      - { name: supersedes_formula_id, type: string, source: system, description: "FK -> TintFormula.id; the prior ACTIVE formula for the same (product_id, color_code) that this revision retired; null for revision 1", default: null }

  - name: ColorMatchRequest
    parent: null
    common_fields: true
    fields:
      - { name: contractor_account_id, type: string, source: input, description: "FK -> ContractorAccount.id; requesting contractor" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; base product the sample is matched into" }
      - { name: sample_reference, type: string, source: input, description: "Free-text reference for the physical sample" }
      - { name: status, type: enum, source: system, description: "Match workflow state", default: SUBMITTED, constraints: "one of {SUBMITTED, PROPOSED, REVISION_REQUESTED, APPROVED, ABANDONED}" }
      - { name: iteration_count, type: integer, source: system, description: "Number of proposals made; incremented by each proposals call; revision requests rejected when >= 3", default: 0 }
      - { name: formula_id, type: string, source: system, description: "FK -> TintFormula.id; formula produced by the latest proposal; null before first proposal", default: null }

  - name: ProductBulletin
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product being discontinued" }
      - { name: replacement_product_id, type: string, source: input, description: "FK -> Product.id; migration target; must be an ACTIVE product of the same category, different from product_id" }
      - { name: title, type: string, source: input, description: "Bulletin title" }
      - { name: effective_date, type: datetime, source: input, description: "Earliest logical-clock instant at which take-effect is allowed" }
      - { name: status, type: enum, source: system, description: "Bulletin lifecycle", default: DRAFT, constraints: "one of {DRAFT, PUBLISHED, EFFECTIVE}" }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock time of publish; null until published", default: null }
      - { name: effected_at, type: datetime, source: system, description: "Logical-clock time of take-effect; null until effective", default: null }

  - name: SpecSheet
    parent: null
    common_fields: true
    fields:
      - { name: project_code, type: string, source: input, description: "Project identifier; at most one APPROVED sheet per project_code at any time" }
      - { name: architect_name, type: string, source: input, description: "Architect the spec is written for (free text)" }
      - { name: title, type: string, source: input, description: "Spec title" }
      - { name: status, type: enum, source: system, description: "Spec workflow state", default: DRAFT, constraints: "one of {DRAFT, SUBMITTED, APPROVED, REJECTED, NEEDS_REVISION, SUPERSEDED}" }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded on reject; null otherwise", default: null }
      - { name: approved_at, type: datetime, source: system, description: "Logical-clock time of approval; null until approved", default: null }
      - { name: supersedes_spec_sheet_id, type: string, source: system, description: "FK -> SpecSheet.id; previously APPROVED sheet for the same project_code that this sheet superseded on approval; null if none", default: null }
      - { name: pull_through_ordered_pct, type: number, source: computed, description: "100 * SUM(min(ordered_qty, specified_qty)) / SUM(specified_qty) over current lines; ordered-basis pull-through variant; 2 decimals round_half_up; 0 when sheet has no lines" }
      - { name: pull_through_delivered_pct, type: number, source: computed, description: "Same shape but over delivered_qty; delivered-basis pull-through variant; 2 decimals round_half_up; 0 when sheet has no lines" }

  - name: SpecLine
    parent: null
    common_fields: true
    fields:
      - { name: spec_sheet_id, type: string, source: system, description: "FK -> SpecSheet.id; owning sheet (assigned at sheet creation/revision)" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; specified product" }
      - { name: specified_qty, type: integer, source: input, description: "Specified quantity", constraints: "> 0" }
      - { name: obsoleted, type: boolean, source: system, description: "Set true when the line's product is discontinued while the sheet is APPROVED or SUBMITTED; drives the sheet to NEEDS_REVISION when APPROVED", default: false }
      - { name: ordered_qty, type: integer, source: computed, description: "Sum of (quantity - returned_quantity) over OrderLine rows with spec_line_id == this id whose order has payment_status IN {PAID, PARTIALLY_REFUNDED}" }
      - { name: delivered_qty, type: integer, source: computed, description: "Sum of (quantity - returned_quantity) over OrderLine rows with spec_line_id == this id whose order has fulfillment_status == DELIVERED" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: contractor_account_id, type: string, source: input, description: "FK -> ContractorAccount.id; purchasing contractor" }
      - { name: job_account_id, type: string, source: input, description: "FK -> JobAccount.id; job the material is for; the job's contractor must equal contractor_account_id" }
      - { name: payment_status, type: enum, source: system, description: "Payment dimension (parallel with fulfillment)", default: UNPAID, constraints: "one of {UNPAID, PAID, PARTIALLY_REFUNDED, REFUNDED}" }
      - { name: fulfillment_status, type: enum, source: system, description: "Fulfillment dimension (parallel with payment)", default: PENDING, constraints: "one of {PENDING, OUT_FOR_DELIVERY, DELIVERED, CANCELLED}" }
      - { name: tier_snapshot, type: enum, source: system, description: "Account tier frozen at order creation; prices and loyalty multiplier key off this snapshot", constraints: "one of {STANDARD, SILVER, GOLD, PLATINUM}" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line_total_cents over all lines" }
      - { name: discount_cents, type: integer, source: computed, description: "Sum of (unit_list_price_cents * quantity) - subtotal_cents over all lines" }
      - { name: tax_cents, type: integer, source: computed, description: "round_half_up(subtotal_cents * TAX_RATE_BPS / 10000)" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + tax_cents" }
      - { name: refunded_cents, type: integer, source: computed, description: "Sum of total_credit_cents over ReturnRecord rows of this order's lines", default: 0 }
      - { name: paid_at, type: datetime, source: system, description: "Logical-clock time of payment; null while UNPAID", default: null }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; owning order" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: formula_id, type: string, source: input, description: "FK -> TintFormula.id; present for custom-tint lines; null for stock lines", default: null }
      - { name: spec_line_id, type: string, source: input, description: "FK -> SpecLine.id; attributes the purchase to an APPROVED spec line for pull-through; null when not spec-driven", default: null }
      - { name: quantity, type: integer, source: input, description: "Units ordered", constraints: "> 0" }
      - { name: returned_quantity, type: integer, source: system, description: "Cumulative units returned", default: 0 }
      - { name: unit_list_price_cents, type: integer, source: system, description: "Product.list_price_cents snapshot at order creation" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Per-unit price after tier and quantity-break discounts per line_pricing" }
      - { name: line_total_cents, type: integer, source: computed, description: "unit_price_cents * quantity (per-unit rounding pinned by line_pricing)" }
      - { name: is_custom_tint, type: boolean, source: computed, description: "formula_id is not null; custom-tint lines are never returnable" }

  - name: ReturnRecord
    parent: null
    common_fields: false
    fields:
      - { name: order_line_id, type: string, source: system, description: "FK -> OrderLine.id; line the return was taken against" }
      - { name: quantity, type: integer, source: system, description: "Units returned in this event" }
      - { name: refund_merchandise_cents, type: integer, source: system, description: "unit_price_cents * quantity for this event" }
      - { name: tax_refund_cents, type: integer, source: system, description: "round_half_up(refund_merchandise_cents * TAX_RATE_BPS / 10000)" }
      - { name: total_credit_cents, type: integer, source: system, description: "refund_merchandise_cents + tax_refund_cents" }

  - name: Delivery
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; order being delivered" }
      - { name: job_account_id, type: string, source: input, description: "FK -> JobAccount.id; delivery site; must equal the order's job_account_id" }
      - { name: window_start, type: datetime, source: input, description: "Delivery window start (inclusive); must not be in the past at scheduling time" }
      - { name: window_end, type: datetime, source: input, description: "Delivery window end (exclusive); must be after window_start" }
      - { name: status, type: enum, source: system, description: "Delivery lifecycle", default: SCHEDULED, constraints: "one of {SCHEDULED, EN_ROUTE, DELIVERED, FAILED}" }
      - { name: failure_reason, type: string, source: system, description: "Reason recorded by mark-failed; null otherwise", default: null }
      - { name: dispatched_at, type: datetime, source: system, description: "Logical-clock time of dispatch; null until dispatched", default: null }
      - { name: delivered_at, type: datetime, source: system, description: "Logical-clock time of delivery; null until delivered", default: null }

  - name: RebateStatement
    parent: null
    common_fields: true
    fields:
      - { name: contractor_account_id, type: string, source: input, description: "FK -> ContractorAccount.id; account the statement settles" }
      - { name: period_start, type: datetime, source: input, description: "Settlement period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Settlement period end (exclusive); must be after period_start" }
      - { name: status, type: enum, source: system, description: "Statement lifecycle", default: ACCRUED, constraints: "one of {ACCRUED, FINALIZED, DISPUTED, PAID}" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "Forward-looking rebate estimate computed at generation per rebate_provisional" }
      - { name: final_amount_cents, type: integer, source: computed, description: "Chronological rebate computed at finalize per rebate_final; null until FINALIZED", default: null }
      - { name: adjustment_cents, type: integer, source: system, description: "Signed adjustment set by resolve-dispute; 0 otherwise", default: 0 }
      - { name: payable_cents, type: integer, source: computed, description: "max(0, min(final_amount_cents + adjustment_cents, round_half_up(0.05 * period_net_cents))); null until FINALIZED", default: null }
      - { name: period_net_cents, type: integer, source: computed, description: "Merchandise basis: SUM(subtotal_cents) over orders of the account with payment_status IN {PAID, PARTIALLY_REFUNDED, REFUNDED} and paid_at in [period_start, period_end), MINUS SUM(refund_merchandise_cents) over those orders' ReturnRecord rows" }
      - { name: paid_at, type: datetime, source: system, description: "Logical-clock time of payout; null until PAID", default: null }

  - name: LoyaltyTransaction
    parent: null
    common_fields: false
    fields:
      - { name: contractor_account_id, type: string, source: system, description: "FK -> ContractorAccount.id; account the entry posts to" }
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; originating order for EARN/CLAWBACK; null for REDEEM", default: null }
      - { name: type, type: enum, source: system, description: "Entry kind", constraints: "one of {EARN, REDEEM, CLAWBACK}" }
      - { name: points_delta, type: integer, source: system, description: "Signed points posted; EARN positive, REDEEM/CLAWBACK negative" }
      - { name: note, type: string, source: system, description: "Human-readable posting note; REDEEM notes carry credit_cents equal to points redeemed" }

  - name: MistintListing
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; mistinted product" }
      - { name: formula_id, type: string, source: input, description: "FK -> TintFormula.id; the mistaken formula applied; null when unknown", default: null }
      - { name: quantity, type: integer, source: input, description: "Units in the listing", constraints: "> 0" }
      - { name: cost_basis_cents, type: integer, source: input, description: "Per-unit cost basis", constraints: ">= 0" }
      - { name: list_price_cents, type: integer, source: system, description: "floor(cost_basis_cents * 0.50) at creation" }
      - { name: current_price_cents, type: integer, source: computed, description: "Per-unit price per mistint_price decay; recomputed on read and at sale using the logical clock" }
      - { name: status, type: enum, source: system, description: "Listing lifecycle", default: LISTED, constraints: "one of {LISTED, SOLD, WRITTEN_OFF}" }
      - { name: sold_price_cents, type: integer, source: system, description: "current_price_cents captured at mark-sold; null until SOLD", default: null }
      - { name: sold_to_contractor_account_id, type: string, source: input, description: "FK -> ContractorAccount.id; buyer recorded at mark-sold; null when sold anonymously", default: null }

state_machines:
  - entity: ContractorAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /contractor-accounts/{id}/suspend"
        actor: CorporateAdmin
        preconditions: ["status == ACTIVE"]
        side_effects: ["increments ContractorAccount.version by 1", "refreshes updated_at"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /contractor-accounts/{id}/reinstate"
        actor: CorporateAdmin
        preconditions: ["status == SUSPENDED"]
        side_effects: ["increments ContractorAccount.version by 1", "refreshes updated_at"]

  - entity: JobAccount
    initial_state: OPEN
    terminal_states: [COMPLETE]
    transitions:
      - from: OPEN
        to: ON_HOLD
        trigger: "POST /job-accounts/{id}/place-on-hold"
        actor: "Contractor (owner) or StoreManager"
        preconditions: ["status == OPEN"]
        side_effects: ["increments JobAccount.version by 1"]
      - from: ON_HOLD
        to: OPEN
        trigger: "POST /job-accounts/{id}/resume"
        actor: "Contractor (owner) or StoreManager"
        preconditions: ["status == ON_HOLD"]
        side_effects: ["increments JobAccount.version by 1"]
      - from: OPEN
        to: COMPLETE
        trigger: "POST /job-accounts/{id}/complete"
        actor: "Contractor (owner) or StoreManager"
        preconditions:
          - "status == OPEN"
          - "no order of this job has fulfillment_status IN {PENDING, OUT_FOR_DELIVERY}"
          - "no delivery of this job has status IN {SCHEDULED, EN_ROUTE}"
        side_effects: ["increments JobAccount.version by 1"]
      - from: ON_HOLD
        to: COMPLETE
        trigger: "POST /job-accounts/{id}/complete"
        actor: "Contractor (owner) or StoreManager"
        preconditions:
          - "status == ON_HOLD"
          - "no order of this job has fulfillment_status IN {PENDING, OUT_FOR_DELIVERY}"
          - "no delivery of this job has status IN {SCHEDULED, EN_ROUTE}"
        side_effects: ["increments JobAccount.version by 1"]

  - entity: Product
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /product-bulletins/{id}/take-effect (cascade from the bulletin naming this product)"
        actor: system
        preconditions: ["a ProductBulletin with product_id == this product reaches EFFECTIVE"]
        side_effects:
          - "sets Product.replacement_product_id := bulletin.replacement_product_id"
          - "HOP 1 of bulletin cascade: this status mutation itself triggers retirement of every TintFormula with product_id == this id and status == ACTIVE (sets them RETIRED) — see TintFormula machine"
          - "HOP 1 of bulletin cascade: this status mutation itself flags every SpecLine with product_id == this id on sheets with status IN {SUBMITTED, APPROVED} (sets obsoleted := true) — see SpecLine/SpecSheet machines"
          - "increments Product.version by 1"

  - entity: TintFormula
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /tint-formulas/{id}/retire"
        actor: CorporateAdmin
        preconditions: ["status == ACTIVE"]
        side_effects: ["increments TintFormula.version by 1"]
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /tint-formulas (a new formula for the same (product_id, color_code) supersedes this one)"
        actor: system
        preconditions: ["status == ACTIVE", "a new formula is created for the same (product_id, color_code)"]
        side_effects: ["new formula's supersedes_formula_id := this id", "increments TintFormula.version by 1"]
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /product-bulletins/{id}/take-effect (HOP 2: product discontinuation cascades here)"
        actor: system
        preconditions: ["status == ACTIVE", "product_id's Product transitioned ACTIVE -> DISCONTINUED"]
        side_effects: ["increments TintFormula.version by 1"]
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /color-match-requests/{id}/request-revision or POST /color-match-requests/{id}/abandon (rejected/abandoned proposal formula is withdrawn)"
        actor: system
        preconditions: ["status == ACTIVE", "this formula is the formula_id of the affected ColorMatchRequest"]
        side_effects: ["increments TintFormula.version by 1"]

  - entity: ColorMatchRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, ABANDONED]
    transitions:
      - from: SUBMITTED
        to: PROPOSED
        trigger: "POST /color-match-requests/{id}/proposals"
        actor: StoreAssociate
        preconditions: ["status == SUBMITTED"]
        side_effects:
          - "creates a TintFormula (product_id := request.product_id, source := COLOR_MATCH, status := ACTIVE, revision per supersede rule; any prior ACTIVE formula for (product_id, color_code) is RETIRED with supersedes link)"
          - "sets ColorMatchRequest.formula_id := new formula id"
          - "iteration_count += 1"
          - "increments ColorMatchRequest.version by 1"
      - from: REVISION_REQUESTED
        to: PROPOSED
        trigger: "POST /color-match-requests/{id}/proposals"
        actor: StoreAssociate
        preconditions: ["status == REVISION_REQUESTED"]
        side_effects:
          - "creates a TintFormula (same rules as the SUBMITTED -> PROPOSED proposal)"
          - "sets ColorMatchRequest.formula_id := new formula id"
          - "iteration_count += 1"
          - "increments ColorMatchRequest.version by 1"
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /color-match-requests/{id}/approve"
        actor: "Contractor (owner)"
        preconditions: ["status == PROPOSED"]
        side_effects: ["proposed formula remains ACTIVE and orderable", "increments ColorMatchRequest.version by 1"]
      - from: PROPOSED
        to: REVISION_REQUESTED
        trigger: "POST /color-match-requests/{id}/request-revision"
        actor: "Contractor (owner)"
        preconditions: ["status == PROPOSED", "iteration_count < 3 (MATCH_MAX_ITERATIONS)"]
        side_effects:
          - "the formula referenced by formula_id is RETIRED (withdrawn proposal)"
          - "increments ColorMatchRequest.version by 1"
      - from: SUBMITTED
        to: ABANDONED
        trigger: "POST /color-match-requests/{id}/abandon"
        actor: "StoreAssociate or Contractor (owner)"
        preconditions: ["status == SUBMITTED"]
        side_effects: ["increments ColorMatchRequest.version by 1"]
      - from: PROPOSED
        to: ABANDONED
        trigger: "POST /color-match-requests/{id}/abandon"
        actor: "StoreAssociate or Contractor (owner)"
        preconditions: ["status == PROPOSED"]
        side_effects: ["the formula referenced by formula_id is RETIRED", "increments ColorMatchRequest.version by 1"]
      - from: REVISION_REQUESTED
        to: ABANDONED
        trigger: "POST /color-match-requests/{id}/abandon"
        actor: "StoreAssociate or Contractor (owner)"
        preconditions: ["status == REVISION_REQUESTED"]
        side_effects: ["increments ColorMatchRequest.version by 1"]

  - entity: ProductBulletin
    initial_state: DRAFT
    terminal_states: [EFFECTIVE]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /product-bulletins/{id}/publish"
        actor: CorporateAdmin
        preconditions:
          - "status == DRAFT"
          - "replacement_product_id is not null, != product_id, references an existing Product with status == ACTIVE and the same category as the subject product"
        side_effects: ["sets published_at := logical clock now", "increments ProductBulletin.version by 1"]
      - from: PUBLISHED
        to: EFFECTIVE
        trigger: "POST /product-bulletins/{id}/take-effect"
        actor: CorporateAdmin
        preconditions: ["status == PUBLISHED", "logical clock now >= effective_date"]
        side_effects:
          - "HOP 1: subject Product transitions ACTIVE -> DISCONTINUED; Product.replacement_product_id := replacement_product_id (see Product machine)"
          - "HOP 2 (caused by HOP 1 product mutation): every TintFormula of the subject product with status == ACTIVE becomes RETIRED"
          - "HOP 2 (caused by HOP 1 product mutation): every SpecLine with product_id == subject on a SpecSheet with status IN {SUBMITTED, APPROVED} gets obsoleted := true"
          - "HOP 3 (caused by HOP 2 SpecLine mutation): every SpecSheet with status == APPROVED holding at least one newly-obsoleted SpecLine transitions APPROVED -> NEEDS_REVISION (see SpecSheet machine)"
          - "sets effected_at := logical clock now"
          - "increments ProductBulletin.version by 1"
        note: "Orders and deliveries already created are grandfathered; discontinuation blocks only NEW order lines / spec approvals referencing the product."

  - entity: SpecSheet
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /spec-sheets/{id}/submit"
        actor: SpecWriter
        preconditions: ["status == DRAFT", "sheet has at least 1 SpecLine"]
        side_effects: ["increments SpecSheet.version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /spec-sheets/{id}/approve"
        actor: CorporateAdmin
        preconditions:
          - "status == SUBMITTED"
          - "every SpecLine's product has status == ACTIVE (version-pinning gate: approval pins the live product references; a discontinued product blocks approval)"
        side_effects:
          - "sets approved_at := logical clock now"
          - "supersede: any OTHER SpecSheet with the same project_code and status == APPROVED transitions APPROVED -> SUPERSEDED; this sheet's supersedes_spec_sheet_id := that sheet's id (at most one can exist)"
          - "increments SpecSheet.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /spec-sheets/{id}/reject"
        actor: CorporateAdmin
        preconditions: ["status == SUBMITTED"]
        side_effects: ["sets rejection_reason from payload", "increments SpecSheet.version by 1"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /spec-sheets/{id}/revise"
        actor: SpecWriter
        preconditions: ["status == REJECTED"]
        side_effects: ["replaces the sheet's SpecLine set atomically with the payload lines (old lines deleted, new lines created with obsoleted := false)", "clears rejection_reason", "increments SpecSheet.version by 1"]
      - from: APPROVED
        to: NEEDS_REVISION
        trigger: "POST /product-bulletins/{id}/take-effect (HOP 3: a SpecLine of this sheet was obsoleted by the product discontinuation)"
        actor: system
        preconditions: ["status == APPROVED", "at least one SpecLine of this sheet was just set obsoleted := true"]
        side_effects: ["increments SpecSheet.version by 1"]
      - from: NEEDS_REVISION
        to: DRAFT
        trigger: "POST /spec-sheets/{id}/revise"
        actor: SpecWriter
        preconditions: ["status == NEEDS_REVISION"]
        side_effects: ["replaces the sheet's SpecLine set atomically with the payload lines (migration path: author substitutes the replacement product)", "increments SpecSheet.version by 1"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /spec-sheets/{other-id}/approve (another sheet for the same project_code is approved)"
        actor: system
        preconditions: ["status == APPROVED"]
        side_effects: ["increments SpecSheet.version by 1"]

  - entity: Order
    initial_state: "UNPAID x PENDING"
    terminal_states: ["REFUNDED (payment dimension)", "DELIVERED or CANCELLED (fulfillment dimension)"]
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /orders/{id}/pay"
        actor: "StoreAssociate or Contractor (owner)"
        preconditions: ["payment_status == UNPAID", "contractor account status == ACTIVE"]
        side_effects:
          - "sets paid_at := logical clock now"
          - "creates LoyaltyTransaction(type := EARN, points_delta := +floor(subtotal_cents / 100) * TIER_POINT_MULT[tier_snapshot]); ContractorAccount.loyalty_points_balance recomputed (ledger sync)"
          - "ContractorAccount.outstanding_balance_cents recomputed (this order leaves the UNPAID set)"
          - "JobAccount.spent_cents recomputed (ledger sync)"
          - "increments Order.version by 1 and ContractorAccount.version by 1"
      - from: PAID
        to: PARTIALLY_REFUNDED
        trigger: "POST /order-lines/{id}/return (cumulative refunded_cents < total_cents)"
        actor: StoreAssociate
        preconditions: ["payment_status == PAID"]
        side_effects:
          - "HOP 1 of return cascade: creates ReturnRecord; OrderLine.returned_quantity += return qty"
          - "HOP 2 (caused by the refund event): Order.refunded_cents recomputed; this payment_status transition fires because refunded_cents < total_cents"
          - "HOP 3a (caused by HOP 2 refund): creates LoyaltyTransaction(type := CLAWBACK, points_delta := -floor(refund_merchandise_cents / 100) * TIER_POINT_MULT[order.tier_snapshot]); ContractorAccount.loyalty_points_balance recomputed"
          - "HOP 3b (caused by HOP 2 refund): JobAccount.spent_cents recomputed; ContractorAccount.ytd_net_volume_cents recomputed"
          - "increments Order.version by 1, OrderLine.version by 1, ContractorAccount.version by 1, JobAccount.version by 1"
      - from: PAID
        to: REFUNDED
        trigger: "POST /order-lines/{id}/return (cumulative refunded_cents == total_cents)"
        actor: StoreAssociate
        preconditions: ["payment_status == PAID"]
        side_effects: ["same cascade as PAID -> PARTIALLY_REFUNDED, with the terminal REFUNDED status because refunded_cents reaches total_cents"]
      - from: PARTIALLY_REFUNDED
        to: REFUNDED
        trigger: "POST /order-lines/{id}/return (cumulative refunded_cents reaches total_cents)"
        actor: StoreAssociate
        preconditions: ["payment_status == PARTIALLY_REFUNDED"]
        side_effects: ["same cascade as PAID -> PARTIALLY_REFUNDED"]
      - from: PENDING
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: "StoreAssociate or Contractor (owner)"
        preconditions: ["fulfillment_status == PENDING", "payment_status == UNPAID (a paid order has financial effects and must be returned line-by-line instead)"]
        side_effects: ["ContractorAccount.outstanding_balance_cents recomputed (order leaves UNPAID set)", "increments Order.version by 1 and ContractorAccount.version by 1"]
      - from: PENDING
        to: OUT_FOR_DELIVERY
        trigger: "POST /deliveries/{id}/dispatch (first dispatch of any delivery of this order)"
        actor: system
        preconditions: ["fulfillment_status == PENDING"]
        side_effects: ["increments Order.version by 1"]
      - from: OUT_FOR_DELIVERY
        to: DELIVERED
        trigger: "POST /deliveries/{id}/mark-delivered (when, after this delivery reaches DELIVERED, no other delivery of the order remains in {SCHEDULED, EN_ROUTE})"
        actor: system
        preconditions: ["fulfillment_status == OUT_FOR_DELIVERY"]
        side_effects: ["SpecLine.delivered_qty recomputed for any referenced spec lines (bubble up)", "SpecSheet pull-through percentages recomputed", "increments Order.version by 1"]

  - entity: Delivery
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, FAILED]
    transitions:
      - from: SCHEDULED
        to: EN_ROUTE
        trigger: "POST /deliveries/{id}/dispatch"
        actor: StoreManager
        preconditions:
          - "status == SCHEDULED"
          - "order.payment_status == PAID"
          - "job account status == OPEN"
          - "VOC re-check at dispatch instant: for every line of the order, product.voc_gpl <= max_voc_gpl of the VocRule effective at the logical clock now for (job.jurisdiction_id, product.category); (jurisdiction, category) pairs with no effective rule are unrestricted"
        side_effects: ["sets dispatched_at := logical clock now", "order.fulfillment_status PENDING -> OUT_FOR_DELIVERY (cross-entity)", "increments Delivery.version by 1"]
      - from: EN_ROUTE
        to: DELIVERED
        trigger: "POST /deliveries/{id}/mark-delivered"
        actor: StoreManager
        preconditions: ["status == EN_ROUTE"]
        side_effects: ["sets delivered_at := logical clock now", "order fulfillment bubble-up per Order machine (OUT_FOR_DELIVERY -> DELIVERED when no open deliveries remain)", "increments Delivery.version by 1"]
      - from: EN_ROUTE
        to: FAILED
        trigger: "POST /deliveries/{id}/mark-failed"
        actor: StoreManager
        preconditions: ["status == EN_ROUTE"]
        side_effects: ["sets failure_reason from payload", "order.fulfillment_status is unchanged (ops re-attempt by creating a NEW Delivery for the order)", "increments Delivery.version by 1"]
        note: "FAILED is terminal; re-delivery is modeled as a fresh Delivery row on the same order."

  - entity: RebateStatement
    initial_state: ACCRUED
    terminal_states: [PAID]
    transitions:
      - from: ACCRUED
        to: FINALIZED
        trigger: "POST /rebate-statements/{id}/finalize"
        actor: CorporateAdmin
        preconditions: ["status == ACCRUED", "logical clock now >= period_end (period closed)"]
        side_effects: ["computes final_amount_cents per rebate_final (chronological variant)", "computes period_net_cents", "computes payable_cents := max(0, min(final_amount_cents + adjustment_cents, round_half_up(0.05 * period_net_cents)))", "increments RebateStatement.version by 1"]
      - from: FINALIZED
        to: DISPUTED
        trigger: "POST /rebate-statements/{id}/dispute"
        actor: "Contractor (owner)"
        preconditions: ["status == FINALIZED"]
        side_effects: ["increments RebateStatement.version by 1"]
      - from: DISPUTED
        to: FINALIZED
        trigger: "POST /rebate-statements/{id}/resolve-dispute"
        actor: CorporateAdmin
        preconditions: ["status == DISPUTED"]
        side_effects: ["sets adjustment_cents from payload (signed)", "recomputes payable_cents with the new adjustment", "increments RebateStatement.version by 1"]
        note: "FINALIZED -> DISPUTED -> FINALIZED is a deliberate negotiation cycle; each pass bumps version."
      - from: FINALIZED
        to: PAID
        trigger: "POST /rebate-statements/{id}/pay"
        actor: CorporateAdmin
        preconditions: ["status == FINALIZED"]
        side_effects: ["sets paid_at := logical clock now", "ContractorAccount.lifetime_rebate_paid_cents recomputed (ledger sync)", "increments RebateStatement.version by 1 and ContractorAccount.version by 1"]

  - entity: MistintListing
    initial_state: LISTED
    terminal_states: [SOLD, WRITTEN_OFF]
    transitions:
      - from: LISTED
        to: SOLD
        trigger: "POST /mistint-listings/{id}/mark-sold"
        actor: StoreAssociate
        preconditions: ["status == LISTED"]
        side_effects: ["computes current_price_cents per mistint_price at the logical clock now and stores it in sold_price_cents", "records sold_to_contractor_account_id from payload (nullable)", "increments MistintListing.version by 1"]
      - from: LISTED
        to: WRITTEN_OFF
        trigger: "POST /mistint-listings/{id}/write-off"
        actor: StoreManager
        preconditions: ["status == LISTED"]
        side_effects: ["increments MistintListing.version by 1"]

concurrency_rules:
  - rule_id: account-patch-stale-version
    parent_entity: ContractorAccount
    write_endpoint: "PATCH /contractor-accounts/{id}"
    occ_field: "expected_contractor_account_version"
    description: |
      Patching a ContractorAccount with an expected_contractor_account_version
      that does not match the account's current version is rejected: the
      caller's view of the account is stale (another write — e.g. an order
      creation, payment, or tier evaluation — has mutated the account since).
      Without this OCC check the second write would silently overwrite the
      first writer's changes, which no state precondition otherwise prevents.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: order-create-stale-account
    parent_entity: ContractorAccount
    write_endpoint: "POST /orders"
    occ_field: "expected_contractor_account_version"
    description: |
      Creating an Order carries expected_contractor_account_version because
      order creation prices against the account's current tier snapshot and
      mutates outstanding_balance_cents; when the presented version does not
      match the account's current version, the pricing/balance basis is stale
      and the create is rejected. Domain state alone would let both creates
      through (the account stays ACTIVE), so this is resolved purely by OCC.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: line_pricing
    trigger: "POST /orders — computed per line at order creation"
    algorithm: tiered_pricing
    formula: |
      tier_pct = TIER_DISCOUNT[account.tier at creation, frozen into Order.tier_snapshot]
      qty_pct  = QTY_BREAK_PCT if line.quantity >= QTY_BREAK_MIN else 0
      unit_price_cents  = round_half_up(unit_list_price_cents * (1 - tier_pct) * (1 - qty_pct))
      line_total_cents  = unit_price_cents * quantity
      PINNED ROUNDING ORDER: round the per-unit price FIRST, then multiply by quantity.
      "round(extended_list * discounts)" (extend-then-round) is a DIFFERENT, rejected order.
    input_set: "the lines array of the POST /orders request; unit_list_price_cents snapshotted from Product.list_price_cents at creation"
    constants:
      TIER_DISCOUNT: { STANDARD: 0.00, SILVER: 0.05, GOLD: 0.10, PLATINUM: 0.15 }
      QTY_BREAK_MIN: 10
      QTY_BREAK_PCT: 0.03
    precision: "integer cents; round_half_up applied once per unit price"

  - name: order_totals
    trigger: "POST /orders; recomputed by derivation whenever lines exist (returns do not change line totals)"
    algorithm: aggregation
    formula: |
      subtotal_cents  = SUM(line_total_cents) over all lines of the order
      discount_cents  = SUM(unit_list_price_cents * quantity) - subtotal_cents
      tax_cents       = round_half_up(subtotal_cents * TAX_RATE_BPS / 10000)
      total_cents     = subtotal_cents + tax_cents
      EVALUATION ORDER (pinned): lines -> subtotal -> tax -> total. Tax is computed
      on the discounted subtotal exactly once at order level (never per line).
    input_set: "all OrderLine rows of the order regardless of returned_quantity"
    constants:
      TAX_RATE_BPS: 825
    precision: "integer cents; round_half_up"

  - name: tier_evaluation
    trigger: "POST /contractor-accounts/{id}/evaluate-tier"
    algorithm: threshold
    formula: |
      V = account.ytd_net_volume_cents recomputed at evaluation time (merchandise basis):
          SUM(subtotal_cents) over orders with
          payment_status IN {PAID, PARTIALLY_REFUNDED, REFUNDED} and
          paid_at within [Jan 1 00:00:00Z of the logical clock's year, now],
          MINUS SUM(refund_merchandise_cents) over those orders' ReturnRecord rows
      tier = PLATINUM if V >= PLATINUM_MIN_CENTS
             else GOLD if V >= GOLD_MIN_CENTS
             else SILVER if V >= SILVER_MIN_CENTS
             else STANDARD
      BOUNDARY: comparisons are inclusive (>=); V exactly equal to a threshold earns that tier.
    input_set: "orders of the account in the paid-set above; UNPAID and CANCELLED orders excluded"
    constants:
      SILVER_MIN_CENTS: 5000000
      GOLD_MIN_CENTS: 15000000
      PLATINUM_MIN_CENTS: 40000000
    precision: "integer cents; exact comparison, no rounding"

  - name: rebate_provisional
    trigger: "POST /rebate-statements — computed once at generation and stored in provisional_amount_cents"
    algorithm: forward_looking
    formula: |
      days_total   = whole days in [period_start, period_end)
      days_elapsed = whole days in [period_start, min(now, period_end)); if now >= period_end then days_elapsed == days_total
      net_so_far   = SUM(subtotal_cents) over orders of the account with
                     payment_status IN {PAID, PARTIALLY_REFUNDED, REFUNDED} and
                     paid_at in [period_start, min(now, period_end)),
                     MINUS SUM(refund_merchandise_cents) over those orders' ReturnRecord rows
      projected    = floor(net_so_far * days_total / days_elapsed)
      banded(V)    = 0.02 * min(V, BAND1_LIMIT_CENTS)
                   + 0.04 * max(0, min(V, BAND2_LIMIT_CENTS) - BAND1_LIMIT_CENTS)
                   + 0.06 * max(0, V - BAND2_LIMIT_CENTS)
      provisional_amount_cents = floor(banded(projected) * days_elapsed / days_total)
    input_set: "paid-set orders of the account inside the elapsed portion of the period; UNPAID orders excluded"
    constants:
      BAND1_LIMIT_CENTS: 10000000
      BAND1_RATE: 0.02
      BAND2_LIMIT_CENTS: 30000000
      BAND2_RATE: 0.04
      BAND3_RATE: 0.06
    precision: "integer cents; floor at the two pinned steps (projected, then provisional)"
    variants:
      - name: provisional
        when: "statement generation (any clock position >= period_start)"
        difference: "forward-looking: annualizes the elapsed net volume over the full period, bands the projection, then prorates back to elapsed days"

  - name: rebate_final
    trigger: "POST /rebate-statements/{id}/finalize — computed once and stored in final_amount_cents"
    algorithm: chronological
    formula: |
      events = payment events (+subtotal_cents at paid_at) for orders of the account with
               paid_at in [period_start, period_end), PLUS refund events
               (-refund_merchandise_cents at ReturnRecord.created_at) for return records
               of the account's order lines with created_at in [period_start, period_end)
      ORDER (pinned): sort by event timestamp ASC; ties broken with payments before refunds;
      remaining ties broken by the underlying row created_at ASC. (id is NEVER used.)
      V = 0; R = 0  (exact decimal cents)
      payment +a (fills bands bottom-up, straddling within the event):
        while a > 0:
          if   V >= BAND2_LIMIT_CENTS: r = 0.06; headroom = a (unbounded)
          elif V >= BAND1_LIMIT_CENTS: r = 0.04; headroom = BAND2_LIMIT_CENTS - V
          else:                        r = 0.02; headroom = BAND1_LIMIT_CENTS - V
          chunk = min(a, headroom); R += chunk * r; V += chunk; a -= chunk
      refund -f (peels bands top-down, unwinding the highest-rate band first):
        while f > 0:
          if   V > BAND2_LIMIT_CENTS: r = 0.06; band_floor = BAND2_LIMIT_CENTS
          elif V > BAND1_LIMIT_CENTS: r = 0.04; band_floor = BAND1_LIMIT_CENTS
          else:                       r = 0.02; band_floor = 0
          chunk = min(f, V - band_floor); R -= chunk * r; V -= chunk; f -= chunk
      final_amount_cents = round_half_up(R)
      NOTE: marginal straddle is symmetric — a payment followed by a full in-period
      refund restores R and V exactly; divergence from the provisional variant comes
      from the forward-looking projection/proration, not from the final sweep.
    input_set: "payment events from the account's paid-set orders and refund events from ReturnRecord rows, both restricted to the period window"
    constants:
      BAND1_LIMIT_CENTS: 10000000
      BAND1_RATE: 0.02
      BAND2_LIMIT_CENTS: 30000000
      BAND2_RATE: 0.04
      BAND3_RATE: 0.06
    precision: "R accumulated in exact decimal cents; single round_half_up at the end"
    variants:
      - name: final
        when: "finalize (clock >= period_end)"
        difference: "chronological: running-accumulator marginal allocation over ordered payment/refund events; produces a different number than the forward-looking provisional variant for identical order data whenever volume crosses a band boundary mid-period"

  - name: rebate_payable
    trigger: "POST /rebate-statements/{id}/finalize and POST /rebate-statements/{id}/resolve-dispute"
    algorithm: waterfall_allocation
    formula: |
      period_net_cents = SUM(subtotal_cents) over orders of the account with
                         payment_status IN {PAID, PARTIALLY_REFUNDED, REFUNDED} and
                         paid_at in [period_start, period_end),
                         MINUS SUM(refund_merchandise_cents) over those orders' ReturnRecord rows
      cap_cents    = round_half_up(REBATE_CAP_PCT * period_net_cents)
      payable_cents = max(0, min(final_amount_cents + adjustment_cents, cap_cents))
      NON-LINEAR INTERACTION (pinned): three inputs (final_amount_cents, adjustment_cents,
      period_net_cents) combined through nested min/max; the cap can bind below the banded
      amount, and a negative adjustment can drive the raw figure below zero where the floor binds.
    input_set: "the statement being finalized/resolved plus its account's paid-set orders in the period"
    constants:
      REBATE_CAP_PCT: 0.05
    precision: "integer cents; round_half_up on the cap only"

  - name: loyalty_accrual
    trigger: "POST /orders/{id}/pay"
    algorithm: threshold
    formula: |
      mult   = TIER_POINT_MULT[order.tier_snapshot]
      points = floor(order.subtotal_cents / 100) * mult
      post LoyaltyTransaction(type := EARN, points_delta := +points, order_id := order.id)
      ContractorAccount.loyalty_points_balance = SUM(points_delta) over all its LoyaltyTransaction rows
    input_set: "the single order being paid; earn basis is merchandise subtotal (tax excluded)"
    constants:
      TIER_POINT_MULT: { STANDARD: 1, SILVER: 2, GOLD: 3, PLATINUM: 5 }
    precision: "integer points; floor before multiplying"

  - name: loyalty_clawback
    trigger: "POST /order-lines/{id}/return"
    algorithm: aggregation
    formula: |
      mult   = TIER_POINT_MULT[order.tier_snapshot]
      points = floor(ReturnRecord.refund_merchandise_cents / 100) * mult
      post LoyaltyTransaction(type := CLAWBACK, points_delta := -points, order_id := order.id)
      balance recomputed as SUM(points_delta); the balance MAY go negative (negative balances block redemption).
      CONSERVATION: for a single-line order that is paid and then fully returned,
      clawback points == earn points exactly (same merchandise basis, same multiplier),
      so the account balance returns to its pre-payment value.
    input_set: "the return event being processed"
    constants:
      TIER_POINT_MULT: { STANDARD: 1, SILVER: 2, GOLD: 3, PLATINUM: 5 }
    precision: "integer points; floor before multiplying"

  - name: return_refund
    trigger: "POST /order-lines/{id}/return"
    algorithm: aggregation
    formula: |
      refund_merchandise_cents = line.unit_price_cents * return_quantity
      tax_refund_cents         = round_half_up(refund_merchandise_cents * TAX_RATE_BPS / 10000)
      total_credit_cents       = refund_merchandise_cents + tax_refund_cents
      creates ReturnRecord with the three amounts; OrderLine.returned_quantity += return_quantity;
      Order.refunded_cents recomputed as SUM(total_credit_cents) over the order's return records.
      PINNED: no restocking fee; refund is full merchandise plus tax on the merchandise.
    input_set: "the order line and the requested return_quantity (1 <= return_quantity <= quantity - returned_quantity)"
    constants:
      TAX_RATE_BPS: 825
    precision: "integer cents; tax rounded per return event"

  - name: job_spent
    trigger: "recomputed on order pay, order return, and order cancel affecting the job"
    algorithm: aggregation
    formula: |
      JobAccount.spent_cents = SUM(total_cents - refunded_cents) over orders of the job with
      payment_status IN {PAID, PARTIALLY_REFUNDED}
      (UNPAID orders contribute nothing; fully REFUNDED orders net to zero and are excluded from the set.)
    input_set: "orders of the job in the paid/partially-refunded set"
    precision: "integer cents"

  - name: pull_through
    trigger: "recomputed on order pay, order return, order delivery completion, and spec line replacement, for any SpecLine referenced"
    algorithm: aggregation
    formula: |
      per SpecLine:
        ordered_qty   = SUM(quantity - returned_quantity) over OrderLine rows with
                        spec_line_id == line.id whose order payment_status IN {PAID, PARTIALLY_REFUNDED}
        delivered_qty = SUM(quantity - returned_quantity) over OrderLine rows with
                        spec_line_id == line.id whose order fulfillment_status == DELIVERED
      per SpecSheet (over its current lines; 0 when the sheet has no lines):
        pull_through_ordered_pct   = round_half_up(100 * SUM(min(ordered_qty, specified_qty))   / SUM(specified_qty), 2)
        pull_through_delivered_pct = round_half_up(100 * SUM(min(delivered_qty, specified_qty)) / SUM(specified_qty), 2)
    input_set: "OrderLine rows referencing the spec line, filtered per variant by the parent order's payment or fulfillment state"
    precision: "percentages at 2 decimals, round_half_up; quantities integer"
    variants:
      - name: ordered_basis
        when: "default commercial reporting"
        difference: "numerator counts PAID / PARTIALLY_REFUNDED orders — commitments made"
      - name: delivered_basis
        when: "final fulfillment certification"
        difference: "numerator counts only DELIVERED orders — for identical order data the two variants diverge whenever a paid order is not yet delivered"

  - name: mistint_price
    trigger: "computed on every read of MistintListing.current_price_cents and at mark-sold (stored into sold_price_cents)"
    algorithm: decay_function
    formula: |
      weeks         = floor((now - created_at) / 7 days)   # whole started weeks; logical clock
      decayed       = round_half_up(list_price_cents * MISTINT_WEEKLY_DECAY ^ weeks)
      floor_price   = round_half_up(cost_basis_cents * MISTINT_FLOOR_PCT)
      current_price_cents = max(floor_price, decayed)
      at creation: list_price_cents := floor(cost_basis_cents * MISTINT_INITIAL_PCT)
    input_set: "the single listing; time measured from its created_at to the logical clock now"
    constants:
      MISTINT_INITIAL_PCT: 0.50
      MISTINT_WEEKLY_DECAY: 0.90
      MISTINT_FLOOR_PCT: 0.25
    precision: "integer cents; round_half_up at each pinned step"

validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; X-User-Role is one of the declared roles", error_id: ERR_AUTH_REQUIRED, http_status: 401, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "the role is permitted for this endpoint per the RBAC matrix", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: auth, check: "when X-User-Role == Contractor, X-User-ID must equal the ContractorAccount.id that owns the addressed resource (directly, or via the resource's contractor_account_id chain through JobAccount/Order/RebateStatement/ColorMatchRequest)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "all endpoints listing the Contractor role" }
  - { priority: 4, category: existence, check: "path identifiers resolve to existing resources, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 5, category: existence, check: "request-body foreign keys (contractor_account_id, job_account_id, jurisdiction_id, product_id, formula_id, spec_line_id, replacement_product_id, order_id, sold_to_contractor_account_id) resolve to existing resources", error_id: ERR_REFERENCE_NOT_FOUND, http_status: 422, applies_to: "all endpoints with body FKs" }
  - { priority: 6, category: existence, check: "request well-formed: required fields present, types match, enum members valid, integer ranges honored (quantity > 0, voc_gpl > 0, credit_limit_cents >= 0, window_end > window_start, period_end > period_start)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all endpoints" }
  - { priority: 7, category: existence, check: "OCC: expected_contractor_account_version equals the account's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /contractor-accounts/{id}; POST /orders" }
  - { priority: 8, category: state, check: "contractor account status == ACTIVE before taking on new financial commitments", error_id: ERR_ACCOUNT_SUSPENDED, http_status: 409, applies_to: "POST /orders; POST /orders/{id}/pay; POST /loyalty-redemptions; POST /deliveries" }
  - { priority: 9, category: state, check: "job account status == OPEN", error_id: ERR_JOB_NOT_OPEN, http_status: 409, applies_to: "POST /orders (job must be OPEN); POST /deliveries (job must be OPEN); POST /deliveries/{id}/dispatch (job must be OPEN)" }
  - { priority: 10, category: state, check: "order payment_status == UNPAID", error_id: ERR_ORDER_NOT_PAYABLE, http_status: 409, applies_to: "POST /orders/{id}/pay" }
  - { priority: 11, category: state, check: "order fulfillment_status == PENDING and payment_status == UNPAID", error_id: ERR_ORDER_NOT_CANCELLABLE, http_status: 409, applies_to: "POST /orders/{id}/cancel" }
  - { priority: 12, category: state, check: "order payment_status IN {PAID, PARTIALLY_REFUNDED}", error_id: ERR_ORDER_NOT_REFUNDABLE, http_status: 409, applies_to: "POST /order-lines/{id}/return" }
  - { priority: 13, category: state, check: "delivery status == SCHEDULED", error_id: ERR_DELIVERY_NOT_DISPATCHABLE, http_status: 409, applies_to: "POST /deliveries/{id}/dispatch" }
  - { priority: 14, category: state, check: "delivery status == EN_ROUTE", error_id: ERR_DELIVERY_NOT_EN_ROUTE, http_status: 409, applies_to: "POST /deliveries/{id}/mark-delivered; POST /deliveries/{id}/mark-failed" }
  - { priority: 15, category: state, check: "spec sheet status == SUBMITTED", error_id: ERR_SPEC_NOT_REVIEWABLE, http_status: 409, applies_to: "POST /spec-sheets/{id}/approve; POST /spec-sheets/{id}/reject" }
  - { priority: 16, category: state, check: "spec sheet status IN {REJECTED, NEEDS_REVISION}", error_id: ERR_SPEC_NOT_REVISABLE, http_status: 409, applies_to: "POST /spec-sheets/{id}/revise" }
  - { priority: 17, category: state, check: "color match request status == PROPOSED", error_id: ERR_MATCH_NOT_REVIEWABLE, http_status: 409, applies_to: "POST /color-match-requests/{id}/approve; POST /color-match-requests/{id}/request-revision" }
  - { priority: 18, category: state, check: "all other state-machine preconditions hold: submit requires DRAFT; proposals requires SUBMITTED or REVISION_REQUESTED; finalize requires ACCRUED; dispute requires FINALIZED; resolve-dispute requires DISPUTED; rebate pay requires FINALIZED; publish requires DRAFT; take-effect requires PUBLISHED; formula retire requires ACTIVE; mistint mark-sold/write-off require LISTED; job hold requires OPEN; resume requires ON_HOLD; complete requires OPEN or ON_HOLD plus no open orders/deliveries; account suspend requires ACTIVE; reinstate requires SUSPENDED; abandon requires SUBMITTED/PROPOSED/REVISION_REQUESTED", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 19, category: business_safety, check: "VOC compliance: for every order line, product.voc_gpl <= max_voc_gpl of the VocRule effective at the logical clock now for (job.jurisdiction_id, product.category); pairs with no effective rule are unrestricted; at dispatch the check is re-run for all lines of the order at the dispatch instant", error_id: ERR_VOC_LIMIT_EXCEEDED, http_status: 422, applies_to: "POST /orders; POST /deliveries/{id}/dispatch" }
  - { priority: 20, category: business_temporal, check: "delivery window_start >= logical clock now", error_id: ERR_DELIVERY_WINDOW_PAST, http_status: 422, applies_to: "POST /deliveries" }
  - { priority: 21, category: business_temporal, check: "delivery window buffer: for the same job_account_id, the new [window_start, window_end) must keep a >= 30 minute clearance from every other delivery of that job with status IN {SCHEDULED, EN_ROUTE}: new.window_start >= existing.window_end + 30min OR new.window_end + 30min <= existing.window_start (mere adjacency is NOT sufficient)", error_id: ERR_DELIVERY_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /deliveries" }
  - { priority: 22, category: business_temporal, check: "VOC rule windows for the same (jurisdiction_id, category) must not overlap under half-open semantics [effective_from, effective_to); adjacency (new.effective_from == existing.effective_to) IS allowed; null effective_to is open-ended", error_id: ERR_VOC_RULE_OVERLAP, http_status: 409, applies_to: "POST /voc-rules" }
  - { priority: 23, category: business_temporal, check: "logical clock now >= bulletin.effective_date", error_id: ERR_BULLETIN_NOT_YET_EFFECTIVE, http_status: 422, applies_to: "POST /product-bulletins/{id}/take-effect" }
  - { priority: 24, category: business_temporal, check: "logical clock now >= period_start (cannot open a statement for a future period)", error_id: ERR_REBATE_PERIOD_INVALID, http_status: 422, applies_to: "POST /rebate-statements" }
  - { priority: 25, category: business_temporal, check: "no existing RebateStatement for the same contractor_account_id has a period overlapping [period_start, period_end) under half-open semantics; adjacency allowed", error_id: ERR_REBATE_PERIOD_OVERLAP, http_status: 409, applies_to: "POST /rebate-statements" }
  - { priority: 26, category: business_constraint, check: "Product.sku unique", error_id: ERR_SKU_EXISTS, http_status: 409, applies_to: "POST /products" }
  - { priority: 27, category: business_constraint, check: "Jurisdiction.code unique", error_id: ERR_JURISDICTION_CODE_EXISTS, http_status: 409, applies_to: "POST /jurisdictions" }
  - { priority: 28, category: business_constraint, check: "spec sheet has at least 1 SpecLine", error_id: ERR_SPEC_EMPTY, http_status: 422, applies_to: "POST /spec-sheets/{id}/submit" }
  - { priority: 29, category: business_constraint, check: "color match iteration_count < 3 (MATCH_MAX_ITERATIONS) before accepting a revision request", error_id: ERR_MATCH_ITERATION_EXHAUSTED, http_status: 422, applies_to: "POST /color-match-requests/{id}/request-revision" }
  - { priority: 30, category: business_constraint, check: "a line carrying formula_id requires product.tintable == true", error_id: ERR_PRODUCT_NOT_TINTABLE, http_status: 422, applies_to: "POST /orders" }
  - { priority: 31, category: business_constraint, check: "custom-tint lines (is_custom_tint == true) are never returnable, regardless of quantity remaining", error_id: ERR_CUSTOM_TINT_NO_RETURN, http_status: 422, applies_to: "POST /order-lines/{id}/return" }
  - { priority: 32, category: business_constraint, check: "return_quantity <= line.quantity - line.returned_quantity", error_id: ERR_RETURN_QUANTITY_EXCEEDED, http_status: 422, applies_to: "POST /order-lines/{id}/return" }
  - { priority: 33, category: business_referential, check: "referenced product status == ACTIVE (new order lines and spec approvals may not reference a DISCONTINUED product)", error_id: ERR_PRODUCT_DISCONTINUED, http_status: 422, applies_to: "POST /orders; POST /spec-sheets/{id}/approve" }
  - { priority: 34, category: business_referential, check: "referenced formula status == ACTIVE", error_id: ERR_FORMULA_RETIRED, http_status: 422, applies_to: "POST /orders" }
  - { priority: 35, category: business_referential, check: "formula.product_id == line.product_id", error_id: ERR_FORMULA_PRODUCT_MISMATCH, http_status: 422, applies_to: "POST /orders" }
  - { priority: 36, category: business_referential, check: "spec_line.product_id == line.product_id AND the spec line's sheet has status == APPROVED (pull-through attribution only against approved specs)", error_id: ERR_SPEC_LINE_PRODUCT_MISMATCH, http_status: 422, applies_to: "POST /orders" }
  - { priority: 37, category: business_referential, check: "job_account's contractor_account_id == order's contractor_account_id; delivery's job_account_id == order's job_account_id", error_id: ERR_JOB_ACCOUNT_MISMATCH, http_status: 422, applies_to: "POST /orders; POST /deliveries" }
  - { priority: 38, category: business_referential, check: "bulletin replacement_product_id non-null, != product_id, references an ACTIVE product of the same category", error_id: ERR_BULLETIN_REPLACEMENT_INVALID, http_status: 422, applies_to: "POST /product-bulletins/{id}/publish" }
  - { priority: 39, category: business_fiscal, check: "account.outstanding_balance_cents + new order total_cents <= credit_limit_cents", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 422, applies_to: "POST /orders" }
  - { priority: 40, category: business_fiscal, check: "job.spent_cents + new order total_cents <= budget_cap_cents (skipped when budget_cap_cents is null)", error_id: ERR_BUDGET_CAP_EXCEEDED, http_status: 422, applies_to: "POST /orders" }
  - { priority: 41, category: business_fiscal, check: "loyalty_points_balance >= points_to_redeem", error_id: ERR_INSUFFICIENT_POINTS, http_status: 422, applies_to: "POST /loyalty-redemptions" }

endpoints:
  - { method: POST, path: "/contractor-accounts", description: "Create a contractor account", roles: [CorporateAdmin], code: 201, input: [company_name, credit_limit_cents], output: ContractorAccount, side_effects: ["account initialized with status ACTIVE, tier STANDARD, zero balances"] }
  - { method: GET, path: "/contractor-accounts/{id}", description: "Read one account including computed balances", roles: [CorporateAdmin, StoreManager, StoreAssociate, Contractor], code: 200, input: [], output: ContractorAccount, side_effects: [] }
  - { method: PATCH, path: "/contractor-accounts/{id}", description: "Update company_name and/or credit_limit_cents; OCC-guarded", roles: [CorporateAdmin], code: 200, input: [expected_contractor_account_version, "company_name?", "credit_limit_cents?"], output: ContractorAccount, side_effects: ["increments ContractorAccount.version by 1"] }
  - { method: POST, path: "/contractor-accounts/{id}/suspend", description: "ACTIVE -> SUSPENDED", roles: [CorporateAdmin], code: 200, input: [], output: ContractorAccount, side_effects: ["increments ContractorAccount.version by 1"] }
  - { method: POST, path: "/contractor-accounts/{id}/reinstate", description: "SUSPENDED -> ACTIVE", roles: [CorporateAdmin], code: 200, input: [], output: ContractorAccount, side_effects: ["increments ContractorAccount.version by 1"] }
  - { method: POST, path: "/contractor-accounts/{id}/evaluate-tier", description: "Recompute tier from ytd_net_volume_cents per tier_evaluation", roles: [CorporateAdmin], code: 200, input: [], output: ContractorAccount, side_effects: ["sets tier per tier_evaluation", "increments ContractorAccount.version by 1 when tier changes"] }
  - { method: POST, path: "/job-accounts", description: "Create a job account for a contractor", roles: [StoreAssociate, Contractor], code: 201, input: [contractor_account_id, jurisdiction_id, job_name, site_address, "budget_cap_cents?"], output: JobAccount, side_effects: [] }
  - { method: GET, path: "/job-accounts/{id}", description: "Read one job account including spent_cents", roles: [CorporateAdmin, StoreManager, StoreAssociate, Contractor], code: 200, input: [], output: JobAccount, side_effects: [] }
  - { method: GET, path: "/job-accounts", description: "List job accounts", roles: [CorporateAdmin, StoreManager, StoreAssociate, Contractor], code: 200, input: ["contractor_account_id?", "jurisdiction_id?"], output: "JobAccount[]", side_effects: [] }
  - { method: POST, path: "/job-accounts/{id}/place-on-hold", description: "OPEN -> ON_HOLD", roles: [StoreManager, Contractor], code: 200, input: [], output: JobAccount, side_effects: ["increments JobAccount.version by 1"] }
  - { method: POST, path: "/job-accounts/{id}/resume", description: "ON_HOLD -> OPEN", roles: [StoreManager, Contractor], code: 200, input: [], output: JobAccount, side_effects: ["increments JobAccount.version by 1"] }
  - { method: POST, path: "/job-accounts/{id}/complete", description: "OPEN/ON_HOLD -> COMPLETE; requires no open orders or deliveries", roles: [StoreManager, Contractor], code: 200, input: [], output: JobAccount, side_effects: ["increments JobAccount.version by 1"] }
  - { method: POST, path: "/jurisdictions", description: "Create a jurisdiction", roles: [CorporateAdmin], code: 201, input: [code, name], output: Jurisdiction, side_effects: [] }
  - { method: POST, path: "/voc-rules", description: "Create a VOC limit rule; half-open window overlap with same (jurisdiction, category) rejected", roles: [CorporateAdmin], code: 201, input: [jurisdiction_id, category, max_voc_gpl, effective_from, "effective_to?"], output: VocRule, side_effects: [] }
  - { method: GET, path: "/voc-rules", description: "List VOC rules", roles: [CorporateAdmin, StoreManager, StoreAssociate, SpecWriter, Contractor], code: 200, input: ["jurisdiction_id?", "category?"], output: "VocRule[]", side_effects: [] }
  - { method: POST, path: "/products", description: "Create a product", roles: [CorporateAdmin], code: 201, input: [sku, name, category, voc_gpl, list_price_cents, tintable], output: Product, side_effects: [] }
  - { method: GET, path: "/products/{id}", description: "Read one product", roles: [CorporateAdmin, StoreManager, StoreAssociate, SpecWriter, Contractor], code: 200, input: [], output: Product, side_effects: [] }
  - { method: GET, path: "/products", description: "List products", roles: [CorporateAdmin, StoreManager, StoreAssociate, SpecWriter, Contractor], code: 200, input: ["status?", "category?", "replacement_product_id?"], output: "Product[]", side_effects: [] }
  - { method: PATCH, path: "/products/{id}", description: "Update name, list_price_cents, voc_gpl, tintable", roles: [CorporateAdmin], code: 200, input: ["name?", "list_price_cents?", "voc_gpl?", "tintable?"], output: Product, side_effects: ["increments Product.version by 1"] }
  - { method: POST, path: "/tint-formulas", description: "Create a formula revision; supersedes and retires the prior ACTIVE formula for the same (product_id, color_code)", roles: [StoreAssociate, CorporateAdmin], code: 201, input: [product_id, color_code, name, shots], output: TintFormula, side_effects: ["prior ACTIVE formula for (product_id, color_code) -> RETIRED with supersedes link", "revision := prior max revision + 1 (or 1)"] }
  - { method: GET, path: "/tint-formulas", description: "List formulas", roles: [CorporateAdmin, StoreManager, StoreAssociate, SpecWriter, Contractor], code: 200, input: ["product_id?", "status?", "color_code?", "supersedes_formula_id?"], output: "TintFormula[]", side_effects: [] }
  - { method: POST, path: "/tint-formulas/{id}/retire", description: "ACTIVE -> RETIRED", roles: [CorporateAdmin], code: 200, input: [], output: TintFormula, side_effects: ["increments TintFormula.version by 1"] }
  - { method: POST, path: "/product-bulletins", description: "Create a discontinuation bulletin (DRAFT)", roles: [CorporateAdmin], code: 201, input: [product_id, replacement_product_id, title, effective_date], output: ProductBulletin, side_effects: [] }
  - { method: GET, path: "/product-bulletins", description: "List bulletins", roles: [CorporateAdmin, StoreManager, StoreAssociate, SpecWriter, Contractor], code: 200, input: ["product_id?", "replacement_product_id?", "status?"], output: "ProductBulletin[]", side_effects: [] }
  - { method: POST, path: "/product-bulletins/{id}/publish", description: "DRAFT -> PUBLISHED; validates replacement", roles: [CorporateAdmin], code: 200, input: [], output: ProductBulletin, side_effects: ["sets published_at", "increments ProductBulletin.version by 1"] }
  - { method: POST, path: "/product-bulletins/{id}/take-effect", description: "PUBLISHED -> EFFECTIVE; fires the discontinuation cascade (product -> formulas -> spec lines -> spec sheets)", roles: [CorporateAdmin], code: 200, input: [], output: ProductBulletin, side_effects: ["subject product DISCONTINUED, replacement set", "subject product's ACTIVE formulas RETIRED", "affected SpecLine rows obsoleted", "APPROVED sheets with obsoleted lines -> NEEDS_REVISION", "sets effected_at"] }
  - { method: POST, path: "/color-match-requests", description: "Create a color match request (SUBMITTED)", roles: [StoreAssociate], code: 201, input: [contractor_account_id, product_id, sample_reference], output: ColorMatchRequest, side_effects: [] }
  - { method: GET, path: "/color-match-requests/{id}", description: "Read one request", roles: [CorporateAdmin, StoreManager, StoreAssociate, Contractor], code: 200, input: [], output: ColorMatchRequest, side_effects: [] }
  - { method: GET, path: "/color-match-requests", description: "List requests", roles: [CorporateAdmin, StoreManager, StoreAssociate, Contractor], code: 200, input: ["contractor_account_id?", "product_id?", "formula_id?", "status?"], output: "ColorMatchRequest[]", side_effects: [] }
  - { method: POST, path: "/color-match-requests/{id}/proposals", description: "Attach a match proposal; creates a COLOR_MATCH TintFormula; SUBMITTED/REVISION_REQUESTED -> PROPOSED", roles: [StoreAssociate], code: 201, input: [color_code, name, shots], output: ColorMatchRequest, side_effects: ["creates TintFormula (source COLOR_MATCH) with supersede semantics", "iteration_count += 1", "formula_id updated"] }
  - { method: POST, path: "/color-match-requests/{id}/approve", description: "PROPOSED -> APPROVED", roles: [Contractor], code: 200, input: [], output: ColorMatchRequest, side_effects: ["proposed formula remains ACTIVE"] }
  - { method: POST, path: "/color-match-requests/{id}/request-revision", description: "PROPOSED -> REVISION_REQUESTED; proposed formula retired; capped at 3 iterations", roles: [Contractor], code: 200, input: [], output: ColorMatchRequest, side_effects: ["proposed formula RETIRED"] }
  - { method: POST, path: "/color-match-requests/{id}/abandon", description: "SUBMITTED/PROPOSED/REVISION_REQUESTED -> ABANDONED", roles: [StoreAssociate, Contractor], code: 200, input: [], output: ColorMatchRequest, side_effects: ["proposed formula RETIRED when abandoning from PROPOSED"] }
  - { method: POST, path: "/orders", description: "Create an order with lines (each line: product_id, quantity, optional formula_id, optional spec_line_id); prices computed per line_pricing/order_totals; OCC-guarded on the contractor account", roles: [StoreAssociate, Contractor], code: 201, input: [contractor_account_id, job_account_id, expected_contractor_account_version, lines], output: Order, side_effects: ["creates OrderLine rows with snapshot/computed pricing", "tier_snapshot and loyalty basis frozen", "ContractorAccount.outstanding_balance_cents recomputed", "increments ContractorAccount.version by 1"] }
  - { method: GET, path: "/orders/{id}", description: "Read one order with computed totals", roles: [CorporateAdmin, StoreManager, StoreAssociate, Contractor], code: 200, input: [], output: Order, side_effects: [] }
  - { method: GET, path: "/orders", description: "List orders", roles: [CorporateAdmin, StoreManager, StoreAssociate, Contractor], code: 200, input: ["contractor_account_id?", "job_account_id?", "payment_status?", "fulfillment_status?"], output: "Order[]", side_effects: [] }
  - { method: POST, path: "/orders/{id}/pay", description: "UNPAID -> PAID; loyalty earn cascade", roles: [StoreAssociate, Contractor], code: 200, input: [], output: Order, side_effects: ["sets paid_at", "EARN LoyaltyTransaction posted", "account loyalty/outstanding recomputed", "JobAccount.spent_cents recomputed", "increments Order.version and ContractorAccount.version by 1"] }
  - { method: POST, path: "/orders/{id}/cancel", description: "PENDING + UNPAID -> CANCELLED", roles: [StoreAssociate, Contractor], code: 200, input: [], output: Order, side_effects: ["outstanding_balance_cents recomputed", "increments Order.version and ContractorAccount.version by 1"] }
  - { method: GET, path: "/order-lines", description: "List order lines", roles: [CorporateAdmin, StoreManager, StoreAssociate, Contractor], code: 200, input: ["order_id?", "product_id?", "formula_id?", "spec_line_id?"], output: "OrderLine[]", side_effects: [] }
  - { method: POST, path: "/order-lines/{id}/return", description: "Return units of a non-custom-tint line; fires the refund -> clawback cascade", roles: [StoreAssociate], code: 201, input: [quantity], output: ReturnRecord, side_effects: ["ReturnRecord created per return_refund", "OrderLine.returned_quantity += quantity", "Order.refunded_cents and payment_status recomputed", "CLAWBACK LoyaltyTransaction posted per loyalty_clawback", "JobAccount.spent_cents and account ytd volume recomputed", "SpecLine.ordered_qty/delivered_qty recomputed for referenced spec lines"] }
  - { method: GET, path: "/return-records", description: "List return records", roles: [CorporateAdmin, StoreManager, StoreAssociate, Contractor], code: 200, input: ["order_line_id?"], output: "ReturnRecord[]", side_effects: [] }
  - { method: POST, path: "/deliveries", description: "Schedule a delivery window for a paid-or-unpaid order; window buffer rule per job", roles: [StoreManager], code: 201, input: [order_id, job_account_id, window_start, window_end], output: Delivery, side_effects: [] }
  - { method: GET, path: "/deliveries", description: "List deliveries", roles: [CorporateAdmin, StoreManager, StoreAssociate, Contractor], code: 200, input: ["order_id?", "job_account_id?", "status?"], output: "Delivery[]", side_effects: [] }
  - { method: POST, path: "/deliveries/{id}/dispatch", description: "SCHEDULED -> EN_ROUTE; guards: order PAID, job OPEN, VOC re-check at dispatch instant", roles: [StoreManager], code: 200, input: [], output: Delivery, side_effects: ["sets dispatched_at", "order.fulfillment_status -> OUT_FOR_DELIVERY", "increments Delivery.version and Order.version by 1"] }
  - { method: POST, path: "/deliveries/{id}/mark-delivered", description: "EN_ROUTE -> DELIVERED; bubbles order fulfillment to DELIVERED when no open deliveries remain", roles: [StoreManager], code: 200, input: [], output: Delivery, side_effects: ["sets delivered_at", "order fulfillment bubble-up", "spec pull-through delivered basis recomputed"] }
  - { method: POST, path: "/deliveries/{id}/mark-failed", description: "EN_ROUTE -> FAILED (terminal); re-delivery via a new Delivery row", roles: [StoreManager], code: 200, input: [failure_reason], output: Delivery, side_effects: ["sets failure_reason"] }
  - { method: POST, path: "/spec-sheets", description: "Create a spec sheet with lines (each line: product_id, specified_qty) in DRAFT", roles: [SpecWriter], code: 201, input: [project_code, architect_name, title, lines], output: SpecSheet, side_effects: ["creates SpecLine rows"] }
  - { method: GET, path: "/spec-sheets/{id}", description: "Read one sheet including pull-through percentages", roles: [CorporateAdmin, StoreManager, StoreAssociate, SpecWriter, Contractor], code: 200, input: [], output: SpecSheet, side_effects: [] }
  - { method: GET, path: "/spec-sheets", description: "List sheets", roles: [CorporateAdmin, StoreManager, StoreAssociate, SpecWriter, Contractor], code: 200, input: ["status?", "project_code?", "supersedes_spec_sheet_id?"], output: "SpecSheet[]", side_effects: [] }
  - { method: POST, path: "/spec-sheets/{id}/submit", description: "DRAFT -> SUBMITTED; requires at least one line", roles: [SpecWriter], code: 200, input: [], output: SpecSheet, side_effects: ["increments SpecSheet.version by 1"] }
  - { method: POST, path: "/spec-sheets/{id}/approve", description: "SUBMITTED -> APPROVED; pins product references; supersedes prior APPROVED sheet for the project", roles: [CorporateAdmin], code: 200, input: [], output: SpecSheet, side_effects: ["sets approved_at", "prior APPROVED sheet for project_code -> SUPERSEDED", "supersedes_spec_sheet_id set"] }
  - { method: POST, path: "/spec-sheets/{id}/reject", description: "SUBMITTED -> REJECTED", roles: [CorporateAdmin], code: 200, input: [reason], output: SpecSheet, side_effects: ["sets rejection_reason"] }
  - { method: POST, path: "/spec-sheets/{id}/revise", description: "REJECTED/NEEDS_REVISION -> DRAFT; atomically replaces the line set with payload lines (each line: product_id, specified_qty)", roles: [SpecWriter], code: 200, input: [lines], output: SpecSheet, side_effects: ["old SpecLine rows replaced; new rows created with obsoleted false"] }
  - { method: GET, path: "/spec-lines", description: "List spec lines", roles: [CorporateAdmin, StoreManager, StoreAssociate, SpecWriter, Contractor], code: 200, input: ["spec_sheet_id?", "product_id?"], output: "SpecLine[]", side_effects: [] }
  - { method: POST, path: "/rebate-statements", description: "Generate a statement for an account+period (ACCRUED) with provisional_amount_cents per rebate_provisional", roles: [CorporateAdmin], code: 201, input: [contractor_account_id, period_start, period_end], output: RebateStatement, side_effects: ["provisional_amount_cents computed and stored"] }
  - { method: GET, path: "/rebate-statements", description: "List statements", roles: [CorporateAdmin, Contractor], code: 200, input: ["contractor_account_id?", "status?"], output: "RebateStatement[]", side_effects: [] }
  - { method: POST, path: "/rebate-statements/{id}/finalize", description: "ACCRUED -> FINALIZED; computes final_amount_cents (chronological), period_net_cents, payable_cents", roles: [CorporateAdmin], code: 200, input: [], output: RebateStatement, side_effects: ["final_amount_cents, period_net_cents, payable_cents computed", "increments RebateStatement.version by 1"] }
  - { method: POST, path: "/rebate-statements/{id}/dispute", description: "FINALIZED -> DISPUTED", roles: [Contractor], code: 200, input: [], output: RebateStatement, side_effects: ["increments RebateStatement.version by 1"] }
  - { method: POST, path: "/rebate-statements/{id}/resolve-dispute", description: "DISPUTED -> FINALIZED with signed adjustment; payable recomputed", roles: [CorporateAdmin], code: 200, input: [adjustment_cents], output: RebateStatement, side_effects: ["adjustment_cents set", "payable_cents recomputed", "increments RebateStatement.version by 1"] }
  - { method: POST, path: "/rebate-statements/{id}/pay", description: "FINALIZED -> PAID; books payable to the account", roles: [CorporateAdmin], code: 200, input: [], output: RebateStatement, side_effects: ["sets paid_at", "ContractorAccount.lifetime_rebate_paid_cents recomputed"] }
  - { method: POST, path: "/loyalty-redemptions", description: "Redeem points (1 point = 1 cent credit note); REDEEM transaction posted", roles: [Contractor], code: 201, input: [contractor_account_id, points_to_redeem], output: LoyaltyTransaction, side_effects: ["REDEEM LoyaltyTransaction with points_delta := -points_to_redeem", "balance recomputed"] }
  - { method: GET, path: "/loyalty-transactions", description: "List loyalty ledger entries", roles: [CorporateAdmin, StoreManager, StoreAssociate, Contractor], code: 200, input: ["contractor_account_id?", "order_id?"], output: "LoyaltyTransaction[]", side_effects: [] }
  - { method: POST, path: "/mistint-listings", description: "Create a mistint listing (LISTED)", roles: [StoreAssociate], code: 201, input: [product_id, "formula_id?", quantity, cost_basis_cents], output: MistintListing, side_effects: ["list_price_cents := floor(cost_basis_cents * 0.50)"] }
  - { method: GET, path: "/mistint-listings", description: "List mistint listings with current decayed price", roles: [CorporateAdmin, StoreManager, StoreAssociate, Contractor], code: 200, input: ["status?", "product_id?", "formula_id?", "sold_to_contractor_account_id?"], output: "MistintListing[]", side_effects: [] }
  - { method: POST, path: "/mistint-listings/{id}/mark-sold", description: "LISTED -> SOLD; sold_price_cents := current_price_cents at sale instant", roles: [StoreAssociate], code: 200, input: ["sold_to_contractor_account_id?"], output: MistintListing, side_effects: ["sold_price_cents captured per mistint_price"] }
  - { method: POST, path: "/mistint-listings/{id}/write-off", description: "LISTED -> WRITTEN_OFF", roles: [StoreManager], code: 200, input: [], output: MistintListing, side_effects: ["increments MistintListing.version by 1"] }
  - { method: GET, path: "/voc-rules/{id}", description: "Read one VOC rule", roles: [CorporateAdmin, StoreManager, StoreAssociate, SpecWriter, Contractor], code: 200, input: [], output: VocRule, side_effects: [] }
  - { method: GET, path: "/tint-formulas/{id}", description: "Read one formula", roles: [CorporateAdmin, StoreManager, StoreAssociate, SpecWriter, Contractor], code: 200, input: [], output: TintFormula, side_effects: [] }
  - { method: GET, path: "/product-bulletins/{id}", description: "Read one bulletin", roles: [CorporateAdmin, StoreManager, StoreAssociate, SpecWriter, Contractor], code: 200, input: [], output: ProductBulletin, side_effects: [] }
  - { method: GET, path: "/spec-lines/{id}", description: "Read one spec line including pull-through counters", roles: [CorporateAdmin, StoreManager, StoreAssociate, SpecWriter, Contractor], code: 200, input: [], output: SpecLine, side_effects: [] }
  - { method: GET, path: "/order-lines/{id}", description: "Read one order line", roles: [CorporateAdmin, StoreManager, StoreAssociate, Contractor], code: 200, input: [], output: OrderLine, side_effects: [] }
  - { method: GET, path: "/return-records/{id}", description: "Read one return record", roles: [CorporateAdmin, StoreManager, StoreAssociate, Contractor], code: 200, input: [], output: ReturnRecord, side_effects: [] }
  - { method: GET, path: "/deliveries/{id}", description: "Read one delivery", roles: [CorporateAdmin, StoreManager, StoreAssociate, Contractor], code: 200, input: [], output: Delivery, side_effects: [] }
  - { method: GET, path: "/rebate-statements/{id}", description: "Read one rebate statement", roles: [CorporateAdmin, Contractor], code: 200, input: [], output: RebateStatement, side_effects: [] }
  - { method: GET, path: "/loyalty-transactions/{id}", description: "Read one ledger entry", roles: [CorporateAdmin, StoreManager, StoreAssociate, Contractor], code: 200, input: [], output: LoyaltyTransaction, side_effects: [] }
  - { method: GET, path: "/mistint-listings/{id}", description: "Read one mistint listing with current decayed price", roles: [CorporateAdmin, StoreManager, StoreAssociate, Contractor], code: 200, input: [], output: MistintListing, side_effects: [] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving endpoint: set the logical clock. Startup default is exactly 2026-05-01T00:00:00Z and the server never falls back to wall-clock time; ALL server timestamps (created_at, paid_at, dispatched_at, decay windows, period math) derive from this logical clock.", roles: [CorporateAdmin], code: 204, input: [to_iso8601], output: null, side_effects: ["logical clock advanced; no entity mutated"] }

errors:
  - { id: ERR_AUTH_REQUIRED, http: 401, condition: "missing headers or unknown X-User-Role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "role not permitted for the endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Contractor caller's X-User-ID does not match the resource's owning ContractorAccount" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path identifier does not resolve (checked left-to-right)" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "request-body foreign key does not resolve" }
  - { id: ERR_VALIDATION, http: 400, condition: "missing required field, type mismatch, invalid enum member, or violated range/shape constraint" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_contractor_account_version does not match the account's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "generic state-machine precondition violation not covered by a domain-specific error" }
  - { id: ERR_ACCOUNT_SUSPENDED, http: 409, condition: "new financial commitment attempted while account is SUSPENDED" }
  - { id: ERR_ORDER_NOT_PAYABLE, http: 409, condition: "pay attempted on an order whose payment_status != UNPAID" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "cancel attempted on an order not in (PENDING, UNPAID)" }
  - { id: ERR_ORDER_NOT_REFUNDABLE, http: 409, condition: "return attempted on a line of an order whose payment_status not in {PAID, PARTIALLY_REFUNDED}" }
  - { id: ERR_JOB_NOT_OPEN, http: 409, condition: "order/delivery/dispatch attempted against a job not in OPEN" }
  - { id: ERR_DELIVERY_NOT_DISPATCHABLE, http: 409, condition: "dispatch attempted on a delivery not in SCHEDULED" }
  - { id: ERR_DELIVERY_NOT_EN_ROUTE, http: 409, condition: "mark-delivered/mark-failed attempted on a delivery not in EN_ROUTE" }
  - { id: ERR_SPEC_NOT_REVIEWABLE, http: 409, condition: "approve/reject attempted on a sheet not in SUBMITTED" }
  - { id: ERR_SPEC_NOT_REVISABLE, http: 409, condition: "revise attempted on a sheet not in {REJECTED, NEEDS_REVISION}" }
  - { id: ERR_MATCH_NOT_REVIEWABLE, http: 409, condition: "approve/request-revision attempted on a color match request not in PROPOSED" }
  - { id: ERR_VOC_LIMIT_EXCEEDED, http: 422, condition: "product voc_gpl exceeds the effective VocRule max for (job jurisdiction, product category) at the relevant instant" }
  - { id: ERR_DELIVERY_WINDOW_PAST, http: 422, condition: "delivery window_start is before the logical clock now" }
  - { id: ERR_DELIVERY_WINDOW_CONFLICT, http: 409, condition: "delivery window violates the 30-minute clearance buffer against another SCHEDULED/EN_ROUTE delivery of the same job" }
  - { id: ERR_VOC_RULE_OVERLAP, http: 409, condition: "VOC rule window overlaps an existing rule for the same (jurisdiction, category); adjacency allowed" }
  - { id: ERR_BULLETIN_NOT_YET_EFFECTIVE, http: 422, condition: "take-effect attempted before the bulletin's effective_date" }
  - { id: ERR_REBATE_PERIOD_INVALID, http: 422, condition: "statement generation attempted before period_start (or malformed period)" }
  - { id: ERR_REBATE_PERIOD_OVERLAP, http: 409, condition: "statement period overlaps an existing statement for the same account; adjacency allowed" }
  - { id: ERR_SKU_EXISTS, http: 409, condition: "product sku already exists" }
  - { id: ERR_JURISDICTION_CODE_EXISTS, http: 409, condition: "jurisdiction code already exists" }
  - { id: ERR_SPEC_EMPTY, http: 422, condition: "submit attempted on a sheet with zero lines" }
  - { id: ERR_MATCH_ITERATION_EXHAUSTED, http: 422, condition: "revision requested when iteration_count >= 3" }
  - { id: ERR_PRODUCT_NOT_TINTABLE, http: 422, condition: "formula_id supplied for a product with tintable == false" }
  - { id: ERR_CUSTOM_TINT_NO_RETURN, http: 422, condition: "return attempted on a custom-tint line (is_custom_tint == true)" }
  - { id: ERR_RETURN_QUANTITY_EXCEEDED, http: 422, condition: "return quantity exceeds quantity - returned_quantity" }
  - { id: ERR_PRODUCT_DISCONTINUED, http: 422, condition: "new order line or spec approval references a DISCONTINUED product" }
  - { id: ERR_FORMULA_RETIRED, http: 422, condition: "order line references a RETIRED formula" }
  - { id: ERR_FORMULA_PRODUCT_MISMATCH, http: 422, condition: "formula.product_id differs from the line's product_id" }
  - { id: ERR_SPEC_LINE_PRODUCT_MISMATCH, http: 422, condition: "spec_line_id references a line whose product differs from the order line's product, or whose sheet is not APPROVED" }
  - { id: ERR_JOB_ACCOUNT_MISMATCH, http: 422, condition: "job does not belong to the order's contractor, or delivery job differs from order job" }
  - { id: ERR_BULLETIN_REPLACEMENT_INVALID, http: 422, condition: "bulletin replacement missing, self-referential, not ACTIVE, or wrong category at publish" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "outstanding_balance_cents + new order total exceeds credit_limit_cents" }
  - { id: ERR_BUDGET_CAP_EXCEEDED, http: 422, condition: "job spent_cents + new order total exceeds budget_cap_cents" }
  - { id: ERR_INSUFFICIENT_POINTS, http: 422, condition: "points_to_redeem exceeds loyalty_points_balance" }

roles:
  - name: CorporateAdmin
    description: "Head-office operator: owns catalog, regulation, bulletins, account administration, tier evaluation, and rebate settlement"
    identity: opaque
    exclusive_operations: ["manage jurisdictions/voc-rules/products/bulletins", "create/patch/suspend/reinstate contractor accounts", "evaluate-tier", "generate/finalize/resolve/pay rebate statements", "approve/reject spec sheets", "retire tint formulas", "set logical clock"]
    shared_operations: ["read any resource", "create tint formulas"]
  - name: StoreManager
    description: "Store operator: owns delivery scheduling/dispatch/completion and mistint write-off; assists job lifecycle"
    identity: opaque
    exclusive_operations: ["create/dispatch/complete/fail deliveries", "write off mistint listings", "place/resume/complete job accounts (shared with owner contractor)"]
    shared_operations: ["read any resource"]
  - name: StoreAssociate
    description: "Counter operator: creates orders, takes payments and returns, runs color-match intake and proposals, lists mistints"
    identity: opaque
    exclusive_operations: ["create/pay/cancel orders for any contractor", "process line returns", "create color-match requests and proposals", "create and sell mistint listings"]
    shared_operations: ["read any resource", "create job accounts", "create tint formulas"]
  - name: SpecWriter
    description: "Specification services: writes and revises spec sheets for architects; cannot approve them"
    identity: opaque
    exclusive_operations: ["create/submit/revise spec sheets"]
    shared_operations: ["read any resource"]
  - name: Contractor
    description: "Contractor account holder acting on its own account, jobs, orders, matches, and rebates"
    identity: "entity_backed:ContractorAccount"
    exclusive_operations: ["approve/request-revision/abandon own color-match requests", "dispute own rebate statements", "redeem own loyalty points"]
    shared_operations: ["create job accounts for itself", "create/pay/cancel its own orders", "place/resume/complete its own job accounts", "read its own resources"]
