# =============================================================================
# §1.9 Scaffold Corner Design — breadth coverage index for
#      task 2455 "Minimum Advertised Price & Authorized Reseller Enforcement"
#
# Generated against the FROZEN SCAFFOLD.yaml (§1.0–§1.5 + §1.2.1). Every call
# resolves to a §1.5 endpoint, every role to that endpoint's `roles:` list,
# every payload key to that endpoint's `input:`, every capture to a §1.1 field
# or a §1.5 inline `output:` field.
#
# Shared fixture vocabulary used throughout (all literals, pinned here once):
#   clock default                 2026-08-01T00:00:00Z
#   policy MAP-2026-A             all §1.1 defaults (cure_window_days 10,
#                                 suspension_points_threshold 6,
#                                 termination_points_threshold 12,
#                                 suspension_cooling_off_days 14,
#                                 max_discount_attribution_pct 0.40,
#                                 auto_coupon_counts_as_advertised true,
#                                 promo_code / shipping counted false)
#   product SKU-AUDIO-1           msrp 20000, standard_map_floor 15000
#   evidence hashes               H1 = 1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b
#                                 H3 = 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
#   opaque user ids               bcm-1 / counsel-1 / counsel-2 / analyst-1 / admin-1
#
# Adjudications where the frozen scaffold spells one enum two ways, §1.2 wins
# (it states the value as an explicit `decision == X` equality test, §1.5's
# `side_effects:` prose is a shorthand summary):
#   POST /pricing-policies/{id}/review-decision  -> APPROVE_FOR_PUBLICATION | RETURN_FOR_REVISION
#   POST /violations/{id}/dispute-decision       -> REJECT | SUSTAIN
#   POST /test-purchases/{id}/confirm-outcome    -> UNAUTHORIZED | AUTHORIZED
#   Violation.dispute_rounds increments on a REJECTED dispute-decision (§1.1 field text), not on dispute
#   A CURED violation KEEPS its assessed_points in the ledger (§1.2 + §1.3 LEDGER_STATUSES)
#   Direct rescission returns the cited Violation to DETECTED (§1.2 EnforcementNotice RESCINDED)
#   Publish supersedes the prior PUBLISHED policy; all supersession fixtures share one policy_code
#   so §1.2's "the single other PUBLISHED policy" and §1.5's "sharing policy_code" agree.
#
# No `excluded_because:` stubs are emitted: SCAFFOLD_DIFFICULTY_DESIGN.yaml is
# authored concurrently, so no §1.8 instance name can be cited safely and the
# spec forbids stubbing a corner that no §1.8 instance provably covers.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — entities  (§1.1, entity_topology: flat)
  # ===========================================================================
  - section: entities
    instances:

      - name: create_pricing_policy_returns_draft_revision_one
        claim_type: creation
        grounds: [entities.PricingPolicy.fields.status, entities.PricingPolicy.fields.revision_number, entities.PricingPolicy.fields.policy_code]
        distinguishing_aspect: "POST /pricing-policies with only policy_code returns 201 and a row in status DRAFT with revision_number 1, the first of its policy_code."
        test_recipe:
          setup: ["Empty DB; logical clock pinned to 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pricing-policies"
              payload: { policy_code: "MAP-2026-A" }
              as: BrandChannelManager
              captures: { pol: $.data.id, polv: $.data.version }
          assert:
            - "HTTP 201"
            - "PricingPolicy.${pol}.status == DRAFT"
            - "PricingPolicy.${pol}.revision_number == 1"
            - "PricingPolicy.${pol}.policy_code == 'MAP-2026-A'"
            - "PricingPolicy.${pol}.version == 1"
            - "PricingPolicy.${pol}.effective_from == null"

      - name: create_product_under_published_policy_starts_with_zero_open_exceptions
        claim_type: creation
        grounds: [entities.Product.fields.governing_policy_id, entities.Product.fields.open_exception_count, calculations.product_open_exception_count]
        distinguishing_aspect: "POST /products against a PUBLISHED governing policy returns 201 with open_exception_count == 0 and version == 1."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED with effective_from 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing-policies"
              payload: { policy_code: "MAP-2026-A" }
              as: BrandChannelManager
              captures: { pol: $.data.id }
            - call: "POST /pricing-policies/${pol}/submit-review"
              payload: {}
              as: BrandChannelManager
            - call: "POST /pricing-policies/${pol}/review-decision"
              payload: { decision: "APPROVE_FOR_PUBLICATION", legal_review_notes: "Unilateral, no dealer input" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /pricing-policies/${pol}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
          trigger:
            - call: "POST /products"
              payload: { sku: "SKU-AUDIO-1", name: "Studio Headphones", msrp_cents: 20000, standard_map_floor_cents: 15000, governing_policy_id: "${pol}" }
              as: BrandChannelManager
              captures: { prod: $.data.id }
          assert:
            - "HTTP 201"
            - "Product.${prod}.open_exception_count == 0"
            - "Product.${prod}.governing_policy_id == ${pol}"
            - "Product.${prod}.version == 1"

      - name: create_distributor_starts_good_with_empty_ledgers
        claim_type: creation
        grounds: [entities.Distributor.fields.standing, entities.Distributor.fields.diversion_score, entities.Distributor.fields.chargeback_balance_cents, entities.Distributor.fields.shipped_units_total]
        distinguishing_aspect: "POST /distributors returns 201 with standing GOOD, diversion_score 0, chargeback_balance_cents 0 and shipped_units_total 0."
        test_recipe:
          setup: ["Empty DB; clock 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /distributors"
              payload: { legal_name: "Northwind Distribution", annual_chargeback_cap_cents: 500000 }
              as: BrandChannelManager
              captures: { dist: $.data.id }
          assert:
            - "HTTP 201"
            - "Distributor.${dist}.standing == GOOD"
            - "Distributor.${dist}.diversion_score == 0"
            - "Distributor.${dist}.chargeback_balance_cents == 0"
            - "Distributor.${dist}.shipped_units_total == 0"
            - "Distributor.${dist}.probation_entered_at == null"

      - name: create_reseller_starts_applied_and_held_pending_authorization
        claim_type: creation
        grounds: [entities.Reseller.fields.authorization_status, entities.Reseller.fields.supply_status, entities.Reseller.fields.hold_reason, state_machines.Reseller.initial_state]
        distinguishing_aspect: "POST /resellers returns 201 with the parallel machine at APPLIED / HOLD and hold_reason PENDING_AUTHORIZATION."
        test_recipe:
          setup: ["Distributor Northwind exists so sourcing_distributor_id resolves."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distributors"
              payload: { legal_name: "Northwind Distribution", annual_chargeback_cap_cents: 500000 }
              as: BrandChannelManager
              captures: { dist: $.data.id }
          trigger:
            - call: "POST /resellers"
              payload: { legal_name: "Acme Retail LLC", contact_email: "ops@acme.example", primary_channel: "MARKETPLACE", sourcing_distributor_id: "${dist}" }
              as: BrandChannelManager
              captures: { res: $.data.id }
          assert:
            - "HTTP 201"
            - "Reseller.${res}.authorization_status == APPLIED"
            - "Reseller.${res}.supply_status == HOLD"
            - "Reseller.${res}.hold_reason == PENDING_AUTHORIZATION"
            - "Reseller.${res}.violation_points_total == 0"
            - "Reseller.${res}.review_required == false"
            - "Reseller.${res}.suspension_ends_at == null"

      - name: create_reseller_agreement_starts_draft_with_negotiation_flags_unset
        claim_type: creation
        grounds: [entities.ResellerAgreement.fields.status, entities.ResellerAgreement.fields.non_negotiation_acknowledged, entities.ResellerAgreement.fields.price_terms_included]
        distinguishing_aspect: "POST /reseller-agreements returns 201 in DRAFT with non_negotiation_acknowledged false, sent_at null and countersigned_at null."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED; reseller Acme APPLIED on MARKETPLACE."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing-policies"
              payload: { policy_code: "MAP-2026-A" }
              as: BrandChannelManager
              captures: { pol: $.data.id }
            - call: "POST /pricing-policies/${pol}/submit-review"
              payload: {}
              as: BrandChannelManager
            - call: "POST /pricing-policies/${pol}/review-decision"
              payload: { decision: "APPROVE_FOR_PUBLICATION" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /pricing-policies/${pol}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /resellers"
              payload: { legal_name: "Acme Retail LLC", contact_email: "ops@acme.example", primary_channel: "MARKETPLACE" }
              as: BrandChannelManager
              captures: { res: $.data.id }
          trigger:
            - call: "POST /reseller-agreements"
              payload: { reseller_id: "${res}", policy_id: "${pol}", permitted_channels: ["MARKETPLACE", "OWN_WEBSITE"], quality_obligations: ["AUTHENTICITY_LABELING", "WARRANTY_HONORED"], term_ends_at: "2027-06-30T00:00:00Z" }
              as: BrandChannelManager
              captures: { agr: $.data.id }
          assert:
            - "HTTP 201"
            - "ResellerAgreement.${agr}.status == DRAFT"
            - "ResellerAgreement.${agr}.non_negotiation_acknowledged == false"
            - "ResellerAgreement.${agr}.price_terms_included == false"
            - "ResellerAgreement.${agr}.sent_at == null"
            - "ResellerAgreement.${agr}.countersigned_at == null"
            - "Reseller.${res}.authorization_status == APPLIED"

      - name: create_price_observation_starts_captured_with_analyst_stamp
        claim_type: creation
        grounds: [entities.PriceObservation.fields.evaluation_status, entities.PriceObservation.fields.evidence_captured_by_user_id, entities.PriceObservation.fields.unauthorized_seller_confirmed]
        distinguishing_aspect: "POST /price-observations returns 201 in evaluation_status CAPTURED with evidence_captured_by_user_id equal to the analyst's X-User-ID and every derived money field null."
        test_recipe:
          setup: ["Policy PUBLISHED, product SKU-AUDIO-1 (floor 15000), clock at 2026-08-20T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing-policies"
              payload: { policy_code: "MAP-2026-A" }
              as: BrandChannelManager
              captures: { pol: $.data.id }
            - call: "POST /pricing-policies/${pol}/submit-review"
              payload: {}
              as: BrandChannelManager
            - call: "POST /pricing-policies/${pol}/review-decision"
              payload: { decision: "APPROVE_FOR_PUBLICATION" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /pricing-policies/${pol}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /products"
              payload: { sku: "SKU-AUDIO-1", name: "Studio Headphones", msrp_cents: 20000, standard_map_floor_cents: 15000, governing_policy_id: "${pol}" }
              as: BrandChannelManager
              captures: { prod: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /price-observations"
              payload: { product_id: "${prod}", channel: "MARKETPLACE", seller_display_name: "Acme Store", listing_url: "https://mkt.example/l/1", listed_price_cents: 14000, observed_at: "2026-08-18T00:00:00Z", evidence_hash: "1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b", marketplace_name: "BigMarket" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { obs: $.data.id }
          assert:
            - "HTTP 201"
            - "PriceObservation.${obs}.evaluation_status == CAPTURED"
            - "PriceObservation.${obs}.evidence_captured_by_user_id == 'analyst-1'"
            - "PriceObservation.${obs}.effective_advertised_price_cents == null"
            - "PriceObservation.${obs}.effective_map_floor_cents == null"
            - "PriceObservation.${obs}.deviation_cents == null"
            - "PriceObservation.${obs}.unauthorized_seller_confirmed == false"

      - name: create_pricing_exception_starts_requested_and_not_retroactive
        claim_type: creation
        grounds: [entities.PricingException.fields.status, entities.PricingException.fields.retroactive, entities.PricingException.fields.requested_by_user_id]
        distinguishing_aspect: "A PROMOTIONAL_EVENT exception whose starts_at is at the clock (not before it) is created REQUESTED with retroactive == false and override_floor_cents still null."
        test_recipe:
          setup: ["Policy PUBLISHED, product SKU-AUDIO-1, clock 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing-policies"
              payload: { policy_code: "MAP-2026-A" }
              as: BrandChannelManager
              captures: { pol: $.data.id }
            - call: "POST /pricing-policies/${pol}/submit-review"
              payload: {}
              as: BrandChannelManager
            - call: "POST /pricing-policies/${pol}/review-decision"
              payload: { decision: "APPROVE_FOR_PUBLICATION" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /pricing-policies/${pol}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /products"
              payload: { sku: "SKU-AUDIO-1", name: "Studio Headphones", msrp_cents: 20000, standard_map_floor_cents: 15000, governing_policy_id: "${pol}" }
              as: BrandChannelManager
              captures: { prod: $.data.id }
          trigger:
            - call: "POST /pricing-exceptions"
              payload: { product_id: "${prod}", exception_type: "PROMOTIONAL_EVENT", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-31T00:00:00Z", channel_scope: "MARKETPLACE", requested_override_floor_cents: 13000, dealer_input_source: "BRAND_MARKETING_PLAN" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { exc: $.data.id }
          assert:
            - "HTTP 201"
            - "PricingException.${exc}.status == REQUESTED"
            - "PricingException.${exc}.retroactive == false"
            - "PricingException.${exc}.override_floor_cents == null"
            - "PricingException.${exc}.requested_by_user_id == 'bcm-1'"
            - "PricingException.${exc}.voided_violation_count == 0"

      - name: create_serial_unit_starts_shipped_to_distributor_and_bumps_shipped_total
        claim_type: creation
        grounds: [entities.SerialUnit.fields.status, entities.Distributor.fields.shipped_units_total, state_machines.SerialUnit.initial_state]
        distinguishing_aspect: "POST /serial-units returns 201 in SHIPPED_TO_DISTRIBUTOR with downstream_reseller_id null, and raises the named distributor's shipped_units_total from 0 to 1."
        test_recipe:
          setup: ["Policy PUBLISHED, serialized product SKU-AUDIO-1, distributor Northwind with shipped_units_total 0."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing-policies"
