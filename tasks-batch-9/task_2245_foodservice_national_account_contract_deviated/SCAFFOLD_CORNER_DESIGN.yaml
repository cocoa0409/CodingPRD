          - validations[priority=29]
        excluded_because:
          difficulty_instance: deviation_negotiation_cycle_capped_at_three_rounds
          rationale: |
            That §1.8 instance already traverses the SUBMITTED <-> REVISION_REQUESTED
            loop three times, asserts revision_round 0 -> 3 and proves the termination
            condition by driving the fourth resubmit into
            ERR_MAX_REVISION_ROUNDS_EXCEEDED, which is exactly the cyclic-shape claim.


      - claim_type: parallel
        name: parallel_dimensions_change_independently
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.OrderLine.pricing_status
          - state_machines.OrderLine.billback_status
        excluded_because:
          difficulty_instance: order_line_pricing_and_billback_dimensions_advance_independently
          rationale: |
            That §1.8 instance advances OrderLine.pricing_status and
            OrderLine.billback_status through disjoint transitions on the same row and
            asserts the intermediate combined state (REPRICED, RECOVERED), covering the
            independent-dimensions claim in full.


