# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Fresh Dough Facility Routing & Bakery-Cafe Replenishment
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: cafe_create_missing_credit_limit_returns_validation
        claim_type: required_fields
        grounds:
          - entities.Cafe.fields.credit_limit_cents
          - endpoints.POST_/dough-ops/cafes
        distinguishing_aspect: "credit_limit_cents has no default; omitting it is a 400 ERR_VALIDATION."
        test_recipe:
          setup: ["F1 exists"]
          setup_api_calls:
            - call: "POST /dough-ops/facilities"
              payload: { name: "F1", effective_capacity_units: 2000 }
              as: FacilityPlanner
              captures: { f1_id: $.data.id }
          trigger:
            - call: "POST /dough-ops/cafes"
              payload: { name: "C1", facility_id: "${f1_id}", ownership_type: "FRANCHISE" }
              as: FacilityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION"
            - "http status == 400"

      - name: cafe_create_invalid_ownership_enum_returns_validation
        claim_type: type_constraints
        grounds:
          - entities.Cafe.fields.ownership_type
        distinguishing_aspect: "ownership_type accepts only COMPANY | FRANCHISE; any other string is a 400."
        test_recipe:
          setup: ["F1 exists"]
          setup_api_calls:
            - call: "POST /dough-ops/facilities"
              payload: { name: "F1", effective_capacity_units: 2000 }
              as: FacilityPlanner
              captures: { f1_id: $.data.id }
          trigger:
            - call: "POST /dough-ops/cafes"
              payload: { name: "C1", facility_id: "${f1_id}", ownership_type: "PARTNER", credit_limit_cents: 90000 }
              as: FacilityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION"
            - "http status == 400"

      - name: cafe_get_not_found
        claim_type: not_found
        grounds:
          - "endpoints.GET_/dough-ops/cafes/{cafe_id}"
        distinguishing_aspect: "GET with a random UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /dough-ops/cafes/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FacilityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: dough_type_creation_applies_defaults
        claim_type: creation
        grounds:
          - entities.DoughType
        distinguishing_aspect: "POST with all required fields returns 201 with server-minted id and version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /dough-ops/dough-types"
              payload: { code: "CXL", category: "CONVENTIONAL", shelf_life_hours: 36, order_cutoff_local: "13:00", substitution_allowed: false, flat_transfer_price: 4.00 }
              as: FacilityPlanner
              captures: { cxl_id: $.data.id, cxl_v: $.data.version }
          assert:
            - "response envelope response_type == object"
            - "DoughType.${cxl_id}.version == 1"
            - "DoughType.${cxl_id}.status is absent (DoughType has no lifecycle state)"

      - name: order_list_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
          - endpoints.GET_/dough-ops/cafe-orders
        distinguishing_aspect: "list endpoints honor limit/offset and return total_count + has_more."
        test_recipe:
          setup: ["F1, CXL, C1 exist; two orders created for C1"]
          setup_api_calls:
            - call: "POST /dough-ops/facilities"
              payload: { name: "F1", effective_capacity_units: 2000 }
              as: FacilityPlanner
              captures: { f1_id: $.data.id }
            - call: "POST /dough-ops/dough-types"
              payload: { code: "CXL", category: "CONVENTIONAL", shelf_life_hours: 36, order_cutoff_local: "13:00", substitution_allowed: false, flat_transfer_price: 4.00 }
              as: FacilityPlanner
              captures: { cxl_id: $.data.id }
            - call: "POST /dough-ops/cafes"
              payload: { name: "C1", facility_id: "${f1_id}", ownership_type: "FRANCHISE", credit_limit_cents: 90000 }
              as: FacilityPlanner
              captures: { c1_id: $.data.id, c1_v: $.data.version }
            - call: "POST /dough-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T10:00:00Z" }
              as: FacilityPlanner
            - call: "POST /dough-ops/cafe-orders"
              payload: { cafe_id: "${c1_id}", dough_type_id: "${cxl_id}", production_date: "2026-09-10", quantity: 10, expected_cafe_version: "${c1_v}" }
              as: CafeManager
              as_user_id: "${c1_id}"
            - call: "GET /dough-ops/cafes/${c1_id}"
              payload: {}
              as: FacilityPlanner
              captures: { c1_v2: $.data.version }
            - call: "POST /dough-ops/cafe-orders"
              payload: { cafe_id: "${c1_id}", dough_type_id: "${cxl_id}", production_date: "2026-09-11", quantity: 20, expected_cafe_version: "${c1_v2}" }
              as: CafeManager
              as_user_id: "${c1_id}"
          trigger:
            - call: "GET /dough-ops/cafe-orders?cafe_id=${c1_id}&limit=1&offset=0"
              payload: {}
              as: FacilityPlanner
          assert:
            - "response envelope contains limit, offset, total_count, has_more"
            - "total_count == 2"
            - "has_more == true when limit=1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: submit_from_submitted_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.CafeOrder.DRAFT_to_SUBMITTED
        distinguishing_aspect: "submitting an already-SUBMITTED order is rejected; no double submission."
        test_recipe:
          setup: ["C1 order O1 is SUBMITTED"]
          setup_api_calls:
            - call: "POST /dough-ops/facilities"
              payload: { name: "F1", effective_capacity_units: 2000 }
              as: FacilityPlanner
              captures: { f1_id: $.data.id }
            - call: "POST /dough-ops/dough-types"
              payload: { code: "CXL", category: "CONVENTIONAL", shelf_life_hours: 36, order_cutoff_local: "13:00", substitution_allowed: false, flat_transfer_price: 4.00 }
              as: FacilityPlanner
              captures: { cxl_id: $.data.id }
            - call: "POST /dough-ops/cafes"
              payload: { name: "C1", facility_id: "${f1_id}", ownership_type: "FRANCHISE", credit_limit_cents: 90000 }
              as: FacilityPlanner
              captures: { c1_id: $.data.id, c1_v: $.data.version }
            - call: "POST /dough-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T10:00:00Z" }
              as: FacilityPlanner
            - call: "POST /dough-ops/cafe-orders"
              payload: { cafe_id: "${c1_id}", dough_type_id: "${cxl_id}", production_date: "2026-09-10", quantity: 10, expected_cafe_version: "${c1_v}" }
              as: CafeManager
              as_user_id: "${c1_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /dough-ops/cafe-orders/${o1_id}/submit"
              payload: {}
              as: CafeManager
              as_user_id: "${c1_id}"
          trigger:
            - call: "POST /dough-ops/cafe-orders/${o1_id}/submit"
              payload: {}
              as: CafeManager
              as_user_id: "${c1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: terminal_order_lockdown_no_further_transitions
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.CafeOrder
        distinguishing_aspect: "a CANCELLED order rejects amend, submit, and any further transition."
        test_recipe:
          setup: ["C1 order O1 created then cancelled while DRAFT"]
          setup_api_calls:
            - call: "POST /dough-ops/facilities"
              payload: { name: "F1", effective_capacity_units: 2000 }
              as: FacilityPlanner
              captures: { f1_id: $.data.id }
            - call: "POST /dough-ops/dough-types"
              payload: { code: "CXL", category: "CONVENTIONAL", shelf_life_hours: 36, order_cutoff_local: "13:00", substitution_allowed: false, flat_transfer_price: 4.00 }
              as: FacilityPlanner
              captures: { cxl_id: $.data.id }
            - call: "POST /dough-ops/cafes"
              payload: { name: "C1", facility_id: "${f1_id}", ownership_type: "FRANCHISE", credit_limit_cents: 90000 }
              as: FacilityPlanner
              captures: { c1_id: $.data.id, c1_v: $.data.version }
            - call: "POST /dough-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T10:00:00Z" }
              as: FacilityPlanner
            - call: "POST /dough-ops/cafe-orders"
              payload: { cafe_id: "${c1_id}", dough_type_id: "${cxl_id}", production_date: "2026-09-10", quantity: 10, expected_cafe_version: "${c1_v}" }
              as: CafeManager
              as_user_id: "${c1_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /dough-ops/cafe-orders/${o1_id}/cancel"
              payload: {}
              as: CafeManager
              as_user_id: "${c1_id}"
          trigger:
            - call: "POST /dough-ops/cafe-orders/${o1_id}/submit"
              payload: {}
              as: CafeManager
              as_user_id: "${c1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: schedule_open_on_wrong_date_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CafeSchedule.PLANNED_to_OPEN
        distinguishing_aspect: "open requires current cafe-local date == business_date; a day early is rejected."
        test_recipe:
          setup: ["C1 schedule for 2026-09-10 exists; clock parked at 2026-09-09T23:00Z"]
          setup_api_calls:
            - call: "POST /dough-ops/facilities"
              payload: { name: "F1", effective_capacity_units: 2000 }
              as: FacilityPlanner
              captures: { f1_id: $.data.id }
            - call: "POST /dough-ops/cafes"
              payload: { name: "C1", facility_id: "${f1_id}", ownership_type: "FRANCHISE", credit_limit_cents: 90000 }
              as: FacilityPlanner
              captures: { c1_id: $.data.id }
            - call: "POST /dough-ops/cafes/${c1_id}/schedules"
              payload: { business_date: "2026-09-10" }
              as: CafeManager
              as_user_id: "${c1_id}"
              captures: { sc_id: $.data.id }
            - call: "POST /dough-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T23:00:00Z" }
              as: FacilityPlanner
          trigger:
            - call: "POST /dough-ops/cafes/${c1_id}/schedules/${sc_id}/open"
              payload: {}
              as: CafeManager
              as_user_id: "${c1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: schedule_close_with_live_entry_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CafeSchedule.OPEN_to_CLOSED
        distinguishing_aspect: "close requires every BakeEntry terminal; an entry still PROOFING blocks close."
        test_recipe:
          setup: ["C1 delivered order O1; schedule OPEN with entry E1 in PROOFING"]
          setup_api_calls:
            - call: "POST /dough-ops/facilities"
              payload: { name: "F1", effective_capacity_units: 2000 }
              as: FacilityPlanner
              captures: { f1_id: $.data.id }
            - call: "POST /dough-ops/dough-types"
              payload: { code: "CXL", category: "CONVENTIONAL", shelf_life_hours: 36, order_cutoff_local: "13:00", substitution_allowed: false, flat_transfer_price: 4.00 }
              as: FacilityPlanner
              captures: { cxl_id: $.data.id }
            - call: "POST /dough-ops/cafes"
              payload: { name: "C1", facility_id: "${f1_id}", ownership_type: "FRANCHISE", credit_limit_cents: 90000 }
              as: FacilityPlanner
              captures: { c1_id: $.data.id, c1_v: $.data.version }
            - call: "POST /dough-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T10:00:00Z" }
              as: FacilityPlanner
            - call: "POST /dough-ops/cafe-orders"
              payload: { cafe_id: "${c1_id}", dough_type_id: "${cxl_id}", production_date: "2026-09-10", quantity: 40, expected_cafe_version: "${c1_v}" }
              as: CafeManager
              as_user_id: "${c1_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /dough-ops/cafe-orders/${o1_id}/submit"
              payload: {}
              as: CafeManager
              as_user_id: "${c1_id}"
            - call: "POST /dough-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T13:00:01Z" }
              as: FacilityPlanner
            - call: "POST /dough-ops/facilities/${f1_id}/production-plans"
              payload: { production_date: "2026-09-10" }
              as: FacilityPlanner
              captures: { p1_id: $.data.id }
            - call: "POST /dough-ops/facilities/${f1_id}/production-plans/${p1_id}/lock"
              payload: {}
              as: FacilityPlanner
            - call: "GET /dough-ops/facilities/${f1_id}"
              payload: {}
              as: FacilityPlanner
              captures: { f1_v_pre_rel: $.data.version }
            - call: "POST /dough-ops/facilities/${f1_id}/production-plans/${p1_id}/release"
              payload: { expected_facility_version: "${f1_v_pre_rel}" }
              as: FacilityPlanner
            - call: "POST /dough-ops/facilities/${f1_id}/routes"
              payload: { production_date: "2026-09-10", vehicle_capacity_units: 500 }
              as: RouteDispatcher
              captures: { r1_id: $.data.id }
            - call: "POST /dough-ops/facilities/${f1_id}/routes/${r1_id}/stops"
              payload: { seq: 1, cafe_id: "${c1_id}", planned_arrival: "2026-09-10T03:10:00Z", window_start_local: "03:00", window_end_local: "04:00", planned_units: 40 }
              as: RouteDispatcher
              captures: { s1_id: $.data.id }
            - call: "POST /dough-ops/facilities/${f1_id}/routes/${r1_id}/publish"
              payload: {}
              as: RouteDispatcher
            - call: "POST /dough-ops/facilities/${f1_id}/routes/${r1_id}/depart"
              payload: {}
              as: RouteDispatcher
            - call: "POST /dough-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T03:10:00Z" }
              as: FacilityPlanner
            - call: "POST /dough-ops/facilities/${f1_id}/routes/${r1_id}/stops/${s1_id}/arrive"
              payload: {}
              as: RouteDispatcher
            - call: "POST /dough-ops/cafes/${c1_id}/schedules"
              payload: { business_date: "2026-09-10" }
              as: CafeManager
              as_user_id: "${c1_id}"
              captures: { sc_id: $.data.id }
            - call: "POST /dough-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T04:00:00Z" }
              as: FacilityPlanner
            - call: "POST /dough-ops/cafes/${c1_id}/schedules/${sc_id}/open"
              payload: {}
              as: CafeManager
              as_user_id: "${c1_id}"
            - call: "POST /dough-ops/cafes/${c1_id}/schedules/${sc_id}/entries"
              payload: { cafe_order_id: "${o1_id}", quantity: 40, proof_start_at: "2026-09-10T04:00:00Z", proof_minutes: 90 }
              as: CafeManager
              as_user_id: "${c1_id}"
              captures: { be1_id: $.data.id }
            - call: "POST /dough-ops/cafes/${c1_id}/schedules/${sc_id}/entries/${be1_id}/start-proof"
              payload: {}
              as: CafeManager
              as_user_id: "${c1_id}"
          trigger:
            - call: "POST /dough-ops/cafes/${c1_id}/schedules/${sc_id}/close"
              payload: {}
              as: CafeManager
              as_user_id: "${c1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "http status == 409"

  # ===========================================================================
  - section: calculations
    instances:
      - name: donation_credit_rounding_and_reference_price
        claim_type: correct_result
        grounds:
          - calculations.donation_credit_calc
        distinguishing_aspect: "donation credit always prices at the CONVENTIONAL reference dough, even when the unsold units are artisan."
        test_recipe:
          setup: ["C1 schedule CLOSED for 2026-09-10 with a logged pickup: 20 conv + 8 artisan unsold; CXL flat price 4.00 is the facility's conventional reference"]
          setup_api_calls:
            - call: "POST /dough-ops/facilities"
              payload: { name: "F1", effective_capacity_units: 2000 }
              as: FacilityPlanner
              captures: { f1_id: $.data.id }
            - call: "POST /dough-ops/dough-types"
              payload: { code: "CXL", category: "CONVENTIONAL", shelf_life_hours: 36, order_cutoff_local: "13:00", substitution_allowed: false, flat_transfer_price: 4.00 }
              as: FacilityPlanner
              captures: { cxl_id: $.data.id }
            - call: "POST /dough-ops/cafes"
              payload: { name: "C1", facility_id: "${f1_id}", ownership_type: "FRANCHISE", credit_limit_cents: 90000 }
              as: FacilityPlanner
              captures: { c1_id: $.data.id }
            - call: "POST /dough-ops/cafes/${c1_id}/schedules"
              payload: { business_date: "2026-09-10" }
              as: CafeManager
              as_user_id: "${c1_id}"
              captures: { sc_id: $.data.id }
            - call: "POST /dough-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: FacilityPlanner
            - call: "POST /dough-ops/cafes/${c1_id}/schedules/${sc_id}/open"
              payload: {}
              as: CafeManager
              as_user_id: "${c1_id}"
            - call: "POST /dough-ops/cafes/${c1_id}/schedules/${sc_id}/close"
              payload: {}
              as: CafeManager
              as_user_id: "${c1_id}"
            - call: "POST /dough-ops/cafes/${c1_id}/donation-pickups"
              payload: { schedule_id: "${sc_id}", partner_name: "CityFood", unsold_conventional: 20, unsold_artisan: 8 }
              as: DonationCoordinator
              captures: { dp_id: $.data.id }
          trigger:
            - call: "POST /dough-ops/cafes/${c1_id}/donation-pickups/${dp_id}/confirm"
              payload: {}
              as: DonationCoordinator
          assert:
            - "DonationPickup.${dp_id}.credit_amount == 28.00   # (20 + 8) x 4.00 x 0.25, artisan units priced at the conventional rate"
            - "DonationPickup.${dp_id}.status == CONFIRMED"

      - name: payment_waterfall_oldest_first_partial_remainder
        claim_type: correct_result
        grounds:
          - calculations.payment_waterfall
        distinguishing_aspect: "a partial payment settles the oldest INVOICED order first and leaves the newer one INVOICED."
        test_recipe:
          setup: ["C1 has two INVOICED orders: O1 100 x 4.48 = 44800 (older), O2 93 x 4.48 = 41664 (newer); credit_balance 86464"]
          setup_api_calls:
