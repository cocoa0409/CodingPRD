            - "response.http_status == 412"

      - name: occ_version_increments_on_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.TreatmentCycle.fields.version, state_machines.TreatmentCycle.DRAFT_to_STIM]
        distinguishing_aspect: "TreatmentCycle.version starts at 1 on create and increments by 1 on each mutating transition (start-stim)."
        test_recipe:
          setup: ["A freshly created cycle (version 1) with consent for CYCLE_START."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Ver Clinic" }
