    - name: rate_benchmark_pair_is_unique_but_only_as_a_pair
      claim_type: Every error code is triggerable
      grounds:
      - validations[priority=25]
      - errors[ERR_BENCHMARK_DUPLICATE]
      - endpoints[POST /sourcing/rate-benchmarks]
      - entities.RateBenchmark
      distinguishing_aspect: 'The uniqueness key is the (destination_tier, program_type) PAIR: republishing (TIER_1, USER_CONFERENCE) with a different ADR returns HTTP 409 ERR_BENCHMARK_DUPLICATE and leaves the published 260.00 untouched, while (TIER_1, TRAINING) - the same tier, a different programme type - is accepted.'
      test_recipe:
        setup:
        - Logical clock at 2026-08-05T09:00:00.000Z throughout.
        - One RateBenchmark published for (TIER_1, USER_CONFERENCE) at 260.00 ADR.
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload: {current_utc: '2026-08-05T09:00:00.000Z'}
          as: ProgramAdmin
        - call: POST /sourcing/rate-benchmarks
          payload: {destination_tier: TIER_1, program_type: USER_CONFERENCE, benchmark_adr_usd: 260.0, benchmark_service_charge_pct: 0.24, benchmark_tax_pct: 0.156}
          as: ProgramAdmin
          captures: {bm_t1_id: $.data.id}
        trigger:
        - call: POST /sourcing/rate-benchmarks
          payload: {destination_tier: TIER_1, program_type: USER_CONFERENCE, benchmark_adr_usd: 305.0, benchmark_service_charge_pct: 0.25, benchmark_tax_pct: 0.16}
          as: ProgramAdmin
          captures: {err_dupbm: $.data.error_id}
        - call: POST /sourcing/rate-benchmarks
          payload: {destination_tier: TIER_1, program_type: TRAINING, benchmark_adr_usd: 225.0, benchmark_service_charge_pct: 0.22, benchmark_tax_pct: 0.15}
          as: ProgramAdmin
          captures: {bm_t1t_id: $.data.id}
        assert:
        - the duplicate pair returns HTTP 409 with data.error_id == ERR_BENCHMARK_DUPLICATE
        - RateBenchmark.${bm_t1_id}.benchmark_adr_usd == 260.00 (unchanged)
        - the (TIER_1, TRAINING) publication returns HTTP 201 with RateBenchmark.${bm_t1t_id}.benchmark_adr_usd == 225.00
        - GET /sourcing/rate-benchmarks?destination_tier=TIER_1 returns exactly 2 rows with total_count == 2
    - name: shortlist_entry_creation_guards_pair_uniqueness_rank_and_space
