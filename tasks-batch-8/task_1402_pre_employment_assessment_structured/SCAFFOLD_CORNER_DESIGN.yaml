            - { call: "GET /talent/sessions", payload: { interviewer_id: "${iv1}" }, as: Interviewer, as_user_id: "${iv1}" }
          assert: ["foreign filter: err == ERR_OWNERSHIP_MISMATCH", "own filter: 200, total_count == 0"]

