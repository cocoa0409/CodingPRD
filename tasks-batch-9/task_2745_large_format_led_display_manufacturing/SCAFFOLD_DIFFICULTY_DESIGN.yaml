            - "after trigger call 1: ServiceContract.${sc}.contract_state == ACTIVE and DisplayProject.${pj}.service_posture == NORMAL"
            - "after trigger call 3: ServiceContract.${sc}.spare_reserved_count == 0 and Module.${spare}.reserved_service_contract_id is null"
            - "after trigger call 3: ServiceContract.${sc}.contract_state == SUSPENDED and DisplayProject.${pj}.service_posture == AT_RISK   # 0 < spare_required_count 1"
            - "after trigger call 5: ServiceContract.${sc}.spare_reserved_count == 1 and Module.${spare}.reserved_service_contract_id == ${sc}   # conserved, exactly the post-call-1 value"
            - "after trigger call 5: ServiceContract.${sc}.contract_state == ACTIVE and DisplayProject.${pj}.service_posture == NORMAL   # no drift in the derived state either"
            - "Module.${spare}.module_state == CALIBRATED throughout the round trip"
            - "ServiceContract.${sc}.sla_breach_count == 0 and ServiceContract.${sc}.annual_fee_cents == 31943   # the round trip does not re-price the contract"
            - "${scv3} > ${scv2} > ${scv1}   # only the OCC counter is monotonic, never restored"

      - name: burn_in_schedule_and_abort_conserve_chamber_reserved_slots
        grounds:
          - state_machines.Cabinet.POPULATED_to_BURN_IN
          - state_machines.Cabinet.BURN_IN_to_POPULATED
          - state_machines.BurnInRun.SCHEDULED_to_ABORTED
          - entities.BurnInChamber.fields.reserved_slot_total
          - entities.BurnInChamber.fields.scheduled_run_count
        distinguishing_aspect: |
          A different conserved quantity on a different aggregate:
          BurnInChamber.reserved_slot_total and scheduled_run_count, paired with
          Cabinet.cabinet_state. Scheduling reserves 3 of 4 slots and pushes the
          cabinet into BURN_IN; aborting must give back exactly 3 slots, exactly
          1 run count and exactly the POPULATED state, so that an identical
          re-schedule is possible. The compensation must be exact — 2 or 4 slots
          returned would leave the chamber permanently mis-booked.
        test_recipe:
          setup:
            - "FP10-IN display model (burn_in_hours_required 24, max_drive_pct 90)."
            - "A 1x1 RETAIL project, engineering APPROVED, whose cabinet is POPULATED."
            - "Chamber CH-1 with slot_capacity 4, turnaround_minutes 60, reserved_slot_total 0, scheduled_run_count 0."
