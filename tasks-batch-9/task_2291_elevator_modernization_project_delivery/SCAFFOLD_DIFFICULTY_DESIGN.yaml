  - rule_id: cross_entity_state_dependency
    instances:
      - name: outage_activation_depends_on_elevator_group_service_floor
        grounds:
          - validations[priority=12]
          - errors.ERR_GROUP_SERVICE_FLOOR
          - entities.ElevatorGroup.fields.min_cars_in_service
          - entities.ElevatorGroup.fields.cars_in_service
          - state_machines.OutageWindow.PLANNED_to_ACTIVE
        distinguishing_aspect: |
          Whether an OutageWindow may activate is decided by the state of a DIFFERENT entity, the
          ElevatorGroup: with three cars and min_cars_in_service 2 the first activation succeeds
          (cars_in_service 2) and the second is rejected (it would leave 1), even though the window
          itself is impeccably PLANNED, noticed, unexpired and inside the concurrency cap. Entity
          pair: OutageWindow depends on ElevatorGroup.
        test_recipe:
          setup:
            - "One jurisdiction that arms no code triggers; one project with max_concurrent_outages 3 and outage_buffer_hours 4."
            - "One group with min_cars_in_service 2 holding three cars; cars 1 and 2 are in work_status PROCURING under APPROVED ScopeOptions, car 3 is still SURVEY_PENDING and therefore counts as in service."
            - "Two PLANNED OutageWindows well outside each other's buffer: w1 on car 1 over 2026-08-10T08:00:00Z..2026-08-12T18:00:00Z and w2 on car 2 over 2026-08-20T08:00:00Z..2026-08-22T18:00:00Z, both already noticed at 2026-08-01T00:00:00Z."
            - "w1 is ACTIVE, so cars_in_service is 2 and active_outage_count is 1."
            - "Logical clock at 2026-08-20T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
