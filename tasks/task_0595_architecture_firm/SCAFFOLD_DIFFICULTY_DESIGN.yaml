  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: change_order_execute_cascades_contract_fee_to_phase_allocation_to_earned_to_wip
        grounds:
          - state_machines.ChangeOrder.CLIENT_APPROVED_to_EXECUTED
          - calculations.phase_fee_allocation
          - calculations.contract_fee_earned
          - entities.Contract.fields.wip_balance_cents
          - entities.Phase.fields.fee_allocation_cents
        distinguishing_aspect: |
          Depth-4 cascade originating at ChangeOrder CLIENT_APPROVED -> EXECUTED: (1) the
          execution rewrites Contract.total_fee_cents 10000000 -> 12000000; (2) BECAUSE
          total_fee_cents moved, phase_fee_allocation re-runs and SD's fee_allocation_cents moves
          2000000 -> 2400000; (3) BECAUSE SD's allocation moved, SD.earned_cents (at
          percent_complete 100) moves 2000000 -> 2400000; (4) BECAUSE SD.earned_cents moved,
          Contract.earned_to_date_cents and wip_balance_cents both move to 2400000. Each link is
          caused by the previous one, not by the original request.
