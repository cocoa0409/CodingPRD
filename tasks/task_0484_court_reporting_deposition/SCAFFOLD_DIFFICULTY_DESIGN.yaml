              payload: {}
              as: Reporter
              as_user_id: "${rep_ff_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: half_open_overlap_on_any_resource_kind
        grounds:
          - validations[priority=11]
          - endpoints["POST /jobs/{id}/assignments"]
          - errors[ERR_RESOURCE_DOUBLE_BOOKED]
        distinguishing_aspect: |
          The generic double-booking rule uses half-open [start,end) geometry: a videographer
          on job 09:00..12:00 CANNOT take an overlapping job 11:00..13:00 (intervals intersect),
          but touching endpoints (a job ending exactly 12:00 vs one starting 12:00) do NOT
          overlap. This is plain interval intersection on the VIDEOGRAPHER resource.
        test_recipe:
          setup:
            - "A videographer is ACTIVE on job J1 09:00..12:00. A second job J2 11:00..13:00 exists; assigning the same videographer to J2 is attempted."
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "A Fifteen", firm_name: "F15 LLP", bar_state: "CA", email: "a15@x.com" }
              as: ScheduleCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /cases"
              payload: { caption: "Phi v Omic", docket_number: "D-1015", jurisdiction: "STATE_CA", noticing_attorney_id: "${att_id}" }
              as: ScheduleCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /resources"
              payload: { full_name: "Vid B", kind: "VIDEOGRAPHER", hourly_appearance_cents: 8000 }
              as: ScheduleCoordinator
              captures: { vid_id: $.data.id }
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "Witness W5", scheduled_start: "2026-06-15T09:00:00Z", scheduled_end: "2026-06-15T12:00:00Z", requires_videographer: true }
              as: ScheduleCoordinator
              captures: { j1_id: $.data.id, j1_v0: $.data.version }
            - call: "POST /jobs/${j1_id}/assignments"
              payload: { resource_id: "${vid_id}", role: "VIDEOGRAPHER", expected_job_version: "${j1_v0}" }
              as: ScheduleCoordinator
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "Witness W6", scheduled_start: "2026-06-15T11:00:00Z", scheduled_end: "2026-06-15T13:00:00Z", requires_videographer: true }
              as: ScheduleCoordinator
              captures: { j2_id: $.data.id, j2_v0: $.data.version }
          trigger:
            - call: "POST /jobs/${j2_id}/assignments"
              payload: { resource_id: "${vid_id}", role: "VIDEOGRAPHER", expected_job_version: "${j2_v0}" }
              as: ScheduleCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_RESOURCE_DOUBLE_BOOKED"

      - name: reporter_buffer_interval_semantics_distinct_from_plain_overlap
        grounds:
          - validations[priority=12]
          - endpoints["POST /jobs/{id}/assignments"]
          - errors[ERR_REPORTER_BUFFER_CONFLICT]
        distinguishing_aspect: |
          REPORTER overlap uses BUFFERED-interval geometry, not plain intersection: two
          non-overlapping reporter jobs (one ends 12:00, next starts 12:15) are still rejected
          because the 15-min gap is under the 30-min travel buffer — a stricter interval
          semantics than the videographer's plain half-open intersection, and on a different
          resource entity (REPORTER vs VIDEOGRAPHER).
        test_recipe:
          setup:
            - "A reporter is ACTIVE on job J1 09:00..12:00. A second job J2 12:15..14:00 (15-min gap, no raw overlap) exists; assigning the same reporter to J2 is attempted."
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "A Sixteen", firm_name: "F16 LLP", bar_state: "CA", email: "a16@x.com" }
              as: ScheduleCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /cases"
              payload: { caption: "Chi v Pi", docket_number: "D-1016", jurisdiction: "STATE_CA", noticing_attorney_id: "${att_id}" }
              as: ScheduleCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /resources"
              payload: { full_name: "Rep GG", kind: "REPORTER", certifications: ["CSR_CA"], hourly_appearance_cents: 10000 }
              as: ScheduleCoordinator
              captures: { rep_id: $.data.id }
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "Witness W7", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T12:00:00Z" }
              as: ScheduleCoordinator
              captures: { j1_id: $.data.id, j1_v0: $.data.version }
            - call: "POST /jobs/${j1_id}/assignments"
              payload: { resource_id: "${rep_id}", role: "REPORTER", expected_job_version: "${j1_v0}" }
              as: ScheduleCoordinator
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "Witness W8", scheduled_start: "2026-06-16T12:15:00Z", scheduled_end: "2026-06-16T14:00:00Z" }
              as: ScheduleCoordinator
              captures: { j2_id: $.data.id, j2_v0: $.data.version }
          trigger:
            - call: "POST /jobs/${j2_id}/assignments"
              payload: { resource_id: "${rep_id}", role: "REPORTER", expected_job_version: "${j2_v0}" }
              as: ScheduleCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_REPORTER_BUFFER_CONFLICT"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: release_then_reassign_conserves_reporter_role_count
        grounds:
          - state_machines.Assignment.ACTIVE_to_RELEASED
          - endpoints["POST /jobs/{id}/assignments"]
          - calculations.compute_staffing_posture
          - entities.Job.fields.staffing_posture
        distinguishing_aspect: |
          Conserved quantity = count of ACTIVE REPORTER assignments per job, pinned as
          COUNT(Assignment where job_id==J and role==REPORTER and status==ACTIVE), which must
          equal 1 both before a release and after the compensating re-assignment of a new
          reporter. Releasing then re-assigning leaves that count and staffing_posture==READY
          unchanged (no drift).
        test_recipe:
          setup:
            - "A NOTICED job with one ACTIVE reporter (Rep HH) assignment (posture READY for a reporter-only job). A second reporter (Rep II) exists for re-assignment."
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "A Seventeen", firm_name: "F17 LLP", bar_state: "CA", email: "a17@x.com" }
              as: ScheduleCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /cases"
              payload: { caption: "Psi v Rho", docket_number: "D-1017", jurisdiction: "STATE_CA", noticing_attorney_id: "${att_id}" }
              as: ScheduleCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /resources"
              payload: { full_name: "Rep HH", kind: "REPORTER", certifications: ["CSR_CA"], hourly_appearance_cents: 10000 }
              as: ScheduleCoordinator
              captures: { rep_hh_id: $.data.id }
            - call: "POST /resources"
              payload: { full_name: "Rep II", kind: "REPORTER", certifications: ["CSR_CA"], hourly_appearance_cents: 10000 }
              as: ScheduleCoordinator
              captures: { rep_ii_id: $.data.id }
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "Witness W9", scheduled_start: "2026-06-17T09:00:00Z", scheduled_end: "2026-06-17T11:00:00Z" }
              as: ScheduleCoordinator
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /jobs/${job_id}/assignments"
              payload: { resource_id: "${rep_hh_id}", role: "REPORTER", expected_job_version: "${job_v0}" }
              as: ScheduleCoordinator
              captures: { asg_hh_id: $.data.id }
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ScheduleCoordinator
              captures: { job_v1: $.data.version }
          trigger:
            - call: "POST /assignments/${asg_hh_id}/release"
              payload: {}
              as: ScheduleCoordinator
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ScheduleCoordinator
              captures: { job_v2: $.data.version }
            - call: "POST /jobs/${job_id}/assignments"
              payload: { resource_id: "${rep_ii_id}", role: "REPORTER", expected_job_version: "${job_v2}" }
              as: ScheduleCoordinator
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ScheduleCoordinator
          assert:
            - "Job.${job_id}.staffing_posture == READY"
            - "count(GET /jobs/${job_id}/assignments?status=ACTIVE where role==REPORTER) == 1"

      - name: void_then_recreate_conserves_invoice_total_cents
        grounds:
          - state_machines.Invoice.ISSUED_to_VOID
          - state_machines.Invoice.DRAFT_to_ISSUED
          - calculations.compute_invoice_total
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Conserved quantity = billed amount for the (job, transcript) pair, pinned as
          appearance_subtotal + page_subtotal + exhibit_subtotal. Voiding an issued invoice
          and creating+issuing a fresh one for the SAME job/transcript yields an identical
          total_cents (70625 for the TX EXPEDITE_14 60-page no-exhibit scenario) — a different
          conserved quantity (monetary total) than the reporter-role count invariant.
        test_recipe:
          setup:
            - "A delivered STATE_TX transcript (EXPEDITE_14, 60 final pages, no exhibits) on a job whose 2h session billed a reporter @15000 and videographer @8000; an issued invoice exists with total 70625."
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "A Eighteen", firm_name: "F18 LLP", bar_state: "TX", email: "a18@x.com" }
              as: ScheduleCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /cases"
