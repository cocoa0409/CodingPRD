      - name: temporal_bounds_and_future_period_end_rejected_with_bounds_winning_when_both_fail
        claim_type: priority_ordering
        grounds:
          - validations[priority=75]
          - validations[priority=76]
          - errors.ERR_PERIOD_BOUNDS_INVALID
          - errors.ERR_PERIOD_END_IN_FUTURE
        distinguishing_aspect: |
          Equal bounds are invalid because period_end must be STRICTLY after period_start, the
          same predicate governs scheduled_end_at on TA engagements, and a window ending after
          the logical clock is a distinct 422. When a request violates both - period_start
          2026-10-05 with period_end 2026-10-01 while the clock reads 2026-09-01 - the lower
          priority number wins and the response must be ERR_PERIOD_BOUNDS_INVALID.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One institution and one borrower."
          setup_api_calls:
            - call: "POST /cdfi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Harborline Community Fund", ein: "210000029", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 250000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
