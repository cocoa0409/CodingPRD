  - section: errors
    instances:
      - name: err_stale_version_triggered_by_occ_mismatch
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STALE_VERSION]
          - concurrency_rules[proposal-submit-stale-capseason]
        distinguishing_aspect: "Proposal submit with stale expected_cap_season_version returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["DRAFT proposal exists; client read CapSeason at version V; another writer then bumped version (via an unrelated proposal submit)"]
          setup_api_calls:
            - call: "POST /teams"
              payload: { name: "OCCT", league_code: "NBA" }
              as: LeagueOfficer
              captures: { team_id: $.data.id }
            - call: "POST /teams/${team_id}/cap_seasons"
              payload: { season_year: 2026, cap_limit_cents: 500000000, luxury_threshold_cents: 600000000 }
