# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 1276 — Subcontractor Buyout & Contract Award
#
# Breadth probe: enumerates every testable claim the §1.1–§1.7 surface declares
# that §1.8 does not already cover. Sections and claim_type values follow
# references/claim-extraction-guide.md. Corners already exercised as the
# failure path of a §1.8 difficulty instance are emitted as excluded_because
# stubs (no test_recipe).
#
# Chain conventions (identical to §1.8): default clock 2026-05-01T00:00:00Z;
# ${proj_v} captured from the latest Project-mutating response feeds
# expected_project_version; WAIVED bonding unless the instance exercises bonds;
# CO creators use as_user_id "bl-1", approvers "pm-1"/"om-1".
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section 1 — Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: project_create_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Project.fields.status, entities.Project.fields.current_time_utc]
        distinguishing_aspect: "Client-supplied status/id on POST /projects are ignored: server pins status=SETUP, clock=2026-05-01T00:00:00Z, version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { name: "P-E1", project_number: "E1", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05, status: "BUYOUT_OPEN", id: "11111111-2222-4333-8444-555555555555" }
              as: GCAdmin
              captures: { p_status: $.data.status, p_clock: $.data.current_time_utc, p_v: $.data.version, p_id: $.data.id }
          assert:
            - "p_status == SETUP (client-supplied status ignored)"
            - "p_clock == '2026-05-01T00:00:00Z' (mandatory default logical clock)"
            - "p_v == 1"
            - "p_id != '11111111-2222-4333-8444-555555555555' (server mints its own UUID)"

      - name: project_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but nonexistent project id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /projects/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: GCAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND and HTTP status == 404"

      - name: trade_package_create_defaults
        claim_type: defaults
        grounds: [entities.TradePackage.fields.awarded_value_cents, entities.TradePackage.fields.buyout_posture]
        distinguishing_aspect: "A freshly created package is DRAFT with awarded_value_cents=0, buyout_savings_cents == estimated_budget_cents, posture FAVORABLE (savings 5000000 >= target 250000), version 1."
        test_recipe:
          setup: ["project opened"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-E3", project_number: "E3", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/open"
              as: GCAdmin
              captures: { proj_v: $.data.version }
          trigger:
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "E3-26", title: "Mechanical", estimated_budget_cents: 5000000, budgeted_contingency_cents: 0, spec_section: "23 00 00", bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_status: $.data.status, tp_awarded: $.data.awarded_value_cents, tp_savings: $.data.buyout_savings_cents, tp_posture: $.data.buyout_posture, tp_v: $.data.version }
          assert:
            - "tp_status == DRAFT and tp_v == 1"
            - "tp_awarded == 0 and tp_savings == 5000000"
            - "tp_posture == FAVORABLE (5000000 >= round_half_up(0.05 * 5000000) == 250000)"

      - name: package_create_invalid_bonding_policy_rejected
        claim_type: type_constraints
        grounds:
          - "entities.TradePackage.fields.bonding_policy"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "bonding_policy outside {REQUIRED, PER_TRADE_RISK, WAIVED} is rejected 422 ERR_VALIDATION."
        test_recipe:
          setup: ["project opened"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-E4", project_number: "E4", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/open"
              as: GCAdmin
              captures: { proj_v: $.data.version }
          trigger:
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "E4-26", title: "Mechanical", estimated_budget_cents: 5000000, budgeted_contingency_cents: 0, bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "MAYBE", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION and HTTP status == 422"

      - name: subcontract_create_initializes_derived_fields
        claim_type: computed_fields
        grounds: [entities.Subcontract.fields.insurance_status, entities.Subcontract.fields.bonding_requirement, entities.Subcontract.fields.negotiation_round]
        distinguishing_aspect: "New subcontract: status DRAFT, contract_value_cents 0, negotiation_round 0, insurance_status MISSING, sov_status DRAFT, bonding_requirement NOT_REQUIRED under WAIVED policy."
        test_recipe:
          setup: ["package UNDER_LEVELING with 2 bids, 1 withdrawn"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-E5", project_number: "E5", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/open"
              as: GCAdmin
              captures: { proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "E5-26", title: "Mechanical", estimated_budget_cents: 10000000, budgeted_contingency_cents: 0, bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_id: $.data.id }
            - call: "POST /trade-packages/${tp_id}/publish"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "A1", contact_email: "a1@x.com", base_bid_cents: 9000000, bid_received_at: "2026-05-15T12:00:00Z" }
              as: BuyoutLead
              captures: { bid_1: $.data.id }
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "A2", contact_email: "a2@x.com", base_bid_cents: 9100000, bid_received_at: "2026-05-15T13:00:00Z" }
              as: BuyoutLead
              captures: { bid_2: $.data.id }
            - call: "POST /trade-packages/${tp_id}/close-bidding"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids/${bid_2}/withdraw"
              as: BuyoutLead
          trigger:
            - call: "POST /trade-packages/${tp_id}/subcontracts"
              payload: { subcontractor_name: "A1", source_bid_id: "${bid_1}", flow_down_terms: "fd", payment_terms: { retainage_pct: 0.10, pay_if_paid: true }, change_authority_limits: [{ max_value_cents: -1, max_cumulative_pct: -1, roles: ["OperationsManager"] }] }
              as: BuyoutLead
              captures: { s_status: $.data.status, s_val: $.data.contract_value_cents, s_round: $.data.negotiation_round, s_ins: $.data.insurance_status, s_sov: $.data.sov_status, s_bond: $.data.bonding_requirement }
          assert:
            - "s_status == DRAFT and s_val == 0 and s_round == 0"
            - "s_ins == MISSING and s_sov == DRAFT"
            - "s_bond == NOT_REQUIRED (WAIVED policy initializes the requirement without a BondDecision)"

      - name: negotiation_round_rows_immutable_no_version
        claim_type: immutability
        grounds: [entities.NegotiationRound, state_machines.Subcontract.DRAFT_to_PENDING_AWARD]
        distinguishing_aspect: "NegotiationRound has common_fields=false: rows carry id + created_at + recorded_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["one recommend-award completed, producing round_index 1"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-E6", project_number: "E6", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/open"
              as: GCAdmin
              captures: { proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "E6-26", title: "Mechanical", estimated_budget_cents: 10000000, budgeted_contingency_cents: 0, bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_id: $.data.id }
            - call: "POST /trade-packages/${tp_id}/publish"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "B1", contact_email: "b1@x.com", base_bid_cents: 9000000, bid_received_at: "2026-05-15T12:00:00Z" }
              as: BuyoutLead
              captures: { bid_1: $.data.id }
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "B2", contact_email: "b2@x.com", base_bid_cents: 9100000, bid_received_at: "2026-05-15T13:00:00Z" }
              as: BuyoutLead
              captures: { bid_2: $.data.id }
            - call: "POST /trade-packages/${tp_id}/close-bidding"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids/${bid_2}/withdraw"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/subcontracts"
              payload: { subcontractor_name: "B1", source_bid_id: "${bid_1}", flow_down_terms: "fd", payment_terms: { retainage_pct: 0.10, pay_if_paid: true }, change_authority_limits: [{ max_value_cents: -1, max_cumulative_pct: -1, roles: ["OperationsManager"] }] }
              as: BuyoutLead
              captures: { sub_id: $.data.id }
            - call: "POST /subcontracts/${sub_id}/recommend-award"
              payload: { contract_value_cents: 9000000 }
              as: BuyoutLead
          trigger:
            - call: "GET /subcontracts/${sub_id}/negotiation-rounds"
              as: BuyoutLead
              captures: { r_idx: "$.data[0].round_index", r_val: "$.data[0].proposed_value_cents", r_at: "$.data[0].recorded_at" }
          assert:
            - "r_idx == 1 and r_val == 9000000"
            - "r_at == project clock '2026-05-01T00:00:00Z'"
            - "rows carry id and created_at but no version or updated_at key (common_fields: false)"

      - name: project_create_missing_required_returns_validation
        claim_type: required_fields
        grounds:
          - "errors[ERR_VALIDATION]"
          - "endpoints.\"POST /projects"
        distinguishing_aspect: "Omitting required project_number yields 422 ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { name: "P-E7", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION and HTTP status == 422"

  # ===========================================================================
  # Section 2 — State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: close_bidding_without_bids_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.TradePackage.PUBLISHED_to_UNDER_LEVELING"
          - "errors[ERR_NO_BIDS_RECEIVED]"
        distinguishing_aspect: "close-bidding on a package with zero PLACED bids fails with ERR_NO_BIDS_RECEIVED; package stays PUBLISHED."
        test_recipe:
          setup: ["package PUBLISHED, no bids"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-S1", project_number: "S1", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/open"
              as: GCAdmin
              captures: { proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "S1-26", title: "Mechanical", estimated_budget_cents: 10000000, budgeted_contingency_cents: 0, bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_id: $.data.id }
            - call: "POST /trade-packages/${tp_id}/publish"
              as: BuyoutLead
          trigger:
            - call: "POST /trade-packages/${tp_id}/close-bidding"
              as: BuyoutLead
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NO_BIDS_RECEIVED"
            - "TradePackage.${tp_id}.status == PUBLISHED (no drift)"

      - name: withdraw_already_withdrawn_bid_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Bid.PLACED_to_WITHDRAWN"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "Second withdraw on a WITHDRAWN bid fails with ERR_INVALID_STATE_TRANSITION (withdraw is not idempotent)."
        test_recipe:
          setup: ["one bid already WITHDRAWN"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-S2", project_number: "S2", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/open"
              as: GCAdmin
              captures: { proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "S2-26", title: "Mechanical", estimated_budget_cents: 10000000, budgeted_contingency_cents: 0, bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_id: $.data.id }
            - call: "POST /trade-packages/${tp_id}/publish"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "C1", contact_email: "c1@x.com", base_bid_cents: 9000000, bid_received_at: "2026-05-15T12:00:00Z" }
              as: BuyoutLead
              captures: { bid_1: $.data.id }
            - call: "POST /trade-packages/${tp_id}/bids/${bid_1}/withdraw"
              as: BuyoutLead
          trigger:
            - call: "POST /trade-packages/${tp_id}/bids/${bid_1}/withdraw"
              as: BuyoutLead
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION (WITHDRAWN is not a valid from-state for withdraw)"

      - name: issue_from_draft_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Subcontract.AWARDED_to_ISSUED"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "issue on a DRAFT subcontract fails with ERR_INVALID_STATE_TRANSITION — the pipeline cannot skip recommend/award."
        test_recipe:
          setup: ["subcontract DRAFT"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-S3", project_number: "S3", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/open"
              as: GCAdmin
              captures: { proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "S3-26", title: "Mechanical", estimated_budget_cents: 10000000, budgeted_contingency_cents: 0, bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_id: $.data.id }
            - call: "POST /trade-packages/${tp_id}/publish"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "D1", contact_email: "d1@x.com", base_bid_cents: 9000000, bid_received_at: "2026-05-15T12:00:00Z" }
              as: BuyoutLead
              captures: { bid_1: $.data.id }
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "D2", contact_email: "d2@x.com", base_bid_cents: 9100000, bid_received_at: "2026-05-15T13:00:00Z" }
              as: BuyoutLead
              captures: { bid_2: $.data.id }
            - call: "POST /trade-packages/${tp_id}/close-bidding"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids/${bid_2}/withdraw"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/subcontracts"
              payload: { subcontractor_name: "D1", source_bid_id: "${bid_1}", flow_down_terms: "fd", payment_terms: { retainage_pct: 0.10, pay_if_paid: true }, change_authority_limits: [{ max_value_cents: -1, max_cumulative_pct: -1, roles: ["OperationsManager"] }] }
              as: BuyoutLead
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /subcontracts/${sub_id}/issue"
              as: BuyoutLead
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION"

      - name: execute_from_awarded_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Subcontract.ISSUED_to_EXECUTED"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "execute on an AWARDED subcontract (issue skipped) fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["subcontract AWARDED (no insurance, WAIVED bond)"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-S4", project_number: "S4", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/open"
              as: GCAdmin
              captures: { proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "S4-26", title: "Mechanical", estimated_budget_cents: 10000000, budgeted_contingency_cents: 0, bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_id: $.data.id }
            - call: "POST /trade-packages/${tp_id}/publish"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "E1", contact_email: "e1@x.com", base_bid_cents: 9000000, bid_received_at: "2026-05-15T12:00:00Z" }
              as: BuyoutLead
              captures: { bid_1: $.data.id }
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "E2", contact_email: "e2@x.com", base_bid_cents: 9100000, bid_received_at: "2026-05-15T13:00:00Z" }
              as: BuyoutLead
              captures: { bid_2: $.data.id }
            - call: "POST /trade-packages/${tp_id}/close-bidding"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids/${bid_2}/withdraw"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/subcontracts"
              payload: { subcontractor_name: "E1", source_bid_id: "${bid_1}", flow_down_terms: "fd", payment_terms: { retainage_pct: 0.10, pay_if_paid: true }, change_authority_limits: [{ max_value_cents: -1, max_cumulative_pct: -1, roles: ["OperationsManager"] }] }
              as: BuyoutLead
              captures: { sub_id: $.data.id }
            - call: "POST /subcontracts/${sub_id}/recommend-award"
              payload: { contract_value_cents: 9000000 }
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_id}/award"
              as: OperationsManager
          trigger:
            - call: "POST /subcontracts/${sub_id}/execute"
              as: BuyoutLead
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION (AWARDED is not a from-state for execute)"

      - name: declare_default_with_approved_sov_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Subcontract.EXECUTED_to_DEFAULTED"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "declare-default on an EXECUTED subcontract whose SOV is APPROVED fails with ERR_INVALID_STATE_TRANSITION — the default path is closed once payment terms are locked; replacement is the cure."
        test_recipe:
          setup: ["subcontract EXECUTED with SOV APPROVED"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-S5", project_number: "S5", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/open"
              as: GCAdmin
              captures: { proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "S5-26", title: "Mechanical", estimated_budget_cents: 10000000, budgeted_contingency_cents: 0, bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_id: $.data.id }
            - call: "POST /trade-packages/${tp_id}/publish"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "F1", contact_email: "f1@x.com", base_bid_cents: 9000000, bid_received_at: "2026-05-15T12:00:00Z" }
              as: BuyoutLead
              captures: { bid_1: $.data.id }
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "F2", contact_email: "f2@x.com", base_bid_cents: 9100000, bid_received_at: "2026-05-15T13:00:00Z" }
              as: BuyoutLead
              captures: { bid_2: $.data.id }
            - call: "POST /trade-packages/${tp_id}/close-bidding"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids/${bid_2}/withdraw"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/subcontracts"
              payload: { subcontractor_name: "F1", source_bid_id: "${bid_1}", flow_down_terms: "fd", payment_terms: { retainage_pct: 0.10, pay_if_paid: true }, change_authority_limits: [{ max_value_cents: -1, max_cumulative_pct: -1, roles: ["OperationsManager"] }] }
              as: BuyoutLead
              captures: { sub_id: $.data.id }
            - call: "POST /subcontracts/${sub_id}/recommend-award"
              payload: { contract_value_cents: 9000000 }
              as: BuyoutLead
