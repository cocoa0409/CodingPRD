  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: ppvc_state_before_double_booking
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_DOUBLE_BOOKING]
        distinguishing_aspect: |
          Error-category pair state (priority 5) vs business_temporal (priority 11): a grant call on a
          permit already in a terminal state (DENIED) that ALSO overlaps a granted permit returns
          ERR_INVALID_STATE (409, the higher-priority state check), not ERR_DOUBLE_BOOKING.
        test_recipe:
          setup:
            - "P1 GRANTED on a window. P2 overlaps and is first DENIED (terminal). Then grant P2 again."
            - "P2 fails state precondition (not APPLIED/WAITLISTED) before any double-booking check runs."
