              captures: { a4: $.data.available_kg, r4: $.data.reserved_kg, c4: $.data.consumed_kg, st4: $.data.status }
            - call: "POST /molding-cycles/${cyc1}/abort"
              payload: { abort_reason: "OPERATOR_STOPPED_MID_CYCLE" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc1_status: $.data.status }
            - call: "GET /resin-lots/${lot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { a5: $.data.available_kg, r5: $.data.reserved_kg, c5: $.data.consumed_kg, st5: $.data.status }
            - call: "GET /resin-charges/${ch1}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
          assert:
            - "CHECKPOINT 1 after the first reserve: ${a1} == 24.000, ${r1} == 24.000, ${c1} == 0.000, and 24.000 + 24.000 + 0.000 == 48.000 == received_kg"
            - "ResinCharge.${ch1}.virgin_kg == 21.600 and ResinCharge.${ch1}.charge_regrind_pct == 10.00   (2.400 / 24.000 * 100)"
            - "the second reserve is ACCEPTED because the gate is available_kg >= charge_kg and 24.000 >= 24.000 is an equality — draining the lot to exactly 0.000 is legal"
            - "CHECKPOINT 2 after the second reserve: ${a2} == 0.000, ${r2} == 48.000, ${c2} == 0.000, sum 48.000, and ${st2} == DEPLETED (the lot depletes at exactly 0.000, not at 0.001)"
            - "CHECKPOINT 3 after releasing ${ch2}: ${a3} == 24.000, ${r3} == 24.000, ${c3} == 0.000, sum 48.000 — the COMPENSATING move returned the reservation exactly, and ${st3} == AVAILABLE because available_kg rose above 0.000"
            - "${ch2_reason} == CYCLE_ABORTED   (the default released_reason when the request body omits it)"
            - "the release is sequenced BEFORE start-oven on purpose: start-oven requires every referenced ResinLot to be AVAILABLE, so a DEPLETED lot would have failed with ERR_RESIN_LOT_NOT_AVAILABLE instead of consuming"
            - "CHECKPOINT 4 after start-oven: ${a4} == 24.000, ${r4} == 0.000, ${c4} == 24.000, sum 48.000 — mass moved from reserved to consumed with nothing created or destroyed, and ${st4} == AVAILABLE"
            - "ResinCharge.${ch1}.status == CONSUMED and MoldingCycle.${cyc1}.status was OVEN_RUNNING before the abort"
            - "CHECKPOINT 5 after aborting from OVEN_RUNNING: ${a5} == 24.000, ${r5} == 0.000, ${c5} == 24.000, sum still 48.000, ${st5} == AVAILABLE — the invariant HOLDS but nothing was returned"
            - "${cyc1_status} == ABORTED and ResinCharge.${ch1}.status is still CONSUMED: consumed_kg is never decremented, so the compensating move is asymmetric — aborting from SCHEDULED would have restored the full 24.000 kg, aborting from OVEN_RUNNING restores nothing"
            - "MoldingCycle.${cyc2}.status is still SCHEDULED with no participating charge, so the abort touched only cyc1's ledger rows"

      - name: warranty_reserve_ledger_conserved_across_approve_and_void
        grounds:
          - calculations.warranty_reserve_ledger
          - calculations.warranty_payout
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_APPROVED
          - state_machines.WarrantyClaim.APPROVED_to_VOIDED
          - concurrency_rules[claim-approve-stale-product-model]
          - validations[priority=76]
          - errors.ERR_WARRANTY_RESERVE_EXHAUSTED
        distinguishing_aspect: |
          The conserved quantity is MONEY in integer cents held in a two-bucket ledger,
          warranty_reserve_cents + warranty_paid_cents == initial_warranty_reserve_cents, and unlike
          the resin ledger its compensating move is an EXACT reversal: voiding an approved claim moves
          the identical integer back, restores the pre-approval headroom, and yet deliberately RETAINS
          the claim's money fields as the audit record instead of zeroing them.
        test_recipe:
          setup:
            - "ProductModel PM-X9B-KM: KAYAK/MID, msrp_cents 180000, warranty_basis PRO_RATA_AGE, initial_warranty_reserve_cents 500000, gross_cube_m3 2.0000, nest_factor 0.5000, unit_weight_kg 24.000, nominal_charge_kg 24.000, charge_tolerance_pct 5.00, min_cooling_minutes 30. At creation warranty_reserve_cents == 500000 and warranty_paid_cents == 0."
            - "Single-cavity Mold MLD-X9B-1 (nominal_charge_kg 24.000, service_interval_cycles 10); OvenStation OV-X9B (arm_count 2, changeover_buffer_min 15, max_size_class OVERSIZE); CoolingBay CB-X9B (concurrent_slot_capacity 2, FORCED_AIR)."
            - "Four distinct ACTIVE Technicians T-X9B-RES / T-X9B-OPR / T-X9B-ASM / T-X9B-QCI (§1.4 priority 57)."
            - "Warehouse WH-X9B 20.0000 in one zone Z-A, so the single stored hull leaves the site at utilization_pct 10.00 and posture NORMAL — POST /shipments is therefore never refused with ERR_WAREHOUSE_POSTURE_RESTRICTED."
            - "Customer CUS-X9B (region_code Z1) is ACTIVE and has storage_guidance_acknowledged_at set to 2026-08-01T00:00:00Z, which is EARLIER than the hull's delivered_at, satisfying §1.4 priority 56 with room to spare."
            - "Qualified ResinLot LOT-X9B received_kg 500.000, expires_on 2027-12-31."
            - "ProductionOrder PO-X9B (ordered_qty 1, no demand_bucket_id) released; one cycle ran 09:00 / 10:00 / 10:35 producing hull PO-X9B-01-0001, which was trimmed, outfitted and inspected PASS to SELLABLE, so the order reached COMPLETE."
            - "That hull was stored at clock 11:00, loaded onto Shipment SHP-X9B (destination_zone Z1, carrier CAR-X9B, trailer_cube_capacity_m3 3.0000, trailer_max_payload_kg 500.000), sealed at 11:30 with cube_utilization_pct 66.67, departed at 12:00 and DELIVERED at 2026-08-02T00:00:00Z — so FinishedUnit.delivered_at == 2026-08-02T00:00:00Z, the warranty clock origin."
            - "The logical clock is then advanced to 2027-02-02T00:00:00Z, exactly 6 complete calendar months after delivery, so months_in_service == 6 and 6 <= WARRANTY_TERM_MONTHS 60 (§1.4 priority 64 is satisfied, not triggered)."
            - "A HULL_DEFORMATION WarrantyClaim CLM-X9B with reported_deformation_mm 5.00 (well above the 3.00 mm floor of §1.4 priority 27) is filed, moved UNDER_REVIEW, and given a storage review with outcome VERIFIED so storage_review_status is GUIDANCE_VERIFIED and the storage deduction will be 0."
