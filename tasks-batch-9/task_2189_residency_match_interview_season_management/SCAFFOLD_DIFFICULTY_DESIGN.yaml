# =============================================================================
# 1.8 Scaffold Difficulty Design — Test Targeting Index
# residency-match-season
#
# Every instance grounds only in elements already declared in SCAFFOLD.yaml
# (§1.1–§1.7). Deleting this file leaves the scaffold's declared behavior
# identical; it exists solely to drive complete downstream test coverage.
#
# Shared timeline convention used by every chain below:
#   2026-09-01T00:00:00Z  season opens; programs, faculty, applicants, reviews,
#                         screening decisions all happen at this instant
#   2026-10-01T12:00:00Z  wave 1 invite_release_at; waves released, invitations issued
#   2026-10-05T13:00Z–16:00Z  slot 1 occupies this interval
#   2026-10-05T16:30:00Z  slots completed, score cards written
#   2026-10-20T09:00:00Z  ranking, deliberation, certification, match day
# CERT_DEADLINE_UTC is 2027-02-25T21:00:00Z, so every chain above is inside it.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  #   instance 1 subject: Application  (applicant merit scoring)
  #   instance 2 subject: FacultyMember (interviewer workload accounting)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: screen_score_provisional_versus_final_on_application
        grounds:
          - calculations.screen_composite_score
          - entities.Application.fields.provisional_screen_score
          - entities.Application.fields.final_screen_score
          - state_machines.Application.UNDER_REVIEW_to_ADVANCED
        distinguishing_aspect: |
          The provisional variant is the unadorned review mean written on every review
          submission, while the final variant adds the Step 2 band bonus and the pipeline bonus
          to the SAME base at the screening transition; for one applicant with step2_score 251
          and pipeline_program_alum true the two fields must differ by exactly 9.00 on the same
          Application row, so an implementation that writes one formula into both fields fails.
        test_recipe:
          setup:
            - "one Program in REVIEW_OPEN with min_step2_score 220 and img_accepted true"
            - "two FacultyMember reviewers of that program, neither in conflict with the applicant"
            - "one Applicant with step2_score 251 and pipeline_program_alum true"
            - "one Application with exactly two reviews, raw contributions 24.50 and 27.00, base 25.75"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
            - call: "POST /programs"
              payload: { name: "Metro Internal Medicine", nrmp_program_code: "1140140M0", specialty_code: "IM", quota_positions: 2, visa_sponsorship_allowed: true, soap_participating: true, min_step2_score: 220, img_accepted: true }
              as: NrmpAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /faculty-members"
              payload: { program_id: "${prog_id}", full_name: "Alan Reyes", is_program_director: false, is_committee_member: true, conflict_applicant_ids: [] }
              as: ProgramCoordinator
              captures: { f1_id: $.data.id }
            - call: "POST /faculty-members"
              payload: { program_id: "${prog_id}", full_name: "Bea Osei", is_program_director: false, is_committee_member: true, conflict_applicant_ids: [] }
              as: ProgramCoordinator
              captures: { f2_id: $.data.id }
            - call: "POST /applicants"
              payload: { eras_id: "E-1001", full_name: "Nia Patel", medical_school_type: "US_MD", visa_status: "US_CITIZEN", step2_score: 251, pipeline_program_alum: true, self_identified_group: "GROUP_A" }
              as: NrmpAdmin
              captures: { cand1_id: $.data.id }
            - call: "POST /programs/${prog_id}/advance-phase"
              payload: { to_phase: "REVIEW_OPEN" }
              as: ProgramCoordinator
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", applicant_id: "${cand1_id}" }
              as: ProgramCoordinator
              captures: { app1_id: $.data.id }
            - call: "POST /applications/${app1_id}/reviews"
              payload: { academic_points: 30, experience_points: 20, holistic_points: 20 }
              as: Reviewer
              as_user_id: "${f1_id}"
            - call: "POST /applications/${app1_id}/reviews"
              payload: { academic_points: 34, experience_points: 24, holistic_points: 18 }
              as: Reviewer
              as_user_id: "${f2_id}"
          trigger:
            - call: "POST /applications/${app1_id}/screen"
              payload: { decision: "ADVANCE" }
              as: ProgramCoordinator
          assert:
            - "Application.${app1_id}.provisional_screen_score == 25.75"
            - "Application.${app1_id}.final_screen_score == 34.75"
            - "Application.${app1_id}.final_screen_score - Application.${app1_id}.provisional_screen_score == 9.00"
            - "Application.${app1_id}.screening_status == ADVANCED"

      - name: interviewer_load_scheduled_versus_realized_on_faculty_member
        grounds:
          - calculations.interviewer_load_index
          - entities.FacultyMember.fields.scheduled_load
          - entities.FacultyMember.fields.realized_load
          - state_machines.InterviewSlot.OPEN_to_COMPLETED
        distinguishing_aspect: |
          The scheduled variant counts undiscounted LEAD-weighted panel hours only while the slot
          is OPEN or BOOKED, and the realized variant counts the same hours discounted by the
          slot's booked_count/applicant_capacity ratio only once the slot is COMPLETED; for a
          3-hour LEAD seat on a 4-seat slot with 1 booking the same FacultyMember row must read
          scheduled_load 4.50 before completion and scheduled_load 0.00 with realized_load 1.13
          after it, because the two variants draw from disjoint slot-status sets.
        test_recipe:
          setup:
            - "one Program in INTERVIEWS_OPEN with one RELEASED wave"
            - "one InterviewSlot spanning 3 hours with applicant_capacity 4"
            - "faculty member f1 holds the LEAD seat on that slot, faculty member f2 holds a MEMBER seat"
            - "exactly one ADVANCED application has accepted an invitation into the slot, so booked_count is 1"
            - "the logical clock has passed the slot's end_at"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
            - call: "POST /programs"
              payload: { name: "Metro Internal Medicine", nrmp_program_code: "1140140M0", specialty_code: "IM", quota_positions: 2, visa_sponsorship_allowed: true, soap_participating: true, min_step2_score: 220, img_accepted: true }
              as: NrmpAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /faculty-members"
              payload: { program_id: "${prog_id}", full_name: "Alan Reyes", is_program_director: false, is_committee_member: true, conflict_applicant_ids: [] }
              as: ProgramCoordinator
              captures: { f1_id: $.data.id }
            - call: "POST /faculty-members"
              payload: { program_id: "${prog_id}", full_name: "Bea Osei", is_program_director: false, is_committee_member: true, conflict_applicant_ids: [] }
              as: ProgramCoordinator
              captures: { f2_id: $.data.id }
            - call: "POST /applicants"
              payload: { eras_id: "E-1001", full_name: "Nia Patel", medical_school_type: "US_MD", visa_status: "US_CITIZEN", step2_score: 251, pipeline_program_alum: true, self_identified_group: "GROUP_A" }
              as: NrmpAdmin
              captures: { cand1_id: $.data.id }
            - call: "POST /programs/${prog_id}/advance-phase"
              payload: { to_phase: "REVIEW_OPEN" }
              as: ProgramCoordinator
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", applicant_id: "${cand1_id}" }
              as: ProgramCoordinator
              captures: { app1_id: $.data.id }
            - call: "POST /applications/${app1_id}/reviews"
              payload: { academic_points: 30, experience_points: 20, holistic_points: 20 }
              as: Reviewer
              as_user_id: "${f1_id}"
            - call: "POST /applications/${app1_id}/reviews"
              payload: { academic_points: 34, experience_points: 24, holistic_points: 18 }
              as: Reviewer
              as_user_id: "${f2_id}"
            - call: "POST /applications/${app1_id}/screen"
              payload: { decision: "ADVANCE" }
              as: ProgramCoordinator
            - call: "POST /programs/${prog_id}/advance-phase"
              payload: { to_phase: "INTERVIEWS_OPEN" }
              as: ProgramCoordinator
            - call: "POST /interview-waves"
              payload: { program_id: "${prog_id}", wave_index: 1, invite_release_at: "2026-10-01T12:00:00Z", response_deadline_at: "2026-10-08T12:00:00Z", seat_capacity: 4 }
              as: ProgramCoordinator
              captures: { wave1_id: $.data.id }
            - call: "POST /interview-slots"
              payload: { wave_id: "${wave1_id}", start_at: "2026-10-05T13:00:00Z", end_at: "2026-10-05T16:00:00Z", room_label: "A-1", applicant_capacity: 4 }
              as: ProgramCoordinator
              captures: { slot1_id: $.data.id }
            - call: "POST /interview-assignments"
              payload: { slot_id: "${slot1_id}", faculty_member_id: "${f1_id}", panel_role: "LEAD" }
              as: ProgramCoordinator
              captures: { asg1_id: $.data.id }
            - call: "POST /interview-assignments"
              payload: { slot_id: "${slot1_id}", faculty_member_id: "${f2_id}", panel_role: "MEMBER" }
              as: ProgramCoordinator
              captures: { asg2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T12:00:00Z" }
              as: NrmpAdmin
            - call: "POST /interview-waves/${wave1_id}/release"
              payload: {}
              as: ProgramCoordinator
              captures: { wave1_v: $.data.version }
            - call: "POST /interview-waves/${wave1_id}/invitations"
              payload: { application_id: "${app1_id}", expected_wave_version: "${wave1_v}" }
              as: ProgramCoordinator
              captures: { inv1_id: $.data.id }
            - call: "POST /interview-invitations/${inv1_id}/accept"
              payload: { slot_id: "${slot1_id}" }
              as: Applicant
              as_user_id: "${cand1_id}"
            - call: "GET /faculty-members/${f1_id}"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-05T16:30:00Z" }
              as: NrmpAdmin
          trigger:
            - call: "POST /interview-slots/${slot1_id}/complete"
              payload: {}
              as: ProgramCoordinator
          assert:
            - "before the trigger, FacultyMember.${f1_id}.scheduled_load == 4.50 and FacultyMember.${f1_id}.realized_load == 0.00"
            - "before the trigger, FacultyMember.${f2_id}.scheduled_load == 3.00"
            - "after the trigger, FacultyMember.${f1_id}.scheduled_load == 0.00"
            - "after the trigger, FacultyMember.${f1_id}.realized_load == 1.13"
            - "after the trigger, FacultyMember.${f2_id}.realized_load == 0.75"
            - "InterviewSlot.${slot1_id}.status == COMPLETED and InterviewSlot.${slot1_id}.booked_count == 1"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas in DIFFERENT modes
  #   instance 1 → mode (b): nested rounding where the order changes the value
  #   instance 2 → mode (c): circular-looking dependency with a pinned order
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: committee_rubric_per_card_rounding_before_averaging
        grounds:
          - calculations.committee_rubric_score
          - entities.ScoreCard.fields.domain_average
          - entities.Application.fields.committee_score
          - state_machines.ScoreCard.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (b): the pinned order rounds each card's four-domain mean to 1 decimal place FIRST
          (8.75 becomes 8.8 and 7.75 becomes 7.8) and only then averages and rounds to 2 decimals,
          producing committee_score 8.30; the rejected order (sum all eight domain scores, divide
          by 8, round once) produces 8.25, so the two orders are separated by exactly 0.05 on this
          input and an implementation that defers rounding fails.
        test_recipe:
          setup:
            - "one Program in INTERVIEWS_OPEN with a COMPLETED slot that hosted application app1"
            - "faculty f1 holds the LEAD seat and faculty f2 holds a MEMBER seat on that slot"
            - "two DRAFT score cards for app1: domains (8,9,9,9) by f1 and (7,8,8,8) by f2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
            - call: "POST /programs"
              payload: { name: "Metro Internal Medicine", nrmp_program_code: "1140140M0", specialty_code: "IM", quota_positions: 2, visa_sponsorship_allowed: true, soap_participating: true, min_step2_score: 220, img_accepted: true }
              as: NrmpAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /faculty-members"
              payload: { program_id: "${prog_id}", full_name: "Alan Reyes", is_program_director: false, is_committee_member: true, conflict_applicant_ids: [] }
              as: ProgramCoordinator
              captures: { f1_id: $.data.id }
            - call: "POST /faculty-members"
              payload: { program_id: "${prog_id}", full_name: "Bea Osei", is_program_director: false, is_committee_member: true, conflict_applicant_ids: [] }
              as: ProgramCoordinator
              captures: { f2_id: $.data.id }
            - call: "POST /applicants"
              payload: { eras_id: "E-1001", full_name: "Nia Patel", medical_school_type: "US_MD", visa_status: "US_CITIZEN", step2_score: 251, pipeline_program_alum: true, self_identified_group: "GROUP_A" }
              as: NrmpAdmin
              captures: { cand1_id: $.data.id }
            - call: "POST /programs/${prog_id}/advance-phase"
              payload: { to_phase: "REVIEW_OPEN" }
              as: ProgramCoordinator
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", applicant_id: "${cand1_id}" }
              as: ProgramCoordinator
              captures: { app1_id: $.data.id }
            - call: "POST /applications/${app1_id}/reviews"
              payload: { academic_points: 30, experience_points: 20, holistic_points: 20 }
              as: Reviewer
              as_user_id: "${f1_id}"
            - call: "POST /applications/${app1_id}/reviews"
              payload: { academic_points: 34, experience_points: 24, holistic_points: 18 }
              as: Reviewer
              as_user_id: "${f2_id}"
            - call: "POST /applications/${app1_id}/screen"
              payload: { decision: "ADVANCE" }
              as: ProgramCoordinator
            - call: "POST /programs/${prog_id}/advance-phase"
              payload: { to_phase: "INTERVIEWS_OPEN" }
              as: ProgramCoordinator
            - call: "POST /interview-waves"
              payload: { program_id: "${prog_id}", wave_index: 1, invite_release_at: "2026-10-01T12:00:00Z", response_deadline_at: "2026-10-08T12:00:00Z", seat_capacity: 4 }
              as: ProgramCoordinator
              captures: { wave1_id: $.data.id }
            - call: "POST /interview-slots"
              payload: { wave_id: "${wave1_id}", start_at: "2026-10-05T13:00:00Z", end_at: "2026-10-05T16:00:00Z", room_label: "A-1", applicant_capacity: 4 }
              as: ProgramCoordinator
              captures: { slot1_id: $.data.id }
            - call: "POST /interview-assignments"
              payload: { slot_id: "${slot1_id}", faculty_member_id: "${f1_id}", panel_role: "LEAD" }
              as: ProgramCoordinator
              captures: { asg1_id: $.data.id }
            - call: "POST /interview-assignments"
              payload: { slot_id: "${slot1_id}", faculty_member_id: "${f2_id}", panel_role: "MEMBER" }
              as: ProgramCoordinator
              captures: { asg2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T12:00:00Z" }
              as: NrmpAdmin
            - call: "POST /interview-waves/${wave1_id}/release"
              payload: {}
              as: ProgramCoordinator
              captures: { wave1_v: $.data.version }
            - call: "POST /interview-waves/${wave1_id}/invitations"
              payload: { application_id: "${app1_id}", expected_wave_version: "${wave1_v}" }
              as: ProgramCoordinator
              captures: { inv1_id: $.data.id }
            - call: "POST /interview-invitations/${inv1_id}/accept"
              payload: { slot_id: "${slot1_id}" }
              as: Applicant
              as_user_id: "${cand1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-05T16:30:00Z" }
              as: NrmpAdmin
            - call: "POST /interview-slots/${slot1_id}/complete"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /score-cards"
              payload: { assignment_id: "${asg1_id}", application_id: "${app1_id}", communication_score: 8, clinical_reasoning_score: 9, professionalism_score: 9, teamwork_score: 9 }
              as: Interviewer
              as_user_id: "${f1_id}"
              captures: { sc1_id: $.data.id }
            - call: "POST /score-cards"
              payload: { assignment_id: "${asg2_id}", application_id: "${app1_id}", communication_score: 7, clinical_reasoning_score: 8, professionalism_score: 8, teamwork_score: 8 }
              as: Interviewer
              as_user_id: "${f2_id}"
              captures: { sc2_id: $.data.id }
            - call: "POST /score-cards/${sc1_id}/submit"
              payload: {}
              as: Interviewer
              as_user_id: "${f1_id}"
          trigger:
            - call: "POST /score-cards/${sc2_id}/submit"
              payload: {}
              as: Interviewer
              as_user_id: "${f2_id}"
          assert:
            - "ScoreCard.${sc1_id}.domain_average == 8.8"
            - "ScoreCard.${sc2_id}.domain_average == 7.8"
            - "Application.${app1_id}.committee_score == 8.30"
            - "Application.${app1_id}.committee_score != 8.25"

      - name: soap_offer_budget_tier_keyed_on_base_unfilled_not_on_budget
        grounds:
          - calculations.soap_offer_budget
          - entities.Program.fields.soap_offer_budget
          - entities.Program.fields.quota_positions
          - entities.Program.fields.matched_count
        distinguishing_aspect: |
          Mode (c): the reserve tier reads base_unfilled (quota_positions - matched_count), never
          the budget it feeds, so a brand-new program with quota_positions 2 and matched_count 0
          has base_unfilled 2, reserve_credit 1 and soap_offer_budget exactly 3; an implementation
          that re-keys the tier on the computed budget iterates 3 into the >= 3 tier and reports 4,
          and one that iterates to a fixed point reports 4 as well.
        test_recipe:
          setup:
            - "one freshly registered Program with quota_positions 2, matched_count 0, no match run yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
            - call: "POST /programs"
              payload: { name: "Metro Internal Medicine", nrmp_program_code: "1140140M0", specialty_code: "IM", quota_positions: 2, visa_sponsorship_allowed: true, soap_participating: true, min_step2_score: 220, img_accepted: true }
              as: NrmpAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: NrmpAdmin
          assert:
            - "Program.${prog_id}.quota_positions == 2"
            - "Program.${prog_id}.matched_count == 0"
            - "Program.${prog_id}.unfilled_positions == 2"
            - "Program.${prog_id}.soap_offer_budget == 3"
            - "Program.${prog_id}.soap_offer_budget != 4"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on DIFFERENT entities
  #   instance 1 → Application: two parallel independent state dimensions
  #   instance 2 → RankList: branching fork with divergent side effects + cycle
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_parallel_screening_and_interview_dimensions
        grounds:
          - state_machines.Application.NOT_INVITED_to_INVITED
          - state_machines.Application.INVITED_to_SCHEDULED
          - entities.Application.fields.screening_status
          - entities.Application.fields.interview_status
        distinguishing_aspect: |
          Application carries screening_status and interview_status as two independent axes on the
          same row: accepting an invitation moves interview_status NOT_INVITED to INVITED to
          SCHEDULED while screening_status stays pinned at ADVANCED throughout, so an
          implementation that models the application as a single linear pipeline cannot hold both
          observed values at once.
        test_recipe:
          setup:
            - "one Program in INTERVIEWS_OPEN with one RELEASED wave and one OPEN slot"
            - "one Application whose screening_status is ADVANCED and interview_status is NOT_INVITED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
