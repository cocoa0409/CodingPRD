      - name: cost_certification_submission_depends_on_the_sponsor_being_reinstated
        grounds:
          - validations[priority=80]
          - errors[ERR_DEVELOPER_NOT_ACTIVE]
          - state_machines.Developer.ACTIVE_to_SUSPENDED
          - state_machines.Developer.SUSPENDED_to_ACTIVE
          - state_machines.CostCertification.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          A DIFFERENT gating pair from the previous instance: here the blocking
          state sits on the GRANDPARENT of the entity being transitioned - the
          Developer that owns the CostCertification's project - and the gate is
          two-way rather than one-way. SUSPEND blocks the submission at priority
          80, before the certification's own DRAFT state is even consulted, and
          REINSTATE unblocks the identical request; the certification's
          submission_round proves the refused attempt did not count.
        test_recipe:
          setup:
            - "One developer and one project; no units, agreement, cap or bond are needed because certification drafting has no project-state precondition."
            - "A CostCertification is drafted in DRAFT with submission_round 0."
            - "The compliance officer then SUSPENDs the developer."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              captures: { dev_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Harborview Commons", total_units: 10, total_floor_space_sqft: 8500, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /cost-certifications"
              payload: { project_id: "${proj_id}", certified_land_cost_cents: 40000000, certified_depreciable_basis_cents: 360000000, certified_eligible_basis_cents: 355000000, preparer_name: "Nolan CPA" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { cc_id: $.data.id }
            - call: "POST /developers/${dev_id}/sanctions"
              payload: { action: "SUSPEND", reason: "unresolved monitoring findings on a sibling development" }
              as: HfaComplianceOfficer
              as_user_id: "hfa-comp-1"
          trigger:
            - call: "POST /cost-certifications/${cc_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /developers/${dev_id}/sanctions"
              payload: { action: "REINSTATE", reason: "findings cleared" }
              as: HfaComplianceOfficer
              as_user_id: "hfa-comp-1"
            - call: "POST /cost-certifications/${cc_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
          assert:
            - "the FIRST submit call returns HTTP 409 with error_id == ERR_DEVELOPER_NOT_ACTIVE"
            - "after that refusal CostCertification.${cc_id}.status is still DRAFT and submission_round is still 0"
            - "the REINSTATE call returns HTTP 200 with Developer.${dev_id}.status == ACTIVE and sanction_reason == null"
            - "the SECOND submit call returns HTTP 200 with CostCertification.${cc_id}.status == SUBMITTED and submission_round == 1"
            - "CostCertification.${cc_id}.certified_aggregate_basis_cents == 400000000 throughout"

  - rule_id: resource_temporal_overlap
    instances:
      - name: draw_periods_are_half_open_so_touching_endpoints_pass_and_rejected_intervals_are_reusable
        grounds:
          - validations[priority=100]
          - errors[ERR_DRAW_PERIOD_OVERLAP]
          - state_machines.DrawRequest.SUBMITTED_to_REJECTED
          - concurrency_rules[draw-create-stale-bond-issue]
          - endpoints[POST /draw-requests]
        distinguishing_aspect: |
          DrawRequest intervals are HALF-OPEN [period_start, period_end) with NO
          buffer, and the occupancy set is status-filtered to SUBMITTED, APPROVED
          and FUNDED. Three consequences are exercised in one run: a draw
          starting at the exact instant another ends is accepted; a draw that
          strictly straddles two existing periods is refused; and once a draw is
          REJECTED its interval is vacated and an identical interval is accepted
          again. Because creating a draw bumps BondIssue.version, every attempt
          must carry a freshly read expected_bond_issue_version.
        test_recipe:
          setup:
            - "Canonical fixture through bond issuance at par 200,000,000, undrawn_cents 200,000,000."
            - "Draw 1 is created for 60,000,000 over the half-open period 2026-09-15 to 2026-11-15 and is left in SUBMITTED - unfunded draws still occupy their interval."
            - "No draw is ever funded here, so undrawn_cents stays 200,000,000 and the fiscal rule at priority 112 never fires."
