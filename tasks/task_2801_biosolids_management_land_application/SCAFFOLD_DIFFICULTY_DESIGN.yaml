  - rule_id: non_linear_state_machine
    instances:
      - name: agreement_propose_counter_cycle_bounded_at_three_rounds
        shape: cycle
        entity: FarmerAgreement
        grounds:
          - state_machines.FarmerAgreement.PROPOSED_to_COUNTERED
          - state_machines.FarmerAgreement.COUNTERED_to_PROPOSED
          - entities.FarmerAgreement.fields.round_index
          - entities.FarmerAgreement.fields.last_proposed_by_role
          - errors.ERR_AGREEMENT_ROUND_LIMIT
        distinguishing_aspect: |
          PROPOSED -> COUNTERED -> PROPOSED is a true cycle: the row re-enters PROPOSED three
          times with a different max_dry_tons_per_acre each lap, round_index counts only the
          farmer's counters, and the fourth counter is refused with ERR_AGREEMENT_ROUND_LIMIT
          while the row stays PROPOSED - a linear DRAFT->PROPOSED->SIGNED reading cannot
          reproduce round_index 3 or version 8.
        test_recipe:
          setup:
            - "TreatmentFacility posture OPEN."
            - "PERMITTED LandApplicationSite S-01 (propose requires a PERMITTED site)."
            - "One DRAFT FarmerAgreement for farmer-jones at 20.0 dry tons/acre, term 2026-08-01 .. 2026-12-31."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-facilities"
              payload: { name: "North Water Reclamation Plant", npdes_permit_number: "NP-1001", storage_capacity_wet_tons: 5000.00, daily_production_wet_tons: 40.00, loadout_bay_count: 2 }
              as: FacilityOperator
              captures: { fac_id: $.data.id }
            - call: "POST /land-application-sites"
              payload: { facility_id: "${fac_id}", site_code: "S-01", acres: 100.0, crop_type: "CORN", crop_n_demand_lb_per_acre: 160.0, crop_p_removal_lb_per_acre: 60.0, soil_p_index: 40, setback_to_well_ft: 200, setback_to_surface_water_ft: 150, allowed_application_months: [8, 9, 10], soil_ph: 6.5, depth_to_groundwater_ft: 10.0, slope_pct: 3.0, nearest_residence_ft: 3000, reapplication_interval_days: 10 }
              as: Agronomist
              captures: { site_id: $.data.id }
            - call: "POST /land-application-sites/${site_id}/submit-permit"
              payload: {}
              as: Agronomist
            - call: "POST /land-application-sites/${site_id}/permit-decision"
              payload: { decision: "APPROVE", permit_number: "LAP-0001" }
              as: ComplianceOfficer
              captures: { site_v: $.data.version }
            - call: "POST /farmer-agreements"
              payload: { site_id: "${site_id}", expected_site_version: "${site_v}", farmer_user_id: "farmer-jones", farm_name: "Jones Family Farm", term_start: "2026-08-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", max_dry_tons_per_acre: 20.0, notice_days: 3 }
              as: Agronomist
              captures: { agr_id: $.data.id }
            - call: "POST /farmer-agreements/${agr_id}/propose"
              payload: { max_dry_tons_per_acre: 20.0, notice_days: 3 }
              as: Agronomist
            - call: "POST /farmer-agreements/${agr_id}/counter"
              payload: { max_dry_tons_per_acre: 18.0 }
              as: Farmer
              as_user_id: "farmer-jones"
            - call: "POST /farmer-agreements/${agr_id}/propose"
              payload: { max_dry_tons_per_acre: 19.0 }
              as: Agronomist
            - call: "POST /farmer-agreements/${agr_id}/counter"
              payload: { max_dry_tons_per_acre: 16.0 }
              as: Farmer
              as_user_id: "farmer-jones"
            - call: "POST /farmer-agreements/${agr_id}/propose"
              payload: { max_dry_tons_per_acre: 17.0 }
              as: Agronomist
            - call: "POST /farmer-agreements/${agr_id}/counter"
              payload: { max_dry_tons_per_acre: 15.0 }
              as: Farmer
              as_user_id: "farmer-jones"
            - call: "POST /farmer-agreements/${agr_id}/propose"
              payload: { max_dry_tons_per_acre: 16.0 }
              as: Agronomist
          trigger:
            - call: "POST /farmer-agreements/${agr_id}/counter"
              payload: { max_dry_tons_per_acre: 14.0 }
              as: Farmer
              as_user_id: "farmer-jones"
              captures: { err: $.data.error_id }
          assert:
            - "the fourth counter returns HTTP 409 with error_id == ERR_AGREEMENT_ROUND_LIMIT"
            - "FarmerAgreement.${agr_id}.round_index == 3"
            - "FarmerAgreement.${agr_id}.status == PROPOSED"
            - "FarmerAgreement.${agr_id}.last_proposed_by_role == Agronomist"
            - "FarmerAgreement.${agr_id}.max_dry_tons_per_acre == 16.0"
            - "FarmerAgreement.${agr_id}.version == 8"
            - "the row visited PROPOSED four times and COUNTERED three times, so the cycle is traversed, not a linear path"

      - name: batch_quality_dimension_reopens_twice_then_locks
        shape: parallel_dimensions_plus_bounded_loop
        entity: SolidsBatch
        grounds:
          - state_machines.SolidsBatch.QUAL_PENDING_RESULTS_to_QUAL_REJECTED
          - state_machines.SolidsBatch.QUAL_REJECTED_to_QUAL_PENDING_RESULTS
          - entities.SolidsBatch.fields.retest_round
          - entities.SolidsBatch.fields.process_status
          - entities.SolidsBatch.fields.quality_status
          - errors.ERR_RETEST_LIMIT_REACHED
        distinguishing_aspect: |
          SolidsBatch carries two independent dimensions: quality_status cycles
          PENDING_RESULTS -> REJECTED -> PENDING_RESULTS twice while process_status stays pinned
          at DEWATERED through all six quality transitions, and the third retest request is
          refused at retest_round 2. Facility posture tracks the loop, freezing on each
          exceedance and re-opening on each retest request.
        test_recipe:
          setup:
            - "TreatmentFacility posture OPEN, ACTIVE CADMIUM PollutantLimit with ceiling 85.0."
            - "SolidsBatch advanced to DEWATERED, so quality_status is PENDING_RESULTS at retest_round 0."
            - "Three failing CADMIUM results, one per sampling round: 90.0, 95.0 and 99.0 mg/kg, with a retest request after the first two."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-facilities"
              payload: { name: "North Water Reclamation Plant", npdes_permit_number: "NP-1001", storage_capacity_wet_tons: 5000.00, daily_production_wet_tons: 40.00, loadout_bay_count: 2 }
              as: FacilityOperator
              captures: { fac_id: $.data.id }
            - call: "POST /pollutant-limits"
              payload: { analyte: "CADMIUM", ceiling_mg_kg: 85.0, monthly_avg_mg_kg: 39.0, aplr_kg_per_hectare_yr: 1.9, cplr_kg_per_hectare: 39.0 }
              as: ComplianceOfficer
            - call: "POST /solids-batches"
              payload: { facility_id: "${fac_id}", batch_code: "B-2026-001", wet_tons: 800.00, dry_tons_in: 200.000, volatile_solids_in_pct: 70.00, percent_solids: 20.0, detention_days: 20.0, digester_temp_c: 36.0, stabilization_process: "ANAEROBIC_DIGESTION", pathogen_option: "PSRP_ALT1_TIME_TEMP", vector_option: "VAR_OPTION_1_VSR", nh4_n_mg_kg: 4000.0, organic_n_mg_kg: 30000.0, nitrate_n_mg_kg: 100.0, total_p_mg_kg: 25000.0 }
              as: FacilityOperator
              captures: { batch_id: $.data.id }
            - call: "POST /solids-batches/${batch_id}/advance-process"
              payload: { to_status: "DIGESTED", dry_tons_out: 160.000, volatile_solids_out_pct: 55.00, detention_days: 20.0, digester_temp_c: 36.0 }
              as: FacilityOperator
            - call: "POST /solids-batches/${batch_id}/advance-process"
              payload: { to_status: "DEWATERED", percent_solids: 20.0 }
              as: FacilityOperator
            - call: "POST /solids-batches/${batch_id}/lab-results"
              payload: { analyte: "CADMIUM", concentration_mg_kg: 90.0, sampling_event_index: 0, analyzed_at: "2026-08-02T00:00:00Z", method_code: "EPA-6010D" }
              as: LabAnalyst
            - call: "POST /solids-batches/${batch_id}/retest-request"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /solids-batches/${batch_id}/lab-results"
              payload: { analyte: "CADMIUM", concentration_mg_kg: 95.0, sampling_event_index: 1, analyzed_at: "2026-08-05T00:00:00Z", method_code: "EPA-6010D" }
              as: LabAnalyst
            - call: "POST /solids-batches/${batch_id}/retest-request"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /solids-batches/${batch_id}/lab-results"
              payload: { analyte: "CADMIUM", concentration_mg_kg: 99.0, sampling_event_index: 2, analyzed_at: "2026-08-08T00:00:00Z", method_code: "EPA-6010D" }
              as: LabAnalyst
          trigger:
            - call: "POST /solids-batches/${batch_id}/retest-request"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "the third retest request returns HTTP 409 with error_id == ERR_RETEST_LIMIT_REACHED"
            - "SolidsBatch.${batch_id}.retest_round == 2"
            - "SolidsBatch.${batch_id}.quality_status == REJECTED"
            - "SolidsBatch.${batch_id}.rejection_reason == CEILING_EXCEEDED"
            - "SolidsBatch.${batch_id}.ceiling_exceedance_flag == true"
            - "SolidsBatch.${batch_id}.process_status == DEWATERED"
            - "SolidsBatch.${batch_id}.dry_tons_produced == 160.000 and unallocated_dry_tons == 160.000"
            - "GET /lab-results?batch_id=${batch_id} returns 3 rows with sampling_event_index 0, 1 and 2, all exceeds_ceiling == true"
            - "TreatmentFacility.${fac_id}.posture == FROZEN and open_ceiling_exceedance_count == 1"

  - rule_id: transitive_cascade
    instances:
      - name: completion_cascade_restricts_site_then_defers_sibling_event
        depth: 4
        trigger_transition: ApplicationEvent IN_PROGRESS -> COMPLETED
        grounds:
          - state_machines.ApplicationEvent.IN_PROGRESS_to_COMPLETED
          - state_machines.LandApplicationSite.PERMITTED_to_RESTRICTED
          - state_machines.ApplicationEvent.SCHEDULED_to_DEFERRED
          - calculations.cumulative_loading_ledger
          - entities.LandApplicationSite.fields.restriction_reason
          - entities.ApplicationEvent.fields.defer_reason
