# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# garden-center-nursery — Expert tier. Breadth probe over §1.1–§1.7.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Account, endpoints]
        distinguishing_aspect: "POST /nurseries/{id}/accounts with all required fields returns 201 and a body carrying account_type, display_name, ship_to_hardiness_zone, status=ACTIVE, and zeroed loyalty/balance fields."
        test_recipe:
          setup: ["A nursery exists."]
          setup_api_calls:
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
          trigger:
            - call: "POST /nurseries/${nid}/accounts"
              payload: { account_type: "RETAIL", display_name: "Walk-in", ship_to_hardiness_zone: 6 }
              as: SalesClerk
              captures: { aid: $.data.id }
          assert:
            - "HTTP 201; Account.${aid}.status == ACTIVE"
            - "Account.${aid}.lifetime_points == 0 AND points_balance == 0 AND loyalty_tier == STANDARD AND outstanding_balance_cents == 0"

      - name: retail_account_credit_limit_forced_to_zero
        claim_type: Computed Fields
        grounds: [entities.Account.fields.credit_limit_cents, entities.Account.fields.account_type]
        distinguishing_aspect: "Creating a RETAIL account with credit_limit_cents=9999 in the body forces credit_limit_cents to 0 (input ignored for RETAIL)."
        test_recipe:
          setup: ["A nursery exists."]
          setup_api_calls:
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
          trigger:
            - call: "POST /nurseries/${nid}/accounts"
              payload: { account_type: "RETAIL", display_name: "Walk-in", ship_to_hardiness_zone: 6, credit_limit_cents: 9999 }
              as: SalesClerk
              captures: { aid: $.data.id }
          assert:
            - "Account.${aid}.credit_limit_cents == 0 (RETAIL forces zero regardless of input)"

      - name: get_account_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Account", "errors[ERR_ACCOUNT_NOT_FOUND]"]
        distinguishing_aspect: "GET /accounts/{bogus} returns ERR_ACCOUNT_NOT_FOUND (404)."
        test_recipe:
          setup: ["No account with the queried id exists."]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SalesClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_ACCOUNT_NOT_FOUND"

      - name: create_product_missing_required_field_returns_422
        claim_type: Required Fields
        grounds: ["entities.Product.fields.unit_price_cents", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST product without unit_price_cents returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A nursery exists."]
          setup_api_calls:
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
          trigger:
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "X1", name: "Bare", category: "DRY_GOOD", unit: "EACH" }
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; error_id == ERR_INVALID_REQUEST"

      - name: bulk_material_must_use_cubic_yard_unit
        claim_type: Type Constraints
        grounds: ["entities.Product.fields.unit", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A BULK_MATERIAL product created with unit=EACH violates the unit/category constraint and returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A nursery exists."]
          setup_api_calls:
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
          trigger:
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "SOIL-1", name: "Topsoil", category: "BULK_MATERIAL", unit: "EACH", unit_price_cents: 4000 }
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; error_id == ERR_INVALID_REQUEST (BULK_MATERIAL requires CUBIC_YARD)"

      - name: duplicate_sku_per_nursery_rejected
        claim_type: Type Constraints
        grounds: ["entities.Product.fields.sku", "validations[priority=6]", "errors[ERR_DUPLICATE_SKU]"]
        distinguishing_aspect: "Creating a second product with an SKU already used in the same nursery returns ERR_DUPLICATE_SKU (409)."
        test_recipe:
          setup: ["A nursery with one product SKU 'DUP'."]
          setup_api_calls:
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "DUP", name: "First", category: "DRY_GOOD", unit: "EACH", unit_price_cents: 100 }
              as: InventoryManager
          trigger:
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "DUP", name: "Second", category: "DRY_GOOD", unit: "EACH", unit_price_cents: 200 }
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_DUPLICATE_SKU"

      - name: system_fields_generated_ignoring_input
        claim_type: System Fields
        grounds: [entities.InventoryLot.fields.qty_on_hand, entities.InventoryLot.fields.status]
        distinguishing_aspect: "On lot create the server sets qty_on_hand=received_qty and status=QUARANTINE; computed/system fields are server-minted."
        test_recipe:
          setup: ["A nursery + product exist."]
          setup_api_calls:
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "PL-S", name: "Sage", category: "LIVE_PLANT", unit: "EACH", lifecycle_class: "PERENNIAL", hardiness_min_zone: 4, hardiness_max_zone: 9, unit_price_cents: 700, warranty_days: 30, warranty_pct: 50 }
              as: InventoryManager
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /products/${pid}/inventory-lots"
              payload: { received_qty: 12, unit_cost_cents: 250 }
              as: InventoryManager
              captures: { lot: $.data.id }
          assert:
            - "InventoryLot.${lot}.qty_on_hand == 12 AND status == QUARANTINE AND reserved_qty == 0 AND shrink_qty == 0 AND sold_qty == 0 AND version == 1"

      - name: list_products_pagination_envelope
        claim_type: Listing
        grounds: [entities.Product, endpoints]
        distinguishing_aspect: "GET /nurseries/{id}/products with limit=1 returns a paginated array with total_count and has_more in meta/envelope."
        test_recipe:
          setup: ["A nursery with two products."]
          setup_api_calls:
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "A", name: "A", category: "DRY_GOOD", unit: "EACH", unit_price_cents: 100 }
              as: InventoryManager
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "B", name: "B", category: "DRY_GOOD", unit: "EACH", unit_price_cents: 200 }
              as: InventoryManager
          trigger:
            - call: "GET /nurseries/${nid}/products"
              payload: { limit: 1, offset: 0 }
              as: InventoryManager
          assert:
            - "response_type == array; total_count == 2; has_more == true; data length == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: release_already_available_lot_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.InventoryLot.QUARANTINE_to_AVAILABLE", "errors[ERR_LOT_NOT_QUARANTINED]"]
        distinguishing_aspect: "Releasing a lot already in AVAILABLE returns ERR_LOT_NOT_QUARANTINED (409); no side effects."
        test_recipe:
          setup: ["A released (AVAILABLE) lot."]
          setup_api_calls:
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "PL-R", name: "Rose", category: "LIVE_PLANT", unit: "EACH", lifecycle_class: "PERENNIAL", hardiness_min_zone: 4, hardiness_max_zone: 9, unit_price_cents: 900, warranty_days: 30, warranty_pct: 50 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/inventory-lots"
              payload: { received_qty: 3, unit_cost_cents: 300 }
              as: InventoryManager
              captures: { lot: $.data.id }
            - call: "POST /inventory-lots/${lot}/release"
              payload: {}
              as: InventoryManager
          trigger:
            - call: "POST /inventory-lots/${lot}/release"
              payload: {}
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_LOT_NOT_QUARANTINED"

      - name: quarantine_lot_with_reservations_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.InventoryLot.AVAILABLE_to_QUARANTINE", "errors[ERR_LOT_HAS_RESERVATIONS]"]
        distinguishing_aspect: "Quarantining a lot with reserved_qty>0 (held by an allocated order) returns ERR_LOT_HAS_RESERVATIONS (409)."
        test_recipe:
          setup: ["Lot AVAILABLE with 5 units; an allocated order reserving 5."]
          setup_api_calls:
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
            - call: "POST /nurseries/${nid}/accounts"
              payload: { account_type: "RETAIL", display_name: "Walk-in", ship_to_hardiness_zone: 6 }
              as: SalesClerk
              captures: { aid: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "DG-R", name: "Rake", category: "DRY_GOOD", unit: "EACH", unit_price_cents: 1200 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/inventory-lots"
              payload: { received_qty: 5, unit_cost_cents: 400 }
              as: InventoryManager
              captures: { lot: $.data.id }
            - call: "POST /inventory-lots/${lot}/release"
              payload: {}
              as: InventoryManager
            - call: "POST /accounts/${aid}/orders"
              payload: {}
              as: SalesClerk
              captures: { oid: $.data.id, ov0: $.data.version }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 5 }
              as: SalesClerk
            - call: "POST /orders/${oid}/confirm"
              payload: { expected_order_version: "${ov0}" }
              as: SalesClerk
              captures: { ov1: $.data.version }
            - call: "POST /orders/${oid}/allocate"
              payload: { expected_order_version: "${ov1}" }
              as: InventoryManager
          trigger:
            - call: "POST /inventory-lots/${lot}/quarantine"
              payload: {}
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_LOT_HAS_RESERVATIONS"

      - name: confirm_empty_order_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Order.DRAFT_to_CONFIRMED", "errors[ERR_ORDER_EMPTY]"]
        distinguishing_aspect: "Confirming an order with no lines returns ERR_ORDER_EMPTY (409)."
        test_recipe:
          setup: ["A DRAFT order with zero lines."]
          setup_api_calls:
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
            - call: "POST /nurseries/${nid}/accounts"
              payload: { account_type: "RETAIL", display_name: "Walk-in", ship_to_hardiness_zone: 6 }
              as: SalesClerk
              captures: { aid: $.data.id }
            - call: "POST /accounts/${aid}/orders"
              payload: {}
              as: SalesClerk
              captures: { oid: $.data.id, ov0: $.data.version }
          trigger:
            - call: "POST /orders/${oid}/confirm"
              payload: { expected_order_version: "${ov0}" }
              as: SalesClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_ORDER_EMPTY"

      - name: fulfill_unpaid_order_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Order.ALLOCATED_to_FULFILLED", "errors[ERR_ORDER_NOT_SETTLED]"]
        distinguishing_aspect: "Fulfilling an allocated but UNPAID order returns ERR_ORDER_NOT_SETTLED (409)."
        test_recipe:
          setup: ["Order confirmed+allocated but payment_status still UNPAID."]
          setup_api_calls:
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
            - call: "POST /nurseries/${nid}/accounts"
              payload: { account_type: "RETAIL", display_name: "Walk-in", ship_to_hardiness_zone: 6 }
              as: SalesClerk
              captures: { aid: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "DG-U", name: "Spade", category: "DRY_GOOD", unit: "EACH", unit_price_cents: 900 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/inventory-lots"
              payload: { received_qty: 4, unit_cost_cents: 300 }
              as: InventoryManager
              captures: { lot: $.data.id }
            - call: "POST /inventory-lots/${lot}/release"
              payload: {}
              as: InventoryManager
            - call: "POST /accounts/${aid}/orders"
              payload: {}
              as: SalesClerk
              captures: { oid: $.data.id, ov0: $.data.version }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 2 }
              as: SalesClerk
            - call: "POST /orders/${oid}/confirm"
              payload: { expected_order_version: "${ov0}" }
              as: SalesClerk
              captures: { ov1: $.data.version }
            - call: "POST /orders/${oid}/allocate"
              payload: { expected_order_version: "${ov1}" }
              as: InventoryManager
              captures: { ov2: $.data.version }
          trigger:
            - call: "POST /orders/${oid}/fulfill"
              payload: { expected_order_version: "${ov2}" }
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_ORDER_NOT_SETTLED"

      - name: cancel_fulfilled_order_rejected
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Order.ALLOCATED_to_CANCELLED", "errors[ERR_ORDER_ALREADY_FULFILLED]"]
        distinguishing_aspect: "Cancelling a FULFILLED order returns ERR_ORDER_ALREADY_FULFILLED (409); FULFILLED is terminal for fulfillment."
        test_recipe:
          setup: ["An order driven all the way to FULFILLED."]
          setup_api_calls:
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
            - call: "POST /nurseries/${nid}/accounts"
              payload: { account_type: "RETAIL", display_name: "Walk-in", ship_to_hardiness_zone: 6 }
              as: SalesClerk
              captures: { aid: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "DG-F", name: "Hose", category: "DRY_GOOD", unit: "EACH", unit_price_cents: 600 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/inventory-lots"
              payload: { received_qty: 4, unit_cost_cents: 200 }
              as: InventoryManager
              captures: { lot: $.data.id }
            - call: "POST /inventory-lots/${lot}/release"
              payload: {}
              as: InventoryManager
            - call: "POST /accounts/${aid}/orders"
              payload: {}
              as: SalesClerk
              captures: { oid: $.data.id, ov0: $.data.version }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 2 }
              as: SalesClerk
            - call: "POST /orders/${oid}/confirm"
              payload: { expected_order_version: "${ov0}" }
              as: SalesClerk
              captures: { ov1: $.data.version }
            - call: "POST /orders/${oid}/allocate"
              payload: { expected_order_version: "${ov1}" }
              as: InventoryManager
              captures: { ov2: $.data.version }
            - call: "POST /orders/${oid}/pay"
              payload: { expected_order_version: "${ov2}" }
              as: SalesClerk
              captures: { ov3: $.data.version }
            - call: "POST /orders/${oid}/fulfill"
              payload: { expected_order_version: "${ov3}" }
              as: InventoryManager
              captures: { ov4: $.data.version }
          trigger:
            - call: "POST /orders/${oid}/cancel"
              payload: { expected_order_version: "${ov4}" }
              as: SalesClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_ORDER_ALREADY_FULFILLED"

      - name: receive_unapproved_special_order_rejected
        claim_type: Invalid Transitions
        grounds: ["state_machines.SpecialOrder.APPROVED_to_RECEIVED", "errors[ERR_SPECIAL_ORDER_NOT_APPROVED]"]
        distinguishing_aspect: "Receiving a special order still in REQUESTED (never approved) returns ERR_SPECIAL_ORDER_NOT_APPROVED (409)."
        test_recipe:
          setup: ["A special order in REQUESTED."]
          setup_api_calls:
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
            - call: "POST /nurseries/${nid}/accounts"
              payload: { account_type: "LANDSCAPER_B2B", display_name: "Acme Land", ship_to_hardiness_zone: 6, credit_limit_cents: 100000 }
              as: SalesClerk
              captures: { aid: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "PL-SO", name: "Bonsai", category: "LIVE_PLANT", unit: "EACH", lifecycle_class: "PERENNIAL", hardiness_min_zone: 5, hardiness_max_zone: 9, unit_price_cents: 8000, warranty_days: 90, warranty_pct: 50 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /accounts/${aid}/special-orders"
              payload: { product_id: "${pid}", requested_qty: 3, quoted_unit_cost_cents: 5000 }
              as: SalesClerk
              captures: { so: $.data.id }
          trigger:
            - call: "POST /special-orders/${so}/receive"
              payload: {}
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_SPECIAL_ORDER_NOT_APPROVED"

      - name: special_order_receive_mints_quarantine_lot
        claim_type: Side Effect Execution
        grounds: [state_machines.SpecialOrder.APPROVED_to_RECEIVED, entities.InventoryLot.fields.special_order_id, calculations.special_order_deposit]
        distinguishing_aspect: "Receiving an APPROVED special order mints a QUARANTINE InventoryLot linked via special_order_id with received_qty == requested_qty; approve pinned deposit_cents = ceil(7*333*30/100) = 700."
        test_recipe:
          setup: ["A special order approved (requested_qty=7, quoted_unit_cost_cents=333)."]
          setup_api_calls:
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
            - call: "POST /nurseries/${nid}/accounts"
              payload: { account_type: "LANDSCAPER_B2B", display_name: "Acme Land", ship_to_hardiness_zone: 6, credit_limit_cents: 100000 }
              as: SalesClerk
              captures: { aid: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "PL-SO2", name: "Juniper", category: "LIVE_PLANT", unit: "EACH", lifecycle_class: "PERENNIAL", hardiness_min_zone: 4, hardiness_max_zone: 9, unit_price_cents: 1000, warranty_days: 60, warranty_pct: 50 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /accounts/${aid}/special-orders"
              payload: { product_id: "${pid}", requested_qty: 7, quoted_unit_cost_cents: 333 }
              as: SalesClerk
              captures: { so: $.data.id }
            - call: "POST /special-orders/${so}/approve"
              payload: {}
              as: InventoryManager
              captures: { sodep: $.data.deposit_cents }
          trigger:
            - call: "POST /special-orders/${so}/receive"
              payload: {}
              as: InventoryManager
              captures: { lotid: $.data.received_lot_id }
          assert:
            - "After approve, SpecialOrder.${so}.deposit_cents == 700 (ceil(2331*30/100))"
            - "After receive, SpecialOrder.${so}.status == RECEIVED and received_lot_id is set; the new InventoryLot has status QUARANTINE, received_qty 7, special_order_id == ${so}"

      - name: deny_already_denied_claim_rejected
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.WarrantyClaim.FILED_to_DENIED", "errors[ERR_CLAIM_NOT_FILED]"]
        distinguishing_aspect: "Approving or denying a claim already in DENIED returns ERR_CLAIM_NOT_FILED (409); DENIED is terminal."
        test_recipe:
          setup: ["A fulfilled order line with a claim already DENIED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
            - call: "POST /nurseries/${nid}/accounts"
              payload: { account_type: "RETAIL", display_name: "Walk-in", ship_to_hardiness_zone: 6 }
              as: SalesClerk
              captures: { aid: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "PL-D", name: "Daisy", category: "LIVE_PLANT", unit: "EACH", lifecycle_class: "PERENNIAL", hardiness_min_zone: 3, hardiness_max_zone: 9, unit_price_cents: 1000, warranty_days: 60, warranty_pct: 100 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/inventory-lots"
              payload: { received_qty: 4, unit_cost_cents: 300 }
              as: InventoryManager
              captures: { lot: $.data.id }
            - call: "POST /inventory-lots/${lot}/release"
              payload: {}
              as: InventoryManager
            - call: "POST /accounts/${aid}/orders"
              payload: {}
              as: SalesClerk
              captures: { oid: $.data.id, ov0: $.data.version }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 2 }
              as: SalesClerk
              captures: { lineid: $.data.id }
            - call: "POST /orders/${oid}/confirm"
              payload: { expected_order_version: "${ov0}" }
              as: SalesClerk
              captures: { ov1: $.data.version }
            - call: "POST /orders/${oid}/allocate"
              payload: { expected_order_version: "${ov1}" }
              as: InventoryManager
              captures: { ov2: $.data.version }
            - call: "POST /orders/${oid}/pay"
              payload: { expected_order_version: "${ov2}" }
              as: SalesClerk
              captures: { ov3: $.data.version }
            - call: "POST /orders/${oid}/fulfill"
              payload: { expected_order_version: "${ov3}" }
              as: InventoryManager
