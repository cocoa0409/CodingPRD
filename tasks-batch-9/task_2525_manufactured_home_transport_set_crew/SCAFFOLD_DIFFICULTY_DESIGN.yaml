        grounds:
          - calculations.set_crew_day_load
          - validations[priority=23]
          - entities.SetCrew.fields.daily_capacity
          - entities.SetJob.fields.scheduled_start_date
          - entities.SetJob.fields.scheduled_end_date
        distinguishing_aspect: |
          Aggregate per-calendar-day capacity rather than pairwise window overlap: each
          candidate job on its own fits inside daily_capacity 1, and the ranges are
          expanded to inclusive day sets, so a job ending 08-12 collides with a job
          starting 08-12 - the shared endpoint counts for BOTH jobs. The three jobs sit
          on three separate orders because a second job on the same order would
          SUPERSEDE the first and silently free its days. A day-shift of one makes the
          third booking legal.
        test_recipe:
