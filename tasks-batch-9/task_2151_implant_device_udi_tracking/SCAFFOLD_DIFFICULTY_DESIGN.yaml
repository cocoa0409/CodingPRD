              captures: { cat_id: "$.data.id" }
            - call: "POST /udi/lots"
              payload: { catalog_item_id: "${cat_id}", lot_number: "L-9901", expiration_date: "2027-06-30" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { lot_id: "$.data.id", lot_v: "$.data.version" }
            - call: "POST /udi/lots/${lot_id}/device-units"
              payload: { udi_serial: "SN-0001", acquisition_cost_cents: 60000, expected_lot_version: "${lot_v}" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { u1_id: "$.data.id" }
            - call: "POST /udi/lots/${lot_id}/release"
              payload: {}
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/field-actions"
              payload: { vendor_id: "${vendor_id}", catalog_item_id: "${cat_id}", action_code: "FA-2026-010", action_class: "CLASS_III", scope_type: "CATALOG", effective_from_utc: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-01"
              captures: { fa_id: "$.data.id" }
          trigger:
            - call: "POST /udi/field-actions/${fa_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-01"
              captures: { implanted: "$.data.implanted_cohort_size", onhand: "$.data.on_hand_cohort_size" }
            - call: "POST /udi/field-actions/${fa_id}/close"
              payload: { on_hand_disposition: "RETURN_TO_VENDOR" }
              as: ComplianceOfficer
              as_user_id: "co-01"
          assert:
            - "After publish, FieldAction.${fa_id}.implanted_cohort_size == 0"
            - "After publish, FieldAction.${fa_id}.on_hand_cohort_size == 1"
            - "After publish, FieldAction.${fa_id}.notification_open_count == 0"
            - "GET /udi/recall-notifications?field_action_id=${fa_id} returns total_count == 0"
            - "FieldAction.${fa_id}.status == CLOSED (it never entered IN_REMEDIATION)"
            - "DeviceUnit.${u1_id}.custody_state == RETURNED_TO_VENDOR"
            - "Lot.${lot_id}.received_qty == 1 and Lot.${lot_id}.on_hand_qty == 0 and Lot.${lot_id}.consumed_qty == 1"
            - "Vendor.${vendor_id}.recall_open_count == 0"

      - name: invoice_variance_bps_equal_to_tolerance_takes_matched_branch
