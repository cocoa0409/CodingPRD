            - call: "POST /pod/designs/${design_id}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pod/listings"
              payload: { storefront_id: "${sf_id}", design_id: "${design_id}", variant_id: "${var_id}", title: "CD14 Tee" }
