  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: enrollment_requires_program_active
        grounds:
          - state_machines.IncentiveProgram
          - validations[priority=3]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair IncentiveEnrollment -> IncentiveProgram: enrolling into a
          DRAFT (never-activated) program is rejected with ERR_INVALID_STATE even
          though the driver is ELIGIBLE and fraud-CLEAR — the enrollment's
          validity is gated on the program's state, not its own.
        test_recipe:
          setup:
            - "Clock default; Market ICT; STREAK program left in DRAFT; eligible driver."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /markets"
              payload: { market_code: "ICT", geo_cells: ["cellA"], incentive_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { mkt: $.data.id }
            - call: "POST /drivers"
              payload: { market_id: "${mkt}", display_name: "Gate Gus" }
              as: IncentiveOps
              captures: { drv: $.data.id }
            - call: "POST /incentive-programs"
              payload: { market_id: "${mkt}", program_type: "STREAK", title: "S", window_start_utc: "2026-09-07T00:00:00Z", window_end_utc: "2026-09-14T00:00:00Z", stacking_class: "STACKABLE", excluded_ride_types: [], streak_length: 2, streak_payout_cents: 5000 }
              as: IncentiveOps
