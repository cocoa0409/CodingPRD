      - name: open_inquiry_count_conservation_across_lifecycle
        grounds:
          - entities.Firm.fields.open_inquiry_count
          - state_machines.RegulatoryInquiry.OPEN_to_PENDING_RESPONSE
          - state_machines.RegulatoryInquiry.PENDING_RESPONSE_to_RESPONDED
        distinguishing_aspect: |
          Conserved quantity (aggregate count, different from money): firm.
          open_inquiry_count == count of the firm's inquiries in {OPEN,
          PENDING_RESPONSE} at all times. Create +1, route +0 (both states
          count), respond -1, close +0 — a full forward/compensate walk that
          returns the count to baseline exactly, with no drift after the cycle.
        test_recipe:
          setup:
            - "Firm with open_inquiry_count 0; applicant; request (any state suffices as inquiry subject — SUBMITTED used); clock 2026-08-03T00:00:00Z (Monday, business day)"
            - "Inquiry created, routed, responded (well before response_due_at 2026-08-24 = 15 business days), closed"
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "1902", legal_name: "Invariant Firm 2" }
              as: SystemOperator
              captures: { firm_i2_id: $.data.id }
            - call: "POST /registration-desk/applicants"
              payload: { crd_number: "2902", full_name: "Invariant Rep 2", date_of_birth: "1998-06-18" }
              as: RegistrationPrincipal
              captures: { app_i2_id: $.data.id }
            - call: "POST /registration-desk/registration-requests"
              payload: { applicant_id: "${app_i2_id}", firm_id: "${firm_i2_id}", registration_category: "RR" }
              as: RegistrationPrincipal
              captures: { req_i2_id: $.data.id }
            - call: "POST /registration-desk/jurisdiction-selections"
              payload: { registration_request_id: "${req_i2_id}", jurisdiction_code: "CA", jurisdiction_type: "STATE" }
              as: RegistrationPrincipal
            - call: "POST /registration-desk/registration-requests/${req_i2_id}/submit"
              payload: {}
              as: RegistrationPrincipal
              as_user_id: "rp-inv2"
            - call: "POST /registration-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: SystemOperator
            - call: "POST /registration-desk/regulatory-inquiries"
              payload: { subject_filing_type: "REGISTRATION_REQUEST", subject_filing_id: "${req_i2_id}", inquiry_text: "Regulator question about the U4 filing content." }
              as: Regulator
              captures: { inq_i2_id: $.data.id }
            - call: "GET /registration-desk/firms/${firm_i2_id}"
              payload: {}
              as: SystemOperator
              captures: { cnt_after_create: $.data.open_inquiry_count }
            - call: "POST /registration-desk/regulatory-inquiries/${inq_i2_id}/route"
              payload: {}
              as: SystemOperator
            - call: "GET /registration-desk/firms/${firm_i2_id}"
              payload: {}
              as: SystemOperator
              captures: { cnt_after_route: $.data.open_inquiry_count }
            - call: "POST /registration-desk/regulatory-inquiries/${inq_i2_id}/respond"
              payload: { response_text: "Firm response addressing the regulator question fully." }
              as: ComplianceOfficer
            - call: "GET /registration-desk/firms/${firm_i2_id}"
              payload: {}
              as: SystemOperator
              captures: { cnt_after_respond: $.data.open_inquiry_count }
          trigger:
            - call: "POST /registration-desk/regulatory-inquiries/${inq_i2_id}/close"
              payload: {}
              as: SystemOperator
            - call: "GET /registration-desk/firms/${firm_i2_id}"
              payload: {}
              as: SystemOperator
              captures: { cnt_after_close: $.data.open_inquiry_count }
          assert:
            - "cnt_after_create == 1 (OPEN counts)"
            - "cnt_after_route == 1 (PENDING_RESPONSE still counts — route is count-neutral)"
            - "cnt_after_respond == 0 (RESPONDED leaves the counted set — compensation)"
            - "cnt_after_close == 0 (close is count-neutral; zero net drift across the whole lifecycle)"
