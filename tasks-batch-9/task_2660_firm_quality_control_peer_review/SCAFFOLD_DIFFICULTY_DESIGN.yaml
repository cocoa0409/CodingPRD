            - "PeerReviewer.${rv1_id}.active_review_count == 1"

  # =====================================================================
  # Rule 4 - transitive_cascade
  # Two five-link chains fired from two different endpoints: finding
  # classification (inspection domain) and corrective-action disposition
  # (peer review domain).
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: material_failure_classification_five_link_cascade_to_acceptance_freeze
        grounds:
          - state_machines.InspectionFinding.IDENTIFIED_to_RCA_PENDING
          - state_machines.Engagement.LOCKED_to_OPEN
          - state_machines.QualityRisk.EVALUATED_to_RESPONDED
          - calculations.firm_risk_posture
          - calculations.eqr_required_determination
          - entities.Firm.fields.open_material_failure_count
          - entities.Firm.fields.critical_risk_count
          - entities.Engagement.fields.reopened_count
          - entities.QualityRisk.fields.reopen_count
        distinguishing_aspect: |
          One MATERIAL_FAILURE classification propagates five links deep: (1) class_points 20 and the
          firm's deficiency/material-failure counters rise, (2) the released engagement's LOCKED file is
          driven back to OPEN and reopened_count becomes 1, (3) because the file reopened, the firm's
          EVALUATED QualityRisk in the same sqm_component is driven back to RESPONDED with
          residual_risk_score null and reopen_count 1, (4) because that risk left EVALUATED,
          critical_risk_count falls to 0 while risk_posture becomes CRITICAL from the material failure,
          and (5) because the posture is CRITICAL, the untouched PLANNING engagement is promoted to
          eqr_required true. Stopping at link 2 or 3 leaves observable differences at every later link.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00Z throughout, so the 60-day documentation window is open when the file is locked."
            - "Firm 'Kelder Vann LLP', risk_posture STABLE at the time both engagements are created."
            - "Engagement E1 (AUDIT, period_end 2024-06-30) is REPORT_RELEASED with file_state LOCKED; Engagement E2 (AUDIT, period_end 2026-06-30) is left in workflow_state PLANNING with eqr_required false."
            - "QualityRisk QO-1 on component ENGAGEMENT_PERFORMANCE (likelihood 5, impact 5, inherent 25) has one TESTED EFFECTIVE response and has been evaluated on DESIGN_BASIS, giving residual 16.25 and severity_band CRITICAL, so critical_risk_count is 1 and the posture is ELEVATED before the trigger."
            - "InternalInspection 2024 is IN_PROGRESS with E1 as its only selection and one unclassified InspectionFinding with sqm_component ENGAGEMENT_PERFORMANCE."
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Kelder Vann LLP", state_code: "CA", aa_hours_last_year: 400, peer_review_year_end: "2026-12-31" }
              as: SystemAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/partners"
              payload: { full_name: "Eli Parch", cpa_license_state: "CA", designations: ["ENGAGEMENT_PARTNER"], cpe_hours_last_3y: 200 }
              as: SystemAdmin
              captures: { p_ep1_id: $.data.id }
            - call: "POST /firms/${firm_id}/partners"
              payload: { full_name: "Quinn Cade", cpa_license_state: "CA", designations: ["QC_DIRECTOR"], cpe_hours_last_3y: 200 }
              as: SystemAdmin
              captures: { p_qc_id: $.data.id }
            - call: "POST /engagements"
              payload: { firm_id: "${firm_id}", client_name: "Alder Foods", engagement_type: "AUDIT", period_end: "2024-06-30", engagement_partner_id: "${p_ep1_id}" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /engagements"
              payload: { firm_id: "${firm_id}", client_name: "Marrow Freight", engagement_type: "AUDIT", period_end: "2026-06-30", engagement_partner_id: "${p_ep1_id}" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
              captures: { e2_id: $.data.id }
            - call: "POST /engagements/${e1_id}/workflow-transitions"
              payload: { to_state: "FIELDWORK" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
            - call: "POST /engagements/${e1_id}/workflow-transitions"
              payload: { to_state: "EQR_PENDING" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
            - call: "POST /engagements/${e1_id}/workflow-transitions"
              payload: { to_state: "EQR_CLEARED" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
            - call: "POST /engagements/${e1_id}/workflow-transitions"
              payload: { to_state: "REPORT_RELEASED" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
            - call: "POST /engagements/${e1_id}/file-transitions"
              payload: { to_state: "ASSEMBLED" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
            - call: "POST /engagements/${e1_id}/file-transitions"
