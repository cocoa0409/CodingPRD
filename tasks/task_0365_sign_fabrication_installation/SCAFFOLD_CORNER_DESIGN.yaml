          - entities.SignProject.fields.version
        distinguishing_aspect: "Accept with the correct expected_sign_project_version succeeds and SignProject.version increments (from 1 to a higher value reflecting prior mutations)."
        excluded_because:
          difficulty_instance: dual_variant_calc / estimate_provisional_vs_change_order_rescope_on_estimate_domain
          rationale: "The happy-path accept with a captured project version (and the resulting version bump) is performed in the §1.8 dual-variant setup chain."

      - name: occ_stale_version_apply_change_order_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[change-order-apply-stale-project]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Applying an approved change order with expected_sign_project_version one less than current (stale, ${pv}-1) returns ERR_STALE_VERSION (412); the project version was bumped by a prior mutation between capture and apply."
        test_recipe:
          setup: ["A FABRICATION project with an APPROVED dim change order; project version captured then deliberately decremented to simulate a stale view"]
          setup_api_calls:
