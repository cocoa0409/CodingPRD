          Different conserved quantity: WatchGroup.materials_inventory_count
          (units of printed flyers). Forward send adds printed_flyers =
          ceil(recipient_count/10); compensating recall subtracts exactly the
          same quantity — with recipient_count 6 the ledger goes 100 -> 101 ->
          100, and a recall must never drive the ledger negative (floor enforced
