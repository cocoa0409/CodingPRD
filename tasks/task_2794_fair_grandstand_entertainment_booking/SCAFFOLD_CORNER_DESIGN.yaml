        excluded_because:
          difficulty_instance: settlement_payout_versus_vs_guarantee_plus_backend
          rationale: "That §1.8 instance settles two bookings with identical sales and opposite deal_types and pins both payouts to the cent, which is the whole content of this layer; §1.9's calculations section adds the same-pool comparison in guarantee_plus_backend_beats_versus_on_the_same_pool."

  # ===========================================================================
  # SECTION 9 - From Table 9 (Consistency model): immediate visibility
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: accept_cascade_is_visible_in_its_own_response_and_in_the_very_next_read
        claim_type: immediate
        grounds:
          - state_machines.Offer.SENT_to_ACCEPTED
          - calculations.edition_committed_guarantee_total
          - calculations.stage_hold_ledger
          - response_envelope.success
        distinguishing_aspect: |
          The accept trigger writes across four entities and two aggregates, and every one
          of those effects is readable by the request that immediately follows -- no
          settling period, no background job, no eventual convergence. The slot-neutrality
          of the conversion is part of the same instant: held_show_count is identical
          before and after, because the offer hold turns into a booking hold atomically.
        test_recipe:
          setup:
            - "Canonical edition and Grandstand stage (slot_soft_cap 4), agent agent-hollis, artist Dust Road Revival."
            - "One offer at 12500000 for 2026-08-22 is sent, so the stage already holds one slot and the edition already carries the encumbrance before the accept."
            - "The stage and edition are read immediately BEFORE the accept so the after-values can be compared against a pinned baseline."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: FairOperationsDirector
            - call: "POST /grandstand/fair-editions"
              payload: { year: 2026, name: "State Fair 2026", run_start_date: "2026-08-20", run_end_date: "2026-08-30", gate_admission_price_cents: 1500, talent_budget_cap_cents: 40000000, refund_reserve_cents: 15000000, max_shows_per_day: 2, curfew_utc_time: "23:30", strategy_basis: "ATTENDANCE_WEIGHTED" }
              as: FairOperationsDirector
              captures: { ed_d1: "$.data.id" }
            - call: "POST /grandstand/stages"
              payload: { fair_edition_id: "${ed_d1}", name: "Grandstand", reserved_seat_capacity: 4000, ga_capacity: 6000, changeover_buffer_minutes: 120, slot_soft_cap: 4 }
              as: FairOperationsDirector
              captures: { st_d1: "$.data.id" }
            - call: "POST /grandstand/talent-agents"
              payload: { user_id: "agent-hollis", agency_name: "Hollis Talent", contact_email: "book@hollis.example" }
              as: TalentBuyer
              captures: { ag_d1: "$.data.id" }
            - call: "POST /grandstand/artists"
              payload: { agent_id: "${ag_d1}", name: "Dust Road Revival", genre: "COUNTRY", audience_segment: "FAMILY", base_draw_score: 62.50 }
              as: TalentBuyer
              captures: { ar_d1: "$.data.id" }
            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed_d1}", artist_id: "${ar_d1}", target_stage_id: "${st_d1}", deal_type: "VERSUS", offered_guarantee_cents: 12500000, backend_split_pct: 0.85, backend_breakeven_cents: 6000000, target_show_date: "2026-08-22", load_in_start_utc: "2026-08-22T14:00:00.000Z", load_out_end_utc: "2026-08-22T23:00:00.000Z", response_window_hours: 48 }
              as: TalentBuyer
              captures: { of_d1: "$.data.id" }
            - call: "POST /grandstand/offers/${of_d1}/send"
              payload: {}
              as: TalentBuyer
            - call: "GET /grandstand/stages/${st_d1}"
              payload: {}
              as: TalentBuyer
            - call: "GET /grandstand/fair-editions/${ed_d1}"
              payload: {}
              as: TalentBuyer
          trigger:
            - call: "POST /grandstand/offers/${of_d1}/accept"
              payload: {}
              as: TalentAgent
              as_user_id: "agent-hollis"
            - call: "GET /grandstand/show-bookings"
              payload: { offer_id: "${of_d1}" }
              as: TalentBuyer
              captures: { bk_d1: "$.data[0].id" }
            - call: "GET /grandstand/production-advances"
              payload: { booking_id: "${bk_d1}" }
              as: ProductionManager
              captures: { ad_d1: "$.data[0].id" }
            - call: "GET /grandstand/production-advances/${ad_d1}/rider-items"
              payload: {}
              as: ProductionManager
            - call: "GET /grandstand/stages/${st_d1}"
              payload: {}
              as: TalentBuyer
            - call: "GET /grandstand/fair-editions/${ed_d1}"
              payload: {}
              as: TalentBuyer
            - call: "GET /grandstand/offers/${of_d1}"
              payload: {}
              as: TalentBuyer
          assert:
            - "The accept response body itself already reads status 'ACCEPTED' with agreed_guarantee_cents == 12500000: the caller does not have to re-read to see its own write."
            - "The immediately following booking list returns total_count == 1 with booking_status 'DATE_HELD' and ticketing_status 'SCALED_PENDING' -- the cascade-created row is queryable in the next request, not after a delay."
            - "The advance list for that booking returns total_count == 1 with advance_status 'ADVANCE_PENDING', and its rider-item list returns total_count == 1: the seed STAGING line, is_critical true, requested_cost_cents 0, status 'REQUESTED'."
            - "The stage reads held_show_count == 1 both before and after the accept, and booking_posture 'OPEN' both times: the conversion is slot-neutral within the same instant, never briefly 0 or briefly 2."
            - "The edition reads committed_guarantee_total_cents == 12500000 before the accept (sourced from the SENT offer) and == 12500000 after it (sourced from agreed_guarantee_cents), with open_stage_count == 1 throughout."
            - "Every response carries the declared success envelope: meta.api_request_id, meta.api_request_timestamp and response_type 'object' for the single reads, 'array' for the lists."

