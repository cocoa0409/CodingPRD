  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_state_gate_precedes_window_gate
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_SUBMISSION_NOT_SUBMITTABLE]
          - errors[ERR_SUBMISSION_WINDOW_CLOSED]
        distinguishing_aspect: "Category pair {state, business_temporal}: a submission in SCORING submitted again while the window is closed violates BOTH gates; the state gate (priority 5) wins and the response is 409 ERR_SUBMISSION_NOT_SUBMITTABLE, never the temporal 422."
        test_recipe:
          setup:
            - "Clock 2027-01-10; cycle NB-2027 OPEN; candidate H (NM, D-100) ELIGIBLE; P1 submission created, artifact-completed, submitted, and tech-ACCEPTED (status SCORING — SCORING submissions are not swept by window close)."
          setup_api_calls:
            - *clk_jan10
            - *mk_cycle_nb
            - *open_cycle_nb
            - call: "POST /candidates"
              payload: { full_name: "Candidate H", email: "h@x.com", license_number: "LIC-H", license_state: "NM", district_code: "D-100", years_experience: 5 }
              as: Anonymous
              captures: { cand_h: $.data.id }
            - call: "POST /candidates/${cand_h}/submit-eligibility"
              payload: { license_document_ref: "lic-h.pdf", employer_verification_ref: "emp-h.pdf" }
              as: Candidate
              as_user_id: "${cand_h}"
            - call: "POST /candidates/${cand_h}/verify-eligibility"
              payload: { decision: "APPROVE" }
              as: BoardAdministrator
            - call: "POST /cycles/${cyc_id}/submissions"
              payload: { component_code: "P1" }
              as: Candidate
              as_user_id: "${cand_h}"
              captures: { sub_h: $.data.id }
            - call: "POST /submissions/${sub_h}/artifacts"
              payload: { artifact_type: "WRITTEN_COMMENTARY", file_format: "pdf", file_size_mb: 2 }
              as: Candidate
              as_user_id: "${cand_h}"
            - call: "POST /submissions/${sub_h}/artifacts"
              payload: { artifact_type: "VIDEO", file_format: "mp4", file_size_mb: 120, duration_minutes: 10, subject_student_count: 0 }
              as: Candidate
              as_user_id: "${cand_h}"
            - call: "POST /submissions/${sub_h}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${cand_h}"
            - call: "POST /submissions/${sub_h}/tech-review"
              payload: { decision: "ACCEPT" }
              as: ScoringAdministrator
            # move the clock beyond submission_window_close: the window gate now fails too
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-02T00:00:00Z" }
              as: BoardAdministrator
          trigger:
            - call: "POST /submissions/${sub_h}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${cand_h}"
              captures: { err: $.data.error_id }
          assert:
            - "response status is 409 and error_id == ERR_SUBMISSION_NOT_SUBMITTABLE (state, priority 5)"
            - "the error is NOT ERR_SUBMISSION_WINDOW_CLOSED even though 2027-03-02 is outside [2027-01-01, 2027-03-01) — the temporal gate (priority 6) is shadowed"
            - "ComponentSubmission.${sub_h}.status == SCORING still (no side effects from the rejected submit)"

