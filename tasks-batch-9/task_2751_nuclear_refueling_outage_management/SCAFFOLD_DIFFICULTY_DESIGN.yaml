            - "Outage.${o_id}.dose_committed_mrem == 180.00 and dose_budget_remaining_mrem == 4820.00"

      - name: discharge_reservation_requires_approved_core_load_pattern
        entity_pair: [PoolCellReservation, CoreLoadPattern]
        grounds:
          - validations[priority=7]
          - calculations.pool_cell_admission
          - state_machines.CoreLoadPattern.DRAFT_to_APPROVED
          - errors[ERR_CORE_LOAD_PATTERN_NOT_APPROVED]
        distinguishing_aspect: |
          The gating entity is a SIBLING of the reservation, not its parent: the CoreLoadPattern
          reached through the shared outage_id gates only the DISCHARGE purpose, so the very same
          request body with purpose CONTINGENCY succeeds against the same DRAFT pattern. The
          dependency is therefore conditional on a payload value as well as on another entity's
          state.
        test_recipe:
          setup:
            - "Spent fuel pool UNIT_1-SFP: cells_total 1200, cells_baseline_occupied 900, full_core_offload_reserve_cells 193 — cells_available 300, protected_cells_available 107."
            - "Outage UNIT_1 / 2R26 in PLANNING with exactly one CoreLoadPattern, left in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /spent-fuel-pools"
              payload: { station_unit: "UNIT_1", cells_total: 1200, cells_baseline_occupied: 900, full_core_offload_reserve_cells: 193 }
              as: StationAdmin
              captures: { pool_id: "$.data.id", pool_v1: "$.data.version" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "2R26", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z", required_training_modules: 4, required_badged_workers: 0 }
              as: StationAdmin
              captures: { o_id: "$.data.id", o_v1: "$.data.version" }
            - call: "POST /outages/${o_id}/core-load-patterns"
              payload: { cycle_length_mwd_mtu: 18000, fresh_assembly_count: 88, discharge_assembly_count: 80, expected_outage_version: "${o_v1}" }
              as: ReactorEngineer
              as_user_id: "re-alpha"
              captures: { clp_id: "$.data.id" }
          trigger:
            - call: "POST /pool-cell-reservations"
              payload: { outage_id: "${o_id}", spent_fuel_pool_id: "${pool_id}", cells_requested: 5, purpose: "DISCHARGE", expected_spent_fuel_pool_version: "${pool_v1}" }
              as: ReactorEngineer
              captures: { err_id: "$.data.error_id" }
            - call: "POST /pool-cell-reservations"
              payload: { outage_id: "${o_id}", spent_fuel_pool_id: "${pool_id}", cells_requested: 5, purpose: "CONTINGENCY", expected_spent_fuel_pool_version: "${pool_v1}" }
              as: ReactorEngineer
              captures: { res_c_id: "$.data.id" }
            - call: "POST /core-load-patterns/${clp_id}/approve"
              payload: {}
              as: ReactorEngineer
              as_user_id: "re-beta"
            - call: "GET /spent-fuel-pools/${pool_id}"
              payload: {}
              as: ReactorEngineer
              captures: { pool_v2: "$.data.version" }
            - call: "POST /pool-cell-reservations"
              payload: { outage_id: "${o_id}", spent_fuel_pool_id: "${pool_id}", cells_requested: 5, purpose: "DISCHARGE", expected_spent_fuel_pool_version: "${pool_v2}" }
              as: ReactorEngineer
              captures: { res_d_id: "$.data.id" }
          assert:
            - "The first DISCHARGE attempt returns HTTP 409 with ${err_id} == ERR_CORE_LOAD_PATTERN_NOT_APPROVED while CoreLoadPattern.${clp_id}.status == DRAFT"
            - "The rejected attempt left SpentFuelPool.${pool_id}.cells_reserved == 0 and its version unchanged at ${pool_v1}"
            - "The CONTINGENCY request with the identical cells_requested returns HTTP 201, availability_variant NOMINAL and status RESERVED"
            - "CoreLoadPattern.${clp_id}.status == APPROVED and reactivity_margin_pcm == 1586.00 after the approve"
            - "The second DISCHARGE request returns HTTP 201 with PoolCellReservation.${res_d_id}.availability_variant == FULL_CORE_PROTECTED"
            - "SpentFuelPool.${pool_id}.cells_reserved == 10, cells_occupied == 900, cells_available == 290, protected_cells_available == 97"
            - "PoolCellReservation.${res_c_id}.availability_variant == NOMINAL and PoolCellReservation.${res_d_id}.availability_variant == FULL_CORE_PROTECTED — the same pool, the same size, two different admission headrooms"

  # -------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:

      - name: rad_area_half_open_buffered_window_admits_exact_adjacency
        grounds:
          - calculations.rad_area_window_occupancy
          - validations[priority=15]
          - entities.RadArea.fields.survey_buffer_hours
          - errors[ERR_RAD_AREA_WINDOW_CONFLICT]
        distinguishing_aspect: |
          A HALF-OPEN window extended by the area's survey buffer: RWP_1 occupies
          [10, 10 + 6 + 2) = [10, 18), so a permit starting at 17.5 collides while a permit
          starting at exactly 18 is admitted. Only APPROVED permits occupy the area, so a
          rejected request leaves the applicant in DRAFT and the area unoccupied by it.
        test_recipe:
          setup:
            - "Rad area RA-9: dose_rate_mrem_per_hr 25, survey_buffer_hours 2."
            - "Outage UNIT_1 / 2R26 in SCOPE_LOCKED with dose_budget_total_mrem 5000 and an APPROVED work order WO1."
            - "RWP_1 (offset 10, 6h, 2 workers, shielding 0.5) is APPROVED, so the area is occupied over [10, 18)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /rad-areas"
              payload: { station_unit: "UNIT_1", area_code: "RA-9", dose_rate_mrem_per_hr: 25, occupancy_limit_workers: 10, survey_buffer_hours: 2 }
              as: StationAdmin
              captures: { ra_id: "$.data.id" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "2R26", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z", required_training_modules: 4, required_badged_workers: 0 }
              as: StationAdmin
              captures: { o_id: "$.data.id", o_v1: "$.data.version" }
            - call: "POST /outages/${o_id}/core-load-patterns"
              payload: { cycle_length_mwd_mtu: 18000, fresh_assembly_count: 88, discharge_assembly_count: 80, expected_outage_version: "${o_v1}" }
              as: ReactorEngineer
              as_user_id: "re-alpha"
              captures: { clp_id: "$.data.id" }
            - call: "POST /core-load-patterns/${clp_id}/approve"
              payload: {}
              as: ReactorEngineer
              as_user_id: "re-beta"
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "INSPECTION", title: "Reactor head area inspections", estimated_hours: 60, estimated_cost_usd: 150000, estimated_dose_mrem: 100, regulatory_commitment: true, requires_rad_work: true }
              as: OutagePlanner
              captures: { wo1_id: "$.data.id" }
            - call: "POST /work-orders/${wo1_id}/plan"
              payload: {}
              as: OutagePlanner
            - call: "POST /work-orders/${wo1_id}/approve-scope"
              payload: {}
              as: OutageDirector
            - call: "POST /work-orders/${wo1_id}/rwps"
              payload: { rad_area_id: "${ra_id}", worker_count: 2, shielding_factor: 0.5, planned_start_offset_hours: 10, planned_duration_hours: 6 }
              as: RadProtectionPlanner
              captures: { rwp1_id: "$.data.id" }
            - call: "POST /work-orders/${wo1_id}/rwps"
              payload: { rad_area_id: "${ra_id}", worker_count: 2, shielding_factor: 0.5, planned_start_offset_hours: 17.5, planned_duration_hours: 6 }
              as: RadProtectionPlanner
              captures: { rwp2_id: "$.data.id" }
            - call: "POST /work-orders/${wo1_id}/rwps"
              payload: { rad_area_id: "${ra_id}", worker_count: 2, shielding_factor: 0.5, planned_start_offset_hours: 18, planned_duration_hours: 4 }
              as: RadProtectionPlanner
              captures: { rwp3_id: "$.data.id" }
            - call: "POST /outages/${o_id}/lock-scope"
              payload: {}
              as: OutageDirector
            - call: "POST /rwps/${rwp1_id}/approve"
              payload: {}
              as: RadProtectionManager
          trigger:
            - call: "POST /rwps/${rwp2_id}/approve"
              payload: {}
              as: RadProtectionManager
              captures: { err_id: "$.data.error_id" }
            - call: "POST /rwps/${rwp3_id}/approve"
              payload: {}
              as: RadProtectionManager
          assert:
            - "RadiologicalWorkPermit.${rwp1_id}.status == APPROVED and committed_dose_mrem == 180.00"
            - "Approving RWP_2 returns HTTP 409 with ${err_id} == ERR_RAD_AREA_WINDOW_CONFLICT — [17.5, 25.5) intersects [10, 18)"
            - "RadiologicalWorkPermit.${rwp2_id}.status == DRAFT after the rejection and GET /rwps/${rwp2_id}/dose-transactions returns 0 rows"
            - "Approving RWP_3 returns HTTP 200 and RadiologicalWorkPermit.${rwp3_id}.status == APPROVED — a start at exactly 18 is admitted because the occupied window is half-open"
            - "RadiologicalWorkPermit.${rwp3_id}.per_worker_dose_mrem == 50.00, collective_dose_mrem == 100.00, contingency_dose_mrem == 20.00, committed_dose_mrem == 120.00"
            - "Outage.${o_id}.dose_committed_mrem == 300.00 and dose_budget_remaining_mrem == 4700.00 — only the two APPROVED permits are committed"
            - "Outage.${o_id}.alara_posture == NORMAL"

      - name: safety_function_closed_window_aggregates_distinct_trains
        grounds:
          - calculations.safety_function_oos_capacity
          - validations[priority=13]
          - entities.SafetyFunction.fields.max_concurrent_oos_trains
          - errors[ERR_SAFETY_FUNCTION_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          The opposite window convention from the sibling instance and an aggregate rather than a
          pairwise test: the safety-function window is CLOSED, so an activity starting at exactly
          150 collides with one ending at 150, and the limit counts DISTINCT oos_train_label
          values, so a second overlapping activity that re-uses label A is admitted even though a
          non-overlapping activity already holds label B.
        test_recipe:
          setup:
            - "Safety function SF1: trains_total 3, min_trains_required 2, so max_concurrent_oos_trains is 1."
            - "Outage UNIT_1 / 2R26 in PLANNING; A1 takes RHR train A out of service over the closed window [100, 150]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /safety-functions"
              payload: { station_unit: "UNIT_1", function_code: "DECAY_HEAT_REMOVAL", trains_total: 3, min_trains_required: 2 }
              as: StationAdmin
              captures: { sf_id: "$.data.id" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "2R26", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z", required_training_modules: 4, required_badged_workers: 0 }
              as: StationAdmin
              captures: { o_id: "$.data.id" }
            - call: "POST /outages/${o_id}/schedule-activities"
              payload: { label: "RHR train A out of service", planned_start_offset_hours: 100, planned_duration_hours: 50, oos_safety_function_id: "${sf_id}", oos_train_label: "A" }
              as: OutagePlanner
              captures: { a1_id: "$.data.id" }
          trigger:
            - call: "POST /outages/${o_id}/schedule-activities"
              payload: { label: "RHR train B touching at 150", planned_start_offset_hours: 150, planned_duration_hours: 20, oos_safety_function_id: "${sf_id}", oos_train_label: "B" }
              as: OutagePlanner
              captures: { err_id: "$.data.error_id" }
            - call: "POST /outages/${o_id}/schedule-activities"
              payload: { label: "RHR train B starting at 151", planned_start_offset_hours: 151, planned_duration_hours: 20, oos_safety_function_id: "${sf_id}", oos_train_label: "B" }
              as: OutagePlanner
              captures: { a3_id: "$.data.id" }
            - call: "POST /outages/${o_id}/schedule-activities"
              payload: { label: "RHR train A second window", planned_start_offset_hours: 120, planned_duration_hours: 10, oos_safety_function_id: "${sf_id}", oos_train_label: "A" }
              as: OutagePlanner
              captures: { a4_id: "$.data.id" }
          assert:
            - "SafetyFunction.${sf_id}.max_concurrent_oos_trains == 1"
            - "The activity starting at 150 returns HTTP 409 with ${err_id} == ERR_SAFETY_FUNCTION_CAPACITY_EXCEEDED — the closed windows [100, 150] and [150, 170] touch and the distinct labels {A, B} number 2"
            - "The activity starting at 151 returns HTTP 201 — [151, 171] is disjoint from [100, 150]"
            - "The overlapping activity that re-uses label A returns HTTP 201: over [120, 130] the overlapping rows are ${a1_id} and itself, whose DISTINCT label set is {A} with cardinality 1"
            - "ScheduleActivity.${a3_id}.oos_train_label == \"B\" and ScheduleActivity.${a4_id}.oos_train_label == \"A\""
            - "GET /schedule-activities?oos_safety_function_id=${sf_id} returns exactly 3 rows — the rejected request persisted nothing"

  # -------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:

      - name: permit_void_restores_outage_dose_ledger_exactly
        grounds:
          - state_machines.RadiologicalWorkPermit.APPROVED_to_VOIDED
          - state_machines.RadiologicalWorkPermit.HELD_FOR_ALARA_to_DRAFT
          - calculations.outage_dose_ledger
          - calculations.outage_alara_posture
          - entities.DoseTransaction
        distinguishing_aspect: |
          The compensation is APPEND-ONLY over a two-row ledger: voiding does not erase the
          original COMMIT but writes an offsetting RELEASE, and the invariant
          dose_budget_total_mrem == dose_committed_mrem + dose_budget_remaining_mrem must hold
          both before and after. The posture reversal also has to run the hold cascade backwards,
          returning the held sibling permit to DRAFT.
        test_recipe:
          setup:
            - "Rad area RA-10: dose_rate_mrem_per_hr 25, survey_buffer_hours 2."
            - "Outage UNIT_1 / 2R26 in SCOPE_LOCKED with dose_budget_total_mrem 1000 and an APPROVED work order WO1."
            - "RWP_A committed 750.00 is APPROVED, so dose_committed_mrem is 750.00, dose_budget_remaining_mrem is 250.00, alara_posture is RESTRICTED, and sibling RWP_B committed 432.00 has been pushed to HELD_FOR_ALARA."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /rad-areas"
              payload: { station_unit: "UNIT_1", area_code: "RA-10", dose_rate_mrem_per_hr: 25, occupancy_limit_workers: 10, survey_buffer_hours: 2 }
              as: StationAdmin
              captures: { ra_id: "$.data.id" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "2R26", duration_target_hours: 720, dose_budget_total_mrem: 1000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z", required_training_modules: 4, required_badged_workers: 0 }
              as: StationAdmin
              captures: { o_id: "$.data.id", o_v1: "$.data.version" }
            - call: "POST /outages/${o_id}/core-load-patterns"
              payload: { cycle_length_mwd_mtu: 18000, fresh_assembly_count: 88, discharge_assembly_count: 80, expected_outage_version: "${o_v1}" }
              as: ReactorEngineer
              as_user_id: "re-alpha"
              captures: { clp_id: "$.data.id" }
            - call: "POST /core-load-patterns/${clp_id}/approve"
              payload: {}
              as: ReactorEngineer
              as_user_id: "re-beta"
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "INSPECTION", title: "Steam generator secondary side inspection", estimated_hours: 100, estimated_cost_usd: 250000, estimated_dose_mrem: 400, regulatory_commitment: true, requires_rad_work: true }
              as: OutagePlanner
              captures: { wo1_id: "$.data.id" }
            - call: "POST /work-orders/${wo1_id}/plan"
              payload: {}
              as: OutagePlanner
            - call: "POST /work-orders/${wo1_id}/approve-scope"
              payload: {}
              as: OutageDirector
            - call: "POST /work-orders/${wo1_id}/rwps"
              payload: { rad_area_id: "${ra_id}", worker_count: 5, shielding_factor: 0, planned_start_offset_hours: 0, planned_duration_hours: 5 }
              as: RadProtectionPlanner
              captures: { rwp_a_id: "$.data.id" }
            - call: "POST /work-orders/${wo1_id}/rwps"
              payload: { rad_area_id: "${ra_id}", worker_count: 3, shielding_factor: 0.2, planned_start_offset_hours: 20, planned_duration_hours: 6 }
              as: RadProtectionPlanner
              captures: { rwp_b_id: "$.data.id" }
            - call: "POST /outages/${o_id}/lock-scope"
              payload: {}
              as: OutageDirector
            - call: "POST /rwps/${rwp_a_id}/approve"
              payload: { alara_review_reference: "ALARA-2R26-021" }
              as: RadProtectionManager
            - call: "GET /outages/${o_id}"
              payload: {}
              as: OutageDirector
              captures: { committed_before: "$.data.dose_committed_mrem", remaining_before: "$.data.dose_budget_remaining_mrem", posture_before: "$.data.alara_posture" }
          trigger:
            - call: "POST /rwps/${rwp_a_id}/void"
              payload: { void_reason: "Scope moved to the next refueling outage" }
              as: RadProtectionManager
          assert:
            - "${committed_before} == 750.00, ${remaining_before} == 250.00 and ${posture_before} == RESTRICTED — the pre-compensation baseline, which already satisfies 1000 == 750.00 + 250.00"
            - "RadiologicalWorkPermit.${rwp_a_id}.status == VOIDED and void_reason == \"Scope moved to the next refueling outage\""
            - "GET /rwps/${rwp_a_id}/dose-transactions returns exactly 2 rows: COMMIT 750.00 reason RWP_APPROVED, then RELEASE 750.00 reason RWP_VOIDED, in ascending created_at order"
            - "Outage.${o_id}.dose_committed_mrem == 0.00 and dose_budget_remaining_mrem == 1000.00 — restored exactly, not approximately"
            - "Outage.${o_id}.dose_budget_total_mrem == Outage.${o_id}.dose_committed_mrem + Outage.${o_id}.dose_budget_remaining_mrem"
            - "Outage.${o_id}.alara_posture == NORMAL"
            - "RadiologicalWorkPermit.${rwp_b_id}.status == DRAFT — the hold cascade ran in reverse"
            - "RadiologicalWorkPermit.${rwp_a_id}.committed_dose_mrem is still 750.00: the permit keeps its computed dose, the LEDGER is what compensates"

      - name: pool_reservation_release_restores_cell_ledger_exactly
        grounds:
          - state_machines.PoolCellReservation.RESERVED_to_RELEASED
          - calculations.pool_cell_ledger
          - entities.SpentFuelPool.fields.cells_available
          - entities.SpentFuelPool.fields.protected_cells_available
        distinguishing_aspect: |
          A FORWARD-WRITE compensation on a mutable aggregate rather than an append-only ledger:
          releasing must move cells_reserved back down without ever touching cells_occupied, so
          both derived headroom figures return to their pre-reservation values while
          SpentFuelPool.version keeps climbing to 3 — the restoration is a new write, not a
          rollback of the old one.
        test_recipe:
          setup:
            - "Spent fuel pool UNIT_1-SFP: cells_total 1200, cells_baseline_occupied 900, full_core_offload_reserve_cells 193 — cells_occupied 900, cells_reserved 0, cells_available 300, protected_cells_available 107, version 1."
            - "Outage UNIT_1 / 2R26 in PLANNING; a CONTINGENCY reservation of 250 cells is taken against the NOMINAL headroom, driving cells_available to 50 and protected_cells_available to -143."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /spent-fuel-pools"
              payload: { station_unit: "UNIT_1", cells_total: 1200, cells_baseline_occupied: 900, full_core_offload_reserve_cells: 193 }
              as: StationAdmin
              captures: { pool_id: "$.data.id", pool_v1: "$.data.version" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "2R26", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z", required_training_modules: 4, required_badged_workers: 0 }
              as: StationAdmin
              captures: { o_id: "$.data.id" }
            - call: "POST /pool-cell-reservations"
              payload: { outage_id: "${o_id}", spent_fuel_pool_id: "${pool_id}", cells_requested: 250, purpose: "CONTINGENCY", expected_spent_fuel_pool_version: "${pool_v1}" }
              as: ReactorEngineer
              captures: { res_id: "$.data.id" }
            - call: "GET /spent-fuel-pools/${pool_id}"
              payload: {}
              as: ReactorEngineer
              captures: { reserved_before: "$.data.cells_reserved", available_before: "$.data.cells_available", protected_before: "$.data.protected_cells_available", pool_v2: "$.data.version" }
          trigger:
            - call: "POST /pool-cell-reservations/${res_id}/release"
              payload: { release_reason: "Contingency block no longer required" }
              as: ReactorEngineer
          assert:
            - "${reserved_before} == 250, ${available_before} == 50, ${protected_before} == -143 and ${pool_v2} == 2 — the pre-compensation baseline"
            - "PoolCellReservation.${res_id}.status == RELEASED and release_reason == \"Contingency block no longer required\""
            - "SpentFuelPool.${pool_id}.cells_reserved == 0 and cells_occupied == 900 — a release never converts reserved cells into occupied cells"
            - "SpentFuelPool.${pool_id}.cells_available == 300 and protected_cells_available == 107 — identical to the pre-reservation values"
            - "SpentFuelPool.${pool_id}.cells_total == SpentFuelPool.${pool_id}.cells_occupied + SpentFuelPool.${pool_id}.cells_reserved + SpentFuelPool.${pool_id}.cells_available, i.e. 1200 == 900 + 0 + 300"
            - "SpentFuelPool.${pool_id}.version == 3 — the compensation is a forward write on top of version 2, never a revert to version 1"
            - "PoolCellReservation.${res_id}.cells_requested is still 250: the reservation row keeps its size and the POOL LEDGER is what compensates"
