        claim_type: missing_auth
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request with an unknown X-User-Role -> ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (401)."
