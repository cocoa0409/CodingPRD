            - "NationalAgreement.${agr2_id}.status is still DRAFT after the rejection"
            - "activating the 2027-01-01 window returns 200 and NationalAgreement.${agr3_id}.status == ACTIVE, so the day immediately after the incumbent's last day is free"
            - "both ACTIVE agreements coexist on the same fleet with adjacent, non-touching windows, which is exactly what casing_credit_accrual relies on when it asserts at most one ACTIVE agreement covers any given clock date"

      - name: vehicle_wheel_position_single_occupancy
        grounds:
