            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_ra}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 240, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_ra}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/crew-assignments", payload: { trip_request_id: "${trip_ra}", crew_member_id: "${crew_r}", duty_role: "PIC" }, as: DispatchManager, captures: { ca_ra: $.data.id } }
