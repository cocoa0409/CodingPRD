    side_effects: ["status → DENIED"]

  - method: POST
    path: "/api/integration-programs/{programId}/return-authorizations/{rmaId}/begin-discharge"
    description: "Begin safe discharge"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: ["status APPROVED → DISCHARGE_PENDING"]

  - method: POST
    path: "/api/integration-programs/{programId}/return-authorizations/{rmaId}/complete-discharge"
    description: "Record final SOC and complete discharge"
    roles: [QualityEngineer]
    code: 200
    input: [final_soc_percent]
    output: ReturnAuthorization
    side_effects:
      - "status DISCHARGE_PENDING → DISCHARGED"
      - "BatteryPack.soc_percent := final_soc_percent; soc_band recomputed (hysteresis variant if applicable)"
      - "BatteryPack.is_safe_discharged := true; disposition=DISCHARGED"

  - method: POST
    path: "/api/integration-programs/{programId}/return-authorizations/{rmaId}/receive"
    description: "Mark the returned pack received"
    roles: [CustomerService]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: ["status → RECEIVED; pack logistics_status DELIVERED → RETURNED; disposition=SCRAPPED"]

  - method: POST
    path: "/api/integration-programs/{programId}/return-authorizations/{rmaId}/close"
    description: "Close the RMA"
    roles: [CustomerService]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: ["status → CLOSED"]

  # ----- RecallCampaign -----
  - method: POST
    path: "/api/integration-programs/{programId}/recall-campaigns"
    description: "Open a recall campaign"
    roles: [SafetyOfficer]
    code: 201
    input: [recall_code, severity, "scope_lot_id?", "scope_bom_id?", "scope_serial_prefix?"]
    output: RecallCampaign
    side_effects: ["status=DRAFT, packs_in_scope=0, packs_contained=0"]

  - method: GET
    path: "/api/integration-programs/{programId}/recall-campaigns"
    description: "List recall campaigns"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "RecallCampaign[]"
    side_effects: []

  - method: GET
    path: "/api/integration-programs/{programId}/recall-campaigns/{recallId}"
    description: "Get a recall campaign"
    roles: [Any]
    code: 200
    input: []
    output: RecallCampaign
    side_effects: []

  - method: POST
    path: "/api/integration-programs/{programId}/recall-campaigns/{recallId}/activate"
    description: "Activate the recall — cascades to capture packs"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: RecallCampaign
    side_effects:
      - "status DRAFT → ACTIVE"
      - "Compute capture set per recall_capture_set calc"
      - "For each captured pack: assembly_status → RECALLED, active_recall_id set, disposition=RECALLED_HOLD"
      - "For each captured STAGED/STORED pack: force-release placement; slot wh_occupied and program wh_committed decremented"
      - "Program.recall_count += 1; compliance_risk_index -= severity_weight * capture_count"

  - method: POST
    path: "/api/integration-programs/{programId}/recall-campaigns/{recallId}/mark-contained"
    description: "Mark recall contained when all packs recovered"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: RecallCampaign
    side_effects: ["status ACTIVE → CONTAINED"]

  - method: POST
    path: "/api/integration-programs/{programId}/recall-campaigns/{recallId}/close"
    description: "Close a contained recall"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: RecallCampaign
    side_effects:
      - "status → CLOSED"
      - "Program.recall_count -= 1"
      - "BatteryPack.active_recall_id cleared (disposition stays RECALLED_HOLD)"

