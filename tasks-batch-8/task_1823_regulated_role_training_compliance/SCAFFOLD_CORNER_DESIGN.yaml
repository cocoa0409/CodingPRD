scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: regulator_creation_applies_escalation_defaults
        claim_type: defaults
        grounds:
          - "entities.Regulator.fields.escalation_interval_days"
          - "entities.Regulator.fields.reminder_days_before_due"
          - "entities.Regulator.fields.status"
        distinguishing_aspect: "Omitting escalation_interval_days / reminder_days_before_due applies defaults 10 and 7; status starts ACTIVE."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /compliance/regulators", payload: { code: "REG-DEF", name: "Defaults Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 5 }, as: ComplianceAdmin, captures: { iv: "$.data.escalation_interval_days", rd: "$.data.reminder_days_before_due", st: "$.data.status", ver: "$.data.version" } }
          assert:
            - "iv == 10 and rd == 7 (defaults applied)"
            - "st == \"ACTIVE\" and ver == 1"

      - name: employee_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Employee.fields.employee_no"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /compliance/employees without employee_no is rejected 400 ERR_INVALID_REQUEST (schema priority P4)."
        test_recipe:
          setup: ["Role R-MRF exists (no requirements)"]
          setup_api_calls:
            - { call: "POST /compliance/roles", payload: { code: "R-MRF", name: "MRF Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
          trigger:
            - { call: "POST /compliance/employees", payload: { full_name: "No Number", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { err: "$.data.error_id" } }
            - { call: "GET /compliance/employees", payload: {}, as: ComplianceAdmin }
          assert:
            - "err == \"ERR_INVALID_REQUEST\""
            - "GET /compliance/employees -> meta.total_count == 0"

      - name: curriculum_create_with_system_field_input_ignored
        claim_type: system_fields
        grounds:
          - "entities.Curriculum.fields.status"
          - "entities.Curriculum.fields.effective_recordkeeping_years"
        distinguishing_aspect: "Client-supplied system/computed fields (status, effective_recordkeeping_years) in the create body are ignored: the curriculum is born DRAFT with the computed precedence value from its regulator."
        test_recipe:
          setup: ["Regulator REG-SFI (recordkeeping_years 9) exists"]
          setup_api_calls:
            - { call: "POST /compliance/regulators", payload: { code: "REG-SFI", name: "SFI Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 9 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
          trigger:
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-SFI", title: "SFI Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE", status: "ACTIVE", effective_recordkeeping_years: 1 }, as: ComplianceAdmin, captures: { st: "$.data.status", er: "$.data.effective_recordkeeping_years" } }
          assert:
            - "st == \"DRAFT\" (client-injected status ignored)"
            - "er == 9 (computed from regulator default; injected override ignored)"

      - name: assignment_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "validations[priority=5]"
        distinguishing_aspect: "GET on a well-formed but non-existent assignment id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /compliance/assignments/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == \"ERR_NOT_FOUND\" with HTTP 404"

      - name: regulator_create_with_invalid_enum_deadline_mode
        claim_type: type_constraints
        grounds:
          - "entities.Regulator.fields.deadline_mode"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "deadline_mode outside {CALENDAR, BUSINESS_DAYS} is a schema rejection (400), not a business error."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /compliance/regulators", payload: { code: "REG-BAD", name: "Bad", deadline_mode: "WEEKLY", recordkeeping_years: 5 }, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == \"ERR_INVALID_REQUEST\""

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: assignment_born_frozen_when_employee_on_leave
        claim_type: initial_state
        grounds:
          - "state_machines.TrainingAssignment"
          - "entities.TrainingAssignment.fields.deadline_status"
        distinguishing_aspect: "A REQUIREMENT_SWEEP assignment for an ON_LEAVE employee is born ASSIGNED + FROZEN while base_due_at is still computed normally."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; regulator REG-FRZ (CALENDAR); curriculum CUR-FRZ ACTIVE"
            - "Role R-FRZ exists with NO requirements; employee E-FRZ created, then put ON_LEAVE by leave [2026-08-03T00:00:00Z, 2026-08-07T23:59:59Z]"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-FRZ", name: "FRZ Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-FRZ", title: "FRZ Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_id: "$.data.id", cur_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://frz-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-FRZ", name: "FRZ Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-FRZ-1", full_name: "FRZ Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "POST /compliance/employees/${emp}/leaves", payload: { start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-07T23:59:59Z", reason: "Medical" }, as: HRAdmin }
          trigger:
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "INITIAL_ONLY", due_in_days: 5, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}" }, as: ComplianceAdmin, captures: { a_prog: "$.data[0].progress_status", a_dl: "$.data[0].deadline_status", a_due: "$.data[0].base_due_at", a_trig: "$.data[0].trigger_source" } }
          assert:
            - "a_prog == \"ASSIGNED\" and a_dl == \"FROZEN\" (born frozen because employee is ON_LEAVE)"
            - "a_due == \"2026-08-08T09:00:00Z\" (base due still computed: 5 calendar days)"
            - "a_trig == \"REQUIREMENT_SWEEP\""

      - name: assignment_start_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.TrainingAssignment.ASSIGNED_to_IN_PROGRESS"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "start requires ASSIGNED; a second start on the IN_PROGRESS assignment is rejected ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; regulator REG-ST2; curriculum CUR-ST2 ACTIVE; role R-ST2 with SOFT INITIAL_ONLY requirement (due_in_days 30); employee E-ST2 holds assignment A ASSIGNED"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-ST2", name: "ST2 Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-ST2", title: "ST2 Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_id: "$.data.id", cur_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://st2-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-ST2", name: "ST2 Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "INITIAL_ONLY", due_in_days: 30, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-ST2-1", full_name: "ST2 Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}" }, as: ComplianceAdmin, captures: { a: "$.data[0].id" } }
          trigger:
            - { call: "POST /compliance/assignments/${a}/start", payload: {}, as: Employee, as_user_id: "${emp}", captures: { st1: "$.data.progress_status" } }
            - { call: "POST /compliance/assignments/${a}/start", payload: {}, as: Employee, as_user_id: "${emp}", captures: { err: "$.data.error_id" } }
          assert:
            - "st1 == \"IN_PROGRESS\""
            - "err == \"ERR_INVALID_STATE\""

      - name: terminal_failed_assignment_rejects_new_submission
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.TrainingAssignment"
          - "entities.TrainingAssignment.fields.attempts_used"
          - "entities.Employee.fields.compliance_blocked"
        distinguishing_aspect: "With max_attempts=2, two rejects drive attempts_used to 2 and progress to FAILED (terminal); further submissions are rejected and the HARD requirement sets compliance_blocked."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; regulator REG-FAIL; curriculum CUR-FAIL ACTIVE (passing 80, max_attempts 2, NONE)"
            - "Role R-FAIL with HARD INITIAL_ONLY requirement (due_in_days 30); employee E-FAIL holds assignment A"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-FAIL", name: "FAIL Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-FAIL", title: "Fail Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE", max_attempts: 2 }, as: ComplianceAdmin, captures: { cur_id: "$.data.id", cur_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://fail-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-FAIL", name: "FAIL Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "INITIAL_ONLY", due_in_days: 30, criticality: "HARD" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-FAIL-1", full_name: "Fail Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}" }, as: ComplianceAdmin, captures: { a: "$.data[0].id" } }
            - { call: "POST /compliance/assignments/${a}/completions", payload: { score_pct: 90, evidence_type: "NONE" }, as: Employee, as_user_id: "${emp}", captures: { c1: "$.data.id" } }
            - { call: "POST /compliance/completions/${c1}/reject", payload: { review_note: "first reject" }, as: ComplianceAdmin }
            - { call: "POST /compliance/assignments/${a}/completions", payload: { score_pct: 92, evidence_type: "NONE" }, as: Employee, as_user_id: "${emp}", captures: { c2: "$.data.id" } }
            - { call: "POST /compliance/completions/${c2}/reject", payload: { review_note: "second reject" }, as: ComplianceAdmin }
          trigger:
            - { call: "GET /compliance/assignments/${a}", as: ComplianceAdmin, captures: { a_prog: "$.data.progress_status", a_att: "$.data.attempts_used" } }
            - { call: "POST /compliance/assignments/${a}/completions", payload: { score_pct: 99, evidence_type: "NONE" }, as: Employee, as_user_id: "${emp}", captures: { err: "$.data.error_id" } }
            - { call: "GET /compliance/employees/${emp}", as: ComplianceAdmin, captures: { emp_blocked: "$.data.compliance_blocked" } }
          assert:
            - "a_prog == \"FAILED\" and a_att == 2 (second reject reached max_attempts)"
            - "err == \"ERR_ASSIGNMENT_NOT_SUBMITTABLE\" (FAILED is terminal — no further submissions)"
            - "emp_blocked == true (HARD requirement FAILED with no later verified assignment)"

      - name: campaign_finalize_computes_population_metrics
        claim_type: side_effect_execution
        grounds:
          - "state_machines.AttestationCampaign"
          - "calculations.campaign_response_rate"
          - "entities.AttestationCampaign.fields.metrics"
        distinguishing_aspect: "Finalize persists metrics over 3 attestations (1 ATTESTED, 1 EXEMPTED via approved exception, 1 EXPIRED at close): response_rate_pct == 66.67."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; regulator REG-MET; curriculum CUR-MET ACTIVE; roles R-METM (manager M) and R-MET (SOFT INITIAL_ONLY req due 30)"
            - "Employees E-M1, E-M2, E-M3 in R-MET reporting to M; campaign CMP-MET (window 2026-08-01..2026-09-01) OPEN with 3 PENDING attestations"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-MET", name: "MET Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-MET", title: "MET Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_id: "$.data.id", cur_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://met-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-METM", name: "MET Mgr Role" }, as: ComplianceAdmin, captures: { role_mgr: "$.data.id" } }
            - { call: "POST /compliance/roles", payload: { code: "R-MET", name: "MET Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "INITIAL_ONLY", due_in_days: 30, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "M-MET-1", full_name: "Met Mgr", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_mgr}" }, as: HRAdmin, captures: { mgr: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-M1", full_name: "Met One", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}", manager_id: "${mgr}" }, as: HRAdmin, captures: { e1: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-M2", full_name: "Met Two", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}", manager_id: "${mgr}" }, as: HRAdmin, captures: { e2: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-M3", full_name: "Met Three", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}", manager_id: "${mgr}" }, as: HRAdmin, captures: { e3: "$.data.id" } }
            - { call: "POST /compliance/campaigns", payload: { year: 2026, regulator_id: "${reg_id}", window_open_at: "2026-08-01T00:00:00Z", window_close_at: "2026-09-01T00:00:00Z", statement_version: "STMT-MET" }, as: ComplianceAdmin, captures: { camp: "$.data.id" } }
            - { call: "POST /compliance/campaigns/${camp}/open", payload: {}, as: ComplianceAdmin }
            - { call: "GET /compliance/employees/${e1}/attestations", as: ComplianceAdmin, captures: { att1: "$.data[0].id" } }
            - { call: "GET /compliance/employees/${e2}/attestations", as: ComplianceAdmin, captures: { att2: "$.data[0].id" } }
          trigger:
            - { call: "POST /compliance/attestations/${att1}/attest", payload: {}, as: Employee, as_user_id: "${e1}" }
            - { call: "POST /compliance/attestations/${att2}/exceptions", payload: { reason_code: "MILITARY_DUTY", detail: "Reserve duty through September" }, as: Manager, as_user_id: "${mgr}", captures: { exc2: "$.data.id" } }
            - { call: "POST /compliance/exceptions/${exc2}/approve", payload: {}, as: ComplianceAdmin }
            - { call: "POST /compliance/campaigns/${camp}/close", payload: {}, as: ComplianceAdmin }
            - { call: "POST /compliance/campaigns/${camp}/finalize", payload: {}, as: Auditor, captures: { pop: "$.data.metrics.population_size", attd: "$.data.metrics.attested_count", exm: "$.data.metrics.exempted_count", exp: "$.data.metrics.expired_count", rr: "$.data.metrics.response_rate_pct", fst: "$.data.status" } }
          assert:
            - "fst == \"FINALIZED\""
            - "pop == 3 and attd == 1 and exm == 1 and exp == 1"
            - "rr == 66.67 (round_half_up(100*2/3, 2))"

      - name: scheduled_role_change_cancel_then_sweep_does_not_apply
        claim_type: valid_transition
        grounds:
          - "state_machines.EmployeeRoleChange.SCHEDULED_to_CANCELLED"
          - "errors[ERR_ROLE_CHANGE_NOT_CANCELLABLE]"
        distinguishing_aspect: "A cancelled SCHEDULED change is never applied by later sweeps; cancelling twice returns ERR_ROLE_CHANGE_NOT_CANCELLABLE."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; roles R-CX1 and R-CX2 (no requirements); employee E-CX in R-CX1"
            - "Role change RC to R-CX2 effective 2026-08-05T00:00:00Z (SCHEDULED)"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-CX1", name: "CX One" }, as: ComplianceAdmin, captures: { r1: "$.data.id" } }
            - { call: "POST /compliance/roles", payload: { code: "R-CX2", name: "CX Two" }, as: ComplianceAdmin, captures: { r2: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-CX-1", full_name: "CX Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${r1}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "POST /compliance/employees/${emp}/role-changes", payload: { to_role_id: "${r2}", effective_at: "2026-08-05T00:00:00Z" }, as: HRAdmin, captures: { rc: "$.data.id", rc_st: "$.data.status" } }
          trigger:
            - { call: "POST /compliance/role-changes/${rc}/cancel", payload: {}, as: HRAdmin, captures: { rc_st2: "$.data.status" } }
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/_sweeps/run", payload: {}, as: ComplianceAdmin, captures: { sw_rca: "$.data.role_changes_applied" } }
            - { call: "GET /compliance/employees/${emp}", as: ComplianceAdmin, captures: { e_role: "$.data.current_role_id" } }
            - { call: "POST /compliance/role-changes/${rc}/cancel", payload: {}, as: HRAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "rc_st == \"SCHEDULED\"; rc_st2 == \"CANCELLED\""
            - "sw_rca == 0 (cancelled changes are never applied, even past effective_at)"
            - "e_role == ${r1} (unchanged)"
            - "err == \"ERR_ROLE_CHANGE_NOT_CANCELLABLE\""

      - name: role_change_reverse_restores_role_and_cancels_created_assignments
        claim_type: compensation
        grounds:
          - "state_machines.EmployeeRoleChange.APPLIED_to_REVERSED"
          - "entities.TrainingAssignment.fields.source_role_change_id"
          - "entities.TrainingAssignment.fields.trigger_source"
        distinguishing_aspect: "Reverse cancels the change-created assignment (ROLE_CHANGE), restores the prior role, and creates a fresh REVERSAL assignment for the restored role's requirement."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; regulator REG-RV; curricula CUR-RV1, CUR-RV2 ACTIVE"
            - "R-RV1 with req on CUR-RV1 (SOFT, INITIAL_ONLY, due 30); R-RV2 with req on CUR-RV2; employee E-RV in R-RV1 with A1 (CUR-RV1)"
            - "Role change RC to R-RV2 effective_at == clock applies synchronously: A1 CANCELLED, A-new (CUR-RV2, ROLE_CHANGE) created"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-RV", name: "RV Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-RV1", title: "RV One", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur1: "$.data.id", cur1_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur1}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://rv1-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur1}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur1_v}" }, as: ComplianceAdmin }
