        grounds: ["validations[priority=12]", "errors[ERR_CALL_IN_EXPIRED]", state_machines.StaffCallIn.PAGED_to_EXPIRED]
        distinguishing_aspect: "Expiry is inclusive at expires_at: paged at 00:00 with a 60-minute TTL, a confirm at exactly 01:00 fails with ERR_CALL_IN_EXPIRED and leaves the call-in EXPIRED."
        test_recipe:
          setup: ["one ACTIVE reporter; band-1 event activated at the default clock (2026-08-01T00:00:00Z) with pool 1 -> PAGED call-in expiring 2026-08-01T01:00:00Z; clock then advanced to exactly 01:00"]
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep EX", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
