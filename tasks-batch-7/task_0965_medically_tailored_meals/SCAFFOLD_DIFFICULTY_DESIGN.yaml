          assert:
            - "Reauthorization.${a_id}.status == EXPIRED (clock sweep auto-transition)"
            - "error_id == ERR_AUTHORIZATION_NOT_APPROVED"
            - "Claim.${c_id}.status == DRAFT (unchanged)"

  # ---------------------------------------------------------------- rule 8 ---
  - rule_id: resource_temporal_overlap
    instances:
      - name: route_window_half_open_adjacency
        grounds:
          - validations[priority=8]
          - entities.DeliveryRoute.fields.start_time
          - errors[ERR_ROUTE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [start_time, end_time) on the
          DeliveryRoute resource — a route starting at exactly 12:00 does NOT
          collide with one ending at 12:00 (adjacency allowed), but an
          11:00-13:00 route strictly overlapping the 08:00-12:00 interior is
          rejected.
        test_recipe:
          setup:
            - "Route r1 for driver drv-x on 2026-05-06 08:00-12:00 exists (PLANNED)"
          setup_api_calls:
            - { call: "POST /mtm/delivery-routes", payload: { driver_id: "drv-x", route_date: "2026-05-06", start_time: "08:00", end_time: "12:00", capacity_stops: 20 }, as: LogisticsCoordinator, captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /mtm/delivery-routes", payload: { driver_id: "drv-x", route_date: "2026-05-06", start_time: "12:00", end_time: "14:00", capacity_stops: 10 }, as: LogisticsCoordinator, captures: { r2: $.data.id, r2_status: $.data.status } }
            - { call: "POST /mtm/delivery-routes", payload: { driver_id: "drv-x", route_date: "2026-05-06", start_time: "11:00", end_time: "13:00", capacity_stops: 10 }, as: LogisticsCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "adjacent route 12:00-14:00 accepted: DeliveryRoute.${r2}.status == PLANNED"
            - "overlapping route 11:00-13:00 rejected: error_id == ERR_ROUTE_WINDOW_OVERLAP"

      - name: prescription_window_closed_interval_overlap
        grounds:
          - validations[priority=8]
          - entities.DietPrescription.fields.effective_from
          - errors[ERR_PRESCRIPTION_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Different interval semantics on a different resource:
          DietPrescription effective windows are CLOSED [from, to] — a new
          prescription starting 2026-06-30 collides with an existing one ending
          2026-06-30 (shared boundary date IS overlap), while a 2026-07-01
          start is accepted. Adjacency treatment is the exact opposite of the
          route rule.
        test_recipe:
          setup:
            - "ACTIVE member with ACCEPTED referral r1 and ACTIVE prescription p1 effective 2026-01-01..2026-06-30"
            - "Second ACCEPTED referral r2 ready for follow-up prescriptions"
          setup_api_calls:
            - { call: "POST /mtm/members", payload: { full_name: "M Fifteen", payer_type: "MEDICAID_WAIVER", payer_member_id: "W-510", allergies: [], income_fpl_percent: 130, household_size: 2 }, as: CareCoordinator, captures: { m_id: $.data.id, m_v0: $.data.version } }
            - { call: "POST /mtm/members/${m_id}/status", payload: { target_status: "ACTIVE" }, as: CareCoordinator, captures: { m_v1: $.data.version } }
            - { call: "POST /mtm/referrals", payload: { member_id: "${m_id}", diagnosis_codes: ["N18.3"], referred_diet_type: "RENAL", expires_at: "2026-06-30" }, as: ReferringProvider, captures: { r1: $.data.id } }
            - { call: "POST /mtm/referrals/${r1}/decision", payload: { decision: "TRIAGE" }, as: CareCoordinator }
            - { call: "POST /mtm/referrals/${r1}/decision", payload: { decision: "ACCEPT" }, as: CareCoordinator }
            - { call: "POST /mtm/diet-prescriptions", payload: { member_id: "${m_id}", referral_id: "${r1}", diet_type: "RENAL", daily_sodium_mg_max: 2000, daily_potassium_mg_max: 2000, daily_phosphorus_mg_max: 1000, daily_carbs_g_max: 250, daily_protein_g_min: 60, excluded_allergens: [], meals_per_week: 10, effective_from: "2026-01-01", effective_to: "2026-06-30" }, as: Dietitian, captures: { p1: $.data.id } }
            - { call: "POST /mtm/diet-prescriptions/${p1}/activate", payload: { expected_member_version: "${m_v1}" }, as: Dietitian }
            - { call: "POST /mtm/referrals", payload: { member_id: "${m_id}", diagnosis_codes: ["N18.4"], referred_diet_type: "RENAL", expires_at: "2026-12-31" }, as: ReferringProvider, captures: { r2: $.data.id } }
            - { call: "POST /mtm/referrals/${r2}/decision", payload: { decision: "TRIAGE" }, as: CareCoordinator }
            - { call: "POST /mtm/referrals/${r2}/decision", payload: { decision: "ACCEPT" }, as: CareCoordinator }
          trigger:
            - { call: "POST /mtm/diet-prescriptions", payload: { member_id: "${m_id}", referral_id: "${r2}", diet_type: "RENAL", daily_sodium_mg_max: 1800, daily_potassium_mg_max: 2000, daily_phosphorus_mg_max: 1000, daily_carbs_g_max: 250, daily_protein_g_min: 60, excluded_allergens: [], meals_per_week: 10, effective_from: "2026-06-30", effective_to: "2026-12-31" }, as: Dietitian, captures: { err: $.data.error_id } }
            - { call: "POST /mtm/diet-prescriptions", payload: { member_id: "${m_id}", referral_id: "${r2}", diet_type: "RENAL", daily_sodium_mg_max: 1800, daily_potassium_mg_max: 2000, daily_phosphorus_mg_max: 1000, daily_carbs_g_max: 250, daily_protein_g_min: 60, excluded_allergens: [], meals_per_week: 10, effective_from: "2026-07-01", effective_to: "2026-12-31" }, as: Dietitian, captures: { p2: $.data.id, p2_status: $.data.status } }
          assert:
            - "boundary-touching window 2026-06-30.. rejected: error_id == ERR_PRESCRIPTION_WINDOW_OVERLAP (closed interval: shared date collides)"
            - "disjoint window 2026-07-01.. accepted: DietPrescription.${p2}.status == DRAFT"

  # ---------------------------------------------------------------- rule 9 ---
  - rule_id: compensating_invariant
    instances:
      - name: authorization_unit_reserve_release_invariant
        grounds:
          - calculations.authorization_unit_reservation
          - state_machines.Delivery.OUT_FOR_DELIVERY_to_FAILED
          - entities.Reauthorization.fields.available_units
        distinguishing_aspect: |
          Conserved quantity: service units. Scheduling a delivery reserves one
          unit and marking it FAILED is the compensating action; after the pair,
          authorized_units == used_units + reserved_units + available_units
          holds with the exact pre-schedule values (4 == 0 + 0 + 4) — zero drift.
        test_recipe:
          setup:
            - "ACTIVE member, ACTIVE prescription, FROZEN cycle, APPROVED authorization (4 units), DISPATCHED route"
            - "Delivery scheduled (reserved 1, available 3) and OUT_FOR_DELIVERY"
          setup_api_calls:
            - { call: "POST /mtm/members", payload: { full_name: "M Sixteen", payer_type: "MEDICAID_WAIVER", payer_member_id: "W-610", allergies: [], income_fpl_percent: 130, household_size: 2 }, as: CareCoordinator, captures: { m_id: $.data.id, m_v0: $.data.version } }
            - { call: "POST /mtm/members/${m_id}/status", payload: { target_status: "ACTIVE" }, as: CareCoordinator, captures: { m_v1: $.data.version } }
            - { call: "POST /mtm/referrals", payload: { member_id: "${m_id}", diagnosis_codes: ["N18.3"], referred_diet_type: "RENAL", expires_at: "2026-06-30" }, as: ReferringProvider, captures: { r_id: $.data.id } }
            - { call: "POST /mtm/referrals/${r_id}/decision", payload: { decision: "TRIAGE" }, as: CareCoordinator }
            - { call: "POST /mtm/referrals/${r_id}/decision", payload: { decision: "ACCEPT" }, as: CareCoordinator }
            - { call: "POST /mtm/diet-prescriptions", payload: { member_id: "${m_id}", referral_id: "${r_id}", diet_type: "RENAL", daily_sodium_mg_max: 2000, daily_potassium_mg_max: 2000, daily_phosphorus_mg_max: 1000, daily_carbs_g_max: 250, daily_protein_g_min: 60, excluded_allergens: [], meals_per_week: 10, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: Dietitian, captures: { p_id: $.data.id } }
            - { call: "POST /mtm/diet-prescriptions/${p_id}/activate", payload: { expected_member_version: "${m_v1}" }, as: Dietitian }
            - { call: "POST /mtm/menu-items", payload: { name: "Rice Bowl", sodium_mg: 400, potassium_mg: 300, phosphorus_mg: 150, carbs_g: 40, protein_g: 20, allergen_codes: [], base_cost_cents: 700 }, as: ProgramAdmin, captures: { i_a: $.data.id } }
            - { call: "POST /mtm/menu-cycles", payload: { member_id: "${m_id}", prescription_id: "${p_id}", week_start_date: "2026-05-04" }, as: Dietitian, captures: { mc_id: $.data.id } }
            - { call: "POST /mtm/menu-cycles/${mc_id}/items", payload: { menu_item_id: "${i_a}", quantity: 5 }, as: Dietitian }
            - { call: "POST /mtm/menu-cycles/${mc_id}/freeze", payload: {}, as: Dietitian }
            - { call: "POST /mtm/outcome-assessments", payload: { member_id: "${m_id}", assessed_at: "2026-04-20", weight_kg: 75.0, hba1c_pct: 7.0 }, as: Dietitian }
            - { call: "POST /mtm/reauthorizations", payload: { member_id: "${m_id}", authorized_units: 4, max_amount_cents: 500000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CareCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /mtm/reauthorizations/${a_id}/approve", payload: { authorization_number: "AUTH-610" }, as: PayerReviewer }
            - { call: "POST /mtm/delivery-routes", payload: { driver_id: "drv-11", route_date: "2026-05-06", start_time: "08:00", end_time: "12:00", capacity_stops: 20 }, as: LogisticsCoordinator, captures: { rt_id: $.data.id } }
            - { call: "POST /mtm/delivery-routes/${rt_id}/dispatch", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /mtm/deliveries", payload: { member_id: "${m_id}", menu_cycle_id: "${mc_id}", route_id: "${rt_id}", service_date: "2026-05-06" }, as: LogisticsCoordinator, captures: { d_id: $.data.id } }
            - { call: "POST /mtm/deliveries/${d_id}/out-for-delivery", payload: {}, as: Driver }
            - { call: "GET /mtm/reauthorizations/${a_id}", payload: {}, as: LogisticsCoordinator, captures: { res_before: $.data.reserved_units, avail_before: $.data.available_units } }
          trigger:
            - { call: "POST /mtm/deliveries/${d_id}/mark-failed", payload: {}, as: Driver }
            - { call: "GET /mtm/reauthorizations/${a_id}", payload: {}, as: LogisticsCoordinator, captures: { used_after: $.data.used_units, res_after: $.data.reserved_units, avail_after: $.data.available_units } }
          assert:
            - "before compensation: reserved_units == 1 and available_units == 3 (4 == 0 + 1 + 3)"
            - "after mark-failed: used_units == 0, reserved_units == 0, available_units == 4 (4 == 0 + 0 + 4 restored exactly)"
            - "Delivery.${d_id}.status == FAILED"

      - name: member_oop_void_reversal_invariant
        grounds:
          - calculations.claim_ledger_reconciliation
          - state_machines.Claim.PAID_to_VOIDED
          - entities.Member.fields.oop_accumulator_cents
        distinguishing_aspect: |
          Conserved quantity: money (distinct from service units above). A PAID
          remit adds 92 cents to the member's out-of-pocket accumulator and
          1758 to the authorization's consumed amount; the compensating void by
          a DIFFERENT billing operator restores both ledgers bit-identically
          (oop 0, consumed 0) — the void is barred for the submitter by
          segregation of duties.
        test_recipe:
          setup:
            - "Claim PAID (gross 1850, cost share 92, remitted 1758) submitted by bill-1 against the member's authorization"
          setup_api_calls:
            - { call: "POST /mtm/members", payload: { full_name: "M Seventeen", payer_type: "MEDICAID_WAIVER", payer_member_id: "W-710", allergies: [], income_fpl_percent: 145, household_size: 3 }, as: CareCoordinator, captures: { m_id: $.data.id, m_v0: $.data.version } }
            - { call: "POST /mtm/members/${m_id}/status", payload: { target_status: "ACTIVE" }, as: CareCoordinator, captures: { m_v1: $.data.version } }
            - { call: "POST /mtm/referrals", payload: { member_id: "${m_id}", diagnosis_codes: ["N18.3"], referred_diet_type: "RENAL", expires_at: "2026-06-30" }, as: ReferringProvider, captures: { r_id: $.data.id } }
            - { call: "POST /mtm/referrals/${r_id}/decision", payload: { decision: "TRIAGE" }, as: CareCoordinator }
            - { call: "POST /mtm/referrals/${r_id}/decision", payload: { decision: "ACCEPT" }, as: CareCoordinator }
            - { call: "POST /mtm/diet-prescriptions", payload: { member_id: "${m_id}", referral_id: "${r_id}", diet_type: "RENAL", daily_sodium_mg_max: 2000, daily_potassium_mg_max: 2000, daily_phosphorus_mg_max: 1000, daily_carbs_g_max: 250, daily_protein_g_min: 60, excluded_allergens: [], meals_per_week: 10, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: Dietitian, captures: { p_id: $.data.id } }
            - { call: "POST /mtm/diet-prescriptions/${p_id}/activate", payload: { expected_member_version: "${m_v1}" }, as: Dietitian }
            - { call: "POST /mtm/menu-items", payload: { name: "Rice Bowl", sodium_mg: 400, potassium_mg: 300, phosphorus_mg: 150, carbs_g: 40, protein_g: 20, allergen_codes: [], base_cost_cents: 700 }, as: ProgramAdmin, captures: { i_a: $.data.id } }
            - { call: "POST /mtm/menu-items", payload: { name: "Broth Soup", sodium_mg: 100, potassium_mg: 100, phosphorus_mg: 50, carbs_g: 10, protein_g: 10, allergen_codes: [], base_cost_cents: 600 }, as: ProgramAdmin, captures: { i_b: $.data.id } }
            - { call: "POST /mtm/menu-cycles", payload: { member_id: "${m_id}", prescription_id: "${p_id}", week_start_date: "2026-04-13" }, as: Dietitian, captures: { mc_id: $.data.id } }
            - { call: "POST /mtm/menu-cycles/${mc_id}/items", payload: { menu_item_id: "${i_a}", quantity: 1 }, as: Dietitian }
            - { call: "POST /mtm/menu-cycles/${mc_id}/items", payload: { menu_item_id: "${i_b}", quantity: 1 }, as: Dietitian }
            - { call: "POST /mtm/menu-cycles/${mc_id}/freeze", payload: {}, as: Dietitian }
            - { call: "POST /mtm/outcome-assessments", payload: { member_id: "${m_id}", assessed_at: "2026-04-15", weight_kg: 80.5, hba1c_pct: 7.1 }, as: Dietitian }
            - { call: "POST /mtm/reauthorizations", payload: { member_id: "${m_id}", authorized_units: 4, max_amount_cents: 500000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CareCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /mtm/reauthorizations/${a_id}/approve", payload: { authorization_number: "AUTH-710" }, as: PayerReviewer }
            - { call: "POST /mtm/delivery-routes", payload: { driver_id: "drv-12", route_date: "2026-04-15", start_time: "08:00", end_time: "12:00", capacity_stops: 20 }, as: LogisticsCoordinator, captures: { rt_id: $.data.id } }
            - { call: "POST /mtm/delivery-routes/${rt_id}/dispatch", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /mtm/deliveries", payload: { member_id: "${m_id}", menu_cycle_id: "${mc_id}", route_id: "${rt_id}", service_date: "2026-04-15" }, as: LogisticsCoordinator, captures: { d_id: $.data.id } }
            - { call: "POST /mtm/deliveries/${d_id}/out-for-delivery", payload: {}, as: Driver }
            - { call: "POST /mtm/deliveries/${d_id}/mark-delivered", payload: {}, as: Driver }
            - { call: "GET /mtm/reauthorizations/${a_id}", payload: {}, as: BillingSpecialist, captures: { a_v: $.data.version } }
            - { call: "POST /mtm/claims", payload: { member_id: "${m_id}", menu_cycle_id: "${mc_id}", authorization_id: "${a_id}", expected_reauthorization_version: "${a_v}" }, as: BillingSpecialist, captures: { c_id: $.data.id } }
            - { call: "POST /mtm/claims/${c_id}/submit", payload: {}, as: BillingSpecialist, as_user_id: "bill-1" }
            - { call: "POST /mtm/claims/${c_id}/remit", payload: { outcome: "PAID", remitted_amount_cents: 1758 }, as: PayerReviewer }
            - { call: "GET /mtm/members/${m_id}", payload: {}, as: BillingSpecialist, captures: { oop_before: $.data.oop_accumulator_cents } }
          trigger:
            - { call: "POST /mtm/claims/${c_id}/void", payload: {}, as: BillingSpecialist, as_user_id: "bill-2", captures: { c_status: $.data.status } }
            - { call: "GET /mtm/members/${m_id}", payload: {}, as: BillingSpecialist, captures: { oop_after: $.data.oop_accumulator_cents } }
            - { call: "GET /mtm/reauthorizations/${a_id}", payload: {}, as: BillingSpecialist, captures: { consumed_after: $.data.consumed_amount_cents } }
          assert:
            - "after PAID remit: Member.oop_accumulator_cents == 92 and authorization consumed_amount_cents == 1758"
            - "void succeeds for bill-2 (segregated from submitter bill-1): Claim.${c_id}.status == VOIDED"
            - "after void: Member.${m_id}.oop_accumulator_cents == 0 (exact reversal, no drift)"
            - "after void: Reauthorization.${a_id}.consumed_amount_cents == 0 (exact reversal)"
