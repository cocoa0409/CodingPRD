# §1.8 Scaffold Difficulty Design — Test Targeting Index
# 9 Difficulty Rules × 2 instances. All recipes start from empty DB; the logical
# clock boots at 2026-08-01T00:00:00Z unless a recipe sets it.

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: product_exposure_provisional_vs_confirmed
        grounds:
          - calculations.product_gmo_exposure
          - entities.Product.fields.provisional_exposure_pct
          - entities.Product.fields.confirmed_exposure_pct
        distinguishing_aspect: |
          Product-domain dual variant: for identical data, the provisional variant
          assumes untested PCR-required ingredients sit AT the standard threshold
          (0.9) while the confirmed variant counts them as 0 — 40.00 x 0.9 = 36.00
          vs 40.00 x 0 = 0.00; after confirmation both variants converge to 12.00.
        test_recipe:
          setup:
            - "Standard NGMO (threshold 0.9, exemption 0.5); brand B1; product P1 (volume 5000) with ingredients A (HIGH_RISK, 40.00), B (LOW_RISK, 30.00), C (NON_CROP, 30.00)"
            - "A and B hold ACCEPTED affidavits covering now; P1 is UNDER_EVALUATION with one FINISHED_PRODUCT plan (required = min(10, 2+1+0+0) = 3); no samples confirmed yet"
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 5000 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "A", crop_type: "HIGH_RISK", declared_weight_pct: 40.00 }, as: BrandRep, as_user_id: "${b1}", captures: { ingA: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "B", crop_type: "LOW_RISK", declared_weight_pct: 30.00 }, as: BrandRep, as_user_id: "${b1}", captures: { ingB: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "C", crop_type: "NON_CROP", declared_weight_pct: 30.00 }, as: BrandRep, as_user_id: "${b1}" }
            - { call: "POST /affidavits", payload: { ingredient_id: "${ingA}", supplier_name: "SupA", valid_from: "2026-01-01T00:00:00Z", valid_until: "2028-01-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b1}", captures: { affA: $.data.id } }
            - { call: "POST /affidavits", payload: { ingredient_id: "${ingB}", supplier_name: "SupB", valid_from: "2026-01-01T00:00:00Z", valid_until: "2028-01-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b1}", captures: { affB: $.data.id } }
            - { call: "POST /affidavits/${affA}/review", payload: { decision: "ACCEPTED" }, as: VerifierAdmin }
            - { call: "POST /affidavits/${affB}/review", payload: { decision: "ACCEPTED" }, as: VerifierAdmin }
            - { call: "POST /products/${p1}/submit", as: BrandRep, as_user_id: "${b1}" }
            - { call: "POST /products/${p1}/begin-evaluation", as: VerifierAdmin }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { p1v: $.data.version } }
            - { call: "POST /sampling-plans", payload: { product_id: "${p1}", risk_point: "FINISHED_PRODUCT", expected_product_version: "${p1v}" }, as: VerifierAdmin, captures: { plan: $.data.id } }
          trigger:
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { prov1: $.data.provisional_exposure_pct, conf1: $.data.confirmed_exposure_pct } }
            - { call: "POST /samples", payload: { sampling_plan_id: "${plan}", ingredient_id: "${ingA}" }, as: LabAnalyst, as_user_id: "lab-1", captures: { s1: $.data.id } }
            - { call: "POST /samples/${s1}/record-result", payload: { result_gmo_pct: 0.30 }, as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "POST /samples/${s1}/confirm", as: LabAnalyst, as_user_id: "lab-2" }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { prov2: $.data.provisional_exposure_pct, conf2: $.data.confirmed_exposure_pct } }
          assert:
            - "first read: provisional_exposure_pct == 36.00 AND confirmed_exposure_pct == 0.00 (identical data, variants diverge by the untested HIGH_RISK assumption 40.00 x 0.9)"
            - "after confirming sample 0.30: provisional_exposure_pct == 12.00 AND confirmed_exposure_pct == 12.00 (variants converge once evidence exists)"

      - name: brand_penalty_lifetime_vs_rolling_window
        grounds:
          - calculations.brand_penalty_points
          - entities.Brand.fields.lifetime_penalty_points
          - entities.Brand.fields.rolling_penalty_points
        distinguishing_aspect: |
          Brand-domain dual variant (distinct from the Product exposure pair):
          lifetime accumulates all SUBSTANTIATED cases while rolling keeps only
          substantiated_at > now - 365 days; a case exactly 365 days old is
          EXCLUDED from rolling (strictly-greater boundary).
        test_recipe:
          setup:
            - "Brand B1 with two DRAFT products P1, P2 (cases are allowed on unlicensed products); case C1 on P1 substantiated WARNING (+5) at 2026-08-01"
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P2", gtin: "G-P2", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p2: $.data.id } }
            - { call: "POST /enforcement-cases", payload: { product_id: "${p1}", source: "CONSUMER_COMPLAINT", description: "unlicensed seal use" }, as: EnforcementOfficer, as_user_id: "eo-1", captures: { c1: $.data.id } }
            - { call: "POST /enforcement-cases/${c1}/resolve", payload: { outcome: "SUBSTANTIATED", sanction: "WARNING" }, as: EnforcementOfficer, as_user_id: "eo-2" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-01T00:00:00Z" }, as: VerifierAdmin }
            - { call: "GET /brands/${b1}", as: VerifierAdmin, captures: { life1: $.data.lifetime_penalty_points, roll1: $.data.rolling_penalty_points } }
            - { call: "POST /enforcement-cases", payload: { product_id: "${p2}", source: "MARKETPLACE_MONITOR", description: "second violation" }, as: EnforcementOfficer, as_user_id: "eo-1", captures: { c2: $.data.id } }
            - { call: "POST /enforcement-cases/${c2}/resolve", payload: { outcome: "SUBSTANTIATED", sanction: "WARNING" }, as: EnforcementOfficer, as_user_id: "eo-2" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-02T00:00:00Z" }, as: VerifierAdmin }
            - { call: "GET /brands/${b1}", as: VerifierAdmin, captures: { life2: $.data.lifetime_penalty_points, roll2: $.data.rolling_penalty_points } }
          assert:
            - "at 2027-08-01 (exactly 365 days after C1): lifetime_penalty_points == 5 AND rolling_penalty_points == 0 (boundary excluded by strictly-greater)"
            - "at 2027-08-02 after C2: lifetime_penalty_points == 10 AND rolling_penalty_points == 5 (variants diverge on identical case history)"
            - "standing_status == GOOD_STANDING throughout (lifetime 10 < 20)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: required_sample_count_multi_input_tiers
        grounds:
          - calculations.required_sample_count
        distinguishing_aspect: |
          Combinatorial mode (a): >= 3 inputs with nested min plus tiered and
          state-conditional branches — BASE[risk_point] + pcr_ingredient_count +
          volume tier + brand history, capped at 10; the two products differ in
          every input and land on 9 vs 1.
        test_recipe:
          setup:
            - "Brand B1 has a FAILED audit (history_extra 2); product P1 of B1: 3 HIGH_RISK ingredients (pcr_count 3), annual_volume_units 150000 (volume_extra 2), FINISHED_PRODUCT plan (BASE 2) -> min(10, 2+3+2+2) = 9"
            - "Brand B2 clean; product P2 of B2: 1 HIGH_RISK ingredient, volume 5000 (extra 0), INGREDIENT_INTAKE plan (BASE 0) -> min(10, 0+1+0+0) = 1"
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /facility-audits", payload: { brand_id: "${b1}", facility_name: "F1", auditor_id: "aud-1", scheduled_date: "2026-08-05T00:00:00Z" }, as: VerifierAdmin, captures: { au1: $.data.id } }
            - { call: "POST /facility-audits/${au1}/submit-report", payload: { lots: [ { lot_code: "L1", input_qty: 200, recovered_qty: 190 } ] }, as: Auditor, as_user_id: "aud-1" }
            - { call: "POST /facility-audits/${au1}/decide", payload: { decision: "FAILED" }, as: VerifierAdmin }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 150000 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "A", crop_type: "HIGH_RISK", declared_weight_pct: 20.00 }, as: BrandRep, as_user_id: "${b1}", captures: { p1iA: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "B", crop_type: "HIGH_RISK", declared_weight_pct: 20.00 }, as: BrandRep, as_user_id: "${b1}", captures: { p1iB: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "C", crop_type: "HIGH_RISK", declared_weight_pct: 20.00 }, as: BrandRep, as_user_id: "${b1}", captures: { p1iC: $.data.id } }
            - { call: "POST /affidavits", payload: { ingredient_id: "${p1iA}", supplier_name: "S", valid_from: "2026-01-01T00:00:00Z", valid_until: "2028-01-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b1}", captures: { p1affA: $.data.id } }
            - { call: "POST /affidavits", payload: { ingredient_id: "${p1iB}", supplier_name: "S", valid_from: "2026-01-01T00:00:00Z", valid_until: "2028-01-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b1}", captures: { p1affB: $.data.id } }
            - { call: "POST /affidavits", payload: { ingredient_id: "${p1iC}", supplier_name: "S", valid_from: "2026-01-01T00:00:00Z", valid_until: "2028-01-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b1}", captures: { p1affC: $.data.id } }
            - { call: "POST /affidavits/${p1affA}/review", payload: { decision: "ACCEPTED" }, as: VerifierAdmin }
            - { call: "POST /affidavits/${p1affB}/review", payload: { decision: "ACCEPTED" }, as: VerifierAdmin }
            - { call: "POST /affidavits/${p1affC}/review", payload: { decision: "ACCEPTED" }, as: VerifierAdmin }
            - { call: "POST /products/${p1}/submit", as: BrandRep, as_user_id: "${b1}" }
            - { call: "POST /products/${p1}/begin-evaluation", as: VerifierAdmin }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { p1v: $.data.version } }
            - { call: "POST /brands", payload: { name: "B2", contact_email: "b2@x.com" }, as: VerifierAdmin, captures: { b2: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b2}", standard_id: "${std}", name: "P2", gtin: "G-P2", annual_volume_units: 5000 }, as: BrandRep, as_user_id: "${b2}", captures: { p2: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p2}", name: "A", crop_type: "HIGH_RISK", declared_weight_pct: 50.00 }, as: BrandRep, as_user_id: "${b2}", captures: { p2iA: $.data.id } }
            - { call: "POST /affidavits", payload: { ingredient_id: "${p2iA}", supplier_name: "S", valid_from: "2026-01-01T00:00:00Z", valid_until: "2028-01-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b2}", captures: { p2affA: $.data.id } }
            - { call: "POST /affidavits/${p2affA}/review", payload: { decision: "ACCEPTED" }, as: VerifierAdmin }
            - { call: "POST /products/${p2}/submit", as: BrandRep, as_user_id: "${b2}" }
            - { call: "POST /products/${p2}/begin-evaluation", as: VerifierAdmin }
            - { call: "GET /products/${p2}", as: VerifierAdmin, captures: { p2v: $.data.version } }
          trigger:
            - { call: "POST /sampling-plans", payload: { product_id: "${p1}", risk_point: "FINISHED_PRODUCT", expected_product_version: "${p1v}" }, as: VerifierAdmin, captures: { req1: $.data.required_sample_count } }
            - { call: "POST /sampling-plans", payload: { product_id: "${p2}", risk_point: "INGREDIENT_INTAKE", expected_product_version: "${p2v}" }, as: VerifierAdmin, captures: { req2: $.data.required_sample_count } }
          assert:
            - "P1 FINISHED_PRODUCT plan: required_sample_count == 9 (min(10, 2 base + 3 pcr + 2 volume + 2 history))"
            - "P2 INGREDIENT_INTAKE plan: required_sample_count == 1 (min(10, 0 base + 1 pcr + 0 volume + 0 history))"

      - name: traceability_score_per_lot_then_average_rounding
        grounds:
          - calculations.traceability_score
          - entities.FacilityAudit.fields.traceability_score_pct
        distinguishing_aspect: |
          Combinatorial mode (b) — distinct from mode (a): nested rounding order
          is pinned (round each lot to 2dp half-up, then average, then round
          again); the alternative sum-then-divide order yields 95.36 instead of
          95.47 for these lots, so the order is observable.
        test_recipe:
          setup:
            - "Brand B1 with SCHEDULED audit A1 for facility F1 (assigned auditor aud-1)"
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /facility-audits", payload: { brand_id: "${b1}", facility_name: "F1", auditor_id: "aud-1", scheduled_date: "2026-08-05T00:00:00Z" }, as: VerifierAdmin, captures: { au1: $.data.id } }
          trigger:
            - { call: "POST /facility-audits/${au1}/submit-report", payload: { lots: [ { lot_code: "L1", input_qty: 300, recovered_qty: 287 }, { lot_code: "L2", input_qty: 400, recovered_qty: 383 }, { lot_code: "L3", input_qty: 700, recovered_qty: 665 } ] }, as: Auditor, as_user_id: "aud-1", captures: { score: $.data.traceability_score_pct } }
            - { call: "POST /facility-audits/${au1}/decide", payload: { decision: "PASSED" }, as: VerifierAdmin, captures: { st: $.data.status } }
          assert:
            - "traceability_score_pct == 95.47 (per-lot 95.67, 95.75, 95.00; mean 286.42/3 = 95.4733 -> 95.47)"
            - "95.47 >= 95.00 so the PASSED decision is accepted and status == PASSED"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: product_reject_resubmit_cycle
        grounds:
          - state_machines.Product.UNDER_EVALUATION_to_REJECTED
          - state_machines.Product.REJECTED_to_SUBMITTED
        distinguishing_aspect: |
          Product machine is cyclic: UNDER_EVALUATION -> REJECTED -> SUBMITTED
          resubmission loop; rejection_reason is stored at REJECTED and cleared
          back to null by the resubmit edge.
        test_recipe:
          setup:
            - "Product P1 (NON_CROP ingredient only, so no affidavit is needed) is UNDER_EVALUATION"
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "Salt", crop_type: "NON_CROP", declared_weight_pct: 100.00 }, as: BrandRep, as_user_id: "${b1}" }
            - { call: "POST /products/${p1}/submit", as: BrandRep, as_user_id: "${b1}" }
            - { call: "POST /products/${p1}/begin-evaluation", as: VerifierAdmin }
          trigger:
            - { call: "POST /products/${p1}/decide", payload: { decision: "REJECTED", rejection_reason: "incomplete dossier" }, as: VerifierAdmin, captures: { st1: $.data.enrollment_status, rr1: $.data.rejection_reason } }
            - { call: "POST /products/${p1}/resubmit", as: BrandRep, as_user_id: "${b1}", captures: { st2: $.data.enrollment_status, rr2: $.data.rejection_reason } }
          assert:
            - "after decide REJECTED: enrollment_status == REJECTED and rejection_reason == 'incomplete dossier'"
            - "after resubmit: enrollment_status == SUBMITTED and rejection_reason == null (cycle closed)"

      - name: plan_auto_complete_and_invalidate_reopen_cycle
        grounds:
          - state_machines.SamplingPlan.ACTIVE_to_COMPLETED
          - state_machines.SamplingPlan.COMPLETED_to_ACTIVE
          - calculations.sampling_plan_completion
        distinguishing_aspect: |
          SamplingPlan machine is cyclic on a different entity than Product:
          ACTIVE -> COMPLETED auto-fires when confirmed_sample_count reaches
          required (>=), and invalidating the only CONFIRMED sample reverts the
          plan COMPLETED -> ACTIVE, then a fresh confirm completes it again.
        test_recipe:
          setup:
            - "Product UNDER_EVALUATION with one HIGH_RISK 100% ingredient; INGREDIENT_INTAKE plan with required_sample_count == 1 (min(10, 0+1+0+0))"
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "Soy", crop_type: "HIGH_RISK", declared_weight_pct: 100.00 }, as: BrandRep, as_user_id: "${b1}", captures: { ing: $.data.id } }
            - { call: "POST /affidavits", payload: { ingredient_id: "${ing}", supplier_name: "S", valid_from: "2026-01-01T00:00:00Z", valid_until: "2028-01-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b1}", captures: { aff: $.data.id } }
            - { call: "POST /affidavits/${aff}/review", payload: { decision: "ACCEPTED" }, as: VerifierAdmin }
            - { call: "POST /products/${p1}/submit", as: BrandRep, as_user_id: "${b1}" }
            - { call: "POST /products/${p1}/begin-evaluation", as: VerifierAdmin }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { pv: $.data.version } }
            - { call: "POST /sampling-plans", payload: { product_id: "${p1}", risk_point: "INGREDIENT_INTAKE", expected_product_version: "${pv}" }, as: VerifierAdmin, captures: { plan: $.data.id, req: $.data.required_sample_count } }
            - { call: "POST /samples", payload: { sampling_plan_id: "${plan}", ingredient_id: "${ing}" }, as: LabAnalyst, as_user_id: "lab-1", captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /samples/${s1}/record-result", payload: { result_gmo_pct: 0.10 }, as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "POST /samples/${s1}/confirm", as: LabAnalyst, as_user_id: "lab-2" }
            - { call: "GET /sampling-plans/${plan}", as: VerifierAdmin, captures: { st1: $.data.status, cnt1: $.data.confirmed_sample_count } }
            - { call: "POST /samples/${s1}/invalidate", as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "GET /sampling-plans/${plan}", as: VerifierAdmin, captures: { st2: $.data.status, cnt2: $.data.confirmed_sample_count } }
            - { call: "POST /samples", payload: { sampling_plan_id: "${plan}", ingredient_id: "${ing}" }, as: LabAnalyst, as_user_id: "lab-1", captures: { s2: $.data.id } }
            - { call: "POST /samples/${s2}/record-result", payload: { result_gmo_pct: 0.20 }, as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "POST /samples/${s2}/confirm", as: LabAnalyst, as_user_id: "lab-2" }
            - { call: "GET /sampling-plans/${plan}", as: VerifierAdmin, captures: { st3: $.data.status, cnt3: $.data.confirmed_sample_count } }
          assert:
            - "required_sample_count == 1"
            - "after confirm: status == COMPLETED and confirmed_sample_count == 1 (>= boundary at equality)"
            - "after invalidate: status == ACTIVE and confirmed_sample_count == 0 (cycle reopens)"
            - "after new sample confirmed: status == COMPLETED and confirmed_sample_count == 1 (second pass through the loop)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: enforcement_suspension_license_product_brand_cascade
        grounds:
          - state_machines.EnforcementCase.OPENED_to_SUBSTANTIATED
          - state_machines.LabelLicense.ACTIVE_to_SUSPENDED
          - state_machines.Product.VERIFIED_to_SUSPENDED
          - entities.Brand.fields.verified_product_count
        distinguishing_aspect: |
          Depth-3 chain from POST /enforcement-cases/{id}/resolve: the resolution
          suspends the LabelLicense (hop 1); the license suspension flips the
          Product VERIFIED -> SUSPENDED (hop 2); the product leaving VERIFIED
          recomputes Brand.verified_product_count 1 -> 0 (hop 3). Each hop is
          caused by the previous hop, not by the resolve directly.
        test_recipe:
          setup:
            - "Product P1 fully VERIFIED at 2026-08-01 (compliant PCR evidence, current affidavit, fresh PASSED audit); brand verified_product_count == 1; license L1 ACTIVE"
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "Soy", crop_type: "HIGH_RISK", declared_weight_pct: 100.00 }, as: BrandRep, as_user_id: "${b1}", captures: { ing: $.data.id } }
            - { call: "POST /affidavits", payload: { ingredient_id: "${ing}", supplier_name: "S", valid_from: "2026-01-01T00:00:00Z", valid_until: "2028-06-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b1}", captures: { aff: $.data.id } }
            - { call: "POST /affidavits/${aff}/review", payload: { decision: "ACCEPTED" }, as: VerifierAdmin }
            - { call: "POST /products/${p1}/submit", as: BrandRep, as_user_id: "${b1}" }
            - { call: "POST /products/${p1}/begin-evaluation", as: VerifierAdmin }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { pv: $.data.version } }
            - { call: "POST /sampling-plans", payload: { product_id: "${p1}", risk_point: "INGREDIENT_INTAKE", expected_product_version: "${pv}" }, as: VerifierAdmin, captures: { plan: $.data.id } }
            - { call: "POST /samples", payload: { sampling_plan_id: "${plan}", ingredient_id: "${ing}" }, as: LabAnalyst, as_user_id: "lab-1", captures: { s1: $.data.id } }
            - { call: "POST /samples/${s1}/record-result", payload: { result_gmo_pct: 0.10 }, as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "POST /samples/${s1}/confirm", as: LabAnalyst, as_user_id: "lab-2" }
            - { call: "POST /facility-audits", payload: { brand_id: "${b1}", facility_name: "F1", auditor_id: "aud-1", scheduled_date: "2026-08-05T00:00:00Z" }, as: VerifierAdmin, captures: { au: $.data.id } }
            - { call: "POST /facility-audits/${au}/submit-report", payload: { lots: [ { lot_code: "L1", input_qty: 200, recovered_qty: 190 } ] }, as: Auditor, as_user_id: "aud-1" }
            - { call: "POST /facility-audits/${au}/decide", payload: { decision: "PASSED" }, as: VerifierAdmin }
            - { call: "POST /products/${p1}/decide", payload: { decision: "VERIFIED" }, as: VerifierAdmin }
            - { call: "POST /enforcement-cases", payload: { product_id: "${p1}", source: "RETEST_FAILURE", description: "market retest above threshold" }, as: EnforcementOfficer, as_user_id: "eo-1", captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /enforcement-cases/${c1}/resolve", payload: { outcome: "SUBSTANTIATED", sanction: "LICENSE_SUSPENSION" }, as: EnforcementOfficer, as_user_id: "eo-2", captures: { pp: $.data.penalty_points } }
            - { call: "GET /licenses?product_id=${p1}", as: VerifierAdmin, captures: { licStatus: "$.data[0].status", licSuspAt: "$.data[0].suspended_at", licReason: "$.data[0].suspend_reason" } }
