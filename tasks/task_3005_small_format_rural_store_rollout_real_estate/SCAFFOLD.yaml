# =============================================================================
# SCAFFOLD — Small-Format Rural Store Rollout & Real Estate Pipeline
# Task: task_3005_small_format_rural_store_rollout_real_estate
# =============================================================================

scenario: |
  Small-Format Rural Store Rollout & Real Estate Pipeline (Dollar General):
  trade-area screening on drive-time, household income and grocery-gap criteria,
  site control through build-to-suit developer agreements with delivery-date
  penalties, store opening calendar with fixture kits, initial inventory push
  and grand-opening labor plan, format selection between traditional,
  fresh-produce and larger market formats by market data, distribution center
  capacity assignment and stem-mile cost per new store, self-distribution
  frequency and truck fill for low-volume rural stores, cannibalization
  analysis against nearby existing stores, remodel and relocation
  prioritization against new-build capital.

domain_name: rural-store-rollout
api_prefix: /rollouts

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: hierarchical
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (11 entities)
# =============================================================================
entities:
  - name: Rollout
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Rollout name, unique per program" }
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year label of the rollout program (e.g. 2027)" }
      - { name: new_build_capital_budget_cents, type: integer, source: input, description: "Total capital budget allocated to new builds in this program, in cents" }
      - { name: cannibalization_coefficient, type: number, source: input, default: 0.40, description: "Sales-transfer coefficient applied to the overlap matrix (sales-transfer variant of cannibalization_transfer); may be updated only while the program is ACTIVE" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | CLOSED — lifecycle of the program; gates all child operations (cyclic: ACTIVE may revert to DRAFT when no store has advanced past PROPOSED)" }
      - { name: committed_capital_cents, type: integer, source: computed, default: 0, description: "Sum of committed capital: +stores with status NOT IN {KILLED} their build_cost_cents; +approved NEW_BUILD projects their new_build_cost_cents; +approved RELOCATION projects their project_cost_cents; +approved REMODEL projects their remodel_cost_cents" }
      - { name: available_capital_cents, type: integer, source: computed, default: 0, description: "new_build_capital_budget_cents - committed_capital_cents" }
      - { name: event_log_cursor, type: integer, source: system, default: 0, description: "Sequence number of the last RolloutEvent appended; RolloutEvent.sequence_number runs strictly from 1 in created_at order per program" }

  - name: TradeArea
    parent: Rollout
    common_fields: true
    fields:
      - { name: rollout_program_id, type: string, source: system, description: "FK -> Rollout.id; owning program" }
      - { name: name, type: string, source: input, description: "Trade area name, unique within the program" }
      - { name: drive_time_minutes, type: integer, source: input, description: "Median drive time in minutes from candidate centroid to the trade-area population; 0..45" }
      - { name: household_count, type: integer, source: input, description: "Households within the trade area; must be > 0" }
      - { name: median_household_income_cents, type: integer, source: input, description: "Median household income in cents" }
      - { name: grocery_gap_pct, type: number, source: input, description: "Percent of grocery demand currently unserved; 0..100" }
      - { name: status, type: enum, source: system, description: "SCREENING | QUALIFIED | REJECTED — derived at scoring time; REJECTED areas may be re-scored (rescreen loop)" }
      - { name: trade_area_score, type: number, source: computed, description: "Latest computed score; when status is QUALIFIED this is the adjusted value, otherwise the standard value" }
      - { name: projected_revenue_cents, type: integer, source: computed, description: "Last projected annual revenue in cents from the most recent format selection (0 until first selection)" }
      - { name: screening_count, type: integer, source: system, default: 0, description: "Number of times this trade area has been scored; increments on every scoring run including rescreens" }

  - name: Store
    parent: TradeArea
    common_fields: true
    fields:
      - { name: trade_area_id, type: string, source: system, description: "FK -> TradeArea.id; a Store may be created only while the trade area is QUALIFIED" }
      - { name: name, type: string, source: input, description: "Store name, unique within the program" }
      - { name: format_type, type: enum, source: computed, description: "TRADITIONAL | DG_FRESH | DG_MARKET — chosen by format_selection for pipeline stores (never client-supplied there); client-supplied only when registering an EXISTING store (is_existing=true)" }
      - { name: existing_store_id, type: string, source: input, default: null, description: "FK -> Store.id; set for EXISTING stores only — self-referential link to the legacy store record this one replaces (null for greenfield new builds); optional cross-program references allowed" }
      - { name: status, type: enum, source: system, description: "PROPOSED | SITE_CONTROL | UNDER_CONSTRUCTION | DELIVERED | OPEN | KILLED | EXISTING (registration-only terminal state entered directly at creation when is_existing=true)" }
      - { name: stem_miles, type: number, source: system, default: 0, description: "One-way road miles from the assigned DC to the store; copied from DCAssignment at assignment time" }
      - { name: weekly_case_volume_base, type: integer, source: system, description: "Baseline weekly case volume implied by format_type (900 | 1400 | 2600)" }
      - { name: projected_revenue_cents, type: integer, source: system, description: "Projected annual revenue in cents; copied from format_selection onto Store and TradeArea at selection time" }
      - { name: volume_index, type: number, source: system, default: 1.0, description: "Weekly case volume multiplier vs baseline; settable by NETWORK_PLANNER only while the store is PROPOSED" }
      - { name: build_cost_cents, type: integer, source: system, description: "All-in build cost in cents implied by format_type (350000000 | 500000000 | 700000000)" }
      - { name: opening_date, type: datetime, source: system, description: "Planned opening date in ISO 8601; copied from OpeningPlan at plan creation" }
      - { name: open_year_sales_cents, type: integer, source: input, default: null, description: "Actual first-year sales in cents; recorded by FINANCE_ANALYST only for EXISTING stores; feeds cannibalization studies and remodel ROI" }

  - name: Developer
    parent: Rollout
    common_fields: true
    fields:
      - { name: rollout_program_id, type: string, source: system, description: "FK -> Rollout.id; owning program" }
      - { name: name, type: string, source: input, description: "Developer firm name, unique within the program" }
      - { name: active_agreement_count, type: integer, source: computed, default: 0, description: "Count of SiteAgreements with status ACTIVE for this developer; enforces the per-developer cap of 3" }

  - name: SiteControlAgreement
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; the store whose site this agreement controls; at most one agreement with status NOT IN {TERMINATED, COMPLETED} per store" }
      - { name: developer_id, type: string, source: input, description: "FK -> Developer.id; build-to-suit developer counterparty" }
      - { name: committed_delivery_date, type: datetime, source: input, description: "Contractually committed building-delivery date (ISO 8601)" }
      - { name: base_price_cents, type: integer, source: input, description: "Developer contract price in cents; must be > 0" }
      - { name: earnest_money_cents, type: integer, source: input, description: "Earnest money deposit in cents; must be > 0 and < base_price_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | EXECUTED | ACTIVE | DELIVERED | COMPLETED | TERMINATED" }
      - { name: late_days, type: integer, source: system, default: 0, description: "Calendar days late at delivery; 0 when delivered on or before committed_delivery_date" }
      - { name: penalty_cents, type: integer, source: computed, default: 0, description: "Delivery-date penalty accrual computed by delivery_penalty_accrual; 0 while ACTIVE and on time" }

  - name: DistributionCenter
    parent: Rollout
    common_fields: true
    fields:
      - { name: rollout_program_id, type: string, source: system, description: "FK -> Rollout.id; owning program" }
      - { name: name, type: string, source: input, description: "DC name, unique within the program" }
      - { name: store_capacity, type: integer, source: input, description: "Maximum number of stores this DC may serve; must be > 0" }
      - { name: assigned_store_count, type: integer, source: computed, default: 0, description: "Count of DCAssignments with status ACTIVE pointing at this DC (existing-store and rollout-store assignments alike)" }
      - { name: remaining_capacity, type: integer, source: computed, default: 0, description: "store_capacity - assigned_store_count; assignment selector ranks on this" }

  - name: DCAssignment
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; served store; at most one ACTIVE assignment per store" }
      - { name: distribution_center_id, type: string, source: input, description: "FK -> DistributionCenter.id; chosen DC" }
      - { name: stem_miles, type: number, source: input, description: "One-way road miles from DC to store; must be > 0" }
      - { name: deliveries_per_week, type: integer, source: input, description: "Baseline weekly delivery frequency before route planning; must be >= 1" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED" }
      - { name: stem_cost_cents_per_week, type: integer, source: computed, description: "Computed by stem_cost at assignment creation; depends on stem_miles and deliveries_per_week" }

  - name: RoutePlan
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; planned store; at most one ACTIVE route plan per store" }
      - { name: deliveries_per_week, type: integer, source: computed, description: "Planned frequency: max(1, ceil(weekly_cases / 1800))" }
      - { name: cases_per_truck, type: integer, source: computed, description: "ceil(weekly_cases / deliveries_per_week)" }
      - { name: truck_fill_pct, type: number, source: computed, description: "cases_per_truck / 1800 * 100, 2dp round_half_up" }
      - { name: weekly_cost_cents, type: integer, source: computed, description: "deliveries_per_week * (round_trip_miles*285 + per_stop_cents + surcharge)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED — replanning a store supersedes the prior ACTIVE plan and publishes a new one" }

  - name: OpeningPlan
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; the store being opened; one plan per store per cycle" }
      - { name: opening_date, type: datetime, source: input, description: "Planned grand-opening date (ISO 8601); must be at least 45 days in the future and must NOT be more than 30 days before the agreement's committed_delivery_date (agreement still in force)" }
      - { name: fixture_kit_ship_date, type: datetime, source: computed, description: "opening_date - 21 days" }
      - { name: inventory_push_date, type: datetime, source: computed, description: "opening_date - 10 days" }
      - { name: peak_season, type: boolean, source: input, description: "Whether the opening lands in the peak season window; drives the 15% labor uplift" }
      - { name: labor_hours, type: integer, source: computed, description: "Grand-opening labor hours from grand_opening_labor_plan" }
      - { name: labor_cost_cents, type: integer, source: computed, description: "labor_hours * 2400" }
      - { name: status, type: enum, source: system, description: "PLANNED | LOCKED | EXECUTED | CANCELLED" }

  - name: CannibalizationStudy
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; the new store being analyzed" }
      - { name: overlap_entries, type: array, source: input, description: "Array of {existing_store_id, overlap_weight}: existing stores in the SAME program with status IN {OPEN, EXISTING} and open_year_sales_cents recorded; each overlap_weight in (0, 1]; no duplicate existing_store_id; array must be non-empty" }
      - { name: transfer_pct, type: number, source: computed, description: "Total transferred sales / new store projected_revenue_cents * 100, 2dp round_half_up" }
      - { name: recommendation, type: enum, source: computed, description: "PROCEED | MITIGATE | BLOCKED — per-entry impact bands and aggregate threshold" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINAL | SUPERSEDED — creating a new study for the same store supersedes the prior DRAFT/FINAL study" }

  - name: RolloutEvent
    parent: Rollout
    common_fields: false
    fields:
      - { name: rollout_program_id, type: string, source: system, description: "FK -> Rollout.id; owning program" }
      - { name: sequence_number, type: integer, source: system, description: "Strictly increasing per program from 1, assigned in created_at order; mirrors Rollout.event_log_cursor" }
      - { name: event_type, type: enum, source: system, description: "PROGRAM_ACTIVATED | PROGRAM_DEACTIVATED | PROGRAM_CLOSED | TRADE_AREA_QUALIFIED | STORE_OPENED" }
      - { name: store_id, type: string, source: system, default: null, description: "Subject store reference (nullable; informational only — events are program-scoped and the store may live outside this program)" }
      - { name: payload, type: object, source: system, description: "Event-specific snapshot (e.g. score at qualification, opening_date at store opening)" }

  - name: CapitalProject
    parent: Rollout
    common_fields: true
    fields:
      - { name: rollout_program_id, type: string, source: system, description: "FK -> Rollout.id; owning program" }
      - { name: kind, type: enum, source: input, description: "REMODEL | RELOCATION | NEW_BUILD" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; subject store. REMODEL/RELOCATION require an EXISTING store; NEW_BUILD requires a PROPOSED store without an ACTIVE/EXECUTED agreement" }
      - { name: project_cost_cents, type: integer, source: input, description: "RELOCATION cost in cents (required for RELOCATION only)" }
      - { name: remodel_cost_cents, type: integer, source: input, description: "REMODEL cost in cents (required for REMODEL only)" }
      - { name: projected_uplift_cents, type: integer, source: input, description: "Projected annual revenue uplift in cents for REMODEL/RELOCATION; ignored for NEW_BUILD (uplift derives from the store's projected_revenue_cents)" }
      - { name: new_build_cost_cents, type: integer, source: computed, description: "NEW_BUILD effective cost: store.build_cost_cents minus any COMPLETED agreement's penalty credit (0 for REMODEL/RELOCATION)" }
      - { name: capital_score, type: number, source: computed, description: "npv / cost * 100 * kind multiplier, 2dp round_half_up; ranking key for capital_plan_ranking" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | CANCELLED" }
      - { name: decided_at, type: datetime, source: system, description: "Clock timestamp of the APPROVE/REJECT decision; tie-break key in capital_plan_ranking (earlier first); null until decided" }
      - { name: rank, type: integer, source: computed, description: "Rank within decided projects by (capital_score DESC, decided_at ASC); recomputed on every decision" }
      - { name: submitted_by, type: string, source: system, description: "X-User-ID of the FINANCE_ANALYST who submitted the project (DRAFT->SUBMITTED); segregation-of-duties compare key at decide time" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Rollout
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /rollouts/{pid}/activate"
        actor: PROGRAM_ADMIN
        preconditions: ["program.status == DRAFT"]
        side_effects: ["RolloutEvent PROGRAM_ACTIVATED appended (sequence 1 on first activation)"]
      - from: ACTIVE
        to: DRAFT
        trigger: "POST /rollouts/{pid}/deactivate"
        actor: PROGRAM_ADMIN
        preconditions:
          - "program.status == ACTIVE"
          - "no Store in the program with status IN {SITE_CONTROL, UNDER_CONSTRUCTION, DELIVERED} — mid-pipeline stores block deactivation; PROPOSED, KILLED, OPEN, and EXISTING stores do not (ERR_PROGRAM_HAS_ACTIVE_STORES)"
        side_effects: ["RolloutEvent PROGRAM_DEACTIVATED appended"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /rollouts/{pid}/close"
        actor: PROGRAM_ADMIN
        preconditions:
          - "program.status == ACTIVE"
          - "every Store in the program has status IN {KILLED, OPEN, EXISTING}"
          - "every CapitalProject in the program has status IN {APPROVED, REJECTED, CANCELLED} (else ERR_PROGRAM_CLOSE_BLOCKED)"
        side_effects: ["RolloutEvent PROGRAM_CLOSED appended"]
      - from: DRAFT
        to: CLOSED
        trigger: "POST /rollouts/{pid}/close"
        actor: PROGRAM_ADMIN
        preconditions: ["every CapitalProject in the program has status IN {APPROVED, REJECTED, CANCELLED} (else ERR_PROGRAM_CLOSE_BLOCKED)"]
        side_effects: ["RolloutEvent PROGRAM_CLOSED appended"]

  - entity: TradeArea
    initial_state: SCREENING
    terminal_states: [REJECTED]   # rescreenable terminal: REJECTED areas may be re-scored (REJECTED -> QUALIFIED) after a market-data refresh
    transitions:
      - from: SCREENING
        to: QUALIFIED
        trigger: "POST /rollouts/{pid}/trade-areas/{taid}/screen (scoring run)"
        actor: PROGRAM_ADMIN
        preconditions: ["program.status == ACTIVE"]
        side_effects:
          - "trade_area_score computed (standard variant; adjusted variant when the program has 2+ OPEN or EXISTING stores within 10 drive-minutes)"
          - "screening_count += 1"
          - "RolloutEvent TRADE_AREA_QUALIFIED appended"
      - from: SCREENING
        to: REJECTED
        trigger: "POST /rollouts/{pid}/trade-areas/{taid}/screen (scoring run)"
        actor: PROGRAM_ADMIN
        preconditions: ["program.status == ACTIVE", "score fails any criterion (drive_time_minutes > 30, or household_count < 650, or median_household_income_cents < 3500000, or grocery_gap_pct < 12, or trade_area_score < 40)"]
        side_effects: ["screening_count += 1"]
      - from: QUALIFIED
        to: REJECTED
        trigger: "POST /rollouts/{pid}/trade-areas/{taid}/screen (rescreen with refreshed market data that now fails)"
        actor: PROGRAM_ADMIN
        preconditions: ["program.status == ACTIVE", "no Store for this trade area with status NOT IN {KILLED} (ERR_INVALID_STATE)", "score fails any criterion"]
        side_effects: ["trade_area_score recomputed", "screening_count += 1"]
      - from: REJECTED
        to: QUALIFIED
        trigger: "POST /rollouts/{pid}/trade-areas/{taid}/screen (rescreen after market-data refresh)"
        actor: PROGRAM_ADMIN
        preconditions: ["program.status == ACTIVE"]
        side_effects: ["trade_area_score recomputed from refreshed inputs", "screening_count += 1", "RolloutEvent TRADE_AREA_QUALIFIED appended"]
      - from: REJECTED
        to: REJECTED
        trigger: "POST /rollouts/{pid}/trade-areas/{taid}/screen (rescreen still failing)"
        actor: PROGRAM_ADMIN
        preconditions: ["program.status == ACTIVE", "score fails any criterion"]
        side_effects: ["screening_count += 1"]

  - entity: Store
    initial_state: PROPOSED
    terminal_states: [KILLED, EXISTING]
    # creation gates (pipeline path): trade area must be QUALIFIED (ERR_TRADE_AREA_NOT_QUALIFIED);
    # program must be ACTIVE (ERR_PROGRAM_NOT_ACTIVE).
    transitions:
      - from: PROPOSED
        to: SITE_CONTROL
        trigger: "POST /rollouts/{pid}/stores/{sid}/site-agreements/{agid}/execute"
        actor: REAL_ESTATE_MANAGER
        preconditions: ["agreement.status == DRAFT", "agreement.store_id == store.id"]
        side_effects:
          - "agreement.status → EXECUTED (agreement DRAFT→EXECUTED transition)"
          - "store.status → SITE_CONTROL"
      - from: SITE_CONTROL
        to: UNDER_CONSTRUCTION
        trigger: "POST /rollouts/{pid}/stores/{sid}/site-agreements/{agid}/activate"
        actor: REAL_ESTATE_MANAGER
        preconditions: ["agreement.status == EXECUTED", "program.status == ACTIVE"]
        side_effects:
          - "agreement.status → ACTIVE; developer.active_agreement_count += 1"
          - "store.status → UNDER_CONSTRUCTION"
          - "program.committed_capital_cents += store.build_cost_cents (new-build capital committed)"
      - from: UNDER_CONSTRUCTION
        to: DELIVERED
        trigger: "POST /rollouts/{pid}/stores/{sid}/site-agreements/{agid}/deliveries (record delivery)"
        actor: REAL_ESTATE_MANAGER
        preconditions: ["agreement.status == ACTIVE"]
        side_effects:
          - "agreement.status → DELIVERED; late_days and penalty_cents computed by delivery_penalty_accrual; developer.active_agreement_count -= 1"
          - "store.status → DELIVERED"
          - "if late_days >= 30: cascade CANCEL the store's OpeningPlan if status IN {PLANNED, LOCKED} (compensation for unusable opening calendar)"
      - from: DELIVERED
        to: OPEN
        trigger: "POST /rollouts/{pid}/stores/{sid}/opening-plans/{opid}/execute"
        actor: OPERATIONS_LEAD
        preconditions: ["opening_plan.status == LOCKED", "agreement (the one that delivered the store) status == DELIVERED", "clock >= opening_date - 3 days"]
        side_effects:
          - "opening_plan.status → EXECUTED"
          - "agreement.status → COMPLETED; its penalty_cents becomes a penalty credit on the program ledger (available for NEW_BUILD capital scoring)"
          - "store.status → OPEN"
          - "RolloutEvent STORE_OPENED appended"
      - from: PROPOSED
        to: KILLED
        trigger: "POST /rollouts/{pid}/stores/{sid}/kill"
        actor: REAL_ESTATE_MANAGER
        preconditions: ["no agreement for this store with status NOT IN {TERMINATED, COMPLETED} (ERR_SITE_CONTROL_ACTIVE)"]
        side_effects:
          - "DCAssignment ACTIVE → SUPERSEDED; distribution_center.assigned_store_count -= 1"
          - "RoutePlan ACTIVE → SUPERSEDED"
          - "OpeningPlan status IN {PLANNED, LOCKED} → CANCELLED"
      - from: SITE_CONTROL
        to: KILLED
        trigger: "POST /rollouts/{pid}/stores/{sid}/kill"
        actor: REAL_ESTATE_MANAGER
        preconditions: ["no agreement for this store with status NOT IN {TERMINATED, COMPLETED} (ERR_SITE_CONTROL_ACTIVE)"]
        side_effects: ["same cascade as PROPOSED → KILLED"]
      - from: UNDER_CONSTRUCTION
        to: KILLED
        trigger: "POST /rollouts/{pid}/stores/{sid}/kill"
        actor: REAL_ESTATE_MANAGER
        preconditions: ["no agreement for this store with status NOT IN {TERMINATED, COMPLETED} (ERR_SITE_CONTROL_ACTIVE)"]
        side_effects:
          - "same cascade as PROPOSED → KILLED"
          - "program.committed_capital_cents -= store.build_cost_cents (capital released)"
      - from: null
        to: EXISTING
        trigger: "POST /rollouts/{pid}/stores (creation with is_existing=true)"
        actor: PROGRAM_ADMIN
        preconditions: ["program.status == ACTIVE", "referenced trade area exists in the program (any status)"]
        side_effects: ["store created directly in terminal state EXISTING; format selection, agreements, and opening plans do not apply"]

  - entity: SiteControlAgreement
    initial_state: DRAFT
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /rollouts/{pid}/stores/{sid}/site-agreements/{agid}/execute"
        actor: REAL_ESTATE_MANAGER
        preconditions: ["store.status == PROPOSED", "earnest_money_cents > 0 and < base_price_cents (checked at creation; re-verified here)"]
        side_effects: ["store.status → SITE_CONTROL (Store PROPOSED→SITE_CONTROL transition)"]
      - from: EXECUTED
        to: ACTIVE
        trigger: "POST /rollouts/{pid}/stores/{sid}/site-agreements/{agid}/activate"
        actor: REAL_ESTATE_MANAGER
        preconditions:
          - "program.status == ACTIVE (ERR_PROGRAM_NOT_ACTIVE)"
          - "developer.active_agreement_count < 3 (ERR_DEVELOPER_CAPACITY_EXCEEDED)"
        side_effects:
          - "developer.active_agreement_count += 1"
          - "store.status → UNDER_CONSTRUCTION; program.committed_capital_cents += store.build_cost_cents"
      - from: ACTIVE
        to: DELIVERED
        trigger: "POST /rollouts/{pid}/stores/{sid}/site-agreements/{agid}/deliveries"
        actor: REAL_ESTATE_MANAGER
        preconditions: []
        side_effects:
          - "late_days = max(0, floor((actual_delivery_date - committed_delivery_date) / 86400s)); penalty via delivery_penalty_accrual"
          - "developer.active_agreement_count -= 1"
          - "store.status → DELIVERED"
          - "if late_days >= 30: the store's OpeningPlan (status IN {PLANNED, LOCKED}) → CANCELLED"
      - from: DELIVERED
        to: COMPLETED
        trigger: "POST /rollouts/{pid}/stores/{sid}/opening-plans/{opid}/execute (store opens)"
        actor: OPERATIONS_LEAD
        preconditions: ["store.status == DELIVERED"]
        side_effects: ["penalty_cents becomes penalty credit on program ledger", "store.status → OPEN"]
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /rollouts/{pid}/stores/{sid}/site-agreements/{agid}/terminate"
        actor: REAL_ESTATE_MANAGER
        preconditions: []
        side_effects: ["earnest money fully refunded; no kill fee"]
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /rollouts/{pid}/stores/{sid}/site-agreements/{agid}/terminate"
        actor: REAL_ESTATE_MANAGER
        preconditions: []
        side_effects: ["kill fee = 10% of earnest_money_cents forfeited (rounded down to whole cents); store reverts to PROPOSED"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /rollouts/{pid}/stores/{sid}/site-agreements/{agid}/terminate"
        actor: REAL_ESTATE_MANAGER
        preconditions: []
        side_effects:
          - "developer.active_agreement_count -= 1"
          - "kill fee = 10% of earnest_money_cents forfeited"
          - "program.committed_capital_cents -= store.build_cost_cents"
          - "store reverts to PROPOSED"

  - entity: DCAssignment
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /rollouts/{pid}/stores/{sid}/dc-assignments (new assignment) or POST /rollouts/{pid}/stores/{sid}/kill"
        actor: NETWORK_PLANNER | system
        preconditions: []
        side_effects: ["distribution_center.assigned_store_count -= 1 (frees the slot for the incoming assignment or releases it on kill)"]

  - entity: RoutePlan
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /rollouts/{pid}/stores/{sid}/route-plans (replan) or POST /rollouts/{pid}/stores/{sid}/kill"
        actor: NETWORK_PLANNER | system
        preconditions: []
        side_effects: ["new RoutePlan published as ACTIVE by route_planning"]

  - entity: OpeningPlan
    initial_state: PLANNED
    terminal_states: [EXECUTED, CANCELLED]
    transitions:
      - from: PLANNED
        to: LOCKED
        trigger: "POST /rollouts/{pid}/stores/{sid}/opening-plans/{opid}/lock"
        actor: OPERATIONS_LEAD
        preconditions:
          - "store.status == SITE_CONTROL (ERR_OPENING_PLAN_STATE)"
          - "the store's agreement (status EXECUTED) has committed_delivery_date <= fixture_kit_ship_date (ERR_FIXTURE_LEAD_TIME) — fixtures must arrive before building delivery pressure"
        side_effects: ["opening calendar frozen: opening_date immutable while LOCKED"]
      - from: LOCKED
        to: PLANNED
        trigger: "POST /rollouts/{pid}/stores/{sid}/opening-plans/{opid}/unlock"
        actor: OPERATIONS_LEAD
        preconditions: ["store.status IN {SITE_CONTROL, PROPOSED}"]
        side_effects: ["opening calendar unfrozen"]
      - from: LOCKED
        to: EXECUTED
        trigger: "POST /rollouts/{pid}/stores/{sid}/opening-plans/{opid}/execute"
        actor: OPERATIONS_LEAD
        preconditions: ["store.status == DELIVERED", "clock >= opening_date - 3 days (ERR_OPENING_TOO_EARLY)"]
        side_effects: ["agreement → COMPLETED; store → OPEN; RolloutEvent STORE_OPENED appended"]
      - from: PLANNED
        to: CANCELLED
        trigger: "system (store killed or late-delivery cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOCKED
        to: CANCELLED
        trigger: "system (store killed or late-delivery cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CannibalizationStudy
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINAL
        trigger: "POST /rollouts/{pid}/stores/{sid}/cannibalization-studies/{csid}/finalize"
        actor: FINANCE_ANALYST
        preconditions: ["recommendation != BLOCKED (ERR_CANNIBALIZATION_BLOCKED)"]
        side_effects: ["study locked as FINAL; referenced by CapitalProject approval gating"]
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /rollouts/{pid}/stores/{sid}/cannibalization-studies (new study created for same store)"
        actor: FINANCE_ANALYST
        preconditions: []
        side_effects: []
      - from: FINAL
        to: SUPERSEDED
        trigger: "POST /rollouts/{pid}/stores/{sid}/cannibalization-studies (new study created for same store)"
        actor: FINANCE_ANALYST
        preconditions: []
        side_effects: ["capital-project approval gating re-targets the newest FINAL study"]

  - entity: CapitalProject
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /rollouts/{pid}/capital-projects/{cpid}/submit"
        actor: FINANCE_ANALYST
        preconditions:
          - "program.status == ACTIVE"
          - "cost check: (REMODEL) remodel_cost_cents present and > 0; (RELOCATION) project_cost_cents present and > 0; (NEW_BUILD) new_build_cost_cents > 0"
          - "for NEW_BUILD: subject store has a FINAL (non-superseded) CannibalizationStudy (ERR_STUDY_NOT_FINAL)"
        side_effects: ["capital_score computed by capital_scoring"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /rollouts/{pid}/capital-projects/{cpid}/decide (decision=APPROVE)"
        actor: PROGRAM_ADMIN
        preconditions:
          - "the deciding PROGRAM_ADMIN (X-User-ID) is not the FINANCE_ANALYST (submitted_by) who submitted the project (ERR_SEGREGATION_OF_DUTIES)"
          - "effective cost <= program.available_capital_cents (ERR_CAPITAL_BUDGET_EXCEEDED); effective cost = remodel_cost_cents | project_cost_cents | new_build_cost_cents by kind"
        side_effects:
          - "program.committed_capital_cents += effective cost"
          - "rank recomputed across all decided (APPROVED or REJECTED) projects in the program: sort by capital_score DESC, tie-break decided_at ASC"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /rollouts/{pid}/capital-projects/{cpid}/decide (decision=REJECT)"
        actor: PROGRAM_ADMIN
        preconditions: ["same segregation-of-duties check as APPROVE"]
        side_effects: ["rank recomputed across decided projects"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /rollouts/{pid}/capital-projects/{cpid}/cancel"
        actor: FINANCE_ANALYST
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /rollouts/{pid}/capital-projects/{cpid}/cancel"
        actor: FINANCE_ANALYST
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: trade-area-rescreen-stale-version
    parent_entity: TradeArea
    write_endpoint: "POST /rollouts/{pid}/trade-areas/{taid}/screen"
    occ_field: "expected_trade_area_version"
    description: |
      Scoring a TradeArea whose version has advanced since the client last
      observed it is rejected: another screening run (initial or rescreen) has
      already moved the trade area forward, so the caller's view of its status
      and score is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: format-select-stale-store
    parent_entity: Store
    write_endpoint: "POST /rollouts/{pid}/stores/{sid}/select-format"
    occ_field: "expected_store_version"
    description: |
      Selecting a format for a Store whose version has advanced since the
      client last observed it is rejected: a prior format selection (or another
      store mutation) has already changed the store, so the caller's view of
      the store is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: capital-decide-stale-program
    parent_entity: Rollout
    write_endpoint: "POST /rollouts/{pid}/capital-projects/{cpid}/decide"
    occ_field: "expected_program_version"
    description: |
      Deciding a CapitalProject against a Rollout whose version has
      advanced since the client last observed it is rejected: the program's
      committed_capital_cents or budget may have changed (another decision or
      commitment landed), so the caller's budget view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: trade_area_score
    trigger: "POST /rollouts/{pid}/trade-areas/{taid}/screen (initial screen and every rescreen)"
    algorithm: weighted_scoring
    formula: |
      gap_norm  = min(grocery_gap_pct / 40, 1.0)
      income_norm = max(0, min((median_household_income_cents/100 - 25000) / 50000, 1.0))
      drive_norm  = max(0, 1 - drive_time_minutes / 45)
      hh_norm     = min(household_count / 6000, 1.0)
      raw = 0.35*gap_norm + 0.25*income_norm + 0.20*drive_norm + 0.20*hh_norm
      standard_score  = round(raw * 100, 2)
      adjusted_score  = round(raw * 100 * (1 - cannibalization_overlap_pct/100 * 0.5), 2)
        where cannibalization_overlap_pct = count of stores in the SAME program
        with status IN {OPEN, EXISTING} and drive_time_minutes of their trade
        area within 10 minutes of this trade area's, each contributing
        min(their_trade_area.grocery_gap_pct, 25) — overlap capped at 100.
      Final score = adjusted when overlap_pct > 0, else standard.
      QUALIFY when ALL of:
        drive_time_minutes <= 30
        household_count >= 650
        median_household_income_cents >= 3500000
        grocery_gap_pct >= 12
        final score >= 40
      Else REJECTED.
    input_set: "The trade area's current market-data inputs (refreshable while SCREENING/REJECTED via PATCH) and the set of same-program stores with status IN {OPEN, EXISTING}"
    constants:
      WEIGHT_GAP: 0.35
      WEIGHT_INCOME: 0.25
      WEIGHT_DRIVE: 0.20
      WEIGHT_HH: 0.20
      QUALIFY_SCORE_MIN: 40
      DRIVE_TIME_MAX: 30
      HH_MIN: 650
      INCOME_MIN_CENTS: 3500000
      GAP_MIN: 12
    precision: "2 decimal places, round_half_up"
    variants:
      - name: standard
        when: "no same-program OPEN/EXISTING store overlaps (overlap_pct == 0)"
        difference: "score = raw * 100"
      - name: cannibalization_adjusted
        when: "overlap_pct > 0"
        difference: "score = raw * 100 * (1 - overlap_pct/100 * 0.5) — penalizes contested trade areas"

  - name: format_selection
    trigger: "POST /rollouts/{pid}/stores/{sid}/select-format"
    algorithm: threshold
    formula: |
      proj_rev(fmt) = household_count * REV_PER_HH[fmt] * (1 + grocery_gap_pct/100)
        (household_count and grocery_gap_pct from the store's trade area;
         result is in dollars*100 = cents per household-year basis)
      feasible(fmt) = proj_rev(fmt) >= MIN_REVENUE[fmt]
      candidates = { fmt : feasible(fmt) }, evaluated in preference order
        DG_MARKET -> DG_FRESH -> TRADITIONAL; first feasible wins.
      If candidates empty -> ERR_NO_FEASIBLE_FORMAT (422).
    input_set: "Store's trade area market data; store must be PROPOSED and have no ACTIVE/EXECUTED agreement"
    constants:
      REV_PER_HH_TRADITIONAL: 420
      REV_PER_HH_DG_FRESH: 560
      REV_PER_HH_DG_MARKET: 640
      MIN_REVENUE_TRADITIONAL_CENTS: 40000000
      MIN_REVENUE_DG_FRESH_CENTS: 90000000
      MIN_REVENUE_DG_MARKET_CENTS: 220000000
      BUILD_COST_TRADITIONAL_CENTS: 350000000
      BUILD_COST_DG_FRESH_CENTS: 500000000
      BUILD_COST_DG_MARKET_CENTS: 700000000
      WEEKLY_CASES_TRADITIONAL: 900
      WEEKLY_CASES_DG_FRESH: 1400
      WEEKLY_CASES_DG_MARKET: 2600
    precision: "integer cents"
    variants: []

  - name: stem_cost
    trigger: "DCAssignment creation"
    algorithm: aggregation
    formula: |
      standard = stem_miles * 2 * COST_PER_MILE_CENTS * deliveries_per_week
      low_volume = round(standard * 1.25, 0) applied when
        store.weekly_case_volume_base * store.volume_index < 1800 (sub-truckload)
      stem_cost_cents_per_week = low_volume when sub-truckload else standard
    input_set: "DCAssignment stem_miles, deliveries_per_week; Store weekly_case_volume_base and volume_index at assignment time"
    constants:
      COST_PER_MILE_CENTS: 285
      SUB_TRUCKLOAD_CASES: 1800
      LOW_VOLUME_MULTIPLIER: 1.25
    precision: "integer cents, round_half_up"
    variants:
      - name: standard
        when: "weekly case volume >= 1800"
        difference: "plain per-mile rate"
      - name: low_volume
        when: "weekly case volume < 1800"
        difference: "1.25x multiplier for sub-truckload rural stores"

  - name: delivery_penalty_accrual
    trigger: "agreement delivery recorded"
    algorithm: tiered_pricing
    formula: |
      late_days = max(0, floor((actual_delivery_date - committed_delivery_date)/86400s))
      base  = DAILY_PENALTY_CENTS * min(late_days, 180)
      bonus = DAILY_PENALTY_CENTS * (late_days - 60) * 0.5 if late_days > 60 else 0
      penalty_cents = min(base + bonus, PENALTY_CAP_CENTS)
    input_set: "agreement committed_delivery_date, actual delivery timestamp"
    constants:
      DAILY_PENALTY_CENTS: 500000
      BONUS_START_DAY: 60
      ACCRUAL_STOP_DAY: 180
      PENALTY_CAP_CENTS: 45000000
    precision: "integer cents"
    variants: []

  - name: route_planning
    trigger: "POST /rollouts/{pid}/stores/{sid}/route-plans (create or replan)"
    algorithm: constraint_propagation
    formula: |
      weekly_cases = store.weekly_case_volume_base * store.volume_index
      deliveries_per_week = max(1, ceil(weekly_cases / TRUCK_CAPACITY_CASES))
      cases_per_truck = ceil(weekly_cases / deliveries_per_week)
      truck_fill_pct = round(cases_per_truck / TRUCK_CAPACITY_CASES * 100, 2)
      low_fill_surcharge_cents = 15000 if truck_fill_pct < 55 else 0
      weekly_cost_cents = deliveries_per_week *
        (store.stem_miles * 2 * COST_PER_MILE_CENTS + PER_STOP_CENTS + low_fill_surcharge_cents)
      On replan: prior ACTIVE RoutePlan -> SUPERSEDED; new plan ACTIVE.
    input_set: "Store weekly_case_volume_base, volume_index, stem_miles; store must have an ACTIVE DCAssignment (else ERR_NO_ACTIVE_ASSIGNMENT)"
    constants:
      TRUCK_CAPACITY_CASES: 1800
      PER_STOP_CENTS: 35000
      COST_PER_MILE_CENTS: 285
      LOW_FILL_THRESHOLD_PCT: 55
      LOW_FILL_SURCHARGE_CENTS: 15000
    precision: "truck_fill_pct 2dp round_half_up; weekly_cost integer cents"
    variants: []

  - name: cannibalization_transfer
    trigger: "CannibalizationStudy creation"
    algorithm: weighted_scoring
    formula: |
      For each overlap entry e (existing store with open_year_sales_cents S_e
      and overlap_weight w_e in (0,1]):
        transferred_e = round(S_e * w_e * coefficient, 0)      [integer cents]
        impact_pct_e  = round(transferred_e / S_e * 100, 2)
      total_transferred = sum(transferred_e)
      transfer_pct = round(total_transferred / store.projected_revenue_cents * 100, 2)
      recommendation:
        BLOCKED if any impact_pct_e > 20 OR transfer_pct > 15
        MITIGATE if any impact_pct_e > 12 OR transfer_pct > 8
        else PROCEED
      Per-entry rounding happens BEFORE summation (round per line, then sum) —
      this order is pinned; sum-then-round is NOT used.
    input_set: "Study overlap_entries (existing stores, same program, OPEN or EXISTING, open_year_sales_cents recorded); new store projected_revenue_cents; program.cannibalization_coefficient"
    constants:
      ENTRY_BLOCK_PCT: 20
      ENTRY_MITIGATE_PCT: 12
      AGG_BLOCK_PCT: 15
      AGG_MITIGATE_PCT: 8
    precision: "transferred integer cents; percentages 2dp round_half_up"
    variants:
      - name: sales_transfer
        when: "always for recommendation"
        difference: "transferred_e = S_e * w_e * coefficient"
      - name: symmetric_overlap
        when: "sensitivity reporting only (GET .../cannibalization-studies/{id}?variant=symmetric_overlap exposes both)"
        difference: "transferred_e = S_e * w_e * (coefficient/2 + w_e/2) — weights heavily-overlapped stores more; NEVER used for recommendation"

  - name: grand_opening_labor_plan
    trigger: "OpeningPlan creation"
    algorithm: threshold
    formula: |
      base_hours = BASE_HOURS[store.format_type]
      labor_hours = ceil(base_hours * 1.15) if peak_season else base_hours
      labor_cost_cents = labor_hours * LABOR_RATE_CENTS
    input_set: "Store format_type; OpeningPlan peak_season flag"
    constants:
      BASE_HOURS_TRADITIONAL: 220
      BASE_HOURS_DG_FRESH: 340
      BASE_HOURS_DG_MARKET: 520
      PEAK_MULTIPLIER: 1.15
      LABOR_RATE_CENTS: 2400
    precision: "integer hours (ceil), integer cents"
    variants: []

  - name: capital_scoring
    trigger: "CapitalProject submit; rank recompute on every decide"
    algorithm: weighted_scoring
    formula: |
      Effective cost C: REMODEL -> remodel_cost_cents;
        RELOCATION -> project_cost_cents;
        NEW_BUILD -> store.build_cost_cents minus penalty credit from the
          store's COMPLETED agreement (0 when none completed).
      Uplift U: REMODEL/RELOCATION -> projected_uplift_cents;
        NEW_BUILD -> store.projected_revenue_cents.
      npv_cents = U * 3 - C
      capital_score = round(npv_cents / C * 100 * MULTIPLIER[kind], 2)
      rank (decided projects only): capital_score DESC, tie-break decided_at ASC.
    input_set: "Project kind/costs/uplift; store build_cost_cents and projected_revenue_cents for NEW_BUILD"
    constants:
      MULTIPLIER_REMODEL: 1.1
      MULTIPLIER_RELOCATION: 0.9
      MULTIPLIER_NEW_BUILD: 1.0
      NPV_YEARS: 3
    precision: "score 2dp round_half_up"
    variants: []

  - name: capital_commitment_reconciliation
    trigger: "every mutation that creates/removes committed capital (agreement activate/terminate, store kill, capital decide)"
    algorithm: aggregation
    formula: |
      committed_capital_cents =
          sum(store.build_cost_cents for stores with status NOT IN {KILLED} and status >= UNDER_CONSTRUCTION in pipeline terms, i.e. status IN {UNDER_CONSTRUCTION, DELIVERED, OPEN})
        + sum(new_build_cost_cents for CapitalProjects kind=NEW_BUILD status=APPROVED)
        + sum(project_cost_cents for CapitalProjects kind=RELOCATION status=APPROVED)
        + sum(remodel_cost_cents for CapitalProjects kind=REMODEL status=APPROVED)
      available_capital_cents = new_build_capital_budget_cents - committed_capital_cents
      Invariant: committed + available == budget at all times; killing an
      UNDER_CONSTRUCTION store or terminating an ACTIVE agreement MUST release
      exactly the store's build_cost_cents (no drift).
    input_set: "All stores and capital projects in the program"
    constants: {}
    precision: "integer cents"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path resources exist and belong to the URL chain (rollout -> trade-area -> store -> child), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Required request-body fields present, well-typed; enum values in declared sets"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 5
    category: state
    check: "Target resource in a state from which the transition is defined (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "Rollout must be ACTIVE for child-creating and committing operations (screen, store create, agreement activate, route plan, opening plan create, study create, capital submit, decide)"
    error_id: ERR_PROGRAM_NOT_ACTIVE
    http_status: 409
    applies_to: "child-creating and committing endpoints"
  - priority: 7
    category: business_temporal
    check: "Rollout clock gates: opening_date must be >= clock + 45 days at plan creation; execute requires clock >= opening_date - 3 days"
    error_id: ERR_OPENING_TOO_EARLY
    http_status: 409
    applies_to: "opening-plan create/execute"
  - priority: 8
    category: business_referential
    check: "Foreign-key referential integrity: developer/dc/existing_store/store references resolve inside the program; overlap entries reference EXISTING/OPEN stores with recorded sales"
    error_id: ERR_BAD_REFERENCE
    http_status: 422
    applies_to: "agreement create, dc-assignment create, study create, capital-project create, store create"
  - priority: 9
    category: business_constraint
    check: "Uniqueness and singleton rules: one open agreement per store; one ACTIVE DCAssignment per store; one ACTIVE RoutePlan per store (replan supersedes); one PLANNED/LOCKED OpeningPlan per store"
    error_id: ERR_DUPLICATE_ACTIVE
    http_status: 409
    applies_to: "agreement create, dc-assignment create, opening-plan create"
  - priority: 10
    category: business_constraint
    check: "Store preconditions: format selection requires PROPOSED and no open agreement; volume_index editable only while PROPOSED; opening plan requires an EXECUTED agreement whose committed_delivery_date is at most 30 days after opening_date"
    error_id: ERR_STORE_PRECONDITION
    http_status: 409
    applies_to: "select-format, volume update, opening-plan create"
  - priority: 11
    category: business_constraint
    check: "Opening-plan calendar: committed_delivery_date <= fixture_kit_ship_date at lock (fixtures arrive 21 days pre-opening)"
    error_id: ERR_FIXTURE_LEAD_TIME
    http_status: 409
    applies_to: "opening-plan lock"
  - priority: 12
    category: business_constraint
    check: "Cannibalization gating: study finalize blocked when recommendation == BLOCKED"
    error_id: ERR_CANNIBALIZATION_BLOCKED
    http_status: 409
    applies_to: "study finalize"
  - priority: 13
    category: business_referential
    check: "NEW_BUILD capital submit requires FINAL non-superseded CannibalizationStudy for the subject store"
    error_id: ERR_STUDY_NOT_FINAL
    http_status: 409
    applies_to: "capital-project submit"
  - priority: 14
    category: business_safety
    check: "Segregation of duties: the PROGRAM_ADMIN deciding a CapitalProject must not be the FINANCE_ANALYST (submitted_by) who submitted it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "capital-project decide"
  - priority: 15
    category: business_constraint
    check: "Developer capacity: developer.active_agreement_count < 3 at agreement activation"
    error_id: ERR_DEVELOPER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "agreement activate"
  - priority: 16
    category: business_constraint
    check: "DC capacity: distribution_center.remaining_capacity >= 1 at assignment"
    error_id: ERR_DC_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "dc-assignment create"
  - priority: 17
    category: business_fiscal
    check: "Capital budget: effective project cost <= program.available_capital_cents at approval"
    error_id: ERR_CAPITAL_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "capital-project decide"
  - priority: 18
    category: state
    check: "OCC: expected_*_version matches current parent version (stale -> 412)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "screen, select-format, capital decide"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving ---

  - method: POST
    path: "/rollouts"
    description: "Create a rollout program (DRAFT)"
    roles: [PROGRAM_ADMIN]
    code: 201
    input: [name, fiscal_year, new_build_capital_budget_cents, "cannibalization_coefficient?"]
    output: Rollout
    side_effects: ["status=DRAFT, committed_capital_cents=0"]
  - method: GET
    path: "/rollouts"
    description: "List rollout programs (paginated)"
    roles: [PROGRAM_ADMIN, REAL_ESTATE_MANAGER, NETWORK_PLANNER, OPERATIONS_LEAD, FINANCE_ANALYST]
    code: 200
    input: ["limit?", "offset?"]
    output: Rollout[]
    side_effects: []

  - method: POST
    path: "/rollouts/_clock-set"
    description: "Test-driving endpoint: set a program's logical clock (rollout_program_id in body; ISO 8601). Before any set call the clock reads exactly 2026-09-01T00:00:00Z — the server startup default; it MUST NOT fall back to real wall-clock time."
    roles: [PROGRAM_ADMIN]
    code: 200
    input: [rollout_program_id, to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["logical clock advanced"]

  - method: GET
    path: "/rollouts/{pid}"
    description: "Get a rollout program"
    roles: [PROGRAM_ADMIN, REAL_ESTATE_MANAGER, NETWORK_PLANNER, OPERATIONS_LEAD, FINANCE_ANALYST]
    code: 200
    input: []
    output: Rollout
    side_effects: []
  - method: POST
    path: "/rollouts/{pid}/activate"
    description: "Activate program (DRAFT -> ACTIVE)"
    roles: [PROGRAM_ADMIN]
    code: 200
    input: []
    output: Rollout
    side_effects: ["RolloutEvent PROGRAM_ACTIVATED appended"]
  - method: POST
    path: "/rollouts/{pid}/deactivate"
    description: "Return program to DRAFT (ACTIVE -> DRAFT) — blocked by mid-pipeline stores (SITE_CONTROL/UNDER_CONSTRUCTION/DELIVERED)"
    roles: [PROGRAM_ADMIN]
    code: 200
    input: []
    output: Rollout
    side_effects: ["RolloutEvent PROGRAM_DEACTIVATED appended"]
  - method: POST
    path: "/rollouts/{pid}/close"
    description: "Close program (DRAFT/ACTIVE -> CLOSED) — terminal; blocked by undecided capital projects or mid-pipeline stores"
    roles: [PROGRAM_ADMIN]
    code: 200
    input: []
    output: Rollout
    side_effects: ["RolloutEvent PROGRAM_CLOSED appended"]
  - method: GET
    path: "/rollouts/program-events"
    description: "List rollout events in sequence order (event-sourcing read); filter by rollout_program_id"
    roles: [PROGRAM_ADMIN, REAL_ESTATE_MANAGER, NETWORK_PLANNER, OPERATIONS_LEAD, FINANCE_ANALYST]
    code: 200
    input: ["rollout_program_id?", "limit?", "offset?"]
    output: RolloutEvent[]
    side_effects: []

  - method: PATCH
    path: "/rollouts/{pid}/settings"
    description: "Update program settings (cannibalization_coefficient, budget) — ACTIVE programs only"
    roles: [PROGRAM_ADMIN]
    code: 200
    input: ["new_build_capital_budget_cents?", "cannibalization_coefficient?"]
    output: Rollout
    side_effects: ["available_capital_cents recomputed"]

  - method: POST
    path: "/rollouts/trade-areas"
    description: "Create a trade area (SCREENING)"
    roles: [PROGRAM_ADMIN]
    code: 201
    input: [rollout_program_id, name, drive_time_minutes, household_count, median_household_income_cents, grocery_gap_pct]
    output: TradeArea
    side_effects: ["status=SCREENING, screening_count=0"]
  - method: GET
    path: "/rollouts/trade-areas"
    description: "List trade areas (paginated; optional status filter)"
    roles: [PROGRAM_ADMIN, REAL_ESTATE_MANAGER, NETWORK_PLANNER, OPERATIONS_LEAD, FINANCE_ANALYST]
    code: 200
    input: ["rollout_program_id?", "status?", "limit?", "offset?"]
    output: TradeArea[]
    side_effects: []
  - method: GET
    path: "/rollouts/trade-areas/{taid}"
    description: "Get a trade area by id"
    roles: [PROGRAM_ADMIN, REAL_ESTATE_MANAGER, NETWORK_PLANNER, OPERATIONS_LEAD, FINANCE_ANALYST]
    code: 200
    input: []
    output: TradeArea
    side_effects: []
  - method: PATCH
    path: "/rollouts/trade-area-updates"
    description: "Refresh market data for a trade area (trade_area_id in body) — only while SCREENING or REJECTED"
    roles: [PROGRAM_ADMIN]
    code: 200
    input: [rollout_program_id, trade_area_id, "drive_time_minutes?", "household_count?", "median_household_income_cents?", "grocery_gap_pct?"]
    output: TradeArea
    side_effects: ["increments TradeArea.version by 1"]
  - method: POST
    path: "/rollouts/trade-areas/{taid}/screen"
    description: "Run (or re-run) trade-area scoring; qualifies or rejects per trade_area_score (OCC on TradeArea.version)"
    roles: [PROGRAM_ADMIN]
    code: 200
    input: [rollout_program_id, expected_trade_area_version]
    output: TradeArea
    side_effects:
      - "trade_area_score computed (standard or cannibalization_adjusted variant)"
      - "status -> QUALIFIED or REJECTED; screening_count += 1"
      - "increments TradeArea.version by 1"

  - method: POST
    path: "/rollouts/stores"
    description: "Create a store in a QUALIFIED trade area. With is_existing=true the store is registered directly as EXISTING (terminal) for cannibalization/remodel analysis; existing_store_id links the legacy record."
    roles: [PROGRAM_ADMIN]
    code: 201
    input: [rollout_program_id, trade_area_id, name, "is_existing?", "existing_store_id?", "open_year_sales_cents?", "format_type?"]
    output: Store
    side_effects: ["status=PROPOSED (or EXISTING when is_existing)"]
  - method: GET
    path: "/rollouts/stores"
    description: "List stores (paginated; filters: status, format_type, trade_area_id, existing_store_id)"
    roles: [PROGRAM_ADMIN, REAL_ESTATE_MANAGER, NETWORK_PLANNER, OPERATIONS_LEAD, FINANCE_ANALYST]
    code: 200
    input: ["rollout_program_id?", "status?", "format_type?", "trade_area_id?", "existing_store_id?", "limit?", "offset?"]
    output: Store[]
    side_effects: []
  - method: GET
    path: "/rollouts/stores/{sid}"
    description: "Get a store by id"
    roles: [PROGRAM_ADMIN, REAL_ESTATE_MANAGER, NETWORK_PLANNER, OPERATIONS_LEAD, FINANCE_ANALYST]
    code: 200
    input: []
    output: Store
    side_effects: []
  - method: PATCH
    path: "/rollouts/stores/{sid}"
    description: "Update volume_index — only while the store is PROPOSED"
    roles: [NETWORK_PLANNER]
    code: 200
    input: [rollout_program_id, volume_index]
    output: Store
    side_effects: ["increments Store.version by 1"]
  - method: POST
    path: "/rollouts/stores/{sid}/select-format"
    description: "Run format_selection for a PROPOSED store; sets format_type, projected_revenue_cents, weekly_case_volume_base, build_cost_cents; copies projected_revenue_cents to the trade area (OCC on Store.version)"
    roles: [REAL_ESTATE_MANAGER]
    code: 200
    input: [rollout_program_id, expected_store_version]
    output: Store
    side_effects:
      - "format_type / projected_revenue_cents / weekly_case_volume_base / build_cost_cents computed"
      - "trade_area.projected_revenue_cents updated"
      - "increments Store.version by 1"
  - method: POST
    path: "/rollouts/stores/{sid}/kill"
    description: "Kill a proposed/pipeline store — cascades: DCAssignment SUPERSEDED (DC count freed), RoutePlan SUPERSEDED, OpeningPlan CANCELLED, committed capital released"
    roles: [REAL_ESTATE_MANAGER]
    code: 200
    input: [rollout_program_id]
    output: Store
    side_effects:
      - "store.status -> KILLED"
      - "DCAssignment ACTIVE -> SUPERSEDED; dc.assigned_store_count -= 1"
      - "RoutePlan ACTIVE -> SUPERSEDED"
      - "OpeningPlan PLANNED/LOCKED -> CANCELLED"
      - "program.committed_capital_cents -= store.build_cost_cents when status was UNDER_CONSTRUCTION"
  - method: POST
    path: "/rollouts/stores/{sid}/record-sales"
    description: "Record open_year_sales_cents on an EXISTING store"
    roles: [FINANCE_ANALYST]
    code: 200
    input: [rollout_program_id, open_year_sales_cents]
    output: Store
    side_effects: ["increments Store.version by 1"]

  - method: POST
    path: "/rollouts/developers"
    description: "Register a build-to-suit developer"
    roles: [PROGRAM_ADMIN]
    code: 201
    input: [rollout_program_id, name]
    output: Developer
    side_effects: ["active_agreement_count=0"]
  - method: GET
    path: "/rollouts/developers"
    description: "List developers"
    roles: [PROGRAM_ADMIN, REAL_ESTATE_MANAGER, NETWORK_PLANNER, OPERATIONS_LEAD, FINANCE_ANALYST]
    code: 200
    input: ["rollout_program_id?", "limit?", "offset?"]
    output: Developer[]
    side_effects: []

  - method: POST
    path: "/rollouts/site-agreements"
    description: "Create a build-to-suit site control agreement (DRAFT) for a PROPOSED store"
    roles: [REAL_ESTATE_MANAGER]
    code: 201
    input: [rollout_program_id, store_id, developer_id, committed_delivery_date, base_price_cents, earnest_money_cents]
    output: SiteControlAgreement
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/rollouts/site-agreements"
    description: "List site control agreements (filterable by developer_id, store_id)"
    roles: [PROGRAM_ADMIN, REAL_ESTATE_MANAGER, NETWORK_PLANNER, OPERATIONS_LEAD, FINANCE_ANALYST]
    code: 200
    input: ["developer_id?", "store_id?", "limit?", "offset?"]
    output: SiteControlAgreement[]
    side_effects: []
  - method: POST
    path: "/rollouts/site-agreements/{agid}/execute"
    description: "Execute agreement (DRAFT -> EXECUTED); store -> SITE_CONTROL"
    roles: [REAL_ESTATE_MANAGER]
    code: 200
    input: [rollout_program_id]
    output: SiteControlAgreement
    side_effects: ["store.status -> SITE_CONTROL"]
  - method: POST
    path: "/rollouts/site-agreements/{agid}/activate"
    description: "Activate agreement (EXECUTED -> ACTIVE); developer capacity enforced; store -> UNDER_CONSTRUCTION; capital committed"
    roles: [REAL_ESTATE_MANAGER]
    code: 200
    input: [rollout_program_id]
    output: SiteControlAgreement
    side_effects:
      - "developer.active_agreement_count += 1"
      - "store.status -> UNDER_CONSTRUCTION"
      - "program.committed_capital_cents += store.build_cost_cents"
  - method: POST
    path: "/rollouts/site-agreements/{agid}/deliveries"
    description: "Record building delivery (ACTIVE -> DELIVERED); computes late_days and penalty_cents; store -> DELIVERED; late >= 30 days cascades opening-plan cancellation"
    roles: [REAL_ESTATE_MANAGER]
    code: 200
    input: [rollout_program_id, actual_delivery_date]
    output: SiteControlAgreement
    side_effects:
      - "late_days / penalty_cents computed by delivery_penalty_accrual"
      - "developer.active_agreement_count -= 1"
      - "store.status -> DELIVERED"
      - "OpeningPlan PLANNED/LOCKED -> CANCELLED when late_days >= 30"
  - method: POST
    path: "/rollouts/site-agreements/{agid}/terminate"
    description: "Terminate agreement (DRAFT/EXECUTED/ACTIVE -> TERMINATED); kill fee and capital release per state; store reverts to PROPOSED"
    roles: [REAL_ESTATE_MANAGER]
    code: 200
    input: [rollout_program_id]
    output: SiteControlAgreement
    side_effects:
      - "EXECUTED/ACTIVE: kill fee 10% of earnest_money_cents; store reverts to PROPOSED"
      - "ACTIVE: developer.active_agreement_count -= 1; program.committed_capital_cents -= store.build_cost_cents"

  - method: POST
    path: "/rollouts/distribution-centers"
    description: "Register a distribution center"
    roles: [NETWORK_PLANNER]
    code: 201
    input: [rollout_program_id, name, store_capacity]
    output: DistributionCenter
    side_effects: ["assigned_store_count=0"]
  - method: GET
    path: "/rollouts/distribution-centers"
    description: "List distribution centers"
    roles: [PROGRAM_ADMIN, REAL_ESTATE_MANAGER, NETWORK_PLANNER, OPERATIONS_LEAD, FINANCE_ANALYST]
    code: 200
    input: ["rollout_program_id?", "limit?", "offset?"]
    output: DistributionCenter[]
    side_effects: []

  - method: POST
    path: "/rollouts/dc-assignments"
    description: "Assign a DC to a store; supersedes any ACTIVE assignment; computes stem_cost_cents_per_week"
    roles: [NETWORK_PLANNER]
    code: 201
    input: [rollout_program_id, store_id, distribution_center_id, stem_miles, deliveries_per_week]
    output: DCAssignment
    side_effects:
      - "prior ACTIVE assignment -> SUPERSEDED (old dc.assigned_store_count -= 1)"
      - "dc.assigned_store_count += 1"
      - "store.stem_miles copied from assignment"
      - "stem_cost computed (standard or low_volume variant)"
  - method: GET
    path: "/rollouts/dc-assignments"
    description: "List DC assignments for a store"
    roles: [PROGRAM_ADMIN, REAL_ESTATE_MANAGER, NETWORK_PLANNER, OPERATIONS_LEAD, FINANCE_ANALYST]
    code: 200
    input: ["store_id?", "distribution_center_id?", "status?", "limit?", "offset?"]
    output: DCAssignment[]
    side_effects: []

  # --- RoutePlan ---
  - method: POST
    path: "/rollouts/route-plans"
    description: "Plan (or replan) self-distribution for a store with an ACTIVE DCAssignment; publishes ACTIVE plan, supersedes prior"
    roles: [NETWORK_PLANNER]
    code: 201
    input: [rollout_program_id, store_id]
    output: RoutePlan
    side_effects:
      - "prior ACTIVE RoutePlan -> SUPERSEDED"
      - "deliveries_per_week / cases_per_truck / truck_fill_pct / weekly_cost_cents computed by route_planning"
  - method: GET
    path: "/rollouts/route-plans"
    description: "List route plans (filterable by store)"
    roles: [PROGRAM_ADMIN, REAL_ESTATE_MANAGER, NETWORK_PLANNER, OPERATIONS_LEAD, FINANCE_ANALYST]
    code: 200
    input: ["store_id?", "status?", "limit?", "offset?"]
    output: RoutePlan[]
    side_effects: []

  # --- OpeningPlan ---
  - method: POST
    path: "/rollouts/opening-plans"
    description: "Create the grand-opening plan (PLANNED) — requires an EXECUTED agreement; opening_date >= clock+45d and committed_delivery_date <= opening_date+30d"
    roles: [OPERATIONS_LEAD]
    code: 201
    input: [rollout_program_id, store_id, opening_date, peak_season]
    output: OpeningPlan
    side_effects:
      - "fixture_kit_ship_date / inventory_push_date computed"
      - "labor_hours / labor_cost_cents computed by grand_opening_labor_plan"
      - "store.opening_date copied from plan"
  - method: GET
    path: "/rollouts/opening-plans"
    description: "List opening plans (filterable by store)"
    roles: [PROGRAM_ADMIN, REAL_ESTATE_MANAGER, NETWORK_PLANNER, OPERATIONS_LEAD, FINANCE_ANALYST]
    code: 200
    input: ["store_id?", "status?", "limit?", "offset?"]
    output: OpeningPlan[]
    side_effects: []
  - method: POST
    path: "/rollouts/opening-plans/{opid}/lock"
    description: "Lock the opening calendar (PLANNED -> LOCKED) — store must be SITE_CONTROL; committed_delivery_date <= fixture_kit_ship_date"
    roles: [OPERATIONS_LEAD]
    code: 200
    input: [rollout_program_id]
    output: OpeningPlan
    side_effects: ["opening_date frozen"]
  - method: POST
    path: "/rollouts/opening-plans/{opid}/unlock"
    description: "Unlock the opening calendar (LOCKED -> PLANNED)"
    roles: [OPERATIONS_LEAD]
    code: 200
    input: [rollout_program_id]
    output: OpeningPlan
    side_effects: []
  - method: POST
    path: "/rollouts/opening-plans/{opid}/execute"
    description: "Execute grand opening (LOCKED -> EXECUTED); store -> OPEN; agreement -> COMPLETED; clock >= opening_date - 3 days"
    roles: [OPERATIONS_LEAD]
    code: 200
    input: [rollout_program_id]
    output: OpeningPlan
    side_effects:
      - "store.status -> OPEN"
      - "agreement.status -> COMPLETED; penalty credit posted"
      - "RolloutEvent STORE_OPENED appended"

  - method: POST
    path: "/rollouts/cannibalization-studies"
    description: "Create a cannibalization study (DRAFT) for a store; supersedes the store's prior DRAFT/FINAL study"
    roles: [FINANCE_ANALYST]
    code: 201
    input: [rollout_program_id, store_id, overlap_entries]
    output: CannibalizationStudy
    side_effects:
      - "prior study DRAFT/FINAL -> SUPERSEDED"
      - "transfer_pct / recommendation computed by cannibalization_transfer"
  - method: GET
    path: "/rollouts/cannibalization-studies"
    description: "List cannibalization studies (filterable by store_id)"
    roles: [PROGRAM_ADMIN, REAL_ESTATE_MANAGER, NETWORK_PLANNER, OPERATIONS_LEAD, FINANCE_ANALYST]
    code: 200
    input: ["rollout_program_id?", "store_id?", "status?", "limit?", "offset?"]
    output: CannibalizationStudy[]
    side_effects: []
  - method: POST
    path: "/rollouts/cannibalization-studies/{csid}/finalize"
    description: "Finalize a study (DRAFT -> FINAL) — blocked when recommendation == BLOCKED"
    roles: [FINANCE_ANALYST]
    code: 200
    input: [rollout_program_id]
    output: CannibalizationStudy
    side_effects: ["study locked as FINAL"]

  - method: POST
    path: "/rollouts/capital-projects"
    description: "Create a capital project (DRAFT): REMODEL/RELOCATION on an EXISTING store, NEW_BUILD on a PROPOSED store"
    roles: [FINANCE_ANALYST]
    code: 201
    input: [rollout_program_id, kind, store_id, "project_cost_cents?", "remodel_cost_cents?", "projected_uplift_cents?"]
    output: CapitalProject
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/rollouts/capital-projects"
    description: "List capital projects (paginated; filters: kind, status, store_id)"
    roles: [PROGRAM_ADMIN, REAL_ESTATE_MANAGER, NETWORK_PLANNER, OPERATIONS_LEAD, FINANCE_ANALYST]
    code: 200
    input: ["rollout_program_id?", "kind?", "status?", "store_id?", "limit?", "offset?"]
    output: CapitalProject[]
    side_effects: []

  - method: POST
    path: "/rollouts/capital-projects/{cpid}/submit"
    description: "Submit a project (DRAFT -> SUBMITTED); computes capital_score; NEW_BUILD requires FINAL non-superseded study"
    roles: [FINANCE_ANALYST]
    code: 200
    input: [rollout_program_id]
    output: CapitalProject
    side_effects: ["capital_score computed by capital_scoring"]
  - method: POST
    path: "/rollouts/capital-projects/{cpid}/decide"
    description: "Approve or reject (SUBMITTED -> APPROVED/REJECTED); segregation of duties enforced; budget enforced on APPROVE; rank recomputed (OCC on Rollout.version)"
    roles: [PROGRAM_ADMIN]
    code: 200
    input: [rollout_program_id, decision, expected_program_version]
    output: CapitalProject
    side_effects:
      - "APPROVE: program.committed_capital_cents += effective cost"
      - "rank recomputed across decided projects (capital_score DESC, decided_at ASC)"
      - "increments Rollout.version by 1"
  - method: POST
    path: "/rollouts/capital-projects/{cpid}/cancel"
    description: "Cancel a project (DRAFT/SUBMITTED -> CANCELLED)"
    roles: [FINANCE_ANALYST]
    code: 200
    input: [rollout_program_id]
    output: CapitalProject
    side_effects: []

