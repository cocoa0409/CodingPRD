              payload: { policy_code: "COPYRIGHT", severity: "MINOR", evidence_ref: "clip://50" }
              as: TrustAgent
              as_user_id: "trust_nina"
              captures: { st_id: $.data.id }
            - call: "POST /api/strikes/${st_id}/appeal"
              payload: { statement: "appeal" }
              as: Creator
              as_user_id: "${ch_id}"
          trigger:
            - call: "POST /api/strikes/${st_id}/resolve-appeal"
              payload: { outcome: "REVERSED", resolution_note: "self review" }
              as: AppealsOfficer
              as_user_id: "trust_nina"
              captures: { err: $.data.error_id }
            - call: "POST /api/strikes/${st_id}/resolve-appeal"
              payload: { outcome: "REVERSED", resolution_note: "independent" }
              as: AppealsOfficer
              as_user_id: "appeals_omar"
              captures: { st_status: $.data.strike_status }
          assert:
            - "Resolver == issuer: err == ERR_SELF_REVIEW_FORBIDDEN (403); strike remains UNDER_APPEAL"
            - "Independent resolver: strike_status == REVERSED"

      - name: moderator_accept_self_only
        claim_type: role_exclusive_denied
        grounds:
          - "state_machines.Moderator.INVITED_to_ACTIVE"
          - "errors[ERR_CHANNEL_OWNERSHIP_MISMATCH]"
        distinguishing_aspect: "ACCEPT requires the Moderator principal to be the invitee: X-User-ID of a DIFFERENT moderator -> ERR_CHANNEL_OWNERSHIP_MISMATCH."
        test_recipe:
          setup: ["Channel; moderators M1 and M2 both INVITED"]
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "rb_acc", display_name: "RB Acc", home_platform: "TWITCH" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /api/channels/${ch_id}/moderators"
              payload: { moderator_handle: "m1", scopes: ["TIMEOUT"] }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { m1: $.data.id }
            - call: "POST /api/channels/${ch_id}/moderators"
              payload: { moderator_handle: "m2", scopes: ["TIMEOUT"] }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { m2: $.data.id }
          trigger:
            - call: "POST /api/moderators/${m1}/transition"
              payload: { action: "ACCEPT" }
              as: Moderator
              as_user_id: "${m2}"
              captures: { err: $.data.error_id }
            - call: "POST /api/moderators/${m1}/transition"
              payload: { action: "ACCEPT" }
              as: Moderator
              as_user_id: "${m1}"
              captures: { m1_status: $.data.moderator_status }
          assert:
            - "Wrong invitee: err == ERR_CHANNEL_OWNERSHIP_MISMATCH (403)"
            - "Correct invitee: moderator_status == ACTIVE"

  # ============================================================ Cross-Cutting Complexity Layers
  - section: cross_cutting
    instances:
      - name: occ_channel_settings_stale_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[channel-payout-settings-stale]"
        distinguishing_aspect: "PATCH payout-settings with a version superseded by an intervening tax-form submission (which bumps Channel.version) -> 412 ERR_STALE_VERSION; re-reading and retrying with the fresh version succeeds and bumps version again."
        test_recipe:
          setup: ["Channel created (version captured at creation); a tax form submitted since (Channel.version advanced to 2)"]
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "cc_set", display_name: "CC Set", home_platform: "TWITCH" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id, ch_v1: $.data.version }
            - call: "POST /api/channels/${ch_id}/tax-forms"
              payload: { form_type: "W9", legal_name: "CC Set LLC", tax_id_last4: "9009", expected_channel_version: "${ch_v1}" }
              as: Creator
              as_user_id: "${ch_id}"
          trigger:
            - call: "PATCH /api/channels/${ch_id}/payout-settings"
              payload: { payout_threshold_cents: 25000, expected_channel_version: "${ch_v1}" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { err: $.data.error_id }
            - call: "GET /api/channels/${ch_id}"
              as: PlatformAdmin
              captures: { ch_v2: $.data.version }
            - call: "PATCH /api/channels/${ch_id}/payout-settings"
              payload: { payout_threshold_cents: 25000, expected_channel_version: "${ch_v2}" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { ch_v3: $.data.version }
          assert:
            - "Stale write (version from before the tax-form supersession): err == ERR_STALE_VERSION (HTTP 412)"
            - "Fresh write succeeds: payout_threshold_cents == 25000 and version == ${ch_v2} + 1 (increments by exactly 1 per mutation)"

      - name: occ_tax_form_supersede_stale_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[tax-form-supersede-stale-channel]"
        distinguishing_aspect: "Second tax-form submission carrying the creation-time Channel version (1) after the first submission advanced it to 2 -> 412 ERR_STALE_VERSION; the superseding write must observe the current version."
        test_recipe:
          setup: ["Channel created (version 1 captured); one tax form already submitted (Channel.version now 2)"]
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "cc_tax", display_name: "CC Tax", home_platform: "YOUTUBE" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id, ch_v1: $.data.version }
            - call: "POST /api/channels/${ch_id}/tax-forms"
              payload: { form_type: "W9", legal_name: "CC Tax LLC", tax_id_last4: "1010", expected_channel_version: "${ch_v1}" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { tf1: $.data.id }
          trigger:
            - call: "POST /api/channels/${ch_id}/tax-forms"
              payload: { form_type: "W8BEN", legal_name: "CC Tax Intl", tax_id_last4: "1011", expected_channel_version: "${ch_v1}" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION (412): the first submission advanced Channel.version to 2, so the stale expected value 1 loses"
            - "Channel.tax_form_current_id still == ${tf1}; no second form persisted"

      - name: occ_deliverable_reschedule_stale_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[deliverable-reschedule-stale]"
        distinguishing_aspect: "Reschedule carrying the creation-time Deliverable version after an ops-run MISSED transition advanced it -> 412; with the fresh version the reschedule succeeds and disclosure resets to PENDING."
        test_recipe:
          setup: ["Channel STANDARD (W9 verified); deal ACTIVE; deliverable due 2026-08-06 (version 1 captured at creation); clock 2026-08-07; ops run has marked the deliverable MISSED (version advanced)"]
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "cc_del", display_name: "CC Del", home_platform: "TWITCH" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /api/channels/${ch_id}/tax-forms"
              payload: { form_type: "W9", legal_name: "CC Del LLC", tax_id_last4: "1112", expected_channel_version: "${ch_v}" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /api/tax-forms/${tf_id}/transition"
              payload: { action: "VERIFY" }
              as: TrustAgent
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/deals"
              payload: { sponsor_ref: "sponsor_acme", title: "D", category: "VPN", total_value_cents: 100000, flight_start: "2026-08-05T00:00:00Z", flight_end: "2026-09-30T00:00:00Z", required_deliverable_count: 1 }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { d_id: $.data.id }
            - call: "POST /api/deals/${d_id}/transition"
              payload: { action: "PROPOSE" }
              as: Creator
              as_user_id: "${ch_id}"
            - call: "POST /api/deals/${d_id}/transition"
              payload: { action: "ACCEPT" }
              as: Sponsor
              as_user_id: "sponsor_acme"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deals/${d_id}/transition"
              payload: { action: "ACTIVATE" }
              as: Creator
              as_user_id: "${ch_id}"
            - call: "POST /api/deals/${d_id}/deliverables"
              payload: { kind: "AD_READ", due_at: "2026-08-06T00:00:00Z" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { del_id: $.data.id, del_v1: $.data.version }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/ops/run"
              as: PlatformAdmin
          trigger:
            - call: "POST /api/deliverables/${del_id}/reschedule"
              payload: { due_at: "2026-08-20T00:00:00Z", expected_deliverable_version: "${del_v1}" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { err: $.data.error_id }
            - call: "GET /api/deliverables/${del_id}"
              as: Creator
              as_user_id: "${ch_id}"
              captures: { del_v2: $.data.version }
            - call: "POST /api/deliverables/${del_id}/reschedule"
              payload: { due_at: "2026-08-20T00:00:00Z", expected_deliverable_version: "${del_v2}" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { del_status: $.data.performance_status, del_disc: $.data.disclosure_status }
          assert:
            - "Stale reschedule: err == ERR_STALE_VERSION (412) — the ops-run MISSED transition advanced Deliverable.version beyond ${del_v1}"
            - "Fresh reschedule: performance_status == SCHEDULED, due_at == 2026-08-20T00:00:00Z, disclosure_status == PENDING, version == ${del_v2} + 1"
            - "Deal.miss_count remains 1 (reschedule does not erase miss history)"

      - name: clock_default_startup_value
        claim_type: scheduled_actions
        grounds: [endpoints]
        distinguishing_aspect: "With no set_current_utc call at all, the logical clock reads exactly 2026-08-01T00:00:00Z: a stream START stamps actual_start to that default, and punctuality is computed against it."
        test_recipe:
          setup: ["Empty DB; clock NEVER set; channel with stream scheduled 2026-08-01 00:00-01:00"]
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "cc_clk", display_name: "CC Clk", home_platform: "TWITCH" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /api/channels/${ch_id}/streams"
              payload: { title: "S", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T01:00:00Z" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /api/streams/${s_id}/transition"
              payload: { action: "START" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { s_start: $.data.actual_start, s_late: $.data.punctuality_minutes_late }
          assert:
            - "actual_start == 2026-08-01T00:00:00Z (server default logical clock, not wall time)"
            - "punctuality_minutes_late == 0"

      - name: cascading_layers_already_exercised
        claim_type: cascading_side_effects
        grounds: [state_machines.Channel, state_machines.Payout.SCHEDULED_to_HELD]
        excluded_because:
          difficulty_instance: "deliverable_miss_deal_breach_clawback_cascade / strike_suspension_payout_hold_cascade"
          rationale: "N-level cascade verification (strike -> posture -> payout hold, miss -> breach -> clawback -> balance) is asserted end-to-end by the named §1.8 instances."

      - name: rate_threshold_layers_already_exercised
        claim_type: rate_threshold_triggers
        grounds: [calculations.payout_threshold_gate, calculations.strike_weight]
        excluded_because:
          difficulty_instance: "payout_threshold_exact_boundary / strike_weight_suspension_boundary"
          rationale: "Threshold boundary behavior (inclusive >= on money and strike weight) is covered by the two §1.8 boundary instances."

  # ============================================================ Consistency Model
  - section: consistency
    instances:
      - name: immediate_consistency_after_moderation_action
        claim_type: immediate
        grounds: [complexity_profile, state_machines.Viewer]
        distinguishing_aspect: "Immediate consistency: the POST that issues a TIMEOUT makes the derived Viewer.standing visible as TIMED_OUT on the very next read — no lag, no eventual reconciliation."
        test_recipe:
          setup: ["Channel; viewer GOOD_STANDING"]
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "cs_imm", display_name: "CS Imm", home_platform: "YOUTUBE" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /api/channels/${ch_id}/viewers"
              payload: { handle: "v_imm" }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /api/channels/${ch_id}/moderation-actions"
              payload: { viewer_id: "${v_id}", action_kind: "TIMEOUT", duration_minutes: 60, reason: "spam" }
              as: Creator
              as_user_id: "${ch_id}"
            - call: "GET /api/viewers/${v_id}"
              as: Creator
              as_user_id: "${ch_id}"
              captures: { v_standing: $.data.standing }
          assert:
            - "Viewer.${v_id}.standing == TIMED_OUT on the immediate next read (same logical instant)"
            - "Reversing the action flips standing back to GOOD_STANDING on the next read (verified by reverse call below if executed)"
