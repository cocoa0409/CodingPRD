            - { call: "POST /reslife/staff", payload: { full_name: "Dean Two", staff_role: "DEAN" }, as: SchoolAdmin, captures: { dean2: "$.data.id" } }
            - { call: "POST /reslife/discipline-cases", payload: { student_id: "${stu}", category: "MINOR", description: "Missed study hall x3", points_proposed: 9 }, as: Dean, as_user_id: "${dean1}", captures: { case1: "$.data.id" } }
