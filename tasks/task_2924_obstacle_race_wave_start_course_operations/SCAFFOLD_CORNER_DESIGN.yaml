              as: PermitOfficer
          assert:
            - "The first trigger call returns 200 with RestorationTask.${task_a_id}.status == VERIFIED, inspection_rounds == 1 and bond_release_cents == 540541"
            - "The venue read shows bond_released_cents == 540541, bond_forfeited_cents == 0 and bond_held_cents == 459459"
            - "RestorationTask.${task_b_id} is untouched: status PENDING, inspection_rounds 0, bond_release_cents 0"
            - "The third trigger call returns 409 with data.error_id == ERR_TASK_STATE_INVALID: VERIFIED is not an inspectable state"
            - "After the refusal Venue.${venue_id}.bond_released_cents is still 540541 and RestorationTask.${task_a_id}.inspection_rounds is still 1"

