          - errors[ERR_DISPUTE_WINDOW_CLOSED]
          - entities.EventSettlement.fields.dispute_deadline_utc
        distinguishing_aspect: |
          The dispute window is a single interval read from two sides. Issuing at
          2027-06-14T09:00:00Z stamps dispute_deadline_utc at 2027-06-24T09:00:00Z; a
          finalize at 2027-06-20T10:00:00Z is refused because the window is still open,
