            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d2}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-03", night_count: 1, payment_mode: "FLEET_BILL", fleet_account_id: "${fl}" }, as: Driver, as_user_id: "${d2}", captures: { b2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T15:30:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings/${b2}/check-in", payload: {}, as: Driver, as_user_id: "${d2}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T10:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings/${b2}/check-out", payload: {}, as: Driver, as_user_id: "${d2}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /fleet-accounts/${fl}/close-billing-period", payload: { period: "2026-08" }, as: NetworkAdmin, captures: { inv: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /fleet-accounts/${fl}/ops-run", payload: {}, as: NetworkAdmin, captures: { fst: $.data.status } }
          trigger:
            - { call: "POST /driver-authorizations/${au1}/transition", payload: { to: "ACTIVE" }, as: FleetManager, as_user_id: "${fl}", captures: { err: $.data.error_id } }
          assert:
            - "FleetAccount.status == SUSPENDED after the overdue sweep"
            - "approving the PENDING authorization -> error_id == ERR_FLEET_SUSPENDED (409)"

  - section: endpoints
    instances:
      - name: retire_draft_plan_ok_retire_active_rejected
        claim_type: conditional_action
        grounds: [state_machines.RatePlan, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "RETIRE is legal from DRAFT but the site's ACTIVE plan cannot be retired (ERR_INVALID_STATE) — a replacement must be activated first."
        test_recipe:
          setup: ["site (default plan ACTIVE, version 1) plus one DRAFT plan P1"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id, sv: $.data.version } }
            - { call: "POST /sites/${site_id}/rate-plans", payload: {}, as: NetworkAdmin, captures: { p1: $.data.id } }
            - { call: "GET /sites/${site_id}/rate-plans", payload: { status: "ACTIVE" }, as: NetworkAdmin, captures: { defp: "$.data[0].id" } }
          trigger:
            - { call: "POST /sites/${site_id}/rate-plans/${p1}/transition", payload: { to: "RETIRED", expected_site_version: "${sv}" }, as: NetworkAdmin, captures: { p1s: $.data.status } }
            - { call: "POST /sites/${site_id}/rate-plans/${defp}/transition", payload: { to: "RETIRED", expected_site_version: "${sv}" }, as: NetworkAdmin, captures: { err: $.data.error_id } }
          assert:
            - "DRAFT plan -> RETIRED succeeds"
            - "ACTIVE plan retire -> error_id == ERR_INVALID_STATE (409)"

  - section: validations
    instances:
      - name: night_count_zero_and_inverted_availability_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_WINDOW_INVALID]"]
        distinguishing_aspect: "Temporal value errors distinct from shape errors: night_count 0 -> ERR_WINDOW_INVALID on booking create; window_start >= window_end -> ERR_WINDOW_INVALID on availability."
        test_recipe:
          setup: ["site with 1 reservable stall; driver; clock 2026-08-01"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-WI", full_name: "W Eye" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
          trigger:
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 0, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { err1: $.data.error_id } }
            - { call: "GET /sites/${site_id}/availability", payload: { window_start: "2026-08-10T15:00:00Z", window_end: "2026-08-10T15:00:00Z" }, as: NetworkAdmin, captures: { err2: $.data.error_id } }
          assert:
            - "night_count 0 -> error_id == ERR_WINDOW_INVALID (422), not ERR_VALIDATION"
            - "availability with window_start == window_end -> error_id == ERR_WINDOW_INVALID (422)"
