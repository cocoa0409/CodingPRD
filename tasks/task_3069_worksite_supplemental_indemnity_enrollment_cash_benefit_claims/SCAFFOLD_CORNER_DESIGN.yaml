  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_series_version_on_publish_rejected_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[schedule-publish-stale-series]", "errors[ERR_STALE_VERSION]", "validations[priority=10]"]
        distinguishing_aspect: "Two sequential publishes against the same series: the second carries the pre-first-publish version and is rejected with ERR_STALE_VERSION 412; carrying the post-first-publish version succeeds."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Series SQ2 DRAFT with schedules SCH-Q1 (v1, effective 2026-01-01) and SCH-Q2 (v2, effective 2026-06-01), both DRAFT. Client observed series version at creation."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /policy-series", payload: { series_code: "SQ2", product_line: "ACCIDENT" }, as: CarrierAdmin, captures: { sq2: $.data.id, sq2_v0: $.data.version } }
            - { call: "POST /benefit-schedules", payload: { policy_series_id: "${sq2}", schedule_version: 1, effective_date: "2026-01-01T00:00:00Z", benefit_items: [{ event_code: "Q2", benefit_amount_cents: 100, max_occurrences_per_year: 1, lifetime_max_cents: 1000 }], monthly_premium_cents: 100, wellness_benefit_cents: 50, wellness_waiting_months: 0, preexisting_exclusion_months: 0 }, as: CarrierAdmin, captures: { schq1: $.data.id } }
            - { call: "POST /benefit-schedules", payload: { policy_series_id: "${sq2}", schedule_version: 2, effective_date: "2026-06-01T00:00:00Z", benefit_items: [{ event_code: "Q2", benefit_amount_cents: 100, max_occurrences_per_year: 1, lifetime_max_cents: 1000 }], monthly_premium_cents: 100, wellness_benefit_cents: 50, wellness_waiting_months: 0, preexisting_exclusion_months: 0 }, as: CarrierAdmin, captures: { schq2: $.data.id } }
          trigger:
            - { call: "POST /benefit-schedules/${schq1}/publish", payload: { expected_series_version: "${sq2_v0}" }, as: CarrierAdmin }
            - { call: "POST /benefit-schedules/${schq2}/publish", payload: { expected_series_version: "${sq2_v0}" }, as: CarrierAdmin, captures: { err_q: $.data.error_id } }
            - { call: "GET /policy-series/${sq2}", payload: {}, as: CarrierAdmin, captures: { sq2_v_now: $.data.version } }
            - { call: "POST /benefit-schedules/${schq2}/publish", payload: { expected_series_version: "${sq2_v_now}" }, as: CarrierAdmin }
          assert:
            - "First publish succeeds (SCH-Q1 PUBLISHED, series version advanced)"
            - "Second publish with the stale version ${sq2_v0} fails: ${err_q} == ERR_STALE_VERSION and HTTP 412"
            - "Third publish with the refreshed version succeeds: BenefitSchedule.${schq2}.status == PUBLISHED and ${schq1} SUPERSEDED"

      - name: occ_stale_group_version_on_campaign_close_rejected_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[campaign-close-stale-group]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Campaign close is OCC-guarded on the EMPLOYER GROUP's version (a different parent entity from the series rule): closing with a group version observed before an intervening group mutation fails 412, and the campaign stays LOCKED."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Group GR2 ACTIVE (0/0.0, DAILY); counselor CR2; campaign CR2-CAM OPEN window 2026-09-01..2026-09-10 guaranteed_issue; group version observed at v_obs; clock to 2026-09-10; campaign locked; group suspended and reactivated (two version bumps) before the close."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /employer-groups", payload: { name: "GR2", group_code: "GR2", participation_minimum_pct: 0.0, participation_minimum_count: 0 }, as: CarrierAdmin, captures: { gr2: $.data.id } }
            - { call: "POST /employer-groups/${gr2}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /benefit-counselors", payload: { license_id: "LIC-GR", full_name: "CGR", home_state: "TX" }, as: CarrierAdmin, captures: { cr2: $.data.id } }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${gr2}", counselor_id: "${cr2}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-10T00:00:00Z", guaranteed_issue: true }, as: BenefitCounselor, captures: { cr2_cam: $.data.id } }
            - { call: "POST /enrollment-campaigns/${cr2_cam}/open", payload: {}, as: BenefitCounselor }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /enrollment-campaigns/${cr2_cam}/lock", payload: {}, as: BenefitCounselor }
            - { call: "GET /employer-groups/${gr2}", payload: {}, as: CarrierAdmin, captures: { gr2_v_obs: $.data.version } }
            - { call: "POST /employer-groups/${gr2}/suspend", payload: {}, as: CarrierAdmin }
            - { call: "POST /employer-groups/${gr2}/activate", payload: {}, as: CarrierAdmin }
          trigger:
            - { call: "POST /enrollment-campaigns/${cr2_cam}/close", payload: { expected_group_version: "${gr2_v_obs}" }, as: BenefitCounselor, captures: { err_r: $.data.error_id } }
          assert:
            - "${err_r} == ERR_STALE_VERSION and HTTP 412 (suspend+reactivate advanced the group version past the client's observation)"
            - "EnrollmentCampaign.${cr2_cam}.status remains LOCKED"

      - name: derived_group_counters_reconcile_with_membership_changes
        claim_type: derived_field_reconciliation
        grounds: [entities.EmployerGroup.fields.eligible_employee_count, entities.EmployerGroup.fields.enrolled_count, state_machines.Employee.ACTIVE_to_TERMINATED, state_machines.Policy.ACTIVE_to_PORTED]
        distinguishing_aspect: "eligible_employee_count and enrolled_count are recomputed on read: terminating an employee drops eligible count immediately; porting that employee's policy drops enrolled count immediately — no stale cache."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Group GS2 ACTIVE; counselor CS2; series SS3 ACTIVE with PUBLISHED schedule (event S3 amount 100, max 1, lifetime 1000; premium 100; wellness 50/0/0); campaign CS2-CAM OPEN guaranteed_issue; employees ES-A, ES-B ACTIVE; policies PS-A (ISSUED, employee ES-A), PS-B (ISSUED, employee ES-B)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /employer-groups", payload: { name: "GS2", group_code: "GS2", participation_minimum_pct: 0.0, participation_minimum_count: 0 }, as: CarrierAdmin, captures: { gs2: $.data.id } }
            - { call: "POST /employer-groups/${gs2}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /benefit-counselors", payload: { license_id: "LIC-GS2", full_name: "CGS2", home_state: "TX" }, as: CarrierAdmin, captures: { cs2: $.data.id } }
            - { call: "POST /policy-series", payload: { series_code: "SS3", product_line: "ACCIDENT" }, as: CarrierAdmin, captures: { ss3: $.data.id, ss3_v: $.data.version } }
            - { call: "POST /benefit-schedules", payload: { policy_series_id: "${ss3}", schedule_version: 1, effective_date: "2026-01-01T00:00:00Z", benefit_items: [{ event_code: "S3", benefit_amount_cents: 100, max_occurrences_per_year: 1, lifetime_max_cents: 1000 }], monthly_premium_cents: 100, wellness_benefit_cents: 50, wellness_waiting_months: 0, preexisting_exclusion_months: 0 }, as: CarrierAdmin, captures: { schs: $.data.id } }
            - { call: "POST /benefit-schedules/${schs}/publish", payload: { expected_series_version: "${ss3_v}" }, as: CarrierAdmin }
            - { call: "POST /policy-series/${ss3}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${gs2}", counselor_id: "${cs2}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", guaranteed_issue: true }, as: BenefitCounselor, captures: { cs2_cam: $.data.id } }
            - { call: "POST /enrollment-campaigns/${cs2_cam}/open", payload: {}, as: BenefitCounselor }
            - { call: "POST /employees", payload: { employer_group_id: "${gs2}", employee_ref: "ES-A", full_name: "ESA", hire_date: "2026-01-01T00:00:00Z" }, as: GroupAdmin, captures: { es_a: $.data.id } }
            - { call: "POST /employees", payload: { employer_group_id: "${gs2}", employee_ref: "ES-B", full_name: "ESB", hire_date: "2026-01-01T00:00:00Z" }, as: GroupAdmin, captures: { es_b: $.data.id } }
            - { call: "POST /policies", payload: { campaign_id: "${cs2_cam}", employee_id: "${es_a}", policy_series_id: "${ss3}" }, as: BenefitCounselor, captures: { ps_a: $.data.id } }
            - { call: "POST /policies/${ps_a}/issue", payload: {}, as: BenefitCounselor }
            - { call: "POST /policies", payload: { campaign_id: "${cs2_cam}", employee_id: "${es_b}", policy_series_id: "${ss3}" }, as: BenefitCounselor, captures: { ps_b: $.data.id } }
            - { call: "POST /policies/${ps_b}/issue", payload: {}, as: BenefitCounselor }
          trigger:
            - { call: "GET /employer-groups/${gs2}", payload: {}, as: CarrierAdmin, captures: { gs2_elig0: $.data.eligible_employee_count, gs2_enr0: $.data.enrolled_count } }
            - { call: "POST /employees/${es_a}/terminate", payload: {}, as: GroupAdmin }
            - { call: "POST /policies/${ps_a}/port", payload: { new_premium_mode: "POST_TAX" }, as: PolicyholderServices }
            - { call: "GET /employer-groups/${gs2}", payload: {}, as: CarrierAdmin, captures: { gs2_elig1: $.data.eligible_employee_count, gs2_enr1: $.data.enrolled_count } }
          assert:
            - "Before: ${gs2_elig0} == 2 and ${gs2_enr0} == 2"
            - "After terminate+port of ES-A: ${gs2_elig1} == 1 and ${gs2_enr1} == 1 (PORTED policies leave enrolled_count; TERMINATED employees leave eligible_employee_count)"

      - name: finalize_synthesizes_lines_and_total_immediately
        claim_type: immediate_consistency
        grounds: [state_machines.PayrollCycle.OPEN_to_FINALIZED, calculations.deduction_proration, entities.PayrollCycle.fields.total_posted_cents]
        distinguishing_aspect: "Immediate consistency: the finalize response itself reflects the synthesized lines and total — a GET right after finalize (no clock movement, no reconcile) shows FINALIZED with the full line set and total_posted_cents equal to the line sum."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Group GT2 ACTIVE (DAILY); counselor CT2; series ST3 ACTIVE with PUBLISHED schedule (event T3 amount 100, max 1, lifetime 1000; premium 4500; wellness 50/0/0); campaign CT2-CAM OPEN guaranteed_issue; employees ET-A with policy PT-A ISSUED, ET-B with policy PT-B ISSUED then LAPSED (LAPSED at finalize -> zero days, excluded)."
            - "Payroll cycle CYC-T period 2026-09-01..2026-10-01 created."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /employer-groups", payload: { name: "GT2", group_code: "GT2", participation_minimum_pct: 0.0, participation_minimum_count: 0, proration_convention: "DAILY" }, as: CarrierAdmin, captures: { gt2: $.data.id } }
            - { call: "POST /employer-groups/${gt2}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /benefit-counselors", payload: { license_id: "LIC-GT2", full_name: "CGT2", home_state: "TX" }, as: CarrierAdmin, captures: { ct2: $.data.id } }
            - { call: "POST /policy-series", payload: { series_code: "ST3", product_line: "ACCIDENT" }, as: CarrierAdmin, captures: { st3: $.data.id, st3_v: $.data.version } }
            - { call: "POST /benefit-schedules", payload: { policy_series_id: "${st3}", schedule_version: 1, effective_date: "2026-01-01T00:00:00Z", benefit_items: [{ event_code: "T3", benefit_amount_cents: 100, max_occurrences_per_year: 1, lifetime_max_cents: 1000 }], monthly_premium_cents: 4500, wellness_benefit_cents: 50, wellness_waiting_months: 0, preexisting_exclusion_months: 0 }, as: CarrierAdmin, captures: { scht2: $.data.id } }
            - { call: "POST /benefit-schedules/${scht2}/publish", payload: { expected_series_version: "${st3_v}" }, as: CarrierAdmin }
            - { call: "POST /policy-series/${st3}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${gt2}", counselor_id: "${ct2}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", guaranteed_issue: true }, as: BenefitCounselor, captures: { ct2_cam: $.data.id } }
            - { call: "POST /enrollment-campaigns/${ct2_cam}/open", payload: {}, as: BenefitCounselor }
            - { call: "POST /employees", payload: { employer_group_id: "${gt2}", employee_ref: "ET-A", full_name: "ETA", hire_date: "2026-01-01T00:00:00Z" }, as: GroupAdmin, captures: { et_a: $.data.id } }
            - { call: "POST /employees", payload: { employer_group_id: "${gt2}", employee_ref: "ET-B", full_name: "ETB", hire_date: "2026-01-01T00:00:00Z" }, as: GroupAdmin, captures: { et_b: $.data.id } }
            - { call: "POST /policies", payload: { campaign_id: "${ct2_cam}", employee_id: "${et_a}", policy_series_id: "${st3}" }, as: BenefitCounselor, captures: { pt_a: $.data.id } }
            - { call: "POST /policies/${pt_a}/issue", payload: {}, as: BenefitCounselor }
            - { call: "POST /policies", payload: { campaign_id: "${ct2_cam}", employee_id: "${et_b}", policy_series_id: "${st3}" }, as: BenefitCounselor, captures: { pt_b: $.data.id } }
            - { call: "POST /policies/${pt_b}/issue", payload: {}, as: BenefitCounselor }
            - { call: "POST /policies/${pt_b}/lapse", payload: {}, as: BenefitCounselor }
            - { call: "POST /payroll-cycles", payload: { employer_group_id: "${gt2}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }, as: GroupAdmin, captures: { cyc_t: $.data.id } }
          trigger:
            - { call: "POST /payroll-cycles/${cyc_t}/finalize", payload: {}, as: GroupAdmin }
            - { call: "GET /payroll-cycles/${cyc_t}/deduction-lines", payload: {}, as: GroupAdmin }
          assert:
            - "Exactly 1 DeductionLine is synthesized (LAPSED policy ${pt_b} is excluded: zero coverage days, no line)"
            - "The line has amount_cents == 4500, coverage_days == 30, tax_treatment == POST_TAX, status == POSTED"
            - "PayrollCycle.${cyc_t}.status == FINALIZED and total_posted_cents == 4500 in the same read"
