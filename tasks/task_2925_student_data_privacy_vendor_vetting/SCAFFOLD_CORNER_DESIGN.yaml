      - name: subprocessor_verify_requires_terms_no_weaker_than_the_vendor
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=27]
          - errors[ERR_SUBPROCESSOR_NOTIFICATION_TERMS_WEAKER]
          - calculations.vendor_privacy_posture
        distinguishing_aspect: |
          The gate compares two entities: sub_breach_notification_hours 72 against the
          parent vendor's 48 must be 422 ERR_SUBPROCESSOR_NOTIFICATION_TERMS_WEAKER, while
          a sibling subprocessor at exactly 48 verifies. FLAG is never blocked by the terms
          rule, and flagging drives the vendor to RESTRICTED even at risk 0.00.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Vendor V with breach_notification_hours 48; analyst AN1."
            - "Two US subprocessors are disclosed: SP_WEAK at 72 hours and SP_EQUAL at exactly 48 hours. US is used so the foreign-subprocessor penalty stays out of the risk score."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /vendors"
              payload: { legal_name: "Brightpath Reading Co", hq_country_code: "US", breach_notification_hours: 48, data_deletion_days: 30, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { v_id: $.data.id }
            - call: "POST /privacy-analysts"
              payload: { full_name: "Ana Lopez", credential_level: "SENIOR", review_capacity_minutes: 2400 }
              as: PrivacyOfficeAdmin
              captures: { an1_id: $.data.id }
            - call: "POST /subprocessors"
              payload: { vendor_id: "${v_id}", name: "Weak Terms Hosting", country_code: "US", data_categories: ["STUDENT_NAME"], purpose: "Roster identity matching for gradebook sync and report cards.", sub_breach_notification_hours: 72 }
              as: PrivacyOfficeAdmin
              captures: { sp_weak_id: $.data.id }
            - call: "POST /subprocessors"
              payload: { vendor_id: "${v_id}", name: "Equal Terms Hosting", country_code: "US", data_categories: ["STUDENT_NAME"], purpose: "Roster identity matching for gradebook sync and report cards.", sub_breach_notification_hours: 48 }
              as: PrivacyOfficeAdmin
              captures: { sp_equal_id: $.data.id }
          trigger:
            - call: "POST /subprocessors/${sp_weak_id}/review"
              payload: { disposition: "VERIFY", reviewed_note: "Terms are weaker than the prime contract." }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /subprocessors/${sp_equal_id}/review"
              payload: { disposition: "VERIFY", reviewed_note: "Terms match the prime contract exactly." }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
            - call: "POST /subprocessors/${sp_weak_id}/review"
              payload: { disposition: "FLAG", reviewed_note: "Escalated to contract renegotiation." }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
          assert:
            - "first trigger call: status == 422 and ${err} == ERR_SUBPROCESSOR_NOTIFICATION_TERMS_WEAKER"
            - "after the first trigger call Subprocessor.${sp_weak_id}.status == DISCLOSED"
            - "second trigger call: status == 200 and Subprocessor.${sp_equal_id}.status == VERIFIED (the <= comparison makes equality pass)"
            - "third trigger call: status == 200 and Subprocessor.${sp_weak_id}.status == FLAGGED"
            - "Vendor.${v_id}.flagged_subprocessor_count == 1"
            - "Vendor.${v_id}.risk_score == 0.00 (both subprocessors are US, so no foreign penalty)"
            - "Vendor.${v_id}.privacy_posture == RESTRICTED"

