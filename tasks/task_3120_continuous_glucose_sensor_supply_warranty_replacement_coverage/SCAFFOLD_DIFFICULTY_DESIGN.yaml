            - call: "POST /cgm/patients/${pt}/prescriptions"
              payload: { prescriber_id: "${dr}", product_id: "${prod}", diagnosis_code: "E11.9", insulin_use: "INTENSIVE", documentation_attached: true, quantity_per_fill: 1, fills_authorized: 12, written_on: "2025-09-01", expected_patient_version: "${pt_v}" }
              as: Prescriber
