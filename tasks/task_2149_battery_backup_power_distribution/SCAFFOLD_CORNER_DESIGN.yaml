      - name: fourth_refresh_charge_returns_cycles_exhausted
        claim_type: Violation -> Error
        grounds:
          - validations[priority=14]
          - errors[ERR_REFRESH_CYCLES_EXHAUSTED]
          - entities.InventoryLot.fields.refresh_charge_count
        distinguishing_aspect: "MAX_REFRESH_CYCLES is 3 and the cooldown has fully elapsed before each call, so the fourth refresh fails on priority 14 with ERR_REFRESH_CYCLES_EXHAUSTED (409) rather than on the cooldown rule at priority 27."
        test_recipe:
          setup:
            - "One TX warehouse and model IB-SLF-5 with shelf_life_days 540."
            - "One 20-unit lot manufactured 2026-03-01 that has been refresh charged three times at 2026-08-01T00:00:00Z, 2026-08-04T00:00:01Z and 2026-08-07T00:00:02Z."
            - "The logical clock now reads 2026-08-10T00:00:03Z, well clear of the 72-hour cooldown."
          setup_api_calls:
            - call: "POST /distribution/warehouses"
              payload: { code: "TX-DAL", state_code: "TX", hazmat_endorsement: true, storm_reserve_pct: 0.0, dock_capacity_kg_per_window: 100000.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { wh_tx: $.data.id }
            - call: "POST /distribution/battery-models"
              payload: { sku: "IB-SLF-5", chemistry: "AGM", nominal_voltage: 12, amp_hour_capacity: 100, peukert_exponent: 1.10, unit_weight_kg: 20.0, lead_content_kg: 10.0, core_deposit_cents: 2000, list_price_cents: 20000, warranty_free_replacement_months: 24, warranty_prorata_months: 36, shelf_life_days: 540, self_discharge_pct_per_month: 5.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_slf: $.data.id }
            - call: "POST /distribution/inventory-lots"
              payload: { battery_model_id: "${m_slf}", warehouse_id: "${wh_tx}", manufactured_on: "2026-03-01", quantity_on_hand: 20 }
              as: WarehouseOperator
              as_user_id: "op-1"
              captures: { lot: $.data.id }
            - call: "POST /distribution/inventory-lots/${lot}/refresh-charge"
              payload: { measured_open_circuit_voltage: 12.75 }
              as: WarehouseOperator
              as_user_id: "op-1"
            - call: "POST /distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:01Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /distribution/inventory-lots/${lot}/refresh-charge"
              payload: { measured_open_circuit_voltage: 12.76 }
              as: WarehouseOperator
              as_user_id: "op-1"
            - call: "POST /distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T00:00:02Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /distribution/inventory-lots/${lot}/refresh-charge"
              payload: { measured_open_circuit_voltage: 12.77 }
              as: WarehouseOperator
              as_user_id: "op-1"
              captures: { cnt3: $.data.refresh_charge_count, st3: $.data.condition_state }
            - call: "POST /distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:03Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /distribution/inventory-lots/${lot}/refresh-charge"
              payload: { measured_open_circuit_voltage: 12.78 }
              as: WarehouseOperator
              as_user_id: "op-1"
              captures: { err: $.data.error_id }
          assert:
            - "${cnt3} == 3"
            - "${st3} == SELLABLE"
            - "HTTP status == 409"
            - "${err} == ERR_REFRESH_CYCLES_EXHAUSTED"
            - "${err} != ERR_REFRESH_COOLDOWN_ACTIVE"
            - "InventoryLot.${lot}.refresh_charge_count == 3"
            - "InventoryLot.${lot}.last_refresh_charged_at == 2026-08-07T00:00:02.000Z"

      - name: carrier_refusing_the_hazmat_class_on_pack
        claim_type: Violation -> Error
        grounds:
          - errors[ERR_CARRIER_HAZMAT_REFUSED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / carrier_hazmat_refusal_outranks_dock_capacity_on_pack
          rationale: "That §1.8 instance asserts ERR_CARRIER_HAZMAT_REFUSED as the winning error on POST /distribution/shipments."

      - name: dock_capacity_breach_on_pack
        claim_type: Aggregate validation
        grounds:
          - errors[ERR_DOCK_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / warehouse_dock_capacity_aggregates_touching_windows
          rationale: "That §1.8 instance asserts ERR_DOCK_CAPACITY_EXCEEDED on the touching-window aggregate."

      - name: carrier_window_collision_on_pack
        claim_type: Temporal validation
        grounds:
          - errors[ERR_CARRIER_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / carrier_windows_are_half_open_adjacency_allowed_overlap_rejected
          rationale: "That §1.8 instance asserts ERR_CARRIER_WINDOW_CONFLICT on the overlapping tender."

      - name: refresh_inside_the_cooldown_interval
        claim_type: Temporal validation
        grounds:
          - errors[ERR_REFRESH_COOLDOWN_ACTIVE]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / refresh_cooldown_closed_interval_rejects_exact_upper_bound
          rationale: "That §1.8 instance asserts ERR_REFRESH_COOLDOWN_ACTIVE on the closed upper bound."

      - name: submit_while_account_is_on_credit_hold
        claim_type: Cross-entity validation
        grounds:
          - errors[ERR_ACCOUNT_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / order_submit_requires_account_status_active
          rationale: "That §1.8 instance asserts ERR_ACCOUNT_NOT_ACTIVE for a CREDIT_HOLD account."

      - name: certify_out_of_a_non_endorsed_warehouse
        claim_type: Cross-entity validation
        grounds:
          - errors[ERR_WAREHOUSE_NOT_HAZMAT_ENDORSED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / shipment_certify_requires_warehouse_hazmat_endorsement
          rationale: "That §1.8 instance asserts ERR_WAREHOUSE_NOT_HAZMAT_ENDORSED at certification."

      - name: storm_order_from_the_wrong_region
        claim_type: Cross-entity validation
        grounds:
          - errors[ERR_STORM_REGION_MISMATCH]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / storm_region_mismatch_outranks_pool_exhaustion
          rationale: "That §1.8 instance asserts ERR_STORM_REGION_MISMATCH as the winning error on allocate."

      - name: core_return_against_an_undelivered_order
        claim_type: Cross-entity validation
        grounds:
          - errors[ERR_ORDER_NOT_DELIVERED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / core_return_creation_requires_source_order_delivered
          rationale: "That §1.8 instance asserts ERR_ORDER_NOT_DELIVERED for a SHIPPED source order."

      - name: submit_of_a_lineless_order
        claim_type: Violation -> Error
        grounds:
          - errors[ERR_ORDER_HAS_NO_LINES]
        excluded_because:
          difficulty_instance: boundary_precision_check / submit_rejects_order_holding_zero_lines
          rationale: "That §1.8 instance asserts ERR_ORDER_HAS_NO_LINES at the empty-collection boundary."

