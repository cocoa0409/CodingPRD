          trigger:
            - { call: "POST /molds/${mold_id}/transition-phase", payload: { target_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { err: $.data.error_id } }
          assert:
            - "m_phase == TRANSITION (0 required >= 0 validated promotes immediately)"
            - "err == ERR_TOOLING_PHASE_GATE (open work order WO-TP1 blocks PRODUCTION)"

      - name: start_layup_without_clock_rejected_no_active_permit
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_NO_ACTIVE_PERMIT]", "endpoints[POST /_clock/set_current_utc]"]
        distinguishing_aspect: "With the clock never set, logical time is the fixed default 2026-05-01T00:00:00Z, before the June permit's period: start-layup fails ERR_NO_ACTIVE_PERMIT — proving determinism independent of wall clock."
        test_recipe:
          setup: ["No clock call made; June permit; approved PN-100; production mold; work order RELEASED"]
          setup_api_calls:
            - { call: "POST /emission-permits", payload: { permit_code: "PER-Q3", period_start: "2026-06-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", styrene_quota_kg: 50.0 }, as: EHSOfficer }
            - { call: "POST /molds", payload: { mold_code: "MOLD-DF1", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold_id: $.data.id } }
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_id: $.data.id } }
