      - name: priority_ordering_across_referential_and_constraint_rules
        claim_type: priority_ordering
        grounds: [validations, response_envelope.error]
        excluded_because:
          difficulty_instance: ineligible_collateral_type_outranks_custodian_mismatch
          rationale: "Two simultaneously-violated rules (priority 54 vs 60) with the higher-priority error returned, plus the reverse-order control, are the subject of that §1.8 error_priority_conflict instance; ERR_COLLATERAL_TYPE_INELIGIBLE and ERR_CUSTODIAN_MISMATCH are both triggered there."
      - name: stale_price_versus_oversubscription_priority
        claim_type: priority_conflict
        grounds: ["validations[65]", "validations[70]"]
        excluded_because:
          difficulty_instance: stale_collateral_price_outranks_allocation_oversubscription
          rationale: "The 48-hour PRICE_STALE_HOURS boundary (priority 65) evaluated against a simultaneous par oversubscription (priority 70) is that §1.8 error_priority_conflict instance, which also supplies the ERR_STALE_COLLATERAL_PRICE and ERR_ALLOCATION_OVERSUBSCRIBED triggers."
      - name: mtm_window_overlap_and_minimum_gap_rejected
        claim_type: temporal_validation
        grounds: ["validations[67]", "errors[ERR_MTM_WINDOW_OVERLAP]", domain_constants.MTM_MIN_GAP_HOURS]
        excluded_because:
          difficulty_instance: mtm_window_closed_interval_gap_buffer_on_depository
          rationale: "ERR_MTM_WINDOW_OVERLAP at exactly MTM_MIN_GAP_HOURS and one second inside it is pinned by that §1.8 interval_containment instance."
      - name: allocation_requires_executed_agreement_and_approved_depository
        claim_type: cross_entity_validation
        grounds: ["validations[46]", "validations[48]"]
        excluded_because:
          difficulty_instance: allocation_requires_executed_pledge_agreement
          rationale: "ERR_AGREEMENT_NOT_EXECUTED from each non-EXECUTED agreement state is that §1.8 cross_entity_state_guard instance, and its sibling deposit_account_requires_approved_depository covers ERR_DEPOSITORY_NOT_APPROVED."
      - name: review_and_amendment_round_limits_rejected
        claim_type: violation_to_error
        grounds: ["validations[73]", domain_constants.REVIEW_ROUND_LIMIT, domain_constants.AMENDMENT_ROUND_LIMIT]
        excluded_because:
          difficulty_instance: qualification_review_return_for_info_cycle_round_counting
          rationale: "ERR_ROUND_LIMIT_REACHED at REVIEW_ROUND_LIMIT 3 after the return-for-info cycle is that §1.8 cyclic_state_revisit instance; the AMENDMENT_ROUND_LIMIT 2 half is covered by the corner instance cyclic_amendment_round_limit_blocks_third_amendment in the state_machines section above."
      - name: half_open_adjacency_versus_overlap_on_asset_par
        claim_type: aggregate_validation
        grounds: ["validations[70]", entities.PledgeAllocation.fields.effective_to]
        excluded_because:
          difficulty_instance: allocation_half_open_adjacency_versus_overlap_on_asset_par
          rationale: "Whether two allocations that touch at an instant double-count the same par (and therefore whether ERR_ALLOCATION_OVERSUBSCRIBED fires) is that §1.8 interval_containment instance."

