            - "ServicerAccount.${acct_s_id}.delinquency_score == 80"
            - "OrderLine.${line_id}.unit_price_cents == 102400"
            - "OrderLine.${line_id}.extended_price_cents == 5120000"
            - "PartOrder.${order_id}.invoiced_total_cents == 5120000"

