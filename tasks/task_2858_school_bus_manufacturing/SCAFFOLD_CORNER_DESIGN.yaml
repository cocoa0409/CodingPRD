            - "deliver reports the phase error, not ERR_UNIT_NOT_CERTIFIED (40) or ERR_DRIVER_TRAINING_INCOMPLETE (43)"
            - "BusUnit.${unit_tx_id}.production_status is still PLANNED, certification_status still PENDING, service_status still NONE"
            - "ContractOrder.${order_tx_id}.delivery_posture is unchanged by the four refusals"

