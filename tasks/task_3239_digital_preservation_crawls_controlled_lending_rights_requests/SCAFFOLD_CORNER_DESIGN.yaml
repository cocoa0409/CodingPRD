  # ===========================================================================
  - section: consistency_model
    instances:
      - name: checkout_effects_visible_immediately
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/archive/loans
        distinguishing_aspect: "Immediate consistency: the checkout response and all same-request reads reflect every cascade — the patron counter, item status, and loan row are all updated atomically in one call."
        test_recipe:
          setup:
            - "Work Wic with LENDABLE item Iic; patron P-IC."
          setup_api_calls:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Admin
            - call: "POST /archive/partner-libraries"
              payload: { library_code: "LIB-IC", display_name: "IC Lib", storage_commitment_years: 5 }
              as: LibraryAdmin
              captures: { libic: $.data.id }
            - call: "POST /archive/works"
              payload: { title: "Immediate", author: "IC", publication_year: 2017 }
              as: Admin
              captures: { wic: $.data.id }
            - call: "POST /archive/scan-batches"
              payload: { operator_code: "op-ic" }
              as: ScanOperator
              captures: { bic: $.data.id }
            - call: "POST /archive/items"
              payload: { batch_id: "${bic}", work_id: "${wic}", owning_library_id: "${libic}", page_count: 10, condition_grade: "GOOD" }
              as: ScanOperator
              captures: { iic: $.data.id }
            - call: "POST /archive/scan-batches/${bic}/seal"
              payload: {}
              as: ScanOperator
            - call: "POST /archive/patrons"
              payload: { email: "ic@example.org", full_name: "IC Patron" }
              as: Anonymous
              captures: { pic: $.data.id }
          trigger:
            - call: "POST /archive/loans"
              payload: { item_id: "${iic}", patron_id: "${pic}", loan_kind: "STANDARD" }
              as: Patron
              as_user_id: "${pic}"
              captures: { lic: $.data.id }
            - call: "GET /archive/patrons/${pic}"
              payload: {}
              as: Admin
              captures: { pic_count: $.data.active_loan_count }
            - call: "GET /archive/works/${wic}/items"
              payload: {}
              as: Admin
              captures: { iic_status: "$.data[0].status" }
          assert:
            - "the create response already carries due_at == 2026-09-15T00:00:00Z and status ACTIVE"
            - "pic_count == 1 in the immediate next read (no eventual-consistency lag)"
            - "iic_status == \"ON_LOAN\" in the immediate next read"
