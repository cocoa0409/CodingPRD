# =============================================================================
# SCAFFOLD_CORNER_DESIGN - section 1.9 Coverage Index (non-Difficulty claims)
# Faculty Sabbatical & Leave Administration.
# Sections follow references/claim-extraction-guide.md. Recipes replay from
# empty-DB using only SCAFFOLD.yaml section-1.5 endpoints. Clock default
# 2026-08-01T00:00:00Z unless a recipe sets it.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:
      - name: department_create_defaults
        claim_type: creation
        grounds:
          - entities.Department.fields.posture
          - entities.Department.fields.reserved_amount
        distinguishing_aspect: "A new department starts with reserved 0.00, spent 0.00, available == pool, posture OPEN, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /departments"
              payload: { name: "Engineering", replacement_pool: 160000.00 }
              as: LeaveAdministrator
              captures: { d_id: $.data.id, d_posture: $.data.posture, d_res: $.data.reserved_amount, d_spent: $.data.spent_amount, d_avail: $.data.available_amount, d_v: $.data.version }
          assert:
            - "reserved_amount == 0.00 AND spent_amount == 0.00 AND available_amount == 160000.00"
            - "posture == OPEN AND version == 1 AND id is a server-minted UUID"
      - name: faculty_create_system_field_input_rejected
        claim_type: system_fields
        grounds:
          - entities.FacultyMember.fields.status
          - validations[priority=2]
        distinguishing_aspect: "Client-supplied system field `status` in the create payload is not in the endpoint's input schema and is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["one department exists"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Engineering", replacement_pool: 160000.00 }
              as: LeaveAdministrator
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /faculty-members"
              payload: { employee_number: "F100", full_name: "Fac Uno", department_id: "${d_id}", academic_rank: "ASSOCIATE_PROFESSOR", hire_date: "2020-08-01T00:00:00Z", annual_base_salary: 120000.00, status: "SEPARATED" }
              as: LeaveAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (strict request shape: system/computed fields are not settable)"
      - name: faculty_create_missing_required_field
        claim_type: required_fields
        grounds:
          - entities.FacultyMember.fields.annual_base_salary
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required input annual_base_salary yields ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["one department exists"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Engineering", replacement_pool: 160000.00 }
              as: LeaveAdministrator
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /faculty-members"
              payload: { employee_number: "F100", full_name: "Fac Uno", department_id: "${d_id}", academic_rank: "ASSOCIATE_PROFESSOR", hire_date: "2020-08-01T00:00:00Z" }
              as: LeaveAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"
      - name: faculty_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.FacultyMember.fields.academic_rank
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "academic_rank 'DEAN' is outside the declared enum and is rejected."
        test_recipe:
          setup: ["one department exists"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Engineering", replacement_pool: 160000.00 }
              as: LeaveAdministrator
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /faculty-members"
              payload: { employee_number: "F100", full_name: "Fac Uno", department_id: "${d_id}", academic_rank: "DEAN", hire_date: "2020-08-01T00:00:00Z", annual_base_salary: 120000.00 }
              as: LeaveAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"
      - name: faculty_create_bad_department_fk_returns_404
        claim_type: parent_relationships
        grounds:
          - entities.FacultyMember.fields.department_id
          - errors[ERR_DEPARTMENT_NOT_FOUND]
        distinguishing_aspect: "A body foreign key referencing a non-existent department is rejected with ERR_DEPARTMENT_NOT_FOUND (existence, priority 4)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /faculty-members"
              payload: { employee_number: "F100", full_name: "Fac Uno", department_id: "11111111-2222-4333-8444-555555555555", academic_rank: "ASSOCIATE_PROFESSOR", hire_date: "2020-08-01T00:00:00Z", annual_base_salary: 120000.00 }
              as: LeaveAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DEPARTMENT_NOT_FOUND (404)"
      - name: faculty_list_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope.pagination_fields
          - errors[ERR_INVALID_PAGINATION]
        distinguishing_aspect: "limit/offset window correctly slices 3 rows with total_count 3 and has_more flipping; limit 0, limit 101, and negative offset each yield ERR_INVALID_PAGINATION."
        test_recipe:
          setup: ["one department; three faculty rows F1..F3 created in order"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Engineering", replacement_pool: 160000.00 }
              as: LeaveAdministrator
              captures: { d_id: $.data.id }
            - call: "POST /faculty-members"
              payload: { employee_number: "F100", full_name: "Fac One", department_id: "${d_id}", academic_rank: "ASSOCIATE_PROFESSOR", hire_date: "2020-08-01T00:00:00Z", annual_base_salary: 120000.00 }
              as: LeaveAdministrator
            - call: "POST /faculty-members"
              payload: { employee_number: "F200", full_name: "Fac Two", department_id: "${d_id}", academic_rank: "ASSISTANT_PROFESSOR", hire_date: "2021-08-01T00:00:00Z", annual_base_salary: 100000.00 }
              as: LeaveAdministrator
            - call: "POST /faculty-members"
              payload: { employee_number: "F300", full_name: "Fac Three", department_id: "${d_id}", academic_rank: "FULL_PROFESSOR", hire_date: "2018-08-01T00:00:00Z", annual_base_salary: 140000.00 }
              as: LeaveAdministrator
          trigger:
            - call: "GET /faculty-members"
              payload: { limit: 1, offset: 1 }
              as: LeaveAdministrator
            - call: "GET /faculty-members"
              payload: { limit: 0 }
              as: LeaveAdministrator
              captures: { err1: $.data.error_id }
            - call: "GET /faculty-members"
              payload: { limit: 101 }
              as: LeaveAdministrator
              captures: { err2: $.data.error_id }
            - call: "GET /faculty-members"
              payload: { offset: -1 }
              as: LeaveAdministrator
              captures: { err3: $.data.error_id }
          assert:
            - "window call: exactly 1 row returned, total_count == 3, has_more == true (offset 1 of 3 with limit 1)"
            - "err1 == ERR_INVALID_PAGINATION AND err2 == ERR_INVALID_PAGINATION AND err3 == ERR_INVALID_PAGINATION"
      - name: application_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_APPLICATION_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID yields ERR_APPLICATION_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /leave-applications/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: LeaveAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_APPLICATION_NOT_FOUND"
  # ===========================================================================
  # From Table 2 (State Machines)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: application_initial_state_draft
        claim_type: initial_state
        grounds:
          - state_machines.LeaveApplication
        distinguishing_aspect: "A newly created application starts in DRAFT with funding_status NONE and no composite_score."
        test_recipe:
          setup: ["dept + faculty + DRAFT cycle"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Engineering", replacement_pool: 160000.00 }
              as: LeaveAdministrator
              captures: { d_id: $.data.id }
            - call: "POST /faculty-members"
              payload: { employee_number: "F100", full_name: "Fac Uno", department_id: "${d_id}", academic_rank: "ASSOCIATE_PROFESSOR", hire_date: "2020-08-01T00:00:00Z", annual_base_salary: 120000.00 }
              as: LeaveAdministrator
              captures: { f_id: $.data.id }
            - call: "POST /leave-cycles"
              payload: { name: "AY2027", academic_year: "2027-2028", award_quota: 2 }
              as: ProvostOffice
              captures: { cy_id: $.data.id }
          trigger:
            - call: "POST /leave-applications"
              payload: { leave_type: "SABBATICAL", cycle_id: "${cy_id}", requested_duration_semesters: 1, requested_salary_pct: 100, proposed_start_date: "2027-01-01T00:00:00Z", proposed_end_date: "2027-07-01T00:00:00Z" }
              as: Faculty
              as_user_id: "${f_id}"
              captures: { ap_st: $.data.status, ap_fund: $.data.funding_status }
          assert:
            - "status == DRAFT AND funding_status == NONE AND composite_score is null AND version == 1"
      - name: cycle_invalid_from_transitions_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.LeaveCycle
          - errors[ERR_CYCLE_NOT_CLOSED]
          - errors[ERR_CYCLE_NOT_ALLOCATED]
          - errors[ERR_INVALID_CYCLE_STATE]
        distinguishing_aspect: "allocate from OPEN -> ERR_CYCLE_NOT_CLOSED; finalize from CLOSED -> ERR_CYCLE_NOT_ALLOCATED; open from OPEN -> ERR_INVALID_CYCLE_STATE; close from FINALIZED (terminal) -> ERR_INVALID_CYCLE_STATE."
        test_recipe:
          setup: ["cycle created (DRAFT), then opened"]
          setup_api_calls:
            - call: "POST /leave-cycles"
              payload: { name: "AY2027", academic_year: "2027-2028", award_quota: 2 }
              as: ProvostOffice
              captures: { cy_id: $.data.id }
            - call: "POST /leave-cycles/${cy_id}/open"
              payload: {}
              as: ProvostOffice
          trigger:
            - call: "POST /leave-cycles/${cy_id}/allocate"
              payload: {}
              as: ProvostOffice
              captures: { err1: $.data.error_id }
            - call: "POST /leave-cycles/${cy_id}/open"
              payload: {}
              as: ProvostOffice
              captures: { err2: $.data.error_id }
            - call: "POST /leave-cycles/${cy_id}/close"
              payload: {}
              as: ProvostOffice
            - call: "POST /leave-cycles/${cy_id}/finalize"
              payload: {}
              as: ProvostOffice
              captures: { err3: $.data.error_id }
          assert:
            - "err1 == ERR_CYCLE_NOT_CLOSED (allocate requires CLOSED)"
            - "err2 == ERR_INVALID_CYCLE_STATE (open from OPEN)"
            - "err3 == ERR_CYCLE_NOT_ALLOCATED (finalize requires ALLOCATED)"
      - name: application_terminal_lockdown_withdrawn
        claim_type: terminal_lockdown
        grounds:
          - state_machines.LeaveApplication
          - errors[ERR_INVALID_APPLICATION_STATE]
          - errors[ERR_SABBATICAL_REQUIRES_ALLOCATION]
        distinguishing_aspect: "From terminal WITHDRAWN every transition is rejected; separately, decide on a SABBATICAL application is rejected because sabbaticals only resolve via allocation."
        test_recipe:
          setup:
            - "dept + faculty (72 credits after run) + cycle OPEN"
            - "app1 (sabbatical) submitted then withdrawn; app2 (sabbatical) submitted and left UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Engineering", replacement_pool: 160000.00 }
              as: LeaveAdministrator
              captures: { d_id: $.data.id }
            - call: "POST /faculty-members"
              payload: { employee_number: "F100", full_name: "Fac Uno", department_id: "${d_id}", academic_rank: "ASSOCIATE_PROFESSOR", hire_date: "2020-08-01T00:00:00Z", annual_base_salary: 120000.00 }
              as: LeaveAdministrator
              captures: { f_id: $.data.id }
            - call: "POST /accrual-runs"
              payload: {}
              as: LeaveAdministrator
            - call: "POST /leave-cycles"
              payload: { name: "AY2027", academic_year: "2027-2028", award_quota: 2 }
              as: ProvostOffice
              captures: { cy_id: $.data.id }
            - call: "POST /leave-cycles/${cy_id}/open"
              payload: {}
              as: ProvostOffice
            - call: "POST /leave-applications"
              payload: { leave_type: "SABBATICAL", cycle_id: "${cy_id}", requested_duration_semesters: 1, requested_salary_pct: 100, proposed_start_date: "2027-01-01T00:00:00Z", proposed_end_date: "2027-07-01T00:00:00Z" }
              as: Faculty
              as_user_id: "${f_id}"
              captures: { ap1_id: $.data.id }
            - call: "POST /leave-applications/${ap1_id}/submit"
              payload: {}
              as: Faculty
              as_user_id: "${f_id}"
            - call: "POST /leave-applications/${ap1_id}/withdraw"
              payload: {}
              as: Faculty
              as_user_id: "${f_id}"
            - call: "POST /leave-applications"
              payload: { leave_type: "SABBATICAL", cycle_id: "${cy_id}", requested_duration_semesters: 1, requested_salary_pct: 100, proposed_start_date: "2027-01-01T00:00:00Z", proposed_end_date: "2027-07-01T00:00:00Z" }
              as: Faculty
              as_user_id: "${f_id}"
              captures: { ap2_id: $.data.id }
            - call: "POST /leave-applications/${ap2_id}/submit"
              payload: {}
              as: Faculty
              as_user_id: "${f_id}"
          trigger:
            - call: "POST /leave-applications/${ap1_id}/submit"
              payload: {}
              as: Faculty
              as_user_id: "${f_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /leave-applications/${ap1_id}/request-revision"
              payload: {}
              as: ProvostOffice
              captures: { err2: $.data.error_id }
            - call: "POST /leave-applications/${ap2_id}/decide"
              payload: { decision: "APPROVED" }
              as: ProvostOffice
              captures: { err3: $.data.error_id }
          assert:
            - "err1 == ERR_INVALID_APPLICATION_STATE (WITHDRAWN is terminal)"
            - "err2 == ERR_INVALID_APPLICATION_STATE (request-revision requires UNDER_REVIEW)"
            - "err3 == ERR_SABBATICAL_REQUIRES_ALLOCATION (decide is for non-sabbatical types only)"
      - name: grant_invalid_transitions_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.LeaveGrant
          - errors[ERR_INVALID_GRANT_STATE]
          - errors[ERR_GRANT_START_NOT_REACHED]
        distinguishing_aspect: "complete/curtail from SCHEDULED -> ERR_INVALID_GRANT_STATE; activate before start_date -> ERR_GRANT_START_NOT_REACHED."
        test_recipe:
          setup: ["dept + faculty; PROFESSIONAL application approved -> grant SCHEDULED for 2027-01-01..2027-07-01; clock at default 2026-08-01"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Engineering", replacement_pool: 160000.00 }
              as: LeaveAdministrator
              captures: { d_id: $.data.id }
            - call: "POST /faculty-members"
              payload: { employee_number: "F100", full_name: "Fac Uno", department_id: "${d_id}", academic_rank: "ASSOCIATE_PROFESSOR", hire_date: "2020-08-01T00:00:00Z", annual_base_salary: 120000.00 }
              as: LeaveAdministrator
              captures: { f_id: $.data.id }
            - call: "POST /leave-applications"
              payload: { leave_type: "PROFESSIONAL", requested_duration_semesters: 1, requested_salary_pct: 100, proposed_start_date: "2027-01-01T00:00:00Z", proposed_end_date: "2027-07-01T00:00:00Z" }
              as: Faculty
              as_user_id: "${f_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /leave-applications/${ap_id}/submit"
              payload: {}
              as: Faculty
              as_user_id: "${f_id}"
            - call: "POST /leave-applications/${ap_id}/decide"
              payload: { decision: "APPROVED" }
              as: ProvostOffice
            - call: "GET /leave-grants"
              payload: { application_id: "${ap_id}" }
              as: LeaveAdministrator
              captures: { g_id: "$.data[0].id" }
          trigger:
            - call: "POST /leave-grants/${g_id}/complete"
              payload: {}
              as: LeaveAdministrator
              captures: { err1: $.data.error_id }
            - call: "POST /leave-grants/${g_id}/curtail"
              payload: { actual_return_date: "2027-03-01T00:00:00Z" }
              as: LeaveAdministrator
              captures: { err2: $.data.error_id }
            - call: "POST /leave-grants/${g_id}/activate"
              payload: {}
              as: LeaveAdministrator
              captures: { err3: $.data.error_id }
          assert:
            - "err1 == ERR_INVALID_GRANT_STATE (complete requires ACTIVE)"
            - "err2 == ERR_INVALID_GRANT_STATE (curtail requires ACTIVE)"
            - "err3 == ERR_GRANT_START_NOT_REACHED (clock 2026-08-01 < start 2027-01-01)"
      - name: plan_state_gates_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CoveragePlan
          - errors[ERR_INVALID_PLAN_STATE]
        distinguishing_aspect: "approve from DRAFT and request-revision from DRAFT are rejected; submit twice rejects the second attempt."
        test_recipe:
          setup: ["dept + chair + faculty (72 credits) + cycle OPEN + application UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Engineering", replacement_pool: 160000.00 }
              as: LeaveAdministrator
              captures: { d_id: $.data.id }
            - call: "POST /faculty-members"
              payload: { employee_number: "C100", full_name: "Chair Eng", department_id: "${d_id}", academic_rank: "FULL_PROFESSOR", hire_date: "2010-01-01T00:00:00Z", annual_base_salary: 150000.00 }
              as: LeaveAdministrator
              captures: { ch_id: $.data.id }
            - call: "PATCH /departments/${d_id}"
              payload: { chair_faculty_id: "${ch_id}" }
              as: LeaveAdministrator
            - call: "POST /faculty-members"
              payload: { employee_number: "F100", full_name: "Fac Uno", department_id: "${d_id}", academic_rank: "ASSOCIATE_PROFESSOR", hire_date: "2020-08-01T00:00:00Z", annual_base_salary: 120000.00 }
              as: LeaveAdministrator
              captures: { f_id: $.data.id }
            - call: "POST /accrual-runs"
              payload: {}
              as: LeaveAdministrator
            - call: "POST /leave-cycles"
              payload: { name: "AY2027", academic_year: "2027-2028", award_quota: 2 }
              as: ProvostOffice
              captures: { cy_id: $.data.id }
            - call: "POST /leave-cycles/${cy_id}/open"
              payload: {}
              as: ProvostOffice
            - call: "POST /leave-applications"
              payload: { leave_type: "SABBATICAL", cycle_id: "${cy_id}", requested_duration_semesters: 1, requested_salary_pct: 100, proposed_start_date: "2027-01-01T00:00:00Z", proposed_end_date: "2027-07-01T00:00:00Z" }
              as: Faculty
              as_user_id: "${f_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /leave-applications/${ap_id}/submit"
              payload: {}
              as: Faculty
              as_user_id: "${f_id}"
            - call: "GET /leave-applications/${ap_id}"
              payload: {}
              as: LeaveAdministrator
              captures: { ap_v: $.data.version }
            - call: "POST /coverage-plans"
              payload: { application_id: "${ap_id}", courses_to_cover: 3, expected_application_version: "${ap_v}" }
              as: DepartmentChair
              as_user_id: "${ch_id}"
              captures: { cp_id: $.data.id }
          trigger:
            - call: "POST /coverage-plans/${cp_id}/approve"
              payload: {}
              as: ProvostOffice
              captures: { err1: $.data.error_id }
            - call: "POST /coverage-plans/${cp_id}/request-revision"
              payload: {}
              as: ProvostOffice
              captures: { err2: $.data.error_id }
            - call: "POST /coverage-plans/${cp_id}/submit"
              payload: {}
              as: DepartmentChair
              as_user_id: "${ch_id}"
            - call: "POST /coverage-plans/${cp_id}/submit"
              payload: {}
              as: DepartmentChair
              as_user_id: "${ch_id}"
              captures: { err3: $.data.error_id }
          assert:
            - "err1 == ERR_INVALID_PLAN_STATE (approve requires SUBMITTED)"
            - "err2 == ERR_INVALID_PLAN_STATE (request-revision requires SUBMITTED)"
            - "first submit succeeds (DRAFT -> SUBMITTED); second submit err3 == ERR_INVALID_PLAN_STATE (idempotency guard)"
      - name: fellowship_state_gates_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.ExternalFellowship
          - errors[ERR_INVALID_FELLOWSHIP_STATE]
        distinguishing_aspect: "verify twice -> second rejected; decline a VERIFIED fellowship works; verifying the DECLINED one is rejected. Uses a DRAFT application (fellowship reporting needs only an owned sabbatical application)."
        test_recipe:
          setup: ["dept + faculty + DRAFT-cycle sabbatical application (DRAFT); two fellowships reported"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Engineering", replacement_pool: 160000.00 }
              as: LeaveAdministrator
              captures: { d_id: $.data.id }
            - call: "POST /faculty-members"
              payload: { employee_number: "F100", full_name: "Fac Uno", department_id: "${d_id}", academic_rank: "ASSOCIATE_PROFESSOR", hire_date: "2020-08-01T00:00:00Z", annual_base_salary: 120000.00 }
              as: LeaveAdministrator
              captures: { f_id: $.data.id }
            - call: "POST /leave-cycles"
              payload: { name: "AY2027", academic_year: "2027-2028", award_quota: 2 }
              as: ProvostOffice
              captures: { cy_id: $.data.id }
            - call: "POST /leave-applications"
              payload: { leave_type: "SABBATICAL", cycle_id: "${cy_id}", requested_duration_semesters: 1, requested_salary_pct: 100, proposed_start_date: "2027-03-01T00:00:00Z", proposed_end_date: "2027-09-01T00:00:00Z" }
              as: Faculty
              as_user_id: "${f_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /external-fellowships"
              payload: { application_id: "${ap_id}", name: "Fel A", amount: 5000.00, window_start_date: "2027-03-01T00:00:00Z", window_end_date: "2027-07-01T00:00:00Z" }
              as: Faculty
              as_user_id: "${f_id}"
              captures: { fa_id: $.data.id }
            - call: "POST /external-fellowships"
              payload: { application_id: "${ap_id}", name: "Fel B", amount: 6000.00, window_start_date: "2027-03-01T00:00:00Z", window_end_date: "2027-07-01T00:00:00Z" }
              as: Faculty
              as_user_id: "${f_id}"
              captures: { fb_id: $.data.id }
          trigger:
            - call: "POST /external-fellowships/${fa_id}/verify"
              payload: {}
              as: LeaveAdministrator
            - call: "POST /external-fellowships/${fa_id}/verify"
              payload: {}
              as: LeaveAdministrator
              captures: { err1: $.data.error_id }
            - call: "POST /external-fellowships/${fb_id}/verify"
              payload: {}
              as: LeaveAdministrator
            - call: "POST /external-fellowships/${fb_id}/decline"
              payload: {}
              as: Faculty
              as_user_id: "${f_id}"
              captures: { fb_st: $.data.status }
            - call: "POST /external-fellowships/${fb_id}/verify"
              payload: {}
              as: LeaveAdministrator
