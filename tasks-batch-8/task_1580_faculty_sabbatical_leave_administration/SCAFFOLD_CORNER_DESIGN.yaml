  # ===========================================================================
  # From Table 4 (Validations)
  # ===========================================================================
  - section: validations
    instances:
      - name: submit_missing_auth_header_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT]
        distinguishing_aspect: "Missing X-User-Role/X-User-ID headers short-circuit every other failure at priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT (400), even when the target does not exist."
        test_recipe:
          setup: ["nothing needed"]
          setup_api_calls: []
          trigger:
            # X-User-Role / X-User-ID headers intentionally omitted
            - call: "POST /leave-cycles/11111111-2222-4333-8444-555555555555/open"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT (auth beats even existence)"
      - name: role_check_precedes_existence
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "A Faculty caller hitting a ProvostOffice-only endpoint with a non-existent cycle id gets ERR_FORBIDDEN_ROLE (priority 3), not ERR_CYCLE_NOT_FOUND (priority 4)."
        test_recipe:
          setup: ["one faculty row exists"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Engineering", replacement_pool: 160000.00 }
              as: LeaveAdministrator
              captures: { d_id: $.data.id }
            - call: "POST /faculty-members"
              payload: { employee_number: "F100", full_name: "Fac Uno", department_id: "${d_id}", academic_rank: "ASSOCIATE_PROFESSOR", hire_date: "2020-08-01T00:00:00Z", annual_base_salary: 120000.00 }
              as: LeaveAdministrator
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /leave-cycles/11111111-2222-4333-8444-555555555555/open"
              payload: {}
              as: Faculty
              as_user_id: "${f_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_ROLE (role priority 3 before existence priority 4)"
      - name: submit_other_faculty_application_forbidden
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "Faculty B submitting faculty A's application is rejected ERR_NOT_RESOURCE_OWNER; entity_backed identity makes the check X-User-ID == applicant_faculty_id."
