            - { call: "POST /admissions/aid-applications/${aid4}/finalize-award", payload: {}, as: FinancialAidOfficer, as_user_id: "fao-2" }
          trigger:
            - { call: "POST /admissions/aid-applications/${aid3}/accept-award", payload: {}, as: Parent, as_user_id: "fam-3" }
            - { call: "POST /admissions/aid-applications/${aid4}/accept-award", payload: {}, as: Parent, as_user_id: "fam-4", captures: { err: $.data.error_id } }
          assert:
