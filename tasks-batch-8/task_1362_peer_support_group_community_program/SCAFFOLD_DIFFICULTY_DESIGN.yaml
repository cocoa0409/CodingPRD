            - "error_id == ERR_REFERENCE_NOT_FOUND (not ERR_ROOM_OVERLAP)"

  # ==========================================================================
  # Rule 6: Boundary-precision checks on different metrics/endpoints
  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: enrollment_confirm_at_exact_capacity_goes_to_waitlist_not_reject
        grounds:
          - validations[priority=20]
          - state_machines.Enrollment.RESERVED_to_WAITLISTED
        distinguishing_aspect: |
          Metric: active_enrollment_count vs base_capacity. Endpoint:
          /enrollments/{eid}/confirm. Boundary: when active_enrollment_count ==
          base_capacity (exactly equal, not exceeding), the next confirmation
          must transition to WAITLISTED (not reject with ERR_GROUP_AT_CAPACITY).
          The trigger is >= (capacity full), but the system handles it as
          waitlist promotion instead of a hard error.
        test_recipe:
          setup:
            - "PeerGroup G base_capacity=2, status=ACTIVE"
            - "Participants A, B, C all ACTIVE with SIGNED agreements"
            - "A and B enrolled then CONFIRMED (active_enrollment_count = 2 == base_capacity)"
            - "C enrolled (RESERVED)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "P", focus_area: "GRIEF" }
              as: ProgramAdmin
              captures: { pid: $.data.id }
            - call: "POST /programs/${pid}/groups"
              payload: { name: "G", modality: "VIRTUAL", base_capacity: 2, required_facilitator_level: 1 }
              as: ProgramAdmin
              captures: { gid: $.data.id }
            - call: "POST /programs/${pid}/groups/${gid}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /participants"
              payload: { full_name: "A", email: "a@x.com", household_size: 1 }
              as: ProgramAdmin
              captures: { pa: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "B", email: "b@x.com", household_size: 1 }
              as: ProgramAdmin
              captures: { pb: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "C", email: "c@x.com", household_size: 1 }
              as: ProgramAdmin
              captures: { pc: $.data.id }
            - call: "POST /participants/${pa}/agreements"
              payload: { signed_at: "2026-07-25T00:00:00Z", expires_at: "2027-07-25T00:00:00Z", agreement_version: 1 }
              as: ProgramAdmin
            - call: "POST /participants/${pb}/agreements"
              payload: { signed_at: "2026-07-25T00:00:00Z", expires_at: "2027-07-25T00:00:00Z", agreement_version: 1 }
              as: ProgramAdmin
            - call: "POST /participants/${pc}/agreements"
              payload: { signed_at: "2026-07-25T00:00:00Z", expires_at: "2027-07-25T00:00:00Z", agreement_version: 1 }
              as: ProgramAdmin
            - call: "POST /participants/${pa}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /participants/${pb}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /participants/${pc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${pid}/groups/${gid}/enrollments"
              payload: { participant_id: "${pa}" }
              as: ProgramAdmin
              captures: { ea: $.data.id }
            - call: "GET /programs/${pid}/groups/${gid}"
              payload: {}
              as: ProgramAdmin
              captures: { gv1: $.data.version }
            - call: "POST /programs/${pid}/groups/${gid}/enrollments/${ea}/confirm"
              payload: { expected_group_version: "${gv1}" }
              as: ProgramAdmin
            - call: "POST /programs/${pid}/groups/${gid}/enrollments"
              payload: { participant_id: "${pb}" }
              as: ProgramAdmin
              captures: { eb: $.data.id }
            - call: "GET /programs/${pid}/groups/${gid}"
              payload: {}
              as: ProgramAdmin
              captures: { gv2: $.data.version }
            - call: "POST /programs/${pid}/groups/${gid}/enrollments/${eb}/confirm"
              payload: { expected_group_version: "${gv2}" }
              as: ProgramAdmin
            - call: "POST /programs/${pid}/groups/${gid}/enrollments"
              payload: { participant_id: "${pc}" }
              as: ProgramAdmin
              captures: { ec: $.data.id }
            - call: "GET /programs/${pid}/groups/${gid}"
              payload: {}
              as: ProgramAdmin
              captures: { gv3: $.data.version }
          trigger:
            - call: "POST /programs/${pid}/groups/${gid}/enrollments/${ec}/confirm"
              payload: { expected_group_version: "${gv3}" }
              as: ProgramAdmin
          assert:
            - "PeerGroup.${gid}.active_enrollment_count == 2 (at boundary, == base_capacity)"
            - "Boundary: capacity==2 means count >= capacity triggers waitlist transition"
            - "Enrollment.${ec}.seat_status == WAITLISTED (not an error)"
            - "This is NOT a rejection — the system handles the boundary via state transition"

      - name: agreement_expiry_now_equals_expires_at_still_valid
        grounds:
          - validations[priority=16]
          - state_machines.ConfidentialityAgreement.SIGNED_to_EXPIRED
        distinguishing_aspect: |
          Metric: current_utc vs expires_at. Endpoint:
          /participants/{pid}/agreements POST + /enrollments/{eid}/confirm.
          Boundary: when current_utc == expires_at (exactly equal), the
          agreement is still valid (system uses strict >, not >=, for expiry).
          Only current_utc > expires_at triggers EXPIRED transition.
        test_recipe:
          setup:
            - "Participant A with ConfidentialityAgreement expires_at = 2026-08-15T12:00:00Z"
            - "Logical clock set to exactly 2026-08-15T12:00:00Z"
            - "PeerGroup G ACTIVE; Participant A ACTIVE, enrolled RESERVED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /participants"
              payload: { full_name: "A", email: "a@x.com", household_size: 1 }
              as: ProgramAdmin
              captures: { pa: $.data.id }
            - call: "POST /participants/${pa}/agreements"
              payload: { signed_at: "2026-07-25T00:00:00Z", expires_at: "2026-08-15T12:00:00Z", agreement_version: 1 }
              as: ProgramAdmin
            - call: "POST /participants/${pa}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "P", focus_area: "GRIEF" }
              as: ProgramAdmin
              captures: { pid: $.data.id }
            - call: "POST /programs/${pid}/groups"
              payload: { name: "G", modality: "VIRTUAL", base_capacity: 5, required_facilitator_level: 1 }
              as: ProgramAdmin
              captures: { gid: $.data.id }
            - call: "POST /programs/${pid}/groups/${gid}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${pid}/groups/${gid}/enrollments"
              payload: { participant_id: "${pa}" }
              as: ProgramAdmin
              captures: { eid: $.data.id }
            # Set clock to exactly expires_at — boundary
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T12:00:00Z" }
              as: ProgramAdmin
            - call: "GET /programs/${pid}/groups/${gid}"
              payload: {}
              as: ProgramAdmin
              captures: { gv: $.data.version }
          trigger:
            - call: "POST /programs/${pid}/groups/${gid}/enrollments/${eid}/confirm"
              payload: { expected_group_version: "${gv}" }
              as: ProgramAdmin
          assert:
            - "current_utc == expires_at (exactly 2026-08-15T12:00:00Z)"
            - "Boundary semantics: expiry uses strict >, so agreement is still SIGNED at boundary"
            - "ConfidentialityAgreement.status == SIGNED (not EXPIRED)"
            - "Enrollment.${eid}.seat_status == CONFIRMED (confirm succeeds at boundary)"

  # ==========================================================================
  # Rule 7: Cross-entity state dependencies across different entity pairs
  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: enrollment_confirm_depends_on_participant_agreement_signed
        grounds:
          - state_machines.Enrollment.RESERVED_to_CONFIRMED
          - entities.Participant.fields.current_agreement_id
          - state_machines.ConfidentialityAgreement
        distinguishing_aspect: |
          Entity pair: Enrollment → ConfidentialityAgreement (via Participant).
          Enrollment cannot transition RESERVED→CONFIRMED unless the
          Participant's current_agreement_id references a ConfidentialityAgreement
          with status=SIGNED AND expires_at > current_utc.
        test_recipe:
          setup:
            - "PeerGroup G ACTIVE, base_capacity=5"
            - "Participant A with NO ConfidentialityAgreement at all"
            - "Participant A is REGISTERED (cannot activate without agreement)"
            - "Enrollment created via admin (bypassing participant-active check via direct creation), or A activated then agreement revoked"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "P", focus_area: "GRIEF" }
              as: ProgramAdmin
              captures: { pid: $.data.id }
            - call: "POST /programs/${pid}/groups"
              payload: { name: "G", modality: "VIRTUAL", base_capacity: 5, required_facilitator_level: 1 }
              as: ProgramAdmin
              captures: { gid: $.data.id }
            - call: "POST /programs/${pid}/groups/${gid}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /participants"
              payload: { full_name: "A", email: "a@x.com", household_size: 1 }
              as: ProgramAdmin
              captures: { pa: $.data.id }
            - call: "POST /participants/${pa}/agreements"
              payload: { signed_at: "2026-07-25T00:00:00Z", expires_at: "2027-07-25T00:00:00Z", agreement_version: 1 }
              as: ProgramAdmin
              captures: { aid: $.data.id }
            - call: "POST /participants/${pa}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${pid}/groups/${gid}/enrollments"
              payload: { participant_id: "${pa}" }
              as: ProgramAdmin
              captures: { eid: $.data.id }
            # Revoke the agreement — now A's current_agreement_id cleared
            - call: "POST /participants/${pa}/agreements/${aid}/revoke"
              payload: {}
              as: ProgramAdmin
            - call: "GET /programs/${pid}/groups/${gid}"
              payload: {}
              as: ProgramAdmin
              captures: { gv: $.data.version }
          trigger:
            - call: "POST /programs/${pid}/groups/${gid}/enrollments/${eid}/confirm"
              payload: { expected_group_version: "${gv}" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Participant.${pa}.current_agreement_id == null (revoked)"
            - "Cross-entity dependency: Enrollment state depends on ConfidentialityAgreement state via Participant"
            - "err == ERR_INVALID_STATE (confirm precondition fails)"

      - name: session_schedule_depends_on_facilitator_certified_and_level
        grounds:
          - state_machines.Session.DRAFT_to_SCHEDULED
          - state_machines.Facilitator
          - calculations.facilitator_level
