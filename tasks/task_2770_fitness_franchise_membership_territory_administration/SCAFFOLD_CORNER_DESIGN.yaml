      - name: corner_reviewing_an_already_approved_promotion_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_INVALID_PROMOTION_STATE
          - state_machines.Promotion.PENDING_REVIEW_to_APPROVED
        distinguishing_aspect: "Brand review is a one-shot decision: the promotion leaves PENDING_REVIEW on the first call and a second review - even one carrying the identical APPROVE decision - is refused with ERR_INVALID_PROMOTION_STATE, so an approved discount cannot be silently re-approved or flipped to REJECTED through the same route."
