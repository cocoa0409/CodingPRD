        distinguishing_aspect: "Apostille uniqueness uses a different interval semantic — an aggregate in-flight-occupancy predicate (status IN {SUBMITTED,ROUTED}) per document_id rather than a time window: a second order for the same document while one is in-flight -> ERR_DUPLICATE_APOSTILLE."
