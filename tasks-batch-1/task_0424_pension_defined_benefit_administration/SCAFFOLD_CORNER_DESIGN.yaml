  # ===========================================================================
  - section: errors
    instances:
      - name: duplicate_ein_psn_on_plan_create
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_DUPLICATE_RESOURCE]
          - entities.PensionPlan.fields.ein_psn
        distinguishing_aspect: "Two plans with the same ein_psn -> second create ERR_DUPLICATE_RESOURCE (409); ein_psn is globally unique."
        test_recipe:
          setup: ["One plan with ein_psn 99-0000022-001 already created."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme Dup1", ein_psn: "99-0000022-001", benefit_formula_type: "FINAL_AVERAGE_PAY", fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
          trigger:
            - call: "POST /plans"
              payload: { plan_name: "Acme Dup2", ein_psn: "99-0000022-001", benefit_formula_type: "CASH_BALANCE", fap_accrual_rate: 0.0, cb_pay_credit_rate: 0.05, cb_interest_crediting_rate: 0.04 }
              as: PlanSponsor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_RESOURCE"

  # ===========================================================================
  - section: rbac
    instances:
      - name: plan_sponsor_cannot_add_participant_forbidden
        claim_type: role_denied
        grounds:
          - roles.PlanSponsor
          - roles.BenefitsAdministrator
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "POST /plans/participants is BenefitsAdministrator-exclusive; PlanSponsor calling it -> ERR_FORBIDDEN (403). Segregation-of-duties peer-role separation."
        test_recipe:
          setup: ["A plan exists."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme RBAC", ein_psn: "99-0000023-001", benefit_formula_type: "FINAL_AVERAGE_PAY", fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /plans/participants"
              payload: { plan_id: "${plan_id}", ssn_last4: "2023", date_of_birth: "1962-01-01", hire_date: "2000-01-01" }
              as: PlanSponsor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN"

      - name: benefits_admin_cannot_certify_filing_forbidden
        claim_type: role_denied
        grounds:
          - roles.PlanActuary
          - roles.BenefitsAdministrator
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "POST /plans/filings/{id}/certify is PlanActuary-exclusive; BenefitsAdministrator calling it -> ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["A DRAFT filing exists."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme RBAC2", ein_psn: "99-0000024-001", benefit_formula_type: "FINAL_AVERAGE_PAY", fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /plans/filings"
              payload: { plan_id: "${plan_id}", plan_year: 2024, plan_assets_cents: 8000000000, funding_target_cents: 10000000000 }
              as: PlanActuary
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /plans/filings/${f_id}/certify"
              payload: { expected_plan_version: "${f_id}" }
              as: BenefitsAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN"

      - name: missing_user_headers_unauthenticated
        claim_type: missing_auth
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with missing/invalid X-User-Role or X-User-ID -> ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /plans/participants/00000000-0000-4000-8000-0000000000bb"
              payload: {}
              as: NoAuth
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_plan_version_on_second_certify
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[filing-certify-stale-plan]
          - errors[ERR_STALE_VERSION]
          - state_machines.PlanYearFiling.DRAFT_to_CERTIFIED
        distinguishing_aspect: |
          Reading plan.version v0, certifying filing A bumps plan.version to v1; a second certify on
          filing B still carrying expected_plan_version v0 is rejected with ERR_STALE_VERSION (412).
          Two strictly sequential requests; OCC on PensionPlan.version.
        test_recipe:
          setup: ["Plan with two DRAFT filings (years 2024 and 2025); first certify advances plan.version."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme OCC", ein_psn: "99-0000025-001", benefit_formula_type: "FINAL_AVERAGE_PAY", fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /plans/filings"
              payload: { plan_id: "${plan_id}", plan_year: 2024, plan_assets_cents: 8400000000, funding_target_cents: 10000000000 }
              as: PlanActuary
              captures: { f24_id: $.data.id }
            - call: "POST /plans/filings"
              payload: { plan_id: "${plan_id}", plan_year: 2025, plan_assets_cents: 9000000000, funding_target_cents: 10000000000 }
              as: PlanActuary
              captures: { f25_id: $.data.id }
            - call: "POST /plans/filings/${f24_id}/certify"
              payload: { expected_plan_version: "${plan_v0}" }
              as: PlanActuary
          trigger:
            - call: "POST /plans/filings/${f25_id}/certify"
              payload: { expected_plan_version: "${plan_v0}" }
              as: PlanActuary
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: occ_correct_version_certify_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[filing-certify-stale-plan]
          - state_machines.PlanYearFiling.DRAFT_to_CERTIFIED
          - entities.PensionPlan.fields.version
        distinguishing_aspect: "Certify carrying the current plan.version succeeds, transitions the filing to CERTIFIED, and increments PensionPlan.version by 1."
        test_recipe:
          setup: ["Plan with one DRAFT 2024 filing; client holds the current plan.version."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme OCC2", ein_psn: "99-0000026-001", benefit_formula_type: "FINAL_AVERAGE_PAY", fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /plans/filings"
              payload: { plan_id: "${plan_id}", plan_year: 2024, plan_assets_cents: 8400000000, funding_target_cents: 10000000000 }
              as: PlanActuary
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /plans/filings/${f_id}/certify"
              payload: { expected_plan_version: "${plan_v0}" }
              as: PlanActuary
              captures: { st: $.data.status, aftap: $.data.aftap_pct }
            - call: "GET /plans/${plan_id}"
              payload: {}
              as: PlanActuary
              captures: { v_after: $.data.version }
          assert:
            - "PlanYearFiling.${f_id}.status == CERTIFIED"
            - "PlanYearFiling.${f_id}.aftap_pct == 0.84"
            - "PensionPlan.${plan_id}.version == 2"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_funding_posture_visible_in_same_response
        claim_type: immediate
        grounds:
          - calculations.funding_posture
          - entities.PensionPlan.fields.funding_posture
        distinguishing_aspect: "After certify, the recomputed funding_posture is visible immediately on the next GET /plans/{id} (RESTRICTED at aftap 0.65) in the same request flow; no eventual lag."
        test_recipe:
          setup: ["Plan with a DRAFT 2024 filing whose aftap will be 0.65 (RESTRICTED)."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme Imm", ein_psn: "99-0000027-001", benefit_formula_type: "FINAL_AVERAGE_PAY", fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /plans/filings"
              payload: { plan_id: "${plan_id}", plan_year: 2024, plan_assets_cents: 6500000000, funding_target_cents: 10000000000 }
              as: PlanActuary
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /plans/filings/${f_id}/certify"
              payload: { expected_plan_version: "${plan_v0}" }
              as: PlanActuary
            - call: "GET /plans/${plan_id}"
              payload: {}
              as: PlanActuary
              captures: { posture: $.data.funding_posture }
          assert:
            - "PensionPlan.${plan_id}.funding_posture == RESTRICTED"
