  - section: calculations
    instances:
      - name: student_eligibility_returns_the_first_matching_clause_only
        claim_type: Correct Result
        grounds:
          - calculations.student_eligibility_status
          - endpoints["POST /wbl/students"]
        distinguishing_aspect: |
          Clause order is pinned: a student who fails grade, GPA and attendance all at once must be
          INELIGIBLE_GRADE — not INELIGIBLE_ACADEMIC, not INELIGIBLE_ATTENDANCE and not a composite —
          because the first matching clause wins.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T08:00:00Z"
          setup_api_calls:
            - call: "POST /wbl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: WblCoordinator
          trigger:
            - call: "POST /wbl/students"
              payload: { full_name: "Wren Kovac", birth_date: "2011-01-19", grade_level: 9, gpa: 1.50, attendance_rate: 0.80, student_learner_certificate: false, guardian_consent_on_file: true }
              as: WblCoordinator
          assert:
            - "response status == 201"
            - "response data.eligibility_status == INELIGIBLE_GRADE"
            - "response data.active_placement_count == 0"

      - name: eligibility_thresholds_are_strict_less_than_at_two_point_zero_and_zero_point_nine
        claim_type: Precision
        grounds:
          - calculations.student_eligibility_status
          - endpoints["PATCH /wbl/students/{studentId}/academics"]
        distinguishing_aspect: |
          MIN_GPA and MIN_ATTENDANCE are compared with strict less-than at 2-decimal precision, so a
          student sitting exactly on 2.00 GPA and 0.90 attendance in grade 10 must re-derive to
          ELIGIBLE; an implementation using <= would report INELIGIBLE_ACADEMIC.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T08:00:00Z"
            - "student stored as grade 9 / gpa 2.00 / attendance 0.90, i.e. INELIGIBLE_GRADE"
          setup_api_calls:
            - call: "POST /wbl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: WblCoordinator
            - call: "POST /wbl/students"
              payload: { full_name: "Xan Petrosyan", birth_date: "2010-12-02", grade_level: 9, gpa: 2.00, attendance_rate: 0.90, student_learner_certificate: true, guardian_consent_on_file: true }
              as: WblCoordinator
              captures: { stu_id: $.data.id }
          trigger:
            - call: "PATCH /wbl/students/${stu_id}/academics"
              payload: { grade_level: 10, gpa: 2.00, attendance_rate: 0.90 }
              as: WblCoordinator
          assert:
            - "response status == 200"
            - "response data.grade_level == 10"
            - "response data.gpa == 2.00"
            - "response data.attendance_rate == 0.90"
            - "response data.eligibility_status == ELIGIBLE"

      - name: safety_score_penalty_counts_conditional_worksites_and_ignores_approved_ones
        claim_type: Input Set Filtering
        grounds:
          - calculations.employer_safety_score_posture
          - entities.EmployerPartner.fields.safety_score
        distinguishing_aspect: |
          The site penalty input set is Worksite rows with safety_status == CONDITIONAL only: with one
          CONDITIONAL and one APPROVED worksite the partner sits at 100 - 10 = 90 and ELIGIBLE, so a
          second penalty for the APPROVED site (80) or no penalty at all (100) both fail.
        test_recipe:
          setup:
            - "logical clock at 2026-09-07T08:00:00Z"
            - "one partner with two worksites; site A already decided CONDITIONAL, site B has a SUBMITTED review"
          setup_api_calls:
            - call: "POST /wbl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T08:00:00Z" }
              as: WblCoordinator
