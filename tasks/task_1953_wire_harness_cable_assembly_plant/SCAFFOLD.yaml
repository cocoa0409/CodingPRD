# =============================================================================
# Task 1953: Wire Harness & Cable Assembly Plant (IPC/WHMA contract harness maker)
# Scaffold seed tables — single source of truth for PRD / tests / implementation.
# =============================================================================

scenario: |
  1953. Wire Harness & Cable Assembly Plant (IPC/WHMA contract harness maker): harness drawing & connector BOM, wire cut/strip/crimp program & applicator setup, crimp pull-test sampling & operator certification, IPC/WHMA workmanship class, continuity/hipot test & serialized record, engineering change & partial-build scrap, customer-consigned connector, kitting for line-side delivery

domain_name: wire-harness-assembly
api_prefix: /plant

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # IPC/WHMA workmanship gating, serialized test records, certification windows
  secondary_archetype: quota_allocation      # customer-consigned connector lots issued/consumed/scrapped/returned
  complexity_layers:
    - optimistic_concurrency                 # OCC on BuildOrder.version and MachineProgram.version
    - cascading_side_effects                 # pull-test FAIL quarantine sweep; ECN apply disposition chain
    - derived_field_reconciliation           # consigned lot buckets, build-order counters, kit shortage
    - rate_threshold_triggers                # pull-force tiers, hipot class minimums, auto-DEPLETED at zero
  entity_topology: flat                      # peer resources linked by FK references; no nested ownership paths
  state_machine_shape: cyclic                # HarnessUnit BUILT<->REWORK; Applicator QUALIFIED->QUARANTINED->IN_SETUP->QUALIFIED
  relationship_patterns:
    - one_to_many                            # Drawing->Component, BuildOrder->HarnessUnit
    - cross_aggregate                        # Kit issues reference ConsignedLot; tests reference Applicator/Program/Operator
  role_model: segregation_of_duties          # builder of a harness may not sign off its electrical test
  consistency_model: immediate               # all side effects visible in the same request's response / subsequent reads

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; FK links; no nested paths)
# =============================================================================
entities:
  - name: HarnessDrawing
    parent: null
    common_fields: true
    fields:
      - { name: drawing_number, type: string, source: input, description: "Customer drawing number; unique" }
      - { name: customer_code, type: string, source: input, description: "Owning customer code" }
      - { name: revision, type: string, source: input, description: "Revision letter, e.g. A" }
      - { name: workmanship_class, type: enum, source: input, description: "IPC_CLASS_1 | IPC_CLASS_2 | IPC_CLASS_3" }
      - { name: status, type: enum, source: system, description: "DRAFT | RELEASED | SUPERSEDED", default: DRAFT }
      - { name: released_at, type: datetime, source: system, description: "Logical-clock timestamp of release; null until released" }
      - { name: superseded_at, type: datetime, source: system, description: "Logical-clock timestamp of supersession; null until superseded by ECN" }

  - name: DrawingComponent
    parent: null
    common_fields: true
    fields:
      - { name: drawing_id, type: string, source: input, description: "FK -> HarnessDrawing.id; drawing revision this BOM line belongs to" }
      - { name: find_number, type: string, source: input, description: "BOM find number; unique per drawing (constraint: (drawing_id, find_number) unique)" }
      - { name: component_type, type: enum, source: input, description: "CONNECTOR | TERMINAL | WIRE | SEAL | SLEEVE" }
      - { name: mpn, type: string, source: input, description: "Manufacturer part number" }
      - { name: qty_per_harness, type: integer, source: input, description: "Quantity required per harness; >= 1" }
      - { name: supply_type, type: enum, source: input, description: "FACTORY_STOCK | CUSTOMER_CONSIGNED" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Standard unit cost in cents; >= 0" }

  - name: ConsignedLot
    parent: null
    common_fields: true
    fields:
      - { name: lot_code, type: string, source: input, description: "Customer lot code; unique" }
      - { name: owner_customer_code, type: string, source: input, description: "Customer that owns this consigned material" }
      - { name: mpn, type: string, source: input, description: "Manufacturer part number of the consigned connector" }
      - { name: unit_liability_cents, type: integer, source: input, description: "Book liability per piece owed to customer if lost/scrapped; >= 0" }
      - { name: replacement_cost_cents, type: integer, source: input, description: "Current replacement cost per piece; >= 0" }
      - { name: qty_received, type: integer, source: input, description: "Pieces received into the lot; >= 1" }
      - { name: qty_on_hand, type: integer, source: computed, description: "Pieces physically available; starts at qty_received" }
      - { name: qty_issued_open, type: integer, source: computed, description: "Pieces issued to kits not yet delivered line-side" }
      - { name: qty_consumed, type: integer, source: computed, description: "Pieces delivered line-side (consumed by production)" }
      - { name: qty_scrapped, type: integer, source: computed, description: "Consumed pieces later scrapped inside harness units" }
      - { name: qty_returned, type: integer, source: computed, description: "Pieces returned to the customer" }
      - { name: book_liability_cents, type: integer, source: computed, description: "qty_scrapped * unit_liability_cents (BOOK_VALUE variant)" }
      - { name: replacement_liability_cents, type: integer, source: computed, description: "qty_scrapped * replacement_cost_cents (REPLACEMENT_VALUE variant)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DEPLETED | RETURNED", default: ACTIVE }

  - name: Operator
    parent: null
    common_fields: true
    fields:
      - { name: operator_name, type: string, source: input, description: "Operator display name" }
      - { name: badge_no, type: string, source: input, description: "Badge number; unique" }

  - name: OperatorCertification
    parent: null
    common_fields: true
    fields:
      - { name: operator_id, type: string, source: input, description: "FK -> Operator.id; certified operator" }
      - { name: workmanship_class, type: enum, source: input, description: "IPC_CLASS_1 | IPC_CLASS_2 | IPC_CLASS_3" }
      - { name: issued_at, type: datetime, source: input, description: "Certification window start (inclusive)" }
      - { name: expires_at, type: datetime, source: input, description: "Certification window end; status ACTIVE requires now < expires_at" }
      - { name: revoked_at, type: datetime, source: system, description: "Logical-clock timestamp of revocation; null while not revoked" }
      - { name: status, type: enum, source: computed, description: "ACTIVE | EXPIRED | REVOKED; REVOKED if revoked_at set, else EXPIRED if now >= expires_at, else ACTIVE" }

  - name: Applicator
    parent: null
    common_fields: true
    fields:
      - { name: applicator_code, type: string, source: input, description: "Crimp applicator asset code; unique" }
      - { name: compatible_terminal_mpn, type: string, source: input, description: "Terminal MPN this applicator is tooled for" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | IN_SETUP | QUALIFIED | QUARANTINED", default: AVAILABLE }
      - { name: current_program_id, type: string, source: system, description: "FK -> MachineProgram.id; program loaded by the most recent setup; null until first setup" }
      - { name: qualified_at, type: datetime, source: system, description: "Logical-clock timestamp of most recent first-article qualification; null until first qualification" }

  - name: ApplicatorSetup
    parent: null
    common_fields: true
    fields:
      - { name: applicator_id, type: string, source: input, description: "FK -> Applicator.id; applicator under setup" }
      - { name: program_id, type: string, source: input, description: "FK -> MachineProgram.id; program being set up" }
      - { name: setup_operator_id, type: string, source: input, description: "FK -> Operator.id; operator performing the setup" }
      - { name: planned_start_at, type: datetime, source: input, description: "Planned window start (half-open interval start)" }
      - { name: planned_end_at, type: datetime, source: input, description: "Planned window end (half-open interval end); must be > planned_start_at" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED", default: OPEN }
      - { name: closed_at, type: datetime, source: system, description: "Timestamp supplied at close; null while OPEN" }

  - name: MachineProgram
    parent: null
    common_fields: true
    fields:
      - { name: program_code, type: string, source: input, description: "Cut/strip/crimp program code; unique" }
      - { name: drawing_id, type: string, source: input, description: "FK -> HarnessDrawing.id; drawing this program wires for" }
      - { name: applicator_id, type: string, source: input, description: "FK -> Applicator.id; applicator this program runs on" }
      - { name: wire_gauge_awg, type: integer, source: input, description: "Wire gauge; integer 12..26" }
      - { name: wire_type, type: string, source: input, description: "Wire insulation type code" }
      - { name: cut_length_mm, type: number, source: input, description: "Cut length in millimetres; > 0" }
      - { name: strip_length_mm, type: number, source: input, description: "Strip length in millimetres; > 0" }
      - { name: terminal_mpn, type: string, source: input, description: "Terminal MPN crimped by this program" }
      - { name: terminal_type, type: enum, source: input, description: "OPEN_BARREL | CLOSED_BARREL" }
      - { name: min_pull_force_n, type: number, source: computed, description: "Minimum crimp pull force in newtons; per crimp_pull_force_minimum; recomputed on create and patch" }
      - { name: status, type: enum, source: system, description: "DRAFT | QUALIFIED | HELD", default: DRAFT }

  - name: BuildOrder
    parent: null
    common_fields: true
    fields:
      - { name: order_code, type: string, source: input, description: "Work order code; unique" }
      - { name: drawing_id, type: string, source: input, description: "FK -> HarnessDrawing.id; drawing (revision) this order builds" }
      - { name: drawing_revision_pinned, type: string, source: system, description: "Drawing.revision copied at creation; never changes" }
      - { name: workmanship_class, type: enum, source: system, description: "Copied from drawing at creation" }
      - { name: qty_ordered, type: integer, source: input, description: "Harnesses ordered; >= 1; editable while OPEN via OCC patch" }
      - { name: material_budget_cents, type: integer, source: input, description: "Optional material spend cap; null = uncapped" }
      - { name: material_spent_cents, type: integer, source: computed, description: "Sum of non-voided kit issue costs (qty_issued * unit_cost_snapshot_cents)" }
      - { name: qty_built, type: integer, source: computed, description: "Count of HarnessUnit with status IN {BUILT, TEST_PASS, REWORK, SUSPECT, SHIPPED}" }
      - { name: qty_scrapped, type: integer, source: computed, description: "Count of HarnessUnit with status SCRAPPED" }
      - { name: standard_cost_cents, type: integer, source: computed, description: "STANDARD variant of build_order_cost_roll_up: qty_built * sum(qty_per_harness * unit_cost_cents over pinned BOM)" }
      - { name: actual_cost_cents, type: integer, source: computed, description: "ACTUAL variant of build_order_cost_roll_up: sum over non-voided kit issues of qty_issued * unit_cost_snapshot_cents" }
      - { name: scrap_recovery_credit_cents, type: integer, source: computed, description: "Accumulated scrap recovery credit per scrap_recovery_credit; starts 0" }
      - { name: status, type: enum, source: system, description: "OPEN | KITTING | IN_BUILD | TESTING | COMPLETED | CANCELLED | QC_HOLD", default: OPEN }
      - { name: qc_hold_return_status, type: enum, source: system, description: "KITTING | IN_BUILD | TESTING; status to restore when the holding program requalifies; null unless QC_HOLD" }
      - { name: held_by_program_id, type: string, source: system, description: "FK -> MachineProgram.id; program whose hold placed this order in QC_HOLD; null unless QC_HOLD" }
      - { name: use_as_is_flag, type: boolean, source: system, description: "True when an ECN with USE_AS_IS disposition was applied to this order", default: false }
      - { name: next_unit_seq, type: integer, source: system, description: "Next harness serial sequence number; starts at 1; never reused even after scrap" }

  - name: Kit
    parent: null
    common_fields: true
    fields:
      - { name: build_order_id, type: string, source: system, description: "FK -> BuildOrder.id; order this kit kits for" }
      - { name: kit_seq, type: integer, source: system, description: "Sequence number of this kit within the build order; starts at 1" }
      - { name: status, type: enum, source: system, description: "PICKING | STAGED | DELIVERED_LINESIDE | RETURNED", default: PICKING }
      - { name: issues, type: array, source: system, description: "Issue line objects: { component_id, qty_issued, source (FACTORY_STOCK|CONSIGNED_LOT), consigned_lot_id (nullable), unit_cost_snapshot_cents, issued_at, voided (boolean) }" }
      - { name: shortage_count, type: integer, source: computed, description: "Sum over BOM lines of max(0, needed - issued non-voided); needed = qty_per_harness * qty_ordered" }
      - { name: delivered_at, type: datetime, source: system, description: "Logical-clock timestamp of line-side delivery; null until delivered" }

  - name: HarnessUnit
    parent: null
    common_fields: true
    fields:
      - { name: build_order_id, type: string, source: system, description: "FK -> BuildOrder.id; order this serialized harness belongs to" }
      - { name: serial_number, type: string, source: system, description: "Server-minted serial: '<order_code>-<seq:04d>' using next_unit_seq; never reused" }
      - { name: drawing_revision_built, type: string, source: system, description: "Copied from BuildOrder.drawing_revision_pinned at creation" }
      - { name: built_by_operator_id, type: string, source: system, description: "FK -> Operator.id; equals X-User-ID of the creating LineOperator" }
      - { name: status, type: enum, source: system, description: "BUILT | TEST_PASS | REWORK | SUSPECT | SHIPPED | SCRAPPED", default: BUILT }
      - { name: rework_count, type: integer, source: system, description: "Number of completed rework cycles; starts 0; cap 2" }
      - { name: continuity_pass, type: boolean, source: system, description: "True when latest CONTINUITY record (since last flag reset) is PASS", default: false }
      - { name: hipot_pass, type: boolean, source: system, description: "True when latest HIPOT record (since last flag reset) is PASS", default: false }
      - { name: suspect_marked_at, type: datetime, source: system, description: "Logical-clock timestamp when unit entered SUSPECT; null otherwise" }
      - { name: scrap_reason, type: enum, source: system, description: "DAMAGE | QC_SUSPECT | ECN_DISPOSITION; null unless SCRAPPED" }

  - name: CrimpPullTest
    parent: null
    common_fields: false
    fields:
      - { name: applicator_id, type: string, source: input, description: "FK -> Applicator.id; applicator sampled" }
      - { name: program_id, type: string, source: input, description: "FK -> MachineProgram.id; program sampled" }
      - { name: operator_id, type: string, source: system, description: "FK -> Operator.id; equals X-User-ID of the acting QualityInspector" }
      - { name: sample_kind, type: enum, source: input, description: "FIRST_ARTICLE | LOT_SAMPLE" }
      - { name: measured_force_n, type: number, source: input, description: "Measured pull force in newtons (1 decimal)" }
      - { name: min_pull_force_n_snapshot, type: number, source: computed, description: "MachineProgram.min_pull_force_n copied at record time" }
      - { name: result, type: enum, source: computed, description: "PASS if measured_force_n >= min_pull_force_n_snapshot else FAIL" }
      - { name: tested_at, type: datetime, source: system, description: "Logical-clock timestamp at record creation" }

  - name: ElectricalTestRecord
    parent: null
    common_fields: false
    fields:
      - { name: harness_unit_id, type: string, source: input, description: "FK -> HarnessUnit.id; serialized harness under test" }
      - { name: test_operator_id, type: string, source: system, description: "FK -> Operator.id; equals X-User-ID of the acting QualityInspector" }
      - { name: test_type, type: enum, source: input, description: "CONTINUITY | HIPOT" }
      - { name: opens_count, type: integer, source: input, description: "Number of open nets measured; >= 0; required when test_type == CONTINUITY" }
      - { name: hipot_voltage_v, type: number, source: input, description: "Applied hipot voltage; required when test_type == HIPOT" }
      - { name: dwell_seconds, type: number, source: input, description: "Hipot dwell time; required when test_type == HIPOT" }
      - { name: measured_leakage_ua, type: number, source: input, description: "Measured leakage current in microamps; required when test_type == HIPOT" }
      - { name: leakage_limit_ua, type: number, source: input, description: "Leakage limit in microamps; required when test_type == HIPOT" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL per electrical_test_result" }
      - { name: tested_at, type: datetime, source: system, description: "Logical-clock timestamp at record creation" }

  - name: EngineeringChangeNotice
    parent: null
    common_fields: true
    fields:
      - { name: ecn_code, type: string, source: input, description: "ECN code; unique" }
      - { name: drawing_id, type: string, source: input, description: "FK -> HarnessDrawing.id; released drawing revision being changed" }
      - { name: from_revision, type: string, source: system, description: "Drawing.revision copied at ECN creation" }
      - { name: to_revision, type: string, source: input, description: "New revision letter; must differ from from_revision" }
      - { name: wip_disposition, type: enum, source: input, description: "REWORK | USE_AS_IS | SCRAP; disposition for work-in-process at the old revision" }
      - { name: status, type: enum, source: system, description: "OPEN | APPLIED | CANCELLED", default: OPEN }
      - { name: applied_at, type: datetime, source: system, description: "Logical-clock timestamp of apply; null until applied" }
      - { name: new_drawing_id, type: string, source: system, description: "FK -> HarnessDrawing.id; new DRAFT revision row created at apply; null until applied" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: HarnessDrawing
    field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: RELEASED
        trigger: "POST /plant/drawings/{id}/release"
        actor: HarnessEngineer
        preconditions:
          - "Drawing has at least one DrawingComponent (else ERR_DRAWING_EMPTY_BOM)"
        side_effects:
          - "status = RELEASED; released_at = logical clock now; increments HarnessDrawing.version by 1"
      - from: RELEASED
        to: SUPERSEDED
        trigger: "system (EngineeringChangeNotice apply on this drawing)"
        actor: system
        preconditions: []
        side_effects:
          - "status = SUPERSEDED; superseded_at = now; increments version"
          - "Triggers BuildOrder disposition cascade for orders whose drawing_id == this drawing (see EngineeringChangeNotice APPLIED)"

  - entity: MachineProgram
    field: status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: QUALIFIED
        trigger: "system (FIRST_ARTICLE CrimpPullTest with result PASS on (applicator, this program))"
        actor: system
        preconditions:
          - "Applicator status == AVAILABLE with current_program_id == this program"
          - "At least one CLOSED ApplicatorSetup exists for (applicator_id, this program)"
        side_effects:
          - "status = QUALIFIED; increments version"
      - from: QUALIFIED
        to: HELD
        trigger: "system (applicator quarantined by LOT_SAMPLE pull-test FAIL)"
        actor: system
        preconditions:
          - "MachineProgram.applicator_id == quarantined applicator"
        side_effects:
          - "status = HELD; increments version"
          - "Triggers BuildOrder QC_HOLD cascade for orders whose drawing_id == this program's drawing_id"
      - from: HELD
        to: QUALIFIED
        trigger: "system (FIRST_ARTICLE PASS requalification on (applicator, this program))"
        actor: system
        preconditions:
          - "Applicator status == AVAILABLE with current_program_id == this program"
          - "At least one CLOSED ApplicatorSetup for (applicator, this program) created after the quarantine"
        side_effects:
          - "status = QUALIFIED; increments version"
          - "BuildOrders in QC_HOLD with held_by_program_id == this program restore to qc_hold_return_status (qc_hold_return_status cleared), processed in created_at ASC order"

  - entity: Applicator
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: "AVAILABLE | QUALIFIED | QUARANTINED"
        to: IN_SETUP
        trigger: "POST /plant/applicator-setups"
        actor: ProcessEngineer
        preconditions:
          - "No other OPEN ApplicatorSetup on this applicator (else ERR_APPLICATOR_SETUP_ALREADY_OPEN)"
          - "Planned window does not overlap any existing setup window on this applicator (half-open intervals; else ERR_APPLICATOR_SETUP_OVERLAP)"
        side_effects:
          - "status = IN_SETUP; current_program_id = setup.program_id; increments version"
      - from: IN_SETUP
        to: AVAILABLE
        trigger: "POST /plant/applicator-setups/{id}/close"
        actor: ProcessEngineer
        preconditions:
          - "Setup status == OPEN"
        side_effects:
          - "Setup status = CLOSED, closed_at set; applicator status = AVAILABLE; increments Applicator.version"
      - from: AVAILABLE
        to: QUALIFIED
        trigger: "system (FIRST_ARTICLE CrimpPullTest PASS on (this applicator, current_program_id))"
        actor: system
        preconditions:
          - "current_program_id == pull test program_id"
          - "At least one CLOSED ApplicatorSetup exists for (this applicator, program)"
        side_effects:
          - "status = QUALIFIED; qualified_at = now; increments version"
          - "MachineProgram DRAFT->QUALIFIED or HELD->QUALIFIED (requalification cascade)"
      - from: QUALIFIED
        to: QUARANTINED
        trigger: "system (LOT_SAMPLE CrimpPullTest FAIL on (this applicator, current program))"
        actor: system
        preconditions: []
        side_effects:
          - "status = QUARANTINED; increments version"
          - "MachinePrograms QUALIFIED with applicator_id == this applicator -> HELD (depth-2 link)"
          - "Which triggers BuildOrder QC_HOLD (depth-3) and HarnessUnit SUSPECT sweep (depth-4) per suspect_unit_selection"

  - entity: ApplicatorSetup
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /plant/applicator-setups/{id}/close"
        actor: ProcessEngineer
        preconditions:
          - "closed_at >= planned_start_at"
        side_effects:
          - "Applicator IN_SETUP -> AVAILABLE"

  - entity: OperatorCertification
    field: status
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /plant/operator-certifications/{id}/revoke"
        actor: QualityManager
        preconditions:
          - "revoked_at is null"
        side_effects:
          - "revoked_at = now; status computed REVOKED; increments version"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (logical clock reaching expires_at)"
        actor: system
        preconditions:
          - "now >= expires_at"
        side_effects:
          - "status computed EXPIRED (no mutation; derived per operator_certification_status)"

  - entity: ConsignedLot
    field: status
    initial_state: ACTIVE
    terminal_states: [DEPLETED, RETURNED]
    transitions:
      - from: ACTIVE
        to: DEPLETED
        trigger: "system (reconciliation after kit deliver or scrap transfer)"
        actor: system
        preconditions:
          - "qty_on_hand == 0 AND qty_issued_open == 0"
        side_effects:
          - "status = DEPLETED; increments version"
      - from: ACTIVE
        to: RETURNED
        trigger: "POST /plant/consigned-lots/{id}/return"
        actor: MaterialsClerk
        preconditions: []
        side_effects:
          - "qty_returned += qty_on_hand; qty_on_hand = 0; status = RETURNED; increments version"

  - entity: BuildOrder
    field: status
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: KITTING
        trigger: "POST /plant/build-orders/{id}/release-to-kitting"
        actor: ProductionPlanner
        preconditions:
          - "At least one MachineProgram with drawing_id == order.drawing_id has status QUALIFIED (else ERR_NO_QUALIFIED_PROGRAM)"
          - "No Kit of this order in status PICKING or STAGED"
        side_effects:
          - "status = KITTING; increments version"
          - "Creates Kit (kit_seq = count of existing kits + 1, status PICKING, empty issues, shortage_count = sum of needed over pinned BOM)"
      - from: KITTING
        to: IN_BUILD
        trigger: "system (first Kit of this order reaches DELIVERED_LINESIDE)"
        actor: system
        preconditions: []
        side_effects:
          - "status = IN_BUILD; increments version"
      - from: IN_BUILD
        to: TESTING
        trigger: "system (qty_built + qty_scrapped == qty_ordered after harness create or scrap)"
        actor: system
        preconditions: []
        side_effects:
          - "status = TESTING; increments version"
      - from: TESTING
        to: COMPLETED
        trigger: "system (every HarnessUnit has status IN {TEST_PASS, SHIPPED, SCRAPPED} AND qty_built >= 1)"
        actor: system
        preconditions: []
        side_effects:
          - "status = COMPLETED; increments version"
      - from: TESTING
        to: CANCELLED
        trigger: "system (qty_built == 0, i.e. every built unit was scrapped)"
        actor: system
        preconditions: []
        side_effects:
          - "status = CANCELLED; increments version"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /plant/build-orders/{id}/cancel"
        actor: ProductionPlanner
        preconditions:
          - "status == OPEN (else ERR_BUILD_ORDER_NOT_OPEN)"
        side_effects:
          - "status = CANCELLED; increments version"
      - from: "KITTING | IN_BUILD | TESTING"
        to: QC_HOLD
        trigger: "system (MachineProgram of this order's drawing -> HELD)"
        actor: system
        preconditions:
          - "BuildOrder.drawing_id == held program's drawing_id"
        side_effects:
          - "qc_hold_return_status = prior status; held_by_program_id = program; status = QC_HOLD; increments version"
          - "Triggers HarnessUnit SUSPECT sweep (depth-4 link) per suspect_unit_selection"
      - from: QC_HOLD
        to: "KITTING | IN_BUILD | TESTING"
        trigger: "system (held_by_program_id program requalifies HELD -> QUALIFIED)"
        actor: system
        preconditions: []
        side_effects:
          - "status = qc_hold_return_status; qc_hold_return_status = null; held_by_program_id = null; increments version"
          - "SUSPECT units are NOT auto-restored; they clear only via passing retest or scrap"
      - from: "OPEN | KITTING | IN_BUILD | TESTING | QC_HOLD"
        to: CANCELLED
        trigger: "system (ECN applied with wip_disposition SCRAP on the pinned drawing revision)"
        actor: system
        preconditions: []
        side_effects:
          - "All HarnessUnits with status IN {BUILT, REWORK, TEST_PASS, SUSPECT} -> SCRAPPED (scrap_reason ECN_DISPOSITION; scrap_recovery_credit per unit)"
          - "Consigned content of scrapped units transfers lot qty_consumed -> qty_scrapped (FIFO by issue issued_at ASC, tie-break kit_seq ASC)"
          - "Kits in PICKING or STAGED -> RETURNED with all non-voided issues voided (consigned qty_issued_open -> qty_on_hand)"
          - "status = CANCELLED; increments version"

  - entity: Kit
    field: status
    initial_state: PICKING
    terminal_states: [DELIVERED_LINESIDE, RETURNED]
    transitions:
      - from: PICKING
        to: STAGED
        trigger: "system (POST /plant/kits/{id}/issues makes shortage_count == 0 with >= 1 non-voided issue)"
        actor: system
        preconditions: []
        side_effects:
          - "status = STAGED; increments version"
      - from: STAGED
        to: DELIVERED_LINESIDE
        trigger: "POST /plant/kits/{id}/deliver"
        actor: MaterialsClerk
        preconditions:
          - "status == STAGED (else ERR_KIT_NOT_STAGED)"
        side_effects:
          - "For each non-voided issue with source CONSIGNED_LOT: lot.qty_issued_open -= qty_issued; lot.qty_consumed += qty_issued"
          - "ConsignedLot reconciliation runs (may auto-transition ACTIVE -> DEPLETED)"
          - "delivered_at = now; increments version"
          - "BuildOrder KITTING -> IN_BUILD on first delivery"
      - from: "PICKING | STAGED"
        to: RETURNED
        trigger: "POST /plant/kits/{id}/return"
        actor: MaterialsClerk
        preconditions: []
        side_effects:
          - "All non-voided issues become voided; for consigned issues: lot.qty_issued_open -= qty_issued; lot.qty_on_hand += qty_issued"
          - "BuildOrder.material_spent_cents and actual_cost_cents recomputed (voided issues excluded)"
          - "status = RETURNED; increments version"

  - entity: HarnessUnit
    field: status
    initial_state: BUILT
    terminal_states: [SHIPPED, SCRAPPED]
    transitions:
      - from: BUILT
        to: TEST_PASS
        trigger: "system (continuity_pass AND hipot_pass both true after an ElectricalTestRecord)"
        actor: system
        preconditions: []
        side_effects:
          - "status = TEST_PASS; increments version"
          - "BuildOrder TESTING -> COMPLETED bubble-up check runs"
      - from: SUSPECT
        to: TEST_PASS
        trigger: "system (CONTINUITY PASS and HIPOT PASS both recorded with tested_at >= suspect_marked_at)"
        actor: system
        preconditions: []
        side_effects:
          - "status = TEST_PASS; suspect_marked_at = null; increments version"
      - from: "BUILT | REWORK | SUSPECT"
        to: REWORK
        trigger: "system (any ElectricalTestRecord with result FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "status = REWORK; flag of the failed test type = false; suspect_marked_at cleared if set; increments version"
      - from: REWORK
        to: BUILT
        trigger: "POST /plant/harness-units/{id}/complete-rework"
        actor: LineOperator
        preconditions:
          - "status == REWORK"
          - "rework_count < 2 (else ERR_REWORK_LIMIT_EXCEEDED)"
        side_effects:
          - "status = BUILT; rework_count += 1; continuity_pass = false; hipot_pass = false; increments version"
      - from: "BUILT | REWORK | TEST_PASS"
        to: SUSPECT
        trigger: "system (applicator quarantine sweep per suspect_unit_selection)"
        actor: system
        preconditions:
          - "unit created_at >= applicator.qualified_at of the quarantined applicator"
          - "unit's build order entered QC_HOLD via this quarantine"
        side_effects:
          - "status = SUSPECT; suspect_marked_at = now; continuity_pass = false; hipot_pass = false; increments version"
      - from: TEST_PASS
        to: SHIPPED
        trigger: "POST /plant/harness-units/{id}/ship"
        actor: ShippingClerk
        preconditions:
          - "status == TEST_PASS (else ERR_UNIT_NOT_SHIPPABLE)"
        side_effects:
          - "status = SHIPPED; increments version"
      - from: "BUILT | REWORK | SUSPECT"
        to: SCRAPPED
        trigger: "POST /plant/harness-units/{id}/scrap"
        actor: QualityInspector
        preconditions: []
        side_effects:
          - "status = SCRAPPED; scrap_reason = input reason (DAMAGE | QC_SUSPECT); increments version"
          - "scrap_recovery_credit computed for this unit and accumulated to BuildOrder.scrap_recovery_credit_cents"
          - "Consigned content transfers lot qty_consumed -> qty_scrapped (FIFO by issue issued_at ASC, tie-break kit_seq ASC); lot book/replacement liability recomputed"
          - "BuildOrder qty_built / qty_scrapped / standard_cost_cents recomputed; IN_BUILD->TESTING or TESTING->CANCELLED checks run"
      - from: "BUILT | REWORK | TEST_PASS | SUSPECT"
        to: SCRAPPED
        trigger: "system (ECN applied with wip_disposition SCRAP)"
        actor: system
        preconditions: []
        side_effects:
          - "status = SCRAPPED; scrap_reason = ECN_DISPOSITION; same credit / consigned-transfer / recompute side effects as manual scrap"
      - from: "BUILT | TEST_PASS"
        to: REWORK
        trigger: "system (ECN applied with wip_disposition REWORK)"
        actor: system
        preconditions: []
        side_effects:
          - "status = REWORK; continuity_pass = false; hipot_pass = false; increments version"

  - entity: EngineeringChangeNotice
    field: status
    initial_state: OPEN
    terminal_states: [APPLIED, CANCELLED]
    transitions:
      - from: OPEN
        to: APPLIED
        trigger: "POST /plant/ecns/{id}/apply"
        actor: HarnessEngineer
        preconditions:
          - "status == OPEN (else ERR_ECN_NOT_OPEN)"
        side_effects:
          - "Drawing (drawing_id) RELEASED -> SUPERSEDED (depth-1 link)"
          - "Creates new HarnessDrawing: revision = to_revision, workmanship_class/customer_code/drawing_number copied, status DRAFT, with all DrawingComponent rows copied to the new drawing_id; new_drawing_id set"
          - "BuildOrders with drawing_id == old drawing and status IN {OPEN, KITTING, IN_BUILD, TESTING, QC_HOLD} are dispositioned in created_at ASC order (depth-2 link): USE_AS_IS -> use_as_is_flag = true; REWORK -> units IN {BUILT, TEST_PASS} -> REWORK; SCRAP -> order -> CANCELLED with unit scrap cascade (depth-3) and consigned transfer (depth-4)"
          - "applied_at = now; status = APPLIED; increments version"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /plant/ecns/{id}/cancel"
        actor: HarnessEngineer
        preconditions:
          - "status == OPEN (else ERR_ECN_NOT_OPEN)"
        side_effects:
          - "status = CANCELLED; increments version"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: build-order-patch-stale-version
    parent_entity: BuildOrder
    write_endpoint: "PATCH /plant/build-orders/{id}"
    occ_field: "expected_build_order_version"
    description: |
      Editing qty_ordered or material_budget_cents on an OPEN BuildOrder is
      legitimate at any time while OPEN; no state field changed by a prior
      edit forbids a later edit. A request whose expected_build_order_version
      no longer matches BuildOrder.version is rejected as stale.
    error_id: ERR_STALE_BUILD_ORDER_VERSION
    http_status: 412
  - rule_id: machine-program-patch-stale-version
    parent_entity: MachineProgram
    write_endpoint: "PATCH /plant/machine-programs/{id}"
    occ_field: "expected_machine_program_version"
    description: |
      Editing cut/strip parameters on a DRAFT MachineProgram is legitimate at
      any time while DRAFT; a prior edit changes no state field that would
      forbid a later edit. A request whose expected_machine_program_version
      no longer matches MachineProgram.version is rejected as stale.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: crimp_pull_force_minimum
    trigger: "MachineProgram create and every PATCH /plant/machine-programs/{id}"
    algorithm: threshold
    formula: |
      base_n = AWG_TIER_TABLE[wire_gauge_awg]         # tiered lookup, see constants
      min_pull_force_n = round_half_up(base_n * TERMINAL_DERATING[terminal_type] * CLASS_MULTIPLIER[workmanship_class of program's drawing], 1 decimal)
      Inputs interact non-linearly: tier table on AWG, conditional derating on
      terminal_type, class multiplier from the linked drawing's workmanship_class.
    input_set: "The MachineProgram being written plus its linked HarnessDrawing.workmanship_class"
    constants:
      AWG_TIER_26_25_24: 15.0
      AWG_TIER_23_22_21_20: 30.0
      AWG_TIER_19_18_17_16: 50.0
      AWG_TIER_15_14_13_12: 80.0
      TERMINAL_DERATING_OPEN_BARREL: 1.0
      TERMINAL_DERATING_CLOSED_BARREL: 0.9
      CLASS_MULTIPLIER_IPC_CLASS_1: 1.0
      CLASS_MULTIPLIER_IPC_CLASS_2: 1.0
      CLASS_MULTIPLIER_IPC_CLASS_3: 1.1
    precision: "1 decimal place, round_half_up"

  - name: scrap_recovery_credit
    trigger: "HarnessUnit -> SCRAPPED (manual scrap or ECN SCRAP disposition)"
    algorithm: aggregation
    formula: |
      For the scrapped unit, per BOM line of the pinned drawing revision:
        line_credit_cents = round_half_up(qty_per_harness * unit_cost_cents * RECOVERY_RATE)
      unit_credit_cents = sum(line_credit_cents over all BOM lines)
      PINNED ROUNDING ORDER: round each line to integer cents FIRST, then sum.
      (Sum-then-round is the rejected alternative and yields different cents.)
      BuildOrder.scrap_recovery_credit_cents += unit_credit_cents
    input_set: "DrawingComponent rows of the unit's pinned drawing revision (all supply types)"
    constants:
      RECOVERY_RATE: 0.8
    precision: "integer cents; per-line round_half_up before summation"

  - name: build_order_cost_roll_up
    trigger: "Recomputed on every mutation affecting inputs (harness create/scrap, kit issue/void, ECN disposition)"
    algorithm: aggregation
    formula: |
      STANDARD variant:
        standard_cost_cents = qty_built * sum(qty_per_harness * unit_cost_cents over pinned BOM lines)
      ACTUAL variant:
        actual_cost_cents = sum(qty_issued * unit_cost_snapshot_cents over non-voided issues of all kits of the order)
      For consigned issues the snapshot is ConsignedLot.unit_liability_cents; for
      factory issues it is DrawingComponent.unit_cost_cents at issue time. The two
      variants diverge whenever consigned liability differs from standard cost or
      issues over/under-ship versus the BOM.
    input_set: "STANDARD: pinned BOM lines x units IN {BUILT, TEST_PASS, REWORK, SUSPECT, SHIPPED}. ACTUAL: non-voided kit issues only (voided-by-return excluded)"
    precision: "integer cents"
    variants:
      - name: STANDARD
        when: "Quoting / variance reporting baseline"
        difference: "Uses BOM standard costs and surviving unit count; ignores what was actually issued"
      - name: ACTUAL
        when: "Material spend reconciliation"
        difference: "Uses issued quantities and issue-time cost snapshots; equals material_spent_cents"

  - name: consigned_scrap_liability
    trigger: "Recomputed whenever ConsignedLot.qty_scrapped changes"
    algorithm: aggregation
    formula: |
      BOOK_VALUE variant:      book_liability_cents = qty_scrapped * unit_liability_cents
      REPLACEMENT_VALUE variant: replacement_liability_cents = qty_scrapped * replacement_cost_cents
    input_set: "The ConsignedLot row"
    precision: "integer cents"
    variants:
      - name: BOOK_VALUE
        when: "Customer settlement at receipt-book value"
        difference: "Uses unit_liability_cents declared at lot receipt"
      - name: REPLACEMENT_VALUE
        when: "Customer settlement at current replacement cost"
        difference: "Uses replacement_cost_cents; diverges from BOOK_VALUE whenever replacement != book"

  - name: consigned_lot_quantity_reconciliation
    trigger: "On kit issue, kit deliver, kit return, lot return, and consigned scrap transfer"
    algorithm: aggregation
    formula: |
      qty_on_hand + qty_issued_open + qty_consumed + qty_scrapped + qty_returned == qty_received
      Issue:        qty_on_hand -= q; qty_issued_open += q
      Deliver:      qty_issued_open -= q; qty_consumed += q        (consigned issues only)
      Kit return:   qty_issued_open -= q; qty_on_hand += q         (voids the issue)
      Unit scrap:   qty_consumed -= q; qty_scrapped += q           (consigned content of unit)
      Lot return:   qty_returned += qty_on_hand; qty_on_hand = 0
      CONSERVED INVARIANT: the five-bucket sum is constant == qty_received across every
      forward/compensating action pair (issue/return, consume/scrap, receipt/return-to-customer).
    input_set: "The ConsignedLot row and non-voided kit issues referencing it"
    precision: "integer pieces"

  - name: build_order_quantity_reconciliation
    trigger: "On harness create, scrap, ECN disposition"
    algorithm: aggregation
    formula: |
      qty_built    = count(HarnessUnit of order with status IN {BUILT, TEST_PASS, REWORK, SUSPECT, SHIPPED})
      qty_scrapped = count(HarnessUnit of order with status == SCRAPPED)
      CONSERVED INVARIANT: qty_built + qty_scrapped is conserved across a build followed
      by its compensating scrap (the unit moves buckets; the sum does not change), and
      is invariant under ship. Equality qty_built + qty_scrapped == qty_ordered drives
      IN_BUILD -> TESTING.
    input_set: "HarnessUnit rows of the order"
    precision: "integer units"

  - name: electrical_test_result
    trigger: "ElectricalTestRecord create"
    algorithm: threshold
    formula: |
      CONTINUITY: result = PASS if opens_count == 0 else FAIL
      HIPOT:      result = PASS if measured_leakage_ua <= leakage_limit_ua else FAIL   # inclusive boundary
      Gate (not result): HIPOT with hipot_voltage_v < HIPOT_CLASS_MIN_VOLTAGE[workmanship_class]
      is rejected with ERR_HIPOT_VOLTAGE_BELOW_CLASS_MIN before any result is recorded.
    input_set: "The ElectricalTestRecord payload plus BuildOrder.workmanship_class"
    constants:
      HIPOT_CLASS_MIN_IPC_CLASS_1: 500
      HIPOT_CLASS_MIN_IPC_CLASS_2: 1000
      HIPOT_CLASS_MIN_IPC_CLASS_3: 1500
    precision: "1 decimal place for microamp comparison"

  - name: operator_certification_status
    trigger: "Computed on every read and on every gated operation (pull test, electrical test)"
    algorithm: threshold
    formula: |
      status = REVOKED if revoked_at is not null
             else EXPIRED if now >= expires_at      # strict: ACTIVE requires now < expires_at
             else ACTIVE
    input_set: "The OperatorCertification row plus the logical clock"
    precision: "second-precision timestamp comparison"

  - name: kit_completeness
    trigger: "On every POST /plant/kits/{id}/issues and on kit return"
    algorithm: aggregation
    formula: |
      For each BOM line of the pinned drawing revision:
        needed[line]  = qty_per_harness * qty_ordered
        issued[line]  = sum(qty_issued of non-voided issues of this kit with component_id == line)
      shortage_count = sum(max(0, needed[line] - issued[line]))
      When shortage_count == 0 AND at least one non-voided issue exists: Kit PICKING -> STAGED.
    input_set: "Pinned BOM lines and the kit's non-voided issues"
    precision: "integer pieces"

  - name: suspect_unit_selection
    trigger: "Applicator QUALIFIED -> QUARANTINED"
    algorithm: aggregation
    formula: |
      Eligibility: HarnessUnit u such that
        u.build_order.drawing_id == (a program P that transitioned QUALIFIED->HELD).drawing_id
        AND u.status IN {BUILT, REWORK, TEST_PASS}
        AND u.created_at >= applicator.qualified_at
      Processing order: build orders by created_at ASC, then units by created_at ASC.
      Each selected unit -> SUSPECT (suspect_marked_at = now, test flags reset).
      Units on orders of other drawings, SHIPPED units, and SCRAPPED units are never selected.
    input_set: "HarnessUnit rows joined to BuildOrder via HarnessUnit.build_order_id == BuildOrder.id"
    precision: "deterministic sweep; created_at ASC ordering; no id-based ordering"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "Request body parses as JSON; declared input fields present with correct types; enum values in declared sets; conditional requirement: opens_count required when test_type == CONTINUITY; hipot_voltage_v, dwell_seconds, measured_leakage_ua, leakage_limit_ua required when test_type == HIPOT; qty_per_harness >= 1; qty_ordered >= 1; qty_received >= 1; planned_end_at > planned_start_at; expires_at > issued_at; wire_gauge_awg in 12..26. Undeclared/read-only payload fields are ignored (not an error)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path ids and body FK ids reference existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "OCC: expected_build_order_version == BuildOrder.version (PATCH build-orders); expected_machine_program_version == MachineProgram.version (PATCH machine-programs)"
    error_id: ERR_STALE_BUILD_ORDER_VERSION
    http_status: 412
    applies_to: "PATCH /plant/build-orders/{id}"
  - priority: 5
    category: state
    check: "OCC: expected_machine_program_version == MachineProgram.version"
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    applies_to: "PATCH /plant/machine-programs/{id}"
  - priority: 6
    category: state
    check: "Drawing status == DRAFT for component creation and release"
    error_id: ERR_DRAWING_NOT_DRAFT
    http_status: 409
    applies_to: "POST /plant/components, POST /plant/drawings/{id}/release"
  - priority: 6
    category: state
    check: "Release requires at least one DrawingComponent"
    error_id: ERR_DRAWING_EMPTY_BOM
    http_status: 409
    applies_to: "POST /plant/drawings/{id}/release"
  - priority: 6
    category: state
    check: "Drawing status == RELEASED for program creation, build-order creation, ECN creation"
    error_id: ERR_DRAWING_NOT_RELEASED
    http_status: 409
    applies_to: "POST /plant/machine-programs, POST /plant/build-orders, POST /plant/ecns"
  - priority: 6
    category: state
    check: "MachineProgram status == DRAFT for patch"
    error_id: ERR_PROGRAM_NOT_DRAFT
    http_status: 409
    applies_to: "PATCH /plant/machine-programs/{id}"
  - priority: 6
    category: state
    check: "No other OPEN ApplicatorSetup on the same applicator"
    error_id: ERR_APPLICATOR_SETUP_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /plant/applicator-setups"
  - priority: 6
    category: state
    check: "FIRST_ARTICLE requires applicator AVAILABLE, current_program_id == program_id, at least one CLOSED setup for (applicator, program), and program status IN {DRAFT, HELD}"
    error_id: ERR_FIRST_ARTICLE_PREREQUISITE
    http_status: 409
    applies_to: "POST /plant/crimp-pull-tests"
  - priority: 6
    category: state
    check: "LOT_SAMPLE requires applicator status == QUALIFIED"
    error_id: ERR_APPLICATOR_NOT_QUALIFIED
    http_status: 409
    applies_to: "POST /plant/crimp-pull-tests"
  - priority: 6
    category: state
    check: "release-to-kitting requires at least one QUALIFIED MachineProgram for the order's drawing"
    error_id: ERR_NO_QUALIFIED_PROGRAM
    http_status: 409
    applies_to: "POST /plant/build-orders/{id}/release-to-kitting"
  - priority: 6
    category: state
    check: "BuildOrder status == OPEN for patch and cancel"
    error_id: ERR_BUILD_ORDER_NOT_OPEN
    http_status: 409
    applies_to: "PATCH /plant/build-orders/{id}, POST /plant/build-orders/{id}/cancel"
  - priority: 6
    category: state
    check: "BuildOrder status == IN_BUILD for harness-unit creation"
    error_id: ERR_BUILD_ORDER_NOT_IN_BUILD
    http_status: 409
    applies_to: "POST /plant/build-orders/{id}/harness-units"
  - priority: 6
    category: state
    check: "HarnessUnit status IN {BUILT, REWORK, SUSPECT} for electrical test recording"
    error_id: ERR_HARNESS_NOT_TESTABLE
    http_status: 409
    applies_to: "POST /plant/electrical-test-records"
  - priority: 6
    category: state
    check: "HarnessUnit status == TEST_PASS for ship"
    error_id: ERR_UNIT_NOT_SHIPPABLE
    http_status: 409
    applies_to: "POST /plant/harness-units/{id}/ship"
  - priority: 6
    category: state
    check: "Kit status == PICKING for issue recording"
    error_id: ERR_KIT_NOT_PICKING
    http_status: 409
    applies_to: "POST /plant/kits/{id}/issues"
  - priority: 6
    category: state
    check: "Kit status == STAGED for deliver"
    error_id: ERR_KIT_NOT_STAGED
    http_status: 409
    applies_to: "POST /plant/kits/{id}/deliver"
  - priority: 6
    category: state
    check: "ECN status == OPEN for apply and cancel"
    error_id: ERR_ECN_NOT_OPEN
    http_status: 409
    applies_to: "POST /plant/ecns/{id}/apply, POST /plant/ecns/{id}/cancel"
  - priority: 7
    category: business_safety
    check: "Acting operator (X-User-ID) holds an OperatorCertification with workmanship_class == order's (or program's drawing's) class and computed status ACTIVE at the logical clock now. Checked on pull-test and electrical-test recording."
    error_id: ERR_OPERATOR_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /plant/crimp-pull-tests, POST /plant/electrical-test-records"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: test_operator_id (X-User-ID) must differ from HarnessUnit.built_by_operator_id. Sub-order within priority 7 on electrical tests: cert check, then SoD, then hipot voltage."
    error_id: ERR_SOD_BUILDER_CANNOT_TEST
    http_status: 409
    applies_to: "POST /plant/electrical-test-records"
  - priority: 7
    category: business_safety
    check: "HIPOT hipot_voltage_v >= HIPOT_CLASS_MIN for the order's workmanship_class (500/1000/1500 V)"
    error_id: ERR_HIPOT_VOLTAGE_BELOW_CLASS_MIN
    http_status: 422
    applies_to: "POST /plant/electrical-test-records"
  - priority: 7
    category: business_safety
    check: "Supply-type compliance: a CUSTOMER_CONSIGNED BOM line may only be issued with source CONSIGNED_LOT; a FACTORY_STOCK line may only be issued with source FACTORY_STOCK (no substitution of factory stock for consigned connectors)"
    error_id: ERR_CONSIGNED_SUBSTITUTION_FORBIDDEN
    http_status: 409
    applies_to: "POST /plant/kits/{id}/issues"
  - priority: 8
    category: business_referential
    check: "Issued component belongs to the order's pinned drawing revision"
    error_id: ERR_COMPONENT_NOT_ON_DRAWING
    http_status: 409
    applies_to: "POST /plant/kits/{id}/issues"
  - priority: 8
    category: business_referential
    check: "Referenced ConsignedLot status == ACTIVE"
    error_id: ERR_CONSIGNED_LOT_NOT_ISSUABLE
    http_status: 409
    applies_to: "POST /plant/kits/{id}/issues"
  - priority: 8
    category: business_referential
    check: "ConsignedLot.mpn == DrawingComponent.mpn for the issued line"
    error_id: ERR_CONSIGNED_MPN_MISMATCH
    http_status: 422
    applies_to: "POST /plant/kits/{id}/issues"
  - priority: 8
    category: business_referential
    check: "LOT_SAMPLE: program_id == applicator.current_program_id"
    error_id: ERR_APPLICATOR_PROGRAM_MISMATCH
    http_status: 422
    applies_to: "POST /plant/crimp-pull-tests"
  - priority: 9
    category: business_constraint
    check: "qty_issued <= ConsignedLot.qty_on_hand for consigned issues"
    error_id: ERR_CONSIGNED_INSUFFICIENT_ON_HAND
    http_status: 409
    applies_to: "POST /plant/kits/{id}/issues"
  - priority: 9
    category: business_constraint
    check: "Cumulative non-voided issued per line <= needed (qty_per_harness * qty_ordered)"
    error_id: ERR_KIT_LINE_OVER_ISSUE
    http_status: 409
    applies_to: "POST /plant/kits/{id}/issues"
  - priority: 9
    category: business_constraint
    check: "Planned setup window does not overlap any existing setup window on the same applicator; half-open semantics [planned_start_at, planned_end_at): overlap iff new.start < existing.end AND existing.start < new.end; touching endpoints allowed"
    error_id: ERR_APPLICATOR_SETUP_OVERLAP
    http_status: 409
    applies_to: "POST /plant/applicator-setups"
  - priority: 9
    category: business_constraint
    check: "Certification window does not overlap any non-REVOKED certification of the same (operator_id, workmanship_class); CLOSED-interval semantics: overlap iff new.issued_at <= existing.expires_at AND existing.issued_at <= new.expires_at; touching endpoints rejected"
    error_id: ERR_CERT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /plant/operator-certifications"
  - priority: 9
    category: business_constraint
    check: "(drawing_id, find_number) unique among DrawingComponent rows"
    error_id: ERR_DUPLICATE_FIND_NUMBER
    http_status: 409
    applies_to: "POST /plant/components"
  - priority: 9
    category: business_constraint
    check: "rework_count < 2 for complete-rework"
    error_id: ERR_REWORK_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /plant/harness-units/{id}/complete-rework"
  - priority: 9
    category: business_constraint
    check: "No other OPEN EngineeringChangeNotice for the same drawing"
    error_id: ERR_ECN_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /plant/ecns"
  - priority: 9
    category: business_constraint
    check: "to_revision != from_revision"
    error_id: ERR_ECN_REVISION_UNCHANGED
    http_status: 422
    applies_to: "POST /plant/ecns"
  - priority: 10
    category: business_temporal
    check: "Certification expires_at > logical clock now (cannot issue an already-expired certification)"
    error_id: ERR_CERT_EXPIRY_NOT_FUTURE
    http_status: 422
    applies_to: "POST /plant/operator-certifications"
  - priority: 11
    category: business_fiscal
    check: "material_spent_cents + (qty_issued * unit_cost_snapshot_cents) <= material_budget_cents when budget is set (equality allowed; strictly greater rejected)"
    error_id: ERR_MATERIAL_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /plant/kits/{id}/issues"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Drawings & BOM ---
  - method: POST
    path: "/plant/drawings"
    description: "Create a harness drawing revision in DRAFT"
    roles: [HarnessEngineer]
    code: 201
    input: [drawing_number, customer_code, revision, workmanship_class]
    output: HarnessDrawing
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/plant/drawings/{id}"
    description: "Get one drawing"
    roles: [HarnessEngineer, ProcessEngineer, QualityManager, QualityInspector, ProductionPlanner, MaterialsClerk, LineOperator, ShippingClerk]
    code: 200
    input: []
    output: HarnessDrawing
    side_effects: []
  - method: POST
    path: "/plant/drawings/{id}/release"
    description: "Release drawing (DRAFT -> RELEASED); requires non-empty BOM"
    roles: [HarnessEngineer]
    code: 200
    input: []
    output: HarnessDrawing
    side_effects: ["status = RELEASED; released_at = now; increments HarnessDrawing.version by 1"]
  - method: POST
    path: "/plant/components"
    description: "Add a BOM component to a DRAFT drawing"
    roles: [HarnessEngineer]
    code: 201
    input: [drawing_id, find_number, component_type, mpn, qty_per_harness, supply_type, unit_cost_cents]
    output: DrawingComponent
    side_effects: []
  - method: GET
    path: "/plant/components/{id}"
    description: "Get one component"
    roles: [HarnessEngineer, ProcessEngineer, QualityManager, QualityInspector, ProductionPlanner, MaterialsClerk, LineOperator, ShippingClerk]
    code: 200
    input: []
    output: DrawingComponent
    side_effects: []
  - method: GET
    path: "/plant/components"
    description: "List components, filterable by drawing"
    roles: [HarnessEngineer, ProcessEngineer, QualityManager, QualityInspector, ProductionPlanner, MaterialsClerk, LineOperator, ShippingClerk]
    code: 200
    input: ["drawing_id?", "limit?", "offset?"]
    output: DrawingComponent[]
    side_effects: []

  # --- Consigned lots ---
  - method: POST
    path: "/plant/consigned-lots"
    description: "Receive a customer-consigned connector lot"
    roles: [MaterialsClerk]
    code: 201
    input: [lot_code, owner_customer_code, mpn, unit_liability_cents, replacement_cost_cents, qty_received]
    output: ConsignedLot
    side_effects: ["qty_on_hand = qty_received; other buckets 0; status ACTIVE"]
  - method: GET
    path: "/plant/consigned-lots/{id}"
    description: "Get one consigned lot"
    roles: [HarnessEngineer, ProcessEngineer, QualityManager, QualityInspector, ProductionPlanner, MaterialsClerk, LineOperator, ShippingClerk]
    code: 200
    input: []
    output: ConsignedLot
    side_effects: []
  - method: POST
    path: "/plant/consigned-lots/{id}/return"
    description: "Return all remaining on-hand pieces to the customer (ACTIVE -> RETURNED)"
    roles: [MaterialsClerk]
    code: 200
    input: []
    output: ConsignedLot
    side_effects: ["qty_returned += qty_on_hand; qty_on_hand = 0; status = RETURNED; increments ConsignedLot.version by 1"]

  # --- Operators & certifications ---
  - method: POST
    path: "/plant/operators"
    description: "Create an operator"
    roles: [QualityManager]
    code: 201
    input: [operator_name, badge_no]
    output: Operator
    side_effects: []
  - method: GET
    path: "/plant/operators/{id}"
    description: "Get one operator"
    roles: [HarnessEngineer, ProcessEngineer, QualityManager, QualityInspector, ProductionPlanner, MaterialsClerk, LineOperator, ShippingClerk]
    code: 200
    input: []
    output: Operator
    side_effects: []
  - method: POST
    path: "/plant/operator-certifications"
    description: "Issue a workmanship-class certification; closed-interval overlap on (operator, class) rejected"
    roles: [QualityManager]
    code: 201
    input: [operator_id, workmanship_class, issued_at, expires_at]
    output: OperatorCertification
    side_effects: []
  - method: GET
    path: "/plant/operator-certifications/{id}"
    description: "Get one certification"
    roles: [HarnessEngineer, ProcessEngineer, QualityManager, QualityInspector, ProductionPlanner, MaterialsClerk, LineOperator, ShippingClerk]
    code: 200
    input: []
    output: OperatorCertification
    side_effects: []
  - method: GET
    path: "/plant/operator-certifications"
    description: "List certifications, filterable by operator"
    roles: [HarnessEngineer, ProcessEngineer, QualityManager, QualityInspector, ProductionPlanner, MaterialsClerk, LineOperator, ShippingClerk]
    code: 200
    input: ["operator_id?", "workmanship_class?", "limit?", "offset?"]
    output: OperatorCertification[]
    side_effects: []
  - method: POST
    path: "/plant/operator-certifications/{id}/revoke"
    description: "Revoke a certification (sets revoked_at; computed status REVOKED)"
    roles: [QualityManager]
    code: 200
    input: []
    output: OperatorCertification
    side_effects: ["revoked_at = now; increments OperatorCertification.version by 1"]

  # --- Applicators, setups, machine programs ---
  - method: POST
    path: "/plant/applicators"
    description: "Register a crimp applicator"
    roles: [ProcessEngineer]
    code: 201
    input: [applicator_code, compatible_terminal_mpn]
    output: Applicator
    side_effects: ["status = AVAILABLE"]
  - method: GET
    path: "/plant/applicators/{id}"
    description: "Get one applicator"
    roles: [HarnessEngineer, ProcessEngineer, QualityManager, QualityInspector, ProductionPlanner, MaterialsClerk, LineOperator, ShippingClerk]
    code: 200
    input: []
    output: Applicator
    side_effects: []
  - method: GET
    path: "/plant/applicators"
    description: "List applicators"
    roles: [HarnessEngineer, ProcessEngineer, QualityManager, QualityInspector, ProductionPlanner, MaterialsClerk, LineOperator, ShippingClerk]
    code: 200
    input: ["current_program_id?", "status?", "limit?", "offset?"]
    output: Applicator[]
    side_effects: []
  - method: POST
    path: "/plant/applicator-setups"
    description: "Open a planned setup window; applicator -> IN_SETUP; half-open overlap check"
    roles: [ProcessEngineer]
    code: 201
    input: [applicator_id, program_id, setup_operator_id, planned_start_at, planned_end_at]
    output: ApplicatorSetup
    side_effects: ["Applicator -> IN_SETUP; current_program_id = program_id; increments Applicator.version by 1"]
  - method: GET
    path: "/plant/applicator-setups/{id}"
    description: "Get one setup"
    roles: [HarnessEngineer, ProcessEngineer, QualityManager, QualityInspector, ProductionPlanner, MaterialsClerk, LineOperator, ShippingClerk]
    code: 200
    input: []
    output: ApplicatorSetup
    side_effects: []
  - method: GET
    path: "/plant/applicator-setups"
    description: "List setups"
    roles: [HarnessEngineer, ProcessEngineer, QualityManager, QualityInspector, ProductionPlanner, MaterialsClerk, LineOperator, ShippingClerk]
    code: 200
    input: ["applicator_id?", "program_id?", "setup_operator_id?", "limit?", "offset?"]
    output: ApplicatorSetup[]
    side_effects: []
  - method: POST
    path: "/plant/applicator-setups/{id}/close"
    description: "Close an OPEN setup; applicator -> AVAILABLE"
    roles: [ProcessEngineer]
    code: 200
    input: [closed_at]
    output: ApplicatorSetup
    side_effects: ["status = CLOSED; closed_at set; Applicator IN_SETUP -> AVAILABLE"]
  - method: POST
    path: "/plant/machine-programs"
    description: "Create a cut/strip/crimp program in DRAFT against a RELEASED drawing; computes min_pull_force_n"
    roles: [ProcessEngineer]
    code: 201
    input: [program_code, drawing_id, applicator_id, wire_gauge_awg, wire_type, cut_length_mm, strip_length_mm, terminal_mpn, terminal_type]
    output: MachineProgram
    side_effects: ["min_pull_force_n computed per crimp_pull_force_minimum"]
  - method: GET
    path: "/plant/machine-programs/{id}"
    description: "Get one machine program"
    roles: [HarnessEngineer, ProcessEngineer, QualityManager, QualityInspector, ProductionPlanner, MaterialsClerk, LineOperator, ShippingClerk]
    code: 200
    input: []
    output: MachineProgram
    side_effects: []
  - method: GET
    path: "/plant/machine-programs"
    description: "List machine programs"
    roles: [HarnessEngineer, ProcessEngineer, QualityManager, QualityInspector, ProductionPlanner, MaterialsClerk, LineOperator, ShippingClerk]
    code: 200
    input: ["drawing_id?", "applicator_id?", "limit?", "offset?"]
    output: MachineProgram[]
    side_effects: []
  - method: PATCH
    path: "/plant/machine-programs/{id}"
    description: "Edit a DRAFT program (OCC via expected_machine_program_version)"
    roles: [ProcessEngineer]
    code: 200
    input: [expected_machine_program_version, "wire_gauge_awg?", "wire_type?", "cut_length_mm?", "strip_length_mm?", "terminal_mpn?", "terminal_type?", "applicator_id?"]
    output: MachineProgram
    side_effects: ["min_pull_force_n recomputed; increments MachineProgram.version by 1"]

  # --- Crimp pull tests ---
  - method: POST
    path: "/plant/crimp-pull-tests"
    description: "Record a first-article or lot-sample pull test; operator = X-User-ID, must hold ACTIVE cert for the program's drawing class"
    roles: [QualityInspector]
    code: 201
    input: [applicator_id, program_id, sample_kind, measured_force_n]
    output: CrimpPullTest
    side_effects:
      - "result computed vs MachineProgram.min_pull_force_n (PASS if measured >= min)"
      - "FIRST_ARTICLE PASS: Applicator AVAILABLE -> QUALIFIED (qualified_at = now); MachineProgram DRAFT -> QUALIFIED or HELD -> QUALIFIED; QC_HOLD orders of the requalified program resume"
      - "LOT_SAMPLE FAIL: Applicator QUALIFIED -> QUARANTINED; programs HELD; orders QC_HOLD; HarnessUnit SUSPECT sweep per suspect_unit_selection"
  - method: GET
    path: "/plant/crimp-pull-tests/{id}"
    description: "Get one pull-test record"
    roles: [HarnessEngineer, ProcessEngineer, QualityManager, QualityInspector, ProductionPlanner, MaterialsClerk, LineOperator, ShippingClerk]
    code: 200
    input: []
    output: CrimpPullTest
    side_effects: []
  - method: GET
    path: "/plant/crimp-pull-tests"
    description: "List pull-test records"
    roles: [HarnessEngineer, ProcessEngineer, QualityManager, QualityInspector, ProductionPlanner, MaterialsClerk, LineOperator, ShippingClerk]
    code: 200
    input: ["applicator_id?", "program_id?", "operator_id?", "limit?", "offset?"]
    output: CrimpPullTest[]
    side_effects: []

  # --- Build orders & serialized harnesses ---
  - method: POST
    path: "/plant/build-orders"
    description: "Create a build order in OPEN against a RELEASED drawing; pins revision and class"
    roles: [ProductionPlanner]
    code: 201
    input: [order_code, drawing_id, qty_ordered, "material_budget_cents?"]
    output: BuildOrder
    side_effects: ["drawing_revision_pinned and workmanship_class copied from drawing"]
  - method: GET
    path: "/plant/build-orders/{id}"
    description: "Get one build order"
    roles: [HarnessEngineer, ProcessEngineer, QualityManager, QualityInspector, ProductionPlanner, MaterialsClerk, LineOperator, ShippingClerk]
    code: 200
    input: []
    output: BuildOrder
    side_effects: []
  - method: GET
    path: "/plant/build-orders"
    description: "List build orders"
    roles: [HarnessEngineer, ProcessEngineer, QualityManager, QualityInspector, ProductionPlanner, MaterialsClerk, LineOperator, ShippingClerk]
    code: 200
    input: ["drawing_id?", "status?", "held_by_program_id?", "limit?", "offset?"]
    output: BuildOrder[]
    side_effects: []
  - method: PATCH
    path: "/plant/build-orders/{id}"
    description: "Edit qty_ordered / material_budget_cents while OPEN (OCC via expected_build_order_version)"
    roles: [ProductionPlanner]
    code: 200
    input: [expected_build_order_version, "qty_ordered?", "material_budget_cents?"]
    output: BuildOrder
    side_effects: ["increments BuildOrder.version by 1"]
  - method: POST
    path: "/plant/build-orders/{id}/release-to-kitting"
    description: "OPEN -> KITTING; creates the next Kit in PICKING"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: BuildOrder
    side_effects: ["creates Kit (PICKING) with shortage_count initialized to total needed; increments BuildOrder.version by 1"]
  - method: POST
    path: "/plant/build-orders/{id}/cancel"
    description: "OPEN -> CANCELLED"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: BuildOrder
    side_effects: ["status = CANCELLED; increments BuildOrder.version by 1"]
  - method: POST
    path: "/plant/build-orders/{id}/harness-units"
    description: "Record one built serialized harness; built_by_operator_id = X-User-ID; serial minted from next_unit_seq"
    roles: [LineOperator]
    code: 201
    input: []
    output: HarnessUnit
    side_effects: ["serial_number = '<order_code>-' + zero-padded next_unit_seq; next_unit_seq += 1; qty_built recomputed; IN_BUILD -> TESTING when qty_built + qty_scrapped == qty_ordered"]
  - method: GET
    path: "/plant/harness-units/{id}"
    description: "Get one harness unit"
    roles: [HarnessEngineer, ProcessEngineer, QualityManager, QualityInspector, ProductionPlanner, MaterialsClerk, LineOperator, ShippingClerk]
    code: 200
    input: []
    output: HarnessUnit
    side_effects: []
  - method: GET
    path: "/plant/harness-units"
    description: "List harness units"
    roles: [HarnessEngineer, ProcessEngineer, QualityManager, QualityInspector, ProductionPlanner, MaterialsClerk, LineOperator, ShippingClerk]
    code: 200
    input: ["build_order_id?", "built_by_operator_id?", "status?", "limit?", "offset?"]
    output: HarnessUnit[]
    side_effects: []
  - method: POST
    path: "/plant/harness-units/{id}/complete-rework"
    description: "REWORK -> BUILT; rework_count += 1; cap 2"
    roles: [LineOperator]
    code: 200
    input: []
    output: HarnessUnit
    side_effects: ["rework_count += 1; continuity_pass = false; hipot_pass = false; increments HarnessUnit.version by 1"]
  - method: POST
    path: "/plant/harness-units/{id}/scrap"
    description: "Scrap a unit in {BUILT, REWORK, SUSPECT}; computes scrap credit and consigned transfer"
    roles: [QualityInspector]
    code: 200
    input: [reason]
    output: HarnessUnit
    side_effects: ["status = SCRAPPED; scrap_reason set; scrap_recovery_credit accumulated to order; consigned consumed -> scrapped transfer (FIFO by issued_at ASC, kit_seq ASC); order counters recomputed; increments HarnessUnit.version by 1"]
  - method: POST
    path: "/plant/harness-units/{id}/ship"
    description: "TEST_PASS -> SHIPPED"
    roles: [ShippingClerk]
    code: 200
    input: []
    output: HarnessUnit
    side_effects: ["status = SHIPPED; increments HarnessUnit.version by 1"]

  # --- Kits ---
  - method: GET
    path: "/plant/kits/{id}"
    description: "Get one kit"
    roles: [HarnessEngineer, ProcessEngineer, QualityManager, QualityInspector, ProductionPlanner, MaterialsClerk, LineOperator, ShippingClerk]
    code: 200
    input: []
    output: Kit
    side_effects: []
  - method: GET
    path: "/plant/kits"
    description: "List kits"
    roles: [HarnessEngineer, ProcessEngineer, QualityManager, QualityInspector, ProductionPlanner, MaterialsClerk, LineOperator, ShippingClerk]
    code: 200
    input: ["build_order_id?", "status?", "limit?", "offset?"]
    output: Kit[]
    side_effects: []
  - method: POST
    path: "/plant/kits/{id}/issues"
    description: "Issue one BOM line into a PICKING kit; auto-STAGE at zero shortage"
    roles: [MaterialsClerk]
    code: 201
    input: [component_id, qty_issued, source, "consigned_lot_id?"]
    output: Kit
    side_effects:
      - "Appends issue object { component_id, qty_issued, source, consigned_lot_id, unit_cost_snapshot_cents, issued_at, voided=false }"
      - "unit_cost_snapshot_cents = ConsignedLot.unit_liability_cents when source == CONSIGNED_LOT else DrawingComponent.unit_cost_cents"
      - "Consigned issue: lot.qty_on_hand -= qty_issued; lot.qty_issued_open += qty_issued"
      - "shortage_count recomputed; PICKING -> STAGED at shortage_count == 0 with >= 1 non-voided issue"
      - "BuildOrder.material_spent_cents / actual_cost_cents recomputed"
  - method: POST
    path: "/plant/kits/{id}/deliver"
    description: "STAGED -> DELIVERED_LINESIDE; consigned issued_open -> consumed"
    roles: [MaterialsClerk]
    code: 200
    input: []
    output: Kit
    side_effects: ["consigned bucket transfer; lot DEPLETED check; BuildOrder KITTING -> IN_BUILD on first delivery; delivered_at = now; increments Kit.version by 1"]
  - method: POST
    path: "/plant/kits/{id}/return"
    description: "PICKING|STAGED -> RETURNED; voids all issues and restores consigned on_hand"
    roles: [MaterialsClerk]
    code: 200
    input: []
    output: Kit
    side_effects: ["all non-voided issues voided; consigned qty_issued_open -> qty_on_hand; order spend/actual recomputed; increments Kit.version by 1"]

  # --- Electrical test records ---
  - method: POST
    path: "/plant/electrical-test-records"
    description: "Record a continuity or hipot test on a serialized harness; test_operator_id = X-User-ID with ACTIVE cert for the order's class; SoD vs builder enforced"
    roles: [QualityInspector]
    code: 201
    input: [harness_unit_id, test_type, "opens_count?", "hipot_voltage_v?", "dwell_seconds?", "measured_leakage_ua?", "leakage_limit_ua?"]
    output: ElectricalTestRecord
    side_effects:
      - "result computed per electrical_test_result"
      - "PASS: corresponding flag on HarnessUnit = true; both flags true -> unit BUILT|SUSPECT -> TEST_PASS; order TESTING -> COMPLETED check runs"
      - "FAIL: HarnessUnit -> REWORK (flag of failed type = false)"
  - method: GET
    path: "/plant/electrical-test-records/{id}"
    description: "Get one electrical test record"
    roles: [HarnessEngineer, ProcessEngineer, QualityManager, QualityInspector, ProductionPlanner, MaterialsClerk, LineOperator, ShippingClerk]
    code: 200
    input: []
    output: ElectricalTestRecord
    side_effects: []
  - method: GET
    path: "/plant/electrical-test-records"
    description: "List electrical test records"
    roles: [HarnessEngineer, ProcessEngineer, QualityManager, QualityInspector, ProductionPlanner, MaterialsClerk, LineOperator, ShippingClerk]
    code: 200
    input: ["harness_unit_id?", "test_operator_id?", "limit?", "offset?"]
    output: ElectricalTestRecord[]
    side_effects: []

  # --- Engineering change notices ---
  - method: POST
    path: "/plant/ecns"
    description: "Open an ECN against a RELEASED drawing; from_revision copied"
    roles: [HarnessEngineer]
    code: 201
    input: [drawing_id, to_revision, wip_disposition]
    output: EngineeringChangeNotice
    side_effects: ["from_revision = drawing.revision"]
  - method: GET
    path: "/plant/ecns/{id}"
    description: "Get one ECN"
    roles: [HarnessEngineer, ProcessEngineer, QualityManager, QualityInspector, ProductionPlanner, MaterialsClerk, LineOperator, ShippingClerk]
    code: 200
    input: []
    output: EngineeringChangeNotice
    side_effects: []
  - method: GET
    path: "/plant/ecns"
    description: "List ECNs"
    roles: [HarnessEngineer, ProcessEngineer, QualityManager, QualityInspector, ProductionPlanner, MaterialsClerk, LineOperator, ShippingClerk]
    code: 200
    input: ["drawing_id?", "new_drawing_id?", "status?", "limit?", "offset?"]
    output: EngineeringChangeNotice[]
    side_effects: []
  - method: POST
    path: "/plant/ecns/{id}/apply"
    description: "Apply ECN: supersedes drawing, creates new DRAFT revision with copied BOM, dispositions WIP per wip_disposition"
    roles: [HarnessEngineer]
    code: 200
    input: []
    output: EngineeringChangeNotice
    side_effects: ["drawing SUPERSEDED; new HarnessDrawing DRAFT created with copied components; BuildOrder disposition cascade (REWORK / USE_AS_IS / SCRAP) per state machine; applied_at = now; increments EngineeringChangeNotice.version by 1"]
  - method: POST
    path: "/plant/ecns/{id}/cancel"
    description: "OPEN -> CANCELLED"
    roles: [HarnessEngineer]
    code: 200
    input: []
    output: EngineeringChangeNotice
    side_effects: ["increments EngineeringChangeNotice.version by 1"]

  # --- Test-driving: logical clock ---
  - method: POST
    path: "/plant/_clock/set_current_utc"
    description: "Set the logical clock. Startup default before any set call is exactly 2026-08-01T00:00:00Z; the server never falls back to wall-clock time. All `now` references (released_at, tested_at, cert status, suspect_marked_at, applied_at) read this clock."
    roles: [QualityManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing/invalid declared fields, bad enum, violated field constraint (incl. conditional HIPOT/CONTINUITY requirements, expires_at <= issued_at, planned_end_at <= planned_start_at)" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK references a non-existent resource" }
  - { id: ERR_STALE_BUILD_ORDER_VERSION, http: 412, condition: "expected_build_order_version != BuildOrder.version on PATCH" }
  - { id: ERR_STALE_PROGRAM_VERSION, http: 412, condition: "expected_machine_program_version != MachineProgram.version on PATCH" }
  - { id: ERR_DRAWING_NOT_DRAFT, http: 409, condition: "Drawing not DRAFT for component add / release" }
  - { id: ERR_DRAWING_EMPTY_BOM, http: 409, condition: "Release with zero DrawingComponent rows" }
  - { id: ERR_DRAWING_NOT_RELEASED, http: 409, condition: "Drawing not RELEASED for program / build-order / ECN creation" }
  - { id: ERR_PROGRAM_NOT_DRAFT, http: 409, condition: "PATCH on a program not in DRAFT" }
  - { id: ERR_APPLICATOR_SETUP_ALREADY_OPEN, http: 409, condition: "Another OPEN setup exists on the applicator" }
  - { id: ERR_FIRST_ARTICLE_PREREQUISITE, http: 409, condition: "FIRST_ARTICLE without applicator AVAILABLE + closed setup for the pair + program IN {DRAFT, HELD}" }
  - { id: ERR_APPLICATOR_NOT_QUALIFIED, http: 409, condition: "LOT_SAMPLE while applicator not QUALIFIED" }
  - { id: ERR_NO_QUALIFIED_PROGRAM, http: 409, condition: "release-to-kitting with no QUALIFIED program for the drawing" }
  - { id: ERR_BUILD_ORDER_NOT_OPEN, http: 409, condition: "Patch/cancel on a build order not OPEN" }
  - { id: ERR_BUILD_ORDER_NOT_IN_BUILD, http: 409, condition: "Harness-unit creation on an order not IN_BUILD" }
  - { id: ERR_HARNESS_NOT_TESTABLE, http: 409, condition: "Electrical test on a unit not IN {BUILT, REWORK, SUSPECT}" }
  - { id: ERR_UNIT_NOT_SHIPPABLE, http: 409, condition: "Ship on a unit not TEST_PASS" }
  - { id: ERR_KIT_NOT_PICKING, http: 409, condition: "Issue into a kit not PICKING" }
  - { id: ERR_KIT_NOT_STAGED, http: 409, condition: "Deliver a kit not STAGED" }
  - { id: ERR_ECN_NOT_OPEN, http: 409, condition: "Apply/cancel on an ECN not OPEN" }
  - { id: ERR_OPERATOR_NOT_CERTIFIED, http: 409, condition: "Acting operator lacks an ACTIVE certification for the required workmanship class (missing, EXPIRED at now >= expires_at, or REVOKED)" }
  - { id: ERR_SOD_BUILDER_CANNOT_TEST, http: 409, condition: "test_operator_id equals HarnessUnit.built_by_operator_id (segregation of duties)" }
  - { id: ERR_HIPOT_VOLTAGE_BELOW_CLASS_MIN, http: 422, condition: "hipot_voltage_v < class minimum (500/1000/1500 V for Class 1/2/3)" }
  - { id: ERR_CONSIGNED_SUBSTITUTION_FORBIDDEN, http: 409, condition: "source does not match the BOM line's supply_type (factory stock substituted for customer-consigned connector, or vice versa)" }
  - { id: ERR_COMPONENT_NOT_ON_DRAWING, http: 409, condition: "Issued component is not on the order's pinned drawing revision" }
  - { id: ERR_CONSIGNED_LOT_NOT_ISSUABLE, http: 409, condition: "Referenced lot not ACTIVE (DEPLETED or RETURNED)" }
  - { id: ERR_CONSIGNED_MPN_MISMATCH, http: 422, condition: "Lot mpn differs from the BOM component mpn" }
  - { id: ERR_APPLICATOR_PROGRAM_MISMATCH, http: 422, condition: "LOT_SAMPLE program_id != applicator.current_program_id" }
  - { id: ERR_CONSIGNED_INSUFFICIENT_ON_HAND, http: 409, condition: "qty_issued > lot.qty_on_hand" }
  - { id: ERR_KIT_LINE_OVER_ISSUE, http: 409, condition: "Cumulative issued exceeds needed for the BOM line" }
  - { id: ERR_APPLICATOR_SETUP_OVERLAP, http: 409, condition: "Planned setup window overlaps an existing window on the applicator (half-open semantics; adjacency allowed)" }
  - { id: ERR_CERT_WINDOW_OVERLAP, http: 409, condition: "Certification window overlaps a non-REVOKED cert of same (operator, class) (closed-interval semantics; touching endpoints rejected)" }
  - { id: ERR_DUPLICATE_FIND_NUMBER, http: 409, condition: "(drawing_id, find_number) already exists" }
  - { id: ERR_REWORK_LIMIT_EXCEEDED, http: 409, condition: "complete-rework with rework_count >= 2" }
  - { id: ERR_ECN_ALREADY_OPEN, http: 409, condition: "Another OPEN ECN exists for the drawing" }
  - { id: ERR_ECN_REVISION_UNCHANGED, http: 422, condition: "to_revision == from_revision" }
  - { id: ERR_CERT_EXPIRY_NOT_FUTURE, http: 422, condition: "expires_at <= logical clock now at issuance" }
  - { id: ERR_MATERIAL_BUDGET_EXCEEDED, http: 422, condition: "Issue would push material_spent_cents strictly above material_budget_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: HarnessEngineer
    description: "Owns harness drawings, BOM components, and engineering change notices"
    identity: opaque
    exclusive_operations:
      - "POST /plant/drawings, /plant/drawings/{id}/release"
      - "POST /plant/components"
      - "POST /plant/ecns, /plant/ecns/{id}/apply, /plant/ecns/{id}/cancel"
    shared_operations: ["All GET endpoints"]
  - name: ProcessEngineer
    description: "Owns crimp applicators, setup windows, and cut/strip/crimp machine programs"
    identity: opaque
    exclusive_operations:
      - "POST /plant/applicators, /plant/applicator-setups, /plant/applicator-setups/{id}/close"
      - "POST /plant/machine-programs, PATCH /plant/machine-programs/{id}"
    shared_operations: ["All GET endpoints"]
  - name: QualityManager
    description: "Owns operators, operator certifications, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /plant/operators, /plant/operator-certifications, /plant/operator-certifications/{id}/revoke"
      - "POST /plant/_clock/set_current_utc"
    shared_operations: ["All GET endpoints"]
  - name: QualityInspector
    description: "Certified inspector recording pull tests and electrical tests; may scrap units. X-User-ID is an Operator id."
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "POST /plant/crimp-pull-tests"
      - "POST /plant/electrical-test-records"
      - "POST /plant/harness-units/{id}/scrap"
    shared_operations: ["All GET endpoints"]
  - name: ProductionPlanner
    description: "Owns build orders and release to kitting"
    identity: opaque
    exclusive_operations:
      - "POST /plant/build-orders, PATCH /plant/build-orders/{id}"
      - "POST /plant/build-orders/{id}/release-to-kitting, /plant/build-orders/{id}/cancel"
    shared_operations: ["All GET endpoints"]
  - name: MaterialsClerk
    description: "Owns consigned lots and kitting for line-side delivery"
    identity: opaque
    exclusive_operations:
      - "POST /plant/consigned-lots, /plant/consigned-lots/{id}/return"
      - "POST /plant/kits/{id}/issues, /plant/kits/{id}/deliver, /plant/kits/{id}/return"
    shared_operations: ["All GET endpoints"]
  - name: LineOperator
    description: "Builds serialized harnesses and completes rework. X-User-ID is an Operator id; the builder is stamped on each unit and is barred by segregation of duties from testing it."
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "POST /plant/build-orders/{id}/harness-units"
      - "POST /plant/harness-units/{id}/complete-rework"
    shared_operations: ["All GET endpoints"]
  - name: ShippingClerk
    description: "Ships tested harnesses"
    identity: opaque
    exclusive_operations:
      - "POST /plant/harness-units/{id}/ship"
    shared_operations: ["All GET endpoints"]
