# =============================================================================
# §1.9 Scaffold Corner Design — breadth probe over every testable claim the
# §1.1-§1.7 surface declares that §1.8 does not already cover.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: patient_creation_initialises_both_axes_and_the_open_gate
        claim_type: creation
        grounds:
          - entities.Patient.fields.clinical_status
          - entities.Patient.fields.scope_review_status
          - entities.Patient.fields.clinical_write_gate
        distinguishing_aspect: "A newly created Patient starts INTAKE / NONE / OPEN with both intake scores at 0 and version 1."
        test_recipe:
          setup:
            - "One ND practitioner exists"
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Nora Vance", credential: "ND", licensed_state_codes: ["OR"], npi: "1234567893" }
              as: PracticeAdmin
              captures: { nd_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", state_code: "OR", primary_practitioner_id: "${nd_id}" }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Patient.${pt_id}.clinical_status == INTAKE"
            - "Patient.${pt_id}.scope_review_status == NONE"
            - "Patient.${pt_id}.clinical_write_gate == OPEN"
            - "Patient.${pt_id}.intake_booking_score == 0"
            - "Patient.${pt_id}.intake_protocol_score == 0"
            - "Patient.${pt_id}.version == 1"

      - name: patient_get_with_unknown_id_returns_patient_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_PATIENT_NOT_FOUND]
        distinguishing_aspect: "A well-formed but unknown patient id in the path yields 404 ERR_PATIENT_NOT_FOUND, not a generic resource error."
        test_recipe:
          setup:
            - "Empty database apart from one practitioner"
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Nora Vance", credential: "ND", licensed_state_codes: ["OR"], npi: "1234567893" }
              as: PracticeAdmin
              captures: { nd_id: $.data.id }
          trigger:
            - call: "GET /patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PracticeAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 404 and error_id == ERR_PATIENT_NOT_FOUND"

      - name: patient_creation_missing_required_state_code_returns_validation
        claim_type: required_fields
        grounds:
          - validations[priority=11]
          - errors[ERR_VALIDATION]
          - entities.Patient.fields.state_code
        distinguishing_aspect: "state_code has source input and no default, so omitting it returns 400 ERR_VALIDATION."
        test_recipe:
          setup:
            - "One ND practitioner exists"
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Nora Vance", credential: "ND", licensed_state_codes: ["OR"], npi: "1234567893" }
              as: PracticeAdmin
              captures: { nd_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", primary_practitioner_id: "${nd_id}" }
              as: PracticeAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 400 and error_id == ERR_VALIDATION"
            - "No Patient row was created"

      - name: patient_telehealth_consent_defaults_to_false
        claim_type: defaults
        grounds:
          - entities.Patient.fields.telehealth_consent
        distinguishing_aspect: "Omitting telehealth_consent stores false, which later drives ERR_MODALITY_CONSENT_MISSING on a telehealth booking."
        test_recipe:
          setup:
            - "One ND practitioner licensed in OR"
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Nora Vance", credential: "ND", licensed_state_codes: ["OR"], npi: "1234567893" }
              as: PracticeAdmin
              captures: { nd_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", state_code: "OR", primary_practitioner_id: "${nd_id}" }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
          assert:
            - "Patient.${pt_id}.telehealth_consent == false"
            - "Patient.${pt_id}.medication_classes == []"

      - name: practitioner_creation_with_invalid_credential_returns_invalid_enum
        claim_type: type_constraints
        grounds:
          - validations[priority=12]
          - errors[ERR_INVALID_ENUM]
          - entities.Practitioner.fields.credential
        distinguishing_aspect: "credential outside {ND, HEALTH_COACH, DISPENSARY_TECH, CLINICAL_DIRECTOR} returns 422 ERR_INVALID_ENUM, distinct from the 400 shape error."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Nobody", credential: "CHIROPRACTOR", licensed_state_codes: ["OR"] }
              as: PracticeAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 422 and error_id == ERR_INVALID_ENUM"

      - name: lab_result_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.LabResult
        distinguishing_aspect: "LabResult declares common_fields false, so its response carries id and created_at but neither updated_at nor version, and no endpoint mutates it."
        test_recipe:
          setup:
            - "A collected SERUM_METABOLIC cash lab order for an OR patient"
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Nora Vance", credential: "ND", licensed_state_codes: ["OR"], npi: "1234567893" }
              as: PracticeAdmin
              captures: { nd_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", state_code: "OR", primary_practitioner_id: "${nd_id}" }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /lab-orders"
              payload: { patient_id: "${pt_id}", panel_code: "SERUM_METABOLIC", funding_source: "CASH", requested_collection_date: "2026-05-04", fasting_attested: true }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
              captures: { lo_id: $.data.id }
            - call: "POST /lab-orders/${lo_id}/collect"
              payload: {}
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
          trigger:
            - call: "POST /lab-orders/${lo_id}/results"
              payload: { analyte_code: "TSH", value: 2.0, unit: "uIU/mL", standard_low: 0.45, standard_high: 4.50, optimal_low: 1.00, optimal_high: 2.50, critical_low: 0.10, critical_high: 10.00 }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
              captures: { res_id: $.data.id }
          assert:
            - "The LabResult response body contains id and created_at"
            - "The LabResult response body contains no version key and no updated_at key"
            - "LabResult.${res_id}.standard_band == IN_RANGE"
            - "LabResult.${res_id}.optimal_band == OPTIMAL"

      - name: patient_list_returns_pagination_envelope_and_filters_by_practitioner
        claim_type: listing
        grounds:
          - endpoints[GET /patients]
          - entities.Patient.fields.primary_practitioner_id
        distinguishing_aspect: "GET /patients with limit 1 returns exactly one row plus total_count 2 and has_more true, and the primary_practitioner_id filter is the FK reverse-reachability path from Practitioner to Patient."
        test_recipe:
          setup:
            - "Two patients attached to the same ND"
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Nora Vance", credential: "ND", licensed_state_codes: ["OR"], npi: "1234567893" }
              as: PracticeAdmin
              captures: { nd_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", state_code: "OR", primary_practitioner_id: "${nd_id}" }
              as: PracticeAdmin
              captures: { pt_a: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ben Cash", email: "ben@example.com", state_code: "OR", primary_practitioner_id: "${nd_id}" }
              as: PracticeAdmin
              captures: { pt_b: $.data.id }
          trigger:
            - call: "GET /patients"
              payload: { primary_practitioner_id: "${nd_id}", limit: 1, offset: 0 }
              as: PracticeAdmin
              captures: { first_id: "$.data[0].id" }
          assert:
            - "meta.total_count == 2 and meta.has_more == true and exactly 1 row is returned"
            - "${first_id} is one of ${pt_a} or ${pt_b}"

      - name: intake_section_server_owned_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.IntakeSection.fields.status
          - entities.IntakeSection.fields.weight
        distinguishing_aspect: "status and weight are server-owned: supplying status ATTESTED and weight 99 on creation is ignored and the row is stored SUBMITTED with the constant weight 25."
        test_recipe:
          setup:
            - "One OR patient"
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Nora Vance", credential: "ND", licensed_state_codes: ["OR"], npi: "1234567893" }
              as: PracticeAdmin
              captures: { nd_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", state_code: "OR", primary_practitioner_id: "${nd_id}" }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
          trigger:
            - call: "POST /patients/${pt_id}/intake-sections"
              payload: { section_type: "CHIEF_COMPLAINT_TIMELINE", payload_summary: "fatigue", status: "ATTESTED", weight: 99 }
              as: Patient
              as_user_id: "${pt_id}"
              captures: { sec_id: $.data.id }
          assert:
            - "IntakeSection.${sec_id}.status == SUBMITTED"
            - "IntakeSection.${sec_id}.weight == 25"
            - "IntakeSection.${sec_id}.attested_at == null"
            - "Patient.${pt_id}.intake_booking_score == 12"
            - "Patient.${pt_id}.intake_protocol_score == 0"

  - section: state_machines
    instances:

      - name: attesting_an_already_attested_section_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.IntakeSection.SUBMITTED_to_ATTESTED
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "The second attest of the same section finds status ATTESTED, which has no ATTESTED -> ATTESTED transition, so it returns 409 ERR_INVALID_STATE and does not move expires_at."
        test_recipe:
          setup:
            - "One OR patient with one ATTESTED CHIEF_COMPLAINT_TIMELINE section"
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Nora Vance", credential: "ND", licensed_state_codes: ["OR"], npi: "1234567893" }
              as: PracticeAdmin
              captures: { nd_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", state_code: "OR", primary_practitioner_id: "${nd_id}" }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /patients/${pt_id}/intake-sections"
              payload: { section_type: "CHIEF_COMPLAINT_TIMELINE", payload_summary: "fatigue" }
              as: Patient
              as_user_id: "${pt_id}"
              captures: { sec_id: $.data.id }
            - call: "POST /intake-sections/${sec_id}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_id}"
          trigger:
            - call: "POST /intake-sections/${sec_id}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409 and error_id == ERR_INVALID_STATE"
            - "IntakeSection.${sec_id}.status == ATTESTED"
            - "IntakeSection.${sec_id}.expires_at == 2026-10-28T00:00:00.000Z"

      - name: intake_resubmission_returns_attested_section_to_submitted
        claim_type: valid_transition
        grounds:
          - state_machines.IntakeSection.ATTESTED_to_SUBMITTED
          - calculations.intake_completeness_score
        distinguishing_aspect: "Re-posting an existing section_type overwrites the same row back to SUBMITTED, clearing attested_at, and the protocol score drops from 25 to 0 while the booking score falls to 12."
        test_recipe:
          setup:
            - "One OR patient with an ATTESTED CHIEF_COMPLAINT_TIMELINE section (booking 25, protocol 25)"
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Nora Vance", credential: "ND", licensed_state_codes: ["OR"], npi: "1234567893" }
              as: PracticeAdmin
              captures: { nd_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", state_code: "OR", primary_practitioner_id: "${nd_id}" }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /patients/${pt_id}/intake-sections"
              payload: { section_type: "CHIEF_COMPLAINT_TIMELINE", payload_summary: "fatigue" }
              as: Patient
              as_user_id: "${pt_id}"
              captures: { sec_id: $.data.id }
            - call: "POST /intake-sections/${sec_id}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_id}"
          trigger:
            - call: "POST /patients/${pt_id}/intake-sections"
              payload: { section_type: "CHIEF_COMPLAINT_TIMELINE", payload_summary: "fatigue, revised timeline" }
              as: Patient
              as_user_id: "${pt_id}"
              captures: { sec_again: $.data.id }
          assert:
            - "${sec_again} == ${sec_id} — the same row was overwritten, not duplicated"
            - "IntakeSection.${sec_id}.status == SUBMITTED"
            - "IntakeSection.${sec_id}.attested_at == null"
            - "IntakeSection.${sec_id}.expires_at == null"
            - "Patient.${pt_id}.intake_booking_score == 12"
            - "Patient.${pt_id}.intake_protocol_score == 0"
            - "GET /patients/${pt_id}/intake-sections returns exactly 1 row"

      - name: membership_pause_and_resume_extends_the_cycle_end_date
        claim_type: side_effect_execution
        grounds:
          - state_machines.Membership.ACTIVE_to_PAUSED
          - state_machines.Membership.PAUSED_to_ACTIVE
          - entities.Membership.fields.paused_days_total
        distinguishing_aspect: "Pausing on 2026-05-05 and resuming on 2026-05-15 adds 10 days to paused_days_total and pushes cycle_end_date from 2026-05-30 to 2026-06-09, closing the pause/resume cycle."
        test_recipe:
          setup:
            - "A CORE membership opened 2026-05-01 with cycle_end_date 2026-05-30"
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Nora Vance", credential: "ND", licensed_state_codes: ["OR"], npi: "1234567893" }
              as: PracticeAdmin
              captures: { nd_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", state_code: "OR", primary_practitioner_id: "${nd_id}" }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /memberships"
              payload: { patient_id: "${pt_id}", tier: "CORE", cycle_start_date: "2026-05-01" }
              as: PracticeAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T00:00:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "POST /memberships/${mem_id}/pause"
              payload: {}
              as: PracticeAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /memberships/${mem_id}/resume"
              payload: {}
              as: PracticeAdmin
          assert:
            - "Membership.${mem_id}.status == ACTIVE"
            - "Membership.${mem_id}.paused_days_total == 10"
            - "Membership.${mem_id}.cycle_end_date == 2026-06-09"
            - "Membership.${mem_id}.paused_at == null"
            - "Membership.${mem_id}.visits_remaining == 4"

      - name: membership_roll_cycle_forfeits_the_remainder_and_regrants
        claim_type: valid_transition
        grounds:
          - state_machines.Membership.ACTIVE_to_ACTIVE
          - conservation_invariants.membership_visit_units
          - entities.Membership.fields.cycle_index
        distinguishing_aspect: "The renewing self-loop moves 4 unused visits into visits_forfeited and adds a fresh grant of 4, so granted 8 == consumed 0 + remaining 4 + forfeited 4 and cycle_index becomes 2 with the window advanced to 2026-05-31..2026-06-29."
        test_recipe:
          setup:
            - "A CORE membership opened 2026-05-01 with nothing consumed"
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Nora Vance", credential: "ND", licensed_state_codes: ["OR"], npi: "1234567893" }
              as: PracticeAdmin
              captures: { nd_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", state_code: "OR", primary_practitioner_id: "${nd_id}" }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /memberships"
              payload: { patient_id: "${pt_id}", tier: "CORE", cycle_start_date: "2026-05-01" }
              as: PracticeAdmin
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /memberships/${mem_id}/roll-cycle"
              payload: { renew: true }
              as: PracticeAdmin
          assert:
            - "Membership.${mem_id}.status == ACTIVE"
            - "Membership.${mem_id}.cycle_index == 2"
            - "Membership.${mem_id}.cycle_start_date == 2026-05-31"
            - "Membership.${mem_id}.cycle_end_date == 2026-06-29"
            - "Membership.${mem_id}.visits_granted == 8"
            - "Membership.${mem_id}.visits_consumed == 0"
            - "Membership.${mem_id}.visits_remaining == 4"
            - "Membership.${mem_id}.visits_forfeited == 4"
            - "Membership.${mem_id}.lab_credits_granted == 4"
            - "Membership.${mem_id}.lab_credits_forfeited == 2"

      - name: membership_expiry_moves_the_patient_to_inactive
        claim_type: side_effect_execution
        grounds:
          - state_machines.Membership.ACTIVE_to_EXPIRED
          - state_machines.Patient.ESTABLISHED_to_INACTIVE
          - state_machines.Patient.INACTIVE_to_ESTABLISHED
        distinguishing_aspect: "A non-renewing roll-cycle expires the membership and, as a consequence of that expiry, drives the ESTABLISHED patient to INACTIVE; opening a fresh membership returns them to ESTABLISHED."
        test_recipe:
          setup:
            - "An ESTABLISHED patient (one completed encounter) holding a CORE membership"
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Nora Vance", credential: "ND", licensed_state_codes: ["OR"], npi: "1234567893" }
              as: PracticeAdmin
              captures: { nd_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", state_code: "OR", primary_practitioner_id: "${nd_id}" }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /memberships"
              payload: { patient_id: "${pt_id}", tier: "CORE", cycle_start_date: "2026-05-01" }
              as: PracticeAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /patients/${pt_id}/intake-sections"
              payload: { section_type: "CHIEF_COMPLAINT_TIMELINE", payload_summary: "fatigue" }
              as: Patient
              as_user_id: "${pt_id}"
              captures: { s1: $.data.id }
            - call: "POST /intake-sections/${s1}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_id}"
            - call: "POST /patients/${pt_id}/intake-sections"
              payload: { section_type: "SYSTEMS_REVIEW", payload_summary: "sleep" }
              as: Patient
              as_user_id: "${pt_id}"
              captures: { s2: $.data.id }
            - call: "POST /intake-sections/${s2}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_id}"
            - call: "POST /patients/${pt_id}/intake-sections"
              payload: { section_type: "FAMILY_HISTORY", payload_summary: "thyroid" }
              as: Patient
              as_user_id: "${pt_id}"
              captures: { s3: $.data.id }
            - call: "POST /intake-sections/${s3}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_id}"
            - call: "POST /encounters"
              payload: { patient_id: "${pt_id}", practitioner_id: "${nd_id}", modality: "IN_PERSON", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T10:00:00Z" }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
              captures: { enc_id: $.data.id }
            - call: "POST /encounters/${enc_id}/complete"
              payload: { duration_minutes: 30, service_code: "99213", diagnosis_codes: ["R53.83"] }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
          trigger:
            - call: "POST /memberships/${mem_id}/roll-cycle"
              payload: { renew: false }
              as: PracticeAdmin
            - call: "POST /memberships"
              payload: { patient_id: "${pt_id}", tier: "FOUNDATION", cycle_start_date: "2026-07-01" }
              as: PracticeAdmin
              captures: { mem_2: $.data.id }
          assert:
            - "After the non-renewing roll, Membership.${mem_id}.status == EXPIRED and Patient.${pt_id}.clinical_status was INACTIVE"
            - "Membership.${mem_id}.visits_forfeited == 3"
            - "Membership.${mem_id}.visits_remaining == 0"
            - "After the new membership, Patient.${pt_id}.clinical_status == ESTABLISHED"
            - "Membership.${mem_2}.visits_granted == 2"

      - name: protocol_activation_supersedes_predecessor_and_stops_its_lines
        claim_type: side_effect_execution
        grounds:
          - state_machines.Protocol.ISSUED_to_ACTIVE
          - state_machines.Protocol.ACTIVE_to_SUPERSEDED
          - entities.Protocol.fields.supersedes_protocol_id
          - entities.Protocol.fields.version_no
        distinguishing_aspect: "Activating a revision that names its predecessor moves the predecessor to SUPERSEDED (link 1), discontinues its live lines with reason SUPERSEDED_BY_REVISION (link 2) and clears their next_review_due_at (link 3) — and reverses no dispense."
        test_recipe:
          setup:
            - "An OR patient with four attested sections and an ACTIVE protocol v1 carrying one item"
            - "A second DRAFT protocol naming v1 in supersedes_protocol_id, with its own item"
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Nora Vance", credential: "ND", licensed_state_codes: ["OR"], npi: "1234567893" }
              as: PracticeAdmin
              captures: { nd_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", state_code: "OR", primary_practitioner_id: "${nd_id}" }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /patients/${pt_id}/intake-sections"
              payload: { section_type: "CHIEF_COMPLAINT_TIMELINE", payload_summary: "fatigue" }
              as: Patient
              as_user_id: "${pt_id}"
              captures: { s1: $.data.id }
            - call: "POST /intake-sections/${s1}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_id}"
            - call: "POST /patients/${pt_id}/intake-sections"
              payload: { section_type: "SYSTEMS_REVIEW", payload_summary: "sleep" }
              as: Patient
