            - { call: "POST /v1/subscription-plans", payload: { tier: "GOLD" }, as: Caregiver, as_user_id: "${cg_pv}", captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_FORBIDDEN_ROLE' (HTTP 403), not ERR_INVALID_REQUEST/ERR_INVALID_ENUM"
