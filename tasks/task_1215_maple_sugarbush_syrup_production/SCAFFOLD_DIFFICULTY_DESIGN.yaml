      - call: POST /sugarhouse/sap-runs/${run1_id}/confirm
        as: FieldCrew
        as_user_id: ${tapper_id}
      - call: POST /sugarhouse/_clock/set_current_utc
        payload:
          to_iso8601: '2027-03-03T00:00:00Z'
        as: SugarhouseManager
      - call: POST /sugarhouse/sap-runs
        payload:
          sugarbush_id: ${bush_id}
          weather_window_id: ${win_id}
          collected_by: ${tapper_id}
          gallons_collected: 60.0
