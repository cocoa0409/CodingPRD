scenario: "IRS Tax Installment Agreement: taxpayer debt, installment types (Short/Long/PPIA), automatic debit (DDIA), CSED statute of limitations, Offer in Compromise, Lien release, Currently Not Collectible"
domain_name: irs-tax-installment-agreement
api_prefix: /collections

complexity_profile:
  primary_archetype: Compliance / audit
  secondary_archetype: Ledger reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by foreign keys. TaxAccount is the hub; TaxPeriod,
  # InstallmentAgreement, OfferInCompromise, FederalTaxLien, Payment, CncDetermination,
  # and AccountEvent are peers referencing it (and each other) by FK — no nested URL paths.

  state_machine_shape: branching
  # InstallmentAgreement: PROPOSED -> {APPROVED|REJECTED}; APPROVED can DEFAULT then
  # be REINSTATED (revert) — fork-join + revision loop. OfferInCompromise has its own
  # branching accept/reject. Distinct branches carry divergent side-effect sets.

  complexity_layers_note: >
    Temporal-overlap is genuine here, not decorative: CSED suspension intervals on a
    TaxPeriod (half-open, adjacency-allowed) and InstallmentAgreement active windows on
    a TaxAccount (closed with a mandatory buffer gap) are two distinct interval
    geometries on two distinct resource entities.

  relationship_patterns:
    - one_to_many        # TaxAccount has many TaxPeriod, Payment, AccountEvent; TaxPeriod has many CsedSuspension
    - cross_aggregate    # InstallmentAgreement.tax_account_id, FederalTaxLien.tax_account_id

  role_model: segregation_of_duties
  # RevenueOfficer proposes/approves field actions; CaseReviewer independently approves
  # OIC and lien release; the same operator cannot both propose and approve an OIC.

  consistency_model: immediate
  # All cascades (CSED suspension, balance recompute, lien release on payoff) settle
  # atomically inside the triggering request.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: TaxAccount
    parent: null
    common_fields: true
    fields:
      - name: taxpayer_name
        type: string
        source: input
        description: Legal name of the taxpayer.
        constraints: non-empty
      - name: tin
        type: string
        source: input
        description: Taxpayer identification number; unique across all TaxAccount rows.
        constraints: 9 digits; unique
      - name: filing_status
        type: enum
        source: input
        description: "Filing status."
        constraints: one of {INDIVIDUAL, BUSINESS}
      - name: monthly_disposable_income_cents
        type: integer
        source: input
        description: Reported monthly disposable income (income minus allowable living expenses), in cents.
        constraints: ">= 0"
      - name: collection_status
        type: enum
        source: computed
        description: >
          Derived posture of the account, recomputed on every event/transition.
          ACTIVE_COLLECTION when no protective hold; IN_AGREEMENT when an APPROVED
          InstallmentAgreement exists; CNC when an active CncDetermination exists;
          OIC_PENDING when an OfferInCompromise is in SUBMITTED/EVALUATING; RESOLVED
          when total_balance_cents == 0.
        constraints: one of {ACTIVE_COLLECTION, IN_AGREEMENT, CNC, OIC_PENDING, RESOLVED}
      - name: total_balance_cents
        type: integer
        source: computed
        description: >
          Sum of balance_due_cents over all TaxPeriod whose period_status IN
          {ASSESSED, IN_COLLECTION}. Recomputed whenever any child TaxPeriod balance
          changes. See calculations.account_total_balance.
        constraints: ">= 0"
      - name: csed_protection_count
        type: integer
        source: computed
        description: >
          Count of currently-open CSED suspension intervals across this account's
          TaxPeriods (a TaxPeriod with a suspension whose end is null). Used to
          surface whether the statute clock is paused.
        default: 0

  - name: TaxPeriod
    parent: null
    common_fields: true
    fields:
      - name: tax_account_id
        type: string
        source: input
        description: FK -> TaxAccount.id; the account this assessed period belongs to.
      - name: tax_year
        type: integer
        source: input
        description: Calendar tax year of the assessment.
        constraints: 2000..2099
      - name: assessed_tax_cents
        type: integer
        source: input
        description: Original assessed tax for the period, in cents.
        constraints: "> 0"
      - name: assessment_date
        type: datetime
        source: input
        description: Date the tax was assessed; the CSED 10-year clock starts here.
      - name: csed_date
        type: datetime
        source: computed
        description: >
          Collection Statute Expiration Date = assessment_date + 10 years (3653 days,
          accounting for 2 leap days in a 10-year window) PLUS the sum of all closed
          CSED suspension day-counts on this period. See calculations.csed_date.
      - name: penalty_accrued_cents
        type: integer
        source: computed
        description: >
          Accrued failure-to-pay penalty, in cents. See calculations.accrued_penalty
          (dual-variant: standard 0.5%/mo vs DDIA-reduced 0.25%/mo).
        default: 0
      - name: interest_accrued_cents
        type: integer
        source: computed
        description: Accrued interest, in cents. See calculations.accrued_interest.
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: >
          assessed_tax_cents - paid_to_principal_cents + penalty_accrued_cents +
          interest_accrued_cents, floored at 0. See calculations.period_balance_due.
        default: 0
      - name: paid_to_principal_cents
        type: integer
        source: computed
        description: Cumulative principal applied to this period from posted Payments.
        default: 0
      - name: period_status
        type: enum
        source: computed
        description: >
          ASSESSED on creation; IN_COLLECTION once linked to an APPROVED agreement or
          first payment posts; SATISFIED when balance_due_cents reaches 0; WRITTEN_OFF
          when its csed_date has passed and the period is swept by CSED expiration;
          ABATED when reduced to 0 by an accepted OIC.
        constraints: one of {ASSESSED, IN_COLLECTION, SATISFIED, WRITTEN_OFF, ABATED}

  - name: CsedSuspension
    parent: null
    common_fields: true
    fields:
      - name: tax_period_id
        type: string
        source: input
        description: FK -> TaxPeriod.id; the period whose statute clock this interval pauses.
      - name: reason
        type: enum
        source: input
        description: "Why the statute clock is suspended."
        constraints: one of {AGREEMENT_PENDING, OIC_EVALUATION, MANUAL}
      - name: start_at
        type: datetime
        source: input
        description: Inclusive start of the suspension interval (half-open [start_at, end_at)).
      - name: end_at
        type: datetime
        source: computed
        description: >
          Exclusive end of the interval; null while the suspension is open. Set when the
          interval is closed (agreement approved/defaulted, OIC decided). Adjacency is
          allowed: a new interval whose start_at equals a prior interval's end_at does
          NOT overlap.
        default: null
      - name: days_counted
        type: integer
        source: computed
        description: "(end_at - start_at) in whole days; 0 while open. Added to TaxPeriod.csed_date when closed."
        default: 0

  - name: InstallmentAgreement
    parent: null
    common_fields: true
    fields:
      - name: tax_account_id
        type: string
        source: input
        description: FK -> TaxAccount.id; the account entering the agreement.
      - name: active_from
        type: datetime
        source: input
        description: >
          Inclusive start of the agreement's active window on the account (closed
          interval). Two agreements' recorded windows (status IN {APPROVED, REINSTATED,
          DEFAULTED}) on the same account must be separated by at least
          AGREEMENT_BUFFER_DAYS = 30; touching or overlapping windows are rejected
          (closed-interval-with-buffer semantics, distinct from CsedSuspension's
          half-open adjacency-allowed geometry).
      - name: active_to
        type: datetime
        source: input
        description: Inclusive end of the agreement's active window on the account (closed interval).
      - name: agreement_type
        type: enum
        source: input
        description: >
          SHORT_TERM (full pay within 180 days, no setup fee, not a true installment
          for fee purposes); LONG_TERM (monthly installments); PPIA (Partial Payment
          Installment Agreement, monthly amount below full-payoff schedule).
        constraints: one of {SHORT_TERM, LONG_TERM, PPIA}
      - name: payment_method
        type: enum
        source: input
        description: >
          DIRECT_DEBIT enables DDIA (reduced penalty rate + reduced setup fee); MANUAL
          uses taxpayer-initiated payments at the standard rate.
        constraints: one of {DIRECT_DEBIT, MANUAL}
      - name: monthly_payment_cents
        type: integer
        source: input
        description: Proposed monthly payment amount, in cents.
        constraints: "> 0"
      - name: setup_fee_cents
        type: integer
        source: computed
        description: >
          Setup fee determined at APPROVE time from agreement_type + payment_method +
          low_income_flag. See calculations.setup_fee.
        default: 0
      - name: low_income_flag
        type: boolean
        source: input
        description: >
          Whether the taxpayer is certified low-income (waives/reduces setup fee per
          calculations.setup_fee).
        default: false
      - name: term_months
        type: integer
        source: input
        description: Number of monthly installments proposed (ignored for SHORT_TERM).
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: >
          PROPOSED on creation; APPROVED on approve; REJECTED on reject; DEFAULTED when
          a scheduled debit is missed; REINSTATED after curing a default; CLOSED when
          the account is fully paid or superseded.
        constraints: one of {PROPOSED, APPROVED, REJECTED, DEFAULTED, REINSTATED, CLOSED}
      - name: approved_by_user_id
        type: string
        source: system
        description: Opaque RevenueOfficer X-User-ID recorded at approval; null until approved.
      - name: missed_debit_count
        type: integer
        source: computed
        description: >
          Number of missed DDIA debits recorded. A default fires when this reaches
          MISSED_DEBIT_DEFAULT_THRESHOLD = 2; the first missed debit keeps the agreement
          in force (status REINSTATED), the second defaults it.
        default: 0

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - name: tax_account_id
        type: string
        source: input
        description: FK -> TaxAccount.id; the account credited.
      - name: tax_period_id
        type: string
        source: input
        description: >
          FK -> TaxPeriod.id; the period this payment is applied to. Optional on the
          request — when omitted the server allocates across periods by oldest
          assessment_date first (see calculations.payment_allocation).
        constraints: optional
      - name: amount_cents
        type: integer
        source: input
        description: Payment amount, in cents.
        constraints: "> 0"
      - name: payment_source
        type: enum
        source: input
        description: "How the payment arrived."
        constraints: one of {DDIA_DEBIT, MANUAL, OIC_LUMP_SUM}
      - name: posted_at
        type: datetime
        source: system
        description: Server timestamp the payment posted; used as the chronological allocation key tiebreak.

  - name: OfferInCompromise
    parent: null
    common_fields: true
    fields:
      - name: tax_account_id
        type: string
        source: input
        description: FK -> TaxAccount.id; the account submitting the offer.
      - name: offer_amount_cents
        type: integer
        source: input
        description: Lump-sum amount the taxpayer offers to settle the full liability.
        constraints: "> 0"
      - name: rcp_cents
        type: integer
        source: computed
        description: >
          Reasonable Collection Potential = net_realizable_equity_cents +
          (monthly_disposable_income_cents * future_income_multiplier). Computed at
          submission. See calculations.reasonable_collection_potential.
      - name: net_realizable_equity_cents
        type: integer
        source: input
        description: Quick-sale value of assets minus encumbrances, in cents.
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: >
          SUBMITTED on creation; EVALUATING once RCP is computed and review begins;
          ACCEPTED when approved by a CaseReviewer (different operator than submitter);
          REJECTED when offer_amount_cents < rcp_cents or reviewer declines;
          DEFAULTED if post-acceptance terms are breached.
        constraints: one of {SUBMITTED, EVALUATING, ACCEPTED, REJECTED, DEFAULTED}
      - name: submitted_by_user_id
        type: string
        source: system
        description: Opaque RevenueOfficer X-User-ID who submitted; segregation-of-duties anchor.
      - name: accepted_by_user_id
        type: string
        source: system
        description: Opaque CaseReviewer X-User-ID who accepted; must differ from submitted_by_user_id.

  - name: FederalTaxLien
    parent: null
    common_fields: true
    fields:
      - name: tax_account_id
        type: string
        source: input
        description: FK -> TaxAccount.id; the account encumbered.
      - name: filed_amount_cents
        type: integer
        source: input
        description: Liability amount stated on the filed lien, in cents.
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: >
          FILED on creation; RELEASE_PENDING once a release is requested; RELEASED when
          a CaseReviewer approves the release (allowed only when account balance is 0 or
          an agreement/CNC protects it per validations); WITHDRAWN when rescinded as
          erroneously filed.
        constraints: one of {FILED, RELEASE_PENDING, RELEASED, WITHDRAWN}
      - name: released_at
        type: datetime
        source: system
        description: Server timestamp of release; null until RELEASED.

  - name: CncDetermination
    parent: null
    common_fields: true
    fields:
      - name: tax_account_id
        type: string
        source: input
        description: FK -> TaxAccount.id; the account placed in Currently Not Collectible.
      - name: hardship_reason
        type: enum
        source: input
        description: "Basis for CNC status."
        constraints: one of {NO_DISPOSABLE_INCOME, HARDSHIP, UNABLE_TO_LOCATE}
      - name: status
        type: enum
        source: computed
        description: >
          ACTIVE on creation (CSED clock keeps running but collection actions pause);
          REVOKED when the account's disposable income recovers and an officer resumes
          collection.
        constraints: one of {ACTIVE, REVOKED}

  - name: AccountEvent
    parent: null
    common_fields: false
    fields:
      - name: tax_account_id
        type: string
        source: input
        description: FK -> TaxAccount.id; the account this event belongs to.
      - name: event_type
        type: enum
        source: input
        description: "Append-only audit event kind."
        constraints: one of {CSED_SUSPEND_START, CSED_SUSPEND_END, AGREEMENT_DEFAULT, RECOMPUTE, MISSED_DEBIT, OIC_DECISION}
      - name: tax_period_id
        type: string
        source: input
        description: >
          FK -> TaxPeriod.id; the period affected by a CSED suspension event. Optional;
          null for account-wide events.
        constraints: optional
      - name: suspension_days
        type: integer
        source: system
        description: For CSED_SUSPEND_END events, the number of days the closed interval added to csed_date.
        default: 0

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: InstallmentAgreement
    initial_state: PROPOSED
    terminal_states: [REJECTED, CLOSED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /collections/installment-agreements/{id}/approve"
        actor: RevenueOfficer
        preconditions:
          - "agreement.status == PROPOSED"
          - "the TaxAccount has no other InstallmentAgreement whose status IN {APPROVED, REINSTATED}"
          - "the TaxAccount has no OfferInCompromise whose status IN {SUBMITTED, EVALUATING, ACCEPTED}"
          - "for SHORT_TERM: monthly_payment_cents * term_months >= TaxAccount.total_balance_cents (full payoff) AND term_months <= SHORT_TERM_MAX_MONTHS (6)"
          - "for LONG_TERM: monthly_payment_cents * term_months >= TaxAccount.total_balance_cents (full payoff over term)"
          - "for PPIA: monthly_payment_cents * term_months < TaxAccount.total_balance_cents (partial by design)"
          - "[active_from, active_to] is >= AGREEMENT_BUFFER_DAYS away from every other {APPROVED, REINSTATED} agreement window on the account"
        side_effects:
          - "compute setup_fee_cents via calculations.setup_fee and store on the agreement"
          - "set approved_by_user_id = X-User-ID"
          - "set every ASSESSED TaxPeriod on the account to IN_COLLECTION"
          - "open a CSED suspension interval on every IN_COLLECTION TaxPeriod (append AccountEvent CSED_SUSPEND_START); increment TaxAccount.csed_protection_count by the number opened"
          - "if payment_method == DIRECT_DEBIT, re-accrue penalty at the DDIA-reduced 0.25%/mo rate going forward (calculations.accrued_penalty variant ddia_reduced)"
          - "recompute TaxAccount.collection_status -> IN_AGREEMENT; recompute total_balance_cents"
          - "increments InstallmentAgreement.version by 1"
        note: "Approving a DIRECT_DEBIT agreement is the DDIA path; it both pauses CSED and lowers the penalty rate."
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /collections/installment-agreements/{id}/reject"
        actor: RevenueOfficer
        preconditions:
          - "agreement.status == PROPOSED"
        side_effects:
          - "no TaxPeriod or CSED change"
          - "recompute TaxAccount.collection_status"
          - "increments InstallmentAgreement.version by 1"
      - from: APPROVED
        to: DEFAULTED
        trigger: "POST /collections/installment-agreements/{id}/record-missed-debit (when missed_debit_count reaches MISSED_DEBIT_DEFAULT_THRESHOLD)"
        actor: system
        preconditions:
          - "agreement.status IN {APPROVED, REINSTATED}"
          - "agreement.payment_method == DIRECT_DEBIT"
          - "missed_debit_count + 1 >= MISSED_DEBIT_DEFAULT_THRESHOLD"
        side_effects:
          - "increment missed_debit_count by 1; append AccountEvent MISSED_DEBIT"
          - "close the CSED suspension interval on every IN_COLLECTION TaxPeriod (append AccountEvent CSED_SUSPEND_END with suspension_days); add those days to each period's csed_date; decrement TaxAccount.csed_protection_count to 0"
          - "re-accrue penalty at the standard 0.5%/mo rate going forward (calculations.accrued_penalty variant standard) and recompute balances"
          - "recompute TaxAccount.collection_status -> ACTIVE_COLLECTION"
          - "increments InstallmentAgreement.version by 1"
        note: "CSED suspension end is a transitive cascade: agreement default -> period CSED interval closes -> period csed_date extends -> account csed_protection_count drops."
      - from: APPROVED
        to: REINSTATED
        trigger: "POST /collections/installment-agreements/{id}/record-missed-debit (below threshold)"
        actor: system
        preconditions:
          - "agreement.status IN {APPROVED, REINSTATED}"
          - "agreement.payment_method == DIRECT_DEBIT"
          - "missed_debit_count + 1 < MISSED_DEBIT_DEFAULT_THRESHOLD"
        side_effects:
          - "increment missed_debit_count by 1; append AccountEvent MISSED_DEBIT"
          - "no CSED change; agreement remains protective"
          - "increments InstallmentAgreement.version by 1"
        note: "Below the threshold the agreement stays in force (modeled as REINSTATED-from-warning); it is the revision loop, distinct from the DEFAULTED branch."
      - from: REINSTATED
        to: DEFAULTED
        trigger: "POST /collections/installment-agreements/{id}/record-missed-debit (when cumulative missed reaches threshold)"
        actor: system
        preconditions:
          - "agreement.status == REINSTATED"
          - "missed_debit_count + 1 >= MISSED_DEBIT_DEFAULT_THRESHOLD"
        side_effects:
          - "same CSED-close + standard-rate cascade as the APPROVED->DEFAULTED transition"
          - "increments InstallmentAgreement.version by 1"
      - from: APPROVED
        to: CLOSED
        trigger: "system event: TaxAccount.total_balance_cents reaches 0 after a Payment posts"
        actor: system
        preconditions:
          - "agreement.status IN {APPROVED, REINSTATED}"
          - "TaxAccount.total_balance_cents == 0"
        side_effects:
          - "close any open CSED suspension intervals (append CSED_SUSPEND_END, extend csed_date, zero csed_protection_count)"
          - "recompute TaxAccount.collection_status -> RESOLVED"
          - "increments InstallmentAgreement.version by 1"

  - entity: OfferInCompromise
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED, DEFAULTED]
    transitions:
      - from: SUBMITTED
        to: EVALUATING
        trigger: "POST /collections/offers/{id}/begin-evaluation"
        actor: CaseReviewer
        preconditions:
          - "offer.status == SUBMITTED"
        side_effects:
          - "compute rcp_cents via calculations.reasonable_collection_potential"
          - "open a CSED suspension interval on every TaxPeriod IN {ASSESSED, IN_COLLECTION} (append CSED_SUSPEND_START); increment TaxAccount.csed_protection_count"
          - "recompute TaxAccount.collection_status -> OIC_PENDING"
          - "increments OfferInCompromise.version by 1"
      - from: EVALUATING
        to: ACCEPTED
        trigger: "POST /collections/offers/{id}/accept"
        actor: CaseReviewer
        preconditions:
          - "offer.status == EVALUATING"
          - "offer_amount_cents >= rcp_cents"
          - "X-User-ID != submitted_by_user_id (segregation of duties)"
        side_effects:
          - "set accepted_by_user_id = X-User-ID"
          - "create a Payment of offer_amount_cents with payment_source OIC_LUMP_SUM allocated oldest-first"
          - "set every non-SATISFIED TaxPeriod on the account to ABATED and zero its balance_due_cents"
          - "close all open CSED suspension intervals (append CSED_SUSPEND_END, extend csed_date)"
          - "recompute TaxAccount.collection_status -> RESOLVED; total_balance_cents -> 0"
          - "append AccountEvent OIC_DECISION"
          - "increments OfferInCompromise.version by 1"
        note: "Accept is a depth-3 cascade: accept -> Payment posted + periods ABATED -> account balance recompute to 0 -> any APPROVED agreement auto-CLOSES."
      - from: EVALUATING
        to: REJECTED
        trigger: "POST /collections/offers/{id}/reject"
        actor: CaseReviewer
        preconditions:
          - "offer.status == EVALUATING"
        side_effects:
          - "close all open CSED suspension intervals (append CSED_SUSPEND_END, extend csed_date, decrement csed_protection_count)"
          - "recompute TaxAccount.collection_status -> ACTIVE_COLLECTION"
          - "append AccountEvent OIC_DECISION"
          - "increments OfferInCompromise.version by 1"
        note: "Compensation: the CSED days suspended during evaluation are added back to each period's csed_date, leaving the statute-day ledger conserved (calculations.csed_date)."

  - entity: FederalTaxLien
    initial_state: FILED
    terminal_states: [RELEASED, WITHDRAWN]
    transitions:
      - from: FILED
        to: RELEASE_PENDING
        trigger: "POST /collections/liens/{id}/request-release"
        actor: RevenueOfficer
        preconditions:
          - "lien.status == FILED"
        side_effects:
          - "increments FederalTaxLien.version by 1"
      - from: RELEASE_PENDING
        to: RELEASED
        trigger: "POST /collections/liens/{id}/approve-release"
        actor: CaseReviewer
        preconditions:
          - "lien.status == RELEASE_PENDING"
          - "TaxAccount.total_balance_cents == 0 OR the account has an InstallmentAgreement whose status IN {APPROVED, REINSTATED} with payment_method DIRECT_DEBIT"
        side_effects:
          - "set released_at = server time"
          - "increments FederalTaxLien.version by 1"
        note: "Cross-entity guard: lien release validity depends on TaxAccount balance OR an active DDIA agreement state."
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /collections/liens/{id}/withdraw"
        actor: CaseReviewer
        preconditions:
          - "lien.status == FILED"
        side_effects:
          - "increments FederalTaxLien.version by 1"

  - entity: CsedSuspension
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /collections/csed-suspensions/{id}/close"
        actor: RevenueOfficer
        preconditions:
          - "suspension.end_at is null (still open)"
          - "end_at >= start_at"
        side_effects:
          - "set end_at; days_counted = (end_at - start_at) in whole days"
          - "add days_counted to the linked TaxPeriod.csed_date (calculations.csed_date)"
          - "decrement TaxAccount.csed_protection_count by 1"
          - "increments CsedSuspension.version by 1"
        note: "Conserved-day invariant: the days a suspension added while open are folded into csed_date exactly once on close, leaving total statute days = base + sum(all closed days_counted)."

  - entity: TaxPeriod
    initial_state: ASSESSED
    terminal_states: [SATISFIED, WRITTEN_OFF, ABATED]
    transitions:
      - from: ASSESSED
        to: IN_COLLECTION
        trigger: "system: agreement approved OR first Payment posts to the period"
        actor: system
        preconditions:
          - "period.period_status == ASSESSED"
        side_effects:
          - "recompute balance_due_cents (calculations.period_balance_due)"
      - from: IN_COLLECTION
        to: SATISFIED
        trigger: "system: balance_due_cents reaches 0 after a Payment posts"
        actor: system
        preconditions:
          - "period.balance_due_cents == 0"
        side_effects:
          - "bubble up: recompute TaxAccount.total_balance_cents and collection_status"
      - from: IN_COLLECTION
        to: WRITTEN_OFF
        trigger: "POST /collections/tax-accounts/{id}/sweep-expired-csed"
        actor: system
        preconditions:
          - "period.csed_date <= current_utc"
          - "period.balance_due_cents > 0"
        side_effects:
          - "zero balance_due_cents; bubble up to recompute TaxAccount.total_balance_cents and collection_status"
        note: "CSED expiration write-off: collection rights lapse once the (possibly suspension-extended) statute date passes."

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: agreement-approve-stale-account
    parent_entity: TaxAccount
    write_endpoint: "POST /collections/installment-agreements/{id}/approve"
    occ_field: "expected_tax_account_version"
    description: |
      Approving an InstallmentAgreement against a TaxAccount whose version has
      advanced since the officer last observed it is rejected. This captures the
      case where another approval has already taken effect on the account (which
      legitimately supersedes the prior posture by flipping periods to
      IN_COLLECTION and opening CSED suspensions), so the current officer's view
      of the account — and of which periods are still ASSESSED — is stale.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
  - rule_id: oic-accept-stale-account
    parent_entity: TaxAccount
    write_endpoint: "POST /collections/offers/{id}/accept"
    occ_field: "expected_tax_account_version"
    description: |
      Accepting an OfferInCompromise against a TaxAccount whose version has
      advanced since the reviewer last read it is rejected. A prior posting or
      abatement may have already changed total_balance_cents and the set of
      non-SATISFIED periods, so the reviewer's settlement view is stale.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: accrued_penalty
    trigger: "On agreement approve/default and on POST /collections/tax-accounts/{id}/recompute"
    algorithm: threshold
    formula: |
      months_elapsed = full calendar months from assessment_date to current_utc (floor)
      rate = STANDARD_FTP_RATE                       # 0.005 per month, default
      if account has an InstallmentAgreement with payment_method==DIRECT_DEBIT
         and status IN {APPROVED, REINSTATED}:
        rate = DDIA_FTP_RATE                          # 0.0025 per month
      # penalty accrues on the ORIGINAL assessed tax (not on running balance),
      # computed per-month then summed (round each month to whole cents, then sum):
      penalty_accrued_cents = 0
      for m in 1..months_elapsed:
        penalty_accrued_cents += round_half_up(assessed_tax_cents * rate)
    input_set: "Per TaxPeriod; rate selected by the account's active agreement payment_method+status."
    constants:
      STANDARD_FTP_RATE: 0.005
      DDIA_FTP_RATE: 0.0025
    precision: "round each monthly penalty to whole cents (round_half_up), then sum"
    variants:
      - name: standard
        when: "No active DIRECT_DEBIT agreement (MANUAL, defaulted, or no agreement)"
        difference: "rate = 0.005/month"
      - name: ddia_reduced
        when: "Active DIRECT_DEBIT agreement in {APPROVED, REINSTATED}"
        difference: "rate = 0.0025/month — half the standard rate; this is the DDIA benefit"

  - name: reasonable_collection_potential
    trigger: "On POST /collections/offers/{id}/begin-evaluation"
    algorithm: weighted_scoring
    formula: |
      # RCP = net realizable equity + future income component.
      # Future-income multiplier is TIERED on remaining CSED months (the shortest
      # remaining statute across the account's IN_COLLECTION/ASSESSED periods):
      remaining_months = floor(min over periods of (csed_date - current_utc) in days / 30)
      if remaining_months <= 0:        multiplier = 0
      elif remaining_months <= 24:     multiplier = 12     # short-statute lump-sum factor
      elif remaining_months <= 60:     multiplier = 24
      else:                            multiplier = 60     # capped at 5 years of income
      future_income_cents = monthly_disposable_income_cents * multiplier
      rcp_cents = net_realizable_equity_cents + future_income_cents
    input_set: "OfferInCompromise.net_realizable_equity_cents + TaxAccount.monthly_disposable_income_cents, tiered by remaining CSED months."
    constants:
      MULT_SHORT: 12
      MULT_MID: 24
      MULT_LONG: 60
    precision: "integer cents; no rounding needed (integer inputs)"
    variants:
      - name: rcp_evaluation
        when: "At begin-evaluation"
        difference: "single mode; tier selected by remaining_months bands"

  - name: setup_fee
    trigger: "On POST /collections/installment-agreements/{id}/approve"
    algorithm: tiered_pricing
    formula: |
      if low_income_flag == true:
        setup_fee_cents = 0                      # low-income waiver (full)
      elif agreement_type == SHORT_TERM:
        setup_fee_cents = 0                      # no fee for short-term full-pay
      elif payment_method == DIRECT_DEBIT:
        setup_fee_cents = DDIA_SETUP_FEE_CENTS   # 3100 (reduced online DDIA fee)
      else:
        setup_fee_cents = MANUAL_SETUP_FEE_CENTS # 14900 (standard non-DDIA fee)
    input_set: "Single InstallmentAgreement; branches on low_income_flag, agreement_type, payment_method."
    constants:
      DDIA_SETUP_FEE_CENTS: 3100
      MANUAL_SETUP_FEE_CENTS: 14900
    precision: "whole cents; no rounding"
    variants:
      - name: standard_fee
        when: "agreement_type != SHORT_TERM, not low-income"
        difference: "DDIA 3100 vs MANUAL 14900"
      - name: waived_fee
        when: "low_income_flag OR SHORT_TERM"
        difference: "fee = 0"

  - name: csed_date
    trigger: "On TaxPeriod creation and on every CSED_SUSPEND_END event"
    algorithm: aggregation
    formula: |
      base_csed = assessment_date + 3653 days     # 10 years incl. 2 leap days
      suspended_days = sum of suspension_days over all CSED_SUSPEND_END AccountEvents
                       for this tax_period_id (closed intervals only; open intervals
                       contribute 0 until closed)
      csed_date = base_csed + suspended_days days
    input_set: "Per TaxPeriod; sum of closed CSED suspension intervals (event-sourced from AccountEvent)."
    constants:
      CSED_BASE_DAYS: 3653
    precision: "whole days; date arithmetic in UTC"
    variants:
      - name: csed_computation
        when: "always"
        difference: "single mode; conserved-day invariant — every suspended day is added back exactly once"

  - name: payment_allocation
    trigger: "On POST /collections/payments"
    algorithm: waterfall_allocation
    formula: |
      if tax_period_id supplied: target that single period.
      else: order target periods by assessment_date ASC, tiebreak created_at ASC
            (NEVER by id), filtered to period_status IN {ASSESSED, IN_COLLECTION}.
      remaining = amount_cents
      for period in ordered target list:
        # within a period, apply to penalty first, then interest, then principal
        # (IRS designated-payment default is taxpayer-favorable principal-last):
        applied = min(remaining, period.balance_due_cents)
        reduce balance_due_cents by applied; increase paid_to_principal_cents by the
          portion of `applied` exceeding (penalty_accrued_cents + interest_accrued_cents)
        remaining -= applied
        if remaining == 0: break
      # overpayment beyond total balance is held as an unapplied credit (remaining > 0)
    input_set: "Periods with status IN {ASSESSED, IN_COLLECTION}, oldest assessment_date first."
    constants: {}
    precision: "whole cents; no rounding (integer cents throughout)"
    variants:
      - name: targeted
        when: "tax_period_id supplied"
        difference: "single-period application"
      - name: oldest_first_waterfall
        when: "tax_period_id omitted"
        difference: "oldest assessment_date first, created_at tiebreak"

  - name: account_total_balance
    trigger: "On any TaxPeriod balance change (payment, approve, default, recompute, sweep, abate)"
    algorithm: aggregation
    formula: |
      total_balance_cents = sum of balance_due_cents over TaxPeriod where
        period_status IN {ASSESSED, IN_COLLECTION}
      # SATISFIED, WRITTEN_OFF, ABATED periods contribute 0
    input_set: "TaxPeriod with status IN {ASSESSED, IN_COLLECTION}."
    constants: {}
    precision: "whole cents"
    variants:
      - name: total_balance
        when: "always"
        difference: "single mode"

  - name: period_balance_due
    trigger: "On recompute, payment, penalty/interest re-accrual"
    algorithm: aggregation
    formula: |
      gross = assessed_tax_cents + penalty_accrued_cents + interest_accrued_cents
      balance_due_cents = max(0, gross - paid_to_principal_cents - applied_penalty_paid - applied_interest_paid)
      # for the benchmark, payments reduce balance_due_cents directly via
      # payment_allocation; this formula re-derives it on a full recompute.
    input_set: "Single TaxPeriod."
    constants: {}
    precision: "whole cents; floor at 0"
    variants:
      - name: balance_due
        when: "always"
        difference: "single mode; floored at 0"

  - name: accrued_interest
    trigger: "On recompute and on penalty re-accrual"
    algorithm: aggregation
    formula: |
      months_elapsed = full calendar months from assessment_date to current_utc (floor)
      # simple monthly interest on assessed tax at the federal short-term rate:
      interest_accrued_cents = round_half_up(
        assessed_tax_cents * MONTHLY_INTEREST_RATE * months_elapsed)
    input_set: "Per TaxPeriod."
    constants:
      MONTHLY_INTEREST_RATE: 0.006
    precision: "round_half_up once after multiplying (sum-then-round)"
    variants:
      - name: interest
        when: "always"
        difference: "single mode; sum-then-round (contrast accrued_penalty which rounds-per-month-then-sums)"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "All path/body referenced resources exist (TaxAccount, TaxPeriod, InstallmentAgreement, OfferInCompromise, FederalTaxLien, CncDetermination), validated left-to-right"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: business_referential
    check: "Body FK fields reference resources belonging to the same TaxAccount (e.g., Payment.tax_period_id belongs to Payment.tax_account_id)"
    error_id: ERR_FK_MISMATCH
    http_status: 409
    applies_to: "POST /collections/payments, POST /collections/account-events"
  - priority: 5
    category: business_constraint
    check: "TaxAccount.tin is unique across all accounts (9-digit numeric)"
    error_id: ERR_DUPLICATE_TIN
    http_status: 409
    applies_to: "POST /collections/tax-accounts"
  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (approve/reject/begin-evaluation/accept/reject/request-release/approve-release/withdraw/record-missed-debit)"
  - priority: 7
    category: business_constraint
    check: "OIC accept: X-User-ID must differ from OfferInCompromise.submitted_by_user_id (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /collections/offers/{id}/accept"
  - priority: 8
    category: business_constraint
    check: "Agreement approve: the TaxAccount has no other InstallmentAgreement in {APPROVED, REINSTATED} and no OfferInCompromise in {SUBMITTED, EVALUATING, ACCEPTED}"
    error_id: ERR_CONFLICTING_RESOLUTION
    http_status: 409
    applies_to: "POST /collections/installment-agreements/{id}/approve"
  - priority: 9
    category: business_temporal
    check: >
      Agreement approve window-overlap: the proposed [active_from, active_to] closed
      interval must be separated by at least AGREEMENT_BUFFER_DAYS (30) from the recorded
      window of every other InstallmentAgreement on the same account whose status IN
      {APPROVED, REINSTATED, DEFAULTED} (a defaulted agreement's window remains a recorded
      statute occupation). Touching, overlapping, or within-buffer windows are rejected
      (closed-interval-with-buffer geometry).
    error_id: ERR_AGREEMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /collections/installment-agreements/{id}/approve"
  - priority: 10
    category: business_constraint
    check: >
      Agreement approve payoff-shape: SHORT_TERM and LONG_TERM require
      monthly_payment_cents * term_months >= TaxAccount.total_balance_cents;
      PPIA requires monthly_payment_cents * term_months < TaxAccount.total_balance_cents.
    error_id: ERR_PAYOFF_SHAPE_INVALID
    http_status: 422
    applies_to: "POST /collections/installment-agreements/{id}/approve"
  - priority: 11
    category: business_temporal
    check: "SHORT_TERM agreements require term_months <= SHORT_TERM_MAX_MONTHS (6)"
    error_id: ERR_SHORT_TERM_TOO_LONG
    http_status: 422
    applies_to: "POST /collections/installment-agreements/{id}/approve"
  - priority: 12
    category: business_temporal
    check: >
      CsedSuspension create overlap: a new interval's [start_at, end_at) must not
      overlap any OPEN interval (end_at null) on the same TaxPeriod. Half-open
      semantics — a new start_at equal to a closed interval's end_at is adjacency,
      NOT overlap, and is allowed.
    error_id: ERR_OVERLAPPING_SUSPENSION
    http_status: 409
    applies_to: "POST /collections/csed-suspensions"
  - priority: 13
    category: business_fiscal
    check: "OIC accept: offer_amount_cents must be >= rcp_cents (computed at begin-evaluation)"
    error_id: ERR_OFFER_BELOW_RCP
    http_status: 422
    applies_to: "POST /collections/offers/{id}/accept"
  - priority: 14
    category: business_constraint
    check: >
      Lien approve-release: TaxAccount.total_balance_cents == 0 OR account has an
      InstallmentAgreement in {APPROVED, REINSTATED} with payment_method DIRECT_DEBIT.
    error_id: ERR_LIEN_RELEASE_BLOCKED
    http_status: 409
    applies_to: "POST /collections/liens/{id}/approve-release"
  - priority: 15
    category: business_temporal
    check: "sweep-expired-csed only writes off periods whose csed_date <= current_utc and balance_due_cents > 0; with no such period it returns ERR_NOTHING_TO_SWEEP"
    error_id: ERR_NOTHING_TO_SWEEP
    http_status: 422
    applies_to: "POST /collections/tax-accounts/{id}/sweep-expired-csed"
  - priority: 16
    category: business_constraint
    check: "OCC: expected_tax_account_version must equal TaxAccount.version for approve/accept write endpoints"
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /collections/installment-agreements/{id}/approve, POST /collections/offers/{id}/accept"
  - priority: 17
    category: business_constraint
    check: "Request body required fields present and well-typed; enums in allowed set; cents fields integers within declared bounds"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- TaxAccount ----
  - method: POST
    path: "/collections/tax-accounts"
    description: "Create a taxpayer account."
    roles: [RevenueOfficer]
    code: 201
    input: [taxpayer_name, tin, filing_status, monthly_disposable_income_cents]
    output: TaxAccount
    side_effects: ["collection_status initialized to ACTIVE_COLLECTION", "total_balance_cents = 0"]
  - method: GET
    path: "/collections/tax-accounts/{id}"
    description: "Fetch a tax account with computed posture and balances."
    roles: [RevenueOfficer, CaseReviewer]
    code: 200
    input: []
    output: TaxAccount
    side_effects: []
  - method: GET
    path: "/collections/tax-accounts"
    description: "List tax accounts (paginated)."
    roles: [RevenueOfficer, CaseReviewer]
    code: 200
    input: ["limit?", "offset?", "collection_status?"]
    output: TaxAccount[]
    side_effects: []
  - method: POST
    path: "/collections/tax-accounts/{id}/recompute"
    description: "Recompute all penalty/interest/balances for the account's periods and roll up totals."
    roles: [RevenueOfficer]
    code: 200
    input: []
    output: TaxAccount
    side_effects: ["recompute accrued_penalty + accrued_interest + period_balance_due per period", "recompute account_total_balance and collection_status", "append AccountEvent RECOMPUTE"]
  - method: POST
    path: "/collections/tax-accounts/{id}/sweep-expired-csed"
    description: "Write off every IN_COLLECTION period whose csed_date has passed."
    roles: [RevenueOfficer]
    code: 200
    input: []
    output: TaxAccount
    side_effects: ["set qualifying periods to WRITTEN_OFF and zero their balance", "recompute account_total_balance and collection_status"]

  # ---- TaxPeriod ----
  - method: POST
    path: "/collections/tax-periods"
    description: "Add an assessed tax period to an account."
    roles: [RevenueOfficer]
    code: 201
    input: [tax_account_id, tax_year, assessed_tax_cents, assessment_date]
    output: TaxPeriod
    side_effects: ["compute csed_date = assessment_date + 3653 days", "period_status = ASSESSED", "balance_due_cents = assessed_tax_cents", "recompute account_total_balance"]
  - method: GET
    path: "/collections/tax-periods/{id}"
    description: "Fetch a tax period."
    roles: [RevenueOfficer, CaseReviewer]
    code: 200
    input: []
    output: TaxPeriod
    side_effects: []
  - method: GET
    path: "/collections/tax-periods"
    description: "List tax periods, filterable by account."
    roles: [RevenueOfficer, CaseReviewer]
    code: 200
    input: ["tax_account_id?", "limit?", "offset?"]
    output: TaxPeriod[]
    side_effects: []

  # ---- CsedSuspension (statute-clock intervals) ----
  - method: POST
    path: "/collections/csed-suspensions"
    description: "Open a CSED suspension interval on a period (rejected if it overlaps an open one)."
    roles: [RevenueOfficer]
    code: 201
    input: [tax_period_id, reason, start_at]
    output: CsedSuspension
    side_effects: ["end_at = null (open)", "days_counted = 0", "increment TaxAccount.csed_protection_count by 1"]
  - method: POST
    path: "/collections/csed-suspensions/{id}/close"
    description: "Close an open suspension interval, fixing end_at and folding days into csed_date."
    roles: [RevenueOfficer]
    code: 200
    input: [end_at]
    output: CsedSuspension
    side_effects: ["set end_at; days_counted = (end_at - start_at) days", "add days_counted to TaxPeriod.csed_date", "decrement TaxAccount.csed_protection_count by 1", "increments CsedSuspension.version by 1"]
  - method: GET
    path: "/collections/csed-suspensions/{id}"
    description: "Fetch a CSED suspension interval."
    roles: [RevenueOfficer, CaseReviewer]
    code: 200
    input: []
    output: CsedSuspension
    side_effects: []
  - method: GET
    path: "/collections/csed-suspensions"
    description: "List CSED suspension intervals, filterable by period."
    roles: [RevenueOfficer, CaseReviewer]
    code: 200
    input: ["tax_period_id?", "limit?", "offset?"]
    output: CsedSuspension[]
    side_effects: []

  # ---- InstallmentAgreement ----
  - method: POST
    path: "/collections/installment-agreements"
    description: "Propose an installment agreement for an account."
    roles: [RevenueOfficer]
    code: 201
    input: [tax_account_id, agreement_type, payment_method, monthly_payment_cents, term_months, active_from, active_to, "low_income_flag?"]
    output: InstallmentAgreement
    side_effects: ["status = PROPOSED"]
  - method: GET
    path: "/collections/installment-agreements/{id}"
    description: "Fetch an installment agreement."
    roles: [RevenueOfficer, CaseReviewer]
    code: 200
    input: []
    output: InstallmentAgreement
    side_effects: []
  - method: GET
    path: "/collections/installment-agreements"
    description: "List installment agreements, filterable by account."
    roles: [RevenueOfficer, CaseReviewer]
    code: 200
    input: ["tax_account_id?", "limit?", "offset?"]
    output: InstallmentAgreement[]
    side_effects: []
  - method: POST
    path: "/collections/installment-agreements/{id}/approve"
    description: "Approve a proposed agreement (DDIA path when DIRECT_DEBIT)."
    roles: [RevenueOfficer]
    code: 200
    input: [expected_tax_account_version]
    output: InstallmentAgreement
    side_effects: ["compute setup_fee", "periods ASSESSED->IN_COLLECTION", "open CSED suspensions; csed_protection_count up", "DDIA penalty re-accrual if DIRECT_DEBIT", "collection_status -> IN_AGREEMENT", "increments TaxAccount.version by 1", "increments InstallmentAgreement.version by 1"]
  - method: POST
    path: "/collections/installment-agreements/{id}/reject"
    description: "Reject a proposed agreement."
    roles: [RevenueOfficer]
    code: 200
    input: []
    output: InstallmentAgreement
    side_effects: ["status -> REJECTED", "recompute collection_status", "increments InstallmentAgreement.version by 1"]
  - method: POST
    path: "/collections/installment-agreements/{id}/record-missed-debit"
    description: "Record a missed DDIA debit; defaults the agreement at the threshold, else keeps it in force."
    roles: [RevenueOfficer]
    code: 200
    input: []
    output: InstallmentAgreement
    side_effects: ["missed_debit_count up; append MISSED_DEBIT", "at threshold: DEFAULTED + close CSED suspensions + standard-rate re-accrual + collection_status ACTIVE_COLLECTION", "below threshold: stays in force (REINSTATED)", "increments InstallmentAgreement.version by 1"]

  # ---- Payment ----
  - method: POST
    path: "/collections/payments"
    description: "Post a payment; allocates oldest-first unless tax_period_id is supplied."
    roles: [RevenueOfficer]
    code: 201
    input: [tax_account_id, amount_cents, payment_source, "tax_period_id?"]
    output: Payment
    side_effects: ["payment_allocation reduces period balances", "periods may transition to SATISFIED (bubble up)", "recompute account_total_balance + collection_status", "if balance reaches 0, active agreement auto-CLOSES"]
  - method: GET
    path: "/collections/payments/{id}"
    description: "Fetch a payment."
    roles: [RevenueOfficer, CaseReviewer]
    code: 200
    input: []
    output: Payment
    side_effects: []
  - method: GET
    path: "/collections/payments"
    description: "List payments, filterable by account or period."
    roles: [RevenueOfficer, CaseReviewer]
    code: 200
    input: ["tax_account_id?", "tax_period_id?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  # ---- OfferInCompromise ----
  - method: POST
    path: "/collections/offers"
    description: "Submit an Offer in Compromise."
    roles: [RevenueOfficer]
    code: 201
    input: [tax_account_id, offer_amount_cents, net_realizable_equity_cents]
    output: OfferInCompromise
    side_effects: ["status = SUBMITTED", "record submitted_by_user_id = X-User-ID"]
  - method: GET
    path: "/collections/offers/{id}"
    description: "Fetch an offer."
    roles: [RevenueOfficer, CaseReviewer]
    code: 200
    input: []
    output: OfferInCompromise
    side_effects: []
  - method: GET
    path: "/collections/offers"
    description: "List offers, filterable by account."
    roles: [RevenueOfficer, CaseReviewer]
    code: 200
    input: ["tax_account_id?", "limit?", "offset?"]
    output: OfferInCompromise[]
    side_effects: []
  - method: POST
    path: "/collections/offers/{id}/begin-evaluation"
    description: "Begin evaluation; computes RCP and opens CSED suspensions."
    roles: [CaseReviewer]
    code: 200
    input: []
    output: OfferInCompromise
    side_effects: ["compute reasonable_collection_potential -> rcp_cents", "open CSED suspensions; csed_protection_count up", "collection_status -> OIC_PENDING", "increments OfferInCompromise.version by 1"]
  - method: POST
    path: "/collections/offers/{id}/accept"
    description: "Accept the offer (must differ from submitter; offer >= RCP)."
    roles: [CaseReviewer]
    code: 200
    input: [expected_tax_account_version]
    output: OfferInCompromise
    side_effects: ["record accepted_by_user_id", "create OIC_LUMP_SUM Payment", "non-SATISFIED periods -> ABATED", "close CSED suspensions", "collection_status -> RESOLVED; total 0", "active agreement auto-CLOSES", "increments TaxAccount.version by 1", "increments OfferInCompromise.version by 1"]
  - method: POST
    path: "/collections/offers/{id}/reject"
    description: "Reject the offer; closes CSED suspensions (compensating)."
    roles: [CaseReviewer]
    code: 200
    input: []
    output: OfferInCompromise
    side_effects: ["close CSED suspensions (extend csed_date)", "collection_status -> ACTIVE_COLLECTION", "increments OfferInCompromise.version by 1"]

  # ---- FederalTaxLien ----
  - method: POST
    path: "/collections/liens"
    description: "File a federal tax lien against an account."
    roles: [RevenueOfficer]
    code: 201
    input: [tax_account_id, filed_amount_cents]
    output: FederalTaxLien
    side_effects: ["status = FILED"]
  - method: GET
    path: "/collections/liens/{id}"
    description: "Fetch a lien."
    roles: [RevenueOfficer, CaseReviewer]
    code: 200
    input: []
    output: FederalTaxLien
    side_effects: []
  - method: GET
    path: "/collections/liens"
    description: "List liens, filterable by account."
    roles: [RevenueOfficer, CaseReviewer]
    code: 200
    input: ["tax_account_id?", "limit?", "offset?"]
    output: FederalTaxLien[]
    side_effects: []
  - method: POST
    path: "/collections/liens/{id}/request-release"
    description: "Request release of a filed lien."
    roles: [RevenueOfficer]
    code: 200
    input: []
    output: FederalTaxLien
    side_effects: ["status -> RELEASE_PENDING", "increments FederalTaxLien.version by 1"]
  - method: POST
    path: "/collections/liens/{id}/approve-release"
    description: "Approve a pending release (balance 0 or active DDIA agreement)."
    roles: [CaseReviewer]
    code: 200
    input: []
    output: FederalTaxLien
    side_effects: ["set released_at", "status -> RELEASED", "increments FederalTaxLien.version by 1"]
  - method: POST
    path: "/collections/liens/{id}/withdraw"
    description: "Withdraw an erroneously filed lien."
    roles: [CaseReviewer]
    code: 200
    input: []
    output: FederalTaxLien
    side_effects: ["status -> WITHDRAWN", "increments FederalTaxLien.version by 1"]

  # ---- CncDetermination ----
  - method: POST
    path: "/collections/cnc-determinations"
    description: "Place an account in Currently Not Collectible status."
    roles: [RevenueOfficer]
    code: 201
    input: [tax_account_id, hardship_reason]
    output: CncDetermination
    side_effects: ["status = ACTIVE", "recompute collection_status -> CNC"]
  - method: GET
    path: "/collections/cnc-determinations/{id}"
    description: "Fetch a CNC determination."
    roles: [RevenueOfficer, CaseReviewer]
    code: 200
    input: []
    output: CncDetermination
    side_effects: []
  - method: GET
    path: "/collections/cnc-determinations"
    description: "List CNC determinations, filterable by account."
    roles: [RevenueOfficer, CaseReviewer]
    code: 200
    input: ["tax_account_id?", "limit?", "offset?"]
    output: CncDetermination[]
    side_effects: []
  - method: POST
    path: "/collections/cnc-determinations/{id}/revoke"
    description: "Revoke CNC and resume collection."
    roles: [RevenueOfficer]
    code: 200
    input: []
    output: CncDetermination
    side_effects: ["status -> REVOKED", "recompute collection_status -> ACTIVE_COLLECTION"]

  # ---- AccountEvent (audit, reverse-reachability) ----
  - method: POST
    path: "/collections/account-events"
    description: "Append an audit event (also used to inject CSED suspension intervals for testing)."
    roles: [RevenueOfficer]
    code: 201
    input: [tax_account_id, event_type, "tax_period_id?"]
    output: AccountEvent
    side_effects: ["append-only event row"]
  - method: GET
    path: "/collections/account-events/{id}"
    description: "Fetch a single account event."
    roles: [RevenueOfficer, CaseReviewer]
    code: 200
    input: []
    output: AccountEvent
    side_effects: []
  - method: GET
    path: "/collections/account-events"
    description: "List account events, filterable by account or period."
    roles: [RevenueOfficer, CaseReviewer]
    code: 200
    input: ["tax_account_id?", "tax_period_id?", "limit?", "offset?"]
    output: AccountEvent[]
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's current UTC clock for deterministic CSED/penalty/interest tests."
    roles: [RevenueOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["server clock advances to the supplied instant"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers, or unknown role."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this operation."
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A referenced TaxAccount/TaxPeriod/InstallmentAgreement/OfferInCompromise/FederalTaxLien/CncDetermination does not exist."
  - id: ERR_FK_MISMATCH
    http: 409
    condition: "A body FK references a resource not belonging to the named TaxAccount (e.g., tax_period_id of a different account)."
  - id: ERR_DUPLICATE_TIN
    http: 409
    condition: "Creating a TaxAccount with a tin already in use."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current state."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "OIC accept attempted by the same X-User-ID that submitted the offer."
  - id: ERR_CONFLICTING_RESOLUTION
    http: 409
    condition: "Agreement approve while another active agreement or an open/accepted OIC exists on the account."
  - id: ERR_PAYOFF_SHAPE_INVALID
    http: 422
    condition: "Agreement monthly_payment*term_months violates the payoff shape required by its agreement_type."
  - id: ERR_SHORT_TERM_TOO_LONG
    http: 422
    condition: "SHORT_TERM agreement with term_months > 6."
  - id: ERR_AGREEMENT_WINDOW_OVERLAP
    http: 409
    condition: "Agreement approve where the active window is within AGREEMENT_BUFFER_DAYS of another active agreement's window on the account."
  - id: ERR_OVERLAPPING_SUSPENSION
    http: 409
    condition: "CsedSuspension create whose [start_at,end_at) overlaps an open suspension interval on the same period."
  - id: ERR_OFFER_BELOW_RCP
    http: 422
    condition: "OIC accept where offer_amount_cents < rcp_cents."
  - id: ERR_LIEN_RELEASE_BLOCKED
    http: 409
    condition: "Lien approve-release while balance > 0 and no active DDIA agreement."
  - id: ERR_NOTHING_TO_SWEEP
    http: 422
    condition: "sweep-expired-csed found no period with csed_date <= now and balance > 0."
  - id: ERR_STALE_ACCOUNT_VERSION
    http: 412
    condition: "expected_tax_account_version does not match TaxAccount.version on approve/accept."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing/mistyped required field, bad enum, out-of-range cents value, or malformed body."

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: RevenueOfficer
    description: "Field officer who creates accounts/periods, proposes & approves agreements, posts payments, files liens, requests releases, submits offers, sets CNC."
    identity: opaque
    exclusive_operations:
      - "POST /collections/tax-accounts"
      - "POST /collections/tax-periods"
      - "POST /collections/installment-agreements (+ approve/reject/record-missed-debit)"
      - "POST /collections/csed-suspensions (+ close)"
      - "POST /collections/payments"
      - "POST /collections/offers (submit)"
      - "POST /collections/liens (file) + request-release"
      - "POST /collections/cnc-determinations (+ revoke)"
      - "POST /collections/tax-accounts/{id}/recompute + sweep-expired-csed"
      - "POST /collections/account-events"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET reads"
  - name: CaseReviewer
    description: "Independent reviewer who evaluates/accepts/rejects OICs and approves/withdraws lien releases; cannot create accounts/periods/payments or approve agreements."
    identity: opaque
    exclusive_operations:
      - "POST /collections/offers/{id}/begin-evaluation"
      - "POST /collections/offers/{id}/accept"
      - "POST /collections/offers/{id}/reject"
      - "POST /collections/liens/{id}/approve-release"
      - "POST /collections/liens/{id}/withdraw"
    shared_operations:
      - "all GET reads"
