              payload: { features: [{ feature_type: "JUMP", size_class: "L" }, { feature_type: "JUMP", size_class: "M" }, { feature_type: "RAIL", size_class: "M" }, { feature_type: "RAIL", size_class: "S" }, { feature_type: "JIB", size_class: "S" }] }
              as: GroomingLead
            - call: "POST /mountain-ops/terrain-areas/${area_id}/park-inspection"
              payload: { inspection_note: "halfpipes removed, re-walked" }
              as: Patroller
              as_user_id: "${p1_id}"
            - call: "POST /mountain-ops/terrain-areas/${area_id}/opening-decision"
              payload: { decision: "OPEN", note: "first tracks" }
              as: MountainOpsDirector
          assert:
            - "Trigger 1: HTTP 200; park_state 'PARK_CLOSED', park_feature_count 0, park_risk_score 0.0, park_inspected_by_user_id null."
            - "Trigger 2: opening_state == 'PATROL_HOLD' - tearing down the park under an OPEN area drops it to a hold rather than leaving it open."
            - "Trigger 3: HTTP 422 with data.error_id == 'ERR_PARK_NOT_INSPECTED' - PARK_CLOSED is not PARK_INSPECTED, and priority 30 is satisfied at risk 0.0."
            - "Trigger 4: HTTP 200 with park_state 'PARK_BUILT', park_feature_count 7 and park_risk_score 84.0 (70.0 * 1.2) - a build is never rejected for being risky."
            - "Trigger 5: HTTP 422 with data.error_id == 'ERR_PARK_NOT_INSPECTED' - both park gates are now violated at once and the lower priority number wins."
            - "Trigger 6: HTTP 200 with park_state == 'PARK_INSPECTED'; the area stays 'PATROL_HOLD' because an inspection never reopens terrain."
            - "Trigger 7: HTTP 422 with data.error_id == 'ERR_PARK_RISK_TOO_HIGH' - the inspection gate now passes, so the next gate in the ladder surfaces."
            - "Trigger 8-10: the teardown-rebuild-inspect cycle returns park_risk_score to 34.0 with park_state 'PARK_INSPECTED'."
            - "Trigger 11: HTTP 200 with opening_state == 'OPEN'."
            - "Every rejection left the area in PATROL_HOLD, so no partial cascade ran."

      - name: a_session_create_on_a_held_area_outranks_the_water_right_check
        claim_type: priority_conflict
        grounds:
          - validations[priority=12]
          - validations[priority=44]
          - errors[ERR_TERRAIN_STATE_INVALID]
          - errors[ERR_WATER_RIGHT_EXCEEDED]
        excluded_because:
          difficulty_instance: session_create_terrain_state_beats_water_right_exceeded
          rationale: "The section 1.8 priority-conflict instance constructs a single request that violates both rules at once and asserts ERR_TERRAIN_STATE_INVALID plus an unchanged season water ledger, then flips one input so the fiscal rule surfaces alone. A corner test could add nothing to that pairing."

      - name: grooming_dispatch_reports_the_sequence_violation_before_the_snowcat_conflict
        claim_type: priority_conflict
        grounds:
          - validations[priority=40]
          - validations[priority=41]
          - errors[ERR_GROOM_SEQUENCE_VIOLATION]
          - errors[ERR_SNOWCAT_CONFLICT]
        excluded_because:
          difficulty_instance: grooming_dispatch_sequence_violation_beats_snowcat_conflict
          rationale: "The section 1.8 instance builds one dispatch that is simultaneously out of cat-route sequence and overlapping a DISPATCHED peer on the same snowcat, asserts the priority 40 error, then cures the sequence and asserts the priority 41 error on the identical call."

      - name: starting_a_session_requires_an_online_pump_house
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=35]
          - errors[ERR_PUMP_HOUSE_OFFLINE]
        excluded_because:
          difficulty_instance: session_start_requires_pump_house_online
          rationale: "The section 1.8 cross-entity instance takes the pump house to MAINTENANCE after the session is created, asserts ERR_PUMP_HOUSE_OFFLINE on the start, brings it back ONLINE and asserts the same start succeeds with the session state and the season ledger both intact."

      - name: the_operator_turnaround_buffer_rejects_strictly_disjoint_shifts
        claim_type: temporal_validation
        grounds:
          - validations[priority=39]
          - errors[ERR_OPERATOR_DOUBLE_BOOKED]
          - entities.LiftStaffAssignment.fields.shift_start
        excluded_because:
          difficulty_instance: operator_turnaround_buffer_rejects_thirty_minute_gap_on_lift_staff_assignment
          rationale: "The section 1.8 instance already tests the 15 minute gap rejection and the exactly-30-minute acceptance on a role that keeps priority 38 satisfied, so both the rule and its boundary are pinned."

      - name: an_opening_decision_below_the_base_depth_minimum_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=25]
          - errors[ERR_BASE_DEPTH_INSUFFICIENT]
        excluded_because:
          difficulty_instance: base_depth_policy_variant_divergence_on_terrain_area
          rationale: "The section 1.8 dual-variant instance drives the same reading set to a passing decision under MEAN_OF_STAKES and to ERR_BASE_DEPTH_INSUFFICIENT under MIN_OF_STAKES, so the violation and the satisfaction of priority 25 are both covered there."

