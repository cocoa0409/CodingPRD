            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/activate", as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: WaterRightsAnalyst, captures: {st: "$.data.id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v1: "$.data.version"}}
            - {call: "POST /hcu-studies/${st}/certify", payload: {expected_water_right_version: "${wr_v1}"}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 100.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst, captures: {app: "$.data.id"}}
            - {call: "POST /transfer-applications/${app}/injury-analyses", payload: {method: SEASONAL_AVERAGE, pod_move_miles: 0.00}, as: WaterRightsAnalyst}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v2: "$.data.version"}}
            - {call: "POST /transfer-applications/${app}/submit", payload: {expected_water_right_version: "${wr_v2}"}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications/${app}/publish", as: WaterRightsAnalyst}
          trigger:
            - {call: "POST /protests", payload: {transfer_application_id: "${app}", protestant_claimant_id: "${cl_a}", claimed_injury_af: 10.00, basis: INJURY_TO_SENIOR_RIGHT}, as: Claimant, as_user_id: "${cl_a}", captures: {err: "$.data.error_id"}}
            - {call: "POST /protests", payload: {transfer_application_id: "${app}", protestant_claimant_id: "${cl_b}", claimed_injury_af: 10.00, basis: INJURY_TO_SENIOR_RIGHT}, as: Claimant, as_user_id: "${cl_b}", captures: {pr_b: "$.data.id"}}
          assert:
            - "Self-filing: HTTP 422 with error_id ERR_SELF_PROTEST_FORBIDDEN."
            - "ERR_NOT_RESOURCE_OWNER (403) must NOT be returned — the caller is the named protestant, so the priority-5 check is satisfied."
            - "No Protest row is created by the rejected call and the application stays PROTEST_PERIOD with unresolved_protest_count 0."
            - "Claimant B's identical filing: HTTP 201, status FILED, and unresolved_protest_count becomes 1 with the application moving PROTEST_PERIOD -> UNDER_PROTEST."

      - name: err_self_objection_forbidden_claimant_cannot_object_to_own_claim
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SELF_OBJECTION_FORBIDDEN]
          - validations[priority=40]
          - validations[priority=5]
        distinguishing_aspect: >-
          Objections invert the ownership convention: the objector must NOT own the
          claimed right, so the owner's objection is rejected at priority 40 while
          a stranger's identical call succeeds — the only endpoint in the API where
          being the resource owner is disqualifying.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; claimant A's right WR-2198-001 with a METER record; docket SNK-ADJ-09 (deadline 2026-04-01T00:00:00Z) carrying A's claim, examined, with the docket advanced to OBJECTION_PERIOD; claimant B is unrelated."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /claimants", payload: {legal_name: "Bell Cattle Trust", contact_email: "b@bell.example", entity_type: INDIVIDUAL}, as: WaterRightsAnalyst, captures: {cl_b: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /decree-dockets", payload: {basin_code: "SNK", docket_number: "SNK-ADJ-09", claim_filing_deadline: "2026-04-01T00:00:00Z"}, as: BasinAdjudicator, captures: {dk: "$.data.id"}}
            - {call: "POST /adjudication-claims", payload: {decree_docket_id: "${dk}", water_right_id: "${wr}", claimed_priority_date: "1901-05-01T00:00:00Z", claimed_af: 100.00}, as: Claimant, as_user_id: "${cl_a}", captures: {cm: "$.data.id"}}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-04-02T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /decree-dockets/${dk}/advance-phase", payload: {target_phase: EXAMINATION}, as: BasinAdjudicator}
            - {call: "POST /adjudication-claims/${cm}/examine", payload: {examiner_recommended_af: 90.00, examination_note: "Survey supports 90.00 AF."}, as: BasinAdjudicator}
            - {call: "POST /decree-dockets/${dk}/advance-phase", payload: {target_phase: OBJECTION_PERIOD}, as: BasinAdjudicator}
          trigger:
            - {call: "POST /adjudication-claims/${cm}/object", payload: {objection_basis: "QUANTITY", objection_note: "Owner objecting to their own examined claim."}, as: Claimant, as_user_id: "${cl_a}", captures: {err: "$.data.error_id"}}
            - {call: "POST /adjudication-claims/${cm}/object", payload: {objection_basis: "QUANTITY", objection_note: "Downstream senior disputes the quantity."}, as: Claimant, as_user_id: "${cl_b}"}
          assert:
            - "Owner's objection: HTTP 422 with error_id ERR_SELF_OBJECTION_FORBIDDEN; filing_status stays EXAMINED, objection_count stays 0 and the claim's version does not move."
            - "ERR_NOT_RESOURCE_OWNER must NOT be returned for the stranger's call — objections are deliberately outside the priority-5 ownership rule."
            - "Claimant B's identical objection: HTTP 200, filing_status EXAMINED -> OBJECTED and objection_count 1, which will later drive the 0.9 objection haircut."

      - name: err_right_not_bank_enrolled_blocks_the_deposit
        claim_type: violation_to_error
        grounds:
          - errors[ERR_RIGHT_NOT_BANK_ENROLLED]
          - validations[priority=44]
          - entities.WaterRight.bank_enrolled
        distinguishing_aspect: >-
          Enrollment is an opt-in flag that defaults to false, so a fully certified
          right with 195.00 AF of transferable volume still cannot fund a deposit.
          The rejection is on enrollment (priority 44), not on volume (priority 45):
          the same call for the same 10.00 AF succeeds on an enrolled right.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; claimant A holds WR-2198-001 (bank_enrolled omitted, so false) and WR-2198-002 (bank_enrolled true), both certified at 195.00 AF; account ACC exists for claimant A in basin SNK with 0.00 credit."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr1: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-002", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000, bank_enrolled: true}, as: WaterRightsAnalyst, captures: {wr2: "$.data.id"}}
            - {call: "POST /water-rights/${wr1}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr1}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr1}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr1}/activate", as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr1}/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: WaterRightsAnalyst, captures: {st1: "$.data.id"}}
            - {call: "GET /water-rights/${wr1}", as: WaterRightsAnalyst, captures: {wr1_v: "$.data.version"}}
            - {call: "POST /hcu-studies/${st1}/certify", payload: {expected_water_right_version: "${wr1_v}"}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr2}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr2}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr2}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr2}/activate", as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr2}/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: WaterRightsAnalyst, captures: {st2: "$.data.id"}}
            - {call: "GET /water-rights/${wr2}", as: WaterRightsAnalyst, captures: {wr2_v: "$.data.version"}}
            - {call: "POST /hcu-studies/${st2}/certify", payload: {expected_water_right_version: "${wr2_v}"}, as: WaterRightsAnalyst}
            - {call: "POST /water-bank-accounts", payload: {claimant_id: "${cl_a}", basin_code: "SNK"}, as: WaterRightsAnalyst, captures: {acc: "$.data.id"}}
            - {call: "GET /water-bank-accounts/${acc}", as: WaterRightsAnalyst, captures: {acc_v: "$.data.version"}}
          trigger:
            - {call: "POST /water-bank-accounts/${acc}/deposits", payload: {water_right_id: "${wr1}", deposit_af: 10.00, expected_water_bank_account_version: "${acc_v}"}, as: WaterRightsAnalyst, captures: {err: "$.data.error_id"}}
            - {call: "POST /water-bank-accounts/${acc}/deposits", payload: {water_right_id: "${wr2}", deposit_af: 10.00, expected_water_bank_account_version: "${acc_v}"}, as: WaterRightsAnalyst}
          assert:
            - "Unenrolled right: HTTP 422 with error_id ERR_RIGHT_NOT_BANK_ENROLLED."
            - "ERR_TRANSFERABLE_VOLUME_EXCEEDED must NOT be returned — 10.00 AF is well inside the right's 195.00 AF, so the failure is enrollment and nothing else."
            - "Nothing moved on the rejected call: WR-2198-001 keeps transferable_af 195.00 / encumbered_af 0.00, the account keeps deposited_credit_af 0.00 / available_credit_af 0.00, and neither version advanced (the same ${acc_v} is still current, which is why the next call can reuse it)."
            - "Enrolled right: HTTP 200 with deposited_credit_af 10.00 and available_credit_af 10.00; WR-2198-002 becomes transferable_af 185.00 / encumbered_af 10.00 and status ACTIVE -> ENCUMBERED."
            - "Posture flips with the deposit: the empty account was RESTRICTED on the low-credit trigger (available_credit_af 0.00 < 5.00) and becomes OPEN once available_credit_af reaches 10.00, the holder being IN_GOOD_STANDING with no suspended leases."

      - name: err_offset_exceeds_claim_bounds_the_negotiated_stipulation_on_both_ends
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OFFSET_EXCEEDS_CLAIM]
          - validations[priority=48]
          - calculations.injury_net_analysis
        distinguishing_aspect: >-
          The bound is two-sided and both ends map to the SAME error id: 10.01 AF
          against a 10.00 AF claim is rejected as excessive and 0.00 AF is rejected
          as non-positive, while exactly 10.00 AF is accepted. A one-sided upper
          bound would wrongly let a zero-value stipulation close a protest.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; claimant A's certified right with a published 100.00 AF application (SEASONAL_AVERAGE gross 78.00); claimant B's protest for 10.00 AF routed to NEGOTIATION."
