          amount_cents: 900000
          covered_employment: false
        as: Employer
      - call: POST /ssa/claims
        payload:
          worker_id: ${wn1}
          claim_type: RETIREMENT
          entitlement_month: 2026-06
        as: Claimant
        as_user_id: ${wn1}
        captures:
          cn1: $.data.id
      trigger:
      - call: POST /ssa/claims/${cn1}/approve
        payload: {}
        as: ClaimsSpecialist
      - call: GET /ssa/workers/${wn1}/earnings-years
        payload: {}
        as: ClaimsSpecialist
      assert:
      - 'EarningsYear(${wn1}, 2023): posted_earnings_cents == 0, noncovered_earnings_cents == 900000'
      - BenefitClaim.${cn1}.aime_cents == 0 and pia_cents == 0
  - name: batch_rerun_same_month_is_idempotent
    claim_type: bulk_action
    grounds:
    - endpoints[POST /_batch/run-monthly-cycle]
    distinguishing_aspect: 'Re-running an already-run month is an idempotent no-op: already_run true, zero counts, and the claim''s payment list
      is unchanged.'
    test_recipe:
      setup:
      - Worker wn2 (3 years) ENTITLED 2026-06; batch 2026-10 already ran once (payments_created 1)
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Idempotent
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wn2: $.data.id
          wn2_ver: $.data.version
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wn2}
          employer_name: Acme Corp
          tax_year: 2021
          amount_cents: 1875000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wn2}
          employer_name: Acme Corp
          tax_year: 2022
          amount_cents: 1900000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wn2}
          employer_name: Acme Corp
          tax_year: 2023
          amount_cents: 1925000
        as: Employer
      - call: POST /ssa/claims
        payload:
          worker_id: ${wn2}
          claim_type: RETIREMENT
          entitlement_month: 2026-06
        as: Claimant
        as_user_id: ${wn2}
        captures:
          cn2: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-10-05T00:00:00Z'
        as: ProgramAdministrator
      - call: POST /ssa/claims/${cn2}/approve
        payload: {}
        as: ClaimsSpecialist
      - call: POST /_batch/run-monthly-cycle
        payload:
          run_month: 2026-10
        as: ProgramAdministrator
        captures:
          first_n: $.data.payments_created
      trigger:
      - call: POST /_batch/run-monthly-cycle
        payload:
          run_month: 2026-10
        as: ProgramAdministrator
        captures:
          second_n: $.data.payments_created
          rerun: $.data.already_run
      - call: GET /ssa/claims/${cn2}/payments
        payload: {}
        as: ClaimsSpecialist
      assert:
      - 'First run: payments_created == 1, already_run == false'
      - 'Second run: already_run == true, payments_created == 0'
      - GET payments still returns exactly 1 row for month 2026-10
  - name: conditional_action_spousal_approve
    claim_type: conditional_action
    grounds:
    - endpoints[POST /ssa/claims/{id}/approve]
    excluded_because:
      difficulty_instance: spousal_approve_gated_on_relationship_and_covered_worker
      rationale: The conditional-approval paths for auxiliary claims are asserted in the named §1.8 instance.
