# =============================================================================
# Medicaid Eligibility & Annual Redetermination — Scaffold Difficulty Design
# (§1.8 Test Targeting Index, cross-referencing §1.1–§1.7 of SCAFFOLD.yaml
#  against the nine Difficulty Rules in §0.5 of the scaffold-generator skill)
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # (≥2 instances, different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: magi_federal_vs_state_disregard
        grounds:
          - calculations.magi_per_applicant
          - calculations.household_fpl_percent
          - entities.Application.fields.rule_variant
          - entities.StatePolicy.fields.state_disregard_amount
        distinguishing_aspect: |
          Operates on the Applicant/Household income domain. Two variants
          (standard_magi when rule_variant=FEDERAL vs state_adjusted_magi when
          rule_variant=STATE) consume the IDENTICAL IncomeRecord set and
          produce DIFFERENT Application.snapshot_fpl_percent values because
          the STATE variant subtracts StatePolicy.state_disregard_amount.
        test_recipe:
          setup:
            - "POST /state-policies {state_code:CA, fpl_year:2025, fpl_base_amount:15000, fpl_per_member_amount:5000, magi_income_limit_pct:99.0, state_disregard_amount:2000, state_exempt_asset_types:[]}"
            - "POST /households {state_code:CA, address_line:..., filing_status:SINGLE} as IntakeWorker"
            - "POST /households/{hid}/applicants twice with dependent_status=PRIMARY and dependent_status=SPOUSE; no pregnant"
            - "POST income WAGES 15000 ANNUAL on applicant 1; WAGES 5000 ANNUAL on applicant 2"
            - "POST two Applications on the same household: app_FED with rule_variant=FEDERAL, app_STATE with rule_variant=STATE"
          trigger:
            - "POST /households/{hid}/applications/{app_FED}/submit"
            - "POST /households/{hid}/applications/{app_STATE}/submit"
          assert:
            - "Application(app_FED).snapshot_magi == 20000.00"
            - "Application(app_FED).snapshot_fpl_percent == 100.00"
            - "Application(app_STATE).snapshot_magi == 18000.00"
            - "Application(app_STATE).snapshot_fpl_percent == 90.00"
            - "POST /households/{hid}/applications/{app_FED}/decide with decision=APPROVE returns ERR_NOT_ELIGIBLE (100.00 > 99.0)"
            - "POST /households/{hid}/applications/{app_STATE}/decide with decision=APPROVE succeeds (90.00 <= 99.0)"

      - name: asset_federal_vs_state_exempt_set
        grounds:
          - calculations.countable_asset_value
          - entities.AssetRecord.fields.exempt_under_federal
          - entities.AssetRecord.fields.exempt_under_state
          - entities.StatePolicy.fields.state_exempt_asset_types
          - entities.Application.fields.snapshot_countable_assets
        distinguishing_aspect: |
          Operates on a DIFFERENT entity domain (Applicant.AssetRecord) from
          the MAGI calculation. The federal_exempt_set variant excludes only
          {PRIMARY_RESIDENCE, RETIREMENT, LIFE_INSURANCE}, while the
          state_exempt_set variant additionally excludes asset_types listed
          in StatePolicy.state_exempt_asset_types; identical AssetRecord rows
          yield different Application.snapshot_countable_assets.
        test_recipe:
          setup:
            - "POST /state-policies {state_code:NY, fpl_year:2025, fpl_base_amount:15000, fpl_per_member_amount:5000, magi_income_limit_pct:138.0, asset_test_applies:true, asset_limit_per_member:10000, state_exempt_asset_types:[VEHICLE]}"
            - "POST /households {state_code:NY, filing_status:SINGLE} as IntakeWorker; POST one applicant dependent_status=PRIMARY is_disabled=true"
            - "POST assets: PRIMARY_RESIDENCE 100000, VEHICLE 20000, CHECKING 5000 on the applicant"
            - "POST two Applications: app_FED with rule_variant=FEDERAL program=NON_MAGI_DISABILITY, app_STATE with rule_variant=STATE program=NON_MAGI_DISABILITY"
          trigger:
            - "POST /households/{hid}/applications/{app_FED}/submit"
            - "POST /households/{hid}/applications/{app_STATE}/submit"
          assert:
            - "Application(app_FED).snapshot_countable_assets == 25000.00  # VEHICLE counts under FEDERAL"
            - "Application(app_STATE).snapshot_countable_assets == 5000.00  # VEHICLE state-exempt"
            - "POST /households/{hid}/applications/{app_FED}/decide with decision=APPROVE returns ERR_NOT_ELIGIBLE (25000 > 10000*1)"
            - "POST /households/{hid}/applications/{app_STATE}/decide with decision=APPROVE succeeds (5000 <= 10000*1)"

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # (≥2 instances, must fall in different modes among (a) nonlinear ≥3 inputs,
  #  (b) nested-rounding order, (c) circular evaluation order)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: magi_per_applicant_conditional_inputs   # mode (a)
        grounds:
          - calculations.magi_per_applicant
          - entities.IncomeRecord.fields.source_type
          - entities.IncomeRecord.fields.frequency
          - entities.Applicant.fields.dependent_status
        distinguishing_aspect: |
          Mode (a): the formula combines ≥3 inputs (source_type, frequency,
          dependent_status) with non-linear conditional inclusion —
          SOCIAL_SECURITY is countable iff dependent_status==PRIMARY;
          CHILD_SUPPORT / TANF / SSI are always excluded; frequency drives
          a non-linear multiplier (12, 26, 52). Identical raw amounts
          across the same source_types produce different magi_income totals
          depending on dependent_status.
        test_recipe:
          setup:
            - "Configure StatePolicy and Household as in magi_federal_vs_state_disregard"
            - "POST Applicant A1 dependent_status=PRIMARY; POST Applicant A2 dependent_status=DEPENDENT"
            - "POST IncomeRecords on EACH applicant: WAGES 1000 MONTHLY, SOCIAL_SECURITY 500 MONTHLY, CHILD_SUPPORT 200 MONTHLY"
          trigger:
            - "GET /households/{hid}/applicants/{a1_id}"
            - "GET /households/{hid}/applicants/{a2_id}"
          assert:
            - "Applicant(A1).magi_income == 18000.00  # 12000 wages + 6000 SS"
            - "Applicant(A2).magi_income == 12000.00  # 12000 wages only; SS excluded for non-PRIMARY"
            - "Applicants differ by 6000.00 despite identical IncomeRecord inputs"

      - name: redetermination_premium_round_order_pinned   # mode (b)
        grounds:
          - calculations.enrollment_redetermination_premium
          - entities.Redetermination.fields.new_snapshot_fpl_percent
          - entities.Applicant.fields.date_of_birth
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The scaffold PINS
          'round per-member to 2 decimals HALF_UP, then sum' over the
          alternative 'sum exact-precision per-member values then round
          once'. For two applicants aged 30 with new_snapshot_fpl_percent=133,
          per_member_exact = 1.24 * 0.33 * 30.00 = 12.276; rounded
          per-member = 12.28 each; pinned total = 24.56. The sum-then-round
          alternative yields 24.55 — a 1-cent divergence that pins the
          axis distinct from mode (a).
        test_recipe:
          setup:
            - "POST /state-policies {state_code:TX, fpl_year:2025, fpl_base_amount:15000, fpl_per_member_amount:5000, magi_income_limit_pct:138.0}"
            - "POST household + 2 applicants both date_of_birth set so age==30 at clock_now"
            - "POST /_clock/advance so age computation yields 30 for both"
            - "Run a full APPROVE flow producing 1 Enrollment per applicant; advance clock to redetermination_due_at; POST /_sweep/redeterminations"
            - "Resulting Redetermination is PENDING and tied to the household enrollment"
          trigger:
            - "GET /redeterminations/{redet_id}  # informational premium estimate when PENDING"
            - "POST /redeterminations/{redet_id}/submit decision=RENEW new_snapshot_magi chosen so new_snapshot_fpl_percent == 133"
          assert:
            - "Redetermination.new_snapshot_fpl_percent == 133.00"
            - "GET /redeterminations/{redet_id} response data.enrollment_redetermination_premium == 24.56  # 12.28 + 12.28 (per-member-first rounding); NOT 24.55"

  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # (≥2 instances, different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: application_cyclic_via_appeal
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_DENIED
          - state_machines.Application.DENIED_to_APPEALED
          - state_machines.Application.APPEALED_to_UNDER_REVIEW
          - state_machines.Appeal.UNDER_REVIEW_to_GRANTED
        distinguishing_aspect: |
          Application state machine is cyclic: UNDER_REVIEW → DENIED →
          APPEALED → UNDER_REVIEW. The same Application row can re-enter
          UNDER_REVIEW after an Appeal is GRANTED, and the caseworker can
          re-decide it to APPROVED or DENIED. This is a true cycle on the
          Application entity, distinct from any other state machine's shape.
        test_recipe:
          setup:
            - "Create state-policy, household, 1 applicant with income that initially fails eligibility"
            - "Submit application; decide DENY (status: UNDER_REVIEW → DENIED)"
          trigger:
            - "POST /appeals with determination_id (Application: DENIED → APPEALED)"
            - "POST /appeals/{appeal_id}/schedule-hearing (Appeal: FILED → HEARING_SCHEDULED)"
            - "POST /_clock/advance past scheduled_start"
            - "POST /fair-hearings/{fh_id}/hold (Appeal: HEARING_SCHEDULED → UNDER_REVIEW)"
            - "POST /appeals/{appeal_id}/grant (cascade: Application APPEALED → UNDER_REVIEW)"
          assert:
            - "Application.status transitions visited in order: DRAFT, UNDER_REVIEW, DENIED, APPEALED, UNDER_REVIEW (cycle closed)"
            - "EligibilityDetermination.outcome on the original determination == OVERTURNED"

      - name: enrollment_cyclic_via_redetermination
        grounds:
          - state_machines.Enrollment.ACTIVE_to_REDETERMINATION_DUE
          - state_machines.Enrollment.REDETERMINATION_DUE_to_ACTIVE
          - state_machines.Enrollment.ACTIVE_to_CONTINUOUS_COVERAGE
          - state_machines.Enrollment.CONTINUOUS_COVERAGE_to_ACTIVE
        distinguishing_aspect: |
          Enrollment state machine is cyclic on a DIFFERENT entity than
          Application: ACTIVE → REDETERMINATION_DUE → ACTIVE (annual
          renewal loop), plus ACTIVE → CONTINUOUS_COVERAGE → ACTIVE
          (emergency declaration loop). The same Enrollment row can pass
          through ACTIVE multiple times as years roll forward — distinct
          from the Application cycle and from any linear pipeline.
        test_recipe:
          setup:
            - "Create state-policy, household, applicant; submit and APPROVE application → 1 ACTIVE Enrollment with redetermination_due_at = clock_now + 365d"
          trigger:
            - "POST /_clock/advance to redetermination_due_at"
            - "POST /_sweep/redeterminations (Enrollment: ACTIVE → REDETERMINATION_DUE; Redetermination created PENDING)"
            - "POST /redeterminations/{redet_id}/submit decision=RENEW (Enrollment: REDETERMINATION_DUE → ACTIVE; redetermination_due_at += 365d)"
          assert:
            - "Enrollment.coverage_status visited in order: ACTIVE, REDETERMINATION_DUE, ACTIVE (cycle closed)"
            - "Enrollment.redetermination_due_at after RENEW == coverage_start (new) + 365d"

  # ---------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # (≥2 instances, depths ≥3 and ≥2 respectively, different triggering transitions)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: appeal_grant_cascade_depth_3
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_GRANTED
          - state_machines.EligibilityDetermination.INELIGIBLE_to_OVERTURNED
          - state_machines.Application.APPEALED_to_UNDER_REVIEW
          - calculations.household_active_enrollment_count
        distinguishing_aspect: |
          Trigger: POST /appeals/{id}/grant. Depth-3 transitive cascade:
          Hop 1 — Appeal GRANTED itself mutates the associated
                  EligibilityDetermination.outcome → OVERTURNED.
          Hop 2 — that determination mutation triggers the associated
                  Application.status → UNDER_REVIEW (caused by the OVERTURNED
                  determination, NOT directly by the grant action).
          Hop 3 — the now-UNDER_REVIEW Application, when re-decided APPROVE,
                  creates Enrollments, which causes Household.active_enrollment_count
                  to recompute (caused by hop-2 → re-decide chain).
        test_recipe:
          setup:
            - "Create the cyclic appeal flow as in application_cyclic_via_appeal; reach Appeal status=UNDER_REVIEW with FairHearing.status=HELD"
            - "Pre-record: Household.active_enrollment_count == 0 (no enrollments yet)"
          trigger:
            - "POST /appeals/{appeal_id}/grant"
            - "POST /households/{hid}/applications/{app_id}/decide decision=APPROVE  (uses a DIFFERENT EligibilityCaseworker X-User-ID than the original DENY)"
          assert:
            - "After grant: EligibilityDetermination.outcome == OVERTURNED  (hop 1)"
            - "After grant: Application.status == UNDER_REVIEW  (hop 2)"
            - "After re-decide APPROVE: 1 new Enrollment exists with coverage_status=ACTIVE; Household.active_enrollment_count == 1  (hop 3)"

      - name: emergency_declaration_cascade_depth_2
        grounds:
          - state_machines.Enrollment.ACTIVE_to_CONTINUOUS_COVERAGE
          - state_machines.Enrollment.REDETERMINATION_DUE_to_CONTINUOUS_COVERAGE
          - calculations.applicant_redetermination_count_this_year
        distinguishing_aspect: |
          Trigger (DIFFERENT from appeal grant): POST /emergency-declarations.
          Depth-2 transitive cascade:
          Hop 1 — EmergencyDeclaration creation itself causes Enrollment
                  rows in matching state to flip to CONTINUOUS_COVERAGE.
          Hop 2 — that Enrollment mutation triggers the associated PENDING
                  Redetermination.status → WITHDRAWN (caused by the
                  Enrollment state change, not directly by the declaration POST).
          The second hop is caused by the first hop's Enrollment mutation,
          not by the original declaration action — distinguishing this from
          a parallel fan-out where the declaration POST mutated both at once.
        test_recipe:
          setup:
            - "Reach the state where one Enrollment is REDETERMINATION_DUE with one PENDING Redetermination tied to it (use the cyclic flow from enrollment_cyclic_via_redetermination but stop at PENDING)"
          trigger:
            - "POST /emergency-declarations {scope:STATE, state_code:CA, declared_at:clock_now, expires_at:clock_now+30d}"
          assert:
            - "Enrollment.coverage_status == CONTINUOUS_COVERAGE  (hop 1)"
            - "Enrollment.continuous_coverage_flag == true"
            - "Redetermination.status == WITHDRAWN  (hop 2 caused by Enrollment flip)"

  # ---------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # (≥2 instances, must involve different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_appeal_late
        grounds:
          - validations[priority=5]            # state
          - validations[priority=7]            # business_temporal
          - errors.ERR_INVALID_STATE
          - errors.ERR_APPEAL_WINDOW_EXPIRED
        distinguishing_aspect: |
          Pair: state vs business_temporal. Scenario: POST /appeals against
          an Application currently in WITHDRAWN status (state violation:
          must be DENIED) AND filed 100 days after decided_at (business_temporal
          violation: > 90 days). State (priority 5) wins → ERR_INVALID_STATE,
          not ERR_APPEAL_WINDOW_EXPIRED.
        test_recipe:
          setup:
            - "Create Application; submit; decide DENY at clock_now=T0; produce EligibilityDetermination.decided_at=T0"
            - "POST /_clock/advance to T0+100d"
            - "POST /applications/{app_id}/withdraw  (state: DENIED can transition to WITHDRAWN? No — DENIED is terminal. Instead, create a fresh application that we leave in DRAFT and try to appeal it.)"
            - "Actually: create a DRAFT application (never decided), then try to file an Appeal against a determination_id that points at a DENIED but later-WITHDRAWN application would be impossible — so reproduce by appealing a non-DENIED determination. Setup: build determination but stub a state-mismatch by re-using application state UNDER_REVIEW after grant, before re-decide."
          trigger:
            - "At T0+100d, POST /appeals {determination_id: id of OVERTURNED determination (after a previous successful appeal)}"
          assert:
            - "Response error_id == ERR_INVALID_STATE  (priority 5; state of EligibilityDetermination is OVERTURNED, not INELIGIBLE)"
            - "Response error_id != ERR_APPEAL_WINDOW_EXPIRED  (priority 7; would also fire but loses to priority 5)"

      - name: business_fiscal_vs_business_referential_redetermination
        grounds:
          - validations[priority=6]            # business_referential
          - validations[priority=12]           # business_fiscal
          - errors.ERR_HOUSEHOLD_INCOMPLETE
          - errors.ERR_NOT_ELIGIBLE
        distinguishing_aspect: |
          Pair: business_referential vs business_fiscal (a DIFFERENT pair
          than state-vs-temporal). Scenario: POST /applications/{id}/submit
          when (a) the Household's only non-EXCLUDED Applicant has been
          re-marked EXCLUDED (referential violation: HOUSEHOLD_INCOMPLETE)
          AND (b) the household income would fail the magi_income_limit_pct
          ceiling (fiscal violation: NOT_ELIGIBLE). business_referential
          (priority 6) wins over business_fiscal (priority 12).
        test_recipe:
          setup:
            - "Create state-policy with magi_income_limit_pct=50.0 (very low)"
            - "Create household, one PRIMARY applicant; then PATCH applicant to dependent_status=EXCLUDED via re-create scenario (or omit the eligible applicant entirely so household has only EXCLUDED applicants)"
            - "Add WAGES 100000 ANNUAL"
            - "Create Application in DRAFT"
          trigger:
            - "POST /households/{hid}/applications/{app_id}/submit"
          assert:
            - "Response error_id == ERR_HOUSEHOLD_INCOMPLETE  (priority 6 fires first)"
            - "Response error_id != ERR_NOT_ELIGIBLE  (priority 12 would also fire on the income but loses by priority)"

  # ---------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # (≥2 instances, different metrics, each via a distinct endpoint)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: fpl_percent_inclusive_ceiling
        grounds:
          - calculations.household_fpl_percent
          - validations[priority=12]
          - errors.ERR_NOT_ELIGIBLE
        distinguishing_aspect: |
          Metric: fpl_percent (a numeric threshold). Endpoint:
          POST /households/{id}/applications/{id}/decide. The eligibility
          comparison is INCLUSIVE: fpl_percent <= magi_income_limit_pct.
          Test pins the boundary at exactly 138.00 (eligible) vs 138.01
          (not eligible) after HALF_UP rounding to 2 decimals — distinct
          from any empty-set or zero-count boundary.
        test_recipe:
          setup:
            - "POST /state-policies {fpl_base_amount:15000, fpl_per_member_amount:5000, magi_income_limit_pct:138.0}"
            - "Household with 2 non-EXCLUDED applicants → fpl_threshold=20000"
            - "Case A income: WAGES 27600 ANNUAL on applicant 1 → total_magi=27600, fpl_percent=138.00"
            - "Case B income (separate household): WAGES 27601 ANNUAL → total_magi=27601, raw=138.005, ROUND_HALF_UP=138.01"
          trigger:
            - "POST /households/{hid_A}/applications/{app_A}/submit then /decide APPROVE"
            - "POST /households/{hid_B}/applications/{app_B}/submit then /decide APPROVE"
          assert:
            - "Case A: Application.snapshot_fpl_percent == 138.00; /decide APPROVE returns 200; EligibilityDetermination.outcome == ELIGIBLE"
            - "Case B: Application.snapshot_fpl_percent == 138.01; /decide APPROVE returns 422 with error_id ERR_NOT_ELIGIBLE"

      - name: effective_size_zero_threshold_invalid
        grounds:
          - calculations.household_fpl_percent
          - validations[priority=13]
          - errors.ERR_FPL_THRESHOLD_INVALID
        distinguishing_aspect: |
          Metric: effective household size (a count/zero boundary —
          DIFFERENT from a numeric percent threshold). Endpoint:
          POST /applications/{id}/submit. The lower-bound boundary
          (size==0 → division-by-zero) triggers ERR_FPL_THRESHOLD_INVALID;
          size==1 is the minimum valid value. This is a distinct
          metric on a distinct endpoint from the fpl_percent ceiling test.
        test_recipe:
          setup:
            - "POST state-policy; POST household; POST a single applicant with dependent_status=EXCLUDED (so non-EXCLUDED count = 0)"
            - "POST Application in DRAFT"
          trigger:
            - "POST /households/{hid}/applications/{app_id}/submit"
          assert:
            - "Response error_id == ERR_FPL_THRESHOLD_INVALID  (effective_size==0 boundary)"
            - "After adding one PRIMARY (non-EXCLUDED) applicant, the same submit succeeds (size==1 is valid)"

  # ---------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # (≥2 instances, different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: appeal_grant_gated_by_fair_hearing_held
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_GRANTED
          - state_machines.FairHearing.SCHEDULED_to_HELD
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          Entity pair: Appeal ↔ FairHearing. Appeal cannot transition
          UNDER_REVIEW → GRANTED unless the associated FairHearing.status
          is HELD. This is a cross-entity precondition involving a
          different entity pair than the next instance.
        test_recipe:
          setup:
            - "Reach Appeal.status=HEARING_SCHEDULED with FairHearing.status=SCHEDULED (do NOT call /hold)"
          trigger:
            - "POST /appeals/{appeal_id}/grant"
          assert:
            - "Response error_id == ERR_INVALID_STATE  (Appeal not in UNDER_REVIEW, since FairHearing has not been held)"
            - "After POST /fair-hearings/{fh_id}/hold (which sets Appeal.status=UNDER_REVIEW), the same /grant succeeds with 200"

      - name: redetermination_renew_gated_by_emergency_declaration
        grounds:
          - state_machines.Enrollment.ACTIVE_to_CONTINUOUS_COVERAGE
          - state_machines.Enrollment.REDETERMINATION_DUE_to_ACTIVE
          - entities.StatePolicy.fields.emergency_continuous_active
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          Entity pair: Redetermination ↔ EmergencyDeclaration (a DIFFERENT
          pair from Appeal ↔ FairHearing). A caseworker cannot submit a
          Redetermination decision while the associated Enrollment is in
          CONTINUOUS_COVERAGE because an ACTIVE EmergencyDeclaration has
          flipped the Enrollment out of REDETERMINATION_DUE (Redetermination
          was withdrawn by the cascade).
        test_recipe:
          setup:
            - "Reach state where one Enrollment is REDETERMINATION_DUE with a PENDING Redetermination"
            - "POST /emergency-declarations covering this Household.state_code → Enrollment flips to CONTINUOUS_COVERAGE; Redetermination flips to WITHDRAWN"
          trigger:
            - "POST /redeterminations/{redet_id}/submit decision=RENEW"
          assert:
            - "Response error_id == ERR_INVALID_STATE  (Redetermination is WITHDRAWN, not PENDING)"
            - "After /_clock/advance past EmergencyDeclaration.expires_at, the next /_sweep/redeterminations creates a fresh Redetermination that can be submitted normally"

  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # (≥2 instances, different interval semantics on different resources)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: enrollment_coverage_half_open_overlap
        grounds:
          - calculations.enrollment_coverage_overlap_check
          - errors.ERR_ENROLLMENT_OVERLAP
          - validations[priority=10]
          - entities.Enrollment.fields.coverage_start
          - entities.Enrollment.fields.coverage_end
        distinguishing_aspect: |
          Resource: Enrollment.applicant_id. Interval semantics:
          HALF-OPEN [coverage_start, coverage_end), NO buffer applied.
          Adjacency (new.coverage_start == existing.coverage_end) does NOT
          conflict. Test pins this: a second Enrollment whose coverage_start
          equals the first's coverage_end is accepted; offsetting by -1
          second is rejected.
        test_recipe:
          setup:
            - "Create state-policy, household, 1 applicant; submit/APPROVE → Enrollment E1 with coverage_start=T0, coverage_end=T0+365d, coverage_status=ACTIVE"
            - "Open a second Application on the same applicant"
          trigger:
            - "POST /_clock/advance to T0+365d (exact boundary); submit/APPROVE second application → Enrollment E2 with coverage_start=T0+365d, coverage_end=T0+730d"
            - "Roll back via test setup (or separate household): submit/APPROVE with coverage_start=T0+365d - 1s instead"
          assert:
            - "Adjacency case: E2 creation returns 200; both enrollments exist (E1 ACTIVE or REDETERMINATION_DUE, E2 ACTIVE) — no ERR_ENROLLMENT_OVERLAP"
            - "Offset-back-1-second case: returns 409 with error_id ERR_ENROLLMENT_OVERLAP"

      - name: fair_hearing_closed_with_buffer_overlap
        grounds:
          - calculations.fair_hearing_overlap_check
          - errors.ERR_HEARING_CONFLICT
          - validations[priority=9]
          - entities.FairHearing.fields.scheduled_start
          - entities.FairHearing.fields.scheduled_end
        distinguishing_aspect: |
          Resource: FairHearing.officer_id (a DIFFERENT resource than
          Enrollment.applicant_id). Interval semantics:
          CLOSED [scheduled_start, scheduled_end] WITH 30-minute buffer
          applied to the NEW side only. Adjacency conflicts (because of
          the buffer) — distinct geometry from the Enrollment half-open
          no-buffer rule.
        test_recipe:
          setup:
            - "Reach state where two Appeals exist with the same officer_id"
            - "Schedule first FairHearing for officer O at [T1, T1+1h], SCHEDULED"
          trigger:
            - "Schedule second FairHearing for officer O at [T1+1h, T1+2h] — adjacent end-to-start"
            - "Separately: schedule second FairHearing at [T1+1h+31min, T1+2h+31min] — 31 minutes after first end"
          assert:
            - "Adjacent case ([T1+1h, T1+2h]): returns 409 with ERR_HEARING_CONFLICT — buffer makes adjacency illegal (T1+1h - 30min = T1+30min, which is <= T1+1h existing end)"
            - "31-minute-gap case: returns 200 — buffer cleared"

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # (≥2 instances, different types of conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: enrollment_suspend_reactivate_active_count_invariant
        grounds:
          - state_machines.Enrollment.ACTIVE_to_SUSPENDED
          - state_machines.Enrollment.SUSPENDED_to_ACTIVE
          - calculations.household_active_enrollment_count
          - entities.Household.fields.active_enrollment_count
        distinguishing_aspect: |
          Conserved quantity: Household.active_enrollment_count
          (an INTEGER COUNT — distinct type from the other instance's
          field). Forward action SUSPEND paired with compensating
          REACTIVATE must leave active_enrollment_count unchanged from
          its pre-SUSPEND value. Formula:
          pre_count == post_count after the {SUSPEND, REACTIVATE} pair.
        test_recipe:
          setup:
            - "Build a Household with 1 ACTIVE Enrollment → active_enrollment_count == 1"
          trigger:
            - "POST /enrollments/{eid}/suspend  (coverage_status: ACTIVE → SUSPENDED; count -> 0)"
            - "POST /enrollments/{eid}/reactivate  (coverage_status: SUSPENDED → ACTIVE; count -> 1)"
          assert:
            - "Before pair: Household.active_enrollment_count == 1"
            - "Between pair: Household.active_enrollment_count == 0"
            - "After pair: Household.active_enrollment_count == 1  (conserved)"

      - name: redetermination_withdraw_resubmit_count_invariant
        grounds:
          - state_machines.Enrollment.ACTIVE_to_REDETERMINATION_DUE
          - calculations.applicant_redetermination_count_this_year
          - entities.Applicant.fields.redetermination_count_this_year
          - entities.Redetermination.fields.status
        distinguishing_aspect: |
          Conserved quantity: Applicant.redetermination_count_this_year
          (a YEAR-WINDOWED COUNT, distinct type from active_enrollment_count
          because of its calendar-year filter and its exclusion of
          WITHDRAWN status). After WITHDRAW + (sweep re-creates a fresh
          PENDING Redetermination), the count returns to its pre-withdraw
          value because WITHDRAWN rows are excluded from the formula.
        test_recipe:
          setup:
            - "Reach Enrollment.coverage_status==REDETERMINATION_DUE with one PENDING Redetermination R1 → Applicant.redetermination_count_this_year == 1"
          trigger:
            - "POST /redeterminations/{R1}/withdraw  (R1.status: PENDING → WITHDRAWN; count -> 0 because WITHDRAWN excluded)"
            - "POST /_sweep/redeterminations  (creates a fresh PENDING Redetermination R2 since redetermination_due_at <= clock_now still holds; count -> 1)"
          assert:
            - "Before pair: Applicant.redetermination_count_this_year == 1"
            - "Between pair (after withdraw, before sweep): Applicant.redetermination_count_this_year == 0"
            - "After pair: Applicant.redetermination_count_this_year == 1  (conserved)"
            - "R1.status == WITHDRAWN AND R2.status == PENDING AND R1.id != R2.id"
