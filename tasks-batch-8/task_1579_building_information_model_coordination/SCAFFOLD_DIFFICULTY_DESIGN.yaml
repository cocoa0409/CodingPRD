            - "mid-test: Project.${pid}.coordination_readiness_index == 25"
            - "final: Project.${pid}.coordination_posture == NORMAL AND coordination_readiness_index == 100"
            - "final: Project.${pid}.current_phase == DESIGN_DEVELOPMENT (phase unaffected by clash resolution)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: accept_supersede_unfreeze_revoke_regress_chain
        grounds:
          - state_machines.TradeModel.ACCEPTED_to_SUPERSEDED
          - state_machines.FederatedModel.FROZEN_to_ASSEMBLED
          - state_machines.SignOff.SIGNED_to_REVOKED
          - state_machines.FabricationPackage.READY_FOR_RELEASE_to_SIGNOFF_IN_PROGRESS
        distinguishing_aspect: |
          Depth-4 cascade triggered by POST /api/trade-models/{id}/accept: accept of M2
          supersedes M1 (link 1); M1's supersession re-points the federated member and
          drops F1 FROZEN -> ASSEMBLED with is_stale (link 2); F1 leaving FROZEN revokes
          the package's SIGNED sign-off (link 3); the revocation drops signed_count below
          required and regresses the package READY_FOR_RELEASE -> SIGNOFF_IN_PROGRESS
          (link 4). Each link is caused by the previous link, not by the accept directly.
        test_recipe:
          setup:
            - "Project P; partners P1 (STRUCTURAL author) and P2 (fabricator)"
            - "M1 ACCEPTED; F1 [M1] FROZEN; package PKG (scope [STRUCTURAL], requested by P2) with one SIGNED sign-off -> READY_FOR_RELEASE"
            - "M2: second STRUCTURAL revision by P1, SUBMITTED"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "TC1" }, as: VDCManager, captures: { pid: $.data.id, pv: $.data.version } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { p1: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "FabCo", discipline: MECHANICAL, hourly_rate_cents: 10000, coordination_budget_hours: 50.0, software_platform: TEKLA }, as: VDCManager, captures: { p2: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 300, life_safety_elements: 10, life_safety_compliant: 10, envelope_elements: 10, envelope_compliant: 10, finish_elements: 10, finish_compliant: 10 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { m1: $.data.id } }
            - { call: "POST /api/trade-models/${m1}/submit", payload: {}, as: TradeModelAuthor, as_user_id: "${p1}" }
            - { call: "POST /api/trade-models/${m1}/accept", payload: {}, as: BIMCoordinator }
            - { call: "POST /api/projects/${pid}/federated-models", payload: { label: "F1", target_format: IFC, member_trade_model_ids: ["${m1}"], expected_project_version: "${pv}" }, as: VDCManager, captures: { f1: $.data.id } }
            - { call: "POST /api/federated-models/${f1}/freeze", payload: {}, as: VDCManager }
            - { call: "POST /api/projects/${pid}/fabrication-packages", payload: { federated_model_id: "${f1}", scope_disciplines: ["STRUCTURAL"] }, as: FabricationLead, as_user_id: "${p2}", captures: { pkg: $.data.id } }
            - { call: "POST /api/fabrication-packages/${pkg}/submit-for-signoff", payload: {}, as: FabricationLead, as_user_id: "${p2}" }
            - { call: "GET /api/fabrication-packages/${pkg}/signoffs", payload: {}, as: VDCManager, captures: { so1: "$.data[0].id" } }
            - { call: "POST /api/signoffs/${so1}/sign", payload: {}, as: LeadEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 350, life_safety_elements: 10, life_safety_compliant: 10, envelope_elements: 10, envelope_compliant: 10, finish_elements: 10, finish_compliant: 10 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { m2: $.data.id } }
            - { call: "POST /api/trade-models/${m2}/submit", payload: {}, as: TradeModelAuthor, as_user_id: "${p1}" }
          trigger:
            - { call: "POST /api/trade-models/${m2}/accept", payload: {}, as: BIMCoordinator }
            - { call: "GET /api/trade-models/${m1}", payload: {}, as: VDCManager, captures: { m1_status: $.data.status } }
            - { call: "GET /api/federated-models/${f1}", payload: {}, as: VDCManager, captures: { f1_status: $.data.status, f1_stale: $.data.is_stale } }
            - { call: "GET /api/federated-models/${f1}/members", payload: {}, as: VDCManager, captures: { member_model: "$.data[0].trade_model_id" } }
            - { call: "GET /api/signoffs/${so1}", payload: {}, as: VDCManager, captures: { so1_status: $.data.status } }
            - { call: "GET /api/fabrication-packages/${pkg}", payload: {}, as: VDCManager, captures: { pkg_status: $.data.status, pkg_signed: $.data.signed_count } }
          assert:
            - "TradeModel.${m1}.status == SUPERSEDED  (link 1)"
            - "TradeModel.${m2}.supersedes_model_id == ${m1}"
            - "FederatedModel.${f1}.status == ASSEMBLED and is_stale == true  (link 2)"
            - "FederatedModelMember of ${f1} re-pointed: trade_model_id == ${m2}  (link 2)"
            - "SignOff.${so1}.status == REVOKED  (link 3)"
            - "FabricationPackage.${pkg}.status == SIGNOFF_IN_PROGRESS and signed_count == 0  (link 4)"

      - name: reopen_breach_reliability_probation_chain
        grounds:
          - state_machines.ClashIssue.VERIFIED_to_REOPENED
          - state_machines.ResolutionCommitment.FULFILLED_to_BREACHED
          - calculations.trade_partner_reliability
          - entities.TradePartner.fields.status
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /api/clash-issues/{id}/reopen (a different
          trigger than cascade A's accept): reopen of C9 (link 1) breaches its FULFILLED
          commitment K9 (link 2); the breach applies the reliability penalty to a partner
          pre-damaged to score 45 (tier C, -20 -> 25), and crossing below 40 flips the
          partner ACTIVE -> PROBATION (link 3), which in turn gates future clash
          assignment (ERR_TRADE_PARTNER_ON_PROBATION).
        test_recipe:
          setup:
            - "Project P, partner P1 pre-damaged to reliability 45 by eight swept breaches (one clash C0 with eight overdue commitments)"
            - "C9: MINOR clash ASSIGNED to P1, RESOLVED with 1.0 h, then VERIFIED; K9: commitment on C9 due 2026-09-01, FULFILLED by that verify"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "TC2" }, as: VDCManager, captures: { pid: $.data.id, pv: $.data.version } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { p1: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 300, life_safety_elements: 10, life_safety_compliant: 10, envelope_elements: 10, envelope_compliant: 10, finish_elements: 10, finish_compliant: 10 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { m1: $.data.id } }
            - { call: "POST /api/trade-models/${m1}/submit", payload: {}, as: TradeModelAuthor, as_user_id: "${p1}" }
            - { call: "POST /api/trade-models/${m1}/accept", payload: {}, as: BIMCoordinator }
            - { call: "POST /api/projects/${pid}/federated-models", payload: { label: "F1", target_format: IFC, member_trade_model_ids: ["${m1}"], expected_project_version: "${pv}" }, as: VDCManager, captures: { f1: $.data.id } }
            - { call: "POST /api/federated-models/${f1}/freeze", payload: {}, as: VDCManager }
            - { call: "POST /api/federated-models/${f1}/clash-runs", payload: { tolerance_mm: 5.0 }, as: BIMCoordinator, captures: { r1: $.data.id } }
            - { call: "POST /api/clash-runs/${r1}/start", payload: {}, as: BIMCoordinator }
            - { call: "POST /api/clash-runs/${r1}/clashes", payload: { element_pair: "E/0", overlap_mm: 0.0, spans_disciplines: false }, as: BIMCoordinator, captures: { c0: $.data.id } }
            - { call: "POST /api/clash-runs/${r1}/clashes", payload: { element_pair: "E/9", overlap_mm: 0.0, spans_disciplines: false }, as: BIMCoordinator, captures: { c9: $.data.id } }
            - { call: "POST /api/clash-issues/${c0}/assign", payload: { trade_partner_id: "${p1}" }, as: BIMCoordinator, as_user_id: "coord-1" }
            - { call: "POST /api/projects/${pid}/coordination-meetings", payload: { room_id: "RM-A", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T10:00:00Z" }, as: BIMCoordinator, captures: { mtg: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:30:00Z" }, as: VDCManager }
            - { call: "POST /api/coordination-meetings/${mtg}/start", payload: {}, as: BIMCoordinator }
            - { call: "POST /api/coordination-meetings/${mtg}/commitments", payload: { clash_issue_id: "${c0}", committed_by_partner_id: "${p1}", due_at: "2026-08-11T00:00:00Z" }, as: BIMCoordinator }
            - { call: "POST /api/coordination-meetings/${mtg}/commitments", payload: { clash_issue_id: "${c0}", committed_by_partner_id: "${p1}", due_at: "2026-08-11T00:00:00Z" }, as: BIMCoordinator }
            - { call: "POST /api/coordination-meetings/${mtg}/commitments", payload: { clash_issue_id: "${c0}", committed_by_partner_id: "${p1}", due_at: "2026-08-11T00:00:00Z" }, as: BIMCoordinator }
            - { call: "POST /api/coordination-meetings/${mtg}/commitments", payload: { clash_issue_id: "${c0}", committed_by_partner_id: "${p1}", due_at: "2026-08-11T00:00:00Z" }, as: BIMCoordinator }
            - { call: "POST /api/coordination-meetings/${mtg}/commitments", payload: { clash_issue_id: "${c0}", committed_by_partner_id: "${p1}", due_at: "2026-08-11T00:00:00Z" }, as: BIMCoordinator }
            - { call: "POST /api/coordination-meetings/${mtg}/commitments", payload: { clash_issue_id: "${c0}", committed_by_partner_id: "${p1}", due_at: "2026-08-11T00:00:00Z" }, as: BIMCoordinator }
            - { call: "POST /api/coordination-meetings/${mtg}/commitments", payload: { clash_issue_id: "${c0}", committed_by_partner_id: "${p1}", due_at: "2026-08-11T00:00:00Z" }, as: BIMCoordinator }
            - { call: "POST /api/coordination-meetings/${mtg}/commitments", payload: { clash_issue_id: "${c0}", committed_by_partner_id: "${p1}", due_at: "2026-08-11T00:00:00Z" }, as: BIMCoordinator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: VDCManager }
            - { call: "POST /api/projects/${pid}/run-coordination-sweep", payload: {}, as: VDCManager, captures: { score_after_sweep: $.data.coordination_readiness_index } }
            - { call: "POST /api/clash-issues/${c9}/assign", payload: { trade_partner_id: "${p1}" }, as: BIMCoordinator, as_user_id: "coord-1" }
            - { call: "POST /api/clash-issues/${c9}/resolve", payload: { actual_labor_hours: 1.0 }, as: TradeModelAuthor, as_user_id: "${p1}" }
            - { call: "POST /api/coordination-meetings/${mtg}/commitments", payload: { clash_issue_id: "${c9}", committed_by_partner_id: "${p1}", due_at: "2026-09-01T00:00:00Z" }, as: BIMCoordinator, captures: { k9: $.data.id } }
            - { call: "POST /api/clash-issues/${c9}/verify", payload: { re_inspection_overlap_mm: 0.0 }, as: BIMCoordinator, as_user_id: "coord-2" }
          trigger:
            - { call: "POST /api/clash-issues/${c9}/reopen", payload: {}, as: BIMCoordinator, as_user_id: "coord-2" }
            - { call: "GET /api/commitments/${k9}", payload: {}, as: BIMCoordinator, captures: { k9_status: $.data.status } }
            - { call: "GET /api/projects/${pid}/trade-partners", payload: {}, as: VDCManager, captures: { p1_score: "$.data[0].reliability_score", p1_status: "$.data[0].status", p1_breaches: "$.data[0].breach_count" } }
            - { call: "GET /api/clash-issues/${c9}", payload: {}, as: BIMCoordinator, captures: { c9_status: $.data.status, c9_cycle: $.data.cycle_count } }
          assert:
            - "ClashIssue.${c9}.status == REOPENED and cycle_count == 1  (link 1)"
            - "ResolutionCommitment.${k9}.status == BREACHED  (link 2: FULFILLED invalidated by reopen)"
            - "TradePartner.${p1}.reliability_score == 25  (link 3: 45 pre-event tier C, -20)"
            - "TradePartner.${p1}.breach_count == 9"
            - "TradePartner.${p1}.status == PROBATION  (25 < 40)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: resolve_state_beats_fiscal_on_dual_violation
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - state_machines.ClashIssue.ASSIGNED_to_RESOLVED
        distinguishing_aspect: |
          Error-category pair (state, business_fiscal): the same resolve call violates the
          state gate (clash already VERIFIED -> not ASSIGNED) AND the fiscal gate
          (90.0 h > 78.5 h remaining budget). Priority 6 state beats priority 11 fiscal,
          so the response is ERR_CLASH_NOT_RESOLVABLE (409), never ERR_COORDINATION_BUDGET_EXCEEDED.
        test_recipe:
          setup:
            - "Project P, partner P1 (budget 100.0 h), M1 ACCEPTED, F1 FROZEN, R1 RUNNING"
            - "C1 (MAJOR) assigned to P1, resolved with 21.5 h (consumed 21.5, remaining 78.5), verified"
          setup_api_calls:
