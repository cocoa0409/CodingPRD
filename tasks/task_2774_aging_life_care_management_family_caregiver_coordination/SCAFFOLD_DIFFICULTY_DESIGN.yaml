            - "Care manager Dana (22500/hr) and supervisor Iris."
            - "Client Ida with retainer_floor_cents 0 and no retainer deposits."
            - "Exactly one TimeEntry of 60 minutes on service_date 2026-08-13, left in status SUBMITTED."
            - "One DRAFT Invoice for 2026-08-01..2026-08-31."
