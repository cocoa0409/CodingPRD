          - errors[ERR_AFFILIATE_AGREEMENT_NOT_FOUND]
        distinguishing_aspect: "The optional FK is the only difference between three otherwise identical park creations: a real agreement id yields network_type AFFILIATE and makes the park discoverable through the affiliate_agreement_id list filter, an unknown id is refused at priority 15 before any park row exists, and omitting the field yields CLUB_OWNED with a null link."
