  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: appraiser_closed_interval_adjacency_conflict
        grounds:
          - validations[priority=19]
          - entities.Appraisal.fields.engagement_start_date
          - entities.Appraisal.fields.engagement_end_date
          - entities.Appraiser.fields.max_concurrent_engagements
        distinguishing_aspect: |
          Interval semantics = CLOSED [start, end] with aggregate capacity on
          the Appraiser resource: with max_concurrent_engagements == 1, an
          engagement starting exactly on the day the previous one ENDS
          (end == start contact) IS a conflict (closed intervals share that
          date), while a gap of one day is accepted — adjacency-as-conflict is
          the exact opposite of the half-open committee-session rule below.
        test_recipe:
          setup:
            - "Application in APPRAISAL_REVIEW (clean deal: requested 20,000,000; dscr_standard 4.2085, dscr_stress 2.9459; zero exceptions)"
            - "Appraiser max_concurrent_engagements == 1; engagement E1 [2026-08-03, 2026-08-07] ENGAGED"
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Andy Analyst" }, as: BankAdmin, captures: { an: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "April Appraisals" }, as: BankAdmin, captures: { apm: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Window Watchers LLC", naics_code: "332710", relationship_since: "2015-01-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor: $.data.id } }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor}", product_type: CRE_TERM, requested_amount_cents: 20000000, term_months: 60 }, as: RelationshipManager, as_user_id: "${rm}", captures: { app: $.data.id } }
            - { call: "POST /credit/financial-statements", payload: { loan_application_id: "${app}", period_end_date: "2025-12-31", revenue_cents: 40000000, ebitda_cents: 20000000, addbacks_cents: 0, distributions_cents: 0, maintenance_capex_cents: 0, existing_annual_debt_service_cents: 0, total_assets_cents: 100000000, total_liabilities_cents: 20000000 }, as: CreditAnalyst, as_user_id: "${an}", captures: { stmt: $.data.id } }
            - { call: "POST /credit/loan-applications/${app}/submit", payload: {}, as: RelationshipManager, as_user_id: "${rm}" }
            - { call: "POST /credit/financial-statements/${stmt}/spread", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/financial-statements/${stmt}/finalize", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/loan-applications/${app}/finalize-spreads", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/appraisers", payload: { name: "SoloAppraise", license_number: "LIC-900", max_concurrent_engagements: 1 }, as: AppraisalManager, as_user_id: "${apm}", captures: { apr: $.data.id } }
            - { call: "POST /credit/appraisals", payload: { loan_application_id: "${app}", appraiser_id: "${apr}", collateral_class: REAL_ESTATE, engagement_start_date: "2026-08-03", engagement_end_date: "2026-08-07" }, as: AppraisalManager, as_user_id: "${apm}", captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /credit/appraisals", payload: { loan_application_id: "${app}", appraiser_id: "${apr}", collateral_class: EQUIPMENT, engagement_start_date: "2026-08-07", engagement_end_date: "2026-08-10" }, as: AppraisalManager, as_user_id: "${apm}", captures: { err: $.data.error_id } }
            - { call: "POST /credit/appraisals", payload: { loan_application_id: "${app}", appraiser_id: "${apr}", collateral_class: EQUIPMENT, engagement_start_date: "2026-08-08", engagement_end_date: "2026-08-10" }, as: AppraisalManager, as_user_id: "${apm}", captures: { e3: $.data.id } }
          assert:
            - "E2 [2026-08-07, 2026-08-10] rejected: status 409, error_id == ERR_APPRAISER_WINDOW_CONFLICT (closed-interval contact at 2026-08-07 counts as overlap; intersecting count 1 is not < max 1)"
            - "E3 [2026-08-08, 2026-08-10] accepted: 201, Appraisal.${e3}.status == ENGAGED (one-day gap clears the closed interval)"
            - "Appraisal.${e1}.status == ENGAGED still (rejection did not disturb the existing engagement)"
            - "GET /credit/appraisers/${apr}/appraisals returns exactly 2 appraisals (E1 and E3; the rejected E2 persisted nothing)"

      - name: committee_session_half_open_back_to_back_allowed
        grounds:
          - validations[priority=20]
          - entities.CommitteeSession.fields.starts_at
          - entities.CommitteeSession.fields.ends_at
          - state_machines.CommitteeSession.SCHEDULED_to_ADJOURNED
        distinguishing_aspect: |
          Interval semantics = HALF-OPEN [starts_at, ends_at) on the
          CommitteeSession resource — geometrically opposite to the appraiser's
          closed intervals above: a session starting exactly when another ENDS
          (starts_at == ends_at) does NOT conflict, on EITHER side, while a
          strict interior overlap does.
        test_recipe:
          setup:
            - "Committee chair officer only; no sessions exist; logical clock at default 2026-08-01T00:00:00Z (all windows in the future, nothing adjourns)"
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Cheryl Chair" }, as: BankAdmin, captures: { ch: $.data.id } }
            - { call: "POST /credit/committee-sessions", payload: { level: STANDARD, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T15:00:00Z" }, as: CommitteeChair, as_user_id: "${ch}", captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /credit/committee-sessions", payload: { level: STANDARD, starts_at: "2026-08-10T15:00:00Z", ends_at: "2026-08-10T16:00:00Z" }, as: CommitteeChair, as_user_id: "${ch}", captures: { s2: $.data.id } }
            - { call: "POST /credit/committee-sessions", payload: { level: STANDARD, starts_at: "2026-08-10T14:30:00Z", ends_at: "2026-08-10T15:30:00Z" }, as: CommitteeChair, as_user_id: "${ch}", captures: { err: $.data.error_id } }
            - { call: "POST /credit/committee-sessions", payload: { level: STANDARD, starts_at: "2026-08-10T13:00:00Z", ends_at: "2026-08-10T14:00:00Z" }, as: CommitteeChair, as_user_id: "${ch}", captures: { s4: $.data.id } }
          assert:
            - "S2 [15:00, 16:00) accepted: 201, CommitteeSession.${s2}.status == SCHEDULED (back-to-back after S1: 15:00 is NOT < S1.ends_at 15:00)"
            - "S3 [14:30, 15:30) rejected: status 409, error_id == ERR_COMMITTEE_SESSION_CONFLICT (S1.starts_at 14:00 < 15:30 AND 14:30 < S1.ends_at 15:00)"
            - "S4 [13:00, 14:00) accepted: 201 (adjacent on the other side: S4.ends_at 14:00 == S1.starts_at 14:00 is not an overlap)"
            - "CommitteeSession.${s1}.status == SCHEDULED throughout (rejections never mutate existing sessions)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: exposure_conserved_across_accept_and_fund_tranches
        grounds:
          - calculations.exposure_ledger
          - entities.Borrower.fields.committed_exposure_cents
          - entities.Borrower.fields.funded_exposure_cents
          - entities.Borrower.fields.total_exposure_cents
          - state_machines.FundingAuthorization.AUTHORIZED_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity = borrower.total_exposure_cents (distinct from
          the participation hold-level quantity below): letter accept adds
          +200,000,000 committed; each funding release moves exactly the
          released amount from committed to funded — 120,000,000 then
          80,000,000 — so total_exposure_cents reads 200,000,000 at every
          checkpoint while its two components trade cent-for-cent.
        test_recipe:
          setup:
            - "Application fully approved: letter ACCEPTED with committed_amount_cents 200,000,000 (app DOCUMENTATION), required DOCUMENT and CLOSING_CONDITION items APPROVED, covenant configured, app advanced to CLOSING; clock 2026-08-10T14:30:00Z (< rate_lock 2026-08-31T23:59:59Z, < expiry 2026-09-01)"
            - "FundingAuthorization FA1 for 120,000,000 AUTHORIZED (requester CreditAdministrator, authorizer CreditPolicyOfficer)"
