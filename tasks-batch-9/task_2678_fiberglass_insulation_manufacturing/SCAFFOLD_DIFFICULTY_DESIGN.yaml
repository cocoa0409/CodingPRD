              as: CorporateOps
              captures: { plant_id: "$.data.id" }
            - call: "POST /binder-formulations"
              payload: { code: "BF-FREE-1", formaldehyde_free: true, formaldehyde_ppm: 0, voc_g_per_kg: 3.2, min_cure_temp_f: 420, min_dwell_s: 150, loi_target_pct: 4.5 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { binder_free: "$.data.id" }
            - call: "POST /binder-formulations/${binder_free}/submit"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /product-lines"
              payload: { sku: "R13-15-UF", plant_id: "${plant_id}", binder_formulation_id: "${binder_free}", certification_program_id: "${prog_ps}", form: "BATT", density_pcf: 0.80, facing_type: "UNFACED", width_in: 15, thickness_in: 3.5, declared_r_value: 13.0, bag_sqft: 88.0, bale_volume_ft3: 21.0, bale_mass_kg: 12.5, mass_rate_kg_per_min: 34.5, compression_ratio: 6.0 }
              as: CorporateOps
              captures: { pl_a: "$.data.id" }
          trigger:
            - call: "POST /product-lines/${pl_a}/submit-certification"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
          assert:
            - "trigger -> 409 with error_id == ERR_BINDER_NOT_CERTIFIED while BinderFormulation.${binder_free}.status == SUBMITTED"
            - "ProductLine.${pl_a}.certification_status is still DRAFT and effective_declared_r_value is still null; the rejected call left no partial state"
            - "then POST /binder-formulations/${binder_free}/emissions-test with { formaldehyde_ppm: 0, voc_g_per_kg: 3.2, lab_reference: \"LAB-9001\" } as CertificationOfficer co-1 -> 200 with status == EMISSIONS_TESTING"
            - "re-issuing the trigger -> 409 with error_id == ERR_BINDER_NOT_CERTIFIED again, because EMISSIONS_TESTING is not CERTIFIED"
            - "then POST /binder-formulations/${binder_free}/certification-decision with { decision: \"CERTIFY\", emissions_cert_id: \"EC-4411\" } as CertificationOfficer co-1 -> 200 with status == CERTIFIED"
            - "re-issuing the trigger -> 200 with ProductLine.${pl_a}.certification_status == PENDING_CERTIFICATION, proving the gate is exactly status == CERTIFIED and nothing weaker"
            - "ProductLine.${pl_a}.version incremented exactly once across the whole sequence, i.e. neither 409 bumped it"

      - name: quarantined_lot_release_gated_on_run_qc_status_conforming
        grounds:
          - state_machines.InventoryLot.QUARANTINED_to_AVAILABLE
          - state_machines.ProductionRun.NONCONFORMING_to_RETEST_PENDING
          - state_machines.ProductionRun.RETEST_PENDING_to_CONFORMING
          - validations.priority_58_ERR_RUN_NOT_CONFORMING
          - errors.ERR_RUN_NOT_CONFORMING
        distinguishing_aspect: |
          The opposite direction from the binder gate: this is a RECOVERY transition
          out of QUARANTINED, and the blocking value is a parallel state dimension
          (ProductionRun.qc_status) on the lot's own producing run rather than on a
          referenced master-data entity. The intermediate value RETEST_PENDING is the
          discriminator: it is neither CONFORMING nor NONCONFORMING, so an
          implementation coded as "qc_status != NONCONFORMING" releases the lot too
