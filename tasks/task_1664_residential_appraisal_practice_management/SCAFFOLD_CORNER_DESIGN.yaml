            - call: "POST /appraisal/clients"
              payload: { name: "B", client_type: AMC, contact_email: "b@x.example", default_turn_time_days: 7 }
              as: FirmAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /appraisal/orders"
              payload: { client_id: "${cb_id}", property_address: "9 B St", property_type: SFR, estimated_value_cents: 45000000, loan_type: CONVENTIONAL, requested_turn_days: 7 }
              as: ClientUser
              as_user_id: "${cb_id}"
              captures: { o_id: $.data.id }
          trigger:
