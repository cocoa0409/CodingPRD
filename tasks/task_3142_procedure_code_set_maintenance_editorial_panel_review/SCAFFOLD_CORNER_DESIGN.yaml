      - name: panel_two_thirds_floor_approved_at_exact_threshold
        claim_type: correct_result
        grounds:
          - calculations.panel_vote_percent
          - calculations.panel_weighted_vote_tally
          - state_machines.CodeChange.PANEL_REVIEW_to_DETERMINED
          - entities.EditorialPanelMeeting.fields.weighted_yes
        distinguishing_aspect: |
          Under the default 66.00 percent panel floor a weighted tally of 33 yes
          against 17 no resolves to 66.0000 percent and is approved, while the
          same tally under the citation-mode 66.6667 floor would be rejected.
        test_recipe:
          setup:
            - "Two ACTIVE specialty societies with 20 and 17 voting seats respectively"
            - "One ACTIVE ChangeApplicant"
            - "One EditorialPanelMeeting with citation_mode false and three docketed changes"
            - "Logical clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /cpt/specialty-societies"
              payload: { name: "Wide Society", specialty_code: "WD1", voting_seat_count: 20, gpci_work: 1.0000, gpci_pe: 1.0000, gpci_mp: 1.0000 }
              as: EditorialStaff
              captures: { soc_w1: $.data.id }
            - call: "POST /cpt/specialty-societies"
              payload: { name: "Narrow Society", specialty_code: "WD2", voting_seat_count: 17, gpci_work: 1.0000, gpci_pe: 1.0000, gpci_mp: 1.0000 }
              as: EditorialStaff
              captures: { soc_w2: $.data.id }
