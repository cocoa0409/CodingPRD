# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7, walking references/claim-extraction-guide.md.
# §1.8 already covers the nine reasoning rules; §1.9 covers everything else.
# Default logical clock at startup: 2026-04-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_program_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Program, endpoints]
        distinguishing_aspect: "POST /programs with all required fields returns 201 and echoes name, cdl_class, hour requirements, tuition_cents; active defaults true."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { name: "Class A ELDT", cdl_class: "CLASS_A", classroom_required_hours: 40, range_required_hours: 20, road_required_hours: 30, tuition_cents: 700000 }
              as: SchoolAdmin
              captures: { pid: $.data.id }
          assert:
            - "response code == 201"
            - "Program.${pid}.active == true"
            - "Program.${pid}.cdl_class == CLASS_A"
            - "Program.${pid}.skills_pass_threshold == 80"

      - name: get_program_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Program, endpoints]
        distinguishing_aspect: "GET /programs/{id} returns the previously created program with matching tuition_cents."
        test_recipe:
          setup: ["one program exists"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 1, range_required_hours: 1, road_required_hours: 1, tuition_cents: 550000 }
              as: SchoolAdmin
              captures: { pid: $.data.id }
          trigger:
            - call: "GET /programs/${pid}"
              as: Registrar
              captures: { t: $.data.tuition_cents }
          assert:
            - "Program.${pid}.tuition_cents == 550000"

      - name: get_program_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Program, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /programs/{id} with an unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /programs/00000000-0000-4000-8000-000000000000"
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: create_enrollment_missing_required_field_returns_invalid
        claim_type: Required Fields
        grounds: [entities.Enrollment, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /enrollments omitting student_name returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["one program exists"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 1, range_required_hours: 1, road_required_hours: 1, tuition_cents: 700000 }
              as: SchoolAdmin
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { program_id: "${pid}" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http status == 422"

      - name: create_truck_default_buffer_applied
        claim_type: Defaults
        grounds: [entities.Truck.fields.turnaround_buffer_minutes, entities.Truck.fields.status]
        distinguishing_aspect: "POST /trucks without turnaround_buffer_minutes applies default 30 and status AVAILABLE, reserved_minutes 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /trucks"
              payload: { unit_number: "T9", cdl_class: "CLASS_B" }
              as: SchoolAdmin
              captures: { tid: $.data.id }
          assert:
            - "Truck.${tid}.turnaround_buffer_minutes == 30"
            - "Truck.${tid}.status == AVAILABLE"
            - "Truck.${tid}.reserved_minutes == 0"

      - name: create_program_invalid_enum_cdl_class_rejected
        claim_type: Type Constraints
        grounds: [entities.Program.fields.cdl_class, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /programs with cdl_class 'CLASS_C' (not in {CLASS_A, CLASS_B}) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_C", classroom_required_hours: 1, range_required_hours: 1, road_required_hours: 1, tuition_cents: 700000 }
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http status == 422"

      - name: enrollment_computed_logged_hours_zero_on_create
        claim_type: Computed Fields
        grounds: [entities.Enrollment.fields.logged_classroom_hours, entities.Enrollment.fields.status]
        distinguishing_aspect: "A freshly created Enrollment has logged_classroom_hours == 0, logged_range_hours == 0, logged_road_hours == 0, status APPLIED, fmcsa_reported false — computed, input ignored."
        test_recipe:
          setup: ["one program exists"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 1, range_required_hours: 1, road_required_hours: 1, tuition_cents: 700000 }
              as: SchoolAdmin
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { program_id: "${pid}", student_name: "Sam" }
              as: Registrar
              captures: { eid: $.data.id }
          assert:
            - "Enrollment.${eid}.status == APPLIED"
            - "Enrollment.${eid}.logged_classroom_hours == 0"
            - "Enrollment.${eid}.fmcsa_reported == false"

      - name: enrollment_create_unknown_program_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Enrollment.fields.program_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /enrollments with a program_id that does not exist returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /enrollments"
              payload: { program_id: "00000000-0000-4000-8000-000000000000", student_name: "Sam" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: list_enrollments_pagination_envelope
        claim_type: Listing
        grounds: [entities.Enrollment, endpoints]
        distinguishing_aspect: "GET /enrollments returns a paginated array with total_count and has_more in meta per the fixed pagination envelope."
        test_recipe:
          setup: ["one program with two enrollments"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 1, range_required_hours: 1, road_required_hours: 1, tuition_cents: 700000 }
              as: SchoolAdmin
              captures: { pid: $.data.id }
            - call: "POST /enrollments"
              payload: { program_id: "${pid}", student_name: "A" }
              as: Registrar
            - call: "POST /enrollments"
              payload: { program_id: "${pid}", student_name: "B" }
              as: Registrar
          trigger:
            - call: "GET /enrollments"
              payload: { program_id: "${pid}" }
              as: Registrar
          assert:
            - "response total_count == 2"
            - "response has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: approve_already_approved_document_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.PrereqDocument.SUBMITTED_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a PrereqDocument already in APPROVED returns ERR_INVALID_STATE (409); no flag re-set."
        test_recipe:
          setup: ["enrollment with one APPROVED DOT-medical document"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 1, range_required_hours: 1, road_required_hours: 1, tuition_cents: 700000 }
              as: SchoolAdmin
              captures: { pid: $.data.id }
            - call: "POST /enrollments"
              payload: { program_id: "${pid}", student_name: "Sam" }
              as: Registrar
              captures: { eid: $.data.id }
            - call: "POST /enrollments/${eid}/prereq-documents"
              payload: { kind: "DOT_MEDICAL", reference_code: "MED-1", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { did: $.data.id }
            - call: "POST /prereq-documents/${did}/approve"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /prereq-documents/${did}/approve"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: clock_session_initial_state_booked
        claim_type: Initial State
        grounds: [state_machines.ClockSession, entities.ClockSession.fields.status]
        distinguishing_aspect: "A newly booked ClockSession starts in BOOKED."
        test_recipe:
          setup: ["enrollment in TRAINING"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 1, range_required_hours: 1, road_required_hours: 1, tuition_cents: 700000 }
              as: SchoolAdmin
              captures: { pid: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ivy", cdl_class: "CLASS_B" }
              as: SchoolAdmin
              captures: { iid: $.data.id }
            - call: "POST /enrollments"
              payload: { program_id: "${pid}", student_name: "Sam" }
              as: Registrar
              captures: { eid: $.data.id }
            - call: "POST /enrollments/${eid}/prereq-documents"
              payload: { kind: "DOT_MEDICAL", reference_code: "M", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { med: $.data.id }
            - call: "POST /enrollments/${eid}/prereq-documents"
              payload: { kind: "CLP_PERMIT", reference_code: "C", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { clp: $.data.id }
            - call: "POST /prereq-documents/${med}/approve"
              payload: {}
              as: Registrar
            - call: "POST /prereq-documents/${clp}/approve"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /enrollments/${eid}/clock-sessions"
              payload: { phase: "CLASSROOM", instructor_id: "${iid}", starts_at: "2026-03-10T09:00:00Z", duration_minutes: 60 }
              as: Registrar
              captures: { sid: $.data.id }
          assert:
            - "ClockSession.${sid}.status == BOOKED"

      - name: withdraw_completed_enrollment_blocked_terminal
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Enrollment, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Withdrawing an enrollment already COMPLETED returns ERR_INVALID_STATE (409) — COMPLETED is terminal."
        test_recipe:
          setup: ["enrollment driven to COMPLETED (PASS test + transmitted report)"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 0, range_required_hours: 0, road_required_hours: 1, tuition_cents: 700000, skills_pass_threshold: 80 }
              as: SchoolAdmin
              captures: { pid: $.data.id }
            - call: "POST /trucks"
              payload: { unit_number: "T1", cdl_class: "CLASS_B" }
              as: SchoolAdmin
              captures: { tid: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ivy", cdl_class: "CLASS_B" }
              as: SchoolAdmin
              captures: { iid: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ed", cdl_class: "CLASS_B", examiner_certified: true }
              as: SchoolAdmin
              captures: { xid: $.data.id }
            - call: "POST /enrollments"
              payload: { program_id: "${pid}", student_name: "Sam" }
              as: Registrar
              captures: { eid: $.data.id }
            - call: "POST /enrollments/${eid}/prereq-documents"
              payload: { kind: "DOT_MEDICAL", reference_code: "M", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { med: $.data.id }
            - call: "POST /enrollments/${eid}/prereq-documents"
              payload: { kind: "CLP_PERMIT", reference_code: "C", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { clp: $.data.id }
            - call: "POST /prereq-documents/${med}/approve"
              payload: {}
              as: Registrar
            - call: "POST /prereq-documents/${clp}/approve"
              payload: {}
              as: Registrar
            - call: "POST /enrollments/${eid}/clock-sessions"
              payload: { phase: "ROAD", instructor_id: "${iid}", truck_id: "${tid}", starts_at: "2026-03-12T09:00:00Z", duration_minutes: 60 }
              as: Registrar
              captures: { road: $.data.id }
            - call: "POST /clock-sessions/${road}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${iid}"
            - call: "POST /enrollments/${eid}/skills-tests"
              payload: { examiner_id: "${xid}" }
              as: Registrar
              captures: { test: $.data.id }
            - call: "POST /skills-tests/${test}/grade"
              payload: { pre_trip_score: 90, basic_control_score: 90, road_score: 90 }
              as: ThirdPartyExaminer
              as_user_id: "${xid}"
            - call: "POST /enrollments/${eid}/completion-reports"
              payload: { passing_test_id: "${test}" }
              as: SchoolAdmin
              captures: { rpt: $.data.id }
            - call: "POST /completion-reports/${rpt}/transmit"
              payload: {}
              as: SchoolAdmin
          trigger:
            - call: "POST /enrollments/${eid}/withdraw"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: complete_session_before_elapsed_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.ClockSession.BOOKED_to_COMPLETED, "errors[ERR_SESSION_NOT_ELAPSED]"]
        distinguishing_aspect: "Completing a session whose starts_at + duration is in the future (after the clock is set earlier) returns ERR_SESSION_NOT_ELAPSED (409)."
        test_recipe:
          setup: ["enrollment in TRAINING; clock set to 2026-04-01; a CLASSROOM session scheduled for 2026-05-01 (not yet elapsed)"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 1, range_required_hours: 1, road_required_hours: 1, tuition_cents: 700000 }
              as: SchoolAdmin
              captures: { pid: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ivy", cdl_class: "CLASS_B" }
              as: SchoolAdmin
              captures: { iid: $.data.id }
            - call: "POST /enrollments"
              payload: { program_id: "${pid}", student_name: "Sam" }
              as: Registrar
              captures: { eid: $.data.id }
            - call: "POST /enrollments/${eid}/prereq-documents"
              payload: { kind: "DOT_MEDICAL", reference_code: "M", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { med: $.data.id }
            - call: "POST /enrollments/${eid}/prereq-documents"
              payload: { kind: "CLP_PERMIT", reference_code: "C", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { clp: $.data.id }
            - call: "POST /prereq-documents/${med}/approve"
              payload: {}
              as: Registrar
            - call: "POST /prereq-documents/${clp}/approve"
              payload: {}
              as: Registrar
            - call: "POST /enrollments/${eid}/clock-sessions"
              payload: { phase: "CLASSROOM", instructor_id: "${iid}", starts_at: "2026-05-01T09:00:00Z", duration_minutes: 60 }
              as: Registrar
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /clock-sessions/${sid}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${iid}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SESSION_NOT_ELAPSED"
            - "http status == 409"

      - name: void_completed_session_after_passed_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.ClockSession.COMPLETED_to_CANCELLED, "errors[ERR_SESSION_LOCKED]"]
        distinguishing_aspect: "Administratively voiding a COMPLETED session once the enrollment is PASSED returns ERR_SESSION_LOCKED (409)."
        test_recipe:
          setup: ["enrollment PASSED with a COMPLETED ROAD session that qualified it"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 0, range_required_hours: 0, road_required_hours: 1, tuition_cents: 700000, skills_pass_threshold: 80 }
              as: SchoolAdmin
              captures: { pid: $.data.id }
            - call: "POST /trucks"
              payload: { unit_number: "T1", cdl_class: "CLASS_B" }
              as: SchoolAdmin
              captures: { tid: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ivy", cdl_class: "CLASS_B" }
              as: SchoolAdmin
              captures: { iid: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ed", cdl_class: "CLASS_B", examiner_certified: true }
              as: SchoolAdmin
              captures: { xid: $.data.id }
            - call: "POST /enrollments"
              payload: { program_id: "${pid}", student_name: "Sam" }
              as: Registrar
              captures: { eid: $.data.id }
            - call: "POST /enrollments/${eid}/prereq-documents"
              payload: { kind: "DOT_MEDICAL", reference_code: "M", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { med: $.data.id }
            - call: "POST /enrollments/${eid}/prereq-documents"
              payload: { kind: "CLP_PERMIT", reference_code: "C", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { clp: $.data.id }
            - call: "POST /prereq-documents/${med}/approve"
              payload: {}
              as: Registrar
            - call: "POST /prereq-documents/${clp}/approve"
              payload: {}
              as: Registrar
            - call: "POST /enrollments/${eid}/clock-sessions"
              payload: { phase: "ROAD", instructor_id: "${iid}", truck_id: "${tid}", starts_at: "2026-03-12T09:00:00Z", duration_minutes: 60 }
              as: Registrar
              captures: { road: $.data.id }
            - call: "POST /clock-sessions/${road}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${iid}"
            - call: "POST /enrollments/${eid}/skills-tests"
              payload: { examiner_id: "${xid}" }
              as: Registrar
              captures: { test: $.data.id }
            - call: "POST /skills-tests/${test}/grade"
              payload: { pre_trip_score: 90, basic_control_score: 90, road_score: 90 }
              as: ThirdPartyExaminer
              as_user_id: "${xid}"
          trigger:
            - call: "POST /clock-sessions/${road}/cancel"
              payload: {}
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SESSION_LOCKED"
            - "http status == 409"

      - name: approve_expired_document_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.PrereqDocument.SUBMITTED_to_APPROVED, "validations[priority=7]", "errors[ERR_DOCUMENT_EXPIRED]"]
        distinguishing_aspect: "Approving a SUBMITTED document whose expires_on is at or before the current clock time returns ERR_DOCUMENT_EXPIRED (409)."
        test_recipe:
          setup: ["clock at 2026-04-01 default; a SUBMITTED document with expires_on 2026-03-01 (already past)"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 1, range_required_hours: 1, road_required_hours: 1, tuition_cents: 700000 }
              as: SchoolAdmin
              captures: { pid: $.data.id }
            - call: "POST /enrollments"
              payload: { program_id: "${pid}", student_name: "Sam" }
              as: Registrar
              captures: { eid: $.data.id }
            - call: "POST /enrollments/${eid}/prereq-documents"
              payload: { kind: "DOT_MEDICAL", reference_code: "M", expires_on: "2026-03-01T00:00:00Z" }
              as: Registrar
              captures: { did: $.data.id }
          trigger:
            - call: "POST /prereq-documents/${did}/approve"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DOCUMENT_EXPIRED"
            - "http status == 409"

      - name: cancel_already_cancelled_session_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.ClockSession.BOOKED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a ClockSession already CANCELLED returns ERR_INVALID_STATE (409); reserved_minutes is not decremented twice."
        test_recipe:
          setup: ["enrollment in TRAINING with one BOOKED 60-min RANGE session already cancelled"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 1, range_required_hours: 1, road_required_hours: 1, tuition_cents: 700000 }
              as: SchoolAdmin
              captures: { pid: $.data.id }
            - call: "POST /trucks"
              payload: { unit_number: "T1", cdl_class: "CLASS_B" }
              as: SchoolAdmin
              captures: { tid: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ivy", cdl_class: "CLASS_B" }
              as: SchoolAdmin
              captures: { iid: $.data.id }
            - call: "POST /enrollments"
              payload: { program_id: "${pid}", student_name: "Sam" }
              as: Registrar
              captures: { eid: $.data.id }
            - call: "POST /enrollments/${eid}/prereq-documents"
              payload: { kind: "DOT_MEDICAL", reference_code: "M", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { med: $.data.id }
            - call: "POST /enrollments/${eid}/prereq-documents"
              payload: { kind: "CLP_PERMIT", reference_code: "C", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { clp: $.data.id }
            - call: "POST /prereq-documents/${med}/approve"
              payload: {}
              as: Registrar
            - call: "POST /prereq-documents/${clp}/approve"
              payload: {}
              as: Registrar
            - call: "POST /enrollments/${eid}/clock-sessions"
              payload: { phase: "RANGE", instructor_id: "${iid}", truck_id: "${tid}", starts_at: "2026-03-20T09:00:00Z", duration_minutes: 60 }
              as: Registrar
              captures: { sid: $.data.id }
            - call: "POST /clock-sessions/${sid}/cancel"
              payload: {}
              as: Instructor
              as_user_id: "${iid}"
          trigger:
            - call: "POST /clock-sessions/${sid}/cancel"
              payload: {}
              as: Instructor
              as_user_id: "${iid}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

