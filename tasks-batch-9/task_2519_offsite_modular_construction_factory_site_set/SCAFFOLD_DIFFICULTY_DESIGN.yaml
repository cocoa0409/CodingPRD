            - call: "POST /modular/modules/${m2}/schedule-pick"
              payload: { pick_window_start: "2026-09-10T10:15:00Z", pick_window_end: "2026-09-10T11:00:00Z", pick_radius_ft: 90, rigging_weight_lb: 5000 }
              as: SiteSuperintendent
