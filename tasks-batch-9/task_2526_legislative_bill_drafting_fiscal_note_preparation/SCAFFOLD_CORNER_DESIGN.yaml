              as: AgencyAnalyst
              as_user_id: "${a1_id}"
              captures: { nv4: $.data.version }
            - call: "POST /fiscal-note-requests/${n1_id}/cost-estimates"
              payload: { expected_fiscal_note_request_version: "${nv4}", fiscal_year: 2027, scenario: "BASELINE", personnel_cost_cents: 5000000, operating_cost_cents: 2000000, one_time_cost_cents: 0, fte_count: 1.0, revenue_impact_cents: 0, assumption_note: "Round two line filed against the post-return version." }
              as: AgencyAnalyst
              as_user_id: "${a1_id}"
            - call: "GET /fiscal-note-requests/${n1_id}/cost-estimates"
              payload: { revision_round: 2, limit: 20, offset: 0 }
              as: AgencyAnalyst
              as_user_id: "${a1_id}"
          assert:
            - "First line with ${nv1} -> 201; the second line replaying ${nv1} -> 412 ERR_STALE_FISCAL_NOTE_VERSION"
            - "nv2 == nv1 + 1 and nv3 == nv2 + 1: each accepted line bumps the note version, the refused one does not"
            - "The pre-return replay of ${nv3} -> 412 ERR_STALE_FISCAL_NOTE_VERSION — the officer's return also moved the version, so a version can go stale without the analyst writing anything"
            - "nv4 > nv3 and the same line filed with ${nv4} -> 201 with revision_round 2"
            - "GET the cost-estimate sub-resource filtered to revision_round 2 -> total_count 1: only the last line landed in the new round"
            - "CostEstimate rows carry no version field of their own (common_fields false), so the note's version is the only concurrency token in this lane"

