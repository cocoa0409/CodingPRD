          rationale: "The URGENT-referral side of the error catalogue - ERR_ATHLETE_MEDICAL_HOLD raised against an athlete on hold and the posture flip to RESTRICTED that raises ERR_PROGRAM_POSTURE_RESTRICTED on competition traffic - is triggered end-to-end by the §1.8 cascade instance, which drives the hold, the entry voids, the counter increment and the release. A separate §1.9 triggerability probe would replay the same calls."

