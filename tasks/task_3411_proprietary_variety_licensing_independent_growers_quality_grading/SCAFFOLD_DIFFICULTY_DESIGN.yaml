              as: GrowerPrincipal
              as_user_id: "${g5_id}"
              captures: { a5_id: $.data.id }
            - call: "POST /licensing/agreements/${a5_id}/decide"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              captures: { a5_v: $.data.version }
            - call: "POST /licensing/harvest-windows"
              payload: { region_code: "WA-SKAGIT", variety_id: "${v3_id}", week_start: "2026-10-26T00:00:00Z", week_end: "2026-11-02T00:00:00Z", target_volume_kg: 5000 }
