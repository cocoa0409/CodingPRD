            - "EnrollmentCounselor.${cob_id}.incentive_eligibility == PENDING_COMPLIANCE_REVIEW"

      - name: program_state_error_precedes_the_enrollment_cap_error
        claim_type: priority_ordering
        grounds:
          - validations[priority 19 ERR_PROGRAM_INVALID_STATE]
          - validations[priority 44 ERR_ENROLLMENT_CAP_REACHED]
        excluded_because:
          difficulty_instance: suspended_program_state_error_wins_over_enrollment_cap_reached
          rationale: "The state-versus-fiscal priority pair is exactly the named §1.8 instance."

      - name: incentive_prohibition_error_precedes_the_envelope_error
        claim_type: priority_ordering
        grounds:
