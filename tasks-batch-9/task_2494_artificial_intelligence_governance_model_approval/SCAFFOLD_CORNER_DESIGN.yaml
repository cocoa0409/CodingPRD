      - name: grade_d_assessment_cannot_approve_asset_for_use
        claim_type: error_triggerable
        grounds: ["errors[ERR_VENDOR_ASSESSMENT_NOT_ACCEPTED]", "validations[p31]", calculations.vendor_terms_grade]
        distinguishing_aspect: "An ACCEPTED assessment is not enough: grade D is outside the admissible set {A, B, C}, so approve-for-use on the third-party asset is refused 422 ERR_VENDOR_ASSESSMENT_NOT_ACCEPTED."
        test_recipe:
          setup: ["Third-party asset with one assessment declaring UNDISCLOSED provenance, VENDOR_RETAINS output rights, no retention_days, no opt-out and undisclosed subprocessors. Under CONSERVATIVE_LEGAL that grades 20 + 10 surcharge + 16 + 18 (assumed worst retention 3650 days) + 6 + 5 = 75 points -> D, and the officer accepts it on that variant anyway."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /model-assets", payload: {provider: "Nimbus AI", model_name: "nimbus-chat", model_version: "3.2.0", hosting: "VENDOR_API", modality: "TEXT", is_third_party: true}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {asset: "$.data.id"}}
            - {call: "POST /model-assets/{id}/vendor-assessments", payload: {vendor_name: "Nimbus AI", training_data_provenance: "UNDISCLOSED", output_rights: "VENDOR_RETAINS", retention_opt_out: false, subprocessors_disclosed: false}, as: LegalReviewer, as_user_id: "usr_legal_1", captures: {vma: "$.data.id", vma_points: "$.data.terms_risk_points"}}
            - {call: "POST /vendor-assessments/{id}/decide", payload: {decision: "ACCEPT", terms_variant: "CONSERVATIVE_LEGAL", decision_rationale: "accepted with a documented grade-D risk position"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          trigger:
            - {call: "POST /model-assets/{id}/approve-for-use", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {err: "$.data.error_id"}}
          assert:
            - "at submission the row carried effective_retention_days 3650, terms_risk_points 75 and terms_grade D"
            - "after the ACCEPT the assessment is ACCEPTED and the asset's vendor_terms_grade == D"
            - "HTTP 422 with data.error_id == ERR_VENDOR_ASSESSMENT_NOT_ACCEPTED"
            - "the asset is still REGISTERED at version 1 and cannot be bound to any use case"

