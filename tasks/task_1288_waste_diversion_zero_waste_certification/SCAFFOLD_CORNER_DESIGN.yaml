              as: SustainabilityManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: SustainabilityManager
            - call: "POST /scorecard_periods"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2026-09-01" }
              as: CertificationOfficer
              captures: { period_id: $.data.id }
            - call: "POST /tickets"
