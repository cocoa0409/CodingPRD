scenario: |
  307. Stadium & Venue Concessions: stand/kiosk & menu by event, par stock & runner
  replenishment, event-day pricing, cashless/mobile order pickup, inventory transfer
  between stands, spoilage/waste, venue revenue share, peak-rush staffing
domain_name: stadium-venue-concessions
api_prefix: /concessions

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: hybrid
  # Event -> Stand -> MenuItem hierarchy; InventoryLot/Replenishment/Transfer/Order/
  # OrderLine/StaffShift/WasteRecord/RevenueShareStatement are cross-cutting peers
  # joined by FK references across the Event/Stand tree and the Product catalog.

  state_machine_shape: branching
  # Order carries PARALLEL dimensions (payment_status x fulfillment_status); Stand and
  # Transfer branch with revert; Event is compound (settle gated by child Stand states).

  relationship_patterns:
    - one_to_many        # Event->Stand, Stand->MenuItem, Stand->InventoryLot, Order->OrderLine
    - many_to_many       # Stand x Product via MenuItem; Stand x Stand via Transfer
    - cross_aggregate    # Order references Stand+Event; RevenueShareStatement aggregates Orders+WasteRecords

  role_model: peer_roles
  # ConcessionsManager configures events/stands/menus/pricing; StockRunner moves
  # inventory (replenishment + transfer + waste); StandOperator opens/closes stands and
  # fulfills order pickups; Patron places and cancels mobile orders.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Venue
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Stadium / venue display name.
        constraints: non-empty, max 120 chars
      - name: venue_share_pct
        type: number
        source: input
        description: Percentage of qualifying sales the venue retains under the concession contract.
        constraints: 0 <= venue_share_pct <= 100, up to 2 decimals
      - name: service_fee_pct
        type: number
        source: input
        description: Venue-wide service surcharge percentage applied per order line in order_totals.
        constraints: 0 <= service_fee_pct <= 100, up to 2 decimals
      - name: share_basis
        type: enum
        source: input
        description: Which sales base the venue share is computed on. GROSS = qualifying gross sales; NET = gross sales minus spoilage/waste cost first.
        default: GROSS
        constraints: one of {GROSS, NET}
      - name: spoilage_valuation
        type: enum
        source: input
        description: How wasted inventory is costed. FIFO = oldest lot unit_cost first; WEIGHTED_AVG = weighted-average unit_cost across all lots of the product at the stand.
        default: FIFO
        constraints: one of {FIFO, WEIGHTED_AVG}

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; the venue whose catalog this product belongs to."
      - name: sku
        type: string
        source: input
        description: Stable catalog code, unique within a venue.
        constraints: non-empty; unique per (venue_id, sku)
      - name: name
        type: string
        source: input
        description: Product display name (e.g. "Hot Dog").
        constraints: non-empty
      - name: base_price_cents
        type: integer
        source: input
        description: Catalog base price in whole cents before any event-day pricing.
        constraints: ">= 0"
      - name: unit_cost_cents
        type: integer
        source: input
        description: Default acquisition cost per unit in cents; used when an InventoryLot omits its own lot cost.
        constraints: ">= 0"
      - name: perishable
        type: boolean
        source: input
        description: Whether the product spoils and is subject to expiry-driven waste.
        default: false

  - name: Event
    parent: Venue
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; the venue hosting this event."
      - name: name
        type: string
        source: input
        description: Event display name (e.g. "Game 4 - Finals").
        constraints: non-empty
      - name: doors_time
        type: datetime
        source: input
        description: Scheduled doors-open timestamp (ISO 8601 UTC); start of the event's operating window at the venue.
      - name: end_time
        type: datetime
        source: input
        description: Scheduled event end timestamp (ISO 8601 UTC); must be strictly after doors_time. End of the operating window.
      - name: event_multiplier_pct
        type: integer
        source: input
        description: Event-day price multiplier applied to every product's base price, as a percentage (120 = +20%).
        default: 100
        constraints: 50 <= event_multiplier_pct <= 300
      - name: peak_window
        type: boolean
        source: computed
        description: Whether the event is currently inside its declared peak-rush window; toggled by the peak-window open/close endpoints. Drives surge pricing and staffing.
        default: false
      - name: status
        type: enum
        source: computed
        description: Event lifecycle. See §1.2.
        default: SCHEDULED
        constraints: one of {SCHEDULED, DOORS_OPEN, IN_PROGRESS, SETTLED}
      - name: gross_sales_cents
        type: integer
        source: computed
        description: Running sum of total_cents over this event's Orders that have reached fulfillment_status PICKED_UP and are not REFUNDED. Maintained on pickup and reversed on refund.
        default: 0
      - name: waste_cost_cents
        type: integer
        source: computed
        description: Running sum of cost_cents over WasteRecords logged against this event's stands. Increased when waste is posted.
        default: 0

  - name: Stand
    parent: Event
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the event this stand serves."
      - name: name
        type: string
        source: input
        description: Stand / kiosk display name (e.g. "Section 114 Grill").
        constraints: non-empty
      - name: demand_tier
        type: enum
        source: input
        description: Demand tier driving the surge step in event-day pricing.
        default: MID
        constraints: one of {LOW, MID, HIGH}
      - name: expected_orders_per_hour
        type: integer
        source: input
        description: Forecast hourly order volume used to size required staffing.
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: Stand operational state. See §1.2.
        default: CLOSED
        constraints: one of {CLOSED, OPEN, SUSPENDED}
      - name: required_staff
        type: integer
        source: computed
        description: Number of operators required for current conditions; recomputed by the staffing calculation when the stand opens or the event peak window toggles.
        default: 0
      - name: assigned_staff_count
        type: integer
        source: computed
        description: Count of StaffShift rows in CHECKED_IN state assigned to this stand. Maintained on shift check-in/check-out.
        default: 0

  - name: MenuItem
    parent: Stand
    common_fields: true
    fields:
      - name: stand_id
        type: string
        source: input
        description: "FK -> Stand.id; the stand offering this item."
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the catalog product offered."
      - name: available
        type: boolean
        source: input
        description: Whether the item is currently sellable on this stand's menu.
        default: true
      - name: price_cents
        type: integer
        source: computed
        description: Event-day price for this item, computed by the event-day pricing calculation from product base price, event multiplier, stand demand tier, and event peak_window. Recomputed when the event peak window toggles.
        default: 0

  - name: InventoryLot
    parent: Stand
    common_fields: true
    fields:
      - name: stand_id
        type: string
        source: input
        description: "FK -> Stand.id; the stand holding this lot."
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the product stocked in this lot."
      - name: received_qty
        type: integer
        source: input
        description: Units originally received into this lot.
        constraints: "> 0"
      - name: remaining_qty
        type: integer
        source: computed
        description: Units still on hand in this lot; decremented by order pickup (FIFO), transfer out, and waste; incremented by transfer in. Initialized to received_qty.
        default: 0
      - name: unit_cost_cents
        type: integer
        source: input
        description: Acquisition cost per unit for this specific lot in cents; defaults to the Product.unit_cost_cents when omitted.
        constraints: ">= 0"
      - name: par_level
        type: integer
        source: input
        description: Target on-hand units the stand should keep of this product.
        constraints: ">= 0"
      - name: reorder_point
        type: integer
        source: input
        description: On-hand threshold at or below which replenishment is suggested.
        constraints: 0 <= reorder_point <= par_level
      - name: expires_at
        type: datetime
        source: input
        description: Expiry timestamp for perishable lots; null for non-perishable.
        default: null
      - name: status
        type: enum
        source: computed
        description: Lot lifecycle. See §1.2.
        default: ACTIVE
        constraints: one of {ACTIVE, DEPLETED, EXPIRED}

  - name: Replenishment
    parent: null
    common_fields: true
    fields:
      - name: stand_id
        type: string
        source: input
        description: "FK -> Stand.id; the destination stand to be replenished."
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the product to refill."
      - name: requested_qty
        type: integer
        source: input
        description: Units requested from the commissary depot.
        constraints: "> 0"
      - name: fulfilled_qty
        type: integer
        source: computed
        description: Units actually delivered into a new InventoryLot when the runner completes the run; <= requested_qty if depot stock is short.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Replenishment lifecycle. See §1.2.
        default: REQUESTED
        constraints: one of {REQUESTED, PICKING, DELIVERED, CANCELLED}

  - name: Transfer
    parent: null
    common_fields: true
    fields:
      - name: from_stand_id
        type: string
        source: input
        description: "FK -> Stand.id; the source stand giving up inventory."
      - name: to_stand_id
        type: string
        source: input
        description: "FK -> Stand.id; the destination stand receiving inventory."
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the product being moved."
      - name: qty
        type: integer
        source: input
        description: Units to move from source to destination.
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: Transfer lifecycle. See §1.2.
        default: DRAFT
        constraints: one of {DRAFT, IN_TRANSIT, COMPLETED, CANCELLED}

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the event the order is placed at."
      - name: stand_id
        type: string
        source: input
        description: "FK -> Stand.id; the stand the order will be picked up from."
      - name: patron_id
        type: string
        source: input
        description: "FK -> Patron.id; the patron who placed the mobile order."
      - name: subtotal_cents
        type: integer
        source: computed
        description: Sum of OrderLine line_subtotal_cents across the order's lines.
        default: 0
      - name: service_fee_cents
        type: integer
        source: computed
        description: Sum of OrderLine line_fee_cents (venue service surcharge rounded per line then summed). See §1.3.
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: subtotal_cents + service_fee_cents.
        default: 0
      - name: payment_status
        type: enum
        source: computed
        description: Payment dimension of the order's parallel state machine. See §1.2.
        default: UNPAID
        constraints: one of {UNPAID, PAID, REFUNDED}
      - name: fulfillment_status
        type: enum
        source: computed
        description: Fulfillment dimension of the order's parallel state machine. See §1.2.
        default: CART
        constraints: one of {CART, PLACED, READY, PICKED_UP, CANCELLED}

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the order this line belongs to."
      - name: menu_item_id
        type: string
        source: input
        description: "FK -> MenuItem.id; the menu item ordered."
      - name: qty
        type: integer
        source: input
        description: Quantity of the menu item.
        constraints: "> 0"
      - name: unit_price_cents
        type: integer
        source: computed
        description: Snapshot of MenuItem.price_cents captured when the line was added to the cart; immune to later price recomputation.
        default: 0
      - name: line_subtotal_cents
        type: integer
        source: computed
        description: unit_price_cents * qty.
        default: 0
      - name: line_fee_cents
        type: integer
        source: computed
        description: round_half_up(line_subtotal_cents * Venue.service_fee_pct / 100). See §1.3.
        default: 0

  - name: StaffShift
    parent: null
    common_fields: true
    fields:
      - name: stand_id
        type: string
        source: input
        description: "FK -> Stand.id; the stand the worker is assigned to."
      - name: worker_name
        type: string
        source: input
        description: Worker display name.
        constraints: non-empty
      - name: shift_start
        type: datetime
        source: input
        description: Scheduled shift start (ISO 8601 UTC).
      - name: shift_end
        type: datetime
        source: input
        description: Scheduled shift end (ISO 8601 UTC); must be strictly after shift_start.
      - name: status
        type: enum
        source: computed
        description: Shift lifecycle. See §1.2.
        default: SCHEDULED
        constraints: one of {SCHEDULED, CHECKED_IN, CHECKED_OUT, CANCELLED}

  - name: WasteRecord
    parent: null
    common_fields: false
    fields:
      - name: stand_id
        type: string
        source: input
        description: "FK -> Stand.id; the stand where waste occurred."
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the wasted product."
      - name: lot_id
        type: string
        source: input
        description: "FK -> InventoryLot.id; the specific lot waste was drawn from for an EXPIRY-reason record; null for SPILLAGE which is valued across lots."
        default: null
      - name: reason
        type: enum
        source: input
        description: Why the units were wasted.
        constraints: one of {EXPIRY, SPILLAGE, DAMAGE}
      - name: qty
        type: integer
        source: input
        description: Units wasted.
        constraints: "> 0"
      - name: cost_cents
        type: integer
        source: computed
        description: Costed value of the wasted units per the venue's spoilage_valuation policy. See §1.3.
        default: 0

  - name: RevenueShareStatement
    parent: Event
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the settled event this statement covers."
      - name: gross_sales_cents
        type: integer
        source: computed
        description: Snapshot of Event.gross_sales_cents at settlement.
        default: 0
      - name: waste_cost_cents
        type: integer
        source: computed
        description: Snapshot of Event.waste_cost_cents at settlement.
        default: 0
      - name: venue_share_cents
        type: integer
        source: computed
        description: Amount retained by the venue, computed per Venue.share_basis and venue_share_pct. See §1.3.
        default: 0
      - name: operator_net_cents
        type: integer
        source: computed
        description: gross_sales_cents - venue_share_cents; the concession operator's net take.
        default: 0

  - name: Patron
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: Patron display name.
        constraints: non-empty
      - name: wallet_credit_cents
        type: integer
        source: computed
        description: Stored cashless wallet credit balance; refunds of cancelled paid orders are credited here.
        default: 0

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Event
    initial_state: SCHEDULED
    terminal_states: [SETTLED]
    transitions:
      - from: SCHEDULED
        to: DOORS_OPEN
        trigger: "POST /concessions/events/{id}/open-doors"
        actor: ConcessionsManager
        preconditions:
          - "event.status == SCHEDULED"
          - "at least one Stand exists for the event"
        side_effects:
          - "no inventory or pricing change; gates Stand opening"
      - from: DOORS_OPEN
        to: IN_PROGRESS
        trigger: "POST /concessions/events/{id}/peak-window/open"
        actor: ConcessionsManager
        preconditions:
          - "event.status == DOORS_OPEN"
        side_effects:
          - "set event.peak_window = true"
          - "recompute MenuItem.price_cents for every MenuItem under every Stand of this event (surge step gains PEAK_BONUS)"
          - "recompute Stand.required_staff for every OPEN stand of this event (peak bump applied)"
        note: "Opening the peak window both advances the event lifecycle and toggles surge pricing/staffing; this is the depth-3 cascade root."
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /concessions/events/{id}/peak-window/close"
        actor: ConcessionsManager
        preconditions:
          - "event.status == IN_PROGRESS"
          - "event.peak_window == true"
        side_effects:
          - "set event.peak_window = false"
          - "recompute MenuItem.price_cents for every MenuItem under every Stand of this event (PEAK_BONUS removed)"
          - "recompute Stand.required_staff for every OPEN stand of this event (peak bump removed)"
        note: "Self-loop on IN_PROGRESS: the window may close (and later re-open) without leaving IN_PROGRESS — the cyclic/parallel shape lives on the peak_window flag."
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /concessions/events/{id}/peak-window/open"
        actor: ConcessionsManager
        preconditions:
          - "event.status == IN_PROGRESS"
          - "event.peak_window == false"
        side_effects:
          - "set event.peak_window = true"
          - "recompute MenuItem.price_cents for every MenuItem under every Stand of this event"
          - "recompute Stand.required_staff for every OPEN stand of this event"
        note: "Re-opening the window after a close; same recompute cascade."
      - from: IN_PROGRESS
        to: SETTLED
        trigger: "POST /concessions/events/{id}/settle"
        actor: ConcessionsManager
        preconditions:
          - "event.status == IN_PROGRESS"
          - "every Stand of this event is in status CLOSED (cross-entity gate)"
          - "no Order of this event is in fulfillment_status PLACED or READY (unfulfilled orders block settlement)"
        side_effects:
          - "set event.peak_window = false if still true"
          - "create one RevenueShareStatement snapshotting gross_sales_cents and waste_cost_cents and computing venue_share_cents (see §1.3)"
        note: "Compound gate: settlement depends on the aggregate state of child Stands and child Orders."

  - entity: Stand
    initial_state: CLOSED
    terminal_states: []
    transitions:
      - from: CLOSED
        to: OPEN
        trigger: "POST /concessions/stands/{id}/open"
        actor: StandOperator
        preconditions:
          - "stand.status == CLOSED"
          - "parent event.status IN {DOORS_OPEN, IN_PROGRESS} (cross-entity gate)"
          - "stand.assigned_staff_count >= 1"
        side_effects:
          - "recompute Stand.required_staff via the staffing calculation (peak bump if event.peak_window)"
          - "menu items become sellable"
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /concessions/stands/{id}/suspend"
        actor: StandOperator
        preconditions:
          - "stand.status == OPEN"
        side_effects:
          - "ordering blocked; existing READY orders may still be picked up"
        note: "Branch-with-revert: a stand may bounce OPEN<->SUSPENDED during a rush."
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /concessions/stands/{id}/open"
        actor: StandOperator
        preconditions:
          - "stand.status == SUSPENDED"
          - "stand.assigned_staff_count >= 1"
        side_effects:
          - "recompute Stand.required_staff"
      - from: OPEN
        to: CLOSED
        trigger: "POST /concessions/stands/{id}/close"
        actor: StandOperator
        preconditions:
          - "stand.status == OPEN"
          - "no Order at this stand is in fulfillment_status PLACED or READY"
        side_effects:
          - "no further ordering at this stand"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /concessions/stands/{id}/close"
        actor: StandOperator
        preconditions:
          - "stand.status == SUSPENDED"
          - "no Order at this stand is in fulfillment_status PLACED or READY"
        side_effects:
          - "no further ordering at this stand"

  - entity: InventoryLot
    initial_state: ACTIVE
    terminal_states: [DEPLETED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: DEPLETED
        trigger: "system: remaining_qty reaches 0 via order pickup, transfer out, or waste"
        actor: system
        preconditions:
          - "lot.remaining_qty == 0 after a decrementing operation"
        side_effects:
          - "lot.status = DEPLETED; lot no longer eligible for FIFO consumption"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /concessions/stands/{id}/expire-lots (or system clock advance)"
        actor: StockRunner
        preconditions:
          - "lot.expires_at != null AND lot.expires_at <= current_utc"
          - "lot.remaining_qty > 0"
        side_effects:
          - "create a WasteRecord with reason EXPIRY for lot.remaining_qty (cost per §1.3 spoilage_valuation)"
          - "increment parent event.waste_cost_cents by the WasteRecord.cost_cents (cross-aggregate ledger sync)"
          - "set lot.remaining_qty = 0 and lot.status = EXPIRED"
        note: "Depth-3 cascade root: expire -> WasteRecord created -> Event.waste_cost_cents bumped -> (at settlement) RevenueShareStatement under NET basis shrinks venue_share."

  - entity: Replenishment
    initial_state: REQUESTED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: PICKING
        trigger: "POST /concessions/replenishments/{id}/pick"
        actor: StockRunner
        preconditions:
          - "replenishment.status == REQUESTED"
        side_effects: ["runner has accepted the pull from the depot"]
      - from: PICKING
        to: DELIVERED
        trigger: "POST /concessions/replenishments/{id}/deliver"
        actor: StockRunner
        preconditions:
          - "replenishment.status == PICKING"
          - "destination stand.status IN {OPEN, SUSPENDED, CLOSED} and belongs to a non-SETTLED event (cross-entity gate)"
        side_effects:
          - "set fulfilled_qty = requested_qty"
          - "create a new InventoryLot on the destination stand with received_qty = remaining_qty = fulfilled_qty, unit_cost_cents from the request's product default, status ACTIVE"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /concessions/replenishments/{id}/cancel"
        actor: StockRunner
        preconditions:
          - "replenishment.status == REQUESTED"
        side_effects: ["no inventory change"]
      - from: PICKING
        to: CANCELLED
        trigger: "POST /concessions/replenishments/{id}/cancel"
        actor: StockRunner
        preconditions:
          - "replenishment.status == PICKING"
        side_effects: ["no inventory change"]

  - entity: Transfer
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: IN_TRANSIT
        trigger: "POST /concessions/transfers/{id}/dispatch"
        actor: StockRunner
        preconditions:
          - "transfer.status == DRAFT"
          - "from_stand and to_stand belong to the same Event (cross-entity gate)"
          - "from_stand and to_stand are different stands"
          - "sum of ACTIVE-lot remaining_qty for product_id at from_stand >= qty"
        side_effects:
          - "debit qty from from_stand ACTIVE lots of product_id, oldest created_at first (FIFO); any lot reaching remaining_qty 0 -> DEPLETED"
          - "units are held in transit (not yet credited to destination)"
        note: "Conserved-quantity invariant root: units leave source now, arrive at destination on complete; in DRAFT->IN_TRANSIT->COMPLETED the global on-hand+in-transit sum is invariant."
      - from: IN_TRANSIT
        to: COMPLETED
        trigger: "POST /concessions/transfers/{id}/complete"
        actor: StockRunner
        preconditions:
          - "transfer.status == IN_TRANSIT"
          - "to_stand belongs to a non-SETTLED event"
        side_effects:
          - "credit qty to destination: create a new ACTIVE InventoryLot on to_stand with received_qty = remaining_qty = qty, unit_cost_cents = weighted-average unit_cost of the debited source lots"
      - from: IN_TRANSIT
        to: CANCELLED
        trigger: "POST /concessions/transfers/{id}/cancel"
        actor: StockRunner
        preconditions:
          - "transfer.status == IN_TRANSIT"
        side_effects:
          - "compensation: re-credit qty back to from_stand by creating a new ACTIVE InventoryLot on from_stand with received_qty = remaining_qty = qty and unit_cost_cents = weighted-average of the debited source lots; conserved on-hand quantity restored to its pre-dispatch total"
        note: "Compensating action for the dispatch debit; the global on-hand quantity returns to its pre-transfer value."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /concessions/transfers/{id}/cancel"
        actor: StockRunner
        preconditions:
          - "transfer.status == DRAFT"
        side_effects: ["no inventory change (nothing was debited yet)"]

  - entity: Order
    initial_state: "CART / UNPAID"
    terminal_states: ["PICKED_UP", "CANCELLED"]
    note: "Parallel dimensions: fulfillment_status (CART->PLACED->READY->PICKED_UP, plus ->CANCELLED) and payment_status (UNPAID->PAID->REFUNDED) evolve independently. Transitions below name the dimension each affects."
    transitions:
      - from: "fulfillment CART"
        to: "fulfillment PLACED"
        trigger: "POST /concessions/orders/{id}/place"
        actor: Patron
        preconditions:
          - "order.fulfillment_status == CART"
          - "order has >= 1 OrderLine"
          - "stand.status == OPEN (cross-entity gate; SUSPENDED/CLOSED rejected)"
          - "for each line, the menu item's stand has on-hand >= line qty across ACTIVE lots of the product"
        side_effects:
          - "recompute subtotal_cents, service_fee_cents, total_cents from lines (see §1.3)"
          - "soft-reserve nothing; stock is decremented at READY"
      - from: "fulfillment PLACED"
        to: "fulfillment PLACED"
        trigger: "POST /concessions/orders/{id}/pay"
        actor: Patron
        preconditions:
          - "order.payment_status == UNPAID"
          - "order.fulfillment_status == PLACED"
        side_effects:
          - "set payment_status = PAID"
          - "debit Patron wallet/cashless tender (out of scope to model balance; order recorded as PAID)"
        note: "Payment dimension transition; does not change fulfillment_status."
      - from: "fulfillment PLACED"
        to: "fulfillment READY"
        trigger: "POST /concessions/orders/{id}/ready"
        actor: StandOperator
        preconditions:
          - "order.fulfillment_status == PLACED"
          - "order.payment_status == PAID (cross-dimension gate)"
          - "for each line, on-hand across the stand's ACTIVE lots of the line's product >= line qty"
        side_effects:
          - "decrement on-hand for each line from the stand's ACTIVE lots of that product, oldest created_at first (FIFO); any lot hitting 0 -> DEPLETED"
      - from: "fulfillment READY"
        to: "fulfillment PICKED_UP"
        trigger: "POST /concessions/orders/{id}/pickup"
        actor: StandOperator
        preconditions:
          - "order.fulfillment_status == READY"
        side_effects:
          - "increment parent event.gross_sales_cents by order.total_cents (cross-aggregate ledger sync)"
      - from: "fulfillment PLACED"
        to: "fulfillment CANCELLED"
        trigger: "POST /concessions/orders/{id}/cancel"
        actor: Patron
        preconditions:
          - "order.fulfillment_status == PLACED (cannot cancel once READY/PICKED_UP)"
        side_effects:
          - "if payment_status == PAID: set payment_status = REFUNDED and credit Patron.wallet_credit_cents by order.total_cents (compensation; no stock was decremented because stock decrements at READY)"
          - "set fulfillment_status = CANCELLED"
        note: "Compensating action: refund returns exactly total_cents to the patron wallet; net charged conserved at 0."

  - entity: StaffShift
    initial_state: SCHEDULED
    terminal_states: [CHECKED_OUT, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /concessions/staff-shifts/{id}/check-in"
        actor: StandOperator
        preconditions:
          - "shift.status == SCHEDULED"
        side_effects:
          - "increment stand.assigned_staff_count by 1"
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /concessions/staff-shifts/{id}/check-out"
        actor: StandOperator
        preconditions:
          - "shift.status == CHECKED_IN"
        side_effects:
          - "decrement stand.assigned_staff_count by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /concessions/staff-shifts/{id}/cancel"
        actor: ConcessionsManager
        preconditions:
          - "shift.status == SCHEDULED"
        side_effects: ["no count change (was never checked in)"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: transfer-dispatch-stale-stand
    parent_entity: Stand
    write_endpoint: "POST /concessions/transfers/{id}/dispatch"
    occ_field: "expected_from_stand_version"
    description: |
      Dispatching a Transfer debits inventory from the source Stand's ACTIVE
      lots. The request carries the source Stand version the client last
      observed. If that version has advanced since the client read it -- because
      another inventory-moving operation (an order reaching READY, a prior
      transfer dispatch, an expire-lots sweep) already debited the same stand --
      the dispatch is rejected as operating on a stale view, so two writers
      cannot both spend the same on-hand units.
    error_id: ERR_STALE_STAND_VERSION
    http_status: 412

  - rule_id: order-ready-stale-stand
    parent_entity: Stand
    write_endpoint: "POST /concessions/orders/{id}/ready"
    occ_field: "expected_stand_version"
    description: |
      Marking an Order READY decrements on-hand from the order's Stand. The
      request carries the Stand version the operator last observed. If that
      version has advanced since (another order was marked READY, a transfer
      dispatched, or a lot expired off the same stand), the ready request is
      rejected as stale, preventing two fulfilments from drawing the same units.
    error_id: ERR_STALE_STAND_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: event_day_item_pricing
    trigger: "MenuItem creation; and recompute on event peak-window open/close transitions"
    algorithm: tiered_pricing
    formula: |
      surge_pct = TIER_SURGE[stand.demand_tier] + (PEAK_BONUS if event.peak_window else 0)
      raw = product.base_price_cents * (event.event_multiplier_pct / 100) * (surge_pct / 100)
      MenuItem.price_cents = round_half_up(raw)            # single round at the end, integer cents
    input_set: "the MenuItem's product base price, the parent event's multiplier and peak_window, and the parent stand's demand_tier"
    constants:
      TIER_SURGE: { LOW: 100, MID: 115, HIGH: 130 }
      PEAK_BONUS: 10
    precision: "integer cents, round_half_up applied once after the full multiplicative chain"
    variants: []
    note: "Combinatorial mode (a): three multiplicative inputs with a state-conditional surge selection (tier) and a conditional additive bonus (peak)."

  - name: order_totals
    trigger: "POST /concessions/orders/{id}/place (recompute subtotal/fee/total from current lines)"
    algorithm: aggregation
    formula: |
      for each OrderLine L (created_at ASC):
        L.unit_price_cents   = (snapshot taken when line added)   # immutable
        L.line_subtotal_cents = L.unit_price_cents * L.qty
        L.line_fee_cents      = round_half_up(L.line_subtotal_cents * Venue.service_fee_pct / 100)   # ROUND PER LINE
      Order.subtotal_cents    = sum(L.line_subtotal_cents)
      Order.service_fee_cents = sum(L.line_fee_cents)             # SUM the per-line rounded fees
      Order.total_cents       = Order.subtotal_cents + Order.service_fee_cents
    input_set: "all OrderLine rows of the order, processed oldest created_at first (order does not change the sum but pins a deterministic walk)"
    constants:
      SERVICE_FEE_PCT_SOURCE: "Venue.service_fee_pct (a Venue field; see note)"
    precision: "integer cents; round_half_up is applied PER LINE before summing, NOT after summing the subtotal"
    variants: []
    note: |
      Combinatorial mode (b): nested rounding where order matters. The scaffold PINS
      'round each line fee, then sum' -- which can differ by 1+ cents from 'sum line
      subtotals, then round the fee once'. Venue.service_fee_pct is the venue-wide
      service surcharge percentage (an input field on Venue).

  - name: revenue_share_settlement
    trigger: "POST /concessions/events/{id}/settle (creates the RevenueShareStatement)"
    algorithm: weighted_scoring
    formula: |
      gross = Event.gross_sales_cents      # snapshot at settlement
      waste = Event.waste_cost_cents       # snapshot at settlement
      base  = gross                        if Venue.share_basis == GROSS
            = max(0, gross - waste)        if Venue.share_basis == NET
      RevenueShareStatement.venue_share_cents  = round_half_up(base * Venue.venue_share_pct / 100)
      RevenueShareStatement.operator_net_cents = gross - venue_share_cents
    input_set: "the settling Event's gross_sales_cents and waste_cost_cents snapshots, and the Venue's share_basis + venue_share_pct"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: gross_basis
        when: "Venue.share_basis == GROSS"
        difference: "venue_share = round_half_up(gross_sales * pct/100); waste is ignored in the base."
      - name: net_basis
        when: "Venue.share_basis == NET"
        difference: "venue_share = round_half_up(max(0, gross_sales - waste_cost) * pct/100); spoilage shrinks the venue's base, so identical sales yield a smaller share."
    note: "Dual-variant #1, domain = Venue/Event revenue. Same gross+waste inputs, two contract bases produce different venue_share_cents."

  - name: spoilage_valuation
    trigger: "WasteRecord creation (manual SPILLAGE/DAMAGE post, or system EXPIRY on lot expiry)"
    algorithm: chronological
    formula: |
      Let candidate lots = ACTIVE+EXPIRED InventoryLots of (stand_id, product_id) that the waste draws from.
      FIFO variant:
        walk candidate lots by created_at ASC; cost = sum over consumed lots of (units_from_lot * lot.unit_cost_cents)
        until qty units are costed.
      WEIGHTED_AVG variant:
        wavg = round_half_up( sum(lot.remaining_qty_at_waste_time * lot.unit_cost_cents) / sum(lot.remaining_qty_at_waste_time) )
        cost = qty * wavg
      WasteRecord.cost_cents = (FIFO cost) if Venue.spoilage_valuation == FIFO else (WEIGHTED_AVG cost)
    input_set: "InventoryLots of the product at the stand, by created_at ASC; for EXPIRY the lot_id pins the single source lot, for SPILLAGE/DAMAGE the cost is drawn across lots per the policy"
    constants: {}
    precision: "integer cents, round_half_up (weighted average rounded before multiplying)"
    variants:
      - name: fifo
        when: "Venue.spoilage_valuation == FIFO"
        difference: "oldest lot unit_cost consumed first; cost depends on lot ordering by created_at."
      - name: weighted_avg
        when: "Venue.spoilage_valuation == WEIGHTED_AVG"
        difference: "single blended unit cost across all on-hand lots; cost = qty * wavg, independent of lot ordering."
    note: "Dual-variant #2, domain = InventoryLot/waste costing. Different entity domain from revenue_share_settlement; identical waste qty yields different cost_cents under FIFO vs WEIGHTED_AVG."

  - name: required_staffing
    trigger: "Stand open/reopen transition; and recompute on event peak-window open/close"
    algorithm: threshold
    formula: |
      base = ceil(stand.expected_orders_per_hour / STAFF_THROUGHPUT)
      Stand.required_staff = base + (PEAK_STAFF_BONUS if event.peak_window else 0)
    input_set: "the stand's expected_orders_per_hour and the parent event's peak_window flag"
    constants:
      STAFF_THROUGHPUT: 40
      PEAK_STAFF_BONUS: 1
    precision: "integer count; ceiling division"
    variants: []
    note: "Boundary precision: expected_orders_per_hour exactly == k*40 yields ceil = k (no extra worker), == k*40 + 1 yields k+1."

  - name: replenishment_suggestion
    trigger: "GET /concessions/stands/{id}/replenishment-suggestions (read-only advisory)"
    algorithm: threshold
    formula: |
      for each (product_id) stocked at the stand:
        on_hand = sum(remaining_qty) over ACTIVE InventoryLots of (stand_id, product_id)
        par     = max(par_level) over those lots          # par/reorder are lot-declared; take the max declared
        reorder = max(reorder_point) over those lots
        if on_hand <= reorder:                            # <= : at reorder_point triggers
           suggested_qty = par - on_hand
           emit { product_id, on_hand, suggested_qty }
    input_set: "ACTIVE InventoryLots grouped by product at the stand"
    constants: {}
    precision: "integer units"
    variants: []
    note: "Boundary precision on a DIFFERENT metric/endpoint than required_staffing: on_hand == reorder_point triggers a suggestion (<=), on_hand == reorder_point + 1 does not."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the X-User-Role is permitted to call this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every path/body referenced resource exists, validated left-to-right in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "ownership: a Patron acting on an Order must be that Order's patron_id"
    error_id: ERR_NOT_ORDER_OWNER
    http_status: 403
    applies_to: "Order mutation endpoints acted by Patron"

  - priority: 5
    category: state
    check: "target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches the live Stand.version (transfer dispatch, order ready)"
    error_id: ERR_STALE_STAND_VERSION
    http_status: 412
    applies_to: "POST /concessions/transfers/{id}/dispatch, POST /concessions/orders/{id}/ready"

  - priority: 7
    category: business_safety
    check: "a Stand cannot OPEN unless its parent Event is DOORS_OPEN or IN_PROGRESS"
    error_id: ERR_EVENT_NOT_OPENABLE
    http_status: 409
    applies_to: "POST /concessions/stands/{id}/open"

  - priority: 8
    category: business_safety
    check: "a Stand cannot OPEN with assigned_staff_count < 1 (no-staff safety gate)"
    error_id: ERR_UNDERSTAFFED_OPEN
    http_status: 409
    applies_to: "POST /concessions/stands/{id}/open"

  - priority: 9
    category: business_constraint
    check: "an Order can only be PLACED while its Stand.status == OPEN"
    error_id: ERR_STAND_NOT_OPEN
    http_status: 409
    applies_to: "POST /concessions/orders/{id}/place"

  - priority: 10
    category: business_constraint
    check: "an Order cannot be readied while payment_status != PAID"
    error_id: ERR_ORDER_UNPAID
    http_status: 409
    applies_to: "POST /concessions/orders/{id}/ready"

  - priority: 11
    category: business_temporal
    check: "a lot may only be EXPIRED if expires_at != null and expires_at <= current_utc"
    error_id: ERR_LOT_NOT_EXPIRED
    http_status: 409
    applies_to: "POST /concessions/stands/{id}/expire-lots"

  - priority: 12
    category: business_constraint
    check: "a Transfer's from_stand and to_stand must belong to the same Event and be distinct"
    error_id: ERR_CROSS_EVENT_TRANSFER
    http_status: 422
    applies_to: "POST /concessions/transfers, POST /concessions/transfers/{id}/dispatch"

  - priority: 13
    category: business_temporal
    check: "a new Event's [doors_time, end_time] window must not overlap any other non-SETTLED Event at the same venue; CLOSED-interval semantics, so a shared boundary instant (one event's end_time == another's doors_time) IS an overlap and is rejected"
    error_id: ERR_EVENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /concessions/events"

  - priority: 14
    category: business_temporal
    check: "a new StaffShift's [shift_start, shift_end) window must not overlap any non-CANCELLED shift for the same worker_name; HALF-OPEN semantics, so a back-to-back pair (prior shift_end == new shift_start) does NOT overlap and is allowed"
    error_id: ERR_SHIFT_OVERLAP
    http_status: 409
    applies_to: "POST /concessions/staff-shifts"

  - priority: 15
    category: business_constraint
    check: "for placing/readying an order, each line's product must have on_hand across ACTIVE lots >= line qty at the stand"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /concessions/orders/{id}/place, POST /concessions/orders/{id}/ready"

  - priority: 16
    category: business_fiscal
    check: "a Transfer dispatch requires source on_hand (sum of ACTIVE-lot remaining_qty for the product at from_stand) >= qty"
    error_id: ERR_TRANSFER_QTY_EXCEEDS_ONHAND
    http_status: 409
    applies_to: "POST /concessions/transfers/{id}/dispatch"

  - priority: 17
    category: business_fiscal
    check: "an Event may settle only if every child Stand is CLOSED and no child Order is PLACED or READY"
    error_id: ERR_EVENT_NOT_SETTLEABLE
    http_status: 409
    applies_to: "POST /concessions/events/{id}/settle"

  - priority: 18
    category: business_constraint
    check: "request body field types/ranges valid (enums in domain, qty > 0, percentages 0..100, shift_end > shift_start, end_time > doors_time, reorder_point <= par_level)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Venue ----
  - method: POST
    path: "/concessions/venues"
    description: "Create a venue with revenue-share contract terms."
    roles: [ConcessionsManager]
    code: 201
    input: [name, venue_share_pct, "share_basis?", "spoilage_valuation?", service_fee_pct]
    output: Venue
    side_effects: []
  - method: GET
    path: "/concessions/venues/{id}"
    description: "Fetch a venue."
    roles: [ConcessionsManager, StockRunner, StandOperator, Patron]
    code: 200
    input: []
    output: Venue
    side_effects: []

  # ---- Product ----
  - method: POST
    path: "/concessions/products"
    description: "Create a catalog product under a venue."
    roles: [ConcessionsManager]
    code: 201
    input: [venue_id, sku, name, base_price_cents, unit_cost_cents, "perishable?"]
    output: Product
    side_effects: []
  - method: GET
    path: "/concessions/products/{id}"
    description: "Fetch a product."
    roles: [ConcessionsManager, StockRunner, StandOperator, Patron]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: GET
    path: "/concessions/products"
    description: "List products, optionally filtered by venue."
    roles: [ConcessionsManager, StockRunner, StandOperator, Patron]
    code: 200
    input: ["venue_id?", "limit?", "offset?"]
    output: Product[]
    side_effects: []

  # ---- Event ----
  - method: POST
    path: "/concessions/events"
    description: "Create an event under a venue (status SCHEDULED). Rejects if its [doors_time, end_time] operating window overlaps another non-SETTLED event at the same venue (closed interval; a shared boundary instant counts as overlap)."
    roles: [ConcessionsManager]
    code: 201
    input: [venue_id, name, doors_time, end_time, "event_multiplier_pct?"]
    output: Event
    side_effects: []
  - method: GET
    path: "/concessions/events/{id}"
    description: "Fetch an event including gross_sales_cents/waste_cost_cents/peak_window."
    roles: [ConcessionsManager, StockRunner, StandOperator, Patron]
    code: 200
    input: []
    output: Event
    side_effects: []
  - method: GET
    path: "/concessions/venues/{id}/events"
    description: "List events for a venue (FK reverse-reachability for Event.venue_id)."
    roles: [ConcessionsManager, StockRunner, StandOperator, Patron]
    code: 200
    input: ["limit?", "offset?"]
    output: Event[]
    side_effects: []
  - method: POST
    path: "/concessions/events/{id}/open-doors"
    description: "Advance event SCHEDULED -> DOORS_OPEN."
    roles: [ConcessionsManager]
    code: 200
    input: []
    output: Event
    side_effects: ["event.status = DOORS_OPEN"]
  - method: POST
    path: "/concessions/events/{id}/peak-window/open"
    description: "Open the peak-rush window (DOORS_OPEN->IN_PROGRESS or IN_PROGRESS self-loop)."
    roles: [ConcessionsManager]
    code: 200
    input: []
    output: Event
    side_effects:
      - "event.peak_window = true; event.status = IN_PROGRESS"
      - "recompute every MenuItem.price_cents under the event (surge + PEAK_BONUS)"
      - "recompute Stand.required_staff for every OPEN stand of the event"
  - method: POST
    path: "/concessions/events/{id}/peak-window/close"
    description: "Close the peak-rush window (IN_PROGRESS self-loop)."
    roles: [ConcessionsManager]
    code: 200
    input: []
    output: Event
    side_effects:
      - "event.peak_window = false"
      - "recompute every MenuItem.price_cents under the event (PEAK_BONUS removed)"
      - "recompute Stand.required_staff for every OPEN stand of the event"
  - method: POST
    path: "/concessions/events/{id}/settle"
    description: "Settle the event; create the RevenueShareStatement."
    roles: [ConcessionsManager]
    code: 201
    input: []
    output: RevenueShareStatement
    side_effects:
      - "event.status = SETTLED"
      - "create RevenueShareStatement (revenue_share_settlement calculation)"
  - method: GET
    path: "/concessions/events/{id}/revenue-share-statement"
    description: "Fetch the settled event's RevenueShareStatement (FK reverse-reachability for RevenueShareStatement.event_id); array of 0 or 1."
    roles: [ConcessionsManager]
    code: 200
    input: []
    output: RevenueShareStatement[]
    side_effects: []

  # ---- Stand ----
  - method: POST
    path: "/concessions/stands"
    description: "Create a stand under an event."
    roles: [ConcessionsManager]
    code: 201
    input: [event_id, name, "demand_tier?", "expected_orders_per_hour?"]
    output: Stand
    side_effects: []
  - method: GET
    path: "/concessions/stands/{id}"
    description: "Fetch a stand including computed required_staff/assigned_staff_count."
    roles: [ConcessionsManager, StockRunner, StandOperator, Patron]
    code: 200
    input: []
    output: Stand
    side_effects: []
  - method: GET
    path: "/concessions/events/{id}/stands"
    description: "List stands for an event (FK reverse-reachability for Stand.event_id)."
    roles: [ConcessionsManager, StockRunner, StandOperator, Patron]
    code: 200
    input: ["limit?", "offset?"]
    output: Stand[]
    side_effects: []
  - method: POST
    path: "/concessions/stands/{id}/open"
    description: "Open or reopen a stand (CLOSED/SUSPENDED -> OPEN)."
    roles: [StandOperator]
    code: 200
    input: []
    output: Stand
    side_effects: ["stand.status = OPEN; recompute required_staff"]
  - method: POST
    path: "/concessions/stands/{id}/suspend"
    description: "Suspend an open stand (OPEN -> SUSPENDED)."
    roles: [StandOperator]
    code: 200
    input: []
    output: Stand
    side_effects: ["stand.status = SUSPENDED"]
  - method: POST
    path: "/concessions/stands/{id}/close"
    description: "Close a stand (OPEN/SUSPENDED -> CLOSED)."
    roles: [StandOperator]
    code: 200
    input: []
    output: Stand
    side_effects: ["stand.status = CLOSED"]
  - method: POST
    path: "/concessions/stands/{id}/expire-lots"
    description: "Sweep expired lots on a stand: each ACTIVE lot with expires_at <= current clock is EXPIRED and a WasteRecord is created."
    roles: [StockRunner]
    code: 200
    input: []
    output: Stand
    side_effects:
      - "for each expired ACTIVE lot: create EXPIRY WasteRecord, bump event.waste_cost_cents, set lot remaining_qty=0/status=EXPIRED"
  - method: GET
    path: "/concessions/stands/{id}/replenishment-suggestions"
    description: "Advisory: per-product on_hand and suggested reorder qty where on_hand <= reorder_point."
    roles: [ConcessionsManager, StockRunner]
    code: 200
    input: []
    output: "{ product_id: string, on_hand: integer, suggested_qty: integer }[]"
    side_effects: []

  # ---- MenuItem ----
  - method: POST
    path: "/concessions/menu-items"
    description: "Add a product to a stand's menu; computes event-day price_cents."
    roles: [ConcessionsManager]
    code: 201
    input: [stand_id, product_id, "available?"]
    output: MenuItem
    side_effects: ["compute price_cents (event_day_item_pricing)"]
  - method: GET
    path: "/concessions/menu-items/{id}"
    description: "Fetch a menu item."
    roles: [ConcessionsManager, StockRunner, StandOperator, Patron]
    code: 200
    input: []
    output: MenuItem
    side_effects: []
  - method: GET
    path: "/concessions/stands/{id}/menu-items"
    description: "List menu items for a stand (FK reverse-reachability for MenuItem.stand_id)."
    roles: [ConcessionsManager, StockRunner, StandOperator, Patron]
    code: 200
    input: ["limit?", "offset?"]
    output: MenuItem[]
    side_effects: []
  - method: GET
    path: "/concessions/menu-items"
    description: "List menu items, optionally filtered by product (FK reverse-reachability for MenuItem.product_id)."
    roles: [ConcessionsManager, StockRunner, StandOperator, Patron]
    code: 200
    input: ["product_id?", "limit?", "offset?"]
    output: MenuItem[]
    side_effects: []

  # ---- InventoryLot ----
  - method: POST
    path: "/concessions/inventory-lots"
    description: "Create an inventory lot on a stand (initial stocking)."
    roles: [ConcessionsManager, StockRunner]
    code: 201
    input: [stand_id, product_id, received_qty, "unit_cost_cents?", par_level, reorder_point, "expires_at?"]
    output: InventoryLot
    side_effects: ["remaining_qty initialized to received_qty"]
  - method: GET
    path: "/concessions/inventory-lots/{id}"
    description: "Fetch a lot."
    roles: [ConcessionsManager, StockRunner, StandOperator]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []
  - method: GET
    path: "/concessions/stands/{id}/inventory-lots"
    description: "List inventory lots for a stand (FK reverse-reachability for InventoryLot.stand_id)."
    roles: [ConcessionsManager, StockRunner, StandOperator]
    code: 200
    input: ["product_id?", "limit?", "offset?"]
    output: InventoryLot[]
    side_effects: []
  - method: GET
    path: "/concessions/inventory-lots"
    description: "List inventory lots, optionally filtered by product (FK reverse-reachability for InventoryLot.product_id)."
    roles: [ConcessionsManager, StockRunner, StandOperator]
    code: 200
    input: ["product_id?", "limit?", "offset?"]
    output: InventoryLot[]
    side_effects: []

  # ---- Replenishment ----
  - method: POST
    path: "/concessions/replenishments"
    description: "Request a runner replenishment to a stand."
    roles: [ConcessionsManager, StockRunner, StandOperator]
    code: 201
    input: [stand_id, product_id, requested_qty]
    output: Replenishment
    side_effects: []
  - method: GET
    path: "/concessions/replenishments/{id}"
    description: "Fetch a replenishment."
    roles: [ConcessionsManager, StockRunner, StandOperator]
    code: 200
    input: []
    output: Replenishment
    side_effects: []
  - method: GET
    path: "/concessions/replenishments"
    description: "List replenishments, filterable by stand or product (FK reverse-reachability for Replenishment.stand_id and product_id)."
    roles: [ConcessionsManager, StockRunner, StandOperator]
    code: 200
    input: ["stand_id?", "product_id?", "limit?", "offset?"]
    output: Replenishment[]
    side_effects: []
  - method: POST
    path: "/concessions/replenishments/{id}/pick"
    description: "Runner accepts the pull (REQUESTED -> PICKING)."
    roles: [StockRunner]
    code: 200
    input: []
    output: Replenishment
    side_effects: []
  - method: POST
    path: "/concessions/replenishments/{id}/deliver"
    description: "Runner delivers (PICKING -> DELIVERED); creates a new InventoryLot at the stand."
    roles: [StockRunner]
    code: 200
    input: [par_level, reorder_point]
    output: Replenishment
    side_effects: ["fulfilled_qty = requested_qty; create ACTIVE InventoryLot"]
  - method: POST
    path: "/concessions/replenishments/{id}/cancel"
    description: "Cancel a replenishment (REQUESTED/PICKING -> CANCELLED)."
    roles: [StockRunner]
    code: 200
    input: []
    output: Replenishment
    side_effects: []

  # ---- Transfer ----
  - method: POST
    path: "/concessions/transfers"
    description: "Draft an inventory transfer between two stands of the same event."
    roles: [ConcessionsManager, StockRunner]
    code: 201
    input: [from_stand_id, to_stand_id, product_id, qty]
    output: Transfer
    side_effects: []
  - method: GET
    path: "/concessions/transfers/{id}"
    description: "Fetch a transfer."
    roles: [ConcessionsManager, StockRunner]
    code: 200
    input: []
    output: Transfer
    side_effects: []
  - method: GET
    path: "/concessions/transfers"
    description: "List transfers, filterable by source/destination stand or product (FK reverse-reachability for Transfer.from_stand_id, to_stand_id, product_id)."
    roles: [ConcessionsManager, StockRunner]
    code: 200
    input: ["from_stand_id?", "to_stand_id?", "product_id?", "limit?", "offset?"]
    output: Transfer[]
    side_effects: []
  - method: POST
    path: "/concessions/transfers/{id}/dispatch"
    description: "Dispatch a draft transfer (DRAFT -> IN_TRANSIT); debits source FIFO. OCC on source stand version."
    roles: [StockRunner]
    code: 200
    input: [expected_from_stand_version]
    output: Transfer
    side_effects:
      - "debit qty from from_stand ACTIVE lots FIFO; lots hitting 0 -> DEPLETED"
      - "increments Stand.version by 1 (source stand)"
  - method: POST
    path: "/concessions/transfers/{id}/complete"
    description: "Complete an in-transit transfer (IN_TRANSIT -> COMPLETED); credits destination."
    roles: [StockRunner]
    code: 200
    input: []
    output: Transfer
    side_effects: ["create ACTIVE InventoryLot on to_stand for qty"]
  - method: POST
    path: "/concessions/transfers/{id}/cancel"
    description: "Cancel a transfer (DRAFT or IN_TRANSIT -> CANCELLED); IN_TRANSIT re-credits source."
    roles: [StockRunner]
    code: 200
    input: []
    output: Transfer
    side_effects: ["if IN_TRANSIT: re-credit qty to from_stand (compensation)"]

  # ---- WasteRecord ----
  - method: POST
    path: "/concessions/waste-records"
    description: "Log spillage/damage waste at a stand; costed per spoilage_valuation; bumps event.waste_cost_cents."
    roles: [StockRunner]
    code: 201
    input: [stand_id, product_id, reason, qty, "lot_id?"]
    output: WasteRecord
    side_effects:
      - "compute cost_cents (spoilage_valuation)"
      - "bump parent event.waste_cost_cents by cost_cents"
      - "decrement on_hand for the product at the stand (FIFO for SPILLAGE/DAMAGE; the named lot for EXPIRY)"
  - method: GET
    path: "/concessions/waste-records/{id}"
    description: "Fetch a waste record."
    roles: [ConcessionsManager, StockRunner]
    code: 200
    input: []
    output: WasteRecord
    side_effects: []
  - method: GET
    path: "/concessions/waste-records"
    description: "List waste records, filterable by stand, product, or lot (FK reverse-reachability for WasteRecord.stand_id, product_id, lot_id)."
    roles: [ConcessionsManager, StockRunner]
    code: 200
    input: ["stand_id?", "product_id?", "lot_id?", "limit?", "offset?"]
    output: WasteRecord[]
    side_effects: []

  # ---- Order / OrderLine ----
  - method: POST
    path: "/concessions/orders"
    description: "Open a mobile order cart for a patron at a stand (CART/UNPAID)."
    roles: [Patron]
    code: 201
    input: [event_id, stand_id, patron_id]
    output: Order
    side_effects: []
  - method: GET
    path: "/concessions/orders/{id}"
    description: "Fetch an order including computed totals and both status dimensions."
    roles: [ConcessionsManager, StandOperator, Patron]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/concessions/orders"
    description: "List orders, filterable by event, stand, or patron (FK reverse-reachability for Order.event_id, stand_id, patron_id)."
    roles: [ConcessionsManager, StandOperator, Patron]
    code: 200
    input: ["event_id?", "stand_id?", "patron_id?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: "/concessions/orders/{id}/lines"
    description: "Add a line to a CART order; snapshots MenuItem.price_cents into unit_price_cents."
    roles: [Patron]
    code: 201
    input: [menu_item_id, qty]
    output: OrderLine
    side_effects: ["unit_price_cents snapshot; recompute order totals"]
  - method: GET
    path: "/concessions/orders/{id}/lines"
    description: "List lines for an order (FK reverse-reachability for OrderLine.order_id)."
    roles: [ConcessionsManager, StandOperator, Patron]
    code: 200
    input: ["limit?", "offset?"]
    output: OrderLine[]
    side_effects: []
  - method: GET
    path: "/concessions/order-lines/{id}"
    description: "Fetch a single order line by id."
    roles: [ConcessionsManager, StandOperator, Patron]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: GET
    path: "/concessions/order-lines"
    description: "List order lines, filterable by menu item (FK reverse-reachability for OrderLine.menu_item_id)."
    roles: [ConcessionsManager, StandOperator, Patron]
    code: 200
    input: ["menu_item_id?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []
  - method: POST
    path: "/concessions/orders/{id}/place"
    description: "Place a CART order (-> PLACED); recompute totals; requires OPEN stand and stock."
    roles: [Patron]
    code: 200
    input: []
    output: Order
    side_effects: ["recompute subtotal/fee/total (order_totals)"]
  - method: POST
    path: "/concessions/orders/{id}/pay"
    description: "Pay a placed order (payment UNPAID -> PAID)."
    roles: [Patron]
    code: 200
    input: []
    output: Order
    side_effects: ["payment_status = PAID"]
  - method: POST
    path: "/concessions/orders/{id}/ready"
    description: "Mark a paid order READY (-> READY); decrement stock FIFO. OCC on stand version."
    roles: [StandOperator]
    code: 200
    input: [expected_stand_version]
    output: Order
    side_effects:
      - "decrement on-hand for each line FIFO; lots hitting 0 -> DEPLETED"
      - "increments Stand.version by 1"
  - method: POST
    path: "/concessions/orders/{id}/pickup"
    description: "Patron picks up a READY order (-> PICKED_UP); bump event.gross_sales_cents."
    roles: [StandOperator]
    code: 200
    input: []
    output: Order
    side_effects: ["bump event.gross_sales_cents by total_cents"]
  - method: POST
    path: "/concessions/orders/{id}/cancel"
    description: "Cancel a PLACED order (-> CANCELLED); refund to wallet if PAID."
    roles: [Patron]
    code: 200
    input: []
    output: Order
    side_effects: ["if PAID: payment_status=REFUNDED, credit patron wallet by total_cents"]

  # ---- Patron ----
  - method: POST
    path: "/concessions/patrons"
    description: "Register a patron (cashless wallet)."
    roles: [Patron, ConcessionsManager]
    code: 201
    input: [display_name]
    output: Patron
    side_effects: []
  - method: GET
    path: "/concessions/patrons/{id}"
    description: "Fetch a patron including wallet_credit_cents."
    roles: [ConcessionsManager, Patron]
    code: 200
    input: []
    output: Patron
    side_effects: []

  # ---- StaffShift ----
  - method: POST
    path: "/concessions/staff-shifts"
    description: "Schedule a staff shift at a stand. Rejects if the same worker_name already has a non-CANCELLED shift whose [shift_start, shift_end) half-open window overlaps this one (touching at a boundary instant is allowed)."
    roles: [ConcessionsManager]
    code: 201
    input: [stand_id, worker_name, shift_start, shift_end]
    output: StaffShift
    side_effects: []
  - method: GET
    path: "/concessions/staff-shifts/{id}"
    description: "Fetch a staff shift."
    roles: [ConcessionsManager, StandOperator]
    code: 200
    input: []
    output: StaffShift
    side_effects: []
  - method: GET
    path: "/concessions/stands/{id}/staff-shifts"
    description: "List staff shifts for a stand (FK reverse-reachability for StaffShift.stand_id)."
    roles: [ConcessionsManager, StandOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: StaffShift[]
    side_effects: []
  - method: POST
    path: "/concessions/staff-shifts/{id}/check-in"
    description: "Check a worker in (SCHEDULED -> CHECKED_IN); increments stand assigned_staff_count."
    roles: [StandOperator]
    code: 200
    input: []
    output: StaffShift
    side_effects: ["increment stand.assigned_staff_count"]
  - method: POST
    path: "/concessions/staff-shifts/{id}/check-out"
    description: "Check a worker out (CHECKED_IN -> CHECKED_OUT); decrements stand assigned_staff_count."
    roles: [StandOperator]
    code: 200
    input: []
    output: StaffShift
    side_effects: ["decrement stand.assigned_staff_count"]
  - method: POST
    path: "/concessions/staff-shifts/{id}/cancel"
    description: "Cancel a scheduled shift (SCHEDULED -> CANCELLED)."
    roles: [ConcessionsManager]
    code: 200
    input: []
    output: StaffShift
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test hook: set the server's current UTC clock for expiry checks."
    roles: [ConcessionsManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["sets the clock used by lot expiry checks"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Authenticated role not permitted for this endpoint."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist."
  - id: ERR_NOT_ORDER_OWNER
    http: 403
    condition: "Patron acting on an Order that is not theirs (patron_id mismatch)."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current state."
  - id: ERR_STALE_STAND_VERSION
    http: 412
    condition: "expected_<...>_stand_version does not match the live Stand.version (OCC)."
  - id: ERR_EVENT_NOT_OPENABLE
    http: 409
    condition: "Opening a stand whose parent event is not DOORS_OPEN or IN_PROGRESS."
  - id: ERR_UNDERSTAFFED_OPEN
    http: 409
    condition: "Opening a stand with assigned_staff_count < 1."
  - id: ERR_STAND_NOT_OPEN
    http: 409
    condition: "Placing an order at a stand that is not OPEN."
  - id: ERR_ORDER_UNPAID
    http: 409
    condition: "Readying an order whose payment_status != PAID."
  - id: ERR_LOT_NOT_EXPIRED
    http: 409
    condition: "Expiring a lot whose expires_at is null or in the future."
  - id: ERR_CROSS_EVENT_TRANSFER
    http: 422
    condition: "Transfer from_stand and to_stand are in different events or are the same stand."
  - id: ERR_EVENT_WINDOW_OVERLAP
    http: 409
    condition: "New event operating window overlaps another non-SETTLED event at the same venue (closed interval; boundary touch counts)."
  - id: ERR_SHIFT_OVERLAP
    http: 409
    condition: "New staff shift overlaps another non-CANCELLED shift for the same worker (half-open interval; boundary touch allowed)."
  - id: ERR_INSUFFICIENT_STOCK
    http: 409
    condition: "An order line's product on_hand at the stand is below the requested qty."
  - id: ERR_TRANSFER_QTY_EXCEEDS_ONHAND
    http: 409
    condition: "Transfer dispatch qty exceeds source stand on_hand for the product."
  - id: ERR_EVENT_NOT_SETTLEABLE
    http: 409
    condition: "Settling an event with a non-CLOSED stand or a PLACED/READY order."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Malformed body: bad enum, non-positive qty, out-of-range percentage, shift_end <= shift_start, reorder_point > par_level, or missing required field."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ConcessionsManager
    description: "Configures venues, products, events, stands, menus, event-day multipliers, peak windows, settlement, and staffing schedules."
    identity: opaque
    exclusive_operations:
      - "POST /concessions/venues"
      - "POST /concessions/products"
      - "POST /concessions/events"
      - "POST /concessions/events/{id}/open-doors"
      - "POST /concessions/events/{id}/peak-window/open"
      - "POST /concessions/events/{id}/peak-window/close"
      - "POST /concessions/events/{id}/settle"
      - "GET /concessions/events/{id}/revenue-share-statement"
      - "POST /concessions/stands"
      - "POST /concessions/menu-items"
      - "POST /concessions/staff-shifts"
      - "POST /concessions/staff-shifts/{id}/cancel"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across products, events, stands, menu-items, inventory-lots, replenishments, transfers, orders, waste-records, staff-shifts, patrons, venues"
      - "POST /concessions/inventory-lots (with StockRunner)"
      - "POST /concessions/replenishments (with StockRunner, StandOperator)"
      - "POST /concessions/transfers (with StockRunner)"
      - "POST /concessions/patrons (with Patron)"

  - name: StockRunner
    description: "Moves inventory: initial stocking, replenishment pick/deliver, transfers between stands, expiry sweeps, and waste logging."
    identity: opaque
    exclusive_operations:
      - "POST /concessions/replenishments/{id}/pick"
      - "POST /concessions/replenishments/{id}/deliver"
      - "POST /concessions/replenishments/{id}/cancel"
      - "POST /concessions/transfers/{id}/dispatch"
      - "POST /concessions/transfers/{id}/complete"
      - "POST /concessions/transfers/{id}/cancel"
      - "POST /concessions/stands/{id}/expire-lots"
      - "POST /concessions/waste-records"
    shared_operations:
      - "GET reads across inventory, replenishments, transfers, waste-records, stands, products, venues, menu-items"
      - "POST /concessions/inventory-lots (with ConcessionsManager)"
      - "POST /concessions/replenishments (with ConcessionsManager, StandOperator)"
      - "POST /concessions/transfers (with ConcessionsManager)"
      - "GET /concessions/stands/{id}/replenishment-suggestions (with ConcessionsManager)"

  - name: StandOperator
    description: "Runs a stand: opens/suspends/closes it, readies and hands off order pickups, and checks staff shifts in/out."
    identity: opaque
    exclusive_operations:
      - "POST /concessions/stands/{id}/open"
      - "POST /concessions/stands/{id}/suspend"
      - "POST /concessions/stands/{id}/close"
      - "POST /concessions/orders/{id}/ready"
      - "POST /concessions/orders/{id}/pickup"
      - "POST /concessions/staff-shifts/{id}/check-in"
      - "POST /concessions/staff-shifts/{id}/check-out"
    shared_operations:
      - "GET reads across stands, menu-items, orders, order-lines, staff-shifts, inventory-lots, products, venues"
      - "POST /concessions/replenishments (with ConcessionsManager, StockRunner)"

  - name: Patron
    description: "Places, fills, pays for, and cancels their own mobile orders; registers a cashless wallet."
    identity: "entity_backed:Patron"
    exclusive_operations:
      - "POST /concessions/orders"
      - "POST /concessions/orders/{id}/lines"
      - "POST /concessions/orders/{id}/place"
      - "POST /concessions/orders/{id}/pay"
      - "POST /concessions/orders/{id}/cancel"
    shared_operations:
      - "GET reads across own orders, order-lines, stands, menu-items, products, venues, patrons"
      - "POST /concessions/patrons (with ConcessionsManager)"
