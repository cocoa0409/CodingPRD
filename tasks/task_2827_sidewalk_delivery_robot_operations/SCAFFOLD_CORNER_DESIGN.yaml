              payload: { action: "SURVEY" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments/${s5}/transitions"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /service-zones/${z}/permit-transitions"
              payload: { action: "ACTIVATE_PERMIT" }
              as: PlatformAdmin
            - call: "POST /merchants"
              payload: { zone_id: "${z}", name: "Corner Bakery", handoff_sla_seconds: 300, merchant_grade: "PREFERRED" }
              as: PlatformAdmin
              captures: { m: $.data.id }
