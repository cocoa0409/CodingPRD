  - name: reconciliation_nested_tolerance_rounding_order
    grounds:
    - calculations.reconciliation_variance
    - calculations.milestone_payment
    distinguishing_aspect: "Nested-rounding-order mode (b): reconciliation tolerance is a hard integer-cents threshold with NO rounding (|delta| <= tolerance pinned\
      \ per domain: LICENSES 50 cents), while milestone retainage floors the retained portion BEFORE subtracting from billable \u2014 pinned order means a 150-cent\
      \ billable at 10% retains exactly 15, and a LICENSES batch with delta exactly 50 passes but 51 fails; rounding order and threshold precision are observable\
      \ in cents."
    test_recipe:
