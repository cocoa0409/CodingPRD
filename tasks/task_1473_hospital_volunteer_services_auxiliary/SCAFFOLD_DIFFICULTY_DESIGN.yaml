      - name: disburse_temporal_beats_fiscal
        grounds:
          - validations[priority=11]
          - validations[priority=13]
        distinguishing_aspect: |
          Category pair {business_temporal, business_fiscal} (third distinct pair): a
          disbursement 3 days after close AND above the disbursable balance fails both
          ERR_DISBURSEMENT_COOLING_OFF (priority 11) and
          ERR_DISBURSEMENT_EXCEEDS_BALANCE (priority 13); the temporal error must win.
          SoD is neutralized by using a non-creator treasurer.
        test_recipe:
          setup:
            - "Cashier volunteer fully ACTIVE with GIFT_SHOP placement; campaign by treasurer-1, window [2026-08-01T00:00:00Z, 2026-08-05T00:00:00Z), ACTIVE"
