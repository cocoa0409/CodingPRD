          is a valid ConsortiumAdmin and the body is perfectly well formed, but X-User-ID is the empty
          string, so the answer must be ERR_UNAUTHENTICATED (401) - not ERR_ROLE_NOT_PERMITTED and not
          ERR_INVALID_REQUEST - and no Member row may be created.
