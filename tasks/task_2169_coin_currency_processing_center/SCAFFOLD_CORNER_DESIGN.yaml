            - "CustomerAccount.${a_id}.ledger_balance_cents == 0"

      - name: coin_order_with_zero_allocation_is_rejected_status_not_an_error
        claim_type: Correct Result
        grounds:
          - calculations.coin_order_allocation
          - state_machines.CoinOrder.REQUESTED_to_REJECTED
          - entities.CoinOrder.fields.fill_ratio_pct
        distinguishing_aspect: "When the vault holds no inventory row for the requested denomination the allocation yields total_boxes_allocated 0, and the approve call succeeds with status REJECTED, fill_ratio_pct 0 and charge_cents 0 rather than returning ERR_INSUFFICIENT_COIN_INVENTORY."
        test_recipe:
          setup:
            - "Vault CV-C22 OPEN with no VaultInventory rows at all; CustomerAccount ACC-C22 ACTIVE."
            - "A REQUESTED CoinOrder for 2 NICKEL boxes."
          setup_api_calls:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-C22", name: "Corner Vault TwentyTwo" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { v_id: $.data.id }
            - call: "POST /cash-vault/customer-accounts"
              payload: { account_number: "ACC-C22", customer_name: "Corner Parking TwentyTwo", tier: "STANDARD", status: "ACTIVE" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /cash-vault/coin-orders"
              payload: { customer_account_id: "${a_id}", vault_id: "${v_id}", pickup_window_start: "2026-08-05T10:00:00Z", pickup_window_end: "2026-08-05T12:00:00Z", lines: [ { denomination: "NICKEL", boxes_requested: 2 } ] }
              as: CustomerAccountHolder
              as_user_id: "${a_id}"
              captures: { o_id: $.data.id, o_req: $.data.total_boxes_requested }
          trigger:
            - call: "POST /cash-vault/coin-orders/${o_id}/approve"
              payload: { allow_partial: false }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { o_status: $.data.status, o_fill: $.data.fill_ratio_pct, o_charge: $.data.charge_cents, o_alloc: $.data.total_boxes_allocated }
          assert:
            - "HTTP status of the trigger response == 200"
            - "${o_req} == 2"
            - "${o_status} == REJECTED"
            - "${o_fill} == 0"
            - "${o_charge} == 0"
            - "${o_alloc} == 0"
            - "GET /cash-vault/vaults/${v_id}/inventory returns total_count 0"
            - "CoinOrder.${o_id}.approved_by_user_id == u-mgr-1"

      - name: volume_discount_tier_selection_on_settlement
        claim_type: Variant Selection
        grounds:
          - calculations.deposit_credit_amount
        excluded_because:
          difficulty_instance: settlement_fee_tier_keyed_on_pre_fee_gross_counted_total
          rationale: "The tier boundary at exactly VOLUME_TIER_1_CENTS and its effect on fee_final_cents is the pinned assertion of that §1.8 instance."

      - name: per_bag_rounding_order_on_processing_fee
        claim_type: Precision
        grounds:
          - calculations.bag_processing_fee
        excluded_because:
          difficulty_instance: per_bag_fee_rounded_half_up_before_summation
          rationale: "Round-then-sum versus sum-then-round is the sole subject of that §1.8 instance."

      - name: waterfall_allocation_partial_fill_across_denominations
        claim_type: Correct Result
        grounds:
          - calculations.coin_order_allocation
        excluded_because:
          difficulty_instance: coin_release_then_return_conserves_vault_coin_face_value
          rationale: "Ascending-denomination waterfall allocation with a partial DIME fill, fill_ratio_pct 81.82 and charge_cents 255000 is asserted there."

      - name: dual_variant_risk_score_divergence
        claim_type: Variant Divergence
        grounds:
          - calculations.customer_risk_grade
        excluded_because:
          difficulty_instance: customer_risk_grade_settled_only_vs_point_in_time_diverge
          rationale: "Both variants are computed against identical stored rows and compared there."

  - section: validations
    instances:
      - name: duplicate_seal_number_rejected_on_sealed_bag_create
        claim_type: Violation → Error
        grounds:
          - validations[priority=67]
          - errors[ERR_DUPLICATE_SEAL]
        distinguishing_aspect: "seal_number is globally unique: registering a second bag with seal_number S-C23 returns ERR_DUPLICATE_SEAL at 409 and leaves the ticket with one bag."
        test_recipe:
          setup:
            - "Vault CV-C23, CustomerAccount ACC-C23, ticket MAN-C23 declaring 2 bags with bag S-C23 already registered."
          setup_api_calls:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-C23", name: "Corner Vault TwentyThree" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { v_id: $.data.id }
            - call: "POST /cash-vault/customer-accounts"
              payload: { account_number: "ACC-C23", customer_name: "Corner Seal Shop", tier: "STANDARD", status: "ACTIVE" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /cash-vault/deposit-tickets"
              payload: { customer_account_id: "${a_id}", vault_id: "${v_id}", courier_manifest_number: "MAN-C23", declared_bag_count: 2 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { t_id: $.data.id }
            - call: "POST /cash-vault/sealed-bags"
              payload: { deposit_ticket_id: "${t_id}", seal_number: "S-C23", bag_type: "CURRENCY", declared_amount_cents: 50000, declared_note_count: 50, declared_coin_weight_grams: 0 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /cash-vault/sealed-bags"
              payload: { deposit_ticket_id: "${t_id}", seal_number: "S-C23", bag_type: "CURRENCY", declared_amount_cents: 70000, declared_note_count: 70, declared_coin_weight_grams: 0 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_DUPLICATE_SEAL"
            - "HTTP status of the trigger response == 409"
            - "GET /cash-vault/sealed-bags?deposit_ticket_id=${t_id} returns total_count 1"
            - "DepositTicket.${t_id}.declared_total_cents == 50000"

      - name: duplicate_business_identifiers_rejected_across_collections
        claim_type: Violation → Error
        grounds:
          - validations[priority=68]
          - errors[ERR_DUPLICATE_IDENTIFIER]
        distinguishing_aspect: "vault_code, account_number and courier_manifest_number are each unique: re-using any of them returns ERR_DUPLICATE_IDENTIFIER at 409."
        test_recipe:
          setup:
            - "Vault CV-C24, CustomerAccount ACC-C24 and DepositTicket MAN-C24 already exist."
          setup_api_calls:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-C24", name: "Corner Vault TwentyFour" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { v_id: $.data.id }
            - call: "POST /cash-vault/customer-accounts"
              payload: { account_number: "ACC-C24", customer_name: "Corner Copy TwentyFour", tier: "STANDARD", status: "ACTIVE" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /cash-vault/deposit-tickets"
              payload: { customer_account_id: "${a_id}", vault_id: "${v_id}", courier_manifest_number: "MAN-C24", declared_bag_count: 1 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-C24", name: "Duplicate Vault Code" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { err_vault: $.data.error_id }
            - call: "POST /cash-vault/customer-accounts"
              payload: { account_number: "ACC-C24", customer_name: "Duplicate Account Number", tier: "STANDARD", status: "ACTIVE" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { err_acct: $.data.error_id }
            - call: "POST /cash-vault/deposit-tickets"
              payload: { customer_account_id: "${a_id}", vault_id: "${v_id}", courier_manifest_number: "MAN-C24", declared_bag_count: 1 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { err_ticket: $.data.error_id }
          assert:
            - "${err_vault} == ERR_DUPLICATE_IDENTIFIER"
            - "${err_acct} == ERR_DUPLICATE_IDENTIFIER"
            - "${err_ticket} == ERR_DUPLICATE_IDENTIFIER"
            - "each of the three trigger responses has HTTP status 409"

      - name: duplicate_denomination_line_rejected_on_coin_order_create
        claim_type: Violation → Error
        grounds:
          - validations[priority=63]
          - errors[ERR_DUPLICATE_DENOMINATION]
        distinguishing_aspect: "Two lines naming QUARTER in one coin order return ERR_DUPLICATE_DENOMINATION at 422 and no CoinOrder or CoinOrderLine row is created."
        test_recipe:
          setup:
            - "Vault CV-C25 OPEN and CustomerAccount ACC-C25 ACTIVE; no coin orders."
          setup_api_calls:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-C25", name: "Corner Vault TwentyFive" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { v_id: $.data.id }
            - call: "POST /cash-vault/customer-accounts"
              payload: { account_number: "ACC-C25", customer_name: "Corner Arcade TwentyFive", tier: "STANDARD", status: "ACTIVE" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /cash-vault/coin-orders"
              payload: { customer_account_id: "${a_id}", vault_id: "${v_id}", pickup_window_start: "2026-08-05T10:00:00Z", pickup_window_end: "2026-08-05T12:00:00Z", lines: [ { denomination: "QUARTER", boxes_requested: 1 }, { denomination: "QUARTER", boxes_requested: 2 } ] }
              as: CustomerAccountHolder
              as_user_id: "${a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_DUPLICATE_DENOMINATION"
            - "HTTP status of the trigger response == 422"
            - "GET /cash-vault/coin-orders?vault_id=${v_id} returns total_count 0"

      - name: inventory_adjustment_below_zero_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=80]
          - errors[ERR_INVENTORY_NEGATIVE]
          - entities.VaultInventory.fields.on_hand_boxes
        distinguishing_aspect: "A -3 box adjustment against an on_hand_boxes of 2 returns ERR_INVENTORY_NEGATIVE at 422, leaves on_hand_boxes at 2 and does not increment Vault.version."
        test_recipe:
          setup:
            - "Vault CV-C26 with QUARTER inventory on_hand_boxes 2 after a single +2 adjustment."
          setup_api_calls:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-C26", name: "Corner Vault TwentySix" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { v_id: $.data.id }
            - call: "POST /cash-vault/vaults/${v_id}/inventory-adjustments"
              payload: { denomination: "QUARTER", delta_boxes: 2 }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { inv_boxes: $.data.on_hand_boxes }
            - call: "GET /cash-vault/vaults/${v_id}"
              payload: {}
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { v_ver: $.data.version }
          trigger:
            - call: "POST /cash-vault/vaults/${v_id}/inventory-adjustments"
              payload: { denomination: "QUARTER", delta_boxes: -3 }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "${inv_boxes} == 2"
            - "${err} == ERR_INVENTORY_NEGATIVE"
            - "HTTP status of the trigger response == 422"
            - "VaultInventory for (${v_id}, QUARTER).on_hand_boxes == 2"
            - "Vault.${v_id}.version == ${v_ver}"
            - "Vault.${v_id}.coin_face_value_on_hand_cents == 100000"

      - name: count_session_window_in_past_rejected_against_logical_clock
