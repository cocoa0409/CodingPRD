            - "SupplierFoodPair.${pair1b}.entry_eligibility_status == BLOCKED"
            - "SupplierFoodPair.${pair1b}.verification_status == DRAFT"
            - "SupplierFoodPair.${pair1b}.exemption_status == VERIFIED"
            - "Importer.${imp}.blocked_pair_count == 2"
            - "Importer.${imp}.open_corrective_action_count == 1"
            - "Importer.${imp}.program_status == NON_COMPLIANT"

  # ---------------------------------------------------------------------------
  # RULE 4 — transitive_cascade
  # Two cascades with DIFFERENT triggers: (1) a record attestation (evidence
  # admission) with depth 6, (2) a supplier compliance-status PATCH (reference
  # data change) with depth 3 that deliberately does NOT touch eligibility.
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: fail_attestation_suspension_chain
        grounds:
          - endpoints["POST /fsvp/verification-records/{id}/attestation"]
          - calculations.supplier_performance_score
          - state_machines.ForeignSupplier.transitions.APPROVED_to_SUSPENDED_PENDING_REVIEW
          - state_machines[SupplierFoodPair.verification_status].transitions.VERIFICATION_APPROVED_to_VERIFICATION_LAPSED
          - state_machines[SupplierFoodPair.entry_eligibility_status].transitions.ELIGIBLE_to_BLOCKED
          - state_machines.EntrySubmission.transitions.ACCEPTED_to_HELD
          - calculations.importer_program_status
        distinguishing_aspect: "Depth-6 chain fired by ONE attestation: record ATTESTED → performance_score_final 10.00 → supplier SUSPENDED_PENDING_REVIEW → pair VERIFICATION_LAPSED plus an OPEN CorrectiveAction → pair entry_eligibility BLOCKED → the already-ACCEPTED entry line HELD/PAIR_BLOCKED → Importer.blocked_pair_count 1 and program_status NON_COMPLIANT. Every hop is observable in one request; stopping the implementation at hop 3 leaves the entry line ACCEPTED."
        test_recipe:
          setup:
            - "Canonical fixture through verification approval of pair P1, reduced to the two control-bearing hazards (the sub-threshold hazard has no bearing on performance scoring)."
            - "One entry line E1 filed and ACCEPTED against P1 while it was still eligible."
            - "Clock moved to 2026-10-20T00:00:00Z, then a FAIL onsite record (2 findings) submitted but NOT yet attested, so the supplier is still APPROVED at trigger time."
