# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Commission-Free Fractional Brokerage (task_0503)
# Breadth probe across the claim-extraction-guide sections. Every grounds[]
# resolves to SCAFFOLD.yaml §1.1–§1.7; every setup_api_calls chain is empty-DB
# executable; excluded_because stubs cite a §1.8 instance by name (no test_recipe).
# Clock default = 2026-01-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Account.fields.account_type, entities.Account.fields.trading_status]
        distinguishing_aspect: "POST /accounts with holder_email only -> 201, account_type defaults CASH, trading_status ACTIVE, options_level 0, all cash fields 0, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { holder_email: "new@x.com" }
              as: AccountHolder
              captures: { acc_new: $.data.id }
          assert:
            - "Response status 201; Account.${acc_new}.account_type == CASH, trading_status == ACTIVE, options_level == 0, buying_power_cents == 0, version == 1"

      - name: get_account_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Account, "validations[priority=3]"]
        distinguishing_aspect: "GET /accounts/{nonexistent-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-0000-0000-000000000000"
              as: ComplianceOfficer
              captures: { err_nf: $.data.error_id }
          assert:
            - "Response status 404 and data.error_id == ERR_NOT_FOUND"

      - name: create_account_missing_holder_email_returns_422
        claim_type: Required Fields
        grounds: [entities.Account.fields.holder_email, "validations[priority=4]"]
        distinguishing_aspect: "POST /accounts without holder_email -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { account_type: "CASH" }
              as: AccountHolder
              captures: { err_req: $.data.error_id }
          assert:
            - "Response status 422 and data.error_id == ERR_INVALID_REQUEST"

      - name: security_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Security]
        distinguishing_aspect: "Security is common_fields:false — its create response carries id and created_at but no version field (no update lifecycle beyond quotes)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /securities"
              payload: { symbol: "IMMU", instrument_type: "EQUITY", last_price_cents: 5000 }
              as: ClearingSystem
              captures: { sec_immu: $.data.id }
          assert:
            - "Response status 201; Security.${sec_immu} has created_at but no version field"

      - name: order_notional_and_quantity_both_set_returns_422
        claim_type: Type Constraints
        grounds: [entities.Order.fields.notional_cents, entities.Order.fields.quantity, "validations[priority=4]"]
        distinguishing_aspect: "POST /orders with both notional_cents>0 and quantity>0 violates the notional-XOR-quantity rule -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["CASH account funded $1000.00; security XORCO."]
          setup_api_calls:
            - call: "POST /securities"
              payload: { symbol: "XORCO", instrument_type: "EQUITY", last_price_cents: 10000, fractional_enabled: true }
              as: ClearingSystem
              captures: { sec_xor: $.data.id }
            - call: "POST /accounts"
              payload: { holder_email: "xor@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_xor: $.data.id }
            - call: "POST /accounts/${acc_xor}/deposits"
              payload: { amount_cents: 100000, instant_eligible: true }
              as: AccountHolder
              as_user_id: "${acc_xor}"
            - call: "GET /accounts/${acc_xor}"
              as: AccountHolder
              as_user_id: "${acc_xor}"
              captures: { v_xor: $.data.version }
          trigger:
            - call: "POST /orders"
              payload: { account_id: "${acc_xor}", security_id: "${sec_xor}", side: "BUY", order_type: "MARKET", notional_cents: 50000, quantity: 5, expected_account_version: "${v_xor}" }
              as: AccountHolder
              as_user_id: "${acc_xor}"
              captures: { err_xor: $.data.error_id }
          assert:
            - "Response status 422 and data.error_id == ERR_INVALID_REQUEST"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_terminal_order_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Order.ACCEPTED_to_FILLED, "validations[priority=6]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an order already FILLED returns ERR_INVALID_STATE (409); no buying-power release fires."
        test_recipe:
          setup: ["CASH account holding a FILLED BUY of 1 sh of TERMCO @10000c."]
          setup_api_calls:
            - call: "POST /securities"
              payload: { symbol: "TERMCO", instrument_type: "EQUITY", last_price_cents: 10000, fractional_enabled: true }
              as: ClearingSystem
              captures: { sec_term: $.data.id }
            - call: "POST /accounts"
              payload: { holder_email: "term@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_term: $.data.id }
            - call: "POST /accounts/${acc_term}/deposits"
              payload: { amount_cents: 100000, instant_eligible: true }
              as: AccountHolder
              as_user_id: "${acc_term}"
            - call: "GET /accounts/${acc_term}"
              as: AccountHolder
              as_user_id: "${acc_term}"
              captures: { v_term: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_term}", security_id: "${sec_term}", side: "BUY", order_type: "MARKET", quantity: 1, expected_account_version: "${v_term}" }
              as: AccountHolder
              as_user_id: "${acc_term}"
              captures: { ord_term: $.data.id }
            - call: "POST /orders/${ord_term}/fills"
              payload: { fill_quantity: 1, fill_price_cents: 10000 }
              as: ClearingSystem
          trigger:
            - call: "POST /orders/${ord_term}/cancel"
              as: AccountHolder
              as_user_id: "${acc_term}"
              captures: { err_term: $.data.error_id }
          assert:
            - "Response status 409 and data.error_id == ERR_INVALID_STATE; Order.${ord_term}.order_status == FILLED unchanged"

      - name: fill_on_terminal_order_returns_cannot_fill_terminal
        claim_type: invalid_transition
        grounds: [state_machines.Order.ACCEPTED_to_PARTIALLY_FILLED, "errors[ERR_CANNOT_FILL_TERMINAL]"]
        distinguishing_aspect: "Reporting a fill against a CANCELLED order returns ERR_CANNOT_FILL_TERMINAL (409)."
        test_recipe:
          setup: ["CASH account with an ACCEPTED BUY order then CANCELLED."]
          setup_api_calls:
            - call: "POST /securities"
              payload: { symbol: "FILLC", instrument_type: "EQUITY", last_price_cents: 10000, fractional_enabled: true }
              as: ClearingSystem
              captures: { sec_fc: $.data.id }
            - call: "POST /accounts"
              payload: { holder_email: "fc@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_fc: $.data.id }
            - call: "POST /accounts/${acc_fc}/deposits"
              payload: { amount_cents: 100000, instant_eligible: true }
              as: AccountHolder
              as_user_id: "${acc_fc}"
            - call: "GET /accounts/${acc_fc}"
              as: AccountHolder
              as_user_id: "${acc_fc}"
              captures: { v_fc: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_fc}", security_id: "${sec_fc}", side: "BUY", order_type: "MARKET", quantity: 1, expected_account_version: "${v_fc}" }
              as: AccountHolder
              as_user_id: "${acc_fc}"
              captures: { ord_fc: $.data.id }
            - call: "POST /orders/${ord_fc}/cancel"
              as: AccountHolder
              as_user_id: "${acc_fc}"
          trigger:
            - call: "POST /orders/${ord_fc}/fills"
              payload: { fill_quantity: 1, fill_price_cents: 10000 }
              as: ClearingSystem
              captures: { err_fc: $.data.error_id }
          assert:
            - "Response status 409 and data.error_id == ERR_CANNOT_FILL_TERMINAL"

      - name: settle_before_due_returns_settlement_not_due
        claim_type: Precondition Enforcement
        grounds: [state_machines.Settlement.UNSETTLED_to_SETTLED, "errors[ERR_SETTLEMENT_NOT_DUE]"]
        distinguishing_aspect: "Advancing the clock to a date strictly before a settlement leg's settles_on leaves it UNSETTLED; the leg does not settle early."
        test_recipe:
          setup: ["CASH account with one UNSETTLED Settlement (settles_on = trade date + 1 business day)."]
          setup_api_calls:
            - call: "POST /securities"
              payload: { symbol: "SETCO", instrument_type: "EQUITY", last_price_cents: 10000, fractional_enabled: true }
              as: ClearingSystem
              captures: { sec_set: $.data.id }
            - call: "POST /accounts"
              payload: { holder_email: "set@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_set: $.data.id }
            - call: "POST /accounts/${acc_set}/deposits"
              payload: { amount_cents: 100000, instant_eligible: true }
              as: AccountHolder
              as_user_id: "${acc_set}"
            - call: "GET /accounts/${acc_set}"
              as: AccountHolder
              as_user_id: "${acc_set}"
              captures: { v_set: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_set}", security_id: "${sec_set}", side: "BUY", order_type: "MARKET", quantity: 1, expected_account_version: "${v_set}" }
              as: AccountHolder
              as_user_id: "${acc_set}"
              captures: { ord_set: $.data.id }
            - call: "POST /orders/${ord_set}/fills"
              payload: { fill_quantity: 1, fill_price_cents: 10000 }
              as: ClearingSystem
              captures: { fill_set: $.data.id }
          trigger:
            - call: "GET /accounts/${acc_set}/settlements"
              as: AccountHolder
              as_user_id: "${acc_set}"
              captures: { set_status: "$.data[0].status" }
          assert:
            - "The settlement leg status == UNSETTLED at clock 2026-01-01 (settles_on is 2026-01-02, not yet due)"

      - name: options_revoke_resets_account_level
        claim_type: Side Effect Execution
        grounds: [state_machines.OptionsApproval.APPROVED_to_REVOKED, entities.Account.fields.options_level]
        distinguishing_aspect: "Revoking the only APPROVED options approval resets Account.options_level back to 0."
        test_recipe:
          setup: ["CASH account with one APPROVED options approval at level 2 (options_level=2)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_email: "rev@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_rev: $.data.id }
            - call: "POST /options-approvals"
              payload: { account_id: "${acc_rev}", requested_level: 2, stated_experience_years: 3, liquid_net_worth_cents: 5000000 }
              as: AccountHolder
              as_user_id: "${acc_rev}"
              captures: { appr_rev: $.data.id }
            - call: "GET /accounts/${acc_rev}"
              as: ComplianceOfficer
              captures: { v_rev: $.data.version }
            - call: "POST /options-approvals/${appr_rev}/decide"
              payload: { decision: "APPROVE", expected_account_version: "${v_rev}" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /options-approvals/${appr_rev}/revoke"
              as: ComplianceOfficer
              captures: { rev_status: $.data.status }
            - call: "GET /accounts/${acc_rev}"
              as: ComplianceOfficer
              captures: { lvl_after: $.data.options_level }
          assert:
            - "OptionsApproval.${appr_rev}.status == REVOKED and Account.${acc_rev}.options_level == 0"

      - name: order_initial_state_is_pending_new_then_accepted
        claim_type: Initial State
        grounds: [state_machines.Order.PENDING_NEW_to_ACCEPTED, entities.Order.fields.order_status]
        distinguishing_aspect: "A valid BUY order's response shows order_status == ACCEPTED (placement validates+accepts in one request) with reserved_buying_power_cents set."
        test_recipe:
          setup: ["CASH account funded $1000.00; security INITCO."]
          setup_api_calls:
            - call: "POST /securities"
              payload: { symbol: "INITCO", instrument_type: "EQUITY", last_price_cents: 10000, fractional_enabled: true }
              as: ClearingSystem
              captures: { sec_init: $.data.id }
            - call: "POST /accounts"
              payload: { holder_email: "init@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_init: $.data.id }
            - call: "POST /accounts/${acc_init}/deposits"
              payload: { amount_cents: 100000, instant_eligible: true }
              as: AccountHolder
              as_user_id: "${acc_init}"
            - call: "GET /accounts/${acc_init}"
              as: AccountHolder
              as_user_id: "${acc_init}"
              captures: { v_init: $.data.version }
          trigger:
            - call: "POST /orders"
              payload: { account_id: "${acc_init}", security_id: "${sec_init}", side: "BUY", order_type: "MARKET", notional_cents: 50000, expected_account_version: "${v_init}" }
              as: AccountHolder
              as_user_id: "${acc_init}"
              captures: { ord_init: $.data.id }
          assert:
            - "Order.${ord_init}.order_status == ACCEPTED, reserved_buying_power_cents == 50000, pfof_venue == VENUE_A"

  # ===========================================================================
  - section: calculations
    instances:
      - name: pfof_routing_option_excludes_venue_c
        claim_type: Correct Result
        grounds: [calculations.pfof_routing, entities.Order.fields.pfof_venue]
        distinguishing_aspect: "An OPTION order routes to VENUE_A (only A,B eligible for options; A=30bps highest); VENUE_C is never selected for options."
        test_recipe:
          setup: ["CASH account approved options level 1; OPTION security OPTC required_options_level 1, last 10000c."]
          setup_api_calls:
            - call: "POST /securities"
              payload: { symbol: "OPTC", instrument_type: "OPTION", last_price_cents: 10000, fractional_enabled: false, required_options_level: 1 }
              as: ClearingSystem
              captures: { sec_oc: $.data.id }
            - call: "POST /accounts"
              payload: { holder_email: "oc@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_oc: $.data.id }
            - call: "POST /accounts/${acc_oc}/deposits"
              payload: { amount_cents: 5000000, instant_eligible: true }
              as: AccountHolder
              as_user_id: "${acc_oc}"
            - call: "POST /options-approvals"
              payload: { account_id: "${acc_oc}", requested_level: 1, stated_experience_years: 2, liquid_net_worth_cents: 5000000 }
              as: AccountHolder
              as_user_id: "${acc_oc}"
              captures: { appr_oc: $.data.id }
            - call: "GET /accounts/${acc_oc}"
              as: ComplianceOfficer
              captures: { v_oc_1: $.data.version }
            - call: "POST /options-approvals/${appr_oc}/decide"
              payload: { decision: "APPROVE", expected_account_version: "${v_oc_1}" }
              as: ComplianceOfficer
            - call: "GET /accounts/${acc_oc}"
              as: AccountHolder
              as_user_id: "${acc_oc}"
              captures: { v_oc_2: $.data.version }
          trigger:
            - call: "POST /orders"
              payload: { account_id: "${acc_oc}", security_id: "${sec_oc}", side: "BUY", order_type: "LIMIT", quantity: 1, limit_price_cents: 10000, expected_account_version: "${v_oc_2}" }
              as: AccountHolder
              as_user_id: "${acc_oc}"
              captures: { ord_oc: $.data.id }
          assert:
            - "Order.${ord_oc}.order_status == ACCEPTED and pfof_venue == VENUE_A"

      - name: pfof_rebate_computed_per_fill
        claim_type: Constants Applied
        grounds: [calculations.order_required_cash, entities.Fill.fields.pfof_rebate_cents]
        distinguishing_aspect: "A fill of gross_value 100000c on a VENUE_A-routed EQUITY order yields pfof_rebate_cents == 300 (100000 * 30bps / 10000)."
        test_recipe:
          setup: ["CASH account funded $2000.00; EQUITY security REBCO last 10000c; an ACCEPTED BUY order routed VENUE_A."]
          setup_api_calls:
            - call: "POST /securities"
              payload: { symbol: "REBCO", instrument_type: "EQUITY", last_price_cents: 10000, fractional_enabled: true }
              as: ClearingSystem
              captures: { sec_reb: $.data.id }
            - call: "POST /accounts"
              payload: { holder_email: "reb@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_reb: $.data.id }
            - call: "POST /accounts/${acc_reb}/deposits"
              payload: { amount_cents: 200000, instant_eligible: true }
              as: AccountHolder
              as_user_id: "${acc_reb}"
            - call: "GET /accounts/${acc_reb}"
              as: AccountHolder
              as_user_id: "${acc_reb}"
              captures: { v_reb: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_reb}", security_id: "${sec_reb}", side: "BUY", order_type: "MARKET", quantity: 10, expected_account_version: "${v_reb}" }
              as: AccountHolder
              as_user_id: "${acc_reb}"
              captures: { ord_reb: $.data.id }
          trigger:
            - call: "POST /orders/${ord_reb}/fills"
              payload: { fill_quantity: 10, fill_price_cents: 10000 }
              as: ClearingSystem
              captures: { fill_reb: $.data.id }
          assert:
            - "Fill.${fill_reb}.gross_value_cents == 100000 and pfof_rebate_cents == 300"

      - name: drip_below_minimum_returns_error
        claim_type: Input Set Filtering
        grounds: [calculations.drip_reinvest, "errors[ERR_DRIP_BELOW_MINIMUM]"]
        distinguishing_aspect: "A tiny gross dividend (2c) against a $500,000/share security truncates reinvest_quantity to 0, so reinvest returns ERR_DRIP_BELOW_MINIMUM (409)."
        test_recipe:
          setup: ["CASH account holding 1 sh of MEGA (last 50000000c) with DRIP enabled; a 2c/share dividend ANNOUNCED then PAID (gross 2)."]
          setup_api_calls:
            - call: "POST /securities"
              payload: { symbol: "MEGA", instrument_type: "EQUITY", last_price_cents: 50000000, fractional_enabled: true }
              as: ClearingSystem
              captures: { sec_meg: $.data.id }
            - call: "POST /accounts"
              payload: { holder_email: "meg@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_meg: $.data.id }
            - call: "POST /accounts/${acc_meg}/deposits"
              payload: { amount_cents: 60000000, instant_eligible: true }
              as: AccountHolder
              as_user_id: "${acc_meg}"
            - call: "GET /accounts/${acc_meg}"
              as: AccountHolder
              as_user_id: "${acc_meg}"
              captures: { v_meg: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_meg}", security_id: "${sec_meg}", side: "BUY", order_type: "MARKET", quantity: 1, expected_account_version: "${v_meg}" }
              as: AccountHolder
              as_user_id: "${acc_meg}"
              captures: { ord_meg: $.data.id }
            - call: "POST /orders/${ord_meg}/fills"
              payload: { fill_quantity: 1, fill_price_cents: 50000000 }
              as: ClearingSystem
            - call: "GET /positions"
              payload: { account_id: "${acc_meg}" }
              as: AccountHolder
              as_user_id: "${acc_meg}"
              captures: { pos_meg: "$.data[0].id" }
            - call: "PATCH /positions/${pos_meg}/drip"
              payload: { drip_enabled: true }
              as: AccountHolder
              as_user_id: "${acc_meg}"
            - call: "POST /dividends"
              payload: { account_id: "${acc_meg}", position_id: "${pos_meg}", rate_per_share_cents: 2, ex_date: "2026-07-01T00:00:00Z" }
              as: ClearingSystem
              captures: { div_meg: $.data.id }
            - call: "POST /dividends/${div_meg}/pay"
              as: ClearingSystem
          trigger:
            - call: "POST /dividends/${div_meg}/reinvest"
              as: ClearingSystem
              captures: { err_meg: $.data.error_id }
          assert:
            - "DividendEvent.${div_meg}.gross_amount_cents == 2 and reinvest_quantity == 0"
            - "Reinvest returns status 409 and data.error_id == ERR_DRIP_BELOW_MINIMUM"

      - name: disposal_long_term_classification
        claim_type: Correct Result
        grounds: [calculations.cost_basis_disposal, entities.Disposal.fields.term]
        distinguishing_aspect: "A lot acquired then sold more than 365 days later (clock advanced > 1 year) yields Disposal.term == LONG."
        test_recipe:
          setup: ["CASH account holding a lot of 2 sh of LTCO @5000c acquired at clock 2026-01-01; clock then advanced past 2027-02-01 (>365 days)."]
          setup_api_calls:
            - call: "POST /securities"
              payload: { symbol: "LTCO", instrument_type: "EQUITY", last_price_cents: 10000, fractional_enabled: true }
              as: ClearingSystem
              captures: { sec_lt: $.data.id }
            - call: "POST /accounts"
              payload: { holder_email: "lt@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_lt: $.data.id }
            - call: "POST /accounts/${acc_lt}/deposits"
              payload: { amount_cents: 100000, instant_eligible: true }
              as: AccountHolder
              as_user_id: "${acc_lt}"
            - call: "GET /accounts/${acc_lt}"
              as: AccountHolder
              as_user_id: "${acc_lt}"
              captures: { v_lt_1: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_lt}", security_id: "${sec_lt}", side: "BUY", order_type: "MARKET", quantity: 2, expected_account_version: "${v_lt_1}" }
              as: AccountHolder
              as_user_id: "${acc_lt}"
              captures: { ord_lt_b: $.data.id }
            - call: "POST /orders/${ord_lt_b}/fills"
              payload: { fill_quantity: 2, fill_price_cents: 5000 }
              as: ClearingSystem
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2027-02-02T00:00:00Z" }
              as: ClearingSystem
            - call: "GET /accounts/${acc_lt}"
              as: AccountHolder
              as_user_id: "${acc_lt}"
              captures: { v_lt_2: $.data.version }
          trigger:
            - call: "POST /orders"
              payload: { account_id: "${acc_lt}", security_id: "${sec_lt}", side: "SELL", order_type: "MARKET", quantity: 1, is_closing: true, expected_account_version: "${v_lt_2}" }
              as: AccountHolder
              as_user_id: "${acc_lt}"
              captures: { ord_lt_s: $.data.id }
            - call: "POST /orders/${ord_lt_s}/fills"
              payload: { fill_quantity: 1, fill_price_cents: 10000 }
              as: ClearingSystem
          assert:
            - "The resulting Disposal has term == LONG (held > 365 days), proceeds_cents 10000, cost_basis_cents 5000, realized_pl_cents 5000"

  # ===========================================================================
  - section: validations
    instances:
      - name: extended_hours_market_order_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=13]", "errors[ERR_EXTENDED_HOURS_LIMIT_ONLY]"]
        distinguishing_aspect: "An EXTENDED-session MARKET order returns ERR_EXTENDED_HOURS_LIMIT_ONLY (422) — extended hours accept LIMIT only."
        test_recipe:
          setup: ["CASH account funded $1000.00; security EXTCO extended_hours_eligible true, last 10000c."]
          setup_api_calls:
            - call: "POST /securities"
              payload: { symbol: "EXTCO", instrument_type: "EQUITY", last_price_cents: 10000, fractional_enabled: true, extended_hours_eligible: true }
              as: ClearingSystem
              captures: { sec_ext: $.data.id }
            - call: "POST /accounts"
              payload: { holder_email: "ext@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_ext: $.data.id }
            - call: "POST /accounts/${acc_ext}/deposits"
