        claim_type: reconciliation
        grounds:
          - calculations.royalty_accrual
          - state_machines.RoyaltyStatement.transitions[DRAFT -> DRAFT]
          - state_machines.RoyaltyStatement.transitions[DRAFT -> UNDER_TRUEUP]
          - state_machines.RoyaltyStatement.transitions[UNDER_TRUEUP -> ISSUED]
