# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 breadth probe for task_2490
# (faith-based group travel & pilgrimage tour operator).
# Walks references/claim-extraction-guide.md section by section against SCAFFOLD.yaml's
# §1.1-§1.7. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# excluded_because: stubs naming the covering §1.8 instance.
# Logical clock default is 2026-08-01T00:00:00Z; every recipe below either relies on that
# default or moves it explicitly with POST /_clock/set_current_utc.

scaffold_corner_design:
  - section: entities
    instances:
      - name: program_create_echoes_every_input_field
        claim_type: creation
        grounds:
          - entities.Program
          - endpoints."POST /programs"
        distinguishing_aspect: "POST /programs with all six required fields returns 201 and echoes name, destination_country, faith_tradition, duration_days and both nested arrays inside the success envelope."
        test_recipe:
          setup:
            - "Empty database; clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload:
                name: "Marian Shrines of Europe"
                destination_country: "PT"
                faith_tradition: "CATHOLIC"
                duration_days: 9
                price_tiers:
                  - { tier_code: "S1", min_pax: 1, max_pax: 14, per_pax_price_cents: 299000, single_supplement_cents: 41000, deposit_cents: 30000 }
                  - { tier_code: "S2", min_pax: 15, max_pax: 30, per_pax_price_cents: 268000, single_supplement_cents: 38000, deposit_cents: 30000 }
                cancellation_grid:
                  - { min_days_before: 45, penalty_bp: 2500 }
                  - { min_days_before: 0, penalty_bp: 10000 }
              as: ProgramManager
          assert:
            - "response.status == 201"
            - "response.response_type == object"
            - "response.meta.api_request_id is present"
            - "response.data.name == Marian Shrines of Europe"
            - "response.data.destination_country == PT"
            - "response.data.faith_tradition == CATHOLIC"
            - "response.data.duration_days == 9"
            - "response.data.price_tiers[1].tier_code == S2"
            - "response.data.cancellation_grid[0].penalty_bp == 2500"
            - "response.data.version == 1"

      - name: departure_get_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.Departure
          - endpoints."GET /departures/{departureId}"
        distinguishing_aspect: "GET /departures/{departureId} returns the row exactly as created, with the computed defaults status PLANNING and risk_posture OPEN and a null governing_advisory_id."
        test_recipe:
          setup:
            - "One Holy Land program and one departure created at the default clock, never opened for sale."
          setup_api_calls:
            - call: "POST /programs"
              payload:
                name: "Holy Land Pilgrimage"
                destination_country: "IL"
                faith_tradition: "CATHOLIC"
                duration_days: 10
                price_tiers:
                  - { tier_code: "T1", min_pax: 1, max_pax: 9, per_pax_price_cents: 587000, single_supplement_cents: 98000, deposit_cents: 50000 }
                cancellation_grid:
                  - { min_days_before: 60, penalty_bp: 3500 }
                  - { min_days_before: 0, penalty_bp: 10000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /departures"
              payload: { program_id: "${prog_id}", departure_date: "2026-11-01", return_date: "2026-11-11", min_pax: 1, max_pax: 40, deposit_due_date: "2026-08-15", final_payment_due_date: "2026-10-15", mobility_accessible_coach: true }
              as: ProgramManager
              captures: { dep_id: $.data.id }
          trigger:
            - call: "GET /departures/${dep_id}"
              payload: {}
              as: ProgramManager
          assert:
            - "response.status == 200"
            - "response.data.id == ${dep_id}"
            - "response.data.program_id == ${prog_id}"
            - "response.data.departure_date == 2026-11-01"
            - "response.data.status == PLANNING"
            - "response.data.risk_posture == OPEN"
            - "response.data.governing_advisory_id == null"
            - "response.data.mobility_accessible_coach == true"

      - name: pilgrims_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints."GET /pilgrims"
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /pilgrims filtered by departure_id with limit 2 and offset 2 returns the third row only, reporting total_count 3 and has_more false."
        test_recipe:
          setup:
            - "One Holy Land departure OPEN_FOR_SALE with exactly three INQUIRY travelers."
          setup_api_calls:
            - call: "POST /programs"
              payload:
                name: "Holy Land Pilgrimage"
                destination_country: "IL"
                faith_tradition: "CATHOLIC"
                duration_days: 10
                price_tiers:
                  - { tier_code: "T1", min_pax: 1, max_pax: 9, per_pax_price_cents: 587000, single_supplement_cents: 98000, deposit_cents: 50000 }
                cancellation_grid:
                  - { min_days_before: 60, penalty_bp: 3500 }
                  - { min_days_before: 0, penalty_bp: 10000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /departures"
              payload: { program_id: "${prog_id}", departure_date: "2026-11-01", return_date: "2026-11-11", min_pax: 1, max_pax: 40, deposit_due_date: "2026-08-15", final_payment_due_date: "2026-10-15", mobility_accessible_coach: true }
              as: ProgramManager
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open-sales"
              payload: {}
              as: ProgramManager
            - call: "POST /pilgrims"
              payload: { departure_id: "${dep_id}", full_name: "Traveler A", date_of_birth: "1975-01-10", room_type_requested: "DOUBLE" }
              as: ProgramManager
            - call: "POST /pilgrims"
              payload: { departure_id: "${dep_id}", full_name: "Traveler B", date_of_birth: "1976-03-12", room_type_requested: "DOUBLE" }
              as: ProgramManager
            - call: "POST /pilgrims"
              payload: { departure_id: "${dep_id}", full_name: "Traveler C", date_of_birth: "1977-05-14", room_type_requested: "TWIN" }
              as: ProgramManager
              captures: { pil_c_id: $.data.id }
          trigger:
            - call: "GET /pilgrims"
              payload: { departure_id: "${dep_id}", limit: 2, offset: 2 }
              as: ProgramManager
          assert:
            - "response.status == 200"
            - "response.response_type == array"
            - "response.data.length == 1"
            - "response.data[0].id == ${pil_c_id}"
            - "response.total_count == 3"
            - "response.limit == 2"
            - "response.offset == 2"
            - "response.has_more == false"

      - name: departure_get_unknown_id_returns_departure_not_found
        claim_type: not_found
        grounds:
          - validations.priority_20
          - errors[ERR_DEPARTURE_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unknown departure id on GET /departures/{departureId} returns ERR_DEPARTURE_NOT_FOUND with HTTP 404, not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /departures/8f2a4c16-0000-4000-8000-000000000001"
              payload: {}
              as: ProgramManager
          assert:
            - "response.status == 404"
            - "response.response_type == error"
            - "response.data.error_id == ERR_DEPARTURE_NOT_FOUND"

      - name: air_block_create_without_carrier_code_is_invalid_request
        claim_type: required_fields
        grounds:
          - validations.priority_24
          - entities.AirBlock.fields.carrier_code
        distinguishing_aspect: "Omitting the required carrier_code from POST /air-blocks returns ERR_INVALID_REQUEST 400 and creates no AirBlock row, even though every other required field is present and valid."
        test_recipe:
          setup:
            - "One Holy Land departure in PLANNING."
          setup_api_calls:
            - call: "POST /programs"
              payload:
                name: "Holy Land Pilgrimage"
                destination_country: "IL"
                faith_tradition: "CATHOLIC"
                duration_days: 10
                price_tiers:
                  - { tier_code: "T1", min_pax: 1, max_pax: 9, per_pax_price_cents: 587000, single_supplement_cents: 98000, deposit_cents: 50000 }
                cancellation_grid:
                  - { min_days_before: 60, penalty_bp: 3500 }
                  - { min_days_before: 0, penalty_bp: 10000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /departures"
              payload: { program_id: "${prog_id}", departure_date: "2026-11-01", return_date: "2026-11-11", min_pax: 1, max_pax: 40, deposit_due_date: "2026-08-15", final_payment_due_date: "2026-10-15", mobility_accessible_coach: true }
              as: ProgramManager
              captures: { dep_id: $.data.id }
          trigger:
            - call: "POST /air-blocks"
              payload: { departure_id: "${dep_id}", seats_held: 20, name_change_deadline_utc: "2026-09-20T00:00:00Z", deposit_deadline_utc: "2026-08-25T00:00:00Z" }
              as: AirDeskAgent
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: pilgrim_create_applies_declared_field_defaults
        claim_type: defaults
        grounds:
          - entities.Pilgrim.fields.mobility_code
          - entities.Pilgrim.fields.risk_acknowledged
          - entities.Pilgrim.fields.is_free_seat_grant
          - entities.Pilgrim.fields.dietary_codes
        distinguishing_aspect: "Omitting the four optional inputs of POST /pilgrims yields mobility_code NONE, risk_acknowledged false, is_free_seat_grant false, recruited_by_agreement_id null and dietary_codes exactly [\"NONE\"]."
        test_recipe:
          setup:
            - "One Holy Land departure OPEN_FOR_SALE."
          setup_api_calls:
            - call: "POST /programs"
              payload:
                name: "Holy Land Pilgrimage"
                destination_country: "IL"
                faith_tradition: "CATHOLIC"
                duration_days: 10
                price_tiers:
                  - { tier_code: "T1", min_pax: 1, max_pax: 9, per_pax_price_cents: 587000, single_supplement_cents: 98000, deposit_cents: 50000 }
                cancellation_grid:
                  - { min_days_before: 60, penalty_bp: 3500 }
                  - { min_days_before: 0, penalty_bp: 10000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /departures"
              payload: { program_id: "${prog_id}", departure_date: "2026-11-01", return_date: "2026-11-11", min_pax: 1, max_pax: 40, deposit_due_date: "2026-08-15", final_payment_due_date: "2026-10-15", mobility_accessible_coach: true }
              as: ProgramManager
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open-sales"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /pilgrims"
              payload: { departure_id: "${dep_id}", full_name: "Traveler A", date_of_birth: "1975-01-10", room_type_requested: "DOUBLE" }
              as: ProgramManager
          assert:
            - "response.status == 201"
            - "response.data.mobility_code == NONE"
            - "response.data.risk_acknowledged == false"
            - "response.data.is_free_seat_grant == false"
            - "response.data.recruited_by_agreement_id == null"
            - "response.data.dietary_codes == [NONE]"
            - "response.data.booking_status == INQUIRY"
            - "response.data.payment_status == UNPAID"
            - "response.data.protection_status == NONE"
            - "response.data.age_at_departure == 51"

      - name: land_assignment_computes_days_inclusive_and_fx_line
        claim_type: computed_fields
        grounds:
          - entities.LandAssignment.fields.days_inclusive
          - entities.LandAssignment.fields.line_local_cents
          - entities.LandAssignment.fields.line_usd_cents
        distinguishing_aspect: "days_inclusive counts both endpoint dates (2026-10-05..2026-10-09 is 5, not 4) and line_usd_cents is the single round_half_up of 1350000 * 10833 / 10000 = 1462455, values the client never supplies."
        test_recipe:
          setup:
            - "A hotel room block of 10 units at 45000 local cents per unit-night with fx_rate_bp 10833."
            - "One Holy Land departure in PLANNING."
          setup_api_calls:
            - call: "POST /programs"
              payload:
                name: "Holy Land Pilgrimage"
                destination_country: "IL"
                faith_tradition: "CATHOLIC"
                duration_days: 10
                price_tiers:
                  - { tier_code: "T1", min_pax: 1, max_pax: 9, per_pax_price_cents: 587000, single_supplement_cents: 98000, deposit_cents: 50000 }
                cancellation_grid:
                  - { min_days_before: 60, penalty_bp: 3500 }
                  - { min_days_before: 0, penalty_bp: 10000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /departures"
              payload: { program_id: "${prog_id}", departure_date: "2026-10-05", return_date: "2026-10-15", min_pax: 1, max_pax: 40, deposit_due_date: "2026-08-15", final_payment_due_date: "2026-09-15", mobility_accessible_coach: true }
              as: ProgramManager
              captures: { dep_id: $.data.id }
            - call: "POST /land-resources"
              payload: { operator_name: "Jerusalem Ground Services", country: "IL", resource_type: "HOTEL_ROOM_BLOCK", units_total: 10, unit_rate_local_cents: 45000, fx_rate_bp: 10833, force_majeure_notice_days: 30 }
              as: LandContractor
              captures: { lr_id: $.data.id }
          trigger:
            - call: "POST /land-assignments"
              payload: { land_resource_id: "${lr_id}", departure_id: "${dep_id}", date_from: "2026-10-05", date_to: "2026-10-09", units_requested: 6 }
              as: LandContractor
          assert:
            - "response.status == 201"
            - "response.data.days_inclusive == 5"
            - "response.data.line_local_cents == 1350000"
            - "response.data.line_usd_cents == 1462455"
            - "response.data.status == DRAFT"
            - "response.data.terminated_penalty_free == false"

      - name: sacred_site_system_fields_are_server_generated
        claim_type: system_fields
        grounds:
          - entities.SacredSite
          - endpoints."POST /sacred-sites"
        distinguishing_aspect: "id, created_at, updated_at and version on a new SacredSite are generated by the server: version is 1 and created_at equals the logical clock 2026-08-01T00:00:00Z rather than any client value."
        test_recipe:
          setup:
            - "Empty database at the default clock 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /sacred-sites"
              payload: { name: "Basilica of the Holy Sepulchre", country: "IL", access_regime: "PERMIT_REQUIRED", daily_capacity_pax: 200, turnaround_buffer_minutes: 30, requires_local_clergy: true }
              as: ProgramManager
          assert:
            - "response.status == 201"
            - "response.data.id is a non-empty string"
            - "response.data.version == 1"
            - "response.data.created_at == 2026-08-01T00:00:00Z"
            - "response.data.updated_at == 2026-08-01T00:00:00Z"

      - name: sacred_site_rejects_unknown_access_regime_enum
        claim_type: type_constraints
        grounds:
          - validations.priority_24
          - entities.SacredSite.fields.access_regime
        distinguishing_aspect: "An access_regime outside {OPEN_ACCESS, PERMIT_REQUIRED, TICKETED_SLOT} is rejected with ERR_INVALID_REQUEST 400 rather than stored verbatim."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /sacred-sites"
              payload: { name: "Unknown Shrine", country: "IL", access_regime: "BY_ARRANGEMENT", daily_capacity_pax: 50, turnaround_buffer_minutes: 15, requires_local_clergy: false }
              as: ProgramManager
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: payment_row_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.Payment
          - endpoints."GET /payments/{paymentId}"
        distinguishing_aspect: "Payment declares common_fields false, so a fetched payment exposes no version field and the only mutation offered is POST /payments/{paymentId}/reverse, which flips status to REVERSED instead of editing amount_cents."
        test_recipe:
          setup:
            - "One Holy Land departure OPEN_FOR_SALE with one traveler who has paid a 50000 deposit."
          setup_api_calls:
            - call: "POST /programs"
              payload:
                name: "Holy Land Pilgrimage"
                destination_country: "IL"
                faith_tradition: "CATHOLIC"
                duration_days: 10
                price_tiers:
                  - { tier_code: "T1", min_pax: 1, max_pax: 9, per_pax_price_cents: 587000, single_supplement_cents: 98000, deposit_cents: 50000 }
                cancellation_grid:
                  - { min_days_before: 60, penalty_bp: 3500 }
                  - { min_days_before: 0, penalty_bp: 10000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /departures"
              payload: { program_id: "${prog_id}", departure_date: "2026-11-01", return_date: "2026-11-11", min_pax: 1, max_pax: 40, deposit_due_date: "2026-08-15", final_payment_due_date: "2026-10-15", mobility_accessible_coach: true }
              as: ProgramManager
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open-sales"
              payload: {}
              as: ProgramManager
            - call: "POST /pilgrims"
              payload: { departure_id: "${dep_id}", full_name: "Traveler A", date_of_birth: "1975-01-10", room_type_requested: "DOUBLE" }
              as: ProgramManager
              captures: { pil_id: $.data.id }
            - call: "POST /pilgrims/${pil_id}/payments"
              payload: { amount_cents: 50000, method: "PARISH_TRANSFER" }
              as: FinanceController
              captures: { pay_id: $.data.id }
          trigger:
            - call: "GET /payments/${pay_id}"
              payload: {}
              as: FinanceController
          assert:
            - "response.status == 200"
            - "response.data.amount_cents == 50000"
            - "response.data.method == PARISH_TRANSFER"
            - "response.data.status == APPLIED"
            - "response.data.version is absent"
            - "response.data.updated_at is absent"

      - name: service_booking_create_with_unknown_sacred_site_fk_rejected
        claim_type: foreign_key_integrity
        grounds:
          - validations.priority_26
          - errors[ERR_SACRED_SITE_NOT_FOUND]
          - entities.ServiceBooking.fields.sacred_site_id
        distinguishing_aspect: "In the flat topology a body foreign key is validated against the referenced collection: an unknown sacred_site_id on POST /service-bookings returns ERR_SACRED_SITE_NOT_FOUND 404 even though departure_id resolves."
        test_recipe:
          setup:
            - "One Holy Land departure in PLANNING and no sacred sites at all."
          setup_api_calls:
            - call: "POST /programs"
              payload:
                name: "Holy Land Pilgrimage"
                destination_country: "IL"
                faith_tradition: "CATHOLIC"
                duration_days: 10
                price_tiers:
                  - { tier_code: "T1", min_pax: 1, max_pax: 9, per_pax_price_cents: 587000, single_supplement_cents: 98000, deposit_cents: 50000 }
                cancellation_grid:
                  - { min_days_before: 60, penalty_bp: 3500 }
                  - { min_days_before: 0, penalty_bp: 10000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /departures"
              payload: { program_id: "${prog_id}", departure_date: "2026-11-01", return_date: "2026-11-11", min_pax: 1, max_pax: 40, deposit_due_date: "2026-08-15", final_payment_due_date: "2026-10-15", mobility_accessible_coach: true }
              as: ProgramManager
              captures: { dep_id: $.data.id }
          trigger:
            - call: "POST /service-bookings"
              payload: { departure_id: "${dep_id}", sacred_site_id: "8f2a4c16-0000-4000-8000-0000000000aa", service_type: "MASS", scheduled_start_utc: "2026-11-02T06:00:00Z", duration_minutes: 60, pax_count: 10, permit_reference: "PRM-2026-777" }
              as: ProgramManager
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_SACRED_SITE_NOT_FOUND"

      - name: pilgrim_list_reverse_reachability_by_agreement_fk
        claim_type: parent_relationships
        grounds:
          - endpoints."GET /pilgrims"
          - entities.Pilgrim.fields.recruited_by_agreement_id
        distinguishing_aspect: "The FK Pilgrim.recruited_by_agreement_id is reverse-reachable: GET /pilgrims?recruited_by_agreement_id=<id> returns only the two travelers recruited under that agreement and omits the direct booking."
        test_recipe:
          setup:
            - "One Holy Land departure OPEN_FOR_SALE with an ACTIVE leader agreement."
            - "Two travelers recruited under the agreement and one direct booking with a null agreement."
          setup_api_calls:
            - call: "POST /programs"
              payload:
                name: "Holy Land Pilgrimage"
                destination_country: "IL"
                faith_tradition: "CATHOLIC"
                duration_days: 10
                price_tiers:
                  - { tier_code: "T1", min_pax: 1, max_pax: 9, per_pax_price_cents: 587000, single_supplement_cents: 98000, deposit_cents: 50000 }
                cancellation_grid:
                  - { min_days_before: 60, penalty_bp: 3500 }
                  - { min_days_before: 0, penalty_bp: 10000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /departures"
              payload: { program_id: "${prog_id}", departure_date: "2026-11-01", return_date: "2026-11-11", min_pax: 1, max_pax: 40, deposit_due_date: "2026-08-15", final_payment_due_date: "2026-10-15", mobility_accessible_coach: true }
              as: ProgramManager
              captures: { dep_id: $.data.id, dep_v0: $.data.version }
            - call: "POST /group-leader-agreements"
              payload: { departure_id: "${dep_id}", leader_name: "Fr. Alonso Reyes", leader_user_id: "u-leader-alonso", free_travel_threshold: 6, commission_mode: "PER_PAX_CASH", commission_rate_cents_per_pax: 6000, accrual_basis: "RECRUITED", expected_departure_version: "${dep_v0}" }
              as: ProgramManager
              captures: { agr_id: $.data.id }
            - call: "POST /group-leader-agreements/${agr_id}/countersign"
              payload: {}
              as: GroupLeader
              as_user_id: "${agr_id}"
            - call: "POST /departures/${dep_id}/open-sales"
              payload: {}
              as: ProgramManager
            - call: "POST /pilgrims"
              payload: { departure_id: "${dep_id}", recruited_by_agreement_id: "${agr_id}", full_name: "Recruit One", date_of_birth: "1975-01-10", room_type_requested: "DOUBLE" }
              as: ProgramManager
            - call: "POST /pilgrims"
              payload: { departure_id: "${dep_id}", recruited_by_agreement_id: "${agr_id}", full_name: "Recruit Two", date_of_birth: "1978-02-11", room_type_requested: "DOUBLE" }
              as: ProgramManager
            - call: "POST /pilgrims"
              payload: { departure_id: "${dep_id}", full_name: "Direct Booker", date_of_birth: "1980-06-06", room_type_requested: "SINGLE" }
              as: ProgramManager
          trigger:
            - call: "GET /pilgrims"
              payload: { recruited_by_agreement_id: "${agr_id}" }
              as: ProgramManager
          assert:
            - "response.status == 200"
            - "response.data.length == 2"
            - "response.total_count == 2"
            - "response.data[0].recruited_by_agreement_id == ${agr_id}"
            - "response.data[1].recruited_by_agreement_id == ${agr_id}"

  - section: state_machines
    instances:
      - name: departure_open_sales_transition_writes_provisional_tier
        claim_type: valid_transition
        grounds:
