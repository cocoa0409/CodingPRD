# =============================================================================
# 1.9 Scaffold Corner Design (breadth walk of references/claim-extraction-guide.md)
# Task 2940 - Surcharge & Cash Discount Program Compliance
#
# Shared fixture conventions (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml, but every
# instance below still drives empty-DB -> its own precondition state on its own):
#   logical clock starts at 2026-08-01T00:00:00Z
#   jurisdictions   AZ  surcharge yes cap 4.0  | cash yes | posting no  | signage no  | receipt no  | PERMISSIVE
#                   NY  surcharge yes cap 4.0  | cash yes | posting yes | signage yes | receipt yes | MONITORED
#                   TX  surcharge yes cap 2.0  | cash yes | posting no  | signage no  | receipt no  | PERMISSIVE
#                   CT  surcharge NO  cap null | cash yes | posting yes | signage yes | receipt no  | RESTRICTIVE
#                   MA  surcharge yes cap 3.5  | cash NO  | posting no  | signage no  | receipt no  | PERMISSIVE
#   cost docs       docA 1.85 / 0.14 / 10c -> average_ticket 5000 -> documented_cost_pct 2.1900
#                   docB 2.55 / 0.20 / 15c -> average_ticket 5000 -> documented_cost_pct 3.0500
#   user ids        admin-1, officer-1 / officer-2, auditor-1, regulator-1;
#                   MerchantOperator authenticates as the Merchant id, TerminalAgent as the Terminal id
#   NOTICE_PERIOD_DAYS = 30 (submitted 2026-08-01T00:00:00Z -> effectuable from 2026-08-31T00:00:00Z)
#   the never-minted id literal used for every NOT_FOUND probe is
#   00000000-0000-4000-8000-000000000000
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: jurisdiction_creation_persists_all_declared_fields
        claim_type: creation
        grounds:
          - entities.Jurisdiction
          - endpoints[POST /jurisdictions]
          - rbac.PlatformAdmin
        distinguishing_aspect: "POST /jurisdictions with every declared input returns 201 and echoes all seven inputs plus the computed law_change_count 0, the null last_law_change_at and version 1."
        test_recipe:
          setup:
            - "Empty database; logical clock set to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /jurisdictions"
              payload: { state_code: "MA", surcharge_permitted: true, surcharge_cap_pct: 3.5, cash_discount_permitted: false, price_posting_required: false, disclosure_signage_required: false, receipt_line_item_required: false, ag_enforcement_posture: "PERMISSIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { jur_ma_id: $.data.id }
          assert:
            - "HTTP 201 and response_type == object"
            - "data.state_code == MA and data.surcharge_permitted == true and data.surcharge_cap_pct == 3.5"
            - "data.cash_discount_permitted == false and data.price_posting_required == false and data.disclosure_signage_required == false and data.receipt_line_item_required == false"
            - "data.ag_enforcement_posture == PERMISSIVE"
            - "data.law_change_count == 0 and data.last_law_change_at == null"
            - "data.version == 1 and data.id is a UUID with no type prefix and data.created_at is an ISO 8601 UTC instant with three fractional digits"

      - name: jurisdiction_retrieval_by_id_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /jurisdictions/{id}]
          - entities.Jurisdiction.fields.surcharge_cap_pct
        distinguishing_aspect: "GET /jurisdictions/{id} returns exactly the row created earlier, including surcharge_cap_pct 2.0, and is readable by a non-admin role."
        test_recipe:
          setup:
            - "One jurisdiction TX created by the platform admin at clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", surcharge_permitted: true, surcharge_cap_pct: 2.0, cash_discount_permitted: true, price_posting_required: false, disclosure_signage_required: false, receipt_line_item_required: false, ag_enforcement_posture: "PERMISSIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { jur_tx_id: $.data.id }
          trigger:
            - call: "GET /jurisdictions/${jur_tx_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "HTTP 200 and data.id == ${jur_tx_id}"
            - "data.state_code == TX and data.surcharge_cap_pct == 2.0 and data.ag_enforcement_posture == PERMISSIVE"
            - "data.version == 1 and data.law_change_count == 0"

      - name: jurisdiction_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /jurisdictions]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three jurisdictions stored, limit 2 offset 0 returns 2 rows with total_count 3 and has_more true, and limit 2 offset 2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "Three jurisdictions AZ, NY and TX created in that order at clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /jurisdictions"
              payload: { state_code: "AZ", surcharge_permitted: true, surcharge_cap_pct: 4.0, cash_discount_permitted: true, price_posting_required: false, disclosure_signage_required: false, receipt_line_item_required: false, ag_enforcement_posture: "PERMISSIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /jurisdictions"
              payload: { state_code: "NY", surcharge_permitted: true, surcharge_cap_pct: 4.0, cash_discount_permitted: true, price_posting_required: true, disclosure_signage_required: true, receipt_line_item_required: true, ag_enforcement_posture: "MONITORED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", surcharge_permitted: true, surcharge_cap_pct: 2.0, cash_discount_permitted: true, price_posting_required: false, disclosure_signage_required: false, receipt_line_item_required: false, ag_enforcement_posture: "PERMISSIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /jurisdictions"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "GET /jurisdictions"
              payload: { limit: 2, offset: 2 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "GET /jurisdictions"
              payload: { state_code: "NY" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          assert:
            - "Trigger step 1: HTTP 200, response_type == array, len(data) == 2, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "Trigger step 2: len(data) == 1, total_count == 3, offset == 2, has_more == false"
            - "Trigger step 3: total_count == 1 and data[0].state_code == NY"

      - name: merchant_retrieval_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=40]
          - errors[ERR_MERCHANT_NOT_FOUND]
          - endpoints[GET /merchants/{id}]
        distinguishing_aspect: "GET /merchants/{id} with a well-formed but never-minted UUID returns 404 ERR_MERCHANT_NOT_FOUND in the error envelope rather than 200 with a null body."
        test_recipe:
          setup:
            - "Empty database (no merchant has ever been created)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /merchants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 and response_type == error"
            - "data.error_id == ERR_MERCHANT_NOT_FOUND"
            - "meta.api_request_id and meta.api_request_timestamp are present on the error envelope"

      - name: merchant_creation_missing_required_mcc_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=60]
          - errors[ERR_INVALID_REQUEST]
          - entities.Merchant.fields.mcc
        distinguishing_aspect: "Omitting the required mcc field on POST /merchants returns 400 ERR_INVALID_REQUEST and stores no merchant row."
        test_recipe:
          setup:
            - "One jurisdiction AZ at clock 2026-08-01T00:00:00Z; no merchants."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /jurisdictions"
              payload: { state_code: "AZ", surcharge_permitted: true, surcharge_cap_pct: 4.0, cash_discount_permitted: true, price_posting_required: false, disclosure_signage_required: false, receipt_line_item_required: false, ag_enforcement_posture: "PERMISSIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { jur_az_id: $.data.id }
          trigger:
            - call: "POST /merchants"
              payload: { jurisdiction_id: "${jur_az_id}", legal_name: "Sonoran Supply Co" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /merchants returns total_count == 0"

      - name: terminal_creation_defaults_state_provisioned_and_null_program
        claim_type: defaults
        grounds:
          - entities.Terminal.fields.state
          - entities.Terminal.fields.program_id
          - entities.Terminal.fields.debit_exclusion_enabled
          - entities.Terminal.fields.bin_table_version
          - state_machines.Terminal.initial_state
        distinguishing_aspect: "POST /merchants/{id}/terminals takes only serial_number, so the new row defaults to state PROVISIONED with program_id null, debit_exclusion_enabled false, bin_table_version null and last_configured_at null."
        test_recipe:
          setup:
            - "One jurisdiction AZ and one merchant at clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /jurisdictions"
              payload: { state_code: "AZ", surcharge_permitted: true, surcharge_cap_pct: 4.0, cash_discount_permitted: true, price_posting_required: false, disclosure_signage_required: false, receipt_line_item_required: false, ag_enforcement_posture: "PERMISSIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { jur_az_id: $.data.id }
            - call: "POST /merchants"
              payload: { jurisdiction_id: "${jur_az_id}", legal_name: "Sonoran Supply Co", mcc: "5734" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { merch_id: $.data.id }
          trigger:
            - call: "POST /merchants/${merch_id}/terminals"
              payload: { serial_number: "TRM-AZ-0001" }
              as: MerchantOperator
              as_user_id: "${merch_id}"
              captures: { term_id: $.data.id }
          assert:
            - "HTTP 201 and data.state == PROVISIONED"
            - "data.program_id == null and data.bin_table_version == null and data.last_configured_at == null"
            - "data.debit_exclusion_enabled == false and data.quarantine_reason == NONE"
            - "data.merchant_id == ${merch_id} and data.serial_number == TRM-AZ-0001 and data.version == 1"
            - "GET /merchants/${merch_id} returns data.enforcing_terminal_count == 0"

      - name: merchant_creation_defaults_ledger_counters_to_zero
        claim_type: defaults
        grounds:
          - entities.Merchant.fields.gross_surcharge_collected_cents
          - entities.Merchant.fields.net_surcharge_collected_cents
          - entities.Merchant.fields.enforcing_terminal_count
          - entities.Merchant.fields.active_cost_documentation_id
        distinguishing_aspect: "A freshly created merchant reports gross 0, net 0, enforcing_terminal_count 0 and active_cost_documentation_id null before any cost document, terminal or sale exists."
        test_recipe:
          setup:
            - "One jurisdiction AZ at clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /jurisdictions"
              payload: { state_code: "AZ", surcharge_permitted: true, surcharge_cap_pct: 4.0, cash_discount_permitted: true, price_posting_required: false, disclosure_signage_required: false, receipt_line_item_required: false, ag_enforcement_posture: "PERMISSIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { jur_az_id: $.data.id }
          trigger:
            - call: "POST /merchants"
              payload: { jurisdiction_id: "${jur_az_id}", legal_name: "Sonoran Supply Co", mcc: "5734" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { merch_id: $.data.id }
          assert:
            - "HTTP 201 and data.gross_surcharge_collected_cents == 0 and data.net_surcharge_collected_cents == 0"
            - "data.enforcing_terminal_count == 0 and data.active_cost_documentation_id == null"
            - "data.jurisdiction_id == ${jur_az_id} and data.version == 1"

      - name: cost_documentation_computed_fields_average_ticket_and_documented_cost
        claim_type: computed_fields
        grounds:
          - calculations.average_ticket_snapshot
          - calculations.cost_documentation_evaluation
          - entities.CostDocumentation.fields.average_ticket_cents
          - entities.CostDocumentation.fields.documented_cost_pct
        distinguishing_aspect: "With no transactions on file the snapshot falls back to DEFAULT_AVERAGE_TICKET_CENTS 5000, so docA (1.85 / 0.14 / 10c) freezes average_ticket_cents 5000 and documented_cost_pct 2.1900 exactly."
        test_recipe:
          setup:
            - "One jurisdiction AZ and one merchant with no terminals and no transactions; clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /jurisdictions"
              payload: { state_code: "AZ", surcharge_permitted: true, surcharge_cap_pct: 4.0, cash_discount_permitted: true, price_posting_required: false, disclosure_signage_required: false, receipt_line_item_required: false, ag_enforcement_posture: "PERMISSIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { jur_az_id: $.data.id }
            - call: "POST /merchants"
              payload: { jurisdiction_id: "${jur_az_id}", legal_name: "Sonoran Supply Co", mcc: "5734" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { merch_id: $.data.id, merch_v0: $.data.version }
          trigger:
            - call: "POST /merchants/${merch_id}/cost-documentations"
              payload: { base_mdr_pct: 1.85, assessment_pct: 0.14, per_item_fee_cents: 10, evidence_uri: "s3://acq/az/2026-07.pdf", expected_merchant_version: "${merch_v0}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { doc_a_id: $.data.id }
          assert:
            - "HTTP 201 and data.average_ticket_cents == 5000"
            - "data.documented_cost_pct == 2.1900 (1.85 + 0.14 + round_half_up(10 / 5000 * 100, 4) == 1.85 + 0.14 + 0.2000)"
            - "data.state == ACTIVE and data.superseded_at == null"
            - "GET /merchants/${merch_id} returns data.active_cost_documentation_id == ${doc_a_id}"

      - name: cost_documentation_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.CostDocumentation.fields.attested_by_user_id
          - entities.CostDocumentation.fields.effective_from
          - entities.CostDocumentation.fields.state
          - endpoints[POST /merchants/{id}/cost-documentations]
        distinguishing_aspect: "attested_by_user_id, effective_from and state are server-derived: a payload that also carries state SUPERSEDED and an effective_from of 2020-01-01 still yields state ACTIVE, effective_from equal to the logical clock, and attested_by_user_id equal to the X-User-ID header."
        test_recipe:
          setup:
            - "One jurisdiction AZ and one merchant; clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /jurisdictions"
              payload: { state_code: "AZ", surcharge_permitted: true, surcharge_cap_pct: 4.0, cash_discount_permitted: true, price_posting_required: false, disclosure_signage_required: false, receipt_line_item_required: false, ag_enforcement_posture: "PERMISSIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { jur_az_id: $.data.id }
            - call: "POST /merchants"
              payload: { jurisdiction_id: "${jur_az_id}", legal_name: "Sonoran Supply Co", mcc: "5734" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { merch_id: $.data.id, merch_v0: $.data.version }
          trigger:
            - call: "POST /merchants/${merch_id}/cost-documentations"
              payload: { base_mdr_pct: 1.85, assessment_pct: 0.14, per_item_fee_cents: 10, evidence_uri: "s3://acq/az/2026-07.pdf", expected_merchant_version: "${merch_v0}", state: "SUPERSEDED", effective_from: "2020-01-01T00:00:00Z", attested_by_user_id: "officer-9" }
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { doc_id: $.data.id }
          assert:
            - "HTTP 201 and data.state == ACTIVE (the supplied SUPERSEDED is ignored)"
            - "data.effective_from == 2026-08-01T00:00:00.000Z (the supplied 2020-01-01 is ignored)"
            - "data.attested_by_user_id == officer-2 (taken from X-User-ID, not from the body)"
            - "data.id is a server-minted UUID and data.version == 1"

      - name: jurisdiction_cap_out_of_range_rejected
        claim_type: type_constraints
        grounds:
          - entities.Jurisdiction.fields.surcharge_cap_pct
          - validations[priority=60]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "surcharge_cap_pct is constrained to 0 < value <= 100, so 150.0 is rejected with 400 ERR_INVALID_REQUEST before the cap-required rule at priority 62 ever runs."
        test_recipe:
          setup:
            - "Empty database; clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /jurisdictions"
              payload: { state_code: "AZ", surcharge_permitted: true, surcharge_cap_pct: 150.0, cash_discount_permitted: true, price_posting_required: false, disclosure_signage_required: false, receipt_line_item_required: false, ag_enforcement_posture: "PERMISSIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /jurisdictions returns total_count == 0"

      - name: brand_rate_rule_unknown_brand_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.BrandRateRule.fields.brand
          - validations[priority=60]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "brand is closed over {VISA, MASTERCARD, DISCOVER, AMEX}, so a rate rule naming UNIONPAY is rejected with 400 ERR_INVALID_REQUEST even though every other field and the OCC version are valid."
        test_recipe:
          setup:
            - "Jurisdiction AZ, one merchant with docA, one DRAFT SURCHARGE program with consistency_scope BRAND_LEVEL; clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /jurisdictions"
              payload: { state_code: "AZ", surcharge_permitted: true, surcharge_cap_pct: 4.0, cash_discount_permitted: true, price_posting_required: false, disclosure_signage_required: false, receipt_line_item_required: false, ag_enforcement_posture: "PERMISSIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { jur_az_id: $.data.id }
            - call: "POST /merchants"
              payload: { jurisdiction_id: "${jur_az_id}", legal_name: "Sonoran Supply Co", mcc: "5734" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { merch_id: $.data.id, merch_v0: $.data.version }
            - call: "POST /merchants/${merch_id}/cost-documentations"
              payload: { base_mdr_pct: 1.85, assessment_pct: 0.14, per_item_fee_cents: 10, evidence_uri: "s3://acq/az/2026-07.pdf", expected_merchant_version: "${merch_v0}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { doc_a_id: $.data.id }
            - call: "POST /surcharge-programs"
              payload: { merchant_id: "${merch_id}", jurisdiction_id: "${jur_az_id}", cost_documentation_id: "${doc_a_id}", program_type: "SURCHARGE", consistency_scope: "BRAND_LEVEL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
          trigger:
            - call: "POST /surcharge-programs/${prog_id}/rate-rules"
              payload: { brand: "UNIONPAY", product_tier: "ALL", rate_pct: 2.0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_program_version: "${prog_v0}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /brand-rate-rules with program_id ${prog_id} returns total_count == 0"

      - name: terminal_creation_under_unknown_merchant_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=40]
          - errors[ERR_MERCHANT_NOT_FOUND]
          - endpoints[POST /merchants/{id}/terminals]
        distinguishing_aspect: "The nested terminal-creation route resolves its parent first: a never-minted merchant id in the path yields 404 ERR_MERCHANT_NOT_FOUND, not 403 ERR_MERCHANT_OWNERSHIP_REQUIRED."
        test_recipe:
          setup:
            - "Empty database (no merchants); clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /merchants/00000000-0000-4000-8000-000000000000/terminals"
              payload: { serial_number: "TRM-GHOST-0001" }
              as: MerchantOperator
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 and data.error_id == ERR_MERCHANT_NOT_FOUND"
            - "GET /terminals returns total_count == 0"

      - name: program_creation_with_other_merchants_cost_documentation_rejected
        claim_type: foreign_key_references_validated
