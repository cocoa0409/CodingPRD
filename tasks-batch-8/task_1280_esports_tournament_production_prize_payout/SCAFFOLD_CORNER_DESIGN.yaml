            - { call: "POST /api/talent-bookings", payload: { tournament_id: "${t}", talent_id: "${tx}", stage_label: "MAIN", shift_start_at: "2026-08-12T10:00:00Z", shift_end_at: "2026-08-12T12:00:00Z" }, as: BroadcastProducer, captures: { b2: $.data.id } }
          assert:
