            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T10:04:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /dough-batches/${db_id}/advance"
              payload: {}
              as: CrewMember
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T10:05:00Z" }
              as: StoreManager
