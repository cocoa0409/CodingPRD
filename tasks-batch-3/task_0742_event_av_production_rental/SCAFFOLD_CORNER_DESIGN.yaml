        claim_type: Violation → Error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no valid X-User-Role returns 401 ERR_UNAUTHENTICATED before any business logic."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
