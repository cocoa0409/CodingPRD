# =============================================================================
# §1.9 Scaffold Corner Design (Claim Coverage Index)
#
#   Task 2675 — Consumer Product Safety Reporting & Recall
#
#   Walks references/claim-extraction-guide.md against §1.1–§1.7 of SCAFFOLD.yaml.
#   Corners already pinned by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear here as
#   `excluded_because:` stubs that name the owning difficulty instance instead of
#   duplicating its recipe.
#
#   The nonexistent-row probes below all use the fixed literal
#   00000000-0000-0000-0000-000000000000, which no factory ever mints.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: Entities
    instances:

      - name: product_model_creation_returns_every_declared_field
        claim_type: Creation
        grounds:
          - entities.ProductModel
          - endpoints["POST /product-safety/product-models"]
        distinguishing_aspect: |
          The 201 body of the root entity must carry all five input fields plus the
          two computed postures plus the four common fields — thirteen keys in one
          response — so a partial serializer is caught at the very first call
          rather than three entities downstream.
        test_recipe:
          setup:
            - "empty database, logical clock left at its 2026-08-01T00:00:00Z startup default"
          setup_api_calls: []
          trigger:
            - call: "POST /product-safety/product-models"
              payload: { model_code: "TOAST-X1", brand: "Hearthline", category: "KITCHEN_APPLIANCE", units_distributed: 100, units_registered: 60 }
              as: ProgramAdmin
              captures: { pm_id: $.data.id, pm_v: $.data.version }
          assert:
            - "HTTP 201"
            - "ProductModel.${pm_id}.model_code == TOAST-X1"
            - "ProductModel.${pm_id}.brand == Hearthline"
            - "ProductModel.${pm_id}.category == KITCHEN_APPLIANCE"
            - "ProductModel.${pm_id}.units_distributed == 100"
            - "ProductModel.${pm_id}.units_registered == 60"
            - "ProductModel.${pm_id}.hazard_posture == MONITORED"
            - "ProductModel.${pm_id}.open_escalation_count == 0"
            - "ProductModel.${pm_id}.version == 1"
            - "ProductModel.${pm_id}.created_at == 2026-08-01T00:00:00Z (the mandated startup default of the logical clock)"
            - "ProductModel.${pm_id}.updated_at == 2026-08-01T00:00:00Z"
            - "response envelope has exactly the keys data and meta"

      - name: incident_get_by_id_round_trips_every_stored_value
        claim_type: Retrieval
        grounds:
          - entities.Incident
          - endpoints["GET /product-safety/incidents/{id}"]
        distinguishing_aspect: |
          Retrieval, not creation: the values are read back through a DIFFERENT
          endpoint after an intervening write (classify), which is what catches an
          implementation that answers from the request it just handled instead of
          from storage.
        test_recipe:
          setup:
            - "logical clock at 2026-03-01T00:00:00Z"
            - "one ProductModel and one incident classified as HOSPITALIZATION/BURN/verified"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/product-models"
              payload: { model_code: "TOAST-X1", brand: "Hearthline", category: "KITCHEN_APPLIANCE", units_distributed: 100, units_registered: 60 }
              as: ProgramAdmin
              captures: { pm_id: $.data.id }
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "MEDICAL_EXAMINER", incident_date: "2026-01-12T00:00:00Z", narrative: "Base plate weld failed; second-degree burn, consumer hospitalised overnight." }
              as: IntakeSpecialist
              captures: { inc_id: $.data.id }
            - call: "POST /product-safety/incidents/${inc_id}/classify"
              payload: { injury_class: "HOSPITALIZATION", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
          trigger:
            - call: "GET /product-safety/incidents/${inc_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "HTTP 200"
            - "Incident.${inc_id}.product_model_id == ${pm_id}"
            - "Incident.${inc_id}.report_channel == MEDICAL_EXAMINER"
            - "Incident.${inc_id}.incident_date == 2026-01-12T00:00:00Z"
            - "Incident.${inc_id}.injury_class == HOSPITALIZATION"
            - "Incident.${inc_id}.hazard_code == BURN"
            - "Incident.${inc_id}.injury_verified == true"
            - "Incident.${inc_id}.severity_weight == 30.00"
            - "Incident.${inc_id}.status == CLASSIFIED"
            - "Incident.${inc_id}.classified_at == 2026-03-01T00:00:00Z"
            - "Incident.${inc_id}.hazard_pattern_id == null"
            - "Incident.${inc_id}.duplicate_of_incident_id == null"
            - "Incident.${inc_id}.escalation_deadline_at == null"

      - name: incident_list_filters_by_status_and_paginates_independently
        claim_type: Listing
        grounds:
          - endpoints["GET /product-safety/incidents"]
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          Filtering and pagination must compose rather than fight: with three
          CLASSIFIED incidents and one still in INTAKE, status=CLASSIFIED must
          shrink the result to three, and limit=2 must then split those three
          across two windows without letting the INTAKE row leak back in on the
          second window.
        test_recipe:
          setup:
            - "logical clock at 2026-03-01T00:00:00Z"
            - "four incidents on one model created created_at ASC, of which the first three are classified and the fourth left in INTAKE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/product-models"
              payload: { model_code: "TOAST-X1", brand: "Hearthline", category: "KITCHEN_APPLIANCE", units_distributed: 100, units_registered: 60 }
              as: ProgramAdmin
              captures: { pm_id: $.data.id }
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "MEDICAL_EXAMINER", incident_date: "2026-01-12T00:00:00Z", narrative: "Burn requiring hospitalisation." }
              as: IntakeSpecialist
              captures: { i1_id: $.data.id }
            - call: "POST /product-safety/incidents/${i1_id}/classify"
              payload: { injury_class: "HOSPITALIZATION", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "RETAILER", incident_date: "2026-01-20T00:00:00Z", narrative: "Overheating unit scorched a counter." }
              as: IntakeSpecialist
              captures: { i2_id: $.data.id }
            - call: "POST /product-safety/incidents/${i2_id}/classify"
              payload: { injury_class: "MEDICAL_TREATMENT", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "CONSUMER_HOTLINE", incident_date: "2026-02-02T00:00:00Z", narrative: "Minor thumb burn." }
              as: IntakeSpecialist
              captures: { i3_id: $.data.id }
            - call: "POST /product-safety/incidents/${i3_id}/classify"
              payload: { injury_class: "FIRST_AID", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "WEB_FORM", incident_date: "2026-02-10T00:00:00Z", narrative: "Unclassified web submission awaiting triage." }
              as: IntakeSpecialist
              captures: { i4_id: $.data.id }
          trigger:
            - call: "GET /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", status: "CLASSIFIED", limit: 2, offset: 0 }
              as: ComplianceOfficer
            - call: "GET /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", status: "CLASSIFIED", limit: 2, offset: 2 }
              as: ComplianceOfficer
            - call: "GET /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", status: "INTAKE" }
              as: ComplianceOfficer
          assert:
            - "limit=2 offset=0 returns 2 rows, ${i1_id} then ${i2_id} in created_at ASC order"
            - "limit=2 offset=2 returns 1 row, ${i3_id}"
            - "the INTAKE row ${i4_id} appears in neither CLASSIFIED window"
            - "status=INTAKE returns exactly 1 row, ${i4_id}"
            - "total_count is 3 in both windows, with has_more true at offset 0 and has_more false at offset 2"

      - name: every_entity_get_by_unknown_id_returns_its_own_not_found_code
        claim_type: Not Found
        grounds:
          - errors.ERR_PRODUCT_MODEL_NOT_FOUND
          - errors.ERR_INCIDENT_NOT_FOUND
          - errors.ERR_HAZARD_PATTERN_NOT_FOUND
          - errors.ERR_EVALUATION_NOT_FOUND
          - errors.ERR_SECTION_REPORT_NOT_FOUND
          - errors.ERR_RECALL_NOT_FOUND
          - errors.ERR_RETAILER_NOT_FOUND
          - errors.ERR_RETAILER_NOTIFICATION_NOT_FOUND
          - errors.ERR_AUDIT_VISIT_NOT_FOUND
          - errors.ERR_CONSUMER_NOTICE_NOT_FOUND
          - errors.ERR_REMEDY_CLAIM_NOT_FOUND
          - errors.ERR_PROGRESS_REPORT_NOT_FOUND
          - errors.ERR_PENALTY_CASE_NOT_FOUND
          - validations[3]
        distinguishing_aspect: |
          Thirteen entities each own a DISTINCT 404 code, so a single shared
          ERR_NOT_FOUND (or a code borrowed from a neighbouring entity) is a defect.
          Probing all thirteen single-row GETs with the same nonexistent id is the
          cheapest way to prove the codes are wired per entity.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /product-safety/product-models/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /product-safety/incidents/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /product-safety/hazard-patterns/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /product-safety/reportability-evaluations/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /product-safety/section-reports/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /product-safety/recalls/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /product-safety/retailers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /product-safety/retailer-notifications/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /product-safety/audit-visits/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /product-safety/consumer-notices/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /product-safety/remedy-claims/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /product-safety/progress-reports/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /product-safety/civil-penalty-cases/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
          assert:
            - "all thirteen calls return HTTP 404"
            - "error_ids are, in call order: ERR_PRODUCT_MODEL_NOT_FOUND, ERR_INCIDENT_NOT_FOUND, ERR_HAZARD_PATTERN_NOT_FOUND, ERR_EVALUATION_NOT_FOUND, ERR_SECTION_REPORT_NOT_FOUND, ERR_RECALL_NOT_FOUND, ERR_RETAILER_NOT_FOUND, ERR_RETAILER_NOTIFICATION_NOT_FOUND, ERR_AUDIT_VISIT_NOT_FOUND, ERR_CONSUMER_NOTICE_NOT_FOUND, ERR_REMEDY_CLAIM_NOT_FOUND, ERR_PROGRESS_REPORT_NOT_FOUND, ERR_PENALTY_CASE_NOT_FOUND"
            - "every body carries both error_id and message"
            - "no two of the thirteen error_ids are equal"

      - name: missing_required_input_fields_rejected_before_any_row_is_written
        claim_type: Required Fields
        grounds:
          - entities.ProductModel.fields.model_code
          - entities.Incident.fields.narrative
          - errors.ERR_INVALID_REQUEST
          - validations[4]
        distinguishing_aspect: |
          Required-field enforcement at priority 4, i.e. AFTER authentication and
          role checks but BEFORE any existence lookup. Two different entities are
          probed so the check cannot be a one-off guard on the first endpoint, and
          the follow-up list call proves nothing was persisted by the rejected call.
        test_recipe:
          setup:
            - "one ProductModel already exists so the incident probe has a valid FK to offer"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/product-models"
              payload: { model_code: "TOAST-X1", brand: "Hearthline", category: "KITCHEN_APPLIANCE", units_distributed: 100, units_registered: 60 }
              as: ProgramAdmin
              captures: { pm_id: $.data.id }
          trigger:
            - call: "POST /product-safety/product-models"
              payload: { brand: "Hearthline", category: "KITCHEN_APPLIANCE", units_distributed: 100, units_registered: 60 }
              as: ProgramAdmin
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "WEB_FORM", incident_date: "2026-02-10T00:00:00Z" }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents/${pm_id}/classify"
              payload: { hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
          assert:
            - "the model_code-less create returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "the narrative-less incident create returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "the injury_class-less classify returns HTTP 400 with error_id ERR_INVALID_REQUEST, i.e. the priority-4 shape check runs before the priority-3 existence check even though the path id is not an incident id at all"
            - "GET /product-safety/incidents?product_model_id=${pm_id} returns 0 rows"

      - name: computed_field_defaults_applied_across_entities_on_creation
        claim_type: Defaults
        grounds:
          - entities.Incident.fields.status
          - entities.Incident.fields.injury_verified
          - entities.Incident.fields.severity_weight
          - entities.Recall.fields.units_outstanding
          - entities.RetailerNotification.fields.stop_sale_required
          - entities.AuditVisit.fields.verdict
        distinguishing_aspect: |
          Defaults are entity-specific and not all of them are zero or null: an
          Incident starts at status INTAKE with injury_verified false and
          severity_weight 0, a Recall starts with units_outstanding seeded from
          units_in_commerce rather than from 0, a RetailerNotification starts with
          stop_sale_required FALSE (only the plan_approval cascade sets it true),
          and an AuditVisit starts with verdict PENDING. Seeding
          units_outstanding to 0 would silently break the conserved ledger from
          birth.
        test_recipe:
          setup:
            - "logical clock at 2026-03-01T00:00:00Z"
            - "one ProductModel"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/product-models"
              payload: { model_code: "TOAST-X1", brand: "Hearthline", category: "KITCHEN_APPLIANCE", units_distributed: 100, units_registered: 60 }
              as: ProgramAdmin
              captures: { pm_id: $.data.id }
          trigger:
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "WEB_FORM", incident_date: "2026-02-10T00:00:00Z", narrative: "Fresh web submission with no triage yet." }
              as: IntakeSpecialist
              captures: { inc_id: $.data.id }
          assert:
            - "Incident.${inc_id}.status == INTAKE (the declared initial_state)"
            - "Incident.${inc_id}.injury_verified == false"
            - "Incident.${inc_id}.severity_weight == 0"
            - "Incident.${inc_id}.injury_class == null and hazard_code == null"
            - "Incident.${inc_id}.classified_at == null"
            - "Incident.${inc_id}.version == 1"
            - "the same default contract is declared for Recall.units_outstanding = units_in_commerce, RetailerNotification.stop_sale_required = false and AuditVisit.verdict = PENDING"

      - name: severity_weight_is_computed_at_classification_and_not_client_settable
        claim_type: Computed Fields
        grounds:
          - calculations.incident_severity_weight
          - entities.Incident.fields.severity_weight
          - endpoints["POST /product-safety/incidents/{id}/classify"]
        distinguishing_aspect: |
          severity_weight is source: computed and does not appear in ANY endpoint's
          input, so the only way it can acquire a value is the weighted_scoring
          formula. The probe sends the same injury_class through two different
          report_channels: the RETAILER channel multiplier 1.20 turns weight 8 into
          9.60 while CONSUMER_HOTLINE leaves it at 8.00, which no client-supplied
          value could produce.
        test_recipe:
          setup:
            - "logical clock at 2026-03-01T00:00:00Z"
            - "two INTAKE incidents on one model, one reported by a retailer and one by the consumer hotline"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/product-models"
              payload: { model_code: "TOAST-X1", brand: "Hearthline", category: "KITCHEN_APPLIANCE", units_distributed: 100, units_registered: 60 }
              as: ProgramAdmin
              captures: { pm_id: $.data.id }
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "RETAILER", incident_date: "2026-01-20T00:00:00Z", narrative: "Retailer-channel report of a treated burn." }
              as: IntakeSpecialist
              captures: { ir_id: $.data.id }
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "CONSUMER_HOTLINE", incident_date: "2026-01-21T00:00:00Z", narrative: "Hotline report of a treated burn." }
              as: IntakeSpecialist
              captures: { ih_id: $.data.id }
          trigger:
            - call: "POST /product-safety/incidents/${ir_id}/classify"
              payload: { injury_class: "MEDICAL_TREATMENT", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents/${ih_id}/classify"
              payload: { injury_class: "MEDICAL_TREATMENT", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
          assert:
            - "Incident.${ir_id}.severity_weight == 9.60"
            - "Incident.${ih_id}.severity_weight == 8.00"
            - "both rows have injury_class MEDICAL_TREATMENT, so only report_channel explains the difference"
            - "severity_weight appears in no endpoint input list, so it cannot be supplied"
            - "both rows moved to status CLASSIFIED with classified_at 2026-03-01T00:00:00Z"

      - name: system_fields_are_server_generated_and_version_advances_on_write
        claim_type: System Fields
        grounds:
          - entities.ProductModel.common_fields
          - concurrency_rules.pattern-create-stale-model
          - endpoints["POST /product-safety/hazard-patterns"]
        distinguishing_aspect: |
          id, created_at, updated_at and version are system-owned on all thirteen
          entities. The sharpest observable is version: the ProductModel is never
          named in the hazard-pattern payload except through its OCC guard, yet the
          pattern write must bump the model's version from 1 to 2 and move
          updated_at while leaving created_at frozen.
        test_recipe:
          setup:
            - "logical clock at 2026-03-01T00:00:00Z, then advanced to 2026-03-02T00:00:00Z before the write"
            - "one ProductModel with three classified BURN incidents in January 2026"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/product-models"
              payload: { model_code: "TOAST-X1", brand: "Hearthline", category: "KITCHEN_APPLIANCE", units_distributed: 100, units_registered: 60 }
              as: ProgramAdmin
              captures: { pm_id: $.data.id, pm_created: $.data.created_at, pm_v1: $.data.version }
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "MEDICAL_EXAMINER", incident_date: "2026-01-12T00:00:00Z", narrative: "Burn requiring hospitalisation." }
              as: IntakeSpecialist
              captures: { i1_id: $.data.id }
            - call: "POST /product-safety/incidents/${i1_id}/classify"
              payload: { injury_class: "HOSPITALIZATION", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "RETAILER", incident_date: "2026-01-20T00:00:00Z", narrative: "Overheating unit scorched a counter." }
              as: IntakeSpecialist
              captures: { i2_id: $.data.id }
            - call: "POST /product-safety/incidents/${i2_id}/classify"
              payload: { injury_class: "MEDICAL_TREATMENT", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "CONSUMER_HOTLINE", incident_date: "2026-02-02T00:00:00Z", narrative: "Minor thumb burn." }
              as: IntakeSpecialist
              captures: { i3_id: $.data.id }
            - call: "POST /product-safety/incidents/${i3_id}/classify"
              payload: { injury_class: "FIRST_AID", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /product-safety/hazard-patterns"
              payload: { product_model_id: "${pm_id}", window_start: "2026-01-01T00:00:00Z", window_end: "2026-02-28T00:00:00Z", analysis_basis: "PRELIMINARY", expected_product_model_version: "${pm_v1}" }
              as: ComplianceOfficer
              captures: { hp_id: $.data.id }
          assert:
            - "HazardPattern.${hp_id}.id is a server-generated identifier that was not present in the payload"
            - "HazardPattern.${hp_id}.created_at == 2026-03-02T00:00:00Z and version == 1"
            - "HazardPattern.${hp_id}.analyzed_at == 2026-03-02T00:00:00Z"
            - "ProductModel.${pm_id}.version == 2 (was ${pm_v1} == 1)"
            - "ProductModel.${pm_id}.created_at == ${pm_created} (unchanged)"
            - "ProductModel.${pm_id}.updated_at == 2026-03-02T00:00:00Z"
            - "no id in any response is derived from a client-supplied value"

      - name: enum_and_range_type_constraints_are_rejected_as_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Incident.fields.injury_class
          - entities.HazardPattern.fields.window_start
          - entities.ProductModel.fields.units_distributed
          - errors.ERR_INVALID_REQUEST
          - validations[4]
        distinguishing_aspect: |
          Three different shapes of type violation on three endpoints: an
          out-of-vocabulary enum member, an inverted datetime interval
          (window_start after window_end) and a negative count where the domain
          requires a non-negative integer. All three are 400 ERR_INVALID_REQUEST
          rather than a business error, because none of them can even be evaluated
          against the domain rules.
        test_recipe:
          setup:
            - "logical clock at 2026-03-01T00:00:00Z"
            - "one ProductModel with one INTAKE incident"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/product-models"
