              payload: { host_site_id: "${host_id}", asset_tag: "M-9", machine_type: "SNACK_VENDOR" }
              as: FieldOps
              captures: { mach_id: $.data.id }
            - call: "POST /operations/machines/${mach_id}/slots"
              payload: { product_id: "${prod_id}", slot_code: "F1", capacity: 10, par_level: 10, price_cents: 100 }
              as: FieldOps
              captures: { slot_id: $.data.id }
            - call: "POST /operations/machines/${mach_id}/service-tickets"
              payload: { issue_type: "VANDALISM", blocking: true }
              as: FieldOps
              captures: { tk_id: $.data.id }
          trigger:
            - call: "POST /operations/sales"
              payload: { machine_id: "${mach_id}", slot_id: "${slot_id}", quantity: 5, payment_method: "CASHLESS" }
              as: FieldOps
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_MACHINE_FROZEN"

