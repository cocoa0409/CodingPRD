            - { call: "POST /fafsa/aid-records", as: DataImporter, payload: { campaign_id: "${camp}", external_ref: "E1", full_name: "Someone Else", dob: "2000-01-01", school_code: "SC99", district_code: "D99", initial_status: "STARTED", effective_date: "2027-01-10" }, captures: { ar1: $.data.id } }
            - { call: "POST /fafsa/aid-records", as: DataImporter, payload: { campaign_id: "${camp}", external_ref: "E2", full_name: "Another Person", dob: "2000-02-02", school_code: "SC98", district_code: "D98", initial_status: "STARTED", effective_date: "2027-01-11" }, captures: { ar2: $.data.id } }
