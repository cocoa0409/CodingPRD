        grounds: [roles.Performer, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Performer is a negotiation/read role: creating a StuntSequence is exclusive to StuntCoordinator and returns ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["one production; one performer (for a well-formed entity-backed X-User-ID)"]
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "P", total_budget_cents: 5000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
            - call: "POST /api/performers"
              payload: { production_id: "${prod_id}", first_name: "Kl", last_name: "Rb", base_day_rate_cents: 100000, union_status: "NON_UNION" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { perf_id: $.data.id }
          trigger:
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "Nope", hazard_class: "FIGHT", risk_category: "LOW", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: Performer
              as_user_id: "${perf_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_ROLE, http 403"

