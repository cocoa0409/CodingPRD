    - name: occ_stale_patch_returns_412
      claim_type: occ_stale_version
      grounds: ["concurrency_rules[forecast-profile-patch-stale-version]", "validations[priority=6]"]
      distinguishing_aspect: "OCC on ForecastProfile.version: a PATCH carrying the version observed before another successful PATCH is rejected with 412 ERR_STALE_VERSION; the fresh-version PATCH succeeds and bumps version."
      test_recipe:
        setup: ["Facility, product, ForecastProfile (version 1 after create)"]
        setup_api_calls:
          - { call: "POST /jansan/facilities", payload: { name: "Fac CC", facility_group_code: "GPO-1", credit_limit_cents: 1000000, service_zone: "Z1", delivery_distance_miles: 10, default_delivery_day: "MON" }, as: DistributorAdmin, captures: { fac_id: $.data.id } }
          - { call: "POST /jansan/products", payload: { sku: "SKU-CC1", name: "CC", category: "PAPER", base_price_cents: 1200, unit_of_measure: "CASE", dilution_required: false, chemical_family: "NONE", qty_on_hand: 100 }, as: DistributorAdmin, captures: { prod_id: $.data.id } }
          - { call: "POST /jansan/forecast-profiles", payload: { facility_id: "${fac_id}", product_id: "${prod_id}", horizon_days: 30, safety_stock: 0, current_on_hand: 10 }, as: DistributorAdmin, captures: { fp_id: $.data.id, fp_v1: $.data.version } }
        trigger:
          - { call: "PATCH /jansan/forecast-profiles/${fp_id}", payload: { safety_stock: 3, expected_forecast_profile_version: "${fp_v1}" }, as: DistributorAdmin, captures: { fp_v2: $.data.version } }
          - { call: "PATCH /jansan/forecast-profiles/${fp_id}", payload: { safety_stock: 9, expected_forecast_profile_version: "${fp_v1}" }, as: DistributorAdmin, captures: { err: $.data.error_id } }
        assert:
          - "First PATCH succeeds and returns version == ${fp_v1} + 1"
          - "Second PATCH with the now-stale version -> error_id == ERR_STALE_VERSION and http status 412; safety_stock remains 3"

- section: consistency_model
  instances:
    - name: place_response_reflects_all_mutations_immediately
      claim_type: immediate_consistency
      grounds: ["complexity_profile.consistency_model", "calculations.order_total_rollup"]
      distinguishing_aspect: "Immediate consistency: the place response body itself carries the computed money fields and status — no re-read required."
      test_recipe:
        setup: ["Facility ACTIVE miles 10 credit 1000000; product 1000 stock 100; DRAFT order 5 x 1000 fuel_index 2.50"]
        setup_api_calls:
          - { call: "POST /jansan/facilities", payload: { name: "Fac CD", facility_group_code: "GPO-1", credit_limit_cents: 1000000, service_zone: "Z1", delivery_distance_miles: 10, default_delivery_day: "MON" }, as: DistributorAdmin, captures: { fac_id: $.data.id } }
          - { call: "POST /jansan/products", payload: { sku: "SKU-CD1", name: "CD", category: "PAPER", base_price_cents: 1000, unit_of_measure: "CASE", dilution_required: false, chemical_family: "NONE", qty_on_hand: 100 }, as: DistributorAdmin, captures: { prod_id: $.data.id } }
          - { call: "POST /jansan/orders", payload: { facility_id: "${fac_id}", lines: [ { product_id: "${prod_id}", qty: 5 } ], delivery_date: "2026-08-05T00:00:00Z", fuel_index: 2.50 }, as: FacilityManager, as_user_id: "${fac_id}", captures: { ord_id: $.data.id } }
        trigger:
          - { call: "POST /jansan/orders/${ord_id}/place", payload: {}, as: FacilityManager, as_user_id: "${fac_id}", captures: { resp_total: $.data.total_cents, resp_status: $.data.status } }
        assert:
          - "Place response: resp_status == PLACED AND resp_total == 5200 (subtotal 5000 + fee 0 + surcharge 200) in the same request"
          - "Facility read after place shows committed_cents == 5200 (no lag)"
