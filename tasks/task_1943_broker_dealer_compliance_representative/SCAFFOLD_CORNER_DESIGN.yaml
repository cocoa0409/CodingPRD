  # ------------------------------------------------------------------
  - section: calculations
    instances:
      - name: correspondence_final_score_clamp_on_escalate_flag
        claim_type: correct_result
        grounds: [calculations.correspondence_risk_score, state_machines.CorrespondenceItem.ESCALATED_to_FLAGGED]
        distinguishing_aspect: "Escalation-resolution FLAG applies max(provisional, 70): provisional 25 (EMAIL, 2 hits) clamps to 70, and the rep's flag counter increments exactly once."
        test_recipe:
          setup: ["Item with provisional 25, ESCALATED by principal-a"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "CF Branch", region: "N" }
              as: FirmAdmin
              captures: { cf_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "920001", full_name: "CF Rep", branch_id: "${cf_br}", hire_date: "2021-01-01" }
              as: FirmAdmin
              captures: { cf_rep: $.data.id }
            - call: "POST /correspondence-items"
              payload: { rep_id: "${cf_rep}", channel: "EMAIL", subject: "promo", lexicon_hits: 2 }
              as: ComplianceAnalyst
              captures: { cf_ci: $.data.id }
            - call: "POST /correspondence-items/${cf_ci}/review"
              payload: { decision: "ESCALATE" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
          trigger:
            - call: "POST /correspondence-items/${cf_ci}/resolve-escalation"
              payload: { decision: "FLAG" }
              as: CompliancePrincipal
              as_user_id: "principal-b"
              captures: { cf_final: $.data.final_risk_score }
            - call: "GET /representatives/${cf_rep}"
              as: Any
              captures: { cf_flags: $.data.compliance_flag_count }
          assert:
            - "cf_final == 70 (max(25, 70))"
            - "cf_flags == 1"

      - name: dual_branch_cycle_acceleration
        claim_type: constants_applied
        grounds: [calculations.branch_inspection_due_date, state_machines.DisclosureEvent.FILED_to_ACKNOWLEDGED, entities.BranchOffice.fields.inspection_cycle_months]
        distinguishing_aspect: "The cycle-months constant is selected by current sd_rep_count: the same completed date 2026-05-01 yields next_inspection_due_date 2027-05-01 under the 12-month constant and 2026-11-01 after the cascade switches the branch to the 6-month accelerated constant."
        test_recipe:
          setup: ["Branch with one inspection CLOSED 2026-05-01 (due 2027-05-01); then SD ack on a rep of the branch"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "CY Branch", region: "W" }
              as: FirmAdmin
              captures: { cy_br: $.data.id, cy_br_v: $.data.version }
            - call: "POST /representatives"
              payload: { crd_number: "920002", full_name: "CY Rep", branch_id: "${cy_br}", hire_date: "2020-01-01" }
              as: FirmAdmin
              captures: { cy_rep: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /inspections"
              payload: { branch_id: "${cy_br}", scheduled_date: "2026-05-01", expected_branch_version: "${cy_br_v}" }
              as: ComplianceAnalyst
              captures: { cy_i: $.data.id }
            - call: "POST /inspections/${cy_i}/start"
              as: ComplianceAnalyst
            - call: "GET /branches/${cy_br}"
              as: Any
              captures: { cy_br_v2: $.data.version }
            - call: "POST /inspections/${cy_i}/close"
              payload: { expected_branch_version: "${cy_br_v2}" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "GET /branches/${cy_br}"
              as: Any
              captures: { cy_due_before: $.data.next_inspection_due_date }
            - call: "POST /disclosure-events"
              payload: { rep_id: "${cy_rep}", event_type: "REGULATORY_BAR", event_date: "2026-05-01" }
              as: ComplianceAnalyst
              captures: { cy_d: $.data.id }
            - call: "POST /disclosure-events/${cy_d}/file"
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "POST /disclosure-events/${cy_d}/acknowledge"
              as: CompliancePrincipal
              as_user_id: "principal-a"
          trigger:
            - call: "GET /branches/${cy_br}"
              as: Any
          assert:
            - "cy_due_before == \"2027-05-01\" (12-month constant)"
            - "$.data.inspection_cycle_months == 6 and $.data.next_inspection_due_date == \"2026-11-01\" (accelerated constant applied to the same completed date)"
            - "$.data.sd_rep_count == 1"

      - name: invariant_pst_fee_conservation
        claim_type: side_effect_invariant
        grounds: [calculations.pst_supervisory_fee_accrual, state_machines.RegisteredRepresentative.ACTIVE_to_TERMINATED]
        distinguishing_aspect: "Termination freezes but does not reverse historical accruals: with both PSTs APPROVED (fees 1666, count 2), terminating the rep leaves pst_fee_total_cents and active_approved_activity_count untouched."
        test_recipe:
          setup: ["Rep with two APPROVED compensated PSTs"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "PF Branch", region: "E" }
              as: FirmAdmin
              captures: { pf_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "920003", full_name: "PF Rep", branch_id: "${pf_br}", hire_date: "2020-01-01" }
              as: FirmAdmin
              captures: { pf_rep: $.data.id }
            - call: "POST /outside-activities"
              payload: { activity_type: "PRIVATE_SECURITIES_TRANSACTION", description: "A", compensation_expected: true, estimated_gross_comp_cents: "33333", start_date: "2026-09-01" }
              as: RegisteredRep
              as_user_id: "${pf_rep}"
              captures: { pf_a: $.data.id }
            - call: "POST /outside-activities"
              payload: { activity_type: "PRIVATE_SECURITIES_TRANSACTION", description: "B", compensation_expected: true, estimated_gross_comp_cents: "33333", start_date: "2026-09-01" }
              as: RegisteredRep
              as_user_id: "${pf_rep}"
              captures: { pf_b: $.data.id }
            - call: "POST /outside-activities/${pf_a}/decide"
              payload: { decision: "APPROVE" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "POST /outside-activities/${pf_b}/decide"
              payload: { decision: "APPROVE" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
          trigger:
            - call: "POST /representatives/${pf_rep}/terminate"
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "GET /representatives/${pf_rep}"
              as: Any
          assert:
            - "$.data.pst_fee_total_cents == 1666 (termination does not claw back fees)"
            - "$.data.active_approved_activity_count == 2 (approved activities are historical; only SUBMITTED/SUSPENDED_REVIEW are withdrawn)"

      - name: compensating_wsp_publish_supersede
        claim_type: side_effect_invariant
        grounds: [calculations.wsp_publish_singleton, state_machines.WSPDocument.DRAFT_to_PUBLISHED, state_machines.WSPDocument.PUBLISHED_to_SUPERSEDED]
        distinguishing_aspect: "Singleton invariant: publishing document 2 in the same policy area supersedes document 1 in the same request, so the count of PUBLISHED documents per policy area stays exactly 1."
        test_recipe:
          setup: ["Two DRAFT WSP documents in policy_area CORRESPONDENCE (version_numbers 1 and 2)"]
          setup_api_calls:
            - call: "POST /wsp-documents"
              payload: { policy_area: "CORRESPONDENCE", title: "Corr WSP v1", effective_date: "2026-08-01" }
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
              captures: { ws1_id: $.data.id, ws1_vn: $.data.version_number }
            - call: "POST /wsp-documents"
              payload: { policy_area: "CORRESPONDENCE", title: "Corr WSP v2", effective_date: "2026-09-01" }
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
              captures: { ws2_id: $.data.id, ws2_vn: $.data.version_number }
            - call: "POST /wsp-documents/${ws1_id}/publish"
              as: CompliancePrincipal
              as_user_id: "principal-a"
          trigger:
            - call: "POST /wsp-documents/${ws2_id}/publish"
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { ws2_sup: $.data.supersedes_id }
            - call: "GET /wsp-documents/${ws1_id}"
              as: Any
              captures: { ws1_status: $.data.status }
            - call: "GET /wsp-documents?policy_area=CORRESPONDENCE&status=PUBLISHED"
              as: Any
              captures: { ws_pub_list: $.data }
          assert:
            - "ws1_vn == 1 and ws2_vn == 2 (per-area max+1 assignment at create)"
            - "ws2_sup == ${ws1_id} and ws1_status == \"SUPERSEDED\""
            - "ws_pub_list is a single-element list whose [0].id == ${ws2_id} (publish + supersede conserve the singleton)"

      - name: selector_published_wsp_lookup
        claim_type: correct_result
        grounds: [calculations.wsp_publish_singleton, entities.WSPDocument.fields.supersedes_id]
        distinguishing_aspect: "The supersede chain is queryable: the filtered list by supersedes_id returns exactly the successor document, and policy_area+status=PUBLISHED returns exactly the current one."
        test_recipe:
          setup: ["OBA_PST area: d1 published then superseded by d2"]
          setup_api_calls:
            - call: "POST /wsp-documents"
              payload: { policy_area: "OBA_PST", title: "OBA v1", effective_date: "2026-08-01" }
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
              captures: { sl1: $.data.id }
            - call: "POST /wsp-documents/${sl1}/publish"
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "POST /wsp-documents"
              payload: { policy_area: "OBA_PST", title: "OBA v2", effective_date: "2026-09-01" }
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
              captures: { sl2: $.data.id }
            - call: "POST /wsp-documents/${sl2}/publish"
              as: CompliancePrincipal
              as_user_id: "principal-a"
          trigger:
            - call: "GET /wsp-documents?supersedes_id=${sl1}"
              as: Any
              captures: { sl_succ: $.data }
            - call: "GET /wsp-documents?policy_area=OBA_PST&status=PUBLISHED"
              as: Any
              captures: { sl_pub: $.data }
          assert:
            - "sl_succ is a single-element list whose [0].id == ${sl2} (FK reverse-reachability on the self-reference)"
            - "sl_pub is a single-element list whose [0].id == ${sl2}"

      - name: default_meeting_attestation_fanout
        claim_type: correct_result
        grounds: [calculations.meeting_attestation_fanout, entities.Attestation.fields.attest_deadline]
        distinguishing_aspect: "Fan-out cardinality and deadline math: two ACTIVE reps produce exactly two PENDING attestations with attest_deadline = meeting_date + 30 days (2026-12-05 -> 2027-01-04)."
        test_recipe:
          setup: ["Two ACTIVE reps"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "MF Branch", region: "N" }
              as: FirmAdmin
              captures: { mf_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "920004", full_name: "MF One", branch_id: "${mf_br}", hire_date: "2021-01-01" }
              as: FirmAdmin
            - call: "POST /representatives"
              payload: { crd_number: "920005", full_name: "MF Two", branch_id: "${mf_br}", hire_date: "2021-01-01" }
              as: FirmAdmin
          trigger:
            - call: "POST /meetings"
              payload: { year: 2026, meeting_date: "2026-12-05" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { mf_mt: $.data.id }
            - call: "GET /attestations?meeting_id=${mf_mt}"
              as: Any
              captures: { mf_list: $.data }
          assert:
            - "mf_list has exactly 2 elements, both status == \"PENDING\""
            - "mf_list[0].attest_deadline == \"2027-01-04\" and mf_list[1].attest_deadline == \"2027-01-04\""

      - name: sd_rep_count_decrement_on_termination
        claim_type: derived_field_reconciliation
        grounds: [entities.BranchOffice.fields.sd_rep_count, calculations.branch_inspection_due_date, state_machines.RegisteredRepresentative.ACTIVE_to_TERMINATED]
        distinguishing_aspect: "Derived-field reconciliation with a sticky config: terminating the SD rep decrements sd_rep_count to 0, but the accelerated 6-month cycle does not revert."
        test_recipe:
          setup: ["Branch whose only rep is SD-flagged (count 1, cycle 6)"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "DC Branch", region: "S" }
              as: FirmAdmin
              captures: { dc_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "920006", full_name: "DC Rep", branch_id: "${dc_br}", hire_date: "2020-01-01" }
              as: FirmAdmin
              captures: { dc_rep: $.data.id }
            - call: "POST /disclosure-events"
              payload: { rep_id: "${dc_rep}", event_type: "FELONY_CONVICTION", event_date: "2026-08-01" }
              as: ComplianceAnalyst
              captures: { dc_d: $.data.id }
            - call: "POST /disclosure-events/${dc_d}/file"
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "POST /disclosure-events/${dc_d}/acknowledge"
              as: CompliancePrincipal
              as_user_id: "principal-a"
          trigger:
            - call: "POST /representatives/${dc_rep}/terminate"
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "GET /branches/${dc_br}"
              as: Any
          assert:
            - "$.data.sd_rep_count == 0 (TERMINATED reps leave the SD set)"
            - "$.data.inspection_cycle_months == 6 (sticky acceleration, documented non-revert)"

      - name: complaint_reserve_variants_covered
        claim_type: correct_result
        grounds: [calculations.complaint_reserve]
        excluded_because:
          difficulty_instance: dual_complaint_reserve_variants
          rationale: "Provisional 800000 vs final 1600000 both asserted there on pinned inputs."

      - name: boundary_attest_last_day_allowed
        claim_type: correct_result
        grounds: [calculations.meeting_attestation_fanout, state_machines.Attestation.PENDING_to_ATTESTED]
        excluded_because:
          difficulty_instance: boundary_attestation_deadline
          rationale: "Deadline-day inclusive attest asserted there (b2_att_ok == ATTESTED)."

  # ------------------------------------------------------------------
  - section: validations
    instances:
