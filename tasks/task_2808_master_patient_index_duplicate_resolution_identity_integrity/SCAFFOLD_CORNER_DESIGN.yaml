          - calculations.pair_match_score.variants
        excluded_because:
          difficulty_instance: strict_vs_tolerant_null_credit_flips_pair_classification
          rationale: "That instance scores the identical record pair under both variants, pins both totals and shows the classification flipping from NON_DUPLICATE to POTENTIAL_DUPLICATE, covering both the divergence and the delta for this layer."

      - name: overlay_creation_enforces_the_record_version_occ_rule
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[overlay-create-stale-record-version]
          - errors[ERR_STALE_RECORD_VERSION]
        excluded_because:
          difficulty_instance: occ_stale_record_version_outranks_fraud_hold
          rationale: "The second §1.2.1 concurrency rule is fully exercised there: a stale expected_record_version on POST /mpi/overlay-corrections returns 412 ERR_STALE_RECORD_VERSION, and the corrected version on the same body succeeds, so a separate layer instance would duplicate it."

