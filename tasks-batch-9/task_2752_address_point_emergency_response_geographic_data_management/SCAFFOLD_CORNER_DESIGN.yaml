          trigger:
            - call: "POST /gis/road-centerlines/${road_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { err1: $.data.error_id }
            - call: "POST /gis/road-centerlines/${road_id}/retire"
