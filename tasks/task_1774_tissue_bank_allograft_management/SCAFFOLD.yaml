    roles: [QualityManager]
    code: 200
    input: [reason]
    output: TissueUnit
    side_effects: ["status -> RETURNED_TO_SUPPLIER", "DRAFT DispositionRecord created"]
  - method: GET
    path: "/tissue-bank/tissue-units/{id}/reservations"
    description: "List reservations for a unit; sorted by created_at ASC"
