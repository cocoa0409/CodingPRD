            - call: "POST /operating-authorities/${auth2_id}/process-agent-designations"
              payload: { process_agent_id: "${agent2_id}", state_codes: ["TX", "OK", "NM"], effective_from: "2026-08-05T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier2_id}"
            - call: "GET /operating-authorities/${auth2_id}"
              payload: {}
              as: InsuranceFiler
              as_user_id: "${insurer2_id}"
