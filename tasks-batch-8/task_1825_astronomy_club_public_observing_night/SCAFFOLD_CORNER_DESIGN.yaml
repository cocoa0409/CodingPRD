# =============================================================================
# Task 1825 — Astronomy Club & Public Observing Night
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_member_applies_system_fields_and_defaults
        claim_type: creation
        grounds: ["entities.Member"]
        distinguishing_aspect: "POST /club/members with all required fields returns 201; status initialized ACTIVE, no_show_strikes 0, effective_access_level mirrored from tier, joined_at server-stamped; client-supplied status/dues_paid_through ignored."
        test_recipe:
          setup: ["Tier exists"]
          setup_api_calls:
            - call: "POST /club/membership-tiers"
              payload: { code: "STUDENT", annual_dues_cents: 60000, observatory_access_level: 1, loan_privilege: false, max_concurrent_loans: 1 }
              as: ClubOfficer
              captures: { tier_id: $.data.id }
          trigger:
            - call: "POST /club/members"
              payload: { full_name: "New Nick", email: "nick@x.com", tier_id: "${tier_id}" }
              as: ClubOfficer
              captures: { m_id: $.data.id, m_status: $.data.status, m_lvl: $.data.effective_access_level, m_strikes: $.data.no_show_strikes }
          assert:
            - "m_status == ACTIVE"
            - "m_lvl == 1 (mirrors tier observatory_access_level)"
            - "m_strikes == 0"
            - "Member.${m_id}.version == 1"

      - name: get_member_not_found
        claim_type: not_found
        grounds: ["entities.Member", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /club/members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClubOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"
            - "HTTP status 404"

      - name: member_list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope", "entities.Member"]
        distinguishing_aspect: "GET /club/members honors limit/offset and returns total_count + has_more per the fixed envelope."
        test_recipe:
          setup: ["Tier + 3 members"]
          setup_api_calls:
            - call: "POST /club/membership-tiers"
              payload: { code: "INDIVIDUAL", annual_dues_cents: 120000, observatory_access_level: 2, loan_privilege: true, max_concurrent_loans: 2 }
              as: ClubOfficer
              captures: { tier_id: $.data.id }
            - call: "POST /club/members"
              payload: { full_name: "P A", email: "pa@x.com", tier_id: "${tier_id}" }
              as: ClubOfficer
            - call: "POST /club/members"
              payload: { full_name: "P B", email: "pb@x.com", tier_id: "${tier_id}" }
              as: ClubOfficer
            - call: "POST /club/members"
              payload: { full_name: "P C", email: "pc@x.com", tier_id: "${tier_id}" }
              as: ClubOfficer
          trigger:
            - call: "GET /club/members"
              payload: {}
              as: ClubOfficer
              captures: { first_status: "$.data[0].status" }
          assert:
            - "response with limit=2, offset=0 returns total_count == 3 and has_more == true"
            - "response with limit=2, offset=2 returns 1 item and has_more == false"
            - "default limit is 10 when limit omitted"

      - name: sqm_reading_range_validation
        claim_type: type_constraints
        grounds: ["entities.SkyQualityReading.fields.sqm_value", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "sqm_value outside 10.00–22.99 rejected with ERR_INVALID_REQUEST; 22.99 and 10.00 accepted (inclusive bounds)."
        test_recipe:
          setup: ["Tier, member, event exist"]
          setup_api_calls:
            - call: "POST /club/membership-tiers"
              payload: { code: "INDIVIDUAL", annual_dues_cents: 120000, observatory_access_level: 2, loan_privilege: true, max_concurrent_loans: 2 }
              as: ClubOfficer
              captures: { tier_id: $.data.id }
            - call: "POST /club/members"
              payload: { full_name: "SQM Sam", email: "sqm@x.com", tier_id: "${tier_id}" }
              as: ClubOfficer
              captures: { member_id: $.data.id }
            - call: "POST /club/observing-events"
              payload: { title: "E", event_kind: "PUBLIC_NIGHT", window_start: "2026-08-10T01:00:00Z", window_end: "2026-08-10T05:00:00Z", moon_illumination_pct: 20, min_operators: 1 }
              as: EventCoordinator
              captures: { event_id: $.data.id }
          trigger:
            - call: "POST /club/sky-quality-readings"
              payload: { taken_by_member_id: "${member_id}", event_id: "${event_id}", sqm_value: 23.50 }
              as: Member
              as_user_id: "${member_id}"
              captures: { err: $.data.error_id }
            - call: "POST /club/sky-quality-readings"
              payload: { taken_by_member_id: "${member_id}", event_id: "${event_id}", sqm_value: 22.99 }
              as: Member
              as_user_id: "${member_id}"
              captures: { ok_id: $.data.id }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "SkyQualityReading.${ok_id} created with sqm_value 22.99 (inclusive upper bound)"

      - name: dues_payment_immutable_no_update_endpoint
        claim_type: immutability
        grounds: ["entities.DuesPayment"]
        distinguishing_aspect: "DuesPayment has common_fields: false — no PUT/PATCH endpoint exists in §1.5; the append-only ledger cannot be edited."
        test_recipe:
          setup: ["n/a — structural claim over §1.5"]
          setup_api_calls: []
          trigger:
            - call: "GET /club/dues-payments"
              payload: {}
              as: ClubOfficer
          assert:
            - "no PUT/PATCH /club/dues-payments endpoint is declared in §1.5"
            - "DuesPayment entity carries id + created_at only (no version field)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: checkout_from_checked_out_invalid
        claim_type: invalid_transition
        grounds: ["state_machines.LoanReservation", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second checkout on an already CHECKED_OUT loan fails ERR_INVALID_STATE; no double-checkout, telescope stays ON_LOAN."
        test_recipe:
          setup: ["Member standing + cert; telescope; loan RESERVED; clock inside window; first checkout done"]
          setup_api_calls:
            - call: "POST /club/membership-tiers"
              payload: { code: "INDIVIDUAL", annual_dues_cents: 120000, observatory_access_level: 2, loan_privilege: true, max_concurrent_loans: 2 }
              as: ClubOfficer
              captures: { tier_id: $.data.id }
            - call: "POST /club/members"
              payload: { full_name: "Double Check", email: "dc@x.com", tier_id: "${tier_id}" }
              as: ClubOfficer
              captures: { member_id: $.data.id }
            - call: "POST /club/dues-invoices"
              payload: { member_id: "${member_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2027-08-01T00:00:00Z" }
              as: ClubOfficer
              captures: { inv_id: $.data.id }
            - call: "POST /club/dues-payments"
              payload: { invoice_id: "${inv_id}", member_id: "${member_id}", amount_cents: 120000 }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /club/telescopes"
              payload: { name: "DC Scope", equipment_class: "REFRACTOR" }
              as: EquipmentChair
              captures: { scope_id: $.data.id }
            - call: "POST /club/training-certifications"
              payload: { member_id: "${member_id}", equipment_class: "REFRACTOR", expires_at: "2027-08-01T00:00:00Z" }
              as: EquipmentChair
            - call: "POST /club/loan-reservations"
              payload: { member_id: "${member_id}", telescope_id: "${scope_id}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-05T00:00:00Z" }
              as: Member
              as_user_id: "${member_id}"
              captures: { loan_id: $.data.id }
            - call: "POST /club/loan-reservations/${loan_id}/checkout"
              payload: {}
              as: EquipmentChair
          trigger:
            - call: "POST /club/loan-reservations/${loan_id}/checkout"
              payload: {}
              as: EquipmentChair
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "LoanReservation.${loan_id}.status == CHECKED_OUT"
            - "Telescope.${scope_id}.status == ON_LOAN"

      - name: terminal_event_cancel_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.ObservingEvent"]
        distinguishing_aspect: "A CANCELLED event accepts no further transitions: confirm, schedule, complete, weather-check all fail ERR_INVALID_STATE."
        test_recipe:
          setup: ["PUBLIC_NIGHT event SCHEDULED then CANCELLED"]
          setup_api_calls:
            - call: "POST /club/observing-events"
              payload: { title: "Dead Event", event_kind: "PUBLIC_NIGHT", window_start: "2026-08-10T01:00:00Z", window_end: "2026-08-10T05:00:00Z", moon_illumination_pct: 20, min_operators: 1 }
              as: EventCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /club/observing-events/${event_id}/schedule"
              payload: {}
              as: EventCoordinator
            - call: "POST /club/observing-events/${event_id}/cancel"
              payload: { cancellation_reason: "OTHER" }
              as: EventCoordinator
          trigger:
            - call: "POST /club/observing-events/${event_id}/complete"
              payload: {}
              as: EventCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "ObservingEvent.${event_id}.status == CANCELLED"

      - name: weather_check_auto_cancels_confirmed_event
        claim_type: side_effect_execution
        grounds: ["state_machines.ObservingEvent", "endpoints", "errors[ERR_WEATHER_RISK]"]
        distinguishing_aspect: "Recording weather_cancellation_pct >= 70 on a CONFIRMED event auto-cancels it (reason WEATHER) and cascades: CONFIRMED bookings -> CANCELLED, CONFIRMED assignments -> WITHDRAWN."
        test_recipe:
          setup: ["PUBLIC_NIGHT event CONFIRMED with 1 operator CONFIRMED and 1 booking CONFIRMED"]
          setup_api_calls:
            - call: "POST /club/membership-tiers"
              payload: { code: "INDIVIDUAL", annual_dues_cents: 120000, observatory_access_level: 2, loan_privilege: true, max_concurrent_loans: 2 }
              as: ClubOfficer
              captures: { tier_id: $.data.id }
            - call: "POST /club/members"
              payload: { full_name: "Wx Op", email: "wx@x.com", tier_id: "${tier_id}" }
              as: ClubOfficer
              captures: { op_id: $.data.id }
            - call: "POST /club/dues-invoices"
              payload: { member_id: "${op_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2027-08-01T00:00:00Z" }
              as: ClubOfficer
              captures: { op_inv: $.data.id }
            - call: "POST /club/dues-payments"
              payload: { invoice_id: "${op_inv}", member_id: "${op_id}", amount_cents: 120000 }
              as: Member
              as_user_id: "${op_id}"
            - call: "POST /club/telescopes"
              payload: { name: "Wx Scope", equipment_class: "DOBSONIAN" }
              as: EquipmentChair
              captures: { scope_id: $.data.id }
            - call: "POST /club/training-certifications"
              payload: { member_id: "${op_id}", equipment_class: "DOBSONIAN", expires_at: "2027-08-01T00:00:00Z" }
              as: EquipmentChair
            - call: "POST /club/observing-events"
              payload: { title: "Wx PN", event_kind: "PUBLIC_NIGHT", window_start: "2026-08-20T01:00:00Z", window_end: "2026-08-20T05:00:00Z", moon_illumination_pct: 10, min_operators: 1 }
              as: EventCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /club/observing-events/${event_id}/schedule"
              payload: {}
              as: EventCoordinator
            - call: "POST /club/event-operator-assignments"
              payload: { event_id: "${event_id}", member_id: "${op_id}", telescope_id: "${scope_id}" }
              as: EventCoordinator
              captures: { asg_id: $.data.id }
            - call: "POST /club/event-operator-assignments/${asg_id}/accept"
              payload: {}
              as: Member
              as_user_id: "${op_id}"
            - call: "POST /club/group-visit-bookings"
              payload: { event_id: "${event_id}", group_name: "Wx Group", party_size: 8, contact_member_id: "${op_id}" }
              as: Member
              as_user_id: "${op_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /club/group-visit-bookings/${booking_id}/confirm"
              payload: {}
              as: EventCoordinator
            - call: "GET /club/observing-events/${event_id}"
              payload: {}
              as: EventCoordinator
              captures: { ev_v: $.data.version }
            - call: "POST /club/observing-events/${event_id}/confirm"
              payload: { expected_event_version: "${ev_v}" }
              as: EventCoordinator
          trigger:
            - call: "POST /club/observing-events/${event_id}/weather-check"
              payload: { weather_cancellation_pct: 75 }
              as: EventCoordinator
              captures: { e_status: $.data.status, e_reason: $.data.cancellation_reason }
          assert:
            - "e_status == CANCELLED"
            - "e_reason == WEATHER"
            - "EventOperatorAssignment.${asg_id}.status == WITHDRAWN"
            - "GroupVisitBooking.${booking_id}.status == CANCELLED"

      - name: event_complete_cascades_bookings
        claim_type: side_effect_execution
        grounds: ["state_machines.ObservingEvent.CONFIRMED_to_COMPLETED", "state_machines.GroupVisitBooking.CONFIRMED_to_COMPLETED"]
        distinguishing_aspect: "Completing a CONFIRMED event after window_end moves CONFIRMED bookings to COMPLETED; PENDING bookings remain PENDING (conditional cascade)."
        test_recipe:
          setup: ["Event CONFIRMED; booking B1 CONFIRMED; booking B2 PENDING; clock past window_end"]
          setup_api_calls:
            - call: "POST /club/membership-tiers"
              payload: { code: "FAMILY", annual_dues_cents: 180000, observatory_access_level: 2, loan_privilege: true, max_concurrent_loans: 3 }
              as: ClubOfficer
              captures: { tier_id: $.data.id }
            - call: "POST /club/members"
              payload: { full_name: "EC Op", email: "ec@x.com", tier_id: "${tier_id}" }
              as: ClubOfficer
              captures: { op_id: $.data.id }
            - call: "POST /club/dues-invoices"
              payload: { member_id: "${op_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2027-08-01T00:00:00Z" }
              as: ClubOfficer
              captures: { op_inv: $.data.id }
            - call: "POST /club/dues-payments"
              payload: { invoice_id: "${op_inv}", member_id: "${op_id}", amount_cents: 180000 }
              as: Member
              as_user_id: "${op_id}"
            - call: "POST /club/telescopes"
              payload: { name: "EC Scope", equipment_class: "SCT" }
              as: EquipmentChair
              captures: { scope_id: $.data.id }
            - call: "POST /club/training-certifications"
              payload: { member_id: "${op_id}", equipment_class: "SCT", expires_at: "2027-08-01T00:00:00Z" }
              as: EquipmentChair
            - call: "POST /club/observing-events"
              payload: { title: "EC PN", event_kind: "PUBLIC_NIGHT", window_start: "2026-08-05T01:00:00Z", window_end: "2026-08-05T05:00:00Z", moon_illumination_pct: 8, min_operators: 1 }
              as: EventCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /club/observing-events/${event_id}/schedule"
              payload: {}
              as: EventCoordinator
            - call: "POST /club/event-operator-assignments"
              payload: { event_id: "${event_id}", member_id: "${op_id}", telescope_id: "${scope_id}" }
              as: EventCoordinator
              captures: { asg_id: $.data.id }
            - call: "POST /club/event-operator-assignments/${asg_id}/accept"
              payload: {}
              as: Member
              as_user_id: "${op_id}"
            - call: "POST /club/group-visit-bookings"
              payload: { event_id: "${event_id}", group_name: "B1", party_size: 5, contact_member_id: "${op_id}" }
              as: Member
              as_user_id: "${op_id}"
              captures: { b1: $.data.id }
            - call: "POST /club/group-visit-bookings/${b1}/confirm"
              payload: {}
              as: EventCoordinator
            - call: "POST /club/group-visit-bookings"
              payload: { event_id: "${event_id}", group_name: "B2", party_size: 6, contact_member_id: "${op_id}" }
              as: Member
              as_user_id: "${op_id}"
              captures: { b2: $.data.id }
            - call: "GET /club/observing-events/${event_id}"
              payload: {}
              as: EventCoordinator
              captures: { ev_v: $.data.version }
            - call: "POST /club/observing-events/${event_id}/confirm"
              payload: { expected_event_version: "${ev_v}" }
              as: EventCoordinator
            - call: "POST /club/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T06:00:00Z" }
              as: ClubOfficer
          trigger:
            - call: "POST /club/observing-events/${event_id}/complete"
              payload: {}
              as: EventCoordinator
              captures: { e_status: $.data.status }
          assert:
            - "e_status == COMPLETED"
            - "GroupVisitBooking.${b1}.status == COMPLETED"
            - "GroupVisitBooking.${b2}.status == PENDING (conditional cascade skips non-CONFIRMED)"

      - name: resignation_blocked_by_outstanding_loan
        claim_type: precondition_enforcement
        grounds: ["state_machines.Member.ACTIVE_to_RESIGNED", "errors[ERR_LOANS_OUTSTANDING]"]
        distinguishing_aspect: "Resign with a CHECKED_OUT loan fails ERR_LOANS_OUTSTANDING; after return, resign succeeds and cancels remaining RESERVED loans."
        test_recipe:
          setup: ["Member standing + cert; telescope; loan CHECKED_OUT (clock inside window)"]
          setup_api_calls:
            - call: "POST /club/membership-tiers"
              payload: { code: "INDIVIDUAL", annual_dues_cents: 120000, observatory_access_level: 2, loan_privilege: true, max_concurrent_loans: 2 }
              as: ClubOfficer
              captures: { tier_id: $.data.id }
            - call: "POST /club/members"
              payload: { full_name: "Resign Rex", email: "rex@x.com", tier_id: "${tier_id}" }
              as: ClubOfficer
              captures: { member_id: $.data.id }
            - call: "POST /club/dues-invoices"
              payload: { member_id: "${member_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2027-08-01T00:00:00Z" }
              as: ClubOfficer
              captures: { inv_id: $.data.id }
            - call: "POST /club/dues-payments"
              payload: { invoice_id: "${inv_id}", member_id: "${member_id}", amount_cents: 120000 }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /club/telescopes"
              payload: { name: "Rex Scope", equipment_class: "REFRACTOR" }
              as: EquipmentChair
              captures: { scope_id: $.data.id }
            - call: "POST /club/training-certifications"
              payload: { member_id: "${member_id}", equipment_class: "REFRACTOR", expires_at: "2027-08-01T00:00:00Z" }
              as: EquipmentChair
            - call: "POST /club/loan-reservations"
              payload: { member_id: "${member_id}", telescope_id: "${scope_id}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-06T00:00:00Z" }
              as: Member
              as_user_id: "${member_id}"
              captures: { loan_id: $.data.id }
            - call: "POST /club/loan-reservations/${loan_id}/checkout"
              payload: {}
              as: EquipmentChair
          trigger:
            - call: "POST /club/members/${member_id}/resign"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
              captures: { err: $.data.error_id }
            - call: "POST /club/loan-reservations/${loan_id}/return"
              payload: { damage_reported: false }
              as: EquipmentChair
            - call: "POST /club/members/${member_id}/resign"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
              captures: { m_status: $.data.status }
          assert:
            - "err == ERR_LOANS_OUTSTANDING"
            - "m_status == RESIGNED (after return)"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: dark_sky_median_even_count_boundary_grade
        claim_type: correct_result
        grounds: ["calculations.dark_sky_median"]
        distinguishing_aspect: "Even-count median averages the two middle values with round_half_up to 2dp; median exactly 21.50 lands in grade A band (>= boundary). Readings exactly AT period_end are excluded (half-open window)."
        test_recipe:
          setup: ["member + event; report window 2026-08-01..2026-09-01; four readings 21.20, 21.80, 21.60, 21.40 inside window; one reading at exactly period_end belongs to a second report"]
          setup_api_calls:
            - call: "POST /club/membership-tiers"
              payload: { code: "INDIVIDUAL", annual_dues_cents: 120000, observatory_access_level: 2, loan_privilege: true, max_concurrent_loans: 2 }
              as: ClubOfficer
              captures: { tier_id: $.data.id }
            - call: "POST /club/members"
              payload: { full_name: "Median Mary", email: "mary@x.com", tier_id: "${tier_id}" }
              as: ClubOfficer
              captures: { member_id: $.data.id }
            - call: "POST /club/observing-events"
              payload: { title: "Aug E", event_kind: "PUBLIC_NIGHT", window_start: "2026-08-10T01:00:00Z", window_end: "2026-08-10T05:00:00Z", moon_illumination_pct: 20, min_operators: 1 }
              as: EventCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /club/observing-events"
              payload: { title: "Sep E", event_kind: "PUBLIC_NIGHT", window_start: "2026-09-01T01:00:00Z", window_end: "2026-09-01T05:00:00Z", moon_illumination_pct: 20, min_operators: 1 }
              as: EventCoordinator
              captures: { event2_id: $.data.id }
            - call: "POST /club/sky-quality-readings"
              payload: { taken_by_member_id: "${member_id}", event_id: "${event_id}", sqm_value: 21.20 }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /club/sky-quality-readings"
              payload: { taken_by_member_id: "${member_id}", event_id: "${event_id}", sqm_value: 21.80 }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /club/sky-quality-readings"
              payload: { taken_by_member_id: "${member_id}", event_id: "${event_id}", sqm_value: 21.60 }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /club/sky-quality-readings"
              payload: { taken_by_member_id: "${member_id}", event_id: "${event_id}", sqm_value: 21.40 }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /club/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ClubOfficer
            - call: "POST /club/sky-quality-readings"
              payload: { taken_by_member_id: "${member_id}", event_id: "${event2_id}", sqm_value: 19.00 }
              as: Member
              as_user_id: "${member_id}"
          trigger:
            - call: "POST /club/dark-sky-reports"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
