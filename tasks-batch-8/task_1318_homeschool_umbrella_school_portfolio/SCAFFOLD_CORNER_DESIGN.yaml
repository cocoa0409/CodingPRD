      - name: cascades_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: ["state_machines.Portfolio.SUBMITTED_to_REJECTED", "state_machines.CoopClass.OPEN_to_CANCELLED"]
        excluded_because:
          difficulty_instance: transitive_cascade / portfolio_rejection_noncompliance_coop_cascade
          rationale: "Both cascade chains (rejection-driven and cancellation-driven) asserted end-to-end in the two §1.8 cascade instances."

