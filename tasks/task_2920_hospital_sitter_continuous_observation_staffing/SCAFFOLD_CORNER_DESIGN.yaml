            - "Reassessment ${wr1}: score_before == 2.5, score_after == 2.5, interval_hours_after == 24 — at exactly 24h the attempt still counts (>= boundary)"
            - "After ${wr1} the order is ACTIVE with last_reassessed_at == 2026-08-02T00:00:00Z and next_reassessment_due_at == 2026-08-03T00:00:00Z"
            - "Reassessment ${wr2}: score_before == 2.5, score_after == 1.5, interval_hours_after == 24 — one second later the same event has fallen out of the window"
            - "ObservationOrder.${wo}.elopement_risk_score == 1.5, risk_score_variant == ROLLING_EVENT_WEIGHTED, reassessment_count == 2"
            - "SafetyEvent.${wev} is unchanged: status CLOSED, occurred_at 2026-08-01T00:00:00Z"

      - name: labor_cost_variants_diverge_on_the_same_watch
        claim_type: variant_divergence
        grounds:
          - calculations.assignment_labor_cost.variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / assignment_labor_cost_provisional_vs_final_diverge_on_one_watch"
          rationale: "That instance asserts both variants on one watch and the exact delta the switch writes into the unit ledger."

      - name: provisional_is_reconciled_against_the_summed_finals
        claim_type: reconciliation
        grounds:
          - calculations.assignment_labor_cost.variants.final
        excluded_because:
          difficulty_instance: "combinatorial_formula / per_segment_rounding_beats_sum_then_round_on_agency_watch"
          rationale: "That instance reverses the provisional and asserts the ledger head equals the summed per-segment finals, 16191, to the cent."

      - name: risk_score_variant_selection_by_context
        claim_type: variant_selection
        grounds:
          - calculations.patient_elopement_risk_score.variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / elopement_risk_score_admission_baseline_vs_rolling_event_weighted"
          rationale: "That instance asserts ADMISSION_BASELINE at creation and ROLLING_EVENT_WEIGHTED after the event close, on the same order."

      - name: span_limit_recomputes_from_the_live_acuity_weight
        claim_type: constraint_propagation
        grounds:
          - calculations.station_effective_span_limit
        excluded_because:
          difficulty_instance: "compensating_invariant / feed_release_restores_station_occupancy_and_span_limit_without_drift"
          rationale: "That instance walks the limit 3 -> 3 -> 2 -> 3 -> 3 as feeds arrive and leave, which is the propagation-to-fixed-point claim."

  - section: validations
    instances:
      - name: volunteer_pool_is_barred_from_an_elopement_risk_order
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
        distinguishing_aspect: "Priority 13 fires on the intersection of source_pool == VOLUNTEER and a risk set containing ELOPEMENT, while the same volunteer is fully eligible on a FALL-only order. The rejected create must leave the order version, the ledger and the staff row untouched."
        test_recipe:
          setup:
            - "Unit UNIT-C25 budget 250000, video disabled; two admitted patients age 60."
            - "One VOLUNTEER staff with ADVANCED competency and an unexpired certification (so priorities 10, 11 and 12 all pass)."
            - "Order VE1 with risk_categories [FALL, ELOPEMENT]; order VF1 with risk_categories [FALL]."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C25", name: "Corner Unit Twentyfive", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u25: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u25}", mrn: "MRN-C2501", full_name: "Volunteer Patient One", age_years: 60 }
              as: NurseManager
              captures: { vp1: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u25}", full_name: "Trained Volunteer", source_pool: "VOLUNTEER", hourly_rate_cents: 0, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { vs1: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${vp1}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL", "ELOPEMENT"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Wandering with unsteady gait" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { vo1: $.data.id, vo1_v1: $.data.version }
          trigger:
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${vo1}", staff_id: "${vs1}", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T16:00:00Z", expected_order_version: "${vo1_v1}" }
              as: StaffingCoordinator
          assert:
            - "HTTP 422 with data.error_id == ERR_VOLUNTEER_NOT_ELIGIBLE"
            - "ObservationOrder.${vo1}.version is still ${vo1_v1} — a rejected create bumps nothing"
            - "GET /observation/orders/${vo1}/sitter-assignments returns 0 rows and Unit.${u25}.observed_cost_to_date_cents == 0"
            - "Staff.${vs1}.status == AVAILABLE and last_shift_end_at == null"

      - name: volunteer_on_a_fall_only_order_is_scheduled_at_zero_cost
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=13]
          - calculations.assignment_labor_cost.constants.POOL_MULTIPLIER_VOLUNTEER
        distinguishing_aspect: "The same volunteer that priority 13 rejected for ELOPEMENT is accepted on a FALL-only order, and the VOLUNTEER multiplier of 0.00 makes the provisional exactly 0 — a real CostEntry row is still written, so the ledger head stays 0 while the entry count goes to 1."
        test_recipe:
          setup:
            - "Unit UNIT-C26 budget 250000, video disabled; admitted patient age 60; a VOLUNTEER staff with ADVANCED competency and an unexpired certification."
            - "Order VF1 carries risk_categories [FALL] only."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C26", name: "Corner Unit Twentysix", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u26: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u26}", mrn: "MRN-C2601", full_name: "Volunteer Patient Two", age_years: 60 }
              as: NurseManager
              captures: { vp2: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u26}", full_name: "Trained Volunteer Two", source_pool: "VOLUNTEER", hourly_rate_cents: 0, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { vs2: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${vp2}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Fall precautions only" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { vo2: $.data.id, vo2_v1: $.data.version }
          trigger:
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${vo2}", staff_id: "${vs2}", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T16:00:00Z", expected_order_version: "${vo2_v1}" }
              as: StaffingCoordinator
              captures: { va2: $.data.id }
          assert:
            - "HTTP 201 with data.watch_status == SCHEDULED, documentation_status == PENDING, scheduled_minutes == 480"
            - "data.provisional_cost_cents == 0 (0 * 8 * 0.00)"
            - "GET /observation/sitter-assignments/${va2}/cost-entries returns exactly 1 row: PROVISIONAL, POSTED, amount_cents 0, source_pool VOLUNTEER, segment_index null, segment_minutes null"
            - "Unit.${u26}.observed_cost_to_date_cents == 0 and status == OPEN"
            - "Staff.${vs2}.last_shift_end_at == 2026-08-01T16:00:00Z and status == AVAILABLE (scheduling does not change duty posture)"

      - name: break_eligibility_and_minimum_break_are_both_whole_minute_boundaries
        claim_type: temporal
        grounds:
          - validations[priority=21]
        distinguishing_aspect: "Priority 21 carries two thresholds on opposite sides of the break, and each is probed one minute short and then exactly on the boundary: break-start at 119 minutes fails and at exactly 120 succeeds; break-end at 14 minutes of break fails and at exactly 15 succeeds. The successful break-start also bills exactly the 120 closed minutes and no break minutes are ever billed."
        test_recipe:
          setup:
            - "Unit UNIT-C27 budget 250000, video disabled; admitted patient age 60; ACTIVE FALL-only order."
            - "An INTERNAL_FLOAT sitter at 2000 cents/hour scheduled 2026-08-01T08:00Z -> 16:00Z (PROVISIONAL 16000) and on watch from exactly 08:00Z."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C27", name: "Corner Unit Twentyseven", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u27: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u27}", mrn: "MRN-C2701", full_name: "Break Patient", age_years: 60 }
              as: NurseManager
              captures: { bp: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u27}", full_name: "Break Sitter", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { bs: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${bp}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Fall precautions, day watch" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { bo: $.data.id, bo_v1: $.data.version }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${bo}", staff_id: "${bs}", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T16:00:00Z", expected_order_version: "${bo_v1}" }
              as: StaffingCoordinator
              captures: { ba: $.data.id }
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: SystemAdmin
            - call: "POST /observation/sitter-assignments/${ba}/start-watch"
              payload: {}
              as: Sitter
              as_user_id: "${bs}"
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:59:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /observation/sitter-assignments/${ba}/break-start"
              payload: {}
              as: Sitter
              as_user_id: "${bs}"
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:00:00Z" }
              as: SystemAdmin
            - call: "POST /observation/sitter-assignments/${ba}/break-start"
              payload: {}
              as: Sitter
              as_user_id: "${bs}"
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:14:00Z" }
              as: SystemAdmin
            - call: "POST /observation/sitter-assignments/${ba}/break-end"
              payload: {}
              as: Sitter
              as_user_id: "${bs}"
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:15:00Z" }
              as: SystemAdmin
            - call: "POST /observation/sitter-assignments/${ba}/break-end"
              payload: {}
              as: Sitter
              as_user_id: "${bs}"
          assert:
            - "Probe 1 (119 whole minutes on the open segment): HTTP 422 with data.error_id == ERR_BREAK_NOT_YET_ELIGIBLE; watch_status stays ON_WATCH and no CostEntry is written"
            - "Probe 2 (exactly 120 minutes): HTTP 200 with watch_status == ON_BREAK, break_started_at == 2026-08-01T10:00:00Z, current_segment_started_at == null"
            - "Probe 2 posts one FINAL_SEGMENT CostEntry: amount_cents 4000 (2000 * 2 * 1.00), segment_index 1, segment_minutes 120, night_differential_applied false"
            - "After probe 2: watch_segment_count == 1, watched_minutes == 120, Unit.${u27}.observed_cost_to_date_cents == 20000 (16000 provisional + 4000 segment), Staff.${bs}.total_watch_minutes == 120"
            - "Probe 3 (14 minutes of break): HTTP 422 with data.error_id == ERR_BREAK_TOO_SHORT; watch_status stays ON_BREAK and break_started_at is unchanged"
            - "Probe 4 (exactly 15 minutes): HTTP 200 with watch_status == ON_WATCH, current_segment_started_at == 2026-08-01T10:15:00Z, break_started_at == null"
            - "Probe 4 writes no CostEntry: the assignment still has 2 entries and watched_minutes is still 120 — the 15 break minutes are never billed"

      - name: float_authorization_is_demanded_only_for_a_cross_unit_sitter
        claim_type: conditional
        grounds:
          - validations[priority=26]
        distinguishing_aspect: "Priority 26 is keyed on a comparison between two other rows — Staff.home_unit_id versus the order patient's unit_id — so the identical payload shape is legal for a home-unit sitter and illegal for a floated one. Three creates on one order show the rule off, on, and satisfied, and the rejected middle create leaves the order version replayable for the third."
        test_recipe:
          setup:
            - "Two units: UNIT-C28 (budget 250000, video disabled) holds the patient; UNIT-C29 is the sitter's home unit."
            - "Admitted patient age 60 in UNIT-C28 with an ACTIVE FALL-only order."
            - "Sitter HOME is homed in UNIT-C28; sitter FLOAT is homed in UNIT-C29. Both ADVANCED with unexpired certifications and rate 2000."
            - "The two shift windows are disjoint (08:00-16:00 and 16:00-24:00) and belong to different staff, so priorities 17 and 18 never fire."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C28", name: "Corner Unit Twentyeight", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u28: $.data.id }
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C29", name: "Corner Unit Twentynine", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u29: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u28}", mrn: "MRN-C2801", full_name: "Float Patient", age_years: 60 }
              as: NurseManager
              captures: { fp: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u28}", full_name: "Home Sitter", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { fs_home: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u29}", full_name: "Floated Sitter", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { fs_float: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${fp}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Fall precautions, cross-unit coverage" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { fo: $.data.id, fo_v1: $.data.version }
          trigger:
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${fo}", staff_id: "${fs_home}", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T16:00:00Z", expected_order_version: "${fo_v1}" }
              as: StaffingCoordinator
              captures: { fa_home: $.data.id }
            - call: "GET /observation/orders/${fo}"
              payload: {}
              as: StaffingCoordinator
              captures: { fo_v2: $.data.version }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${fo}", staff_id: "${fs_float}", shift_start_at: "2026-08-01T16:00:00Z", shift_end_at: "2026-08-02T00:00:00Z", expected_order_version: "${fo_v2}" }
              as: StaffingCoordinator
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${fo}", staff_id: "${fs_float}", shift_start_at: "2026-08-01T16:00:00Z", shift_end_at: "2026-08-02T00:00:00Z", expected_order_version: "${fo_v2}", float_authorization_code: "FLOAT-7788" }
              as: StaffingCoordinator
              captures: { fa_float: $.data.id }
          assert:
            - "Create 1 (home-unit sitter, no code in the payload): HTTP 201 — priority 26 does not apply because Staff.${fs_home}.home_unit_id == Patient.${fp}.unit_id; provisional_cost_cents == 16000"
            - "Create 2 (floated sitter, no code): HTTP 422 with data.error_id == ERR_FLOAT_AUTHORIZATION_MISSING"
            - "Create 2 bumped nothing: ObservationOrder.${fo}.version is still ${fo_v2}, which is why create 3 may replay the same expected_order_version"
            - "Create 3 (floated sitter with float_authorization_code): HTTP 201 with provisional_cost_cents == 16000 and float_authorization_code == FLOAT-7788"
            - "Unit.${u28}.observed_cost_to_date_cents == 32000 and status == OPEN; Unit.${u29}.observed_cost_to_date_cents == 0 — the charge follows the patient's unit, not the sitter's home unit"
            - "GET /observation/orders/${fo}/sitter-assignments returns exactly 2 rows"

      - name: handoff_incoming_watch_must_sit_on_the_outgoing_watchs_order
        claim_type: cross_entity
        grounds:
          - validations[priority=27]
        distinguishing_aspect: "Priority 27 is a two-sided cross-entity check and each side is probed separately: an incoming assignment drawn from a different order fails, naming the outgoing assignment as its own successor fails, and only the same-order pair is accepted. The two failures must leave documentation_status at PENDING."
        test_recipe:
          setup:
            - "Unit UNIT-C30 budget 250000, video disabled; two admitted patients age 60, each with an ACTIVE FALL-only order (order HA and order HB)."
            - "Three INTERNAL_FLOAT sitters, all ADVANCED with unexpired certifications, rate 2000."
            - "Order HA carries an outgoing watch 08:00-16:00 (sitter OUT) and an incoming watch 16:00-24:00 (sitter IN); order HB carries an unrelated watch 08:00-16:00 (sitter OTHER)."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C30", name: "Corner Unit Thirty", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u30: $.data.id }
