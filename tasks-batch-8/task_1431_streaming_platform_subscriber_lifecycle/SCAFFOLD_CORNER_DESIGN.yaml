              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_PRICE_CHANGE_NOTICE_TOO_SHORT (effective 14 days < 30 minimum)"

      - name: duplicate_active_subscription_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_DUPLICATE_ACTIVE_SUBSCRIPTION]"
        distinguishing_aspect: "Second subscription create on an account with an ACTIVE subscription returns ERR_DUPLICATE_ACTIVE_SUBSCRIPTION."
        test_recipe:
