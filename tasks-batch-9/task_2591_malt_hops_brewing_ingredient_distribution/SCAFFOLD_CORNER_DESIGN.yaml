            - "entirely unknown line id: HTTP 404 with ${co_err_unknown} == ERR_ORDER_LINE_NOT_FOUND"
            - "own line: HTTP 200 with ${co_count} == 0 and OrderLine.${co_line_a}.status == REMOVED"
            - "SalesOrder.${co_a_id}.subtotal_cents == 0 and requires_cold_chain == false after the rollup re-runs over an empty input set"

