# =============================================================================
# Restaurant Supply & Smallwares Distribution — benchmark seed tables (v1)
# =============================================================================

scenario: |
  559. Restaurant Supply & Smallwares Distribution (WebstaurantStore style):
  catalog & B2B account, case/pallet pricing tier, freight & liftgate quote,
  backorder & dropship, return/RMA & restock fee, credit terms & tax-exempt
  cert, reorder & par, equipment lead-time

domain_name: restaurant-supply
api_prefix: /   # flat multi-collection API: each entity has a top-level /<collection> path

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation      # provisional-vs-final freight; sealed-vs-opened restock
    - cascading_side_effects        # confirm→line→inventory→reorder; receive→line→inventory→reorder
    - optimistic_concurrency        # confirm reserves credit against Account.version
    - rate_threshold_triggers       # tier boundaries, parcel/LTL weight breakpoint, free-freight

  entity_topology: hybrid
  # Account→Order→OrderLine is a strict ownership tree; Product, Dock, InstallCrew
  # are flat peers referenced by FK across aggregate boundaries.

  state_machine_shape: branching
  # ReturnAuthorization branches + reverts; TaxExemptCertificate cycles
  # (REJECTED→SUBMITTED resubmit); PurchaseOrder carries parallel
  # lifecycle_status × payment_status dimensions.

  relationship_patterns:
    - one_to_many          # Account→Orders, Order→Lines, Return→ReturnLines
    - cross_aggregate      # OrderLine→Product, DeliveryAppointment→Dock, InstallJob→InstallCrew

  role_model: peer_roles
  # AccountManager owns account/credit/cert-approval; Buyer owns their own
  # orders/returns; WarehouseOps owns catalog/inventory/fulfillment/scheduling.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: business_name, type: string, source: input, description: "Legal business name of the B2B account" }
      - { name: credit_terms, type: enum, source: input, description: "PREPAID | NET_15 | NET_30", constraints: "one of PREPAID, NET_15, NET_30" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum outstanding balance in cents; must be >= 0" }
      - { name: tax_rate, type: number, source: input, default: 0.08, description: "Sales-tax rate applied to taxable lines when the account is not tax-exempt" }
      - { name: outstanding_cents, type: integer, source: computed, description: "Read-only = sum of total_cents over this account's orders whose lifecycle_status IN {CONFIRMED, SHIPPED, COMPLETED} AND payment_status IN {UNPAID, INVOICED}, minus sum of refund_cents over this account's returns whose status == REFUNDED" }
      - { name: credit_available_cents, type: integer, source: computed, description: "Read-only = credit_limit_cents - outstanding_cents" }
      - { name: tax_exempt_status, type: enum, source: system, default: "NONE", description: "NONE | CERTIFIED | EXPIRED; CERTIFIED set when a TaxExemptCertificate is APPROVED, EXPIRED when it expires", constraints: "one of NONE, CERTIFIED, EXPIRED" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED", constraints: "one of ACTIVE, SUSPENDED" }

  - name: TaxExemptCertificate
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; the account this certificate belongs to" }
      - { name: cert_number, type: string, source: input, description: "Resale/exemption certificate number" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code the exemption applies to" }
      - { name: expiry_date, type: datetime, source: input, description: "ISO 8601 UTC instant at/after which the certificate is expired" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | APPROVED | REJECTED | EXPIRED", constraints: "one of SUBMITTED, APPROVED, REJECTED, EXPIRED" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Catalog stock-keeping unit" }
      - { name: name, type: string, source: input, description: "Product display name" }
      - { name: category, type: enum, source: input, description: "SMALLWARE | EQUIPMENT | CONSUMABLE", constraints: "one of SMALLWARE, EQUIPMENT, CONSUMABLE" }
      - { name: taxable, type: boolean, source: input, default: true, description: "Whether the product's line subtotal is taxed" }
      - { name: unit_price_cents, type: integer, source: input, description: "Per-each price in cents (EACH tier)" }
      - { name: case_qty, type: integer, source: input, description: "Number of eaches in one case; must be >= 1" }
      - { name: case_price_cents, type: integer, source: input, description: "Price of one full case in cents (CASE tier)" }
      - { name: pallet_case_qty, type: integer, source: input, description: "Number of cases in one pallet; must be >= 1" }
      - { name: pallet_price_cents, type: integer, source: input, description: "Price of one full pallet in cents (PALLET tier)" }
      - { name: weight_lbs_per_unit, type: integer, source: input, description: "Shipping weight per each, in whole pounds" }
      - { name: fulfillment_type, type: enum, source: input, description: "STOCK | DROPSHIP; DROPSHIP lines never draw from on_hand_qty", constraints: "one of STOCK, DROPSHIP" }
      - { name: freight_type, type: enum, source: input, description: "PARCEL | LTL catalog freight hint", constraints: "one of PARCEL, LTL" }
      - { name: lead_time_days, type: integer, source: input, default: 0, description: "EQUIPMENT lead time in whole days before an install may be scheduled" }
      - { name: on_hand_qty, type: integer, source: input, description: "Physical eaches in stock; decremented on allocation, incremented on restock/return" }
      - { name: par_level, type: integer, source: input, description: "Target replenishment level in eaches" }
      - { name: reorder_point, type: integer, source: input, description: "on_hand_qty at/below which the product needs reorder" }
      - { name: needs_reorder, type: boolean, source: computed, description: "Read-only = (on_hand_qty <= reorder_point)" }
      - { name: reorder_suggested_qty, type: integer, source: computed, description: "Read-only = max(0, par_level - on_hand_qty) when needs_reorder else 0" }

  - name: PurchaseOrder
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the buying account (must equal the acting Buyer's X-User-ID)" }
      - { name: confirmed_at, type: datetime, source: system, description: "Logical-clock instant the order was confirmed; null until CONFIRMED" }
      - { name: merchandise_subtotal_cents, type: integer, source: computed, description: "Read-only = sum of line_subtotal_cents over this order's non-CANCELLED lines" }
      - { name: tax_cents, type: integer, source: computed, description: "Read-only order tax; see order_tax calculation" }
      - { name: freight_cents, type: integer, source: computed, default: 0, description: "Read-only; 0 until a Shipment quote sets it, replaced by final freight on book" }
      - { name: total_cents, type: integer, source: computed, description: "Read-only = merchandise_subtotal_cents + tax_cents + freight_cents" }
      - { name: lifecycle_status, type: enum, source: system, default: "DRAFT", description: "DRAFT | CONFIRMED | SHIPPED | COMPLETED | CANCELLED", constraints: "one of DRAFT, CONFIRMED, SHIPPED, COMPLETED, CANCELLED" }
      - { name: payment_status, type: enum, source: system, default: "UNPAID", description: "UNPAID | INVOICED | PAID; evolves independently of lifecycle_status once CONFIRMED", constraints: "one of UNPAID, INVOICED, PAID" }

  - name: OrderLine
    parent: PurchaseOrder
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> PurchaseOrder.id; the parent order" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the catalog product ordered" }
      - { name: quantity, type: integer, source: input, description: "Requested eaches; must be >= 1" }
      - { name: pricing_tier, type: enum, source: computed, description: "EACH | CASE | PALLET — highest whole tier reached by quantity (see line_tier_pricing)", constraints: "one of EACH, CASE, PALLET" }
      - { name: line_subtotal_cents, type: integer, source: computed, description: "Read-only tiered line total; see line_tier_pricing" }
      - { name: allocated_qty, type: integer, source: computed, default: 0, description: "Eaches allocated from Product.on_hand_qty at confirm (STOCK lines only)" }
      - { name: backordered_qty, type: integer, source: computed, default: 0, description: "Eaches not fulfillable from stock at confirm = quantity - allocated_qty (STOCK lines only)" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | ALLOCATED | PARTIAL | BACKORDERED | DROPSHIP_PENDING | SHIPPED | CANCELLED (driven by parent order transitions)", constraints: "one of PENDING, ALLOCATED, PARTIAL, BACKORDERED, DROPSHIP_PENDING, SHIPPED, CANCELLED" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> PurchaseOrder.id; the order being shipped" }
      - { name: carrier, type: string, source: input, description: "Carrier name" }
      - { name: liftgate_required, type: boolean, source: input, default: false, description: "Whether an LTL liftgate fee applies" }
      - { name: shipping_mode, type: enum, source: computed, description: "PARCEL | LTL selected by total shipped weight vs PARCEL_MAX_LBS", constraints: "one of PARCEL, LTL" }
      - { name: freight_quote_cents, type: integer, source: computed, description: "Provisional freight from ORDERED quantities at QUOTED (see freight_quote variant=provisional)" }
      - { name: final_freight_cents, type: integer, source: computed, description: "Final freight from ALLOCATED quantities at BOOKED (see freight_quote variant=final); null until booked" }
      - { name: delivered_at, type: datetime, source: system, description: "Logical-clock instant of delivery; null until DELIVERED; anchors the return window" }
      - { name: status, type: enum, source: system, default: "QUOTED", description: "QUOTED | BOOKED | DELIVERED | CANCELLED", constraints: "one of QUOTED, BOOKED, DELIVERED, CANCELLED" }

  - name: ReturnAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> PurchaseOrder.id; the original delivered order being returned against" }
      - { name: reason, type: string, source: input, description: "Free-text return reason" }
      - { name: restock_fee_cents, type: integer, source: computed, default: 0, description: "Sum of per-line restock fees, set at APPROVED (see restock_refund)" }
      - { name: refund_cents, type: integer, source: computed, default: 0, description: "Sum of per-line refunds = merchandise value minus restock fee, set at APPROVED (see restock_refund)" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | APPROVED | RECEIVED | REFUNDED | REJECTED", constraints: "one of REQUESTED, APPROVED, RECEIVED, REFUNDED, REJECTED" }

  - name: ReturnLine
    parent: ReturnAuthorization
    common_fields: true
    fields:
      - { name: return_id, type: string, source: system, description: "FK -> ReturnAuthorization.id; the parent RMA" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; must appear on the original order" }
      - { name: quantity, type: integer, source: input, description: "Eaches being returned; must be >= 1 and <= quantity ordered for this product on the original order" }
      - { name: condition, type: enum, source: input, description: "SEALED | OPENED — drives the restock-fee percentage", constraints: "one of SEALED, OPENED" }
      - { name: line_refund_cents, type: integer, source: computed, default: 0, description: "Read-only per-line refund set at APPROVED (merch value minus restock fee)" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | RECEIVED (set when the RMA is RECEIVED)", constraints: "one of PENDING, RECEIVED" }

  - name: Dock
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Dock/bay display name" }
      - { name: location, type: string, source: input, default: "", description: "Optional warehouse location label" }

  - name: DeliveryAppointment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> PurchaseOrder.id; the order being delivered" }
      - { name: dock_id, type: string, source: input, description: "FK -> Dock.id; the occupied dock" }
      - { name: window_start, type: datetime, source: input, description: "ISO 8601 UTC start of the delivery window (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "ISO 8601 UTC end of the delivery window (exclusive); must be > window_start" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | CANCELLED", constraints: "one of SCHEDULED, CANCELLED" }

  - name: InstallCrew
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Install crew display name" }

  - name: InstallJob
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> PurchaseOrder.id; the order whose EQUIPMENT line is being installed" }
      - { name: crew_id, type: string, source: input, description: "FK -> InstallCrew.id; the occupied crew" }
      - { name: window_start, type: datetime, source: input, description: "ISO 8601 UTC start of the install window (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "ISO 8601 UTC end of the install window (exclusive); must be > window_start" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | CANCELLED", constraints: "one of SCHEDULED, CANCELLED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Account
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /accounts/{account_id}/suspend"
        actor: AccountManager
        preconditions:
          - "Account must be ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
        side_effects:
          - "status → SUSPENDED (blocks future order confirmation for this account)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /accounts/{account_id}/reinstate"
        actor: AccountManager
        preconditions:
          - "Account must be SUSPENDED (ERR_ACCOUNT_NOT_SUSPENDED)"
        side_effects:
          - "status → ACTIVE"

  - entity: TaxExemptCertificate
    initial_state: SUBMITTED
    terminal_states: [EXPIRED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /tax-certificates/{cert_id}/approve"
        actor: AccountManager
        preconditions:
          - "Certificate must be SUBMITTED (ERR_CERT_NOT_SUBMITTED)"
          - "Certificate expiry_date must be strictly after the logical clock now (ERR_CERT_ALREADY_EXPIRED)"
        side_effects:
          - "status → APPROVED"
          - "owning Account.tax_exempt_status → CERTIFIED (Account.version += 1)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /tax-certificates/{cert_id}/reject"
        actor: AccountManager
        preconditions:
          - "Certificate must be SUBMITTED (ERR_CERT_NOT_SUBMITTED)"
        side_effects:
          - "status → REJECTED"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /tax-certificates/{cert_id}/resubmit"
        actor: Buyer
        preconditions:
          - "Certificate must be REJECTED (ERR_CERT_NOT_REJECTED)"
          - "Acting Buyer's X-User-ID must equal the certificate's account_id (ERR_NOT_ACCOUNT_OWNER)"
        side_effects:
          - "status → SUBMITTED (cyclic: certificate re-enters review)"
      - from: APPROVED
        to: EXPIRED
        trigger: "system (automatic during POST /_clock/set_current_utc when now >= expiry_date)"
        actor: system
        preconditions: []
        side_effects:
          - "status → EXPIRED"
          - "owning Account.tax_exempt_status → EXPIRED (Account.version += 1)"

  - entity: PurchaseOrder
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /orders/{order_id}/confirm"
        actor: Buyer
        preconditions:
          - "Order must be DRAFT (ERR_ORDER_NOT_DRAFT)"
          - "Order must have >= 1 non-CANCELLED line (ERR_ORDER_HAS_NO_LINES)"
          - "Owning Account.status must be ACTIVE (ERR_ACCOUNT_SUSPENDED)"
          - "total_cents (subtotal + tax; freight still 0) must be <= Account.credit_available_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
          - "expected_account_version must equal current Account.version (ERR_STALE_ACCOUNT_VERSION)"
        side_effects:
          - "confirmed_at = logical clock now"
          - "CASCADE per STOCK line: allocated_qty = min(line.quantity, Product.on_hand_qty); backordered_qty = line.quantity - allocated_qty; Product.on_hand_qty -= allocated_qty"
          - "line.status → ALLOCATED (backordered_qty==0) | PARTIAL (0<allocated<quantity) | BACKORDERED (allocated==0)"
          - "per DROPSHIP line: line.status → DROPSHIP_PENDING (no on_hand_qty change)"
          - "each affected Product: recompute needs_reorder / reorder_suggested_qty (cascade hop 3)"
          - "recompute tax_cents (order_tax), merchandise_subtotal_cents, total_cents"
          - "Account.outstanding_cents / credit_available_cents recompute (order now counts)"
          - "Account.version += 1 (OCC advance)"
          - "lifecycle_status → CONFIRMED; payment_status stays UNPAID"
      - from: CONFIRMED
        to: SHIPPED
        trigger: "POST /shipments/{shipment_id}/book (system side effect on the order)"
        actor: system
        preconditions:
          - "A Shipment for this order is being booked"
        side_effects:
          - "order.freight_cents = shipment.final_freight_cents; total_cents recompute (derived-field reconciliation)"
          - "each non-CANCELLED line.status → SHIPPED"
          - "lifecycle_status → SHIPPED"
      - from: SHIPPED
        to: COMPLETED
        trigger: "POST /shipments/{shipment_id}/deliver (system side effect on the order)"
        actor: system
        preconditions: []
        side_effects:
          - "lifecycle_status → COMPLETED (return window now open, anchored at shipment.delivered_at)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /orders/{order_id}/cancel"
        actor: Buyer
        preconditions:
          - "Order must be DRAFT or CONFIRMED (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "each non-CANCELLED line.status → CANCELLED"
          - "lifecycle_status → CANCELLED"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /orders/{order_id}/cancel"
        actor: Buyer
        preconditions:
          - "Order must be DRAFT or CONFIRMED (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "COMPENSATION per STOCK line: Product.on_hand_qty += line.allocated_qty; line.allocated_qty=0; backordered_qty=0"
          - "each affected Product: recompute needs_reorder / reorder_suggested_qty"
          - "each non-CANCELLED line.status → CANCELLED"
          - "Account.outstanding_cents / credit_available_cents recompute (order no longer counts)"
          - "lifecycle_status → CANCELLED"
      - from: CONFIRMED
        to: CONFIRMED
        trigger: "POST /orders/{order_id}/invoice (payment dimension only)"
        actor: AccountManager
        preconditions:
          - "Order lifecycle_status must be CONFIRMED or SHIPPED (ERR_ORDER_NOT_CONFIRMED)"
          - "payment_status must be UNPAID (ERR_PAYMENT_NOT_UNPAID)"
        side_effects:
          - "payment_status → INVOICED (parallel dimension; lifecycle_status unchanged)"
      - from: CONFIRMED
        to: CONFIRMED
        trigger: "POST /orders/{order_id}/pay (payment dimension only)"
        actor: Buyer
        preconditions:
          - "payment_status must be INVOICED (ERR_PAYMENT_NOT_INVOICED)"
        side_effects:
          - "payment_status → PAID (parallel dimension)"
          - "Account.outstanding_cents / credit_available_cents recompute (paid order no longer counts as outstanding)"

  - entity: Shipment
    initial_state: QUOTED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: QUOTED
        to: BOOKED
        trigger: "POST /shipments/{shipment_id}/book"
        actor: WarehouseOps
        preconditions:
          - "Shipment must be QUOTED (ERR_SHIPMENT_NOT_QUOTED)"
          - "Order (shipment.order_id) must be CONFIRMED (ERR_ORDER_NOT_CONFIRMED)"
        side_effects:
          - "final_freight_cents = freight_quote(variant=final) over ALLOCATED quantities"
          - "order.freight_cents = final_freight_cents; order total_cents recompute"
          - "order lifecycle_status CONFIRMED → SHIPPED; lines → SHIPPED"
      - from: BOOKED
        to: DELIVERED
        trigger: "POST /shipments/{shipment_id}/deliver"
        actor: WarehouseOps
        preconditions:
          - "Shipment must be BOOKED (ERR_SHIPMENT_NOT_BOOKED)"
        side_effects:
          - "delivered_at = logical clock now"
          - "order lifecycle_status SHIPPED → COMPLETED"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /shipments/{shipment_id}/cancel"
        actor: WarehouseOps
        preconditions:
          - "Shipment must be QUOTED or BOOKED (ERR_SHIPMENT_NOT_CANCELLABLE)"
        side_effects:
          - "status → CANCELLED (order freight_cents reset to 0 if this shipment had set it)"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /shipments/{shipment_id}/cancel"
        actor: WarehouseOps
        preconditions:
          - "Shipment must be QUOTED or BOOKED (ERR_SHIPMENT_NOT_CANCELLABLE)"
        side_effects:
          - "status → CANCELLED"

  - entity: ReturnAuthorization
    initial_state: REQUESTED
    terminal_states: [REFUNDED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /returns/{return_id}/approve"
        actor: WarehouseOps
        preconditions:
          - "RMA must be REQUESTED (ERR_RETURN_NOT_REQUESTED)"
          - "RMA must have >= 1 ReturnLine (ERR_RETURN_HAS_NO_LINES)"
        side_effects:
          - "per line: line_refund_cents & restock fee computed (restock_refund by condition)"
          - "restock_fee_cents = sum of per-line restock fees; refund_cents = sum of line_refund_cents"
          - "status → APPROVED"
      - from: APPROVED
        to: REQUESTED
        trigger: "POST /returns/{return_id}/revise"
        actor: WarehouseOps
        preconditions:
          - "RMA must be APPROVED (ERR_RETURN_NOT_APPROVED)"
        side_effects:
          - "branch/revert: refund_cents=0, restock_fee_cents=0, each line_refund_cents=0; status → REQUESTED"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /returns/{return_id}/reject"
        actor: WarehouseOps
        preconditions:
          - "RMA must be REQUESTED (ERR_RETURN_NOT_REQUESTED)"
        side_effects:
          - "status → REJECTED (no inventory or ledger change)"
      - from: APPROVED
        to: RECEIVED
        trigger: "POST /returns/{return_id}/receive"
        actor: WarehouseOps
        preconditions:
          - "RMA must be APPROVED (ERR_RETURN_NOT_APPROVED)"
        side_effects:
          - "CASCADE per line: line.status → RECEIVED; Product.on_hand_qty += line.quantity"
          - "each affected Product: recompute needs_reorder / reorder_suggested_qty (cascade hop 3)"
          - "status → RECEIVED"
      - from: RECEIVED
        to: REFUNDED
        trigger: "POST /returns/{return_id}/refund"
        actor: WarehouseOps
        preconditions:
          - "RMA must be RECEIVED (ERR_RETURN_NOT_RECEIVED)"
        side_effects:
          - "status → REFUNDED"
          - "owning Account.outstanding_cents / credit_available_cents recompute (refund_cents now credited against outstanding)"

  - entity: DeliveryAppointment
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /delivery-appointments/{appointment_id}/cancel"
        actor: WarehouseOps
        preconditions:
          - "Appointment must be SCHEDULED (ERR_APPOINTMENT_NOT_SCHEDULED)"
        side_effects:
          - "status → CANCELLED (frees the dock interval for later bookings)"

  - entity: InstallJob
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /install-jobs/{job_id}/cancel"
        actor: WarehouseOps
        preconditions:
          - "Job must be SCHEDULED (ERR_JOB_NOT_SCHEDULED)"
        side_effects:
          - "status → CANCELLED (frees the crew interval)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: order-confirm-stale-account
    parent_entity: Account
    write_endpoint: "POST /orders/{order_id}/confirm"
    occ_field: "expected_account_version"
    description: |
      Confirming an order reserves credit against the owning Account, so it must
      observe a fresh Account.version. When another order has already been
      confirmed (or a certificate approved/expired) against the same account
      since the client last read it, the account's version has advanced and its
      credit_available_cents has moved; a confirm still carrying the prior
      expected_account_version is rejected as stale. This resolves the case
      where a second confirmation legitimately supersedes the client's stale
      view of remaining credit.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: line_tier_pricing
    trigger: "POST /orders/{order_id}/lines (line create); recomputed on order confirm"
    algorithm: tiered_pricing
    formula: |
      Given quantity q and Product {unit_price_cents u, case_qty c,
      case_price_cents cp, pallet_case_qty pc, pallet_price_cents pp}:
        units_per_pallet = c * pc
        full_pallets = q // units_per_pallet
        rem1         = q %  units_per_pallet
        full_cases   = rem1 // c
        eaches       = rem1 %  c
        line_subtotal_cents = full_pallets*pp + full_cases*cp + eaches*u
        pricing_tier = PALLET if full_pallets > 0
                       else CASE if full_cases > 0
                       else EACH
      Boundary: quantity >= case_qty (with full_pallets==0) yields CASE; a
      quantity of exactly case_qty is one full case (CASE), quantity case_qty-1
      is all eaches (EACH).
    input_set: "the single OrderLine being priced; no cross-line aggregation"
    constants: {}
    precision: "integer cents; no rounding needed (all terms integer)"

  - name: order_tax
    trigger: "order confirm; recomputed whenever lines change while DRAFT"
    algorithm: aggregation
    formula: |
      If owning Account.tax_exempt_status == CERTIFIED at confirm time:
        tax_cents = 0
      Else, ROUND-PER-LINE-THEN-SUM (pinned order):
        tax_cents = sum over each non-CANCELLED line whose Product.taxable == true of
                    round_half_up(line.line_subtotal_cents * Account.tax_rate)
      The rounding order is fixed: each taxable line is rounded to whole cents
      FIRST, then the rounded per-line taxes are summed. Sum-then-round is
      explicitly NOT used and may yield a different total.
    input_set: "non-CANCELLED taxable lines of the order; account tax_rate snapshot"
    constants: {}
    precision: "round_half_up to whole cents, per line, before summing"

  - name: freight_quote
    trigger: "Shipment create (provisional) and Shipment book (final)"
    algorithm: threshold
    formula: |
      weight(qty_source) = sum over non-CANCELLED, non-DROPSHIP lines of
                           (qty_source(line) * Product.weight_lbs_per_unit)
        provisional variant: qty_source(line) = line.quantity      (ordered)
        final       variant: qty_source(line) = line.allocated_qty (shipped)
      If weight <= PARCEL_MAX_LBS:
        shipping_mode = PARCEL
        base = PARCEL_BASE_CENTS + round_half_up(PARCEL_RATE_CPL * weight)
        if merchandise_subtotal_cents >= FREE_FREIGHT_THRESHOLD_CENTS: base = 0
        freight = base      (liftgate fee never applies to PARCEL)
      Else:
        shipping_mode = LTL
        freight = LTL_BASE_CENTS + round_half_up(LTL_RATE_CPL * weight)
                  + (LIFTGATE_FEE_CENTS if liftgate_required else 0)
    input_set: "provisional over ordered quantities; final over allocated quantities"
    constants:
      PARCEL_MAX_LBS: 150
      PARCEL_BASE_CENTS: 1200
      PARCEL_RATE_CPL: 50
      LTL_BASE_CENTS: 7500
      LTL_RATE_CPL: 30
      LIFTGATE_FEE_CENTS: 4500
      FREE_FREIGHT_THRESHOLD_CENTS: 250000
    precision: "round_half_up to whole cents"
    variants:
      - name: provisional
        when: "Shipment create (QUOTED); freight_quote_cents"
        difference: "weighs ORDERED quantities (includes backordered eaches)"
      - name: final
        when: "Shipment book (BOOKED); final_freight_cents"
        difference: "weighs ALLOCATED quantities only; diverges from provisional whenever any line is partially/fully backordered"

  - name: restock_refund
    trigger: "RMA approve (POST /returns/{return_id}/approve)"
    algorithm: weighted_scoring
    formula: |
      For each ReturnLine:
        merch_value = line.quantity * Product.unit_price_cents
        pct = SEALED_RESTOCK_PCT if condition == SEALED
              else OPENED_RESTOCK_PCT   (condition == OPENED)
        restock_fee = round_half_up(merch_value * pct)
        line_refund_cents = merch_value - restock_fee
      RMA.restock_fee_cents = sum of per-line restock_fee
      RMA.refund_cents      = sum of line_refund_cents
    input_set: "all ReturnLines of the RMA; unit_price_cents (EACH price) as the return basis"
    constants:
      SEALED_RESTOCK_PCT: 0.15
      OPENED_RESTOCK_PCT: 0.25
    precision: "round_half_up to whole cents, per line"
    variants:
      - name: sealed
        when: "ReturnLine.condition == SEALED"
        difference: "15% restock fee → larger refund for identical merch value"
      - name: opened
        when: "ReturnLine.condition == OPENED"
        difference: "25% restock fee → smaller refund for identical merch value"

  - name: account_outstanding
    trigger: "order confirm/cancel/pay, RMA refund, and on read of Account"
    algorithm: aggregation
    formula: |
      outstanding_cents =
        sum of order.total_cents for this account's orders whose
          lifecycle_status IN {CONFIRMED, SHIPPED, COMPLETED}
          AND payment_status IN {UNPAID, INVOICED}
        minus sum of return.refund_cents for this account's returns whose
          status == REFUNDED
      credit_available_cents = credit_limit_cents - outstanding_cents
    input_set: "account's orders in the named states and REFUNDED returns"
    constants: {}
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Buyer acting on an Account/Order/Return must own it: X-User-ID equals the resource's account_id (orders/returns/certs) or the order's account_id"
    error_id: ERR_NOT_ACCOUNT_OWNER
    http_status: 403
    applies_to: "Buyer-scoped writes: create/confirm/cancel/pay order, create/resubmit cert, create return, add return line"

  - priority: 4
    category: existence
    check: "All path/body resource IDs exist (validated left-to-right)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints referencing a resource id

  - priority: 5
    category: state
    check: "Target resource is in a state permitting this transition"
    error_id: "varies (ERR_ORDER_NOT_DRAFT, ERR_RETURN_NOT_REQUESTED, ERR_SHIPMENT_NOT_QUOTED, ERR_CERT_NOT_SUBMITTED, ...)"
    http_status: 409
    applies_to: state-transition endpoints

  - priority: 6
    category: business_referential
    check: "A ReturnLine's product must appear on the RMA's original order"
    error_id: ERR_PRODUCT_NOT_IN_ORDER
    http_status: 422
    applies_to: "POST /returns/{return_id}/lines"

  - priority: 7
    category: business_temporal
    check: "Time-window rules: return opened within RETURN_WINDOW_DAYS=30 days of shipment.delivered_at; install window_start >= confirmed_at + (max equipment lead_time_days over the order's EQUIPMENT lines) days; window_end > window_start"
    error_id: "ERR_RETURN_WINDOW_EXPIRED | ERR_LEAD_TIME_NOT_ELAPSED | ERR_INVALID_TIME_WINDOW"
    http_status: 422
    applies_to: "POST /orders/{id}/returns, POST /install-jobs, POST /delivery-appointments"

  - priority: 8
    category: business_constraint
    check: "Aggregate/geometry constraints: return quantity <= ordered quantity; order has >= 1 line to confirm; RMA has >= 1 line to approve; DOCK overlap uses half-open [window_start, window_end) intersection among SCHEDULED appointments on the same dock (adjacency where a.end == b.start is allowed, capacity 1); CREW conflict rejects when the gap to any SCHEDULED job on the same crew is < INSTALL_BUFFER_MINUTES=60 (i.e., new.window_start < existing.window_end + 60min AND existing.window_start < new.window_end + 60min); install order has an EQUIPMENT line"
    error_id: "ERR_RETURN_QTY_EXCEEDS_ORDERED | ERR_ORDER_HAS_NO_LINES | ERR_RETURN_HAS_NO_LINES | ERR_DOCK_DOUBLE_BOOKED | ERR_CREW_BUFFER_CONFLICT | ERR_NO_EQUIPMENT_LINE"
    http_status: "409 or 422 per error"
    applies_to: "return line add, order confirm, return approve, delivery-appointments, install-jobs"

  - priority: 9
    category: state
    check: "Cross-entity account state: confirming an order requires owning Account.status == ACTIVE"
    error_id: ERR_ACCOUNT_SUSPENDED
    http_status: 409
    applies_to: "POST /orders/{order_id}/confirm"

  - priority: 10
    category: business_fiscal
    check: "Order total_cents (subtotal + tax) must be <= Account.credit_available_cents at confirm"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /orders/{order_id}/confirm"

  - priority: 11
    category: state
    check: "OCC: expected_account_version must equal current Account.version"
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /orders/{order_id}/confirm"

  - priority: 12
    category: business_constraint
    check: "Enum/type/range validation of input fields (unknown enum, negative qty, case_qty < 1, etc.)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all create/update endpoints

