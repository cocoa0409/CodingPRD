        grounds:
          - calculations.prize_award_generation
          - calculations.place_and_tie_assignment
          - calculations.purse_and_budget_ledger
          - entities.RaceResult.fields.official_seconds
          - entities.RaceEdition.fields.purse_allocated_cents
        distinguishing_aspect: >-
          A THIRD metric (the empty-set / zero-cardinality boundary, plus the gun-versus-net selector)
          on a THIRD endpoint (POST /race-editions/{id}/compute-awards): the only finisher is a
          WHEELCHAIR athlete while every PurseLine is an OVERALL MALE line, and because OVERALL covers
          only ELITE and SUB_ELITE, compute-awards must succeed with ZERO awards rather than error or
          pay the wheelchair athlete from the overall pool; simultaneously the WHEELCHAIR result's
          official_seconds must be the NET time 7400, not the gun time 7500. Falsifiable in one
          sentence: an implementation that treats an empty award set as a failure returns a 4xx, one
          that ignores the division scope of OVERALL creates a 2,000,000 award, and one that uses gun
          time for every division reports official_seconds == 7500.
