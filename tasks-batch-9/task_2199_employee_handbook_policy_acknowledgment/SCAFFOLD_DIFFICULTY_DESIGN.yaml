          A different dependency direction and a mutable gate: here the blocking state is on the
          PARENT Employee of an already-minted assignment, and it is reversible. The assignment
          was legitimately minted while the assignee was ACTIVE; a later termination freezes
          delivery at UNDELIVERED, and reinstating the employee to ACTIVE unblocks the identical
          request. Contrast with the translation instance, where the gate is a one-way publication.
