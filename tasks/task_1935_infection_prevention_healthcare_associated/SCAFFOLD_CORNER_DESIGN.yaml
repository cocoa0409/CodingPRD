- section: validations
  instances:
  - name: missing_auth_header_rejected_before_any_business_logic
    claim_type: violation_to_error
    grounds:
    - validations[priority=1]
    - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
    distinguishing_aspect: A request with no X-User-ID/X-User-Role fails priority 1 even when every business rule would pass.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /api/facilities
        payload:
          name: F1
          nhsn_org_id: ORG-1
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
        as: ''
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER and HTTP 400 (no headers sent)
  - name: schema_invalid_enum_and_conditional_required
    claim_type: violation_to_error
    grounds:
    - validations[priority=3]
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: 'Two schema-tier failures: (a) invalid case_type enum; (b) SSI case without surgical_procedure_id (conditional required); both ERR_INVALID_REQUEST 400.'
    test_recipe:
      setup:
      - facility + unit + admitted patient
      setup_api_calls:
      - call: POST /api/facilities
        payload:
          name: F1
          nhsn_org_id: ORG-1
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
        as: PlatformAdmin
        captures:
          fac_id: $.data.id
      - call: POST /api/units
        payload:
          facility_id: ${fac_id}
          name: ICU-V1
          unit_type: ICU
          nhsn_location_code: IV1
        as: PlatformAdmin
        captures:
          unit_id: $.data.id
      - call: POST /api/patients
        payload:
          mrn: MRN-V1
          admitted_at: '2026-08-01T08:00:00Z'
          unit_id: ${unit_id}
        as: UnitNurseManager
        captures:
          pat_id: $.data.id
      trigger:
      - call: POST /api/infection-cases
        payload:
          patient_id: ${pat_id}
          case_type: VAP
          suspected_organism: E. coli
          first_positive_specimen_at: '2026-08-04T10:00:00Z'
        as: InfectionPreventionist
        captures:
          err1: $.data.error_id
      - call: POST /api/infection-cases
        payload:
          patient_id: ${pat_id}
          case_type: SSI
          suspected_organism: E. coli
          first_positive_specimen_at: '2026-08-04T10:00:00Z'
        as: InfectionPreventionist
        captures:
          err2: $.data.error_id
      assert:
      - err1 == ERR_INVALID_REQUEST (VAP is not a declared case_type enum member)
      - err2 == ERR_INVALID_REQUEST (SSI requires surgical_procedure_id)
  - name: episode_patient_mismatch_pure_referential
    claim_type: violation_to_error
    grounds:
    - validations[priority=8]
    - errors[ERR_EPISODE_PATIENT_MISMATCH]
    distinguishing_aspect: Without any RIT conflict in play, linking another patient's device episode yields ERR_EPISODE_PATIENT_MISMATCH (422) — the pure referential tier (contrast §1.8 temporal_beats_referential
      where temporal shadows it).
