# =============================================================================
# Task 1192: Auto Glass Claim Network Administration
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe: every testable claim in SCAFFOLD.yaml 1.1-1.7 not already
# covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml. Section/claim_type names follow
# references/claim-extraction-guide.md. Harder-than-expert breadth.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section: entities (Table 1 claims)
  # ===========================================================================
  - section: entities
    instances:
      - name: policyholder_creation_success
        claim_type: creation
        grounds: ["entities.Policyholder", "endpoints[POST /policyholders\"]"]
        distinguishing_aspect: "POST /policyholders with all required fields returns 201 with system fields initialized: status ACTIVE, fraud_score 0, no_show_count 0, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /policyholders"
              payload: { full_name: "Create Ok", email: "cok@x.com", phone: "555-1001", state_code: "FL" }
              as: NetworkAdmin
              captures: { ph_id: $.data.id }
          assert:
            - "response 201; Policyholder.${ph_id}.status == ACTIVE and fraud_score == 0 and no_show_count == 0 and version == 1"
            - "id is a server-minted UUID; created_at/updated_at stamped from logical clock default 2026-05-01T00:00:00Z"

      - name: policyholder_missing_required_field
        claim_type: required_fields
        grounds: ["entities.Policyholder.fields.email", "errors[ERR_INVALID_REQUEST\"]"]
        distinguishing_aspect: "Omitting required field email on POST /policyholders fails with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /policyholders"
              payload: { full_name: "No Email", phone: "555-1002", state_code: "FL" }
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (400)"

      - name: policyholder_get_not_found
        claim_type: not_found
        grounds: ["entities.Policyholder", "errors[ERR_POLICYHOLDER_NOT_FOUND\"]"]
        distinguishing_aspect: "GET /policyholders/{id} with a nonexistent UUID returns ERR_POLICYHOLDER_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /policyholders/00000000-0000-0000-0000-000000000000"
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_POLICYHOLDER_NOT_FOUND (404)"

      - name: state_regulation_unique_state_code
        claim_type: type_constraints
        grounds: ["entities.StateRegulation.fields.state_code", "errors[ERR_DUPLICATE_STATE_REGULATION\"]"]
        distinguishing_aspect: "A second StateRegulation for the same state_code is rejected with ERR_DUPLICATE_STATE_REGULATION (409)."
        test_recipe:
          setup: ["FL regulation already created"]
          setup_api_calls:
            - call: "POST /state-regulations"
              payload: { state_code: "FL", zero_deductible_windshield: true, glass_sales_tax_rate_bp: 0 }
              as: NetworkAdmin
          trigger:
            - call: "POST /state-regulations"
              payload: { state_code: "FL", zero_deductible_windshield: false, glass_sales_tax_rate_bp: 600 }
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_STATE_REGULATION (409)"
            - "the original FL regulation remains the only row (GET /state-regulations?state_code=FL returns total_count 1)"

      - name: state_regulation_max_deductible_default_null
        claim_type: defaults
        grounds: ["entities.StateRegulation.fields.max_deductible_cents"]
        distinguishing_aspect: "Omitting max_deductible_cents on creation leaves it null (no cap)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /state-regulations"
              payload: { state_code: "GA", zero_deductible_windshield: false, glass_sales_tax_rate_bp: 400 }
              as: NetworkAdmin
              captures: { reg_id: $.data.id }
          assert:
            - "StateRegulation.${reg_id}.max_deductible_cents is null"

      - name: policy_oem_endorsement_default_false
        claim_type: defaults
        grounds: ["entities.Policy.fields.oem_endorsement"]
        distinguishing_aspect: "Omitting oem_endorsement on policy creation applies default false."
        test_recipe:
          setup: ["policyholder exists"]
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { full_name: "Def Oem", email: "defo@x.com", phone: "555-1003", state_code: "FL" }
              as: NetworkAdmin
              captures: { ph_id: $.data.id }
          trigger:
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", policy_number: "PN-DEF-1", state_code: "FL", coverage_type: "COMPREHENSIVE", deductible_cents: 25000, effective_start_date: "2026-01-01", effective_end_date: "2027-01-01" }
              as: NetworkAdmin
              captures: { pol_id: $.data.id }
          assert:
            - "Policy.${pol_id}.oem_endorsement == false and status == ACTIVE"

      - name: policy_invalid_coverage_type_enum
        claim_type: type_constraints
        grounds: ["entities.Policy.fields.coverage_type", "errors[ERR_INVALID_REQUEST\"]"]
        distinguishing_aspect: "coverage_type outside {COMPREHENSIVE, LIABILITY} fails with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["policyholder exists"]
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { full_name: "Enum Bad", email: "enum@x.com", phone: "555-1004", state_code: "FL" }
              as: NetworkAdmin
              captures: { ph_id: $.data.id }
          trigger:
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", policy_number: "PN-ENUM-1", state_code: "FL", coverage_type: "FULL_GLASS", deductible_cents: 25000, effective_start_date: "2026-01-01", effective_end_date: "2027-01-01" }
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (400)"

      - name: glass_shop_creation_initializes_computed_fields
        claim_type: computed_fields
        grounds: ["entities.GlassShop.fields.warranty_strike_count", "entities.GlassShop.fields.rolling_audit_score"]
        distinguishing_aspect: "Shop creation initializes computed fields: network_status ACTIVE, warranty_strike_count 0, rolling_audit_score 100, period_close_audit_score 100; client-supplied computed values are ignored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /glass-shops"
              payload: { shop_name: "Init Shop", state_code: "FL", service_zip_prefixes: ["336"], mobile_capable: true, adas_certified: true, oem_certified: true, agreement_tier: "PREFERRED", bay_count: 3, mobile_unit_count: 2 }
              as: NetworkAdmin
              captures: { shop_id: $.data.id }
          assert:
            - "GlassShop.${shop_id}.network_status == ACTIVE (system-initialized)"
            - "GlassShop.${shop_id}.warranty_strike_count == 0 (computed default; not settable via create payload)"
            - "GlassShop.${shop_id}.rolling_audit_score == 100 and period_close_audit_score == 100 (computed defaults)"

      - name: glass_shop_operating_minutes_default
        claim_type: defaults
        grounds: ["entities.GlassShop.fields.operating_minutes_per_day"]
        distinguishing_aspect: "Omitting operating_minutes_per_day applies default 480."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /glass-shops"
              payload: { shop_name: "Def Min", state_code: "FL", service_zip_prefixes: ["336"], mobile_capable: false, adas_certified: false, oem_certified: false, agreement_tier: "STANDARD", bay_count: 1, mobile_unit_count: 0 }
              as: NetworkAdmin
              captures: { shop_id: $.data.id }
          assert:
            - "GlassShop.${shop_id}.operating_minutes_per_day == 480"

      - name: part_catalog_entry_discontinue_patch
        claim_type: valid_transition
        grounds: ["entities.PartCatalogEntry.fields.status", "endpoints[PATCH /part-catalog-entries/{id}\"]"]
        distinguishing_aspect: "PATCH with status DISCONTINUED flips the entry; increments version by 1."
        test_recipe:
          setup: ["catalog entry exists, AVAILABLE"]
          setup_api_calls:
            - call: "POST /part-catalog-entries"
              payload: { part_number: "AM-DISC-1", part_description: "disc part", part_category: "SIDE_GLASS", part_origin: "AFTERMARKET", nags_list_price_cents: 40000 }
              as: NetworkAdmin
              captures: { part_id: $.data.id }
          trigger:
            - call: "PATCH /part-catalog-entries/${part_id}"
              payload: { status: "DISCONTINUED" }
              as: NetworkAdmin
          assert:
            - "PartCatalogEntry.${part_id}.status == DISCONTINUED and version == 2"

      - name: claim_intake_sets_policyholder_from_header
        claim_type: system_fields
        grounds: ["entities.Claim.fields.policyholder_id"]
        distinguishing_aspect: "POST /claims sets policyholder_id from X-User-ID, not from any body field; body cannot forge ownership."
        test_recipe:
          setup: ["FL regulation; policyholder PA with COMPREHENSIVE policy"]
          setup_api_calls:
            - call: "POST /state-regulations"
              payload: { state_code: "FL", zero_deductible_windshield: false, glass_sales_tax_rate_bp: 0 }
              as: NetworkAdmin
            - call: "POST /policyholders"
              payload: { full_name: "Hdr Owner", email: "hdr@x.com", phone: "555-1005", state_code: "FL" }
              as: NetworkAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", policy_number: "PN-HDR-1", state_code: "FL", coverage_type: "COMPREHENSIVE", deductible_cents: 50000, effective_start_date: "2026-01-01", effective_end_date: "2027-01-01" }
              as: NetworkAdmin
              captures: { pol_id: $.data.id }
          trigger:
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", incident_state_code: "FL", service_zip_code: "33601", part_category: "WINDSHIELD", loss_date: "2026-04-15", description: "hdr claim", requires_adas_calibration: false, estimated_repair_cost_cents: 80000 }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { claim_id: $.data.id }
          assert:
            - "Claim.${claim_id}.policyholder_id == ${ph_id} (policyholder_id is system-set from X-User-ID; the 1.5 input schema for POST /claims does not accept a body policyholder_id)"

      - name: claim_get_not_found
        claim_type: not_found
        grounds: ["entities.Claim", "errors[ERR_CLAIM_NOT_FOUND\"]"]
        distinguishing_aspect: "GET /claims/{id} with nonexistent UUID returns ERR_CLAIM_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /claims/00000000-0000-0000-0000-000000000000"
              as: ClaimAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CLAIM_NOT_FOUND (404)"

      - name: choice_disclosure_record_immutable
        claim_type: immutability
        grounds: ["entities.ChoiceDisclosureRecord"]
        distinguishing_aspect: "ChoiceDisclosureRecord has common_fields false: it carries id and created_at only, no version field, and no update/delete endpoint exists in 1.5 (append-only audit record)."
        test_recipe:
          setup: ["FL regulation; policyholder + policy; claim SUBMITTED"]
          setup_api_calls:
            - call: "POST /state-regulations"
              payload: { state_code: "FL", zero_deductible_windshield: false, glass_sales_tax_rate_bp: 0 }
              as: NetworkAdmin
            - call: "POST /policyholders"
              payload: { full_name: "Imm Rec", email: "imm@x.com", phone: "555-1006", state_code: "FL" }
              as: NetworkAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", policy_number: "PN-IMM-1", state_code: "FL", coverage_type: "COMPREHENSIVE", deductible_cents: 50000, effective_start_date: "2026-01-01", effective_end_date: "2027-01-01" }
              as: NetworkAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", incident_state_code: "FL", service_zip_code: "33601", part_category: "WINDSHIELD", loss_date: "2026-04-15", description: "imm claim", requires_adas_calibration: false, estimated_repair_cost_cents: 80000 }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/choice-disclosures"
              payload: { disclosure_channel: "PHONE", shop_solicited: false, informed_of_network_options: true }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { rec_id: $.data.id }
          assert:
            - "ChoiceDisclosureRecord.${rec_id} has no version field in the response (common_fields false)"
            - "GET /claims/${claim_id}/choice-disclosures returns the record with claim_id == ${claim_id}"

      - name: invoice_line_item_quantity_must_be_positive
        claim_type: type_constraints
        grounds: ["entities.InvoiceLineItem.fields.quantity", "errors[ERR_INVALID_REQUEST\"]"]
        distinguishing_aspect: "quantity 0 on an invoice line violates the >= 1 constraint -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["FL regulation; policyholder + policy; shop; claim completed (work order COMPLETED)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /state-regulations"
              payload: { state_code: "FL", zero_deductible_windshield: false, glass_sales_tax_rate_bp: 0 }
              as: NetworkAdmin
            - call: "POST /policyholders"
              payload: { full_name: "Qty Zero", email: "qty@x.com", phone: "555-1007", state_code: "FL" }
              as: NetworkAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", policy_number: "PN-QTY-1", state_code: "FL", coverage_type: "COMPREHENSIVE", deductible_cents: 50000, effective_start_date: "2026-01-01", effective_end_date: "2027-01-01" }
              as: NetworkAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /glass-shops"
              payload: { shop_name: "Qty Shop", state_code: "FL", service_zip_prefixes: ["336"], mobile_capable: false, adas_certified: false, oem_certified: false, agreement_tier: "STANDARD", bay_count: 1, mobile_unit_count: 0 }
              as: NetworkAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /part-catalog-entries"
              payload: { part_number: "AM-WS-1", part_description: "AM windshield", part_category: "WINDSHIELD", part_origin: "AFTERMARKET", nags_list_price_cents: 100000 }
              as: NetworkAdmin
              captures: { part_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", incident_state_code: "FL", service_zip_code: "33601", part_category: "WINDSHIELD", loss_date: "2026-04-15", description: "qty claim", requires_adas_calibration: false, estimated_repair_cost_cents: 90000 }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/choice-disclosures"
              payload: { disclosure_channel: "PHONE", shop_solicited: false, informed_of_network_options: true }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /claims/${claim_id}/verify-coverage"
              payload: {}
              as: ClaimAdjuster
              captures: { claim_v: $.data.version }
            - call: "POST /claims/${claim_id}/routing-decisions"
              payload: { expected_claim_version: "${claim_v}" }
              as: ClaimAdjuster
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/accept"
              payload: {}
              as: ShopOperator
              as_user_id: "${shop_id}"
              captures: { wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { service_mode: "IN_SHOP", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T11:00:00Z", expected_work_order_version: "${wo_v}" }
              as: ShopOperator
              as_user_id: "${shop_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T12:00:00Z" }
              as: NetworkAdmin
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: ShopOperator
              as_user_id: "${shop_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/invoices"
              payload: { line_items: [ { part_catalog_entry_id: "${part_id}", line_type: "PART", quantity: 0, origin_claimed: "AFTERMARKET", unit_price_cents: 95000 } ] }
              as: ShopOperator
              as_user_id: "${shop_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (400); no invoice created"

      - name: policy_get_not_found
        claim_type: not_found
        grounds: ["entities.Policy", "errors[ERR_POLICY_NOT_FOUND\"]"]
        distinguishing_aspect: "GET /policies/{id} with nonexistent UUID returns ERR_POLICY_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /policies/00000000-0000-0000-0000-000000000000"
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_POLICY_NOT_FOUND (404)"

      - name: shop_get_not_found
        claim_type: not_found
        grounds: ["entities.GlassShop", "errors[ERR_SHOP_NOT_FOUND\"]"]
        distinguishing_aspect: "GET /glass-shops/{id} with nonexistent UUID returns ERR_SHOP_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /glass-shops/00000000-0000-0000-0000-000000000000"
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SHOP_NOT_FOUND (404)"

      - name: part_get_not_found
        claim_type: not_found
        grounds: ["entities.PartCatalogEntry", "errors[ERR_PART_NOT_FOUND\"]"]
        distinguishing_aspect: "GET /part-catalog-entries/{id} with nonexistent UUID returns ERR_PART_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /part-catalog-entries/00000000-0000-0000-0000-000000000000"
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PART_NOT_FOUND (404)"

      - name: work_order_get_not_found
        claim_type: not_found
        grounds: ["entities.WorkOrder", "errors[ERR_WORK_ORDER_NOT_FOUND\"]"]
        distinguishing_aspect: "GET /work-orders/{id} with nonexistent UUID returns ERR_WORK_ORDER_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /work-orders/00000000-0000-0000-0000-000000000000"
              as: ClaimAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_WORK_ORDER_NOT_FOUND (404)"

      - name: invoice_get_not_found
        claim_type: not_found
        grounds: ["entities.Invoice", "errors[ERR_INVOICE_NOT_FOUND\"]"]
        distinguishing_aspect: "GET /invoices/{id} with nonexistent UUID returns ERR_INVOICE_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /invoices/00000000-0000-0000-0000-000000000000"
              as: NetworkAuditor
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVOICE_NOT_FOUND (404)"

      - name: calibration_event_verify_not_found
        claim_type: not_found
        grounds: ["entities.CalibrationEvent", "errors[ERR_CALIBRATION_EVENT_NOT_FOUND\"]"]
        distinguishing_aspect: "POST /calibration-events/{id}/verify with nonexistent UUID returns ERR_CALIBRATION_EVENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /calibration-events/00000000-0000-0000-0000-000000000000/verify"
              payload: { outcome: "VERIFIED", report_reference: "X" }
              as: ShopOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CALIBRATION_EVENT_NOT_FOUND (404)"

      - name: warranty_claim_get_not_found
        claim_type: not_found
        grounds: ["entities.WarrantyClaim", "errors[ERR_WARRANTY_CLAIM_NOT_FOUND\"]"]
        distinguishing_aspect: "GET /warranty-claims/{id} with nonexistent UUID returns ERR_WARRANTY_CLAIM_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /warranty-claims/00000000-0000-0000-0000-000000000000"
              as: NetworkAuditor
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_WARRANTY_CLAIM_NOT_FOUND (404)"

      - name: fraud_alert_get_not_found
        claim_type: not_found
        grounds: ["entities.FraudAlert", "errors[ERR_FRAUD_ALERT_NOT_FOUND\"]"]
        distinguishing_aspect: "GET /fraud-alerts/{id} with nonexistent UUID returns ERR_FRAUD_ALERT_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /fraud-alerts/00000000-0000-0000-0000-000000000000"
              as: FraudInvestigator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FRAUD_ALERT_NOT_FOUND (404)"

      - name: invoice_line_item_part_fk_not_found
        claim_type: parent_relationships
        grounds: ["entities.InvoiceLineItem.fields.part_catalog_entry_id", "errors[ERR_PART_NOT_FOUND\"]"]
        distinguishing_aspect: "An invoice PART line referencing a nonexistent part_catalog_entry_id fails with ERR_PART_NOT_FOUND (404) — FK integrity on cross-aggregate reference."
        test_recipe:
          setup: ["FL regulation; policyholder + policy; shop; claim completed"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /state-regulations"
              payload: { state_code: "FL", zero_deductible_windshield: false, glass_sales_tax_rate_bp: 0 }
              as: NetworkAdmin
            - call: "POST /policyholders"
              payload: { full_name: "FK Miss", email: "fk@x.com", phone: "555-1008", state_code: "FL" }
              as: NetworkAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", policy_number: "PN-FK-1", state_code: "FL", coverage_type: "COMPREHENSIVE", deductible_cents: 50000, effective_start_date: "2026-01-01", effective_end_date: "2027-01-01" }
              as: NetworkAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /glass-shops"
              payload: { shop_name: "FK Shop", state_code: "FL", service_zip_prefixes: ["336"], mobile_capable: false, adas_certified: false, oem_certified: false, agreement_tier: "STANDARD", bay_count: 1, mobile_unit_count: 0 }
              as: NetworkAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", incident_state_code: "FL", service_zip_code: "33601", part_category: "WINDSHIELD", loss_date: "2026-04-15", description: "fk claim", requires_adas_calibration: false, estimated_repair_cost_cents: 90000 }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/choice-disclosures"
