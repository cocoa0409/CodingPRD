              payload: { qei_id: "${qei_id}", qalicb_id: "${qalicb_id}", loan_class: "A", principal_cents: 85000000 }
              as: CDESponsor
              as_user_id: "${cde_id}"
          trigger:
            - call: "GET /nmtc/cdes/00000000-0000-4000-8000-0000000000c1"
              payload: {}
              as: CertifyingAgency
            - call: "GET /nmtc/investment-funds/00000000-0000-4000-8000-0000000000c1"
              payload: {}
              as: CertifyingAgency
            - call: "GET /nmtc/qlicis/00000000-0000-4000-8000-0000000000c1"
              payload: {}
              as: CertifyingAgency
            - call: "GET /nmtc/reinvestment-obligations/00000000-0000-4000-8000-0000000000c1"
              payload: {}
              as: CertifyingAgency
            - call: "GET /nmtc/community-benefits-agreements/00000000-0000-4000-8000-0000000000c1"
              payload: {}
              as: CertifyingAgency
            - call: "GET /nmtc/unwind-transactions/00000000-0000-4000-8000-0000000000c1"
              payload: {}
              as: CertifyingAgency
          assert:
            - "Every call returns HTTP 404 with response_type == \"error\" and a non-empty data.message"
            - "GET /nmtc/cdes/{unknown} returns error_id == \"ERR_CDE_NOT_FOUND\""
            - "GET /nmtc/investment-funds/{unknown} returns error_id == \"ERR_INVESTMENT_FUND_NOT_FOUND\""
            - "GET /nmtc/qlicis/{unknown} returns error_id == \"ERR_QLICI_NOT_FOUND\""
            - "GET /nmtc/reinvestment-obligations/{unknown} returns error_id == \"ERR_REINVESTMENT_OBLIGATION_NOT_FOUND\" — no obligation exists at all in this fixture, and the code is still the obligation-specific one"
            - "GET /nmtc/community-benefits-agreements/{unknown} returns error_id == \"ERR_CBA_NOT_FOUND\""
            - "GET /nmtc/unwind-transactions/{unknown} returns error_id == \"ERR_UNWIND_NOT_FOUND\""
            - "The SAME UUID produces six DIFFERENT error ids, proving the code is selected from the path collection rather than from a global id lookup"

  # ===========================================================================
  - section: rbac
