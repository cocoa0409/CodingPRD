            - "HTTP 200 and Funder.${funder_id}.status == WITHDRAWN"
            - "FunderCommitment.${tranche_one}.status == EXPIRED"
            - "FunderCommitment.${tranche_two}.status == EXPIRED"
            - "Funder.${funder_id}.available_capital_cents == 0 and encumbered_capital_cents == 0"

