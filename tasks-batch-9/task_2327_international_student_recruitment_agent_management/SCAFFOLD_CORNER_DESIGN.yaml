            - 'second REINSTATE: HTTP 200, AgentContract.${c1_id}.status == "ACTIVE" and .suspension_reason == null'
            - 'TerritoryAssignment.${t1_id}.status is still "RELEASED" (territories released by a suspension are never restored)'

