  - rule_id: cross_entity_state_dependency
    instances:
      - name: used_reactivation_requires_dealer_enrollment_and_dead_radio
        grounds:
          - validations[priority=10]
          - entities.Dealer.fields.used_program_enrolled
          - entities.Radio.fields.activation_status
        distinguishing_aspect: |
          Entity pair: Dealer -> Radio reactivation (used-dealer program).
          POST /api/v1/dealers/{id}/used-reactivations is legal only when the DEALER's
          used_program_enrolled == true AND the RADIO's activation_status ==
          DEACTIVATED; flipping either entity's state flips the outcome.
        test_recipe:
          setup:
            - "dealer D1 not enrolled; radio RD DEACTIVATED (trial expired, deactivate acked); trial plan TPU; customer CB"
          setup_api_calls:
            - call: "POST /api/v1/dealers"
              payload: { dealer_code: "DLR1", name: "Dealer One", used_program_enrolled: false }
              as: PlatformAdmin
              captures: { dlr1_id: $.data.id }
            - call: "POST /api/v1/customers"
              payload: { email: "cb@x.com", full_name: "C Buyer", household_size: 1 }
              as: Anonymous
              captures: { cb_id: $.data.id }
            - call: "POST /api/v1/customers"
              payload: { email: "cb2@x.com", full_name: "C Buyer2", household_size: 1 }
