          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "PERMANENTLY_CLOSED is the declared terminal state of Establishment.unit_status, so a follow-up status change to OPERATING returns ERR_ALREADY_TERMINAL (409) and the row keeps unit_status PERMANENTLY_CLOSED."
        test_recipe:
          setup:
            - "One OPERATING unit with no boards and no enforcement history."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "ID-MIN", name: "Idaho", preemption_mode: "PREEMPTED" }
