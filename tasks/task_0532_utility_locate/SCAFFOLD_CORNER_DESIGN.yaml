              payload: { ticket_id: "${tid}" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { note_id: $.data.0.id }
            - call: "POST /positive-responses"
              payload: { notification_id: "${note_id}", outcome: "CLEAR" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
            - call: "POST /locate-assignments"
              payload: { ticket_id: "${tid}", notification_id: "${note_id}", locate_tech_id: "${tech_id}" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /locate-assignments/${asg_id}/cancel"
              payload: {}
              as: FacilityOwner
              as_user_id: "${mem_id}"
          trigger:
            - call: "POST /locate-assignments/${asg_id}/cancel"
              payload: {}
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_ASSIGNMENT_NOT_CANCELLABLE'"

      - name: positive_response_to_non_submitted_ticket_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_TICKET_NOT_ACCEPTING_RESPONSES]"]
        excluded_because:
          difficulty_instance: transitive_cascade / positive_response_bubbles_ticket_all_clear_then_markable
          rationale: "Ticket-accepting-responses state gate is the positive path of the §1.8 cascade instance; its negative counterpart shares the same precondition claim."

