              as_user_id: "${r_id}"
              captures: { tbl_id: $.data.id }
            - call: "POST /services"
              payload: { restaurant_id: "${r_id}", service_date: "2026-09-12", meal_period: "DINNER", seating_start_utc: "2026-09-12T22:00:00Z", seating_end_utc: "2026-09-13T02:00:00Z", turn_time_minutes: 150, seats_capacity: 20, demand_tier: "HIGH", unsold_release_bp: 5000, release_lead_minutes: 180, waitlist_policy: "YIELD_WEIGHTED", kitchen_prep_capacity_minutes: 600 }
              as: RestaurantManager
