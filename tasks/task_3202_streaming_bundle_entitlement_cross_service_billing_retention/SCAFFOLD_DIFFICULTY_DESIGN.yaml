          assert:
            - "HTTP status == 422"
            - "error_id == ERR_MIGRATION_WINDOW_CLOSED"
            - "Migration.${mig_id}.migration_status == QUOTED"

      - name: maturity_gate_rank_equality_allowed
        grounds:
          - calculations.watchlist_maturity_gate
          - validations[priority=8]
        distinguishing_aspect: |
          Metric: integer rank boundary on the watchlist-add endpoint
          (distinct metric and endpoint from the temporal boundary instance).
          kids_mode=true forces effective cap TV_PG (rank 2); a TV_14 title
          (rank 3) is rejected, then a TV_PG title (rank 2, EXACTLY equal to
          the cap) is accepted — pinning the inclusive <= comparison.
        test_recipe:
          setup:
            - "Subscriber with a LINKED DPLUS profile with kids_mode=true (cap forced TV_PG); account otherwise empty of subscriptions (watchlist is profile-level, no subscription required to add)"
          setup_api_calls:
