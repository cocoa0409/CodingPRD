      - name: selector_candidate_set_excludes_draft_future_and_out_of_band_rules
        claim_type: Input Set Filtering
        grounds: [calculations.placement_rule_selection, "errors[ERR_NO_PLACEMENT_RULE_MATCH]", "validations[priority=26]"]
        distinguishing_aspect: |
          Three independent exclusions leave the candidate set empty for a student
          who visibly "looks placeable": the GPA band's upper bound is EXCLUSIVE so
          3.00 falls out of a 2.00-3.00 rule, a DRAFT rule is never consulted, and an
          ACTIVE rule whose effective_from has not arrived is not yet effective. The
          same student succeeds after the clock reaches effective_from exactly,
          which pins that bound as INCLUSIVE.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z."
            - "Courses MATH-050 (level_rank 50) and MATH-100 (level_rank 100)."
            - "Rule RA: TRANSCRIPT_GPA -> MATH-050, min_hs_gpa 2.00, max_hs_gpa 3.00, effective_from 2026-07-01T00:00:00Z, ACTIVE."
            - "Rule RB: TRANSCRIPT_GPA -> MATH-100, min_hs_gpa 3.00, left in DRAFT."
            - "Rule RC: TRANSCRIPT_GPA -> MATH-100, min_hs_gpa 3.00, effective_from 2026-09-01T00:00:00Z, ACTIVE but not yet effective."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-050", title: "Pre-Algebra", subject_area: "MATH", level_rank: 50, units: 5.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_050: $.data.id }
            - call: "POST /courses"
              payload: { course_code: "MATH-100", title: "College Algebra", subject_area: "MATH", level_rank: 100, units: 4.0, is_support_course: false, transfer_level: true }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_100: $.data.id }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TRANSCRIPT_GPA", target_course_id: "${c_050}", priority_rank: 10, min_hs_gpa: 2.00, max_hs_gpa: 3.00, effective_from: "2026-07-01T00:00:00Z", version_label: "RA" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { ra: $.data.id }
            - call: "POST /placement-rules/${ra}/activate"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { ra_status: $.data.status }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TRANSCRIPT_GPA", target_course_id: "${c_100}", priority_rank: 20, min_hs_gpa: 3.00, effective_from: "2026-07-01T00:00:00Z", version_label: "RB" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { rb: $.data.id, rb_status: $.data.status }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TRANSCRIPT_GPA", target_course_id: "${c_100}", priority_rank: 30, min_hs_gpa: 3.00, effective_from: "2026-09-01T00:00:00Z", version_label: "RC" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { rc: $.data.id }
            - call: "POST /placement-rules/${rc}/activate"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { rc_status: $.data.status }
            - call: "POST /students"
              payload: { student_number: "SX3", full_name: "Student X Three", race_ethnicity_code: "WHITE", hs_gpa: 3.00, hs_transcript_status: "SELF_REPORTED" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sx3: $.data.id, sx3_v: $.data.version }
            - call: "POST /students"
              payload: { student_number: "SY3", full_name: "Student Y Three", race_ethnicity_code: "WHITE", hs_gpa: 2.99, hs_transcript_status: "SELF_REPORTED" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sy3: $.data.id, sy3_v: $.data.version }
            - call: "POST /students"
              payload: { student_number: "SZ3", full_name: "Student Z Three", race_ethnicity_code: "MULTI", hs_gpa: 3.00, hs_transcript_status: "SELF_REPORTED" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sz3: $.data.id, sz3_v: $.data.version }
          trigger:
            - call: "POST /placement-determinations"
              payload: { student_id: "${sx3}", subject_area: "MATH", expected_student_version: "${sx3_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { err_none: $.data.error_id }
            - call: "POST /placement-determinations"
              payload: { student_id: "${sy3}", subject_area: "MATH", expected_student_version: "${sy3_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { det_y: $.data.id, det_y_rule: $.data.applied_rule_id, det_y_course: $.data.placed_course_id, det_y_base: $.data.base_confidence_score, det_y_conf: $.data.confidence_score, det_y_days: $.data.validity_days, det_y_evidence: $.data.evidence_state, det_y_src: $.data.source_attempt_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /placement-determinations"
              payload: { student_id: "${sz3}", subject_area: "MATH", expected_student_version: "${sz3_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { det_z: $.data.id, det_z_rule: $.data.applied_rule_id, det_z_course: $.data.placed_course_id, det_z_base: $.data.base_confidence_score, det_z_measure: $.data.measure_type_used, det_z_at: $.data.determined_at }
          assert:
            - "${ra_status} == \"ACTIVE\", ${rb_status} == \"DRAFT\", ${rc_status} == \"ACTIVE\" (setup)"
            - "${err_none} == \"ERR_NO_PLACEMENT_RULE_MATCH\" with HTTP 422 and NO PlacementDetermination row is created"
            - "the three exclusions are independent: RA fails because max_hs_gpa is EXCLUSIVE (3.00 < 3.00 is false), RB is DRAFT so it never enters the candidate set, and RC has effective_from 2026-09-01 which is after the clock"
            - "${det_y_rule} == \"${ra}\" and ${det_y_course} == \"${c_050}\" — hs_gpa 2.99 is inside the band, so one hundredth of a GPA point separates a 422 from a placement"
            - "${det_y_base} == 37.4 — t = round(2.99 / 4.0 * 100, 2) = 74.75, wt = round(74.75 * 0.5, 2) = 37.38, base = round(37.38, 1) = 37.4"
            - "${det_y_conf} == 37.4, ${det_y_days} == 180, ${det_y_evidence} == \"UNVERIFIED\", ${det_y_src} == null — transcript_recorded_at is null so staleness_penalty is 0.0, and SELF_REPORTED can never reach VERIFIED evidence"
            - "${det_z_rule} == \"${rc}\" and ${det_z_course} == \"${c_100}\" — at clock == effective_from the rule IS effective, so effective_from is INCLUSIVE"
            - "${det_z_base} == 37.5 and ${det_z_measure} == \"TRANSCRIPT_GPA\" and ${det_z_at} == \"2026-09-01T00:00:00Z\""
            - "RA is still ACTIVE at the later clock and still excludes 3.00, so ${det_z_course} != \"${c_050}\""

      - name: self_guided_pathway_contributes_a_flat_sixty_point_component
        claim_type: Constants Applied
        grounds: [calculations.placement_base_confidence_score, calculations.placement_validity_window]
        distinguishing_aspect: |
          SELF_GUIDED_COMPONENT_VALUE is a flat 60.00 that does NOT scale with
          anything the student did: with no transcript and no test the whole score is
          the single weighted term round(60.00 * 0.15, 2) = 9.00, so base is 9.0 and
          the validity tier drops to the floor of 180 days. required_self_guided_pathway
          is an equality gate, so the neighbouring pathway matches nothing at all.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Course MATH-100 (level_rank 100, units 4.0)."
            - "One ACTIVE rule SELF_GUIDED -> MATH-100 with required_self_guided_pathway STEM."
            - "Student SSG with self_guided_pathway STEM, NO hs_gpa, NO transcript and NO test attempt; Student SBS is identical but with pathway BSTEM."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-100", title: "College Algebra", subject_area: "MATH", level_rank: 100, units: 4.0, is_support_course: false, transfer_level: true }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_100: $.data.id }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "SELF_GUIDED", target_course_id: "${c_100}", priority_rank: 10, required_self_guided_pathway: "STEM", effective_from: "2026-07-01T00:00:00Z", version_label: "SG1" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { sg: $.data.id }
            - call: "POST /placement-rules/${sg}/activate"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { sg_status: $.data.status }
            - call: "POST /students"
              payload: { student_number: "SSG", full_name: "Student Self Guided", race_ethnicity_code: "AIAN", self_guided_pathway: "STEM" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { ssg: $.data.id, ssg_v: $.data.version, ssg_gpa: $.data.hs_gpa }
            - call: "POST /students"
              payload: { student_number: "SBS", full_name: "Student B Stem", race_ethnicity_code: "AIAN", self_guided_pathway: "BSTEM" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sbs: $.data.id, sbs_v: $.data.version }
          trigger:
            - call: "POST /placement-determinations"
              payload: { student_id: "${ssg}", subject_area: "MATH", expected_student_version: "${ssg_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { det: $.data.id, det_measure: $.data.measure_type_used, det_rule: $.data.applied_rule_id, det_course: $.data.placed_course_id, det_base: $.data.base_confidence_score, det_pen: $.data.staleness_penalty, det_conf: $.data.confidence_score, det_days: $.data.validity_days, det_exp: $.data.expires_at, det_ev: $.data.evidence_state, det_state: $.data.placement_state }
            - call: "POST /placement-determinations"
              payload: { student_id: "${sbs}", subject_area: "MATH", expected_student_version: "${sbs_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { err_pathway: $.data.error_id }
          assert:
            - "${sg_status} == \"ACTIVE\" and ${ssg_gpa} == null (setup) — a SELF_GUIDED rule activates with no GPA and no score bounds at all"
            - "${det_measure} == \"SELF_GUIDED\" and ${det_rule} == \"${sg}\" and ${det_course} == \"${c_100}\""
            - "${det_base} == 9.0 — t = 0.00 and s = 0.00, g = 60.00, wg = round(60.00 * 0.15, 2) = 9.00, base = round(0.00 + 0.00 + 9.00, 1)"
            - "${det_pen} == 0.0 and ${det_conf} == 9.0 — transcript_recorded_at is null, so the staleness branch is skipped entirely rather than being computed from the clock"
            - "${det_days} == 180 and ${det_exp} == \"2027-01-28T00:00:00Z\" — 9.0 is below VALIDITY_TIER_MID_MIN so the tier floors at 180 days"
            - "${det_ev} == \"UNVERIFIED\" and ${det_state} == \"PROVISIONAL\""
            - "${err_pathway} == \"ERR_NO_PLACEMENT_RULE_MATCH\" with HTTP 422 — required_self_guided_pathway STEM does not accept BSTEM; the pathway match is equality, not a hierarchy"

      - name: term_unit_cap_is_inclusive_at_exactly_eighteen_units
        claim_type: Correct Result
        grounds: [calculations.term_unit_load, "errors[ERR_TERM_UNIT_CAP_EXCEEDED]", "validations[priority=29]"]
        distinguishing_aspect: |
          The load is a per-term aggregate over OTHER live registrations plus this
          one plus, for a PAIRED PRIMARY, the support course — and corequisite units
          are added rather than trimmed to fit. Three confirms walk the student to
          exactly MAX_TERM_UNITS, which is ALLOWED because the cap is inclusive, and
          the fourth confirm is refused while its PENDING hold survives.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Courses MATH-100 (MATH, level_rank 100, units 6.0), MATH-100S (MATH, level_rank 90, units 6.0, is_support_course true), ENGL-100 (ENGLISH, level_rank 100, units 6.0) and ESLW-050 (ESL, level_rank 80, units 6.0)."
            - "ACTIVE COREQUISITE edge MATH-100 -> MATH-100S."
            - "ACTIVE rules: TRANSCRIPT_GPA -> MATH-100 with coreq_course_id MATH-100S and coreq_required true; TRANSCRIPT_GPA -> ENGL-100 (ENGLISH); TRANSCRIPT_GPA -> ESLW-050 (ESL). All min_hs_gpa 2.0."
            - "Sections in term 2026FA, all distinct rooms and non-overlapping blocks: secP1 (MATH-100, R830, 08:00-09:00) PAIRED with secS1 (MATH-100S, R831, 09:00-10:00), secE1 (ENGL-100, R832, 10:00-11:00), secX1 (ESLW-050, R833, 11:00-12:00); all four OPEN, each with seat_capacity 5."
            - "Student SW3 (hs_gpa 2.50 VERIFIED, transcript 2025-06-01T00:00:00Z, el_status NOT_EL) with determinations in MATH, ENGLISH and ESL."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-100", title: "College Algebra", subject_area: "MATH", level_rank: 100, units: 6.0, is_support_course: false, transfer_level: true }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_100: $.data.id }
            - call: "POST /courses"
              payload: { course_code: "MATH-100S", title: "Algebra Support", subject_area: "MATH", level_rank: 90, units: 6.0, is_support_course: true, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
