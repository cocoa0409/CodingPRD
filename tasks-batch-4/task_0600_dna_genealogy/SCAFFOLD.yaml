scenario: "Consumer DNA & Genealogy (AncestryDNA/23andMe style): kit order & barcode activation, sample receipt & lab processing pipeline, ethnicity/ancestry & health-trait report (consent-gated), DNA-relative matching & opt-in, family-tree builder & record hints, subscription tier, data-download/delete (privacy), research-consent opt-in"
domain_name: "consumer-dna-genealogy"
api_prefix: "/dna"

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Workflow orchestration"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
  difficulty_level: Expert
  notes: |
    Read surface is intentionally wide because §1.5 must expose a reverse-reachability
    GET for every FK declared in §1.1 (13 entities, 17 FKs incl. self-referential
    TreePerson.father_id / mother_id). Difficulty lives in the coupling: consent grants
    gate report generation and relative matching; withdrawing a grant cascades four hops
    (grant -> Customer.matching_opt_in -> RelativeMatch -> counterpart visible_match_count
    -> RecordHint / TreePerson.hint_count); the lab pipeline is cyclic (QC failure requeue);
    Subscription carries two independent state dimensions; and a scheduled purge run
    executes deferred deletion.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Login identity; unique across Customers; also the deterministic tie-break key for pair ordering in relative matching.
        constraints: "unique; non-empty"
      - name: display_name
        type: string
        source: input
        description: Human-readable name shown to DNA relatives.
      - name: account_status
        type: enum
        source: computed
        description: Lifecycle of the account.
        default: ACTIVE
        constraints: "ACTIVE | PURGED"
      - name: dna_status
        type: enum
        source: computed
        description: Genotyping readiness, driven by the Sample pipeline.
        default: NO_SAMPLE
        constraints: "NO_SAMPLE | PROCESSING | DNA_READY | PURGED"
      - name: wallet_credit_cents
        type: integer
        source: computed
        description: Store credit in cents. Debited by tier-change charges, credited by kit refunds, cancellation refunds and revert-change compensation.
        default: 0
        constraints: ">= 0"
      - name: matching_opt_in
        type: boolean
        source: computed
        description: True iff an ACTIVE ConsentGrant with scope=RELATIVE_MATCHING covers the current logical clock instant.
        default: false
      - name: research_opt_in
        type: boolean
        source: computed
        description: True iff an ACTIVE ConsentGrant with scope=RESEARCH covers the current logical clock instant.
        default: false
      - name: health_opt_in
        type: boolean
        source: computed
        description: True iff an ACTIVE ConsentGrant with scope=HEALTH_TRAITS covers the current logical clock instant.
        default: false
      - name: visible_match_count
        type: integer
        source: computed
        description: "count(RelativeMatch WHERE status = ACTIVE AND (customer_a_id = this.id OR customer_b_id = this.id))"
        default: 0
        constraints: ">= 0"

  - name: Subscription
    parent: Customer
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the subscriber."
      - name: tier
        type: enum
        source: input
        description: "Current subscription tier; drives fees (FREE 0 / PLUS 1999 / PRO 7999 cents), health-report entitlement (PLUS and PRO only) and the family-tree person limit (FREE 3 / PLUS 250 / PRO 999999)."
        default: FREE
        constraints: "FREE | PLUS | PRO"
      - name: pending_tier
        type: enum
        source: computed
        description: Tier a scheduled downgrade will move to at current_period_end; null when no change is pending.
        default: null
        constraints: "null | FREE | PLUS | PRO"
      - name: billing_status
        type: enum
        source: computed
        description: Billing dimension of the parallel state machine.
        default: CURRENT
        constraints: "CURRENT | PAST_DUE | CLOSED"
      - name: access_status
        type: enum
        source: computed
        description: Access dimension of the parallel state machine; evolves independently of billing_status.
        default: ACTIVE
        constraints: "ACTIVE | GRACE | LOCKED | CANCELLED"
      - name: current_period_start
        type: datetime
        source: system
        description: Start of the current 30-day billing period (logical clock at creation).
      - name: current_period_end
        type: datetime
        source: system
        description: current_period_start + BILLING_PERIOD_DAYS (30) days.
      - name: grace_until
        type: datetime
        source: computed
        description: Instant at which a GRACE access_status expires; null unless access_status = GRACE.
        default: null
      - name: lifetime_charged_cents
        type: integer
        source: computed
        description: Cumulative cents charged to this subscription by tier-change operations; decremented by revert-change (conserved quantity Q1 with Customer.wallet_credit_cents).
        default: 0
      - name: last_change_charge_cents
        type: integer
        source: computed
        description: Charge total of the most recent applied tier change; the exact amount revert-change refunds. Null when no change has been applied since the last revert.
        default: null
      - name: last_change_from_tier
        type: enum
        source: computed
        description: Tier the subscription held before the most recent applied tier change; revert-change restores it.
        default: null
        constraints: "null | FREE | PLUS | PRO"
      - name: published_report_count
        type: integer
        source: computed
        description: "count(Report WHERE customer_id = this.customer_id AND status = PUBLISHED AND generated_at >= current_period_start AND generated_at <= <clock now>) — selects the CONSUMED_PERIOD refund variant when > 0."
        default: 0

  - name: Kit
    parent: Customer
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; who ordered the kit."
      - name: barcode
        type: string
        source: system
        description: Server-minted activation barcode, unique across Kits. Must be echoed by the customer to activate.
        constraints: "unique"
      - name: chip_version
        type: enum
        source: input
        description: Genotyping chip the kit is manufactured for; must match the LabInstrument's chip_version and drives the relative-match chip penalty.
        constraints: "V4 | V5"
      - name: price_cents
        type: integer
        source: system
        description: Kit price in cents; fixed at KIT_PRICE_CENTS (9900). Refunded to wallet_credit_cents when the sample fails terminally.
        default: 9900
      - name: status
        type: enum
        source: computed
        description: Kit lifecycle.
        default: ORDERED
        constraints: "ORDERED | ACTIVATED | RECEIVED | PROCESSED | VOID"
      - name: activated_at
        type: datetime
        source: computed
        description: Logical-clock instant of successful barcode activation; null before activation.
        default: null

  - name: Sample
    parent: Kit
    common_fields: true
    fields:
      - name: kit_id
        type: string
        source: system
        description: "FK -> Kit.id; the kit whose swab produced this sample."
      - name: batch_id
        type: string
        source: computed
        description: "FK -> LabBatch.id; null until the sample is assigned to a batch, and cleared when the sample is knocked back to QC_FAILED."
        default: null
      - name: status
        type: enum
        source: computed
        description: Lab pipeline state; cyclic through QC_FAILED -> RECEIVED.
        default: RECEIVED
        constraints: "RECEIVED | EXTRACTED | QC_FAILED | QUEUED | GENOTYPING | GENOTYPED | FAILED_TERMINAL"
      - name: extraction_attempts
        type: integer
        source: computed
        description: Number of extraction attempts consumed; incremented on every failing extraction and on every failing genotype call.
        default: 0
      - name: dna_yield_ng
        type: number
        source: computed
        description: Nanograms of DNA recovered by the most recent extraction attempt; null before the first attempt.
        default: null
      - name: call_rate
        type: number
        source: computed
        description: Genotype call rate reported at batch finalize; null before genotyping completes.
        default: null
      - name: population_scores
        type: array
        source: computed
        description: "Array of { population: string, raw_score: integer } written at batch finalize; the raw input set of the ethnicity composition calculation."
        default: []
      - name: genotype_markers
        type: array
        source: computed
        description: Ascending array of distinct integer marker positions written at batch finalize; the input set of the shared-segment scan.
        default: []

  - name: LabInstrument
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Instrument label.
      - name: chip_version
        type: enum
        source: input
        description: Chip the instrument reads; a batch may only carry samples whose Kit.chip_version equals this.
        constraints: "V4 | V5"
      - name: status
        type: enum
        source: input
        description: Instrument availability.
        default: ONLINE
        constraints: "ONLINE | MAINTENANCE"

  - name: LabBatch
    parent: LabInstrument
    common_fields: true
    fields:
      - name: instrument_id
        type: string
        source: input
        description: "FK -> LabInstrument.id; the instrument the batch occupies for its run window."
      - name: run_start_at
        type: datetime
        source: input
        description: Inclusive start of the instrument occupation window.
      - name: run_end_at
        type: datetime
        source: input
        description: Exclusive end of the instrument occupation window (half-open [run_start_at, run_end_at) semantics; back-to-back batches are legal).
      - name: status
        type: enum
        source: computed
        description: Batch lifecycle.
        default: OPEN
        constraints: "OPEN | RUNNING | FINALIZED | ABORTED"
      - name: member_count
        type: integer
        source: computed
        description: "count(Sample WHERE batch_id = this.id)"
        default: 0
      - name: pass_rate
        type: number
        source: computed
        description: Fraction of members whose call_rate >= MIN_CALL_RATE at finalize; 4 decimal places. Null until FINALIZED.
        default: null

  - name: ConsentGrant
    parent: Customer
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the consenting subject."
      - name: scope
        type: enum
        source: input
        description: Consent scope. HEALTH_TRAITS gates health reports; RELATIVE_MATCHING gates DNA-relative matching; RESEARCH gates the FINAL ethnicity recalibration.
        constraints: "HEALTH_TRAITS | RELATIVE_MATCHING | RESEARCH"
      - name: effective_from
        type: datetime
        source: input
        description: Inclusive start of the grant window.
      - name: effective_until
        type: datetime
        source: input
        description: Inclusive end of the grant window (CLOSED interval — two grants that merely touch endpoints DO overlap).
      - name: status
        type: enum
        source: computed
        description: Grant lifecycle.
        default: ACTIVE
        constraints: "ACTIVE | WITHDRAWN"
      - name: withdrawn_at
        type: datetime
        source: computed
        description: Logical-clock instant of withdrawal; starts the CONSENT_COOLING_OFF_HOURS (24h) buffer before a new grant on the same (customer_id, scope) may begin.
        default: null

  - name: Report
    parent: Customer
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the report subject."
      - name: sample_id
        type: string
        source: computed
        description: "FK -> Sample.id; the GENOTYPED sample the report was computed from, selected by the report_source_sample selector."
      - name: report_type
        type: enum
        source: input
        description: Kind of report.
        constraints: "ETHNICITY | HEALTH_TRAIT"
      - name: variant
        type: enum
        source: input
        description: Composition algorithm variant. FINAL drops sub-1.00% populations and renormalizes; requires RESEARCH consent.
        constraints: "PROVISIONAL | FINAL"
      - name: status
        type: enum
        source: computed
        description: Report lifecycle. A newly generated report is created DRAFT and auto-published within the same request.
        default: DRAFT
        constraints: "DRAFT | PUBLISHED | SUPERSEDED | REVOKED"
      - name: composition
        type: array
        source: computed
        description: "Array of { population: string, share_pct: number } sorted by population ASC; shares sum to exactly 100.00. Empty for HEALTH_TRAIT reports."
        default: []
      - name: residual_population
        type: string
        source: computed
        description: Population code that absorbed the rounding residual (100.00 minus the sum of the per-population rounded shares). Null when the residual is 0.00 or for HEALTH_TRAIT reports.
        default: null
      - name: trait_count
        type: integer
        source: computed
        description: "Number of health traits reported: count of Sample.genotype_markers entries that are <= HEALTH_TRAIT_MARKER_CEILING (12). Zero for ETHNICITY reports."
        default: 0
      - name: generated_at
        type: datetime
        source: computed
        description: Logical-clock instant the report was published.

  - name: RelativeMatch
    parent: null
    common_fields: true
    fields:
      - name: customer_a_id
        type: string
        source: computed
        description: "FK -> Customer.id; the side of the pair whose Customer.created_at is earlier (tie-break: lower email ASC)."
      - name: customer_b_id
        type: string
        source: computed
        description: "FK -> Customer.id; the other side of the pair."
      - name: shared_cm
        type: number
        source: computed
        description: Shared centimorgans, 2 decimal places, from the shared_segment_scan calculation.
      - name: segment_count
        type: integer
        source: computed
        description: Number of maximal consecutive-integer runs in the shared marker set.
      - name: predicted_relationship
        type: enum
        source: computed
        description: Relationship bucket selected from shared_cm by the relationship-threshold ladder.
        constraints: "PARENT_CHILD | SIBLING | CLOSE_COUSIN | DISTANT_COUSIN"
      - name: confidence_score
        type: number
        source: computed
        description: Weighted confidence, 4 decimal places, from the relative_match_confidence calculation.
      - name: status
        type: enum
        source: computed
        description: Match visibility. SUPPRESSED when either side's RELATIVE_MATCHING consent is withdrawn; back to ACTIVE when both sides are opted in again.
        default: ACTIVE
        constraints: "ACTIVE | SUPPRESSED | PURGED"

  - name: FamilyTree
    parent: Customer
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the tree owner."
      - name: name
        type: string
        source: input
        description: Tree label.
      - name: status
        type: enum
        source: computed
        description: Tree lifecycle.
        default: ACTIVE
        constraints: "ACTIVE | ARCHIVED"
      - name: person_count
        type: integer
        source: computed
        description: "count(TreePerson WHERE tree_id = this.id AND status = ACTIVE) — checked against TIER_TREE_PERSON_LIMIT[Subscription.tier]."
        default: 0

  - name: TreePerson
    parent: FamilyTree
    common_fields: true
    fields:
      - name: tree_id
        type: string
        source: input
        description: "FK -> FamilyTree.id; the tree this person belongs to."
      - name: father_id
        type: string
        source: input
        description: "FK -> TreePerson.id; self-referential parent link; must be in the same tree and must not create a cycle."
        default: null
      - name: mother_id
        type: string
        source: input
        description: "FK -> TreePerson.id; self-referential parent link; must be in the same tree and must not create a cycle."
        default: null
      - name: linked_customer_id
        type: string
        source: input
        description: "FK -> Customer.id; set when the person is a known platform customer (a DNA relative). Null otherwise."
        default: null
      - name: given_name
        type: string
        source: input
        description: Given name.
      - name: surname
        type: string
        source: input
        description: Surname; the tie-break key when the root-person selector ties on created_at.
      - name: birth_year
        type: integer
        source: input
        description: Optional birth year.
        default: null
      - name: status
        type: enum
        source: computed
        description: Person lifecycle.
        default: ACTIVE
        constraints: "ACTIVE | REMOVED"
      - name: hint_count
        type: integer
        source: computed
        description: "count(RecordHint WHERE person_id = this.id AND status = PENDING)"
        default: 0

  - name: RecordHint
    parent: TreePerson
    common_fields: true
    fields:
      - name: person_id
        type: string
        source: computed
        description: "FK -> TreePerson.id; the person the hint is attached to."
      - name: source_match_id
        type: string
        source: computed
        description: "FK -> RelativeMatch.id; the DNA match that produced this hint. Null for non-DNA hints."
        default: null
      - name: hint_type
        type: enum
        source: computed
        description: Hint provenance.
        constraints: "DNA_TREE | CENSUS"
      - name: status
        type: enum
        source: computed
        description: Hint lifecycle. WITHDRAWN when the source match is suppressed or purged.
        default: PENDING
        constraints: "PENDING | ACCEPTED | WITHDRAWN"
      - name: confidence
        type: number
        source: computed
        description: Copied from RelativeMatch.confidence_score at hint creation, 4 decimal places.

  - name: DataRequest
    parent: Customer
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the requesting subject."
      - name: request_type
        type: enum
        source: input
        description: Privacy request kind. EXPORT completes on approval; DELETE schedules a deferred purge.
        constraints: "EXPORT | DELETE"
      - name: status
        type: enum
        source: computed
        description: Request lifecycle.
        default: PENDING
        constraints: "PENDING | APPROVED | SCHEDULED | COMPLETED | REJECTED | CANCELLED"
      - name: reviewed_by
        type: string
        source: computed
        description: Opaque X-User-ID of the PrivacyOfficer who decided the request; null while PENDING.
        default: null
      - name: scheduled_purge_at
        type: datetime
        source: computed
        description: For DELETE requests, decision instant + PURGE_GRACE_DAYS (7) days. Null for EXPORT.
        default: null
      - name: export_url
        type: string
        source: computed
        description: For approved EXPORT requests, the generated download URL. Null otherwise.
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------- Kit -----
  - entity: Kit
    initial_state: ORDERED
    terminal_states: [PROCESSED, VOID]
    transitions:
      - from: ORDERED
        to: ACTIVATED
        trigger: "POST /dna/kits/{id}/activate"
        actor: Customer
        preconditions:
          - "Customer.account_status == ACTIVE (else ERR_CUSTOMER_PURGED)"
          - "kit.status == ORDERED (else ERR_BARCODE_ALREADY_ACTIVATED)"
          - "body.barcode == kit.barcode (else ERR_BARCODE_MISMATCH)"
          - "the kit owner's Subscription has access_status IN {ACTIVE, GRACE} (else ERR_SUBSCRIPTION_LOCKED) — cross-entity dependency Kit -> Subscription"
        side_effects:
          - "set Kit.activated_at = <logical clock now>"
          - "increments Kit.version by 1"
      - from: ACTIVATED
        to: RECEIVED
        trigger: "POST /dna/kits/{id}/receive"
        actor: LabTechnician
        preconditions:
          - "kit.status == ACTIVATED (else ERR_INVALID_STATE)"
        side_effects:
          - "create Sample { kit_id: kit.id, status: RECEIVED, extraction_attempts: 0 }"
          - "set Customer.dna_status = PROCESSING (when it was NO_SAMPLE)"
      - from: RECEIVED
        to: PROCESSED
        trigger: "system — cascade hop 2 of lab_batch_finalize_cascade, fired when the kit's Sample reaches GENOTYPED"
        actor: system
        preconditions:
          - "the kit's Sample.status transitioned to GENOTYPED in this request"
        side_effects:
          - "cascade hop 3: set Customer.dna_status = DNA_READY"
      - from: RECEIVED
        to: VOID
        trigger: "system — cascade hop 2 of sample_terminal_failure_cascade, fired when the kit's Sample reaches FAILED_TERMINAL"
        actor: system
        preconditions:
          - "the kit's Sample.status transitioned to FAILED_TERMINAL in this request"
        side_effects:
          - "cascade hop 3: credit Customer.wallet_credit_cents += Kit.price_cents (9900) and set Customer.dna_status = NO_SAMPLE"

  # ------------------------------------------------------------- Sample -----
  # CYCLIC: RECEIVED -> QC_FAILED -> RECEIVED (re-extraction loop)
  - entity: Sample
    initial_state: RECEIVED
    terminal_states: [GENOTYPED, FAILED_TERMINAL]
    transitions:
      - from: RECEIVED
        to: EXTRACTED
        trigger: "POST /dna/samples/{id}/extract with dna_yield_ng >= MIN_DNA_YIELD_NG (200.0)"
        actor: LabTechnician
        preconditions:
          - "sample.status == RECEIVED (else ERR_INVALID_STATE)"
        side_effects:
          - "set Sample.dna_yield_ng = body.dna_yield_ng"
          - "increment Sample.extraction_attempts by 1"
      - from: RECEIVED
        to: QC_FAILED
        trigger: "POST /dna/samples/{id}/extract with dna_yield_ng < MIN_DNA_YIELD_NG (200.0) AND resulting extraction_attempts < MAX_EXTRACTION_ATTEMPTS (3)"
        actor: LabTechnician
        preconditions:
          - "sample.status == RECEIVED (else ERR_INVALID_STATE)"
        side_effects:
          - "set Sample.dna_yield_ng = body.dna_yield_ng"
          - "increment Sample.extraction_attempts by 1"
      - from: RECEIVED
        to: FAILED_TERMINAL
        trigger: "POST /dna/samples/{id}/extract with dna_yield_ng < MIN_DNA_YIELD_NG (200.0) AND resulting extraction_attempts >= MAX_EXTRACTION_ATTEMPTS (3)"
        actor: LabTechnician
        preconditions:
          - "sample.status == RECEIVED (else ERR_INVALID_STATE)"
        side_effects:
          - "set Sample.dna_yield_ng = body.dna_yield_ng; increment Sample.extraction_attempts by 1"
          - "cascade hop 1 of sample_terminal_failure_cascade: because the Sample became FAILED_TERMINAL, its Kit (status RECEIVED) transitions to VOID"
        note: "The Kit->VOID hop then itself credits the wallet and resets dna_status — see the Kit machine."
      - from: QC_FAILED
        to: RECEIVED
        trigger: "POST /dna/samples/{id}/requeue"
        actor: LabTechnician
        preconditions:
          - "sample.status == QC_FAILED (else ERR_INVALID_STATE)"
          - "sample.extraction_attempts < MAX_EXTRACTION_ATTEMPTS (3) (else ERR_EXTRACTION_ATTEMPTS_EXHAUSTED)"
        side_effects:
          - "clear Sample.batch_id (set to null)"
          - "clear Sample.call_rate (set to null)"
        note: "This is the cycle edge — the sample re-enters the pipeline at RECEIVED."
      - from: EXTRACTED
        to: QUEUED
        trigger: "POST /dna/lab-batches (sample_ids includes this sample)"
        actor: LabTechnician
        preconditions:
          - "sample.status == EXTRACTED (else ERR_SAMPLE_NOT_READY)"
          - "Kit.chip_version of the sample's kit == LabInstrument.chip_version of the batch's instrument (else ERR_SAMPLE_NOT_READY) — cross-entity dependency Sample -> LabInstrument"
        side_effects:
          - "set Sample.batch_id = batch.id"
          - "increment LabBatch.member_count by 1"
      - from: QUEUED
        to: GENOTYPING
        trigger: "POST /dna/lab-batches/{id}/start"
        actor: LabTechnician
        preconditions:
          - "batch.status == OPEN and batch.member_count >= 1 (else ERR_EMPTY_BATCH)"
        side_effects: []
      - from: GENOTYPING
        to: GENOTYPED
        trigger: "POST /dna/lab-batches/{id}/finalize — this sample's result has call_rate >= MIN_CALL_RATE (0.98)"
        actor: LabTechnician
        preconditions:
          - "batch.status == RUNNING (else ERR_INVALID_STATE)"
        side_effects:
          - "set Sample.call_rate, Sample.population_scores, Sample.genotype_markers from the result entry"
          - "cascade hop 1 of lab_batch_finalize_cascade: because the Sample became GENOTYPED, its Kit (status RECEIVED) transitions to PROCESSED"
        note: "The Kit->PROCESSED hop then itself sets Customer.dna_status = DNA_READY — see the Kit machine."
      - from: GENOTYPING
        to: QC_FAILED
        trigger: "POST /dna/lab-batches/{id}/finalize — this sample's result has call_rate < MIN_CALL_RATE (0.98) AND resulting extraction_attempts < MAX_EXTRACTION_ATTEMPTS (3)"
        actor: LabTechnician
        preconditions:
          - "batch.status == RUNNING (else ERR_INVALID_STATE)"
        side_effects:
          - "set Sample.call_rate from the result entry; increment Sample.extraction_attempts by 1"
      - from: GENOTYPING
        to: FAILED_TERMINAL
        trigger: "POST /dna/lab-batches/{id}/finalize — this sample's result has call_rate < MIN_CALL_RATE (0.98) AND resulting extraction_attempts >= MAX_EXTRACTION_ATTEMPTS (3)"
        actor: LabTechnician
        preconditions:
          - "batch.status == RUNNING (else ERR_INVALID_STATE)"
        side_effects:
          - "set Sample.call_rate; increment Sample.extraction_attempts by 1"
          - "cascade hop 1 of sample_terminal_failure_cascade: the Sample's Kit (status RECEIVED) transitions to VOID"

  # ----------------------------------------------------------- LabBatch -----
  - entity: LabBatch
    initial_state: OPEN
    terminal_states: [FINALIZED, ABORTED]
    transitions:
      - from: OPEN
        to: RUNNING
        trigger: "POST /dna/lab-batches/{id}/start"
        actor: LabTechnician
        preconditions:
          - "batch.status == OPEN (else ERR_INVALID_STATE)"
          - "batch.member_count >= 1 (else ERR_EMPTY_BATCH) — empty-set boundary"
          - "LabInstrument.status == ONLINE (else ERR_INSTRUMENT_OFFLINE) — cross-entity dependency LabBatch -> LabInstrument"
        side_effects:
          - "every member Sample transitions QUEUED -> GENOTYPING"
      - from: RUNNING
        to: FINALIZED
        trigger: "POST /dna/lab-batches/{id}/finalize"
        actor: LabTechnician
        preconditions:
          - "batch.status == RUNNING (else ERR_INVALID_STATE)"
          - "body.sample_results contains exactly one entry per member Sample (else ERR_INVALID_REQUEST)"
        side_effects:
          - "each member Sample transitions GENOTYPING -> GENOTYPED | QC_FAILED | FAILED_TERMINAL per its call_rate"
          - "set LabBatch.pass_rate = lab_batch_pass_rate"
      - from: OPEN
        to: ABORTED
        trigger: "POST /dna/lab-batches/{id}/abort"
        actor: LabTechnician
        preconditions:
          - "batch.status == OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "every member Sample transitions QUEUED -> EXTRACTED and Sample.batch_id is cleared"
          - "set LabBatch.member_count = 0"
      - from: RUNNING
        to: ABORTED
        trigger: "POST /dna/lab-batches/{id}/abort"
        actor: LabTechnician
        preconditions:
          - "batch.status == RUNNING (else ERR_INVALID_STATE)"
        side_effects:
          - "every member Sample transitions GENOTYPING -> EXTRACTED and Sample.batch_id is cleared"
          - "set LabBatch.member_count = 0"

  # ------------------------------------------------------- Subscription -----
  # PARALLEL DIMENSIONS: billing_status x access_status evolve independently.
  - entity: Subscription
    initial_state: "billing_status=CURRENT x access_status=ACTIVE"
    terminal_states: ["billing_status=CLOSED", "access_status=CANCELLED"]
    transitions:
      - from: "billing_status=CURRENT"
        to: "billing_status=PAST_DUE"
        trigger: "POST /dna/subscriptions/{id}/billing-event with event_type=PAYMENT_FAILED"
        actor: PlatformAdmin
        preconditions:
          - "billing_status == CURRENT. PAYMENT_FAILED is ROUTED by the current pair of dimensions: (CURRENT, ACTIVE) -> this transition; (PAST_DUE, GRACE) -> the access GRACE -> LOCKED transition below; (PAST_DUE, LOCKED) -> ERR_INVALID_STATE; billing_status == CLOSED -> ERR_INVALID_STATE."
        side_effects:
          - "access dimension moves ACTIVE -> GRACE and grace_until = <clock now> + GRACE_PERIOD_DAYS (14) days"
        note: "The two dimensions are independent: a second PAYMENT_FAILED leaves billing_status at PAST_DUE while the access dimension advances GRACE -> LOCKED."
      - from: "access_status=GRACE"
        to: "access_status=LOCKED"
        trigger: "POST /dna/subscriptions/{id}/billing-event with event_type=PAYMENT_FAILED (second and subsequent)"
        actor: PlatformAdmin
        preconditions:
          - "access_status == GRACE AND billing_status == PAST_DUE (else ERR_INVALID_STATE). This is where a SECOND PAYMENT_FAILED lands: the billing dimension does not move, only the access dimension does."
        side_effects:
          - "clear grace_until (set to null)"
          - "billing_status remains PAST_DUE (no billing-dimension change)"
      - from: "billing_status=PAST_DUE"
        to: "billing_status=CURRENT"
        trigger: "POST /dna/subscriptions/{id}/billing-event with event_type=PAYMENT_SUCCEEDED"
        actor: PlatformAdmin
        preconditions:
          - "billing_status == PAST_DUE (else ERR_INVALID_STATE)"
        side_effects:
          - "access dimension moves GRACE|LOCKED -> ACTIVE and grace_until is cleared"
      - from: "billing_status IN {CURRENT, PAST_DUE}"
        to: "billing_status=CLOSED"
        trigger: "POST /dna/subscriptions/{id}/billing-event with event_type=CANCEL"
        actor: PlatformAdmin
        preconditions:
          - "billing_status != CLOSED (else ERR_INVALID_STATE)"
        side_effects:
          - "access dimension moves to CANCELLED"
          - "compute subscription_close_refund and credit Customer.wallet_credit_cents by that amount"
          - "clear pending_tier"
      - from: "tier=<old>"
        to: "tier=<new>"
        trigger: "POST /dna/subscriptions/{id}/change-tier (UPGRADE: TIER_FEE_CENTS[new] > TIER_FEE_CENTS[old])"
        actor: Customer
        preconditions:
          - "body.expected_subscription_version == subscription.version (else ERR_STALE_VERSION)"
          - "access_status IN {ACTIVE, GRACE} (else ERR_SUBSCRIPTION_LOCKED)"
          - "Customer.wallet_credit_cents >= tier_change_charge.charge_total_cents (else ERR_INSUFFICIENT_CREDIT)"
        side_effects:
          - "set Subscription.last_change_from_tier = old tier; set Subscription.tier = new tier immediately"
          - "debit Customer.wallet_credit_cents by charge_total_cents"
          - "increment Subscription.lifetime_charged_cents by charge_total_cents; set last_change_charge_cents = charge_total_cents"
          - "increments Subscription.version by 1"
      - from: "tier=<old>"
        to: "pending_tier=<new>"
        trigger: "POST /dna/subscriptions/{id}/change-tier (DOWNGRADE: TIER_FEE_CENTS[new] <= TIER_FEE_CENTS[old])"
        actor: Customer
        preconditions:
          - "body.expected_subscription_version == subscription.version (else ERR_STALE_VERSION)"
          - "access_status IN {ACTIVE, GRACE} (else ERR_SUBSCRIPTION_LOCKED)"
        side_effects:
          - "set Subscription.pending_tier = new tier; Subscription.tier is unchanged; charge_total_cents = 0"
          - "set last_change_charge_cents = 0 and last_change_from_tier = old tier"
          - "increments Subscription.version by 1"
      - from: "tier=<new>"
        to: "tier=<old>"
        trigger: "POST /dna/subscriptions/{id}/revert-change"
        actor: Customer
        preconditions:
          - "subscription.last_change_charge_cents IS NOT NULL (else ERR_INVALID_STATE)"
          - "access_status != CANCELLED (else ERR_INVALID_STATE)"
        side_effects:
          - "compensating action for change-tier: credit Customer.wallet_credit_cents += last_change_charge_cents"
          - "decrement Subscription.lifetime_charged_cents by last_change_charge_cents"
          - "restore Subscription.tier = last_change_from_tier; clear pending_tier"
          - "clear last_change_charge_cents and last_change_from_tier (set to null)"
        note: "Conserved quantity Q1 = Customer.wallet_credit_cents + Subscription.lifetime_charged_cents is unchanged across change-tier + revert-change."

  # ------------------------------------------------------- ConsentGrant -----
  - entity: ConsentGrant
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /dna/consent-grants/{id}/withdraw"
        actor: Customer
        preconditions:
          - "grant.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "set ConsentGrant.withdrawn_at = <logical clock now>"
          - "scope=RELATIVE_MATCHING — cascade hop 1 of consent_withdraw_cascade: set Customer.matching_opt_in = false"
          - "scope=HEALTH_TRAITS: every Report with report_type=HEALTH_TRAIT, customer_id = grant.customer_id and status=PUBLISHED transitions to REVOKED"
          - "scope=RESEARCH: every Report with variant=FINAL, customer_id = grant.customer_id and status=PUBLISHED transitions to REVOKED"
      - from: "(no grant)"
        to: ACTIVE
        trigger: "POST /dna/consent-grants"
        actor: Customer
        preconditions:
          - "Customer.account_status == ACTIVE (else ERR_CUSTOMER_PURGED)"
          - "no ConsentGrant for the same (customer_id, scope) with status=ACTIVE whose CLOSED interval [effective_from, effective_until] intersects the new CLOSED interval (else ERR_CONSENT_OVERLAP)"
          - "if a WITHDRAWN grant exists for the same (customer_id, scope), then body.effective_from >= max(withdrawn_at over those grants) + CONSENT_COOLING_OFF_HOURS (24h) (else ERR_CONSENT_COOLING_OFF)"
        side_effects:
          - "recompute Customer.matching_opt_in / research_opt_in / health_opt_in"
          - "scope=RELATIVE_MATCHING and the grant covers <clock now> — cascade hop 1 of consent_regrant_cascade: set Customer.matching_opt_in = true"
          - "cascade hop 2: every RelativeMatch with status=SUPPRESSED involving this customer whose OTHER side also has matching_opt_in = true transitions SUPPRESSED -> ACTIVE"
          - "cascade hop 3: because those matches became ACTIVE, both sides' Customer.visible_match_count are recomputed (each incremented by 1 per reactivated match)"

  # ------------------------------------------------------------ Report -----
  - entity: Report
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, REVOKED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /dna/customers/{id}/reports — auto-transition within the same request after the composition is computed"
        actor: system
        preconditions:
          - "the composition (ETHNICITY) or trait_count (HEALTH_TRAIT) has been computed from the selected Sample"
        side_effects:
          - "set Report.generated_at = <logical clock now>"
          - "set Subscription.published_report_count = published_report_count recomputation"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "POST /dna/customers/{id}/reports — a newer report of the same report_type is published for the same customer"
        actor: system
        preconditions:
          - "an existing Report with the same customer_id and report_type has status = PUBLISHED"
        side_effects: []
      - from: PUBLISHED
        to: REVOKED
        trigger: "POST /dna/consent-grants/{id}/withdraw (HEALTH_TRAITS or RESEARCH scope) OR POST /dna/_ops/purge-run"
        actor: system
        preconditions:
          - "the withdrawn scope gates this report (HEALTH_TRAITS gates report_type=HEALTH_TRAIT; RESEARCH gates variant=FINAL) OR the customer is being purged"
        side_effects:
          - "decrement Subscription.published_report_count via recomputation"

  # ---------------------------------------------------- RelativeMatch -----
  # CYCLIC: ACTIVE -> SUPPRESSED -> ACTIVE
  - entity: RelativeMatch
    initial_state: ACTIVE
    terminal_states: [PURGED]
    transitions:
      - from: "(no match)"
        to: ACTIVE
        trigger: "POST /dna/customers/{id}/matches/recompute"
        actor: Customer
        preconditions:
          - "Customer.dna_status == DNA_READY (else ERR_DNA_NOT_READY)"
          - "Customer.matching_opt_in == true (else ERR_CONSENT_REQUIRED)"
          - "the counterpart's shared_cm >= MATCH_MIN_CM (8.00) — boundary is inclusive"
        side_effects:
          - "increment Customer.visible_match_count on BOTH sides by 1"
          - "for each side that owns an ACTIVE FamilyTree, create RecordHint { hint_type: DNA_TREE, status: PENDING, source_match_id: match.id, person_id: <root person selector>, confidence: match.confidence_score } and increment that TreePerson.hint_count by 1"
      - from: ACTIVE
        to: SUPPRESSED
        trigger: "system — cascade hop 2 of consent_withdraw_cascade"
        actor: system
        preconditions:
          - "one side's Customer.matching_opt_in became false in this request"
        side_effects:
          - "cascade hop 3: because the match left ACTIVE, decrement Customer.visible_match_count by 1 on BOTH sides"
          - "cascade hop 4: because the match left ACTIVE, every RecordHint with source_match_id = match.id and status = PENDING transitions to WITHDRAWN, and its TreePerson.hint_count is decremented by 1"
      - from: SUPPRESSED
        to: ACTIVE
        trigger: "system — cascade hop 2 of consent_regrant_cascade (POST /dna/consent-grants, scope=RELATIVE_MATCHING)"
        actor: system
        preconditions:
          - "both customer_a and customer_b have matching_opt_in == true after the grant"
        side_effects:
          - "increment Customer.visible_match_count by 1 on BOTH sides"
        note: "Cycle edge. Conserved quantity Q2 = SUM(Customer.visible_match_count) == 2 * count(RelativeMatch WHERE status = ACTIVE) holds after withdraw and after re-grant."
      - from: "ACTIVE | SUPPRESSED"
        to: PURGED
        trigger: "POST /dna/_ops/purge-run — either side's DELETE DataRequest executes"
        actor: system
        preconditions:
          - "one side's Customer.account_status is transitioning to PURGED"
        side_effects:
          - "if the match was ACTIVE, decrement Customer.visible_match_count by 1 on BOTH sides"
          - "every RecordHint with source_match_id = match.id and status = PENDING transitions to WITHDRAWN and its TreePerson.hint_count is decremented by 1"

  # -------------------------------------------------------- RecordHint -----
  - entity: RecordHint
    initial_state: PENDING
    terminal_states: [ACCEPTED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /dna/record-hints/{id}/accept"
        actor: Customer
        preconditions:
          - "hint.status == PENDING (else ERR_INVALID_STATE)"
          - "the acting Customer owns the FamilyTree of hint.person_id (else ERR_NOT_RESOURCE_OWNER)"
          - "FamilyTree.person_count + 1 <= TIER_TREE_PERSON_LIMIT[Subscription.tier] (else ERR_TREE_PERSON_LIMIT) — cross-entity dependency FamilyTree -> Subscription"
        side_effects:
          - "decrement TreePerson.hint_count of hint.person_id by 1"
          - "create TreePerson { tree_id: <the hinted person's tree>, given_name: <counterpart Customer.display_name>, surname: 'DNA_MATCH', linked_customer_id: <counterpart customer id>, father_id: null, mother_id: null, status: ACTIVE }"
          - "increment FamilyTree.person_count by 1"
      - from: PENDING
        to: WITHDRAWN
        trigger: "system — cascade hop 4 of consent_withdraw_cascade, or POST /dna/_ops/purge-run"
        actor: system
        preconditions:
          - "the hint's source RelativeMatch left status = ACTIVE in this request"
        side_effects:
          - "decrement TreePerson.hint_count of hint.person_id by 1"

  # ------------------------------------------------------- DataRequest -----
  - entity: DataRequest
    initial_state: PENDING
    terminal_states: [COMPLETED, REJECTED, CANCELLED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /dna/data-requests/{id}/decide with decision=APPROVE and request_type=EXPORT"
        actor: PrivacyOfficer
        preconditions:
          - "request.status == PENDING (else ERR_INVALID_STATE)"
        side_effects:
          - "set DataRequest.reviewed_by = X-User-ID"
          - "set DataRequest.export_url = 'https://export.dna.example/' + request.id"
      - from: PENDING
        to: SCHEDULED
        trigger: "POST /dna/data-requests/{id}/decide with decision=APPROVE and request_type=DELETE"
        actor: PrivacyOfficer
        preconditions:
          - "request.status == PENDING (else ERR_INVALID_STATE)"
        side_effects:
          - "set DataRequest.reviewed_by = X-User-ID"
          - "set DataRequest.scheduled_purge_at = <logical clock now> + PURGE_GRACE_DAYS (7) days"
        note: "APPROVED is an instantaneous intermediate state; the persisted status is SCHEDULED for DELETE and COMPLETED for EXPORT."
      - from: PENDING
        to: REJECTED
        trigger: "POST /dna/data-requests/{id}/decide with decision=REJECT"
        actor: PrivacyOfficer
        preconditions:
          - "request.status == PENDING (else ERR_INVALID_STATE)"
        side_effects:
          - "set DataRequest.reviewed_by = X-User-ID"
      - from: "PENDING | SCHEDULED"
        to: CANCELLED
        trigger: "POST /dna/data-requests/{id}/cancel"
        actor: Customer
        preconditions:
          - "request.status IN {PENDING, SCHEDULED} (else ERR_INVALID_STATE)"
          - "if SCHEDULED: <logical clock now> < request.scheduled_purge_at (else ERR_INVALID_STATE)"
          - "the acting Customer is request.customer_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /dna/_ops/purge-run — scheduled_purge_at <= <logical clock now>"
        actor: PlatformAdmin
        preconditions:
          - "request.status == SCHEDULED AND request.scheduled_purge_at <= <logical clock now>"
        side_effects:
          - "set Customer.account_status = PURGED and Customer.dna_status = PURGED"
          - "every ConsentGrant of the customer with status=ACTIVE transitions to WITHDRAWN"
          - "every Report of the customer with status IN {DRAFT, PUBLISHED} transitions to REVOKED"
          - "every RelativeMatch involving the customer transitions to PURGED (with its visible_match_count and RecordHint cascades)"
          - "set Customer.visible_match_count = 0"
        note: "Requests are processed in created_at ASC order."

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: report-generate-stale-customer
    parent_entity: Customer
    write_endpoint: "POST /dna/customers/{id}/reports"
    occ_field: "expected_customer_version"
    description: |
      Generating a Report against a Customer whose version has advanced since the
      client last observed it is rejected. Report generation legitimately supersedes
      the customer's prior PUBLISHED report of the same report_type, so the operation
      would otherwise succeed on a stale view; the OCC check forces the client to
      re-read the Customer (and thus observe the superseding write) first.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: tier-change-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /dna/subscriptions/{id}/change-tier"
    occ_field: "expected_subscription_version"
    description: |
      Applying a tier change against a Subscription whose version has advanced since
      the client last observed it is rejected. A tier change legitimately supersedes
      a prior change (overwriting last_change_charge_cents and last_change_from_tier,
      which would silently destroy the compensation record for the earlier change),
      so the stale-version check is the only thing standing between the client and a
      charge computed from an out-of-date tier/period view.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- DUAL VARIANT #1 (domain: Report / genomics) ---------------------------
  - name: ethnicity_composition
    trigger: "POST /dna/customers/{id}/reports with report_type=ETHNICITY (fires on the Report DRAFT -> PUBLISHED auto-transition; writes Report.composition and Report.residual_population)"
    algorithm: weighted_scoring
    formula: |
      # INPUT: entries = Sample.population_scores of the selected source sample,
      #        each entry = { population: <string code>, raw_score: <integer> }.
      #
      # STEP 0 (variant FINAL only) — minor-population pruning.
      #   Compute the PROVISIONAL shares first (steps 1-3 below on the full entry set).
      #   Drop every entry whose PROVISIONAL share_pct < MINOR_POPULATION_FLOOR_PCT (1.00).
      #   Re-run steps 1-3 on the surviving entries only.
      #   (variant PROVISIONAL skips step 0 entirely and keeps every entry.)
      #
      # STEP 1 — raw_total = sum(raw_score over the in-scope entries)
      #
      # STEP 2 — ROUNDING ORDER IS PINNED: round EACH population share to 2 dp
      #          FIRST, then sum. (Do NOT sum the unrounded shares and round once.)
      #   for each entry e, iterated in population code ASC order:
      #       share_pct[e] = round_half_up(e.raw_score / raw_total * 100, 2)
      #
      # STEP 3 — residual assignment.
      #   residual = round_half_up(100.00 - sum(share_pct), 2)
      #   if residual != 0.00:
      #       winner = the in-scope entry with the LARGEST raw_score
      #                tie-break: lowest population code (alphabetical ASC)
      #       share_pct[winner] = round_half_up(share_pct[winner] + residual, 2)
      #       Report.residual_population = winner.population
      #   else:
      #       Report.residual_population = null
      #
      # OUTPUT: Report.composition = [ { population, share_pct } ] sorted by population ASC.
      #         The shares sum to exactly 100.00 by construction.
    input_set: "Sample.population_scores of the source sample selected by report_source_sample (Sample.status must be GENOTYPED). HEALTH_TRAIT reports do not run this calculation (composition stays [])."
    constants:
      MINOR_POPULATION_FLOOR_PCT: 1.00
    precision: "share_pct: 2 decimal places, round_half_up. Residual computed against exactly 100.00."
    variants:
      - name: PROVISIONAL
        when: "body.variant == PROVISIONAL — always permitted once dna_status == DNA_READY."
        difference: "Every population in Sample.population_scores is kept, including sub-1.00% trace populations. Shares are computed over the full raw_total."
      - name: FINAL
        when: "body.variant == FINAL — requires an ACTIVE RESEARCH ConsentGrant covering <clock now> (else ERR_CONSENT_REQUIRED), because the recalibration reference panel is derived from the research cohort."
        difference: "Populations whose PROVISIONAL share is < 1.00 are dropped and the remaining shares are renormalized over the reduced raw_total, producing DIFFERENT share_pct values (and potentially a different residual_population) from PROVISIONAL for identical Sample.population_scores."

  # --- DUAL VARIANT #2 (domain: Subscription / billing) ----------------------
  - name: subscription_close_refund
    trigger: "POST /dna/subscriptions/{id}/billing-event with event_type=CANCEL (fires on the billing_status -> CLOSED transition; the result is credited to Customer.wallet_credit_cents)"
    algorithm: threshold
    formula: |
      unused_days = floor( (Subscription.current_period_end - <clock now>) / 86400 seconds )
      if unused_days < 0: unused_days = 0
      base_refund_cents = round_half_up( TIER_FEE_CENTS[Subscription.tier] * unused_days / BILLING_PERIOD_DAYS )

      # variant selection is by published_report_count, recomputed at cancel time:
      n = count(Report WHERE customer_id = Subscription.customer_id
                         AND status = PUBLISHED
                         AND generated_at >= Subscription.current_period_start
                         AND generated_at <= <clock now>)
      if n == 0:   # variant CLEAN_PERIOD
          refund_cents = base_refund_cents
      else:        # variant CONSUMED_PERIOD
          refund_cents = max(0, base_refund_cents - REPORT_UNLOCK_FEE_CENTS * n)
    input_set: "Reports of the subscription's customer with status = PUBLISHED whose generated_at falls in the CLOSED window [current_period_start, <clock now>]. SUPERSEDED and REVOKED reports are excluded."
    constants:
      TIER_FEE_CENTS: { FREE: 0, PLUS: 1999, PRO: 7999 }
      BILLING_PERIOD_DAYS: 30
      REPORT_UNLOCK_FEE_CENTS: 300
    precision: "Integer cents; round_half_up on the proration, then subtract the unlock fees; floor at 0."
    variants:
      - name: CLEAN_PERIOD
        when: "No PUBLISHED Report was generated in the current billing period."
        difference: "The customer gets the full unused-days proration of the tier fee."
      - name: CONSUMED_PERIOD
        when: "At least one PUBLISHED Report was generated in the current billing period."
        difference: "REPORT_UNLOCK_FEE_CENTS (300) is deducted per published report, floored at 0 — a strictly smaller refund than CLEAN_PERIOD for identical tier / period / clock inputs."

  # --- COMBINATORIAL MODE (c): pinned evaluation order ----------------------
  - name: tier_change_charge
    trigger: "POST /dna/subscriptions/{id}/change-tier (fires on the tier transition; writes Subscription.last_change_charge_cents, debits Customer.wallet_credit_cents, increments Subscription.lifetime_charged_cents)"
    algorithm: tiered_pricing
    formula: |
      # DOWNGRADE (TIER_FEE_CENTS[new] <= TIER_FEE_CENTS[old]):
      #   charge_total_cents = 0; the change is deferred via pending_tier. STOP.
      #
      # UPGRADE (TIER_FEE_CENTS[new] > TIER_FEE_CENTS[old]):
      base_delta_cents = TIER_FEE_CENTS[new_tier] - TIER_FEE_CENTS[old_tier]
      remaining_days = floor( (Subscription.current_period_end - <clock now>) / 86400 seconds )
      prorated_cents = floor( base_delta_cents * remaining_days / BILLING_PERIOD_DAYS )

      # CIRCULAR-LOOKING DEPENDENCY — the loyalty discount tier is keyed on an
      # amount, and the processing fee is keyed on the DISCOUNTED amount, and the
      # charge total includes the fee. The evaluation order below is PINNED; the
      # discount tier is selected ONCE, from prorated_cents (the PRE-fee, PRE-discount
      # subtotal), and is NEVER re-selected from discounted_cents or from
      # charge_total_cents.
      #
      # STEP 1: discount_pct = LOYALTY_DISCOUNT_PCT tier selected from prorated_cents
      #           prorated_cents >= 5000 -> 0.10
      #           prorated_cents >= 2000 -> 0.05
      #           otherwise             -> 0.00
      # STEP 2: discount_cents   = round_half_up(prorated_cents * discount_pct)
      #         discounted_cents = prorated_cents - discount_cents
      # STEP 3: processing_fee_cents = max( PROCESSING_FEE_MIN_CENTS,
      #                                     round_half_up(discounted_cents * PROCESSING_FEE_PCT) )
      # STEP 4: charge_total_cents = discounted_cents + processing_fee_cents
    input_set: "The subscription's own tier, current_period_end and the logical clock. No other entities participate."
    constants:
      TIER_FEE_CENTS: { FREE: 0, PLUS: 1999, PRO: 7999 }
      BILLING_PERIOD_DAYS: 30
      LOYALTY_DISCOUNT_PCT: { "5000+": 0.10, "2000+": 0.05, "below_2000": 0.00 }
      PROCESSING_FEE_PCT: 0.029
      PROCESSING_FEE_MIN_CENTS: 30
    precision: "Integer cents throughout. floor() on the proration; round_half_up on the discount and the processing fee."

  # --- COMBINATORIAL MODE (a): >=3 inputs, non-linear -----------------------
  - name: relative_match_confidence
    trigger: "POST /dna/customers/{id}/matches/recompute (fires on each RelativeMatch (no match) -> ACTIVE transition; writes RelativeMatch.confidence_score and RelativeMatch.predicted_relationship)"
    algorithm: weighted_scoring
    formula: |
      # INPUTS (4): shared_cm, segment_count, predicted_relationship, chip-version pair.
      #
      # STEP 1 — relationship ladder (first match wins, evaluated top to bottom):
      #   shared_cm >= 240.00 -> PARENT_CHILD
      #   shared_cm >= 120.00 -> SIBLING
      #   shared_cm >=  40.00 -> CLOSE_COUSIN
      #   shared_cm >=   8.00 -> DISTANT_COUSIN
      #   shared_cm <    8.00 -> no match is created at all (see MATCH_MIN_CM)
      #
      # STEP 2 — non-linear factors:
      #   cm_factor      = min(1.0, shared_cm / MAX_CM_FOR_FULL_CONFIDENCE)
      #   segment_factor = min(1.0, segment_count / EXPECTED_SEGMENTS[predicted_relationship])
      #   chip_penalty   = CHIP_MISMATCH_PENALTY if Kit.chip_version of side A's source
      #                    sample != Kit.chip_version of side B's source sample, else 0.0
      #
      # STEP 3 — confidence_score = round_half_up(
      #              max(0.0, W_CM * cm_factor + W_SEG * segment_factor - chip_penalty), 4)
    input_set: "The two source Samples (status = GENOTYPED) selected by report_source_sample for each side, and their owning Kits' chip_version."
    constants:
      MATCH_MIN_CM: 8.00
      MAX_CM_FOR_FULL_CONFIDENCE: 400.00
      W_CM: 0.70
      W_SEG: 0.30
      CHIP_MISMATCH_PENALTY: 0.05
      EXPECTED_SEGMENTS: { PARENT_CHILD: 40, SIBLING: 30, CLOSE_COUSIN: 12, DISTANT_COUSIN: 4 }
      RELATIONSHIP_THRESHOLDS_CM: { PARENT_CHILD: 240.00, SIBLING: 120.00, CLOSE_COUSIN: 40.00, DISTANT_COUSIN: 8.00 }
    precision: "confidence_score: 4 decimal places, round_half_up; floored at 0.0000."

  # --- shared segment scan (feeds the match) --------------------------------
  - name: shared_segment_scan
    trigger: "POST /dna/customers/{id}/matches/recompute — evaluated once per candidate counterpart; writes RelativeMatch.shared_cm and RelativeMatch.segment_count"
    algorithm: interval_merge
    formula: |
      markers_a = Sample_A.genotype_markers   # ascending distinct integers
      markers_b = Sample_B.genotype_markers
      shared    = sorted( set(markers_a) INTERSECT set(markers_b) )   # ascending

      shared_cm     = round_half_up( CM_PER_MARKER * len(shared), 2 )
      segment_count = number of MAXIMAL runs of consecutive integers in `shared`
                      (e.g. shared = [3,4,5,10,11] -> runs [3,4,5] and [10,11] -> 2)

      # BOUNDARY (inclusive): a RelativeMatch is created iff shared_cm >= MATCH_MIN_CM (8.00).
      # shared_cm == 8.00 exactly DOES create a match; 4.00 does not.
    input_set: "The GENOTYPED source Sample of each side (selected by report_source_sample). Candidate counterparts: every other Customer with account_status = ACTIVE, dna_status = DNA_READY and matching_opt_in = true."
    constants:
      CM_PER_MARKER: 4.00
      MATCH_MIN_CM: 8.00
    precision: "shared_cm: 2 decimal places, round_half_up."

  # --- pair ordering selector (determinism) ---------------------------------
  - name: match_pair_ordering
    trigger: "POST /dna/customers/{id}/matches/recompute — assigns customer_a_id / customer_b_id on RelativeMatch creation"
    algorithm: chronological
    formula: |
      # candidate set: the acting customer and the counterpart.
      # customer_a_id = the side with the EARLIER Customer.created_at
      # tie-break (identical created_at): the side with the lexicographically LOWER email
      # customer_b_id = the other side
      # A pair is never duplicated: a RelativeMatch with the same {customer_a_id,
      # customer_b_id} set is UPDATED in place (shared_cm / segment_count /
      # confidence_score / predicted_relationship refreshed) rather than re-created.
    input_set: "The two Customers of the pair. Customer.id is NEVER used as an ordering or tie-break input."
    constants: {}
    precision: "n/a"

  # --- aggregation ----------------------------------------------------------
  - name: lab_batch_pass_rate
    trigger: "POST /dna/lab-batches/{id}/finalize (fires on the LabBatch RUNNING -> FINALIZED transition; writes LabBatch.pass_rate)"
    algorithm: aggregation
    formula: |
      members = Sample WHERE batch_id = batch.id            # status is GENOTYPING at entry
      passed  = count(m in members WHERE m.call_rate >= MIN_CALL_RATE)   # >= is inclusive
      pass_rate = round_half_up( passed / count(members), 4 )
      # count(members) is guaranteed >= 1: POST /dna/lab-batches/{id}/start rejects an
      # empty batch with ERR_EMPTY_BATCH, so a batch can never reach RUNNING with 0 members.
    input_set: "All Samples whose batch_id = batch.id at the moment of finalize (no status filter — every member is in GENOTYPING)."
    constants:
      MIN_CALL_RATE: 0.98
    precision: "4 decimal places, round_half_up."

  - name: visible_match_count
    trigger: "Recomputed on every RelativeMatch status transition ((no match) -> ACTIVE, ACTIVE -> SUPPRESSED, SUPPRESSED -> ACTIVE, * -> PURGED) and on POST /dna/_ops/purge-run; writes Customer.visible_match_count on both sides."
    algorithm: aggregation
    formula: |
      Customer.visible_match_count =
          count( RelativeMatch WHERE status = ACTIVE
                 AND (customer_a_id = customer.id OR customer_b_id = customer.id) )
      # INVARIANT Q2 (conserved quantity):
      #   SUM over all Customers of visible_match_count
      #     == 2 * count(RelativeMatch WHERE status = ACTIVE)
      # This must hold after every consent withdraw (forward) and re-grant (compensating).
    input_set: "RelativeMatch rows with status = ACTIVE only. SUPPRESSED and PURGED rows are excluded."
    constants: {}
    precision: "Integer, floored at 0."

  # --- health traits --------------------------------------------------------
  - name: health_trait_count
    trigger: "POST /dna/customers/{id}/reports with report_type=HEALTH_TRAIT (fires on the Report DRAFT -> PUBLISHED auto-transition; writes Report.trait_count)"
    algorithm: aggregation
    formula: |
      Report.trait_count = count( m in Sample.genotype_markers WHERE m <= HEALTH_TRAIT_MARKER_CEILING )
      # composition stays [] and residual_population stays null for HEALTH_TRAIT reports.
    input_set: "Sample.genotype_markers of the source sample selected by report_source_sample."
    constants:
      HEALTH_TRAIT_MARKER_CEILING: 12
    precision: "Integer."

  # --- selectors ------------------------------------------------------------
  - name: report_source_sample
    trigger: "POST /dna/customers/{id}/reports and POST /dna/customers/{id}/matches/recompute — picks the Sample a report/match is computed from; writes Report.sample_id"
    algorithm: chronological
    formula: |
      # (a) eligibility filter: Sample.status == GENOTYPED
      #     AND the Sample's Kit.customer_id == <the customer in question>
      #     AND the Sample's Kit.status == PROCESSED
      # (b) ranking expression: Sample.created_at DESC   (most recently created sample wins)
      # (c) tie-break (identical created_at): Sample.call_rate DESC
      # (d) empty candidate set: ERR_DNA_NOT_READY (409) on the reports endpoint;
      #     on matches/recompute the same ERR_DNA_NOT_READY is raised for the acting
      #     customer, and a counterpart with an empty candidate set is silently skipped.
      # Sample.id is NEVER an input to this selector.
    input_set: "Samples reachable from the customer through Kit.customer_id."
    constants: {}
    precision: "n/a"

  - name: hint_root_person
    trigger: "POST /dna/customers/{id}/matches/recompute — picks the TreePerson a DNA_TREE RecordHint is attached to; writes RecordHint.person_id"
    algorithm: chronological
    formula: |
      # tree selection:
      #   (a) eligibility: FamilyTree.customer_id == <the side's customer id> AND status == ACTIVE
      #   (b) ranking: FamilyTree.created_at ASC   (oldest active tree wins)
      #   (c) tie-break: FamilyTree.name ASC
      #   (d) empty: no hint is created for that side (silent skip, not an error)
      # root-person selection within the chosen tree:
      #   (a) eligibility: TreePerson.tree_id == tree.id AND status == ACTIVE
      #                    AND father_id IS NULL AND mother_id IS NULL
      #   (b) ranking: TreePerson.created_at ASC
      #   (c) tie-break: TreePerson.surname ASC
      #   (d) empty: no hint is created for that side (silent skip, not an error)
      # FamilyTree.id and TreePerson.id are NEVER inputs to this selector.
    input_set: "The side's ACTIVE FamilyTrees and their ACTIVE root TreePersons."
    constants: {}
    precision: "n/a"

  - name: purge_schedule
    trigger: "POST /dna/data-requests/{id}/decide with decision=APPROVE and request_type=DELETE; executed by POST /dna/_ops/purge-run"
    algorithm: threshold
    formula: |
      DataRequest.scheduled_purge_at = <clock now at decision> + PURGE_GRACE_DAYS (7) days

      # POST /dna/_ops/purge-run:
      #   (a) eligibility: DataRequest.status == SCHEDULED
      #                    AND scheduled_purge_at <= <clock now>   (inclusive boundary)
      #   (b) processing order: DataRequest.created_at ASC
      #   (c) tie-break (identical created_at): DataRequest.customer_id's Customer.email ASC
      #   (d) empty eligible set: purged_count = 0, completed_request_ids = []
      # DataRequest.id is NEVER an input to the ordering.
    input_set: "DataRequests with status = SCHEDULED. PENDING, CANCELLED, REJECTED and COMPLETED requests are excluded."
    constants:
      PURGE_GRACE_DAYS: 7
    precision: "n/a"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority — LOWEST number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of {Customer, LabTechnician, PrivacyOfficer, PlatformAdmin}"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every resource id in the path exists, validated left-to-right"
    error_id: "ERR_CUSTOMER_NOT_FOUND | ERR_SUBSCRIPTION_NOT_FOUND | ERR_KIT_NOT_FOUND | ERR_SAMPLE_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_INSTRUMENT_NOT_FOUND | ERR_CONSENT_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_MATCH_NOT_FOUND | ERR_TREE_NOT_FOUND | ERR_PERSON_NOT_FOUND | ERR_HINT_NOT_FOUND | ERR_DATA_REQUEST_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: existence
    check: "Every foreign-key id in the request body resolves to an existing entity (customer_id, tier_id-equivalents, instrument_id, sample_ids[], tree_id, father_id, mother_id, linked_customer_id)"
    error_id: "ERR_CUSTOMER_NOT_FOUND | ERR_INSTRUMENT_NOT_FOUND | ERR_SAMPLE_NOT_FOUND | ERR_TREE_NOT_FOUND | ERR_PERSON_NOT_FOUND"
    http_status: 404
    applies_to: "POST /dna/subscriptions, POST /dna/kits, POST /dna/lab-batches, POST /dna/consent-grants, POST /dna/family-trees, POST /dna/tree-people, POST /dna/data-requests"

  - priority: 5
    category: auth
    check: "A Customer may only act on resources whose owning Customer.id equals X-User-ID (own subscriptions, kits, consent grants, reports, matches, trees, persons, hints, data requests)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all Customer-role endpoints"

  - priority: 6
    category: business_constraint
    check: "Request body is well-formed: required fields present, enums in range, numbers in range (dna_yield_ng >= 0, call_rate in [0,1], amount_cents > 0, birth_year > 0), sample_results has exactly one entry per batch member, email unique on customer create"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 7
    category: state
    check: "OCC: body.expected_customer_version == Customer.version (reports) / body.expected_subscription_version == Subscription.version (change-tier)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /dna/customers/{id}/reports, POST /dna/subscriptions/{id}/change-tier"

  - priority: 8
    category: state
    check: "The target Customer (or the owning Customer of the target resource) has account_status != PURGED"
    error_id: ERR_CUSTOMER_PURGED
    http_status: 409
    applies_to: "all write endpoints that touch a Customer-owned resource"

  - priority: 9
    category: state
    check: "The target resource is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 10
    category: state
    check: "Kit.status == ORDERED when activating"
    error_id: ERR_BARCODE_ALREADY_ACTIVATED
    http_status: 409
    applies_to: "POST /dna/kits/{id}/activate"

  - priority: 11
    category: state
    check: "Customer.dna_status == DNA_READY (i.e. report_source_sample yields a GENOTYPED sample)"
    error_id: ERR_DNA_NOT_READY
    http_status: 409
    applies_to: "POST /dna/customers/{id}/reports, POST /dna/customers/{id}/matches/recompute"

  - priority: 12
    category: state
    check: "Sample.extraction_attempts < MAX_EXTRACTION_ATTEMPTS (3) when requeuing a QC_FAILED sample"
    error_id: ERR_EXTRACTION_ATTEMPTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /dna/samples/{id}/requeue"

  - priority: 13
    category: state
    check: "LabBatch.member_count >= 1 when starting a batch (empty-set boundary)"
    error_id: ERR_EMPTY_BATCH
    http_status: 422
    applies_to: "POST /dna/lab-batches/{id}/start"

  - priority: 14
    category: business_safety
    check: "Consent gate. report_type=HEALTH_TRAIT requires an ACTIVE HEALTH_TRAITS ConsentGrant covering <clock now>; variant=FINAL requires an ACTIVE RESEARCH ConsentGrant covering <clock now>; matches/recompute requires Customer.matching_opt_in == true."
    error_id: ERR_CONSENT_REQUIRED
    http_status: 403
    applies_to: "POST /dna/customers/{id}/reports, POST /dna/customers/{id}/matches/recompute"

  - priority: 15
    category: business_referential
    check: "Every sample_id in POST /dna/lab-batches has Sample.status == EXTRACTED and its Kit.chip_version == the instrument's chip_version"
    error_id: ERR_SAMPLE_NOT_READY
    http_status: 409
    applies_to: "POST /dna/lab-batches"

  - priority: 16
    category: business_referential
    check: "LabInstrument.status == ONLINE"
    error_id: ERR_INSTRUMENT_OFFLINE
    http_status: 409
    applies_to: "POST /dna/lab-batches, POST /dna/lab-batches/{id}/start"

  - priority: 17
    category: business_temporal
    check: "CLOSED-interval consent overlap: the new grant's [effective_from, effective_until] must not intersect any ACTIVE ConsentGrant for the same (customer_id, scope). Touching endpoints (new.effective_from == existing.effective_until) DO intersect and are rejected."
    error_id: ERR_CONSENT_OVERLAP
    http_status: 409
    applies_to: "POST /dna/consent-grants"

  - priority: 18
    category: business_temporal
    check: "Consent cooling-off buffer: if any WITHDRAWN ConsentGrant exists for the same (customer_id, scope), then body.effective_from >= max(withdrawn_at) + CONSENT_COOLING_OFF_HOURS (24h). The boundary is inclusive: exactly +24h is accepted."
    error_id: ERR_CONSENT_COOLING_OFF
    http_status: 409
    applies_to: "POST /dna/consent-grants"

  - priority: 19
    category: business_temporal
    check: "HALF-OPEN instrument-window overlap: the new batch's [run_start_at, run_end_at) must not intersect the window of any LabBatch on the same instrument with status IN {OPEN, RUNNING, FINALIZED}. Back-to-back windows (new.run_start_at == existing.run_end_at) do NOT intersect and are accepted. run_end_at must be > run_start_at."
    error_id: ERR_BATCH_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /dna/lab-batches"

  - priority: 20
    category: business_constraint
    check: "body.barcode == Kit.barcode"
    error_id: ERR_BARCODE_MISMATCH
    http_status: 422
    applies_to: "POST /dna/kits/{id}/activate"

  - priority: 21
    category: business_constraint
    check: "father_id / mother_id belong to the same tree_id and do not create a cycle in the parent graph (a person may not be its own ancestor)"
    error_id: ERR_TREE_CYCLE
    http_status: 422
    applies_to: "POST /dna/tree-people"

  - priority: 22
    category: business_constraint
    check: "FamilyTree.person_count + 1 <= TIER_TREE_PERSON_LIMIT[Subscription.tier] (FREE: 3, PLUS: 250, PRO: 999999). The limit counts ACTIVE TreePersons in the tree only."
    error_id: ERR_TREE_PERSON_LIMIT
    http_status: 422
    applies_to: "POST /dna/tree-people, POST /dna/record-hints/{id}/accept"

  - priority: 23
    category: business_constraint
    check: "The customer has no DataRequest with status IN {PENDING, SCHEDULED}"
    error_id: ERR_PENDING_DATA_REQUEST
    http_status: 409
    applies_to: "POST /dna/data-requests"

  - priority: 24
    category: business_fiscal
    check: "The owning Customer's Subscription has access_status IN {ACTIVE, GRACE}. For report_type=HEALTH_TRAIT the tier must additionally be PLUS or PRO (TIER_HEALTH_REPORTS)."
    error_id: ERR_SUBSCRIPTION_LOCKED
    http_status: 402
    applies_to: "POST /dna/kits/{id}/activate, POST /dna/customers/{id}/reports, POST /dna/subscriptions/{id}/change-tier"

  - priority: 25
    category: business_fiscal
    check: "Customer.wallet_credit_cents >= tier_change_charge.charge_total_cents"
    error_id: ERR_INSUFFICIENT_CREDIT
    http_status: 402
    applies_to: "POST /dna/subscriptions/{id}/change-tier"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Customer -----------------------------------------------------------
  - method: POST
    path: "/dna/customers"
    description: "Register a customer account."
    roles: [PlatformAdmin]
    code: 201
    input: [email, display_name]
    output: Customer
    side_effects: ["Customer created with account_status=ACTIVE, dna_status=NO_SAMPLE, wallet_credit_cents=0, visible_match_count=0, version=1"]

  - method: GET
    path: "/dna/customers/{id}"
    description: "Read a customer, including wallet_credit_cents, dna_status, the three consent flags, visible_match_count and version (the OCC handle for report generation)."
    roles: [Customer, PlatformAdmin, PrivacyOfficer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/dna/customers/{id}/credits"
    description: "Operator credit adjustment — tops up the customer's store credit."
    roles: [PlatformAdmin]
    code: 200
    input: [amount_cents]
    output: Customer
    side_effects: ["increment Customer.wallet_credit_cents by amount_cents", "increments Customer.version by 1"]

  # ---- Subscription -------------------------------------------------------
  - method: POST
    path: "/dna/subscriptions"
    description: "Open a subscription for a customer. current_period_start = <clock now>, current_period_end = +30 days."
    roles: [Customer, PlatformAdmin]
    code: 201
    input: [customer_id, tier]
    output: Subscription
    side_effects: ["Subscription created with billing_status=CURRENT, access_status=ACTIVE, lifetime_charged_cents=0"]

  - method: GET
    path: "/dna/subscriptions/{id}"
    description: "Read a subscription, including both state dimensions, lifetime_charged_cents and version (the OCC handle for change-tier)."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: GET
    path: "/dna/subscriptions"
    description: "List subscriptions, filterable by owning customer and tier."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["customer_id?", "tier?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []

  - method: POST
    path: "/dna/subscriptions/{id}/change-tier"
    description: "Change the subscription tier. Upgrades apply immediately and are charged via tier_change_charge; downgrades are deferred into pending_tier at zero charge. OCC-guarded."
    roles: [Customer]
    code: 200
    input: [new_tier, expected_subscription_version]
    output: Subscription
    side_effects:
      - "run tier_change_charge; debit Customer.wallet_credit_cents by charge_total_cents"
      - "increment Subscription.lifetime_charged_cents by charge_total_cents; set last_change_charge_cents and last_change_from_tier"
      - "increments Subscription.version by 1"

  - method: POST
    path: "/dna/subscriptions/{id}/revert-change"
    description: "Compensating action for the most recent change-tier: refunds last_change_charge_cents, restores last_change_from_tier and clears pending_tier."
    roles: [Customer]
    code: 200
    input: []
    output: Subscription
    side_effects:
      - "credit Customer.wallet_credit_cents += last_change_charge_cents"
      - "decrement Subscription.lifetime_charged_cents by last_change_charge_cents"
      - "restore Subscription.tier; clear pending_tier, last_change_charge_cents, last_change_from_tier"
      - "increments Subscription.version by 1"

  - method: POST
    path: "/dna/subscriptions/{id}/billing-event"
    description: "Apply a billing event. PAYMENT_FAILED / PAYMENT_SUCCEEDED / CANCEL drive the two independent state dimensions; CANCEL also runs subscription_close_refund."
    roles: [PlatformAdmin]
    code: 200
    input: [event_type]
    output: Subscription
    side_effects:
      - "billing_status and access_status advance independently per §1.2"
      - "on CANCEL: credit Customer.wallet_credit_cents by subscription_close_refund"

  # ---- Kit ----------------------------------------------------------------
  - method: POST
    path: "/dna/kits"
    description: "Order a DNA kit. The server mints the activation barcode and returns it."
    roles: [Customer]
    code: 201
    input: [customer_id, chip_version]
    output: Kit
    side_effects: ["Kit created with status=ORDERED, price_cents=9900 and a unique server-minted barcode"]

  - method: GET
    path: "/dna/kits/{id}"
    description: "Read a kit."
    roles: [Customer, PlatformAdmin, LabTechnician]
    code: 200
    input: []
    output: Kit
    side_effects: []

  - method: GET
    path: "/dna/kits"
    description: "List kits, filterable by owning customer."
    roles: [Customer, PlatformAdmin, LabTechnician]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: Kit[]
    side_effects: []

  - method: POST
    path: "/dna/kits/{id}/activate"
    description: "Activate a kit by echoing its barcode. Requires the owner's subscription access_status IN {ACTIVE, GRACE}."
    roles: [Customer]
    code: 200
    input: [barcode]
    output: Kit
    side_effects: ["Kit ORDERED -> ACTIVATED; set activated_at"]

  - method: POST
    path: "/dna/kits/{id}/receive"
    description: "Lab records receipt of the swab and opens a Sample."
    roles: [LabTechnician]
    code: 201
    input: []
    output: Sample
    side_effects: ["Kit ACTIVATED -> RECEIVED", "Sample created in RECEIVED", "Customer.dna_status NO_SAMPLE -> PROCESSING"]

  # ---- Sample -------------------------------------------------------------
  - method: GET
    path: "/dna/samples/{id}"
    description: "Read a sample, including extraction_attempts, call_rate, population_scores and genotype_markers."
    roles: [LabTechnician, PlatformAdmin, Customer]
    code: 200
    input: []
    output: Sample
    side_effects: []

  - method: GET
    path: "/dna/samples"
    description: "List samples, filterable by kit and by batch."
    roles: [LabTechnician, PlatformAdmin, Customer]
    code: 200
    input: ["kit_id?", "batch_id?", "status?", "limit?", "offset?"]
    output: Sample[]
    side_effects: []

  - method: POST
    path: "/dna/samples/{id}/extract"
    description: "Record a DNA extraction attempt. Yield >= 200.0 ng passes QC; below that the sample fails QC, and the third failed attempt is terminal."
    roles: [LabTechnician]
    code: 200
    input: [dna_yield_ng]
    output: Sample
    side_effects:
      - "increment Sample.extraction_attempts by 1"
      - "RECEIVED -> EXTRACTED | QC_FAILED | FAILED_TERMINAL"
      - "on FAILED_TERMINAL: cascade Kit -> VOID -> wallet refund of 9900 and Customer.dna_status = NO_SAMPLE"

  - method: POST
    path: "/dna/samples/{id}/requeue"
    description: "Return a QC_FAILED sample to the head of the pipeline (the cycle edge)."
    roles: [LabTechnician]
    code: 200
    input: []
    output: Sample
    side_effects: ["Sample QC_FAILED -> RECEIVED", "clear batch_id and call_rate"]

  # ---- Lab instrument / batch ---------------------------------------------
  - method: POST
    path: "/dna/lab-instruments"
    description: "Register a genotyping instrument."
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "chip_version", "status?"]
    output: LabInstrument
    side_effects: []

  - method: GET
    path: "/dna/lab-instruments/{id}"
    description: "Read an instrument."
    roles: [PlatformAdmin, LabTechnician]
    code: 200
    input: []
    output: LabInstrument
    side_effects: []

  - method: POST
    path: "/dna/lab-batches"
    description: "Create a genotyping batch occupying [run_start_at, run_end_at) on an instrument (half-open; back-to-back batches are legal) and enqueue EXTRACTED samples into it."
    roles: [LabTechnician]
    code: 201
    input: [instrument_id, run_start_at, run_end_at, sample_ids]
    output: LabBatch
    side_effects: ["each listed Sample EXTRACTED -> QUEUED with batch_id set", "LabBatch.member_count = len(sample_ids)"]

  - method: GET
    path: "/dna/lab-batches/{id}"
    description: "Read a batch, including member_count and pass_rate."
    roles: [LabTechnician, PlatformAdmin]
    code: 200
    input: []
    output: LabBatch
    side_effects: []

  - method: GET
    path: "/dna/lab-batches"
    description: "List batches, filterable by instrument."
    roles: [LabTechnician, PlatformAdmin]
    code: 200
    input: ["instrument_id?", "status?", "limit?", "offset?"]
    output: LabBatch[]
    side_effects: []

  - method: POST
    path: "/dna/lab-batches/{id}/start"
    description: "Start the genotyping run. Rejects an empty batch (ERR_EMPTY_BATCH)."
    roles: [LabTechnician]
    code: 200
    input: []
    output: LabBatch
    side_effects: ["LabBatch OPEN -> RUNNING", "each member Sample QUEUED -> GENOTYPING"]

  - method: POST
    path: "/dna/lab-batches/{id}/finalize"
    description: "Finalize the run with one result per member sample. sample_results entries are { sample_id, call_rate, population_scores, genotype_markers }."
    roles: [LabTechnician]
    code: 200
    input: [sample_results]
    output: LabBatch
    side_effects:
      - "LabBatch RUNNING -> FINALIZED; set pass_rate = lab_batch_pass_rate"
      - "each member Sample GENOTYPING -> GENOTYPED | QC_FAILED | FAILED_TERMINAL"
      - "on GENOTYPED: cascade Kit -> PROCESSED -> Customer.dna_status = DNA_READY"

  - method: POST
    path: "/dna/lab-batches/{id}/abort"
    description: "Abort an OPEN or RUNNING batch and release its members back to EXTRACTED."
    roles: [LabTechnician]
    code: 200
    input: []
    output: LabBatch
    side_effects: ["LabBatch -> ABORTED", "each member Sample -> EXTRACTED with batch_id cleared", "LabBatch.member_count = 0"]

  # ---- Consent ------------------------------------------------------------
  - method: POST
    path: "/dna/consent-grants"
    description: "Grant a consent scope over a CLOSED window. Enforces closed-interval overlap and the 24h cooling-off buffer after a prior withdrawal. A RELATIVE_MATCHING grant covering now reactivates SUPPRESSED matches."
    roles: [Customer]
    code: 201
    input: [customer_id, scope, effective_from, effective_until]
    output: ConsentGrant
    side_effects:
      - "recompute Customer.matching_opt_in / research_opt_in / health_opt_in"
      - "RELATIVE_MATCHING: SUPPRESSED matches whose other side is opted in return to ACTIVE and both sides' visible_match_count are incremented"

  - method: GET
    path: "/dna/consent-grants/{id}"
    description: "Read a consent grant."
    roles: [Customer, PrivacyOfficer]
    code: 200
    input: []
    output: ConsentGrant
    side_effects: []

  - method: GET
    path: "/dna/consent-grants"
    description: "List consent grants, filterable by customer, scope and status."
    roles: [Customer, PrivacyOfficer, PlatformAdmin]
    code: 200
    input: ["customer_id?", "scope?", "status?", "limit?", "offset?"]
    output: ConsentGrant[]
    side_effects: []

  - method: POST
    path: "/dna/consent-grants/{id}/withdraw"
    description: "Withdraw a consent grant. RELATIVE_MATCHING withdrawal drives the four-hop suppression cascade; HEALTH_TRAITS and RESEARCH withdrawal revoke the reports they gate."
    roles: [Customer, PrivacyOfficer]
    code: 200
    input: []
    output: ConsentGrant
    side_effects:
      - "ConsentGrant ACTIVE -> WITHDRAWN; set withdrawn_at"
      - "cascade: Customer.matching_opt_in=false -> RelativeMatch SUPPRESSED -> visible_match_count-- on both sides -> RecordHint WITHDRAWN and TreePerson.hint_count--"
      - "HEALTH_TRAITS: PUBLISHED HEALTH_TRAIT reports -> REVOKED; RESEARCH: PUBLISHED FINAL-variant reports -> REVOKED"

  # ---- Reports ------------------------------------------------------------
  - method: POST
    path: "/dna/customers/{id}/reports"
    description: "Generate and publish a report from the customer's GENOTYPED sample. Consent-gated (HEALTH_TRAIT needs HEALTH_TRAITS consent; variant FINAL needs RESEARCH consent). OCC-guarded on the customer's version."
    roles: [Customer]
    code: 201
    input: [report_type, variant, expected_customer_version]
    output: Report
    side_effects:
      - "run ethnicity_composition (ETHNICITY) or health_trait_count (HEALTH_TRAIT)"
      - "Report DRAFT -> PUBLISHED; the prior PUBLISHED report of the same report_type -> SUPERSEDED"
      - "increments Customer.version by 1"

  - method: GET
    path: "/dna/reports/{id}"
    description: "Read a report, including composition, residual_population and trait_count."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Report
    side_effects: []

  - method: GET
    path: "/dna/reports"
    description: "List reports, filterable by customer, source sample, type and status."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["customer_id?", "sample_id?", "report_type?", "status?", "limit?", "offset?"]
    output: Report[]
    side_effects: []

  # ---- Relative matching --------------------------------------------------
  - method: POST
    path: "/dna/customers/{id}/matches/recompute"
    description: "Recompute the customer's DNA-relative matches against every other opted-in, DNA_READY customer. Returns the customer's matches after the run."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: RelativeMatch[]
    side_effects:
      - "run shared_segment_scan + relative_match_confidence per candidate; create/update a RelativeMatch when shared_cm >= 8.00"
      - "increment visible_match_count on both sides per new ACTIVE match"
      - "create a PENDING DNA_TREE RecordHint on each side's root TreePerson (when one exists) and increment its hint_count"

  - method: GET
    path: "/dna/relative-matches/{id}"
    description: "Read a relative match."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: RelativeMatch
    side_effects: []

  - method: GET
    path: "/dna/relative-matches"
    description: "List relative matches, filterable by either side of the pair and by status."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["customer_a_id?", "customer_b_id?", "status?", "limit?", "offset?"]
    output: RelativeMatch[]
    side_effects: []

  # ---- Family tree --------------------------------------------------------
  - method: POST
    path: "/dna/family-trees"
    description: "Create a family tree."
    roles: [Customer]
    code: 201
    input: [customer_id, name]
    output: FamilyTree
    side_effects: ["FamilyTree created ACTIVE with person_count=0"]

  - method: GET
    path: "/dna/family-trees/{id}"
    description: "Read a family tree, including person_count."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: FamilyTree
    side_effects: []

  - method: GET
    path: "/dna/family-trees"
    description: "List family trees, filterable by owner."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: FamilyTree[]
    side_effects: []

  - method: POST
    path: "/dna/tree-people"
    description: "Add a person to a tree. Enforces the tier person limit and rejects parent links that create a cycle."
    roles: [Customer]
    code: 201
    input: ["tree_id", "given_name", "surname", "birth_year?", "father_id?", "mother_id?", "linked_customer_id?"]
    output: TreePerson
    side_effects: ["increment FamilyTree.person_count by 1"]

  - method: GET
    path: "/dna/tree-people/{id}"
    description: "Read a tree person, including hint_count."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: TreePerson
    side_effects: []

  - method: GET
    path: "/dna/tree-people"
    description: "List tree persons, filterable by tree, by either parent link, and by linked customer."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["tree_id?", "father_id?", "mother_id?", "linked_customer_id?", "status?", "limit?", "offset?"]
    output: TreePerson[]
    side_effects: []

  # ---- Record hints -------------------------------------------------------
  - method: GET
    path: "/dna/record-hints/{id}"
    description: "Read a record hint."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: RecordHint
    side_effects: []

  - method: GET
    path: "/dna/record-hints"
    description: "List record hints, filterable by person, by source match and by status. This is the only discovery channel for hints, which are only ever created by the matching cascade."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["person_id?", "source_match_id?", "status?", "limit?", "offset?"]
    output: RecordHint[]
    side_effects: []

  - method: POST
    path: "/dna/record-hints/{id}/accept"
    description: "Accept a DNA_TREE hint: adds the matched relative to the tree as a new TreePerson."
    roles: [Customer]
    code: 200
    input: []
    output: RecordHint
    side_effects:
      - "RecordHint PENDING -> ACCEPTED; decrement TreePerson.hint_count"
      - "create a TreePerson linked to the counterpart customer; increment FamilyTree.person_count"

  # ---- Privacy ------------------------------------------------------------
  - method: POST
    path: "/dna/data-requests"
    description: "File a data EXPORT or DELETE request. Only one open request per customer."
    roles: [Customer]
    code: 201
    input: [customer_id, request_type]
    output: DataRequest
    side_effects: ["DataRequest created PENDING"]

  - method: GET
    path: "/dna/data-requests/{id}"
    description: "Read a data request, including scheduled_purge_at and export_url."
    roles: [Customer, PrivacyOfficer]
    code: 200
    input: []
    output: DataRequest
    side_effects: []

  - method: GET
    path: "/dna/data-requests"
    description: "List data requests, filterable by customer and status."
    roles: [Customer, PrivacyOfficer, PlatformAdmin]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: DataRequest[]
    side_effects: []

  - method: POST
    path: "/dna/data-requests/{id}/decide"
    description: "Privacy officer decision. APPROVE completes an EXPORT immediately (export_url minted) and SCHEDULES a DELETE for <clock now> + 7 days. REJECT closes the request."
    roles: [PrivacyOfficer]
    code: 200
    input: [decision]
    output: DataRequest
    side_effects: ["set reviewed_by", "EXPORT -> COMPLETED with export_url; DELETE -> SCHEDULED with scheduled_purge_at"]

  - method: POST
    path: "/dna/data-requests/{id}/cancel"
    description: "Customer cancels their own PENDING or SCHEDULED request (before scheduled_purge_at)."
    roles: [Customer]
    code: 200
    input: []
    output: DataRequest
    side_effects: ["DataRequest -> CANCELLED"]

  # ---- Ops / test-driving -------------------------------------------------
  - method: POST
    path: "/dna/_ops/purge-run"
    description: "Ops checkpoint: execute every SCHEDULED DELETE DataRequest whose scheduled_purge_at <= <clock now>, in created_at ASC order."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ purged_count: integer, completed_request_ids: string[] }"
    side_effects:
      - "each eligible DataRequest SCHEDULED -> COMPLETED"
      - "Customer -> PURGED; ACTIVE ConsentGrants -> WITHDRAWN; Reports -> REVOKED; RelativeMatches -> PURGED with counterpart visible_match_count and RecordHint cascades"

  - method: POST
    path: "/dna/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock starts at the fixed default 2026-05-01T00:00:00Z on server startup and NEVER falls back to wall-clock time; every deadline, window and expiry rule reads this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["the logical clock moves to to_iso8601; no entity is mutated and no scheduled action fires implicitly"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role / X-User-ID header missing, or X-User-Role is not a declared role."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the endpoint's §1.5 roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "A Customer acts on a resource owned by a different Customer."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, out-of-range enum/number, duplicate email, or sample_results that does not cover exactly the batch's members."
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "customer_id (path or body) does not resolve."
  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "Subscription id does not resolve."
  - id: ERR_KIT_NOT_FOUND
    http: 404
    condition: "Kit id does not resolve."
  - id: ERR_SAMPLE_NOT_FOUND
    http: 404
    condition: "Sample id (path or a sample_ids / sample_results entry) does not resolve."
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "LabBatch id does not resolve."
  - id: ERR_INSTRUMENT_NOT_FOUND
    http: 404
    condition: "LabInstrument id does not resolve."
  - id: ERR_CONSENT_NOT_FOUND
    http: 404
    condition: "ConsentGrant id does not resolve."
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "Report id does not resolve."
  - id: ERR_MATCH_NOT_FOUND
    http: 404
    condition: "RelativeMatch id does not resolve."
  - id: ERR_TREE_NOT_FOUND
    http: 404
    condition: "FamilyTree id does not resolve."
  - id: ERR_PERSON_NOT_FOUND
    http: 404
    condition: "TreePerson id (path, father_id or mother_id) does not resolve."
  - id: ERR_HINT_NOT_FOUND
    http: 404
    condition: "RecordHint id does not resolve."
  - id: ERR_DATA_REQUEST_NOT_FOUND
    http: 404
    condition: "DataRequest id does not resolve."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_customer_version != Customer.version on report generation, or expected_subscription_version != Subscription.version on change-tier."
  - id: ERR_CUSTOMER_PURGED
    http: 409
    condition: "A write targets a Customer (or a Customer-owned resource) whose account_status is PURGED."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is not in a state from which the requested transition is declared."
  - id: ERR_BARCODE_ALREADY_ACTIVATED
    http: 409
    condition: "Kit.status is not ORDERED when activate is called."
  - id: ERR_BARCODE_MISMATCH
    http: 422
    condition: "body.barcode does not equal Kit.barcode."
  - id: ERR_DNA_NOT_READY
    http: 409
    condition: "The customer has no GENOTYPED sample (dna_status != DNA_READY) when a report or a match recompute is requested."
  - id: ERR_EXTRACTION_ATTEMPTS_EXHAUSTED
    http: 409
    condition: "Requeue attempted on a QC_FAILED sample whose extraction_attempts has reached MAX_EXTRACTION_ATTEMPTS (3)."
  - id: ERR_EMPTY_BATCH
    http: 422
    condition: "POST /dna/lab-batches/{id}/start on a batch with member_count == 0."
  - id: ERR_CONSENT_REQUIRED
    http: 403
    condition: "HEALTH_TRAIT report without an ACTIVE HEALTH_TRAITS grant, FINAL-variant report without an ACTIVE RESEARCH grant, or matches/recompute with matching_opt_in == false."
  - id: ERR_CONSENT_OVERLAP
    http: 409
    condition: "A new grant's CLOSED window intersects an ACTIVE grant for the same (customer_id, scope) — touching endpoints included."
  - id: ERR_CONSENT_COOLING_OFF
    http: 409
    condition: "A new grant's effective_from is less than 24h after the latest withdrawn_at for the same (customer_id, scope)."
  - id: ERR_SAMPLE_NOT_READY
    http: 409
    condition: "A sample listed in POST /dna/lab-batches is not EXTRACTED, or its Kit.chip_version does not match the instrument's chip_version."
  - id: ERR_INSTRUMENT_OFFLINE
    http: 409
    condition: "The batch's LabInstrument.status is MAINTENANCE."
  - id: ERR_BATCH_WINDOW_OVERLAP
    http: 409
    condition: "The new batch's half-open [run_start_at, run_end_at) window intersects an existing OPEN/RUNNING/FINALIZED batch on the same instrument, or run_end_at <= run_start_at."
  - id: ERR_TREE_CYCLE
    http: 422
    condition: "father_id / mother_id would make a person its own ancestor, or points at a person in a different tree."
  - id: ERR_TREE_PERSON_LIMIT
    http: 422
    condition: "Adding a person would push FamilyTree.person_count above TIER_TREE_PERSON_LIMIT for the owner's subscription tier."
  - id: ERR_PENDING_DATA_REQUEST
    http: 409
    condition: "The customer already has a DataRequest with status PENDING or SCHEDULED."
  - id: ERR_SUBSCRIPTION_LOCKED
    http: 402
    condition: "The owning subscription's access_status is LOCKED or CANCELLED, or a HEALTH_TRAIT report is requested on a FREE tier."
  - id: ERR_INSUFFICIENT_CREDIT
    http: 402
    condition: "Customer.wallet_credit_cents is below the computed tier-change charge_total_cents."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "The DNA test subject and account owner. Acts only on their own resources."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /dna/kits"
      - "POST /dna/kits/{id}/activate"
      - "POST /dna/subscriptions/{id}/change-tier"
      - "POST /dna/subscriptions/{id}/revert-change"
      - "POST /dna/consent-grants"
      - "POST /dna/customers/{id}/reports"
      - "POST /dna/family-trees"
      - "POST /dna/tree-people"
      - "POST /dna/record-hints/{id}/accept"
      - "POST /dna/data-requests"
      - "POST /dna/data-requests/{id}/cancel"
    shared_operations:
      - "POST /dna/subscriptions (with PlatformAdmin)"
      - "POST /dna/consent-grants/{id}/withdraw (with PrivacyOfficer)"
      - "POST /dna/customers/{id}/matches/recompute (with PlatformAdmin)"
      - "GET reads of their own customers / subscriptions / kits / samples / consent-grants / reports / relative-matches / family-trees / tree-people / record-hints / data-requests"

  - name: LabTechnician
    description: "Lab operator. Owns the sample pipeline and the instrument/batch surface; never touches consent, reports, trees or billing."
    identity: "opaque"
    exclusive_operations:
      - "POST /dna/kits/{id}/receive"
      - "POST /dna/samples/{id}/extract"
      - "POST /dna/samples/{id}/requeue"
      - "POST /dna/lab-batches"
      - "POST /dna/lab-batches/{id}/start"
      - "POST /dna/lab-batches/{id}/finalize"
      - "POST /dna/lab-batches/{id}/abort"
    shared_operations:
      - "GET /dna/kits, GET /dna/kits/{id}, GET /dna/samples, GET /dna/samples/{id}, GET /dna/lab-batches, GET /dna/lab-batches/{id}, GET /dna/lab-instruments/{id}"

  - name: PrivacyOfficer
    description: "Privacy reviewer. Decides data export/delete requests and may withdraw a customer's consent on their behalf. Cannot generate reports or run matching."
    identity: "opaque"
    exclusive_operations:
      - "POST /dna/data-requests/{id}/decide"
    shared_operations:
      - "POST /dna/consent-grants/{id}/withdraw (with Customer)"
      - "GET /dna/customers/{id}, GET /dna/consent-grants, GET /dna/consent-grants/{id}, GET /dna/data-requests, GET /dna/data-requests/{id}"

  - name: PlatformAdmin
    description: "Operator. Registers customers and instruments, adjusts store credit, applies billing events, and runs the purge checkpoint and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /dna/customers"
      - "POST /dna/customers/{id}/credits"
      - "POST /dna/subscriptions/{id}/billing-event"
      - "POST /dna/lab-instruments"
      - "POST /dna/_ops/purge-run"
      - "POST /dna/_clock/set_current_utc"
    shared_operations:
      - "POST /dna/subscriptions (with Customer)"
      - "POST /dna/customers/{id}/matches/recompute (with Customer)"
      - "GET reads across customers, subscriptions, kits, samples, lab batches, instruments, consent grants, reports, relative matches, family trees, tree persons, record hints and data requests"
