  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: invalid_state_beats_return_window_closed_on_returns
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_RETURN_WINDOW_CLOSED]
        distinguishing_aspect: |
          A return is opened against an order that is only AUTHORIZED (not CAPTURED) AND whose product window is closed.
          state (priority 6, ERR_INVALID_STATE, 409) outranks business_temporal (priority 9, ERR_RETURN_WINDOW_CLOSED,
          422), so the server returns ERR_INVALID_STATE — a state-vs-business_temporal pairing.
        test_recipe:
          setup:
            - "An order is checked out (AUTHORIZED) but NOT captured; product window 1 day; clock advanced far past delivery so window would also be closed if reached."
            - "Order is not CAPTURED so /returns is not even defined → state error must win over the temporal error."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /customers"
              payload: { email: "c5a@x.com", full_name: "C5A" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /warehouses"
              payload: { code: "W5A", name: "Main", fulfillment_priority: 1 }
              as: StoreAdmin
              captures: { wh_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "S5A", title: "S5A", unit_price_cents: 2000, tax_rate_bps: 0, return_window_days: 1, final_sale: false }
              as: StoreAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /inventory"
              payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", on_hand_qty: 10 }
              as: StoreAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ol_id: $.data.id }
            - call: "GET /orders/${ord_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
            - call: "POST /orders/${ord_id}/checkout"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreAdmin
          trigger:
            - call: "POST /orders/${ord_id}/returns"
              payload: { reason: "NO_LONGER_WANTED", resolution: "REFUND", lines: [{ order_line_id: "${ol_id}", return_qty: 1 }] }
