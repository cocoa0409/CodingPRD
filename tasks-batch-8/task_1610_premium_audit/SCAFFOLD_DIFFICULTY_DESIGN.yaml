            - { call: "POST /auditors", payload: { full_name: "Ada Auditor", territory_states: ["CA"], level: "SENIOR" }, as: AuditManager, captures: { aud: "$.data.id" } }
            - { call: "POST /audit-selection-runs", payload: {}, as: AuditManager }
            - { call: "GET /audit-work-orders", payload: { policy_id: "${pol_a}" }, as: AuditManager, captures: { wo_a: "$.data[0].id" } }
            - { call: "GET /audit-work-orders", payload: { policy_id: "${pol_b}" }, as: AuditManager, captures: { wo_b: "$.data[0].id" } }
            - { call: "POST /audit-work-orders/${wo_a}/assign", payload: { auditor_id: "${aud}" }, as: AuditManager }
            - { call: "POST /audit-work-orders/${wo_b}/assign", payload: { auditor_id: "${aud}" }, as: AuditManager }
            - { call: "POST /audit-work-orders/${wo_a}/records-requests", payload: { request_type: "PAYROLL_SUMMARY" }, as: AuditManager }
            - { call: "POST /audit-work-orders/${wo_b}/records-requests", payload: { request_type: "PAYROLL_SUMMARY" }, as: AuditManager }
            - { call: "GET /audit-work-orders/${wo_a}", payload: {}, as: AuditManager, captures: { wo_a_v: "$.data.version" } }
            - { call: "POST /audit-work-orders/${wo_a}/appointments", payload: { scheduled_start: "2026-08-10T09:00:00Z", scheduled_end: "2026-08-10T11:00:00Z", location_type: "INSURED_PREMISES", expected_work_order_version: "${wo_a_v}" }, as: Auditor, as_user_id: "${aud}", captures: { appt_a: "$.data.id" } }
            - { call: "GET /audit-work-orders/${wo_b}", payload: {}, as: AuditManager, captures: { wo_b_v: "$.data.version" } }
          trigger:
            - { call: "POST /audit-work-orders/${wo_b}/appointments", payload: { scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", location_type: "INSURED_PREMISES", expected_work_order_version: "${wo_b_v}" }, as: Auditor, as_user_id: "${aud}", captures: { err: "$.data.error_id" } }
          assert:
            - "creation fails with error_id ERR_APPOINTMENT_OUTSIDE_WINDOW (business_temporal, priority 9)"
            - "the response error_id is NOT ERR_APPOINTMENT_OVERLAP even though 2026-08-10T10:00-12:00Z overlaps appointment ${appt_a} (09:00-11:00Z) on the shared auditor's calendar"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: selection_tier_premium_threshold_exact
        grounds:
          - calculations.audit_selection_tier
          - entities.AuditSelectionRun.fields.physical_count
        distinguishing_aspect: |
          Premium-threshold boundary (inclusive >=) on POST /audit-selection-runs: a policy at exactly 1000000 cents
          selects PHYSICAL while 999999 cents selects VOLUNTARY_REPORT; an unexpired policy is not evaluated at all.
        test_recipe:
          setup:
            - "class code 8810 non-high-hazard; policies: WC-EDGE-PHYS est 1000000 expiring 2026-07-31; WC-EDGE-VOL est 999999 expiring 2026-07-31; WC-EXEMPT est 499999 expiring 2026-07-31; WC-FUTURE est 5000000 expiring 2026-12-31 (not expired at default clock 2026-08-01)"
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 40, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_a: "$.data.id" } }
            - { call: "POST /policies", payload: { policy_number: "WC-EDGE-PHYS", insured_name: "Nu", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 1000000, minimum_premium_cents: 100000, payroll_estimate_dollars: 100000, experience_mod_factor: 1.00, class_code_ids: ["${cc_a}"] }, as: Underwriter, captures: { pol_p: "$.data.id" } }
            - { call: "POST /policies", payload: { policy_number: "WC-EDGE-VOL", insured_name: "Xi", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 999999, minimum_premium_cents: 100000, payroll_estimate_dollars: 100000, experience_mod_factor: 1.00, class_code_ids: ["${cc_a}"] }, as: Underwriter, captures: { pol_v: "$.data.id" } }
            - { call: "POST /policies", payload: { policy_number: "WC-EXEMPT", insured_name: "Omicron", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 499999, minimum_premium_cents: 100000, payroll_estimate_dollars: 100000, experience_mod_factor: 1.00, class_code_ids: ["${cc_a}"] }, as: Underwriter, captures: { pol_x: "$.data.id" } }
            - { call: "POST /policies", payload: { policy_number: "WC-FUTURE", insured_name: "Pi", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z", estimated_annual_premium_cents: 5000000, minimum_premium_cents: 100000, payroll_estimate_dollars: 100000, experience_mod_factor: 1.00, class_code_ids: ["${cc_a}"] }, as: Underwriter, captures: { pol_f: "$.data.id" } }
          trigger:
            - { call: "POST /audit-selection-runs", payload: {}, as: AuditManager, captures: { run_phys: "$.data.physical_count", run_vol: "$.data.voluntary_count", run_ex: "$.data.exempt_count", run_eval: "$.data.evaluated_count" } }
            - { call: "GET /audit-work-orders", payload: { policy_id: "${pol_p}" }, as: AuditManager, captures: { t_p: "$.data[0].audit_type" } }
            - { call: "GET /audit-work-orders", payload: { policy_id: "${pol_v}" }, as: AuditManager, captures: { t_v: "$.data[0].audit_type" } }
          assert:
            - "AuditSelectionRun.evaluated_count == 3 (WC-FUTURE not expired at clock 2026-08-01T00:00:00Z)"
            - "physical_count == 1, voluntary_count == 1, exempt_count == 1"
            - "WC-EDGE-PHYS (exactly 1000000 cents) gets audit_type PHYSICAL (inclusive >= threshold)"
            - "WC-EDGE-VOL (999999 cents) gets audit_type VOLUNTARY_REPORT"
            - "GET /audit-work-orders?policy_id=WC-EXEMPT returns an empty array (exempt: no work order, policy stays ACTIVE)"

      - name: dispute_window_thirty_days_exact
        grounds:
          - calculations.dispute_window
          - state_machines.AuditResult.ISSUED_to_DISPUTED
        distinguishing_aspect: |
          Time-elapsed boundary (inclusive <=) on POST /audit-results/{id}/disputes: filing at exactly
          issued_at + 30 days succeeds; one second later fails with ERR_DISPUTE_WINDOW_CLOSED.
        test_recipe:
          setup:
            - "WC policy WC-1200 (CA): VOLUNTARY_REPORT carried to ISSUED at exactly 2026-08-15T00:00:00Z (allocation 95000 on 8810, earned 38000, credit 562000); dispute window ends 2026-09-14T00:00:00Z"
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 40, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_a: "$.data.id" } }
            - { call: "POST /policies", payload: { policy_number: "WC-1200", insured_name: "Rho", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 600000, minimum_premium_cents: 10000, payroll_estimate_dollars: 100000, experience_mod_factor: 1.00, class_code_ids: ["${cc_a}"] }, as: Underwriter, captures: { pol: "$.data.id" } }
            - { call: "POST /auditors", payload: { full_name: "Ada Auditor", territory_states: ["CA"], level: "SENIOR" }, as: AuditManager, captures: { aud: "$.data.id" } }
            - { call: "POST /audit-selection-runs", payload: {}, as: AuditManager }
            - { call: "GET /audit-work-orders", payload: { policy_id: "${pol}" }, as: AuditManager, captures: { wo: "$.data[0].id" } }
            - { call: "POST /audit-work-orders/${wo}/assign", payload: { auditor_id: "${aud}" }, as: AuditManager }
            - { call: "POST /audit-work-orders/${wo}/records-requests", payload: { request_type: "PAYROLL_SUMMARY" }, as: AuditManager, captures: { req1: "$.data.id" } }
            - { call: "POST /records-requests/${req1}/receive", payload: {}, as: Auditor, as_user_id: "${aud}" }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { wo_v: "$.data.version" } }
            - { call: "POST /audit-work-orders/${wo}/payroll-allocations", payload: { class_code_id: "${cc_a}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", gross_payroll_dollars: 95000, expected_work_order_version: "${wo_v}" }, as: Auditor, as_user_id: "${aud}", captures: { al1: "$.data.id" } }
            - { call: "POST /payroll-allocations/${al1}/verify", payload: {}, as: Auditor, as_user_id: "${aud}" }
            - { call: "POST /audit-work-orders/${wo}/submit-draft", payload: {}, as: Auditor, as_user_id: "${aud}", captures: { res: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: AuditManager }
            - { call: "POST /audit-work-orders/${wo}/issue-result", payload: {}, as: AuditManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-14T00:00:00Z" }, as: AuditManager }
            - { call: "POST /audit-results/${res}/disputes", payload: { grounds: "PAYROLL_ERROR" }, as: Insured, as_user_id: "${pol}", captures: { dsp: "$.data.id", dsp_status: "$.data.status" } }
            - { call: "POST /disputes/${dsp}/start-review", payload: {}, as: AuditManager, as_user_id: "mgr-2" }
            - { call: "POST /disputes/${dsp}/overrule", payload: {}, as: AuditManager, as_user_id: "mgr-2" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-14T00:00:01Z" }, as: AuditManager }
            - { call: "POST /audit-results/${res}/disputes", payload: { grounds: "OTHER" }, as: Insured, as_user_id: "${pol}", captures: { err: "$.data.error_id" } }
          assert:
            - "dispute filed at exactly issued_at + 30 days (2026-09-14T00:00:00Z) succeeds: Dispute.${dsp}.status == FILED"
            - "after overrule restores ISSUED, filing at 2026-09-14T00:00:01Z fails with error_id ERR_DISPUTE_WINDOW_CLOSED"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: submit_draft_requires_all_records_terminal
        grounds:
          - state_machines.AuditWorkOrder.RECORDS_REQUESTED_to_RESULT_DRAFTED
          - entities.RecordsRequest.fields.status
          - errors[ERR_OPEN_RECORDS_REQUESTS]
        distinguishing_aspect: |
          Entity pair AuditWorkOrder x RecordsRequest: the work order's transition to RESULT_DRAFTED is gated on the
          states of its child records requests — one OPEN request blocks submit-draft with ERR_OPEN_RECORDS_REQUESTS;
          receiving it unblocks the same call.
        test_recipe:
          setup:
            - "WC policy WC-1400 (CA) -> VOLUNTARY_REPORT work order, auditor assigned; request PAYROLL_SUMMARY RECEIVED; request SUBCONTRACTOR_LIST still OPEN"
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 40, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_a: "$.data.id" } }
            - { call: "POST /policies", payload: { policy_number: "WC-1400", insured_name: "Sigma", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 600000, minimum_premium_cents: 10000, payroll_estimate_dollars: 100000, experience_mod_factor: 1.00, class_code_ids: ["${cc_a}"] }, as: Underwriter, captures: { pol: "$.data.id" } }
            - { call: "POST /auditors", payload: { full_name: "Ada Auditor", territory_states: ["CA"], level: "SENIOR" }, as: AuditManager, captures: { aud: "$.data.id" } }
            - { call: "POST /audit-selection-runs", payload: {}, as: AuditManager }
            - { call: "GET /audit-work-orders", payload: { policy_id: "${pol}" }, as: AuditManager, captures: { wo: "$.data[0].id" } }
            - { call: "POST /audit-work-orders/${wo}/assign", payload: { auditor_id: "${aud}" }, as: AuditManager }
            - { call: "POST /audit-work-orders/${wo}/records-requests", payload: { request_type: "PAYROLL_SUMMARY" }, as: AuditManager, captures: { req1: "$.data.id" } }
            - { call: "POST /audit-work-orders/${wo}/records-requests", payload: { request_type: "SUBCONTRACTOR_LIST" }, as: AuditManager, captures: { req2: "$.data.id" } }
            - { call: "POST /records-requests/${req1}/receive", payload: {}, as: Auditor, as_user_id: "${aud}" }
          trigger:
            - { call: "POST /audit-work-orders/${wo}/submit-draft", payload: {}, as: Auditor, as_user_id: "${aud}", captures: { err: "$.data.error_id" } }
            - { call: "POST /records-requests/${req2}/receive", payload: {}, as: Auditor, as_user_id: "${aud}" }
            - { call: "POST /audit-work-orders/${wo}/submit-draft", payload: {}, as: Auditor, as_user_id: "${aud}", captures: { res: "$.data.id", res_status: "$.data.status" } }
          assert:
            - "first submit-draft fails with error_id ERR_OPEN_RECORDS_REQUESTS while request ${req2} is OPEN"
            - "after receiving ${req2}, submit-draft succeeds: AuditResult.${res}.status == PRELIMINARY"
            - "AuditWorkOrder.${wo}.status == RESULT_DRAFTED after the successful submit"

