              payload: { press_batch_id: "${pb_src}", tank_id: "${t_src}", yeast_program_id: "${ybbl}" }
              as: CellarLead
              captures: { fb_src: $.data.id }
            - call: "POST /cidery/fermentation-batches"
              payload: { press_batch_id: "${pb_dst}", tank_id: "${t_dst}", yeast_program_id: "${ybbl}" }
              as: CellarLead
              captures: { fb_dst: $.data.id }
            - call: "POST /cidery/fermentation-batches/${fb_src}/readings"
              payload: { gravity_brix: 4.0 }
