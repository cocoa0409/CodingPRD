scaffold_corner_design:
  # ==========================================================================
  # Entities — required-field / uniqueness / computed-field correctness
  # ==========================================================================
  - section: entities
    instances:
      - name: create_product_missing_required_sku_returns_validation
        claim_type: required_field
        grounds: [entities.Product.fields.sku, endpoints]
        distinguishing_aspect: "POST /products without sku returns 400 ERR_VALIDATION; no Product persisted."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /products", payload: { name: "NoSku", category: "PLUSH", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 1000 }, as: CatalogAdmin }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: duplicate_sku_rejected
        claim_type: uniqueness
        grounds: [entities.Product.fields.sku, "validations[priority=12]", "errors[ERR_DUPLICATE_SKU]"]
        distinguishing_aspect: "Second POST /products with an existing sku returns 409 ERR_DUPLICATE_SKU."
        test_recipe:
          setup: ["A product with sku DUP-1 exists."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "DUP-1", name: "A", category: "PLUSH", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 1000 }, as: CatalogAdmin }
          trigger:
            - { call: "POST /products", payload: { sku: "DUP-1", name: "B", category: "PLUSH", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 2000 }, as: CatalogAdmin }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_SKU"

      - name: duplicate_customer_email_rejected
        claim_type: uniqueness
        grounds: [entities.Customer.fields.email, "validations[priority=12]", "errors[ERR_DUPLICATE_EMAIL]"]
        distinguishing_aspect: "Second POST /customers with an existing email returns 409 ERR_DUPLICATE_EMAIL."
        test_recipe:
          setup: ["A customer with email dup@x.com exists."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "A", email: "dup@x.com" }, as: StoreAssociate }
          trigger:
            - { call: "POST /customers", payload: { name: "B", email: "dup@x.com" }, as: StoreAssociate }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_EMAIL"

      - name: inventory_available_qty_computed_on_reserve
        claim_type: computed_field
        grounds: [entities.InventoryItem.fields.available_qty, calculations.inventory_availability]
        distinguishing_aspect: "After adding a line qty 3 against on_hand 10, InventoryItem.available_qty == 7, reserved_qty == 3."
        test_recipe:
          setup: ["ACTIVE product P, inventory on_hand 10 at store S, open order O."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "CE-1", name: "T", category: "PLUSH", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 1000 }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "M", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /inventory", payload: { product_id: "${pid}", store_id: "${sid}", on_hand_qty: 10 }, as: StoreAssociate, captures: { iid: $.data.id } }
            - { call: "POST /customers", payload: { name: "C", email: "ce1@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", store_id: "${sid}", fulfillment_type: "BOPIS" }, as: Customer, as_user_id: "${cid}", captures: { oid: $.data.id } }
          trigger:
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 3, recipient_age_months: 60 }, as: Customer, as_user_id: "${cid}" }
            - { call: "GET /inventory/${iid}", payload: {}, as: Any, captures: { av: $.data.available_qty } }
          assert:
            - "InventoryItem.${iid}.available_qty == 7"
            - "InventoryItem.${iid}.reserved_qty == 3"

      - name: loyalty_tier_derived_silver_at_threshold
        claim_type: computed_field
        grounds: [entities.Customer.fields.loyalty_tier, calculations.loyalty_balance]
        distinguishing_aspect: "Customer whose lifetime_points reaches 1000 becomes SILVER (>= 1000 boundary)."
        test_recipe:
          setup: ["Customer C fulfilled orders accumulating exactly 1000 lifetime_points."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "CE-2", name: "T", category: "PLUSH", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 100 }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "M", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /inventory", payload: { product_id: "${pid}", store_id: "${sid}", on_hand_qty: 2000 }, as: StoreAssociate }
            - { call: "POST /customers", payload: { name: "C", email: "ce2@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", store_id: "${sid}", fulfillment_type: "BOPIS" }, as: Customer, as_user_id: "${cid}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1000, recipient_age_months: 60 }, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders/${oid}/submit", payload: {}, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders/${oid}/mark-ready", payload: {}, as: StoreAssociate }
            - { call: "POST /orders/${oid}/pay", payload: { amount_cents: 100000 }, as: StoreAssociate }
            - { call: "POST /orders/${oid}/fulfill", payload: {}, as: StoreAssociate }
          trigger:
            - { call: "GET /customers/${cid}", payload: {}, as: Any, captures: { tier: $.data.loyalty_tier } }
          assert:
            - "Customer.${cid}.lifetime_points == 1000"
            - "Customer.${cid}.loyalty_tier == SILVER"

  # ==========================================================================
  # State machines — invalid transitions
  # ==========================================================================
  - section: state_machines
    instances:
      - name: submit_already_submitted_order_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Order.OPEN_to_SUBMITTED, "validations[priority=4]", "errors[ERR_ORDER_NOT_OPEN]"]
        distinguishing_aspect: "Submitting an order already SUBMITTED returns 409 ERR_ORDER_NOT_OPEN; no state change."
        test_recipe:
          setup: ["A SUBMITTED order O with one line."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "SM-1", name: "T", category: "PLUSH", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 1000 }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "M", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /inventory", payload: { product_id: "${pid}", store_id: "${sid}", on_hand_qty: 10 }, as: StoreAssociate }
            - { call: "POST /customers", payload: { name: "C", email: "sm1@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", store_id: "${sid}", fulfillment_type: "BOPIS" }, as: Customer, as_user_id: "${cid}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1, recipient_age_months: 60 }, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders/${oid}/submit", payload: {}, as: Customer, as_user_id: "${cid}" }
          trigger:
            - { call: "POST /orders/${oid}/submit", payload: {}, as: Customer, as_user_id: "${cid}" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ORDER_NOT_OPEN"

      - name: fulfill_unpaid_order_returns_not_paid
        claim_type: invalid_transition
        grounds: [state_machines.Order.READY_to_FULFILLED, "errors[ERR_ORDER_NOT_PAID]"]
        distinguishing_aspect: "Fulfilling a READY but not-fully-paid order returns 409 ERR_ORDER_NOT_PAID."
        test_recipe:
          setup: ["Order O in READY, total 1000, unpaid."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "SM-2", name: "T", category: "PLUSH", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 1000 }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "M", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /inventory", payload: { product_id: "${pid}", store_id: "${sid}", on_hand_qty: 10 }, as: StoreAssociate }
            - { call: "POST /customers", payload: { name: "C", email: "sm2@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", store_id: "${sid}", fulfillment_type: "BOPIS" }, as: Customer, as_user_id: "${cid}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1, recipient_age_months: 60 }, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders/${oid}/submit", payload: {}, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders/${oid}/mark-ready", payload: {}, as: StoreAssociate }
          trigger:
            - { call: "POST /orders/${oid}/fulfill", payload: {}, as: StoreAssociate }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ORDER_NOT_PAID"

      - name: pay_cancelled_layaway_returns_not_active
        claim_type: invalid_transition
        grounds: [state_machines.Layaway.ACTIVE_to_CANCELLED, "errors[ERR_LAYAWAY_NOT_ACTIVE]"]
        distinguishing_aspect: "Paying a CANCELLED layaway returns 409 ERR_LAYAWAY_NOT_ACTIVE."
        test_recipe:
          setup: ["A CANCELLED layaway."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "C", email: "sm3@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /layaways", payload: { customer_id: "${cid}", total_cents: 9000, installment_count: 3 }, as: StoreAssociate, captures: { lid: $.data.id } }
            - { call: "POST /layaways/${lid}/cancel", payload: {}, as: StoreAssociate }
          trigger:
            - { call: "POST /layaways/${lid}/payments", payload: { amount_cents: 3000 }, as: StoreAssociate }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_LAYAWAY_NOT_ACTIVE"

      - name: convert_unapproved_special_order_returns_not_approved
        claim_type: invalid_transition
        grounds: [state_machines.SpecialOrder.APPROVED_to_CONVERTED, "errors[ERR_SPECIAL_ORDER_NOT_APPROVED]"]
        distinguishing_aspect: "Converting a QUOTED (not APPROVED) special order returns 409 ERR_SPECIAL_ORDER_NOT_APPROVED."
        test_recipe:
          setup: ["A QUOTED special order."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "SM-4", name: "R", category: "ACTION_FIGURE", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 5000, is_exclusive: true }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /customers", payload: { name: "C", email: "sm4@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /special-orders", payload: { customer_id: "${cid}", product_id: "${pid}", requested_qty: 1 }, as: StoreAssociate, captures: { soid: $.data.id, v0: $.data.version } }
            - { call: "POST /special-orders/${soid}/quotes", payload: { unit_price_cents: 5000, deposit_cents: 2000, expected_special_order_version: "${v0}" }, as: StoreManager }
          trigger:
            - { call: "POST /special-orders/${soid}/convert", payload: {}, as: StoreAssociate }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SPECIAL_ORDER_NOT_APPROVED"

      - name: duplicate_event_registration_rejected
        claim_type: invalid_transition
        grounds: [state_machines.DemoEvent.SCHEDULED_to_SCHEDULED, "errors[ERR_DUPLICATE_EVENT_REGISTRATION]"]
        distinguishing_aspect: "Same customer registering twice for one event returns 409 ERR_DUPLICATE_EVENT_REGISTRATION."
        test_recipe:
          setup: ["Event E capacity 5, customer already registered once."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "SM-5", name: "T", category: "PLUSH", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 1000 }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "M", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /events", payload: { store_id: "${sid}", product_id: "${pid}", start_at: "2026-04-01T10:00:00Z", end_at: "2026-04-01T11:00:00Z", capacity: 5 }, as: StoreAssociate, captures: { eid: $.data.id } }
            - { call: "POST /customers", payload: { name: "C", email: "sm5@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /events/${eid}/register", payload: { customer_id: "${cid}" }, as: Customer, as_user_id: "${cid}" }
          trigger:
            - { call: "POST /events/${eid}/register", payload: { customer_id: "${cid}" }, as: Customer, as_user_id: "${cid}" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_EVENT_REGISTRATION"

  # ==========================================================================
  # Calculations — recall resolution clears quarantine; exclusive no-discount
  # ==========================================================================
  - section: calculations
    instances:
      - name: recall_resolve_restores_availability
        claim_type: computed_field
        grounds: [state_machines.Product.RECALLED_to_CLEARED, calculations.inventory_availability]
        distinguishing_aspect: "Resolving a recall clears quarantined_qty to 0 and recomputes available_qty = on_hand - reserved."
        test_recipe:
          setup: ["Product P recalled (inventory 10 quarantined), then resolve."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "CA-1", name: "T", category: "PLUSH", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 1000 }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "M", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /inventory", payload: { product_id: "${pid}", store_id: "${sid}", on_hand_qty: 10 }, as: StoreAssociate, captures: { iid: $.data.id } }
            - { call: "POST /recalls", payload: { product_id: "${pid}", severity: "MANDATORY", reason: "hazard" }, as: CatalogAdmin, captures: { rid: $.data.id } }
            - { call: "POST /recalls/${rid}/issue", payload: {}, as: CatalogAdmin }
          trigger:
            - { call: "POST /recalls/${rid}/issue", payload: { resolve: true }, as: CatalogAdmin }
            - { call: "GET /inventory/${iid}", payload: {}, as: Any, captures: { av: $.data.available_qty } }
          assert:
            - "Product.${pid}.recall_status == CLEARED"
            - "InventoryItem.${iid}.quarantined_qty == 0"
            - "InventoryItem.${iid}.available_qty == 10"

      - name: exclusive_product_receives_no_loyalty_discount
        claim_type: computed_field
        grounds: [calculations.order_pricing, entities.Product.fields.is_exclusive, entities.OrderLine.fields.line_discount_cents]
        distinguishing_aspect: "GOLD customer line for an is_exclusive product gets line_discount_cents == 0 despite tier."
        test_recipe:
          setup: ["GOLD customer, exclusive product P msrp 5000, order line qty 1 submitted."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "CA-2n", name: "N", category: "CRAFT_KIT", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 100 }, as: CatalogAdmin, captures: { npid: $.data.id } }
            - { call: "POST /products/${npid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /products", payload: { sku: "CA-2", name: "Excl", category: "ACTION_FIGURE", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 5000, is_exclusive: true }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "M", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /inventory", payload: { product_id: "${npid}", store_id: "${sid}", on_hand_qty: 6000 }, as: StoreAssociate }
            - { call: "POST /inventory", payload: { product_id: "${pid}", store_id: "${sid}", on_hand_qty: 10 }, as: StoreAssociate }
            - { call: "POST /customers", payload: { name: "C", email: "ca2@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", store_id: "${sid}", fulfillment_type: "BOPIS" }, as: Customer, as_user_id: "${cid}", captures: { woid: $.data.id } }
            - { call: "POST /orders/${woid}/lines", payload: { product_id: "${npid}", qty: 5000, recipient_age_months: 60 }, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders/${woid}/submit", payload: {}, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders/${woid}/mark-ready", payload: {}, as: StoreAssociate }
            - { call: "POST /orders/${woid}/pay", payload: { amount_cents: 500000 }, as: StoreAssociate }
            - { call: "POST /orders/${woid}/fulfill", payload: {}, as: StoreAssociate }
            - { call: "POST /orders", payload: { customer_id: "${cid}", store_id: "${sid}", fulfillment_type: "BOPIS" }, as: Customer, as_user_id: "${cid}", captures: { oid: $.data.id } }
          trigger:
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1, recipient_age_months: 60 }, as: Customer, as_user_id: "${cid}", captures: { lid: $.data.id } }
          assert:
            - "OrderLine.${lid}.line_discount_cents == 0"
            - "OrderLine.${lid}.extended_cents == 5000"

  # ==========================================================================
  # Validations — existence / fiscal / temporal
  # ==========================================================================
  - section: validations
    instances:
      - name: get_missing_order_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "GET /orders/{id} for unknown id returns 404 ERR_ORDER_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /orders/00000000-0000-4000-8000-000000000abc", payload: {}, as: Any }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_ORDER_NOT_FOUND"

      - name: layaway_overpayment_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_LAYAWAY_OVERPAYMENT]"]
        distinguishing_aspect: "Layaway payment exceeding remaining_cents returns 409 ERR_LAYAWAY_OVERPAYMENT."
        test_recipe:
          setup: ["ACTIVE layaway total 9000, remaining 9000."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "C", email: "v2@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /layaways", payload: { customer_id: "${cid}", total_cents: 9000, installment_count: 3 }, as: StoreAssociate, captures: { lid: $.data.id } }
          trigger:
            - { call: "POST /layaways/${lid}/payments", payload: { amount_cents: 10000 }, as: StoreAssociate }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_LAYAWAY_OVERPAYMENT"

      - name: return_window_expired_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_RETURN_WINDOW_EXPIRED]", state_machines.Return.REQUESTED_to_APPROVED]
        distinguishing_aspect: "Approving a return after clock is >30 days past fulfillment returns 409 ERR_RETURN_WINDOW_EXPIRED."
        test_recipe:
          setup: ["FULFILLED order at default clock; return requested; clock advanced 40 days before approve."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "V-3", name: "T", category: "PLUSH", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 1000 }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "M", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /inventory", payload: { product_id: "${pid}", store_id: "${sid}", on_hand_qty: 10 }, as: StoreAssociate }
            - { call: "POST /customers", payload: { name: "C", email: "v3@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", store_id: "${sid}", fulfillment_type: "BOPIS" }, as: Customer, as_user_id: "${cid}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 2, recipient_age_months: 60 }, as: Customer, as_user_id: "${cid}", captures: { lid: $.data.id } }
            - { call: "POST /orders/${oid}/submit", payload: {}, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders/${oid}/mark-ready", payload: {}, as: StoreAssociate }
            - { call: "POST /orders/${oid}/pay", payload: { amount_cents: 2000 }, as: StoreAssociate }
            - { call: "POST /orders/${oid}/fulfill", payload: {}, as: StoreAssociate }
            - { call: "POST /returns", payload: { order_id: "${oid}", lines: [{ order_line_id: "${lid}", qty: 2 }] }, as: StoreAssociate, captures: { rid: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-11T00:00:00Z" }, as: CatalogAdmin }
          trigger:
            - { call: "POST /returns/${rid}/approve", payload: { decision: "APPROVE" }, as: StoreManager }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_RETURN_WINDOW_EXPIRED"

      - name: order_overpayment_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_OVERPAYMENT]"]
        distinguishing_aspect: "Paying more than an order's remaining balance returns 409 ERR_OVERPAYMENT."
        test_recipe:
          setup: ["SUBMITTED order total 1000, unpaid."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "V-4", name: "T", category: "PLUSH", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 1000 }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "M", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /inventory", payload: { product_id: "${pid}", store_id: "${sid}", on_hand_qty: 10 }, as: StoreAssociate }
            - { call: "POST /customers", payload: { name: "C", email: "v4@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", store_id: "${sid}", fulfillment_type: "SHIP_FROM_STORE" }, as: Customer, as_user_id: "${cid}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1, recipient_age_months: 60 }, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders/${oid}/submit", payload: {}, as: Customer, as_user_id: "${cid}" }
          trigger:
            - { call: "POST /orders/${oid}/pay", payload: { amount_cents: 2000 }, as: StoreAssociate }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_OVERPAYMENT"

      - name: insufficient_inventory_on_add_line
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_INSUFFICIENT_INVENTORY]"]
        distinguishing_aspect: "Adding a line qty exceeding available_qty returns 409 ERR_INSUFFICIENT_INVENTORY."
        test_recipe:
          setup: ["Product with inventory on_hand 2 at store; open order."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "V-5", name: "T", category: "PLUSH", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 1000 }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "M", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /inventory", payload: { product_id: "${pid}", store_id: "${sid}", on_hand_qty: 2 }, as: StoreAssociate }
            - { call: "POST /customers", payload: { name: "C", email: "v5@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", store_id: "${sid}", fulfillment_type: "BOPIS" }, as: Customer, as_user_id: "${cid}", captures: { oid: $.data.id } }
          trigger:
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 5, recipient_age_months: 60 }, as: Customer, as_user_id: "${cid}" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INSUFFICIENT_INVENTORY"

      - name: add_registry_item_to_closed_registry_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_REGISTRY_NOT_ACTIVE]", state_machines.GiftRegistry.ACTIVE_to_CLOSED]
        distinguishing_aspect: "Adding an item to a CLOSED registry returns 409 ERR_REGISTRY_NOT_ACTIVE."
        test_recipe:
          setup: ["A CLOSED gift registry and an ACTIVE product."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "V-6", name: "T", category: "PLUSH", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 1000 }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /customers", payload: { name: "C", email: "v6@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /registries", payload: { customer_id: "${cid}", registry_type: "WISHLIST" }, as: Customer, as_user_id: "${cid}", captures: { rgid: $.data.id } }
            - { call: "POST /registries/${rgid}/close", payload: {}, as: Customer, as_user_id: "${cid}" }
          trigger:
            - { call: "POST /registries/${rgid}/items", payload: { product_id: "${pid}", desired_qty: 1 }, as: Customer, as_user_id: "${cid}" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_REGISTRY_NOT_ACTIVE"

  # ==========================================================================
  # Endpoints / Errors — no allocation to convert against
  # ==========================================================================
  - section: endpoints
    instances:
      - name: convert_without_allocation_returns_no_allocation
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_NO_ALLOCATION]", state_machines.SpecialOrder.APPROVED_to_CONVERTED]
        distinguishing_aspect: "Converting an APPROVED special order with no ACTIVE allocation for product+store returns 409 ERR_NO_ALLOCATION."
        test_recipe:
          setup: ["APPROVED special order for product P at store S with no allocation created."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "EP-1", name: "R", category: "ACTION_FIGURE", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 5000, is_exclusive: true }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /customers", payload: { name: "C", email: "ep1@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /special-orders", payload: { customer_id: "${cid}", product_id: "${pid}", requested_qty: 1 }, as: StoreAssociate, captures: { soid: $.data.id, v0: $.data.version } }
            - { call: "POST /special-orders/${soid}/quotes", payload: { unit_price_cents: 5000, deposit_cents: 2000, expected_special_order_version: "${v0}" }, as: StoreManager }
            - { call: "POST /special-orders/${soid}/approve", payload: {}, as: Customer, as_user_id: "${cid}" }
          trigger:
            - { call: "POST /special-orders/${soid}/convert", payload: {}, as: StoreAssociate }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_ALLOCATION"

      - name: fk_reverse_reachability_inventory_by_product
        claim_type: response_shape
        grounds: [endpoints, entities.InventoryItem.fields.product_id]
        distinguishing_aspect: "GET /inventory?product_id=... returns InventoryItem[] filtered to that product (reverse-reachability of the FK)."
        test_recipe:
          setup: ["One inventory item for product P at store S."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "EP-2", name: "T", category: "PLUSH", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 1000 }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "M", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /inventory", payload: { product_id: "${pid}", store_id: "${sid}", on_hand_qty: 4 }, as: StoreAssociate, captures: { iid: $.data.id } }
          trigger:
            - { call: "GET /inventory?product_id=${pid}", payload: {}, as: Any }
          assert:
            - "response.status == 200"
            - "response.data length == 1"
            - "response.data[0].id == ${iid}"

  # ==========================================================================
  # RBAC — role denials
  # ==========================================================================
  - section: rbac
    instances:
      - name: customer_cannot_create_product
        claim_type: rbac_denial
        grounds: [roles.Customer, roles.CatalogAdmin, "validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Customer calling POST /products returns 403 ERR_FORBIDDEN_ROLE (CatalogAdmin-only)."
        test_recipe:
          setup: ["A customer exists to supply X-User-ID."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "C", email: "rb1@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
          trigger:
            - { call: "POST /products", payload: { sku: "RB-1", name: "X", category: "PLUSH", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 1000 }, as: Customer, as_user_id: "${cid}" }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"

      - name: store_associate_cannot_approve_return
        claim_type: rbac_denial
        grounds: [roles.StoreAssociate, roles.StoreManager, "validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "StoreAssociate calling POST /returns/{id}/approve returns 403 ERR_FORBIDDEN_ROLE (StoreManager-only)."
        test_recipe:
          setup: ["A REQUESTED return on a fulfilled order."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "RB-2", name: "T", category: "PLUSH", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 1000 }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "M", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /inventory", payload: { product_id: "${pid}", store_id: "${sid}", on_hand_qty: 10 }, as: StoreAssociate }
            - { call: "POST /customers", payload: { name: "C", email: "rb2@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", store_id: "${sid}", fulfillment_type: "BOPIS" }, as: Customer, as_user_id: "${cid}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1, recipient_age_months: 60 }, as: Customer, as_user_id: "${cid}", captures: { lid: $.data.id } }
            - { call: "POST /orders/${oid}/submit", payload: {}, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders/${oid}/mark-ready", payload: {}, as: StoreAssociate }
            - { call: "POST /orders/${oid}/pay", payload: { amount_cents: 1000 }, as: StoreAssociate }
            - { call: "POST /orders/${oid}/fulfill", payload: {}, as: StoreAssociate }
            - { call: "POST /returns", payload: { order_id: "${oid}", lines: [{ order_line_id: "${lid}", qty: 1 }] }, as: StoreAssociate, captures: { rid: $.data.id } }
          trigger:
            - { call: "POST /returns/${rid}/approve", payload: { decision: "APPROVE" }, as: StoreAssociate }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"

      - name: customer_cannot_act_on_other_customers_order
        claim_type: rbac_denial
        grounds: [roles.Customer, "validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Customer C2 submitting C1's order returns 403 ERR_FORBIDDEN_ROLE (entity_backed ownership)."
        test_recipe:
          setup: ["Order O owned by customer C1; second customer C2 exists."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "RB-3", name: "T", category: "PLUSH", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 1000 }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "M", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /inventory", payload: { product_id: "${pid}", store_id: "${sid}", on_hand_qty: 10 }, as: StoreAssociate }
            - { call: "POST /customers", payload: { name: "C1", email: "rb3a@x.com" }, as: StoreAssociate, captures: { cid1: $.data.id } }
            - { call: "POST /customers", payload: { name: "C2", email: "rb3b@x.com" }, as: StoreAssociate, captures: { cid2: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cid1}", store_id: "${sid}", fulfillment_type: "BOPIS" }, as: Customer, as_user_id: "${cid1}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1, recipient_age_months: 60 }, as: Customer, as_user_id: "${cid1}" }
          trigger:
            - { call: "POST /orders/${oid}/submit", payload: {}, as: Customer, as_user_id: "${cid2}" }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"

  # ==========================================================================
  # Cross-cutting complexity layers — OCC
  # ==========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: special_order_requote_stale_version_conflict
        claim_type: occ_conflict
        grounds: ["concurrency_rules[special-order-requote-stale-version]", "errors[ERR_STALE_SPECIAL_ORDER_VERSION]", "validations[priority=11]"]
        distinguishing_aspect: "A second quote carrying the pre-first-quote version (stale) returns 412 ERR_STALE_SPECIAL_ORDER_VERSION."
        test_recipe:
          setup: ["Special order SO; one quote already applied bumping version so the originally observed version is stale."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "OCC-1", name: "R", category: "ACTION_FIGURE", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 5000, is_exclusive: true }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /customers", payload: { name: "C", email: "occ1@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /special-orders", payload: { customer_id: "${cid}", product_id: "${pid}", requested_qty: 1 }, as: StoreAssociate, captures: { soid: $.data.id, v0: $.data.version } }
            - { call: "POST /special-orders/${soid}/quotes", payload: { unit_price_cents: 5100, deposit_cents: 2000, expected_special_order_version: "${v0}" }, as: StoreManager }
          trigger:
            - { call: "POST /special-orders/${soid}/quotes", payload: { unit_price_cents: 5300, deposit_cents: 2100, expected_special_order_version: "${v0}" }, as: StoreManager }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_SPECIAL_ORDER_VERSION"

  # ==========================================================================
  # Consistency model — registry purchased_qty bump on fulfill (already in §1.8? no)
  # ==========================================================================
  - section: consistency_model
    instances:
      - name: fulfill_bumps_registry_purchased_qty
        claim_type: cascade_side_effect
        grounds: [state_machines.Order.READY_to_FULFILLED, entities.RegistryItem.fields.purchased_qty]
        distinguishing_aspect: "Fulfilling an order whose line matches an open registry item for the same customer bumps RegistryItem.purchased_qty by the line qty."
        test_recipe:
          setup: ["Customer C with ACTIVE registry containing product P desired 3; a READY, PAID order for C with a line of P qty 2."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "CM-1", name: "T", category: "PLUSH", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 1000 }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "M", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /inventory", payload: { product_id: "${pid}", store_id: "${sid}", on_hand_qty: 10 }, as: StoreAssociate }
            - { call: "POST /customers", payload: { name: "C", email: "cm1@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /registries", payload: { customer_id: "${cid}", registry_type: "BIRTHDAY" }, as: Customer, as_user_id: "${cid}", captures: { rgid: $.data.id } }
            - { call: "POST /registries/${rgid}/items", payload: { product_id: "${pid}", desired_qty: 3 }, as: Customer, as_user_id: "${cid}", captures: { riid: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", store_id: "${sid}", fulfillment_type: "BOPIS" }, as: Customer, as_user_id: "${cid}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 2, recipient_age_months: 60 }, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders/${oid}/submit", payload: {}, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders/${oid}/mark-ready", payload: {}, as: StoreAssociate }
            - { call: "POST /orders/${oid}/pay", payload: { amount_cents: 2000 }, as: StoreAssociate }
          trigger:
            - { call: "POST /orders/${oid}/fulfill", payload: {}, as: StoreAssociate }
            - { call: "GET /registries/${rgid}/items", payload: {}, as: Any, captures: { pq: "$.data[0].purchased_qty" } }
          assert:
            - "RegistryItem.${riid}.purchased_qty == 2"

      - name: convert_commits_allocation
        claim_type: cascade_side_effect
        grounds: [state_machines.SpecialOrder.APPROVED_to_CONVERTED, calculations.allocation_availability, entities.Allocation.fields.committed_qty]
        distinguishing_aspect: "Converting an APPROVED special order commits requested_qty against the ACTIVE allocation: committed_qty += 2, available_alloc_qty -= 2."
        test_recipe:
          setup: ["APPROVED special order requested 2; ACTIVE allocation allocated 5 for product+store."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "CM-2", name: "R", category: "ACTION_FIGURE", age_grade_min_months: 0, safety_labels: ["NONE"], msrp_cents: 5000, is_exclusive: true }, as: CatalogAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products/${pid}/activate", payload: {}, as: CatalogAdmin }
            - { call: "POST /stores", payload: { name: "M", state_code: "CA" }, as: CatalogAdmin, captures: { sid: $.data.id } }
            - { call: "POST /allocations", payload: { product_id: "${pid}", store_id: "${sid}", allocated_qty: 5, season_start: "2026-03-01T00:00:00Z", season_end: "2026-12-01T00:00:00Z" }, as: StoreManager, captures: { aid: $.data.id } }
            - { call: "POST /customers", payload: { name: "C", email: "cm2@x.com" }, as: StoreAssociate, captures: { cid: $.data.id } }
            - { call: "POST /special-orders", payload: { customer_id: "${cid}", product_id: "${pid}", requested_qty: 2 }, as: StoreAssociate, captures: { soid: $.data.id, v0: $.data.version } }
            - { call: "POST /special-orders/${soid}/quotes", payload: { unit_price_cents: 5000, deposit_cents: 2000, expected_special_order_version: "${v0}" }, as: StoreManager }
            - { call: "POST /special-orders/${soid}/approve", payload: {}, as: Customer, as_user_id: "${cid}" }
          trigger:
            - { call: "POST /special-orders/${soid}/convert", payload: {}, as: StoreAssociate }
            - { call: "GET /allocations/${aid}", payload: {}, as: Any, captures: { av: $.data.available_alloc_qty } }
          assert:
            - "Allocation.${aid}.committed_qty == 2"
            - "Allocation.${aid}.available_alloc_qty == 3"
            - "SpecialOrder.${soid}.status == CONVERTED"
