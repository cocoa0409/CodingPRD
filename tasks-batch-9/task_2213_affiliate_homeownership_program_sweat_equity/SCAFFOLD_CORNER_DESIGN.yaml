            - "Assignment ${asg_c} (was RESERVED): status == CANCELLED — the lock cancelled it"
            - "Assignment ${asg_a} (was CONFIRMED): status == CONFIRMED, untouched by the cascade"
            - "Volunteer ${vol_c}: assigned_hours_committed == 0 (the 4.00 hours were refunded) and no_show_strikes == 0 — a lock cancellation records no strike"
            - "Volunteer ${vol_a}: assigned_hours_committed == 4.0, unchanged"
            - "Site ${site_id}: readiness_status == UNDER_CONSTRUCTION, safety_posture == CLEAR, and the three clearance flags are all still true"

      - name: shift_relock_cycle_toggles_the_safety_briefing_flag
        claim_type: idempotency
        grounds: ["state_machines.ConstructionShift.status.LOCKED_to_OPEN", "state_machines.ConstructionShift.status.OPEN_to_LOCKED", entities.ConstructionShift.fields.safety_briefing_completed, entities.ConstructionShift.fields.confirmed_general_count, "state_machines.BuildSite.readiness_status.READY_TO_BUILD_to_UNDER_CONSTRUCTION"]
