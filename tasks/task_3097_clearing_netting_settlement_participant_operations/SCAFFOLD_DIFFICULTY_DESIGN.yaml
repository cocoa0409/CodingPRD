              as: PlatformAdmin
            - call: "POST /clearing/participants/${p_yb}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/securities"
              payload: { ticker: "YLD1", cusip: "912828XM2", prev_settlement_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_yld: $.data.id }
            - call: "POST /clearing/settlement-windows"
              payload: { security_id: "${sec_yld}", settlement_date: "2026-09-10", trade_entry_deadline: "2026-09-09T20:00:00Z", affirmation_deadline: "2026-09-09T22:00:00Z" }
              as: PlatformAdmin
              captures: { win_yld: $.data.id }
            - call: "POST /clearing/trade-submissions"
              payload: { counterparty_participant_id: "${p_yb}", security_id: "${sec_yld}", side: "BUY", quantity: 100, trade_price_cents: 4000, trade_date: "2026-09-08T14:00:00Z" }
              as: ClearingMember
              as_user_id: "${p_ya}"
              captures: { t_yld: $.data.id }
            - call: "POST /clearing/trade-submissions/${t_yld}/lock-in"
              payload: {}
              as: ClearingMember
              as_user_id: "${p_ya}"
            - call: "POST /clearing/settlement-windows/${win_yld}/net"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/corporate-actions"
              payload: { security_id: "${sec_yld}", action_type: "SPLIT", ratio_numerator: 3, ratio_denominator: 2, effective_date: "2026-09-20" }
              as: PlatformAdmin
              captures: { ca_yld: $.data.id }
          trigger:
            - call: "POST /clearing/corporate-actions/${ca_yld}/apply"
