            - "After the 25.00 AF deposit: deposited_credit_af 25.00, available_credit_af 25.00, posture OPEN."
            - "After the first lease reserves 20.00: committed_credit_af 20.00, available_credit_af exactly 5.00, posture STILL OPEN — the comparison is strict `<`, not `<=`."
            - "After the second lease reserves 0.01: available_credit_af 4.99 and posture RESTRICTED, purely from the floor."
            - "Both leases are RESERVED and the windows are adjacent (2026-07-01 is the exclusive end of the first and the inclusive start of the second) on the SAME headgate, so neither the exclusivity rule at priority 41 nor the capacity rule at priority 42 is implicated — the posture change is the only difference."
            - "bank_credit_ledger is conserved at every step: 25.00 == 25.00 - 20.00 - 0.00 + 20.00 ... i.e. deposited_credit_af 25.00 == available_credit_af + committed_credit_af + leased_out_af at each read (25.00/0.00/0.00, then 5.00/20.00/0.00, then 4.99/20.01/0.00)."

      - name: calc_right_status_derivation_partially_transferred_outranks_encumbered
        claim_type: correct_result
        grounds:
          - calculations.right_status_derivation
          - state_machines.WaterRight.status
          - calculations.right_volume_ledger
        distinguishing_aspect: >-
          Once any volume has permanently left the right, the derived status is
          PARTIALLY_TRANSFERRED and STAYS there — a fresh escrow does not
          downgrade it to ENCUMBERED, and releasing that escrow does not restore
          ACTIVE. The pinned precedence is visible on one right across three
          consecutive ledger states.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; right certified at 195.00 AF, activated, status ACTIVE with the ledger 195.00 / 0.00 / 0.00."
            - "Application 1 for 100.00 AF with a SEASONAL_AVERAGE analysis fully offset by a 78.00 AF return-flow credit (net_injury_af 0.00), taken through publication and an unprotested decision so it can be APPROVED. The DecisionAuthority user is a different principal from the WaterRightsAnalyst who certified the study, satisfying segregation of duties."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
