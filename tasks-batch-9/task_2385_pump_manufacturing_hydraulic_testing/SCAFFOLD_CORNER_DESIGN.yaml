              as: HydraulicApprover
            - call: "GET /selections"
              payload: { pump_model_id: "${m1_id}" }
              as: HydraulicApprover
            - call: "GET /selections"
              payload: { material_seal_config_id: "${c1_id}" }
              as: HydraulicApprover
          assert:
