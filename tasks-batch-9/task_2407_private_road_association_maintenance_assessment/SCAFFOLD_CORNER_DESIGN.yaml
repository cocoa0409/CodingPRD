          rationale: "ERR_BALANCE_BELOW_RESTRICTION_MINIMUM is triggered there at a balance of 49,999 cents once the segment is COMPLIANT, and the 50,000-cent boundary is asserted in both directions."

      - name: emergency_access_deficient_on_effectuation_code
        claim_type: triggerability
        excluded_because:
          difficulty_instance: access_safety_error_outranks_restriction_balance_minimum_error
          rationale: "That instance triggers ERR_EMERGENCY_ACCESS_DEFICIENT on ACCESS_RESTRICTION effectuation; the §1.9 endpoints section covers the same code on the PAVING award branch, so both call sites are reachable."

      - name: reserve_underfunded_code
