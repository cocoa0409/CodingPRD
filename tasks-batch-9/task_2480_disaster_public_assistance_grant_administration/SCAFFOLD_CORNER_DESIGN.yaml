  # ===========================================================================
  - section: state_machines
    instances:
      - name: damage_site_validate_transition_writes_validated_loss
        claim_type: valid_transition
        grounds:
          - state_machines.DamageAssessmentSite.REPORTED_to_VALIDATED
          - calculations.disaster_validated_loss_indicator
          - endpoints[POST /public-assistance/damage-sites/{damage_site_id}/validate]
        distinguishing_aspect: "The VALIDATE branch moves the site REPORTED -> VALIDATED, writes validated_loss_cents 1000000 and refreshes the declaration to per_capita_impact_cents 0 with indicator_met false, bumping Disaster.version to 2."
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z."
            - "Declaration DR-4942 (TX / FLOOD, 2026-06-10T00:00:00Z through 2026-06-25T00:00:00Z, population 2000000)."
            - "Applicant 'City of Harborview' with facility 'Riverside Pump Station' and one REPORTED damage site (category C, reported_loss_cents 1200000)."
          setup_api_calls:
            - call: "POST /public-assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-4942", state_code: "TX", incident_type: "FLOOD", incident_start_at: "2026-06-10T00:00:00Z", incident_end_at: "2026-06-25T00:00:00Z", population: 2000000 }
              as: PlatformAdmin
              captures: { disaster_id: $.data.id }
            - call: "POST /public-assistance/applicants"
              payload: { disaster_id: "${disaster_id}", name: "City of Harborview", applicant_type: "LOCAL_GOVERNMENT", population_served: 120000 }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /public-assistance/facilities"
              payload: { applicant_id: "${applicant_id}", name: "Riverside Pump Station", facility_type: "WATER_CONTROL", ownership: "PUBLIC" }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
              captures: { facility_id: $.data.id }
            - call: "POST /public-assistance/damage-sites"
              payload: { facility_id: "${facility_id}", category: "C", reported_loss_cents: 1200000, damage_observed_at: "2026-06-12T09:00:00Z" }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
              captures: { damage_site_id: $.data.id }
          trigger:
            - call: "POST /public-assistance/damage-sites/${damage_site_id}/validate"
              payload: { decision: "VALIDATE", validated_loss_cents: 1000000 }
              as: ProgramSpecialist
              as_user_id: "spec-1"
          assert:
            - "HTTP 200"
            - "DamageAssessmentSite.${damage_site_id}.validation_status == VALIDATED"
            - "DamageAssessmentSite.${damage_site_id}.validated_loss_cents == 1000000"
            - "DamageAssessmentSite.${damage_site_id}.rejection_reason == null"
            - "DamageAssessmentSite.${damage_site_id}.version == 2"
            - "Disaster.${disaster_id}.total_validated_loss_cents == 1000000"
            - "Disaster.${disaster_id}.per_capita_impact_cents == 0 (floor(1000000 / 2000000))"
            - "Disaster.${disaster_id}.indicator_met == false (0 < 189)"
            - "Disaster.${disaster_id}.version == 2"

      - name: damage_site_reject_branch_leaves_indicator_untouched
        claim_type: conditional_cascade
        grounds:
          - state_machines.DamageAssessmentSite.REPORTED_to_REJECTED
          - calculations.disaster_validated_loss_indicator
          - entities.DamageAssessmentSite.fields.rejection_reason
        distinguishing_aspect: "The REJECT branch is the one transition that does NOT run disaster_validated_loss_indicator: validated_loss_cents stays 0, the declaration's aggregates stay 0 and Disaster.version stays 1."
        test_recipe:
