            - call: "POST /field-ops/meal-orders/${mo_id}/transitions"
              payload: { to_state: "QUALITY_HOLD", produced_meals: 1000 }
              as: KitchenOperator
              as_user_id: "${pk_id}"
            - call: "POST /field-ops/meal-orders/${mo_id}/transitions"
              payload: { to_state: "REJECTED", quality_check_score: 65 }
              as: FoodSafetyOfficer
          assert:
            - "${rc1} == 1"
            - "${rc2} == 2"
            - "MealOrder.${mo_id}.status == \"REJECTED\""
            - "MealOrder.${mo_id}.rework_count == 2"
