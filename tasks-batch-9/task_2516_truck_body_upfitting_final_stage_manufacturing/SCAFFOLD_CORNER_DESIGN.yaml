            - "Chassis.${ch}.quarantine_reason is null"
            - "Chassis.${ch}.version == 1"
            - "Chassis.${ch}.created_at is the pinned clock instant 2026-08-01T00:00:00Z, not 2020-01-01T00:00:00Z"

      - name: work_bay_supported_body_types_rejects_unknown_enum_member
