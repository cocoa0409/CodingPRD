              as_user_id: "user_credentialing_1"
              captures: { v_orthop_id: $.data.id, v_orthop_ver0: $.data.version }
            - call: "POST /vendor-access/vendor-reps"
              payload: { vendor_id: "${v_orthop_id}", full_name: "Sam Okoye", email: "sam.okoye@orthoprime.example" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { rep_sam_id: $.data.id }
            - call: "POST /vendor-access/product-introduction-requests"
              payload: { vendor_id: "${v_orthop_id}", facility_id: "${f_hs_id}", product_name: "Tibial Nail System T7", product_catalog_number: "TN-T7-330", manufacturer: "Orthoprime", is_implant: true, unit_cost_cents: 380000, expected_vendor_version: "${v_orthop_ver0}" }
              as: VendorAdmin
              as_user_id: "${v_orthop_id}"
              captures: { pir_t7_id: $.data.id }
            - call: "POST /vendor-access/product-introduction-requests/${pir_t7_id}/submit"
              payload: {}
              as: VendorAdmin
              as_user_id: "${v_orthop_id}"
            - call: "POST /vendor-access/product-introduction-requests/${pir_t7_id}/clinical-review"
              payload: { decision: "ENDORSE" }
              as: ClinicalSponsor
              as_user_id: "user_sponsor_1"
            - call: "POST /vendor-access/product-introduction-requests/${pir_t7_id}/value-analysis-decision"
              payload: { decision: "APPROVE" }
              as: ValueAnalysisApprover
              as_user_id: "user_vac_1"
            - call: "GET /vendor-access/approved-products?product_introduction_request_id=${pir_t7_id}"
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { ap_t7_id: "$.data[0].id" }
            - call: "POST /vendor-access/surgical-cases"
