              payload: { full_name: "Dana Vo", expertise_tags: ["security"], weekly_capacity_hours: 40 }
              as: ManagingEditor
              captures: { exp_id: $.data.id, exp_v1: $.data.version }
            - call: "POST /editorial/briefs"
              payload: { campaign_id: "${cmp_id}", funnel_stage: "DECISION", search_intent: "COMMERCIAL", primary_keyword: "zero trust platform pricing", target_word_count: 1500, required_expertise_tag: "security", review_window_start: "2026-08-03T09:00:00.000Z", review_window_end: "2026-08-04T09:00:00.000Z" }
              as: ManagingEditor
              captures: { brief_id: $.data.id }
            - call: "POST /editorial/briefs/${brief_id}/assign-sme"
