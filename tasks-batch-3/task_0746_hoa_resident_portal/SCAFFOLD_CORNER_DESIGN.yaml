scaffold_corner_design:

  # =====================================================================
  # ENTITIES
  # =====================================================================
  - section: entities
    instances:
      - name: homeowner_creation_returns_201_with_defaults
        claim_type: creation
        grounds:
          - entities.Homeowner
          - endpoints[POST /homeowners]
        distinguishing_aspect: "POST /homeowners with email+full_name returns 201 with standing=GOOD_STANDING, delinquency_score=0, booking_privilege=ALLOWED, version=1."
        test_recipe:
          setup:
            - "Empty DB. Clock at server default 2026-03-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /homeowners"
              payload: { email: "new@ex.com", full_name: "New Owner" }
              as: HOAManager
              captures: { h_id: $.data.id, st: $.data.standing, ds: $.data.delinquency_score, bp: $.data.booking_privilege, v: $.data.version }
          assert:
            - "h_id != null"
            - "st == 'GOOD_STANDING'"
            - "ds == 0"
            - "bp == 'ALLOWED'"
            - "v == 1"

      - name: property_missing_required_homeowner_id
        claim_type: required_fields
        grounds:
          - entities.Property.fields.homeowner_id
          - endpoints[POST /properties]
        distinguishing_aspect: "POST /properties without homeowner_id returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /properties"
              payload: { address: "1 Missing Ln", monthly_dues_cents: 30000 }
              as: HOAManager
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_REQUEST'"

      - name: homeowner_get_non_existent_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /homeowners/{id}]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /homeowners/{id} with a UUID not in the DB returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /homeowners/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: HOAManager
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_NOT_FOUND'"

      - name: homeowner_email_uniqueness
        claim_type: type_constraints
        grounds:
          - entities.Homeowner.fields.email
        distinguishing_aspect: "Registering a second homeowner with an email already in use returns ERR_UNIQUE_VIOLATION (409)."
        test_recipe:
          setup:
            - "One homeowner with email=uniq@ex.com already registered."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "uniq@ex.com", full_name: "First" }
              as: HOAManager
              captures: { first_id: $.data.id }
          trigger:
            - call: "POST /homeowners"
              payload: { email: "uniq@ex.com", full_name: "Second" }
              as: HOAManager
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_UNIQUE_VIOLATION'"

      - name: document_immutability_no_version
        claim_type: immutability
        grounds:
          - entities.Document
        distinguishing_aspect: "Document has common_fields=false, so it only exposes id + created_at; no update endpoint exists, no version field is present."
        test_recipe:
          setup:
            - "One document uploaded."
          setup_api_calls:
            - call: "POST /documents"
              payload: { title: "CC&R 2025", category: "CCR", content_url: "https://ex.com/ccr.pdf" }
              as: HOAManager
              captures: { d_id: $.data.id }
          trigger:
            - call: "GET /documents/${d_id}"
              payload: {}
              as: Homeowner
              captures: { title: $.data.title, cat: $.data.category }
          assert:
            - "title == 'CC&R 2025'"
            - "cat == 'CCR'"

      - name: property_computed_total_outstanding_after_assessment
        claim_type: computed_fields
        grounds:
          - entities.Property.fields.total_outstanding_cents
        distinguishing_aspect: "Property.total_outstanding_cents is derived; creating a $300 assessment causes it to become 30000."
        test_recipe:
          setup:
            - "Homeowner H, Property P (monthly_dues_cents=30000), no assessments."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "hcp@ex.com", full_name: "H CP" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h_id}", address: "20 CP Ln", monthly_dues_cents: 30000 }
              as: HOAManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /assessments"
              payload: { property_id: "${p_id}", billing_period_start: "2026-03-01T00:00:00Z", billing_period_end: "2026-04-01T00:00:00Z", due_date: "2026-04-15T00:00:00Z" }
              as: HOAManager
            - call: "GET /properties/${p_id}"
              payload: {}
              as: HOAManager
              captures: { out: $.data.total_outstanding_cents }
          assert:
            - "out == 30000"

      - name: assessment_system_field_amount_paid_ignored_on_input
        claim_type: system_fields
        grounds:
          - entities.Assessment.fields.amount_paid_cents
        distinguishing_aspect: "amount_paid_cents is computed; a client cannot supply it on POST /assessments — it is not in the endpoint input schema."
        test_recipe:
          setup:
            - "Homeowner H, Property P."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "hsys@ex.com", full_name: "H Sys" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h_id}", address: "21 Sys Ln", monthly_dues_cents: 30000 }
              as: HOAManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /assessments"
              payload: { property_id: "${p_id}", billing_period_start: "2026-03-01T00:00:00Z", billing_period_end: "2026-04-01T00:00:00Z", due_date: "2026-04-15T00:00:00Z" }
              as: HOAManager
              captures: { paid: $.data.amount_paid_cents, st: $.data.status }
          assert:
            - "paid == 0"
            - "st == 'OPEN'"

      - name: fk_property_missing_homeowner_returns_fk_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Property.fields.homeowner_id
          - errors[ERR_FK_NOT_FOUND]
        distinguishing_aspect: "POST /properties with a non-existent homeowner_id returns ERR_FK_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /properties"
              payload: { homeowner_id: "00000000-0000-0000-0000-000000000000", address: "22 FK Ln", monthly_dues_cents: 30000 }
              as: HOAManager
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_FK_NOT_FOUND'"

  # =====================================================================
  # STATE MACHINES
  # =====================================================================
  - section: state_machines
    instances:
      - name: assessment_initial_state_open
        claim_type: initial_state
        grounds:
          - state_machines.Assessment
        distinguishing_aspect: "New Assessment starts in status=OPEN."
        test_recipe:
          setup:
            - "Homeowner H, Property P."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "hist@ex.com", full_name: "H Ist" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h_id}", address: "23 Ist Ln", monthly_dues_cents: 30000 }
              as: HOAManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /assessments"
              payload: { property_id: "${p_id}", billing_period_start: "2026-03-01T00:00:00Z", billing_period_end: "2026-04-01T00:00:00Z", due_date: "2026-04-15T00:00:00Z" }
              as: HOAManager
              captures: { st: $.data.status }
          assert:
            - "st == 'OPEN'"

      - name: cancel_already_cancelled_reservation_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.AmenityReservation.BOOKED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Second cancel on a CANCELLED reservation returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "Homeowner H, Amenity A, one CANCELLED reservation R."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "hcc@ex.com", full_name: "H CC" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /amenities"
              payload: { name: "Gym", capacity: 5, reservation_window_start_hour: 6, reservation_window_end_hour: 22 }
              as: HOAManager
              captures: { a_id: $.data.id }
            - call: "POST /amenity-reservations"
              payload: { amenity_id: "${a_id}", homeowner_id: "${h_id}", start_ts: "2026-03-20T10:00:00Z", end_ts: "2026-03-20T12:00:00Z", guest_count: 2 }
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { r_id: $.data.id }
            - call: "POST /amenity-reservations/${r_id}/cancel"
              payload: {}
              as: Homeowner
              as_user_id: "${h_id}"
          trigger:
            - call: "POST /amenity-reservations/${r_id}/cancel"
              payload: {}
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_STATE'"

      - name: arc_finalize_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ARCRequest.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: "Finalizing an ARC request in DRAFT (not UNDER_REVIEW) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "BoardMember BM; Homeowner H; Property P; ARC request R in DRAFT (never submitted)."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "bmd@ex.com", full_name: "BM D", is_board_member: true }
              as: HOAManager
              captures: { bm_id: $.data.id }
            - call: "POST /homeowners"
              payload: { email: "hd@ex.com", full_name: "H D" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h_id}", address: "24 D Ln", monthly_dues_cents: 30000 }
              as: HOAManager
              captures: { p_id: $.data.id }
            - call: "POST /arc-requests"
              payload: { property_id: "${p_id}", submitter_homeowner_id: "${h_id}", category: "SIMPLE", description: "Draft" }
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /arc-requests/${r_id}/finalize"
              payload: {}
              as: BoardMember
              as_user_id: "${bm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_STATE'"

      - name: terminal_state_paid_no_further_pay
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Assessment.terminal_states
        distinguishing_aspect: "Assessment in PAID (terminal, before due_date) — POST /pay returns ERR_INVALID_STATE."
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_vs_fiscal_pay_terminal_wins_state
          rationale: "The state-lockdown claim is asserted as the failure path of the state-vs-fiscal priority conflict instance."

      - name: violation_upheld_after_appeal_window_expired
        claim_type: valid_transition
        grounds:
          - state_machines.Violation.FINED_to_UPHELD
        distinguishing_aspect: "System auto-transitions Violation.status FINED → UPHELD when clock advances past fined_at + 14 days with no appeal."
        test_recipe:
          setup:
            - "Property P; Violation V FINED at 2026-03-05."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "hup@ex.com", full_name: "H Up" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h_id}", address: "25 Up Ln", monthly_dues_cents: 30000 }
              as: HOAManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: HOAManager
            - call: "POST /violations"
              payload: { property_id: "${p_id}", category: "LANDSCAPE" }
              as: ComplianceOfficer
              captures: { v_id: $.data.id }
            - call: "POST /violations/${v_id}/confirm"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /violations/${v_id}/fine"
              payload: { fine_amount_cents: 15000 }
              as: ComplianceOfficer
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-25T00:00:00Z" }
              as: HOAManager
            - call: "GET /violations/${v_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { st: $.data.status }
          assert:
            - "st == 'UPHELD'"

      - name: motion_close_open_before_end_window
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Motion.OPEN_to_CLOSED_PASSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /motions/{id}/close before voting_window_end returns ERR_INVALID_STATE (409) — the precondition current_utc >= voting_window_end fails."
        test_recipe:
          setup:
            - "BoardMember BM; Motion M with window 2026-04-01..2026-04-05."
            - "Clock at 2026-04-03 (still inside voting window)."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "bmc@ex.com", full_name: "BM C", is_board_member: true }
              as: HOAManager
              captures: { bm_id: $.data.id }
            - call: "POST /motions"
              payload: { title: "T", description: "D", category: "POLICY", voting_window_start: "2026-04-01T00:00:00Z", voting_window_end: "2026-04-05T00:00:00Z", eligible_voter_count: 10, quorum_pct: 50 }
              as: BoardMember
              as_user_id: "${bm_id}"
              captures: { m_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-03T00:00:00Z" }
              as: HOAManager
          trigger:
            - call: "POST /motions/${m_id}/close"
              payload: {}
              as: BoardMember
              as_user_id: "${bm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_STATE'"

      - name: workorder_cancel_after_completed_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.WorkOrder
        distinguishing_aspect: "Cancelling a WorkOrder in work_status=COMPLETED returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "WorkOrder W progressed NEW→ASSIGNED→IN_PROGRESS→COMPLETED."
          setup_api_calls:
            - call: "POST /work-orders"
              payload: { title: "T", cost_estimate_cents: 10000 }
              as: HOAManager
              captures: { w_id: $.data.id }
            - call: "POST /work-orders/${w_id}/assign"
              payload: { assigned_vendor_id: "v1" }
              as: HOAManager
            - call: "POST /work-orders/${w_id}/start"
              payload: {}
              as: HOAManager
            - call: "POST /work-orders/${w_id}/complete"
              payload: {}
              as: HOAManager
          trigger:
            - call: "POST /work-orders/${w_id}/cancel"
              payload: {}
              as: HOAManager
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_STATE'"

  # =====================================================================
  # CALCULATIONS
  # =====================================================================
  - section: calculations
    instances:
      - name: assessment_prorate_boundary_prorate_from_equal_start
        claim_type: boundary
        grounds:
          - calculations.assessment_prorate
        distinguishing_aspect: "When prorate_from == billing_period_start, FULL_MONTH variant applies (not DAILY_PRORATE); amount_due_cents equals monthly_dues_cents."
        test_recipe:
          setup:
            - "Homeowner H, Property P (monthly_dues_cents=30000)."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "hpr@ex.com", full_name: "H Pr" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h_id}", address: "26 Pr Ln", monthly_dues_cents: 30000 }
              as: HOAManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /assessments"
              payload: { property_id: "${p_id}", billing_period_start: "2026-03-01T00:00:00Z", billing_period_end: "2026-04-01T00:00:00Z", due_date: "2026-04-15T00:00:00Z", prorate_from: "2026-03-01T00:00:00Z" }
              as: HOAManager
              captures: { amt: $.data.amount_due_cents }
          assert:
            - "amt == 30000"

      - name: late_fee_tier1_floor_applied
        claim_type: boundary
        grounds:
          - calculations.late_fee
        distinguishing_aspect: "At 5 days overdue on $300 outstanding, base = round(30000*0.02)=600 which is below the tier-1 floor of 1000; late_fee_cents = 1000."
        test_recipe:
          setup:
            - "Homeowner H (GOOD_STANDING), Property P (monthly_dues_cents=30000)."
            - "Assessment A due_date=2026-04-15."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "hfl@ex.com", full_name: "H FL" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h_id}", address: "27 FL Ln", monthly_dues_cents: 30000 }
              as: HOAManager
              captures: { p_id: $.data.id }
            - call: "POST /assessments"
              payload: { property_id: "${p_id}", billing_period_start: "2026-03-01T00:00:00Z", billing_period_end: "2026-04-01T00:00:00Z", due_date: "2026-04-15T00:00:00Z" }
              as: HOAManager
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-20T00:00:00Z" }
              as: HOAManager
            - call: "GET /assessments/${a_id}"
              payload: {}
              as: HOAManager
              captures: { fee: $.data.late_fee_cents, st: $.data.status }
          assert:
            - "fee == 1000"
            - "st == 'OVERDUE'"

      - name: arc_fee_simple_no_reviews_edge
        claim_type: input_set_filtering
        grounds:
          - calculations.arc_finalization_fee
        distinguishing_aspect: "ARC request finalized to REJECTED with a single REJECT review yields fee_cents = base_simple + 1 * base_simple * 0.10725 = round(2500 + 268.125) = 2768."
        test_recipe:
          setup:
            - "BoardMember BM; Homeowner H; Property P; ARC request R (SIMPLE) submitted."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "bmar@ex.com", full_name: "BM AR", is_board_member: true }
              as: HOAManager
              captures: { bm_id: $.data.id }
            - call: "POST /homeowners"
              payload: { email: "har@ex.com", full_name: "H AR" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h_id}", address: "28 AR Ln", monthly_dues_cents: 30000 }
              as: HOAManager
              captures: { p_id: $.data.id }
            - call: "POST /arc-requests"
              payload: { property_id: "${p_id}", submitter_homeowner_id: "${h_id}", category: "SIMPLE", description: "Solar panel" }
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { r_id: $.data.id }
            - call: "POST /arc-requests/${r_id}/submit"
              payload: {}
              as: Homeowner
              as_user_id: "${h_id}"
            - call: "POST /arc-requests/${r_id}/reviews"
              payload: { reviewer_homeowner_id: "${bm_id}", weight: 1, verdict: "REJECT" }
              as: BoardMember
              as_user_id: "${bm_id}"
          trigger:
            - call: "POST /arc-requests/${r_id}/finalize"
              payload: {}
              as: BoardMember
              as_user_id: "${bm_id}"
              captures: { fee: $.data.fee_cents, st: $.data.status }
          assert:
            - "fee == 2768"
            - "st == 'REJECTED'"

      - name: delinquency_score_variant_selection
        claim_type: variant_selection
        grounds:
          - calculations.homeowner_delinquency_score
        distinguishing_aspect: "Same portfolio yields different scores under STRICT vs LENIENT."
        excluded_because:
          difficulty_instance: dual_variant_calc / delinquency_score_strict_vs_lenient
          rationale: "Directly covered by the dual_variant_calc instance."

      - name: arc_fee_sum_then_round_order_lock
        claim_type: precision
        grounds:
          - calculations.arc_finalization_fee
        distinguishing_aspect: "SUM_THEN_ROUND lock — implementation returning 16436 (round-then-sum) is rejected."
        excluded_because:
          difficulty_instance: combinatorial_formula / arc_fee_sum_then_round_mode_b
          rationale: "Order lock is the essential distinguishing_aspect of the mode-(b) instance."

  # =====================================================================
  # VALIDATIONS
  # =====================================================================
  - section: validations
    instances:
      - name: reservation_reviewer_not_board_returns_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_REVIEWER_NOT_BOARD]
        distinguishing_aspect: "Submitting an ARCReview with reviewer_homeowner_id pointing to a non-board homeowner returns ERR_REVIEWER_NOT_BOARD (422)."
        test_recipe:
          setup:
            - "Homeowner NB (is_board_member=false); Homeowner H; Property P; ARC request R submitted."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "nb@ex.com", full_name: "Not Board" }
              as: HOAManager
              captures: { nb_id: $.data.id }
            - call: "POST /homeowners"
              payload: { email: "hnb@ex.com", full_name: "H NB" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h_id}", address: "29 NB Ln", monthly_dues_cents: 30000 }
              as: HOAManager
              captures: { p_id: $.data.id }
            - call: "POST /arc-requests"
              payload: { property_id: "${p_id}", submitter_homeowner_id: "${h_id}", category: "SIMPLE", description: "Deck" }
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { r_id: $.data.id }
            - call: "POST /arc-requests/${r_id}/submit"
              payload: {}
              as: Homeowner
              as_user_id: "${h_id}"
          trigger:
            - call: "POST /arc-requests/${r_id}/reviews"
              payload: { reviewer_homeowner_id: "${nb_id}", weight: 1, verdict: "APPROVE" }
              as: BoardMember
              as_user_id: "${nb_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_REVIEWER_NOT_BOARD'"

      - name: amenity_window_start_after_end_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_AMENITY_WINDOW_VIOLATION]
        distinguishing_aspect: "Reservation with start_ts >= end_ts returns ERR_AMENITY_WINDOW_VIOLATION (422)."
        test_recipe:
          setup:
            - "Amenity A capacity=10, window 6..22. Homeowner H."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "hw@ex.com", full_name: "H W" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /amenities"
              payload: { name: "Room", capacity: 10, reservation_window_start_hour: 6, reservation_window_end_hour: 22 }
              as: HOAManager
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /amenity-reservations"
              payload: { amenity_id: "${a_id}", homeowner_id: "${h_id}", start_ts: "2026-03-20T14:00:00Z", end_ts: "2026-03-20T13:00:00Z", guest_count: 2 }
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_AMENITY_WINDOW_VIOLATION'"

      - name: overpayment_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - errors[ERR_OVERPAYMENT]
        distinguishing_aspect: "POST /assessments/{id}/pay with amount_cents > outstanding on an OPEN assessment returns ERR_OVERPAYMENT (422)."
        test_recipe:
          setup:
            - "Homeowner H, Property P, Assessment A (amount_due_cents=30000, amount_paid_cents=0)."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "hop@ex.com", full_name: "H OP" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h_id}", address: "30 OP Ln", monthly_dues_cents: 30000 }
              as: HOAManager
              captures: { p_id: $.data.id }
            - call: "POST /assessments"
              payload: { property_id: "${p_id}", billing_period_start: "2026-03-01T00:00:00Z", billing_period_end: "2026-04-01T00:00:00Z", due_date: "2026-04-15T00:00:00Z" }
              as: HOAManager
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /assessments/${a_id}/pay"
              payload: { amount_cents: 99999, method: "MANUAL" }
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_OVERPAYMENT'"

      - name: ballot_duplicate_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_BALLOT_DUPLICATE]
        distinguishing_aspect: "Casting a second ballot with the same (motion_id, homeowner_id) returns ERR_BALLOT_DUPLICATE (409)."
        test_recipe:
          setup:
            - "BoardMember BM. Motion M with window 2026-04-01..2026-04-05, eligible=5, quorum=50. Homeowner V (voter)."
            - "Clock at 2026-04-02 (inside voting window)."
            - "First ballot already cast by V on M."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "bmbd@ex.com", full_name: "BM BD", is_board_member: true }
              as: HOAManager
              captures: { bm_id: $.data.id }
            - call: "POST /homeowners"
              payload: { email: "v@ex.com", full_name: "V" }
              as: HOAManager
              captures: { v_id: $.data.id }
            - call: "POST /motions"
              payload: { title: "T", description: "D", category: "POLICY", voting_window_start: "2026-04-01T00:00:00Z", voting_window_end: "2026-04-05T00:00:00Z", eligible_voter_count: 5, quorum_pct: 50 }
              as: BoardMember
              as_user_id: "${bm_id}"
              captures: { m_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: HOAManager
            - call: "POST /motions/${m_id}/ballots"
              payload: { homeowner_id: "${v_id}", choice: "YES" }
              as: Homeowner
              as_user_id: "${v_id}"
          trigger:
            - call: "POST /motions/${m_id}/ballots"
              payload: { homeowner_id: "${v_id}", choice: "NO" }
              as: Homeowner
              as_user_id: "${v_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_BALLOT_DUPLICATE'"

      - name: appeal_non_safety_within_window
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=13]
          - validations[priority=17]
        distinguishing_aspect: "A NUISANCE violation fined 3 days ago is validly appealable — POST /violations/{id}/appeal returns 200 with status=APPEALED."
        test_recipe:
          setup:
            - "Property P; Homeowner H; NUISANCE violation V FINED at 2026-03-05."
            - "Clock at 2026-03-08 (3 days after fined_at)."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "hap@ex.com", full_name: "H Ap" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /properties"
