          rationale: "That §1.8 instance verifies the four-level chain hold → vehicle flag → release order cancellation → carrier slot and dealer counter reversal in one request, including the non-restoration of CANCELLED_BY_HOLD orders."

      - name: corner_dual_variant_calculation_layer_delta_on_switch
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_calc / storage_charge_provisional_vs_final_diverge_on_same_unit
          rationale: "That §1.8 instance drives both storage variants on one unit and asserts the provisional-to-final delta on the center ledger; the claim-basis variant pair is covered by dual_variant_calc / claim_recoverable_survey_based_vs_repair_actual_basis_switch."

  # ================================================= 9. Consistency Model
  - section: consistency_model
    instances:
      - name: corner_every_derived_counter_is_current_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.yard_posture
          - calculations.vehicle_storage_charge
        distinguishing_aspect: "The allocation response itself already carries the selected carrier and route zone, and the reads issued immediately afterwards — with no intervening write and no delay — show dealer open_allocation_count 1, carrier committed_slots 1 / available_slots 3, center yard_occupied_slots 1 / yard_free_slots 49 / yard_posture OPEN and a non-zero provisional accrual."
        test_recipe:
          setup:
            - "One unit at SHIPPING_READY in a 50-slot yard, one zone-A dealer, one zone-A carrier with slot_capacity 4."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/processing-centers"
              payload: { name: "Newport VPC", port_code: "USNPT", yard_capacity_slots: 50, daily_storage_rate_cents: 1450, labor_rate_cents_per_hour: 9000, fuel_surcharge_pct: 0.0925, free_storage_days: 5 }
              as: PortOperationsPlanner
              captures: { center_id: $.data.id }
            - call: "POST /vpc/berths"
              payload: { processing_center_id: "${center_id}", berth_code: "B1", turnaround_buffer_minutes: 120 }
              as: PortOperationsPlanner
              captures: { berth_id: $.data.id }
            - call: "POST /vpc/dealers"
              payload: { dealer_code: "D-ATL", name: "Atlanta Motors", route_zone: "A", distance_miles: 100, allocation_quota: 5 }
              as: DistributionManager
              captures: { dealer_id: $.data.id }
            - call: "POST /vpc/truck-carriers"
              payload: { carrier_code: "TC-ROAD", name: "Roadway Auto Transport", served_route_zones: ["A"], linehaul_rate_cents_per_mile: 412, slot_capacity: 4, concurrent_load_capacity: 2 }
              as: DistributionManager
              captures: { carrier_id: $.data.id }
            - call: "POST /vpc/vessels"
              payload: { processing_center_id: "${center_id}", berth_id: "${berth_id}", voyage_code: "V001", carrier_scac: "OCNL", berth_window_start: "2026-08-01T06:00:00Z", berth_window_end: "2026-08-01T18:00:00Z", declared_unit_count: 1 }
              as: PortOperationsPlanner
              captures: { vessel_id: $.data.id }
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/start-discharge"
              payload: {}
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/vehicles"
              payload: { vin: "1VWSA7A3XFC000610", model_line: "EV900" }
              as: PortOperationsPlanner
              captures: { veh_id: $.data.id }
            - call: "POST /vpc/vessels/${vessel_id}/complete-discharge"
              payload: {}
              as: PortOperationsPlanner
            - call: "POST /vpc/vehicles/${veh_id}/damage-surveys"
              payload: { line_items: [{ damage_zone: "INTERIOR", severity_points: 10, repair_estimate_cents: 0 }] }
              as: DamageSurveyor
              captures: { survey_id: $.data.id }
            - call: "POST /vpc/damage-surveys/${survey_id}/submit"
              payload: {}
              as: DamageSurveyor
            - call: "POST /vpc/vehicles/${veh_id}/quality-inspections"
              payload: {}
              as: QualityInspector
              as_user_id: "u-qc-1"
              captures: { insp_id: $.data.id }
            - call: "POST /vpc/quality-inspections/${insp_id}/complete"
              payload: { outcome: "PASS", defect_count: 0 }
              as: QualityInspector
              as_user_id: "u-qc-1"
            - call: "POST /vpc/vehicles/${veh_id}/prep-complete"
              payload: {}
              as: QualityInspector
              as_user_id: "u-qc-1"
              captures: { vv: $.data.version }
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PortOperationsPlanner
          trigger:
            - call: "POST /vpc/vehicles/${veh_id}/allocations"
              payload: { dealer_id: "${dealer_id}", pickup_window_start: "2026-08-11T08:00:00Z", pickup_window_end: "2026-08-11T12:00:00Z", expected_vehicle_version: "${vv}" }
              as: DistributionManager
              as_user_id: "u-dm-1"
              captures: { ro_id: $.data.id, ro_carrier: $.data.truck_carrier_id, ro_zone: $.data.route_zone, ro_state: $.data.status }
            - call: "GET /vpc/dealers/${dealer_id}"
              payload: {}
              as: DistributionManager
              captures: { dealer_open: $.data.open_allocation_count }
            - call: "GET /vpc/truck-carriers/${carrier_id}"
              payload: {}
              as: DistributionManager
              captures: { committed: $.data.committed_slots, available: $.data.available_slots }
            - call: "GET /vpc/processing-centers/${center_id}"
              payload: {}
              as: DistributionManager
              captures: { occ: $.data.yard_occupied_slots, free: $.data.yard_free_slots, posture: $.data.yard_posture, prov: $.data.provisional_storage_accrued_cents }
            - call: "GET /vpc/vehicles/${veh_id}"
              payload: {}
              as: DistributionManager
              captures: { veh_prov: $.data.storage_charge_provisional_cents, veh_final: $.data.storage_charge_final_cents }
          assert:
            - "${ro_state} == ALLOCATED, ${ro_carrier} == ${carrier_id} and ${ro_zone} == A — all populated in the creating response, not on a later read"
            - "${dealer_open} == 1 and ${committed} == 1 with ${available} == 3 (slot_capacity 4 - 1)"
            - "${occ} == 1, ${free} == 49 and ${posture} == OPEN (1/50 == 0.02 < 0.80)"
            - "${veh_prov} == 7250: projected dispatch 2026-08-12T00:00:00Z, dwell ceil(10 days) == 10, (10 - 5 - 0) x 1450"
            - "${prov} == 7250 and ${veh_final} == 0 — the ledger reflects the same request's accrual immediately"
