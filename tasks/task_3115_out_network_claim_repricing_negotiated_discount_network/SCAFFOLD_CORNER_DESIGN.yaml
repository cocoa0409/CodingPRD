# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_3115_out_network_claim_repricing_negotiated_discount_network
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: payer_client_create_returns_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.PayerClient
          - endpoints.POST_/payer-clients
        distinguishing_aspect: "Creating a payer with only the required fields returns 201 with status ACTIVE, version 1, minimum_invoice_cents 0, transparency_reporting_enabled false, and system-minted id/created_at/updated_at — defaults and system fields are never client-supplied."
        test_recipe:
          setup: ["Empty database; logical clock at default 2026-09-01T00:00:00Z."]
          setup_api_calls: []
          trigger:
            - call: "POST /payer-clients"
              payload: { payer_name: "Acme Health Plan", fee_percent: 0.25, fee_cap_cents_per_claim: 5000 }
              as: OpsAdmin
              captures: { pc_id: $.data.id }
          assert:
            - "response status 201 and response_type object"
            - "PayerClient.${pc_id}.status == ACTIVE and version == 1"
            - "PayerClient.${pc_id}.minimum_invoice_cents == 0 and transparency_reporting_enabled == false"
            - "response data carries non-null id, created_at, updated_at; meta.api_request_id present"

      - name: provider_get_round_trips_and_unknown_id_returns_404
        claim_type: Retrieval
        grounds:
          - entities.Provider
          - endpoints.GET_/providers/{id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET on the created provider returns every stored field unchanged; GET on a random UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Provider registered."]
          setup_api_calls:
            - call: "POST /providers"
              payload: { npi: "2000000001", legal_name: "Round Trip MD", tin: "T-9" }
              as: NetworkAdmin
              captures: { prv_id: $.data.id }
          trigger:
            - call: "GET /providers/${prv_id}"
              payload: {}
              as: PayerRep
              as_user_id: "ignored-opaque-read"
            - call: "GET /providers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PayerRep
              as_user_id: "ignored-opaque-read"
              captures: { err: $.data.error_id }
          assert:
            - "GET /providers/${prv_id} returns npi 2000000001, legal_name 'Round Trip MD', tin 'T-9'"
            - "unknown id returns 404 with error_id ERR_NOT_FOUND"

      - name: claims_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/claims
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three claims listed with limit=2&offset=0 return 2 rows, total_count 3, has_more true; offset=2 returns 1 row with has_more false — total_count counts the whole filtered set."
        test_recipe:
          setup: ["Payer and provider exist; three claims created."]
          setup_api_calls:
            - call: "POST /payer-clients"
              payload: { payer_name: "P1", fee_percent: 0.25, fee_cap_cents_per_claim: 5000 }
              as: OpsAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "2000000002", legal_name: "PR", tin: "T" }
              as: NetworkAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /claims"
              payload: { payer_client_id: "${p1_id}", provider_id: "${pr_id}", external_claim_ref: "L1", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", service_date: "2026-09-10T00:00:00Z", patient_responsibility_cents: 0 }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /claims"
              payload: { payer_client_id: "${p1_id}", provider_id: "${pr_id}", external_claim_ref: "L2", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", service_date: "2026-09-10T00:00:00Z", patient_responsibility_cents: 0 }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /claims"
              payload: { payer_client_id: "${p1_id}", provider_id: "${pr_id}", external_claim_ref: "L3", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", service_date: "2026-09-10T00:00:00Z", patient_responsibility_cents: 0 }
              as: PayerRep
              as_user_id: "${p1_id}"
          trigger:
            - call: "GET /claims"
              payload: { payer_client_id: "${p1_id}", limit: 2, offset: 0 }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "GET /claims"
              payload: { payer_client_id: "${p1_id}", limit: 2, offset: 2 }
              as: PayerRep
              as_user_id: "${p1_id}"
          assert:
            - "page 1 returns 2 rows with total_count == 3 and has_more == true"
            - "page 2 returns 1 row with has_more == false"

      - name: claim_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Claim
          - endpoints.POST_/claims
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required external_claim_ref on claim ingest returns 400 ERR_INVALID_REQUEST and creates nothing."
        test_recipe:
          setup: ["Payer and provider exist."]
          setup_api_calls:
            - call: "POST /payer-clients"
              payload: { payer_name: "P1", fee_percent: 0.25, fee_cap_cents_per_claim: 5000 }
              as: OpsAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "2000000003", legal_name: "PR", tin: "T" }
              as: NetworkAdmin
              captures: { pr_id: $.data.id }
          trigger:
            - call: "POST /claims"
              payload: { payer_client_id: "${p1_id}", provider_id: "${pr_id}", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", service_date: "2026-09-10T00:00:00Z", patient_responsibility_cents: 0 }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status 400 with error_id ERR_INVALID_REQUEST"
            - "GET /claims?payer_client_id=${p1_id} returns total_count 0"

      - name: claim_computed_fields_null_before_pricing_and_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Claim.fields.allowed_amount_cents
          - entities.Claim.fields.savings_cents
        distinguishing_aspect: "Computed fields allowed_amount_cents / payer_liability_cents / savings_cents / methodology_used / rbp_amount_cents are null at creation and after line adds; any client-supplied values for them are ignored."
        test_recipe:
          setup: ["Payer, provider exist; claim created with one line."]
          setup_api_calls:
            - call: "POST /payer-clients"
              payload: { payer_name: "P1", fee_percent: 0.25, fee_cap_cents_per_claim: 5000 }
              as: OpsAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "2000000004", legal_name: "PR", tin: "T" }
              as: NetworkAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /claims"
              payload: { payer_client_id: "${p1_id}", provider_id: "${pr_id}", external_claim_ref: "C1", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", service_date: "2026-09-10T00:00:00Z", patient_responsibility_cents: 0, allowed_amount_cents: 1 }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { c_id: $.data.id }
            - call: "POST /claims/${c_id}/lines"
              payload: { procedure_code: "99283", quantity_units: 1, unit_charge_cents: 10000, region_code: "R1" }
              as: PayerRep
              as_user_id: "${p1_id}"
          trigger:
            - call: "GET /claims/${c_id}"
              payload: {}
              as: PayerRep
              as_user_id: "${p1_id}"
          assert:
            - "Claim.${c_id}.allowed_amount_cents is null (client-supplied 1 ignored)"
            - "Claim.${c_id}.payer_liability_cents is null and savings_cents is null and methodology_used is null"
            - "Claim.${c_id}.status == PENDING_LINES and billed_amount_cents == 10000"

      - name: claim_invalid_enum_value_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Claim.fields.claim_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "claim_type 'DENTAL' is not in the declared enum and is rejected 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Payer and provider exist."]
          setup_api_calls:
            - call: "POST /payer-clients"
              payload: { payer_name: "P1", fee_percent: 0.25, fee_cap_cents_per_claim: 5000 }
              as: OpsAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "2000000005", legal_name: "PR", tin: "T" }
              as: NetworkAdmin
              captures: { pr_id: $.data.id }
          trigger:
            - call: "POST /claims"
              payload: { payer_client_id: "${p1_id}", provider_id: "${pr_id}", external_claim_ref: "C2", claim_type: "DENTAL", network_status: "OUT_OF_NETWORK", service_date: "2026-09-10T00:00:00Z", patient_responsibility_cents: 0 }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status 400 with error_id ERR_INVALID_REQUEST"

      - name: medicare_and_ucr_rows_are_immutable_without_version_field
        claim_type: Immutability
        grounds:
          - entities.MedicareFeeScheduleEntry
          - entities.UsualCustomaryRate
        distinguishing_aspect: "common_fields: false entities carry id and created_at but no version and no updated_at; no update/delete endpoints exist for them, and a PATCH attempt is not part of the declared surface (404/405 style rejection at minimum — the scaffold declares no such route)."
        test_recipe:
          setup: ["One Medicare entry and one UCR row loaded."]
          setup_api_calls:
            - call: "POST /medicare-fee-schedule"
              payload: { procedure_code: "00100", region_code: "R9", base_rate_cents: 5000, geographic_adjustment_factor: 1.00, effective_year: 2026 }
              as: NetworkAdmin
              captures: { mf_id: $.data.id }
          trigger:
            - call: "GET /medicare-fee-schedule"
              payload: { procedure_code: "00100", region_code: "R9" }
              as: NetworkAdmin
          assert:
            - "returned row has non-null id and created_at"
            - "returned row has no version field and no updated_at field"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: reprice_from_received_without_lines_returns_claim_has_no_lines
        claim_type: invalid_transition
        grounds:
          - state_machines.Claim
          - errors[ERR_CLAIM_HAS_NO_LINES]
        distinguishing_aspect: "Reprice from RECEIVED (zero lines) is rejected 422 ERR_CLAIM_HAS_NO_LINES and the claim stays RECEIVED — the PENDING_LINES precondition fails before any pricing happens."
        test_recipe:
          setup: ["Payer, provider, Medicare entry and policy exist; claim created with no lines."]
          setup_api_calls:
            - call: "POST /payer-clients"
              payload: { payer_name: "P1", fee_percent: 0.25, fee_cap_cents_per_claim: 5000 }
              as: OpsAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "2000000006", legal_name: "PR", tin: "T" }
              as: NetworkAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /medicare-fee-schedule"
              payload: { procedure_code: "99283", region_code: "R1", base_rate_cents: 10000, geographic_adjustment_factor: 1.10, effective_year: 2026 }
              as: NetworkAdmin
            - call: "POST /repricing-policies"
              payload: { payer_client_id: "${p1_id}", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", methodology: "PERCENT_OF_MEDICARE", percent_of_medicare: 1.50, priority: 1 }
              as: PayerAdmin
              as_user_id: "${p1_id}"
            - call: "POST /claims"
              payload: { payer_client_id: "${p1_id}", provider_id: "${pr_id}", external_claim_ref: "C3", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", service_date: "2026-09-10T00:00:00Z", patient_responsibility_cents: 0 }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { c_id: $.data.id, c_v: $.data.version }
          trigger:
            - call: "POST /claims/${c_id}/reprice"
              payload: { expected_claim_version: "${c_v}" }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status 422 with error_id ERR_CLAIM_HAS_NO_LINES"
            - "Claim.${c_id}.status == RECEIVED"

      - name: reprice_from_finalized_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Claim
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Reprice is only declared from PENDING_LINES; calling it on a FINALIZED claim returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Claim priced and finalized (33000 fixture)."]
          setup_api_calls:
            - call: "POST /payer-clients"
              payload: { payer_name: "P1", fee_percent: 0.25, fee_cap_cents_per_claim: 5000 }
              as: OpsAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "2000000007", legal_name: "PR", tin: "T" }
              as: NetworkAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /medicare-fee-schedule"
              payload: { procedure_code: "99283", region_code: "R1", base_rate_cents: 10000, geographic_adjustment_factor: 1.10, effective_year: 2026 }
              as: NetworkAdmin
            - call: "POST /repricing-policies"
              payload: { payer_client_id: "${p1_id}", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", methodology: "PERCENT_OF_MEDICARE", percent_of_medicare: 1.50, priority: 1 }
              as: PayerAdmin
              as_user_id: "${p1_id}"
            - call: "POST /claims"
              payload: { payer_client_id: "${p1_id}", provider_id: "${pr_id}", external_claim_ref: "C4", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", service_date: "2026-09-10T00:00:00Z", patient_responsibility_cents: 0 }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /claims/${c_id}/lines"
              payload: { procedure_code: "99283", quantity_units: 2, unit_charge_cents: 30000, region_code: "R1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /claims/${c_id}/reprice"
              payload: { expected_claim_version: "${c_v} + 1" }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { c_v2: $.data.version }
            - call: "POST /claims/${c_id}/finalize"
              payload: {}
              as: PayerRep
              as_user_id: "${p1_id}"
          trigger:
            - call: "POST /claims/${c_id}/reprice"
              payload: { expected_claim_version: "${c_v2} + 1" }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status 409 with error_id ERR_INVALID_STATE"
            - "Claim.${c_id}.status remains FINALIZED"

      - name: terminal_negotiation_case_lockdown
        claim_type: invalid_transition
        grounds:
          - state_machines.NegotiationCase
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "From terminal WITHDRAWN, every transition trigger (offer, counter, accept, withdraw again) is rejected ERR_INVALID_STATE — terminal lockdown."
        test_recipe:
          setup: ["Claim PRICED; negotiation case withdrawn."]
          setup_api_calls:
            - call: "POST /payer-clients"
              payload: { payer_name: "P1", fee_percent: 0.25, fee_cap_cents_per_claim: 5000 }
              as: OpsAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "2000000008", legal_name: "PR", tin: "T" }
              as: NetworkAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /medicare-fee-schedule"
              payload: { procedure_code: "99283", region_code: "R1", base_rate_cents: 10000, geographic_adjustment_factor: 1.10, effective_year: 2026 }
              as: NetworkAdmin
            - call: "POST /repricing-policies"
              payload: { payer_client_id: "${p1_id}", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", methodology: "PERCENT_OF_MEDICARE", percent_of_medicare: 1.50, priority: 1 }
              as: PayerAdmin
              as_user_id: "${p1_id}"
            - call: "POST /claims"
              payload: { payer_client_id: "${p1_id}", provider_id: "${pr_id}", external_claim_ref: "C5", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", service_date: "2026-09-10T00:00:00Z", patient_responsibility_cents: 0 }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /claims/${c_id}/lines"
              payload: { procedure_code: "99283", quantity_units: 2, unit_charge_cents: 30000, region_code: "R1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /claims/${c_id}/reprice"
              payload: { expected_claim_version: "${c_v} + 1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /negotiation-cases"
              payload: { claim_id: "${c_id}" }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { nc_id: $.data.id, nc_v: $.data.version }
            - call: "POST /negotiation-cases/${nc_id}/withdraw"
              payload: {}
              as: PayerRep
              as_user_id: "${p1_id}"
          trigger:
            - call: "POST /negotiation-cases/${nc_id}/offer"
              payload: { offer_cents: 30000, expected_case_version: "${nc_v} + 1" }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /negotiation-cases/${nc_id}/withdraw"
              payload: {}
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "offer on WITHDRAWN case rejected 409 ERR_INVALID_STATE"
            - "second withdraw rejected 409 ERR_INVALID_STATE"
            - "NegotiationCase.${nc_id}.status remains WITHDRAWN"

      - name: appeal_window_deadline_enforced
        claim_type: guarded_transitions
        grounds:
          - state_machines.ProviderAppeal
          - entities.ProviderAppeal.fields.appeal_window_deadline
          - errors[ERR_APPEAL_WINDOW_CLOSED]
        distinguishing_aspect: "Appeal submitted at determination.created_at + 45 days exactly succeeds; one second later fails 409 ERR_APPEAL_WINDOW_CLOSED — the window boundary is inclusive."
        test_recipe:
          setup:
            - "Clock 2026-09-10T10:00:00Z at reprice time; determination created then. Deadline = 2026-10-25T10:00:00Z."
            - "Two claims priced identically so each has its own determination; appeal claim 1 at deadline, claim 2 one second past."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T10:00:00Z" }
              as: OpsAdmin
            - call: "POST /payer-clients"
              payload: { payer_name: "P1", fee_percent: 0.25, fee_cap_cents_per_claim: 5000 }
              as: OpsAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "2000000009", legal_name: "PR", tin: "T" }
              as: NetworkAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /medicare-fee-schedule"
              payload: { procedure_code: "99283", region_code: "R1", base_rate_cents: 10000, geographic_adjustment_factor: 1.10, effective_year: 2026 }
              as: NetworkAdmin
            - call: "POST /repricing-policies"
              payload: { payer_client_id: "${p1_id}", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", methodology: "PERCENT_OF_MEDICARE", percent_of_medicare: 1.50, priority: 1 }
              as: PayerAdmin
              as_user_id: "${p1_id}"
            - call: "POST /claims"
              payload: { payer_client_id: "${p1_id}", provider_id: "${pr_id}", external_claim_ref: "W1", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", service_date: "2026-09-01T00:00:00Z", patient_responsibility_cents: 0 }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { c1_id: $.data.id, c1_v: $.data.version }
            - call: "POST /claims/${c1_id}/lines"
              payload: { procedure_code: "99283", quantity_units: 2, unit_charge_cents: 30000, region_code: "R1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /claims/${c1_id}/reprice"
              payload: { expected_claim_version: "${c1_v} + 1" }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /claims"
              payload: { payer_client_id: "${p1_id}", provider_id: "${pr_id}", external_claim_ref: "W2", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", service_date: "2026-09-01T00:00:00Z", patient_responsibility_cents: 0 }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { c2_id: $.data.id, c2_v: $.data.version }
            - call: "POST /claims/${c2_id}/lines"
              payload: { procedure_code: "99283", quantity_units: 2, unit_charge_cents: 30000, region_code: "R1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /claims/${c2_id}/reprice"
              payload: { expected_claim_version: "${c2_v} + 1" }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { d2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-25T10:00:00Z" }
              as: OpsAdmin
            - call: "POST /claims/${c1_id}/appeals"
              payload: { determination_id: "${d1_id}", appeal_reason: "at deadline" }
              as: ProviderRep
              as_user_id: "${pr_id}"
              captures: { ap1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-25T10:00:01Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /claims/${c2_id}/appeals"
              payload: { determination_id: "${d2_id}", appeal_reason: "one second late" }
              as: ProviderRep
              as_user_id: "${pr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "appeal at exactly the deadline returns 201 with status SUBMITTED"
            - "appeal one second after the deadline returns 409 ERR_APPEAL_WINDOW_CLOSED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: qpa_median_even_count_takes_lower_middle
        claim_type: Correct Result
        grounds:
          - calculations.qpa_benchmark
          - entities.IdrSubmission.fields.qpa_cents
        distinguishing_aspect: "With four contracted-rate candidates (15000, 25000, 32000, 48000) the QPA median is the lower-middle element 25000 — not the average of the two middles (28500); the even-count rule is pinned to index count/2 - 1."
        test_recipe:
          setup:
