  - rule_id: transitive_cascade
    instances:
      - name: renewal_deadline_cascade_hold_then_seat_then_priority_then_at_risk
        grounds:
          - state_machines.Season.RENEWAL_OPEN_to_GENERAL_ONSALE
          - state_machines.SeatHold.ACTIVE_to_EXPIRED
          - calculations.seat_occupancy_and_season_census
          - entities.TicketAccount.fields.renewal_priority_active
          - state_machines.TicketAccount.service_status.PROSPECT_to_AT_RISK
        distinguishing_aspect: |
          Cascade A originates from the Season RENEWAL_OPEN -> GENERAL_ONSALE transition and is four links
          deep, each caused by the previous one: the season change expires the RENEWAL_HOLD, the expiry
          frees the seat and rewrites the census, the freed seat clears renewal_priority_active, and that
          flag flipping moves service_status to AT_RISK.
        test_recipe:
          setup:
            - "Season in RENEWAL_OPEN with renewal_deadline_utc 2026-09-15T00:00:00Z and one game on 2026-10-10T23:00:00Z"
            - "Two ZONE_C seats; seat s1 carries an ACTIVE RENEWAL_HOLD for account acct1 over [2026-08-01T00:00:00Z, 2026-09-30T00:00:00Z), so s1 is HELD and acct1.renewal_priority_active is true"
            - "acct1 has no orders at all, so it has zero CONFIRMED orders for the season and its service_status is still PROSPECT"
            - "Clock moved to 2026-09-16T00:00:00Z - past the renewal deadline but well inside the hold's own window, so only the season cascade can expire it"
          setup_api_calls:
            - call: "POST /ticketing/seasons"
              payload: { code: "2026-27", year: 2026, total_home_games: 1, renewal_deadline_utc: "2026-09-15T00:00:00Z", revenue_goal_cents: 100000000 }
