            - call: "POST /appellate/records/${rec_ce1}/transcript-orders"
              payload: { hearing_date: "2026-04-01T10:00:00Z", court_reporter: "R", estimated_pages: 5 }
              as: Attorney
              as_user_id: "${att_ce1}"
              captures: { to_ce1: $.data.id }
            - call: "GET /appellate/cases/${case_ce1}/briefing-schedule"
              payload: {}
              as: Attorney
              as_user_id: "${att_ce1}"
              captures: { sched_ce1: "$.data[0].id", sched_ce1_status: "$.data[0].status" }
            - call: "POST /appellate/cases/${case_ce1}/briefs"
              payload: { schedule_id: "${sched_ce1}", brief_type: "OPENING", author_attorney_id: "${att_ce1}", page_count: 5, word_count: 1000 }
              as: Attorney
              as_user_id: "${att_ce1}"
              captures: { brief_ce1: $.data.id }
