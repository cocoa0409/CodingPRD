      - name: seller_settlement_circular_window_and_penalty_order
        grounds:
          - calculations.seller_settlement
          - entities.TitleRecord.fields.late
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: storage_recovery needs the sale
          day which the same close-lot transition fixes, and the title late
          penalty depends on a receipt timestamp measured against assigned_at;
          the pinned 5-step order (gross -> fee -> storage -> penalty -> net)
          makes the value well-defined: received 2026-09-01, title received
