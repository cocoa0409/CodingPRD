scenario: |
  755. Participatory-Budgeting & Civic Engagement: idea submission & category,
  eligibility (resident/age) & verification, proposal development & cost estimate,
  voting (ranked/allocation) & cap, project selection & funding, implementation
  tracking, report-back, multilingual/accessibility.

domain_name: participatory-budgeting
api_prefix: "/"

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Posture-driven gating"
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
  entity_topology: hybrid
  # BudgetCycle is a posture parent whose `phase` gates all child operations;
  # Proposal/Ballot/Category hang under it, but BallotEntry->Proposal and
  # Proposal->Resident are cross-aggregate references (hybrid).
  state_machine_shape: posture_driven
  # Cycle.phase (DRAFT..CLOSED) gates children; children carry their own
  # cyclic machines (Ballot CAST<->WITHDRAWN, Milestone IN_PROGRESS<->BLOCKED,
  # Resident REJECTED->PENDING_VERIFICATION).
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  # Resident owns own proposals/ballots; Reviewer owns verification/costing/
  # milestones/report-backs; BudgetAdmin owns cycle/category/selection/funding.
  consistency_model: immediate
  difficulty_band: expert  # 10 entities, 5 state machines, 4 calculations

# ============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# ============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# 1.1 Entity-Relationship Table
# ============================================================================
entities:
  - name: BudgetCycle
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human label for the participatory-budgeting cycle."
      - name: fiscal_year
        type: integer
        source: input
        description: "Fiscal year the cycle funds."
      - name: total_budget_cents
        type: integer
        source: input
        description: "Total disbursable budget for the cycle, in integer cents."
        constraints: "> 0"
      - name: voting_method
        type: enum
        source: input
        description: "Tally method for this cycle."
        constraints: "one of {RANKED, ALLOCATION}"
      - name: per_project_cap_cents
        type: integer
        source: input
        description: "Maximum award any single proposal may receive, in cents."
        constraints: "> 0"
      - name: per_voter_allocation_cap_cents
        type: integer
        source: input
        description: "Max cents a single voter may allocate across a ballot (ALLOCATION method). Ignored for RANKED."
        constraints: ">= 0"
      - name: min_voter_age
        type: integer
        source: input
        description: "Minimum resident age (in full years) required to cast a ballot in this cycle."
        default: 16
        constraints: ">= 0"
      - name: default_language
        type: enum
        source: input
        description: "Default content language for multilingual rendering."
        default: "en"
        constraints: "one of {en, es, zh, vi, ar}"
      - name: submission_start
        type: datetime
        source: input
        description: "Half-open [start,end) window during which ideas may be submitted."
      - name: submission_end
        type: datetime
        source: input
        description: "Exclusive end of the submission window."
      - name: voting_start
        type: datetime
        source: input
        description: "Half-open [start,end) window during which ballots may be cast."
      - name: voting_end
        type: datetime
        source: input
        description: "Exclusive end of the voting window."
      - name: phase
        type: enum
        source: system
        description: "Posture that gates all child operations."
        default: "DRAFT"
        constraints: "one of {DRAFT, SUBMISSION, DEVELOPMENT, VOTING, SELECTION, IMPLEMENTATION, CLOSED}"
      - name: total_committed_cents
        type: integer
        source: computed
        description: "Sum of Category.committed_cents across this cycle's categories. See calculations.cycle_budget_ledger."
        default: 0
      - name: uncommitted_cents
        type: integer
        source: computed
        description: "total_budget_cents - total_committed_cents. Named conserved quantity for the budget-conservation invariant."
        default: 0
      - name: completed_project_count
        type: integer
        source: system
        description: "Count of proposals in this cycle that reached COMPLETED (bumped by the Proposal COMPLETED cascade)."
        default: 0

  - name: Category
    parent: BudgetCycle
    common_fields: true
    fields:
      - name: budget_cycle_id
        type: string
        source: input
        description: "FK -> BudgetCycle.id; the owning cycle."
      - name: name
        type: string
        source: input
        description: "Category label (e.g., Parks, Transit, Youth)."
      - name: description
        type: string
        source: input
        description: "Category description."
        default: ""
      - name: category_budget_cap_cents
        type: integer
        source: input
        description: "Per-category sub-cap: total awards to this category may not exceed this, in cents."
        constraints: "> 0"
      - name: display_order
        type: integer
        source: input
        description: "Sort index for UI display only; never a business tie-break."
        default: 0
      - name: committed_cents
        type: integer
        source: computed
        description: "Sum of awarded_cents over proposals in this category whose status IN {SELECTED, IN_IMPLEMENTATION, COMPLETED}. See calculations.cycle_budget_ledger."
        default: 0
      - name: remaining_cap_cents
        type: integer
        source: computed
        description: "category_budget_cap_cents - committed_cents."
        default: 0

  - name: Resident
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Resident's full legal name."
      - name: date_of_birth
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD) used to derive age against the logical clock."
      - name: residency_document_ref
        type: string
        source: input
        description: "Opaque reference to the uploaded proof-of-residency document."
      - name: residency_address
        type: string
        source: input
        description: "Claimed in-jurisdiction address."
      - name: preferred_language
        type: enum
        source: input
        description: "Resident's preferred content language (multilingual support)."
        default: "en"
        constraints: "one of {en, es, zh, vi, ar}"
      - name: accessibility_needs
        type: array
        source: input
        description: "List of accessibility accommodation codes (e.g., [SCREEN_READER, LARGE_PRINT])."
        default: []
      - name: eligibility_status
        type: enum
        source: system
        description: "Verification posture of the resident."
        default: "UNVERIFIED"
        constraints: "one of {UNVERIFIED, PENDING_VERIFICATION, VERIFIED, REJECTED}"
      - name: age
        type: integer
        source: computed
        description: "Full years between date_of_birth and the logical clock now. See calculations.resident_age."
        default: 0
      - name: rejection_reason
        type: string
        source: system
        description: "Reason captured when a verification decision REJECTs the resident."
        default: null

  - name: Proposal
    parent: BudgetCycle
    common_fields: true
    fields:
      - name: budget_cycle_id
        type: string
        source: input
        description: "FK -> BudgetCycle.id; the cycle this proposal competes in."
      - name: category_id
        type: string
        source: input
        description: "FK -> Category.id; must belong to the same cycle."
      - name: submitter_id
        type: string
        source: input
        description: "FK -> Resident.id; set from the acting Resident's X-User-ID."
      - name: title
        type: string
        source: input
        description: "Proposal title."
      - name: summary
        type: string
        source: input
        description: "Short description of the idea."
      - name: translations
        type: object
        source: input
        description: "Map of language-code -> translated {title, summary} for multilingual rendering."
        default: {}
      - name: status
        type: enum
        source: system
        description: "Proposal lifecycle state."
        default: "DRAFT"
        constraints: "one of {DRAFT, SUBMITTED, DEVELOPING, REJECTED, COSTED, ON_BALLOT, SELECTED, NOT_SELECTED, IN_IMPLEMENTATION, COMPLETED, CANCELLED}"
      - name: provisional_estimate_cents
        type: integer
        source: computed
        description: "Provisional cost (as-entered contingency), recomputed on every cost-line-item add. See calculations.proposal_cost_estimate variant provisional."
        default: 0
      - name: estimated_cost_cents
        type: integer
        source: computed
        description: "Final costed amount (floored contingency + overhead), set at finalize-cost. See calculations.proposal_cost_estimate variant final."
        default: 0
      - name: vote_score
        type: integer
        source: computed
        description: "Running tally over CAST ballots; units depend on cycle.voting_method (Borda points or allocated cents). See calculations.vote_tally."
        default: 0
      - name: awarded_cents
        type: integer
        source: system
        description: "Amount awarded by the current selection run; 0 unless SELECTED/IN_IMPLEMENTATION/COMPLETED. Reset to 0 on CANCELLED."
        default: 0
      - name: rejection_reason
        type: string
        source: system
        description: "Reason captured when a review decision REJECTs the proposal."
        default: null

  - name: CostLineItem
    parent: Proposal
    common_fields: true
    fields:
      - name: proposal_id
        type: string
        source: input
        description: "FK -> Proposal.id; the proposal being costed."
      - name: label
        type: string
        source: input
        description: "Line-item label (e.g., 'Playground surfacing')."
      - name: unit_cost_cents
        type: integer
        source: input
        description: "Cost per unit in integer cents."
        constraints: ">= 0"
      - name: quantity
        type: integer
        source: input
        description: "Number of units."
        constraints: ">= 1"
      - name: contingency_pct
        type: number
        source: input
        description: "Line-level contingency fraction (0.10 = 10%)."
        default: 0
        constraints: ">= 0"
      - name: line_provisional_cents
        type: integer
        source: computed
        description: "round_half_up(unit_cost_cents * quantity * (1 + max(contingency_pct, 0))). See calculations.proposal_cost_estimate."
        default: 0

  - name: Ballot
    parent: BudgetCycle
    common_fields: true
    fields:
      - name: budget_cycle_id
        type: string
        source: input
        description: "FK -> BudgetCycle.id; the cycle being voted in."
      - name: voter_id
        type: string
        source: input
        description: "FK -> Resident.id; set from the acting Resident's X-User-ID."
      - name: status
        type: enum
        source: system
        description: "Ballot lifecycle state."
        default: "DRAFT"
        constraints: "one of {DRAFT, CAST, WITHDRAWN}"
      - name: method
        type: enum
        source: system
        description: "Snapshot of cycle.voting_method taken at ballot creation."
        constraints: "one of {RANKED, ALLOCATION}"
      - name: total_allocated_cents
        type: integer
        source: computed
        description: "Sum of allocated_cents over this ballot's active entries (ALLOCATION method). Named conserved quantity for the voter-allocation invariant."
        default: 0
      - name: cast_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the ballot was most recently CAST."
        default: null

  - name: BallotEntry
    parent: Ballot
    common_fields: true
    fields:
      - name: ballot_id
        type: string
        source: input
        description: "FK -> Ballot.id; the owning ballot."
      - name: proposal_id
        type: string
        source: input
        description: "FK -> Proposal.id; the proposal being ranked/funded."
      - name: rank
        type: integer
        source: input
        description: "1-based preference rank (RANKED method only; null for ALLOCATION)."
        default: null
        constraints: "1 <= rank <= 10 when present"
      - name: allocated_cents
        type: integer
        source: input
        description: "Cents allocated to the proposal (ALLOCATION method only; null for RANKED)."
        default: null
        constraints: ">= 0 when present"
      - name: points
        type: integer
        source: computed
        description: "Borda points derived from rank (RANKED method): max(0, RANK_MAX_POINTS - (rank - 1)). See calculations.vote_tally."
        default: 0
      - name: active
        type: boolean
        source: system
        description: "False once the owning ballot is WITHDRAWN; excluded from tallies while inactive."
        default: true

  - name: SelectionRun
    parent: BudgetCycle
    common_fields: true
    fields:
      - name: budget_cycle_id
        type: string
        source: input
        description: "FK -> BudgetCycle.id; the cycle whose ballots this run tallies and funds."
      - name: selected_count
        type: integer
        source: computed
        description: "Number of proposals this run set to SELECTED. See calculations.funding_selection."
        default: 0
      - name: total_awarded_cents
        type: integer
        source: computed
        description: "Sum of awarded_cents across proposals SELECTED by this run."
        default: 0
      - name: is_current
        type: boolean
        source: system
        description: "True for the authoritative run; a newer run supersedes prior runs (sets their is_current=false)."
        default: true

  - name: Milestone
    parent: Proposal
    common_fields: true
    fields:
      - name: proposal_id
        type: string
        source: input
        description: "FK -> Proposal.id; the funded proposal being implemented."
      - name: title
        type: string
        source: input
        description: "Milestone label."
      - name: scheduled_start
        type: datetime
        source: input
        description: "Closed-interval [start,end] planned window for this milestone."
      - name: scheduled_end
        type: datetime
        source: input
        description: "Inclusive end of the planned window."
      - name: status
        type: enum
        source: system
        description: "Milestone implementation state."
        default: "PLANNED"
        constraints: "one of {PLANNED, IN_PROGRESS, BLOCKED, COMPLETED}"
      - name: blocked_reason
        type: string
        source: system
        description: "Reason captured on an IN_PROGRESS -> BLOCKED transition."
        default: null

  - name: ReportBack
    parent: Proposal
    common_fields: false
    fields:
      - name: proposal_id
        type: string
        source: input
        description: "FK -> Proposal.id; the implemented proposal being reported on."
      - name: period_label
        type: string
        source: input
        description: "Reporting period label (e.g., 'Q1 2027')."
      - name: narrative
        type: string
        source: input
        description: "Report-back narrative (default language)."
      - name: translations
        type: object
        source: input
        description: "Map of language-code -> translated narrative for multilingual report-back."
        default: {}
      - name: spent_cents
        type: integer
        source: input
        description: "Cents spent in this reporting period."
        constraints: ">= 0"
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the report-back was published."

# ============================================================================
# 1.2 State Machine Table
# ============================================================================
state_machines:
  - entity: BudgetCycle
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMISSION
        trigger: "POST /budget-cycles/{id}/phase-transitions {target_phase: SUBMISSION}"
        actor: BudgetAdmin
        preconditions:
          - "cycle.phase == DRAFT"
          - "at least one Category exists for the cycle"
        side_effects:
          - "increments BudgetCycle.version by 1"
      - from: SUBMISSION
        to: DEVELOPMENT
        trigger: "POST /budget-cycles/{id}/phase-transitions {target_phase: DEVELOPMENT}"
        actor: BudgetAdmin
        preconditions:
          - "cycle.phase == SUBMISSION"
        side_effects:
          - "increments BudgetCycle.version by 1"
      - from: DEVELOPMENT
        to: VOTING
        trigger: "POST /budget-cycles/{id}/phase-transitions {target_phase: VOTING}"
        actor: BudgetAdmin
        preconditions:
          - "cycle.phase == DEVELOPMENT"
        side_effects:
          - "CASCADE: for each Proposal in this cycle with status == COSTED, transition it COSTED -> ON_BALLOT (system). Proposals not COSTED remain and can no longer be costed."
          - "increments BudgetCycle.version by 1"
        note: "This is the Proposal<-BudgetCycle cross-entity dependency: a Proposal reaches ON_BALLOT only because its cycle entered VOTING."
      - from: VOTING
        to: SELECTION
        trigger: "POST /budget-cycles/{id}/phase-transitions {target_phase: SELECTION}"
        actor: BudgetAdmin
        preconditions:
          - "cycle.phase == VOTING"
        side_effects:
          - "increments BudgetCycle.version by 1"
      - from: SELECTION
        to: IMPLEMENTATION
        trigger: "POST /budget-cycles/{id}/phase-transitions {target_phase: IMPLEMENTATION}"
        actor: BudgetAdmin
        preconditions:
          - "cycle.phase == SELECTION"
          - "at least one SelectionRun with is_current == true exists for the cycle"
        side_effects:
          - "increments BudgetCycle.version by 1"
      - from: IMPLEMENTATION
        to: CLOSED
        trigger: "POST /budget-cycles/{id}/phase-transitions {target_phase: CLOSED}"
        actor: BudgetAdmin
        preconditions:
          - "cycle.phase == IMPLEMENTATION"
        side_effects:
          - "increments BudgetCycle.version by 1"
        note: "Linear posture pipeline; any target_phase that is not the single next phase in DRAFT->SUBMISSION->DEVELOPMENT->VOTING->SELECTION->IMPLEMENTATION->CLOSED is rejected with ERR_INVALID_PHASE_TRANSITION."

  - entity: Resident
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: PENDING_VERIFICATION
        trigger: "POST /residents/{id}/verification-requests"
        actor: Resident
        preconditions:
          - "resident.eligibility_status == UNVERIFIED"
        side_effects:
          - "increments Resident.version by 1"
      - from: REJECTED
        to: PENDING_VERIFICATION
        trigger: "POST /residents/{id}/verification-requests"
        actor: Resident
        preconditions:
          - "resident.eligibility_status == REJECTED"
        side_effects:
          - "clears rejection_reason"
          - "increments Resident.version by 1"
        note: "Revision loop: a rejected resident may resubmit documents (cyclic machine)."
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /residents/{id}/verification-decisions {decision: APPROVE}"
        actor: Reviewer
        preconditions:
          - "resident.eligibility_status == PENDING_VERIFICATION"
        side_effects:
          - "increments Resident.version by 1"
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /residents/{id}/verification-decisions {decision: REJECT}"
        actor: Reviewer
        preconditions:
          - "resident.eligibility_status == PENDING_VERIFICATION"
        side_effects:
          - "sets rejection_reason from request"
          - "increments Resident.version by 1"

  - entity: Proposal
    initial_state: DRAFT
    terminal_states: [REJECTED, NOT_SELECTED, COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /proposals/{id}/submit"
        actor: Resident
        preconditions:
          - "proposal.status == DRAFT"
          - "acting Resident.id == proposal.submitter_id"
          - "cycle.phase == SUBMISSION"
        side_effects:
          - "increments Proposal.version by 1"
      - from: SUBMITTED
        to: DEVELOPING
        trigger: "POST /proposals/{id}/review-decisions {decision: APPROVE}"
        actor: Reviewer
        preconditions:
          - "proposal.status == SUBMITTED"
          - "cycle.phase == DEVELOPMENT"
        side_effects:
          - "increments Proposal.version by 1"
        note: "Approve branch of the fork; divergent side-effect set from the REJECT branch below."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /proposals/{id}/review-decisions {decision: REJECT}"
        actor: Reviewer
        preconditions:
          - "proposal.status == SUBMITTED"
          - "cycle.phase == DEVELOPMENT"
        side_effects:
          - "sets Proposal.rejection_reason from request"
          - "increments Proposal.version by 1"
        note: "Reject branch of the fork; sets rejection_reason (the approve branch does not). Divergent branch side-effects satisfy the non-linear fork requirement."
      - from: DEVELOPING
        to: COSTED
        trigger: "POST /proposals/{id}/finalize-cost"
        actor: Reviewer
        preconditions:
          - "proposal.status == DEVELOPING"
          - "cycle.phase == DEVELOPMENT"
          - "proposal has >= 1 CostLineItem"
        side_effects:
          - "computes Proposal.estimated_cost_cents via calculations.proposal_cost_estimate variant final"
          - "increments Proposal.version by 1"
      - from: COSTED
        to: ON_BALLOT
        trigger: "system: BudgetCycle DEVELOPMENT -> VOTING cascade"
        actor: system
        preconditions:
          - "proposal.status == COSTED"
          - "cycle.phase transitioning to VOTING"
        side_effects:
          - "increments Proposal.version by 1"
        note: "Cross-entity guard: this transition can only fire as a side-effect of the owning cycle entering VOTING."
      - from: ON_BALLOT
        to: SELECTED
        trigger: "system: POST /budget-cycles/{id}/selection-runs (funding_selection funds this proposal)"
        actor: system
        preconditions:
          - "proposal.status == ON_BALLOT"
          - "funding_selection awards this proposal (award <= per_project_cap, <= remaining_total, <= remaining_category)"
        side_effects:
          - "sets Proposal.awarded_cents to the funded amount"
          - "CASCADE hop 2: recompute owning Category.committed_cents (this award now counts toward the category)"
          - "CASCADE hop 3: the Category.committed_cents change recomputes BudgetCycle.total_committed_cents and uncommitted_cents"
          - "increments Proposal.version by 1"
      - from: ON_BALLOT
        to: NOT_SELECTED
        trigger: "system: POST /budget-cycles/{id}/selection-runs (funding_selection does not fund this proposal)"
        actor: system
        preconditions:
          - "proposal.status == ON_BALLOT"
          - "funding_selection skips this proposal (cost exceeds per_project_cap OR cost exceeds remaining_total OR cost exceeds remaining_category)"
        side_effects:
          - "leaves Proposal.awarded_cents at 0"
          - "increments Proposal.version by 1"
      - from: SELECTED
        to: IN_IMPLEMENTATION
        trigger: "POST /proposals/{id}/release-funding"
        actor: BudgetAdmin
        preconditions:
          - "proposal.status == SELECTED"
          - "cycle.phase == IMPLEMENTATION"
        side_effects:
          - "increments Proposal.version by 1"
      - from: SELECTED
        to: CANCELLED
        trigger: "POST /proposals/{id}/cancel-funding"
        actor: BudgetAdmin
        preconditions:
          - "proposal.status == SELECTED"
          - "cycle.phase IN {SELECTION, IMPLEMENTATION}"
        side_effects:
          - "COMPENSATION: resets Proposal.awarded_cents to 0"
          - "recompute owning Category.committed_cents (award removed)"
          - "the Category change recomputes BudgetCycle.total_committed_cents and uncommitted_cents (restored)"
          - "increments Proposal.version by 1"
      - from: IN_IMPLEMENTATION
        to: CANCELLED
        trigger: "POST /proposals/{id}/cancel-funding"
        actor: BudgetAdmin
        preconditions:
          - "proposal.status == IN_IMPLEMENTATION"
          - "cycle.phase == IMPLEMENTATION"
        side_effects:
          - "COMPENSATION: resets Proposal.awarded_cents to 0"
          - "recompute owning Category.committed_cents (award removed)"
          - "the Category change recomputes BudgetCycle.total_committed_cents and uncommitted_cents (restored)"
          - "increments Proposal.version by 1"
      - from: IN_IMPLEMENTATION
        to: COMPLETED
        trigger: "system: POST /milestones/{id}/transitions {target_status: COMPLETED} when it is the last non-COMPLETED milestone"
        actor: system
        preconditions:
          - "proposal.status == IN_IMPLEMENTATION"
          - "every Milestone of this proposal has status == COMPLETED"
          - "proposal has >= 1 Milestone"
        side_effects:
          - "CASCADE hop 2: increments BudgetCycle.completed_project_count by 1 and increments Category (via committed set unchanged)"
          - "increments Proposal.version by 1"

  - entity: Ballot
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: CAST
        trigger: "POST /ballots/{id}/cast"
        actor: Resident
        preconditions:
          - "ballot.status == DRAFT"
          - "acting Resident.id == ballot.voter_id"
          - "cycle.phase == VOTING"
          - "RANKED: entry ranks are distinct and each in [1,10]"
          - "ALLOCATION: sum(entry.allocated_cents) <= cycle.per_voter_allocation_cap_cents"
        side_effects:
          - "sets Ballot.cast_at to clock now"
          - "for each entry, recompute the referenced Proposal.vote_score via calculations.vote_tally (add this ballot's contribution)"
          - "increments Ballot.version by 1"
      - from: CAST
        to: WITHDRAWN
        trigger: "POST /ballots/{id}/withdraw"
        actor: Resident
        preconditions:
          - "ballot.status == CAST"
          - "acting Resident.id == ballot.voter_id"
          - "cycle.phase == VOTING"
        side_effects:
          - "COMPENSATION: sets each entry.active = false and subtracts this ballot's contribution from each referenced Proposal.vote_score (exact reversal)"
          - "sets Ballot.total_allocated_cents to 0"
          - "increments Ballot.version by 1"
      - from: WITHDRAWN
        to: CAST
        trigger: "POST /ballots/{id}/cast"
        actor: Resident
        preconditions:
          - "ballot.status == WITHDRAWN"
          - "acting Resident.id == ballot.voter_id"
          - "cycle.phase == VOTING"
          - "RANKED: entry ranks are distinct and each in [1,10]"
          - "ALLOCATION: sum(entry.allocated_cents) <= cycle.per_voter_allocation_cap_cents"
        side_effects:
          - "sets each entry.active = true and re-adds this ballot's contribution to each referenced Proposal.vote_score"
          - "sets Ballot.cast_at to clock now"
          - "increments Ballot.version by 1"
        note: "Cyclic machine: CAST <-> WITHDRAWN re-cast loop."

  - entity: Milestone
    initial_state: PLANNED
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /milestones/{id}/transitions {target_status: IN_PROGRESS}"
        actor: Reviewer
        preconditions:
          - "milestone.status == PLANNED"
          - "owning Proposal.status == IN_IMPLEMENTATION"
        side_effects:
          - "increments Milestone.version by 1"
      - from: IN_PROGRESS
        to: BLOCKED
        trigger: "POST /milestones/{id}/transitions {target_status: BLOCKED}"
        actor: Reviewer
        preconditions:
          - "milestone.status == IN_PROGRESS"
        side_effects:
          - "sets Milestone.blocked_reason from request"
          - "increments Milestone.version by 1"
      - from: BLOCKED
        to: IN_PROGRESS
        trigger: "POST /milestones/{id}/transitions {target_status: IN_PROGRESS}"
        actor: Reviewer
        preconditions:
          - "milestone.status == BLOCKED"
        side_effects:
          - "clears Milestone.blocked_reason"
          - "increments Milestone.version by 1"
        note: "Cyclic machine: IN_PROGRESS <-> BLOCKED loop."
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /milestones/{id}/transitions {target_status: COMPLETED}"
        actor: Reviewer
        preconditions:
          - "milestone.status == IN_PROGRESS"
        side_effects:
          - "BUBBLE-UP: if every Milestone of the owning Proposal is now COMPLETED, transition Proposal IN_IMPLEMENTATION -> COMPLETED (which itself bumps BudgetCycle.completed_project_count)"
          - "increments Milestone.version by 1"

# ============================================================================
# 1.2.1 Concurrency Rules
# ============================================================================
concurrency_rules:
  - rule_id: selection-run-create-stale-cycle
    parent_entity: BudgetCycle
    write_endpoint: "POST /budget-cycles/{id}/selection-runs"
    occ_field: "expected_budgetcycle_version"
    description: |
      Creating a SelectionRun against a BudgetCycle whose version has advanced
      since the client last observed it is rejected. A new run legitimately
      supersedes the prior current run (re-tallying after, e.g., a late
      report of a corrected estimate), so a second creation is a valid
      product operation; it is rejected only when it carries a stale
      expected_budgetcycle_version, because the run just created by the prior
      writer already advanced the cycle's version and superseded the results
      the current writer's view was based on.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

# ============================================================================
# 1.3 Calculation Rules Table
# ============================================================================
calculations:
  - name: proposal_cost_estimate
    trigger: "provisional variant runs on POST /proposals/{id}/cost-line-items (add line item); final variant runs on POST /proposals/{id}/finalize-cost (DEVELOPING -> COSTED)."
    algorithm: aggregation
    input_set: "All CostLineItem rows whose proposal_id == this proposal (no status filter — line items have no lifecycle)."
    formula: |
      # Per-line rounding is pinned: round EACH line first, THEN sum. The two
      # variants differ in (a) which contingency fraction each line uses and
      # (b) whether a cycle-level overhead multiplier is applied afterward.
      line_gross(i)        = unit_cost_cents(i) * quantity(i)          # exact integer cents

      # --- provisional (as-entered contingency, no overhead) ---
      prov_line(i)         = round_half_up(line_gross(i) * (1 + max(contingency_pct(i), 0)))
      provisional_estimate = sum_i prov_line(i)                        # round-per-line-then-sum

      # --- final (floored contingency, then a single overhead pass) ---
      final_line(i)        = round_half_up(line_gross(i) * (1 + max(contingency_pct(i), MIN_CONTINGENCY_PCT)))
      final_subtotal       = sum_i final_line(i)                       # round-per-line-then-sum
      final_estimate       = round_half_up(final_subtotal * (1 + OVERHEAD_PCT))   # one more round at the end
    constants:
      MIN_CONTINGENCY_PCT: 0.10
      OVERHEAD_PCT: 0.05
    precision: "integer cents, round_half_up at each pinned rounding step"
    variants:
      - name: provisional
        when: "On each cost-line-item add, while proposal.status == DEVELOPING; written to Proposal.provisional_estimate_cents."
        difference: "Uses each line's as-entered contingency_pct; applies NO overhead."
      - name: final
        when: "On finalize-cost (DEVELOPING -> COSTED); written to Proposal.estimated_cost_cents and used by funding_selection."
        difference: "Floors each line's contingency to MIN_CONTINGENCY_PCT, sums, then applies OVERHEAD_PCT once. Differs from provisional whenever any line's contingency_pct < 0.10 or OVERHEAD_PCT > 0."

  - name: funding_selection
    trigger: "POST /budget-cycles/{id}/selection-runs, while cycle.phase == SELECTION."
    algorithm: waterfall_allocation
    input_set: "Proposals in this cycle with status == ON_BALLOT (the ballot slate). Their estimated_cost_cents (final) and vote_score are the inputs."
    formula: |
      # Rank the ON_BALLOT proposals:
      #   primary:  vote_score DESC
      #   tie-break: created_at ASC   (never id)
      # Then walk in rank order, maintaining two running pools:
      #   remaining_total    = cycle.total_budget_cents          (decremented on each award)
      #   remaining_cat[c]   = category c.category_budget_cap_cents (decremented per category)
      # For each proposal p (award candidate = p.estimated_cost_cents):
      #   if p.estimated_cost_cents > cycle.per_project_cap_cents:
      #       p -> NOT_SELECTED            # cannot be partially funded
      #   elif p.estimated_cost_cents <= min(remaining_total, remaining_cat[p.category_id]):
      #       p -> SELECTED
      #       p.awarded_cents  = p.estimated_cost_cents
      #       remaining_total          -= p.awarded_cents
      #       remaining_cat[p.category_id] -= p.awarded_cents
      #   else:
      #       p -> NOT_SELECTED           # would exceed remaining total or category pool;
      #                                   # WATERFALL: keep going, a cheaper lower-ranked
      #                                   # proposal may still fit.
      # Boundary is inclusive: award == remaining pool exactly is FUNDED (<=).
    constants: {}
    precision: "integer cents; no rounding (awards equal exact estimated_cost_cents)"
    variants: []

  - name: vote_tally
    trigger: "Recomputed for each referenced Proposal on ballot cast (add contribution) and on ballot withdraw (subtract contribution); read by funding_selection."
    algorithm: aggregation
    input_set: "All BallotEntry rows with active == true whose ballot.status == CAST, grouped by proposal_id."
    formula: |
      # Two variants keyed on cycle.voting_method. Same underlying preference
      # data can produce different vote_score orderings under the two methods
      # (e.g., broad shallow support wins RANKED but a few large allocations
      # win ALLOCATION).
      #
      # RANKED (Borda):
      #   entry.points  = max(0, RANK_MAX_POINTS - (entry.rank - 1))
      #   proposal.vote_score = sum of entry.points over active CAST entries for that proposal
      #
      # ALLOCATION (dollar):
      #   proposal.vote_score = sum of entry.allocated_cents over active CAST entries for that proposal
    constants:
      RANK_MAX_POINTS: 10
    precision: "integer points (RANKED) or integer cents (ALLOCATION)"
    variants:
      - name: ranked_borda
        when: "cycle.voting_method == RANKED"
        difference: "Score is Borda points from rank position; allocated_cents ignored."
      - name: allocation_dollar
        when: "cycle.voting_method == ALLOCATION"
        difference: "Score is summed allocated cents; rank ignored."

  - name: resident_age
    trigger: "Read whenever eligibility must be checked, notably POST /budget-cycles/{id}/ballots (ballot creation)."
    algorithm: threshold
    input_set: "Single Resident's date_of_birth against the logical clock now."
    formula: |
      # Full-years age against the logical clock:
      age = now.year - dob.year - (1 if (now.month, now.day) < (dob.month, dob.day) else 0)
      # Eligibility threshold at ballot creation is inclusive:
      #   eligible_by_age  <=>  age >= cycle.min_voter_age
      # age == min_voter_age  -> eligible; age == min_voter_age - 1 (born one day
      # too late) -> ERR_UNDER_AGE.
    constants: {}
    precision: "integer years, floor"
    variants: []

  - name: cycle_budget_ledger
    trigger: "Recomputed on every award (Proposal -> SELECTED), every cancellation (Proposal -> CANCELLED), i.e., whenever a proposal's awarded_cents changes."
    algorithm: aggregation
    input_set: "Proposals grouped by category and cycle, filtered by status."
    formula: |
      Category.committed_cents      = sum(p.awarded_cents
                                          for p in category
                                          where p.status IN {SELECTED, IN_IMPLEMENTATION, COMPLETED})
      Category.remaining_cap_cents  = Category.category_budget_cap_cents - Category.committed_cents
      BudgetCycle.total_committed_cents = sum(c.committed_cents for c in cycle.categories)
      BudgetCycle.uncommitted_cents     = BudgetCycle.total_budget_cents - BudgetCycle.total_committed_cents
    constants: {}
    precision: "integer cents"
    variants: []

# ============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number checked first)
# ============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role (Anonymous permitted only where the endpoint lists it)."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is in the target endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: request
    check: "Required body fields present; enums within their declared set; integers non-negative where constrained; RANKED entries carry rank (not allocated_cents) and ALLOCATION entries carry allocated_cents (not rank)."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 4
    category: existence
    check: "Every referenced resource exists — path ids left-to-right, then body FK references (budget_cycle_id, category_id, submitter_id, proposal_id, ballot_id, voter_id)."
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"
  - priority: 5
    category: state
    check: "Owning BudgetCycle is in the phase this operation requires (e.g., proposal create/submit require SUBMISSION; ballot create/cast/withdraw require VOTING; selection-run requires SELECTION; release/cancel require IMPLEMENTATION or SELECTION)."
    error_id: ERR_WRONG_PHASE
    http_status: 409
    applies_to: "proposal create/submit, cost-line-items, finalize-cost, ballot create/cast/withdraw, selection-runs, release-funding, cancel-funding"
  - priority: 6
    category: state
    check: "Target entity is in a state from which the requested transition is defined (Proposal/Ballot/Milestone/Resident); for phase-transitions, target_phase is exactly the next phase."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
    note: "phase-transition to a non-adjacent phase returns ERR_INVALID_PHASE_TRANSITION (409)."
  - priority: 7
    category: business_referential
    check: "Proposal.category_id belongs to the same BudgetCycle as the proposal's budget_cycle_id."
    error_id: ERR_CATEGORY_CYCLE_MISMATCH
    http_status: 422
    applies_to: "POST /budget-cycles/{id}/proposals"
  - priority: 8
    category: business_referential
    check: "A ballot entry's proposal_id references a Proposal whose status == ON_BALLOT."
    error_id: ERR_PROPOSAL_NOT_ON_BALLOT
    http_status: 409
    applies_to: "POST /ballots/{id}/entries"
  - priority: 9
    category: business_referential
    check: "finalize-cost requires the proposal to have >= 1 CostLineItem."
    error_id: ERR_NO_LINE_ITEMS
    http_status: 422
    applies_to: "POST /proposals/{id}/finalize-cost"
  - priority: 10
    category: business_safety
    check: "Voting resident is eligible: eligibility_status == VERIFIED."
    error_id: ERR_RESIDENT_NOT_ELIGIBLE
    http_status: 403
    applies_to: "POST /budget-cycles/{id}/ballots"
  - priority: 11
    category: business_safety
    check: "Voting resident meets the age floor: resident.age >= cycle.min_voter_age (inclusive)."
    error_id: ERR_UNDER_AGE
    http_status: 422
    applies_to: "POST /budget-cycles/{id}/ballots"
  - priority: 12
    category: business_constraint
    check: "A resident has at most one non-WITHDRAWN Ballot per cycle (status IN {DRAFT, CAST}). A second create is a duplicate."
    error_id: ERR_DUPLICATE_BALLOT
    http_status: 409
    applies_to: "POST /budget-cycles/{id}/ballots"
  - priority: 13
    category: business_constraint
    check: "RANKED cast: no two active entries share the same rank."
    error_id: ERR_DUPLICATE_RANK
    http_status: 422
    applies_to: "POST /ballots/{id}/cast"
  - priority: 14
    category: business_temporal
    check: "Cycle windows are half-open [start,end) and must not overlap; submission_end <= voting_start (adjacency, i.e. submission_end == voting_start, is allowed); each start < its own end."
    error_id: ERR_PHASE_WINDOW_OVERLAP
    http_status: 422
    applies_to: "POST /budget-cycles"
  - priority: 15
    category: business_temporal
    check: "A new Milestone's closed interval [scheduled_start, scheduled_end] must not overlap and must keep a >= 1-day buffer from every sibling Milestone of the same proposal (next.start > prev.end strictly, with >= 1 day gap)."
    error_id: ERR_MILESTONE_OVERLAP
    http_status: 409
    applies_to: "POST /proposals/{id}/milestones"
  - priority: 16
    category: business_fiscal
    check: "ALLOCATION cast: sum of active entry.allocated_cents <= cycle.per_voter_allocation_cap_cents (inclusive)."
    error_id: ERR_ALLOCATION_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /ballots/{id}/cast"
  - priority: 17
    category: business_referential
    check: "Acting Resident owns the target resource (proposal.submitter_id / ballot.voter_id == X-User-ID) for owner-scoped operations."
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "proposal submit, cost-line-items(by Resident), ballot entries/cast/withdraw"
  - priority: 18
    category: state
    check: "OCC: selection-run's expected_budgetcycle_version equals the cycle's current version."
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412
    applies_to: "POST /budget-cycles/{id}/selection-runs"

# ============================================================================
# 1.5 API Endpoint Table
# ============================================================================
endpoints:
  # ---- BudgetCycle ----
  - method: POST
    path: "/budget-cycles"
    description: "Create a budget cycle (phase=DRAFT). Validates phase-window non-overlap."
    roles: [BudgetAdmin]
    code: 201
    input: [name, fiscal_year, total_budget_cents, voting_method, per_project_cap_cents, per_voter_allocation_cap_cents, "min_voter_age?", "default_language?", submission_start, submission_end, voting_start, voting_end]
    output: BudgetCycle
    side_effects: ["reject if windows overlap (ERR_PHASE_WINDOW_OVERLAP)"]
  - method: GET
    path: "/budget-cycles/{id}"
    description: "Read a budget cycle including computed ledger fields."
    roles: [Anonymous, Resident, Reviewer, BudgetAdmin]
    code: 200
    input: []
    output: BudgetCycle
    side_effects: []
  - method: POST
    path: "/budget-cycles/{id}/phase-transitions"
    description: "Advance the cycle to the next phase (linear DRAFT..CLOSED). Entering VOTING cascades COSTED proposals to ON_BALLOT."
    roles: [BudgetAdmin]
    code: 200
    input: [target_phase]
    output: BudgetCycle
    side_effects: ["cascade COSTED->ON_BALLOT on entering VOTING", "increments BudgetCycle.version by 1"]
  - method: POST
    path: "/budget-cycles/{id}/categories"
    description: "Create a spending category with a per-category sub-cap."
    roles: [BudgetAdmin]
    code: 201
    input: [name, "description?", category_budget_cap_cents, "display_order?"]
    output: Category
    side_effects: []
  - method: GET
    path: "/budget-cycles/{id}/categories"
    description: "List categories of a cycle (reverse lookup for Category.budget_cycle_id)."
    roles: [Anonymous, Resident, Reviewer, BudgetAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Category[]
    side_effects: []
  - method: GET
    path: "/budget-cycles/{id}/proposals"
    description: "List proposals of a cycle (reverse lookup for Proposal.budget_cycle_id)."
    roles: [Anonymous, Resident, Reviewer, BudgetAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Proposal[]
    side_effects: []
  - method: GET
    path: "/budget-cycles/{id}/selection-runs"
    description: "List selection runs of a cycle (reverse lookup for SelectionRun.budget_cycle_id)."
    roles: [Anonymous, Resident, Reviewer, BudgetAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: SelectionRun[]
    side_effects: []
  - method: POST
    path: "/budget-cycles/{id}/selection-runs"
    description: "Run funding selection over the ballot slate (OCC-guarded, supersedes prior current run)."
    roles: [BudgetAdmin]
    code: 201
    input: [expected_budgetcycle_version]
    output: SelectionRun
    side_effects:
      - "tally is read from vote_score; funding_selection sets each ON_BALLOT proposal SELECTED/NOT_SELECTED and awarded_cents"
      - "recompute Category.committed_cents and BudgetCycle ledger (cascade)"
      - "supersede prior current SelectionRun (is_current=false)"
      - "increments BudgetCycle.version by 1"

  # ---- Resident ----
  - method: POST
    path: "/residents"
    description: "Register a resident (eligibility_status=UNVERIFIED). Public self-registration or admin-created."
    roles: [Anonymous, BudgetAdmin]
    code: 201
    input: [full_name, date_of_birth, residency_document_ref, residency_address, "preferred_language?", "accessibility_needs?"]
    output: Resident
    side_effects: []
  - method: GET
    path: "/residents/{id}"
    description: "Read a resident (includes computed age and eligibility_status)."
    roles: [Resident, Reviewer, BudgetAdmin]
    code: 200
    input: []
    output: Resident
    side_effects: []
  - method: POST
    path: "/residents/{id}/verification-requests"
    description: "Submit (or resubmit) proof of residency for verification (UNVERIFIED/REJECTED -> PENDING_VERIFICATION)."
    roles: [Anonymous, Resident]
    code: 200
    input: ["residency_document_ref?"]
    output: Resident
    side_effects: ["increments Resident.version by 1"]
  - method: POST
    path: "/residents/{id}/verification-decisions"
    description: "Reviewer approves or rejects a pending verification (PENDING_VERIFICATION -> VERIFIED/REJECTED)."
    roles: [Reviewer]
    code: 200
    input: [decision, "rejection_reason?"]
    output: Resident
    side_effects: ["set rejection_reason on REJECT", "increments Resident.version by 1"]

  # ---- Proposal ----
  - method: POST
    path: "/budget-cycles/{id}/proposals"
    description: "Submit an idea as a DRAFT proposal in a category (submitter = acting Resident)."
    roles: [Resident]
    code: 201
    input: [category_id, title, summary, "translations?"]
    output: Proposal
    side_effects: []
  - method: GET
    path: "/proposals/{id}"
    description: "Read a proposal including computed estimates and vote_score."
    roles: [Anonymous, Resident, Reviewer, BudgetAdmin]
    code: 200
    input: []
    output: Proposal
    side_effects: []
  - method: GET
    path: "/proposals"
    description: "Filtered proposal list (reverse lookup for Proposal.category_id and Proposal.submitter_id)."
    roles: [Anonymous, Resident, Reviewer, BudgetAdmin]
    code: 200
    input: ["budget_cycle_id?", "category_id?", "submitter_id?", "status?", "limit?", "offset?"]
    output: Proposal[]
    side_effects: []
  - method: POST
    path: "/proposals/{id}/submit"
    description: "Submit a DRAFT proposal for review (DRAFT -> SUBMITTED)."
    roles: [Resident]
    code: 200
    input: []
    output: Proposal
    side_effects: ["increments Proposal.version by 1"]
  - method: POST
    path: "/proposals/{id}/review-decisions"
    description: "Reviewer approves to development or rejects (SUBMITTED -> DEVELOPING/REJECTED)."
    roles: [Reviewer]
    code: 200
    input: [decision, "rejection_reason?"]
    output: Proposal
    side_effects: ["set rejection_reason on REJECT", "increments Proposal.version by 1"]
  - method: POST
    path: "/proposals/{id}/cost-line-items"
    description: "Add a cost line item and recompute the provisional estimate."
    roles: [Resident, Reviewer]
    code: 201
    input: [label, unit_cost_cents, quantity, "contingency_pct?"]
    output: CostLineItem
    side_effects: ["recompute Proposal.provisional_estimate_cents (calculations.proposal_cost_estimate variant provisional)", "increments Proposal.version by 1"]
  - method: GET
    path: "/proposals/{id}/cost-line-items"
    description: "List a proposal's cost line items (reverse lookup for CostLineItem.proposal_id)."
    roles: [Anonymous, Resident, Reviewer, BudgetAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: CostLineItem[]
    side_effects: []
  - method: POST
    path: "/proposals/{id}/finalize-cost"
    description: "Finalize costing (DEVELOPING -> COSTED); computes the final estimate."
    roles: [Reviewer]
    code: 200
    input: []
    output: Proposal
    side_effects: ["compute Proposal.estimated_cost_cents (calculations.proposal_cost_estimate variant final)", "increments Proposal.version by 1"]
  - method: POST
    path: "/proposals/{id}/release-funding"
    description: "Release funding for a selected proposal (SELECTED -> IN_IMPLEMENTATION)."
    roles: [BudgetAdmin]
    code: 200
    input: []
    output: Proposal
    side_effects: ["increments Proposal.version by 1"]
  - method: POST
    path: "/proposals/{id}/cancel-funding"
    description: "Cancel a funded proposal (SELECTED/IN_IMPLEMENTATION -> CANCELLED); restores budget."
    roles: [BudgetAdmin]
    code: 200
    input: []
    output: Proposal
    side_effects: ["reset awarded_cents to 0", "recompute Category.committed_cents and BudgetCycle ledger", "increments Proposal.version by 1"]
  - method: GET
    path: "/proposals/{id}/ballot-entries"
    description: "List ballot entries referencing this proposal (reverse lookup for BallotEntry.proposal_id)."
    roles: [Anonymous, Resident, Reviewer, BudgetAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: BallotEntry[]
    side_effects: []
  - method: GET
    path: "/proposals/{id}/milestones"
    description: "List a proposal's milestones (reverse lookup for Milestone.proposal_id)."
    roles: [Anonymous, Resident, Reviewer, BudgetAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Milestone[]
    side_effects: []
  - method: GET
    path: "/proposals/{id}/report-backs"
    description: "List a proposal's report-backs (reverse lookup for ReportBack.proposal_id)."
    roles: [Anonymous, Resident, Reviewer, BudgetAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ReportBack[]
    side_effects: []

  # ---- Ballot ----
  - method: POST
    path: "/budget-cycles/{id}/ballots"
    description: "Open a DRAFT ballot for the acting Resident (requires VOTING phase, VERIFIED voter, age>=min, no existing active ballot). Snapshots method."
    roles: [Resident]
    code: 201
    input: []
    output: Ballot
    side_effects: ["snapshot Ballot.method from cycle.voting_method"]
  - method: GET
    path: "/ballots/{id}"
    description: "Read a ballot."
    roles: [Resident, Reviewer, BudgetAdmin]
    code: 200
    input: []
    output: Ballot
    side_effects: []
  - method: GET
    path: "/ballots"
    description: "Filtered ballot list (reverse lookup for Ballot.voter_id and Ballot.budget_cycle_id)."
    roles: [Reviewer, BudgetAdmin]
    code: 200
    input: ["voter_id?", "budget_cycle_id?", "status?", "limit?", "offset?"]
    output: Ballot[]
    side_effects: []
  - method: POST
    path: "/ballots/{id}/entries"
    description: "Add a preference entry to a DRAFT ballot (rank for RANKED, allocated_cents for ALLOCATION)."
    roles: [Resident]
    code: 201
    input: [proposal_id, "rank?", "allocated_cents?"]
    output: BallotEntry
    side_effects: ["increments Ballot.version by 1"]
  - method: POST
    path: "/ballots/{id}/cast"
    description: "Cast the ballot (DRAFT/WITHDRAWN -> CAST); validates ranks/allocation cap and tallies votes."
    roles: [Resident]
    code: 200
    input: []
    output: Ballot
    side_effects: ["recompute referenced Proposal.vote_score (calculations.vote_tally)", "set cast_at", "increments Ballot.version by 1"]
  - method: POST
    path: "/ballots/{id}/withdraw"
    description: "Withdraw a cast ballot (CAST -> WITHDRAWN); reverses its tally contribution."
    roles: [Resident]
    code: 200
    input: []
    output: Ballot
    side_effects: ["deactivate entries and subtract contribution from Proposal.vote_score", "set total_allocated_cents=0", "increments Ballot.version by 1"]
  - method: GET
    path: "/ballots/{id}/entries"
    description: "List a ballot's entries (reverse lookup for BallotEntry.ballot_id)."
    roles: [Resident, Reviewer, BudgetAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: BallotEntry[]
    side_effects: []

  # ---- Milestone & ReportBack ----
  - method: POST
    path: "/proposals/{id}/milestones"
    description: "Create an implementation milestone (PLANNED) with a non-overlapping schedule."
    roles: [Reviewer]
    code: 201
    input: [title, scheduled_start, scheduled_end]
    output: Milestone
    side_effects: ["reject if schedule overlaps a sibling within buffer (ERR_MILESTONE_OVERLAP)"]
  - method: POST
    path: "/milestones/{id}/transitions"
    description: "Advance a milestone (PLANNED->IN_PROGRESS->COMPLETED, IN_PROGRESS<->BLOCKED). Completing the last one completes the proposal."
    roles: [Reviewer]
    code: 200
    input: [target_status, "blocked_reason?"]
    output: Milestone
    side_effects: ["bubble-up Proposal COMPLETED when all milestones COMPLETED", "increments Milestone.version by 1"]
  - method: POST
    path: "/proposals/{id}/report-backs"
    description: "Publish an (append-only) report-back for a funded/completed proposal (multilingual)."
    roles: [Reviewer]
    code: 201
    input: [period_label, narrative, "translations?", spent_cents]
    output: ReportBack
    side_effects: ["set published_at to clock now"]

  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default (never real wall-clock)."
    roles: [BudgetAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["sets logical clock now; affects resident_age and window checks"]

# ============================================================================
# 1.6 Error Code Catalog
# ============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid auth headers, or Anonymous used on an endpoint that does not permit it."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role is not in the endpoint's roles list."
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required field, bad enum value, negative amount, or vote-method field mismatch shape."
  - id: ERR_BUDGET_CYCLE_NOT_FOUND
    http: 404
    condition: "Referenced budget cycle id does not exist."
  - id: ERR_CATEGORY_NOT_FOUND
    http: 404
    condition: "Referenced category id does not exist."
  - id: ERR_RESIDENT_NOT_FOUND
    http: 404
    condition: "Referenced resident id (path or voter/submitter) does not exist."
  - id: ERR_PROPOSAL_NOT_FOUND
    http: 404
    condition: "Referenced proposal id does not exist."
  - id: ERR_BALLOT_NOT_FOUND
    http: 404
    condition: "Referenced ballot id does not exist."
  - id: ERR_MILESTONE_NOT_FOUND
    http: 404
    condition: "Referenced milestone id does not exist."
  - id: ERR_WRONG_PHASE
    http: 409
    condition: "Owning BudgetCycle is not in the phase the operation requires."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity is not in a state from which the requested transition is defined."
  - id: ERR_INVALID_PHASE_TRANSITION
    http: 409
    condition: "phase-transitions target_phase is not the single next phase in the pipeline."
  - id: ERR_CATEGORY_CYCLE_MISMATCH
    http: 422
    condition: "Proposal's category_id belongs to a different cycle than its budget_cycle_id."
  - id: ERR_PROPOSAL_NOT_ON_BALLOT
    http: 409
    condition: "Ballot entry references a proposal whose status is not ON_BALLOT."
  - id: ERR_NO_LINE_ITEMS
    http: 422
    condition: "finalize-cost called on a proposal with zero cost line items."
  - id: ERR_RESIDENT_NOT_ELIGIBLE
    http: 403
    condition: "Voting resident is not VERIFIED."
  - id: ERR_UNDER_AGE
    http: 422
    condition: "Voting resident's age is below cycle.min_voter_age."
  - id: ERR_DUPLICATE_BALLOT
    http: 409
    condition: "Resident already holds a non-WITHDRAWN ballot in the cycle."
  - id: ERR_DUPLICATE_RANK
    http: 422
    condition: "RANKED cast has two active entries sharing the same rank."
  - id: ERR_PHASE_WINDOW_OVERLAP
    http: 422
    condition: "Cycle submission/voting windows overlap or a start is not before its end."
  - id: ERR_MILESTONE_OVERLAP
    http: 409
    condition: "New milestone schedule overlaps or violates the 1-day buffer against a sibling milestone."
  - id: ERR_ALLOCATION_CAP_EXCEEDED
    http: 422
    condition: "ALLOCATION cast total allocated_cents exceeds cycle.per_voter_allocation_cap_cents."
  - id: ERR_NOT_OWNER
    http: 403
    condition: "Acting resident is not the owner (submitter/voter) of the target resource."
  - id: ERR_STALE_CYCLE_VERSION
    http: 412
    condition: "selection-run expected_budgetcycle_version does not match the cycle's current version."

# ============================================================================
# 1.7 RBAC Matrix
# ============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated public actor; self-registers as a resident, submits verification requests, and reads public cycle/proposal data."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /residents"
      - "POST /residents/{id}/verification-requests"
      - "GET public reads (budget-cycles, categories, proposals, cost-line-items, ballot-entries, milestones, report-backs, selection-runs)"
  - name: Resident
    description: "A verified-or-pending civic participant; owns their proposals and ballots."
    identity: "entity_backed:Resident"
    exclusive_operations:
      - "POST /budget-cycles/{id}/proposals"
      - "POST /proposals/{id}/submit"
      - "POST /budget-cycles/{id}/ballots"
      - "POST /ballots/{id}/entries"
      - "POST /ballots/{id}/cast"
      - "POST /ballots/{id}/withdraw"
    shared_operations:
      - "POST /residents/{id}/verification-requests (own resident)"
      - "POST /proposals/{id}/cost-line-items (own proposal, while DEVELOPING)"
      - "GET /residents/{id} (own), GET /ballots/{id} (own), public reads"
  - name: Reviewer
    description: "Civic staff who verify residents, review and cost proposals, and manage implementation/report-backs."
    identity: "opaque"
    exclusive_operations:
      - "POST /residents/{id}/verification-decisions"
      - "POST /proposals/{id}/review-decisions"
      - "POST /proposals/{id}/finalize-cost"
      - "POST /proposals/{id}/milestones"
      - "POST /milestones/{id}/transitions"
      - "POST /proposals/{id}/report-backs"
    shared_operations:
      - "POST /proposals/{id}/cost-line-items"
      - "GET /ballots, reads"
  - name: BudgetAdmin
    description: "Program administrator who configures cycles/categories, advances phases, runs selection, and releases/cancels funding."
    identity: "opaque"
    exclusive_operations:
      - "POST /budget-cycles"
      - "POST /budget-cycles/{id}/phase-transitions"
      - "POST /budget-cycles/{id}/categories"
      - "POST /budget-cycles/{id}/selection-runs"
      - "POST /proposals/{id}/release-funding"
      - "POST /proposals/{id}/cancel-funding"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /residents"
      - "GET /ballots, reads"
