scenario: |
  Creator Talent Network & Brand Deal Management (creator talent agency): roster
  onboarding & rate card by audience metrics, brand brief matching & pitch process,
  deal terms (usage/exclusivity/whitelisting) & contract, content approval workflow
  & revision rounds, disclosure compliance verification, performance reporting &
  bonus triggers, invoicing, commission & creator payout timing, dispute & re-shoot
  policy

domain_name: creator-talent-network
api_prefix: ""

complexity_profile:
  primary_archetype: multi-party_negotiation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Creator
    parent: null
    common_fields: true
    fields:
      - { name: handle, type: string, source: input, description: "Unique creator handle", constraints: "unique across all creators" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: niche, type: enum, source: input, description: "Content niche", constraints: "BEAUTY | FASHION | TECH | FINANCE | GAMING | FITNESS | FOOD | TRAVEL | OTHER" }
      - { name: primary_platform, type: enum, source: input, description: "Primary publishing platform", constraints: "YOUTUBE | INSTAGRAM | TIKTOK | TWITCH" }
      - { name: followers, type: integer, source: input, description: "Current follower count; rate-card tier input", constraints: ">= 0" }
      - { name: avg_views_30d, type: integer, source: input, description: "Average views per post over trailing 30 days", constraints: ">= 0" }
      - { name: engagement_rate_bps, type: integer, source: input, description: "Engagement rate in basis points (400 = 4.00%)", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "Roster lifecycle state", default: APPLIED, constraints: "APPLIED | SCREENING | ACTIVE | SUSPENDED | EXITED" }
      - { name: rate_card_cpm_cents, type: integer, source: computed, description: "Rate card CPM in cents; recomputed by rate_card_computation on every metrics update" }
      - { name: rate_card_flat_cents, type: integer, source: computed, description: "Per-deliverable flat fee in cents; floor MIN_FLAT_FEE_CENTS" }
      - { name: compliance_strikes, type: integer, source: system, description: "Count of ESCALATED disclosure checks on this creator's deliverables; >= 3 forces SUSPENDED", default: 0 }
      - { name: lifetime_billed_cents, type: integer, source: computed, description: "Sum of fee_line_cents over all invoices for this creator's deals whose status became PAID; updated on record-payment cascade", default: 0 }
      - { name: pending_disclosure_count, type: integer, source: computed, description: "Count of DisclosureChecks on this creator's deliverables with status IN {QUEUED, FAILED}", default: 0 }

  - name: Brand
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Brand legal name" }
      - { name: industry, type: enum, source: input, description: "Brand industry", constraints: "CPG | TECH | FINANCE | FASHION | AUTOMOTIVE | GAMING | OTHER" }
      - { name: status, type: enum, source: system, description: "Brand account state", default: ACTIVE, constraints: "ACTIVE | SUSPENDED" }
      - { name: credit_hold, type: boolean, source: input, description: "When true, deal activation and brief publishing are blocked", default: false }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "SUM(Invoice.total_cents) for this brand's invoices with status IN {ISSUED, OVERDUE}; maintained on issue/record-payment/void", default: 0 }

  - name: Brief
    parent: null
    common_fields: true
    fields:
      - { name: brand_id, type: string, source: input, description: "FK -> Brand.id; owning brand" }
      - { name: title, type: string, source: input, description: "Campaign brief title" }
      - { name: niche, type: enum, source: input, description: "Target creator niche", constraints: "same enum as Creator.niche" }
      - { name: min_followers, type: integer, source: input, description: "Minimum creator followers to pitch (>= comparison)", constraints: ">= 0" }
      - { name: min_engagement_bps, type: integer, source: input, description: "Minimum creator engagement_rate_bps to pitch (>= comparison)", constraints: ">= 0" }
      - { name: slots_total, type: integer, source: input, description: "Number of creator slots this brief funds", constraints: ">= 1" }
      - { name: slots_committed, type: integer, source: computed, description: "COUNT(Pitch WHERE brief_id = Brief.id AND status = ACCEPTED AND its Deal.status != TERMINATED)", default: 0 }
      - { name: budget_cents, type: integer, source: input, description: "Maximum committed pitch fees", constraints: "> 0" }
      - { name: deliverables_per_slot, type: integer, source: input, description: "Deliverables each awarded deal must produce", constraints: ">= 1" }
      - { name: usage_rights_days, type: integer, source: input, description: "Brand usage-rights duration per deliverable", constraints: ">= 1" }
      - { name: exclusivity_category, type: enum, source: input, description: "Category exclusivity demanded of the creator", constraints: "NONE | BEVERAGES | SNACKS | SKINCARE | SOFTWARE | FINTECH | AUTOMOTIVE | GAMING | APPAREL" }
      - { name: exclusivity_days, type: integer, source: input, description: "Exclusivity window length from deal activation", constraints: ">= 0; ignored when category = NONE" }
      - { name: whitelisting_required, type: boolean, source: input, description: "Whether paid-media whitelisting is part of deal terms", default: false }
      - { name: revision_rounds_included, type: integer, source: input, description: "Revision rounds included per deliverable", default: 2, constraints: ">= 0" }
      - { name: submission_window_start, type: datetime, source: input, description: "Pitches accepted at or after this instant (inclusive)" }
      - { name: submission_window_end, type: datetime, source: input, description: "Pitches accepted at or before this instant (inclusive)" }
      - { name: content_window_start, type: datetime, source: input, description: "Deliverable publish allowed at or after this instant (inclusive)" }
      - { name: content_window_end, type: datetime, source: input, description: "Deliverable publish allowed at or before this instant (inclusive)" }
      - { name: status, type: enum, source: system, description: "Brief lifecycle", default: DRAFT, constraints: "DRAFT | OPEN | AWARDED | EXPIRED | CLOSED" }

  - name: Pitch
    parent: null
    common_fields: true
    fields:
      - { name: brief_id, type: string, source: input, description: "FK -> Brief.id; brief being pitched" }
      - { name: creator_id, type: string, source: input, description: "FK -> Creator.id; pitching creator" }
      - { name: proposed_fee_cents, type: integer, source: input, description: "Latest proposed fee (base, before usage/exclusivity/whitelisting adjustments)", constraints: "> 0" }
      - { name: concept_note, type: string, source: input, description: "Creative concept summary" }
      - { name: status, type: enum, source: system, description: "Pitch lifecycle", default: SUBMITTED, constraints: "SUBMITTED | SHORTLISTED | COUNTERED | ACCEPTED | REJECTED | WITHDRAWN | SUPERSEDED" }
      - { name: negotiation_rounds, type: integer, source: system, description: "Counter/resubmit cycles consumed; MAX_PITCH_NEGOTIATION_ROUNDS cap", default: 0 }
      - { name: superseded_by_pitch_id, type: string, source: system, description: "FK -> Pitch.id; set when this pitch was auto-superseded by a re-pitch from the same creator on the same brief; null otherwise" }
      - { name: deal_id, type: string, source: system, description: "FK -> Deal.id; deal created on acceptance; null until ACCEPTED" }

  - name: Deal
    parent: null
    common_fields: true
    fields:
      - { name: pitch_id, type: string, source: system, description: "FK -> Pitch.id; originating pitch (1:1)" }
      - { name: brief_id, type: string, source: system, description: "FK -> Brief.id; denormalized from pitch" }
      - { name: creator_id, type: string, source: system, description: "FK -> Creator.id; denormalized from pitch" }
      - { name: brand_id, type: string, source: system, description: "FK -> Brand.id; denormalized from brief" }
      - { name: status, type: enum, source: system, description: "Deal lifecycle", default: DRAFT, constraints: "DRAFT | PENDING_CREATOR | PENDING_BRAND | ACTIVE | IN_DISPUTE | COMPLETED | TERMINATED" }
      - { name: negotiation_rounds, type: integer, source: system, description: "Counter cycles consumed; MAX_DEAL_NEGOTIATION_ROUNDS cap", default: 0 }
      - { name: fee_base_cents, type: integer, source: input, description: "Negotiated base fee set by the latest propose-terms call", constraints: "> 0" }
      - { name: fee_total_cents, type: integer, source: computed, description: "Final fee from deal_fee_computation, pinned at activation; null until ACTIVE" }
      - { name: usage_rights_days, type: integer, source: system, description: "Copied from brief at creation" }
      - { name: exclusivity_category, type: enum, source: system, description: "Copied from brief at creation" }
      - { name: exclusivity_days, type: integer, source: system, description: "Copied from brief at creation" }
      - { name: whitelisting, type: boolean, source: system, description: "Copied from brief.whitelisting_required at creation" }
      - { name: revision_rounds_included, type: integer, source: system, description: "Copied from brief at creation; per-deliverable revision cap" }
      - { name: terms_version, type: integer, source: system, description: "Increments on every propose-terms call; pins which terms each party accepted", default: 0 }
      - { name: exclusive_window_start, type: datetime, source: system, description: "Activation instant; null until ACTIVE" }
      - { name: exclusive_window_end, type: datetime, source: system, description: "exclusive_window_start + exclusivity_days; half-open interval end; null until ACTIVE" }
      - { name: activated_at, type: datetime, source: system, description: "Timestamp of ACTIVE transition; null until ACTIVE" }
      - { name: reduction_pct, type: number, source: system, description: "Fee reduction applied by an upheld dispute (0.025 = 2.5%)", default: 0 }
      - { name: bonus_accrued_cents, type: integer, source: computed, description: "SUM(final_bonus_cents) of FINAL PerformanceReports for this deal not yet billed on a non-VOID invoice", default: 0 }

  - name: Deliverable
    parent: null
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: input, description: "FK -> Deal.id; owning deal" }
      - { name: platform, type: enum, source: input, description: "Publishing platform", constraints: "YOUTUBE | INSTAGRAM | TIKTOK | TWITCH" }
      - { name: due_date, type: datetime, source: input, description: "Submission due date (informational)" }
      - { name: scheduled_publish_date, type: datetime, source: input, description: "Planned publish instant; must respect MIN_PUBLISH_GAP_HOURS against sibling deliverables of the same deal" }
      - { name: content_url, type: string, source: system, description: "Published content URL; set by publish call" }
      - { name: published_at, type: datetime, source: system, description: "Actual publish instant (logical clock); null until PUBLISHED" }
      - { name: status, type: enum, source: system, description: "Deliverable workflow", default: PENDING_SUBMISSION, constraints: "PENDING_SUBMISSION | IN_REVIEW | REVISION_REQUESTED | APPROVED | PUBLISHED | VERIFIED | CANCELLED" }
      - { name: revision_rounds_used, type: integer, source: system, description: "REQUEST_REVISION count against this deliverable", default: 0 }
      - { name: reshoot_count, type: integer, source: system, description: "Accepted reshoots against this deliverable; MAX_RESHOOTS_PER_DELIVERABLE cap", default: 0 }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the BrandManager who last approved; segregation-of-duties anchor for disclosure" }
      - { name: verified_at, type: datetime, source: system, description: "Instant deliverable reached VERIFIED; null until then" }

  - name: DisclosureCheck
    parent: null
    common_fields: true
    fields:
      - { name: deliverable_id, type: string, source: system, description: "FK -> Deliverable.id; content under review (created on publish)" }
      - { name: status, type: enum, source: system, description: "Compliance check lifecycle", default: QUEUED, constraints: "QUEUED | PASSED | FAILED | ESCALATED | VOIDED" }
      - { name: recheck_count, type: integer, source: system, description: "Times this check has been requeued after FAILED; MAX_DISCLOSURE_RECHECKS cap", default: 0 }
      - { name: has_ad_hashtag, type: boolean, source: input, description: "Checklist: #ad or equivalent present", default: false }
      - { name: verbal_disclosure, type: boolean, source: input, description: "Checklist: verbal/audio disclosure present", default: false }
      - { name: platform_tool_used, type: boolean, source: input, description: "Checklist: platform paid-partnership tool enabled", default: false }
      - { name: checked_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who last reviewed" }
      - { name: checked_at, type: datetime, source: system, description: "Instant of last review" }

  - name: PerformanceReport
    parent: null
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: input, description: "FK -> Deal.id; measured deal" }
      - { name: period_start, type: datetime, source: input, description: "Measurement window start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Measurement window end (exclusive)", constraints: "must be > period_start" }
      - { name: views, type: integer, source: input, description: "Raw reported views", constraints: ">= 0" }
      - { name: likes, type: integer, source: input, description: "Raw reported likes", constraints: ">= 0" }
      - { name: comments, type: integer, source: input, description: "Raw reported comments", constraints: ">= 0" }
      - { name: shares, type: integer, source: input, description: "Raw reported shares", constraints: ">= 0" }
      - { name: audited_views, type: integer, source: input, description: "Bot-filtered views set at finalize", constraints: ">= 0 and <= views" }
      - { name: audited_engagements, type: integer, source: input, description: "Bot-filtered likes+comments+shares set at finalize", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "Report lifecycle", default: REPORTED, constraints: "REPORTED | FINAL | SUPERSEDED" }
      - { name: provisional_bonus_cents, type: integer, source: computed, description: "performance_bonus PROVISIONAL variant on raw metrics at submission" }
      - { name: final_bonus_cents, type: integer, source: computed, description: "performance_bonus FINAL variant on audited metrics at finalize; null until FINAL" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: input, description: "FK -> Deal.id; billed deal" }
      - { name: brand_id, type: string, source: system, description: "FK -> Brand.id; denormalized from deal" }
      - { name: status, type: enum, source: system, description: "Invoice lifecycle", default: DRAFT, constraints: "DRAFT | ISSUED | OVERDUE | PAID | VOID" }
      - { name: fee_line_cents, type: integer, source: computed, description: "round_half_up(deal.fee_total_cents * (1 - deal.reduction_pct)) per invoice_total_computation" }
      - { name: service_line_cents, type: integer, source: computed, description: "round_half_up(SERVICE_FEE_PCT * deal.fee_total_cents * (1 - deal.reduction_pct))" }
      - { name: bonus_line_cents, type: integer, source: computed, description: "deal.bonus_accrued_cents at invoice creation" }
      - { name: total_cents, type: integer, source: computed, description: "fee_line + service_line + bonus_line (per-line rounding, then sum — pinned order)" }
      - { name: late_fee_cents, type: integer, source: computed, description: "late_fee_accrual at payment time; 0 unless OVERDUE", default: 0 }
      - { name: issued_at, type: datetime, source: system, description: "Issue instant; null until ISSUED" }
      - { name: due_date, type: datetime, source: system, description: "issued_at + INVOICE_NET_DAYS; null until ISSUED" }
      - { name: paid_at, type: datetime, source: system, description: "Payment instant; null until PAID" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of issuing FinanceAdmin; segregation-of-duties anchor for payout release" }
      - { name: void_reason, type: string, source: input, description: "Required when voiding" }

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; funding invoice (created on issue)" }
      - { name: deal_id, type: string, source: system, description: "FK -> Deal.id; denormalized from invoice" }
      - { name: creator_id, type: string, source: system, description: "FK -> Creator.id; payee, denormalized from deal" }
      - { name: status, type: enum, source: system, description: "Payout lifecycle", default: ACCRUED, constraints: "ACCRUED | PAYABLE | HELD | PAID | VOIDED | CLAWED_BACK" }
      - { name: gross_cents, type: integer, source: computed, description: "invoice.fee_line_cents + invoice.bonus_line_cents (creator earnings; service line is agency revenue)" }
      - { name: commission_rate_bps, type: integer, source: computed, description: "Tier from commission_split; ESTIMATED at issue, re-pinned SETTLEMENT at release" }
      - { name: commission_cents, type: integer, source: computed, description: "Agency commission amount; recomputed at release" }
      - { name: net_cents, type: integer, source: computed, description: "gross_cents - commission_cents" }
      - { name: payout_due_at, type: datetime, source: computed, description: "invoice.paid_at + PAYOUT_NET_DAYS; release allowed at >= this instant" }
      - { name: released_by_user_id, type: string, source: system, description: "X-User-ID of releasing FinanceAdmin" }
      - { name: released_at, type: datetime, source: system, description: "Release instant; null until PAID" }

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: input, description: "FK -> Deal.id; disputed deal" }
      - { name: deliverable_id, type: string, source: input, description: "FK -> Deliverable.id; content under dispute (required when reason = RESHOOT_REQUEST, optional otherwise)" }
      - { name: raised_by_role, type: enum, source: system, description: "Role that raised the dispute", constraints: "CREATOR | BRAND" }
      - { name: reason, type: enum, source: input, description: "Dispute reason", constraints: "RESHOOT_REQUEST | NON_PAYMENT | DISCLOSURE_VIOLATION | SCOPE_CREEP | OTHER" }
      - { name: note, type: string, source: input, description: "Free-text detail" }
      - { name: status, type: enum, source: system, description: "Dispute lifecycle", default: OPEN, constraints: "OPEN | UNDER_REVIEW | ESCALATED | RESOLVED_UPHELD | RESOLVED_DISMISSED" }
      - { name: remedy, type: enum, source: input, description: "Remedy applied when upheld", constraints: "NONE | RESHOOT | FEE_REDUCTION | TERMINATE" }
      - { name: reduction_pct, type: number, source: input, description: "Fee reduction fraction applied to the deal when remedy = FEE_REDUCTION", constraints: "> 0 and < 1" }
      - { name: resolution_note, type: string, source: input, description: "Resolution rationale" }

  - name: Reshoot
    parent: null
    common_fields: true
    fields:
      - { name: deliverable_id, type: string, source: input, description: "FK -> Deliverable.id; deliverable to be re-shot" }
      - { name: dispute_id, type: string, source: input, description: "FK -> Dispute.id; originating dispute when remedy = RESHOOT; null for direct requests" }
      - { name: reason, type: string, source: input, description: "Why a re-shoot is required" }
      - { name: status, type: enum, source: system, description: "Reshoot lifecycle", default: REQUESTED, constraints: "REQUESTED | ACCEPTED | DECLINED" }
      - { name: responded_at, type: datetime, source: system, description: "Creator response instant; null until responded" }

state_machines:
  - entity: Creator
    initial_state: APPLIED
    terminal_states: [EXITED]
    transitions:
      - from: APPLIED
        to: SCREENING
        trigger: "POST /creators/{id}/transition {to_state: SCREENING}"
        actor: TalentManager
        preconditions: ["creator.status == APPLIED"]
        side_effects: ["creator.updated_at refreshed", "creator.version += 1"]
      - from: SCREENING
        to: ACTIVE
        trigger: "POST /creators/{id}/transition {to_state: ACTIVE}"
        actor: TalentManager
        preconditions: ["creator.status == SCREENING", "metrics present: followers, avg_views_30d, engagement_rate_bps all set"]
        side_effects: ["runs rate_card_computation -> rate_card_cpm_cents, rate_card_flat_cents", "creator.version += 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /creators/{id}/transition {to_state: SUSPENDED} OR system auto-transition when compliance_strikes reaches STRIKE_LIMIT"
        actor: TalentManager | system
        preconditions: ["creator.status == ACTIVE"]
        side_effects:
          - "all pitches of this creator with status IN {SUBMITTED, SHORTLISTED, COUNTERED} -> WITHDRAWN (cascade)"
          - "creator.version += 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /creators/{id}/transition {to_state: ACTIVE}"
        actor: TalentManager
        preconditions: ["creator.status == SUSPENDED"]
        side_effects: ["creator.compliance_strikes = 0", "creator.version += 1"]
      - from: ACTIVE
        to: EXITED
        trigger: "POST /creators/{id}/transition {to_state: EXITED}"
        actor: TalentManager
        preconditions: ["creator.status == ACTIVE", "no Deal with creator_id = creator.id and status NOT IN {COMPLETED, TERMINATED} (else ERR_ACTIVE_DEALS_EXIST)"]
        side_effects: ["creator.version += 1"]
      - from: SUSPENDED
        to: EXITED
        trigger: "POST /creators/{id}/transition {to_state: EXITED}"
        actor: TalentManager
        preconditions: ["creator.status == SUSPENDED", "no Deal with creator_id = creator.id and status NOT IN {COMPLETED, TERMINATED} (else ERR_ACTIVE_DEALS_EXIST)"]
        side_effects: ["creator.version += 1"]

  - entity: Brand
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /brands/{id} {status: SUSPENDED}"
        actor: BrandManager
        preconditions: ["brand.status == ACTIVE"]
        side_effects: ["brand.version += 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /brands/{id} {status: ACTIVE}"
        actor: BrandManager
        preconditions: ["brand.status == SUSPENDED"]
        side_effects: ["brand.version += 1"]

  - entity: Brief
    initial_state: DRAFT
    terminal_states: [EXPIRED, CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /briefs/{id}/publish"
        actor: BrandManager
        preconditions:
          - "brief.status == DRAFT"
          - "brand.status == ACTIVE (else ERR_BRAND_SUSPENDED)"
          - "brand.credit_hold == false (else ERR_BRAND_CREDIT_HOLD)"
          - "submission_window_start <= submission_window_end and content_window_start <= content_window_end"
        side_effects: ["brief.version += 1"]
      - from: OPEN
        to: AWARDED
        trigger: "system auto-transition (bubble-up) when slots_committed reaches slots_total after a pitch acceptance"
        actor: system
        preconditions: ["slots_committed == slots_total"]
        side_effects: ["brief.version += 1"]
      - from: OPEN
        to: EXPIRED
        trigger: "system sweep on POST /_clock/set_current_utc when clock passes submission_window_end"
        actor: system
        preconditions: ["brief.status == OPEN", "logical clock > submission_window_end"]
        side_effects:
          - "all pitches of this brief with status IN {SUBMITTED, SHORTLISTED, COUNTERED} -> WITHDRAWN (cascade)"
          - "brief.version += 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /briefs/{id}/close"
        actor: BrandManager
        preconditions: ["brief.status == OPEN", "slots_committed == 0 (else ERR_INVALID_STATE)"]
        side_effects:
          - "all pitches of this brief with status IN {SUBMITTED, SHORTLISTED, COUNTERED} -> WITHDRAWN (cascade)"
          - "brief.version += 1"
      - from: AWARDED
        to: CLOSED
        trigger: "POST /briefs/{id}/close"
        actor: BrandManager
        preconditions: ["brief.status == AWARDED", "every Deal with brief_id = brief.id has status IN {COMPLETED, TERMINATED}"]
        side_effects: ["brief.version += 1"]

  - entity: Pitch
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: SHORTLISTED
        trigger: "POST /pitches/{id}/brand-action {action: SHORTLIST}"
        actor: BrandManager
        preconditions: ["pitch.status == SUBMITTED", "brief.status == OPEN (else ERR_INVALID_STATE)"]
        side_effects: ["pitch.version += 1"]
      - from: SHORTLISTED
        to: COUNTERED
        trigger: "POST /pitches/{id}/brand-action {action: COUNTER, counter_fee_cents}"
        actor: BrandManager
        preconditions: ["pitch.status == SHORTLISTED", "brief.status == OPEN", "pitch.negotiation_rounds < MAX_PITCH_NEGOTIATION_ROUNDS (else ERR_NEGOTIATION_LIMIT_EXCEEDED)"]
        side_effects: ["pitch.proposed_fee_cents = counter_fee_cents", "pitch.negotiation_rounds += 1", "pitch.version += 1"]
      - from: COUNTERED
        to: SHORTLISTED
        trigger: "POST /pitches/{id}/talent-action {action: RESUBMIT, proposed_fee_cents}"
        actor: TalentManager
        preconditions: ["pitch.status == COUNTERED", "brief.status == OPEN", "pitch.negotiation_rounds < MAX_PITCH_NEGOTIATION_ROUNDS (else ERR_NEGOTIATION_LIMIT_EXCEEDED)"]
        side_effects: ["pitch.proposed_fee_cents = proposed_fee_cents", "pitch.negotiation_rounds += 1", "pitch.version += 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /pitches/{id}/brand-action {action: REJECT}"
        actor: BrandManager
        preconditions: ["pitch.status IN {SUBMITTED, SHORTLISTED, COUNTERED}"]
        side_effects: ["pitch.version += 1"]
      - from: SHORTLISTED
        to: REJECTED
        trigger: "POST /pitches/{id}/brand-action {action: REJECT}"
        actor: BrandManager
        preconditions: ["pitch.status IN {SUBMITTED, SHORTLISTED, COUNTERED}"]
        side_effects: ["pitch.version += 1"]
      - from: COUNTERED
        to: REJECTED
        trigger: "POST /pitches/{id}/brand-action {action: REJECT}"
        actor: BrandManager
        preconditions: ["pitch.status IN {SUBMITTED, SHORTLISTED, COUNTERED}"]
        side_effects: ["pitch.version += 1"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /pitches/{id}/talent-action {action: WITHDRAW}"
        actor: TalentManager
        preconditions: ["pitch.status IN {SUBMITTED, SHORTLISTED, COUNTERED}"]
        side_effects: ["pitch.version += 1"]
      - from: SHORTLISTED
        to: WITHDRAWN
        trigger: "POST /pitches/{id}/talent-action {action: WITHDRAW}"
        actor: TalentManager
        preconditions: ["pitch.status IN {SUBMITTED, SHORTLISTED, COUNTERED}"]
        side_effects: ["pitch.version += 1"]
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /pitches/{id}/talent-action {action: WITHDRAW}"
        actor: TalentManager
        preconditions: ["pitch.status IN {SUBMITTED, SHORTLISTED, COUNTERED}"]
        side_effects: ["pitch.version += 1"]
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system auto-transition when the same creator creates a new pitch on the same brief"
        actor: system
        preconditions: ["prior pitch status == SUBMITTED"]
        side_effects: ["prior pitch.superseded_by_pitch_id = new pitch id", "prior pitch.version += 1"]
      - from: SHORTLISTED
        to: ACCEPTED
        trigger: "POST /pitches/{id}/brand-action {action: ACCEPT}"
        actor: BrandManager
        preconditions:
          - "pitch.status == SHORTLISTED"
          - "brief.status IN {OPEN, AWARDED} (else ERR_INVALID_STATE)"
          - "slots_committed < slots_total (else ERR_BRIEF_SLOTS_FULL)"
          - "SUM(proposed_fee_cents over this brief's pitches with status = ACCEPTED whose deal is not TERMINATED) + pitch.proposed_fee_cents <= brief.budget_cents (else ERR_BRIEF_BUDGET_EXCEEDED)"
        side_effects:
          - "creates Deal (status DRAFT) copying pitch_id, brief_id, creator_id, brand_id and brief terms (usage_rights_days, exclusivity_category, exclusivity_days, whitelisting, revision_rounds_included); deal.fee_base_cents = pitch.proposed_fee_cents; pitch.deal_id = new deal id"
          - "brief.slots_committed recomputed (+1); if slots_committed == slots_total -> brief -> AWARDED"
          - "pitch.version += 1"

  - entity: Deal
    initial_state: DRAFT
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: DRAFT
        to: PENDING_CREATOR
        trigger: "POST /deals/{id}/propose-terms"
        actor: BrandManager
        preconditions: ["deal.status == DRAFT", "expected_deal_version == deal.version (else ERR_STALE_VERSION)"]
        side_effects: ["deal.fee_base_cents = payload.fee_base_cents", "deal.terms_version += 1", "deal.version += 1"]
      - from: PENDING_CREATOR
        to: PENDING_BRAND
        trigger: "POST /deals/{id}/creator-respond {action: ACCEPT}"
        actor: Creator
        preconditions: ["deal.status == PENDING_CREATOR", "acting creator owns deal (X-User-ID == deal.creator_id)"]
        side_effects: ["deal.version += 1"]
      - from: PENDING_CREATOR
        to: DRAFT
        trigger: "POST /deals/{id}/creator-respond {action: COUNTER, counter_fee_cents}"
        actor: Creator
        preconditions: ["deal.status == PENDING_CREATOR", "acting creator owns deal", "deal.negotiation_rounds < MAX_DEAL_NEGOTIATION_ROUNDS (else ERR_NEGOTIATION_LIMIT_EXCEEDED)"]
        side_effects: ["deal.negotiation_rounds += 1", "deal.version += 1"]
      - from: PENDING_CREATOR
        to: TERMINATED
        trigger: "POST /deals/{id}/creator-respond {action: DECLINE}"
        actor: Creator
        preconditions: ["deal.status == PENDING_CREATOR", "acting creator owns deal"]
        side_effects: ["brief.slots_committed recomputed (-1)", "deal.version += 1"]
      - from: PENDING_BRAND
        to: ACTIVE
        trigger: "POST /deals/{id}/brand-respond {action: ACCEPT}"
        actor: Brand
        preconditions:
          - "deal.status == PENDING_BRAND"
          - "acting brand owns deal (X-User-ID == deal.brand_id)"
          - "brand.credit_hold == false (else ERR_BRAND_CREDIT_HOLD)"
          - "exclusivity check: no other Deal with creator_id = deal.creator_id, status = ACTIVE, same exclusivity_category (!= NONE), and half-open windows [exclusive_window_start, exclusive_window_end) overlapping this deal's candidate window (adjacency end == start is NOT a conflict) (else ERR_EXCLUSIVITY_CONFLICT)"
        side_effects:
          - "runs deal_fee_computation -> deal.fee_total_cents (pinned at activation)"
          - "deal.activated_at = logical clock; exclusive_window_start = activated_at; exclusive_window_end = activated_at + exclusivity_days (null window when category = NONE)"
          - "deal.version += 1"
      - from: PENDING_BRAND
        to: DRAFT
        trigger: "POST /deals/{id}/brand-respond {action: COUNTER}"
        actor: Brand
        preconditions: ["deal.status == PENDING_BRAND", "acting brand owns deal", "deal.negotiation_rounds < MAX_DEAL_NEGOTIATION_ROUNDS (else ERR_NEGOTIATION_LIMIT_EXCEEDED)"]
        side_effects: ["deal.negotiation_rounds += 1", "deal.version += 1"]
      - from: PENDING_BRAND
        to: TERMINATED
        trigger: "POST /deals/{id}/brand-respond {action: DECLINE}"
        actor: Brand
        preconditions: ["deal.status == PENDING_BRAND", "acting brand owns deal"]
        side_effects: ["brief.slots_committed recomputed (-1)", "deal.version += 1"]
      - from: ACTIVE
        to: IN_DISPUTE
        trigger: "POST /deals/{id}/disputes"
        actor: Creator | Brand
        preconditions: ["deal.status IN {ACTIVE, COMPLETED}", "acting party owns deal"]
        side_effects:
          - "when prior status == ACTIVE: deal -> IN_DISPUTE; when COMPLETED: deal stays COMPLETED"
          - "all payouts of this deal with status IN {ACCRUED, PAYABLE} -> HELD (cascade)"
          - "deal.version += 1"
      - from: IN_DISPUTE
        to: ACTIVE
        trigger: "POST /disputes/{id}/resolve with action DISMISS, or UPHOLD with remedy IN {NONE, RESHOOT, FEE_REDUCTION}"
        actor: BrandManager
        preconditions: ["dispute.status IN {UNDER_REVIEW, ESCALATED}", "deal.status == IN_DISPUTE"]
        side_effects:
          - "deal -> ACTIVE; payouts HELD by this dispute -> PAYABLE or ACCRUED restored (unhold cascade)"
          - "remedy FEE_REDUCTION: deal.reduction_pct = dispute.reduction_pct"
          - "remedy RESHOOT: creates Reshoot (REQUESTED) on dispute.deliverable_id"
          - "deal.version += 1"
      - from: IN_DISPUTE
        to: TERMINATED
        trigger: "POST /disputes/{id}/resolve {action: UPHOLD, remedy: TERMINATE}"
        actor: BrandManager
        preconditions: ["dispute.status IN {UNDER_REVIEW, ESCALATED}", "deal.status == IN_DISPUTE"]
        side_effects: ["same cascade as POST /deals/{id}/terminate", "deal.version += 1"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "system auto-transition (bubble-up) when the last non-VERIFIED deliverable of the deal becomes VERIFIED"
        actor: system
        preconditions: ["every Deliverable with deal_id = deal.id has status == VERIFIED", "at least one deliverable exists"]
        side_effects: ["deal.version += 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /deals/{id}/terminate"
        actor: BrandManager
        preconditions: ["deal.status == ACTIVE"]
        side_effects:
          - "all deliverables of this deal with status NOT IN {VERIFIED, CANCELLED} -> CANCELLED (conditional cascade; VERIFIED deliverables untouched)"
          - "each deliverable cancellation -> its DisclosureChecks with status IN {QUEUED, FAILED} -> VOIDED (depth-2 link)"
          - "each disclosure voiding -> creator.pending_disclosure_count recomputed (depth-3 link)"
          - "invoices of this deal with status IN {DRAFT, ISSUED, OVERDUE} -> VOID with void_reason DEAL_TERMINATED; brand.outstanding_balance_cents reduced by each such invoice's total_cents (PAID invoices untouched)"
          - "payouts of this deal with status IN {ACCRUED, PAYABLE, HELD} -> CLAWED_BACK"
          - "brief.slots_committed recomputed (-1)"
          - "deal.version += 1"

  - entity: Deliverable
    initial_state: PENDING_SUBMISSION
    terminal_states: [VERIFIED, CANCELLED]
    transitions:
      - from: PENDING_SUBMISSION
        to: IN_REVIEW
        trigger: "POST /deliverables/{id}/submit"
        actor: Creator
        preconditions: ["deliverable.status IN {PENDING_SUBMISSION, REVISION_REQUESTED}", "deal.status == ACTIVE (else ERR_INVALID_STATE)", "acting creator owns deal"]
        side_effects: ["deliverable.version += 1"]
      - from: REVISION_REQUESTED
        to: IN_REVIEW
        trigger: "POST /deliverables/{id}/submit"
        actor: Creator
        preconditions: ["deliverable.status IN {PENDING_SUBMISSION, REVISION_REQUESTED}", "deal.status == ACTIVE", "acting creator owns deal"]
        side_effects: ["deliverable.version += 1"]
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /deliverables/{id}/review {action: APPROVE}"
        actor: BrandManager
        preconditions: ["deliverable.status == IN_REVIEW", "deal.status == ACTIVE"]
        side_effects: ["deliverable.reviewed_by_user_id = acting X-User-ID", "deliverable.version += 1"]
      - from: IN_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /deliverables/{id}/review {action: REQUEST_REVISION, note}"
        actor: BrandManager
        preconditions: ["deliverable.status == IN_REVIEW", "deal.status == ACTIVE", "deliverable.revision_rounds_used < deal.revision_rounds_included (else ERR_REVISION_LIMIT_EXCEEDED)"]
        side_effects: ["deliverable.revision_rounds_used += 1", "deliverable.version += 1"]
      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /deliverables/{id}/publish"
        actor: Creator
        preconditions:
          - "deliverable.status == APPROVED"
          - "deal.status == ACTIVE"
          - "acting creator owns deal"
          - "creator.status == ACTIVE (safety gate: suspension is the compliance-enforcement mechanism; else ERR_CREATOR_COMPLIANCE_SUSPENDED)"
          - "brief.content_window_start <= logical clock <= brief.content_window_end (else ERR_PUBLISH_WINDOW_VIOLATION)"
        side_effects:
          - "deliverable.content_url = payload.content_url; published_at = logical clock"
          - "creates DisclosureCheck (status QUEUED) for this deliverable (cascade)"
          - "creator.pending_disclosure_count recomputed (+1)"
          - "deliverable.version += 1"
      - from: PUBLISHED
        to: VERIFIED
        trigger: "system auto-transition (bubble-up) when a DisclosureCheck on this deliverable transitions to PASSED"
        actor: system
        preconditions: ["deliverable.status == PUBLISHED", "disclosure check status PASSED"]
        side_effects:
          - "deliverable.verified_at = logical clock; creator.pending_disclosure_count recomputed (-1)"
          - "if every deliverable of the deal is VERIFIED -> deal -> COMPLETED (bubble-up)"
          - "deliverable.version += 1"
      - from: APPROVED
        to: PENDING_SUBMISSION
        trigger: "POST /reshoots/{id}/respond {action: ACCEPT} (reshoot reset)"
        actor: Creator
        preconditions: ["reshoot.status == REQUESTED", "deliverable.status IN {APPROVED, PUBLISHED, VERIFIED}"]
        side_effects:
          - "deliverable -> PENDING_SUBMISSION; content_url/published_at cleared; verified_at cleared"
          - "deliverable.reshoot_count += 1; reshoot.status -> ACCEPTED"
          - "this deliverable's DisclosureChecks with status IN {QUEUED, FAILED} -> VOIDED; creator.pending_disclosure_count recomputed"
          - "if deal was COMPLETED it remains COMPLETED is impossible: reshoot requests require deal.status IN {ACTIVE, IN_DISPUTE}"
          - "deliverable.version += 1"
      - from: PUBLISHED
        to: PENDING_SUBMISSION
        trigger: "POST /reshoots/{id}/respond {action: ACCEPT} (reshoot reset)"
        actor: Creator
        preconditions: ["reshoot.status == REQUESTED", "deliverable.status IN {APPROVED, PUBLISHED, VERIFIED}"]
        side_effects: ["same as APPROVED -> PENDING_SUBMISSION reshoot reset", "deliverable.version += 1"]
      - from: VERIFIED
        to: PENDING_SUBMISSION
        trigger: "POST /reshoots/{id}/respond {action: ACCEPT} (reshoot reset)"
        actor: Creator
        preconditions: ["reshoot.status == REQUESTED", "deliverable.status IN {APPROVED, PUBLISHED, VERIFIED}"]
        side_effects: ["same reshoot reset", "deliverable.version += 1"]

  - entity: DisclosureCheck
    initial_state: QUEUED
    terminal_states: [PASSED, ESCALATED, VOIDED]
    transitions:
      - from: QUEUED
        to: PASSED
        trigger: "POST /disclosure-checks/{id}/review {action: PASS, checklist}"
        actor: ComplianceOfficer
        preconditions:
          - "check.status == QUEUED"
          - "all checklist fields true (has_ad_hashtag, verbal_disclosure, platform_tool_used) else ERR_VALIDATION"
          - "acting X-User-ID != deliverable.reviewed_by_user_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "check.checked_by_user_id / checked_at set"
          - "deliverable -> VERIFIED (bubble-up) and further deal completion bubble-up"
      - from: QUEUED
        to: FAILED
        trigger: "POST /disclosure-checks/{id}/review {action: FAIL, checklist}"
        actor: ComplianceOfficer
        preconditions: ["check.status == QUEUED", "recheck_count < MAX_DISCLOSURE_RECHECKS (otherwise ESCALATED instead)"]
        side_effects: ["check.checked_by_user_id / checked_at set"]
      - from: QUEUED
        to: ESCALATED
        trigger: "POST /disclosure-checks/{id}/review {action: FAIL} when recheck_count == MAX_DISCLOSURE_RECHECKS"
        actor: ComplianceOfficer
        preconditions: ["check.status == QUEUED", "recheck_count == MAX_DISCLOSURE_RECHECKS"]
        side_effects:
          - "creator.compliance_strikes += 1 (cross-entity cascade)"
          - "if creator.compliance_strikes >= STRIKE_LIMIT -> creator -> SUSPENDED (auto) -> creator's open pitches WITHDRAWN (depth-3 cascade)"
          - "creator.pending_disclosure_count recomputed (-1)"
      - from: FAILED
        to: QUEUED
        trigger: "POST /disclosure-checks/{id}/requeue"
        actor: Creator
        preconditions: ["check.status == FAILED", "acting creator owns the deal"]
        side_effects: ["check.recheck_count += 1"]
      - from: QUEUED
        to: VOIDED
        trigger: "system cascade (deliverable CANCELLED or reshoot reset)"
        actor: system
        preconditions: ["check.status IN {QUEUED, FAILED}"]
        side_effects: ["creator.pending_disclosure_count recomputed (-1)"]
      - from: FAILED
        to: VOIDED
        trigger: "system cascade (deliverable CANCELLED or reshoot reset)"
        actor: system
        preconditions: ["check.status IN {QUEUED, FAILED}"]
        side_effects: ["creator.pending_disclosure_count recomputed (-1)"]

  - entity: PerformanceReport
    initial_state: REPORTED
    terminal_states: [FINAL, SUPERSEDED]
    transitions:
      - from: REPORTED
        to: FINAL
        trigger: "POST /performance-reports/{id}/finalize"
        actor: BrandManager
        preconditions: ["report.status == REPORTED", "audited_views <= views (else ERR_VALIDATION)"]
        side_effects:
          - "runs performance_bonus FINAL variant -> final_bonus_cents"
          - "deal.bonus_accrued_cents recomputed (+final_bonus_cents if not yet billed)"
          - "report.version += 1"
      - from: REPORTED
        to: SUPERSEDED
        trigger: "system auto-transition when a new report for the same deal with an overlapping period is created"
        actor: system
        preconditions: ["prior report status == REPORTED", "periods overlap (any intersection)"]
        side_effects: ["prior report.version += 1"]

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: FinanceAdmin
        preconditions: ["invoice.status == DRAFT"]
        side_effects:
          - "invoice.issued_at = logical clock; due_date = issued_at + INVOICE_NET_DAYS; issued_by_user_id = acting X-User-ID"
          - "brand.outstanding_balance_cents += total_cents (ledger sync)"
          - "creates Payout (ACCRUED) with gross/commission ESTIMATED variant (cascade)"
          - "invoice.version += 1"
      - from: ISSUED
        to: OVERDUE
        trigger: "system sweep on POST /_clock/set_current_utc when clock passes due_date"
        actor: system
        preconditions: ["invoice.status == ISSUED", "logical clock > due_date"]
        side_effects: ["invoice.version += 1"]
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/record-payment"
        actor: FinanceAdmin
        preconditions: ["invoice.status IN {ISSUED, OVERDUE}", "payload.amount_cents == total_cents + late_fee_cents (else ERR_PAYMENT_AMOUNT_MISMATCH)"]
        side_effects:
          - "invoice.paid_at = logical clock; brand.outstanding_balance_cents -= total_cents"
          - "payout of this invoice ACCRUED -> PAYABLE; payout.payout_due_at = paid_at + PAYOUT_NET_DAYS (cascade link 1)"
          - "creator.lifetime_billed_cents += fee_line_cents (cascade link 2; may cross commission tier)"
          - "invoice.version += 1"
      - from: OVERDUE
        to: PAID
        trigger: "POST /invoices/{id}/record-payment"
        actor: FinanceAdmin
        preconditions: ["invoice.status IN {ISSUED, OVERDUE}", "payload.amount_cents == total_cents + late_fee_cents where late_fee_cents = late_fee_accrual(clock, due_date, total_cents)"]
        side_effects: ["same as ISSUED -> PAID", "invoice.version += 1"]
      - from: DRAFT
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: FinanceAdmin
        preconditions: ["invoice.status IN {DRAFT, ISSUED}"]
        side_effects: ["invoice.version += 1"]
      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: FinanceAdmin
        preconditions: ["invoice.status IN {DRAFT, ISSUED}"]
        side_effects:
          - "brand.outstanding_balance_cents -= total_cents (compensating entry; net zero vs issue)"
          - "payout of this invoice ACCRUED -> VOIDED (cascade)"
          - "invoice.version += 1"

  - entity: Payout
    initial_state: ACCRUED
    terminal_states: [PAID, VOIDED, CLAWED_BACK]
    transitions:
      - from: ACCRUED
        to: PAYABLE
        trigger: "system cascade on invoice record-payment"
        actor: system
        preconditions: ["invoice.status transitioned to PAID"]
        side_effects: ["payout.payout_due_at = invoice.paid_at + PAYOUT_NET_DAYS", "payout.version += 1"]
      - from: PAYABLE
        to: PAID
        trigger: "POST /payouts/{id}/release"
        actor: FinanceAdmin
        preconditions:
          - "payout.status == PAYABLE"
          - "logical clock >= payout.payout_due_at (else ERR_PAYOUT_NOT_DUE; boundary: exactly equal is allowed)"
          - "acting X-User-ID != invoice.issued_by_user_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"
          - "no DisclosureCheck on this deal's deliverables with status IN {QUEUED, FAILED} (else ERR_DISCLOSURE_NOT_PASSED)"
        side_effects:
          - "runs commission_split SETTLEMENT variant -> commission_rate_bps, commission_cents, net_cents re-pinned"
          - "payout.released_by_user_id / released_at set"
          - "payout.version += 1"
      - from: ACCRUED
        to: HELD
        trigger: "POST /payouts/{id}/hold OR system cascade on dispute raised"
        actor: FinanceAdmin | system
        preconditions: ["payout.status IN {ACCRUED, PAYABLE}"]
        side_effects: ["payout.version += 1"]
      - from: PAYABLE
        to: HELD
        trigger: "POST /payouts/{id}/hold OR system cascade on dispute raised"
        actor: FinanceAdmin | system
        preconditions: ["payout.status IN {ACCRUED, PAYABLE}"]
        side_effects: ["payout.version += 1"]
      - from: HELD
        to: PAYABLE
        trigger: "POST /payouts/{id}/unhold"
        actor: FinanceAdmin
        preconditions: ["payout.status == HELD", "payout.payout_due_at is set (invoice was paid; else target state is ACCRUED)"]
        side_effects: ["payout.version += 1"]
      - from: HELD
        to: ACCRUED
        trigger: "POST /payouts/{id}/unhold when invoice not yet paid"
        actor: FinanceAdmin
        preconditions: ["payout.status == HELD", "payout.payout_due_at is null"]
        side_effects: ["payout.version += 1"]
      - from: ACCRUED
        to: VOIDED
        trigger: "system cascade on invoice void"
        actor: system
        preconditions: ["invoice -> VOID"]
        side_effects: ["payout.version += 1"]
      - from: ACCRUED
        to: CLAWED_BACK
        trigger: "system cascade on deal termination"
        actor: system
        preconditions: ["deal -> TERMINATED"]
        side_effects: ["payout.version += 1"]
      - from: PAYABLE
        to: CLAWED_BACK
        trigger: "system cascade on deal termination"
        actor: system
        preconditions: ["deal -> TERMINATED"]
        side_effects: ["payout.version += 1"]
      - from: HELD
        to: CLAWED_BACK
        trigger: "system cascade on deal termination"
        actor: system
        preconditions: ["deal -> TERMINATED"]
        side_effects: ["payout.version += 1"]

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [RESOLVED_UPHELD, RESOLVED_DISMISSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /disputes/{id}/review"
        actor: BrandManager
        preconditions: ["dispute.status == OPEN"]
        side_effects: ["dispute.version += 1"]
      - from: UNDER_REVIEW
        to: RESOLVED_DISMISSED
        trigger: "POST /disputes/{id}/resolve {action: DISMISS}"
        actor: BrandManager
        preconditions: ["dispute.status IN {UNDER_REVIEW, ESCALATED}"]
        side_effects: ["deal IN_DISPUTE -> ACTIVE; held payouts restored", "dispute.version += 1"]
      - from: UNDER_REVIEW
        to: RESOLVED_UPHELD
        trigger: "POST /disputes/{id}/resolve {action: UPHOLD, remedy, reduction_pct?}"
        actor: BrandManager
        preconditions: ["dispute.status IN {UNDER_REVIEW, ESCALATED}", "remedy = FEE_REDUCTION requires reduction_pct in (0, 1); remedy = RESHOOT requires dispute.deliverable_id set and deliverable reshoot_count < MAX_RESHOOTS_PER_DELIVERABLE (else ERR_RESHOOT_LIMIT_EXCEEDED)"]
        side_effects: ["remedy effects per Deal state machine (IN_DISPUTE -> ACTIVE, or -> TERMINATED with full cascade)", "dispute.version += 1"]
      - from: UNDER_REVIEW
        to: ESCALATED
        trigger: "POST /disputes/{id}/resolve {action: ESCALATE}"
        actor: BrandManager
        preconditions: ["dispute.status == UNDER_REVIEW"]
        side_effects: ["dispute.version += 1"]
      - from: ESCALATED
        to: RESOLVED_UPHELD
        trigger: "POST /disputes/{id}/resolve {action: UPHOLD, remedy}"
        actor: BrandManager
        preconditions: ["dispute.status == ESCALATED", "from ESCALATED only remedy IN {TERMINATE, FEE_REDUCTION} allowed"]
        side_effects: ["remedy effects per Deal state machine", "dispute.version += 1"]
      - from: ESCALATED
        to: RESOLVED_DISMISSED
        trigger: "POST /disputes/{id}/resolve {action: DISMISS}"
        actor: BrandManager
        preconditions: ["dispute.status == ESCALATED"]
        side_effects: ["deal IN_DISPUTE -> ACTIVE; held payouts restored", "dispute.version += 1"]

  - entity: Reshoot
    initial_state: REQUESTED
    terminal_states: [ACCEPTED, DECLINED]
    transitions:
      - from: REQUESTED
        to: ACCEPTED
        trigger: "POST /reshoots/{id}/respond {action: ACCEPT}"
        actor: Creator
        preconditions: ["reshoot.status == REQUESTED", "acting creator owns the deal"]
        side_effects: ["deliverable reset to PENDING_SUBMISSION (see Deliverable reshoot reset transition)", "reshoot.responded_at = logical clock", "reshoot.version += 1"]
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /reshoots/{id}/respond {action: DECLINE}"
        actor: Creator
        preconditions: ["reshoot.status == REQUESTED", "acting creator owns the deal"]
        side_effects: ["reshoot.responded_at = logical clock", "reshoot.version += 1"]

concurrency_rules:
  - rule_id: pitch-create-stale-brief
    parent_entity: Brief
    write_endpoint: "POST /briefs/{id}/pitches"
    occ_field: "expected_brief_version"
    description: |
      Creating a pitch against a Brief whose version has advanced since the
      client last observed it is rejected. Creating a pitch mutates the brief
      (supersedes the same creator's prior SUBMITTED pitch and bumps
      brief.version), so a writer holding a stale brief version would silently
      supersede on outdated brief terms.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: deal-terms-stale-deal
    parent_entity: Deal
    write_endpoint: "POST /deals/{id}/propose-terms"
    occ_field: "expected_deal_version"
    description: |
      Proposing terms on a Deal whose version has advanced since the client
      last observed it is rejected. A new proposal supersedes the prior draft
      terms, so a writer holding a stale deal version would overwrite terms the
      other party may already have seen.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: report-submit-stale-deal
    parent_entity: Deal
    write_endpoint: "POST /deals/{id}/performance-reports"
    occ_field: "expected_deal_version"
    description: |
      Submitting a performance report against a Deal whose version has advanced
      since the client last observed it is rejected. Submission supersedes any
      REPORTED report with an overlapping period, so a stale-version submission
      would supersede reports the writer never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: rate_card_computation
    trigger: "POST /creators/{id}/transition {to_state: ACTIVE} and every PATCH /creators/{id}/metrics"
    algorithm: tiered_pricing
    formula: |
      base_cpm = tier(followers): followers < 10000 -> NANO_BASE_CPM;
                 10000 <= followers < 100000 -> MICRO_BASE_CPM;
                 100000 <= followers < 1000000 -> MID_BASE_CPM;
                 followers >= 1000000 -> MACRO_BASE_CPM
      eng_mult = engagement_rate_bps < 100 -> 0.80; < 300 -> 1.00;
                 < 600 -> 1.15; >= 600 -> 1.30
      niche_mult = niche IN {FINANCE, TECH} -> 1.20; {BEAUTY, FASHION} -> 1.10; else 1.00
      rate_card_cpm_cents = round_half_up(base_cpm * eng_mult * niche_mult) to integer cents
      rate_card_flat_cents = max(MIN_FLAT_FEE_CENTS, round_half_up(rate_card_cpm_cents * avg_views_30d / 1000))
    input_set: "the single Creator being updated; uses current followers, engagement_rate_bps, niche, avg_views_30d"
    constants:
      NANO_BASE_CPM: 1500
      MICRO_BASE_CPM: 2200
      MID_BASE_CPM: 3000
      MACRO_BASE_CPM: 4500
      MIN_FLAT_FEE_CENTS: 50000
    precision: "integer cents, round_half_up"

  - name: deal_fee_computation
    trigger: "POST /deals/{id}/brand-respond {action: ACCEPT} (at activation only; result pinned on deal.fee_total_cents)"
    algorithm: tiered_pricing
    formula: |
      Pinned evaluation order (circular-looking dependency resolved by sequence):
      1. base_sum = creator.rate_card_flat_cents * brief.deliverables_per_slot
      2. if deliverables_per_slot >= 3: base_after_discount = round_half_up(base_sum * (1 - MULTI_DELIVERABLE_DISCOUNT))
         else: base_after_discount = base_sum
      3. usage_pct = usage_rights_days <= 30 -> 0.00; <= 90 -> 0.10; <= 365 -> 0.25; else 0.50
         usage_addon = round_half_up(base_after_discount * usage_pct)
      4. whitelist_addon = whitelisting ? WHITELIST_PER_DELIVERABLE_CENTS * deliverables_per_slot : 0
      5. provisional_subtotal S = base_after_discount + usage_addon + whitelist_addon
      6. uplift_pct = 0 when exclusivity_category == NONE; else S < EXCL_TIER1_MAX -> 0.05;
         S < EXCL_TIER2_MAX -> 0.12; else 0.20   (tier keyed on S, which already includes addons)
      7. fee_total_cents = round_half_up(S * (1 + uplift_pct))
      NOTE: fee_base_cents (the negotiated base) is recorded on the deal but the computed
      fee uses the creator's rate card; fee_base_cents is the negotiated reference recorded
      for audit. The pinned order above makes the uplift-tier-on-subtotal self-reference
      well-defined.
    input_set: "the Deal being activated; its creator's current rate card; brief.deliverables_per_slot; deal usage_rights_days, whitelisting, exclusivity_category"
    constants:
      MULTI_DELIVERABLE_DISCOUNT: 0.10
      WHITELIST_PER_DELIVERABLE_CENTS: 75000
      EXCL_TIER1_MAX: 500000
      EXCL_TIER2_MAX: 2000000
    precision: "integer cents, round_half_up per step"

  - name: invoice_total_computation
    trigger: "POST /deals/{id}/invoices (lines computed at creation)"
    algorithm: aggregation
    formula: |
      PINNED ROUNDING ORDER: round each line to integer cents FIRST (round_half_up),
      then sum the rounded lines. Sum-then-round is explicitly forbidden and yields
      different cents.
      fee_line_cents     = round_half_up(deal.fee_total_cents * (1 - deal.reduction_pct))
      service_line_cents = round_half_up(SERVICE_FEE_PCT * deal.fee_total_cents * (1 - deal.reduction_pct))
      bonus_line_cents   = deal.bonus_accrued_cents (already integer)
      total_cents        = fee_line_cents + service_line_cents + bonus_line_cents
    input_set: "the Deal being billed; fee_total_cents must be set (deal ACTIVE or beyond); bonus_accrued_cents at creation time"
    constants:
      SERVICE_FEE_PCT: 0.05
    precision: "integer cents, round_half_up per line, then sum"

  - name: performance_bonus
    trigger: "POST /deals/{id}/performance-reports (PROVISIONAL variant -> provisional_bonus_cents) and POST /performance-reports/{id}/finalize (FINAL variant -> final_bonus_cents)"
    algorithm: threshold
    formula: |
      tier_bonus = highest qualifying tier, NOT cumulative:
        views >= BONUS_T3_VIEWS -> BONUS_T3_CENTS
        elif views >= BONUS_T2_VIEWS -> BONUS_T2_CENTS
        elif views >= BONUS_T1_VIEWS -> BONUS_T1_CENTS
        else 0
      engagement_rate_bps = views == 0 ? 0 : round_half_down((likes + comments + shares) * 10000 / views)
      if engagement_rate_bps >= BONUS_ENG_KICKER_BPS: bonus = round_half_up(tier_bonus * 1.25) else bonus = tier_bonus
    input_set: "PROVISIONAL: raw views/likes/comments/shares. FINAL: audited_views / audited_engagements (single audited engagement total, bot-filtered)"
    constants:
      BONUS_T1_VIEWS: 250000
      BONUS_T1_CENTS: 25000
      BONUS_T2_VIEWS: 1000000
      BONUS_T2_CENTS: 100000
      BONUS_T3_VIEWS: 5000000
      BONUS_T3_CENTS: 400000
      BONUS_ENG_KICKER_BPS: 400
    precision: "integer cents, round_half_up; engagement rate integer bps round_half_down"
    variants:
      - name: PROVISIONAL
        when: "at report submission (status REPORTED)"
        difference: "computed on raw reported metrics; optimistic — includes unaudited (possibly bot-inflated) views"
      - name: FINAL
        when: "at finalize (status FINAL)"
        difference: "computed on audited_views and audited_engagements only; when audit discounts views across a tier boundary, FINAL < PROVISIONAL"

  - name: commission_split
    trigger: "Payout creation on invoice issue (ESTIMATED) and POST /payouts/{id}/release (SETTLEMENT re-pin)"
    algorithm: tiered_pricing
    formula: |
      rate_bps = creator.lifetime_billed_cents < COMMISSION_T1_MAX -> 2000;
                 < COMMISSION_T2_MAX -> 1500; else 1200
      commission_cents = round_half_up(payout.gross_cents * rate_bps / 10000)
      net_cents = gross_cents - commission_cents
    input_set: "payout.gross_cents = invoice.fee_line_cents + invoice.bonus_line_cents; creator.lifetime_billed_cents as of evaluation instant"
    constants:
      COMMISSION_T1_MAX: 5000000
      COMMISSION_T2_MAX: 20000000
    precision: "integer cents, round_half_up"
    variants:
      - name: ESTIMATED
        when: "payout created at invoice issue"
        difference: "tier selected on lifetime_billed_cents EXCLUDING this invoice (invoice not yet paid)"
      - name: SETTLEMENT
        when: "payout release"
        difference: "tier re-selected on lifetime_billed_cents INCLUDING this invoice's fee_line_cents (added at record-payment); may cross a tier boundary, yielding a lower rate than ESTIMATED"

  - name: late_fee_accrual
    trigger: "POST /invoices/{id}/record-payment when invoice.status == OVERDUE (and for payment-amount validation)"
    algorithm: chronological
    formula: |
      days_overdue = ceil((payment_instant - due_date) / 86400 seconds); 0 when payment_instant <= due_date
      started_periods = ceil(days_overdue / LATE_FEE_PERIOD_DAYS); 1 day overdue => 1 period; exactly 7 days => 1; 8 days => 2
      late_fee_cents = round_half_up(total_cents * LATE_FEE_PCT * started_periods)
    input_set: "the invoice being paid; total_cents; due_date; logical clock payment instant"
    constants:
      LATE_FEE_PCT: 0.015
      LATE_FEE_PERIOD_DAYS: 7
      INVOICE_NET_DAYS: 30
    precision: "integer cents, round_half_up"

  - name: payout_schedule
    trigger: "invoice record-payment (sets payout_due_at) and POST /payouts/{id}/release (gate evaluation)"
    algorithm: threshold
    formula: |
      payout_due_at = invoice.paid_at + PAYOUT_NET_DAYS days
      release allowed iff logical clock >= payout_due_at (boundary: exactly equal is ALLOWED)
    input_set: "invoice.paid_at; logical clock"
    constants:
      PAYOUT_NET_DAYS: 7
      STRIKE_LIMIT: 3
      MAX_DISCLOSURE_RECHECKS: 2
      MAX_RESHOOTS_PER_DELIVERABLE: 1
      MAX_PITCH_NEGOTIATION_ROUNDS: 3
      MAX_DEAL_NEGOTIATION_ROUNDS: 4
      MIN_PUBLISH_GAP_HOURS: 48
    precision: "second-precision instants"

validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Ownership: entity_backed role (Creator/Brand) acts only on resources whose creator_id/brand_id equals X-User-ID", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "creator-respond, brand-respond, deliverable submit/publish, disclosure requeue, reshoot respond, disputes create, scoped GETs" }
  - { priority: 4, category: existence, check: "Path resources exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: existence, check: "Payload well-formed: required fields present, enums valid, ranges valid (period_end > period_start, audited_views <= views, reduction_pct in (0,1))", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 6, category: state, check: "OCC: expected_<parent>_version equals the parent entity's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /briefs/{id}/pitches, POST /deals/{id}/propose-terms, POST /deals/{id}/performance-reports" }
  - { priority: 7, category: state, check: "Terminal lockdown: trigger issued from a terminal state", error_id: ERR_ALREADY_TERMINAL, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8, category: state, check: "State precondition: entity not in a from-state the transition allows", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 9, category: business_safety, check: "Segregation of duties: disclosure reviewer != deliverable approver; payout releaser != invoice issuer", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /disclosure-checks/{id}/review, POST /payouts/{id}/release" }
  - { priority: 10, category: business_safety, check: "Compliance gate: creator.compliance_strikes < STRIKE_LIMIT for publish", error_id: ERR_CREATOR_COMPLIANCE_SUSPENDED, http_status: 422, applies_to: "POST /deliverables/{id}/publish" }
  - { priority: 11, category: business_safety, check: "Unresolved disclosure gate: no DisclosureCheck on the deal's deliverables with status IN {QUEUED, FAILED} at payout release", error_id: ERR_DISCLOSURE_NOT_PASSED, http_status: 409, applies_to: "POST /payouts/{id}/release" }
  - { priority: 12, category: business_constraint, check: "Exclusivity half-open overlap on creator's ACTIVE deals in same category", error_id: ERR_EXCLUSIVITY_CONFLICT, http_status: 409, applies_to: "POST /deals/{id}/brand-respond {action: ACCEPT}" }
  - { priority: 13, category: business_constraint, check: "Publish gap: |scheduled_publish_date - sibling scheduled_publish_date| >= MIN_PUBLISH_GAP_HOURS for all sibling deliverables of the deal", error_id: ERR_PUBLISH_GAP_VIOLATION, http_status: 409, applies_to: "POST /deals/{id}/deliverables" }
  - { priority: 14, category: business_constraint, check: "Deliverable count: existing deliverables of deal < brief.deliverables_per_slot", error_id: ERR_DELIVERABLE_COUNT_EXCEEDED, http_status: 422, applies_to: "POST /deals/{id}/deliverables" }
  - { priority: 15, category: business_constraint, check: "Revision limit: revision_rounds_used < deal.revision_rounds_included", error_id: ERR_REVISION_LIMIT_EXCEEDED, http_status: 422, applies_to: "POST /deliverables/{id}/review {action: REQUEST_REVISION}" }
  - { priority: 16, category: business_constraint, check: "Reshoot limit: deliverable.reshoot_count < MAX_RESHOOTS_PER_DELIVERABLE", error_id: ERR_RESHOOT_LIMIT_EXCEEDED, http_status: 422, applies_to: "POST /deliverables/{id}/reshoots, dispute resolve remedy RESHOOT" }
  - { priority: 17, category: business_constraint, check: "Negotiation round caps for pitch and deal counters", error_id: ERR_NEGOTIATION_LIMIT_EXCEEDED, http_status: 422, applies_to: "pitch counter/resubmit, deal creator/brand COUNTER" }
  - { priority: 18, category: business_constraint, check: "Brief slots: slots_committed < slots_total at pitch acceptance", error_id: ERR_BRIEF_SLOTS_FULL, http_status: 422, applies_to: "POST /pitches/{id}/brand-action {action: ACCEPT}" }
  - { priority: 19, category: business_constraint, check: "Pitch eligibility: creator.followers >= brief.min_followers AND creator.engagement_rate_bps >= brief.min_engagement_bps (boundary: exactly equal qualifies)", error_id: ERR_PITCH_REQUIREMENTS_NOT_MET, http_status: 422, applies_to: "POST /briefs/{id}/pitches" }
  - { priority: 20, category: business_constraint, check: "Duplicate report period: no FINAL report of the same deal with overlapping period", error_id: ERR_DUPLICATE_REPORT_PERIOD, http_status: 422, applies_to: "POST /deals/{id}/performance-reports" }
  - { priority: 21, category: business_constraint, check: "One non-VOID invoice per deal", error_id: ERR_INVOICE_ALREADY_EXISTS, http_status: 409, applies_to: "POST /deals/{id}/invoices" }
  - { priority: 22, category: business_constraint, check: "Creator exit blocked by non-terminal deals", error_id: ERR_ACTIVE_DEALS_EXIST, http_status: 422, applies_to: "POST /creators/{id}/transition {to_state: EXITED}" }
  - { priority: 23, category: business_temporal, check: "Submission window: submission_window_start <= clock <= submission_window_end at pitch creation", error_id: ERR_SUBMISSION_WINDOW_CLOSED, http_status: 422, applies_to: "POST /briefs/{id}/pitches" }
  - { priority: 24, category: business_temporal, check: "Publish window: brief.content_window_start <= clock <= brief.content_window_end", error_id: ERR_PUBLISH_WINDOW_VIOLATION, http_status: 422, applies_to: "POST /deliverables/{id}/publish" }
  - { priority: 25, category: business_temporal, check: "Payout timing: clock >= payout.payout_due_at (equal allowed)", error_id: ERR_PAYOUT_NOT_DUE, http_status: 422, applies_to: "POST /payouts/{id}/release" }
  - { priority: 26, category: business_referential, check: "Pitch requires creator.status == ACTIVE", error_id: ERR_CREATOR_NOT_ACTIVE, http_status: 422, applies_to: "POST /briefs/{id}/pitches" }
  - { priority: 27, category: business_referential, check: "Brief creation/publish requires brand.status == ACTIVE", error_id: ERR_BRAND_SUSPENDED, http_status: 422, applies_to: "POST /briefs, POST /briefs/{id}/publish" }
  - { priority: 28, category: business_fiscal, check: "Brand credit hold blocks brief publish and deal activation", error_id: ERR_BRAND_CREDIT_HOLD, http_status: 402, applies_to: "POST /briefs/{id}/publish, POST /deals/{id}/brand-respond {action: ACCEPT}" }
  - { priority: 29, category: business_fiscal, check: "Brief budget: committed accepted pitch fees + this fee <= budget_cents", error_id: ERR_BRIEF_BUDGET_EXCEEDED, http_status: 422, applies_to: "POST /pitches/{id}/brand-action {action: ACCEPT}" }
  - { priority: 30, category: business_fiscal, check: "Payment amount equals total_cents + late_fee_cents", error_id: ERR_PAYMENT_AMOUNT_MISMATCH, http_status: 422, applies_to: "POST /invoices/{id}/record-payment" }

endpoints:
  - { method: POST, path: "/creators", description: "Onboard a creator (status APPLIED)", roles: [TalentManager], code: 201, input: [handle, email, niche, primary_platform, followers, avg_views_30d, engagement_rate_bps], output: Creator, side_effects: [] }
  - { method: GET, path: "/creators", description: "List creators", roles: [TalentManager, BrandManager, FinanceAdmin, ComplianceOfficer], code: 200, input: ["status?", "niche?", "min_followers?", "limit?", "offset?"], output: "Creator[]", side_effects: [] }
  - { method: GET, path: "/creators/{id}", description: "Get one creator", roles: [TalentManager, BrandManager, FinanceAdmin, ComplianceOfficer, Creator], code: 200, input: [], output: Creator, side_effects: [] }
  - { method: PATCH, path: "/creators/{id}/metrics", description: "Update audience metrics; recomputes rate card", roles: [TalentManager], code: 200, input: [followers, avg_views_30d, engagement_rate_bps], output: Creator, side_effects: ["runs rate_card_computation", "creator.version += 1"] }
  - { method: POST, path: "/creators/{id}/transition", description: "Advance/suspend/reinstate/exit a creator", roles: [TalentManager], code: 200, input: [to_state], output: Creator, side_effects: ["state machine Creator", "ACTIVE transition runs rate_card_computation", "SUSPENDED cascades pitch withdrawals"] }

  - { method: POST, path: "/brands", description: "Onboard a brand (status ACTIVE)", roles: [BrandManager], code: 201, input: [name, industry], output: Brand, side_effects: [] }
  - { method: GET, path: "/brands", description: "List brands", roles: [BrandManager, FinanceAdmin, TalentManager], code: 200, input: ["status?", "limit?", "offset?"], output: "Brand[]", side_effects: [] }
  - { method: GET, path: "/brands/{id}", description: "Get one brand", roles: [BrandManager, FinanceAdmin, TalentManager, Brand], code: 200, input: [], output: Brand, side_effects: [] }
  - { method: PATCH, path: "/brands/{id}", description: "Update brand (status, credit_hold)", roles: [BrandManager], code: 200, input: ["status?", "credit_hold?"], output: Brand, side_effects: ["brand.version += 1"] }

  - { method: POST, path: "/briefs", description: "Create a brief (DRAFT)", roles: [BrandManager], code: 201, input: [brand_id, title, niche, min_followers, min_engagement_bps, slots_total, budget_cents, deliverables_per_slot, usage_rights_days, exclusivity_category, exclusivity_days, "whitelisting_required?", "revision_rounds_included?", submission_window_start, submission_window_end, content_window_start, content_window_end], output: Brief, side_effects: ["validates brand ACTIVE (ERR_BRAND_SUSPENDED)"] }
  - { method: GET, path: "/briefs", description: "List briefs", roles: [BrandManager, TalentManager, Creator, Brand, FinanceAdmin], code: 200, input: ["brand_id?", "status?", "niche?", "limit?", "offset?"], output: "Brief[]", side_effects: [] }
  - { method: GET, path: "/briefs/{id}", description: "Get one brief", roles: [BrandManager, TalentManager, Creator, Brand, FinanceAdmin], code: 200, input: [], output: Brief, side_effects: [] }
  - { method: POST, path: "/briefs/{id}/publish", description: "Publish brief DRAFT -> OPEN", roles: [BrandManager], code: 200, input: [], output: Brief, side_effects: ["brief.version += 1"] }
  - { method: POST, path: "/briefs/{id}/close", description: "Close brief OPEN/AWARDED -> CLOSED", roles: [BrandManager], code: 200, input: [], output: Brief, side_effects: ["cascade pitch withdrawals when OPEN"] }
  - { method: GET, path: "/briefs/{id}/pitches", description: "List pitches of a brief", roles: [BrandManager, TalentManager], code: 200, input: ["status?", "limit?", "offset?"], output: "Pitch[]", side_effects: [] }
  - { method: POST, path: "/briefs/{id}/pitches", description: "Create a pitch (OCC on brief version); supersedes same creator's prior SUBMITTED pitch on this brief", roles: [TalentManager], code: 201, input: [creator_id, proposed_fee_cents, concept_note, expected_brief_version], output: Pitch, side_effects: ["increments Brief.version by 1", "auto-supercedes prior SUBMITTED pitch of same creator on this brief"] }

  - { method: GET, path: "/pitches", description: "List pitches with filters", roles: [BrandManager, TalentManager], code: 200, input: ["brief_id?", "creator_id?", "deal_id?", "superseded_by_pitch_id?", "status?", "limit?", "offset?"], output: "Pitch[]", side_effects: [] }
  - { method: GET, path: "/pitches/{id}", description: "Get one pitch", roles: [BrandManager, TalentManager], code: 200, input: [], output: Pitch, side_effects: [] }
  - { method: POST, path: "/pitches/{id}/brand-action", description: "Brand-side pitch action: SHORTLIST | COUNTER | REJECT | ACCEPT", roles: [BrandManager], code: 200, input: [action, "counter_fee_cents?"], output: Pitch, side_effects: ["ACCEPT creates Deal (DRAFT), recomputes brief.slots_committed, may auto-AWARD brief"] }
  - { method: POST, path: "/pitches/{id}/talent-action", description: "Talent-side pitch action: RESUBMIT | WITHDRAW", roles: [TalentManager], code: 200, input: [action, "proposed_fee_cents?"], output: Pitch, side_effects: ["RESUBMIT from COUNTERED increments negotiation_rounds"] }

  - { method: GET, path: "/deals", description: "List deals with filters", roles: [BrandManager, TalentManager, FinanceAdmin, Creator, Brand], code: 200, input: ["pitch_id?", "brief_id?", "creator_id?", "brand_id?", "status?", "limit?", "offset?"], output: "Deal[]", side_effects: [] }
  - { method: GET, path: "/deals/{id}", description: "Get one deal", roles: [BrandManager, TalentManager, FinanceAdmin, Creator, Brand, ComplianceOfficer], code: 200, input: [], output: Deal, side_effects: [] }
  - { method: POST, path: "/deals/{id}/propose-terms", description: "Propose terms DRAFT -> PENDING_CREATOR (OCC on deal version)", roles: [BrandManager], code: 200, input: [fee_base_cents, expected_deal_version], output: Deal, side_effects: ["increments Deal.version by 1", "terms_version += 1"] }
  - { method: POST, path: "/deals/{id}/creator-respond", description: "Creator responds to terms: ACCEPT | COUNTER | DECLINE", roles: [Creator], code: 200, input: [action, "counter_fee_cents?"], output: Deal, side_effects: ["deal.version += 1"] }
  - { method: POST, path: "/deals/{id}/brand-respond", description: "Brand responds to terms: ACCEPT | COUNTER | DECLINE", roles: [Brand], code: 200, input: [action], output: Deal, side_effects: ["ACCEPT runs deal_fee_computation, sets exclusivity window", "deal.version += 1"] }
  - { method: POST, path: "/deals/{id}/terminate", description: "Terminate an ACTIVE deal with full cascade", roles: [BrandManager], code: 200, input: [reason], output: Deal, side_effects: ["deliverable cancellation cascade", "disclosure voiding", "invoice voiding", "payout clawback", "brief slots recompute"] }
  - { method: POST, path: "/deals/{id}/disputes", description: "Raise a dispute on an ACTIVE or COMPLETED deal", roles: [Creator, Brand], code: 201, input: [reason, note, "deliverable_id?"], output: Dispute, side_effects: ["deal ACTIVE -> IN_DISPUTE", "payout hold cascade"] }

  - { method: POST, path: "/deals/{id}/deliverables", description: "Plan a deliverable on an ACTIVE deal", roles: [BrandManager], code: 201, input: [platform, due_date, scheduled_publish_date], output: Deliverable, side_effects: ["publish-gap and count validations"] }
  - { method: GET, path: "/deals/{id}/deliverables", description: "List deliverables of a deal", roles: [BrandManager, TalentManager, Creator, Brand, ComplianceOfficer, FinanceAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "Deliverable[]", side_effects: [] }
  - { method: GET, path: "/deliverables/{id}", description: "Get one deliverable", roles: [BrandManager, TalentManager, Creator, Brand, ComplianceOfficer], code: 200, input: [], output: Deliverable, side_effects: [] }
  - { method: POST, path: "/deliverables/{id}/submit", description: "Creator submits content for review", roles: [Creator], code: 200, input: [], output: Deliverable, side_effects: ["deliverable.version += 1"] }
  - { method: POST, path: "/deliverables/{id}/review", description: "BrandManager reviews: APPROVE | REQUEST_REVISION", roles: [BrandManager], code: 200, input: [action, "note?"], output: Deliverable, side_effects: ["APPROVE records reviewed_by_user_id", "REQUEST_REVISION increments revision_rounds_used"] }
  - { method: POST, path: "/deliverables/{id}/publish", description: "Creator marks content published", roles: [Creator], code: 200, input: [content_url], output: Deliverable, side_effects: ["creates DisclosureCheck QUEUED", "creator.pending_disclosure_count recomputed"] }
  - { method: GET, path: "/deliverables/{id}/disclosure-checks", description: "List disclosure checks of a deliverable", roles: [ComplianceOfficer, BrandManager, Creator], code: 200, input: ["status?", "limit?", "offset?"], output: "DisclosureCheck[]", side_effects: [] }
  - { method: GET, path: "/deliverables/{id}/reshoots", description: "List reshoots of a deliverable", roles: [BrandManager, Creator, TalentManager], code: 200, input: ["status?", "limit?", "offset?"], output: "Reshoot[]", side_effects: [] }
  - { method: POST, path: "/deliverables/{id}/reshoots", description: "Request a reshoot on an APPROVED/PUBLISHED/VERIFIED deliverable", roles: [BrandManager], code: 201, input: [reason, "dispute_id?"], output: Reshoot, side_effects: ["reshoot limit validation"] }

  - { method: POST, path: "/disclosure-checks/{id}/review", description: "ComplianceOfficer passes or fails a queued check", roles: [ComplianceOfficer], code: 200, input: [action, "has_ad_hashtag?", "verbal_disclosure?", "platform_tool_used?"], output: DisclosureCheck, side_effects: ["PASS bubbles deliverable -> VERIFIED", "FAIL at max rechecks -> ESCALATED + strike cascade"] }
  - { method: POST, path: "/disclosure-checks/{id}/requeue", description: "Creator requeues a FAILED check after fixing content", roles: [Creator], code: 200, input: [], output: DisclosureCheck, side_effects: ["recheck_count += 1"] }

  - { method: POST, path: "/deals/{id}/performance-reports", description: "Submit a performance report (OCC on deal version); deal must be ACTIVE or COMPLETED (else ERR_INVALID_STATE); supersedes overlapping REPORTED reports", roles: [BrandManager], code: 201, input: [period_start, period_end, views, likes, comments, shares, expected_deal_version], output: PerformanceReport, side_effects: ["runs performance_bonus PROVISIONAL", "increments Deal.version by 1", "supersede cascade"] }
  - { method: GET, path: "/deals/{id}/performance-reports", description: "List performance reports of a deal", roles: [BrandManager, TalentManager, Creator, Brand, FinanceAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "PerformanceReport[]", side_effects: [] }
  - { method: POST, path: "/performance-reports/{id}/finalize", description: "Finalize a report with audited metrics", roles: [BrandManager], code: 200, input: [audited_views, audited_engagements], output: PerformanceReport, side_effects: ["runs performance_bonus FINAL", "deal.bonus_accrued_cents recomputed"] }

  - { method: POST, path: "/deals/{id}/invoices", description: "Create invoice (DRAFT); deal must be ACTIVE or COMPLETED with >= 1 VERIFIED deliverable (else ERR_INVALID_STATE)", roles: [FinanceAdmin], code: 201, input: [], output: Invoice, side_effects: ["runs invoice_total_computation"] }
  - { method: GET, path: "/invoices", description: "List invoices", roles: [FinanceAdmin, BrandManager, Brand], code: 200, input: ["deal_id?", "brand_id?", "status?", "limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: GET, path: "/invoices/{id}", description: "Get one invoice", roles: [FinanceAdmin, BrandManager, Brand], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/invoices/{id}/issue", description: "Issue invoice; sets due date; creates ACCRUED payout", roles: [FinanceAdmin], code: 200, input: [], output: Invoice, side_effects: ["brand.outstanding_balance_cents += total", "creates Payout ACCRUED (ESTIMATED commission)"] }
  - { method: POST, path: "/invoices/{id}/record-payment", description: "Record brand payment; exact amount required", roles: [FinanceAdmin], code: 200, input: [amount_cents], output: Invoice, side_effects: ["payout ACCRUED -> PAYABLE", "creator.lifetime_billed_cents += fee_line_cents", "late_fee_accrual when OVERDUE"] }
  - { method: POST, path: "/invoices/{id}/void", description: "Void a DRAFT/ISSUED invoice", roles: [FinanceAdmin], code: 200, input: [void_reason], output: Invoice, side_effects: ["outstanding compensating entry", "payout ACCRUED -> VOIDED"] }

  - { method: GET, path: "/payouts", description: "List payouts", roles: [FinanceAdmin, Creator, BrandManager], code: 200, input: ["invoice_id?", "deal_id?", "creator_id?", "status?", "limit?", "offset?"], output: "Payout[]", side_effects: [] }
  - { method: GET, path: "/payouts/{id}", description: "Get one payout", roles: [FinanceAdmin, Creator, BrandManager], code: 200, input: [], output: Payout, side_effects: [] }
  - { method: POST, path: "/payouts/{id}/release", description: "Release a PAYABLE payout at/after due instant", roles: [FinanceAdmin], code: 200, input: [], output: Payout, side_effects: ["runs commission_split SETTLEMENT", "segregation-of-duties check"] }
  - { method: POST, path: "/payouts/{id}/hold", description: "Hold an ACCRUED/PAYABLE payout", roles: [FinanceAdmin], code: 200, input: [], output: Payout, side_effects: ["payout.version += 1"] }
  - { method: POST, path: "/payouts/{id}/unhold", description: "Unhold a HELD payout (restores ACCRUED or PAYABLE)", roles: [FinanceAdmin], code: 200, input: [], output: Payout, side_effects: ["payout.version += 1"] }

  - { method: GET, path: "/disputes", description: "List disputes", roles: [BrandManager, Creator, Brand, FinanceAdmin], code: 200, input: ["deal_id?", "deliverable_id?", "status?", "limit?", "offset?"], output: "Dispute[]", side_effects: [] }
  - { method: GET, path: "/disputes/{id}", description: "Get one dispute", roles: [BrandManager, Creator, Brand, FinanceAdmin], code: 200, input: [], output: Dispute, side_effects: [] }
  - { method: POST, path: "/disputes/{id}/review", description: "Move dispute OPEN -> UNDER_REVIEW", roles: [BrandManager], code: 200, input: [], output: Dispute, side_effects: ["dispute.version += 1"] }
  - { method: POST, path: "/disputes/{id}/resolve", description: "Resolve: DISMISS | UPHOLD (remedy) | ESCALATE", roles: [BrandManager], code: 200, input: [action, "remedy?", "reduction_pct?", "resolution_note?"], output: Dispute, side_effects: ["deal resume/terminate cascade per remedy", "RESHOOT remedy creates Reshoot REQUESTED"] }

  - { method: GET, path: "/reshoots", description: "List reshoots", roles: [BrandManager, Creator, TalentManager], code: 200, input: ["dispute_id?", "deliverable_id?", "status?", "limit?", "offset?"], output: "Reshoot[]", side_effects: [] }
  - { method: GET, path: "/reshoots/{id}", description: "Get one reshoot", roles: [BrandManager, Creator, TalentManager], code: 200, input: [], output: Reshoot, side_effects: [] }
  - { method: POST, path: "/reshoots/{id}/respond", description: "Creator accepts or declines a reshoot", roles: [Creator], code: 200, input: [action], output: Reshoot, side_effects: ["ACCEPT resets deliverable to PENDING_SUBMISSION"] }

  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock. Setting the clock sweeps briefs OPEN past submission_window_end -> EXPIRED and invoices ISSUED past due_date -> OVERDUE.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["brief expiry sweep", "invoice overdue sweep"] }

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID, or unknown role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on endpoint, or entity_backed caller does not own the resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist (checked left-to-right)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, invalid enum, invalid range (period_end <= period_start, audited_views > views, reduction_pct outside (0,1))" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Action attempted from a terminal state" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Action attempted from a non-terminal state the transition does not allow" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same X-User-ID attempts both sides of a controlled step (approve vs disclosure review; issue vs release)" }
  - { id: ERR_CREATOR_COMPLIANCE_SUSPENDED, http: 422, condition: "Publish attempted while creator.compliance_strikes >= STRIKE_LIMIT" }
  - { id: ERR_DISCLOSURE_NOT_PASSED, http: 409, condition: "Payout release while any DisclosureCheck on the deal's deliverables is QUEUED or FAILED" }
  - { id: ERR_EXCLUSIVITY_CONFLICT, http: 409, condition: "Deal activation would overlap half-open exclusivity windows of the same category on the same creator" }
  - { id: ERR_PUBLISH_GAP_VIOLATION, http: 409, condition: "New deliverable's scheduled_publish_date within MIN_PUBLISH_GAP_HOURS of a sibling" }
  - { id: ERR_DELIVERABLE_COUNT_EXCEEDED, http: 422, condition: "Deal already has brief.deliverables_per_slot non-CANCELLED deliverables" }
  - { id: ERR_REVISION_LIMIT_EXCEEDED, http: 422, condition: "REQUEST_REVISION when revision_rounds_used >= deal.revision_rounds_included" }
  - { id: ERR_RESHOOT_LIMIT_EXCEEDED, http: 422, condition: "Reshoot requested when deliverable.reshoot_count >= MAX_RESHOOTS_PER_DELIVERABLE" }
  - { id: ERR_NEGOTIATION_LIMIT_EXCEEDED, http: 422, condition: "Counter/resubmit beyond MAX_PITCH_NEGOTIATION_ROUNDS or MAX_DEAL_NEGOTIATION_ROUNDS" }
  - { id: ERR_BRIEF_SLOTS_FULL, http: 422, condition: "Pitch acceptance when slots_committed >= slots_total" }
  - { id: ERR_PITCH_REQUIREMENTS_NOT_MET, http: 422, condition: "Creator below brief min_followers or min_engagement_bps" }
  - { id: ERR_DUPLICATE_REPORT_PERIOD, http: 422, condition: "Report period overlaps a FINAL report of the same deal" }
  - { id: ERR_INVOICE_ALREADY_EXISTS, http: 409, condition: "Deal already has a non-VOID invoice" }
  - { id: ERR_ACTIVE_DEALS_EXIST, http: 422, condition: "Creator exit attempted with non-terminal deals" }
  - { id: ERR_SUBMISSION_WINDOW_CLOSED, http: 422, condition: "Pitch created outside the brief submission window" }
  - { id: ERR_PUBLISH_WINDOW_VIOLATION, http: 422, condition: "Publish attempted outside the brief content window" }
  - { id: ERR_PAYOUT_NOT_DUE, http: 422, condition: "Release attempted before payout_due_at" }
  - { id: ERR_CREATOR_NOT_ACTIVE, http: 422, condition: "Pitch attempted for a creator whose status != ACTIVE" }
  - { id: ERR_BRAND_SUSPENDED, http: 422, condition: "Brief create/publish attempted for a SUSPENDED brand" }
  - { id: ERR_BRAND_CREDIT_HOLD, http: 402, condition: "Brief publish or deal activation attempted while brand.credit_hold is true" }
  - { id: ERR_BRIEF_BUDGET_EXCEEDED, http: 422, condition: "Pitch acceptance would push committed fees above brief.budget_cents" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "record-payment amount_cents != total_cents + late_fee_cents" }

roles:
  - name: PlatformAdmin
    description: "Platform operator; controls the logical clock only"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc"]
    shared_operations: []
  - name: TalentManager
    description: "Agency talent-side operator: roster onboarding, metrics/rate card, pitching"
    identity: opaque
    exclusive_operations: ["POST /creators", "PATCH /creators/{id}/metrics", "POST /creators/{id}/transition", "POST /briefs/{id}/pitches", "POST /pitches/{id}/talent-action"]
    shared_operations: ["GET /creators", "GET /creators/{id}", "GET /brands", "GET /brands/{id}", "GET /briefs", "GET /briefs/{id}", "GET /briefs/{id}/pitches", "GET /pitches", "GET /pitches/{id}", "GET /deals", "GET /deals/{id}", "GET /deals/{id}/deliverables", "GET /deliverables/{id}", "GET /deals/{id}/performance-reports", "GET /deliverables/{id}/reshoots", "GET /reshoots", "GET /reshoots/{id}"]
  - name: BrandManager
    description: "Agency brand-side operator: brands, briefs, pitch decisions, deal terms, content review, reports, disputes, reshoots"
    identity: opaque
    exclusive_operations: ["POST /brands", "PATCH /brands/{id}", "POST /briefs", "POST /briefs/{id}/publish", "POST /briefs/{id}/close", "POST /pitches/{id}/brand-action", "POST /deals/{id}/propose-terms", "POST /deals/{id}/terminate", "POST /deals/{id}/deliverables", "POST /deliverables/{id}/review", "POST /deals/{id}/performance-reports", "POST /performance-reports/{id}/finalize", "POST /deliverables/{id}/reshoots", "POST /disputes/{id}/review", "POST /disputes/{id}/resolve"]
    shared_operations: ["GET /creators", "GET /creators/{id}", "GET /brands", "GET /brands/{id}", "GET /briefs", "GET /briefs/{id}", "GET /briefs/{id}/pitches", "GET /pitches", "GET /pitches/{id}", "GET /deals", "GET /deals/{id}", "GET /deals/{id}/deliverables", "GET /deliverables/{id}", "GET /deliverables/{id}/disclosure-checks", "GET /deals/{id}/performance-reports", "GET /invoices", "GET /invoices/{id}", "GET /payouts", "GET /payouts/{id}", "GET /disputes", "GET /disputes/{id}", "GET /deliverables/{id}/reshoots", "GET /reshoots", "GET /reshoots/{id}"]
  - name: ComplianceOfficer
    description: "Independent compliance reviewer; must not be the user who approved the content under review"
    identity: opaque
    exclusive_operations: ["POST /disclosure-checks/{id}/review"]
    shared_operations: ["GET /creators", "GET /creators/{id}", "GET /deals/{id}", "GET /deals/{id}/deliverables", "GET /deliverables/{id}", "GET /deliverables/{id}/disclosure-checks"]
  - name: FinanceAdmin
    description: "Agency finance operator: invoicing, payment recording, payout release; issuer and releaser must differ"
    identity: opaque
    exclusive_operations: ["POST /deals/{id}/invoices", "POST /invoices/{id}/issue", "POST /invoices/{id}/record-payment", "POST /invoices/{id}/void", "POST /payouts/{id}/release", "POST /payouts/{id}/hold", "POST /payouts/{id}/unhold"]
    shared_operations: ["GET /creators", "GET /creators/{id}", "GET /brands", "GET /brands/{id}", "GET /briefs", "GET /briefs/{id}", "GET /deals", "GET /deals/{id}", "GET /deals/{id}/deliverables", "GET /deals/{id}/performance-reports", "GET /invoices", "GET /invoices/{id}", "GET /payouts", "GET /payouts/{id}", "GET /disputes", "GET /disputes/{id}"]
  - name: Creator
    description: "Talent network creator acting on their own deals, deliverables, disclosure requeues, reshoots and disputes"
    identity: "entity_backed:Creator"
    exclusive_operations: ["POST /deals/{id}/creator-respond", "POST /deliverables/{id}/submit", "POST /deliverables/{id}/publish", "POST /disclosure-checks/{id}/requeue", "POST /reshoots/{id}/respond"]
    shared_operations: ["GET /creators/{id}", "GET /briefs", "GET /briefs/{id}", "GET /deals", "GET /deals/{id}", "GET /deals/{id}/deliverables", "GET /deliverables/{id}", "GET /deliverables/{id}/disclosure-checks", "GET /deals/{id}/performance-reports", "GET /payouts", "GET /payouts/{id}", "POST /deals/{id}/disputes", "GET /disputes", "GET /disputes/{id}", "GET /deliverables/{id}/reshoots", "GET /reshoots", "GET /reshoots/{id}"]
  - name: Brand
    description: "Brand principal acting on their own deals and disputes"
    identity: "entity_backed:Brand"
    exclusive_operations: ["POST /deals/{id}/brand-respond"]
    shared_operations: ["GET /brands/{id}", "GET /briefs", "GET /briefs/{id}", "GET /deals", "GET /deals/{id}", "GET /deals/{id}/deliverables", "GET /deliverables/{id}", "GET /deals/{id}/performance-reports", "GET /invoices", "GET /invoices/{id}", "POST /deals/{id}/disputes", "GET /disputes", "GET /disputes/{id}"]
