        distinguishing_aspect: "window_minutes is derived from the two bounds (a 36-hour window is 2160 minutes), the run starts OPEN with weight_variant null, and opened_by_user_id is taken from X-User-ID."
        test_recipe:
          setup:
            - "Market DMA-613 with one cell, a PUBLISHED 2026Q3 universe vintage and a PUBLISHED rule set. The clock is moved to 2026-08-12T00:00:00Z so a window ending 2026-08-11T12:00:00Z is in the past."
