scenario: |
  564. Antiques & Estate-Sale Auction House (online/live): consignment intake &
  appraisal, lot catalog & reserve, absentee/live/online bid & increment,
  hammer + buyer's premium, settlement & seller payout, pickup/shipping &
  storage fee, unsold/buy-in, authenticity dispute
domain_name: auction-house
api_prefix: "/"

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - rate_threshold_triggers        # buyer's-premium tiers, bid-increment bands, storage free-days boundary
    - dual_variant_calculation       # provisional vs final storage fee; provisional vs final seller payout
    - cascading_side_effects         # hammer -> invoice line -> invoice total; dispute upheld -> void -> rescind -> settlement
    - optimistic_concurrency         # bid placement supersedes prior high bid (OCC on Lot.version)

  entity_topology: flat
  # Peer entities linked by foreign keys (Consignor, Bidder, Auction, Lot, Bid,
  # Invoice, Settlement, Dispute). URL paths are flat collections, not nested trees.

  state_machine_shape: parallel
  # Invoice carries two independent axes (payment_status x fulfillment_status);
  # Dispute is cyclic (UNDER_REVIEW <-> OPEN); Lot branches then reverts
  # (HAMMERED -> RESCINDED). Not a single linear pipeline.

  relationship_patterns:
    - one_to_many        # Consignment->Lots, Lot->Bids, Invoice->InvoiceLines
    - cross_aggregate    # Settlement aggregates over Consignment's Lots; Dispute reaches Lot + Settlement

  role_model: peer_roles
  # AuctionStaff, Appraiser, SettlementOfficer own distinct operational surfaces;
  # Consignor and Bidder are entity-backed principals acting on their own resources.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Consignor
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: Legal or trade name of the seller / estate.
      - name: email
        type: string
        source: input
        description: Contact email.
      - name: payout_method
        type: enum
        source: input
        description: How seller proceeds are disbursed.
        default: CHECK
        constraints: "one of {CHECK, ACH, STORE_CREDIT}"

  - name: Bidder
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: Buyer name.
      - name: email
        type: string
        source: input
        description: Contact email.
      - name: paddle_number
        type: string
        source: input
        description: Bidding paddle identifier; globally unique across bidders.
        constraints: "unique; non-empty"
      - name: deposit_cents
        type: integer
        source: input
        description: Refundable deposit on file, in cents. Gates high-value bidding.
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Bidder standing. New bidders are ACTIVE; SUSPENDED cannot bid.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: Saleroom
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Saleroom / venue name.
      - name: location
        type: string
        source: input
        description: Physical location.
      - name: capacity
        type: integer
        source: input
        description: Seat capacity.
        constraints: "> 0"

  - name: Auction
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: Sale title.
      - name: sale_type
        type: enum
        source: input
        description: Channel of the sale.
        constraints: "one of {LIVE, ONLINE, TIMED}"
      - name: saleroom_id
        type: string
        source: input
        description: "FK -> Saleroom.id; the venue this sale occupies."
      - name: scheduled_start
        type: datetime
        source: input
        description: Session start (ISO 8601 UTC). Occupies the saleroom over [scheduled_start, scheduled_end).
      - name: scheduled_end
        type: datetime
        source: input
        description: Session end (ISO 8601 UTC).
        constraints: "scheduled_end > scheduled_start"
      - name: status
        type: enum
        source: system
        description: Sale lifecycle state.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, OPEN, CLOSED}"

  - name: Consignment
    parent: null
    common_fields: true
    fields:
      - name: consignor_id
        type: string
        source: input
        description: "FK -> Consignor.id; the seller this intake agreement belongs to."
      - name: commission_rate
        type: number
        source: input
        description: Seller commission fraction applied to gross hammer at settlement.
        constraints: "0 <= commission_rate < 1"
      - name: estimate_low_cents
        type: integer
        source: input
        description: Pre-sale low estimate, cents.
        constraints: ">= 0"
      - name: estimate_high_cents
        type: integer
        source: input
        description: Pre-sale high estimate, cents.
        constraints: ">= estimate_low_cents"
      - name: intake_window_start
        type: datetime
        source: input
        description: Scheduled estate-inspection window start (ISO 8601 UTC). Occupies the consignor over [intake_window_start, intake_window_end] (closed) with a mandatory INTAKE_BUFFER_MINUTES gap between windows.
      - name: intake_window_end
        type: datetime
        source: input
        description: Inspection window end (ISO 8601 UTC).
        constraints: "intake_window_end > intake_window_start"
      - name: status
        type: enum
        source: system
        description: Intake / appraisal lifecycle state.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, APPRAISED, ACCEPTED, DECLINED}"
      - name: appraised_low_cents
        type: integer
        source: system
        description: Appraiser-set low valuation, cents. Null until APPRAISED.
      - name: appraised_high_cents
        type: integer
        source: system
        description: Appraiser-set high valuation, cents. Null until APPRAISED.
      - name: appraisal_notes
        type: string
        source: system
        description: Free-text appraisal notes. Null until APPRAISED.

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - name: consignment_id
        type: string
        source: input
        description: "FK -> Consignment.id; the accepted consignment supplying this lot."
      - name: auction_id
        type: string
        source: input
        description: "FK -> Auction.id; the sale this lot is cataloged into."
      - name: title
        type: string
        source: input
        description: Lot title.
      - name: category
        type: string
        source: input
        description: Category label (e.g., FURNITURE, JEWELRY).
      - name: reserve_cents
        type: integer
        source: input
        description: Confidential minimum hammer; below this the lot cannot be hammered and is bought in.
        constraints: ">= 0"
      - name: starting_bid_cents
        type: integer
        source: input
        description: Opening bid; the minimum acceptable first bid.
        constraints: "> 0"
      - name: estimate_low_cents
        type: integer
        source: input
        description: Lot low estimate, cents.
      - name: estimate_high_cents
        type: integer
        source: input
        description: Lot high estimate, cents.
        constraints: ">= estimate_low_cents"
      - name: lot_number
        type: integer
        source: input
        description: Ordinal position in the sale.
        constraints: "> 0"
      - name: sale_status
        type: enum
        source: system
        description: Lot lifecycle state.
        default: CATALOGED
        constraints: "one of {CATALOGED, OPEN, HAMMERED, PASSED, RESCINDED}"
      - name: current_high_bid_cents
        type: integer
        source: computed
        description: Amount of the current highest ACTIVE bid; 0 when no bids. Updated on every accepted bid.
        default: 0
      - name: current_high_bid_id
        type: string
        source: computed
        description: Id of the current highest ACTIVE Bid (computed pointer; null when no bids). Not an ownership foreign key — discover bids via GET /bids?lot_id.
      - name: hammer_price_cents
        type: integer
        source: computed
        description: Winning amount recorded at hammer; null until HAMMERED.
      - name: winning_bid_id
        type: string
        source: computed
        description: Id of the WINNING Bid recorded at hammer (computed pointer; null until HAMMERED). Not an ownership foreign key.

  - name: Bid
    parent: null
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> Lot.id; the lot bid upon."
      - name: bidder_id
        type: string
        source: input
        description: "FK -> Bidder.id; the bidder placing this bid."
      - name: bid_type
        type: enum
        source: input
        description: Channel through which the bid was placed.
        constraints: "one of {ABSENTEE, LIVE, ONLINE}"
      - name: amount_cents
        type: integer
        source: input
        description: Bid amount, cents. Must meet the lot's next minimum bid.
        constraints: "> 0"
      - name: expected_lot_version
        type: integer
        source: input
        description: Lot.version the bidder last observed; OCC guard for supersede races.
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: Bid lifecycle state.
        default: ACTIVE
        constraints: "one of {ACTIVE, OUTBID, WINNING, RETRACTED}"

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: bidder_id
        type: string
        source: system
        description: "FK -> Bidder.id; the winning buyer. Set when the invoice is cascade-created at the first hammer for this bidder in this auction."
      - name: auction_id
        type: string
        source: system
        description: "FK -> Auction.id; the sale the invoice consolidates."
      - name: hammer_subtotal_cents
        type: integer
        source: computed
        description: Sum of hammer_price_cents over this invoice's non-VOID lines.
        default: 0
      - name: premium_subtotal_cents
        type: integer
        source: computed
        description: Sum of per-line buyers_premium_cents over non-VOID lines (each line rounded before summing).
        default: 0
      - name: storage_fee_cents
        type: integer
        source: computed
        description: Storage fee. 0 (provisional) until the invoice is readied; then finalized to the accrued amount.
        default: 0
      - name: shipping_fee_cents
        type: integer
        source: computed
        description: Shipping fee; 0 for pickup, else the amount supplied at ready.
        default: 0
      - name: total_due_cents
        type: integer
        source: computed
        description: hammer_subtotal + premium_subtotal + storage_fee + shipping_fee.
        default: 0
      - name: amount_paid_cents
        type: integer
        source: system
        description: Cumulative payments applied.
        default: 0
      - name: total_refunded_cents
        type: integer
        source: computed
        description: Cumulative line_total refunded via upheld authenticity disputes.
        default: 0
      - name: payment_status
        type: enum
        source: system
        description: Payment axis (independent of fulfillment).
        default: UNPAID
        constraints: "one of {UNPAID, PARTIALLY_PAID, PAID}"
      - name: fulfillment_status
        type: enum
        source: system
        description: Fulfillment axis (independent of payment).
        default: PENDING
        constraints: "one of {PENDING, READY, PICKED_UP, SHIPPED}"
      - name: fulfillment_method
        type: enum
        source: system
        description: Chosen release method, set at ready; null until then.
        constraints: "one of {PICKUP, SHIP}"
      - name: storage_start_at
        type: datetime
        source: system
        description: Logical timestamp storage accrual begins (the first hammer for this invoice).

  - name: InvoiceLine
    parent: null
    common_fields: true
    fields:
      - name: invoice_id
        type: string
        source: system
        description: "FK -> Invoice.id; the invoice this line belongs to."
      - name: lot_id
        type: string
        source: system
        description: "FK -> Lot.id; the hammered lot this line charges."
      - name: hammer_price_cents
        type: integer
        source: system
        description: Hammer price copied from the lot at hammer.
      - name: buyers_premium_cents
        type: integer
        source: computed
        description: Tiered buyer's premium on this line's hammer price, rounded to the cent.
      - name: line_total_cents
        type: integer
        source: computed
        description: hammer_price_cents + buyers_premium_cents.
      - name: status
        type: enum
        source: system
        description: Line state. ACTIVE normally; VOID once its authenticity dispute is upheld.
        default: ACTIVE
        constraints: "one of {ACTIVE, VOID}"

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - name: consignment_id
        type: string
        source: system
        description: "FK -> Consignment.id; the consignment whose sold lots this statement settles."
      - name: gross_hammer_cents
        type: integer
        source: computed
        description: Sum of hammer_price_cents over the consignment's lots in sale_status HAMMERED (RESCINDED excluded).
        default: 0
      - name: seller_commission_cents
        type: integer
        source: computed
        description: round_half_up(gross_hammer_cents * Consignment.commission_rate).
        default: 0
      - name: net_payout_cents
        type: integer
        source: computed
        description: gross_hammer_cents - seller_commission_cents.
        default: 0
      - name: lot_count
        type: integer
        source: computed
        description: Number of HAMMERED (non-RESCINDED) lots included.
        default: 0
      - name: status
        type: enum
        source: system
        description: Payout lifecycle state.
        default: DRAFT
        constraints: "one of {DRAFT, APPROVED, PAID}"

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - name: invoice_line_id
        type: string
        source: input
        description: "FK -> InvoiceLine.id; the purchased line whose authenticity is challenged."
      - name: bidder_id
        type: string
        source: system
        description: "FK -> Bidder.id; copied from the line's invoice (the buyer who raised it)."
      - name: reason
        type: string
        source: input
        description: Buyer's stated grounds for the authenticity dispute.
      - name: status
        type: enum
        source: system
        description: Dispute lifecycle state.
        default: OPEN
        constraints: "one of {OPEN, UNDER_REVIEW, UPHELD, REJECTED}"
      - name: resolution_notes
        type: string
        source: system
        description: Appraiser's resolution notes; null until resolved.
      - name: refund_cents
        type: integer
        source: computed
        description: Refund granted when upheld; equals the line's line_total_cents. 0 otherwise.
        default: 0

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Consignment
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, DECLINED]
    transitions:
      - from: SUBMITTED
        to: APPRAISED
        trigger: "POST /consignments/{id}/appraise"
        actor: Appraiser
        preconditions: ["consignment.status == SUBMITTED"]
        side_effects:
          - "set appraised_low_cents, appraised_high_cents, appraisal_notes"
      - from: APPRAISED
        to: ACCEPTED
        trigger: "POST /consignments/{id}/decision {outcome: ACCEPT}"
        actor: AuctionStaff
        preconditions: ["consignment.status == APPRAISED"]
        side_effects: ["consignment becomes eligible to supply Lots"]
      - from: APPRAISED
        to: DECLINED
        trigger: "POST /consignments/{id}/decision {outcome: DECLINE}"
        actor: AuctionStaff
        preconditions: ["consignment.status == APPRAISED"]
        side_effects: []

  - entity: Auction
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /auctions/{id}/open"
        actor: AuctionStaff
        preconditions: ["auction.status == SCHEDULED"]
        side_effects: ["lots in this auction may now be opened for bidding"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /auctions/{id}/close"
        actor: AuctionStaff
        preconditions: ["auction.status == OPEN"]
        side_effects: ["no further lots may be opened in this auction"]

  - entity: Lot
    initial_state: CATALOGED
    terminal_states: [PASSED, RESCINDED]
    transitions:
      - from: CATALOGED
        to: OPEN
        trigger: "POST /lots/{id}/open"
        actor: AuctionStaff
        preconditions:
          - "lot.sale_status == CATALOGED"
          - "the lot's Auction (lot.auction_id) is in status OPEN"   # cross-entity: Lot depends on Auction
        side_effects: ["lot accepts bids"]
      - from: OPEN
        to: HAMMERED
        trigger: "POST /lots/{id}/hammer"
        actor: AuctionStaff
        preconditions:
          - "lot.sale_status == OPEN"
          - "at least one ACTIVE bid exists on the lot (else ERR_NO_BIDS)"
          - "lot.current_high_bid_cents >= lot.reserve_cents (else ERR_RESERVE_NOT_MET)"
        side_effects:
          - "select winner = ACTIVE bid with max amount_cents, tie-break earliest created_at ASC"
          - "winner Bid: ACTIVE -> WINNING"
          - "every other ACTIVE bid on the lot: ACTIVE -> OUTBID"
          - "set lot.hammer_price_cents = winner.amount_cents, lot.winning_bid_id = winner.id"
          - "CASCADE hop2: find-or-create Invoice(bidder=winner.bidder_id, auction=lot.auction_id); on create set storage_start_at = current clock, storage_fee_cents = 0"
          - "CASCADE hop2: create InvoiceLine(invoice, lot) with hammer_price_cents, buyers_premium_cents (calc buyers_premium), line_total_cents"
          - "CASCADE hop3: recompute Invoice hammer_subtotal_cents, premium_subtotal_cents, total_due_cents (calc invoice_total); refresh payment_status; increments Invoice.version by 1"
          - "increments Lot.version by 1"
      - from: OPEN
        to: PASSED
        trigger: "POST /lots/{id}/pass"
        actor: AuctionStaff
        preconditions: ["lot.sale_status == OPEN"]
        side_effects:
          - "unsold / bought-in: every ACTIVE bid on the lot -> OUTBID"
          - "no Invoice or InvoiceLine is created"
      - from: HAMMERED
        to: RESCINDED
        trigger: "system: authenticity dispute upheld (POST /disputes/{id}/resolve {outcome: UPHELD})"
        actor: system
        preconditions: ["lot.sale_status == HAMMERED"]
        side_effects:
          - "lot removed from any Settlement gross recomputation for its consignment"

  - entity: Bid
    initial_state: ACTIVE
    terminal_states: [OUTBID, WINNING, RETRACTED]
    transitions:
      - from: ACTIVE
        to: OUTBID
        trigger: "system: a higher accepted bid supersedes this one, OR the lot is hammered/passed and this is not the winner"
        actor: system
        preconditions: ["bid.status == ACTIVE"]
        side_effects: []
      - from: ACTIVE
        to: WINNING
        trigger: "system: lot hammered and this is the winning bid"
        actor: system
        preconditions: ["bid.status == ACTIVE"]
        side_effects: []
      - from: ACTIVE
        to: RETRACTED
        trigger: "POST /bids/{id}/retract"
        actor: Bidder | AuctionStaff
        preconditions:
          - "bid.status == ACTIVE"
          - "the bid's Lot is still in sale_status OPEN"
        side_effects:
          - "if this bid was current high, recompute lot.current_high_bid_cents / current_high_bid_id over remaining ACTIVE bids (0 / null if none); increments Lot.version by 1"

  - entity: Invoice
    initial_state: PENDING/UNPAID
    terminal_states: []
    transitions:
      # ---- payment axis (independent of fulfillment axis) ----
      - from: "payment: UNPAID | PARTIALLY_PAID"
        to: "payment: PARTIALLY_PAID | PAID"
        trigger: "POST /invoices/{id}/payments {amount_cents}"
        actor: Bidder | AuctionStaff
        preconditions:
          - "amount_cents > 0"
          - "amount_paid_cents + amount_cents <= total_due_cents (else ERR_OVERPAYMENT)"
        side_effects:
          - "amount_paid_cents += amount_cents"
          - "payment_status = PAID if amount_paid_cents == total_due_cents else PARTIALLY_PAID if amount_paid_cents > 0 else UNPAID"
          - "increments Invoice.version by 1"
      # ---- fulfillment axis (independent of payment axis) ----
      - from: "fulfillment: PENDING"
        to: "fulfillment: READY"
        trigger: "POST /invoices/{id}/ready {fulfillment_method, shipping_fee_cents?}"
        actor: AuctionStaff
        preconditions: ["fulfillment_status == PENDING"]
        side_effects:
          - "set fulfillment_method = supplied method"
          - "storage_fee_cents = FINAL storage accrual (calc storage_fee, variant=final) using current clock"
          - "shipping_fee_cents = shipping_fee_cents if method==SHIP else 0"
          - "recompute total_due_cents; refresh payment_status against new total"
          - "increments Invoice.version by 1"
      - from: "fulfillment: READY"
        to: "fulfillment: PICKED_UP | SHIPPED"
        trigger: "POST /invoices/{id}/fulfill"
        actor: AuctionStaff
        preconditions:
          - "fulfillment_status == READY"
          - "payment_status == PAID (else ERR_INVOICE_NOT_PAID)"
        side_effects:
          - "fulfillment_status = PICKED_UP if fulfillment_method==PICKUP else SHIPPED"
          - "increments Invoice.version by 1"

  - entity: Settlement
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /settlements/{id}/approve"
        actor: SettlementOfficer
        preconditions:
          - "settlement.status == DRAFT"
          - "every Invoice that includes a non-VOID line for one of this consignment's HAMMERED lots has payment_status == PAID (else ERR_INVOICES_UNPAID)"   # cross-entity: Settlement depends on Invoice
        side_effects:
          - "recompute gross_hammer_cents, seller_commission_cents, net_payout_cents over HAMMERED (non-RESCINDED) lots (calc settlement_net_payout, variant=final)"
          - "increments Settlement.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /settlements/{id}/pay"
        actor: SettlementOfficer
        preconditions: ["settlement.status == APPROVED"]
        side_effects: ["seller payout disbursed via Consignor.payout_method; increments Settlement.version by 1"]

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [UPHELD, REJECTED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /disputes/{id}/review"
        actor: Appraiser
        preconditions: ["dispute.status == OPEN"]
        side_effects: []
      - from: UNDER_REVIEW
        to: OPEN
        trigger: "POST /disputes/{id}/request-info"
        actor: Appraiser
        preconditions: ["dispute.status == UNDER_REVIEW"]
        side_effects: ["appraiser has requested further provenance; dispute returns to OPEN for the buyer"]
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /disputes/{id}/resolve {outcome: UPHELD}"
        actor: Appraiser
        preconditions: ["dispute.status == UNDER_REVIEW", "the line's InvoiceLine.status == ACTIVE"]
        side_effects:
          - "set dispute.refund_cents = line.line_total_cents, resolution_notes"
          - "CASCADE hop2: InvoiceLine ACTIVE -> VOID"
          - "CASCADE hop2: recompute the line's Invoice: total_refunded_cents += line.line_total_cents; recompute hammer_subtotal/premium_subtotal/total_due over non-VOID lines; refresh payment_status; increments Invoice.version by 1"
          - "CASCADE hop3: the line's Lot HAMMERED -> RESCINDED (increments Lot.version by 1)"
          - "CASCADE hop3: if a DRAFT Settlement exists for that Lot's consignment, recompute gross_hammer_cents/seller_commission_cents/net_payout_cents/lot_count excluding the RESCINDED lot; increments Settlement.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /disputes/{id}/resolve {outcome: REJECTED}"
        actor: Appraiser
        preconditions: ["dispute.status == UNDER_REVIEW"]
        side_effects: ["set resolution_notes; no changes to line/lot/invoice/settlement"]

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: bid-place-stale-lot
    parent_entity: Lot
    write_endpoint: "POST /lots/{id}/bids"
    occ_field: "expected_lot_version"
    description: |
      Placing a bid against a Lot whose version has advanced since the bidder
      last observed it is rejected. A newly accepted bid legitimately supersedes
      the prior high bid and bumps Lot.version; a bidder still carrying the older
      version is working from a stale view of the current high, so the write is
      refused rather than silently applied at an outdated increment baseline.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: buyers_premium
    trigger: "InvoiceLine creation during POST /lots/{id}/hammer"
    algorithm: tiered_pricing
    formula: |
      # marginal (progressive) tiers over the line's hammer price h (cents)
      p  = 0.25 * min(h, 300000)
      p += 0.20 * max(0, min(h, 2000000) - 300000)
      p += 0.15 * max(0, h - 2000000)
      buyers_premium_cents = round_half_up(p)   # rounded once, per line
    input_set: "the single hammered lot's hammer_price_cents"
    constants:
      TIER1_UPPER_CENTS: 300000
      TIER1_RATE: 0.25
      TIER2_UPPER_CENTS: 2000000
      TIER2_RATE: 0.20
      TIER3_RATE: 0.15
    precision: "integer cents, round_half_up applied once to the per-line premium"

  - name: invoice_total
    trigger: "InvoiceLine create/void; POST /invoices/{id}/ready; POST /invoices/{id}/payments"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round each line's buyers_premium to the cent
      # FIRST (done in `buyers_premium`), THEN sum the already-rounded line values.
      hammer_subtotal_cents  = sum(line.hammer_price_cents  for line in invoice.lines if line.status == ACTIVE)
      premium_subtotal_cents = sum(line.buyers_premium_cents for line in invoice.lines if line.status == ACTIVE)
      total_due_cents = hammer_subtotal_cents + premium_subtotal_cents + storage_fee_cents + shipping_fee_cents
    input_set: "InvoiceLines of this invoice with status == ACTIVE (VOID lines excluded)"
    constants: {}
    precision: "integer cents; per-line premiums are pre-rounded, so no rounding occurs in the sum"

  - name: storage_fee
    trigger: "POST /invoices/{id}/ready (final); provisional value at hammer"
    algorithm: threshold
    formula: |
      days_stored = floor((clock_now - storage_start_at) / 86400 seconds)
      chargeable_days = max(0, days_stored - FREE_STORAGE_DAYS)
      storage_fee_cents = chargeable_days * DAILY_STORAGE_CENTS
    input_set: "elapsed full days between storage_start_at and the clock"
    constants:
      FREE_STORAGE_DAYS: 7
      DAILY_STORAGE_CENTS: 500
    precision: "integer cents; exact multiples of DAILY_STORAGE_CENTS"
    variants:
      - name: provisional
        when: "at hammer, when the Invoice/line is first created"
        difference: "storage_fee_cents is fixed at 0 regardless of the clock (grace, item just sold)"
      - name: final
        when: "at POST /invoices/{id}/ready"
        difference: "storage_fee_cents = chargeable_days * DAILY_STORAGE_CENTS using the current clock; days_stored == FREE_STORAGE_DAYS yields 0, day FREE_STORAGE_DAYS+1 yields one day's charge"

  - name: settlement_net_payout
    trigger: "POST /consignments/{id}/settlement (provisional); dispute upheld recompute; POST /settlements/{id}/approve (final)"
    algorithm: aggregation
    formula: |
      gross_hammer_cents = sum(lot.hammer_price_cents
                               for lot in consignment.lots
                               if lot.sale_status == HAMMERED)   # RESCINDED excluded
      seller_commission_cents = round_half_up(gross_hammer_cents * consignment.commission_rate)
      net_payout_cents = gross_hammer_cents - seller_commission_cents
      lot_count = count(lots with sale_status == HAMMERED)
    input_set: "the consignment's lots whose sale_status == HAMMERED at evaluation time"
    constants: {}
    precision: "integer cents; round_half_up on commission only"
    variants:
      - name: provisional
        when: "at settlement creation and on interim recomputes"
        difference: "gross_hammer_cents counts every HAMMERED lot present at that moment, including lots with an OPEN or UNDER_REVIEW authenticity dispute"
      - name: final
        when: "at approval"
        difference: "gross_hammer_cents counts only lots still HAMMERED after any UPHELD dispute rescinded (RESCINDED) its lot, so an upheld dispute lowers the final gross vs the provisional"

  - name: bid_min_increment
    trigger: "POST /lots/{id}/bids (validation of amount_cents)"
    algorithm: threshold
    formula: |
      if lot.current_high_bid_cents == 0:
          min_next_bid = lot.starting_bid_cents
      else:
          c = lot.current_high_bid_cents
          if   c <  10000:   inc = 1000
          elif c <  100000:  inc = 5000
          elif c <  1000000: inc = 10000
          else:              inc = 50000
          min_next_bid = c + inc
      # bid accepted iff amount_cents >= min_next_bid  (>= boundary, not >)
    input_set: "lot.current_high_bid_cents and lot.starting_bid_cents"
    constants:
      BAND1_UPPER_CENTS: 10000
      BAND1_INC_CENTS: 1000
      BAND2_UPPER_CENTS: 100000
      BAND2_INC_CENTS: 5000
      BAND3_UPPER_CENTS: 1000000
      BAND3_INC_CENTS: 10000
      BAND4_INC_CENTS: 50000
    precision: "integer cents"

  - name: winning_bid_determination
    trigger: "POST /lots/{id}/hammer"
    algorithm: chronological
    formula: |
      candidates = [b for b in lot.bids if b.status == ACTIVE]
      winner = argmax(candidates, key = (b.amount_cents, -epoch(b.created_at)))
      # i.e. highest amount_cents; ties broken by earliest created_at ASC.
      # id is NEVER used as a tie-break input.
    input_set: "ACTIVE bids on the lot at hammer time"
    constants: {}
    precision: "n/a"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role is permitted to call this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "required body fields present; types, enum membership, and positivity/range constraints satisfied"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 4
    category: existence
    check: "every path id and body foreign key resolves to an existing resource, validated left-to-right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints referencing a resource"
  - priority: 5
    category: auth
    check: "for entity-backed roles acting on their own resource, X-User-ID equals the resource's owning FK (Bidder owns Bid/Invoice/Dispute via bidder_id; Consignor owns Consignment via consignor_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /lots/{id}/bids, POST /invoices/{id}/payments, POST /disputes, POST /consignments (Consignor)"
  - priority: 6
    category: state
    check: "expected_lot_version equals the Lot's current version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /lots/{id}/bids"
  - priority: 7
    category: state
    check: "target resource is in the correct state for the transition; the lot's Auction is OPEN when opening a lot (ERR_AUCTION_NOT_OPEN); lot is OPEN for bid/hammer/pass (ERR_LOT_NOT_OPEN); consignment is APPRAISED for decision (ERR_CONSIGNMENT_NOT_APPRAISED); consignment is ACCEPTED for lot creation (ERR_CONSIGNMENT_NOT_ACCEPTED); other state mismatches (ERR_INVALID_STATE)"
    error_id: "ERR_LOT_NOT_OPEN | ERR_AUCTION_NOT_OPEN | ERR_CONSIGNMENT_NOT_APPRAISED | ERR_CONSIGNMENT_NOT_ACCEPTED | ERR_INVALID_STATE"
    http_status: 409
    applies_to: "all state-changing endpoints"
  - priority: 8
    category: business_constraint
    check: "paddle_number is unique across bidders"
    error_id: ERR_DUPLICATE_PADDLE
    http_status: 409
    applies_to: "POST /bidders"
  - priority: 9
    category: business_referential
    check: "the placing Bidder is in status ACTIVE (not SUSPENDED)"
    error_id: ERR_BIDDER_SUSPENDED
    http_status: 403
    applies_to: "POST /lots/{id}/bids"
  - priority: 10
    category: business_safety
    check: "at hammer, at least one ACTIVE bid exists on the lot"
    error_id: ERR_NO_BIDS
    http_status: 409
    applies_to: "POST /lots/{id}/hammer"
  - priority: 11
    category: business_safety
    check: "at hammer, lot.current_high_bid_cents >= lot.reserve_cents"
    error_id: ERR_RESERVE_NOT_MET
    http_status: 409
    applies_to: "POST /lots/{id}/hammer"
  - priority: 12
    category: business_constraint
    check: "bid amount_cents >= the lot's next minimum bid (calc bid_min_increment)"
    error_id: ERR_BID_TOO_LOW
    http_status: 409
    applies_to: "POST /lots/{id}/bids"
  - priority: 13
    category: business_constraint
    check: "the InvoiceLine has no existing OPEN or UNDER_REVIEW dispute"
    error_id: ERR_LINE_ALREADY_DISPUTED
    http_status: 409
    applies_to: "POST /disputes"
  - priority: 14
    category: business_temporal
    check: "no other Auction on the same saleroom_id overlaps [scheduled_start, scheduled_end); half-open, back-to-back allowed"
    error_id: ERR_SALEROOM_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /auctions"
  - priority: 15
    category: business_temporal
    check: "no other Consignment for the same consignor_id has an intake window closer than INTAKE_BUFFER_MINUTES; closed intervals plus buffer"
    error_id: ERR_INTAKE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /consignments"
  - priority: 16
    category: business_fiscal
    check: "if amount_cents >= HIGH_VALUE_LOT_CENTS the Bidder.deposit_cents >= MIN_DEPOSIT_FOR_HIGH_VALUE_CENTS"
    error_id: ERR_INSUFFICIENT_DEPOSIT
    http_status: 402
    applies_to: "POST /lots/{id}/bids"
  - priority: 17
    category: business_fiscal
    check: "payment amount does not exceed the remaining balance (amount_paid_cents + amount_cents <= total_due_cents)"
    error_id: ERR_OVERPAYMENT
    http_status: 409
    applies_to: "POST /invoices/{id}/payments"
  - priority: 18
    category: business_fiscal
    check: "invoice payment_status == PAID before fulfillment release"
    error_id: ERR_INVOICE_NOT_PAID
    http_status: 409
    applies_to: "POST /invoices/{id}/fulfill"
  - priority: 19
    category: business_fiscal
    check: "at settlement approval, all invoices covering the consignment's HAMMERED lots are PAID"
    error_id: ERR_INVOICES_UNPAID
    http_status: 409
    applies_to: "POST /settlements/{id}/approve"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [AuctionStaff]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

  - method: POST
    path: "/salerooms"
    description: "Register a saleroom / venue."
    roles: [AuctionStaff]
    code: 201
    input: [name, location, capacity]
    output: Saleroom
    side_effects: []

  - method: POST
    path: "/consignors"
    description: "Register a consignor (seller)."
    roles: [AuctionStaff]
    code: 201
    input: [display_name, email, "payout_method?"]
    output: Consignor
    side_effects: []

  - method: POST
    path: "/bidders"
    description: "Register a bidder (buyer)."
    roles: [AuctionStaff]
    code: 201
    input: [display_name, email, paddle_number, "deposit_cents?"]
    output: Bidder
    side_effects: []

  - method: POST
    path: "/bidders/{id}/suspend"
    description: "Suspend a bidder (blocks bidding)."
    roles: [AuctionStaff]
    code: 200
    input: []
    output: Bidder
    side_effects: ["Bidder.status ACTIVE -> SUSPENDED"]

  - method: POST
    path: "/auctions"
    description: "Create a sale scheduled into a saleroom; enforces saleroom overlap."
    roles: [AuctionStaff]
    code: 201
    input: [title, sale_type, saleroom_id, scheduled_start, scheduled_end]
    output: Auction
    side_effects: ["ERR_SALEROOM_DOUBLE_BOOKED if window collides"]

  - method: POST
    path: "/auctions/{id}/open"
    description: "Open a scheduled sale."
    roles: [AuctionStaff]
    code: 200
    input: []
    output: Auction
    side_effects: ["Auction SCHEDULED -> OPEN"]

  - method: POST
    path: "/auctions/{id}/close"
    description: "Close an open sale."
    roles: [AuctionStaff]
    code: 200
    input: []
    output: Auction
    side_effects: ["Auction OPEN -> CLOSED"]

  - method: GET
    path: "/auctions/{id}"
    description: "Read a single auction."
    roles: [AuctionStaff, Appraiser, SettlementOfficer, Consignor, Bidder]
    code: 200
    input: []
    output: Auction
    side_effects: []

  - method: GET
    path: "/auctions"
    description: "List auctions; filter by saleroom or status (FK reverse-reachability for Auction.saleroom_id)."
    roles: [AuctionStaff, Appraiser, SettlementOfficer, Consignor, Bidder]
    code: 200
    input: ["saleroom_id?", "status?", "limit?", "offset?"]
    output: Auction[]
    side_effects: []

  - method: POST
    path: "/consignments"
    description: "Submit a consignment intake; enforces per-consignor intake-window spacing."
    roles: [AuctionStaff, Consignor]
    code: 201
    input: [consignor_id, commission_rate, estimate_low_cents, estimate_high_cents, intake_window_start, intake_window_end]
    output: Consignment
    side_effects: ["ERR_INTAKE_WINDOW_CONFLICT if a same-consignor window is within buffer"]

  - method: POST
    path: "/consignments/{id}/appraise"
    description: "Appraiser records valuation."
    roles: [Appraiser]
    code: 200
    input: [appraised_low_cents, appraised_high_cents, "appraisal_notes?"]
    output: Consignment
    side_effects: ["Consignment SUBMITTED -> APPRAISED; sets appraised_* fields"]

  - method: POST
    path: "/consignments/{id}/decision"
    description: "Accept or decline an appraised consignment."
    roles: [AuctionStaff]
    code: 200
    input: [outcome]
    output: Consignment
    side_effects: ["Consignment APPRAISED -> ACCEPTED | DECLINED (outcome in {ACCEPT, DECLINE})"]

  - method: GET
    path: "/consignments/{id}"
    description: "Read a single consignment."
    roles: [AuctionStaff, Appraiser, SettlementOfficer, Consignor, Bidder]
    code: 200
    input: []
    output: Consignment
    side_effects: []

  - method: GET
    path: "/consignments"
    description: "List consignments; filter by consignor or status (FK reverse-reachability for Consignment.consignor_id)."
    roles: [AuctionStaff, Appraiser, SettlementOfficer, Consignor, Bidder]
    code: 200
    input: ["consignor_id?", "status?", "limit?", "offset?"]
    output: Consignment[]
    side_effects: []

  - method: POST
    path: "/consignments/{id}/settlement"
    description: "Create the seller-payout statement for a consignment (provisional gross/commission/net)."
    roles: [SettlementOfficer, AuctionStaff]
    code: 201
    input: []
    output: Settlement
    side_effects: ["compute gross_hammer_cents/seller_commission_cents/net_payout_cents/lot_count (calc settlement_net_payout, variant=provisional)"]

  - method: POST
    path: "/lots"
    description: "Catalog a lot from an accepted consignment into a sale (with reserve)."
    roles: [AuctionStaff]
    code: 201
    input: [consignment_id, auction_id, title, category, reserve_cents, starting_bid_cents, estimate_low_cents, estimate_high_cents, lot_number]
    output: Lot
    side_effects: ["requires Consignment.status == ACCEPTED (else ERR_CONSIGNMENT_NOT_ACCEPTED)"]

  - method: POST
    path: "/lots/{id}/open"
    description: "Open a cataloged lot for bidding (requires its auction OPEN)."
    roles: [AuctionStaff]
    code: 200
    input: []
    output: Lot
    side_effects: ["Lot CATALOGED -> OPEN"]

  - method: POST
    path: "/lots/{id}/hammer"
    description: "Hammer the lot: pick winner, record price + premium, cascade an invoice line."
    roles: [AuctionStaff]
    code: 200
    input: []
    output: Lot
    side_effects:
      - "Lot OPEN -> HAMMERED; winner WINNING, others OUTBID"
      - "cascade: find-or-create Invoice, create InvoiceLine, recompute Invoice totals"
      - "increments Lot.version by 1"

  - method: POST
    path: "/lots/{id}/pass"
    description: "Pass / buy-in an unsold lot (reserve not met or no bids)."
    roles: [AuctionStaff]
    code: 200
    input: []
    output: Lot
    side_effects: ["Lot OPEN -> PASSED; ACTIVE bids -> OUTBID"]

  - method: GET
    path: "/lots/{id}"
    description: "Read a single lot (hammer price, current high, version)."
    roles: [AuctionStaff, Appraiser, SettlementOfficer, Consignor, Bidder]
    code: 200
    input: []
    output: Lot
    side_effects: []

  - method: GET
    path: "/lots"
    description: "List lots; filter by consignment, auction, or status (FK reverse-reachability for Lot.consignment_id and Lot.auction_id)."
    roles: [AuctionStaff, Appraiser, SettlementOfficer, Consignor, Bidder]
    code: 200
    input: ["consignment_id?", "auction_id?", "sale_status?", "limit?", "offset?"]
    output: Lot[]
    side_effects: []

  - method: POST
    path: "/lots/{id}/bids"
    description: "Place an absentee/live/online bid; OCC on Lot.version, increment + deposit gating."
    roles: [Bidder]
    code: 201
    input: [bidder_id, bid_type, amount_cents, expected_lot_version]
    output: Bid
    side_effects:
      - "create Bid ACTIVE; supersede prior high (prior high ACTIVE -> OUTBID)"
      - "update lot.current_high_bid_cents / current_high_bid_id"
      - "increments Lot.version by 1"

  - method: POST
    path: "/bids/{id}/retract"
    description: "Retract an active bid before the lot is hammered."
    roles: [Bidder, AuctionStaff]
    code: 200
    input: []
    output: Bid
    side_effects: ["Bid ACTIVE -> RETRACTED; recompute lot high if needed; increments Lot.version by 1 when high changes"]

  - method: GET
    path: "/bids/{id}"
    description: "Read a single bid."
    roles: [AuctionStaff, Appraiser, SettlementOfficer, Consignor, Bidder]
    code: 200
    input: []
    output: Bid
    side_effects: []

  - method: GET
    path: "/bids"
    description: "List bids; filter by lot, bidder, or status (FK reverse-reachability for Bid.lot_id and Bid.bidder_id)."
    roles: [AuctionStaff, Appraiser, SettlementOfficer, Consignor, Bidder]
    code: 200
    input: ["lot_id?", "bidder_id?", "status?", "limit?", "offset?"]
    output: Bid[]
    side_effects: []

  - method: POST
    path: "/invoices/{id}/payments"
    description: "Apply a payment to an invoice (payment axis)."
    roles: [Bidder, AuctionStaff]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["amount_paid_cents += amount_cents; recompute payment_status; increments Invoice.version by 1"]

  - method: POST
    path: "/invoices/{id}/ready"
    description: "Mark invoice ready for release; finalize storage fee and shipping (fulfillment axis)."
    roles: [AuctionStaff]
    code: 200
    input: [fulfillment_method, "shipping_fee_cents?"]
    output: Invoice
    side_effects: ["fulfillment PENDING -> READY; storage_fee_cents = final accrual; recompute total_due; increments Invoice.version by 1"]

  - method: POST
    path: "/invoices/{id}/fulfill"
    description: "Release the goods (pickup or ship); requires PAID."
    roles: [AuctionStaff]
    code: 200
    input: []
    output: Invoice
    side_effects: ["fulfillment READY -> PICKED_UP | SHIPPED; increments Invoice.version by 1"]

  - method: GET
    path: "/invoices/{id}"
    description: "Read a single invoice (totals, both status axes, version)."
    roles: [AuctionStaff, Appraiser, SettlementOfficer, Consignor, Bidder]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/invoices"
    description: "List invoices; filter by bidder, auction, or payment_status (FK reverse-reachability for Invoice.bidder_id and Invoice.auction_id)."
    roles: [AuctionStaff, Appraiser, SettlementOfficer, Consignor, Bidder]
    code: 200
    input: ["bidder_id?", "auction_id?", "payment_status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: GET
    path: "/invoice-lines/{id}"
    description: "Read a single invoice line."
    roles: [AuctionStaff, Appraiser, SettlementOfficer, Consignor, Bidder]
    code: 200
    input: []
    output: InvoiceLine
    side_effects: []

  - method: GET
    path: "/invoice-lines"
    description: "List invoice lines; filter by invoice or lot (FK reverse-reachability for InvoiceLine.invoice_id and InvoiceLine.lot_id)."
    roles: [AuctionStaff, Appraiser, SettlementOfficer, Consignor, Bidder]
    code: 200
    input: ["invoice_id?", "lot_id?", "limit?", "offset?"]
    output: InvoiceLine[]
    side_effects: []

  - method: POST
    path: "/settlements/{id}/approve"
    description: "Approve a draft settlement; recompute final gross/net; requires related invoices PAID."
    roles: [SettlementOfficer]
    code: 200
    input: []
    output: Settlement
    side_effects: ["Settlement DRAFT -> APPROVED; recompute final gross/commission/net; increments Settlement.version by 1"]

  - method: POST
    path: "/settlements/{id}/pay"
    description: "Disburse an approved settlement to the seller."
    roles: [SettlementOfficer]
    code: 200
    input: []
    output: Settlement
    side_effects: ["Settlement APPROVED -> PAID; increments Settlement.version by 1"]

  - method: GET
    path: "/settlements/{id}"
    description: "Read a single settlement."
    roles: [AuctionStaff, Appraiser, SettlementOfficer, Consignor, Bidder]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: GET
    path: "/settlements"
    description: "List settlements; filter by consignment or status (FK reverse-reachability for Settlement.consignment_id)."
    roles: [AuctionStaff, Appraiser, SettlementOfficer, Consignor, Bidder]
    code: 200
    input: ["consignment_id?", "status?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []

  - method: POST
    path: "/disputes"
    description: "Buyer raises an authenticity dispute against a purchased line."
    roles: [Bidder]
    code: 201
    input: [invoice_line_id, reason]
    output: Dispute
    side_effects: ["create Dispute OPEN; copies bidder_id from the line's invoice; ERR_LINE_ALREADY_DISPUTED if an open/under-review dispute exists"]

  - method: POST
    path: "/disputes/{id}/review"
    description: "Appraiser starts reviewing a dispute."
    roles: [Appraiser]
    code: 200
    input: []
    output: Dispute
    side_effects: ["Dispute OPEN -> UNDER_REVIEW"]

  - method: POST
    path: "/disputes/{id}/request-info"
    description: "Appraiser bounces a dispute back for more provenance (cycle)."
    roles: [Appraiser]
    code: 200
    input: ["note?"]
    output: Dispute
    side_effects: ["Dispute UNDER_REVIEW -> OPEN"]

  - method: POST
    path: "/disputes/{id}/resolve"
    description: "Uphold or reject a dispute; uphold cascades a void/refund/rescind/settlement recompute."
    roles: [Appraiser]
    code: 200
    input: [outcome, "resolution_notes?"]
    output: Dispute
    side_effects:
      - "UPHELD: refund line, VOID line, recompute invoice, RESCIND lot, recompute any DRAFT settlement"
      - "REJECTED: close with no ledger effect"

  - method: GET
    path: "/disputes/{id}"
    description: "Read a single dispute."
    roles: [AuctionStaff, Appraiser, SettlementOfficer, Consignor, Bidder]
    code: 200
    input: []
    output: Dispute
    side_effects: []

  - method: GET
    path: "/disputes"
    description: "List disputes; filter by invoice line, bidder, or status (FK reverse-reachability for Dispute.invoice_line_id and Dispute.bidder_id)."
    roles: [AuctionStaff, Appraiser, SettlementOfficer, Consignor, Bidder]
    code: 200
    input: ["invoice_line_id?", "bidder_id?", "status?", "limit?", "offset?"]
    output: Dispute[]
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or unrecognized X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role not permitted for the endpoint"
  - id: ERR_VALIDATION
    http: 400
    condition: "missing required field, bad type, invalid enum, or out-of-range value"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity-backed actor does not own the targeted resource"
  - id: ERR_SALEROOM_NOT_FOUND
    http: 404
    condition: "saleroom_id does not resolve"
  - id: ERR_CONSIGNOR_NOT_FOUND
    http: 404
    condition: "consignor_id does not resolve"
  - id: ERR_BIDDER_NOT_FOUND
    http: 404
    condition: "bidder id / bidder_id does not resolve"
  - id: ERR_AUCTION_NOT_FOUND
    http: 404
    condition: "auction id / auction_id does not resolve"
  - id: ERR_CONSIGNMENT_NOT_FOUND
    http: 404
    condition: "consignment id / consignment_id does not resolve"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "lot id / lot_id does not resolve"
  - id: ERR_BID_NOT_FOUND
    http: 404
    condition: "bid id does not resolve"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "invoice id does not resolve"
  - id: ERR_INVOICE_LINE_NOT_FOUND
    http: 404
    condition: "invoice_line_id does not resolve"
  - id: ERR_SETTLEMENT_NOT_FOUND
    http: 404
    condition: "settlement id does not resolve"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "dispute id does not resolve"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_lot_version does not match the Lot's current version (OCC)"
  - id: ERR_DUPLICATE_PADDLE
    http: 409
    condition: "paddle_number already registered to another bidder"
  - id: ERR_AUCTION_NOT_OPEN
    http: 409
    condition: "opening a lot whose auction is not OPEN"
  - id: ERR_LOT_NOT_OPEN
    http: 409
    condition: "bid/hammer/pass on a lot not in OPEN"
  - id: ERR_CONSIGNMENT_NOT_ACCEPTED
    http: 409
    condition: "cataloging a lot from a consignment not in ACCEPTED"
  - id: ERR_CONSIGNMENT_NOT_APPRAISED
    http: 409
    condition: "decision on a consignment not in APPRAISED"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "transition not permitted from the resource's current state (settlement, dispute, invoice fulfillment, bid retract, etc.)"
  - id: ERR_BIDDER_SUSPENDED
    http: 403
    condition: "a SUSPENDED bidder attempts to bid"
  - id: ERR_INSUFFICIENT_DEPOSIT
    http: 402
    condition: "high-value bid without the required deposit on file"
  - id: ERR_BID_TOO_LOW
    http: 409
    condition: "bid amount below the lot's next minimum bid"
  - id: ERR_RESERVE_NOT_MET
    http: 409
