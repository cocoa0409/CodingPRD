  - method: POST
    path: "/api/v1/shelter-operations/{id}/open"
    description: "Open the shelter; requires an APPROVED site with a current passing inspection and staffing_sufficiency >= 0.60"
    roles: [NationalHQAdmin, RegionalCoordinator]
    code: 200
    input: []
    output: ShelterOperation
    side_effects: ["opened_at stamped from the logical clock; posture=OPEN", "operation_open_shelter_count recomputed", "increments ShelterOperation.version by 1"]
  - method: POST
    path: "/api/v1/shelter-operations/{id}/close"
    description: "Close the shelter: OPEN/RESTRICTED -> CONSOLIDATING while clients remain, CONSOLIDATING -> CLOSED when registered_client_count is 0"
    roles: [NationalHQAdmin, RegionalCoordinator]
    code: 200
    input: []
    output: ShelterOperation
    side_effects: ["on CLOSED: CASCADE (depth 3) recalls every ARRIVED/ON_SHIFT deployment of this shelter, moves each affected Volunteer to deployment_availability=AVAILABLE, and recomputes region_volunteer_counts for each affected home region", "operation_open_shelter_count recomputed", "increments ShelterOperation.version by 1"]
  - method: POST
    path: "/api/v1/volunteer-deployments"
    description: "Request a volunteer deployment for a rotation"
    roles: [NationalHQAdmin, RegionalCoordinator]
    code: 201
    input: [volunteer_id, disaster_relief_operation_id, "shelter_operation_id?", role_code, travel_mode, rotation_start_at, rotation_days]
    output: VolunteerDeployment
    side_effects: ["status=REQUESTED, travel_cost_cents=0"]
  - method: POST
    path: "/api/v1/volunteer-deployments/{id}/approve"
    description: "Approve a requested deployment, price its travel and reserve the volunteer"
    roles: [NationalHQAdmin, RegionalCoordinator]
    code: 200
    input: []
    output: VolunteerDeployment
    side_effects: ["travel_cost_estimate computed into travel_cost_cents", "Volunteer.deployment_availability=DEPLOYED", "region_volunteer_counts recomputed for the volunteer's home region", "status=APPROVED", "increments VolunteerDeployment.version by 1"]
  - method: POST
    path: "/api/v1/volunteer-deployments/{id}/end-rotation"
    description: "End a rotation that is ON_SHIFT"
    roles: [Volunteer]
    code: 200
    input: []
    output: VolunteerDeployment
    side_effects: ["status=ROTATION_ENDED", "Volunteer.deployment_availability=RESTING and Volunteer.rotation_days_used_ytd += rotation_days", "staffing_sufficiency recomputed for the shelter", "increments VolunteerDeployment.version by 1"]
  - method: POST
    path: "/api/v1/volunteer-deployments/{id}/recall"
    description: "Recall a non-terminal deployment; REQUESTED recalls cancel instead"
    roles: [NationalHQAdmin, RegionalCoordinator]
    code: 200
    input: []
    output: VolunteerDeployment
    side_effects: ["status=RECALLED (or CANCELLED when the deployment was still REQUESTED)", "Volunteer.deployment_availability=AVAILABLE", "every non-terminal ShiftAssignment of the deployment moves to CANCELLED", "staffing_sufficiency recomputed for the shelter", "increments VolunteerDeployment.version by 1"]
  - method: POST
    path: "/api/v1/shift-assignments"
