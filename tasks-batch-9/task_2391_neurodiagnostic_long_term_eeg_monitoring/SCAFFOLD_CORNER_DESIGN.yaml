        distinguishing_aspect: "After the clock is set to 2026-08-02T00:00:00Z, a request to move it back to 2026-08-01T00:00:00Z is rejected 422 ERR_CLOCK_MONOTONIC and the clock is unchanged — proved by a subsequent write stamping created_at 2026-08-02T00:00:00Z."
        test_recipe:
          setup:
            - "A unit exists; the logical clock has been advanced from its 2026-08-01T00:00:00Z default to 2026-08-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /neurodiagnostics/units"
              payload: { name: "EMU Val Unit", bed_count: 1, storage_quota_gb: 500.00 }
