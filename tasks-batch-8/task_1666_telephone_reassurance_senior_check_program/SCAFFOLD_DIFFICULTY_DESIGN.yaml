            - { call: "POST /api/call-assignments/${a4}/call-logs", payload: { called_at: "2026-08-04T10:05:00Z", duration_seconds: 0, outcome: "NO_ANSWER" }, as: VolunteerCaller, as_user_id: "${v_id}", captures: { log_trig: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T11:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/call-assignments/${a5}/call-logs", payload: { called_at: "2026-08-05T09:05:00Z", duration_seconds: 0, outcome: "NO_ANSWER" }, as: VolunteerCaller, as_user_id: "${v_id}" }
            - { call: "POST /api/call-assignments/${a6}/call-logs", payload: { called_at: "2026-08-05T10:05:00Z", duration_seconds: 240, outcome: "REACHED_CONCERN", concern_level: "ROUTINE", concern_categories: ["NUTRITION"] }, as: VolunteerCaller, as_user_id: "${v_id}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/call-assignments/${a7}/call-logs", payload: { called_at: "2026-08-06T09:05:00Z", duration_seconds: 240, outcome: "REACHED_CONCERN", concern_level: "ROUTINE", concern_categories: ["HEALTH"] }, as: VolunteerCaller, as_user_id: "${v_id}" }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/programs/${prog_id}/daily-closeout", payload: {}, as: ProgramCoordinator }
            - { call: "GET /api/participants/${p_id}", payload: {}, as: ProgramCoordinator }
          assert:
            - "Participant.${p_id}.acuity_score == 55 and .acuity_tier == MODERATE (intake variant, static)"
            - "Participant.${p_id}.rolling_acuity_score == 68.5 and .rolling_acuity_tier == HIGH (0.7*55 + 0.3*min(100, 3*15+4*10+1*25) = 68.5)"
            - "Participant.${p_id}.effective_acuity_tier == HIGH (more severe of MODERATE intake and HIGH rolling)"
            - "The trailing window contained exactly 3 concern-flagged logs, 4 no-answer-family logs, 1 escalation — identical rows yield 55 under intake vs 68.5 under rolling"

