              as: CredentialingSpecialist
              as_user_id: "cs-1"
            - call: "POST /credential-items/${it_imm}/transition"
              payload: { to: "VERIFIED" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
            - call: "POST /credential-items/${it_bgc}/transition"
              payload: { to: "VERIFIED" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
            - call: "POST /credential-items/${it_drg}/transition"
              payload: { to: "VERIFIED" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
            - call: "POST /credential-items/${it_lvf}/transition"
