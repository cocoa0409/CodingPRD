            - "after finalize: RentalContract.${rc7}.billing_status == 'PAUSED_NON_COMPLIANCE'   # hop 2->3"
            - "after finalize: MASK plan_status == 'SUSPENDED_NON_COMPLIANCE' (${plan7_post})   # hop 2->3 (parallel child)"

      - name: retrieval_reconcile_to_patient_discontinued_depth2
        grounds:
          - state_machines.RetrievalCase.RECEIVED_to_RECONCILED
          - state_machines.Patient.DISCONTINUING_to_DISCONTINUED
          - state_machines.RentalContract
          - state_machines.DeviceEnrollment
        distinguishing_aspect: |
          Trigger = RetrievalCase reconcile (depth 2+). Hop1: reconcile flips
          RetrievalCase RECEIVED -> RECONCILED. Hop2: that RetrievalCase
          mutation itself triggers Patient DISCONTINUING -> DISCONTINUED, which
          in turn cascades ComponentSupplyPlans -> CLOSED and RentalContract
