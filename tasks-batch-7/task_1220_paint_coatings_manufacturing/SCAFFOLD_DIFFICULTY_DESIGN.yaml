            - { call: "POST /coatings/batches", payload: { formula_id: "${f2}", mill_id: "${m1}", planned_gallons: 50, mill_window_start: "2026-06-10T14:30:00Z", mill_window_end: "2026-06-10T16:00:00Z" }, as: ProductionOperator, captures: { bd: $.data.id } }
          assert:
