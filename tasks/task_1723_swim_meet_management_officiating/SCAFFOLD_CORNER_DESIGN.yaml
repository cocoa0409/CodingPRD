  - section: validations
    instances:
      - name: seed_blocked_undecided_qualification
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_QUALIFICATION_UNDECIDED]"]
        distinguishing_aspect: "Seed with even one UNVERIFIED entry present is rejected with ERR_QUALIFICATION_UNDECIDED; the OCC version is correct so the qualification gate (not staleness) fires."
        test_recipe:
          setup: ["meet ENTRIES_CLOSED; one entry verified, one still UNVERIFIED"]
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "VQ1", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
