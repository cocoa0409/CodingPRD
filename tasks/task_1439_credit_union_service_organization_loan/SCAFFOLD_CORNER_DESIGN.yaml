            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-BUY", legal_name: "Buyer CU", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool A", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-12-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
          trigger:
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 20000000 }, as: BuyerUser, as_user_id: "${buyer_id}" }
          assert:
            - "GET /network/offerings/${off_id} committed_principal_cents == 20000000 and remaining_principal_cents == 80000000"

