              payload: { recording_ref: "BK1420-PG318" }
              as: PortfolioManager
              as_user_id: "pm-bob"
          trigger:
            - call: "POST /lease-buyouts/lease-streams/${ls_id}/amendment-events"
              payload: { event_type: "COLOCATION_ADDED", gross_amount_cents: 1000002, effective_date: "2026-09-01" }
