    roles: [EmergencyManager]
    code: 200
    input: []
    output: EmergencyEvent
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/medicine-relief/emergency-events/{event_id}/close"
    description: "Close a STAND_DOWN event"
    roles: [EmergencyManager]
    code: 200
    input: []
    output: EmergencyEvent
    side_effects: ["status -> CLOSED"]

  # --- PrepositionedModule ---
  - method: POST
    path: "/medicine-relief/prepositioned-modules"
    description: "Register a pre-positioned module"
    roles: [EmergencyManager, PlatformAdmin]
    code: 201
    input: [module_code, intended_use, holding_country_code]
    output: PrepositionedModule
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/medicine-relief/prepositioned-modules/{module_id}"
    description: "Get a module"
    roles: [EmergencyManager, PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: PrepositionedModule
    side_effects: []

  - method: GET
    path: "/medicine-relief/prepositioned-modules"
    description: "List modules (paginated, filterable)"
    roles: [EmergencyManager, PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["status?", "intended_use?", "holding_country_code?", "reserved_for_event_id?", "limit?", "offset?"]
    output: PrepositionedModule[]
