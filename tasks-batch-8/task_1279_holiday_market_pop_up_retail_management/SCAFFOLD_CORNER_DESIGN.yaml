              payload: { legal_name: "IV", contact_email: "iv@x.com", category: "CRAFT" }
              as: MarketOperator
              captures: { iv_id: $.data.id }
            - call: "POST /markets/${im_id}/booths"
              payload: { booth_code: "ST-IM", booth_type: "STANDARD", zone: "NORTH", square_feet: 80 }
              as: MarketOperator
              captures: { ib_id: $.data.id }
            - call: "POST /markets/${im_id}/applications"
              payload: { vendor_id: "${iv_id}", requested_booth_type: "STANDARD" }
              as: VendorRole
              as_user_id: "${iv_id}"
              captures: { ia_id: $.data.id }
            - call: "POST /markets/${im_id}/applications/${ia_id}/submit"
              payload: {}
              as: VendorRole
              as_user_id: "${iv_id}"
            - call: "POST /markets/${im_id}/applications/${ia_id}/score"
              payload: { score_0_100: 80 }
              as: JuryMember
            - call: "POST /markets/${im_id}/applications/${ia_id}/score"
              payload: { score_0_100: 80 }
              as: JuryMember
            - call: "POST /markets/${im_id}/applications/${ia_id}/score"
              payload: { score_0_100: 80 }
              as: JuryMember
            - call: "GET /markets/${im_id}/applications/${ia_id}"
              as: JuryChair
              captures: { ia_ver: $.data.version }
            - call: "POST /markets/${im_id}/applications/${ia_id}/decide"
              payload: { decision: "ACCEPTED", expected_application_version: "${ia_ver}" }
              as: JuryChair
            - call: "POST /markets/${im_id}/assignments"
              payload: { booth_id: "${ib_id}", application_id: "${ia_id}" }
              as: MarketOperator
              captures: { iasg_id: $.data.id }
            - call: "POST /markets/${im_id}/assignments/${iasg_id}/activate"
              payload: {}
              as: MarketOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-05T00:00:00Z" }
              as: MarketOperator
            - call: "GET /markets/${im_id}"
              as: MarketOperator
              captures: { im_ver: $.data.version }
            - call: "POST /markets/${im_id}/open_market"
              payload: { expected_market_version: "${im_ver}" }
              as: MarketOperator
            - call: "POST /markets/${im_id}/settlements"
              payload: { assignment_id: "${iasg_id}", business_date: "2026-12-05", gross_card_cents: 50000, gross_cash_cents: 10000 }
              as: VendorRole
              as_user_id: "${iv_id}"
              captures: { is_id: $.data.id }
          trigger:
            - call: "POST /markets/${im_id}/settlements/${is_id}/submit"
              payload: {}
              as: VendorRole
              as_user_id: "${iv_id}"
          assert:
            - "Vendor.${iv_id}.lifetime_gross_sales_cents == 60000 (visible immediately)"
