  # ===========================================================================
  # Rule 6 — boundary_precision_check (two instances, different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: reject_rate_exactly_at_threshold_raises_alert
        grounds:
          - calculations.reject_rate
          - entities.SortBatch.fields.alert_raised
        distinguishing_aspect: |
          Metric: reject_rate_pct (percent, 2-decimal half-up) — endpoint
          POST .../sort-batches/{id}/lock. A rate of exactly 25.00% (1 reject
          of 4 total) triggers alert_raised because the comparison is >=;
          a rate just below (1 of 5 = 20.00%) does not.
        test_recipe:
          setup:
            - "Plant P with reject_rate_alert_pct=25.0"
            - "Category TOWEL; customer C; stop picked up; cart received"
            - "Batch B4: 3 ACCEPTED + 1 REJECTED (4 total → 25.00%)"
            - "Batch B5: 4 ACCEPTED + 1 REJECTED (5 total → 20.00%)"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "P", reject_rate_alert_pct: 25.0, par_shortage_alert_pieces: 5, utility_baseline_kwh_per_lb: 1.0, utility_baseline_gal_per_lb: 2.0 }
              as: PlantAdmin
              captures: { p_id: $.data.id }
            - call: "POST /plants/${p_id}/linen-categories"
              payload: { code: "TOWEL", piece_weight_lb: 0.5, wash_formula_code: "WF_STANDARD", hygienic_test_required: false, replacement_cost_cents: 500, cog_wash_rate_cents_per_lb: 120 }
              as: PlantAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /plants/${p_id}/customers"
              payload: { name: "C", customer_kind: "HOSPITALITY", billing_mode: "COG", chip_tracking_enabled: false, credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { c_id: $.data.id }
            - call: "POST /plants/${p_id}/routes"
              payload: { service_date: "2026-05-02", driver_name: "D1" }
              as: RouteDriver
              captures: { r_id: $.data.id }
            - call: "POST /routes/${r_id}/stops"
              payload: { customer_id: "${c_id}", sequence_index: 1, declared_soiled_weight_lb: 10.0 }
              as: RouteDriver
              captures: { s_id: $.data.id }
            - call: "POST /routes/${r_id}/dispatch"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/arrive"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/pickup"
              payload: { carts: [ { cart_tag: "CART-1", scale_weight_lb: 10.0 } ] }
              as: RouteDriver
            - call: "GET /stops/${s_id}/carts"
              as: PlantOperator
              captures: { cart_id: "$.data[0].id" }
            - call: "POST /carts/${cart_id}/receive"
              payload: {}
              as: PlantOperator
            - call: "POST /sort-batches"
              payload: { stop_id: "${s_id}" }
              as: PlantOperator
              captures: { b4_id: $.data.id }
            - call: "POST /sort-batches/${b4_id}/items"
              payload: { category_id: "${cat_id}", pieces: 3, disposition: "ACCEPTED" }
              as: PlantOperator
            - call: "POST /sort-batches/${b4_id}/items"
              payload: { category_id: "${cat_id}", pieces: 1, disposition: "REJECTED", reject_reason: "STAIN" }
              as: PlantOperator
          trigger:
            - call: "POST /sort-batches/${b4_id}/lock"
              payload: {}
              as: PlantOperator
              captures: { alert_4: $.data.alert_raised, rate_4: $.data.reject_rate_pct }
            - call: "POST /sort-batches"
              payload: { stop_id: "${s_id}" }
              as: PlantOperator
              captures: { b5_id: $.data.id }
            - call: "POST /sort-batches/${b5_id}/items"
              payload: { category_id: "${cat_id}", pieces: 4, disposition: "ACCEPTED" }
              as: PlantOperator
            - call: "POST /sort-batches/${b5_id}/items"
              payload: { category_id: "${cat_id}", pieces: 1, disposition: "REJECTED", reject_reason: "TEAR" }
              as: PlantOperator
            - call: "POST /sort-batches/${b5_id}/lock"
              payload: {}
              as: PlantOperator
              captures: { alert_5: $.data.alert_raised, rate_5: $.data.reject_rate_pct }
          assert:
            - "rate_4 == 25.0"
            - "alert_4 == true"
            - "rate_5 == 20.0"
            - "alert_5 == false"

      - name: par_shortfall_exactly_at_alert_pieces
        grounds:
          - calculations.par_shortfall
          - entities.CustomerParLevel.fields.current_on_site_pieces
        distinguishing_aspect: |
          Metric: par shortfall in whole pieces (different metric from reject
          rate percent) — endpoint POST .../deliveries/{id}/mark-delivered
          (different endpoint from sort lock). With par_shortage_alert_pieces=5,
          a delivery leaving shortfall exactly 5 raises the alert (>=);
          a delivery leaving shortfall 4 does not. Empty-collection edge: a
          customer with no par row for the category raises no alert regardless.
        test_recipe:
          setup:
            - "Plant P with par_shortage_alert_pieces=5"
            - "Category TOWEL; RENTAL customer C with par_pieces=10 for TOWEL, current_on_site_pieces=0"
            - "Stop picked up, carts received"
            - "Delivery D5: pieces_promised=5, delivered=5 → new_on_site=5 → shortfall=5 → alert fires"
            - "Second route/stop for the same customer: par now 10, on_site 5; Delivery D4: promised=1, delivered=1 → on_site=6 → shortfall=4 → no alert"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "P", reject_rate_alert_pct: 25.0, par_shortage_alert_pieces: 5, utility_baseline_kwh_per_lb: 1.0, utility_baseline_gal_per_lb: 2.0 }
              as: PlantAdmin
