            - "check 3 short-circuits: amount's ratio is still 1.2500 (>= the block threshold) yet the status is NOT 'FAIL_SKEW' — the ladder's first matching row wins"
            - "three SkewCheck rows exist for the deployment; checks 2 and 3 each raised one PROPOSED RetrainingTrigger, so Model.${m_id}.open_retraining_trigger_count == 2 while check 1 raised none"

      - name: skew_ratios_are_rounded_to_four_decimals_before_the_ladder_compares_them
