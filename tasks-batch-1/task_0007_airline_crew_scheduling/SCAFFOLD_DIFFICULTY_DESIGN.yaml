  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: flight_leg_overlap_within_pairing_closed_interval
        grounds:
          - validations[priority=14]
          - errors[ERR_LEG_OVERLAP]
          - entities.FlightLeg.fields.scheduled_departure_utc
          - entities.FlightLeg.fields.scheduled_arrival_utc
        distinguishing_aspect: |
          Closed-interval semantics on FlightLeg: two legs of the same Pairing
          with [a.dep, a.arr] and [b.dep, b.arr] conflict iff
          NOT (b.dep > a.arr OR a.dep > b.arr) — touching at a single instant
          (b.dep == a.arr) IS a conflict (closed intervals). Resource entity:
          FlightLeg.
        test_recipe:
          setup:
            - "Pairing P_OVL in DRAFT with one FlightLeg [2026-06-02T01:00, 2026-06-02T07:00]"
            - "Second leg attempted with [2026-06-02T07:00, 2026-06-02T08:00] (touching boundary)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "POST /pairings"
              payload: { pairing_code: "P-2026-140", origin_base: "LAX", scheduled_start_utc: "2026-06-02T00:00:00Z", scheduled_end_utc: "2026-06-02T10:00:00Z", required_captains: 1, required_first_officers: 0, required_cabin_crew: 0, bidding_close_utc: "2026-06-01T12:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { p_id: "$.data.id "}
            - call: "POST /pairings/${p_id}/flight-legs"
              payload: { leg_sequence: 1, departure_airport: "LAX", arrival_airport: "JFK", scheduled_departure_utc: "2026-06-02T01:00:00Z", scheduled_arrival_utc: "2026-06-02T07:00:00Z", leg_type: "REVENUE" }
              as: SchedulingPlanner
              as_user_id: "p1"
          trigger:
            - call: "POST /pairings/${p_id}/flight-legs"
              payload: { leg_sequence: 2, departure_airport: "JFK", arrival_airport: "MIA", scheduled_departure_utc: "2026-06-02T07:00:00Z", scheduled_arrival_utc: "2026-06-02T08:00:00Z", leg_type: "REVENUE" }
              as: SchedulingPlanner
              as_user_id: "p1"
          assert:
            - "Response HTTP status == 422"
            - "Response data.error_id == 'ERR_LEG_OVERLAP' (closed-interval: 07:00 boundary counts as overlap)"

      - name: trip_trade_pairing_overlap_half_open_interval
        grounds:
          - validations[priority=12]
          - errors[ERR_PAIRING_OVERLAP]
          - state_machines.TripTrade.transitions.COUNTERSIGNED_to_APPROVED
        distinguishing_aspect: |
          Half-open interval semantics on Pairing duty windows during trade
          approve: [start, end) — when a swap-target pairing's start equals
          the recipient's already-confirmed pairing's end, it is NOT a
          conflict (back-to-back permitted); when start < end of recipient's
          confirmed pairing, it IS a conflict. Distinct from instance 1's
          closed-interval FlightLeg semantics, and on a different resource
          entity (Pairing).
