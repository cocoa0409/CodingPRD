            - {call: "POST /water-rights", payload: {claimant_id: "00000000-0000-0000-0000-0000000000bb", right_number: "WR-2198-999", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {e5: "$.data.error_id"}}
          assert:
            - "Call 1: 404 with error_id ERR_WATER_RIGHT_NOT_FOUND; response_type == \"error\"; data.message non-blank."
            - "Call 2: 404 with error_id ERR_CLAIMANT_NOT_FOUND."
            - "Call 3: 404 with error_id ERR_POINT_OF_DIVERSION_NOT_FOUND."
            - "Call 4: 404 with error_id ERR_HCU_STUDY_NOT_FOUND."
            - "Call 5: 404 with error_id ERR_CLAIMANT_NOT_FOUND (body foreign key, validations priority 7) and NO WaterRight row is created — GET /water-rights returns total_count 1."

