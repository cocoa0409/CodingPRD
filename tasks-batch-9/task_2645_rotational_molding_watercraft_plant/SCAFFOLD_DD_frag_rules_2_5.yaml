            - "The single hull HULL-RWK is trimmed (0.400) and outfitted with HK-RWK-0001, so it sits in build_status OUTFITTED / logistics_status UNALLOCATED with rework_count 0 and inspection_verdict PENDING, and PO-RWK is IN_PRODUCTION with completed_qty 0."
