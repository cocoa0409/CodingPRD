  # ===========================================================================
  # Rule 8 - resource temporal overlap (different interval semantics, different resources)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: diet_order_half_open_windows_allow_touching_endpoints_on_same_inmate
        grounds:
          - calculations.diet_order_coverage_window
          - validations[priority=38]
          - errors.ERR_DIET_ORDER_WINDOW_CONFLICT
          - endpoints[POST /cfs/diet-orders]
        distinguishing_aspect: |
          The contended resource is the Inmate's religious-diet coverage timeline and the interval
          semantics are HALF-OPEN [effective_from, effective_to): an incumbent ending exactly at
          2026-08-10T00:00:00Z and a successor starting exactly at that instant are adjacent, not
          overlapping, so both may exist. Backing the successor up by a single second creates a
          one-second intersection and is rejected. An implementation using closed intervals rejects
          the adjacent order; one using strict date-granularity comparison accepts the
          one-second overlap.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "ServiceContract CFS-2515-RT1 ACTIVE with Facility FAC-RT1."
            - "One IN_CUSTODY Inmate BK-0001 with religious_affiliation JEWISH."
            - "Incumbent DietOrder: RELIGIOUS / KOSHER, window 2026-08-01T00:00:00Z to 2026-08-10T00:00:00Z, verified by ch-001 so status is ACTIVE."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/service-contracts"
              payload: { contract_code: "CFS-2515-RT1", vendor_name: "Aramark Correctional Services", contracted_kcal_per_meal_day: 2800, contracted_protein_grams_per_meal_day: 55.0, contracted_sodium_mg_cap_per_meal_day: 2400, cost_ceiling_cents_per_meal_day: 320, ld_cents_per_missed_meal: 750, ld_monthly_cap_cents: 5000000, substitution_allowance_pct: 0.30 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { contract_id: $.data.id }
            - call: "POST /cfs/facilities"
              payload: { contract_id: "${contract_id}", facility_code: "FAC-RT1", name: "North Unit Kitchen", sharps_authorized_count: 12, satellite_site_count: 0, blast_chiller_capacity: 2 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { facility_id: $.data.id }
            - call: "POST /cfs/service-contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/inmates"
              payload: { facility_id: "${facility_id}", booking_number: "BK-0001", housing_unit: "GENERAL", religious_affiliation: "JEWISH" }
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { inmate_id: $.data.id, inmate_v1: $.data.version }
            - call: "POST /cfs/diet-orders"
              payload: { inmate_id: "${inmate_id}", order_type: "RELIGIOUS", diet_code: "KOSHER", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-10T00:00:00Z", expected_inmate_version: "${inmate_v1}" }
              as: RegisteredDietitian
              as_user_id: "rd-001"
              captures: { order_1: $.data.id }
            - call: "POST /cfs/diet-orders/${order_1}/verify"
              payload: { verification_note: "Chaplain interview completed" }
              as: ChaplainDesignee
              as_user_id: "ch-001"
              captures: { order_1_status: $.data.status }
            - call: "GET /cfs/inmates/${inmate_id}"
              payload: {}
              as: RegisteredDietitian
              as_user_id: "rd-001"
              captures: { inmate_v2: $.data.version }
          trigger:
            - call: "POST /cfs/diet-orders"
              payload: { inmate_id: "${inmate_id}", order_type: "RELIGIOUS", diet_code: "KOSHER", effective_from: "2026-08-10T00:00:00Z", effective_to: "2026-08-20T00:00:00Z", expected_inmate_version: "${inmate_v2}" }
              as: RegisteredDietitian
              as_user_id: "rd-001"
              captures: { order_2: $.data.id, order_2_status: $.data.status }
            - call: "GET /cfs/inmates/${inmate_id}"
              payload: {}
              as: RegisteredDietitian
              as_user_id: "rd-001"
              captures: { inmate_v3: $.data.version }
            - call: "POST /cfs/diet-orders"
              payload: { inmate_id: "${inmate_id}", order_type: "RELIGIOUS", diet_code: "KOSHER", effective_from: "2026-08-09T23:59:59Z", effective_to: "2026-08-20T00:00:00Z", expected_inmate_version: "${inmate_v3}" }
              as: RegisteredDietitian
              as_user_id: "rd-001"
              captures: { overlap_error: $.data.error_id }
          assert:
            - "${order_1_status} == ACTIVE with verified_by_user_id == 'ch-001' and verification_expires_at == 2027-01-28T00:00:00Z (180 religious validity days from 2026-08-01)"
            - "${order_2_status} == PENDING_VERIFICATION - the adjacent window starting exactly at the incumbent's exclusive end instant is accepted"
            - "DietOrder.${order_2}.effective_from == 2026-08-10T00:00:00Z and DietOrder.${order_1}.effective_to == 2026-08-10T00:00:00Z"
            - "${overlap_error} == ERR_DIET_ORDER_WINDOW_CONFLICT with HTTP 409 for the order backed up one second to 2026-08-09T23:59:59Z"
            - "Exactly two DietOrder rows exist for Inmate.${inmate_id} after the trigger"
            - "Inmate.${inmate_id}.version == ${inmate_v3} (the rejected create did not bump the OCC parent version)"
            - "Inmate.${inmate_id}.active_diet_order_count == 1 and Facility.${facility_id}.active_special_diet_count == 1"

      - name: blast_chiller_closed_interval_overlaps_at_the_shared_release_instant
        grounds:
          - calculations.blast_chiller_occupancy
          - validations[priority=40]
          - errors.ERR_CHILLER_CAPACITY_EXCEEDED
          - entities.ProductionBatch.fields.buffered_release_at
        distinguishing_aspect: |
          A different resource (the Facility's blast-chiller slots, an aggregate capacity of 2 rather
          than a per-row uniqueness) with the opposite interval semantics: occupancy intervals are
          CLOSED [scheduled_cook_start_at, buffered_release_at], so a batch starting exactly at an
          existing batch's release instant DOES overlap it. A third batch starting at exactly
          2026-08-01T12:30:00Z touches batch A's release instant and still overlaps batch B, giving
          occupancy 2 and a rejection; one second later it touches nothing of A and is accepted.
          This is the deliberate inverse of the half-open DietOrder window in the sibling instance.
