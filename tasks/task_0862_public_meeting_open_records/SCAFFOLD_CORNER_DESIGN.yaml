# =============================================================================
# 1.9 Scaffold Corner Design (breadth coverage of non-difficulty claims)
# Public-Meeting & Open-Records Portal
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_public_body_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.PublicBody, endpoints]
        distinguishing_aspect: "POST /public-bodies with all required fields returns 201 and echoes name/seat_count/quorum_size plus system id/created_at/version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /public-bodies"
              payload: { name: "Town Board", jurisdiction_state: "VT", seat_count: 7, quorum_size: 4 }
              as: Clerk
              captures: { body_id: $.data.id }
          assert:
            - "http_status == 201"
            - "PublicBody.${body_id}.seat_count == 7"
            - "PublicBody.${body_id}.quorum_size == 4"
            - "PublicBody.${body_id}.version == 1"

      - name: get_meeting_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]", endpoints]
        distinguishing_aspect: "GET /meetings/{random uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /meetings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "http_status == 404"

      - name: create_records_request_missing_required_returns_validation
        claim_type: Required Fields
        grounds: [entities.RecordsRequest.fields.subject, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /records-requests omitting subject is rejected with ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Requester r1 and body b exist."]
          setup_api_calls:
            - call: "POST /requesters"
              payload: { full_name: "Ann", email: "ann@example.com" }
              as: Anonymous
              captures: { r1_id: $.data.id }
            - call: "POST /public-bodies"
              payload: { name: "Body Z", jurisdiction_state: "ME", seat_count: 5, quorum_size: 2 }
              as: Clerk
              captures: { body_id: $.data.id }
          trigger:
            - call: "POST /records-requests"
              payload: { requester_id: "${r1_id}", body_id: "${body_id}", description: "no subject", estimated_page_count: 0 }
              as: Requester
              as_user_id: "${r1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: agenda_item_defaults_applied
        claim_type: Defaults
        grounds: [entities.AgendaItem.fields.item_type, entities.AgendaItem.fields.public_comment_enabled]
        distinguishing_aspect: "Creating an agenda item without item_type/public_comment_enabled applies defaults DISCUSSION and true."
        test_recipe:
          setup: ["EMERGENCY meeting exists (SCHEDULED)."]
          setup_api_calls:
            - call: "POST /public-bodies"
              payload: { name: "Body Y", jurisdiction_state: "NH", seat_count: 5, quorum_size: 2 }
              as: Clerk
              captures: { body_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/venues"
              payload: { name: "Room Y" }
              as: Clerk
              captures: { venue_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M1", seat_number: 1 }
              as: Clerk
              captures: { m1_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/meetings"
              payload: { venue_id: "${venue_id}", presiding_member_id: "${m1_id}", title: "Y", meeting_type: "EMERGENCY", scheduled_start: "2026-05-01T02:00:00Z", scheduled_end: "2026-05-01T03:00:00Z" }
              as: Clerk
              captures: { meeting_id: $.data.id }
          trigger:
            - call: "POST /meetings/${meeting_id}/agenda-items"
              payload: { title: "Default item", sequence: 1 }
              as: Clerk
              captures: { item_id: $.data.id }
          assert:
            - "AgendaItem.${item_id}.item_type == DISCUSSION"
            - "AgendaItem.${item_id}.public_comment_enabled == true"

      - name: records_request_response_deadline_business_days
        claim_type: Computed Fields
        grounds: [calculations.response_deadline, entities.RecordsRequest.fields.response_deadline]
        distinguishing_aspect: "Request submitted 2026-06-01T09:00:00Z (Monday) gets response_deadline 2026-06-15T23:59:59Z = 10 business days later (weekends skipped)."
        test_recipe:
          setup: ["Clock set to 2026-06-01T09:00:00Z; requester and body exist."]
          setup_api_calls:
            - call: "POST /requesters"
              payload: { full_name: "Bea", email: "bea@example.com" }
              as: Anonymous
              captures: { r1_id: $.data.id }
            - call: "POST /public-bodies"
              payload: { name: "Body X", jurisdiction_state: "RI", seat_count: 5, quorum_size: 2 }
              as: Clerk
              captures: { body_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Clerk
          trigger:
            - call: "POST /records-requests"
              payload: { requester_id: "${r1_id}", body_id: "${body_id}", subject: "Deadline", description: "x", estimated_page_count: 0 }
              as: Requester
              as_user_id: "${r1_id}"
              captures: { req_id: $.data.id }
          assert:
            - "RecordsRequest.${req_id}.response_deadline == 2026-06-15T23:59:59Z"

      - name: meeting_end_before_start_rejected
        claim_type: Type Constraints
        grounds: [entities.Meeting.fields.scheduled_end, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Scheduling a meeting with scheduled_end <= scheduled_start is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["Body, venue, member exist."]
          setup_api_calls:
            - call: "POST /public-bodies"
              payload: { name: "Body W", jurisdiction_state: "KY", seat_count: 5, quorum_size: 2 }
              as: Clerk
              captures: { body_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/venues"
              payload: { name: "Room W" }
              as: Clerk
              captures: { venue_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M1", seat_number: 1 }
              as: Clerk
              captures: { m1_id: $.data.id }
          trigger:
            - call: "POST /public-bodies/${body_id}/meetings"
              payload: { venue_id: "${venue_id}", presiding_member_id: "${m1_id}", title: "Bad", meeting_type: "REGULAR", scheduled_start: "2026-06-01T11:00:00Z", scheduled_end: "2026-06-01T10:00:00Z" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: convene_from_scheduled_without_notice_invalid
        claim_type: Invalid Transitions
        grounds: [state_machines.Meeting.NOTICED_to_IN_SESSION, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "IN_SESSION requires from-state NOTICED; convening a still-SCHEDULED meeting returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["EMERGENCY meeting still SCHEDULED (no notice posted)."]
          setup_api_calls:
            - call: "POST /public-bodies"
              payload: { name: "Body V", jurisdiction_state: "TN", seat_count: 3, quorum_size: 1 }
              as: Clerk
              captures: { body_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/venues"
              payload: { name: "Room V" }
              as: Clerk
              captures: { venue_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M1", seat_number: 1 }
              as: Clerk
              captures: { m1_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/meetings"
              payload: { venue_id: "${venue_id}", presiding_member_id: "${m1_id}", title: "V", meeting_type: "EMERGENCY", scheduled_start: "2026-05-01T02:00:00Z", scheduled_end: "2026-05-01T03:00:00Z" }
              as: Clerk
              captures: { meeting_id: $.data.id }
          trigger:
            - call: "POST /meetings/${meeting_id}/transition"
              payload: { to_status: "IN_SESSION", present_member_ids: ["${m1_id}"] }
              as: BodyMember
              as_user_id: "${m1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: transition_cancelled_meeting_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Meeting.terminal_states, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal; any further transition on it returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["EMERGENCY meeting SCHEDULED then CANCELLED."]
          setup_api_calls:
            - call: "POST /public-bodies"
              payload: { name: "Body U", jurisdiction_state: "AL", seat_count: 3, quorum_size: 1 }
              as: Clerk
              captures: { body_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/venues"
              payload: { name: "Room U" }
              as: Clerk
              captures: { venue_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M1", seat_number: 1 }
              as: Clerk
              captures: { m1_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/meetings"
              payload: { venue_id: "${venue_id}", presiding_member_id: "${m1_id}", title: "U", meeting_type: "EMERGENCY", scheduled_start: "2026-05-01T02:00:00Z", scheduled_end: "2026-05-01T03:00:00Z" }
              as: Clerk
              captures: { meeting_id: $.data.id }
            - call: "POST /meetings/${meeting_id}/transition"
              payload: { to_status: "CANCELLED" }
              as: Clerk
          trigger:
            - call: "POST /meetings/${meeting_id}/transition"
              payload: { to_status: "NOTICED", notice_channel: "WEBSITE" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: double_convene_idempotency_rejected
        claim_type: Idempotency
        grounds: [state_machines.Meeting.NOTICED_to_IN_SESSION]
        distinguishing_aspect: "Convening an already IN_SESSION meeting a second time returns ERR_INVALID_STATE (not idempotent)."
        test_recipe:
          setup: ["EMERGENCY meeting convened (IN_SESSION), present [m1,m2]."]
          setup_api_calls:
            - call: "POST /public-bodies"
              payload: { name: "Body T", jurisdiction_state: "SC", seat_count: 3, quorum_size: 2 }
              as: Clerk
              captures: { body_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/venues"
              payload: { name: "Room T" }
              as: Clerk
              captures: { venue_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M1", seat_number: 1 }
              as: Clerk
              captures: { m1_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M2", seat_number: 2 }
              as: Clerk
              captures: { m2_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/meetings"
              payload: { venue_id: "${venue_id}", presiding_member_id: "${m1_id}", title: "T", meeting_type: "EMERGENCY", scheduled_start: "2026-05-01T02:00:00Z", scheduled_end: "2026-05-01T03:00:00Z" }
              as: Clerk
              captures: { meeting_id: $.data.id }
            - call: "POST /meetings/${meeting_id}/transition"
              payload: { to_status: "NOTICED", notice_channel: "WEBSITE" }
              as: Clerk
            - call: "POST /meetings/${meeting_id}/transition"
              payload: { to_status: "IN_SESSION", present_member_ids: ["${m1_id}", "${m2_id}"] }
              as: BodyMember
              as_user_id: "${m1_id}"
          trigger:
            - call: "POST /meetings/${meeting_id}/transition"
              payload: { to_status: "IN_SESSION", present_member_ids: ["${m1_id}", "${m2_id}"] }
              as: BodyMember
              as_user_id: "${m1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: minutes_amend_cycle_reapproves
        claim_type: Valid Transition
        grounds:
          - state_machines.Meeting.APPROVED_to_AMENDED
          - state_machines.Meeting.AMENDED_to_APPROVED
        distinguishing_aspect: "Minutes parallel dimension cycles NONE->DRAFT->APPROVED->AMENDED->APPROVED after the meeting is ADJOURNED."
        test_recipe:
          setup: ["EMERGENCY meeting convened then ADJOURNED; minutes DRAFT then APPROVED then AMENDED."]
          setup_api_calls:
            - call: "POST /public-bodies"
              payload: { name: "Body S", jurisdiction_state: "IA", seat_count: 3, quorum_size: 2 }
              as: Clerk
              captures: { body_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/venues"
              payload: { name: "Room S" }
              as: Clerk
              captures: { venue_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M1", seat_number: 1 }
              as: Clerk
              captures: { m1_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M2", seat_number: 2 }
              as: Clerk
              captures: { m2_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/meetings"
              payload: { venue_id: "${venue_id}", presiding_member_id: "${m1_id}", title: "S", meeting_type: "EMERGENCY", scheduled_start: "2026-05-01T02:00:00Z", scheduled_end: "2026-05-01T03:00:00Z" }
              as: Clerk
              captures: { meeting_id: $.data.id }
            - call: "POST /meetings/${meeting_id}/transition"
              payload: { to_status: "NOTICED", notice_channel: "WEBSITE" }
              as: Clerk
            - call: "POST /meetings/${meeting_id}/transition"
              payload: { to_status: "IN_SESSION", present_member_ids: ["${m1_id}", "${m2_id}"] }
              as: BodyMember
              as_user_id: "${m1_id}"
            - call: "POST /meetings/${meeting_id}/transition"
              payload: { to_status: "ADJOURNED" }
              as: BodyMember
              as_user_id: "${m1_id}"
            - call: "POST /meetings/${meeting_id}/minutes"
              payload: { to_status: "DRAFT", minutes_text: "v1" }
              as: Clerk
            - call: "POST /meetings/${meeting_id}/minutes"
              payload: { to_status: "APPROVED" }
              as: BodyMember
              as_user_id: "${m1_id}"
            - call: "POST /meetings/${meeting_id}/minutes"
              payload: { to_status: "AMENDED", minutes_text: "v2" }
              as: Clerk
          trigger:
            - call: "POST /meetings/${meeting_id}/minutes"
              payload: { to_status: "APPROVED" }
              as: BodyMember
              as_user_id: "${m1_id}"
          assert:
            - "Meeting.${meeting_id}.minutes_status == APPROVED"

      - name: adjourn_with_open_motion_blocked
        claim_type: Precondition Enforcement
        grounds: [state_machines.Meeting.IN_SESSION_to_ADJOURNED, "errors[ERR_OPEN_MOTIONS_EXIST]"]
        distinguishing_aspect: "Adjourning while a Motion under the meeting is still OPEN returns ERR_OPEN_MOTIONS_EXIST."
        test_recipe:
          setup: ["EMERGENCY meeting IN_SESSION; ACTION item OPEN; motion OPEN."]
          setup_api_calls:
            - call: "POST /public-bodies"
              payload: { name: "Body R", jurisdiction_state: "MO", seat_count: 3, quorum_size: 2 }
              as: Clerk
              captures: { body_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/venues"
              payload: { name: "Room R" }
              as: Clerk
              captures: { venue_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M1", seat_number: 1 }
              as: Clerk
              captures: { m1_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M2", seat_number: 2 }
              as: Clerk
              captures: { m2_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/meetings"
              payload: { venue_id: "${venue_id}", presiding_member_id: "${m1_id}", title: "R", meeting_type: "EMERGENCY", scheduled_start: "2026-05-01T02:00:00Z", scheduled_end: "2026-05-01T03:00:00Z" }
              as: Clerk
              captures: { meeting_id: $.data.id }
            - call: "POST /meetings/${meeting_id}/transition"
              payload: { to_status: "NOTICED", notice_channel: "WEBSITE" }
              as: Clerk
            - call: "POST /meetings/${meeting_id}/transition"
              payload: { to_status: "IN_SESSION", present_member_ids: ["${m1_id}", "${m2_id}"] }
              as: BodyMember
              as_user_id: "${m1_id}"
            - call: "POST /meetings/${meeting_id}/agenda-items"
              payload: { title: "R item", sequence: 1, item_type: "ACTION" }
              as: Clerk
              captures: { item_id: $.data.id }
            - call: "POST /agenda-items/${item_id}/transition"
              payload: { to_status: "OPEN" }
              as: BodyMember
              as_user_id: "${m1_id}"
            - call: "POST /agenda-items/${item_id}/motions"
              payload: { text: "R motion", moved_by_member_id: "${m1_id}", seconded_by_member_id: "${m2_id}" }
              as: BodyMember
              as_user_id: "${m1_id}"
              captures: { mo_id: $.data.id }
            - call: "POST /motions/${mo_id}/transition"
              payload: { to_status: "OPEN" }
              as: BodyMember
              as_user_id: "${m1_id}"
          trigger:
            - call: "POST /meetings/${meeting_id}/transition"
              payload: { to_status: "ADJOURNED" }
              as: BodyMember
              as_user_id: "${m1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_OPEN_MOTIONS_EXIST"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: requester_cannot_create_public_body_unauthorized
        claim_type: Role Restriction
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "POST /public-bodies is Clerk-exclusive; a Requester attempt returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Requester r1 exists."]
          setup_api_calls:
            - call: "POST /requesters"
              payload: { full_name: "Cy", email: "cy@example.com" }
              as: Anonymous
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /public-bodies"
              payload: { name: "Sneaky", jurisdiction_state: "ND", seat_count: 5, quorum_size: 2 }
              as: Requester
              as_user_id: "${r1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: missing_auth_on_determination_unauthenticated
        claim_type: Role Restriction
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A determination call with no valid auth headers (Anonymous, unauthenticated) returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["A request UNDER_REVIEW exists."]
          setup_api_calls:
            - call: "POST /requesters"
              payload: { full_name: "Di", email: "di@example.com" }
              as: Anonymous
              captures: { r1_id: $.data.id }
            - call: "POST /public-bodies"
              payload: { name: "Body Q2", jurisdiction_state: "SD", seat_count: 5, quorum_size: 2 }
              as: Clerk
              captures: { body_id: $.data.id }
            - call: "POST /records-requests"
              payload: { requester_id: "${r1_id}", body_id: "${body_id}", subject: "s", description: "x", estimated_page_count: 0 }
              as: Requester
              as_user_id: "${r1_id}"
              captures: { req_id: $.data.id }
            - call: "POST /records-requests/${req_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: RecordsOfficer
              captures: { rr_v: $.data.version }
          trigger:
            - call: "POST /records-requests/${req_id}/determination"
              payload: { decision: "DENIED", expected_records_request_version: "${rr_v}" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHENTICATED"

      - name: other_requester_cannot_withdraw_not_owner
        claim_type: Ownership
        grounds: ["validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "A Requester withdrawing another requester's RecordsRequest returns ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["Request owned by r1; r2 is a different registered requester."]
          setup_api_calls:
            - call: "POST /requesters"
              payload: { full_name: "Eve", email: "eve@example.com" }
              as: Anonymous
              captures: { r1_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Fox", email: "fox@example.com" }
              as: Anonymous
              captures: { r2_id: $.data.id }
            - call: "POST /public-bodies"
              payload: { name: "Body P2", jurisdiction_state: "NE", seat_count: 5, quorum_size: 2 }
              as: Clerk
              captures: { body_id: $.data.id }
            - call: "POST /records-requests"
              payload: { requester_id: "${r1_id}", body_id: "${body_id}", subject: "s", description: "x", estimated_page_count: 0 }
              as: Requester
              as_user_id: "${r1_id}"
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /records-requests/${req_id}/transition"
              payload: { to_status: "WITHDRAWN" }
              as: Requester
              as_user_id: "${r2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_RESOURCE_OWNER"

      - name: nonpresiding_member_cannot_convene
        claim_type: Role Restriction
        grounds: ["validations[priority=4]", "errors[ERR_NOT_PRESIDING_OFFICER]"]
        distinguishing_aspect: "A BodyMember who is not the meeting's presiding_member_id cannot convene; returns ERR_NOT_PRESIDING_OFFICER (403)."
        test_recipe:
          setup: ["EMERGENCY meeting NOTICED, presiding m1; m2 attempts convene."]
          setup_api_calls:
            - call: "POST /public-bodies"
              payload: { name: "Body O2", jurisdiction_state: "KS", seat_count: 3, quorum_size: 2 }
              as: Clerk
              captures: { body_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/venues"
              payload: { name: "Room O2" }
              as: Clerk
              captures: { venue_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M1", seat_number: 1 }
              as: Clerk
              captures: { m1_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M2", seat_number: 2 }
              as: Clerk
              captures: { m2_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/meetings"
