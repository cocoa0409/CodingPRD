  - { error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, message: "The same user may not perform both steps", trigger: "validation priority 13" }
  - { error_id: ERR_PROFILE_NOT_APPROVED, http_status: 409, message: "Waste profile is not approved", trigger: "validation priority 14" }
