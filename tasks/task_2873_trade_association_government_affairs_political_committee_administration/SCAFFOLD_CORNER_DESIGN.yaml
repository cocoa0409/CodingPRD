        excluded_because:
          difficulty_instance: dual_variant_calc / expenditure_report_method_a_vs_method_b_divergence
          rationale: "That instance builds one activity set and reports it on both bases in the same test, asserting method_a_total_cents 700000 against method_b_total_cents 751001 and the divergence of 51001 cents."
      - name: report_basis_selects_which_total_is_filed
        claim_type: Variant Selection
        grounds:
          - calculations.reportable_expenditure_total.formula
        excluded_because:
          difficulty_instance: dual_variant_calc / expenditure_report_method_a_vs_method_b_divergence
          rationale: "The same instance asserts that filed_total_cents equals method_a_total_cents on a METHOD_A report and method_b_total_cents on a METHOD_B report while both stored totals are always populated, which is exactly the variant-selection claim."
      - name: certified_total_reconciles_into_every_member_notice
