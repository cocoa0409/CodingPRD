# =============================================================================
# §1.8 Scaffold Difficulty Design — Frozen Prepared Food Manufacturing
# 9 Difficulty Rules x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: shelf_life_provisional_vs_final_expiry
        grounds:
          - calculations.shelf_life_expiry
          - entities.FinishedGoodsLot.fields.provisional_expiry_date
          - entities.FinishedGoodsLot.fields.final_expiry_date
        distinguishing_aspect: |
          Dual variant on the FinishedGoodsLot domain: the provisional variant anchors
          to the cycle's PLANNED start (2026-08-02) while the final variant anchors to
          the ACTUAL verified end (2026-08-03), so the same lot carries two expiry
          dates that differ by exactly one day.
        test_recipe:
          setup:
            - "APPROVED recipe R (base 1000 units, portion 340 g, shelf_life_days 365)"
            - "order O (RETAIL, 12000 units, house) with batch B (6000 units) driven to FROZEN"
            - "cycle planned_start 2026-08-02T22:00:00Z, load 1600 kg, entry 5C (required 5 h), completed at actual_end 2026-08-03T03:00:00Z with core -20C -> VERIFIED"
            - "line run completed for 6000 units -> lot L exists in QA_PENDING"
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /plant/recipes"
              payload: { name: "R-Expiry", product_style: "ENTREE", base_batch_yield_units: 1000, portion_weight_g: 340, shelf_life_days: 365 }
              as: PlantManager
              captures: { r_id: $.data.id }
            - call: "POST /plant/recipes/${r_id}/components"
              payload: { component_name: "Sauce", component_type: "RAW_INGREDIENT", quantity_per_base_batch: 50, unit_of_measure: "KG", scale_exponent: 0.85 }
              as: PlantManager
            - { call: "POST /plant/recipes/${r_id}/approve", payload: {}, as: PlantManager }
            - call: "POST /plant/production-orders"
              payload: { recipe_id: "${r_id}", pack_format: "RETAIL", units_planned: 12000 }
              as: ProductionPlanner
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /plant/production-orders/${o_id}/batches"
              payload: { units_planned: 6000, expected_order_version: "${o_v}" }
              as: ProductionPlanner
              captures: { b_id: $.data.id }
            - { call: "POST /plant/production-batches/${b_id}/kit", payload: {}, as: LineOperator }
            - { call: "POST /plant/production-batches/${b_id}/cook", payload: { cooked_mass_kg: 1550 }, as: LineOperator }
            - call: "POST /plant/freezer-cells"
              payload: { cell_code: "FC-1", capacity_kg: 2000, min_load_kg: 200, pull_down_kg_per_hour: 400, sanitation_minutes: 30 }
              as: PlantManager
              captures: { c_id: $.data.id }
            - call: "GET /plant/production-batches/${b_id}"
              payload: {}
              as: ProductionPlanner
              captures: { b_v: $.data.version }
            - call: "POST /plant/production-batches/${b_id}/freezing-cycles"
              payload: { cell_id: "${c_id}", load_kg: 1600, entry_temp_c: 5, planned_start: "2026-08-02T22:00:00Z", expected_batch_version: "${b_v}" }
              as: ProductionPlanner
              captures: { cy_id: $.data.id }
            - { call: "POST /plant/freezing-cycles/${cy_id}/start", payload: {}, as: LineOperator }
            - { call: "POST /plant/freezing-cycles/${cy_id}/complete", payload: { actual_end: "2026-08-03T03:00:00Z", final_core_temp_c: -20 }, as: LineOperator }
            - call: "POST /plant/packaging-lines"
              payload: { line_code: "L-1", line_type: "TRAY", rate_units_per_minute: 100, supported_film_type: "TRAY_FILM" }
              as: PlantManager
              captures: { l_id: $.data.id }
            - call: "POST /plant/film-lots"
              payload: { film_type: "TRAY_FILM", rolls_received: 10, meters_per_roll: 1000 }
              as: PlantManager
              captures: { f_id: $.data.id }
            - call: "POST /plant/packaging-lines/${l_id}/runs"
              payload: { batch_id: "${b_id}", film_lot_id: "${f_id}", planned_start: "2026-08-03T08:00:00Z", units_planned: 6000 }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - { call: "POST /plant/line-runs/${run_id}/start", payload: {}, as: LineOperator }
            - { call: "POST /plant/line-runs/${run_id}/complete", payload: { units_packed: 6000, film_meters_consumed: 2671 }, as: LineOperator }
            - call: "GET /plant/lots?batch_id=${b_id}"
              payload: {}
              as: QAManager
              captures: { lot_id: "$.data[0].id" }
          trigger:
            - call: "GET /plant/lots/${lot_id}"
              payload: {}
              as: QAManager
              captures: { prov: $.data.provisional_expiry_date, fin: $.data.final_expiry_date }
          assert:
            - "FinishedGoodsLot.${lot_id}.provisional_expiry_date == '2027-08-02' (date(planned_start 2026-08-02) + 365)"
            - "FinishedGoodsLot.${lot_id}.final_expiry_date == '2027-08-03' (date(actual_end 2026-08-03) + 365)"
            - "provisional_expiry_date != final_expiry_date for identical lot data"

      - name: copack_billing_per_case_vs_per_kg
        grounds:
          - calculations.copack_billing
          - entities.ProductionOrder.fields.billed_amount_cents
          - entities.CoPackCustomer.fields.billing_method
        distinguishing_aspect: |
          Dual variant on the ProductionOrder billing domain (distinct from the
          FinishedGoodsLot expiry variant): identical physical output (500 cases,
          2040.000 kg) bills 750000 cents under PER_CASE and 244800 cents under PER_KG.
        test_recipe:
          setup:
            - "customer A (PER_CASE, 1500 c/case) and customer B (PER_KG, 120 c/kg)"
            - "one APPROVED recipe R; each customer gets an order of 6000 RETAIL units with one batch fully produced (6000 packed) and its lot RELEASED"
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /plant/recipes"
              payload: { name: "R-Bill", product_style: "ENTREE", base_batch_yield_units: 1000, portion_weight_g: 340, shelf_life_days: 365 }
              as: PlantManager
              captures: { r_id: $.data.id }
            - call: "POST /plant/recipes/${r_id}/components"
              payload: { component_name: "Sauce", component_type: "RAW_INGREDIENT", quantity_per_base_batch: 50, unit_of_measure: "KG" }
              as: PlantManager
            - { call: "POST /plant/recipes/${r_id}/approve", payload: {}, as: PlantManager }
            - call: "POST /plant/copack-customers"
              payload: { name: "Cust A", billing_method: "PER_CASE", case_rate_cents: 1500 }
              as: PlantManager
              captures: { cust_a: $.data.id }
            - call: "POST /plant/copack-customers"
              payload: { name: "Cust B", billing_method: "PER_KG", kg_rate_cents: 120 }
              as: PlantManager
              captures: { cust_b: $.data.id }
            - call: "POST /plant/freezer-cells"
              payload: { cell_code: "FC-1", capacity_kg: 2000, min_load_kg: 200, pull_down_kg_per_hour: 400, sanitation_minutes: 30 }
              as: PlantManager
              captures: { c_id: $.data.id }
            - call: "POST /plant/packaging-lines"
              payload: { line_code: "L-1", line_type: "TRAY", rate_units_per_minute: 100, supported_film_type: "TRAY_FILM" }
              as: PlantManager
              captures: { l_id: $.data.id }
            - call: "POST /plant/film-lots"
              payload: { film_type: "TRAY_FILM", rolls_received: 20, meters_per_roll: 1000 }
              as: PlantManager
              captures: { f_id: $.data.id }
            # ---- customer A order ----
            - call: "POST /plant/production-orders"
              payload: { recipe_id: "${r_id}", pack_format: "RETAIL", units_planned: 6000, copack_customer_id: "${cust_a}" }
              as: ProductionPlanner
              captures: { oa_id: $.data.id, oa_v: $.data.version }
            - call: "POST /plant/production-orders/${oa_id}/batches"
              payload: { units_planned: 6000, expected_order_version: "${oa_v}" }
              as: ProductionPlanner
              captures: { ba_id: $.data.id }
            - { call: "POST /plant/production-batches/${ba_id}/kit", payload: {}, as: LineOperator }
            - { call: "POST /plant/production-batches/${ba_id}/cook", payload: { cooked_mass_kg: 1550 }, as: LineOperator }
            - call: "GET /plant/production-batches/${ba_id}"
              payload: {}
              as: ProductionPlanner
              captures: { ba_v: $.data.version }
            - call: "POST /plant/production-batches/${ba_id}/freezing-cycles"
              payload: { cell_id: "${c_id}", load_kg: 1600, entry_temp_c: 5, planned_start: "2026-08-02T00:00:00Z", expected_batch_version: "${ba_v}" }
              as: ProductionPlanner
              captures: { cya_id: $.data.id }
            - { call: "POST /plant/freezing-cycles/${cya_id}/start", payload: {}, as: LineOperator }
            - { call: "POST /plant/freezing-cycles/${cya_id}/complete", payload: { actual_end: "2026-08-02T05:00:00Z", final_core_temp_c: -20 }, as: LineOperator }
            - call: "POST /plant/packaging-lines/${l_id}/runs"
              payload: { batch_id: "${ba_id}", film_lot_id: "${f_id}", planned_start: "2026-08-03T08:00:00Z", units_planned: 6000 }
              as: ProductionPlanner
              captures: { runa_id: $.data.id }
            - { call: "POST /plant/line-runs/${runa_id}/start", payload: {}, as: LineOperator }
            - { call: "POST /plant/line-runs/${runa_id}/complete", payload: { units_packed: 6000, film_meters_consumed: 2671 }, as: LineOperator }
            - call: "GET /plant/lots?batch_id=${ba_id}"
              payload: {}
              as: QAManager
              captures: { lota_id: "$.data[0].id" }
            - { call: "POST /plant/production-batches/${ba_id}/ccp-checks", payload: { check_type: "METAL_DETECTOR", test_piece_detected: true }, as: QATechnician, as_user_id: "qa-tech-1" }
            - { call: "POST /plant/production-batches/${ba_id}/ccp-checks", payload: { check_type: "XRAY", test_piece_detected: true }, as: QATechnician, as_user_id: "qa-tech-1" }
            - { call: "POST /plant/production-batches/${ba_id}/complete", payload: {}, as: LineOperator }
            - { call: "POST /plant/lots/${lota_id}/release", payload: {}, as: QAManager, as_user_id: "qa-mgr-1" }
            # ---- customer B order (same physical numbers) ----
            - call: "POST /plant/production-orders"
              payload: { recipe_id: "${r_id}", pack_format: "RETAIL", units_planned: 6000, copack_customer_id: "${cust_b}" }
              as: ProductionPlanner
              captures: { ob_id: $.data.id, ob_v: $.data.version }
            - call: "POST /plant/production-orders/${ob_id}/batches"
              payload: { units_planned: 6000, expected_order_version: "${ob_v}" }
              as: ProductionPlanner
              captures: { bb_id: $.data.id }
            - { call: "POST /plant/production-batches/${bb_id}/kit", payload: {}, as: LineOperator }
            - { call: "POST /plant/production-batches/${bb_id}/cook", payload: { cooked_mass_kg: 1550 }, as: LineOperator }
            - call: "GET /plant/production-batches/${bb_id}"
              payload: {}
              as: ProductionPlanner
              captures: { bb_v: $.data.version }
            - call: "POST /plant/production-batches/${bb_id}/freezing-cycles"
              payload: { cell_id: "${c_id}", load_kg: 1600, entry_temp_c: 5, planned_start: "2026-08-02T06:00:00Z", expected_batch_version: "${bb_v}" }
              as: ProductionPlanner
              captures: { cyb_id: $.data.id }
            - { call: "POST /plant/freezing-cycles/${cyb_id}/start", payload: {}, as: LineOperator }
            - { call: "POST /plant/freezing-cycles/${cyb_id}/complete", payload: { actual_end: "2026-08-02T11:00:00Z", final_core_temp_c: -20 }, as: LineOperator }
            - call: "POST /plant/packaging-lines/${l_id}/runs"
              payload: { batch_id: "${bb_id}", film_lot_id: "${f_id}", planned_start: "2026-08-03T09:45:00Z", units_planned: 6000 }
              as: ProductionPlanner
              captures: { runb_id: $.data.id }
            - { call: "POST /plant/line-runs/${runb_id}/start", payload: {}, as: LineOperator }
            - { call: "POST /plant/line-runs/${runb_id}/complete", payload: { units_packed: 6000, film_meters_consumed: 2671 }, as: LineOperator }
            - call: "GET /plant/lots?batch_id=${bb_id}"
              payload: {}
              as: QAManager
              captures: { lotb_id: "$.data[0].id" }
            - { call: "POST /plant/production-batches/${bb_id}/ccp-checks", payload: { check_type: "METAL_DETECTOR", test_piece_detected: true }, as: QATechnician, as_user_id: "qa-tech-1" }
            - { call: "POST /plant/production-batches/${bb_id}/ccp-checks", payload: { check_type: "XRAY", test_piece_detected: true }, as: QATechnician, as_user_id: "qa-tech-1" }
            - { call: "POST /plant/production-batches/${bb_id}/complete", payload: {}, as: LineOperator }
            - { call: "POST /plant/lots/${lotb_id}/release", payload: {}, as: QAManager, as_user_id: "qa-mgr-1" }
          trigger:
            - call: "GET /plant/production-orders/${oa_id}"
              payload: {}
              as: ProductionPlanner
              captures: { bill_a: $.data.billed_amount_cents }
            - call: "GET /plant/production-orders/${ob_id}"
              payload: {}
              as: ProductionPlanner
              captures: { bill_b: $.data.billed_amount_cents }
          assert:
            - "ProductionOrder.${oa_id}.billed_amount_cents == 750000 (500 cases * 1500)"
            - "ProductionOrder.${ob_id}.billed_amount_cents == 244800 (round_half_up(2040.000 * 120))"
            - "identical physical output bills differently under the two variants"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: recipe_scale_up_nonlinear_exponents
        grounds:
          - calculations.recipe_scale_up
          - entities.RecipeComponent.fields.scale_exponent
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 3 inputs (target_units, per-component quantity,
          exponent chain, component_type branch) with non-linear interaction —
          exponentiation, a min/max clamp on the factor, forced exponent 1.0 for
          PACKAGING, and multiplicative exponent composition down the sub-assembly tree.
        test_recipe:
          setup:
            - "DRAFT recipe R (base 1000 units) with: RAW 'Sauce base' 50 KG exp 0.85; SUB 'Grain sub' 20 KG exp 1.0 with child RAW 'Toasted grain' 5 KG exp 0.5; PACKAGING 'Tray' 200 EACH with input exp 0.9 (forced 1.0)"
          setup_api_calls:
            - call: "POST /plant/recipes"
              payload: { name: "R-Scale", product_style: "BOWL", base_batch_yield_units: 1000, portion_weight_g: 340, shelf_life_days: 365 }
              as: PlantManager
              captures: { r_id: $.data.id }
            - call: "POST /plant/recipes/${r_id}/components"
              payload: { component_name: "Sauce base", component_type: "RAW_INGREDIENT", quantity_per_base_batch: 50, unit_of_measure: "KG", scale_exponent: 0.85 }
              as: PlantManager
            - call: "POST /plant/recipes/${r_id}/components"
              payload: { component_name: "Grain sub", component_type: "SUB_ASSEMBLY", quantity_per_base_batch: 20, unit_of_measure: "KG", scale_exponent: 1.0 }
              as: PlantManager
              captures: { sub_id: $.data.id }
            - call: "POST /plant/recipes/${r_id}/components"
              payload: { component_name: "Toasted grain", component_type: "RAW_INGREDIENT", quantity_per_base_batch: 5, unit_of_measure: "KG", scale_exponent: 0.5, parent_component_id: "${sub_id}" }
              as: PlantManager
            - call: "POST /plant/recipes/${r_id}/components"
              payload: { component_name: "Tray", component_type: "PACKAGING", quantity_per_base_batch: 200, unit_of_measure: "EACH", scale_exponent: 0.9 }
              as: PlantManager
          trigger:
            - call: "GET /plant/recipes/${r_id}/scale-preview"
              payload: { target_units: 2000 }
              as: ProductionPlanner
          assert:
            - "scale-preview scale_factor == 2.0 (2000/1000, inside clamp [0.25, 8.0])"
            - "'Sauce base' scaled_qty == 90.125 (round_half_up(50 * 2^0.85, 3))"
            - "'Grain sub' scaled_qty == 40.000 (20 * 2^1.0)"
            - "'Toasted grain' scaled_qty == 7.071 (effective exponent 1.0*0.5; round_half_up(5 * 2^0.5, 3))"
            - "'Tray' scaled_qty == 400.000 (PACKAGING exponent forced to 1.0 despite input 0.9)"

      - name: film_reservation_per_run_rounding
        grounds:
          - calculations.film_reservation
          - entities.LineRun.fields.reserved_film_m
          - entities.FilmSupplyLot.fields.meters_reserved
        distinguishing_aspect: |
          Mode (b) nested rounding (distinct from mode (a) above): the scaffold pins
          round-per-run-then-sum. Two runs of 50 RETAIL units reserve 22 + 22 = 44 m,
          whereas sum-then-round would give round_half_up(44.52) = 45 m — the orders differ.
        test_recipe:
          setup:
            - "APPROVED recipe; order (RETAIL, house); batch B KITTED; TRAY line; film lot F with 10 rolls x 1000 m = 10000 m"
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /plant/recipes"
              payload: { name: "R-Film", product_style: "ENTREE", base_batch_yield_units: 1000, portion_weight_g: 340, shelf_life_days: 365 }
              as: PlantManager
              captures: { r_id: $.data.id }
            - call: "POST /plant/recipes/${r_id}/components"
              payload: { component_name: "Sauce", component_type: "RAW_INGREDIENT", quantity_per_base_batch: 50, unit_of_measure: "KG" }
              as: PlantManager
            - { call: "POST /plant/recipes/${r_id}/approve", payload: {}, as: PlantManager }
            - call: "POST /plant/production-orders"
              payload: { recipe_id: "${r_id}", pack_format: "RETAIL", units_planned: 6000 }
              as: ProductionPlanner
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /plant/production-orders/${o_id}/batches"
              payload: { units_planned: 6000, expected_order_version: "${o_v}" }
              as: ProductionPlanner
              captures: { b_id: $.data.id }
            - { call: "POST /plant/production-batches/${b_id}/kit", payload: {}, as: LineOperator }
            - call: "POST /plant/packaging-lines"
              payload: { line_code: "L-1", line_type: "TRAY", rate_units_per_minute: 100, supported_film_type: "TRAY_FILM" }
              as: PlantManager
              captures: { l_id: $.data.id }
            - call: "POST /plant/film-lots"
              payload: { film_type: "TRAY_FILM", rolls_received: 10, meters_per_roll: 1000 }
              as: PlantManager
              captures: { f_id: $.data.id }
            - call: "POST /plant/packaging-lines/${l_id}/runs"
              payload: { batch_id: "${b_id}", film_lot_id: "${f_id}", planned_start: "2026-08-03T08:00:00Z", units_planned: 50 }
              as: ProductionPlanner
              captures: { run1_id: $.data.id }
            - call: "POST /plant/packaging-lines/${l_id}/runs"
              payload: { batch_id: "${b_id}", film_lot_id: "${f_id}", planned_start: "2026-08-03T08:16:00Z", units_planned: 50 }
              as: ProductionPlanner
              captures: { run2_id: $.data.id }
          trigger:
            - call: "GET /plant/film-lots/${f_id}"
              payload: {}
              as: ProductionPlanner
              captures: { res: $.data.meters_reserved }
          assert:
            - "LineRun.${run1_id}.reserved_film_m == 22 (round_half_up(50 * 0.42 * 1.06) = round_half_up(22.26))"
            - "LineRun.${run2_id}.reserved_film_m == 22"
            - "FilmSupplyLot.${f_id}.meters_reserved == 44 (sum of per-run rounded values; sum-then-round would give 45)"
            - "FilmSupplyLot.${f_id}.meters_available == 9956"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: batch_rework_loop_cycle
        grounds:
          - state_machines.ProductionBatch.ON_HOLD_to_REWORK
          - state_machines.ProductionBatch.REWORK_to_KITTED
        distinguishing_aspect: |
          Cyclic machine on ProductionBatch: KITTED -> ON_HOLD -> REWORK -> KITTED ->
          COOKED loops back to a previously visited state (not a linear pipeline).
        test_recipe:
          setup:
            - "APPROVED recipe; order (RETAIL, house); batch B in KITTED"
          setup_api_calls:
            - call: "POST /plant/recipes"
              payload: { name: "R-Rework", product_style: "ENTREE", base_batch_yield_units: 1000, portion_weight_g: 340, shelf_life_days: 365 }
              as: PlantManager
              captures: { r_id: $.data.id }
            - call: "POST /plant/recipes/${r_id}/components"
              payload: { component_name: "Sauce", component_type: "RAW_INGREDIENT", quantity_per_base_batch: 50, unit_of_measure: "KG" }
              as: PlantManager
            - { call: "POST /plant/recipes/${r_id}/approve", payload: {}, as: PlantManager }
            - call: "POST /plant/production-orders"
              payload: { recipe_id: "${r_id}", pack_format: "RETAIL", units_planned: 6000 }
              as: ProductionPlanner
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /plant/production-orders/${o_id}/batches"
              payload: { units_planned: 6000, expected_order_version: "${o_v}" }
              as: ProductionPlanner
              captures: { b_id: $.data.id }
            - { call: "POST /plant/production-batches/${b_id}/kit", payload: {}, as: LineOperator }
          trigger:
            - call: "POST /plant/production-batches/${b_id}/hold"
              payload: { reason: "under-fill suspicion" }
              as: QATechnician
              captures: { s1: $.data.status }
            - call: "POST /plant/production-batches/${b_id}/rework"
              payload: { reason: "re-kit with corrected sauce" }
              as: QAManager
              captures: { s2: $.data.status }
            - call: "POST /plant/production-batches/${b_id}/kit"
              payload: {}
              as: LineOperator
              captures: { s3: $.data.status }
            - call: "POST /plant/production-batches/${b_id}/cook"
              payload: { cooked_mass_kg: 1550 }
              as: LineOperator
              captures: { s4: $.data.status }
          assert:
            - "after hold: status == ON_HOLD and hold_origin_state == KITTED"
            - "after rework: status == REWORK"
            - "after second kit: status == KITTED (loop closed KITTED -> ... -> KITTED)"
            - "after cook: status == COOKED"

      - name: lot_reject_rework_release_cycle
        grounds:
          - state_machines.FinishedGoodsLot.QA_PENDING_to_REJECTED
          - state_machines.FinishedGoodsLot.REJECTED_to_QA_PENDING
        distinguishing_aspect: |
          Cyclic machine on FinishedGoodsLot (a different entity than ProductionBatch):
          QA_PENDING -> REJECTED -> QA_PENDING -> RELEASED traverses a reject/rework
          loop before succeeding.
        test_recipe:
          setup:
            - "lot L in QA_PENDING (batch COMPLETED, both CCP types PASS) — full production chain"
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /plant/recipes"
              payload: { name: "R-LotLoop", product_style: "ENTREE", base_batch_yield_units: 1000, portion_weight_g: 340, shelf_life_days: 365 }
