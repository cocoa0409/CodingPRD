    instances:
      - name: corner_occ_stale_vehicle_version_blocks_allocation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.allocation-create-stale-vehicle
          - validations.priority_7
          - errors.ERR_STALE_VEHICLE_VERSION
        distinguishing_aspect: "The version read before prep-complete is stale by exactly one write; allocating with it returns ERR_STALE_VEHICLE_VERSION 412 and creates no ReleaseOrder, while the re-read version succeeds with 201 on the identical body."
        test_recipe:
          setup:
            - "One unit at SHIPPING_READY, one zone-A dealer, one zone-A carrier."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
