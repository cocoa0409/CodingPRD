          The explicit_unit_override variant is checked in two stages and the MODEL match comes first, at
          priority 73, before the eligibility predicate at 76 - so a unit of the wrong model reports the mismatch
          even though it is also not in stock. That ordering is what this pins: an implementation that ran the
          eligibility test first would answer ERR_UNIT_NOT_ALLOCATABLE.
