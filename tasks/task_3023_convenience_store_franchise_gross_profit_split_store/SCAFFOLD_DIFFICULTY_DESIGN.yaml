            - "the settlement for the store froze a net settlement of 5000000.00, which more than covered the 5000000.00 draw"
            - "hop 2: Franchisee.${fG_id}.risk_band == A because 19800000 >= 15000000"
            - "hop 3: Store.${stG_old}.status == ACTIVE — the store that the suspension had cascaded to TERMINATED was restored by the cascade"
            - "FranchiseAgreement.${agG_old}.status == TERMINATED, so the restored store carries no agreement until a new one is drafted and activated"
            - "the superseded agreement FranchiseAgreement.${agG_old}.status == TERMINATED and it therefore did not receive the tier promotion"

      - name: franchisee_terminate_cascades_store_then_cancels_order_then_finalizes_settlement
        grounds:
          - state_machines.Franchisee.ACTIVE_to_TERMINATED
          - state_machines.Store.ACTIVE_to_TERMINATED
          - state_machines.FreshOrder.CONFIRMED_to_CANCELLED
          - state_machines.Settlement.OPEN_to_FINALIZED
          - state_machines.DrawAdvance.ISSUED_to_PARTIALLY_RECOVERED
        distinguishing_aspect: |
