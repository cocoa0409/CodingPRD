# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_0171
# Procurement & 3-Way Match — Expert band
# Nine Difficulty Rules (§0.5) × ≥2 instances each. Every grounds[] ref resolves
# into SCAFFOLD.yaml §1.1–§1.7. Every setup_api_calls / trigger chain is replayable
# from empty-DB using only declared §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: estimated_vs_committed_total_diverge_on_requisition
        grounds:
          - calculations.estimated_total
          - calculations.committed_total
          - entities.Requisition.fields.estimated_total_cents
          - entities.Requisition.fields.committed_total_cents
          - state_machines.PurchaseOrder.transitions.ISSUED_creation
        distinguishing_aspect: |
          The dual variant lives on the Requisition cost domain: estimated_total_cents
          (buyer guess, 600000) and committed_total_cents (winning quote price, 550000)
          are computed by two different calculations and diverge by exactly 50000 cents
          for identical requisition lines — distinct from the VendorScorecard on-time
          variant which scores delivery timeliness, not cost.
        test_recipe:
          setup:
            - "ProcurementAdmin has created a Vendor V and a SpendCategory CAT with approval_threshold_cents=500000, director_threshold_cents=2000000, preferred_vendor_id=V."
            - "Buyer B1 created a Requisition with one line sku=A qty=10 estimated_unit_price_cents=60000; estimated_total_cents computed to 600000 at submit."
            - "Requisition fully approved (one MANAGER step since 600000>500000 needs DIRECTOR -> two steps both APPROVED)."
            - "An RFQ opened, a Quote from V with A unit_price_cents=55000 submitted and awarded; quote quoted_total_cents=550000."
            - "A STANDARD PurchaseOrder issued from the awarded quote, writing committed_total_cents=550000 back on the requisition."
          setup_api_calls:
            - call: "POST /procurement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProcurementAdmin
            - call: "POST /procurement/vendors"
              payload: { name: "Vendor V", tax_id: "TAX-V-1" }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
            - call: "POST /procurement/spend-categories"
              payload: { name: "Office", code: "OFFICE", approval_threshold_cents: 500000, director_threshold_cents: 2000000, preferred_vendor_id: "${v_id}" }
              as: ProcurementAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /procurement/requisitions"
              payload: { spend_category_id: "${cat_id}", title: "Chairs", lines: [ { sku: "A", description: "Chair", quantity: 10, estimated_unit_price_cents: 60000 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { req_id: $.data.id }
            - call: "POST /procurement/requisitions/${req_id}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "GET /procurement/approval-steps"
              payload: { requisition_id: "${req_id}" }
              as: Approver
              captures: { step1_id: "$.data[0].id" }
            - call: "POST /procurement/requisitions/${req_id}/approve"
              payload: { decision: "APPROVE" }
              as: Approver
              as_user_id: "approver-mgr"
            - call: "POST /procurement/requisitions/${req_id}/approve"
              payload: { decision: "APPROVE" }
              as: Approver
              as_user_id: "approver-dir"
            - call: "POST /procurement/rfqs"
              payload: { requisition_id: "${req_id}", open_at: "2026-03-02T00:00:00Z", close_at: "2026-03-09T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { rfq_id: $.data.id }
            - call: "POST /procurement/quotes"
              payload: { rfq_id: "${rfq_id}", vendor_id: "${v_id}", submitted_at: "2026-03-03T00:00:00Z", unit_prices: [ { sku: "A", unit_price_cents: 55000, promised_lead_days: 10 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { quote_id: $.data.id }
            - call: "POST /procurement/rfqs/${rfq_id}/award"
              payload: { awarded_quote_id: "${quote_id}" }
              as: Buyer
              as_user_id: "buyer-b1"
          trigger:
            - call: "POST /procurement/purchase-orders"
              payload: { vendor_id: "${v_id}", spend_category_id: "${cat_id}", po_type: "STANDARD", requisition_id: "${req_id}", source_quote_id: "${quote_id}" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { po_id: $.data.id }
            - call: "GET /procurement/requisitions/${req_id}"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
          assert:
            - "Requisition.${req_id}.estimated_total_cents == 600000"
            - "Requisition.${req_id}.committed_total_cents == 550000"
            - "Requisition.${req_id}.committed_total_cents != Requisition.${req_id}.estimated_total_cents"
            - "PurchaseOrder.${po_id}.total_amount_cents == 550000"

      - name: on_time_strict_vs_grace_diverge_on_vendor_scorecard
        grounds:
          - calculations.on_time_delivery_rate
          - entities.VendorScorecard.fields.on_time_variant
          - entities.VendorScorecard.fields.on_time_rate_pct
          - entities.Vendor.fields.grace_days
        distinguishing_aspect: |
          The dual variant lives on the VendorScorecard delivery domain: for one receipt
          delivered two days late against a 10-day promised lead, a STRICT scorecard scores
          on_time_rate_pct=0 while a GRACE scorecard (grace_days=3) scores on_time_rate_pct=100
          on identical receipt data — a different entity and different conserved metric than
          the Requisition cost variant.
        test_recipe:
          setup:
            - "ProcurementAdmin created Vendor V with grace_days=3 and a SpendCategory with preferred_vendor_id=V."
            - "A STANDARD PO was issued at 2026-03-01 from an awarded quote whose A line promised_lead_days=10 (promised_date 2026-03-11)."
            - "A Receiver posted a GoodsReceipt with received_at=2026-03-13 (two days past promised)."
            - "Two scorecards are created for two disjoint adjacent periods over the same single receipt: a STRICT one and a GRACE one."
          setup_api_calls:
            - call: "POST /procurement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProcurementAdmin
            - call: "POST /procurement/vendors"
              payload: { name: "Vendor V", tax_id: "TAX-V-2", grace_days: 3 }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
            - call: "POST /procurement/spend-categories"
              payload: { name: "Office", code: "OFFICE2", approval_threshold_cents: 100000000, director_threshold_cents: 200000000, preferred_vendor_id: "${v_id}" }
              as: ProcurementAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /procurement/requisitions"
              payload: { spend_category_id: "${cat_id}", title: "Lamps", lines: [ { sku: "A", description: "Lamp", quantity: 5, estimated_unit_price_cents: 1000 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { req_id: $.data.id }
            - call: "POST /procurement/requisitions/${req_id}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "POST /procurement/requisitions/${req_id}/approve"
              payload: { decision: "APPROVE" }
              as: Approver
              as_user_id: "approver-mgr"
            - call: "POST /procurement/rfqs"
              payload: { requisition_id: "${req_id}", open_at: "2026-03-01T00:00:00Z", close_at: "2026-03-02T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { rfq_id: $.data.id }
            - call: "POST /procurement/quotes"
              payload: { rfq_id: "${rfq_id}", vendor_id: "${v_id}", submitted_at: "2026-03-01T06:00:00Z", unit_prices: [ { sku: "A", unit_price_cents: 1000, promised_lead_days: 10 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { quote_id: $.data.id }
            - call: "POST /procurement/rfqs/${rfq_id}/award"
              payload: { awarded_quote_id: "${quote_id}" }
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "POST /procurement/purchase-orders"
              payload: { vendor_id: "${v_id}", spend_category_id: "${cat_id}", po_type: "STANDARD", requisition_id: "${req_id}", source_quote_id: "${quote_id}" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { po_id: $.data.id }
            - call: "POST /procurement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-13T00:00:00Z" }
              as: ProcurementAdmin
            - call: "POST /procurement/goods-receipts"
              payload: { purchase_order_id: "${po_id}", received_lines: [ { sku: "A", received_qty: 5 } ], received_at: "2026-03-13T00:00:00Z" }
              as: Receiver
              as_user_id: "receiver-r1"
              captures: { gr_id: $.data.id }
          trigger:
            - call: "POST /procurement/vendor-scorecards"
              payload: { vendor_id: "${v_id}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-03-20T00:00:00Z", on_time_variant: "STRICT" }
              as: ProcurementAdmin
              captures: { sc_strict_id: $.data.id }
            - call: "POST /procurement/vendor-scorecards"
              payload: { vendor_id: "${v_id}", period_start: "2026-03-20T00:00:00Z", period_end: "2026-04-10T00:00:00Z", on_time_variant: "GRACE" }
              as: ProcurementAdmin
              captures: { sc_grace_id: $.data.id }
          assert:
            - "VendorScorecard.${sc_strict_id}.on_time_rate_pct == 0"
            - "VendorScorecard.${sc_grace_id}.on_time_rate_pct == 100"
            - "the GRACE scorecard's on_time_rate_pct strictly exceeds the STRICT scorecard's for the same receipt"

  # ===========================================================================
  # RULE 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: three_way_match_nonlinear_gate_chain_mode_a
        grounds:
          - calculations.three_way_match
          - state_machines.Invoice.transitions.UNMATCHED_to_MATCHED
          - entities.Invoice.fields.match_status
        distinguishing_aspect: |
          MODE (a): three_way_match is a ≥3-input formula (PO ordered unit_price, receipt
          received_qty, invoice billed_qty/billed_unit_price) with non-linear interaction —
          per-line floor(po_price*1.05) price gate AND billed_qty<=received_qty gate, then a
          SECONDARY aggregate floor(po_matched_amount*1.02) gate over the whole invoice. Here
          every per-line gate passes (billed 1050 == ceiling, qty 10 == received) yet the
          aggregate amount gate fails (invoice_total 10500 > 10200) — pure per-line evaluation
          would wrongly PASS.
        test_recipe:
          setup:
            - "A STANDARD PO has one line sku=A ordered quantity=10 unit_price_cents=1000 (from awarded quote)."
            - "A POSTED GoodsReceipt covers sku=A received_qty=10."
            - "An Invoice references that PO+receipt with one line sku=A billed_qty=10 billed_unit_price_cents=1050."
            - "Per-line: price 1050 <= floor(1000*1.05)=1050 OK; qty 10<=10 OK. Aggregate: invoice_total 10500 <= floor(10*1000*1.02)=10200 FAILS."
          setup_api_calls:
            - call: "POST /procurement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProcurementAdmin
            - call: "POST /procurement/vendors"
              payload: { name: "Vendor V", tax_id: "TAX-V-3" }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
            - call: "POST /procurement/spend-categories"
              payload: { name: "Office", code: "OFFICE3", approval_threshold_cents: 100000000, director_threshold_cents: 200000000, preferred_vendor_id: "${v_id}" }
              as: ProcurementAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /procurement/requisitions"
              payload: { spend_category_id: "${cat_id}", title: "Bolts", lines: [ { sku: "A", description: "Bolt", quantity: 10, estimated_unit_price_cents: 1000 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { req_id: $.data.id }
            - call: "POST /procurement/requisitions/${req_id}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "POST /procurement/requisitions/${req_id}/approve"
              payload: { decision: "APPROVE" }
              as: Approver
              as_user_id: "approver-mgr"
            - call: "POST /procurement/rfqs"
              payload: { requisition_id: "${req_id}", open_at: "2026-03-01T00:00:00Z", close_at: "2026-03-02T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { rfq_id: $.data.id }
            - call: "POST /procurement/quotes"
              payload: { rfq_id: "${rfq_id}", vendor_id: "${v_id}", submitted_at: "2026-03-01T06:00:00Z", unit_prices: [ { sku: "A", unit_price_cents: 1000, promised_lead_days: 5 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { quote_id: $.data.id }
            - call: "POST /procurement/rfqs/${rfq_id}/award"
              payload: { awarded_quote_id: "${quote_id}" }
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "POST /procurement/purchase-orders"
              payload: { vendor_id: "${v_id}", spend_category_id: "${cat_id}", po_type: "STANDARD", requisition_id: "${req_id}", source_quote_id: "${quote_id}" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { po_id: $.data.id }
            - call: "POST /procurement/goods-receipts"
              payload: { purchase_order_id: "${po_id}", received_lines: [ { sku: "A", received_qty: 10 } ], received_at: "2026-03-02T00:00:00Z" }
              as: Receiver
              as_user_id: "receiver-r1"
              captures: { gr_id: $.data.id }
            - call: "POST /procurement/invoices"
              payload: { vendor_id: "${v_id}", purchase_order_id: "${po_id}", goods_receipt_id: "${gr_id}", invoice_number: "INV-1", lines: [ { sku: "A", billed_qty: 10, billed_unit_price_cents: 1050 } ] }
              as: PayablesClerk
              as_user_id: "clerk-c1"
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /procurement/invoices/${inv_id}/match"
              payload: {}
              as: Matcher
              as_user_id: "matcher-m1"
            - call: "GET /procurement/match-exceptions"
              payload: { invoice_id: "${inv_id}" }
              as: Matcher
              as_user_id: "matcher-m1"
              captures: { exc_reason: "$.data[0].reason" }
          assert:
            - "Invoice.${inv_id}.invoice_total_cents == 10500"
            - "Invoice.${inv_id}.match_status == EXCEPTION"
            - "exactly one MatchException exists for the invoice with reason == AMOUNT_OVER_TOLERANCE"

      - name: composite_score_round_each_then_sum_mode_b
        grounds:
          - calculations.composite_score
          - calculations.on_time_delivery_rate
          - entities.VendorScorecard.fields.composite_score
          - entities.VendorScorecard.fields.on_time_rate_pct
          - entities.VendorScorecard.fields.exception_pct
        distinguishing_aspect: |
          MODE (b): nested rounding where ORDER matters. The period is built from 3 POSTED receipts
          on one vendor: on-time 1 of 3 (on_time_rate_pct=rhu(100*1/3)=33), exceptions 2 of 3
          (exception_pct=rhu(100*2/3)=67 -> reliability=33), and the single MATCHED invoice's lines
          are all within tolerance (price_compliance_pct=100). composite_score pins
          ROUND-EACH-THEN-SUM: c1=rhu(33*0.5)=17 (rhu of 16.5), c2=rhu(100*0.3)=30, c3=rhu(33*0.2)=7
          (rhu of 6.6) -> 54; the forbidden sum-then-round path rhu(16.5+30.0+6.6)=rhu(53.1)=53
          differs by exactly 1. The implementation MUST emit 54, distinguishing this rounding-order
          probe from the mode-(a) three_way_match gate-chain instance.
        test_recipe:
          setup:
            - "ProcurementAdmin created Vendor V (grace_days=0) and category CAT (preferred_vendor_id=V, thresholds set high so a single MANAGER approval suffices)."
            - "Three STANDARD POs are issued for V, each one A-line qty=1 unit_price_cents=1000, each promised_lead_days=10 from its 2026-03-01 issuance (promised_date 2026-03-11)."
            - "PO#1 receipt is on-time (received_at 2026-03-05) and its invoice MATCHES within tolerance; PO#2 and PO#3 receipts are late (received_at 2026-03-20) and their invoices FAIL price tolerance (EXCEPTION)."
            - "Period [2026-03-01, 2026-03-31): on-time 1/3=33, exceptions 2/3=67, price_compliance over the single matched invoice's lines = 100."
          setup_api_calls:
            - call: "POST /procurement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProcurementAdmin
            - call: "POST /procurement/vendors"
              payload: { name: "Vendor V", tax_id: "TAX-V-4", grace_days: 0 }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
            - call: "POST /procurement/spend-categories"
              payload: { name: "Office", code: "OFFICE4", approval_threshold_cents: 100000000, director_threshold_cents: 200000000, preferred_vendor_id: "${v_id}" }
              as: ProcurementAdmin
              captures: { cat_id: $.data.id }
            # ---- PO#1 : on-time + MATCHED within tolerance ----
            - call: "POST /procurement/requisitions"
              payload: { spend_category_id: "${cat_id}", title: "P1", lines: [ { sku: "A", description: "A", quantity: 1, estimated_unit_price_cents: 1000 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { req1_id: $.data.id }
            - call: "POST /procurement/requisitions/${req1_id}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "POST /procurement/requisitions/${req1_id}/approve"
              payload: { decision: "APPROVE" }
              as: Approver
              as_user_id: "approver-mgr"
            - call: "POST /procurement/rfqs"
              payload: { requisition_id: "${req1_id}", open_at: "2026-03-01T00:00:00Z", close_at: "2026-03-02T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { rfq1_id: $.data.id }
            - call: "POST /procurement/quotes"
              payload: { rfq_id: "${rfq1_id}", vendor_id: "${v_id}", submitted_at: "2026-03-01T06:00:00Z", unit_prices: [ { sku: "A", unit_price_cents: 1000, promised_lead_days: 10 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { quote1_id: $.data.id }
            - call: "POST /procurement/rfqs/${rfq1_id}/award"
              payload: { awarded_quote_id: "${quote1_id}" }
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "POST /procurement/purchase-orders"
              payload: { vendor_id: "${v_id}", spend_category_id: "${cat_id}", po_type: "STANDARD", requisition_id: "${req1_id}", source_quote_id: "${quote1_id}" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { po1_id: $.data.id }
            - call: "POST /procurement/goods-receipts"
              payload: { purchase_order_id: "${po1_id}", received_lines: [ { sku: "A", received_qty: 1 } ], received_at: "2026-03-05T00:00:00Z" }
              as: Receiver
              as_user_id: "receiver-r1"
              captures: { gr1_id: $.data.id }
            - call: "POST /procurement/invoices"
              payload: { vendor_id: "${v_id}", purchase_order_id: "${po1_id}", goods_receipt_id: "${gr1_id}", invoice_number: "INV-CS-1", lines: [ { sku: "A", billed_qty: 1, billed_unit_price_cents: 1000 } ] }
              as: PayablesClerk
              as_user_id: "clerk-c1"
              captures: { inv1_id: $.data.id }
            - call: "POST /procurement/invoices/${inv1_id}/match"
              payload: {}
              as: Matcher
              as_user_id: "matcher-m1"
            # ---- PO#2 : late + EXCEPTION (price over tolerance) ----
            - call: "POST /procurement/requisitions"
              payload: { spend_category_id: "${cat_id}", title: "P2", lines: [ { sku: "A", description: "A", quantity: 1, estimated_unit_price_cents: 1000 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { req2_id: $.data.id }
            - call: "POST /procurement/requisitions/${req2_id}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "POST /procurement/requisitions/${req2_id}/approve"
              payload: { decision: "APPROVE" }
              as: Approver
              as_user_id: "approver-mgr"
            - call: "POST /procurement/rfqs"
              payload: { requisition_id: "${req2_id}", open_at: "2026-03-01T00:00:00Z", close_at: "2026-03-02T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { rfq2_id: $.data.id }
            - call: "POST /procurement/quotes"
              payload: { rfq_id: "${rfq2_id}", vendor_id: "${v_id}", submitted_at: "2026-03-01T06:00:00Z", unit_prices: [ { sku: "A", unit_price_cents: 1000, promised_lead_days: 10 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { quote2_id: $.data.id }
            - call: "POST /procurement/rfqs/${rfq2_id}/award"
              payload: { awarded_quote_id: "${quote2_id}" }
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "POST /procurement/purchase-orders"
              payload: { vendor_id: "${v_id}", spend_category_id: "${cat_id}", po_type: "STANDARD", requisition_id: "${req2_id}", source_quote_id: "${quote2_id}" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { po2_id: $.data.id }
            - call: "POST /procurement/goods-receipts"
              payload: { purchase_order_id: "${po2_id}", received_lines: [ { sku: "A", received_qty: 1 } ], received_at: "2026-03-20T00:00:00Z" }
              as: Receiver
              as_user_id: "receiver-r1"
              captures: { gr2_id: $.data.id }
            - call: "POST /procurement/invoices"
              payload: { vendor_id: "${v_id}", purchase_order_id: "${po2_id}", goods_receipt_id: "${gr2_id}", invoice_number: "INV-CS-2", lines: [ { sku: "A", billed_qty: 1, billed_unit_price_cents: 2000 } ] }
              as: PayablesClerk
              as_user_id: "clerk-c1"
              captures: { inv2_id: $.data.id }
            - call: "POST /procurement/invoices/${inv2_id}/match"
              payload: {}
              as: Matcher
              as_user_id: "matcher-m1"
            # ---- PO#3 : late + EXCEPTION (price over tolerance) ----
            - call: "POST /procurement/requisitions"
