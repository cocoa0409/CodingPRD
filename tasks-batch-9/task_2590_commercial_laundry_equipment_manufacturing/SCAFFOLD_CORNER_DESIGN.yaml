        grounds:
          - validations[priority=57]
          - errors[ERR_STOCK_ADJUSTMENT_NEGATIVE]
        distinguishing_aspect: "The guard is on the RESULT, not on the sign of the delta: -1 from 1 is fine, -2 from 1 is 422, and the rejected adjustment leaves both on_hand_qty and version untouched."
        test_recipe:
          setup: ["ServicePart BRG-2040 adjusted up to on_hand_qty 1"]
          setup_api_calls:
            - call: "POST /clm/service-parts"
              payload: { part_number: "BRG-2040", component_class: "BEARING", fits_product_lines: ["ON_PREMISES", "VENDED"], fits_min_capacity_lb: 20, fits_max_capacity_lb: 80, rated_duty_cycles: 30000, warranty_months: 36, unit_price_cents: 42000, requires_cert_scope: "DIAGNOSTICS_TOOL", reorder_point_qty: 2 }
