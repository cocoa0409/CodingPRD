      - name: feature_code_plan_state_and_cross_specification_mismatches_each_have_a_trigger
        claim_type: violation_to_error
        grounds:
          - validations[priority=31]
          - validations[priority=33]
          - validations[priority=34]
          - validations[priority=18]
          - validations[priority=17]
