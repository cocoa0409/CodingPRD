            - call: "POST /dough-ops/facilities/${f1_id}/production-plans/${p2_id}/release"
              payload: { expected_facility_version: "${f1_v_pre_rel2}" }
              as: FacilityPlanner
            - call: "POST /dough-ops/facilities/${f1_id}/routes"
              payload: { production_date: "2026-09-11", vehicle_capacity_units: 1000 }
              as: RouteDispatcher
