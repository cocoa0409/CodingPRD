            - "${w1_over_error} == 'ERR_PAYMENT_EXCEEDS_PAYOFF' with HTTP 422 — 600000 exceeds note W1's net payoff 506497 by 93503, which is beyond the 50000 tolerance, so the remainder rule has a hard ceiling"

      - name: decay_function_rebate_declines_per_paid_installment_and_resets_on_reversal
        claim_type: decay_function
        grounds:
          - calculations.unearned_finance_charge_rebate.formula
          - calculations.unearned_finance_charge_rebate.input_set
          - state_machines.Payment.POSTED_to_REVERSED
        distinguishing_aspect: |
          The Rule-of-78s rebate is a decay curve whose only clock is the COUNT of PAID installments,
          not elapsed time: r == installment_count - count(PAID). Three points on the curve are read at
          the SAME as_of_date so time is held fixed — r == 6 gives 37650 (the whole finance charge,
          pinned there by the min(·, unpaid_finance_charge) cap), r == 5 gives 26893, and reversing the
          payment restores r == 6 and puts the curve exactly back to 37650. The reset leg is what
          distinguishes this from a monotone accumulator: an implementation that decays a stored
          counter forward-only cannot recover 37650 after the reversal.
        test_recipe:
          setup:
            - "the canonical TX regime with an effective License and one ACTIVE 600k note whose installments are all SCHEDULED"
            - "the clock sits at 2026-09-05, before any due date, and every quote below is taken with as_of_date 2026-09-05 so no time-based term changes between readings"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-rate-rules"
              payload: { state_code: "TX", finance_charge_method: "ADD_ON", max_annual_rate_bps: 1800, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 10, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 10000, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3, license_required: true }
              as: ComplianceOfficer
              captures: { df_rule: "$.data.id" }
            - call: "POST /state-rate-rules/${df_rule}/licenses"
              payload: { license_number: "PFC-TX-001", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ComplianceOfficer
            - call: "POST /insureds"
              payload: { legal_name: "Cascade Logistics Inc", mailing_state_code: "TX", email: "ap@cascade.example" }
              as: FinanceAnalyst
              captures: { df_insured: "$.data.id" }
            - call: "POST /agents"
              payload: { agency_name: "Lone Star Brokers", state_code: "TX", agent_commission_bps: 1200, chargeback_basis: "COMMISSION_CAPPED", chargeback_liability_cap_cents: 500000, initial_reserve_balance_cents: 100000 }
              as: ComplianceOfficer
              captures: { df_agent: "$.data.id" }
            - call: "POST /insurers"
              payload: { carrier_name: "Meridian Casualty", naic_code: "10123", status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { df_insurer: "$.data.id" }
            - call: "POST /agreements"
              payload: { insured_id: "${df_insured}", producer_agent_id: "${df_agent}", state_rule_id: "${df_rule}", down_payment_cents: 100000, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { df_agr: "$.data.id" }
            - call: "POST /agreements/${df_agr}/policies"
              payload: { insurer_id: "${df_insurer}", policy_number: "MC-DF-1", gross_premium_cents: 600000, effective_date: "2026-09-01", expiration_date: "2027-09-01", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { df_pol: "$.data.id" }
            - call: "POST /agreements/${df_agr}/submit"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
            - call: "POST /policies/${df_pol}/verifications"
              payload: { decision: "CONFIRMED" }
              as: Insurer
              as_user_id: "${df_insurer}"
            - call: "POST /policies/${df_pol}/verifications"
              payload: { decision: "CONFIRMED" }
              as: ProducerAgent
              as_user_id: "${df_agent}"
            - call: "POST /agreements/${df_agr}/activate"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /agreements/${df_agr}/payoff-quote"
              payload: { as_of_date: "2026-09-05" }
              as: Insured
              as_user_id: "${df_insured}"
              captures: { df_r6_gross: "$.data.gross_balance_cents", df_r6_rebate: "$.data.unearned_finance_charge_rebate_cents", df_r6_net: "$.data.net_payoff_cents" }
            - call: "POST /agreements/${df_agr}/payments"
              payload: { amount_cents: 89941, received_date: "2026-09-05", method: "ACH" }
              as: FinanceAnalyst
              captures: { df_pay: "$.data.id", df_pay_variant: "$.data.allocation_variant", df_pay_fc: "$.data.applied_finance_charge_cents", df_pay_pr: "$.data.applied_principal_cents" }
            - call: "GET /agreements/${df_agr}/payoff-quote"
              payload: { as_of_date: "2026-09-05" }
              as: Insured
              as_user_id: "${df_insured}"
              captures: { df_r5_gross: "$.data.gross_balance_cents", df_r5_rebate: "$.data.unearned_finance_charge_rebate_cents", df_r5_net: "$.data.net_payoff_cents" }
            - call: "POST /payments/${df_pay}/reverse"
              payload: { reversal_reason: "NSF" }
              as: FinanceAnalyst
              captures: { df_rev_status: "$.data.status" }
            - call: "GET /agreements/${df_agr}/payoff-quote"
              payload: { as_of_date: "2026-09-05" }
              as: Insured
              as_user_id: "${df_insured}"
              captures: { df_reset_gross: "$.data.gross_balance_cents", df_reset_rebate: "$.data.unearned_finance_charge_rebate_cents", df_reset_net: "$.data.net_payoff_cents" }
            - call: "GET /agreements/${df_agr}/installments"
              payload: { status: "SCHEDULED", limit: 100 }
              as: FinanceAnalyst
          assert:
            - "at r == 6 the raw curve is round_half_up(37650 * 6 * 7 / (6 * 7)) == 37650, which the min(·, unpaid_finance_charge 37650) cap leaves unchanged: ${df_r6_rebate} == 37650, ${df_r6_gross} == 539650 and ${df_r6_net} == 502000"
            - "the 89941 payment is ${df_pay_variant} == 'STANDARD' (89941 < 502000) and pays installment 1 whole with ${df_pay_fc} == 6275 and ${df_pay_pr} == 83666"
            - "at r == 5 the curve drops: ${df_r5_rebate} == 26893 == round_half_up(37650 * 5 * 6 / 42) == round_half_up(26892.857), under the cap of unpaid_finance_charge 31375"
            - "${df_r5_gross} == 449709 == 418334 + 31375 and ${df_r5_net} == 422816 == 449709 - 26893"
            - "the decay is driven by the PAID count and nothing else: as_of_date is 2026-09-05 in all three readings, so no elapsed-time term can explain the change from 37650 to 26893"
            - "RESET: ${df_rev_status} == 'REVERSED' and the third quote returns to the r == 6 point exactly — ${df_reset_rebate} == 37650, ${df_reset_gross} == 539650 and ${df_reset_net} == 502000"
            - "GET /agreements/${df_agr}/installments?status=SCHEDULED returns total_count == 6 after the reversal, confirming count(PAID) is back to 0 and therefore r is back to 6"

