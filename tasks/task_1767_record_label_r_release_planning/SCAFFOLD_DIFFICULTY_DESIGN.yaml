  - rule_id: combinatorial_formula
    instances:
      - name: tiered_rate_with_option_escalation_straddle
        grounds:
          - calculations.royalty_statement_computation
          - calculations.effective_base_rate
          - entities.Label.fields.tier_thresholds
        distinguishing_aspect: |
          Mode (a) — a >=3-input non-linear formula: marginal tiered-rate
          selection (effective base 1950 = 1800 + 1 x 150 escalation) applied
          per line by cumulative-unit position across the 500000 threshold:
          line at position 500000 earns 17, lines at 500001/500002 earn 18,
          total 53 (vs 51 if all tier-1, 54 if all tier-2).
        test_recipe:
          setup:
            - "Label defaults; artist signed (advance 0, base 1800, MASTER_ONLY, options_total 1, escalation 150, term 12m); contract ACTIVE and FUNDED (advance 0)"
            - "SINGLE release LIVE (release_date 2026-09-01)"
            - "Prior period 2026-Q2: one STREAMING report units 499999 gross 100000; run 2026-Q2 closed/calculated/finalized (that statement earned round(70000 x 0.18) = 12600 at tier 1)"
            - "Clock advanced to 2027-05-15; sweep moves contract to OPTION_WINDOW; option exercised -> EXTENDED, options_exercised 1, effective_base_rate_bps 1950"
            - "Current period 2026-Q3: three DOWNLOAD reports, units 1, gross 100 each, created sequentially"
            - "Run 2026-Q3 CLOSED then CALCULATED"
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label A" }, as: LabelAdmin, captures: { label_id: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Artist A", genre: "POP", birth_date: "1995-04-12", monthly_streams: 600000, social_followers: 800000, engagement_rate: 0.5, live_draw_avg: 1000 }, as: AnRManager, captures: { artist_id: $.data.id } }
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { advance_cents: 0, base_royalty_rate_bps: 1800, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 1, option_term_months: 12, option_escalation_bps: 150, term_months: 12, valid_until_date: "2028-06-01" }, as: AnRManager, captures: { memo_id: $.data.id } }
            - { call: "POST /api/deal-memos/${memo_id}/propose", payload: {}, as: AnRManager }
            - { call: "POST /api/deal-memos/${memo_id}/approve", payload: {}, as: LabelAdmin }
            - { call: "POST /api/deal-memos/${memo_id}/execute", payload: {}, as: LabelAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /api/contracts/${contract_id}/recording-projects", payload: { title: "P-A", project_type: "SINGLE", budget_cents: 100000 }, as: AnRManager, captures: { proj_id: $.data.id } }
            - { call: "POST /api/recording-projects/${proj_id}/start", payload: {}, as: AnRManager }
            - { call: "POST /api/recording-projects/${proj_id}/tracks", payload: { title: "TA", duration_seconds: 200, isrc: "USRC10000021" }, as: AnRManager, captures: { trk_id: $.data.id } }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/contracts/${contract_id}/releases", payload: { project_id: "${proj_id}", title: "R-A", release_type: "SINGLE", release_date: "2026-09-01", track_ids: ["${trk_id}"] }, as: AnRManager, captures: { rel_id: $.data.id } }
            - { call: "POST /api/releases/${rel_id}/assemble", payload: {}, as: AnRManager }
            - { call: "POST /api/releases/${rel_id}/lock-assets", payload: { cover_art_confirmed: true }, as: AnRManager }
            - { call: "POST /api/releases/${rel_id}/schedule", payload: {}, as: MarketingManager }
            - { call: "POST /api/distributors", payload: { label_id: "${label_id}", name: "DSP-A", channel_type: "DSP" }, as: LabelAdmin, captures: { dist_id: $.data.id } }
            - { call: "POST /api/releases/${rel_id}/deliveries", payload: { distributor_ids: ["${dist_id}"] }, as: MarketingManager, captures: { del_id: "$.data[0].id" } }
            - { call: "POST /api/asset-deliveries/${del_id}/transmit", payload: {}, as: MarketingManager }
            - { call: "POST /api/asset-deliveries/${del_id}/acknowledge", payload: {}, as: MarketingManager }
