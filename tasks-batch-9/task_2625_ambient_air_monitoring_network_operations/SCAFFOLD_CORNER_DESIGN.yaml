        excluded_because:
          difficulty_instance: transitive_cascade / site_shutdown_cascade_monitor_batch_package_submission
          rationale: "The five-hop SHUTDOWN cascade over Monitor, DataBatch, CertificationPackage and the submission dimension is asserted hop by hop by the named difficulty instance."

      - name: monitor_approval_is_guarded_by_the_reference_method_designation
        claim_type: guarded_transitions
        grounds:
