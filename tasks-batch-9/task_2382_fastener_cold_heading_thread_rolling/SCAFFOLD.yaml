  - { id: ERR_FURNACE_CAPACITY_EXCEEDED, http: 422, condition: "Computed charge mass exceeds the furnace's maximum charge" }

# =============================================================================
# §1.7 RBAC Matrix (segregation of duties; every role's X-User-ID is an operator id)
# =============================================================================
roles:
  - name: ProcessEngineer
    description: "Owns wire preparation, tooling and heading: registers part specs, wire lots, tools and furnaces, mounts and regrinds dies, opens and aborts lots, queues and closes secondary operations"
    identity: opaque
    exclusive_operations: ["POST /part-specs", "PATCH /part-specs/{id}", "POST /wire-lots", "POST /heading-tools", "POST /heading-tools/{id}/mount", "POST /heading-tools/{id}/regrind", "POST /furnaces", "POST /production-lots", "POST /production-lots/{id}/complete-heading", "POST /production-lots/{id}/abort-heading", "POST /production-lots/{id}/secondary-operations", "POST /secondary-operations/{id}/complete"]
    shared_operations: ["POST /steel-heats", "POST /heading-tools/{id}/condemn", "POST /heat-treat-runs", "POST /plating-runs", "all GET endpoints", "POST /_clock/set_current_utc"]

  - name: HeatTreatOperator
    description: "Runs furnaces, plating lines and relief bakes"
    identity: opaque
    exclusive_operations: ["POST /heat-treat-runs/{id}/start", "POST /plating-runs/{id}/complete-plating", "POST /plating-runs/{id}/start-bake", "POST /plating-runs/{id}/complete-bake"]
    shared_operations: ["POST /heat-treat-runs", "POST /plating-runs", "all GET endpoints", "POST /_clock/set_current_utc"]

  - name: QualityInspector
    description: "Verifies mill certificates, releases wire, records heat treat results, performs destructive lot tests and may draft certificates — but may never sign a certificate citing its own test"
    identity: opaque
    exclusive_operations: ["POST /steel-heats/{id}/verify-mill-cert", "POST /wire-lots/{id}/release", "POST /heat-treat-runs/{id}/results", "POST /lot-tests", "POST /lot-tests/{id}/results"]
    shared_operations: ["POST /steel-heats", "POST /heading-tools/{id}/condemn", "POST /production-lots/{id}/hold", "POST /certification-documents", "all GET endpoints", "POST /_clock/set_current_utc"]

  - name: QualityManager
    description: "Owns counterfeit flagging, hold release and the certificate lifecycle; signs certificates under segregation of duties"
    identity: opaque
    exclusive_operations: ["POST /steel-heats/{id}/flag-counterfeit", "POST /production-lots/{id}/release-hold", "POST /certification-documents/{id}/issue", "POST /certification-documents/{id}/revoke", "POST /certification-documents/{id}/reissue"]
    shared_operations: ["POST /production-lots/{id}/hold", "POST /certification-documents", "all GET endpoints", "POST /_clock/set_current_utc"]

  - name: ShippingClerk
    description: "Owns packaging and shipment of certified lots"
    identity: opaque
    exclusive_operations: ["POST /pack-units", "POST /pack-units/{id}/seal", "POST /pack-units/{id}/reopen", "POST /pack-units/{id}/ship"]
    shared_operations: ["all GET endpoints", "POST /_clock/set_current_utc"]

  - name: PlantAdmin
    description: "Master-data administrator: may register reference data but may not operate the process, test, certify or ship"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["POST /part-specs", "PATCH /part-specs/{id}", "POST /steel-heats", "POST /wire-lots", "POST /heading-tools", "POST /furnaces", "all GET endpoints", "POST /_clock/set_current_utc"]




