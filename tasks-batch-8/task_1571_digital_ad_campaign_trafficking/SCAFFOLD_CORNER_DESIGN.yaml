            - "LI1 snapshot 3000 imps / 150 clicks; LI2 snapshot 2000 imps / 100 clicks"
            - "DOUBLEVERIFY reports: LI1 viewable 70000/100000 (PASS), LI2 viewable 30000/100000 (BREACH on viewability, ivt 0 → no cascade)"
            - "clock 2026-08-11; both COMPLETED; IO COMPLETED"
