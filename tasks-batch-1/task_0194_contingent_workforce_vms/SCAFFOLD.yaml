# =============================================================================
# Scaffold: contingent-workforce-vms benchmark seed tables (v1)
# Vendor Management System (VMS) for a contingent / contract workforce program.
# Flat topology: every entity is a top-level collection under /vms; cross-entity
# links are foreign keys carried in request bodies (no nested resource URLs).
# =============================================================================

scenario: |
  Contingent Workforce / VMS: requisition/SOW, supplier distribution, candidate
  submittal/rate, co-employment tenure limit, timesheet/expense approval,
  markup/bill-vs-pay rate, milestone/deliverable, offboarding

domain_name: contingent-workforce-vms
api_prefix: /vms

# Expert band per §0.4: 11 entities, 65 endpoints, 28 error codes, 5 calculations
# (multiple dual-variant / combinatorial), 7 state machines (cyclic rate
# negotiation, parallel compliance dimensions on Assignment, branching-with-revert
# approval flows). Difficulty lives in the coupling: tenure rollup spans
# assignments, markup couples Program+Requisition+Submittal, the distribution
# waterfall is clock-gated, and OCC guards the hire race on requisition openings.
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # All entities are flat sibling collections under /vms with FK fields in the
  # body. Crosses: Distribution junctions Requisition<->Supplier (many-to-many);
  # Submittal references Requisition+Supplier+WorkerProfile; Assignment tenure
  # rolls up onto WorkerProfile (cross-aggregate, spans many assignments).

  state_machine_shape: parallel
  # Assignment carries two independent dimensions (engagement_status x
  # compliance_status). Submittal is cyclic (rate-negotiation rounds). Timesheet,
  # Expense, Milestone are branching with revert (reject -> rework).

  relationship_patterns:
    - one_to_many        # Program -> Requisition/SOW/Supplier; Assignment -> Timesheet/Expense
    - many_to_many       # Requisition <-> Supplier via Distribution
    - cross_aggregate    # Assignment tenure rolls up onto WorkerProfile across assignments

  role_model: peer_roles
  # ProgramManager (MSP) owns program/req/SOW lifecycle, distribution, hiring,
  # assignment lifecycle and the clock; Supplier owns submittals + timesheet/
  # expense + milestone progress; HiringManager owns shortlist/offer/acceptance;
  # Finance owns invoicing. Non-overlapping ownership of resource types.

  consistency_model: immediate

# =============================================================================
# Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: client_name, type: string, source: input, description: "End-client company name" }
      - { name: default_markup_pct, type: number, source: input, description: "Default supplier markup as a fraction (0.45 = 45%); applied to pay rate to derive bill rate when a submittal omits an explicit bill rate", constraints: ">= 0 and <= 2.0" }
      - { name: max_markup_pct, type: number, source: input, description: "Hard ceiling on markup; any submittal whose effective markup exceeds this is rejected", constraints: ">= 0 and <= 2.0" }
      - { name: coemployment_tenure_limit_days, type: integer, source: input, description: "Maximum cumulative engaged calendar days a single worker may serve across all assignments in this program before a mandatory break (co-employment limit)", constraints: ">= 2" }
      - { name: tenure_warning_threshold_days, type: integer, source: input, description: "Cumulative engaged-days mark at or beyond which an active assignment flips compliance_status to TENURE_WARNING", constraints: ">= 1 and < coemployment_tenure_limit_days" }
      - { name: timesheet_approval_window_days, type: integer, source: input, default: 7, description: "Days a SUBMITTED timesheet may sit before auto-approval at clock advance", constraints: ">= 1" }
      - { name: current_clock, type: datetime, source: system, description: "Program logical clock (UTC); starts at 1970-01-01T00:00:00.000Z, advanced only via advance_clock / _clock/set" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED | CLOSED" }

  - name: Supplier
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: name, type: string, source: input, description: "Staffing supplier / vendor name" }
      - { name: tier, type: integer, source: input, description: "Distribution tier (1 = primary, released first); lower number releases earlier in the waterfall", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED; SUSPENDED suppliers cannot receive distributions or create submittals" }

  - name: WorkerProfile
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: full_name, type: string, source: input, description: "Worker legal name" }
      - { name: national_id_hash, type: string, source: input, description: "Opaque hashed identifier used to detect the same human across submittals/assignments; unique per program" }
      - { name: cumulative_engaged_days, type: integer, source: computed, default: 0, description: "Sum of engaged calendar days across all this worker's ACTIVE, ON_HOLD and ENDED assignments in the program; drives the co-employment tenure limit" }
      - { name: tenure_status, type: enum, source: computed, default: "CLEAR", description: "CLEAR | WARNING | BREACH — derived from cumulative_engaged_days vs Program thresholds" }

  - name: Requisition
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: title, type: string, source: input, description: "Role title" }
      - { name: openings, type: integer, source: input, description: "Number of headcount openings to fill", constraints: ">= 1" }
      - { name: filled_count, type: integer, source: computed, default: 0, description: "Number of HIRED submittals against this requisition" }
      - { name: max_pay_rate_cents, type: integer, source: input, description: "Per-hour pay-rate ceiling in cents a supplier may submit", constraints: ">= 1" }
      - { name: tier_release_interval_hours, type: integer, source: input, default: 24, description: "Hours each supplier tier is held exclusive before the next distinct tier is released in the distribution waterfall", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | DISTRIBUTED | FILLED | CLOSED | CANCELLED" }

  - name: Distribution
    parent: Requisition
    common_fields: true
    fields:
      - { name: requisition_id, type: string, source: input, description: "FK -> Requisition.id" }
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id" }
      - { name: tier_at_distribution, type: integer, source: system, description: "Snapshot of Supplier.tier when the requisition was distributed; lower tiers release earlier" }
      - { name: released_at, type: datetime, source: computed, description: "Clock time at which this supplier's tier becomes eligible to submit (DISTRIBUTED clock + cumulative earlier-tier intervals)" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | RELEASED | REVOKED — RELEASED means the supplier may create submittals" }

  - name: Submittal
    parent: Requisition
    common_fields: true
    fields:
      - { name: requisition_id, type: string, source: input, description: "FK -> Requisition.id" }
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id" }
      - { name: worker_profile_id, type: string, source: input, description: "FK -> WorkerProfile.id" }
      - { name: pay_rate_cents, type: integer, source: input, description: "Per-hour rate paid to the worker, in cents", constraints: ">= 1" }
      - { name: bill_rate_cents, type: integer, source: input, required: false, description: "Per-hour rate billed to the client, in cents; if omitted, derived as round_half_up(pay_rate_cents * (1 + Program.default_markup_pct))" }
      - { name: effective_markup_pct, type: number, source: computed, description: "(bill_rate_cents / pay_rate_cents) - 1, evaluated at submittal creation and on propose_rate" }
      - { name: rounds, type: integer, source: computed, default: 0, description: "Number of completed rate-negotiation rounds (increments each time a RATE_PROPOSED submittal returns to INTERVIEWING via counter_rate)" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | SHORTLISTED | INTERVIEWING | RATE_PROPOSED | OFFERED | HIRED | REJECTED | WITHDRAWN" }

  - name: Assignment
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: submittal_id, type: string, source: system, description: "FK -> Submittal.id" }
      - { name: worker_profile_id, type: string, source: system, description: "FK -> WorkerProfile.id" }
      - { name: pay_rate_cents, type: integer, source: system, description: "Final agreed pay rate copied from the hired submittal" }
      - { name: bill_rate_cents, type: integer, source: system, description: "Final agreed bill rate copied from the hired submittal" }
      - { name: start_date, type: datetime, source: input, description: "Engagement start (inclusive, calendar date at UTC midnight)" }
      - { name: planned_end_date, type: datetime, source: input, description: "Planned engagement end (inclusive)" }
      - { name: actual_end_date, type: datetime, source: computed, description: "Set when offboarded; clock date at offboarding; null while not ENDED" }
      - { name: engaged_days, type: integer, source: computed, default: 0, description: "Inclusive calendar days from start_date to (actual_end_date if ENDED else current program clock date)" }
      - { name: engagement_status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | ON_HOLD | ENDED — engagement dimension" }
      - { name: compliance_status, type: enum, source: system, default: "CLEAR", description: "CLEAR | TENURE_WARNING | TENURE_BREACH — compliance dimension, evolves independently of engagement_status" }

  - name: StatementOfWork
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id" }
      - { name: title, type: string, source: input, description: "SOW title" }
      - { name: total_value_cents, type: integer, source: input, description: "Not-to-exceed contract value in cents; sum of accepted/invoiced milestone amounts may not exceed this", constraints: ">= 1" }
      - { name: invoiced_value_cents, type: integer, source: computed, default: 0, description: "Sum of milestone_amount_cents over INVOICED milestones" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ACTIVE | COMPLETED | CLOSED | CANCELLED" }

  - name: Milestone
    parent: StatementOfWork
    common_fields: true
    fields:
      - { name: statement_of_work_id, type: string, source: input, description: "FK -> StatementOfWork.id" }
      - { name: name, type: string, source: input, description: "Deliverable / milestone name" }
      - { name: milestone_amount_cents, type: integer, source: input, description: "Fixed payment for this milestone in cents", constraints: ">= 1" }
      - { name: sequence, type: integer, source: input, description: "Ordering index within the SOW; a milestone may not be SUBMITTED until all lower-sequence milestones are ACCEPTED or INVOICED", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | IN_PROGRESS | SUBMITTED | ACCEPTED | REJECTED | INVOICED" }

  - name: Timesheet
    parent: Assignment
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id" }
      - { name: week_start_date, type: datetime, source: input, description: "Monday of the reported week (UTC midnight); unique per assignment" }
      - { name: regular_hours, type: number, source: input, description: "Regular hours in the week", constraints: ">= 0 and <= 168" }
      - { name: overtime_hours, type: number, source: input, default: 0, description: "Overtime hours in the week, billed at OT multiplier", constraints: ">= 0 and <= 168" }
      - { name: submitted_at, type: datetime, source: computed, description: "Clock time the timesheet was SUBMITTED; null while DRAFT" }
      - { name: bill_amount_cents, type: integer, source: computed, default: 0, description: "Client-billed amount, computed at APPROVED" }
      - { name: pay_amount_cents, type: integer, source: computed, default: 0, description: "Worker-pay amount, computed at APPROVED" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | APPROVED | REJECTED | INVOICED" }

  - name: Expense
    parent: Assignment
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id" }
      - { name: category, type: enum, source: input, description: "TRAVEL | LODGING | MEALS | EQUIPMENT | OTHER" }
      - { name: amount_cents, type: integer, source: input, description: "Submitted expense amount in cents", constraints: ">= 1" }
      - { name: billable, type: boolean, source: input, default: true, description: "Whether the expense is passed through to the client (billable) or absorbed by the supplier" }
      - { name: reimbursable_amount_cents, type: integer, source: computed, default: 0, description: "Amount actually reimbursed after per-category cap, computed at APPROVED" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | APPROVED | REJECTED | INVOICED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Requisition
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: DISTRIBUTED
        trigger: "POST /vms/requisitions/{id}/distribute"
        actor: ProgramManager
        preconditions:
          - "Program.status == ACTIVE (else ERR_PROGRAM_NOT_ACTIVE)"
          - "Request body supplier_ids lists >= 1 supplier, all ACTIVE and in this program (else ERR_SUPPLIER_NOT_ELIGIBLE)"
        side_effects:
          - "Create one Distribution per listed supplier with tier_at_distribution = Supplier.tier"
          - "Compute each Distribution.released_at via distribution_waterfall; lowest-tier Distributions become RELEASED immediately, higher tiers PENDING"
          - "increments Requisition.version by 1"
      - from: DISTRIBUTED
        to: DISTRIBUTED
        trigger: "system (advance_clock crosses a Distribution.released_at)"
        actor: system
        preconditions:
          - "A PENDING Distribution whose released_at <= new program clock exists"
        side_effects:
          - "Flip those Distributions PENDING -> RELEASED"
      - from: DISTRIBUTED
        to: FILLED
        trigger: "system (a Submittal HIRED transition sets Requisition.filled_count == openings)"
        actor: system
        preconditions:
          - "filled_count reaches openings"
        side_effects:
          - "Revoke all still-PENDING/RELEASED Distributions (status -> REVOKED)"
          - "Reject all non-terminal Submittals on this requisition (status -> REJECTED) via cascade"
      - from: DISTRIBUTED
        to: CLOSED
        trigger: "POST /vms/requisitions/{id}/close"
        actor: ProgramManager
        preconditions:
          - "Requisition is DISTRIBUTED"
        side_effects:
          - "Revoke all non-terminal Distributions (status -> REVOKED)"
          - "Reject all non-terminal Submittals (status -> REJECTED)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /vms/requisitions/{id}/cancel"
        actor: ProgramManager
        preconditions: []
        side_effects: []
      - from: DISTRIBUTED
        to: CANCELLED
        trigger: "POST /vms/requisitions/{id}/cancel"
        actor: ProgramManager
        preconditions:
          - "No HIRED submittals exist (else ERR_REQUISITION_HAS_HIRES)"
        side_effects:
          - "Revoke all non-terminal Distributions (status -> REVOKED)"
          - "Reject all non-terminal Submittals (status -> REJECTED)"
    note: "Transitions are not idempotent; re-distributing a DISTRIBUTED requisition returns ERR_INVALID_STATE."

  - entity: Submittal
    initial_state: SUBMITTED
    terminal_states: [HIRED, REJECTED, WITHDRAWN]
    note: "Cyclic via the INTERVIEWING <-> RATE_PROPOSED negotiation loop, capped at 5 rounds."
    transitions:
      - from: SUBMITTED
        to: SHORTLISTED
        trigger: "POST /vms/submittals/{id}/shortlist"
        actor: HiringManager
        preconditions:
          - "Requisition.status == DISTRIBUTED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: SHORTLISTED
        to: INTERVIEWING
        trigger: "POST /vms/submittals/{id}/start_interview"
        actor: HiringManager
        preconditions: []
        side_effects: []
      - from: INTERVIEWING
        to: RATE_PROPOSED
        trigger: "POST /vms/submittals/{id}/propose_rate"
        actor: Supplier
        preconditions:
          - "Proposed pay_rate_cents <= Requisition.max_pay_rate_cents (else ERR_PAY_RATE_EXCEEDS_MAX)"
          - "Resulting effective_markup_pct <= Program.max_markup_pct (else ERR_MARKUP_EXCEEDS_MAX)"
        side_effects:
          - "Update pay_rate_cents / bill_rate_cents / effective_markup_pct to the proposed values (bill_rate_and_markup)"
      - from: RATE_PROPOSED
        to: INTERVIEWING
        trigger: "POST /vms/submittals/{id}/counter_rate"
        actor: HiringManager
        preconditions:
          - "rounds < 5 (else ERR_NEGOTIATION_ROUNDS_EXCEEDED)"
        side_effects:
          - "increments Submittal.rounds by 1"
        note: "Cyclic negotiation loop."
      - from: RATE_PROPOSED
        to: OFFERED
        trigger: "POST /vms/submittals/{id}/offer"
        actor: HiringManager
        preconditions:
          - "Requisition.filled_count < Requisition.openings (else ERR_REQUISITION_FULL)"
        side_effects: []
      - from: OFFERED
        to: HIRED
        trigger: "POST /vms/submittals/{id}/hire"
        actor: ProgramManager
        preconditions:
          - "expected_requisition_version matches Requisition.version (else ERR_STALE_VERSION)"
          - "Requisition.filled_count < Requisition.openings (else ERR_REQUISITION_FULL)"
          - "WorkerProfile.tenure_status != BREACH (else ERR_TENURE_LIMIT_REACHED)"
          - "The new [start_date, planned_end_date] closed interval does not overlap any non-ENDED Assignment of the same worker (else ERR_WORKER_DOUBLE_BOOKED)"
        side_effects:
          - "Create an Assignment (engagement_status=ACTIVE; compliance_status seeded from worker tenure_status) copying pay_rate_cents/bill_rate_cents"
          - "increments Requisition.filled_count by 1; if it reaches openings, drive Requisition DISTRIBUTED -> FILLED (cascade revoke distributions + reject siblings)"
          - "increments Requisition.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /vms/submittals/{id}/reject"
        actor: HiringManager
        preconditions: []
        side_effects: []
      - from: SHORTLISTED
        to: REJECTED
        trigger: "POST /vms/submittals/{id}/reject"
        actor: HiringManager
        preconditions: []
        side_effects: []
      - from: INTERVIEWING
        to: REJECTED
        trigger: "POST /vms/submittals/{id}/reject"
        actor: HiringManager
        preconditions: []
        side_effects: []
      - from: RATE_PROPOSED
        to: REJECTED
        trigger: "POST /vms/submittals/{id}/reject"
        actor: HiringManager
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /vms/submittals/{id}/withdraw"
        actor: Supplier
        preconditions: []
        side_effects: []
      - from: SHORTLISTED
        to: WITHDRAWN
        trigger: "POST /vms/submittals/{id}/withdraw"
        actor: Supplier
        preconditions: []
        side_effects: []
      - from: INTERVIEWING
        to: WITHDRAWN
        trigger: "POST /vms/submittals/{id}/withdraw"
        actor: Supplier
        preconditions: []
        side_effects: []
      - from: RATE_PROPOSED
        to: WITHDRAWN
        trigger: "POST /vms/submittals/{id}/withdraw"
        actor: Supplier
        preconditions: []
        side_effects: []

  - entity: Assignment
    initial_state: ACTIVE
    terminal_states: [ENDED]
    note: |
      Parallel dimensions on one row. engagement_status in {ACTIVE, ON_HOLD, ENDED}
      and compliance_status in {CLEAR, TENURE_WARNING, TENURE_BREACH} evolve
      independently. ENDED is the only terminal engagement state. compliance_status
      keeps updating until engagement_status reaches ENDED.
    transitions:
      - from: ACTIVE
        to: ON_HOLD
        trigger: "POST /vms/assignments/{id}/hold"
        actor: ProgramManager
        preconditions:
          - "engagement_status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects: []
        note: "engagement dimension"
      - from: ON_HOLD
        to: ACTIVE
        trigger: "POST /vms/assignments/{id}/resume"
        actor: ProgramManager
        preconditions:
          - "engagement_status == ON_HOLD (else ERR_INVALID_STATE)"
          - "compliance_status != TENURE_BREACH (else ERR_TENURE_LIMIT_REACHED)"
        side_effects: []
        note: "engagement dimension; cannot resume a tenure-breached worker"
      - from: ACTIVE
        to: ENDED
        trigger: "POST /vms/assignments/{id}/offboard"
        actor: ProgramManager
        preconditions:
          - "No SUBMITTED (pending-approval) Timesheet or Expense on this assignment (else ERR_OPEN_APPROVALS_PENDING)"
        side_effects:
          - "Set actual_end_date = current program clock date; freeze engaged_days at the inclusive count"
          - "Recompute WorkerProfile.cumulative_engaged_days and tenure_status (worker_tenure_rollup, cross-aggregate)"
        note: "engagement dimension (terminal)"
      - from: ON_HOLD
        to: ENDED
        trigger: "POST /vms/assignments/{id}/offboard"
        actor: ProgramManager
        preconditions:
          - "No SUBMITTED Timesheet or Expense on this assignment (else ERR_OPEN_APPROVALS_PENDING)"
        side_effects:
          - "Set actual_end_date = current program clock date; freeze engaged_days"
          - "Recompute WorkerProfile.cumulative_engaged_days and tenure_status"
        note: "engagement dimension (terminal)"
      - from: CLEAR
        to: TENURE_WARNING
        trigger: "system (advance_clock: worker cumulative_engaged_days reaches >= tenure_warning_threshold_days but < limit)"
        actor: system
        preconditions:
          - "engagement_status != ENDED"
          - "WorkerProfile.cumulative_engaged_days >= Program.tenure_warning_threshold_days AND < coemployment_tenure_limit_days"
        side_effects:
          - "compliance_status -> TENURE_WARNING (compliance dimension; engagement_status untouched)"
      - from: TENURE_WARNING
        to: TENURE_BREACH
        trigger: "system (advance_clock: worker cumulative_engaged_days reaches >= coemployment_tenure_limit_days)"
        actor: system
        preconditions:
          - "engagement_status != ENDED"
          - "WorkerProfile.cumulative_engaged_days >= Program.coemployment_tenure_limit_days"
        side_effects:
          - "compliance_status -> TENURE_BREACH"
          - "If engagement_status == ACTIVE, force engagement_status -> ON_HOLD (cross-dimension safety stop)"
        note: "compliance dimension; the only point where compliance forces an engagement change"
      - from: CLEAR
        to: TENURE_BREACH
        trigger: "system (advance_clock: a single jump pushes cumulative_engaged_days from below warning straight to >= limit)"
        actor: system
        preconditions:
          - "engagement_status != ENDED"
          - "WorkerProfile.cumulative_engaged_days >= Program.coemployment_tenure_limit_days AND prior compliance_status == CLEAR"
        side_effects:
          - "compliance_status -> TENURE_BREACH"
          - "If engagement_status == ACTIVE, force engagement_status -> ON_HOLD"
        note: "compliance dimension; large clock jumps may skip the WARNING band"

  - entity: StatementOfWork
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /vms/statements-of-work/{id}/activate"
        actor: ProgramManager
        preconditions:
          - "Program.status == ACTIVE (else ERR_PROGRAM_NOT_ACTIVE)"
          - "Supplier ACTIVE and in this program (else ERR_SUPPLIER_NOT_ELIGIBLE)"
          - "At least one Milestone exists (else ERR_SOW_NO_MILESTONES)"
          - "Sum of milestone_amount_cents over all milestones <= total_value_cents (else ERR_SOW_VALUE_EXCEEDED)"
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (a Milestone INVOICED transition leaves every milestone INVOICED)"
        actor: system
        preconditions:
          - "Every Milestone under the SOW is INVOICED"
        side_effects: []
        note: "compound/bubble-up: parent auto-derives from children"
      - from: COMPLETED
        to: CLOSED
        trigger: "POST /vms/statements-of-work/{id}/close"
        actor: ProgramManager
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /vms/statements-of-work/{id}/close"
        actor: ProgramManager
        preconditions:
          - "No SUBMITTED milestone awaiting acceptance (else ERR_OPEN_APPROVALS_PENDING)"
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /vms/statements-of-work/{id}/cancel"
        actor: ProgramManager
        preconditions: []
        side_effects: []

  - entity: Milestone
    initial_state: PENDING
    terminal_states: [INVOICED]
    note: "Branching-with-revert: SUBMITTED -> REJECTED -> IN_PROGRESS rework loop."
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "POST /vms/milestones/{id}/start"
        actor: Supplier
        preconditions:
          - "StatementOfWork.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects: []
      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "POST /vms/milestones/{id}/submit"
        actor: Supplier
        preconditions:
          - "All lower-sequence milestones in the same SOW are ACCEPTED or INVOICED (else ERR_MILESTONE_SEQUENCE_VIOLATION)"
        side_effects: []
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /vms/milestones/{id}/accept"
        actor: HiringManager
        preconditions:
          - "invoiced_value_cents + sum(milestone_amount_cents over already-ACCEPTED milestones in the SOW) + this milestone_amount_cents <= StatementOfWork.total_value_cents (else ERR_SOW_VALUE_EXCEEDED)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /vms/milestones/{id}/reject"
        actor: HiringManager
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: IN_PROGRESS
        trigger: "POST /vms/milestones/{id}/start"
        actor: Supplier
        preconditions:
          - "StatementOfWork.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects: []
        note: "branching-with-revert: rejected deliverable goes back to rework"
      - from: ACCEPTED
        to: INVOICED
        trigger: "POST /vms/milestones/{id}/invoice"
        actor: Finance
        preconditions:
          - "Milestone.status == ACCEPTED (else ERR_INVALID_STATE)"
        side_effects:
          - "increments StatementOfWork.invoiced_value_cents by milestone_amount_cents"
          - "If every milestone under the SOW is now INVOICED, drive SOW ACTIVE -> COMPLETED (bubble-up)"

  - entity: Timesheet
    initial_state: DRAFT
    terminal_states: [INVOICED]
    note: "Branching-with-revert: SUBMITTED -> REJECTED -> DRAFT rework loop."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /vms/timesheets/{id}/submit"
        actor: Supplier
        preconditions:
          - "Assignment.engagement_status == ACTIVE (else ERR_ASSIGNMENT_NOT_ACTIVE)"
          - "regular_hours + overtime_hours > 0 (else ERR_EMPTY_TIMESHEET)"
        side_effects:
          - "Set submitted_at = current program clock time"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /vms/timesheets/{id}/approve"
        actor: HiringManager
        preconditions: []
        side_effects:
          - "Compute pay_amount_cents and bill_amount_cents via timesheet_amounts"
      - from: SUBMITTED
        to: APPROVED
        trigger: "system (advance_clock >= submitted_at + Program.timesheet_approval_window_days)"
        actor: system
        preconditions:
          - "Timesheet SUBMITTED and approval window elapsed"
        side_effects:
          - "Compute pay_amount_cents and bill_amount_cents via timesheet_amounts"
        note: "auto-approval"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /vms/timesheets/{id}/reject"
        actor: HiringManager
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: DRAFT
        trigger: "POST /vms/timesheets/{id}/reopen"
        actor: Supplier
        preconditions: []
        side_effects:
          - "Clear submitted_at"
        note: "branching-with-revert: rejected timesheet returns to DRAFT for correction"
      - from: APPROVED
        to: INVOICED
        trigger: "POST /vms/timesheets/{id}/invoice"
        actor: Finance
        preconditions:
          - "Timesheet.status == APPROVED (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: Expense
    initial_state: DRAFT
    terminal_states: [INVOICED]
    note: "Branching-with-revert: SUBMITTED -> REJECTED -> DRAFT rework loop."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /vms/expenses/{id}/submit"
        actor: Supplier
        preconditions:
          - "Assignment.engagement_status == ACTIVE (else ERR_ASSIGNMENT_NOT_ACTIVE)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /vms/expenses/{id}/approve"
        actor: HiringManager
        preconditions: []
        side_effects:
          - "Compute reimbursable_amount_cents via expense_reimbursement (per-category cap)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /vms/expenses/{id}/reject"
        actor: HiringManager
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: DRAFT
        trigger: "POST /vms/expenses/{id}/reopen"
        actor: Supplier
        preconditions: []
        side_effects: []
        note: "branching-with-revert"
      - from: APPROVED
        to: INVOICED
        trigger: "POST /vms/expenses/{id}/invoice"
        actor: Finance
        preconditions:
          - "Expense.status == APPROVED (else ERR_INVALID_STATE)"
        side_effects: []

# =============================================================================
# Concurrency Rules (§1.2.1) — OCC on parent version, true races only
# =============================================================================
concurrency_rules:
  - rule_id: hire-stale-requisition
    parent_entity: Requisition
    write_endpoint: "POST /vms/submittals/{id}/hire"
    occ_field: "expected_requisition_version"
    description: |
      Hiring an OFFERED submittal against a Requisition whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has already hired a different submittal (legitimately
      advancing filled_count and the requisition version) so the current writer's
      view of remaining openings is stale; both hires could individually look
      valid against the last-seen version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: bill_rate_and_markup
    trigger: "Submittal creation (POST /vms/submittals) and submittal propose_rate"
    algorithm: threshold
    formula: |
      # Pinned evaluation order resolves the circular-looking dependency between
      # bill_rate_cents and effective_markup_pct.
      # Step 1: if bill_rate_cents supplied in request -> use it verbatim.
      #         else bill_rate_cents = round_half_up(pay_rate_cents * (1 + Program.default_markup_pct))
      # Step 2: effective_markup_pct = (bill_rate_cents / pay_rate_cents) - 1
      #         evaluated as an exact rational; NOT re-rounded before comparison.
      # Step 3: reject if pay_rate_cents > Requisition.max_pay_rate_cents -> ERR_PAY_RATE_EXCEEDS_MAX
      #         reject if effective_markup_pct > Program.max_markup_pct    -> ERR_MARKUP_EXCEEDS_MAX
      # Boundary: effective_markup_pct == max_markup_pct is ACCEPTED (<=, not <).
    input_set: "single submittal; uses Program.default_markup_pct, Program.max_markup_pct, Requisition.max_pay_rate_cents"
    constants: {}
    precision: "bill_rate_cents is integer cents, round_half_up on the derived form; effective_markup_pct kept as exact ratio for the <= comparison"

  - name: timesheet_amounts
    trigger: "Timesheet APPROVED transition (manual approve or system auto-approve)"
    algorithm: tiered_pricing
    formula: |
      # Order matters: round PER COMPONENT then sum (pinned). Do NOT sum the four
      # money terms before rounding, and do NOT sum hours then multiply.
      OT_MULTIPLIER = 1.5
      pay_regular  = round_half_up(regular_hours  * Assignment.pay_rate_cents)
      pay_ot       = round_half_up(overtime_hours * Assignment.pay_rate_cents  * OT_MULTIPLIER)
      pay_amount_cents  = pay_regular + pay_ot
      bill_regular = round_half_up(regular_hours  * Assignment.bill_rate_cents)
      bill_ot      = round_half_up(overtime_hours * Assignment.bill_rate_cents * OT_MULTIPLIER)
      bill_amount_cents = bill_regular + bill_ot
    input_set: "one timesheet's regular_hours + overtime_hours against the assignment's pay/bill rates"
    constants: { OT_MULTIPLIER: 1.5 }
    precision: "2-step: round_half_up each of the four components to whole cents, THEN sum; pinned 'round-then-sum'"

  - name: expense_reimbursement
    trigger: "Expense APPROVED transition"
    algorithm: threshold
    formula: |
      # Per-category cap; reimbursable is min(submitted, cap). Non-billable
      # expenses are still reimbursed to the worker but excluded from client bill
      # (billable flag does not change reimbursable_amount_cents).
      CAP_CENTS = { TRAVEL: 50000, LODGING: 30000, MEALS: 7500, EQUIPMENT: 100000, OTHER: 20000 }
      reimbursable_amount_cents = min(amount_cents, CAP_CENTS[category])
      # Boundary: amount_cents == cap reimburses fully; amount_cents == cap + 1 caps.
    input_set: "single expense; category selects the cap"
    constants:
      CAP_TRAVEL_CENTS: 50000
      CAP_LODGING_CENTS: 30000
      CAP_MEALS_CENTS: 7500
      CAP_EQUIPMENT_CENTS: 100000
      CAP_OTHER_CENTS: 20000
    precision: "integer cents; no rounding (min of two integers)"

  - name: worker_tenure_rollup
    trigger: "Assignment offboard side-effect AND advance_clock recompute"
    algorithm: aggregation
    formula: |
      # Conserved-quantity rollup across assignments. engaged_days per assignment
      # is an INCLUSIVE day count:
      #   if engagement_status == ENDED: engaged_days = (actual_end_date - start_date).days + 1
      #   else (ACTIVE or ON_HOLD):      engaged_days = (current_clock_date - start_date).days + 1
      # ON_HOLD assignments STILL accrue calendar tenure (co-employment is about
      # elapsed engaged calendar time, not worked time) — pinned inclusion rule.
      cumulative_engaged_days = sum over assignments A where A.worker_profile_id == w.id
                                 of A.engaged_days
      # Status derivation (>= boundaries, pinned):
      #   cumulative >= coemployment_tenure_limit_days  -> BREACH
      #   cumulative >= tenure_warning_threshold_days    -> WARNING
      #   else                                           -> CLEAR
    input_set: "all assignments (ACTIVE, ON_HOLD, ENDED) for the worker in the program; processed in Assignment.start_date ASC, then created_at ASC order"
    constants: {}
    precision: "integer days, inclusive both ends"

  - name: distribution_waterfall
    trigger: "Requisition distribute, and advance_clock release sweep"
    algorithm: waterfall_allocation
    formula: |
      # Tiered exclusivity waterfall over suppliers. Distributions are grouped by
      # tier_at_distribution ascending. The lowest distinct tier releases at the
      # distribution clock T0. Each subsequent DISTINCT tier releases
      # tier_release_interval_hours after the PREVIOUS DISTINCT tier's release
      # (cumulative across distinct tiers), NOT after T0.
      #   sorted_tiers = sorted(distinct tier_at_distribution ASC)
      #   release_offset(tier_k) = index_of(tier_k in sorted_tiers) * interval_hours
      #   Distribution.released_at = T0 + release_offset(its tier) hours
      # A Distribution becomes RELEASED when current program clock >= released_at.
      # lowest tier (index 0) => offset 0 => RELEASED immediately at distribute.
      # Distributions sharing a tier share the same release_offset.
    input_set: "all Distributions created by one distribute call; interval = Requisition.tier_release_interval_hours"
    constants: {}
    precision: "datetime arithmetic in whole hours; ties on tier share the same release_offset"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_referential
    check: "Acting Supplier (entity_backed) owns the Submittal/SOW-supplier/Timesheet/Expense/Milestone it mutates (X-User-ID == resource.supplier_id chain)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Supplier-actor write endpoints"

  - priority: 5
    category: state
    check: "Target resource in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 6
    category: business_temporal
    check: "Supplier's Distribution must be RELEASED (released_at <= clock) before it may create a submittal"
    error_id: ERR_DISTRIBUTION_NOT_RELEASED
    http_status: 409
    applies_to: "POST /vms/submittals"

  - priority: 7
    category: business_safety
    check: "Co-employment tenure: worker in BREACH cannot be hired or resumed"
    error_id: ERR_TENURE_LIMIT_REACHED
    http_status: 409
    applies_to: "submittal hire, assignment resume"

  - priority: 8
    category: business_constraint
    check: "Milestone sequence: cannot submit a milestone before all lower-sequence ones are ACCEPTED/INVOICED"
    error_id: ERR_MILESTONE_SEQUENCE_VIOLATION
    http_status: 409
    applies_to: "milestone submit"

  - priority: 9
    category: business_constraint
    check: "Negotiation rounds cap (rounds < 5) before another counter_rate"
    error_id: ERR_NEGOTIATION_ROUNDS_EXCEEDED
    http_status: 409
    applies_to: "submittal counter_rate"

  - priority: 10
    category: business_constraint
    check: "Requisition openings remaining (filled_count < openings) before offer/hire"
    error_id: ERR_REQUISITION_FULL
    http_status: 409
    applies_to: "submittal offer, submittal hire"

  - priority: 11
    category: business_fiscal
    check: "Pay rate within Requisition.max_pay_rate_cents"
    error_id: ERR_PAY_RATE_EXCEEDS_MAX
    http_status: 409
    applies_to: "submittal create, propose_rate"

  - priority: 12
    category: business_fiscal
    check: "Effective markup within Program.max_markup_pct"
    error_id: ERR_MARKUP_EXCEEDS_MAX
    http_status: 409
    applies_to: "submittal create, propose_rate"

  - priority: 13
    category: business_fiscal
    check: "SOW not-to-exceed: accepted/invoiced milestone value cannot exceed total_value_cents"
    error_id: ERR_SOW_VALUE_EXCEEDED
    http_status: 409
    applies_to: "SOW activate, milestone accept"

  - priority: 14
    category: business_constraint
    check: "Cannot offboard/close while SUBMITTED approvals remain"
    error_id: ERR_OPEN_APPROVALS_PENDING
    http_status: 409
    applies_to: "assignment offboard, SOW close"

  - priority: 15
    category: business_temporal
    check: "Worker double-booking: the hire's [start_date, planned_end_date] closed interval must not overlap any non-ENDED Assignment of the same worker (closed-interval overlap: shared endpoints collide)"
    error_id: ERR_WORKER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "submittal hire"

  - priority: 16
    category: business_temporal
    check: "Timesheet week uniqueness: no other Timesheet on the same assignment may occupy the same 7-day week bucket keyed by week_start_date (discrete-bucket exact-match collision; adjacent weeks do NOT collide)"
    error_id: ERR_DUPLICATE_WEEK
    http_status: 409
    applies_to: "timesheet create"

  - priority: 17
    category: business_constraint
    check: "Request body field-level validity (enum members, positive amounts, hour ranges, required fields, markup in [0,2], warning < limit)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Program ---
  - method: POST
    path: "/vms/programs"
    description: "Create a Program"
    roles: [ProgramManager]
    code: 201
    input: [name, client_name, default_markup_pct, max_markup_pct, coemployment_tenure_limit_days, tenure_warning_threshold_days, "timesheet_approval_window_days?"]
    output: Program
    side_effects: ["status=ACTIVE; current_clock=1970-01-01T00:00:00.000Z"]

  - method: GET
    path: "/vms/programs/{id}"
    description: "Get a Program"
    roles: [ProgramManager, HiringManager, Supplier, Finance]
    code: 200
    input: []
    output: Program
    side_effects: []

  - method: GET
    path: "/vms/programs"
    description: "List Programs"
    roles: [ProgramManager, HiringManager, Supplier, Finance]
    code: 200
    input: ["status?"]
    output: "Program[]"
    side_effects: []

  - method: POST
    path: "/vms/programs/{id}/advance_clock"
    description: "Advance the program clock to a target UTC instant; fires time-gated sweeps"
    roles: [ProgramManager]
    code: 200
    input: [to_iso8601]
    output: Program
    side_effects:
      - "Set current_clock = to_iso8601"
      - "Release PENDING Distributions whose released_at <= new clock (distribution_waterfall)"
      - "Auto-approve SUBMITTED timesheets past their approval window (timesheet_amounts)"
      - "Recompute every non-ENDED worker's cumulative_engaged_days/tenure_status (worker_tenure_rollup)"
      - "Flip assignment compliance_status CLEAR->TENURE_WARNING->TENURE_BREACH; breach forces ACTIVE->ON_HOLD"

  - method: POST
    path: "/vms/programs/{id}/_clock/set"
    description: "Test-driving: set the program clock to an exact UTC instant WITHOUT firing sweeps (seed helper)"
    roles: [ProgramManager]
    code: 200
    input: [to_iso8601]
    output: Program
    side_effects: ["Set current_clock only; no cascades"]

  - method: POST
    path: "/vms/programs/{id}/suspend"
    description: "Suspend a Program"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Program
    side_effects: ["status -> SUSPENDED"]

  # --- Supplier ---
  - method: POST
    path: "/vms/suppliers"
    description: "Register a Supplier in a program"
    roles: [ProgramManager]
    code: 201
    input: [program_id, name, tier]
    output: Supplier
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/vms/suppliers/{id}"
    description: "Get a Supplier"
    roles: [ProgramManager, HiringManager, Supplier, Finance]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  - method: GET
    path: "/vms/suppliers"
    description: "List Suppliers (filter by program_id for reverse-reachability)"
    roles: [ProgramManager, HiringManager, Supplier, Finance]
    code: 200
    input: ["program_id?", "status?"]
    output: "Supplier[]"
    side_effects: []

  - method: POST
    path: "/vms/suppliers/{id}/suspend"
    description: "Suspend a Supplier"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Supplier
    side_effects: ["status -> SUSPENDED"]

  # --- WorkerProfile ---
  - method: POST
    path: "/vms/workers"
    description: "Create a WorkerProfile"
    roles: [ProgramManager, Supplier]
    code: 201
    input: [program_id, full_name, national_id_hash]
    output: WorkerProfile
    side_effects: ["cumulative_engaged_days=0, tenure_status=CLEAR"]

  - method: GET
    path: "/vms/workers/{id}"
    description: "Get a WorkerProfile (includes cumulative_engaged_days, tenure_status)"
    roles: [ProgramManager, HiringManager, Supplier, Finance]
    code: 200
    input: []
    output: WorkerProfile
    side_effects: []

  - method: GET
    path: "/vms/workers"
    description: "List WorkerProfiles (filter by program_id for reverse-reachability)"
    roles: [ProgramManager, HiringManager, Supplier, Finance]
    code: 200
    input: ["program_id?"]
    output: "WorkerProfile[]"
    side_effects: []

  # --- Requisition ---
  - method: POST
    path: "/vms/requisitions"
    description: "Create a Requisition (DRAFT)"
    roles: [ProgramManager, HiringManager]
    code: 201
    input: [program_id, title, openings, max_pay_rate_cents, "tier_release_interval_hours?"]
    output: Requisition
    side_effects: ["status=DRAFT, filled_count=0"]

  - method: GET
    path: "/vms/requisitions/{id}"
    description: "Get a Requisition"
    roles: [ProgramManager, HiringManager, Supplier, Finance]
    code: 200
    input: []
    output: Requisition
    side_effects: []

  - method: GET
    path: "/vms/requisitions"
    description: "List Requisitions (filter by program_id for reverse-reachability)"
    roles: [ProgramManager, HiringManager, Supplier, Finance]
    code: 200
    input: ["program_id?", "status?"]
    output: "Requisition[]"
    side_effects: []

  - method: POST
    path: "/vms/requisitions/{id}/distribute"
    description: "Distribute a DRAFT requisition to suppliers"
    roles: [ProgramManager]
    code: 200
    input: [supplier_ids]
    output: Requisition
    side_effects:
      - "status DRAFT -> DISTRIBUTED"
      - "Create Distributions; compute released_at (distribution_waterfall); lowest tier RELEASED immediately"
      - "increments Requisition.version by 1"

  - method: POST
    path: "/vms/requisitions/{id}/close"
    description: "Close a distributed requisition"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Requisition
    side_effects: ["status -> CLOSED; revoke distributions; reject open submittals"]

  - method: POST
    path: "/vms/requisitions/{id}/cancel"
    description: "Cancel a requisition"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Requisition
    side_effects: ["status -> CANCELLED; cascade revoke/reject"]

  # --- Distribution ---
  - method: GET
    path: "/vms/distributions/{id}"
    description: "Get a Distribution"
    roles: [ProgramManager, HiringManager, Supplier, Finance]
    code: 200
    input: []
    output: Distribution
    side_effects: []

  - method: GET
    path: "/vms/distributions"
    description: "List Distributions (filter by requisition_id or supplier_id for reverse-reachability)"
    roles: [ProgramManager, HiringManager, Supplier, Finance]
    code: 200
    input: ["requisition_id?", "supplier_id?", "status?"]
    output: "Distribution[]"
    side_effects: []

  # --- Submittal ---
  - method: POST
    path: "/vms/submittals"
    description: "Supplier submits a candidate with a pay/bill rate"
    roles: [Supplier]
    code: 201
    input: [requisition_id, supplier_id, worker_profile_id, pay_rate_cents, "bill_rate_cents?"]
    output: Submittal
    side_effects:
      - "status=SUBMITTED"
      - "Derive bill_rate_cents/effective_markup_pct (bill_rate_and_markup)"

  - method: GET
    path: "/vms/submittals/{id}"
    description: "Get a Submittal"
    roles: [ProgramManager, HiringManager, Supplier, Finance]
    code: 200
    input: []
    output: Submittal
    side_effects: []

  - method: GET
    path: "/vms/submittals"
    description: "List Submittals (filter by requisition_id / supplier_id / worker_profile_id for reverse-reachability)"
    roles: [ProgramManager, HiringManager, Supplier, Finance]
    code: 200
    input: ["requisition_id?", "supplier_id?", "worker_profile_id?", "status?"]
    output: "Submittal[]"
    side_effects: []

  - method: POST
    path: "/vms/submittals/{id}/shortlist"
    description: "Shortlist a submittal"
    roles: [HiringManager]
    code: 200
    input: []
    output: Submittal
    side_effects: ["status -> SHORTLISTED"]

  - method: POST
    path: "/vms/submittals/{id}/start_interview"
    description: "Begin interviewing"
    roles: [HiringManager]
    code: 200
    input: []
    output: Submittal
    side_effects: ["status -> INTERVIEWING"]

  - method: POST
    path: "/vms/submittals/{id}/propose_rate"
    description: "Supplier proposes a new pay/bill rate during negotiation"
    roles: [Supplier]
    code: 200
    input: [pay_rate_cents, "bill_rate_cents?"]
    output: Submittal
    side_effects: ["status -> RATE_PROPOSED; recompute markup (bill_rate_and_markup)"]

  - method: POST
    path: "/vms/submittals/{id}/counter_rate"
    description: "Hiring manager counters; returns to interviewing for another round"
    roles: [HiringManager]
    code: 200
    input: []
    output: Submittal
    side_effects: ["status -> INTERVIEWING; increments rounds by 1"]

  - method: POST
    path: "/vms/submittals/{id}/offer"
    description: "Extend an offer"
    roles: [HiringManager]
    code: 200
    input: []
    output: Submittal
    side_effects: ["status -> OFFERED"]

  - method: POST
    path: "/vms/submittals/{id}/hire"
    description: "Hire an offered candidate; creates the Assignment (OCC on requisition version)"
    roles: [ProgramManager]
    code: 200
    input: [expected_requisition_version, start_date, planned_end_date]
    output: Submittal
    side_effects:
      - "status -> HIRED"
      - "Create Assignment (engagement_status=ACTIVE)"
      - "increments Requisition.filled_count; may drive Requisition -> FILLED"
      - "increments Requisition.version by 1"

  - method: POST
    path: "/vms/submittals/{id}/reject"
    description: "Reject a submittal"
    roles: [HiringManager]
    code: 200
    input: []
    output: Submittal
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/vms/submittals/{id}/withdraw"
    description: "Supplier withdraws a submittal"
    roles: [Supplier]
    code: 200
    input: []
    output: Submittal
    side_effects: ["status -> WITHDRAWN"]

  # --- Assignment ---
  - method: GET
    path: "/vms/assignments/{id}"
    description: "Get an Assignment (both engagement_status and compliance_status)"
    roles: [ProgramManager, HiringManager, Supplier, Finance]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: GET
    path: "/vms/assignments"
    description: "List Assignments (filter by program_id / submittal_id / worker_profile_id for reverse-reachability)"
    roles: [ProgramManager, HiringManager, Supplier, Finance]
    code: 200
    input: ["program_id?", "submittal_id?", "worker_profile_id?", "engagement_status?", "compliance_status?"]
    output: "Assignment[]"
    side_effects: []

  - method: POST
    path: "/vms/assignments/{id}/hold"
    description: "Place an assignment ON_HOLD"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Assignment
    side_effects: ["engagement_status -> ON_HOLD"]

  - method: POST
    path: "/vms/assignments/{id}/resume"
    description: "Resume an ON_HOLD assignment"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Assignment
    side_effects: ["engagement_status -> ACTIVE (blocked if compliance TENURE_BREACH)"]

  - method: POST
    path: "/vms/assignments/{id}/offboard"
    description: "Offboard (end) an assignment"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "engagement_status -> ENDED; set actual_end_date; freeze engaged_days"
      - "Recompute WorkerProfile.cumulative_engaged_days/tenure_status (worker_tenure_rollup)"

  # --- Timesheet ---
  - method: POST
    path: "/vms/timesheets"
    description: "Create a DRAFT timesheet for an assignment"
    roles: [Supplier]
    code: 201
    input: [assignment_id, week_start_date, regular_hours, "overtime_hours?"]
    output: Timesheet
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/vms/timesheets/{id}"
    description: "Get a Timesheet"
    roles: [ProgramManager, HiringManager, Supplier, Finance]
    code: 200
    input: []
    output: Timesheet
    side_effects: []

  - method: GET
    path: "/vms/timesheets"
    description: "List Timesheets (filter by assignment_id for reverse-reachability)"
    roles: [ProgramManager, HiringManager, Supplier, Finance]
    code: 200
    input: ["assignment_id?", "status?"]
    output: "Timesheet[]"
    side_effects: []

  - method: POST
    path: "/vms/timesheets/{id}/submit"
    description: "Submit a timesheet for approval"
    roles: [Supplier]
    code: 200
    input: []
    output: Timesheet
    side_effects: ["status -> SUBMITTED; set submitted_at"]

  - method: POST
    path: "/vms/timesheets/{id}/approve"
    description: "Approve a timesheet; computes pay/bill amounts"
    roles: [HiringManager]
    code: 200
    input: []
    output: Timesheet
    side_effects: ["status -> APPROVED; compute pay_amount_cents/bill_amount_cents (timesheet_amounts)"]

  - method: POST
    path: "/vms/timesheets/{id}/reject"
    description: "Reject a timesheet"
    roles: [HiringManager]
    code: 200
    input: []
    output: Timesheet
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/vms/timesheets/{id}/reopen"
    description: "Reopen a rejected timesheet back to DRAFT"
    roles: [Supplier]
    code: 200
    input: []
    output: Timesheet
    side_effects: ["status -> DRAFT; clear submitted_at"]

  - method: POST
    path: "/vms/timesheets/{id}/invoice"
    description: "Invoice an approved timesheet"
    roles: [Finance]
    code: 200
    input: []
    output: Timesheet
    side_effects: ["status -> INVOICED"]

  # --- Expense ---
  - method: POST
    path: "/vms/expenses"
    description: "Create a DRAFT expense"
    roles: [Supplier]
    code: 201
    input: [assignment_id, category, amount_cents, "billable?"]
    output: Expense
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/vms/expenses/{id}"
    description: "Get an Expense"
    roles: [ProgramManager, HiringManager, Supplier, Finance]
    code: 200
    input: []
    output: Expense
    side_effects: []

  - method: GET
    path: "/vms/expenses"
    description: "List Expenses (filter by assignment_id for reverse-reachability)"
    roles: [ProgramManager, HiringManager, Supplier, Finance]
    code: 200
    input: ["assignment_id?", "status?", "category?"]
    output: "Expense[]"
    side_effects: []

  - method: POST
    path: "/vms/expenses/{id}/submit"
    description: "Submit an expense for approval"
    roles: [Supplier]
    code: 200
    input: []
    output: Expense
    side_effects: ["status -> SUBMITTED"]

  - method: POST
    path: "/vms/expenses/{id}/approve"
    description: "Approve an expense; computes reimbursable amount"
    roles: [HiringManager]
    code: 200
    input: []
    output: Expense
    side_effects: ["status -> APPROVED; compute reimbursable_amount_cents (expense_reimbursement)"]

  - method: POST
    path: "/vms/expenses/{id}/reject"
    description: "Reject an expense"
    roles: [HiringManager]
    code: 200
    input: []
    output: Expense
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/vms/expenses/{id}/reopen"
    description: "Reopen a rejected expense back to DRAFT"
    roles: [Supplier]
    code: 200
    input: []
    output: Expense
    side_effects: ["status -> DRAFT"]

  - method: POST
    path: "/vms/expenses/{id}/invoice"
    description: "Invoice an approved expense"
    roles: [Finance]
    code: 200
    input: []
    output: Expense
    side_effects: ["status -> INVOICED"]

  # --- StatementOfWork ---
  - method: POST
    path: "/vms/statements-of-work"
    description: "Create a SOW (DRAFT)"
    roles: [ProgramManager]
    code: 201
    input: [program_id, supplier_id, title, total_value_cents]
    output: StatementOfWork
    side_effects: ["status=DRAFT, invoiced_value_cents=0"]

  - method: GET
    path: "/vms/statements-of-work/{id}"
    description: "Get a SOW"
    roles: [ProgramManager, HiringManager, Supplier, Finance]
    code: 200
    input: []
    output: StatementOfWork
    side_effects: []

  - method: GET
    path: "/vms/statements-of-work"
    description: "List SOWs (filter by program_id / supplier_id for reverse-reachability)"
    roles: [ProgramManager, HiringManager, Supplier, Finance]
    code: 200
    input: ["program_id?", "supplier_id?", "status?"]
    output: "StatementOfWork[]"
    side_effects: []

  - method: POST
    path: "/vms/statements-of-work/{id}/activate"
    description: "Activate a SOW (validates milestone totals)"
    roles: [ProgramManager]
    code: 200
    input: []
    output: StatementOfWork
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/vms/statements-of-work/{id}/close"
    description: "Close a SOW"
    roles: [ProgramManager]
    code: 200
    input: []
    output: StatementOfWork
    side_effects: ["status -> CLOSED"]

  - method: POST
    path: "/vms/statements-of-work/{id}/cancel"
    description: "Cancel a DRAFT SOW"
    roles: [ProgramManager]
    code: 200
    input: []
    output: StatementOfWork
    side_effects: ["status -> CANCELLED"]

  # --- Milestone ---
  - method: POST
    path: "/vms/milestones"
    description: "Add a Milestone to a DRAFT SOW"
    roles: [ProgramManager]
    code: 201
    input: [statement_of_work_id, name, milestone_amount_cents, sequence]
    output: Milestone
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/vms/milestones/{id}"
    description: "Get a Milestone"
    roles: [ProgramManager, HiringManager, Supplier, Finance]
    code: 200
    input: []
    output: Milestone
    side_effects: []

  - method: GET
    path: "/vms/milestones"
    description: "List Milestones (filter by statement_of_work_id for reverse-reachability)"
    roles: [ProgramManager, HiringManager, Supplier, Finance]
    code: 200
    input: ["statement_of_work_id?", "status?"]
    output: "Milestone[]"
    side_effects: []

  - method: POST
    path: "/vms/milestones/{id}/start"
    description: "Start (or restart after rejection) a milestone"
    roles: [Supplier]
    code: 200
    input: []
    output: Milestone
    side_effects: ["status -> IN_PROGRESS"]

  - method: POST
    path: "/vms/milestones/{id}/submit"
    description: "Submit a milestone deliverable for acceptance"
    roles: [Supplier]
    code: 200
    input: []
    output: Milestone
    side_effects: ["status -> SUBMITTED (enforces sequence)"]

  - method: POST
    path: "/vms/milestones/{id}/accept"
    description: "Accept a submitted milestone (validates SOW NTE)"
    roles: [HiringManager]
    code: 200
    input: []
    output: Milestone
    side_effects: ["status -> ACCEPTED"]

  - method: POST
    path: "/vms/milestones/{id}/reject"
    description: "Reject a submitted milestone"
    roles: [HiringManager]
    code: 200
    input: []
    output: Milestone
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/vms/milestones/{id}/invoice"
    description: "Invoice an accepted milestone"
    roles: [Finance]
    code: 200
    input: []
    output: Milestone
    side_effects: ["status -> INVOICED; increments SOW.invoiced_value_cents; may drive SOW -> COMPLETED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Acting Supplier is not the owner of the targeted submittal/SOW/timesheet/expense/milestone" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: bad enum, non-positive amount, hours out of [0,168], missing required field, markup out of [0,2]" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_requisition_version does not match current Requisition.version (OCC)" }
  - { id: ERR_PROGRAM_NOT_ACTIVE, http: 409, condition: "Program is SUSPENDED or CLOSED and the operation requires ACTIVE" }
  - { id: ERR_SUPPLIER_NOT_ELIGIBLE, http: 409, condition: "Supplier is SUSPENDED, not in this program, or not listed for distribution/SOW" }
  - { id: ERR_DISTRIBUTION_NOT_RELEASED, http: 409, condition: "Supplier's distribution is still PENDING (released_at > current clock) when it tries to submit" }
  - { id: ERR_PAY_RATE_EXCEEDS_MAX, http: 409, condition: "Submitted/proposed pay_rate_cents exceeds Requisition.max_pay_rate_cents" }
  - { id: ERR_MARKUP_EXCEEDS_MAX, http: 409, condition: "Effective markup exceeds Program.max_markup_pct" }
  - { id: ERR_NEGOTIATION_ROUNDS_EXCEEDED, http: 409, condition: "counter_rate attempted when rounds already == 5" }
  - { id: ERR_REQUISITION_FULL, http: 409, condition: "Requisition.filled_count already equals openings at offer/hire" }
  - { id: ERR_REQUISITION_HAS_HIRES, http: 409, condition: "Cannot cancel a distributed requisition that already has HIRED submittals" }
  - { id: ERR_TENURE_LIMIT_REACHED, http: 409, condition: "Worker is in tenure BREACH; cannot be hired or have an assignment resumed" }
  - { id: ERR_MILESTONE_SEQUENCE_VIOLATION, http: 409, condition: "Milestone submitted before all lower-sequence milestones are ACCEPTED/INVOICED" }
  - { id: ERR_SOW_VALUE_EXCEEDED, http: 409, condition: "Accepted/invoiced milestone value would exceed SOW total_value_cents" }
  - { id: ERR_SOW_NO_MILESTONES, http: 409, condition: "SOW activation attempted with zero milestones" }
  - { id: ERR_OPEN_APPROVALS_PENDING, http: 409, condition: "Offboard/close blocked by SUBMITTED timesheets, expenses, or milestones awaiting approval" }
  - { id: ERR_ASSIGNMENT_NOT_ACTIVE, http: 409, condition: "Timesheet/expense submit attempted on a non-ACTIVE assignment" }
  - { id: ERR_EMPTY_TIMESHEET, http: 409, condition: "Timesheet submit with regular_hours + overtime_hours == 0" }
  - { id: ERR_DUPLICATE_WEEK, http: 409, condition: "A timesheet already exists for this assignment and week_start_date" }
  - { id: ERR_WORKER_DOUBLE_BOOKED, http: 409, condition: "Hire would create an Assignment whose [start_date, planned_end_date] overlaps an existing non-ENDED assignment of the same worker" }
  - { id: ERR_DUPLICATE_WORKER, http: 409, condition: "national_id_hash already used by another WorkerProfile in this program" }
  - { id: ERR_DUPLICATE_SUBMITTAL, http: 409, condition: "Worker already has a non-terminal submittal on this requisition from the same supplier" }
  - { id: ERR_VALIDATION_LIMIT, http: 400, condition: "Pagination limit/offset out of allowed range" }
  - { id: ERR_TIER_INVALID, http: 400, condition: "Supplier tier < 1 on registration" }
  - { id: ERR_THRESHOLD_INVALID, http: 400, condition: "tenure_warning_threshold_days not strictly less than coemployment_tenure_limit_days" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ProgramManager
    description: "MSP program owner: creates programs/suppliers/requisitions/SOWs, distributes, hires, manages assignment lifecycle, advances clock"
    identity: opaque
    exclusive_operations:
      - "POST /vms/programs — create program"
      - "POST /vms/programs/{id}/advance_clock — advance program clock"
      - "POST /vms/programs/{id}/_clock/set — set clock (seed)"
      - "POST /vms/programs/{id}/suspend — suspend program"
      - "POST /vms/suppliers — register supplier"
      - "POST /vms/suppliers/{id}/suspend — suspend supplier"
      - "POST /vms/requisitions/{id}/distribute — distribute requisition"
      - "POST /vms/requisitions/{id}/close — close requisition"
      - "POST /vms/requisitions/{id}/cancel — cancel requisition"
      - "POST /vms/submittals/{id}/hire — hire (OCC, creates assignment)"
      - "POST /vms/assignments/{id}/hold — hold assignment"
      - "POST /vms/assignments/{id}/resume — resume assignment"
      - "POST /vms/assignments/{id}/offboard — offboard assignment"
      - "POST /vms/statements-of-work — create SOW"
      - "POST /vms/statements-of-work/{id}/activate — activate SOW"
      - "POST /vms/statements-of-work/{id}/close — close SOW"
      - "POST /vms/statements-of-work/{id}/cancel — cancel SOW"
      - "POST /vms/milestones — add milestone"
    shared_operations:
      - "POST /vms/requisitions — create requisition (with HiringManager)"
      - "POST /vms/workers — create worker (with Supplier)"
      - "GET endpoints — read access"

  - name: HiringManager
    description: "Client-side manager: shortlists, interviews, counters rate, offers, accepts/rejects deliverables and timesheets/expenses"
    identity: opaque
    exclusive_operations:
      - "POST /vms/submittals/{id}/shortlist"
      - "POST /vms/submittals/{id}/start_interview"
      - "POST /vms/submittals/{id}/counter_rate"
      - "POST /vms/submittals/{id}/offer"
      - "POST /vms/submittals/{id}/reject"
      - "POST /vms/timesheets/{id}/approve"
      - "POST /vms/timesheets/{id}/reject"
      - "POST /vms/expenses/{id}/approve"
      - "POST /vms/expenses/{id}/reject"
      - "POST /vms/milestones/{id}/accept"
      - "POST /vms/milestones/{id}/reject"
    shared_operations:
      - "POST /vms/requisitions — create requisition (with ProgramManager)"
      - "GET endpoints — read access"

  - name: Supplier
    description: "Staffing vendor: creates workers, submits candidates, proposes rates, enters timesheets/expenses, drives milestone progress"
    identity: "entity_backed:Supplier"
    exclusive_operations:
      - "POST /vms/submittals — submit candidate"
      - "POST /vms/submittals/{id}/propose_rate"
      - "POST /vms/submittals/{id}/withdraw"
      - "POST /vms/timesheets — create timesheet"
      - "POST /vms/timesheets/{id}/submit"
      - "POST /vms/timesheets/{id}/reopen"
      - "POST /vms/expenses — create expense"
      - "POST /vms/expenses/{id}/submit"
      - "POST /vms/expenses/{id}/reopen"
      - "POST /vms/milestones/{id}/start"
      - "POST /vms/milestones/{id}/submit"
    shared_operations:
      - "POST /vms/workers — create worker (with ProgramManager)"
      - "GET endpoints — read access"

  - name: Finance
    description: "AP / billing: invoices approved timesheets, expenses, and accepted milestones"
    identity: opaque
    exclusive_operations:
      - "POST /vms/timesheets/{id}/invoice"
      - "POST /vms/expenses/{id}/invoice"
      - "POST /vms/milestones/{id}/invoice"
    shared_operations:
      - "GET endpoints — read access"
