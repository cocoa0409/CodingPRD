          assert:
            - "First trigger call: HTTP status == 409 and error_id == ERR_WORKSHEET_STATE_INVALID (accept requires CALCULATED; the worksheet is still DRAFT)"
            - "Second trigger call: HTTP status == 200, inclusion_status == EXCLUDED, and the parent worksheet's included_month_count == 1"
            - "Third trigger call: HTTP status == 409 and error_id == ERR_STATEMENT_MONTH_STATE_INVALID - excluding an EXCLUDED month is refused, not a no-op"
            - "Fourth trigger call: HTTP status == 422 and error_id == ERR_NO_INCLUDED_STATEMENT_MONTHS (the last INCLUDED month may not be excluded), and ${sm_two_id} is still INCLUDED"
            - "Fifth trigger call: HTTP status == 409 and error_id == ERR_VALUATION_ORDER_STATE_INVALID (decision requires RECEIVED; the order is ORDERED)"
            - "Sixth trigger call: HTTP status == 200 and status == RECEIVED"
            - "Seventh trigger call: HTTP status == 409 and error_id == ERR_VALUATION_ORDER_STATE_INVALID, and appraised_value_cents was written exactly once"
            - "All four error_ids are distinct: the worksheet, the statement month and the valuation order each own their 409 code, and the empty-sample rule is a 422 instead"

