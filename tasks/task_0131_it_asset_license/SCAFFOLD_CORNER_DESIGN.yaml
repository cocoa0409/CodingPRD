# =============================================================================
# task_0131_it_asset_license — SCAFFOLD_CORNER_DESIGN.yaml  (§1.9)
# Breadth probe: every testable claim in §1.1–§1.7 not already covered by §1.8.
# section/claim_type taxonomy from references/claim-extraction-guide.md.
# excluded_because stubs cite §1.8 instances by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_hardware_asset_returns_201_with_computed_fields
        claim_type: Creation
        grounds:
          - entities.HardwareAsset
          - endpoints["POST /assets/hardware"]
        distinguishing_aspect: "POST with all required fields → 201; status=IN_STOCK, support_status=UNCOVERED, accumulated_depreciation_cents and net_book_value_cents computed from clock; id/created_at/version present."
        test_recipe:
          setup: ["A HARDWARE vendor exists."]
          setup_api_calls:
            - call: "POST /assets/_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: AssetManager
            - call: "POST /assets/vendors"
              payload: { name: "HW Corp", vendor_type: "HARDWARE", support_email: "s@hw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
          trigger:
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-NEW", category: "LAPTOP", purchase_cost_cents: 120000, in_service_date: "2024-01-01T00:00:00.000Z", useful_life_months: 24, salvage_value_cents: 0 }
              as: AssetManager
              captures: { aid: $.data.id, st: $.data.status, ss: $.data.support_status, nbv: $.data.net_book_value_cents, ver: $.data.version }
          assert:
            - "HardwareAsset.${aid}.status == IN_STOCK"
            - "HardwareAsset.${aid}.support_status == UNCOVERED"
            - "HardwareAsset.${aid}.net_book_value_cents == 120000   # 0 months elapsed at in_service_date"
            - "HardwareAsset.${aid}.version == 1"

      - name: get_hardware_asset_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.HardwareAsset
          - errors[ERR_NOT_FOUND]
          - endpoints["GET /assets/hardware/{id}"]
        distinguishing_aspect: "GET /assets/hardware/{nonexistent-uuid} → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /assets/hardware/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AssetManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: create_entitlement_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.LicenseEntitlement
          - errors[ERR_INVALID_REQUEST]
          - endpoints["POST /assets/entitlements"]
        distinguishing_aspect: "POST /assets/entitlements omitting required entitled_units → ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A SOFTWARE vendor and product exist."]
          setup_api_calls:
            - call: "POST /assets/vendors"
              payload: { name: "SW Co", vendor_type: "SOFTWARE", support_email: "s@sw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/software-products"
              payload: { vendor_id: "${vid}", name: "EditorPro", license_model: "PER_SEAT" }
              as: AssetManager
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /assets/entitlements"
              payload: { software_product_id: "${pid}", vendor_id: "${vid}", unit_price_cents: 1000, term_start: "2025-01-01T00:00:00.000Z", term_end: "2025-12-31T00:00:00.000Z" }
              as: AssetManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST   # entitled_units missing"

      - name: create_employee_default_max_assigned_assets_applied
        claim_type: Defaults
        grounds:
          - entities.Employee.fields.max_assigned_assets
          - endpoints["POST /assets/employees"]
        distinguishing_aspect: "Omitting max_assigned_assets → default 3 applied; status defaults ACTIVE; open_checkout_count defaults 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /assets/employees"
              payload: { full_name: "Dee", email: "dee@x.com", department: "OPS" }
              as: AssetManager
              captures: { emp: $.data.id, mx: $.data.max_assigned_assets, st: $.data.status, oc: $.data.open_checkout_count }
          assert:
            - "Employee.${emp}.max_assigned_assets == 3"
            - "Employee.${emp}.status == ACTIVE"
            - "Employee.${emp}.open_checkout_count == 0"

      - name: create_entitlement_invalid_term_window_returns_error
        claim_type: Type Constraints
        grounds:
          - entities.LicenseEntitlement.fields.term_start
          - entities.LicenseEntitlement.fields.term_end
          - errors[ERR_INVALID_TERM_WINDOW]
          - endpoints["POST /assets/entitlements"]
        distinguishing_aspect: "term_start > term_end → ERR_INVALID_TERM_WINDOW (422), not a generic 201."
        test_recipe:
          setup: ["A SOFTWARE vendor and product exist."]
          setup_api_calls:
            - call: "POST /assets/vendors"
              payload: { name: "SW Co", vendor_type: "SOFTWARE", support_email: "s@sw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/software-products"
              payload: { vendor_id: "${vid}", name: "EditorPro", license_model: "PER_SEAT" }
              as: AssetManager
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /assets/entitlements"
              payload: { software_product_id: "${pid}", vendor_id: "${vid}", entitled_units: 5, unit_price_cents: 1000, term_start: "2025-12-31T00:00:00.000Z", term_end: "2025-01-01T00:00:00.000Z" }
              as: AssetManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_TERM_WINDOW"

      - name: install_id_and_system_fields_server_generated
        claim_type: System Fields
        grounds:
          - entities.InstallationRecord.fields.status
          - entities.InstallationRecord.fields.required_core_units
          - endpoints["POST /assets/installations"]
        distinguishing_aspect: "On create, status forced PENDING and required_core_units computed server-side even if the client cannot supply them (no such input fields); id/created_at/version server-minted."
        test_recipe:
          setup: ["PER_SEAT product, ACTIVE entitlement entitled=5, asset IN_STOCK."]
          setup_api_calls:
            - call: "POST /assets/vendors"
              payload: { name: "Mixed", vendor_type: "BOTH", support_email: "s@m.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/software-products"
              payload: { vendor_id: "${vid}", name: "EditorPro", license_model: "PER_SEAT" }
              as: AssetManager
              captures: { pid: $.data.id }
            - call: "POST /assets/entitlements"
              payload: { software_product_id: "${pid}", vendor_id: "${vid}", entitled_units: 5, unit_price_cents: 1000, term_start: "2025-01-01T00:00:00.000Z", term_end: "2025-12-31T00:00:00.000Z" }
              as: AssetManager
              captures: { eid: $.data.id }
            - call: "POST /assets/entitlements/${eid}/activate"
              payload: {}
              as: AssetManager
              captures: { ev: $.data.version }
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-SYS", category: "DESKTOP", purchase_cost_cents: 100000, in_service_date: "2025-01-01T00:00:00.000Z" }
              as: AssetManager
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /assets/installations"
              payload: { software_product_id: "${pid}", hardware_asset_id: "${aid}", license_entitlement_id: "${eid}", expected_entitlement_version: "${ev}" }
              as: AssetManager
              captures: { iid: $.data.id, st: $.data.status, ru: $.data.required_core_units }
          assert:
            - "InstallationRecord.${iid}.status == PENDING"
            - "InstallationRecord.${iid}.required_core_units == 1   # PER_SEAT"

      - name: finding_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.ComplianceFinding
          - endpoints["GET /assets/findings/{id}"]
        distinguishing_aspect: "ComplianceFinding has common_fields:false — read carries id and created_at but no version; no update/transition endpoint exists for it."
        test_recipe:
          setup: ["A finalized OVER_DEPLOYED true-up produced a ComplianceFinding (build via audit over-deploy then read it)."]
          setup_api_calls:
            - call: "POST /assets/_clock/set_current_utc"
              payload: { to_iso8601: "2025-03-01T00:00:00.000Z" }
              as: AssetManager
            - call: "POST /assets/vendors"
              payload: { name: "SW Co", vendor_type: "SOFTWARE", support_email: "s@sw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/software-products"
              payload: { vendor_id: "${vid}", name: "EditorPro", license_model: "PER_SEAT" }
              as: AssetManager
              captures: { pid: $.data.id }
            - call: "POST /assets/entitlements"
              payload: { software_product_id: "${pid}", vendor_id: "${vid}", entitled_units: 1, unit_price_cents: 1000, term_start: "2025-01-01T00:00:00.000Z", term_end: "2025-12-31T00:00:00.000Z" }
              as: AssetManager
              captures: { eid: $.data.id }
            - call: "POST /assets/entitlements/${eid}/activate"
              payload: {}
              as: AssetManager
              captures: { ev: $.data.version }
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-FND", category: "DESKTOP", purchase_cost_cents: 100000, in_service_date: "2025-01-01T00:00:00.000Z" }
              as: AssetManager
              captures: { aid: $.data.id }
            - call: "POST /assets/installations"
              payload: { software_product_id: "${pid}", hardware_asset_id: "${aid}", license_entitlement_id: "${eid}", expected_entitlement_version: "${ev}" }
              as: AssetManager
              captures: { i1: $.data.id }
            - call: "POST /assets/installations/${i1}/activate"
              payload: {}
              as: AssetManager
            - call: "GET /assets/entitlements/${eid}"
              payload: {}
              as: AssetManager
              captures: { ev2: $.data.version }
            - call: "POST /assets/installations"
              payload: { software_product_id: "${pid}", hardware_asset_id: "${aid}", license_entitlement_id: "${eid}", expected_entitlement_version: "${ev2}" }
              as: AssetManager
              captures: { i2: $.data.id }
            - call: "POST /assets/true-ups"
              payload: { software_product_id: "${pid}", variant: "AUDIT", as_of: "2025-03-01T00:00:00.000Z" }
              as: ComplianceOfficer
              captures: { tu: $.data.id }
            - call: "POST /assets/true-ups/${tu}/finalize"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "GET /assets/true-ups/${tu}/findings"
              payload: {}
              as: ComplianceOfficer
              captures: { f0_type: "$.data[0].finding_type", f0_short: "$.data[0].shortfall_units" }
          assert:
            - "ComplianceFinding[0].finding_type == OVER_DEPLOYED"
            - "ComplianceFinding[0].shortfall_units == 1   # consumed 2 (1 ACTIVE + 1 PENDING audit) vs entitled 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_already_active_entitlement_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.LicenseEntitlement.DRAFT_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Activating an entitlement already ACTIVE → ERR_INVALID_STATE; no second activation."
        test_recipe:
          setup: ["ACTIVE entitlement."]
          setup_api_calls:
            - call: "POST /assets/vendors"
              payload: { name: "SW Co", vendor_type: "SOFTWARE", support_email: "s@sw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/software-products"
              payload: { vendor_id: "${vid}", name: "EditorPro", license_model: "PER_SEAT" }
              as: AssetManager
              captures: { pid: $.data.id }
            - call: "POST /assets/entitlements"
              payload: { software_product_id: "${pid}", vendor_id: "${vid}", entitled_units: 5, unit_price_cents: 1000, term_start: "2025-01-01T00:00:00.000Z", term_end: "2025-12-31T00:00:00.000Z" }
              as: AssetManager
              captures: { eid: $.data.id }
            - call: "POST /assets/entitlements/${eid}/activate"
              payload: {}
              as: AssetManager
          trigger:
            - call: "POST /assets/entitlements/${eid}/activate"
              payload: {}
              as: AssetManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: transition_disposed_asset_is_terminal_locked
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.HardwareAsset
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "DISPOSED is terminal: IN_STOCK↔IN_REPAIR transition on a DISPOSED asset → ERR_INVALID_STATE (only reverse via disposal-request reverse is allowed)."
        test_recipe:
          setup: ["Asset disposed via approved+completed disposal request."]
          setup_api_calls:
            - call: "POST /assets/_clock/set_current_utc"
              payload: { to_iso8601: "2025-03-01T00:00:00.000Z" }
              as: AssetManager
            - call: "POST /assets/vendors"
              payload: { name: "HW Corp", vendor_type: "HARDWARE", support_email: "s@hw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-TERM", category: "LAPTOP", purchase_cost_cents: 100000, in_service_date: "2025-01-01T00:00:00.000Z" }
              as: AssetManager
              captures: { aid: $.data.id }
            - call: "POST /assets/disposal-requests"
              payload: { hardware_asset_id: "${aid}", reason: "END_OF_LIFE" }
              as: AssetManager
              as_user_id: "mgr-1"
              captures: { dr: $.data.id }
            - call: "POST /assets/disposal-requests/${dr}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /assets/disposal-requests/${dr}/complete"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /assets/hardware/${aid}/transition"
              payload: { to_status: "IN_REPAIR" }
              as: AssetManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE   # DISPOSED is terminal"

      - name: initial_state_disposal_request_is_submitted
        claim_type: Initial State
        grounds:
          - state_machines.DisposalRequest
          - endpoints["POST /assets/disposal-requests"]
        distinguishing_aspect: "A newly created DisposalRequest starts in SUBMITTED with submitted_by_user_id set from X-User-ID."
        test_recipe:
          setup: ["IN_STOCK asset."]
          setup_api_calls:
            - call: "POST /assets/vendors"
              payload: { name: "HW Corp", vendor_type: "HARDWARE", support_email: "s@hw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-INIT", category: "LAPTOP", purchase_cost_cents: 100000, in_service_date: "2025-01-01T00:00:00.000Z" }
              as: AssetManager
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /assets/disposal-requests"
              payload: { hardware_asset_id: "${aid}", reason: "LOST" }
              as: AssetManager
              as_user_id: "mgr-7"
              captures: { dr: $.data.id, st: $.data.status, sub: $.data.submitted_by_user_id }
          assert:
            - "DisposalRequest.${dr}.status == SUBMITTED"
            - "DisposalRequest.${dr}.submitted_by_user_id == mgr-7"

      - name: force_expire_entitlement_before_term_end_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.LicenseEntitlement.ACTIVE_to_EXPIRED
          - validations[priority=14]
          - errors[ERR_COVERAGE_NOT_ENDED]
        distinguishing_aspect: "Force-expiring an ACTIVE entitlement while server clock <= term_end → ERR_COVERAGE_NOT_ENDED; status stays ACTIVE."
        test_recipe:
          setup: ["ACTIVE entitlement term_end=2025-12-31; clock at 2025-06-01 (before end)."]
          setup_api_calls:
            - call: "POST /assets/_clock/set_current_utc"
              payload: { to_iso8601: "2025-06-01T00:00:00.000Z" }
              as: AssetManager
            - call: "POST /assets/vendors"
              payload: { name: "SW Co", vendor_type: "SOFTWARE", support_email: "s@sw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/software-products"
              payload: { vendor_id: "${vid}", name: "EditorPro", license_model: "PER_SEAT" }
              as: AssetManager
              captures: { pid: $.data.id }
            - call: "POST /assets/entitlements"
              payload: { software_product_id: "${pid}", vendor_id: "${vid}", entitled_units: 5, unit_price_cents: 1000, term_start: "2025-01-01T00:00:00.000Z", term_end: "2025-12-31T00:00:00.000Z" }
              as: AssetManager
              captures: { eid: $.data.id }
            - call: "POST /assets/entitlements/${eid}/activate"
              payload: {}
              as: AssetManager
          trigger:
            - call: "POST /assets/entitlements/${eid}/transition"
              payload: { to_status: "EXPIRED" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_COVERAGE_NOT_ENDED"

      - name: entitlement_expire_cascade_uninstalls_active_installs
        claim_type: Side Effect Execution
        grounds:
          - state_machines.LicenseEntitlement.ACTIVE_to_EXPIRED
          - state_machines.InstallationRecord.ACTIVE_to_UNINSTALLED
          - entities.LicenseEntitlement.fields.consumed_units
        distinguishing_aspect: "Force-expiring an entitlement (clock past term_end) cascades its ACTIVE installs → UNINSTALLED and drops consumed_units to 0 — distinct cascade origin from disposal."
        test_recipe:
          setup: ["ACTIVE entitlement with 1 ACTIVE install; clock advanced past term_end."]
          setup_api_calls:
            - call: "POST /assets/_clock/set_current_utc"
              payload: { to_iso8601: "2025-06-01T00:00:00.000Z" }
              as: AssetManager
            - call: "POST /assets/vendors"
              payload: { name: "Mixed", vendor_type: "BOTH", support_email: "s@m.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/software-products"
              payload: { vendor_id: "${vid}", name: "EditorPro", license_model: "PER_SEAT" }
              as: AssetManager
              captures: { pid: $.data.id }
            - call: "POST /assets/entitlements"
              payload: { software_product_id: "${pid}", vendor_id: "${vid}", entitled_units: 5, unit_price_cents: 1000, term_start: "2025-01-01T00:00:00.000Z", term_end: "2025-05-31T00:00:00.000Z" }
              as: AssetManager
              captures: { eid: $.data.id }
            - call: "POST /assets/_clock/set_current_utc"
              payload: { to_iso8601: "2025-04-01T00:00:00.000Z" }
              as: AssetManager
            - call: "POST /assets/entitlements/${eid}/activate"
              payload: {}
              as: AssetManager
              captures: { ev: $.data.version }
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-EXC", category: "DESKTOP", purchase_cost_cents: 100000, in_service_date: "2025-01-01T00:00:00.000Z" }
              as: AssetManager
              captures: { aid: $.data.id }
            - call: "POST /assets/installations"
              payload: { software_product_id: "${pid}", hardware_asset_id: "${aid}", license_entitlement_id: "${eid}", expected_entitlement_version: "${ev}" }
              as: AssetManager
              captures: { iid: $.data.id }
            - call: "POST /assets/installations/${iid}/activate"
              payload: {}
              as: AssetManager
            - call: "POST /assets/_clock/set_current_utc"
              payload: { to_iso8601: "2025-06-01T00:00:00.000Z" }
              as: AssetManager
          trigger:
            - call: "POST /assets/entitlements/${eid}/transition"
              payload: { to_status: "EXPIRED" }
              as: ComplianceOfficer
            - call: "GET /assets/installations/${iid}"
              payload: {}
              as: ComplianceOfficer
              captures: { ist: $.data.status }
            - call: "GET /assets/entitlements/${eid}"
              payload: {}
              as: ComplianceOfficer
              captures: { cu: $.data.consumed_units }
          assert:
            - "InstallationRecord.${iid}.status == UNINSTALLED"
            - "LicenseEntitlement.${eid}.consumed_units == 0"

      - name: depreciation_book_vs_disposal_divergence_stub
        claim_type: Valid Transition
        grounds:
          - state_machines.HardwareAsset.RETIRED_to_DISPOSED
        excluded_because:
          difficulty_instance: dual_variant_calc / depreciation_book_vs_disposal_divergence
          rationale: "The RETIRED→DISPOSED valid transition and its final-depreciation side effects are asserted by the named §1.8 instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: duplicate_asset_tag_among_active_returns_conflict
        claim_type: Violation → Error
        grounds:
          - validations[priority=15]
          - errors[ERR_DUPLICATE_KEY]
          - endpoints["POST /assets/hardware"]
        distinguishing_aspect: "Two non-DISPOSED assets with the same asset_tag → second create ERR_DUPLICATE_KEY (409)."
        test_recipe:
          setup: ["One asset with asset_tag TAG-DUP exists (IN_STOCK)."]
          setup_api_calls:
            - call: "POST /assets/vendors"
              payload: { name: "HW Corp", vendor_type: "HARDWARE", support_email: "s@hw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-DUP", category: "LAPTOP", purchase_cost_cents: 100000, in_service_date: "2025-01-01T00:00:00.000Z" }
              as: AssetManager
          trigger:
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-DUP", category: "DESKTOP", purchase_cost_cents: 200000, in_service_date: "2025-01-01T00:00:00.000Z" }
              as: AssetManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_KEY"

      - name: assignment_limit_reached_blocks_extra_checkout
        claim_type: Aggregate validation
        grounds:
          - validations[priority=16]
          - errors[ERR_ASSIGNMENT_LIMIT_REACHED]
          - entities.Employee.fields.open_checkout_count
        distinguishing_aspect: "Employee max_assigned_assets=1 with one OPEN checkout → a second checkout (different asset) → ERR_ASSIGNMENT_LIMIT_REACHED."
        test_recipe:
          setup: ["Employee max_assigned_assets=1 holding one OPEN checkout; a second IN_STOCK asset exists."]
          setup_api_calls:
            - call: "POST /assets/vendors"
              payload: { name: "HW Corp", vendor_type: "HARDWARE", support_email: "s@hw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/employees"
              payload: { full_name: "Eve", email: "eve@x.com", department: "ENG", max_assigned_assets: 1 }
              as: AssetManager
              captures: { emp: $.data.id }
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-L1", category: "LAPTOP", purchase_cost_cents: 100000, in_service_date: "2025-01-01T00:00:00.000Z" }
              as: AssetManager
              captures: { a1: $.data.id }
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-L2", category: "LAPTOP", purchase_cost_cents: 100000, in_service_date: "2025-01-01T00:00:00.000Z" }
              as: AssetManager
              captures: { a2: $.data.id }
            - call: "POST /assets/hardware/${a1}/checkout"
              payload: { employee_id: "${emp}", checkout_at: "2025-02-01T00:00:00.000Z", expected_return_at: "2025-02-10T00:00:00.000Z" }
              as: AssetManager
          trigger:
            - call: "POST /assets/hardware/${a2}/checkout"
              payload: { employee_id: "${emp}", checkout_at: "2025-02-01T00:00:00.000Z", expected_return_at: "2025-02-10T00:00:00.000Z" }
              as: AssetManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ASSIGNMENT_LIMIT_REACHED"

      - name: coverage_renew_not_eligible_when_auto_renew_false
        claim_type: Conditional validation
        grounds:
          - validations[priority=4]
          - errors[ERR_RENEWAL_NOT_ELIGIBLE]
          - state_machines.WarrantyLease.ACTIVE_to_RENEWED
        distinguishing_aspect: "Completing a COVERAGE renewal on coverage with auto_renew=false → ERR_RENEWAL_NOT_ELIGIBLE; coverage stays ACTIVE."
        test_recipe:
          setup: ["ACTIVE coverage auto_renew=false; a QUOTED COVERAGE renewal order targeting it."]
          setup_api_calls:
            - call: "POST /assets/vendors"
              payload: { name: "Cov Co", vendor_type: "HARDWARE", support_email: "s@cov.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-RNE", category: "SERVER", purchase_cost_cents: 500000, in_service_date: "2025-01-01T00:00:00.000Z" }
              as: AssetManager
              captures: { aid: $.data.id }
            - call: "POST /assets/coverage"
              payload: { hardware_asset_id: "${aid}", vendor_id: "${vid}", coverage_type: "LEASE", coverage_start: "2025-01-01T00:00:00.000Z", coverage_end: "2025-12-31T00:00:00.000Z", monthly_cost_cents: 4500, auto_renew: false }
              as: AssetManager
              captures: { cov: $.data.id }
            - call: "POST /assets/renewal-orders"
              payload: { target_type: "COVERAGE", warranty_lease_id: "${cov}", extend_months: 12 }
              as: ComplianceOfficer
              captures: { ro: $.data.id }
          trigger:
            - call: "POST /assets/renewal-orders/${ro}/complete"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RENEWAL_NOT_ELIGIBLE"

      - name: employee_inactive_blocks_checkout_stub
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=9]
          - errors[ERR_EMPLOYEE_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / checkout_requires_asset_in_stock
          rationale: "Checkout cross-entity gating is exercised by the §1.8 cross_entity instance (asset-status variant); employee-status variant is the symmetric referential check on the same endpoint."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_entitlements_filtered_by_product_paginated
        claim_type: Computed read
        grounds:
          - endpoints["GET /assets/entitlements"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /assets/entitlements?software_product_id=X returns only that product's entitlements as an array with pagination meta (total_count, has_more)."
        test_recipe:
          setup: ["One product with 2 entitlements; a second product with 1 entitlement."]
          setup_api_calls:
            - call: "POST /assets/vendors"
              payload: { name: "SW Co", vendor_type: "SOFTWARE", support_email: "s@sw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/software-products"
              payload: { vendor_id: "${vid}", name: "ProdA", license_model: "PER_SEAT" }
              as: AssetManager
              captures: { pa: $.data.id }
            - call: "POST /assets/software-products"
              payload: { vendor_id: "${vid}", name: "ProdB", license_model: "PER_SEAT" }
              as: AssetManager
              captures: { pb: $.data.id }
            - call: "POST /assets/entitlements"
              payload: { software_product_id: "${pa}", vendor_id: "${vid}", entitled_units: 5, unit_price_cents: 1000, term_start: "2025-01-01T00:00:00.000Z", term_end: "2025-12-31T00:00:00.000Z" }
              as: AssetManager
            - call: "POST /assets/entitlements"
              payload: { software_product_id: "${pa}", vendor_id: "${vid}", entitled_units: 3, unit_price_cents: 1000, term_start: "2025-01-01T00:00:00.000Z", term_end: "2025-12-31T00:00:00.000Z" }
              as: AssetManager
            - call: "POST /assets/entitlements"
              payload: { software_product_id: "${pb}", vendor_id: "${vid}", entitled_units: 9, unit_price_cents: 1000, term_start: "2025-01-01T00:00:00.000Z", term_end: "2025-12-31T00:00:00.000Z" }
              as: AssetManager
          trigger:
            - call: "GET /assets/entitlements?software_product_id=${pa}&limit=10&offset=0"
              payload: { software_product_id: "${pa}", limit: 10, offset: 0 }
              as: ComplianceOfficer
              captures: { n: $.meta }
          assert:
            - "response data is an array of exactly 2 entitlements, all with software_product_id == ${pa}"
            - "response envelope includes total_count == 2 and has_more == false"

      - name: findings_filtered_by_product_reverse_reachability
        claim_type: Cross-reference link
        grounds:
          - endpoints["GET /assets/findings"]
          - entities.ComplianceFinding.fields.software_product_id
        distinguishing_aspect: "GET /assets/findings?software_product_id=X surfaces the cascade-created ComplianceFinding (its only discovery channel since it never appears in a creation response)."
        test_recipe:
          setup: ["An OVER_DEPLOYED audit true-up finalized for product X produced one finding."]
          setup_api_calls:
            - call: "POST /assets/_clock/set_current_utc"
              payload: { to_iso8601: "2025-03-01T00:00:00.000Z" }
              as: AssetManager
            - call: "POST /assets/vendors"
              payload: { name: "SW Co", vendor_type: "SOFTWARE", support_email: "s@sw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/software-products"
              payload: { vendor_id: "${vid}", name: "EditorPro", license_model: "PER_SEAT" }
              as: AssetManager
              captures: { pid: $.data.id }
            - call: "POST /assets/entitlements"
              payload: { software_product_id: "${pid}", vendor_id: "${vid}", entitled_units: 1, unit_price_cents: 1000, term_start: "2025-01-01T00:00:00.000Z", term_end: "2025-12-31T00:00:00.000Z" }
              as: AssetManager
              captures: { eid: $.data.id }
            - call: "POST /assets/entitlements/${eid}/activate"
              payload: {}
              as: AssetManager
              captures: { ev: $.data.version }
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-FF", category: "DESKTOP", purchase_cost_cents: 100000, in_service_date: "2025-01-01T00:00:00.000Z" }
              as: AssetManager
              captures: { aid: $.data.id }
            - call: "POST /assets/installations"
              payload: { software_product_id: "${pid}", hardware_asset_id: "${aid}", license_entitlement_id: "${eid}", expected_entitlement_version: "${ev}" }
              as: AssetManager
              captures: { i1: $.data.id }
            - call: "POST /assets/installations/${i1}/activate"
              payload: {}
              as: AssetManager
            - call: "GET /assets/entitlements/${eid}"
              payload: {}
              as: AssetManager
              captures: { ev2: $.data.version }
            - call: "POST /assets/installations"
              payload: { software_product_id: "${pid}", hardware_asset_id: "${aid}", license_entitlement_id: "${eid}", expected_entitlement_version: "${ev2}" }
              as: AssetManager
              captures: { i2: $.data.id }
            - call: "POST /assets/true-ups"
              payload: { software_product_id: "${pid}", variant: "AUDIT", as_of: "2025-03-01T00:00:00.000Z" }
              as: ComplianceOfficer
              captures: { tu: $.data.id }
            - call: "POST /assets/true-ups/${tu}/finalize"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "GET /assets/findings?software_product_id=${pid}"
              payload: { software_product_id: "${pid}" }
              as: ComplianceOfficer
              captures: { f0: "$.data[0].finding_type" }
          assert:
            - "response data is an array of exactly 1 ComplianceFinding with finding_type == OVER_DEPLOYED and software_product_id == ${pid}"

  # ===========================================================================
  - section: rbac
    instances:
      - name: asset_manager_cannot_approve_disposal_forbidden
        claim_type: exclusive_operation_denied
        grounds:
          - roles.AssetManager
          - roles.ComplianceOfficer
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "AssetManager calling POST /assets/disposal-requests/{id}/approve → ERR_FORBIDDEN (403): approval is a ComplianceOfficer exclusive op (peer/segregation role split)."
        test_recipe:
          setup: ["A SUBMITTED disposal request exists."]
          setup_api_calls:
            - call: "POST /assets/vendors"
              payload: { name: "HW Corp", vendor_type: "HARDWARE", support_email: "s@hw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-RB1", category: "LAPTOP", purchase_cost_cents: 100000, in_service_date: "2025-01-01T00:00:00.000Z" }
              as: AssetManager
              captures: { aid: $.data.id }
            - call: "POST /assets/disposal-requests"
              payload: { hardware_asset_id: "${aid}", reason: "END_OF_LIFE" }
              as: AssetManager
              as_user_id: "mgr-1"
              captures: { dr: $.data.id }
          trigger:
            - call: "POST /assets/disposal-requests/${dr}/approve"
              payload: {}
              as: AssetManager
              as_user_id: "mgr-2"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN   # approve is ComplianceOfficer-exclusive"

      - name: employee_cannot_create_hardware_forbidden
        claim_type: exclusive_operation_denied
        grounds:
          - roles.Employee
          - roles.AssetManager
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Read-only Employee role calling POST /assets/hardware → ERR_FORBIDDEN (403); Employee has no mutating ops."
        test_recipe:
          setup: ["A HARDWARE vendor exists."]
          setup_api_calls:
            - call: "POST /assets/vendors"
              payload: { name: "HW Corp", vendor_type: "HARDWARE", support_email: "s@hw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
          trigger:
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-RB2", category: "LAPTOP", purchase_cost_cents: 100000, in_service_date: "2025-01-01T00:00:00.000Z" }
              as: Employee
              as_user_id: "emp-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN"

      - name: missing_role_header_returns_unauthenticated
        claim_type: authentication_required
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID header → ERR_UNAUTHENTICATED (401) before any role or existence check."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /assets/vendors"
              payload: { name: "Anon", vendor_type: "HARDWARE", support_email: "a@x.com" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED   # no authenticated role"

      - name: disposal_segregation_of_duties_stub
        claim_type: segregation_of_duties_denied
        grounds:
          - validations[priority=7]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / segregation_beats_state_on_disposal_approve
          rationale: "The submitter-cannot-approve segregation check is the safety side of the named §1.8 priority-conflict instance (verified there against a fresh SUBMITTED request)."

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_on_renewal_complete_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[renewal-complete-stale-entitlement]
          - endpoints["POST /assets/renewal-orders/{id}/complete"]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Completing a renewal carrying a stale expected_entitlement_version (one less than current after an intervening install bumped it) → ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["ACTIVE entitlement; client captured version V; an install then advances the version; renewal completed with the now-stale V."]
          setup_api_calls:
            - call: "POST /assets/vendors"
              payload: { name: "Mixed", vendor_type: "BOTH", support_email: "s@m.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/software-products"
              payload: { vendor_id: "${vid}", name: "EditorPro", license_model: "PER_SEAT" }
              as: AssetManager
              captures: { pid: $.data.id }
            - call: "POST /assets/entitlements"
              payload: { software_product_id: "${pid}", vendor_id: "${vid}", entitled_units: 5, unit_price_cents: 1000, term_start: "2025-01-01T00:00:00.000Z", term_end: "2025-12-31T00:00:00.000Z" }
              as: AssetManager
              captures: { eid: $.data.id }
            - call: "POST /assets/entitlements/${eid}/activate"
              payload: {}
              as: AssetManager
              captures: { ev_stale: $.data.version }
            - call: "POST /assets/renewal-orders"
              payload: { target_type: "ENTITLEMENT", license_entitlement_id: "${eid}", extend_months: 6 }
              as: ComplianceOfficer
              captures: { ro: $.data.id }
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-OCC", category: "DESKTOP", purchase_cost_cents: 100000, in_service_date: "2025-01-01T00:00:00.000Z" }
              as: AssetManager
              captures: { aid: $.data.id }
            - call: "POST /assets/installations"
              payload: { software_product_id: "${pid}", hardware_asset_id: "${aid}", license_entitlement_id: "${eid}", expected_entitlement_version: "${ev_stale}" }
              as: AssetManager
              captures: { iid: $.data.id }
          trigger:
            - call: "POST /assets/renewal-orders/${ro}/complete"
              payload: { expected_entitlement_version: "${ev_stale}" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION   # install bumped entitlement.version past ev_stale"

      - name: occ_install_create_stale_version_stub
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[install-create-stale-entitlement]
          - errors[ERR_STALE_VERSION]
        excluded_because:
          difficulty_instance: dual_variant_calc / trueup_live_vs_audit_position_divergence
          rationale: "Each install create in that chain re-reads entitlement.version before charging; the stale-version negative path on POST /assets/installations is the same OCC mechanism captured positively across that instance's install sequence."

      - name: support_status_reconciles_to_out_of_warranty_after_clock_advance
        claim_type: derived_field_reconciliation
        grounds:
          - entities.HardwareAsset.fields.support_status
          - state_machines.WarrantyLease.ACTIVE_to_EXPIRED
        distinguishing_aspect: "After coverage_end passes (clock advanced) and coverage is expired, GET /assets/hardware/{id} reconciles support_status from IN_WARRANTY to OUT_OF_WARRANTY."
        test_recipe:
          setup: ["Asset with ACTIVE warranty [2025-01-01,2025-03-31]; clock at 2025-02-01 (in warranty) then advanced to 2025-04-15 and coverage expired."]
          setup_api_calls:
            - call: "POST /assets/_clock/set_current_utc"
              payload: { to_iso8601: "2025-02-01T00:00:00.000Z" }
              as: AssetManager
            - call: "POST /assets/vendors"
              payload: { name: "Cov Co", vendor_type: "HARDWARE", support_email: "s@cov.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-SS", category: "SERVER", purchase_cost_cents: 500000, in_service_date: "2025-01-01T00:00:00.000Z" }
              as: AssetManager
              captures: { aid: $.data.id }
            - call: "POST /assets/coverage"
              payload: { hardware_asset_id: "${aid}", vendor_id: "${vid}", coverage_type: "WARRANTY", coverage_start: "2025-01-01T00:00:00.000Z", coverage_end: "2025-03-31T00:00:00.000Z" }
              as: AssetManager
              captures: { cov: $.data.id }
            - call: "GET /assets/hardware/${aid}"
              payload: {}
              as: AssetManager
              captures: { ss_in: $.data.support_status }
            - call: "POST /assets/_clock/set_current_utc"
              payload: { to_iso8601: "2025-04-15T00:00:00.000Z" }
              as: AssetManager
            - call: "POST /assets/coverage/${cov}/transition"
              payload: { to_status: "EXPIRED" }
              as: AssetManager
          trigger:
            - call: "GET /assets/hardware/${aid}"
              payload: {}
              as: AssetManager
              captures: { ss_out: $.data.support_status }
          assert:
            - "support_status was IN_WARRANTY at 2025-02-01 (ss_in)"
            - "HardwareAsset.${aid}.support_status == OUT_OF_WARRANTY   # after coverage_end and expiry"

      - name: disposal_complete_cascade_depth3_stub
        claim_type: cascading_side_effects
        grounds:
          - state_machines.HardwareAsset.RETIRED_to_DISPOSED
        excluded_because:
          difficulty_instance: transitive_cascade / disposal_complete_cascade_depth3
          rationale: "The 3-level disposal→uninstall→entitlement cascade is the named §1.8 transitive_cascade instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: checkout_cascade_visible_in_same_request
        claim_type: immediate
        grounds:
          - state_machines.HardwareAsset.IN_STOCK_to_ASSIGNED
          - entities.Employee.fields.open_checkout_count
        distinguishing_aspect: "POST /assets/hardware/{id}/checkout response reflects the checkout (status OPEN); a follow-up GET on the employee immediately shows open_checkout_count incremented — all changes atomic within the request."
        test_recipe:
          setup: ["ACTIVE employee (open_checkout_count=0) and IN_STOCK asset."]
          setup_api_calls:
            - call: "POST /assets/vendors"
              payload: { name: "HW Corp", vendor_type: "HARDWARE", support_email: "s@hw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/employees"
              payload: { full_name: "Fay", email: "fay@x.com", department: "ENG" }
              as: AssetManager
              captures: { emp: $.data.id }
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-IMM", category: "LAPTOP", purchase_cost_cents: 100000, in_service_date: "2025-01-01T00:00:00.000Z" }
              as: AssetManager
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /assets/hardware/${aid}/checkout"
              payload: { employee_id: "${emp}", checkout_at: "2025-02-01T00:00:00.000Z", expected_return_at: "2025-02-10T00:00:00.000Z" }
              as: AssetManager
              captures: { co: $.data.id, cst: $.data.status }
            - call: "GET /assets/employees/${emp}"
              payload: {}
              as: AssetManager
              captures: { oc: $.data.open_checkout_count }
            - call: "GET /assets/hardware/${aid}"
              payload: {}
              as: AssetManager
              captures: { ast: $.data.status }
          assert:
            - "AssignmentCheckout.${co}.status == OPEN"
            - "Employee.${emp}.open_checkout_count == 1   # incremented atomically"
            - "HardwareAsset.${aid}.status == ASSIGNED"
