# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — task_3374
# §1.8 Test Targeting Index: 9 rules x 2 instances = 18 instances.
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and is executable from
# empty-DB using only §1.5 endpoints. All money in integer cents.
# Anchor clock date is 2026-09-01T00:00:00Z unless an instance says otherwise.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: royalty_provisional_vs_final_settlement
        grounds:
          - calculations.royalty_marginal_tiers
          - state_machines.RoyaltyStatement.PROVISIONAL_to_FINALIZED
          - endpoints.POST_/api/royalty-statements/{id}/finalize
        distinguishing_aspect: |
          Same agreement, same quarter, same reported sales: the provisional
          variant computes 5,600,000 cents on reported_sales_cents at submission
          while the final variant recomputes 2,600,000 cents on audited
          30,000,000 cents at finalize — two valid algorithm passes over one
          RoyaltyStatement producing different royalty figures (royalty domain).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Provider admitted (LICENSED); agreement INSURANCE_AUTO ACTIVE, window 2026-01-01..2030-12-31."
            - "Q1 2026 statement submitted with reported_sales_cents 80,000,000 (provisional royalty 6,400,000: entirely inside tier 1)."
            - "Q2 2026 statement submitted with reported_sales_cents 60,000,000 (provisional royalty 5,600,000: 20,000,000 @8% = 1,600,000 against tier-1 remainder, then 40,000,000 @10% = 4,000,000)."
          setup_api_calls:
            - &d_clock
              call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/providers"
              payload: { legal_name: "Atlas Union Insurance Company" }
              as: GovernanceOfficer
              captures: { rp_id: $.data.id }
            - call: "POST /api/providers/${rp_id}/admit"
              payload: {}
              as: GovernanceOfficer
              captures: { rp_v: $.data.version }
            - call: "POST /api/providers/${rp_id}/license-agreements"
              payload: { product_category: "INSURANCE_AUTO", effective_from: "2026-01-01", effective_to: "2030-12-31", expected_provider_version: "${rp_v}" }
              as: ProviderManager
              as_user_id: "${rp_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /api/license-agreements/${ra_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: GovernanceOfficer
              captures: { ra_v2: $.data.version }
            - call: "POST /api/license-agreements/${ra_id}/royalty-statements"
              payload: { period_year: 2026, period_quarter: 1, reported_sales_cents: 80000000, expected_agreement_version: "${ra_v2}" }
              as: ProviderManager
              as_user_id: "${rp_id}"
              captures: { rs_q1_id: $.data.id, rs_q1_prov: $.data.provisional_royalty_cents }
            - call: "GET /api/license-agreements/${ra_id}"
              payload: {}
              as: FinanceController
              as_user_id: "fin-7"
              captures: { ra_v3: $.data.version }
            - call: "POST /api/license-agreements/${ra_id}/royalty-statements"
              payload: { period_year: 2026, period_quarter: 2, reported_sales_cents: 60000000, expected_agreement_version: "${ra_v3}" }
              as: ProviderManager
              as_user_id: "${rp_id}"
              captures: { rs_q2_id: $.data.id, rs_q2_prov: $.data.provisional_royalty_cents }
          trigger:
            - call: "POST /api/royalty-statements/${rs_q2_id}/finalize"
              payload: { audited_sales_cents: 30000000 }
              as: FinanceController
              as_user_id: "fin-7"
              captures: { rs_q2_final: $.data.final_royalty_cents, rs_q2_delta: $.data.delta_cents }
          assert:
            - "RoyaltyStatement.${rs_q1_id}.provisional_royalty_cents == 6400000 (80,000,000 wholly inside the 100,000,000 tier-1 cap at 8%)"
            - "RoyaltyStatement.${rs_q2_id}.provisional_royalty_cents == 5600000 (20,000,000 @8% + 40,000,000 @10% against YTD-before of 80,000,000)"
            - "after finalize: RoyaltyStatement.${rs_q2_id}.status == FINALIZED and final_royalty_cents == 2600000 (audited 30,000,000: 20,000,000 @8% + 10,000,000 @10%)"
            - "RoyaltyStatement.${rs_q2_id}.delta_cents == -3000000 (final 2,600,000 - provisional 5,600,000)"
            - "Provider.${rp_id}.royalty_balance_cents == 9000000 (6,400,000 + 5,600,000 - 3,000,000)"
            - "LicenseAgreement.${ra_id}.recognized_royalty_cents == 2600000 and provisional_outstanding_cents == 6400000 (Q1 still provisional)"

      - name: refund_short_rate_vs_pro_rata_divergence
        grounds:
          - calculations.membership_cancel_refund
          - state_machines.MembershipTerm.ACTIVE_to_CANCELLED
          - endpoints.POST_/api/membership-terms/{id}/cancel
        distinguishing_aspect: |
          Two households with identical 3-year terms (paid_cents 4,320 each)
          cancelled on the same clock date: VOLUNTARY (short-rate, undiscounted
          133/month basis) refunds 3,921 while DECEASED (pro-rata, discounted
          120/month basis) refunds 3,960 — identical inputs, different results,
          in the membership-money domain (distinct from the royalty domain).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; household A and household B each buy 3-year terms (paid_cents 4,320 = round_half_up(1600*3*0.90))."
            - "Clock advanced to 2026-11-15T00:00:00Z, so months_used = (2026-2026)*12 + (11-9) + 1 = 3 for both cancellations."
          setup_api_calls:
            - *d_clock
            - call: "POST /api/households"
              payload: { state_code: "TX", term_years: 3, primary_full_name: "Ann Archer", primary_date_of_birth: "1970-04-15" }
              as: MemberServicesAgent
              captures: { hh_a: $.data.id }
            - call: "POST /api/households"
              payload: { state_code: "TX", term_years: 3, primary_full_name: "Bob Baker", primary_date_of_birth: "1968-02-20" }
              as: MemberServicesAgent
              captures: { hh_b: $.data.id }
            - call: "GET /api/households/${hh_a}/terms"
              payload: {}
              as: MemberServicesAgent
              captures: { term_a: "$.data[0].id" }
            - call: "GET /api/households/${hh_b}/terms"
              payload: {}
              as: MemberServicesAgent
              captures: { term_b: "$.data[0].id" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/membership-terms/${term_a}/cancel"
              payload: { reason: "VOLUNTARY" }
              as: MemberServicesAgent
              captures: { refund_a: $.data.refunded_cents }
            - call: "POST /api/membership-terms/${term_b}/cancel"
              payload: { reason: "DECEASED" }
              as: MemberServicesAgent
              captures: { refund_b: $.data.refunded_cents }
          assert:
            - "MembershipTerm.${term_a}.refunded_cents == 3921 (4320 - 3*133; short-rate claws back the multi-year discount)"
            - "MembershipTerm.${term_b}.refunded_cents == 3960 ((36-3) * round_half_up(4320/36)=120; pro-rata preserves the discount)"
            - "the two refunds differ by exactly 39 cents on identical terms and identical cancellation dates"
            - "Household.${hh_a}.lifetime_refunded_cents == 3921 and Household.${hh_b}.lifetime_refunded_cents == 3960"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: renewal_pricing_discount_cap_nested_min
        grounds:
          - calculations.membership_term_pricing
          - endpoints.POST_/api/_batch/renewal_run
        distinguishing_aspect: |
          Mode (a) combinatorial: the price depends on >= 3 inputs (term_years,
          is_renewal, the DISCOUNT_CAP) with non-linear nested-min interaction —
          a 5-year renewal hits min(0.25, 0.20+0.05) so the cap binds and the
          price is 6,000, while a 3-year renewal's min(0.25, 0.10+0.05) does
          not bind and the price is 4,080.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; household A buys a 5-year auto-renew term (paid 6,400); household B buys a 3-year auto-renew term (paid 4,320)."
            - "Clock advanced to 2031-09-01T00:00:00Z: A's term ended 2031-09-01 (end <= clock, renews); B's term ended 2029-09-01 (also <= clock, renews in the same sweep)."
          setup_api_calls:
            - *d_clock
            - call: "POST /api/households"
              payload: { state_code: "OH", term_years: 5, primary_full_name: "Cara Chen", primary_date_of_birth: "1965-07-04", auto_renew_enabled: true }
              as: MemberServicesAgent
              captures: { hh_a5: $.data.id }
            - call: "POST /api/households"
              payload: { state_code: "OH", term_years: 3, primary_full_name: "Dan Doyle", primary_date_of_birth: "1972-12-01", auto_renew_enabled: true }
              as: MemberServicesAgent
              captures: { hh_b3: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2031-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/_batch/renewal_run"
              payload: {}
              as: PlatformAdmin
              captures: { n_renewed: $.data.renewed_count, n_lapsed: $.data.lapsed_count }
          assert:
            - "renewed_count == 2 and lapsed_count == 0"
            - "Household.${hh_a5}: exactly one term has is_renewal == true, with paid_cents == 6000 (1600*5*(1-0.25); raw discount 0.20+0.05=0.25 hits DISCOUNT_CAP exactly), start_date == \"2031-09-01\", end_date == \"2036-09-01\""
            - "Household.${hh_b3}: exactly one term has is_renewal == true, with paid_cents == 4080 (1600*3*(1-0.15); 0.10+0.05=0.15 is below the cap), start_date == \"2029-09-01\", end_date == \"2032-09-01\""
            - "both households' original terms are RENEWED, and Household.status == ACTIVE for both"

      - name: refund_rounding_order_pinned
        grounds:
          - calculations.membership_cancel_refund
          - entities.MembershipTerm.fields.refunded_cents
        distinguishing_aspect: |
          Mode (b) combinatorial — nested rounding where the order matters and
          the scaffold pins it: the per-month basis is rounded FIRST
          (round_half_up(1600/12) = 133 for short-rate;
          round_half_up(1600/12) = 133 for the 1-year pro-rata effective
          monthly), THEN multiplied by whole months. A 1-year DECEASED cancel
          after 3 used months refunds 9*133 = 1,197; computing 1600*9/12 and
          rounding only at the end would give 1,200 — a different answer the
          implementation MUST NOT produce.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; household C buys a 1-year term (paid 1,600), household D buys a 1-year term (paid 1,600)."
            - "Clock advanced to 2026-11-15T00:00:00Z (months_used = 3)."
          setup_api_calls:
            - *d_clock
            - call: "POST /api/households"
              payload: { state_code: "FL", term_years: 1, primary_full_name: "Eve Ellis", primary_date_of_birth: "1960-01-30" }
              as: MemberServicesAgent
              captures: { hh_c1: $.data.id }
            - call: "POST /api/households"
              payload: { state_code: "FL", term_years: 1, primary_full_name: "Fred Fox", primary_date_of_birth: "1958-05-12" }
              as: MemberServicesAgent
              captures: { hh_d1: $.data.id }
            - call: "GET /api/households/${hh_c1}/terms"
              payload: {}
              as: MemberServicesAgent
              captures: { term_c: "$.data[0].id" }
            - call: "GET /api/households/${hh_d1}/terms"
              payload: {}
              as: MemberServicesAgent
              captures: { term_d: "$.data[0].id" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/membership-terms/${term_c}/cancel"
              payload: { reason: "DECEASED" }
              as: MemberServicesAgent
              captures: { refund_c: $.data.refunded_cents }
            - call: "POST /api/membership-terms/${term_d}/cancel"
              payload: { reason: "VOLUNTARY" }
              as: MemberServicesAgent
              captures: { refund_d: $.data.refunded_cents }
          assert:
            - "MembershipTerm.${term_c}.refunded_cents == 1197 (unused 9 months * round_half_up(1600/12)=133; rounding the per-month basis first is mandatory — 1200 is the wrong algorithm)"
            - "MembershipTerm.${term_d}.refunded_cents == 1201 (1600 - 3*133)"
            - "the DECEASED refund (1,197) is LESS than the VOLUNTARY refund (1,201) on identical 1-year terms — the rounding-order pin, not the variant, drives this 4-cent inversion"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: agreement_probation_reinstate_cycle
        grounds:
          - state_machines.LicenseAgreement.ACTIVE_to_PROBATION
          - state_machines.LicenseAgreement.PROBATION_to_ACTIVE
          - endpoints.POST_/api/license-agreements/{id}/transitions
        distinguishing_aspect: |
          LicenseAgreement is cyclic: ACTIVE -> PROBATION -> ACTIVE loops back
          to a previously-occupied state while probation_count ratchets 0 -> 1
          and stays 1 after reinstatement — the cycle is observable through the
          counter, not erased by the loop.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; provider LICENSED; agreement TRAVEL_SERVICES ACTIVE (window 2026-01-01..2030-12-31), version 2 after activation."
            - "No complaints exist, so escalations_trailing_12mo == 0 at every point."
          setup_api_calls:
            - *d_clock
            - call: "POST /api/providers"
              payload: { legal_name: "Voyager Travel Services Inc" }
              as: GovernanceOfficer
              captures: { cp_id: $.data.id }
            - call: "POST /api/providers/${cp_id}/admit"
              payload: {}
              as: GovernanceOfficer
              captures: { cp_v: $.data.version }
            - call: "POST /api/providers/${cp_id}/license-agreements"
              payload: { product_category: "TRAVEL_SERVICES", effective_from: "2026-01-01", effective_to: "2030-12-31", expected_provider_version: "${cp_v}" }
              as: ProviderManager
              as_user_id: "${cp_id}"
              captures: { ca_id: $.data.id }
            - call: "POST /api/license-agreements/${ca_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: GovernanceOfficer
              captures: { ca_v2: $.data.version }
          trigger:
            - call: "POST /api/license-agreements/${ca_id}/transitions"
              payload: { action: "PROBATE" }
              as: OversightAnalyst
              captures: { ca_v3: $.data.version, ca_probations: $.data.probation_count }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2027-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/license-agreements/${ca_id}/transitions"
              payload: { action: "REINSTATE" }
              as: OversightAnalyst
              captures: { ca_v4: $.data.version }
          assert:
            - "after PROBATE: LicenseAgreement.${ca_id}.status == PROBATION and probation_count == 1"
            - "after REINSTATE: LicenseAgreement.${ca_id}.status == ACTIVE again (cycle closed) and probation_count == 1 (ratcheted, not reset)"
            - "agreement version advanced strictly: 1 (create) -> 2 (activate) -> 3 (probate) -> 4 (reinstate)"

      - name: provider_license_suspend_readmit_cycle
        grounds:
          - state_machines.Provider.LICENSED_to_SUSPENDED
          - state_machines.Provider.SUSPENDED_to_LICENSED
          - calculations.escalation_threshold_eval
        distinguishing_aspect: |
          Provider is cyclic (LICENSED -> SUSPENDED -> LICENSED) but the two
          directions are driven differently: suspension is a system cascade
          from the escalation threshold while re-admission is an operator
          action gated by the same trailing window having decayed below 5.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; provider LICENSED with one ACTIVE agreement (INSURANCE_HEALTH, window 2026-01-01..2030-12-31)."
            - "One household with a good-standing member."
            - "Five complaints filed against the agreement, each opened and escalated on 2026-09-01 (escalated_at == 2026-09-01T00:00:00Z). After the 5th escalation the provider is SUSPENDED."
          setup_api_calls:
            - *d_clock
            - call: "POST /api/providers"
              payload: { legal_name: "Meridian Health Plans" }
              as: GovernanceOfficer
              captures: { sp_id: $.data.id }
            - call: "POST /api/providers/${sp_id}/admit"
              payload: {}
              as: GovernanceOfficer
              captures: { sp_v: $.data.version }
            - call: "POST /api/providers/${sp_id}/license-agreements"
              payload: { product_category: "INSURANCE_HEALTH", effective_from: "2026-01-01", effective_to: "2030-12-31", expected_provider_version: "${sp_v}" }
              as: ProviderManager
              as_user_id: "${sp_id}"
              captures: { sa_id: $.data.id }
            - call: "POST /api/license-agreements/${sa_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: GovernanceOfficer
            - call: "POST /api/households"
              payload: { state_code: "AZ", term_years: 3, primary_full_name: "Gail Grant", primary_date_of_birth: "1963-03-03" }
              as: MemberServicesAgent
              captures: { sh_id: $.data.id, sm_id: $.data.primary_member_id }
            - call: "POST /api/complaints"
              payload: { member_id: "${sm_id}", license_agreement_id: "${sa_id}", category: "CLAIMS", severity: "HIGH", description: "claim 1 denied without review" }
              as: Member
              as_user_id: "${sm_id}"
              captures: { sc1: $.data.id }
            - call: "POST /api/complaints/${sc1}/adjudicate"
              payload: { action: "OPEN_REVIEW" }
              as: OversightAnalyst
            - call: "POST /api/complaints/${sc1}/adjudicate"
              payload: { action: "ESCALATE" }
              as: OversightAnalyst
            - call: "POST /api/complaints"
              payload: { member_id: "${sm_id}", license_agreement_id: "${sa_id}", category: "CLAIMS", severity: "HIGH", description: "claim 2 denied without review" }
              as: Member
              as_user_id: "${sm_id}"
              captures: { sc2: $.data.id }
            - call: "POST /api/complaints/${sc2}/adjudicate"
              payload: { action: "OPEN_REVIEW" }
              as: OversightAnalyst
            - call: "POST /api/complaints/${sc2}/adjudicate"
              payload: { action: "ESCALATE" }
              as: OversightAnalyst
            - call: "POST /api/complaints"
              payload: { member_id: "${sm_id}", license_agreement_id: "${sa_id}", category: "BILLING", severity: "HIGH", description: "surprise bill 3" }
              as: Member
              as_user_id: "${sm_id}"
              captures: { sc3: $.data.id }
            - call: "POST /api/complaints/${sc3}/adjudicate"
              payload: { action: "OPEN_REVIEW" }
              as: OversightAnalyst
            - call: "POST /api/complaints/${sc3}/adjudicate"
              payload: { action: "ESCALATE" }
              as: OversightAnalyst
            - call: "POST /api/complaints"
              payload: { member_id: "${sm_id}", license_agreement_id: "${sa_id}", category: "SERVICE", severity: "LOW", description: "unreturned call 4" }
              as: Member
              as_user_id: "${sm_id}"
              captures: { sc4: $.data.id }
            - call: "POST /api/complaints/${sc4}/adjudicate"
              payload: { action: "OPEN_REVIEW" }
              as: OversightAnalyst
            - call: "POST /api/complaints/${sc4}/adjudicate"
              payload: { action: "ESCALATE" }
              as: OversightAnalyst
            - call: "POST /api/complaints"
              payload: { member_id: "${sm_id}", license_agreement_id: "${sa_id}", category: "PRODUCT_QUALITY", severity: "LOW", description: "policy document errors 5" }
              as: Member
              as_user_id: "${sm_id}"
              captures: { sc5: $.data.id }
            - call: "POST /api/complaints/${sc5}/adjudicate"
              payload: { action: "OPEN_REVIEW" }
              as: OversightAnalyst
            - call: "POST /api/complaints/${sc5}/adjudicate"
              payload: { action: "ESCALATE" }
              as: OversightAnalyst
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/providers/${sp_id}/admit"
              payload: {}
              as: GovernanceOfficer
              captures: { readmit_blocked_err: $.data.error_id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/providers/${sp_id}/admit"
              payload: {}
              as: GovernanceOfficer
              captures: { sp_status_after: $.data.status }
          assert:
            - "after the 5th escalation: Provider.${sp_id}.status == SUSPENDED (provider-wide trailing count 5 >= 5)"
            - "at clock 2027-09-01T00:00:00Z the 2026-09-01T00:00:00Z escalations are still inside the inclusive 365-day window, so re-admission fails with ERR_REINSTATE_BLOCKED"
            - "at clock 2027-09-02T00:00:00Z the window has slid past them (trailing count 0 < 5) and re-admission succeeds: Provider.${sp_id}.status == LICENSED — cycle closed"
            - "LicenseAgreement.${sa_id} remains PROBATION after provider re-admission (no automatic reinstatement of agreements)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: complaint_escalation_three_hop_cascade
        grounds:
          - state_machines.Complaint.UNDER_REVIEW_to_ESCALATED
          - state_machines.LicenseAgreement.ACTIVE_to_PROBATION
          - state_machines.Provider.LICENSED_to_SUSPENDED
          - calculations.escalation_threshold_eval
        distinguishing_aspect: |
          Depth-3 chain from a complaint ESCALATE: the escalation bumps the
          agreement's trailing count (link 1: agreement auto-PROBATION at 3);
          that agreement mutation bumps the provider-wide count (link 2:
          provider SUSPENDED at 5); the provider suspension itself mutates the
          provider's OTHER still-ACTIVE agreement to PROBATION (link 3) — A2 is
          never touched by any direct call in this recipe.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; provider LICENSED with TWO ACTIVE agreements: A1 INSURANCE_AUTO and A2 HOME_SERVICES (both windows 2026-01-01..2030-12-31); A2 version is 2 after activation."
            - "One household with a good-standing member who files five complaints, all against A1; each is opened and escalated on 2026-09-01."
          setup_api_calls:
            - *d_clock
            - call: "POST /api/providers"
              payload: { legal_name: "Homeward Mutual Group" }
              as: GovernanceOfficer
              captures: { tp_id: $.data.id }
            - call: "POST /api/providers/${tp_id}/admit"
              payload: {}
              as: GovernanceOfficer
              captures: { tp_v2: $.data.version }
            - call: "POST /api/providers/${tp_id}/license-agreements"
              payload: { product_category: "INSURANCE_AUTO", effective_from: "2026-01-01", effective_to: "2030-12-31", expected_provider_version: "${tp_v2}" }
              as: ProviderManager
              as_user_id: "${tp_id}"
              captures: { ta1_id: $.data.id }
            - call: "POST /api/license-agreements/${ta1_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: GovernanceOfficer
            - call: "GET /api/providers/${tp_id}"
              payload: {}
              as: GovernanceOfficer
              captures: { tp_v3: $.data.version }
            - call: "POST /api/providers/${tp_id}/license-agreements"
              payload: { product_category: "HOME_SERVICES", effective_from: "2026-01-01", effective_to: "2030-12-31", expected_provider_version: "${tp_v3}" }
              as: ProviderManager
              as_user_id: "${tp_id}"
