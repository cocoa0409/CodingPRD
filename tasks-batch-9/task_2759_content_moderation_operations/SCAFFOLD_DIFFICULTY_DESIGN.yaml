              as_user_id: "${r1_id}"
            - call: "POST /moderation/appeals"
              payload: { case_id: "${case_rho}", grounds_text: "Satire" }
              as: AccountHolder
              as_user_id: "${rho_id}"
              captures: { ap_rho: $.data.id }
            - call: "POST /moderation/appeals"
              payload: { case_id: "${case_sigma}", grounds_text: "Quoting a news report" }
              as: AccountHolder
              as_user_id: "${sigma_id}"
              captures: { ap_sigma: $.data.id }
            - call: "POST /moderation/appeals/${ap_rho}/assign-reviewer"
              payload: { target_reviewer_id: "${r2_id}" }
              as: QAAuditor
              as_user_id: "${qa_id}"
            - call: "POST /moderation/appeals/${ap_sigma}/assign-reviewer"
              payload: { target_reviewer_id: "${r2_id}" }
              as: QAAuditor
              as_user_id: "${qa_id}"
          trigger:
            - call: "POST /moderation/appeals/${ap_rho}/resolve"
              payload: { resolution: "UPHELD", resolution_note: "Threat was explicit" }
              as: Reviewer
              as_user_id: "${r2_id}"
            - call: "POST /moderation/appeals/${ap_sigma}/resolve"
              payload: { resolution: "OVERTURNED", resolution_note: "Newsworthy quotation" }
              as: Reviewer
              as_user_id: "${r2_id}"
          assert:
            - "no compensation — Account.${rho_id}.appeal_credits_remaining == 2, strike_points == 4, standing == LIMITED, lifetime_removed_count == 1"
            - "ContentItem.${ci_rho}.visibility_status == REMOVED, review_status == ACTIONED, reinstated_at == null"
            - "compensation applied — Account.${sigma_id}.appeal_credits_remaining == 3, strike_points == 0, standing == GOOD_STANDING, lifetime_removed_count == 0"
            - "ContentItem.${ci_sigma}.visibility_status == REINSTATED, review_status == CLEAR, reinstated_at == 2026-08-01T09:00:00Z"
            - "conservation across the pair: 6 credits granted, 5 remaining, exactly one permanently consumed by the upheld appeal"
            - "Appeal.${ap_rho}.reinstated_content == false and Appeal.${ap_sigma}.reinstated_content == true"
            - "Reviewer.${r1_id}.appealed_count == 2, upheld_appeal_count == 1, accuracy_score_audit_only == null, accuracy_score_blended == 0.5000"
            - "Reviewer.${r1_id}.status == SUSPENDED — the second resolution takes the gate sample to 2 and 0.5000 < SUSPEND_FLOOR 0.6000"
            - "Reviewer.${r1_id}.open_case_count == 0 and exposure_points_today == 0; ReviewQueue.${q_id}.open_case_count == 0 and unassigned_case_count == 0, because both cases were already decided when the suspension fired"
      - name: reviewer_workload_and_exposure_conserved_across_wellness_break
        grounds:
          - calculations.reviewer_exposure_accounting
          - state_machines.Reviewer.ACTIVE_to_ON_WELLNESS_BREAK
          - state_machines.ModerationCase.ASSIGNED_to_PENDING_ASSIGNMENT
          - endpoints.POST_/moderation/reviewers/{id}/wellness-break
        distinguishing_aspect: |
          A third conserved pair: the reviewer's open_case_count and exposure_points_today against
          the queue's unassigned_case_count. A wellness break must move both held cases back with
          their charges refunded IN FULL and the queue's open_case_count untouched — every case is
          still open, only unassignable. Implementations that decrement open_case_count on the queue,
          or that refund only the last case's charge, break the invariant.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T09:00:00Z."
            - "STANDARD account acct_upsilon with a TEXT item of graphic_weight 2 (charge 2) and a TEXT item of graphic_weight 3 (charge 3)."
            - "T2/VIOLENCE category VIOLENT_THREAT with ACTIVE v1 (auto 0.9000, floor 0.4000, review_sla_minutes 240) and one EN/VIOLENCE queue."
            - "Rita, FRONTLINE, certified on v1, default cap 20 exposure points and 3 concurrent cases, holds both cases ASSIGNED for open_case_count 2 and exposure_points_today 5."
          setup_api_calls:
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/accounts"
              payload: { external_handle: "acct_upsilon", region_code: "US", tier: "STANDARD" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { acct_id: $.data.id }
            - call: "POST /moderation/policy-categories"
              payload: { code: "VIOLENT_THREAT", name: "Violent Threat", severity_tier: "T2", specialty: "VIOLENCE" }
              as: PolicyManager
              as_user_id: "pm-alice"
              captures: { cat_id: $.data.id }
            - call: "POST /moderation/policy-versions"
              payload: { policy_category_id: "${cat_id}", version_label: "v1", auto_action_threshold: 0.9000, review_floor: 0.4000, enforcement_action: "REMOVE", appeal_window_hours: 72, review_sla_minutes: 240 }
              as: PolicyManager
              as_user_id: "pm-alice"
              captures: { pv1_id: $.data.id }
            - call: "POST /moderation/policy-versions/${pv1_id}/back-test"
              payload: {}
              as: PolicyManager
              as_user_id: "pm-alice"
            - call: "POST /moderation/policy-versions/${pv1_id}/activate"
              payload: {}
              as: PolicyManager
              as_user_id: "pm-bob"
            - call: "POST /moderation/review-queues"
              payload: { name: "EN Violence", policy_category_id: "${cat_id}", language: "EN", specialty: "VIOLENCE" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { q_id: $.data.id }
            - call: "POST /moderation/reviewers"
              payload: { display_name: "Rita", languages: ["EN"], specialties: ["VIOLENCE"], utc_offset_minutes: 0, shift_start_local_hour: 8, shift_end_local_hour: 20, role_class: "FRONTLINE" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { r1_id: $.data.id, r1_v: $.data.version }
            - call: "POST /moderation/reviewers/${r1_id}/certifications"
              payload: { policy_version_id: "${pv1_id}", expected_reviewer_version: "${r1_v}" }
              as: PolicyManager
              as_user_id: "pm-alice"
            - call: "POST /moderation/content-items"
              payload: { account_id: "${acct_id}", language: "EN", media_kind: "TEXT", graphic_weight: 2 }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { ciA_id: $.data.id }
            - call: "POST /moderation/content-items"
              payload: { account_id: "${acct_id}", language: "EN", media_kind: "TEXT", graphic_weight: 3 }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { ciB_id: $.data.id }
            - call: "POST /moderation/detection-signals"
              payload: { content_item_id: "${ciA_id}", policy_category_code: "VIOLENT_THREAT", classifier_id: "clf-violence-1", classifier_confidence: 0.7000 }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { caseA_id: $.data.resulting_case_id }
            - call: "POST /moderation/detection-signals"
              payload: { content_item_id: "${ciB_id}", policy_category_code: "VIOLENT_THREAT", classifier_id: "clf-violence-1", classifier_confidence: 0.7000 }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { caseB_id: $.data.resulting_case_id }
            - call: "GET /moderation/moderation-cases/${caseA_id}"
              payload: {}
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { cA_v: $.data.version }
            - call: "POST /moderation/moderation-cases/${caseA_id}/assign"
              payload: { expected_case_version: "${cA_v}", target_reviewer_id: "${r1_id}" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { chargeA: $.data.exposure_points_charged }
            - call: "GET /moderation/moderation-cases/${caseB_id}"
              payload: {}
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { cB_v: $.data.version }
            - call: "POST /moderation/moderation-cases/${caseB_id}/assign"
              payload: { expected_case_version: "${cB_v}", target_reviewer_id: "${r1_id}" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { chargeB: $.data.exposure_points_charged }
          trigger:
            - call: "POST /moderation/reviewers/${r1_id}/wellness-break"
              payload: { break_minutes: 45, reason: "GRAPHIC_EXPOSURE" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
          assert:
            - "the pre-state was ${chargeA} == 2 and ${chargeB} == 3 for Reviewer.${r1_id}.exposure_points_today == 5 and open_case_count == 2"
            - "invariant restored — Reviewer.${r1_id}.open_case_count == 0 and exposure_points_today == 0, both charges refunded in full"
            - "Reviewer.${r1_id}.status == ON_WELLNESS_BREAK, wellness_break_start == 2026-08-01T09:00:00Z, wellness_break_end == 2026-08-01T09:45:00Z, wellness_breaks_taken == 1"
            - "ModerationCase.${caseA_id} and ModerationCase.${caseB_id} are both PENDING_ASSIGNMENT with assigned_reviewer_id == null"
            - "each case retains its charge record: exposure_points_charged 2 and 3 respectively — the refund is on the reviewer's running total, not on the case"
            - "ReviewQueue.${q_id}.open_case_count == 2 (unchanged: both cases are still open) and unassigned_case_count == 2 (one increment per returned case)"
            - "each case's sla_due_at is unchanged at 2026-08-01T11:00:00Z — the break does not re-run calculations.review_sla_due_at"
            - "Account.${acct_id}.strike_points == 0 and standing == GOOD_STANDING — nothing was decided"
