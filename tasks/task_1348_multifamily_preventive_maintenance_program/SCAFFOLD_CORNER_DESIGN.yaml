scaffold_corner_design:
  # ===========================================================================
  # Section: entities — creation / defaults / computed / system / immutability
  # ===========================================================================
  - section: entities
    instances:
      - name: property_creation_defaults_and_computed_init
        claim_type: creation_and_defaults
        grounds: [entities.Property, entities.PMPlan]
        distinguishing_aspect: "POST /properties with all required fields returns 201, status=ACTIVE, version=1; POST plans initializes computed aggregates to 0 and status=DRAFT."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { property_code: "EN-P1", display_name: "Entity P1", notice_lead_hours: 24, default_labor_rate_cents_per_hour: 6000 }
              as: PropertyManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /properties/${p_id}/plans"
              payload: { plan_year: 2027, budget_cents: 500000 }
              as: PropertyManager
              captures: { plan_status: $.data.status, committed: $.data.committed_cents, spent: $.data.spent_cents, planned: $.data.planned_labor_hours, actual: $.data.actual_labor_minutes, ver: $.data.version }
          assert:
            - "PMPlan.status == DRAFT (initial state)"
            - "PMPlan.committed_cents == 0 and spent_cents == 0 and planned_labor_hours == 0 and actual_labor_minutes == 0"
            - "PMPlan.version == 1"

      - name: asset_computed_age_and_warranty_fields
        claim_type: computed_fields
        grounds: [entities.Asset.fields.age_months, entities.Asset.fields.warranty_active, calculations.asset_age]
        distinguishing_aspect: "Asset.age_months and warranty_active are computed at read from the logical clock; client-supplied values are ignored. Installed 2020-08-15, clock default 2026-08-01 -> 71 months; warranty_months=72 -> active. Advance clock to 2026-08-15 -> 72 months, warranty false."
        test_recipe:
          setup: ["Property with one unit and one asset installed 2020-08-15, warranty 72 months"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { property_code: "EN-P2", display_name: "Entity P2", notice_lead_hours: 24, default_labor_rate_cents_per_hour: 6000 }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings"
              payload: { building_label: "A", floors: 1 }
              as: PropertyManager
              captures: { b_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings/${b_id}/units"
              payload: { unit_number: "101", occupancy_status: "OCCUPIED" }
              as: PropertyManager
              captures: { u_id: $.data.id }
            - call: "POST /properties/${p_id}/units/${u_id}/assets"
              payload: { component_type: "HVAC", installed_on: "2020-08-15T00:00:00Z", warranty_months: 72, expected_life_months: 120, replacement_cost_cents: 400000 }
              as: PropertyManager
              captures: { a_id: $.data.id }
          trigger:
            - call: "GET /properties/${p_id}/assets/${a_id}"
              payload: {}
              as: PropertyManager
              captures: { age1: $.data.age_months, w1: $.data.warranty_active }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PropertyManager
            - call: "GET /properties/${p_id}/assets/${a_id}"
              payload: {}
              as: PropertyManager
              captures: { age2: $.data.age_months, w2: $.data.warranty_active }
          assert:
            - "At default clock 2026-08-01: age_months == 71 (day-of-month 1 < 15, one month short), warranty_active == true"
            - "At 2026-08-15: age_months == 72, warranty_active == false (strict <)"

      - name: immutable_ledger_entry_has_no_update
        claim_type: immutability
        grounds: [entities.BudgetLedgerEntry]
        distinguishing_aspect: "BudgetLedgerEntry is common_fields:false (append-only); the only reads are the plan ledger list; no update/delete endpoint exists and each entry has no version field."
        test_recipe:
          setup: ["Property with adopted plan and one published batch containing one visit (produces a VISIT_COMMIT ledger entry)"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { property_code: "EN-P3", display_name: "Entity P3", notice_lead_hours: 24, default_labor_rate_cents_per_hour: 6000 }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings"
              payload: { building_label: "A", floors: 1 }
              as: PropertyManager
              captures: { b_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings/${b_id}/units"
              payload: { unit_number: "101", occupancy_status: "VACANT" }
              as: PropertyManager
              captures: { u_id: $.data.id }
            - call: "POST /properties/${p_id}/units/${u_id}/assets"
              payload: { component_type: "HVAC", installed_on: "2024-01-01T00:00:00Z", warranty_months: 24, expected_life_months: 120, replacement_cost_cents: 400000 }
              as: PropertyManager
              captures: { a_id: $.data.id }
            - call: "POST /properties/${p_id}/pm-task-templates"
              payload: { component_type: "HVAC", task_name: "HVAC svc", frequency_days: 90, estimated_labor_minutes: 30, requires_evidence: false, effective_from: "2026-01-01T00:00:00Z" }
              as: PropertyManager
              captures: { t_id: $.data.id }
            - call: "POST /properties/${p_id}/plans"
              payload: { plan_year: 2026, budget_cents: 1000000 }
              as: PropertyManager
              captures: { pl_id: $.data.id }
            - call: "POST /properties/${p_id}/plans/${pl_id}/adopt"
              payload: {}
              as: PropertyManager
            - call: "POST /properties/${p_id}/batches"
              payload: { batch_label: "b1", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T18:00:00Z" }
              as: PropertyManager
              captures: { bat_id: $.data.id, bat_v: $.data.version }
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits"
              payload: { unit_id: "${u_id}", template_id: "${t_id}", asset_id: "${a_id}", plan_id: "${pl_id}", scheduled_start: "2026-08-10T09:00:00Z", technician_id: "tech-1" }
              as: PropertyManager
            - call: "POST /properties/${p_id}/batches/${bat_id}/publish"
              payload: { expected_batch_version: "${bat_v} + 1" }
              as: PropertyManager
          trigger:
            - call: "GET /properties/${p_id}/plans/${pl_id}/ledger"
              payload: {}
              as: PropertyManager
              captures: { first_kind: "$.data[0].entry_kind", first_amount: "$.data[0].amount_cents" }
          assert:
            - "Ledger contains exactly 1 entry: entry_kind == VISIT_COMMIT, amount_cents == 3000 (30 min at 6000/h)"
            - "Ledger entry response has no version field (common_fields:false)"

      - name: evidence_recorded_by_system_stamped
        claim_type: system_fields
        grounds: [entities.ComplianceEvidence.fields.recorded_by]
        distinguishing_aspect: "ComplianceEvidence.recorded_by is system-stamped from X-User-ID; a client-supplied recorded_by in the payload is rejected as an unknown field (ERR_INVALID_REQUEST) or ignored — response shows the caller's id."
        test_recipe:
          setup: ["Property with vacant unit, asset, template requiring evidence, adopted plan, published batch, visit IN_PROGRESS at 2026-08-02T09:00"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { property_code: "EN-P4", display_name: "Entity P4", notice_lead_hours: 24, default_labor_rate_cents_per_hour: 6000 }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings"
              payload: { building_label: "A", floors: 1 }
              as: PropertyManager
              captures: { b_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings/${b_id}/units"
              payload: { unit_number: "101", occupancy_status: "VACANT" }
              as: PropertyManager
              captures: { u_id: $.data.id }
            - call: "POST /properties/${p_id}/units/${u_id}/assets"
              payload: { component_type: "HVAC", installed_on: "2024-01-01T00:00:00Z", warranty_months: 24, expected_life_months: 120, replacement_cost_cents: 400000 }
              as: PropertyManager
              captures: { a_id: $.data.id }
            - call: "POST /properties/${p_id}/pm-task-templates"
              payload: { component_type: "HVAC", task_name: "Filter swap", frequency_days: 30, estimated_labor_minutes: 15, requires_evidence: true, effective_from: "2026-01-01T00:00:00Z" }
              as: PropertyManager
              captures: { t_id: $.data.id }
            - call: "POST /properties/${p_id}/plans"
              payload: { plan_year: 2026, budget_cents: 1000000 }
              as: PropertyManager
              captures: { pl_id: $.data.id }
            - call: "POST /properties/${p_id}/plans/${pl_id}/adopt"
              payload: {}
              as: PropertyManager
            - call: "POST /properties/${p_id}/batches"
              payload: { batch_label: "b1", window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T18:00:00Z" }
              as: PropertyManager
              captures: { bat_id: $.data.id, bat_v: $.data.version }
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits"
              payload: { unit_id: "${u_id}", template_id: "${t_id}", asset_id: "${a_id}", plan_id: "${pl_id}", scheduled_start: "2026-08-02T09:00:00Z", technician_id: "tech-1" }
              as: PropertyManager
              captures: { v_id: $.data.id }
            - call: "POST /properties/${p_id}/batches/${bat_id}/publish"
              payload: { expected_batch_version: "${bat_v} + 1" }
              as: PropertyManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:00:00Z" }
              as: PropertyManager
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits/${v_id}/start"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
          trigger:
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits/${v_id}/evidence"
              payload: { evidence_type: "FILTER_REPLACEMENT", serial_or_lot: "LOT-123" }
              as: Technician
              as_user_id: "tech-1"
              captures: { recorded_by: $.data.recorded_by }
          assert:
            - "ComplianceEvidence.recorded_by == 'tech-1' (system-stamped from X-User-ID)"

      - name: invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Asset.fields.component_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "component_type outside {HVAC, WATER_HEATER, APPLIANCE} returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Property with building and unit"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { property_code: "EN-P5", display_name: "Entity P5", notice_lead_hours: 24, default_labor_rate_cents_per_hour: 6000 }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings"
              payload: { building_label: "A", floors: 1 }
              as: PropertyManager
              captures: { b_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings/${b_id}/units"
              payload: { unit_number: "101", occupancy_status: "OCCUPIED" }
              as: PropertyManager
              captures: { u_id: $.data.id }
          trigger:
            - call: "POST /properties/${p_id}/units/${u_id}/assets"
              payload: { component_type: "ELEVATOR", installed_on: "2024-01-01T00:00:00Z", warranty_months: 24, expected_life_months: 120, replacement_cost_cents: 400000 }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (component_type not in enum)"

  # ===========================================================================
  # Section: state_machines — invalid transitions, terminal lockdown, init
  # ===========================================================================
  - section: state_machines
    instances:
      - name: visit_start_from_scheduled_invalid
        claim_type: invalid_transition
        grounds:
          - state_machines.PMVisit
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST .../visits/{id}/start while visit is SCHEDULED (batch DRAFT, not published) is rejected with ERR_INVALID_STATE — NOTIFIED is the only valid from-state."
        test_recipe:
          setup: ["Property with vacant unit, asset, template, adopted plan; DRAFT batch with one SCHEDULED visit"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { property_code: "ST-P1", display_name: "ST P1", notice_lead_hours: 24, default_labor_rate_cents_per_hour: 6000 }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings"
              payload: { building_label: "A", floors: 1 }
              as: PropertyManager
              captures: { b_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings/${b_id}/units"
              payload: { unit_number: "101", occupancy_status: "VACANT" }
              as: PropertyManager
              captures: { u_id: $.data.id }
            - call: "POST /properties/${p_id}/units/${u_id}/assets"
              payload: { component_type: "HVAC", installed_on: "2024-01-01T00:00:00Z", warranty_months: 24, expected_life_months: 120, replacement_cost_cents: 400000 }
              as: PropertyManager
              captures: { a_id: $.data.id }
            - call: "POST /properties/${p_id}/pm-task-templates"
              payload: { component_type: "HVAC", task_name: "HVAC svc", frequency_days: 90, estimated_labor_minutes: 30, requires_evidence: false, effective_from: "2026-01-01T00:00:00Z" }
              as: PropertyManager
              captures: { t_id: $.data.id }
            - call: "POST /properties/${p_id}/plans"
              payload: { plan_year: 2026, budget_cents: 1000000 }
              as: PropertyManager
              captures: { pl_id: $.data.id }
            - call: "POST /properties/${p_id}/plans/${pl_id}/adopt"
              payload: {}
              as: PropertyManager
            - call: "POST /properties/${p_id}/batches"
              payload: { batch_label: "b1", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T18:00:00Z" }
              as: PropertyManager
              captures: { bat_id: $.data.id }
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits"
              payload: { unit_id: "${u_id}", template_id: "${t_id}", asset_id: "${a_id}", plan_id: "${pl_id}", scheduled_start: "2026-08-10T09:00:00Z", technician_id: "tech-1" }
              as: PropertyManager
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits/${v_id}/start"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (start from SCHEDULED)"

      - name: completed_visit_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.PMVisit]
        distinguishing_aspect: "A COMPLETED visit rejects start, no-access, cancel, reschedule, and a second complete — every non-declared trigger from a terminal state returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Property with vacant unit, asset, template (no evidence), adopted plan; published batch; visit COMPLETED"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { property_code: "ST-P2", display_name: "ST P2", notice_lead_hours: 24, default_labor_rate_cents_per_hour: 6000 }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings"
              payload: { building_label: "A", floors: 1 }
              as: PropertyManager
              captures: { b_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings/${b_id}/units"
              payload: { unit_number: "101", occupancy_status: "VACANT" }
              as: PropertyManager
              captures: { u_id: $.data.id }
            - call: "POST /properties/${p_id}/units/${u_id}/assets"
              payload: { component_type: "HVAC", installed_on: "2024-01-01T00:00:00Z", warranty_months: 24, expected_life_months: 120, replacement_cost_cents: 400000 }
              as: PropertyManager
              captures: { a_id: $.data.id }
            - call: "POST /properties/${p_id}/pm-task-templates"
              payload: { component_type: "HVAC", task_name: "HVAC svc", frequency_days: 90, estimated_labor_minutes: 30, requires_evidence: false, effective_from: "2026-01-01T00:00:00Z" }
              as: PropertyManager
              captures: { t_id: $.data.id }
            - call: "POST /properties/${p_id}/plans"
              payload: { plan_year: 2026, budget_cents: 1000000 }
              as: PropertyManager
              captures: { pl_id: $.data.id }
            - call: "POST /properties/${p_id}/plans/${pl_id}/adopt"
              payload: {}
              as: PropertyManager
            - call: "POST /properties/${p_id}/batches"
              payload: { batch_label: "b1", window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T18:00:00Z" }
              as: PropertyManager
              captures: { bat_id: $.data.id, bat_v: $.data.version }
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits"
              payload: { unit_id: "${u_id}", template_id: "${t_id}", asset_id: "${a_id}", plan_id: "${pl_id}", scheduled_start: "2026-08-02T09:00:00Z", technician_id: "tech-1" }
              as: PropertyManager
              captures: { v_id: $.data.id }
            - call: "POST /properties/${p_id}/batches/${bat_id}/publish"
              payload: { expected_batch_version: "${bat_v} + 1" }
              as: PropertyManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:00:00Z" }
              as: PropertyManager
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits/${v_id}/start"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits/${v_id}/complete"
              payload: { actual_minutes: 30, condition_score_recorded: 4 }
              as: Technician
              as_user_id: "tech-1"
          trigger:
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits/${v_id}/no-access"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (no-access from COMPLETED)"

      - name: wo_approve_from_open_invalid
        claim_type: invalid_transition
        grounds:
          - state_machines.CorrectiveWorkOrder
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST .../work-orders/{id}/approve while status==OPEN (never submitted for review) returns ERR_INVALID_STATE; the approval chain cannot skip IN_REVIEW."
        test_recipe:
          setup: ["Property with asset, adopted plan, triaged deficiency converted to an OPEN work order"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { property_code: "ST-P3", display_name: "ST P3", notice_lead_hours: 24, default_labor_rate_cents_per_hour: 6000 }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings"
              payload: { building_label: "A", floors: 1 }
              as: PropertyManager
              captures: { b_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings/${b_id}/units"
              payload: { unit_number: "101", occupancy_status: "VACANT" }
              as: PropertyManager
              captures: { u_id: $.data.id }
            - call: "POST /properties/${p_id}/units/${u_id}/assets"
              payload: { component_type: "WATER_HEATER", installed_on: "2023-01-01T00:00:00Z", warranty_months: 24, expected_life_months: 120, replacement_cost_cents: 300000 }
              as: PropertyManager
              captures: { a_id: $.data.id }
            - call: "POST /properties/${p_id}/pm-task-templates"
              payload: { component_type: "WATER_HEATER", task_name: "WH svc", frequency_days: 90, estimated_labor_minutes: 45, requires_evidence: false, effective_from: "2026-01-01T00:00:00Z" }
              as: PropertyManager
              captures: { t_id: $.data.id }
            - call: "POST /properties/${p_id}/plans"
              payload: { plan_year: 2026, budget_cents: 1000000 }
              as: PropertyManager
              captures: { pl_id: $.data.id }
            - call: "POST /properties/${p_id}/plans/${pl_id}/adopt"
              payload: {}
              as: PropertyManager
            - call: "POST /properties/${p_id}/batches"
              payload: { batch_label: "b1", window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T18:00:00Z" }
              as: PropertyManager
              captures: { bat_id: $.data.id, bat_v: $.data.version }
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits"
              payload: { unit_id: "${u_id}", template_id: "${t_id}", asset_id: "${a_id}", plan_id: "${pl_id}", scheduled_start: "2026-08-02T09:00:00Z", technician_id: "tech-1" }
              as: PropertyManager
              captures: { v_id: $.data.id }
            - call: "POST /properties/${p_id}/batches/${bat_id}/publish"
              payload: { expected_batch_version: "${bat_v} + 1" }
              as: PropertyManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:00:00Z" }
              as: PropertyManager
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits/${v_id}/start"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits/${v_id}/deficiencies"
              payload: { asset_id: "${a_id}", severity: "HIGH", description: "Flue" }
              as: Technician
              as_user_id: "tech-1"
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits/${v_id}/complete"
              payload: { actual_minutes: 45, condition_score_recorded: 2 }
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /properties/${p_id}/deficiencies/${d_id}/triage"
              payload: {}
              as: PropertyManager
            - call: "POST /properties/${p_id}/work-orders"
              payload: { deficiency_id: "${d_id}", plan_id: "${pl_id}", estimated_cost_cents: 100000, assigned_technician_id: "tech-9", expected_deficiency_version: "${d_v} + 1" }
              as: PropertyManager
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /properties/${p_id}/work-orders/${wo_id}/approve"
              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (approve from OPEN)"

      - name: batch_executes_automatically_when_all_visits_terminal
        claim_type: valid_transition_side_effects
        grounds: [state_machines.EntryBatch]
        distinguishing_aspect: "Compound shape: when the last non-CANCELLED visit in a published batch completes (or no-accesses), the batch auto-transitions to EXECUTED without a direct API call."
        test_recipe:
          setup: ["Property with vacant unit, asset, template, adopted plan; published batch with exactly one visit; visit started"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { property_code: "ST-P4", display_name: "ST P4", notice_lead_hours: 24, default_labor_rate_cents_per_hour: 6000 }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings"
              payload: { building_label: "A", floors: 1 }
              as: PropertyManager
              captures: { b_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings/${b_id}/units"
              payload: { unit_number: "101", occupancy_status: "VACANT" }
              as: PropertyManager
              captures: { u_id: $.data.id }
