scenario: "2957. Apparel Rental Subscription Operations (fashion rental subscription service): inventory acquisition with style depth planning and expected rental turns per unit, membership plan structure across item counts, swap frequency and shipping cadence, reservation and availability engine matching member requests to physically available units, reverse logistics with inspection, dry cleaning, repair and re-photography before return to inventory, damage and loss policy with fees, waivers and member dispute handling, item retirement decisions with resale channel pricing and revenue recovery, member styling preferences, fit feedback and personalization loops, unit economics per garment across acquisition cost, turns and end-of-life value"
domain_name: "apparel-rental-subscription-operations"
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert_plus
  notes: |
    The core challenge is a finite pool of physical garment units competed for by
    member reservations (quota/allocation) whose per-unit economics must be
    reconciled two different ways (ledger reconciliation). RentalUnit carries two
    independent state dimensions (availability_state x condition_state) that are
    advanced by different actors, so every allocation decision reads a product of
    two machines. Reverse logistics is a fork-join over cleaning and repair with a
    bounded repair retry loop; damage claims are a bounded dispute cycle; resale
    listings are a bounded markdown cycle. Two conserved quantities (physical unit
    position count per style/size, member fee balance) must survive every
    forward/compensating pair.

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: MembershipPlan
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: code
        type: string
        source: input
        description: "Human-readable plan code, unique across all plans"
        constraints: "uppercase alphanumeric plus hyphen, length 3..24, unique"
      - name: name
        type: string
        source: input
        description: "Display name of the plan"
      - name: item_slots
        type: integer
        source: input
        description: "Maximum number of garment units the member may hold or have committed at one time"
        constraints: "1..8"
      - name: monthly_fee_cents
        type: integer
        source: input
        description: "Subscription fee in cents charged per membership month"
        constraints: ">= 0"
      - name: monthly_swaps_allowed
        type: integer
        source: input
        description: "Number of swap operations allowed per calendar month (UTC)"
        constraints: ">= 0"
      - name: shipping_cadence_days
        type: integer
        source: input
        description: "Minimum spacing in days between two OUTBOUND shipments for the same member"
        constraints: ">= 1"
      - name: waiver_monthly_fee_cents
        type: integer
        source: input
        description: "Monthly fee in cents for the optional damage waiver"
        constraints: ">= 0"
      - name: waiver_coverage_cents
        type: integer
        source: input
        description: "Lifetime damage-waiver coverage cap in cents available to a member on this plan"
        constraints: ">= 0"

  - name: Technician
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: employee_code
        type: string
        source: input
        description: "Warehouse employee code, unique across technicians"
        constraints: "unique, length 2..16"
      - name: full_name
        type: string
        source: input
        description: "Technician display name"
      - name: repair_certified
        type: boolean
        source: input
        default: false
        description: "True when this technician may sign off repair completion"
      - name: photography_certified
        type: boolean
        source: input
        default: false
        description: "True when this technician may sign off re-photography"
      - name: status
        type: enum
        source: input
        default: ACTIVE
        description: "Employment status; only ACTIVE technicians may act on reverse-logistics jobs"
        constraints: "one of {ACTIVE, SUSPENDED}; either value settable at creation"

  - name: Style
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: style_code
        type: string
        source: input
        description: "Merchandising style code, unique across styles"
        constraints: "unique, length 3..32"
      - name: brand
        type: string
        source: input
        description: "Brand label of the garment style"
      - name: category
        type: enum
        source: input
        description: "Merchandising category"
        constraints: "one of {GOWN, BLAZER, DRESS, KNITWEAR, ACCESSORY}"
      - name: retail_price_cents
        type: integer
        source: input
        description: "Manufacturer retail price in cents; the base for residual-value and resale math"
        constraints: "> 0"
      - name: acquisition_cost_cents
        type: integer
        source: input
        description: "Reference wholesale acquisition cost per unit in cents used by the PROJECTED economics variant"
        constraints: "> 0"
      - name: size_run
        type: array
        source: input
        description: "Sizes this style is carried in; a reservation's requested_size must be a member of this array"
        constraints: "non-empty array of strings drawn from {XS, S, M, L, XL}"
      - name: expected_rental_turns_per_unit
        type: integer
        source: input
        description: "Planned number of completed rental turns each unit of this style should deliver before retirement"
        constraints: ">= 1"
      - name: planned_depth_units
        type: integer
        source: input
        default: 0
        description: "Buying-plan depth: how many units the planner intends to own"
        constraints: ">= 0"
      - name: planned_eol_value_cents
        type: integer
        source: input
        default: 0
        description: "Planned end-of-life resale recovery per unit in cents used by the PROJECTED economics variant"
        constraints: ">= 0"
      - name: forecast_monthly_requests
        type: integer
        source: input
        default: 0
        description: "Forecast reservation requests per 30-day month, input to required_depth_units"
        constraints: ">= 0"
      - name: avg_rental_days
        type: integer
        source: input
        default: 0
        description: "Planning assumption for days a unit is committed per turn, input to required_depth_units"
        constraints: ">= 0"
      - name: floor_ready_unit_count
        type: integer
        source: computed
        description: "Count of RentalUnit rows with style_id == this style AND availability_state == IN_STOCK AND condition_state == FLOOR_READY"
      - name: active_unit_count
        type: integer
        source: computed
        description: "Count of RentalUnit rows with style_id == this style AND availability_state NOT IN {RETIRED, SOLD}"
      - name: required_depth_units
        type: integer
        source: computed
        description: "Output of calculation style_depth_requirement"
      - name: depth_gap_units
        type: integer
        source: computed
        description: "max(0, required_depth_units - active_unit_count)"
      - name: replenishment_flag
        type: boolean
        source: computed
        description: "True when depth_gap_units >= REPLENISH_TRIGGER_UNITS"
      - name: demand_score
        type: integer
        source: computed
        description: "Output of calculation style_demand_score; personalization signal from FitFeedback rows on this style"

  - name: RentalUnit
    parent: Style
    common_fields: true
    kind: resource
    fields:
      - name: style_id
        type: string
        source: input
        description: "FK -> Style.id; the style this physical unit realizes"
      - name: unit_code
        type: string
        source: input
        description: "Physical asset tag, unique across all rental units"
        constraints: "unique, length 3..40"
      - name: size
        type: string
        source: input
        description: "Physical size of this unit; must be a member of the parent Style.size_run"
      - name: acquisition_cost_cents
        type: integer
        source: input
        description: "Actual landed cost in cents paid for this unit; the REALIZED economics variant uses this, not Style.acquisition_cost_cents"
        constraints: "> 0"
      - name: condition_grade
        type: enum
        source: input
        default: A
        description: "Current physical grade; overwritten by each Inspection.condition_grade_after"
        constraints: "one of {A, B, C, D}"
      - name: availability_state
        type: enum
        source: system
        default: IN_STOCK
        description: "Logistics dimension of the unit state machine"
        constraints: "one of {IN_STOCK, RESERVED, OUT, INBOUND, PROCESSING, RETIRED, SOLD}"
      - name: condition_state
        type: enum
        source: system
        default: FLOOR_READY
        description: "Condition dimension of the unit state machine; evolves independently of availability_state"
        constraints: "one of {FLOOR_READY, NEEDS_CLEANING, NEEDS_REPAIR, QUARANTINED, CONDEMNED}"
      - name: turns_completed
        type: integer
        source: system
        default: 0
        description: "Number of rental turns this unit has finished; incremented only by the RESTOCKED transition"
      - name: quarantine_hold
        type: boolean
        source: system
        default: false
        description: "True while a biohazard inspection finding blocks all reconditioning steps on this unit"
      - name: cumulative_servicing_cost_cents
        type: integer
        source: computed
        description: "Sum of ReverseLogisticsJob.servicing_cost_cents over jobs with rental_unit_id == this unit AND state == RESTOCKED"
      - name: realized_revenue_cents
        type: integer
        source: computed
        description: "Sum of Reservation.revenue_attributed_cents over reservations with allocated_unit_id == this unit AND state == CLOSED"
      - name: occupied_until_date
        type: datetime
        source: computed
        description: "Latest requested_end_date + RECONDITION_BUFFER_DAYS over reservations with allocated_unit_id == this unit AND state NOT IN {RELEASED, CANCELLED, SUPERSEDED}; null when that set is empty. A CLOSED turn is still counted, exactly like the allocation collision check in the availability_match_selector, because the recondition buffer outlives the turn that earned it"
      - name: last_returned_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent INBOUND shipment receipt for this unit; null before the first return"
      - name: retired_at
        type: datetime
        source: system
        description: "Logical-clock instant availability_state became RETIRED; null while not retired"
      - name: retirement_reason
        type: enum
        source: system
        description: "Why the unit left the rentable pool; null while not retired"
        constraints: "one of {TURNS_EXHAUSTED, CONDEMNED_DAMAGE, LOSS, PLANNED_REFRESH}"

  - name: Member
    parent: MembershipPlan
    common_fields: true
    kind: resource
    fields:
      - name: membership_plan_id
        type: string
        source: input
        description: "FK -> MembershipPlan.id; the plan whose slots, swaps, cadence and waiver coverage govern this member"
      - name: email
        type: string
        source: input
        description: "Contact email, unique across members"
        constraints: "unique, contains '@'"
      - name: full_name
        type: string
        source: input
        description: "Member display name"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "Membership lifecycle state"
        constraints: "one of {ACTIVE, PAUSED, DELINQUENT, CANCELLED}"
      - name: waiver_active
        type: boolean
        source: input
        default: false
        description: "True when the member pays the damage waiver and may consume waiver_coverage_cents"
      - name: waiver_coverage_used_cents
        type: integer
        source: system
        default: 0
        description: "Sum of DamageClaim.waiver_applied_cents over this member claims whose state IN {ASSESSED, DISPUTED, CHARGED, WAIVED}; coverage is consumed the moment a claim is assessed and is returned when the claim leaves those states (for example an OVERTURNED dispute sends the claim to DISMISSED). Never exceeds plan.waiver_coverage_cents"
      - name: outstanding_fee_cents
        type: integer
        source: computed
        description: "Signed sum of FeeLedgerEntry.amount_cents over entries with member_id == this member; the conserved monetary quantity"
      - name: units_out_count
        type: integer
        source: computed
        description: "Count of Reservation rows with member_id == this member AND state IN {MATCHED, SHIPPED, IN_POSSESSION, RETURN_INITIATED}"
      - name: swaps_used_current_month
        type: integer
        source: computed
        description: "Count of Reservation rows with member_id == this member AND is_swap == true AND created_at inside the current UTC calendar month window"
      - name: preferred_categories
        type: array
        source: input
        default: []
        description: "Styling preference: categories the member wants surfaced, drawn from Style.category values"
      - name: size_profile
        type: string
        source: input
        default: ""
        description: "Declared primary garment size for this member, e.g. \"M\"; free-form string echoed back by GET /members/{member_id}/personalization-summary and never used as an allocation filter (the allocation filter is the reservation's own requested_size)"
        constraints: "length 0..8"
      - name: fit_confidence_score
        type: integer
        source: computed
        description: "Output of calculation member_fit_confidence over this member's FitFeedback rows"
      - name: damage_risk_score
        type: integer
        source: computed
        description: "Persisted LIFETIME variant output of calculation member_damage_risk_score"
      - name: damage_risk_band
        type: enum
        source: computed
        description: "Band of damage_risk_score"
        constraints: "one of {LOW, ELEVATED, HIGH}"
      - name: late_return_count
        type: integer
        source: computed
        description: "Count of Reservation rows with member_id == this member AND late_days > 0"

  - name: Reservation
    parent: Member
    common_fields: true
    kind: resource
    fields:
      - name: member_id
        type: string
        source: system
        description: "FK -> Member.id; taken from the X-User-ID header of the requesting Member, never from the body"
      - name: style_id
        type: string
        source: input
        description: "FK -> Style.id; the style the member is requesting"
      - name: allocated_unit_id
        type: string
        source: system
        description: "FK -> RentalUnit.id; the physical unit chosen by calculation availability_match_selector, null while WAITLISTED"
      - name: superseded_reservation_id
        type: string
        source: system
        description: "FK -> Reservation.id; on a swap-created reservation, the reservation it replaced; null otherwise"
      - name: requested_size
        type: string
        source: input
        description: "Size requested; must be a member of Style.size_run"
      - name: requested_start_date
        type: string
        source: input
        description: "First calendar day (UTC, YYYY-MM-DD) the member wants the unit; inclusive"
      - name: requested_end_date
        type: string
        source: input
        description: "Return day (UTC, YYYY-MM-DD); exclusive upper bound of the occupation interval"
      - name: state
        type: enum
        source: system
        default: REQUESTED
        description: "Reservation lifecycle state"
        constraints: "one of {REQUESTED, MATCHED, WAITLISTED, SHIPPED, IN_POSSESSION, RETURN_INITIATED, RETURNED, CLOSED, RELEASED, CANCELLED, SUPERSEDED}"
      - name: waitlist_position
        type: integer
        source: computed
        description: "1-based rank among the member-visible waitlist for (style_id, requested_size), ordered by created_at ASC; null unless state == WAITLISTED"
      - name: is_swap
        type: boolean
        source: system
        default: false
        description: "True when this reservation was created by POST /reservations/{reservation_id}/swap"
      - name: matched_at
        type: datetime
        source: system
        description: "Logical-clock instant a unit was allocated; null while WAITLISTED"
      - name: shipped_at
        type: datetime
        source: system
        description: "Logical-clock instant the OUTBOUND shipment was dispatched"
      - name: delivered_at
        type: datetime
        source: system
        description: "Logical-clock instant the OUTBOUND shipment was delivered"
      - name: returned_at
        type: datetime
        source: system
        description: "Logical-clock instant the INBOUND shipment was received"
      - name: rental_days
        type: integer
        source: computed
        description: "Whole days from delivered_at date to returned_at date inclusive of the start day and exclusive of the return day; null until RETURNED"
      - name: late_days
        type: integer
        source: computed
        default: 0
        description: "Output of calculation late_return_fee; days past requested_end_date + RETURN_GRACE_DAYS"
      - name: late_fee_cents
        type: integer
        source: computed
        default: 0
        description: "Output of calculation late_return_fee"
      - name: revenue_attributed_cents
        type: integer
        source: computed
        default: 0
        description: "Output of calculation turn_revenue_attribution, stamped when the reservation reaches CLOSED"

  - name: Shipment
    parent: Member
    common_fields: true
    kind: resource
    fields:
      - name: member_id
        type: string
        source: system
        description: "FK -> Member.id; copied from the linked reservation's member_id"
      - name: reservation_id
        type: string
        source: input
        description: "FK -> Reservation.id; the reservation this leg serves"
      - name: direction
        type: enum
        source: input
        description: "Leg direction"
        constraints: "one of {OUTBOUND, INBOUND}"
      - name: planned_ship_date
        type: string
        source: input
        description: "Planned handover calendar day (UTC, YYYY-MM-DD); the cadence-collision check reads this field"
      - name: state
        type: enum
        source: system
        default: CREATED
        description: "Shipment lifecycle state"
        constraints: "one of {CREATED, IN_TRANSIT, EXCEPTION, DELIVERED, RECEIVED}"
      - name: carrier_reference
        type: string
        source: input
        description: "Carrier tracking reference supplied at dispatch; null before dispatch"
      - name: dispatched_at
        type: datetime
        source: system
        description: "Logical-clock instant of the CREATED -> IN_TRANSIT transition (most recent one)"
      - name: delivered_at
        type: datetime
        source: system
        description: "Logical-clock instant of the IN_TRANSIT -> DELIVERED transition; OUTBOUND only"
      - name: received_at
        type: datetime
        source: system
        description: "Logical-clock instant of the IN_TRANSIT -> RECEIVED transition; INBOUND only"
      - name: exception_count
        type: integer
        source: system
        default: 0
        description: "How many times this shipment has entered EXCEPTION; capped by SHIPMENT_EXCEPTION_CAP"
      - name: exception_reason
        type: string
        source: system
        description: "Reason recorded by the most recent EXCEPTION transition; null when never in exception"

  - name: ReverseLogisticsJob
    parent: RentalUnit
    common_fields: true
    kind: resource
    fields:
      - name: rental_unit_id
        type: string
        source: system
        description: "FK -> RentalUnit.id; the unit being reconditioned"
      - name: reservation_id
        type: string
        source: system
        description: "FK -> Reservation.id; the rental turn that produced this job"
      - name: inspecting_technician_id
        type: string
        source: system
        description: "FK -> Technician.id; the technician who filed the most recent Inspection on this job; null before the first inspection"
      - name: state
        type: enum
        source: system
        default: RECEIVED
        description: "Reconditioning pipeline state"
        constraints: "one of {RECEIVED, INSPECTED, PROCESSING, READY_FOR_PHOTO, PHOTOGRAPHED, RESTOCKED, CONDEMNED_HOLD}"
      - name: cleaning_required
        type: boolean
        source: system
        default: false
        description: "Set by inspection when soil_level != NONE; one leg of the fork-join"
      - name: repair_required
        type: boolean
        source: system
        default: false
        description: "Set by inspection when damage_severity IN {MINOR, MODERATE, SEVERE}; the other leg of the fork-join"
      - name: cleaning_completed_at
        type: datetime
        source: system
        description: "Logical-clock instant dry cleaning was signed off; null while outstanding"
      - name: repair_completed_at
        type: datetime
        source: system
        description: "Logical-clock instant the accepted repair was signed off; null while outstanding"
      - name: photographed_at
        type: datetime
        source: system
        description: "Logical-clock instant re-photography was signed off"
      - name: repair_attempts
        type: integer
        source: system
        default: 0
        description: "Number of repair-completion sign-offs attempted on this job; capped by REPAIR_ATTEMPT_CAP"
      - name: servicing_cost_cents
        type: integer
        source: computed
        description: "Output of calculation servicing_cost_rollup for this job"
      - name: condemned
        type: boolean
        source: system
        default: false
        description: "True when an inspection graded the unit D with damage_severity LOSS or SEVERE-beyond-repair, sending the job to CONDEMNED_HOLD"

  - name: Inspection
    parent: ReverseLogisticsJob
    common_fields: false
    kind: event
    fields:
      - name: job_id
        type: string
        source: system
        description: "FK -> ReverseLogisticsJob.id; the job this inspection belongs to"
      - name: technician_id
        type: string
        source: system
        description: "FK -> Technician.id; taken from the X-User-ID header of the acting WarehouseTech"
      - name: soil_level
        type: enum
        source: input
        description: "Soiling assessment driving the cleaning leg and part of servicing cost"
        constraints: "one of {NONE, LIGHT, HEAVY}"
      - name: damage_severity
        type: enum
        source: input
        description: "Damage assessment driving the repair leg and the damage claim"
        constraints: "one of {NONE, MINOR, MODERATE, SEVERE, LOSS}"
      - name: condition_grade_after
        type: enum
        source: input
        description: "Grade assigned to the unit by this inspection; overwrites RentalUnit.condition_grade"
        constraints: "one of {A, B, C, D}"
      - name: biohazard_flag
        type: boolean
        source: input
        default: false
        description: "True when the unit must be quarantined before any reconditioning step"
      - name: notes
        type: string
        source: input
        description: "Free-text inspector notes; null when omitted"
      - name: attempt_index
        type: integer
        source: system
        description: "1-based index of this inspection among inspections on the same job, assigned in created_at ASC order"

  - name: DamageClaim
    parent: Reservation
    common_fields: true
    kind: resource
    fields:
      - name: reservation_id
        type: string
        source: system
        description: "FK -> Reservation.id; the rental turn during which the damage occurred"
      - name: rental_unit_id
        type: string
        source: system
        description: "FK -> RentalUnit.id; the damaged unit"
      - name: member_id
        type: string
        source: system
        description: "FK -> Member.id; the member who held the unit during the turn"
      - name: inspection_id
        type: string
        source: system
        description: "FK -> Inspection.id; the inspection whose damage_severity opened this claim"
      - name: severity
        type: enum
        source: system
        description: "Copied from the opening Inspection.damage_severity; re-copied when a later inspection on the same job supersedes it; persistently downgraded one step by each PARTIAL dispute resolution"
        constraints: "one of {MINOR, MODERATE, SEVERE, LOSS}"
      - name: state
        type: enum
        source: system
        default: OPEN
        description: "Claim lifecycle state"
        constraints: "one of {OPEN, ASSESSED, DISPUTED, CHARGED, WAIVED, DISMISSED}"
      - name: residual_value_cents
        type: integer
        source: computed
        description: "Output step of calculation damage_fee_assessment: retail price times the residual rate for the post-inspection grade"
      - name: gross_fee_cents
        type: integer
        source: computed
        description: "Output step of calculation damage_fee_assessment before waiver credit"
      - name: waiver_applied_cents
        type: integer
        source: computed
        description: "Output step of calculation damage_fee_assessment: waiver credit consumed by this claim"
      - name: net_fee_cents
        type: integer
        source: computed
        description: "gross_fee_cents - waiver_applied_cents; the amount posted to the fee ledger on CHARGED"
      - name: dispute_round
        type: integer
        source: system
        default: 0
        description: "Number of member disputes filed on this claim; capped by MAX_DISPUTE_ROUNDS"
      - name: dispute_reason
        type: string
        source: input
        description: "Reason text supplied by the member on the most recent dispute; null before any dispute"
      - name: resolution
        type: enum
        source: system
        description: "Adjuster verdict on the most recent dispute; null before any resolution"
        constraints: "one of {UPHELD, OVERTURNED, PARTIAL}"
      - name: assessed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent assessment"
      - name: charged_at
        type: datetime
        source: system
        description: "Logical-clock instant the claim reached CHARGED"

  - name: ResaleListing
    parent: RentalUnit
    common_fields: true
    kind: resource
    fields:
      - name: rental_unit_id
        type: string
        source: input
        description: "FK -> RentalUnit.id; the retired unit being liquidated"
      - name: supersedes_listing_id
        type: string
        source: input
        description: "FK -> ResaleListing.id; the EXPIRED listing on the same unit that this listing replaces; null for a first listing"
      - name: channel
        type: enum
        source: input
        description: "Resale channel whose fee schedule and handling cost apply"
        constraints: "one of {OUTLET, PARTNER_RESALE}"
      - name: state
        type: enum
        source: system
        default: DRAFT
        description: "Listing lifecycle state"
        constraints: "one of {DRAFT, LISTED, EXPIRED, SOLD, WITHDRAWN}"
      - name: markdown_step
        type: integer
        source: system
        default: 0
        description: "Number of markdowns applied; capped by MAX_MARKDOWN_STEPS"
      - name: base_price_cents
        type: integer
        source: computed
        description: "Step 1 output of calculation resale_pricing before the net-recovery floor correction"
      - name: list_price_cents
        type: integer
        source: computed
        description: "Buyer-facing price after the at-most-one net-recovery floor correction"
      - name: channel_fee_cents
        type: integer
        source: computed
        description: "Channel commission in cents charged on list_price_cents"
      - name: net_recovery_cents
        type: integer
        source: computed
        description: "list_price_cents - channel_fee_cents - channel handling cost; the end-of-life value fed into REALIZED unit economics once SOLD"
      - name: floor_adjusted
        type: boolean
        source: computed
        description: "True when the net-recovery floor correction raised the price above base_price_cents"
      - name: sale_price_cents
        type: integer
        source: input
        description: "Actual price realized on sale; null until SOLD"
      - name: listed_at
        type: datetime
        source: system
        description: "Logical-clock instant the listing entered LISTED (most recent time)"
      - name: sold_at
        type: datetime
        source: system
        description: "Logical-clock instant the listing entered SOLD"

  - name: FitFeedback
    parent: Reservation
    common_fields: false
    kind: event
    fields:
      - name: reservation_id
        type: string
        source: system
        description: "FK -> Reservation.id; the completed turn being rated; at most one feedback per reservation"
      - name: member_id
        type: string
        source: system
        description: "FK -> Member.id; copied from the reservation"
      - name: style_id
        type: string
        source: system
        description: "FK -> Style.id; copied from the reservation"
      - name: fit_rating
        type: enum
        source: input
        description: "How the garment fit"
        constraints: "one of {TOO_SMALL, SLIGHTLY_SMALL, TRUE_TO_SIZE, SLIGHTLY_LARGE, TOO_LARGE}"
      - name: occasion_match_score
        type: integer
        source: input
        description: "How well the garment matched the intended occasion"
        constraints: "1..5"
      - name: keep_intent
        type: boolean
        source: input
        description: "True when the member would buy this style outright"
      - name: comment
        type: string
        source: input
        description: "Free-text member comment; null when omitted"

  - name: FeeLedgerEntry
    parent: Member
    common_fields: false
    kind: event
    fields:
      - name: member_id
        type: string
        source: system
        description: "FK -> Member.id; the member whose balance this entry moves"
      - name: damage_claim_id
        type: string
        source: system
        description: "FK -> DamageClaim.id; set on DAMAGE_FEE, WAIVER_CREDIT and DISPUTE_REVERSAL entries, null otherwise"
      - name: reservation_id
        type: string
        source: system
        description: "FK -> Reservation.id; set on LATE_FEE entries, null otherwise"
      - name: kind
        type: enum
        source: system
        description: "Ledger entry kind"
        constraints: "one of {DAMAGE_FEE, LATE_FEE, WAIVER_CREDIT, SETTLEMENT_PAYMENT, DISPUTE_REVERSAL}"
      - name: direction
        type: enum
        source: system
        description: "DEBIT when amount_cents > 0 (member owes more), CREDIT when amount_cents < 0"
        constraints: "one of {DEBIT, CREDIT}"
      - name: amount_cents
        type: integer
        source: input
        description: "Signed amount in cents; positive for DAMAGE_FEE and LATE_FEE, negative for WAIVER_CREDIT, SETTLEMENT_PAYMENT and DISPUTE_REVERSAL"
      - name: balance_after_cents
        type: integer
        source: computed
        description: "Member.outstanding_fee_cents immediately after this entry was appended, ordered by created_at ASC"
      - name: memo
        type: string
        source: input
        description: "Free-text memo; null when omitted"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    shape: cyclic
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /members/{member_id}/pause"
        actor: Member
        preconditions:
          - "member.status == ACTIVE"
          - "member.units_out_count == 0"
        side_effects:
          - "status := PAUSED"
          - "increments Member.version by 1"
        note: "Paused members keep WAITLISTED reservations but cannot create, swap or ship."
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /members/{member_id}/resume"
        actor: Member
        preconditions:
          - "member.status == PAUSED"
        side_effects:
          - "status := ACTIVE"
          - "increments Member.version by 1"
      - from: ACTIVE
        to: DELINQUENT
        trigger: "system: cascade hop 3 of a FeeLedgerEntry append (DAMAGE_FEE via POST /damage-claims/{claim_id}/charge, or LATE_FEE via POST /shipments/{shipment_id}/receipt)"
        actor: system
        preconditions:
          - "member.status == ACTIVE"
          - "recomputed member.outstanding_fee_cents >= DELINQUENCY_THRESHOLD_CENTS"
        side_effects:
          - "status := DELINQUENT"
          - "cascade hop 4: every Reservation of this member with state == WAITLISTED transitions WAITLISTED -> CANCELLED"
          - "cascade hop 4: every Reservation of this member with state == MATCHED transitions MATCHED -> RELEASED"
          - "cascade hop 5: each unit released by hop 4 transitions availability_state RESERVED -> IN_STOCK"
          - "increments Member.version by 1"
      - from: DELINQUENT
        to: ACTIVE
        trigger: "system: cascade of POST /members/{member_id}/fee-settlements, or of POST /damage-claims/{claim_id}/dispute-resolution with resolution OVERTURNED"
        actor: system
        preconditions:
          - "member.status == DELINQUENT"
          - "recomputed member.outstanding_fee_cents < DELINQUENCY_THRESHOLD_CENTS"
        side_effects:
          - "status := ACTIVE"
          - "increments Member.version by 1"
        note: "Reservations cancelled by the delinquency cascade are NOT resurrected; the conserved quantity is the fee balance, not the reservation set."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /members/{member_id}/cancellation"
        actor: Member
        preconditions:
          - "member.status IN {ACTIVE, PAUSED}"
          - "member.outstanding_fee_cents == 0"
        side_effects:
          - "status := CANCELLED"
          - "cascade hop 2: every Reservation of this member with state IN {MATCHED, WAITLISTED} transitions to RELEASED (MATCHED) or CANCELLED (WAITLISTED)"
          - "cascade hop 3: each unit released by hop 2 transitions availability_state RESERVED -> IN_STOCK"
          - "cascade hop 4: each Style owning a unit touched by hop 3 recomputes floor_ready_unit_count, required_depth_units, depth_gap_units and replenishment_flag"
          - "increments Member.version by 1"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /members/{member_id}/cancellation"
        actor: Member
        preconditions:
          - "member.status == PAUSED"
          - "member.outstanding_fee_cents == 0"
        side_effects:
          - "status := CANCELLED"
          - "cascade hop 2: every Reservation of this member with state == WAITLISTED transitions WAITLISTED -> CANCELLED"
          - "increments Member.version by 1"

  - entity: RentalUnit
    shape: parallel
    parallel_dimensions:
      availability_state:
        initial: IN_STOCK
        values: [IN_STOCK, RESERVED, OUT, INBOUND, PROCESSING, RETIRED, SOLD]
        terminal: [SOLD]
      condition_state:
        initial: FLOOR_READY
        values: [FLOOR_READY, NEEDS_CLEANING, NEEDS_REPAIR, QUARANTINED, CONDEMNED]
        terminal: [CONDEMNED]
    initial_state: IN_STOCK
    terminal_states: [SOLD]
    note: |
      The two dimensions advance independently and are both read by the allocation
      engine: a unit is allocatable only when availability_state == IN_STOCK AND
      condition_state == FLOOR_READY. Reconditioning moves condition_state while
      availability_state sits at PROCESSING; retirement moves availability_state
      while condition_state may sit at FLOOR_READY (planned refresh) or CONDEMNED.
    transitions:
      - dimension: availability_state
        from: IN_STOCK
        to: RESERVED
        trigger: "system: allocation inside POST /reservations or POST /reservations/{reservation_id}/swap"
        actor: system
        preconditions:
          - "unit.availability_state == IN_STOCK"
          - "unit.condition_state == FLOOR_READY"
          - "unit.turns_completed < style.expected_rental_turns_per_unit"
          - "no interval collision per validation priority 42"
        side_effects:
          - "availability_state := RESERVED"
          - "unit.occupied_until_date recomputed"
          - "style.floor_ready_unit_count decremented by 1"
          - "increments RentalUnit.version by 1"
      - dimension: availability_state
        from: RESERVED
        to: IN_STOCK
        trigger: "system: compensating release from POST /reservations/{reservation_id}/release, POST /reservations/{reservation_id}/swap, POST /members/{member_id}/cancellation, or the delinquency cascade"
        actor: system
        preconditions:
          - "unit.availability_state == RESERVED"
          - "the releasing reservation is the reservation holding this unit"
        side_effects:
          - "availability_state := IN_STOCK"
          - "unit.occupied_until_date recomputed"
          - "style.floor_ready_unit_count incremented by 1 when condition_state == FLOOR_READY"
          - "increments RentalUnit.version by 1"
        note: "Forward/compensating pair for conserved quantity unit_position_count."
      - dimension: availability_state
        from: RESERVED
        to: OUT
        trigger: "POST /shipments/{shipment_id}/dispatch on the OUTBOUND leg"
        actor: WarehouseTech
        preconditions:
          - "unit.availability_state == RESERVED"
          - "reservation.state == MATCHED"
        side_effects:
          - "availability_state := OUT"
          - "increments RentalUnit.version by 1"
      - dimension: availability_state
        from: OUT
        to: INBOUND
        trigger: "POST /reservations/{reservation_id}/return-initiation"
        actor: Member
        preconditions:
          - "unit.availability_state == OUT"
          - "reservation.state == IN_POSSESSION"
        side_effects:
          - "availability_state := INBOUND"
          - "increments RentalUnit.version by 1"
      - dimension: availability_state
        from: INBOUND
        to: PROCESSING
        trigger: "system: cascade hop 3 of POST /shipments/{shipment_id}/receipt"
        actor: system
        preconditions:
          - "unit.availability_state == INBOUND"
          - "the receipt caused reservation RETURN_INITIATED -> RETURNED (hop 2)"
        side_effects:
          - "availability_state := PROCESSING"
          - "last_returned_at := current logical clock"
          - "a ReverseLogisticsJob is created for (rental_unit_id, reservation_id) in state RECEIVED"
          - "increments RentalUnit.version by 1"
      - dimension: availability_state
        from: PROCESSING
        to: IN_STOCK
        trigger: "POST /reverse-logistics-jobs/{job_id}/restock"
        actor: WarehouseTech
        preconditions:
          - "unit.availability_state == PROCESSING"
          - "unit.condition_state == FLOOR_READY"
          - "job.state == PHOTOGRAPHED"
        side_effects:
          - "availability_state := IN_STOCK"
          - "turns_completed incremented by 1"
          - "cascade hop 2: the linked Reservation transitions RETURNED -> CLOSED and stamps revenue_attributed_cents"
          - "cascade hop 3: style.floor_ready_unit_count, required_depth_units, depth_gap_units, replenishment_flag recomputed"
          - "increments RentalUnit.version by 1"
      - dimension: availability_state
        from: PROCESSING
        to: RETIRED
        trigger: "POST /rental-units/{unit_id}/retirement"
        actor: InventoryPlanner
        preconditions:
          - "unit.availability_state IN {IN_STOCK, PROCESSING}"
          - "no Reservation with allocated_unit_id == unit.id has state IN {MATCHED, SHIPPED, IN_POSSESSION, RETURN_INITIATED}"
          - "no DamageClaim on this unit has state IN {OPEN, ASSESSED, DISPUTED}"
        side_effects:
          - "availability_state := RETIRED"
          - "retired_at := current logical clock"
          - "retirement_reason := body value"
          - "any ReverseLogisticsJob on this unit in state IN {RECEIVED, INSPECTED, PROCESSING, READY_FOR_PHOTO, PHOTOGRAPHED, CONDEMNED_HOLD} transitions to CONDEMNED_HOLD"
          - "cascade hop 2: style.active_unit_count, required_depth_units, depth_gap_units, replenishment_flag recomputed"
          - "increments RentalUnit.version by 1"
      - dimension: availability_state
        from: IN_STOCK
        to: RETIRED
        trigger: "POST /rental-units/{unit_id}/retirement"
        actor: InventoryPlanner
        preconditions:
          - "unit.availability_state == IN_STOCK"
          - "no Reservation with allocated_unit_id == unit.id has state IN {MATCHED, SHIPPED, IN_POSSESSION, RETURN_INITIATED}"
        side_effects:
          - "availability_state := RETIRED"
          - "retired_at := current logical clock"
          - "retirement_reason := body value"
          - "cascade hop 2: style.floor_ready_unit_count and active_unit_count recomputed, then required_depth_units, depth_gap_units and replenishment_flag recomputed"
          - "increments RentalUnit.version by 1"
      - dimension: availability_state
        from: RETIRED
        to: SOLD
        trigger: "POST /resale-listings/{listing_id}/sale"
        actor: InventoryPlanner
        preconditions:
          - "unit.availability_state == RETIRED"
          - "listing.rental_unit_id == unit.id AND listing.state == LISTED"
        side_effects:
          - "availability_state := SOLD"
          - "increments RentalUnit.version by 1"
      - dimension: condition_state
        from: FLOOR_READY
        to: NEEDS_CLEANING
        trigger: "system: POST /reverse-logistics-jobs/{job_id}/inspections with soil_level != NONE AND damage_severity == NONE"
        actor: system
        preconditions:
          - "unit.availability_state == PROCESSING"
          - "inspection.biohazard_flag == false"
        side_effects:
          - "condition_state := NEEDS_CLEANING"
          - "condition_grade := inspection.condition_grade_after"
          - "increments RentalUnit.version by 1"
      - dimension: condition_state
        from: FLOOR_READY
        to: NEEDS_REPAIR
        trigger: "system: POST /reverse-logistics-jobs/{job_id}/inspections with damage_severity IN {MINOR, MODERATE, SEVERE}"
        actor: system
        preconditions:
          - "unit.availability_state == PROCESSING"
          - "inspection.biohazard_flag == false"
        side_effects:
          - "condition_state := NEEDS_REPAIR"
          - "condition_grade := inspection.condition_grade_after"
          - "cascade hop 2: a DamageClaim is created in state OPEN for (reservation_id, rental_unit_id, member_id, inspection_id)"
          - "cascade hop 3: member.damage_risk_score and damage_risk_band recomputed under the LIFETIME variant"
          - "increments RentalUnit.version by 1"
        note: "NEEDS_REPAIR outranks NEEDS_CLEANING: when soil_level != NONE AND damage_severity IN {MINOR, MODERATE, SEVERE}, condition_state := NEEDS_REPAIR and job.cleaning_required is still set to true."
      - dimension: condition_state
        from: NEEDS_CLEANING
        to: NEEDS_REPAIR
        trigger: "system: a re-inspection filed from job state PROCESSING with damage_severity IN {MINOR, MODERATE, SEVERE}"
        actor: system
        preconditions:
          - "unit.availability_state == PROCESSING"
          - "unit.condition_state == NEEDS_CLEANING"
          - "inspection.biohazard_flag == false"
        side_effects:
          - "condition_state := NEEDS_REPAIR"
          - "condition_grade := inspection.condition_grade_after"
          - "cascade hop 2: an existing OPEN or ASSESSED DamageClaim on this job has severity re-copied from the newest inspection and returns to state OPEN; a claim is created only when none exists yet"
          - "cascade hop 3: member.damage_risk_score and damage_risk_band recomputed under the LIFETIME variant"
          - "increments RentalUnit.version by 1"
        note: "This is the edge that re-opens the repair leg after an ACCEPTED repair left the unit in NEEDS_CLEANING: the repair sign-off stamp is cleared while repair_attempts is preserved, so a job that already consumed REPAIR_ATTEMPT_CAP attempts has no attempt left and the next repair-completion is refused by validation priority 28."
      - dimension: condition_state
        from: FLOOR_READY
        to: QUARANTINED
        trigger: "system: POST /reverse-logistics-jobs/{job_id}/inspections with biohazard_flag == true"
        actor: system
        preconditions:
          - "unit.availability_state == PROCESSING"
        side_effects:
          - "condition_state := QUARANTINED"
          - "quarantine_hold := true"
          - "condition_grade := inspection.condition_grade_after"
          - "increments RentalUnit.version by 1"
      - dimension: condition_state
        from: QUARANTINED
        to: NEEDS_CLEANING
        trigger: "POST /reverse-logistics-jobs/{job_id}/quarantine-clearance"
        actor: WarehouseTech
        preconditions:
          - "unit.condition_state == QUARANTINED"
          - "acting technician.repair_certified == true"
        side_effects:
          - "condition_state := NEEDS_CLEANING"
          - "quarantine_hold := false"
          - "increments RentalUnit.version by 1"
      - dimension: condition_state
        from: NEEDS_CLEANING
        to: FLOOR_READY
        trigger: "POST /reverse-logistics-jobs/{job_id}/cleaning-completion"
        actor: WarehouseTech
        preconditions:
          - "unit.condition_state == NEEDS_CLEANING"
          - "unit.quarantine_hold == false"
          - "job.repair_required == false OR job.repair_completed_at IS NOT NULL"
        side_effects:
          - "condition_state := FLOOR_READY"
          - "increments RentalUnit.version by 1"
      - dimension: condition_state
        from: NEEDS_REPAIR
        to: NEEDS_CLEANING
        trigger: "POST /reverse-logistics-jobs/{job_id}/repair-completion with outcome ACCEPTED"
        actor: WarehouseTech
        preconditions:
          - "unit.condition_state == NEEDS_REPAIR"
          - "unit.quarantine_hold == false"
          - "job.cleaning_required == true"
        side_effects:
          - "condition_state := NEEDS_CLEANING"
          - "increments RentalUnit.version by 1"
      - dimension: condition_state
        from: NEEDS_REPAIR
        to: FLOOR_READY
        trigger: "POST /reverse-logistics-jobs/{job_id}/repair-completion with outcome ACCEPTED"
        actor: WarehouseTech
        preconditions:
          - "unit.condition_state == NEEDS_REPAIR"
          - "unit.quarantine_hold == false"
          - "job.cleaning_required == false"
        side_effects:
          - "condition_state := FLOOR_READY"
          - "increments RentalUnit.version by 1"
      - dimension: condition_state
        from: FLOOR_READY
        to: CONDEMNED
        trigger: "system: POST /reverse-logistics-jobs/{job_id}/inspections with damage_severity == LOSS AND biohazard_flag == false"
        actor: system
        preconditions:
          - "unit.availability_state == PROCESSING"
          - "inspection.biohazard_flag == false"
        side_effects:
          - "condition_state := CONDEMNED"
          - "condition_grade := inspection.condition_grade_after"
          - "job.condemned := true and job.state := CONDEMNED_HOLD"
          - "increments RentalUnit.version by 1"
      - dimension: condition_state
        from: NEEDS_REPAIR
        to: CONDEMNED
        trigger: "POST /reverse-logistics-jobs/{job_id}/repair-completion with outcome FAILED on the last permitted attempt, or a re-inspection filed from job state PROCESSING with damage_severity == LOSS"
        actor: WarehouseTech
        preconditions:
          - "unit.condition_state == NEEDS_REPAIR"
          - "job.repair_attempts + 1 == REPAIR_ATTEMPT_CAP OR inspection.damage_severity == LOSS"
        side_effects:
          - "condition_state := CONDEMNED"
          - "job.condemned := true and job.state := CONDEMNED_HOLD"
          - "increments RentalUnit.version by 1"

  - entity: Reservation
    shape: cyclic
    initial_state: REQUESTED
    terminal_states: [CLOSED, RELEASED, CANCELLED, SUPERSEDED]
    transitions:
      - from: REQUESTED
        to: MATCHED
        trigger: "system: allocation step inside POST /reservations or POST /reservations/{reservation_id}/swap"
        actor: system
        preconditions:
          - "member.status == ACTIVE"
          - "calculation availability_match_selector returns a non-empty candidate set"
        side_effects:
          - "state := MATCHED, allocated_unit_id := selected unit id, matched_at := current logical clock"
          - "cascade hop 2: selected RentalUnit availability_state IN_STOCK -> RESERVED"
          - "cascade hop 3: style.floor_ready_unit_count, required_depth_units, depth_gap_units, replenishment_flag recomputed"
          - "member.units_out_count recomputed; increments Member.version by 1"
      - from: REQUESTED
        to: WAITLISTED
        trigger: "system: allocation step inside POST /reservations or POST /reservations/{reservation_id}/swap when no candidate unit exists"
        actor: system
        preconditions:
          - "member.status == ACTIVE"
          - "calculation availability_match_selector returns an empty candidate set AND the request carried no preferred_unit_id"
        side_effects:
          - "state := WAITLISTED, allocated_unit_id := null, waitlist_position computed"
          - "member.units_out_count unchanged; increments Member.version by 1"
        note: "Empty-pool fallback of the selector policy; a request that named preferred_unit_id is rejected instead of waitlisted."
      - from: WAITLISTED
        to: MATCHED
        trigger: "system: waitlist promotion cascade of POST /reverse-logistics-jobs/{job_id}/restock, POST /reservations/{reservation_id}/release, or POST /rental-units/{unit_id}/retirement rollback"
        actor: system
        preconditions:
          - "member.status == ACTIVE"
          - "the freed unit satisfies calculation availability_match_selector eligibility for this reservation"
          - "this reservation is rank 1 by (created_at ASC) among WAITLISTED reservations for the same (style_id, requested_size)"
        side_effects:
          - "state := MATCHED, allocated_unit_id := freed unit id, matched_at := current logical clock, waitlist_position := null"
          - "cascade: the freed RentalUnit availability_state IN_STOCK -> RESERVED"
          - "member.units_out_count recomputed; increments Member.version by 1"
      - from: MATCHED
        to: SHIPPED
        trigger: "POST /shipments/{shipment_id}/dispatch on the OUTBOUND leg"
        actor: WarehouseTech
        preconditions:
          - "reservation.state == MATCHED"
          - "member.status == ACTIVE"
          - "shipment.direction == OUTBOUND AND shipment.state IN {CREATED, EXCEPTION}"
        side_effects:
          - "state := SHIPPED, shipped_at := current logical clock"
          - "cascade: allocated RentalUnit availability_state RESERVED -> OUT"
      - from: SHIPPED
        to: IN_POSSESSION
        trigger: "POST /shipments/{shipment_id}/delivery"
        actor: WarehouseTech
        preconditions:
          - "reservation.state == SHIPPED"
          - "shipment.direction == OUTBOUND AND shipment.state == IN_TRANSIT"
        side_effects:
          - "state := IN_POSSESSION, delivered_at := current logical clock"
      - from: SHIPPED
        to: WAITLISTED
        trigger: "system: cascade hop 3 of POST /shipments/{shipment_id}/exception when exception_count reaches SHIPMENT_EXCEPTION_CAP"
        actor: system
        preconditions:
          - "reservation.state == SHIPPED"
          - "shipment.exception_count + 1 == SHIPMENT_EXCEPTION_CAP"
        side_effects:
          - "state := WAITLISTED, allocated_unit_id := null, matched_at := null, waitlist_position computed"
          - "no fee is charged to the member for a carrier loss"
        note: "Closes the Reservation cycle MATCHED -> SHIPPED -> WAITLISTED -> MATCHED."
      - from: IN_POSSESSION
        to: RETURN_INITIATED
        trigger: "POST /reservations/{reservation_id}/return-initiation"
        actor: Member
        preconditions:
          - "reservation.state == IN_POSSESSION"
          - "no INBOUND Shipment already exists for this reservation"
        side_effects:
          - "state := RETURN_INITIATED"
          - "an INBOUND Shipment is created in state CREATED with planned_ship_date := body value"
          - "cascade: allocated RentalUnit availability_state OUT -> INBOUND"
      - from: RETURN_INITIATED
        to: RETURNED
        trigger: "system: cascade hop 2 of POST /shipments/{shipment_id}/receipt"
        actor: system
        preconditions:
          - "reservation.state == RETURN_INITIATED"
          - "shipment.direction == INBOUND AND shipment.state == IN_TRANSIT"
        side_effects:
          - "state := RETURNED, returned_at := current logical clock, rental_days computed"
          - "late_days and late_fee_cents computed by calculation late_return_fee"
          - "when late_fee_cents > 0 a FeeLedgerEntry of kind LATE_FEE is appended and member.outstanding_fee_cents recomputed"
          - "cascade hop 3: allocated RentalUnit availability_state INBOUND -> PROCESSING and a ReverseLogisticsJob is created in state RECEIVED"
          - "cascade hop 4: style.floor_ready_unit_count, required_depth_units, depth_gap_units and replenishment_flag recomputed"
      - from: RETURNED
        to: CLOSED
        trigger: "system: cascade hop 2 of POST /reverse-logistics-jobs/{job_id}/restock, or of POST /rental-units/{unit_id}/retirement when the unit's job is in CONDEMNED_HOLD"
        actor: system
        preconditions:
          - "reservation.state == RETURNED"
          - "the linked job reached RESTOCKED or the unit was retired out of CONDEMNED_HOLD"
        side_effects:
          - "state := CLOSED"
          - "revenue_attributed_cents := output of calculation turn_revenue_attribution"
          - "unit.realized_revenue_cents recomputed"
      - from: RETURN_INITIATED
        to: CLOSED
        trigger: "system: cascade hop 3 of POST /shipments/{shipment_id}/exception on an INBOUND leg when exception_count reaches SHIPMENT_EXCEPTION_CAP"
        actor: system
        preconditions:
          - "reservation.state == RETURN_INITIATED"
          - "shipment.direction == INBOUND AND shipment.exception_count + 1 == SHIPMENT_EXCEPTION_CAP"
        side_effects:
          - "state := CLOSED, returned_at := null, rental_days := null"
          - "revenue_attributed_cents := output of calculation turn_revenue_attribution"
          - "late_fee_cents := 0 - a carrier loss on the return leg never produces a late fee"
        note: "The garment never reaches the warehouse, so no ReverseLogisticsJob is created and turns_completed is NOT incremented."
      - from: MATCHED
        to: RELEASED
        trigger: "POST /reservations/{reservation_id}/release, or the cascade of POST /members/{member_id}/cancellation or of Member ACTIVE -> DELINQUENT"
        actor: Member
        preconditions:
          - "reservation.state == MATCHED"
        side_effects:
          - "state := RELEASED"
          - "cascade hop 2: allocated RentalUnit availability_state RESERVED -> IN_STOCK, allocated_unit_id := null"
          - "cascade hop 3: the rank-1 WAITLISTED reservation for the freed unit's (style_id, size) is promoted WAITLISTED -> MATCHED when one exists"
          - "member.units_out_count recomputed; increments Member.version by 1"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /reservations/{reservation_id}/release, or the cascade of POST /members/{member_id}/cancellation or of Member ACTIVE -> DELINQUENT"
        actor: Member
        preconditions:
          - "reservation.state == WAITLISTED"
        side_effects:
          - "state := CANCELLED, waitlist_position := null"
          - "waitlist_position recomputed for every remaining WAITLISTED reservation on the same (style_id, requested_size)"
      - from: MATCHED
        to: SUPERSEDED
        trigger: "POST /reservations/{reservation_id}/swap"
        actor: Member
        preconditions:
          - "reservation.state == MATCHED"
          - "member.status == ACTIVE"
          - "member.swaps_used_current_month < plan.monthly_swaps_allowed"
        side_effects:
          - "state := SUPERSEDED"
          - "a new Reservation is created with is_swap := true and superseded_reservation_id := this reservation id"
          - "cascade hop 2: this reservation's allocated RentalUnit availability_state RESERVED -> IN_STOCK before the new reservation's allocation runs"
          - "cascade hop 3: the new reservation runs REQUESTED -> MATCHED or REQUESTED -> WAITLISTED"
          - "increments Member.version by 1"
        note: "The release-before-allocate order is pinned so the freed unit is itself a candidate for the replacement request."

  - entity: Shipment
    shape: cyclic
    initial_state: CREATED
    terminal_states: [DELIVERED, RECEIVED]
    transitions:
      - from: CREATED
        to: IN_TRANSIT
        trigger: "POST /shipments/{shipment_id}/dispatch"
        actor: WarehouseTech
        preconditions:
          - "shipment.state == CREATED"
          - "member.status == ACTIVE for OUTBOUND legs"
          - "reservation.state == MATCHED for OUTBOUND legs, RETURN_INITIATED for INBOUND legs"
        side_effects:
          - "state := IN_TRANSIT, dispatched_at := current logical clock, carrier_reference := body value"
          - "cascade: OUTBOUND only - reservation MATCHED -> SHIPPED and unit RESERVED -> OUT"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /shipments/{shipment_id}/delivery"
        actor: WarehouseTech
        preconditions:
          - "shipment.state == IN_TRANSIT AND shipment.direction == OUTBOUND"
        side_effects:
          - "state := DELIVERED, delivered_at := current logical clock"
          - "cascade: reservation SHIPPED -> IN_POSSESSION"
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /shipments/{shipment_id}/receipt"
        actor: WarehouseTech
        preconditions:
          - "shipment.state == IN_TRANSIT AND shipment.direction == INBOUND"
        side_effects:
          - "state := RECEIVED, received_at := current logical clock"
          - "cascade hop 2: reservation RETURN_INITIATED -> RETURNED (with late_return_fee)"
          - "cascade hop 3: unit INBOUND -> PROCESSING and ReverseLogisticsJob created in RECEIVED"
          - "cascade hop 4: style depth fields recomputed"
      - from: IN_TRANSIT
        to: EXCEPTION
        trigger: "POST /shipments/{shipment_id}/exception"
        actor: WarehouseTech
        preconditions:
          - "shipment.state == IN_TRANSIT"
          - "shipment.exception_count < SHIPMENT_EXCEPTION_CAP"
        side_effects:
          - "state := EXCEPTION, exception_count incremented by 1, exception_reason := body value"
          - "cascade hop 2 (only when exception_count == SHIPMENT_EXCEPTION_CAP): the unit is retired with retirement_reason := LOSS and condition_state := CONDEMNED"
          - "cascade hop 3 (only when exception_count == SHIPMENT_EXCEPTION_CAP): an OUTBOUND leg's reservation transitions SHIPPED -> WAITLISTED; an INBOUND leg's reservation transitions RETURN_INITIATED -> CLOSED and stamps revenue_attributed_cents; no fee is charged to the member in either case"
          - "cascade hop 4 (only when exception_count == SHIPMENT_EXCEPTION_CAP): style.active_unit_count, required_depth_units, depth_gap_units and replenishment_flag recomputed"
      - from: EXCEPTION
        to: IN_TRANSIT
        trigger: "POST /shipments/{shipment_id}/dispatch"
        actor: WarehouseTech
        preconditions:
          - "shipment.state == EXCEPTION"
          - "shipment.exception_count < SHIPMENT_EXCEPTION_CAP"
        side_effects:
          - "state := IN_TRANSIT, dispatched_at := current logical clock, carrier_reference := body value"
        note: "Re-dispatch closes the Shipment cycle IN_TRANSIT -> EXCEPTION -> IN_TRANSIT."

  - entity: ReverseLogisticsJob
    shape: branching
    initial_state: RECEIVED
    terminal_states: [RESTOCKED]
    note: |
      Fork-join: INSPECTED forks into the cleaning leg, the repair leg, both, or
      neither, and READY_FOR_PHOTO is the join. When both legs are required the
      repair leg MUST be signed off before the cleaning leg (a cleaned garment is
      never re-opened for stitching), so cleaning-completion on a job whose repair
      is outstanding is rejected. CONDEMNED_HOLD is a non-terminal sink that only
      unit retirement can drain.
    transitions:
      - from: RECEIVED
        to: INSPECTED
        trigger: "POST /reverse-logistics-jobs/{job_id}/inspections"
        actor: WarehouseTech
        preconditions:
          - "job.state IN {RECEIVED, PROCESSING}"
          - "acting technician.status == ACTIVE"
          - "unit.availability_state == PROCESSING"
        side_effects:
          - "state := INSPECTED, inspecting_technician_id := X-User-ID, an Inspection row is appended with attempt_index"
          - "cleaning_required := (soil_level != NONE), repair_required := (damage_severity IN {MINOR, MODERATE, SEVERE})"
          - "cascade hop 2: unit.condition_grade := condition_grade_after and unit.condition_state moves per the RentalUnit condition dimension"
          - "cascade hop 3: when damage_severity IN {MINOR, MODERATE, SEVERE, LOSS} a DamageClaim is created in state OPEN"
          - "cascade hop 4: member.damage_risk_score and damage_risk_band recomputed (LIFETIME variant)"
          - "servicing_cost_cents recomputed by calculation servicing_cost_rollup"
      - from: PROCESSING
        to: INSPECTED
        trigger: "POST /reverse-logistics-jobs/{job_id}/inspections (re-inspection)"
        actor: WarehouseTech
        preconditions:
          - "job.state == PROCESSING"
          - "job.condemned == false"
        side_effects:
          - "state := INSPECTED, a second Inspection row is appended with attempt_index := prior max + 1"
          - "cleaning_required and repair_required recomputed from the newest inspection; completed legs whose requirement is newly re-asserted have their completion timestamp cleared, so cleaning_completed_at and repair_completed_at return to null for every leg the newest inspection still demands"
          - "repair_attempts is NOT reset by a re-inspection; a job that already consumed REPAIR_ATTEMPT_CAP attempts re-opens the repair leg with no attempts left, so the next repair-completion is rejected by validation priority 28"
          - "an existing OPEN or ASSESSED DamageClaim on this job has severity re-copied from the newest inspection and returns to state OPEN"
        note: "Closes the job cycle INSPECTED -> PROCESSING -> INSPECTED."
      - from: INSPECTED
        to: PROCESSING
        trigger: "system: same request as the inspection, when cleaning_required OR repair_required"
        actor: system
        preconditions:
          - "job.cleaning_required == true OR job.repair_required == true"
          - "the newest inspection has damage_severity != LOSS"
        side_effects:
          - "state := PROCESSING"
      - from: INSPECTED
        to: READY_FOR_PHOTO
        trigger: "system: same request as the inspection, when neither leg is required"
        actor: system
        preconditions:
          - "job.cleaning_required == false AND job.repair_required == false"
          - "the newest inspection has biohazard_flag == false"
        side_effects:
          - "state := READY_FOR_PHOTO"
      - from: INSPECTED
        to: CONDEMNED_HOLD
        trigger: "system: same request as the inspection, when damage_severity == LOSS"
        actor: system
        preconditions:
          - "the newest inspection has damage_severity == LOSS"
        side_effects:
          - "state := CONDEMNED_HOLD, condemned := true"
          - "cascade hop 2: unit.condition_state := CONDEMNED"
          - "cascade hop 3: the DamageClaim opened by this inspection carries severity LOSS"
      - from: PROCESSING
        to: PROCESSING
        trigger: "POST /reverse-logistics-jobs/{job_id}/repair-completion with outcome FAILED"
        actor: WarehouseTech
        preconditions:
          - "job.repair_required == true AND job.repair_completed_at IS NULL"
          - "job.repair_attempts + 1 < REPAIR_ATTEMPT_CAP"
          - "acting technician id != job.inspecting_technician_id"
          - "acting technician.repair_certified == true"
          - "unit.quarantine_hold == false"
        side_effects:
          - "repair_attempts incremented by 1"
          - "servicing_cost_cents recomputed by calculation servicing_cost_rollup"
        note: "Bounded retry loop on the repair leg."
      - from: PROCESSING
        to: CONDEMNED_HOLD
        trigger: "POST /reverse-logistics-jobs/{job_id}/repair-completion with outcome FAILED on the attempt that reaches REPAIR_ATTEMPT_CAP"
        actor: WarehouseTech
        preconditions:
          - "job.repair_attempts + 1 == REPAIR_ATTEMPT_CAP"
          - "acting technician id != job.inspecting_technician_id"
          - "acting technician.repair_certified == true"
        side_effects:
          - "state := CONDEMNED_HOLD, condemned := true, repair_attempts incremented by 1"
          - "cascade hop 2: unit.condition_state NEEDS_REPAIR -> CONDEMNED"
          - "cascade hop 3: the linked DamageClaim severity is escalated to LOSS when its current severity is SEVERE and its state IN {OPEN, ASSESSED}"
      - from: PROCESSING
        to: PROCESSING
        trigger: "POST /reverse-logistics-jobs/{job_id}/repair-completion with outcome ACCEPTED while the cleaning leg is still outstanding"
        actor: WarehouseTech
        preconditions:
          - "job.repair_required == true AND job.repair_completed_at IS NULL"
          - "job.cleaning_required == true AND job.cleaning_completed_at IS NULL"
          - "acting technician id != job.inspecting_technician_id"
          - "acting technician.repair_certified == true"
          - "unit.quarantine_hold == false"
        side_effects:
          - "repair_completed_at := current logical clock, repair_attempts incremented by 1"
          - "cascade hop 2: unit.condition_state NEEDS_REPAIR -> NEEDS_CLEANING"
          - "the job stays in PROCESSING because validation priority 23 requires the repair to be signed off before the cleaning leg"
      - from: PROCESSING
        to: READY_FOR_PHOTO
        trigger: "POST /reverse-logistics-jobs/{job_id}/cleaning-completion, or POST /reverse-logistics-jobs/{job_id}/repair-completion with outcome ACCEPTED when the cleaning leg is not required or is already signed off"
        actor: WarehouseTech
        preconditions:
          - "after applying this sign-off: (cleaning_required == false OR cleaning_completed_at IS NOT NULL) AND (repair_required == false OR repair_completed_at IS NOT NULL)"
          - "unit.quarantine_hold == false"
        side_effects:
          - "state := READY_FOR_PHOTO"
          - "servicing_cost_cents recomputed by calculation servicing_cost_rollup"
        note: "The join point. Signing off only one of two required legs leaves the job in PROCESSING."
      - from: READY_FOR_PHOTO
        to: PHOTOGRAPHED
        trigger: "POST /reverse-logistics-jobs/{job_id}/photography"
        actor: WarehouseTech
        preconditions:
          - "job.state == READY_FOR_PHOTO"
          - "acting technician.photography_certified == true"
          - "unit.condition_state == FLOOR_READY"
        side_effects:
          - "state := PHOTOGRAPHED, photographed_at := current logical clock"
      - from: PHOTOGRAPHED
        to: RESTOCKED
        trigger: "POST /reverse-logistics-jobs/{job_id}/restock"
        actor: WarehouseTech
        preconditions:
          - "job.state == PHOTOGRAPHED"
          - "no DamageClaim with rental_unit_id == job.rental_unit_id AND reservation_id == job.reservation_id has state IN {OPEN, ASSESSED, DISPUTED}"
          - "unit.condition_state == FLOOR_READY AND unit.quarantine_hold == false"
        side_effects:
          - "state := RESTOCKED"
          - "cascade hop 2: unit availability_state PROCESSING -> IN_STOCK and turns_completed incremented by 1"
          - "cascade hop 3: the linked Reservation RETURNED -> CLOSED with revenue_attributed_cents stamped"
          - "cascade hop 4: style.floor_ready_unit_count, required_depth_units, depth_gap_units and replenishment_flag recomputed"
          - "cascade hop 5: the rank-1 WAITLISTED reservation for (unit.style_id, unit.size) is promoted WAITLISTED -> MATCHED when one exists and the freed unit is eligible"

  - entity: DamageClaim
    shape: cyclic
    initial_state: OPEN
    terminal_states: [WAIVED, DISMISSED]
    transitions:
      - from: OPEN
        to: ASSESSED
        trigger: "POST /damage-claims/{claim_id}/assessment"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.state == OPEN"
          - "the unit has at least one Inspection on the linked job"
        side_effects:
          - "state := ASSESSED, assessed_at := current logical clock"
          - "residual_value_cents, gross_fee_cents, waiver_applied_cents, net_fee_cents computed by calculation damage_fee_assessment"
          - "member.waiver_coverage_used_cents incremented by waiver_applied_cents"
          - "no FeeLedgerEntry is appended here; the waiver credit is posted alongside the DAMAGE_FEE entry at CHARGED time"
      - from: ASSESSED
        to: CHARGED
        trigger: "POST /damage-claims/{claim_id}/charge"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.state == ASSESSED"
          - "claim.net_fee_cents > 0"
          - "member.status != CANCELLED"
        side_effects:
          - "state := CHARGED, charged_at := current logical clock"
          - "cascade hop 2: a FeeLedgerEntry of kind DAMAGE_FEE with amount_cents := gross_fee_cents is appended and, when waiver_applied_cents > 0, a second FeeLedgerEntry of kind WAIVER_CREDIT with amount_cents := 0 - waiver_applied_cents is appended; member.outstanding_fee_cents is recomputed, so the net movement equals net_fee_cents"
          - "cascade hop 3: when the recomputed member.outstanding_fee_cents >= DELINQUENCY_THRESHOLD_CENTS and member.status == ACTIVE, member ACTIVE -> DELINQUENT"
          - "cascade hop 4: the delinquency transition cancels the member's WAITLISTED reservations and releases the MATCHED ones"
          - "cascade hop 5: each unit released by hop 4 moves RESERVED -> IN_STOCK and its style's depth fields are recomputed"
      - from: ASSESSED
        to: WAIVED
        trigger: "POST /damage-claims/{claim_id}/waiver"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.state == ASSESSED"
          - "member.waiver_active == true"
          - "plan.waiver_coverage_cents - member.waiver_coverage_used_cents + claim.waiver_applied_cents >= claim.gross_fee_cents"
        side_effects:
          - "state := WAIVED"
          - "waiver_applied_cents := gross_fee_cents, net_fee_cents := 0"
          - "member.waiver_coverage_used_cents adjusted so the total consumed equals gross_fee_cents for this claim"
          - "a FeeLedgerEntry of kind WAIVER_CREDIT with amount_cents := 0 is NOT appended; the balance never moved"
      - from: ASSESSED
        to: DISPUTED
        trigger: "POST /damage-claims/{claim_id}/disputes"
        actor: Member
        preconditions:
          - "claim.state == ASSESSED"
          - "claim.dispute_round < MAX_DISPUTE_ROUNDS"
          - "the acting member id == claim.member_id"
        side_effects:
          - "state := DISPUTED, dispute_round incremented by 1, dispute_reason := body value"
      - from: CHARGED
        to: DISPUTED
        trigger: "POST /damage-claims/{claim_id}/disputes"
        actor: Member
        preconditions:
          - "claim.state == CHARGED"
          - "claim.dispute_round < MAX_DISPUTE_ROUNDS"
          - "current logical clock date <= date(claim.charged_at) + DISPUTE_WINDOW_DAYS"
        side_effects:
          - "state := DISPUTED, dispute_round incremented by 1, dispute_reason := body value"
        note: "A charged claim stays disputable inside the window; the ledger is untouched until the verdict."
      - from: DISPUTED
        to: ASSESSED
        trigger: "POST /damage-claims/{claim_id}/dispute-resolution with resolution PARTIAL"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.state == DISPUTED"
        side_effects:
          - "state := ASSESSED, resolution := PARTIAL"
          - "claim.severity := one step lower and PERSISTED (LOSS -> SEVERE, SEVERE -> MODERATE, MODERATE -> MINOR, MINOR stays MINOR), so a second PARTIAL verdict downgrades from the already-downgraded value"
          - "residual_value_cents, gross_fee_cents, waiver_applied_cents and net_fee_cents recomputed by calculation damage_fee_assessment at the new severity"
          - "when the claim had already been charged, a FeeLedgerEntry of kind DISPUTE_REVERSAL with amount_cents := 0 - (signed sum of this claim's prior entries) is appended, and the recomputed pair is posted afresh as DAMAGE_FEE with amount_cents := gross_fee_cents plus, when waiver_applied_cents > 0, WAIVER_CREDIT with amount_cents := 0 - waiver_applied_cents"
        note: "Closes the claim cycle ASSESSED -> DISPUTED -> ASSESSED, bounded by MAX_DISPUTE_ROUNDS."
      - from: DISPUTED
        to: CHARGED
        trigger: "POST /damage-claims/{claim_id}/dispute-resolution with resolution UPHELD"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.state == DISPUTED"
          - "claim.net_fee_cents > 0"
        side_effects:
          - "state := CHARGED, resolution := UPHELD, charged_at := current logical clock when it was null"
          - "the DAMAGE_FEE (and, when applicable, WAIVER_CREDIT) pair is appended only when this claim has no unreversed DAMAGE_FEE entry yet"
      - from: DISPUTED
        to: DISMISSED
        trigger: "POST /damage-claims/{claim_id}/dispute-resolution with resolution OVERTURNED"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.state == DISPUTED"
        side_effects:
          - "state := DISMISSED, resolution := OVERTURNED"
          - "cascade hop 2: when a DAMAGE_FEE entry for this claim exists, a FeeLedgerEntry of kind DISPUTE_REVERSAL with amount_cents := 0 - (signed sum of this claim's prior entries) is appended and member.outstanding_fee_cents recomputed"
          - "cascade hop 3: member.waiver_coverage_used_cents decremented by claim.waiver_applied_cents"
          - "cascade hop 4: when the recomputed member.outstanding_fee_cents < DELINQUENCY_THRESHOLD_CENTS and member.status == DELINQUENT, member DELINQUENT -> ACTIVE"
        note: "Compensating action for the CHARGED forward action; conserved quantity member_fee_balance returns to its pre-charge value."

  - entity: ResaleListing
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [SOLD, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: LISTED
        trigger: "system: same request as POST /resale-listings"
        actor: system
        preconditions:
          - "unit.availability_state == RETIRED"
          - "no other ResaleListing on this unit has state IN {DRAFT, LISTED}"
        side_effects:
          - "state := LISTED, listed_at := current logical clock"
          - "base_price_cents, list_price_cents, channel_fee_cents, net_recovery_cents, floor_adjusted computed by calculation resale_pricing"
          - "increments RentalUnit.version by 1"
      - from: LISTED
        to: SOLD
        trigger: "POST /resale-listings/{listing_id}/sale"
        actor: InventoryPlanner
        preconditions:
          - "listing.state == LISTED"
          - "body sale_price_cents >= round_half_up(listing.list_price_cents * (1 - MAX_SALE_DISCOUNT_PCT))"
        side_effects:
          - "state := SOLD, sold_at := current logical clock, sale_price_cents := body value"
          - "channel_fee_cents and net_recovery_cents recomputed from sale_price_cents by calculation resale_pricing step 4 and step 6"
          - "cascade hop 2: unit availability_state RETIRED -> SOLD"
          - "cascade hop 3: the unit's style REALIZED unit-economics inputs now include this net_recovery_cents"
      - from: LISTED
        to: EXPIRED
        trigger: "POST /resale-listings/{listing_id}/expiration"
        actor: InventoryPlanner
        preconditions:
          - "listing.state == LISTED"
          - "current logical clock date >= date(listing.listed_at) + LISTING_WINDOW_DAYS"
        side_effects:
          - "state := EXPIRED"
      - from: EXPIRED
        to: LISTED
        trigger: "POST /resale-listings/{listing_id}/reprice"
        actor: InventoryPlanner
        preconditions:
          - "listing.state == EXPIRED"
          - "listing.markdown_step < MAX_MARKDOWN_STEPS"
        side_effects:
          - "markdown_step incremented by 1, state := LISTED, listed_at := current logical clock"
          - "base_price_cents, list_price_cents, channel_fee_cents, net_recovery_cents, floor_adjusted recomputed by calculation resale_pricing at the new markdown_step"
        note: "Closes the listing markdown cycle LISTED -> EXPIRED -> LISTED, bounded by MAX_MARKDOWN_STEPS."
      - from: EXPIRED
        to: WITHDRAWN
        trigger: "POST /resale-listings/{listing_id}/reprice when the markdown ladder is exhausted"
        actor: InventoryPlanner
        preconditions:
          - "listing.state == EXPIRED"
          - "listing.markdown_step == MAX_MARKDOWN_STEPS"
        side_effects:
          - "state := WITHDRAWN"
          - "the unit stays RETIRED with net_recovery_cents contributing 0 to REALIZED unit economics"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version only)
# =============================================================================
concurrency_rules:
  - rule_id: swap-supersede-stale-member
    parent_entity: Member
    write_endpoint: "POST /reservations/{reservation_id}/swap"
    occ_field: "expected_member_version"
    description: |
      A swap legitimately supersedes the member's current reservation and releases
      its unit before allocating a replacement, so the product semantics allow a
      second swap request against the same member to succeed on its own terms. To
      keep the supersede chain well defined the request must carry the Member
      version the client last observed; a request whose expected_member_version no
      longer equals Member.version is rejected as stale.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412
  - rule_id: resale-listing-stale-unit
    parent_entity: RentalUnit
    write_endpoint: "POST /resale-listings"
    occ_field: "expected_rental_unit_version"
    description: |
      Creating a ResaleListing that supersedes an EXPIRED listing on the same
      retired unit is a legitimate operation the product allows more than once,
      so it is guarded by the unit version rather than by a state precondition.
      A create whose expected_rental_unit_version no longer equals
      RentalUnit.version is rejected as stale.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: availability_match_selector
    trigger: "POST /reservations and POST /reservations/{reservation_id}/swap (allocation step), and every waitlist promotion cascade"
    algorithm: selector_policy
    formula: |
      # (a) ELIGIBILITY FILTER — candidate set over RentalUnit
      candidates = [ u for u in RentalUnit
                     if u.style_id == request.style_id
                     and u.size == request.requested_size
                     and u.availability_state == IN_STOCK
                     and u.condition_state == FLOOR_READY
                     and u.quarantine_hold == false
                     and u.turns_completed < style.expected_rental_turns_per_unit
                     and not interval_collision(u, request) ]

      # interval geometry: half-open [start, end) extended on the right by the
      # recondition buffer. occupied(u) = union over reservations r with
      # r.allocated_unit_id == u.id and r.state NOT IN
      # {RELEASED, CANCELLED, SUPERSEDED} — a CLOSED turn still occupies its
      # window plus the buffer, which is what makes the buffer observable on a
      # unit that is already back IN_STOCK — of
      #   [ r.requested_start_date , r.requested_end_date + RECONDITION_BUFFER_DAYS )
      # interval_collision(u, request) is true iff
      #   request.requested_start_date < r.requested_end_date + RECONDITION_BUFFER_DAYS
      #   AND request.requested_end_date > r.requested_start_date
      # for some such r. Touching at exactly the buffer edge does NOT collide:
      # request.requested_start_date == r.requested_end_date + RECONDITION_BUFFER_DAYS is allowed.

      # (b) RANKING EXPRESSION — burn down the oldest remaining life first
      rank_key(u) = ( -u.turns_completed , u.created_at )
      # primary: turns_completed DESC (highest turns first)
      # (c) TIE-BREAK: created_at ASC. `id` is NEVER consulted.
      selected = min(candidates, key=rank_key)

      # (d) EMPTY-POOL FALLBACK
      # if candidates is empty and request.preferred_unit_id is null:
      #     reservation state := WAITLISTED (no error)
      # if candidates is empty and request.preferred_unit_id is not null:
      #     reject with the most specific failing reason from validation
      #     priorities 32, 33 and 42 (ERR_UNIT_NOT_ALLOCATABLE /
      #     ERR_UNIT_TURNS_EXHAUSTED / ERR_UNIT_WINDOW_COLLISION)
      # if request.preferred_unit_id is not null and that unit IS in candidates:
      #     selected := that unit (the ranking expression is skipped)
    input_set: "RentalUnit rows of the requested style and size with availability_state == IN_STOCK and condition_state == FLOOR_READY; units in any other availability_state or condition_state are excluded even when physically idle"
    constants:
      RECONDITION_BUFFER_DAYS: 2
      MIN_RENTAL_DAYS: 3
      MAX_RENTAL_DAYS: 14
    precision: "integer day arithmetic on UTC calendar dates; no partial days"
    variants: []

  - name: unit_economics
    trigger: "GET /styles/{style_id}/unit-economics"
    algorithm: forward_looking
    formula: |
      # ---------- variant REALIZED (chronological, actuals only) ----------
      units = [ u for u in RentalUnit if u.style_id == style.id ]      # includes RETIRED and SOLD
      for u in units:
          revenue_cents   = u.realized_revenue_cents
                            # = sum of Reservation.revenue_attributed_cents over
                            #   reservations with allocated_unit_id == u.id AND state == CLOSED
          recovery_cents  = sum(c.net_fee_cents for c in DamageClaim
                                if c.rental_unit_id == u.id and c.state == CHARGED)
          eol_cents       = sum(l.net_recovery_cents for l in ResaleListing
                                if l.rental_unit_id == u.id and l.state == SOLD)
          servicing_cents = u.cumulative_servicing_cost_cents
          unit_margin_cents = revenue_cents + recovery_cents + eol_cents
                              - u.acquisition_cost_cents - servicing_cents
          margin_per_turn_cents(u) = round_half_up(unit_margin_cents / max(1, u.turns_completed))
      # PINNED ROUNDING ORDER: round per unit FIRST, then average across units.
      realized_margin_per_turn_cents =
          round_half_up( sum(margin_per_turn_cents(u) for u in units) / len(units) )
      # (Summing all unit margins and dividing once by total turns is a DIFFERENT
      #  number and is explicitly NOT the pinned order.)
      # len(units) == 0 -> realized_margin_per_turn_cents := 0

      # ---------- variant PROJECTED (plan assumptions only) ----------
      turns = style.expected_rental_turns_per_unit
      projected_unit_margin_cents =
          REFERENCE_REVENUE_PER_TURN_CENTS * turns
          + style.planned_eol_value_cents
          - style.acquisition_cost_cents
          - PROJECTED_SERVICING_PER_TURN_CENTS * turns
      projected_margin_per_turn_cents = round_half_up(projected_unit_margin_cents / turns)

      # ---------- response fields of GET /styles/{style_id}/unit-economics ----------
      # variant REALIZED
      #   unit_count                        = len(units)
      #   avg_acquisition_cost_cents        = round_half_up(sum(u.acquisition_cost_cents) / len(units))
      #   avg_revenue_per_unit_cents        = round_half_up(sum(revenue_cents(u) + recovery_cents(u)) / len(units))
      #   avg_servicing_cost_per_unit_cents = round_half_up(sum(servicing_cents(u)) / len(units))
      #   avg_eol_value_cents               = round_half_up(sum(eol_cents(u)) / len(units))
      #   avg_margin_per_unit_cents         = round_half_up(sum(unit_margin_cents(u)) / len(units))
      #   avg_margin_per_turn_cents         = realized_margin_per_turn_cents (the pinned
      #                                       round-per-unit-then-average value above; it is
      #                                       NOT derived from the other avg_* fields)
      #   len(units) == 0 -> unit_count := 0 and every avg_* field := 0
      # variant PROJECTED (one notional unit; no RentalUnit, DamageClaim or ResaleListing row is read)
      #   unit_count                        = 1
      #   avg_acquisition_cost_cents        = style.acquisition_cost_cents
      #   avg_revenue_per_unit_cents        = REFERENCE_REVENUE_PER_TURN_CENTS * turns
      #   avg_servicing_cost_per_unit_cents = PROJECTED_SERVICING_PER_TURN_CENTS * turns
      #   avg_eol_value_cents               = style.planned_eol_value_cents
      #   avg_margin_per_unit_cents         = projected_unit_margin_cents
      #   avg_margin_per_turn_cents         = projected_margin_per_turn_cents
    input_set: "REALIZED reads every RentalUnit of the style in any availability_state, but only CLOSED reservations, CHARGED claims and SOLD listings contribute money. PROJECTED reads only Style plan fields and ignores every RentalUnit row."
    constants:
      REFERENCE_REVENUE_PER_TURN_CENTS: 3200
      PROJECTED_SERVICING_PER_TURN_CENTS: 2000
    precision: "integer cents, round_half_up at each pinned rounding step"
    variants:
      - name: REALIZED
        when: "query parameter variant=REALIZED (default)"
        difference: "Chronological actuals: per-unit acquisition cost, per-unit servicing rollup, CLOSED-reservation revenue, CHARGED claim recovery and SOLD listing recovery; rounded per unit then averaged."
      - name: PROJECTED
        when: "query parameter variant=PROJECTED"
        difference: "Forward-looking plan values: reference revenue per turn times planned turns, planned end-of-life value, Style.acquisition_cost_cents, flat projected servicing; ignores all actual units, claims and listings, so identical data yields a different number."

  - name: member_damage_risk_score
    trigger: "GET /members/{member_id}/damage-risk; the LIFETIME variant is also recomputed and persisted to Member.damage_risk_score on every DamageClaim creation and on every dispute resolution"
    algorithm: weighted_scoring
    formula: |
      # variant-scoped input set S of the member's finished turns
      # LIFETIME     : reservations with state == CLOSED (no date filter)
      # ROLLING_12M  : reservations with state == CLOSED AND
      #                returned_at >= (current_clock - 365 days)   [inclusive lower bound]
      #                AND returned_at < current_clock             [exclusive upper bound]
      turns_in_scope   = count(S)
      claims_in_scope  = [ c for c in DamageClaim
                           if c.reservation_id in S and c.state IN {CHARGED, WAIVED} ]
      late_in_scope    = count(r for r in S if r.late_days > 0)
      claim_rate       = count(claims_in_scope) / max(1, turns_in_scope)
      severity_index   = sum(SEVERITY_WEIGHT[c.severity] for c in claims_in_scope)
                         / max(1, count(claims_in_scope))
      late_rate        = late_in_scope / max(1, turns_in_scope)
      raw              = 100 * ( W_CLAIM_RATE * claim_rate
                                 + W_SEVERITY * min(1.0, severity_index / 4.0)
                                 + W_LATE * late_rate )
      damage_risk_score = round_half_up(raw)            # single rounding, at the end
      # response fields of GET /members/{member_id}/damage-risk
      #   claim_count       = count(claims_in_scope)
      #   severity_points   = sum(SEVERITY_WEIGHT[c.severity] for c in claims_in_scope)
      #   late_return_count = late_in_scope
      damage_risk_band  = LOW      if damage_risk_score <= BAND_LOW_MAX
                          ELEVATED if damage_risk_score <= BAND_ELEVATED_MAX
                          HIGH     otherwise
    input_set: "Only CLOSED reservations enter S; MATCHED, SHIPPED, IN_POSSESSION, RETURN_INITIATED, RETURNED, RELEASED, CANCELLED and SUPERSEDED reservations are excluded. Only CHARGED and WAIVED claims count; OPEN, ASSESSED, DISPUTED and DISMISSED claims do not."
    constants:
      W_CLAIM_RATE: 0.5
      W_SEVERITY: 0.3
      W_LATE: 0.2
      SEVERITY_WEIGHT: { MINOR: 1, MODERATE: 2, SEVERE: 3, LOSS: 4 }
      BAND_LOW_MAX: 20
      BAND_ELEVATED_MAX: 49
    precision: "integer score 0..100, round_half_up once on the final weighted sum"
    variants:
      - name: LIFETIME
        when: "query parameter variant=LIFETIME (default) and every persisted recompute"
        difference: "No date window: every CLOSED reservation of the member enters the denominator and every CHARGED/WAIVED claim enters the numerator."
      - name: ROLLING_12M
        when: "query parameter variant=ROLLING_12M"
        difference: "Half-open window [current_clock - 365 days, current_clock) on returned_at; an old claim drops out of both the numerator and the denominator, so identical data yields a different score and can yield a different band."

  - name: damage_fee_assessment
    trigger: "POST /damage-claims/{claim_id}/assessment, and re-run on POST /damage-claims/{claim_id}/dispute-resolution with resolution PARTIAL"
    algorithm: threshold
    formula: |
      grade            = unit.condition_grade            # already overwritten by the inspection
      residual_value_cents = round_half_up(style.retail_price_cents * RESIDUAL_RATE_BY_GRADE[grade])
      severity_base_cents  = residual_value_cents if claim.severity == LOSS
                             else SEVERITY_BASE_CENTS[claim.severity]
      pct_component_cents  = round_half_up(residual_value_cents * SEVERITY_PCT[claim.severity])
      # three inputs interacting non-linearly: severity floor, percentage of
      # residual value, and the residual-value ceiling
      gross_fee_cents      = min( max(severity_base_cents, pct_component_cents),
                                  residual_value_cents )
      remaining_coverage_cents = max(0, plan.waiver_coverage_cents
                                        - member.waiver_coverage_used_cents)
      waiver_applied_cents = min(gross_fee_cents, remaining_coverage_cents)
                             if member.waiver_active == true else 0
      net_fee_cents        = gross_fee_cents - waiver_applied_cents
      # PARTIAL dispute resolution downgrades severity one step before re-running:
      # SEVERE -> MODERATE, MODERATE -> MINOR, MINOR -> MINOR, LOSS -> SEVERE
    input_set: "The claim's own severity, the unit's post-inspection condition_grade, the style's retail price, and the member's plan coverage minus coverage already consumed by other claims"
    constants:
      RESIDUAL_RATE_BY_GRADE: { A: 0.55, B: 0.40, C: 0.25, D: 0.10 }
      SEVERITY_BASE_CENTS: { MINOR: 2500, MODERATE: 9000, SEVERE: 22000 }
      SEVERITY_PCT: { MINOR: 0.10, MODERATE: 0.35, SEVERE: 0.75, LOSS: 1.00 }
      MAX_DISPUTE_ROUNDS: 2
      DISPUTE_WINDOW_DAYS: 7
    precision: "integer cents, round_half_up on each multiplication before the min/max composition"
    variants: []

  - name: resale_pricing
    trigger: "POST /resale-listings (DRAFT -> LISTED), POST /resale-listings/{listing_id}/reprice, and POST /resale-listings/{listing_id}/sale"
    algorithm: tiered_pricing
    formula: |
      # The dependency LOOKS circular: the channel fee percentage is keyed on a
      # price tier, and the floor correction changes the price. The evaluation
      # order below is PINNED and executed exactly once, top to bottom.
      # Step 1
      base_price_cents = round_half_up( style.retail_price_cents
                                        * RESALE_RATE_BY_GRADE[unit.condition_grade]
                                        * (1 - MARKDOWN_STEP_PCT * listing.markdown_step) )
      # Step 2 — tier is derived from the Step 1 price and is FROZEN here
      channel_tier = LOW  if base_price_cents < TIER_MID_FLOOR_CENTS
                     else MID if base_price_cents < TIER_HIGH_FLOOR_CENTS
                     else HIGH
      # Step 3
      fee_pct = CHANNEL_FEE_PCT[listing.channel][channel_tier]
      # Step 4
      channel_fee_cents = round_half_up(base_price_cents * fee_pct)
      # Step 5
      provisional_net_cents = base_price_cents - channel_fee_cents
                              - CHANNEL_HANDLING_CENTS[listing.channel]
      # Step 6 — at most ONE corrective pass, reusing the Step 2 tier and Step 3
      # fee_pct; the tier is NOT re-derived from the corrected price
      if provisional_net_cents < MIN_NET_RECOVERY_CENTS:
          list_price_cents = round_half_up(
              (MIN_NET_RECOVERY_CENTS + CHANNEL_HANDLING_CENTS[listing.channel])
              / (1 - fee_pct) )
          floor_adjusted = true
      else:
          list_price_cents = base_price_cents
          floor_adjusted = false
      # Step 7 — fee and net are restated on the final price with the frozen fee_pct
      channel_fee_cents = round_half_up(list_price_cents * fee_pct)
      net_recovery_cents = list_price_cents - channel_fee_cents
                           - CHANNEL_HANDLING_CENTS[listing.channel]
      # On sale, Steps 4..7 are re-run with list_price_cents := sale_price_cents and
      # the fee_pct frozen at listing time; base_price_cents is left untouched.
    input_set: "The listing's own channel and markdown_step, the unit's current condition_grade, and the parent style's retail price. Prior listings on the same unit contribute nothing except through supersedes_listing_id lineage."
    constants:
      RESALE_RATE_BY_GRADE: { A: 0.45, B: 0.32, C: 0.20, D: 0.08 }
      MARKDOWN_STEP_PCT: 0.15
      MAX_MARKDOWN_STEPS: 3
      TIER_MID_FLOOR_CENTS: 5000
      TIER_HIGH_FLOOR_CENTS: 20000
      CHANNEL_FEE_PCT: { OUTLET: { LOW: 0.05, MID: 0.08, HIGH: 0.12 }, PARTNER_RESALE: { LOW: 0.15, MID: 0.18, HIGH: 0.22 } }
      CHANNEL_HANDLING_CENTS: { OUTLET: 400, PARTNER_RESALE: 900 }
      MIN_NET_RECOVERY_CENTS: 2000
      MAX_SALE_DISCOUNT_PCT: 0.10
      LISTING_WINDOW_DAYS: 30
    precision: "integer cents, round_half_up at Step 1, Step 4, Step 6 and Step 7"
    variants: []

  - name: turn_revenue_attribution
    trigger: "Reservation RETURNED -> CLOSED and Reservation RETURN_INITIATED -> CLOSED"
    algorithm: aggregation
    formula: |
      plan = MembershipPlan with id == member.membership_plan_id
      base_per_turn_cents = round_half_up(plan.monthly_fee_cents / plan.item_slots)
      revenue_attributed_cents = round_half_up(base_per_turn_cents / 2) if reservation.is_swap
                                 else base_per_turn_cents
    input_set: "Exactly one reservation; the plan snapshot is read at CLOSED time from the member's current membership_plan_id"
    constants: {}
    precision: "integer cents, round_half_up; the halving of a swap turn rounds up (3333 -> 1667)"
    variants: []

  - name: servicing_cost_rollup
    trigger: "every inspection, repair-completion, cleaning-completion, photography and restock transition on a ReverseLogisticsJob"
    algorithm: aggregation
    formula: |
      newest = the Inspection on this job with the greatest attempt_index
      cleaning_cents = CLEANING_COST_CENTS[newest.soil_level] if job.cleaning_required else 0
      repair_cents   = REPAIR_COST_CENTS[newest.damage_severity] * max(0, job.repair_attempts)
      photo_cents    = PHOTOGRAPHY_COST_CENTS if job.photographed_at IS NOT NULL else 0
      servicing_cost_cents = cleaning_cents + repair_cents + photo_cents
      # RentalUnit.cumulative_servicing_cost_cents = sum of servicing_cost_cents over
      # jobs on that unit whose state == RESTOCKED (jobs in CONDEMNED_HOLD contribute 0)
    input_set: "The newest Inspection on the job plus the job's own attempt counter and photography timestamp; jobs that never reach RESTOCKED are excluded from the unit rollup"
    constants:
      CLEANING_COST_CENTS: { NONE: 0, LIGHT: 1200, HEAVY: 2600 }
      REPAIR_COST_CENTS: { NONE: 0, MINOR: 1500, MODERATE: 4200, SEVERE: 9800, LOSS: 0 }
      PHOTOGRAPHY_COST_CENTS: 800
      REPAIR_ATTEMPT_CAP: 2
    precision: "integer cents, no rounding required"
    variants: []

  - name: late_return_fee
    trigger: "Reservation RETURN_INITIATED -> RETURNED (cascade hop 2 of POST /shipments/{shipment_id}/receipt)"
    algorithm: threshold
    formula: |
      due_date  = reservation.requested_end_date + RETURN_GRACE_DAYS      # calendar days, UTC
      recv_date = date(shipment.received_at)
      late_days = max(0, recv_date - due_date)                            # whole days, > 0 only strictly after due_date
      late_fee_cents = min(LATE_FEE_CAP_CENTS, late_days * LATE_FEE_PER_DAY_CENTS)
      # a receipt exactly on due_date yields late_days == 0 and no ledger entry
    input_set: "The reservation's requested_end_date and the INBOUND shipment's received_at instant; the delivered_at instant is irrelevant"
    constants:
      RETURN_GRACE_DAYS: 2
      LATE_FEE_PER_DAY_CENTS: 500
      LATE_FEE_CAP_CENTS: 5000
    precision: "integer cents; integer day arithmetic on UTC calendar dates"
    variants: []

  - name: swap_allowance_window
    trigger: "POST /reservations/{reservation_id}/swap (validation priority 51) and every read of Member.swaps_used_current_month"
    algorithm: threshold
    formula: |
      month_start = first instant of the UTC calendar month containing the current clock
      next_month_start = first instant of the following UTC calendar month
      swaps_used_current_month = count(r for r in Reservation
                                       if r.member_id == member.id
                                       and r.is_swap == true
                                       and month_start <= r.created_at < next_month_start)
      # window is half-open [month_start, next_month_start)
      allowed = swaps_used_current_month < plan.monthly_swaps_allowed
      # equality REJECTS: a member on monthly_swaps_allowed == 2 who already has 2
      # swap reservations this month is refused; at 1 the swap succeeds
    input_set: "Reservation rows with is_swap == true created inside the current UTC calendar month, in ANY state including SUPERSEDED, RELEASED and CANCELLED — a swap consumes the allowance even if its reservation is later released"
    constants: {}
    precision: "integer counts; month boundaries are UTC calendar month boundaries"
    variants: []

  - name: style_depth_requirement
    trigger: "POST /styles, PATCH /styles/{style_id}/depth-plan, and every cascade hop that changes a unit's availability_state"
    algorithm: threshold
    formula: |
      committed_days = style.forecast_monthly_requests
                       * (style.avg_rental_days + RECONDITION_BUFFER_DAYS)
      required_depth_units = ceil(committed_days / DAYS_PER_PLANNING_MONTH)
      active_unit_count    = count(u for u in RentalUnit
                                   if u.style_id == style.id
                                   and u.availability_state NOT IN {RETIRED, SOLD})
      depth_gap_units      = max(0, required_depth_units - active_unit_count)
      replenishment_flag   = depth_gap_units >= REPLENISH_TRIGGER_UNITS
      # ceil boundary: committed_days == 60 with DAYS_PER_PLANNING_MONTH == 30 gives
      # exactly 2; committed_days == 61 gives 3
    input_set: "Style plan fields plus RentalUnit rows of the style in any availability_state except RETIRED and SOLD; condition_state is irrelevant here"
    constants:
      DAYS_PER_PLANNING_MONTH: 30
      RECONDITION_BUFFER_DAYS: 2
      REPLENISH_TRIGGER_UNITS: 1
    precision: "integer units; ceil, never round_half_up"
    variants: []

  - name: member_fit_confidence
    trigger: "POST /reservations/{reservation_id}/fit-feedback"
    algorithm: weighted_scoring
    formula: |
      rows = FitFeedback with member_id == member.id, ordered created_at ASC
      mismatch_penalty = sum(abs(FIT_DELTA[f.fit_rating]) for f in rows)
      occasion_bonus   = sum(f.occasion_match_score - 3 for f in rows)
      keep_bonus       = KEEP_INTENT_BONUS * count(f for f in rows if f.keep_intent == true)
      raw              = FIT_BASELINE + 6 * occasion_bonus + keep_bonus
                         - 8 * mismatch_penalty
      fit_confidence_score = min(100, max(0, raw))     # clamped at both ends

      # ---------- response fields of GET /members/{member_id}/personalization-summary ----------
      #   feedback_count      = count(rows)
      #   keep_intent_count   = count(f for f in rows if f.keep_intent == true)
      #   dominant_fit_rating = the fit_rating value with the greatest count over rows;
      #                         tie-break: among tied ratings, the one whose earliest row has
      #                         the smallest created_at (created_at ASC); null when rows is empty
      #   preferred_categories, size_profile = echoed from the Member row unchanged
    input_set: "Every FitFeedback row of the member regardless of style or reservation age"
    constants:
      FIT_DELTA: { TOO_SMALL: -2, SLIGHTLY_SMALL: -1, TRUE_TO_SIZE: 0, SLIGHTLY_LARGE: 1, TOO_LARGE: 2 }
      FIT_BASELINE: 50
      KEEP_INTENT_BONUS: 5
    precision: "integer score, clamped to 0..100"
    variants: []

  - name: style_demand_score
    trigger: "POST /reservations, POST /reservations/{reservation_id}/swap and POST /reservations/{reservation_id}/fit-feedback"
    algorithm: aggregation
    formula: |
      requests = count(r for r in Reservation
                       if r.style_id == style.id and r.state != SUPERSEDED)
      rows     = FitFeedback with style_id == style.id
      raw      = 4 * requests
                 + 3 * count(f for f in rows if f.keep_intent == true)
                 + sum(f.occasion_match_score for f in rows)
      demand_score = min(100, raw)
    input_set: "All reservations on the style except SUPERSEDED ones, plus all FitFeedback rows on the style"
    constants: {}
    precision: "integer score, capped at 100"
    variants: []

  - name: member_fee_balance_invariant
    trigger: "audited after every FeeLedgerEntry append (DAMAGE_FEE, LATE_FEE, WAIVER_CREDIT, SETTLEMENT_PAYMENT, DISPUTE_REVERSAL)"
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY: member_fee_balance
      Member.outstanding_fee_cents ==
          sum(e.amount_cents for e in FeeLedgerEntry if e.member_id == member.id)
      # Compensating-action invariant: for a claim charged then OVERTURNED,
      #   sum over that claim's entries == 0
      # so Member.outstanding_fee_cents returns to its exact pre-charge value and
      # Member.waiver_coverage_used_cents returns to its exact pre-assessment value.
      # FeeLedgerEntry.balance_after_cents equals the running sum over entries of
      # the same member ordered by created_at ASC.
    input_set: "Every FeeLedgerEntry of the member, in created_at ASC order; no entry is ever mutated or deleted"
    constants:
      DELINQUENCY_THRESHOLD_CENTS: 15000
    precision: "exact integer cents; no rounding anywhere in the ledger"
    variants: []

  - name: unit_position_conservation_invariant
    trigger: "audited after every RentalUnit availability_state transition"
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY: unit_position_count for a (style_id, size) pair
      unit_position_count(style, size) ==
          count(IN_STOCK) + count(RESERVED) + count(OUT) + count(INBOUND)
          + count(PROCESSING) + count(RETIRED) + count(SOLD)
      # over RentalUnit rows with that style_id and size. Every allocation and its
      # compensating release, every swap (release-then-allocate), and every
      # delinquency cascade must leave unit_position_count unchanged AND must leave
      # count(IN_STOCK) + count(RESERVED) unchanged when no shipment moved.
      # Style.floor_ready_unit_count must equal
      #   count(u for u in RentalUnit if u.style_id == style.id
      #         and u.availability_state == IN_STOCK and u.condition_state == FLOOR_READY)
      # after every cascade hop completes.
      # The shipment-loss path also conserves positions: at
      # exception_count == SHIPMENT_EXCEPTION_CAP the unit leaves OUT or INBOUND and
      # enters RETIRED, so unit_position_count is unchanged.
    input_set: "All RentalUnit rows of the (style_id, size) pair, including RETIRED and SOLD"
    constants:
      SHIPMENT_EXCEPTION_CAP: 2
    precision: "exact integer counts"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (evaluated in ascending priority order; the first
#     failing rule decides the response and no side effect is applied)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the roles declared in the RBAC matrix"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "for an entity_backed role, X-User-ID is the id of an existing instance of that role's entity (Member for Member, Technician for WarehouseTech)"
    error_id: ERR_ACTOR_NOT_FOUND
    http_status: 401
    applies_to: "all endpoints whose roles include Member or WarehouseTech"
  - priority: 4
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 5
    category: auth
    check: "a Member may only read or mutate resources whose member_id equals X-User-ID (members, reservations, shipments of own reservations, damage claims, fit feedback, fee ledger entries)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all Member-role endpoints"
  - priority: 6
    category: existence
    check: "every path id resolves, validated left to right: plan, member, style, rental unit, reservation, shipment, job, inspection, claim, listing, fee entry"
    error_id: "ERR_PLAN_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_STYLE_NOT_FOUND | ERR_RENTAL_UNIT_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_JOB_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_LISTING_NOT_FOUND | ERR_FEE_ENTRY_NOT_FOUND | ERR_TECHNICIAN_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 7
    category: existence
    check: "every foreign key supplied in the request body resolves (membership_plan_id, style_id, reservation_id, rental_unit_id, preferred_unit_id, supersedes_listing_id)"
    error_id: "ERR_PLAN_NOT_FOUND | ERR_STYLE_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_RENTAL_UNIT_NOT_FOUND | ERR_LISTING_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints with FK body fields"
  - priority: 8
    category: business_constraint
    check: "all required body fields are present and of the declared JSON type"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 9
    category: business_constraint
    check: "every enum-typed body field carries a declared member value"
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 422
    applies_to: "all write endpoints with enum fields, plus list endpoints with enum filters"
  - priority: 10
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"
  - priority: 11
    category: business_referential
    check: "unique codes are free: MembershipPlan.code, Technician.employee_code, Style.style_code, RentalUnit.unit_code, Member.email"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /membership-plans, POST /technicians, POST /styles, POST /styles/{style_id}/rental-units, POST /members"
  - priority: 12
    category: state
    check: "expected_member_version equals Member.version"
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412
    applies_to: "POST /reservations/{reservation_id}/swap"
  - priority: 13
    category: state
    check: "expected_rental_unit_version equals RentalUnit.version"
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412
    applies_to: "POST /resale-listings"
  - priority: 14
    category: state
    check: "member.status == ACTIVE"
    error_id: ERR_MEMBER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /reservations, POST /reservations/{reservation_id}/swap, POST /reservations/{reservation_id}/return-initiation, POST /shipments, POST /shipments/{shipment_id}/dispatch on OUTBOUND legs"
  - priority: 15
    category: state
    check: "the target resource is in a state from which the requested transition is declared in the §1.2 table for its entity; a resource already sitting in one of its declared terminal_states is NOT judged by this rule — that case is reserved for priority 16, so this rule is evaluated only when the current state is non-terminal"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 16
    category: state
    check: "the target resource is not already in one of its terminal states"
    error_id: ERR_RESOURCE_TERMINAL
    http_status: 409
    applies_to: "all action endpoints on Reservation, Shipment, ReverseLogisticsJob, DamageClaim, ResaleListing and Member"
  - priority: 20
    category: business_safety
    check: "unit.quarantine_hold == false"
    error_id: ERR_QUARANTINE_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /reverse-logistics-jobs/{job_id}/cleaning-completion, POST /reverse-logistics-jobs/{job_id}/repair-completion, POST /reverse-logistics-jobs/{job_id}/photography, POST /reverse-logistics-jobs/{job_id}/restock"
  - priority: 21
    category: business_safety
    check: "unit.condition_state != CONDEMNED"
    error_id: ERR_UNIT_CONDEMNED
    http_status: 409
    applies_to: "POST /reverse-logistics-jobs/{job_id}/restock, POST /reverse-logistics-jobs/{job_id}/photography, allocation of a preferred_unit_id on POST /reservations and POST /reservations/{reservation_id}/swap"
  - priority: 22
    category: business_safety
    check: "no DamageClaim on (job.rental_unit_id, job.reservation_id) has state IN {OPEN, ASSESSED, DISPUTED}"
    error_id: ERR_OPEN_CLAIM_BLOCKS_RESTOCK
    http_status: 409
    applies_to: "POST /reverse-logistics-jobs/{job_id}/restock"
  - priority: 23
    category: business_safety
    check: "when job.cleaning_required == true AND job.repair_required == true, job.repair_completed_at IS NOT NULL before cleaning is signed off"
    error_id: ERR_REPAIR_PENDING
    http_status: 409
    applies_to: "POST /reverse-logistics-jobs/{job_id}/cleaning-completion"
  - priority: 25
    category: business_constraint
    check: "X-User-ID != job.inspecting_technician_id — the technician who filed the inspection may not sign off the repair on the same job"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /reverse-logistics-jobs/{job_id}/repair-completion"
  - priority: 26
    category: business_constraint
    check: "technician.repair_certified == true for repair-completion and quarantine-clearance; technician.photography_certified == true for photography"
    error_id: ERR_TECHNICIAN_NOT_CERTIFIED
    http_status: 403
    applies_to: "POST /reverse-logistics-jobs/{job_id}/repair-completion, POST /reverse-logistics-jobs/{job_id}/quarantine-clearance, POST /reverse-logistics-jobs/{job_id}/photography"
  - priority: 27
    category: business_constraint
    check: "technician.status == ACTIVE"
    error_id: ERR_TECHNICIAN_SUSPENDED
    http_status: 403
    applies_to: "all WarehouseTech endpoints"
  - priority: 28
    category: business_constraint
    check: "job.repair_attempts < REPAIR_ATTEMPT_CAP"
    error_id: ERR_REPAIR_ATTEMPTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /reverse-logistics-jobs/{job_id}/repair-completion"
  - priority: 29
    category: business_constraint
    check: "claim.dispute_round < MAX_DISPUTE_ROUNDS"
    error_id: ERR_DISPUTE_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /damage-claims/{claim_id}/disputes"
  - priority: 30
    category: business_temporal
    check: "when claim.state == CHARGED, current clock date <= date(claim.charged_at) + DISPUTE_WINDOW_DAYS"
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /damage-claims/{claim_id}/disputes"
  - priority: 31
    category: business_constraint
    check: "requested_size is a member of Style.size_run"
    error_id: ERR_SIZE_NOT_IN_SIZE_RUN
    http_status: 422
    applies_to: "POST /reservations, POST /reservations/{reservation_id}/swap"
  - priority: 32
    category: business_constraint
    check: "a named preferred_unit_id belongs to the requested style, has size == requested_size, availability_state == IN_STOCK, condition_state == FLOOR_READY and quarantine_hold == false"
    error_id: ERR_UNIT_NOT_ALLOCATABLE
    http_status: 409
    applies_to: "POST /reservations, POST /reservations/{reservation_id}/swap"
  - priority: 33
    category: business_constraint
    check: "a named preferred_unit_id has turns_completed < style.expected_rental_turns_per_unit"
    error_id: ERR_UNIT_TURNS_EXHAUSTED
    http_status: 409
    applies_to: "POST /reservations, POST /reservations/{reservation_id}/swap"
  - priority: 34
    category: business_referential
    check: "supersedes_listing_id, when supplied, references a ResaleListing with the same rental_unit_id and state == EXPIRED"
    error_id: ERR_INVALID_SUPERSEDE_TARGET
    http_status: 422
    applies_to: "POST /resale-listings"
  - priority: 35
    category: business_referential
    check: "no other ResaleListing on the unit has state IN {DRAFT, LISTED}"
    error_id: ERR_LISTING_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /resale-listings"
  - priority: 36
    category: business_referential
    check: "reservation.state IN {RETURNED, CLOSED}"
    error_id: ERR_FEEDBACK_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /reservations/{reservation_id}/fit-feedback"
  - priority: 37
    category: business_referential
    check: "no FitFeedback row already exists for this reservation"
    error_id: ERR_FEEDBACK_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /reservations/{reservation_id}/fit-feedback"
  - priority: 38
    category: business_constraint
    check: "shipment.exception_count < SHIPMENT_EXCEPTION_CAP"
    error_id: ERR_SHIPMENT_EXCEPTION_CAP_REACHED
    http_status: 409
    applies_to: "POST /shipments/{shipment_id}/exception, POST /shipments/{shipment_id}/dispatch from EXCEPTION"
  - priority: 39
    category: business_referential
    check: "no Shipment with direction == INBOUND already exists for the reservation; and for POST /shipments with direction OUTBOUND, no non-EXCEPTION OUTBOUND shipment already exists for the reservation"
    error_id: ERR_SHIPMENT_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /shipments, POST /reservations/{reservation_id}/return-initiation"
  - priority: 40
    category: business_temporal
    check: "requested_end_date > requested_start_date and MIN_RENTAL_DAYS <= (requested_end_date - requested_start_date) <= MAX_RENTAL_DAYS"
    error_id: ERR_INVALID_RENTAL_WINDOW
    http_status: 422
    applies_to: "POST /reservations, POST /reservations/{reservation_id}/swap"
  - priority: 41
    category: business_temporal
    check: "requested_start_date >= date(current logical clock)"
    error_id: ERR_WINDOW_IN_PAST
    http_status: 422
    applies_to: "POST /reservations, POST /reservations/{reservation_id}/swap"
  - priority: 42
    category: business_temporal
    check: "a named preferred_unit_id has no interval collision: for every reservation r holding that unit with state NOT IN {RELEASED, CANCELLED, SUPERSEDED}, NOT (requested_start_date < r.requested_end_date + RECONDITION_BUFFER_DAYS AND requested_end_date > r.requested_start_date)"
    error_id: ERR_UNIT_WINDOW_COLLISION
    http_status: 409
    applies_to: "POST /reservations, POST /reservations/{reservation_id}/swap"
  - priority: 43
    category: business_temporal
    check: "for an OUTBOUND leg, no other Shipment of the same member with direction == OUTBOUND and state NOT IN {EXCEPTION} has planned_ship_date inside the CLOSED window [other.planned_ship_date, other.planned_ship_date + plan.shipping_cadence_days]"
    error_id: ERR_SHIPPING_CADENCE_COLLISION
    http_status: 409
    applies_to: "POST /shipments"
  - priority: 44
    category: business_temporal
    check: "current clock date >= date(listing.listed_at) + LISTING_WINDOW_DAYS"
    error_id: ERR_LISTING_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /resale-listings/{listing_id}/expiration"
  - priority: 45
    category: business_referential
    check: "no Reservation with allocated_unit_id == unit.id has state IN {MATCHED, SHIPPED, IN_POSSESSION, RETURN_INITIATED} and no DamageClaim on the unit has state IN {OPEN, ASSESSED, DISPUTED}"
    error_id: ERR_UNIT_HAS_ACTIVE_COMMITMENT
    http_status: 409
    applies_to: "POST /rental-units/{unit_id}/retirement"
  - priority: 46
    category: business_referential
    check: "unit.availability_state == RETIRED"
    error_id: ERR_UNIT_NOT_RETIRED
    http_status: 409
    applies_to: "POST /resale-listings"
  - priority: 50
    category: business_fiscal
    check: "member.units_out_count + count(WAITLISTED reservations of the member) < plan.item_slots"
    error_id: ERR_ITEM_SLOTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /reservations"
  - priority: 51
    category: business_fiscal
    check: "member.swaps_used_current_month < plan.monthly_swaps_allowed"
    error_id: ERR_SWAP_ALLOWANCE_EXHAUSTED
    http_status: 409
    applies_to: "POST /reservations/{reservation_id}/swap"
  - priority: 52
    category: business_fiscal
    check: "member.waiver_active == true and plan.waiver_coverage_cents - member.waiver_coverage_used_cents + claim.waiver_applied_cents >= claim.gross_fee_cents"
    error_id: ERR_WAIVER_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /damage-claims/{claim_id}/waiver"
  - priority: 53
    category: business_fiscal
    check: "claim.net_fee_cents > 0"
    error_id: ERR_NOTHING_TO_CHARGE
    http_status: 409
    applies_to: "POST /damage-claims/{claim_id}/charge, POST /damage-claims/{claim_id}/dispute-resolution with resolution UPHELD"
  - priority: 54
    category: business_fiscal
    check: "0 < amount_cents <= member.outstanding_fee_cents"
    error_id: ERR_SETTLEMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /members/{member_id}/fee-settlements"
  - priority: 55
    category: business_fiscal
    check: "sale_price_cents >= round_half_up(listing.list_price_cents * (1 - MAX_SALE_DISCOUNT_PCT))"
    error_id: ERR_SALE_PRICE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /resale-listings/{listing_id}/sale"
  - priority: 56
    category: business_fiscal
    check: "member.outstanding_fee_cents == 0"
    error_id: ERR_OUTSTANDING_BALANCE
    http_status: 409
    applies_to: "POST /members/{member_id}/cancellation"
  - priority: 57
    category: business_fiscal
    check: "member.units_out_count == 0"
    error_id: ERR_UNITS_STILL_OUT
    http_status: 409
    applies_to: "POST /members/{member_id}/pause"

# =============================================================================
# 1.5 API Endpoint Table
#     api_prefix is "/" — every path below is absolute and flat.
# =============================================================================
endpoints:

  # --- catalog & staffing -----------------------------------------------------
  - method: POST
    path: "/membership-plans"
    description: "Create a membership plan tier"
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, item_slots, monthly_fee_cents, monthly_swaps_allowed, shipping_cadence_days, waiver_monthly_fee_cents, waiver_coverage_cents]
    output: MembershipPlan
    side_effects: []
  - method: GET
    path: "/membership-plans/{plan_id}"
    description: "Read one membership plan"
    roles: [Member, WarehouseTech, ClaimsAdjuster, InventoryPlanner, PlatformAdmin]
    code: 200
    input: []
    output: MembershipPlan
    side_effects: []
  - method: GET
    path: "/membership-plans"
    description: "List membership plans"
    roles: [Member, WarehouseTech, ClaimsAdjuster, InventoryPlanner, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: MembershipPlan[]
    side_effects: []
  - method: POST
    path: "/technicians"
    description: "Register a warehouse technician and their certifications"
    roles: [PlatformAdmin]
    code: 201
    input: [employee_code, full_name, "repair_certified?", "photography_certified?", "status?"]
    output: Technician
    side_effects: []
  - method: PATCH
    path: "/technicians/{technician_id}"
    description: "Update a technician's certifications or employment status"
    roles: [PlatformAdmin]
    code: 200
    input: ["repair_certified?", "photography_certified?", "status?"]
    output: Technician
    side_effects: []
  - method: GET
    path: "/technicians/{technician_id}"
    description: "Read one technician"
    roles: [WarehouseTech, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: []
    output: Technician
    side_effects: []
  - method: GET
    path: "/technicians"
    description: "List technicians"
    roles: [WarehouseTech, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Technician[]
    side_effects: []

  # --- styles & depth planning ------------------------------------------------
  - method: POST
    path: "/styles"
    description: "Acquire a style into the rental catalog with its depth plan inputs"
    roles: [InventoryPlanner]
    code: 201
    input: [style_code, brand, category, retail_price_cents, acquisition_cost_cents, size_run, expected_rental_turns_per_unit, planned_eol_value_cents, forecast_monthly_requests, avg_rental_days, "planned_depth_units?"]
    output: Style
    side_effects: ["calculation style_depth_requirement sets required_depth_units, depth_gap_units and replenishment_flag", "calculation style_demand_score sets demand_score"]
  - method: PATCH
    path: "/styles/{style_id}/depth-plan"
    description: "Revise a style's demand forecast and depth plan"
    roles: [InventoryPlanner]
    code: 200
    input: ["forecast_monthly_requests?", "avg_rental_days?", "planned_depth_units?"]
    output: Style
    side_effects: ["recomputes required_depth_units, depth_gap_units, replenishment_flag via style_depth_requirement", "recomputes demand_score via style_demand_score"]
  - method: GET
    path: "/styles/{style_id}"
    description: "Read one style with its computed depth and demand fields"
    roles: [Member, WarehouseTech, ClaimsAdjuster, InventoryPlanner, PlatformAdmin]
    code: 200
    input: []
    output: Style
    side_effects: []
  - method: GET
    path: "/styles"
    description: "List styles, optionally filtered by category or replenishment flag"
    roles: [Member, WarehouseTech, ClaimsAdjuster, InventoryPlanner, PlatformAdmin]
    code: 200
    input: ["category?", "replenishment_flag?", "limit?", "offset?"]
    output: Style[]
    side_effects: []
  - method: GET
    path: "/styles/{style_id}/unit-economics"
    description: "Computed read: per-garment unit economics for the style, variant REALIZED (default) or PROJECTED"
    roles: [InventoryPlanner, PlatformAdmin]
    code: 200
    input: ["variant?"]
    output: { style_id: string, variant: string, unit_count: integer, avg_acquisition_cost_cents: integer, avg_revenue_per_unit_cents: integer, avg_servicing_cost_per_unit_cents: integer, avg_eol_value_cents: integer, avg_margin_per_unit_cents: integer, avg_margin_per_turn_cents: integer }
    side_effects: []
  - method: POST
    path: "/styles/{style_id}/rental-units"
    description: "Add a physical rental unit to a style's depth"
    roles: [InventoryPlanner]
    code: 201
    input: [unit_code, size, "acquisition_cost_cents?", "condition_grade?"]
    output: RentalUnit
    side_effects: ["unit starts IN_STOCK / FLOOR_READY", "style.active_unit_count and style.floor_ready_unit_count recomputed", "style depth_gap_units and replenishment_flag recomputed"]

  # --- rental units -----------------------------------------------------------
  - method: GET
    path: "/rental-units/{unit_id}"
    description: "Read one rental unit including both state dimensions"
    roles: [Member, WarehouseTech, ClaimsAdjuster, InventoryPlanner, PlatformAdmin]
    code: 200
    input: []
    output: RentalUnit
    side_effects: []
  - method: GET
    path: "/rental-units"
    description: "List rental units, optionally filtered by style, size or either state dimension"
    roles: [Member, WarehouseTech, ClaimsAdjuster, InventoryPlanner, PlatformAdmin]
    code: 200
    input: ["style_id?", "size?", "availability_state?", "condition_state?", "limit?", "offset?"]
    output: RentalUnit[]
    side_effects: []
  - method: POST
    path: "/rental-units/{unit_id}/retirement"
    description: "Retire a unit from the rental fleet"
    roles: [InventoryPlanner]
    code: 200
    input: [retirement_reason]
    output: RentalUnit
    side_effects: ["availability_state -> RETIRED, retired_at stamped", "when the unit's job is in CONDEMNED_HOLD its reservation transitions RETURNED -> CLOSED", "style.active_unit_count, floor_ready_unit_count, depth_gap_units and replenishment_flag recomputed", "waitlist promotion re-evaluated for the style"]

  # --- members ----------------------------------------------------------------
  - method: POST
    path: "/members"
    description: "Enroll a member on a plan"
    roles: [PlatformAdmin]
    code: 201
    input: [membership_plan_id, email, full_name, "waiver_active?", "preferred_categories?", "size_profile?"]
    output: Member
    side_effects: ["status ACTIVE", "fit_confidence_score seeded to FIT_BASELINE", "damage_risk_score 0 and damage_risk_band LOW"]
  - method: GET
    path: "/members/{member_id}"
    description: "Read one member with computed balance, slot and risk fields"
    roles: [Member, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: GET
    path: "/members"
    description: "List members, optionally filtered by plan, status or risk band"
    roles: [ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: ["membership_plan_id?", "status?", "damage_risk_band?", "limit?", "offset?"]
    output: Member[]
    side_effects: []
  - method: PATCH
    path: "/members/{member_id}/style-preferences"
    description: "Update a member's styling preferences and size profile"
    roles: [Member]
    code: 200
    input: ["preferred_categories?", "size_profile?"]
    output: Member
    side_effects: []
  - method: POST
    path: "/members/{member_id}/pause"
    description: "Pause a membership"
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["status ACTIVE -> PAUSED"]
  - method: POST
    path: "/members/{member_id}/resume"
    description: "Resume a paused membership"
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["status PAUSED -> ACTIVE", "swaps_used_current_month unchanged"]
  - method: POST
    path: "/members/{member_id}/fee-settlements"
    description: "Settle part or all of a member's outstanding fee balance"
    roles: [Member, PlatformAdmin]
    code: 201
    input: [amount_cents, "memo?"]
    output: FeeLedgerEntry
    side_effects: ["appends a SETTLEMENT_PAYMENT CREDIT entry", "member.outstanding_fee_cents reduced per member_fee_balance_invariant", "when the balance falls below DELINQUENCY_THRESHOLD_CENTS a DELINQUENT member returns to ACTIVE"]
  - method: POST
    path: "/members/{member_id}/cancellation"
    description: "Cancel a membership"
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["status -> CANCELLED", "every MATCHED reservation is RELEASED and every WAITLISTED reservation is CANCELLED", "every unit held in RESERVED returns to IN_STOCK", "waitlist promotion re-evaluated for each affected style"]
  - method: GET
    path: "/members/{member_id}/damage-risk"
    description: "Computed read: member damage risk, variant LIFETIME (default) or ROLLING_12M"
    roles: [Member, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: ["variant?"]
    output: { member_id: string, variant: string, claim_count: integer, severity_points: integer, late_return_count: integer, damage_risk_score: integer, damage_risk_band: string }
    side_effects: []
  - method: GET
    path: "/members/{member_id}/personalization-summary"
    description: "Computed read: styling and fit personalization state derived from the member's fit feedback"
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: { member_id: string, feedback_count: integer, fit_confidence_score: integer, preferred_categories: array, size_profile: string, dominant_fit_rating: string, keep_intent_count: integer }
    side_effects: []

  # --- reservations & availability engine --------------------------------------
  - method: POST
    path: "/reservations"
    description: "Member requests a style for a rental window; the server matches a physically available unit or waitlists the request"
    roles: [Member]
    code: 201
    input: [style_id, requested_size, requested_start_date, requested_end_date, "preferred_unit_id?"]
    output: Reservation
    side_effects: ["calculation availability_match_selector picks a unit or returns the empty-pool fallback", "on a match: state MATCHED, allocated_unit_id set, unit IN_STOCK -> RESERVED, unit.occupied_until_date stamped", "on an empty pool: state WAITLISTED, waitlist_position assigned", "member.units_out_count recomputed", "style.floor_ready_unit_count and demand_score recomputed"]
  - method: GET
    path: "/reservations/{reservation_id}"
    description: "Read one reservation"
    roles: [Member, WarehouseTech, ClaimsAdjuster, InventoryPlanner, PlatformAdmin]
    code: 200
    input: []
    output: Reservation
    side_effects: []
  - method: GET
    path: "/reservations"
    description: "List reservations, optionally filtered by member, style, allocated unit, superseded predecessor or state"
    roles: [Member, WarehouseTech, ClaimsAdjuster, InventoryPlanner, PlatformAdmin]
    code: 200
    input: ["member_id?", "style_id?", "allocated_unit_id?", "superseded_reservation_id?", "state?", "limit?", "offset?"]
