          setup:
            - "Clock 2026-07-10T00:00:00.000Z; one campus, one supplier, one NMC622 intake of net 1000.0 kg at custody_state PACKAGED carrying four 100.0 kg modules whose min == mean capacity is 80.0, 70.0, 60.0 and 59.99 and whose cycle_count is omitted."
