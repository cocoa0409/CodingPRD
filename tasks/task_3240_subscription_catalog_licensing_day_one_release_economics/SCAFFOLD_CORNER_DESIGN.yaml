              as: CatalogAdmin
              captures: { jp_entry_a: $.data.id }
            - call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title_id}", region_code: "JP", tiers: ["PREMIUM"], announced_add_date: "2026-06-04T00:00:00Z", removal_date: "2026-08-10T00:00:00Z", release_class: "BACK_CATALOG", popularity_index_cents: 8000, popularity_index_cents_30d_avg: 8000 }
              as: CatalogAdmin
              captures: { jp_entry_b: $.data.id }
            - call: "POST /catalog/catalog-entries/${jp_entry_a}/publish"
              payload: {}
              as: CatalogAdmin
            - call: "POST /catalog/catalog-entries/${jp_entry_b}/publish"
