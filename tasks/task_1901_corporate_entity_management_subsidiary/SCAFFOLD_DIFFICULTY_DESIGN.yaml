  - rule_id: boundary_precision_check
    instances:
      - name: late_filing_grace_boundary
        grounds:
          - calculations.late_filing_penalty
          - entities.AnnualFiling.fields.days_late
        distinguishing_aspect: |
          Metric: days late on the submit endpoint. Submitting exactly on
          grace_end (2027-01-10 = due 2026-12-31 + 10 grace days) yields
          days_late == 0 and penalty_cents == 0 (half-open interval
          (grace_end, submitted] is empty); submitting one day later yields
          days_late == 1 and penalty_cents == 12512 (12500 + round(9.62)=10 +
          round(2.05)=2). The boundary is the closed-vs-open edge of the
          counting interval, not an approximate threshold.
        test_recipe:
          setup:
            - "J1, AG1, ACTIVE entity E1 with authorized_shares 10000"
            - "FRANCHISE_TAX period-2026 filing prepared (tax basis 26000 both variants; shares unchanged)"
