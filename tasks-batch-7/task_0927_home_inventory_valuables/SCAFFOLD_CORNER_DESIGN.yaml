            - "the POST /vault/claims response body itself has data.status == OPEN"
            - "Item.${it_id}.lifecycle_state == FROZEN"
            - "Item.${it_id}.frozen_by_claim_id == ${clm_id}"
            - "Household.${hh_id}.frozen_item_count == 1"
            - "Household.${hh_id}.records_freeze_active == true"

  - section: errors
    instances:
