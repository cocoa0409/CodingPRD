          - state_machines.CommunityBenefitReport.FILED_to_REOPENED
          - entities.CommunityBenefitReport.fields.total_write_offs_cents
        distinguishing_aspect: |
          Conserved quantity = reconciliation of the filed report's totals with the live POSTED ledger.
          Invariant: for a report of year Y, total_write_offs_cents == sum(amount_cents of POSTED WRITE_OFF
          adjustments whose determination finalized in [Y-01-01, Y+1-01-01)). A determination reversal in a
