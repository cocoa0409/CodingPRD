        excluded_because:
          difficulty_instance: resource_temporal_overlap / jig_half_open_window_with_trailing_changeover_buffer
          rationale: "That instance books a legal window and then proves the buffer makes an adjacent request conflict."
      - name: validation_aggregate_capacity_breach_on_the_third_test
