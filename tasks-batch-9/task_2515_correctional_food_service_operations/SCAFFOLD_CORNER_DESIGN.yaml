            - call: "POST /cfs/diet-orders"
              payload: { inmate_id: "${inmate_id}", order_type: "MEDICAL", diet_code: "RENAL", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", expected_inmate_version: "${inmate_v2}" }
