              captures: { det_id: $.data.id }
          assert:
            - "HTTP 201 with data.route == SELF_PAY and data.primary_payer == null, even though the procedure_category PATHOLOGY is medical-primary - the category only breaks the tie on the SPLIT route"
            - "data.medical_allowed_cents == 0, data.dental_allowed_cents == 0, data.patient_responsibility_cents == 80000"

      - name: minor_patient_retention_runs_to_majority_plus_seven
        claim_type: constants_applied
        grounds:
          - calculations.imaging_retention_until
          - entities.ImagingStudy.fields.retention_until
        distinguishing_aspect: "Two studies acquired at the same instant retain for different periods: the adult's is acquired_at + 7 years, while the 10-year-old's majority floor (date_of_birth + 18 + 7) is later and therefore wins the max()."
        test_recipe:
          setup:
            - "one adult patient born 1980-03-15 and one minor born 2016-03-15, logical clock 2026-06-05T10:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-05T10:00:00Z" }
