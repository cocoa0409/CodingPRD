# =============================================================================
# Task 0772 — Professional Organizer & Decluttering Service
# SCAFFOLD_CORNER_DESIGN.yaml  (§1.9 — Coverage Index for Non-Difficulty Tests)
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: client_create_returns_201_with_fields
        claim_type: Creation
        grounds:
          - "entities.Client"
          - "endpoints"
        distinguishing_aspect: "POST /clients with all required fields returns 201 and echoes full_name/email/home_address plus system id/created_at."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /clients", payload: { full_name: "Ann", email: "ann@x.com", home_address: "1 A St" }, as: OperationsManager, captures: { cid: "$.data.id" } }
          assert:
            - "HTTP status == 201"
            - "Client.full_name == 'Ann'"
            - "Client.id is a non-empty UUID"

      - name: client_missing_required_full_name_returns_422
        claim_type: Required Fields
        grounds:
          - "entities.Client.fields.full_name"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /clients without full_name returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /clients", payload: { email: "no@x.com", home_address: "2 St" }, as: OperationsManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "HTTP status == 422"

      - name: project_defaults_applied_when_optional_omitted
        claim_type: Defaults
        grounds:
          - "entities.Project.fields.move_addon_requested"
          - "entities.Project.fields.flat_price_cents"
        distinguishing_aspect: "Omitting flat_price_cents / move_addon_requested / move_box_count applies defaults 0/false/0."
        test_recipe:
          setup: ["A client and organizer exist."]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "D", email: "d@x.com", home_address: "3 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "O", email: "o@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
          trigger:
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "P", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: OperationsManager, captures: { flat: "$.data.flat_price_cents", ma: "$.data.move_addon_requested" } }
          assert:
            - "Project.flat_price_cents == 0"
            - "Project.move_addon_requested == false"
            - "Project.move_box_count == 0"
            - "Project.status == SCOPING"

      - name: project_get_nonexistent_returns_404
        claim_type: Not Found
        grounds:
          - "errors[ERR_PROJECT_NOT_FOUND]"
        distinguishing_aspect: "GET /projects/{unknown-uuid} returns ERR_PROJECT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /projects/00000000-0000-4000-8000-000000000000", payload: {}, as: OperationsManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_PROJECT_NOT_FOUND"
            - "HTTP status == 404"

      - name: project_bad_enum_billing_mode_returns_422
        claim_type: Type Constraints
        grounds:
          - "entities.Project.fields.billing_mode"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "billing_mode not in {HOURLY,PROJECT} returns ERR_VALIDATION."
        test_recipe:
          setup: ["A client and organizer exist."]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "E", email: "e@x.com", home_address: "4 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "O", email: "o2@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
          trigger:
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "P", billing_mode: "SUBSCRIPTION", scope_rooms: ["Room"] }, as: OperationsManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: session_end_before_start_returns_422
        claim_type: Type Constraints
        grounds:
          - "entities.Session.fields.scheduled_end"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "scheduled_end <= scheduled_start returns ERR_VALIDATION."
        test_recipe:
          setup: ["Active project and organizer exist."]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "F", email: "f@x.com", home_address: "5 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "O", email: "o3@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "P", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: OperationsManager, captures: { p: "$.data.id" } }
            - { call: "POST /projects/${p}/activate", payload: {}, as: OperationsManager }
          trigger:
            - { call: "POST /sessions", payload: { project_id: "${p}", organizer_id: "${o}", scheduled_start: "2026-03-02T12:00:00Z", scheduled_end: "2026-03-02T09:00:00Z" }, as: Organizer, as_user_id: "${o}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: project_body_fk_client_not_found_returns_404
        claim_type: Parent Relationships
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_CLIENT_NOT_FOUND]"
        distinguishing_aspect: "POST /projects with a client_id that does not exist returns ERR_CLIENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["An organizer exists; no client with the used id."]
          setup_api_calls:
            - { call: "POST /organizers", payload: { full_name: "O", email: "o4@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
          trigger:
            - { call: "POST /projects", payload: { client_id: "00000000-0000-4000-8000-000000000000", lead_organizer_id: "${o}", title: "P", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: OperationsManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_CLIENT_NOT_FOUND"

      - name: maintenance_plan_visits_per_year_computed
        claim_type: Computed Fields
        grounds:
          - "entities.MaintenancePlan.fields.visits_per_year"
        distinguishing_aspect: "cadence=QUARTERLY yields computed visits_per_year==4 regardless of any client-supplied value."
        test_recipe:
          setup: ["A project exists (SCOPING is fine)."]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "G", email: "g@x.com", home_address: "6 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "O", email: "o5@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "P", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: OperationsManager, captures: { p: "$.data.id" } }
          trigger:
            - { call: "POST /maintenance-plans", payload: { project_id: "${p}", cadence: "QUARTERLY", monthly_fee_cents: 9900 }, as: OperationsManager, captures: { vpy: "$.data.visits_per_year" } }
          assert:
            - "MaintenancePlan.visits_per_year == 4"
            - "MaintenancePlan.status == DRAFT"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: activate_already_active_project_returns_invalid
        claim_type: invalid_transition
        grounds:
          - "state_machines.Project.SCOPING_to_ACTIVE"
          - "errors[ERR_PROJECT_NOT_IN_SCOPING]"
        distinguishing_aspect: "Activating a project already in ACTIVE returns ERR_PROJECT_NOT_IN_SCOPING (409)."
        test_recipe:
          setup: ["An ACTIVE project exists."]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "H", email: "h@x.com", home_address: "7 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "O", email: "o6@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "P", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: OperationsManager, captures: { p: "$.data.id" } }
            - { call: "POST /projects/${p}/activate", payload: {}, as: OperationsManager }
          trigger:
            - { call: "POST /projects/${p}/activate", payload: {}, as: OperationsManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_PROJECT_NOT_IN_SCOPING"

      - name: activate_empty_scope_returns_scope_empty
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Project.SCOPING_to_ACTIVE"
          - "errors[ERR_SCOPE_EMPTY]"
        distinguishing_aspect: "Activating a project whose scope_rooms is empty returns ERR_SCOPE_EMPTY (409)."
        test_recipe:
          setup: ["A SCOPING project created with empty scope_rooms."]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "I", email: "i@x.com", home_address: "8 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "O", email: "o7@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "P", billing_mode: "HOURLY", scope_rooms: [] }, as: OperationsManager, captures: { p: "$.data.id" } }
          trigger:
            - { call: "POST /projects/${p}/activate", payload: {}, as: OperationsManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_SCOPE_EMPTY"

      - name: activate_project_billed_zero_flat_price_returns_error
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Project.SCOPING_to_ACTIVE"
          - "errors[ERR_FLAT_PRICE_REQUIRED]"
        distinguishing_aspect: "Activating a PROJECT-billed project with flat_price_cents=0 returns ERR_FLAT_PRICE_REQUIRED (409)."
        test_recipe:
          setup: ["A SCOPING PROJECT-billed project with flat_price_cents default 0."]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "J", email: "j@x.com", home_address: "9 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "O", email: "o8@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "P", billing_mode: "PROJECT", scope_rooms: ["Room"] }, as: OperationsManager, captures: { p: "$.data.id" } }
          trigger:
            - { call: "POST /projects/${p}/activate", payload: {}, as: OperationsManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_FLAT_PRICE_REQUIRED"

      - name: pay_disputed_invoice_returns_not_payable
        claim_type: invalid_transition
        grounds:
          - "state_machines.Invoice.ISSUED_to_PAID"
          - "errors[ERR_INVOICE_NOT_PAYABLE]"
        distinguishing_aspect: "Paying a DISPUTED invoice returns ERR_INVOICE_NOT_PAYABLE (409); it must first be resolved to ISSUED."
        test_recipe:
          setup: ["An ISSUED invoice moved to DISPUTED."]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "K", email: "k@x.com", home_address: "10 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "O", email: "o9@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "P", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: OperationsManager, captures: { p: "$.data.id" } }
            - { call: "POST /projects/${p}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /sessions", payload: { project_id: "${p}", organizer_id: "${o}", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T12:00:00Z" }, as: Organizer, as_user_id: "${o}", captures: { s: "$.data.id" } }
            - { call: "PATCH /sessions/${s}", payload: { status: "IN_PROGRESS" }, as: Organizer, as_user_id: "${o}" }
            - { call: "POST /sessions/${s}/complete", payload: { logged_hours: 3 }, as: Organizer, as_user_id: "${o}" }
            - { call: "GET /projects/${p}", payload: {}, as: BillingAdmin, captures: { pv: "$.data.version" } }
            - { call: "POST /invoices", payload: { project_id: "${p}", expected_project_version: "${pv}" }, as: BillingAdmin, captures: { inv: "$.data.id" } }
            - { call: "PATCH /invoices/${inv}", payload: { status: "DISPUTED" }, as: Client, as_user_id: "${c}" }
          trigger:
            - { call: "POST /invoices/${inv}/pay", payload: {}, as: BillingAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVOICE_NOT_PAYABLE"

      - name: schedule_kept_item_returns_invalid_item_transition
        claim_type: invalid_transition
        grounds:
          - "state_machines.InventoryItem.LOGGED_to_KEPT"
          - "errors[ERR_INVALID_ITEM_TRANSITION]"
        distinguishing_aspect: "Scheduling a KEEP item (terminal KEPT at creation) returns ERR_INVALID_ITEM_TRANSITION (409)."
        test_recipe:
          setup: ["Active project with one KEEP item (status KEPT)."]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "L", email: "l@x.com", home_address: "11 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "O", email: "o10@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "P", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: OperationsManager, captures: { p: "$.data.id" } }
            - { call: "POST /projects/${p}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /inventory-items", payload: { project_id: "${p}", room_label: "Room", description: "Keepsake", disposition: "KEEP" }, as: Organizer, as_user_id: "${o}", captures: { it: "$.data.id" } }
          trigger:
            - { call: "POST /inventory-items/${it}/schedule", payload: {}, as: Organizer, as_user_id: "${o}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_ITEM_TRANSITION"

      - name: cancel_already_cancelled_project_returns_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Project.ACTIVE_to_CANCELLED"
          - "errors[ERR_PROJECT_TERMINAL]"
        distinguishing_aspect: "Cancelling a project already CANCELLED returns ERR_PROJECT_TERMINAL (409); no further transitions from a terminal state."
        test_recipe:
          setup: ["A CANCELLED project."]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "M", email: "m@x.com", home_address: "12 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "O", email: "o11@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "P", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: OperationsManager, captures: { p: "$.data.id" } }
            - { call: "POST /projects/${p}/cancel", payload: {}, as: OperationsManager }
          trigger:
            - { call: "POST /projects/${p}/cancel", payload: {}, as: OperationsManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_PROJECT_TERMINAL"

      - name: weekend_surcharge_applied_on_completion
        claim_type: Correct Result
        grounds:
          - "calculations.session_labor_cost"
        distinguishing_aspect: "A Saturday 5h session at rate 6000 gets the 20% weekend surcharge: labor_cost_cents==36000, is_overtime false."
        test_recipe:
          setup: ["Active project, organizer rate 6000, one IN_PROGRESS Saturday session."]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "N", email: "n@x.com", home_address: "13 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "O", email: "o12@x.com", hourly_rate_cents: 6000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "P", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: OperationsManager, captures: { p: "$.data.id" } }
            - { call: "POST /projects/${p}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /sessions", payload: { project_id: "${p}", organizer_id: "${o}", scheduled_start: "2026-03-07T09:00:00Z", scheduled_end: "2026-03-07T14:00:00Z" }, as: Organizer, as_user_id: "${o}", captures: { s: "$.data.id" } }
            - { call: "PATCH /sessions/${s}", payload: { status: "IN_PROGRESS" }, as: Organizer, as_user_id: "${o}" }
          trigger:
            - { call: "POST /sessions/${s}/complete", payload: { logged_hours: 5 }, as: Organizer, as_user_id: "${o}", captures: { cost: "$.data.labor_cost_cents" } }
          assert:
            - "Session.labor_cost_cents == 36000"
            - "Session.is_overtime == false"

      - name: inventory_disposition_branch_covered_by_difficulty
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.InventoryItem.LOGGED_to_SCHEDULED_HAUL"
        excluded_because:
          difficulty_instance: non_linear_state_machine / inventory_disposition_branch_haul_vs_donate
          rationale: "Haul-vs-donate fork and haul-fee side effect are asserted by the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_header_returns_401
        claim_type: Violation → Error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with no X-User-ID/X-User-Role header returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB; request sent without auth headers."]
          setup_api_calls: []
          trigger:
            - { call: "POST /clients", payload: { full_name: "Z", email: "z@x.com", home_address: "0 St" }, as: OperationsManager, captures: { err: "$.data.error_id" } }
          assert:
            - "When headers are omitted, response error_id == ERR_UNAUTHENTICATED and HTTP status == 401"

      - name: organizer_cannot_create_client_returns_403
        claim_type: Violation → Error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN]"
          - "roles.Organizer"
        distinguishing_aspect: "Organizer calling POST /clients (OperationsManager-exclusive) returns ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["An organizer exists to act as."]
          setup_api_calls:
            - { call: "POST /organizers", payload: { full_name: "O", email: "o13@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
          trigger:
            - { call: "POST /clients", payload: { full_name: "No", email: "no@x.com", home_address: "9 St" }, as: Organizer, as_user_id: "${o}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_FORBIDDEN"

      - name: organizer_complete_session_owner_mismatch_returns_403
        claim_type: Violation → Error
        grounds:
          - "validations[priority=2]"
          - "roles.Organizer"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "An Organizer completing a session assigned to a DIFFERENT organizer (X-User-ID != session.organizer_id) returns ERR_FORBIDDEN."
        test_recipe:
          setup: ["Active project with an IN_PROGRESS session assigned to organizer O1; a second organizer O2 exists."]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "Q", email: "q@x.com", home_address: "14 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "O1", email: "o1m@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o1: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "O2", email: "o2m@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o2: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o1}", title: "P", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: OperationsManager, captures: { p: "$.data.id" } }
            - { call: "POST /projects/${p}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /sessions", payload: { project_id: "${p}", organizer_id: "${o1}", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T12:00:00Z" }, as: Organizer, as_user_id: "${o1}", captures: { s: "$.data.id" } }
            - { call: "PATCH /sessions/${s}", payload: { status: "IN_PROGRESS" }, as: Organizer, as_user_id: "${o1}" }
          trigger:
            - { call: "POST /sessions/${s}/complete", payload: { logged_hours: 3 }, as: Organizer, as_user_id: "${o2}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_FORBIDDEN"

      - name: client_cannot_create_project_returns_403
        claim_type: Violation → Error
        grounds:
          - "roles.Client"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "The Client role cannot POST /projects (OperationsManager-exclusive) → ERR_FORBIDDEN."
        test_recipe:
          setup: ["A client and organizer exist."]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "R", email: "r@x.com", home_address: "15 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "O", email: "o14@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
          trigger:
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "P", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: Client, as_user_id: "${c}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_FORBIDDEN"

      - name: priority_conflicts_covered_by_difficulty
        claim_type: Priority Ordering
        grounds:
          - "validations[priority=6]"
          - "validations[priority=8]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_temporal_on_session_create
          rationale: "State-vs-temporal and constraint-vs-fiscal orderings are asserted by the two §1.8 priority instances."

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: projects_list_pagination_limit_has_more
        claim_type: Listing
        grounds:
          - "endpoints"
        distinguishing_aspect: "With two projects and GET /projects?limit=1, total_count==2, has_more==true, data length==1."
        test_recipe:
          setup: ["Two projects for the same client/organizer."]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "S", email: "s@x.com", home_address: "16 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "O", email: "o15@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "P1", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: OperationsManager }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "P2", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: OperationsManager }
          trigger:
            - { call: "GET /projects", payload: { client_id: "${c}", limit: 1, offset: 0 }, as: OperationsManager }
          assert:
            - "meta/pagination total_count == 2"
            - "has_more == true"
            - "data array length == 1"

      - name: sessions_filtered_by_project_reverse_reachability
        claim_type: Retrieval
        grounds:
          - "entities.Session.fields.project_id"
          - "endpoints"
        distinguishing_aspect: "GET /sessions?project_id={p} returns the session belonging to that project (FK reverse-reachability)."
        test_recipe:
          setup: ["Active project with one SCHEDULED session."]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "T", email: "t@x.com", home_address: "17 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "O", email: "o16@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "P", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: OperationsManager, captures: { p: "$.data.id" } }
            - { call: "POST /projects/${p}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /sessions", payload: { project_id: "${p}", organizer_id: "${o}", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T12:00:00Z" }, as: Organizer, as_user_id: "${o}", captures: { s: "$.data.id" } }
          trigger:
            - { call: "GET /sessions", payload: { project_id: "${p}" }, as: OperationsManager }
          assert:
            - "data array length == 1"
            - "data[0].id == the created session id"

  # ---------------------------------------------------------------------------
  - section: cross_cutting
    instances:
      - name: occ_stale_project_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[invoice-create-stale-project]"
          - "errors[ERR_STALE_PROJECT_VERSION]"
        distinguishing_aspect: "POST /invoices carrying a project version one behind the current (a session completion advanced Project.version) is rejected with ERR_STALE_PROJECT_VERSION (412)."
        test_recipe:
          setup: ["Active HOURLY project with a COMPLETED session; the completion advanced Project.version beyond the value being sent."]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "U", email: "u@x.com", home_address: "18 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "O", email: "o17@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "P", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: OperationsManager, captures: { p: "$.data.id" } }
            - { call: "POST /projects/${p}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /sessions", payload: { project_id: "${p}", organizer_id: "${o}", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T12:00:00Z" }, as: Organizer, as_user_id: "${o}", captures: { s: "$.data.id" } }
            - { call: "PATCH /sessions/${s}", payload: { status: "IN_PROGRESS" }, as: Organizer, as_user_id: "${o}" }
            - { call: "POST /sessions/${s}/complete", payload: { logged_hours: 3 }, as: Organizer, as_user_id: "${o}" }
            - { call: "GET /projects/${p}", payload: {}, as: BillingAdmin, captures: { pv: "$.data.version" } }
          trigger:
            - { call: "POST /invoices", payload: { project_id: "${p}", expected_project_version: "${pv} - 1" }, as: BillingAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_STALE_PROJECT_VERSION"
            - "HTTP status == 412"

      - name: project_version_increments_on_activate
        claim_type: optimistic_concurrency
        grounds:
          - "entities.Project.fields.version"
        distinguishing_aspect: "A freshly created project has version 1; after POST /projects/{id}/activate its version is 2 (increments by 1 on mutation)."
        test_recipe:
          setup: ["A SCOPING project."]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "V", email: "v@x.com", home_address: "19 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "O", email: "o18@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "P", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: OperationsManager, captures: { p: "$.data.id", v0: "$.data.version" } }
          trigger:
            - { call: "POST /projects/${p}/activate", payload: {}, as: OperationsManager, captures: { v1: "$.data.version" } }
          assert:
            - "Project.version at create == 1"
            - "Project.version after activate == 2"

      - name: cascades_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.Project.WRAP_UP_to_CLOSED"
        excluded_because:
          difficulty_instance: transitive_cascade / invoice_pay_cascade_depth3
          rationale: "The invoice-pay and project-cancel cascade chains are asserted end-to-end by the two §1.8 cascade instances."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: response_envelope_success_shape_on_get
        claim_type: immediate
        grounds:
          - "response_envelope"
        distinguishing_aspect: "GET /clients/{id} returns the fixed success envelope: meta.api_request_id, response_type=='object', and data carrying the entity."
        test_recipe:
          setup: ["A client exists."]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "W", email: "w@x.com", home_address: "20 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
          trigger:
            - { call: "GET /clients/${c}", payload: {}, as: OperationsManager }
          assert:
            - "response_type == 'object'"
            - "meta.api_request_id is present"
            - "data.id == the created client id"
