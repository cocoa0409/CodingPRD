# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role unrecognized" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not authorized for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body reference does not resolve to an existing resource" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-machine rejection when a more specific state error is not defined" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same user attempted two steps that must be performed by different people (plan submit vs approve; impairment finalize vs case officer)" }
  - { id: ERR_LOAN_NOT_PERFORMING, http: 409, condition: "Workout case creation requires loan.status == PERFORMING" }
  - { id: ERR_CASE_NOT_WATCHLIST, http: 409, condition: "First action plan requires case.status == WATCHLIST" }
  - { id: ERR_CASE_NOT_NEGOTIATION, http: 409, condition: "Consummation requires case.status == NEGOTIATION" }
  - { id: ERR_CASE_NOT_REFERRABLE, http: 409, condition: "Legal referral requires case.status in {NEGOTIATION, IMPAIRMENT_REVIEW}" }
  - { id: ERR_CASE_NOT_LEGAL, http: 409, condition: "Exit decision with FORECLOSURE/DEED_IN_LIEU requires case.status == LEGAL" }
  - { id: ERR_CASE_NOT_RESOLUTION, http: 409, condition: "Close requires case.status == RESOLUTION" }
  - { id: ERR_CASE_NOT_NEGOTIABLE, http: 409, condition: "New proposal requires case.status in {NEGOTIATION, IMPAIRMENT_REVIEW}" }
  - { id: ERR_CASE_NOT_LIQUIDATABLE, http: 409, condition: "Collateral liquidation recovery requires case.status in {LEGAL, RESOLUTION}" }
  - { id: ERR_PLAN_NOT_DRAFT, http: 409, condition: "Submit requires plan.status == DRAFT" }
  - { id: ERR_PLAN_NOT_SUBMITTED, http: 409, condition: "Approve/reject requires plan.status == SUBMITTED" }
  - { id: ERR_PLAN_NOT_REJECTED, http: 409, condition: "Revise requires plan.status == REJECTED" }
  - { id: ERR_ACTIVE_PLAN_EXISTS, http: 409, condition: "Another ActionPlan on the case is already APPROVED" }
  - { id: ERR_PROPOSAL_NOT_DRAFT, http: 409, condition: "Submit requires proposal.status == DRAFT" }
  - { id: ERR_PROPOSAL_NOT_UNDER_REVIEW, http: 409, condition: "Counter/escalate requires proposal.status == UNDER_BORROWER_REVIEW" }
  - { id: ERR_PROPOSAL_NOT_COUNTERED, http: 409, condition: "Resubmit requires proposal.status == COUNTERED" }
  - { id: ERR_PROPOSAL_NOT_COMMITTEE_REVIEW, http: 409, condition: "Committee approve/reject requires proposal.status == COMMITTEE_REVIEW" }
  - { id: ERR_PROPOSAL_NOT_APPROVED, http: 409, condition: "Consummate requires proposal.status == APPROVED" }
  - { id: ERR_PROPOSAL_NOT_WITHDRAWABLE, http: 409, condition: "Withdraw requires proposal.status in {DRAFT, SUBMITTED, UNDER_BORROWER_REVIEW, COUNTERED}" }
  - { id: ERR_COUNTER_NOT_MATERIAL, http: 422, condition: "Counter terms identical to current terms on all four term fields" }
  - { id: ERR_FORGIVENESS_CAP_EXCEEDED, http: 422, condition: "charged_off + principal_forgiveness would exceed 25% of original principal (strict > rejects; equal passes)" }
  - { id: ERR_TDR_METHOD_REQUIRES_TDR, http: 422, condition: "TDR_DCF impairment method requires case.tdr_status == TDR_CONFIRMED" }
  - { id: ERR_DUPLICATE_CASH_FLOW_PERIOD, http: 422, condition: "expected_cash_flows contains two entries with the same period_index" }
  - { id: ERR_EMPTY_CASH_FLOWS, http: 422, condition: "TDR_DCF assessment submitted with empty expected_cash_flows" }
  - { id: ERR_APPRAISAL_NOT_DRAFT, http: 409, condition: "Submit requires appraisal.status == DRAFT" }
  - { id: ERR_APPRAISAL_NOT_SUBMITTED, http: 409, condition: "Accept/reject requires appraisal.status == SUBMITTED" }
  - { id: ERR_APPRAISAL_STALE, http: 422, condition: "staleness_days > 365 at acceptance" }
  - { id: ERR_COLLATERAL_NOT_PLEDGED, http: 409, condition: "Release requires collateral.status == PLEDGED" }
  - { id: ERR_COLLATERAL_ENCUMBERED, http: 422, condition: "Release blocked: loan.current_principal_cents > 0 and case not CLOSED" }
  - { id: ERR_REFERRAL_NOT_PENDING, http: 409, condition: "Accept requires referral.status == PENDING_COUNSEL" }
  - { id: ERR_REFERRAL_NOT_ACTIVE, http: 409, condition: "Settle/dismiss requires referral.status == ACTIVE" }
  - { id: ERR_STATUTE_EXPIRED, http: 422, condition: "statute_deadline is not strictly after the logical clock at acceptance" }
  - { id: ERR_NO_ACTIVE_REFERRAL, http: 409, condition: "Exit decision from LEGAL requires at least one ACTIVE or SETTLED referral" }
  - { id: ERR_OPEN_REFERRALS_EXIST, http: 409, condition: "Close requires all referrals SETTLED or DISMISSED" }
  - { id: ERR_CURE_NOT_ESTABLISHED, http: 422, condition: "RETURN_TO_PERFORMING close requires days_past_due < 60 and current_principal_cents > 0" }
  - { id: ERR_PATH_REQUIRES_LEGAL, http: 422, condition: "FORECLOSURE or DEED_IN_LIEU exit chosen while case.status == NEGOTIATION" }
  - { id: ERR_FISCAL_LIMIT, http: 422, condition: "Fiscal validation failure (charge-off > current principal; recovery or appraisal amount <= 0)" }
  - { id: ERR_REGULATORY_TIMING, http: 422, condition: "Regulatory timing validation failure (rating-at-entry < 6 on downgrade trigger; plan target date not in future; appraisal effective date in future)" }
  - { id: ERR_INVALID_TEMPORAL, http: 422, condition: "Temporal validation failure (target_resolution_date not strictly after clock; effective_date after clock)" }
  - { id: ERR_BUSINESS_CONSTRAINT, http: 422, condition: "Business constraint failure (non-material counter; second active plan; demand exceeds guarantor worth or LGD; exit choice violates argmax without override)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed payload, unknown fields, or wrong types" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: WorkoutOfficer
    description: "Special assets workout officer; owns negotiation, case entry, plans, proposals, referrals"
    identity: "opaque"
    exclusive_operations:
      - "POST /loans/{loanId}/workout-cases"
      - "POST /loans/{loanId}/workout-cases/{caseId}/action-plans and plan submit/revise"
      - "POST /loans/{loanId}/workout-cases/{caseId}/proposals and proposal submit/counter/resubmit/escalate/consummate/withdraw"
      - "POST /loans/{loanId}/workout-cases/{caseId}/legal-referrals"
    shared_operations:
      - "Create borrowers, loans, collateral"
      - "Read access to all workout resources"

  - name: SpecialAssetsManager
    description: "Manager of the special assets group; approves plans, decides exit strategy, closes cases"
    identity: "opaque"
    exclusive_operations:
      - "POST .../action-plans/{planId}/approve and /reject"
      - "POST /loans/{loanId}/workout-cases/{caseId}/exit-decision"
      - "POST /loans/{loanId}/workout-cases/{caseId}/close"
      - "POST /loans/{loanId}/collateral/{collateralId}/release"
    shared_operations:
      - "Read access to all workout resources"
      - "GET /portfolio-report"

  - name: CreditCommittee
    description: "Committee approving/rejecting restructure terms at COMMITTEE_REVIEW"
    identity: "opaque"
    exclusive_operations:
      - "POST .../proposals/{proposalId}/committee-approve"
      - "POST .../proposals/{proposalId}/committee-reject"
    shared_operations:
      - "Read access to workout cases, proposals, plans"

  - name: AppraisalDesk
    description: "Collateral valuation desk; orders, submits, accepts, rejects appraisals"
    identity: "opaque"
    exclusive_operations:
      - "POST /loans/{loanId}/collateral/{collateralId}/appraisals and submit/accept/reject"
    shared_operations:
      - "Read access to loans, collateral, cases"

  - name: LegalCounsel
    description: "Outside/inside counsel managing referrals, settlements, dismissals"
    identity: "opaque"
    exclusive_operations:
      - "POST .../legal-referrals/{referralId}/accept, /settle, /dismiss"
    shared_operations:
      - "Read access to cases, referrals, recoveries"

  - name: LoanAccounting
    description: "Accounting desk; books charge-offs, recoveries, finalizes impairment, refreshes aging"
    identity: "opaque"
    exclusive_operations:
      - "POST /loans/{loanId}/aging-refresh"
      - "POST .../impairments and .../impairments/{assessmentId}/finalize"
      - "POST .../charge-offs"
      - "POST .../recoveries"
    shared_operations:
      - "Read access to all workout resources"

  - name: PortfolioAnalyst
    description: "Read-only analytics role consuming the portfolio report"
    identity: "opaque"
    exclusive_operations:
      - "GET /portfolio-report (shared with SpecialAssetsManager and SystemAdmin)"
    shared_operations:
      - "Read access to all workout resources"

  - name: SystemAdmin
    description: "Platform operator; drives the logical clock and can seed borrowers/loans/collateral"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "Create borrowers, loans, collateral"
      - "Read access to all workout resources"
      - "GET /portfolio-report"
