      - name: ep_product_model_patch_narrows_limits_without_rejudging_a_passed_hull
        claim_type: Standard CRUD
        grounds:
          - "endpoints.PATCH_/product-models/{product_model_id}"
          - calculations.inspection_verdict
          - entities.FinishedUnit.fields.inspection_verdict
        distinguishing_aspect: |
          The declared PATCH side effect that "previously stored measurements
          are NOT re-judged" is asserted directly: tightening wall_cv_max_pct
          from 12.00 to 0.50 — below the hull's stored wall_cv_pct of 1.08 —
          leaves the already-SELLABLE hull's verdict at PASS and its stored
          statistics byte-identical, while bumping only ProductModel.version.
        test_recipe:
          setup:
            - "The base plant of the discovery instance with PO-CD-1 run through to two hulls inspected PASS (wall_cv_pct 1.08) and both STORED."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_mold
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_tasm
            - *cd2_tqc
            - *cd2_wh
            - *cd2_lot
            - *cd2_po
            - *cd2_porel
            - *cd2_cyc
            - *cd2_chg
            - *cd2_clk0900
            - *cd2_start
            - *cd2_clk1000
            - *cd2_cool
            - *cd2_clk1035
            - *cd2_demold
            - *cd2_disc
            - *cd2_trim1
            - *cd2_out1
            - *cd2_insp1
            - *cd2_trim2
            - *cd2_out2
            - *cd2_insp2
          trigger:
            - call: "PATCH /product-models/${pm}"
              payload: { wall_cv_max_pct: 0.50, impact_test_min_joules: 200.00, min_cooling_minutes: 31 }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /finished-units/${fu1}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "the PATCH response status is 200 and ProductModel.${pm}.wall_cv_max_pct == 0.50, impact_test_min_joules == 200.00 and min_cooling_minutes == 31"
            - "ProductModel.${pm}.gross_cube_m3 is still 2.0000, nest_factor still 0.5000 and msrp_cents still 180000 — omitted fields are untouched"
            - "ProductModel.${pm}.version == 2"
            - "FinishedUnit.${fu1}.inspection_verdict is still PASS and build_status is still SELLABLE"
            - "FinishedUnit.${fu1}.wall_cv_pct is still 1.08, impact_test_joules is still 120.00 and rework_count is still 0"

