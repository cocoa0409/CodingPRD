# =============================================================================
# task_2330 — Production Music Library Licensing
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_id blocks x 2 instances = 18 instances.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# Every numeric assert is a literal computed against the §1.3 formulas.
# Logical clock starts at 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: license_fee_provisional_vs_final_diverges_on_intervening_issuance
        grounds:
          - calculations.license_fee_quote
          - entities.SyncRequest.fields.quoted_fee_cents
          - entities.SyncRequest.fields.quoted_spend_basis_cents
          - entities.SyncRequest.fields.quoted_discount_pct
          - entities.License.fields.final_fee_cents
          - entities.License.fields.final_spend_basis_cents
          - entities.License.fields.final_discount_pct
          - entities.License.fields.composer_sync_share_cents
          - entities.Licensee.fields.committed_spend_cents
          - state_machines.SyncRequest.QUOTED_to_ACCEPTED
        distinguishing_aspect: |
          This instance is the pricing-domain variant pair: PROVISIONAL prices SyncRequest A at
          discount tier 10.00% because Licensee.committed_spend_cents is 0 at quote time, while FINAL
          re-prices the same untouched request data at 15.00% because License B was issued in between,
          so License.final_fee_cents (1626900) is 95700 lower than SyncRequest.quoted_fee_cents
          (1722600) and only the FINAL figure reaches committed_spend_cents and the SYNC_FEE ledger.
        test_recipe:
          setup:
            - "One composer with an ACTIVE ROYALTY_SPLIT agreement (writer 50 / publisher 50, sync fee share 40, no advance)."
            - "Two CATALOGED compositions A and B under that agreement."
            - "One FILM rate-card tier with base_rate_cents 600000 quotable at every scale for 1-120 months."
            - "One licensee with credit_limit_cents 10000000, committed 0 and reserved 0."
            - "SyncRequest A (composition A, FILM, NATIONAL, 24 months, no addons) QUOTED then ACCEPTED at clock 2026-08-01."
            - "SyncRequest B (composition B, identical pricing inputs) QUOTED, ACCEPTED and already issued as License B."
          setup_api_calls:
            - call: "POST /music-library/composers"
              payload: { display_name: "Nadia Okoro", pro_affiliation: "ASCAP", payee_country: "US", tax_withholding_pct: 0.30 }
              as: RightsManager
              captures: { c1: $.data.id }
            - call: "POST /music-library/composer-agreements"
              payload: { composer_id: "${c1}", agreement_type: "ROYALTY_SPLIT", writer_share_pct: 50.00, publisher_share_pct: 50.00, sync_fee_share_pct: 40.00, buyout_fee_cents: 0, exclusivity: "NON_EXCLUSIVE", holdback_days: 0, advance_cents: 0, blanket_opt_in: true }
              as: RightsManager
              captures: { ag1: $.data.id }
            - call: "POST /music-library/composer-agreements/${ag1}/submit-for-signature"
              payload: {}
              as: RightsManager
            - call: "POST /music-library/composer-agreements/${ag1}/sign"
              payload: { signature_name: "Nadia Okoro" }
              as: Composer
              as_user_id: "${c1}"
            - call: "POST /music-library/compositions"
              payload: { composer_id: "${c1}", agreement_id: "${ag1}", title: "Harbour Lights", duration_sec: 180, tempo_bpm: 130, genre: "CINEMATIC", mood_tags: ["EPIC", "DARK", "TENSE"], instrumentation: ["STRINGS", "BRASS", "PERCUSSION"] }
              as: CatalogAdmin
              captures: { compA: $.data.id }
            - call: "POST /music-library/compositions/${compA}/catalog"
              payload: {}
              as: CatalogAdmin
              captures: { compA_v: $.data.version }
            - call: "POST /music-library/compositions"
              payload: { composer_id: "${c1}", agreement_id: "${ag1}", title: "Slate Horizon", duration_sec: 200, tempo_bpm: 118, genre: "CINEMATIC", mood_tags: ["HOPEFUL"], instrumentation: ["PIANO", "STRINGS"] }
              as: CatalogAdmin
              captures: { compB: $.data.id }
            - call: "POST /music-library/compositions/${compB}/catalog"
              payload: {}
              as: CatalogAdmin
              captures: { compB_v: $.data.version }
            - call: "POST /music-library/license-tiers"
              payload: { code: "FILM-STD", media_type: "FILM", allowed_scales: ["LOCAL", "NATIONAL", "WORLDWIDE"], base_rate_cents: 600000, min_term_months: 1, max_term_months: 120, per_use_eligible: true, blanket_eligible: false }
              as: CatalogAdmin
              captures: { tierFilm: $.data.id }
            - call: "POST /music-library/licensees"
              payload: { legal_name: "Northline Pictures", licensee_type: "PRODUCTION_COMPANY", credit_limit_cents: 10000000 }
              as: LicensingAgent
              captures: { lee1: $.data.id }
            - call: "POST /music-library/sync-requests"
              payload: { composition_id: "${compA}", licensee_id: "${lee1}", tier_id: "${tierFilm}", media_type: "FILM", distribution_scale: "NATIONAL", requested_term_start: "2026-09-01T00:00:00Z", requested_term_months: 24, exclusive_requested: false, custom_edit_requested: false, stems_requested: false, alternate_lengths_sec: [], rush_requested: false }
              as: LicensingAgent
              captures: { srA: $.data.id }
            - call: "POST /music-library/sync-requests/${srA}/review"
              payload: {}
              as: LicensingAgent
            - call: "POST /music-library/sync-requests/${srA}/quote"
              payload: { quote_valid_days: 14 }
              as: LicensingAgent
              captures: { srA_quote: $.data.quoted_fee_cents }
            - call: "POST /music-library/sync-requests/${srA}/accept"
              payload: {}
              as: Licensee
              as_user_id: "${lee1}"
            - call: "POST /music-library/sync-requests"
              payload: { composition_id: "${compB}", licensee_id: "${lee1}", tier_id: "${tierFilm}", media_type: "FILM", distribution_scale: "NATIONAL", requested_term_start: "2026-09-01T00:00:00Z", requested_term_months: 24, exclusive_requested: false, rush_requested: false }
              as: LicensingAgent
              captures: { srB: $.data.id }
            - call: "POST /music-library/sync-requests/${srB}/review"
              payload: {}
              as: LicensingAgent
            - call: "POST /music-library/sync-requests/${srB}/quote"
              payload: { quote_valid_days: 14 }
              as: LicensingAgent
            - call: "POST /music-library/sync-requests/${srB}/accept"
              payload: {}
              as: Licensee
              as_user_id: "${lee1}"
            - call: "POST /music-library/licenses"
              payload: { license_mode: "PER_USE", sync_request_id: "${srB}", expected_composition_version: "${compB_v}" }
              as: LicensingAgent
              captures: { licB: $.data.id, licB_fee: $.data.final_fee_cents }
          trigger:
            - call: "POST /music-library/licenses"
              payload: { license_mode: "PER_USE", sync_request_id: "${srA}", expected_composition_version: "${compA_v}" }
              as: LicensingAgent
              captures: { licA: $.data.id }
          assert:
            - "SyncRequest.${srA}.quoted_spend_basis_cents == 1914000"
            - "SyncRequest.${srA}.quoted_discount_pct == 10.00"
            - "SyncRequest.${srA}.quoted_fee_cents == 1722600"
            - "License.${licB}.final_spend_basis_cents == 1914000 and License.${licB}.final_discount_pct == 10.00 and License.${licB}.final_fee_cents == 1722600"
            - "License.${licA}.final_spend_basis_cents == 3636600"
            - "License.${licA}.final_discount_pct == 15.00"
            - "License.${licA}.final_fee_cents == 1626900"
            - "SyncRequest.${srA}.quoted_fee_cents - License.${licA}.final_fee_cents == 95700"
            - "SyncRequest.${srA}.quoted_fee_cents is still 1722600 after issuance (the quote figure is never back-patched)"
            - "License.${licA}.composer_sync_share_cents == 650760"
            - "License.${licB}.composer_sync_share_cents == 689040"
            - "Licensee.${lee1}.committed_spend_cents == 3349500"
            - "Licensee.${lee1}.reserved_spend_cents == 0"
            - "Licensee.${lee1}.credit_available_cents == 6650500"
            - "Composer.${c1}.accrued_unpaid_cents == 1339800"
            - "License.${licA}.term_start == 2026-09-01T00:00:00Z and License.${licA}.term_end == 2028-08-31T00:00:00Z"

      - name: statement_accrual_vs_cash_basis_diverges_on_uncollected_performance
        grounds:
          - calculations.statement_settlement
          - entities.RoyaltyStatement.fields.gross_cents
          - entities.RoyaltyStatement.fields.recouped_cents
          - entities.RoyaltyStatement.fields.withholding_cents
          - entities.RoyaltyStatement.fields.net_payable_cents
          - entities.RoyaltyStatement.fields.line_count
          - entities.RoyaltyLedgerEntry.fields.accrual_recognized_at
          - entities.RoyaltyLedgerEntry.fields.cash_recognized_at
          - entities.Composer.fields.outstanding_advance_cents
        distinguishing_aspect: |
          This instance is the royalty-accounting variant pair on a different entity domain from the
          pricing pair: on one identical ledger of three entries, ACCRUAL sweeps all three by
          accrual_recognized_at (gross 247882, line_count 3, net 68517) while CASH drops the
          PERFORMANCE entry whose cash_recognized_at is still null (gross 246000, line_count 2,
          net 67200), a 1317-cent net divergence caused purely by the timestamp column selected.
        test_recipe:
          setup:
            - "Composer with tax_withholding_pct 0.30 and a signed ROYALTY_SPLIT agreement carrying advance_cents 150000, so outstanding_advance_cents is 150000."
            - "One CATALOGED composition, one BROADCAST_TV tier at base_rate_cents 300000, one licensee with credit_limit_cents 5000000."
            - "A PER_USE License issued at fee 390000 whose SYNC_FEE ledger entry (156000) has been fully paid, so cash_recognized_at is stamped."
            - "A cue sheet registered with the society but NOT yet accepted, so its PERFORMANCE entry (1882) has cash_recognized_at null."
            - "An infringement claim settled STATUTORY with payment received, so its SETTLEMENT entry (90000) has cash_recognized_at stamped."
            - "Logical clock never leaves 2026-08-01T00:00:00Z, so every entry falls inside the statement window 2026-08-01..2026-08-31."
          setup_api_calls:
            - call: "POST /music-library/composers"
              payload: { display_name: "Ivo Brandt", pro_affiliation: "BMI", payee_country: "US", tax_withholding_pct: 0.30 }
              as: RightsManager
              captures: { c1: $.data.id }
            - call: "POST /music-library/composer-agreements"
              payload: { composer_id: "${c1}", agreement_type: "ROYALTY_SPLIT", writer_share_pct: 50.00, publisher_share_pct: 50.00, sync_fee_share_pct: 40.00, buyout_fee_cents: 0, exclusivity: "NON_EXCLUSIVE", holdback_days: 0, advance_cents: 150000, blanket_opt_in: true }
              as: RightsManager
              captures: { ag1: $.data.id }
            - call: "POST /music-library/composer-agreements/${ag1}/submit-for-signature"
              payload: {}
              as: RightsManager
            - call: "POST /music-library/composer-agreements/${ag1}/sign"
              payload: { signature_name: "Ivo Brandt" }
              as: Composer
              as_user_id: "${c1}"
            - call: "POST /music-library/compositions"
              payload: { composer_id: "${c1}", agreement_id: "${ag1}", title: "Night Freight", duration_sec: 150, tempo_bpm: 96, genre: "ELECTRONIC", mood_tags: ["TENSE", "DARK"], instrumentation: ["SYNTH", "PERCUSSION"] }
              as: CatalogAdmin
              captures: { comp1: $.data.id }
            - call: "POST /music-library/compositions/${comp1}/catalog"
              payload: {}
              as: CatalogAdmin
              captures: { comp1_v: $.data.version }
            - call: "POST /music-library/license-tiers"
              payload: { code: "BTV-STD", media_type: "BROADCAST_TV", allowed_scales: ["LOCAL", "NATIONAL", "WORLDWIDE"], base_rate_cents: 300000, min_term_months: 1, max_term_months: 120, per_use_eligible: true, blanket_eligible: false }
              as: CatalogAdmin
              captures: { tierBtv: $.data.id }
            - call: "POST /music-library/licensees"
              payload: { legal_name: "Meridian Broadcast", licensee_type: "BROADCASTER", credit_limit_cents: 5000000 }
              as: LicensingAgent
              captures: { lee1: $.data.id }
            - call: "POST /music-library/sync-requests"
              payload: { composition_id: "${comp1}", licensee_id: "${lee1}", tier_id: "${tierBtv}", media_type: "BROADCAST_TV", distribution_scale: "NATIONAL", requested_term_start: "2026-09-01T00:00:00Z", requested_term_months: 12, exclusive_requested: false, rush_requested: false }
              as: LicensingAgent
              captures: { sr1: $.data.id }
            - call: "POST /music-library/sync-requests/${sr1}/review"
              payload: {}
              as: LicensingAgent
            - call: "POST /music-library/sync-requests/${sr1}/quote"
              payload: { quote_valid_days: 14 }
              as: LicensingAgent
            - call: "POST /music-library/sync-requests/${sr1}/accept"
              payload: {}
              as: Licensee
              as_user_id: "${lee1}"
            - call: "POST /music-library/licenses"
              payload: { license_mode: "PER_USE", sync_request_id: "${sr1}", expected_composition_version: "${comp1_v}" }
              as: LicensingAgent
              captures: { lic1: $.data.id }
            - call: "POST /music-library/licenses/${lic1}/record-payment"
              payload: { amount_cents: 390000 }
              as: RoyaltyAccountant
              as_user_id: "acct-1"
            - call: "POST /music-library/cue-sheets"
              payload: { license_id: "${lic1}", production_title: "Night Freight Promo", broadcast_date: "2026-08-01T00:00:00Z", market_tier: "NETWORK", cues: [{ composition_id: "${comp1}", usage_type: "THEME", duration_sec: 45 }, { composition_id: "${comp1}", usage_type: "FEATURE", duration_sec: 45 }, { composition_id: "${comp1}", usage_type: "BACKGROUND", duration_sec: 45 }] }
              as: LicensingAgent
              captures: { cs1: $.data.id }
            - call: "POST /music-library/cue-sheets/${cs1}/register"
              payload: { society_reference: "BMI-2026-0001" }
              as: RightsManager
            - call: "POST /music-library/fingerprint-matches"
              payload: { composition_id: "${comp1}", source_platform: "UGC_VIDEO", source_reference: "ugc:night-freight-rip", matched_seconds: 225, confidence_pct: 99.0 }
              as: CatalogAdmin
              captures: { fm1: $.data.id }
            - call: "POST /music-library/infringement-claims"
              payload: { fingerprint_match_id: "${fm1}" }
              as: RightsManager
              captures: { cl1: $.data.id }
            - call: "POST /music-library/infringement-claims/${cl1}/notice"
              payload: { notice_channel: "DMCA_EMAIL" }
              as: RightsManager
            - call: "POST /music-library/infringement-claims/${cl1}/settle"
              payload: { settlement_basis: "STATUTORY", payment_received: true }
              as: RightsManager
            - call: "GET /music-library/composers/${c1}"
              payload: {}
              as: RoyaltyAccountant
              captures: { c1_v: $.data.version }
          trigger:
            - call: "GET /music-library/composers/${c1}/royalty-preview"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", basis: "ACCRUAL" }
              as: RoyaltyAccountant
            - call: "GET /music-library/composers/${c1}/royalty-preview"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", basis: "CASH" }
              as: RoyaltyAccountant
            - call: "POST /music-library/royalty-statements"
              payload: { composer_id: "${c1}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", basis: "ACCRUAL", expected_composer_version: "${c1_v}" }
              as: RoyaltyAccountant
              as_user_id: "acct-1"
              captures: { st1: $.data.id }
          assert:
            - "royalty-preview response accrual_gross_cents == 247882 and cash_gross_cents == 246000 in BOTH preview calls (both variants always reported)"
            - "ACCRUAL preview gross_cents == 247882 and included_entry_count == 3"
            - "ACCRUAL preview projected_recoup_cents == 150000, projected_withholding_cents == 29365, projected_net_cents == 68517, projected_payout_status == PAYABLE"
            - "CASH preview gross_cents == 246000 and included_entry_count == 2"
            - "CASH preview projected_recoup_cents == 150000, projected_withholding_cents == 28800, projected_net_cents == 67200, projected_payout_status == PAYABLE"
            - "ACCRUAL projected_net_cents - CASH projected_net_cents == 1317"
            - "RoyaltyStatement.${st1}.gross_cents == 247882"
            - "RoyaltyStatement.${st1}.line_count == 3"
            - "RoyaltyStatement.${st1}.recouped_cents == 150000"
            - "RoyaltyStatement.${st1}.withholding_cents == 29365"
            - "RoyaltyStatement.${st1}.net_payable_cents == 68517"
            - "RoyaltyStatement.${st1}.payout_status == PAYABLE"
            - "Composer.${c1}.outstanding_advance_cents == 0 after the ADVANCE_RECOUP entry of +150000 is appended"
            - "the PERFORMANCE entry of 1882 has statement_id == ${st1} even though its cash_recognized_at is null (ACCRUAL sweeps it)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: fee_matrix_media_scale_term_exclusivity_with_tier_discount
        grounds:
          - calculations.license_fee_quote
          - state_machines.SyncRequest.QUOTED_to_REVISION_REQUESTED
          - state_machines.SyncRequest.REVISION_REQUESTED_to_QUOTED
          - entities.SyncRequest.fields.revision_round
          - entities.LicenseTier.fields.base_rate_cents
          - validations[priority=27]
        distinguishing_aspect: |
          Mode (a) instance: license_fee_quote multiplies five interacting inputs (base rate, MEDIA_FACTOR,
          SCALE_FACTOR, the step-function TERM_FACTOR and the conditional EXCLUSIVITY_FACTOR) and then
          selects a DISCOUNT_TIERS band from the resulting basis, so one revision (NATIONAL/24 to
          WORLDWIDE/24) moves the fee from 537225 to 1020727 while the exclusivity flag alone pushes the
          basis across the 1500000 band edge and changes the discount from 5.00% to 10.00%.
        test_recipe:
          setup:
            - "Composer with an ACTIVE ROYALTY_SPLIT agreement and one CATALOGED composition."
            - "One BROADCAST_TV tier, base_rate_cents 300000, allowed_scales LOCAL/NATIONAL/WORLDWIDE, term range 1-120."
            - "One licensee with credit_limit_cents 10000000."
            - "SyncRequest reviewed and sitting in UNDER_REVIEW with BROADCAST_TV / NATIONAL / 12 months, no addons, no rush, non-exclusive."
            - "Logical clock stays at 2026-08-01T00:00:00Z so no quote can expire during the walk."
          setup_api_calls:
            - call: "POST /music-library/composers"
              payload: { display_name: "Rhea Sandoval", pro_affiliation: "ASCAP", payee_country: "US", tax_withholding_pct: 0.30 }
              as: RightsManager
              captures: { c1: $.data.id }
            - call: "POST /music-library/composer-agreements"
              payload: { composer_id: "${c1}", agreement_type: "ROYALTY_SPLIT", writer_share_pct: 50.00, publisher_share_pct: 50.00, sync_fee_share_pct: 40.00, buyout_fee_cents: 0, exclusivity: "EXCLUSIVE", holdback_days: 0, advance_cents: 0, blanket_opt_in: true }
              as: RightsManager
              captures: { ag1: $.data.id }
            - call: "POST /music-library/composer-agreements/${ag1}/submit-for-signature"
              payload: {}
              as: RightsManager
            - call: "POST /music-library/composer-agreements/${ag1}/sign"
              payload: { signature_name: "Rhea Sandoval" }
              as: Composer
              as_user_id: "${c1}"
            - call: "POST /music-library/compositions"
              payload: { composer_id: "${c1}", agreement_id: "${ag1}", title: "Steel Meridian", duration_sec: 210, tempo_bpm: 124, genre: "CINEMATIC", mood_tags: ["EPIC"], instrumentation: ["BRASS", "PERCUSSION"] }
              as: CatalogAdmin
              captures: { comp1: $.data.id }
            - call: "POST /music-library/compositions/${comp1}/catalog"
              payload: {}
              as: CatalogAdmin
            - call: "POST /music-library/license-tiers"
              payload: { code: "BTV-STD", media_type: "BROADCAST_TV", allowed_scales: ["LOCAL", "NATIONAL", "WORLDWIDE"], base_rate_cents: 300000, min_term_months: 1, max_term_months: 120, per_use_eligible: true, blanket_eligible: false }
              as: CatalogAdmin
              captures: { tierBtv: $.data.id }
            - call: "POST /music-library/licensees"
              payload: { legal_name: "Cascade Media Group", licensee_type: "AGENCY", credit_limit_cents: 10000000 }
              as: LicensingAgent
              captures: { lee1: $.data.id }
            - call: "POST /music-library/sync-requests"
              payload: { composition_id: "${comp1}", licensee_id: "${lee1}", tier_id: "${tierBtv}", media_type: "BROADCAST_TV", distribution_scale: "NATIONAL", requested_term_start: "2026-09-01T00:00:00Z", requested_term_months: 12, exclusive_requested: false, custom_edit_requested: false, stems_requested: false, alternate_lengths_sec: [], rush_requested: false }
              as: LicensingAgent
              captures: { sr1: $.data.id }
            - call: "POST /music-library/sync-requests/${sr1}/review"
              payload: {}
              as: LicensingAgent
          trigger:
            - call: "POST /music-library/sync-requests/${sr1}/quote"
              payload: { quote_valid_days: 14 }
              as: LicensingAgent
            - call: "POST /music-library/sync-requests/${sr1}/request-revision"
              payload: { revision_note: "extend to two years", revised_term_months: 24 }
              as: Licensee
              as_user_id: "${lee1}"
            - call: "POST /music-library/sync-requests/${sr1}/quote"
              payload: { quote_valid_days: 14 }
              as: LicensingAgent
            - call: "POST /music-library/sync-requests/${sr1}/request-revision"
              payload: { revision_note: "go worldwide", revised_distribution_scale: "WORLDWIDE" }
              as: Licensee
              as_user_id: "${lee1}"
            - call: "POST /music-library/sync-requests/${sr1}/quote"
              payload: { quote_valid_days: 14 }
              as: LicensingAgent
            - call: "POST /music-library/sync-requests/${sr1}/request-revision"
              payload: { revision_note: "add exclusivity", revised_exclusive_requested: true }
              as: Licensee
              as_user_id: "${lee1}"
            - call: "POST /music-library/sync-requests/${sr1}/quote"
              payload: { quote_valid_days: 14 }
              as: LicensingAgent
          assert:
            - "after quote 1: SyncRequest.${sr1}.quoted_fee_cents == 390000, quoted_spend_basis_cents == 390000, quoted_discount_pct == 0.00"
            - "after quote 2 (term 24, TERM_FACTOR 1.45): quoted_spend_basis_cents == 565500, quoted_discount_pct == 5.00, quoted_fee_cents == 537225"
            - "after quote 3 (WORLDWIDE, SCALE_FACTOR 1.90): quoted_spend_basis_cents == 1074450, quoted_discount_pct == 5.00, quoted_fee_cents == 1020727"
            - "after quote 4 (exclusive, EXCLUSIVITY_FACTOR 1.65): quoted_spend_basis_cents == 1772843, quoted_discount_pct == 10.00, quoted_fee_cents == 1595559"
            - "the STEP-1 core 1772842.50 is rounded exactly once to 1772843 before the discount, so the fee is 1595559 and NOT 1595558"
            - "SyncRequest.${sr1}.revision_round == 3 and status == QUOTED after the last quote"
            - "SyncRequest.${sr1}.distribution_scale == WORLDWIDE, requested_term_months == 24, exclusive_requested == true"
            - "Licensee.${lee1}.reserved_spend_cents == 1595559 (only the live quote is reserved, superseded quotes were released)"
            - "Licensee.${lee1}.committed_spend_cents == 0 and credit_available_cents == 8404441"

      - name: cue_credit_round_per_cue_then_sum_and_two_step_writer_rounding
        grounds:
          - calculations.cue_performance_credits
          - calculations.performance_royalty_cents
          - entities.CueSheet.fields.cue_credit_breakdown
          - entities.CueSheet.fields.total_credits
          - entities.CueSheet.fields.credits_by_composition
          - entities.Composition.fields.lifetime_performance_credits
          - state_machines.CueSheet.COLLECTED_to_REGISTERED
        distinguishing_aspect: |
          Mode (b) instance on a different calculation from the fee matrix: both roundings whose ORDER
          the scaffold pins are observable at once. Rounding per cue then summing gives total_credits
          3.01 where summing then rounding would give 3.00, and the pinned two-step credits-to-cents
          then cents-to-writer-share rounding gives a PERFORMANCE entry of 1882 where the collapsed
          single multiplication would give 1881.
        test_recipe:
          setup:
