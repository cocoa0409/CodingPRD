              as_user_id: "${reg_id}"
              captures: { dom_id: $.data.id, exp_before: $.data.expires_on }
          trigger:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-20T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-10T00:00:00Z" }
              as: RegistryAdmin
            - call: "GET /registry/registrars/${reg_id}/ledger"
              payload: {}
              as: RegistryFinance
            - call: "GET /registry/domains/${dom_id}"
              payload: {}
              as: RegistryAdmin
              captures: { exp_after: $.data.expires_on }
          assert:
            - "sum of LedgerEntry.amount_cents for registrar ${reg_id} == -1634658 (accreditation at 2026-01-15, 351 days remaining, prorated annual 384658) + 50000 (top-up) - 700 (create) + 0 net for auto-renew-then-lapse == -1585358"
            - "Domain.${dom_id}.expires_on == ${exp_before} (the auto-renew extension fully unwound)"
            - "the AUTO_RENEW invoice is VOIDED, not merely ignored"

      - name: transfer_complete_and_reverse_conserve_domain_term
        grounds:
          - state_machines.Transfer.ACKED_to_COMPLETED
          - state_machines.Transfer.DISPUTED_to_REVERSED
          - entities.Domain.fields.expires_on
        distinguishing_aspect: "Conserved quantity: domain registration term (expires_on) and the gaining registrar's ledger. The completion's +1y extension and -700 debit paired with the reversal's -1y unwind and +700 VOID_CREDIT leave both expires_on and the gaining registrar's ledger exactly as before the transfer."
        test_recipe:
          setup:
            - "Clock 2026-01-01, schedule effective, registrars A and B ACTIVE, domain by A at 2026-01-02 expiring 2027-01-02. Clock 2026-03-10. Transfer requested, acked, completed, disputed."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/registrars"
              payload: { iana_number: 8702, legal_name: "Term A", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_a: $.data.id }
            - call: "POST /registry/registrars"
              payload: { iana_number: 8703, legal_name: "Term B", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_b: $.data.id }
            - call: "POST /registry/registrars/${reg_a}/accredit"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/registrars/${reg_b}/accredit"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/domains"
              payload: { name: "term-conserve", registrar_id: "${reg_a}", years: 1 }
              as: RegistrarOperator
              as_user_id: "${reg_a}"
              captures: { dom_id: $.data.id, exp0: $.data.expires_on }
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/transfers"
              payload: { domain_id: "${dom_id}", to_registrar_id: "${reg_b}" }
              as: RegistrarOperator
              as_user_id: "${reg_b}"
              captures: { xfer_id: $.data.id, ac: $.data.auth_code }
            - call: "POST /registry/transfers/${xfer_id}/ack"
              payload: { auth_code: "${ac}" }
              as: RegistrarOperator
              as_user_id: "${reg_a}"
            - call: "POST /registry/transfers/${xfer_id}/complete"
              payload: {}
              as: RegistrarOperator
              as_user_id: "${reg_b}"
            - call: "POST /registry/transfers/${xfer_id}/dispute"
              payload: { dispute_reason: "conservation test" }
              as: RegistrarOperator
              as_user_id: "${reg_a}"
          trigger:
            - call: "POST /registry/transfers/${xfer_id}/reverse"
              payload: {}
              as: RegistryAdmin
            - call: "GET /registry/domains/${dom_id}"
              payload: {}
              as: RegistryAdmin
              captures: { exp_final: $.data.expires_on, reg_final: $.data.registrar_id }
            - call: "GET /registry/registrars/${reg_b}/ledger"
              payload: {}
              as: RegistryFinance
          assert:
            - "Domain.${dom_id}.expires_on == ${exp0} (term conserved across complete+reverse)"
            - "Domain.${dom_id}.registrar_id == ${reg_a}"
            - "registrar ${reg_b}'s ledger nets to its pre-transfer total: the -700 TRANSFER DEBIT and +700 VOID_CREDIT cancel exactly"
