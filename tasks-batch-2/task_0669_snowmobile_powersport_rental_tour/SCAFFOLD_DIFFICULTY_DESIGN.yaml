        grounds:
          - validations[priority=8]
          - validations[priority=18]
          - errors[ERR_WAIVER_NOT_SIGNED]
          - errors[ERR_DEPARTURE_FULL]
        distinguishing_aspect: |
          business_safety (waiver, priority 8) vs business_fiscal (capacity full, priority 18): a member with
          UNSIGNED waiver confirming onto an already-full departure fails BOTH; priority 8 wins -> ERR_WAIVER_NOT_SIGNED, not ERR_DEPARTURE_FULL.
        test_recipe:
          setup:
            - "Trail TRAIL OPEN max_riders 1; departure capacity 1 already filled by member B (CONFIRMED, rider_count 1)."
            - "Member A waiver UNSIGNED holds a PENDING reservation on the same departure with a second unit."
