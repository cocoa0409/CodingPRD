            - "${e_determination} == \"ERR_DETERMINATION_NOT_FOUND\", ${e_appeal} == \"ERR_APPEAL_NOT_FOUND\", ${e_trip_event} == \"ERR_TRIP_EVENT_NOT_FOUND\", ${e_proceeding} == \"ERR_PROCEEDING_NOT_FOUND\", ${e_referral} == \"ERR_REFERRAL_NOT_FOUND\", ${e_visitor} == \"ERR_VISITOR_RECORD_NOT_FOUND\""
            - "the nested receive call returns ERR_VERIFICATION_NOT_FOUND rather than ERR_INVALID_APPLICATION_STATE, and Application.${appn_id}.status is still \"DRAFT\""

      - name: a_missing_or_undeclared_role_header_is_unauthenticated_before_anything_else
        claim_type: violation_to_error
        grounds:
          - validations.priority_1.ERR_UNAUTHENTICATED
          - response_envelope
        distinguishing_aspect: "Priority 1 outranks even the not-found sweep: a request with no X-User-Role header and a request carrying an undeclared role name both return 401 ERR_UNAUTHENTICATED on an endpoint whose path id does not exist, so the 404 is never reached; a missing X-User-ID is the same 401."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; one applicant"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Wanda Kirchner", date_of_birth: "1966-06-16", residence_zone: "IN_SERVICE_AREA", mobility_aid: "NONE" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
          trigger:
            - call: "GET /applicants/00000000-0000-4000-8000-0000000000e1"
              payload: {}
              as: "(no X-User-Role header)"
              captures: { no_role_err: $.data.error_id }
            - call: "GET /applicants/${rider_id}"
              payload: {}
              as: "PhantomRole"
              as_user_id: "ghost-1"
              captures: { bad_role_err: $.data.error_id }
            - call: "GET /applicants/${rider_id}"
              payload: {}
              as: IntakeClerk
              as_user_id: "(no X-User-ID header)"
              captures: { no_user_err: $.data.error_id }
          assert:
            - "the header-less call returns HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\" — not the 404 the unknown id would otherwise produce"
            - "the undeclared-role call returns HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\" (only the eight declared roles are accepted)"
            - "${no_user_err} == \"ERR_UNAUTHENTICATED\" — both headers are required"
            - "each response body carries data.error_id and data.message per the declared envelope, and no applicant row is mutated"

      - name: roles_outside_an_endpoints_list_are_forbidden_at_priority_two
        claim_type: violation_to_error
        grounds:
          - validations.priority_2.ERR_FORBIDDEN_ROLE
          - roles.Evaluator.exclusive_operations
          - roles.AccessibilityOfficeAdmin.exclusive_operations
        distinguishing_aspect: "ERR_FORBIDDEN_ROLE (403) is decided from the endpoint's declared roles list alone, before any state or payload check: a TravelTrainer publishing a slot, an Evaluator setting the clock and an IntakeClerk running day-close are all refused with the same id even though two of those payloads are perfectly well-formed."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z (set by the admin, the only role that may)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
          trigger:
            - call: "POST /assessment-slots"
              payload: { site_name: "Central Mobility Center", evaluator_user_id: "eval-1", starts_at: "2026-08-05T09:00:00Z", ends_at: "2026-08-05T10:00:00Z", capacity: 2, site_is_wheelchair_accessible: true }
              as: TravelTrainer
              as_user_id: "tt-1"
              captures: { trainer_slot_err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Evaluator
              as_user_id: "eval-1"
              captures: { evaluator_clock_err: $.data.error_id }
            - call: "POST /_ops/day-close"
              payload: {}
              as: IntakeClerk
              captures: { clerk_sweep_err: $.data.error_id }
          assert:
            - "all three calls return HTTP 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "GET /assessment-slots for the attempted slot finds nothing — the refusal happens before creation"
            - "the logical clock is still 2026-08-01T00:00:00Z, proving the Evaluator's well-formed clock payload had no effect"

      - name: an_applicant_cannot_read_another_applicants_records
        claim_type: violation_to_error
        grounds:
          - validations.priority_3.ERR_NOT_RESOURCE_OWNER
          - roles.Applicant.shared_operations
        distinguishing_aspect: "For the Applicant role the ownership check at priority 3 is evaluated per addressed resource and outranks the priority-10 existence check only for resources that exist: rider B reading rider A's application, determination and trip-event list is 403 ERR_NOT_RESOURCE_OWNER, while rider A reading the same three is 200 — and filing an appeal on rider A's determination as rider B is the same 403 on a write path."
        test_recipe:
          setup:
            - "CHAIN to an ISSUED UNCONDITIONAL determination for rider A at clock 2026-08-05T09:30:00Z; rider B is an unrelated applicant"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
