        grounds: [roles, "validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no/unrecognized X-User-Role header returns ERR_UNAUTHENTICATED (401) before any resource logic runs."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /lanes"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_UNAUTHENTICATED"
            - "response.http_status == 401"

      - name: customer_cannot_act_on_other_customers_reservation
        claim_type: peer_roles
        grounds: [roles, "validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "Entity-backed ownership: Customer C2 attempting to hold C1's reservation returns ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup:
            - "RateCard rc, Lane L, Customers C1 and C2, a DRAFT reservation owned by C1."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "RB3", per_game_cents: 500, per_hour_cents: 0, deposit_pct_bps: 2000 }
              as: CenterManager
              captures: { rc_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 253 }
              as: CenterManager
              captures: { l_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "rb3a@x.com", full_name: "RB3 A" }
              as: FrontDesk
              captures: { c1_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "rb3b@x.com", full_name: "RB3 B" }
              as: FrontDesk
              captures: { c2_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${c1_id}", rate_card_id: "${rc_id}", resource_kind: "LANE", lane_id: "${l_id}", pricing_mode: "PER_GAME", start_at: "2026-09-24T18:00:00.000Z", end_at: "2026-09-24T19:00:00.000Z", bowler_count: 2, game_count: 1 }
              as: Customer
              as_user_id: "${c1_id}"
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /reservations/${r_id}/hold"
              payload: {}
              as: Customer
              as_user_id: "${c2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NOT_RESOURCE_OWNER"
            - "response.http_status == 403"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_confirm_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[confirm-stale-reservation]", entities.Reservation.fields.version]
        distinguishing_aspect: "After a revise advances Reservation.version, a confirm carrying the pre-revise expected_reservation_version is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "RateCard rc, Lane L, Customer C, Reservation R held->confirmed; revise then advances the version; client still holds the confirmed version."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "OCC1", per_game_cents: 500, per_hour_cents: 0, deposit_pct_bps: 2000 }
              as: CenterManager
              captures: { rc_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 261 }
              as: CenterManager
              captures: { l_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "occ1@x.com", full_name: "OCC1 C" }
              as: FrontDesk
              captures: { c_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${c_id}", rate_card_id: "${rc_id}", resource_kind: "LANE", lane_id: "${l_id}", pricing_mode: "PER_GAME", start_at: "2026-09-25T18:00:00.000Z", end_at: "2026-09-25T19:00:00.000Z", bowler_count: 2, game_count: 2 }
              as: FrontDesk
              captures: { r_id: $.data.id }
            - call: "POST /reservations/${r_id}/hold"
              payload: {}
              as: FrontDesk
              captures: { v_held: $.data.version }
            - call: "POST /reservations/${r_id}/confirm"
              payload: { expected_reservation_version: "${v_held}" }
              as: FrontDesk
              captures: { v_conf: $.data.version }
            - call: "POST /reservations/${r_id}/revise"
              payload: { expected_reservation_version: "${v_conf}", game_count: 4 }
              as: FrontDesk
          trigger:
            - call: "POST /reservations/${r_id}/confirm"
              payload: { expected_reservation_version: "${v_conf}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_STALE_VERSION"
            - "response.http_status == 412"

      - name: occ_revise_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[revise-stale-reservation]", entities.Reservation.fields.version]
        distinguishing_aspect: "A second revise on a CONFIRMED reservation that carries a version already superseded by an earlier revise+confirm is rejected ERR_STALE_VERSION (412) via the revise OCC guard."
        test_recipe:
          setup:
            - "RateCard rc, Lane L, Customer C, Reservation R held->confirmed. Client records v_conf. One revise+confirm advances the version; the stale v_conf is then reused."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "OCC2", per_game_cents: 500, per_hour_cents: 0, deposit_pct_bps: 2000 }
              as: CenterManager
              captures: { rc_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 262 }
              as: CenterManager
              captures: { l_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "occ2@x.com", full_name: "OCC2 C" }
              as: FrontDesk
              captures: { c_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${c_id}", rate_card_id: "${rc_id}", resource_kind: "LANE", lane_id: "${l_id}", pricing_mode: "PER_GAME", start_at: "2026-09-26T18:00:00.000Z", end_at: "2026-09-26T19:00:00.000Z", bowler_count: 2, game_count: 2 }
              as: FrontDesk
              captures: { r_id: $.data.id }
            - call: "POST /reservations/${r_id}/hold"
              payload: {}
              as: FrontDesk
              captures: { v_held: $.data.version }
            - call: "POST /reservations/${r_id}/confirm"
              payload: { expected_reservation_version: "${v_held}" }
              as: FrontDesk
              captures: { v_conf: $.data.version }
            - call: "POST /reservations/${r_id}/revise"
              payload: { expected_reservation_version: "${v_conf}", game_count: 3 }
              as: FrontDesk
              captures: { v_held2: $.data.version }
            - call: "POST /reservations/${r_id}/confirm"
              payload: { expected_reservation_version: "${v_held2}" }
              as: FrontDesk
          trigger:
            - call: "POST /reservations/${r_id}/revise"
              payload: { expected_reservation_version: "${v_conf}", game_count: 5 }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_STALE_VERSION"
            - "response.http_status == 412"

      - name: rate_threshold_partial_refund_boundary_excluded
        claim_type: rate_threshold_triggers
        grounds: [calculations.cancellation_refund]
        excluded_because:
          difficulty_instance: boundary_precision_check / cancellation_notice_window_24h_boundary_ge
          rationale: "The 24h notice >= boundary is asserted as the full-refund path of the named §1.8 instance; the partial/forfeit tiers are covered by §1.9 calculation instances cancellation_partial_refund_tier_50pct and cancellation_forfeit_tier_zero_refund."

  # ===========================================================================
  - section: errors
    instances:
      - name: error_lane_time_conflict_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_LANE_TIME_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / lane_half_open_back_to_back_allowed_overlap_rejected
          rationale: "ERR_LANE_TIME_CONFLICT is triggered as the rejection path of the named §1.8 overlap instance."

      - name: error_bay_time_conflict_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_BAY_TIME_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / bay_closed_interval_buffer_gap_rejected
          rationale: "ERR_BAY_TIME_CONFLICT is triggered as the rejection path of the named §1.8 bay-buffer instance."

      - name: error_stale_version_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / confirm_blocked_when_lane_out_of_service
          rationale: "ERR_STALE_VERSION is exercised by the §1.9 optimistic_concurrency instances occ_confirm_stale_version_conflict and occ_revise_stale_version_conflict; this stub records catalog coverage."

      - name: error_duplicate_night_index
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_NIGHT_INDEX]", entities.LeagueNight.fields.night_index]
        distinguishing_aspect: "Scheduling a second LeagueNight with a night_index already used in the same league returns ERR_DUPLICATE_NIGHT_INDEX (409)."
        test_recipe:
          setup:
            - "RateCard rc, one lane, League LG with night_index 1 already scheduled."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "ER1", per_game_cents: 0, per_hour_cents: 0 }
              as: CenterManager
              captures: { rc_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 271 }
              as: CenterManager
              captures: { l_id: $.data.id }
            - call: "POST /leagues"
              payload: { name: "Dup League", rate_card_id: "${rc_id}", season_night_count: 2, lanes_per_night: 1, weekly_fee_cents: 5000 }
              as: LeagueAdmin
              captures: { lg_id: $.data.id }
            - call: "POST /league-nights"
              payload: { league_id: "${lg_id}", night_index: 1, start_at: "2026-09-28T18:00:00.000Z", end_at: "2026-09-28T20:00:00.000Z" }
              as: LeagueAdmin
              captures: { n1_id: $.data.id }
          trigger:
            - call: "POST /league-nights"
              payload: { league_id: "${lg_id}", night_index: 1, start_at: "2026-10-05T18:00:00.000Z", end_at: "2026-10-05T20:00:00.000Z" }
              as: LeagueAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_DUPLICATE_NIGHT_INDEX"
            - "response.http_status == 409"

      - name: error_pagination_invalid
        claim_type: violation_to_error
        grounds: ["errors[ERR_PAGINATION_INVALID]", endpoints]
        distinguishing_aspect: "GET /reservations with limit above the max 100 returns ERR_PAGINATION_INVALID (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /reservations?limit=500"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_PAGINATION_INVALID"
            - "response.http_status == 400"

      - name: error_not_waitlisted_direct_window_free
        claim_type: violation_to_error
        grounds: ["errors[ERR_NOT_WAITLISTED]", state_machines.Reservation.WAITLISTED_to_HELD]
        distinguishing_aspect: "Joining the waitlist for a lane window that has no active overlap is rejected ERR_NOT_WAITLISTED (409) — the customer should /hold directly."
        test_recipe:
          setup:
            - "RateCard rc, Lane L IN_SERVICE with no existing bookings, Customer C, a DRAFT reservation on a free window."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "ER2", per_game_cents: 500, per_hour_cents: 0, deposit_pct_bps: 2000 }
