          - entities.LeaguePolicy.fields.renewal_experience_tier
          - entities.LeaguePolicy.fields.renewal_quoted_premium_cents
          - concurrency_rules[renewal-quote-stale-policy]
        distinguishing_aspect: |
          On one policy whose entire loss position is case reserve and zero paid dollars, the INCURRED
          basis reads renewal_loss_ratio_bps 6077 and lands in STANDARD (modifier 0 bps, quote 833912)
          while the PAID_ONLY basis reads 0 bps and lands in PREFERRED (modifier -1500 bps, quote
          708825) - a 125087-cent delta from identical stored data. This instance sits on the
          LeaguePolicy entity and the aggregation algorithm, not on Claim/waterfall_allocation.
