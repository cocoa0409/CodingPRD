scenario: |
  desgin task harder than expert level!!!!  2108. Barge Line & Inland Waterway Freight (Mississippi River barge line): tow building & barge assignment by commodity, lock scheduling & transit delay management, river stage/draft restriction & load adjustment, freight contract & demurrage on delayed unload, barge cleaning & prior-cargo compatibility, fleeting/harbor service fees, fuel surcharge & tariff filing, cargo loss/short claim
domain_name: barge-line-inland-waterway-freight
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  difficulty_level: expert_plus
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval

  entity_topology: flat
  # Peer entities linked purely by foreign keys. Only two nested creation paths
  # exist (POST /tows/{tow_id}/barge-assignments and
  # POST /barges/{barge_id}/cleaning-orders); every other resource is addressed
  # at the top level and joined by FK, so no entity is reachable only through an
  # ownership chain.

  state_machine_shape: parallel
  # Three entities carry two independent state axes that advance on disjoint
  # trigger sets: Barge (operational_status x cleanliness_status),
  # BargeAssignment (status x discharge_status) and FreightContract
  # (movement_status x billing_status). CargoClaim adds a review cycle and
  # LockReservation a grant/deny fork with a reschedule revert.

  relationship_patterns:
    - one_to_many
    - many_to_many          # Barge <-> Tow via BargeAssignment; Barge <-> FleetingBerth via FleetingAssignment
    - self_referential      # TariffFiling.supersedes_tariff_filing_id -> TariffFiling.id
    - cross_aggregate       # BargeAssignment couples the Tow aggregate to the FreightContract aggregate

  role_model: segregation_of_duties
  # A TariffFiling may not be effectuated by the same X-User-ID that filed it,
  # and a CargoClaim may not be approved by the same X-User-ID that assessed it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: Shipper
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the shipper account.
      - name: credit_limit_cents
        type: integer
        source: input
        description: Maximum outstanding freight balance the line will carry for this shipper.
        constraints: ">= 0"
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "Sum of total_cents over this shipper's FreightContract rows whose billing_status IN {INVOICED, ADJUSTED}."
        default: 0
      - name: status
        type: enum
        source: computed
        description: Credit posture of the shipper; gates activation of new contracts.
        default: ACTIVE
        constraints: "ACTIVE | CREDIT_HOLD"
      - name: open_claim_count
        type: integer
        source: computed
        description: "Count of CargoClaim rows for this shipper's contracts whose status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, ASSESSED}."
        default: 0

  - name: Commodity
    parent: null
    common_fields: false
    fields:
      - name: code
        type: string
        source: input
        description: Short trade code for the commodity (e.g. CORN, UAN32).
        constraints: "unique across Commodity"
      - name: commodity_group
        type: enum
        source: input
        description: Rate and compatibility group the commodity belongs to.
        constraints: "GRAIN | COAL | CHEMICAL | PETROLEUM | FERTILIZER | AGGREGATE"
      - name: residue_class
        type: enum
        source: input
        description: Residue the cargo leaves in a hopper after discharge.
        constraints: "CLEAN | DUSTY | OILY | TOXIC"
      - name: hazard_flag
        type: boolean
        source: input
        description: True when the commodity is a regulated hazardous cargo.
      - name: stowage_factor
        type: number
        source: input
        description: Cubic feet per ton; informational for load planning.
        constraints: "> 0"

  - name: CompatibilityRule
    parent: null
    common_fields: false
    fields:
      - name: prior_commodity_group
        type: enum
        source: input
        description: Commodity group last carried in the barge.
        constraints: "GRAIN | COAL | CHEMICAL | PETROLEUM | FERTILIZER | AGGREGATE"
      - name: next_commodity_group
        type: enum
        source: input
        description: Commodity group about to be loaded.
        constraints: "GRAIN | COAL | CHEMICAL | PETROLEUM | FERTILIZER | AGGREGATE"
      - name: required_cleaning_level
        type: enum
        source: input
        description: Minimum cleaning level the barge must hold before the next cargo may load.
        constraints: "NONE | SWEEP | WASH | STEAM_CERT"
      - name: prohibited
        type: boolean
        source: input
        description: True when the sequence may never be performed regardless of cleaning.
        default: false

  - name: TariffFiling
    parent: null
    common_fields: true
    fields:
      - name: tariff_code
        type: string
        source: input
        description: Published tariff identifier.
      - name: commodity_group
        type: enum
        source: input
        description: Commodity group the filing prices.
        constraints: "GRAIN | COAL | CHEMICAL | PETROLEUM | FERTILIZER | AGGREGATE"
      - name: base_rate_cents_per_ton_mile
        type: number
        source: input
        description: Linehaul rate in cents per ton-mile, carried to four decimal places.
        constraints: "> 0"
      - name: min_charge_cents
        type: integer
        source: input
        description: Minimum linehaul charge applied per contract when at least one billable line exists.
        constraints: ">= 0"
      - name: demurrage_rate_cents_per_hour
        type: integer
        source: input
        description: Demurrage rate charged per chargeable hour beyond free laytime.
        constraints: ">= 0"
      - name: fuel_surcharge_table
        type: array
        source: input
        description: "Ascending list of { threshold_cents_per_gallon, pct } tiers used by fuel_surcharge_assessment."
        constraints: "non-empty; thresholds strictly ascending"
      - name: effective_from
        type: datetime
        source: input
        description: Inclusive start of the filing's effective window.
      - name: effective_to
        type: datetime
        source: input
        description: Inclusive end of the filing's effective window.
        constraints: "> effective_from"
      - name: status
        type: enum
        source: system
        description: Filing lifecycle state.
        default: DRAFT
        constraints: "DRAFT | FILED | EFFECTIVE | SUPERSEDED"
      - name: filed_by_user_id
        type: string
        source: system
        description: X-User-ID captured on the DRAFT -> FILED transition; null while DRAFT.
      - name: effectuated_by_user_id
        type: string
        source: system
        description: X-User-ID captured on the FILED -> EFFECTIVE transition; null before.
      - name: supersedes_tariff_filing_id
        type: string
        source: input
        description: "FK -> TariffFiling.id; optional. When set, that filing is driven to SUPERSEDED as this one becomes EFFECTIVE."

  - name: FuelIndexPosting
    parent: null
    common_fields: false
    fields:
      - name: posting_date
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) the diesel price was posted for.
      - name: diesel_price_cents_per_gallon
        type: integer
        source: input
        description: Posted inland waterway diesel price in whole cents per gallon.
        constraints: "> 0"

  - name: RiverStageReading
    parent: null
    common_fields: false
    fields:
      - name: gauge_station
        type: string
        source: input
        description: Name of the river gauge that produced the reading.
      - name: reading_at
        type: datetime
        source: input
        description: Instant the stage was observed.
      - name: stage_feet
        type: number
        source: input
        description: River stage in feet on the station datum.
      - name: draft_restriction_band
        type: enum
        source: computed
        description: Band derived from stage_feet by river_stage_band_resolution.
        constraints: "HIGH_WATER | NORMAL | LOW | CRITICAL"
      - name: max_draft_feet
        type: number
        source: computed
        description: Maximum permitted loaded draft for the band.
      - name: tow_size_cap_barges
        type: integer
        source: computed
        description: Maximum number of barges permitted in one tow for the band.

  - name: Barge
    parent: null
    common_fields: true
    fields:
      - name: hull_number
        type: string
        source: input
        description: Hull identifier painted on the barge.
        constraints: "unique across Barge"
      - name: capacity_tons
        type: integer
        source: input
        description: Maximum cargo tonnage the hull may carry.
        constraints: "> 0"
      - name: light_draft_feet
        type: number
        source: input
        description: Draft of the empty hull in feet.
        constraints: "> 0"
      - name: tons_per_inch_immersion
        type: number
        source: input
        description: Tons of cargo required to sink the hull one additional inch.
        constraints: "> 0"
      - name: operational_status
        type: enum
        source: system
        description: First state axis - where the hull physically is.
        default: IDLE
        constraints: "IDLE | FLEETED | IN_TOW | OUT_OF_SERVICE"
      - name: cleanliness_status
        type: enum
        source: input
        description: Second state axis - the cleaning certificate the hull currently holds. Optional on create.
        default: WASHED
        constraints: "DIRTY | SWEPT | WASHED | STEAM_CERTIFIED"
      - name: last_cargo_commodity_id
        type: string
        source: input
        description: "FK -> Commodity.id; optional. Null when the hull has never carried cargo, in which case every prior-cargo compatibility check resolves to required level NONE."
      - name: last_cleaning_certificate_number
        type: string
        source: system
        description: Certificate number recorded by the most recent COMPLETED CleaningOrder that passed inspection.

  - name: CleaningOrder
    parent: null
    common_fields: true
    fields:
      - name: barge_id
        type: string
        source: system
        description: "FK -> Barge.id; taken from the creation path segment."
      - name: required_for_commodity_id
        type: string
        source: input
        description: "FK -> Commodity.id; the next cargo the hull is being prepared for."
      - name: freight_contract_id
        type: string
        source: input
        description: "FK -> FreightContract.id; optional. When set the completed order's fee rolls into that contract's cleaning_fee_cents."
      - name: required_cleaning_level
        type: enum
        source: computed
        description: Level resolved by cleaning_requirement_and_fee from the barge's prior cargo group and the target commodity group.
        constraints: "NONE | SWEEP | WASH | STEAM_CERT"
      - name: performed_level
        type: enum
        source: input
        description: Cleaning level actually performed, supplied on completion.
        constraints: "NONE | SWEEP | WASH | STEAM_CERT"
      - name: inspection_passed
        type: boolean
        source: input
        description: Surveyor verdict supplied on completion.
      - name: certificate_number
        type: string
        source: input
        description: Cleaning certificate number supplied on completion.
      - name: status
        type: enum
        source: system
        description: Cleaning order lifecycle state.
        default: ORDERED
        constraints: "ORDERED | IN_PROGRESS | COMPLETED | FAILED_INSPECTION"
      - name: fee_cents
        type: integer
        source: computed
        description: Fee for the performed level, fixed at completion; 0 until then.
        default: 0

  - name: FleetingBerth
    parent: null
    common_fields: true
    fields:
      - name: harbor_name
        type: string
        source: input
        description: Harbor the fleeting berth belongs to.
      - name: river_mile
        type: number
        source: input
        description: River mile of the berth.
      - name: capacity_barges
        type: integer
        source: input
        description: Maximum number of barges that may occupy the berth at any instant.
        constraints: "> 0"
      - name: daily_fee_cents_per_barge
        type: integer
        source: input
        description: Fleeting fee charged per billable day per barge.
        constraints: ">= 0"
      - name: switch_fee_cents
        type: integer
        source: input
        description: One-time harbor switching fee charged once per fleeting assignment.
        constraints: ">= 0"
      - name: occupied_barge_count
        type: integer
        source: computed
        description: "Count of FleetingAssignment rows for this berth whose status == RESERVED."
        default: 0

  - name: FleetingAssignment
    parent: null
    common_fields: true
    fields:
      - name: barge_id
        type: string
        source: input
        description: "FK -> Barge.id"
      - name: fleeting_berth_id
        type: string
        source: input
        description: "FK -> FleetingBerth.id"
      - name: freight_contract_id
        type: string
        source: input
        description: "FK -> FreightContract.id; optional. When set the released assignment's fee rolls into that contract's fleeting_fee_cents."
      - name: start_at
        type: datetime
        source: input
        description: Inclusive start of the berth occupation interval.
      - name: end_at
        type: datetime
        source: input
        description: Exclusive end of the planned berth occupation interval.
        constraints: "> start_at"
      - name: released_at
        type: datetime
        source: input
        description: Actual release instant supplied on release; null until then.
      - name: status
        type: enum
        source: system
        description: Fleeting assignment lifecycle state.
        default: RESERVED
        constraints: "RESERVED | RELEASED | CANCELLED"
      - name: estimated_fee_cents
        type: integer
        source: computed
        description: Provisional fee computed at reservation from start_at..end_at.
        default: 0
      - name: billable_days
        type: integer
        source: computed
        description: Billable days fixed at release from start_at..released_at; 0 until then.
        default: 0
      - name: fee_cents
        type: integer
        source: computed
        description: Final fee fixed at release; 0 until then and 0 forever if cancelled.
        default: 0

  - name: Lock
    parent: null
    common_fields: true
    fields:
      - name: lock_name
        type: string
        source: input
        description: Name of the lock and dam.
      - name: river_mile
        type: number
        source: input
        description: River mile of the lock chamber.
      - name: chamber_capacity_barges
        type: integer
        source: input
        description: Number of barges that fit in one chamber cut.
        constraints: "> 0"
      - name: cycle_minutes
        type: integer
        source: input
        description: Minutes required to lock one cut through the chamber.
        constraints: "> 0"
      - name: turnback_buffer_minutes
        type: integer
        source: input
        description: Minutes the chamber remains unavailable after a tow clears, before the next tow may start.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Operational posture of the chamber.
        default: OPEN
        constraints: "OPEN | RESTRICTED | CLOSED"
      - name: granted_reservation_count
        type: integer
        source: computed
        description: "Count of LockReservation rows for this lock whose status IN {GRANTED, IN_CHAMBER}."
        default: 0

  - name: LockReservation
    parent: null
    common_fields: true
    fields:
      - name: lock_id
        type: string
        source: input
        description: "FK -> Lock.id"
      - name: tow_id
        type: string
        source: input
        description: "FK -> Tow.id"
      - name: requested_start_at
        type: datetime
        source: input
        description: Instant the tow asks to begin locking through.
      - name: cut_count
        type: integer
        source: computed
        description: Number of chamber cuts required, from lock_transit_window.
      - name: scheduled_start_at
        type: datetime
        source: computed
        description: Equals requested_start_at at creation and is re-pinned on reschedule.
      - name: scheduled_end_at
        type: datetime
        source: computed
        description: scheduled_start_at plus cut_count * lock.cycle_minutes.
      - name: occupied_until_at
        type: datetime
        source: computed
        description: scheduled_end_at plus lock.turnback_buffer_minutes; the exclusive end of the chamber occupation used for conflict detection.
      - name: actual_start_at
        type: datetime
        source: input
        description: Instant the tow actually entered the chamber; null until entry.
      - name: actual_end_at
        type: datetime
        source: input
        description: Instant the tow actually cleared the chamber; null until cleared.
      - name: delay_minutes
        type: integer
        source: computed
        description: Whole minutes by which actual_end_at exceeded scheduled_end_at, floored at 0; fixed on clear.
        default: 0
      - name: priority_class
        type: enum
        source: input
        description: Lockage priority declared by the dispatcher.
        default: COMMERCIAL
        constraints: "PRIORITY | COMMERCIAL | RECREATIONAL"
      - name: status
        type: enum
        source: system
        description: Reservation lifecycle state.
        default: REQUESTED
        constraints: "REQUESTED | GRANTED | IN_CHAMBER | CLEARED | DENIED | CANCELLED"

  - name: Tow
    parent: null
    common_fields: true
    fields:
      - name: towboat_name
        type: string
        source: input
        description: Name of the towboat pushing the tow.
      - name: horsepower
        type: integer
        source: input
        description: Towboat horsepower.
        constraints: "> 0"
      - name: origin_mile
        type: number
        source: input
        description: River mile the tow departs from.
      - name: destination_mile
        type: number
        source: input
        description: River mile the tow is bound for.
      - name: controlling_gauge_station
        type: string
        source: input
        description: Gauge station whose latest reading governs this tow's draft restriction.
      - name: status
        type: enum
        source: system
        description: Tow lifecycle state.
        default: BUILDING
        constraints: "BUILDING | SEALED | UNDERWAY | DELAYED | ARRIVED | BROKEN_UP"
      - name: barge_count
        type: integer
        source: computed
        description: "Count of BargeAssignment rows for this tow whose status IN {PLANNED, CONFIRMED, LOADED}."
        default: 0
      - name: total_loaded_tons
        type: integer
        source: computed
        description: "Sum of loaded_tons over BargeAssignment rows for this tow whose status IN {PLANNED, CONFIRMED, LOADED}."
        default: 0
      - name: max_draft_feet
        type: number
        source: computed
        description: Greatest barge_draft_feet among the same active assignment set; 0 when the set is empty.
        default: 0
      - name: allowed_draft_feet
        type: number
        source: computed
        description: max_draft_feet permitted by the controlling river stage band at the last recomputation.
        default: 0
      - name: draft_restriction_band
        type: enum
        source: computed
        description: Band of the controlling reading at the last recomputation.
        constraints: "HIGH_WATER | NORMAL | LOW | CRITICAL"
      - name: accrued_delay_minutes
        type: integer
        source: computed
        description: Running sum of delay_minutes attributed to this tow by cleared lock reservations and lock closures.
        default: 0
      - name: pending_lock_reservation_count
        type: integer
        source: computed
        description: "Count of LockReservation rows for this tow whose status IN {REQUESTED, GRANTED, IN_CHAMBER}."
        default: 0
      - name: departed_at
        type: datetime
        source: input
        description: Instant the tow departed; null until departure.
      - name: arrived_at
        type: datetime
        source: input
        description: Instant the tow arrived; null until arrival.

  - name: BargeAssignment
    parent: null
    common_fields: true
    fields:
      - name: tow_id
        type: string
        source: system
        description: "FK -> Tow.id; taken from the creation path segment."
      - name: barge_id
        type: string
        source: input
        description: "FK -> Barge.id"
      - name: freight_contract_id
        type: string
        source: input
        description: "FK -> FreightContract.id"
      - name: cut_position
        type: integer
        source: input
        description: Position of the barge in the tow makeup.
        constraints: "> 0; unique among non-DROPPED assignments of the same tow"
      - name: loaded_tons
        type: integer
        source: input
        description: Tons loaded in the barge at makeup; may be reduced by tow load adjustment.
        constraints: "> 0"
      - name: barge_draft_feet
        type: number
        source: computed
        description: Loaded draft of this barge, two decimal places.
        default: 0
      - name: status
        type: enum
        source: system
        description: First state axis - makeup lifecycle, advanced by Tow transitions.
        default: PLANNED
        constraints: "PLANNED | CONFIRMED | LOADED | DISCHARGED | DROPPED"
      - name: discharge_status
        type: enum
        source: system
        description: Second state axis - unload lifecycle, advanced by discharge endpoints and by claim approval.
        default: NOT_ARRIVED
        constraints: "NOT_ARRIVED | ARRIVED | UNLOADING | COMPLETED | DISPUTED"
      - name: arrived_at
        type: datetime
        source: input
        description: Instant the barge was tendered at the discharge dock.
      - name: unload_started_at
        type: datetime
        source: input
        description: Instant unloading actually began.
      - name: unload_finished_at
        type: datetime
        source: input
        description: Instant unloading finished.
      - name: discharged_tons
        type: integer
        source: input
        description: Tons weighed out at the discharge dock.
        constraints: ">= 0"
      - name: gross_laytime_hours
        type: integer
        source: computed
        description: Whole hours from arrived_at to unload_finished_at, rounded up; fixed at finish-unload.
        default: 0
      - name: net_laytime_hours
        type: integer
        source: computed
        description: Whole hours from unload_started_at to unload_finished_at, rounded up; fixed at finish-unload.
        default: 0
      - name: delay_attributed_minutes
        type: integer
        source: computed
        description: Transit delay minutes propagated onto this assignment by its tow.
        default: 0

  - name: FreightContract
    parent: null
    common_fields: true
    fields:
      - name: shipper_id
        type: string
        source: input
        description: "FK -> Shipper.id"
      - name: commodity_id
        type: string
        source: input
        description: "FK -> Commodity.id"
      - name: contracted_tons
        type: integer
        source: input
        description: Tonnage the shipper committed to move.
        constraints: "> 0"
      - name: origin_mile
        type: number
        source: input
        description: Loading river mile.
      - name: destination_mile
        type: number
        source: input
        description: Discharge river mile.
      - name: distance_miles
        type: number
        source: computed
        description: Absolute difference between origin_mile and destination_mile.
      - name: laytime_hours
        type: integer
        source: input
        description: Free laytime hours allowed per barge before demurrage accrues; may be extended once by delay protection.
        constraints: ">= 0"
      - name: declared_value_cents_per_ton
        type: integer
        source: input
        description: Declared cargo value per ton used to price loss and short claims.
        constraints: "> 0"
      - name: claim_settlement_basis
        type: enum
        source: input
        description: Which of the two assessed settlement variants is paid on approval.
        default: DEDUCTIBLE
        constraints: "DEDUCTIBLE | FRANCHISE"
      - name: pinned_tariff_filing_id
        type: string
        source: system
        description: "FK -> TariffFiling.id; pinned at activation and never re-resolved afterwards."
      - name: pinned_fuel_price_cents_per_gallon
        type: integer
        source: system
        description: Diesel price pinned at activation from the controlling FuelIndexPosting.
      - name: pinned_fuel_surcharge_pct
        type: number
        source: system
        description: Fuel surcharge percentage pinned at activation from the pinned tariff's tier table.
      - name: movement_status
        type: enum
        source: system
        description: First state axis - physical movement lifecycle.
        default: DRAFT
        constraints: "DRAFT | BOOKED | ACTIVE | IN_TRANSIT | DISCHARGED | CLOSED | CANCELLED"
      - name: billing_status
        type: enum
        source: system
        description: Second state axis - billing lifecycle.
        default: NOT_BILLED
        constraints: "NOT_BILLED | INVOICED | ADJUSTED | PAID | VOID"
      - name: accrued_delay_minutes
        type: integer
        source: computed
        description: Running sum of transit delay minutes propagated onto this contract by its assignments.
        default: 0
      - name: delay_protection_applied
        type: boolean
        source: computed
        description: True once the contractual laytime extension has been granted; the extension is granted at most once.
        default: false
      - name: linehaul_cents
        type: integer
        source: computed
        description: Final linehaul charge fixed at invoice issue.
        default: 0
      - name: fuel_surcharge_cents
        type: integer
        source: computed
        description: Final fuel surcharge fixed at invoice issue.
        default: 0
      - name: fleeting_fee_cents
        type: integer
        source: computed
        description: Final fleeting fee fixed at invoice issue.
        default: 0
      - name: cleaning_fee_cents
        type: integer
        source: computed
        description: Final cleaning fee fixed at invoice issue.
        default: 0
      - name: demurrage_cents
        type: integer
        source: computed
        description: Final demurrage fixed at invoice issue.
        default: 0
      - name: subtotal_cents
        type: integer
        source: computed
        description: Sum of the five charge buckets, fixed at invoice issue and never re-derived afterwards.
        default: 0
      - name: volume_rebate_cents
        type: integer
        source: computed
        description: Rebate selected from subtotal_cents at invoice issue.
        default: 0
      - name: claim_credit_cents
        type: integer
        source: computed
        description: Running sum of settlement_cents over APPROVED CargoClaim rows on this contract.
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: subtotal_cents minus volume_rebate_cents minus claim_credit_cents, floored at 0.
        default: 0

  - name: CargoClaim
    parent: null
    common_fields: true
    fields:
      - name: freight_contract_id
        type: string
        source: input
        description: "FK -> FreightContract.id"
      - name: barge_assignment_id
        type: string
        source: input
        description: "FK -> BargeAssignment.id; must be an assignment of the same contract."
      - name: claim_type
        type: enum
        source: input
        description: Nature of the loss being claimed.
        constraints: "SHORTAGE | DAMAGE | CONTAMINATION"
      - name: claimed_tons
        type: number
        source: input
        description: Tons the claimant asserts were lost or spoiled.
        constraints: "> 0"
      - name: claimed_amount_cents
        type: integer
        source: input
        description: Cap the claimant places on the settlement.
        constraints: "> 0"
      - name: shortage_tons
        type: number
        source: computed
        description: Tonnage basis used by the settlement variants; fixed at assessment.
        default: 0
      - name: tolerance_tons
        type: number
        source: computed
        description: Trade tolerance in tons, fixed at assessment.
        default: 0
      - name: settlement_deductible_cents
        type: integer
        source: computed
        description: Settlement under the deductible variant, fixed at assessment.
        default: 0
      - name: settlement_franchise_cents
        type: integer
        source: computed
        description: Settlement under the franchise variant, fixed at assessment.
        default: 0
      - name: settlement_cents
        type: integer
        source: computed
        description: The variant selected by the contract's claim_settlement_basis, fixed at approval; 0 unless APPROVED.
        default: 0
      - name: revision_round
        type: integer
        source: computed
        description: Number of completed INFO_REQUESTED -> UNDER_REVIEW returns.
        default: 0
      - name: status
        type: enum
        source: system
        description: Claim lifecycle state.
        default: SUBMITTED
        constraints: "SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | ASSESSED | APPROVED | DENIED | WITHDRAWN"
      - name: assessed_by_user_id
        type: string
        source: system
        description: X-User-ID captured on the UNDER_REVIEW -> ASSESSED transition.
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID captured on the ASSESSED -> APPROVED transition; must differ from assessed_by_user_id.
      - name: denial_reason
        type: string
        source: input
        description: Reason recorded on denial.
      - name: info_request_note
        type: string
        source: input
        description: Note recorded when the adjuster asks the claimant for more information.
      - name: response_note
        type: string
        source: input
        description: Note recorded when the claimant's information is returned and review resumes.

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: TariffFiling
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /tariff-filings/{tariff_filing_id}/file"
        actor: TariffAnalyst
        preconditions:
          - "TariffFiling.status == DRAFT"
          - "TariffFiling.effective_to > TariffFiling.effective_from"
        side_effects:
          - "sets TariffFiling.filed_by_user_id to the caller's X-User-ID"
          - "increments TariffFiling.version by 1"
        note: "The filer identity is recorded here because the segregation-of-duties check at effectuation reads it."
      - from: FILED
        to: EFFECTIVE
        trigger: "POST /tariff-filings/{tariff_filing_id}/effectuate"
        actor: RateAuthority
        preconditions:
          - "TariffFiling.status == FILED"
          - "caller's X-User-ID != TariffFiling.filed_by_user_id"
          - "no other TariffFiling with the same commodity_group and status == EFFECTIVE has an effective window that overlaps [effective_from, effective_to], except the filing named by supersedes_tariff_filing_id"
        side_effects:
          - "sets TariffFiling.effectuated_by_user_id to the caller's X-User-ID"
          - "when supersedes_tariff_filing_id is set: that TariffFiling moves EFFECTIVE -> SUPERSEDED and its effective_to is truncated to this filing's effective_from"
          - "increments TariffFiling.version by 1 on both filings touched"
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system: another TariffFiling naming this one in supersedes_tariff_filing_id becomes EFFECTIVE"
        actor: system
        preconditions:
          - "TariffFiling.status == EFFECTIVE"
        side_effects:
          - "truncates TariffFiling.effective_to to the superseding filing's effective_from"
          - "increments TariffFiling.version by 1"
        note: "FreightContract rows that already pinned this filing keep pointing at it; pinning is never re-resolved."

  - entity: Barge
    initial_state: IDLE
    terminal_states: []
    transitions:
      - from: IDLE
        to: FLEETED
        trigger: "POST /fleeting-assignments"
        actor: HarborAgent
        preconditions:
          - "Barge.operational_status == IDLE"
        side_effects:
          - "increments FleetingBerth.occupied_barge_count by 1"
          - "increments Barge.version by 1"
        note: "operational_status axis. The cleanliness_status axis is untouched by this transition."
      - from: FLEETED
        to: IDLE
        trigger: "POST /fleeting-assignments/{fleeting_assignment_id}/release or POST /fleeting-assignments/{fleeting_assignment_id}/cancel"
        actor: HarborAgent
        preconditions:
          - "Barge.operational_status == FLEETED"
        side_effects:
          - "decrements FleetingBerth.occupied_barge_count by 1"
          - "increments Barge.version by 1"
      - from: IDLE
        to: IN_TOW
        trigger: "POST /tows/{tow_id}/seal"
        actor: TowboatDispatcher
        preconditions:
          - "Barge.operational_status IN {IDLE, FLEETED}"
        side_effects:
          - "when the barge was FLEETED, its RESERVED FleetingAssignment rows stay RESERVED and are released on tow departure"
          - "increments Barge.version by 1"
      - from: FLEETED
        to: IN_TOW
        trigger: "POST /tows/{tow_id}/seal"
        actor: TowboatDispatcher
        preconditions:
          - "Barge.operational_status IN {IDLE, FLEETED}"
        side_effects:
          - "increments Barge.version by 1"
      - from: IN_TOW
        to: IDLE
        trigger: "POST /tows/{tow_id}/break-up"
        actor: TowboatDispatcher
        preconditions:
          - "Barge.operational_status == IN_TOW"
        side_effects:
          - "sets Barge.cleanliness_status to DIRTY on the cleanliness axis"
          - "sets Barge.last_cargo_commodity_id to the commodity_id of the FreightContract named by the barge's assignment on this tow"
          - "clears Barge.last_cleaning_certificate_number"
          - "increments Barge.version by 1"
      - from: IN_TOW
        to: IDLE
        trigger: "POST /barge-assignments/{barge_assignment_id}/drop"
        actor: TowboatDispatcher
        preconditions:
          - "BargeAssignment.status IN {PLANNED, CONFIRMED}"
        side_effects:
          - "leaves Barge.cleanliness_status and Barge.last_cargo_commodity_id untouched because no cargo moved"
          - "increments Barge.version by 1"
      - from: IDLE
        to: OUT_OF_SERVICE
        trigger: "POST /cleaning-orders/{cleaning_order_id}/complete with inspection_passed == false"
        actor: HarborAgent
        preconditions:
          - "Barge.operational_status == IDLE"
        side_effects:
          - "CleaningOrder moves IN_PROGRESS -> FAILED_INSPECTION"
          - "leaves Barge.cleanliness_status unchanged - a failed inspection grants no certificate"
          - "increments Barge.version by 1"
      - from: OUT_OF_SERVICE
        to: IDLE
        trigger: "POST /cleaning-orders/{cleaning_order_id}/complete with inspection_passed == true"
        actor: HarborAgent
        preconditions:
          - "Barge.operational_status == OUT_OF_SERVICE"
          - "CleaningOrder.status == IN_PROGRESS"
        side_effects:
          - "sets Barge.cleanliness_status to CleaningOrder.performed_level mapped through CLEANLINESS_LEVEL_TO_STATUS"
          - "sets Barge.last_cleaning_certificate_number to CleaningOrder.certificate_number"
          - "increments Barge.version by 1"
      - from: IDLE
        to: IDLE
        trigger: "POST /cleaning-orders/{cleaning_order_id}/complete with inspection_passed == true"
        actor: HarborAgent
        preconditions:
          - "Barge.operational_status == IDLE"
          - "CleaningOrder.status == IN_PROGRESS"
        side_effects:
          - "sets Barge.cleanliness_status to CleaningOrder.performed_level mapped through CLEANLINESS_LEVEL_TO_STATUS on the cleanliness axis only"
          - "sets Barge.last_cleaning_certificate_number to CleaningOrder.certificate_number"
          - "increments Barge.version by 1"
        note: "The two axes are independent: this transition advances cleanliness while operational_status stays put."

  - entity: CleaningOrder
    initial_state: ORDERED
    terminal_states: [COMPLETED]
    transitions:
      - from: ORDERED
        to: IN_PROGRESS
        trigger: "POST /cleaning-orders/{cleaning_order_id}/start"
        actor: HarborAgent
        preconditions:
          - "CleaningOrder.status == ORDERED"
          - "Barge.operational_status IN {IDLE, OUT_OF_SERVICE}"
        side_effects:
          - "increments CleaningOrder.version by 1"
      - from: FAILED_INSPECTION
        to: IN_PROGRESS
        trigger: "POST /cleaning-orders/{cleaning_order_id}/start"
        actor: HarborAgent
        preconditions:
          - "CleaningOrder.status == FAILED_INSPECTION"
        side_effects:
          - "increments CleaningOrder.version by 1"
        note: "Revert loop: a failed inspection returns the same order to the wash rack rather than forcing a new order."
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /cleaning-orders/{cleaning_order_id}/complete with inspection_passed == true"
        actor: HarborAgent
        preconditions:
          - "CleaningOrder.status == IN_PROGRESS"
        side_effects:
          - "sets CleaningOrder.fee_cents from CLEANING_FEE_CENTS[performed_level]"
          - "sets Barge.cleanliness_status and Barge.last_cleaning_certificate_number"
          - "when Barge.operational_status == OUT_OF_SERVICE it returns to IDLE"
          - "when freight_contract_id is set, the fee enters that contract's cleaning_fee_cents at invoice issue"
          - "increments CleaningOrder.version by 1"
      - from: IN_PROGRESS
        to: FAILED_INSPECTION
        trigger: "POST /cleaning-orders/{cleaning_order_id}/complete with inspection_passed == false"
        actor: HarborAgent
        preconditions:
          - "CleaningOrder.status == IN_PROGRESS"
        side_effects:
          - "leaves CleaningOrder.fee_cents at 0 - a failed inspection is not billable"
          - "sets Barge.operational_status to OUT_OF_SERVICE"
          - "increments CleaningOrder.version by 1"

  - entity: FleetingAssignment
    initial_state: RESERVED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: RESERVED
        to: RELEASED
        trigger: "POST /fleeting-assignments/{fleeting_assignment_id}/release"
        actor: HarborAgent
        preconditions:
          - "FleetingAssignment.status == RESERVED"
          - "released_at >= FleetingAssignment.start_at"
        side_effects:
          - "sets FleetingAssignment.billable_days and fee_cents from fleeting_fee_assessment using released_at"
          - "decrements FleetingBerth.occupied_barge_count by 1"
          - "sets Barge.operational_status FLEETED -> IDLE when the barge is not IN_TOW"
          - "increments FleetingAssignment.version by 1"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /tows/{tow_id}/depart"
        actor: TowboatDispatcher
        preconditions:
          - "FleetingAssignment.status == RESERVED"
          - "the assignment's barge holds a BargeAssignment on this tow with status CONFIRMED"
        side_effects:
          - "sets released_at to the tow's departed_at and fixes billable_days and fee_cents"
          - "decrements FleetingBerth.occupied_barge_count by 1"
          - "increments FleetingAssignment.version by 1"
        note: "Departure automatically clears the harbor: the barge cannot be both under way and on a fleeting berth."
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /fleeting-assignments/{fleeting_assignment_id}/cancel"
        actor: HarborAgent
        preconditions:
          - "FleetingAssignment.status == RESERVED"
        side_effects:
          - "leaves fee_cents and billable_days at 0 - a cancelled reservation is never billable"
          - "decrements FleetingBerth.occupied_barge_count by 1"
          - "sets Barge.operational_status FLEETED -> IDLE when the barge is not IN_TOW"
          - "increments FleetingAssignment.version by 1"

  - entity: Lock
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "POST /locks/{lock_id}/set-status with status == RESTRICTED"
        actor: LockMaster
        preconditions:
          - "Lock.status == OPEN"
        side_effects:
          - "no reservation is disturbed; RESTRICTED is an advisory posture that does not block grants"
          - "increments Lock.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /locks/{lock_id}/set-status with status == CLOSED"
        actor: LockMaster
        preconditions:
          - "Lock.status == OPEN"
        side_effects:
          - "every LockReservation on this lock with status IN {REQUESTED, GRANTED} moves to CANCELLED"
          - "each Tow named by one of those cancelled reservations has accrued_delay_minutes increased by LOCK_CLOSURE_DELAY_MINUTES"
          - "each such Tow whose status == UNDERWAY and whose accrued_delay_minutes then reaches TOW_DELAY_STATUS_MINUTES moves UNDERWAY -> DELAYED"
          - "increments Lock.version by 1"
        note: "Head of the closure cascade; the remaining hops are declared on the Tow UNDERWAY -> DELAYED transition."
      - from: RESTRICTED
        to: OPEN
        trigger: "POST /locks/{lock_id}/set-status with status == OPEN"
        actor: LockMaster
        preconditions:
          - "Lock.status == RESTRICTED"
        side_effects:
          - "increments Lock.version by 1"
      - from: CLOSED
        to: OPEN
        trigger: "POST /locks/{lock_id}/set-status with status == OPEN"
        actor: LockMaster
        preconditions:
          - "Lock.status == CLOSED"
        side_effects:
          - "cancelled reservations are not restored; the dispatcher must request new slots"
          - "increments Lock.version by 1"

  - entity: LockReservation
    initial_state: REQUESTED
    terminal_states: [CLEARED, DENIED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /lock-reservations/{lock_reservation_id}/grant"
        actor: LockMaster
        preconditions:
          - "LockReservation.status == REQUESTED"
          - "caller's X-User-ID == LockReservation.lock_id"
          - "Lock.status != CLOSED"
          - "Tow.status IN {BUILDING, SEALED, UNDERWAY, DELAYED}"
          - "the reservation's [scheduled_start_at, occupied_until_at) window does not overlap the window of any other reservation on the same lock whose status IN {GRANTED, IN_CHAMBER}"
        side_effects:
          - "increments Lock.granted_reservation_count by 1"
          - "increments LockReservation.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /lock-reservations/{lock_reservation_id}/deny"
        actor: LockMaster
        preconditions:
          - "LockReservation.status == REQUESTED"
          - "caller's X-User-ID == LockReservation.lock_id"
        side_effects:
          - "decrements Tow.pending_lock_reservation_count by 1"
          - "increments LockReservation.version by 1"
      - from: GRANTED
        to: REQUESTED
        trigger: "POST /lock-reservations/{lock_reservation_id}/reschedule"
        actor: LockMaster
        preconditions:
          - "LockReservation.status == GRANTED"
          - "caller's X-User-ID == LockReservation.lock_id"
        side_effects:
          - "re-pins scheduled_start_at to the new requested_start_at and recomputes scheduled_end_at and occupied_until_at from the tow's current cut_count"
          - "decrements Lock.granted_reservation_count by 1"
          - "increments LockReservation.version by 1"
        note: "Revert edge: a granted slot returns to the request queue rather than being cancelled and re-created."
      - from: GRANTED
        to: IN_CHAMBER
        trigger: "POST /lock-reservations/{lock_reservation_id}/enter-chamber"
        actor: TowboatDispatcher
        preconditions:
          - "LockReservation.status == GRANTED"
          - "Tow.status IN {UNDERWAY, DELAYED}"
          - "Lock.status != CLOSED"
        side_effects:
          - "sets LockReservation.actual_start_at"
          - "increments LockReservation.version by 1"
      - from: IN_CHAMBER
        to: CLEARED
        trigger: "POST /lock-reservations/{lock_reservation_id}/clear"
        actor: TowboatDispatcher
        preconditions:
          - "LockReservation.status == IN_CHAMBER"
          - "actual_end_at >= LockReservation.actual_start_at"
        side_effects:
          - "sets LockReservation.actual_end_at and fixes delay_minutes from lock_delay_attribution"
          - "decrements Lock.granted_reservation_count by 1"
          - "decrements Tow.pending_lock_reservation_count by 1"
          - "adds delay_minutes to Tow.accrued_delay_minutes - hop 1 of the transit-delay cascade"
          - "increments LockReservation.version by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /lock-reservations/{lock_reservation_id}/cancel"
        actor: TowboatDispatcher
        preconditions:
          - "LockReservation.status == REQUESTED"
        side_effects:
          - "decrements Tow.pending_lock_reservation_count by 1"
          - "increments LockReservation.version by 1"
      - from: GRANTED
        to: CANCELLED
        trigger: "POST /lock-reservations/{lock_reservation_id}/cancel"
        actor: TowboatDispatcher
        preconditions:
          - "LockReservation.status == GRANTED"
        side_effects:
          - "decrements Lock.granted_reservation_count by 1"
          - "decrements Tow.pending_lock_reservation_count by 1"
          - "increments LockReservation.version by 1"

  - entity: Tow
    initial_state: BUILDING
    terminal_states: [BROKEN_UP]
    transitions:
      - from: BUILDING
        to: SEALED
        trigger: "POST /tows/{tow_id}/seal"
        actor: TowboatDispatcher
        preconditions:
          - "Tow.status == BUILDING"
          - "Tow.barge_count >= 1"
          - "a RiverStageReading exists for Tow.controlling_gauge_station with reading_at <= the logical clock"
          - "for every active assignment the barge's prior-cargo pair with the contract's commodity group is not prohibited"
          - "for every active assignment CLEANLINESS_RANK[barge.cleanliness_status] >= REQUIRED_LEVEL_RANK[required level]"
          - "Tow.max_draft_feet <= the controlling band's max_draft_feet"
          - "Tow.barge_count <= the controlling band's tow_size_cap_barges"
        side_effects:
          - "every BargeAssignment on this tow with status PLANNED moves to CONFIRMED"
          - "every barge named by those assignments moves operational_status IDLE or FLEETED -> IN_TOW"
          - "re-pins Tow.draft_restriction_band, Tow.allowed_draft_feet and Tow.max_draft_feet"
          - "increments Tow.version by 1"
      - from: SEALED
        to: UNDERWAY
        trigger: "POST /tows/{tow_id}/depart"
        actor: TowboatDispatcher
        preconditions:
          - "Tow.status == SEALED"
        side_effects:
          - "sets Tow.departed_at"
          - "every BargeAssignment on this tow with status CONFIRMED moves to LOADED"
          - "every FleetingAssignment with status RESERVED whose barge is on this tow moves to RELEASED with released_at set to departed_at, fixing its billable_days and fee_cents"
          - "every distinct FreightContract named by those assignments with movement_status ACTIVE moves to IN_TRANSIT"
          - "increments Tow.version by 1"
      - from: UNDERWAY
        to: DELAYED
        trigger: "system: Tow.accrued_delay_minutes reaches TOW_DELAY_STATUS_MINUTES after a lock reservation clears or a lock closes"
        actor: system
        preconditions:
          - "Tow.status == UNDERWAY"
          - "Tow.accrued_delay_minutes >= TOW_DELAY_STATUS_MINUTES"
        side_effects:
          - "hop 2: every BargeAssignment on this tow with status LOADED has delay_attributed_minutes increased by the delay minutes just added to the tow"
          - "hop 3: every distinct FreightContract named by those assignments has accrued_delay_minutes increased by the same amount"
          - "hop 4: each such FreightContract whose accrued_delay_minutes reaches CONTRACT_DELAY_PROTECTION_MINUTES and whose delay_protection_applied is false has laytime_hours increased by CONTRACT_DELAY_PROTECTION_LAYTIME_HOURS and delay_protection_applied set to true"
          - "increments Tow.version by 1, and the version of every BargeAssignment and FreightContract touched"
        note: "This is the tail of the transit-delay cascade; each hop is caused by the hop before it, not by the original clear call."
      - from: DELAYED
        to: UNDERWAY
        trigger: "POST /tows/{tow_id}/resume"
        actor: TowboatDispatcher
        preconditions:
          - "Tow.status == DELAYED"
        side_effects:
          - "leaves Tow.accrued_delay_minutes untouched so a later delay accumulates on top of it"
          - "increments Tow.version by 1"
        note: "Cycle edge: UNDERWAY -> DELAYED -> UNDERWAY may repeat any number of times."
      - from: UNDERWAY
        to: ARRIVED
        trigger: "POST /tows/{tow_id}/arrive"
        actor: TowboatDispatcher
        preconditions:
          - "Tow.status IN {UNDERWAY, DELAYED}"
          - "arrived_at >= Tow.departed_at"
        side_effects:
          - "sets Tow.arrived_at"
          - "increments Tow.version by 1"
      - from: DELAYED
        to: ARRIVED
        trigger: "POST /tows/{tow_id}/arrive"
        actor: TowboatDispatcher
        preconditions:
          - "Tow.status IN {UNDERWAY, DELAYED}"
          - "arrived_at >= Tow.departed_at"
        side_effects:
          - "sets Tow.arrived_at"
          - "increments Tow.version by 1"
      - from: ARRIVED
        to: BROKEN_UP
        trigger: "POST /tows/{tow_id}/break-up"
        actor: TowboatDispatcher
        preconditions:
          - "Tow.status == ARRIVED"
          - "every BargeAssignment on this tow with status LOADED has discharge_status == COMPLETED or DISPUTED"
        side_effects:
          - "every BargeAssignment with status LOADED moves to DISCHARGED"
          - "every barge named by those assignments moves operational_status IN_TOW -> IDLE, cleanliness_status -> DIRTY, and last_cargo_commodity_id -> the contract's commodity_id"
          - "increments Tow.version by 1"
      - from: BUILDING
        to: BUILDING
        trigger: "POST /tows/{tow_id}/adjust-load"
        actor: TowboatDispatcher
        preconditions:
          - "Tow.status == BUILDING"
          - "expected_tow_version matches Tow.version"
          - "a RiverStageReading exists for Tow.controlling_gauge_station with reading_at <= the logical clock"
        side_effects:
          - "for every active assignment whose barge_draft_feet exceeds the controlling band's max_draft_feet, loaded_tons is reduced to that barge's allowed_tons from barge_draft_and_tow_profile"
          - "recomputes barge_draft_feet on every touched assignment and then Tow.total_loaded_tons and Tow.max_draft_feet"
          - "increments Tow.version by 1"
        note: "Self-loop that leaves the state but not the payload unchanged."

  - entity: BargeAssignment
    initial_state: PLANNED
    terminal_states: [DISCHARGED, DROPPED]
    transitions:
      - from: PLANNED
        to: CONFIRMED
        trigger: "POST /tows/{tow_id}/seal"
        actor: TowboatDispatcher
        preconditions:
          - "BargeAssignment.status == PLANNED"
          - "Tow.status == BUILDING"
        side_effects:
          - "increments BargeAssignment.version by 1"
      - from: CONFIRMED
        to: LOADED
        trigger: "POST /tows/{tow_id}/depart"
        actor: TowboatDispatcher
        preconditions:
          - "BargeAssignment.status == CONFIRMED"
          - "Tow.status == SEALED"
        side_effects:
          - "increments BargeAssignment.version by 1"
      - from: LOADED
        to: DISCHARGED
        trigger: "POST /tows/{tow_id}/break-up"
        actor: TowboatDispatcher
        preconditions:
          - "BargeAssignment.status == LOADED"
          - "BargeAssignment.discharge_status IN {COMPLETED, DISPUTED}"
        side_effects:
          - "increments BargeAssignment.version by 1"
      - from: PLANNED
        to: DROPPED
        trigger: "POST /barge-assignments/{barge_assignment_id}/drop"
        actor: TowboatDispatcher
        preconditions:
          - "BargeAssignment.status IN {PLANNED, CONFIRMED}"
        side_effects:
          - "removes loaded_tons from Tow.total_loaded_tons and decrements Tow.barge_count by 1"
          - "recomputes Tow.max_draft_feet over the remaining active assignments, yielding 0 when none remain"
          - "returns the barge to operational_status IDLE when it was IN_TOW"
          - "increments Tow.version by 1 and BargeAssignment.version by 1"
      - from: CONFIRMED
        to: DROPPED
        trigger: "POST /barge-assignments/{barge_assignment_id}/drop"
        actor: TowboatDispatcher
        preconditions:
          - "BargeAssignment.status IN {PLANNED, CONFIRMED}"
        side_effects:
          - "removes loaded_tons from Tow.total_loaded_tons and decrements Tow.barge_count by 1"
          - "recomputes Tow.max_draft_feet over the remaining active assignments"
          - "returns the barge to operational_status IDLE"
          - "increments Tow.version by 1 and BargeAssignment.version by 1"
      - from: NOT_ARRIVED
        to: ARRIVED
        trigger: "POST /barge-assignments/{barge_assignment_id}/record-arrival"
        actor: TowboatDispatcher
        preconditions:
          - "BargeAssignment.discharge_status == NOT_ARRIVED"
          - "BargeAssignment.status == LOADED"
          - "Tow.status == ARRIVED"
        side_effects:
          - "sets BargeAssignment.arrived_at"
          - "increments BargeAssignment.version by 1"
        note: "discharge_status axis - advances independently of the makeup axis."
      - from: ARRIVED
        to: UNLOADING
        trigger: "POST /barge-assignments/{barge_assignment_id}/start-unload"
        actor: TowboatDispatcher
        preconditions:
          - "BargeAssignment.discharge_status == ARRIVED"
          - "unload_started_at >= BargeAssignment.arrived_at"
        side_effects:
          - "sets BargeAssignment.unload_started_at"
          - "increments BargeAssignment.version by 1"
      - from: UNLOADING
        to: COMPLETED
        trigger: "POST /barge-assignments/{barge_assignment_id}/finish-unload"
        actor: TowboatDispatcher
        preconditions:
          - "BargeAssignment.discharge_status == UNLOADING"
          - "unload_finished_at >= BargeAssignment.unload_started_at"
          - "discharged_tons <= BargeAssignment.loaded_tons"
        side_effects:
          - "sets unload_finished_at, discharged_tons, gross_laytime_hours and net_laytime_hours"
          - "when every non-DROPPED assignment of the named FreightContract has discharge_status COMPLETED, that contract moves movement_status IN_TRANSIT -> DISCHARGED"
          - "increments BargeAssignment.version by 1"
      - from: COMPLETED
        to: DISPUTED
        trigger: "POST /cargo-claims/{cargo_claim_id}/approve"
        actor: ClaimsAdjuster
        preconditions:
          - "BargeAssignment.discharge_status == COMPLETED"
        side_effects:
          - "increments BargeAssignment.version by 1"

  - entity: FreightContract
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: BOOKED
        trigger: "POST /freight-contracts/{freight_contract_id}/book"
        actor: ContractManager
        preconditions:
          - "FreightContract.movement_status == DRAFT"
        side_effects:
          - "increments FreightContract.version by 1"
      - from: BOOKED
        to: ACTIVE
        trigger: "POST /freight-contracts/{freight_contract_id}/activate"
        actor: ContractManager
        preconditions:
          - "FreightContract.movement_status == BOOKED"
          - "Shipper.status == ACTIVE"
          - "an EFFECTIVE TariffFiling for the contract's commodity group covers the logical clock"
          - "a FuelIndexPosting exists with posting_date <= the logical clock date"
          - "Shipper.outstanding_balance_cents + estimated_charge_cents <= Shipper.credit_limit_cents"
        side_effects:
          - "pins FreightContract.pinned_tariff_filing_id, pinned_fuel_price_cents_per_gallon and pinned_fuel_surcharge_pct"
          - "sets FreightContract.distance_miles"
          - "increments FreightContract.version by 1"
        note: "Version pinning: later tariff filings never change what this contract is billed at."
      - from: ACTIVE
        to: IN_TRANSIT
        trigger: "system: a Tow carrying an assignment of this contract departs"
        actor: system
        preconditions:
          - "FreightContract.movement_status == ACTIVE"
        side_effects:
          - "increments FreightContract.version by 1"
      - from: IN_TRANSIT
        to: DISCHARGED
        trigger: "system: the last non-DROPPED assignment of this contract reaches discharge_status COMPLETED"
        actor: system
        preconditions:
          - "FreightContract.movement_status == IN_TRANSIT"
          - "every non-DROPPED BargeAssignment of this contract has discharge_status == COMPLETED"
        side_effects:
          - "increments FreightContract.version by 1"
      - from: DISCHARGED
        to: CLOSED
        trigger: "POST /freight-contracts/{freight_contract_id}/mark-paid"
        actor: ContractManager
        preconditions:
          - "FreightContract.movement_status == DISCHARGED"
          - "FreightContract.billing_status IN {INVOICED, ADJUSTED}"
          - "paid_amount_cents == FreightContract.total_cents"
        side_effects:
          - "billing axis moves INVOICED or ADJUSTED -> PAID"
          - "decreases Shipper.outstanding_balance_cents by FreightContract.total_cents"
          - "returns Shipper.status CREDIT_HOLD -> ACTIVE when outstanding_balance_cents <= credit_limit_cents"
          - "increments FreightContract.version by 1 and Shipper.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /freight-contracts/{freight_contract_id}/cancel"
        actor: ContractManager
        preconditions:
          - "FreightContract.movement_status IN {DRAFT, BOOKED, ACTIVE}"
          - "no BargeAssignment of this contract has status IN {CONFIRMED, LOADED}"
        side_effects:
          - "billing axis moves NOT_BILLED -> VOID"
          - "every BargeAssignment of this contract with status PLANNED moves to DROPPED"
          - "increments FreightContract.version by 1"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /freight-contracts/{freight_contract_id}/cancel"
        actor: ContractManager
        preconditions:
          - "FreightContract.movement_status IN {DRAFT, BOOKED, ACTIVE}"
        side_effects:
          - "billing axis moves NOT_BILLED -> VOID"
          - "increments FreightContract.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /freight-contracts/{freight_contract_id}/cancel"
        actor: ContractManager
        preconditions:
          - "FreightContract.movement_status IN {DRAFT, BOOKED, ACTIVE}"
          - "no BargeAssignment of this contract has status IN {CONFIRMED, LOADED}"
        side_effects:
          - "billing axis moves NOT_BILLED -> VOID"
          - "every BargeAssignment of this contract with status PLANNED moves to DROPPED, releasing tonnage from its tow"
          - "increments FreightContract.version by 1"
      - from: NOT_BILLED
        to: INVOICED
        trigger: "POST /freight-contracts/{freight_contract_id}/issue-invoice"
        actor: ContractManager
        preconditions:
          - "FreightContract.billing_status == NOT_BILLED"
          - "FreightContract.movement_status IN {IN_TRANSIT, DISCHARGED}"
          - "expected_shipper_version matches Shipper.version"
          - "at least one BargeAssignment of this contract has discharge_status IN {COMPLETED, DISPUTED}"
        side_effects:
          - "runs linehaul_freight_charge, fuel_surcharge_assessment, demurrage_assessment, fleeting_fee_assessment and cleaning_requirement_and_fee in the FINAL variant and fixes the five buckets, subtotal_cents, volume_rebate_cents and total_cents"
          - "increases Shipper.outstanding_balance_cents by total_cents"
          - "moves Shipper.status ACTIVE -> CREDIT_HOLD when outstanding_balance_cents exceeds credit_limit_cents"
          - "increments FreightContract.version by 1 and Shipper.version by 1"
        note: "Billing axis; movement_status is untouched."
      - from: INVOICED
        to: ADJUSTED
        trigger: "system: a CargoClaim on this contract is approved"
        actor: system
        preconditions:
          - "FreightContract.billing_status == INVOICED"
        side_effects:
          - "adds the claim's settlement_cents to claim_credit_cents and recomputes total_cents = subtotal_cents - volume_rebate_cents - claim_credit_cents floored at 0"
          - "decreases Shipper.outstanding_balance_cents by the same settlement_cents"
          - "increments FreightContract.version by 1"
      - from: ADJUSTED
        to: PAID
        trigger: "POST /freight-contracts/{freight_contract_id}/mark-paid"
        actor: ContractManager
        preconditions:
          - "FreightContract.billing_status IN {INVOICED, ADJUSTED}"
          - "paid_amount_cents == FreightContract.total_cents"
        side_effects:
          - "movement axis moves DISCHARGED -> CLOSED"
          - "decreases Shipper.outstanding_balance_cents by total_cents"
          - "increments FreightContract.version by 1 and Shipper.version by 1"

  - entity: CargoClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /cargo-claims/{cargo_claim_id}/begin-review"
        actor: ClaimsAdjuster
        preconditions:
          - "CargoClaim.status == SUBMITTED"
        side_effects:
          - "increments CargoClaim.version by 1"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /cargo-claims/{cargo_claim_id}/request-info"
        actor: ClaimsAdjuster
        preconditions:
          - "CargoClaim.status == UNDER_REVIEW"
          - "CargoClaim.revision_round < MAX_CLAIM_REVISION_ROUNDS"
        side_effects:
          - "records info_request_note"
          - "increments CargoClaim.version by 1"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /cargo-claims/{cargo_claim_id}/resume-review"
        actor: ClaimsAdjuster
        preconditions:
          - "CargoClaim.status == INFO_REQUESTED"
        side_effects:
          - "records response_note and increments CargoClaim.revision_round by 1"
          - "increments CargoClaim.version by 1"
        note: "Cycle edge. The loop terminates because request-info is refused once revision_round reaches MAX_CLAIM_REVISION_ROUNDS."
      - from: UNDER_REVIEW
        to: ASSESSED
        trigger: "POST /cargo-claims/{cargo_claim_id}/assess"
        actor: ClaimsAdjuster
        preconditions:
          - "CargoClaim.status == UNDER_REVIEW"
        side_effects:
          - "runs claim_settlement_assessment and fixes shortage_tons, tolerance_tons, settlement_deductible_cents and settlement_franchise_cents"
          - "sets assessed_by_user_id to the caller's X-User-ID"
          - "increments CargoClaim.version by 1"
      - from: ASSESSED
        to: APPROVED
        trigger: "POST /cargo-claims/{cargo_claim_id}/approve"
        actor: ClaimsAdjuster
        preconditions:
          - "CargoClaim.status == ASSESSED"
          - "caller's X-User-ID != CargoClaim.assessed_by_user_id"
          - "FreightContract.billing_status == INVOICED"
        side_effects:
          - "hop 1: sets settlement_cents to settlement_franchise_cents when the contract's claim_settlement_basis == FRANCHISE, otherwise to settlement_deductible_cents, and sets approved_by_user_id"
          - "hop 2: the named FreightContract adds settlement_cents to claim_credit_cents, recomputes total_cents and moves billing_status INVOICED -> ADJUSTED"
          - "hop 3: the contract's Shipper has outstanding_balance_cents decreased by settlement_cents"
          - "hop 4: that Shipper moves status CREDIT_HOLD -> ACTIVE when outstanding_balance_cents <= credit_limit_cents"
          - "separately from the chain above, the named BargeAssignment moves discharge_status COMPLETED -> DISPUTED"
          - "decrements Shipper.open_claim_count by 1"
          - "increments CargoClaim.version, FreightContract.version and Shipper.version by 1"
      - from: ASSESSED
        to: DENIED
        trigger: "POST /cargo-claims/{cargo_claim_id}/deny"
        actor: ClaimsAdjuster
        preconditions:
          - "CargoClaim.status == ASSESSED"
          - "caller's X-User-ID != CargoClaim.assessed_by_user_id"
        side_effects:
          - "records denial_reason, leaves settlement_cents at 0 and leaves the contract's billing untouched"
          - "decrements Shipper.open_claim_count by 1"
          - "increments CargoClaim.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /cargo-claims/{cargo_claim_id}/withdraw"
        actor: Shipper
        preconditions:
          - "CargoClaim.status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED}"
          - "when the caller's role is Shipper, X-User-ID == the contract's shipper_id"
        side_effects:
          - "decrements Shipper.open_claim_count by 1"
          - "increments CargoClaim.version by 1"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /cargo-claims/{cargo_claim_id}/withdraw"
        actor: Shipper
        preconditions:
          - "CargoClaim.status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED}"
        side_effects:
          - "decrements Shipper.open_claim_count by 1"
          - "increments CargoClaim.version by 1"
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /cargo-claims/{cargo_claim_id}/withdraw"
        actor: Shipper
        preconditions:
          - "CargoClaim.status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED}"
        side_effects:
          - "decrements Shipper.open_claim_count by 1"
          - "increments CargoClaim.version by 1"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules  (OCC on the parent entity's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: lock-reservation-create-stale-tow
    parent_entity: Tow
    write_endpoint: "POST /lock-reservations"
    occ_field: "expected_tow_version"
    description: |
      A lock slot is sized from the tow's current cut count, so the request
      carries the Tow.version the dispatcher last observed. When the tow's
      makeup has advanced since that observation - another barge added, a load
      adjustment applied, an earlier slot booked - the stored version no longer
      matches and the request is rejected as stale. Under the product's natural
      semantics the reservation would otherwise succeed, because a tow may hold
      any number of slots at different locks.
    error_id: ERR_STALE_TOW_VERSION
    http_status: 412

  - rule_id: tow-adjust-load-stale-tow
    parent_entity: Tow
    write_endpoint: "POST /tows/{tow_id}/adjust-load"
    occ_field: "expected_tow_version"
    description: |
      Light-loading rewrites loaded_tons on every over-draft assignment of the
      tow. The request carries the Tow.version the dispatcher based the decision
      on; if the makeup has advanced since then the adjustment is rejected rather
      than applied to a composition the caller never saw. A repeated adjustment
      against a fresh version is legitimate, so this is not a state precondition.
    error_id: ERR_STALE_TOW_VERSION
    http_status: 412

  - rule_id: invoice-issue-stale-shipper
    parent_entity: Shipper
    write_endpoint: "POST /freight-contracts/{freight_contract_id}/issue-invoice"
    occ_field: "expected_shipper_version"
    description: |
      Issuing an invoice moves the shipper's outstanding balance and may put the
      account on credit hold, so the request carries the Shipper.version the
      biller last observed. When another contract of the same shipper has been
      invoiced, paid, or credited by a claim since that read, the stored version
      is stale and the issue is rejected. Issuing a second, different invoice for
      the same shipper is otherwise perfectly legitimate.
    error_id: ERR_STALE_SHIPPER_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: river_stage_band_resolution
    trigger: "on POST /river-stage-readings (to stamp the reading) and whenever a Tow recomputes its draft profile at POST /tows/{tow_id}/barge-assignments, POST /barge-assignments/{barge_assignment_id}/drop, POST /tows/{tow_id}/adjust-load and POST /tows/{tow_id}/seal"
    algorithm: threshold
    formula: |
      # Band of a single reading. Boundaries are inclusive on the LOWER edge.
      if   stage_feet >= 25.0                     -> band = HIGH_WATER
      elif stage_feet >= 15.0                     -> band = NORMAL
      elif stage_feet >=  8.0                     -> band = LOW
      else                                        -> band = CRITICAL
      max_draft_feet      = BAND_MAX_DRAFT_FEET[band]
      tow_size_cap_barges = BAND_TOW_SIZE_CAP[band]

      # Controlling reading for a Tow (selector - fully pinned):
      #   eligibility filter : RiverStageReading.gauge_station == Tow.controlling_gauge_station
      #                        AND RiverStageReading.reading_at <= logical_clock_now
      #   ranking expression : reading_at DESC
      #   tie-break          : created_at DESC
      #   empty candidate set: reject the caller with ERR_NO_RIVER_STAGE_READING
      controlling_reading = first(sort(candidates, key=(reading_at DESC, created_at DESC)))
    input_set: "RiverStageReading rows for the tow's controlling_gauge_station whose reading_at is at or before the logical clock. Readings dated in the future are excluded."
    constants:
      BAND_MAX_DRAFT_FEET: { HIGH_WATER: 12.0, NORMAL: 12.0, LOW: 10.5, CRITICAL: 9.0 }
      BAND_TOW_SIZE_CAP: { HIGH_WATER: 20, NORMAL: 40, LOW: 30, CRITICAL: 6 }
    precision: "stage_feet compared at 1 decimal place; max_draft_feet carried at 1 decimal place"

  - name: barge_draft_and_tow_profile
    trigger: "on POST /tows/{tow_id}/barge-assignments, POST /barge-assignments/{barge_assignment_id}/drop, POST /tows/{tow_id}/adjust-load and POST /tows/{tow_id}/seal"
    algorithm: constraint_propagation
    formula: |
      # Step 1 - per assignment, independent of every other assignment.
      barge_draft_feet(a) = round_half_up(
          a.barge.light_draft_feet + a.loaded_tons / (a.barge.tons_per_inch_immersion * 12), 2)

      # Step 2 - tow rollup over ACTIVE assignments only.
      ACTIVE = { a : a.tow_id == tow.id AND a.status IN {PLANNED, CONFIRMED, LOADED} }
      tow.barge_count       = count(ACTIVE)
      tow.total_loaded_tons  = sum(a.loaded_tons for a in ACTIVE)
      tow.max_draft_feet     = max(barge_draft_feet(a) for a in ACTIVE)   # 0 when ACTIVE is empty

      # Step 3 - band lookup (river_stage_band_resolution) writes
      #          tow.draft_restriction_band and tow.allowed_draft_feet.

      # Step 4 - light-loading allowance, used only by POST /tows/{tow_id}/adjust-load.
      allowed_tons(a) = floor(
          (tow.allowed_draft_feet - a.barge.light_draft_feet) * 12 * a.barge.tons_per_inch_immersion)
      # adjust-load sets a.loaded_tons = min(a.loaded_tons, allowed_tons(a)) for every ACTIVE a,
      # in ascending cut_position order, then repeats steps 1-3.

      # Evaluation order is pinned: per-barge rounding happens BEFORE the max in
      # step 2, so the tow's max_draft_feet is the maximum of rounded values, not
      # the rounding of a maximum.
    input_set: "BargeAssignment rows of the tow whose status IN {PLANNED, CONFIRMED, LOADED}. DROPPED and DISCHARGED assignments never contribute."
    constants:
      INCHES_PER_FOOT: 12
    precision: "barge_draft_feet and max_draft_feet at 2 decimal places, round_half_up; allowed_tons floored to a whole ton"
    variants:
      - name: empty_tow
        when: "the ACTIVE set is empty (a fresh tow, or every assignment dropped)"
        difference: "max_draft_feet, total_loaded_tons and barge_count are all 0 rather than undefined; a seal attempt is still refused because barge_count >= 1 fails first"

  - name: cleaning_requirement_and_fee
    trigger: "on POST /barges/{barge_id}/cleaning-orders (to fix required_cleaning_level), on POST /cleaning-orders/{cleaning_order_id}/complete (to fix fee_cents), on POST /tows/{tow_id}/barge-assignments and on POST /tows/{tow_id}/seal (to gate the barge)"
    algorithm: constraint_propagation
    formula: |
      prior_group = barge.last_cargo_commodity_id is null
                      ? null
                      : Commodity[barge.last_cargo_commodity_id].commodity_group
      next_group  = Commodity[target commodity].commodity_group

      if prior_group is null:
          required_cleaning_level = NONE ; prohibited = false
      else:
          rule = CompatibilityRule with prior_commodity_group == prior_group
                                    AND next_commodity_group == next_group
          if rule is missing:
              required_cleaning_level = DEFAULT_REQUIRED_LEVEL ; prohibited = false
          else:
              required_cleaning_level = rule.required_cleaning_level
              prohibited              = rule.prohibited

      # Gate applied at assignment creation and again at seal:
      #   prohibited                                          -> ERR_CARGO_INCOMPATIBLE
      #   CLEANLINESS_RANK[barge.cleanliness_status]
      #        < REQUIRED_LEVEL_RANK[required_cleaning_level]  -> ERR_BARGE_CLEANLINESS_INSUFFICIENT

      # Fee, fixed only when a CleaningOrder completes with inspection_passed == true:
      fee_cents = CLEANING_FEE_CENTS[performed_level]
      # A completion with inspection_passed == false leaves fee_cents at 0.
    input_set: "The single CompatibilityRule row matching the ordered pair (prior_group, next_group). At most one row may exist per ordered pair."
    constants:
      DEFAULT_REQUIRED_LEVEL: WASH
      CLEANLINESS_RANK: { DIRTY: 0, SWEPT: 1, WASHED: 2, STEAM_CERTIFIED: 3 }
      REQUIRED_LEVEL_RANK: { NONE: 0, SWEEP: 1, WASH: 2, STEAM_CERT: 3 }
      CLEANLINESS_LEVEL_TO_STATUS: { NONE: DIRTY, SWEEP: SWEPT, WASH: WASHED, STEAM_CERT: STEAM_CERTIFIED }
      CLEANING_FEE_CENTS: { NONE: 0, SWEEP: 45000, WASH: 180000, STEAM_CERT: 420000 }
    precision: "whole cents"

  - name: lock_transit_window
    trigger: "on POST /lock-reservations and again on POST /lock-reservations/{lock_reservation_id}/reschedule"
    algorithm: interval_merge
    formula: |
      cut_count          = max(1, ceil(tow.barge_count / lock.chamber_capacity_barges))
      scheduled_start_at = requested_start_at
      scheduled_end_at   = scheduled_start_at + cut_count * lock.cycle_minutes minutes
      occupied_until_at  = scheduled_end_at   + lock.turnback_buffer_minutes minutes

      # Chamber occupation is the half-open interval
      #     [scheduled_start_at, occupied_until_at)
      # Two reservations on the same lock CONFLICT iff
      #     A.scheduled_start_at < B.occupied_until_at
      #     AND B.scheduled_start_at < A.occupied_until_at
      # Touching endpoints (A.scheduled_start_at == B.occupied_until_at) do NOT
      # conflict. Conflict is evaluated pairwise against reservations whose
      # status IN {GRANTED, IN_CHAMBER}; REQUESTED reservations never block.
      # Checked at creation and re-checked at grant.
    input_set: "LockReservation rows on the same lock_id whose status IN {GRANTED, IN_CHAMBER}, excluding the row being evaluated."
    constants:
      MIN_CUT_COUNT: 1
    precision: "whole minutes"

  - name: lock_delay_attribution
    trigger: "on POST /lock-reservations/{lock_reservation_id}/clear and on POST /locks/{lock_id}/set-status with status == CLOSED"
    algorithm: aggregation
    formula: |
      # On clear:
      delay_minutes = max(0, floor((actual_end_at - scheduled_end_at) / 60 seconds))
      # On closure of a lock, every cancelled reservation contributes:
      delay_minutes = LOCK_CLOSURE_DELAY_MINUTES

      # Hop 1 - tow
      tow.accrued_delay_minutes += delay_minutes
      if tow.status == UNDERWAY and tow.accrued_delay_minutes >= TOW_DELAY_STATUS_MINUTES:
          tow.status = DELAYED
          # Hop 2 - assignments, in ascending cut_position order
          for a in BargeAssignment where a.tow_id == tow.id and a.status == LOADED:
              a.delay_attributed_minutes += delay_minutes
          # Hop 3 - contracts, each distinct contract touched once, in ascending
          #         FreightContract.created_at order
          for c in distinct contracts of those assignments:
              c.accrued_delay_minutes += delay_minutes
              # Hop 4 - contractual laytime protection, granted at most once
              if c.accrued_delay_minutes >= CONTRACT_DELAY_PROTECTION_MINUTES
                 and c.delay_protection_applied == false:
                  c.laytime_hours += CONTRACT_DELAY_PROTECTION_LAYTIME_HOURS
                  c.delay_protection_applied = true
      # When the tow is not UNDERWAY, only hop 1 runs.
    input_set: "BargeAssignment rows of the tow whose status == LOADED, and the distinct FreightContract rows those assignments name."
    constants:
      TOW_DELAY_STATUS_MINUTES: 120
      CONTRACT_DELAY_PROTECTION_MINUTES: 150
      CONTRACT_DELAY_PROTECTION_LAYTIME_HOURS: 12
      LOCK_CLOSURE_DELAY_MINUTES: 240
    precision: "whole minutes, truncated toward zero"

  - name: fleeting_fee_assessment
    trigger: "on POST /fleeting-assignments (estimated_fee_cents), on POST /fleeting-assignments/{fleeting_assignment_id}/release and on POST /tows/{tow_id}/depart (billable_days and fee_cents)"
    algorithm: threshold
    formula: |
      estimated_fee_cents = max(1, ceil((end_at      - start_at) / 86400 seconds))
                            * berth.daily_fee_cents_per_barge + berth.switch_fee_cents
      billable_days       = max(1, ceil((released_at - start_at) / 86400 seconds))
      fee_cents           = billable_days * berth.daily_fee_cents_per_barge
                            + berth.switch_fee_cents

      # Berth aggregate-capacity admission test, evaluated at reservation time:
      #   For the candidate interval [start_at, end_at) and the set S of
      #   FleetingAssignment rows on the same berth with status == RESERVED,
      #   let BOUNDARIES be the sorted set of every start_at in S union
      #   {candidate.start_at} that falls inside [candidate.start_at, candidate.end_at).
      #   For each instant t in BOUNDARIES:
      #       occupancy(t) = 1 + count(s in S : s.start_at <= t < s.end_at)
      #   Reject with ERR_BERTH_CAPACITY_EXCEEDED iff
      #       max over t of occupancy(t) > berth.capacity_barges
      #   Intervals are closed on the left and open on the right, so an
      #   assignment ending exactly at t does not occupy the berth at t. This is
      #   an aggregate head-count test, not a pairwise overlap test: any number
      #   of assignments may overlap while occupancy stays within capacity.
    input_set: "FleetingAssignment rows on the same fleeting_berth_id whose status == RESERVED. RELEASED and CANCELLED rows never occupy the berth."
    constants:
      SECONDS_PER_DAY: 86400
      MIN_BILLABLE_DAYS: 1
    precision: "whole days rounded up; whole cents"

  - name: linehaul_freight_charge
    trigger: "on GET /freight-contracts/{freight_contract_id}/charge-breakdown and on POST /freight-contracts/{freight_contract_id}/issue-invoice"
    algorithm: tiered_pricing
    formula: |
      rate            = contract.pinned_tariff_filing.base_rate_cents_per_ton_mile
      distance_miles  = abs(contract.destination_mile - contract.origin_mile)

      # ROUNDING ORDER IS PINNED: round every line to whole cents FIRST, then sum.
      # "Sum the raw line values and round once" is explicitly NOT the rule and
      # yields a different total.
      line_cents(a)   = round_half_up(tons_of(a) * distance_miles * rate, 0)
      raw_linehaul    = sum(line_cents(a) for a in LINES)      # already whole cents

      # Minimum charge is a contract-level floor applied AFTER the sum, and only
      # when at least one billable line exists.
      linehaul_cents  = count(LINES) == 0
                          ? 0
                          : max(raw_linehaul, contract.pinned_tariff_filing.min_charge_cents)

      # Lines are enumerated in ascending cut_position order; the order does not
      # change the sum but pins the audit trail.
    input_set: "Depends on the variant - see variants. Assignments with status DROPPED are excluded from both variants."
    constants:
      ROUNDING: round_half_up
    precision: "each line rounded to whole cents with round_half_up, then summed"
    variants:
      - name: provisional
        when: "GET /freight-contracts/{freight_contract_id}/charge-breakdown with variant omitted or variant == PROVISIONAL"
        difference: "LINES = BargeAssignment rows of the contract whose status IN {CONFIRMED, LOADED, DISCHARGED}; tons_of(a) = a.loaded_tons (the bill-of-lading weight)"
      - name: final
        when: "GET /freight-contracts/{freight_contract_id}/charge-breakdown with variant == FINAL, and always at POST /freight-contracts/{freight_contract_id}/issue-invoice"
        difference: "LINES = BargeAssignment rows of the contract whose discharge_status IN {COMPLETED, DISPUTED}; tons_of(a) = a.discharged_tons (the outturn weight)"

  - name: fuel_surcharge_assessment
    trigger: "on POST /freight-contracts/{freight_contract_id}/activate (pins the percentage) and on both variants of the charge breakdown"
    algorithm: threshold
    formula: |
      # Step A - pick the controlling posting at ACTIVATION time (selector pinned):
      #   eligibility filter : FuelIndexPosting.posting_date <= date(logical_clock_now)
      #   ranking expression : posting_date DESC
      #   tie-break          : created_at DESC
      #   empty candidate set: reject with ERR_NO_FUEL_INDEX_POSTING
      pinned_fuel_price_cents_per_gallon = controlling_posting.diesel_price_cents_per_gallon

      # Step B - pick the tier from the pinned filing's table. Selection is the
      # HIGHEST tier whose threshold is LESS THAN OR EQUAL TO the pinned price.
      # A price exactly equal to a threshold selects that tier, not the one below.
      applicable = { t in fuel_surcharge_table : t.threshold_cents_per_gallon <= price }
      pinned_fuel_surcharge_pct = applicable empty
                                    ? 0.0
                                    : max(applicable, key=threshold_cents_per_gallon).pct

      # Step C - the surcharge applies to the LINEHAUL ONLY, never to demurrage,
      # fleeting, cleaning or the rebate.
      fuel_surcharge_cents = round_half_up(linehaul_cents * pinned_fuel_surcharge_pct, 0)
    input_set: "FuelIndexPosting rows with posting_date at or before the logical clock date at the moment of activation. Postings created after activation never affect an already-activated contract."
    constants:
      DEFAULT_PCT_WHEN_BELOW_ALL_TIERS: 0.0
    precision: "whole cents, round_half_up"

  - name: demurrage_assessment
    trigger: "on POST /barge-assignments/{barge_assignment_id}/finish-unload (fixes the per-assignment laytime hours) and on both variants of the charge breakdown"
    algorithm: chronological
    formula: |
      # Per-assignment laytime clocks, fixed at finish-unload:
      gross_laytime_hours(a) = ceil((a.unload_finished_at - a.arrived_at)        / 3600 seconds)
      net_laytime_hours(a)   = ceil((a.unload_finished_at - a.unload_started_at) / 3600 seconds)

      # The two variants below are BOTH defensible readings of the same charter
      # language and produce different totals from identical timestamps.
      # The scaffold pins which one is billed: FINAL.
      rate = contract.pinned_tariff_filing.demurrage_rate_cents_per_hour
    input_set: "BargeAssignment rows of the contract whose discharge_status IN {COMPLETED, DISPUTED}. Assignments still UNLOADING, ARRIVED or NOT_ARRIVED contribute nothing to either variant."
    constants:
      NOTICE_GRACE_HOURS: 6
    precision: "laytime rounded UP to whole hours per assignment before any comparison; cents are exact integers"
    variants:
      - name: per_barge_gross
        when: "GET /freight-contracts/{freight_contract_id}/charge-breakdown with variant omitted or variant == PROVISIONAL"
        difference: |
          Each barge carries its OWN free-laytime allowance and the clock starts
          the moment the barge is tendered:
            chargeable(a) = max(0, gross_laytime_hours(a) - contract.laytime_hours)
            demurrage_cents = sum(chargeable(a)) * rate
          A barge that finishes early cannot lend its unused hours to a sister barge.
      - name: pooled_net
        when: "GET /freight-contracts/{freight_contract_id}/charge-breakdown with variant == FINAL, and always at POST /freight-contracts/{freight_contract_id}/issue-invoice"
        difference: |
          Free laytime is POOLED across the contract's discharged barges and the
          clock only runs while cargo is actually moving, plus a fixed notice grace:
            used   = sum(net_laytime_hours(a) + NOTICE_GRACE_HOURS)
            pooled = contract.laytime_hours * count(LINES)
            demurrage_cents = max(0, used - pooled) * rate
          Unused hours on one barge absorb overrun on another.

  - name: contract_total_charge
    trigger: "on GET /freight-contracts/{freight_contract_id}/charge-breakdown and on POST /freight-contracts/{freight_contract_id}/issue-invoice"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED. The rebate reads like a percentage of "the
      # invoice total", which would be circular; it is not. The tier is selected
      # on subtotal_cents, which excludes both the rebate and any claim credit.
      #
      # 1. subtotal_cents = linehaul_cents
      #                   + fuel_surcharge_cents
      #                   + fleeting_fee_cents
      #                   + cleaning_fee_cents
      #                   + demurrage_cents
      # 2. tier selection on subtotal_cents (highest tier whose floor is <= subtotal):
      #      subtotal_cents <  1000000              -> pct 0.000
      #      1000000 <= subtotal_cents <  5000000   -> pct 0.015
      #      subtotal_cents >= 5000000              -> pct 0.030
      # 3. volume_rebate_cents = round_half_up(subtotal_cents * pct, 0)
      # 4. total_cents = max(0, subtotal_cents - volume_rebate_cents - claim_credit_cents)
      #
      # claim_credit_cents is applied in step 4 ONLY. An approved claim never
      # moves the rebate tier, because subtotal_cents was frozen at invoice issue.

      fleeting_fee_cents = sum(fa.fee_cents      for fa in FLEETING_LINES)
      cleaning_fee_cents = sum(co.fee_cents      for co in CLEANING_LINES)
      # CLEANING_LINES = CleaningOrder rows with freight_contract_id == contract.id
      #                  and status == COMPLETED.
    input_set: "The five charge buckets of the same variant, plus the contract's claim_credit_cents at the moment of evaluation."
    constants:
      REBATE_TIERS: [{ subtotal_floor_cents: 0, pct: 0.0 }, { subtotal_floor_cents: 1000000, pct: 0.015 }, { subtotal_floor_cents: 5000000, pct: 0.03 }]
    precision: "whole cents; the rebate is rounded once, after the subtotal is complete"
    variants:
      - name: provisional
        when: "GET /freight-contracts/{freight_contract_id}/charge-breakdown with variant omitted or variant == PROVISIONAL"
        difference: "FLEETING_LINES = FleetingAssignment rows with this freight_contract_id whose status IN {RESERVED, RELEASED}, contributing estimated_fee_cents when RESERVED and fee_cents when RELEASED; the linehaul and demurrage buckets use their provisional variants"
      - name: final
        when: "POST /freight-contracts/{freight_contract_id}/issue-invoice, and GET with variant == FINAL"
        difference: "FLEETING_LINES = FleetingAssignment rows with this freight_contract_id whose status == RELEASED, contributing fee_cents; the linehaul and demurrage buckets use their final variants"

  - name: claim_settlement_assessment
    trigger: "on POST /cargo-claims/{cargo_claim_id}/assess (computes both variants) and on POST /cargo-claims/{cargo_claim_id}/approve (selects one)"
    algorithm: weighted_scoring
    formula: |
      a = the named BargeAssignment
      unit_value = contract.declared_value_cents_per_ton

      shortage_tons = claim.claim_type == SHORTAGE
                        ? (a.loaded_tons - a.discharged_tons)
                        : claim.claimed_tons
      tolerance_tons = round_half_up(a.loaded_tons * TRADE_TOLERANCE_PCT, 3)

      # Both variants are computed and stored at assessment. The contract's
      # claim_settlement_basis decides which one is paid at approval.
      settlement_cents = contract.claim_settlement_basis == FRANCHISE
                           ? settlement_franchise_cents
                           : settlement_deductible_cents
    input_set: "Exactly one BargeAssignment, the one named by the claim, which must belong to the claim's contract and have discharge_status IN {COMPLETED, DISPUTED}."
    constants:
      TRADE_TOLERANCE_PCT: 0.005
      CLAIM_FILING_WINDOW_DAYS: 30
      MAX_CLAIM_REVISION_ROUNDS: 2
    precision: "tolerance_tons at 3 decimal places, round_half_up; cents whole, round_half_up; both variants capped at claimed_amount_cents"
    variants:
      - name: deductible
        when: "always computed at assessment; paid when contract.claim_settlement_basis == DEDUCTIBLE"
        difference: |
          The tolerance is a DEDUCTIBLE subtracted from the loss in tons:
            compensable_tons = max(0, shortage_tons - tolerance_tons)
            settlement_deductible_cents =
                min(claim.claimed_amount_cents,
                    round_half_up(compensable_tons * unit_value, 0))
      - name: franchise
        when: "always computed at assessment; paid when contract.claim_settlement_basis == FRANCHISE"
        difference: |
          The tolerance is a FRANCHISE - an all-or-nothing trigger. Once the loss
          exceeds it, the whole loss is compensable:
            compensable_tons = shortage_tons > tolerance_tons ? shortage_tons : 0
            settlement_franchise_cents =
                min(claim.claimed_amount_cents,
                    round_half_up(compensable_tons * unit_value, 0))

  - name: contract_credit_projection
    trigger: "on POST /freight-contracts/{freight_contract_id}/activate"
    algorithm: forward_looking
    formula: |
      distance_miles         = abs(contract.destination_mile - contract.origin_mile)
      estimated_charge_cents = round_half_up(
          contract.contracted_tons * distance_miles
          * pinned_tariff.base_rate_cents_per_ton_mile, 0)
      # The projection uses CONTRACTED tonnage, not any assignment tonnage,
      # because no barge is assigned yet at activation time.
      reject with ERR_SHIPPER_CREDIT_EXCEEDED when
          shipper.outstanding_balance_cents + estimated_charge_cents
              > shipper.credit_limit_cents
    input_set: "The single Shipper row named by the contract, at its balance as of the activation request."
    constants:
      ROUNDING: round_half_up
    precision: "whole cents, round_half_up"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the first failing rule decides the response)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID request headers are both present and X-User-Role names a role declared in the RBAC matrix"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the caller's role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "request body carries every required field, every enum value is a declared member, every numeric field satisfies its declared range, and every datetime parses as ISO 8601"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 4
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 5
    category: existence
    check: "every resource named by a path segment exists, validated left to right"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row, validated in the order the fields are declared in the endpoint's input list"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints carrying foreign keys"

  - priority: 7
    category: auth
    check: "for entity_backed roles the caller's X-User-ID equals the ownership field of the target resource - LockMaster against LockReservation.lock_id or Lock.id, Shipper against the contract's shipper_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /lock-reservations/{lock_reservation_id}/grant, POST /lock-reservations/{lock_reservation_id}/deny, POST /lock-reservations/{lock_reservation_id}/reschedule, POST /locks/{lock_id}/set-status, POST /cargo-claims, POST /cargo-claims/{cargo_claim_id}/withdraw"

  - priority: 8
    category: auth
    check: "the caller's X-User-ID differs from the identity recorded for the preceding step - TariffFiling.filed_by_user_id at effectuation, CargoClaim.assessed_by_user_id at approval or denial"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /tariff-filings/{tariff_filing_id}/effectuate, POST /cargo-claims/{cargo_claim_id}/approve, POST /cargo-claims/{cargo_claim_id}/deny"

  - priority: 9
    category: state
    check: "the target resource is in a state from which the requested transition is declared in the state machine table, including the state of the barge (operational_status) when it is being fleeted or assigned"
    error_id: "ERR_<ENTITY>_INVALID_STATE or ERR_BARGE_NOT_AVAILABLE"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 10
    category: state
    check: "expected_tow_version equals Tow.version, or expected_shipper_version equals Shipper.version"
    error_id: "ERR_STALE_TOW_VERSION or ERR_STALE_SHIPPER_VERSION"
    http_status: 412
    applies_to: "POST /lock-reservations, POST /tows/{tow_id}/adjust-load, POST /freight-contracts/{freight_contract_id}/issue-invoice"

  - priority: 11
    category: business_safety
    check: "the CompatibilityRule for (barge prior cargo group, contract commodity group) does not carry prohibited == true"
    error_id: ERR_CARGO_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /tows/{tow_id}/barge-assignments, POST /tows/{tow_id}/seal"

  - priority: 12
    category: business_safety
    check: "CLEANLINESS_RANK[barge.cleanliness_status] >= REQUIRED_LEVEL_RANK[required_cleaning_level] for the target commodity"
    error_id: ERR_BARGE_CLEANLINESS_INSUFFICIENT
    http_status: 422
    applies_to: "POST /tows/{tow_id}/barge-assignments, POST /tows/{tow_id}/seal"

  - priority: 13
    category: business_temporal
    check: "a RiverStageReading exists for the tow's controlling_gauge_station with reading_at at or before the logical clock"
    error_id: ERR_NO_RIVER_STAGE_READING
    http_status: 422
    applies_to: "POST /tows/{tow_id}/seal, POST /tows/{tow_id}/adjust-load"

  - priority: 14
    category: business_safety
    check: "Tow.max_draft_feet is at or below the controlling river stage band's max_draft_feet"
    error_id: ERR_DRAFT_EXCEEDS_RESTRICTION
    http_status: 422
    applies_to: "POST /tows/{tow_id}/seal"

  - priority: 15
    category: business_safety
    check: "Tow.barge_count is at or below the controlling river stage band's tow_size_cap_barges"
    error_id: ERR_TOW_SIZE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /tows/{tow_id}/seal"

  - priority: 16
    category: business_safety
    check: "loaded_tons does not exceed the barge's capacity_tons"
    error_id: ERR_BARGE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /tows/{tow_id}/barge-assignments"

  - priority: 17
    category: business_temporal
    check: "an EFFECTIVE TariffFiling for the contract's commodity group has effective_from <= logical clock <= effective_to"
    error_id: ERR_NO_EFFECTIVE_TARIFF
    http_status: 422
    applies_to: "POST /freight-contracts/{freight_contract_id}/activate"

  - priority: 18
    category: business_temporal
    check: "a FuelIndexPosting exists with posting_date at or before the logical clock date"
    error_id: ERR_NO_FUEL_INDEX_POSTING
    http_status: 422
    applies_to: "POST /freight-contracts/{freight_contract_id}/activate"

  - priority: 19
    category: business_temporal
    check: "no other EFFECTIVE TariffFiling for the same commodity_group has an effective window overlapping this filing's window, other than the filing this one supersedes"
    error_id: ERR_TARIFF_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /tariff-filings/{tariff_filing_id}/effectuate"

  - priority: 20
    category: business_temporal
    check: "the reservation's [scheduled_start_at, occupied_until_at) window does not overlap the window of another reservation on the same lock whose status IN {GRANTED, IN_CHAMBER}"
    error_id: ERR_LOCK_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /lock-reservations, POST /lock-reservations/{lock_reservation_id}/grant"

  - priority: 21
    category: business_temporal
    check: "berth occupancy over [start_at, end_at) never exceeds capacity_barges when the candidate assignment is added"
    error_id: ERR_BERTH_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /fleeting-assignments"

  - priority: 22
    category: business_temporal
    check: "unload_started_at >= arrived_at, unload_finished_at >= unload_started_at, released_at >= start_at, actual_end_at >= actual_start_at and arrived_at >= departed_at"
    error_id: ERR_UNLOAD_SEQUENCE_INVALID
    http_status: 422
    applies_to: "POST /barge-assignments/{barge_assignment_id}/start-unload, POST /barge-assignments/{barge_assignment_id}/finish-unload, POST /fleeting-assignments/{fleeting_assignment_id}/release, POST /lock-reservations/{lock_reservation_id}/clear, POST /tows/{tow_id}/arrive"

  - priority: 23
    category: business_temporal
    check: "the logical clock is no more than CLAIM_FILING_WINDOW_DAYS after the assignment's unload_finished_at"
    error_id: ERR_CLAIM_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /cargo-claims"

  - priority: 24
    category: business_constraint
    check: "Lock.status != CLOSED"
    error_id: ERR_LOCK_CLOSED
    http_status: 409
    applies_to: "POST /lock-reservations, POST /lock-reservations/{lock_reservation_id}/grant, POST /lock-reservations/{lock_reservation_id}/enter-chamber"

  - priority: 25
    category: business_constraint
    check: "cut_position is not already used by a non-DROPPED assignment of the same tow"
    error_id: ERR_DUPLICATE_CUT_POSITION
    http_status: 409
    applies_to: "POST /tows/{tow_id}/barge-assignments"

  - priority: 26
    category: business_constraint
    check: "the barge does not already hold a BargeAssignment whose status IN {PLANNED, CONFIRMED, LOADED} on any tow"
    error_id: ERR_BARGE_ALREADY_ASSIGNED
    http_status: 409
    applies_to: "POST /tows/{tow_id}/barge-assignments"

  - priority: 27
    category: business_constraint
    check: "hull_number is unique across Barge and code is unique across Commodity"
    error_id: ERR_DUPLICATE_HULL_NUMBER
    http_status: 409
    applies_to: "POST /barges, POST /commodities"

  - priority: 28
    category: business_constraint
    check: "no CargoClaim whose status is not WITHDRAWN and not DENIED already exists for the named barge_assignment_id"
    error_id: ERR_CLAIM_ALREADY_FILED
    http_status: 409
    applies_to: "POST /cargo-claims"

  - priority: 29
    category: business_constraint
    check: "CargoClaim.revision_round < MAX_CLAIM_REVISION_ROUNDS"
    error_id: ERR_CLAIM_REVISION_LIMIT
    http_status: 409
    applies_to: "POST /cargo-claims/{cargo_claim_id}/request-info"

  - priority: 30
    category: business_referential
    check: "the named BargeAssignment's freight_contract_id equals the claim's freight_contract_id"
    error_id: ERR_ASSIGNMENT_CONTRACT_MISMATCH
    http_status: 409
    applies_to: "POST /cargo-claims"

  - priority: 31
    category: business_referential
    check: "for claim_type == SHORTAGE, claimed_tons <= loaded_tons - discharged_tons on the named assignment, and the assignment's discharge_status IN {COMPLETED, DISPUTED}"
    error_id: ERR_SHORTAGE_NOT_SUPPORTED
    http_status: 422
    applies_to: "POST /cargo-claims"

  - priority: 32
    category: business_referential
    check: "at least one BargeAssignment of the contract has discharge_status IN {COMPLETED, DISPUTED}"
    error_id: ERR_NO_BILLABLE_LINES
    http_status: 422
    applies_to: "POST /freight-contracts/{freight_contract_id}/issue-invoice"

  - priority: 33
    category: business_fiscal
    check: "Shipper.status == ACTIVE"
    error_id: ERR_SHIPPER_ON_CREDIT_HOLD
    http_status: 409
    applies_to: "POST /freight-contracts/{freight_contract_id}/activate"

  - priority: 34
    category: business_fiscal
    check: "Shipper.outstanding_balance_cents + estimated_charge_cents <= Shipper.credit_limit_cents"
    error_id: ERR_SHIPPER_CREDIT_EXCEEDED
    http_status: 402
    applies_to: "POST /freight-contracts/{freight_contract_id}/activate"

  - priority: 35
    category: business_fiscal
    check: "paid_amount_cents equals FreightContract.total_cents exactly"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /freight-contracts/{freight_contract_id}/mark-paid"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:

  # --- logical clock (test-driving surface) --------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock. The clock is the ONLY time source for tariff effectiveness, fuel index selection, river stage selection and claim filing windows. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [WaterwayAdmin]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: string }"
    side_effects: ["repositions the logical clock; no entity is mutated and no version is bumped"]

  # --- shippers -------------------------------------------------------------
  - method: POST
    path: "/shippers"
    description: "Opens a shipper account."
    roles: [ContractManager]
    code: 201
    input: ["name", "credit_limit_cents"]
    output: Shipper
    side_effects: ["creates Shipper with status ACTIVE, outstanding_balance_cents 0, open_claim_count 0 and version 1"]
  - method: GET
    path: "/shippers/{shipper_id}"
    description: "Reads one shipper, including its current version for optimistic concurrency."
    roles: [WaterwayAdmin, TariffAnalyst, RateAuthority, TowboatDispatcher, LockMaster, HarborAgent, ContractManager, ClaimsAdjuster, Shipper]
    code: 200
    input: []
    output: Shipper
    side_effects: []
  - method: GET
    path: "/shippers"
    description: "Lists shippers."
    roles: [WaterwayAdmin, TariffAnalyst, RateAuthority, TowboatDispatcher, LockMaster, HarborAgent, ContractManager, ClaimsAdjuster, Shipper]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Shipper[]
