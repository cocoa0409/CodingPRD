          - validations.priority_46
          - calculations.net_weight_conversion
          - entities.WeighTag.fields.net_tons
          - state_machines.WeighTag.GROSS_CAPTURED_to_NET_FINAL
        distinguishing_aspect: |
          A different metric (POUNDS on a single tag, not tons across a lane day) and a different
          endpoint (the tare capture). tare == gross is explicitly legal and must produce
          net_weight_lbs 0 and net_tons 0.000 while still moving weigh_status to NET_FINAL;
