            - call: "POST /network/escrow-transactions"
              payload: { capacity_owner_id: "${bco_id}", transaction_type: "ESCROW_DEPOSIT", amount_cents: 250000, effective_at: "2026-09-01T00:00:00Z" }
              as: SettlementOperator
            - call: "POST /network/compliance-documents"
              payload: { capacity_owner_id: "${bco_id}", document_type: "CDL", document_number: "TX-CDL-77201", issued_at: "2026-01-05T00:00:00Z", expires_at: "2027-01-05T00:00:00Z" }
              as: SafetyReviewer
            - call: "POST /network/compliance-documents"
              payload: { capacity_owner_id: "${bco_id}", document_type: "MEDICAL_CARD", document_number: "TX-MC-77201", issued_at: "2026-02-01T00:00:00Z", expires_at: "2027-02-01T00:00:00Z" }
              as: SafetyReviewer
            - call: "POST /network/compliance-documents"
              payload: { capacity_owner_id: "${bco_id}", document_type: "MVR_REPORT", document_number: "TX-MVR-77201", issued_at: "2026-03-01T00:00:00Z", expires_at: "2027-03-01T00:00:00Z" }
              as: SafetyReviewer
            - call: "POST /network/compliance-documents"
              payload: { capacity_owner_id: "${bco_id}", document_type: "DRUG_TEST", document_number: "TX-DT-77201", issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: SafetyReviewer
            - call: "POST /network/compliance-documents"
              payload: { capacity_owner_id: "${bco_id}", document_type: "OA_ENROLLMENT", document_number: "TX-OA-77201", issued_at: "2026-05-01T00:00:00Z", expires_at: "2027-05-01T00:00:00Z" }
