              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND with http 404"
      - name: refill_start_with_expired_batch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_PREP_BATCH_EXPIRED]"]
        distinguishing_aspect: "Refill start after the allocated batch's expires_at has passed (but before any sweep ran) is rejected with ERR_PREP_BATCH_EXPIRED — the batch state check is temporal, not just status-based."
        test_recipe:
          setup:
            - "Restaurant R1; line L1; ingredient ING shelf 30; hopper H1 cap 500 loaded 300; batch B1 READY at 00:00 (expires 00:30); sensor 150 -> task READY allocated 350; clock advanced to 00:45 (batch past expiry, still status READY because no sweep ran)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
