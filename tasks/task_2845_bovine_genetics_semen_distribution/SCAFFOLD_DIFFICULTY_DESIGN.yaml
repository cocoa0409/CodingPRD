            - call: "POST /genetics/sires/${b_id}/health-tests"
              payload: { facility_id: "${fac_id}", test_type: "IBR", sample_date: "2026-08-01", validity_days: 365 }
              as: StaffVeterinarian
              captures: { ht_ibr: "$.data.id" }
            - call: "POST /genetics/sires/${b_id}/health-tests"
              payload: { facility_id: "${fac_id}", test_type: "BVD", sample_date: "2026-08-01", validity_days: 365 }
              as: StaffVeterinarian
              captures: { ht_bvd: "$.data.id" }
            - call: "POST /genetics/sires/${b_id}/health-tests"
              payload: { facility_id: "${fac_id}", test_type: "TRICHOMONIASIS", sample_date: "2026-08-01", validity_days: 365 }
              as: StaffVeterinarian
              captures: { ht_tri: "$.data.id" }
            - call: "POST /genetics/health-tests/${ht_bt}/result"
              payload: { result: "NEGATIVE" }
              as: StaffVeterinarian
              as_user_id: "vet-1"
            - call: "POST /genetics/health-tests/${ht_ibr}/result"
              payload: { result: "NEGATIVE" }
              as: StaffVeterinarian
              as_user_id: "vet-1"
            - call: "POST /genetics/health-tests/${ht_bvd}/result"
              payload: { result: "NEGATIVE" }
              as: StaffVeterinarian
              as_user_id: "vet-1"
            - call: "POST /genetics/health-tests/${ht_tri}/result"
              payload: { result: "NEGATIVE" }
              as: StaffVeterinarian
              as_user_id: "vet-1"
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /genetics/sires/${b_id}/collection-clearance"
              payload: {}
              as: StaffVeterinarian
              as_user_id: "vet-1"
            - call: "POST /genetics/collection-bookings"
              payload: { sire_id: "${b_id}", facility_id: "${fac_id}", start_at: "2026-09-01T08:00:00Z", end_at: "2026-09-01T10:00:00Z" }
              as: FacilityManager
              as_user_id: "${fac_id}"
              captures: { bk_id: "$.data.id" }
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /genetics/collection-bookings/${bk_id}/complete"
              payload: { volume_ml: 6.0, concentration_m_per_ml: 1200, motility_pct: 70.0 }
              as: FacilityManager
              as_user_id: "${fac_id}"
            - call: "GET /genetics/ejaculates"
              payload: { booking_id: "${bk_id}" }
              as: LabTechnician
              captures: { ej_id: "$.data[0].id" }
            - call: "POST /genetics/ejaculates/${ej_id}/qc-evaluation"
              payload: { post_thaw_motility_pct: 55.0, morphology_normal_pct: 82.0, verdict: "ACCEPTED" }
              as: LabTechnician
