      - name: second_statement_for_issued_period_rejected_as_duplicate
        claim_type: Violation → Error
        grounds:
          - "validations[priority=72]"
          - "errors[ERR_STATEMENT_PERIOD_DUPLICATE]"
          - state_machines.ChargebackStatement.DRAFT_to_ISSUED
        distinguishing_aspect: "Once a period's statement is ISSUED it can no longer be superseded: a second create for the same period_start returns 409 ERR_STATEMENT_PERIOD_DUPLICATE (whereas a DRAFT one would have been VOIDed)."
        test_recipe:
          setup: ["ACTIVE lease with an ISSUED statement for May 2026."]
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/buildings/${b1}/spaces"
              payload: { space_code: "S1", floor: 1, area_sqm: 100, space_type: "OFFICE" }
              as: FacilityManager
              captures: { s1: $.data.id }
            - call: "POST /fm/leases"
              payload: { building_id: "${b1}", tenant_name: "Acme", base_rate_per_sqm_month: 10.00, start_date: "2026-05-01T00:00:00Z", end_date: "2027-04-30T23:59:59Z" }
              as: FinanceController
              captures: { l1: $.data.id }
            - call: "POST /fm/leases/${l1}/allocations"
              payload: { space_id: "${s1}", share_pct: 100, effective_from: "2026-05-01T00:00:00Z", effective_to: "2027-04-30T23:59:59Z" }
              as: FinanceController
            - call: "POST /fm/leases/${l1}/activate"
              payload: {}
              as: FinanceController
            - call: "GET /fm/leases/${l1}"
              payload: {}
              as: FinanceController
              captures: { l1_v: $.data.version }
            - call: "POST /fm/leases/${l1}/statements"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-05-31T23:59:59Z", expected_lease_version: "${l1_v}" }
              as: FinanceController
              captures: { st1: $.data.id }
            - call: "POST /fm/statements/${st1}/issue"
              payload: {}
              as: FinanceController
            - call: "GET /fm/leases/${l1}"
              payload: {}
              as: FinanceController
              captures: { l1_v2: $.data.version }
          trigger:
            - call: "POST /fm/leases/${l1}/statements"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-05-31T23:59:59Z", expected_lease_version: "${l1_v2}" }
              as: FinanceController
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err_id} == ERR_STATEMENT_PERIOD_DUPLICATE"
            - "ChargebackStatement.${st1}.status == ISSUED (untouched)"
            - "GET /fm/leases/${l1}/statements returns total_count == 1"

      - name: lease_activate_without_allocation_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Lease.DRAFT_to_ACTIVE
          - "errors[ERR_LEASE_NOT_DRAFT]"
        distinguishing_aspect: "Activation requires at least one ACTIVE allocation: activating an allocation-less DRAFT lease returns 409 ERR_LEASE_NOT_DRAFT and the lease stays DRAFT."
        test_recipe:
          setup: ["One DRAFT lease with no allocations."]
          setup_api_calls:
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/leases"
              payload: { building_id: "${b1}", tenant_name: "Acme", base_rate_per_sqm_month: 10.00, start_date: "2026-05-01T00:00:00Z", end_date: "2027-04-30T23:59:59Z" }
              as: FinanceController
              captures: { l1: $.data.id }
          trigger:
            - call: "POST /fm/leases/${l1}/activate"
              payload: {}
              as: FinanceController
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err_id} == ERR_LEASE_NOT_DRAFT"
            - "Lease.${l1}.status == DRAFT and allocated_area_sqm == 0"

      - name: work_order_on_retired_asset_rejected
        claim_type: Cross-entity validation
        grounds:
          - "validations[priority=52]"
          - "errors[ERR_ASSET_RETIRED]"
          - state_machines.Asset.OUT_OF_SERVICE_to_RETIRED
        distinguishing_aspect: "A work order naming a RETIRED asset is rejected with 409 ERR_ASSET_RETIRED — the retirement check fires ahead of the posture gate because the building is OPEN."
        test_recipe:
          setup: ["A STANDARD asset retired by ops-run (16000 runtime hours, one failure -> condition_score 8.00)."]
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/assets"
              payload: { building_id: "${b1}", asset_tag: "AHU-OLD", category: "HVAC", criticality: "STANDARD", runtime_hours: 16000 }
              as: FacilityManager
              captures: { a1: $.data.id }
            - call: "POST /fm/assets/${a1}/report-failure"
              payload: {}
              as: FacilityManager
            - call: "POST /fm/buildings/${b1}/ops-run"
              payload: {}
              as: FacilityManager
          trigger:
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", asset_id: "${a1}", wo_type: "CORRECTIVE", priority: "P1", estimated_labor_hours: 2, estimated_parts_cost: 0 }
              as: FacilityManager
              captures: { err_id: $.data.error_id }
          assert:
            - "Asset.${a1}.status == RETIRED"
            - "HTTP status is 409 and ${err_id} == ERR_ASSET_RETIRED"

      - name: report_failure_twice_rejected_asset_not_in_service
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Asset.IN_SERVICE_to_OUT_OF_SERVICE
          - "errors[ERR_ASSET_NOT_IN_SERVICE]"
        distinguishing_aspect: "report-failure is declared only from IN_SERVICE: a second call returns 409 ERR_ASSET_NOT_IN_SERVICE and failure_count stays at 1 (no double penalty)."
        test_recipe:
          setup: ["One STANDARD asset already OUT_OF_SERVICE."]
          setup_api_calls:
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/assets"
