# =============================================================================
# PRD-Bench seed tables — Merchandise Allocation & Replenishment (task 2584)
# Difficulty target: beyond Expert (§0.4) — 13 entities, 11 state-machine blocks
# (9 machines, one carrying two parallel dimensions), 2 concurrency rules,
# 15 calculations, 35 ordered validations, 66 endpoints, 51 error codes, 4 roles.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2584. Merchandise Allocation & Replenishment (retail allocation team): initial allocation of new
  receipts across stores using size profiles, store grade and historical sell-through, presentation
  minimum and capacity constraints by fixture and shelf plan, replenishment model selection between
  min-max, demand-driven and push allocation by item type, in-transit and on-order visibility feeding
  future need calculations, store transfer recommendations to rebalance overstock and stockouts with
  freight cost thresholds, promotional and event lift factors overriding baseline forecasts, size-out
  and broken-assortment detection triggering markdown or consolidation, allocation performance
  measurement on in-stock and sell-through by cluster

domain_name: merch-allocation-replenishment
api_prefix: /allocation

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  # graph: Store x Item is materialised as the StorePosition junction; every allocation and
  # transfer is an edge over that junction. TransferRecommendation carries two distinct FKs to
  # Store (from_store_id / to_store_id) plus a self-referential supersedes_recommendation_id,
  # and AllocationRun carries a self-referential supersedes_run_id. URL surface is flat: every
  # entity lives at /allocation/<collection>[/{id}] and children are found by FK filter.

  state_machine_shape: cyclic
  # Item.lifecycle_state cycles ACTIVE -> BROKEN -> ACTIVE and ACTIVE -> SIZE_OUT_WATCH -> ACTIVE;
  # Receipt.status cycles ALLOCATING -> ALLOCATED -> ALLOCATING on recall; AllocationRun cycles
  # DRAFT -> PROPOSED -> DRAFT on revise; StorePosition carries two parallel derived dimensions
  # (stock_status x assortment_status); TransferRecommendation is a branching fork-join.

  relationship_patterns:
    - one_to_many
    - many_to_many        # StorePosition is the Store x Item junction
    - self_referential    # AllocationRun.supersedes_run_id, TransferRecommendation.supersedes_recommendation_id
    - cross_aggregate     # AssortmentAction execution creates a TransferRecommendation

  role_model: segregation_of_duties
  # The operator who proposes an AllocationRun may not commit it; the operator who proposes a
  # TransferRecommendation may not approve it. Physical receipt is StoreOperator-exclusive and
  # scoped to the operator's own store.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: AllocationProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program label, e.g. 'FA26 Core Tops'" }
      - { name: season_code, type: string, source: input, description: "Season identifier, e.g. 'FA26'" }
      - { name: banner_code, type: string, source: input, description: "Retail banner / division code" }
      - { name: status, type: enum, source: system, default: PLANNING, description: "PLANNING | ACTIVE | LOCKED | CLOSED — gates every child write operation", constraints: "enum: PLANNING, ACTIVE, LOCKED, CLOSED" }
      - { name: transfer_min_ratio_bp, type: integer, source: input, default: 15000, description: "Minimum benefit-to-landed-cost ratio in basis points required to approve a REBALANCE transfer (15000 = 1.50x)", constraints: ">= 0" }
      - { name: scorecard_basis, type: enum, source: input, default: UNIT_WEIGHTED, description: "Default variant for cluster scorecards when POST /allocation/performance-snapshots omits basis", constraints: "enum: SIMPLE_AVERAGE, UNIT_WEIGHTED" }
      - { name: total_units_received, type: integer, source: computed, description: "Sum of Receipt.units_received over Receipts with program_id = this program and status IN {STAGED, ALLOCATING, ALLOCATED, CLOSED}" }
      - { name: total_units_committed, type: integer, source: computed, description: "Sum of AllocationLine.units_allocated over lines whose run.status = COMMITTED and line.fulfillment_status IN {PENDING, SHIPPED, RECEIVED}" }
      - { name: open_reserve_units, type: integer, source: computed, description: "= total_units_received - total_units_committed; the DC-side units not yet committed to any store" }
      - { name: locked_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the most recent lock transition; null while never locked" }
      - { name: lock_reason, type: string, source: system, default: null, description: "Reason string carried by the most recent lock transition" }

  - name: Store
    parent: AllocationProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> AllocationProgram.id; owning program" }
      - { name: store_code, type: string, source: input, description: "Store number, unique within program_id", constraints: "unique per (program_id, store_code)" }
      - { name: grade, type: enum, source: input, description: "Store grade A | B | C | D; grade rank A=1, B=2, C=3, D=4 is the pinned tie-break order for allocation remainders", constraints: "enum: A, B, C, D" }
      - { name: grade_index_bp, type: integer, source: input, description: "Demand index in basis points applied to trailing sales in the HISTORICAL_SELL_THROUGH need variant (13000 = 130%)", constraints: ">= 1" }
      - { name: cluster_code, type: string, source: input, description: "Performance cluster the store rolls up to on scorecards" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | REMODEL | CLOSING | CLOSED", constraints: "enum: ACTIVE, REMODEL, CLOSING, CLOSED" }
      - { name: freight_flat_usd, type: number, source: input, description: "Flat outbound freight charged when this store is the transfer donor", constraints: ">= 0, 2 decimals" }
      - { name: historical_sell_through_bp, type: integer, source: input, description: "Trailing-season sell-through in basis points; used as the transfer benefit realisation rate and as the consolidation-target ranking key", constraints: "0..10000" }

  - name: FixturePlan
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store this shelf plan belongs to" }
      - { name: item_class, type: enum, source: input, description: "APPAREL_TOP | APPAREL_BOTTOM | FOOTWEAR | ACCESSORY — the merchandise class the fixture holds", constraints: "enum: APPAREL_TOP, APPAREL_BOTTOM, FOOTWEAR, ACCESSORY" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of the plan's effective interval" }
      - { name: effective_to, type: datetime, source: input, default: null, description: "Exclusive end of the plan's effective interval; null means open-ended (+infinity)" }
      - { name: fixture_count, type: integer, source: input, description: "Number of fixtures dedicated to the class", constraints: ">= 1" }
      - { name: facings_per_fixture, type: integer, source: input, description: "Facings per fixture", constraints: ">= 1" }
      - { name: units_per_facing, type: integer, source: input, description: "Units that physically fit on one facing", constraints: ">= 1" }
      - { name: capacity_units, type: integer, source: computed, description: "= fixture_count * facings_per_fixture * units_per_facing" }
      - { name: presentation_min_units, type: integer, source: input, description: "Minimum units required for a presentable set of this class in this store", constraints: ">= 0 and <= capacity_units" }

  - name: SizeProfile
    parent: AllocationProgram
    common_fields: false
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> AllocationProgram.id; owning program" }
      - { name: profile_code, type: string, source: input, description: "Profile label, e.g. 'TOP-4SZ'" }
      - { name: item_class, type: enum, source: input, description: "Merchandise class the curve applies to", constraints: "enum: APPAREL_TOP, APPAREL_BOTTOM, FOOTWEAR, ACCESSORY" }
      - { name: size_curve, type: array, source: input, description: "Ordered array of { size_code: string, share_bp: integer }; share_bp values MUST sum to exactly 10000", constraints: "length >= 1; sum(share_bp) == 10000; size_code unique" }
      - { name: core_size_min_share_bp, type: integer, source: input, default: 1500, description: "A size is a CORE size when its share_bp >= this value (inclusive); non-core sizes never contribute to broken-assortment detection", constraints: ">= 0" }
      - { name: size_count, type: integer, source: computed, description: "= length of size_curve" }
      - { name: core_size_count, type: integer, source: computed, description: "= count of size_curve entries with share_bp >= core_size_min_share_bp; may be 0" }

  - name: Item
    parent: AllocationProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> AllocationProgram.id; owning program" }
      - { name: sku_code, type: string, source: input, description: "SKU identifier, unique within program_id", constraints: "unique per (program_id, sku_code)" }
      - { name: style_code, type: string, source: input, description: "Style the SKU rolls up to" }
      - { name: item_class, type: enum, source: input, description: "Merchandise class; MUST equal the referenced SizeProfile.item_class", constraints: "enum: APPAREL_TOP, APPAREL_BOTTOM, FOOTWEAR, ACCESSORY" }
      - { name: item_type, type: enum, source: input, description: "BASIC | SEASONAL | FASHION — drives replenishment model resolution", constraints: "enum: BASIC, SEASONAL, FASHION" }
      - { name: size_profile_id, type: string, source: input, description: "FK -> SizeProfile.id; size curve used to split allocations and to detect broken assortments" }
      - { name: unit_cost_usd, type: number, source: input, description: "Landed unit cost", constraints: ">= 0, 2 decimals" }
      - { name: retail_price_usd, type: number, source: input, description: "Ticket retail price; drives transfer benefit", constraints: ">= 0, 2 decimals" }
      - { name: replenishment_model_override, type: enum, source: input, default: null, description: "Operator override for the resolved model; null means resolve from item_type", constraints: "enum: MIN_MAX, DEMAND_DRIVEN, PUSH, null" }
      - { name: replenishment_model, type: enum, source: computed, description: "MIN_MAX | DEMAND_DRIVEN | PUSH — resolved by calculations.replenishment_model_resolution", constraints: "enum: MIN_MAX, DEMAND_DRIVEN, PUSH" }
      - { name: lifecycle_state, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SIZE_OUT_WATCH | BROKEN | CONSOLIDATION_PENDING | MARKDOWN", constraints: "enum: ACTIVE, SIZE_OUT_WATCH, BROKEN, CONSOLIDATION_PENDING, MARKDOWN" }
      - { name: broken_store_count, type: integer, source: computed, description: "Count of StorePosition rows with item_id = this item and assortment_status = BROKEN" }
      - { name: size_out_store_count, type: integer, source: computed, description: "Count of StorePosition rows with item_id = this item and assortment_status = SIZE_OUT_RISK" }

  - name: StorePosition
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; junction leg 1" }
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; junction leg 2" }
      - { name: on_hand_units, type: integer, source: input, description: "Physical units in the store; mutated only by declared side effects after creation", constraints: ">= 0" }
      - { name: size_on_hand, type: array, source: input, description: "Array of { size_code: string, units: integer }; sum(units) MUST equal on_hand_units and every size_code MUST exist in the item's SizeProfile.size_curve", constraints: "sum(units) == on_hand_units" }
      - { name: on_order_units, type: integer, source: input, default: 0, description: "Units on an open purchase order not yet at the DC; visible to the FORWARD_LOOKING need variant only", constraints: ">= 0" }
      - { name: in_transit_units, type: integer, source: computed, description: "= sum(AllocationLine.units_allocated where line.store_id = store_id, line.fulfillment_status = SHIPPED, line's item = item_id) + sum(TransferRecommendation.units where to_store_id = store_id, item_id = item_id, status = DISPATCHED)" }
      - { name: reserved_out_units, type: integer, source: computed, description: "= sum(TransferRecommendation.units where from_store_id = store_id, item_id = item_id, status IN {APPROVED, DISPATCHED})" }
      - { name: available_units, type: integer, source: computed, description: "= on_hand_units - reserved_out_units" }
      - { name: min_units, type: integer, source: input, description: "Min-max model floor", constraints: ">= 0" }
      - { name: max_units, type: integer, source: input, description: "Min-max model ceiling", constraints: ">= min_units" }
      - { name: weekly_forecast_units, type: integer, source: input, description: "Baseline weekly unit forecast; promo lift multiplies this in the FORWARD_LOOKING variant", constraints: ">= 0" }
      - { name: trailing_4wk_sales_units, type: integer, source: input, description: "Units sold in the trailing 4 weeks; sole demand source for the HISTORICAL_SELL_THROUGH variant", constraints: ">= 0" }
      - { name: stock_status, type: enum, source: computed, description: "STOCKOUT | LOW | IN_STOCK | OVERSTOCK — first parallel dimension, derived from available_units vs min_units/max_units", constraints: "enum: STOCKOUT, LOW, IN_STOCK, OVERSTOCK" }
      - { name: assortment_status, type: enum, source: computed, description: "COMPLETE | SIZE_OUT_RISK | BROKEN | EXITED — second parallel dimension, derived from broken_size_count and consolidated_out", constraints: "enum: COMPLETE, SIZE_OUT_RISK, BROKEN, EXITED" }
      - { name: broken_size_count, type: integer, source: computed, description: "Count of CORE sizes of the item's SizeProfile whose size_on_hand units are 0 (a size absent from size_on_hand counts as 0)" }
      - { name: consolidated_out, type: boolean, source: system, default: false, description: "Set true when a CONSOLIDATION transfer sourced from this position reaches RECEIVED; reset to false whenever on_hand_units becomes > 0 again" }

  - name: Receipt
    parent: AllocationProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> AllocationProgram.id; owning program" }
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; the SKU received at the DC" }
      - { name: reference, type: string, source: input, description: "ASN / receipt reference" }
      - { name: units_received, type: integer, source: input, description: "Units booked into the DC by this receipt", constraints: ">= 1" }
      - { name: size_received, type: array, source: input, description: "Array of { size_code: string, units: integer }; sum(units) MUST equal units_received and size codes MUST exist in the item's SizeProfile", constraints: "sum(units) == units_received" }
      - { name: receipt_date, type: datetime, source: input, description: "Instant the units landed at the DC" }
      - { name: status, type: enum, source: system, default: STAGED, description: "STAGED | ALLOCATING | ALLOCATED | CLOSED", constraints: "enum: STAGED, ALLOCATING, ALLOCATED, CLOSED" }
      - { name: units_committed, type: integer, source: computed, description: "= sum(AllocationLine.units_allocated) over lines whose run.receipt_id = this receipt, run.status = COMMITTED and line.fulfillment_status IN {PENDING, SHIPPED, RECEIVED}" }
      - { name: units_unallocated, type: integer, source: computed, description: "= units_received - units_committed; the conserved quantity of calculations.receipt_unit_ledger_invariant" }

  - name: AllocationRun
    parent: Receipt
    common_fields: true
    fields:
      - { name: receipt_id, type: string, source: input, description: "FK -> Receipt.id; the receipt being spread across stores" }
      - { name: method, type: enum, source: input, description: "MIN_MAX_TOPUP | DEMAND_DRIVEN | PUSH_SIZE_PROFILE — MUST correspond to the item's resolved replenishment_model", constraints: "enum: MIN_MAX_TOPUP, DEMAND_DRIVEN, PUSH_SIZE_PROFILE" }
      - { name: need_basis, type: enum, source: input, description: "FORWARD_LOOKING | HISTORICAL_SELL_THROUGH — selects the store_need_units variant", constraints: "enum: FORWARD_LOOKING, HISTORICAL_SELL_THROUGH" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PROPOSED | COMMITTED | RECALLED | CANCELLED", constraints: "enum: DRAFT, PROPOSED, COMMITTED, RECALLED, CANCELLED" }
      - { name: supersedes_run_id, type: string, source: system, default: null, description: "FK -> AllocationRun.id; set when this run superseded a DRAFT/PROPOSED sibling run on the same receipt" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of the Allocator that created the run; segregation-of-duties key" }
      - { name: committed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the AllocationManager that committed the run; MUST differ from proposed_by_user_id" }
      - { name: units_proposed, type: integer, source: computed, description: "= sum(AllocationLine.units_proposed) over this run's lines; 0 while DRAFT" }
      - { name: units_committed, type: integer, source: computed, description: "= sum(AllocationLine.units_allocated) over this run's lines; 0 unless status = COMMITTED" }
      - { name: unallocated_remainder_units, type: integer, source: computed, description: "= receipt pool offered to this run minus units_proposed; units the proration could not place because every eligible store hit its need or capacity ceiling" }
      - { name: eligible_store_count, type: integer, source: computed, description: "Count of stores that entered the proration candidate set at propose time" }

  - name: AllocationLine
    parent: AllocationRun
    common_fields: true
    fields:
      - { name: run_id, type: string, source: input, description: "FK -> AllocationRun.id; owning run" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; destination store" }
      - { name: need_units, type: integer, source: computed, description: "Output of calculations.store_need_units for this store under the run's method and need_basis" }
      - { name: units_proposed, type: integer, source: computed, description: "Units the proration placed on this store" }
      - { name: units_allocated, type: integer, source: computed, description: "= units_proposed once the run is COMMITTED; 0 while PROPOSED, and 0 again after RECALLED" }
      - { name: size_breakdown, type: array, source: computed, description: "Array of { size_code: string, units: integer } produced by calculations.size_breakdown_split; sum(units) == units_proposed" }
      - { name: capacity_capped_units, type: integer, source: computed, description: "Units the proration lost specifically to fixture capacity headroom = max(0, min(base_units, need_units) - headroom_units)" }
      - { name: presentation_gap_units, type: integer, source: computed, description: "= max(0, presentation_min_units - (available_units + in_transit_units + units_proposed)) evaluated at propose time" }
      - { name: fulfillment_status, type: enum, source: system, default: PENDING, description: "PENDING | SHIPPED | RECEIVED | RECALLED", constraints: "enum: PENDING, SHIPPED, RECEIVED, RECALLED" }

  - name: PromoEvent
    parent: AllocationProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> AllocationProgram.id; owning program" }
      - { name: event_code, type: string, source: input, description: "Event label, unique within program_id", constraints: "unique per (program_id, event_code)" }
      - { name: scope, type: enum, source: input, description: "PROGRAM | CLUSTER | STORE — specificity rank PROGRAM=1, CLUSTER=2, STORE=3 is the pinned lift-selection ranking key", constraints: "enum: PROGRAM, CLUSTER, STORE" }
      - { name: cluster_code, type: string, source: input, default: null, description: "Target cluster; REQUIRED when scope = CLUSTER, MUST be null otherwise" }
      - { name: store_id, type: string, source: input, default: null, description: "FK -> Store.id; target store, REQUIRED when scope = STORE, MUST be null otherwise" }
      - { name: item_class, type: enum, source: input, default: null, description: "Restricts the lift to one merchandise class; null applies to every class", constraints: "enum: APPAREL_TOP, APPAREL_BOTTOM, FOOTWEAR, ACCESSORY, null" }
      - { name: start_date, type: datetime, source: input, description: "Inclusive start of the event window" }
      - { name: end_date, type: datetime, source: input, description: "Inclusive end of the event window", constraints: ">= start_date" }
      - { name: lift_factor_bp, type: integer, source: input, description: "Multiplier applied to weekly_forecast_units in basis points (12500 = 1.25x)", constraints: ">= 10000" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SCHEDULED | ACTIVE | ENDED | CANCELLED — only ACTIVE events contribute lift", constraints: "enum: DRAFT, SCHEDULED, ACTIVE, ENDED, CANCELLED" }

  - name: TransferRecommendation
    parent: AllocationProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> AllocationProgram.id; owning program" }
      - { name: from_store_id, type: string, source: input, description: "FK -> Store.id; donor store" }
      - { name: to_store_id, type: string, source: input, description: "FK -> Store.id; receiving store" }
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; SKU being moved" }
      - { name: units, type: integer, source: input, description: "Units to move", constraints: ">= 1" }
      - { name: source_reason, type: enum, source: system, default: REBALANCE, description: "REBALANCE for operator-created transfers; CONSOLIDATION when created by AssortmentAction execution. Only REBALANCE transfers are subject to the benefit-ratio threshold", constraints: "enum: REBALANCE, CONSOLIDATION" }
      - { name: size_split, type: array, source: computed, description: "Array of { size_code: string, units: integer } produced by calculations.transfer_size_split; sum(units) == units" }
      - { name: freight_cost_usd, type: number, source: computed, description: "Step 1 of calculations.transfer_landed_cost_usd" }
      - { name: handling_fee_usd, type: number, source: computed, description: "Step 2 of calculations.transfer_landed_cost_usd; tier keyed on freight_cost_usd, never on landed_cost_usd" }
      - { name: landed_cost_usd, type: number, source: computed, description: "= freight_cost_usd + handling_fee_usd" }
      - { name: benefit_usd, type: number, source: computed, description: "Output of calculations.transfer_benefit_usd — per-size-line rounding then sum" }
      - { name: benefit_ratio_bp, type: integer, source: computed, description: "= ROUND_HALF_UP(benefit_usd / landed_cost_usd * 10000) as an integer" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | APPROVED | REJECTED | DISPATCHED | RECEIVED | CANCELLED | EXPIRED", constraints: "enum: PROPOSED, APPROVED, REJECTED, DISPATCHED, RECEIVED, CANCELLED, EXPIRED" }
      - { name: expires_at, type: datetime, source: computed, description: "= logical clock at creation + TRANSFER_TTL_DAYS (7 days); a PROPOSED transfer at or past this instant is no longer approvable" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID that created the recommendation; 'system' for CONSOLIDATION transfers" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID that approved it; MUST differ from proposed_by_user_id" }
      - { name: reject_reason, type: string, source: system, default: null, description: "Reason captured on reject or cancel" }
      - { name: supersedes_recommendation_id, type: string, source: system, default: null, description: "FK -> TransferRecommendation.id; set when creation superseded a PROPOSED recommendation on the same (from_store_id, to_store_id, item_id) triple" }
      - { name: assortment_action_id, type: string, source: system, default: null, description: "FK -> AssortmentAction.id; set only on CONSOLIDATION transfers created by action execution" }

  - name: AssortmentAction
    parent: Item
    common_fields: true
    fields:
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; item whose assortment degraded" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store whose position degraded" }
      - { name: trigger_reason, type: enum, source: system, description: "SIZE_OUT when the position was SIZE_OUT_RISK; BROKEN_ASSORTMENT when it was BROKEN", constraints: "enum: SIZE_OUT, BROKEN_ASSORTMENT" }
      - { name: action_type, type: enum, source: system, description: "CONSOLIDATION when calculations.assortment_remedy_selection found a target store; MARKDOWN when the candidate pool was empty", constraints: "enum: CONSOLIDATION, MARKDOWN" }
      - { name: consolidation_target_store_id, type: string, source: system, default: null, description: "FK -> Store.id; the selected consolidation target, null for MARKDOWN actions" }
      - { name: broken_size_count, type: integer, source: system, description: "Snapshot of StorePosition.broken_size_count at detection time" }
      - { name: markdown_pct_bp, type: integer, source: computed, default: null, description: "Tiered markdown depth from calculations.markdown_depth_bp; null for CONSOLIDATION actions" }
      - { name: units_at_detection, type: integer, source: system, description: "Snapshot of StorePosition.available_units at detection time; becomes the CONSOLIDATION transfer's units" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | EXECUTED | CANCELLED | SUPERSEDED", constraints: "enum: PENDING, EXECUTED, CANCELLED, SUPERSEDED" }
      - { name: detected_at, type: datetime, source: system, description: "Logical-clock instant of the detection sweep that created the action" }

  - name: PerformanceSnapshot
    parent: AllocationProgram
    common_fields: false
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> AllocationProgram.id; owning program" }
      - { name: cluster_code, type: string, source: input, description: "Cluster measured" }
      - { name: basis, type: enum, source: input, description: "SIMPLE_AVERAGE | UNIT_WEIGHTED; defaults to the program's scorecard_basis when omitted", constraints: "enum: SIMPLE_AVERAGE, UNIT_WEIGHTED" }
      - { name: as_of_date, type: datetime, source: system, description: "Logical-clock instant the snapshot was taken" }
      - { name: store_count, type: integer, source: computed, description: "Distinct stores contributing at least one included position" }
      - { name: included_position_count, type: integer, source: computed, description: "Positions that passed the snapshot inclusion filter" }
      - { name: in_stock_pct_bp, type: integer, source: computed, description: "In-stock rate in basis points under the selected basis" }
      - { name: sell_through_pct_bp, type: integer, source: computed, description: "Sell-through rate in basis points under the selected basis" }
      - { name: allocation_accuracy_bp, type: integer, source: computed, description: "10000 minus the unit-weighted absolute allocation deviation, floored at 0; identical under both bases" }

# =============================================================================
# §1.2 State Machine Table — 9 machines (AllocationProgram, Store, Receipt,
# AllocationRun, AllocationLine, StorePosition x2 parallel dimensions,
# TransferRecommendation, Item, PromoEvent, AssortmentAction)
# =============================================================================
state_machines:
  - entity: AllocationProgram
    field: status
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: ACTIVE
        trigger: "POST /allocation/programs/{programId}/activate"
        actor: PlanningAdmin
        preconditions:
          - "at least one Store with program_id = programId and status = ACTIVE exists"
          - "at least one Item with program_id = programId exists"
        side_effects:
          - "increments AllocationProgram.version by 1"
        note: "Receipts, runs and transfers may only be created while status = ACTIVE."
      - from: ACTIVE
        to: LOCKED
        trigger: "POST /allocation/programs/{programId}/lock"
        actor: AllocationManager
        preconditions: []
        side_effects:
          - "sets AllocationProgram.locked_at = current logical clock and lock_reason = request body reason"
          - "increments AllocationProgram.version by 1"
        note: "LOCKED freezes allocation and transfer decision-making but NOT physical logistics; line ship, line confirm-receipt and transfer receive remain permitted."
      - from: LOCKED
        to: ACTIVE
        trigger: "POST /allocation/programs/{programId}/unlock"
        actor: AllocationManager
        preconditions: []
        side_effects:
          - "sets AllocationProgram.locked_at = null and lock_reason = null"
          - "increments AllocationProgram.version by 1"
        note: "Branching-with-revert: LOCKED is not terminal."
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /allocation/programs/{programId}/close"
        actor: PlanningAdmin
        preconditions:
          - "no AllocationRun of any Receipt of this program has status IN {DRAFT, PROPOSED}"
          - "no TransferRecommendation of this program has status IN {PROPOSED, APPROVED, DISPATCHED}"
        side_effects:
          - "transitions every Receipt of the program with status IN {STAGED, ALLOCATING, ALLOCATED} to CLOSED"
          - "transitions every AssortmentAction with status = PENDING whose item.program_id = programId to CANCELLED"
          - "increments AllocationProgram.version by 1"
      - from: LOCKED
        to: CLOSED
        trigger: "POST /allocation/programs/{programId}/close"
        actor: PlanningAdmin
        preconditions:
          - "no AllocationRun of any Receipt of this program has status IN {DRAFT, PROPOSED}"
          - "no TransferRecommendation of this program has status IN {PROPOSED, APPROVED, DISPATCHED}"
        side_effects:
          - "transitions every Receipt of the program with status IN {STAGED, ALLOCATING, ALLOCATED} to CLOSED"
          - "transitions every AssortmentAction with status = PENDING whose item.program_id = programId to CANCELLED"
          - "increments AllocationProgram.version by 1"

  - entity: Store
    field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: REMODEL
        trigger: "POST /allocation/stores/{storeId}/status with { target_status: REMODEL }"
        actor: PlanningAdmin
        preconditions: []
        side_effects:
          - "store is excluded from every subsequent allocation proration candidate set and from consolidation-target candidate sets"
          - "increments Store.version by 1"
        note: "Existing PENDING/SHIPPED AllocationLines and APPROVED transfers are untouched; only future decisions change."
      - from: REMODEL
        to: ACTIVE
        trigger: "POST /allocation/stores/{storeId}/status with { target_status: ACTIVE }"
        actor: PlanningAdmin
        preconditions: []
        side_effects:
          - "increments Store.version by 1"
        note: "Cyclic: a store may re-enter allocation after remodel."
      - from: ACTIVE
        to: CLOSING
        trigger: "POST /allocation/stores/{storeId}/status with { target_status: CLOSING }"
        actor: PlanningAdmin
        preconditions: []
        side_effects:
          - "store is excluded from allocation proration and may no longer be a transfer receiver, but remains eligible as a transfer donor"
          - "increments Store.version by 1"
      - from: CLOSING
        to: CLOSED
        trigger: "POST /allocation/stores/{storeId}/status with { target_status: CLOSED }"
        actor: PlanningAdmin
        preconditions:
          - "every StorePosition with store_id = storeId has on_hand_units = 0, else ERR_STORE_HAS_INVENTORY"
        side_effects:
          - "sets assortment_status = EXITED on every StorePosition of the store"
          - "recomputes Item.broken_store_count / size_out_store_count and re-derives Item.lifecycle_state for every affected item"
          - "increments Store.version by 1"

  - entity: Receipt
    field: status
    initial_state: STAGED
    terminal_states: [CLOSED]
    transitions:
      - from: STAGED
        to: ALLOCATING
        trigger: "POST /allocation/receipts/{receiptId}/allocation-runs (first run created against the receipt)"
        actor: Allocator
        preconditions:
          - "program.status = ACTIVE"
        side_effects:
          - "increments Receipt.version by 1"
      - from: ALLOCATING
        to: ALLOCATED
        trigger: "POST /allocation/allocation-runs/{runId}/commit resulting in units_unallocated = 0"
        actor: AllocationManager
        preconditions:
          - "receipt.units_unallocated evaluates to 0 after the commit's lines are booked"
        side_effects:
          - "increments Receipt.version by 1"
        note: "A commit that leaves units_unallocated > 0 keeps the receipt in ALLOCATING."
      - from: ALLOCATED
        to: ALLOCATING
        trigger: "POST /allocation/allocation-runs/{runId}/recall"
        actor: AllocationManager
        preconditions:
          - "the recalled run's status = COMMITTED"
        side_effects:
          - "increments Receipt.version by 1"
        note: "Cyclic: recalling a committed run re-opens the receipt for re-allocation."
      - from: ALLOCATING
        to: CLOSED
        trigger: "POST /allocation/receipts/{receiptId}/close"
        actor: AllocationManager
        preconditions: []
        side_effects:
          - "transitions every AllocationRun of the receipt with status IN {DRAFT, PROPOSED} to CANCELLED"
          - "transitions every AllocationLine of those runs to RECALLED"
          - "increments Receipt.version by 1"
      - from: ALLOCATED
        to: CLOSED
        trigger: "POST /allocation/receipts/{receiptId}/close"
        actor: AllocationManager
        preconditions: []
        side_effects:
          - "transitions every AllocationRun of the receipt with status IN {DRAFT, PROPOSED} to CANCELLED"
          - "transitions every AllocationLine of those runs to RECALLED"
          - "increments Receipt.version by 1"

  - entity: AllocationRun
    field: status
    initial_state: DRAFT
    terminal_states: [RECALLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /allocation/allocation-runs/{runId}/propose"
        actor: Allocator
        preconditions:
          - "program.status = ACTIVE, else ERR_PROGRAM_LOCKED"
          - "receipt.units_unallocated > 0, else ERR_ZERO_NETWORK_NEED"
          - "at least one eligible store survives the proration candidate filter, else ERR_NO_ELIGIBLE_STORES"
        side_effects:
          - "creates one AllocationLine per candidate store with units_proposed > 0, each carrying need_units, size_breakdown, capacity_capped_units and presentation_gap_units"
          - "sets run.units_proposed and run.unallocated_remainder_units and run.eligible_store_count"
          - "increments AllocationRun.version by 1"
      - from: PROPOSED
        to: DRAFT
        trigger: "POST /allocation/allocation-runs/{runId}/revise"
        actor: Allocator
        preconditions:
          - "program.status = ACTIVE, else ERR_PROGRAM_LOCKED"
        side_effects:
          - "deletes every AllocationLine of the run"
          - "resets run.units_proposed, unallocated_remainder_units and eligible_store_count to 0"
          - "increments AllocationRun.version by 1"
        note: "Cyclic: revise/propose may loop any number of times while the receipt is ALLOCATING."
      - from: PROPOSED
        to: COMMITTED
        trigger: "POST /allocation/allocation-runs/{runId}/commit"
        actor: AllocationManager
        preconditions:
          - "program.status = ACTIVE, else ERR_PROGRAM_LOCKED"
          - "X-User-ID differs from run.proposed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "every line satisfies presentation minimum coverage, else ERR_PRESENTATION_MIN_NOT_MET"
          - "every line satisfies fixture capacity headroom, else ERR_FIXTURE_CAPACITY_EXCEEDED"
          - "sum(line.units_proposed) <= receipt.units_unallocated, else ERR_RECEIPT_UNITS_EXCEEDED"
        side_effects:
          - "sets line.units_allocated = line.units_proposed and line.fulfillment_status = PENDING on every line"
          - "sets run.committed_by_user_id = X-User-ID"
          - "recomputes receipt.units_committed / units_unallocated; transitions the receipt ALLOCATING -> ALLOCATED when units_unallocated reaches 0"
          - "recomputes program.total_units_committed and open_reserve_units"
          - "increments AllocationRun.version by 1"
      - from: COMMITTED
        to: RECALLED
        trigger: "POST /allocation/allocation-runs/{runId}/recall"
        actor: AllocationManager
        preconditions:
          - "every AllocationLine of the run has fulfillment_status = PENDING, else ERR_LINE_ALREADY_SHIPPED"
        side_effects:
          - "sets line.fulfillment_status = RECALLED and line.units_allocated = 0 on every line"
          - "recomputes receipt.units_committed / units_unallocated and transitions the receipt ALLOCATED -> ALLOCATING when it was ALLOCATED"
          - "recomputes program.total_units_committed and open_reserve_units"
          - "increments AllocationRun.version by 1"
        note: "Compensation: every unit booked by the commit is returned to the receipt pool with no drift."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /allocation/allocation-runs/{runId}/cancel"
        actor: Allocator
        preconditions: []
        side_effects:
          - "increments AllocationRun.version by 1"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /allocation/allocation-runs/{runId}/cancel"
        actor: Allocator
        preconditions: []
        side_effects:
          - "sets fulfillment_status = RECALLED on every AllocationLine of the run"
          - "increments AllocationRun.version by 1"

  - entity: AllocationLine
    field: fulfillment_status
    initial_state: PENDING
    terminal_states: [RECEIVED, RECALLED]
    transitions:
      - from: PENDING
        to: SHIPPED
        trigger: "POST /allocation/allocation-lines/{lineId}/ship"
        actor: AllocationManager
        preconditions:
          - "run.status = COMMITTED, else ERR_INVALID_STATE_TRANSITION"
          - "line.units_allocated > 0"
        side_effects:
          - "adds line.units_allocated to StorePosition.in_transit_units for (line.store_id, receipt.item_id) and re-derives that position's stock_status"
          - "increments AllocationLine.version by 1"
        note: "Permitted while program.status = LOCKED — logistics are not frozen by a lock."
      - from: SHIPPED
        to: RECEIVED
        trigger: "POST /allocation/allocation-lines/{lineId}/confirm-receipt"
        actor: StoreOperator
        preconditions:
          - "X-User-ID = line.store_id, else ERR_STORE_SCOPE_VIOLATION"
        side_effects:
          - "adds line.units_allocated to StorePosition.on_hand_units and merges line.size_breakdown into StorePosition.size_on_hand for (line.store_id, receipt.item_id)"
          - "removes line.units_allocated from that position's in_transit_units"
          - "sets consolidated_out = false on that position when on_hand_units becomes > 0"
          - "re-derives that position's broken_size_count, stock_status and assortment_status"
          - "recomputes Item.broken_store_count / size_out_store_count and re-derives Item.lifecycle_state"
          - "increments AllocationLine.version by 1"

  - entity: StorePosition
    field: stock_status
    initial_state: derived
    terminal_states: []
    note: "Parallel dimension 1 of 2. Purely derived from available_units against min_units/max_units; it never gates the assortment dimension and is re-derived after every mutation that changes available_units."
    transitions:
      - from: any
        to: STOCKOUT
        trigger: "system re-derivation when available_units = 0"
        actor: system
        preconditions: []
        side_effects: []
      - from: any
        to: LOW
        trigger: "system re-derivation when 0 < available_units < min_units"
        actor: system
        preconditions: []
        side_effects: []
      - from: any
        to: IN_STOCK
        trigger: "system re-derivation when min_units <= available_units <= max_units"
        actor: system
        preconditions: []
        side_effects: []
      - from: any
        to: OVERSTOCK
        trigger: "system re-derivation when available_units > max_units"
        actor: system
        preconditions: []
        side_effects: []

  - entity: StorePosition
    field: assortment_status
    initial_state: derived
    terminal_states: []
    note: "Parallel dimension 2 of 2. Evaluation order is pinned: EXITED (store CLOSED or consolidated_out = true) is tested first, then broken_size_count. The two dimensions move independently — a position can be OVERSTOCK and BROKEN at once."
    transitions:
      - from: any
        to: EXITED
        trigger: "system re-derivation when store.status = CLOSED OR consolidated_out = true"
        actor: system
        preconditions: []
        side_effects: []
      - from: any
        to: COMPLETE
        trigger: "system re-derivation when not EXITED and broken_size_count = 0"
        actor: system
        preconditions: []
        side_effects: []
      - from: any
        to: SIZE_OUT_RISK
        trigger: "system re-derivation when not EXITED and broken_size_count = 1"
        actor: system
        preconditions: []
        side_effects: []
      - from: any
        to: BROKEN
        trigger: "system re-derivation when not EXITED and broken_size_count >= 2"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TransferRecommendation
    field: status
    initial_state: PROPOSED
    terminal_states: [REJECTED, RECEIVED, CANCELLED, EXPIRED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /allocation/transfer-recommendations/{recommendationId}/approve"
        actor: AllocationManager
        preconditions:
          - "program.status = ACTIVE, else ERR_PROGRAM_LOCKED"
          - "current logical clock < expires_at, else ERR_TRANSFER_EXPIRED"
          - "X-User-ID differs from proposed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "source_reason = CONSOLIDATION OR benefit_ratio_bp >= program.transfer_min_ratio_bp, else ERR_BENEFIT_RATIO_BELOW_THRESHOLD"
          - "donor position available_units >= units, else ERR_INSUFFICIENT_DONOR_UNITS"
          - "receiver headroom (fixture capacity_units - available_units - in_transit_units) >= units, else ERR_FIXTURE_CAPACITY_EXCEEDED"
        side_effects:
          - "sets approved_by_user_id = X-User-ID"
          - "adds units to the donor position's reserved_out_units, lowering its available_units, and re-derives its stock_status"
          - "increments TransferRecommendation.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /allocation/transfer-recommendations/{recommendationId}/reject"
        actor: AllocationManager
        preconditions: []
        side_effects:
          - "sets reject_reason = request body reason"
          - "increments TransferRecommendation.version by 1"
      - from: PROPOSED
        to: EXPIRED
        trigger: "POST /allocation/_run-transfer-expiry (system sweep)"
        actor: AllocationManager
        preconditions:
          - "expires_at <= current logical clock"
        side_effects:
          - "increments TransferRecommendation.version by 1"
        note: "Branching fork: a PROPOSED recommendation reaches exactly one of APPROVED, REJECTED, EXPIRED or CANCELLED."
      - from: APPROVED
        to: DISPATCHED
        trigger: "POST /allocation/transfer-recommendations/{recommendationId}/dispatch"
        actor: AllocationManager
        preconditions:
          - "program.status = ACTIVE, else ERR_PROGRAM_LOCKED"
          - "to_store.status = ACTIVE, else ERR_STORE_NOT_ELIGIBLE"
        side_effects:
          - "subtracts units from the donor position's on_hand_units and removes size_split units from its size_on_hand, keeping reserved_out_units bookkeeping consistent"
          - "adds units to the receiver position's in_transit_units"
          - "re-derives both positions' broken_size_count, stock_status and assortment_status"
          - "recomputes Item.broken_store_count / size_out_store_count and re-derives Item.lifecycle_state"
          - "increments TransferRecommendation.version by 1"
      - from: DISPATCHED
        to: RECEIVED
        trigger: "POST /allocation/transfer-recommendations/{recommendationId}/receive"
        actor: StoreOperator
        preconditions:
          - "X-User-ID = to_store_id, else ERR_STORE_SCOPE_VIOLATION"
        side_effects:
          - "adds units to the receiver position's on_hand_units and merges size_split into its size_on_hand; removes them from in_transit_units"
          - "sets consolidated_out = true on the donor position when its on_hand_units reaches 0 and source_reason = CONSOLIDATION"
          - "re-derives both positions' broken_size_count, stock_status and assortment_status"
          - "recomputes Item.broken_store_count / size_out_store_count and re-derives Item.lifecycle_state, including CONSOLIDATION_PENDING -> ACTIVE when broken_store_count reaches 0"
          - "transitions any AssortmentAction with status = PENDING for the receiver's (item_id, store_id) whose trigger condition no longer holds to SUPERSEDED"
          - "increments TransferRecommendation.version by 1"
        note: "Deepest cascade in the model: recommendation -> position -> item lifecycle -> assortment action."
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /allocation/transfer-recommendations/{recommendationId}/cancel"
        actor: AllocationManager
        preconditions: []
        side_effects:
          - "releases units from the donor position's reserved_out_units, restoring its available_units, and re-derives its stock_status"
          - "sets reject_reason = request body reason"
          - "increments TransferRecommendation.version by 1"
        note: "Compensation: exactly reverses the approve side effect."
      - from: PROPOSED
        to: CANCELLED
        trigger: "creation of a newer TransferRecommendation for the same (from_store_id, to_store_id, item_id) triple"
        actor: system
        preconditions: []
        side_effects:
          - "sets the new recommendation's supersedes_recommendation_id to the cancelled one"
          - "sets reject_reason = 'superseded'"
          - "increments TransferRecommendation.version by 1"

  - entity: Item
    field: lifecycle_state
    initial_state: ACTIVE
    terminal_states: [MARKDOWN]
    note: "Cyclic. Re-derived after every mutation that changes any StorePosition.assortment_status, in this pinned order: (1) MARKDOWN is frozen; (2) CONSOLIDATION_PENDING clears to ACTIVE only when broken_store_count = 0; (3) otherwise broken_store_count >= 1 -> BROKEN, else size_out_store_count >= 1 -> SIZE_OUT_WATCH, else ACTIVE."
    transitions:
      - from: ACTIVE
        to: SIZE_OUT_WATCH
        trigger: "system re-derivation after broken_store_count = 0 and size_out_store_count >= 1"
        actor: system
        preconditions: []
        side_effects: []
      - from: SIZE_OUT_WATCH
        to: ACTIVE
        trigger: "system re-derivation after size_out_store_count returns to 0"
        actor: system
        preconditions: []
        side_effects: []
      - from: SIZE_OUT_WATCH
        to: BROKEN
        trigger: "system re-derivation after broken_store_count reaches >= 1"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: BROKEN
        trigger: "system re-derivation after broken_store_count reaches >= 1"
        actor: system
        preconditions: []
        side_effects: []
      - from: BROKEN
        to: ACTIVE
        trigger: "system re-derivation after broken_store_count returns to 0 and size_out_store_count = 0"
        actor: system
        preconditions: []
        side_effects: []
      - from: BROKEN
        to: CONSOLIDATION_PENDING
        trigger: "POST /allocation/assortment-actions/{actionId}/execute on a CONSOLIDATION action for this item"
        actor: AllocationManager
        preconditions:
          - "action.action_type = CONSOLIDATION"
        side_effects:
          - "increments Item.version by 1"
      - from: CONSOLIDATION_PENDING
        to: ACTIVE
        trigger: "system re-derivation after the consolidation transfer is RECEIVED and broken_store_count = 0"
        actor: system
        preconditions: []
        side_effects: []
      - from: BROKEN
        to: MARKDOWN
        trigger: "POST /allocation/assortment-actions/{actionId}/execute on a MARKDOWN action for this item"
        actor: AllocationManager
        preconditions:
          - "action.action_type = MARKDOWN"
        side_effects:
          - "the item is permanently excluded from allocation proration candidate sets and from consolidation-target candidate sets"
          - "increments Item.version by 1"
        note: "Terminal: no further lifecycle re-derivation is applied once MARKDOWN is reached."
      - from: SIZE_OUT_WATCH
        to: MARKDOWN
        trigger: "POST /allocation/assortment-actions/{actionId}/execute on a MARKDOWN action for this item"
        actor: AllocationManager
        preconditions:
          - "action.action_type = MARKDOWN"
        side_effects:
          - "the item is permanently excluded from allocation proration candidate sets and from consolidation-target candidate sets"
          - "increments Item.version by 1"

  - entity: PromoEvent
    field: status
    initial_state: DRAFT
    terminal_states: [ENDED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /allocation/promo-events/{eventId}/schedule"
        actor: PlanningAdmin
        preconditions:
          - "no other PromoEvent of the same program with status IN {SCHEDULED, ACTIVE} conflicts on window and scope, else ERR_PROMO_WINDOW_CONFLICT"
        side_effects:
          - "increments PromoEvent.version by 1"
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /allocation/promo-events/{eventId}/activate"
        actor: PlanningAdmin
        preconditions: []
        side_effects:
          - "the event's lift_factor_bp becomes visible to calculations.promo_lift_factor_bp for windows containing the logical clock"
          - "increments PromoEvent.version by 1"
        note: "Only ACTIVE events contribute lift; DRAFT and SCHEDULED events never do."
      - from: ACTIVE
        to: ENDED
        trigger: "POST /allocation/promo-events/{eventId}/end"
        actor: PlanningAdmin
        preconditions: []
        side_effects:
          - "the event stops contributing lift to any subsequent need calculation"
          - "increments PromoEvent.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /allocation/promo-events/{eventId}/cancel"
        actor: PlanningAdmin
        preconditions: []
        side_effects:
          - "increments PromoEvent.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /allocation/promo-events/{eventId}/cancel"
        actor: PlanningAdmin
        preconditions: []
        side_effects:
          - "increments PromoEvent.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /allocation/promo-events/{eventId}/cancel"
        actor: PlanningAdmin
        preconditions: []
        side_effects:
          - "the event stops contributing lift to any subsequent need calculation"
          - "increments PromoEvent.version by 1"

  - entity: AssortmentAction
    field: status
    initial_state: PENDING
    terminal_states: [EXECUTED, CANCELLED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: EXECUTED
        trigger: "POST /allocation/assortment-actions/{actionId}/execute"
        actor: AllocationManager
        preconditions:
          - "program.status = ACTIVE, else ERR_PROGRAM_LOCKED"
          - "item.lifecycle_state IN {SIZE_OUT_WATCH, BROKEN}, else ERR_ITEM_LIFECYCLE_BLOCKED"
          - "for CONSOLIDATION actions, units_at_detection >= 1 and the target store's headroom still covers units_at_detection, else ERR_FIXTURE_CAPACITY_EXCEEDED"
        side_effects:
          - "for action_type = CONSOLIDATION, creates a TransferRecommendation with source_reason = CONSOLIDATION, from_store_id = action.store_id, to_store_id = action.consolidation_target_store_id, units = units_at_detection, assortment_action_id = action.id and proposed_by_user_id = 'system', then transitions the item BROKEN -> CONSOLIDATION_PENDING"
          - "for action_type = MARKDOWN, transitions the item to MARKDOWN (terminal) and leaves consolidation_target_store_id null"
          - "increments AssortmentAction.version by 1"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /allocation/assortment-actions/{actionId}/cancel"
        actor: AllocationManager
        preconditions: []
        side_effects:
          - "increments AssortmentAction.version by 1"
      - from: PENDING
        to: SUPERSEDED
        trigger: "system re-derivation when the triggering StorePosition's assortment_status returns to COMPLETE"
        actor: system
        preconditions: []
        side_effects:
          - "increments AssortmentAction.version by 1"
        note: "Conditional cascade: only PENDING actions are superseded; EXECUTED and CANCELLED actions are left untouched."

# =============================================================================
# §1.2.1 Concurrency Rules — both entries are CREATE-with-supersede true races
# resolved by OCC on the parent's version. Two strictly sequential requests
# reproduce each one.
# =============================================================================
concurrency_rules:
  - rule_id: run-create-stale-receipt
    parent_entity: Receipt
    write_endpoint: "POST /allocation/receipts/{receiptId}/allocation-runs"
    occ_field: "expected_receipt_version"
    description: |
      Creating an AllocationRun against a Receipt whose version has advanced since the client last
      read it is rejected. Creating a run legitimately supersedes any DRAFT or PROPOSED sibling run
      on the same receipt, so a writer holding a stale view of the receipt would silently discard a
      spread it never saw. The stale-version check turns that into a deterministic 412.
    error_id: ERR_STALE_RECEIPT_VERSION
    http_status: 412

  - rule_id: transfer-create-stale-position
    parent_entity: StorePosition
    write_endpoint: "POST /allocation/transfer-recommendations"
    occ_field: "expected_from_position_version"
    description: |
      Creating a TransferRecommendation whose donor StorePosition version has advanced since the
      client last read it is rejected. Creation supersedes any PROPOSED recommendation on the same
      (from_store_id, to_store_id, item_id) triple and reserves donor units, so a writer working
      from a stale donor position would size the move against inventory that has already moved.
    error_id: ERR_STALE_POSITION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table — 15 rules. Every rounding step, evaluation
# order, eligibility filter, ranking key, tie-break and empty-set fallback is
# pinned. No rule ever reads `id` to decide an observable business result.
# =============================================================================
calculations:
  - name: replenishment_model_resolution
    trigger: "On Item create/patch, and again whenever an AllocationRun is created against a Receipt for the item"
    algorithm: rule_precedence
    formula: |
      if item.replenishment_model_override != null:
          replenishment_model = item.replenishment_model_override
      else:
          replenishment_model = { BASIC: MIN_MAX, SEASONAL: DEMAND_DRIVEN, FASHION: PUSH }[item.item_type]

      # The run's declared method must correspond to the resolved model:
      #   MIN_MAX <-> MIN_MAX_TOPUP, DEMAND_DRIVEN <-> DEMAND_DRIVEN, PUSH <-> PUSH_SIZE_PROFILE
      # Any other pairing is rejected with ERR_METHOD_MODEL_MISMATCH.
    input_set: "The single Item referenced by the receipt"
    constants: {}
    precision: "n/a (enum)"

  - name: promo_lift_factor_bp
    trigger: "Once per candidate store while computing store_need_units under need_basis = FORWARD_LOOKING"
    algorithm: selector_policy
    formula: |
      # Eligibility filter
      candidates = PromoEvent where
            program_id = run.receipt.program_id
        AND status = ACTIVE
        AND start_date <= clock_now <= end_date            # inclusive on both ends
        AND (item_class = item.item_class OR item_class IS NULL)
        AND ( (scope = PROGRAM)
           OR (scope = CLUSTER AND cluster_code = store.cluster_code)
           OR (scope = STORE   AND store_id = store.id) )

      # Ranking (pinned, applied in this order)
      #   1. specificity_rank DESC   where STORE = 3, CLUSTER = 2, PROGRAM = 1
      #   2. lift_factor_bp DESC
      #   3. created_at ASC          (sanctioned common-field fallback)
      # Empty-set fallback
      if candidates is empty: return DEFAULT_LIFT_BP
      return first(candidates ordered as above).lift_factor_bp
    input_set: "ACTIVE PromoEvents of the program whose window contains the logical clock and whose scope matches the store"
    constants:
      DEFAULT_LIFT_BP: 10000
      SPECIFICITY_RANK: "STORE=3, CLUSTER=2, PROGRAM=1"
    precision: "integer basis points; exactly one event is ever selected — lifts never compound"
    note: "A STORE-scope event always beats a CLUSTER-scope event with a larger lift; specificity outranks magnitude."

  - name: store_need_units
    trigger: "Once per candidate store during POST /allocation/allocation-runs/{runId}/propose"
    algorithm: forward_looking
    formula: |
      # --- target ---------------------------------------------------------
      #   MIN_MAX_TOPUP      target = position.max_units                (demand-independent)
      #   DEMAND_DRIVEN      target = f(weekly_demand, COVER_WEEKS)     (variant-specific, below)
      #   PUSH_SIZE_PROFILE  target = FLOOR(fixture.capacity_units * PUSH_FILL_RATE_BP / 10000)
      #
      # --- pipeline -------------------------------------------------------
      #   variant-specific (below)
      #
      # need_units = max(0, target - pipeline)
    input_set: |
      Candidate stores only: store.status = ACTIVE, a StorePosition exists for (store, item),
      item.lifecycle_state != MARKDOWN. The FixturePlan used is the one whose
      [effective_from, effective_to) interval contains the logical clock and whose item_class
      equals the item's item_class.
    constants:
      COVER_WEEKS: 4
      PUSH_FILL_RATE_BP: 8000
    precision: "integer units; rounding placement differs by variant — see below"
    variants:
      - name: FORWARD_LOOKING
        when: "run.need_basis = FORWARD_LOOKING"
        difference: |
          weekly_demand_units = ROUND_HALF_UP(position.weekly_forecast_units * promo_lift_factor_bp / 10000)
                                # rounded to an integer BEFORE multiplying by COVER_WEEKS
          target (DEMAND_DRIVEN) = weekly_demand_units * COVER_WEEKS
          pipeline = position.available_units + position.in_transit_units + position.on_order_units
                                # on-order units at the vendor ARE visible to this variant
      - name: HISTORICAL_SELL_THROUGH
        when: "run.need_basis = HISTORICAL_SELL_THROUGH"
        difference: |
          weekly_demand_units = position.trailing_4wk_sales_units * store.grade_index_bp / 10000 / 4
                                # kept as an exact rational — NOT rounded here
          target (DEMAND_DRIVEN) = ROUND_HALF_UP(weekly_demand_units * COVER_WEEKS)
                                # single rounding, applied only after the cover multiply
          pipeline = position.available_units + position.in_transit_units
                                # on_order_units are IGNORED: this variant trusts realised sales only
          # Promotional lift is never applied under this variant; store.grade_index_bp replaces it.

  - name: receipt_proration
    trigger: "POST /allocation/allocation-runs/{runId}/propose"
    algorithm: waterfall_allocation
    formula: |
      pool = receipt.units_unallocated
      candidates = candidate stores (see store_need_units.input_set) with need_units > 0
      if candidates is empty: reject with ERR_NO_ELIGIBLE_STORES
      total_need = sum(need_units over candidates)
      if total_need = 0: reject with ERR_ZERO_NETWORK_NEED

      # Step 1 — proportional floor share
      base_i     = FLOOR(pool * need_i / total_need)
      # Step 2 — need ceiling
      capped_i   = min(base_i, need_i)
      # Step 3 — fixture capacity ceiling
      headroom_i = max(0, fixture.capacity_units - position.available_units - position.in_transit_units)
      alloc_i    = min(capped_i, headroom_i)
      capacity_capped_units_i = capped_i - alloc_i
      # Step 4 — single-unit remainder distribution
      remaining = pool - sum(alloc_i)
      while remaining > 0:
          room = [ i where alloc_i < min(need_i, headroom_i) ]
          if room is empty: break
          # ranking, pinned in this order:
          #   1. (need_i - alloc_i) DESC        residual need
          #   2. grade rank ASC                 A=1, B=2, C=3, D=4
          #   3. store_code ASC                 lexicographic
          give 1 unit to first(room ordered as above); remaining -= 1
      run.unallocated_remainder_units = remaining
      # Stores whose alloc_i = 0 get no AllocationLine at all.
    input_set: "Candidate stores with need_units > 0; the receipt's still-unallocated pool"
    constants: {}
    precision: "integer units; FLOOR on the share, never ROUND — the remainder loop is the only way a store gains a unit above its floor share"
    note: "Steps run strictly in order: a store capped by capacity in step 3 can still be topped up in step 4 only up to min(need, headroom), so capacity is never breached by the remainder loop."

  - name: size_breakdown_split
    trigger: "Per AllocationLine during propose, after receipt_proration has fixed units_proposed"
    algorithm: weighted_scoring
    formula: |
      curve = item.size_profile.size_curve            # [{size_code, share_bp}], sum(share_bp) = 10000
      units = line.units_proposed
      floor_s     = FLOOR(units * share_bp_s / 10000)
      remainder   = units - sum(floor_s)
      # distribute the remainder one unit at a time, ranked:
      #   1. share_bp DESC
      #   2. size_code ASC (lexicographic)
      # each size may receive at most one remainder unit per pass; passes repeat until remainder = 0
      size_breakdown = [{size_code, units}] with sum(units) = line.units_proposed
    input_set: "The item's SizeProfile.size_curve and the line's units_proposed"
    constants: {}
    precision: "integer units; sum(size_breakdown.units) MUST equal units_proposed exactly"
    note: "The split follows the size curve only; it is deliberately NOT constrained by receipt.size_received, because the DC substitutes sizes at pick time."

  - name: transfer_size_split
    trigger: "POST /allocation/transfer-recommendations (creation), and on the CONSOLIDATION transfer created by assortment-action execution"
    algorithm: waterfall_allocation
    formula: |
      # Two modes, selected by source_reason — the split answers a different question in each.
      if source_reason = REBALANCE:
          # fill the receiver's missing CORE sizes only
          candidates = CORE sizes of the item's SizeProfile where
                       receiver_position.size_on_hand[size] = 0 AND donor_position.size_on_hand[size] > 0
          if candidates is empty: reject with ERR_TRANSFER_SIZE_INFEASIBLE
          weight_s = share_bp_s
      else:  # CONSOLIDATION
          # sweep the donor's residual stock, whatever sizes it happens to be
          candidates = all sizes where donor_position.size_on_hand[size] > 0
          if candidates is empty: reject with ERR_TRANSFER_SIZE_INFEASIBLE
          weight_s = donor_position.size_on_hand[size]

      denom  = sum(weight_s over candidates)
      base_s = FLOOR(units * weight_s / denom)
      remainder = units - sum(base_s)
      # remainder distributed one unit at a time, ranked:
      #   1. weight_s DESC
      #   2. size_code ASC
      # capped by donor_position.size_on_hand[size] at every step
      size_split = [{size_code, units}] with sum(units) = recommendation.units
    input_set: "The donor and receiver StorePositions for (item, store) and the item's SizeProfile"
    constants: {}
    precision: "integer units"

  - name: transfer_landed_cost_usd
    trigger: "POST /allocation/transfer-recommendations (creation); recomputed never — the cost is frozen at creation"
    algorithm: tiered_pricing
    formula: |
      # Step order is pinned and observable — the handling tier is keyed on FREIGHT, not on landed cost.
      # 1. freight
      freight_cost_usd = max(FREIGHT_MIN_USD,
                             ROUND_HALF_UP(from_store.freight_flat_usd + units * PER_UNIT_HANDLING_USD, 2))
      # 2. handling tier, selected by freight_cost_usd
      rate_bp = 1200  if freight_cost_usd < 50.00
                900   if 50.00 <= freight_cost_usd < 150.00
                600   if freight_cost_usd >= 150.00
      handling_fee_usd = ROUND_HALF_UP(freight_cost_usd * rate_bp / 10000, 2)
      # 3. landed
      landed_cost_usd = freight_cost_usd + handling_fee_usd
    input_set: "The donor Store's freight_flat_usd and the recommendation's units"
    constants:
      FREIGHT_MIN_USD: 45.00
      PER_UNIT_HANDLING_USD: 0.85
      HANDLING_TIER_BP: "freight < 50.00 -> 1200; 50.00 <= freight < 150.00 -> 900; freight >= 150.00 -> 600"
    precision: "2 decimal places, ROUND_HALF_UP, applied independently at step 1 and step 2; step 3 is an exact sum of two 2-decimal values"
    note: "Keying the tier on landed cost instead of freight is the classic wrong answer: a 45.00 freight lands at 50.40, which would flip the tier to 900bp and change the fee."

  - name: transfer_benefit_usd
    trigger: "POST /allocation/transfer-recommendations (creation)"
    algorithm: weighted_scoring
    formula: |
      unit_margin_usd     = item.retail_price_usd * NET_MARGIN_BP / 10000          # exact, unrounded
      realised_margin_usd = unit_margin_usd * to_store.historical_sell_through_bp / 10000   # exact, unrounded
      # Rounding happens PER SIZE LINE, then the rounded lines are summed:
      benefit_usd = sum over size_split of ROUND_HALF_UP(line.units * realised_margin_usd, 2)
    input_set: "The recommendation's size_split, the item's retail_price_usd, and the RECEIVING store's historical_sell_through_bp"
    constants:
      NET_MARGIN_BP: 5500
    precision: "2 decimal places, ROUND_HALF_UP, applied once per size line BEFORE summation"
    note: "Rounding the total once instead of per size line differs by a cent on many inputs; the per-line order is the specified behaviour. The DONOR's sell-through is never used — benefit accrues where the units land."

  - name: transfer_benefit_ratio_bp
    trigger: "POST /allocation/transfer-recommendations (creation); read again by approve"
    algorithm: threshold
    formula: |
      benefit_ratio_bp = ROUND_HALF_UP(benefit_usd / landed_cost_usd * 10000)      # integer basis points
      # Gate applied at approve time:
      #   source_reason = CONSOLIDATION -> gate skipped entirely
      #   source_reason = REBALANCE     -> benefit_ratio_bp >= program.transfer_min_ratio_bp
      #                                    (inclusive: equality passes)
      #   otherwise -> ERR_BENEFIT_RATIO_BELOW_THRESHOLD
    input_set: "The recommendation's benefit_usd and landed_cost_usd, plus program.transfer_min_ratio_bp"
    constants: {}
    precision: "integer basis points, ROUND_HALF_UP"
    note: "Conditional validation: the freight-worthiness gate exists to stop uneconomic rebalancing, and mandated consolidations are exempt by design."

  - name: assortment_health_derivation
    trigger: "After every mutation that changes a StorePosition's size_on_hand, on_hand_units, reserved_out_units or consolidated_out, and after store CLOSED"
    algorithm: constraint_propagation
    formula: |
      core_sizes = [ s in item.size_profile.size_curve where s.share_bp >= size_profile.core_size_min_share_bp ]
      broken_size_count = count of core_sizes whose size_on_hand units = 0
                          (a size_code absent from size_on_hand counts as 0)

      # assortment_status — evaluation order is pinned
      if store.status = CLOSED OR position.consolidated_out = true: EXITED
      elif broken_size_count = 0:  COMPLETE          # includes the degenerate case core_sizes = []
      elif broken_size_count = 1:  SIZE_OUT_RISK
      else:                        BROKEN

      # stock_status — independent dimension
      if available_units = 0:                            STOCKOUT
      elif available_units < min_units:                  LOW
      elif available_units <= max_units:                 IN_STOCK
      else:                                              OVERSTOCK

      # propagate to the item
      item.broken_store_count   = count of positions of the item with assortment_status = BROKEN
      item.size_out_store_count = count of positions of the item with assortment_status = SIZE_OUT_RISK
      then re-derive item.lifecycle_state per the pinned order in §1.2
    input_set: "Every StorePosition of the item; only CORE sizes of the item's SizeProfile"
    constants: {}
    precision: "integer counts"
    note: "A curve of eight sizes at 1250bp each with core_size_min_share_bp = 1500 has NO core sizes, so broken_size_count is 0 and the position is COMPLETE no matter how empty it is."

  - name: assortment_remedy_selection
    trigger: "POST /allocation/_run-assortment-detection, once per degraded StorePosition"
    algorithm: selector_policy
    formula: |
      # Eligibility filter for a consolidation target, given source position P of item I
      candidates = StorePosition Q where
            Q.item_id = P.item_id
        AND Q.store_id != P.store_id
        AND Q.assortment_status = COMPLETE
        AND Q.store.status = ACTIVE
        AND headroom(Q) >= P.available_units
            where headroom(Q) = max(0, Q.fixture.capacity_units - Q.available_units - Q.in_transit_units)
      if P.available_units = 0: candidates = []          # nothing to move

      # Ranking (pinned)
      #   1. Q.store.historical_sell_through_bp DESC
      #   2. grade rank ASC (A=1, B=2, C=3, D=4)
      #   3. Q.store.store_code ASC
      # Empty-set fallback -> MARKDOWN
      if candidates is empty:
          action_type = MARKDOWN;      consolidation_target_store_id = null
      else:
          action_type = CONSOLIDATION; consolidation_target_store_id = first(candidates).store_id
    input_set: "All StorePositions of the same item in other ACTIVE stores"
    constants: {}
    precision: "n/a (enum + FK)"
    note: "The highest-sell-through store can still lose to a lower one when it has no fixture headroom — the eligibility filter runs before the ranking."

  - name: markdown_depth_bp
    trigger: "During detection, only for actions whose action_type resolved to MARKDOWN"
    algorithm: tiered_pricing
    formula: |
      if size_profile.core_size_count = 0: broken_ratio_bp = 0
      else: broken_ratio_bp = FLOOR(position.broken_size_count * 10000 / size_profile.core_size_count)

      markdown_pct_bp = 0     if broken_ratio_bp < 2500
                        1500  if 2500 <= broken_ratio_bp < 5000
                        3000  if 5000 <= broken_ratio_bp < 7500
                        4500  if broken_ratio_bp >= 7500
    input_set: "The degraded StorePosition's broken_size_count and its item's SizeProfile.core_size_count"
    constants:
      MARKDOWN_TIERS_BP: "[0, 2500) -> 0; [2500, 5000) -> 1500; [5000, 7500) -> 3000; [7500, inf) -> 4500"
    precision: "integer basis points; FLOOR on the ratio, tiers are lower-inclusive / upper-exclusive"

  - name: cluster_scorecard
    trigger: "POST /allocation/performance-snapshots"
    algorithm: aggregation
    formula: |
      included = StorePosition P where
            P.store.program_id = program_id
        AND P.store.cluster_code = cluster_code
        AND P.store.status IN {ACTIVE, REMODEL}
        AND P.item.lifecycle_state != MARKDOWN
      if included is empty: reject with ERR_NO_CLUSTER_POSITIONS
      store_count = distinct P.store_id; included_position_count = count(included)

      per position:
        covered(P) = min(P.available_units, P.min_units)
        sold(P)    = P.trailing_4wk_sales_units
        base(P)    = sold(P) + P.available_units

      # in_stock_pct_bp and sell_through_pct_bp are variant-dependent (below).

      # allocation_accuracy_bp is basis-independent:
      allocated(P)     = sum(AllocationLine.units_allocated) over lines where line.store_id = P.store_id,
                         the line's run.receipt.item_id = P.item_id,
                         line.fulfillment_status IN {PENDING, SHIPPED, RECEIVED}
      deviation_units  = sum over included of ABS(allocated(P) - sold(P))
      total_sold       = sum over included of sold(P)
      allocation_accuracy_bp = 0 if total_sold = 0
                               else max(0, 10000 - FLOOR(deviation_units * 10000 / total_sold))
    input_set: "StorePositions of the cluster in ACTIVE or REMODEL stores, excluding MARKDOWN items"
    constants: {}
    precision: "integer basis points"
    variants:
      - name: SIMPLE_AVERAGE
        when: "request body basis = SIMPLE_AVERAGE (or program.scorecard_basis = SIMPLE_AVERAGE and basis omitted)"
        difference: |
          # each position is rounded to basis points FIRST, then the ratios are averaged
          ratio_in_stock(P)  = 10000 if P.min_units = 0 else FLOOR(covered(P) * 10000 / P.min_units)
          ratio_sell(P)      = 0     if base(P)     = 0 else FLOOR(sold(P)    * 10000 / base(P))
          in_stock_pct_bp     = ROUND_HALF_UP(mean of ratio_in_stock over included)
          sell_through_pct_bp = ROUND_HALF_UP(mean of ratio_sell    over included)
          # Every store weighs the same regardless of size — a two-unit door moves the cluster
          # as much as a two-hundred-unit door.
      - name: UNIT_WEIGHTED
        when: "request body basis = UNIT_WEIGHTED (or program.scorecard_basis = UNIT_WEIGHTED and basis omitted)"
        difference: |
          # numerators and denominators are summed across the cluster FIRST, divided once, then floored
          in_stock_pct_bp     = 10000 if sum(P.min_units) = 0
                                else FLOOR(sum(covered(P)) * 10000 / sum(P.min_units))
          sell_through_pct_bp = 0 if sum(base(P)) = 0
                                else FLOOR(sum(sold(P)) * 10000 / sum(base(P)))
          # Single division, single FLOOR — no per-position rounding to accumulate.

  - name: receipt_unit_ledger_invariant
    trigger: "Recomputed after every AllocationRun propose, commit, recall or cancel and after every Receipt close or adjust"
    algorithm: aggregation
    formula: |
      receipt.units_committed   = sum(AllocationLine.units_allocated) over lines whose run.receipt_id = receipt.id,
                                  run.status = COMMITTED and line.fulfillment_status IN {PENDING, SHIPPED, RECEIVED}
      receipt.units_unallocated = receipt.units_received - receipt.units_committed

      # Compensating invariant — MUST hold after every one of those operations:
      #   receipt.units_received = receipt.units_committed + receipt.units_unallocated
      #   0 <= receipt.units_committed <= receipt.units_received
      # A receipt adjust is the only operation that moves units_received; the invariant is
      # preserved by re-deriving units_unallocated from the corrected total, and a correction
      # that would break 0 <= units_committed <= units_received is refused outright.
      # A recall returns exactly the units the matching commit booked, so repeated
      # commit/recall cycles leave units_unallocated at its original value with zero drift.
      program.total_units_committed = sum(units_committed) over the program's receipts
      program.open_reserve_units    = program.total_units_received - program.total_units_committed
    input_set: "All AllocationLines of all COMMITTED runs of the receipt"
    constants: {}
    precision: "integer units; exact — no rounding anywhere in the ledger"

  - name: network_on_hand_invariant
    trigger: "Recomputed after every transfer approve, dispatch, receive or cancel"
    algorithm: aggregation
    formula: |
      # Conserved quantity across the transfer lifecycle for a fixed item:
      NET(item) = sum over positions of (on_hand_units + in_transit_units)
      #   approve   : moves units from available into reserved_out on the donor  -> NET unchanged
      #   dispatch  : donor on_hand -= units, receiver in_transit += units       -> NET unchanged
      #   receive   : receiver in_transit -= units, on_hand += units             -> NET unchanged
      #   cancel    : releases reserved_out                                      -> NET unchanged
      # Only line ship (DC -> store) and line confirm-receipt change NET, and they change it
      # by exactly line.units_allocated in opposite directions:
      #   ship            : NET += units_allocated   (units leave the DC and become in-transit)
      #   confirm-receipt : NET unchanged            (in_transit -> on_hand)
      # sum(size_on_hand.units) = on_hand_units MUST also hold for every position after every mutation.
    input_set: "Every StorePosition of the item, plus the item's APPROVED/DISPATCHED transfers"
    constants: {}
    precision: "integer units; exact"

# =============================================================================
# §1.4 Validation Rules Table — evaluated strictly in ascending priority.
# The first violated rule determines the response; later rules are not reached.
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and X-User-Role must be one of PlanningAdmin, Allocator, AllocationManager, StoreOperator"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role must be listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "When X-User-Role = StoreOperator, X-User-ID must equal the store the resource belongs to: storeId for GET /allocation/stores/{storeId}, position.store_id for GET /allocation/store-positions/{positionId}, line.store_id for line confirm-receipt, and recommendation.to_store_id for transfer receive"
    error_id: ERR_STORE_SCOPE_VIOLATION
    http_status: 403
    applies_to: "GET /allocation/stores/{storeId}, GET /allocation/store-positions/{positionId}, POST /allocation/allocation-lines/{lineId}/confirm-receipt, POST /allocation/transfer-recommendations/{recommendationId}/receive"

  - priority: 4
    category: business_constraint
    check: "Request body shape: every required field present, enums within their declared value set, integers within their declared ranges, monetary values at 2 decimals, datetimes ISO-8601 UTC, limit in [1,100] and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 5
    category: existence
    check: "Every path id resolves, validated left to right"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_STORE_NOT_FOUND | ERR_FIXTURE_PLAN_NOT_FOUND | ERR_SIZE_PROFILE_NOT_FOUND | ERR_ITEM_NOT_FOUND | ERR_POSITION_NOT_FOUND | ERR_RECEIPT_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_LINE_NOT_FOUND | ERR_PROMO_EVENT_NOT_FOUND | ERR_RECOMMENDATION_NOT_FOUND | ERR_ASSORTMENT_ACTION_NOT_FOUND | ERR_SNAPSHOT_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 6
    category: existence
    check: "Every FK in the request body resolves to an existing row"
    error_id: "the matching ERR_*_NOT_FOUND for the referenced entity"
    http_status: 404
    applies_to: "all POST/PATCH endpoints carrying FK fields"

  - priority: 7
    category: business_referential
    check: "Every entity referenced by a write must belong to the same AllocationProgram: item.size_profile_id -> SizeProfile of the same program; StorePosition store and item share a program; Receipt item belongs to receipt.program_id; a TransferRecommendation's two stores and its item all belong to program_id; PromoEvent.store_id belongs to program_id"
    error_id: ERR_CROSS_PROGRAM_REFERENCE
    http_status: 422
    applies_to: "POST /allocation/items, POST /allocation/store-positions, POST /allocation/receipts, POST /allocation/transfer-recommendations, POST /allocation/promo-events"

  - priority: 8
    category: state
    check: "The target entity must be in a state that permits the requested transition (see §1.2). Includes: run commit requires PROPOSED; run recall requires COMMITTED; transfer dispatch requires APPROVED; transfer receive requires DISPATCHED; line confirm-receipt requires SHIPPED; assortment action execute requires PENDING; a terminal state accepts nothing"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 9
    category: state
    check: "program.status must be ACTIVE for every allocation and transfer DECISION: receipt create, run create, propose, revise, commit, transfer create, approve, dispatch, assortment detection sweep, assortment action execute, snapshot create. Physical logistics (line ship, line confirm-receipt, transfer receive) are exempt and remain permitted while LOCKED. PLANNING and CLOSED programs reject all of the above"
    error_id: ERR_PROGRAM_LOCKED
    http_status: 409
    applies_to: "POST /allocation/receipts, POST /allocation/receipts/{receiptId}/adjust, POST /allocation/receipts/{receiptId}/allocation-runs, POST /allocation/allocation-runs/{runId}/propose, POST /allocation/allocation-runs/{runId}/revise, POST /allocation/allocation-runs/{runId}/commit, POST /allocation/transfer-recommendations, POST /allocation/transfer-recommendations/{recommendationId}/approve, POST /allocation/transfer-recommendations/{recommendationId}/dispatch, POST /allocation/_run-assortment-detection, POST /allocation/assortment-actions/{actionId}/execute, POST /allocation/performance-snapshots"

  - priority: 10
    category: state
    check: "item.lifecycle_state must be IN {SIZE_OUT_WATCH, BROKEN} to execute an AssortmentAction; a MARKDOWN item is frozen and a CONSOLIDATION_PENDING item already has a remedy in flight"
    error_id: ERR_ITEM_LIFECYCLE_BLOCKED
    http_status: 409
    applies_to: "POST /allocation/assortment-actions/{actionId}/execute"

  - priority: 11
    category: state
    check: "expected_<parent>_version in the body must equal the parent's current version (see §1.2.1)"
    error_id: "ERR_STALE_RECEIPT_VERSION | ERR_STALE_POSITION_VERSION"
    http_status: 412
    applies_to: "POST /allocation/receipts/{receiptId}/allocation-runs, POST /allocation/transfer-recommendations"

  - priority: 12
    category: business_safety
    check: "The operator performing an approval step must differ from the operator who created the proposal: run commit X-User-ID != run.proposed_by_user_id; transfer approve X-User-ID != recommendation.proposed_by_user_id (never violated by CONSOLIDATION transfers, whose proposer is 'system')"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /allocation/allocation-runs/{runId}/commit, POST /allocation/transfer-recommendations/{recommendationId}/approve"

  - priority: 13
    category: business_safety
    check: "Brand presentation standard — for every AllocationLine of the run being committed, position.available_units + position.in_transit_units + line.units_proposed must be >= the store's in-effect FixturePlan.presentation_min_units for the item's class. A store may not be left below a presentable set"
    error_id: ERR_PRESENTATION_MIN_NOT_MET
    http_status: 409
    applies_to: "POST /allocation/allocation-runs/{runId}/commit"

  - priority: 14
    category: business_constraint
    check: "Fixture capacity — for a run commit, every line must satisfy position.available_units + position.in_transit_units + line.units_proposed <= FixturePlan.capacity_units; for a transfer approve, units <= max(0, capacity_units - available_units - in_transit_units) of the receiving position; for an assortment action execute, the target store's headroom must still cover units_at_detection"
    error_id: ERR_FIXTURE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /allocation/allocation-runs/{runId}/commit, POST /allocation/transfer-recommendations/{recommendationId}/approve, POST /allocation/assortment-actions/{actionId}/execute"

  - priority: 15
    category: business_constraint
    check: "Uniqueness: (program_id, store_code) on Store; (program_id, sku_code) on Item; (program_id, event_code) on PromoEvent; (store_id, item_id) on StorePosition; (program_id, profile_code) on SizeProfile"
    error_id: "ERR_DUPLICATE_STORE_CODE | ERR_DUPLICATE_SKU_CODE | ERR_DUPLICATE_EVENT_CODE | ERR_DUPLICATE_POSITION | ERR_DUPLICATE_PROFILE_CODE"
    http_status: 409
    applies_to: "POST /allocation/stores, POST /allocation/items, POST /allocation/promo-events, POST /allocation/store-positions, POST /allocation/size-profiles"

  - priority: 16
    category: business_constraint
    check: "SizeProfile.size_curve entries must have unique size_code values and share_bp summing to exactly 10000"
    error_id: ERR_SIZE_CURVE_INVALID
    http_status: 422
    applies_to: "POST /allocation/size-profiles"

  - priority: 17
    category: business_constraint
    check: "Every size array must reconcile with its unit total: sum(size_on_hand.units) = on_hand_units on StorePosition; sum(size_received.units) = units_received on Receipt"
    error_id: ERR_SIZE_UNITS_MISMATCH
    http_status: 422
    applies_to: "POST /allocation/store-positions, POST /allocation/receipts, POST /allocation/receipts/{receiptId}/adjust"

  - priority: 18
    category: business_constraint
    check: "Every size_code appearing in a size array must exist in the item's SizeProfile.size_curve"
    error_id: ERR_SIZE_CODE_UNKNOWN
    http_status: 422
    applies_to: "POST /allocation/store-positions, POST /allocation/receipts, POST /allocation/receipts/{receiptId}/adjust"

  - priority: 19
    category: business_constraint
    check: "Item.item_class must equal the referenced SizeProfile.item_class"
    error_id: ERR_ITEM_CLASS_MISMATCH
    http_status: 422
    applies_to: "POST /allocation/items"

  - priority: 20
    category: business_constraint
    check: "AllocationRun.method must correspond to the item's resolved replenishment_model (MIN_MAX <-> MIN_MAX_TOPUP, DEMAND_DRIVEN <-> DEMAND_DRIVEN, PUSH <-> PUSH_SIZE_PROFILE)"
    error_id: ERR_METHOD_MODEL_MISMATCH
    http_status: 422
    applies_to: "POST /allocation/receipts/{receiptId}/allocation-runs"

  - priority: 21
    category: business_constraint
    check: "A transfer's from_store_id and to_store_id must differ"
    error_id: ERR_SAME_STORE_TRANSFER
    http_status: 422
    applies_to: "POST /allocation/transfer-recommendations"

  - priority: 22
    category: business_temporal
    check: "FixturePlan intervals are HALF-OPEN [effective_from, effective_to) with NO buffer: two plans for the same (store_id, item_class) conflict only when their half-open intervals intersect. A new plan starting exactly at an existing plan's effective_to is allowed (adjacency, zero gap). effective_to = null means +infinity"
    error_id: ERR_FIXTURE_PLAN_OVERLAP
    http_status: 409
    applies_to: "POST /allocation/fixture-plans"

  - priority: 23
    category: business_temporal
    check: "PromoEvent windows are CLOSED intervals [start_date, end_date] expanded by PROMO_BUFFER_DAYS = 1 day on BOTH ends before the intersection test. Two events conflict only when they share the same scope AND the same target (same store_id for STORE, same cluster_code for CLUSTER, program-wide for PROGRAM) AND overlapping item_class (equal, or either null), and only when the incumbent's status is SCHEDULED or ACTIVE. Checked at create AND again at schedule"
    error_id: ERR_PROMO_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /allocation/promo-events, POST /allocation/promo-events/{eventId}/schedule"

  - priority: 24
    category: business_temporal
    check: "A PROPOSED TransferRecommendation may only be approved while the logical clock is strictly before expires_at; at or past expires_at it is no longer approvable"
    error_id: ERR_TRANSFER_EXPIRED
    http_status: 409
    applies_to: "POST /allocation/transfer-recommendations/{recommendationId}/approve"

  - priority: 25
    category: business_temporal
    check: "The store must have exactly one FixturePlan for the item's item_class whose half-open interval contains the logical clock; propose, commit, transfer approve and detection all need it"
    error_id: ERR_NO_FIXTURE_PLAN_IN_EFFECT
    http_status: 422
    applies_to: "POST /allocation/allocation-runs/{runId}/propose, POST /allocation/allocation-runs/{runId}/commit, POST /allocation/transfer-recommendations/{recommendationId}/approve, POST /allocation/_run-assortment-detection"

  - priority: 26
    category: business_constraint
    check: "Store status eligibility: a transfer receiver must be ACTIVE at dispatch time; a CLOSING store may donate but never receive; a REMODEL or CLOSING store never enters an allocation candidate set"
    error_id: ERR_STORE_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /allocation/transfer-recommendations, POST /allocation/transfer-recommendations/{recommendationId}/dispatch"

  - priority: 27
    category: business_constraint
    check: "A Store may only reach CLOSED when every one of its StorePositions has on_hand_units = 0"
    error_id: ERR_STORE_HAS_INVENTORY
    http_status: 409
    applies_to: "POST /allocation/stores/{storeId}/status"

  - priority: 28
    category: business_constraint
    check: "A COMMITTED run may only be recalled while every one of its AllocationLines is still PENDING"
    error_id: ERR_LINE_ALREADY_SHIPPED
    http_status: 409
    applies_to: "POST /allocation/allocation-runs/{runId}/recall"

  - priority: 29
    category: business_constraint
    check: "transfer_size_split must find at least one candidate size (see §1.3): for REBALANCE, a CORE size the receiver is out of and the donor has; for CONSOLIDATION, any size the donor holds"
    error_id: ERR_TRANSFER_SIZE_INFEASIBLE
    http_status: 422
    applies_to: "POST /allocation/transfer-recommendations, POST /allocation/assortment-actions/{actionId}/execute"

  - priority: 30
    category: business_constraint
    check: "At least one store must survive the proration candidate filter (ACTIVE store, existing StorePosition, item not MARKDOWN)"
    error_id: ERR_NO_ELIGIBLE_STORES
    http_status: 422
    applies_to: "POST /allocation/allocation-runs/{runId}/propose"

  - priority: 31
    category: business_constraint
    check: "The candidate set's total need must be > 0 and the receipt must still have unallocated units"
    error_id: ERR_ZERO_NETWORK_NEED
    http_status: 409
    applies_to: "POST /allocation/allocation-runs/{runId}/propose"

  - priority: 32
    category: business_constraint
    check: "A performance snapshot needs at least one included StorePosition in the requested cluster"
    error_id: ERR_NO_CLUSTER_POSITIONS
    http_status: 422
    applies_to: "POST /allocation/performance-snapshots"

  - priority: 33
    category: business_fiscal
    check: "The donor position must hold enough uncommitted stock: position.available_units >= units at both create and approve time"
    error_id: ERR_INSUFFICIENT_DONOR_UNITS
    http_status: 409
    applies_to: "POST /allocation/transfer-recommendations, POST /allocation/transfer-recommendations/{recommendationId}/approve"

  - priority: 34
    category: business_fiscal
    check: "Freight worthiness — for source_reason = REBALANCE only, benefit_ratio_bp >= program.transfer_min_ratio_bp (equality passes). CONSOLIDATION transfers are exempt"
    error_id: ERR_BENEFIT_RATIO_BELOW_THRESHOLD
    http_status: 409
    applies_to: "POST /allocation/transfer-recommendations/{recommendationId}/approve"

  - priority: 35
    category: business_fiscal
    check: "The receipt pool ceiling, enforced on both sides of the ledger: a commit may never book more units than the receipt still has (sum(line.units_proposed) <= receipt.units_unallocated), and a receipt adjustment may never cut units_received below the units already committed (units_received >= receipt.units_committed)"
    error_id: ERR_RECEIPT_UNITS_EXCEEDED
    http_status: 409
    applies_to: "POST /allocation/allocation-runs/{runId}/commit, POST /allocation/receipts/{receiptId}/adjust"

# =============================================================================
# §1.5 API Endpoint Table — 66 endpoints. Flat collection surface: every entity
# lives at /allocation/<collection>[/{id}] and every FK is reverse-reachable
# through the collection's filtered list GET.
# =============================================================================
endpoints:
  # --- AllocationProgram -----------------------------------------------------
  - method: POST
    path: "/allocation/programs"
    description: "Create an allocation program in PLANNING"
    roles: [PlanningAdmin]
    code: 201
    input: [name, season_code, banner_code, "transfer_min_ratio_bp?", "scorecard_basis?"]
    output: AllocationProgram
    side_effects:
      - "status = PLANNING; transfer_min_ratio_bp defaults to 15000; scorecard_basis defaults to UNIT_WEIGHTED"
      - "total_units_received, total_units_committed and open_reserve_units initialise to 0"

  - method: GET
    path: "/allocation/programs/{programId}"
    description: "Read one program with its live unit ledger"
    roles: [PlanningAdmin, Allocator, AllocationManager]
    code: 200
    input: []
    output: AllocationProgram
    side_effects: []

  - method: POST
    path: "/allocation/programs/{programId}/activate"
    description: "PLANNING -> ACTIVE; opens the program for receipts, runs and transfers"
    roles: [PlanningAdmin]
    code: 200
    input: []
    output: AllocationProgram
    side_effects:
      - "state transition PLANNING -> ACTIVE per §1.2"
      - "increments AllocationProgram.version by 1"

  - method: POST
    path: "/allocation/programs/{programId}/lock"
    description: "ACTIVE -> LOCKED; freezes allocation and transfer decisions but not physical logistics"
    roles: [AllocationManager]
    code: 200
    input: [reason]
    output: AllocationProgram
    side_effects:
      - "sets locked_at = logical clock and lock_reason = reason"
      - "increments AllocationProgram.version by 1"

  - method: POST
    path: "/allocation/programs/{programId}/unlock"
    description: "LOCKED -> ACTIVE; clears locked_at and lock_reason"
    roles: [AllocationManager]
    code: 200
    input: []
    output: AllocationProgram
    side_effects:
      - "sets locked_at = null and lock_reason = null"
      - "increments AllocationProgram.version by 1"

  - method: POST
    path: "/allocation/programs/{programId}/close"
    description: "ACTIVE or LOCKED -> CLOSED (terminal); closes open receipts and cancels pending assortment actions"
    roles: [PlanningAdmin]
    code: 200
    input: []
    output: AllocationProgram
    side_effects:
      - "cascades Receipt STAGED/ALLOCATING/ALLOCATED -> CLOSED"
      - "cascades AssortmentAction PENDING -> CANCELLED"
      - "increments AllocationProgram.version by 1"

  # --- Store ---------------------------------------------------------------
  - method: POST
    path: "/allocation/stores"
    description: "Register a store in the program"
    roles: [PlanningAdmin]
    code: 201
    input: [program_id, store_code, grade, grade_index_bp, cluster_code, freight_flat_usd, historical_sell_through_bp]
    output: Store
    side_effects:
      - "status = ACTIVE"
      - "enforces (program_id, store_code) uniqueness"

  - method: GET
    path: "/allocation/stores/{storeId}"
    description: "Read one store; a StoreOperator may only read its own store"
    roles: [PlanningAdmin, Allocator, AllocationManager, StoreOperator]
    code: 200
    input: []
    output: Store
    side_effects: []

  - method: GET
    path: "/allocation/stores"
    description: "List stores, filterable by program, cluster, status and grade"
    roles: [PlanningAdmin, Allocator, AllocationManager]
    code: 200
    input: ["program_id?", "cluster_code?", "status?", "grade?", "limit?", "offset?"]
    output: Store[]
    side_effects: []

  - method: POST
    path: "/allocation/stores/{storeId}/status"
    description: "Drive the Store lifecycle: ACTIVE <-> REMODEL, ACTIVE -> CLOSING -> CLOSED"
    roles: [PlanningAdmin]
    code: 200
    input: [target_status]
    output: Store
    side_effects:
      - "state transition per §1.2; CLOSED requires every position at on_hand_units = 0"
      - "on CLOSED, sets assortment_status = EXITED on every position and re-derives every affected Item.lifecycle_state"
      - "increments Store.version by 1"

  # --- FixturePlan ---------------------------------------------------------
  - method: POST
    path: "/allocation/fixture-plans"
    description: "Publish a shelf plan for one merchandise class in one store over a half-open interval"
    roles: [PlanningAdmin]
    code: 201
    input: [store_id, item_class, effective_from, "effective_to?", fixture_count, facings_per_fixture, units_per_facing, presentation_min_units]
    output: FixturePlan
    side_effects:
      - "computes capacity_units = fixture_count * facings_per_fixture * units_per_facing"
      - "rejects half-open interval overlaps for the same (store_id, item_class); adjacency is allowed"

  - method: GET
    path: "/allocation/fixture-plans/{fixturePlanId}"
    description: "Read one shelf plan"
    roles: [PlanningAdmin, Allocator, AllocationManager]
    code: 200
    input: []
    output: FixturePlan
    side_effects: []

  - method: GET
    path: "/allocation/fixture-plans"
    description: "List shelf plans, filterable by store and class"
    roles: [PlanningAdmin, Allocator, AllocationManager]
    code: 200
    input: ["store_id?", "item_class?", "limit?", "offset?"]
    output: FixturePlan[]
    side_effects: []

  # --- SizeProfile ---------------------------------------------------------
  - method: POST
    path: "/allocation/size-profiles"
    description: "Create an immutable size curve"
    roles: [PlanningAdmin]
    code: 201
    input: [program_id, profile_code, item_class, size_curve, "core_size_min_share_bp?"]
    output: SizeProfile
    side_effects:
      - "validates unique size_code values and sum(share_bp) = 10000"
      - "computes size_count and core_size_count using core_size_min_share_bp (default 1500)"

  - method: GET
    path: "/allocation/size-profiles/{sizeProfileId}"
    description: "Read one size curve"
    roles: [PlanningAdmin, Allocator, AllocationManager]
    code: 200
    input: []
    output: SizeProfile
    side_effects: []

  - method: GET
    path: "/allocation/size-profiles"
    description: "List size curves, filterable by program and class"
    roles: [PlanningAdmin, Allocator, AllocationManager]
    code: 200
    input: ["program_id?", "item_class?", "limit?", "offset?"]
    output: SizeProfile[]
    side_effects: []

  # --- Item ----------------------------------------------------------------
  - method: POST
    path: "/allocation/items"
    description: "Create a SKU and resolve its replenishment model"
    roles: [PlanningAdmin]
    code: 201
    input: [program_id, sku_code, style_code, item_class, item_type, size_profile_id, unit_cost_usd, retail_price_usd, "replenishment_model_override?"]
    output: Item
    side_effects:
      - "runs calculations.replenishment_model_resolution to set replenishment_model"
      - "lifecycle_state = ACTIVE; broken_store_count and size_out_store_count = 0"
      - "enforces item_class = size_profile.item_class and (program_id, sku_code) uniqueness"

  - method: GET
    path: "/allocation/items/{itemId}"
    description: "Read one SKU with its resolved model and lifecycle state"
    roles: [PlanningAdmin, Allocator, AllocationManager]
    code: 200
    input: []
    output: Item
    side_effects: []

  - method: GET
    path: "/allocation/items"
    description: "List SKUs, filterable by program, size profile, type and lifecycle state"
    roles: [PlanningAdmin, Allocator, AllocationManager]
    code: 200
    input: ["program_id?", "size_profile_id?", "item_type?", "lifecycle_state?", "limit?", "offset?"]
    output: Item[]
    side_effects: []

  - method: PATCH
    path: "/allocation/items/{itemId}"
    description: "Override the replenishment model or re-ticket the retail price"
    roles: [PlanningAdmin]
    code: 200
    input: ["replenishment_model_override?", "retail_price_usd?"]
    output: Item
    side_effects:
      - "re-runs calculations.replenishment_model_resolution"
      - "increments Item.version by 1"

  # --- StorePosition -------------------------------------------------------
  - method: POST
    path: "/allocation/store-positions"
    description: "Open the Store x Item junction with its opening stock, size mix and min/max policy"
    roles: [PlanningAdmin, Allocator]
    code: 201
    input: [store_id, item_id, on_hand_units, size_on_hand, "on_order_units?", min_units, max_units, weekly_forecast_units, trailing_4wk_sales_units]
    output: StorePosition
    side_effects:
      - "validates sum(size_on_hand.units) = on_hand_units and every size_code against the item's SizeProfile"
      - "runs calculations.assortment_health_derivation to set broken_size_count, stock_status and assortment_status"
      - "recomputes Item.broken_store_count / size_out_store_count and re-derives Item.lifecycle_state"
      - "enforces (store_id, item_id) uniqueness"

  - method: GET
    path: "/allocation/store-positions/{positionId}"
    description: "Read one position with both derived status dimensions; a StoreOperator may only read its own store's positions"
    roles: [PlanningAdmin, Allocator, AllocationManager, StoreOperator]
    code: 200
    input: []
    output: StorePosition
    side_effects: []

  - method: GET
    path: "/allocation/store-positions"
    description: "List positions, filterable by store, item and either derived status dimension"
    roles: [PlanningAdmin, Allocator, AllocationManager]
    code: 200
    input: ["store_id?", "item_id?", "stock_status?", "assortment_status?", "limit?", "offset?"]
    output: StorePosition[]
    side_effects: []

  - method: PATCH
    path: "/allocation/store-positions/{positionId}"
    description: "Adjust min/max policy, forecast, trailing sales or on-order visibility"
    roles: [PlanningAdmin, Allocator]
    code: 200
    input: ["min_units?", "max_units?", "weekly_forecast_units?", "trailing_4wk_sales_units?", "on_order_units?"]
    output: StorePosition
    side_effects:
      - "re-derives stock_status (assortment_status is unaffected — the dimensions are independent)"
      - "increments StorePosition.version by 1"

  # --- Receipt -------------------------------------------------------------
  - method: POST
    path: "/allocation/receipts"
    description: "Book a DC receipt for one SKU"
    roles: [PlanningAdmin, Allocator]
    code: 201
    input: [program_id, item_id, reference, units_received, size_received, receipt_date]
    output: Receipt
    side_effects:
      - "status = STAGED; units_committed = 0; units_unallocated = units_received"
      - "validates sum(size_received.units) = units_received and every size_code against the item's SizeProfile"
      - "recomputes program.total_units_received and open_reserve_units"

  - method: GET
    path: "/allocation/receipts/{receiptId}"
    description: "Read one receipt with its live unit ledger and current version"
    roles: [PlanningAdmin, Allocator, AllocationManager]
    code: 200
    input: []
    output: Receipt
    side_effects: []

  - method: GET
    path: "/allocation/receipts"
    description: "List receipts, filterable by program, item and status"
    roles: [PlanningAdmin, Allocator, AllocationManager]
    code: 200
    input: ["program_id?", "item_id?", "status?", "limit?", "offset?"]
    output: Receipt[]
    side_effects: []

  - method: POST
    path: "/allocation/receipts/{receiptId}/close"
    description: "ALLOCATING or ALLOCATED -> CLOSED; abandons any open spread"
    roles: [AllocationManager]
    code: 200
    input: []
    output: Receipt
    side_effects:
      - "cascades AllocationRun DRAFT/PROPOSED -> CANCELLED and their AllocationLines -> RECALLED"
      - "increments Receipt.version by 1"

  - method: POST
    path: "/allocation/receipts/{receiptId}/adjust"
    description: "Correct the DC count on a STAGED or ALLOCATING receipt after a recount, shrinkage write-off or mis-ship. The unit ledger is re-derived from the corrected total; the correction may never fall below what has already been committed"
    roles: [PlanningAdmin, Allocator]
    code: 200
    input: [units_received, size_received, adjustment_reason]
    output: Receipt
    side_effects:
      - "requires status IN {STAGED, ALLOCATING}; the status itself never changes"
      - "validates sum(size_received.units) = units_received and every size_code against the item's SizeProfile"
      - "re-derives units_unallocated = units_received - units_committed and rejects any correction that would leave units_committed > units_received"
      - "recomputes program.total_units_received and open_reserve_units"
      - "increments Receipt.version by 1"
    note: "A correction can strand an already-PROPOSED run: its lines were sized against the old pool, so the pool ceiling at priority 35 is what stops the commit."

  # --- AllocationRun -------------------------------------------------------
  - method: POST
    path: "/allocation/receipts/{receiptId}/allocation-runs"
    description: "Open a new spread against the receipt. Requires expected_receipt_version — creation supersedes any DRAFT/PROPOSED sibling run, so a stale view of the receipt is rejected with 412 (§1.2.1 run-create-stale-receipt)"
    roles: [Allocator]
    code: 201
    input: [method, need_basis, expected_receipt_version]
    output: AllocationRun
    side_effects:
      - "status = DRAFT; proposed_by_user_id = X-User-ID"
      - "transitions any DRAFT/PROPOSED sibling run to CANCELLED, sets supersedes_run_id to it, and RECALLS its lines"
      - "transitions the receipt STAGED -> ALLOCATING on the first run"
      - "validates method against the item's resolved replenishment_model"
      - "increments Receipt.version by 1"

  - method: GET
    path: "/allocation/allocation-runs/{runId}"
    description: "Read one run with its proposal totals"
    roles: [PlanningAdmin, Allocator, AllocationManager]
    code: 200
    input: []
    output: AllocationRun
    side_effects: []

  - method: GET
    path: "/allocation/allocation-runs"
    description: "List runs, filterable by receipt, superseded run and status"
    roles: [PlanningAdmin, Allocator, AllocationManager]
    code: 200
    input: ["receipt_id?", "supersedes_run_id?", "status?", "limit?", "offset?"]
    output: AllocationRun[]
    side_effects: []

  - method: POST
    path: "/allocation/allocation-runs/{runId}/propose"
    description: "DRAFT -> PROPOSED; prorates the receipt pool across candidate stores and materialises AllocationLines"
    roles: [Allocator]
    code: 200
    input: []
    output: AllocationRun
    side_effects:
      - "runs promo_lift_factor_bp, store_need_units, receipt_proration and size_breakdown_split"
      - "creates one AllocationLine per store with units_proposed > 0, each with need_units, size_breakdown, capacity_capped_units and presentation_gap_units"
      - "sets units_proposed, unallocated_remainder_units and eligible_store_count"
      - "increments AllocationRun.version by 1"
    note: "presentation_gap_units is RECORDED here but only ENFORCED at commit — a proposal may legally sit below a presentation minimum. A receipt carries at most one non-terminal run at any time, because run creation supersedes the previous one."

  - method: POST
    path: "/allocation/allocation-runs/{runId}/revise"
    description: "PROPOSED -> DRAFT; discards the spread so inputs can be changed and re-proposed"
    roles: [Allocator]
    code: 200
    input: []
    output: AllocationRun
    side_effects:
      - "deletes every AllocationLine of the run and resets the run's totals to 0"
      - "increments AllocationRun.version by 1"

  - method: POST
    path: "/allocation/allocation-runs/{runId}/commit"
    description: "PROPOSED -> COMMITTED; books units against the receipt ledger. Committer must differ from proposer"
    roles: [AllocationManager]
    code: 200
    input: []
    output: AllocationRun
    side_effects:
      - "enforces segregation of duties, presentation minimums, fixture capacity and the receipt pool ceiling in that priority order"
      - "sets line.units_allocated = line.units_proposed and fulfillment_status = PENDING on every line"
      - "recomputes receipt.units_committed / units_unallocated and may transition the receipt ALLOCATING -> ALLOCATED"
      - "recomputes program.total_units_committed and open_reserve_units"
      - "increments AllocationRun.version by 1"

  - method: POST
    path: "/allocation/allocation-runs/{runId}/recall"
    description: "COMMITTED -> RECALLED; returns every booked unit to the receipt pool"
    roles: [AllocationManager]
    code: 200
    input: []
    output: AllocationRun
    side_effects:
      - "requires every line still PENDING"
      - "sets line.units_allocated = 0 and fulfillment_status = RECALLED on every line"
      - "recomputes the receipt ledger and may transition the receipt ALLOCATED -> ALLOCATING"
      - "recomputes program.total_units_committed and open_reserve_units"
      - "increments AllocationRun.version by 1"

  - method: POST
    path: "/allocation/allocation-runs/{runId}/cancel"
    description: "DRAFT or PROPOSED -> CANCELLED; abandons the spread without booking anything"
    roles: [Allocator, AllocationManager]
    code: 200
    input: []
    output: AllocationRun
    side_effects:
      - "RECALLS every line of a PROPOSED run"
      - "increments AllocationRun.version by 1"

  # --- AllocationLine ------------------------------------------------------
  - method: GET
    path: "/allocation/allocation-lines/{lineId}"
    description: "Read one allocation line with its size breakdown and capacity/presentation diagnostics"
    roles: [PlanningAdmin, Allocator, AllocationManager]
    code: 200
    input: []
    output: AllocationLine
    side_effects: []

  - method: GET
    path: "/allocation/allocation-lines"
    description: "List allocation lines, filterable by run, store and fulfillment status — the only discovery channel for lines created by propose"
    roles: [PlanningAdmin, Allocator, AllocationManager]
    code: 200
    input: ["run_id?", "store_id?", "fulfillment_status?", "limit?", "offset?"]
    output: AllocationLine[]
    side_effects: []

  - method: POST
    path: "/allocation/allocation-lines/{lineId}/ship"
    description: "PENDING -> SHIPPED; the DC releases the units and they become in-transit to the store. Permitted while the program is LOCKED"
    roles: [AllocationManager]
    code: 200
    input: []
    output: AllocationLine
    side_effects:
      - "adds units_allocated to the destination StorePosition.in_transit_units and re-derives its stock_status"
      - "increments AllocationLine.version by 1"

  - method: POST
    path: "/allocation/allocation-lines/{lineId}/confirm-receipt"
    description: "SHIPPED -> RECEIVED; the store books the units onto the floor. StoreOperator-exclusive and scoped to the line's own store"
    roles: [StoreOperator]
    code: 200
    input: []
    output: AllocationLine
    side_effects:
      - "moves units_allocated from in_transit_units into on_hand_units and merges size_breakdown into size_on_hand"
      - "clears consolidated_out when on_hand_units becomes > 0"
      - "re-derives broken_size_count, stock_status and assortment_status, then Item.broken_store_count / size_out_store_count and Item.lifecycle_state"
      - "increments AllocationLine.version by 1"

  # --- PromoEvent ----------------------------------------------------------
  - method: POST
    path: "/allocation/promo-events"
    description: "Create a promotional or event lift in DRAFT; window conflicts are rejected at creation as well as at schedule"
    roles: [PlanningAdmin]
    code: 201
    input: [program_id, event_code, scope, "cluster_code?", "store_id?", "item_class?", start_date, end_date, lift_factor_bp]
    output: PromoEvent
    side_effects:
      - "status = DRAFT"
      - "requires cluster_code exactly when scope = CLUSTER and store_id exactly when scope = STORE"
      - "rejects a buffered window conflict against SCHEDULED/ACTIVE events of the same scope and target"

  - method: GET
    path: "/allocation/promo-events/{eventId}"
    description: "Read one promotional event"
    roles: [PlanningAdmin, Allocator, AllocationManager]
    code: 200
    input: []
    output: PromoEvent
    side_effects: []

  - method: GET
    path: "/allocation/promo-events"
    description: "List promotional events, filterable by program, store, scope and status"
    roles: [PlanningAdmin, Allocator, AllocationManager]
    code: 200
    input: ["program_id?", "store_id?", "scope?", "status?", "limit?", "offset?"]
    output: PromoEvent[]
    side_effects: []

  - method: POST
    path: "/allocation/promo-events/{eventId}/schedule"
    description: "DRAFT -> SCHEDULED; re-checks the buffered window conflict against every SCHEDULED/ACTIVE peer"
    roles: [PlanningAdmin]
    code: 200
    input: []
    output: PromoEvent
    side_effects:
      - "increments PromoEvent.version by 1"

  - method: POST
    path: "/allocation/promo-events/{eventId}/activate"
    description: "SCHEDULED -> ACTIVE; the lift becomes visible to FORWARD_LOOKING need calculations"
    roles: [PlanningAdmin]
    code: 200
    input: []
    output: PromoEvent
    side_effects:
      - "the event enters the promo_lift_factor_bp candidate set"
      - "increments PromoEvent.version by 1"

  - method: POST
    path: "/allocation/promo-events/{eventId}/end"
    description: "ACTIVE -> ENDED (terminal); the lift stops applying"
    roles: [PlanningAdmin]
    code: 200
    input: []
    output: PromoEvent
    side_effects:
      - "the event leaves the promo_lift_factor_bp candidate set"
      - "increments PromoEvent.version by 1"

  - method: POST
    path: "/allocation/promo-events/{eventId}/cancel"
    description: "DRAFT, SCHEDULED or ACTIVE -> CANCELLED (terminal)"
    roles: [PlanningAdmin]
    code: 200
    input: []
    output: PromoEvent
    side_effects:
      - "the event leaves the promo_lift_factor_bp candidate set"
      - "increments PromoEvent.version by 1"

  # --- TransferRecommendation ----------------------------------------------
  - method: POST
    path: "/allocation/transfer-recommendations"
    description: "Propose a store-to-store rebalance. Requires expected_from_position_version — creation supersedes any PROPOSED peer on the same (from_store, to_store, item) triple and stakes a claim on donor stock, so a stale view of the donor position is rejected with 412 (§1.2.1 transfer-create-stale-position)"
    roles: [Allocator]
    code: 201
    input: [program_id, from_store_id, to_store_id, item_id, units, expected_from_position_version]
    output: TransferRecommendation
    side_effects:
      - "status = PROPOSED; source_reason = REBALANCE; proposed_by_user_id = X-User-ID"
      - "runs transfer_size_split (REBALANCE mode), transfer_landed_cost_usd, transfer_benefit_usd and transfer_benefit_ratio_bp"
      - "sets expires_at = logical clock + TRANSFER_TTL_DAYS (7 days)"
      - "transitions any PROPOSED peer on the same triple to CANCELLED with reject_reason = 'superseded' and records supersedes_recommendation_id"
      - "increments the donor StorePosition.version by 1 to record the new claim against it"

  - method: GET
    path: "/allocation/transfer-recommendations/{recommendationId}"
    description: "Read one recommendation with its freight economics"
    roles: [PlanningAdmin, Allocator, AllocationManager]
    code: 200
    input: []
    output: TransferRecommendation
    side_effects: []

  - method: GET
    path: "/allocation/transfer-recommendations"
    description: "List recommendations, filterable by program, donor, receiver, item, superseded peer, originating assortment action and status — the only discovery channel for CONSOLIDATION transfers created by action execution"
    roles: [PlanningAdmin, Allocator, AllocationManager]
    code: 200
    input: ["program_id?", "from_store_id?", "to_store_id?", "item_id?", "supersedes_recommendation_id?", "assortment_action_id?", "status?", "limit?", "offset?"]
    output: TransferRecommendation[]
    side_effects: []

  - method: POST
    path: "/allocation/transfer-recommendations/{recommendationId}/approve"
    description: "PROPOSED -> APPROVED; reserves donor units. Approver must differ from proposer; REBALANCE transfers must clear the freight-worthiness ratio"
    roles: [AllocationManager]
    code: 200
    input: []
    output: TransferRecommendation
    side_effects:
      - "enforces expiry, segregation of duties, the benefit ratio gate (REBALANCE only), donor sufficiency and receiver capacity in that priority order"
      - "adds units to the donor position's reserved_out_units, lowering available_units, and re-derives its stock_status"
      - "sets approved_by_user_id = X-User-ID"
      - "increments TransferRecommendation.version by 1"

  - method: POST
    path: "/allocation/transfer-recommendations/{recommendationId}/reject"
    description: "PROPOSED -> REJECTED (terminal)"
    roles: [AllocationManager]
    code: 200
    input: [reason]
    output: TransferRecommendation
    side_effects:
      - "sets reject_reason = reason"
      - "increments TransferRecommendation.version by 1"

  - method: POST
    path: "/allocation/transfer-recommendations/{recommendationId}/dispatch"
    description: "APPROVED -> DISPATCHED; the units physically leave the donor. Receiver must be ACTIVE"
    roles: [AllocationManager]
    code: 200
    input: []
    output: TransferRecommendation
    side_effects:
      - "subtracts units from the donor position's on_hand_units and size_on_hand and clears the reservation"
      - "adds units to the receiver position's in_transit_units"
      - "re-derives both positions' broken_size_count, stock_status and assortment_status, then the Item lifecycle"
      - "increments TransferRecommendation.version by 1"

  - method: POST
    path: "/allocation/transfer-recommendations/{recommendationId}/receive"
    description: "DISPATCHED -> RECEIVED (terminal); the receiving store books the units. StoreOperator-exclusive and scoped to to_store_id"
    roles: [StoreOperator]
    code: 200
    input: []
    output: TransferRecommendation
    side_effects:
      - "moves units from the receiver position's in_transit_units into on_hand_units and merges size_split into size_on_hand"
      - "sets consolidated_out = true on the donor position when it empties and source_reason = CONSOLIDATION"
      - "re-derives both positions' assortment_status and stock_status"
      - "recomputes Item.broken_store_count / size_out_store_count and re-derives Item.lifecycle_state, including CONSOLIDATION_PENDING -> ACTIVE"
      - "transitions any now-satisfied PENDING AssortmentAction for the receiver's (item, store) to SUPERSEDED"
      - "increments TransferRecommendation.version by 1"

  - method: POST
    path: "/allocation/transfer-recommendations/{recommendationId}/cancel"
    description: "APPROVED -> CANCELLED (terminal); releases the donor reservation"
    roles: [AllocationManager]
    code: 200
    input: [reason]
    output: TransferRecommendation
    side_effects:
      - "releases units from the donor position's reserved_out_units and re-derives its stock_status"
      - "sets reject_reason = reason"
      - "increments TransferRecommendation.version by 1"

  # --- AssortmentAction ----------------------------------------------------
  - method: POST
    path: "/allocation/_run-assortment-detection"
    description: "Test-driving sweep: scans every StorePosition of the program for size-out and broken-assortment conditions and raises one PENDING AssortmentAction per newly degraded position, choosing CONSOLIDATION or MARKDOWN per calculations.assortment_remedy_selection. Results are ordered by (store_code ASC, sku_code ASC)"
    roles: [Allocator, AllocationManager]
    code: 200
    input: [program_id]
    output: AssortmentAction[]
    side_effects:
      - "skips positions that already have a PENDING AssortmentAction for the same (item_id, store_id)"
      - "skips EXITED positions, non-ACTIVE/REMODEL stores and MARKDOWN items"
      - "runs assortment_remedy_selection and markdown_depth_bp for each raised action"
      - "snapshots broken_size_count and available_units onto the action"

  - method: GET
    path: "/allocation/assortment-actions/{actionId}"
    description: "Read one assortment action with its chosen remedy"
    roles: [PlanningAdmin, Allocator, AllocationManager]
    code: 200
    input: []
    output: AssortmentAction
    side_effects: []

  - method: GET
    path: "/allocation/assortment-actions"
    description: "List assortment actions, filterable by item, store, consolidation target, type and status — the only discovery channel for actions raised by the detection sweep"
    roles: [PlanningAdmin, Allocator, AllocationManager]
    code: 200
    input: ["item_id?", "store_id?", "consolidation_target_store_id?", "action_type?", "status?", "limit?", "offset?"]
    output: AssortmentAction[]
    side_effects: []

  - method: POST
    path: "/allocation/assortment-actions/{actionId}/execute"
    description: "PENDING -> EXECUTED; a CONSOLIDATION action creates the sweep-up transfer, a MARKDOWN action retires the item"
    roles: [AllocationManager]
    code: 200
    input: []
    output: AssortmentAction
    side_effects:
      - "for CONSOLIDATION: creates a TransferRecommendation with source_reason = CONSOLIDATION, units = units_at_detection, assortment_action_id set and proposed_by_user_id = 'system', then transitions the Item BROKEN -> CONSOLIDATION_PENDING"
      - "for MARKDOWN: transitions the Item to MARKDOWN (terminal), removing it from every future candidate set"
      - "increments AssortmentAction.version by 1"

  - method: POST
    path: "/allocation/assortment-actions/{actionId}/cancel"
    description: "PENDING -> CANCELLED (terminal); the remedy is waived"
    roles: [AllocationManager]
    code: 200
    input: []
    output: AssortmentAction
    side_effects:
      - "increments AssortmentAction.version by 1"

  # --- PerformanceSnapshot -------------------------------------------------
  - method: POST
    path: "/allocation/performance-snapshots"
    description: "Measure a cluster's in-stock, sell-through and allocation accuracy under the requested basis"
    roles: [Allocator, AllocationManager]
    code: 201
    input: [program_id, cluster_code, "basis?"]
    output: PerformanceSnapshot
    side_effects:
      - "basis defaults to program.scorecard_basis when omitted"
      - "runs calculations.cluster_scorecard; rejects an empty cluster with ERR_NO_CLUSTER_POSITIONS"
      - "sets as_of_date = logical clock; the snapshot is immutable once created"

  - method: GET
    path: "/allocation/performance-snapshots/{snapshotId}"
    description: "Read one cluster scorecard"
    roles: [PlanningAdmin, Allocator, AllocationManager]
    code: 200
    input: []
    output: PerformanceSnapshot
    side_effects: []

  - method: GET
    path: "/allocation/performance-snapshots"
    description: "List cluster scorecards, filterable by program and cluster"
    roles: [PlanningAdmin, Allocator, AllocationManager]
    code: 200
    input: ["program_id?", "cluster_code?", "limit?", "offset?"]
    output: PerformanceSnapshot[]
    side_effects: []

  # --- Sweeps and logical clock --------------------------------------------
  - method: POST
    path: "/allocation/_run-transfer-expiry"
    description: "Test-driving sweep: expires every PROPOSED TransferRecommendation of the program whose expires_at is at or before the logical clock"
    roles: [AllocationManager]
    code: 200
    input: [program_id]
    output: TransferRecommendation[]
    side_effects:
      - "transitions each matching recommendation PROPOSED -> EXPIRED and increments its version by 1"
      - "APPROVED and DISPATCHED recommendations are never expired"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time. Every window, expiry and as-of computation reads this clock"
    roles: [PlanningAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "all subsequent FixturePlan interval, PromoEvent window, transfer expiry and snapshot as_of_date evaluations use the new instant"

# =============================================================================
# §1.6 Error Code Catalog — 51 codes, every one triggerable from an empty DB
# through the §1.5 surface.
# =============================================================================
errors:
  # --- auth ----------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header is missing, or X-User-Role is not one of the four declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting X-User-Role is not listed in the endpoint's roles"
  - id: ERR_STORE_SCOPE_VIOLATION
    http: 403
    condition: "A StoreOperator acted on a store, position, allocation line or inbound transfer that does not belong to its own store"

  # --- request shape -------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum value, out-of-range integer, malformed datetime, non-2-decimal money value, or limit/offset outside [1,100] / [0,inf)"

  # --- existence -----------------------------------------------------------
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "programId in the path or program_id in the body does not resolve"
  - id: ERR_STORE_NOT_FOUND
    http: 404
    condition: "storeId in the path or any store FK in the body does not resolve"
  - id: ERR_FIXTURE_PLAN_NOT_FOUND
    http: 404
    condition: "fixturePlanId does not resolve"
  - id: ERR_SIZE_PROFILE_NOT_FOUND
    http: 404
    condition: "sizeProfileId or size_profile_id does not resolve"
  - id: ERR_ITEM_NOT_FOUND
    http: 404
    condition: "itemId or item_id does not resolve"
  - id: ERR_POSITION_NOT_FOUND
    http: 404
    condition: "positionId does not resolve, or no StorePosition exists for a (store, item) pair a transfer needs"
  - id: ERR_RECEIPT_NOT_FOUND
    http: 404
    condition: "receiptId does not resolve"
  - id: ERR_RUN_NOT_FOUND
    http: 404
    condition: "runId does not resolve"
  - id: ERR_LINE_NOT_FOUND
    http: 404
    condition: "lineId does not resolve"
  - id: ERR_PROMO_EVENT_NOT_FOUND
    http: 404
    condition: "eventId does not resolve"
  - id: ERR_RECOMMENDATION_NOT_FOUND
    http: 404
    condition: "recommendationId does not resolve"
  - id: ERR_ASSORTMENT_ACTION_NOT_FOUND
    http: 404
    condition: "actionId does not resolve"
  - id: ERR_SNAPSHOT_NOT_FOUND
    http: 404
    condition: "snapshotId does not resolve"

  # --- referential ---------------------------------------------------------
  - id: ERR_CROSS_PROGRAM_REFERENCE
    http: 422
    condition: "A write joined entities belonging to different AllocationPrograms"

  # --- state ---------------------------------------------------------------
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The requested transition is not declared from the entity's current state, including any attempt from a terminal state"
  - id: ERR_PROGRAM_LOCKED
    http: 409
    condition: "An allocation or transfer decision was attempted while the program was PLANNING, LOCKED or CLOSED"
  - id: ERR_ITEM_LIFECYCLE_BLOCKED
    http: 409
    condition: "An AssortmentAction execute was attempted on an item that is ACTIVE, CONSOLIDATION_PENDING or MARKDOWN"
  - id: ERR_STALE_RECEIPT_VERSION
    http: 412
    condition: "expected_receipt_version does not match Receipt.version on allocation-run creation (§1.2.1 run-create-stale-receipt)"
  - id: ERR_STALE_POSITION_VERSION
    http: 412
    condition: "expected_from_position_version does not match the donor StorePosition.version on transfer creation (§1.2.1 transfer-create-stale-position)"

  # --- business safety -----------------------------------------------------
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The X-User-ID committing a run equals its proposer, or the X-User-ID approving a transfer equals its proposer"
  - id: ERR_PRESENTATION_MIN_NOT_MET
    http: 409
    condition: "A run commit would leave a line's store below its in-effect FixturePlan.presentation_min_units"

  # --- business constraint -------------------------------------------------
  - id: ERR_FIXTURE_CAPACITY_EXCEEDED
    http: 409
    condition: "A commit, transfer approve or consolidation execute would push a position beyond its in-effect FixturePlan.capacity_units"
  - id: ERR_DUPLICATE_STORE_CODE
    http: 409
    condition: "(program_id, store_code) already exists"
  - id: ERR_DUPLICATE_SKU_CODE
    http: 409
    condition: "(program_id, sku_code) already exists"
  - id: ERR_DUPLICATE_EVENT_CODE
    http: 409
    condition: "(program_id, event_code) already exists"
  - id: ERR_DUPLICATE_POSITION
    http: 409
    condition: "(store_id, item_id) already has a StorePosition"
  - id: ERR_DUPLICATE_PROFILE_CODE
    http: 409
    condition: "(program_id, profile_code) already exists"
  - id: ERR_SIZE_CURVE_INVALID
    http: 422
    condition: "size_curve share_bp values do not sum to exactly 10000, or a size_code repeats"
  - id: ERR_SIZE_UNITS_MISMATCH
    http: 422
    condition: "sum(size_on_hand.units) != on_hand_units, or sum(size_received.units) != units_received"
  - id: ERR_SIZE_CODE_UNKNOWN
    http: 422
    condition: "A size array references a size_code absent from the item's SizeProfile.size_curve"
  - id: ERR_ITEM_CLASS_MISMATCH
    http: 422
    condition: "Item.item_class differs from the referenced SizeProfile.item_class"
  - id: ERR_METHOD_MODEL_MISMATCH
    http: 422
    condition: "AllocationRun.method does not correspond to the item's resolved replenishment_model"
  - id: ERR_SAME_STORE_TRANSFER
    http: 422
    condition: "from_store_id equals to_store_id"
  - id: ERR_STORE_NOT_ELIGIBLE
    http: 409
    condition: "The transfer receiver is not ACTIVE at create or dispatch time (REMODEL, CLOSING or CLOSED)"
  - id: ERR_STORE_HAS_INVENTORY
    http: 409
    condition: "A CLOSING -> CLOSED transition was attempted while some StorePosition still holds on_hand_units > 0"
  - id: ERR_LINE_ALREADY_SHIPPED
    http: 409
    condition: "A COMMITTED run was recalled after at least one of its lines had already been shipped or received"
  - id: ERR_TRANSFER_SIZE_INFEASIBLE
    http: 422
    condition: "transfer_size_split found no candidate size: for REBALANCE no CORE size the receiver lacks and the donor holds; for CONSOLIDATION the donor holds nothing"
  - id: ERR_NO_ELIGIBLE_STORES
    http: 422
    condition: "No ACTIVE store with a StorePosition for the receipt's item survived the proration candidate filter"
  - id: ERR_ZERO_NETWORK_NEED
    http: 409
    condition: "Total network need across the candidate set is 0, or the receipt has no unallocated units left"
  - id: ERR_NO_CLUSTER_POSITIONS
    http: 422
    condition: "A performance snapshot was requested for a cluster with no included StorePosition"
  - id: ERR_NO_FIXTURE_PLAN_IN_EFFECT
    http: 422
    condition: "A store has no FixturePlan for the item's class whose half-open interval contains the logical clock"

  # --- business temporal ---------------------------------------------------
  - id: ERR_FIXTURE_PLAN_OVERLAP
    http: 409
    condition: "A new FixturePlan's half-open interval intersects an existing plan for the same (store_id, item_class); adjacency does not count"
  - id: ERR_PROMO_WINDOW_CONFLICT
    http: 409
    condition: "A PromoEvent's window, expanded by one buffer day on each end, intersects a SCHEDULED or ACTIVE event of the same scope, target and overlapping item_class"
  - id: ERR_TRANSFER_EXPIRED
    http: 409
    condition: "A PROPOSED TransferRecommendation was approved at or after its expires_at instant"

  # --- business fiscal -----------------------------------------------------
  - id: ERR_INSUFFICIENT_DONOR_UNITS
    http: 409
    condition: "The donor position's available_units is below the requested transfer units at create or approve time"
  - id: ERR_BENEFIT_RATIO_BELOW_THRESHOLD
    http: 409
    condition: "A REBALANCE transfer's benefit_ratio_bp is strictly below program.transfer_min_ratio_bp at approve time"
  - id: ERR_RECEIPT_UNITS_EXCEEDED
    http: 409
    condition: "A commit's total proposed units exceed the receipt's remaining units_unallocated, or a receipt recount lowers units_received below the units already committed by COMMITTED runs"

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties. Proposing and approving are always
# different roles AND must be different X-User-IDs; physical receipt belongs to
# the store alone.
# =============================================================================
roles:
  - name: PlanningAdmin
    description: "Sets up the season: programs, stores, shelf plans, size curves, SKUs, positions and promotional calendar. Never proposes or approves an allocation."
    identity: "opaque"
    exclusive_operations:
      - "POST /allocation/programs"
      - "POST /allocation/programs/{programId}/activate"
      - "POST /allocation/programs/{programId}/close"
      - "POST /allocation/stores"
      - "POST /allocation/stores/{storeId}/status"
      - "POST /allocation/fixture-plans"
      - "POST /allocation/size-profiles"
      - "POST /allocation/items"
      - "PATCH /allocation/items/{itemId}"
      - "POST /allocation/promo-events"
      - "POST /allocation/promo-events/{eventId}/schedule"
      - "POST /allocation/promo-events/{eventId}/activate"
      - "POST /allocation/promo-events/{eventId}/end"
      - "POST /allocation/promo-events/{eventId}/cancel"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /allocation/store-positions (with Allocator)"
      - "PATCH /allocation/store-positions/{positionId} (with Allocator)"
      - "POST /allocation/receipts (with Allocator)"
      - "POST /allocation/receipts/{receiptId}/adjust (with Allocator)"
      - "every GET except the StoreOperator-scoped reads"

  - name: Allocator
    description: "Builds and revises the spread and proposes rebalancing transfers. Cannot commit its own work."
    identity: "opaque"
    exclusive_operations:
      - "POST /allocation/receipts/{receiptId}/allocation-runs"
      - "POST /allocation/allocation-runs/{runId}/propose"
      - "POST /allocation/allocation-runs/{runId}/revise"
      - "POST /allocation/transfer-recommendations"
    shared_operations:
      - "POST /allocation/store-positions (with PlanningAdmin)"
      - "PATCH /allocation/store-positions/{positionId} (with PlanningAdmin)"
      - "POST /allocation/receipts (with PlanningAdmin)"
      - "POST /allocation/receipts/{receiptId}/adjust (with PlanningAdmin)"
      - "POST /allocation/allocation-runs/{runId}/cancel (with AllocationManager)"
      - "POST /allocation/_run-assortment-detection (with AllocationManager)"
      - "POST /allocation/performance-snapshots (with AllocationManager)"
      - "every GET except the StoreOperator-scoped reads"

  - name: AllocationManager
    description: "Authorises: commits and recalls runs, approves/dispatches transfers, executes assortment remedies, locks the program. Never authors a proposal it then authorises."
    identity: "opaque"
    exclusive_operations:
      - "POST /allocation/programs/{programId}/lock"
      - "POST /allocation/programs/{programId}/unlock"
      - "POST /allocation/receipts/{receiptId}/close"
      - "POST /allocation/allocation-runs/{runId}/commit"
      - "POST /allocation/allocation-runs/{runId}/recall"
      - "POST /allocation/allocation-lines/{lineId}/ship"
      - "POST /allocation/transfer-recommendations/{recommendationId}/approve"
      - "POST /allocation/transfer-recommendations/{recommendationId}/reject"
      - "POST /allocation/transfer-recommendations/{recommendationId}/dispatch"
      - "POST /allocation/transfer-recommendations/{recommendationId}/cancel"
      - "POST /allocation/assortment-actions/{actionId}/execute"
      - "POST /allocation/assortment-actions/{actionId}/cancel"
      - "POST /allocation/_run-transfer-expiry"
    shared_operations:
      - "POST /allocation/allocation-runs/{runId}/cancel (with Allocator)"
      - "POST /allocation/_run-assortment-detection (with Allocator)"
      - "POST /allocation/performance-snapshots (with Allocator)"
      - "every GET except the StoreOperator-scoped reads"

  - name: StoreOperator
    description: "The receiving store itself. Books physical arrivals and reads only its own store's data. X-User-ID is the Store id."
    identity: "entity_backed:Store"
    exclusive_operations:
      - "POST /allocation/allocation-lines/{lineId}/confirm-receipt"
      - "POST /allocation/transfer-recommendations/{recommendationId}/receive"
    shared_operations:
      - "GET /allocation/stores/{storeId} (own store only)"
      - "GET /allocation/store-positions/{positionId} (own store's positions only)"
