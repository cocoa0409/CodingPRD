# =============================================================================
# Scaffold: Aerospace Machining & AS9100 Program (tier-2 aerospace supplier)
# =============================================================================

scenario: |
  Aerospace Machining & AS9100 Program (tier-2 aerospace supplier): contract
  flow-down & special-process approval, first-article inspection (AS9102) &
  ballooning, serialized traceability & material certification, counterfeit-part
  prevention & source approval, key characteristic SPC & escape reporting,
  delegated inspection authority, long-term agreement & rate readiness,
  nonconformance/MRB disposition

domain_name: aerospace-machining-as9100
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (flat topology; all linkage via FK fields)
# =============================================================================
entities:
  - name: LongTermAgreement
    parent: null
    common_fields: true
    fields:
      - { name: customer_name, type: string, source: input, description: "Prime contractor / customer name" }
      - { name: ceiling_cents, type: integer, source: input, description: "Total agreement value ceiling in cents; must be > 0" }
      - { name: remaining_ceiling_cents, type: integer, source: computed, description: "= ceiling_cents - sum(total_cents of PurchaseOrders with status != CANCELLED); debited on PO create, restored on PO cancel" }
      - { name: pricing_tiers, type: array, source: input, description: "Array of {min_qty, unit_price_cents} sorted by min_qty ASC; tier applies when quantity >= min_qty; must be non-empty with min_qty 1 present" }
      - { name: escalation_pct_per_year, type: number, source: input, description: "Annual price escalation rate (e.g. 0.05); applied as (1+p)^(delivery_year - award_year)" }
      - { name: award_year, type: integer, source: input, description: "Base calendar year for escalation" }
      - { name: rebate_tiers, type: array, source: input, description: "Array of {min_invoiced_cents, rebate_pct} sorted ascending; annual volume rebate tier keyed on GROSS invoiced subtotal (pre-rebate)" }
      - { name: committed_monthly_rate_units, type: integer, source: input, description: "Committed production rate in units per calendar month; must be > 0" }
      - { name: consecutive_not_ready_count, type: integer, source: system, default: 0, description: "Count of consecutive NOT_READY monthly rate audits; resets to 0 on any READY/MARGINAL audit and on reinstate" }
      - { name: last_audit_month, type: string, source: system, description: "YYYY-MM of the most recent rate audit (nullable)" }
      - { name: last_audit_result, type: enum, source: system, description: "READY | MARGINAL | NOT_READY (nullable until first audit)", constraints: "READY | MARGINAL | NOT_READY | null" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> SUSPENDED -> ACTIVE -> CLOSED", constraints: "DRAFT | ACTIVE | SUSPENDED | CLOSED" }

  - name: PurchaseOrder
    parent: null
    common_fields: true
    fields:
      - { name: lta_id, type: string, source: input, description: "FK -> LongTermAgreement.id; agreement this PO is placed against" }
      - { name: po_number, type: string, source: input, description: "Customer PO number; unique per lta_id" }
      - { name: part_number, type: string, source: input, description: "Part number being ordered" }
      - { name: part_revision, type: string, source: input, description: "Drawing revision being ordered" }
      - { name: quantity, type: integer, source: input, description: "Ordered quantity; must be > 0" }
      - { name: flowdown_clauses, type: array, source: input, description: "Quality flow-down clauses flowed to this PO", constraints: "array of AS9102_FAI | AS9100D_QMS | DFARS_COUNTERFEIT_PREVENTION | CUSTOMER_SOURCE_INSPECTION | DELEGATED_INSPECTION_PERMITTED" }
      - { name: requires_special_process, type: boolean, source: input, default: false, description: "True when the PO requires special-process operations; drives pricing surcharge" }
      - { name: delivery_year, type: integer, source: input, description: "Calendar year of contract delivery; drives escalation factor" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Computed by po_unit_price at creation; pinned thereafter (LTA amendments never reprice existing POs)" }
      - { name: total_cents, type: integer, source: computed, description: "= quantity * unit_price_cents; pinned at creation" }
      - { name: lta_version_pinned, type: integer, source: system, description: "LongTermAgreement.version observed at creation; PO pricing is pinned to this version" }
      - { name: unreleased_quantity, type: integer, source: computed, description: "= quantity - sum(WorkOrder.quantity where status != CANCELLED); debited on WO create, restored on WO cancel" }
      - { name: delivered_quantity, type: integer, source: computed, default: 0, description: "Count of SerialNumbers of this PO's work orders that reached SHIPPED" }
      - { name: status, type: enum, source: system, description: "RECEIVED -> ACCEPTED -> RELEASED -> CLOSED | CANCELLED", constraints: "RECEIVED | ACCEPTED | RELEASED | CLOSED | CANCELLED" }

  - name: FirstArticleInspection
    parent: null
    common_fields: true
    fields:
      - { name: part_number, type: string, source: input, description: "Part number under inspection (matches PurchaseOrder.part_number)" }
      - { name: part_revision, type: string, source: input, description: "Drawing revision under inspection" }
      - { name: fai_type, type: enum, source: input, description: "FULL (new part/revision) | PARTIAL (delta/change FAI)", constraints: "FULL | PARTIAL" }
      - { name: status, type: enum, source: system, description: "DRAFT -> IN_INSPECTION -> SUBMITTED -> APPROVED | REJECTED; REJECTED -> IN_INSPECTION; APPROVED -> SUPERSEDED", constraints: "DRAFT | IN_INSPECTION | SUBMITTED | APPROVED | REJECTED | SUPERSEDED" }
      - { name: characteristic_count, type: integer, source: computed, default: 0, description: "Count of BalloonedCharacteristics on this FAI" }
      - { name: measured_count, type: integer, source: computed, default: 0, description: "Count of characteristics with result != UNMEASURED" }
      - { name: characteristics_complete, type: boolean, source: computed, default: false, description: "True when characteristic_count >= 1 and measured_count == characteristic_count" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID captured at submit (nullable)" }
      - { name: approved_revision, type: string, source: system, description: "Revision pinned at APPROVED transition (version-pinning); equals part_revision (nullable)" }

  - name: BalloonedCharacteristic
    parent: null
    common_fields: true
    fields:
      - { name: fai_id, type: string, source: input, description: "FK -> FirstArticleInspection.id; FAI this ballooned characteristic belongs to" }
      - { name: balloon_number, type: integer, source: input, description: "Balloon number on the drawing; unique per fai_id" }
      - { name: nominal, type: number, source: input, description: "Nominal dimension" }
      - { name: tolerance_plus, type: number, source: input, description: "Upper tolerance (>= 0)" }
      - { name: tolerance_minus, type: number, source: input, description: "Lower tolerance (>= 0)" }
      - { name: is_key_characteristic, type: boolean, source: input, default: false, description: "True when this characteristic is a designated Key Characteristic requiring SPC" }
      - { name: usl, type: number, source: computed, description: "= nominal + tolerance_plus" }
      - { name: lsl, type: number, source: computed, description: "= nominal - tolerance_minus" }
      - { name: measured_value, type: number, source: input, description: "FAI measured value (nullable until recorded)" }
      - { name: result, type: enum, source: system, description: "UNMEASURED -> PASS | FAIL; FAIL may be re-measured", constraints: "UNMEASURED | PASS | FAIL" }
      - { name: measured_by_user_id, type: string, source: system, description: "X-User-ID of the inspector who recorded measured_value (nullable)" }
      - { name: spc_eval_status, type: enum, source: system, default: NONE, description: "SPC evaluation posture for key characteristics", constraints: "NONE | MONITORING | CAPABLE | INCAPABLE" }
      - { name: cpk_provisional, type: number, source: computed, description: "Provisional capability index (sample stddev, n-1) from last SPC evaluation; nullable" }
      - { name: cpk_final, type: number, source: computed, description: "Final capability index (population stddev, n) computed at work-order completion; nullable" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: po_id, type: string, source: input, description: "FK -> PurchaseOrder.id; PO this work order fulfills" }
      - { name: quantity, type: integer, source: input, description: "Planned quantity; must be > 0 and <= PO.unreleased_quantity at creation" }
      - { name: special_processes_required, type: array, source: input, default: [], description: "Special processes this WO routes through", constraints: "array of HEAT_TREAT | NDT | PLATING | WELDING | SHOT_PEEN" }
      - { name: status, type: enum, source: system, description: "PLANNED -> RELEASED -> IN_PRODUCTION -> FINAL_INSPECTION -> COMPLETED; IN_PRODUCTION <-> QUALITY_HOLD; PLANNED/RELEASED -> CANCELLED", constraints: "PLANNED | RELEASED | IN_PRODUCTION | QUALITY_HOLD | FINAL_INSPECTION | COMPLETED | CANCELLED" }
      - { name: serials_created_count, type: integer, source: computed, default: 0, description: "Count of SerialNumbers created under this WO" }
      - { name: good_quantity, type: integer, source: computed, default: 0, description: "Count of serials with status IN {CREATED, SHIPPED, QUARANTINED}" }
      - { name: scrapped_quantity, type: integer, source: computed, default: 0, description: "Count of serials with status SCRAPPED" }
      - { name: spc_status, type: enum, source: system, default: MONITORING, description: "Worst SPC posture across key characteristics: INCAPABLE if any KC INCAPABLE; CAPABLE if every KC with >= 5 measurements is CAPABLE and at least one evaluated; else MONITORING", constraints: "MONITORING | CAPABLE | INCAPABLE" }
      - { name: requires_100pct_inspection, type: boolean, source: system, default: false, description: "Set true when any key characteristic goes INCAPABLE; never auto-clears" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp of the FINAL_INSPECTION -> COMPLETED transition (nullable)" }

  - name: SerialNumber
    parent: null
    common_fields: true
    fields:
      - { name: wo_id, type: string, source: system, description: "FK -> WorkOrder.id; work order producing this unit" }
      - { name: material_cert_id, type: string, source: input, description: "FK -> MaterialCert.id; material lot (heat) this unit was machined from" }
      - { name: serial_number, type: string, source: system, description: "System-assigned serial: SN-NNNN, 4-digit zero-padded per-work-order sequence in creation order" }
      - { name: status, type: enum, source: system, description: "CREATED -> SHIPPED | SCRAPPED | QUARANTINED; QUARANTINED -> CREATED | SCRAPPED", constraints: "CREATED | SHIPPED | SCRAPPED | QUARANTINED" }
      - { name: shipped_at, type: datetime, source: system, description: "Logical-clock timestamp of shipment (nullable)" }

  - name: MaterialCert
    parent: null
    common_fields: true
    fields:
      - { name: source_id, type: string, source: input, description: "FK -> ApprovedSource.id; supplier that provided the material" }
      - { name: heat_number, type: string, source: input, description: "Mill heat/lot number on the certification" }
      - { name: material_spec, type: string, source: input, description: "Material specification (e.g. AMS 5643)" }
      - { name: quantity_received, type: integer, source: input, description: "Units of material received; must be > 0" }
      - { name: quantity_available, type: integer, source: computed, description: "= quantity_received - units allocated to serial batches" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creator (segregation-of-duties anchor)" }
      - { name: status, type: enum, source: system, description: "RECEIVED -> ACCEPTED -> REVOKED; RECEIVED -> REVOKED", constraints: "RECEIVED | ACCEPTED | REVOKED" }

  - name: ApprovedSource
    parent: null
    common_fields: true
    fields:
      - { name: supplier_code, type: string, source: input, description: "Unique supplier code" }
      - { name: approval_scope, type: enum, source: input, description: "RAW_MATERIAL | SPECIAL_PROCESS | DISTRIBUTOR", constraints: "RAW_MATERIAL | SPECIAL_PROCESS | DISTRIBUTOR" }
      - { name: counterfeit_risk_rating, type: enum, source: input, description: "Counterfeit-part risk rating from source evaluation", constraints: "LOW | MEDIUM | HIGH" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL -> APPROVED -> DISQUALIFIED; PROVISIONAL -> DISQUALIFIED", constraints: "PROVISIONAL | APPROVED | DISQUALIFIED" }

  - name: SpecialProcessApproval
    parent: null
    common_fields: true
    fields:
      - { name: source_id, type: string, source: input, description: "FK -> ApprovedSource.id; processor holding this approval" }
      - { name: process_code, type: enum, source: input, description: "Special process covered", constraints: "HEAT_TREAT | NDT | PLATING | WELDING | SHOT_PEEN" }
      - { name: valid_from, type: string, source: input, description: "Window start date (YYYY-MM-DD), inclusive — half-open interval [valid_from, valid_to)" }
      - { name: valid_to, type: string, source: input, description: "Window end date (YYYY-MM-DD), exclusive — must be > valid_from" }
      - { name: cert_reference, type: string, source: input, description: "Certifying audit reference (e.g. Nadcap cert number)" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> SUSPENDED -> ACTIVE", constraints: "ACTIVE | SUSPENDED" }

  - name: NonconformanceReport
    parent: null
    common_fields: true
    fields:
      - { name: wo_id, type: string, source: input, description: "FK -> WorkOrder.id; work order the nonconformance was found on" }
      - { name: defect_code, type: string, source: input, description: "Defect classification code" }
      - { name: description, type: string, source: input, description: "Nonconformance description" }
      - { name: quantity_affected, type: integer, source: input, description: "Number of affected units; must be > 0" }
      - { name: affected_serial_ids, type: array, source: input, default: [], description: "SerialNumber ids affected; each must exist and belong to wo_id" }
      - { name: detected_post_shipment, type: boolean, source: input, default: false, description: "True when discovered after shipment (escape); auto-creates a DRAFT EscapeReport" }
      - { name: origin, type: enum, source: system, default: MANUAL, description: "MANUAL | AUTO_SPC | AUTO_COUNTERFEIT", constraints: "MANUAL | AUTO_SPC | AUTO_COUNTERFEIT" }
      - { name: discovered_by_user_id, type: string, source: system, description: "X-User-ID of the creator (segregation-of-duties anchor)" }
      - { name: disposition, type: enum, source: system, description: "MRB disposition (nullable until dispositioned)", constraints: "USE_AS_IS | REWORK | SCRAP | RETURN_TO_SUPPLIER | null" }
      - { name: disposition_by_user_id, type: string, source: system, description: "X-User-ID of the MRB member who dispositioned (nullable)" }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "ncr_disposition_cost estimated variant, computed at disposition (nullable until dispositioned)" }
      - { name: actual_cost_cents, type: integer, source: computed, description: "ncr_disposition_cost actual variant, computed at verify from actual inputs (nullable)" }
      - { name: concession_approved, type: boolean, source: system, default: false, description: "True once customer concession is recorded (required before verify when disposition == USE_AS_IS)" }
      - { name: status, type: enum, source: system, description: "OPEN -> MRB_REVIEW -> DISPOSITIONED -> VERIFIED -> CLOSED; MRB_REVIEW -> OPEN (kickback)", constraints: "OPEN | MRB_REVIEW | DISPOSITIONED | VERIFIED | CLOSED" }

  - name: EscapeReport
    parent: null
    common_fields: true
    fields:
      - { name: ncr_id, type: string, source: system, description: "FK -> NonconformanceReport.id; escape's originating NCR" }
      - { name: due_at, type: datetime, source: computed, description: "= NCR.created_at + ESCAPE_WINDOW_HOURS (48h)" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of submit (nullable)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> ACKNOWLEDGED", constraints: "DRAFT | SUBMITTED | ACKNOWLEDGED" }

  - name: DelegatedInspectionAuthority
    parent: null
    common_fields: true
    fields:
      - { name: po_id, type: string, source: input, description: "FK -> PurchaseOrder.id; PO scope of the delegation" }
      - { name: inspector_user_id, type: string, source: input, description: "X-User-ID of the delegated supplier inspector" }
      - { name: valid_from, type: string, source: input, description: "Window start date (YYYY-MM-DD), inclusive — CLOSED interval [valid_from, valid_to]" }
      - { name: valid_to, type: string, source: input, description: "Window end date (YYYY-MM-DD), inclusive — must be >= valid_from" }
      - { name: granted_by_user_id, type: string, source: system, description: "X-User-ID of the granting CustomerQualityRep" }
      - { name: revoked_at, type: datetime, source: system, description: "Logical-clock timestamp of revocation; anchors the 30-day cooling-off (nullable)" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> REVOKED", constraints: "ACTIVE | REVOKED" }

  - name: SpcMeasurement
    parent: null
    common_fields: false
    fields:
      - { name: wo_id, type: string, source: system, description: "FK -> WorkOrder.id; work order measured" }
      - { name: characteristic_id, type: string, source: input, description: "FK -> BalloonedCharacteristic.id; key characteristic measured (must have is_key_characteristic == true)" }
      - { name: measured_value, type: number, source: input, description: "Measured value of the key characteristic" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the recording inspector" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: LongTermAgreement
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /api/ltas/{ltaId}/activate
        actor: ContractsManager
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE)"
          - "pricing_tiers non-empty, ceiling_cents > 0, committed_monthly_rate_units > 0 (ERR_INVALID_REQUEST)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic inside POST /api/ltas/{ltaId}/run-rate-audit when consecutive_not_ready_count reaches 2)"
        actor: system
        preconditions: []
        side_effects:
          - "PO release gate: ERR_LTA_NOT_ACTIVE while SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /api/ltas/{ltaId}/reinstate
        actor: ContractsManager
        preconditions:
          - "status == SUSPENDED (else ERR_INVALID_STATE)"
        side_effects:
          - "consecutive_not_ready_count = 0"
      - from: ACTIVE
        to: CLOSED
        trigger: POST /api/ltas/{ltaId}/close
        actor: ContractsManager
        preconditions:
          - "status IN {ACTIVE, SUSPENDED} (else ERR_INVALID_STATE)"
          - "No PurchaseOrder of this LTA in {RECEIVED, ACCEPTED, RELEASED} (ERR_LTA_HAS_OPEN_ORDERS)"
        side_effects: []
      - from: SUSPENDED
        to: CLOSED
        trigger: POST /api/ltas/{ltaId}/close
        actor: ContractsManager
        preconditions:
          - "No PurchaseOrder of this LTA in {RECEIVED, ACCEPTED, RELEASED} (ERR_LTA_HAS_OPEN_ORDERS)"
        side_effects: []

  - entity: PurchaseOrder
    initial_state: RECEIVED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: RECEIVED
        to: ACCEPTED
        trigger: POST /api/purchase-orders/{poId}/accept
        actor: ContractsManager
        preconditions:
          - "status == RECEIVED (else ERR_INVALID_STATE)"
          - "flowdown_clauses non-empty (ERR_INVALID_REQUEST)"
        side_effects: []
      - from: ACCEPTED
        to: RELEASED
        trigger: POST /api/purchase-orders/{poId}/release
        actor: ContractsManager
        preconditions:
          - "status == ACCEPTED (else ERR_PO_NOT_ACCEPTED)"
          - "LongTermAgreement.status == ACTIVE (ERR_LTA_NOT_ACTIVE)"
        side_effects: []
      - from: RELEASED
        to: CLOSED
        trigger: "system (automatic when delivered_quantity == quantity)"
        actor: system
        preconditions: []
        side_effects:
          - "PO contributes total_cents to lta_annual_volume_rebate gross for the calendar year of closure"
      - from: RECEIVED
        to: CANCELLED
        trigger: POST /api/purchase-orders/{poId}/cancel
        actor: ContractsManager
        preconditions:
          - "status IN {RECEIVED, ACCEPTED, RELEASED} (else ERR_PO_NOT_CANCELLABLE)"
          - "No WorkOrder of this PO in {IN_PRODUCTION, QUALITY_HOLD, FINAL_INSPECTION} (ERR_PO_HAS_ACTIVE_WORK)"
        side_effects:
          - "All WorkOrders in {PLANNED, RELEASED} -> CANCELLED (each restores its quantity to unreleased_quantity first)"
          - "LongTermAgreement.remaining_ceiling_cents += total_cents (INV-LTA-CEILING restored)"
          - "Increments LongTermAgreement.version by 1"
      - from: ACCEPTED
        to: CANCELLED
        trigger: POST /api/purchase-orders/{poId}/cancel
        actor: ContractsManager
        preconditions:
          - "No WorkOrder of this PO in {IN_PRODUCTION, QUALITY_HOLD, FINAL_INSPECTION} (ERR_PO_HAS_ACTIVE_WORK)"
        side_effects:
          - "Same cascade as RECEIVED -> CANCELLED"
      - from: RELEASED
        to: CANCELLED
        trigger: POST /api/purchase-orders/{poId}/cancel
        actor: ContractsManager
        preconditions:
          - "No WorkOrder of this PO in {IN_PRODUCTION, QUALITY_HOLD, FINAL_INSPECTION} (ERR_PO_HAS_ACTIVE_WORK)"
        side_effects:
          - "Same cascade as RECEIVED -> CANCELLED"

  - entity: FirstArticleInspection
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: IN_INSPECTION
        trigger: "system (automatic on first POST /api/first-articles/{faiId}/characteristics)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_INSPECTION
        to: SUBMITTED
        trigger: POST /api/first-articles/{faiId}/submit
        actor: QualityInspector
        preconditions:
          - "status == IN_INSPECTION (else ERR_FAI_NOT_SUBMITTABLE)"
          - "characteristics_complete == true (else ERR_FAI_INCOMPLETE_CHARACTERISTICS)"
          - "Every characteristic result == PASS (else ERR_FAI_CHARACTERISTIC_FAILURE)"
          - "Segregation of duties: X-User-ID != measured_by_user_id of EVERY characteristic (ERR_SOD_VIOLATION)"
        side_effects:
          - "submitted_by_user_id = X-User-ID"
      - from: SUBMITTED
        to: APPROVED
        trigger: POST /api/first-articles/{faiId}/approve
        actor: CustomerQualityRep
        preconditions:
          - "status == SUBMITTED (else ERR_FAI_NOT_SUBMITTED)"
        side_effects:
          - "approved_revision = part_revision (revision pinned at approval)"
          - "Every other FAI with same (part_number, part_revision) in APPROVED -> SUPERSEDED"
      - from: SUBMITTED
        to: REJECTED
        trigger: POST /api/first-articles/{faiId}/reject
        actor: CustomerQualityRep
        preconditions:
          - "status == SUBMITTED (else ERR_FAI_NOT_SUBMITTED)"
        side_effects: []
      - from: REJECTED
        to: IN_INSPECTION
        trigger: POST /api/first-articles/{faiId}/reopen
        actor: QualityInspector
        preconditions:
          - "status == REJECTED (else ERR_FAI_NOT_REOPENABLE)"
        side_effects: []

  - entity: BalloonedCharacteristic
    initial_state: UNMEASURED
    terminal_states: [PASS]
    transitions:
      - from: UNMEASURED
        to: PASS
        trigger: POST /api/characteristics/{charId}/record-measurement
        actor: QualityInspector
        preconditions:
          - "result IN {UNMEASURED, FAIL} (else ERR_CHARACTERISTIC_NOT_MEASURABLE)"
          - "Parent FAI status IN {DRAFT, IN_INSPECTION} (else ERR_CHARACTERISTIC_LOCKED)"
        side_effects:
          - "measured_value stored; measured_by_user_id = X-User-ID"
          - "result = PASS because lsl <= measured_value <= usl"
          - "FAI.measured_count and characteristics_complete recomputed"
      - from: UNMEASURED
        to: FAIL
        trigger: POST /api/characteristics/{charId}/record-measurement
        actor: QualityInspector
        preconditions:
          - "Parent FAI status IN {DRAFT, IN_INSPECTION} (else ERR_CHARACTERISTIC_LOCKED)"
        side_effects:
          - "measured_value stored; measured_by_user_id = X-User-ID"
          - "result = FAIL because measured_value < lsl or > usl"
      - from: FAIL
        to: PASS
        trigger: POST /api/characteristics/{charId}/record-measurement (re-measure after rework)
        actor: QualityInspector
        preconditions:
          - "Parent FAI status IN {DRAFT, IN_INSPECTION} (else ERR_CHARACTERISTIC_LOCKED)"
        side_effects:
          - "measured_value overwritten; measured_by_user_id = X-User-ID"
      - from: FAIL
        to: FAIL
        trigger: POST /api/characteristics/{charId}/record-measurement (re-measure still failing)
        actor: QualityInspector
        preconditions:
          - "Parent FAI status IN {DRAFT, IN_INSPECTION} (else ERR_CHARACTERISTIC_LOCKED)"
        side_effects:
          - "measured_value overwritten; measured_by_user_id = X-User-ID"

  - entity: WorkOrder
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: RELEASED
        trigger: POST /api/work-orders/{woId}/release
        actor: ManufacturingPlanner
        preconditions:
          - "status == PLANNED (else ERR_WO_NOT_RELEASABLE)"
          - "PurchaseOrder.status == RELEASED (ERR_PO_NOT_RELEASED)"
          - "If PO.flowdown_clauses contains AS9102_FAI: exists FirstArticleInspection with part_number == PO.part_number AND part_revision == PO.part_revision AND status == APPROVED (ERR_FAI_REQUIRED)"
          - "For each p in special_processes_required: exists SpecialProcessApproval with process_code == p, status == ACTIVE, valid_from <= clock date < valid_to, whose ApprovedSource.status == APPROVED (ERR_PROCESS_NOT_APPROVED)"
        side_effects: []
      - from: RELEASED
        to: IN_PRODUCTION
        trigger: "system (automatic on first successful POST /api/work-orders/{woId}/serials)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PRODUCTION
        to: FINAL_INSPECTION
        trigger: POST /api/work-orders/{woId}/complete
        actor: ManufacturingPlanner
        preconditions:
          - "status == IN_PRODUCTION (else ERR_WO_NOT_IN_PRODUCTION)"
          - "serials_created_count == quantity (else ERR_SERIALS_INCOMPLETE)"
          - "No NonconformanceReport with wo_id == this WO and status IN {OPEN, MRB_REVIEW} (ERR_WO_OPEN_NCR)"
        side_effects:
          - "For each key characteristic with >= 5 SpcMeasurements on this WO: compute cpk_final (population stddev variant) and store on characteristic"
      - from: FINAL_INSPECTION
        to: COMPLETED
        trigger: POST /api/work-orders/{woId}/accept
        actor: CustomerQualityRep | QualityInspector
        preconditions:
          - "status == FINAL_INSPECTION (else ERR_WO_NOT_ACCEPTABLE)"
          - "If actor is QualityInspector: exists DelegatedInspectionAuthority with po_id == WO.po_id, inspector_user_id == X-User-ID, status == ACTIVE, valid_from <= clock date <= valid_to (else ERR_DELEGATION_REQUIRED); CustomerQualityRep always permitted (source inspection)"
        side_effects:
          - "completed_at = current logical clock"
      - from: IN_PRODUCTION
        to: QUALITY_HOLD
        trigger: "system (material-cert revocation cascade, or NCR SCRAP disposition scrapping the last good serial)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUALITY_HOLD
        to: IN_PRODUCTION
        trigger: POST /api/work-orders/{woId}/release-hold
        actor: QualityManager
        preconditions:
          - "status == QUALITY_HOLD (else ERR_WO_NOT_ON_HOLD)"
          - "No SerialNumber of this WO in QUARANTINED (ERR_WO_OPEN_NCR)"
          - "No NonconformanceReport with wo_id == this WO and status IN {OPEN, MRB_REVIEW} (ERR_WO_OPEN_NCR)"
        side_effects: []
      - from: PLANNED
        to: CANCELLED
        trigger: POST /api/work-orders/{woId}/cancel
        actor: ManufacturingPlanner
        preconditions:
          - "status IN {PLANNED, RELEASED} (else ERR_WO_NOT_CANCELLABLE)"
        side_effects:
          - "PurchaseOrder.unreleased_quantity += quantity (INV-PO-QTY restored)"
      - from: RELEASED
        to: CANCELLED
        trigger: POST /api/work-orders/{woId}/cancel
        actor: ManufacturingPlanner
        preconditions:
          - "status IN {PLANNED, RELEASED} (else ERR_WO_NOT_CANCELLABLE)"
        side_effects:
          - "PurchaseOrder.unreleased_quantity += quantity (INV-PO-QTY restored)"

  - entity: SerialNumber
    initial_state: CREATED
    terminal_states: [SHIPPED, SCRAPPED]
    transitions:
      - from: CREATED
        to: SHIPPED
        trigger: POST /api/serials/{serialId}/ship
        actor: ManufacturingPlanner
        preconditions:
          - "status == CREATED (else ERR_SERIAL_NOT_SHIPPABLE)"
          - "WorkOrder.status == COMPLETED (else ERR_WO_NOT_ACCEPTABLE)"
          - "MaterialCert.status == ACCEPTED (else ERR_MATERIAL_CERT_REVOKED)"
          - "No NonconformanceReport with status IN {OPEN, MRB_REVIEW} whose affected_serial_ids contains this serial (ERR_SERIAL_UNDER_NCR)"
        side_effects:
          - "shipped_at = current logical clock"
          - "PurchaseOrder.delivered_quantity += 1"
          - "If delivered_quantity == quantity: PurchaseOrder -> CLOSED (bubble-up)"
      - from: CREATED
        to: QUARANTINED
        trigger: "system (MaterialCert revoked cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CREATED
        to: SCRAPPED
        trigger: "system (NCR disposition == SCRAP covering this serial)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUARANTINED
        to: CREATED
        trigger: "system (NCR disposition == USE_AS_IS covering this serial releases it)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUARANTINED
        to: SCRAPPED
        trigger: "system (NCR disposition == SCRAP covering this serial)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MaterialCert
    initial_state: RECEIVED
    terminal_states: [REVOKED]
    transitions:
      - from: RECEIVED
        to: ACCEPTED
        trigger: POST /api/material-certs/{certId}/accept
        actor: QualityInspector
        preconditions:
          - "status == RECEIVED (else ERR_CERT_NOT_ACCEPTABLE)"
          - "Segregation of duties: X-User-ID != created_by_user_id (ERR_SOD_VIOLATION)"
        side_effects: []
      - from: RECEIVED
        to: REVOKED
        trigger: POST /api/material-certs/{certId}/revoke
        actor: QualityManager
        preconditions:
          - "status != REVOKED (else ERR_CERT_ALREADY_REVOKED)"
        side_effects:
          - "Cascade C1 link 1: every SerialNumber with material_cert_id == this cert and status == CREATED -> QUARANTINED"
          - "Cascade C1 link 2: every WorkOrder owning a serial that just became QUARANTINED and whose status == IN_PRODUCTION -> QUALITY_HOLD"
          - "Cascade C1 link 3: for each WorkOrder pushed to QUALITY_HOLD, auto-create NonconformanceReport (origin AUTO_COUNTERFEIT, defect_code COUNTERFEIT_SUSPECT, quantity_affected = quarantined serial count, status OPEN)"
          - "Cascade C1 link 4: if any serial of this cert had status == SHIPPED, the affected PO's auto-created NCR also spawns a DRAFT EscapeReport (detected_post_shipment = true)"
      - from: ACCEPTED
        to: REVOKED
        trigger: POST /api/material-certs/{certId}/revoke
        actor: QualityManager
        preconditions:
          - "status != REVOKED (else ERR_CERT_ALREADY_REVOKED)"
        side_effects:
          - "Same C1 cascade as RECEIVED -> REVOKED"

  - entity: ApprovedSource
    initial_state: PROVISIONAL
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: PROVISIONAL
        to: APPROVED
        trigger: POST /api/sources/{sourceId}/approve
        actor: SupplyChainManager
        preconditions:
          - "status == PROVISIONAL (else ERR_SOURCE_NOT_APPROVABLE)"
          - "If approval_scope IN {RAW_MATERIAL, DISTRIBUTOR}: counterfeit_risk_rating != HIGH (ERR_COUNTERFEIT_RISK_TOO_HIGH)"
        side_effects: []
      - from: APPROVED
        to: DISQUALIFIED
        trigger: POST /api/sources/{sourceId}/disqualify
        actor: SupplyChainManager
        preconditions:
          - "status == APPROVED (else ERR_SOURCE_NOT_APPROVABLE)"
        side_effects:
          - "All SpecialProcessApprovals of this source with status == ACTIVE -> SUSPENDED"
      - from: PROVISIONAL
        to: DISQUALIFIED
        trigger: POST /api/sources/{sourceId}/disqualify
        actor: SupplyChainManager
        preconditions: []
        side_effects: []

  - entity: SpecialProcessApproval
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /api/process-approvals/{paId}/suspend
        actor: SupplyChainManager
        preconditions:
          - "status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /api/process-approvals/{paId}/reinstate
        actor: SupplyChainManager
        preconditions:
          - "status == SUSPENDED (else ERR_INVALID_STATE)"
          - "Window-overlap rule re-applied against other ACTIVE approvals of the same (source_id, process_code) (ERR_APPROVAL_WINDOW_OVERLAP)"
        side_effects: []

  - entity: NonconformanceReport
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: MRB_REVIEW
        trigger: POST /api/ncrs/{ncrId}/submit-mrb
        actor: QualityManager
        preconditions:
          - "status == OPEN (else ERR_INVALID_STATE)"
        side_effects: []
      - from: MRB_REVIEW
        to: OPEN
        trigger: POST /api/ncrs/{ncrId}/kickback
        actor: MRBMember
        preconditions:
          - "status == MRB_REVIEW (else ERR_INVALID_STATE)"
        side_effects: []
      - from: MRB_REVIEW
        to: DISPOSITIONED
        trigger: POST /api/ncrs/{ncrId}/disposition
        actor: MRBMember
        preconditions:
          - "status == MRB_REVIEW (else ERR_INVALID_STATE)"
          - "Segregation of duties: X-User-ID != discovered_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "disposition and disposition_by_user_id stored"
          - "estimated_cost_cents = ncr_disposition_cost estimated variant (per-unit rounding then multiply)"
          - "Branch SCRAP: every affected serial in {CREATED, QUARANTINED} -> SCRAPPED (C2 link 1); owning WorkOrder.scrapped_quantity/good_quantity recomputed (C2 link 2); if good_quantity == 0 and serials_created_count > 0 and WO status == IN_PRODUCTION: WO -> QUALITY_HOLD (C2 link 3)"
          - "Branch USE_AS_IS: every affected serial in QUARANTINED -> CREATED"
          - "Branch REWORK: no serial change; verify will require actual cost inputs"
          - "Branch RETURN_TO_SUPPLIER: no serial change"
      - from: DISPOSITIONED
        to: VERIFIED
        trigger: POST /api/ncrs/{ncrId}/verify
        actor: QualityInspector
        preconditions:
          - "status == DISPOSITIONED (else ERR_INVALID_STATE)"
          - "If disposition == USE_AS_IS: concession_approved == true (else ERR_NCR_REQUIRES_CONCESSION)"
        side_effects:
          - "If actual_rework_hours_per_unit / actual_material_cost_per_unit_cents supplied: actual_cost_cents = ncr_disposition_cost actual variant"
      - from: VERIFIED
        to: CLOSED
        trigger: POST /api/ncrs/{ncrId}/close
        actor: QualityManager
        preconditions:
          - "status == VERIFIED (else ERR_INVALID_STATE)"
          - "If detected_post_shipment == true: linked EscapeReport.status == ACKNOWLEDGED (else ERR_ESCAPE_NOT_ACKNOWLEDGED)"
        side_effects: []

  - entity: EscapeReport
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /api/escape-reports/{erId}/submit
        actor: QualityManager
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE)"
          - "current logical clock <= due_at (else ERR_ESCAPE_WINDOW_EXCEEDED); due_at boundary is inclusive (<= allowed)"
        side_effects:
          - "submitted_at = current logical clock"
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: POST /api/escape-reports/{erId}/acknowledge
        actor: CustomerQualityRep
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: DelegatedInspectionAuthority
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: POST /api/delegations/{diaId}/revoke
        actor: CustomerQualityRep
        preconditions:
          - "status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "revoked_at = current logical clock (anchors 30-day cooling-off for re-grant to the same (po_id, inspector_user_id))"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only; serial-observability filter applied)
# =============================================================================
concurrency_rules:
  - rule_id: po-create-stale-lta
    parent_entity: LongTermAgreement
    write_endpoint: POST /api/purchase-orders
    occ_field: expected_lta_version
    description: |
      Creating a PurchaseOrder against a LongTermAgreement whose version has
      advanced since the client last observed it is rejected. PO pricing is
      pinned from the LTA tier table at creation, so a write based on a stale
      LTA version would price against superseded commercial terms.
    error_id: ERR_STALE_LTA_VERSION
    http_status: 412
  - rule_id: lta-amend-stale-version
    parent_entity: LongTermAgreement
    write_endpoint: POST /api/ltas/{ltaId}/amend
    occ_field: expected_lta_version
    description: |
      Amending a LongTermAgreement whose version has advanced since the client
      last observed it is rejected. Amendments legitimately re-base commercial
      terms, so the later writer must re-read the agreement before re-applying.
    error_id: ERR_STALE_LTA_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: po_unit_price
    trigger: "PurchaseOrder creation (POST /api/purchase-orders)"
    algorithm: tiered_pricing
    formula: |
      1. tier = the element of lta.pricing_tiers with the largest min_qty such
         that quantity >= min_qty (boundary is inclusive: quantity == min_qty
         selects that tier). pricing_tiers is sorted by min_qty ASC and always
         contains min_qty 1.
      2. unit = tier.unit_price_cents
      3. If requires_special_process: unit = unit * (1 + SPECIAL_PROCESS_SURCHARGE_PCT)
      4. unit = unit * (1 + lta.escalation_pct_per_year) ^ (delivery_year - lta.award_year)
      5. unit_price_cents = round_half_up(unit) to integer cents (single final
         rounding; intermediates are NOT rounded)
      6. total_cents = quantity * unit_price_cents
    input_set: "lta.pricing_tiers, quantity, requires_special_process, delivery_year, lta.escalation_pct_per_year, lta.award_year"
    constants:
      SPECIAL_PROCESS_SURCHARGE_PCT: 0.10
    precision: "integer cents, round_half_up applied once at step 5"
    variants:
      - name: quoted_at_creation
        when: "PO creation — value pinned on the PO forever (unit_price_cents, total_cents, lta_version_pinned)"
        difference: "Uses the LTA tier table as of the pinned LTA version; later amendments never reprice existing POs"
      - name: repriced_for_new_orders
        when: "A subsequent PO created after an LTA amendment"
        difference: "Uses the amended tier table; two POs with identical quantities can legitimately carry different unit_price_cents"

  - name: ncr_disposition_cost
    trigger: "NCR disposition (estimated variant) and NCR verify (actual variant)"
    algorithm: aggregation
    formula: |
      Estimated (at disposition):
        per_unit_raw = rework_hours_per_unit * LABOR_RATE_CENTS_PER_HOUR + material_cost_per_unit_cents
        per_unit = round_half_up(per_unit_raw) to integer cents
        estimated_cost_cents = per_unit * quantity_affected
      Actual (at verify, when actual inputs supplied):
        per_unit_raw = actual_rework_hours_per_unit * LABOR_RATE_CENTS_PER_HOUR + actual_material_cost_per_unit_cents
        per_unit = round_half_up(per_unit_raw) to integer cents
        actual_cost_cents = per_unit * quantity_affected
      Rounding order is pinned: round EACH unit's cost first, THEN multiply by
      quantity_affected. (Sum-then-round yields a different result and is wrong.)
    input_set: "rework_hours_per_unit, material_cost_per_unit_cents (or actual_* variants), quantity_affected"
    constants:
      LABOR_RATE_CENTS_PER_HOUR: 12500
    precision: "integer cents, round_half_up per unit, then multiply"
    variants:
      - name: estimated
        when: "At MRB disposition, from planner-estimated hours/material"
        difference: "Uses standard estimated inputs; written to estimated_cost_cents"
      - name: actual
        when: "At verify, from recorded actual hours/material"
        difference: "Uses actual_* inputs; same formula but different inputs produce a different value for identical quantities; written to actual_cost_cents"

  - name: spc_capability_index
    trigger: "Every POST /api/work-orders/{woId}/spc-measurements (provisional variant); POST /api/work-orders/{woId}/complete (final variant)"
    algorithm: weighted_scoring
    formula: |
      Input set: the last WINDOW (25) SpcMeasurements for (wo_id, characteristic_id),
      ordered by created_at ASC (ties broken by created_at only; tests must use
      distinct clock timestamps).
      1. If count < MIN_MEASUREMENTS (5): no Cpk; characteristic.spc_eval_status = MONITORING.
      2. mean = sum(x_i) / n
      3. Provisional variant (during production): s = sqrt( sum((x_i - mean)^2) / (n - 1) )
         Final variant (at WO completion):        sigma = sqrt( sum((x_i - mean)^2) / n )
      4. USL = characteristic.usl, LSL = characteristic.lsl
         cpk = min(USL - mean, mean - LSL) / (3 * s_or_sigma)
      5. Reported cpk is round_half_up to 3 decimal places; reported mean and
         stddev are round_half_up to 4 decimal places; threshold comparison uses
         the ROUNDED 3-dp cpk.
      6. cpk >= CPK_THRESHOLD (1.33): characteristic.spc_eval_status = CAPABLE
         cpk <  CPK_THRESHOLD (1.33): characteristic.spc_eval_status = INCAPABLE
    input_set: "SpcMeasurements for the (wo_id, characteristic_id) pair, last 25 by created_at ASC"
    constants:
      MIN_MEASUREMENTS: 5
      WINDOW: 25
      CPK_THRESHOLD: 1.33
    precision: "mean/stddev 4 dp round_half_up (display only); cpk 3 dp round_half_up; threshold compares the rounded cpk with >="
    variants:
      - name: provisional
        when: "On every measurement during production"
        difference: "Sample stddev with (n-1) denominator -> smaller denominator, larger stddev, smaller cpk_provisional"
      - name: final
        when: "At work-order completion"
        difference: "Population stddev with n denominator -> larger denominator, smaller stddev, larger cpk_final; identical measurements therefore yield cpk_final > cpk_provisional"

  - name: lta_annual_volume_rebate
    trigger: "GET /api/ltas/{ltaId}/rebate-preview?year=YYYY"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is pinned to break the apparent circularity (rebate tier
      depends on the year's invoiced total, net depends on rebate):
      1. gross_invoiced_cents = sum(total_cents of PurchaseOrders of this LTA
         with status == CLOSED whose closure (delivered_quantity reaching
         quantity) happened in the requested calendar year, per the logical clock
         timestamps of the PO-closing serial shipments)
      2. tier = element of rebate_tiers with largest min_invoiced_cents such that
         gross_invoiced_cents >= min_invoiced_cents (inclusive boundary)
      3. rebate_pct = tier.rebate_pct
      4. rebate_cents = round_half_up(gross_invoiced_cents * rebate_pct)
      5. net_cents = gross_invoiced_cents - rebate_cents
    input_set: "CLOSED PurchaseOrders of the LTA in the requested year; lta.rebate_tiers"
    constants: {}
    precision: "integer cents, round_half_up at step 4"

  - name: rate_readiness_score
    trigger: "POST /api/ltas/{ltaId}/run-rate-audit"
    algorithm: threshold
    formula: |
      1. month = current logical-clock calendar month (YYYY-MM)
      2. demonstrated_units = sum(quantity of WorkOrders of POs of this LTA with
         status == COMPLETED and completed_at inside `month`)
      3. readiness_pct = round_half_up(100 * demonstrated_units / committed_monthly_rate_units) to integer
      4. readiness_pct >= READY_MIN (100): result READY
         MARGINAL_MIN (80) <= readiness_pct < READY_MIN: result MARGINAL
         readiness_pct < MARGINAL_MIN: result NOT_READY
      5. If last_audit_month == month: re-running replaces the stored result and
         does NOT change consecutive_not_ready_count twice; the count is adjusted
         to what it would be if this result were the only audit for `month`.
      6. result NOT_READY: consecutive_not_ready_count += 1 (subject to rule 5);
         else consecutive_not_ready_count = 0.
      7. If consecutive_not_ready_count reaches SUSPEND_AFTER (2):
         LTA -> SUSPENDED (automatic transition).
    input_set: "COMPLETED WorkOrders of the LTA's POs in the current logical month"
    constants:
      READY_MIN: 100
      MARGINAL_MIN: 80
      SUSPEND_AFTER: 2
    precision: "readiness_pct integer, round_half_up"

  - name: fai_characteristic_completeness
    trigger: "After every characteristic add and every record-measurement on the FAI"
    algorithm: aggregation
    formula: |
      characteristic_count = count of BalloonedCharacteristics of the FAI
      measured_count = count with result IN {PASS, FAIL}
      characteristics_complete = (characteristic_count >= 1) AND (measured_count == characteristic_count)
    input_set: "All BalloonedCharacteristics of the FAI, any result status"
    constants: {}
    precision: "integers"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is permitted on this endpoint per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path and body-referenced resource ids exist (path ids validated left-to-right; then body FKs)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with resource ids
  - priority: 4
    category: state
    check: "OCC: expected_lta_version equals LongTermAgreement.version"
    error_id: ERR_STALE_LTA_VERSION
    http_status: 412
    applies_to: ["POST /api/purchase-orders", "POST /api/ltas/{ltaId}/amend"]
  - priority: 5
    category: state
    check: "Target resource is in a state that permits the requested transition"
    error_id: "state-specific (ERR_LTA_NOT_ACTIVE, ERR_PO_NOT_ACCEPTED, ERR_PO_NOT_RELEASED, ERR_PO_NOT_CANCELLABLE, ERR_FAI_NOT_SUBMITTABLE, ERR_FAI_NOT_SUBMITTED, ERR_FAI_NOT_REOPENABLE, ERR_CHARACTERISTIC_LOCKED, ERR_CHARACTERISTIC_NOT_MEASURABLE, ERR_WO_NOT_RELEASABLE, ERR_WO_NOT_IN_PRODUCTION, ERR_WO_NOT_ACCEPTING_SERIALS, ERR_WO_NOT_ACCEPTABLE, ERR_WO_NOT_CANCELLABLE, ERR_WO_NOT_ON_HOLD, ERR_SERIAL_NOT_SHIPPABLE, ERR_CERT_NOT_ACCEPTABLE, ERR_CERT_ALREADY_REVOKED, ERR_SOURCE_NOT_APPROVABLE, ERR_INVALID_STATE)"
    http_status: 409
    applies_to: all state-transition endpoints
  - priority: 6
    category: business_safety
    check: "Segregation of duties: FAI submitter != any characteristic recorder; NCR disposer != NCR discoverer; material-cert acceptor != cert creator"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: ["POST /api/first-articles/{faiId}/submit", "POST /api/ncrs/{ncrId}/disposition", "POST /api/material-certs/{certId}/accept"]
  - priority: 7
    category: business_safety
    check: "Counterfeit prevention / source approval: material cert source APPROVED with RAW_MATERIAL or DISTRIBUTOR scope; process-approval source APPROVED with SPECIAL_PROCESS scope; HIGH counterfeit risk not approvable for RAW_MATERIAL/DISTRIBUTOR; cert not REVOKED and is ACCEPTED before allocation"
    error_id: "ERR_SOURCE_NOT_APPROVED | ERR_COUNTERFEIT_RISK_TOO_HIGH | ERR_MATERIAL_CERT_NOT_ACCEPTED | ERR_MATERIAL_CERT_REVOKED"
    http_status: 422
    applies_to: ["POST /api/material-certs", "POST /api/process-approvals", "POST /api/sources/{sourceId}/approve", "POST /api/work-orders/{woId}/serials", "POST /api/serials/{serialId}/ship"]
  - priority: 8
    category: business_safety
    check: "Airworthiness release gates: approved FAI present when AS9102_FAI flowed down; active special-process approval window for each required process; delegated inspection authority required for inspector final acceptance; serial not under open NCR"
    error_id: "ERR_FAI_REQUIRED | ERR_PROCESS_NOT_APPROVED | ERR_DELEGATION_REQUIRED | ERR_SERIAL_UNDER_NCR"
    http_status: 422
    applies_to: ["POST /api/work-orders/{woId}/release", "POST /api/work-orders/{woId}/accept", "POST /api/serials/{serialId}/ship"]
  - priority: 9
    category: business_constraint
    check: "Uniqueness and completeness: po_number unique per LTA; balloon_number unique per FAI; FAI complete and all PASS before submit; WO serial count complete before completion; no open NCRs blocking completion/hold-release; no active WOs blocking PO cancel; no open POs blocking LTA close; concession recorded before USE_AS_IS verify; escape acknowledged before NCR close"
    error_id: "ERR_PO_NUMBER_EXISTS | ERR_BALLOON_NUMBER_EXISTS | ERR_FAI_INCOMPLETE_CHARACTERISTICS | ERR_FAI_CHARACTERISTIC_FAILURE | ERR_SERIALS_INCOMPLETE | ERR_WO_OPEN_NCR | ERR_PO_HAS_ACTIVE_WORK | ERR_LTA_HAS_OPEN_ORDERS | ERR_NCR_REQUIRES_CONCESSION | ERR_ESCAPE_NOT_ACKNOWLEDGED"
    http_status: 422
    applies_to: various (see errors)
  - priority: 10
    category: business_temporal
    check: "Windows and deadlines: valid_to > valid_from (SPA) / valid_to >= valid_from (DIA); SPA windows half-open non-overlapping per (source, process); DIA windows closed non-overlapping per (po, inspector); 30-day cooling-off after DIA revocation; escape submitted within 48h (inclusive)"
    error_id: "ERR_INVALID_WINDOW | ERR_APPROVAL_WINDOW_OVERLAP | ERR_DELEGATION_WINDOW_OVERLAP | ERR_DIA_COOLING_OFF | ERR_ESCAPE_WINDOW_EXCEEDED"
    http_status: 409
    applies_to: ["POST /api/process-approvals", "POST /api/process-approvals/{paId}/reinstate", "POST /api/delegations", "POST /api/escape-reports/{erId}/submit"]
  - priority: 11
    category: business_fiscal
    check: "Money and quantity capacity: PO total within LTA remaining ceiling; WO quantity within PO unreleased quantity; serial batch within WO remaining quantity and material cert available quantity"
    error_id: "ERR_LTA_CEILING_EXCEEDED | ERR_QUANTITY_EXCEEDS_UNRELEASED | ERR_SERIAL_BATCH_EXCEEDS_QUANTITY | ERR_INSUFFICIENT_MATERIAL_QUANTITY"
    http_status: 402
    applies_to: ["POST /api/purchase-orders", "POST /api/work-orders", "POST /api/work-orders/{woId}/serials"]

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- LongTermAgreement ---
  - method: POST
    path: "/api/ltas"
    description: "Create a LongTermAgreement (status DRAFT; remaining_ceiling_cents = ceiling_cents)"
    roles: [ContractsManager]
    code: 201
    input: [customer_name, ceiling_cents, pricing_tiers, committed_monthly_rate_units, escalation_pct_per_year, award_year, rebate_tiers]
    output: LongTermAgreement
    side_effects: ["status = DRAFT", "remaining_ceiling_cents = ceiling_cents"]
  - method: GET
    path: "/api/ltas"
    description: "List LTAs"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "LongTermAgreement[]"
    side_effects: []
  - method: GET
    path: "/api/ltas/{ltaId}"
    description: "Get one LTA"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: []
    output: LongTermAgreement
    side_effects: []
  - method: POST
    path: "/api/ltas/{ltaId}/activate"
    description: "DRAFT -> ACTIVE"
    roles: [ContractsManager]
    code: 200
    input: []
    output: LongTermAgreement
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/api/ltas/{ltaId}/amend"
    description: "Amend commercial terms (pricing_tiers, ceiling, escalation, rebates, committed rate). Allowed in DRAFT and ACTIVE; state unchanged. OCC-guarded."
    roles: [ContractsManager]
    code: 200
    input: [expected_lta_version, "pricing_tiers?", "ceiling_cents?", "escalation_pct_per_year?", "rebate_tiers?", "committed_monthly_rate_units?"]
    output: LongTermAgreement
    side_effects:
      - "Increments LongTermAgreement.version by 1"
      - "If ceiling_cents amended: remaining_ceiling_cents re-derived as new ceiling minus non-CANCELLED PO totals"
      - "Existing POs are NOT repriced (version-pinned)"
  - method: POST
    path: "/api/ltas/{ltaId}/close"
    description: "ACTIVE|SUSPENDED -> CLOSED (no open POs)"
    roles: [ContractsManager]
    code: 200
    input: []
    output: LongTermAgreement
    side_effects: ["status -> CLOSED"]
  - method: POST
    path: "/api/ltas/{ltaId}/reinstate"
    description: "SUSPENDED -> ACTIVE; resets consecutive_not_ready_count"
    roles: [ContractsManager]
    code: 200
    input: []
    output: LongTermAgreement
    side_effects: ["status -> ACTIVE", "consecutive_not_ready_count = 0"]
  - method: POST
    path: "/api/ltas/{ltaId}/run-rate-audit"
    description: "Run monthly rate-readiness audit (rate_readiness_score); may auto-SUSPEND the LTA"
    roles: [QualityManager]
    code: 200
    input: []
    output: LongTermAgreement
    side_effects:
      - "Computes rate_readiness_score for the current logical month"
      - "Updates last_audit_month, last_audit_result, consecutive_not_ready_count"
      - "If consecutive_not_ready_count reaches 2: status -> SUSPENDED"
  - method: GET
    path: "/api/ltas/{ltaId}/rebate-preview"
    description: "Computed read: annual volume rebate for a calendar year (lta_annual_volume_rebate); year defaults to the current logical-clock year"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: ["year?"]
    output: { year: integer, gross_invoiced_cents: integer, rebate_pct: number, rebate_cents: integer, net_cents: integer }
    side_effects: []

  # --- PurchaseOrder ---
  - method: POST
    path: "/api/purchase-orders"
    description: "Create a PO against an ACTIVE LTA; computes and pins tiered pricing; debits LTA ceiling. OCC-guarded on LTA version."
    roles: [ContractsManager]
    code: 201
    input: [lta_id, po_number, part_number, part_revision, quantity, flowdown_clauses, requires_special_process, delivery_year, expected_lta_version]
    output: PurchaseOrder
    side_effects:
      - "unit_price_cents, total_cents computed via po_unit_price (pinned)"
      - "lta_version_pinned = LTA.version at creation"
      - "LongTermAgreement.remaining_ceiling_cents -= total_cents (ERR_LTA_CEILING_EXCEEDED if negative)"
      - "Increments LongTermAgreement.version by 1"
      - "status = RECEIVED"
      - "unreleased_quantity = quantity, delivered_quantity = 0"
  - method: GET
    path: "/api/purchase-orders"
    description: "List POs (filterable)"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: ["lta_id?", "part_number?", "status?", "limit?", "offset?"]
    output: "PurchaseOrder[]"
    side_effects: []
  - method: GET
    path: "/api/purchase-orders/{poId}"
    description: "Get one PO"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: []
  - method: POST
    path: "/api/purchase-orders/{poId}/accept"
    description: "Flow-down review passed: RECEIVED -> ACCEPTED"
    roles: [ContractsManager]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: ["status -> ACCEPTED"]
  - method: POST
    path: "/api/purchase-orders/{poId}/release"
    description: "ACCEPTED -> RELEASED (requires LTA ACTIVE)"
    roles: [ContractsManager]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: ["status -> RELEASED"]
  - method: POST
    path: "/api/purchase-orders/{poId}/cancel"
    description: "Cancel a non-terminal PO; restores LTA ceiling; cancels PLANNED/RELEASED work orders"
    roles: [ContractsManager]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects:
      - "status -> CANCELLED"
      - "WorkOrders in {PLANNED, RELEASED} -> CANCELLED"
      - "LongTermAgreement.remaining_ceiling_cents += total_cents"
      - "Increments LongTermAgreement.version by 1"

  # --- FirstArticleInspection + BalloonedCharacteristic ---
  - method: POST
    path: "/api/first-articles"
    description: "Create an FAI (AS9102) for a part number + revision (status DRAFT)"
    roles: [QualityInspector]
    code: 201
    input: [part_number, part_revision, fai_type]
    output: FirstArticleInspection
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/api/first-articles"
    description: "List FAIs (filterable)"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: ["part_number?", "part_revision?", "status?", "limit?", "offset?"]
    output: "FirstArticleInspection[]"
    side_effects: []
  - method: GET
    path: "/api/first-articles/{faiId}"
    description: "Get one FAI"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: []
    output: FirstArticleInspection
    side_effects: []
  - method: POST
    path: "/api/first-articles/{faiId}/characteristics"
    description: "Add a ballooned characteristic (FAI must be DRAFT or IN_INSPECTION); first add moves FAI DRAFT -> IN_INSPECTION"
    roles: [QualityInspector]
    code: 201
    input: [balloon_number, nominal, tolerance_plus, tolerance_minus, "is_key_characteristic?"]
    output: BalloonedCharacteristic
    side_effects:
      - "usl/lsl computed"
      - "result = UNMEASURED"
      - "FAI.characteristic_count recomputed; first characteristic moves FAI DRAFT -> IN_INSPECTION"
  - method: GET
    path: "/api/first-articles/{id}/characteristics"
    description: "List characteristics of an FAI"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "BalloonedCharacteristic[]"
    side_effects: []
  - method: POST
    path: "/api/first-articles/{faiId}/submit"
    description: "IN_INSPECTION -> SUBMITTED; enforces completeness, all-PASS, and segregation of duties"
    roles: [QualityInspector]
    code: 200
    input: []
    output: FirstArticleInspection
    side_effects: ["status -> SUBMITTED", "submitted_by_user_id = X-User-ID"]
  - method: POST
    path: "/api/first-articles/{faiId}/approve"
    description: "SUBMITTED -> APPROVED; pins revision; supersedes prior APPROVED FAIs of same part+revision"
    roles: [CustomerQualityRep]
    code: 200
    input: []
    output: FirstArticleInspection
    side_effects:
      - "status -> APPROVED"
      - "approved_revision = part_revision"
      - "Other APPROVED FAIs with same (part_number, part_revision) -> SUPERSEDED"
  - method: POST
    path: "/api/first-articles/{faiId}/reject"
    description: "SUBMITTED -> REJECTED"
    roles: [CustomerQualityRep]
    code: 200
    input: [reason]
    output: FirstArticleInspection
    side_effects: ["status -> REJECTED"]
  - method: POST
    path: "/api/first-articles/{faiId}/reopen"
    description: "REJECTED -> IN_INSPECTION (rework loop)"
    roles: [QualityInspector]
    code: 200
    input: []
    output: FirstArticleInspection
    side_effects: ["status -> IN_INSPECTION"]
  - method: GET
    path: "/api/characteristics/{charId}"
    description: "Get one ballooned characteristic"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: []
    output: BalloonedCharacteristic
    side_effects: []
  - method: POST
    path: "/api/characteristics/{charId}/record-measurement"
    description: "Record FAI measurement; computes PASS/FAIL from usl/lsl; allowed from UNMEASURED or FAIL"
    roles: [QualityInspector]
    code: 200
    input: [measured_value]
    output: BalloonedCharacteristic
    side_effects:
      - "measured_value stored; measured_by_user_id = X-User-ID"
      - "result recomputed: PASS when lsl <= measured_value <= usl else FAIL"
      - "FAI.measured_count and characteristics_complete recomputed (fai_characteristic_completeness)"
  - method: GET
    path: "/api/characteristics/{id}/spc-measurements"
    description: "List SPC measurements recorded against this characteristic"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "SpcMeasurement[]"
    side_effects: []

  # --- WorkOrder + SerialNumber + SpcMeasurement ---
  - method: POST
    path: "/api/work-orders"
    description: "Create a WO under a PO; debits PO.unreleased_quantity"
    roles: [ManufacturingPlanner]
    code: 201
    input: [po_id, quantity, "special_processes_required?"]
    output: WorkOrder
    side_effects:
      - "status = PLANNED"
      - "PurchaseOrder.unreleased_quantity -= quantity (ERR_QUANTITY_EXCEEDS_UNRELEASED if negative; equality allowed)"
  - method: GET
    path: "/api/work-orders"
    description: "List WOs (filterable)"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: ["po_id?", "status?", "limit?", "offset?"]
    output: "WorkOrder[]"
    side_effects: []
  - method: GET
    path: "/api/work-orders/{woId}"
    description: "Get one WO"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: POST
    path: "/api/work-orders/{woId}/release"
    description: "PLANNED -> RELEASED; enforces PO-released, FAI-approved (when flowed down), and special-process approval gates"
    roles: [ManufacturingPlanner]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status -> RELEASED"]
  - method: POST
    path: "/api/work-orders/{woId}/serials"
    description: "Create a batch of serialized units against a material cert; first batch moves WO RELEASED -> IN_PRODUCTION"
    roles: [ManufacturingPlanner]
    code: 201
    input: [material_cert_id, count]
    output: "SerialNumber[]"
    side_effects:
      - "Creates count SerialNumbers (serial_number SN-0001.. per WO in creation order)"
      - "MaterialCert.quantity_available -= count (ERR_INSUFFICIENT_MATERIAL_QUANTITY if negative; equality allowed)"
      - "serials_created_count += count (ERR_SERIAL_BATCH_EXCEEDS_QUANTITY if serials_created_count would exceed WO.quantity)"
      - "First batch: WO RELEASED -> IN_PRODUCTION"
  - method: GET
    path: "/api/work-orders/{woId}/serials"
    description: "List serials of a WO"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "SerialNumber[]"
    side_effects: []
  - method: POST
    path: "/api/work-orders/{woId}/spc-measurements"
    description: "Record an SPC measurement for a key characteristic (requires WO IN_PRODUCTION, else ERR_WO_NOT_IN_PRODUCTION; characteristic must have is_key_characteristic == true, else ERR_INVALID_REQUEST); recomputes provisional Cpk; INCAPABLE crossing auto-creates an NCR"
    roles: [QualityInspector]
    code: 201
    input: [characteristic_id, measured_value]
    output: SpcMeasurement
    side_effects:
      - "Creates SpcMeasurement (recorded_by_user_id = X-User-ID)"
      - "spc_capability_index provisional variant recomputed for (wo_id, characteristic_id) when count >= 5"
      - "On transition into INCAPABLE: characteristic.spc_eval_status = INCAPABLE, WO.spc_status = INCAPABLE, WO.requires_100pct_inspection = true, and auto-create NonconformanceReport (origin AUTO_SPC, defect_code SPC_CAPABILITY_LOSS, quantity_affected 1, status OPEN)"
      - "WO.spc_status = worst posture across key characteristics (INCAPABLE > MONITORING > CAPABLE)"
  - method: GET
    path: "/api/work-orders/{id}/spc-measurements"
    description: "List SPC measurements of a WO"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: ["characteristic_id?", "limit?", "offset?"]
    output: "SpcMeasurement[]"
    side_effects: []
  - method: POST
    path: "/api/work-orders/{woId}/complete"
    description: "IN_PRODUCTION -> FINAL_INSPECTION; computes final (population-stddev) Cpk per key characteristic"
    roles: [ManufacturingPlanner]
    code: 200
    input: []
    output: WorkOrder
    side_effects:
      - "status -> FINAL_INSPECTION"
      - "cpk_final computed per key characteristic with >= 5 measurements (spc_capability_index final variant)"
  - method: POST
    path: "/api/work-orders/{woId}/accept"
    description: "FINAL_INSPECTION -> COMPLETED. CustomerQualityRep always; QualityInspector only with an in-window ACTIVE delegation for this PO (delegated inspection authority)"
    roles: [CustomerQualityRep, QualityInspector]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status -> COMPLETED", "completed_at = current logical clock"]
  - method: POST
    path: "/api/work-orders/{woId}/cancel"
    description: "PLANNED|RELEASED -> CANCELLED; returns quantity to PO.unreleased_quantity"
    roles: [ManufacturingPlanner]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status -> CANCELLED", "PurchaseOrder.unreleased_quantity += quantity"]
  - method: POST
    path: "/api/work-orders/{woId}/release-hold"
    description: "QUALITY_HOLD -> IN_PRODUCTION (no quarantined serials, no open NCRs)"
    roles: [QualityManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status -> IN_PRODUCTION"]
  - method: POST
    path: "/api/work-orders/{woId}/ship-all"
    description: "Bulk shipment: ships every CREATED serial of a COMPLETED work order. Atomic — if any CREATED serial fails a ship precondition (cert REVOKED, serial under open NCR), the whole batch is rejected with that error and nothing ships."
    roles: [ManufacturingPlanner]
    code: 200
    input: []
    output: "SerialNumber[]"
    side_effects:
      - "Every CREATED serial -> SHIPPED (same preconditions as POST /api/serials/{serialId}/ship, incl. ERR_SERIAL_UNDER_NCR and ERR_MATERIAL_CERT_REVOKED)"
      - "PurchaseOrder.delivered_quantity += number shipped"
      - "If delivered_quantity == quantity: PurchaseOrder -> CLOSED"
  - method: GET
    path: "/api/serials"
    description: "List serials (filterable)"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: ["wo_id?", "material_cert_id?", "status?", "limit?", "offset?"]
    output: "SerialNumber[]"
    side_effects: []
  - method: GET
    path: "/api/serials/{serialId}"
    description: "Get one serial"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: []
    output: SerialNumber
    side_effects: []
  - method: POST
    path: "/api/serials/{serialId}/ship"
    description: "CREATED -> SHIPPED; bubbles delivered_quantity; may auto-CLOSE the PO"
    roles: [ManufacturingPlanner]
    code: 200
    input: []
    output: SerialNumber
    side_effects:
      - "status -> SHIPPED; shipped_at = clock"
      - "PurchaseOrder.delivered_quantity += 1"
      - "If delivered_quantity == quantity: PurchaseOrder -> CLOSED"

  # --- MaterialCert ---
  - method: POST
    path: "/api/material-certs"
    description: "Register a material certification (mill cert) from an APPROVED material source"
    roles: [SupplyChainManager]
    code: 201
    input: [source_id, heat_number, material_spec, quantity_received]
    output: MaterialCert
    side_effects: ["status = RECEIVED", "quantity_available = quantity_received", "created_by_user_id = X-User-ID"]
  - method: GET
    path: "/api/material-certs"
    description: "List material certs (filterable)"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: ["source_id?", "status?", "limit?", "offset?"]
    output: "MaterialCert[]"
    side_effects: []
  - method: GET
    path: "/api/material-certs/{certId}"
    description: "Get one material cert"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: []
    output: MaterialCert
    side_effects: []
  - method: POST
    path: "/api/material-certs/{certId}/accept"
    description: "Receiving inspection: RECEIVED -> ACCEPTED (segregation of duties vs creator)"
    roles: [QualityInspector]
    code: 200
    input: []
    output: MaterialCert
    side_effects: ["status -> ACCEPTED"]
  - method: POST
    path: "/api/material-certs/{certId}/revoke"
    description: "Counterfeit containment: -> REVOKED; quarantines serials, holds work orders, auto-creates NCRs (and EscapeReports if shipped)"
    roles: [QualityManager]
    code: 200
    input: [reason]
    output: MaterialCert
    side_effects:
      - "status -> REVOKED"
      - "Cascade C1: CREATED serials -> QUARANTINED; their IN_PRODUCTION WOs -> QUALITY_HOLD; AUTO_COUNTERFEIT NCR per held WO; DRAFT EscapeReport when a SHIPPED serial was affected"

  # --- ApprovedSource ---
  - method: POST
    path: "/api/sources"
    description: "Register an approved-source candidate (status PROVISIONAL)"
    roles: [SupplyChainManager]
    code: 201
    input: [supplier_code, approval_scope, counterfeit_risk_rating]
    output: ApprovedSource
    side_effects: ["status = PROVISIONAL"]
  - method: GET
    path: "/api/sources"
    description: "List sources (filterable)"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: ["status?", "approval_scope?", "limit?", "offset?"]
    output: "ApprovedSource[]"
    side_effects: []
  - method: GET
    path: "/api/sources/{sourceId}"
    description: "Get one source"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: []
    output: ApprovedSource
    side_effects: []
  - method: POST
    path: "/api/sources/{sourceId}/approve"
    description: "PROVISIONAL -> APPROVED; HIGH counterfeit risk blocks material scopes"
    roles: [SupplyChainManager]
    code: 200
    input: []
    output: ApprovedSource
    side_effects: ["status -> APPROVED"]
  - method: POST
    path: "/api/sources/{sourceId}/disqualify"
    description: "-> DISQUALIFIED (terminal); suspends ACTIVE process approvals"
    roles: [SupplyChainManager]
    code: 200
    input: [reason]
    output: ApprovedSource
    side_effects: ["status -> DISQUALIFIED", "ACTIVE SpecialProcessApprovals of source -> SUSPENDED"]

  # --- SpecialProcessApproval ---
  - method: POST
    path: "/api/process-approvals"
    description: "Grant a special-process approval window (half-open [valid_from, valid_to)); overlap with an ACTIVE window of same (source, process) rejected"
    roles: [SupplyChainManager]
    code: 201
    input: [source_id, process_code, valid_from, valid_to, cert_reference]
    output: SpecialProcessApproval
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/api/process-approvals"
    description: "List process approvals (filterable)"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: ["source_id?", "process_code?", "status?", "limit?", "offset?"]
    output: "SpecialProcessApproval[]"
    side_effects: []
  - method: GET
    path: "/api/process-approvals/{paId}"
    description: "Get one process approval"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: []
    output: SpecialProcessApproval
    side_effects: []
  - method: POST
    path: "/api/process-approvals/{paId}/suspend"
    description: "ACTIVE -> SUSPENDED"
    roles: [SupplyChainManager]
    code: 200
    input: []
    output: SpecialProcessApproval
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/api/process-approvals/{paId}/reinstate"
    description: "SUSPENDED -> ACTIVE; re-applies the window-overlap rule"
    roles: [SupplyChainManager]
    code: 200
    input: []
    output: SpecialProcessApproval
    side_effects: ["status -> ACTIVE"]

  # --- NonconformanceReport ---
  - method: POST
    path: "/api/ncrs"
    description: "Open an NCR on a work order; detected_post_shipment auto-creates a DRAFT EscapeReport"
    roles: [QualityInspector]
    code: 201
    input: [wo_id, defect_code, description, quantity_affected, "affected_serial_ids?", detected_post_shipment]
    output: NonconformanceReport
    side_effects:
      - "status = OPEN; discovered_by_user_id = X-User-ID; origin = MANUAL"
      - "affected_serial_ids validated: each exists and belongs to wo_id (ERR_SERIAL_NOT_FOUND / ERR_INVALID_REQUEST)"
      - "If detected_post_shipment: create EscapeReport (status DRAFT, due_at = NCR.created_at + 48h)"
  - method: GET
    path: "/api/ncrs"
    description: "List NCRs (filterable)"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: ["wo_id?", "status?", "disposition?", "limit?", "offset?"]
    output: "NonconformanceReport[]"
    side_effects: []
  - method: GET
    path: "/api/ncrs/{ncrId}"
    description: "Get one NCR"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: []
    output: NonconformanceReport
    side_effects: []
  - method: POST
    path: "/api/ncrs/{ncrId}/submit-mrb"
    description: "OPEN -> MRB_REVIEW"
    roles: [QualityManager]
    code: 200
    input: []
    output: NonconformanceReport
    side_effects: ["status -> MRB_REVIEW"]
  - method: POST
    path: "/api/ncrs/{ncrId}/disposition"
    description: "MRB_REVIEW -> DISPOSITIONED with per-branch cascades (SCRAP scraps serials and may hold the WO; USE_AS_IS releases quarantined serials)"
    roles: [MRBMember]
    code: 200
    input: [disposition, "rework_hours_per_unit?", "material_cost_per_unit_cents?"]
    output: NonconformanceReport
    side_effects:
      - "disposition, disposition_by_user_id stored"
      - "estimated_cost_cents = ncr_disposition_cost (estimated variant)"
      - "SCRAP: affected serials -> SCRAPPED; WO counters recomputed; good_quantity == 0 with serials present and WO IN_PRODUCTION -> QUALITY_HOLD"
      - "USE_AS_IS: affected QUARANTINED serials -> CREATED"
  - method: POST
    path: "/api/ncrs/{ncrId}/verify"
    description: "DISPOSITIONED -> VERIFIED; USE_AS_IS requires prior customer concession; accepts actual cost inputs"
    roles: [QualityInspector]
    code: 200
    input: ["actual_rework_hours_per_unit?", "actual_material_cost_per_unit_cents?"]
    output: NonconformanceReport
    side_effects: ["status -> VERIFIED", "actual_cost_cents computed when actual inputs supplied (ncr_disposition_cost actual variant)"]
  - method: POST
    path: "/api/ncrs/{ncrId}/close"
    description: "VERIFIED -> CLOSED; post-shipment escapes require ACKNOWLEDGED EscapeReport"
    roles: [QualityManager]
    code: 200
    input: []
    output: NonconformanceReport
    side_effects: ["status -> CLOSED"]
  - method: POST
    path: "/api/ncrs/{ncrId}/kickback"
    description: "MRB_REVIEW -> OPEN (insufficient containment information; rework loop)"
    roles: [MRBMember]
    code: 200
    input: [reason]
    output: NonconformanceReport
    side_effects: ["status -> OPEN"]
  - method: POST
    path: "/api/ncrs/{ncrId}/customer-concession"
    description: "Record customer concession for a USE_AS_IS disposition (sets concession_approved); valid only when status == DISPOSITIONED and disposition == USE_AS_IS (else ERR_INVALID_STATE)"
    roles: [CustomerQualityRep]
    code: 200
    input: [concession_reference]
    output: NonconformanceReport
    side_effects: ["concession_approved = true"]

  # --- EscapeReport ---
  - method: GET
    path: "/api/escape-reports"
    description: "List escape reports (filterable)"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: ["ncr_id?", "status?", "limit?", "offset?"]
    output: "EscapeReport[]"
    side_effects: []
  - method: GET
    path: "/api/escape-reports/{erId}"
    description: "Get one escape report"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: []
    output: EscapeReport
    side_effects: []
  - method: POST
    path: "/api/escape-reports/{erId}/submit"
    description: "DRAFT -> SUBMITTED; must be within 48h of NCR creation (inclusive boundary)"
    roles: [QualityManager]
    code: 200
    input: []
    output: EscapeReport
    side_effects: ["status -> SUBMITTED", "submitted_at = clock"]
  - method: POST
    path: "/api/escape-reports/{erId}/acknowledge"
    description: "SUBMITTED -> ACKNOWLEDGED (customer acknowledges escape notification)"
    roles: [CustomerQualityRep]
    code: 200
    input: [acknowledgement_reference]
    output: EscapeReport
    side_effects: ["status -> ACKNOWLEDGED"]

  # --- DelegatedInspectionAuthority ---
  - method: POST
    path: "/api/delegations"
    description: "Grant delegated inspection authority for a PO to an inspector (closed window; overlap and 30-day post-revocation cooling-off rejected)"
    roles: [CustomerQualityRep]
    code: 201
    input: [po_id, inspector_user_id, valid_from, valid_to]
    output: DelegatedInspectionAuthority
    side_effects: ["status = ACTIVE", "granted_by_user_id = X-User-ID"]
  - method: GET
    path: "/api/delegations"
    description: "List delegations (filterable)"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: ["po_id?", "inspector_user_id?", "status?", "limit?", "offset?"]
    output: "DelegatedInspectionAuthority[]"
    side_effects: []
  - method: GET
    path: "/api/delegations/{diaId}"
    description: "Get one delegation"
    roles: [ContractsManager, SupplyChainManager, ManufacturingPlanner, QualityInspector, QualityManager, MRBMember, CustomerQualityRep, SystemAdmin]
    code: 200
    input: []
    output: DelegatedInspectionAuthority
    side_effects: []
  - method: POST
    path: "/api/delegations/{diaId}/revoke"
    description: "ACTIVE -> REVOKED; anchors 30-day cooling-off"
    roles: [CustomerQualityRep]
    code: 200
    input: [reason]
    output: DelegatedInspectionAuthority
    side_effects: ["status -> REVOKED", "revoked_at = clock"]

  # --- Test-driving logical clock ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server logical clock (test-driving endpoint). Startup default is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Logical clock set; all date/time-dependent rules read this clock"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted on this endpoint" }
  # --- Input ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid required field, invalid enum, unknown field, or non-positive quantity" }
  - { id: ERR_INVALID_WINDOW, http: 400, condition: "SPA valid_to <= valid_from, or DIA valid_to < valid_from" }
  # --- Not found ---
  - { id: ERR_LTA_NOT_FOUND, http: 404, condition: "LTA id does not exist" }
  - { id: ERR_PO_NOT_FOUND, http: 404, condition: "PurchaseOrder id does not exist" }
  - { id: ERR_FAI_NOT_FOUND, http: 404, condition: "FirstArticleInspection id does not exist" }
  - { id: ERR_CHARACTERISTIC_NOT_FOUND, http: 404, condition: "BalloonedCharacteristic id does not exist" }
  - { id: ERR_WO_NOT_FOUND, http: 404, condition: "WorkOrder id does not exist" }
  - { id: ERR_SERIAL_NOT_FOUND, http: 404, condition: "SerialNumber id does not exist (including ids in affected_serial_ids)" }
  - { id: ERR_MATERIAL_CERT_NOT_FOUND, http: 404, condition: "MaterialCert id does not exist" }
  - { id: ERR_SOURCE_NOT_FOUND, http: 404, condition: "ApprovedSource id does not exist" }
  - { id: ERR_PROCESS_APPROVAL_NOT_FOUND, http: 404, condition: "SpecialProcessApproval id does not exist" }
  - { id: ERR_NCR_NOT_FOUND, http: 404, condition: "NonconformanceReport id does not exist" }
  - { id: ERR_ESCAPE_REPORT_NOT_FOUND, http: 404, condition: "EscapeReport id does not exist" }
  - { id: ERR_DELEGATION_NOT_FOUND, http: 404, condition: "DelegatedInspectionAuthority id does not exist" }
  # --- OCC ---
  - { id: ERR_STALE_LTA_VERSION, http: 412, condition: "expected_lta_version does not match LongTermAgreement.version" }
  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic invalid-from-state rejection for transitions without a more specific error" }
  - { id: ERR_LTA_NOT_ACTIVE, http: 409, condition: "PO create/release requires LTA ACTIVE" }
  - { id: ERR_LTA_HAS_OPEN_ORDERS, http: 409, condition: "LTA close blocked by POs in RECEIVED/ACCEPTED/RELEASED" }
  - { id: ERR_PO_NOT_ACCEPTED, http: 409, condition: "PO release requires ACCEPTED" }
  - { id: ERR_PO_NOT_RELEASED, http: 409, condition: "WO release requires PO RELEASED" }
  - { id: ERR_PO_NOT_CANCELLABLE, http: 409, condition: "PO cancel requires RECEIVED/ACCEPTED/RELEASED" }
  - { id: ERR_FAI_NOT_SUBMITTABLE, http: 409, condition: "FAI submit requires IN_INSPECTION" }
  - { id: ERR_FAI_NOT_SUBMITTED, http: 409, condition: "FAI approve/reject requires SUBMITTED" }
  - { id: ERR_FAI_NOT_REOPENABLE, http: 409, condition: "FAI reopen requires REJECTED" }
  - { id: ERR_CHARACTERISTIC_LOCKED, http: 409, condition: "Characteristic add/measure requires FAI in DRAFT or IN_INSPECTION" }
  - { id: ERR_CHARACTERISTIC_NOT_MEASURABLE, http: 409, condition: "Re-measurement of a PASS characteristic" }
  - { id: ERR_WO_NOT_RELEASABLE, http: 409, condition: "WO release requires PLANNED" }
  - { id: ERR_WO_NOT_IN_PRODUCTION, http: 409, condition: "WO complete requires IN_PRODUCTION" }
  - { id: ERR_WO_NOT_ACCEPTING_SERIALS, http: 409, condition: "Serial batch creation requires WO RELEASED or IN_PRODUCTION" }
  - { id: ERR_WO_NOT_ACCEPTABLE, http: 409, condition: "WO accept requires FINAL_INSPECTION (also used when shipping requires WO COMPLETED)" }
  - { id: ERR_WO_NOT_CANCELLABLE, http: 409, condition: "WO cancel requires PLANNED or RELEASED" }
  - { id: ERR_WO_NOT_ON_HOLD, http: 409, condition: "release-hold requires QUALITY_HOLD" }
  - { id: ERR_SERIAL_NOT_SHIPPABLE, http: 409, condition: "Serial ship requires CREATED" }
  - { id: ERR_CERT_NOT_ACCEPTABLE, http: 409, condition: "Cert accept requires RECEIVED" }
  - { id: ERR_CERT_ALREADY_REVOKED, http: 409, condition: "Cert already REVOKED" }
  - { id: ERR_SOURCE_NOT_APPROVABLE, http: 409, condition: "Source approve/disqualify from an invalid state" }
  # --- Business safety ---
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: actor matches the anchored user (FAI recorder, NCR discoverer, cert creator)" }
  - { id: ERR_SOURCE_NOT_APPROVED, http: 422, condition: "Material cert source is not APPROVED with RAW_MATERIAL or DISTRIBUTOR scope" }
  - { id: ERR_COUNTERFEIT_RISK_TOO_HIGH, http: 422, condition: "HIGH counterfeit-risk source cannot be approved for RAW_MATERIAL/DISTRIBUTOR scope" }
  - { id: ERR_MATERIAL_CERT_NOT_ACCEPTED, http: 422, condition: "Serial batch requires cert ACCEPTED (cert still RECEIVED)" }
  - { id: ERR_MATERIAL_CERT_REVOKED, http: 422, condition: "Material cert is REVOKED (serial batch creation or shipment)" }
  - { id: ERR_FAI_REQUIRED, http: 422, condition: "WO release requires an APPROVED FAI for (part_number, part_revision) when AS9102_FAI is flowed down" }
  - { id: ERR_PROCESS_NOT_APPROVED, http: 422, condition: "WO release lacks an in-window ACTIVE special-process approval from an APPROVED source for a required process" }
  - { id: ERR_DELEGATION_REQUIRED, http: 403, condition: "QualityInspector final acceptance requires an ACTIVE in-window delegation for this PO and inspector" }
  - { id: ERR_SERIAL_UNDER_NCR, http: 422, condition: "Serial listed on an NCR in OPEN or MRB_REVIEW" }
  # --- Business constraint ---
  - { id: ERR_PO_NUMBER_EXISTS, http: 409, condition: "po_number already used under this LTA" }
  - { id: ERR_BALLOON_NUMBER_EXISTS, http: 409, condition: "balloon_number already used on this FAI" }
  - { id: ERR_FAI_INCOMPLETE_CHARACTERISTICS, http: 422, condition: "FAI submit with zero characteristics or any UNMEASURED" }
  - { id: ERR_FAI_CHARACTERISTIC_FAILURE, http: 422, condition: "FAI submit with any characteristic result FAIL" }
  - { id: ERR_SERIALS_INCOMPLETE, http: 422, condition: "WO complete requires serials_created_count == quantity" }
  - { id: ERR_WO_OPEN_NCR, http: 409, condition: "WO has an NCR in OPEN or MRB_REVIEW (blocks complete and release-hold); also blocks release-hold when quarantined serials exist" }
  - { id: ERR_PO_HAS_ACTIVE_WORK, http: 409, condition: "PO cancel blocked by a WO in IN_PRODUCTION/QUALITY_HOLD/FINAL_INSPECTION" }
  - { id: ERR_NCR_REQUIRES_CONCESSION, http: 422, condition: "USE_AS_IS verify requires concession_approved == true" }
  - { id: ERR_ESCAPE_NOT_ACKNOWLEDGED, http: 409, condition: "Post-shipment NCR close requires linked EscapeReport ACKNOWLEDGED" }
  # --- Temporal ---
  - { id: ERR_APPROVAL_WINDOW_OVERLAP, http: 409, condition: "New/reinstated ACTIVE SPA window overlaps an ACTIVE window of same (source, process); half-open [from,to) — adjacency (new.from == old.to) allowed" }
  - { id: ERR_DELEGATION_WINDOW_OVERLAP, http: 409, condition: "New delegation's closed window [from,to] intersects an ACTIVE delegation of same (po, inspector); touching boundaries count as overlap" }
  - { id: ERR_DIA_COOLING_OFF, http: 409, condition: "Re-grant to same (po, inspector) with valid_from earlier than revoked_at date + 30 days" }
  - { id: ERR_ESCAPE_WINDOW_EXCEEDED, http: 422, condition: "Escape submit after due_at (NCR.created_at + 48h; boundary inclusive)" }
  # --- Fiscal ---
  - { id: ERR_LTA_CEILING_EXCEEDED, http: 402, condition: "PO total_cents would push committed totals beyond LTA remaining_ceiling_cents" }
  - { id: ERR_QUANTITY_EXCEEDS_UNRELEASED, http: 422, condition: "WO quantity > PO.unreleased_quantity" }
  - { id: ERR_SERIAL_BATCH_EXCEEDS_QUANTITY, http: 422, condition: "serials_created_count + count > WO.quantity" }
  - { id: ERR_INSUFFICIENT_MATERIAL_QUANTITY, http: 422, condition: "count > MaterialCert.quantity_available" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ContractsManager
    description: "Owns the commercial agreement lifecycle: LTAs and customer POs, flow-down review"
    identity: opaque
    exclusive_operations:
      - "POST /api/ltas, /activate, /amend, /close, /reinstate"
      - "POST /api/purchase-orders, /accept, /release, /cancel"
    shared_operations: ["GET reads"]
  - name: SupplyChainManager
    description: "Owns approved sources, material certs registration, special-process approvals"
    identity: opaque
    exclusive_operations:
      - "POST /api/sources, /approve, /disqualify"
      - "POST /api/material-certs"
      - "POST /api/process-approvals, /suspend, /reinstate"
    shared_operations: ["GET reads"]
  - name: ManufacturingPlanner
    description: "Owns work orders, serialization, shipment"
    identity: opaque
    exclusive_operations:
      - "POST /api/work-orders, /release, /cancel, /complete"
      - "POST /api/work-orders/{id}/serials"
      - "POST /api/serials/{id}/ship"
    shared_operations:
      - "GET reads"
      - "POST /api/work-orders/{id}/accept (shared with CustomerQualityRep; requires delegation)"
  - name: QualityInspector
    description: "Performs FAI ballooning/measurement, receiving inspection, SPC recording, NCR initiation and verification"
    identity: opaque
    exclusive_operations:
      - "POST /api/first-articles (+ /characteristics, /submit, /reopen)"
      - "POST /api/characteristics/{id}/record-measurement"
      - "POST /api/material-certs/{id}/accept"
      - "POST /api/ncrs, /verify"
      - "POST /api/work-orders/{id}/spc-measurements"
    shared_operations:
      - "GET reads"
      - "POST /api/work-orders/{id}/accept (delegated final acceptance)"
  - name: MRBMember
    description: "Material Review Board member; dispositions nonconformances (segregated from NCR discoverer)"
    identity: opaque
    exclusive_operations:
      - "POST /api/ncrs/{id}/disposition"
      - "POST /api/ncrs/{id}/kickback"
    shared_operations: ["GET reads"]
  - name: QualityManager
    description: "Quality leadership: MRB submission, NCR closure, counterfeit revocation, escape submission, rate audits, hold release"
    identity: opaque
    exclusive_operations:
      - "POST /api/ncrs/{id}/submit-mrb, /close"
      - "POST /api/material-certs/{id}/revoke"
      - "POST /api/escape-reports/{id}/submit"
      - "POST /api/ltas/{id}/run-rate-audit"
      - "POST /api/work-orders/{id}/release-hold"
    shared_operations: ["GET reads"]
  - name: CustomerQualityRep
    description: "Customer quality representative: FAI approval, delegation grants, escape acknowledgement, source inspection, concessions"
    identity: opaque
    exclusive_operations:
      - "POST /api/first-articles/{id}/approve, /reject"
      - "POST /api/delegations, /revoke"
      - "POST /api/escape-reports/{id}/acknowledge"
      - "POST /api/ncrs/{id}/customer-concession"
    shared_operations:
      - "GET reads"
      - "POST /api/work-orders/{id}/accept (customer source inspection)"
  - name: SystemAdmin
    description: "Operator role for the logical clock test-driving endpoint"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
    shared_operations: ["GET reads"]
