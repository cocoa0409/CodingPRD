            - call: "GET /sharps/shipments/${shp_b}/non-conformance-events"
              payload: {}
              as: IntakeTechnician
              as_user_id: "tech-77"
              captures: { ev_b: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
