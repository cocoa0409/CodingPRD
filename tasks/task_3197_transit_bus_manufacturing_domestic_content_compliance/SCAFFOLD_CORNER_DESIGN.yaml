            - call: "POST /api/components/${c1}/supplier-docs"
              payload: {}
              as: SupplierRep
              as_user_id: "sup-1"
            - call: "POST /api/components/${c1}/verify-docs"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
