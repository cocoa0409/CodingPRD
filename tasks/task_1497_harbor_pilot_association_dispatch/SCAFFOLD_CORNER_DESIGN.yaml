- section: errors
  instances:
  - name: error_no_eligible_pilot_when_endorsement_expired
    claim_type: violation_to_error
    grounds:
    - errors[ERR_NO_ELIGIBLE_PILOT]
    - calculations.rotation_pilot_selection
    distinguishing_aspect: 'An endorsement with expires_at in the past fails currency, emptying the selector pool: dispatch returns 422 ERR_NO_ELIGIBLE_PILOT and the order stays BOOKED.'
    test_recipe:
      setup:
      - MAIN_TARIFF active; P1 with endorsement expired 2026-06-01; boat BA; O1 BOOKED
      setup_api_calls:
      - call: POST /pilotage/tariff-schedules
        payload:
          effective_from: '2026-01-01T00:00:00Z'
          tiers:
          - min_gt_exclusive: 0
            max_gt_inclusive: 5000
            rate_cents_per_gt: 20
          draft_surcharge_threshold_dm: 100
          draft_surcharge_pct: 0.15
          detention_free_minutes: 30
          detention_rate_cents_per_minute: 200
          delay_rate_cents_per_minute: 150
        as: AssociationAdmin
      - call: POST /pilotage/pilots
        payload:
          full_name: Pilot One
          license_number: LIC-1
          share_units: 1
        as: AssociationAdmin
        captures:
          p1_id: $.data.id
          p1_v: $.data.version
      - call: POST /pilotage/pilots/${p1_id}/endorsements
        payload:
          endorsement_class: UNLIMITED
          tonnage_cap_gt: 100000
          expires_at: '2026-06-01T00:00:00Z'
          expected_pilot_version: ${p1_v}
        as: AssociationAdmin
      - call: POST /pilotage/pilot-boats
        payload:
          name: Boat A
          capacity_persons: 6
        as: AssociationAdmin
      - call: POST /pilotage/vessel-orders
        payload:
          vessel_name: MV One
          gt: 8000
          draft_dm: 90
          order_type: ARRIVAL
          eta: '2026-08-10T00:00:00Z'
        as: VesselAgent
        as_user_id: agent-1
        captures:
          o1_id: $.data.id
      trigger:
      - call: POST /pilotage/vessel-orders/${o1_id}/dispatch
        payload:
          scheduled_start: '2026-08-10T10:00:00Z'
          scheduled_end: '2026-08-10T11:00:00Z'
        as: Dispatcher
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_NO_ELIGIBLE_PILOT
      - VesselOrder(o1_id).status == BOOKED (no partial write)
  - name: error_tonnage_exceeds_endorsement_on_explicit_reassign
    claim_type: violation_to_error
    grounds:
    - errors[ERR_TONNAGE_EXCEEDS_ENDORSEMENT]
    - validations[priority=9]
    distinguishing_aspect: Explicit reassign names a pilot whose CURRENT endorsement cap 5000 < order gt 8000 -> 422 ERR_TONNAGE_EXCEEDS_ENDORSEMENT (license currency passes first, tonnage fails).
    test_recipe:
      setup:
      - MAIN_TARIFF active; P1 cap 100000, P2 cap 5000 CURRENT; boat BA; A1 (order gt 8000) ASSIGNED to P1 then recalled
      setup_api_calls:
      - call: POST /pilotage/tariff-schedules
        payload:
          effective_from: '2026-01-01T00:00:00Z'
          tiers:
          - min_gt_exclusive: 0
            max_gt_inclusive: 5000
            rate_cents_per_gt: 20
          draft_surcharge_threshold_dm: 100
          draft_surcharge_pct: 0.15
          detention_free_minutes: 30
          detention_rate_cents_per_minute: 200
          delay_rate_cents_per_minute: 150
        as: AssociationAdmin
      - call: POST /pilotage/pilots
        payload:
          full_name: Pilot One
          license_number: LIC-1
          share_units: 1
        as: AssociationAdmin
        captures:
          p1_id: $.data.id
          p1_v: $.data.version
      - call: POST /pilotage/pilots/${p1_id}/endorsements
        payload:
          endorsement_class: UNLIMITED
          tonnage_cap_gt: 100000
          expires_at: '2027-01-01T00:00:00Z'
          expected_pilot_version: ${p1_v}
        as: AssociationAdmin
      - call: POST /pilotage/pilots
        payload:
          full_name: Pilot Two
          license_number: LIC-2
          share_units: 1
        as: AssociationAdmin
        captures:
          p2_id: $.data.id
          p2_v: $.data.version
      - call: POST /pilotage/pilots/${p2_id}/endorsements
        payload:
          endorsement_class: HARBOR
          tonnage_cap_gt: 5000
          expires_at: '2027-01-01T00:00:00Z'
          expected_pilot_version: ${p2_v}
        as: AssociationAdmin
      - call: POST /pilotage/pilot-boats
        payload:
          name: Boat A
          capacity_persons: 6
        as: AssociationAdmin
      - call: POST /pilotage/vessel-orders
        payload:
          vessel_name: MV Big
          gt: 8000
          draft_dm: 90
          order_type: ARRIVAL
          eta: '2026-08-10T00:00:00Z'
        as: VesselAgent
        as_user_id: agent-1
        captures:
          o1_id: $.data.id
      - call: POST /pilotage/vessel-orders/${o1_id}/dispatch
        payload:
          scheduled_start: '2026-08-10T10:00:00Z'
          scheduled_end: '2026-08-10T11:00:00Z'
        as: Dispatcher
        captures:
          a1_id: $.data.id
      - call: POST /pilotage/assignments/${a1_id}/recall
        payload: {}
        as: Dispatcher
      trigger:
      - call: POST /pilotage/assignments/${a1_id}/reassign
        payload:
          pilot_id: ${p2_id}
        as: Dispatcher
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_TONNAGE_EXCEEDS_ENDORSEMENT
      - Assignment(a1_id).service_status remains RECALLED
