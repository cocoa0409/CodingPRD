      - name: the_restatement_recovery_ladder_rejects_every_out_of_order_step
        claim_type: precondition_enforcement
        grounds:
          - state_machines.RestatementEvent.DECLARED_to_ANALYZED
          - state_machines.RestatementEvent.ANALYZED_to_RECOVERY_ORDERED
          - state_machines.ClawbackDetermination.NOTICED_to_RECOVERED
          - errors[ERR_EVENT_STATE_INVALID]
          - errors[ERR_DETERMINATION_STATE_INVALID]
          - errors[ERR_DETERMINATION_NOT_ACKNOWLEDGED]
          - validations.priority_19_ERR_EVENT_STATE_INVALID
          - validations.priority_20_ERR_DETERMINATION_STATE_INVALID
          - validations.priority_22_ERR_DETERMINATION_NOT_ACKNOWLEDGED
