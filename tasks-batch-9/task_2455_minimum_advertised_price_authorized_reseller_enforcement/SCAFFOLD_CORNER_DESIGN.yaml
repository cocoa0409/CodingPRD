          assert:
            - "HTTP 200"
            - "${st} == 'WITHDRAWN'"
            - "${wr} == 'Superseded by a global program redesign'"
            - "Product.${prod}.governing_policy_id == ${pol}"
            - "Product.${prod}.lifecycle_status == ACTIVE"

