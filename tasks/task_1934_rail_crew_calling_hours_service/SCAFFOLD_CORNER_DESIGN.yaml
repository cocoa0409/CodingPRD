  - section: consistency_model
    instances:
      - name: accept_side_effects_visible_immediately
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: the accept response's Assignment is MARKED_UP, and a same-instant GET of the job and employee already show filled_count=1 / ON_ASSIGNMENT — no eventual lag."
        test_recipe:
          setup: ["standard board/job/call chain with C -> E OFFERED"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
