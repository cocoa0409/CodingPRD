          trigger:
            - call: "POST /shipments"
              payload: { contract_id: "${c1}", bin_id: "${bin1}", quantity_lbs: 5000, expected_contract_version: "${c1_v}" }
              as: PlantOperator
              captures: { err: $.data.error_id }
          assert:
