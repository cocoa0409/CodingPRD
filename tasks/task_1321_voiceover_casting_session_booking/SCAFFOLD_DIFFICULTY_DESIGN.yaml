          - calculations.session_overlap_check
          - validations[priority=8]
        distinguishing_aspect: |
          Interval semantics: half-open [start, end) with zero buffer. Two
          CONFIRMED sessions on the SAME Studio collide iff s1<e2 AND s2<e1.
          Adjacent (e1==s2) do NOT collide. Resource = Studio.
