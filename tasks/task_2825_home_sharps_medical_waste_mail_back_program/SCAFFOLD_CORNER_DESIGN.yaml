            - "${e_empty_array} == \"ERR_INVALID_REQUEST\""
            - "${e_enum_decision} == \"ERR_INVALID_REQUEST\""
            - "${e_limit} == \"ERR_INVALID_REQUEST\""
            - "${e_offset} == \"ERR_INVALID_REQUEST\""
            - "GET /sharps/patients returns total_count == 1 (no Patient row was created by any rejected call)"
