            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${g3}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${s7}", low_income_student_count: 100, total_student_count: 100 } ] }, as: ComplianceAnalyst, captures: { snap3: $.data.id } }
            - { call: "POST /title-i/poverty-snapshots/${snap3}/certify", payload: { expected_grant_version: "${g3_v}" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${g3}/lock-rankings", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${g3}/finalize-allocations", payload: {}, as: FederalProgramsDirector }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${g3}", school_id: "${s7}" }, as: FederalProgramsDirector, captures: { a3: "$.data[0].id" } }
            - { call: "POST /title-i/school-allocations/${a3}/certify", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/expenditures", payload: { grant_id: "${g3}", school_allocation_id: "${a3}", amount_cents: 8500000, function_code: "INSTRUCTION", description: "instructional salaries", incurred_date: "2028-09-01", supplant_screen: false }, as: ComplianceAnalyst, as_user_id: "analyst-1", captures: { e3: $.data.id } }
            - { call: "POST /title-i/expenditures/${e3}/review", payload: { decision: "ALLOW" }, as: FederalProgramsDirector, as_user_id: "director-1" }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2030, total_allocation_cents: 10000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { g4: $.data.id, g4_v: $.data.version } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${g4}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${s7}", low_income_student_count: 100, total_student_count: 100 } ] }, as: ComplianceAnalyst, captures: { snap4: $.data.id } }
            - { call: "POST /title-i/poverty-snapshots/${snap4}/certify", payload: { expected_grant_version: "${g4_v}" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${g4}/lock-rankings", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${g4}/finalize-allocations", payload: {}, as: FederalProgramsDirector }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${g4}", school_id: "${s7}" }, as: FederalProgramsDirector, captures: { a4: "$.data[0].id" } }
            - { call: "POST /title-i/school-allocations/${a4}/certify", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/expenditures", payload: { grant_id: "${g4}", school_allocation_id: "${a4}", amount_cents: 8499500, function_code: "INSTRUCTION", description: "instructional salaries", incurred_date: "2029-09-01", supplant_screen: false }, as: ComplianceAnalyst, as_user_id: "analyst-1", captures: { e4: $.data.id } }
            - { call: "POST /title-i/expenditures/${e4}/review", payload: { decision: "ALLOW" }, as: FederalProgramsDirector, as_user_id: "director-1" }
          trigger:
            - { call: "POST /title-i/grants/${g3}/close-out", payload: {}, as: FederalProgramsDirector, captures: { g3_st: $.data.status, g3_bp: $.data.final_carryover_pct_bp, g3_c: $.data.final_carryover_cents } }
            - call: "POST /title-i/grants/${g4}/close-out"
              payload: {}
              as: FederalProgramsDirector
              captures: { g4_err: $.data.error_id }
          assert:
            - "G3: close-out succeeds, status == CLOSED_OUT, final_carryover_cents == 1500000, final_carryover_pct_bp == 1500 (boundary inclusive — no waiver needed)"
            - "G4: close-out rejected with 422 error_id == ERR_CARRYOVER_LIMIT_EXCEEDED (1500500 cents -> 1501 bp > 1500)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: allocation_certify_gated_by_grant_state
        grounds:
          - state_machines.SchoolAllocation.PENDING_to_CERTIFIED
          - errors[ERR_GRANT_INVALID_STATE]
        distinguishing_aspect: |
          Pair SchoolAllocation -> DistrictGrant: certifying a PENDING allocation
          is rejected while the grant is merely RANKING_LOCKED and succeeds only
          after the grant reaches ALLOCATED via finalize-allocations.
        test_recipe:
          setup:
            - "Grant GX FY2046 RANKING_LOCKED; school SX 100/100; allocation AX PENDING"
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "Xenia School", nces_id: "000501", grade_span_low: 0, grade_span_high: 12 }, as: ComplianceAnalyst, captures: { sx: $.data.id } }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2046, total_allocation_cents: 10000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { gx: $.data.id, gx_v: $.data.version } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${gx}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${sx}", low_income_student_count: 100, total_student_count: 100 } ] }, as: ComplianceAnalyst, captures: { snap_x: $.data.id } }
            - { call: "POST /title-i/poverty-snapshots/${snap_x}/certify", payload: { expected_grant_version: "${gx_v}" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${gx}/lock-rankings", payload: {}, as: FederalProgramsDirector }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${gx}", school_id: "${sx}" }, as: FederalProgramsDirector, captures: { ax: "$.data[0].id" } }
          trigger:
            - call: "POST /title-i/school-allocations/${ax}/certify"
              payload: {}
              as: FederalProgramsDirector
              captures: { err: $.data.error_id }
            - { call: "POST /title-i/grants/${gx}/finalize-allocations", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/school-allocations/${ax}/certify", payload: {}, as: FederalProgramsDirector, captures: { ok: $.data.status } }
          assert:
            - "while grant is RANKING_LOCKED: 409 error_id == ERR_GRANT_INVALID_STATE and allocation remains PENDING"
            - "after finalize-allocations (grant ALLOCATED): the identical certify call returns 200 with status == CERTIFIED"

      - name: expenditure_gated_by_sns_acceptance
        grounds:
          - state_machines.SupplementDocumentation.SUBMITTED_to_ACCEPTED
          - errors[ERR_SUPPLANT_RISK_UNRESOLVED]
          - entities.SchoolAllocation.fields.supplement_ok
        distinguishing_aspect: |
          Pair Expenditure -> SupplementDocumentation (different pair from the
          sibling instance): a supplant_screen=true charge is rejected while the
          allocation's SNS document is merely SUBMITTED, and the identical charge
          succeeds after a different user ACCEPTS it.
        test_recipe:
          setup:
            - "Grant GY FY2047 ALLOCATED; school SY 100/100; allocation AY CERTIFIED; SNS doc SUBMITTED (not yet accepted)"
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "Yonder School", nces_id: "000502", grade_span_low: 0, grade_span_high: 12 }, as: ComplianceAnalyst, captures: { sy: $.data.id } }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2047, total_allocation_cents: 10000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { gy: $.data.id, gy_v: $.data.version } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${gy}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${sy}", low_income_student_count: 100, total_student_count: 100 } ] }, as: ComplianceAnalyst, captures: { snap_y: $.data.id } }
            - { call: "POST /title-i/poverty-snapshots/${snap_y}/certify", payload: { expected_grant_version: "${gy_v}" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${gy}/lock-rankings", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${gy}/finalize-allocations", payload: {}, as: FederalProgramsDirector }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${gy}", school_id: "${sy}" }, as: FederalProgramsDirector, captures: { ay: "$.data[0].id" } }
            - { call: "POST /title-i/school-allocations/${ay}/certify", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/supplement-documentation", payload: { school_allocation_id: "${ay}", methodology: "GRADE_SPAN_GROUPING", coverage_start_date: "2026-07-01", coverage_end_date: "2027-07-01", narrative: "State and local funds are distributed by grade-span grouping uniformly across all attendance zones in the district." }, as: ComplianceAnalyst, as_user_id: "analyst-1", captures: { dy: $.data.id } }
            - { call: "POST /title-i/supplement-documentation/${dy}/submit", payload: {}, as: ComplianceAnalyst, as_user_id: "analyst-1" }
          trigger:
            - call: "POST /title-i/expenditures"
              payload: { grant_id: "${gy}", school_allocation_id: "${ay}", amount_cents: 1000000, function_code: "INSTRUCTION", description: "reading specialist contract", incurred_date: "2046-09-01", supplant_screen: true }
              as: ComplianceAnalyst
              captures: { err: $.data.error_id }
            - { call: "POST /title-i/supplement-documentation/${dy}/review", payload: { decision: "ACCEPT" }, as: FederalProgramsDirector, as_user_id: "director-1" }
            - { call: "POST /title-i/expenditures", payload: { grant_id: "${gy}", school_allocation_id: "${ay}", amount_cents: 1000000, function_code: "INSTRUCTION", description: "reading specialist contract", incurred_date: "2046-09-01", supplant_screen: true }, as: ComplianceAnalyst, captures: { ok: $.data.status } }
          assert:
            - "while SNS is SUBMITTED: 403 error_id == ERR_SUPPLANT_RISK_UNRESOLVED and no expenditure row is created"
            - "after review ACCEPT: the identical charge returns 201 with status == PENDING_REVIEW"
            - "SchoolAllocation.${ay}.supplement_ok flipped false -> true across the ACCEPT"

  - rule_id: resource_temporal_overlap
    instances:
      - name: monitoring_visit_closed_interval_overlap
        grounds:
          - validations[priority=9]
          - errors[ERR_MONITORING_VISIT_OVERLAP]
        distinguishing_aspect: |
          Resource DistrictGrant, CLOSED day-interval semantics: visit A
          [2027-01-10, 2027-01-12] collides with B [2027-01-12, 2027-01-15]
          because the shared boundary day 2027-01-12 is occupied by both, while
          C [2027-01-13, 2027-01-20] is accepted — adjacency is allowed only when
          intervals share NO calendar day.
        test_recipe:
          setup:
            - "Grant GM FY2048 (any status); visit A already scheduled 2027-01-10..2027-01-12"
          setup_api_calls:
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2048, total_allocation_cents: 5000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { gm: $.data.id } }
            - { call: "POST /title-i/monitoring-visits", payload: { grant_id: "${gm}", visit_start_date: "2027-01-10", visit_end_date: "2027-01-12", scope: "FISCAL" }, as: SEAMonitor, as_user_id: "monitor-1", captures: { va: $.data.id } }
          trigger:
            - call: "POST /title-i/monitoring-visits"
              payload: { grant_id: "${gm}", visit_start_date: "2027-01-12", visit_end_date: "2027-01-15", scope: "PROGRAMMATIC" }
              as: SEAMonitor
              captures: { err: $.data.error_id }
            - { call: "POST /title-i/monitoring-visits", payload: { grant_id: "${gm}", visit_start_date: "2027-01-13", visit_end_date: "2027-01-20", scope: "PROGRAMMATIC" }, as: SEAMonitor, as_user_id: "monitor-1", captures: { vc: $.data.id } }
          assert:
            - "B (starts on A's last day): 409 error_id == ERR_MONITORING_VISIT_OVERLAP — the shared day 2027-01-12 proves CLOSED interval semantics"
            - "C (starts the day after A ends): 201 created, status SCHEDULED"
            - "a visit on a DIFFERENT grant with the same dates as A would not conflict (resource scoping) — asserted by C's success on the same grant being the only constraint"

      - name: sns_window_half_open_overlap
        grounds:
          - validations[priority=9]
          - errors[ERR_SNS_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource SchoolAllocation, HALF-OPEN [start, end) semantics — different
          interval arithmetic from the closed visit intervals: window W2 starting
          exactly at W1's end (2027-01-01) is ACCEPTED (no shared instant), while
          W3 [2026-12-01, 2027-03-01) overlapping W1's interior is REJECTED.
        test_recipe:
          setup:
            - "Grant GS FY2049 ALLOCATED; school SS 100/100; allocation AS CERTIFIED; SNS doc W1 [2026-07-01, 2027-01-01) exists"
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "Sierra School", nces_id: "000503", grade_span_low: 0, grade_span_high: 12 }, as: ComplianceAnalyst, captures: { ss: $.data.id } }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2049, total_allocation_cents: 10000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { gs: $.data.id, gs_v: $.data.version } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${gs}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${ss}", low_income_student_count: 100, total_student_count: 100 } ] }, as: ComplianceAnalyst, captures: { snap_s: $.data.id } }
            - { call: "POST /title-i/poverty-snapshots/${snap_s}/certify", payload: { expected_grant_version: "${gs_v}" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${gs}/lock-rankings", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${gs}/finalize-allocations", payload: {}, as: FederalProgramsDirector }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${gs}", school_id: "${ss}" }, as: FederalProgramsDirector, captures: { as_: "$.data[0].id" } }
            - { call: "POST /title-i/supplement-documentation", payload: { school_allocation_id: "${as_}", methodology: "PER_SCHOOL_DISTRIBUTION", coverage_start_date: "2026-07-01", coverage_end_date: "2027-01-01", narrative: "First-half methodology: per-school distribution of state and local funds documented for fall semester coverage." }, as: ComplianceAnalyst, captures: { w1: $.data.id } }
          trigger:
            - { call: "POST /title-i/supplement-documentation", payload: { school_allocation_id: "${as_}", methodology: "PER_SCHOOL_DISTRIBUTION", coverage_start_date: "2027-01-01", coverage_end_date: "2027-07-01", narrative: "Second-half methodology: identical distribution formula continued for the spring semester coverage window." }, as: ComplianceAnalyst, captures: { w2: $.data.id } }
            - call: "POST /title-i/supplement-documentation"
              payload: { school_allocation_id: "${as_}", methodology: "PER_PUPIL_FORMULA", coverage_start_date: "2026-12-01", coverage_end_date: "2027-03-01", narrative: "Overlapping methodology window that must be rejected because it shares December with the first window." }
              as: ComplianceAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "W2 [2027-01-01, 2027-07-01) touching W1's exclusive end: 201 created — half-open adjacency is NOT an overlap"
            - "W3 [2026-12-01, 2027-03-01): 409 error_id == ERR_SNS_WINDOW_OVERLAP — shares [2026-12-01, 2027-01-01) with W1"
            - "SupplementDocumentation.${w1}.status remains DRAFT throughout (creation does not auto-submit)"

  - rule_id: compensating_invariant
    instances:
      - name: amendment_apply_void_conserves_money
        grounds:
          - state_machines.BudgetAmendment.SUBMITTED_to_APPROVED
          - state_machines.BudgetAmendment.APPROVED_to_VOIDED
          - entities.BudgetAmendment.fields.prior_amounts
        distinguishing_aspect: |
          Conserved quantity: total distributed cents. Invariant pinned over
          fields: SUM(SchoolAllocation.allocation_amount_cents) +
          SUM(SetAside.reserved_cents) == grant.net_allocable_cents (95000000).
          Approve moves 1000000 cents from S1 to the PD set-aside; the
          compensating void restores prior_amounts verbatim — the sum is
          95000000 before, during, and after.
        test_recipe:
          setup:
            - "Grant GV FY2027 fully allocated (schools 400/500, 300/500, 200/500, 195/500; verified private schools 50+30): S1 alloc 34946768, PD reserved 4750000"
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "Alpha Elementary", nces_id: "000001", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst, captures: { s1: $.data.id } }
            - { call: "POST /title-i/schools", payload: { name: "Beta Middle", nces_id: "000002", grade_span_low: 6, grade_span_high: 8 }, as: ComplianceAnalyst, captures: { s2: $.data.id } }
            - { call: "POST /title-i/schools", payload: { name: "Gamma High", nces_id: "000003", grade_span_low: 9, grade_span_high: 12 }, as: ComplianceAnalyst, captures: { s3: $.data.id } }
            - { call: "POST /title-i/schools", payload: { name: "Delta Elementary", nces_id: "000004", grade_span_low: 0, grade_span_high: 5 }, as: ComplianceAnalyst, captures: { s4: $.data.id } }
            - { call: "POST /title-i/private-schools", payload: { name: "St Mary", low_income_resident_count: 50, contact_email: "om@stmary.example", nonprofit_verified: true }, as: ComplianceAnalyst }
            - { call: "POST /title-i/private-schools", payload: { name: "Grace Academy", low_income_resident_count: 30, contact_email: "om@grace.example", nonprofit_verified: true }, as: ComplianceAnalyst }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2027, total_allocation_cents: 100000000, admin_reserve_cents: 5000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { gv: $.data.id, gv_v: $.data.version } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${gv}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${s1}", low_income_student_count: 400, total_student_count: 500 }, { school_id: "${s2}", low_income_student_count: 300, total_student_count: 500 }, { school_id: "${s3}", low_income_student_count: 200, total_student_count: 500 }, { school_id: "${s4}", low_income_student_count: 195, total_student_count: 500 } ] }, as: ComplianceAnalyst, captures: { snap_v: $.data.id } }
            - { call: "POST /title-i/poverty-snapshots/${snap_v}/certify", payload: { expected_grant_version: "${gv_v}" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${gv}/lock-rankings", payload: {}, as: FederalProgramsDirector }
            - { call: "POST /title-i/grants/${gv}/finalize-allocations", payload: {}, as: FederalProgramsDirector }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${gv}", school_id: "${s1}" }, as: FederalProgramsDirector, captures: { a1: "$.data[0].id" } }
            - { call: "GET /title-i/set-asides", payload: { grant_id: "${gv}", category: "PROFESSIONAL_DEVELOPMENT" }, as: FederalProgramsDirector, captures: { pd: "$.data[0].id" } }
            - { call: "GET /title-i/grants/${gv}", payload: {}, as: FederalProgramsDirector, captures: { gv_cur: $.data.version } }
          trigger:
            - { call: "POST /title-i/budget-amendments", payload: { grant_id: "${gv}", expected_grant_version: "${gv_cur}", lines: [ { target_type: "SCHOOL_ALLOCATION", target_id: "${a1}", new_amount_cents: 33946768 }, { target_type: "SET_ASIDE", target_id: "${pd}", new_amount_cents: 5750000 } ] }, as: ComplianceAnalyst, as_user_id: "analyst-1", captures: { ba: $.data.id } }
            - { call: "POST /title-i/budget-amendments/${ba}/submit", payload: {}, as: ComplianceAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /title-i/budget-amendments/${ba}/approve", payload: {}, as: FederalProgramsDirector, as_user_id: "director-1" }
            - { call: "GET /title-i/school-allocations/${a1}", payload: {}, as: FederalProgramsDirector, captures: { a1_mid: "$.data.allocation_amount_cents" } }
            - { call: "GET /title-i/set-asides/${pd}", payload: {}, as: FederalProgramsDirector, captures: { pd_mid: $.data.reserved_cents, pd_min_mid: $.data.school_distributed_minimum_cents } }
            - { call: "POST /title-i/budget-amendments/${ba}/void", payload: {}, as: FederalProgramsDirector, as_user_id: "director-1" }
            - { call: "GET /title-i/school-allocations/${a1}", payload: {}, as: FederalProgramsDirector, captures: { a1_end: "$.data.allocation_amount_cents" } }
            - { call: "GET /title-i/set-asides/${pd}", payload: {}, as: FederalProgramsDirector, captures: { pd_end: $.data.reserved_cents } }
          assert:
            - "pre-approve invariant: 34946768 + 21841768 + 14561168 + 11357743 (allocations) + 1000000 + 500000 + 4750000 + 6042553 (set-asides) == 95000000 == net_allocable_cents"
            - "post-approve: S1 allocation_amount_cents == 33946768 and PD reserved_cents == 5750000; sum still == 95000000"
            - "post-void: S1 == 34946768 and PD reserved == 4750000 restored verbatim from prior_amounts; sum == 95000000 — zero drift across the forward+compensating pair"
            - "amendment status == VOIDED and grant.version advanced on each of create/approve/void"

      - name: snapshot_certify_supersedes_conserves_cardinality
        grounds:
          - state_machines.PovertyDataSnapshot.DRAFT_to_CERTIFIED
          - calculations.school_ranking
        distinguishing_aspect: |
          Conserved quantity: certified-snapshot CARDINALITY (a count, not a money
          sum — different quantity class from the sibling invariant). Invariant:
          COUNT(PovertyDataSnapshot WHERE grant_id = G AND status == CERTIFIED)
          == 1 before and after every certify+auto-supersede pair.
        test_recipe:
          setup:
            - "Grant GN FY2050 SETUP; school SN; snapshot N1 CERTIFIED"
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "Nova School", nces_id: "000504", grade_span_low: 0, grade_span_high: 12 }, as: ComplianceAnalyst, captures: { sn: $.data.id } }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2050, total_allocation_cents: 5000000, poverty_measure: "CENSUS_SAIPE", equitable_count_method: "VERIFIED_COUNT" }, as: FederalProgramsDirector, captures: { gn: $.data.id, gn_v: $.data.version } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${gn}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${sn}", low_income_student_count: 50, total_student_count: 100 } ] }, as: ComplianceAnalyst, captures: { n1: $.data.id } }
            - { call: "POST /title-i/poverty-snapshots/${n1}/certify", payload: { expected_grant_version: "${gn_v}" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${gn}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${sn}", low_income_student_count: 55, total_student_count: 100 } ] }, as: ComplianceAnalyst, captures: { n2: $.data.id } }
            - { call: "GET /title-i/grants/${gn}", payload: {}, as: FederalProgramsDirector, captures: { gn_pre: $.data.version } }
          trigger:
            - { call: "POST /title-i/poverty-snapshots/${n2}/certify", payload: { expected_grant_version: "${gn_pre}" }, as: FederalProgramsDirector }
            - { call: "GET /title-i/poverty-snapshots", payload: { grant_id: "${gn}", status: "CERTIFIED" }, as: FederalProgramsDirector, captures: { cert_list: $.data } }
            - { call: "GET /title-i/poverty-snapshots/${n1}", payload: {}, as: FederalProgramsDirector, captures: { n1_st: $.data.status } }
          assert:
            - "before the second certify exactly one CERTIFIED snapshot existed (N1)"
            - "after: GET list with status=CERTIFIED returns total_count == 1 and its id == ${n2}"
            - "N1.status == SUPERSEDED — the certify+supersede pair conserves the certified cardinality at exactly 1"
