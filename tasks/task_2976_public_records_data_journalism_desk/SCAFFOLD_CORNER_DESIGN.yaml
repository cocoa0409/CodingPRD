      - name: appeal_denial_cascade_reaches_five_hops
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: appeal_denial_five_hop_litigation_cascade
          rationale: |
            That instance drives the whole chain end to end - appeal denial, request to
            LITIGATION_AUTHORIZED, desk litigation_exposure_count and posture, investigation to
            HOLD_LEGAL_REVIEW, enclave sessions to CANCELLED - and asserts each hop, including that
            non-terminal children only are touched.

      - name: disclosure_variants_both_evaluated_on_one_dataset
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: disclosure_risk_aggregate_max_versus_composite_weighted
          rationale: |
            Both variants are computed on identical data there and the 25-point delta is asserted
            explicitly, which is the layer's whole claim; the §1.9 precision instance above then pins the
            rounding and clamp order inside the composite variant.

      - name: deadline_lapse_is_evaluated_when_the_clock_moves
        claim_type: scheduled_actions
        grounds:
          - complexity_profile.complexity_layers[scheduled_actions]
        excluded_because:
          difficulty_instance: appeal_ripeness_at_the_exact_tolled_deadline_millisecond
          rationale: |
            The only scheduled behaviour in this domain is the deadline lapse that makes an appeal ripe
            and the notice-deadline pre-step at publication; that instance walks the logical clock to the
            exact millisecond either side of due_at_tolled and asserts the transition on each side.

      - name: finding_counters_are_reconciled_after_a_revocation
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers[derived_field_reconciliation]
        excluded_because:
          difficulty_instance: verification_revocation_preserves_the_finding_count_partition
          rationale: |
            The four finding counters and their partition invariant against finding_count are asserted
            there after create, after verdict and after revocation - derived-field correctness after
            create, update and removal of the source, which is exactly this layer's row.

  - section: consistency model
    instances:
      - name: readiness_and_its_cascade_are_visible_in_the_same_request_that_causes_them
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.investigation_analysis_readiness
          - validations[priority=240]
          - endpoints[POST /records-desk/investigations/{id}/lock-findings]
        distinguishing_aspect: |
          Every derived value in this domain is recomputed inside the writing request, and the fixture
          proves it at the moment the last precondition flips: lock-findings is refused with
          ERR_ANALYSIS_NOT_READY while the finding is still DOC_MATCHED, and the very next read - taken
          immediately after the verdict, with no intervening write - already reports analysis_readiness
          READY. The subsequent lock-findings response body itself shows FINDINGS_LOCKED, and the
          DRAFT -> NOTICE_ELIGIBLE cascade on the SubjectResponseRequest is observable on the next read
          rather than after any delay or re-poll.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T09:00:00Z. Desk, Agency, one RELEASED RecordsRequest, one Investigation, one CLEAN_LOCKED Dataset."
            - "One AnalysisRun authored by rep-001, ALLOCATED and APPROVED by peer-001."
            - "One Finding in DOC_MATCHED with an ASSIGNED ReviewAssignment to reviewer A."
            - "One SubjectResponseRequest on the investigation, still DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
              payload: { name: "Metro Investigations Desk", fee_budget_total_cents: 500000, retention_policy_days: 1095 }
              as: ManagingEditor
              captures: { desk_id: $.data.id, desk_v0: $.data.version }
            - call: "POST /records-desk/agencies"
              payload: { name: "State Transit Agency", jurisdiction_code: "CA-TRAN", statute_name: "CPRA", initial_response_days: 10, deadline_basis: "BUSINESS_DAYS", tolling_allowed: false, appeal_venue: "INTERNAL", appeal_decision_days: 15, search_fee_cents_per_hour: 3500, page_fee_cents: 25, max_waiver_cents: 10000 }
              as: RecordsCoordinator
              captures: { agency_id: $.data.id }
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_id}", subject_summary: "Bus maintenance deferrals", requested_format: "CSV", estimated_page_count: 30, waiver_requested: false, public_interest_score: 55, expected_desk_version: "${desk_v0}" }
              as: RecordsCoordinator
              captures: { req_id: $.data.id }
            - call: "POST /records-desk/records-requests/${req_id}/submit"
              payload: {}
              as: RecordsCoordinator
            - call: "POST /records-desk/records-requests/${req_id}/agency-decision"
              payload: { outcome: "RELEASED_FULL" }
              as: RecordsCoordinator
            - call: "POST /records-desk/investigations"
              payload: { desk_id: "${desk_id}", headline: "Deferred brake inspections", publication_mode: "METHODOLOGY_ONLY" }
              as: ManagingEditor
              captures: { inv_id: $.data.id, inv_v0: $.data.version }
            - call: "POST /records-desk/datasets"
              payload: { request_id: "${req_id}", investigation_id: "${inv_id}", name: "maintenance-deferrals", negotiated_format: "CSV", expected_field_count: 1, sensitivity_tier: "PUBLIC" }
              as: DataReporter
              captures: { ds_id: $.data.id }
            - call: "POST /records-desk/datasets/${ds_id}/delivery"
              payload: { delivered_format: "CSV", record_count: 700 }
              as: DataReporter
            - call: "POST /records-desk/datasets/${ds_id}/field-definitions"
              payload: { field_name: "bus_number", data_type: "STRING", null_rate_pct: 0.0, reidentification_risk: 2, is_source_identifying: false }
              as: DataReporter
            - call: "POST /records-desk/datasets/${ds_id}/cleaning-lock"
              payload: { cleaning_notes: "Vehicle ids normalised." }
              as: DataReporter
            - call: "GET /records-desk/investigations/${inv_id}"
