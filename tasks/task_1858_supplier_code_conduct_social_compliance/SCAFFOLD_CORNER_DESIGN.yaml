            - "${hit1} == ${au1} and the facility-filtered list has exactly 1 entry (au2 excluded)"
            - "${hit2} == ${cap_id} (finding-filtered CAP list has exactly 1 entry)"
            - "the auditor-filtered list has exactly 2 entries (both audits), first is ${hit3}"

      - name: scorecard_computed_read_covered
        claim_type: computed_read
        grounds: ["endpoints.GET /suppliers/{id}/scorecard"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / supplier_scorecard_provisional_vs_verified"
          rationale: "The computed-read contract (provisional_score, verified_score, consequence_tier, counts) is asserted with literal values in the named §1.8 instance."

      - name: scoping_computed_read_covered
        claim_type: computed_read
        grounds: ["endpoints.GET /facilities/{id}/scoping"]
        excluded_because:
          difficulty_instance: "combinatorial_formula / audit_interval_tiered_min_clamp"
          rationale: "The scoping read (risk_score_history, risk_tier, next_audit_interval_months, next_audit_due_date) is asserted with literal values in the named §1.8 instance; the baseline-vs-history fields are additionally asserted in dual_variant_calc / facility_risk_baseline_vs_history_adjusted."

  # ===========================================================================
  - section: errors
    # Coverage note (no extra instance needed): every error id in §1.6 is triggered
    # by at least one §1.8 instance or §1.9 corner instance in this design package —
    # see the per-error violation_to_error instances in the validations section and
    # the excluded_because stubs there for errors covered by §1.8.
    instances: []

  # ===========================================================================
  - section: rbac
    instances:
      - name: grievance_list_forbidden_for_worker_hotline_and_supplier
        claim_type: rbac_exclusive_denied
        grounds: [roles.WorkerHotline, roles.SupplierContact]
        distinguishing_aspect: "Grievance reads are confidential to program staff: WorkerHotline (may only file) and SupplierContact (supply-side) both get ERR_INSUFFICIENT_PERMISSIONS on GET /grievances."
        test_recipe:
          setup: ["Supplier with a facility that has one grievance on file"]
          setup_api_calls:
            - { call: "POST /suppliers", payload: { legal_name: "Quebec D", country_code: "US", sector: "FOOD" }, as: SourcingProgramAdmin, captures: { sup_id: $.data.id } }
            - { call: "POST /facilities", payload: { supplier_id: "${sup_id}", name: "Site G2", country_code: "US", worker_count: 10, processes: ["packing"] }, as: SourcingProgramAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /grievances", payload: { facility_id: "${fac_id}", channel: "HOTLINE", category: "WAGES", severity: "LOW", description: "Late payslip" }, as: WorkerHotline, captures: { g_id: $.data.id } }
          trigger:
            - { call: "GET /grievances", payload: {}, as: WorkerHotline, captures: { err1: $.data.error_id } }
            - { call: "GET /grievances", payload: {}, as: SupplierContact, as_user_id: "${sup_id}", captures: { err2: $.data.error_id } }
            - { call: "GET /grievances/${g_id}", payload: {}, as: ComplianceOfficer, captures: { ok_id: $.data.id } }
          assert:
            - "${err1} == ERR_INSUFFICIENT_PERMISSIONS and ${err2} == ERR_INSUFFICIENT_PERMISSIONS"
            - "${ok_id} == ${g_id} (program staff CAN read)"

      - name: code_version_create_forbidden_for_auditor
        claim_type: rbac_exclusive_denied
        grounds: [roles.SourcingProgramAdmin, roles.Auditor]
        distinguishing_aspect: "Only SourcingProgramAdmin manages code versions; an Auditor (even entity-backed with a valid auditor id) gets ERR_INSUFFICIENT_PERMISSIONS."
        test_recipe:
          setup: ["One registered auditor"]
          setup_api_calls:
            - { call: "POST /auditors", payload: { full_name: "Lead Auditor", firm_name: "AuditCo", certifications: ["SA8000"], country_codes_covered: ["US"] }, as: AuditCoordinator, captures: { aud_id: $.data.id } }
          trigger:
            - { call: "POST /code-versions", payload: { version_label: "CoC rogue", effective_from: "2026-01-01T00:00:00Z", zero_tolerance_categories: ["FORCED_LABOR"] }, as: Auditor, as_user_id: "${aud_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INSUFFICIENT_PERMISSIONS"

      - name: finding_create_forbidden_for_compliance_officer
        claim_type: rbac_exclusive_denied
        grounds: [roles.ComplianceOfficer, roles.Auditor]
        distinguishing_aspect: "Segregation of duties across roles: the ComplianceOfficer who decides reports and reviews CAPs cannot record findings — that is exclusive to the assigned Auditor."
        test_recipe:
          setup: ["Audit IN_PROGRESS (lead auditor assigned)"]
          setup_api_calls:
            - { call: "POST /code-versions", payload: { version_label: "CoC v1.0", effective_from: "2026-01-01T00:00:00Z", zero_tolerance_categories: ["FORCED_LABOR"] }, as: SourcingProgramAdmin, captures: { cv_id: $.data.id } }
            - { call: "POST /code-versions/${cv_id}/transition", payload: { to_status: "PUBLISHED" }, as: SourcingProgramAdmin }
            - { call: "POST /suppliers", payload: { legal_name: "Romeo D", country_code: "US", sector: "FOOD" }, as: SourcingProgramAdmin, captures: { sup_id: $.data.id, sup_v: $.data.version } }
            - { call: "POST /code-acknowledgments", payload: { supplier_id: "${sup_id}", code_version_id: "${cv_id}", signer_name: "U B", signer_title: "CEO", expected_supplier_version: "${sup_v}" }, as: SupplierContact, as_user_id: "${sup_id}" }
            - { call: "POST /facilities", payload: { supplier_id: "${sup_id}", name: "Site H2", country_code: "US", worker_count: 10, processes: ["packing"] }, as: SourcingProgramAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /auditors", payload: { full_name: "Lead Auditor", firm_name: "AuditCo", certifications: ["SA8000"], country_codes_covered: ["US"] }, as: AuditCoordinator, captures: { aud_id: $.data.id } }
            - { call: "POST /audits", payload: { facility_id: "${fac_id}", auditor_id: "${aud_id}", audit_type: "INITIAL", announcement: "ANNOUNCED", scheduled_start: "2026-09-01T00:00:00Z", scheduled_end: "2026-09-02T00:00:00Z" }, as: AuditCoordinator, captures: { au_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SourcingProgramAdmin }
            - { call: "POST /audits/${au_id}/start", payload: {}, as: Auditor, as_user_id: "${aud_id}" }
          trigger:
            - { call: "POST /audits/${au_id}/findings", payload: { classification: "MAJOR", category: "WAGES", description: "Officer-recorded finding" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INSUFFICIENT_PERMISSIONS (role check p2 fires before any business rule)"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: acknowledgment_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[acknowledgment-create-stale-supplier]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Supplier.version: an acknowledgment carrying the pre-first-ack version is rejected 412 after the first ack advanced the version; re-reading and re-sending with the fresh version succeeds; every successful ack increments Supplier.version by exactly 1."
        test_recipe:
          setup: ["Two PUBLISHED code versions; supplier registered (version 1)"]
          setup_api_calls:
            - { call: "POST /code-versions", payload: { version_label: "CoC v1.0", effective_from: "2026-01-01T00:00:00Z", zero_tolerance_categories: ["FORCED_LABOR"] }, as: SourcingProgramAdmin, captures: { cv1: $.data.id } }
            - { call: "POST /code-versions/${cv1}/transition", payload: { to_status: "PUBLISHED" }, as: SourcingProgramAdmin }
            - { call: "POST /code-versions", payload: { version_label: "CoC v2.0", effective_from: "2026-06-01T00:00:00Z", zero_tolerance_categories: ["FORCED_LABOR"] }, as: SourcingProgramAdmin, captures: { cv2: $.data.id } }
            - { call: "POST /code-versions/${cv2}/transition", payload: { to_status: "PUBLISHED" }, as: SourcingProgramAdmin }
            - { call: "POST /suppliers", payload: { legal_name: "Sierra D", country_code: "US", sector: "FOOD" }, as: SourcingProgramAdmin, captures: { sup_id: $.data.id, sup_v1: $.data.version } }
          trigger:
            - { call: "POST /code-acknowledgments", payload: { supplier_id: "${sup_id}", code_version_id: "${cv1}", signer_name: "V B", signer_title: "CEO", expected_supplier_version: "${sup_v1}" }, as: SupplierContact, as_user_id: "${sup_id}", captures: { ack1: $.data.id } }
            - { call: "POST /code-acknowledgments", payload: { supplier_id: "${sup_id}", code_version_id: "${cv2}", signer_name: "V B", signer_title: "CEO", expected_supplier_version: "${sup_v1}" }, as: SupplierContact, as_user_id: "${sup_id}", captures: { err: $.data.error_id } }
            - { call: "GET /suppliers/${sup_id}", payload: {}, as: ComplianceOfficer, captures: { sup_v2: $.data.version, cur_cv: $.data.current_code_version_id } }
            - { call: "POST /code-acknowledgments", payload: { supplier_id: "${sup_id}", code_version_id: "${cv2}", signer_name: "V B", signer_title: "CEO", expected_supplier_version: "${sup_v2}" }, as: SupplierContact, as_user_id: "${sup_id}", captures: { ack2: $.data.id } }
            - { call: "GET /suppliers/${sup_id}", payload: {}, as: ComplianceOfficer, captures: { sup_v3: $.data.version, cur_cv2: $.data.current_code_version_id } }
          assert:
            - "${err} == ERR_STALE_VERSION (http 412): the second request replayed the version observed before ack1 (1) while the supplier is now at 2"
            - "${sup_v2} == 2 and ${cur_cv} == ${cv1} (the stale write changed nothing)"
            - "with the fresh version: ${ack2} created, ${sup_v3} == 3, ${cur_cv2} == ${cv2}"

      - name: cascading_side_effects_covered
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: "transitive_cascade / zt_finding_four_hop_cascade"
          rationale: "N-level cascade chains are verified end-to-end by both §1.8 transitive_cascade instances (finding-create and verify-fail triggers)."

      - name: dual_variant_calculation_covered
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: "dual_variant_calc / supplier_scorecard_provisional_vs_verified"
          rationale: "Both dual-variant pairs (scorecard provisional/verified and facility risk baseline/history) are asserted with literal divergent values in §1.8."

      - name: rate_threshold_triggers_covered
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: "boundary_precision_check / consequence_tier_boundary_at_eighty"
          rationale: "Threshold crossings at exact boundaries (80/60 tier bands, interview minimum) are asserted in the §1.8 boundary instances and the supplier_probation_recovery_cycle corner."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: audit_start_immediate_visibility
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the start mutation is visible in the same response AND in a subsequent independent GET (no lag, no stale read)."
        test_recipe:
          setup: ["Audit SCHEDULED [2026-09-01, 2026-09-02); clock at 2026-09-01"]
          setup_api_calls:
            - { call: "POST /code-versions", payload: { version_label: "CoC v1.0", effective_from: "2026-01-01T00:00:00Z", zero_tolerance_categories: ["FORCED_LABOR"] }, as: SourcingProgramAdmin, captures: { cv_id: $.data.id } }
            - { call: "POST /code-versions/${cv_id}/transition", payload: { to_status: "PUBLISHED" }, as: SourcingProgramAdmin }
            - { call: "POST /suppliers", payload: { legal_name: "Tango D", country_code: "US", sector: "FOOD" }, as: SourcingProgramAdmin, captures: { sup_id: $.data.id, sup_v: $.data.version } }
            - { call: "POST /code-acknowledgments", payload: { supplier_id: "${sup_id}", code_version_id: "${cv_id}", signer_name: "W B", signer_title: "CEO", expected_supplier_version: "${sup_v}" }, as: SupplierContact, as_user_id: "${sup_id}" }
            - { call: "POST /facilities", payload: { supplier_id: "${sup_id}", name: "Site J2", country_code: "US", worker_count: 10, processes: ["packing"] }, as: SourcingProgramAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /auditors", payload: { full_name: "Lead Auditor", firm_name: "AuditCo", certifications: ["SA8000"], country_codes_covered: ["US"] }, as: AuditCoordinator, captures: { aud_id: $.data.id } }
            - { call: "POST /audits", payload: { facility_id: "${fac_id}", auditor_id: "${aud_id}", audit_type: "INITIAL", announcement: "ANNOUNCED", scheduled_start: "2026-09-01T00:00:00Z", scheduled_end: "2026-09-02T00:00:00Z" }, as: AuditCoordinator, captures: { au_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SourcingProgramAdmin }
          trigger:
            - { call: "POST /audits/${au_id}/start", payload: {}, as: Auditor, as_user_id: "${aud_id}", captures: { st_resp: $.data.status } }
            - { call: "GET /audits/${au_id}", payload: {}, as: ComplianceOfficer, captures: { st_get: $.data.status } }
          assert:
            - "${st_resp} == IN_PROGRESS (mutation visible in the same response) and ${st_get} == IN_PROGRESS (visible to a different role on re-read)"
