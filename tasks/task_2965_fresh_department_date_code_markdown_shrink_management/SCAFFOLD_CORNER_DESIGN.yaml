        excluded_because:
          difficulty_instance: dual_variant_calc / markdown_price_ladder_days_vs_sell_through_on_same_lot
          rationale: "Both declared dual-variant calculations are asserted variant-against-variant on identical data in §1.8's dual_variant_calc instances, including the delta the switch produces."

  # =========================================================================
  # consistency_model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: every_cascade_is_already_visible_in_the_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /fresh/shrink-events/{shrinkEventId}/verify]
          - calculations.markdown_liability
          - calculations.shrink_cost_ratio
          - calculations.department_compliance_posture
          - calculations.gross_margin_impact
        distinguishing_aspect: |
          consistency_model is `immediate`, so the single verify call that drains the lot must expose
          its whole four-hop cascade with no settling time: the 200 body carries the VERIFIED event,
          and the very next reads — issued at the same logical clock, with no intervening write —
          already show the lot DEPLETED at zero units, its QUEUED label VOIDED, the department's
          markdown_liability_cents back to 0, shrink_cost_ratio_pct at 8.33 and compliance_status
          WATCH against the default 2.5 budget, and a margin-report whose numbers are derived from
          exactly those settled values. A queued or lazily recomputed derived field shows up as any
          read disagreeing with the write that preceded it.
        test_recipe:
          setup:
            - "Clock 2026-08-12T08:00:00.000Z; the MEAT base chain at the default shrink_budget_pct of 2.5; one 24-unit lot produced 2026-08-05."
            - "Lot marked down at rung 0 to 509 cents (label QUEUED), then 22 units sold at that price, leaving 2 on hand."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL" }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /fresh/markdown-ladders"
              payload: { name: "MEAT-STD-2026", department_code: "MEAT", rungs: [{ days_remaining_max: 3, discount_pct: 15, requires_manager_approval: false }] }
              as: StoreOperationsAdmin
              captures: { ladder_id: $.data.id }
            - call: "POST /fresh/markdown-ladders/${ladder_id}/activate"
              payload: {}
              as: StoreOperationsAdmin
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_id}", markdown_ladder_id: "${ladder_id}", code: "MEAT", shelf_life_days_default: 10 }
              as: StoreOperationsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /fresh/items"
              payload: { department_id: "${dept_id}", upc: "000111222333", description: "Ribeye Steak 12oz", base_retail_cents: 599, unit_cost_cents: 420, daily_forecast_units: 4.00 }
              as: DepartmentManager
              captures: { item_id: $.data.id }
            - call: "POST /fresh/lots"
              payload: { item_id: "${item_id}", production_date: "2026-08-05", quantity_original: 24 }
              as: FreshClerk
              captures: { lot_id: $.data.id, lot_v1: $.data.version }
            - call: "POST /fresh/lots/${lot_id}/markdowns"
              payload: { expected_lot_version: "${lot_v1}", pricing_variant: "LADDER_DAYS" }
              as: FreshClerk
              as_user_id: "u-clerk-1"
              captures: { label_id: $.data.id }
            - call: "POST /fresh/lots/${lot_id}/sales"
              payload: { quantity_units: 22, register_lane_code: "L07" }
              as: FreshClerk
            - call: "POST /fresh/shrink-events"
              payload: { lot_id: "${lot_id}", cause_code: "SPOILAGE", quantity_units: 2 }
              as: FreshClerk
              as_user_id: "u-clerk-1"
              captures: { shrink_id: $.data.id }
          trigger:
            - call: "POST /fresh/shrink-events/${shrink_id}/verify"
              payload: {}
              as: DepartmentManager
              as_user_id: "u-mgr-1"
              captures: { verified_status: $.data.status, verifier: $.data.verified_by_user_id, verified_at: $.data.verified_at, shrink_cost: $.data.cost_value_cents }
            - call: "GET /fresh/lots/${lot_id}"
              payload: {}
              as: FreshClerk
            - call: "GET /fresh/markdown-labels/${label_id}"
              payload: {}
              as: FreshClerk
            - call: "GET /fresh/departments/${dept_id}"
              payload: {}
              as: DepartmentManager
            - call: "GET /fresh/departments/${dept_id}/margin-report?window_start_date=2026-08-12&window_end_date=2026-08-12"
              payload: { window_start_date: "2026-08-12", window_end_date: "2026-08-12" }
              as: DepartmentManager
          assert:
            - "verify response itself: HTTP 200, ${verified_status} == VERIFIED, ${verifier} == 'u-mgr-1', ${verified_at} == '2026-08-12T08:00:00.000Z' and ${shrink_cost} == 869"
            - "immediately after, with no further write: DateCodeLot.${lot_id}.status == 'DEPLETED', quantity_on_hand == 0, units_sold == 22, units_shrunk == 2, revenue_cents == 11198 and markdown_giveback_cents == 1980"
            - "MarkdownLabel.${label_id}.status == 'VOIDED' — the depletion voided it in the same call"
            - "GET /fresh/departments/${dept_id} returns data.markdown_liability_cents == 0, data.shrink_cost_ratio_pct == 8.33 and data.compliance_status == 'WATCH'"
            - "margin-report returns revenue_cents == 11198, markdown_giveback_cents == 1980, cogs_cents == 9563, shrink_cost_cents == 869, donation_cost_cents == 0, gross_margin_cents == 766, gross_margin_pct == 6.84 and shrink_cost_ratio_pct == 8.33"
            - "the report's shrink_cost_ratio_pct equals the department field read one call earlier: both 8.33, no lag and no second recompute"
            - "GET /fresh/shrink-events?lot_id=${lot_id}&status=VERIFIED&limit=10&offset=0 returns total_count == 1"
