# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 rules, >= 2 instances each. Every grounds[] ref resolves into
# SCAFFOLD.yaml §1.1-§1.7. Every setup_api_calls chain drives empty-DB -> the
# setup state using only §1.5 endpoints; every ${var} is bound by an earlier
# captures: line. All formula-derived asserts are literals computed by code.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: proration_credit_vs_charge_diverge_on_upgrade
        grounds:
          - calculations.proration_on_plan_change
          - state_machines.Subscription.lifecycle_status.ACTIVE_to_CANCELED
          - entities.InvoiceLine.fields.kind
          - endpoints["POST /accounts/{id}/subscriptions/{sid}/change-plan"]
        distinguishing_aspect: |
          The same remaining-days input (20/30) yields two different signed lines on the
          Subscription/Invoice domain: a -2000 PRORATION_CREDIT off the old BASIC fee and a
          +6000 PRORATION_CHARGE off the new PRO fee; net proration 4000 != either variant.
        test_recipe:
          setup:
            - "TaxJurisdiction US-CA (875 bps) exists; clock at 2026-06-01"
            - "Account in US-CA with payment_method_ok=true"
            - "BASIC plan (fee 3000, trial_days 0), PRO plan (fee 9000)"
            - "Subscription created ACTIVE on BASIC, first invoice paid; period_start 2026-06-01, period_end 2026-07-01"
            - "Clock advanced to 2026-06-11 (10 full days elapsed, 20 remaining)"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /tax-jurisdictions"
              payload: { region_code: "US-CA", tax_rate_bps: 875 }
              as: BillingAdmin
            - call: "POST /plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, included_usage_units: 1000, overage_tiers: [{ up_to_units: 4000, rate_cents_per_unit: 2 }, { up_to_units: 19000, rate_cents_per_unit: 1 }, { up_to_units: null, rate_cents_per_unit: 3 }], trial_days: 0 }
              as: BillingAdmin
              captures: { basic_plan_id: $.data.id }
            - call: "POST /plans"
              payload: { tier: "PRO", monthly_fee_cents: 9000, included_usage_units: 1000, overage_tiers: [{ up_to_units: 4000, rate_cents_per_unit: 2 }, { up_to_units: 19000, rate_cents_per_unit: 1 }, { up_to_units: null, rate_cents_per_unit: 3 }], trial_days: 14 }
              as: BillingAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "acme@x.com", company_name: "Acme", region_code: "US-CA", payment_method_ok: true }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { plan_id: "${basic_plan_id}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: BillingAdmin
            - call: "GET /subscriptions/${sub_id}"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { sub_v: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/change-plan"
              payload: { plan_id: "${pro_plan_id}", expected_subscription_version: "${sub_v}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { sub_after_v: $.data.version }
            - call: "GET /accounts/${acct_id}/invoices"
              as: AccountOwner
              as_user_id: "${acct_id}"
          assert:
            - "Subscription.${sub_id}.plan_id == ${pro_plan_id}"
            - "The proration Invoice has an InvoiceLine kind=PRORATION_CREDIT amount_cents == -2000"
            - "The proration Invoice has an InvoiceLine kind=PRORATION_CHARGE amount_cents == 6000"
            - "The proration Invoice.subtotal_cents == 4000 and tax_cents == 350 and total_cents == 4350"

      - name: committed_mrr_vs_recognized_revenue_diverge
        grounds:
          - calculations.account_mrr
          - calculations.recognized_revenue_to_date
          - entities.Account.fields.mrr_cents
          - entities.RevenueScheduleEntry.fields.recognized_to_date_cents
          - endpoints["GET /invoices/{id}/revenue-schedule"]
        distinguishing_aspect: |
          For one PRO subscription, committed MRR (Subscription/Account domain) is the full 9000
          forward-looking, while recognized revenue (Invoice/RevenueScheduleEntry domain) is the
          chronological 4500 at the 15-day mark — same subscription, two domains, two numbers.
        test_recipe:
          setup:
            - "Clock 2026-06-01; US-CA jurisdiction; PRO plan (fee 9000, trial_days 14)"
            - "Account; subscription created TRIALING on PRO then converted ACTIVE at 2026-06-01 with a paid first invoice"
            - "Clock advanced to 2026-06-16 (15 days into the 30-day service period)"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /tax-jurisdictions"
              payload: { region_code: "US-CA", tax_rate_bps: 875 }
              as: BillingAdmin
            - call: "POST /plans"
              payload: { tier: "PRO", monthly_fee_cents: 9000, included_usage_units: 1000, overage_tiers: [{ up_to_units: null, rate_cents_per_unit: 1 }], trial_days: 14 }
              as: BillingAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "rev@x.com", company_name: "RevCo", region_code: "US-CA", payment_method_ok: true }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { plan_id: "${pro_plan_id}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/convert"
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "GET /accounts/${acct_id}/invoices"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-16T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "GET /accounts/${acct_id}"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { mrr_now: $.data.mrr_cents }
            - call: "GET /invoices/${inv_id}/revenue-schedule"
              as: AccountOwner
              as_user_id: "${acct_id}"
          assert:
            - "Account.${acct_id}.mrr_cents == 9000"
            - "The RevenueScheduleEntry for ${inv_id} has total_recognizable_cents == 9000"
            - "The RevenueScheduleEntry for ${inv_id} has recognized_to_date_cents == 4500"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: usage_overage_tiered_marginal_bands_mode_a
        grounds:
          - calculations.usage_overage_charge
          - entities.Plan.fields.overage_tiers
          - entities.InvoiceLine.fields.kind
          - endpoints["POST /_billing/run-renewals"]
        distinguishing_aspect: |
          Mode (a): 5001 recorded units pick across 3 marginal bands (4000@2 + 1@1) for an OVERAGE
          line of 8001 cents — a >=3-input non-linear tier selection, not a flat rate.
        test_recipe:
          setup:
            - "Clock 2026-06-01; US-CA jurisdiction; PRO plan (fee 9000, included 1000, tiers [4000@2,19000@1,*@3])"
            - "Account; ACTIVE PRO subscription (created via convert) with period 2026-06-01..2026-07-01"
            - "5001 usage units recorded inside the period; clock advanced to 2026-07-01 to trigger renewal"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /tax-jurisdictions"
              payload: { region_code: "US-CA", tax_rate_bps: 875 }
              as: BillingAdmin
            - call: "POST /plans"
              payload: { tier: "PRO", monthly_fee_cents: 9000, included_usage_units: 1000, overage_tiers: [{ up_to_units: 4000, rate_cents_per_unit: 2 }, { up_to_units: 19000, rate_cents_per_unit: 1 }, { up_to_units: null, rate_cents_per_unit: 3 }], trial_days: 14 }
              as: BillingAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "use@x.com", company_name: "UseCo", region_code: "US-CA", payment_method_ok: true }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { plan_id: "${pro_plan_id}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/convert"
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/usage"
              payload: { units: 5001, recorded_at: "2026-06-15T00:00:00Z" }
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /_billing/run-renewals"
              as: BillingAdmin
            - call: "GET /accounts/${acct_id}/invoices"
              as: AccountOwner
              as_user_id: "${acct_id}"
          assert:
            - "The renewal Invoice (period_start 2026-07-01) has an InvoiceLine kind=OVERAGE amount_cents == 8001"

      - name: invoice_finalize_discount_before_tax_eval_order_mode_c
        grounds:
          - calculations.invoice_finalize_total
          - entities.Invoice.fields.discount_cents
          - entities.Invoice.fields.tax_cents
          - entities.Coupon.fields.duration
          - endpoints["POST /_billing/run-renewals"]
        distinguishing_aspect: |
          Mode (c): tax depends on the discounted base which depends on subtotal; pinned order
          (subtotal 19001 -> discount 1900 -> taxable 17101 -> tax 1496) yields total 18597, not the
          tax-before-discount alternative.
        test_recipe:
          setup:
            - "Clock 2026-06-01; US-CA (875 bps); PRO plan fee 9000; AddOn SEATS fee 2000; Coupon PCT10 (PERCENT 10, RECURRING)"
            - "ACTIVE PRO subscription with PCT10 coupon and SEATS add-on; 5001 usage units recorded"
            - "Renewal at 2026-07-01 produces subtotal 9000+2000+8001=19001"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /tax-jurisdictions"
              payload: { region_code: "US-CA", tax_rate_bps: 875 }
              as: BillingAdmin
            - call: "POST /plans"
              payload: { tier: "PRO", monthly_fee_cents: 9000, included_usage_units: 1000, overage_tiers: [{ up_to_units: 4000, rate_cents_per_unit: 2 }, { up_to_units: 19000, rate_cents_per_unit: 1 }, { up_to_units: null, rate_cents_per_unit: 3 }], trial_days: 14 }
              as: BillingAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /add-ons"
              payload: { code: "SEATS", monthly_fee_cents: 2000 }
              as: BillingAdmin
              captures: { seats_id: $.data.id }
            - call: "POST /coupons"
              payload: { code: "PCT10", discount_type: "PERCENT", percent_off: 10, duration: "RECURRING", max_redemptions: 5 }
              as: BillingAdmin
              captures: { pct10_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "ord@x.com", company_name: "OrderCo", region_code: "US-CA", payment_method_ok: true }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { plan_id: "${pro_plan_id}", coupon_id: "${pct10_id}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/convert"
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/addons"
              payload: { addon_id: "${seats_id}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/usage"
              payload: { units: 5001, recorded_at: "2026-06-20T00:00:00Z" }
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /_billing/run-renewals"
              as: BillingAdmin
            - call: "GET /accounts/${acct_id}/invoices"
              as: AccountOwner
              as_user_id: "${acct_id}"
          assert:
            - "The renewal Invoice (period_start 2026-07-01) has subtotal_cents == 19001"
            - "That Invoice has discount_cents == 1900"
            - "That Invoice has tax_cents == 1496"
            - "That Invoice has total_cents == 18597"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_parallel_lifecycle_and_billing_dimensions
        grounds:
          - state_machines.Subscription.billing_status.CURRENT_to_PAST_DUE
          - state_machines.Subscription.lifecycle_status.ACTIVE_to_CANCELED
          - entities.Subscription.fields.lifecycle_status
          - entities.Subscription.fields.billing_status
          - endpoints["POST /_billing/run-dunning"]
        distinguishing_aspect: |
          On Subscription, lifecycle_status stays ACTIVE while billing_status moves CURRENT->PAST_DUE
          independently after one failed payment — two axes evolving on the same row (parallel shape).
        test_recipe:
          setup:
            - "Clock 2026-06-01; US-CA; PRO plan (trial_days 14)"
            - "Account with payment_method_ok=true; subscription converted ACTIVE with a paid first invoice"
            - "Card set to fail; clock advanced to 2026-07-01 so renewal generates a new invoice"
            - "run-renewals creates the renewal invoice; run-dunning attempts payment which FAILS"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /tax-jurisdictions"
              payload: { region_code: "US-CA", tax_rate_bps: 875 }
              as: BillingAdmin
            - call: "POST /plans"
              payload: { tier: "PRO", monthly_fee_cents: 9000, included_usage_units: 1000, overage_tiers: [{ up_to_units: null, rate_cents_per_unit: 1 }], trial_days: 14 }
              as: BillingAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "par@x.com", company_name: "ParCo", region_code: "US-CA", payment_method_ok: true }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { plan_id: "${pro_plan_id}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/convert"
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /_payments/set-card-state"
              payload: { account_id: "${acct_id}", payment_method_ok: false }
              as: BillingAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /_billing/run-renewals"
              as: BillingAdmin
          trigger:
            - call: "POST /_billing/run-dunning"
              as: BillingAdmin
            - call: "GET /subscriptions/${sub_id}"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { life: $.data.lifecycle_status, bill: $.data.billing_status }
          assert:
            - "Subscription.${sub_id}.lifecycle_status == ACTIVE"
            - "Subscription.${sub_id}.billing_status == PAST_DUE"
            - "Subscription.${sub_id}.dunning_attempt == 1"

      - name: invoice_branching_open_pastdue_open_revert_loop
        grounds:
          - state_machines.Invoice.status.OPEN_to_PAST_DUE
          - state_machines.Invoice.status.PAST_DUE_to_OPEN
          - state_machines.Invoice.status.OPEN_to_PAID
          - entities.Invoice.fields.status
          - endpoints["POST /_billing/run-dunning"]
        distinguishing_aspect: |
          Invoice (different entity from the parallel case) cycles OPEN->PAST_DUE->OPEN->PAID across
          retries — a branching machine with a revert edge, not a one-way linear pipeline.
        test_recipe:
          setup:
            - "Clock 2026-06-01; US-CA; PRO plan trial_days 14; account converted ACTIVE, first invoice paid"
            - "Card fails; renewal at 2026-07-01 creates the renewal invoice; first dunning fails (PAST_DUE, retry due 2026-07-04)"
            - "Card fixed; clock advanced to the retry time so the retry clears"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /tax-jurisdictions"
              payload: { region_code: "US-CA", tax_rate_bps: 875 }
              as: BillingAdmin
            - call: "POST /plans"
              payload: { tier: "PRO", monthly_fee_cents: 9000, included_usage_units: 1000, overage_tiers: [{ up_to_units: null, rate_cents_per_unit: 1 }], trial_days: 14 }
              as: BillingAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "brn@x.com", company_name: "BrnCo", region_code: "US-CA", payment_method_ok: true }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { plan_id: "${pro_plan_id}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/convert"
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /_payments/set-card-state"
              payload: { account_id: "${acct_id}", payment_method_ok: false }
              as: BillingAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /_billing/run-renewals"
              as: BillingAdmin
            - call: "POST /_billing/run-dunning"
              as: BillingAdmin
            - call: "POST /_payments/set-card-state"
              payload: { account_id: "${acct_id}", payment_method_ok: true }
              as: BillingAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-04T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /_billing/run-dunning"
              as: BillingAdmin
            - call: "GET /accounts/${acct_id}/invoices"
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "GET /subscriptions/${sub_id}"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { bill: $.data.billing_status }
          assert:
            - "The renewal Invoice (period_start 2026-07-01) status == PAID"
            - "Subscription.${sub_id}.billing_status == CURRENT"
            - "Subscription.${sub_id}.dunning_attempt == 0"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: dunning_exhaustion_cascade_depth3_billing_lifecycle_mrr
        grounds:
          - state_machines.Subscription.billing_status.PAST_DUE_to_UNPAID
          - state_machines.Subscription.lifecycle_status.ACTIVE_to_CANCELED
          - entities.Account.fields.mrr_cents
          - entities.Invoice.fields.status
          - endpoints["POST /_billing/run-dunning"]
        distinguishing_aspect: |
          One run-dunning final-fail triggers billing_status PAST_DUE->UNPAID (link 1), that UNPAID
          drives lifecycle ACTIVE->CANCELED (link 2 caused by link 1), and CANCELED zeroes
          mrr_contribution which bubbles up to recompute Account.mrr_cents (link 3 caused by link 2).
        test_recipe:
          setup:
            - "Clock 2026-06-01; US-CA; PRO plan trial_days 14; account converted ACTIVE (mrr 9000)"
            - "Card permanently failing; renewal at 2026-07-01 creates the renewal invoice"
            - "Three failed dunning attempts at offsets 0/+3/+7 days exhaust DUNNING_MAX_ATTEMPTS=3"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /tax-jurisdictions"
              payload: { region_code: "US-CA", tax_rate_bps: 875 }
              as: BillingAdmin
            - call: "POST /plans"
              payload: { tier: "PRO", monthly_fee_cents: 9000, included_usage_units: 1000, overage_tiers: [{ up_to_units: null, rate_cents_per_unit: 1 }], trial_days: 14 }
              as: BillingAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "dun@x.com", company_name: "DunCo", region_code: "US-CA", payment_method_ok: true }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { plan_id: "${pro_plan_id}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/convert"
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /_payments/set-card-state"
              payload: { account_id: "${acct_id}", payment_method_ok: false }
              as: BillingAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /_billing/run-renewals"
              as: BillingAdmin
            - call: "POST /_billing/run-dunning"
              as: BillingAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-04T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /_billing/run-dunning"
              as: BillingAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-08T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /_billing/run-dunning"
              as: BillingAdmin
            - call: "GET /subscriptions/${sub_id}"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { life: $.data.lifecycle_status, bill: $.data.billing_status }
            - call: "GET /accounts/${acct_id}"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { mrr: $.data.mrr_cents }
            - call: "GET /accounts/${acct_id}/invoices"
              as: AccountOwner
              as_user_id: "${acct_id}"
          assert:
            - "Subscription.${sub_id}.billing_status == UNPAID"
            - "Subscription.${sub_id}.lifecycle_status == CANCELED"
            - "Account.${acct_id}.mrr_cents == 0"
            - "The renewal Invoice (period_start 2026-07-01) status == VOID"

      - name: change_plan_cascade_depth2_planid_to_mrr
        grounds:
          - state_machines.Subscription.lifecycle_status.ACTIVE_to_CANCELED
          - calculations.account_mrr
          - entities.Subscription.fields.mrr_contribution_cents
          - entities.Account.fields.mrr_cents
          - endpoints["POST /accounts/{id}/subscriptions/{sid}/change-plan"]
        distinguishing_aspect: |
          A change-plan from a different trigger than the dunning cascade: setting plan_id=PRO
          (link 1) recomputes Subscription.mrr_contribution_cents to 9000 (link 2 caused by link 1),
          which bubbles up Account.mrr_cents to 9000 — depth-2 chain from a distinct origin.
        test_recipe:
          setup:
            - "Clock 2026-06-01; US-CA; BASIC plan fee 3000 trial_days 0; PRO plan fee 9000"
            - "Subscription created ACTIVE on BASIC (mrr 3000); clock advanced to 2026-06-11"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /tax-jurisdictions"
              payload: { region_code: "US-CA", tax_rate_bps: 875 }
              as: BillingAdmin
            - call: "POST /plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, included_usage_units: 1000, overage_tiers: [{ up_to_units: null, rate_cents_per_unit: 1 }], trial_days: 0 }
              as: BillingAdmin
              captures: { basic_plan_id: $.data.id }
            - call: "POST /plans"
              payload: { tier: "PRO", monthly_fee_cents: 9000, included_usage_units: 1000, overage_tiers: [{ up_to_units: null, rate_cents_per_unit: 1 }], trial_days: 14 }
              as: BillingAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "chg@x.com", company_name: "ChgCo", region_code: "US-CA", payment_method_ok: true }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { plan_id: "${basic_plan_id}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: BillingAdmin
            - call: "GET /subscriptions/${sub_id}"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { sub_v: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/change-plan"
              payload: { plan_id: "${pro_plan_id}", expected_subscription_version: "${sub_v}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { contrib: $.data.mrr_contribution_cents }
            - call: "GET /accounts/${acct_id}"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { mrr: $.data.mrr_cents }
          assert:
            - "Subscription.${sub_id}.mrr_contribution_cents == 9000"
            - "Account.${acct_id}.mrr_cents == 9000"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_plan_archived_on_change_plan
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PLAN_ARCHIVED]
          - endpoints["POST /accounts/{id}/subscriptions/{sid}/change-plan"]
        distinguishing_aspect: |
          state (priority 7, ERR_INVALID_STATE) vs business_constraint (priority 9, ERR_PLAN_ARCHIVED):
          a change-plan on a CANCELED subscription targeting an ARCHIVED plan violates both; the lower
          priority number wins so ERR_INVALID_STATE is returned.
        test_recipe:
          setup:
            - "Clock 2026-06-01; US-CA; BASIC plan trial_days 0; a second plan TARGET that is then ARCHIVED"
            - "Subscription created ACTIVE on BASIC then CANCELED; TARGET plan archived"
