      - IsolationComplianceAudit.${audit_pass}.compliance_pct == 90.0
      - 'IsolationComplianceAudit.${audit_pass}.outcome == COMPLIANT (boundary is inclusive: >= 90.0)'
      - IsolationComplianceAudit.${audit_fail}.compliance_pct == 88.9 (8/9 = 88.888... rounds to 88.9)
      - IsolationComplianceAudit.${audit_fail}.outcome == NON_COMPLIANT (88.9 < 90.0)
      - 'side effect asymmetry: the NON_COMPLIANT audit creates exactly one ISOLATION_AUDIT CorrectiveActionPlan while the COMPLIANT audit creates none (GET /api/corrective-action-plans?unit_id=<unit> total_count
        == 1)'
- rule_id: cross_entity_state_dependency
  instances:
  - name: device_day_correction_gated_by_summary_state
    grounds:
    - validations[priority=5.5]
    - state_machines.MonthlySummary.SUBMITTED_to_REJECTED
    - state_machines.DeviceDayCount
    distinguishing_aspect: 'Entity pair (DeviceDayCount -> MonthlySummary): a PUT correction to a

      denominator row is rejected while the covering MonthlySummary is

      SUBMITTED, and the identical PUT succeeds after the summary is

      REJECTED — the valid transition set of DeviceDayCount depends on the

      state of a different entity.

      '
    test_recipe:
      setup:
      - Facility + unit; DeviceDayCount 2026-08-01 (central 20, patient 40); MonthlySummary (2026-08) created and SUBMITTED (row now LOCKED)
      setup_api_calls:
      - call: POST /api/facilities
        payload:
          name: F1
          nhsn_org_id: ORG-1
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
        as: PlatformAdmin
        captures:
          fac_id: $.data.id
      - call: POST /api/units
        payload:
          facility_id: ${fac_id}
          name: ICU-8
          unit_type: ICU
          nhsn_location_code: ICU8
        as: PlatformAdmin
        captures:
          unit_id: $.data.id
      - call: POST /api/device-day-counts
        payload:
          unit_id: ${unit_id}
          count_date: '2026-08-01T00:00:00Z'
          central_line_days: 20
          urinary_catheter_days: 10
          ventilator_days: 5
          patient_days: 40
        as: UnitNurseManager
        captures:
          dd_id: $.data.id
      - call: POST /api/monthly-summaries
        payload:
          unit_id: ${unit_id}
          month: 2026-08
        as: InfectionPreventionist
        captures:
          sum_id: $.data.id
      - call: POST /api/monthly-summaries/${sum_id}/submit
        payload: {}
        as: InfectionPreventionist
      - call: GET /api/device-day-counts/${dd_id}
        payload: {}
        as: UnitNurseManager
        captures:
          dd_v_locked: $.data.version
      trigger:
      - call: PUT /api/device-day-counts/${dd_id}
        payload:
          central_line_days: 25
          urinary_catheter_days: 10
          ventilator_days: 5
          patient_days: 40
          expected_device_day_count_version: ${dd_v_locked}
        as: UnitNurseManager
        captures:
          err1: $.data.error_id
      - call: POST /api/monthly-summaries/${sum_id}/reject
        payload:
          reason: denominator audit finding
        as: InfectionControlDirector
      - call: GET /api/device-day-counts/${dd_id}
        payload: {}
        as: UnitNurseManager
        captures:
          dd_v_draft: $.data.version
      - call: PUT /api/device-day-counts/${dd_id}
        payload:
          central_line_days: 25
          urinary_catheter_days: 10
          ventilator_days: 5
          patient_days: 40
          expected_device_day_count_version: ${dd_v_draft}
        as: UnitNurseManager
        captures:
          dd_v2: $.data.version
      - call: GET /api/monthly-summaries/${sum_id}
        payload: {}
        as: InfectionPreventionist
      assert:
      - 'first PUT: err1 == ERR_SUMMARY_LOCKED, HTTP 409 (row LOCKED while summary SUBMITTED)'
      - the reject compensation (LOCKED -> DRAFT) itself bumps the row version, so dd_v_draft > ${dd_v_locked}; the second PUT must carry the freshly observed version
      - 'second PUT: dd_v2 == ${dd_v_draft} + 1'
      - MonthlySummary.${sum_id}.central_line_days == 25 (recomputed after correction while REJECTED)
      - MonthlySummary.${sum_id}.status == REJECTED
  - name: summary_submission_gated_by_unit_outbreak_posture
    grounds:
    - validations[priority=6]
    - state_machines.MonthlySummary.OPEN_to_SUBMITTED
    - entities.Unit.fields.surveillance_posture
    distinguishing_aspect: 'Entity pair (MonthlySummary -> Unit): submission is valid only when

      the Unit''s derived posture is not OUTBREAK; confirming an

      investigation flips posture to OUTBREAK and the identical submit then

      fails with ERR_OUTBREAK_POSTURE_BLOCKS_SUBMISSION, and only the full

      close-out chain (verified outbreak CAP -> investigation CLOSED ->

      posture NORMAL) makes it succeed.

      '
    test_recipe:
      setup:
      - Facility + ward unit; one adjudicated CLABSI (DOE 2026-08-03) so a manual investigation snapshot is non-empty
      - MonthlySummary (2026-08) in OPEN
      - Manual OutbreakInvestigation (snapshot contributing_case_count == 1) CONFIRMED -> posture OUTBREAK
      setup_api_calls:
      - call: POST /api/facilities
        payload:
          name: F1
          nhsn_org_id: ORG-1
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
        as: PlatformAdmin
        captures:
          fac_id: $.data.id
      - call: POST /api/units
        payload:
          facility_id: ${fac_id}
          name: WARD-4
          unit_type: WARD
          nhsn_location_code: W4
        as: PlatformAdmin
        captures:
          unit_id: $.data.id
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-04T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/patients
        payload:
          mrn: MRN-J1
          admitted_at: '2026-08-01T08:00:00Z'
          unit_id: ${unit_id}
        as: UnitNurseManager
        captures:
          pat_id: $.data.id
      - call: POST /api/device-episodes
        payload:
          patient_id: ${pat_id}
          device_type: CENTRAL_LINE
          placed_at: '2026-08-01T10:00:00Z'
        as: UnitNurseManager
        captures:
          ep_id: $.data.id
      - call: POST /api/infection-cases
        payload:
          patient_id: ${pat_id}
          case_type: CLABSI
          suspected_organism: Acinetobacter baumannii
          first_positive_specimen_at: '2026-08-03T09:00:00Z'
          linked_device_episode_id: ${ep_id}
        as: InfectionPreventionist
        captures:
          case_id: $.data.id
      - call: POST /api/infection-cases/${case_id}/begin-review
        payload: {}
        as: InfectionPreventionist
      - call: POST /api/infection-cases/${case_id}/adjudicate
        payload:
          outcome: ADJUDICATED_HAI
          date_of_event: '2026-08-03T00:00:00Z'
          rationale: LCBI-1 single case cluster
        as: InfectionPreventionist
      - call: POST /api/monthly-summaries
        payload:
          unit_id: ${unit_id}
          month: 2026-08
        as: InfectionPreventionist
        captures:
          sum_id: $.data.id
      - call: POST /api/outbreak-investigations
        payload:
          unit_id: ${unit_id}
          organism: Acinetobacter baumannii
        as: InfectionPreventionist
        captures:
          inv_id: $.data.id
          inv_cnt: $.data.contributing_case_count
      - call: POST /api/outbreak-investigations/${inv_id}/confirm
        payload: {}
        as: InfectionControlDirector
      trigger:
      - call: POST /api/monthly-summaries/${sum_id}/submit
        payload: {}
        as: InfectionPreventionist
        captures:
          err1: $.data.error_id
        as_user_id: ip-user-1
      - call: POST /api/corrective-action-plans
        payload:
          unit_id: ${unit_id}
          source_type: OUTBREAK
          source_ref_id: ${inv_id}
          description: terminal cleaning and cohorting
          due_date: '2026-08-20T00:00:00Z'
        as: InfectionPreventionist
        captures:
          cap_id: $.data.id
        as_user_id: ip-user-1
      - call: POST /api/corrective-action-plans/${cap_id}/activate
        payload: {}
        as: InfectionPreventionist
        as_user_id: ip-user-1
      - call: POST /api/corrective-action-plans/${cap_id}/submit-for-verification
        payload:
          evidence_notes: three consecutive negative rounds
        as: InfectionPreventionist
        as_user_id: ip-user-1
      - call: POST /api/corrective-action-plans/${cap_id}/verify
        payload: {}
        as: InfectionControlDirector
        as_user_id: dir-user-1
      - call: POST /api/outbreak-investigations/${inv_id}/close
        payload: {}
        as: InfectionControlDirector
      - call: POST /api/monthly-summaries/${sum_id}/submit
        payload: {}
        as: InfectionPreventionist
        captures:
          ok2: $.data.status
        as_user_id: ip-user-1
      - call: GET /api/units/${unit_id}
        payload: {}
        as: InfectionControlDirector
      assert:
      - 'manual snapshot: inv_cnt == 1 (adjudicated case captured), so confirm succeeded and posture is OUTBREAK'
      - 'first submit while posture OUTBREAK: err1 == ERR_OUTBREAK_POSTURE_BLOCKS_SUBMISSION, HTTP 403'
      - MonthlySummary.${sum_id}.status remains OPEN after the blocked submit
      - 'CAP verify: segregation satisfied (created by IP user, verified by director user); posture still OUTBREAK while investigation CONFIRMED'
      - 'after close: Unit.${unit_id}.surveillance_posture == NORMAL (no CONFIRMED investigations, no open CAPs)'
      - 'final submit succeeds: ok2 == SUBMITTED'
- rule_id: resource_temporal_overlap
  instances:
  - name: device_episode_half_open_adjacency_allowed
    grounds:
    - validations[priority=7.5]
    - entities.DeviceEpisode.fields.placed_at
    - errors[ERR_DEVICE_EPISODE_OVERLAP]
    distinguishing_aspect: 'Interval semantics: HALF-OPEN [placed_at, removed_at) on

      DeviceEpisode — an episode starting exactly when the prior one was

      removed (placed_at == removed_at) shares NO instant and is allowed,

      while a start strictly inside the prior interval conflicts; the

      resource is (patient, device_type).

      '
    test_recipe:
      setup:
      - Facility + unit + admitted patient
      - 'Episode E1: CENTRAL_LINE placed 2026-08-01T10:00, removed 2026-08-03T14:00'
      setup_api_calls:
      - call: POST /api/facilities
        payload:
          name: F1
          nhsn_org_id: ORG-1
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
        as: PlatformAdmin
        captures:
          fac_id: $.data.id
      - call: POST /api/units
        payload:
          facility_id: ${fac_id}
          name: ICU-9
          unit_type: ICU
          nhsn_location_code: ICU9
        as: PlatformAdmin
        captures:
          unit_id: $.data.id
      - call: POST /api/patients
        payload:
          mrn: MRN-K
          admitted_at: '2026-08-01T06:00:00Z'
          unit_id: ${unit_id}
        as: UnitNurseManager
        captures:
          pat_id: $.data.id
      - call: POST /api/device-episodes
        payload:
          patient_id: ${pat_id}
          device_type: CENTRAL_LINE
          placed_at: '2026-08-01T10:00:00Z'
        as: UnitNurseManager
        captures:
          ep_1: $.data.id
      - call: POST /api/device-episodes/${ep_1}/remove
        payload:
          removed_at: '2026-08-03T14:00:00Z'
        as: UnitNurseManager
      trigger:
      - call: POST /api/device-episodes
        payload:
          patient_id: ${pat_id}
          device_type: CENTRAL_LINE
          placed_at: '2026-08-03T12:00:00Z'
        as: UnitNurseManager
        captures:
          err1: $.data.error_id
      - call: POST /api/device-episodes
        payload:
          patient_id: ${pat_id}
          device_type: CENTRAL_LINE
          placed_at: '2026-08-03T14:00:00Z'
        as: UnitNurseManager
        captures:
          ep_2: $.data.id
      assert:
      - 'overlapping placement 12:00 < removed_at 14:00: err1 == ERR_DEVICE_EPISODE_OVERLAP, HTTP 409'
      - 'back-to-back placement placed_at == removed_at (14:00): created with HTTP 201 — half-open adjacency shares no instant'
      - GET /api/device-episodes?patient_id=<pat>&device_type=CENTRAL_LINE returns total_count == 2
  - name: surgical_procedure_closed_interval_touching_conflicts
    grounds:
    - validations[priority=7.5]
    - entities.SurgicalProcedure.fields.duration_minutes
    - errors[ERR_PROCEDURE_OVERLAP]
    distinguishing_aspect: 'Different interval semantics on a different resource: SurgicalProcedure

      occupies the CLOSED interval [performed_at, performed_at + duration]

      for the patient — a second procedure starting exactly at the first''s

      end instant CONFLICTS (10:00 is inside both), whereas with the

      half-open DeviceEpisode rule the same touching geometry was allowed.

      '
    test_recipe:
      setup:
      - Facility + OR unit + admitted patient
      - 'Procedure P1: performed 2026-08-02T09:00, duration 60 -> occupies [09:00, 10:00] inclusive'
      setup_api_calls:
      - call: POST /api/facilities
        payload:
          name: F1
          nhsn_org_id: ORG-1
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
        as: PlatformAdmin
        captures:
          fac_id: $.data.id
      - call: POST /api/units
        payload:
          facility_id: ${fac_id}
          name: OR-2
          unit_type: OR
          nhsn_location_code: OR2
        as: PlatformAdmin
        captures:
          unit_id: $.data.id
      - call: POST /api/patients
        payload:
          mrn: MRN-L
          admitted_at: '2026-08-01T06:00:00Z'
          unit_id: ${unit_id}
        as: UnitNurseManager
        captures:
          pat_id: $.data.id
      - call: POST /api/surgical-procedures
        payload:
          patient_id: ${pat_id}
          procedure_code: COLO
          performed_at: '2026-08-02T09:00:00Z'
          duration_minutes: 60
          asa_score: 2
          wound_class: CLEAN
        as: UnitNurseManager
        captures:
          proc_1: $.data.id
      trigger:
      - call: POST /api/surgical-procedures
        payload:
          patient_id: ${pat_id}
          procedure_code: APPY
          performed_at: '2026-08-02T10:00:00Z'
          duration_minutes: 30
          asa_score: 1
          wound_class: CLEAN
        as: UnitNurseManager
        captures:
          err1: $.data.error_id
      - call: POST /api/surgical-procedures
        payload:
          patient_id: ${pat_id}
          procedure_code: APPY
          performed_at: '2026-08-02T10:00:01Z'
          duration_minutes: 30
          asa_score: 1
          wound_class: CLEAN
        as: UnitNurseManager
        captures:
          proc_2: $.data.id
      assert:
      - 'touching at the closed boundary (10:00:00 == P1 end): err1 == ERR_PROCEDURE_OVERLAP, HTTP 409'
      - 'one second later (10:00:01): created with HTTP 201'
      - GET /api/surgical-procedures?patient_id=<pat> returns total_count == 2
- rule_id: compensating_invariant
  instances:
  - name: adjudicate_reopen_cycle_conserves_unit_month_case_count
    grounds:
    - state_machines.InfectionCase.ADJUDICATED_HAI_to_REOPENED
    - state_machines.InfectionCase.UNDER_REVIEW_to_ADJUDICATED_HAI
    - entities.MonthlySummary.fields.clabsi_count
    distinguishing_aspect: 'Conserved quantity: the integer count of ADJUDICATED_HAI cases

      attributed to a unit-month (surfaced as MonthlySummary.clabsi_count).

      Forward action adjudicate (+1) paired with compensating reopen (-1)

      must leave the invariant exactly at its pre-cycle value 0 — a cascade

      that completes but leaves drift violates it.

      '
    test_recipe:
      setup:
      - Facility + ICU unit; patient + CENTRAL_LINE episode; CLABSI case UNDER_REVIEW
      - MonthlySummary (2026-08) exists in OPEN with clabsi_count == 0 (baseline)
      setup_api_calls:
      - call: POST /api/facilities
        payload:
          name: F1
          nhsn_org_id: ORG-1
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
        as: PlatformAdmin
        captures:
          fac_id: $.data.id
