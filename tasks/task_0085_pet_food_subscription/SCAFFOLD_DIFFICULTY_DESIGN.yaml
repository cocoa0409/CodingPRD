# =============================================================================
# Pet Food Subscription Box — SCAFFOLD_DIFFICULTY_DESIGN.yaml
# Test Targeting Index (formerly §1.8). Every instance grounds in SCAFFOLD.yaml's
# §1.1–§1.6, names a falsifiable distinguishing aspect, and carries a test_recipe
# reproducible from empty DB using only declared endpoints.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: portion_provisional_vs_feedback_adjusted
        grounds:
          - calculations.portion_grams_per_day
          - state_machines.RecipeAdjustment.SUGGESTED_to_APPLIED
          - state_machines.RecipeAdjustment.VET_APPROVED_to_APPLIED
        distinguishing_aspect: |
          Same Pet (weight_kg, activity_level, life_stage) and same Recipe (kcal_per_gram)
          yield two different portion_grams_per_day values: the provisional path
          returns the unadjusted round_half_up(daily_kcal / kcal_per_gram), whereas
          the feedback_adjusted path applies RecipeAdjustment.portion_delta_pct
          BEFORE the final round and therefore lands on a different integer gram.
          This lives on the Pet domain (portion sizing). Distinct from
          recipe_match_score_strict_vs_relaxed below, which operates on the
          Recipe-selection domain.
        test_recipe:
          setup:
            - "Customer C1 created with verified address"
            - "Pet P1: species=DOG, breed='Labrador', birthdate set so life_stage=ADULT, weight_kg=16, activity_level=MODERATE, allergies=[], health_conditions=[]"
            - "Recipe R1: target_species=DOG, target_life_stage=ADULT, monotony_class='M1', kcal_per_gram=4.0, unit_price_cents_per_100g=200, vet_prescribed=false"
            - "Subscription S1 created over P1, frequency=WEEKLY (cycle_days=7), address verified, activated"
            - "_clock advances by 7 days → cycle_scheduler emits Order O1 (cycle_index=1)"
          trigger:
            - "GET /orders/{O1} → record provisional portion_grams_per_day on the P1 item"
            - "POST a ShipmentFeedback to a delivered O1 (after fulfillment progressed and feedback opened) such that suggestion_engine emits a DECREASE_PORTION suggestion (portion_delta_pct = -10): submit 3 feedbacks with weight_change_grams=+600 each so total>WEIGHT_GAIN_THRESHOLD_GRAMS"
            - "POST /pets/{P1}/recipe-adjustments/{adjId}/apply BEFORE the next Order's modification_deadline"
            - "_clock advances another 7 days → Order O2 generated"
            - "GET /orders/{O2} → record feedback_adjusted portion_grams_per_day on the P1 item"
          assert:
            - "O1.items[0].portion_grams_per_day == 224"            # RER=70*16^0.75=560; 560*1.6*1.0=896; 896/4.0=224
            - "O2.items[0].portion_grams_per_day == 202"            # 224 * 0.90 = 201.6 → round_half_up = 202
            - "O1.items[0].portion_grams_per_day != O2.items[0].portion_grams_per_day"

      - name: recipe_match_score_strict_vs_relaxed
        grounds:
          - calculations.recipe_match_score
          - calculations.recipe_selector
          - validations[priority=7]
        distinguishing_aspect: |
          Same recipe catalog and same Pet weight/activity inputs yield two
          different selected recipe_ids depending on whether the Pet carries a
          health_condition: the strict variant ELIMINATES non-vet-prescribed
          recipes and REQUIRES a prescribed_for match, while the relaxed
          variant ELIMINATES vet_prescribed recipes outright. This is the
          Recipe-selection domain — different entity from portion sizing.
        test_recipe:
          setup:
            - "Customer C1 with verified address"
            - "Pet P_HEALTHY: species=DOG, ADULT, no health_conditions, allergies=[]"
            - "Pet P_KIDNEY:  species=DOG, ADULT, health_conditions=[KIDNEY], allergies=[]"
            - "Recipe R_KIDNEY: vet_prescribed=true, prescribed_for=[KIDNEY], target_species=DOG, target_life_stage=ADULT, monotony_class='Mk', kcal_per_gram=4.0"
            - "Recipe R_REGULAR: vet_prescribed=false, prescribed_for=[], target_species=DOG, target_life_stage=ADULT, monotony_class='Mr', kcal_per_gram=4.0"
          trigger:
            - "POST a Subscription for P_HEALTHY only; activate; _clock advance to trigger cycle"
            - "POST a separate Subscription for P_KIDNEY only; activate; _clock advance to trigger cycle"
            - "GET /pets/{P_HEALTHY}/recipe-recommendations and /pets/{P_KIDNEY}/recipe-recommendations"
          assert:
            - "P_HEALTHY's RecipeRecommendation.recipe_id == R_REGULAR.id"
            - "P_KIDNEY's  RecipeRecommendation.recipe_id == R_KIDNEY.id"
            - "P_HEALTHY's RecipeRecommendation.recipe_id != P_KIDNEY's RecipeRecommendation.recipe_id"

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes (≥2; modes must differ)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: portion_grams_three_factor_nonlinear
        grounds:
          - calculations.portion_grams_per_day
          - entities.Pet.fields.weight_kg
          - entities.Pet.fields.activity_level
          - entities.Pet.fields.life_stage
        distinguishing_aspect: |
          Mode (a): a formula with three inputs (weight_kg, activity_level,
          life_stage) combined non-linearly — weight enters through a power
          law (weight_kg ** 0.75), activity_level and life_stage each select
          a multiplier from a tiered table, then the three multiply. No single
          factor dominates; flipping any one across its boundary changes the
          final integer gram value. Distinct from order_total below
          (mode b — rounding order).
        test_recipe:
          setup:
            - "Pet P_ACTIVE_SENIOR: species=DOG, life_stage=SENIOR (birthdate>=7 years ago for DOG), weight_kg=16, activity_level=HIGH"
            - "Pet P_LOW_ADULT:    species=DOG, life_stage=ADULT,  weight_kg=16, activity_level=LOW"
            - "Recipe R1: kcal_per_gram=4.0"
          trigger:
            - "Activate two subscriptions (one per pet) and advance _clock; record portion_grams_per_day on cycle 1 of each"
          assert:
            - "P_ACTIVE_SENIOR portion_grams_per_day == 224"   # 560*2.0*0.8/4.0 = 224
            - "P_LOW_ADULT    portion_grams_per_day == 168"    # 560*1.2*1.0/4.0 = 168
            - "Switching activity_level alone (HIGH→LOW) AND life_stage alone (SENIOR→ADULT) produces 224→168 — a non-linear interaction"

      - name: order_total_per_line_round_then_sum
        grounds:
          - calculations.order_total
          - entities.Order.fields.items
          - entities.Order.fields.subtotal_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — per-item line totals
          are computed as round_half_up((total_grams/100)*unit_price_cents_per_100g)
          BEFORE summing into subtotal_cents. The scaffold pins per-line round
          then sum. The competing 'sum then round' interpretation yields a
          different integer cent value. This mode (rounding order) is
          structurally distinct from mode (a) above (non-linear factor product).
        test_recipe:
          setup:
            - "Two Pets P1, P2 each with portion_grams_per_day=33 (chosen by setting weight/activity/recipe so 33 results) — pragmatic alternative: directly create two items per Order by configuring two pets sharing a Subscription with cycle_days=1 (frequency=WEEKLY but choose pet weights/kcal so total_grams per item == 33)"
            - "Or, simpler: stub portion via RecipeAdjustment with portion_delta_pct producing exactly 33 grams/day each, cycle_days==1 hypothetical — since WEEKLY=7, instead choose Recipe with unit_price_cents_per_100g=199 and total_grams=33 by adjusting portion to 33 over 1-week cycle (portion_grams_per_day must round to ~5; given that's awkward, alternative: pin items via Order regeneration after applying RecipeAdjustment that decreases portion by 70%)"
            - "Recipe R2: unit_price_cents_per_100g=199, kcal_per_gram=4.0"
          trigger:
            - "Drive an Order such that items list contains two entries with total_grams=33 each"
            - "GET /orders/{orderId}"
          assert:
            - "items[0].line_total_cents == 66"                # round_half_up(33/100*199) = round_half_up(65.67) = 66
            - "items[1].line_total_cents == 66"
            - "subtotal_cents == 132"                          # 66 + 66 — NOT 131 (which would be round(131.34))
            - "Order.subtotal_cents == sum(items.line_total_cents) (per-line round then sum, NOT sum-then-round)"

  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_active_paused_cycle
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - state_machines.Subscription.PAUSED_to_ACTIVE
          - state_machines.Subscription.CANCELLED_to_REACTIVATING
        distinguishing_aspect: |
          Subscription carries a cycle: ACTIVE → PAUSED → ACTIVE (a true
          back-edge), AND CANCELLED → REACTIVATING → ACTIVE (a second
          re-entry path that resets retention_offer_applied). No linear
          pipeline A→B→C→D suffices to describe these transitions.
          Different entity from Order below.
        test_recipe:
          setup:
            - "Customer C1, Pet P1, Subscription S1 in ACTIVE state, address verified"
          trigger:
            - "POST /subscriptions/{S1}/pause body {pause_until: now+10d} → status=PAUSED"
            - "POST /subscriptions/{S1}/resume → status=ACTIVE"
            - "POST /subscriptions/{S1}/cancel with force=true and cancel_reason=OTHER → status=CANCELLED"
            - "POST /subscriptions/{S1}/reactivate → status=REACTIVATING"
            - "Re-verify address; POST /subscriptions/{S1}/activate → status=ACTIVE again"
          assert:
            - "Sequence of S1.status observed: ACTIVE → PAUSED → ACTIVE → CANCELLED → REACTIVATING → ACTIVE"
            - "Subscription state machine returns to ACTIVE via BOTH the PAUSED back-edge AND the CANCELLED→REACTIVATING path"
            - "Subscription.retention_offer_applied is false after the second ACTIVE entry"

      - name: order_parallel_payment_and_fulfillment
        grounds:
          - state_machines.Order.payment_status
          - state_machines.Order.fulfillment_status
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Order carries TWO independent state dimensions (payment_status,
          fulfillment_status) that evolve in parallel on the same row. The
          transitions of payment_status (PENDING→PAID→REFUNDED) do not strictly
          follow fulfillment_status, and vice versa — e.g., a CONFIRMED
          fulfillment may still have a PENDING payment, and a PAID order may
          have its fulfillment cancelled before SHIPPED. This is structurally
          non-linear (parallel) on a different entity from Subscription above.
        test_recipe:
          setup:
            - "Order O1 in state (payment_status=PENDING, fulfillment_status=SCHEDULED) reachable via cycle_scheduler"
          trigger:
            - "POST /orders/{O1}/confirm → fulfillment_status=CONFIRMED, payment_status still PENDING"
            - "POST /orders/{O1}/events/payment {event_type: PAYMENT_CAPTURED} → payment_status=PAID, fulfillment_status still CONFIRMED"
            - "POST /subscriptions/{S1}/cancel (force=true) → fulfillment_status=CANCELLED, payment_status still PAID"
            - "POST /orders/{O1}/events/payment {event_type: PAYMENT_REFUNDED} → payment_status=REFUNDED"
          assert:
            - "After confirm: O1.payment_status == 'PENDING' AND O1.fulfillment_status == 'CONFIRMED' — independent dimensions"
            - "After PAYMENT_CAPTURED: O1.payment_status == 'PAID' AND O1.fulfillment_status == 'CONFIRMED'"
            - "After subscription cancel cascade: O1.payment_status == 'PAID' AND O1.fulfillment_status == 'CANCELLED' — payment unchanged by fulfillment cancel"
            - "After refund event: O1.payment_status == 'REFUNDED' AND O1.fulfillment_status == 'CANCELLED'"

  # ---------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers (≥2; one depth ≥3)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: feedback_to_adjustment_to_next_order_recipe_change
        grounds:
          - state_machines.Order.fulfillment_status (DELIVERED side effect opens feedback)
          - calculations.feedback_aggregation
          - calculations.suggestion_engine
          - state_machines.RecipeAdjustment.SUGGESTED_to_APPLIED
          - state_machines.RecipeRecommendation.PENDING_to_SUPERSEDED
        distinguishing_aspect: |
          Depth-3 chain triggered by ShipmentFeedback create:
            (1) POST /orders/{id}/feedback creates ShipmentFeedback AND
                mutates Pet.weight_kg.
            (2) That Pet.weight_kg mutation triggers feedback_aggregation
                + suggestion_engine, which creates a RecipeAdjustment row.
            (3) When RecipeAdjustment is APPLIED, IT (the previous mutation,
                not the original feedback POST) regenerates the Pet's
                PENDING RecipeRecommendation — SUPERSEDED on the old, fresh
                PENDING with possibly a different recipe_id.
          Each hop is caused by the PREVIOUS hop, not by the original
          feedback call. Depth = 3 (Feedback → Adjustment → Recommendation).
          Trigger origin: POST /orders/{id}/feedback. Different trigger
          from subscription_cancel_cascade below.
        test_recipe:
          setup:
            - "Subscription S1 with Pet P1 ACTIVE, one DELIVERED Order O1, R1 currently in P1's PENDING recommendation"
            - "An alternative Recipe R2 in catalog so suggestion_engine can swap"
          trigger:
            - "POST 2 ShipmentFeedbacks on O1 with weight_change_grams=+600 each (so suggestion_engine emits DECREASE_PORTION on the second feedback once aggregation has 2 rows)"
            - "POST /pets/{P1}/recipe-adjustments/{adjId}/apply"
            - "Inspect Pet P1's RecipeRecommendation rows"
          assert:
            - "After the 2nd feedback: a RecipeAdjustment row exists with suggestion_type='DECREASE_PORTION' AND status='SUGGESTED' (HOP 2 caused by HOP 1)"
            - "After /apply: the prior PENDING RecipeRecommendation for P1 has status='SUPERSEDED' AND a fresh PENDING RecipeRecommendation row exists with the adjusted portion (HOP 3 caused by HOP 2)"
            - "Pet.adjustment_history length increased by 1 with adjustment_id matching the applied adjustment"

      - name: subscription_cancel_cascade_to_orders_and_recommendations
        grounds:
          - state_machines.Subscription.CANCELLED transitions
          - state_machines.Order.fulfillment_status (CANCELLED via cascade)
          - state_machines.RecipeRecommendation.PENDING_to_SUPERSEDED
        distinguishing_aspect: |
          Depth-2 chain triggered by POST /subscriptions/{id}/cancel (force=true):
            (1) Subscription.status → CANCELLED.
            (2) That Subscription mutation causes all non-terminal Orders
                to flip fulfillment_status → CANCELLED AND all PENDING/FROZEN
                RecipeRecommendations to flip → SUPERSEDED.
          Hop 2 is caused by the Subscription mutation, not by direct calls
          on each Order/Recommendation. Trigger origin differs from
          feedback_to_adjustment_to_next_order_recipe_change above.
        test_recipe:
          setup:
            - "Subscription S1 with Pet P1, in ACTIVE state; 1 Order O_SCHED (fulfillment_status=SCHEDULED); 1 PENDING RecipeRecommendation REC_PEND"
          trigger:
            - "POST /subscriptions/{S1}/cancel {cancel_reason: PET_NO_LONGER, force: true}"
          assert:
            - "S1.status == 'CANCELLED' (HOP 1)"
            - "O_SCHED.fulfillment_status == 'CANCELLED' (HOP 2, caused by HOP 1)"
            - "REC_PEND.status == 'SUPERSEDED' (HOP 2, parallel branch)"

  # ---------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_skip
        grounds:
          - validations[priority=4]
          - validations[priority=8]
        distinguishing_aspect: |
          Dual-failure scenario where Subscription is PAUSED (state failure,
          category=state, ERR_INVALID_SUBSCRIPTION_STATE, priority 4) AND
          the modification deadline has also passed (temporal failure,
          category=business_temporal, ERR_MODIFICATION_DEADLINE_PASSED,
          priority 8). The state check wins. Error-category pair: state vs
          business_temporal. Different pair from
          business_safety_vs_business_referential below.
        test_recipe:
          setup:
            - "Subscription S1, Pet P1, Order O1 created via cycle_scheduler"
            - "Set _clock so now == O1.scheduled_ship_at - 24 hours (modification_deadline 48h has therefore passed)"
            - "POST /subscriptions/{S1}/pause {pause_until: now+10d} → S1.status=PAUSED, O1 fulfillment_status flips to CANCELLED per pause cascade"
            - "Force-recreate or use a separate Subscription S2 + Order O2 to test skip while PAUSED with deadline elapsed; OR test via /orders/{O1}/skip after the state flips"
          trigger:
            - "POST /orders/{O1}/skip"
          assert:
            - "Response error_id == 'ERR_INVALID_SUBSCRIPTION_STATE' (priority 4 wins over priority 8)"
            - "Response http_status == 409"
            - "Response error_id != 'ERR_MODIFICATION_DEADLINE_PASSED'"

      - name: business_safety_vs_business_referential_apply
        grounds:
          - validations[priority=6]
          - validations[priority=9]
        distinguishing_aspect: |
          Dual-failure scenario where applying a RecipeAdjustment with a
          target_recipe_id triggers BOTH allergen safety failure (Pet has
          CHICKEN allergy, target recipe contains chicken — priority 6,
          category=business_safety, ERR_ALLERGEN_PROHIBITED) AND
          referential ineligibility (recipe's monotony_class equals previous
          shipped recipe's class — priority 13, category=business_constraint
          via ERR_RECIPE_NOT_ELIGIBLE-by-rotation). Safety check at priority
          6 wins. Error-category pair: business_safety vs business_constraint.
          Different pair from state_vs_business_temporal_skip above.
        test_recipe:
          setup:
            - "Pet P1 with allergies=[CHICKEN]; previous DELIVERED Order's recipe has monotony_class='Mx'"
            - "Recipe R_BAD: protein_sources=[CHICKEN], monotony_class='Mx' (both conditions fail simultaneously)"
            - "Create a SUGGESTED RecipeAdjustment (suggestion_type=SWAP_RECIPE_FAMILY, target_recipe_id=R_BAD)"
            - "Modification window not yet expired"
          trigger:
            - "POST /pets/{P1}/recipe-adjustments/{adjId}/apply"
          assert:
            - "Response error_id == 'ERR_ALLERGEN_PROHIBITED' (priority 6 wins)"
            - "Response http_status == 422"
            - "Response error_id != 'ERR_ROTATION_VIOLATION' AND error_id != 'ERR_RECIPE_NOT_ELIGIBLE'"

  # ---------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: modification_deadline_strict_less_than
        grounds:
          - validations[priority=8]
          - entities.Subscription.fields.modification_deadline_hours
          - entities.Order.fields.scheduled_ship_at
        distinguishing_aspect: |
          The modification deadline check is STRICT less-than:
          now < scheduled_ship_at - 48h. At exact equality (now == cutoff)
          the request is REJECTED. This is a numeric threshold boundary on
          /orders/{id}/skip. Different metric from feedback_empty_set_no_suggestion
          below (a zero-count edge on aggregation).
        test_recipe:
          setup:
            - "Order O1 with scheduled_ship_at = T (fixed wall-clock instant)"
            - "modification_deadline_hours == 48"
          trigger:
            - "Case A: _clock set so now == T - 48h*3600s - 1s; POST /orders/{O1}/skip"
            - "Case B: _clock advance so now == T - 48h*3600s exactly; POST /orders/{O2}/skip on a sibling order"
          assert:
            - "Case A: response is 200 success; Order moves to fulfillment_status='SKIPPED'"
            - "Case B: response error_id == 'ERR_MODIFICATION_DEADLINE_PASSED'; Order remains 'SCHEDULED'"
            - "The exact equality boundary (now == cutoff) is REJECTED — equality is NOT permitted"

      - name: feedback_empty_set_no_suggestion
        grounds:
          - calculations.feedback_aggregation
          - calculations.suggestion_engine
        distinguishing_aspect: |
          Empty-set / zero-count edge: feedback_aggregation requires
          MIN_FEEDBACKS_FOR_SUGGESTION (=2) rows. At count==1 the engine
          emits NO suggestion (no RecipeAdjustment row created); at count==2
          it may emit one. Reached through POST /orders/{id}/feedback.
          Different metric (collection cardinality) from
          modification_deadline_strict_less_than above (numeric threshold).
        test_recipe:
          setup:
            - "Subscription S1, Pet P1, Order O1 with fulfillment_status=DELIVERED"
          trigger:
            - "Case A: submit exactly 1 ShipmentFeedback with weight_change_grams=+1000 (would otherwise trigger DECREASE_PORTION); LIST /pets/{P1}/recipe-adjustments"
            - "Case B: submit a 2nd ShipmentFeedback on a different DELIVERED order O2 with weight_change_grams=+1000; LIST /pets/{P1}/recipe-adjustments"
          assert:
            - "Case A: zero RecipeAdjustment rows exist for P1 (empty-set fallback)"
            - "Case B: exactly one RecipeAdjustment row with suggestion_type='DECREASE_PORTION' and portion_delta_pct == -10"

  # ---------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_confirm_requires_subscription_active
        grounds:
          - state_machines.Order.SCHEDULED_to_CONFIRMED
          - validations[priority=4]
          - entities.Subscription.fields.status
        distinguishing_aspect: |
          Order's SCHEDULED→CONFIRMED transition is gated by the parent
          Subscription's status. If Subscription is PAUSED or CANCELLED, the
          Order cannot be confirmed even when all other order-level
          preconditions (address verified, inventory present) are satisfied.
          Entity pair: Order → Subscription. Different pair from
          adjustment_apply_requires_pet_not_vet_hold below.
        test_recipe:
          setup:
            - "Subscription S1 ACTIVE; cycle_scheduler emits Order O1; warehouse + inventory configured"
            - "POST /subscriptions/{S1}/pause {pause_until: far_future}"
          trigger:
            - "POST /orders/{O1}/confirm"
          assert:
            - "Response error_id == 'ERR_INVALID_SUBSCRIPTION_STATE'"
            - "O1.fulfillment_status remains 'CANCELLED' (it was cancelled by pause cascade) or 'SCHEDULED' if pause precedence kept it — assertion: O1.fulfillment_status != 'CONFIRMED'"
            - "After /subscriptions/{S1}/resume, a fresh Order from the next cycle CAN be confirmed (control case demonstrating dependency)"

      - name: adjustment_apply_requires_pet_not_vet_hold
        grounds:
          - state_machines.RecipeAdjustment.SUGGESTED_to_APPLIED
          - state_machines.RecipeAdjustment.SUGGESTED_to_VET_PENDING
          - entities.Pet.fields.status
        distinguishing_aspect: |
          RecipeAdjustment's SUGGESTED→APPLIED transition is gated by
          Pet.status. If Pet is on VET_HOLD (e.g., because of a prior
          VET_ESCALATE adjustment), no SUGGESTED adjustment for that pet can
          be applied — the application is rejected with ERR_PET_NOT_ACTIVE.
          Entity pair: RecipeAdjustment → Pet. Different pair from
          order_confirm_requires_subscription_active above.
        test_recipe:
          setup:
            - "Pet P1 currently ACTIVE; create a SUGGESTED RecipeAdjustment ADJ1 (suggestion_type=DECREASE_PORTION)"
            - "Separately drive Pet P1 into VET_HOLD by creating an escalating RecipeAdjustment ADJ_VET (suggestion_type=VET_ESCALATE) — its creation flips Pet.status to VET_HOLD"
          trigger:
            - "POST /pets/{P1}/recipe-adjustments/{ADJ1}/apply"
          assert:
            - "Response error_id == 'ERR_PET_NOT_ACTIVE'"
            - "ADJ1.status remains 'SUGGESTED'"
            - "After POST /pets/{P1}/recipe-adjustments/{ADJ_VET}/events/vet {event_type: VET_APPROVED}, Pet.status restored to 'ACTIVE' and POST /pets/{P1}/recipe-adjustments/{ADJ1}/apply succeeds"

  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: subscription_pause_half_open_interval
        grounds:
          - validations[priority=10]
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - entities.Subscription.fields.paused_until
        distinguishing_aspect: |
          Pause windows on a Subscription use HALF-OPEN interval semantics
          [now, paused_until). A new pause request whose [now', paused_until')
          shares ANY moment with an existing window is rejected with
          ERR_PAUSE_WINDOW_OVERLAP, but exact boundary touch (new pause
          starting AT the previous paused_until instant) is allowed — that
          is the half-open property. Different interval semantics from
          warehouse_daily_capacity_closed_closed_date below.
        test_recipe:
          setup:
            - "Subscription S1 ACTIVE; pause it with pause_until = T_a (a wall-clock instant)"
            - "Auto-resume disabled: keep _clock before T_a so S1 still PAUSED"
            - "Manually resume S1 via POST /subscriptions/{S1}/resume"
          trigger:
            - "Case A: with _clock at some T < T_a — POST /subscriptions/{S1}/pause {pause_until: T_a + 1d} where current pause window is [T_now, T_a) — request second pause starting NOW that overlaps the first window"
            - "Case B: advance _clock to T_a exactly; POST /subscriptions/{S1}/pause {pause_until: T_a + 1d} — abutting at the exact closed boundary of the first pause"
          assert:
            - "Case A: error_id == 'ERR_PAUSE_WINDOW_OVERLAP', http=409 — the windows share interior"
            - "Case B: success 200 — half-open interval permits abutting at T_a (T_a was excluded from the first window)"

      - name: warehouse_daily_capacity_closed_closed_date
        grounds:
          - validations[priority=11]
          - entities.Warehouse.fields.daily_outbound_capacity
          - state_machines.Order.SCHEDULED_to_CONFIRMED
          - concurrency_rules[warehouse_capacity]
        distinguishing_aspect: |
          Warehouse daily capacity uses CLOSED-CLOSED interval semantics on
          UTC date buckets — discrete days, not continuous time. Two Orders
          whose scheduled_ship_at fall on the SAME UTC calendar date both
          count against the warehouse's daily_outbound_capacity for that
          date, even if their wall-clock instants are hours apart. Different
          interval semantics from subscription_pause_half_open_interval
          (continuous half-open) above; this is bucketed-discrete.
        test_recipe:
          setup:
            - "Warehouse WH1 with daily_outbound_capacity=1, ONLINE, serves region 'CA'"
            - "InventoryLots for two recipes at WH1, both with quantity_grams large enough"
            - "Two subscriptions S1, S2 with addresses in region CA, both ACTIVE; cycle_scheduler emits O1 and O2 with scheduled_ship_at sharing the SAME UTC date"
          trigger:
            - "POST /orders/{O1}/confirm → succeeds, debits WH1's day-bucket count to 1/1"
            - "POST /orders/{O2}/confirm → must fail (same UTC date)"
          assert:
            - "O1 confirm response: 200, O1.warehouse_id == WH1.id"
            - "O2 confirm response: error_id == 'ERR_WAREHOUSE_CAPACITY_EXCEEDED' OR 'ERR_NO_WAREHOUSE_AVAILABLE' (since WH1 is the only candidate and its day-bucket is full); http=409"
            - "Capacity is bucketed by UTC date — two orders many hours apart on the SAME calendar day still collide"

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: cycle_counter_invariant_under_skip
        grounds:
          - calculations.conserved_cycle_invariant
          - calculations.cycle_scheduler
          - state_machines.Order.SCHEDULED_to_SKIPPED
          - entities.Subscription.fields.scheduled_order_count
          - entities.Subscription.fields.skipped_count
          - entities.Subscription.fields.total_cycles_elapsed
        distinguishing_aspect: |
          Conserved quantity: total_cycles_elapsed (a non-decreasing cycle
          counter). Forward action cycle_scheduler bumps both
          scheduled_order_count and total_cycles_elapsed by 1. Compensating
          action /orders/{id}/skip decrements scheduled_order_count by 1 AND
          increments skipped_count by 1, leaving the named invariant
          (scheduled_order_count + skipped_count == total_cycles_elapsed)
          unchanged. Conserved quantity TYPE: integer cycle count.
          Different type from money_invariant_under_refund below.
        test_recipe:
          setup:
            - "Subscription S1 ACTIVE with one Pet, frequency WEEKLY, address verified, recipe + inventory + warehouse configured for cycle_scheduler"
          trigger:
            - "Advance _clock 7 days → cycle_scheduler emits Order O1; record S1 counters"
            - "POST /orders/{O1}/skip (within modification window)"
            - "Advance _clock another 7 days → cycle_scheduler emits Order O2"
            - "Read S1 counters again"
          assert:
            - "After cycle 1: S1.scheduled_order_count == 1, S1.skipped_count == 0, S1.total_cycles_elapsed == 1; invariant 1+0==1 holds"
            - "After skip of O1: S1.scheduled_order_count == 0, S1.skipped_count == 1, S1.total_cycles_elapsed == 1; invariant 0+1==1 holds"
            - "After cycle 2: S1.scheduled_order_count == 1, S1.skipped_count == 1, S1.total_cycles_elapsed == 2; invariant 1+1==2 holds"
            - "At EVERY observation point: S1.scheduled_order_count + S1.skipped_count == S1.total_cycles_elapsed"

      - name: money_invariant_under_refund
        grounds:
          - calculations.conserved_money_invariant
          - state_machines.Order.PENDING_to_PAID
          - state_machines.Order.PAID_to_REFUNDED
          - entities.Customer.fields.total_charged_cents
          - entities.Customer.fields.total_refunded_cents
          - entities.Order.fields.total_cents
        distinguishing_aspect: |
          Conserved quantity: per-Customer ledger pair (total_charged_cents,
          total_refunded_cents). Forward action PAYMENT_CAPTURED increments
          Customer.total_charged_cents by Order.total_cents. Compensating
          action PAYMENT_REFUNDED (after fulfillment cancel) increments
          Customer.total_refunded_cents by Order.total_cents WITHOUT touching
          total_charged_cents. Invariants:
            sum over PAID Orders of total_cents == Customer.total_charged_cents
            sum over REFUNDED Orders of total_cents == Customer.total_refunded_cents
          Conserved quantity TYPE: money (cents). Different type from
          cycle_counter_invariant_under_skip above (integer cycle count).
        test_recipe:
          setup:
            - "Customer C1 with Subscription S1 ACTIVE, one Pet, recipe+warehouse+inventory set up so order_total computes to a known value V_total"
          trigger:
            - "_clock advance → Order O1 generated; POST /orders/{O1}/confirm; POST /orders/{O1}/events/payment {event_type: PAYMENT_CAPTURED}"
            - "POST /subscriptions/{S1}/cancel {cancel_reason: OTHER, force: true} → O1.fulfillment_status flips to CANCELLED while payment_status stays PAID"
            - "POST /orders/{O1}/events/payment {event_type: PAYMENT_REFUNDED}"
          assert:
            - "After capture: C1.total_charged_cents == O1.total_cents AND C1.total_refunded_cents == 0"
            - "After fulfillment cancel: C1.total_charged_cents == O1.total_cents (unchanged) AND C1.total_refunded_cents == 0 (refund event not yet fired)"
            - "After refund: C1.total_charged_cents == O1.total_cents (unchanged) AND C1.total_refunded_cents == O1.total_cents — net 0 money retained"
            - "C1.total_charged_cents - C1.total_refunded_cents == 0 after the compensating action — the named money quantity returns to its pre-action value"
