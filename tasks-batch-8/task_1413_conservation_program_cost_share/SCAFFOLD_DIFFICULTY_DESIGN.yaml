            - { call: "POST /eqip/payment-requests/${req}/review", payload: {}, as: PaymentOfficer, as_user_id: "po-1" }
            - { call: "POST /eqip/payment-requests/${req}/approve", payload: {}, as: PaymentOfficer, as_user_id: "po-1" }
            - { call: "POST /eqip/payment-requests/${req}/disburse", payload: {}, as: PaymentOfficer, as_user_id: "po-1", captures: { disb: $.data.disbursed_amount_cents, offs: $.data.advance_offset_cents } }
            - { call: "GET /eqip/advance-payments/${adv}", payload: {}, as: ProgramAdmin, captures: { adv_st: $.data.status, adv_out: $.data.outstanding_cents } }
          trigger:
