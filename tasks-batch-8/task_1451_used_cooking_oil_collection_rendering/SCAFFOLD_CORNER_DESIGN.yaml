  - section: cross_cutting_layers
    instances:
      - name: c_occ_stale_contract_amend_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[contract-amend-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Contract.version: the first amend with the observed version succeeds (version 2 -> 3); replaying the same expected version then fails deterministically with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["customer with contract activated at clock 2026-08-02 (version 2 after activation)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/customers"
              payload: { name: "OCC House", site_address: "46 Fry Way", site_max_container_gal: 5000 }
              as: FieldOpsManager
              captures: { cust: $.data.id }
            - call: "POST /api/customers/${cust}/contracts"
              payload: { pricing_mode: REBATE, index_code: YG_CBI, term_start: "2026-07-01", term_end: "2027-07-01", floor_cents_per_gal: 50, cap_cents_per_gal: 150 }
              as: FieldOpsManager
              captures: { con: $.data.id }
            - { call: "POST /api/contracts/${con}/activate", payload: {}, as: FieldOpsManager }
            - call: "GET /api/contracts/${con}"
              payload: {}
              as: FieldOpsManager
              captures: { con_v: $.data.version }
          trigger:
            - call: "POST /api/contracts/${con}/amend"
              payload: { expected_contract_version: "${con_v}", cap_cents_per_gal: 140 }
              as: FieldOpsManager
              captures: { v_after: $.data.version, cap_after: $.data.cap_cents_per_gal }
            - call: "POST /api/contracts/${con}/amend"
              payload: { expected_contract_version: "${con_v}", cap_cents_per_gal: 130 }
              as: FieldOpsManager
              captures: { err: $.data.error_id }
          assert:
            - "first amend succeeds: version == ${con_v} + 1 and cap_cents_per_gal == 140"
            - "second amend with the same expected_contract_version fails 412 with error_id == ERR_STALE_VERSION"
            - "Contract.${con}.cap_cents_per_gal remains 140 (loser's write not applied)"

