          assert:
            - "error_id == ERR_ENV_MORATORIUM (safety priority 8) — NOT ERR_LIFT_SLOT_CONFLICT (constraint priority 12), although 08:30 < 09:00 + 30min buffer also collides with ${splash_a}"

  # =====================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: runoff_ppm_exactly_100_flags_violation
        grounds:
          - calculations.runoff_compliance_check
          - entities.EnvironmentalEvent.fields.status
        distinguishing_aspect: |
          Metric = runoff ppm on POST /yard/environmental-events: 99.9 is
          ADVISORY with no hold, while exactly 100.0 crosses the >= boundary
          into VIOLATION_FLAGGED and fires the hold cascade.
        test_recipe:
          setup:
            - "Job ON_HARD (no work orders); EnvironmentalOfficer logging two washdown/sanding events"
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV PPM", owner_name: "O X", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "POWER", displacement_tons: 10 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PX", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/yard-rows", payload: { code: "X", total_stands: 6 }, as: YardManager, captures: { row_id: $.data.id, row_v: $.data.version } }
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_id}", stands_used: 3, start_date: "2026-08-02", end_date: "2026-09-30", expected_yard_row_version: "${row_v}" }, as: YardManager }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", vessel_displacement_tons: 10 }, as: YardManager, captures: { slot_id: $.data.id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:30:00Z" }, as: YardManager }
            - { call: "POST /yard/lift-slots/${slot_id}/complete", payload: {}, as: YardManager }
          trigger:
            - { call: "POST /yard/environmental-events", payload: { job_id: "${j_id}", kind: "WASHDOWN", containment_used: true, runoff_tss_ppm: 99.9 }, as: EnvironmentalOfficer, captures: { st_low: $.data.status } }
            - { call: "POST /yard/environmental-events", payload: { job_id: "${j_id}", kind: "SANDING", containment_used: true, runoff_tss_ppm: 100.0 }, as: EnvironmentalOfficer, captures: { st_hi: $.data.status } }
            - { call: "GET /yard/refit-jobs/${j_id}/compliance-holds", payload: {}, as: EnvironmentalOfficer, captures: { hold0: "$.data[0].status" } }
          assert:
            - "99.9 ppm event status == ADVISORY and creates no hold"
            - "100.0 ppm event status == VIOLATION_FLAGGED (>= boundary inclusive)"
            - "exactly one OPEN AUTO_VIOLATION hold exists after the second event only"

      - name: stand_exact_capacity_fit_allowed
        grounds:
          - calculations.stand_occupancy
          - entities.YardRow.fields.stands_in_use
        distinguishing_aspect: |
          Metric = stand count on POST /yard/stand-assignments (different metric
          and endpoint from the ppm instance): projected 6 + requested 4 ==
          total_stands 10 is ALLOWED (reject only when > total), while one more
          intersecting stand (10 + 1 > 10) is rejected.
        test_recipe:
          setup:
            - "Yard row with total_stands 10; three vessels with jobs in INTAKE"
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/yard-rows", payload: { code: "F", total_stands: 10 }, as: YardManager, captures: { row_id: $.data.id, row_v: $.data.version } }
            - { call: "POST /yard/vessels", payload: { name: "MV A", owner_name: "O A", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "POWER", displacement_tons: 10 }, as: ServiceWriter, captures: { v_a: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_a}", provider: "P", policy_no: "PA1", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_a}" }, as: ServiceWriter, captures: { j_a: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_a}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/vessels", payload: { name: "MV B", owner_name: "O B", owner_user_id: "owner-2", loa_ft: 30, beam_ft: 10, hull_type: "SAIL", displacement_tons: 10 }, as: ServiceWriter, captures: { v_b: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_b}", provider: "P", policy_no: "PB1", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_b}" }, as: ServiceWriter, captures: { j_b: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_b}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/vessels", payload: { name: "MV C", owner_name: "O C", owner_user_id: "owner-3", loa_ft: 28, beam_ft: 9, hull_type: "SAIL", displacement_tons: 8 }, as: ServiceWriter, captures: { v_c: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_c}", provider: "P", policy_no: "PC1", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_c}" }, as: ServiceWriter, captures: { j_c: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_c}/submit", payload: {}, as: ServiceWriter }
          trigger:
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_a}", stands_used: 6, start_date: "2026-08-02", end_date: "2026-09-30", expected_yard_row_version: "${row_v}" }, as: YardManager, captures: { sa_a: $.data.id } }
            - { call: "GET /yard/yard-rows/${row_id}", payload: {}, as: YardManager, captures: { row_v2: $.data.version } }
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_b}", stands_used: 4, start_date: "2026-08-02", end_date: "2026-09-30", expected_yard_row_version: "${row_v2}" }, as: YardManager, captures: { sa_b: $.data.id } }
            - { call: "GET /yard/yard-rows/${row_id}", payload: {}, as: YardManager, captures: { row_v3: $.data.version, in_use: $.data.stands_in_use } }
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_c}", stands_used: 1, start_date: "2026-08-05", end_date: "2026-08-20", expected_yard_row_version: "${row_v3}" }, as: YardManager, captures: { err: $.data.error_id } }
          assert:
            - "second assignment with projected 6 + 4 == total_stands 10 succeeds (== boundary allowed): ${sa_b} created ACTIVE"
            - "row stands_in_use == 10 after the exact-fit assignment"
            - "third assignment (projected 10 + 1 > 10) rejected with ERR_STANDS_EXHAUSTED"

  # =====================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: submit_requires_qualifying_insurance
        grounds:
          - state_machines.RefitJob.DRAFT_to_INTAKE
          - calculations.active_certificate_selection
          - "errors[ERR_INSURANCE_MISSING]"
        distinguishing_aspect: |
          Entity pair InsuranceCertificate -> RefitJob: the job's DRAFT->INTAKE
          transition is gated on the vessel's certificate qualifying TODAY;
          a certificate expired by date blocks submission until a qualifying
          certificate exists.
        test_recipe:
          setup:
            - "Vessel with one certificate whose expiry_date (2026-07-01) precedes the current date (2026-08-01); job in DRAFT"
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV Uninsured", owner_name: "O U", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "POWER", displacement_tons: 10 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "OldCo", policy_no: "OLD-1", liability_coverage_cents: 200000000, effective_date: "2025-01-01", expiry_date: "2026-07-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
          trigger:
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter, captures: { err: $.data.error_id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "NewCo", policy_no: "NEW-1", liability_coverage_cents: 200000000, effective_date: "2026-08-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter, captures: { st_after: $.data.status } }
          assert:
            - "first submit fails with ERR_INSURANCE_MISSING (expired certificate does not qualify)"
            - "after a qualifying certificate is added, submit succeeds and job status == INTAKE"

      - name: readiness_requires_all_work_orders_terminal
        grounds:
          - state_machines.RefitJob.WORK_IN_PROGRESS_to_READY_FOR_SPLASH
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETE
        distinguishing_aspect: |
          Entity pair WorkOrder -> RefitJob (different pair from the insurance
          instance): the job auto-transitions to READY_FOR_SPLASH only when the
          LAST non-terminal work order completes — with two work orders,
          completing the first leaves the job in WORK_IN_PROGRESS.
        test_recipe:
          setup:
            - "Job ON_HARD with two work orders (WO1, WO2), both APPROVED then STARTED"
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV Duo", owner_name: "O D", owner_user_id: "owner-1", loa_ft: 34, beam_ft: 11, hull_type: "POWER", displacement_tons: 14 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PD", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/yard-rows", payload: { code: "D", total_stands: 8 }, as: YardManager, captures: { row_id: $.data.id, row_v: $.data.version } }
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_id}", stands_used: 3, start_date: "2026-08-02", end_date: "2026-09-30", expected_yard_row_version: "${row_v}" }, as: YardManager }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", vessel_displacement_tons: 14 }, as: YardManager, captures: { slot_id: $.data.id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:30:00Z" }, as: YardManager }
            - { call: "POST /yard/lift-slots/${slot_id}/complete", payload: {}, as: YardManager }
            - { call: "POST /yard/work-orders", payload: { job_id: "${j_id}", type: "MECHANICAL", description: "Engine", quoted_hours: 1, quoted_rate_cents: 8000, quoted_parts_cents: 0 }, as: ServiceWriter, captures: { wo1: $.data.id } }
            - { call: "POST /yard/work-orders", payload: { job_id: "${j_id}", type: "ELECTRICAL", description: "Wiring", quoted_hours: 1, quoted_rate_cents: 9000, quoted_parts_cents: 0 }, as: ServiceWriter, captures: { wo2: $.data.id } }
            - { call: "POST /yard/work-orders/${wo1}/approve", payload: {}, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /yard/work-orders/${wo2}/approve", payload: {}, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /yard/work-orders/${wo1}/start", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/work-orders/${wo2}/start", payload: {}, as: ServiceWriter }
          trigger:
            - { call: "POST /yard/work-orders/${wo1}/complete", payload: {}, as: ServiceWriter }
            - { call: "GET /yard/refit-jobs/${j_id}", payload: {}, as: ServiceWriter, captures: { st_mid: $.data.status } }
            - { call: "POST /yard/work-orders/${wo2}/complete", payload: {}, as: ServiceWriter }
            - { call: "GET /yard/refit-jobs/${j_id}", payload: {}, as: ServiceWriter, captures: { st_end: $.data.status } }
          assert:
            - "after completing only WO1: job status == WORK_IN_PROGRESS (WO2 still non-terminal)"
            - "after completing WO2: job status == READY_FOR_SPLASH (all work orders terminal, >= 1 COMPLETE, no holds)"

  # =====================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: lift_slot_buffer_adjacency_boundary
        grounds:
          - calculations.lift_slot_overlap
          - "errors[ERR_LIFT_SLOT_CONFLICT]"
        distinguishing_aspect: |
          Resource = the single travel lift; semantics = half-open window plus a
          strict 30-minute buffer: a second slot starting at 09:29 conflicts
          with an 08:00-09:00 slot, but starting at exactly 09:30 (==
          end + buffer) is allowed.
        test_recipe:
          setup:
            - "Two vessels with jobs in INTAKE; job A holds a BOOKED HAUL_OUT slot 2026-08-02T08:00-09:00"
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV First", owner_name: "O F", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "POWER", displacement_tons: 10 }, as: ServiceWriter, captures: { v_a: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_a}", provider: "P", policy_no: "PF", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_a}" }, as: ServiceWriter, captures: { j_a: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_a}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/vessels", payload: { name: "MV Second", owner_name: "O S", owner_user_id: "owner-2", loa_ft: 30, beam_ft: 10, hull_type: "SAIL", displacement_tons: 10 }, as: ServiceWriter, captures: { v_b: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_b}", provider: "P", policy_no: "PS2", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_b}" }, as: ServiceWriter, captures: { j_b: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_b}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_a}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", vessel_displacement_tons: 10 }, as: YardManager, captures: { slot_a: $.data.id } }
          trigger:
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_b}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T09:29:00Z", scheduled_end: "2026-08-02T10:29:00Z", vessel_displacement_tons: 10 }, as: YardManager, captures: { err: $.data.error_id } }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_b}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T09:30:00Z", scheduled_end: "2026-08-02T10:30:00Z", vessel_displacement_tons: 10 }, as: YardManager, captures: { slot_b: $.data.id } }
          assert:
            - "09:29 start rejected with ERR_LIFT_SLOT_CONFLICT (inside the 30-minute buffer)"
            - "09:30 start (== end + buffer exactly) succeeds and returns a BOOKED slot id"

      - name: stand_closed_interval_touching_conflict
        grounds:
          - calculations.stand_occupancy
          - "errors[ERR_STANDS_EXHAUSTED]"
        distinguishing_aspect: |
          Resource = a YardRow's aggregate stand capacity; semantics = CLOSED
          date intervals (touching end/start dates DO intersect) combined with
          aggregate capacity rather than pairwise slot windows — different
          interval semantics and different resource than the lift-slot
          instance: a 6-stand assignment Aug 02-10 plus a 6-stand assignment
          Aug 10-20 collide on Aug 10 (6+6 > 10), but Aug 11-20 is disjoint
          and fits.
        test_recipe:
          setup:
            - "Yard row total_stands 10; jobs A and B in INTAKE; job A holds 6 stands 2026-08-02..2026-08-10"
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/yard-rows", payload: { code: "T2", total_stands: 10 }, as: YardManager, captures: { row_id: $.data.id, row_v: $.data.version } }
            - { call: "POST /yard/vessels", payload: { name: "MV StandA", owner_name: "O A", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "POWER", displacement_tons: 10 }, as: ServiceWriter, captures: { v_a: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_a}", provider: "P", policy_no: "PA2", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_a}" }, as: ServiceWriter, captures: { j_a: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_a}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_a}", stands_used: 6, start_date: "2026-08-02", end_date: "2026-08-10", expected_yard_row_version: "${row_v}" }, as: YardManager, captures: { sa_a: $.data.id } }
            - { call: "GET /yard/yard-rows/${row_id}", payload: {}, as: YardManager, captures: { row_v2: $.data.version } }
            - { call: "POST /yard/vessels", payload: { name: "MV StandB", owner_name: "O B", owner_user_id: "owner-2", loa_ft: 32, beam_ft: 11, hull_type: "SAIL", displacement_tons: 12 }, as: ServiceWriter, captures: { v_b: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_b}", provider: "P", policy_no: "PB2", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_b}" }, as: ServiceWriter, captures: { j_b: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_b}/submit", payload: {}, as: ServiceWriter }
          trigger:
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_b}", stands_used: 6, start_date: "2026-08-10", end_date: "2026-08-20", expected_yard_row_version: "${row_v2}" }, as: YardManager, captures: { err: $.data.error_id } }
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_b}", stands_used: 6, start_date: "2026-08-11", end_date: "2026-08-20", expected_yard_row_version: "${row_v2}" }, as: YardManager, captures: { sa_b: $.data.id } }
          assert:
            - "Aug 10 start (touching the closed end date Aug 10) rejected with ERR_STANDS_EXHAUSTED (6+6 > 10)"
            - "Aug 11 start (fully disjoint) succeeds: ${sa_b} created ACTIVE"
            - "the rejected attempt does not bump the row version (second attempt reuses ${row_v2})"

  # =====================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: stand_assign_release_conserves_row_capacity
        grounds:
          - calculations.stand_occupancy
          - state_machines.StandAssignment.ACTIVE_to_RELEASED
          - entities.YardRow.fields.stands_in_use
        distinguishing_aspect: |
          Conserved quantity = YardRow stand occupancy: assign(4) followed by
          release() leaves stands_in_use == 0, exactly its pre-assignment
          value; the forward and compensating actions cancel with no drift
          (while version still advances on each mutation).
        test_recipe:
          setup:
            - "Yard row total_stands 10, stands_in_use 0; job in INTAKE"
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/yard-rows", payload: { code: "INV", total_stands: 10 }, as: YardManager, captures: { row_id: $.data.id, row_v: $.data.version } }
            - { call: "POST /yard/vessels", payload: { name: "MV Inv", owner_name: "O I", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "POWER", displacement_tons: 10 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PI", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
            - { call: "GET /yard/yard-rows/${row_id}", payload: {}, as: YardManager, captures: { in_use_before: $.data.stands_in_use } }
          trigger:
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_id}", stands_used: 4, start_date: "2026-08-02", end_date: "2026-09-30", expected_yard_row_version: "${row_v}" }, as: YardManager, captures: { sa_id: $.data.id } }
            - { call: "GET /yard/yard-rows/${row_id}", payload: {}, as: YardManager, captures: { in_use_mid: $.data.stands_in_use } }
            - { call: "POST /yard/stand-assignments/${sa_id}/release", payload: {}, as: YardManager, captures: { sa_status: $.data.status } }
            - { call: "GET /yard/yard-rows/${row_id}", payload: {}, as: YardManager, captures: { in_use_after: $.data.stands_in_use } }
          assert:
            - "stands_in_use before assignment == 0"
            - "stands_in_use after assign(4) == 4"
            - "assignment status == RELEASED after release"
            - "stands_in_use after release == 0 == pre-assignment value (assign + release conserves row capacity)"

      - name: ledger_post_void_conserves_balance
        grounds:
          - calculations.ledger_balance
          - state_machines.LedgerEntry.POSTED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity = job ledger balance in cents (different quantity
          from stand capacity): posting a DEPOSIT of 21250 moves balance from
          40000 to 18750, and voiding that entry returns balance to exactly
          40000 — post + void compose to the identity on balance_cents.
        test_recipe:
          setup:
            - "Job WORK_IN_PROGRESS with a COMPLETE work order whose LABOR charge 40000 is POSTED; statement balance 40000"
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV Ledger", owner_name: "O G", owner_user_id: "owner-1", loa_ft: 40, beam_ft: 13, hull_type: "POWER", displacement_tons: 20 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PG", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/yard-rows", payload: { code: "G", total_stands: 8 }, as: YardManager, captures: { row_id: $.data.id, row_v: $.data.version } }
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_id}", stands_used: 3, start_date: "2026-08-02", end_date: "2026-09-30", expected_yard_row_version: "${row_v}" }, as: YardManager }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", vessel_displacement_tons: 20 }, as: YardManager, captures: { slot_id: $.data.id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:30:00Z" }, as: YardManager }
            - { call: "POST /yard/lift-slots/${slot_id}/complete", payload: {}, as: YardManager }
            - { call: "POST /yard/work-orders", payload: { job_id: "${j_id}", type: "MECHANICAL", description: "Engine", quoted_hours: 10, quoted_rate_cents: 8000, quoted_parts_cents: 5000 }, as: ServiceWriter, captures: { wo_id: $.data.id } }
            - { call: "POST /yard/work-orders/${wo_id}/approve", payload: {}, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /yard/work-orders/${wo_id}/start", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/labor-entries", payload: { work_order_id: "${wo_id}", worker_type: "YARD_CREW", hours: 5, rate_cents: 8000 }, as: ServiceWriter }
            - { call: "POST /yard/work-orders/${wo_id}/complete", payload: {}, as: ServiceWriter }
            - { call: "GET /yard/refit-jobs/${j_id}/statement", payload: {}, as: Accountant, captures: { bal_before: $.data.balance_cents } }
          trigger:
            - { call: "POST /yard/ledger-entries", payload: { job_id: "${j_id}", kind: "DEPOSIT", amount_cents: 21250 }, as: Accountant, captures: { entry_id: $.data.id } }
            - { call: "GET /yard/refit-jobs/${j_id}/statement", payload: {}, as: Accountant, captures: { bal_mid: $.data.balance_cents } }
            - { call: "POST /yard/ledger-entries/${entry_id}/void", payload: {}, as: Accountant, captures: { entry_status: $.data.status } }
            - { call: "GET /yard/refit-jobs/${j_id}/statement", payload: {}, as: Accountant, captures: { bal_after: $.data.balance_cents } }
          assert:
            - "balance before deposit == 40000 (LABOR charge only)"
            - "balance after DEPOSIT 21250 == 18750"
            - "entry status == VOIDED after void"
            - "balance after void == 40000 == pre-deposit balance (post + void conserves the ledger)"
