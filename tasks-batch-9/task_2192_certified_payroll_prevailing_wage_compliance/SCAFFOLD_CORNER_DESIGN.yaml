      - name: overlapping_determination_periods_on_one_locality_are_refused
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DETERMINATION_PERIOD_OVERLAP
          - validations[priority 25] determination governing-period overlap
        excluded_because:
          difficulty_instance: resource_temporal_overlap / determination_governing_period_half_open_on_a_locality
          rationale: "§1.8 already drives ERR_DETERMINATION_PERIOD_OVERLAP at its exact half-open boundary, activating a successor whose effective_date equals the predecessor's expiry_date (legal) and then one microsecond earlier (refused), on the same locality_code. A second corner test could only restate the same activation with a coarser gap."

