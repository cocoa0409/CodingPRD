      - name: driving_record_validity_is_checked_before_its_point_total
        claim_type: cascading_validation
        grounds:
          - validations[priority 17]
          - validations[priority 18]
          - errors[ERR_DRIVING_RECORD_INVALID]
          - calculations.renter_driving_record_points
        distinguishing_aspect: >-
          A renter whose latest DRIVING_RECORD check has result MAJOR AND whose
          ROLLING_36M total is 8 (above MAX_RECORD_POINTS 6) violates priority 17
          and priority 18 at once; the answer must be 422
          ERR_DRIVING_RECORD_INVALID, because the point sum is only meaningful
          once the record itself qualifies.
        test_recipe:
          setup: >-
            Canonical marketplace with the listing LISTED plus a second renter
            holding two DRIVING_RECORD checks — CLEAR 4 points on 2025-01-01 and
            MAJOR 4 points on 2026-07-01 — and an ADVANCED towing check.
          setup_api_calls:
            - *k_clock
            - *k_owner
            - *k_renter
            - *k_season_peak
            - *k_season_shoulder
            - *k_season_off
            - *k_plan_std
            - *k_policy_mod
            - *k_qual_dr
            - *k_qual_tow
            - *k_listing
            - *k_doc_title
            - *k_doc_reg
            - *k_doc_ins
            - *k_insp_front
            - *k_insp_rear
            - *k_insp_interior
            - *k_insp_roof
            - *k_insp_under
            - *k_verify_title
            - *k_verify_reg
            - *k_verify_ins
            - *k_submit
            - *k_list_approve
            - *k_fund
            - &k_renter2
              call: "POST /rv-marketplace/renters"
              payload: { display_name: "Cara Risky", email: "cara@rvshare.test", date_of_birth: "1990-03-02", license_state_code: "WA" }
              as: PlatformAdmin
              captures: { renter2_id: "$.data.id" }
            - call: "POST /rv-marketplace/renter-qualifications"
              payload:
                renter_id: "${renter2_id}"
                check_type: "DRIVING_RECORD"
                result: "CLEAR"
                violation_points: 4
                checked_at: "2025-01-01T00:00:00Z"
                expires_on: "2027-07-01"
              as: PlatformAdmin
            - call: "POST /rv-marketplace/renter-qualifications"
              payload:
                renter_id: "${renter2_id}"
                check_type: "DRIVING_RECORD"
                result: "MAJOR"
                violation_points: 4
                checked_at: "2026-07-01T00:00:00Z"
                expires_on: "2027-07-01"
              as: PlatformAdmin
            - &k_renter2_tow
              call: "POST /rv-marketplace/renter-qualifications"
              payload:
                renter_id: "${renter2_id}"
                check_type: "TOWING_EXPERIENCE"
                result: "VERIFIED_ADVANCED"
                violation_points: 0
                checked_at: "2026-07-01T00:00:00Z"
                expires_on: "2027-07-01"
              as: PlatformAdmin
          trigger:
            - call: "POST /rv-marketplace/bookings"
              payload:
                listing_id: "${listing_id}"
                renter_id: "${renter2_id}"
                protection_plan_id: "${plan_id}"
                cancellation_policy_id: "${policy_id}"
                start_date: "2026-08-29"
                end_date: "2026-09-02"
                delivery_option: "PICKUP"
                declared_miles: 380
                declared_generator_hours: 11.0
              as: Renter
              as_user_id: "${renter2_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response 422"
            - "data.error_id == 'ERR_DRIVING_RECORD_INVALID' (not ERR_DRIVING_RECORD_POINTS_EXCEEDED)"
            - "GET /rv-marketplace/renters/${renter2_id} returns data.driving_record_points == 8"
            - "GET /rv-marketplace/renters/${renter2_id} returns data.driving_record_status == 'MAJOR'"
            - "GET /rv-marketplace/bookings with renter_id == ${renter2_id} returns total_count == 0"

      - name: state_error_outranks_business_safety_error_on_booking_create
        claim_type: priority_ordering
        grounds:
          - validations[priority 14]
          - validations[priority 16]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / suspended_listing_409_outranks_underage_renter_422
          rationale: >-
            The named §1.8 instance violates priority 14 and priority 16 in one
            request and asserts the 409 answer plus the 422 control, which is
            exactly this priority-ordering claim.

      - name: temporal_conflict_outranks_referential_ineligibility
        claim_type: priority_conflict
        grounds:
          - validations[priority 24]
          - validations[priority 34]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / date_collision_409_outranks_plan_class_ineligibility_422
          rationale: >-
            The named §1.8 instance violates priority 24 and priority 34
            simultaneously and asserts the 409 wins, then clears the dates to
            expose the 422.

      - name: booking_admission_depends_on_the_parent_listings_state
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 14]
          - state_machines.Listing
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / booking_creation_is_gated_by_the_parent_listings_review_state
          rationale: >-
            The named §1.8 instance tests booking creation against IN_REVIEW,
            SUSPENDED and LISTED parents, covering both the invalid and the valid
            side of this cross-entity validation.

      - name: requests_missing_auth_headers_or_carrying_an_unknown_role_are_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority 1]
          - validations[priority 2]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: >-
          401 precedes everything, including 404: probing an unknown listing id
          with NO X-User-Role/X-User-ID headers, and again with the role
          "Auditor" that is not one of the four declared roles, both yield 401
          ERR_UNAUTHENTICATED rather than ERR_LISTING_NOT_FOUND or 403.
        test_recipe:
          setup: "Empty system with only the logical clock pinned."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /rv-marketplace/listings/00000000-0000-4000-8000-000000000000"
              as: NONE
              captures: { err: "$.data.error_id" }
            - call: "GET /rv-marketplace/listings/00000000-0000-4000-8000-000000000000"
              as: Auditor
              captures: { err2: "$.data.error_id" }
          assert:
            - "step 1 (both auth headers omitted): response 401 and data.error_id == 'ERR_UNAUTHENTICATED'"
            - "step 2 (X-User-Role: Auditor, an undeclared role): response 401 and data.error_id == 'ERR_UNAUTHENTICATED'"
            - "neither response is 404 ERR_LISTING_NOT_FOUND and neither is 403"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: pricing_guidance_derives_the_suggested_rate_from_utilization_and_season
        claim_type: computed_read
        grounds:
          - endpoints[GET /rv-marketplace/listings/{listingId}/pricing-guidance]
          - calculations.utilization_analytics
          - calculations.seasonal_pricing_guidance
          - entities.PricingSeason
        distinguishing_aspect: >-
          A pure read endpoint that stores nothing: with one CONFIRMED 4-night
          booking, the 90-day forward window is 2026-08-01..2026-10-29,
          utilization_bp is round(4 * 10000 / 90) = 444, which sits below
          LOW_UTIL_BP (2500) so util_adj_bp is -1000, the clock date falls inside
          PEAK (13500 bp) and the suggestion is
          round(21533 * 13500 / 10000 * 9000 / 10000) = 26163 — and calling it
          twice leaves the listing's version untouched.
        test_recipe:
          setup: >-
            Full canonical marketplace, three pricing seasons registered, booking
            B1 CONFIRMED for 2026-08-29..2026-09-02, logical clock 2026-08-01.
          setup_api_calls:
            - *k_clock
            - *k_owner
            - *k_renter
            - *k_season_peak
            - *k_season_shoulder
            - *k_season_off
            - *k_plan_std
            - *k_policy_mod
            - *k_qual_dr
            - *k_qual_tow
            - *k_listing
            - *k_doc_title
            - *k_doc_reg
            - *k_doc_ins
            - *k_insp_front
            - *k_insp_rear
            - *k_insp_interior
            - *k_insp_roof
            - *k_insp_under
            - *k_verify_title
            - *k_verify_reg
            - *k_verify_ins
            - *k_submit
            - *k_list_approve
            - *k_fund
            - *k_booking
            - *k_bk_approve
            - *k_bk_confirm
          trigger:
            - call: "GET /rv-marketplace/listings/${listing_id}/pricing-guidance"
              as: Owner
              as_user_id: "${owner_id}"
          assert:
            - "response 200"
            - "data.window_start_date == '2026-08-01' and data.window_end_date == '2026-10-29'"
            - "data.booked_nights == 4"
            - "data.utilization_bp == 444"
            - "data.util_adj_bp == -1000"
            - "data.season_code == 'PEAK' and data.season_multiplier_bp == 13500"
            - "data.suggested_nightly_rate_cents == 26163"
            - "GET /rv-marketplace/listings/${listing_id} still returns data.version == 14 and data.base_nightly_rate_cents == 21533 (guidance is advisory only)"

      - name: archive_action_retires_a_draft_listing_with_no_live_bookings
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /rv-marketplace/listings/{listingId}/archive]
          - state_machines.Listing
        distinguishing_aspect: >-
          /archive is the one Listing transition reachable from THREE source
          states and shared by two roles; from DRAFT it needs no documents, no
          inspection photos and no admin, so the owner alone moves version 1 to
          ARCHIVED at version 2 while listed_listing_count stays 0 (the owner
          counter is only touched when leaving or entering LISTED).
        test_recipe:
          setup: "Logical clock pinned and one owner holding a freshly created DRAFT listing."
          setup_api_calls:
            - *k_clock
            - *k_owner
            - call: "POST /rv-marketplace/listings"
              payload:
                owner_id: "${owner_id}"
                nickname: "Abandoned Fifth Wheel"
                vehicle_class: "FIFTH_WHEEL"
                gvwr_lbs: 14000
                length_ft: 34
                base_nightly_rate_cents: 25000
                included_miles_per_night: 100
                mileage_overage_rate_cents_per_mile: 70
                included_generator_hours_per_night: 4.0
                generator_overage_rate_cents_per_hour: 450
                min_renter_age: 25
              as: Owner
              as_user_id: "${owner_id}"
              captures: { listing_arch_id: "$.data.id" }
          trigger:
            - call: "POST /rv-marketplace/listings/${listing_arch_id}/archive"
              as: Owner
              as_user_id: "${owner_id}"
          assert:
            - "response 200"
            - "data.listing_status == 'ARCHIVED'"
            - "data.version == 2"
            - "GET /rv-marketplace/owners/${owner_id} returns data.listed_listing_count == 0"
            - "GET /rv-marketplace/listings with listing_status == 'ARCHIVED' returns total_count == 1"

      - name: delivery_assignment_on_a_pickup_booking_is_rejected
        claim_type: conditional_action
        grounds:
          - endpoints[POST /rv-marketplace/delivery-assignments]
          - validations[priority 36]
          - errors[ERR_DELIVERY_NOT_APPLICABLE]
        distinguishing_aspect: >-
          The assignment endpoint is conditional on the BOOKING's chosen
          delivery_option, not on the listing's delivery_offered flag: the
          canonical listing does offer delivery and the campground has capacity,
          yet because B1 was booked PICKUP the create returns 422
          ERR_DELIVERY_NOT_APPLICABLE with no assignment row and the booking's
          quote left at 146063.
        test_recipe:
          setup: >-
            Full canonical marketplace with delivery-capable listing, an
            ACCEPTING campground, and booking B1 created with delivery_option PICKUP.
          setup_api_calls:
            - *k_clock
            - *k_owner
            - *k_renter
            - *k_camp
            - *k_season_peak
            - *k_season_shoulder
            - *k_season_off
            - *k_plan_std
            - *k_policy_mod
            - *k_qual_dr
            - *k_qual_tow
            - *k_listing
            - *k_doc_title
            - *k_doc_reg
            - *k_doc_ins
            - *k_insp_front
            - *k_insp_rear
            - *k_insp_interior
            - *k_insp_roof
            - *k_insp_under
            - *k_verify_title
            - *k_verify_reg
            - *k_verify_ins
            - *k_submit
            - *k_list_approve
            - *k_fund
            - *k_booking
          trigger:
            - call: "POST /rv-marketplace/delivery-assignments"
              payload:
                booking_id: "${booking_id}"
                campground_id: "${camp_id}"
                window_start: "2026-08-29T14:00:00Z"
                window_end: "2026-08-29T16:00:00Z"
                distance_miles: 10
                expected_booking_version: "${booking_v}"
              as: Owner
              as_user_id: "${owner_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response 422"
            - "data.error_id == 'ERR_DELIVERY_NOT_APPLICABLE'"
            - "GET /rv-marketplace/delivery-assignments with booking_id == ${booking_id} returns total_count == 0"
            - "GET /rv-marketplace/bookings/${booking_id} returns data.delivery_fee_cents == 0 and data.quoted_total_cents == 146063"

      - name: campground_create_then_read_round_trips_every_stored_field
        claim_type: standard_crud
        grounds:
          - endpoints[POST /rv-marketplace/campgrounds]
          - endpoints[GET /rv-marketplace/campgrounds/{campgroundId}]
          - entities.Campground
        distinguishing_aspect: >-
          The campground is a reference entity with no state machine of its own:
          POST returns 201 with status defaulted to ACCEPTING and version 1, and the
          subsequent GET returns byte-identical field values — including the
          buffer minutes and capacity that later gate drop-off windows.
        test_recipe:
          setup: "Logical clock pinned only."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /rv-marketplace/campgrounds"
              payload:
                name: "Deschutes River Sites"
                state_code: "OR"
                max_rig_length_ft: 36
                daily_dropoff_capacity: 3
                dropoff_buffer_minutes: 45
              as: PlatformAdmin
              captures: { camp_crud_id: "$.data.id" }
            - call: "GET /rv-marketplace/campgrounds/${camp_crud_id}"
              as: PlatformAdmin
          assert:
            - "trigger step 1: response 201, data.status == 'ACCEPTING', data.version == 1"
            - "trigger step 2: response 200"
            - "trigger step 2: data.name == 'Deschutes River Sites' and data.state_code == 'OR'"
            - "trigger step 2: data.max_rig_length_ft == 36 and data.daily_dropoff_capacity == 3 and data.dropoff_buffer_minutes == 45"
            - "trigger step 2: data.id == ${camp_crud_id} and data.version == 1"

      - name: assignment_link_with_an_unknown_campground_is_not_found
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /rv-marketplace/delivery-assignments]
          - validations[priority 11]
          - errors[ERR_CAMPGROUND_NOT_FOUND]
        distinguishing_aspect: >-
          A link endpoint must resolve BOTH sides before judging anything else:
          the same PICKUP booking that yields ERR_DELIVERY_NOT_APPLICABLE with a
          real campground returns 404 ERR_CAMPGROUND_NOT_FOUND when the
          campground_id is unknown, proving existence (priority 11) outranks the
          422 applicability rule.
        test_recipe:
          setup: >-
            Full canonical marketplace with booking B1 created (PICKUP) and no
            campground matching the probed id.
          setup_api_calls:
            - *k_clock
            - *k_owner
            - *k_renter
            - *k_season_peak
            - *k_season_shoulder
            - *k_season_off
            - *k_plan_std
            - *k_policy_mod
            - *k_qual_dr
            - *k_qual_tow
            - *k_listing
            - *k_doc_title
            - *k_doc_reg
            - *k_doc_ins
            - *k_insp_front
            - *k_insp_rear
            - *k_insp_interior
            - *k_insp_roof
            - *k_insp_under
            - *k_verify_title
            - *k_verify_reg
            - *k_verify_ins
            - *k_submit
            - *k_list_approve
            - *k_fund
            - *k_booking
          trigger:
            - call: "POST /rv-marketplace/delivery-assignments"
              payload:
                booking_id: "${booking_id}"
                campground_id: "00000000-0000-4000-8000-000000000000"
                window_start: "2026-08-29T14:00:00Z"
                window_end: "2026-08-29T16:00:00Z"
                distance_miles: 10
                expected_booking_version: "${booking_v}"
              as: Owner
              as_user_id: "${owner_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response 404"
            - "data.error_id == 'ERR_CAMPGROUND_NOT_FOUND' (not ERR_DELIVERY_NOT_APPLICABLE)"
            - "GET /rv-marketplace/delivery-assignments with booking_id == ${booking_id} returns total_count == 0"

  # ===========================================================================
  - section: errors
    instances:

      - name: every_path_parameter_family_returns_its_own_not_found_code
        claim_type: error_triggerable
        grounds:
          - validations[priority 5]
          - errors[ERR_OWNER_NOT_FOUND]
          - errors[ERR_RENTER_NOT_FOUND]
          - errors[ERR_QUALIFICATION_NOT_FOUND]
          - errors[ERR_LISTING_NOT_FOUND]
          - errors[ERR_DOCUMENT_NOT_FOUND]
          - errors[ERR_CAMPGROUND_NOT_FOUND]
          - errors[ERR_BOOKING_NOT_FOUND]
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_READING_NOT_FOUND]
          - errors[ERR_PHOTO_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_LEDGER_ENTRY_NOT_FOUND]
        distinguishing_aspect: >-
          Twelve resource families, twelve distinct 404 codes for the SAME
          syntactically valid but unresolvable UUID — the implementation must not
          collapse them into one generic ERR_NOT_FOUND, and must not return 400
          for a well-formed id that simply does not exist.
        test_recipe:
          setup: "Empty system with only the logical clock pinned."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /rv-marketplace/owners/00000000-0000-4000-8000-000000000000"
              as: PlatformAdmin
              captures: { e_owner: "$.data.error_id" }
            - call: "GET /rv-marketplace/renters/00000000-0000-4000-8000-000000000000"
              as: PlatformAdmin
              captures: { e_renter: "$.data.error_id" }
            - call: "GET /rv-marketplace/renter-qualifications/00000000-0000-4000-8000-000000000000"
              as: PlatformAdmin
              captures: { e_qual: "$.data.error_id" }
            - call: "GET /rv-marketplace/listings/00000000-0000-4000-8000-000000000000"
              as: PlatformAdmin
              captures: { e_listing: "$.data.error_id" }
            - call: "GET /rv-marketplace/vehicle-documents/00000000-0000-4000-8000-000000000000"
              as: PlatformAdmin
              captures: { e_doc: "$.data.error_id" }
            - call: "GET /rv-marketplace/campgrounds/00000000-0000-4000-8000-000000000000"
              as: PlatformAdmin
              captures: { e_camp: "$.data.error_id" }
            - call: "GET /rv-marketplace/bookings/00000000-0000-4000-8000-000000000000"
              as: PlatformAdmin
              captures: { e_booking: "$.data.error_id" }
            - call: "GET /rv-marketplace/delivery-assignments/00000000-0000-4000-8000-000000000000"
              as: PlatformAdmin
              captures: { e_assign: "$.data.error_id" }
            - call: "GET /rv-marketplace/meter-readings/00000000-0000-4000-8000-000000000000"
              as: PlatformAdmin
              captures: { e_reading: "$.data.error_id" }
