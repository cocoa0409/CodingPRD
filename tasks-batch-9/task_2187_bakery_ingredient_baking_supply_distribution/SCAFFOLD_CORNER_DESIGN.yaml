              as: WarehouseOperator
              as_user_id: "wo_1"
              captures: { lot_g: $.data.id }
            - call: "POST /bakery-distribution/orders"
              payload: { customer_id: "${cust_id}", delivery_mode: "BAGGED", requested_delivery_on: "2026-09-10T00:00:00Z" }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /bakery-distribution/orders/${order_id}/lines"
              payload: { product_id: "${prod_g}", quantity_lb: 4000 }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /bakery-distribution/orders/${order_id}/submit"
              payload: {}
              as: CustomerBuyer
              as_user_id: "${cust_id}"
            - call: "POST /bakery-distribution/orders/${order_id}/allocate"
