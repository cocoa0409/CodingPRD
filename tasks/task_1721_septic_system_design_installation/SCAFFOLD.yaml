    roles: [ProjectManager]
    code: 201
    input: ["parcel_id", "address_line", "county_code", "high_water_table"]
    output: Site
    side_effects: ["current_period_index = 0; status = OPEN; seasonal_freeze_until = -1"]

  - method: GET
    path: "/septic-ops/installer-companies/{cid}/customers/{cuid}/sites"
    description: "List sites for a customer"
    roles: [PlatformAdmin, ProjectManager, SystemDesigner, SoilScientist, Inspector, HealthOfficer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Site[]"
    side_effects: []

  - method: GET
    path: "/septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}"
    description: "Get a site"
    roles: [PlatformAdmin, ProjectManager, SystemDesigner, SoilScientist, Inspector, HealthOfficer]
    code: 200
    input: []
    output: Site
    side_effects: []

  - method: POST
    path: "/septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/clock/advance"
    description: "Advance the site's deterministic logical clock. Server default: every site starts at current_period_index 0; the logical clock never reads wall-clock time."
    roles: [ProjectManager]
    code: 200
    input: ["by_periods"]
    output: Site
    side_effects:
      - "current_period_index += by_periods"
      - "If site.status == FROZEN and current_period_index > seasonal_freeze_until: site.status = OPEN, seasonal_freeze_until = -1 (auto unfreeze)"
      - "Each ISSUED permit whose expires_period < new current_period_index transitions to EXPIRED; its non-terminal installations are forced to FAILED_HOLD (expiry cascade)"
      - "Each ACTIVE maintenance contract whose end_period < new current_period_index transitions to LAPSED; each LAPSED contract whose end_period + LAPSE_GRACE_PERIODS < new current_period_index transitions to EXPIRED"

  - method: POST
    path: "/septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/freeze"
    description: "Set a seasonal freeze window on the site"
    roles: [ProjectManager]
    code: 200
    input: ["freeze_until_period"]
    output: Site
    side_effects: ["site.status = FROZEN; site.seasonal_freeze_until = freeze_until_period"]

  - method: POST
    path: "/septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/close"
    description: "Close a site once all work is complete"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Site
    side_effects: ["site.status = CLOSED"]

  # --- Soil Evaluations ---
  - method: POST
    path: "/septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/soil-evaluations"
    description: "Record a soil evaluation; supersedes any RECORDED evaluation for the site"
    roles: [SoilScientist]
    code: 201
    input: ["evaluator_id", "soil_class", "limiting_layer_inches"]
    output: SoilEvaluation
    side_effects:
      - "evaluation_date_period = site.current_period_index; status = RECORDED"
      - "Any previously RECORDED SoilEvaluation for the site transitions to SUPERSEDED (cascade hop 1); every DRAFT SystemDesign pinning it transitions to WITHDRAWN (hop 2)"

  - method: GET
    path: "/septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/soil-evaluations"
    description: "List soil evaluations for a site"
    roles: [PlatformAdmin, ProjectManager, SystemDesigner, SoilScientist, Inspector, HealthOfficer]
    code: 200
