            - "meta.total_count == 2"
            - "meta.has_more == false"
            - "meta.limit == 1"
            - "meta.offset == 1"

      - name: program_enrollment_counters_reconcile_across_activation_and_withdrawal
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Program.fields.active_enrollment_count
          - entities.Program.fields.total_enrollment_count
          - entities.EnrollmentCounselor.fields.open_pipeline_count
        distinguishing_aspect: "Two counters with different lifetimes are maintained off the same events: activation lifts active_enrollment_count to 1 while total_enrollment_count also reads 1, and the withdrawal drops active back to 0 while total stays at 1 — a monotonic history counter beside a live-population counter."
        test_recipe:
          setup:
