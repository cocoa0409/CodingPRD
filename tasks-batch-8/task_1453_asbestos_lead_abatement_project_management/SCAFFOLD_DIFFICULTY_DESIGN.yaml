            - { call: "GET /abatement/projects/${p_id}", payload: {}, as: ContractorAdmin, captures: { p_v: "$.data.version" } }
            - { call: "POST /abatement/notifications", payload: { project_id: "${p_id}", notification_type: "INITIAL", declared_acm_sq_ft: 100, expected_project_version: "${p_v}" }, as: ContractorAdmin, captures: { n_id: "$.data.id" } }
            - { call: "POST /abatement/notifications/${n_id}/acknowledge", payload: {}, as: RegulatorClerk, as_user_id: "reg_1" }
            - { call: "POST /abatement/assignments", payload: { project_id: "${p_id}", worker_id: "${w_sup}", role_on_site: "SUPERVISOR", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }, as: Supervisor, as_user_id: "${w_sup}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /abatement/projects/${p_id}/start-abatement", payload: {}, as: ContractorAdmin }
