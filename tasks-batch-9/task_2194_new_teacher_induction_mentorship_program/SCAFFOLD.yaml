    side_effects: ["feedback_review_status NONE->DRAFT when submit is false, or NONE/DRAFT/RETURNED->SUBMITTED when submit is true", "observation_composite_rubric_score computed", "completeness enforced only when submit is true"]
  - method: POST
    path: "/observation-cycles/{id}/feedback-review"
    description: "Return submitted feedback for revision or accept it as the documented record."
    roles: [SiteInductionLead, ProgramAdmin]
    code: 200
    input: ["decision", "return_reason?"]
    output: ObservationCycle
    side_effects: ["feedback_review_status SUBMITTED->RETURNED or SUBMITTED->ACCEPTED", "RETURN increments return_count, records return_reason and refuses a fourth return", "ACCEPT clears return_reason and unlocks the POST_CONFERENCE->DOCUMENTED phase advance without performing it"]

