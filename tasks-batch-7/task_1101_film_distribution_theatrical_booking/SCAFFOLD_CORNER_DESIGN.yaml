  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_accept_visible_in_same_response
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "All mutations are atomic in single request; POST /accept response body reflects the post-state immediately."
        test_recipe:
          setup: ["BA1 PROPOSED"]
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "D", territory: "US" }
              as: PlatformAdmin
              captures: { did: $.data.id }
            - call: "POST /distributors/${did}/films"
              payload: { title: "F", genre: "NARRATIVE", runtime_minutes: 90, rating: "R", release_pattern: "LIMITED", target_release_date: "2026-05-08T00:00:00Z", min_screens_for_wide: 0 }
              as: Booker
              captures: { fid: $.data.id }
            - call: "POST /distributors/${did}/theatres"
              payload: { name: "T", circuit: "X", market_code: "NYC", house_allowance_cents: 100 }
              as: PlatformAdmin
              captures: { tid: $.data.id }
            - call: "POST /distributors/${did}/theatres/${tid}/screens"
              payload: { auditorium_label: "A", seat_count: 100, projection_format: "DCP_2K" }
              as: PlatformAdmin
              captures: { sid: $.data.id }
            - call: "POST /distributors/${did}/booking-agreements"
              payload: { film_id: "${fid}", theatre_id: "${tid}", screen_id: "${sid}", opening_date: "2026-05-08T00:00:00Z", min_weeks_committed: 1, week_one_rental_pct: 0.60, rental_decay_per_week: 0.05, floor_pct: 0.30, per_capita_floor_cents: 100 }
              as: Booker
              captures: { baid: $.data.id, ba_v0: $.data.version }
          trigger:
            - call: "POST /distributors/${did}/booking-agreements/${baid}/accept"
              payload: { expected_booking_agreement_version: "${ba_v0}" }
              as: Exhibitor
              captures: { new_status: $.data.deal_status, new_print: $.data.print_status, new_version: $.data.version }
          assert:
            - "Response body reflects post-state immediately: deal_status == ACCEPTED"
            - "print_status == DCP_QUEUED (cascade applied in same transaction)"
            - "version == ba_v0 + 1 (incremented atomically)"

  # ===========================================================================
  # Excluded stubs — covered by §1.8
  # ===========================================================================
  - section: state_machines
    instances:
      - name: error_distributor_frozen_on_accept
        claim_type: violation_to_error
        grounds:
          - 'errors[ERR_DISTRIBUTOR_FROZEN]'
        excluded_because:
          difficulty_instance: "transitive_cascade / dispute_cascade_settlement_to_distributor_posture_to_new_booking_block"
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_kdm_window_conflict
        claim_type: violation_to_error
        grounds:
          - 'errors[ERR_KDM_WINDOW_CONFLICT]'
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / safety_vs_referential_kdm_window_over_dcp_prereq"
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_print_not_ready
        claim_type: violation_to_error
        grounds:
          - 'errors[ERR_PRINT_NOT_READY]'
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / kdm_issue_gated_on_dcp_delivery"
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_zone_clearance_conflict
        claim_type: violation_to_error
        grounds:
          - 'errors[ERR_ZONE_CLEARANCE_CONFLICT]'
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / zone_clearance_closed_interval_adjacency_conflicts"
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_film_not_bookable
        claim_type: violation_to_error
        grounds:
          - 'errors[ERR_FILM_NOT_BOOKABLE]'
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / booking_accept_gated_on_film_lifecycle"
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_screen_unavailable
        claim_type: violation_to_error
        grounds:
          - 'errors[ERR_SCREEN_UNAVAILABLE]'
        excluded_because:
          difficulty_instance: "compensating_invariant / cancel_accept_conserves_screens_committed_and_screen_status"
          rationale: "Screen state transitions are asserted in the named §1.8 instance; screen-unavailable error is a direct consequence."

      - name: error_invalid_state_already_completed_cancel
        claim_type: invalid_transition
        grounds:
          - 'errors[ERR_INVALID_STATE]'
        excluded_because:
          difficulty_instance: "non_linear_state_machine / booking_agreement_cyclic_proposed_countered_loop"
          rationale: "Terminal lockdown covered by booking_cancel_from_completed_returns_invalid_state; cycle covered in §1.8."

      - name: error_stale_version_covered_by_occ_instances
        claim_type: violation_to_error
        grounds:
          - 'errors[ERR_STALE_VERSION]'
        excluded_because:
          difficulty_instance: "cross_cutting_layers / occ_stale_version_on_counter"
          rationale: "OCC covered in §1.9 cross-cutting; §1.8's cyclic instance also asserts version increments."

      - name: error_coop_budget_exceeded
        claim_type: violation_to_error
        grounds:
          - 'errors[ERR_COOP_BUDGET_EXCEEDED]'
        excluded_because:
          difficulty_instance: "boundary_precision_check / coop_budget_cap_lte_boundary"
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_invalid_rental_terms_floor_vs_week_one
        claim_type: violation_to_error
        grounds:
          - 'errors[ERR_INVALID_RENTAL_TERMS]'
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / state_vs_fiscal_invalid_state_beats_invalid_rental_terms"
          rationale: "Asserted as the priority-loser error in the named §1.8 instance."
