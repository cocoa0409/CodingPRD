              as_user_id: "${sa_id}"
          assert:
            - "stale confirm returned HTTP 412 with error_id == ERR_STALE_VERSION"
            - "current-version confirm returns HTTP 200"
            - "Migration.${mig_id}.migration_status == CONFIRMED"

      - name: scheduled_cancel_fires_exactly_at_effective_at
        claim_type: scheduled_actions
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.Subscription.CANCEL_SCHEDULED_to_CANCELLED
        distinguishing_aspect: "Scheduled cancellation fires exactly at cancel_effective_at (2026-10-01T00:00:00Z): clock at 2026-09-30T23:59:59Z leaves it CANCEL_SCHEDULED, clock at 2026-10-01T00:00:00Z finalizes — closed boundary at effective time."
        test_recipe:
          setup: ["subscription cancelled at period end 2026-10-01; clock checked one second before, then exactly at"]
          setup_api_calls:
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DPLUS_ADS", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 799, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "cc3@x.com", full_name: "CC Three" }
              as: Anonymous
              captures: { sa_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/billing-accounts"
              payload: { biller_type: "PLATFORM", biller_reference: "platform" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { ba_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "DPLUS" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_dplus: $.data.id }
            - call: "POST /streaming/subscriptions"
              payload: { subscriber_account_id: "${sa_id}", billing_account_id: "${ba_id}", plan_code: "DPLUS_ADS", dplus_service_profile_id: "${prof_dplus}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /streaming/subscriptions/${sub_id}/cancel"
              payload: { immediate_effect: false }
              as: Subscriber
              as_user_id: "${sa_id}"
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T23:59:59Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /streaming/subscriptions/${sub_id}"
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { st_before: $.data.lifecycle_status }
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /streaming/subscriptions/${sub_id}"
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { st_after: $.data.lifecycle_status }
          assert:
            - "st_before == CANCEL_SCHEDULED"
            - "st_after == CANCELLED"

      - name: cascading_side_effects_account_close_compensation
        claim_type: cascading_side_effects
        grounds:
          - state_machines.SubscriberAccount.ACTIVE_to_CLOSED
        distinguishing_aspect: "Account close cascade: ACTIVE retention redemptions on already-terminal subscriptions are VOIDED (not EXPIRED), and VOIDED redemptions do not count toward the offer's max_redemptions cap — a redemption for the same offer on a fresh subscription of the same account lineage would succeed (verified via the count semantics)."
