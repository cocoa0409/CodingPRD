# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task 2671 — Managed Print Services Contract & Usage Billing
# 9 rule_ids / 22 instances. Every grounds ref resolves into SCAFFOLD.yaml
# §1.1-§1.7; every setup_api_calls chain starts from an empty DB.
# The logical clock's startup default is 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_statement_diverge_on_identical_reads
        grounds:
          - calculations.billing_statement_charge
          - state_machines.BillingPeriod.OPEN_to_PROVISIONAL
          - state_machines.BillingPeriod.PROVISIONAL_to_CLOSED
          - entities.BillingStatement.fields.projection_basis
          - entities.BillingPeriod.fields.provisional_total_cents
        distinguishing_aspect: |
          The billing domain's dual variant: PROVISIONAL annualises the same two ACCEPTED reads by
          period_days/elapsed_days (31/15) before tier selection, pushing MONO volume from 18000 into
          tier_index 2, so provisional_total_cents == 42624 while final_total_cents == 31125 on
          byte-identical read data, and contract.true_up_balance_cents lands at -11499.
        test_recipe:
          setup:
            - "ACTIVE contract with MONO tiers 1..20000 @9375, 20001..60000 @7333, 60001..null @6250 and COLOR tiers 1..5000 @61875, 5001..20000 @55000, 20001..null @48000"
            - "minimum_mono_pages_per_period 20000, minimum_color_pages_per_period 2000, included_service_scope BASIC"
            - "two ACTIVE colour-capable devices at a CONFIGURED site; BillingPeriod 2026-08-01 .. 2026-09-01 (31 days) still OPEN"
            - "one ACCEPTED read per device covering 2026-08-01 .. 2026-08-15 (D1 12000 mono / 900 colour, D2 6000 mono / 300 colour), logical clock at 2026-08-16 (15 elapsed days)"
          setup_api_calls:
            - call: "POST /service-contracts"
              payload: { customer_name: "Northwind Print", term_months: 36, included_service_scope: "BASIC", minimum_mono_pages_per_period: 20000, minimum_color_pages_per_period: 2000, monthly_service_fee_cents: 250000, response_sla_hours_critical: 4, response_sla_hours_standard: 24, labor_rate_cents_per_hour: 9500, early_termination_fee_cents: 480000 }
              as: AccountManager
              captures: { c1: $.data.id }
            - call: "POST /service-contracts/${c1}/cost-tiers"
              payload: { page_class: "MONO", tier_index: 1, from_page: 1, to_page: 20000, rate_micro_dollars_per_page: 9375 }
              as: AccountManager
            - call: "POST /service-contracts/${c1}/cost-tiers"
              payload: { page_class: "MONO", tier_index: 2, from_page: 20001, to_page: 60000, rate_micro_dollars_per_page: 7333 }
              as: AccountManager
            - call: "POST /service-contracts/${c1}/cost-tiers"
              payload: { page_class: "MONO", tier_index: 3, from_page: 60001, rate_micro_dollars_per_page: 6250 }
              as: AccountManager
            - call: "POST /service-contracts/${c1}/cost-tiers"
              payload: { page_class: "COLOR", tier_index: 1, from_page: 1, to_page: 5000, rate_micro_dollars_per_page: 61875 }
              as: AccountManager
            - call: "POST /service-contracts/${c1}/cost-tiers"
              payload: { page_class: "COLOR", tier_index: 2, from_page: 5001, to_page: 20000, rate_micro_dollars_per_page: 55000 }
              as: AccountManager
            - call: "POST /service-contracts/${c1}/cost-tiers"
              payload: { page_class: "COLOR", tier_index: 3, from_page: 20001, rate_micro_dollars_per_page: 48000 }
              as: AccountManager
            - call: "POST /technicians"
              payload: { full_name: "Tess Rowan", home_region: "NE-01", skill_level: "L3", travel_buffer_minutes: 30 }
              as: AccountManager
              captures: { t1: $.data.id }
            - call: "POST /sites"
              payload: { contract_id: "${c1}", name: "HQ Floor 3", address_region: "NE-01", toner_unit_cap: 4, network_vlan_tag: 2001 }
              as: AccountManager
              captures: { s1: $.data.id }
            - call: "POST /devices"
              payload: { contract_id: "${c1}", site_id: "${s1}", asset_tag: "MPS-0001", model_code: "XR-C8100", rated_monthly_duty_cycle: 20000, assessed_monthly_mono_pages: 9000, assessed_monthly_color_pages: 1200, baseline_cost_micro_dollars_per_page: 21000, baseline_overhead_cents_per_month: 4500, color_capable: true }
              as: FleetOpsController
              captures: { d1: $.data.id }
            - call: "POST /devices"
              payload: { contract_id: "${c1}", site_id: "${s1}", asset_tag: "MPS-0002", model_code: "XR-C8100", rated_monthly_duty_cycle: 20000, assessed_monthly_mono_pages: 9000, assessed_monthly_color_pages: 1200, baseline_cost_micro_dollars_per_page: 21000, baseline_overhead_cents_per_month: 4500, color_capable: true }
              as: FleetOpsController
              captures: { d2: $.data.id }
            - call: "POST /service-contracts/${c1}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /sites/${s1}/secure-release-config"
              payload: { release_method: "BADGE", probe_result: "PASS", network_vlan_tag: 2001 }
              as: CustomerAdmin
              as_user_id: "${s1}"
            - call: "POST /devices/${d1}/place"
              payload: {}
              as: FieldTechnician
              as_user_id: "${t1}"
            - call: "POST /devices/${d1}/network-integration"
              payload: {}
              as: FieldTechnician
              as_user_id: "${t1}"
            - call: "POST /devices/${d1}/activate"
              payload: {}
              as: FleetOpsController
            - call: "POST /devices/${d2}/place"
              payload: {}
              as: FieldTechnician
              as_user_id: "${t1}"
            - call: "POST /devices/${d2}/network-integration"
              payload: {}
              as: FieldTechnician
              as_user_id: "${t1}"
            - call: "POST /devices/${d2}/activate"
              payload: {}
              as: FleetOpsController
            - call: "POST /billing-periods"
              payload: { contract_id: "${c1}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: BillingAnalyst
              captures: { p1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: FleetOpsController
            - call: "POST /_agent/meter-reads"
              payload: { device_id: "${d1}", billing_period_id: "${p1}", mono_meter: 12000, color_meter: 900, toner_level_pct: 60, coverage_start: "2026-08-01T00:00:00Z", coverage_end: "2026-08-15T00:00:00Z" }
              as: FleetOpsController
              as_user_id: "ops-1"
            - call: "POST /_agent/meter-reads"
              payload: { device_id: "${d2}", billing_period_id: "${p1}", mono_meter: 6000, color_meter: 300, toner_level_pct: 60, coverage_start: "2026-08-01T00:00:00Z", coverage_end: "2026-08-15T00:00:00Z" }
              as: FleetOpsController
              as_user_id: "ops-1"
            - call: "GET /billing-periods/${p1}"
              payload: {}
              as: BillingAnalyst
              captures: { p1_v: $.data.version }
          trigger:
            - call: "POST /billing-periods/${p1}/provisional-statement"
              payload: { expected_billing_period_version: "${p1_v}" }
              as: BillingAnalyst
              captures: { st_prov: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BillingAnalyst
            - call: "POST /billing-periods/${p1}/close"
              payload: {}
              as: BillingAnalyst
              captures: { st_final: $.data.id }
          assert:
            - "BillingStatement.${st_prov}.variant == PROVISIONAL"
            - "BillingStatement.${st_prov}.projection_basis == PROJECTED"
            - "BillingStatement.${st_prov}.mono_pages_billed == 37200"
            - "BillingStatement.${st_prov}.color_pages_billed == 2480"
            - "BillingStatement.${st_prov}.mono_tier_index == 2"
            - "BillingStatement.${st_prov}.mono_rate_micro_dollars_per_page == 7333"
            - "BillingStatement.${st_prov}.color_tier_index == 1"
            - "BillingStatement.${st_prov}.usage_subtotal_cents == 42624"
            - "BillingStatement.${st_prov}.shortfall_pages == 0"
            - "BillingStatement.${st_prov}.shortfall_cents == 0"
            - "BillingStatement.${st_prov}.waste_penalty_cents == 0"
            - "BillingStatement.${st_prov}.total_cents == 42624"
            - "BillingStatement.${st_final}.variant == FINAL"
            - "BillingStatement.${st_final}.projection_basis == ACTUAL"
            - "BillingStatement.${st_final}.mono_pages_billed == 18000"
            - "BillingStatement.${st_final}.color_pages_billed == 1200"
            - "BillingStatement.${st_final}.mono_tier_index == 1"
            - "BillingStatement.${st_final}.mono_rate_micro_dollars_per_page == 9375"
            - "BillingStatement.${st_final}.usage_subtotal_cents == 24300"
            - "BillingStatement.${st_final}.shortfall_pages == 2800"
            - "BillingStatement.${st_final}.shortfall_cents == 6825"
            - "BillingStatement.${st_final}.total_cents == 31125"
            - "BillingPeriod.${p1}.provisional_total_cents == 42624"
            - "BillingPeriod.${p1}.final_total_cents == 31125"
            - "BillingPeriod.${p1}.status == CLOSED"
            - "ServiceContract.${c1}.lifetime_billed_cents == 31125"
            - "ServiceContract.${c1}.true_up_balance_cents == -11499"
            - "GET /billing-statements/${st_final}/lines returns 4 lines: (${d1}, MONO, 12000, 9375, 11250), (${d1}, COLOR, 900, 61875, 5569), (${d2}, MONO, 6000, 9375, 5625), (${d2}, COLOR, 300, 61875, 1856)"

      - name: tco_savings_assessed_vs_realized_diverge_on_same_fleet
        grounds:
          - calculations.tco_savings
          - calculations.right_sizing_classification
          - entities.QuarterlyReview.fields.baseline_savings_cents
          - entities.QuarterlyReview.fields.realized_savings_cents
          - entities.Device.fields.assessed_monthly_mono_pages
        distinguishing_aspect: |
          The fleet-TCO domain's dual variant (a different entity domain from the billing statement):
          ASSESSED prices the assessment's promised volumes (9000 mono + 1200 colour per device) against
          tier_index 1 list rates giving baseline_savings_cents == 20114, while REALIZED prices the FINAL
          statement's actual pages and actual billed cents of the last CLOSED period giving
          realized_savings_cents == 25020 on the very same two Device rows.
        test_recipe:
          setup:
            - "ACTIVE contract with a single MONO tier (1..null @9375) and a single COLOR tier (1..null @61875), minimums 20000 mono / 2000 colour, scope BASIC"
            - "two ACTIVE colour-capable devices, each assessed at 9000 mono + 1200 colour pages/month, baseline 21000 micro-dollars/page + 4500 cents/month overhead, duty cycle 20000"
            - "BillingPeriod 2026-08-01 .. 2026-09-01 CLOSED with a FINAL statement whose lines are D1 (12000 mono, 900 colour) and D2 (6000 mono, 300 colour)"
            - "logical clock at 2026-09-01T00:00:00Z"
