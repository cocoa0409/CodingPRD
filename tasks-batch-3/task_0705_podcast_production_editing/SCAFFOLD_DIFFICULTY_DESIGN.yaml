              captures: { final_overage: $.data.overage_episode_count }
          assert:
            - "Projection RetainerCycle.${cycle_id}.overage_episode_count == 1 (provisional counts ep1+ep2 PUBLISHED plus ep3 SCHEDULED = 3 eligible; included=2 -> overage 1)."
            - "After close RetainerCycle.${cycle_id}.overage_episode_count == 0 (final counts only the 2 PUBLISHED; included=2 -> overage 0)."
            - "RetainerCycle.${cycle_id}.included_consumed == 2 at close."

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_total_nonlinear_tier_discount_cap_extra_track
        grounds:
          - calculations.invoice_total
          - state_machines.Episode.SCHEDULED_to_PUBLISHED
          - entities.Invoice.fields.subtotal_cents
          - entities.Invoice.fields.discount_cents
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — base keyed on tier,
          extra_track_cents = max(0, raw_track_count - 2) * 2500, and a loyalty
          discount product that is round_half_up then min-capped at
          DISCOUNT_CAP_CENTS=5000. RUSH base 35000 + transcript 4000 + 2 extra
          tracks (4-2)*2500=5000 -> subtotal 44000; raw discount 44000*0.5=22000
          capped to 5000 -> total 39000 (cap binds, not the raw product).
        test_recipe:
          setup:
            - "Show S (PER_EPISODE) with ACTIVE RUSH/PER_EPISODE contract, loyalty_discount_pct=0.5."
            - "Episode E transcript_requested=true; published on time with raw_track_count=4."
            - "Show.lifetime_billed_cents snapshot=0 before this invoice (BRONZE tier), delivered on time so late_fee=0."
          setup_api_calls:
            - call: "POST /shows"
              payload: { title: "Rush S", format: "PANEL", billing_model: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { show_id: $.data.id }
            - call: "POST /contracts"
              payload: { show_id: "${show_id}", tier: "RUSH", engagement_type: "PER_EPISODE", loyalty_discount_pct: 0.5 }
              as: PlatformAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /engineers"
              payload: { name: "Eng I" }
              as: PlatformAdmin
              captures: { eng_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /episodes"
              payload: { show_id: "${show_id}", contract_id: "${contract_id}", title: "Ep I", planned_track_count: 4, transcript_requested: true }
              as: ShowOwner
              as_user_id: "${show_id}"
              captures: { ep_id: $.data.id }
            - call: "POST /sessions"
              payload: { episode_id: "${ep_id}", engineer_id: "${eng_id}", capture_mode: "STUDIO", scheduled_start_utc: "2026-03-02T08:00:00Z", scheduled_end_utc: "2026-03-02T10:00:00Z" }
              as: ProducerEng
              as_user_id: "${eng_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /sessions/${sess_id}/start"
              payload: {}
              as: ProducerEng
              as_user_id: "${eng_id}"
            - call: "POST /sessions/${sess_id}/complete"
              payload: {}
              as: ProducerEng
              as_user_id: "${eng_id}"
            - call: "POST /episodes/${ep_id}/lock-assets"
              payload: { raw_track_count: 4 }
              as: ProducerEng
              as_user_id: "${eng_id}"
            - call: "POST /deliverables"
              payload: { episode_id: "${ep_id}", kind: "MASTER_AUDIO" }
              as: ProducerEng
              as_user_id: "${eng_id}"
              captures: { dm_id: $.data.id }
            - call: "POST /asset-versions"
              payload: { deliverable_id: "${dm_id}", integrated_loudness_lufs: -16.0 }
              as: ProducerEng
              as_user_id: "${eng_id}"
              captures: { avm_id: $.data.id }
            - call: "POST /asset-versions/${avm_id}/accept"
              payload: {}
              as: ProducerEng
              as_user_id: "${eng_id}"
            - call: "POST /deliverables"
              payload: { episode_id: "${ep_id}", kind: "TRANSCRIPT" }
              as: ProducerEng
              as_user_id: "${eng_id}"
              captures: { dt_id: $.data.id }
            - call: "POST /asset-versions"
              payload: { deliverable_id: "${dt_id}" }
              as: ProducerEng
              as_user_id: "${eng_id}"
              captures: { avt_id: $.data.id }
            - call: "POST /asset-versions/${avt_id}/accept"
              payload: {}
              as: ProducerEng
              as_user_id: "${eng_id}"
            - call: "POST /episodes/${ep_id}/submit-edit"
              payload: {}
              as: ProducerEng
              as_user_id: "${eng_id}"
            - call: "POST /episodes/${ep_id}/approve-edit"
              payload: {}
              as: ShowOwner
              as_user_id: "${show_id}"
            - call: "POST /episodes/${ep_id}/schedule"
              payload: {}
              as: ProducerEng
              as_user_id: "${eng_id}"
          trigger:
            - call: "POST /episodes/${ep_id}/publish"
              payload: {}
              as: ProducerEng
              as_user_id: "${eng_id}"
            - call: "GET /invoices"
              payload: { episode_id: "${ep_id}" }
              as: PlatformAdmin
              captures: { inv_total: "$.data[0].total_cents" }
          assert:
            - "The issued Invoice for Episode.${ep_id} has subtotal_cents == 44000 (RUSH base 35000 + transcript 4000 + (4-2)*2500 extra-track 5000)."
            - "Invoice.discount_cents == 5000 (raw 44000*0.5=22000 round_half_up, then min-capped at DISCOUNT_CAP_CENTS=5000)."
            - "Invoice.late_fee_cents == 0 and Invoice.total_cents == 39000 (44000 - 5000 + 0)."

      - name: ad_revenue_split_round_per_slot_then_sum_order
        grounds:
          - calculations.ad_revenue_split
          - state_machines.AdCampaign.APPROVED_to_RECONCILED
          - entities.AdCampaign.fields.show_payout_cents
          - entities.AdCampaign.fields.platform_take_cents
          - entities.AdSlot.fields.gross_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Two slots gross 105 each,
          platform_fee_pct 0.30 (keep 0.70): round_half_up per slot = round(73.5)=74
          each, summed = 148 (show_payout_cents); sum-then-round would give
          round(210*0.70)=147. The pinned per-slot-then-sum order produces 148, a
          1-cent divergence from the forbidden sum-then-round order.
        test_recipe:
          setup:
            - "Show S with two PUBLISHED episodes EA, EB."
