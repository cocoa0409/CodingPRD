# =============================================================================
# Task 1851: Land Development & Lot Takedown — Scaffold (seed tables)
# =============================================================================

scenario: |
  1851. Land Development & Lot Takedown (residential land developer): parcel
  acquisition & entitlement contingency period, engineering/plat approval &
  phasing plan, infrastructure cost estimate & bonding requirement, builder
  takedown agreement with lot schedule & price escalators, development loan
  draw & release of lots from lien, HOA formation & declarant control period,
  impact fee & utility connection scheduling, absorption forecast & phase timing

domain_name: land-development-lot-takedown
api_prefix: /api

complexity_profile:
  primary_archetype: quota / allocation        # lots are finite recorded inventory allocated via takedown agreements; loan draws allocate a finite commitment
  secondary_archetype: pricing engine          # escalator + cap + volume-tier lot pricing
  complexity_layers:
    - optimistic_concurrency                   # OCC on TakedownAgreement.version and Parcel.version
    - cascading_side_effects                   # closing finalize and declare-default cascades
    - rate_threshold_triggers                  # HOA 75% transfer, agreement auto-complete, loan paid-off-at-zero
    - derived_field_reconciliation             # parcel lot counts / absorption fields recomputed on every mutation
  entity_topology: flat                        # peer entities with FK references, flat URLs under /api
  state_machine_shape: cyclic                  # agreement default/cure loop; plat review loop; Lot carries parallel sales x lien dimensions
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties            # draw requester != draw approver; clerk certifies, developer posts
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Parcel
    parent: null
    common_fields: true
    fields:
      - { name: parcel_name, type: string, source: input, description: "Development parcel name" }
      - { name: county, type: string, source: input, description: "County the parcel sits in" }
      - { name: earnest_money_cents, type: integer, source: input, description: "Earnest money deposit in cents (>= 0)" }
      - { name: planned_sellout_months, type: integer, source: input, default: 24, description: "Planned months to sell out; drives straight-line absorption pace" }
      - { name: absorption_method, type: enum, source: input, default: STRAIGHT_LINE, description: "STRAIGHT_LINE | TRAILING_WEIGHTED — selects which pace variant feeds projections", constraints: "enum {STRAIGHT_LINE, TRAILING_WEIGHTED}" }
      - { name: status, type: enum, source: system, description: "DRAFT | CONTINGENCY_ACTIVE | ACQUIRED | TERMINATED | SOLD_OUT" }
      - { name: contingency_end_date, type: datetime, source: system, description: "Entitlement contingency deadline (inclusive); set by open-contingency, moved by extend-contingency" }
      - { name: acquisition_close_date, type: datetime, source: system, description: "Set when parcel reaches ACQUIRED; null otherwise" }
      - { name: earnest_money_refunded, type: boolean, source: system, default: false, description: "true only when contingency terminated in-period; false on auto-expiry" }
      - { name: total_lots_planned, type: integer, source: computed, default: 0, description: "Sum of recorded lots across all phases (lots exist only after plat recordation)" }
      - { name: lots_closed_count, type: integer, source: computed, default: 0, description: "Count of lots with sales_status = CLOSED across the parcel" }
      - { name: lots_available_count, type: integer, source: computed, default: 0, description: "Count of lots with sales_status = PLATTED across the parcel" }
      - { name: closed_pct, type: number, source: computed, default: 0, description: "round(100 * lots_closed_count / total_lots_planned, 2); 0 when total_lots_planned = 0" }
      - { name: straight_line_pace_pm, type: number, source: computed, default: 0, description: "total_lots_planned / planned_sellout_months, rounded 4dp round_half_up; 0 when planned_sellout_months = 0" }
      - { name: trailing_weighted_pace_pm, type: number, source: computed, default: 0, description: "0.5*C1 + 0.3*C2 + 0.2*C3 over trailing 30-day closing windows (see calculation absorption_pace), rounded 4dp round_half_up" }
      - { name: selected_pace_pm, type: number, source: computed, default: 0, description: "straight_line_pace_pm when absorption_method = STRAIGHT_LINE else trailing_weighted_pace_pm" }
      - { name: projected_months_to_sellout, type: number, source: computed, description: "round((total_lots_planned - lots_closed_count) / selected_pace_pm, 1) when selected_pace_pm > 0; null otherwise" }
      - { name: next_phase_release_eligible, type: boolean, source: computed, default: false, description: "true iff projected_months_to_sellout is not null and <= 6 (PHASE_LEAD_MONTHS)" }

  - name: Phase
    parent: null
    common_fields: true
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id; owning parcel" }
      - { name: phase_name, type: string, source: input, description: "Phase name" }
      - { name: sequence_number, type: integer, source: input, description: "Phase order within the parcel (>= 1)" }
      - { name: planned_lot_count, type: integer, source: input, description: "Lots planned for this phase (>= 1)" }
      - { name: selling_window_start, type: datetime, source: input, description: "Planned selling window start (half-open interval start)" }
      - { name: selling_window_end, type: datetime, source: input, description: "Planned selling window end (exclusive); must be > selling_window_start" }
      - { name: plat_lot_count, type: integer, source: system, description: "Lot count on the current plat submission; set by submit-plat" }
      - { name: lot_type, type: enum, source: system, description: "STANDARD | PREMIUM | ESTATE — lot type carried by the current plat submission; copied to generated lots" }
      - { name: plat_revision, type: integer, source: system, default: 0, description: "1 after first submit-plat; +1 on every resubmission from PLAT_REJECTED" }
      - { name: plat_rejection_reason, type: string, source: system, description: "Reason recorded on last REJECT review; null otherwise" }
      - { name: recorded_at, type: datetime, source: system, description: "Timestamp of plat recordation; null until PLAT_RECORDED" }
      - { name: recorded_lot_count, type: integer, source: computed, default: 0, description: "Count of Lot rows belonging to this phase" }
      - { name: status, type: enum, source: system, description: "PLANNED | PLAT_SUBMITTED | PLAT_REJECTED | PLAT_APPROVED | PLAT_RECORDED | ACTIVE | SELLOUT" }

  - name: InfrastructureBond
    parent: null
    common_fields: true
    fields:
      - { name: phase_id, type: string, source: input, description: "FK -> Phase.id; phase this bond covers" }
      - { name: engineer_estimate_cents, type: integer, source: input, description: "Engineer's infrastructure cost estimate (>= 1)" }
      - { name: awarded_bid_cents, type: integer, source: system, description: "Awarded bid amount; set by award-bid; null while ESTIMATED" }
      - { name: required_bond_cents, type: integer, source: computed, description: "Provisional variant: round_half_up(engineer_estimate_cents * 1.10) while ESTIMATED; Final variant: round_half_up(awarded_bid_cents * 1.10) from BID_FINAL onward" }
      - { name: posted_bond_cents, type: integer, source: system, default: 0, description: "Bond amount currently posted; reduced by reduce; zeroed by release" }
      - { name: work_accepted, type: boolean, source: system, default: false, description: "Set true by accept-work (MunicipalClerk); required for release" }
      - { name: status, type: enum, source: system, description: "ESTIMATED | BID_FINAL | POSTED | PARTIALLY_REDUCED | WORK_ACCEPTED | RELEASED" }

  - name: Builder
    parent: null
    common_fields: true
    fields:
      - { name: builder_name, type: string, source: input, description: "Homebuilder company name" }
      - { name: license_number, type: string, source: input, description: "State contractor license number; unique across builders" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }

  - name: TakedownAgreement
    parent: null
    common_fields: true
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id; parcel whose lots are taken down" }
      - { name: builder_id, type: string, source: input, description: "FK -> Builder.id; builder party to the agreement" }
      - { name: effective_date, type: datetime, source: input, description: "Escalator and default-schedule clock start" }
      - { name: base_lot_price_cents, type: integer, source: input, description: "Base price per lot in cents (>= 1)" }
      - { name: escalator_rate_bp_per_quarter, type: integer, source: input, description: "Compound quarterly escalator in basis points (>= 0)" }
      - { name: price_cap_bp, type: integer, source: input, description: "Price cap as basis points of base price (>= 10000)" }
      - { name: min_lots_per_quarter, type: integer, source: input, description: "Scheduled takedown commitment per completed quarter (>= 1)" }
      - { name: scheduled_lot_count, type: integer, source: input, description: "Total lots committed under this agreement (>= 1)" }
      - { name: closed_lot_count, type: integer, source: computed, default: 0, description: "Closings finalized under this agreement" }
      - { name: default_reason, type: string, source: system, description: "Reason recorded at declare-default; cleared on cure" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | DEFAULTED | COMPLETED | TERMINATED" }

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - { name: phase_id, type: string, source: system, description: "FK -> Phase.id; phase this lot was recorded under (set at plat recordation)" }
      - { name: lot_number, type: integer, source: system, description: "1..N sequence assigned at plat recordation" }
      - { name: lot_type, type: enum, source: system, description: "STANDARD | PREMIUM | ESTATE — copied from the phase's recorded plat" }
      - { name: sales_status, type: enum, source: system, description: "PLATTED | RESERVED | UNDER_CONTRACT | CLOSED — independent dimension 1" }
      - { name: lien_status, type: enum, source: system, description: "ENCUMBERED | RELEASE_PENDING | RELEASED — independent dimension 2" }
      - { name: reserved_agreement_id, type: string, source: system, description: "FK -> TakedownAgreement.id; agreement holding the reservation; null when PLATTED" }

  - name: LotClosing
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; lot being closed" }
      - { name: agreement_id, type: string, source: input, description: "FK -> TakedownAgreement.id; agreement this closing performs under" }
      - { name: loan_id, type: string, source: system, description: "FK -> DevelopmentLoan.id; the parcel's ACTIVE loan selected at creation" }
      - { name: contract_price_cents, type: integer, source: computed, description: "Lot price per calculation lot_current_price at creation time" }
      - { name: release_price_cents, type: integer, source: computed, description: "round_half_up(contract_price_cents * loan.release_price_floor_bp / 10000) at creation time" }
      - { name: payment_applied_cents, type: integer, source: computed, default: 0, description: "min(release_price_cents, loan.outstanding_balance_cents) applied at finalize; 0 until CLOSED" }
      - { name: finalized_at, type: datetime, source: system, description: "Timestamp of finalize; null until CLOSED" }
      - { name: status, type: enum, source: system, description: "PENDING | CLOSED | CANCELLED" }

  - name: DevelopmentLoan
    parent: null
    common_fields: true
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id; parcel securing this loan" }
      - { name: commitment_amount_cents, type: integer, source: input, description: "Total loan commitment in cents (>= 1)" }
      - { name: release_price_floor_bp, type: integer, source: input, description: "Lot lien release price as basis points of contract price (1..10000)" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "sum(net_disbursed_cents of FUNDED draws) - sum(payment_applied_cents of CLOSED closings); never negative (payments clamped)" }
      - { name: total_drawn_cents, type: integer, source: computed, default: 0, description: "sum(net_disbursed_cents of draws currently FUNDED)" }
      - { name: total_release_paid_cents, type: integer, source: computed, default: 0, description: "sum(payment_applied_cents of CLOSED closings against this loan)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | PAID_OFF" }

  - name: LoanDraw
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> DevelopmentLoan.id; loan drawn against" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of the DeveloperOperator who created the draw; segregation-of-duties anchor" }
      - { name: line_items, type: array, source: input, description: "Array of {description, amount_cents}; amount_cents integer >= 1; array length >= 1" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "Sum of line_items[*].amount_cents (integer cents — no rounding at this step)" }
      - { name: retainage_cents, type: integer, source: computed, description: "round_half_up(gross_amount_cents * 500 / 10000) — rounding step 1" }
      - { name: draw_fee_cents, type: integer, source: computed, description: "round_half_up((gross_amount_cents - retainage_cents) * 50 / 10000) — rounding step 2, computed on the post-retainage base" }
      - { name: net_disbursed_cents, type: integer, source: computed, description: "gross_amount_cents - retainage_cents - draw_fee_cents" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approving LenderOfficer; null until APPROVED" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | REJECTED | FUNDED | REVERSED" }

  - name: HOAAssociation
    parent: null
    common_fields: true
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id; parcel the HOA governs" }
      - { name: hoa_name, type: string, source: input, description: "Association legal name" }
      - { name: control_transfer_pct_bp, type: integer, source: input, default: 7500, description: "Declarant control ends when closed-lot ratio reaches this basis-point threshold (default 75%)" }
      - { name: statutory_control_end, type: datetime, source: input, description: "Statutory sunset: control may transfer when current time passes this date regardless of sales" }
      - { name: board_seated_count, type: integer, source: system, description: "Seated homeowner board members recorded at complete-transition; null until then" }
      - { name: status, type: enum, source: system, description: "FORMATION_PENDING | DECLARANT_CONTROL | TRANSITIONING | HOMEOWNER_CONTROL" }

  - name: UtilityProvider
    parent: null
    common_fields: true
    fields:
      - { name: provider_name, type: string, source: input, description: "Utility provider / district name; unique" }
      - { name: utility_type, type: enum, source: input, description: "WATER | SEWER | ELECTRIC", constraints: "enum {WATER, SEWER, ELECTRIC}" }
      - { name: max_connections_per_day, type: integer, source: input, description: "Daily connection scheduling capacity (>= 1)" }

  - name: UtilityConnection
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; lot to connect" }
      - { name: provider_id, type: string, source: input, description: "FK -> UtilityProvider.id; provider performing the connection" }
      - { name: scheduled_date, type: datetime, source: input, description: "Requested connection date; capacity-counted by calendar day" }
      - { name: impact_fee_cents, type: integer, source: computed, description: "Per calculation impact_fee_amount at creation time" }
      - { name: status, type: enum, source: system, description: "REQUESTED | SCHEDULED | CONNECTED | CANCELLED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Parcel
    initial_state: DRAFT
    terminal_states: [TERMINATED, SOLD_OUT]
    transitions:
      - from: DRAFT
        to: CONTINGENCY_ACTIVE
        trigger: "POST /api/parcels/{id}/open-contingency"
        actor: DeveloperOperator
        preconditions:
          - "contingency_end_date strictly after current clock (ERR_INVALID_REQUEST otherwise)"
        side_effects:
          - "contingency_end_date set; increments Parcel.version by 1"
      - from: CONTINGENCY_ACTIVE
        to: CONTINGENCY_ACTIVE
        trigger: "POST /api/parcels/{id}/extend-contingency"
        actor: DeveloperOperator
        preconditions:
          - "expected_parcel_version == Parcel.version (ERR_STALE_PARCEL_VERSION)"
          - "new_contingency_end_date > current contingency_end_date (ERR_INVALID_CONTINGENCY_EXTENSION)"
        side_effects:
          - "contingency_end_date = new_contingency_end_date; increments Parcel.version by 1"
        note: "Self-loop extension; OCC-guarded supersede of the deadline"
      - from: CONTINGENCY_ACTIVE
        to: ACQUIRED
        trigger: "POST /api/parcels/{id}/clear-contingency"
        actor: DeveloperOperator
        preconditions:
          - "current clock <= contingency_end_date, inclusive (ERR_CONTINGENCY_EXPIRED)"
        side_effects:
          - "acquisition_close_date = current clock; increments Parcel.version by 1"
      - from: CONTINGENCY_ACTIVE
        to: TERMINATED
        trigger: "POST /api/parcels/{id}/terminate-contingency"
        actor: DeveloperOperator
        preconditions:
          - "current clock <= contingency_end_date, inclusive (ERR_PARCEL_INVALID_STATE once auto-expired)"
        side_effects:
          - "earnest_money_refunded = true; increments Parcel.version by 1"
      - from: CONTINGENCY_ACTIVE
        to: TERMINATED
        trigger: "system (automatic on POST /api/_clock/set_current_utc advancing the clock past contingency_end_date)"
        actor: system
        preconditions:
          - "new clock value > contingency_end_date (strictly past the inclusive deadline)"
        side_effects:
          - "earnest_money_refunded = false (deposit forfeited on expiry); increments Parcel.version by 1"
      - from: ACQUIRED
        to: SOLD_OUT
        trigger: "system (automatic on LotClosing finalize when every recorded lot of the parcel is CLOSED)"
        actor: system
        preconditions:
          - "total_lots_planned > 0 AND lots_closed_count == total_lots_planned"
        side_effects:
          - "increments Parcel.version by 1"

  - entity: Phase
    initial_state: PLANNED
    terminal_states: [SELLOUT]
    transitions:
      - from: PLANNED
        to: PLAT_SUBMITTED
        trigger: "POST /api/phases/{id}/submit-plat"
        actor: DeveloperOperator
        preconditions: []
        side_effects:
          - "plat_lot_count and lot_type set from input; plat_revision = 1; increments Phase.version by 1"
      - from: PLAT_REJECTED
        to: PLAT_SUBMITTED
        trigger: "POST /api/phases/{id}/submit-plat"
        actor: DeveloperOperator
        preconditions: []
        side_effects:
          - "plat_lot_count and lot_type replaced; plat_revision += 1; plat_rejection_reason = null; increments Phase.version by 1"
        note: "Revision loop: rejected plats are resubmitted, not recreated"
      - from: PLAT_SUBMITTED
        to: PLAT_APPROVED
        trigger: "POST /api/phases/{id}/review-plat with decision = APPROVE"
        actor: MunicipalClerk
        preconditions: []
        side_effects: ["increments Phase.version by 1"]
      - from: PLAT_SUBMITTED
        to: PLAT_REJECTED
        trigger: "POST /api/phases/{id}/review-plat with decision = REJECT"
        actor: MunicipalClerk
        preconditions:
          - "rejection_reason input must be present and non-empty when decision = REJECT (ERR_INVALID_REQUEST)"
        side_effects:
          - "plat_rejection_reason = rejection_reason; increments Phase.version by 1"
      - from: PLAT_APPROVED
        to: PLAT_RECORDED
        trigger: "POST /api/phases/{id}/record-plat"
        actor: MunicipalClerk
        preconditions: []
        side_effects:
          - "Generates plat_lot_count Lot rows: lot_number 1..plat_lot_count, lot_type copied from phase, sales_status = PLATTED, lien_status = ENCUMBERED"
          - "recorded_at = current clock; recorded_lot_count recomputed"
          - "Parcel derived fields recompute (total_lots_planned, lots_available_count, paces, projected_months_to_sellout, next_phase_release_eligible); increments Parcel.version by 1"
          - "increments Phase.version by 1"
      - from: PLAT_RECORDED
        to: ACTIVE
        trigger: "POST /api/phases/{id}/activate"
        actor: DeveloperOperator
        preconditions:
          - "Parcel (phase.parcel_id) status == ACQUIRED (ERR_PARCEL_NOT_ACQUIRED)"
          - "An InfrastructureBond with phase_id == this phase exists with status in {POSTED, PARTIALLY_REDUCED, WORK_ACCEPTED} (ERR_BOND_NOT_POSTED_FOR_PHASE)"
        side_effects: ["increments Phase.version by 1"]
      - from: ACTIVE
        to: SELLOUT
        trigger: "system (automatic on LotClosing finalize when all of the phase's lots are CLOSED)"
        actor: system
        preconditions:
          - "recorded_lot_count > 0 AND every Lot with phase_id == this phase has sales_status == CLOSED"
        side_effects: ["increments Phase.version by 1"]

  - entity: InfrastructureBond
    initial_state: ESTIMATED
    terminal_states: [RELEASED]
    transitions:
      - from: ESTIMATED
        to: BID_FINAL
        trigger: "POST /api/infrastructure-bonds/{id}/award-bid"
        actor: DeveloperOperator
        preconditions: []
        side_effects:
          - "awarded_bid_cents set; required_bond_cents recomputed on the FINAL basis (110% of awarded bid); increments InfrastructureBond.version by 1"
      - from: BID_FINAL
        to: POSTED
        trigger: "POST /api/infrastructure-bonds/{id}/post-bond"
        actor: DeveloperOperator
        preconditions:
          - "posted_amount_cents >= required_bond_cents, inclusive (ERR_INSUFFICIENT_BOND_POSTED)"
        side_effects:
          - "posted_bond_cents = posted_amount_cents; increments InfrastructureBond.version by 1"
      - from: POSTED
        to: PARTIALLY_REDUCED
        trigger: "POST /api/infrastructure-bonds/{id}/reduce"
        actor: DeveloperOperator
        preconditions:
          - "The parcel's ACTIVE DevelopmentLoan (exactly one per selector loan_selector_for_parcel) has outstanding_balance_cents <= commitment_amount_cents * 5000 / 10000, inclusive"
          - "posted_bond_cents - reduction_amount_cents >= round_half_up(required_bond_cents * 5000 / 10000), inclusive"
          - "reduction_amount_cents >= 1"
          - "Any violation -> ERR_BOND_REDUCTION_NOT_ELIGIBLE"
        side_effects:
          - "posted_bond_cents -= reduction_amount_cents; increments InfrastructureBond.version by 1"
      - from: POSTED
        to: WORK_ACCEPTED
        trigger: "POST /api/infrastructure-bonds/{id}/accept-work"
        actor: MunicipalClerk
        preconditions: []
        side_effects:
          - "work_accepted = true; increments InfrastructureBond.version by 1"
        note: "Segregation of duties: the clerk certifies acceptance; only the developer may post/reduce/release"
      - from: PARTIALLY_REDUCED
        to: WORK_ACCEPTED
        trigger: "POST /api/infrastructure-bonds/{id}/accept-work"
        actor: MunicipalClerk
        preconditions: []
        side_effects:
          - "work_accepted = true; increments InfrastructureBond.version by 1"
      - from: WORK_ACCEPTED
        to: RELEASED
        trigger: "POST /api/infrastructure-bonds/{id}/release"
        actor: DeveloperOperator
        preconditions: []
        side_effects:
          - "posted_bond_cents = 0; increments InfrastructureBond.version by 1"

  - entity: TakedownAgreement
    initial_state: DRAFT
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/takedown-agreements/{id}/activate"
        actor: DeveloperOperator
        preconditions:
          - "Parcel (agreement.parcel_id) status == ACQUIRED (ERR_PARCEL_NOT_ACQUIRED)"
        side_effects: ["increments TakedownAgreement.version by 1"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /api/takedown-agreements/{id}/amend"
        actor: DeveloperOperator | BuilderRep (own agreement only)
        preconditions:
          - "expected_agreement_version == TakedownAgreement.version (ERR_STALE_AGREEMENT_VERSION)"
        side_effects:
          - "Provided fields (base_lot_price_cents, escalator_rate_bp_per_quarter, price_cap_bp, min_lots_per_quarter) replaced; increments TakedownAgreement.version by 1"
        note: "Self-loop amendment; OCC-guarded supersede of pricing terms"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /api/takedown-agreements/{id}/declare-default"
        actor: DeveloperOperator
        preconditions:
          - "closed_lot_count < quarters_elapsed(effective_date, current clock) * min_lots_per_quarter (ERR_AGREEMENT_NOT_BEHIND_SCHEDULE)"
        side_effects:
          - "default_reason = input reason"
          - "CASCADE link 1: every PENDING LotClosing whose lot is reserved under this agreement -> CANCELLED; each cancellation reverts that lot's lien_status RELEASE_PENDING -> ENCUMBERED and sales_status UNDER_CONTRACT -> RESERVED (CASCADE link 2 per lot)"
          - "CASCADE link 3: every lot with reserved_agreement_id == this agreement and sales_status == RESERVED -> PLATTED, reserved_agreement_id = null"
          - "CASCADE link 4: Parcel derived fields recompute (lots_available_count, closed_pct, paces, projected_months_to_sellout, next_phase_release_eligible); increments Parcel.version by 1"
          - "increments TakedownAgreement.version by 1"
      - from: DEFAULTED
        to: ACTIVE
        trigger: "POST /api/takedown-agreements/{id}/cure"
        actor: DeveloperOperator
        preconditions: []
        side_effects:
          - "default_reason = null; increments TakedownAgreement.version by 1"
        note: "Cycle: released lots are NOT re-reserved; the builder must reserve anew"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/takedown-agreements/{id}/terminate"
        actor: DeveloperOperator
        preconditions: []
        side_effects:
          - "Same lot-release cascade as declare-default links 1-4; increments TakedownAgreement.version by 1"
      - from: DEFAULTED
        to: TERMINATED
        trigger: "POST /api/takedown-agreements/{id}/terminate"
        actor: DeveloperOperator
        preconditions: []
        side_effects:
          - "Same lot-release cascade as declare-default links 1-4; increments TakedownAgreement.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (automatic on LotClosing finalize when closed_lot_count reaches scheduled_lot_count)"
        actor: system
        preconditions:
          - "closed_lot_count >= scheduled_lot_count after increment (boundary: == triggers)"
        side_effects: ["increments TakedownAgreement.version by 1"]

  - entity: Lot
    initial_state: PLATTED (sales) / ENCUMBERED (lien)
    terminal_states: [CLOSED (sales) / RELEASED (lien)]
    transitions:
      - from: "sales: PLATTED"
        to: "sales: RESERVED"
        trigger: "POST /api/lots/{id}/reserve"
        actor: BuilderRep (own agreement only)
        preconditions:
          - "TakedownAgreement status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
          - "Phase (lot.phase_id) status == ACTIVE (ERR_PHASE_INVALID_STATE)"
          - "agreement.parcel_id == phase.parcel_id of this lot (ERR_AGREEMENT_PARCEL_MISMATCH)"
        side_effects:
          - "reserved_agreement_id = agreement_id; Parcel.lots_available_count recomputes (-1); increments Lot.version by 1 and Parcel.version by 1"
      - from: "sales: RESERVED"
        to: "sales: UNDER_CONTRACT"
        trigger: "system (on POST /api/lot-closings creation)"
        actor: system
        preconditions:
          - "lot.reserved_agreement_id == closing.agreement_id (ERR_LOT_NOT_RESERVED_BY_AGREEMENT)"
        side_effects: ["increments Lot.version by 1"]
      - from: "sales: UNDER_CONTRACT"
        to: "sales: CLOSED"
        trigger: "system (on LotClosing finalize)"
        actor: system
        preconditions: []
        side_effects: ["increments Lot.version by 1"]
      - from: "sales: UNDER_CONTRACT"
        to: "sales: RESERVED"
        trigger: "system (on direct LotClosing cancel; reservation stands)"
        actor: system
        preconditions: []
        side_effects: ["increments Lot.version by 1"]
      - from: "sales: RESERVED"
        to: "sales: PLATTED"
        trigger: "system (agreement declare-default / terminate cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "reserved_agreement_id = null; Parcel.lots_available_count recomputes (+1); increments Lot.version by 1"
      - from: "sales: UNDER_CONTRACT"
        to: "sales: PLATTED"
        trigger: "system (agreement declare-default / terminate cascade, via the closing cancellation hop)"
        actor: system
        preconditions: []
        side_effects:
          - "reserved_agreement_id = null; Parcel.lots_available_count recomputes (+1); increments Lot.version by 1"
      - from: "lien: ENCUMBERED"
        to: "lien: RELEASE_PENDING"
        trigger: "system (on POST /api/lot-closings creation)"
        actor: system
        preconditions: []
        side_effects: ["increments Lot.version by 1"]
      - from: "lien: RELEASE_PENDING"
        to: "lien: RELEASED"
        trigger: "system (on LotClosing finalize — lender releases the lot from the loan lien)"
        actor: system
        preconditions: []
        side_effects: ["increments Lot.version by 1"]
      - from: "lien: RELEASE_PENDING"
        to: "lien: ENCUMBERED"
        trigger: "system (on LotClosing cancel, direct or cascaded)"
        actor: system
        preconditions: []
        side_effects: ["increments Lot.version by 1"]
    note: "Two parallel state dimensions on one entity: sales_status and lien_status evolve independently but share triggers"

  - entity: LotClosing
    initial_state: PENDING
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PENDING
        to: CLOSED
        trigger: "POST /api/lot-closings/{id}/finalize"
        actor: LenderOfficer
        preconditions: []
        side_effects:
          - "CASCADE link 1: lot.sales_status UNDER_CONTRACT -> CLOSED; lot.lien_status RELEASE_PENDING -> RELEASED; finalized_at = current clock"
          - "CASCADE link 2 (from lot CLOSED): agreement.closed_lot_count += 1; if closed_lot_count >= scheduled_lot_count then agreement ACTIVE -> COMPLETED"
          - "CASCADE link 3 (from lien RELEASED): payment_applied_cents = min(release_price_cents, loan.outstanding_balance_cents); loan.outstanding_balance_cents -= payment_applied_cents; loan.total_release_paid_cents += payment_applied_cents; increments DevelopmentLoan.version by 1"
          - "CASCADE link 4 (from balance change): if loan.outstanding_balance_cents == 0 AND loan.total_drawn_cents > 0 then loan ACTIVE -> PAID_OFF"
          - "CASCADE link 5 (from lot CLOSED): Parcel derived fields recompute (lots_closed_count, lots_available_count, closed_pct, paces, projected_months_to_sellout, next_phase_release_eligible); increments Parcel.version by 1"
          - "CASCADE link 6 (from parcel recompute): if the phase's lots are all CLOSED then phase ACTIVE -> SELLOUT; if the parcel's lots are all CLOSED and total_lots_planned > 0 then parcel ACQUIRED -> SOLD_OUT"
          - "CASCADE link 7 (from parcel closed_pct change): each HOAAssociation of this parcel in DECLARANT_CONTROL with lots_closed_count * 10000 >= total_lots_planned * control_transfer_pct_bp auto-transitions to TRANSITIONING"
          - "increments LotClosing.version by 1"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /api/lot-closings/{id}/cancel"
        actor: BuilderRep (own agreement) | DeveloperOperator
        preconditions: []
        side_effects:
          - "lot.sales_status UNDER_CONTRACT -> RESERVED; lot.lien_status RELEASE_PENDING -> ENCUMBERED; increments LotClosing.version by 1"

  - entity: DevelopmentLoan
    initial_state: DRAFT
    terminal_states: [PAID_OFF]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/development-loans/{id}/activate"
        actor: DeveloperOperator
        preconditions:
          - "Parcel (loan.parcel_id) status == ACQUIRED (ERR_PARCEL_NOT_ACQUIRED)"
        side_effects: ["increments DevelopmentLoan.version by 1"]
      - from: ACTIVE
        to: PAID_OFF
        trigger: "system (automatic on LotClosing finalize when balance reaches zero)"
        actor: system
        preconditions:
          - "outstanding_balance_cents == 0 AND total_drawn_cents > 0"
        side_effects: ["increments DevelopmentLoan.version by 1"]

  - entity: LoanDraw
    initial_state: REQUESTED
    terminal_states: [REJECTED, REVERSED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /api/loan-draws/{id}/approve"
        actor: LenderOfficer
        preconditions:
          - "X-User-ID != draw.requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "approved_by_user_id = X-User-ID; increments LoanDraw.version by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /api/loan-draws/{id}/reject"
        actor: LenderOfficer
        preconditions: []
        side_effects: ["increments LoanDraw.version by 1"]
      - from: APPROVED
        to: FUNDED
        trigger: "POST /api/loan-draws/{id}/fund"
        actor: LenderOfficer
        preconditions:
          - "DevelopmentLoan (draw.loan_id) status == ACTIVE (ERR_LOAN_NOT_ACTIVE)"
        side_effects:
          - "loan.outstanding_balance_cents += net_disbursed_cents; loan.total_drawn_cents += net_disbursed_cents; increments DevelopmentLoan.version by 1 and LoanDraw.version by 1"
      - from: FUNDED
        to: REVERSED
        trigger: "POST /api/loan-draws/{id}/reverse"
        actor: LenderOfficer
        preconditions: []
        side_effects:
          - "loan.outstanding_balance_cents -= net_disbursed_cents; loan.total_drawn_cents -= net_disbursed_cents; increments DevelopmentLoan.version by 1 and LoanDraw.version by 1"
        note: "Compensating action: fund + reverse must leave loan balances unchanged (invariant loan_balance_conservation)"

  - entity: HOAAssociation
    initial_state: FORMATION_PENDING
    terminal_states: [HOMEOWNER_CONTROL]
    transitions:
      - from: FORMATION_PENDING
        to: DECLARANT_CONTROL
        trigger: "POST /api/hoa-associations/{id}/form"
        actor: DeveloperOperator
        preconditions:
          - "Parcel (hoa.parcel_id) status == ACQUIRED (ERR_PARCEL_NOT_ACQUIRED)"
        side_effects: ["increments HOAAssociation.version by 1"]
      - from: DECLARANT_CONTROL
        to: TRANSITIONING
        trigger: "POST /api/hoa-associations/{id}/evaluate-control"
        actor: DeveloperOperator | HOAManager (own association only)
        preconditions:
          - "lots_closed_count * 10000 >= total_lots_planned * control_transfer_pct_bp (inclusive; integer cross-multiplication, no floats) OR current clock > statutory_control_end; otherwise ERR_CONTROL_THRESHOLD_NOT_MET"
          - "total_lots_planned > 0 for the ratio path (0 lots can never satisfy the ratio)"
        side_effects: ["increments HOAAssociation.version by 1"]
      - from: DECLARANT_CONTROL
        to: TRANSITIONING
        trigger: "system (automatic on LotClosing finalize cascade when the closed ratio crosses the threshold)"
        actor: system
        preconditions:
          - "lots_closed_count * 10000 >= total_lots_planned * control_transfer_pct_bp"
        side_effects: ["increments HOAAssociation.version by 1"]
      - from: TRANSITIONING
        to: HOMEOWNER_CONTROL
        trigger: "POST /api/hoa-associations/{id}/complete-transition"
        actor: HOAManager (own association only)
        preconditions:
          - "seated_board_count >= 3 (ERR_BOARD_NOT_SEATED)"
        side_effects:
          - "board_seated_count = seated_board_count; increments HOAAssociation.version by 1"

  - entity: UtilityConnection
    initial_state: REQUESTED
    terminal_states: [CONNECTED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /api/utility-connections/{id}/schedule"
        actor: MunicipalClerk
        preconditions:
          - "scheduled_date's calendar day >= current clock's calendar day (ERR_SCHEDULE_DATE_IN_PAST)"
          - "count of UtilityConnection rows with same provider_id, same scheduled calendar day, status in {SCHEDULED, CONNECTED} < provider.max_connections_per_day (ERR_PROVIDER_CAPACITY_EXCEEDED)"
        side_effects: ["increments UtilityConnection.version by 1"]
      - from: SCHEDULED
        to: CONNECTED
        trigger: "POST /api/utility-connections/{id}/mark-connected"
        actor: MunicipalClerk
        preconditions: []
        side_effects: ["increments UtilityConnection.version by 1"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /api/utility-connections/{id}/cancel"
        actor: DeveloperOperator
        preconditions: []
        side_effects: ["increments UtilityConnection.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/utility-connections/{id}/cancel"
        actor: DeveloperOperator
        preconditions: []
        side_effects:
          - "Frees the provider's daily capacity slot; increments UtilityConnection.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-amend-stale-version
    parent_entity: TakedownAgreement
    write_endpoint: "POST /api/takedown-agreements/{id}/amend"
    occ_field: expected_agreement_version
    description: |
      Amending a TakedownAgreement whose version has advanced since the client
      last observed it is rejected. A prior amendment (or any cascade touching
      the agreement) has legitimately superseded the client's view of the
      pricing terms, so the writer carrying a stale expected_agreement_version
      is turned away with 412.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
  - rule_id: parcel-extend-stale-version
    parent_entity: Parcel
    write_endpoint: "POST /api/parcels/{id}/extend-contingency"
    occ_field: expected_parcel_version
    description: |
      Extending a contingency on a Parcel whose version has advanced since the
      client last observed it is rejected. A prior extension (or any parcel
      mutation) has legitimately superseded the client's view of the deadline,
      so the writer carrying a stale expected_parcel_version is turned away
      with 412.
    error_id: ERR_STALE_PARCEL_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quarters_elapsed
    trigger: "shared helper used by lot_current_price and the declare-default schedule check"
    algorithm: chronological
    formula: |
      months = (now.year - eff.year) * 12 + (now.month - eff.month) - (1 if now.day < eff.day else 0)
      quarters_elapsed = floor(months / 3), clamped below at 0
      where eff = agreement.effective_date, now = current logical clock
    input_set: "agreement.effective_date; current logical clock"
    precision: "integer arithmetic only"
    note: "No id/random inputs; purely a function of the two timestamps"

  - name: lot_current_price
    trigger: "POST /api/lot-closings creation (frozen onto LotClosing.contract_price_cents)"
    algorithm: tiered_pricing
    formula: |
      1. q = quarters_elapsed(agreement.effective_date, current clock)
      2. escalated = base_lot_price_cents * (1 + escalator_rate_bp_per_quarter / 10000) ^ q
      3. cap = base_lot_price_cents * price_cap_bp / 10000
      4. capped = min(escalated, cap)
      5. n = agreement.closed_lot_count at creation time (CLOSED closings only)
         discount_bp = 500 if n >= 10; 250 if 5 <= n <= 9; 0 if n <= 4   (volume tier branch)
      6. price = capped * (1 - discount_bp / 10000)
      7. contract_price_cents = round_half_up(price) to integer cents — the ONLY rounding step
    input_set: "the agreement on the closing; the current clock; agreement.closed_lot_count"
    constants:
      VOLUME_TIER_1_MIN_CLOSED: 5
      VOLUME_TIER_1_DISCOUNT_BP: 250
      VOLUME_TIER_2_MIN_CLOSED: 10
      VOLUME_TIER_2_DISCOUNT_BP: 500
    precision: "integer cents, round_half_up applied once at the final step"
    note: "Combinatorial: >= 3 inputs (quarters elapsed, closed-lot tier, cap) with non-linear interaction (compound power, nested min, conditional tier branch)"

  - name: draw_disbursement
    trigger: "POST /api/loan-draws creation (frozen onto gross/retainage/fee/net fields)"
    algorithm: aggregation
    formula: |
      1. gross_amount_cents = sum of line_items[*].amount_cents (inputs are integer cents; no rounding yet)
      2. retainage_cents = round_half_up(gross_amount_cents * RETAINAGE_BP / 10000)      <- rounding step 1
      3. draw_fee_cents = round_half_up((gross_amount_cents - retainage_cents) * DRAW_FEE_BP / 10000)  <- rounding step 2, on the POST-RETAINAGE base
      4. net_disbursed_cents = gross_amount_cents - retainage_cents - draw_fee_cents
      PINNED ORDER: retainage is rounded FIRST from gross; the fee is rounded SECOND from
      (gross - retainage). Computing the fee from gross and retainage from (gross - fee)
      is the wrong order and yields different cents (e.g. gross 1000100: pinned net
      945345 vs flipped net 945344).
    input_set: "the draw's line_items"
    constants:
      RETAINAGE_BP: 500
      DRAW_FEE_BP: 50
    precision: "integer cents, round_half_up at each pinned step"

  - name: bond_requirement
    trigger: "InfrastructureBond creation (PROVISIONAL) and award-bid (FINAL); result lives on required_bond_cents"
    algorithm: threshold
    formula: |
      PROVISIONAL variant (status == ESTIMATED):
        required_bond_cents = round_half_up(engineer_estimate_cents * BOND_MULTIPLIER_BP / 10000)
      FINAL variant (status in {BID_FINAL, POSTED, PARTIALLY_REDUCED, WORK_ACCEPTED, RELEASED}):
        required_bond_cents = round_half_up(awarded_bid_cents * BOND_MULTIPLIER_BP / 10000)
    input_set: "the bond's own estimate / awarded bid fields, selected by status"
    constants:
      BOND_MULTIPLIER_BP: 11000
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "status == ESTIMATED — before bids are awarded"
        difference: "basis is engineer_estimate_cents"
      - name: final
        when: "status >= BID_FINAL — after bid award"
        difference: "basis is awarded_bid_cents; for identical phase data the two bases differ, so the required bond differs"

  - name: lien_release_price
    trigger: "POST /api/lot-closings creation (frozen onto LotClosing.release_price_cents)"
    algorithm: aggregation
    formula: |
      release_price_cents = round_half_up(contract_price_cents * loan.release_price_floor_bp / 10000)
      At finalize: payment_applied_cents = min(release_price_cents, loan.outstanding_balance_cents)
      (clamp keeps outstanding_balance_cents from ever going negative)
    input_set: "the closing's contract_price_cents; the selected ACTIVE loan's release_price_floor_bp"
    precision: "integer cents, round_half_up"

  - name: loan_selector_for_parcel
    trigger: "POST /api/lot-closings creation; InfrastructureBond reduce gate"
    algorithm: selector
    formula: |
      Candidate set: DevelopmentLoan rows with parcel_id == subject parcel and status == ACTIVE.
      At most one such row can exist (uniqueness validation blocks a second loan while one is
      DRAFT or ACTIVE; PAID_OFF loans are excluded from the candidate set).
      If the set is empty -> ERR_NO_ACTIVE_LOAN.
      If exactly one -> select it. (No ranking needed: the set size is bounded to 1.)
    input_set: "DevelopmentLoan filtered by parcel_id and status == ACTIVE"
    note: "Selector determinism: eligibility filter = status == ACTIVE on the parcel; empty -> ERR_NO_ACTIVE_LOAN; uniqueness rule guarantees no tie is possible"

  - name: absorption_pace
    trigger: "recomputed on plat recordation, on every LotClosing finalize, on lot-release cascades, and on every clock set (trailing windows move with the clock)"
    algorithm: forward_looking
    formula: |
      straight_line_pace_pm = round(total_lots_planned / planned_sellout_months, 4)   (0 when planned_sellout_months == 0)
      trailing_weighted_pace_pm = round(0.5 * C1 + 0.3 * C2 + 0.2 * C3, 4) where
        C1 = count of CLOSED closings (on lots of this parcel) with finalized_at in [now - 30d, now]
        C2 = count in [now - 60d, now - 30d)
        C3 = count in [now - 90d, now - 60d)
        (half-open windows: C1 includes both endpoints; C2, C3 exclude the upper end —
         a closing exactly at now - 30d belongs to C1 and is never double-counted)
      selected_pace_pm = straight_line_pace_pm if absorption_method == STRAIGHT_LINE else trailing_weighted_pace_pm
      projected_months_to_sellout = round((total_lots_planned - lots_closed_count) / selected_pace_pm, 1)
                                    when selected_pace_pm > 0; null otherwise
      next_phase_release_eligible = projected_months_to_sellout != null AND projected_months_to_sellout <= PHASE_LEAD_MONTHS
    input_set: "LotClosings with status == CLOSED whose lot belongs to a phase of this parcel; parcel lot counts"
    constants:
      PHASE_LEAD_MONTHS: 6
      W1: 0.5
      W2: 0.3
      W3: 0.2
    precision: "paces rounded 4dp round_half_up; projection rounded 1dp round_half_up"
    variants:
      - name: straight_line
        when: "absorption_method == STRAIGHT_LINE"
        difference: "pace derives from planned lot count over planned months; ignores actual closings"
      - name: trailing_weighted
        when: "absorption_method == TRAILING_WEIGHTED"
        difference: "pace derives from weighted actual closings in trailing 30-day windows; for identical parcel data the two paces differ whenever actuals diverge from plan"

  - name: hoa_control_transfer_check
    trigger: "POST /api/hoa-associations/{id}/evaluate-control and the LotClosing finalize cascade"
    algorithm: threshold
    formula: |
      ratio path (integer cross-multiplication, no floats):
        transfer_due = lots_closed_count * 10000 >= total_lots_planned * control_transfer_pct_bp
        (requires total_lots_planned > 0; with 0 lots the ratio path is false)
      statutory path: transfer_due = current clock > statutory_control_end
      TRANSITIONING iff either path is true; boundary is INCLUSIVE for the ratio
      (exactly 75.00% transfers) and EXCLUSIVE for the statutory date
      (must be strictly past statutory_control_end)
    input_set: "parcel lot counts; association threshold; current clock"
    precision: "integer arithmetic only"

  - name: impact_fee_amount
    trigger: "POST /api/utility-connections creation (frozen onto impact_fee_cents)"
    algorithm: threshold
    formula: |
      years = floor((current_date - ORDINANCE_EPOCH) / 365 days), clamped below at 0
      impact_fee_cents = round_half_up(BASE_FEE_CENTS[provider.utility_type] * (1 + INDEX_BP / 10000) ^ years)
      to integer cents — the ONLY rounding step
    input_set: "provider.utility_type; current logical clock date"
    constants:
      ORDINANCE_EPOCH: "2024-01-01"
      INDEX_BP: 300
      BASE_FEE_CENTS: { WATER: 250000, SEWER: 300000, ELECTRIC: 175000 }
    precision: "integer cents, round_half_up at the final step"
    note: "At the default clock 2026-08-01, years = 2 and WATER fee = 265225"

  - name: phase_window_overlap_check
    trigger: "POST /api/phases creation"
    algorithm: interval_merge
    formula: |
      Sibling phases = all Phase rows with parcel_id == new phase's parcel_id (any status).
      Windows are half-open [selling_window_start, selling_window_end).
      Overlap iff new.start < existing.end AND existing.start < new.end.
      Adjacency is NOT overlap: new.start == existing.end (or new.end == existing.start) is allowed.
      Any overlap -> ERR_PHASE_WINDOW_OVERLAP.
    input_set: "all phases of the same parcel"
    precision: "datetime comparison, half-open semantics"

  - name: provider_daily_capacity_check
    trigger: "POST /api/utility-connections/{id}/schedule"
    algorithm: threshold
    formula: |
      day = calendar day of connection.scheduled_date (UTC)
      used = count of UtilityConnection rows with provider_id == connection.provider_id,
             same calendar day, and status in {SCHEDULED, CONNECTED}
      Reject iff used >= provider.max_connections_per_day (ERR_PROVIDER_CAPACITY_EXCEEDED)
      Boundary: when used == max - 1 the schedule succeeds (slot becomes full);
      when used == max it is rejected. Aggregate-count semantics — no interval geometry.
    input_set: "connections of the provider on the same calendar day in non-terminal scheduled states"
    precision: "integer count comparison"

  - name: loan_balance_reconciliation
    trigger: "LoanDraw fund / reverse and LotClosing finalize"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents = sum(net_disbursed_cents over draws with status == FUNDED)
                                  - sum(payment_applied_cents over closings with status == CLOSED and loan_id == this loan)
      INVARIANT (loan_balance_conservation): a draw's fund paired with its reverse leaves
      outstanding_balance_cents and total_drawn_cents unchanged; REVERSED draws contribute 0.
    input_set: "draws in FUNDED; closings in CLOSED"
    precision: "integer cents"

  - name: phase_lot_inventory
    trigger: "plat recordation, lot reserve, closing create/finalize/cancel, agreement lot-release cascades"
    algorithm: aggregation
    formula: |
      INVARIANT (lot_inventory_conservation):
        phase.recorded_lot_count ==
          count(lots PLATTED) + count(lots RESERVED) + count(lots UNDER_CONTRACT) + count(lots CLOSED)
      for every phase, at all times. A reserve followed by an agreement declare-default
      leaves the PLATTED count unchanged.
    input_set: "lots of the phase, all sales statuses"
    precision: "integer counts"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role must name a declared role and X-User-ID must be present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role must be permitted for the endpoint; entity-backed ownership: BuilderRep's X-User-ID must equal the builder_id of the agreement being reserved against / closed / cancelled / amended; HOAManager's X-User-ID must equal the association id"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path ids first (left-to-right), then body FK fields: parcel_id, builder_id, phase_id, lot_id, agreement_id, loan_id, provider_id must exist. Concrete ids: ERR_PARCEL_NOT_FOUND, ERR_PHASE_NOT_FOUND, ERR_BOND_NOT_FOUND, ERR_BUILDER_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_LOT_NOT_FOUND, ERR_CLOSING_NOT_FOUND, ERR_LOAN_NOT_FOUND, ERR_DRAW_NOT_FOUND, ERR_HOA_NOT_FOUND, ERR_PROVIDER_NOT_FOUND, ERR_CONNECTION_NOT_FOUND"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource references"

  - priority: 4
    category: existence
    check: "Request body shape: required fields present, types correct, enum values valid, selling_window_end > selling_window_start, contingency_end_date in the future at open, new_contingency_end_date > current contingency_end_date, line_items non-empty with amount_cents >= 1"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_WINDOW | ERR_INVALID_CONTINGENCY_EXTENSION"
    http_status: 400
    applies_to: "create and action endpoints with payloads"

  - priority: 5
    category: state
    check: "OCC: expected_parcel_version == Parcel.version; expected_agreement_version == TakedownAgreement.version (only on endpoints declaring the occ field)"
    error_id: "ERR_STALE_PARCEL_VERSION | ERR_STALE_AGREEMENT_VERSION"
    http_status: 412
    applies_to: "POST /api/parcels/{id}/extend-contingency; POST /api/takedown-agreements/{id}/amend"

  - priority: 6
    category: state
    check: "Target resource must be in the transition's from-state. Concrete ids: ERR_PARCEL_INVALID_STATE, ERR_PHASE_INVALID_STATE, ERR_BOND_INVALID_STATE, ERR_AGREEMENT_INVALID_STATE, ERR_LOT_INVALID_STATE, ERR_CLOSING_INVALID_STATE, ERR_LOAN_INVALID_STATE, ERR_DRAW_INVALID_STATE, ERR_HOA_INVALID_STATE, ERR_CONNECTION_INVALID_STATE"
    error_id: "ERR_<ENTITY>_INVALID_STATE"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: draw approver's X-User-ID != draw.requested_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /api/loan-draws/{id}/approve"

  - priority: 8
    category: business_temporal
    check: "Clock/deadline rules: current clock <= contingency_end_date for clear-contingency (ERR_CONTINGENCY_EXPIRED); scheduled_date not in the past for connection schedule (ERR_SCHEDULE_DATE_IN_PAST)"
    error_id: "ERR_CONTINGENCY_EXPIRED | ERR_SCHEDULE_DATE_IN_PAST"
    http_status: 409
    applies_to: "POST /api/parcels/{id}/clear-contingency; POST /api/parcels/{id}/terminate-contingency (auto-expiry pre-empts); POST /api/utility-connections/{id}/schedule"

  - priority: 9
    category: business_constraint
    check: "Uniqueness/overlap/capacity: builder license_number unique (ERR_DUPLICATE_BUILDER_LICENSE); provider_name unique (ERR_DUPLICATE_PROVIDER_NAME); at most one loan per parcel in {DRAFT, ACTIVE} (ERR_LOAN_ALREADY_EXISTS); phase selling windows half-open non-overlap (ERR_PHASE_WINDOW_OVERLAP); provider daily capacity (ERR_PROVIDER_CAPACITY_EXCEEDED); seated_board_count >= 3 (ERR_BOARD_NOT_SEATED); HOA ratio/statutory conditions (ERR_CONTROL_THRESHOLD_NOT_MET)"
    error_id: "ERR_DUPLICATE_BUILDER_LICENSE | ERR_DUPLICATE_PROVIDER_NAME | ERR_LOAN_ALREADY_EXISTS | ERR_PHASE_WINDOW_OVERLAP | ERR_PROVIDER_CAPACITY_EXCEEDED | ERR_BOARD_NOT_SEATED | ERR_CONTROL_THRESHOLD_NOT_MET"
    http_status: 409
    applies_to: "create endpoints and schedule/complete/evaluate actions"

  - priority: 10
    category: business_referential
    check: "Cross-entity state gates: parcel ACQUIRED for agreement activate / loan activate / hoa form / phase activate (ERR_PARCEL_NOT_ACQUIRED); agreement ACTIVE for reserve and closing create (ERR_AGREEMENT_NOT_ACTIVE); phase ACTIVE for reserve and connection create (ERR_PHASE_INVALID_STATE / ERR_PHASE_NOT_READY_FOR_CONNECTIONS); bond posted for phase activate (ERR_BOND_NOT_POSTED_FOR_PHASE); agreement parcel matches lot's parcel (ERR_AGREEMENT_PARCEL_MISMATCH); lot reserved by this agreement (ERR_LOT_NOT_RESERVED_BY_AGREEMENT); exactly one ACTIVE loan selectable (ERR_NO_ACTIVE_LOAN); agreement behind schedule for declare-default (ERR_AGREEMENT_NOT_BEHIND_SCHEDULE)"
    error_id: "ERR_PARCEL_NOT_ACQUIRED | ERR_AGREEMENT_NOT_ACTIVE | ERR_PHASE_NOT_READY_FOR_CONNECTIONS | ERR_BOND_NOT_POSTED_FOR_PHASE | ERR_AGREEMENT_PARCEL_MISMATCH | ERR_LOT_NOT_RESERVED_BY_AGREEMENT | ERR_NO_ACTIVE_LOAN | ERR_AGREEMENT_NOT_BEHIND_SCHEDULE"
    http_status: 409
    applies_to: "reserve, closing create, phase activate, loan activate, agreement activate, hoa form, connection create, declare-default, draw fund (loan ACTIVE)"

  - priority: 11
    category: business_fiscal
    check: "Money gates: cumulative gross of draws in {REQUESTED, APPROVED, FUNDED} + new gross <= commitment (ERR_DRAW_EXCEEDS_COMMITMENT); posted_amount_cents >= required_bond_cents (ERR_INSUFFICIENT_BOND_POSTED); bond reduction eligibility thresholds (ERR_BOND_REDUCTION_NOT_ELIGIBLE)"
    error_id: "ERR_DRAW_EXCEEDS_COMMITMENT | ERR_INSUFFICIENT_BOND_POSTED | ERR_BOND_REDUCTION_NOT_ELIGIBLE"
    http_status: 402
    applies_to: "POST /api/loan-draws; POST /api/infrastructure-bonds/{id}/post-bond; POST /api/infrastructure-bonds/{id}/reduce"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Parcel ---
  - { method: POST, path: "/api/parcels", description: "Create a development parcel (starts DRAFT)", roles: [DeveloperOperator], code: 201, input: [parcel_name, county, earnest_money_cents, "planned_sellout_months?", "absorption_method?"], output: Parcel, side_effects: ["Derived counters initialized to 0; straight_line_pace_pm = 0 until lots recorded"] }
  - { method: GET, path: "/api/parcels", description: "List parcels (paginated)", roles: [DeveloperOperator, BuilderRep, LenderOfficer, MunicipalClerk, HOAManager], code: 200, input: ["status?", "limit?", "offset?"], output: "Parcel[]", side_effects: [] }
  - { method: GET, path: "/api/parcels/{id}", description: "Get one parcel with derived fields", roles: [DeveloperOperator, BuilderRep, LenderOfficer, MunicipalClerk, HOAManager], code: 200, input: [], output: Parcel, side_effects: [] }
  - { method: POST, path: "/api/parcels/{id}/open-contingency", description: "DRAFT -> CONTINGENCY_ACTIVE; sets contingency_end_date", roles: [DeveloperOperator], code: 200, input: [contingency_end_date], output: Parcel, side_effects: ["status -> CONTINGENCY_ACTIVE", "increments Parcel.version by 1"] }
  - { method: POST, path: "/api/parcels/{id}/extend-contingency", description: "CONTINGENCY_ACTIVE self-loop; supersedes the deadline under OCC", roles: [DeveloperOperator], code: 200, input: [new_contingency_end_date, expected_parcel_version], output: Parcel, side_effects: ["contingency_end_date replaced", "increments Parcel.version by 1"] }
  - { method: POST, path: "/api/parcels/{id}/clear-contingency", description: "CONTINGENCY_ACTIVE -> ACQUIRED (in-period only, inclusive deadline)", roles: [DeveloperOperator], code: 200, input: [], output: Parcel, side_effects: ["status -> ACQUIRED", "acquisition_close_date set", "increments Parcel.version by 1"] }
  - { method: POST, path: "/api/parcels/{id}/terminate-contingency", description: "CONTINGENCY_ACTIVE -> TERMINATED with deposit refund (in-period only, inclusive deadline)", roles: [DeveloperOperator], code: 200, input: [], output: Parcel, side_effects: ["status -> TERMINATED", "earnest_money_refunded = true", "increments Parcel.version by 1"] }

  # --- Phase ---
  - { method: POST, path: "/api/phases", description: "Create a phase (PLANNED); window validations apply", roles: [DeveloperOperator], code: 201, input: [parcel_id, phase_name, sequence_number, planned_lot_count, selling_window_start, selling_window_end], output: Phase, side_effects: ["phase_window_overlap_check"] }
  - { method: GET, path: "/api/phases", description: "List phases, filterable by parcel", roles: [DeveloperOperator, BuilderRep, LenderOfficer, MunicipalClerk, HOAManager], code: 200, input: ["parcel_id?", "status?", "limit?", "offset?"], output: "Phase[]", side_effects: [] }
  - { method: GET, path: "/api/phases/{id}", description: "Get one phase", roles: [DeveloperOperator, BuilderRep, LenderOfficer, MunicipalClerk, HOAManager], code: 200, input: [], output: Phase, side_effects: [] }
  - { method: POST, path: "/api/phases/{id}/submit-plat", description: "PLANNED or PLAT_REJECTED -> PLAT_SUBMITTED; resubmission bumps plat_revision", roles: [DeveloperOperator], code: 200, input: [plat_lot_count, lot_type], output: Phase, side_effects: ["plat_lot_count/lot_type set", "plat_revision 0->1 or +1", "increments Phase.version by 1"] }
  - { method: POST, path: "/api/phases/{id}/review-plat", description: "PLAT_SUBMITTED -> PLAT_APPROVED (decision=APPROVE) or PLAT_REJECTED (decision=REJECT, reason required)", roles: [MunicipalClerk], code: 200, input: [decision, "rejection_reason?"], output: Phase, side_effects: ["status per decision", "increments Phase.version by 1"] }
  - { method: POST, path: "/api/phases/{id}/record-plat", description: "PLAT_APPROVED -> PLAT_RECORDED; generates the phase's lots", roles: [MunicipalClerk], code: 200, input: [], output: Phase, side_effects: ["generate plat_lot_count Lot rows (PLATTED/ENCUMBERED)", "recorded_at set", "Parcel derived fields recompute", "increments Phase.version by 1"] }
  - { method: POST, path: "/api/phases/{id}/activate", description: "PLAT_RECORDED -> ACTIVE; requires parcel ACQUIRED and bond POSTED", roles: [DeveloperOperator], code: 200, input: [], output: Phase, side_effects: ["status -> ACTIVE", "increments Phase.version by 1"] }

  # --- InfrastructureBond ---
  - { method: POST, path: "/api/infrastructure-bonds", description: "Create bond record for a phase (ESTIMATED); provisional required bond computed", roles: [DeveloperOperator], code: 201, input: [phase_id, engineer_estimate_cents], output: InfrastructureBond, side_effects: ["required_bond_cents = round_half_up(engineer_estimate_cents * 1.10)"] }
  - { method: GET, path: "/api/infrastructure-bonds", description: "List bonds, filterable by phase", roles: [DeveloperOperator, BuilderRep, LenderOfficer, MunicipalClerk, HOAManager], code: 200, input: ["phase_id?", "status?", "limit?", "offset?"], output: "InfrastructureBond[]", side_effects: [] }
  - { method: GET, path: "/api/infrastructure-bonds/{id}", description: "Get one bond", roles: [DeveloperOperator, BuilderRep, LenderOfficer, MunicipalClerk, HOAManager], code: 200, input: [], output: InfrastructureBond, side_effects: [] }
  - { method: POST, path: "/api/infrastructure-bonds/{id}/award-bid", description: "ESTIMATED -> BID_FINAL; required bond switches to the FINAL basis", roles: [DeveloperOperator], code: 200, input: [awarded_bid_cents], output: InfrastructureBond, side_effects: ["awarded_bid_cents set", "required_bond_cents recomputed at 110% of awarded bid", "increments InfrastructureBond.version by 1"] }
  - { method: POST, path: "/api/infrastructure-bonds/{id}/post-bond", description: "BID_FINAL -> POSTED; posted amount must cover required bond (inclusive)", roles: [DeveloperOperator], code: 200, input: [posted_amount_cents], output: InfrastructureBond, side_effects: ["posted_bond_cents set", "increments InfrastructureBond.version by 1"] }
  - { method: POST, path: "/api/infrastructure-bonds/{id}/reduce", description: "POSTED -> PARTIALLY_REDUCED under step-down thresholds", roles: [DeveloperOperator], code: 200, input: [reduction_amount_cents], output: InfrastructureBond, side_effects: ["posted_bond_cents reduced", "increments InfrastructureBond.version by 1"] }
  - { method: POST, path: "/api/infrastructure-bonds/{id}/accept-work", description: "POSTED or PARTIALLY_REDUCED -> WORK_ACCEPTED (clerk certification)", roles: [MunicipalClerk], code: 200, input: [], output: InfrastructureBond, side_effects: ["work_accepted = true", "increments InfrastructureBond.version by 1"] }
  - { method: POST, path: "/api/infrastructure-bonds/{id}/release", description: "WORK_ACCEPTED -> RELEASED; posted bond zeroed", roles: [DeveloperOperator], code: 200, input: [], output: InfrastructureBond, side_effects: ["posted_bond_cents = 0", "increments InfrastructureBond.version by 1"] }

  # --- Builder ---
  - { method: POST, path: "/api/builders", description: "Register a homebuilder (license_number unique)", roles: [DeveloperOperator], code: 201, input: [builder_name, license_number, contact_email], output: Builder, side_effects: [] }
  - { method: GET, path: "/api/builders", description: "List builders (paginated)", roles: [DeveloperOperator, BuilderRep, LenderOfficer, MunicipalClerk, HOAManager], code: 200, input: ["limit?", "offset?"], output: "Builder[]", side_effects: [] }
  - { method: GET, path: "/api/builders/{id}", description: "Get one builder", roles: [DeveloperOperator, BuilderRep, LenderOfficer, MunicipalClerk, HOAManager], code: 200, input: [], output: Builder, side_effects: [] }

  # --- TakedownAgreement ---
  - { method: POST, path: "/api/takedown-agreements", description: "Create a builder takedown agreement (DRAFT) with lot schedule and escalator terms", roles: [DeveloperOperator], code: 201, input: [parcel_id, builder_id, effective_date, base_lot_price_cents, escalator_rate_bp_per_quarter, price_cap_bp, min_lots_per_quarter, scheduled_lot_count], output: TakedownAgreement, side_effects: [] }
  - { method: GET, path: "/api/takedown-agreements", description: "List agreements, filterable by parcel / builder / status", roles: [DeveloperOperator, BuilderRep, LenderOfficer, MunicipalClerk, HOAManager], code: 200, input: ["parcel_id?", "builder_id?", "status?", "limit?", "offset?"], output: "TakedownAgreement[]", side_effects: [] }
  - { method: GET, path: "/api/takedown-agreements/{id}", description: "Get one agreement", roles: [DeveloperOperator, BuilderRep, LenderOfficer, MunicipalClerk, HOAManager], code: 200, input: [], output: TakedownAgreement, side_effects: [] }
  - { method: POST, path: "/api/takedown-agreements/{id}/activate", description: "DRAFT -> ACTIVE; requires parcel ACQUIRED", roles: [DeveloperOperator], code: 200, input: [], output: TakedownAgreement, side_effects: ["status -> ACTIVE", "increments TakedownAgreement.version by 1"] }
  - { method: POST, path: "/api/takedown-agreements/{id}/amend", description: "ACTIVE self-loop amendment of pricing/schedule terms under OCC", roles: [DeveloperOperator, BuilderRep], code: 200, input: [expected_agreement_version, "base_lot_price_cents?", "escalator_rate_bp_per_quarter?", "price_cap_bp?", "min_lots_per_quarter?"], output: TakedownAgreement, side_effects: ["provided terms replaced", "increments TakedownAgreement.version by 1"] }
  - { method: POST, path: "/api/takedown-agreements/{id}/declare-default", description: "ACTIVE -> DEFAULTED when the builder is behind the takedown schedule; releases reserved lots", roles: [DeveloperOperator], code: 200, input: [reason], output: TakedownAgreement, side_effects: ["lot-release cascade links 1-4 per state machine", "increments TakedownAgreement.version by 1"] }
  - { method: POST, path: "/api/takedown-agreements/{id}/cure", description: "DEFAULTED -> ACTIVE (cycle); released lots stay released", roles: [DeveloperOperator], code: 200, input: [cure_note], output: TakedownAgreement, side_effects: ["default_reason cleared", "increments TakedownAgreement.version by 1"] }
  - { method: POST, path: "/api/takedown-agreements/{id}/terminate", description: "ACTIVE or DEFAULTED -> TERMINATED; releases reserved lots", roles: [DeveloperOperator], code: 200, input: [], output: TakedownAgreement, side_effects: ["lot-release cascade links 1-4 per state machine", "increments TakedownAgreement.version by 1"] }

  # --- Lot ---
  - { method: GET, path: "/api/lots", description: "List lots, filterable by phase / statuses / reserving agreement", roles: [DeveloperOperator, BuilderRep, LenderOfficer, MunicipalClerk, HOAManager], code: 200, input: ["phase_id?", "sales_status?", "lien_status?", "reserved_agreement_id?", "limit?", "offset?"], output: "Lot[]", side_effects: [] }
  - { method: GET, path: "/api/lots/{id}", description: "Get one lot", roles: [DeveloperOperator, BuilderRep, LenderOfficer, MunicipalClerk, HOAManager], code: 200, input: [], output: Lot, side_effects: [] }
  - { method: POST, path: "/api/lots/{id}/reserve", description: "sales PLATTED -> RESERVED under an ACTIVE agreement of the caller's builder", roles: [BuilderRep], code: 200, input: [agreement_id], output: Lot, side_effects: ["reserved_agreement_id set", "Parcel.lots_available_count -1", "increments Lot.version by 1 and Parcel.version by 1"] }

  # --- LotClosing ---
  - { method: POST, path: "/api/lot-closings", description: "Open a closing on a reserved lot (PENDING); freezes contract and release prices", roles: [BuilderRep], code: 201, input: [lot_id, agreement_id], output: LotClosing, side_effects: ["lot_current_price computed and frozen", "loan selected via loan_selector_for_parcel; lien_release_price computed", "lot.sales -> UNDER_CONTRACT; lot.lien -> RELEASE_PENDING", "increments Lot.version by 1"] }
  - { method: GET, path: "/api/lot-closings", description: "List closings, filterable by lot / agreement / loan / status", roles: [DeveloperOperator, BuilderRep, LenderOfficer, MunicipalClerk, HOAManager], code: 200, input: ["lot_id?", "agreement_id?", "loan_id?", "status?", "limit?", "offset?"], output: "LotClosing[]", side_effects: [] }
  - { method: GET, path: "/api/lot-closings/{id}", description: "Get one closing", roles: [DeveloperOperator, BuilderRep, LenderOfficer, MunicipalClerk, HOAManager], code: 200, input: [], output: LotClosing, side_effects: [] }
  - { method: POST, path: "/api/lot-closings/{id}/finalize", description: "PENDING -> CLOSED: lender confirms funds and releases the lot from the loan lien; fires the full cascade", roles: [LenderOfficer], code: 200, input: [], output: LotClosing, side_effects: ["cascade links 1-7 per state machine", "increments LotClosing.version by 1"] }
  - { method: POST, path: "/api/lot-closings/{id}/cancel", description: "PENDING -> CANCELLED; lot reverts to RESERVED (reservation stands), lien re-encumbered", roles: [BuilderRep, DeveloperOperator], code: 200, input: [], output: LotClosing, side_effects: ["lot.sales -> RESERVED; lot.lien -> ENCUMBERED", "increments LotClosing.version by 1"] }

  # --- DevelopmentLoan ---
  - { method: POST, path: "/api/development-loans", description: "Create a development loan (DRAFT); one open loan per parcel", roles: [DeveloperOperator], code: 201, input: [parcel_id, commitment_amount_cents, release_price_floor_bp], output: DevelopmentLoan, side_effects: [] }
  - { method: GET, path: "/api/development-loans", description: "List loans, filterable by parcel / status", roles: [DeveloperOperator, BuilderRep, LenderOfficer, MunicipalClerk, HOAManager], code: 200, input: ["parcel_id?", "status?", "limit?", "offset?"], output: "DevelopmentLoan[]", side_effects: [] }
  - { method: GET, path: "/api/development-loans/{id}", description: "Get one loan", roles: [DeveloperOperator, BuilderRep, LenderOfficer, MunicipalClerk, HOAManager], code: 200, input: [], output: DevelopmentLoan, side_effects: [] }
  - { method: POST, path: "/api/development-loans/{id}/activate", description: "DRAFT -> ACTIVE; requires parcel ACQUIRED", roles: [DeveloperOperator], code: 200, input: [], output: DevelopmentLoan, side_effects: ["status -> ACTIVE", "increments DevelopmentLoan.version by 1"] }

  # --- LoanDraw ---
  - { method: POST, path: "/api/loan-draws", description: "Request a draw (REQUESTED); computes gross/retainage/fee/net in pinned rounding order", roles: [DeveloperOperator], code: 201, input: [loan_id, line_items], output: LoanDraw, side_effects: ["draw_disbursement computed and frozen", "requested_by_user_id = X-User-ID"] }
  - { method: GET, path: "/api/loan-draws", description: "List draws, filterable by loan / status", roles: [DeveloperOperator, BuilderRep, LenderOfficer, MunicipalClerk, HOAManager], code: 200, input: ["loan_id?", "status?", "limit?", "offset?"], output: "LoanDraw[]", side_effects: [] }
  - { method: GET, path: "/api/loan-draws/{id}", description: "Get one draw", roles: [DeveloperOperator, BuilderRep, LenderOfficer, MunicipalClerk, HOAManager], code: 200, input: [], output: LoanDraw, side_effects: [] }
  - { method: POST, path: "/api/loan-draws/{id}/approve", description: "REQUESTED -> APPROVED; approver must differ from requester (SoD)", roles: [LenderOfficer], code: 200, input: [], output: LoanDraw, side_effects: ["approved_by_user_id set", "increments LoanDraw.version by 1"] }
  - { method: POST, path: "/api/loan-draws/{id}/reject", description: "REQUESTED -> REJECTED", roles: [LenderOfficer], code: 200, input: ["reason?"], output: LoanDraw, side_effects: ["increments LoanDraw.version by 1"] }
  - { method: POST, path: "/api/loan-draws/{id}/fund", description: "APPROVED -> FUNDED; disburses net amount onto the loan balance", roles: [LenderOfficer], code: 200, input: [], output: LoanDraw, side_effects: ["loan.outstanding_balance_cents += net_disbursed_cents", "loan.total_drawn_cents += net_disbursed_cents", "increments LoanDraw.version by 1 and DevelopmentLoan.version by 1"] }
  - { method: POST, path: "/api/loan-draws/{id}/reverse", description: "FUNDED -> REVERSED; compensates the disbursement", roles: [LenderOfficer], code: 200, input: [], output: LoanDraw, side_effects: ["loan.outstanding_balance_cents -= net_disbursed_cents", "loan.total_drawn_cents -= net_disbursed_cents", "increments LoanDraw.version by 1 and DevelopmentLoan.version by 1"] }

  # --- HOAAssociation ---
  - { method: POST, path: "/api/hoa-associations", description: "Create the parcel's HOA record (FORMATION_PENDING)", roles: [DeveloperOperator], code: 201, input: [parcel_id, hoa_name, statutory_control_end, "control_transfer_pct_bp?"], output: HOAAssociation, side_effects: [] }
  - { method: GET, path: "/api/hoa-associations", description: "List HOAs, filterable by parcel / status", roles: [DeveloperOperator, BuilderRep, LenderOfficer, MunicipalClerk, HOAManager], code: 200, input: ["parcel_id?", "status?", "limit?", "offset?"], output: "HOAAssociation[]", side_effects: [] }
  - { method: GET, path: "/api/hoa-associations/{id}", description: "Get one HOA", roles: [DeveloperOperator, BuilderRep, LenderOfficer, MunicipalClerk, HOAManager], code: 200, input: [], output: HOAAssociation, side_effects: [] }
  - { method: POST, path: "/api/hoa-associations/{id}/form", description: "FORMATION_PENDING -> DECLARANT_CONTROL; requires parcel ACQUIRED", roles: [DeveloperOperator], code: 200, input: [], output: HOAAssociation, side_effects: ["status -> DECLARANT_CONTROL", "increments HOAAssociation.version by 1"] }
  - { method: POST, path: "/api/hoa-associations/{id}/evaluate-control", description: "DECLARANT_CONTROL -> TRANSITIONING when the closed-lot ratio (inclusive) or statutory sunset (exclusive) is met", roles: [DeveloperOperator, HOAManager], code: 200, input: [], output: HOAAssociation, side_effects: ["status -> TRANSITIONING when conditions met", "increments HOAAssociation.version by 1"] }
  - { method: POST, path: "/api/hoa-associations/{id}/complete-transition", description: "TRANSITIONING -> HOMEOWNER_CONTROL once a homeowner board is seated", roles: [HOAManager], code: 200, input: [seated_board_count], output: HOAAssociation, side_effects: ["board_seated_count set", "increments HOAAssociation.version by 1"] }

  # --- UtilityProvider ---
  - { method: POST, path: "/api/utility-providers", description: "Register a utility provider / district with daily connection capacity", roles: [MunicipalClerk], code: 201, input: [provider_name, utility_type, max_connections_per_day], output: UtilityProvider, side_effects: [] }
  - { method: GET, path: "/api/utility-providers", description: "List providers", roles: [DeveloperOperator, BuilderRep, LenderOfficer, MunicipalClerk, HOAManager], code: 200, input: ["utility_type?", "limit?", "offset?"], output: "UtilityProvider[]", side_effects: [] }
  - { method: GET, path: "/api/utility-providers/{id}", description: "Get one provider", roles: [DeveloperOperator, BuilderRep, LenderOfficer, MunicipalClerk, HOAManager], code: 200, input: [], output: UtilityProvider, side_effects: [] }

  # --- UtilityConnection ---
  - { method: POST, path: "/api/utility-connections", description: "Request a connection for a lot (REQUESTED); impact fee computed and frozen", roles: [DeveloperOperator], code: 201, input: [lot_id, provider_id, scheduled_date], output: UtilityConnection, side_effects: ["impact_fee_amount computed and frozen"] }
  - { method: GET, path: "/api/utility-connections", description: "List connections, filterable by lot / provider / status", roles: [DeveloperOperator, BuilderRep, LenderOfficer, MunicipalClerk, HOAManager], code: 200, input: ["lot_id?", "provider_id?", "status?", "limit?", "offset?"], output: "UtilityConnection[]", side_effects: [] }
  - { method: GET, path: "/api/utility-connections/{id}", description: "Get one connection", roles: [DeveloperOperator, BuilderRep, LenderOfficer, MunicipalClerk, HOAManager], code: 200, input: [], output: UtilityConnection, side_effects: [] }
  - { method: POST, path: "/api/utility-connections/{id}/schedule", description: "REQUESTED -> SCHEDULED; enforces past-date and provider daily-capacity rules", roles: [MunicipalClerk], code: 200, input: [], output: UtilityConnection, side_effects: ["provider_daily_capacity_check consumes one slot", "increments UtilityConnection.version by 1"] }
  - { method: POST, path: "/api/utility-connections/{id}/mark-connected", description: "SCHEDULED -> CONNECTED", roles: [MunicipalClerk], code: 200, input: [], output: UtilityConnection, side_effects: ["increments UtilityConnection.version by 1"] }
  - { method: POST, path: "/api/utility-connections/{id}/cancel", description: "REQUESTED or SCHEDULED -> CANCELLED; frees the capacity slot", roles: [DeveloperOperator], code: 200, input: [], output: UtilityConnection, side_effects: ["increments UtilityConnection.version by 1"] }

  # --- Test-driving clock ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving endpoint). Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads that fixed instant and never the wall clock. Setting the clock fires time-based system transitions (contingency auto-expiry) and re-anchors trailing absorption windows."
    roles: [DeveloperOperator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: "datetime" }
    side_effects:
      - "Parcels in CONTINGENCY_ACTIVE with contingency_end_date strictly before the new clock auto-transition to TERMINATED (earnest_money_refunded = false)"
      - "Parcel trailing absorption windows re-anchor to the new clock"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role is not a declared role, or X-User-ID missing" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for the endpoint, or entity-backed ownership check failed (BuilderRep not the agreement's builder; HOAManager not this association)" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum value, empty line_items, amount_cents < 1, missing rejection_reason on REJECT decision" }
  - { id: ERR_INVALID_WINDOW, http: 400, condition: "selling_window_end <= selling_window_start on phase create" }
  - { id: ERR_INVALID_CONTINGENCY_EXTENSION, http: 400, condition: "new_contingency_end_date <= current contingency_end_date" }
  # --- not found ---
  - { id: ERR_PARCEL_NOT_FOUND, http: 404, condition: "No parcel with the given id" }
  - { id: ERR_PHASE_NOT_FOUND, http: 404, condition: "No phase with the given id" }
  - { id: ERR_BOND_NOT_FOUND, http: 404, condition: "No infrastructure bond with the given id" }
  - { id: ERR_BUILDER_NOT_FOUND, http: 404, condition: "No builder with the given id" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "No takedown agreement with the given id" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "No lot with the given id" }
  - { id: ERR_CLOSING_NOT_FOUND, http: 404, condition: "No lot closing with the given id" }
  - { id: ERR_LOAN_NOT_FOUND, http: 404, condition: "No development loan with the given id" }
  - { id: ERR_DRAW_NOT_FOUND, http: 404, condition: "No loan draw with the given id" }
  - { id: ERR_HOA_NOT_FOUND, http: 404, condition: "No HOA association with the given id" }
  - { id: ERR_PROVIDER_NOT_FOUND, http: 404, condition: "No utility provider with the given id" }
  - { id: ERR_CONNECTION_NOT_FOUND, http: 404, condition: "No utility connection with the given id" }
  # --- OCC ---
  - { id: ERR_STALE_PARCEL_VERSION, http: 412, condition: "expected_parcel_version != Parcel.version on extend-contingency" }
  - { id: ERR_STALE_AGREEMENT_VERSION, http: 412, condition: "expected_agreement_version != TakedownAgreement.version on amend" }
  # --- target state ---
  - { id: ERR_PARCEL_INVALID_STATE, http: 409, condition: "Parcel not in the transition's from-state (e.g., open-contingency from non-DRAFT; clear/terminate/extend from non-CONTINGENCY_ACTIVE including auto-expired)" }
  - { id: ERR_PHASE_INVALID_STATE, http: 409, condition: "Phase not in the transition's from-state (submit/review/record/activate); also rejects lot reserve when the lot's phase is not ACTIVE" }
  - { id: ERR_BOND_INVALID_STATE, http: 409, condition: "Bond not in the transition's from-state (award-bid requires ESTIMATED; post-bond requires BID_FINAL; reduce requires POSTED; accept-work requires POSTED or PARTIALLY_REDUCED; release requires WORK_ACCEPTED)" }
  - { id: ERR_AGREEMENT_INVALID_STATE, http: 409, condition: "Agreement not in the transition's from-state (activate requires DRAFT; amend requires ACTIVE; declare-default requires ACTIVE; cure requires DEFAULTED; terminate requires ACTIVE or DEFAULTED)" }
  - { id: ERR_LOT_INVALID_STATE, http: 409, condition: "Lot sales_status not PLATTED on reserve" }
  - { id: ERR_CLOSING_INVALID_STATE, http: 409, condition: "Closing not PENDING on finalize or cancel" }
  - { id: ERR_LOAN_INVALID_STATE, http: 409, condition: "Loan not DRAFT on activate" }
  - { id: ERR_DRAW_INVALID_STATE, http: 409, condition: "Draw not in the transition's from-state (approve/reject require REQUESTED; fund requires APPROVED; reverse requires FUNDED)" }
  - { id: ERR_HOA_INVALID_STATE, http: 409, condition: "HOA not in the transition's from-state (form requires FORMATION_PENDING; evaluate-control requires DECLARANT_CONTROL; complete-transition requires TRANSITIONING)" }
  - { id: ERR_CONNECTION_INVALID_STATE, http: 409, condition: "Connection not in the transition's from-state (schedule requires REQUESTED; mark-connected requires SCHEDULED; cancel requires REQUESTED or SCHEDULED)" }
  # --- segregation of duties ---
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Draw approver's X-User-ID equals draw.requested_by_user_id" }
  # --- temporal ---
  - { id: ERR_CONTINGENCY_EXPIRED, http: 409, condition: "current clock > contingency_end_date at clear-contingency (deadline is inclusive)" }
  - { id: ERR_SCHEDULE_DATE_IN_PAST, http: 409, condition: "connection scheduled_date's calendar day is before the current clock's calendar day" }
  # --- constraint ---
  - { id: ERR_DUPLICATE_BUILDER_LICENSE, http: 409, condition: "Another builder already holds this license_number" }
  - { id: ERR_DUPLICATE_PROVIDER_NAME, http: 409, condition: "Another utility provider already holds this provider_name" }
  - { id: ERR_LOAN_ALREADY_EXISTS, http: 409, condition: "A loan for this parcel already exists in DRAFT or ACTIVE status" }
  - { id: ERR_PHASE_WINDOW_OVERLAP, http: 409, condition: "Selling window half-open-overlaps a sibling phase's window; adjacency (end == start) is allowed" }
  - { id: ERR_PROVIDER_CAPACITY_EXCEEDED, http: 409, condition: "Provider already has max_connections_per_day connections SCHEDULED or CONNECTED on that calendar day" }
  - { id: ERR_BOARD_NOT_SEATED, http: 409, condition: "seated_board_count < 3 at complete-transition" }
  - { id: ERR_CONTROL_THRESHOLD_NOT_MET, http: 409, condition: "Neither the closed-lot ratio threshold (inclusive) nor the statutory sunset (exclusive) is met at evaluate-control" }
  # --- referential ---
  - { id: ERR_PARCEL_NOT_ACQUIRED, http: 409, condition: "Parcel status != ACQUIRED where required (agreement activate, loan activate, hoa form, phase activate)" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Agreement status != ACTIVE on reserve or closing create" }
  - { id: ERR_PHASE_NOT_READY_FOR_CONNECTIONS, http: 409, condition: "Lot's phase status != ACTIVE on connection create" }
  - { id: ERR_BOND_NOT_POSTED_FOR_PHASE, http: 409, condition: "No bond in {POSTED, PARTIALLY_REDUCED, WORK_ACCEPTED} for the phase at phase activate" }
  - { id: ERR_AGREEMENT_PARCEL_MISMATCH, http: 409, condition: "agreement.parcel_id does not match the lot's phase's parcel_id on reserve" }
  - { id: ERR_LOT_NOT_RESERVED_BY_AGREEMENT, http: 409, condition: "lot.sales_status != RESERVED or lot.reserved_agreement_id != agreement_id on closing create" }
  - { id: ERR_NO_ACTIVE_LOAN, http: 409, condition: "No DevelopmentLoan with status == ACTIVE for the parcel (closing create, bond reduce gate)" }
  - { id: ERR_LOAN_NOT_ACTIVE, http: 409, condition: "Loan status != ACTIVE on draw create or draw fund" }
  - { id: ERR_AGREEMENT_NOT_BEHIND_SCHEDULE, http: 409, condition: "closed_lot_count >= quarters_elapsed * min_lots_per_quarter at declare-default" }
  # --- fiscal ---
  - { id: ERR_DRAW_EXCEEDS_COMMITMENT, http: 402, condition: "Cumulative gross of non-terminal draws + new gross exceeds commitment_amount_cents" }
  - { id: ERR_INSUFFICIENT_BOND_POSTED, http: 402, condition: "posted_amount_cents < required_bond_cents at post-bond" }
  - { id: ERR_BOND_REDUCTION_NOT_ELIGIBLE, http: 402, condition: "Loan outstanding above 50% of commitment, or reduction would drop posted bond below 50% of required, or reduction_amount_cents < 1" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DeveloperOperator
    description: "Land developer operations user; owns parcels, phases, bonds, agreements, loans, draws, HOA formation, and connection requests"
    identity: opaque
    exclusive_operations:
      - "POST /api/parcels and all parcel contingency actions"
      - "POST /api/phases, submit-plat, activate"
      - "POST /api/infrastructure-bonds, award-bid, post-bond, reduce, release"
      - "POST /api/builders"
      - "POST /api/takedown-agreements, activate, declare-default, cure, terminate"
      - "POST /api/development-loans, activate; POST /api/loan-draws"
      - "POST /api/hoa-associations, form"
      - "POST /api/utility-connections, cancel"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "POST /api/takedown-agreements/{id}/amend (shared with BuilderRep, own agreement)"
      - "POST /api/lot-closings/{id}/cancel (shared with BuilderRep, own agreement)"
      - "POST /api/hoa-associations/{id}/evaluate-control (shared with HOAManager, own association)"
      - "All GET list/detail endpoints"
  - name: BuilderRep
    description: "Homebuilder representative; reserves lots and opens closings under their own builder's agreements"
    identity: "entity_backed:Builder"
    exclusive_operations:
      - "POST /api/lots/{id}/reserve"
      - "POST /api/lot-closings"
    shared_operations:
      - "POST /api/takedown-agreements/{id}/amend (own agreement only: X-User-ID == agreement.builder_id)"
      - "POST /api/lot-closings/{id}/cancel (own agreement only)"
      - "All GET list/detail endpoints"
  - name: LenderOfficer
    description: "Lending institution officer; approves/rejects/funds/reverses draws and finalizes closings (lien release)"
    identity: opaque
    exclusive_operations:
      - "POST /api/loan-draws/{id}/approve, reject, fund, reverse"
      - "POST /api/lot-closings/{id}/finalize"
    shared_operations:
      - "All GET list/detail endpoints"
  - name: MunicipalClerk
    description: "County / municipal clerk and engineering reviewer; reviews and records plats, certifies infrastructure acceptance, registers providers, schedules connections"
    identity: opaque
    exclusive_operations:
      - "POST /api/phases/{id}/review-plat, record-plat"
      - "POST /api/infrastructure-bonds/{id}/accept-work"
      - "POST /api/utility-providers"
      - "POST /api/utility-connections/{id}/schedule, mark-connected"
    shared_operations:
      - "All GET list/detail endpoints"
  - name: HOAManager
    description: "Homeowner association manager; drives the control transfer for their own association"
    identity: "entity_backed:HOAAssociation"
    exclusive_operations:
      - "POST /api/hoa-associations/{id}/complete-transition"
    shared_operations:
      - "POST /api/hoa-associations/{id}/evaluate-control (own association only: X-User-ID == association id)"
      - "All GET list/detail endpoints"
