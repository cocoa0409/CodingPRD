          assert:
            - "Trigger call 1: 0 committed + 3000 reserved + 2500 == 5500 <= 6000, so HTTP 201 and data.incentive_accrued_cents == 2500"
            - "Trigger call 2: 2500 + 3000 + 2500 == 8000 > 6000, so HTTP 409 with ${e70a} == ERR_INCENTIVE_BUDGET_EXCEEDED - the accrual is blocked by 3000 cents that are merely reserved by armed boosts, not spent"
            - "Trigger call 3: HTTP 200 with data.incentive_budget_cents == 9000 and data.version incremented"
