# =============================================================================
# PRD Benchmark Seed Tables
# Task: task_1295_pallet_manufacturing_recycling
# Pallet Manufacturing & Recycling (PalletOne / regional pallet recycler)
# =============================================================================

scenario: |
  Pallet Manufacturing & Recycling (PalletOne / regional pallet recycler): new build spec (size/board count) & lumber cost, core buying & sorting into grades, repair (A/B grade) & recycled inventory, heat treatment & ISPM-15 stamping, customer pool & pickup credit, route economics & trailer cube, seasonal demand & price index, damaged/scrap wood grinding

domain_name: pallet-recycling
api_prefix: /pallet-ops

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation       # trailer cube + inventory-lot allocation competed for by orders/routes
  secondary_archetype: pricing_engine       # lumber cost x seasonal index x route economics x pool credit
  complexity_layers:
    - dual_variant_calculation              # provisional vs final settlement on routes; estimated vs actual core grading yield
    - cascading_side_effects                # repair completion -> inventory lot -> order allocation -> route cube
    - rate_threshold_triggers               # seasonal index bands, HT capacity thresholds, pool-credit tiers
    - optimistic_concurrency                # OCC on SalesOrder.version (allocation) and DeliveryRoute.version (stop assignment)
  entity_topology: flat                     # peer entities linked by FK references; no nested URL paths
  state_machine_shape: parallel             # CoreUnit grade x processing; InventoryLot quality x reservation; SalesOrder payment x fulfillment
  relationship_patterns:
    - one_to_many
    - cross_aggregate                       # RouteStop references SalesOrder + InventoryLot across aggregates; OrderLine allocated_lot_id crosses into InventoryLot
  role_model: peer_roles                    # ProcurementManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, PlantManager
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (15 entities)
# =============================================================================
entities:
  - name: PalletSpec
    parent: null
    common_fields: true
    fields:
      - { name: spec_code, type: string, source: input, description: "Human-readable spec code, unique (e.g. GMA-48X40-7B)", constraints: "unique across PalletSpec" }
      - { name: length_in, type: number, source: input, description: "Deck length in inches", constraints: "> 0" }
      - { name: width_in, type: number, source: input, description: "Deck width in inches", constraints: "> 0" }
      - { name: height_in, type: number, source: input, description: "Assembled pallet height in inches", constraints: "> 0" }
      - { name: board_count, type: integer, source: input, description: "Total boards (deck + stringer) in the build", constraints: ">= 5" }
      - { name: lumber_species, type: enum, source: input, description: "PINE | OAK | MIXED — drives which LumberPriceIndex row prices this spec" }
      - { name: board_feet_per_pallet, type: number, source: computed, description: "Read-only nominal board feet consumed per pallet = f(length_in, width_in, height_in, board_count) per standard formula" }
      - { name: unit_cube_cuft, type: number, source: computed, description: "Read-only trailer cube per pallet = length_in*width_in*height_in / 1728, 4 decimal places round_half_up" }
      - { name: requires_heat_treatment_default, type: boolean, source: input, default: false, description: "Whether orders for this spec default to requiring ISPM-15 heat treatment" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> RETIRED" }

  - name: LumberPriceIndex
    parent: null
    common_fields: false
    fields:
      - { name: species, type: enum, source: input, description: "PINE | OAK | MIXED" }
      - { name: price_per_mbf_cents, type: integer, source: input, description: "Lumber cost per thousand board feet, in cents", constraints: ">= 0" }
      - { name: effective_from, type: datetime, source: input, description: "Start of effective window (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "End of effective window (exclusive); half-open interval [effective_from, effective_to)" }
      - { name: source_note, type: string, source: input, description: "Free-text provenance of the index quote", default: "" }

  - name: SeasonalPriceIndex
    parent: null
    common_fields: false
    fields:
      - { name: season_code, type: string, source: input, description: "Label of the seasonal band, e.g. PEAK-2026-Q3", constraints: "unique across SeasonalPriceIndex" }
      - { name: multiplier_bp, type: integer, source: input, description: "Seasonal multiplier in basis points applied to base sell price (10000 = 1.00x)", constraints: ">= 5000 and <= 20000" }
      - { name: effective_from, type: datetime, source: input, description: "Start of season window (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "End of season window (exclusive); half-open [effective_from, effective_to)" }

  - name: CorePurchaseBatch
    parent: null
    common_fields: true
    fields:
      - { name: supplier_name, type: string, source: input, description: "Name of the core supplier (no separate Supplier entity)" }
      - { name: agreed_unit_price_cents, type: integer, source: input, description: "Negotiated price per core, cents", constraints: ">= 0" }
      - { name: manifest_count, type: integer, source: input, description: "Number of cores the supplier manifest claims", constraints: "> 0" }
      - { name: estimated_grade_mix, type: object, source: input, description: "Supplier's estimated fractions {A: x, B: y, SCRAP: z}, values sum to 1.0" }
      - { name: received_count, type: integer, source: computed, default: 0, description: "Read-only count of CoreUnit rows sorted from this batch" }
      - { name: provisional_settlement_cents, type: integer, source: computed, description: "Read-only provisional payout = manifest_count * agreed_unit_price_cents" }
      - { name: final_settlement_cents, type: integer, source: computed, description: "Read-only final payout after sorting audit = sum over sorted cores of per-grade price schedule; populated at CLOSE" }
      - { name: grade_yield_variance_bp, type: integer, source: computed, description: "Read-only difference between actual vs estimated A-grade yield, basis points; populated at CLOSE" }
      - { name: status, type: enum, source: system, description: "RECEIVING -> SORTING -> AUDIT -> CLOSED" }

  - name: CoreUnit
    parent: null
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: input, description: "FK -> CorePurchaseBatch.id; batch this core arrived in" }
      - { name: grade, type: enum, source: system, description: "UNSORTED -> A | B | SCRAP ; set by sorting" }
      - { name: species, type: enum, source: input, description: "PINE | OAK | MIXED — determines which HT chamber species profile applies" }
      - { name: condition_notes, type: string, source: input, default: "", description: "Sorter's free-text condition note" }
      - { name: repair_cycle_count, type: integer, source: system, default: 0, description: "Number of repair attempts this core has undergone; incremented on each repair completion" }
      - { name: processing_status, type: enum, source: system, description: "YARD -> IN_REPAIR -> REPAIRED | GRINDING_QUEUED | GROUND" }

  - name: RepairWorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: core_unit_id, type: string, source: input, description: "FK -> CoreUnit.id; the core being repaired" }
      - { name: target_spec_id, type: string, source: input, description: "FK -> PalletSpec.id; spec the repaired pallet will conform to — drives the recycled InventoryLot's spec_id at completion" }
      - { name: target_grade, type: enum, source: input, description: "A | B — the grade the repair is trying to certify to" }
      - { name: labor_minutes_estimate, type: integer, source: input, description: "Estimated labor minutes", constraints: "> 0" }
      - { name: parts_cost_cents, type: integer, source: input, default: 0, description: "Replacement boards/plugs cost in cents", constraints: ">= 0" }
      - { name: actual_labor_minutes, type: integer, source: computed, description: "Read-only actual labor recorded at completion" }
      - { name: outcome_grade, type: enum, source: computed, description: "Read-only certified grade at completion: A | B | FAILED" }
      - { name: status, type: enum, source: system, description: "OPEN -> IN_PROGRESS -> COMPLETED | ABORTED" }

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - { name: spec_id, type: string, source: input, description: "FK -> PalletSpec.id; which spec the pallets conform to" }
      - { name: origin_type, type: enum, source: input, description: "NEW_BUILD | RECYCLED_REPAIR" }
      - { name: quantity_total, type: integer, source: input, description: "Pallets placed into the lot", constraints: "> 0" }
      - { name: quantity_available, type: integer, source: computed, description: "Read-only = quantity_total - sum(active reservations against this lot)" }
      - { name: quality_grade, type: enum, source: system, description: "NEW | A | B ; NEW_BUILD lots default to NEW but may be created at A or B after inspection; RECYCLED_REPAIR lots carry the repair outcome grade" }
      - { name: heat_treat_status, type: enum, source: system, description: "NOT_REQUIRED | PENDING_HT | HT_CERTIFIED — parallel dimension to quality_grade" }
      - { name: ispm15_mark_id, type: string, source: computed, description: "Read-only ISPM-15 stamp mark id assigned by the certifying HeatTreatmentRun; null until stamped" }
      - { name: unit_cost_cents, type: integer, source: computed, description: "Read-only blended unit cost: NEW_BUILD from lumber index at creation; RECYCLED_REPAIR from core price + repair cost" }
      - { name: status, type: enum, source: system, description: "AVAILABLE -> DEPLETED | QUARANTINED" }

  - name: HeatTreatmentRun
    parent: null
    common_fields: true
    fields:
      - { name: chamber_code, type: string, source: input, description: "Which HT chamber (physical oven) the run occupies" }
      - { name: species_profile, type: enum, source: input, description: "PINE | OAK | MIXED — all lots in the run must match this species profile via their spec's lumber_species" }
      - { name: capacity_pallets, type: integer, source: input, description: "Maximum pallets the chamber holds this run", constraints: "> 0" }
      - { name: loaded_pallets, type: integer, source: computed, default: 0, description: "Read-only pallets assigned to this run" }
      - { name: started_at, type: datetime, source: computed, description: "Read-only timestamp when run started" }
      - { name: completed_at, type: datetime, source: computed, description: "Read-only timestamp when run completed" }
      - { name: ispm15_mark_id, type: string, source: computed, description: "Read-only ISPM-15 stamp identifier minted at completion, format HT-<chamber_code>-<yyyymmdd>-<seq>" }
      - { name: status, type: enum, source: system, description: "STAGING -> RUNNING -> COMPLETED | FAILED" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Customer company name", constraints: "unique across Customer" }
      - { name: pool_credit_balance_cents, type: integer, source: computed, default: 0, description: "Read-only accumulated pickup credit available to offset invoices" }
      - { name: pool_units_outstanding, type: integer, source: computed, default: 0, description: "Read-only pallets the customer currently holds from the rental pool" }
      - { name: credit_hold, type: boolean, source: system, default: false, description: "When true, new orders are rejected" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> SUSPENDED | CLOSED" }

  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; ordering customer" }
      - { name: order_date, type: datetime, source: system, description: "Server-stamped order placement time (logical clock); drives which LumberPriceIndex/SeasonalPriceIndex rows apply" }
      - { name: requested_delivery_date, type: datetime, source: input, description: "Customer-requested delivery date" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Read-only sum over OrderLine.extended_price_cents (per-line rounded then summed)" }
      - { name: seasonal_adjustment_cents, type: integer, source: computed, description: "Read-only seasonal index uplift = subtotal_cents * (multiplier_bp - 10000) / 10000, rounded half-up" }
      - { name: pool_credit_applied_cents, type: integer, source: computed, default: 0, description: "Read-only pickup credit applied at CONFIRM" }
      - { name: total_cents, type: integer, source: computed, description: "Read-only = subtotal_cents + seasonal_adjustment_cents - pool_credit_applied_cents" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID -> PAID | CREDIT_SETTLED — parallel dimension" }
      - { name: fulfillment_status, type: enum, source: system, description: "DRAFT -> CONFIRMED -> ALLOCATED -> SHIPPED -> DELIVERED | CANCELLED — parallel dimension" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> SalesOrder.id; owning order" }
      - { name: spec_id, type: string, source: input, description: "FK -> PalletSpec.id; spec ordered" }
      - { name: quantity, type: integer, source: input, constraints: "> 0", description: "Pallets ordered" }
      - { name: quality_grade_requested, type: enum, source: input, description: "NEW | A | B" }
      - { name: heat_treatment_required, type: boolean, source: input, default: false, description: "Whether line requires HT_CERTIFIED lots (defaults from spec.requires_heat_treatment_default when omitted)" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Read-only base unit price at order time (price book by grade, before seasonal)" }
      - { name: extended_price_cents, type: integer, source: computed, description: "Read-only = quantity * unit_price_cents, rounded half-up per line BEFORE summing into subtotal" }
      - { name: allocated_lot_id, type: string, source: computed, description: "FK -> InventoryLot.id; lot this line was allocated from (null until ALLOCATED)" }
      - { name: status, type: enum, source: system, description: "OPEN -> ALLOCATED -> FULFILLED | CANCELLED" }

  - name: PoolReturn
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; returning customer" }
      - { name: returned_count, type: integer, source: input, constraints: "> 0", description: "Pallets physically returned" }
      - { name: grade_on_return, type: enum, source: input, description: "A | B | SCRAP — assessed condition at the dock" }
      - { name: credit_per_unit_cents, type: integer, source: computed, description: "Read-only per-unit credit from the pool credit tier table by grade_on_return" }
      - { name: total_credit_cents, type: integer, source: computed, description: "Read-only = returned_count * credit_per_unit_cents" }
      - { name: route_stop_id, type: string, source: input, description: "FK -> RouteStop.id; the pickup stop this return was collected on (nullable for dock drop-off)", default: null }
      - { name: status, type: enum, source: system, description: "LOGGED -> GRADED -> CREDITED | DISPUTED" }

  - name: DeliveryRoute
    parent: null
    common_fields: true
    fields:
      - { name: route_date, type: datetime, source: input, description: "Calendar date the route runs" }
      - { name: trailer_cube_capacity_cuft, type: number, source: input, description: "Usable trailer cube in cubic feet", constraints: "> 0" }
      - { name: cube_used_cuft, type: number, source: computed, default: 0, description: "Read-only sum of cube of all confirmed stops' loads" }
      - { name: planned_miles, type: number, source: input, description: "Planned route miles", constraints: "> 0" }
      - { name: provisional_margin_cents, type: integer, source: computed, description: "Read-only margin computed at PLAN from stop revenue estimates minus per-mile cost" }
      - { name: final_margin_cents, type: integer, source: computed, description: "Read-only margin recomputed at CLOSE from actual delivered lines and actual fuel surcharge" }
      - { name: fuel_surcharge_cents, type: integer, source: input, default: 0, description: "Actual fuel surcharge recorded at CLOSE", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "PLAN -> DISPATCHED -> CLOSED | CANCELLED" }

  - name: RouteStop
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> DeliveryRoute.id; owning route" }
      - { name: stop_sequence, type: integer, source: input, constraints: ">= 1", description: "Position in the route; unique within route" }
      - { name: order_id, type: string, source: input, description: "FK -> SalesOrder.id; order delivered at this stop (null for pure-pickup stops)" }
      - { name: stop_type, type: enum, source: input, description: "DELIVERY | PICKUP | MIXED" }
      - { name: load_cube_cuft, type: number, source: computed, description: "Read-only cube consumed by this stop's delivery load = sum over delivered lines of quantity * spec.unit_cube_cuft" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> ARRIVED -> COMPLETED | SKIPPED" }

  - name: GrindingBatch
    parent: null
    common_fields: true
    fields:
      - { name: input_core_ids, type: array, source: input, description: "List of CoreUnit.id values (grade SCRAP, processing_status GRINDING_QUEUED) fed into this grind run" }
      - { name: input_count, type: integer, source: computed, description: "Read-only = len(input_core_ids) captured at create" }
      - { name: output_fiber_cuyd, type: number, source: input, description: "Cubic yards of fiber/mulch produced, recorded at completion", constraints: ">= 0" }
      - { name: yield_ratio, type: number, source: computed, description: "Read-only = output_fiber_cuyd / input_count, 4 decimal places round_half_up" }
      - { name: revenue_cents, type: integer, source: input, default: 0, description: "Fiber sale revenue credited to the plant P&L", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "QUEUED -> GRINDING -> COMPLETED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PalletSpec
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /pallet-ops/specs/{id}/activate
        actor: PlantManager
        preconditions:
          - "spec status == DRAFT (else ERR_SPEC_NOT_DRAFT)"
        side_effects:
          - "spec becomes selectable for InventoryLot and OrderLine creation"
      - from: ACTIVE
        to: RETIRED
        trigger: POST /pallet-ops/specs/{id}/retire
        actor: PlantManager
        preconditions:
          - "no InventoryLot with spec_id == id and status == AVAILABLE (else ERR_SPEC_HAS_STOCK)"
          - "no OrderLine with spec_id == id and status IN {OPEN, ALLOCATED} (else ERR_SPEC_ON_OPEN_ORDER)"
        side_effects:
          - "spec no longer selectable for new lots or lines"

  - entity: CorePurchaseBatch
    initial_state: RECEIVING
    terminal_states: [CLOSED]
    transitions:
      - from: RECEIVING
        to: SORTING
        trigger: POST /pallet-ops/core-batches/{id}/begin-sorting
        actor: YardSupervisor
        preconditions:
          - "batch status == RECEIVING (else ERR_BATCH_NOT_RECEIVING)"
        side_effects: []
      - from: SORTING
        to: AUDIT
        trigger: POST /pallet-ops/core-batches/{id}/finish-sorting
        actor: YardSupervisor
        preconditions:
          - "batch status == SORTING (else ERR_BATCH_NOT_SORTING)"
          - "every CoreUnit with batch_id == id has grade != UNSORTED (else ERR_CORES_UNSORTED)"
        side_effects:
          - "received_count recomputed = count(CoreUnit where batch_id == id)"
      - from: AUDIT
        to: CLOSED
        trigger: POST /pallet-ops/core-batches/{id}/close
        actor: ProcurementManager
        preconditions:
          - "batch status == AUDIT (else ERR_BATCH_NOT_AUDIT)"
        side_effects:
          - "final_settlement_cents computed per settlement_final calculation (per-grade price schedule applied to sorted cores, chronological by CoreUnit.created_at)"
          - "grade_yield_variance_bp computed per grade_yield_variance calculation"
          - "provisional_settlement_cents retained for variance reporting (NOT zeroed)"

  - entity: CoreUnit
    initial_state: "grade=UNSORTED, processing_status=YARD"
    terminal_states: ["processing_status=GROUND"]
    transitions:
      - from: "grade=UNSORTED"
        to: "grade=A | B | SCRAP"
        trigger: POST /pallet-ops/core-units/{id}/sort
        actor: YardSupervisor
        preconditions:
          - "owning CorePurchaseBatch status == SORTING (else ERR_BATCH_NOT_SORTING)"
          - "core grade == UNSORTED (else ERR_CORE_ALREADY_SORTED)"
          - "if payload grade == SCRAP then condition_notes must be non-empty (else ERR_SCRAP_NOTE_REQUIRED)"
        side_effects:
          - "if grade == SCRAP: processing_status -> GRINDING_QUEUED"
      - from: "processing_status=YARD, grade IN {A,B}"
        to: "processing_status=IN_REPAIR"
        trigger: POST /pallet-ops/repair-orders (creates RepairWorkOrder for this core)
        actor: YardSupervisor
        preconditions:
          - "core grade IN {A, B} (else ERR_CORE_NOT_REPAIRABLE)"
          - "core processing_status == YARD (else ERR_CORE_NOT_IN_YARD)"
          - "no RepairWorkOrder with core_unit_id == id and status IN {OPEN, IN_PROGRESS} (else ERR_REPAIR_ALREADY_OPEN)"
        side_effects:
          - "RepairWorkOrder created with status OPEN"
      - from: "processing_status=IN_REPAIR"
        to: "processing_status=REPAIRED"
        trigger: POST /pallet-ops/repair-orders/{woId}/complete with outcome_grade IN {A, B}
        actor: YardSupervisor
        preconditions:
          - "work order status == IN_PROGRESS (else ERR_WO_NOT_IN_PROGRESS)"
        side_effects:
          - "repair_cycle_count incremented by 1"
          - "InventoryLot created (origin_type=RECYCLED_REPAIR, quality_grade=outcome_grade, quantity_total=1, spec resolved from work order's target spec)"
          - "if repair_cycle_count reaches MAX_REPAIR_CYCLES (3) and outcome is FAILED next time, core must be re-sorted to SCRAP"
      - from: "processing_status=IN_REPAIR"
        to: "processing_status=YARD (cycle)"
        trigger: POST /pallet-ops/repair-orders/{woId}/complete with outcome_grade == FAILED
        actor: YardSupervisor
        preconditions:
          - "work order status == IN_PROGRESS (else ERR_WO_NOT_IN_PROGRESS)"
        side_effects:
          - "repair_cycle_count incremented by 1"
          - "grade reverts to UNSORTED (cycle back into sorting); a new CoreUnit row is NOT created — the same row cycles (self-referential rework_of_id set only when a fresh sort creates a derived record; in-place cycling keeps the same id)"
      - from: "processing_status=GRINDING_QUEUED"
        to: "processing_status=GROUND"
        trigger: POST /pallet-ops/grinding-batches/{id}/complete
        actor: YardSupervisor
        preconditions:
          - "grinding batch status == GRINDING (else ERR_GRIND_NOT_RUNNING)"
          - "core id in grinding batch input_core_ids"
        side_effects:
          - "core processing_status -> GROUND (terminal)"

  - entity: RepairWorkOrder
    initial_state: OPEN
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: POST /pallet-ops/repair-orders/{id}/start
        actor: YardSupervisor
        preconditions:
          - "work order status == OPEN (else ERR_WO_NOT_OPEN)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: POST /pallet-ops/repair-orders/{id}/complete
        actor: YardSupervisor
        preconditions:
          - "work order status == IN_PROGRESS (else ERR_WO_NOT_IN_PROGRESS)"
          - "payload outcome_grade IN {A, B, FAILED} (else ERR_INVALID_REQUEST)"
        side_effects:
          - "actual_labor_minutes recorded from payload"
          - "CoreUnit side effects per CoreUnit transitions above (cycle or repaired, InventoryLot creation)"
      - from: OPEN
        to: ABORTED
        trigger: POST /pallet-ops/repair-orders/{id}/abort
        actor: YardSupervisor
        preconditions:
          - "work order status == OPEN (else ERR_WO_NOT_OPEN)"
        side_effects:
          - "CoreUnit.processing_status -> YARD (release the core)"

  - entity: InventoryLot
    initial_state: "status=AVAILABLE, heat_treat_status=PENDING_HT or NOT_REQUIRED"
    terminal_states: [DEPLETED, QUARANTINED]
    transitions:
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system (automatic when quantity_available reaches 0 after an allocation)"
        actor: system
        preconditions: []
        side_effects:
          - "lot no longer selectable by the allocation selector"
      - from: AVAILABLE
        to: QUARANTINED
        trigger: POST /pallet-ops/inventory-lots/{id}/quarantine
        actor: PlantManager
        preconditions:
          - "lot status == AVAILABLE (else ERR_LOT_NOT_AVAILABLE)"
          - "no OrderLine with allocated_lot_id == id and status == ALLOCATED (else ERR_LOT_HAS_ALLOCATIONS)"
        side_effects:
          - "lot excluded from allocation selector"
      - from: "heat_treat_status=PENDING_HT"
        to: "heat_treat_status=HT_CERTIFIED"
        trigger: POST /pallet-ops/ht-runs/{id}/complete
        actor: HeatTreatOperator
        preconditions:
          - "run status == RUNNING (else ERR_HT_NOT_RUNNING)"
          - "lot was assigned to this run"
        side_effects:
          - "ispm15_mark_id set to run's ispm15_mark_id"
          - "quality_grade unchanged (parallel dimension)"
      - from: "heat_treat_status=PENDING_HT or HT_CERTIFIED"
        to: "heat_treat_status=NOT_REQUIRED"
        trigger: "never (no backward transition on heat_treat_status)"
        actor: system
        preconditions: []
        side_effects: []
        note: "heat_treat_status is monotonic PENDING_HT -> HT_CERTIFIED; NOT_REQUIRED lots never enter it"

  - entity: HeatTreatmentRun
    initial_state: STAGING
    terminal_states: [COMPLETED, FAILED]
    transitions:
      - from: STAGING
        to: RUNNING
        trigger: POST /pallet-ops/ht-runs/{id}/start
        actor: HeatTreatOperator
        preconditions:
          - "run status == STAGING (else ERR_HT_NOT_STAGING)"
          - "loaded_pallets >= 1 (else ERR_HT_EMPTY)"
          - "no other HeatTreatmentRun with same chamber_code and status == RUNNING (else ERR_CHAMBER_OCCUPIED)"
        side_effects:
          - "started_at stamped from logical clock"
      - from: RUNNING
        to: COMPLETED
        trigger: POST /pallet-ops/ht-runs/{id}/complete
        actor: HeatTreatOperator
        preconditions:
          - "run status == RUNNING (else ERR_HT_NOT_RUNNING)"
          - "logical clock now - started_at >= HT_MIN_DURATION_HOURS (6h) (else ERR_HT_DWELL_SHORT)"
        side_effects:
          - "completed_at stamped; ispm15_mark_id minted"
          - "every assigned InventoryLot heat_treat_status -> HT_CERTIFIED with ispm15_mark_id copied"
      - from: RUNNING
        to: FAILED
        trigger: POST /pallet-ops/ht-runs/{id}/fail
        actor: HeatTreatOperator
        preconditions:
          - "run status == RUNNING (else ERR_HT_NOT_RUNNING)"
        side_effects:
          - "assigned lots REMAIN heat_treat_status=PENDING_HT and are unassigned (free to join a new run)"

  - entity: Customer
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /pallet-ops/customers/{id}/suspend
        actor: SalesRep
        preconditions:
          - "customer status == ACTIVE (else ERR_CUSTOMER_NOT_ACTIVE)"
        side_effects:
          - "credit_hold = true"
          - "open SalesOrder creation rejected while SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /pallet-ops/customers/{id}/reinstate
        actor: SalesRep
        preconditions:
          - "customer status == SUSPENDED (else ERR_CUSTOMER_NOT_SUSPENDED)"
        side_effects:
          - "credit_hold = false"
      - from: ACTIVE
        to: CLOSED
        trigger: POST /pallet-ops/customers/{id}/close
        actor: SalesRep
        preconditions:
          - "customer status == ACTIVE (else ERR_CUSTOMER_NOT_ACTIVE)"
          - "pool_units_outstanding == 0 (else ERR_POOL_UNITS_OUTSTANDING)"
          - "no SalesOrder with fulfillment_status IN {DRAFT, CONFIRMED, ALLOCATED, SHIPPED} (else ERR_OPEN_ORDERS_EXIST)"
        side_effects: []

  - entity: SalesOrder
    initial_state: "fulfillment_status=DRAFT, payment_status=UNPAID"
    terminal_states: ["fulfillment_status=DELIVERED", "fulfillment_status=CANCELLED"]
    transitions:
      - from: "fulfillment_status=DRAFT"
        to: "fulfillment_status=CONFIRMED"
        trigger: POST /pallet-ops/orders/{id}/confirm
        actor: SalesRep
        preconditions:
          - "fulfillment_status == DRAFT (else ERR_ORDER_NOT_DRAFT)"
          - "at least one OrderLine with order_id == id and status == OPEN (else ERR_ORDER_EMPTY)"
          - "customer.credit_hold == false and customer.status == ACTIVE (else ERR_CUSTOMER_CREDIT_HOLD)"
          - "expected_order_version matches current version (OCC, else ERR_STALE_VERSION)"
        side_effects:
          - "subtotal_cents, seasonal_adjustment_cents computed (order_pricing calculation)"
          - "pool_credit_applied_cents = min(customer.pool_credit_balance_cents, subtotal + seasonal_adjustment); customer.pool_credit_balance_cents debited by that amount (ledger sync)"
          - "total_cents computed"
          - "increments SalesOrder.version by 1"
      - from: "fulfillment_status=CONFIRMED"
        to: "fulfillment_status=ALLOCATED"
        trigger: POST /pallet-ops/orders/{id}/allocate
        actor: SalesRep
        preconditions:
          - "fulfillment_status == CONFIRMED (else ERR_ORDER_NOT_CONFIRMED)"
          - "expected_order_version matches current version (OCC, else ERR_STALE_VERSION)"
          - "for every OPEN line, the allocation selector finds a lot with sufficient quantity_available (else ERR_INSUFFICIENT_STOCK)"
          - "for lines with heat_treatment_required == true, the selected lot must have heat_treat_status == HT_CERTIFIED (else ERR_HT_REQUIRED)"
        side_effects:
          - "each OPEN OrderLine: allocated_lot_id set, status -> ALLOCATED; lot.quantity_available debited (reservation commit)"
          - "lots reaching quantity_available == 0 auto-transition to DEPLETED"
          - "increments SalesOrder.version by 1"
      - from: "fulfillment_status=ALLOCATED"
        to: "fulfillment_status=SHIPPED"
        trigger: POST /pallet-ops/routes/{routeId}/dispatch (route containing a stop for this order)
        actor: FleetPlanner
        preconditions:
          - "route status == PLAN (else ERR_ROUTE_NOT_PLAN)"
          - "every stop's order has fulfillment_status == ALLOCATED (else ERR_ORDER_NOT_ALLOCATED)"
        side_effects:
          - "order fulfillment_status -> SHIPPED"
          - "OrderLine status ALLOCATED -> FULFILLED for lines on this route's stops"
          - "route provisional_margin_cents computed (route_margin_provisional)"
      - from: "fulfillment_status=SHIPPED"
        to: "fulfillment_status=DELIVERED"
        trigger: POST /pallet-ops/route-stops/{id}/complete with route_stop.order_id == this order
        actor: FleetPlanner
        preconditions:
          - "stop status == ARRIVED (else ERR_STOP_NOT_ARRIVED)"
        side_effects:
          - "order fulfillment_status -> DELIVERED when all its lines' stops are COMPLETED"
          - "customer.pool_units_outstanding incremented by delivered pool quantity"
      - from: "fulfillment_status=DRAFT or CONFIRMED"
        to: "fulfillment_status=CANCELLED"
        trigger: POST /pallet-ops/orders/{id}/cancel
        actor: SalesRep
        preconditions:
          - "fulfillment_status IN {DRAFT, CONFIRMED} (else ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "if pool_credit_applied_cents > 0: customer.pool_credit_balance_cents re-credited (compensation)"
          - "OPEN OrderLines -> CANCELLED"
      - from: "payment_status=UNPAID"
        to: "payment_status=PAID"
        trigger: POST /pallet-ops/orders/{id}/record-payment
        actor: SalesRep
        preconditions:
          - "payment_status == UNPAID (else ERR_ORDER_ALREADY_SETTLED)"
          - "fulfillment_status NOT IN {DRAFT, CANCELLED} (else ERR_INVALID_STATE — payment only against priced orders)"
          - "payload amount_cents == total_cents (exact settlement, else ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "payment_status -> PAID (fulfillment axis untouched — parallel dimensions)"

  - entity: PoolReturn
    initial_state: LOGGED
    terminal_states: [CREDITED, DISPUTED]
    transitions:
      - from: LOGGED
        to: GRADED
        trigger: POST /pallet-ops/pool-returns/{id}/grade
        actor: YardSupervisor
        preconditions:
          - "return status == LOGGED (else ERR_RETURN_NOT_LOGGED)"
          - "grade_on_return re-assessment recorded"
        side_effects:
          - "credit_per_unit_cents resolved from pool credit tier table by grade_on_return"
          - "total_credit_cents computed"
      - from: GRADED
        to: CREDITED
        trigger: POST /pallet-ops/pool-returns/{id}/credit
        actor: SalesRep
        preconditions:
          - "return status == GRADED (else ERR_RETURN_NOT_GRADED)"
          - "customer.pool_units_outstanding >= returned_count (else ERR_RETURN_EXCEEDS_OUTSTANDING)"
        side_effects:
          - "customer.pool_credit_balance_cents += total_credit_cents (ledger sync)"
          - "customer.pool_units_outstanding -= returned_count"
          - "if grade_on_return == SCRAP: a CoreUnit with grade=SCRAP, processing_status=GRINDING_QUEUED is created per returned unit (cross-entity cascade into the grinding pipeline)"
          - "if grade_on_return IN {A, B}: returned units enter CoreUnit with grade set, processing_status=YARD (re-enter the repair pipeline)"
      - from: LOGGED
        to: DISPUTED
        trigger: POST /pallet-ops/pool-returns/{id}/dispute
        actor: SalesRep
        preconditions:
          - "return status == LOGGED (else ERR_RETURN_NOT_LOGGED)"
        side_effects: []

  - entity: DeliveryRoute
    initial_state: PLAN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLAN
        to: DISPATCHED
        trigger: POST /pallet-ops/routes/{id}/dispatch
        actor: FleetPlanner
        preconditions:
          - "route status == PLAN (else ERR_ROUTE_NOT_PLAN)"
          - "at least one RouteStop with route_id == id (else ERR_ROUTE_EMPTY)"
          - "cube_used_cuft <= trailer_cube_capacity_cuft (else ERR_CUBE_OVERFLOW)"
          - "expected_route_version matches current version (OCC, else ERR_STALE_VERSION)"
        side_effects:
          - "provisional_margin_cents computed per route_margin_provisional"
          - "every stop's order: fulfillment_status ALLOCATED -> SHIPPED (cross-entity)"
          - "increments DeliveryRoute.version by 1"
      - from: DISPATCHED
        to: CLOSED
        trigger: POST /pallet-ops/routes/{id}/close
        actor: FleetPlanner
        preconditions:
          - "route status == DISPATCHED (else ERR_ROUTE_NOT_DISPATCHED)"
          - "every RouteStop with route_id == id has status IN {COMPLETED, SKIPPED} (else ERR_STOPS_OPEN)"
        side_effects:
          - "final_margin_cents computed per route_margin_final (actual fuel_surcharge_cents from payload; SKIPPED stops contribute zero revenue)"
          - "provisional_margin_cents retained for variance reporting"
      - from: PLAN
        to: CANCELLED
        trigger: POST /pallet-ops/routes/{id}/cancel
        actor: FleetPlanner
        preconditions:
          - "route status == PLAN (else ERR_ROUTE_NOT_PLAN)"
        side_effects:
          - "all SCHEDULED RouteStops -> SKIPPED"

  - entity: RouteStop
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, SKIPPED]
    transitions:
      - from: SCHEDULED
        to: ARRIVED
        trigger: POST /pallet-ops/route-stops/{id}/arrive
        actor: FleetPlanner
        preconditions:
          - "stop status == SCHEDULED (else ERR_STOP_NOT_SCHEDULED)"
          - "owning route status == DISPATCHED (else ERR_ROUTE_NOT_DISPATCHED)"
          - "all stops on same route with stop_sequence < this stop_sequence have status IN {COMPLETED, SKIPPED} (else ERR_STOP_OUT_OF_SEQUENCE)"
        side_effects: []
      - from: ARRIVED
        to: COMPLETED
        trigger: POST /pallet-ops/route-stops/{id}/complete
        actor: FleetPlanner
        preconditions:
          - "stop status == ARRIVED (else ERR_STOP_NOT_ARRIVED)"
        side_effects:
          - "if stop_type IN {DELIVERY, MIXED}: order delivery side effects per SalesOrder SHIPPED->DELIVERED"
          - "if stop_type IN {PICKUP, MIXED}: linked PoolReturn (route_stop_id == id) may proceed to GRADED"
      - from: SCHEDULED
        to: SKIPPED
        trigger: POST /pallet-ops/route-stops/{id}/skip
        actor: FleetPlanner
        preconditions:
          - "stop status == SCHEDULED (else ERR_STOP_NOT_SCHEDULED)"
          - "owning route status IN {DISPATCHED, PLAN with route cancellation}"
        side_effects:
          - "stop contributes zero revenue to route_margin_final"

  - entity: GrindingBatch
    initial_state: QUEUED
    terminal_states: [COMPLETED]
    transitions:
      - from: QUEUED
        to: GRINDING
        trigger: POST /pallet-ops/grinding-batches/{id}/start
        actor: YardSupervisor
        preconditions:
          - "batch status == QUEUED (else ERR_GRIND_NOT_QUEUED)"
          - "every core id in input_core_ids has grade == SCRAP and processing_status == GRINDING_QUEUED (else ERR_CORE_NOT_GRINDABLE)"
        side_effects: []
      - from: GRINDING
        to: COMPLETED
        trigger: POST /pallet-ops/grinding-batches/{id}/complete
        actor: YardSupervisor
        preconditions:
          - "batch status == GRINDING (else ERR_GRIND_NOT_RUNNING)"
        side_effects:
          - "output_fiber_cuyd recorded from payload; yield_ratio computed"
          - "every input core processing_status -> GROUND (terminal)"

# =============================================================================
# 1.2.1 Concurrency Rules (true races only — OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: order-confirm-stale-version
    parent_entity: SalesOrder
    write_endpoint: POST /pallet-ops/orders/{id}/confirm
    occ_field: expected_order_version
    description: |
      Confirming a SalesOrder whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      just confirmed the order (advancing version and debiting pool credit) and
      the current writer's view of the order's credit application is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: order-allocate-stale-version
    parent_entity: SalesOrder
    write_endpoint: POST /pallet-ops/orders/{id}/allocate
    occ_field: expected_order_version
    description: |
      Allocating stock against a SalesOrder whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just allocated the order (advancing version and committing lot
      reservations) and the current writer's view of remaining stock is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: route-dispatch-stale-version
    parent_entity: DeliveryRoute
    write_endpoint: POST /pallet-ops/routes/{id}/dispatch
    occ_field: expected_route_version
    description: |
      Dispatching a DeliveryRoute whose version has advanced since the client
      last observed it is rejected. This captures the case where another writer
      has just dispatched the route (advancing version and freezing cube/load
      composition) and the current writer's view of trailer cube is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: board_feet_per_pallet
    trigger: "on PalletSpec creation (computed once, stored)"
    algorithm: aggregation
    formula: |
      deck_boards = ceil(board_count * 0.6)
      stringer_boards = board_count - deck_boards
      # deck boards: length_in long, 3.5in wide, 0.5in thick
      # stringers:   length_in long, 3.5in wide, 1.5in thick (nominal 2x4)
      deck_bf = deck_boards * (length_in * 3.5 * 0.5) / 144.0
      stringer_bf = stringer_boards * (length_in * 3.5 * 1.5) / 144.0
      board_feet_per_pallet = round_half_up(deck_bf + stringer_bf, 2)
    input_set: "single PalletSpec row being created"
    constants:
      DECK_FRACTION: 0.6
      DECK_SECTION_IN2: 1.75
      STRINGER_SECTION_IN2: 5.25
      IN2_PER_BF: 144
    precision: "2 decimal places, round_half_up"

  - name: new_build_unit_cost
    trigger: "on InventoryLot creation with origin_type == NEW_BUILD"
    algorithm: tiered_pricing
    formula: |
      # Lumber index lookup: row whose species == spec.lumber_species AND
      # effective_from <= lot.created_at < effective_to (half-open).
      # If several rows match (overlap), the one with LATEST effective_from wins;
      # tie-break: latest created_at. If none match -> ERR_PRICE_INDEX_MISSING.
      price_cents_per_bf = matched LumberPriceIndex.price_per_mbf_cents / 1000.0
      raw_cost = board_feet_per_pallet * price_cents_per_bf
      # Overhead tier on top of lumber cost, tiered by lot quantity_total:
      #   qty < 100            -> overhead 18%
      #   100 <= qty < 500     -> overhead 12%
      #   qty >= 500           -> overhead 9%
      unit_cost_cents = round_half_up(raw_cost * (1 + overhead_rate), 0)
    input_set: "single InventoryLot row being created; LumberPriceIndex rows for the spec's species"
    constants:
      OVERHEAD_TIER1_MAX: 100
      OVERHEAD_TIER2_MAX: 500
      OVERHEAD_RATE_T1: 0.18
      OVERHEAD_RATE_T2: 0.12
      OVERHEAD_RATE_T3: 0.09
      LABOR_RATE_CENTS_PER_MIN: 95
    precision: "integer cents, round_half_up"
    variants:
      - name: recycled_repair_unit_cost
        when: "origin_type == RECYCLED_REPAIR"
        difference: "unit_cost_cents = round_half_up(core unit price from owning batch's per-grade price schedule (A 1.00x / B 0.60x of agreed_unit_price_cents) + work order parts_cost_cents + LABOR_RATE_CENTS_PER_MIN (95) * actual_labor_minutes, 0); no lumber index, no overhead tier"

  - name: order_pricing
    trigger: "unit_price_cents resolved on OrderLine creation (grade price book); full pricing on POST /pallet-ops/orders/{id}/confirm"
    algorithm: aggregation
    formula: |
      # Grade price book (base sell price per pallet, cents) — pinned constants:
      #   quality_grade_requested NEW -> PRICE_NEW_CENTS (1500)
      #   quality_grade_requested A   -> PRICE_A_CENTS   (1100)
      #   quality_grade_requested B   -> PRICE_B_CENTS   (800)
      # unit_price_cents is stamped on the OrderLine at creation time.
      # Per-line rounding THEN sum (rounding order pinned — do NOT sum then round):
      for each OPEN OrderLine of the order:
        extended_price_cents = round_half_up(quantity * unit_price_cents, 0)
      subtotal_cents = sum(extended_price_cents)
      # Seasonal adjustment: index row whose effective_from <= order.order_date < effective_to (half-open).
      # If none matches, multiplier_bp = 10000 (no adjustment).
      seasonal_adjustment_cents = round_half_up(subtotal_cents * (multiplier_bp - 10000) / 10000, 0)
      # Pool credit capped at invoice value:
      pool_credit_applied_cents = min(customer.pool_credit_balance_cents, subtotal_cents + seasonal_adjustment_cents)
      total_cents = subtotal_cents + seasonal_adjustment_cents - pool_credit_applied_cents
      # payment axis: if total_cents == 0 after credit, payment_status -> CREDIT_SETTLED; else UNPAID
    input_set: "order's OPEN OrderLines; SeasonalPriceIndex rows; Customer.pool_credit_balance_cents"
    constants:
      PRICE_NEW_CENTS: 1500
      PRICE_A_CENTS: 1100
      PRICE_B_CENTS: 800
      BASE_MULTIPLIER_BP: 10000
    precision: "integer cents, round_half_up"

  - name: settlement_final
    trigger: "on POST /pallet-ops/core-batches/{id}/close"
    algorithm: chronological
    formula: |
      # Chronological sweep over sorted cores, oldest first:
      # order by CoreUnit.created_at ASC, tie-break CoreUnit.created_at fractional digits then grade A before B before SCRAP.
      # Per-grade price schedule (applied per unit):
      #   grade A     -> agreed_unit_price_cents * GRADE_A_FACTOR (1.00)
      #   grade B     -> agreed_unit_price_cents * GRADE_B_FACTOR (0.60), rounded half-up per unit
      #   grade SCRAP -> SCRAP_VALUE_CENTS (0)
      final_settlement_cents = sum over sorted cores of per-unit price
      # Under-delivery penalty: if received_count < manifest_count, deduct
      #   (manifest_count - received_count) * agreed_unit_price_cents * SHORTAGE_PENALTY_FACTOR (0.25)
      # rounded half-up; floor final settlement at 0.
    input_set: "CoreUnits with batch_id == batch, all grades except UNSORTED"
    constants:
      GRADE_A_FACTOR: 1.00
      GRADE_B_FACTOR: 0.60
      SCRAP_VALUE_CENTS: 0
      SHORTAGE_PENALTY_FACTOR: 0.25
    precision: "integer cents, round_half_up per unit then sum"
    variants:
      - name: settlement_provisional
        when: "computed at batch creation, before sorting"
        difference: "provisional_settlement_cents = manifest_count * agreed_unit_price_cents — pays on the supplier's manifest claim with NO grade mix and NO shortage penalty; the two variants diverge whenever actual grades include B/SCRAP or received_count < manifest_count"

  - name: grade_yield_variance
    trigger: "on POST /pallet-ops/core-batches/{id}/close"
    algorithm: aggregation
    formula: |
      actual_a_frac = count(CoreUnit where batch_id == id and grade == 'A') / received_count
      estimated_a_frac = estimated_grade_mix.A
      grade_yield_variance_bp = round_half_up((actual_a_frac - estimated_a_frac) * 10000, 0)
    input_set: "sorted CoreUnits of the batch; batch.estimated_grade_mix"
    constants: {}
    precision: "integer basis points, round_half_up"

  - name: route_margin_provisional
    trigger: "on POST /pallet-ops/routes/{id}/dispatch"
    algorithm: constraint_propagation
    formula: |
      # revenue side: sum over SCHEDULED stops with stop_type IN {DELIVERY, MIXED}
      #   of their order's total_cents (order must be ALLOCATED).
      # cost side: planned_miles * ROUTE_COST_PER_MILE_CENTS + per-stop fixed cost
      #   STOP_COST_CENTS * count(stops).
      # cube feasibility gate is enforced BEFORE this calc (cube_used <= capacity).
      provisional_margin_cents = revenue_cents - (planned_miles * ROUTE_COST_PER_MILE_CENTS + STOP_COST_CENTS * stop_count)
    input_set: "RouteStops of the route with status == SCHEDULED; their SalesOrders with fulfillment_status == ALLOCATED"
    constants:
      ROUTE_COST_PER_MILE_CENTS: 185
      STOP_COST_CENTS: 4500
    precision: "integer cents (inputs integral; miles * 185 rounded half-up)"

  - name: route_margin_final
    trigger: "on POST /pallet-ops/routes/{id}/close"
    algorithm: constraint_propagation
    formula: |
      # Same shape as provisional BUT:
      #   - SKIPPED stops contribute ZERO revenue (their orders not delivered)
      #   - fuel_surcharge_cents (payload at close) is ADDED to cost
      #   - actual delivered pool pickups: each PoolReturn CREDITED on this route's
      #     stops adds total_credit_cents as a COST (credit owed to customer)
      final_margin_cents = delivered_revenue_cents
                           - (planned_miles * ROUTE_COST_PER_MILE_CENTS
                              + STOP_COST_CENTS * stop_count
                              + fuel_surcharge_cents
                              + pickup_credit_cents)
    input_set: "RouteStops of the route (COMPLETED deliver revenue, SKIPPED zero); PoolReturns with route_stop_id in the route's stops and status == CREDITED"
    constants:
      ROUTE_COST_PER_MILE_CENTS: 185
      STOP_COST_CENTS: 4500
    precision: "integer cents"
    variants:
      - name: provisional_excludes_actuals
        when: "at dispatch time"
        difference: "provisional uses ALL scheduled stops' revenue and excludes fuel_surcharge + pickup credits; final drops skipped-stop revenue and adds both actuals — identical route data yields different margins whenever a stop is skipped, a surcharge exists, or a pickup credits on the route"

  - name: pool_credit_tier
    trigger: "on POST /pallet-ops/pool-returns/{id}/grade"
    algorithm: threshold
    formula: |
      # Tiered per-unit credit by grade_on_return:
      #   A     -> POOL_CREDIT_A_CENTS (700)
      #   B     -> POOL_CREDIT_B_CENTS (350)
      #   SCRAP -> POOL_CREDIT_SCRAP_CENTS (0)
      # Boundary rule: tiers are exact-enum lookups; there is no interpolation.
      total_credit_cents = returned_count * credit_per_unit_cents
    input_set: "single PoolReturn row"
    constants:
      POOL_CREDIT_A_CENTS: 700
      POOL_CREDIT_B_CENTS: 350
      POOL_CREDIT_SCRAP_CENTS: 0
    precision: "integer cents"

  - name: allocation_selector
    trigger: "on POST /pallet-ops/orders/{id}/allocate (per OPEN OrderLine)"
    algorithm: weighted_scoring
    formula: |
      # Candidate set (all four must hold):
      #   lot.spec_id == line.spec_id
      #   lot.status == AVAILABLE
      #   lot.quality_grade == line.quality_grade_requested
      #   lot.quantity_available >= line.quantity
      #   if line.heat_treatment_required: lot.heat_treat_status == HT_CERTIFIED
      #     else: lot.heat_treat_status IN {NOT_REQUIRED, HT_CERTIFIED, PENDING_HT}
      # Ranking expression (lexicographic):
      #   1. origin_preference: RECYCLED_REPAIR lots before NEW_BUILD lots (recycle-first policy)
      #   2. lowest unit_cost_cents
      #   3. earliest lot.created_at
      # Empty candidate set -> ERR_INSUFFICIENT_STOCK (or ERR_HT_REQUIRED when candidates
      # exist but all fail the heat_treat_status filter).
    input_set: "InventoryLots; single OrderLine being allocated"
    constants: {}
    precision: "n/a (selector)"

  - name: grinding_yield
    trigger: "on POST /pallet-ops/grinding-batches/{id}/complete"
    algorithm: aggregation
    formula: |
      yield_ratio = round_half_up(output_fiber_cuyd / input_count, 4)
    input_set: "single GrindingBatch"
    constants: {}
    precision: "4 decimal places, round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and names a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role permitted for this endpoint per RBAC matrix", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path-templated resource ids exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: existence, check: "body-referenced FK ids (spec_id, customer_id, core_unit_id, batch_id, route_id, order_id, route_stop_id) exist", error_id: ERR_REFERENCED_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: business_constraint, check: "request body shape: required fields present, types valid, enums in range", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 6, category: state, check: "OCC expected_*_version matches current parent version — pinned BEFORE state preconditions so a stale writer always gets 412 even when the transition would also be state-invalid", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /pallet-ops/orders/{id}/confirm", "POST /pallet-ops/orders/{id}/allocate", "POST /pallet-ops/routes/{id}/dispatch"] }
  - { priority: 7, category: state, check: "target resource state permits the requested transition (per §1.2 preconditions)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8, category: business_safety, check: "ISPM-15 compliance: allocate with heat_treatment_required=true only from HT_CERTIFIED lots", error_id: ERR_HT_REQUIRED, http_status: 422, applies_to: ["POST /pallet-ops/orders/{id}/allocate"] }
  - { priority: 9, category: business_safety, check: "HT chamber exclusivity: no two RUNNING runs share chamber_code", error_id: ERR_CHAMBER_OCCUPIED, http_status: 409, applies_to: ["POST /pallet-ops/ht-runs/{id}/start"] }
  - { priority: 10, category: business_safety, check: "HT dwell time: complete only when now - started_at >= 6h", error_id: ERR_HT_DWELL_SHORT, http_status: 422, applies_to: ["POST /pallet-ops/ht-runs/{id}/complete"] }
  - { priority: 11, category: business_safety, check: "HT species purity: every assigned lot's spec.lumber_species must equal run.species_profile", error_id: ERR_HT_SPECIES_MISMATCH, http_status: 422, applies_to: ["POST /pallet-ops/ht-runs/{id}/assign-lot"] }
  - { priority: 12, category: business_safety, check: "scrap cores carry condition notes at sort time", error_id: ERR_SCRAP_NOTE_REQUIRED, http_status: 422, applies_to: ["POST /pallet-ops/core-units/{id}/sort"] }
  - { priority: 13, category: business_temporal, check: "route stop sequence order: arrive only after all lower stop_sequence stops are COMPLETED or SKIPPED", error_id: ERR_STOP_OUT_OF_SEQUENCE, http_status: 409, applies_to: ["POST /pallet-ops/route-stops/{id}/arrive"] }
  - { priority: 14, category: business_temporal, check: "LumberPriceIndex effective windows for the same species must not overlap (half-open adjacency allowed)", error_id: ERR_INDEX_WINDOW_OVERLAP, http_status: 409, applies_to: ["POST /pallet-ops/lumber-index"] }
  - { priority: 15, category: business_temporal, check: "SeasonalPriceIndex windows must not overlap regardless of season_code", error_id: ERR_SEASON_WINDOW_OVERLAP, http_status: 409, applies_to: ["POST /pallet-ops/seasonal-index"] }
  - { priority: 16, category: business_constraint, check: "capacity: HT run loaded_pallets + lot.quantity_total <= capacity_pallets on assign", error_id: ERR_HT_CAPACITY_EXCEEDED, http_status: 422, applies_to: ["POST /pallet-ops/ht-runs/{id}/assign-lot"] }
  - { priority: 17, category: business_constraint, check: "trailer cube: adding a stop must keep cube_used_cuft <= trailer_cube_capacity_cuft", error_id: ERR_CUBE_OVERFLOW, http_status: 422, applies_to: ["POST /pallet-ops/routes/{id}/stops", "POST /pallet-ops/routes/{id}/dispatch"] }
  - { priority: 18, category: business_constraint, check: "stop_sequence unique within a route", error_id: ERR_DUPLICATE_STOP_SEQUENCE, http_status: 409, applies_to: ["POST /pallet-ops/routes/{id}/stops"] }
  - { priority: 19, category: business_constraint, check: "repair eligibility: core grade IN {A,B}, processing_status == YARD, no open work order", error_id: ERR_CORE_NOT_REPAIRABLE, http_status: 422, applies_to: ["POST /pallet-ops/repair-orders"] }
  - { priority: 20, category: business_referential, check: "customer must be ACTIVE and not credit_hold to confirm an order", error_id: ERR_CUSTOMER_CREDIT_HOLD, http_status: 422, applies_to: ["POST /pallet-ops/orders/{id}/confirm", "POST /pallet-ops/orders"] }
  - { priority: 21, category: business_referential, check: "pool return credited only when customer.pool_units_outstanding >= returned_count", error_id: ERR_RETURN_EXCEEDS_OUTSTANDING, http_status: 422, applies_to: ["POST /pallet-ops/pool-returns/{id}/credit"] }
  - { priority: 22, category: business_referential, check: "spec cannot retire while available stock or open lines reference it", error_id: ERR_SPEC_HAS_STOCK, http_status: 409, applies_to: ["POST /pallet-ops/specs/{id}/retire"] }
  - { priority: 23, category: business_fiscal, check: "batch close requires all cores sorted (grade != UNSORTED)", error_id: ERR_CORES_UNSORTED, http_status: 409, applies_to: ["POST /pallet-ops/core-batches/{id}/finish-sorting"] }
  - { priority: 24, category: business_fiscal, check: "allocation stock check: selector must find a lot with quantity_available >= line.quantity", error_id: ERR_INSUFFICIENT_STOCK, http_status: 422, applies_to: ["POST /pallet-ops/orders/{id}/allocate"] }
  - { priority: 25, category: business_fiscal, check: "price index must exist covering lot creation date for new-build cost", error_id: ERR_PRICE_INDEX_MISSING, http_status: 422, applies_to: ["POST /pallet-ops/inventory-lots"] }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- PalletSpec ---
  - { method: POST, path: "/pallet-ops/specs", description: "Create a pallet spec (DRAFT)", roles: [PlantManager], code: 201, input: [spec_code, length_in, width_in, height_in, board_count, lumber_species, "requires_heat_treatment_default?"], output: PalletSpec, side_effects: ["board_feet_per_pallet + unit_cube_cuft computed", "status=DRAFT"] }
  - { method: GET, path: "/pallet-ops/specs", description: "List specs", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: ["limit?", "offset?", "status?", "lumber_species?"], output: "PalletSpec[]", side_effects: [] }
  - { method: GET, path: "/pallet-ops/specs/{id}", description: "Get a spec", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: [], output: PalletSpec, side_effects: [] }
  - { method: POST, path: "/pallet-ops/specs/{id}/activate", description: "Activate a DRAFT spec", roles: [PlantManager], code: 200, input: [], output: PalletSpec, side_effects: ["status -> ACTIVE", "increments PalletSpec.version by 1"] }
  - { method: POST, path: "/pallet-ops/specs/{id}/retire", description: "Retire an ACTIVE spec", roles: [PlantManager], code: 200, input: [], output: PalletSpec, side_effects: ["status -> RETIRED", "increments PalletSpec.version by 1"] }

  # --- LumberPriceIndex / SeasonalPriceIndex ---
  - { method: POST, path: "/pallet-ops/lumber-index", description: "Publish a lumber price index row (half-open effective window)", roles: [ProcurementManager], code: 201, input: [species, price_per_mbf_cents, effective_from, effective_to, "source_note?"], output: LumberPriceIndex, side_effects: ["overlap with same-species windows rejected ERR_INDEX_WINDOW_OVERLAP"] }
  - { method: GET, path: "/pallet-ops/lumber-index", description: "List lumber index rows", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: ["limit?", "offset?", "species?"], output: "LumberPriceIndex[]", side_effects: [] }
  - { method: POST, path: "/pallet-ops/seasonal-index", description: "Publish a seasonal price index band", roles: [PlantManager], code: 201, input: [season_code, multiplier_bp, effective_from, effective_to], output: SeasonalPriceIndex, side_effects: ["overlap rejected ERR_SEASON_WINDOW_OVERLAP"] }
  - { method: GET, path: "/pallet-ops/seasonal-index", description: "List seasonal index bands", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: ["limit?", "offset?"], output: "SeasonalPriceIndex[]", side_effects: [] }

  # --- CorePurchaseBatch / CoreUnit ---
  - { method: POST, path: "/pallet-ops/core-batches", description: "Register a core purchase batch (RECEIVING); provisional settlement computed", roles: [ProcurementManager], code: 201, input: [supplier_name, agreed_unit_price_cents, manifest_count, estimated_grade_mix], output: CorePurchaseBatch, side_effects: ["provisional_settlement_cents = manifest_count * agreed_unit_price_cents", "status=RECEIVING"] }
  - { method: GET, path: "/pallet-ops/core-batches", description: "List batches", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: ["limit?", "offset?", "status?"], output: "CorePurchaseBatch[]", side_effects: [] }
  - { method: GET, path: "/pallet-ops/core-batches/{id}", description: "Get a batch", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: [], output: CorePurchaseBatch, side_effects: [] }
  - { method: POST, path: "/pallet-ops/core-batches/{id}/begin-sorting", description: "RECEIVING -> SORTING", roles: [YardSupervisor], code: 200, input: [], output: CorePurchaseBatch, side_effects: ["status -> SORTING", "increments CorePurchaseBatch.version by 1"] }
  - { method: POST, path: "/pallet-ops/core-batches/{id}/finish-sorting", description: "SORTING -> AUDIT (requires all cores sorted)", roles: [YardSupervisor], code: 200, input: [], output: CorePurchaseBatch, side_effects: ["received_count recomputed", "status -> AUDIT", "increments CorePurchaseBatch.version by 1"] }
  - { method: POST, path: "/pallet-ops/core-batches/{id}/close", description: "AUDIT -> CLOSED; computes final settlement and grade-yield variance", roles: [ProcurementManager], code: 200, input: [], output: CorePurchaseBatch, side_effects: ["settlement_final computed", "grade_yield_variance computed", "status -> CLOSED", "increments CorePurchaseBatch.version by 1"] }
  - { method: POST, path: "/pallet-ops/core-units", description: "Receive cores into a batch (bulk create, one row per manifest line item count)", roles: [YardSupervisor], code: 201, input: [batch_id, species, "condition_notes?", "count?"], output: CoreUnit, side_effects: ["grade=UNSORTED", "processing_status=YARD", "batch must be RECEIVING or SORTING (else ERR_INVALID_STATE)"] }
  - { method: GET, path: "/pallet-ops/core-units", description: "List core units (filterable by batch_id, grade, processing_status, rework_of_id)", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: ["limit?", "offset?", "batch_id?", "grade?", "processing_status?"], output: "CoreUnit[]", side_effects: [] }
  - { method: GET, path: "/pallet-ops/core-units/{id}", description: "Get a core unit", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: [], output: CoreUnit, side_effects: [] }
  - { method: POST, path: "/pallet-ops/core-units/{id}/sort", description: "Sort a core into grade A | B | SCRAP", roles: [YardSupervisor], code: 200, input: [grade, "condition_notes?"], output: CoreUnit, side_effects: ["grade set; SCRAP -> processing_status=GRINDING_QUEUED", "increments CoreUnit.version by 1"] }

  # --- RepairWorkOrder ---
  - { method: POST, path: "/pallet-ops/repair-orders", description: "Open a repair work order on a core", roles: [YardSupervisor], code: 201, input: [core_unit_id, target_grade, target_spec_id, labor_minutes_estimate, "parts_cost_cents?"], output: RepairWorkOrder, side_effects: ["CoreUnit.processing_status -> IN_REPAIR", "status=OPEN"] }
  - { method: GET, path: "/pallet-ops/repair-orders", description: "List repair work orders", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: ["limit?", "offset?", "core_unit_id?", "status?", "target_spec_id?"], output: "RepairWorkOrder[]", side_effects: [] }
  - { method: GET, path: "/pallet-ops/repair-orders/{id}", description: "Get a work order", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: [], output: RepairWorkOrder, side_effects: [] }
  - { method: POST, path: "/pallet-ops/repair-orders/{id}/start", description: "OPEN -> IN_PROGRESS", roles: [YardSupervisor], code: 200, input: [], output: RepairWorkOrder, side_effects: ["status -> IN_PROGRESS", "increments RepairWorkOrder.version by 1"] }
  - { method: POST, path: "/pallet-ops/repair-orders/{id}/complete", description: "IN_PROGRESS -> COMPLETED with outcome A | B | FAILED; success creates an InventoryLot, failure cycles the core", roles: [YardSupervisor], code: 200, input: [outcome_grade, actual_labor_minutes], output: RepairWorkOrder, side_effects: ["CoreUnit.repair_cycle_count += 1", "if outcome IN {A,B}: CoreUnit -> REPAIRED + InventoryLot created (unit cost per recycled_repair_unit_cost)", "if outcome == FAILED: CoreUnit grade -> UNSORTED, processing_status -> YARD (cycle)", "increments RepairWorkOrder.version by 1"] }
  - { method: POST, path: "/pallet-ops/repair-orders/{id}/abort", description: "OPEN -> ABORTED; releases the core", roles: [YardSupervisor], code: 200, input: [], output: RepairWorkOrder, side_effects: ["CoreUnit.processing_status -> YARD", "status -> ABORTED", "increments RepairWorkOrder.version by 1"] }

  # --- InventoryLot / HeatTreatmentRun ---
  - { method: POST, path: "/pallet-ops/inventory-lots", description: "Create an inventory lot (NEW_BUILD path; recycled lots arise from repair completion)", roles: [PlantManager], code: 201, input: [spec_id, origin_type, quantity_total, "quality_grade?"], output: InventoryLot, side_effects: ["unit_cost_cents computed per new_build_unit_cost (NEW_BUILD) — ERR_PRICE_INDEX_MISSING when no index covers created_at", "heat_treat_status = PENDING_HT if spec.requires_heat_treatment_default else NOT_REQUIRED", "status=AVAILABLE"] }
  - { method: GET, path: "/pallet-ops/inventory-lots", description: "List inventory lots", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: ["limit?", "offset?", "spec_id?", "status?", "quality_grade?", "heat_treat_status?"], output: "InventoryLot[]", side_effects: [] }
  - { method: GET, path: "/pallet-ops/inventory-lots/{id}", description: "Get an inventory lot", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: [], output: InventoryLot, side_effects: [] }
  - { method: POST, path: "/pallet-ops/inventory-lots/{id}/quarantine", description: "Quarantine an available lot with no allocations", roles: [PlantManager], code: 200, input: [], output: InventoryLot, side_effects: ["status -> QUARANTINED", "increments InventoryLot.version by 1"] }
  - { method: POST, path: "/pallet-ops/ht-runs", description: "Stage a heat-treatment run", roles: [HeatTreatOperator], code: 201, input: [chamber_code, species_profile, capacity_pallets], output: HeatTreatmentRun, side_effects: ["status=STAGING"] }
  - { method: GET, path: "/pallet-ops/ht-runs", description: "List HT runs", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: ["limit?", "offset?", "status?", "chamber_code?"], output: "HeatTreatmentRun[]", side_effects: [] }
  - { method: GET, path: "/pallet-ops/ht-runs/{id}", description: "Get an HT run", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: [], output: HeatTreatmentRun, side_effects: [] }
  - { method: POST, path: "/pallet-ops/ht-runs/{id}/assign-lot", description: "Assign a PENDING_HT lot to a STAGING run (capacity + species + status gates)", roles: [HeatTreatOperator], code: 200, input: [lot_id], output: HeatTreatmentRun, side_effects: ["loaded_pallets += lot.quantity_total", "run must be STAGING (else ERR_HT_NOT_STAGING)", "increments HeatTreatmentRun.version by 1"] }
  - { method: POST, path: "/pallet-ops/ht-runs/{id}/start", description: "STAGING -> RUNNING (chamber exclusivity)", roles: [HeatTreatOperator], code: 200, input: [], output: HeatTreatmentRun, side_effects: ["started_at stamped", "status -> RUNNING", "increments HeatTreatmentRun.version by 1"] }
  - { method: POST, path: "/pallet-ops/ht-runs/{id}/complete", description: "RUNNING -> COMPLETED (dwell >= 6h); stamps assigned lots HT_CERTIFIED with ISPM-15 mark", roles: [HeatTreatOperator], code: 200, input: [], output: HeatTreatmentRun, side_effects: ["ispm15_mark_id minted", "assigned lots -> HT_CERTIFIED", "status -> COMPLETED", "increments HeatTreatmentRun.version by 1"] }
  - { method: POST, path: "/pallet-ops/ht-runs/{id}/fail", description: "RUNNING -> FAILED; lots released back to PENDING_HT", roles: [HeatTreatOperator], code: 200, input: [], output: HeatTreatmentRun, side_effects: ["assigned lots unassigned, remain PENDING_HT", "status -> FAILED", "increments HeatTreatmentRun.version by 1"] }

  # --- Customer / SalesOrder / OrderLine / PoolReturn ---
  - { method: POST, path: "/pallet-ops/customers", description: "Register a customer", roles: [SalesRep], code: 201, input: [company_name], output: Customer, side_effects: ["status=ACTIVE", "pool_credit_balance_cents=0", "pool_units_outstanding=0"] }
  - { method: GET, path: "/pallet-ops/customers", description: "List customers", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: ["limit?", "offset?", "status?"], output: "Customer[]", side_effects: [] }
  - { method: GET, path: "/pallet-ops/customers/{id}", description: "Get a customer", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: POST, path: "/pallet-ops/customers/{id}/suspend", description: "ACTIVE -> SUSPENDED (credit_hold=true)", roles: [SalesRep], code: 200, input: [], output: Customer, side_effects: ["credit_hold=true", "status -> SUSPENDED", "increments Customer.version by 1"] }
  - { method: POST, path: "/pallet-ops/customers/{id}/reinstate", description: "SUSPENDED -> ACTIVE", roles: [SalesRep], code: 200, input: [], output: Customer, side_effects: ["credit_hold=false", "status -> ACTIVE", "increments Customer.version by 1"] }
  - { method: POST, path: "/pallet-ops/customers/{id}/close", description: "ACTIVE -> CLOSED (requires zero pool units and no open orders)", roles: [SalesRep], code: 200, input: [], output: Customer, side_effects: ["status -> CLOSED", "increments Customer.version by 1"] }
  - { method: POST, path: "/pallet-ops/orders", description: "Create a sales order (DRAFT) with its first line", roles: [SalesRep], code: 201, input: [customer_id, requested_delivery_date, spec_id, quantity, quality_grade_requested, "heat_treatment_required?"], output: SalesOrder, side_effects: ["fulfillment_status=DRAFT", "payment_status=UNPAID", "one OrderLine created OPEN with unit_price_cents resolved from the grade price book", "order_date stamped from logical clock"] }
  - { method: GET, path: "/pallet-ops/orders", description: "List orders", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: ["limit?", "offset?", "customer_id?", "fulfillment_status?", "payment_status?"], output: "SalesOrder[]", side_effects: [] }
  - { method: GET, path: "/pallet-ops/orders/{id}", description: "Get an order", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: [], output: SalesOrder, side_effects: [] }
  - { method: POST, path: "/pallet-ops/orders/{id}/lines", description: "Add an order line to a DRAFT order", roles: [SalesRep], code: 201, input: [spec_id, quantity, quality_grade_requested, "heat_treatment_required?"], output: OrderLine, side_effects: ["order must be DRAFT (else ERR_INVALID_STATE)", "line created OPEN"] }
  - { method: GET, path: "/pallet-ops/order-lines", description: "List order lines", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: ["limit?", "offset?", "order_id?", "spec_id?", "status?", "allocated_lot_id?"], output: "OrderLine[]", side_effects: [] }
  - { method: GET, path: "/pallet-ops/order-lines/{id}", description: "Get an order line", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: [], output: OrderLine, side_effects: [] }
  - { method: POST, path: "/pallet-ops/orders/{id}/confirm", description: "DRAFT -> CONFIRMED; prices order, applies seasonal index and pool credit (OCC)", roles: [SalesRep], code: 200, input: [expected_order_version], output: SalesOrder, side_effects: ["order_pricing computed", "customer.pool_credit_balance_cents debited", "status -> CONFIRMED", "increments SalesOrder.version by 1"] }
  - { method: POST, path: "/pallet-ops/orders/{id}/allocate", description: "CONFIRMED -> ALLOCATED; allocation selector commits lot reservations (OCC)", roles: [SalesRep], code: 200, input: [expected_order_version], output: SalesOrder, side_effects: ["allocation_selector per line", "lot.quantity_available debited", "empty lots -> DEPLETED", "status -> ALLOCATED", "increments SalesOrder.version by 1"] }
  - { method: POST, path: "/pallet-ops/orders/{id}/cancel", description: "DRAFT/CONFIRMED -> CANCELLED; re-credits applied pool credit", roles: [SalesRep], code: 200, input: [], output: SalesOrder, side_effects: ["pool_credit_applied_cents re-credited to customer", "OPEN lines -> CANCELLED", "status -> CANCELLED", "increments SalesOrder.version by 1"] }
  - { method: POST, path: "/pallet-ops/orders/{id}/record-payment", description: "Record exact payment on a priced order; flips payment axis UNPAID -> PAID", roles: [SalesRep], code: 200, input: [amount_cents], output: SalesOrder, side_effects: ["payment_status -> PAID", "increments SalesOrder.version by 1"] }
  - { method: POST, path: "/pallet-ops/pool-returns", description: "Log a customer pool return", roles: [SalesRep, YardSupervisor], code: 201, input: [customer_id, returned_count, grade_on_return, "route_stop_id?"], output: PoolReturn, side_effects: ["status=LOGGED"] }
  - { method: GET, path: "/pallet-ops/pool-returns", description: "List pool returns", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: ["limit?", "offset?", "customer_id?", "status?", "route_stop_id?"], output: "PoolReturn[]", side_effects: [] }
  - { method: GET, path: "/pallet-ops/pool-returns/{id}", description: "Get a pool return", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: [], output: PoolReturn, side_effects: [] }
  - { method: POST, path: "/pallet-ops/pool-returns/{id}/grade", description: "LOGGED -> GRADED; resolves tier credit", roles: [YardSupervisor], code: 200, input: [grade_on_return], output: PoolReturn, side_effects: ["pool_credit_tier computed", "status -> GRADED", "increments PoolReturn.version by 1"] }
  - { method: POST, path: "/pallet-ops/pool-returns/{id}/credit", description: "GRADED -> CREDITED; posts ledger and injects returned units into core pipeline", roles: [SalesRep], code: 200, input: [], output: PoolReturn, side_effects: ["customer.pool_credit_balance_cents += total_credit_cents", "customer.pool_units_outstanding -= returned_count", "grade A/B -> CoreUnit rows in YARD; SCRAP -> GRINDING_QUEUED", "status -> CREDITED", "increments PoolReturn.version by 1"] }
  - { method: POST, path: "/pallet-ops/pool-returns/{id}/dispute", description: "LOGGED -> DISPUTED", roles: [SalesRep], code: 200, input: [], output: PoolReturn, side_effects: ["status -> DISPUTED", "increments PoolReturn.version by 1"] }

  # --- DeliveryRoute / RouteStop ---
  - { method: POST, path: "/pallet-ops/routes", description: "Plan a delivery route", roles: [FleetPlanner], code: 201, input: [route_date, trailer_cube_capacity_cuft, planned_miles], output: DeliveryRoute, side_effects: ["status=PLAN", "cube_used_cuft=0"] }
  - { method: GET, path: "/pallet-ops/routes", description: "List routes", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: ["limit?", "offset?", "status?"], output: "DeliveryRoute[]", side_effects: [] }
  - { method: GET, path: "/pallet-ops/routes/{id}", description: "Get a route", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: [], output: DeliveryRoute, side_effects: [] }
  - { method: POST, path: "/pallet-ops/routes/{id}/stops", description: "Add a stop to a PLAN route; cube gate enforced", roles: [FleetPlanner], code: 201, input: [stop_sequence, stop_type, "order_id?", "pickup_customer_id?"], output: RouteStop, side_effects: ["load_cube_cuft computed from order's allocated lines", "cube_used_cuft += load_cube_cuft", "route must be PLAN (else ERR_INVALID_STATE)", "ERR_CUBE_OVERFLOW when capacity exceeded", "increments DeliveryRoute.version by 1"] }
  - { method: GET, path: "/pallet-ops/route-stops", description: "List route stops", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: ["limit?", "offset?", "route_id?", "status?", "order_id?"], output: "RouteStop[]", side_effects: [] }
  - { method: GET, path: "/pallet-ops/route-stops/{id}", description: "Get a route stop", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: [], output: RouteStop, side_effects: [] }
  - { method: POST, path: "/pallet-ops/routes/{id}/dispatch", description: "PLAN -> DISPATCHED (OCC); provisional margin computed; orders SHIPPED", roles: [FleetPlanner], code: 200, input: [expected_route_version], output: DeliveryRoute, side_effects: ["route_margin_provisional computed", "stop orders ALLOCATED -> SHIPPED", "lines -> FULFILLED", "status -> DISPATCHED", "increments DeliveryRoute.version by 1"] }
  - { method: POST, path: "/pallet-ops/route-stops/{id}/arrive", description: "SCHEDULED -> ARRIVED (sequence gate)", roles: [FleetPlanner], code: 200, input: [], output: RouteStop, side_effects: ["status -> ARRIVED", "increments RouteStop.version by 1"] }
  - { method: POST, path: "/pallet-ops/route-stops/{id}/complete", description: "ARRIVED -> COMPLETED; delivers order, frees pickups", roles: [FleetPlanner], code: 200, input: [], output: RouteStop, side_effects: ["order -> DELIVERED when all its stops complete", "customer.pool_units_outstanding += delivered qty", "status -> COMPLETED", "increments RouteStop.version by 1"] }
  - { method: POST, path: "/pallet-ops/route-stops/{id}/skip", description: "SCHEDULED -> SKIPPED", roles: [FleetPlanner], code: 200, input: [], output: RouteStop, side_effects: ["status -> SKIPPED", "increments RouteStop.version by 1"] }
  - { method: POST, path: "/pallet-ops/routes/{id}/close", description: "DISPATCHED -> CLOSED; final margin with actuals", roles: [FleetPlanner], code: 200, input: [fuel_surcharge_cents], output: DeliveryRoute, side_effects: ["route_margin_final computed", "status -> CLOSED", "increments DeliveryRoute.version by 1"] }
  - { method: POST, path: "/pallet-ops/routes/{id}/cancel", description: "PLAN -> CANCELLED; stops skipped", roles: [FleetPlanner], code: 200, input: [], output: DeliveryRoute, side_effects: ["SCHEDULED stops -> SKIPPED", "status -> CANCELLED", "increments DeliveryRoute.version by 1"] }

  # --- GrindingBatch ---
  - { method: POST, path: "/pallet-ops/grinding-batches", description: "Queue a grinding batch over SCRAP cores", roles: [YardSupervisor], code: 201, input: [input_core_ids], output: GrindingBatch, side_effects: ["input_count = len(input_core_ids)", "status=QUEUED"] }
  - { method: GET, path: "/pallet-ops/grinding-batches", description: "List grinding batches", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: ["limit?", "offset?", "status?"], output: "GrindingBatch[]", side_effects: [] }
  - { method: GET, path: "/pallet-ops/grinding-batches/{id}", description: "Get a grinding batch", roles: [PlantManager, YardSupervisor, HeatTreatOperator, SalesRep, FleetPlanner, ProcurementManager], code: 200, input: [], output: GrindingBatch, side_effects: [] }
  - { method: POST, path: "/pallet-ops/grinding-batches/{id}/start", description: "QUEUED -> GRINDING (all inputs must be grindable)", roles: [YardSupervisor], code: 200, input: [], output: GrindingBatch, side_effects: ["status -> GRINDING", "increments GrindingBatch.version by 1"] }
  - { method: POST, path: "/pallet-ops/grinding-batches/{id}/complete", description: "GRINDING -> COMPLETED; yield computed; cores GROUND", roles: [YardSupervisor], code: 200, input: [output_fiber_cuyd, "revenue_cents?"], output: GrindingBatch, side_effects: ["yield_ratio computed", "input cores -> GROUND", "status -> COMPLETED", "increments GrindingBatch.version by 1"] }

  # --- Test-driving clock endpoint (last-resort per §1.5 priority ladder) ---
  - { method: POST, path: "/pallet-ops/_clock/set_current_utc", description: "Set the server's logical clock. Startup default is 2026-08-01T00:00:00Z; before any set call the logical clock reads exactly this default and never falls back to wall-clock time.", roles: [PlantManager], code: 200, input: [to_iso8601], output: { current_utc: datetime }, side_effects: ["logical clock advanced"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role header" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-templated resource id does not exist" }
  - { id: ERR_REFERENCED_NOT_FOUND, http: 404, condition: "Body-referenced FK id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, wrong type, or enum value out of range" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource state does not permit the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_SPEC_NOT_DRAFT, http: 409, condition: "Spec activate requires status == DRAFT" }
  - { id: ERR_SPEC_HAS_STOCK, http: 409, condition: "Spec retire blocked by AVAILABLE inventory lots" }
  - { id: ERR_SPEC_ON_OPEN_ORDER, http: 409, condition: "Spec retire blocked by OPEN/ALLOCATED order lines" }
  - { id: ERR_INDEX_WINDOW_OVERLAP, http: 409, condition: "Lumber index window overlaps an existing same-species window (half-open adjacency permitted)" }
  - { id: ERR_SEASON_WINDOW_OVERLAP, http: 409, condition: "Seasonal index window overlaps an existing band" }
  - { id: ERR_PRICE_INDEX_MISSING, http: 422, condition: "No lumber index row covers the lot creation timestamp for the spec's species" }
  - { id: ERR_BATCH_NOT_RECEIVING, http: 409, condition: "begin-sorting requires batch RECEIVING" }
  - { id: ERR_BATCH_NOT_SORTING, http: 409, condition: "finish-sorting or core sort requires batch SORTING" }
  - { id: ERR_BATCH_NOT_AUDIT, http: 409, condition: "close requires batch AUDIT" }
  - { id: ERR_CORES_UNSORTED, http: 409, condition: "finish-sorting blocked: UNSORTED cores remain in the batch" }
  - { id: ERR_CORE_ALREADY_SORTED, http: 409, condition: "sort requires grade == UNSORTED" }
  - { id: ERR_SCRAP_NOTE_REQUIRED, http: 422, condition: "Sorting to SCRAP requires a non-empty condition_notes" }
  - { id: ERR_CORE_NOT_REPAIRABLE, http: 422, condition: "Repair open requires core grade IN {A,B}" }
  - { id: ERR_CORE_NOT_IN_YARD, http: 409, condition: "Repair open requires processing_status == YARD" }
  - { id: ERR_REPAIR_ALREADY_OPEN, http: 409, condition: "An OPEN/IN_PROGRESS work order already exists for this core" }
  - { id: ERR_WO_NOT_OPEN, http: 409, condition: "start/abort requires work order OPEN" }
  - { id: ERR_WO_NOT_IN_PROGRESS, http: 409, condition: "complete requires work order IN_PROGRESS" }
  - { id: ERR_LOT_NOT_AVAILABLE, http: 409, condition: "quarantine requires lot AVAILABLE" }
  - { id: ERR_LOT_HAS_ALLOCATIONS, http: 409, condition: "quarantine blocked by ALLOCATED order lines against the lot" }
  - { id: ERR_HT_NOT_STAGING, http: 409, condition: "assign-lot/start requires run STAGING" }
  - { id: ERR_HT_NOT_RUNNING, http: 409, condition: "complete/fail requires run RUNNING" }
  - { id: ERR_HT_EMPTY, http: 422, condition: "start requires at least one assigned pallet" }
  - { id: ERR_CHAMBER_OCCUPIED, http: 409, condition: "Another RUNNING run occupies the same chamber_code" }
  - { id: ERR_HT_DWELL_SHORT, http: 422, condition: "complete before 6h dwell from started_at" }
  - { id: ERR_HT_SPECIES_MISMATCH, http: 422, condition: "Lot's spec species differs from run species_profile" }
  - { id: ERR_HT_CAPACITY_EXCEEDED, http: 422, condition: "assign-lot would push loaded_pallets beyond capacity_pallets" }
  - { id: ERR_HT_REQUIRED, http: 422, condition: "Line requires heat treatment but only non-HT-certified lots are candidates" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 422, condition: "Allocation selector found no lot satisfying spec/grade/quantity filters" }
  - { id: ERR_CUSTOMER_NOT_ACTIVE, http: 409, condition: "suspend/close requires customer ACTIVE" }
  - { id: ERR_CUSTOMER_NOT_SUSPENDED, http: 409, condition: "reinstate requires customer SUSPENDED" }
  - { id: ERR_CUSTOMER_CREDIT_HOLD, http: 422, condition: "Customer on credit hold or not ACTIVE for order create/confirm" }
  - { id: ERR_POOL_UNITS_OUTSTANDING, http: 409, condition: "Customer close blocked by outstanding pool units" }
  - { id: ERR_OPEN_ORDERS_EXIST, http: 409, condition: "Customer close blocked by non-terminal orders" }
  - { id: ERR_ORDER_NOT_DRAFT, http: 409, condition: "confirm/add-line requires order DRAFT" }
  - { id: ERR_ORDER_EMPTY, http: 422, condition: "confirm requires at least one OPEN line" }
  - { id: ERR_ORDER_NOT_CONFIRMED, http: 409, condition: "allocate requires order CONFIRMED" }
  - { id: ERR_ORDER_NOT_ALLOCATED, http: 409, condition: "dispatch requires every stop order ALLOCATED" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "cancel requires DRAFT or CONFIRMED" }
  - { id: ERR_ORDER_ALREADY_SETTLED, http: 409, condition: "record-payment requires payment_status == UNPAID" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "record-payment amount_cents must equal order total_cents exactly" }
  - { id: ERR_RETURN_NOT_LOGGED, http: 409, condition: "grade/dispute requires return LOGGED" }
  - { id: ERR_RETURN_NOT_GRADED, http: 409, condition: "credit requires return GRADED" }
  - { id: ERR_RETURN_EXCEEDS_OUTSTANDING, http: 422, condition: "returned_count exceeds customer.pool_units_outstanding" }
  - { id: ERR_ROUTE_NOT_PLAN, http: 409, condition: "stops/dispatch/cancel require route PLAN" }
  - { id: ERR_ROUTE_NOT_DISPATCHED, http: 409, condition: "arrive/close require route DISPATCHED" }
  - { id: ERR_ROUTE_EMPTY, http: 422, condition: "dispatch requires at least one stop" }
  - { id: ERR_CUBE_OVERFLOW, http: 422, condition: "Stop load would exceed trailer_cube_capacity_cuft" }
  - { id: ERR_DUPLICATE_STOP_SEQUENCE, http: 409, condition: "stop_sequence already used on this route" }
  - { id: ERR_STOP_NOT_SCHEDULED, http: 409, condition: "arrive/skip requires stop SCHEDULED" }
  - { id: ERR_STOP_NOT_ARRIVED, http: 409, condition: "complete requires stop ARRIVED" }
  - { id: ERR_STOP_OUT_OF_SEQUENCE, http: 409, condition: "Lower-sequence stops not yet COMPLETED/SKIPPED" }
  - { id: ERR_STOPS_OPEN, http: 409, condition: "Route close blocked by stops not COMPLETED/SKIPPED" }
  - { id: ERR_GRIND_NOT_QUEUED, http: 409, condition: "start requires grinding batch QUEUED" }
  - { id: ERR_GRIND_NOT_RUNNING, http: 409, condition: "complete requires grinding batch GRINDING" }
  - { id: ERR_CORE_NOT_GRINDABLE, http: 422, condition: "Grind input cores must be grade SCRAP and GRINDING_QUEUED" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProcurementManager
    description: "Owns core buying: purchase batches, lumber index publication, batch settlement close"
    identity: opaque
    exclusive_operations:
      - "POST /pallet-ops/core-batches"
      - "POST /pallet-ops/core-batches/{id}/close"
      - "POST /pallet-ops/lumber-index"
    shared_operations:
      - "GET read access to all resources (via Any)"
  - name: YardSupervisor
    description: "Owns the yard: sorting cores, repair work orders, pool-return grading, grinding"
    identity: opaque
    exclusive_operations:
      - "POST /pallet-ops/core-batches/{id}/begin-sorting"
      - "POST /pallet-ops/core-batches/{id}/finish-sorting"
      - "POST /pallet-ops/core-units"
      - "POST /pallet-ops/core-units/{id}/sort"
      - "POST /pallet-ops/repair-orders and lifecycle actions"
      - "POST /pallet-ops/pool-returns/{id}/grade"
      - "POST /pallet-ops/grinding-batches and lifecycle actions"
    shared_operations:
      - "POST /pallet-ops/pool-returns (shared with SalesRep)"
      - "GET read access to all resources (via Any)"
  - name: HeatTreatOperator
    description: "Owns heat-treatment chambers and ISPM-15 stamping"
    identity: opaque
    exclusive_operations:
      - "POST /pallet-ops/ht-runs and lifecycle actions (assign-lot, start, complete, fail)"
    shared_operations:
      - "GET read access to all resources (via Any)"
  - name: SalesRep
    description: "Owns customers, sales orders, pool-return credits"
    identity: opaque
    exclusive_operations:
      - "POST /pallet-ops/customers and lifecycle actions"
      - "POST /pallet-ops/orders and order actions (lines, confirm, allocate, cancel, record-payment)"
      - "POST /pallet-ops/pool-returns/{id}/credit"
      - "POST /pallet-ops/pool-returns/{id}/dispute"
    shared_operations:
      - "POST /pallet-ops/pool-returns (shared with YardSupervisor)"
      - "GET read access to all resources (via Any)"
  - name: FleetPlanner
    description: "Owns delivery routes, stops, dispatch, and route close"
    identity: opaque
    exclusive_operations:
      - "POST /pallet-ops/routes and lifecycle actions (stops, dispatch, close, cancel)"
      - "POST /pallet-ops/route-stops/{id}/arrive|complete|skip"
    shared_operations:
      - "GET read access to all resources (via Any)"
  - name: PlantManager
    description: "Owns pallet specs, new-build lots, seasonal index, logical clock; quarantine authority"
    identity: opaque
    exclusive_operations:
      - "POST /pallet-ops/specs and lifecycle actions"
      - "POST /pallet-ops/inventory-lots"
      - "POST /pallet-ops/inventory-lots/{id}/quarantine"
      - "POST /pallet-ops/seasonal-index"
      - "POST /pallet-ops/_clock/set_current_utc"
    shared_operations:
      - "GET read access to all resources (via Any)"
  - name: Any
    description: "Shared read role — every authenticated role may perform GET list/detail operations"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /pallet-ops/* (all list and detail endpoints)"
