      - name: bp_qc_defect_rate_exactly_at_hold_threshold
        grounds:
          - calculations.print_job_quality_inspection
          - state_machines.PrintJob
          - entities.PrintVendor.fields.quality_defect_rate_bp
        distinguishing_aspect: |
          QC_HOLD_THRESHOLD_BP is 150 and the comparison is inclusive (>=), so a rate of exactly 150
          bp holds the job while 149 bp releases it. Job 1's first sample is 400/6 = exactly
          150.0 bp -> QC_HOLD; a second sample of 600/0 dilutes the CUMULATIVE totals to 1000/6 =
          60 bp -> QC_PASSED, proving the rate is a running aggregate and not the last sample's
          rate. Job 2's single sample of 10000/149 = exactly 149 bp -> QC_PASSED pins the other side
          of the inclusive edge, and the vendor-level roll-up
          round_half_up(155 * 10000 / 11000) = round_half_up(140.909) = 141 shows the vendor rate is
          pooled over samples rather than averaged over jobs (the naive average of 60 and 149 would
          be 105).
        test_recipe:
          setup:
            - "An election in STYLES_LOCKED with locked style S-100 and precinct P-001 (required_ballot_quantity 110)."
            - "Vendor Ridgeline Secure Print with 2 press lines, and print job JOB-1 for 12500 ballots on window 2026-08-10T08:00Z to 2026-08-12T08:00Z, already proof-approved so it is PRINTING with sample_size 0, defect_count 0 and inspection_count 0."
            - "A second job JOB-2 for the same style and vendor on the overlapping window 2026-08-11T08:00Z to 2026-08-13T08:00Z (two press lines, so the overlap is legal), also proof-approved and PRINTING."
