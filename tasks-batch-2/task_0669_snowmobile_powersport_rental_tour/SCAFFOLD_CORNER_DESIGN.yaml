              as: PlatformAdmin
            - call: "POST /tour-departures/${dep_id}/depart"
              payload: {}
              as: Guide
              as_user_id: "${guide_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-03T11:30:00Z" }
              as: PlatformAdmin
            - call: "POST /reservations/${res_id}/return"
              payload: { fuel_return_fraction: 1.0 }
              as: DispatchOperator
          trigger:
            - call: "POST /reservations/${res_id}/return"
              payload: { fuel_return_fraction: 1.0 }
              as: DispatchOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Reservation.${res_id}.reservation_status == RETURNED"

      - name: list_member_reservations_paginated
        claim_type: Computed read
        grounds: [endpoints, entities.Reservation.fields.member_id]
        distinguishing_aspect: "GET /members/{id}/reservations returns a paginated array with total_count and has_more for a member with one reservation."
        test_recipe:
          setup: ["Member with one PENDING reservation."]
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "ListT", required_class: "TRAIL", max_riders: 10 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /units"
              payload: { vin_tag: "LS-1", unit_class: "TRAIL", daily_rate_cents: 5000, deposit_cents: 25000, tank_capacity_liters: 30 }
              as: DispatchOperator
              captures: { unit_id: $.data.id }
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2027-03-05T09:00:00Z", ends_at: "2027-03-05T12:00:00Z", required_guide_class: "TRAIL", capacity_riders: 10 }
              as: DispatchOperator
              captures: { dep_id: $.data.id }
            - call: "POST /members/register"
              payload: { full_name: "List Mem", email: "list@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { mem_id: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${mem_id}", tour_departure_id: "${dep_id}", unit_id: "${unit_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "GET /members/${mem_id}/reservations"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
          assert:
            - "response.status == 200"
            - "meta.total_count == 1"
            - "meta.has_more == false"

  # =================================================================
  # Errors — remaining catalog entries (OCC stale-version)
  # =================================================================
  - section: errors
    instances:
      - name: confirm_stale_departure_version_returns_stale_version
        claim_type: violation_to_error
        grounds: ["concurrency_rules[confirm-stale-departure]", "validations[priority=19]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After member B confirms (TourDeparture.version advances), member A confirming with the pre-advance expected_tour_departure_version -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Departure SCHEDULED capacity 5; member B confirms first (version advances); member A still carries the old version."]
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "OccT", required_class: "TRAIL", max_riders: 10 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /units"
              payload: { vin_tag: "OC-1", unit_class: "TRAIL", daily_rate_cents: 5000, deposit_cents: 25000, tank_capacity_liters: 30 }
              as: DispatchOperator
              captures: { unit_b: $.data.id }
            - call: "POST /units"
              payload: { vin_tag: "OC-2", unit_class: "TRAIL", daily_rate_cents: 5000, deposit_cents: 25000, tank_capacity_liters: 30 }
              as: DispatchOperator
              captures: { unit_a: $.data.id }
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2027-03-07T09:00:00Z", ends_at: "2027-03-07T12:00:00Z", required_guide_class: "TRAIL", capacity_riders: 5 }
              as: DispatchOperator
              captures: { dep_id: $.data.id, dep_ver0: $.data.version }
            - call: "POST /members/register"
              payload: { full_name: "Occ B", email: "occb@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { mem_b: $.data.id }
            - call: "POST /members/${mem_b}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${mem_b}"
            - call: "POST /reservations"
              payload: { member_id: "${mem_b}", tour_departure_id: "${dep_id}", unit_id: "${unit_b}" }
              as: Member
              as_user_id: "${mem_b}"
              captures: { res_b: $.data.id }
            - call: "POST /members/register"
              payload: { full_name: "Occ A", email: "occa@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { mem_a: $.data.id }
            - call: "POST /members/${mem_a}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${mem_a}"
            - call: "POST /reservations"
              payload: { member_id: "${mem_a}", tour_departure_id: "${dep_id}", unit_id: "${unit_a}" }
              as: Member
              as_user_id: "${mem_a}"
              captures: { res_a: $.data.id }
            - call: "POST /reservations/${res_b}/confirm"
              payload: { expected_tour_departure_version: "${dep_ver0}" }
              as: Member
              as_user_id: "${mem_b}"
          trigger:
            - call: "POST /reservations/${res_a}/confirm"
              payload: { expected_tour_departure_version: "${dep_ver0}" }
              as: Member
              as_user_id: "${mem_a}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "error_id == ERR_STALE_VERSION"
            - "Reservation.${res_a}.reservation_status == PENDING"

  # =================================================================
  # RBAC — authn missing, role denials, ownership
  # =================================================================
  - section: rbac
    instances:
      - name: missing_auth_header_returns_unauthenticated
        claim_type: authn_required
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "GET /units/{id} with no X-User-Role/X-User-ID headers -> ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["One unit exists."]
          setup_api_calls:
            - call: "POST /units"
              payload: { vin_tag: "AU-1", unit_class: "TRAIL", daily_rate_cents: 5000, deposit_cents: 25000, tank_capacity_liters: 30 }
              as: DispatchOperator
              captures: { unit_id: $.data.id }
          trigger:
            - call: "GET /units/${unit_id}"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "error_id == ERR_UNAUTHENTICATED"

      - name: member_cannot_create_unit_returns_unauthorized
        claim_type: role_denied
        grounds: [roles, "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Member role calling POST /units (DispatchOperator/PlatformAdmin only) -> ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A registered member."]
          setup_api_calls:
            - call: "POST /members/register"
              payload: { full_name: "Role Mem", email: "role@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /units"
              payload: { vin_tag: "RU-1", unit_class: "TRAIL", daily_rate_cents: 5000, deposit_cents: 25000, tank_capacity_liters: 30 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "error_id == ERR_UNAUTHORIZED"

      - name: member_cannot_confirm_other_members_reservation_returns_ownership_required
        claim_type: ownership_enforced
        grounds: ["validations[priority=3]", roles, "errors[ERR_OWNERSHIP_REQUIRED]"]
        distinguishing_aspect: "Member A calling confirm on Member B's reservation (X-User-ID != reservation.member_id) -> ERR_OWNERSHIP_REQUIRED (403)."
        test_recipe:
          setup: ["Member B owns a PENDING reservation; Member A is a different member."]
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "OwnT", required_class: "TRAIL", max_riders: 10 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /units"
              payload: { vin_tag: "OW-1", unit_class: "TRAIL", daily_rate_cents: 5000, deposit_cents: 25000, tank_capacity_liters: 30 }
              as: DispatchOperator
              captures: { unit_id: $.data.id }
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2027-03-09T09:00:00Z", ends_at: "2027-03-09T12:00:00Z", required_guide_class: "TRAIL", capacity_riders: 10 }
              as: DispatchOperator
              captures: { dep_id: $.data.id, dep_ver: $.data.version }
            - call: "POST /members/register"
              payload: { full_name: "Own B", email: "ownb@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { mem_b: $.data.id }
            - call: "POST /members/${mem_b}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${mem_b}"
            - call: "POST /reservations"
              payload: { member_id: "${mem_b}", tour_departure_id: "${dep_id}", unit_id: "${unit_id}" }
              as: Member
              as_user_id: "${mem_b}"
              captures: { res_b: $.data.id }
            - call: "POST /members/register"
              payload: { full_name: "Own A", email: "owna@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { mem_a: $.data.id }
          trigger:
            - call: "POST /reservations/${res_b}/confirm"
              payload: { expected_tour_departure_version: "${dep_ver}" }
              as: Member
              as_user_id: "${mem_a}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "error_id == ERR_OWNERSHIP_REQUIRED"
            - "Reservation.${res_b}.reservation_status == PENDING"

  # =================================================================
  # Cross-cutting layers — OCC happy path (version increments), FK reverse-reachability
  # =================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: confirm_increments_departure_version_occ_happy_path
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[confirm-stale-departure]", entities.TourDeparture.fields.version, state_machines.Reservation.PENDING_to_CONFIRMED]
        distinguishing_aspect: "Confirming with the current expected_tour_departure_version succeeds and TourDeparture.version increments by exactly 1 (created at 1 -> 2)."
        test_recipe:
          setup: ["Departure SCHEDULED version 1; member waiver SIGNED with a PENDING reservation."]
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "VerT", required_class: "TRAIL", max_riders: 10 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /units"
              payload: { vin_tag: "VR-1", unit_class: "TRAIL", daily_rate_cents: 5000, deposit_cents: 25000, tank_capacity_liters: 30 }
              as: DispatchOperator
              captures: { unit_id: $.data.id }
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2027-03-11T09:00:00Z", ends_at: "2027-03-11T12:00:00Z", required_guide_class: "TRAIL", capacity_riders: 10 }
              as: DispatchOperator
              captures: { dep_id: $.data.id, dep_ver: $.data.version }
            - call: "POST /members/register"
              payload: { full_name: "Ver Mem", email: "ver@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /reservations"
              payload: { member_id: "${mem_id}", tour_departure_id: "${dep_id}", unit_id: "${unit_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/confirm"
              payload: { expected_tour_departure_version: "${dep_ver}" }
              as: Member
              as_user_id: "${mem_id}"
          assert:
            - "Reservation.${res_id}.reservation_status == CONFIRMED"
            - "TourDeparture.${dep_id}.version == 2"
            - "TourDeparture.${dep_id}.rider_count == 1"

      - name: fk_reverse_reachability_trail_closures_list
        claim_type: derived_field_reconciliation
        grounds: [entities.ClosureEvent.fields.trail_id, endpoints]
        distinguishing_aspect: "GET /trails/{id}/closures returns the cascade-created ClosureEvent (its only discovery channel since closures are not returned by any creation response other than the closure call)."
        test_recipe:
          setup: ["Trail with one closure event (CAUTION)."]
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "FkT", required_class: "TRAIL", max_riders: 10 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /trails/${trail_id}/closure"
              payload: { new_condition: "CAUTION", reason: "fog" }
              as: DispatchOperator
          trigger:
            - call: "GET /trails/${trail_id}/closures"
              payload: {}
              as: DispatchOperator
          assert:
            - "response.status == 200"
            - "meta.total_count == 1"
            - "data[0].new_condition == CAUTION"

  # =================================================================
  # Consistency model — immediate visibility of cascade
  # =================================================================
  - section: consistency_model
    instances:
      - name: immediate_cascade_visible_in_same_request_response
        claim_type: immediate
        grounds: [state_machines.TourDeparture.SCHEDULED_to_CANCELLED, state_machines.Reservation.CONFIRMED_to_CANCELLED]
        distinguishing_aspect: "Cancelling a departure returns the departure already CANCELLED in the same response, and a follow-up read shows its reservation CANCELLED with the deposit refunded — no eventual lag."
        test_recipe:
          setup: ["Departure SCHEDULED with one CONFIRMED reservation (HELD deposit 25000)."]
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "ImmT", required_class: "TRAIL", max_riders: 10 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /units"
              payload: { vin_tag: "IM-1", unit_class: "TRAIL", daily_rate_cents: 5000, deposit_cents: 25000, tank_capacity_liters: 30 }
              as: DispatchOperator
              captures: { unit_id: $.data.id }
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2027-03-13T09:00:00Z", ends_at: "2027-03-13T12:00:00Z", required_guide_class: "TRAIL", capacity_riders: 10 }
              as: DispatchOperator
              captures: { dep_id: $.data.id, dep_ver: $.data.version }
            - call: "POST /members/register"
              payload: { full_name: "Imm Mem", email: "imm@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /reservations"
              payload: { member_id: "${mem_id}", tour_departure_id: "${dep_id}", unit_id: "${unit_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: { expected_tour_departure_version: "${dep_ver}" }
              as: Member
              as_user_id: "${mem_id}"
          trigger:
            - call: "POST /tour-departures/${dep_id}/cancel"
              payload: {}
              as: DispatchOperator
              captures: { dstatus: $.data.status }
          assert:
            - "TourDeparture.${dep_id}.status == CANCELLED"
            - "Reservation.${res_id}.reservation_status == CANCELLED"
            - "Reservation.${res_id}.settlement_status == REFUNDED"
            - "Member.${mem_id}.deposit_hold_cents == 0"
