          Invoice entity exhibits branching fork-join: from UNDER_REVIEW it can
          reach three distinct successor states (APPROVED, PARTIALLY_APPROVED,
          REJECTED) depending on aggregate line-item outcome, each with a
          different side-effect set on Matter.billed_to_date_cents.
