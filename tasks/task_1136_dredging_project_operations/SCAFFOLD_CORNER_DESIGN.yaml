# §1.9 Scaffold Corner Design — coverage index for non-difficulty claims (task 1136, dredging)
scaffold_corner_design:
  - section: entities
    instances:
      - name: project_creation_applies_defaults
        claim_type: creation
        grounds: [entities.Project]
        distinguishing_aspect: "A project created with the five required inputs starts PLANNED, posture SUSPENDED (no ISSUED permit), ledger zeros, version 1."
        test_recipe:
          setup: ["Empty database; logical clock at default 2026-05-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { name: "P-NEW", measurement_basis: "IN_PLACE", base_rate_cents_per_cy: 1500, standby_rate_cents_per_hour: 5000, liquidated_damages_cents_per_day: 100000 }
              as: OwnerEngineer
              captures: { pid: $.data.id, st: $.data.status, post: $.data.compliance_posture, v: $.data.version, tc: $.data.total_certified_cents }
          assert:
            - "Project.${pid}.status == PLANNED"
            - "Project.${pid}.compliance_posture == SUSPENDED"
            - "Project.${pid}.total_certified_cents == 0 and total_paid_cents == 0 and outstanding_payable_cents == 0"
            - "Project.${pid}.version == 1"

      - name: reach_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Reach.fields.design_quantity_cy", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting design_quantity_cy (source input, no default) fails shape validation with ERR_INVALID_REQUEST before any state check."
        test_recipe:
          setup: ["One project exists"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-RF", measurement_basis: "SCOW", base_rate_cents_per_cy: 1500, standby_rate_cents_per_hour: 5000, liquidated_damages_cents_per_day: 100000 }
              as: OwnerEngineer
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /reaches"
              payload: { project_id: "${proj_id}", name: "R1", required_depth_ft: 25.0, allowable_overdepth_ft: 1.0, overdepth_allowance_cy: 2000 }
              as: OwnerEngineer
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_REQUEST (missing design_quantity_cy)"

      - name: project_get_not_found_returns_404
        claim_type: not_found
        grounds: ["entities.Project", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /projects/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: OwnerEngineer
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_NOT_FOUND and http status 404"

      - name: plant_create_with_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.DredgePlant.fields.plant_type", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "plant_type DRAGLINE is outside the declared enum {CUTTER_SUCTION, HOPPER, CLAMSHELL, BACKHOE} and is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /plants"
              payload: { contractor_ref: "DGE-X", plant_type: "DRAGLINE", rated_daily_production_cy: 4000 }
              as: ContractorOps
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_REQUEST"

      - name: disposal_site_used_cy_input_ignored
        claim_type: computed_fields
        grounds: [entities.DisposalSite.fields.used_cy]
        distinguishing_aspect: "Client-supplied used_cy=9999 on create is ignored; the computed field reads 0 and remaining_cy equals capacity_cy."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /disposal-sites"
              payload: { name: "SITE-CI", site_type: "OPEN_WATER", capacity_cy: 5000, bulking_factor: 1.3, used_cy: 9999 }
              as: OwnerEngineer
              captures: { sid: $.data.id, used: $.data.used_cy, rem: $.data.remaining_cy }
          assert:
            - "DisposalSite.${sid}.used_cy == 0 (client input ignored)"
            - "DisposalSite.${sid}.remaining_cy == 5000"

      - name: turbidity_reading_has_no_version_field
        claim_type: immutability
        grounds: [entities.TurbidityReading]
        distinguishing_aspect: "TurbidityReading is append-only (common_fields false): response carries id and created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["One project with an ISSUED permit covering the reading timestamp"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-IMM", measurement_basis: "SCOW", base_rate_cents_per_cy: 1500, standby_rate_cents_per_hour: 5000, liquidated_damages_cents_per_day: 100000 }
              as: OwnerEngineer
              captures: { proj_id: $.data.id }
            - call: "POST /permits"
              payload: { project_id: "${proj_id}", permit_number: "PER-1", window_start_utc: "2026-05-01T00:00:00Z", window_end_utc: "2026-08-31T23:59:59Z", turbidity_limit_ntu: 50, turbidity_ceiling_ntu: 100, turbidity_averaging_hours: 24, species_standdown_hours: 6 }
              as: OwnerEngineer
          trigger:
            - call: "POST /turbidity-readings"
              payload: { project_id: "${proj_id}", value_ntu: 30, taken_utc: "2026-05-10T08:00:00Z" }
              as: EnvironmentalMonitor
              captures: { rid: $.data.id }
          assert:
            - "TurbidityReading.${rid} response contains id and created_at"
            - "TurbidityReading.${rid} response contains no version field"

      - name: reach_create_with_unknown_project_returns_not_found
        claim_type: parent_relationships
        grounds: ["entities.Reach.fields.project_id", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Flat-topology FK integrity: creating a reach against a non-existent project_id fails existence with ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /reaches"
              payload: { project_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", name: "R1", design_quantity_cy: 40000, required_depth_ft: 25.0, allowable_overdepth_ft: 1.0, overdepth_allowance_cy: 2000 }
              as: OwnerEngineer
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_NOT_FOUND"

      - name: list_reaches_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, entities.Reach]
        distinguishing_aspect: "GET /reaches?project_id=...&limit=1&offset=0 returns the fixed envelope: data array plus total_count and has_more=true when a second reach exists."
        test_recipe:
          setup: ["One project with two reaches"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-PG", measurement_basis: "SCOW", base_rate_cents_per_cy: 1500, standby_rate_cents_per_hour: 5000, liquidated_damages_cents_per_day: 100000 }
              as: OwnerEngineer
              captures: { proj_id: $.data.id }
            - call: "POST /reaches"
              payload: { project_id: "${proj_id}", name: "R1", design_quantity_cy: 40000, required_depth_ft: 25.0, allowable_overdepth_ft: 1.0, overdepth_allowance_cy: 2000 }
              as: OwnerEngineer
            - call: "POST /reaches"
              payload: { project_id: "${proj_id}", name: "R2", design_quantity_cy: 30000, required_depth_ft: 20.0, allowable_overdepth_ft: 1.0, overdepth_allowance_cy: 1000 }
              as: OwnerEngineer
          trigger:
            - call: "GET /reaches?project_id=${proj_id}&limit=1&offset=0"
              payload: {}
              as: ContractorOps
          assert:
            - "Response meta contains api_request_id and api_request_timestamp; response_type == array"
            - "total_count == 2 and has_more == true with limit=1 offset=0"
            - "Second page (offset=1) returns the other reach and has_more == false"

  - section: state_machines
    instances:
      - name: permit_expires_on_clock_advance
        claim_type: valid_transition
        grounds: [state_machines.Permit.ISSUED_to_EXPIRED]
        distinguishing_aspect: "Setting the logical clock past window_end_utc auto-expires the ISSUED permit and recomputes the project posture to SUSPENDED (window exit)."
        test_recipe:
          setup: ["Project with ISSUED permit [2026-05-01, 2026-06-30T23:59:59Z]; clock initially 2026-05-10 (posture CLEAR)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: OwnerEngineer }
            - call: "POST /projects"
              payload: { name: "P-EXP", measurement_basis: "SCOW", base_rate_cents_per_cy: 1500, standby_rate_cents_per_hour: 5000, liquidated_damages_cents_per_day: 100000 }
              as: OwnerEngineer
              captures: { proj_id: $.data.id }
            - call: "POST /permits"
              payload: { project_id: "${proj_id}", permit_number: "PER-1", window_start_utc: "2026-05-01T00:00:00Z", window_end_utc: "2026-06-30T23:59:59Z", turbidity_limit_ntu: 50, turbidity_ceiling_ntu: 100, turbidity_averaging_hours: 24, species_standdown_hours: 6 }
              as: OwnerEngineer
              captures: { permit_id: $.data.id }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: OwnerEngineer }
            - call: "GET /permits/${permit_id}"
              payload: {}
              as: OwnerEngineer
              captures: { p_status: $.data.status }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: OwnerEngineer
              captures: { posture: $.data.compliance_posture }
          assert:
            - "Permit.${permit_id}.status == EXPIRED after clock passes window_end_utc"
            - "Project.${proj_id}.compliance_posture == SUSPENDED (no governing permit)"

      - name: survey_accept_from_rejected_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Survey.transitions]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_segregation_on_survey_accept
          rationale: "That §1.8 instance asserts ERR_INVALID_STATE on accept of a REJECTED survey (while also violating SoD); the pure invalid-from rejection is the same terminal lockdown."

      - name: completed_event_cannot_resume
        claim_type: invalid_transition
        grounds: ["state_machines.DredgeEvent.SHUTDOWN_to_ACTIVE", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Resume is declared only from SHUTDOWN; a COMPLETED event rejects resume with ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE project, reach DREDGING, one COMPLETED event; clock 2026-05-12"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: OwnerEngineer }
            - call: "POST /projects"
              payload: { name: "P-INVTR", measurement_basis: "SCOW", base_rate_cents_per_cy: 1500, standby_rate_cents_per_hour: 5000, liquidated_damages_cents_per_day: 100000 }
              as: OwnerEngineer
              captures: { proj_id: $.data.id }
            - call: "POST /permits"
              payload: { project_id: "${proj_id}", permit_number: "PER-1", window_start_utc: "2026-05-01T00:00:00Z", window_end_utc: "2026-08-31T23:59:59Z", turbidity_limit_ntu: 50, turbidity_ceiling_ntu: 100, turbidity_averaging_hours: 24, species_standdown_hours: 6 }
              as: OwnerEngineer
            - call: "POST /reaches"
              payload: { project_id: "${proj_id}", name: "R1", design_quantity_cy: 40000, required_depth_ft: 25.0, allowable_overdepth_ft: 1.0, overdepth_allowance_cy: 2000 }
              as: OwnerEngineer
              captures: { reach_id: $.data.id }
            - call: "POST /plants"
              payload: { contractor_ref: "DGE-7", plant_type: "HOPPER", rated_daily_production_cy: 4000 }
              as: ContractorOps
              captures: { plant_id: $.data.id }
            - call: "POST /dredge-plans"
              payload: { project_id: "${proj_id}", plant_id: "${plant_id}", material_class: "SAND", planned_start_utc: "2026-05-10T00:00:00Z", planned_end_utc: "2026-06-30T00:00:00Z" }
              as: ContractorOps
              captures: { plan_id: $.data.id }
            - { call: "POST /dredge-plans/${plan_id}/submit", payload: {}, as: ContractorOps }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: OwnerEngineer
              captures: { proj_v: $.data.version }
            - call: "POST /dredge-plans/${plan_id}/approve"
              payload: { expected_project_version: "${proj_v}" }
              as: OwnerEngineer
            - { call: "POST /projects/${proj_id}/activate", payload: {}, as: OwnerEngineer }
            - call: "POST /surveys"
              payload: { reach_id: "${reach_id}", kind: "PRE_DREDGE", measured_volume_cy: 40000, min_sounding_depth_ft: 18.5 }
              as: SurveyParty
              as_user_id: surv-1
              captures: { survey_pre_id: $.data.id }
            - call: "GET /reaches/${reach_id}"
              payload: {}
              as: OwnerEngineer
              captures: { reach_v0: $.data.version }
            - call: "POST /surveys/${survey_pre_id}/accept"
              payload: { expected_reach_version: "${reach_v0}" }
              as: OwnerEngineer
              as_user_id: eng-1
            - { call: "POST /reaches/${reach_id}/begin-dredging", payload: {}, as: ContractorOps }
            - call: "POST /dredge-events"
              payload: { reach_id: "${reach_id}", plant_id: "${plant_id}", started_utc: "2026-05-10T00:00:00Z" }
              as: ContractorOps
              as_user_id: ops-1
              captures: { event_id: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-12T00:00:00Z" }, as: OwnerEngineer }
            - { call: "POST /dredge-events/${event_id}/complete", payload: {}, as: ContractorOps, as_user_id: ops-1 }
          trigger:
            - call: "POST /dredge-events/${event_id}/resume"
              payload: {}
              as: ContractorOps
              as_user_id: ops-1
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE (COMPLETED is terminal; resume undefined)"

      - name: retired_plant_cannot_be_modified
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.DredgePlant", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "RETIRED is terminal: a second PATCH (even back to REGISTERED) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["One plant, no open events"]
          setup_api_calls:
            - call: "POST /plants"
              payload: { contractor_ref: "DGE-R", plant_type: "BACKHOE", rated_daily_production_cy: 1200 }
              as: ContractorOps
              captures: { plant_id: $.data.id }
            - { call: "PATCH /plants/${plant_id}", payload: { status: "RETIRED" }, as: ContractorOps }
          trigger:
            - call: "PATCH /plants/${plant_id}"
              payload: { status: "REGISTERED" }
              as: ContractorOps
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE"
            - "DredgePlant.${plant_id}.status remains RETIRED"

      - name: begin_dredging_from_pending_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.Reach.PRE_SURVEYED_to_DREDGING", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Begin-dredging is declared only from PRE_SURVEYED; on a PENDING reach of an ACTIVE project it fails with ERR_INVALID_STATE even though the project gate passes."
        test_recipe:
          setup: ["ACTIVE project with reach still PENDING (no survey accepted); clock 2026-05-10"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: OwnerEngineer }
            - call: "POST /projects"
              payload: { name: "P-BDP", measurement_basis: "SCOW", base_rate_cents_per_cy: 1500, standby_rate_cents_per_hour: 5000, liquidated_damages_cents_per_day: 100000 }
              as: OwnerEngineer
              captures: { proj_id: $.data.id }
            - call: "POST /permits"
              payload: { project_id: "${proj_id}", permit_number: "PER-1", window_start_utc: "2026-05-01T00:00:00Z", window_end_utc: "2026-08-31T23:59:59Z", turbidity_limit_ntu: 50, turbidity_ceiling_ntu: 100, turbidity_averaging_hours: 24, species_standdown_hours: 6 }
              as: OwnerEngineer
            - call: "POST /reaches"
              payload: { project_id: "${proj_id}", name: "R1", design_quantity_cy: 40000, required_depth_ft: 25.0, allowable_overdepth_ft: 1.0, overdepth_allowance_cy: 2000 }
              as: OwnerEngineer
              captures: { reach_id: $.data.id }
            - call: "POST /plants"
              payload: { contractor_ref: "DGE-7", plant_type: "HOPPER", rated_daily_production_cy: 4000 }
              as: ContractorOps
              captures: { plant_id: $.data.id }
            - call: "POST /dredge-plans"
              payload: { project_id: "${proj_id}", plant_id: "${plant_id}", material_class: "SAND", planned_start_utc: "2026-05-10T00:00:00Z", planned_end_utc: "2026-06-30T00:00:00Z" }
              as: ContractorOps
              captures: { plan_id: $.data.id }
            - { call: "POST /dredge-plans/${plan_id}/submit", payload: {}, as: ContractorOps }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: OwnerEngineer
              captures: { proj_v: $.data.version }
            - call: "POST /dredge-plans/${plan_id}/approve"
              payload: { expected_project_version: "${proj_v}" }
              as: OwnerEngineer
            - { call: "POST /projects/${proj_id}/activate", payload: {}, as: OwnerEngineer }
          trigger:
            - call: "POST /reaches/${reach_id}/begin-dredging"
              payload: {}
              as: ContractorOps
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE (reach PENDING, not PRE_SURVEYED)"
            - "Reach.${reach_id}.status remains PENDING"

      - name: begin_dredging_on_planned_project_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.Reach.PRE_SURVEYED_to_DREDGING", "errors[ERR_PROJECT_NOT_ACTIVE]"]
        distinguishing_aspect: "Cross-entity gate inside the transition: reach is PRE_SURVEYED and plan APPROVED, but project is still PLANNED, so begin-dredging fails with ERR_PROJECT_NOT_ACTIVE."
        test_recipe:
          setup: ["PLANNED project with ISSUED permit, APPROVED plan, reach PRE_SURVEYED; clock 2026-05-10"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: OwnerEngineer }
            - call: "POST /projects"
              payload: { name: "P-BDPP", measurement_basis: "SCOW", base_rate_cents_per_cy: 1500, standby_rate_cents_per_hour: 5000, liquidated_damages_cents_per_day: 100000 }
              as: OwnerEngineer
              captures: { proj_id: $.data.id }
            - call: "POST /permits"
              payload: { project_id: "${proj_id}", permit_number: "PER-1", window_start_utc: "2026-05-01T00:00:00Z", window_end_utc: "2026-08-31T23:59:59Z", turbidity_limit_ntu: 50, turbidity_ceiling_ntu: 100, turbidity_averaging_hours: 24, species_standdown_hours: 6 }
              as: OwnerEngineer
            - call: "POST /reaches"
              payload: { project_id: "${proj_id}", name: "R1", design_quantity_cy: 40000, required_depth_ft: 25.0, allowable_overdepth_ft: 1.0, overdepth_allowance_cy: 2000 }
              as: OwnerEngineer
              captures: { reach_id: $.data.id }
            - call: "POST /plants"
              payload: { contractor_ref: "DGE-7", plant_type: "HOPPER", rated_daily_production_cy: 4000 }
              as: ContractorOps
              captures: { plant_id: $.data.id }
            - call: "POST /dredge-plans"
              payload: { project_id: "${proj_id}", plant_id: "${plant_id}", material_class: "SAND", planned_start_utc: "2026-05-10T00:00:00Z", planned_end_utc: "2026-06-30T00:00:00Z" }
              as: ContractorOps
              captures: { plan_id: $.data.id }
            - { call: "POST /dredge-plans/${plan_id}/submit", payload: {}, as: ContractorOps }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: OwnerEngineer
              captures: { proj_v: $.data.version }
            - call: "POST /dredge-plans/${plan_id}/approve"
              payload: { expected_project_version: "${proj_v}" }
              as: OwnerEngineer
            - call: "POST /surveys"
              payload: { reach_id: "${reach_id}", kind: "PRE_DREDGE", measured_volume_cy: 40000, min_sounding_depth_ft: 18.5 }
              as: SurveyParty
              as_user_id: surv-1
              captures: { survey_pre_id: $.data.id }
            - call: "GET /reaches/${reach_id}"
              payload: {}
              as: OwnerEngineer
              captures: { reach_v0: $.data.version }
            - call: "POST /surveys/${survey_pre_id}/accept"
              payload: { expected_reach_version: "${reach_v0}" }
              as: OwnerEngineer
              as_user_id: eng-1
          trigger:
            - call: "POST /reaches/${reach_id}/begin-dredging"
              payload: {}
              as: ContractorOps
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_PROJECT_NOT_ACTIVE"
            - "Reach.${reach_id}.status remains PRE_SURVEYED"

      - name: plan_revision_cycle_increments
        claim_type: valid_transition
        grounds: [state_machines.DredgePlan.CHANGES_REQUESTED_to_SUBMITTED]
        distinguishing_aspect: "The cyclic review loop DRAFT -> SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED increments revision from 1 to 2 and recomputes estimates."
        test_recipe:
          setup: ["Project with permit, reach, plant; plan created; clock 2026-05-10"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: OwnerEngineer }
            - call: "POST /projects"
              payload: { name: "P-REV", measurement_basis: "SCOW", base_rate_cents_per_cy: 1500, standby_rate_cents_per_hour: 5000, liquidated_damages_cents_per_day: 100000 }
              as: OwnerEngineer
              captures: { proj_id: $.data.id }
            - call: "POST /permits"
              payload: { project_id: "${proj_id}", permit_number: "PER-1", window_start_utc: "2026-05-01T00:00:00Z", window_end_utc: "2026-08-31T23:59:59Z", turbidity_limit_ntu: 50, turbidity_ceiling_ntu: 100, turbidity_averaging_hours: 24, species_standdown_hours: 6 }
              as: OwnerEngineer
            - call: "POST /reaches"
              payload: { project_id: "${proj_id}", name: "R1", design_quantity_cy: 40000, required_depth_ft: 25.0, allowable_overdepth_ft: 1.0, overdepth_allowance_cy: 2000 }
              as: OwnerEngineer
            - call: "POST /plants"
              payload: { contractor_ref: "DGE-7", plant_type: "HOPPER", rated_daily_production_cy: 4000 }
              as: ContractorOps
              captures: { plant_id: $.data.id }
            - call: "POST /dredge-plans"
              payload: { project_id: "${proj_id}", plant_id: "${plant_id}", material_class: "SAND", planned_start_utc: "2026-05-10T00:00:00Z", planned_end_utc: "2026-06-30T00:00:00Z" }
              as: ContractorOps
              captures: { plan_id: $.data.id }
          trigger:
