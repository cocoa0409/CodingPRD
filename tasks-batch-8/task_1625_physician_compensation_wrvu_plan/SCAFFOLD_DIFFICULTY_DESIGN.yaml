  - rule_id: compensating_invariant
    instances:
      - name: capture_reversal_wrvu_conservation
        grounds:
          - state_machines.ProductionCapture.CREDITED_to_REVERSED
          - calculations.wrvu_credit
          - entities.PhysicianAgreement.fields.ytd_wrvu_credited
        distinguishing_aspect: |
          Conserved quantity = credited wRVU ledger: ytd_wrvu_credited == sum of credited_wrvu over
          captures with credit_status == CREDITED. Forward validate (+9.70) paired with its
          compensating dispute-accept reversal returns the ledger to exactly 0.00 — no drift.
        test_recipe:
          setup:
            - "ACTIVE plan; physician PH EFFECTIVE; capture CAP 99213 x 10 validated (ytd 9.70); dispute DSP filed and under review"
          setup_api_calls:
            - { call: "POST /comp/_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /comp/physicians", payload: { npi: "1000000100", full_name: "Dr Conserve", specialty: "IM", provider_type: PHYSICIAN, fte: 1.0, hire_date: "2018-01-01" }, as: SystemAdmin, captures: { phys: $.data.id } }
            - { call: "POST /comp/comp-plans", payload: { name: "Cons Plan", fiscal_year_start: "2026-01-01", fiscal_year_end: "2026-12-31", credit_attribution_mode: SERVICE_DATE, quality_model: ALL_OR_NOTHING, quality_pool_cents: 100000, fmv_cap_cents: 90000000, tiers: [ { tier_code: T1, threshold_wrvu: 0, conversion_factor_cents: 4500, tier_bonus_cents: 0 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { plan: $.data.id } }
            - { call: "POST /comp/comp-plans/${plan}/cpt-rates", payload: { cpt_code: "99213", wrvu_value: 0.97, effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/submit-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/review-decision", payload: { decision: APPROVED }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/comp-plans/${plan}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements", payload: { physician_id: "${phys}", plan_id: "${plan}", base_salary_cents: 24000000, period_draw_cents: 1000000, effective_date: "2026-01-01" }, as: CompAnalyst, as_user_id: an_1, captures: { agr: $.data.id, ytd0: $.data.ytd_wrvu_credited } }
            - { call: "POST /comp/physician-agreements/${agr}/submit-fmv", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/physician-agreements/${agr}/fmv-review", payload: { decision: APPROVED, benchmark_percentile: 55 }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/physician-agreements/${agr}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements/${agr}/production-captures", payload: { cpt_code: "99213", units: 10, service_date: "2026-02-10", posting_date: "2026-02-10" }, as: CompAnalyst, as_user_id: an_1, captures: { cap: $.data.id } }
            - { call: "POST /comp/production-captures/${cap}/validate", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/disputes", payload: { subject_type: CAPTURE, subject_capture_id: "${cap}", reason: "duplicate entry" }, as: Physician, as_user_id: "${phys}", captures: { dsp: $.data.id } }
            - { call: "POST /comp/disputes/${dsp}/start-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
          trigger:
            - { call: "POST /comp/disputes/${dsp}/resolve", payload: { resolution: ACCEPTED }, as: CompCommittee, as_user_id: cc_9 }
          assert:
            - "Agreement.${agr}.ytd_wrvu_credited == 0.00 at creation (empty CREDITED set)"
            - "After validate: ytd_wrvu_credited == 9.70 (forward action)"
            - "After compensating dispute-accept reversal: GET /comp/physician-agreements/${agr} -> ytd_wrvu_credited == 0.00 exactly (invariant: forward + compensation == identity, to 2dp)"
            - "GET /comp/physician-agreements/${agr}/production-captures?credit_status=CREDITED returns an empty list after the reversal"

      - name: statement_void_cash_conservation
        grounds:
          - state_machines.CompStatement.UNDER_REVIEW_to_FINALIZED
          - state_machines.CompStatement.FINALIZED_to_VOIDED
          - entities.PhysicianAgreement.fields.lifetime_paid_cents
        distinguishing_aspect: |
          Conserved quantity = lifetime cash paid (different quantity than the wRVU ledger):
          lifetime_paid_cents == sum of net_payment_cents over FINALIZED statements. Finalize
          (+21500000) paired with its compensating void returns lifetime_paid_cents to exactly 0,
          and included captures unlock LOCKED -> VALIDATED (the compensation is total).
        test_recipe:
          setup:
            - "ACTIVE plan (single tier T1 0@4500c); physician PH EFFECTIVE (draw 1000000); capture 99285=5.00 x 1000 validated (5000.00 wRVU, 2026-02)"
            - "Statement ST for 2026-02 generated (net_payment_cents == 21500000) and UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /comp/_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /comp/physicians", payload: { npi: "1000000101", full_name: "Dr Cash", specialty: "IM", provider_type: PHYSICIAN, fte: 1.0, hire_date: "2018-01-01" }, as: SystemAdmin, captures: { phys: $.data.id } }
            - { call: "POST /comp/comp-plans", payload: { name: "Cash Plan", fiscal_year_start: "2026-01-01", fiscal_year_end: "2026-12-31", credit_attribution_mode: SERVICE_DATE, quality_model: ALL_OR_NOTHING, quality_pool_cents: 100000, fmv_cap_cents: 90000000, tiers: [ { tier_code: T1, threshold_wrvu: 0, conversion_factor_cents: 4500, tier_bonus_cents: 0 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { plan: $.data.id } }
            - { call: "POST /comp/comp-plans/${plan}/cpt-rates", payload: { cpt_code: "99285", wrvu_value: 5.0, effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/submit-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/review-decision", payload: { decision: APPROVED }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/comp-plans/${plan}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements", payload: { physician_id: "${phys}", plan_id: "${plan}", base_salary_cents: 24000000, period_draw_cents: 1000000, effective_date: "2026-01-01" }, as: CompAnalyst, as_user_id: an_1, captures: { agr: $.data.id } }
            - { call: "POST /comp/physician-agreements/${agr}/submit-fmv", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/physician-agreements/${agr}/fmv-review", payload: { decision: APPROVED, benchmark_percentile: 55 }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/physician-agreements/${agr}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements/${agr}/production-captures", payload: { cpt_code: "99285", units: 1000, service_date: "2026-02-05", posting_date: "2026-02-05" }, as: CompAnalyst, as_user_id: an_1, captures: { cap: $.data.id } }
            - { call: "POST /comp/production-captures/${cap}/validate", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/physician-agreements/${agr}/comp-statements", payload: { period_year: 2026, period_month: 2 }, as: CompAnalyst, as_user_id: an_1, captures: { stmt: $.data.id } }
            - { call: "POST /comp/comp-statements/${stmt}/submit-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
          trigger:
            - { call: "POST /comp/comp-statements/${stmt}/finalize", payload: {}, as: CompCommittee, as_user_id: cc_9 }
            - { call: "POST /comp/comp-statements/${stmt}/void", payload: { reason: "posted to wrong period" }, as: CompCommittee, as_user_id: cc_9 }
          assert:
            - "CompStatement.${stmt}.net_payment_cents == 21500000 (22500000 + 0 + 0 + 0 - 1000000)"
            - "After finalize: GET /comp/physician-agreements/${agr} -> lifetime_paid_cents == 21500000"
            - "After void: lifetime_paid_cents == 0 exactly (forward finalize + compensating void == identity on the cash ledger)"
            - "After void: GET /comp/production-captures/${cap} -> capture_status == \"VALIDATED\" (unlock compensation) and credit_status == \"CREDITED\""
            - "GET /comp/physician-agreements/${agr}/comp-statements -> the VOIDED statement remains queryable with status \"VOIDED\""
