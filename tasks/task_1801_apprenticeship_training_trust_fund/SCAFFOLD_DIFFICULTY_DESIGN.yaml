              captures: { err: $.data.error_id }
          assert:
            - "First enrollment succeeded: ClassEnrollment.${enr1_id}.status == ENROLLED"
            - "err == ERR_CLASS_FULL (second enrollment at count == capacity)"
            - "TrainingClass.${cls_id}.enrolled_count == 1"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cross_entity_enrollment_requires_indentured
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_APPRENTICE_NOT_INDENTURED]"
          - "state_machines.Apprentice.program_status.APPLICANT_to_INDENTURED"
        distinguishing_aspect: |
          Pair ClassEnrollment -> Apprentice: enrollment creation is gated on
          the apprentice's program_status; an APPLICANT (registration REGISTERED
          but never indentured) is rejected, and the same enrollment succeeds
          after the indenture transition.
        test_recipe:
          setup: ["Apprentice A is APPLICANT with registration REGISTERED; class C SCHEDULED."]
          setup_api_calls:
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
