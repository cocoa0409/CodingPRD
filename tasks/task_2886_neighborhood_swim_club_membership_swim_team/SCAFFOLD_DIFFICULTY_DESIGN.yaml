            - call: "POST /swim-club/swim-team-registrations/${r1_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: SwimTeamCoach
            - call: "POST /swim-club/swim-team-registrations/${r2_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: SwimTeamCoach
