    - name: auditor_calendar_intervals_are_half_open_with_a_travel_buffer
      claim_type: interval_merge
      grounds:
      - validations.priority_26
      - errors.ERR_AUDITOR_SCHEDULE_CONFLICT
      excluded_because:
        difficulty_instance: resource_temporal_overlap / auditor_calendar_half_open_overlap_with_sixty_minute_travel_buffer
        rationale: Interval arithmetic in this domain exists only on the auditor calendar, and the difficulty instance already pins the touching-endpoint case (an interval starting exactly when the previous
          one ends is still rejected because of the 60-minute buffer) together with the first accepted offset.
    - name: escalation_level_is_the_signed_sum_of_the_event_ledger
      claim_type: projection
      grounds:
      - calculations.location_agreement_status
      - entities.EscalationEvent
      excluded_because:
        difficulty_instance: compensating_invariant / escalation_ledger_conserves_level_across_escalate_and_cure
        rationale: escalation_level is a projection over an append-only ledger with MAX(0, sum) semantics, and the difficulty instance already replays the ledger forward and backward and asserts the projected
          level, the derived agreement status and the per-row resulting_escalation_level stamps.
    - name: reliability_decays_over_the_three_newest_calibration_records
      claim_type: decay_function
      grounds:
      - calculations.auditor_reliability_score
      excluded_because:
        difficulty_instance: dual_variant_calc / auditor_reliability_rolling_versus_certification_review_diverges
        rationale: The 1.00 / 0.60 / 0.30 decay vector and the three-record cap are the ROLLING variant's defining behaviour, and the difficulty instance already contrasts the decayed rolling score against
          the unweighted uncapped CERTIFICATION_REVIEW score over the same records.
    - name: repeat_violation_penalty_uses_a_tiered_per_unit_rate
      claim_type: tiered_pricing
      grounds:
      - calculations.location_standing_score
      excluded_because:
        difficulty_instance: combinatorial_formula / standing_penalty_tier_keyed_off_pre_penalty_base
        rationale: The 0.50 / 1.00 / 2.00 per-unit ladder is a tier table, and the difficulty instance already pins the subtle part - the tier is selected from the PRE-penalty base, so a location whose base
          sits just above 90.00 keeps the 0.50 rate even after the subtraction drops it below 90.00.
    - name: provisional_and_final_composites_disagree_on_the_same_score_sheet
