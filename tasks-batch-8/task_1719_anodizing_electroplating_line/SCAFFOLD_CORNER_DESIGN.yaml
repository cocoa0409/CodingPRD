            - "start-strip: error_id == ERR_WORK_ORDER_NOT_REJECTED; complete-strip: error_id == ERR_WORK_ORDER_NOT_STRIPPING"

      - name: third_rejection_auto_scraps
        claim_type: cyclic
        grounds: [calculations.thickness_acceptance, state_machines.WorkOrder.AWAITING_INSPECTION_to_SCRAPPED]
        distinguishing_aspect: "At rework_count == MAX_REWORKS (2), a third reworkable-quality failure yields SCRAP_REJECT (not REWORKABLE_REJECT): the cyclic machine terminates after exactly two full rework laps."
        test_recipe:
          setup: ["order W3 with two completed strip-replate laps (rework_count == 2), currently AWAITING_INSPECTION after the third load"]
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Three Co" }, as: ShopManager, captures: { c3x: $.data.id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL6061", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /baths", payload: { bath_code: "ANO-3X", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { b3x: $.data.id } }
