            - "The first compliance review has already been adjudicated ADVERSE with finding DISCLOSURE_FAILURE; the campaign is still PUBLISHED because the threshold is 2."
            - "A second OPENED compliance review of review_type LICENSURE_BOUNDARY exists, opened by officer co-1."
