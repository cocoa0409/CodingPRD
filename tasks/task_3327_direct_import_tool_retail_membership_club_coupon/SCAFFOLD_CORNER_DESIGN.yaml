  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role header is rejected 401 before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /items"
              payload: {}
              as: __NO_ROLE__
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED"
            - "http status == 401"

      - name: existence_before_state_left_to_right
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=4]"]
        distinguishing_aspect: "On a nested path with a non-existent parent id AND a state-invalid operation, the 404 ERR_NOT_FOUND wins (existence precedes state)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /sales/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/complete"
              payload: {}
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: margin_floor_equality_allowed
        claim_type: satisfaction_passes
        grounds: [calculations.margin_floor_check, "errors[ERR_MARGIN_FLOOR_VIOLATION]"]
        distinguishing_aspect: "Price exactly AT the floor passes (>= semantics): landed cost 1000 with floor_margin 0.20 allows reprice to exactly 1200 and rejects 1199."
        test_recipe:
          setup: ["item ACTIVE retail 5000; PO issued qty 1 @ 1000, estimated pool 0; container received with actual pool 0 (landed cost 1000)"]
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "V3", name: "MF", brand_tier: "VALUE", origin_country: "CN", unit_retail_cents: 5000, member_price_cents: 4800, floor_margin_pct: 0.20, lead_time_days: 30, unit_weight_kg: 1.0 }
              as: PurchasingManager
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /purchase-orders"
              payload:
                po_number: "PO-V3"
                lines: [ { item_id: "${item_id}", quantity: 1, unit_cost_cents: 1000 } ]
                estimated_duty_cents: 0
                estimated_freight_cents: 0
              as: PurchasingManager
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/issue"
              payload: {}
              as: PurchasingManager
            - call: "POST /containers"
              payload:
                po_id: "${po_id}"
                container_number: "C-V3"
                lines: [ { item_id: "${item_id}", quantity: 1 } ]
              as: LogisticsCoordinator
              captures: { cont_id: $.data.id }
            - call: "POST /containers/${cont_id}/depart"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /containers/${cont_id}/arrive-port"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /containers/${cont_id}/clear-customs"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /containers/${cont_id}/receive"
              payload: { actual_duty_cents: 0, actual_freight_cents: 0 }
              as: LogisticsCoordinator
          trigger:
            - call: "POST /items/${item_id}/reprice"
              payload: { unit_retail_cents: 1199 }
              as: PurchasingManager
              captures: { err: $.data.error_id }
            - call: "POST /items/${item_id}/reprice"
              payload: { unit_retail_cents: 1200 }
              as: PurchasingManager
          assert:
            - "err == ERR_MARGIN_FLOOR_VIOLATION (1199 < floor 1200)"
            - "reprice to exactly 1200 succeeds: Item.${item_id}.unit_retail_cents == 1200"

      - name: coupon_min_basket_gate
        claim_type: violation_to_error
