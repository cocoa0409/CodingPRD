          setup:
            - "Prescriber P1 state CA; restrictive CA rule effective from 2026-01-01 (open). Methodology + CURRENT cell for 2026-08; client; product prescriber_ids [P1]; period ended 2026-08-31; one SCHEDULED delivery. Default clock 2026-09-01."
