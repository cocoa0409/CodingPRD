# =============================================================================
# SCAFFOLD.yaml — Heavy Truck Uptime Case Management & Warranty Administration
# (Daimler Truck North America)
# =============================================================================
# §1.0–§1.7. Does NOT include scaffold_difficulty_design or scaffold_corner_design
# (those live in their own sibling files).

scenario: |
  Heavy Truck Uptime Case Management & Warranty Administration (Daimler Truck
  North America): fault code telematics streaming from trucks with severity
  classification and recommended action, uptime center case creation
  coordinating the driver, fleet, dealer and parts availability, dealer service
  bay scheduling and diagnostic time authorization, warranty claim submission
  with labor time standards, failed part return and supplier recovery, parts
  expedite decisions weighing overnight freight against downtime cost, campaign
  and recall execution across a fleet with completion tracking, extended
  coverage contract administration and prorated adjustments, fleet-level
  reliability reporting and repeat repair escalation.

domain_name: heavy-truck-uptime-warranty
api_prefix: /

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - ops_run_checkpoint
    - rate_threshold_triggers
    - temporal_windowing

  entity_topology: hybrid           # Fleet-rooted tree + cross-cutting references (Truck, Dealer, ServiceBay, Part, Campaign)
  state_machine_shape: compound     # Case status derived from WorkOrder/Part children; parallel dims on Claim (submission x recovery); Campaign posture
  relationship_patterns:
    - one_to_many
    - many_to_many                  # Campaign ↔ Truck via CampaignCompletion
    - cross_aggregate               # Case ↔ Claim ↔ PartReturn ↔ SupplierRecovery span 3 aggregates
    - polymorphic                   # FaultEvent links to one of several possible recommended-action targets

  role_model: approval_chain        # CaseCoordinator → DealerAdvisor → WarrantyAdmin → SupplierManager, with FleetManager oversight
  consistency_model: immediate      # All changes atomic per request; derived fields recomputed synchronously

  entity_count: 15
  state_machine_count: 13
  calculation_count: 11
  endpoint_count: 96
  error_code_count: 38
  role_count: 6

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---- Top-level aggregates ----
  - name: Fleet
    parent: null
    common_fields: true
    fields:
      - { name: fleet_name,        type: string,  source: input,    description: "Display name for the fleet" }
      - { name: home_region,       type: string,  source: input,    description: "Two-letter region code (e.g., 'SE', 'PNW')" }
      - { name: reliability_score, type: integer, source: computed, default: 1000, description: "Read-only. Starts at 1000; decremented by repeat-repair, downtime, and overdue-campaign events; never below 0" }
      - { name: total_downtime_hours, type: number, source: computed, default: 0, description: "Read-only sum of closed-Case downtime_hours for this fleet" }
      - { name: open_case_count,   type: integer, source: computed, default: 0, description: "Read-only count of Cases in OPEN, TRIAGE, SCHEDULED, IN_SERVICE, AWAITING_PART, or PENDING_CLOSE states" }
      - { name: fleet_status,      type: enum,    source: system,   description: "ACTIVE | SUSPENDED | CLOSED" }

  - name: Truck
    parent: Fleet
    common_fields: true
    fields:
      - { name: fleet_id,          type: string,  source: system,   description: "FK -> Fleet.id; owning fleet" }
      - { name: vin,               type: string,  source: input,    description: "17-character Vehicle Identification Number; unique across all trucks" }
      - { name: model_code,        type: string,  source: input,    description: "Truck model code (e.g., 'CASCADIA_126')" }
      - { name: in_service_on,     type: datetime, source: input,   description: "Date the truck entered revenue service" }
      - { name: odometer_miles,    type: integer, source: input,    description: "Most recently reported odometer reading; monotonic non-decreasing" }
      - { name: base_warranty_until_miles,   type: integer, source: input, description: "Odometer limit of the base factory warranty" }
      - { name: base_warranty_until_on,      type: datetime, source: input, description: "Date limit of the base factory warranty" }
      - { name: truck_status,      type: enum,    source: system,   description: "IN_SERVICE | DOWN | DECOMMISSIONED" }
      - { name: open_case_count,   type: integer, source: computed, default: 0, description: "Read-only count of Cases in OPEN, TRIAGE, SCHEDULED, IN_SERVICE, AWAITING_PART, or PENDING_CLOSE on this truck" }
      - { name: repeat_repair_flag, type: boolean, source: computed, default: false, description: "Read-only. True when the same fault_code has produced 3+ REOPENED or follow-up Cases within any rolling 90-day window" }

  - name: Dealer
    parent: null
    common_fields: true
    fields:
      - { name: dealer_name,       type: string,  source: input,    description: "Display name of the dealership" }
      - { name: region,            type: string,  source: input,    description: "Region code the dealer operates in" }
      - { name: hourly_labor_rate_cents, type: integer, source: input, description: "Posted labor rate; must be > 0" }
      - { name: dealer_status,     type: enum,    source: system,   description: "ACTIVE | SUSPENDED" }
      - { name: bay_count,         type: integer, source: computed, default: 0, description: "Read-only count of ServiceBay rows where bay_status != DECOMMISSIONED" }
      - { name: active_case_count, type: integer, source: computed, default: 0, description: "Read-only count of Cases at this dealer in SCHEDULED, IN_SERVICE, or AWAITING_PART" }

  - name: ServiceBay
    parent: Dealer
    common_fields: true
    fields:
      - { name: dealer_id,         type: string,  source: system,   description: "FK -> Dealer.id; owning dealer" }
      - { name: bay_code,          type: string,  source: input,    description: "Dealer-local bay identifier" }
      - { name: bay_status,        type: enum,    source: system,   description: "AVAILABLE | RESERVED | IN_USE | DOWN | DECOMMISSIONED" }

  # ---- Telematics & Case domain ----
  - name: FaultEvent
    parent: Truck
    common_fields: false    # append-only event log; immutable
    fields:
      - { name: truck_id,          type: string,  source: system,   description: "FK -> Truck.id; source truck" }
      - { name: fault_code,        type: string,  source: input,    description: "SPN/FMI-style fault code (e.g., 'SPN3216_FMI4')" }
      - { name: severity,          type: enum,    source: input,    description: "INFO | WARNING | CRITICAL" }
      - { name: recommended_action, type: enum,   source: input,    description: "MONITOR | SCHEDULE_SERVICE | STOP_IMMEDIATELY" }
      - { name: occurred_at,       type: datetime, source: input,    description: "Telematics timestamp; must be <= server current clock" }
      - { name: event_status,      type: enum,    source: system,   description: "UNLINKED | LINKED | DISMISSED" }

  - name: Case
    parent: Truck
    common_fields: true
    fields:
      - { name: truck_id,          type: string,  source: system,   description: "FK -> Truck.id" }
      - { name: fleet_id,          type: string,  source: system,   description: "FK -> Fleet.id (denormalized for reporting; consistent with Truck.fleet_id)" }
      - { name: dealer_id,         type: string,  source: system,   description: "FK -> Dealer.id; assigned dealer (nullable until dispatch)" }
      - { name: opened_from_fault_event_id, type: string, source: system, description: "FK -> FaultEvent.id; null when opened ad-hoc" }
      - { name: case_status,       type: enum,    source: system,   description: "OPEN → TRIAGE → SCHEDULED → IN_SERVICE → AWAITING_PART (cyclic with IN_SERVICE) → PENDING_CLOSE → CLOSED | CANCELLED" }
      - { name: fault_code,        type: string,  source: input,    description: "Primary fault code for the case" }
      - { name: severity_at_open,  type: enum,    source: system,   description: "Severity captured at case creation" }
      - { name: opened_at,         type: datetime, source: system,   description: "Server timestamp of creation" }
      - { name: closed_at,         type: datetime, source: system,   description: "Server timestamp of CLOSED transition; null until then" }
      - { name: downtime_hours,    type: number,  source: computed, description: "Computed at CLOSED = (closed_at - opened_at) in hours, 2-decimal round-half-up; 0.00 while open" }
      - { name: diagnostic_minutes_authorized, type: integer, source: computed, default: 0, description: "Read-only. Sum of authorized diagnostic minutes across linked WorkOrders" }
      - { name: expedite_count,    type: integer, source: computed, default: 0, description: "Read-only count of PartOrder rows linked to this Case whose expedite_decision == EXPEDITE_OVERNIGHT" }

  - name: WorkOrder
    parent: Case
    common_fields: true
    fields:
      - { name: case_id,           type: string,  source: system,   description: "FK -> Case.id" }
      - { name: dealer_id,         type: string,  source: system,   description: "FK -> Dealer.id (denormalized from Case.dealer_id)" }
      - { name: bay_id,            type: string,  source: system,   description: "FK -> ServiceBay.id; reserved bay while SCHEDULED/IN_USE" }
      - { name: scheduled_start_at, type: datetime, source: input,   description: "Planned bay start" }
      - { name: scheduled_end_at,   type: datetime, source: input,   description: "Planned bay end; must be > scheduled_start_at" }
      - { name: work_order_status, type: enum,    source: system,   description: "DRAFT → AUTHORIZED → IN_PROGRESS → COMPLETED | CANCELLED" }
      - { name: diagnostic_minutes_authorized, type: integer, source: input, description: "Diagnostic time authorized for this work order; >= 0" }
      - { name: labor_minutes_actual, type: integer, source: input, default: 0, description: "Actual labor minutes logged; populated at COMPLETED" }
      - { name: repair_outcome,    type: enum,    source: input,    description: "FIXED | NOT_FIXED | PARTIAL; required to reach COMPLETED" }

  - name: PartOrder
    parent: Case
    common_fields: true
    fields:
      - { name: case_id,           type: string,  source: system,   description: "FK -> Case.id" }
      - { name: part_number,       type: string,  source: input,    description: "OEM part number" }
      - { name: quantity,          type: integer, source: input,    description: "Units ordered; >= 1" }
      - { name: expedite_decision, type: enum,    source: computed, description: "PENDING_EVAL → EXPEDITE_OVERNIGHT | EXPEDITE_STANDARD | DENIED" }
      - { name: expedite_cost_cents, type: integer, source: computed, default: 0, description: "Read-only cost of the chosen expedite mode; 0 until decision" }
      - { name: downtime_cost_cents, type: integer, source: computed, default: 0, description: "Read-only estimated downtime cost avoided by expediting; populated at decision time" }
      - { name: part_order_status, type: enum,    source: system,   description: "PENDING → SHIPPED → RECEIVED → INSTALLED | CANCELLED" }

  # ---- Warranty domain ----
  - name: WarrantyClaim
    parent: Case
    common_fields: true
    fields:
      - { name: case_id,           type: string,  source: system,   description: "FK -> Case.id" }
      - { name: claim_type,        type: enum,    source: input,    description: "BASE_WARRANTY | EXTENDED_COVERAGE | CAMPAIGN | GOODWILL" }
      - { name: labor_minutes_claimed, type: integer, source: input, description: "Total labor minutes requested for reimbursement" }
      - { name: parts_claimed_cents, type: integer, source: input,  description: "Parts cost requested, in cents; >= 0" }
      - { name: labor_rate_cents_per_hour, type: integer, source: system, description: "Dealer labor rate snapshotted from Dealer at claim creation" }
      - { name: labor_hours_allowed, type: number,  source: computed, description: "Read-only. Labor-time-standard allowance, computed at submission; see calculation labor_time_standard" }
      - { name: labor_amount_allowed_cents, type: integer, source: computed, description: "Read-only. labor_hours_allowed * labor_rate_cents_per_hour, rounded per rounding rule" }
      - { name: parts_amount_allowed_cents, type: integer, source: computed, description: "Read-only. Parts amount after caps and proration; see calculation parts_allowance" }
      - { name: submission_status, type: enum,    source: system,   description: "DRAFT → SUBMITTED → UNDER_REVIEW → APPROVED | DENIED | PARTIAL_APPROVED (parallel dimension)" }
      - { name: recovery_status,   type: enum,    source: system,   description: "NOT_INITIATED → PART_RETURN_REQUESTED → PART_IN_TRANSIT → PART_RECEIVED → RECOVERY_FILED → RECOVERY_PAID | RECOVERY_DENIED (parallel dimension)" }
      - { name: recovery_amount_cents, type: integer, source: computed, default: 0, description: "Read-only. Final supplier recovery paid; 0 until RECOVERY_PAID" }

  - name: PartReturn
    parent: WarrantyClaim
    common_fields: true
    fields:
      - { name: claim_id,          type: string,  source: system,   description: "FK -> WarrantyClaim.id" }
      - { name: part_number,       type: string,  source: input,    description: "Part being returned (must match an installed PartOrder on the case)" }
      - { name: return_window_days, type: integer, source: system,  description: "Return window length, snapshotted at creation; 30 for BASE_WARRANTY, 45 otherwise" }
      - { name: shipped_at,        type: datetime, source: system,   description: "When the failed part left the dealer; null until shipped" }
      - { name: received_at,       type: datetime, source: system,   description: "When supplier received the part; null until received" }
      - { name: part_return_status, type: enum,   source: system,   description: "REQUESTED → IN_TRANSIT → RECEIVED → INSPECTED_OK | INSPECTED_FAILED | LATE_REJECTED" }
      - { name: inspection_disposition, type: enum, source: input,  description: "OK | FAILED; required at INSPECTED_* transition" }

  - name: SupplierRecovery
    parent: WarrantyClaim
    common_fields: true
    fields:
      - { name: claim_id,          type: string,  source: system,   description: "FK -> WarrantyClaim.id" }
      - { name: part_return_id,    type: string,  source: system,   description: "FK -> PartReturn.id; one recovery per part return" }
      - { name: supplier_id,       type: string,  source: input,    description: "Supplier identifier for the failed part" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount pursued from supplier; >= 0" }
      - { name: paid_amount_cents, type: integer, source: computed, default: 0, description: "Read-only amount paid; set on RECOVERY_PAID" }
      - { name: recovery_status,   type: enum,    source: system,   description: "FILED → UNDER_DISPUTE → PAID | DENIED" }

  # ---- Coverage / Campaign / Reporting ----
  - name: CoverageContract
    parent: Truck
    common_fields: true
    fields:
      - { name: truck_id,          type: string,  source: system,   description: "FK -> Truck.id" }
      - { name: contract_type,     type: enum,    source: input,    description: "EXTENDED_POWERTRAIN | EXTENDED_AFTERTREATMENT | EXTENDED_FULL" }
      - { name: starts_on,         type: datetime, source: input,   description: "Coverage start timestamp" }
      - { name: ends_on,           type: datetime, source: input,   description: "Coverage end timestamp; > starts_on" }
      - { name: max_miles,         type: integer, source: input,    description: "Coverage mileage limit" }
      - { name: premium_cents,     type: integer, source: input,    description: "Contract premium, in cents" }
      - { name: contract_status,   type: enum,    source: system,   description: "ACTIVE → EXPIRED | CANCELLED" }
      - { name: prorated_credit_cents, type: integer, source: computed, default: 0, description: "Read-only. Credit issued on early CANCELLED; see calculation coverage_proration" }

  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - { name: campaign_code,     type: string,  source: input,    description: "OEM campaign/recall code (unique)" }
      - { name: campaign_kind,     type: enum,    source: input,    description: "RECALL | SERVICE_CAMPAIGN" }
      - { name: affected_model_codes, type: array, source: input,   description: "List of Truck.model_code values in scope" }
      - { name: fault_code,        type: string,  source: input,    description: "Fault code this campaign addresses" }
      - { name: opens_on,          type: datetime, source: input,   description: "Campaign effective start" }
      - { name: closes_on,         type: datetime, source: input,   description: "Campaign effective end; > opens_on" }
      - { name: campaign_status,   type: enum,    source: system,   description: "OPEN → CLOSED" }
      - { name: completion_pct,    type: number,  source: computed, default: 0, description: "Read-only. percent of CampaignCompletion rows in COMPLETED, computed over non-terminal-exempted rows; 2-decimal round-half-up" }
      - { name: overdue_count,     type: integer, source: computed, default: 0, description: "Read-only. CampaignCompletion rows still OPEN past closes_on at last ops_run" }

  - name: CampaignCompletion
    parent: Campaign
    common_fields: true
    fields:
      - { name: campaign_id,       type: string,  source: system,   description: "FK -> Campaign.id" }
      - { name: truck_id,          type: string,  source: system,   description: "FK -> Truck.id; the in-scope truck" }
      - { name: case_id,           type: string,  source: system,   description: "FK -> Case.id; case that performed the work; null until linked" }
      - { name: completion_status, type: enum,    source: system,   description: "OPEN → SCHEDULED → COMPLETED | EXEMPTED" }
      - { name: exemption_reason,  type: string,  source: input,    description: "Reason when EXEMPTED; required for that transition" }

  - name: ReliabilityReport
    parent: Fleet
    common_fields: false   # append-only snapshot per ops-run
    fields:
      - { name: fleet_id,          type: string,  source: system,   description: "FK -> Fleet.id" }
      - { name: ops_run_index,     type: integer, source: system,   description: "Ops-run counter value at snapshot time" }
      - { name: computed_at,       type: datetime, source: system,   description: "Timestamp of snapshot" }
      - { name: trucks_in_service, type: integer, source: system,   description: "Truck count with truck_status == IN_SERVICE" }
      - { name: trucks_down,       type: integer, source: system,   description: "Truck count with truck_status == DOWN" }
      - { name: total_downtime_hours, type: number, source: system, description: "Sum of closed Case downtime_hours at snapshot" }
      - { name: repeat_repair_truck_count, type: integer, source: system, description: "Trucks with repeat_repair_flag == true" }
      - { name: campaign_completion_pct, type: number, source: system, description: "Weighted mean of OPEN campaigns' completion_pct, weighted by their in-scope truck count; 2-decimal round-half-up" }
      - { name: reliability_score, type: integer, source: system,   description: "Fleet reliability_score at snapshot" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Truck
    field: truck_status
    initial_state: IN_SERVICE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: IN_SERVICE
        to: DOWN
        trigger: "system (Case transitions to IN_SERVICE or AWAITING_PART)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DOWN
        to: IN_SERVICE
        trigger: "system (all Cases on this Truck reach CLOSED or CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_SERVICE
        to: DECOMMISSIONED
        trigger: "POST /fleets/{fleetId}/trucks/{truckId}/decommission"
        actor: FleetManager
        preconditions:
          - "Truck.open_case_count == 0"
        side_effects:
          - "Any ACTIVE CoverageContract on this Truck transitions to CANCELLED; coverage_proration runs and CoverageContract.prorated_credit_cents is credited to the fleet"
          - "OPEN CampaignCompletion rows on this Truck transition to EXEMPTED with exemption_reason 'TRUCK_DECOMMISSIONED'"

  - entity: FaultEvent
    field: event_status
    initial_state: UNLINKED
    terminal_states: [LINKED, DISMISSED]
    transitions:
      - from: UNLINKED
        to: LINKED
        trigger: "system (Case created via POST /fleets/{fid}/trucks/{tid}/cases with fault_event_id)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNLINKED
        to: DISMISSED
        trigger: "POST /fleets/{fid}/trucks/{tid}/fault-events/{feId}/dismiss"
        actor: UptimeCoordinator
        preconditions: []
        side_effects: []

  - entity: Case
    field: case_status
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: TRIAGE
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/triage"
        actor: UptimeCoordinator
        preconditions: []
        side_effects: []
      - from: TRIAGE
        to: SCHEDULED
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/schedule (assigns Dealer, ServiceBay, scheduled window)"
        actor: UptimeCoordinator
        preconditions:
          - "Dealer.dealer_status == ACTIVE"
          - "ServiceBay is AVAILABLE for the requested window (no overlapping AUTHORIZED/IN_PROGRESS WorkOrder on that bay)"
        side_effects:
          - "Case.dealer_id set"
          - "A DRAFT WorkOrder is created linking Case ↔ Dealer ↔ ServiceBay"
          - "ServiceBay.bay_status → RESERVED"
      - from: SCHEDULED
        to: IN_SERVICE
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/start-service"
        actor: DealerAdvisor
        preconditions:
          - "WorkOrder.work_order_status == AUTHORIZED"
          - "ServiceBay.bay_status == RESERVED for this work order"
        side_effects:
          - "ServiceBay.bay_status → IN_USE"
          - "Truck.truck_status → DOWN"
          - "Fleet.open_case_count unchanged (case still open)"
      - from: IN_SERVICE
        to: AWAITING_PART
        trigger: "system (PartOrder created on this Case)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AWAITING_PART
        to: IN_SERVICE
        trigger: "system (all PartOrders on this Case reach INSTALLED or CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_SERVICE
        to: PENDING_CLOSE
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/request-close"
        actor: DealerAdvisor
        preconditions:
          - "Every WorkOrder on this Case is COMPLETED or CANCELLED"
          - "Every PartOrder on this Case is INSTALLED or CANCELLED"
        side_effects: []
      - from: PENDING_CLOSE
        to: CLOSED
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/close"
        actor: UptimeCoordinator
        preconditions:
          - "No WarrantyClaim on this Case is in submission_status SUBMITTED or UNDER_REVIEW"
        side_effects:
          - "Case.downtime_hours computed = (closed_at - opened_at) in hours, 2-decimal round-half-up"
          - "Fleet.total_downtime_hours += Case.downtime_hours"
          - "ServiceBay.bay_status → AVAILABLE (if still IN_USE for this case)"
          - "If Truck has no other open Case: Truck.truck_status → IN_SERVICE"
          - "Fleet.open_case_count decremented; Truck.open_case_count decremented"
      - from: [OPEN, TRIAGE, SCHEDULED]
        to: CANCELLED
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/cancel"
        actor: UptimeCoordinator
        preconditions: []
        side_effects:
          - "Any RESERVED bay released → AVAILABLE"
          - "DRAFT WorkOrders on this Case → CANCELLED"
          - "PENDING PartOrders on this Case → CANCELLED"
          - "Truck.open_case_count and Fleet.open_case_count decremented"
      # Cycle: PENDING_CLOSE can be sent back if warranty review kicks it back
      - from: PENDING_CLOSE
        to: IN_SERVICE
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/reopen-service"
        actor: UptimeCoordinator
        preconditions: []
        side_effects:
          - "ServiceBay.bay_status → IN_USE if it was AVAILABLE"

  - entity: WorkOrder
    field: work_order_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: AUTHORIZED
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/work-orders/{woid}/authorize"
        actor: UptimeCoordinator
        preconditions:
          - "diagnostic_minutes_authorized > 0"
          - "Case.case_status == SCHEDULED"
        side_effects:
          - "Case.diagnostic_minutes_authorized incremented"
      - from: AUTHORIZED
        to: IN_PROGRESS
        trigger: "system (Case transitions to IN_SERVICE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/work-orders/{woid}/complete (with labor_minutes_actual, repair_outcome)"
        actor: DealerAdvisor
        preconditions:
          - "labor_minutes_actual >= 0"
          - "repair_outcome in {FIXED, NOT_FIXED, PARTIAL}"
        side_effects:
          - "If repair_outcome != FIXED, Truck.repeat_repair_flag is recomputed via repeat_repair_window"
      - from: [DRAFT, AUTHORIZED]
        to: CANCELLED
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/work-orders/{woid}/cancel OR Case cancel cascade"
        actor: "UptimeCoordinator or system"
        preconditions: []
        side_effects:
          - "If bay was RESERVED for this WorkOrder, bay → AVAILABLE"
          - "Case.diagnostic_minutes_authorized decremented by this work order's authorization"

  - entity: PartOrder
    field: part_order_status
    initial_state: PENDING
    terminal_states: [INSTALLED, CANCELLED]
    transitions:
      - from: PENDING
        to: SHIPPED
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/part-orders/{poid}/ship"
        actor: PartsManager
        preconditions:
          - "expedite_decision in {EXPEDITE_OVERNIGHT, EXPEDITE_STANDARD}"
        side_effects: []
      - from: SHIPPED
        to: RECEIVED
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/part-orders/{poid}/receive"
        actor: DealerAdvisor
        preconditions: []
        side_effects: []
      - from: RECEIVED
        to: INSTALLED
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/part-orders/{poid}/install"
        actor: DealerAdvisor
        preconditions:
          - "Case.case_status in {IN_SERVICE, AWAITING_PART}"
        side_effects:
          - "If this was the last non-terminal PartOrder on the Case, Case → IN_SERVICE (from AWAITING_PART)"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/part-orders/{poid}/cancel OR Case cancel cascade"
        actor: "PartsManager or system"
        preconditions: []
        side_effects:
          - "If expedite_decision was EXPEDITE_OVERNIGHT, Case.expedite_count decremented"

  - entity: WarrantyClaim
    field: submission_status   # parallel dimension 1
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED, PARTIAL_APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/claims/{clid}/submit"
        actor: WarrantyAdmin
        preconditions:
          - "Case.case_status in {IN_SERVICE, AWAITING_PART, PENDING_CLOSE, CLOSED}"
          - "labor_time_standard computed: labor_minutes_claimed <= labor_hours_allowed * 60 (server-computed cap)"
        side_effects:
          - "labor_hours_allowed and labor_amount_allowed_cents computed and snapshotted"
          - "parts_amount_allowed_cents computed via parts_allowance (includes coverage proration if EXTENDED_COVERAGE)"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/claims/{clid}/begin-review"
        actor: WarrantyAdmin
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/claims/{clid}/approve"
        actor: WarrantyAdmin
        preconditions: []
        side_effects:
          - "If claim_type in {BASE_WARRANTY, CAMPAIGN} and failed_part_return required: recovery_status NOT_INITIATED → PART_RETURN_REQUESTED; a PartReturn row is created (status REQUESTED)"
      - from: UNDER_REVIEW
        to: PARTIAL_APPROVED
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/claims/{clid}/approve (with adjusted allowances)"
        actor: WarrantyAdmin
        preconditions: []
        side_effects:
          - "labor_amount_allowed_cents and/or parts_amount_allowed_cents are reduced by admin; deltas recorded"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/claims/{clid}/deny"
        actor: WarrantyAdmin
        preconditions: []
        side_effects:
          - "If a PartReturn was already REQUESTED for this claim, that PartReturn → LATE_REJECTED and recovery_status → RECOVERY_DENIED"

  - entity: WarrantyClaim
    field: recovery_status    # parallel dimension 2 — same row, independent lifecycle
    initial_state: NOT_INITIATED
    terminal_states: [RECOVERY_PAID, RECOVERY_DENIED]
    transitions:
      - from: NOT_INITIATED
        to: PART_RETURN_REQUESTED
        trigger: "system (claim APPROVED for BASE_WARRANTY or CAMPAIGN with returnable parts)"
        actor: system
        preconditions: []
        side_effects:
          - "A PartReturn row is created in REQUESTED status; return_window_days snapshotted"
      - from: PART_RETURN_REQUESTED
        to: PART_IN_TRANSIT
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/claims/{clid}/part-returns/{prid}/ship"
        actor: DealerAdvisor
        preconditions:
          - "current clock <= PartReturn.created_at + return_window_days"
        side_effects:
          - "PartReturn.shipped_at set; PartReturn → IN_TRANSIT"
      - from: PART_IN_TRANSIT
        to: PART_RECEIVED
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/claims/{clid}/part-returns/{prid}/receive"
        actor: SupplierManager
        preconditions: []
        side_effects:
          - "PartReturn.received_at set; PartReturn → RECEIVED"
      - from: PART_RECEIVED
        to: RECOVERY_FILED
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/claims/{clid}/recoveries (creates SupplierRecovery)"
        actor: SupplierManager
        preconditions:
          - "PartReturn.part_return_status == INSPECTED_OK"
        side_effects:
          - "A SupplierRecovery row is created with recovery_status FILED"
      - from: RECOVERY_FILED
        to: RECOVERY_PAID
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/claims/{clid}/recoveries/{srid}/mark-paid (paid_amount_cents)"
        actor: SupplierManager
        preconditions: []
        side_effects:
          - "SupplierRecovery.paid_amount_cents set; recovery → PAID"
          - "WarrantyClaim.recovery_amount_cents incremented"
      - from: RECOVERY_FILED
        to: RECOVERY_DENIED
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/claims/{clid}/recoveries/{srid}/deny"
        actor: SupplierManager
        preconditions: []
        side_effects: []
      - from: [PART_RETURN_REQUESTED, PART_IN_TRANSIT]
        to: RECOVERY_DENIED
        trigger: "system (return window lapses at ops_run, or PartReturn inspection == INSPECTED_FAILED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PartReturn
    field: part_return_status
    initial_state: REQUESTED
    terminal_states: [INSPECTED_OK, INSPECTED_FAILED, LATE_REJECTED]
    transitions:
      - from: REQUESTED
        to: IN_TRANSIT
        trigger: "system (driven by WarrantyClaim recovery PART_RETURN_REQUESTED → PART_IN_TRANSIT)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "system (driven by WarrantyClaim recovery PART_IN_TRANSIT → PART_RECEIVED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RECEIVED
        to: INSPECTED_OK
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/claims/{clid}/part-returns/{prid}/inspect (inspection_disposition=OK)"
        actor: SupplierManager
        preconditions: []
        side_effects: []
      - from: RECEIVED
        to: INSPECTED_FAILED
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/claims/{clid}/part-returns/{prid}/inspect (inspection_disposition=FAILED)"
        actor: SupplierManager
        preconditions: []
        side_effects:
          - "WarrantyClaim.recovery_status → RECOVERY_DENIED"
      - from: REQUESTED
        to: LATE_REJECTED
        trigger: "system (ops_run detects current clock > created_at + return_window_days and not yet shipped)"
        actor: system
        preconditions: []
        side_effects:
          - "WarrantyClaim.recovery_status → RECOVERY_DENIED"

  - entity: SupplierRecovery
    field: recovery_status
    initial_state: FILED
    terminal_states: [PAID, DENIED]
    transitions:
      - from: FILED
        to: UNDER_DISPUTE
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/claims/{clid}/recoveries/{srid}/dispute"
        actor: SupplierManager
        preconditions: []
        side_effects: []
      - from: UNDER_DISPUTE
        to: FILED
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/claims/{clid}/recoveries/{srid}/refile"
        actor: SupplierManager
        preconditions: []
        side_effects: []
      - from: [FILED, UNDER_DISPUTE]
        to: PAID
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/claims/{clid}/recoveries/{srid}/mark-paid"
        actor: SupplierManager
        preconditions: []
        side_effects:
          - "WarrantyClaim.recovery_amount_cents incremented by paid_amount_cents"
      - from: [FILED, UNDER_DISPUTE]
        to: DENIED
        trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/claims/{clid}/recoveries/{srid}/deny"
        actor: SupplierManager
        preconditions: []
        side_effects: []

  - entity: CoverageContract
    field: contract_status
    initial_state: ACTIVE
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (current clock >= ends_on, OR Truck.odometer_miles >= max_miles)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /fleets/{fid}/trucks/{tid}/coverage-contracts/{ccid}/cancel"
        actor: FleetManager
        preconditions: []
        side_effects:
          - "coverage_proration runs; CoverageContract.prorated_credit_cents computed"
          - "Fleet ledger credited"

  - entity: Campaign
    field: campaign_status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /campaigns/{cid}/close"
        actor: UptimeCoordinator
        preconditions:
          - "completion_pct >= 95.00 OR current clock > closes_on + 90 days"
        side_effects: []

  - entity: CampaignCompletion
    field: completion_status
    initial_state: OPEN
    terminal_states: [COMPLETED, EXEMPTED]
    transitions:
      - from: OPEN
        to: SCHEDULED
        trigger: "POST /campaigns/{cid}/completions/{ccid}/schedule (link case_id)"
        actor: UptimeCoordinator
        preconditions:
          - "Case.fault_code == Campaign.fault_code AND Case.truck_id == CampaignCompletion.truck_id"
          - "Case.case_status in {TRIAGE, SCHEDULED, IN_SERVICE, AWAITING_PART}"
        side_effects: []
      - from: SCHEDULED
        to: COMPLETED
        trigger: "system (linked Case reaches CLOSED)"
        actor: system
        preconditions: []
        side_effects:
          - "Campaign.completion_pct recomputed"
      - from: OPEN
        to: EXEMPTED
        trigger: "POST /campaigns/{cid}/completions/{ccid}/exempt (with exemption_reason)"
        actor: UptimeCoordinator
        preconditions: []
        side_effects:
          - "Campaign.completion_pct recomputed"
      - from: SCHEDULED
        to: OPEN
        trigger: "system (linked Case is CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ServiceBay
    field: bay_status
    initial_state: AVAILABLE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "system (Case scheduled on this bay)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESERVED
        to: IN_USE
        trigger: "system (Case starts service on this bay)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_USE
        to: AVAILABLE
        trigger: "system (Case on this bay CLOSED or CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESERVED
        to: AVAILABLE
        trigger: "system (Case on this bay CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: DOWN
        trigger: "POST /dealers/{did}/bays/{bid}/mark-down"
        actor: DealerAdvisor
        preconditions: []
        side_effects: []
      - from: DOWN
        to: AVAILABLE
        trigger: "POST /dealers/{did}/bays/{bid}/mark-available"
        actor: DealerAdvisor
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: case-schedule-stale-truck
    parent_entity: Truck
    write_endpoint: "POST /fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/schedule"
    occ_field: "expected_truck_version"
    description: |
      Scheduling a Case against a Truck whose `version` has advanced since the
      client last read it is rejected with ERR_STALE_VERSION. This captures the
      case where another coordinator has just scheduled a different Case on
      the same Truck (legitimately mutating Truck.open_case_count and version)
      and the current writer's view of the Truck is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: claim-submit-stale-case
    parent_entity: Case
    write_endpoint: "POST /fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/claims/{claimId}/submit"
    occ_field: "expected_case_version"
    description: |
      Submitting a WarrantyClaim against a Case whose `version` has advanced
      since the client last read it is rejected with ERR_STALE_VERSION. A prior
      approval/denial or a supplemental PartOrder on the same Case legitimately
      bumps Case.version; a stale submitter must re-fetch and re-submit.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: campaign-close-stale-campaign
    parent_entity: Campaign
    write_endpoint: "POST /campaigns/{campaignId}/close"
    occ_field: "expected_campaign_version"
    description: |
      Closing a Campaign against a Campaign whose `version` has advanced since
      the client last read it (e.g., another coordinator's exempt/complete
      action bumped completion_pct) is rejected with ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: expedite_decision
    trigger: "POST /fleets/{fid}/trucks/{tid}/cases/{cid}/part-orders/{poid}/evaluate-expedite (PartsManager)"
    algorithm: threshold
    formula: |
      Inputs: quantity, part_cost_cents, dealer_repair_hours_est, downtime_rate_cents_per_hour, expedite_overnight_cost_cents, expedite_standard_cost_cents
      downtime_cost_cents   = round_half_up( dealer_repair_hours_est * downtime_rate_cents_per_hour )
      overnight_gain_cents  = downtime_cost_cents - expedite_overnight_cost_cents
      standard_gain_cents   = round_half_up( 0.6 * downtime_cost_cents ) - expedite_standard_cost_cents
      Decision:
        if overnight_gain_cents >= 0 AND overnight_gain_cents >= standard_gain_cents:
          expedite_decision = EXPEDITE_OVERNIGHT;  expedite_cost_cents = expedite_overnight_cost_cents
        elif standard_gain_cents >= 0:
          expedite_decision = EXPEDITE_STANDARD;   expedite_cost_cents = expedite_standard_cost_cents
        else:
          expedite_decision = DENIED;              expedite_cost_cents = 0
      Boundary: tie between overnight_gain_cents and standard_gain_cents picks OVERNIGHT (>=, not >).
    input_set: "PartOrder row + Case.dealer_id (for rate) + current Truck.odometer_miles"
    constants:
      STANDARD_GAIN_FACTOR: 0.6
    precision: "integer cents; intermediate products round_half_up to integer cents"

  - name: labor_time_standard
    trigger: "WarrantyClaim DRAFT → SUBMITTED"
    algorithm: tiered_pricing
    formula: |
      Inputs: fault_code, claim_type, labor_minutes_claimed
      Per-fault-code labor time standard table (hours):
        SPN3216_FMI4 (aftertreatment doser): base 4.0 h
        SPN3226_FMI4 (DOC pressure):         base 3.5 h
        SPN168_FMI4  (battery potential):    base 2.0 h
        default:                              base 2.5 h
      claim_type multiplier:
        BASE_WARRANTY:      1.0
        CAMPAIGN:           0.9   (campaign work rate)
        EXTENDED_COVERAGE:  1.1   (extended coverage allowance)
        GOODWILL:           0.0   (goodwill claims do not reimburse labor)
      labor_hours_allowed = round_half_up( base_hours * multiplier, 2 )
      Boundary: labor_minutes_claimed <= labor_hours_allowed * 60 (inclusive);
      labor_minutes_claimed == labor_hours_allowed * 60 succeeds; +1 minute fails.
    input_set: "WarrantyClaim row + fault_code table"
    constants:
      BASE_HOURS_TABLE: { SPN3216_FMI4: 4.0, SPN3226_FMI4: 3.5, SPN168_FMI4: 2.0, DEFAULT: 2.5 }
      MULTIPLIER_TABLE: { BASE_WARRANTY: 1.0, CAMPAIGN: 0.9, EXTENDED_COVERAGE: 1.1, GOODWILL: 0.0 }
    precision: "labor_hours_allowed 2 decimal places round_half_up; labor_amount_allowed_cents integer cents"
    variants:
      - name: at_submission
        when: "Computed when claim moves DRAFT → SUBMITTED"
        difference: "Snapshot; not recomputed later even if dealer rate changes"
      - name: at_partial_approval
        when: "Recomputed when admin adjusts allowance on UNDER_REVIEW → PARTIAL_APPROVED"
        difference: "Uses same formula but allows admin override to lower values only"

  - name: parts_allowance
    trigger: "WarrantyClaim DRAFT → SUBMITTED (paired with labor_time_standard)"
    algorithm: weighted_scoring
    formula: |
      Inputs: parts_claimed_cents, claim_type, Truck.odometer_miles, Truck.base_warranty_until_miles, CoverageContract rows on Truck
      Base eligibility:
        if claim_type == BASE_WARRANTY:
          if Truck.odometer_miles <= Truck.base_warranty_until_miles: parts_cap_pct = 1.0
          else: parts_cap_pct = 0.0
        elif claim_type == CAMPAIGN:
          parts_cap_pct = 1.0   (campaigns always cover parts 100%)
        elif claim_type == EXTENDED_COVERAGE:
          pct_remaining = coverage_proration.prorated_credit_cents / CoverageContract.premium_cents
          parts_cap_pct = min(1.0, pct_remaining)
        else (GOODWILL):
          parts_cap_pct = 0.5
      parts_amount_allowed_cents = round_half_up( parts_claimed_cents * parts_cap_pct )
    input_set: "WarrantyClaim row + Truck + active CoverageContract"
    constants: {}
    precision: "integer cents; round_half_up"

  - name: coverage_proration
    trigger: "CoverageContract ACTIVE → CANCELLED (early cancel), or evaluated lazily when an EXTENDED_COVERAGE claim is submitted"
    algorithm: decay_function
    formula: |
      Two proration bases exist; the one that yields the SMALLER credit is used (most favorable to OEM).
      Base 1 — time-based:
        total_days     = (ends_on - starts_on) in whole days, floor
        elapsed_days   = (cancel_at - starts_on) in whole days, floor, clamped to [0, total_days]
        time_credit    = premium_cents * (total_days - elapsed_days) / total_days
      Base 2 — mileage-based:
        total_miles    = max_miles (assumed 0 miles at starts_on for the contract's purposes)
        used_miles     = Truck.odometer_miles - Truck.odometer_at_contract_start, clamped to [0, total_miles]
        mileage_credit = premium_cents * (total_miles - used_miles) / total_miles
      prorated_credit_cents = round_half_up( min(time_credit, mileage_credit) )
      Boundary: when cancel_at == starts_on, credit == premium_cents (full refund).
      Boundary: when Truck.odometer_miles == max_miles, credit == 0.
    input_set: "CoverageContract row + Truck.odometer_miles + cancel_at (clock)"
    constants: {}
    precision: "integer cents; round_half_up; division done in rationals then rounded once at end"

  - name: repeat_repair_window
    trigger: "WorkOrder COMPLETED with repair_outcome != FIXED, OR Case → CLOSED"
    algorithm: chronological
    formula: |
      Maintain a rolling 90-day window per Truck per fault_code.
      For Truck T and fault_code F, count Case rows C where:
        C.truck_id == T
        C.fault_code == F
        C.opened_at >= (now - 90 days)
        C.case_status != CANCELLED
      If count >= 3: Truck.repeat_repair_flag = true and Fleet.reliability_score -= 25 (idempotent per Truck-F pair until window slides).
      When count drops below 3 due to window slide (at ops_run), Truck.repeat_repair_flag = false if no other fault_code is in repeat state.
    input_set: "Case rows by (truck_id, fault_code) ordered by opened_at"
    constants:
      REPEAT_THRESHOLD: 3
      WINDOW_DAYS: 90
      REPEAT_PENALTY: 25
    precision: "integer counts; window boundary is opened_at >= (now - 90d), i.e. INCLUSIVE"

  - name: reliability_score_update
    trigger: "Case closed; WorkOrder completed; repeat-repair window crossing; ops_run overdue-campaign sweep"
    algorithm: aggregation
    formula: |
      Initial: 1000.
      Case closes with downtime_hours > 24.0: -10 per Case (threshold is >, not >=)
      WorkOrder completes with repair_outcome == NOT_FIXED: -15
      Repeat-repair threshold crossing for a (Truck, fault_code) pair: -25 (per repeat_repair_window)
      Ops-run finds OPEN CampaignCompletion past closes_on: -5 per row per ops_run
      Floor: 0. Score never goes negative; further penalties clamp at 0.
    input_set: "Fleet-scoped events"
    constants:
      DOWNTIME_PENALTY_THRESHOLD_HOURS: 24.0
      DOWNTIME_PENALTY: 10
      NOT_FIXED_PENALTY: 15
      REPEAT_PENALTY: 25
      CAMPAIGN_OVERDUE_PENALTY: 5
    precision: "integer"
    variants:
      - name: incremental
        when: "Event-driven updates at transition time"
        difference: "Applies penalty exactly once per event"
      - name: snapshot
        when: "ops_run recomputes from scratch and writes to ReliabilityReport"
        difference: "Recomputes from full event history for cross-check; serves as audit"

  - name: campaign_completion_pct
    trigger: "CampaignCompletion SCHEDULED → COMPLETED, OPEN → EXEMPTED, OPEN → SCHEDULED, ops_run"
    algorithm: aggregation
    formula: |
      Let in_scope = CampaignCompletion rows for the Campaign where completion_status != EXEMPTED.
      Let completed = rows where completion_status == COMPLETED.
      If |in_scope| == 0: completion_pct = 0.00
      Else: completion_pct = round_half_up( 100.0 * |completed| / |in_scope|, 2 )
      Boundary: EXEMPTED rows are excluded from both numerator and denominator; a campaign whose
      entire scope is EXEMPTED reports 0.00 (not 100.00).
    input_set: "CampaignCompletion rows for one Campaign"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: expedite_freight_cost
    trigger: "PartOrder evaluate-expedite (used inside expedite_decision)"
    algorithm: tiered_pricing
    formula: |
      Inputs: quantity, part_weight_kg_per_unit, distance_band (computed from dealer.region and warehouse region)
      distance_band:
        INTRA_REGION:  base 15000 cents + 300 cents/kg
        CROSS_COUNTRY: base 45000 cents + 900 cents/kg
        INTERNATIONAL: base 150000 cents + 3000 cents/kg
      weight_total_kg = quantity * part_weight_kg_per_unit (round_half_up to 0.1 kg)
      expedite_overnight_cost_cents = base + rate * weight_total_kg
      expedite_standard_cost_cents  = round_half_up( 0.4 * expedite_overnight_cost_cents )
      Boundary: 0.0 kg total weight is rejected (ERR_INVALID_REQUEST); weights < 0.1 kg round up to 0.1.
    input_set: "PartOrder + part master + Dealer region"
    constants:
      RATE_TABLE: { INTRA_REGION: { base: 15000, per_kg: 300 }, CROSS_COUNTRY: { base: 45000, per_kg: 900 }, INTERNATIONAL: { base: 150000, per_kg: 3000 } }
    precision: "integer cents"

  - name: supplier_recovery_amount
    trigger: "SupplierRecovery mark-paid"
    algorithm: waterfall_allocation
    formula: |
      Inputs: claimed_amount_cents, paid_amount_cents (admin-supplied), WarrantyClaim.parts_amount_allowed_cents
      Rule: paid_amount_cents <= claimed_amount_cents, else ERR_RECOVERY_OVERPAID.
      Allocation order:
        1. paid_amount_cents first offsets the OEM's parts_amount_allowed_cents (recorded on the claim).
        2. Any excess beyond parts_amount_allowed_cents is rejected — paid cannot exceed claimed, and
           claimed must be <= parts_amount_allowed_cents at FILED time (validation).
      WarrantyClaim.recovery_amount_cents += paid_amount_cents.
    input_set: "SupplierRecovery + WarrantyClaim"
    constants: {}
    precision: "integer cents"

  - name: campaign_overdue_sweep
    trigger: "ops_run"
    algorithm: threshold
    formula: |
      For each CampaignCompletion cc where completion_status == OPEN AND now > Campaign.closes_on:
        if cc was not already overdue at previous ops_run: mark newly_overdue
        Fleet.reliability_score -= CAMPAIGN_OVERDUE_PENALTY (per occurrence per ops_run)
      Campaign.overdue_count = count of OPEN rows past closes_on.
      Boundary: a row whose closes_on == now exactly is NOT overdue (> not >=).
    input_set: "CampaignCompletion OPEN rows"
    constants:
      CAMPAIGN_OVERDUE_PENALTY: 5

  - name: truck_downtime_hours
    trigger: "Case → CLOSED"
    algorithm: aggregation
    formula: |
      downtime_hours = round_half_up( (closed_at - opened_at).total_seconds() / 3600, 2 )
      Always >= 0.00.
      Boundary: sub-hour closures round half-up to 2 decimals (e.g., 30 minutes = 0.50; 1 minute = 0.02).
    input_set: "Single Case row"
    precision: "2 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and parseable"
    error_id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role must be authorized for the endpoint"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: auth
    check: "For entity_backed roles, X-User-ID must reference an existing entity of the matching type"
    error_id: ERR_ACTOR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints where the role is entity_backed"

  - priority: 4
    category: existence
    check: "Path parameters must resolve left-to-right: Fleet, then Truck within Fleet, then Case within Truck, then child entities within Case"
    error_id: "ERR_FLEET_NOT_FOUND | ERR_TRUCK_NOT_FOUND | ERR_CASE_NOT_FOUND | ERR_DEALER_NOT_FOUND | ERR_BAY_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_WORK_ORDER_NOT_FOUND | ERR_PART_ORDER_NOT_FOUND | ERR_PART_RETURN_NOT_FOUND | ERR_RECOVERY_NOT_FOUND | ERR_CAMPAIGN_NOT_FOUND | ERR_FAULT_EVENT_NOT_FOUND | ERR_COVERAGE_CONTRACT_NOT_FOUND | ERR_CAMPAIGN_COMPLETION_NOT_FOUND"
    http_status: 404
    applies_to: all nested endpoints

  - priority: 5
    category: state
    check: "Fleet.fleet_status must be ACTIVE for any mutating operation under that fleet"
    error_id: ERR_FLEET_NOT_ACTIVE
    http_status: 409
    applies_to: "all mutating /fleets/{id}/... endpoints"

  - priority: 6
    category: state
    check: "Truck.truck_status must not be DECOMMISSIONED for any new case/coverage action"
    error_id: ERR_TRUCK_DECOMMISSIONED
    http_status: 409
    applies_to: "POST /fleets/{id}/trucks/{tid}/cases, POST /fleets/{id}/trucks/{tid}/coverage-contracts"

  - priority: 7
    category: state
    check: "Resource state precondition (Case/WorkOrder/PartOrder/Claim/PartReturn/Recovery state)"
    error_id: "ERR_INVALID_STATE_TRANSITION"
    http_status: 409
    applies_to: "state transition endpoints"

  - priority: 8
    category: business_safety
    check: "FaultEvent with severity=CRITICAL and recommended_action=STOP_IMMEDIATELY must produce a Case opened within 30 minutes of occurred_at (validation at case-creation time: occurred_at >= now - 30min)"
    error_id: ERR_CRITICAL_FAULT_WINDOW_LAPSED
    http_status: 422
    applies_to: "POST /fleets/{id}/trucks/{tid}/cases with fault_event_id"

  - priority: 9
    category: business_safety
    check: "ServiceBay must be AVAILABLE for the requested window AND no overlapping AUTHORIZED/IN_PROGRESS WorkOrder on the same bay with overlapping [start_at, end_at) interval"
    error_id: ERR_BAY_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /fleets/{id}/trucks/{tid}/cases/{cid}/schedule"

  - priority: 10
    category: business_safety
    check: "Dealer.dealer_status == ACTIVE at schedule time AND Dealer.region must match Fleet.home_region (cross-region dispatch requires ERR_CROSS_REGION_DISPATCH warning flag set in request; otherwise rejected)"
    error_id: ERR_DEALER_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /fleets/{id}/trucks/{tid}/cases/{cid}/schedule"

  - priority: 11
    category: business_temporal
    check: "PartReturn shipped_at must be <= created_at + return_window_days"
    error_id: ERR_RETURN_WINDOW_LAPSED
    http_status: 422
    applies_to: "POST .../part-returns/{prid}/ship"

  - priority: 12
    category: business_temporal
    check: "CoverageContract.starts_on < ends_on; starts_on >= Truck.in_service_on"
    error_id: ERR_INVALID_COVERAGE_WINDOW
    http_status: 422
    applies_to: "POST /fleets/{id}/trucks/{tid}/coverage-contracts"

  - priority: 13
    category: business_referential
    check: "WarrantyClaim submission requires labor_minutes_claimed <= labor_hours_allowed * 60 (computed per labor_time_standard)"
    error_id: ERR_LABOR_MINUTES_EXCEED_STANDARD
    http_status: 422
    applies_to: "POST .../claims/{clid}/submit"

  - priority: 14
    category: business_referential
    check: "SupplierRecovery.claimed_amount_cents <= WarrantyClaim.parts_amount_allowed_cents AND PartReturn.part_return_status == INSPECTED_OK"
    error_id: ERR_RECOVERY_CLAIM_EXCEEDS_ALLOWANCE
    http_status: 422
    applies_to: "POST .../claims/{clid}/recoveries"

  - priority: 15
    category: business_fiscal
    check: "Case closure forbidden while any WarrantyClaim in SUBMITTED or UNDER_REVIEW"
    error_id: ERR_CASE_HAS_OPEN_CLAIM
    http_status: 409
    applies_to: "POST .../cases/{cid}/close"

  - priority: 16
    category: business_fiscal
    check: "paid_amount_cents <= claimed_amount_cents on SupplierRecovery"
    error_id: ERR_RECOVERY_OVERPAID
    http_status: 422
    applies_to: "POST .../recoveries/{srid}/mark-paid"

  - priority: 17
    category: business_constraint
    check: "WorkOrder scheduled window must satisfy end_at > start_at AND end_at - start_at >= 30 minutes"
    error_id: ERR_INVALID_WORK_ORDER_WINDOW
    http_status: 422
    applies_to: "POST .../cases/{cid}/schedule, PUT .../work-orders/{woid}"

  - priority: 18
    category: business_constraint
    check: "VIN uniqueness across all Truck rows; campaign_code uniqueness across all Campaign rows"
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /fleets/{id}/trucks, POST /campaigns"

  - priority: 19
    category: business_constraint
    check: "Truck.odometer_miles must be monotonically non-decreasing on update"
    error_id: ERR_ODOMETER_REGRESSION
    http_status: 422
    applies_to: "PUT /fleets/{id}/trucks/{tid}"

  - priority: 20
    category: business_constraint
    check: "Campaign closes_on > opens_on AND affected_model_codes must be a non-empty array of strings"
    error_id: ERR_INVALID_CAMPAIGN_WINDOW
    http_status: 422
    applies_to: "POST /campaigns"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the server's logical clock. Server starts at 2026-09-01T00:00:00Z by default; this endpoint overrides it. Used by tests to exercise time-window rules deterministically."
    roles: [UptimeCoordinator, WarrantyAdmin, SupplierManager, FleetManager, DealerAdvisor, PartsManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: "ISO8601" }
    side_effects: ["logical clock advanced"]

  - method: POST
    path: "/_ops/run"
    description: "Trigger an ops_run: sweeps overdue campaigns, expires coverage contracts, recomputes reliability_score from scratch, snapshots ReliabilityReport."
    roles: [UptimeCoordinator]
    code: 200
    input: []
    output: { ops_run_index: integer, fleets_processed: integer }
    side_effects:
      - "campaign_overdue_sweep for each fleet"
      - "reliability_score_update (snapshot variant) per fleet"
      - "CoverageContract ACTIVE → EXPIRED if clock >= ends_on or odometer >= max_miles"
      - "PartReturn REQUESTED → LATE_REJECTED if window lapsed"
      - "ReliabilityReport row written per fleet"

  # ---- Fleet ----
  - method: POST
    path: "/fleets"
    description: "Create a fleet"
    roles: [FleetManager]
    code: 201
    input: [fleet_name, home_region]
    output: Fleet
    side_effects: ["fleet_status = ACTIVE", "reliability_score = 1000"]

  - method: GET
    path: "/fleets"
    description: "List fleets"
    roles: [FleetManager, UptimeCoordinator, WarrantyAdmin, SupplierManager, DealerAdvisor, PartsManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "Fleet[]"
    side_effects: []

  - method: GET
    path: "/fleets/{fleetId}"
    description: "Get one fleet"
    roles: [FleetManager, UptimeCoordinator, WarrantyAdmin, SupplierManager, DealerAdvisor, PartsManager]
    code: 200
    input: []
    output: Fleet
    side_effects: []

  - method: PUT
    path: "/fleets/{fleetId}"
    description: "Update fleet metadata"
    roles: [FleetManager]
    code: 200
    input: ["fleet_name?", "home_region?"]
    output: Fleet
    side_effects: ["increments Fleet.version by 1"]

  - method: POST
    path: "/fleets/{fleetId}/suspend"
    description: "Suspend a fleet (no new mutating ops allowed)"
    roles: [FleetManager]
    code: 200
    input: []
    output: Fleet
    side_effects: ["fleet_status → SUSPENDED", "increments Fleet.version"]

  - method: POST
    path: "/fleets/{fleetId}/reactivate"
    description: "Reactivate a suspended fleet"
    roles: [FleetManager]
    code: 200
    input: []
    output: Fleet
    side_effects: ["fleet_status → ACTIVE"]

  # ---- Truck ----
  - method: POST
    path: "/fleets/{fleetId}/trucks"
    description: "Register a truck"
    roles: [FleetManager]
    code: 201
    input: [vin, model_code, in_service_on, odometer_miles, base_warranty_until_miles, base_warranty_until_on]
    output: Truck
    side_effects: ["truck_status = IN_SERVICE"]

  - method: GET
    path: "/fleets/{fleetId}/trucks"
    description: "List trucks in fleet"
    roles: [FleetManager, UptimeCoordinator, WarrantyAdmin, DealerAdvisor, PartsManager]
    code: 200
    input: ["limit?", "offset?", "truck_status?", "model_code?"]
    output: "Truck[]"
    side_effects: []

  - method: GET
    path: "/fleets/{fleetId}/trucks/{truckId}"
    description: "Get one truck"
    roles: [FleetManager, UptimeCoordinator, WarrantyAdmin, DealerAdvisor, PartsManager, SupplierManager]
    code: 200
    input: []
    output: Truck
    side_effects: []

  - method: PUT
    path: "/fleets/{fleetId}/trucks/{truckId}"
    description: "Update truck odometer / metadata"
    roles: [FleetManager]
    code: 200
    input: ["odometer_miles?"]
    output: Truck
    side_effects: ["odometer regression check (priority 19)", "increments Truck.version"]

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/decommission"
    description: "Decommission a truck"
    roles: [FleetManager]
    code: 200
    input: []
    output: Truck
    side_effects: ["truck_status → DECOMMISSIONED", "coverage contracts cancelled with proration", "campaign completions exempted"]

  # ---- FaultEvent ----
  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/fault-events"
    description: "Ingest a telematics fault event"
    roles: [UptimeCoordinator]
    code: 201
    input: [fault_code, severity, recommended_action, occurred_at]
    output: FaultEvent
    side_effects: ["event_status = UNLINKED"]

  - method: GET
    path: "/fleets/{fleetId}/trucks/{truckId}/fault-events"
    description: "List fault events for a truck"
    roles: [UptimeCoordinator, FleetManager, DealerAdvisor, WarrantyAdmin]
    code: 200
    input: ["limit?", "offset?", "event_status?", "severity?"]
    output: "FaultEvent[]"
    side_effects: []

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/fault-events/{faultEventId}/dismiss"
    description: "Dismiss an UNLINKED fault event"
    roles: [UptimeCoordinator]
    code: 200
    input: []
    output: FaultEvent
    side_effects: ["event_status → DISMISSED"]

  # ---- Case ----
  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases"
    description: "Open a case (optionally linking a fault_event)"
    roles: [UptimeCoordinator]
    code: 201
    input: [fault_code, "fault_event_id?"]
    output: Case
    side_effects:
      - "case_status = OPEN; opened_at = clock"
      - "Truck.open_case_count++, Fleet.open_case_count++"
      - "If fault_event_id: FaultEvent.event_status → LINKED; Case.severity_at_open snapshotted"

  - method: GET
    path: "/fleets/{fleetId}/trucks/{truckId}/cases"
    description: "List cases for a truck"
    roles: [UptimeCoordinator, FleetManager, DealerAdvisor, WarrantyAdmin, PartsManager, SupplierManager]
    code: 200
    input: ["limit?", "offset?", "case_status?"]
    output: "Case[]"
    side_effects: []

  - method: GET
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}"
    description: "Get one case"
    roles: [UptimeCoordinator, FleetManager, DealerAdvisor, WarrantyAdmin, PartsManager, SupplierManager]
    code: 200
    input: []
    output: Case
    side_effects: []

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/triage"
    description: "Triage an OPEN case"
    roles: [UptimeCoordinator]
    code: 200
    input: []
    output: Case
    side_effects: ["case_status → TRIAGE", "Case.version++"]

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/schedule"
    description: "Schedule a TRIAGE case onto a dealer bay"
    roles: [UptimeCoordinator]
    code: 200
    input: [dealer_id, bay_id, scheduled_start_at, scheduled_end_at, expected_truck_version, "allow_cross_region?"]
    output: Case
    side_effects:
      - "case_status → SCHEDULED"
      - "Creates DRAFT WorkOrder"
      - "ServiceBay → RESERVED"
      - "Truck.version++ (OCC)"
      - "Case.version++"

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/start-service"
    description: "Start service on a SCHEDULED case"
    roles: [DealerAdvisor]
    code: 200
    input: []
    output: Case
    side_effects: ["case_status → IN_SERVICE", "WorkOrder AUTHORIZED → IN_PROGRESS", "ServiceBay → IN_USE", "Truck → DOWN"]

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/request-close"
    description: "Request case close (moves to PENDING_CLOSE)"
    roles: [DealerAdvisor]
    code: 200
    input: []
    output: Case
    side_effects: ["case_status → PENDING_CLOSE"]

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/reopen-service"
    description: "Reopen a PENDING_CLOSE case back to IN_SERVICE"
    roles: [UptimeCoordinator]
    code: 200
    input: []
    output: Case
    side_effects: ["case_status → IN_SERVICE"]

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/close"
    description: "Close a PENDING_CLOSE case"
    roles: [UptimeCoordinator]
    code: 200
    input: []
    output: Case
    side_effects:
      - "case_status → CLOSED; closed_at = clock"
      - "truck_downtime_hours computed and stored"
      - "Fleet.total_downtime_hours += downtime_hours"
      - "reliability_score_update incremental"
      - "ServiceBay → AVAILABLE"
      - "Truck.open_case_count--, Fleet.open_case_count--"
      - "If Truck.open_case_count == 0: Truck → IN_SERVICE"
      - "Linked CampaignCompletion SCHEDULED → COMPLETED"

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/cancel"
    description: "Cancel an OPEN/TRIAGE/SCHEDULED case"
    roles: [UptimeCoordinator]
    code: 200
    input: []
    output: Case
    side_effects: ["case_status → CANCELLED", "bay released", "DRAFT WorkOrders cancelled", "PENDING PartOrders cancelled", "open_case_counts decremented"]

  # ---- WorkOrder ----
  - method: GET
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/work-orders"
    description: "List work orders for a case"
    roles: [UptimeCoordinator, FleetManager, DealerAdvisor, WarrantyAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "WorkOrder[]"
    side_effects: []

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/work-orders/{workOrderId}/authorize"
    description: "Authorize diagnostic time on a DRAFT work order"
    roles: [UptimeCoordinator]
    code: 200
    input: [diagnostic_minutes_authorized]
    output: WorkOrder
    side_effects: ["work_order_status → AUTHORIZED", "Case.diagnostic_minutes_authorized += amount"]

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/work-orders/{workOrderId}/complete"
    description: "Complete an IN_PROGRESS work order"
    roles: [DealerAdvisor]
    code: 200
    input: [labor_minutes_actual, repair_outcome]
    output: WorkOrder
    side_effects: ["work_order_status → COMPLETED", "if repair_outcome != FIXED: repeat_repair_window evaluated"]

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/work-orders/{workOrderId}/cancel"
    description: "Cancel a DRAFT or AUTHORIZED work order"
    roles: [UptimeCoordinator]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["work_order_status → CANCELLED", "bay released if RESERVED", "Case.diagnostic_minutes_authorized decremented"]

  # ---- PartOrder ----
  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/part-orders"
    description: "Create a part order against an IN_SERVICE case"
    roles: [PartsManager]
    code: 201
    input: [part_number, quantity, part_weight_kg_per_unit, part_cost_cents]
    output: PartOrder
    side_effects: ["part_order_status = PENDING", "expedite_decision = PENDING_EVAL", "Case → AWAITING_PART"]

  - method: GET
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/part-orders"
    description: "List part orders for a case"
    roles: [UptimeCoordinator, FleetManager, DealerAdvisor, PartsManager, WarrantyAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "PartOrder[]"
    side_effects: []

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/part-orders/{partOrderId}/evaluate-expedite"
    description: "Run the expedite decision algorithm"
    roles: [PartsManager]
    code: 200
    input: [dealer_repair_hours_est, downtime_rate_cents_per_hour, distance_band]
    output: PartOrder
    side_effects: ["expedite_freight_cost runs", "expedite_decision computed", "expedite_cost_cents and downtime_cost_cents stored", "if EXPEDITE_OVERNIGHT: Case.expedite_count++"]

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/part-orders/{partOrderId}/ship"
    description: "Mark part order shipped"
    roles: [PartsManager]
    code: 200
    input: []
    output: PartOrder
    side_effects: ["part_order_status → SHIPPED"]

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/part-orders/{partOrderId}/receive"
    description: "Mark part order received at dealer"
    roles: [DealerAdvisor]
    code: 200
    input: []
    output: PartOrder
    side_effects: ["part_order_status → RECEIVED"]

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/part-orders/{partOrderId}/install"
    description: "Mark part order installed on truck"
    roles: [DealerAdvisor]
    code: 200
    input: []
    output: PartOrder
    side_effects: ["part_order_status → INSTALLED", "if all PartOrders terminal: Case AWAITING_PART → IN_SERVICE"]

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/part-orders/{partOrderId}/cancel"
    description: "Cancel a PENDING part order"
    roles: [PartsManager]
    code: 200
    input: []
    output: PartOrder
    side_effects: ["part_order_status → CANCELLED", "if was EXPEDITE_OVERNIGHT: Case.expedite_count--"]

  # ---- WarrantyClaim ----
  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/claims"
    description: "Create a warranty claim against a case"
    roles: [WarrantyAdmin]
    code: 201
    input: [claim_type, labor_minutes_claimed, parts_claimed_cents]
    output: WarrantyClaim
    side_effects: ["submission_status = DRAFT", "recovery_status = NOT_INITIATED", "labor_rate_cents_per_hour snapshotted from Dealer"]

  - method: GET
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/claims"
    description: "List claims for a case"
    roles: [WarrantyAdmin, UptimeCoordinator, FleetManager, SupplierManager]
    code: 200
    input: ["limit?", "offset?", "submission_status?", "recovery_status?"]
    output: "WarrantyClaim[]"
    side_effects: []

  - method: GET
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/claims/{claimId}"
    description: "Get one claim"
    roles: [WarrantyAdmin, UptimeCoordinator, FleetManager, SupplierManager, DealerAdvisor]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/claims/{claimId}/submit"
    description: "Submit a DRAFT claim (computes allowances; OCC against Case)"
    roles: [WarrantyAdmin]
    code: 200
    input: [expected_case_version]
    output: WarrantyClaim
    side_effects:
      - "labor_time_standard runs (validates labor_minutes_claimed <= labor_hours_allowed * 60)"
      - "parts_allowance runs"
      - "submission_status → SUBMITTED"
      - "Case.version++ (OCC)"

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/claims/{claimId}/begin-review"
    description: "Move claim from SUBMITTED to UNDER_REVIEW"
    roles: [WarrantyAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["submission_status → UNDER_REVIEW"]

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/claims/{claimId}/approve"
    description: "Approve an UNDER_REVIEW claim (optionally partially)"
    roles: [WarrantyAdmin]
    code: 200
    input: ["partial_labor_amount_allowed_cents?", "partial_parts_amount_allowed_cents?"]
    output: WarrantyClaim
    side_effects:
      - "if either partial_* provided and lower than allowed: submission_status → PARTIAL_APPROVED with adjusted amounts"
      - "else: submission_status → APPROVED"
      - "if claim_type in {BASE_WARRANTY, CAMPAIGN}: recovery_status → PART_RETURN_REQUESTED; a PartReturn is created (return_window_days snapshotted)"

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/claims/{claimId}/deny"
    description: "Deny an UNDER_REVIEW claim"
    roles: [WarrantyAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["submission_status → DENIED", "if PartReturn REQUESTED: → LATE_REJECTED; recovery_status → RECOVERY_DENIED"]

  # ---- PartReturn ----
  - method: GET
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/claims/{claimId}/part-returns"
    description: "List part returns for a claim"
    roles: [WarrantyAdmin, SupplierManager, DealerAdvisor]
    code: 200
    input: ["limit?", "offset?"]
    output: "PartReturn[]"
    side_effects: []

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/claims/{claimId}/part-returns/{partReturnId}/ship"
    description: "Mark failed part shipped back to supplier"
    roles: [DealerAdvisor]
    code: 200
    input: []
    output: PartReturn
    side_effects: ["part_return_status → IN_TRANSIT", "shipped_at set", "WarrantyClaim.recovery_status → PART_IN_TRANSIT"]

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/claims/{claimId}/part-returns/{partReturnId}/receive"
    description: "Mark failed part received at supplier"
    roles: [SupplierManager]
    code: 200
    input: []
    output: PartReturn
    side_effects: ["part_return_status → RECEIVED", "received_at set", "WarrantyClaim.recovery_status → PART_RECEIVED"]

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/claims/{claimId}/part-returns/{partReturnId}/inspect"
    description: "Inspect the received part"
    roles: [SupplierManager]
    code: 200
    input: [inspection_disposition]
    output: PartReturn
    side_effects:
      - "if OK: part_return_status → INSPECTED_OK"
      - "if FAILED: part_return_status → INSPECTED_FAILED AND WarrantyClaim.recovery_status → RECOVERY_DENIED"

  # ---- SupplierRecovery ----
  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/claims/{claimId}/recoveries"
    description: "File a supplier recovery against an INSPECTED_OK part return"
    roles: [SupplierManager]
    code: 201
    input: [part_return_id, supplier_id, claimed_amount_cents]
    output: SupplierRecovery
    side_effects: ["recovery_status = FILED", "WarrantyClaim.recovery_status → RECOVERY_FILED"]

  - method: GET
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/claims/{claimId}/recoveries"
    description: "List supplier recoveries for a claim"
    roles: [SupplierManager, WarrantyAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "SupplierRecovery[]"
    side_effects: []

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/claims/{claimId}/recoveries/{recoveryId}/dispute"
    description: "Mark recovery disputed"
    roles: [SupplierManager]
    code: 200
    input: []
    output: SupplierRecovery
    side_effects: ["recovery_status → UNDER_DISPUTE"]

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/claims/{claimId}/recoveries/{recoveryId}/refile"
    description: "Refile a disputed recovery (cycle)"
    roles: [SupplierManager]
    code: 200
    input: []
    output: SupplierRecovery
    side_effects: ["recovery_status → FILED"]

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/claims/{claimId}/recoveries/{recoveryId}/mark-paid"
    description: "Mark recovery paid"
    roles: [SupplierManager]
    code: 200
    input: [paid_amount_cents]
    output: SupplierRecovery
    side_effects: ["recovery_status → PAID", "paid_amount_cents set", "WarrantyClaim.recovery_status → RECOVERY_PAID", "WarrantyClaim.recovery_amount_cents += paid"]

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/claims/{claimId}/recoveries/{recoveryId}/deny"
    description: "Deny a recovery"
    roles: [SupplierManager]
    code: 200
    input: []
    output: SupplierRecovery
    side_effects: ["recovery_status → DENIED", "WarrantyClaim.recovery_status → RECOVERY_DENIED"]

  # ---- Dealer / ServiceBay ----
  - method: POST
    path: "/dealers"
    description: "Onboard a dealer"
    roles: [FleetManager]
    code: 201
    input: [dealer_name, region, hourly_labor_rate_cents]
    output: Dealer
    side_effects: ["dealer_status = ACTIVE"]

  - method: GET
    path: "/dealers"
    description: "List dealers"
    roles: [FleetManager, UptimeCoordinator, DealerAdvisor, PartsManager]
    code: 200
    input: ["limit?", "offset?", "region?", "dealer_status?"]
    output: "Dealer[]"
    side_effects: []

  - method: GET
    path: "/dealers/{dealerId}"
    description: "Get one dealer"
    roles: [FleetManager, UptimeCoordinator, DealerAdvisor, PartsManager, WarrantyAdmin]
    code: 200
    input: []
    output: Dealer
    side_effects: []

  - method: POST
    path: "/dealers/{dealerId}/bays"
    description: "Create a service bay at a dealer"
    roles: [DealerAdvisor]
    code: 201
    input: [bay_code]
    output: ServiceBay
    side_effects: ["bay_status = AVAILABLE", "Dealer.bay_count++"]

  - method: GET
    path: "/dealers/{dealerId}/bays"
    description: "List bays at a dealer"
    roles: [DealerAdvisor, UptimeCoordinator, PartsManager]
    code: 200
    input: ["limit?", "offset?", "bay_status?"]
    output: "ServiceBay[]"
    side_effects: []

  - method: POST
    path: "/dealers/{dealerId}/bays/{bayId}/mark-down"
    description: "Mark a bay down"
    roles: [DealerAdvisor]
    code: 200
    input: []
    output: ServiceBay
    side_effects: ["bay_status → DOWN"]

  - method: POST
    path: "/dealers/{dealerId}/bays/{bayId}/mark-available"
    description: "Bring a down bay back"
    roles: [DealerAdvisor]
    code: 200
    input: []
    output: ServiceBay
    side_effects: ["bay_status → AVAILABLE"]

  # ---- CoverageContract ----
  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/coverage-contracts"
    description: "Purchase an extended coverage contract"
    roles: [FleetManager]
    code: 201
    input: [contract_type, starts_on, ends_on, max_miles, premium_cents]
    output: CoverageContract
    side_effects: ["contract_status = ACTIVE"]

  - method: GET
    path: "/fleets/{fleetId}/trucks/{truckId}/coverage-contracts"
    description: "List coverage contracts for a truck"
    roles: [FleetManager, WarrantyAdmin]
    code: 200
    input: ["limit?", "offset?", "contract_status?"]
    output: "CoverageContract[]"
    side_effects: []

  - method: POST
    path: "/fleets/{fleetId}/trucks/{truckId}/coverage-contracts/{contractId}/cancel"
    description: "Cancel an ACTIVE coverage contract early"
    roles: [FleetManager]
    code: 200
    input: []
    output: CoverageContract
    side_effects: ["contract_status → CANCELLED", "coverage_proration runs", "prorated_credit_cents computed"]

  # ---- Campaign ----
  - method: POST
    path: "/campaigns"
    description: "Open a campaign"
    roles: [UptimeCoordinator]
    code: 201
    input: [campaign_code, campaign_kind, affected_model_codes, fault_code, opens_on, closes_on]
    output: Campaign
    side_effects:
      - "campaign_status = OPEN"
      - "for each Truck whose model_code in affected_model_codes AND in_service_on <= closes_on: create CampaignCompletion row in OPEN"

  - method: GET
    path: "/campaigns"
    description: "List campaigns"
    roles: [UptimeCoordinator, FleetManager, WarrantyAdmin]
    code: 200
    input: ["limit?", "offset?", "campaign_status?", "campaign_kind?"]
    output: "Campaign[]"
    side_effects: []

  - method: GET
    path: "/campaigns/{campaignId}"
    description: "Get one campaign"
    roles: [UptimeCoordinator, FleetManager, WarrantyAdmin, SupplierManager]
    code: 200
    input: []
    output: Campaign
    side_effects: []

  - method: POST
    path: "/campaigns/{campaignId}/close"
    description: "Close a campaign (OCC against Campaign)"
    roles: [UptimeCoordinator]
    code: 200
    input: [expected_campaign_version]
    output: Campaign
    side_effects: ["campaign_status → CLOSED if completion_pct >= 95.00 OR clock > closes_on + 90d"]

  # ---- CampaignCompletion ----
  - method: GET
    path: "/campaigns/{campaignId}/completions"
    description: "List completion rows for a campaign"
    roles: [UptimeCoordinator, FleetManager, WarrantyAdmin]
    code: 200
    input: ["limit?", "offset?", "completion_status?", "truck_id?"]
    output: "CampaignCompletion[]"
    side_effects: []

  - method: POST
    path: "/campaigns/{campaignId}/completions/{completionId}/schedule"
    description: "Link a completion row to a case (must match truck and fault_code)"
    roles: [UptimeCoordinator]
    code: 200
    input: [case_id]
    output: CampaignCompletion
    side_effects: ["completion_status → SCHEDULED", "case_id stored"]

  - method: POST
    path: "/campaigns/{campaignId}/completions/{completionId}/exempt"
    description: "Exempt a completion row"
    roles: [UptimeCoordinator]
    code: 200
    input: [exemption_reason]
    output: CampaignCompletion
    side_effects: ["completion_status → EXEMPTED", "Campaign.completion_pct recomputed"]

  # ---- ReliabilityReport ----
  - method: GET
    path: "/fleets/{fleetId}/reliability-reports"
    description: "List reliability snapshots for a fleet"
    roles: [FleetManager, UptimeCoordinator, WarrantyAdmin]
    code: 200
    input: ["limit?", "offset?", "from_ops_run_index?", "to_ops_run_index?"]
    output: "ReliabilityReport[]"
    side_effects: []

  # ===========================================================================
  # Cross-aggregate filtered-list GETs (FK reverse-reachability)
  # Each exposes the entity by FK query parameter so callers can find children
  # from a parent id without traversing the URL hierarchy. Used by reporting
  # dashboards and required by §1.5's FK reverse-reachability rule.
  # Each entity also gets a single-resource top-level GET to anchor its
  # collection segment.
  # ===========================================================================

  - method: GET
    path: "/trucks/{truckId}"
    description: "Get one truck by id (cross-fleet)"
    roles: [FleetManager, UptimeCoordinator, WarrantyAdmin, DealerAdvisor, PartsManager, SupplierManager]
    code: 200
    input: []
    output: Truck
    side_effects: []

  - method: GET
    path: "/trucks"
    description: "List trucks across fleets (operator dashboard); FK filter on fleet_id"
    roles: [FleetManager, UptimeCoordinator, WarrantyAdmin, DealerAdvisor, PartsManager, SupplierManager]
    code: 200
    input: ["limit?", "offset?", "fleet_id?", "truck_status?", "model_code?"]
    output: "Truck[]"
    side_effects: []

  - method: GET
    path: "/cases/{caseId}"
    description: "Get one case by id"
    roles: [FleetManager, UptimeCoordinator, WarrantyAdmin, DealerAdvisor, PartsManager, SupplierManager]
    code: 200
    input: []
    output: Case
    side_effects: []

  - method: GET
    path: "/cases"
    description: "List cases across fleets/trucks; FK filters on fleet_id, truck_id, dealer_id, opened_from_fault_event_id"
    roles: [FleetManager, UptimeCoordinator, WarrantyAdmin, DealerAdvisor, PartsManager, SupplierManager]
    code: 200
    input: ["limit?", "offset?", "fleet_id?", "truck_id?", "dealer_id?", "opened_from_fault_event_id?", "case_status?"]
    output: "Case[]"
    side_effects: []

  - method: GET
    path: "/work-orders/{workOrderId}"
    description: "Get one work order by id"
    roles: [FleetManager, UptimeCoordinator, WarrantyAdmin, DealerAdvisor]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: GET
    path: "/work-orders"
    description: "List work orders across cases; FK filters on case_id, dealer_id, bay_id"
    roles: [FleetManager, UptimeCoordinator, WarrantyAdmin, DealerAdvisor]
    code: 200
    input: ["limit?", "offset?", "case_id?", "dealer_id?", "bay_id?", "work_order_status?"]
    output: "WorkOrder[]"
    side_effects: []

  - method: GET
    path: "/part-orders/{partOrderId}"
    description: "Get one part order by id"
    roles: [FleetManager, UptimeCoordinator, WarrantyAdmin, DealerAdvisor, PartsManager]
    code: 200
    input: []
    output: PartOrder
    side_effects: []

  - method: GET
    path: "/part-orders"
    description: "List part orders across cases; FK filter on case_id"
    roles: [FleetManager, UptimeCoordinator, WarrantyAdmin, DealerAdvisor, PartsManager]
    code: 200
    input: ["limit?", "offset?", "case_id?", "part_order_status?", "expedite_decision?"]
    output: "PartOrder[]"
    side_effects: []

  - method: GET
    path: "/claims/{claimId}"
    description: "Get one warranty claim by id"
    roles: [FleetManager, UptimeCoordinator, WarrantyAdmin, SupplierManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: GET
    path: "/claims"
    description: "List warranty claims across cases; FK filter on case_id"
    roles: [FleetManager, UptimeCoordinator, WarrantyAdmin, SupplierManager]
    code: 200
    input: ["limit?", "offset?", "case_id?", "submission_status?", "recovery_status?", "claim_type?"]
    output: "WarrantyClaim[]"
    side_effects: []

  - method: GET
    path: "/part-returns/{partReturnId}"
    description: "Get one part return by id"
    roles: [WarrantyAdmin, SupplierManager, DealerAdvisor]
    code: 200
    input: []
    output: PartReturn
    side_effects: []

  - method: GET
    path: "/part-returns"
    description: "List part returns across claims; FK filter on claim_id"
    roles: [WarrantyAdmin, SupplierManager, DealerAdvisor]
    code: 200
    input: ["limit?", "offset?", "claim_id?", "part_return_status?"]
    output: "PartReturn[]"
    side_effects: []

  - method: GET
    path: "/recoveries/{recoveryId}"
    description: "Get one supplier recovery by id"
    roles: [SupplierManager, WarrantyAdmin]
    code: 200
    input: []
    output: SupplierRecovery
    side_effects: []

  - method: GET
    path: "/recoveries"
    description: "List supplier recoveries across claims; FK filters on claim_id, part_return_id"
    roles: [SupplierManager, WarrantyAdmin]
    code: 200
    input: ["limit?", "offset?", "claim_id?", "part_return_id?", "recovery_status?"]
    output: "SupplierRecovery[]"
    side_effects: []

  - method: GET
    path: "/coverage-contracts/{contractId}"
    description: "Get one coverage contract by id"
    roles: [FleetManager, WarrantyAdmin, UptimeCoordinator]
    code: 200
    input: []
    output: CoverageContract
    side_effects: []

  - method: GET
    path: "/coverage-contracts"
    description: "List coverage contracts across trucks; FK filter on truck_id"
    roles: [FleetManager, WarrantyAdmin, UptimeCoordinator]
    code: 200
    input: ["limit?", "offset?", "truck_id?", "contract_status?", "contract_type?"]
    output: "CoverageContract[]"
    side_effects: []

  - method: GET
    path: "/fault-events/{faultEventId}"
    description: "Get one fault event by id"
    roles: [UptimeCoordinator, FleetManager, DealerAdvisor, WarrantyAdmin]
    code: 200
    input: []
    output: FaultEvent
    side_effects: []

  - method: GET
    path: "/fault-events"
    description: "List fault events across trucks; FK filter on truck_id"
    roles: [UptimeCoordinator, FleetManager, DealerAdvisor, WarrantyAdmin]
    code: 200
    input: ["limit?", "offset?", "truck_id?", "event_status?", "severity?"]
    output: "FaultEvent[]"
    side_effects: []

  - method: GET
    path: "/campaign-completions/{completionId}"
    description: "Get one campaign completion row by id"
    roles: [UptimeCoordinator, FleetManager, WarrantyAdmin]
    code: 200
    input: []
    output: CampaignCompletion
    side_effects: []

  - method: GET
    path: "/campaign-completions"
    description: "List campaign completion rows; FK filters on campaign_id, truck_id, case_id"
    roles: [UptimeCoordinator, FleetManager, WarrantyAdmin]
    code: 200
    input: ["limit?", "offset?", "campaign_id?", "truck_id?", "case_id?", "completion_status?"]
    output: "CampaignCompletion[]"
    side_effects: []

  - method: GET
    path: "/bays/{bayId}"
    description: "Get one service bay by id"
    roles: [FleetManager, UptimeCoordinator, DealerAdvisor, PartsManager]
    code: 200
    input: []
    output: ServiceBay
    side_effects: []

  - method: GET
    path: "/bays"
    description: "List service bays across dealers; FK filter on dealer_id"
    roles: [FleetManager, UptimeCoordinator, DealerAdvisor, PartsManager]
    code: 200
    input: ["limit?", "offset?", "dealer_id?", "bay_status?"]
    output: "ServiceBay[]"
    side_effects: []

  - method: GET
    path: "/reliability-reports/{reportId}"
    description: "Get one reliability report by id"
    roles: [FleetManager, UptimeCoordinator, WarrantyAdmin]
    code: 200
    input: []
