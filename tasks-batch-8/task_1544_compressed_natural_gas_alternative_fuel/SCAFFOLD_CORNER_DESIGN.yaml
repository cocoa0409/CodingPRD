        claim_type: role_denied
        grounds: [roles.StationManager, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Claim decision is NetworkOperator-exclusive; a StationManager caller gets ERR_FORBIDDEN_ROLE (403) — the role check fires before existence, so even an unknown claim id yields 403."
        test_recipe: { setup: ["Empty DB"], setup_api_calls: [], trigger: [ { call: "POST /cng/tax-credit-claims/00000000-0000-4000-8000-0000000000f1/decision", payload: { outcome: "APPROVED" }, as: StationManager, captures: { err: $.data.error_id } } ], assert: ["err == ERR_FORBIDDEN_ROLE with HTTP 403"] }
      - name: compliance_officer_cannot_create_station_returns_403_forbidden
        claim_type: role_denied
        grounds: [roles.ComplianceOfficer, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Station creation is NetworkOperator-exclusive; ComplianceOfficer gets ERR_FORBIDDEN_ROLE."
        test_recipe: { setup: ["Empty DB"], setup_api_calls: [], trigger: [ { call: "POST /cng/stations", payload: { station_name: "X", station_code: "ST-X", access_mode: "DUAL", backup_capacity_gge: 1000 }, as: ComplianceOfficer, captures: { err: $.data.error_id } } ], assert: ["err == ERR_FORBIDDEN_ROLE with HTTP 403"] }
