# =============================================================================
# PRD Benchmark Scaffold — Paired Donation Chain Matching & Donor Travel
# Logistics (National Kidney Registry). Maximal-difficulty expert+ scaffold.
# =============================================================================

scenario: |
  Paired Donation Chain Matching & Donor Travel Logistics (National Kidney
  Registry): donor and recipient pair registration with tissue typing,
  antibody profiles and medical eligibility, chain construction algorithms
  that match incompatible pairs across a national pool with altruistic donor
  chain starts, virtual crossmatch review and transplant center acceptance of
  a proposed match, surgery scheduling coordination across multiple centers
  with simultaneous or sequential operating room slots, organ shipment
  logistics with cold ischemia time limits and flight contingency, chain break
  handling when a donor becomes unavailable after a recipient is transplanted,
  donor protection programs covering complications, lost wages and priority if
  the donor later needs a kidney, center participation standards and outcome
  reporting.

domain_name: paired-donation-chain
api_prefix: /nkr

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: graph_constraint
  complexity_layers:
    - cascading_side_effects
    - optimistic_concurrency
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  state_machine_shape: compound

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (15 entities)
# =============================================================================
entities:
  - name: TransplantCenter
    parent: null
    common_fields: true
    fields:
      - { name: center_code, type: string, source: input, description: "Unique national center code (e.g., CA-SF-001)" }
      - { name: name, type: string, source: input, description: "Center legal name" }
      - { name: region_code, type: string, source: input, description: "Three-letter UNOS-style region code" }
      - { name: tier, type: enum, source: input, description: "STANDARD | PREFERRED | NATIONAL_HUB — governs max concurrent chains and case-volume quota" }
      - { name: max_concurrent_chains, type: integer, source: input, description: "Upper bound on chains in SCHEDULED state at this center at any point in time" }
      - { name: participation_status, type: enum, source: system, description: "ACTIVE | PROBATION | SUSPENDED — gates whether center may accept matches or schedule surgery" }
      - { name: failed_outcome_count, type: integer, source: computed, description: "Count of FAILED TransplantOutcome records attributed to this center" }
      - { name: shipped_organ_count, type: integer, source: computed, description: "Count of OrganShipment records whose origin_center_id == this center" }
      - { name: probed_cold_ischemia_violations, type: integer, source: computed, description: "Count of OrganShipment deliveries at this center that violated cold_ischemia_max_hours" }
      - { name: reputation_score_bps, type: integer, source: computed, description: "0–10000 basis-point score derived from failed_outcome_count, probed_cold_ischemia_violations, shipped_organ_count" }
      - { name: active_chain_count, type: integer, source: computed, description: "Count of distinct chains with at least one MatchOffer at this center in SCHEDULED state" }

  - name: Donor
    parent: null
    common_fields: true
    fields:
      - { name: external_ref, type: string, source: input, description: "Center-issued donor reference, unique per center" }
      - { name: home_center_id, type: string, source: input, description: "FK -> TransplantCenter.id; center where donor will have nephrectomy" }
      - { name: abo_type, type: enum, source: input, description: "A | B | AB | O" }
      - { name: hla_a, type: string, source: input, description: "Comma-separated two HLA-A alleles (e.g., 'A02,A24')" }
      - { name: hla_b, type: string, source: input, description: "Comma-separated two HLA-B alleles" }
      - { name: hla_drb1, type: string, source: input, description: "Comma-separated two HLA-DRB1 alleles" }
      - { name: kdri_score, type: integer, source: input, description: "Kidney Donor Risk Index 20–250; lower is better" }
      - { name: age_at_registration, type: integer, source: input, description: "Donor age in years at registration; must be >= 18" }
      - { name: donor_kind, type: enum, source: input, description: "PAIRED (enters with a recipient) | ALTRUISTIC (non-directed chain starter) | BRIDGE (donor holding bridge credit)" }
      - { name: medical_status, type: enum, source: system, description: "CLEARED | ON_HOLD | WITHDRAWN | DECEASED" }
      - { name: surgery_state, type: enum, source: system, description: "PRE_SURGERY | SURGERY_SCHEDULED | NEPHRECTOMY_DONE | FAILED_PREOP" }
      - { name: chain_participation_state, type: enum, source: system, description: "POOL | PROPOSED | LOCKED | COMMITTED | COMPLETED | BROKEN | WITHDRAWN" }
      - { name: protection_policy_id, type: string, source: system, description: "FK -> DonorProtectionPolicy.id; policy auto-minted on NEPHRECTOMY_DONE transition; null until then" }
      - { name: priority_waitlist_status, type: enum, source: system, description: "NONE | ELIGIBLE | ENROLLED — enrolment triggered when donor later registers as a recipient" }
      - { name: traveled_distance_miles, type: number, source: computed, description: "Sum of confirmed TravelItinerary.segment_miles for this donor" }
      - { name: complications_recorded, type: integer, source: computed, description: "Count of DonorProtectionClaim records with claim_kind = COMPLICATION for this donor" }

  - name: Recipient
    parent: null
    common_fields: true
    fields:
      - { name: external_ref, type: string, source: input, description: "Center-issued recipient reference" }
      - { name: home_center_id, type: string, source: input, description: "FK -> TransplantCenter.id; transplant center" }
      - { name: abo_type, type: enum, source: input, description: "A | B | AB | O" }
      - { name: cpra_percent, type: integer, source: input, description: "Calculated panel-reactive antibody 0–100; high sensitization narrows donor pool" }
      - { name: unacceptable_antigens, type: array, source: input, description: "List of HLA antigens the recipient's antibodies will attack (e.g., ['A24','B44'])" }
      - { name: medical_status, type: enum, source: system, description: "LISTED | ON_HOLD | TRANSPLANTED | WITHDRAWN | DECEASED" }
      - { name: chain_participation_state, type: enum, source: system, description: "POOL | PROPOSED | LOCKED | COMMITTED | TRANSPLANTED | ORPHANED | WITHDRAWN" }
      - { name: paired_donor_id, type: string, source: input, description: "FK -> Donor.id; the donor the recipient entered the pool with (null for non-paired entry)" }
      - { name: listed_at_utc, type: datetime, source: system, description: "Server-stamped at creation; tiebreak in chain-construction ranking" }
      - { name: waiting_time_days, type: integer, source: computed, description: "Days from listed_at_utc to current logical clock; recomputed on read" }
      - { name: transplant_completed_at_utc, type: datetime, source: system, description: "Server-stamped on TRANSPLANTED transition" }
      - { name: priority_boost_active, type: boolean, source: system, description: "True if this recipient is a prior donor who enrolled priority_waitlist_status" }

  - name: DonorRecipientPair
    parent: null
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: input, description: "FK -> Donor.id" }
      - { name: recipient_id, type: string, source: input, description: "FK -> Recipient.id" }
      - { name: pair_state, type: enum, source: system, description: "REGISTERED | VERIFIED | IN_POOL | IN_PROPOSED_CHAIN | LOCKED | RELEASED | DISSOLVED" }
      - { name: registered_center_id, type: string, source: input, description: "FK -> TransplantCenter.id; center that vetted the pair" }
      - { name: entered_pool_at_utc, type: datetime, source: system, description: "Server-stamped on VERIFIED -> IN_POOL transition" }
      - { name: dissolution_reason, type: enum, source: system, description: "NONE | RECIPIENT_TRANSPLANTED | DONOR_WITHDRAWN | MEDICAL_DECLINE | CHAIN_BROKEN" }

  - name: ChainRun
    parent: null
    common_fields: true
    fields:
      - { name: run_label, type: string, source: input, description: "Operator-supplied label (e.g., 'weekly-batch-2026-W36')" }
      - { name: started_at_utc, type: datetime, source: system, description: "Server-stamped at creation" }
      - { name: run_state, type: enum, source: system, description: "DRAFT | EXECUTED | PUBLISHED | SUPERSEDED" }
      - { name: algorithm_version, type: string, source: system, description: "Server-stamped from constant CHAIN_ALGORITHM_VERSION at execution time" }
      - { name: candidate_pool_size, type: integer, source: computed, description: "Number of DonorRecipientPair rows in IN_POOL at execution" }
      - { name: proposed_chain_count, type: integer, source: computed, description: "Count of Chain entities this run produced with chain_state = PROPOSED" }

  - name: Chain
    parent: null
    common_fields: true
    fields:
      - { name: chain_run_id, type: string, source: input, description: "FK -> ChainRun.id; the run that proposed this chain" }
      - { name: starter_donor_id, type: string, source: input, description: "FK -> Donor.id; first donor in chain (ALTRUISTIC or BRIDGE)" }
      - { name: chain_state, type: enum, source: system, description: "PROPOSED | ACCEPTING | LOCKED | SCHEDULED | EXECUTING | COMPLETED | BROKEN | ABORTED" }
      - { name: length_target, type: integer, source: input, description: "Declared pair-target at proposal time (count of recipient transplants)" }
      - { name: length_actual, type: integer, source: computed, description: "Count of MatchOffer rows in this chain with state = TRANSPLANT_COMPLETED" }
      - { name: starts_at_center_id, type: string, source: input, description: "FK -> TransplantCenter.id; center where first nephrectomy happens" }
      - { name: completion_grade, type: enum, source: system, description: "PENDING | FULL | PARTIAL | BROKEN_PARTIAL — set when chain reaches terminal" }
      - { name: scheduled_date, type: datetime, source: system, description: "Locked surgery date when chain_state enters SCHEDULED" }
      - { name: broken_at_index, type: integer, source: system, description: "MatchOffer.position_index where break occurred (1-based); null unless chain_state = BROKEN" }

  - name: MatchOffer
    parent: Chain
    common_fields: true
    fields:
      - { name: chain_id, type: string, source: system, description: "FK -> Chain.id; parent chain" }
      - { name: position_index, type: integer, source: system, description: "1-based index of this offer along the chain" }
      - { name: donor_id, type: string, source: system, description: "FK -> Donor.id" }
      - { name: recipient_id, type: string, source: system, description: "FK -> Recipient.id" }
      - { name: donor_center_id, type: string, source: system, description: "FK -> TransplantCenter.id" }
      - { name: recipient_center_id, type: string, source: system, description: "FK -> TransplantCenter.id" }
      - { name: offer_state, type: enum, source: system, description: "PENDING_CROSSMATCH | CROSSMATCH_PASSED | CROSSMATCH_FAILED | CENTER_ACCEPTED | CENTER_DECLINED | SCHEDULED | DONOR_SURGERY_DONE | ORGAN_SHIPPED | TRANSPLANT_COMPLETED | OFFER_FAILED" }
      - { name: match_score_bps, type: integer, source: computed, description: "0–10000 composite match score (see match_score calculation)" }
      - { name: abo_compatible, type: boolean, source: computed, description: "ABO-compatibility flag computed at proposal time (see abo_compatibility)" }
      - { name: hla_mismatch_count, type: integer, source: computed, description: "Count of HLA loci with zero shared alleles" }
      - { name: unacceptable_antigen_hit, type: boolean, source: computed, description: "True iff donor expresses any antigen in recipient.unacceptable_antigens" }
      - { name: proposed_at_utc, type: datetime, source: system, description: "Server-stamped at proposal" }
      - { name: accepted_at_utc, type: datetime, source: system, description: "Server-stamped on recipient center acceptance" }
      - { name: crossmatch_deadline_utc, type: datetime, source: computed, description: "proposed_at_utc + CROSSMATCH_REVIEW_HOURS; hard cutoff for crossmatch review" }
      - { name: center_accept_deadline_utc, type: datetime, source: computed, description: "proposed_at_utc + CENTER_ACCEPT_HOURS; hard cutoff for center acceptance" }
      - { name: donor_travel_required, type: boolean, source: computed, description: "True iff donor_center_id != recipient_center_id" }
      - { name: offer_failure_reason, type: enum, source: system, description: "NONE | CROSSMATCH_POSITIVE | CENTER_DECLINE | COLD_ISCHEMIA | DONOR_UNAVAILABLE | CHAIN_BREAK_PROPAGATION" }

  - name: CrossmatchReview
    parent: MatchOffer
    common_fields: true
    fields:
      - { name: match_offer_id, type: string, source: system, description: "FK -> MatchOffer.id" }
      - { name: reviewer_center_id, type: string, source: input, description: "FK -> TransplantCenter.id; must equal offer.recipient_center_id" }
      - { name: virtual_result, type: enum, source: input, description: "NEGATIVE | WEAK_POSITIVE | STRONG_POSITIVE | INDETERMINATE" }
      - { name: flow_cytometry_channel_shift, type: integer, source: input, description: "Raw flow shift channel reading 0–1024" }
      - { name: dsa_mfi_max, type: integer, source: input, description: "Max donor-specific antibody MFI 0–30000" }
      - { name: decision, type: enum, source: system, description: "PENDING | PASS | FAIL — derived from virtual_result + dsa_mfi_max + center policy" }
      - { name: decided_at_utc, type: datetime, source: system, description: "Server-stamped on decision" }
      - { name: review_notes, type: string, source: input, description: "Free-text review notes" }

  - name: SurgeryScheduleSlot
    parent: TransplantCenter
    common_fields: true
    fields:
      - { name: center_id, type: string, source: system, description: "FK -> TransplantCenter.id" }
      - { name: slot_start_utc, type: datetime, source: input, description: "Slot start timestamp" }
      - { name: slot_end_utc, type: datetime, source: input, description: "Slot end timestamp; must satisfy slot_start_utc < slot_end_utc and (slot_end_utc - slot_start_utc) >= SLOT_MIN_HOURS" }
      - { name: room_kind, type: enum, source: input, description: "NEPHRECTOMY_OR | TRANSPLANT_OR | BACK_OR — recovery/backup room" }
      - { name: slot_state, type: enum, source: system, description: "OPEN | RESERVED | CONSUMED | RELEASED | EXPIRED" }
      - { name: reserved_for_chain_id, type: string, source: system, description: "FK -> Chain.id; set when RESERVED" }
      - { name: reserved_for_offer_id, type: string, source: system, description: "FK -> MatchOffer.id; set when RESERVED" }
      - { name: simultaneous_group_id, type: string, source: system, description: "Shared UUID for slots reserved as one simultaneous burst" }
      - { name: consumed_at_utc, type: datetime, source: system, description: "Server-stamped when slot_state -> CONSUMED" }

  - name: OrganShipment
    parent: MatchOffer
    common_fields: true
    fields:
      - { name: match_offer_id, type: string, source: system, description: "FK -> MatchOffer.id" }
      - { name: origin_center_id, type: string, source: system, description: "FK -> TransplantCenter.id" }
      - { name: destination_center_id, type: string, source: system, description: "FK -> TransplantCenter.id" }
      - { name: shipment_mode, type: enum, source: input, description: "COMMERCIAL_FLIGHT | CHARTER | GROUND_COURIER" }
      - { name: scheduled_departure_utc, type: datetime, source: input, description: "Planned departure" }
      - { name: scheduled_arrival_utc, type: datetime, source: input, description: "Planned arrival" }
      - { name: actual_departure_utc, type: datetime, source: system, description: "Server-stamped on DEPARTED transition" }
      - { name: actual_arrival_utc, type: datetime, source: system, description: "Server-stamped on DELIVERED transition" }
      - { name: cold_ischemia_hours_actual, type: number, source: computed, description: "(actual_arrival_utc - nephrectomy completion timestamp of source donor) in hours, 2dp round_half_up" }
      - { name: cold_ischemia_max_hours, type: integer, source: input, description: "Hard limit; default COLD_ISCHEMIA_MAX_HOURS constant 24; may be tightened per chain" }
      - { name: cold_ischemia_violation, type: boolean, source: computed, description: "True iff cold_ischemia_hours_actual > cold_ischemia_max_hours" }
      - { name: shipment_state, type: enum, source: system, description: "PLANNED | DEPARTED | DELAYED | REROUTED | DELIVERED | CANCELLED" }
      - { name: contingency_reason, type: enum, source: input, description: "NONE | WEATHER | MECHANICAL | ATC | COURIER_BREAKDOWN — set when transitioning to DELAYED or REROUTED" }
      - { name: routing_sequence, type: integer, source: computed, description: "Increments on every REROUTED transition; starts at 0" }

  - name: TravelItinerary
    parent: Donor
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: system, description: "FK -> Donor.id" }
      - { name: origin_airport_code, type: string, source: input, description: "Three-letter IATA code" }
      - { name: destination_airport_code, type: string, source: input, description: "Three-letter IATA code" }
      - { name: depart_utc, type: datetime, source: input, description: "Planned departure" }
      - { name: arrive_utc, type: datetime, source: input, description: "Planned arrival; must satisfy arrive_utc > depart_utc" }
      - { name: segment_miles, type: integer, source: input, description: "Great-circle segment miles; used for protection-program reimbursement cap" }
      - { name: lodging_nights, type: integer, source: input, description: "0–7; lodging reimbursable up to segment-specific cap" }
      - { name: itinerary_state, type: enum, source: system, description: "DRAFT | CONFIRMED | CANCELLED | REIMBURSED" }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "Capped reimbursement estimate from travel_reimbursement calculation" }
      - { name: cancelled_reason, type: enum, source: system, description: "NONE | CHAIN_BROKEN | DONOR_UNAVAILABLE | SCHEDULE_MOVED" }

  - name: DonorProtectionPolicy
    parent: Donor
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: system, description: "FK -> Donor.id" }
      - { name: policy_state, type: enum, source: system, description: "ACTIVE | LAPSED | EXHAUSTED" }
      - { name: covered_complication_max_cents, type: integer, source: system, description: "Cap for complication claims; from constant COMPLICATION_COVER_CENTS" }
      - { name: covered_lost_wages_max_cents, type: integer, source: system, description: "Cap for lost-wage claims; from constant LOST_WAGES_COVER_CENTS" }
      - { name: complications_paid_cents, type: integer, source: computed, description: "Sum of DonorProtectionClaim approved amounts where claim_kind = COMPLICATION" }
      - { name: lost_wages_paid_cents, type: integer, source: computed, description: "Sum of DonorProtectionClaim approved amounts where claim_kind = LOST_WAGES" }
      - { name: travel_reimbursed_cents, type: integer, source: computed, description: "Sum of DonorProtectionClaim approved amounts where claim_kind = TRAVEL" }
      - { name: priority_kidney_claim_available, type: boolean, source: system, description: "True while policy is ACTIVE and donor has not yet claimed a priority kidney slot" }

  - name: DonorProtectionClaim
    parent: DonorProtectionPolicy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> DonorProtectionPolicy.id" }
      - { name: claim_kind, type: enum, source: input, description: "COMPLICATION | LOST_WAGES | TRAVEL | PRIORITY_KIDNEY" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Amount requested; must be > 0 (not used for PRIORITY_KIDNEY)" }
      - { name: approved_amount_cents, type: integer, source: system, description: "Amount approved; system-capped by remaining headroom in the corresponding bucket" }
      - { name: claim_state, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | PARTIALLY_APPROVED | DENIED | PAID" }
      - { name: adjudicator_user_id, type: string, source: system, description: "Opaque RegistryAdmin user id who last transitioned this claim" }
      - { name: submitted_at_utc, type: datetime, source: system, description: "Server-stamped at submission" }
      - { name: resolved_at_utc, type: datetime, source: system, description: "Server-stamped when claim reaches APPROVED / PARTIALLY_APPROVED / DENIED" }
      - { name: denial_reason, type: string, source: system, description: "Free-text reason when claim_state = DENIED" }

  - name: TransplantOutcome
    parent: MatchOffer
    common_fields: true
    fields:
      - { name: match_offer_id, type: string, source: system, description: "FK -> MatchOffer.id" }
      - { name: outcome_kind, type: enum, source: input, description: "SUCCESS | DELAYED_GRAFT_FUNCTION | PRIMARY_NON_FUNCTION | REJECTED_30D | FAILED" }
      - { name: reported_at_utc, type: datetime, source: system, description: "Server-stamped" }
      - { name: followup_days, type: integer, source: input, description: "30 | 90 | 180 | 365" }
      - { name: outcome_state, type: enum, source: system, description: "REPORTED | ATTRIBUTED_TO_CENTER | APPEALED | FINAL" }
      - { name: attributed_center_id, type: string, source: system, description: "FK -> TransplantCenter.id — recipient center by default; appeal may reattribute to donor center or null" }

  - name: ChainBreakEvent
    parent: Chain
    common_fields: true
    fields:
      - { name: chain_id, type: string, source: system, description: "FK -> Chain.id" }
      - { name: broken_at_offer_id, type: string, source: system, description: "FK -> MatchOffer.id — the offer whose donor became unavailable" }
      - { name: trigger_kind, type: enum, source: input, description: "DONOR_MEDICAL_DECLINE | DONOR_WITHDRAWAL | DONOR_DECEASED | SURGERY_ABORTED | ORGAN_LOST_IN_TRANSIT" }
      - { name: recipients_already_transplanted, type: integer, source: computed, description: "Count of MatchOffers in this chain with TRANSPLANT_COMPLETED before this event" }
      - { name: downstream_recipients_orphaned, type: integer, source: computed, description: "Count of downstream MatchOffers whose recipient lost their pair's donor" }
      - { name: bridge_donor_id, type: string, source: system, description: "FK -> Donor.id — bridge credit issued for the donor whose recipient was transplanted before break" }
      - { name: event_state, type: enum, source: system, description: "RECORDED | CASCADED | RECONSTRUCTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TransplantCenter
    field: participation_status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: PROBATION
        trigger: POST /nkr/centers/{center_id}/probate
        actor: RegistryAdmin
        preconditions:
          - "center.participation_status == ACTIVE (ERR_CENTER_INVALID_STATE)"
          - "at least one of: probed_cold_ischemia_violations >= PROBATION_CIT_VIOLATIONS OR failed_outcome_count >= PROBATION_FAILURES"
        side_effects:
          - "Center remains able to schedule surgeries but cannot accept new MatchOffers"
          - "Every MatchOffer in PENDING_CROSSMATCH or CROSSMATCH_PASSED at this center is flagged stale_review=true (logical flag; not a stored field)"
      - from: PROBATION
        to: ACTIVE
        trigger: POST /nkr/centers/{center_id}/reinstate
        actor: RegistryAdmin
        preconditions:
          - "center.participation_status == PROBATION (ERR_CENTER_INVALID_STATE)"
          - "probed_cold_ischemia_violations < PROBATION_CIT_VIOLATIONS AND failed_outcome_count < PROBATION_FAILURES"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /nkr/centers/{center_id}/suspend
        actor: RegistryAdmin
        preconditions:
          - "center.participation_status == ACTIVE (ERR_CENTER_INVALID_STATE)"
        side_effects:
          - "All SurgeryScheduleSlot at this center in RESERVED -> RELEASED"
          - "All MatchOffers at this center in CENTER_ACCEPTED -> CROSSMATCH_PASSED (rollback of acceptance)"
          - "All MatchOffers at this center in PENDING_CROSSMATCH or CROSSMATCH_PASSED -> OFFER_FAILED with reason CHAIN_BREAK_PROPAGATION"
      - from: PROBATION
        to: SUSPENDED
        trigger: POST /nkr/centers/{center_id}/suspend
        actor: RegistryAdmin
        preconditions:
          - "center.participation_status == PROBATION (ERR_CENTER_INVALID_STATE)"
        side_effects: ["same as ACTIVE -> SUSPENDED"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /nkr/centers/{center_id}/reinstate
        actor: RegistryAdmin
        preconditions:
          - "center.participation_status == SUSPENDED (ERR_CENTER_INVALID_STATE)"
          - "no Chain with chain_state in {LOCKED, SCHEDULED, EXECUTING} references this center"
        side_effects: []

  - entity: Donor
    field: medical_status
    initial_state: CLEARED
    terminal_states: [DECEASED, WITHDRAWN]
    transitions:
      - from: CLEARED
        to: ON_HOLD
        trigger: POST /nkr/donors/{donor_id}/medical-hold
        actor: CenterCoordinator
        preconditions:
          - "donor.medical_status == CLEARED (ERR_INVALID_STATE)"
          - "donor.surgery_state != NEPHRECTOMY_DONE (ERR_DONOR_POST_NEPHRECTOMY)"
        side_effects:
          - "If donor is referenced by any MatchOffer in PENDING_CROSSMATCH / CROSSMATCH_PASSED / CENTER_ACCEPTED, that offer -> OFFER_FAILED with reason DONOR_UNAVAILABLE"
      - from: ON_HOLD
        to: CLEARED
        trigger: POST /nkr/donors/{donor_id}/medical-release
        actor: CenterCoordinator
        preconditions:
          - "donor.medical_status == ON_HOLD (ERR_INVALID_STATE)"
        side_effects: []
      - from: CLEARED
        to: WITHDRAWN
        trigger: POST /nkr/donors/{donor_id}/withdraw
        actor: CenterCoordinator
        preconditions:
          - "donor.medical_status == CLEARED or ON_HOLD (ERR_INVALID_STATE)"
          - "donor.surgery_state != NEPHRECTOMY_DONE (ERR_DONOR_POST_NEPHRECTOMY)"
        side_effects:
          - "If donor is in a Chain with chain_state in {LOCKED, SCHEDULED, EXECUTING}, emit ChainBreakEvent and cascade"
      - from: ON_HOLD
        to: WITHDRAWN
        trigger: POST /nkr/donors/{donor_id}/withdraw
        actor: CenterCoordinator
        preconditions: ["same as CLEARED -> WITHDRAWN"]
        side_effects: ["same as CLEARED -> WITHDRAWN"]
      - from: CLEARED
        to: DECEASED
        trigger: POST /nkr/donors/{donor_id}/deceased
        actor: CenterCoordinator
        preconditions:
          - "donor.medical_status != DECEASED (ERR_INVALID_STATE)"
        side_effects: ["same cascade as withdrawal"]

  - entity: Donor
    field: surgery_state
    initial_state: PRE_SURGERY
    terminal_states: [NEPHRECTOMY_DONE, FAILED_PREOP]
    transitions:
      - from: PRE_SURGERY
        to: SURGERY_SCHEDULED
        trigger: "system (when parent Chain enters SCHEDULED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SURGERY_SCHEDULED
        to: NEPHRECTOMY_DONE
        trigger: POST /nkr/donors/{donor_id}/complete-nephrectomy
        actor: CenterCoordinator
        preconditions:
          - "donor.surgery_state == SURGERY_SCHEDULED (ERR_INVALID_STATE)"
          - "donor.medical_status == CLEARED (ERR_DONOR_NOT_CLEARED)"
          - "acting CenterCoordinator's center_id == donor.home_center_id (ERR_CENTER_MISMATCH)"
        side_effects:
          - "Mint DonorProtectionPolicy for this donor with ACTIVE state and standard caps"
          - "If this donor's MatchOffer has destination != origin, transition corresponding OrganShipment PLANNED -> DEPARTED eligibility (does not itself depart; departure is explicit)"
          - "Set donor.chain_participation_state = COMPLETED"
          - "If donor.donor_kind == PAIRED and paired recipient is still POOL, recipient.chain_participation_state remains (no change)"
      - from: PRE_SURGERY
        to: FAILED_PREOP
        trigger: POST /nkr/donors/{donor_id}/fail-preop
        actor: CenterCoordinator
        preconditions:
          - "donor.surgery_state in {PRE_SURGERY, SURGERY_SCHEDULED} (ERR_INVALID_STATE)"
        side_effects:
          - "Emit ChainBreakEvent with trigger_kind SURGERY_ABORTED; cascade chain break"
      - from: SURGERY_SCHEDULED
        to: FAILED_PREOP
        trigger: POST /nkr/donors/{donor_id}/fail-preop
        actor: CenterCoordinator
        preconditions: ["same"]
        side_effects: ["same"]

  - entity: Donor
    field: chain_participation_state
    initial_state: POOL
    terminal_states: [COMPLETED, BROKEN, WITHDRAWN]
    transitions:
      - from: POOL
        to: PROPOSED
        trigger: "system (chain run proposes this donor)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: LOCKED
        trigger: "system (chain enters LOCKED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOCKED
        to: COMMITTED
        trigger: "system (chain enters SCHEDULED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMMITTED
        to: COMPLETED
        trigger: "system (donor.surgery_state -> NEPHRECTOMY_DONE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: POOL
        trigger: "system (chain run superseded before LOCKED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: POOL
        to: WITHDRAWN
        trigger: "system (donor medical withdrawal)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMMITTED
        to: BROKEN
        trigger: "system (chain break event attributes to this donor)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Recipient
    field: medical_status
    initial_state: LISTED
    terminal_states: [TRANSPLANTED, DECEASED, WITHDRAWN]
    transitions:
      - from: LISTED
        to: ON_HOLD
        trigger: POST /nkr/recipients/{recipient_id}/medical-hold
        actor: CenterCoordinator
        preconditions:
          - "recipient.medical_status == LISTED (ERR_INVALID_STATE)"
        side_effects:
          - "If recipient in any MatchOffer PENDING_CROSSMATCH / CROSSMATCH_PASSED / CENTER_ACCEPTED, that offer -> OFFER_FAILED with reason DONOR_UNAVAILABLE (recipient-side)"
      - from: ON_HOLD
        to: LISTED
        trigger: POST /nkr/recipients/{recipient_id}/medical-release
        actor: CenterCoordinator
        preconditions:
          - "recipient.medical_status == ON_HOLD (ERR_INVALID_STATE)"
        side_effects: []
      - from: LISTED
        to: TRANSPLANTED
        trigger: POST /nkr/recipients/{recipient_id}/complete-transplant
        actor: CenterCoordinator
        preconditions:
          - "recipient.medical_status == LISTED (ERR_INVALID_STATE)"
          - "recipient.chain_participation_state == COMMITTED (ERR_RECIPIENT_NOT_COMMITTED)"
          - "There exists a MatchOffer for this recipient with offer_state == ORGAN_SHIPPED (ERR_ORGAN_NOT_ARRIVED)"
          - "The corresponding OrganShipment.shipment_state == DELIVERED (ERR_ORGAN_NOT_ARRIVED)"
          - "cold_ischemia_violation == false on that OrganShipment (ERR_COLD_ISCHEMIA_VIOLATION)"
        side_effects:
          - "MatchOffer -> TRANSPLANT_COMPLETED"
          - "recipient.chain_participation_state = TRANSPLANTED"
          - "transplant_completed_at_utc stamped"
          - "Chain.length_actual incremented"
          - "Chain completion_grade recomputed"
          - "DonorRecipientPair for the recipient's pair: pair_state -> RELEASED with dissolution_reason = RECIPIENT_TRANSPLANTED"
      - from: LISTED
        to: WITHDRAWN
        trigger: POST /nkr/recipients/{recipient_id}/withdraw
        actor: CenterCoordinator
        preconditions:
          - "recipient.medical_status in {LISTED, ON_HOLD} (ERR_INVALID_STATE)"
        side_effects:
          - "DonorRecipientPair -> DISSOLVED with dissolution_reason = MEDICAL_DECLINE"
      - from: LISTED
        to: DECEASED
        trigger: POST /nkr/recipients/{recipient_id}/deceased
        actor: CenterCoordinator
        preconditions:
          - "recipient.medical_status != DECEASED"
        side_effects:
          - "DonorRecipientPair -> DISSOLVED with dissolution_reason = MEDICAL_DECLINE"

  - entity: Recipient
    field: chain_participation_state
    initial_state: POOL
    terminal_states: [TRANSPLANTED, ORPHANED, WITHDRAWN]
    transitions:
      - from: POOL
        to: PROPOSED
        trigger: "system (chain run proposes this recipient)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: LOCKED
        trigger: "system (chain enters LOCKED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOCKED
        to: COMMITTED
        trigger: "system (chain enters SCHEDULED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMMITTED
        to: TRANSPLANTED
        trigger: "system (recipient.medical_status -> TRANSPLANTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMMITTED
        to: ORPHANED
        trigger: "system (upstream chain break leaves recipient without donor)"
        actor: system
        preconditions: []
        side_effects:
          - "Recipient re-enters pool with priority_boost_active = true if any prior donor-nephrectomy was completed on their behalf (their paired donor already donated)"
      - from: PROPOSED
        to: POOL
        trigger: "system (chain run superseded)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DonorRecipientPair
    field: pair_state
    initial_state: REGISTERED
    terminal_states: [RELEASED, DISSOLVED]
    transitions:
      - from: REGISTERED
        to: VERIFIED
        trigger: POST /nkr/pairs/{pair_id}/verify
        actor: CenterCoordinator
        preconditions:
          - "pair.pair_state == REGISTERED (ERR_INVALID_STATE)"
          - "donor.medical_status == CLEARED (ERR_DONOR_NOT_CLEARED)"
          - "recipient.medical_status == LISTED (ERR_RECIPIENT_NOT_LISTED)"
        side_effects: []
      - from: VERIFIED
        to: IN_POOL
        trigger: POST /nkr/pairs/{pair_id}/enter-pool
        actor: CenterCoordinator
        preconditions:
          - "pair.pair_state == VERIFIED (ERR_INVALID_STATE)"
          - "Donor and Recipient ABO are cross-incompatible, OR pair was registered with donor_kind=PAIRED and explicit opt-in flag bypasses incompatibility check (compatibilism bypass: pair.donor_kind == PAIRED and request body flag compatible_pair_opt_in == true)"
        side_effects:
          - "entered_pool_at_utc stamped"
          - "donor.chain_participation_state = POOL"
          - "recipient.chain_participation_state = POOL"
      - from: IN_POOL
        to: IN_PROPOSED_CHAIN
        trigger: "system (chain run selects this pair)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROPOSED_CHAIN
        to: LOCKED
        trigger: "system (chain enters LOCKED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOCKED
        to: RELEASED
        trigger: "system (recipient TRANSPLANTED)"
        actor: system
        preconditions: []
        side_effects:
          - "dissolution_reason = RECIPIENT_TRANSPLANTED"
      - from: LOCKED
        to: DISSOLVED
        trigger: "system (chain break event)"
        actor: system
        preconditions: []
        side_effects:
          - "dissolution_reason = CHAIN_BROKEN"
      - from: IN_POOL
        to: DISSOLVED
        trigger: POST /nkr/pairs/{pair_id}/dissolve
        actor: CenterCoordinator
        preconditions:
          - "pair.pair_state in {IN_POOL} (ERR_INVALID_STATE)"
        side_effects:
          - "dissolution_reason from request body"
      - from: VERIFIED
        to: DISSOLVED
        trigger: POST /nkr/pairs/{pair_id}/dissolve
        actor: CenterCoordinator
        preconditions:
          - "pair.pair_state in {VERIFIED, IN_POOL} (ERR_INVALID_STATE)"
        side_effects: []

  - entity: ChainRun
    field: run_state
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: POST /nkr/chain-runs/{run_id}/execute
        actor: MatchOperator
        preconditions:
          - "run.run_state == DRAFT (ERR_INVALID_STATE)"
          - "candidate_pool_size >= MIN_POOL_SIZE (ERR_POOL_TOO_SMALL)"
        side_effects:
          - "Run chain_construction algorithm; mint Chain rows in PROPOSED state with embedded MatchOffer rows in PENDING_CROSSMATCH"
          - "Set run.candidate_pool_size and run.proposed_chain_count"
      - from: EXECUTED
        to: PUBLISHED
        trigger: POST /nkr/chain-runs/{run_id}/publish
        actor: MatchOperator
        preconditions:
          - "run.run_state == EXECUTED (ERR_INVALID_STATE)"
        side_effects:
          - "All Chain rows in PROPOSED from this run remain; recipients' and donors' chain_participation_state set to PROPOSED"
      - from: EXECUTED
        to: SUPERSEDED
        trigger: POST /nkr/chain-runs/{run_id}/supersede
        actor: MatchOperator
        preconditions:
          - "run.run_state in {EXECUTED, PUBLISHED} (ERR_INVALID_STATE)"
          - "No Chain from this run is in chain_state LOCKED or later (ERR_CHAIN_LOCKED)"
        side_effects:
          - "All Chain rows in PROPOSED -> ABORTED"
          - "All MatchOffers on those chains -> OFFER_FAILED with reason CHAIN_BREAK_PROPAGATION"
          - "Donor and Recipient chain_participation_state reverts from PROPOSED to POOL"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: POST /nkr/chain-runs/{run_id}/supersede
        actor: MatchOperator
        preconditions: ["same"]
        side_effects: ["same"]

  - entity: Chain
    field: chain_state
    initial_state: PROPOSED
    terminal_states: [COMPLETED, BROKEN, ABORTED]
    transitions:
      - from: PROPOSED
        to: ACCEPTING
        trigger: "system (parent run published)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTING
        to: LOCKED
        trigger: POST /nkr/chains/{chain_id}/lock
        actor: MatchOperator
        preconditions:
          - "chain.chain_state == ACCEPTING (ERR_INVALID_STATE)"
          - "every MatchOffer in this chain has offer_state == CENTER_ACCEPTED (ERR_PENDING_OFFERS)"
        side_effects:
          - "Donor.chain_participation_state and Recipient.chain_participation_state -> LOCKED"
      - from: LOCKED
        to: SCHEDULED
        trigger: POST /nkr/chains/{chain_id}/schedule
        actor: MatchOperator
        preconditions:
          - "chain.chain_state == LOCKED (ERR_INVALID_STATE)"
          - "every MatchOffer has at least one SurgeryScheduleSlot RESERVED at both donor_center and recipient_center"
          - "expected_chain_version request field matches chain.version (ERR_STALE_VERSION)"
        side_effects:
          - "scheduled_date stamped"
          - "slots RESERVED -> CONSUMED eligibility marked"
          - "Donor.surgery_state -> SURGERY_SCHEDULED for all chain donors"
          - "Donor.chain_participation_state and Recipient.chain_participation_state -> COMMITTED"
          - "Increments chain.version by 1"
      - from: SCHEDULED
        to: EXECUTING
        trigger: POST /nkr/chains/{chain_id}/start-execution
        actor: MatchOperator
        preconditions:
          - "chain.chain_state == SCHEDULED (ERR_INVALID_STATE)"
          - "first MatchOffer's donor CenterCoordinator has initiated nephrectomy (surgery_state == SURGERY_SCHEDULED on donor 1)"
        side_effects: []
      - from: EXECUTING
        to: COMPLETED
        trigger: "system (all MatchOffers reach TRANSPLANT_COMPLETED)"
        actor: system
        preconditions:
          - "length_actual == length_target"
        side_effects:
          - "completion_grade = FULL"
      - from: EXECUTING
        to: BROKEN
        trigger: "system (ChainBreakEvent created on a chain in EXECUTING)"
        actor: system
        preconditions: []
        side_effects:
          - "completion_grade = BROKEN_PARTIAL"
      - from: SCHEDULED
        to: BROKEN
        trigger: "system (ChainBreakEvent created on a chain in SCHEDULED)"
        actor: system
        preconditions: []
        side_effects:
          - "completion_grade = BROKEN_PARTIAL"
      - from: PROPOSED
        to: ABORTED
        trigger: "system (parent run superseded)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MatchOffer
    field: offer_state
    initial_state: PENDING_CROSSMATCH
    terminal_states: [TRANSPLANT_COMPLETED, OFFER_FAILED]
    transitions:
      - from: PENDING_CROSSMATCH
        to: CROSSMATCH_PASSED
        trigger: POST /nkr/match-offers/{offer_id}/crossmatch-review (decision == PASS)
        actor: CenterCoordinator
        preconditions:
          - "offer.offer_state == PENDING_CROSSMATCH (ERR_INVALID_STATE)"
          - "reviewer CenterCoordinator's center_id == offer.recipient_center_id (ERR_CENTER_MISMATCH)"
          - "recipient center.participation_status == ACTIVE (ERR_CENTER_SUSPENDED)"
          - "logical clock < offer.crossmatch_deadline_utc (ERR_REVIEW_DEADLINE_PASSED)"
        side_effects:
          - "CrossmatchReview.decision = PASS; decided_at_utc stamped"
      - from: PENDING_CROSSMATCH
        to: CROSSMATCH_FAILED
        trigger: POST /nkr/match-offers/{offer_id}/crossmatch-review (decision == FAIL)
        actor: CenterCoordinator
        preconditions: ["same as PASS"]
        side_effects:
          - "Offer cannot proceed; chain run re-evaluates chain — chain goes to ABORTED if no replacement found"
      - from: CROSSMATCH_PASSED
        to: CENTER_ACCEPTED
        trigger: POST /nkr/match-offers/{offer_id}/center-accept
        actor: CenterCoordinator
        preconditions:
          - "offer.offer_state == CROSSMATCH_PASSED (ERR_INVALID_STATE)"
          - "acting CenterCoordinator's center_id == offer.recipient_center_id (ERR_CENTER_MISMATCH)"
          - "recipient center.participation_status == ACTIVE (ERR_CENTER_SUSPENDED)"
          - "logical clock < offer.center_accept_deadline_utc (ERR_REVIEW_DEADLINE_PASSED)"
          - "donor_center.participation_status == ACTIVE (ERR_CENTER_SUSPENDED)"
        side_effects:
          - "accepted_at_utc stamped"
      - from: CROSSMATCH_PASSED
        to: CENTER_DECLINED
        trigger: POST /nkr/match-offers/{offer_id}/center-decline
        actor: CenterCoordinator
        preconditions:
          - "offer.offer_state == CROSSMATCH_PASSED (ERR_INVALID_STATE)"
          - "acting CenterCoordinator's center_id == offer.recipient_center_id"
        side_effects:
          - "Offer -> OFFER_FAILED with reason CENTER_DECLINE; chain may be reconstructed"
      - from: CENTER_ACCEPTED
        to: SCHEDULED
        trigger: "system (chain transitions LOCKED -> SCHEDULED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: DONOR_SURGERY_DONE
        trigger: "system (donor.surgery_state -> NEPHRECTOMY_DONE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DONOR_SURGERY_DONE
        to: ORGAN_SHIPPED
        trigger: "system (OrganShipment reaches DELIVERED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ORGAN_SHIPPED
        to: TRANSPLANT_COMPLETED
        trigger: "system (recipient.medical_status -> TRANSPLANTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING_CROSSMATCH
        to: OFFER_FAILED
        trigger: "system (chain break, donor withdrawal, recipient withdrawal, deadline passed, run superseded)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CROSSMATCH_PASSED
        to: OFFER_FAILED
        trigger: "system"
        actor: system
        preconditions: []
        side_effects: []
      - from: CENTER_ACCEPTED
        to: OFFER_FAILED
        trigger: "system"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: OFFER_FAILED
        trigger: "system (chain break)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CENTER_DECLINED
        to: OFFER_FAILED
        trigger: "system (decline finalizes)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SurgeryScheduleSlot
    field: slot_state
    initial_state: OPEN
    terminal_states: [CONSUMED, EXPIRED, RELEASED]
    transitions:
      - from: OPEN
        to: RESERVED
        trigger: POST /nkr/chains/{chain_id}/schedule (reserves all required slots atomically)
        actor: MatchOperator
        preconditions:
          - "slot.slot_state == OPEN (ERR_SLOT_TAKEN)"
          - "no other slot at same center_id with overlapping interval and slot_state in {RESERVED, CONSUMED} (ERR_SLOT_OVERLAP)"
          - "slot_start_utc >= logical clock + MIN_SCHEDULE_LEAD_HOURS (ERR_SLOT_TOO_SOON)"
        side_effects:
          - "reserved_for_chain_id and reserved_for_offer_id set"
          - "simultaneous_group_id assigned (shared across all slots reserved for this chain)"
      - from: RESERVED
        to: CONSUMED
        trigger: "system (donor nephrectomy completes and center coordinator marks surgery done) or (transplant completes for TRANSPLANT_OR slots)"
        actor: system
        preconditions: []
        side_effects:
          - "consumed_at_utc stamped"
      - from: RESERVED
        to: RELEASED
        trigger: POST /nkr/slots/{slot_id}/release
        actor: MatchOperator
        preconditions:
          - "slot.slot_state == RESERVED (ERR_INVALID_STATE)"
          - "reserved_for_chain.chain_state not in {EXECUTING, COMPLETED} (ERR_CHAIN_LOCKED)"
        side_effects:
          - "reserved_for_chain_id, reserved_for_offer_id, simultaneous_group_id cleared"
      - from: OPEN
        to: EXPIRED
        trigger: "system (logical clock passes slot_end_utc while OPEN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESERVED
        to: EXPIRED
        trigger: "system (logical clock passes slot_end_utc while RESERVED and chain has not started)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: OrganShipment
    field: shipment_state
    initial_state: PLANNED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PLANNED
        to: DEPARTED
        trigger: POST /nkr/shipments/{shipment_id}/depart
        actor: LogisticsCoordinator
        preconditions:
          - "shipment.shipment_state == PLANNED (ERR_INVALID_STATE)"
          - "source MatchOffer.offer_state == DONOR_SURGERY_DONE (ERR_ORGAN_NOT_READY)"
          - "origin_center.participation_status == ACTIVE (ERR_CENTER_SUSPENDED)"
        side_effects:
          - "actual_departure_utc stamped"
      - from: DEPARTED
        to: DELAYED
        trigger: POST /nkr/shipments/{shipment_id}/delay
        actor: LogisticsCoordinator
        preconditions:
          - "shipment.shipment_state == DEPARTED (ERR_INVALID_STATE)"
          - "contingency_reason in {WEATHER, MECHANICAL, ATC, COURIER_BREAKDOWN} (ERR_INVALID_REQUEST)"
        side_effects: []
      - from: DELAYED
        to: REROUTED
        trigger: POST /nkr/shipments/{shipment_id}/reroute
        actor: LogisticsCoordinator
        preconditions:
          - "shipment.shipment_state == DELAYED (ERR_INVALID_STATE)"
        side_effects:
          - "routing_sequence += 1"
          - "scheduled_arrival_utc replaced by new plan"
      - from: DEPARTED
        to: REROUTED
        trigger: POST /nkr/shipments/{shipment_id}/reroute
        actor: LogisticsCoordinator
        preconditions:
          - "shipment.shipment_state in {DEPARTED, DELAYED} (ERR_INVALID_STATE)"
        side_effects:
          - "routing_sequence += 1"
      - from: DEPARTED
        to: DELIVERED
        trigger: POST /nkr/shipments/{shipment_id}/deliver
        actor: LogisticsCoordinator
        preconditions:
          - "shipment.shipment_state in {DEPARTED, REROUTED} (ERR_INVALID_STATE)"
        side_effects:
          - "actual_arrival_utc stamped"
          - "cold_ischemia_hours_actual computed"
          - "if cold_ischemia_violation: destination center.probed_cold_ischemia_violations += 1 AND MatchOffer -> OFFER_FAILED with reason COLD_ISCHEMIA AND chain break cascade"
          - "else: MatchOffer -> ORGAN_SHIPPED"
      - from: REROUTED
        to: DELIVERED
        trigger: POST /nkr/shipments/{shipment_id}/deliver
        actor: LogisticsCoordinator
        preconditions: ["same"]
        side_effects: ["same"]
      - from: DELAYED
        to: DELIVERED
        trigger: POST /nkr/shipments/{shipment_id}/deliver
        actor: LogisticsCoordinator
        preconditions: ["same"]
        side_effects: ["same"]
      - from: PLANNED
        to: CANCELLED
        trigger: POST /nkr/shipments/{shipment_id}/cancel
        actor: LogisticsCoordinator
        preconditions:
          - "shipment.shipment_state in {PLANNED, DEPARTED, DELAYED, REROUTED} (ERR_INVALID_STATE)"
        side_effects:
          - "If organ already departed, cancellation triggers chain break with trigger_kind ORGAN_LOST_IN_TRANSIT"

  - entity: TravelItinerary
    field: itinerary_state
    initial_state: DRAFT
    terminal_states: [REIMBURSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: POST /nkr/itineraries/{itinerary_id}/confirm
        actor: LogisticsCoordinator
        preconditions:
          - "itinerary.itinerary_state == DRAFT (ERR_INVALID_STATE)"
          - "estimated_cost_cents computed"
        side_effects:
          - "donor.traveled_distance_miles recomputed (sums only CONFIRMED segments)"
      - from: CONFIRMED
        to: CANCELLED
        trigger: POST /nkr/itineraries/{itinerary_id}/cancel
        actor: LogisticsCoordinator
        preconditions:
          - "itinerary.itinerary_state == CONFIRMED (ERR_INVALID_STATE)"
          - "logical clock < depart_utc (ERR_FLIGHT_ALREADY_DEPARTED)"
        side_effects:
          - "cancelled_reason set"
          - "donor.traveled_distance_miles recomputed"
      - from: CONFIRMED
        to: REIMBURSED
        trigger: POST /nkr/itineraries/{itinerary_id}/reimburse
        actor: RegistryAdmin
        preconditions:
          - "itinerary.itinerary_state == CONFIRMED (ERR_INVALID_STATE)"
          - "logical clock >= arrive_utc (ERR_FLIGHT_NOT_ARRIVED)"
          - "donor.protection_policy_id != null (ERR_NO_PROTECTION_POLICY)"
        side_effects:
          - "A DonorProtectionClaim is auto-minted with claim_kind=TRAVEL, requested_amount_cents=estimated_cost_cents, claim_state=APPROVED"
          - "policy.travel_reimbursed_cents += estimated_cost_cents"

  - entity: DonorProtectionClaim
    field: claim_state
    initial_state: SUBMITTED
    terminal_states: [PAID, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: POST /nkr/claims/{claim_id}/start-review
        actor: RegistryAdmin
        preconditions:
          - "claim.claim_state == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "adjudicator_user_id set to acting user"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: POST /nkr/claims/{claim_id}/approve
        actor: RegistryAdmin
        preconditions:
          - "claim.claim_state == UNDER_REVIEW (ERR_INVALID_STATE)"
          - "claim.claim_kind != PRIORITY_KIDNEY -> approved_amount_cents <= bucket headroom (ERR_CLAIM_EXCEEDS_CAP)"
          - "Segregation of duties: adjudicator_user_id != claim.submitted_at_utc-recorded submitter (recorded on submitter_user_id field via header at submit time) (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "approved_amount_cents = requested_amount_cents"
          - "policy bucket updated"
      - from: UNDER_REVIEW
        to: PARTIALLY_APPROVED
        trigger: POST /nkr/claims/{claim_id}/partial-approve
        actor: RegistryAdmin
        preconditions:
          - "claim.claim_state == UNDER_REVIEW (ERR_INVALID_STATE)"
          - "approved_amount_cents in request body; 0 < approved_amount_cents < requested_amount_cents (ERR_INVALID_REQUEST)"
        side_effects:
          - "policy bucket updated by approved_amount_cents"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: POST /nkr/claims/{claim_id}/deny
        actor: RegistryAdmin
        preconditions:
          - "claim.claim_state == UNDER_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "denial_reason set"
      - from: APPROVED
        to: PAID
        trigger: POST /nkr/claims/{claim_id}/pay
        actor: RegistryAdmin
        preconditions:
          - "claim.claim_state == APPROVED (ERR_INVALID_STATE)"
        side_effects:
          - "policy bucket updated (already done at approve); no double count"
      - from: PARTIALLY_APPROVED
        to: PAID
        trigger: POST /nkr/claims/{claim_id}/pay
        actor: RegistryAdmin
        preconditions:
          - "claim.claim_state == PARTIALLY_APPROVED (ERR_INVALID_STATE)"
        side_effects: []

  - entity: TransplantOutcome
    field: outcome_state
    initial_state: REPORTED
    terminal_states: [FINAL]
    transitions:
      - from: REPORTED
        to: ATTRIBUTED_TO_CENTER
        trigger: POST /nkr/outcomes/{outcome_id}/attribute
        actor: RegistryAdmin
        preconditions:
          - "outcome.outcome_state == REPORTED (ERR_INVALID_STATE)"
        side_effects:
          - "attributed_center_id set (default = recipient center of offer)"
          - "if outcome_kind == FAILED: center.failed_outcome_count += 1"
          - "center.reputation_score_bps recomputed"
      - from: ATTRIBUTED_TO_CENTER
        to: APPEALED
        trigger: POST /nkr/outcomes/{outcome_id}/appeal
        actor: CenterCoordinator
        preconditions:
          - "outcome.outcome_state == ATTRIBUTED_TO_CENTER (ERR_INVALID_STATE)"
          - "acting CenterCoordinator's center_id == attributed_center_id (ERR_CENTER_MISMATCH)"
        side_effects: []
      - from: APPEALED
        to: FINAL
        trigger: POST /nkr/outcomes/{outcome_id}/resolve-appeal
        actor: RegistryAdmin
        preconditions:
          - "outcome.outcome_state == APPEALED (ERR_INVALID_STATE)"
        side_effects:
          - "attributed_center_id may be re-set (to donor center) per request body new_attributed_center_id"
          - "if outcome_kind == FAILED and attribution changed: decrement old center.failed_outcome_count, increment new center.failed_outcome_count, recompute both reputation_score_bps"
      - from: ATTRIBUTED_TO_CENTER
        to: FINAL
        trigger: POST /nkr/outcomes/{outcome_id}/finalize
        actor: RegistryAdmin
        preconditions:
          - "outcome.outcome_state == ATTRIBUTED_TO_CENTER (ERR_INVALID_STATE)"
        side_effects: []

  - entity: ChainBreakEvent
    field: event_state
    initial_state: RECORDED
    terminal_states: [RECONSTRUCTED]
    transitions:
      - from: RECORDED
        to: CASCADED
        trigger: "system (immediately after event row creation)"
        actor: system
        preconditions: []
        side_effects:
          - "broken_at_offer -> OFFER_FAILED with reason DONOR_UNAVAILABLE (or ORGAN_LOST_IN_TRANSIT per trigger_kind)"
          - "every MatchOffer in this chain with position_index > broken_at_index and offer_state not terminal -> OFFER_FAILED with reason CHAIN_BREAK_PROPAGATION"
          - "every downstream Recipient whose paired donor already completed nephrectomy -> chain_participation_state = ORPHANED, priority_boost_active = true"
          - "chain -> BROKEN; completion_grade = BROKEN_PARTIAL"
          - "if any downstream recipient was already TRANSPLANTED before this event: mint a bridge Donor (donor_kind=BRIDGE) tied to the broken donor's pair (bridge_donor_id set on this event)"
      - from: CASCADED
        to: RECONSTRUCTED
        trigger: POST /nkr/chain-breaks/{event_id}/reconstruct
        actor: MatchOperator
        preconditions:
          - "event.event_state == CASCADED (ERR_INVALID_STATE)"
          - "a new ChainRun has been EXECUTED with the orphaned recipients in the candidate pool (ERR_RECONSTRUCTION_NOT_VIABLE)"
        side_effects:
          - "Orphaned recipients may enter newly constructed chains"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only — serial-observable)
# =============================================================================
concurrency_rules:
  - rule_id: chain-schedule-stale-version
    parent_entity: Chain
    write_endpoint: "POST /nkr/chains/{chain_id}/schedule"
    occ_field: "expected_chain_version"
    description: |
      Scheduling a chain against a Chain whose version has advanced since the
      client last observed it is rejected. Captures the case where another
      MatchOperator has just locked, re-proposed, or cascaded an update onto
      the chain, and the current writer's view of the chain is therefore
      stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: chain-lock-stale-version
    parent_entity: Chain
    write_endpoint: "POST /nkr/chains/{chain_id}/lock"
    occ_field: "expected_chain_version"
    description: |
      Locking a chain whose version has advanced since the client last
      observed it is rejected. This guards against an operator locking a
      chain after another writer has already accepted or declined one of
      its offers in a way that changed the chain's recorded version.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: center-suspend-stale-version
    parent_entity: TransplantCenter
    write_endpoint: "POST /nkr/centers/{center_id}/suspend"
    occ_field: "expected_center_version"
    description: |
      Suspending a TransplantCenter whose version has advanced since the
      client last observed it is rejected. Captures the case where another
      RegistryAdmin has just probated, reinstated, or recomputed the
      center's reputation, and the current writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: chain-run-execute-stale-version
    parent_entity: ChainRun
    write_endpoint: "POST /nkr/chain-runs/{run_id}/execute"
    occ_field: "expected_run_version"
    description: |
      Executing a ChainRun whose version has advanced since the client last
      observed it is rejected. Captures the case where another operator has
      already executed or superseded the run.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: abo_compatibility
    trigger: "MatchOffer creation by chain_construction"
    algorithm: constraint_propagation
    formula: |
      # ABO recipient <- donor direction (donor must be compatible GIVING to recipient)
      # O donor can give to A/B/AB/O. A donor can give to A/AB. B donor to B/AB. AB donor only to AB.
      abo_compatible = (
        (donor.abo_type == 'O') or
        (donor.abo_type == 'A' and recipient.abo_type in {'A','AB'}) or
        (donor.abo_type == 'B' and recipient.abo_type in {'B','AB'}) or
        (donor.abo_type == 'AB' and recipient.abo_type == 'AB')
      )
    input_set: "Single Donor + single Recipient pair"
    constants:
      ABO_DONOR_MAP: "O->{A,B,AB,O}; A->{A,AB}; B->{B,AB}; AB->{AB}"
    precision: "boolean"

  - name: hla_mismatch_count
    trigger: "MatchOffer creation"
    algorithm: aggregation
    formula: |
      # Three loci: A, B, DRB1. For each locus, compute allele overlap.
      # mismatch_count_locus = 0 if any shared allele at that locus, else 1.
      # total = sum over 3 loci (0..3).
      hla_mismatch_count = (
        (0 if (set(donor.hla_a.split(',')) & set(recipient.hla_a.split(','))) else 1) +
        (0 if (set(donor.hla_b.split(',')) & set(recipient.hla_b.split(','))) else 1) +
        (0 if (set(donor.hla_drb1.split(',')) & set(recipient.hla_drb1.split(','))) else 1)
      )
      # Note: recipient carries hla_a, hla_b, hla_drb1 as profile fields (added implicitly via unacceptable_antigens + profile fields; if absent, treat as all-mismatch -> 3).
    input_set: "Single Donor + single Recipient"
    precision: "integer 0..3"

  - name: unacceptable_antigen_hit
    trigger: "MatchOffer creation"
    algorithm: aggregation
    formula: |
      donor_antigens = set(donor.hla_a.split(',')) | set(donor.hla_b.split(',')) | set(donor.hla_drb1.split(','))
      unacceptable_antigen_hit = len(donor_antigens & set(recipient.unacceptable_antigens)) > 0
    input_set: "Single Donor + Recipient pair"

  - name: match_score
    trigger: "MatchOffer creation by chain_construction"
    algorithm: weighted_scoring
    formula: |
      # Weighted score in basis points (0..10000).
      # Evaluation order is fixed by the implementation; the expression below is left-to-right.
      # 1. Base score from KDRI:
      kdri_component_bps = max(0, min(10000, 10000 - (donor.kdri_score - KDRI_MIN) * 10000 / (KDRI_MAX - KDRI_MIN)))
      # 2. ABO penalty:
      abo_penalty_bps = 0 if abo_compatible else 10000  # incompatible -> instant fail (cannot proceed)
      # 3. Unacceptable-antigen veto:
      unacceptable_veto = unacceptable_antigen_hit  # boolean
      # 4. HLA mismatch penalty (cumulative, 0..3):
      hla_penalty_bps = hla_mismatch_count * HLA_PENALTY_PER_LOCUS_BPS  # 0..3 * 500
      # 5. Waiting time bonus (capped):
      wait_bonus_bps = min(WAIT_BONUS_CAP_BPS, recipient.waiting_time_days * WAIT_BONUS_PER_DAY_BPS)
      # 6. Priority boost:
      priority_bonus_bps = PRIORITY_BOOST_BPS if recipient.priority_boost_active else 0
      # 7. cPRA penalty (high sensitization is hard to match -> boost, not penalize, because matching one is valuable):
      cpra_bonus_bps = (recipient.cpra_percent * CPRA_BONUS_PER_PCT_BPS)  # 0..100 * 20 = 0..2000
      # Final score:
      if not abo_compatible: match_score_bps = 0
      elif unacceptable_veto: match_score_bps = 0
      else:
        raw = kdri_component_bps - hla_penalty_bps + wait_bonus_bps + priority_bonus_bps + cpra_bonus_bps
        match_score_bps = max(0, min(10000, raw))
    input_set: "Single Donor + Recipient at proposal time"
    constants:
      KDRI_MIN: 20
      KDRI_MAX: 250
      HLA_PENALTY_PER_LOCUS_BPS: 500
      WAIT_BONUS_PER_DAY_BPS: 5
      WAIT_BONUS_CAP_BPS: 1500
      PRIORITY_BOOST_BPS: 2000
      CPRA_BONUS_PER_PCT_BPS: 20
    precision: "integer bps, floor at 0, cap at 10000"

  - name: chain_construction
    trigger: "POST /nkr/chain-runs/{run_id}/execute"
    algorithm: topological
    formula: |
      # Build chains from candidate pool.
      # Candidate pool = DonorRecipientPair in IN_POOL, plus ALTRUISTIC Donor rows with medical_status==CLEARED and chain_participation_state==POOL.
      # Step 1: Compute match_score for every (donor, recipient) Cartesian pair where donor and recipient are from different pairs.
      # Step 2: Filter: keep only edges with match_score_bps > 0 AND unacceptable_antigen_hit == false AND abo_compatible == true.
      # Step 3: Sort candidate starting donors: ALTRUISTIC donors first by created_at ASC, then BRIDGE donors by created_at ASC.
      # Step 4: For each starting donor, greedily extend: pick highest-scoring unused recipient; recurse from that recipient's paired donor; stop when (a) no outgoing edge, (b) chain length reaches MAX_CHAIN_LENGTH, or (c) the donor has no paired recipient (i.e., altruistic donor who must terminate by donating to a recipient whose pair's donor will start a new chain — deferred, NOT unrolled within this run).
      # Tie-break for selecting among equal-scoring recipients: recipient.listed_at_utc ASC (earliest listing wins); if still tied, recipient.created_at ASC. UUID ids are NEVER used.
      # Output: a set of Chain entities, each with chain_state=PROPOSED, starter_donor_id, length_target = number of recipients included, MatchOffer rows in PENDING_CROSSMATCH.
    input_set: "All DonorRecipientPair in IN_POOL + all ALTRUISTIC/BRIDGE Donor in POOL + their paired Recipients"
    constants:
      MAX_CHAIN_LENGTH: 6
      MIN_POOL_SIZE: 2
    precision: "discrete"

  - name: crossmatch_decision
    trigger: "POST /nkr/match-offers/{offer_id}/crossmatch-review"
    algorithm: threshold
    formula: |
      # Decision matrix on virtual_result + dsa_mfi_max:
      # virtual_result == NEGATIVE and dsa_mfi_max < DSA_PASS_THRESHOLD -> PASS
      # virtual_result == NEGATIVE and dsa_mfi_max >= DSA_PASS_THRESHOLD -> FAIL (silent DSA)
      # virtual_result == WEAK_POSITIVE and dsa_mfi_max < DSA_WEAK_THRESHOLD -> PASS (weak)
      # virtual_result == WEAK_POSITIVE and dsa_mfi_max >= DSA_WEAK_THRESHOLD -> FAIL
      # virtual_result == STRONG_POSITIVE -> FAIL (regardless of MFI)
      # virtual_result == INDETERMINATE -> FAIL (conservative)
    input_set: "CrossmatchReview input fields"
    constants:
      DSA_PASS_THRESHOLD: 1000
      DSA_WEAK_THRESHOLD: 3000
    precision: "enum PASS|FAIL"

  - name: cold_ischemia_actual
    trigger: "OrganShipment DELIVERED transition"
    algorithm: aggregation
    formula: |
      # Cold ischemia hours = (actual_arrival_utc - donor nephrectomy completion timestamp) in hours.
      # Donor nephrectomy completion = Donor updated_at at the moment surgery_state transitioned to NEPHRECTOMY_DONE.
      # Round to 2 decimal places, round_half_up.
      cold_ischemia_hours_actual = round_half_up((actual_arrival_utc - nephrectomy_completed_at_utc).total_seconds() / 3600, 2)
      cold_ischemia_violation = cold_ischemia_hours_actual > cold_ischemia_max_hours
    input_set: "Single OrganShipment + linked Donor"
    precision: "2 decimal places, round_half_up"

  - name: travel_reimbursement
    trigger: "TravelItinerary confirm"
    algorithm: tiered_pricing
    formula: |
      # Reimbursement is capped at the LOWER of:
      #   (a) flight cost component: FLIGHT_CENTS_PER_MILE * segment_miles, capped at FLIGHT_CAP_CENTS
      #   (b) lodging component: lodging_nights * LODGING_PER_NIGHT_CENTS, capped at LODGING_CAP_CENTS
      # Plus a per-itinerary flat booking fee FLAT_FEE_CENTS.
      # Rounding: round per-component to nearest cent (round_half_up), THEN sum components, THEN add flat fee.
      # The order matters: rounding per-component first is mandatory.
      flight_component_cents = min(FLIGHT_CAP_CENTS, round_half_up(FLIGHT_CENTS_PER_MILE * segment_miles))
      lodging_component_cents = min(LODGING_CAP_CENTS, lodging_nights * LODGING_PER_NIGHT_CENTS)
      estimated_cost_cents = flight_component_cents + lodging_component_cents + FLAT_FEE_CENTS
    input_set: "Single TravelItinerary"
    constants:
      FLIGHT_CENTS_PER_MILE: 50
      FLIGHT_CAP_CENTS: 80000
      LODGING_PER_NIGHT_CENTS: 15000
      LODGING_CAP_CENTS: 60000
      FLAT_FEE_CENTS: 2500
    precision: "integer cents, round_half_up per component"

  - name: travel_reimbursement_altruistic
    trigger: "TravelItinerary confirm when donor.donor_kind == ALTRUISTIC"
    algorithm: tiered_pricing
    formula: |
      # Variant for altruistic donors: same component structure but with elevated caps
      # and a mileage bonus multiplier. Same rounding rule (per-component round, then sum).
      flight_component_cents = min(FLIGHT_CAP_CENTS_ALTRUISTIC, round_half_up(FLIGHT_CENTS_PER_MILE * ALTRUISTIC_MILEAGE_MULTIPLIER * segment_miles))
      lodging_component_cents = min(LODGING_CAP_CENTS_ALTRUISTIC, lodging_nights * LODGING_PER_NIGHT_CENTS)
      estimated_cost_cents = flight_component_cents + lodging_component_cents + FLAT_FEE_CENTS
    input_set: "Single TravelItinerary where donor.donor_kind == ALTRUISTIC"
    constants:
      FLIGHT_CENTS_PER_MILE: 50
      ALTRUISTIC_MILEAGE_MULTIPLIER: 1.10
      FLIGHT_CAP_CENTS_ALTRUISTIC: 95000
      LODGING_PER_NIGHT_CENTS: 15000
      LODGING_CAP_CENTS_ALTRUISTIC: 75000
      FLAT_FEE_CENTS: 2500
    precision: "integer cents, round_half_up per component"
    variants:
      - name: altruistic_boost
        when: "donor.donor_kind == ALTRUISTIC"
        difference: "Uses elevated flight cap (95000 vs 80000), elevated lodging cap (75000 vs 60000), and 1.10x mileage multiplier on the flight component. For identical segment_miles and lodging_nights, altruistic variant yields a strictly greater estimated_cost_cents when the mileage multiplier or caps bind; otherwise equal to base."

  - name: chain_completion_grade
    trigger: "Chain reaches terminal chain_state"
    algorithm: aggregation
    formula: |
      # Grade is derived from chain.length_actual vs chain.length_target at terminal transition.
      if chain.chain_state == COMPLETED:
        completion_grade = FULL
      elif chain.chain_state == BROKEN and chain.length_actual == 0:
        completion_grade = BROKEN_PARTIAL  # zero completed transplants; distinct from PARTIAL
      elif chain.chain_state == BROKEN and chain.length_actual > 0 and chain.length_actual < chain.length_target:
        completion_grade = BROKEN_PARTIAL
      elif chain.chain_state == BROKEN and chain.length_actual >= chain.length_target:
        # unreachable by construction, but pin semantics: FULL even on a BROKEN state label
        completion_grade = FULL
      else:
        completion_grade = PENDING
    input_set: "Single Chain"
    precision: "enum"

  - name: center_reputation_score
    trigger: "any of: TransplantOutcome attribution finalized; OrganShipment cold-ischemia violation; OrganShipment delivered"
    algorithm: weighted_scoring
    formula: |
      # Reputation in basis points 0..10000 (higher is better).
      # Start at REPUTATION_BASE_BPS = 10000.
      # Subtract REPUTATION_FAILURE_PENALTY_BPS per FAILED outcome (capped contribution: no more than REPUTATION_FAILURE_CAP_BPS total).
      # Subtract REPUTATION_CIT_PENALTY_BPS per probed cold-ischemia violation (no cap).
      # Add REPUTATION_SHIPMENT_BONUS_BPS per successfully DELIVERED OrganShipment, capped at REPUTATION_SHIPMENT_CAP_BPS total.
      # Floor at 0; cap at 10000.
      failure_component = min(REPUTATION_FAILURE_CAP_BPS, failed_outcome_count * REPUTATION_FAILURE_PENALTY_BPS)
      cit_component = probed_cold_ischemia_violations * REPUTATION_CIT_PENALTY_BPS
      shipment_component = min(REPUTATION_SHIPMENT_CAP_BPS, shipped_organ_count * REPUTATION_SHIPMENT_BONUS_BPS)
      raw = REPUTATION_BASE_BPS - failure_component - cit_component + shipment_component
      reputation_score_bps = max(0, min(10000, raw))
    input_set: "Single TransplantCenter"
    constants:
      REPUTATION_BASE_BPS: 10000
      REPUTATION_FAILURE_PENALTY_BPS: 1500
      REPUTATION_FAILURE_CAP_BPS: 4500
      REPUTATION_CIT_PENALTY_BPS: 800
      REPUTATION_SHIPMENT_BONUS_BPS: 200
      REPUTATION_SHIPMENT_CAP_BPS: 1000
    precision: "integer bps"

  - name: protection_claim_headroom
    trigger: "DonorProtectionClaim approve or partial-approve"
    algorithm: waterfall_allocation
    formula: |
      # Each claim_kind draws from its own bucket; remaining headroom is bucket cap minus already-paid.
      # complication_headroom = policy.covered_complication_max_cents - policy.complications_paid_cents
      # lost_wages_headroom = policy.covered_lost_wages_max_cents - policy.lost_wages_paid_cents
      # travel_headroom = unlimited within policy but each individual itinerary's claim is auto-approved at its estimated_cost_cents
      # priority_kidney_headroom = 1 if policy.priority_kidney_claim_available else 0 (boolean-like; not monetary)
      # Approve: if requested <= headroom, approve full. If 0 < headroom < requested, force PARTIALLY_APPROVED at headroom (do NOT auto-APPROVE). If headroom == 0, deny with ERR_CLAIM_EXCEEDS_CAP.
    input_set: "Single DonorProtectionClaim + parent DonorProtectionPolicy"
    constants:
      COMPLICATION_COVER_CENTS: 25000000   # $250k
      LOST_WAGES_COVER_CENTS: 600000        # $6k
    precision: "integer cents"

  - name: pair_incompatibility_check
    trigger: "POST /nkr/pairs/{pair_id}/enter-pool"
    algorithm: constraint_propagation
    formula: |
      # Verify that the pair is genuinely ABO-incompatible, OR has unacceptable-antigen sensitization, OR compatible-pair opt-in is true.
      # abo_incompatible = NOT abo_compatibility(donor, recipient)
      # antigen_sensitized = unacceptable_antigen_hit(donor, recipient)
      # eligible = abo_incompatible OR antigen_sensitized OR (request body flag compatible_pair_opt_in == true)
      # If not eligible: ERR_PAIR_NOT_INCOMPATIBLE
    input_set: "Single DonorRecipientPair"

  - name: chain_break_cascade_scope
    trigger: "ChainBreakEvent creation"
    algorithm: chronological
    formula: |
      # Walk MatchOffers of the broken chain in position_index ASC order.
      # For each offer at position_index > broken_at_index:
      #   - If offer_state in {PENDING_CROSSMATCH, CROSSMATCH_PASSED, CENTER_ACCEPTED, SCHEDULED, DONOR_SURGERY_DONE}: -> OFFER_FAILED with reason CHAIN_BREAK_PROPAGATION.
      #   - If offer_state == TRANSPLANT_COMPLETED: do nothing (transplant already happened).
      # Track downstream recipients orphaned: those whose offer transitioned to OFFER_FAILED.
      # For each such recipient: chain_participation_state = ORPHANED. If the recipient's paired donor has surgery_state == NEPHRECTOMY_DONE (i.e., they donated already), set recipient.priority_boost_active = true.
      # Bridge-donor minting: if the broken donor's paired recipient is already TRANSPLANTED, mint a Donor with donor_kind=BRIDGE whose home_center_id = broken donor's home_center_id.
    input_set: "Single Chain + all MatchOffers + their Donors and Recipients"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role is authorized to invoke this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "All path-templated resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: existence
    check: "All body-referenced FK resources exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "endpoints taking FK references in body"

  - priority: 5
    category: business_safety
    check: "Center participation_status must not be SUSPENDED for any center-side action"
    error_id: ERR_CENTER_SUSPENDED
    http_status: 409
    applies_to: "crossmatch-review, center-accept, schedule, complete-nephrectomy, complete-transplant, depart, deliver"

  - priority: 6
    category: business_safety
    check: "Donor medical_status must be CLEARED for nephrectomy, crossmatch, chain proposal inclusion"
    error_id: ERR_DONOR_NOT_CLEARED
    http_status: 409
    applies_to: "complete-nephrectomy, crossmatch-review, chain-run execute"

  - priority: 7
    category: business_safety
    check: "Recipient medical_status must be LISTED for transplant, crossmatch, chain proposal inclusion"
    error_id: ERR_RECIPIENT_NOT_LISTED
    http_status: 409
    applies_to: "complete-transplant, crossmatch-review, chain-run execute"

  - priority: 8
    category: business_safety
    check: "Center acting on a MatchOffer/Donor/Recipient must match the relevant home/recipient center_id (segregation of centers)"
    error_id: ERR_CENTER_MISMATCH
    http_status: 403
    applies_to: "crossmatch-review, center-accept, center-decline, complete-nephrectomy, complete-transplant, appeal"

  - priority: 9
    category: state
    check: "Resource must be in correct state for this transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 10
    category: state
    check: "Optimistic concurrency: expected_*_version field must match parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /nkr/chains/{chain_id}/schedule, POST /nkr/chains/{chain_id}/lock, POST /nkr/centers/{center_id}/suspend, POST /nkr/chain-runs/{run_id}/execute"

  - priority: 11
    category: business_temporal
    check: "Logical clock must not have passed crossmatch_deadline_utc / center_accept_deadline_utc"
    error_id: ERR_REVIEW_DEADLINE_PASSED
    http_status: 409
    applies_to: "crossmatch-review, center-accept"

  - priority: 12
    category: business_temporal
    check: "Slot start must be >= logical clock + MIN_SCHEDULE_LEAD_HOURS"
    error_id: ERR_SLOT_TOO_SOON
    http_status: 409
    applies_to: "POST /nkr/chains/{chain_id}/schedule, POST /nkr/slots"

  - priority: 13
    category: business_temporal
    check: "Itinerary cancel/reimburse windows: cancel requires clock < depart_utc; reimburse requires clock >= arrive_utc"
    error_id: ERR_FLIGHT_ALREADY_DEPARTED
    http_status: 409
    applies_to: "POST /nkr/itineraries/{itinerary_id}/cancel, POST /nkr/itineraries/{itinerary_id}/reimburse"

  - priority: 14
    category: business_constraint
    check: "SurgeryScheduleSlot intervals at the same center_id must not overlap when both in {RESERVED, CONSUMED}; intervals are half-open [start, end) so adjacent slots with end == start are allowed"
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /nkr/slots, POST /nkr/chains/{chain_id}/schedule"

  - priority: 15
    category: business_constraint
    check: "Pair must be ABO-incompatible OR antigen-sensitized OR compatible-pair opt-in"
    error_id: ERR_PAIR_NOT_INCOMPATIBLE
    http_status: 409
    applies_to: "POST /nkr/pairs/{pair_id}/enter-pool"

  - priority: 16
    category: business_constraint
    check: "Candidate pool size must be >= MIN_POOL_SIZE for chain run execute"
    error_id: ERR_POOL_TOO_SMALL
    http_status: 409
    applies_to: "POST /nkr/chain-runs/{run_id}/execute"

  - priority: 17
    category: business_constraint
    check: "Chain run cannot be superseded once any child chain is LOCKED or later"
    error_id: ERR_CHAIN_LOCKED
    http_status: 409
    applies_to: "POST /nkr/chain-runs/{run_id}/supersede, POST /nkr/slots/{slot_id}/release"

  - priority: 18
    category: business_constraint
    check: "Organ shipment cannot depart until source MatchOffer offer_state == DONOR_SURGERY_DONE"
    error_id: ERR_ORGAN_NOT_READY
    http_status: 409
    applies_to: "POST /nkr/shipments/{shipment_id}/depart"

  - priority: 19
    category: business_safety
    check: "Cold ischemia actual hours must be <= cold_ischemia_max_hours at delivery"
    error_id: ERR_COLD_ISCHEMIA_VIOLATION
    http_status: 409
    applies_to: "POST /nkr/shipments/{shipment_id}/deliver (forbids transplant completion if violated; delivery itself is recorded)"

  - priority: 20
    category: business_fiscal
    check: "DonorProtectionClaim approval must fit within bucket headroom; otherwise PARTIALLY_APPROVED or DENIED"
    error_id: ERR_CLAIM_EXCEEDS_CAP
    http_status: 409
    applies_to: "POST /nkr/claims/{claim_id}/approve"

  - priority: 21
    category: business_fiscal
    check: "Donor must have an active DonorProtectionPolicy to submit claims or be reimbursed"
    error_id: ERR_NO_PROTECTION_POLICY
    http_status: 409
    applies_to: "POST /nkr/donors/{donor_id}/claims, POST /nkr/itineraries/{itinerary_id}/reimburse"

  - priority: 22
    category: business_referential
    check: "MatchOffer must be in ORGAN_SHIPPED and shipment DELIVERED before recipient can be transplanted"
    error_id: ERR_ORGAN_NOT_ARRIVED
    http_status: 409
    applies_to: "POST /nkr/recipients/{recipient_id}/complete-transplant"

  - priority: 23
    category: business_referential
    check: "Recipient must be in chain_participation_state == COMMITTED to be transplanted"
    error_id: ERR_RECIPIENT_NOT_COMMITTED
    http_status: 409
    applies_to: "POST /nkr/recipients/{recipient_id}/complete-transplant"

  - priority: 24
    category: business_referential
    check: "Donor surgery_state must not be NEPHRECTOMY_DONE for medical-hold or withdraw"
    error_id: ERR_DONOR_POST_NEPHRECTOMY
    http_status: 409
    applies_to: "POST /nkr/donors/{donor_id}/medical-hold, POST /nkr/donors/{donor_id}/withdraw"

  - priority: 25
    category: business_constraint
    check: "Active chain count at center must be < max_concurrent_chains to schedule a new chain involving that center"
    error_id: ERR_CENTER_AT_CAPACITY
    http_status: 409
    applies_to: "POST /nkr/chains/{chain_id}/schedule"

  - priority: 26
    category: auth
    check: "Segregation of duties: claim adjudicator must differ from claim submitter"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /nkr/claims/{claim_id}/approve, POST /nkr/claims/{claim_id}/partial-approve, POST /nkr/claims/{claim_id}/deny"

  - priority: 27
    category: business_constraint
    check: "Request must be well-formed; required fields present"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving endpoints (logical clock) ---
  - method: POST
    path: "/nkr/_clock/set_current_utc"
    description: "Set the logical clock to an arbitrary ISO-8601 UTC timestamp. Server startup default is 2026-09-01T00:00:00Z; before any set_current_utc call, the logical clock reads exactly this default and does NOT fall back to wall-clock."
    roles: [RegistryAdmin, MatchOperator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "Advances logical clock"
      - "Triggers time-based transitions: SurgeryScheduleSlot OPEN/RESERVED -> EXPIRED if slot_end_utc passed; MatchOffer crossmatch_deadline / center_accept_deadline expiry check (offers past deadline -> OFFER_FAILED)"

  # --- TransplantCenter ---
  - method: POST
    path: "/nkr/centers"
    description: "Create a TransplantCenter"
    roles: [RegistryAdmin]
    code: 201
    input: [center_code, name, region_code, tier, max_concurrent_chains]
    output: TransplantCenter
    side_effects:
      - "participation_status=ACTIVE; computed counters initialized to 0"

  - method: GET
    path: "/nkr/centers"
    description: "List TransplantCenters (paginated)"
    roles: [RegistryAdmin, MatchOperator, CenterCoordinator, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?", "region_code?", "participation_status?"]
    output: TransplantCenter[]
    side_effects: []

  - method: GET
    path: "/nkr/centers/{center_id}"
    description: "Get a single TransplantCenter"
    roles: [RegistryAdmin, MatchOperator, CenterCoordinator, LogisticsCoordinator]
    code: 200
    input: []
    output: TransplantCenter
    side_effects: []

  - method: POST
    path: "/nkr/centers/{center_id}/probate"
    description: "Move center ACTIVE -> PROBATION"
    roles: [RegistryAdmin]
    code: 200
    input: []
    output: TransplantCenter
    side_effects: ["state transition per §1.2"]

  - method: POST
    path: "/nkr/centers/{center_id}/suspend"
    description: "Move center ACTIVE/PROBATION -> SUSPENDED (OCC-guarded)"
    roles: [RegistryAdmin]
    code: 200
    input: [expected_center_version]
    output: TransplantCenter
    side_effects:
      - "state transition per §1.2"
      - "increments TransplantCenter.version by 1"
      - "cascades: reserved slots released, pending offers at this center -> OFFER_FAILED"

  - method: POST
    path: "/nkr/centers/{center_id}/reinstate"
    description: "Move center PROBATION/SUSPENDED -> ACTIVE"
    roles: [RegistryAdmin]
    code: 200
    input: []
    output: TransplantCenter
    side_effects: ["state transition per §1.2"]

  # --- Donor ---
  - method: POST
    path: "/nkr/donors"
    description: "Register a Donor"
    roles: [CenterCoordinator]
    code: 201
    input: [external_ref, home_center_id, abo_type, hla_a, hla_b, hla_drb1, kdri_score, age_at_registration, donor_kind]
    output: Donor
    side_effects: ["medical_status=CLEARED, surgery_state=PRE_SURGERY, chain_participation_state=POOL"]

  - method: GET
    path: "/nkr/donors"
    description: "List Donors (paginated, filterable)"
    roles: [RegistryAdmin, MatchOperator, CenterCoordinator, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?", "home_center_id?", "medical_status?", "donor_kind?", "chain_participation_state?", "protection_policy_id?"]
    output: Donor[]
    side_effects: []

  - method: GET
    path: "/nkr/donors/{donor_id}"
    description: "Get a single Donor"
    roles: [RegistryAdmin, MatchOperator, CenterCoordinator, LogisticsCoordinator]
    code: 200
    input: []
    output: Donor
    side_effects: []

  - method: POST
    path: "/nkr/donors/{donor_id}/medical-hold"
    description: "Donor CLEARED -> ON_HOLD"
    roles: [CenterCoordinator]
    code: 200
    input: []
    output: Donor
    side_effects: ["per §1.2 — cascades to affected MatchOffers"]

  - method: POST
    path: "/nkr/donors/{donor_id}/medical-release"
    description: "Donor ON_HOLD -> CLEARED"
    roles: [CenterCoordinator]
    code: 200
    input: []
    output: Donor
    side_effects: []

  - method: POST
    path: "/nkr/donors/{donor_id}/withdraw"
    description: "Donor CLEARED/ON_HOLD -> WITHDRAWN"
    roles: [CenterCoordinator]
    code: 200
    input: []
    output: Donor
    side_effects: ["per §1.2 — emits ChainBreakEvent if in active chain"]

  - method: POST
    path: "/nkr/donors/{donor_id}/deceased"
    description: "Donor -> DECEASED"
    roles: [CenterCoordinator]
    code: 200
    input: []
    output: Donor
    side_effects: ["per §1.2"]

  - method: POST
    path: "/nkr/donors/{donor_id}/complete-nephrectomy"
    description: "Mark donor nephrectomy as done; mints DonorProtectionPolicy"
    roles: [CenterCoordinator]
    code: 200
    input: []
    output: Donor
    side_effects:
      - "surgery_state SURGERY_SCHEDULED -> NEPHRECTOMY_DONE"
      - "Mint DonorProtectionPolicy (ACTIVE) for this donor"
      - "MatchOffer for this donor -> DONOR_SURGERY_DONE"
      - "chain_participation_state -> COMPLETED"

  - method: POST
    path: "/nkr/donors/{donor_id}/fail-preop"
    description: "Mark donor preop as failed; triggers chain break"
    roles: [CenterCoordinator]
    code: 200
    input: []
    output: Donor
    side_effects: ["surgery_state -> FAILED_PREOP; ChainBreakEvent minted with trigger_kind=SURGERY_ABORTED"]

  # --- Recipient ---
  - method: POST
    path: "/nkr/recipients"
    description: "Register a Recipient"
    roles: [CenterCoordinator]
    code: 201
    input: [external_ref, home_center_id, abo_type, cpra_percent, unacceptable_antigens, "paired_donor_id?"]
    output: Recipient
    side_effects: ["medical_status=LISTED, chain_participation_state=POOL, listed_at_utc stamped"]

  - method: GET
    path: "/nkr/recipients"
    description: "List Recipients (paginated, filterable)"
    roles: [RegistryAdmin, MatchOperator, CenterCoordinator, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?", "home_center_id?", "medical_status?", "chain_participation_state?", "priority_boost_active?", "paired_donor_id?"]
    output: Recipient[]
    side_effects: []

  - method: GET
    path: "/nkr/recipients/{recipient_id}"
    description: "Get a single Recipient"
    roles: [RegistryAdmin, MatchOperator, CenterCoordinator, LogisticsCoordinator]
    code: 200
    input: []
    output: Recipient
    side_effects: []

  - method: POST
    path: "/nkr/recipients/{recipient_id}/medical-hold"
    description: "Recipient LISTED -> ON_HOLD"
    roles: [CenterCoordinator]
    code: 200
    input: []
    output: Recipient
    side_effects: ["per §1.2"]

  - method: POST
    path: "/nkr/recipients/{recipient_id}/medical-release"
    description: "Recipient ON_HOLD -> LISTED"
    roles: [CenterCoordinator]
    code: 200
    input: []
    output: Recipient
    side_effects: []

  - method: POST
    path: "/nkr/recipients/{recipient_id}/withdraw"
    description: "Recipient LISTED/ON_HOLD -> WITHDRAWN"
    roles: [CenterCoordinator]
    code: 200
    input: []
    output: Recipient
    side_effects: ["DonorRecipientPair -> DISSOLVED"]

  - method: POST
    path: "/nkr/recipients/{recipient_id}/deceased"
    description: "Recipient -> DECEASED"
    roles: [CenterCoordinator]
    code: 200
    input: []
    output: Recipient
    side_effects: ["DonorRecipientPair -> DISSOLVED"]

  - method: POST
    path: "/nkr/recipients/{recipient_id}/complete-transplant"
    description: "Mark recipient transplant complete"
    roles: [CenterCoordinator]
    code: 200
    input: []
    output: Recipient
    side_effects: ["per §1.2 — MatchOffer -> TRANSPLANT_COMPLETED; pair -> RELEASED; chain length_actual incremented"]

  # --- DonorRecipientPair ---
  - method: POST
    path: "/nkr/pairs"
    description: "Register a DonorRecipientPair"
    roles: [CenterCoordinator]
    code: 201
    input: [donor_id, recipient_id, registered_center_id]
    output: DonorRecipientPair
    side_effects: ["pair_state=REGISTERED"]

  - method: GET
    path: "/nkr/pairs"
    description: "List pairs"
    roles: [RegistryAdmin, MatchOperator, CenterCoordinator]
    code: 200
    input: ["limit?", "offset?", "donor_id?", "recipient_id?", "registered_center_id?", "pair_state?"]
    output: DonorRecipientPair[]
    side_effects: []

  - method: GET
    path: "/nkr/pairs/{pair_id}"
    description: "Get a single pair"
    roles: [RegistryAdmin, MatchOperator, CenterCoordinator]
    code: 200
    input: []
    output: DonorRecipientPair
    side_effects: []

  - method: POST
    path: "/nkr/pairs/{pair_id}/verify"
    description: "Verify pair (REGISTERED -> VERIFIED)"
    roles: [CenterCoordinator]
    code: 200
    input: []
    output: DonorRecipientPair
    side_effects: ["per §1.2"]

  - method: POST
    path: "/nkr/pairs/{pair_id}/enter-pool"
    description: "Enter pair into national pool (VERIFIED -> IN_POOL)"
    roles: [CenterCoordinator]
    code: 200
    input: ["compatible_pair_opt_in?"]
    output: DonorRecipientPair
    side_effects: ["per §1.2; entered_pool_at_utc stamped"]

  - method: POST
    path: "/nkr/pairs/{pair_id}/dissolve"
    description: "Dissolve pair"
    roles: [CenterCoordinator]
    code: 200
    input: [dissolution_reason]
    output: DonorRecipientPair
    side_effects: ["pair_state -> DISSOLVED"]

  # --- ChainRun ---
  - method: POST
    path: "/nkr/chain-runs"
    description: "Create a ChainRun"
    roles: [MatchOperator]
    code: 201
    input: [run_label]
    output: ChainRun
    side_effects: ["run_state=DRAFT, started_at_utc stamped"]

  - method: GET
    path: "/nkr/chain-runs"
    description: "List chain runs"
    roles: [RegistryAdmin, MatchOperator]
    code: 200
    input: ["limit?", "offset?", "run_state?"]
    output: ChainRun[]
    side_effects: []

  - method: GET
    path: "/nkr/chain-runs/{run_id}"
    description: "Get a chain run"
    roles: [RegistryAdmin, MatchOperator]
    code: 200
    input: []
    output: ChainRun
    side_effects: []

  - method: POST
    path: "/nkr/chain-runs/{run_id}/execute"
    description: "Execute chain construction (OCC-guarded); mints Chain + MatchOffer rows"
    roles: [MatchOperator]
    code: 200
    input: [expected_run_version]
    output: ChainRun
    side_effects:
      - "run_state DRAFT -> EXECUTED"
      - "chain_construction algorithm runs; Chain and MatchOffer rows minted"
      - "increments ChainRun.version by 1"

  - method: POST
    path: "/nkr/chain-runs/{run_id}/publish"
    description: "Publish an executed run"
    roles: [MatchOperator]
    code: 200
    input: []
    output: ChainRun
    side_effects: ["run_state EXECUTED -> PUBLISHED; donors/recipients -> PROPOSED"]

  - method: POST
    path: "/nkr/chain-runs/{run_id}/supersede"
    description: "Supersede an executed/published run"
    roles: [MatchOperator]
    code: 200
    input: []
    output: ChainRun
    side_effects: ["per §1.2 — chains ABORTED, offers OFFER_FAILED, participants revert to POOL"]

  # --- Chain ---
  - method: GET
    path: "/nkr/chains"
    description: "List chains"
    roles: [RegistryAdmin, MatchOperator, CenterCoordinator, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?", "chain_state?", "chain_run_id?", "starts_at_center_id?", "starter_donor_id?"]
    output: Chain[]
    side_effects: []

  - method: GET
    path: "/nkr/chains/{chain_id}"
    description: "Get a chain"
    roles: [RegistryAdmin, MatchOperator, CenterCoordinator, LogisticsCoordinator]
    code: 200
    input: []
    output: Chain
    side_effects: []

  - method: POST
    path: "/nkr/chains/{chain_id}/lock"
    description: "Lock chain after all offers CENTER_ACCEPTED (OCC-guarded)"
    roles: [MatchOperator]
    code: 200
    input: [expected_chain_version]
    output: Chain
    side_effects:
      - "chain_state ACCEPTING -> LOCKED"
      - "donor/recipient chain_participation_state -> LOCKED"
      - "increments Chain.version by 1"

  - method: POST
    path: "/nkr/chains/{chain_id}/schedule"
    description: "Reserve all required SurgeryScheduleSlots atomically and transition chain LOCKED -> SCHEDULED (OCC-guarded)"
    roles: [MatchOperator]
    code: 200
    input: [expected_chain_version, scheduled_date, slot_ids]
    output: Chain
    side_effects:
      - "Validates every slot is OPEN, no overlap, lead time satisfied"
      - "Slots OPEN -> RESERVED with reserved_for_chain_id, reserved_for_offer_id, simultaneous_group_id"
      - "chain_state -> SCHEDULED; scheduled_date stamped"
      - "Donor surgery_state -> SURGERY_SCHEDULED; chain_participation_state -> COMMITTED for all participants"
      - "MatchOffer offer_state CENTER_ACCEPTED -> SCHEDULED"
      - "increments Chain.version by 1"

  - method: POST
    path: "/nkr/chains/{chain_id}/start-execution"
    description: "Begin execution (SCHEDULED -> EXECUTING)"
    roles: [MatchOperator]
    code: 200
    input: []
    output: Chain
    side_effects: ["per §1.2"]

  # --- MatchOffer ---
  - method: GET
    path: "/nkr/match-offers"
    description: "List match offers (filtered)"
    roles: [RegistryAdmin, MatchOperator, CenterCoordinator, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?", "chain_id?", "donor_id?", "recipient_id?", "donor_center_id?", "recipient_center_id?", "offer_state?"]
    output: MatchOffer[]
    side_effects: []

  - method: GET
    path: "/nkr/match-offers/{offer_id}"
    description: "Get a match offer"
    roles: [RegistryAdmin, MatchOperator, CenterCoordinator, LogisticsCoordinator]
    code: 200
    input: []
    output: MatchOffer
    side_effects: []

  - method: POST
    path: "/nkr/match-offers/{offer_id}/crossmatch-review"
    description: "Submit virtual crossmatch review (CenterCoordinator at recipient center)"
    roles: [CenterCoordinator]
    code: 200
    input: [virtual_result, flow_cytometry_channel_shift, dsa_mfi_max, review_notes]
    output: CrossmatchReview
    side_effects:
      - "Mint CrossmatchReview with decision computed via crossmatch_decision calculation"
      - "MatchOffer PENDING_CROSSMATCH -> CROSSMATCH_PASSED or CROSSMATCH_FAILED"

  - method: POST
    path: "/nkr/match-offers/{offer_id}/center-accept"
    description: "Recipient center accepts offer"
    roles: [CenterCoordinator]
    code: 200
    input: []
    output: MatchOffer
    side_effects: ["MatchOffer CROSSMATCH_PASSED -> CENTER_ACCEPTED"]

  - method: POST
    path: "/nkr/match-offers/{offer_id}/center-decline"
    description: "Recipient center declines offer"
    roles: [CenterCoordinator]
    code: 200
    input: []
    output: MatchOffer
    side_effects: ["MatchOffer CROSSMATCH_PASSED -> CENTER_DECLINED -> OFFER_FAILED"]

  # --- CrossmatchReview ---
  - method: GET
    path: "/nkr/crossmatch-reviews"
    description: "List crossmatch reviews"
    roles: [RegistryAdmin, MatchOperator, CenterCoordinator]
    code: 200
    input: ["limit?", "offset?", "match_offer_id?", "reviewer_center_id?", "decision?"]
    output: CrossmatchReview[]
    side_effects: []

  - method: GET
    path: "/nkr/crossmatch-reviews/{review_id}"
    description: "Get a crossmatch review"
    roles: [RegistryAdmin, MatchOperator, CenterCoordinator]
    code: 200
    input: []
    output: CrossmatchReview
    side_effects: []

  # --- SurgeryScheduleSlot ---
  - method: POST
    path: "/nkr/slots"
    description: "Open a SurgeryScheduleSlot at a center"
    roles: [CenterCoordinator]
    code: 201
    input: [center_id, slot_start_utc, slot_end_utc, room_kind]
    output: SurgeryScheduleSlot
    side_effects: ["slot_state=OPEN"]

  - method: GET
    path: "/nkr/slots"
    description: "List slots (filterable)"
    roles: [RegistryAdmin, MatchOperator, CenterCoordinator, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?", "center_id?", "slot_state?", "reserved_for_chain_id?", "reserved_for_offer_id?"]
    output: SurgeryScheduleSlot[]
    side_effects: []

  - method: GET
    path: "/nkr/slots/{slot_id}"
    description: "Get a slot"
    roles: [RegistryAdmin, MatchOperator, CenterCoordinator, LogisticsCoordinator]
    code: 200
    input: []
    output: SurgeryScheduleSlot
    side_effects: []

  - method: POST
    path: "/nkr/slots/{slot_id}/release"
    description: "Release a RESERVED slot"
    roles: [MatchOperator]
    code: 200
    input: []
    output: SurgeryScheduleSlot
    side_effects: ["slot_state RESERVED -> RELEASED"]

  # --- OrganShipment ---
  - method: POST
    path: "/nkr/shipments"
    description: "Plan an organ shipment for a MatchOffer"
    roles: [LogisticsCoordinator]
    code: 201
    input: [match_offer_id, shipment_mode, scheduled_departure_utc, scheduled_arrival_utc, "cold_ischemia_max_hours?"]
    output: OrganShipment
    side_effects: ["shipment_state=PLANNED, routing_sequence=0"]

  - method: GET
    path: "/nkr/shipments"
    description: "List shipments"
    roles: [RegistryAdmin, MatchOperator, CenterCoordinator, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?", "match_offer_id?", "origin_center_id?", "destination_center_id?", "shipment_state?"]
    output: OrganShipment[]
    side_effects: []

  - method: GET
    path: "/nkr/shipments/{shipment_id}"
    description: "Get a shipment"
    roles: [RegistryAdmin, MatchOperator, CenterCoordinator, LogisticsCoordinator]
    code: 200
    input: []
    output: OrganShipment
    side_effects: []

  - method: POST
    path: "/nkr/shipments/{shipment_id}/depart"
    description: "Mark shipment departed"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: OrganShipment
    side_effects: ["shipment_state PLANNED -> DEPARTED; actual_departure_utc stamped"]

  - method: POST
    path: "/nkr/shipments/{shipment_id}/delay"
    description: "Mark shipment delayed with contingency reason"
    roles: [LogisticsCoordinator]
    code: 200
    input: [contingency_reason]
    output: OrganShipment
    side_effects: ["shipment_state DEPARTED -> DELAYED"]

  - method: POST
    path: "/nkr/shipments/{shipment_id}/reroute"
    description: "Reroute a delayed or in-flight shipment"
    roles: [LogisticsCoordinator]
    code: 200
    input: [new_scheduled_arrival_utc]
    output: OrganShipment
    side_effects: ["shipment_state -> REROUTED; routing_sequence += 1"]

  - method: POST
    path: "/nkr/shipments/{shipment_id}/deliver"
    description: "Mark shipment delivered; computes cold ischemia"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: OrganShipment
    side_effects:
      - "shipment_state -> DELIVERED; actual_arrival_utc stamped"
      - "cold_ischemia_hours_actual computed"
      - "if violation: MatchOffer -> OFFER_FAILED with reason COLD_ISCHEMIA, destination center.probed_cold_ischemia_violations += 1"
      - "else: MatchOffer -> ORGAN_SHIPPED"

  - method: POST
    path: "/nkr/shipments/{shipment_id}/cancel"
    description: "Cancel a shipment"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: OrganShipment
    side_effects: ["shipment_state -> CANCELLED; if DEPARTED, emits ChainBreakEvent ORGAN_LOST_IN_TRANSIT"]

  # --- TravelItinerary ---
  - method: POST
    path: "/nkr/itineraries"
    description: "Draft a travel itinerary for a donor"
    roles: [LogisticsCoordinator]
    code: 201
    input: [donor_id, origin_airport_code, destination_airport_code, depart_utc, arrive_utc, segment_miles, lodging_nights]
    output: TravelItinerary
    side_effects: ["itinerary_state=DRAFT"]

  - method: GET
    path: "/nkr/itineraries"
    description: "List itineraries"
    roles: [RegistryAdmin, MatchOperator, CenterCoordinator, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?", "donor_id?", "itinerary_state?"]
    output: TravelItinerary[]
    side_effects: []

  - method: GET
    path: "/nkr/itineraries/{itinerary_id}"
    description: "Get an itinerary"
    roles: [RegistryAdmin, MatchOperator, CenterCoordinator, LogisticsCoordinator]
    code: 200
    input: []
    output: TravelItinerary
    side_effects: []

  - method: POST
    path: "/nkr/itineraries/{itinerary_id}/confirm"
    description: "Confirm a draft itinerary; computes estimated_cost_cents"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: TravelItinerary
    side_effects: ["itinerary_state DRAFT -> CONFIRMED; estimated_cost_cents computed (variant per donor_kind)"]

  - method: POST
    path: "/nkr/itineraries/{itinerary_id}/cancel"
    description: "Cancel a confirmed itinerary"
    roles: [LogisticsCoordinator]
    code: 200
    input: [cancelled_reason]
    output: TravelItinerary
    side_effects: ["itinerary_state -> CANCELLED"]

  - method: POST
    path: "/nkr/itineraries/{itinerary_id}/reimburse"
    description: "Mark itinerary as reimbursed; auto-mints TRAVEL claim"
    roles: [RegistryAdmin]
    code: 200
    input: []
    output: TravelItinerary
    side_effects:
      - "itinerary_state -> REIMBURSED"
      - "Auto-mint DonorProtectionClaim claim_kind=TRAVEL claim_state=APPROVED"
      - "policy.travel_reimbursed_cents += estimated_cost_cents"

  # --- DonorProtectionPolicy / Claim ---
  - method: GET
    path: "/nkr/policies"
    description: "List donor protection policies"
    roles: [RegistryAdmin, MatchOperator, CenterCoordinator]
    code: 200
    input: ["limit?", "offset?", "donor_id?", "policy_state?"]
    output: DonorProtectionPolicy[]
    side_effects: []

  - method: GET
    path: "/nkr/policies/{policy_id}"
    description: "Get a policy"
    roles: [RegistryAdmin, MatchOperator, CenterCoordinator]
    code: 200
    input: []
    output: DonorProtectionPolicy
    side_effects: []

  - method: POST
    path: "/nkr/donors/{donor_id}/claims"
    description: "Submit a DonorProtectionClaim on the donor's policy"
    roles: [CenterCoordinator]
    code: 201
    input: [claim_kind, "requested_amount_cents?"]
    output: DonorProtectionClaim
    side_effects: ["claim_state=SUBMITTED; submitted_at_utc stamped; policy must be ACTIVE (ERR_NO_PROTECTION_POLICY)"]

  - method: GET
    path: "/nkr/claims"
    description: "List claims"
    roles: [RegistryAdmin, CenterCoordinator]
    code: 200
    input: ["limit?", "offset?", "policy_id?", "claim_kind?", "claim_state?"]
    output: DonorProtectionClaim[]
    side_effects: []

  - method: GET
    path: "/nkr/claims/{claim_id}"
    description: "Get a claim"
    roles: [RegistryAdmin, CenterCoordinator]
    code: 200
    input: []
    output: DonorProtectionClaim
    side_effects: []

  - method: POST
    path: "/nkr/claims/{claim_id}/start-review"
    description: "Move claim SUBMITTED -> UNDER_REVIEW"
    roles: [RegistryAdmin]
    code: 200
    input: []
    output: DonorProtectionClaim
    side_effects: ["adjudicator_user_id set"]

  - method: POST
    path: "/nkr/claims/{claim_id}/approve"
    description: "Approve a claim (full amount)"
    roles: [RegistryAdmin]
    code: 200
    input: []
    output: DonorProtectionClaim
    side_effects: ["claim_state -> APPROVED; approved_amount_cents = requested_amount_cents; bucket debited"]

  - method: POST
    path: "/nkr/claims/{claim_id}/partial-approve"
    description: "Partially approve a claim"
    roles: [RegistryAdmin]
    code: 200
    input: [approved_amount_cents]
    output: DonorProtectionClaim
    side_effects: ["claim_state -> PARTIALLY_APPROVED; bucket debited"]

  - method: POST
    path: "/nkr/claims/{claim_id}/deny"
    description: "Deny a claim"
    roles: [RegistryAdmin]
    code: 200
    input: [denial_reason]
    output: DonorProtectionClaim
    side_effects: ["claim_state -> DENIED"]

  - method: POST
    path: "/nkr/claims/{claim_id}/pay"
    description: "Mark approved claim paid"
    roles: [RegistryAdmin]
    code: 200
    input: []
    output: DonorProtectionClaim
    side_effects: ["claim_state -> PAID"]

  # --- TransplantOutcome ---
  - method: POST
    path: "/nkr/outcomes"
    description: "Report a transplant outcome"
    roles: [CenterCoordinator]
    code: 201
    input: [match_offer_id, outcome_kind, followup_days]
    output: TransplantOutcome
    side_effects: ["outcome_state=REPORTED"]

  - method: GET
    path: "/nkr/outcomes"
    description: "List outcomes"
    roles: [RegistryAdmin, MatchOperator, CenterCoordinator]
    code: 200
    input: ["limit?", "offset?", "match_offer_id?", "outcome_kind?", "outcome_state?", "attributed_center_id?"]
    output: TransplantOutcome[]
    side_effects: []

  - method: GET
    path: "/nkr/outcomes/{outcome_id}"
    description: "Get an outcome"
    roles: [RegistryAdmin, MatchOperator, CenterCoordinator]
    code: 200
    input: []
    output: TransplantOutcome
    side_effects: []

  - method: POST
    path: "/nkr/outcomes/{outcome_id}/attribute"
    description: "Attribute outcome to a center"
    roles: [RegistryAdmin]
    code: 200
    input: ["attributed_center_id?"]
    output: TransplantOutcome
    side_effects: ["outcome_state -> ATTRIBUTED_TO_CENTER; if FAILED: center.failed_outcome_count += 1; reputation recomputed"]

  - method: POST
    path: "/nkr/outcomes/{outcome_id}/appeal"
    description: "Center appeals an attribution"
    roles: [CenterCoordinator]
    code: 200
    input: []
    output: TransplantOutcome
    side_effects: ["outcome_state -> APPEALED"]

  - method: POST
    path: "/nkr/outcomes/{outcome_id}/resolve-appeal"
    description: "Resolve an appeal (may reattribute)"
    roles: [RegistryAdmin]
    code: 200
    input: ["new_attributed_center_id?"]
    output: TransplantOutcome
    side_effects: ["outcome_state -> FINAL; per §1.2 if FAILED + attribution changed: shift failed_outcome_count between centers"]

  - method: POST
    path: "/nkr/outcomes/{outcome_id}/finalize"
    description: "Finalize attribution without appeal"
    roles: [RegistryAdmin]
    code: 200
    input: []
    output: TransplantOutcome
    side_effects: ["outcome_state -> FINAL"]

  # --- ChainBreakEvent ---
  - method: GET
    path: "/nkr/chain-breaks"
    description: "List chain break events"
    roles: [RegistryAdmin, MatchOperator, CenterCoordinator]
    code: 200
    input: ["limit?", "offset?", "chain_id?", "event_state?", "trigger_kind?", "broken_at_offer_id?", "bridge_donor_id?"]
    output: ChainBreakEvent[]
    side_effects: []

  - method: GET
    path: "/nkr/chain-breaks/{event_id}"
    description: "Get a chain break event"
    roles: [RegistryAdmin, MatchOperator, CenterCoordinator]
    code: 200
    input: []
    output: ChainBreakEvent
    side_effects: []

  - method: POST
    path: "/nkr/chain-breaks/{event_id}/reconstruct"
    description: "Mark event as reconstructed after a new run executes"
    roles: [MatchOperator]
    code: 200
    input: []
    output: ChainBreakEvent
    side_effects: ["event_state CASCADED -> RECONSTRUCTED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role missing or unrecognized" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint per RBAC" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum, or out-of-range value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource in wrong state for this transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match parent's current version" }
  - { id: ERR_CENTER_SUSPENDED, http: 409, condition: "Center participation_status is SUSPENDED (or PROBATION where acceptance is forbidden)" }
  - { id: ERR_CENTER_INVALID_STATE, http: 409, condition: "Center participation transition invalid from current state" }
  - { id: ERR_CENTER_MISMATCH, http: 403, condition: "Acting CenterCoordinator's center_id does not match the resource's home/recipient/attributed center" }
  - { id: ERR_CENTER_AT_CAPACITY, http: 409, condition: "Center active_chain_count >= max_concurrent_chains" }
  - { id: ERR_DONOR_NOT_CLEARED, http: 409, condition: "Donor medical_status != CLEARED for an operation requiring clearance" }
  - { id: ERR_DONOR_POST_NEPHRECTOMY, http: 409, condition: "Operation forbidden after donor surgery_state == NEPHRECTOMY_DONE" }
  - { id: ERR_RECIPIENT_NOT_LISTED, http: 409, condition: "Recipient medical_status != LISTED for an operation requiring listing" }
  - { id: ERR_RECIPIENT_NOT_COMMITTED, http: 409, condition: "Recipient chain_participation_state != COMMITTED at transplant completion" }
  - { id: ERR_ORGAN_NOT_READY, http: 409, condition: "Source MatchOffer offer_state != DONOR_SURGERY_DONE at shipment departure" }
  - { id: ERR_ORGAN_NOT_ARRIVED, http: 409, condition: "MatchOffer offer_state != ORGAN_SHIPPED or shipment not DELIVERED at transplant completion" }
  - { id: ERR_COLD_ISCHEMIA_VIOLATION, http: 409, condition: "cold_ischemia_hours_actual > cold_ischemia_max_hours at delivery (transplant completion forbidden)" }
  - { id: ERR_REVIEW_DEADLINE_PASSED, http: 409, condition: "Logical clock past crossmatch_deadline_utc or center_accept_deadline_utc" }
  - { id: ERR_SLOT_TAKEN, http: 409, condition: "Slot is not OPEN at reservation time" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "Slot interval overlaps an existing RESERVED/CONSUMED slot at same center (half-open [start,end) semantics)" }
  - { id: ERR_SLOT_TOO_SOON, http: 409, condition: "Slot start is before logical clock + MIN_SCHEDULE_LEAD_HOURS" }
  - { id: ERR_FLIGHT_ALREADY_DEPARTED, http: 409, condition: "Itinerary cancel attempted at or after depart_utc, OR reimburse attempted before arrive_utc" }
  - { id: ERR_PAIR_NOT_INCOMPATIBLE, http: 409, condition: "Pair is ABO-compatible AND not antigen-sensitized AND no compatible-pair opt-in" }
  - { id: ERR_POOL_TOO_SMALL, http: 409, condition: "Chain run candidate_pool_size < MIN_POOL_SIZE" }
  - { id: ERR_CHAIN_LOCKED, http: 409, condition: "Chain or run cannot be mutated because a chain is in LOCKED or later state" }
  - { id: ERR_PENDING_OFFERS, http: 409, condition: "Chain lock attempted while some MatchOffer is not yet CENTER_ACCEPTED" }
  - { id: ERR_RECONSTRUCTION_NOT_VIABLE, http: 409, condition: "Chain break reconstruction attempted without a viable replacement chain run" }
  - { id: ERR_NO_PROTECTION_POLICY, http: 409, condition: "Donor has no DonorProtectionPolicy (pre-nephrectomy) but protection-scoped action attempted" }
  - { id: ERR_CLAIM_EXCEEDS_CAP, http: 409, condition: "Claim approval would exceed bucket headroom and full approval was requested (use partial-approve or deny)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same user attempted to submit and adjudicate the same claim" }
  - { id: ERR_REVIEW_POLICY_VIOLATION, http: 409, condition: "Crossmatch review fields violate center policy (e.g., INDETERMINATE result with MFI below floor)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RegistryAdmin
    description: "National registry staff; oversees centers, claims adjudication, policy management, outcome attribution, appeals"
    identity: "opaque"
    exclusive_operations:
      - "POST /nkr/centers"
      - "POST /nkr/centers/{center_id}/probate"
      - "POST /nkr/centers/{center_id}/suspend"
      - "POST /nkr/centers/{center_id}/reinstate"
      - "POST /nkr/claims/{claim_id}/start-review"
      - "POST /nkr/claims/{claim_id}/approve"
      - "POST /nkr/claims/{claim_id}/partial-approve"
      - "POST /nkr/claims/{claim_id}/deny"
      - "POST /nkr/claims/{claim_id}/pay"
      - "POST /nkr/itineraries/{itinerary_id}/reimburse"
      - "POST /nkr/outcomes/{outcome_id}/attribute"
      - "POST /nkr/outcomes/{outcome_id}/resolve-appeal"
      - "POST /nkr/outcomes/{outcome_id}/finalize"
    shared_operations:
      - "GET endpoints across all resources"
      - "POST /nkr/_clock/set_current_utc"

  - name: MatchOperator
    description: "Chain-construction and scheduling operator; runs chain batch jobs, locks, schedules, starts, supersedes runs"
    identity: "opaque"
    exclusive_operations:
      - "POST /nkr/chain-runs"
      - "POST /nkr/chain-runs/{run_id}/execute"
      - "POST /nkr/chain-runs/{run_id}/publish"
      - "POST /nkr/chain-runs/{run_id}/supersede"
      - "POST /nkr/chains/{chain_id}/lock"
      - "POST /nkr/chains/{chain_id}/schedule"
      - "POST /nkr/chains/{chain_id}/start-execution"
      - "POST /nkr/slots/{slot_id}/release"
      - "POST /nkr/chain-breaks/{event_id}/reconstruct"
    shared_operations:
      - "GET endpoints across all resources"
      - "POST /nkr/_clock/set_current_utc"

  - name: CenterCoordinator
    description: "Coordinator at a specific transplant center; registers donors/recipients, performs medical transitions, crossmatch review, center acceptance, surgery completion"
    identity: "entity_backed:TransplantCenter"
    exclusive_operations:
      - "POST /nkr/donors"
      - "POST /nkr/recipients"
      - "POST /nkr/pairs"
      - "POST /nkr/pairs/{pair_id}/verify"
      - "POST /nkr/pairs/{pair_id}/enter-pool"
      - "POST /nkr/pairs/{pair_id}/dissolve"
      - "POST /nkr/donors/{donor_id}/medical-hold"
      - "POST /nkr/donors/{donor_id}/medical-release"
      - "POST /nkr/donors/{donor_id}/withdraw"
      - "POST /nkr/donors/{donor_id}/deceased"
      - "POST /nkr/donors/{donor_id}/complete-nephrectomy"
      - "POST /nkr/donors/{donor_id}/fail-preop"
      - "POST /nkr/recipients/{recipient_id}/medical-hold"
      - "POST /nkr/recipients/{recipient_id}/medical-release"
      - "POST /nkr/recipients/{recipient_id}/withdraw"
      - "POST /nkr/recipients/{recipient_id}/deceased"
      - "POST /nkr/recipients/{recipient_id}/complete-transplant"
      - "POST /nkr/match-offers/{offer_id}/crossmatch-review"
      - "POST /nkr/match-offers/{offer_id}/center-accept"
      - "POST /nkr/match-offers/{offer_id}/center-decline"
      - "POST /nkr/slots"
      - "POST /nkr/outcomes"
      - "POST /nkr/outcomes/{outcome_id}/appeal"
      - "POST /nkr/donors/{donor_id}/claims"
    shared_operations:
      - "GET endpoints across all resources"

  - name: LogisticsCoordinator
    description: "National logistics staff; plans shipments, itineraries, marks departures/delays/reroutes/deliveries/cancellations"
    identity: "opaque"
    exclusive_operations:
      - "POST /nkr/shipments"
      - "POST /nkr/shipments/{shipment_id}/depart"
      - "POST /nkr/shipments/{shipment_id}/delay"
      - "POST /nkr/shipments/{shipment_id}/reroute"
      - "POST /nkr/shipments/{shipment_id}/deliver"
      - "POST /nkr/shipments/{shipment_id}/cancel"
      - "POST /nkr/itineraries"
      - "POST /nkr/itineraries/{itinerary_id}/confirm"
      - "POST /nkr/itineraries/{itinerary_id}/cancel"
    shared_operations:
      - "GET endpoints across all resources"
