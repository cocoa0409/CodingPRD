  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_post_then_refund_conserves_account_balance_zero
        grounds:
          - state_machines.Deposit.HELD_to_REFUNDED
          - state_machines.ServiceAgreement.ACTIVE_to_CANCELLED
          - entities.Account.fields.balance_cents
          - entities.Account.fields.deposit_held_cents
        distinguishing_aspect: "Conserved quantity = Account ledger (balance_cents and deposit_held_cents in cents). Forward (post deposit 9000: +9000 debit, held 9000) paired with compensating (cancel -> refund: -9000 credit, held 0) leaves balance_cents == 0 and deposit_held_cents == 0 (named invariant: sum(LedgerEntry.signed_amount_cents)==0)."
        test_recipe:
          setup:
            - "Active agreement with one HELD deposit 9000."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { company_name: "Maple", contact_email: "maple4@x.com", region_code: "EAST" }
              as: Billing
              captures: { acct: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct}", address_line: "9 Tall St", pane_count: 80, glass_sqft: 100.0, stories: 4, soft_wash_sqft: 400.0 }
              as: Billing
              captures: { prop: $.data.id }
            - call: "POST /quotes"
              payload: { account_id: "${acct}", property_id: "${prop}", pricing_basis: "PANE_COUNT", addon_codes: ["SOFT_WASH"], valid_until: "2026-12-31T00:00:00Z" }
              as: Billing
              captures: { q: $.data.id }
            - call: "POST /quotes/${q}/send"
              payload: {}
              as: Billing
            - call: "POST /quotes/${q}/accept"
              payload: {}
              as: Customer
              as_user_id: "${acct}"
            - call: "POST /service-agreements"
              payload: { quote_id: "${q}", schedule_kind: "ONE_TIME" }
              as: Billing
              captures: { agr: $.data.id }
            - call: "POST /deposits"
              payload: { account_id: "${acct}", agreement_id: "${agr}", amount_cents: 9000 }
              as: Billing
              captures: { dep: $.data.id }
            - call: "POST /service-agreements/${agr}/activate"
              payload: { first_visit_planned_date: "2026-07-01", first_visit_window_start_min: 540, first_visit_window_end_min: 660 }
              as: Billing
            - call: "GET /accounts/${acct}"
              payload: {}
              as: Billing
              captures: { bal_pre: $.data.balance_cents }
          trigger:
            - call: "POST /service-agreements/${agr}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${acct}"
            - call: "GET /accounts/${acct}"
              payload: {}
              as: Billing
              captures: { bal_post: $.data.balance_cents, held_post: $.data.deposit_held_cents }
          assert:
            - "Account.${acct}.balance_cents == 0"
            - "Account.${acct}.deposit_held_cents == 0"
            - "Deposit.${dep}.status == REFUNDED"

      - name: visit_commit_then_weather_reschedule_conserves_route_minutes
        grounds:
