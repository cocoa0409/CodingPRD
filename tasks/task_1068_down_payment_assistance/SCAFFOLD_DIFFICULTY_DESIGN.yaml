      - name: assistance_principal_conserved_on_servicing_close
        grounds:
          - state_machines.ServicingAccount.IN_SALE_to_CLOSED
          - calculations.recapture_amount
          - entities.Award.fields.original_disbursed_cents
          - entities.ServicingAccount.fields.forgiven_amount_cents
