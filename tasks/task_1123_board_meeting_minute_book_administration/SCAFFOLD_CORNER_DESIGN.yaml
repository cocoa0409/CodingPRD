# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 1123: Board Meeting & Minute Book Administration
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: corporation_creation_applies_defaults
        claim_type: creation
        grounds: [entities.Corporation]
        distinguishing_aspect: "POST /corporations returns 201 with server-minted id, version=1, active_director_count=0, current_bylaws_id null."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /corporations"
              payload: { name: "Corp E1", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id }
          assert:
            - "Corporation.${corp}.version == 1"
            - "Corporation.${corp}.active_director_count == 0"
            - "Corporation.${corp}.current_bylaws_id is null"
            - "Corporation.${corp}.created_at == 2026-05-01T00:00:00Z   # default logical clock"

      - name: director_missing_required_field_returns_validation
        claim_type: required_fields
        grounds: [entities.Director.fields.email, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required input email yields ERR_VALIDATION (400); no row created."
        test_recipe:
          setup: ["Corporation exists"]
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp E2", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id }
          trigger:
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "NoMail", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"
            - "GET /directors?corporation_id=${corp} total_count == 0"

      - name: meeting_invalid_enum_returns_validation
        claim_type: type_constraints
        grounds: [entities.Meeting.fields.meeting_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "meeting_type outside {REGULAR, SPECIAL, ANNUAL} is rejected with ERR_VALIDATION before any calendar check."
        test_recipe:
          setup: ["Corporation exists with 1 ACTIVE director as prospective chair"]
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp E3", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id }
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D1", email: "d1@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /meetings"
              payload: { corporation_id: "${corp}", meeting_type: "EMERGENCY", scheduled_start: "2026-06-20T10:00:00Z", duration_minutes: 60, location_or_medium: "Boardroom", chair_director_id: "${d1}" }
              as: CorporateSecretary
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"

      - name: get_nonexistent_director_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET on a well-formed but unknown UUID yields 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /directors/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: CorporateSecretary
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND and http status 404"

      - name: committee_computed_member_count_correct
        claim_type: computed_fields
        grounds: [entities.Committee.fields.active_member_count, entities.Committee.fields.chair_vacant]
        distinguishing_aspect: "Derived counters reflect mutations immediately: 0 after create, 2 after two adds, chair_vacant false once a CHAIR membership exists."
        test_recipe:
          setup: ["Corporation, 2 ACTIVE directors"]
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp E5", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id }
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D1", email: "d1@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d1: $.data.id }
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D2", email: "d2@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d2: $.data.id }
            - call: "POST /committees"
              payload: { corporation_id: "${corp}", name: "Audit", committee_type: "NOMINATING", charter_text: "c", quorum_fixed_count: 1 }
              as: CorporateSecretary
              captures: { cm: $.data.id }
          trigger:
            - call: "POST /committee_memberships"
              payload: { committee_id: "${cm}", director_id: "${d1}", committee_role: "CHAIR", term_start: "2026-02-01T00:00:00Z", term_end: "2028-02-01T00:00:00Z" }
              as: CorporateSecretary
            - call: "POST /committee_memberships"
              payload: { committee_id: "${cm}", director_id: "${d2}", committee_role: "MEMBER", term_start: "2026-02-01T00:00:00Z", term_end: "2028-02-01T00:00:00Z" }
              as: CorporateSecretary
          assert:
            - "Committee.${cm}.active_member_count == 2"
            - "Committee.${cm}.chair_vacant == false"
            - "Committee.${cm}.status == CHARTER_DRAFT   # membership add does not activate the charter"

      - name: director_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Director]
        distinguishing_aspect: "Client-supplied id/version/created_at in the create payload are ignored; server mints id and version=1."
        test_recipe:
          setup: ["Corporation exists"]
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp E6", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id }
          trigger:
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "Spoofer", email: "sp@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z", id: "11111111-2222-3333-4444-555555555555", version: 99, status: "RESIGNED" }
              as: CorporateSecretary
              captures: { d: $.data.id }
          assert:
            - "Director.${d}.id != 11111111-2222-3333-4444-555555555555"
            - "Director.${d}.version == 1"
            - "Director.${d}.status == ACTIVE   # client-supplied lifecycle field ignored"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: initial_states_on_creation
        claim_type: initial_state
        grounds: [state_machines.Meeting, state_machines.Resolution, state_machines.Bylaws, state_machines.Committee]
        distinguishing_aspect: "New rows start in their declared initial states: Bylaws DRAFT, Meeting SCHEDULED, Resolution DRAFT, Committee CHARTER_DRAFT."
        test_recipe:
          setup: ["Corporation with ADOPTED bylaws and 1 ACTIVE director D1"]
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp S1", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id, corpv: $.data.version }
            - call: "POST /bylaws"
              payload: { corporation_id: "${corp}", notice_days_regular: 10, notice_days_special: 3, package_lead_days: 5, quorum_percent: 60, quorum_fixed_count: 1, consent_window_days: 10, consent_unanimity_required: true, minute_retention_years: 5, rotation_max_years: 6, board_seat_count: 15 }
              as: CorporateSecretary
              captures: { by: $.data.id }
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D1", email: "d1@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d1: $.data.id }
            - call: "POST /committees"
              payload: { corporation_id: "${corp}", name: "C", committee_type: "SPECIAL", charter_text: "c", quorum_fixed_count: 1 }
              as: CorporateSecretary
              captures: { cm: $.data.id }
            - call: "POST /meetings"
              payload: { corporation_id: "${corp}", meeting_type: "REGULAR", scheduled_start: "2026-06-20T10:00:00Z", duration_minutes: 60, location_or_medium: "Boardroom", chair_director_id: "${d1}" }
              as: CorporateSecretary
              captures: { m: $.data.id }
            - call: "POST /resolutions"
              payload: { corporation_id: "${corp}", meeting_id: "${m}", origin: "MEETING", resolution_type: "ORDINARY", title: "R", text: "t" }
              as: CorporateSecretary
              captures: { r: $.data.id }
          trigger:
            - call: "GET /resolutions/${r}"
              as: CorporateSecretary
          assert:
            - "Bylaws.${by}.status == DRAFT   # never adopted in this instance"
            - "Meeting.${m}.status == SCHEDULED"
            - "Resolution.${r}.status == DRAFT"
            - "Committee.${cm}.status == CHARTER_DRAFT"

      - name: waive_already_waived_notice_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.MeetingNotice, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "WAIVED is terminal: a second waive of the same notice fails with ERR_INVALID_STATE_TRANSITION and waived_at is unchanged."
        test_recipe:
          setup: ["Corporation, ADOPTED bylaws, 1 ACTIVE director D1 (chair), meeting NOTICED (D1's notice SENT)"]
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp S2", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id, corpv: $.data.version }
            - call: "POST /bylaws"
              payload: { corporation_id: "${corp}", notice_days_regular: 10, notice_days_special: 3, package_lead_days: 5, quorum_percent: 60, quorum_fixed_count: 1, consent_window_days: 10, consent_unanimity_required: true, minute_retention_years: 5, rotation_max_years: 6, board_seat_count: 15 }
              as: CorporateSecretary
              captures: { by: $.data.id }
            - call: "POST /bylaws/${by}/adopt"
              payload: { expected_corporation_version: "${corpv}" }
              as: CorporateSecretary
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D1", email: "d1@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d1: $.data.id }
            - call: "POST /meetings"
              payload: { corporation_id: "${corp}", meeting_type: "REGULAR", scheduled_start: "2026-06-20T10:00:00Z", duration_minutes: 60, location_or_medium: "Boardroom", chair_director_id: "${d1}" }
              as: CorporateSecretary
              captures: { m: $.data.id }
            - call: "POST /meetings/${m}/send_notices"
              as: CorporateSecretary
            - call: "GET /meeting_notices"
              payload: { meeting_id: "${m}" }
              as: CorporateSecretary
              captures: { n: "$.data[0].id" }
            - call: "POST /meeting_notices/${n}/waive"
              as: Director
              as_user_id: "${d1}"
          trigger:
            - call: "POST /meeting_notices/${n}/waive"
              as: Director
              as_user_id: "${d1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION"
            - "MeetingNotice.${n}.status == WAIVED"

      - name: approve_minutes_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Minutes.DRAFT_to_CIRCULATED_FOR_REVIEW, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Approving minutes still in DRAFT (circulate step skipped) fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Meeting ADJOURNED with auto-created Minutes in DRAFT; D1 chair"]
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp S3", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id, corpv: $.data.version }
            - call: "POST /bylaws"
              payload: { corporation_id: "${corp}", notice_days_regular: 10, notice_days_special: 3, package_lead_days: 5, quorum_percent: 60, quorum_fixed_count: 1, consent_window_days: 10, consent_unanimity_required: true, minute_retention_years: 5, rotation_max_years: 6, board_seat_count: 15 }
              as: CorporateSecretary
              captures: { by: $.data.id }
            - call: "POST /bylaws/${by}/adopt"
              payload: { expected_corporation_version: "${corpv}" }
              as: CorporateSecretary
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D1", email: "d1@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d1: $.data.id }
            - call: "POST /meetings"
              payload: { corporation_id: "${corp}", meeting_type: "REGULAR", scheduled_start: "2026-06-20T10:00:00Z", duration_minutes: 60, location_or_medium: "Boardroom", chair_director_id: "${d1}" }
              as: CorporateSecretary
              captures: { m: $.data.id }
            - call: "POST /meetings/${m}/send_notices"
              as: CorporateSecretary
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T10:00:00Z" }
              as: CorporateSecretary
            - call: "POST /meetings/${m}/convene"
              as: BoardChair
              as_user_id: "${d1}"
            - call: "POST /meetings/${m}/adjourn"
              as: BoardChair
              as_user_id: "${d1}"
            - call: "GET /minutes"
              payload: { meeting_id: "${m}" }
              as: CorporateSecretary
              captures: { mn: "$.data[0].id" }
          trigger:
            - call: "POST /minutes/${mn}/approve"
              as: BoardChair
              as_user_id: "${d1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION"
            - "Minutes.${mn}.status == DRAFT"

      - name: adjourn_auto_creates_minutes_draft
        claim_type: side_effect_execution
        grounds: [state_machines.Meeting.IN_SESSION_to_ADJOURNED, entities.Minutes.fields.meeting_id]
        distinguishing_aspect: "Adjourn's side effect materializes exactly one Minutes row in DRAFT with empty content, addressable via GET /minutes?meeting_id."
        test_recipe:
          setup: ["Meeting IN_SESSION (1 director chair, notices sent, clock at start)"]
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp S4", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id, corpv: $.data.version }
            - call: "POST /bylaws"
              payload: { corporation_id: "${corp}", notice_days_regular: 10, notice_days_special: 3, package_lead_days: 5, quorum_percent: 60, quorum_fixed_count: 1, consent_window_days: 10, consent_unanimity_required: true, minute_retention_years: 5, rotation_max_years: 6, board_seat_count: 15 }
              as: CorporateSecretary
              captures: { by: $.data.id }
            - call: "POST /bylaws/${by}/adopt"
              payload: { expected_corporation_version: "${corpv}" }
              as: CorporateSecretary
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D1", email: "d1@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d1: $.data.id }
            - call: "POST /meetings"
              payload: { corporation_id: "${corp}", meeting_type: "REGULAR", scheduled_start: "2026-06-20T10:00:00Z", duration_minutes: 60, location_or_medium: "Boardroom", chair_director_id: "${d1}" }
              as: CorporateSecretary
              captures: { m: $.data.id }
            - call: "POST /meetings/${m}/send_notices"
              as: CorporateSecretary
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T10:00:00Z" }
              as: CorporateSecretary
            - call: "POST /meetings/${m}/convene"
              as: BoardChair
              as_user_id: "${d1}"
          trigger:
            - call: "POST /meetings/${m}/adjourn"
              as: BoardChair
              as_user_id: "${d1}"
            - call: "GET /minutes"
              payload: { meeting_id: "${m}" }
              as: CorporateSecretary
              captures: { mn: "$.data[0].id" }
          assert:
            - "GET /minutes?meeting_id=${m} total_count == 1"
            - "Minutes.${mn}.status == DRAFT and Minutes.${mn}.content == ''"
            - "Minutes.${mn}.corporation_id == ${corp}"

      - name: committee_dissolve_ends_memberships
        claim_type: side_effect_execution
        grounds: [state_machines.Committee.CHARTER_DRAFT_to_DISSOLVED, state_machines.CommitteeMembership.ACTIVE_to_ENDED]
        distinguishing_aspect: "Cascade-down: dissolving a committee ends all ACTIVE memberships with ended_reason COMMITTEE_DISSOLVED."
        test_recipe:
          setup: ["Corporation, 1 ACTIVE director D1, committee ACTIVE with D1 MEMBER"]
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp S5", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id }
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D1", email: "d1@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d1: $.data.id }
            - call: "POST /committees"
              payload: { corporation_id: "${corp}", name: "C", committee_type: "SPECIAL", charter_text: "c", quorum_fixed_count: 1 }
              as: CorporateSecretary
              captures: { cm: $.data.id }
            - call: "POST /committees/${cm}/activate"
              as: CorporateSecretary
            - call: "POST /committee_memberships"
              payload: { committee_id: "${cm}", director_id: "${d1}", committee_role: "MEMBER", term_start: "2026-02-01T00:00:00Z", term_end: "2028-02-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { mb: $.data.id }
          trigger:
            - call: "POST /committees/${cm}/dissolve"
              as: CorporateSecretary
          assert:
            - "Committee.${cm}.status == DISSOLVED"
            - "CommitteeMembership.${mb}.status == ENDED and ended_reason == COMMITTEE_DISSOLVED"
            - "Committee.${cm}.active_member_count == 0"

      - name: circulate_consent_without_adopted_bylaws_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Resolution.DRAFT_to_CIRCULATING, "errors[ERR_NO_ADOPTED_BYLAWS]"]
        distinguishing_aspect: "Guarded transition across (Resolution, Bylaws): circulation requires an ADOPTED bylaws; with only a DRAFT bylaws the transition is rejected."
        test_recipe:
          setup: ["Corporation with bylaws left in DRAFT (never adopted); WRITTEN_CONSENT resolution drafted"]
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp S6", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id }
            - call: "POST /bylaws"
              payload: { corporation_id: "${corp}", notice_days_regular: 10, notice_days_special: 3, package_lead_days: 5, quorum_percent: 60, quorum_fixed_count: 1, consent_window_days: 10, consent_unanimity_required: true, minute_retention_years: 5, rotation_max_years: 6, board_seat_count: 15 }
              as: CorporateSecretary
            - call: "POST /resolutions"
              payload: { corporation_id: "${corp}", origin: "WRITTEN_CONSENT", resolution_type: "ORDINARY", title: "R", text: "t" }
              as: CorporateSecretary
              captures: { r: $.data.id }
          trigger:
            - call: "POST /resolutions/${r}/circulate_consent"
              as: CorporateSecretary
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NO_ADOPTED_BYLAWS"
            - "Resolution.${r}.status == DRAFT"

      - name: error_resolution_cycle_already_covered
        claim_type: invalid_transition
        grounds: [state_machines.Resolution.REJECTED_to_DRAFT]
        excluded_because:
          difficulty_instance: resolution_reject_redraft_cycle
          rationale: "The redraft cycle and its ballot-voiding side effects are asserted end-to-end by the named §1.8 instance."

      - name: error_minutes_loop_already_covered
        claim_type: invalid_transition
        grounds: [state_machines.Minutes.CIRCULATED_FOR_REVIEW_to_REJECTED]
        excluded_because:
          difficulty_instance: minutes_review_rejection_loop
          rationale: "The CIRCULATED -> REJECTED -> DRAFT -> CIRCULATED loop is asserted by the named §1.8 instance."

      - name: error_package_unseal_already_covered
        claim_type: invalid_transition
        grounds: [state_machines.BoardPackage.SEALED_to_ASSEMBLING]
        excluded_because:
          difficulty_instance: package_seal_unseal_cycle
          rationale: "Seal/unseal cycling with seal_count accumulation is asserted by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: quorum_fixed_floor_overrides_percent
        claim_type: constants_applied
        grounds: [calculations.quorum_determination]
        distinguishing_aspect: "The max() floor branch: quorum_percent=50 over 4 ACTIVE directors gives ceil(2.0)=2, but quorum_fixed_count=4 forces required=4; 3 present still fails quorum."
        test_recipe:
          setup:
            - "Corporation, ADOPTED bylaws (quorum_percent=50, quorum_fixed_count=4), 4 ACTIVE directors (D1 chair)"
            - "Meeting NOTICED; 3 of 4 recorded IN_PERSON; clock at scheduled start"
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp C1", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id, corpv: $.data.version }
            - call: "POST /bylaws"
              payload: { corporation_id: "${corp}", notice_days_regular: 10, notice_days_special: 3, package_lead_days: 5, quorum_percent: 50, quorum_fixed_count: 4, consent_window_days: 10, consent_unanimity_required: true, minute_retention_years: 5, rotation_max_years: 6, board_seat_count: 15 }
              as: CorporateSecretary
              captures: { by: $.data.id }
            - call: "POST /bylaws/${by}/adopt"
              payload: { expected_corporation_version: "${corpv}" }
              as: CorporateSecretary
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D1", email: "d1@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d1: $.data.id }
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D2", email: "d2@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d2: $.data.id }
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D3", email: "d3@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d3: $.data.id }
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D4", email: "d4@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
            - call: "POST /meetings"
