# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_2942_structured_cabling_low_voltage_contracting
#
# Breadth probe over the nine sections of references/claim-extraction-guide.md.
# Every `grounds` entry resolves into SCAFFOLD.yaml §1.1-§1.7; every instance
# name is unique across this file and SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# Corners already asserted by a §1.8 instance are emitted as
# `excluded_because:` stubs naming that instance.
# The logical clock starts at 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: create_project_with_required_fields_returns_full_entity
        claim_type: creation
        grounds:
          - entities.CablingProject
          - endpoints["POST /cabling/projects"]
        distinguishing_aspect: "A create with only the four required inputs returns 201 and every declared CablingProject field, including the computed roll-up fields at their zero values."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
          assert:
            - "the response status is 201 and data.name == \"Riverside Tower Cabling\" and data.site_code == \"RVT1\""
            - "data.plenum_ceiling == true and data.identifier_scheme == \"TIA_606_CLASS_1\""
            - "data.occupancy_status == \"PRE_OCCUPANCY\" and data.warranty_status == \"NOT_ELIGIBLE\""
            - "data.total_link_count == 0, data.certified_link_count == 0, data.failed_link_count == 0 and data.as_built_cost_cents == 0"
            - "data.completeness_pct_strict == 0.00, data.completeness_pct_provisional == 0.00 and data.consumed_mac_cents == 0"
            - "the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == \"object\""

      - name: get_cable_type_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.CableType
          - endpoints["GET /cabling/cable-types/{cable_type_id}"]
        distinguishing_aspect: "A detail GET echoes the stored CableType including its computed cross_section_area_sq_mm of 49.02 sq mm for a 7.9 mm cable."
        test_recipe:
          setup: ["One CAT6A CMP cable type of outer_diameter_mm 7.9"]
          setup_api_calls:
            - call: "POST /cabling/cable-types"
              payload: { category: "CAT6A", jacket_rating: "CMP", outer_diameter_mm: 7.9, max_channel_length_m: 100.0, shielded: false, cost_per_meter_cents: 150, applications: ["DATA_HORIZONTAL"] }
              as: DesignEngineer
              captures: { ct: $.data.id }
          trigger:
            - call: "GET /cabling/cable-types/${ct}"
              payload: {}
              as: DesignEngineer
          assert:
            - "the response status is 200 and data.id == ${ct}"
            - "data.category == \"CAT6A\", data.jacket_rating == \"CMP\" and data.outer_diameter_mm == 7.9"
            - "data.cross_section_area_sq_mm == 49.02 and data.cost_per_meter_cents == 150"
            - "data.applications == [\"DATA_HORIZONTAL\"] and data.shielded == false"

      - name: list_links_filtered_by_project_returns_paginated_envelope
        claim_type: listing
        grounds:
          - endpoints["GET /cabling/links"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "The list endpoint returns limit, offset, total_count and has_more alongside the array; with three links and limit 2 the first page has_more is true and the second page has_more is false."
        test_recipe:
          setup: ["One project with three DESIGNED links TR01-A01, TR01-A02 and TR01-A03"]
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
            - call: "POST /cabling/telecom-rooms"
              payload: { project_id: "${proj}", room_code: "TR01", floor: 3, branch_circuit_amps: 20, ups_capacity_va: 3000 }
              as: ProjectManager
              captures: { room: $.data.id }
            - call: "POST /cabling/cable-types"
              payload: { category: "CAT6A", jacket_rating: "CMP", outer_diameter_mm: 7.9, max_channel_length_m: 100.0, shielded: false, cost_per_meter_cents: 150, applications: ["DATA_HORIZONTAL"] }
              as: DesignEngineer
              captures: { ct: $.data.id }
            - call: "POST /cabling/links"
              payload: { project_id: "${proj}", telecom_room_id: "${room}", cable_type_id: "${ct}", identifier: "TR01-A01", application: "DATA_HORIZONTAL", horizontal_length_m: 40.00 }
              as: DesignEngineer
            - call: "POST /cabling/links"
              payload: { project_id: "${proj}", telecom_room_id: "${room}", cable_type_id: "${ct}", identifier: "TR01-A02", application: "DATA_HORIZONTAL", horizontal_length_m: 41.00 }
              as: DesignEngineer
            - call: "POST /cabling/links"
              payload: { project_id: "${proj}", telecom_room_id: "${room}", cable_type_id: "${ct}", identifier: "TR01-A03", application: "DATA_HORIZONTAL", horizontal_length_m: 42.00 }
              as: DesignEngineer
          trigger:
            - call: "GET /cabling/links"
              payload: { project_id: "${proj}", limit: 2, offset: 0 }
              as: DesignEngineer
            - call: "GET /cabling/links"
              payload: { project_id: "${proj}", limit: 2, offset: 2 }
              as: DesignEngineer
          assert:
            - "the first page returns response_type == \"array\", total_count == 3, limit == 2, offset == 0, has_more == true and exactly 2 rows"
            - "the second page returns total_count == 3, limit == 2, offset == 2, has_more == false and exactly 1 row"
            - "every returned row has project_id == ${proj} and install_state == \"DESIGNED\""

      - name: the_design_side_collections_answer_their_reverse_reachability_reads
        claim_type: listing
        grounds:
          - endpoints["GET /cabling/projects"]
          - endpoints["GET /cabling/telecom-rooms"]
          - endpoints["GET /cabling/racks"]
          - endpoints["GET /cabling/rack-unit-assignments"]
          - endpoints["GET /cabling/pathway-segments"]
          - complexity_profile.entity_topology
        distinguishing_aspect: "Every design-side collection is reachable through the foreign key it declares as a filter — projects by site_code, rooms by project_id, racks by telecom_room_id, assignments by rack_id plus assignment_state, segments by project_id plus pathway_type — and each listed row already carries its derived ledger fields rather than a bare identifier."
        test_recipe:
          setup:
            - "Project RVT1 with room TR01 (UPS 3000 VA), rack A of 42 RU and one ACTIVE assignment on units 40..42 drawing 1200 VA"
            - "One SERVICEABLE CABLE_TRAY pathway segment PS-A with no routes on it"
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
            - call: "POST /cabling/telecom-rooms"
              payload: { project_id: "${proj}", room_code: "TR01", floor: 3, branch_circuit_amps: 20, ups_capacity_va: 3000 }
              as: ProjectManager
              captures: { room: $.data.id }
            - call: "POST /cabling/racks"
              payload: { telecom_room_id: "${room}", rack_code: "A", total_ru: 42 }
              as: DesignEngineer
              captures: { rack: $.data.id, rack_v1: $.data.version }
            - call: "POST /cabling/rack-unit-assignments"
              payload: { rack_id: "${rack}", equipment_label: "48-port patch panel", start_ru: 40, end_ru: 42, power_va: 1200, expected_rack_version: "${rack_v1}" }
              as: DesignEngineer
              captures: { assign: $.data.id }
            - call: "POST /cabling/pathway-segments"
              payload: { project_id: "${proj}", segment_code: "PS-A", pathway_type: "CABLE_TRAY", usable_area_sq_mm: 20000.0, length_m: 40.0, bend_count: 0, in_plenum_space: true, shared_with_power: false, power_separation_mm: 0 }
              as: DesignEngineer
              captures: { seg_a: $.data.id }
          trigger:
            - call: "GET /cabling/projects"
              payload: { site_code: "RVT1", limit: 10, offset: 0 }
              as: ProjectManager
            - call: "GET /cabling/telecom-rooms"
              payload: { project_id: "${proj}", limit: 10, offset: 0 }
              as: ProjectManager
            - call: "GET /cabling/telecom-rooms/${room}"
              payload: {}
              as: ProjectManager
            - call: "GET /cabling/racks"
              payload: { telecom_room_id: "${room}", limit: 10, offset: 0 }
              as: ProjectManager
            - call: "GET /cabling/rack-unit-assignments"
              payload: { rack_id: "${rack}", assignment_state: "ACTIVE", limit: 10, offset: 0 }
              as: ProjectManager
            - call: "GET /cabling/pathway-segments"
              payload: { project_id: "${proj}", pathway_type: "CABLE_TRAY", limit: 10, offset: 0 }
              as: ProjectManager
          assert:
            - "every one of the six reads returns 200; the five collection reads return response_type == \"array\" with total_count == 1, has_more == false and exactly one row"
            - "the project row has site_code == \"RVT1\", occupancy_status == \"PRE_OCCUPANCY\" and total_link_count == 0"
            - "the telecom-room row and the telecom-room detail read agree: power_load_va == 1200, power_headroom_va == 1800, room_state == \"ROUGH_IN\" and grounding_status == \"UNVERIFIED\""
            - "the rack row has total_ru == 42, occupied_ru == 3, available_ru == 39 and power_draw_va == 1200"
            - "the assignment row has id == ${assign}, span_ru == 3, assignment_state == \"ACTIVE\" and released_reason == null"
            - "the pathway-segment row has id == ${seg_a}, pathway_depth == 0, occupying_route_count == 0, fill_area_used_sq_mm == 0, allowed_fill_pct == 50 and pathway_state == \"SERVICEABLE\""

      - name: the_downstream_collections_are_reachable_after_the_link_is_certified
        claim_type: listing
        grounds:
          - endpoints["GET /cabling/link-routes"]
          - endpoints["GET /cabling/test-results"]
          - endpoints["GET /cabling/warranty-registrations"]
          - endpoints["GET /cabling/mac-tickets"]
          - endpoints["GET /cabling/trade-coordinations"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "After one link has run the full route-pull-terminate-label-record-test-certify chain and the occupied project has raised one moves-adds-changes ticket, each downstream collection lists exactly its own row in the state that chain left it in, filtered by the foreign key it declares."
        test_recipe:
          setup:
            - "Project RVT1 with one CERTIFIED link TR01-A01 routed through CABLE_TRAY segment PS-A"
            - "A READY WarrantyRegistration under STANDARD_15Y, a RELEASED CEILING coordination and one SUBMITTED MAC ticket"
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
            - call: "POST /cabling/telecom-rooms"
              payload: { project_id: "${proj}", room_code: "TR01", floor: 3, branch_circuit_amps: 20, ups_capacity_va: 3000 }
              as: ProjectManager
              captures: { room: $.data.id }
            - call: "POST /cabling/telecom-rooms/${room}/grounding-verification"
              payload: { tgb_installed: true, bonding_conductor_awg: 6, ground_resistance_milliohms: 5000 }
              as: ProjectManager
            - call: "POST /cabling/cable-types"
              payload: { category: "CAT6A", jacket_rating: "CMP", outer_diameter_mm: 7.9, max_channel_length_m: 100.0, shielded: false, cost_per_meter_cents: 150, applications: ["DATA_HORIZONTAL"] }
              as: DesignEngineer
              captures: { ct: $.data.id }
            - call: "POST /cabling/pathway-segments"
              payload: { project_id: "${proj}", segment_code: "PS-A", pathway_type: "CABLE_TRAY", usable_area_sq_mm: 20000.0, length_m: 40.0, bend_count: 0, in_plenum_space: true, shared_with_power: false, power_separation_mm: 0 }
              as: DesignEngineer
              captures: { seg_a: $.data.id, seg_a_v1: $.data.version }
            - call: "POST /cabling/trade-coordinations"
              payload: { project_id: "${proj}", trade: "CEILING", milestone: "PATHWAY_ROUGH_IN" }
              as: ProjectManager
              captures: { coord: $.data.id }
            - call: "POST /cabling/trade-coordinations/${coord}/confirm"
              payload: { confirmed_date: "2026-08-05" }
              as: ProjectManager
            - call: "POST /cabling/warranty-registrations"
              payload: { project_id: "${proj}", manufacturer_program: "STANDARD_15Y" }
              as: ProjectManager
              captures: { reg: $.data.id }
            - call: "POST /cabling/links"
              payload: { project_id: "${proj}", telecom_room_id: "${room}", cable_type_id: "${ct}", identifier: "TR01-A01", application: "DATA_HORIZONTAL", horizontal_length_m: 40.00, consolidation_point_stub_m: 0, patch_cord_allowance_m: 2.00 }
              as: DesignEngineer
              captures: { link: $.data.id }
            - call: "POST /cabling/link-routes"
              payload: { link_id: "${link}", pathway_segment_id: "${seg_a}", sequence_index: 1, expected_segment_version: "${seg_a_v1}" }
              as: DesignEngineer
              captures: { route: $.data.id }
            - call: "POST /cabling/links/${link}/pull"
              payload: {}
              as: Installer
              as_user_id: "user-installer-01"
            - call: "POST /cabling/links/${link}/terminate"
              payload: {}
              as: Installer
              as_user_id: "user-installer-01"
            - call: "POST /cabling/links/${link}/label"
              payload: { applied_identifier: "TR01-A01" }
              as: Installer
              as_user_id: "user-installer-01"
            - call: "POST /cabling/links/${link}/record"
              payload: { drawing_sheet_ref: "E-501" }
              as: DesignEngineer
            - call: "POST /cabling/test-results"
              payload: { link_id: "${link}", test_standard: "PERMANENT_LINK", tester_model: "DSX-8000", insertion_loss_db: 6.0, next_margin_db: 3.2, return_loss_margin_db: 2.1, length_measured_m: 40.00 }
              as: TestTechnician
              as_user_id: "user-tester-01"
            - call: "POST /cabling/links/${link}/certify"
              payload: {}
              as: Certifier
              as_user_id: "user-cert-01"
            - call: "POST /cabling/trade-coordinations/${coord}/release"
              payload: {}
              as: ProjectManager
            - call: "POST /cabling/projects/${proj}/occupancy"
              payload: { occupancy_status: "OCCUPIED" }
              as: ProjectManager
            - call: "POST /cabling/mac-tickets"
              payload: { project_id: "${proj}", link_id: "${link}", telecom_room_id: "${room}", ticket_type: "ADD", requested_window_start: "2026-09-01T09:00:00Z", requested_window_end: "2026-09-01T11:00:00Z", labor_hours_estimate: 1.0 }
              as: Client
              as_user_id: "user-client-01"
              captures: { ticket: $.data.id }
          trigger:
            - call: "GET /cabling/link-routes"
              payload: { link_id: "${link}", route_state: "OCCUPYING", limit: 10, offset: 0 }
              as: ProjectManager
            - call: "GET /cabling/test-results"
              payload: { link_id: "${link}", limit: 10, offset: 0 }
              as: ProjectManager
            - call: "GET /cabling/warranty-registrations"
              payload: { project_id: "${proj}", limit: 10, offset: 0 }
              as: ProjectManager
            - call: "GET /cabling/mac-tickets"
              payload: { project_id: "${proj}", ticket_state: "SUBMITTED", limit: 10, offset: 0 }
              as: ProjectManager
            - call: "GET /cabling/trade-coordinations"
              payload: { project_id: "${proj}", trade: "CEILING", limit: 10, offset: 0 }
              as: ProjectManager
          assert:
            - "all five reads return 200 with response_type == \"array\", total_count == 1, limit == 10, offset == 0, has_more == false and exactly one row"
            - "the link-routes row has id == ${route}, sequence_index == 1, consumed_area_sq_mm == 49.02 and route_state == \"OCCUPYING\""
            - "the test-results row has link_id == ${link}, outcome == \"PASS\", worst_margin_db == 2.10 and carries no version and no updated_at field"
            - "the warranty-registrations row has id == ${reg}, manufacturer_program == \"STANDARD_15Y\" and registration_state == \"READY\""
            - "the mac-tickets row has id == ${ticket}, ticket_type == \"ADD\", ticket_state == \"SUBMITTED\" and rework_count == 0"
            - "the trade-coordinations row has id == ${coord}, milestone == \"PATHWAY_ROUGH_IN\", coordination_state == \"RELEASED\" and confirmed_date == \"2026-08-05\""

      - name: get_link_with_unknown_id_returns_link_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_LINK_NOT_FOUND]
          - validations[priority=40]
        distinguishing_aspect: "A syntactically valid UUID that matches no Link yields 404 ERR_LINK_NOT_FOUND rather than an empty 200 body."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /cabling/links/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: DesignEngineer
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and data.error_id == \"ERR_LINK_NOT_FOUND\""
            - "the envelope has response_type == \"error\" and a non-empty data.message"

      - name: create_link_without_cable_type_id_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Link.fields.cable_type_id
          - validations[priority=30]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "cable_type_id is a required input with no default, so omitting it fails at priority 30 with 400 ERR_INVALID_REQUEST before any existence check runs."
        test_recipe:
          setup: ["One project and one telecom room; no cable type is referenced by the call"]
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
            - call: "POST /cabling/telecom-rooms"
              payload: { project_id: "${proj}", room_code: "TR01", floor: 3, branch_circuit_amps: 20, ups_capacity_va: 3000 }
              as: ProjectManager
              captures: { room: $.data.id }
          trigger:
            - call: "POST /cabling/links"
              payload: { project_id: "${proj}", telecom_room_id: "${room}", identifier: "TR01-A01", application: "DATA_HORIZONTAL", horizontal_length_m: 40.00 }
              as: DesignEngineer
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /cabling/links returns total_count == 0 when filtered by project_id ${proj}"

      - name: create_pathway_segment_omitting_optional_flags_applies_defaults
        claim_type: defaults
        grounds:
          - entities.PathwaySegment.fields.bend_count
          - entities.PathwaySegment.fields.in_plenum_space
          - entities.PathwaySegment.fields.shared_with_power
          - endpoints["POST /cabling/pathway-segments"]
        distinguishing_aspect: "Omitting bend_count, in_plenum_space, shared_with_power and power_separation_mm applies the declared defaults 0 / false / false / 0, and the segment starts SERVICEABLE with an empty fill."
        test_recipe:
          setup: ["One project RVT1"]
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /cabling/pathway-segments"
              payload: { project_id: "${proj}", segment_code: "PS-D", pathway_type: "J_HOOK", usable_area_sq_mm: 5000.0, length_m: 15.0 }
              as: DesignEngineer
              captures: { seg: $.data.id }
          assert:
            - "the response status is 201 and data.bend_count == 0, data.in_plenum_space == false, data.shared_with_power == false and data.power_separation_mm == 0"
            - "data.pathway_state == \"SERVICEABLE\", data.fill_area_used_sq_mm == 0.00, data.occupying_route_count == 0 and data.fill_ratio == 0.0000"
            - "data.upstream_segment_id == null, data.pathway_depth == 0 and data.version == 1"

      - name: link_length_variants_are_computed_and_not_client_supplied
        claim_type: computed_fields
        grounds:
          - entities.Link.fields.permanent_link_length_m
          - entities.Link.fields.channel_length_m
          - calculations.link_length_evaluation
        distinguishing_aspect: "permanent_link_length_m and channel_length_m are computed on create from horizontal_length_m, consolidation_point_stub_m and patch_cord_allowance_m; they are not accepted as inputs, and 40.00 + 2.50 with a 3.00 m cord yields 42.50 and 46.10."
        test_recipe:
          setup: ["One project, one telecom room and one CAT6A CMP cable type"]
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
            - call: "POST /cabling/telecom-rooms"
              payload: { project_id: "${proj}", room_code: "TR01", floor: 3, branch_circuit_amps: 20, ups_capacity_va: 3000 }
              as: ProjectManager
              captures: { room: $.data.id }
            - call: "POST /cabling/cable-types"
              payload: { category: "CAT6A", jacket_rating: "CMP", outer_diameter_mm: 7.9, max_channel_length_m: 100.0, shielded: false, cost_per_meter_cents: 150, applications: ["DATA_HORIZONTAL"] }
              as: DesignEngineer
              captures: { ct: $.data.id }
          trigger:
            - call: "POST /cabling/links"
              payload: { project_id: "${proj}", telecom_room_id: "${room}", cable_type_id: "${ct}", identifier: "TR01-A01", application: "DATA_HORIZONTAL", horizontal_length_m: 40.00, consolidation_point_stub_m: 2.50, patch_cord_allowance_m: 3.00 }
              as: DesignEngineer
              captures: { link: $.data.id }
          assert:
            - "the response status is 201 and data.permanent_link_length_m == 42.50"
            - "data.channel_length_m == 46.10, derived from the already-rounded 42.50 plus 3.00 * 1.2"
            - "data.install_state == \"DESIGNED\", data.record_state == \"UNLABELED\" and data.routed_segment_count == 0"
            - "data.test_attempt_count == 0, data.latest_test_outcome == null and data.certifier_user_id == null"

      - name: project_system_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.CablingProject
          - response_envelope.success
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the server: version starts at 1, created_at and updated_at are ISO 8601 UTC with three fractional digits, and the id carries no type prefix."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id, v1: $.data.version }
            - call: "POST /cabling/projects/${proj}/occupancy"
              payload: { occupancy_status: "OCCUPIED" }
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "the create response has data.version == 1 and a data.id that is a bare UUID with no prefix before the first hyphen group"
            - "data.created_at and data.updated_at are ISO 8601 UTC with three fractional digits and are equal on create"
            - "the second call returns 409 with data.error_id == \"ERR_OCCUPANCY_READINESS_NOT_MET\" because completeness_pct_strict is 0.00"
            - "GET /cabling/projects/${proj} still returns version == 1 and updated_at unchanged, so a refused write mints nothing"

      - name: create_project_with_malformed_site_code_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.CablingProject.fields.site_code
          - validations[priority=30]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "site_code is constrained to ^[A-Z]{2,4}[0-9]{1,2}$; the lowercase three-digit value \"rvt123\" violates both the case and the digit-count clause and is refused with 400 before any row is written."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "rvt123", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /cabling/projects returns total_count == 0"

      - name: create_cable_type_with_unknown_category_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.CableType.fields.category
          - validations[priority=30]
        distinguishing_aspect: "category is a closed enum; \"CAT7\" is outside the declared domain, so the enum-domain clause of priority 30 rejects the create with 400 and no CableType row appears."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /cabling/cable-types"
              payload: { category: "CAT7", jacket_rating: "CMP", outer_diameter_mm: 7.9, max_channel_length_m: 100.0, shielded: false, cost_per_meter_cents: 150, applications: ["DATA_HORIZONTAL"] }
              as: DesignEngineer
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /cabling/cable-types returns total_count == 0"

      - name: create_rack_under_unknown_room_returns_telecom_room_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Rack.parent
          - errors[ERR_TELECOM_ROOM_NOT_FOUND]
          - validations[priority=40]
        distinguishing_aspect: "Rack declares TelecomRoom as its parent through telecom_room_id, so a body FK that resolves to nothing fails the existence gate at priority 40 with 404 ERR_TELECOM_ROOM_NOT_FOUND."
        test_recipe:
          setup: ["One project exists; no telecom room matches the submitted id"]
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /cabling/racks"
              payload: { telecom_room_id: "11111111-1111-4111-8111-111111111111", rack_code: "A", total_ru: 42 }
              as: DesignEngineer
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and data.error_id == \"ERR_TELECOM_ROOM_NOT_FOUND\""
            - "GET /cabling/racks returns total_count == 0 when filtered by telecom_room_id 11111111-1111-4111-8111-111111111111"

      - name: one_link_occupies_two_pathway_segments_through_the_junction_entity
        claim_type: graph
        grounds:
          - entities.LinkPathwayRoute
          - entities.Link.fields.routed_segment_count
          - endpoints["GET /cabling/link-routes"]
        distinguishing_aspect: "The many-to-many junction works in both directions: one Link holds two OCCUPYING routes with sequence_index 1 and 2 on two different segments, each segment reports one occupying route, and the reverse-reachability list GETs resolve both directions."
        test_recipe:
          setup: ["One project with CABLE_TRAY segments PS-A and PS-B and one DESIGNED link TR01-A01"]
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
            - call: "POST /cabling/telecom-rooms"
              payload: { project_id: "${proj}", room_code: "TR01", floor: 3, branch_circuit_amps: 20, ups_capacity_va: 3000 }
              as: ProjectManager
              captures: { room: $.data.id }
            - call: "POST /cabling/cable-types"
              payload: { category: "CAT6A", jacket_rating: "CMP", outer_diameter_mm: 7.9, max_channel_length_m: 100.0, shielded: false, cost_per_meter_cents: 150, applications: ["DATA_HORIZONTAL"] }
              as: DesignEngineer
              captures: { ct: $.data.id }
            - call: "POST /cabling/pathway-segments"
              payload: { project_id: "${proj}", segment_code: "PS-A", pathway_type: "CABLE_TRAY", usable_area_sq_mm: 20000.0, length_m: 40.0, bend_count: 0, in_plenum_space: true, shared_with_power: false, power_separation_mm: 0 }
              as: DesignEngineer
              captures: { seg_a: $.data.id, seg_a_v1: $.data.version }
            - call: "POST /cabling/pathway-segments"
              payload: { project_id: "${proj}", segment_code: "PS-B", pathway_type: "CABLE_TRAY", usable_area_sq_mm: 18000.0, length_m: 25.0, bend_count: 0, in_plenum_space: true, shared_with_power: false, power_separation_mm: 0 }
              as: DesignEngineer
              captures: { seg_b: $.data.id, seg_b_v1: $.data.version }
            - call: "POST /cabling/links"
              payload: { project_id: "${proj}", telecom_room_id: "${room}", cable_type_id: "${ct}", identifier: "TR01-A01", application: "DATA_HORIZONTAL", horizontal_length_m: 60.00, consolidation_point_stub_m: 0, patch_cord_allowance_m: 2.00 }
              as: DesignEngineer
              captures: { link: $.data.id }
          trigger:
            - call: "POST /cabling/link-routes"
