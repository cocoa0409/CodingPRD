  - section: errors
    instances:

      - name: error_permit_required_on_oversize_dispatch
        claim_type: Violation → Error
        grounds: ["errors[ERR_PERMIT_REQUIRED]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / oversize_width_strictly_above_legal_limit_requires_permit
          rationale: "Asserted as the failure path of the 8.51 ft shipment in that instance."

      - name: error_no_valid_specimens_on_request_release
        claim_type: Violation → Error
        grounds: ["errors[ERR_NO_VALID_SPECIMENS]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / zero_valid_specimens_blocks_release_on_empty_evidence_set
          rationale: "Asserted directly as that instance's trigger outcome."

      - name: error_bed_occupied_on_overlapping_run
        claim_type: Violation → Error
        grounds: ["errors[ERR_BED_OCCUPIED]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / bed_occupancy_pairwise_exclusion_with_turnaround_buffer
          rationale: "Asserted as the rejected 11:00 window in that instance."

      - name: error_steam_capacity_exceeded_on_curing_schedule
