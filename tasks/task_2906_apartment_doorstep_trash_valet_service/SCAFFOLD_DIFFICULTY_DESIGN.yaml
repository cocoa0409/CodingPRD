      - name: property_escalation_level_always_equals_live_escalated_incident_count
        grounds:
          - calculations.property_escalation_rollup
          - state_machines.CompactorIncident.ESCALATED_to_RESOLVED
          - state_machines.Property.SUSPENDED_to_ACTIVE
          - entities.Property.fields.escalation_level
          - entities.Property.fields.status
        distinguishing_aspect: |
          A conserved COUNT rather than a conserved money total: escalation_level is defined as the
          number of incidents currently in ESCALATED, so resolving one of two must decrement it to 1
          and, because 1 is below PROPERTY_SUSPENSION_ESCALATION_LEVEL, lift the property out of
          SUSPENDED. Crucially the compensation is partial by design — nights cancelled by the
          suspension are NOT resurrected, so the invariant covers the counter and the property state
          only, and an implementation that decrements a counter without re-deriving status fails.
        test_recipe:
          setup:
            - "Property 'Foxglove Park' unit_count 4, contract ACTIVE, one SCHEDULED night 2026-09-02"
            - "Two JAM incidents reported at 2026-09-01T00:00:00Z with ack_deadline_at 2026-09-01T04:00:00Z, neither acknowledged"
            - "Clock at 2026-09-01T04:00:00Z and both incidents escalated, so escalation_level == 2, the property is SUSPENDED and the night is CANCELLED"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /valet/properties"
              payload: { name: "Foxglove Park", unit_count: 4, market_code: "ATL" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /valet/properties/${prop_id}/contracts"
              payload: { per_unit_monthly_fee_cents: 3495, property_revenue_share_bps: 1500, service_night_days: ["SUN", "MON", "TUE", "WED", "THU"], effective_from: "2026-09-01", effective_to: "2027-08-31", sla_missed_threshold_bps: 1000 }
              as: BillingAnalyst
              as_user_id: "analyst-drafter"
              captures: { contract_id: $.data.id }
            - call: "POST /valet/contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /valet/contracts/${contract_id}/service-nights"
              payload: { service_date: "2026-09-02", service_window_start: "2026-09-02T18:00:00.000Z", service_window_end: "2026-09-02T22:00:00.000Z" }
              as: ValetOpsManager
              captures: { n2_id: $.data.id }
            - call: "POST /valet/properties/${prop_id}/compactor-incidents"
              payload: { incident_type: "JAM", description: "chute jammed on tower A" }
              as: ValetOpsManager
              captures: { inc1_id: $.data.id }
            - call: "POST /valet/properties/${prop_id}/compactor-incidents"
              payload: { incident_type: "JAM", description: "ram stalled on tower B" }
              as: ValetOpsManager
              captures: { inc2_id: $.data.id }
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T04:00:00Z" }
              as: PlatformAdmin
            - call: "POST /valet/compactor-incidents/${inc1_id}/escalate"
              payload: {}
              as: ValetOpsManager
            - call: "POST /valet/compactor-incidents/${inc2_id}/escalate"
              payload: {}
              as: ValetOpsManager
          trigger:
            - call: "POST /valet/compactor-incidents/${inc2_id}/resolve"
              payload: { resolution_note: "tower B ram replaced" }
              as: ValetOpsManager
          assert:
            - "before the trigger Property.${prop_id}.escalation_level == 2 and status == 'SUSPENDED'"
            - "CompactorIncident.${inc2_id}.status == 'RESOLVED' and CompactorIncident.${inc1_id}.status is still 'ESCALATED'"
            - "Property.${prop_id}.escalation_level == 1 — exactly the count of incidents still in ESCALATED"
            - "Property.${prop_id}.status == 'ACTIVE' — 1 is below PROPERTY_SUSPENSION_ESCALATION_LEVEL so suspension is lifted in the same request"
            - "ServiceNight.${n2_id}.verification_status is still 'CANCELLED' — cancelled nights are deliberately not resurrected"
            - "GET /valet/compactor-incidents?property_id=${prop_id} returns 2 incidents, one ESCALATED and one RESOLVED"

      - name: night_unit_coverage_conserved_across_route_abandon_and_reissue
        grounds:
          - calculations.route_unit_coverage
          - state_machines.RouteAssignment.ASSIGNED_to_ABANDONED
          - entities.ServiceNight.fields.assigned_unit_coverage_count
          - entities.RouteAssignment.fields.unit_coverage_count
          - validations[priority=20]
          - concurrency_rules[route-create-stale-service-night]
        distinguishing_aspect: |
          Round-trip conservation of a derived count under a swap: abandoning the only route must
