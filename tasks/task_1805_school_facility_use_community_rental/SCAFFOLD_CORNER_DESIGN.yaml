  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_CONTEXT_HEADER]"]
        distinguishing_aspect: "Missing X-User-ID / X-User-Role -> ERR_MISSING_OR_INVALID_CONTEXT_HEADER (400) before any role or existence check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /district/sites/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: "__NO_HEADERS__"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MISSING_OR_INVALID_CONTEXT_HEADER (400) — auth beats the 404 that the unknown id would otherwise produce"

      - name: role_denied_on_exclusive_operation
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "RenterOrgRep calling DistrictAdmin-exclusive POST /district/sites -> ERR_FORBIDDEN_FOR_ROLE (403) even with a well-formed body."
        test_recipe:
          setup: ["Renter org exists (to back the entity-bound role)"]
          setup_api_calls:
            - call: "POST /district/renters"
              payload: { org_name: "Riverview PTA", rate_class: "NONPROFIT", nonprofit_registration_no: "12-3456789" }
              as: FacilitiesDirector
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /district/sites"
              payload: { site_code: "HACK", display_name: "Unauthorized Site" }
              as: RenterOrgRep
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_FOR_ROLE (403); no site created"

      - name: entity_backed_ownership_enforcement
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "roles[RenterOrgRep]"]
        distinguishing_aspect: "RenterOrgRep with X-User-ID of org A cannot submit against org B's path -> ERR_FORBIDDEN_FOR_ROLE (403)."
        test_recipe:
          setup: ["Two renter orgs A and B; site+facility exist"]
          setup_api_calls:
            - call: "POST /district/sites"
              payload: { site_code: "RHS", display_name: "Riverview High" }
              as: DistrictAdmin
              captures: { site_id: $.data.id }
            - call: "POST /district/sites/${site_id}/facilities"
              payload: { facility_code: "GYM", facility_tier: "STANDARD", capacity: 300 }
              as: DistrictAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /district/renters"
              payload: { org_name: "Org A", rate_class: "NONPROFIT", nonprofit_registration_no: "11-1111111" }
              as: FacilitiesDirector
              captures: { org_a: $.data.id }
            - call: "POST /district/renters"
              payload: { org_name: "Org B", rate_class: "NONPROFIT", nonprofit_registration_no: "22-2222222" }
              as: FacilitiesDirector
              captures: { org_b: $.data.id }
          trigger:
            - call: "POST /district/renters/${org_b}/requests"
              payload: { facility_id: "${fac_id}", event_title: "Intrusion", headcount_estimate: 50, starts_at: "2026-12-01T01:00:00Z", ends_at: "2026-12-01T03:00:00Z" }
              as: RenterOrgRep
              as_user_id: "${org_a}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_FOR_ROLE (403) — entity-backed ownership check compares X-User-ID to path org id"

