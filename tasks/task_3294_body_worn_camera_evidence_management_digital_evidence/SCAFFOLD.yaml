# =============================================================================
# Scaffold: body-worn-camera-evidence (Axon-style digital evidence management)
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8);
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml (§1.9).
# =============================================================================

scenario: |
  Body-Worn Camera Evidence Management & Digital Evidence Sharing (Axon): device
  assignment to officers with docking, upload and battery management workflows,
  recording categorization at upload with retention schedules by category and
  case association, evidence integrity through hash verification, audit logging
  and chain of custody records, redaction workflows for public records release
  including face and audio redaction with time estimates, case sharing with
  prosecutors and defense through controlled access links with expiration,
  retention policy execution and legal hold override, agency policy
  configuration for recording triggers, tagging requirements and supervisor
  review sampling, storage tier costs and multi-year retention budgeting.

domain_name: body-worn-camera-evidence
api_prefix: /agencies

# =============================================================================
# §0.3/§0.4 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency        # OCC on CaseEntity.version for share-grant creation
    - cascading_side_effects        # dock->upload->categorize->budget->posture chains
    - dual_variant_calculation      # redaction effort (single-pass vs multi-pass); storage budget (pro-rated vs full-month)
    - derived_field_reconciliation  # agency.storage_used_bytes, officer metrics, case evidence rollup
    - scheduled_actions             # retention execution + share-grant expiry driven by logical clock
  entity_topology: hybrid           # agency root + flat cross-references (Recording->CaseEntity many-to-many via link)
  state_machine_shape: branching    # parallel dims on Recording; cyclic revision on RedactionJob; guarded transitions on Device
  relationship_patterns:
    - one_to_many
    - many_to_many                  # Recording <-> CaseEntity via CaseEvidenceLink
    - cross_aggregate               # RedactionJob / ShareGrant reference Recording and CaseEntity
  role_model: hierarchical_override # AgencyAdmin superset; segregation between RedactionTechnician and RecordsOfficer on release
  consistency_model: immediate      # all mutations atomic in request; derived fields recomputed synchronously

# =============================================================================
# §1.0 Response Envelope (FIXED — do not modify)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Agency
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Agency display name" }
      - { name: timezone, type: string, source: input, default: "UTC", description: "IANA timezone used for wall-clock policy rendering only; all computations use the logical UTC clock" }
      - { name: storage_used_bytes, type: integer, source: computed, default: 0, description: "Sum of size_bytes over all Recordings in states ACTIVE, RETENTION_DUE, or UNDER_REVIEW (excludes PURGED); recomputed synchronously on every recording state/size change" }
      - { name: storage_posture, type: enum, source: computed, description: "OK | WARNING | OVER_BUDGET — derived from storage_used_bytes vs current StorageBudgetPlan (see calculation storage_posture)" }

  - name: AgencyPolicy
    parent: Agency
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; owning agency" }
      - { name: recording_triggers, type: array, source: input, description: "Ordered list of trigger codes from {MANUAL, LIGHTBAR, TASER_ARMED, GUNSHOT_DETECTION, DOOR_OPEN}; at least one required; order matters for trigger precedence display only" }
      - { name: tagging_required, type: boolean, source: input, description: "When true, every Recording must be categorized (category set at upload) before its retention clock starts; uploads without category rejected when true" }
      - { name: supervisor_review_rate_pct, type: integer, source: input, description: "Integer 0..100 inclusive; fraction of uploaded Recordings auto-flagged PENDING_REVIEW for supervisor sampling" }
      - { name: default_share_expiry_days, type: integer, source: input, description: "Days a ShareGrant remains active if expires_at omitted at grant creation; must be 1..90 inclusive" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> SUPERSEDED; exactly one ACTIVE policy per agency at any time" }

  - name: StorageBudgetPlan
    parent: Agency
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; owning agency" }
      - { name: fiscal_year_start_month, type: integer, source: input, description: "Fiscal year start month 1..12; anchors multi-year budget projection" }
      - { name: monthly_budget_cents, type: integer, source: input, description: "Approved monthly storage spend in cents" }
      - { name: cost_per_gb_month_cents, type: integer, source: input, description: "Blended storage rate in cents per GB-month (1024^3 bytes counts as 1 GB)" }
      - { name: alert_threshold_pct, type: integer, source: input, description: "Integer 1..99; projected monthly cost above this percent of monthly_budget_cents flips posture to WARNING; above 100 flips OVER_BUDGET" }
      - { name: effective_from_month, type: string, source: input, description: "First calendar month (YYYY-MM) this plan applies to" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED; at most one ACTIVE plan per agency" }

  - name: Officer
    parent: Agency
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; owning agency" }
      - { name: badge_number, type: string, source: input, description: "Unique per agency among Officers whose status is ACTIVE or SUSPENDED" }
      - { name: full_name, type: string, source: input, description: "Officer display name" }
      - { name: rank, type: enum, source: input, description: "OFFICER | CORPORAL | SERGEANT | LIEUTENANT" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | RETIRED" }
      - { name: recordings_uploaded_count, type: integer, source: computed, default: 0, description: "Count of Recordings uploaded by this officer (any non-PURGED state); recomputed on upload and on purge" }
      - { name: pending_review_count, type: integer, source: computed, default: 0, description: "Count of this officer's Recordings in PENDING_REVIEW review_status" }

  - name: Device
    parent: Agency
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; owning agency" }
      - { name: serial_number, type: string, source: input, description: "Unique per agency" }
      - { name: model, type: string, source: input, description: "Hardware model label" }
      - { name: battery_pct, type: integer, source: system, default: 100, description: "0..100; initialized from the optional battery_pct registration input (default 100), then updated only by undock charge computation" }
      - { name: battery_pct_at_dock, type: integer, source: system, default: null, description: "Battery pct captured when the device docks; basis for charge gain at undock; null while UNDOCKED" }
      - { name: docked_at, type: datetime, source: system, default: null, description: "Logical timestamp when the device last docked; null while UNDOCKED" }
      - { name: assignment_status, type: enum, source: system, description: "UNASSIGNED | ASSIGNED — whether the device is currently issued to an Officer" }
      - { name: dock_status, type: enum, source: system, description: "DOCKED | UNDOCKED — physical dock state; parallel dimension to assignment_status" }
      - { name: health_status, type: enum, source: system, description: "HEALTHY | RETIRED" }
      - { name: assigned_officer_id, type: string, source: system, default: null, description: "FK -> Officer.id; null when assignment_status == UNASSIGNED" }

  - name: Recording
    parent: Agency
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; owning agency" }
      - { name: device_id, type: string, source: system, description: "FK -> Device.id; capturing device" }
      - { name: officer_id, type: string, source: system, description: "FK -> Officer.id; officer the device was assigned to at upload time" }
      - { name: trigger_code, type: enum, source: input, description: "One of the agency policy's recording_triggers; recording trigger that started capture" }
      - { name: duration_seconds, type: integer, source: input, description: "Media duration; must be 1..14400" }
      - { name: size_bytes, type: integer, source: input, description: "Media payload size; must be >= 1" }
      - { name: recorded_at, type: datetime, source: input, description: "Logical-clock timestamp when capture occurred; must be <= current logical time" }
      - { name: content_hash_sha256, type: string, source: input, description: "64 lowercase hex chars; uploader-computed SHA-256 of the media payload" }
      - { name: category, type: enum, source: input, default: null, description: "INCIDENT | ARREST | TRAFFIC_STOP | TRAINING | TEST; set at upload when AgencyPolicy.tagging_required, else patchable later" }
      - { name: upload_status, type: enum, source: system, description: "PARALLEL DIM 1: RECEIVED -> INTEGRITY_VERIFIED | INTEGRITY_FAILED -> ACTIVE -> RETENTION_DUE -> PURGED" }
      - { name: review_status, type: enum, source: system, description: "PARALLEL DIM 2: NOT_FLAGGED | PENDING_REVIEW -> REVIEWED; independent of upload_status" }
      - { name: retention_due_at, type: datetime, source: computed, default: null, description: "Logical timestamp at which retention expires; computed at categorization (or at upload if category supplied): upload time + retention_days(category)" }
      - { name: legal_hold_count, type: integer, source: computed, default: 0, description: "Number of ACTIVE LegalHolds covering this recording (directly or via case link); purge is blocked while > 0" }
      - { name: integrity_check_count, type: integer, source: system, default: 0, description: "Number of hash verifications run against this recording" }

  - name: CaseEntity
    parent: Agency
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; owning agency" }
      - { name: case_number, type: string, source: input, description: "Unique per agency among non-ARCHIVED cases" }
      - { name: title, type: string, source: input, description: "Case display title" }
      - { name: status, type: enum, source: system, description: "OPEN -> UNDER_REVIEW -> CLOSED -> ARCHIVED" }
      - { name: lead_officer_id, type: string, source: input, description: "FK -> Officer.id; officer responsible for the case" }
      - { name: evidence_count, type: integer, source: computed, default: 0, description: "Count of CaseEvidenceLinks in LINKED state pointing at this case" }
      - { name: total_evidence_bytes, type: integer, source: computed, default: 0, description: "Sum of size_bytes of LINKED recordings that are not PURGED" }
      - { name: retention_due_at, type: datetime, source: computed, default: null, description: "Max over LINKED recordings' retention_due_at plus case-grace rules (see calculation case_retention_due_at); null when no linked recordings" }

  - name: CaseEvidenceLink
    parent: Agency
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; owning agency" }
      - { name: case_id, type: string, source: system, description: "FK -> CaseEntity.id; linked case" }
      - { name: recording_id, type: string, source: system, description: "FK -> Recording.id; linked recording" }
      - { name: linked_by_officer_id, type: string, source: system, description: "FK -> Officer.id; officer who created the link" }
      - { name: status, type: enum, source: system, description: "LINKED | UNLINKED" }
      - { name: unlinked_at, type: datetime, source: system, default: null, description: "Logical timestamp of unlink; null while LINKED" }

  - name: RedactionJob
    parent: Agency
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; owning agency" }
      - { name: recording_id, type: string, source: system, description: "FK -> Recording.id; recording being redacted" }
      - { name: request_reference, type: string, source: input, description: "Public-records request reference string" }
      - { name: scope_face, type: boolean, source: input, description: "Whether face redaction is in scope" }
      - { name: scope_audio, type: boolean, source: input, description: "Whether audio redaction is in scope" }
      - { name: passes, type: enum, source: input, description: "SINGLE_PASS | MULTI_PASS — processing rigor; selects the redaction effort variant" }
      - { name: estimated_minutes, type: integer, source: computed, description: "Effort estimate per calculation redaction_effort_minutes (variant chosen by passes)" }
      - { name: actual_minutes, type: integer, source: input, default: null, description: "Technician-reported effort at completion; must be >= 1 when supplied" }
      - { name: status, type: enum, source: system, description: "QUEUED -> IN_PROGRESS -> SUBMITTED -> APPROVED -> RELEASED | RETURNED (cycle back to IN_PROGRESS) | CANCELLED" }

  - name: ShareGrant
    parent: Agency
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; owning agency" }
      - { name: case_id, type: string, source: system, description: "FK -> CaseEntity.id; shared case" }
      - { name: recipient_role, type: enum, source: input, description: "PROSECUTOR | DEFENSE" }
      - { name: recipient_email, type: string, source: input, description: "Recipient contact; stored for audit" }
      - { name: access_token, type: string, source: system, description: "Server-minted opaque token returned at creation; used on the access endpoint" }
      - { name: expires_at, type: datetime, source: computed, description: "created_at + (expires_in_days or AgencyPolicy.default_share_expiry_days); explicit expires_in_days input overrides policy default" }
      - { name: expires_in_days, type: integer, source: input, default: null, description: "Optional explicit expiry window in days; must be 1..90 when supplied" }
      - { name: access_count, type: integer, source: system, default: 0, description: "Number of successful access events against this grant" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> REVOKED | EXPIRED (EXPIRED set by clock-driven sweep)" }

  - name: LegalHold
    parent: Agency
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; owning agency" }
      - { name: scope_type, type: enum, source: input, description: "RECORDING | CASE — whether the hold pins one recording or every recording linked to a case" }
      - { name: recording_id, type: string, source: input, default: null, description: "FK -> Recording.id; required iff scope_type == RECORDING" }
      - { name: case_id, type: string, source: input, default: null, description: "FK -> CaseEntity.id; required iff scope_type == CASE" }
      - { name: authority_reference, type: string, source: input, description: "Court order / subpoena reference" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> RELEASED" }

  - name: AuditLogEntry
    parent: Agency
    common_fields: false
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; owning agency" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the caller whose action produced this entry" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID of the caller (opaque id stored verbatim)" }
      - { name: action, type: string, source: system, description: "Machine label of the action, e.g. RECORDING_UPLOADED, SHARE_GRANT_CREATED, LEGAL_HOLD_PLACED" }
      - { name: entity_type, type: string, source: system, description: "Entity name of the mutated resource" }
      - { name: entity_id, type: string, source: system, description: "id of the mutated resource" }
      - { name: detail, type: string, source: system, description: "Free-form summary including field-level before/after where relevant" }

  - name: CustodyEvent
    parent: Agency
    common_fields: false
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; owning agency" }
      - { name: recording_id, type: string, source: system, description: "FK -> Recording.id; recording the custody event belongs to" }
      - { name: event_type, type: enum, source: system, description: "UPLOADED | HASH_VERIFIED | HASH_MISMATCH | CASE_LINKED | CASE_UNLINKED | REDACTION_STARTED | REDACTION_RELEASED | SHARED | ACCESSED | HOLD_PLACED | HOLD_RELEASED | PURGE_EXECUTED" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of caller, or SYSTEM for sweeps" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID of caller, or SYSTEM" }
      - { name: hash_at_event, type: string, source: system, default: null, description: "content_hash_sha256 value observed at the event; set on HASH_VERIFIED / HASH_MISMATCH / PURGE_EXECUTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AgencyPolicy
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /policies/{policyId}/activate"
        actor: AgencyAdmin
        preconditions:
          - "agency has no other ACTIVE policy, else the other must be superseded first (ERR_POLICY_ALREADY_ACTIVE)"
        side_effects:
          - "AuditLogEntry POLICY_ACTIVATED written"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /policies (creating a new policy auto-supersedes the ACTIVE one after the new one activates) OR POST .../policies/{policyId}/supersede"
        actor: AgencyAdmin
        preconditions: []
        side_effects:
          - "AuditLogEntry POLICY_SUPERSEDED written"
          - "existing ShareGrants keep their expires_at pinned at creation (no retroactive change)"

  - entity: StorageBudgetPlan
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /storage-budget-plans (creating a new plan supersedes the current ACTIVE plan atomically)"
        actor: AgencyAdmin
        preconditions:
          - "new plan's effective_from_month must be strictly later than the current ACTIVE plan's effective_from_month (ERR_PLAN_NOT_LATER)"
        side_effects:
          - "agency.storage_posture recomputed against the new plan"
          - "AuditLogEntry BUDGET_PLAN_SUPERSEDED written"

  - entity: Officer
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /agencies/{agencyId}/officers/{officerId}/suspend"
        actor: AgencyAdmin
        preconditions:
          - "officer has no device currently ASSIGNED to them (ERR_DEVICE_STILL_ASSIGNED)"
        side_effects:
          - "AuditLogEntry OFFICER_SUSPENDED written"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /agencies/{agencyId}/officers/{officerId}/reinstate"
        actor: AgencyAdmin
        preconditions: []
        side_effects:
          - "AuditLogEntry OFFICER_REINSTATED written"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /agencies/{agencyId}/officers/{officerId}/retire"
        actor: AgencyAdmin
        preconditions:
          - "officer has no device currently ASSIGNED to them (ERR_DEVICE_STILL_ASSIGNED)"
          - "officer is not lead_officer_id on any CaseEntity in status OPEN or UNDER_REVIEW (ERR_LEAD_CASES_OPEN)"
        side_effects:
          - "badge_number freed for reuse (uniqueness only enforced over ACTIVE/SUSPENDED officers)"
          - "AuditLogEntry OFFICER_RETIRED written"

  - entity: Device
    initial_state: UNASSIGNED
    terminal_states: [RETIRED]
    transitions:
      # parallel dimension 1: assignment_status
      - from: UNASSIGNED
        to: ASSIGNED
        trigger: "POST /agencies/{agencyId}/devices/{deviceId}/assign"
        actor: DeviceCoordinator
        preconditions:
          - "health_status == HEALTHY (ERR_DEVICE_UNHEALTHY)"
          - "battery_pct >= 20 (ERR_BATTERY_TOO_LOW)"
          - "target officer status == ACTIVE (ERR_OFFICER_NOT_ACTIVE)"
          - "target officer has no other ASSIGNED device (ERR_OFFICER_ALREADY_HAS_DEVICE)"
          - "device dock_status == DOCKED (ERR_DEVICE_NOT_DOCKED)"
        side_effects:
          - "device.assigned_officer_id set"
          - "AuditLogEntry DEVICE_ASSIGNED written"
      - from: ASSIGNED
        to: UNASSIGNED
        trigger: "POST /agencies/{agencyId}/devices/{deviceId}/unassign"
        actor: DeviceCoordinator
        preconditions:
          - "device dock_status == DOCKED (ERR_DEVICE_NOT_DOCKED)"
        side_effects:
          - "device.assigned_officer_id cleared to null"
          - "AuditLogEntry DEVICE_UNASSIGNED written"
      # parallel dimension 2: dock_status
      - from: UNDOCKED
        to: DOCKED
        trigger: "POST /agencies/{agencyId}/devices/{deviceId}/dock"
        actor: "DeviceCoordinator | Officer (assigned officer only)"
        preconditions:
          - "dock_status == UNDOCKED (ERR_INVALID_STATE)"
        side_effects:
          - "device.battery_pct_at_dock = battery_pct; device.docked_at = logical now"
          - "AuditLogEntry DEVICE_DOCKED written"
      - from: DOCKED
        to: UNDOCKED
        trigger: "POST /agencies/{agencyId}/devices/{deviceId}/undock"
        actor: "DeviceCoordinator | Officer (assigned officer only)"
        preconditions:
          - "dock_status == DOCKED (ERR_INVALID_STATE)"
        side_effects:
          - "device.battery_pct updated per calculation dock_charge_gain (uses docked_at and battery_pct_at_dock)"
          - "battery_pct_at_dock and docked_at cleared to null"
          - "AuditLogEntry DEVICE_UNDOCKED written"
      # health dimension transitions
      - from: ASSIGNED
        to: RETIRED
        trigger: "POST /agencies/{agencyId}/devices/{deviceId}/retire"
        actor: DeviceCoordinator
        preconditions:
          - "dock_status == DOCKED (ERR_DEVICE_NOT_DOCKED)"
        side_effects:
          - "device unassigned first (assigned_officer_id cleared), then health_status -> RETIRED"
          - "AuditLogEntry DEVICE_RETIRED written"
      - from: UNASSIGNED
        to: RETIRED
        trigger: "POST /agencies/{agencyId}/devices/{deviceId}/retire"
        actor: DeviceCoordinator
        preconditions:
          - "dock_status == DOCKED (ERR_DEVICE_NOT_DOCKED)"
        side_effects:
          - "health_status -> RETIRED"
          - "AuditLogEntry DEVICE_RETIRED written"

  - entity: Recording
    initial_state: RECEIVED
    terminal_states: [PURGED]
    transitions:
      # --- upload_status dimension (parallel dim 1) ---
      - from: RECEIVED
        to: INTEGRITY_VERIFIED
        trigger: "system (automatic at upload when the server-recomputed hash equals content_hash_sha256)"
        actor: system
        preconditions: []
        side_effects:
          - "integrity_check_count += 1"
          - "CustodyEvent HASH_VERIFIED written with hash_at_event"
          - "if AgencyPolicy.tagging_required and category present: immediately continue to ACTIVE and compute retention_due_at"
      - from: RECEIVED
        to: INTEGRITY_FAILED
        trigger: "system (automatic at upload when the server-recomputed hash differs from content_hash_sha256)"
        actor: system
        preconditions: []
        side_effects:
          - "integrity_check_count += 1"
          - "CustodyEvent HASH_MISMATCH written"
          - "recording excluded from storage_used_bytes, sharing, linking, redaction"
      - from: INTEGRITY_FAILED
        to: RECEIVED
        trigger: "POST /agencies/{agencyId}/recordings/{recordingId}/reverify (caller supplies corrected content_hash_sha256)"
        actor: Officer
        preconditions:
          - "only the uploading officer or a Supervisor may reverify"
        side_effects:
          - "recording re-enters RECEIVED and the integrity check re-runs (INTEGRITY_VERIFIED or INTEGRITY_FAILED again)"
      - from: INTEGRITY_VERIFIED
        to: ACTIVE
        trigger: "system (automatic when category is set — at upload when tagging_required with category supplied, or via PATCH categorize)"
        actor: system
        preconditions:
          - "category != null (ERR_CATEGORY_REQUIRED via categorize endpoint when tagging enforced)"
        side_effects:
          - "retention_due_at computed per calculation retention_due"
          - "agency.storage_used_bytes += size_bytes (recompute)"
          - "agency.storage_posture recomputed (may flip OK->WARNING->OVER_BUDGET)"
          - "supervisor sampling: review_status set PENDING_REVIEW iff (officer.recordings_uploaded_count after increment) mod sampling_modulus == 0 per calculation supervisor_sampling"
          - "officer.recordings_uploaded_count += 1; officer.pending_review_count recomputed"
          - "CustodyEvent UPLOADED written"
      - from: ACTIVE
        to: RETENTION_DUE
        trigger: "system (automatic during POST /agencies/{agencyId}/retention/run when retention_due_at <= logical now)"
        actor: system
        preconditions: []
        side_effects:
          - "case rollup: linked CaseEntity.retention_due_at recomputed"
      - from: RETENTION_DUE
        to: PURGED
        trigger: "system (automatic during POST /agencies/{agencyId}/retention/run — same run that marked it RETENTION_DUE continues to purge)"
        actor: system
        preconditions:
          - "legal_hold_count == 0 (held recordings stay RETENTION_DUE, never purged)"
        side_effects:
          - "agency.storage_used_bytes -= size_bytes (recompute)"
          - "agency.storage_posture recomputed"
          - "officer.recordings_uploaded_count -= 1"
          - "linked CaseEntity.total_evidence_bytes and retention_due_at recomputed"
          - "CustodyEvent PURGE_EXECUTED written with hash_at_event"
          - "AuditLogEntry RECORDING_PURGED written"
      # --- review_status dimension (parallel dim 2) ---
      - from: NOT_FLAGGED
        to: PENDING_REVIEW
        trigger: "system (automatic at categorization when supervisor sampling selects the recording)"
        actor: system
        preconditions: []
        side_effects:
          - "officer.pending_review_count += 1"
      - from: PENDING_REVIEW
        to: REVIEWED
        trigger: "POST /agencies/{agencyId}/recordings/{recordingId}/mark-reviewed"
        actor: Supervisor
        preconditions:
          - "recording upload_status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "officer.pending_review_count -= 1"
          - "AuditLogEntry RECORDING_REVIEWED written"

  - entity: CaseEntity
    initial_state: OPEN
    terminal_states: [ARCHIVED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /agencies/{agencyId}/cases/{caseId}/submit-review"
        actor: Officer
        preconditions:
          - "evidence_count >= 1 (ERR_CASE_EMPTY)"
          - "every LINKED recording has upload_status in {ACTIVE, RETENTION_DUE} (ERR_EVIDENCE_NOT_READY)"
        side_effects:
          - "AuditLogEntry CASE_SUBMITTED written"
      - from: UNDER_REVIEW
        to: CLOSED
        trigger: "POST /agencies/{agencyId}/cases/{caseId}/close"
        actor: Supervisor
        preconditions:
          - "every LINKED recording's review_status != PENDING_REVIEW (ERR_REVIEWS_OUTSTANDING)"
        side_effects:
          - "AuditLogEntry CASE_CLOSED written"
      - from: UNDER_REVIEW
        to: OPEN
        trigger: "POST /agencies/{agencyId}/cases/{caseId}/reopen"
        actor: Supervisor
        preconditions: []
        side_effects:
          - "AuditLogEntry CASE_REOPENED written"
      - from: CLOSED
        to: OPEN
        trigger: "POST /agencies/{agencyId}/cases/{caseId}/reopen"
        actor: Supervisor
        preconditions: []
        side_effects:
          - "AuditLogEntry CASE_REOPENED written"
      - from: CLOSED
        to: ARCHIVED
        trigger: "POST /agencies/{agencyId}/cases/{caseId}/archive"
        actor: RecordsOfficer
        preconditions:
          - "no ACTIVE ShareGrant on this case (ERR_ACTIVE_SHARE_GRANTS)"
          - "no ACTIVE LegalHold with scope_type CASE on this case (ERR_LEGAL_HOLD_ACTIVE)"
        side_effects:
          - "case_number freed for reuse"
          - "AuditLogEntry CASE_ARCHIVED written"

  - entity: CaseEvidenceLink
    initial_state: LINKED
    terminal_states: [UNLINKED]
    transitions:
      - from: LINKED
        to: UNLINKED
        trigger: "DELETE /agencies/{agencyId}/cases/{caseId}/evidence/{linkId}"
        actor: Officer
        preconditions:
          - "case status == OPEN (ERR_INVALID_STATE)"
          - "no ACTIVE ShareGrant exists on the case (ERR_ACTIVE_SHARE_GRANTS — unlinking evidence from a shared case is forbidden)"
        side_effects:
          - "unlinked_at set"
          - "case.evidence_count -= 1; case.total_evidence_bytes recomputed; case.retention_due_at recomputed"
          - "recording's case-coverage legal_hold_count recomputed (CASE-scoped holds only count while LINKED)"
          - "CustodyEvent CASE_UNLINKED written"

  - entity: RedactionJob
    initial_state: QUEUED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: QUEUED
        to: IN_PROGRESS
        trigger: "POST /agencies/{agencyId}/redaction-jobs/{jobId}/start"
        actor: RedactionTechnician
        preconditions:
          - "recording upload_status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "CustodyEvent REDACTION_STARTED written"
      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "POST /agencies/{agencyId}/redaction-jobs/{jobId}/submit"
        actor: RedactionTechnician
        preconditions:
          - "actual_minutes supplied in the submit payload, >= 1 (ERR_VALIDATION)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /agencies/{agencyId}/redaction-jobs/{jobId}/approve"
        actor: RecordsOfficer
        preconditions:
          - "approver's X-User-ID != the technician X-User-ID who submitted (segregation of duties; ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /agencies/{agencyId}/redaction-jobs/{jobId}/return"
        actor: RecordsOfficer
        preconditions: []
        side_effects: []
      - from: RETURNED
        to: IN_PROGRESS
        trigger: "POST /agencies/{agencyId}/redaction-jobs/{jobId}/start"
        actor: RedactionTechnician
        preconditions:
          - "recording upload_status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "revision cycle: actual_minutes reset to null"
      - from: APPROVED
        to: RELEASED
        trigger: "POST /agencies/{agencyId}/redaction-jobs/{jobId}/release"
        actor: RecordsOfficer
        preconditions:
          - "recording upload_status == ACTIVE (not RETENTION_DUE/PURGED) (ERR_INVALID_STATE)"
        side_effects:
          - "CustodyEvent REDACTION_RELEASED written"
          - "AuditLogEntry REDACTION_RELEASED written"
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /agencies/{agencyId}/redaction-jobs/{jobId}/cancel"
        actor: "RedactionTechnician | RecordsOfficer"
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /agencies/{agencyId}/redaction-jobs/{jobId}/cancel"
        actor: "RedactionTechnician | RecordsOfficer"
        preconditions: []
        side_effects: []
      - from: RETURNED
        to: CANCELLED
        trigger: "POST /agencies/{agencyId}/redaction-jobs/{jobId}/cancel"
        actor: "RedactionTechnician | RecordsOfficer"
        preconditions: []
        side_effects: []

  - entity: ShareGrant
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /share-grants/{grantId}/revoke"
        actor: RecordsOfficer
        preconditions: []
        side_effects:
          - "AuditLogEntry SHARE_GRANT_REVOKED written"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic during POST /share-grants/sweep when expires_at <= logical now)"
        actor: system
        preconditions: []
        side_effects:
          - "AuditLogEntry SHARE_GRANT_EXPIRED written"

  - entity: LegalHold
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /agencies/{agencyId}/legal-holds/{holdId}/release"
        actor: RecordsOfficer
        preconditions: []
        side_effects:
          - "covered recordings' legal_hold_count recomputed (RECORDING scope: that recording -1; CASE scope: every LINKED recording -1)"
          - "CustodyEvent HOLD_RELEASED written on each affected recording"
          - "recordings that are RETENTION_DUE become purgeable in the next retention run"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only — see filter in SKILL.md)
# =============================================================================
concurrency_rules:
  - rule_id: share-grant-stale-case
    parent_entity: CaseEntity
    write_endpoint: "POST /agencies/{agencyId}/cases/{caseId}/share-grants"
    occ_field: "expected_case_version"
    description: |
      Creating a ShareGrant against a CaseEntity whose version has advanced
      since the caller last observed it is rejected with 412. A stale reader
      may otherwise share a case whose evidence set or status has changed
      underneath them; the OCC check forces the caller to re-read the case
      (and its current evidence rollup) before granting access.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: redaction_effort_minutes
    trigger: "RedactionJob creation (POST /agencies/{agencyId}/recordings/{recordingId}/redaction-jobs)"
    algorithm: tiered_pricing
    formula: |
      # DUAL-VARIANT (rule 1): SINGLE_PASS vs MULTI_PASS on Recording/RedactionJob domain.
      duration_minutes = ceil(recording.duration_seconds / 60)
      scope_count = (scope_face ? 1 : 0) + (scope_audio ? 1 : 0)   # 1 or 2 (at least one required)
      if passes == SINGLE_PASS:
        base = duration_minutes * SINGLE_PASS_MIN_PER_MEDIA_MIN    # 2
        scope_multiplier = 1.0 if scope_count == 1 else 1.5
        estimated_minutes = ceil(base * scope_multiplier)
      else:  # MULTI_PASS
        base = duration_minutes * MULTI_PASS_MIN_PER_MEDIA_MIN     # 5
        scope_multiplier = 1.0 if scope_count == 1 else 2.0
        long_form_surcharge = 30 if duration_minutes > 120 else 0
        estimated_minutes = ceil(base * scope_multiplier) + long_form_surcharge
    constants:
      SINGLE_PASS_MIN_PER_MEDIA_MIN: 2
      MULTI_PASS_MIN_PER_MEDIA_MIN: 5
      LONG_FORM_THRESHOLD_MIN: 120
      LONG_FORM_SURCHARGE_MIN: 30
    precision: "integer minutes; ceil at each rounding point in the order written"
    variants:
      - name: single_pass
        when: "passes == SINGLE_PASS"
        difference: "2 min per media-minute; two-scope multiplier 1.5; no long-form surcharge"
      - name: multi_pass
        when: "passes == MULTI_PASS"
        difference: "5 min per media-minute; two-scope multiplier 2.0; +30 min surcharge when duration > 120 media-minutes"

  - name: storage_monthly_cost_cents
    trigger: "agency storage_used_bytes change; StorageBudgetPlan creation/supersession; GET /agencies/{agencyId}/storage/budget-projection"
    algorithm: tiered_pricing
    formula: |
      # DUAL-VARIANT (rule 1, different entity domain than redaction): budget math on Agency/StorageBudgetPlan.
      gib = storage_used_bytes / 1073741824.0    # 1024^3
      full_month_cost = ceil(gib * cost_per_gb_month_cents)
      # variant selection by evaluation context:
      if context == PROJECTION:    # budget-projection endpoint: forward-looking full month
        cost_cents = full_month_cost
      else:                        # ACTUAL current-month accrual: pro-rated by day-in-month elapsed
        days_in_month = calendar days of current month
        day_index = current day-of-month (1-based) per logical clock
        cost_cents = floor(full_month_cost * day_index / days_in_month)
    precision: "integer cents; ceil for projection, floor for pro-rated accrual — order pinned"
    variants:
      - name: projection_full_month
        when: "context == PROJECTION (budget-projection endpoint)"
        difference: "full-month cost, ceil rounding — the number compared against alert_threshold_pct"
      - name: accrued_prorated
        when: "context == ACCRUAL (current-month accrued cost in budget snapshot)"
        difference: "floor(full_month_cost * day_of_month / days_in_month); day 1 of a 31-day month yields floor(full/31)"

  - name: storage_posture
    trigger: "storage_monthly_cost_cents (projection variant) recompute"
    algorithm: threshold
    formula: |
      projected = storage_monthly_cost_cents[PROJECTION]
      if no ACTIVE StorageBudgetPlan: posture = OK
      else if projected > monthly_budget_cents: posture = OVER_BUDGET
      else if projected >= floor(monthly_budget_cents * alert_threshold_pct / 100): posture = WARNING
      else: posture = OK
    constants:
      BOUNDARY: "comparison is strict > for OVER_BUDGET and >= for WARNING; a projection exactly equal to monthly_budget_cents stays WARNING (or OK if below threshold), never OVER_BUDGET"

  - name: retention_due
    trigger: "Recording categorization (transition INTEGRITY_VERIFIED -> ACTIVE); CaseEvidenceLink creation (case-linked recordings may extend)"
    algorithm: chronological
    formula: |
      base_days = RETENTION_DAYS[recording.category]
      retention_due_at = upload_completed_at + base_days days
      # case-extension rule: if the recording is LINKED to a case at categorization time
      # (or becomes linked later while ACTIVE), and case link pushes retention longer:
      for each LINKED CaseEvidenceLink L on the recording:
        candidate = L.created_at + CASE_LINKED_EXTENSION_DAYS[recording.category]
        if candidate > retention_due_at: retention_due_at = candidate
      # Re-evaluated on link creation; never shortened by unlink.
    constants:
      RETENTION_DAYS: { INCIDENT: 180, ARREST: 1095, TRAFFIC_STOP: 90, TRAINING: 30, TEST: 7 }
      CASE_LINKED_EXTENSION_DAYS: { INCIDENT: 730, ARREST: 2555, TRAFFIC_STOP: 365, TRAINING: 30, TEST: 7 }

  - name: case_retention_due_at
    trigger: "CaseEvidenceLink create/unlink; recording retention_due_at recompute; recording purge"
    algorithm: aggregation
    formula: |
      linked = [r for links L on case where L.status == LINKED for r = L.recording where r.upload_status != PURGED]
      if linked is empty: case.retention_due_at = null
      else: case.retention_due_at = max(r.retention_due_at for r in linked)
      # tie-break irrelevant (max over datetimes); recomputed synchronously on every trigger

  - name: supervisor_sampling
    trigger: "Recording categorization (INTEGRITY_VERIFIED -> ACTIVE)"
    algorithm: threshold
    formula: |
      # Deterministic sampling pinned to a modulo over the officer's upload ordinal —
      # never random. rate_pct == 0 disables sampling entirely.
      rate = AgencyPolicy.supervisor_review_rate_pct
      if rate == 0: flag = false
      else:
        modulus = floor(100 / rate)               # e.g. rate 25 -> modulus 4; rate 30 -> modulus 3
        ordinal = officer.recordings_uploaded_count   # AFTER increment for this upload
        flag = (ordinal % modulus == 0)
      if flag: review_status = PENDING_REVIEW else NOT_FLAGGED
    constants:
      SAMPLING_NOTE: "floor(100/rate) means rate 30 samples ordinals 3,6,9,... (≈33%); the PRD pins floor semantics so boundary rates are unambiguous"

  - name: dock_charge_gain
    trigger: "device undock (dock_status DOCKED -> UNDOCKED)"
    algorithm: threshold
    formula: |
      elapsed_seconds = logical_now - device.docked_at
      elapsed_hours = floor(elapsed_seconds / 3600)
      gain = min(elapsed_hours * CHARGE_RATE_PCT_PER_HOUR, 100 - device.battery_pct_at_dock)
      device.battery_pct = min(100, device.battery_pct_at_dock + gain)
      # charge gain is reported in the undock response as charge_gained_pct (== gain)
    constants:
      CHARGE_RATE_PCT_PER_HOUR: 10
      BOUNDARY: "elapsed 3599s yields 0 gain; 3600s yields 10 (floor semantics); a session of exactly 1 hour on a 95% battery gains 5 (capped by headroom), not 10"

  - name: multi_year_budget_projection
    trigger: "GET /agencies/{agencyId}/storage/budget-projection"
    algorithm: forward_looking
    formula: |
      # COMBINATORIAL (rule 2 mode a): >=3 inputs with non-linear interaction.
      plan = ACTIVE StorageBudgetPlan
      monthly_growth_rate = 1 + plan_growth_bps/10000 (plan_growth_bps supplied as query param, default 0)
      for m in 0..months-1 (months supplied as query param, 1..60):
        projected_bytes_m = storage_used_bytes * (monthly_growth_rate ** m)
        projected_cost_m = ceil((projected_bytes_m / 1073741824.0) * cost_per_gb_month_cents)
        over_m = projected_cost_m > monthly_budget_cents
      response: { months: [ {month_index, projected_cost_cents, over_budget}... ],
                  total_projected_cost_cents: sum(projected_cost_m),
                  first_over_budget_month_index: min m where over_m, else null }
    precision: "integer cents; ceil per month before summing (per-month then sum — pinned order)"

  - name: storage_gib_billing_rounding
    trigger: "storage_monthly_cost_cents evaluation"
    algorithm: threshold
    formula: |
      # COMBINATORIAL (rule 2 mode b): nested rounding order pinned.
      # "per-month-ceil then sum" (this rule) vs "sum GiB over months then ceil" produce
      # different totals; the scaffold pins: convert bytes->GiB (float), multiply by rate,
      # ceil to cents PER MONTH, then sum the integer cents.
      gib_exact = bytes / 1073741824.0
      monthly_cents = ceil(gib_exact * cost_per_gb_month_cents)   # round first
      total_cents = sum(monthly_cents over months)                # then sum
    constants:
      ROUNDING_ORDER: "round-per-month-then-sum (never sum-then-round)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.7 (ownership: Officer role acting on device dock/undock or recording upload/reverify must be the device's assigned officer / the recording's officer_id)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path resources exist and belong to the same agency (validated left-to-right: agency, then nested resource)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: existence
    check: "Body-supplied references exist (device_id, officer_id, recording_id, case_id) and belong to the same agency"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "endpoints taking FK ids in body"

  - priority: 5
    category: state
    check: "Target resource is in a state that permits the transition (state-machine from-state precondition)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"

  - priority: 5
    category: state
    check: "ShareGrant creation requires the case to be CLOSED (sharing is a post-adjudication act)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /agencies/{agencyId}/cases/{caseId}/share-grants"

  - priority: 6
    category: business_safety
    check: "Legal-hold safety: retention purge skips any recording with legal_hold_count > 0; archive/close gates that protect evidence; unlink forbidden while case is shared"
    error_id: "ERR_LEGAL_HOLD_ACTIVE | ERR_ACTIVE_SHARE_GRANTS"
    http_status: 409
    applies_to: "retention run, case archive, evidence unlink"

  - priority: 7
    category: business_safety
    check: "Integrity safety: recording with upload_status INTEGRITY_FAILED cannot be linked, shared, redacted, or categorized"
    error_id: ERR_INTEGRITY_FAILED
    http_status: 409
    applies_to: "link creation, redaction job creation, categorize, share access"

  - priority: 8
    category: business_constraint
    check: "Uniqueness and shape constraints: badge_number unique among ACTIVE/SUSPENDED officers; serial_number unique per agency; case_number unique among non-ARCHIVED cases; content_hash_sha256 is 64 lowercase hex; duration_seconds in 1..14400; trigger_code member of ACTIVE policy's recording_triggers"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "create/patch endpoints"

  - priority: 9
    category: business_constraint
    check: "Categorization policy: when ACTIVE policy has tagging_required == true, upload without category is rejected; category must be a valid enum; upload or policy-dependent actions with NO ACTIVE policy at all are refused"
    error_id: "ERR_CATEGORY_REQUIRED | ERR_NO_ACTIVE_POLICY"
    http_status: 422
    applies_to: "POST recordings, PATCH categorize, share-grant create"

  - priority: 10
    category: business_constraint
    check: "Device workflow constraints: assign requires docked, healthy, battery >= 20, officer ACTIVE and deviceless; one OPEN docking session per device"
    error_id: "ERR_DEVICE_NOT_DOCKED | ERR_DEVICE_UNHEALTHY | ERR_BATTERY_TOO_LOW | ERR_OFFICER_NOT_ACTIVE | ERR_OFFICER_ALREADY_HAS_DEVICE"
    http_status: 409
    applies_to: "device assign/dock/undock"

  - priority: 11
    category: business_temporal
    check: "Temporal validity: recorded_at <= logical now; share-grant expires_in_days in 1..90; access endpoint rejects grant whose expires_at <= now even before the sweep runs (lazy expiry check)"
    error_id: "ERR_VALIDATION | ERR_GRANT_EXPIRED"
    http_status: 422
    applies_to: "recording upload, share-grant create, share access"

  - priority: 12
    category: business_referential
    check: "Referential gates: officer suspend/retire blocked while device assigned; retire blocked while lead on OPEN/UNDER_REVIEW case; case submit-review requires evidence_count >= 1 and all linked evidence ACTIVE/RETENTION_DUE; case close requires no PENDING_REVIEW recordings"
    error_id: "ERR_DEVICE_STILL_ASSIGNED | ERR_LEAD_CASES_OPEN | ERR_CASE_EMPTY | ERR_EVIDENCE_NOT_READY | ERR_REVIEWS_OUTSTANDING"
    http_status: 409
    applies_to: "officer lifecycle, case lifecycle"

  - priority: 13
    category: business_fiscal
    check: "Budget plan supersession ordering: new plan effective_from_month strictly later than current ACTIVE plan's"
    error_id: ERR_PLAN_NOT_LATER
    http_status: 409
    applies_to: "POST storage-budget-plans"

  - priority: 14
    category: business_constraint
    check: "OCC: expected_case_version matches case.version on share-grant creation"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /agencies/{agencyId}/cases/{caseId}/share-grants"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving (logical clock) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical UTC clock. Default before any call: 2026-09-01T00:00:00Z. The clock never falls back to wall-clock time; all retention/expiry/dock-charge computations read this clock."
    roles: [AgencyAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []

  # --- Agency ---
  - method: POST
    path: "/agencies"
    description: "Create an agency (tenant root)"
    roles: [AgencyAdmin]
    code: 201
    input: [name, "timezone?"]
    output: Agency
    side_effects: ["storage_used_bytes = 0; storage_posture = OK"]

  - method: GET
    path: "/agencies/{agencyId}"
    description: "Get an agency"
    roles: [AgencyAdmin, DeviceCoordinator, Officer, Supervisor, RedactionTechnician, RecordsOfficer]
    code: 200
    input: []
    output: Agency
    side_effects: []

  # --- AgencyPolicy ---
  - method: POST
    path: "/agencies/{agencyId}/policies"
    description: "Create a policy (DRAFT)"
    roles: [AgencyAdmin]
    code: 201
    input: [recording_triggers, tagging_required, supervisor_review_rate_pct, default_share_expiry_days]
    output: AgencyPolicy
    side_effects: ["status = DRAFT"]

  - method: POST
    path: "/agencies/{agencyId}/policies/{policyId}/activate"
    description: "Activate a DRAFT policy (fails if another policy is ACTIVE)"
    roles: [AgencyAdmin]
    code: 200
    input: []
    output: AgencyPolicy
    side_effects: ["status DRAFT -> ACTIVE; AuditLogEntry POLICY_ACTIVATED"]

  - method: POST
    path: "/agencies/{agencyId}/policies/{policyId}/supersede"
    description: "Supersede the ACTIVE policy (used before activating a replacement)"
    roles: [AgencyAdmin]
    code: 200
    input: []
    output: AgencyPolicy
    side_effects: ["status ACTIVE -> SUPERSEDED; AuditLogEntry POLICY_SUPERSEDED"]

  # --- StorageBudgetPlan ---
  - method: POST
    path: "/agencies/{agencyId}/storage-budget-plans"
    description: "Create a budget plan; atomically supersedes the current ACTIVE plan (new effective_from_month must be strictly later)"
    roles: [AgencyAdmin]
    code: 201
    input: [fiscal_year_start_month, monthly_budget_cents, cost_per_gb_month_cents, alert_threshold_pct, effective_from_month]
    output: StorageBudgetPlan
    side_effects: ["prior ACTIVE plan -> SUPERSEDED; storage_posture recomputed; AuditLogEntry BUDGET_PLAN_SUPERSEDED (when a prior plan existed)"]

  - method: GET
    path: "/agencies/{agencyId}/storage/budget-projection"
    description: "Multi-year storage budget projection (computation per calculations.storage_monthly_cost_cents + multi_year_budget_projection)"
    roles: [AgencyAdmin, RecordsOfficer]
    code: 200
    input: ["months?", "plan_growth_bps?"]
    output: "{ current_month_accrued_cost_cents: integer, projection_month_cost_cents: integer, posture: string, months: array, total_projected_cost_cents: integer, first_over_budget_month_index: integer }"
    side_effects: []

  # --- Officer ---
  - method: POST
    path: "/agencies/{agencyId}/officers"
    description: "Register an officer"
    roles: [AgencyAdmin]
    code: 201
    input: [badge_number, full_name, rank]
    output: Officer
    side_effects: ["status = ACTIVE; recordings_uploaded_count = 0; pending_review_count = 0"]

  - method: GET
    path: "/agencies/officers"
    description: "List officers (filterable; agency_id filter required in practice)"
    roles: [AgencyAdmin, DeviceCoordinator, Supervisor, RecordsOfficer]
    code: 200
    input: ["agency_id?", "status?", "limit?", "offset?"]
    output: "Officer[]"
    side_effects: []

  - method: GET
    path: "/agencies/{agencyId}/officers/{officerId}"
    description: "Get an officer"
    roles: [AgencyAdmin, DeviceCoordinator, Supervisor, RecordsOfficer, Officer]
    code: 200
    input: []
    output: Officer
    side_effects: []

  - method: POST
    path: "/agencies/{agencyId}/officers/{officerId}/suspend"
