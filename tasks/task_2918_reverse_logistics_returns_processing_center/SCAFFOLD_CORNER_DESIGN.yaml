              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 1, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /receipts"
              payload: { rma_id: "${rma_id}", tracking_reference: "TRK-VA5", gross_weight_grams: 1400 }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_RMA_EXPIRED"
            - "GET /receipts?rma_id=${rma_id} returns total_count == 0"
            - "Rewinding the clock one millisecond to 2026-08-04T23:59:59.999Z and re-sending the same receipt returns HTTP 201, which pins the comparison as strict"

      - name: corner_val_hazardous_line_cannot_be_graded_without_quarantine
        claim_type: Violation → Error
        grounds:
          - validations[priority 33 ERR_QUARANTINE_REQUIRED]
          - entities.CatalogItem.fields.hazard_class
          - errors.ERR_QUARANTINE_REQUIRED
        distinguishing_aspect: "A LITHIUM_BATTERY line sitting in RECEIVED_UNGRADED is refused grading with 409 ERR_QUARANTINE_REQUIRED, and its condition_grade stays UNGRADED."
        test_recipe:
          setup:
