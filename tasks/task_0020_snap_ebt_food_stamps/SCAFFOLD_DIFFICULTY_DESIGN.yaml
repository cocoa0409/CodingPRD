  # =====================================================================
  # Rule 6 — boundary_precision_check (≥2 instances, different metrics + endpoints)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: abawd_county_unemployment_at_ten_percent_exactly
        grounds:
          - state_machines.ABAWDWaiver.PENDING_to_APPROVED
          - entities.ABAWDWaiver.fields.county_unemployment_pct
          - entities.ABAWDWaiver.fields.status
        distinguishing_aspect: |
          Numeric `>=` boundary on county_unemployment_pct (metric: percent).
          Endpoint: POST /snap/abawd-waivers/{id}/approve. county=10.00
          exactly satisfies `>= 10.00` so waiver APPROVES; 9.99 would fail.
          Different metric/endpoint from
          fraud_velocity_min_transaction_count_at_four_exactly (count metric,
          /purchase-transactions/{id}/settle).
