              as: MemberRepresentative
              as_user_id: "${mem_rv_id}"
              captures: { use_f2_id: $.data.id }
            - call: "POST /coop/contract-usages"
              payload: { contract_id: "${mc_id}", member_agency_id: "${mem_rv_id}", line_item_id: "${li_liner_id}", piggyback_analysis_id: "${pb_rv_id}", quantity: 1 }
              as: MemberRepresentative
              as_user_id: "${mem_rv_id}"
              captures: { use_f3_id: $.data.id }
            - call: "POST /coop/contract-usages/${use_f3_id}/disposition"
              payload: { action: "CONFIRM" }
              as: MemberRepresentative
              as_user_id: "${mem_rv_id}"
            - call: "POST /coop/contract-usages/${use_f3_id}/disposition"
              payload: { action: "RETRACT" }
              as: MemberRepresentative
              as_user_id: "${mem_rv_id}"
            - call: "POST /coop/usage-reports"
              payload: { contract_id: "${mc_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T23:59:59Z" }
              as: SupplierRepresentative
              as_user_id: "${sup_a_id}"
              captures: { rpt_id: $.data.id }
