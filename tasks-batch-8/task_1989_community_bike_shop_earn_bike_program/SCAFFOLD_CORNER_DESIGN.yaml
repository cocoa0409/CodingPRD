            - { call: "POST /training-sessions/${s2}/complete", payload: { marks: [ { attendance_id: "${a2}", outcome: "ATTENDED" } ] }, as: ShopCoordinator }
          trigger:
            - { call: "POST /volunteers/${v}/promote", as: ShopCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /volunteers/${v}/promote", as: ProgramDirector, captures: { sk: $.data.skill_level } }
          assert:
            - "promote as ShopCoordinator -> error_id ERR_FORBIDDEN"
            - "promote as ProgramDirector succeeds: skill_level == APPRENTICE"

