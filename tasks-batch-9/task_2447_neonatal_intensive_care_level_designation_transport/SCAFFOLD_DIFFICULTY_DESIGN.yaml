  - rule_id: cross_entity_state_dependency
    instances:

      - name: departure_depends_on_referral_status
        grounds:
          - validations[priority=9]
          - state_machines.TransportRun.STABILIZING_to_EN_ROUTE
          - state_machines.Referral.withdraw
          - errors[ERR_DEPENDENT_STATE_INVALID]
        distinguishing_aspect: |
          Entity pair (TransportRun -> Referral): the run is in a perfectly legal
          state with a complete bundle, and the only thing wrong is the status of
          another entity two hops away (run -> reservation -> referral). The
          referral is WITHDRAWN by the referring side, which does not touch the
          run at all, so the failure can only come from the cross-entity read.
        test_recipe:
          setup:
            - "Prelude as above, plus the TRANSPORT_ISOLETTE asset."
            - "A 30.0-week, 1250 g HFOV referral is accepted at Regional NICU A; a GROUND run is dispatched, ON_SCENE and stabilized at 36.8 C / 60 mg/dL / 31 mmHg / 92% (score 92, bundle complete)."
            - "The referring clinician then withdraws the referral, releasing the hold."
          setup_api_calls:
            - *k_clock
            - *k_std1
            - *k_std2
            - *k_std3
            - *k_unit_a
            - *k_unit_b
            - *k_cred_neo
            - *k_cred_rn
            - *k_vent
            - *k_hfov
            - *k_isolette
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-Y1", gestational_age_weeks: 30.0, birth_weight_grams: 1250, support_modality: "HFOV" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_y1: $.data.id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_y1: $.data.version }
            - call: "POST /referrals/${ref_y1}/accept"
              payload: { expected_unit_version: "${v_y1}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { res_y1: $.data.reservation_id }
            - call: "POST /transport-runs"
              payload: { reservation_id: "${res_y1}", isolette_asset_id: "${isolette_a}", mode: "GROUND", crew_composition: ["TRANSPORT_RN", "NNP"], depart_at: "2026-08-02T08:00:00Z", planned_return_at: "2026-08-02T12:00:00Z", weather_minimums_met: false }
              as: TransportCoordinator
              as_user_id: "coord-1"
              captures: { run_y1: $.data.id }
            - call: "POST /transport-runs/${run_y1}/dispatch"
              payload: {}
              as: TransportCoordinator
              as_user_id: "coord-1"
            - call: "POST /transport-runs/${run_y1}/on-scene"
              payload: {}
              as: TransportCoordinator
              as_user_id: "coord-1"
            - call: "POST /transport-runs/${run_y1}/stabilize"
              payload: { temp_c: 36.8, glucose_mg_dl: 60, mean_bp_mmhg: 31, spo2_pct: 92 }
              as: TransportCoordinator
              as_user_id: "coord-1"
            - call: "POST /referrals/${ref_y1}/withdraw"
              payload: {}
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
          trigger:
            - call: "POST /transport-runs/${run_y1}/depart"
