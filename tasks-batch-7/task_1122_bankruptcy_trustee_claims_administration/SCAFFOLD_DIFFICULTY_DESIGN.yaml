  # =====================================================================
  # Rule 3 — non_linear_state_machine: two instances on DIFFERENT entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_reconsideration_cycle_allowed_to_review_to_objected_to_allowed
        grounds:
          - state_machines.Claim.ALLOWED_to_UNDER_REVIEW
          - state_machines.Claim.OBJECTED_to_ALLOWED
        distinguishing_aspect: |
          Entity = Claim. Cyclic shape: a claim ALLOWED at 500,000 is reopened
          (allowed total decremented), objected to, and re-allowed at a reduced
          settled amount of 200,000 — the register total must track both the
          unwind and the re-allow, which a linear pipeline cannot express.
        test_recipe:
          setup:
            - "Case in CLAIMS_ADMINISTRATION; one claim ALLOWED at 500,000 (allowed_claims_total_cents == 500000)"
          setup_api_calls:
            - call: "POST /trustee/creditors"
              payload: { legal_name: "Creditor E", creditor_ref: "CR-E-1", contact_email: "e@x.com" }
              as: Clerk
              captures: { cred_e: $.data.id }
            - call: "POST /trustee/cases"
              payload: { case_number: "26-10005", debtor_name: "Debtor Five", filed_on: "2026-01-15T00:00:00Z", district: "D.Del.", trustee_user_id: "trust-0001" }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /trustee/cases/${case_id}/assets"
              payload: { description: "Boat", scheduled_value_cents: 600000 }
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${case_id}/begin_investigation"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${case_id}/set_bar_date"
              payload: { bar_date: "2026-06-01T00:00:00Z" }
              as: Clerk
            - call: "POST /trustee/cases/${case_id}/claims"
              payload: { creditor_id: "${cred_e}", received_at: "2026-02-01T00:00:00Z", filed_amount_cents: 500000, priority_class: "GENERAL_UNSECURED" }
              as: Creditor
              as_user_id: "${cred_e}"
              captures: { claim_id: $.data.id }
            - call: "POST /trustee/claims/${claim_id}/review"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/claims/${claim_id}/allow"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
          trigger:
            - call: "POST /trustee/claims/${claim_id}/reopen"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "GET /trustee/cases/${case_id}"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
