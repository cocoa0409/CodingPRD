              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e1_id: $.data.id }
            - call: "POST /employees"
              payload: { team_id: "${t_a}", employee_number: "E-1002", work_email: "e1002@corp.example", home_timezone: "America/New_York", tenure_start_date: "2024-03-04", demographic_band: "BAND_B", manager_user_id: "mgr-1", hr_partner_user_id: "hrbp-1", disability_accommodation_on_file: false }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e2_id: $.data.id }
            - call: "POST /employees"
              payload: { team_id: "${t_a}", employee_number: "E-1003", work_email: "e1003@corp.example", home_timezone: "America/New_York", tenure_start_date: "2024-03-04", demographic_band: "BAND_C", manager_user_id: "mgr-1", hr_partner_user_id: "hrbp-1", disability_accommodation_on_file: false }
              as: HRBusinessPartner
