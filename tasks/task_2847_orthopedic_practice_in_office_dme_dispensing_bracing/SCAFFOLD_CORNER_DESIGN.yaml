  - section: consistency_model
    instances:
      - name: corner_immediate_consistency_of_derived_state_within_the_writing_response
        claim_type: Immediate Consistency
        grounds:
          - complexity_profile.consistency_model (immediate)
          - endpoints[POST /dme/par-levels/{id}/stock-receipts]
          - endpoints[GET /dme/clinics/{id}/dispensing-summary]
        distinguishing_aspect: |
          The declared model is immediate, so no derived value is ever allowed to
          lag: the writing call's OWN response body must already show the
          recomputed shelf posture and the recomputed clinic posture, and a read
          issued straight afterwards must agree with it field for field. The
          sharpest case is the reservation, whose response is a DispenseEncounter
          and therefore carries none of the shelf numbers it just changed -- the
          shelf's reserved_qty and version have to be correct the instant the
          next request reads them, and the clinic summary has to reflect the same
          write without any settling step.
