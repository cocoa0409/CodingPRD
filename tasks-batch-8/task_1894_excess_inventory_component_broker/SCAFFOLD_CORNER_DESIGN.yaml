              payload: { bin_code: "BIN-DR1", capacity_units: 20 }
              as: BrokerOps
              captures: { b_id: $.data.id }
            - call: "POST /buy-offers"
              payload: { seller_id: "${s_id}", mpn: "MCP6002", quantity: 5, ask_price_per_unit_cents: 4000, provenance_doc_url: "https://docs.x.com/pdr.pdf" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { o_id: $.data.id }
            - call: "POST /buy-offers/${o_id}/accept"
              payload: { agreed_unit_price_cents: 4000, acquisition_mode: "BROKER_OWNED" }
              as: BrokerOps
            - call: "POST /buy-offers/${o_id}/receive"
              payload: {}
              as: BrokerOps
            - call: "POST /buy-offers/${o_id}/inspect"
              payload: { outcome: "PASS" }
              as: Inspector
            - call: "POST /buy-offers/${o_id}/convert-to-lot"
              payload: { storage_bin_id: "${b_id}" }
              as: BrokerOps
              captures: { lot_id: $.data.id }
            - call: "POST /listings"
              payload: { lot_id: "${lot_id}", asking_price_per_unit_cents: 5000 }
              as: BrokerOps
              captures: { l_id: $.data.id }
            - call: "POST /listings/${l_id}/activate"
              payload: {}
              as: BrokerOps
            - call: "POST /sales-orders"
              payload: { customer_id: "${c_id}", listing_id: "${l_id}", quantity: 2 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /sales-orders/${ord_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "Customer.${c_id}.open_order_exposure_cents == 0"
            - "Lot.${lot_id}.status == LISTED and qty_available == 5 and qty_reserved == 0"

      - name: default_clock_is_fixed_start_time
        claim_type: scheduled_actions
        grounds: ["entities.MarketPriceSnapshot.fields.observed_at"]
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-08-01T00:00:00Z: a snapshot posted first has observed_at 2026-08-01T00:00:00Z regardless of wall-clock time."
        test_recipe:
          setup: ["empty database; clock never set"]
          setup_api_calls: []
