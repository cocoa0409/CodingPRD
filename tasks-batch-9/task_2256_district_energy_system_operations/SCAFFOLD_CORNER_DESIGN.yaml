              captures: { loop_k_v_fresh: $.data.version, loop_k_reserved_1: $.data.committed_reserved_kw }
            - call: "POST /district-energy/dispatch-plans"
              payload: { loop_id: "${loop_k_id}", forecast_id: "${f_k_id}", expected_loop_version: "${loop_k_v_fresh}" }
              as: DispatchOperator
