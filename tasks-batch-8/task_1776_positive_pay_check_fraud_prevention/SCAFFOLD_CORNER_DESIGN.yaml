  - section: errors
    instances:
      - name: error_exception_not_open_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_EXCEPTION_NOT_OPEN]"]
        excluded_because:
          difficulty_instance: exception_not_open_beats_deadline_passed
          rationale: "Trigger path asserted there (decision on swept exception)."
      - name: error_decision_deadline_passed_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_DECISION_DEADLINE_PASSED]"]
        excluded_because:
          difficulty_instance: decision_deadline_exact_second_inclusive
          rationale: "Asserted at deadline + 1s there."
      - name: error_enrollment_not_active_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_ENROLLMENT_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: decision_blocked_while_enrollment_suspended
          rationale: "Decision on suspended enrollment asserted there; upload variant asserted in enrollment_suspended_beats_idempotency_conflict."
      - name: error_window_overlap_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_ACH_RULE_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: ach_rule_half_open_window_overlap
          rationale: "Overlap and open-ended variants both asserted there."
      - name: error_training_conflict_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_TRAINING_SCHEDULE_CONFLICT]"]
        excluded_because:
          difficulty_instance: training_session_buffered_window_conflict
          rationale: "Buffered adjacency conflict asserted there."
      - name: error_account_not_active_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_ACCOUNT_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: upload_blocked_when_account_closed
          rationale: "Upload on closed account asserted there; ingestion variant asserted in presented_items_on_closed_account_rejected."
      - name: error_not_activatable_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_ENROLLMENT_NOT_ACTIVATABLE]"]
        excluded_because:
          difficulty_instance: activation_requires_completed_training
          rationale: "Both no-session and not-completed variants asserted there."

  - section: rbac
    instances:
      - name: viewer_decision_forbidden
        claim_type: role_denial
        grounds: [roles]
        distinguishing_aspect: "CustomerViewer (user_role VIEWER) may read but cannot decision exceptions."
        test_recipe:
          setup: ["ACTIVE REVERSE-tier enrollment with a VIEWER user and one OPEN exception"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "ViewCo", tier: "REVERSE_POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "850001" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
