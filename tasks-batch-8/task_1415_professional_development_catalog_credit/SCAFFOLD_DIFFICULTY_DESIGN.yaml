# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1415: PD Catalog & Credit Management (beyond-expert difficulty)
# 2 instances per Difficulty Rule x 9 rules = 18 instances.
# Every chain replays against SCAFFOLD.yaml §1.2/§1.4/§1.5/§1.6 from empty-DB.
# Logical clock default: 2026-08-01T00:00:00Z (set explicitly in every chain).
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_credit_conversion_district_vs_state
        grounds:
          - calculations.credit_conversion
          - entities.TranscriptEntry.fields.district_credit
          - entities.TranscriptEntry.fields.state_ceu
        distinguishing_aspect: |
          One 24-hour completion yields district_credit == 1.6 (floor per entry,
          15 h/credit) AND state_ceu == 2.40 (half-up, 10 h/CEU) on the SAME
          TranscriptEntry — two valid conversions of identical hours diverge on
          the transcript/credit entity domain.
        test_recipe:
          setup:
            - "Building B1; teacher T1 (kind TEACHER, lane MA, building B1); instructor INS1 (kind SPECIALIST)"
            - "Course C1: 24 clock hours, fee 0, no compliance tag"
            - "Section S1 of C1: capacity 5, window 2026-08-01..2026-08-10, session 2026-08-15T09:00..2026-08-20T17:00, PUBLISHED, meeting M1 2026-08-15 10:00-12:00 room R1"
            - "T1 REGISTERED in S1; PRESENT on M1; attendance VERIFIED; survey WAIVED; clock past starts_at; ops-run moved S1 to IN_SESSION"
          setup_api_calls:
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/buildings", payload: { name: "North HS", building_code: "NHS" }, as: PDCoordinator, captures: { b1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "T One", email: "t1@x.com", employee_kind: "TEACHER", primary_building_id: "${b1}", base_lane: "MA" }, as: PDCoordinator, captures: { t1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "I One", email: "i1@x.com", employee_kind: "SPECIALIST", primary_building_id: "${b1}", base_lane: "BA" }, as: PDCoordinator, captures: { ins1: "$.data.id" } }
            - { call: "POST /pd/courses", payload: { course_code: "MATH-24", title: "Deep Math", delivery_mode: "IN_PERSON", clock_hours: 24, fee_cents: 0 }, as: PDCoordinator, captures: { c1: "$.data.id" } }
            - { call: "POST /pd/sections", payload: { course_id: "${c1}", term: "2026-FALL", instructor_id: "${ins1}", building_id: "${b1}", room: "R1", seat_capacity: 5, starts_at: "2026-08-15T09:00:00Z", ends_at: "2026-08-20T17:00:00Z", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-10T00:00:00Z" }, as: PDCoordinator, captures: { s1: "$.data.id" } }
            - { call: "POST /pd/sections/${s1}/meetings", payload: { starts_at: "2026-08-15T10:00:00Z", ends_at: "2026-08-15T12:00:00Z", room: "R1" }, as: PDCoordinator, captures: { m1: "$.data.id" } }
            - { call: "POST /pd/sections/${s1}/publish", payload: {}, as: PDCoordinator }
            - { call: "POST /pd/registrations", payload: { teacher_id: "${t1}", section_id: "${s1}" }, as: Teacher, as_user_id: "${t1}", captures: { r1: "$.data.id" } }
            - { call: "POST /pd/meetings/${m1}/attendance", payload: { records: [ { registration_id: "${r1}", mark: "PRESENT" } ] }, as: Instructor, as_user_id: "${ins1}" }
            - { call: "POST /pd/registrations/${r1}/verify-attendance", payload: {}, as: Instructor, as_user_id: "${ins1}" }
            - { call: "POST /pd/registrations/${r1}/waive-survey", payload: { reason: "paper form collected" }, as: PDCoordinator }
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/ops-runs", payload: {}, as: PDCoordinator }
            - { call: "POST /pd/registrations/${r1}/complete", payload: {}, as: PDCoordinator }
          trigger:
            - { call: "GET /pd/employees/${t1}/transcript", payload: {}, as: PDCoordinator, captures: { e1: "$.data[0].id", dc: "$.data[0].district_credit", ceu: "$.data[0].state_ceu", hrs: "$.data[0].clock_hours" } }
          assert:
            - "TranscriptEntry.${e1}.clock_hours == 24"
            - "TranscriptEntry.${e1}.district_credit == 1.6  (floor(24*2/3)/10)"
            - "TranscriptEntry.${e1}.state_ceu == 2.4  (round(24/10, 2) half-up)"
            - "district_credit (1.6) != state_ceu (2.4) for identical input hours"
            - "TranscriptEntry.${e1}.counts_toward_lane == true (no compliance tag)"

      - name: dual_variant_budget_availability_encumbrance_vs_cash
        grounds:
          - calculations.budget_availability
          - entities.BuildingBudget.fields.available_cents
          - entities.BuildingBudget.fields.encumbered_cents
        distinguishing_aspect: |
          The same BuildingBudget ledger (allocated 100000, one 10000 encumbrance,
          nothing spent) reports available_cents == 90000 on the encumbrance basis
          (the blocking variant) but cash_basis_available_cents == 100000 — two
          valid availability algorithms diverge on the budget/fiscal domain,
          distinct from the credit domain of the sibling instance.
        test_recipe:
          setup:
            - "Building B1 with FY2026 budget allocated_cents 100000, OPEN"
            - "Teacher T1 (building B1); instructor INS1; course C1 fee 10000, 15 h"
            - "Section S1 PUBLISHED (capacity 5, std window/session), meeting M1"
            - "T1 REGISTERED in S1 (fee encumbered on B1's budget)"
          setup_api_calls:
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/buildings", payload: { name: "South ES", building_code: "SES" }, as: PDCoordinator, captures: { b1: "$.data.id" } }
            - { call: "POST /pd/budgets", payload: { building_id: "${b1}", fiscal_year: 2026, allocated_cents: 100000 }, as: BusinessOfficer, captures: { bud1: "$.data.id" } }
            - { call: "POST /pd/budgets/${bud1}/open", payload: {}, as: BusinessOfficer }
            - { call: "POST /pd/employees", payload: { full_name: "T Two", email: "t2@x.com", employee_kind: "TEACHER", primary_building_id: "${b1}", base_lane: "BA" }, as: PDCoordinator, captures: { t1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "I Two", email: "i2@x.com", employee_kind: "SPECIALIST", primary_building_id: "${b1}", base_lane: "MA" }, as: PDCoordinator, captures: { ins1: "$.data.id" } }
            - { call: "POST /pd/courses", payload: { course_code: "FEE-15", title: "Fee Course", delivery_mode: "VIRTUAL", clock_hours: 15, fee_cents: 10000 }, as: PDCoordinator, captures: { c1: "$.data.id" } }
            - { call: "POST /pd/sections", payload: { course_id: "${c1}", term: "2026-FALL", instructor_id: "${ins1}", building_id: "${b1}", room: "R1", seat_capacity: 5, starts_at: "2026-08-15T09:00:00Z", ends_at: "2026-08-20T17:00:00Z", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-10T00:00:00Z" }, as: PDCoordinator, captures: { s1: "$.data.id" } }
            - { call: "POST /pd/sections/${s1}/meetings", payload: { starts_at: "2026-08-15T10:00:00Z", ends_at: "2026-08-15T12:00:00Z", room: "R1" }, as: PDCoordinator }
            - { call: "POST /pd/sections/${s1}/publish", payload: {}, as: PDCoordinator }
            - { call: "POST /pd/registrations", payload: { teacher_id: "${t1}", section_id: "${s1}" }, as: Teacher, as_user_id: "${t1}", captures: { r1: "$.data.id" } }
          trigger:
            - { call: "GET /pd/budgets/${bud1}/summary", payload: {}, as: BusinessOfficer, captures: { avail: "$.data.available_cents", cash: "$.data.cash_basis_available_cents", enc: "$.data.encumbered_cents", spent: "$.data.spent_cents" } }
          assert:
            - "summary.encumbered_cents == 10000"
            - "summary.spent_cents == 0"
            - "summary.available_cents == 90000  (100000 - 10000 - 0, encumbrance basis)"
            - "summary.cash_basis_available_cents == 100000  (100000 - 0, cash basis)"
            - "available_cents (90000) != cash_basis_available_cents (100000) on the same ledger"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_reimbursement_nested_min
        grounds:
          - calculations.reimbursement_amount
          - state_machines.ExternalWorkshopRequest.ATTENDED_to_REIMBURSED
        distinguishing_aspect: |
          Mode (a): reimbursed_cents = min(receipt_cents, est_cost_cents,
          remaining_annual_cap) — three inputs with nested-min interaction and a
          state-filtered input set (only REIMBURSED workshops in the same fiscal
          year count toward prior_reimbursed). Here min(150000, 120000, 10000)
          selects the cap remainder 10000, not the receipt or the estimate.
        test_recipe:
          setup:
            - "Building B1, FY2026 budget allocated 1000000 OPEN; teacher T1 (B1); admin ADM1 (kind ADMIN, building B1)"
            - "Workshop W1: est 240000, starts 2026-09-01, APPROVED, completed with receipt 240000, REIMBURSED 240000 (min(240000,240000,250000))"
            - "Workshop W2: est 120000, starts 2026-10-05, APPROVED, completed with receipt 150000, ATTENDED awaiting reimbursement"
            - "remaining_cap = 250000 - 240000 = 10000"
          setup_api_calls:
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/buildings", payload: { name: "East MS", building_code: "EMS" }, as: PDCoordinator, captures: { b1: "$.data.id" } }
            - { call: "POST /pd/budgets", payload: { building_id: "${b1}", fiscal_year: 2026, allocated_cents: 1000000 }, as: BusinessOfficer, captures: { bud1: "$.data.id" } }
            - { call: "POST /pd/budgets/${bud1}/open", payload: {}, as: BusinessOfficer }
            - { call: "POST /pd/employees", payload: { full_name: "T Three", email: "t3@x.com", employee_kind: "TEACHER", primary_building_id: "${b1}", base_lane: "MA" }, as: PDCoordinator, captures: { t1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "A One", email: "a1@x.com", employee_kind: "ADMIN", primary_building_id: "${b1}", base_lane: "DOC" }, as: PDCoordinator, captures: { adm1: "$.data.id" } }
            - { call: "POST /pd/workshop-requests", payload: { teacher_id: "${t1}", title: "W1", provider: "P1", starts_at: "2026-09-01T09:00:00Z", ends_at: "2026-09-02T17:00:00Z", est_cost_cents: 240000, clock_hours_claimed: 20 }, as: Teacher, as_user_id: "${t1}", captures: { w1: "$.data.id" } }
            - { call: "POST /pd/workshop-requests/${w1}/submit", payload: {}, as: Teacher, as_user_id: "${t1}" }
            - { call: "POST /pd/workshop-requests/${w1}/approve", payload: {}, as: BuildingAdmin, as_user_id: "${adm1}" }
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/workshop-requests/${w1}/complete", payload: { actual_hours: 20, receipt_cents: 240000 }, as: Teacher, as_user_id: "${t1}" }
            - { call: "POST /pd/workshop-requests/${w1}/reimburse", payload: {}, as: BusinessOfficer, as_user_id: "officer-1", captures: { paid1: "$.data.reimbursed_cents" } }
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/workshop-requests", payload: { teacher_id: "${t1}", title: "W2", provider: "P2", starts_at: "2026-10-05T09:00:00Z", ends_at: "2026-10-06T17:00:00Z", est_cost_cents: 120000, clock_hours_claimed: 12 }, as: Teacher, as_user_id: "${t1}", captures: { w2: "$.data.id" } }
            - { call: "POST /pd/workshop-requests/${w2}/submit", payload: {}, as: Teacher, as_user_id: "${t1}" }
            - { call: "POST /pd/workshop-requests/${w2}/approve", payload: {}, as: BuildingAdmin, as_user_id: "${adm1}" }
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-10-07T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/workshop-requests/${w2}/complete", payload: { actual_hours: 12, receipt_cents: 150000 }, as: Teacher, as_user_id: "${t1}" }
          trigger:
            - { call: "POST /pd/workshop-requests/${w2}/reimburse", payload: {}, as: BusinessOfficer, as_user_id: "officer-1", captures: { paid2: "$.data.reimbursed_cents", w2_status: "$.data.status" } }
          assert:
            - "W1 reimbursed_cents == 240000 (min(240000, 240000, 250000))"
            - "W2 reimbursed_cents == 10000 (min(150000 receipt, 120000 est, 10000 remaining cap))"
            - "W2 status == REIMBURSED"
            - "T1 FY2026 reimbursed total == 250000 == ANNUAL_CAP_CENTS (240000 + 10000)"

      - name: combinatorial_transcript_rollup_rounding_order
        grounds:
          - calculations.transcript_rollup
          - calculations.credit_conversion
          - entities.Employee.fields.lane_credit_balance
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — per-entry floor THEN sum.
          A 7-hour entry (0.4) plus an 8-hour entry (0.5) roll up to 0.9, whereas
          the forbidden aggregate-convert order (floor(15*2/3)/10) yields 1.0.
          Distinct mode from the sibling's nested-min formula.
        test_recipe:
          setup:
            - "Building B1; teacher T1; instructor INS1"
            - "Course C7 (7 h, fee 0) with section S7 (session 2026-08-15..2026-08-20) and course C8 (8 h, fee 0) with section S8 (session 2026-08-22..2026-08-27); non-overlapping sessions"
            - "T1 completed BOTH sections (attendance VERIFIED + survey WAIVED + IN_SESSION via ops-run each time)"
            - "Per-entry district credits: floor(7*2/3)/10 = 0.4 and floor(8*2/3)/10 = 0.5"
          setup_api_calls:
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/buildings", payload: { name: "West HS", building_code: "WHS" }, as: PDCoordinator, captures: { b1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "T Four", email: "t4@x.com", employee_kind: "TEACHER", primary_building_id: "${b1}", base_lane: "BA" }, as: PDCoordinator, captures: { t1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "I Four", email: "i4@x.com", employee_kind: "SPECIALIST", primary_building_id: "${b1}", base_lane: "MA" }, as: PDCoordinator, captures: { ins1: "$.data.id" } }
            - { call: "POST /pd/courses", payload: { course_code: "C-7H", title: "Seven Hours", delivery_mode: "VIRTUAL", clock_hours: 7, fee_cents: 0 }, as: PDCoordinator, captures: { c7: "$.data.id" } }
            - { call: "POST /pd/courses", payload: { course_code: "C-8H", title: "Eight Hours", delivery_mode: "VIRTUAL", clock_hours: 8, fee_cents: 0 }, as: PDCoordinator, captures: { c8: "$.data.id" } }
            - { call: "POST /pd/sections", payload: { course_id: "${c7}", term: "2026-FALL", instructor_id: "${ins1}", building_id: "${b1}", room: "R1", seat_capacity: 5, starts_at: "2026-08-15T09:00:00Z", ends_at: "2026-08-20T17:00:00Z", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-10T00:00:00Z" }, as: PDCoordinator, captures: { s7: "$.data.id" } }
            - { call: "POST /pd/sections/${s7}/meetings", payload: { starts_at: "2026-08-15T10:00:00Z", ends_at: "2026-08-15T11:00:00Z", room: "R1" }, as: PDCoordinator, captures: { m7: "$.data.id" } }
            - { call: "POST /pd/sections/${s7}/publish", payload: {}, as: PDCoordinator }
            - { call: "POST /pd/sections", payload: { course_id: "${c8}", term: "2026-FALL", instructor_id: "${ins1}", building_id: "${b1}", room: "R1", seat_capacity: 5, starts_at: "2026-08-22T09:00:00Z", ends_at: "2026-08-27T17:00:00Z", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-18T00:00:00Z" }, as: PDCoordinator, captures: { s8: "$.data.id" } }
            - { call: "POST /pd/sections/${s8}/meetings", payload: { starts_at: "2026-08-22T10:00:00Z", ends_at: "2026-08-22T11:00:00Z", room: "R1" }, as: PDCoordinator, captures: { m8: "$.data.id" } }
            - { call: "POST /pd/sections/${s8}/publish", payload: {}, as: PDCoordinator }
            - { call: "POST /pd/registrations", payload: { teacher_id: "${t1}", section_id: "${s7}" }, as: Teacher, as_user_id: "${t1}", captures: { r7: "$.data.id" } }
            - { call: "POST /pd/registrations", payload: { teacher_id: "${t1}", section_id: "${s8}" }, as: Teacher, as_user_id: "${t1}", captures: { r8: "$.data.id" } }
            - { call: "POST /pd/meetings/${m7}/attendance", payload: { records: [ { registration_id: "${r7}", mark: "PRESENT" } ] }, as: Instructor, as_user_id: "${ins1}" }
            - { call: "POST /pd/registrations/${r7}/verify-attendance", payload: {}, as: Instructor, as_user_id: "${ins1}" }
            - { call: "POST /pd/registrations/${r7}/waive-survey", payload: { reason: "w" }, as: PDCoordinator }
            - { call: "POST /pd/meetings/${m8}/attendance", payload: { records: [ { registration_id: "${r8}", mark: "PRESENT" } ] }, as: Instructor, as_user_id: "${ins1}" }
            - { call: "POST /pd/registrations/${r8}/verify-attendance", payload: {}, as: Instructor, as_user_id: "${ins1}" }
            - { call: "POST /pd/registrations/${r8}/waive-survey", payload: { reason: "w" }, as: PDCoordinator }
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/ops-runs", payload: {}, as: PDCoordinator }
            - { call: "POST /pd/registrations/${r7}/complete", payload: {}, as: PDCoordinator }
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-08-23T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/ops-runs", payload: {}, as: PDCoordinator }
            - { call: "POST /pd/registrations/${r8}/complete", payload: {}, as: PDCoordinator }
          trigger:
            - { call: "GET /pd/employees/${t1}", payload: {}, as: PDCoordinator, captures: { bal: "$.data.lane_credit_balance" } }
            - { call: "GET /pd/employees/${t1}/transcript", payload: {}, as: PDCoordinator, captures: { n_entries: "$.data[1].id" } }
          assert:
            - "Two TranscriptEntry rows exist with district_credit values 0.4 and 0.5 (7h and 8h entries, order-agnostic)"
            - "Employee.${t1}.lane_credit_balance == 0.9 (0.4 + 0.5, per-entry-then-sum)"
            - "0.9 != 1.0 — the aggregate-convert order floor((7+8)*2/3)/10 = 1.0 is the rejected alternative"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: non_linear_workshop_revision_cycle
        grounds:
          - state_machines.ExternalWorkshopRequest.REJECTED_to_DRAFT
          - state_machines.ExternalWorkshopRequest.DRAFT_to_SUBMITTED
          - entities.ExternalWorkshopRequest.fields.revision_count
        distinguishing_aspect: |
          Cyclic machine on ExternalWorkshopRequest: DRAFT -> SUBMITTED ->
          REJECTED -> DRAFT -> SUBMITTED -> APPROVED traverses the revision loop
          once (revision_count 0 -> 1), proving REJECTED is non-terminal and the
          cycle preserves identity (same request id throughout).
        test_recipe:
          setup:
            - "Building B1, budget 500000 OPEN; teacher T1 (B1); admin ADM1 (B1)"
            - "Workshop W: est 50000, starts 2026-12-01 (lead time satisfied), submitted then REJECTED with reason"
          setup_api_calls:
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/buildings", payload: { name: "Central HS", building_code: "CHS" }, as: PDCoordinator, captures: { b1: "$.data.id" } }
            - { call: "POST /pd/budgets", payload: { building_id: "${b1}", fiscal_year: 2026, allocated_cents: 500000 }, as: BusinessOfficer, captures: { bud1: "$.data.id" } }
            - { call: "POST /pd/budgets/${bud1}/open", payload: {}, as: BusinessOfficer }
            - { call: "POST /pd/employees", payload: { full_name: "T Five", email: "t5@x.com", employee_kind: "TEACHER", primary_building_id: "${b1}", base_lane: "MA" }, as: PDCoordinator, captures: { t1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "A Five", email: "a5@x.com", employee_kind: "ADMIN", primary_building_id: "${b1}", base_lane: "DOC" }, as: PDCoordinator, captures: { adm1: "$.data.id" } }
            - { call: "POST /pd/workshop-requests", payload: { teacher_id: "${t1}", title: "W Cycle", provider: "PX", starts_at: "2026-12-01T09:00:00Z", ends_at: "2026-12-02T17:00:00Z", est_cost_cents: 50000, clock_hours_claimed: 10 }, as: Teacher, as_user_id: "${t1}", captures: { w: "$.data.id" } }
            - { call: "POST /pd/workshop-requests/${w}/submit", payload: {}, as: Teacher, as_user_id: "${t1}" }
            - { call: "POST /pd/workshop-requests/${w}/reject", payload: { reason: "cost too high" }, as: BuildingAdmin, as_user_id: "${adm1}", captures: { st_rej: "$.data.status" } }
            - { call: "POST /pd/workshop-requests/${w}/revise", payload: { est_cost_cents: 45000 }, as: Teacher, as_user_id: "${t1}", captures: { st_draft: "$.data.status", rc: "$.data.revision_count" } }
          trigger:
            - { call: "POST /pd/workshop-requests/${w}/submit", payload: {}, as: Teacher, as_user_id: "${t1}" }
            - { call: "POST /pd/workshop-requests/${w}/approve", payload: {}, as: BuildingAdmin, as_user_id: "${adm1}", captures: { st_fin: "$.data.status", appr: "$.data.approved_by_user_id" } }
            - { call: "GET /pd/budgets/${bud1}", payload: {}, as: PDCoordinator, captures: { enc: "$.data.encumbered_cents" } }
          assert:
            - "status after reject == REJECTED (captured ${st_rej})"
            - "status after revise == DRAFT and revision_count == 1 (cycle REJECTED -> DRAFT traversed)"
            - "final status == APPROVED on the SAME request id ${w}"
            - "approved_by_user_id == ${adm1}"
            - "budget.encumbered_cents == 45000 (revised estimate encumbered, not the original 50000)"

      - name: non_linear_registration_parallel_dimensions
        grounds:
          - state_machines.Registration.attendance_status
          - state_machines.Registration.survey_status
          - state_machines.Registration.REGISTERED_to_COMPLETED
        distinguishing_aspect: |
          Parallel state dimensions on Registration: survey_status can reach
          SUBMITTED while attendance_status is still PENDING (and vice versa) —
          the dimensions evolve independently, and REGISTERED -> COMPLETED is
          gated on BOTH. Distinct non-linear shape (parallel) on a different
          entity than the sibling's cycle (ExternalWorkshopRequest).
        test_recipe:
          setup:
            - "Building B1; teachers T1, T2; instructor INS1; course fee 0"
            - "Section S (capacity 2, std dates) PUBLISHED with meeting M"
            - "R1 (T1) and R2 (T2) REGISTERED; T1 submits survey EARLY (attendance still PENDING)"
            - "Both recorded PRESENT on M; both verified; clock 2026-08-16; ops-run moved S to IN_SESSION"
          setup_api_calls:
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/buildings", payload: { name: "Lincoln ES", building_code: "LES" }, as: PDCoordinator, captures: { b1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "T Six", email: "t6@x.com", employee_kind: "TEACHER", primary_building_id: "${b1}", base_lane: "BA" }, as: PDCoordinator, captures: { t1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "T Seven", email: "t7@x.com", employee_kind: "TEACHER", primary_building_id: "${b1}", base_lane: "BA15" }, as: PDCoordinator, captures: { t2: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "I Six", email: "i6@x.com", employee_kind: "SPECIALIST", primary_building_id: "${b1}", base_lane: "MA" }, as: PDCoordinator, captures: { ins1: "$.data.id" } }
            - { call: "POST /pd/courses", payload: { course_code: "PAR-6", title: "Parallel Dims", delivery_mode: "IN_PERSON", clock_hours: 6, fee_cents: 0 }, as: PDCoordinator, captures: { c1: "$.data.id" } }
            - { call: "POST /pd/sections", payload: { course_id: "${c1}", term: "2026-FALL", instructor_id: "${ins1}", building_id: "${b1}", room: "R1", seat_capacity: 2, starts_at: "2026-08-15T09:00:00Z", ends_at: "2026-08-20T17:00:00Z", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-10T00:00:00Z" }, as: PDCoordinator, captures: { s1: "$.data.id" } }
            - { call: "POST /pd/sections/${s1}/meetings", payload: { starts_at: "2026-08-15T10:00:00Z", ends_at: "2026-08-15T12:00:00Z", room: "R1" }, as: PDCoordinator, captures: { m1: "$.data.id" } }
            - { call: "POST /pd/sections/${s1}/publish", payload: {}, as: PDCoordinator }
            - { call: "POST /pd/registrations", payload: { teacher_id: "${t1}", section_id: "${s1}" }, as: Teacher, as_user_id: "${t1}", captures: { r1: "$.data.id" } }
            - { call: "POST /pd/registrations", payload: { teacher_id: "${t2}", section_id: "${s1}" }, as: Teacher, as_user_id: "${t2}", captures: { r2: "$.data.id" } }
            - { call: "POST /pd/registrations/${r1}/survey", payload: { overall_rating: 4, would_recommend: true }, as: Teacher, as_user_id: "${t1}" }
            - { call: "GET /pd/registrations/${r1}", payload: {}, as: PDCoordinator, captures: { sv1: "$.data.survey_status", at1: "$.data.attendance_status", st1: "$.data.status" } }
            - { call: "POST /pd/meetings/${m1}/attendance", payload: { records: [ { registration_id: "${r1}", mark: "PRESENT" }, { registration_id: "${r2}", mark: "PRESENT" } ] }, as: Instructor, as_user_id: "${ins1}" }
            - { call: "POST /pd/registrations/${r1}/verify-attendance", payload: {}, as: Instructor, as_user_id: "${ins1}" }
            - { call: "POST /pd/registrations/${r2}/verify-attendance", payload: {}, as: Instructor, as_user_id: "${ins1}" }
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/ops-runs", payload: {}, as: PDCoordinator }
          trigger:
            - { call: "POST /pd/registrations/${r2}/complete", payload: {}, as: PDCoordinator, captures: { err2: "$.data.error_id" } }
            - { call: "POST /pd/registrations/${r2}/waive-survey", payload: { reason: "coordinator waiver" }, as: PDCoordinator }
            - { call: "POST /pd/registrations/${r2}/complete", payload: {}, as: PDCoordinator, captures: { st2: "$.data.status" } }
            - { call: "POST /pd/registrations/${r1}/complete", payload: {}, as: PDCoordinator, captures: { st1f: "$.data.status" } }
          assert:
            - "After early survey: R1.survey_status == SUBMITTED while R1.attendance_status == PENDING and R1.status == REGISTERED (dimensions independent)"
            - "R2 complete with VERIFIED attendance but PENDING survey fails with ERR_SURVEY_NOT_SUBMITTED (attendance gate passes first, survey gate blocks)"
            - "After waive-survey: R2 completes -> status COMPLETED"
            - "R1 (survey SUBMITTED + attendance VERIFIED) completes -> status COMPLETED"
  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depths 3 and 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: cascade_drop_release_promote_encumber
        grounds:
          - state_machines.Registration.REGISTERED_to_DROPPED
          - state_machines.Registration.WAITLISTED_to_REGISTERED
          - calculations.seat_and_waitlist_allocation
          - calculations.budget_availability
        distinguishing_aspect: |
          Depth-3 chain from ONE trigger (teacher drop): drop mutates R1 ->
          DROPPED and releases B1's encumbrance (link 1); the freed seat promotes
          R2 WAITLISTED -> REGISTERED (link 2, caused by link 1's seat release);
          the promotion encumbers B2's budget (link 3, caused by link 2's
          promotion). Two buildings prove the cascade crosses aggregate roots.
        test_recipe:
          setup:
            - "Buildings B1 and B2, each with FY2026 budget 500000 OPEN"
            - "T1 (building B1), T2 (building B2), instructor INS1; course fee 20000, 10 h"
            - "Section S capacity 1 PUBLISHED with meeting M (std dates)"
            - "R1: T1 REGISTERED (B1 encumbered 20000); R2: T2 WAITLISTED with waitlist_seq 1"
          setup_api_calls:
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/buildings", payload: { name: "B One", building_code: "B1" }, as: PDCoordinator, captures: { b1: "$.data.id" } }
            - { call: "POST /pd/buildings", payload: { name: "B Two", building_code: "B2" }, as: PDCoordinator, captures: { b2: "$.data.id" } }
            - { call: "POST /pd/budgets", payload: { building_id: "${b1}", fiscal_year: 2026, allocated_cents: 500000 }, as: BusinessOfficer, captures: { bud1: "$.data.id" } }
            - { call: "POST /pd/budgets/${bud1}/open", payload: {}, as: BusinessOfficer }
            - { call: "POST /pd/budgets", payload: { building_id: "${b2}", fiscal_year: 2026, allocated_cents: 500000 }, as: BusinessOfficer, captures: { bud2: "$.data.id" } }
            - { call: "POST /pd/budgets/${bud2}/open", payload: {}, as: BusinessOfficer }
            - { call: "POST /pd/employees", payload: { full_name: "T A", email: "ta@x.com", employee_kind: "TEACHER", primary_building_id: "${b1}", base_lane: "BA" }, as: PDCoordinator, captures: { t1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "T B", email: "tb@x.com", employee_kind: "TEACHER", primary_building_id: "${b2}", base_lane: "BA" }, as: PDCoordinator, captures: { t2: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "I A", email: "ia@x.com", employee_kind: "SPECIALIST", primary_building_id: "${b1}", base_lane: "MA" }, as: PDCoordinator, captures: { ins1: "$.data.id" } }
            - { call: "POST /pd/courses", payload: { course_code: "CASC-10", title: "Cascade Course", delivery_mode: "IN_PERSON", clock_hours: 10, fee_cents: 20000 }, as: PDCoordinator, captures: { c1: "$.data.id" } }
            - { call: "POST /pd/sections", payload: { course_id: "${c1}", term: "2026-FALL", instructor_id: "${ins1}", building_id: "${b1}", room: "R1", seat_capacity: 1, starts_at: "2026-08-15T09:00:00Z", ends_at: "2026-08-20T17:00:00Z", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-10T00:00:00Z" }, as: PDCoordinator, captures: { s1: "$.data.id" } }
            - { call: "POST /pd/sections/${s1}/meetings", payload: { starts_at: "2026-08-15T10:00:00Z", ends_at: "2026-08-15T12:00:00Z", room: "R1" }, as: PDCoordinator }
            - { call: "POST /pd/sections/${s1}/publish", payload: {}, as: PDCoordinator }
            - { call: "POST /pd/registrations", payload: { teacher_id: "${t1}", section_id: "${s1}" }, as: Teacher, as_user_id: "${t1}", captures: { r1: "$.data.id", r1_st: "$.data.status" } }
            - { call: "POST /pd/registrations", payload: { teacher_id: "${t2}", section_id: "${s1}" }, as: Teacher, as_user_id: "${t2}", captures: { r2: "$.data.id", r2_st: "$.data.status", r2_seq: "$.data.waitlist_seq" } }
          trigger:
            - { call: "POST /pd/registrations/${r1}/drop", payload: {}, as: Teacher, as_user_id: "${t1}", captures: { r1_st2: "$.data.status" } }
            - { call: "GET /pd/registrations/${r2}", payload: {}, as: PDCoordinator, captures: { r2_st2: "$.data.status" } }
            - { call: "GET /pd/budgets/${bud1}", payload: {}, as: PDCoordinator, captures: { enc_b1: "$.data.encumbered_cents" } }
            - { call: "GET /pd/budgets/${bud2}", payload: {}, as: PDCoordinator, captures: { enc_b2: "$.data.encumbered_cents" } }
          assert:
            - "Pre-drop: R1.status == REGISTERED and R2.status == WAITLISTED with waitlist_seq == 1"
            - "Drop response: R1.status == DROPPED (link 1)"
            - "B1 budget.encumbered_cents == 0 after drop (release caused by link 1)"
            - "R2.status == REGISTERED after the drop (link 2: promotion caused by the seat release, synchronous)"
            - "B2 budget.encumbered_cents == 20000 after promotion (link 3: encumbrance caused by link 2)"

      - name: cascade_compliance_escalation_standing
        grounds:
          - state_machines.ComplianceAssignment.ASSIGNED_to_OVERDUE
          - state_machines.ComplianceAssignment.OVERDUE_to_ESCALATED
          - calculations.ops_run_sweep
          - entities.Employee.fields.compliance_standing
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (ops-run, not a drop): the
          checkpoint moves the assignment ASSIGNED -> OVERDUE, then OVERDUE ->
          ESCALATED (link 1); the escalation recomputes Employee.compliance_standing
          to NON_COMPLIANT (link 2, caused by link 1), which then blocks
          advance-lane with ERR_COMPLIANCE_HOLD — observable propagation.
        test_recipe:
          setup:
            - "Building B1; teacher T1 (lane MA, 0 credits)"
            - "Compliance course C1 (compliance_tag SAFETY, 2 h, fee 0)"
            - "Assignment A1 for (T1, C1) due 2026-08-10T00:00:00Z, status ASSIGNED"
            - "Clock advanced to 2026-08-15 and ops-run executed (A1 -> OVERDUE), then to 2026-09-20 and ops-run executed again (A1 -> ESCALATED; due+30d = 2026-09-09 < 2026-09-20)"
          setup_api_calls:
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/buildings", payload: { name: "B Three", building_code: "B3" }, as: PDCoordinator, captures: { b1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "T C", email: "tc@x.com", employee_kind: "TEACHER", primary_building_id: "${b1}", base_lane: "MA" }, as: PDCoordinator, captures: { t1: "$.data.id" } }
            - { call: "POST /pd/courses", payload: { course_code: "SAFE-1", title: "Safety Training", delivery_mode: "VIRTUAL", clock_hours: 2, fee_cents: 0, compliance_tag: "SAFETY" }, as: PDCoordinator, captures: { c1: "$.data.id" } }
            - { call: "POST /pd/compliance-assignments", payload: { employee_id: "${t1}", course_id: "${c1}", due_date: "2026-08-10T00:00:00Z" }, as: PDCoordinator, captures: { a1: "$.data.id" } }
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/ops-runs", payload: {}, as: PDCoordinator }
            - { call: "GET /pd/compliance-assignments/${a1}", payload: {}, as: PDCoordinator, captures: { st_overdue: "$.data.status" } }
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/ops-runs", payload: {}, as: PDCoordinator }
          trigger:
            - { call: "GET /pd/compliance-assignments/${a1}", payload: {}, as: PDCoordinator, captures: { st_esc: "$.data.status" } }
            - { call: "GET /pd/employees/${t1}", payload: {}, as: PDCoordinator, captures: { standing: "$.data.compliance_standing" } }
            - { call: "POST /pd/employees/${t1}/advance-lane", payload: {}, as: PDCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "After first ops-run: assignment status == OVERDUE"
            - "After second ops-run: assignment status == ESCALATED (link 1)"
            - "Employee.compliance_standing == NON_COMPLIANT (link 2, caused by the escalation)"
            - "advance-lane rejected with ERR_COMPLIANCE_HOLD (propagated gate; safety p7 fires before the p10 credit check even though balance is 0.0)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: priority_state_vs_fiscal_section_canceled
        grounds:
          - "validations[priority=6]"
          - "validations[priority=11]"
          - "errors[ERR_SECTION_NOT_OPEN]"
          - "errors[ERR_BUDGET_NOT_OPEN]"
        distinguishing_aspect: |
          Pair state (p6) vs business_fiscal (p11): registering into a CANCELED
          section while NO budget exists at all must fail with the state error
          ERR_SECTION_NOT_OPEN, not the fiscal ERR_BUDGET_NOT_OPEN — state
          outranks fiscal.
        test_recipe:
          setup:
            - "Building B1 with NO budget rows at all (fiscal failure armed)"
            - "Teacher T1 (B1); instructor INS1; course C1 fee 10000"
            - "Section S1 PUBLISHED then CANCELED (state failure armed)"
          setup_api_calls:
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/buildings", payload: { name: "B Four", building_code: "B4" }, as: PDCoordinator, captures: { b1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "T D", email: "td@x.com", employee_kind: "TEACHER", primary_building_id: "${b1}", base_lane: "BA" }, as: PDCoordinator, captures: { t1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "I D", email: "id@x.com", employee_kind: "SPECIALIST", primary_building_id: "${b1}", base_lane: "MA" }, as: PDCoordinator, captures: { ins1: "$.data.id" } }
            - { call: "POST /pd/courses", payload: { course_code: "PRIO-1", title: "Prio Course", delivery_mode: "IN_PERSON", clock_hours: 10, fee_cents: 10000 }, as: PDCoordinator, captures: { c1: "$.data.id" } }
            - { call: "POST /pd/sections", payload: { course_id: "${c1}", term: "2026-FALL", instructor_id: "${ins1}", building_id: "${b1}", room: "R1", seat_capacity: 5, starts_at: "2026-08-15T09:00:00Z", ends_at: "2026-08-20T17:00:00Z", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-10T00:00:00Z" }, as: PDCoordinator, captures: { s1: "$.data.id" } }
            - { call: "POST /pd/sections/${s1}/meetings", payload: { starts_at: "2026-08-15T10:00:00Z", ends_at: "2026-08-15T12:00:00Z", room: "R1" }, as: PDCoordinator }
            - { call: "POST /pd/sections/${s1}/publish", payload: {}, as: PDCoordinator }
            - { call: "POST /pd/sections/${s1}/cancel", payload: {}, as: PDCoordinator }
          trigger:
            - { call: "POST /pd/registrations", payload: { teacher_id: "${t1}", section_id: "${s1}" }, as: Teacher, as_user_id: "${t1}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_SECTION_NOT_OPEN (state, priority 6)"
            - "error_id != ERR_BUDGET_NOT_OPEN (fiscal, priority 11 — also failing but lower priority)"

      - name: priority_temporal_vs_constraint_window_vs_overlap
        grounds:
          - "validations[priority=9]"
          - "validations[priority=10]"
          - "errors[ERR_REGISTRATION_NOT_YET_OPEN]"
          - "errors[ERR_SCHEDULE_CONFLICT]"
        distinguishing_aspect: |
          Pair business_temporal (p9) vs business_constraint (p10): registering
          into a section whose window has NOT opened AND whose session overlaps an
          existing registration must fail with ERR_REGISTRATION_NOT_YET_OPEN, not
          ERR_SCHEDULE_CONFLICT — temporal outranks constraint. Different category
          pair than the sibling (which was state vs fiscal).
        test_recipe:
          setup:
            - "Building B1; teacher T1; instructor INS1; courses CA, CB (fee 0)"
            - "S_A session 2026-09-10 09:00-12:00, window 2026-08-01..2026-09-01, PUBLISHED with meeting; T1 REGISTERED in S_A"
            - "S_B session 2026-09-10 09:00-12:00 (overlaps S_A), window 2026-09-01..2026-09-05 (not yet open at trigger time), PUBLISHED with meeting 09:30-10:30 room R2"
            - "Clock at 2026-08-15: S_B window closed to the past? No — opens 2026-09-01 > now, so NOT_YET_OPEN; overlap with S_A also true"
          setup_api_calls:
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/buildings", payload: { name: "B Five", building_code: "B5" }, as: PDCoordinator, captures: { b1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "T E", email: "te@x.com", employee_kind: "TEACHER", primary_building_id: "${b1}", base_lane: "BA" }, as: PDCoordinator, captures: { t1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "I E", email: "ie@x.com", employee_kind: "SPECIALIST", primary_building_id: "${b1}", base_lane: "MA" }, as: PDCoordinator, captures: { ins1: "$.data.id" } }
            - { call: "POST /pd/courses", payload: { course_code: "PA-1", title: "Course A", delivery_mode: "IN_PERSON", clock_hours: 3, fee_cents: 0 }, as: PDCoordinator, captures: { ca: "$.data.id" } }
            - { call: "POST /pd/courses", payload: { course_code: "PB-1", title: "Course B", delivery_mode: "IN_PERSON", clock_hours: 3, fee_cents: 0 }, as: PDCoordinator, captures: { cb: "$.data.id" } }
            - { call: "POST /pd/sections", payload: { course_id: "${ca}", term: "2026-FALL", instructor_id: "${ins1}", building_id: "${b1}", room: "R1", seat_capacity: 5, starts_at: "2026-09-10T09:00:00Z", ends_at: "2026-09-10T12:00:00Z", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-09-01T00:00:00Z" }, as: PDCoordinator, captures: { sa: "$.data.id" } }
            - { call: "POST /pd/sections/${sa}/meetings", payload: { starts_at: "2026-09-10T09:30:00Z", ends_at: "2026-09-10T10:30:00Z", room: "R1" }, as: PDCoordinator }
            - { call: "POST /pd/sections/${sa}/publish", payload: {}, as: PDCoordinator }
            - { call: "POST /pd/sections", payload: { course_id: "${cb}", term: "2026-FALL", instructor_id: "${ins1}", building_id: "${b1}", room: "R2", seat_capacity: 5, starts_at: "2026-09-10T09:00:00Z", ends_at: "2026-09-10T12:00:00Z", registration_opens_at: "2026-09-01T00:00:00Z", registration_closes_at: "2026-09-05T00:00:00Z" }, as: PDCoordinator, captures: { sb: "$.data.id" } }
            - { call: "POST /pd/sections/${sb}/meetings", payload: { starts_at: "2026-09-10T09:30:00Z", ends_at: "2026-09-10T10:30:00Z", room: "R2" }, as: PDCoordinator }
            - { call: "POST /pd/sections/${sb}/publish", payload: {}, as: PDCoordinator }
            - { call: "POST /pd/registrations", payload: { teacher_id: "${t1}", section_id: "${sa}" }, as: Teacher, as_user_id: "${t1}", captures: { ra: "$.data.id", ra_st: "$.data.status" } }
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: PDCoordinator }
          trigger:
            - { call: "POST /pd/registrations", payload: { teacher_id: "${t1}", section_id: "${sb}" }, as: Teacher, as_user_id: "${t1}", captures: { err: "$.data.error_id" } }
          assert:
            - "S_A registration succeeded with status REGISTERED (window open at 2026-08-01)"
            - "error_id == ERR_REGISTRATION_NOT_YET_OPEN (temporal, priority 9)"
            - "error_id != ERR_SCHEDULE_CONFLICT (constraint, priority 10 — the overlapping sessions would also fail, but lose)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: boundary_attendance_eighty_percent
        grounds:
          - calculations.attendance_rate_check
          - state_machines.Registration.attendance_status
        distinguishing_aspect: |
          Metric: attendance ratio. 4 attended of 5 meetings passes (4*5 >= 5*4
          is 20 >= 20, inclusive integer boundary) while 3 of 5 fails (15 >= 20
          false) — the threshold is crossed exactly at the boundary on
          POST /pd/registrations/{id}/verify-attendance.
        test_recipe:
          setup:
            - "Building B1; teachers T1, T2; instructor INS1; course 10 h fee 0"
            - "Section S capacity 5 PUBLISHED with FIVE meetings in room R1: 2026-08-15 10:00-11:00, 12:00-13:00, 14:00-15:00; 2026-08-16 10:00-11:00; 2026-08-17 10:00-11:00 (all gaps >= 30 min)"
            - "R1 (T1): PRESENT x4, ABSENT x1. R2 (T2): PRESENT x3, ABSENT x2 (bulk attendance per meeting)"
          setup_api_calls:
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/buildings", payload: { name: "B Six", building_code: "B6" }, as: PDCoordinator, captures: { b1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "T F", email: "tf@x.com", employee_kind: "TEACHER", primary_building_id: "${b1}", base_lane: "BA" }, as: PDCoordinator, captures: { t1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "T G", email: "tg@x.com", employee_kind: "TEACHER", primary_building_id: "${b1}", base_lane: "BA" }, as: PDCoordinator, captures: { t2: "$.data.id" } }
