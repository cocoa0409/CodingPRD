            - call: "POST /api/search-assignments"
              payload: { order_id: "${ord}", abstracter_ref: "abs_874", search_type: "CHAIN_OF_TITLE", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T17:00:00Z" }
              as: OperationsManager
              captures: { asg: $.data.id }
          trigger:
            - call: "POST /api/curative-requirements"
              payload: { order_id: "${ord}", description: "Obtain release of expired mechanic lien", severity: "LOW" }
              as: Examiner
              as_user_id: ex_874
              captures: { cur: $.data.id }
            - call: "GET /api/abstract-orders/${ord}"
              as: OperationsManager
              captures: { occ1: $.data.open_curative_count }
            - call: "POST /api/curative-requirements/${cur}/satisfy"
              payload: { resolution_note: "release recorded" }
              as: Abstracter
              as_user_id: abs_874
            - call: "GET /api/abstract-orders/${ord}"
              as: OperationsManager
              captures: { occ2: $.data.open_curative_count }
          assert:
            - "captured occ1 == 1 (visible on the immediately following read)"
            - "captured occ2 == 0 (satisfy reconciles the counter in the same request)"

      - name: cascading_side_effects_depth_chains
        claim_type: cascading_side_effects
        grounds:
          - state_machines.AbstractOrder.READY_FOR_DELIVERY_to_DELIVERED
          - state_machines.RecordDocument.REPORTED_to_FLAGGED_FOR_CURATIVE
        distinguishing_aspect: "Both cascade chains are covered by difficulty instances."
        excluded_because:
          difficulty_instance: deliver_cascade_finalizes_report_retrievals_and_fees
          rationale: "Depth-4 deliver cascade asserted there; the depth-2 flag cascade is asserted in flag_document_cascade_raises_curative_and_bumps_order_count."

      - name: dual_variant_layer_coverage
        claim_type: dual_variant_calculation
        grounds:
          - calculations.order_fee_provisional
          - calculations.retrieval_fee
        distinguishing_aspect: "Both dual-variant calculations are covered by difficulty instances."
        excluded_because:
          difficulty_instance: order_fee_provisional_estimate_vs_final_actuals
          rationale: "Order-level provisional/final divergence asserted there; retrieval per-page/per-document divergence asserted in retrieval_fee_per_page_vs_per_document."

