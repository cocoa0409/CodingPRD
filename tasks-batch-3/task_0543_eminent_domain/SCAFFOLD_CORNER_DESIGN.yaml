            - call: "POST /parcels"
              payload: { project_id: "${proj_id}", apn: "APN-C25", total_area_sqft: 10000, take_area_sqft: 5000, take_type: "PARTIAL" }
              as: RightOfWayAgent
              captures: { parcel_id: $.data.id }
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: Appraiser
              captures: { parcel_v: $.data.version }
          trigger:
            - call: "POST /parcels/${parcel_id}/appraisals"
              payload: { appraiser_name: "AX", land_value_cents: 10000000, improvements_value_cents: 1000000, expected_parcel_version: "${parcel_v}" }
              as: Appraiser
              captures: { appr_id: $.data.id }
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: Appraiser
              captures: { parcel_v2: $.data.version }
          assert:
            - "the create returns 201; the subsequent Parcel.${parcel_id}.version == (pre-create version + 1)"

      - name: finalize_supersede_reconciliation_updates_appraised_value
        claim_type: derived_field_reconciliation
        grounds: [entities.Parcel.fields.appraised_value_cents, state_machines.Appraisal.DRAFT_to_FINALIZED]
        distinguishing_aspect: "Finalizing a second appraisal supersedes the first FINALIZED one and reconciles Parcel.appraised_value_cents to the new value (27,000,000 -> 30,000,000)."
        test_recipe:
          setup: ["Parcel with a FINALIZED appraisal (appraised 27,000,000) and a second DRAFT appraisal (offer basis 30,000,000)."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "PJ", agency_name: "DOT", total_budget_cents: 100000000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /parcels"
              payload: { project_id: "${proj_id}", apn: "APN-C26", total_area_sqft: 10000, take_area_sqft: 5000, take_type: "PARTIAL" }
              as: RightOfWayAgent
              captures: { parcel_id: $.data.id }
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: Appraiser
              captures: { pv1: $.data.version }
            - call: "POST /parcels/${parcel_id}/appraisals"
              payload: { appraiser_name: "AX", land_value_cents: 20000000, improvements_value_cents: 5000000, severance_damages_cents: 3000000, special_benefits_cents: 1000000, expected_parcel_version: "${pv1}" }
              as: Appraiser
              captures: { appr1: $.data.id }
            - call: "POST /appraisals/${appr1}/finalize"
              payload: {}
              as: Appraiser
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: Appraiser
              captures: { pv2: $.data.version }
            - call: "POST /parcels/${parcel_id}/appraisals"
              payload: { appraiser_name: "AX", land_value_cents: 22000000, improvements_value_cents: 5000000, severance_damages_cents: 5000000, special_benefits_cents: 2000000, expected_parcel_version: "${pv2}" }
              as: Appraiser
              captures: { appr2: $.data.id }
          trigger:
            - call: "POST /appraisals/${appr2}/finalize"
              payload: {}
              as: Appraiser
          assert:
            - "Appraisal.${appr1}.status == SUPERSEDED AND Appraisal.${appr2}.status == FINALIZED"
            - "Parcel.${parcel_id}.appraised_value_cents == 30000000"

  # ==== Consistency Model ===================================================
  - section: consistency_model
    instances:
      - name: negotiation_agreed_cascade_visible_same_request
        claim_type: immediate
        grounds: [state_machines.Parcel.acquisition_status.IN_NEGOTIATION_to_AGREED, consistency_model]
        distinguishing_aspect: "Accepting the offer immediately reflects Parcel.acquisition_status == AGREED on the very next read (immediate consistency)."
        test_recipe:
          setup: ["Cleared, appraised parcel with an open negotiation (AGENCY_OFFERED)."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "PJ", agency_name: "DOT", total_budget_cents: 100000000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /parcels"
              payload: { project_id: "${proj_id}", apn: "APN-C27", total_area_sqft: 10000, take_area_sqft: 5000, take_type: "PARTIAL" }
              as: RightOfWayAgent
              captures: { parcel_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/ownership-interests"
              payload: { interest_type: "FEE_OWNER", holder_name: "O", ownership_pct: 100 }
              as: RightOfWayAgent
              captures: { oi_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/clear-ownership"
              payload: {}
              as: RightOfWayAgent
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: Appraiser
              captures: { parcel_v: $.data.version }
            - call: "POST /parcels/${parcel_id}/appraisals"
              payload: { appraiser_name: "AX", land_value_cents: 20000000, improvements_value_cents: 5000000, severance_damages_cents: 3000000, special_benefits_cents: 1000000, expected_parcel_version: "${parcel_v}" }
              as: Appraiser
              captures: { appr_id: $.data.id }
            - call: "POST /appraisals/${appr_id}/finalize"
              payload: {}
              as: Appraiser
            - call: "POST /parcels/${parcel_id}/negotiations"
              payload: { initial_offer_cents: 27000000 }
              as: RightOfWayAgent
              captures: { neg_id: $.data.id }
          trigger:
            - call: "POST /negotiations/${neg_id}/rounds"
              payload: { action: "ACCEPT" }
              as: PropertyOwner
              as_user_id: "${oi_id}"
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: RightOfWayAgent
          assert:
            - "Parcel.${parcel_id}.acquisition_status == AGREED immediately after the ACCEPT"

  # ==== Excluded (already covered by §1.8) ==================================
  - section: calculations
    instances:
      - name: waterfall_disbursement_conservation
        claim_type: correct_result
        grounds: [calculations.disbursement_waterfall]
        excluded_because:
          difficulty_instance: combinatorial_formula / waterfall_owner_rounding_order_mode_b
          rationale: "The waterfall payout, rounding order, and sum-conservation invariant are asserted directly by the named §1.8 instance."
      - name: prompt_bonus_tier_selection
        claim_type: correct_result
        grounds: [calculations.prompt_settlement_bonus]
        excluded_because:
          difficulty_instance: combinatorial_formula / prompt_bonus_base_keyed_mode_c
          rationale: "Bonus tier selection on the base agreed amount is asserted by the named §1.8 instance."

  - section: state_machines
    instances:
      - name: possession_cascade_to_utility
        claim_type: cross_entity_cascade
        grounds: [state_machines.Condemnation.DEPOSIT_MADE_to_POSSESSED]
        excluded_because:
          difficulty_instance: transitive_cascade / possession_to_parcel_to_utility_cascade
          rationale: "The possession -> parcel -> utility cascade is asserted end-to-end by the named §1.8 instance."
