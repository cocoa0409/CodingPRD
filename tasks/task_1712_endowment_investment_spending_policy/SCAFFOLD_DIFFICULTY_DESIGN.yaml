# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Endowment Investment & Spending Policy. Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7; every recipe drives empty-DB -> setup via §1.5 calls.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------
  # Rule 1 — dual_variant_calc (two instances, different entity domains)
  # ---------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: gift_unitization_provisional_estimate_diverges_from_final_price_units
        grounds:
          - calculations.unit_price_calculation
          - calculations.gift_unitization
          - entities.GiftContribution.fields.provisional_units_estimate_micro
          - entities.GiftContribution.fields.units_purchased_micro
        distinguishing_aspect: |
          Same gift, two valid valuations: the provisional estimate uses the latest FINAL
          price at receive time (100000 millicents), the actual unitization uses the
          quarter's FINAL price fixed at finalize (120000 millicents) — the estimate
          (50000000000 micro) and the actual (41666666667 micro) differ. Entity domain:
          GiftContribution/Fund unit accounting.
        test_recipe:
          setup:
            - "Pool (inception FY 2026) with a 100% US_EQUITY allocation, one engaged manager covering quarter 1+, fund FDV (TRUE_ENDOWMENT, UNRESTRICTED) ACTIVE, donor, and a CORPUS gift of 10000000 cents unitized at the Q1 finalize (price 100000 millicents, 100000000000 micro-units)"
            - "A second EXPENDABLE gift of 5000000 cents is RECEIVED during open quarter 2 (estimate stamped at the Q1 price); the Q2 manager report lifts ending MV to 12000000; a PRELIMINARY valuation for Q2 exists and the pool version is captured fresh"
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool DV", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { dv_pool: $.data.id, dv_pv: $.data.version } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${dv_pool}", items: [ { asset_class: US_EQUITY, target_pct_bps: 10000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin }
            - { call: "POST /endowment/managers", payload: { pool_id: "${dv_pool}", manager_name: "M DV", asset_class: US_EQUITY, benchmark_code: "SPX", coverage_start_quarter: 1 }, as: InvestmentOfficer, captures: { dv_mgr: $.data.id } }
            - { call: "POST /endowment/managers/${dv_mgr}/engage", payload: {}, as: InvestmentOfficer }
            - { call: "POST /endowment/funds", payload: { pool_id: "${dv_pool}", fund_code: "FDV", fund_name: "Fund DV", endowment_class: TRUE_ENDOWMENT, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { dv_fund: $.data.id } }
            - { call: "POST /endowment/donors", payload: { donor_name: "D DV", donor_type: INDIVIDUAL }, as: DevelopmentOfficer, captures: { dv_donor: $.data.id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${dv_fund}", donor_id: "${dv_donor}", external_ref: "G1", gift_type: CORPUS, amount_cents: 10000000 }, as: DevelopmentOfficer, captures: { dv_g1: $.data.id } }
            - { call: "POST /endowment/funds/${dv_fund}/activate", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/gifts/${dv_g1}/receive", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${dv_mgr}", quarter_index: 1, beginning_mv_cents: 0, ending_mv_cents: 10000000, flows: [ { day_offset: 0, amount_cents: 10000000 } ], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${dv_pool}", estimated_pool_market_value_cents: 10000000 }, as: InvestmentOfficer, captures: { dv_v1: $.data.id } }
            - { call: "POST /endowment/valuations/${dv_v1}/finalize", payload: { final_pool_market_value_cents: 10000000, expected_pool_version: "${dv_pv}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${dv_fund}", donor_id: "${dv_donor}", external_ref: "G2", gift_type: EXPENDABLE, amount_cents: 5000000 }, as: DevelopmentOfficer, captures: { dv_g2: $.data.id } }
            - { call: "POST /endowment/gifts/${dv_g2}/receive", payload: {}, as: DevelopmentOfficer, captures: { dv_g2_est: $.data.provisional_units_estimate_micro } }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${dv_mgr}", quarter_index: 2, beginning_mv_cents: 10000000, ending_mv_cents: 12000000, flows: [ { day_offset: 45, amount_cents: 5000000 } ], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${dv_pool}", estimated_pool_market_value_cents: 12000000 }, as: InvestmentOfficer, captures: { dv_v2: $.data.id } }
            - { call: "GET /endowment/pools/${dv_pool}", as: InvestmentOfficer, captures: { dv_pv2: $.data.version } }
          trigger:
            - { call: "POST /endowment/valuations/${dv_v2}/finalize", payload: { final_pool_market_value_cents: 12000000, expected_pool_version: "${dv_pv2}" }, as: InvestmentOfficer }
            - { call: "GET /endowment/gifts/${dv_g2}", as: InvestmentOfficer, captures: { dv_g2_units: $.data.units_purchased_micro } }
            - { call: "GET /endowment/funds/${dv_fund}", as: InvestmentOfficer }
          assert:
            - "GiftContribution.${dv_g2}.provisional_units_estimate_micro == 50000000000 (stamped at receive from the Q1 FINAL price 100000)"
            - "GiftContribution.${dv_g2}.units_purchased_micro == 41666666667 (round_half_up(5000000 * 1e9 / 120000))"
            - "GiftContribution.${dv_g2}.units_purchased_micro != GiftContribution.${dv_g2}.provisional_units_estimate_micro"
            - "GiftContribution.${dv_g2}.unitized_quarter_index == 2"
            - "Fund.${dv_fund}.units_held_micro == 141666666667"

      - name: manager_return_modified_dietz_diverges_from_simple_flow_blind
        grounds:
          - calculations.manager_return_calculation
          - entities.ManagerQuarterReport.fields.return_bps
          - entities.ManagerQuarterReport.fields.simple_return_bps
        distinguishing_aspect: |
          Same report inputs (BMV 1000000, one day-45 inflow of 500000, EMV 1650000):
          Modified Dietz weights the flow by 45/90 remaining days giving 1200 bps, while
          the flow-blind simple return divides by beginning MV alone giving 1500 bps.
          Entity domain: InvestmentManager performance — disjoint from the gift-unitization
          domain of the sibling instance.
        test_recipe:
          setup:
            - "Pool with a 100% US_EQUITY allocation and an engaged manager with coverage_start_quarter 1; no funds or gifts needed"
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool MR", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { mr_pool: $.data.id } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${mr_pool}", items: [ { asset_class: US_EQUITY, target_pct_bps: 10000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin }
            - { call: "POST /endowment/managers", payload: { pool_id: "${mr_pool}", manager_name: "M RET", asset_class: US_EQUITY, benchmark_code: "SPX", coverage_start_quarter: 1 }, as: InvestmentOfficer, captures: { mr_mgr: $.data.id } }
            - { call: "POST /endowment/managers/${mr_mgr}/engage", payload: {}, as: InvestmentOfficer }
          trigger:
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${mr_mgr}", quarter_index: 1, beginning_mv_cents: 1000000, ending_mv_cents: 1650000, flows: [ { day_offset: 45, amount_cents: 500000 } ], benchmark_return_bps: 300 }, as: InvestmentOfficer, captures: { mr_ret: $.data.return_bps, mr_simple: $.data.simple_return_bps, mr_excess: $.data.excess_bps } }
          assert:
            - "ManagerQuarterReport.return_bps == 1200 (round_half_up(10000 * 150000 * 90 / (1000000*90 + 45*500000)))"
            - "ManagerQuarterReport.simple_return_bps == 1500 (round_half_up(10000 * 150000 / 1000000))"
            - "ManagerQuarterReport.excess_bps == 900 (1200 - 300)"
            - "return_bps != simple_return_bps for identical inputs whenever flows is non-empty"

  # ---------------------------------------------------------------
  # Rule 2 — combinatorial_formula (three instances, modes (a), (b), (c))
  # ---------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: spending_distribution_band_cap_clamps_raw_amount_mode_a
        grounds:
          - calculations.spending_distribution_amount
          - calculations.smoothed_spending_base
          - entities.SpendingDistribution.fields.band_adjusted_amount_cents
        distinguishing_aspect: |
          Mode (a): the distribution formula combines >= 3 inputs (smoothed trailing base,
          rate 650 bps, prior-year final 747500) with a nested min/max clamp — raw 830050
          exceeds cap 807300 = round_half_up(747500 * 1.08), so the cap binds and
          band_adjusted lands on exactly 807300, distinct from both raw and floor (740025).
        test_recipe:
          setup:
            - "Pool BAND (FY 2026 inception) with policy {rate 650bps, window 4, floor 100bps, cap 800bps, effective 2026} ADOPTED, engaged manager, ACTIVE fund FBND holding 100000000000 micro-units (CORPUS 10000000), quarters Q1-Q4 finalized at prices 100000/110000/120000/130000 millicents"
            - "The fund's FY2026 distribution went PROJECTED -> PROPOSED -> APPROVED -> DISTRIBUTED with final_amount 747500, redeeming exactly 5750000000 micro-units at the Q4 price 130000, leaving 94250000000 micro-units"
            - "Q5 finalized with ending MV 15080000 -> price 160000 millicents; FY2027 is now projectable"
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool BAND", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { bd_pool: $.data.id } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${bd_pool}", items: [ { asset_class: US_EQUITY, target_pct_bps: 10000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin }
            - { call: "POST /endowment/policies", payload: { pool_id: "${bd_pool}", spending_rate_bps: 650, smoothing_window_quarters: 4, band_floor_bps: 100, band_cap_bps: 800, effective_from_fiscal_year: 2026 }, as: InvestmentOfficer, as_user_id: "io-1", captures: { bd_pol: $.data.id } }
            - { call: "GET /endowment/pools/${bd_pool}", as: InvestmentOfficer, captures: { bd_pv1: $.data.version } }
            - { call: "POST /endowment/policies/${bd_pol}/adopt", payload: { expected_pool_version: "${bd_pv1}" }, as: BoardMember, as_user_id: "bm-1" }
            - { call: "POST /endowment/managers", payload: { pool_id: "${bd_pool}", manager_name: "M BAND", asset_class: US_EQUITY, benchmark_code: "SPX", coverage_start_quarter: 1 }, as: InvestmentOfficer, captures: { bd_mgr: $.data.id } }
            - { call: "POST /endowment/managers/${bd_mgr}/engage", payload: {}, as: InvestmentOfficer }
            - { call: "POST /endowment/funds", payload: { pool_id: "${bd_pool}", fund_code: "FBND", fund_name: "Fund BAND", endowment_class: TRUE_ENDOWMENT, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { bd_fund: $.data.id } }
            - { call: "POST /endowment/donors", payload: { donor_name: "D BAND", donor_type: FOUNDATION }, as: DevelopmentOfficer, captures: { bd_donor: $.data.id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${bd_fund}", donor_id: "${bd_donor}", external_ref: "B1", gift_type: CORPUS, amount_cents: 10000000 }, as: DevelopmentOfficer, captures: { bd_g1: $.data.id } }
            - { call: "POST /endowment/funds/${bd_fund}/activate", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/gifts/${bd_g1}/receive", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${bd_mgr}", quarter_index: 1, beginning_mv_cents: 0, ending_mv_cents: 10000000, flows: [ { day_offset: 0, amount_cents: 10000000 } ], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${bd_pool}", estimated_pool_market_value_cents: 10000000 }, as: InvestmentOfficer, captures: { bd_v1: $.data.id } }
            - { call: "GET /endowment/pools/${bd_pool}", as: InvestmentOfficer, captures: { bd_pvv1: $.data.version } }
            - { call: "POST /endowment/valuations/${bd_v1}/finalize", payload: { final_pool_market_value_cents: 10000000, expected_pool_version: "${bd_pvv1}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${bd_mgr}", quarter_index: 2, beginning_mv_cents: 10000000, ending_mv_cents: 11000000, flows: [], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${bd_pool}", estimated_pool_market_value_cents: 11000000 }, as: InvestmentOfficer, captures: { bd_v2: $.data.id } }
            - { call: "GET /endowment/pools/${bd_pool}", as: InvestmentOfficer, captures: { bd_pvv2: $.data.version } }
            - { call: "POST /endowment/valuations/${bd_v2}/finalize", payload: { final_pool_market_value_cents: 11000000, expected_pool_version: "${bd_pvv2}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${bd_mgr}", quarter_index: 3, beginning_mv_cents: 11000000, ending_mv_cents: 12000000, flows: [], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${bd_pool}", estimated_pool_market_value_cents: 12000000 }, as: InvestmentOfficer, captures: { bd_v3: $.data.id } }
            - { call: "GET /endowment/pools/${bd_pool}", as: InvestmentOfficer, captures: { bd_pvv3: $.data.version } }
            - { call: "POST /endowment/valuations/${bd_v3}/finalize", payload: { final_pool_market_value_cents: 12000000, expected_pool_version: "${bd_pvv3}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${bd_mgr}", quarter_index: 4, beginning_mv_cents: 12000000, ending_mv_cents: 13000000, flows: [], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${bd_pool}", estimated_pool_market_value_cents: 13000000 }, as: InvestmentOfficer, captures: { bd_v4: $.data.id } }
            - { call: "GET /endowment/pools/${bd_pool}", as: InvestmentOfficer, captures: { bd_pvv4: $.data.version } }
            - { call: "POST /endowment/valuations/${bd_v4}/finalize", payload: { final_pool_market_value_cents: 13000000, expected_pool_version: "${bd_pvv4}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/distributions", payload: { fund_id: "${bd_fund}", fiscal_year: 2026 }, as: DevelopmentOfficer, as_user_id: "dev-1", captures: { bd_d26: $.data.id } }
            - { call: "POST /endowment/distributions/${bd_d26}/propose", payload: {}, as: DevelopmentOfficer, as_user_id: "dev-1" }
            - { call: "POST /endowment/distributions/${bd_d26}/approve", payload: {}, as: BoardMember, as_user_id: "bm-1" }
            - { call: "POST /endowment/distributions/${bd_d26}/distribute", payload: {}, as: InvestmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${bd_mgr}", quarter_index: 5, beginning_mv_cents: 13000000, ending_mv_cents: 15080000, flows: [ { day_offset: 0, amount_cents: -747500 } ], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${bd_pool}", estimated_pool_market_value_cents: 15080000 }, as: InvestmentOfficer, captures: { bd_v5: $.data.id } }
            - { call: "GET /endowment/pools/${bd_pool}", as: InvestmentOfficer, captures: { bd_pvv5: $.data.version } }
            - { call: "POST /endowment/valuations/${bd_v5}/finalize", payload: { final_pool_market_value_cents: 15080000, expected_pool_version: "${bd_pvv5}" }, as: InvestmentOfficer }
          trigger:
            - { call: "POST /endowment/distributions", payload: { fund_id: "${bd_fund}", fiscal_year: 2027 }, as: DevelopmentOfficer, as_user_id: "dev-1", captures: { bd_base: $.data.smoothed_base_cents, bd_raw: $.data.raw_amount_cents, bd_band: $.data.band_adjusted_amount_cents, bd_final: $.data.final_amount_cents, bd_prior: $.data.prior_year_distribution_cents } }
          assert:
            - "SpendingDistribution.prior_year_distribution_cents == 747500 (FY2026 DISTRIBUTED final)"
            - "SpendingDistribution.smoothed_base_cents == 12770000 ((11000000+12000000+13000000+15080000)/4)"
            - "SpendingDistribution.raw_amount_cents == 830050 (12770000 * 650 / 10000)"
            - "SpendingDistribution.band_adjusted_amount_cents == 807300 (cap round_half_up(747500*10800/10000) binds: 830050 > 807300; floor 740025 does not)"
            - "SpendingDistribution.final_amount_cents == 807300 (fund not underwater: MV 15080000 >= HGV 10000000)"

      - name: gift_unitization_per_gift_rounding_order_mode_b
        grounds:
          - calculations.gift_unitization
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — two 1-cent gifts unitize at a
          300000-millicent price. The pinned order rounds per gift (3333 + 3333 = 6666
          micro-units); the rejected order sums first then rounds (round(2e9/300000) =
          6667). The fund total must show 100000006666, not 100000006667.
        test_recipe:
          setup:
            - "Pool RND (FY 2026) with allocation, engaged manager, ACTIVE fund FRND holding 100000000000 micro-units after the Q1 finalize at price 100000"
            - "Two EXPENDABLE gifts of exactly 1 cent each are RECEIVED during open quarter 2; the Q2 report triples ending MV to 30000000 so the Q2 FINAL price is 300000 millicents"
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool RND", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { rd_pool: $.data.id, rd_pv: $.data.version } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${rd_pool}", items: [ { asset_class: US_EQUITY, target_pct_bps: 10000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin }
            - { call: "POST /endowment/managers", payload: { pool_id: "${rd_pool}", manager_name: "M RND", asset_class: US_EQUITY, benchmark_code: "SPX", coverage_start_quarter: 1 }, as: InvestmentOfficer, captures: { rd_mgr: $.data.id } }
            - { call: "POST /endowment/managers/${rd_mgr}/engage", payload: {}, as: InvestmentOfficer }
            - { call: "POST /endowment/funds", payload: { pool_id: "${rd_pool}", fund_code: "FRND", fund_name: "Fund RND", endowment_class: TRUE_ENDOWMENT, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { rd_fund: $.data.id } }
            - { call: "POST /endowment/donors", payload: { donor_name: "D RND", donor_type: INDIVIDUAL }, as: DevelopmentOfficer, captures: { rd_donor: $.data.id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${rd_fund}", donor_id: "${rd_donor}", external_ref: "R1", gift_type: CORPUS, amount_cents: 10000000 }, as: DevelopmentOfficer, captures: { rd_g1: $.data.id } }
            - { call: "POST /endowment/funds/${rd_fund}/activate", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/gifts/${rd_g1}/receive", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${rd_mgr}", quarter_index: 1, beginning_mv_cents: 0, ending_mv_cents: 10000000, flows: [ { day_offset: 0, amount_cents: 10000000 } ], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${rd_pool}", estimated_pool_market_value_cents: 10000000 }, as: InvestmentOfficer, captures: { rd_v1: $.data.id } }
            - { call: "POST /endowment/valuations/${rd_v1}/finalize", payload: { final_pool_market_value_cents: 10000000, expected_pool_version: "${rd_pv}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${rd_fund}", donor_id: "${rd_donor}", external_ref: "R2", gift_type: EXPENDABLE, amount_cents: 1 }, as: DevelopmentOfficer, captures: { rd_g2: $.data.id } }
            - { call: "POST /endowment/gifts/${rd_g2}/receive", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${rd_fund}", donor_id: "${rd_donor}", external_ref: "R3", gift_type: EXPENDABLE, amount_cents: 1 }, as: DevelopmentOfficer, captures: { rd_g3: $.data.id } }
            - { call: "POST /endowment/gifts/${rd_g3}/receive", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${rd_mgr}", quarter_index: 2, beginning_mv_cents: 10000000, ending_mv_cents: 30000000, flows: [ { day_offset: 0, amount_cents: 20000002 } ], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${rd_pool}", estimated_pool_market_value_cents: 30000000 }, as: InvestmentOfficer, captures: { rd_v2: $.data.id } }
            - { call: "GET /endowment/pools/${rd_pool}", as: InvestmentOfficer, captures: { rd_pv2: $.data.version } }
          trigger:
            - { call: "POST /endowment/valuations/${rd_v2}/finalize", payload: { final_pool_market_value_cents: 30000000, expected_pool_version: "${rd_pv2}" }, as: InvestmentOfficer }
            - { call: "GET /endowment/gifts/${rd_g2}", as: InvestmentOfficer, captures: { rd_g2u: $.data.units_purchased_micro } }
            - { call: "GET /endowment/gifts/${rd_g3}", as: InvestmentOfficer, captures: { rd_g3u: $.data.units_purchased_micro } }
            - { call: "GET /endowment/funds/${rd_fund}", as: InvestmentOfficer, captures: { rd_funits: $.data.units_held_micro } }
          assert:
            - "GiftContribution.${rd_g2}.units_purchased_micro == 3333 (round_half_up(1 * 1e9 / 300000))"
            - "GiftContribution.${rd_g3}.units_purchased_micro == 3333"
            - "Fund.${rd_fund}.units_held_micro == 100000006666 (per-gift rounding: 3333 + 3333; the sum-then-round order would yield 100000006667)"

      - name: quarter_close_pipeline_order_gift_cures_underwater_mode_c
        grounds:
          - calculations.quarter_close_pipeline
          - calculations.gift_unitization
          - calculations.underwater_flag
        distinguishing_aspect: |
          Mode (c): circular-looking dependency resolved by pinned evaluation order — the
          Q3 price (104000 millicents) is computed from PRE-flow units in step 1; the gift
          unitized in step 3 at that fixed price then feeds the MV used by the underwater
          check in step 5, curing the fund (MV 16400000 >= HGV 16000000). An implementation
          that evaluates underwater before unitization leaves the fund SPENDING_SUSPENDED;
          one that reprices after unitization yields a different price. Both are wrong here.
        test_recipe:
          setup:
            - "Pool PIPE (FY 2026) with allocation, engaged manager, ACTIVE fund FPIPE holding 100000000000 micro-units (CORPUS 10000000, HGV 10000000)"
            - "Q2 finalized at price 40000 after a crash to MV 4000000: fund underwater (4000000 < 10000000), spending_posture SPENDING_SUSPENDED"
            - "During open quarter 3 a second CORPUS gift of 6000000 is RECEIVED; the Q3 report shows ending MV 10400000 with the gift cash booked as a day-0 flow"
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool PIPE", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { pp_pool: $.data.id, pp_pv: $.data.version } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${pp_pool}", items: [ { asset_class: US_EQUITY, target_pct_bps: 10000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin }
            - { call: "POST /endowment/managers", payload: { pool_id: "${pp_pool}", manager_name: "M PIPE", asset_class: US_EQUITY, benchmark_code: "SPX", coverage_start_quarter: 1 }, as: InvestmentOfficer, captures: { pp_mgr: $.data.id } }
            - { call: "POST /endowment/managers/${pp_mgr}/engage", payload: {}, as: InvestmentOfficer }
            - { call: "POST /endowment/funds", payload: { pool_id: "${pp_pool}", fund_code: "FPIPE", fund_name: "Fund PIPE", endowment_class: TRUE_ENDOWMENT, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { pp_fund: $.data.id } }
