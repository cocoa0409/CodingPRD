    roles: [StoreManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Evaluate time-based auto-transitions (PartyReservation DEPOSIT_PAID -> CONFIRMED at party_start - 24h)"]

