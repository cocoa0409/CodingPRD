  # ---------------- FraudCase ---------------------------------------
  - method: POST
    path: "/fraud-cases"
    description: "Open a fraud case from four risk signals. Scores the case immediately and moves the member to WATCH or FROZEN by threshold."
    roles: [FraudAnalyst]
    code: 201
    input: ["member_id", "case_type", "login_geo_velocity", "redemption_velocity_24h", "brokering_pattern_hits", "dormancy_days"]
    output: FraudCase
    side_effects:
      - "detection_score computed; opened_by_user_id = X-User-ID"
      - "MemberAccount.risk_score updated; security_state -> WATCH at 40..69 or FROZEN at >= 70"
      - "freeze_applied set when the member was frozen"
      - "held bookings of a frozen member are cancelled and their seats released"

  - method: GET
    path: "/fraud-cases"
    description: "List fraud cases, filterable by member_id, status and case_type."
    roles: [FraudAnalyst, ProgramAdmin, Member]
    code: 200
    input: ["member_id?", "status?", "case_type?", "limit?", "offset?"]
    output: FraudCase[]
    side_effects: ["none"]

  - method: GET
    path: "/fraud-cases/{caseId}"
    description: "Read a fraud case including detection_score, clawback_miles, freeze_applied and both actor ids."
    roles: [FraudAnalyst, ProgramAdmin, Member]
    code: 200
    input: []
    output: FraudCase
    side_effects: ["none"]

  - method: POST
    path: "/fraud-cases/{caseId}/investigate"
    description: "Move an open case into investigation."
    roles: [FraudAnalyst]
    code: 200
    input: []
    output: FraudCase
    side_effects: ["status OPEN -> INVESTIGATING", "increments FraudCase.version by 1"]

  - method: POST
    path: "/fraud-cases/{caseId}/substantiate"
    description: "Substantiate an investigated case. Segregation of duties: the adjudicator must differ from opened_by_user_id. Computes and applies the clawback, freezes or closes the account, and cascades through held bookings into window posture."
    roles: [FraudAnalyst]
    code: 200
    input: []
    output: FraudCase
    side_effects:
      - "status INVESTIGATING -> SUBSTANTIATED; adjudicated_by_user_id = X-User-ID"
      - "clawback_miles computed; an ADJUSTMENT MileTransaction of -clawback_miles inserted when positive"
      - "MemberAccount.mile_balance debited; security_state -> FROZEN (or CLOSED for ACCOUNT_TAKEOVER)"
      - "held bookings cancelled, seats released and window posture recomputed"
      - "LoyaltyProgram.outstanding_miles reduced by clawback_miles"
      - "increments FraudCase.version by 1"

  - method: POST
    path: "/fraud-cases/{caseId}/dismiss"
    description: "Dismiss an investigated case. Segregation of duties applies. Restores the member to NORMAL when no other live case remains."
    roles: [FraudAnalyst]
    code: 200
    input: ["note?"]
    output: FraudCase
    side_effects:
      - "status INVESTIGATING -> DISMISSED; adjudicated_by_user_id = X-User-ID"
      - "MemberAccount.security_state -> NORMAL and risk_score -> 0 when no other live case exists"
      - "increments FraudCase.version by 1"

  # ---------------- DeferredRevenuePosting --------------------------
  - method: POST
    path: "/deferred-revenue-postings"
    description: "Post breakage for one accounting period. Requires the program's current version and the program to be in CLOSING. Immutable once written."
    roles: [RevenueAccountant]
    code: 201
    input: ["program_id", "period", "expected_program_version", "method?"]
    output: DeferredRevenuePosting
    side_effects:
      - "breakage_and_deferred_revenue run in the resolved variant; every snapshot and result field stamped"
      - "LoyaltyProgram.deferred_revenue_cents = deferred_balance_after_cents"
      - "LoyaltyProgram.last_breakage_rate_bps and lifetime_breakage_income_cents updated"
      - "increments LoyaltyProgram.version by 1"

  - method: GET
    path: "/deferred-revenue-postings"
    description: "List deferred revenue postings, filterable by program_id and period."
    roles: [RevenueAccountant, ProgramAdmin]
    code: 200
    input: ["program_id?", "period?", "limit?", "offset?"]
    output: DeferredRevenuePosting[]
    side_effects: ["none"]

  - method: GET
    path: "/deferred-revenue-postings/{postingId}"
    description: "Read an immutable deferred revenue posting including the trailing-window buckets and the method actually applied."
    roles: [RevenueAccountant, ProgramAdmin]
    code: 200
    input: []
    output: DeferredRevenuePosting
    side_effects: ["none"]

  # ---------------- Test-driving endpoints (priority ladder step 3) --
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z and it never falls back to wall-clock time; every deadline, hold expiry, window bound and trailing-period computation reads this logical clock."
    roles: [ProgramAdmin, RevenueAccountant, FraudAnalyst, PartnerManager, ContractsOfficer]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: string }
    side_effects: ["the logical clock is repositioned; no entity is mutated until run-epoch is called"]

  - method: POST
    path: "/_ops/run-epoch"
    description: "Advance every clock-driven transition for one program at the current logical clock: expire holds, launch and end campaigns, lapse trial status matches, advance and effect notices, expire agreement terms, and recompute award window posture."
    roles: [ProgramAdmin]
    code: 200
    input: ["program_id"]
    output: { epoch_at: string, holds_expired: integer, campaigns_launched: integer, campaigns_ended: integer, status_matches_lapsed: integer, notices_advanced: integer, agreements_expired: integer, windows_recomputed: integer }
    side_effects:
      - "AwardBooking HELD -> EXPIRED for every hold past hold_expires_at, releasing its seats"
      - "PromotionCampaign SCHEDULED -> LIVE and LIVE -> ENDED by window bounds"
      - "MemberAccount status_match_state TRIAL -> LAPSED past status_match_expires_at"
      - "ProgramChangeNotice ANNOUNCED -> IN_GRANDFATHER | EFFECTIVE and IN_GRANDFATHER -> EFFECTIVE"
      - "MileSaleAgreement ACTIVE -> EXPIRED past term_end_date, recomputing the issuer aggregate"
      - "AwardInventoryWindow load_factor_bps, demand_multiplier_bps and capacity_control_state recomputed"

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:

  # ---- auth / schema ------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, or X-User-Role is not one of the seven declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the caller's role is not in the endpoint's roles list"
  - id: ERR_MEMBER_SCOPE_VIOLATION
    http: 403
    condition: "a Member caller targets a MemberAccount, AwardBooking, MileTransaction or FraudCase that is not their own"
  - id: ERR_ISSUER_SCOPE_VIOLATION
    http: 403
    condition: "an IssuerRepresentative caller counters or reads a MileSaleAgreement whose issuer_id is not their own id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, enum out of range, integer out of declared bounds, malformed date, or a tier_schedule that does not start at threshold_miles 0 with strictly increasing thresholds and strictly decreasing prices"

  # ---- existence (404) ---------------------------------------------
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "programId path parameter or program_id body FK does not resolve"
  - id: ERR_ISSUER_NOT_FOUND
    http: 404
    condition: "issuerId path parameter or issuer_id body FK does not resolve"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "agreementId path parameter, agreement_id body FK, or supersedes_agreement_id does not resolve"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "orderId path parameter does not resolve"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "memberId path parameter or member_id body FK does not resolve"
  - id: ERR_TRANSACTION_NOT_FOUND
    http: 404
    condition: "transactionId path parameter or reverses_transaction_id body FK does not resolve"
  - id: ERR_PROMOTION_NOT_FOUND
    http: 404
    condition: "campaignId path parameter or promotion_id body FK does not resolve"
  - id: ERR_AWARD_WINDOW_NOT_FOUND
    http: 404
    condition: "windowId path parameter or window_id body FK does not resolve"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "bookingId path parameter or award_booking_id body FK does not resolve"
  - id: ERR_PARTNER_NOT_FOUND
    http: 404
    condition: "airlineId path parameter or partner_airline_id body FK does not resolve"
  - id: ERR_NOTICE_NOT_FOUND
    http: 404
    condition: "noticeId path parameter does not resolve"
  - id: ERR_FRAUD_CASE_NOT_FOUND
    http: 404
    condition: "caseId path parameter does not resolve"
  - id: ERR_POSTING_NOT_FOUND
    http: 404
    condition: "postingId path parameter does not resolve"

  # ---- state / concurrency / governance -----------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition does not exist from the row's current state — includes a non-ACTIVE agreement receiving an order, a non-LIVE or out-of-window campaign being referenced by an earn, a status match whose matched_tier does not raise the member's tier, a terminal row receiving any trigger, and a repeated trigger already applied"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_agreement_version, expected_window_version or expected_program_version does not equal the parent's current version"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the ratifying ContractsOfficer equals negotiated_by_user_id, or the adjudicating FraudAnalyst equals opened_by_user_id"
  - id: ERR_MEMBER_FROZEN
    http: 409
    condition: "a mile-moving or seat-taking operation targets a member whose security_state is WATCH-escalated to FROZEN or CLOSED"
  - id: ERR_PERIOD_LOCKED
    http: 409
    condition: "a ledger-moving operation is attempted while LoyaltyProgram.revenue_recognition_state is LOCKED"

  # ---- temporal -----------------------------------------------------
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "an interval's end is not after (or, for closed date intervals, not on or after) its start"
  - id: ERR_WINDOW_IN_PAST
    http: 422
    condition: "a new promotion campaign or award inventory window opens before the logical clock's current instant"
  - id: ERR_INVALID_NOTICE_SCHEDULE
    http: 422
    condition: "effective_at is not in the future, or grandfather_until is earlier than effective_at"
  - id: ERR_INVALID_TERM
    http: 422
    condition: "an agreement term is shorter than 90 days or starts before the logical clock's calendar date"
  - id: ERR_TRAVEL_DATE_OUT_OF_WINDOW
    http: 422
    condition: "travel_date falls outside the award inventory window's closed date interval"
  - id: ERR_HOLD_EXPIRED
    http: 409
    condition: "ticketing is attempted at or after hold_expires_at"

  # ---- constraint / integrity ---------------------------------------
  - id: ERR_PROMOTION_WINDOW_OVERLAP
    http: 409
    condition: "a new campaign's half-open window overlaps a SCHEDULED or LIVE campaign on the same (program_id, earn_channel); exact adjacency does not trigger this"
  - id: ERR_AWARD_WINDOW_BUFFER_VIOLATION
    http: 409
    condition: "a new award inventory window leaves fewer than 2 clear days from an existing window on the same (program_id, route_code, cabin), or overlaps it"
  - id: ERR_AGREEMENT_TERM_OVERLAP
    http: 409
    condition: "a new agreement's closed term overlaps a non-terminal agreement of the same issuer that it does not supersede"
  - id: ERR_SUPERSEDE_TARGET_INVALID
    http: 422
    condition: "supersedes_agreement_id points at a different issuer's agreement, an agreement not in {RATIFIED, ACTIVE}, an already-superseded agreement, or itself"
  - id: ERR_PROMOTION_CHANNEL_MISMATCH
    http: 422
    condition: "the referenced campaign's earn_channel does not correspond to the transaction's txn_type"
  - id: ERR_RECIPROCITY_SUSPENDED
    http: 409
    condition: "a settlement run or a new award booking references a partner airline whose reciprocity_mode is SUSPENDED"
  - id: ERR_CROSS_PROGRAM_REFERENCE
    http: 422
    condition: "entities from two different loyalty programs are combined in one request"

  # ---- capacity ------------------------------------------------------
  - id: ERR_AWARD_WINDOW_CLOSED
    http: 409
    condition: "a booking is attempted on a window whose capacity_control_state is CLOSED"
  - id: ERR_SEAT_COUNT_INVALID
    http: 422
    condition: "seats is below 1 or above 9"
  - id: ERR_AWARD_SEATS_UNAVAILABLE
    http: 409
    condition: "seats_held + seats_confirmed + requested seats would exceed authorized_seats"
  - id: ERR_SAVER_ALLOTMENT_EXHAUSTED
    http: 409
    condition: "a SAVER booking would push saver_seats_consumed past the window's saver allotment even though raw seats remain"

  # ---- fiscal --------------------------------------------------------
  - id: ERR_INSUFFICIENT_MILES
    http: 402
    condition: "the member's mile_balance is below the miles being debited by a ticketing, redemption, expiry or adjustment posting"
  - id: ERR_VOLUME_COMMITMENT_EXCEEDED
    http: 409
    condition: "drawn_miles + order_miles would exceed 110% of the agreement's committed_volume_miles"
  - id: ERR_ISSUER_SUSPENDED
    http: 409
    condition: "an agreement submission, activation or mile purchase order is attempted while the issuer's status is SUSPENDED"
  - id: ERR_ISSUER_CAP_EXCEEDED
    http: 409
    condition: "ratification would push the issuer's aggregate_committed_miles past annual_mile_purchase_cap_miles"

  # ---- governance / accounting ---------------------------------------
  - id: ERR_REACTION_RISK_EXCEEDED
    http: 409
    condition: "announcement is attempted with member_reaction_index >= 70 and no grandfathering attached"
  - id: ERR_PERIOD_ALREADY_POSTED
    http: 409
    condition: "a DeferredRevenuePosting already exists for the (program_id, period) pair"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:

  - name: ProgramAdmin
    description: "Loyalty program operator. Owns program setup, member lifecycle, promotions, award inventory, program change communication and the epoch runner."
    identity: opaque
    exclusive_operations:
      - "POST /loyalty-programs"
      - "POST /member-accounts"
      - "POST /member-accounts/{memberId}/status-match"
      - "POST /member-accounts/{memberId}/status-match/resolve"
      - "POST /member-accounts/{memberId}/qualification-cycle/close"
      - "POST /member-accounts/{memberId}/qualification-cycle/restate"
      - "POST /promotion-campaigns"
      - "POST /promotion-campaigns/{campaignId}/cancel"
      - "POST /award-inventory-windows"
      - "PATCH /award-inventory-windows/{windowId}/capacity-control"
      - "POST /award-bookings/{bookingId}/refund"
      - "POST /program-change-notices"
      - "POST /program-change-notices/{noticeId}/announce"
      - "POST /program-change-notices/{noticeId}/rollback"
      - "POST /_ops/run-epoch"
    shared_operations:
      - "POST /co-brand-issuers and POST /partner-airlines (with PartnerManager)"
      - "POST /award-bookings, /ticket and /cancel (with Member)"
      - "POST /mile-transactions (with RevenueAccountant)"
      - "every GET across the surface"
      - "POST /_clock/set_current_utc"

  - name: PartnerManager
    description: "Commercial owner of the co-brand relationship. Negotiates and revises agreements and draws mile purchase orders, but may never ratify what it negotiated."
    identity: opaque
    exclusive_operations:
      - "POST /mile-sale-agreements"
      - "POST /mile-sale-agreements/{agreementId}/submit"
      - "POST /mile-sale-agreements/{agreementId}/revise"
      - "POST /mile-purchase-orders"
      - "POST /mile-purchase-orders/{orderId}/issue"
      - "POST /mile-purchase-orders/{orderId}/reverse"
    shared_operations:
      - "POST /co-brand-issuers and POST /partner-airlines (with ProgramAdmin)"
      - "GET across programs, issuers, agreements, orders, campaigns, windows, partners and notices"
      - "POST /_clock/set_current_utc"

  - name: ContractsOfficer
    description: "Independent contract authority. Ratifies and activates agreements; the counterparty control to PartnerManager under segregation of duties."
    identity: opaque
    exclusive_operations:
      - "POST /mile-sale-agreements/{agreementId}/ratify"
      - "POST /mile-sale-agreements/{agreementId}/activate"
    shared_operations:
      - "GET across programs, issuers, agreements and orders"
      - "POST /_clock/set_current_utc"

  - name: RevenueAccountant
    description: "Owns the accounting period, invoicing, cash settlement, partner settlement runs and breakage recognition."
    identity: opaque
    exclusive_operations:
      - "POST /loyalty-programs/{programId}/recognition-transitions"
      - "POST /mile-purchase-orders/{orderId}/invoice"
      - "POST /mile-purchase-orders/{orderId}/settle"
      - "POST /partner-airlines/{airlineId}/settlement-runs"
      - "POST /deferred-revenue-postings"
    shared_operations:
      - "POST /mile-transactions (with ProgramAdmin)"
      - "GET across the ledger surface including member accounts and bookings"
      - "POST /_clock/set_current_utc"

  - name: FraudAnalyst
    description: "Opens, investigates and adjudicates fraud cases. Under segregation of duties the opener of a case may not substantiate or dismiss it."
    identity: opaque
    exclusive_operations:
      - "POST /fraud-cases"
      - "POST /fraud-cases/{caseId}/investigate"
      - "POST /fraud-cases/{caseId}/substantiate"
      - "POST /fraud-cases/{caseId}/dismiss"
    shared_operations:
      - "GET across member accounts, mile transactions, bookings and fraud cases"
      - "POST /_clock/set_current_utc"

  - name: IssuerRepresentative
    description: "The co-brand card issuer acting on its own agreements. X-User-ID is the CoBrandIssuer id; may only counter and read agreements belonging to that issuer."
    identity: "entity_backed:CoBrandIssuer"
    exclusive_operations:
      - "POST /mile-sale-agreements/{agreementId}/counter"
    shared_operations:
      - "GET /co-brand-issuers, GET /mile-sale-agreements and GET /mile-purchase-orders scoped to the issuer's own rows"

  - name: Member
    description: "A loyalty program member acting on their own account. X-User-ID is the MemberAccount id; every read and action is scoped to that member's rows."
    identity: "entity_backed:MemberAccount"
    exclusive_operations: []
    shared_operations:
      - "POST /award-bookings, /ticket and /cancel for their own bookings (with ProgramAdmin)"
      - "GET their own member account, mile transactions, bookings and fraud cases"
      - "GET promotion campaigns, award inventory windows and partner airlines (public award surface)"
