              as: SnowmakingSupervisor
              captures: { err: $.data.error_id }
            - call: "GET /mountain-ops/seasons/${season_id}"
              payload: {  }
              as: SnowmakingSupervisor
            - call: "GET /mountain-ops/pump-houses/${ph1_id}"
              payload: {  }
              as: SnowmakingSupervisor
            - call: "POST /mountain-ops/snowmaking-sessions"
              payload: { terrain_area_id: "${area_id}", pump_house_id: "${ph1_id}", window_start: "2026-08-01T05:00:00Z", window_end: "2026-08-01T12:00:00Z", gun_count: 30, gpm: 1200, expected_terrain_area_version: "${ta_v0}" }
              as: SnowmakingSupervisor
              captures: { err: $.data.error_id }
            - call: "GET /mountain-ops/terrain-areas/${area_id}"
              payload: {  }
              as: SnowmakingSupervisor
