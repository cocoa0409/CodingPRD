# ===========================================================================
# §1.9 Scaffold Corner Design — Optical Laboratory & Prescription Fulfillment
#
# Breadth probe over the §1.1-§1.7 surface of SCAFFOLD.yaml, walked section by
# section against references/claim-extraction-guide.md. §1.8 (depth probe) owns
# the nine hard-reasoning rules; corners already asserted there appear here as
# excluded_because: stubs naming the covering §1.8 instance.
#
# Acting identities (X-User-ID / X-Role) reused across every instance:
#   OPT_A   0a000000-0000-4000-8000-000000000001   StoreOptician
#   OPT_B   0a000000-0000-4000-8000-000000000002   StoreOptician
#   TECH_A  0b000000-0000-4000-8000-000000000001   LabTechnician
#   TECH_B  0b000000-0000-4000-8000-000000000002   LabTechnician
#   INSP_A  0c000000-0000-4000-8000-000000000001   QualityInspector
#   MGR_A   0d000000-0000-4000-8000-000000000001   LabManager
#   BEN_A   0e000000-0000-4000-8000-000000000001   BenefitsAdministrator
# The Prescriber role is entity-backed, so its X-User-ID is always the captured
# ${presc_id} of the Prescriber row of record.
#
# Two standing fixtures are reused verbatim:
#   FIXTURE-S (stock, self-pay): clock 2026-08-01T00:00:00Z, prescriber
#     1234567893/CA (12-month validity), self-pay patient, SV-POLY design
#     (SINGLE_VISION, stock, STANDARD tier, 11995), spherocylindrical Rx
#     -2.00/-1.00x90 both eyes, pd 63.0. Order: frame 8995 + AR_STANDARD 5995
#     => gross 26985, estimated_benefit 0, patient_portion 26985,
#     expedite_fee 0, promised_tat_hours 72, promised_due_at
#     2026-08-04T00:00:00Z. Layout a50/b28/ed52/dbl17 with mono PD 31.5/31.5
#     and fitting height 16.0 => required_blank_diameter_mm 58.0, COMPUTED.
#     Job route STOCK_EDGE_ONLY (no blank lot is ever touched).
#   FIXTURE-A (surfaced, insured): the §1.8 CFG-A fixture — VSP-PREMIER plan,
#     PRG-HI167 progressive design, 80.0 mm blank lot, GEN-1 generator,
#     BAY-1 capacity 2, expedited order => gross 81126, estimated_benefit
#     41697, patient_portion 39429, expedite_fee 13646, promised_tat_hours 24;
#     layout 77.0 mm; route SURFACE_AND_EDGE.
# Every money and geometry literal below was computed by executing the
# matching §1.3 formula with its declared constants.
# ===========================================================================

scaffold_corner_design:

  # =========================================================================
  # §1.1 Entities
  # =========================================================================
  - section: entities
    instances:
      - name: prescriber_creation_returns_active_standing_with_zero_verified_count
        claim_type: creation
        grounds:
          - endpoints.POST_/prescribers
          - entities.Prescriber.fields.status
          - entities.Prescriber.fields.verified_rx_count
        distinguishing_aspect: >-
          A single POST with every required field returns the whole Prescriber row: status ACTIVE and
          verified_rx_count 0 are server-initialised, and version is 1 on creation.
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
          trigger:
            - call: "POST /prescribers"
              payload: { npi: "1234567893", full_name: "Dr Iris Vance", license_state: "CA", max_rx_validity_months: 12 }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { presc_id: $.data.id, presc_v: $.data.version }
          assert:
            - "response_type == object and data.id is a non-empty string"
            - "Prescriber.${presc_id}.npi == 1234567893 and full_name == Dr Iris Vance and license_state == CA"
            - "Prescriber.${presc_id}.max_rx_validity_months == 12"
            - "Prescriber.${presc_id}.status == ACTIVE"
            - "Prescriber.${presc_id}.verified_rx_count == 0"
            - "${presc_v} == 1 and data.created_at == 2026-08-01T00:00:00.000Z and data.updated_at == 2026-08-01T00:00:00.000Z"

      - name: lens_design_retrieval_returns_every_stored_catalogue_field
        claim_type: retrieval
        grounds:
          - endpoints.GET_/lens-designs/{id}
          - entities.LensDesign.fields.allowed_coatings
          - entities.LensDesign.fields.min_blank_diameter_mm
        distinguishing_aspect: >-
          GET /lens-designs/{id} echoes the exact array and decimal values stored by the create call,
          including allowed_coatings order and the 1-decimal geometry minimums.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z and the SV-POLY design published."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
            - call: "POST /lens-designs"
              payload: { design_code: "SV-POLY", design_type: "SINGLE_VISION", material: "POLYCARBONATE", allowed_coatings: ["AR_STANDARD", "HARDCOAT"], retail_price_cents: 11995, min_fitting_height_mm: 14.0, min_blank_diameter_mm: 65.0, product_tier: "STANDARD", stock_sku_available: true, base_curve: 6.0 }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
              captures: { design_sv_id: $.data.id }
          trigger:
            - call: "GET /lens-designs/${design_sv_id}"
              as: LabTechnician
              as_user_id: "0b000000-0000-4000-8000-000000000001"
          assert:
            - "LensDesign.${design_sv_id}.design_code == SV-POLY and design_type == SINGLE_VISION and material == POLYCARBONATE"
            - "LensDesign.${design_sv_id}.allowed_coatings == [AR_STANDARD, HARDCOAT]"
            - "LensDesign.${design_sv_id}.retail_price_cents == 11995 and min_fitting_height_mm == 14.0 and min_blank_diameter_mm == 65.0"
            - "LensDesign.${design_sv_id}.product_tier == STANDARD and stock_sku_available == true and base_curve == 6.0"

      - name: prescriber_listing_pages_by_offset_and_reports_total_count
        claim_type: listing
        grounds:
          - endpoints.GET_/prescribers
          - response_envelope.pagination_fields
          - response_envelope.pagination_placement
        distinguishing_aspect: >-
          With three prescribers and limit 2 / offset 2 the array holds exactly the third row while
          meta reports total_count 3 and has_more false.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; three prescribers created in a fixed order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
            - call: "POST /prescribers"
              payload: { npi: "1234567893", full_name: "Dr Iris Vance", license_state: "CA" }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
            - call: "POST /prescribers"
              payload: { npi: "1245319599", full_name: "Dr Omar Halle", license_state: "CA" }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
            - call: "POST /prescribers"
              payload: { npi: "1679576722", full_name: "Dr Pia Renner", license_state: "OR" }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { presc3_id: $.data.id }
          trigger:
            - call: "GET /prescribers"
              payload: { limit: 2, offset: 2 }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
          assert:
            - "response_type == array and data has exactly 1 element"
            - "data[0].id == ${presc3_id} and data[0].npi == 1679576722"
            - "meta.limit == 2 and meta.offset == 2 and meta.total_count == 3 and meta.has_more == false"

      - name: rx_order_read_with_an_unissued_uuid_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=20]
          - errors.ERR_RX_ORDER_NOT_FOUND
          - endpoints.GET_/rx-orders/{id}
        distinguishing_aspect: >-
          A syntactically valid uuid that no RxOrder row carries returns ERR_RX_ORDER_NOT_FOUND with
          HTTP 404 and an error-shaped envelope, not an empty object.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; no RxOrder rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
          trigger:
            - call: "GET /rx-orders/00000000-0000-4000-8000-0000000000ff"
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404 and response_type == error"
            - "${err_id} == ERR_RX_ORDER_NOT_FOUND"
            - "data.message is a non-empty string and no RxOrder row was created"

      - name: rx_order_creation_missing_fitting_height_is_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=10]
          - errors.ERR_VALIDATION
          - endpoints.POST_/rx-orders
        distinguishing_aspect: >-
          fitting_height_mm is a required input with no default, so omitting it fails structurally at
          priority 10 before any cross-entity rule (verification, expiry, PD consistency) is reached.
        test_recipe:
          setup:
            - "FIXTURE-S up to and including the VERIFIED prescription; no order exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
            - call: "POST /prescribers"
              payload: { npi: "1234567893", full_name: "Dr Iris Vance", license_state: "CA", max_rx_validity_months: 12 }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { presc_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Owen Pike", date_of_birth: "1981-11-09" }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { pat_id: $.data.id }
            - call: "POST /lens-designs"
              payload: { design_code: "SV-POLY", design_type: "SINGLE_VISION", material: "POLYCARBONATE", allowed_coatings: ["AR_STANDARD", "HARDCOAT"], retail_price_cents: 11995, min_fitting_height_mm: 14.0, min_blank_diameter_mm: 65.0, product_tier: "STANDARD", stock_sku_available: true, base_curve: 6.0 }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
              captures: { design_sv_id: $.data.id }
            - call: "POST /prescriptions"
              payload: { patient_id: "${pat_id}", prescriber_id: "${presc_id}", prescriber_npi_claimed: "1234567893", prescriber_license_state_claimed: "CA", sphere_od: -2.00, cylinder_od: -1.00, axis_od: 90, sphere_os: -2.00, cylinder_os: -1.00, axis_os: 90, pd_distance_mm: 63.0, issued_on: "2026-03-01" }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { rx_id: $.data.id }
            - call: "POST /prescriptions/${rx_id}/verify"
              payload: { verification_note: "NPI and license match the prescriber record" }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
          trigger:
            - call: "POST /rx-orders"
              payload: { patient_id: "${pat_id}", prescription_id: "${rx_id}", lens_design_id: "${design_sv_id}", frame_sku: "FRM-S10", frame_retail_cents: 8995, requested_coatings: ["AR_STANDARD"], monocular_pd_od_mm: 31.5, monocular_pd_os_mm: 31.5 }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 400 and ${err_id} == ERR_VALIDATION"
            - "no RxOrder row exists for prescription_id ${rx_id}"
            - "PrescriptionRecord.${rx_id}.verification_status == VERIFIED, untouched by the rejected call"

      - name: prescriber_validity_window_defaults_to_twelve_months
        claim_type: defaults
        grounds:
          - entities.Prescriber.fields.max_rx_validity_months
          - calculations.rx_expiration_window
          - endpoints.POST_/prescribers
        distinguishing_aspect: >-
          Omitting max_rx_validity_months stores 12, and that stored default (not a hard-coded 12 in
          the expiry rule) drives expires_at to exactly 2027-03-01T00:00:00.000Z for a 2026-03-01 Rx.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z, a self-pay patient, and a prescriber created WITHOUT max_rx_validity_months."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
            - call: "POST /patients"
              payload: { full_name: "Owen Pike", date_of_birth: "1981-11-09" }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { pat_id: $.data.id }
            - call: "POST /prescribers"
              payload: { npi: "1234567893", full_name: "Dr Iris Vance", license_state: "CA" }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { presc_id: $.data.id, presc_validity: $.data.max_rx_validity_months }
          trigger:
            - call: "POST /prescriptions"
              payload: { patient_id: "${pat_id}", prescriber_id: "${presc_id}", prescriber_npi_claimed: "1234567893", prescriber_license_state_claimed: "CA", sphere_od: -2.00, cylinder_od: -1.00, axis_od: 90, sphere_os: -2.00, cylinder_os: -1.00, axis_os: 90, pd_distance_mm: 63.0, issued_on: "2026-03-01" }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { rx_id: $.data.id, rx_expiry: $.data.expires_at }
          assert:
            - "${presc_validity} == 12"
            - "${rx_expiry} == 2027-03-01T00:00:00.000Z"
            - "PrescriptionRecord.${rx_id}.verification_status == UNVERIFIED and resubmit_count == 0"

      - name: prescription_expiry_and_multifocal_flag_are_derived_from_the_intake_payload
        claim_type: computed_fields
        grounds:
          - entities.PrescriptionRecord.fields.expires_at
          - entities.PrescriptionRecord.fields.requires_multifocal
          - calculations.rx_expiration_window
        distinguishing_aspect: >-
          Neither expires_at nor requires_multifocal is an input: a single add_power 2.00 sets
          requires_multifocal true and lands on BOTH add_power_od and add_power_os, while expires_at
          comes from the prescriber's 12-month window (2026-03-01 -> 2027-03-01T00:00:00.000Z).
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z, a self-pay patient and a 12-month prescriber."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
            - call: "POST /patients"
              payload: { full_name: "Owen Pike", date_of_birth: "1981-11-09" }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { pat_id: $.data.id }
            - call: "POST /prescribers"
              payload: { npi: "1234567893", full_name: "Dr Iris Vance", license_state: "CA", max_rx_validity_months: 12 }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { presc_id: $.data.id }
          trigger:
            - call: "POST /prescriptions"
              payload: { patient_id: "${pat_id}", prescriber_id: "${presc_id}", prescriber_npi_claimed: "1234567893", prescriber_license_state_claimed: "CA", sphere_od: -3.00, cylinder_od: -1.25, axis_od: 90, sphere_os: -2.75, cylinder_os: -1.00, axis_os: 85, add_power: 2.00, prism_od: 0.50, pd_distance_mm: 61.0, issued_on: "2026-03-01" }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { rx_id: $.data.id }
          assert:
            - "PrescriptionRecord.${rx_id}.requires_multifocal == true"
            - "PrescriptionRecord.${rx_id}.expires_at == 2027-03-01T00:00:00.000Z"
            - "PrescriptionRecord.${rx_id}.add_power_od == 2.00 and add_power_os == 2.00"
            - "PrescriptionRecord.${rx_id}.prism_diopter_od == 0.50 and prism_diopter_os == 0.00 (omitted prism defaults to 0.00)"

      - name: blank_lot_quantity_ledger_is_system_initialised_from_received_qty
        claim_type: system_fields
        grounds:
          - endpoints.POST_/lens-blank-lots
          - entities.LensBlankLot.fields.on_hand_qty
          - entities.LensBlankLot.fields.status
        distinguishing_aspect: >-
          received_qty is the only quantity the caller supplies; on_hand_qty mirrors it while
          allocated_qty, consumed_qty and scrapped_qty are forced to 0 and status to AVAILABLE.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z and the PRG-HI167 progressive design published."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
            - call: "POST /lens-designs"
              payload: { design_code: "PRG-HI167", design_type: "PROGRESSIVE", material: "HIGH_INDEX_167", allowed_coatings: ["AR_PREMIUM", "HARDCOAT"], retail_price_cents: 31995, min_fitting_height_mm: 18.0, min_blank_diameter_mm: 70.0, product_tier: "PREMIUM", stock_sku_available: false, base_curve: 4.0 }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
              captures: { design_prog_id: $.data.id }
          trigger:
            - call: "POST /lens-blank-lots"
              payload: { lens_design_id: "${design_prog_id}", blank_sku: "BLK-167-80", diameter_mm: 80.0, received_qty: 3, received_on: "2026-06-15" }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
              captures: { lot_id: $.data.id, lot_v: $.data.version }
          assert:
            - "LensBlankLot.${lot_id}.received_qty == 3 and on_hand_qty == 3"
            - "LensBlankLot.${lot_id}.allocated_qty == 0 and consumed_qty == 0 and scrapped_qty == 0"
            - "LensBlankLot.${lot_id}.status == AVAILABLE and ${lot_v} == 1"
            - "LensBlankLot.${lot_id}.created_at == 2026-08-01T00:00:00.000Z"

      - name: lens_design_with_an_unknown_design_type_is_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=10]
          - entities.LensDesign.fields.design_type
          - errors.ERR_VALIDATION
        distinguishing_aspect: >-
          design_type is a closed enum of exactly SINGLE_VISION, PROGRESSIVE and SPECIALTY, so
          BIFOCAL fails at priority 10 and no LensDesign row is written.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; no lens designs exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
          trigger:
            - call: "POST /lens-designs"
              payload: { design_code: "BF-CR39", design_type: "BIFOCAL", material: "CR39", allowed_coatings: ["HARDCOAT"], retail_price_cents: 9995, min_fitting_height_mm: 16.0, min_blank_diameter_mm: 65.0, product_tier: "ECONOMY" }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 400 and ${err_id} == ERR_VALIDATION"
            - "GET /lens-designs for design_code BF-CR39 finds nothing: the row was never created"

      - name: quality_inspection_has_no_version_field_and_no_mutating_endpoint
        claim_type: immutability
        grounds:
          - entities.QualityInspection.common_fields
          - endpoints.GET_/quality-inspections/{id}
          - endpoints.POST_/quality-inspections
        distinguishing_aspect: >-
          QualityInspection is declared common_fields false, so the recorded row exposes id and
          created_at but no version and no updated_at, and §1.5 declares no PATCH, PUT or DELETE for
          /quality-inspections — a correction can only be a new row in a new rework cycle.
        test_recipe:
          setup:
            - "FIXTURE-S driven to an EDGED job (bay BAY-S, edging window 08:00-09:00Z completed by TECH_A) with the SINGLE_VISION tolerance standard published."
            - "One OD inspection recorded by INSP_A with measurements exactly on prescription."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
            - call: "POST /prescribers"
              payload: { npi: "1234567893", full_name: "Dr Iris Vance", license_state: "CA", max_rx_validity_months: 12 }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { presc_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Owen Pike", date_of_birth: "1981-11-09" }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { pat_id: $.data.id }
            - call: "POST /lens-designs"
              payload: { design_code: "SV-POLY", design_type: "SINGLE_VISION", material: "POLYCARBONATE", allowed_coatings: ["AR_STANDARD", "HARDCOAT"], retail_price_cents: 11995, min_fitting_height_mm: 14.0, min_blank_diameter_mm: 65.0, product_tier: "STANDARD", stock_sku_available: true, base_curve: 6.0 }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
              captures: { design_sv_id: $.data.id }
            - call: "POST /tolerance-standards"
              payload: { design_type: "SINGLE_VISION", power_band_min_abs: 0.00, power_band_max_abs: 6.00, sphere_tolerance_diopters: 0.13, cylinder_tolerance_diopters: 0.13, axis_tolerance_degrees: 3, prism_tolerance_pd: 0.33, allowed_cosmetic_defect_codes: ["MINOR_EDGE_CHIP"], effective_from: "2026-01-01" }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
              captures: { tol_sv_id: $.data.id }
            - call: "POST /finishing-bays"
              payload: { bay_code: "BAY-S", concurrent_capacity: 1 }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
              captures: { bay_id: $.data.id }
            - call: "POST /prescriptions"
