            - "GET /api/communities/${alpha_id}/content-reports as Moderator returns 200 with 0 rows"

      - name: appeal_decide_on_an_already_decided_appeal_is_invalid_state
        claim_type: "Violation to Error"
        grounds:
          - errors[ERR_INVALID_STATE]
          - errors[ERR_NO_NEW_EVIDENCE]
          - state_machines.Appeal.SUBMITTED_to_DENIED
        distinguishing_aspect: "The state check precedes the evidence check on the appeal decide route, so a second decide on an already DENIED appeal reports ERR_INVALID_STATE rather than ERR_NO_NEW_EVIDENCE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community holding a banned account whose sanction is ACTIVE and an appeal already DENIED without evidence movement."
          setup_api_calls:
