            - call: "POST /trade-marketing/deductions/${ded_id}/dispute"
              payload: { reason_code: "NO_AGREEMENT", disputed_amount: 400.00 }
              as: DeductionSpecialist
              as_user_id: "ded-1"
              captures: { disp_id: $.data.id }
            - call: "POST /trade-marketing/disputes/${disp_id}/send-to-retailer"
              payload: { packet_notes: "First packet with the signed letter of intent." }
              as: DeductionSpecialist
              as_user_id: "ded-1"
              captures: { round_1: $.data.round_count }
            - call: "POST /trade-marketing/disputes/${disp_id}/retailer-respond"
              payload: { retailer_response: "PROVIDE_EVIDENCE" }
              as: CustomerPortalUser
              as_user_id: "${cust_id}"
            - call: "POST /trade-marketing/disputes/${disp_id}/send-to-retailer"
              payload: { packet_notes: "Second packet with the scan-data extract." }
              as: DeductionSpecialist
              as_user_id: "ded-1"
              captures: { round_2: $.data.round_count }
            - call: "POST /trade-marketing/disputes/${disp_id}/retailer-respond"
              payload: { retailer_response: "REFUSE" }
              as: CustomerPortalUser
              as_user_id: "${cust_id}"
              captures: { status_back: $.data.status, round_after_reply: $.data.round_count }
          trigger:
            - call: "POST /trade-marketing/disputes/${disp_id}/send-to-retailer"
              payload: { packet_notes: "Third packet." }
              as: DeductionSpecialist
              as_user_id: "ded-1"
              captures: { err: $.data.error_id }
          assert:
            - "${round_1} == 1 and ${round_2} == 2"
            - "${status_back} == OPEN and ${round_after_reply} == 2 — the reply returns the dispute to OPEN without resetting the counter"
            - "HTTP 409 and ${err} == ERR_DISPUTE_ROUND_LIMIT"
            - "Dispute.${disp_id}.status == OPEN, .round_count == 2 and .retailer_response == REFUSE"
            - "Deduction.${ded_id}.status == DISPUTED"

      - name: agreement_cap_validation_needs_an_accrual_book
        claim_type: error_triggerable
        grounds:
          - errors.ERR_ACCRUAL_BALANCE_INSUFFICIENT
          - validations.priority_98
          - calculations.deduction_valuation
        distinguishing_aspect: |
          ERR_ACCRUAL_BALANCE_INSUFFICIENT (422) is the last rule in the chain and is only
          reachable under AGREEMENT_CAP: the promotion has never been accrued, so
          accrued_balance is 0.00 and there is no entitlement to value the claim against.
          Priority 86 stays silent because that customer is not EVIDENCE_BASED.
        test_recipe:
          setup:
            - "An AGREEMENT_CAP customer with an APPROVED, never-accrued promotion and a 600.00 claim matched to it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/programs"
              payload: { fiscal_year: 2026, name: "FY2026 National Trade Fund", total_budget_amount: 500000.00, accrual_method_default: "CONSUMPTION" }
