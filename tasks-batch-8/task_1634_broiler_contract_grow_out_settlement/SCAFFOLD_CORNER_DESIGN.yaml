      - name: placement_head_count_over_capacity_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_QUANTITY_INVALID]"]
        distinguishing_aspect: "head_count > House.capacity_birds -> ERR_QUANTITY_INVALID 422."
        test_recipe:
          setup: ["flock PLANNED on house capacity 5000"]
          setup_api_calls:
            - { call: "POST /api/growers", payload: { grower_code: "G-V1", full_name: "Valid One" }, as: IntegratorAdmin, captures: { g: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H1", capacity_birds: 5000 }, as: IntegratorAdmin, captures: { h: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${g}", contract_no: "C-V1", base_pay_cents_per_lb: 6, committed_house_count: 1, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin }
