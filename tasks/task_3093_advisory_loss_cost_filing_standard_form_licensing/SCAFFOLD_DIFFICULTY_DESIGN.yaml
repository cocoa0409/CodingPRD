            - call: "POST /bureau/filings/${f_id}/submit-review"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_id}/complete-review"
              payload: {}
              as: BureauActuary
            - call: "POST /bureau/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: BureauAdmin
