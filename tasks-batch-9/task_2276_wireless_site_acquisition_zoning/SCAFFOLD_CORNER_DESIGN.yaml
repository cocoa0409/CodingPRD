          - state_machines.StructuralAnalysis.IN_PROGRESS_to_COMPLETED
          - calculations.provider_crew_day_ledger
        excluded_because:
          difficulty_instance: transitive_cascade / structural_fail_cascades_to_backhaul_cancellation_and_crew_ledger
          rationale: "That instance walks the four-link chain (analysis FAIL -> candidate DISQUALIFIED -> zoning WITHDRAWN -> order CANCELLED -> provider ledger) in one trigger."

      - name: corner_dual_variant_layer_delta
        claim_type: dual_variant_calculation
        grounds:
          - calculations.lease_committed_rent
          - calculations.on_air_schedule_forecast
        excluded_because:
          difficulty_instance: dual_variant_calc / lease_committed_rent_provisional_vs_final_diverge
          rationale: "Both declared dual-variant calculations already have §1.8 instances asserting each variant and the delta between them."

  # =========================================================================
  - section: consistency model
    instances:
      - name: corner_execute_response_reflects_all_derived_changes_immediately
        claim_type: immediate
        grounds:
          - state_machines.LeaseAgreement.ACCEPTED_to_EXECUTED
          - calculations.landlord_executed_lease_ledger
          - calculations.lease_committed_rent
        distinguishing_aspect: "Consistency is immediate: the execute response itself already carries committed_rent_final_usd 588795.12, and reads issued straight afterwards with no intervening write show Candidate LEASE_EXECUTED and Landlord.executed_lease_count 1 — nothing lags."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "an ACCEPTED FIXED_PCT lease (2512.50 base, 3% escalation, 5-year term, two 5-year renewals, 5% revenue share) on an engaged candidate"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /jurisdictions"
              payload: { name: "Northeast Township", market_code: "MKT-NE-01", by_right_review_days: 60, conditional_use_review_days: 90, variance_review_days: 150, hearing_cadence_days: 14, requires_visual_simulation: false, max_continuances: 2, historic_district_flag: false, tribal_consultation_required: false, historical_delay_factor: 1.20, appeal_window_days: 30 }
              as: ZoningPlanner
              captures: { jur_id: $.data.id }
            - call: "POST /search-rings"
              payload: { name: "Ring 2276-A", market_code: "MKT-NE-01", center_lat: 42.3500, center_lon: -71.0600, radius_m: 800, required_agl_m: 45, objective_type: "COVERAGE_AND_CAPACITY", target_rsrp_dbm: -95, target_capacity_gbps: 10, market_benchmark_monthly_rent_usd: 2400.00, capex_budget_usd: 250000.00, priority_rank: 1 }
              as: RfEngineer
              captures: { ring_id: $.data.id }
            - call: "POST /search-rings/${ring_id}/open"
              as: RfEngineer
            - call: "POST /landlords"
              payload: { legal_name: "Beacon Holdings LLC", entity_type: "LLC", contact_email: "asset@beacon.example", market_code: "MKT-NE-01", outreach_optout: false }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { ll_id: $.data.id }
            - call: "POST /candidates"
              payload: { search_ring_id: "${ring_id}", landlord_id: "${ll_id}", jurisdiction_id: "${jur_id}", owning_agent_user_id: "agent-001", site_type: "TOWER", lat: 42.3510, lon: -71.0620, distance_from_center_m: 200, agl_m: 60, months_to_availability: 3, measured_rsrp_dbm: -88, offered_capacity_gbps: 10 }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { cand_id: $.data.id }
            - call: "POST /candidates/${cand_id}/outreach-events"
              payload: { event_type: "OUTREACH_SENT" }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
            - call: "POST /candidates/${cand_id}/outreach-events"
              payload: { event_type: "LANDLORD_REPLY" }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
            - call: "POST /leases"
              payload: { candidate_id: "${cand_id}", landlord_id: "${ll_id}", negotiating_agent_user_id: "agent-001", base_monthly_rent_usd: 2512.50, escalation_type: "FIXED_PCT", escalation_pct: 0.03, initial_term_years: 5, renewal_option_count: 2, renewal_term_years: 5, equipment_expansion_sqft: 120, revenue_share_pct: 0.05 }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/rounds"
              payload: { action: "SUBMIT", counter_rent_usd: 2512.50 }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
            - call: "POST /leases/${lease_id}/rounds"
              payload: { action: "ACCEPT" }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
          trigger:
            - call: "POST /leases/${lease_id}/execute"
              payload: { execution_date: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "director-001"
            - call: "GET /candidates/${cand_id}"
              as: ProgramDirector
              as_user_id: "director-001"
            - call: "GET /landlords/${ll_id}"
              as: ProgramDirector
              as_user_id: "director-001"
          assert:
            - "the execute response body carries status == EXECUTED and committed_rent_final_usd == 588795.12"
            - "the execute response body carries committed_rent_provisional_usd == 160070.45"
            - "the immediate candidate read returns acquisition_status == LEASE_EXECUTED"
            - "the immediate landlord read returns executed_lease_count == 1 and standing == ACTIVE"
            - "LeaseAgreement.${lease_id}.execution_date == 2026-08-01T00:00:00Z"
