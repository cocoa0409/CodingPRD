      - name: corner_validation_pagination_limit_and_offset_boundaries
        claim_type: Violation to Error
        grounds: ["validations[priority=36]", "errors[ERR_INVALID_PAGINATION]", "calculations.pagination_window", "response_envelope.pagination_defaults"]
        distinguishing_aspect: |
          The declared window is limit in [1, 100] and offset >= 0, both bounds
          INCLUSIVE on the passing side: over three technicians, limit 1 returns 1 row
          with total_count 3 and has_more true, limit 100 returns all 3 rows with
          has_more false, and offset 3 returns 0 rows with has_more false and
          total_count still 3. limit 0, limit 101 and offset -1 each fail at G8_QUERY
          with ERR_INVALID_PAGINATION. An implementation that clamps out-of-range
          values instead of rejecting them returns 200 for the last three calls.
        test_recipe:
          setup: ["Three technicians created in a fixed order, so the default created_at ASC sort is deterministic."]
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/technicians"
              payload: { full_name: "Page Tech One", tier: "APPRENTICE", home_jurisdiction_code: "JUR_ALPHA", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { t1: $.data.id }
            - call: "POST /water-service/technicians"
              payload: { full_name: "Page Tech Two", tier: "JOURNEYMAN", home_jurisdiction_code: "JUR_BRAVO", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { t2: $.data.id }
            - call: "POST /water-service/technicians"
              payload: { full_name: "Page Tech Three", tier: "MASTER", home_jurisdiction_code: "JUR_ALPHA", status: "OFF_DUTY" }
              as: PlatformAdmin
              captures: { t3: $.data.id }
          trigger:
            - call: "GET /water-service/technicians"
              payload: { limit: 1 }
              as: PlatformAdmin
            - call: "GET /water-service/technicians"
              payload: { limit: 100 }
              as: PlatformAdmin
            - call: "GET /water-service/technicians"
              payload: { offset: 3 }
              as: PlatformAdmin
            - call: "GET /water-service/technicians"
              payload: { limit: 0 }
              as: PlatformAdmin
              captures: { err_zero: $.data.error_id }
            - call: "GET /water-service/technicians"
              payload: { limit: 101 }
              as: PlatformAdmin
              captures: { err_over: $.data.error_id }
            - call: "GET /water-service/technicians"
              payload: { offset: -1 }
              as: PlatformAdmin
              captures: { err_neg: $.data.error_id }
          assert:
            - "GET /water-service/technicians with limit 1 returns exactly 1 row, that row is ${t1}, total_count == 3 and has_more == true"
            - "GET /water-service/technicians with limit 100 returns exactly 3 rows in the order ${t1}, ${t2}, ${t3}, total_count == 3 and has_more == false"
            - "GET /water-service/technicians with offset 3 returns exactly 0 rows, total_count == 3 and has_more == false"
            - "${err_zero} == ERR_INVALID_PAGINATION"
            - "${err_over} == ERR_INVALID_PAGINATION"
            - "${err_neg} == ERR_INVALID_PAGINATION"
            - "HTTP status is 400 on each of the three rejected calls"

