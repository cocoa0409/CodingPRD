  # -------------------------------------------------------------------
  # Rule 4 - transitive_cascade
  # -------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: install_exception_cascades_four_hops_from_opening_to_designer_suspension
        grounds:
          - state_machines.InstallJob.SCHEDULED_to_EXCEPTION_RAISED
          - state_machines.Opening.QUOTED_to_REMEASURE_REQUIRED
          - state_machines.VendorOrder.RECEIVED_to_REMAKE_REQUESTED
          - state_machines.VendorOrder.REMAKE_REQUESTED_to_PLACED
          - state_machines.Designer.ACTIVE_to_SUSPENDED
          - state_machines.Consultation.SCHEDULED_to_CANCELLED
          - calculations.install_exception_liability
          - calculations.remake_chargeback_waterfall
          - calculations.vendor_lead_time
          - calculations.designer_liability_score
        distinguishing_aspect: |
          Cascade of depth FOUR spanning five entity types, fired by a single exception
          call: Opening -> VendorOrder re-placement -> ledger/Designer score -> Designer
          suspension -> a THIRD entity type (an unrelated future Consultation) cancelled.
          It is the money-and-risk cascade; the other transitive_cascade instance is a
          three-hop capacity cascade that touches no money at all.
        test_recipe:
          setup:
            - "One ACTIVE ROLLING_180D territory, one ACTIVE designer with a clean record (score 100, no prior exceptions, no late returns, no completed installs)."
            - "One vendor with base_lead_time_days 10, motorization_extra_days 3, cutoff_hour_utc 15, concurrent_capacity 2 and remake_policy FULL_VENDOR_90D - deliberately the policy that would put the whole cost on the vendor, to prove the INSTALL_EXCEPTION variant ignores it."
            - "One LT-SHEER / CORDED opening measured INSIDE with a 0.500 in width spread (widths 24.000 / 24.500 / 24.100, heights 48.000 / 48.100 / 48.050, depth 3.000): ordered 23.5 x 47.75, list 4960, out_of_square_in 0.500 which is strictly above the 0.375 tolerance."
            - "That opening is quoted (subtotal 4960, install fee 10000, net 4960), accepted at 2026-08-03T16:00:00.000Z (royalty 273 accrued), ordered (order_cost 2083, effective placement 2026-08-04 because 16:00 is past the 15:00 cutoff, promised 2026-08-14), shipped and received."
            - "The SAME designer also holds a second, still-future consultation on 2026-09-10 for a second lead - the collateral row the suspension cascade must cancel."
            - "One install job for the order, scheduled 2026-08-20T09:00:00.000Z, with the clock moved to 2026-08-20T09:30:00.000Z."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"], royalty_rate_pct: 0.055, lead_capacity_per_week: 5, credit_limit_cents: 2000000, liability_window: "ROLLING_180D" }
