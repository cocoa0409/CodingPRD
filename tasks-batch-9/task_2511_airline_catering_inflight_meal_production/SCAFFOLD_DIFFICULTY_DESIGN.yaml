          setup:
            - "Flight AN412 is planned exactly as in provisional_and_final_meal_requirement_diverge_on_load_factor_and_special_meals: 4 batches of 7 / 23 / 178 / 3 units."
            - "All four batches are produced at their planned quantity, pass their required HACCP steps and are RELEASED before the HOT deadline 2026-09-15T08:00:00Z."
            - "One OVEN_RACK HOT cart holds the 7 FIRST and 23 BUSINESS units; one STD_FULL CHILL cart holds the 178 AN-Y-STD and 3 AN-Y-VGML units."
