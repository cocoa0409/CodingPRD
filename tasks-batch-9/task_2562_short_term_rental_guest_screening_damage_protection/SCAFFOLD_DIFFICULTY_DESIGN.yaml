# §1.8 Scaffold Difficulty Design — task 2562 Short-Term Rental Guest Screening & Damage Protection
# Every instance grounds in elements already declared in SCAFFOLD.yaml §1.1–§1.7.
# Every numeric literal in `assert:` was computed by executing the §1.3 formulas
# with their declared constants (see the worked examples inside each calculation's
# `precision:` block) — no estimates, no unresolved expressions.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: guest_risk_snapshot_frozen_while_live_score_rebands
        grounds:
          - calculations.guest_risk_score
          - calculations.reservation_charge
          - entities.Guest.fields.risk_score
          - entities.Guest.fields.risk_tier
          - entities.Reservation.fields.risk_score_at_booking
          - entities.Reservation.fields.risk_tier_at_booking
          - state_machines.Incident.OPEN_to_ACKNOWLEDGED
        distinguishing_aspect: |
          Variant divergence in the GUEST-SCREENING domain: guest_risk_score variant
          booking_snapshot is frozen on the Reservation row while variant live_current
          re-runs on the Guest, so after one acknowledged incident Guest.risk_score reads
          29/ELEVATED while Reservation.risk_score_at_booking still reads 20/LOW and the
          waiver fee stays priced at the LOW multiplier 1.00 (9000, not 11250).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One host, one jurisdiction rule (min_stay_nights 2, max_occupancy_cap 8, sensor_notice_required true), one ACTIVE WAIVER listing at nightly_rate_cents 30000 and waiver_nightly_fee_cents 3000."
            - "One guest holding an ACCEPTED GOVERNMENT_ID plus an ACCEPTED SELFIE, so verification_state is VERIFIED and risk_score is 20 (BASE_RISK 35 + VERIFIED_CREDIT -15) in tier LOW."
            - "A 3-night reservation booked while the guest read 20/LOW, confirmed and checked in."
            - "One OPEN PROPERTY_DAMAGE incident filed by the host against that stay."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rentals/hosts"
              payload: { legal_name: "Bayview Stays LLC", email: "host1@stays.test" }
              as: PlatformAdmin
              captures: { h1: $.data.id }
            - call: "POST /rentals/guests"
              payload: { full_name: "Dana Reyes", email: "dana@guest.test", country_code: "US" }
              as: PlatformAdmin
              captures: { g1: $.data.id }
            - call: "POST /rentals/jurisdiction-rules"
              payload: { jurisdiction_code: "US-CA-SFO", min_stay_nights: 2, max_occupancy_cap: 8, events_prohibited: false, registration_required: false, indoor_camera_allowed: true, indoor_audio_allowed: false, sensor_notice_required: true, noise_threshold_db: 70 }
              as: ComplianceOfficer
              captures: { j1: $.data.id }
            - call: "POST /rentals/properties"
              payload: { host_id: "${h1}", jurisdiction_rule_id: "${j1}", address_line: "14 Harbor Way", city: "San Francisco", max_occupancy: 6, bedrooms: 3, nightly_rate_cents: 30000, protection_product: "WAIVER", deposit_amount_cents: 0, waiver_nightly_fee_cents: 3000, claim_ceiling_cents: 500000, event_policy: "EVENTS_ALLOWED", turnover_buffer_nights: 0 }
              as: Host
              as_user_id: "${h1}"
              captures: { p1: $.data.id }
            - call: "POST /rentals/properties/${p1}/activate"
              payload: {}
              as: Host
              as_user_id: "${h1}"
            - call: "POST /rentals/identity-documents"
              payload: { guest_id: "${g1}", doc_type: "GOVERNMENT_ID", issuing_country: "US", document_ref: "gov-dana-1", expires_on: "2030-01-01T00:00:00Z" }
              as: Guest
              as_user_id: "${g1}"
              captures: { d1: $.data.id }
            - call: "POST /rentals/identity-documents/${d1}/review"
              payload: { decision: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /rentals/identity-documents"
              payload: { guest_id: "${g1}", doc_type: "SELFIE", issuing_country: "US", document_ref: "selfie-dana-1", expires_on: "2030-01-01T00:00:00Z" }
              as: Guest
              as_user_id: "${g1}"
              captures: { d2: $.data.id }
            - call: "POST /rentals/identity-documents/${d2}/review"
              payload: { decision: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /rentals/properties/${p1}"
              payload: {}
              as: Host
              as_user_id: "${h1}"
              captures: { p1v: $.data.version }
            - call: "POST /rentals/reservations"
              payload: { guest_id: "${g1}", property_id: "${p1}", check_in: "2026-08-10", check_out: "2026-08-13", guest_count: 2, event_declared: false, expected_property_version: "${p1v}" }
              as: Guest
              as_user_id: "${g1}"
              captures: { r1: $.data.id }
            - call: "POST /rentals/reservations/${r1}/confirm"
              payload: {}
              as: Host
              as_user_id: "${h1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T02:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rentals/reservations/${r1}/check-in"
              payload: {}
              as: Host
              as_user_id: "${h1}"
            - call: "POST /rentals/incidents"
              payload: { reservation_id: "${r1}", incident_type: "PROPERTY_DAMAGE", severity: "MEDIUM", source: "HOST_REPORT", detected_at: "2026-08-11T01:30:00Z", description: "Cracked glass cooktop found during a mid-stay check." }
              as: Host
              as_user_id: "${h1}"
              captures: { i1: $.data.id }
          trigger:
            - call: "POST /rentals/incidents/${i1}/acknowledge"
              payload: {}
              as: TrustAdjudicator
              as_user_id: "adj-1"
          assert:
            - "Incident.${i1}.incident_state == ACKNOWLEDGED"
            - "Incident.${i1}.substantiated == true"
            - "Guest.${g1}.substantiated_incident_count == 1"
            - "Guest.${g1}.risk_score == 29"
            - "Guest.${g1}.risk_tier == ELEVATED"
            - "Reservation.${r1}.risk_score_at_booking == 20"
            - "Reservation.${r1}.risk_tier_at_booking == LOW"
            - "Reservation.${r1}.waiver_fee_cents == 9000"
            - "Reservation.${r1}.pre_fee_subtotal_cents == 99000"
            - "Reservation.${r1}.total_charged_cents == 102465"
            - "GET /rentals/guests/${g1}/risk-profile returns risk_score 29 and risk_tier ELEVATED in the same request in which GET /rentals/reservations/${r1} still returns risk_score_at_booking 20"

      - name: claim_recovery_projection_diverges_from_final_after_layer_partly_consumed
        grounds:
          - calculations.claim_recovery
          - entities.DamageClaim.fields.projected_recovery_cents
          - entities.DamageClaim.fields.recovered_cents
          - entities.DamageClaim.fields.uncovered_cents
          - entities.CoverageLayer.fields.consumed_cents
          - state_machines.DamageClaim.UNDER_REVIEW_to_APPROVED
          - state_machines.CoverageLayer.AVAILABLE_to_EXHAUSTED
        distinguishing_aspect: |
          Variant divergence in the SETTLEMENT-MONEY domain (a different entity domain
          from the guest-screening instance above): claim_recovery variant
          provisional_at_submission pins projected_recovery_cents 222500 while the layer is
          untouched, and variant final_at_decision on the identical claim recovers only
          147500 with uncovered_cents 100000 once a competing claim has consumed 100000 of
          the same layer — a 75000 delta on unchanged claim data.
        test_recipe:
          setup:
            - "Logical clock stepped 2026-08-01 -> 2026-08-10T16:00Z -> 2026-08-13T12:00Z."
            - "One host owning two DEPOSIT listings (nightly_rate_cents 20000, deposit_amount_cents 50000, claim_ceiling_cents 400000), both ACTIVE."
            - "Exactly one coverage layer: PLATFORM_PROTECTION, PLATFORM_GLOBAL, layer_order 20, limit_cents 250000, deductible_cents 20000, coverage_pct 0.75."
            - "Two guests, each with a 3-night COMPLETED stay (one per listing) whose 50000 deposit hold is still HELD."
            - "Claim A (150000) and claim B (300000) both UNDER_REVIEW, both submitted BEFORE either decision, so both projections read the layer at consumed_cents 0."
            - "Claim A then approved at 150000, which consumes 100000 of the layer's 250000 limit."
