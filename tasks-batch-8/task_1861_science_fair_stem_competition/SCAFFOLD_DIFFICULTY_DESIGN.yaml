            - "Edition (Z_SCORE, max_judges=2, quorum=50), one category with advancement_slots=1 (waitlist depth 1); Mentor M owns P1 (raw 95/97, ADVANCED rank 1) and P2 (raw 60/62, WAITLISTED rank 2); CATEGORY_FIRST award on P1; ScholarshipPool 1000000; edition finalized"
