            - "BR-B's auto shipment manifest is [{500 x 0}] -> precisely [{2000, 1}, {10000, 1}]: surplus 100000 - 85000 = 15000 cents -> floor(15000 * 920000 / 1000000) = 13800 minor -> one 10000 note then one 2000 note, manifest_minor_units 12000, manifest_usd_equivalent_cents 13043"
