              as: CsfAdmin
              captures: { ledger_id: $.data.id }
            - call: "POST /csf/trips"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", quota_ledger_id: "${ledger_id}", gear_type: "HOOK_AND_LINE", management_area: "GOM-2" }
              as: CsfAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /csf/trips/${trip_id}/land"
              payload: { species: "COD", landed_pounds_gross: 10.04, ex_vessel_price_cents_per_lb: 850, offload_minutes: 12 }
