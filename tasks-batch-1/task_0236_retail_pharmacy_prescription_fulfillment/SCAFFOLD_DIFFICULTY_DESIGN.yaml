  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: refill_too_soon_temporal_beats_controlled_locked_safety
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - errors[ERR_PATIENT_CONTROLLED_LOCKED]
          - errors[ERR_REFILL_TOO_SOON]
        distinguishing_aspect: |
          Pair business_safety (priority 11, ERR_PATIENT_CONTROLLED_LOCKED) vs
          business_temporal (priority 12, ERR_REFILL_TOO_SOON). A controlled
          refill that is BOTH too-soon AND for a LOCKED patient returns the
          higher-priority ERR_PATIENT_CONTROLLED_LOCKED (priority 11 wins).
        test_recipe:
          setup:
            - "Patient LOCKED (controlled_status) AND attempting a controlled refill before the refill-too-soon window"
          setup_api_calls:
            - call: "POST /_clock/set"
