            - "member Nora Ellery on SIG4 reserved 2026-08-05..2026-08-09 and then swapped that reservation for 2026-08-06..2026-08-10, so the original is SUPERSEDED and the swap reservation is MATCHED on the same unit with is_swap true"
            - "the swap reservation completes its turn: dispatched 2026-08-06T08:00:00Z, delivered the same instant, return initiated 2026-08-10T17:00:00Z, INBOUND leg received 2026-08-11T09:00:00Z (inside the RETURN_GRACE_DAYS window, so no late fee), inspected clean, photographed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /membership-plans"
              payload: { code: "SIG4", name: "Signature 4", item_slots: 3, monthly_fee_cents: 10000, monthly_swaps_allowed: 2, shipping_cadence_days: 7, waiver_monthly_fee_cents: 1800, waiver_coverage_cents: 10000 }
              as: PlatformAdmin
