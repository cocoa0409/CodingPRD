            - call: "POST /child-support/cases/${caseg5}/paternity-actions"
              payload: { method: "VOLUNTARY_ACKNOWLEDGMENT" }
              as: CaseWorker
              captures: { g5_pa: "$.data.id", g5_pa_status: "$.data.status" }
            - call: "GET /child-support/cases/${caseg5}"
              as: CaseWorker
              captures: { g5_cs: "$.data.case_status" }
            - call: "POST /child-support/cases/${caseh5}/paternity-actions"
              payload: { method: "VOLUNTARY_ACKNOWLEDGMENT" }
              as: CaseWorker
              captures: { e_notlocated1: "$.data.error_id" }
            - call: "POST /child-support/cases/${caseh5}/locate-referrals"
              payload: { locate_source: "STATE_DIRECTORY_OF_NEW_HIRES" }
              as: CaseWorker
              captures: { h5_cs: "$.data.case_status", h5_refcount: "$.data.locate_referral_count" }
            - call: "POST /child-support/cases/${caseh5}/paternity-actions"
