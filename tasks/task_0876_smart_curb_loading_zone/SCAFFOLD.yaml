# =============================================================================
# Smart-Curb & Loading-Zone Management — benchmark seed tables (v1)
# =============================================================================

scenario: "Smart-Curb & Loading-Zone Management: curb-space inventory & designation, permit (loading/valet/TNC) & schedule, dynamic pricing & sensor occupancy, delivery-window reservation, enforcement & citation linkage, event reallocation, digital curb map, revenue"

domain_name: smart-curb-loading-zone
api_prefix: /curb

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency        # OCC on CurbZone.version for redesignation supersede
    - cascading_side_effects        # event activation cascades zone -> reservation -> ledger
    - dual_variant_calculation      # reservation estimate vs settled; citation issue vs upheld-late
    - rate_threshold_triggers       # occupancy-ratio surge tiers with >= boundary

  entity_topology: flat             # peer entities linked by FK fields; no nested-in-URL ownership
  state_machine_shape: cyclic       # permit revision loop + citation dispute; reservation parallel axes
  relationship_patterns:
    - one_to_many
    - many_to_many                  # CurbEvent.zone_ids reallocates many zones
    - cross_aggregate               # Reservation references Permit + Zone across aggregates
  role_model: segregation_of_duties # permit reviewer (CurbPlanner) != approver (PermitApprover), four-eyes on X-User-ID
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Permittee
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered business/carrier name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: permittee_type, type: enum, source: input, description: "CARRIER | VALET_OPERATOR | TNC | MERCHANT" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE — account standing (single active state in v1)" }
      - { name: outstanding_fines_cents, type: integer, source: computed, description: "Sum of Citation.fine_due_cents for this permittee whose status IN {ISSUED, DISPUTED, UPHELD} (excludes PAID and DISMISSED)" }

  - name: PricingPolicy
    parent: null
    common_fields: false
    fields:
      - { name: name, type: string, source: input, description: "Policy label" }
      - { name: base_rate_cents_per_15min, type: integer, source: input, description: "Base rate per 15-minute slot in cents" }
      - { name: peak_multiplier_bps, type: integer, source: input, description: "Time-of-use peak multiplier in basis points (10000 = 1.0x)" }
      - { name: peak_start_hour, type: integer, source: input, constraints: "0..23", description: "Peak window start hour UTC, inclusive" }
      - { name: peak_end_hour, type: integer, source: input, constraints: "0..23", description: "Peak window end hour UTC, exclusive (half-open [peak_start_hour, peak_end_hour))" }
      - { name: surge_tier1_ratio_bps, type: integer, source: input, description: "Occupancy ratio threshold for tier1 surge, bps (5000 = 0.50)" }
      - { name: surge_tier1_mult_bps, type: integer, source: input, description: "Tier1 surge multiplier bps (12500 = 1.25x)" }
      - { name: surge_tier2_ratio_bps, type: integer, source: input, description: "Occupancy ratio threshold for tier2 surge, bps (8000 = 0.80)" }
      - { name: surge_tier2_mult_bps, type: integer, source: input, description: "Tier2 surge multiplier bps (15000 = 1.50x)" }

  - name: CurbZone
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human label for the curb segment" }
      - { name: block_face, type: string, source: input, description: "Street block-face identifier" }
      - { name: length_meters, type: number, source: input, description: "Physical length of the curb segment" }
      - { name: designation, type: enum, source: input, description: "LOADING | VALET | TNC | PASSENGER | METERED | NO_STANDING — current curb designation" }
      - { name: capacity_slots, type: integer, source: input, constraints: ">= 1", description: "Maximum concurrent reservations the zone can hold" }
      - { name: pricing_policy_id, type: string, source: input, description: "FK -> PricingPolicy.id; pricing rules applied to reservations on this zone" }
      - { name: base_rate_override_cents, type: integer, source: input, default: null, description: "Optional per-zone base rate override in cents; when null the PricingPolicy base rate applies" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED | RETIRED — operational status" }
      - { name: sensor_occupancy_state, type: enum, source: computed, default: "VACANT", description: "VACANT | OCCUPIED — derived from the presence of an OPEN OccupancySession on this zone" }
      - { name: revenue_accrued_cents, type: integer, source: computed, description: "Sum of LedgerEntry.amount_cents (signed) for entries whose zone_id == this zone" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version; increments on every mutation" }

  - name: CurbPermit
    parent: null
    common_fields: true
    fields:
      - { name: permittee_id, type: string, source: input, description: "FK -> Permittee.id; owner of this permit" }
      - { name: requested_designation, type: enum, source: input, description: "LOADING | VALET | TNC — the curb use requested" }
      - { name: purpose, type: string, source: input, description: "Free-text description of intended use" }
      - { name: zone_ids, type: array, source: input, description: "List of CurbZone ids this permit authorizes (validated ACTIVE at approval)" }
      - { name: reviewer_user_id, type: string, source: system, default: null, description: "X-User-ID of the CurbPlanner who moved the permit to UNDER_REVIEW" }
      - { name: approver_user_id, type: string, source: system, default: null, description: "X-User-ID of the PermitApprover who approved/denied" }
      - { name: last_change_note, type: string, source: system, default: null, description: "Note recorded by the most recent request-changes action" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | UNDER_REVIEW | ACTIVE | DENIED | REVOKED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: ScheduleWindow
    parent: null
    common_fields: false
    fields:
      - { name: permit_id, type: string, source: input, description: "FK -> CurbPermit.id; permit this authorization window belongs to" }
      - { name: zone_id, type: string, source: input, description: "FK -> CurbZone.id; zone the window authorizes" }
      - { name: day_of_week, type: integer, source: input, constraints: "0=Mon .. 6=Sun", description: "Day of week the recurring window applies to" }
      - { name: start_minute, type: integer, source: input, constraints: "0..1440", description: "Window start, minutes from midnight (inclusive)" }
      - { name: end_minute, type: integer, source: input, constraints: "0..1440", description: "Window end, minutes from midnight (exclusive)" }
      - { name: exclusive, type: boolean, source: input, default: false, description: "When true the window claims exclusive use of the zone and enforces a turnover buffer against other exclusive windows" }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: input, description: "FK -> CurbPermit.id; authorizing permit" }
      - { name: zone_id, type: string, source: input, description: "FK -> CurbZone.id; reserved zone" }
      - { name: start_utc, type: datetime, source: input, description: "Reservation window start (inclusive)" }
      - { name: end_utc, type: datetime, source: input, description: "Reservation window end (exclusive); half-open [start_utc, end_utc)" }
      - { name: booking_status, type: enum, source: system, default: "PENDING", description: "PENDING | CONFIRMED | FULFILLED | CANCELLED | NO_SHOW | CANCELLED_BY_EVENT" }
      - { name: payment_status, type: enum, source: system, default: "UNPAID", description: "UNPAID | CAPTURED | REFUNDED — evolves independently of booking_status" }
      - { name: estimated_price_cents, type: integer, source: computed, default: null, description: "Dynamic-price ESTIMATE stamped at CONFIRM (booked duration + occupancy at confirm)" }
      - { name: settled_price_cents, type: integer, source: computed, default: null, description: "Dynamic-price SETTLED at FULFILL (actual occupied minutes from matched OccupancySession)" }
      - { name: surge_ratio_bps, type: integer, source: computed, default: null, description: "Occupancy ratio (bps) used to pick the surge tier at CONFIRM" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: OccupancySession
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> CurbZone.id; zone the sensor observed" }
      - { name: reservation_id, type: string, source: input, default: null, description: "FK -> Reservation.id; matched reservation if the vehicle presented one, else null" }
      - { name: entered_at, type: datetime, source: system, description: "Logical-clock time the vehicle was first sensed" }
      - { name: exited_at, type: datetime, source: system, default: null, description: "Logical-clock time the vehicle left (set on exit)" }
      - { name: actual_minutes, type: integer, source: computed, default: null, description: "= ceil_minutes(exited_at - entered_at); set on CLOSE" }
      - { name: session_status, type: enum, source: system, default: "OPEN", description: "OPEN | CLOSED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Citation
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> CurbZone.id; zone where the violation occurred" }
      - { name: permittee_id, type: string, source: input, description: "FK -> Permittee.id; cited party" }
      - { name: occupancy_session_id, type: string, source: input, default: null, description: "FK -> OccupancySession.id; sensor session evidencing the violation, if any" }
      - { name: reservation_id, type: string, source: input, default: null, description: "FK -> Reservation.id; reservation the violation relates to, if any" }
      - { name: violation_type, type: enum, source: input, description: "OVERSTAY | NO_PERMIT | UNAUTHORIZED_ZONE | WRONG_DESIGNATION" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock time the citation was issued" }
      - { name: due_at, type: datetime, source: system, description: "issued_at + GRACE_DAYS; fines paid/adjudicated after this accrue a late penalty" }
      - { name: fine_due_cents, type: integer, source: computed, description: "Base fine at ISSUE; recomputed with late penalty when adjudication UPHELD occurs after due_at" }
      - { name: status, type: enum, source: system, default: "ISSUED", description: "ISSUED | DISPUTED | UPHELD | PAID | DISMISSED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: CurbEvent
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Event label (festival, construction, filming)" }
      - { name: start_utc, type: datetime, source: input, description: "Planned event window start" }
      - { name: end_utc, type: datetime, source: input, description: "Planned event window end" }
      - { name: zone_ids, type: array, source: input, description: "CurbZone ids reallocated (suspended) while the event is ACTIVE" }
      - { name: total_refund_cents, type: integer, source: computed, default: 0, description: "Sum over affected reservations of each reservation's per-reservation-rounded refund (see event_refund_settlement)" }
      - { name: status, type: enum, source: system, default: "PLANNED", description: "PLANNED | ACTIVE | CLOSED | CANCELLED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: entry_type, type: enum, source: system, description: "CHARGE | REFUND | ADJUSTMENT | FINE" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount: CHARGE and FINE positive, REFUND negative, ADJUSTMENT signed (settled minus estimate)" }
      - { name: zone_id, type: string, source: system, default: null, description: "FK -> CurbZone.id; zone the entry is attributed to" }
      - { name: reservation_id, type: string, source: system, default: null, description: "FK -> Reservation.id; reservation the entry relates to, if any" }
      - { name: citation_id, type: string, source: system, default: null, description: "FK -> Citation.id; citation the entry relates to, if any" }
      - { name: memo, type: string, source: system, default: null, description: "Human-readable reason" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CurbZone
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /curb/zones/{id}/status (target_status=SUSPENDED)"
        actor: CurbPlanner
        preconditions: ["zone.status == ACTIVE"]
        side_effects: ["increments CurbZone.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /curb/zones/{id}/status (target_status=ACTIVE)"
        actor: CurbPlanner
        preconditions: ["zone.status == SUSPENDED"]
        side_effects: ["increments CurbZone.version by 1"]
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /curb/zones/{id}/status (target_status=RETIRED)"
        actor: CurbPlanner
        preconditions: ["zone.status == ACTIVE", "no CONFIRMED reservations on the zone with end_utc > clock_now (ERR_ZONE_HAS_ACTIVE_RESERVATIONS)"]
        side_effects: ["increments CurbZone.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (CurbEvent activation reallocates this zone)"
        actor: system
        preconditions: []
        side_effects: ["increments CurbZone.version by 1", "cascade: CONFIRMED reservations overlapping the event window -> CANCELLED_BY_EVENT"]
        note: "Cascade link 1 of event activation"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (CurbEvent close restores this zone)"
        actor: system
        preconditions: ["zone was suspended by this event (not manually)"]
        side_effects: ["increments CurbZone.version by 1"]
      - from: RETIRED
        to: ACTIVE
        trigger: "POST /curb/zones/{id}/status (target_status=ACTIVE) — reopen a retired zone"
        actor: CurbPlanner
        preconditions: ["zone.status == RETIRED"]
        side_effects: ["increments CurbZone.version by 1"]
        note: "Retirement is reversible; RETIRED is terminal only w.r.t. automatic flow"

  - entity: CurbPermit
    initial_state: DRAFT
    terminal_states: [DENIED, REVOKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /curb/permits/{id}/submit"
        actor: Permittee
        preconditions: ["acting Permittee owns the permit", "permit has at least one zone_id"]
        side_effects: ["increments CurbPermit.version by 1"]
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /curb/permits/{id}/review"
        actor: CurbPlanner
        preconditions: ["permit.status == SUBMITTED"]
        side_effects: ["set reviewer_user_id = X-User-ID", "increments CurbPermit.version by 1"]
      - from: UNDER_REVIEW
        to: DRAFT
        trigger: "POST /curb/permits/{id}/request-changes"
        actor: CurbPlanner
        preconditions: ["permit.status == UNDER_REVIEW"]
        side_effects: ["set last_change_note", "increments CurbPermit.version by 1"]
        note: "Revision loop: DRAFT -> SUBMITTED -> UNDER_REVIEW -> DRAFT (cyclic)"
      - from: UNDER_REVIEW
        to: ACTIVE
        trigger: "POST /curb/permits/{id}/approve"
        actor: PermitApprover
        preconditions:
          - "permit.status == UNDER_REVIEW"
          - "X-User-ID (approver) != permit.reviewer_user_id (segregation of duties, ERR_SEGREGATION_OF_DUTIES)"
          - "every zone in permit.zone_ids has CurbZone.status == ACTIVE (ERR_ZONE_NOT_ACTIVE)"
        side_effects: ["set approver_user_id = X-User-ID", "increments CurbPermit.version by 1"]
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /curb/permits/{id}/deny"
        actor: PermitApprover
        preconditions:
          - "permit.status == UNDER_REVIEW"
          - "X-User-ID (approver) != permit.reviewer_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["set approver_user_id = X-User-ID", "increments CurbPermit.version by 1"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /curb/permits/{id}/revoke"
        actor: CurbPlanner
        preconditions: ["permit.status == ACTIVE"]
        side_effects:
          - "cascade link 1: every CONFIRMED Reservation on this permit with start_utc > clock_now -> CANCELLED (booking), payment CAPTURED -> REFUNDED"
          - "cascade link 2: each such cancellation appends a LedgerEntry REFUND (amount = -estimated_price_cents)"
          - "increments CurbPermit.version by 1"

  - entity: Reservation
    initial_state: PENDING
    terminal_states: [FULFILLED, CANCELLED, NO_SHOW, CANCELLED_BY_EVENT]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /curb/reservations/{id}/confirm"
        actor: Permittee
        preconditions:
          - "acting Permittee owns reservation.permit_id.permittee_id"
          - "CurbPermit.status == ACTIVE (ERR_PERMIT_NOT_ACTIVE)"
          - "CurbZone.status == ACTIVE (ERR_ZONE_NOT_ACTIVE)"
          - "count of CONFIRMED reservations on the zone whose [start_utc,end_utc) overlaps this window < CurbZone.capacity_slots (ERR_ZONE_CAPACITY_CONFLICT)"
        side_effects:
          - "compute surge_ratio_bps and estimated_price_cents (reservation_price ESTIMATE variant)"
          - "payment_status UNPAID -> CAPTURED"
          - "append LedgerEntry CHARGE (amount = +estimated_price_cents, zone_id, reservation_id)"
          - "increments Reservation.version by 1"
      - from: CONFIRMED
        to: FULFILLED
        trigger: "POST /curb/reservations/{id}/fulfill"
        actor: Permittee
        preconditions: ["reservation.booking_status == CONFIRMED", "a CLOSED OccupancySession exists with reservation_id == this reservation (ERR_NO_OCCUPANCY_SESSION)"]
        side_effects:
          - "compute settled_price_cents (reservation_price SETTLED variant using OccupancySession.actual_minutes)"
          - "if settled_price_cents != estimated_price_cents: append LedgerEntry ADJUSTMENT (amount = settled - estimated)"
          - "increments Reservation.version by 1"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /curb/reservations/{id}/cancel"
        actor: Permittee
        preconditions: ["reservation.booking_status == PENDING"]
        side_effects: ["increments Reservation.version by 1"]
        note: "No charge existed; payment remains UNPAID, no ledger entry"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /curb/reservations/{id}/cancel"
        actor: Permittee
        preconditions: ["reservation.booking_status == CONFIRMED", "clock_now < start_utc (cancel before start)"]
        side_effects:
          - "payment_status CAPTURED -> REFUNDED"
          - "append LedgerEntry REFUND (amount = -estimated_price_cents) — compensating invariant: per-reservation ledger sum returns to 0"
          - "increments Reservation.version by 1"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /curb/reservations/{id}/no-show"
        actor: EnforcementOfficer
        preconditions: ["reservation.booking_status == CONFIRMED", "clock_now >= end_utc", "no OccupancySession with reservation_id == this reservation"]
        side_effects: ["increments Reservation.version by 1"]
        note: "Payment forfeited; no refund"
      - from: CONFIRMED
        to: CANCELLED_BY_EVENT
        trigger: "system (CurbEvent activation over this reservation's zone)"
        actor: system
        preconditions: ["reservation.booking_status == CONFIRMED", "reservation.zone_id in event.zone_ids", "[start_utc,end_utc) overlaps [event.start_utc,event.end_utc)"]
        side_effects:
          - "cascade link 2: payment CAPTURED -> REFUNDED"
          - "cascade link 3: append LedgerEntry REFUND (amount = -event_refund_settlement per-reservation refund)"
          - "increments Reservation.version by 1"

  - entity: OccupancySession
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /_sensor/occupancy-exit"
        actor: PlatformAdmin
        preconditions: ["session.session_status == OPEN"]
        side_effects:
          - "set exited_at = clock_now, compute actual_minutes"
          - "zone.sensor_occupancy_state recomputes to VACANT if no other OPEN session"
          - "increments OccupancySession.version by 1"

  - entity: Citation
    initial_state: ISSUED
    terminal_states: [PAID, DISMISSED]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /curb/citations/{id}/pay"
        actor: Permittee
        preconditions: ["citation.status == ISSUED"]
        side_effects:
          - "append LedgerEntry FINE (amount = +fine_due_cents, zone_id, citation_id)"
          - "Permittee.outstanding_fines_cents recomputes (citation leaves the open set)"
          - "increments Citation.version by 1"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /curb/citations/{id}/dispute"
        actor: Permittee
        preconditions: ["citation.status == ISSUED"]
        side_effects: ["increments Citation.version by 1"]
      - from: DISPUTED
        to: UPHELD
        trigger: "POST /curb/citations/{id}/adjudicate (decision=UPHELD)"
        actor: EnforcementOfficer
        preconditions: ["citation.status == DISPUTED"]
        side_effects:
          - "recompute fine_due_cents (citation_fine UPHELD_LATE variant: add late penalty if clock_now > due_at)"
          - "increments Citation.version by 1"
      - from: DISPUTED
        to: DISMISSED
        trigger: "POST /curb/citations/{id}/adjudicate (decision=DISMISSED)"
        actor: EnforcementOfficer
        preconditions: ["citation.status == DISPUTED"]
        side_effects:
          - "Permittee.outstanding_fines_cents recomputes (citation leaves the open set) — compensating invariant restores pre-issue receivable"
          - "increments Citation.version by 1"
      - from: UPHELD
        to: PAID
        trigger: "POST /curb/citations/{id}/pay"
        actor: Permittee
        preconditions: ["citation.status == UPHELD"]
        side_effects:
          - "append LedgerEntry FINE (amount = +fine_due_cents, zone_id, citation_id)"
          - "Permittee.outstanding_fines_cents recomputes"
          - "increments Citation.version by 1"

  - entity: CurbEvent
    initial_state: PLANNED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /curb/events/{id}/activate"
        actor: CurbPlanner
        preconditions: ["event.status == PLANNED"]
        side_effects:
          - "cascade link 1: each zone in zone_ids with status ACTIVE -> SUSPENDED (system)"
          - "cascade link 2: each CONFIRMED reservation on those zones overlapping [start_utc,end_utc) -> CANCELLED_BY_EVENT, payment -> REFUNDED"
          - "cascade link 3: each such cancellation appends a LedgerEntry REFUND (event_refund_settlement per-reservation refund)"
          - "compute total_refund_cents = sum of per-reservation rounded refunds"
          - "increments CurbEvent.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /curb/events/{id}/close"
        actor: CurbPlanner
        preconditions: ["event.status == ACTIVE"]
        side_effects: ["each zone suspended by this event -> ACTIVE (system)", "increments CurbEvent.version by 1"]
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /curb/events/{id}/cancel"
        actor: CurbPlanner
        preconditions: ["event.status == PLANNED"]
        side_effects: ["increments CurbEvent.version by 1"]
        note: "No zones were suspended yet; nothing to restore"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: zone-redesignate-stale
    parent_entity: CurbZone
    write_endpoint: "POST /curb/zones/{id}/redesignate"
    occ_field: "expected_zone_version"
    description: |
      Redesignating a CurbZone (changing designation and/or base rate) against a
      zone whose version has advanced since the client last observed it is
      rejected. A prior redesignation legitimately supersedes the earlier one;
      the current writer's view of the zone is therefore stale and the write is
      refused on a version-mismatch basis.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: reservation_price
    trigger: "Reservation confirm (ESTIMATE) and Reservation fulfill (SETTLED)"
    algorithm: tiered_pricing
    formula: |
      base = zone.base_rate_override_cents if zone.base_rate_override_cents is not null
             else policy.base_rate_cents_per_15min
      # duration source differs per variant:
      #   ESTIMATE: minutes = (end_utc - start_utc) in minutes           (booked)
      #   SETTLED : minutes = OccupancySession.actual_minutes             (observed)
      slots = ceil(minutes / 15)
      # time-of-use, half-open peak window on the window START hour (UTC):
      start_hour = hour_of(start_utc)
      tou_bps = policy.peak_multiplier_bps if (policy.peak_start_hour <= start_hour < policy.peak_end_hour)
                else 10000
      # surge from occupancy ratio at CONFIRM (both variants reuse the ratio stamped at confirm):
      overlap_count = count(CONFIRMED reservations on zone whose [start_utc,end_utc) overlaps this window, excluding self)
      ratio_bps = floor(overlap_count * 10000 / zone.capacity_slots)
      if ratio_bps >= policy.surge_tier2_ratio_bps:      surge_bps = policy.surge_tier2_mult_bps
      elif ratio_bps >= policy.surge_tier1_ratio_bps:    surge_bps = policy.surge_tier1_mult_bps
      else:                                              surge_bps = 10000
      price_cents = round_half_up(base * slots * tou_bps * surge_bps / (10000 * 10000))
    input_set: "One zone, its PricingPolicy, and the CONFIRMED overlapping reservation set at confirm time"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: ESTIMATE
        when: "Reservation confirm — duration = booked (end_utc - start_utc)"
        difference: "Uses booked minutes; stamps estimated_price_cents and surge_ratio_bps"
      - name: SETTLED
        when: "Reservation fulfill — duration = matched OccupancySession.actual_minutes"
        difference: "Uses observed minutes and the surge_ratio_bps stamped at confirm; stamps settled_price_cents; delta booked to ledger"

  - name: citation_fine
    trigger: "Citation issue (base) and Citation adjudicate UPHELD (late penalty)"
    algorithm: threshold
    formula: |
      base = BASE_FINE_CENTS[violation_type]
      # ISSUE variant:
      fine_due_cents = base
      # UPHELD_LATE variant (on adjudicate decision=UPHELD):
      if clock_now > citation.due_at:
        fine_due_cents = round_half_up(base * (10000 + LATE_PENALTY_BPS) / 10000)
      else:
        fine_due_cents = base
    input_set: "One Citation; violation_type selects the base fine"
    constants:
      BASE_FINE_CENTS: { OVERSTAY: 7500, NO_PERMIT: 15000, UNAUTHORIZED_ZONE: 10000, WRONG_DESIGNATION: 5000 }
      LATE_PENALTY_BPS: 2500      # 25% late penalty
      GRACE_DAYS: 14              # due_at = issued_at + 14 days
    precision: "integer cents, round_half_up"
    variants:
      - name: ISSUE
        when: "Citation created — fine_due_cents = base fine for the violation_type"
        difference: "No penalty; baseline receivable"
      - name: UPHELD_LATE
        when: "Adjudication UPHELD after due_at"
        difference: "Adds LATE_PENALTY_BPS to the base fine (7500 -> 9375 for OVERSTAY)"

  - name: event_refund_settlement
    trigger: "CurbEvent activation cancels overlapping CONFIRMED reservations"
    algorithm: aggregation
    formula: |
      total_refund_cents = 0
      for each affected reservation r (CONFIRMED, zone in event.zone_ids, overlaps event window):
        total_minutes     = minutes(r.end_utc - r.start_utc)
        if clock_now <= r.start_utc:
          remaining_minutes = total_minutes            # not started: full refund
        else:
          remaining_minutes = minutes(r.end_utc - clock_now)   # in progress: prorate unused portion
        # ROUNDING ORDER PINNED: round each reservation's refund to whole cents, THEN sum.
        r_refund = round_half_up(r.estimated_price_cents * remaining_minutes / total_minutes)
        append LedgerEntry REFUND (amount = -r_refund, reservation_id = r.id, zone_id = r.zone_id)
        total_refund_cents += r_refund
      # NOTE: sum-then-round would differ; per-reservation-then-sum is authoritative.
    input_set: "All CONFIRMED reservations on the event's zones overlapping the event window"
    constants: {}
    precision: "integer cents, round_half_up per reservation, then integer sum"

  - name: zone_revenue_rollup
    trigger: "GET /curb/revenue and CurbZone.revenue_accrued_cents read"
    algorithm: aggregation
    formula: |
      total_charge_cents     = sum(amount_cents for LedgerEntry where entry_type == CHARGE)
      total_refund_cents     = sum(amount_cents for LedgerEntry where entry_type == REFUND)     # negative
      total_adjustment_cents = sum(amount_cents for LedgerEntry where entry_type == ADJUSTMENT)
      total_fine_cents       = sum(amount_cents for LedgerEntry where entry_type == FINE)
      net_revenue_cents      = total_charge_cents + total_refund_cents + total_adjustment_cents + total_fine_cents
      # scoped to zone_id when the query filter is supplied
    input_set: "LedgerEntry rows, optionally filtered by zone_id"
    constants: {}
    precision: "integer cents"

  - name: occupancy_actual_minutes
    trigger: "OccupancySession exit"
    algorithm: aggregation
    formula: |
      actual_minutes = ceil( (exited_at - entered_at) total_seconds / 60 )
      # ceil so a 62-second stay counts as 2 minutes; a 0-length stay counts as 0
    input_set: "One OccupancySession"
    constants: {}
    precision: "integer minutes, ceiling"

  - name: schedule_window_overlap
    trigger: "POST /curb/schedule-windows (exclusive window insertion)"
    algorithm: interval_merge
    formula: |
      # Non-exclusive windows never conflict (aggregate/shared use).
      # Two EXCLUSIVE windows on the same zone_id + day_of_week conflict when the
      # gap between them is strictly LESS than the turnover buffer. Intervals are
      # treated as closed [start_minute, end_minute] for buffer purposes.
      #   gap = max(new.start_minute - other.end_minute, other.start_minute - new.end_minute)
      #   conflict if gap < TURNOVER_BUFFER_MINUTES   (gap == buffer is allowed)
      # Direct overlap (gap negative) is therefore always a conflict.
    input_set: "Existing EXCLUSIVE ScheduleWindows on the same zone_id and day_of_week"
    constants:
      TURNOVER_BUFFER_MINUTES: 15
    precision: "integer minutes"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for the endpoint per RBAC; entity_backed Permittee must own the target resource"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path id and referenced FK resolves to an existing resource (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 5
    category: business_safety
    check: "Segregation of duties: permit approver/denier X-User-ID must differ from recorded reviewer_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /curb/permits/{id}/approve, POST /curb/permits/{id}/deny"

  - priority: 6
    category: business_referential
    check: "Cross-entity state gates: permit approval requires all zone_ids ACTIVE; reservation confirm requires permit ACTIVE and zone ACTIVE"
    error_id: "ERR_ZONE_NOT_ACTIVE / ERR_PERMIT_NOT_ACTIVE"
    http_status: 409
    applies_to: "POST /curb/permits/{id}/approve, POST /curb/reservations/{id}/confirm"

  - priority: 7
    category: business_temporal
    check: "Temporal-overlap conflicts: reservation window would exceed zone capacity_slots; exclusive schedule windows collide within turnover buffer"
    error_id: "ERR_ZONE_CAPACITY_CONFLICT / ERR_SCHEDULE_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "POST /curb/reservations/{id}/confirm, POST /curb/schedule-windows"

  - priority: 8
    category: business_constraint
    check: "Field-level constraints: end after start, capacity_slots >= 1, valid enum members, day_of_week 0..6, minute bounds"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "create/confirm endpoints"

  - priority: 9
    category: business_fiscal
    check: "Optimistic concurrency: expected_zone_version must equal CurbZone.version on redesignation"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /curb/zones/{id}/redesignate"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Permittee ----
  - method: POST
    path: "/curb/permittees"
    description: "Register a permittee"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, contact_email, permittee_type]
    output: Permittee
    side_effects: ["status=ACTIVE, outstanding_fines_cents=0"]

  - method: GET
    path: "/curb/permittees/{id}"
    description: "Get a permittee (includes computed outstanding_fines_cents)"
    roles: [PlatformAdmin, Permittee, EnforcementOfficer, CurbPlanner]
    code: 200
    input: []
    output: Permittee
    side_effects: []

  # ---- PricingPolicy ----
  - method: POST
    path: "/curb/pricing-policies"
    description: "Create a pricing policy"
    roles: [CurbPlanner]
    code: 201
    input: [name, base_rate_cents_per_15min, peak_multiplier_bps, peak_start_hour, peak_end_hour, surge_tier1_ratio_bps, surge_tier1_mult_bps, surge_tier2_ratio_bps, surge_tier2_mult_bps]
    output: PricingPolicy
    side_effects: []

  - method: GET
    path: "/curb/pricing-policies/{id}"
    description: "Get a pricing policy"
    roles: [CurbPlanner, Permittee]
    code: 200
    input: []
    output: PricingPolicy
    side_effects: []

  # ---- CurbZone ----
  - method: POST
    path: "/curb/zones"
    description: "Create a curb zone"
    roles: [CurbPlanner]
    code: 201
    input: [name, block_face, length_meters, designation, capacity_slots, pricing_policy_id, "base_rate_override_cents?"]
    output: CurbZone
    side_effects: ["status=ACTIVE, sensor_occupancy_state=VACANT, revenue_accrued_cents=0, version=1"]

  - method: GET
    path: "/curb/zones/{id}"
    description: "Get a curb zone"
    roles: [CurbPlanner, Permittee, EnforcementOfficer, PlatformAdmin]
    code: 200
    input: []
    output: CurbZone
    side_effects: []

  - method: GET
    path: "/curb/zones"
    description: "List curb zones (filterable)"
    roles: [CurbPlanner, Permittee]
    code: 200
    input: ["designation?", "status?", "pricing_policy_id?", "limit?", "offset?"]
    output: CurbZone[]
    side_effects: []

  - method: POST
    path: "/curb/zones/{id}/redesignate"
    description: "Change a zone's designation and/or base rate (OCC-guarded supersede)"
    roles: [CurbPlanner]
    code: 200
    input: [designation, "base_rate_override_cents?", expected_zone_version]
    output: CurbZone
    side_effects: ["set designation (and base_rate_override_cents if supplied)", "increments CurbZone.version by 1"]

  - method: POST
    path: "/curb/zones/{id}/status"
    description: "Set a zone operational status (SUSPENDED / ACTIVE / RETIRED)"
    roles: [CurbPlanner]
    code: 200
    input: [target_status]
    output: CurbZone
    side_effects: ["status transition per state machine", "increments CurbZone.version by 1"]

  - method: GET
    path: "/curb/map"
    description: "Digital curb map: zones with live occupancy and pricing"
    roles: [CurbPlanner, Permittee, EnforcementOfficer]
    code: 200
    input: ["designation?", "status?"]
    output: CurbZone[]
    side_effects: []

  # ---- CurbPermit ----
  - method: POST
    path: "/curb/permits"
    description: "Create a permit (DRAFT)"
    roles: [Permittee]
    code: 201
    input: [permittee_id, requested_designation, purpose, zone_ids]
    output: CurbPermit
    side_effects: ["status=DRAFT, version=1"]

  - method: GET
    path: "/curb/permits/{id}"
    description: "Get a permit"
    roles: [Permittee, CurbPlanner, PermitApprover]
    code: 200
    input: []
    output: CurbPermit
    side_effects: []

  - method: GET
    path: "/curb/permits"
    description: "List permits (filterable)"
    roles: [Permittee, CurbPlanner, PermitApprover]
    code: 200
    input: ["permittee_id?", "status?", "limit?", "offset?"]
    output: CurbPermit[]
    side_effects: []

  - method: POST
    path: "/curb/permits/{id}/submit"
    description: "Submit a permit for review"
    roles: [Permittee]
    code: 200
    input: []
    output: CurbPermit
    side_effects: ["status DRAFT -> SUBMITTED", "increments CurbPermit.version by 1"]

  - method: POST
    path: "/curb/permits/{id}/review"
    description: "Take a submitted permit under review"
    roles: [CurbPlanner]
    code: 200
    input: []
    output: CurbPermit
    side_effects: ["status SUBMITTED -> UNDER_REVIEW", "set reviewer_user_id = X-User-ID", "increments CurbPermit.version by 1"]

  - method: POST
    path: "/curb/permits/{id}/request-changes"
    description: "Send a permit back to the applicant for revision"
    roles: [CurbPlanner]
    code: 200
    input: [note]
    output: CurbPermit
    side_effects: ["status UNDER_REVIEW -> DRAFT", "set last_change_note", "increments CurbPermit.version by 1"]

  - method: POST
    path: "/curb/permits/{id}/approve"
    description: "Approve a permit (segregation of duties + zones active)"
    roles: [PermitApprover]
    code: 200
    input: []
    output: CurbPermit
    side_effects: ["status UNDER_REVIEW -> ACTIVE", "set approver_user_id = X-User-ID", "increments CurbPermit.version by 1"]

  - method: POST
    path: "/curb/permits/{id}/deny"
    description: "Deny a permit"
    roles: [PermitApprover]
    code: 200
    input: [reason]
    output: CurbPermit
    side_effects: ["status UNDER_REVIEW -> DENIED", "set approver_user_id = X-User-ID", "increments CurbPermit.version by 1"]

  - method: POST
    path: "/curb/permits/{id}/revoke"
    description: "Revoke an active permit (cascades to future reservations)"
    roles: [CurbPlanner]
    code: 200
    input: [reason]
    output: CurbPermit
    side_effects:
      - "status ACTIVE -> REVOKED"
      - "cascade: future CONFIRMED reservations -> CANCELLED, payment -> REFUNDED, LedgerEntry REFUND appended"
      - "increments CurbPermit.version by 1"

  # ---- ScheduleWindow ----
  - method: POST
    path: "/curb/schedule-windows"
    description: "Attach a recurring authorization window to a permit (overlap-checked)"
    roles: [Permittee]
    code: 201
    input: [permit_id, zone_id, day_of_week, start_minute, end_minute, "exclusive?"]
    output: ScheduleWindow
    side_effects: ["reject if exclusive window collides with another exclusive window on the zone within the turnover buffer"]

  - method: GET
    path: "/curb/schedule-windows/{id}"
    description: "Get a schedule window"
    roles: [Permittee, CurbPlanner]
    code: 200
    input: []
    output: ScheduleWindow
    side_effects: []

  - method: GET
    path: "/curb/schedule-windows"
    description: "List schedule windows (filterable)"
    roles: [Permittee, CurbPlanner]
    code: 200
    input: ["permit_id?", "zone_id?", "limit?", "offset?"]
    output: ScheduleWindow[]
    side_effects: []

  # ---- Reservation ----
  - method: POST
    path: "/curb/reservations"
    description: "Create a delivery-window reservation (PENDING)"
    roles: [Permittee]
    code: 201
    input: [permit_id, zone_id, start_utc, end_utc]
    output: Reservation
    side_effects: ["booking_status=PENDING, payment_status=UNPAID, version=1"]

  - method: GET
    path: "/curb/reservations/{id}"
    description: "Get a reservation"
    roles: [Permittee, CurbPlanner, EnforcementOfficer]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: GET
    path: "/curb/reservations"
    description: "List reservations (filterable)"
    roles: [Permittee, CurbPlanner, EnforcementOfficer]
    code: 200
    input: ["permit_id?", "zone_id?", "booking_status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: POST
    path: "/curb/reservations/{id}/confirm"
    description: "Confirm a reservation: price ESTIMATE, capture payment"
    roles: [Permittee]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "booking_status PENDING -> CONFIRMED"
      - "compute estimated_price_cents + surge_ratio_bps"
      - "payment_status -> CAPTURED, append LedgerEntry CHARGE"
      - "increments Reservation.version by 1"

  - method: POST
    path: "/curb/reservations/{id}/cancel"
    description: "Cancel a reservation (full refund if it was captured)"
    roles: [Permittee]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "booking_status -> CANCELLED"
      - "if payment CAPTURED: payment -> REFUNDED, append LedgerEntry REFUND (-estimated_price_cents)"
      - "increments Reservation.version by 1"

  - method: POST
    path: "/curb/reservations/{id}/fulfill"
    description: "Fulfill a reservation: SETTLED price, ledger adjustment"
    roles: [Permittee, EnforcementOfficer]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "booking_status CONFIRMED -> FULFILLED"
      - "compute settled_price_cents; if != estimate append LedgerEntry ADJUSTMENT"
      - "increments Reservation.version by 1"

  - method: POST
    path: "/curb/reservations/{id}/no-show"
    description: "Mark a confirmed reservation a no-show (payment forfeited)"
    roles: [EnforcementOfficer]
    code: 200
    input: []
    output: Reservation
    side_effects: ["booking_status CONFIRMED -> NO_SHOW", "increments Reservation.version by 1"]

  # ---- OccupancySession (sensor / system) ----
  - method: POST
    path: "/_sensor/occupancy-enter"
    description: "Sensor event: vehicle entered a zone (opens an OccupancySession). Test-driving/system endpoint."
    roles: [PlatformAdmin]
    code: 201
    input: [zone_id, "reservation_id?"]
    output: OccupancySession
    side_effects: ["session_status=OPEN, entered_at=clock_now, zone.sensor_occupancy_state=OCCUPIED"]

  - method: POST
    path: "/_sensor/occupancy-exit"
    description: "Sensor event: vehicle exited (closes the OccupancySession). Test-driving/system endpoint."
    roles: [PlatformAdmin]
    code: 200
    input: [session_id]
    output: OccupancySession
    side_effects: ["session_status -> CLOSED, exited_at=clock_now, compute actual_minutes", "increments OccupancySession.version by 1"]

  - method: GET
    path: "/curb/occupancy-sessions/{id}"
    description: "Get an occupancy session"
    roles: [CurbPlanner, EnforcementOfficer]
    code: 200
    input: []
    output: OccupancySession
    side_effects: []

  - method: GET
    path: "/curb/occupancy-sessions"
    description: "List occupancy sessions (filterable)"
    roles: [CurbPlanner, EnforcementOfficer]
    code: 200
    input: ["zone_id?", "reservation_id?", "session_status?", "limit?", "offset?"]
    output: OccupancySession[]
    side_effects: []

