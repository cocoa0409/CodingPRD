  - section: endpoints
    instances:
      - name: patch_fund_allocation_pct_updates_configuration
        claim_type: standard_crud
        grounds:
          - endpoints[POST /funds]
          - endpoints[PATCH /funds/{id}]
          - endpoints[GET /funds/{id}]
          - entities.Fund.fields.allocation_pct
        distinguishing_aspect: "PATCH /funds/{id} is a true partial update: supplying only allocation_pct rewrites that field, leaves fund_code, priority_rank and the system-owned balance_cents / lifetime_credits_cents untouched, and bumps version from 1 to 2 - and a subsequent GET /funds/{id} returns the patched value, proving the write persisted rather than only being echoed."
        test_recipe:
          setup:
            - "Two Fund rows: F-GEN at priority_rank 1 with allocation_pct 0.6, and F-PARK at priority_rank 2 with allocation_pct 0.4."
            - "No conveyance has been recorded, so both balances are 0."
          setup_api_calls:
            - call: "POST /funds"
              payload: { name: "General Fund", fund_code: "F-GEN", priority_rank: 1, allocation_pct: 0.6 }
              as: FinanceOfficer
              captures: { fund_gen_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "Park Acquisition Fund", fund_code: "F-PARK", priority_rank: 2, allocation_pct: 0.4 }
              as: FinanceOfficer
              captures: { fund_park_id: "$.data.id" }
          trigger:
            - call: "PATCH /funds/${fund_gen_id}"
              payload: { allocation_pct: 0.55 }
              as: FinanceOfficer
            - call: "GET /funds/${fund_gen_id}"
              payload: {}
              as: FinanceOfficer
          assert:
            - "the PATCH response is HTTP 200 with data.allocation_pct == 0.55"
            - "data.fund_code == F-GEN, data.priority_rank == 1 and data.fixed_reserve_cents == 0 (the create-time default)"
            - "data.balance_cents == 0, data.lifetime_credits_cents == 0 and data.lifetime_debits_cents == 0"
            - "data.version == 2 while the create response carried version 1"
            - "the follow-up GET /funds/${fund_gen_id} returns allocation_pct == 0.55 and version == 2"
            - "Fund.${fund_park_id}.allocation_pct is still 0.4 and its version is still 1"

      - name: get_parcel_title_items_filtered_by_status_returns_subresource_rows
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /parcels/{id}/title-items]
