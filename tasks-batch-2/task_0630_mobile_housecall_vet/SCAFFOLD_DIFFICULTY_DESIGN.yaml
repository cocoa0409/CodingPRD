            - "data.error_id == ERR_STOP_WINDOW_CONFLICT"

      - name: vehicle_zerobuffer_overlap_across_routes
        grounds:
          - calculations.stop_window_overlap
          - validations[priority=12]
          - entities.RouteDay.fields.rolling_clinic_id
        distinguishing_aspect: |
          Interval semantics (B) — vehicle zero-buffer: two stops on DIFFERENT
          RouteDays sharing the same rolling_clinic_id and service_date whose
          windows genuinely overlap (09:30 inside 09:00-10:00) conflict
          ERR_VEHICLE_DOUBLE_BOOKED, but pure touching is allowed (distinct from
          semantics A). Different resource entity than the clinician route check.
        test_recipe:
          setup:
            - "Same vehicle assigned to two RouteDays on 2026-02-16; route-1 has stop 09:00-10:00; route-2 (different clinician) attempts 09:30-10:30"
          setup_api_calls:
