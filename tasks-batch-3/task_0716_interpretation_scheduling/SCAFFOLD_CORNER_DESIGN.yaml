  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_request_version_on_redispatch
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[dispatch-stale-request]", "errors[ERR_STALE_REQUEST_VERSION]"]
        distinguishing_aspect: "After a request is dispatched then bounced back to OPEN by a decline (each step bumps version), re-dispatching while carrying the ORIGINAL create-time version (stale) returns ERR_STALE_REQUEST_VERSION (412); the request is OPEN so the state check at priority 6 passes and the OCC check at priority 15 is reached."
        test_recipe:
          setup:
            - "A request created at version 1, dispatched (version 2, ASSIGNED), whose offer was declined (version 3, back to OPEN)."
          setup_api_calls:
            - call: "POST /interpretation/clients"
              payload: { org_name: "Mercy Hosp", org_type: "HOSPITAL", contact_email: "h@x.com" }
              as: PlatformAdmin
              captures: { hosp_id: $.data.id }
