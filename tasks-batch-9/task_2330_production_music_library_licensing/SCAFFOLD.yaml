    input: []
    output: UsageReport
    status_code: 200
    side_effects:
      - "{DUE, REJECTED} → SUBMITTED, records submitted_at and increments resubmission_count on the REJECTED path"
      - "recomputes BlanketAgreement.reporting_status, which can move DELINQUENT → COMPLIANT and clear delinquent_since"

  - method: POST
    path: /music-library/usage-reports/{usage_report_id}/accept
