            - call: "POST /hhg/shipments/${s_id}/record-actual-weight"
              payload: { actual_gross_lbs: 6200, actual_tare_lbs: 1500, weigh_date: "2026-08-17T00:00:00Z", scale_certified: true }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
            - call: "POST /hhg/shipments/${s_id}/pickup"
              payload: { actual_pickup_date: "2026-08-17T00:00:00Z" }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
            - call: "POST /hhg/shipments/${s_id}/sit-authorizations"
              payload: { sit_type: "ORIGIN", entry_date: "2026-09-16T00:00:00Z", requested_days: 10 }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
              captures: { sit1: $.data.id }
            - call: "POST /hhg/sit-authorizations/${sit1}/authorize"
              payload: { authorized_days: 10 }
              as: MoveCounselor
              as_user_id: "counselor-01"
          trigger:
            - call: "POST /hhg/shipments/${s_id}/sit-authorizations"
              payload: { sit_type: "DESTINATION", entry_date: "2026-09-26T00:00:00Z", requested_days: 5 }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
              captures: { err_inside: $.data.error_id }
            - call: "POST /hhg/shipments/${s_id}/sit-authorizations"
              payload: { sit_type: "DESTINATION", entry_date: "2026-09-27T00:00:00Z", requested_days: 5 }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
              captures: { err_touching: $.data.error_id }
            - call: "POST /hhg/shipments/${s_id}/sit-authorizations"
              payload: { sit_type: "DESTINATION", entry_date: "2026-09-28T00:00:00Z", requested_days: 5 }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
              captures: { sit2: $.data.id }
          assert:
            - "SitAuthorization.${sit1}.entry_date == 2026-09-16T00:00:00Z, requested_days == 10, total_authorized_days == 10 and status == AUTHORIZED"
            - "the first trigger call returns HTTP 409 with ${err_inside} == ERR_SIT_PERIOD_OVERLAP (2026-09-26 is the inclusive end of period 1)"
            - "the second trigger call returns HTTP 409 with ${err_touching} == ERR_SIT_PERIOD_OVERLAP (zero gap is not enough)"
            - "the third trigger call returns HTTP 201 with SitAuthorization.${sit2}.entry_date == 2026-09-28T00:00:00Z and status == REQUESTED"
            - "GET /hhg/shipments/${s_id}/sit-authorizations returns exactly 2 rows"
            - "Shipment.${s_id}.movement_status == IN_SIT (only the authorized period moved the shipment)"

      - name: capacity_weeks_are_half_open_so_adjacent_weeks_are_legal
        grounds:
          - validations[priority=41]
          - errors.ERR_CAPACITY_BLOCK_OVERLAP
          - entities.CapacityBlock.fields.week_end_date
        distinguishing_aspect: >-
          A different resource (a TSP+market weekly capacity calendar) with the OPPOSITE interval
          semantics: weeks are HALF-OPEN [week_start_date, week_start_date + 7 days), so a block
          starting exactly on the previous block's week_end_date (2026-10-12) is legal, while
          re-publishing the same week (2026-10-05) for the same TSP and market is rejected. An
          inclusive-end implementation would wrongly reject the adjacent week.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T00:00:00Z; one TSP serving MKT-BWI and MKT-DEN."
            - "Block 1 published for MKT-BWI, week 2026-10-05 (week_end_date 2026-10-12)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /hhg/tsps"
              payload: { name: "Front Range Forwarding", scac_code: "FRFQ", markets: ["MKT-BWI", "MKT-DEN"] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { tsp_id: $.data.id }
            - call: "POST /hhg/capacity-blocks"
              payload: { tsp_id: "${tsp_id}", market_code: "MKT-BWI", week_start_date: "2026-10-05T00:00:00Z", total_capacity_lbs: 9000, short_notice_reserve_pct: 0.15 }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
              captures: { cb1: $.data.id, cb1_end: $.data.week_end_date }
          trigger:
            - call: "POST /hhg/capacity-blocks"
              payload: { tsp_id: "${tsp_id}", market_code: "MKT-BWI", week_start_date: "2026-10-12T00:00:00Z", total_capacity_lbs: 9000, short_notice_reserve_pct: 0.15 }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
              captures: { cb2: $.data.id }
            - call: "POST /hhg/capacity-blocks"
              payload: { tsp_id: "${tsp_id}", market_code: "MKT-BWI", week_start_date: "2026-10-05T00:00:00Z", total_capacity_lbs: 4000, short_notice_reserve_pct: 0.15 }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
              captures: { err_dup: $.data.error_id }
            - call: "POST /hhg/capacity-blocks"
              payload: { tsp_id: "${tsp_id}", market_code: "MKT-DEN", week_start_date: "2026-10-05T00:00:00Z", total_capacity_lbs: 4000, short_notice_reserve_pct: 0.15 }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
              captures: { cb3: $.data.id }
          assert:
            - "CapacityBlock.${cb1}.week_end_date == 2026-10-12T00:00:00Z, peak_season == false, general_pool_lbs == 7650 and short_notice_pool_lbs == 1350"
            - "the first trigger call returns HTTP 201: CapacityBlock.${cb2}.week_start_date == 2026-10-12T00:00:00Z and week_end_date == 2026-10-19T00:00:00Z (gap of zero is legal)"
            - "the second trigger call returns HTTP 409 with ${err_dup} == ERR_CAPACITY_BLOCK_OVERLAP (identical week, same tsp and market)"
            - "the third trigger call returns HTTP 201: the same week in a DIFFERENT market is legal, CapacityBlock.${cb3}.market_code == MKT-DEN"
            - "GET /hhg/tsps/${tsp_id}/capacity-blocks returns exactly 3 rows"
            - "CapacityBlock.${cb1}.total_capacity_lbs == 9000 (the rejected duplicate did not modify the existing block)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: excess_cost_waiver_and_revocation_conserve_gross_excess_cost
        grounds:
          - calculations.entitlement_excess_weight_and_cost
          - endpoints[POST /hhg/entitlements/{id}/excess-cost-waivers]
          - endpoints[POST /hhg/entitlements/{id}/revoke-waiver]
          - validations[priority=60]
          - validations[priority=61]
        distinguishing_aspect: >-
          Conserved quantity = gross_excess_cost_usd. A waiver reduces excess_cost_due_usd from
          3005.10 to 1805.10 and revoking it restores 3005.10, but gross_excess_cost_usd never moves
          and the identity excess_cost_due_usd + excess_cost_waived_usd == gross_excess_cost_usd
          holds at all three observation points — an implementation that "waives" by rewriting the
          gross figure drifts and cannot restore it.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T00:00:00Z; E5 member without dependents, cap 7000 lb."
            - "One shipment surveyed, then weighed at 10000 lb net, which drives excess to 3000 lb / 3005.10 USD and SUSPENDS the entitlement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /hhg/service-members"
