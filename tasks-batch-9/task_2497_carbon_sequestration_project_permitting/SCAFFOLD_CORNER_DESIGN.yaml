        grounds:
          - endpoints[POST /ccs/monitoring-plans/{id}/methods]
          - endpoints[GET /ccs/monitoring-plans/{id}/methods]
          - entities.MonitoringMethod.fields.monitoring_plan_id
        distinguishing_aspect: |
          A method created under one plan carries that plan's id as monitoring_plan_id and appears only
          in that plan's method listing: with two plans on the same project, the plan that received the
          method lists total_count 1 while the sibling plan lists total_count 0.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' with two DRAFT MonitoringPlan rows, MRV-1 and MRV-2"
          setup_api_calls:
