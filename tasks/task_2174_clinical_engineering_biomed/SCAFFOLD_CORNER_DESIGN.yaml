              as_user_id: "ce-mgr-01"
              captures: { dept_id: $.data.id }
            - call: "POST /clinical-engineering/device-models"
              payload: { manufacturer: "GE", model_number: "CAM-500", device_family: "PATIENT_MONITOR", expected_life_years: 10, replacement_cost_cents: 1500000, is_network_connected: true }
              as: CEManager
              as_user_id: "ce-mgr-01"
