            - "data.markdown_liability_cents == 540 (only lot B carries giveback: 6 * (599 - 509))"
            - "data.shrink_cost_ratio_pct == 44.45 and data.compliance_status == 'WATCH' (3478 shrink cents of 7825, above the 2.5 budget)"
            - "DateCodeLot.${lot_b}.past_date_flag == true, status == 'MARKED_DOWN', current_price_cents == 509, current_rung_index == 0, total_discount_pct == 15.03"
