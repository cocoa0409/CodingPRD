      - name: rewinding_the_logical_clock_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_33_ERR_CLOCK_NOT_MONOTONIC
          - endpoints.POST__clock_set_current_utc
        distinguishing_aspect: "The clock endpoint is strictly increasing: a value equal to the current clock and a value behind it are both refused, and the refusal leaves the clock where it was so a later forward move still succeeds."
        test_recipe:
          setup:
            - "No domain data is required; the logical clock starts at 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00.000Z" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00.000Z" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00.000Z" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00.001Z" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
          assert:
            - "the first setup call -> 200 with data == null (the endpoint declares no output entity)"
            - "the equal-value call -> 422 with data.error_id == ERR_CLOCK_NOT_MONOTONIC (strictly greater is required)"
            - "the backwards call -> 422 ERR_CLOCK_NOT_MONOTONIC"
            - "the one-millisecond-forward call -> 200, proving the two refusals did not move or corrupt the clock"
            - "a malformed instant such as 2026-09-11 (date only, no time) -> 422 ERR_VALIDATION, a shape failure at priority 6 rather than the monotonicity rule"

