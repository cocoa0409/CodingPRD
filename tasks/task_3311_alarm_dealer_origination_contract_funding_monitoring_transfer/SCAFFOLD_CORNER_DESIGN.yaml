# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3311_alarm_dealer_origination_contract_funding_monitoring_transfer
#
# Breadth probe: every testable claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners that §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# section / claim_type values follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: dealer_create_returns_defaults_and_version_one
        claim_type: Creation
        grounds:
          - entities.Dealer
          - endpoints.POST_/alarm-funding/dealers
        distinguishing_aspect: "A dealer created with the four required fields comes back 201 with standing ACTIVE, zero balances, version 1, and server-minted id and timestamps."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /alarm-funding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /alarm-funding/dealers"
              payload: { dealer_code: "D7", legal_name: "Cobalt Security Corp", holdback_rate: 0.08, quality_tier: "TIER_2" }
              as: ChannelManager
              captures: { d7_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Dealer.${d7_id}.dealer_code == \"D7\" and legal_name == \"Cobalt Security Corp\""
            - "Dealer.${d7_id}.standing == ACTIVE and holdback_reserve_cents == 0 and chargeback_balance_due_cents == 0"
            - "Dealer.${d7_id}.funded_package_count == 0 and version == 1"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: contract_get_round_trips_stored_origination_fields
        claim_type: Retrieval
        grounds:
          - entities.Contract
          - endpoints.GET_/alarm-funding/contracts/{id}
        distinguishing_aspect: "Every client-supplied origination field of a contract round-trips through the single-contract GET unchanged, including the null dealer linkage of a DIRECT contract."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DIRECT contract on file."
          setup_api_calls:
            - call: "POST /alarm-funding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alarm-funding/customers"
              payload: { full_name: "Fay Roundtrip", email: "fay.roundtrip@example.com", phone: "+15550001030" }
              as: ChannelManager
              captures: { c30_id: $.data.id }
            - call: "POST /alarm-funding/contracts"
              payload: { customer_id: "${c30_id}", equipment_config_code: "ELITE", credit_score: 688, contract_term_months: 48, monthly_monitoring_cents: 5999, financed_charge_at_apr_cents: 19900, premises_address_line: "300 Juniper St", premises_city: "Dallas", premises_state_code: "TX", premises_postal_code: "75020" }
              as: ChannelManager
              captures: { k30_id: $.data.id }
          trigger:
            - call: "GET /alarm-funding/contracts/${k30_id}"
              payload: {}
              as: ChannelManager
          assert:
            - "the response status is 200"
            - "Contract.${k30_id}.source_channel == DIRECT and dealer_id is null and dealer_package_id is null"
            - "Contract.${k30_id}.equipment_config_code == ELITE and credit_score == 688 and contract_term_months == 48"
            - "Contract.${k30_id}.monthly_monitoring_cents == 5999 and financed_charge_at_apr_cents == 19900"
            - "Contract.${k30_id}.contract_status == PENDING_VALIDATION"

      - name: contracts_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/alarm-funding/contracts
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three contracts on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the remaining row with has_more false."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Three DIRECT contracts on file."
          setup_api_calls:
            - call: "POST /alarm-funding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alarm-funding/customers"
              payload: { full_name: "Gale Pager", email: "gale.pager@example.com", phone: "+15550001031" }
              as: ChannelManager
              captures: { c31_id: $.data.id }
            - call: "POST /alarm-funding/contracts"
              payload: { customer_id: "${c31_id}", equipment_config_code: "BASE", credit_score: 700, contract_term_months: 36, monthly_monitoring_cents: 3999, premises_address_line: "310 Juniper St", premises_city: "Dallas", premises_state_code: "TX", premises_postal_code: "75021" }
              as: ChannelManager
              captures: { k31a_id: $.data.id }
            - call: "POST /alarm-funding/contracts"
              payload: { customer_id: "${c31_id}", equipment_config_code: "PREMIUM", credit_score: 700, contract_term_months: 48, monthly_monitoring_cents: 4999, premises_address_line: "311 Juniper St", premises_city: "Dallas", premises_state_code: "TX", premises_postal_code: "75022" }
              as: ChannelManager
              captures: { k31b_id: $.data.id }
            - call: "POST /alarm-funding/contracts"
              payload: { customer_id: "${c31_id}", equipment_config_code: "ELITE", credit_score: 700, contract_term_months: 60, monthly_monitoring_cents: 5999, premises_address_line: "312 Juniper St", premises_city: "Dallas", premises_state_code: "TX", premises_postal_code: "75023" }
              as: ChannelManager
              captures: { k31c_id: $.data.id }
          trigger:
            - call: "GET /alarm-funding/contracts"
              payload: { limit: 2, offset: 0 }
              as: ChannelManager
              captures: { page: $.data }
          assert:
            - "the first page returns exactly 2 contract rows"
            - "total_count == 3 and has_more == true"
            - "offset=2 returns the remaining 1 row with has_more false"

      - name: dealer_get_unknown_identifier_returns_404
        claim_type: Not Found
        grounds:
          - errors[ERR_ENTITY_NOT_FOUND]
          - endpoints.GET_/alarm-funding/dealers/{id}
        distinguishing_aspect: "A GET against a well-formed but unknown dealer identifier returns the 404 existence error, not a 400 or an empty object."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /alarm-funding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /alarm-funding/dealers/{id}"
              payload: {}
              as: ChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_ENTITY_NOT_FOUND and the HTTP status is 404"
            - "response_type is error"

      - name: create_dealer_missing_required_field_returns_400
        claim_type: Required Fields
        grounds:
          - validations[priority=10]
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST_/alarm-funding/dealers
        distinguishing_aspect: "A dealer create that omits legal_name fails the required-field check with ERR_INVALID_REQUEST before any row is written."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /alarm-funding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /alarm-funding/dealers"
              payload: { dealer_code: "D8", holdback_rate: 0.05, quality_tier: "TIER_1" }
              as: ChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_INVALID_REQUEST and the HTTP status is 400"
            - "no dealer with dealer_code D8 exists afterwards (the follow-up list read returns total_count 0)"

      - name: create_dealer_invalid_quality_tier_returns_400
        claim_type: Type Constraints
        grounds:
          - entities.Dealer.fields.quality_tier
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A quality_tier outside {TIER_1, TIER_2, TIER_3} is rejected as an invalid enum value rather than stored."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /alarm-funding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /alarm-funding/dealers"
              payload: { dealer_code: "D9", legal_name: "Bad Tier LLC", holdback_rate: 0.05, quality_tier: "TIER_9" }
              as: ChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_INVALID_REQUEST and the HTTP status is 400"

  # ===========================================================================
  - section: errors
    instances:

      - name: create_contract_with_unknown_customer_returns_fk_error
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FK_INTEGRITY_VIOLATION]
          - validations[priority=3]
        distinguishing_aspect: "A contract body whose customer_id names no row fails the FK-integrity check with ERR_FK_INTEGRITY_VIOLATION."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /alarm-funding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /alarm-funding/contracts"
              payload: { customer_id: "11111111-2222-3333-4444-555555555555", equipment_config_code: "BASE", credit_score: 700, contract_term_months: 36, monthly_monitoring_cents: 3999, premises_address_line: "1 Ghost St", premises_city: "Dallas", premises_state_code: "TX", premises_postal_code: "75030" }
              as: ChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_FK_INTEGRITY_VIOLATION and the HTTP status is 400"

      - name: create_customer_duplicate_email_returns_409
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_NATURAL_KEY_DUPLICATE]
        distinguishing_aspect: "Registering a second customer with an email already on file fails the natural-key uniqueness check with ERR_NATURAL_KEY_DUPLICATE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One customer with email dup@example.com exists."
          setup_api_calls:
            - call: "POST /alarm-funding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alarm-funding/customers"
              payload: { full_name: "Hal First", email: "dup@example.com", phone: "+15550001032" }
              as: ChannelManager
              captures: { c32_id: $.data.id }
          trigger:
            - call: "POST /alarm-funding/customers"
              payload: { full_name: "Ivy Second", email: "dup@example.com", phone: "+15550001033" }
              as: ChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_NATURAL_KEY_DUPLICATE and the HTTP status is 409"
            - "the original customer ${c32_id} is unchanged"

  # ===========================================================================
  - section: rbac
    instances:

      - name: dealer_role_cannot_approve_package_returns_403
        claim_type: role_denial
        grounds:
          - roles.FundingAnalyst.exclusive_operations
          - roles.Dealer
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "The Dealer role, which may submit and withdraw its own package, is denied the FundingAnalyst-exclusive approve operation with ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A dealer with one submitted package on file."
          setup_api_calls:
            - call: "POST /alarm-funding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alarm-funding/dealers"
              payload: { dealer_code: "D10", legal_name: "Delta Alarms Inc", holdback_rate: 0.10, quality_tier: "TIER_1" }
              as: ChannelManager
              captures: { d10_id: $.data.id }
            - call: "POST /alarm-funding/customers"
              payload: { full_name: "Jon RBAC", email: "jon.rbac@example.com", phone: "+15550001034" }
              as: ChannelManager
              captures: { c34_id: $.data.id }
            - call: "POST /alarm-funding/dealer-packages"
              payload: { package_reference: "PKG-P10", dealer_id: "${d10_id}" }
              as: FundingAnalyst
              captures: { p10_id: $.data.id }
            - call: "POST /alarm-funding/dealer-packages/${p10_id}/contracts"
              payload: { customer_id: "${c34_id}", equipment_config_code: "PREMIUM", credit_score: 700, contract_term_months: 60, monthly_monitoring_cents: 4999, premises_address_line: "340 Juniper St", premises_city: "Dallas", premises_state_code: "TX", premises_postal_code: "75024", installation_scheduled_at: "2026-09-02T00:00:00Z", installation_engineer_id: "ENG-1" }
              as: FundingAnalyst
              captures: { k34_id: $.data.id }
            - call: "POST /alarm-funding/dealer-packages/${p10_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${d10_id}"
            - call: "GET /alarm-funding/dealer-packages/${p10_id}"
              payload: {}
              as: FundingAnalyst
              captures: { p10_v: $.data.version }
          trigger:
            - call: "POST /alarm-funding/dealer-packages/${p10_id}/approve"
              payload: { expected_dealer_package_version: "${p10_v}" }
              as: Dealer
              as_user_id: "${d10_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_UNAUTHORIZED and the HTTP status is 403"
            - "authorization is checked before the OCC version, so the role denial wins"

  # ===========================================================================
  - section: validations
    instances:

      - name: rescission_self_approval_returns_segregation_error
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES_REQUIRED]
          - validations[priority=6]
        distinguishing_aspect: "A rescission decided by the same operator identifier that recorded the request fails the segregation-of-duties check with ERR_SEGREGATION_OF_DUTIES_REQUIRED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A funded DIRECT contract with a rescission request recorded under operator ops-same-1."
          setup_api_calls:
            - call: "POST /alarm-funding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alarm-funding/customers"
              payload: { full_name: "Kip Sod", email: "kip.sod@example.com", phone: "+15550001035" }
              as: ChannelManager
              captures: { c35_id: $.data.id }
            - call: "POST /alarm-funding/contracts"
              payload: { customer_id: "${c35_id}", equipment_config_code: "PREMIUM", credit_score: 700, contract_term_months: 60, monthly_monitoring_cents: 4999, financed_charge_at_apr_cents: 0, premises_address_line: "350 Juniper St", premises_city: "Dallas", premises_state_code: "TX", premises_postal_code: "75025", installation_scheduled_at: "2026-09-02T00:00:00Z", installation_engineer_id: "ENG-2" }
              as: ChannelManager
              captures: { k35_id: $.data.id }
            - call: "GET /alarm-funding/monitoring-accounts"
              payload: { contract_id: "${k35_id}" }
              as: MonitoringOperator
              captures: { ma35_id: $.data.0.id }
            - call: "POST /alarm-funding/monitoring-transfers/${ma35_id}/trigger"
              payload: {}
              as: MonitoringOperator
            - call: "GET /alarm-funding/installations"
              payload: { contract_id: "${k35_id}" }
              as: ServiceCoordinator
              captures: { i35_id: $.data.0.id }
            - call: "POST /alarm-funding/installations/${i35_id}/complete"
              payload: {}
              as: ServiceCoordinator
            - call: "GET /alarm-funding/contracts/${k35_id}"
              payload: {}
              as: FundingAnalyst
              captures: { k35_v: $.data.version }
            - call: "POST /alarm-funding/contracts/${k35_id}/fund"
              payload: { expected_contract_version: "${k35_v}" }
              as: FundingAnalyst
            - call: "POST /alarm-funding/rescission-requests"
              payload: { contract_id: "${k35_id}", operator_id: "ops-same-1" }
              as: Customer
              as_user_id: "${c35_id}"
              captures: { rr35_id: $.data.id }
          trigger:
            - call: "POST /alarm-funding/rescission-requests/${rr35_id}/decision"
              payload: { outcome: "APPROVED" }
              as: ComplianceOfficer
              as_user_id: "ops-same-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_SEGREGATION_OF_DUTIES_REQUIRED and the HTTP status is 403"
            - "RescissionRequest.${rr35_id}.request_status stays REQUESTED and Contract.${k35_id}.contract_status stays ACTIVE"

  # ===========================================================================

      - name: priority_state_over_fiscal_already_covered
        claim_type: priority_ordering
        grounds:
          - errors[ERR_PACKAGE_NOT_APPROVED]
          - errors[ERR_CREDIT_SCORE_BELOW_FLOOR]
        excluded_because:
          difficulty_instance: state_precedes_business_fiscal_on_package_fund
          rationale: "The state/business_fiscal precedence is asserted as the failing path of the named §1.8 instance."

      - name: service_window_overlap_already_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SERVICE_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: technician_half_open_service_window_collision
          rationale: "Both interval semantics are asserted as the outcome of the named §1.8 instances."

      - name: assumption_cycle_already_covered
        claim_type: invalid_transition
        grounds:
          - state_machines.AssumptionRequest.transitions.PENDING_NEGOTIATION_to_PENDING_NEGOTIATION
        excluded_because:
          difficulty_instance: assumption_request_failed_negotiation_round_cycle
          rationale: "The negotiation cycle and its third-rejection terminal are asserted as the outcome of the named §1.8 instance."

      - name: credit_floor_contagion_already_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CREDIT_SCORE_BELOW_FLOOR]
          - errors[ERR_PACKAGE_DECLINED]
        excluded_because:
          difficulty_instance: credit_gate_failure_contagion_freezes_sibling_children
          rationale: "The credit-floor freeze and its sibling contagion are asserted as the outcome of the named §1.8 instance."

      - name: monitoring_provision_gate_already_covered
        claim_type: cross_entity_validation
        grounds:
          - errors[ERR_MONITORING_NOT_PROVISIONED]
        excluded_because:
          difficulty_instance: contract_funding_requires_provisioned_monitoring_account
          rationale: "The Contract -> MonitoringAccount state dependency is asserted as the failing path of the named §1.8 instance."

      - name: dealer_standing_gate_already_covered
        claim_type: cross_entity_validation
        grounds:
          - errors[ERR_DEALER_STANDING_SUSPENDED]
        excluded_because:
          difficulty_instance: package_funding_requires_dealer_standing_not_suspended
          rationale: "The DealerPackage -> Dealer state dependency is asserted as the failing path of the named §1.8 instance."

  # ===========================================================================
  - section: state_machines
    instances:

      - name: dispatch_cannot_transition_from_aborted_returns_409
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.DispatchRequest.terminal_states
          - errors[ERR_DISPATCH_NOT_REQUESTED]
        distinguishing_aspect: "Once a dispatch reaches ABORTED, no declared transition leaves it, so a second dispatch action is rejected with ERR_DISPATCH_NOT_REQUESTED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One alarm whose dispatch has already been dispatched then aborted."
          setup_api_calls:
            - call: "POST /alarm-funding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alarm-funding/customers"
              payload: { full_name: "Lia Terminal", email: "lia.terminal@example.com", phone: "+15550001036" }
              as: ChannelManager
              captures: { c36_id: $.data.id }
            - call: "POST /alarm-funding/contracts"
              payload: { customer_id: "${c36_id}", equipment_config_code: "PREMIUM", credit_score: 700, contract_term_months: 60, monthly_monitoring_cents: 4999, premises_address_line: "360 Juniper St", premises_city: "Dallas", premises_state_code: "TX", premises_postal_code: "75026", installation_scheduled_at: "2026-09-02T00:00:00Z", installation_engineer_id: "ENG-3" }
              as: ChannelManager
              captures: { k36_id: $.data.id }
            - call: "GET /alarm-funding/monitoring-accounts"
              payload: { contract_id: "${k36_id}" }
              as: MonitoringOperator
              captures: { ma36_id: $.data.0.id }
            - call: "POST /alarm-funding/monitoring-transfers/${ma36_id}/trigger"
              payload: {}
              as: MonitoringOperator
            - call: "POST /alarm-funding/alarm-events"
              payload: { monitoring_account_id: "${ma36_id}", signal_source: "ZONE-7", occurred_at: "2026-09-03T00:00:00Z", entered_at_utc: "2026-09-03T00:00:30Z" }
              as: MonitoringOperator
              captures: { ae36_id: $.data.id }
            - call: "POST /alarm-funding/dispatch-requests"
              payload: { alarm_event_id: "${ae36_id}" }
              as: MonitoringOperator
              captures: { dr36_id: $.data.id }
            - call: "POST /alarm-funding/dispatch-requests/${dr36_id}/dispatch"
              payload: {}
              as: MonitoringOperator
            - call: "POST /alarm-funding/dispatch-requests/${dr36_id}/abort"
              payload: { abort_reason: "false alarm" }
              as: MonitoringOperator
          trigger:
            - call: "POST /alarm-funding/dispatch-requests/${dr36_id}/complete"
              payload: {}
              as: MonitoringOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_DISPATCH_NOT_REQUESTED and the HTTP status is 409"
            - "DispatchRequest.${dr36_id}.dispatch_status stays ABORTED"

  # ===========================================================================
  - section: cross_cutting
    instances:

      - name: stale_package_version_on_second_approve_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[package-approve-stale-package]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "An approve carrying the package version observed before a successful approve is rejected with the OCC error ERR_STALE_VERSION once the package version has advanced."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A submitted package P37 whose version has advanced past the value the stale writer observed."
          setup_api_calls:
            - call: "POST /alarm-funding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alarm-funding/dealers"
              payload: { dealer_code: "D11", legal_name: "Echo Alarms", holdback_rate: 0.10, quality_tier: "TIER_1" }
              as: ChannelManager
              captures: { d11_id: $.data.id }
            - call: "POST /alarm-funding/customers"
              payload: { full_name: "Mira Occ", email: "mira.occ@example.com", phone: "+15550001037" }
              as: ChannelManager
              captures: { c37_id: $.data.id }
            - call: "POST /alarm-funding/dealer-packages"
              payload: { package_reference: "PKG-P37", dealer_id: "${d11_id}" }
              as: FundingAnalyst
              captures: { p37_id: $.data.id }
            - call: "POST /alarm-funding/dealer-packages/${p37_id}/contracts"
              payload: { customer_id: "${c37_id}", equipment_config_code: "PREMIUM", credit_score: 700, contract_term_months: 60, monthly_monitoring_cents: 4999, premises_address_line: "370 Juniper St", premises_city: "Dallas", premises_state_code: "TX", premises_postal_code: "75027", installation_scheduled_at: "2026-09-02T00:00:00Z", installation_engineer_id: "ENG-1" }
              as: FundingAnalyst
              captures: { k37_id: $.data.id }
            - call: "GET /alarm-funding/monitoring-accounts"
              payload: { contract_id: "${k37_id}" }
              as: MonitoringOperator
              captures: { ma37_id: $.data.0.id }
            - call: "POST /alarm-funding/monitoring-transfers/${ma37_id}/trigger"
              payload: {}
              as: MonitoringOperator
            - call: "POST /alarm-funding/dealer-packages/${p37_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${d11_id}"
            - call: "GET /alarm-funding/dealer-packages/${p37_id}"
              payload: {}
              as: FundingAnalyst
              captures: { p37_v_stale: $.data.version }
            - call: "POST /alarm-funding/dealer-packages/${p37_id}/approve"
              payload: { expected_dealer_package_version: "${p37_v_stale}" }
              as: FundingAnalyst
              captures: { p37_v_fresh: $.data.version }
          trigger:
            - call: "POST /alarm-funding/dealer-packages/${p37_id}/approve"
              payload: { expected_dealer_package_version: "${p37_v_stale}" }
              as: FundingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_STALE_VERSION and the HTTP status is 412"
            - "the second approve carried ${p37_v_stale} while the package had advanced to ${p37_v_fresh}"
            - "DealerPackage.${p37_id}.package_status stays APPROVED"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: success_envelope_carries_meta_and_object_shape
        claim_type: Standard CRUD
        grounds:
          - response_envelope.success
          - endpoints.POST_/alarm-funding/dealers
        distinguishing_aspect: "A successful create returns response_type object with meta.api_request_id and meta.api_request_timestamp present and the created resource under data."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /alarm-funding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /alarm-funding/dealers"
              payload: { dealer_code: "D12", legal_name: "Foxtrot Alarms", holdback_rate: 0.10, quality_tier: "TIER_1" }
              as: ChannelManager
              captures: { d12_id: $.data.id, rid: $.meta.api_request_id, ts: $.meta.api_request_timestamp }
          assert:
            - "the envelope response_type is object"
            - "meta.api_request_id is present and non-empty"
            - "meta.api_request_timestamp parses as an ISO 8601 UTC instant"
            - "data.id is a server-minted UUID with no type prefix"

  # ===========================================================================
  - section: calculations
    instances:

      - name: dealer_chargeback_rate_threshold_error_already_covered
        claim_type: boundary
        grounds:
          - calculations.dealer_chargeback_rate
          - errors[ERR_DEALER_CHARGEBACK_RATE_EXCEEDED]
        excluded_because:
          difficulty_instance: dealer_chargeback_rate_inadvertent_alarm_dependent
          rationale: "The trailing-window rate and its WATCH/ACTIVE band are asserted as the outcome of the named §1.8 instance."

      - name: refund_floor_variant_divergence_already_covered
        claim_type: variant_divergence
        grounds:
          - calculations.equipment_and_rescission_refund_floor
        excluded_because:
          difficulty_instance: refund_floor_deferred_monitoring_surplus_vs_deficit
          rationale: "The surplus and deficit adjudication totals are asserted as the outcome of the named §1.8 instance."

      - name: post_warranty_waterfall_already_covered
        claim_type: waterfall_allocation
        grounds:
          - calculations.post_warranty_service_sweep
        excluded_because:
          difficulty_instance: post_warranty_sweep_holdback_waterfall_cash_balance_cascade
          rationale: "The holdback draw, cash remainder and standing re-derivation are asserted as the outcome of the named §1.8 instance."

      - name: false_alarm_ratio_cap_already_covered
        claim_type: threshold
        grounds:
          - calculations.false_alarm_ratio
        excluded_because:
          difficulty_instance: false_alarm_ratio_cap_strict_inequality_on_verify
          rationale: "The strict-greater-than cap crossing is asserted as the outcome of the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_visibility_of_funding_side_effects
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Contract.transitions.PENDING_VALIDATION_to_ACTIVE
        distinguishing_aspect: "Every side effect of a funding call is visible in the same request's response: the contract is ACTIVE with its computed holdback and equipment split already populated."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A DIRECT contract ready to fund with a provisioned account and a completed installation."
          setup_api_calls:
            - call: "POST /alarm-funding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alarm-funding/customers"
              payload: { full_name: "Nia Immediate", email: "nia.immediate@example.com", phone: "+15550001038" }
              as: ChannelManager
              captures: { c38_id: $.data.id }
            - call: "POST /alarm-funding/contracts"
              payload: { customer_id: "${c38_id}", equipment_config_code: "PREMIUM", credit_score: 700, contract_term_months: 60, monthly_monitoring_cents: 4999, financed_charge_at_apr_cents: 0, premises_address_line: "380 Juniper St", premises_city: "Dallas", premises_state_code: "TX", premises_postal_code: "75028", installation_scheduled_at: "2026-09-02T00:00:00Z", installation_engineer_id: "ENG-4" }
              as: ChannelManager
              captures: { k38_id: $.data.id }
            - call: "GET /alarm-funding/monitoring-accounts"
              payload: { contract_id: "${k38_id}" }
              as: MonitoringOperator
              captures: { ma38_id: $.data.0.id }
            - call: "POST /alarm-funding/monitoring-transfers/${ma38_id}/trigger"
              payload: {}
              as: MonitoringOperator
            - call: "GET /alarm-funding/installations"
              payload: { contract_id: "${k38_id}" }
              as: ServiceCoordinator
              captures: { i38_id: $.data.0.id }
            - call: "POST /alarm-funding/installations/${i38_id}/complete"
              payload: {}
              as: ServiceCoordinator
            - call: "GET /alarm-funding/contracts/${k38_id}"
              payload: {}
              as: FundingAnalyst
              captures: { k38_v: $.data.version }
          trigger:
            - call: "POST /alarm-funding/contracts/${k38_id}/fund"
              payload: { expected_contract_version: "${k38_v}" }
              as: FundingAnalyst
              captures: { st: $.data.contract_status, hb: $.data.holdback_cents, eq: $.data.equipment_financed_cents }
          assert:
            - "the same fund response already reports contract_status == ACTIVE"
            - "the same fund response already reports holdback_cents == 0 and equipment_financed_cents == 302 for a DIRECT contract"
            - "no follow-up read is required for the funded computed fields to be observable"