scaffold_corner_design:

  # =====================================================================
  # Entities
  # =====================================================================
  - section: entities
    instances:
      - name: create_service_plan_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.ServicePlan, endpoints]
        distinguishing_aspect: "POST /service-plans with all required fields -> 201 and response carries tier, sizes, all cents fields, archived=false, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /service-plans"
              payload: { tier: "BASIC", trash_cart_size_gallons: 35, recycling_cart_size_gallons: 35, monthly_base_cents: 3000, extra_cart_monthly_cents: 1000, extra_pickup_base_cents: 2000, bulk_item_cents: 600 }
              as: Dispatcher
              captures: { plan_id: $.data.id, arch: $.data.archived, ver: $.data.version }
          assert:
            - "HTTP status == 201"
            - "arch == false and ver == 1"
      - name: get_account_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.ServiceAccount, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /accounts/{unknown-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "err == ERR_NOT_FOUND"
      - name: create_account_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.ServiceAccount.fields.service_address, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /accounts omitting service_address -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A plan and a zone exist."]
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "STANDARD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /collection-zones"
              payload: { name: "Z", base_pickup_weekday: 0, recycling_week_parity: "EVEN" }
              as: Dispatcher
              captures: { zone_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", zone_id: "${zone_id}", holder_name: "No Addr" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "err == ERR_INVALID_REQUEST"
      - name: create_plan_invalid_enum_tier_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.ServicePlan.fields.tier, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /service-plans with tier not in {BASIC,STANDARD,PREMIUM} -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /service-plans"
              payload: { tier: "GOLD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "err == ERR_INVALID_REQUEST"
      - name: create_cart_invalid_size_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.CartAssignment.fields.size_gallons, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /accounts/{id}/carts with size_gallons not in {35,65,96} -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A PENDING_START account exists."]
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "STANDARD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /collection-zones"
              payload: { name: "Z", base_pickup_weekday: 0, recycling_week_parity: "EVEN" }
              as: Dispatcher
              captures: { zone_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", zone_id: "${zone_id}", service_address: "50 Oak St", holder_name: "Sz Q" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "TRASH", size_gallons: 50 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "err == ERR_INVALID_REQUEST"
      - name: holiday_immutable_entity_no_version_field
        claim_type: Immutability
        grounds: [entities.Holiday]
        distinguishing_aspect: "Holiday has common_fields:false; created holiday response carries id and created_at but no version, and has no update endpoint."
        test_recipe:
          setup: ["A zone exists."]
          setup_api_calls:
            - call: "POST /collection-zones"
              payload: { name: "Z", base_pickup_weekday: 0, recycling_week_parity: "EVEN" }
              as: Dispatcher
              captures: { zone_id: $.data.id }
          trigger:
            - call: "POST /collection-zones/${zone_id}/holidays"
              payload: { holiday_date: "2026-12-25T00:00:00Z", shift_direction: "DELAY_ONE_DAY" }
              as: Dispatcher
              captures: { hol_id: $.data.id, hol_created: $.data.created_at }
          assert:
            - "HTTP status == 201"
            - "response data has id and created_at but no version key"
      - name: account_balance_computed_field_input_ignored
        claim_type: Computed Fields
        grounds: [entities.ServiceAccount.fields.account_balance_cents, calculations.account_balance]
        distinguishing_aspect: "account_balance_cents is server-computed; a freshly created account with no invoices reads account_balance_cents == 0 regardless of any client-supplied value."
        test_recipe:
          setup: ["A plan and a zone exist."]
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "STANDARD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /collection-zones"
              payload: { name: "Z", base_pickup_weekday: 0, recycling_week_parity: "EVEN" }
              as: Dispatcher
              captures: { zone_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", zone_id: "${zone_id}", service_address: "52 Oak St", holder_name: "Te R" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: Dispatcher
              captures: { bal: $.data.account_balance_cents, cb: $.data.credit_balance_cents }
          assert:
            - "bal == 0 and cb == 0"
      - name: cart_is_extra_computed_third_cart_true
        claim_type: Computed Fields
        grounds: [entities.CartAssignment.fields.is_extra]
        distinguishing_aspect: "The third ACTIVE cart on an account has is_extra == true; the first TRASH and first RECYCLING carts have is_extra == false."
        test_recipe:
          setup: ["A PENDING_START account exists."]
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "STANDARD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /collection-zones"
              payload: { name: "Z", base_pickup_weekday: 0, recycling_week_parity: "EVEN" }
              as: Dispatcher
              captures: { zone_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", zone_id: "${zone_id}", service_address: "54 Oak St", holder_name: "Uv S" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "TRASH", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "RECYCLING", size_gallons: 65 }
              as: Dispatcher
          trigger:
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "TRASH", size_gallons: 35 }
              as: Dispatcher
              captures: { extra: $.data.is_extra }
          assert:
            - "extra == true"
      - name: list_plans_pagination_envelope
        claim_type: Listing
        grounds: [entities.ServicePlan, response_envelope]
        distinguishing_aspect: "GET /service-plans returns an array envelope with response_type array and pagination fields total_count and has_more."
        test_recipe:
          setup: ["One plan exists."]
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "BASIC", trash_cart_size_gallons: 35, recycling_cart_size_gallons: 35, monthly_base_cents: 3000, extra_cart_monthly_cents: 1000, extra_pickup_base_cents: 2000, bulk_item_cents: 600 }
              as: Dispatcher
          trigger:
            - call: "GET /service-plans"
              payload: { limit: 10, offset: 0 }
              as: Dispatcher
          assert:
            - "HTTP status == 200"
            - "response envelope response_type == array; meta.total_count >= 1; has_more present"

  # =====================================================================
  # State Machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: activate_already_active_account_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ServiceAccount.PENDING_START_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Re-activating an already ACTIVE account -> ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["An ACTIVE STANDARD account."]
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "STANDARD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /collection-zones"
              payload: { name: "Z", base_pickup_weekday: 0, recycling_week_parity: "EVEN" }
              as: Dispatcher
              captures: { zone_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", zone_id: "${zone_id}", service_address: "56 Oak St", holder_name: "Wx T" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "TRASH", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "RECYCLING", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate-start"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /accounts/${acct_id}/activate-start"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "err == ERR_INVALID_STATE"
      - name: resume_account_that_is_not_suspended_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ServiceAccount.SUSPENDED_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling resume on an ACTIVE (not SUSPENDED) account -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An ACTIVE STANDARD account."]
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "STANDARD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /collection-zones"
              payload: { name: "Z", base_pickup_weekday: 0, recycling_week_parity: "EVEN" }
              as: Dispatcher
              captures: { zone_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", zone_id: "${zone_id}", service_address: "58 Oak St", holder_name: "Yz U" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "TRASH", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "RECYCLING", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate-start"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /accounts/${acct_id}/resume"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "err == ERR_INVALID_STATE"
      - name: stop_account_then_stop_again_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ServiceAccount.ACTIVE_to_STOPPED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "STOPPED is terminal: a second stop -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A STOPPED STANDARD account."]
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "STANDARD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /collection-zones"
              payload: { name: "Z", base_pickup_weekday: 0, recycling_week_parity: "EVEN" }
              as: Dispatcher
              captures: { zone_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", zone_id: "${zone_id}", service_address: "60 Oak St", holder_name: "Aa V" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "TRASH", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "RECYCLING", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate-start"
              payload: {}
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/stop"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /accounts/${acct_id}/stop"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "err == ERR_INVALID_STATE"
      - name: collect_event_after_completed_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.PickupSchedule.PLANNED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Reporting a second event on a schedule already COMPLETED -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An ACTIVE account with its first schedule already COMPLETED."]
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "STANDARD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /collection-zones"
              payload: { name: "Z", base_pickup_weekday: 0, recycling_week_parity: "EVEN" }
              as: Dispatcher
              captures: { zone_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: Dispatcher
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", zone_id: "${zone_id}", service_address: "62 Oak St", holder_name: "Bb W" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "TRASH", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "RECYCLING", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate-start"
              payload: {}
              as: Dispatcher
            - call: "GET /accounts/${acct_id}/pickup-schedules"
              payload: { stream: "TRASH" }
              as: Dispatcher
              captures: { s0_id: $.data.0.id, s0_eff: $.data.0.effective_pickup_date }
            - call: "POST /pickup-schedules/${s0_id}/events"
              payload: { outcome: "COLLECTED", reported_at: "${s0_eff}" }
              as: CrewLead
          trigger:
            - call: "POST /pickup-schedules/${s0_id}/events"
              payload: { outcome: "COLLECTED", reported_at: "${s0_eff}" }
              as: CrewLead
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "err == ERR_INVALID_STATE"
      - name: missed_pickup_issues_credit_side_effect
        claim_type: Side Effect Execution
        grounds: [state_machines.PickupSchedule.PLANNED_to_MISSED, calculations.missed_credit]
        excluded_because:
          difficulty_instance: transitive_cascade / missed_event_credits_then_invoice_consumes_then_void_restores
          rationale: "The MISSED->credit issuance side effect is the first hop asserted by the named §1.8 cascade instance."
      - name: holiday_shift_delay_one_day_effective_date
        claim_type: Side Effect Execution
        grounds: [calculations.holiday_shift, entities.PickupSchedule.fields.effective_pickup_date, entities.Holiday.fields.shift_direction]
        distinguishing_aspect: "A schedule whose service_date falls on a zone holiday with shift_direction DELAY_ONE_DAY has effective_pickup_date == service_date + 1 day."
        test_recipe:
          setup: ["A zone with a DELAY_ONE_DAY holiday on the first Monday pickup; an ACTIVE account in that zone."]
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "STANDARD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /collection-zones"
              payload: { name: "Z", base_pickup_weekday: 0, recycling_week_parity: "EVEN" }
              as: Dispatcher
              captures: { zone_id: $.data.id }
            - call: "POST /collection-zones/${zone_id}/holidays"
              payload: { holiday_date: "2026-03-02T00:00:00Z", shift_direction: "DELAY_ONE_DAY" }
              as: Dispatcher
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-26T00:00:00Z" }
              as: Dispatcher
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", zone_id: "${zone_id}", service_address: "64 Oak St", holder_name: "Cc X" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "TRASH", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "RECYCLING", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate-start"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "GET /accounts/${acct_id}/pickup-schedules"
              payload: { stream: "TRASH" }
              as: Dispatcher
              captures: { s0_service: $.data.0.service_date, s0_eff: $.data.0.effective_pickup_date }
          assert:
            - "s0_service == 2026-03-02T00:00:00Z and s0_eff == 2026-03-03T00:00:00Z (first TRASH pickup lands on the holiday and slips one day)"

  # =====================================================================
  # Calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: contamination_first_notice_is_free_warning
        claim_type: Constants Applied
        grounds: [calculations.contamination_fee, entities.ContaminationNotice.fields.fee_cents]
        distinguishing_aspect: "The first-ever ContaminationNotice on an account has fee_cents == 0 (free warning, prior_contam == 0)."
        test_recipe:
          setup: ["An ACTIVE STANDARD account; one CONTAMINATED recycling event reported."]
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "STANDARD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /collection-zones"
              payload: { name: "Z", base_pickup_weekday: 0, recycling_week_parity: "EVEN" }
              as: Dispatcher
              captures: { zone_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: Dispatcher
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", zone_id: "${zone_id}", service_address: "66 Oak St", holder_name: "Dd Y" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "TRASH", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "RECYCLING", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate-start"
              payload: {}
              as: Dispatcher
            - call: "GET /accounts/${acct_id}/pickup-schedules"
              payload: { stream: "RECYCLING" }
              as: Dispatcher
              captures: { rec1_id: $.data.0.id, rec1_eff: $.data.0.effective_pickup_date }
          trigger:
            - call: "POST /pickup-schedules/${rec1_id}/events"
              payload: { outcome: "CONTAMINATED", reported_at: "${rec1_eff}" }
              as: CrewLead
              captures: { ev_id: $.data.id }
            - call: "GET /contamination-notices"
              payload: { pickup_event_id: "${ev_id}" }
              as: Dispatcher
              captures: { fee: $.data.0.fee_cents, st: $.data.0.status }
          assert:
            - "fee == 0 and st == OPEN"
      - name: contamination_second_major_fee_doubled
        claim_type: Correct Result
        grounds: [calculations.contamination_fee, entities.ContaminationNotice.fields.severity]
        distinguishing_aspect: "A second contamination notice with severity MAJOR has fee_cents == 3000 (MINOR_FEE_CENTS 1500 * MAJOR_MULTIPLIER 2)."
        test_recipe:
          setup: ["An ACTIVE STANDARD account; two CONTAMINATED recycling events, the second reported MAJOR."]
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "STANDARD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /collection-zones"
              payload: { name: "Z", base_pickup_weekday: 0, recycling_week_parity: "EVEN" }
              as: Dispatcher
              captures: { zone_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
