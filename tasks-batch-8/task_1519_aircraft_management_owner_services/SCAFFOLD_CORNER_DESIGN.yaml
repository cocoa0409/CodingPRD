  - section: cross_cutting_layers
    instances:
      - name: agreement_terms_amendment_happy_path
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[agreement-terms-stale-version]"]
        distinguishing_aspect: "PATCH terms with the current expected_agreement_version succeeds, applies the new fee, and increments version from 2 to 3 (create == 1, activate == 2)."
        test_recipe:
          setup: ["Agreement ACTIVE; version captured from the activate response"]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /aircraft"
              payload: { owner_id: "${o_id}", tail_number: "N520JX", model: "G650", home_base_icao: "KTEB" }
              as: AccountExecutive
              captures: { a_id: $.data.id }
            - call: "POST /agreements"
              payload: { owner_id: "${o_id}", aircraft_id: "${a_id}", monthly_management_fee_cents: 500000, variable_fee_pct: 0.10, charter_owner_share_pct: 0.85, tax_allocation_method: FLIGHT_HOURS }
              as: AccountExecutive
              captures: { ag_id: $.data.id }
            - call: "POST /agreements/${ag_id}/activate"
              as: AccountExecutive
              captures: { ag_v: $.data.version }
          trigger:
            - call: "PATCH /agreements/${ag_id}/terms"
              payload: { expected_agreement_version: "${ag_v}", monthly_management_fee_cents: 550000 }
              as: AccountExecutive
          assert:
            - "ManagementAgreement.${ag_id}.monthly_management_fee_cents == 550000"
            - "ManagementAgreement.${ag_id}.version == ${ag_v} + 1"

      - name: agreement_terms_amendment_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[agreement-terms-stale-version]", "errors[ERR_STALE_AGREEMENT_VERSION]"]
        distinguishing_aspect: "After one successful amendment advances the version, a second amendment carrying the previously observed version is rejected with ERR_STALE_AGREEMENT_VERSION (412) and changes nothing."
        test_recipe:
          setup: ["Agreement ACTIVE; version captured before the first amendment"]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /aircraft"
              payload: { owner_id: "${o_id}", tail_number: "N530JX", model: "G650", home_base_icao: "KTEB" }
              as: AccountExecutive
              captures: { a_id: $.data.id }
            - call: "POST /agreements"
              payload: { owner_id: "${o_id}", aircraft_id: "${a_id}", monthly_management_fee_cents: 500000, variable_fee_pct: 0.10, charter_owner_share_pct: 0.85, tax_allocation_method: FLIGHT_HOURS }
              as: AccountExecutive
              captures: { ag_id: $.data.id }
            - call: "POST /agreements/${ag_id}/activate"
              as: AccountExecutive
              captures: { ag_v: $.data.version }
          trigger:
            - call: "PATCH /agreements/${ag_id}/terms"
              payload: { expected_agreement_version: "${ag_v}", monthly_management_fee_cents: 550000 }
              as: AccountExecutive
            - call: "PATCH /agreements/${ag_id}/terms"
              payload: { expected_agreement_version: "${ag_v}", monthly_management_fee_cents: 575000 }
              as: AccountExecutive
              captures: { err: $.data.error_id }
          assert:
            - "second PATCH rejected with error_id == ERR_STALE_AGREEMENT_VERSION and http 412"
            - "ManagementAgreement.${ag_id}.monthly_management_fee_cents == 550000 (unchanged by the stale request)"

      - name: cascading_side_effects_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: ["state_machines.ManagementAgreement.ACTIVE_to_TERMINATION_PENDING"]
        excluded_because:
          difficulty_instance: termination_notice_cascades_trip_cancel_and_assignment_release
          rationale: "The multi-hop cascade (agreement -> trips -> assignments) is asserted end-to-end by the named instance."

      - name: dual_variant_layer_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds: ["calculations.statement_accrual_cash_totals"]
        excluded_because:
          difficulty_instance: statement_accrual_vs_cash_variant_totals
          rationale: "Both variants and their divergence are asserted by the named instance."

      - name: rate_threshold_layer_covered_by_difficulty
        claim_type: rate_threshold_triggers
        grounds: ["calculations.duty_hours_accumulation"]
        excluded_because:
          difficulty_instance: duty_limit_exact_boundary_passes_and_excess_rejected
          rationale: "The cumulative threshold and its exact boundary behavior are asserted by the named instance."

  - section: consistency_model
    instances:
      - name: trip_completion_immediately_visible
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "state_machines.TripRequest.SCHEDULED_to_COMPLETED"]
        distinguishing_aspect: "Immediate consistency: the complete response itself carries status COMPLETED and the computed owner_credit_cents, and a subsequent GET of the aircraft in the same test step already shows the incremented total_time_hours — no delay or recompute endpoint exists."
        test_recipe:
          setup: ["Agreement ACTIVE; QUALIFIED crew pair; ACCEPTED INSURANCE_COI; CHARTER trip (quote 900000) SCHEDULED"]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /aircraft"
              payload: { owner_id: "${o_id}", tail_number: "N540JX", model: "G650", home_base_icao: "KTEB" }
              as: AccountExecutive
              captures: { a_id: $.data.id }
            - call: "POST /agreements"
              payload: { owner_id: "${o_id}", aircraft_id: "${a_id}", monthly_management_fee_cents: 500000, variable_fee_pct: 0.10, charter_owner_share_pct: 0.85, tax_allocation_method: FLIGHT_HOURS }
              as: AccountExecutive
              captures: { ag_id: $.data.id }
            - call: "POST /agreements/${ag_id}/activate"
              as: AccountExecutive
            - call: "POST /crew"
              payload: { aircraft_id: "${a_id}", full_name: "Pat Captain", crew_role: CAPTAIN, hire_date: "2026-01-15" }
              as: FlightOpsManager
              captures: { c1_id: $.data.id }
            - call: "POST /crew/${c1_id}/begin-training"
              as: FlightOpsManager
            - call: "POST /crew/${c1_id}/complete-training"
              payload: { training_hours: 30, check_ride_passed: true }
              as: FlightOpsManager
            - call: "POST /crew"
              payload: { aircraft_id: "${a_id}", full_name: "Sam Officer", crew_role: FIRST_OFFICER, hire_date: "2026-02-01" }
              as: FlightOpsManager
              captures: { c2_id: $.data.id }
            - call: "POST /crew/${c2_id}/begin-training"
              as: FlightOpsManager
            - call: "POST /crew/${c2_id}/complete-training"
              payload: { training_hours: 28, check_ride_passed: true }
              as: FlightOpsManager
            - call: "POST /filings"
              payload: { aircraft_id: "${a_id}", filing_kind: INSURANCE_COI, authority: "Avemco", reference_no: "COI-5401", valid_until: "2027-01-01" }
              as: ComplianceOfficer
              captures: { f_id: $.data.id }
            - call: "POST /filings/${f_id}/file"
              as: ComplianceOfficer
            - call: "POST /filings/${f_id}/record-decision"
              payload: { outcome: ACCEPTED }
              as: ComplianceOfficer
            - call: "POST /trips"
              payload: { aircraft_id: "${a_id}", trip_use: CHARTER, depart_icao: "KTEB", arrive_icao: "KMIA", departure_at: "2026-08-06T08:00:00Z", block_hours_est: 6.0, charter_quote_cents: 900000 }
              as: FlightOpsManager
              captures: { t_id: $.data.id }
            - call: "POST /trips/${t_id}/approve"
              as: Owner
              as_user_id: "${o_id}"
            - call: "POST /assignments"
              payload: { trip_id: "${t_id}", crew_member_id: "${c1_id}", duty_role: PIC, duty_start_at: "2026-08-06T06:00:00Z", duty_end_at: "2026-08-06T14:00:00Z" }
              as: FlightOpsManager
            - call: "POST /assignments"
              payload: { trip_id: "${t_id}", crew_member_id: "${c2_id}", duty_role: SIC, duty_start_at: "2026-08-06T06:00:00Z", duty_end_at: "2026-08-06T14:00:00Z" }
              as: FlightOpsManager
            - call: "POST /trips/${t_id}/schedule"
              as: FlightOpsManager
          trigger:
            - call: "POST /trips/${t_id}/complete"
              payload: { block_hours_actual: 6.0 }
              as: FlightOpsManager
              captures: { credit: $.data.owner_credit_cents }
            - call: "GET /aircraft/${a_id}"
              as: FlightOpsManager
              captures: { hours: $.data.total_time_hours }
          assert:
            - "complete response: status == COMPLETED and owner_credit_cents == 765000 (no CHARTER_DIRECT costs were posted)"
            - "GET aircraft immediately after: total_time_hours == 6.0"
