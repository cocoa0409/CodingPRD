            - "Logical clock at 2026-09-01T00:00:00Z; an empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /filling-suites"
              payload: { suite_code: "FS-1", grade: "B", changeover_minutes_same_product: 60, changeover_minutes_product_change: 240, max_committed_minutes: 20000 }
              as: ProgramManager
              captures: { suite_id: $.data.id, suite_ver_created: $.data.version }
            - call: "POST /media-fills"
              payload: { suite_id: "${suite_id}", scheduled_run_date: "2026-09-02T08:00:00Z" }
              as: MicrobiologyAnalyst
              captures: { mf1_id: $.data.id }
            - call: "POST /media-fills/${mf1_id}/execute"
              payload: { units_filled: 6000, participating_operator_names: ["OP-A", "OP-B"] }
              as: MicrobiologyAnalyst
          trigger:
            - call: "POST /media-fills/${mf1_id}/read"
              payload: { contaminated_units: 0 }
              as: MicrobiologyAnalyst
            - call: "GET /filling-suites/${suite_id}"
              as: ProgramManager
              captures: { ver_after_media_fill: $.data.version }
            - call: "POST /filling-suites/${suite_id}/cleaning-validation"
              payload: { molecule_name: "MOL-A", residue_ug_per_swab: 12 }
              as: MicrobiologyAnalyst
            - call: "GET /filling-suites/${suite_id}"
              as: ProgramManager
              captures: { ver_after_cleaning: $.data.version }
            - call: "POST /personnel-qualifications"
              payload: { operator_name: "OP-A", suite_id: "${suite_id}", qualification_type: "ASEPTIC_INTERVENTION", expires_on: "2027-06-01T00:00:00Z", media_fill_id: "${mf1_id}" }
              as: MicrobiologyAnalyst
              captures: { pq_a_id: $.data.id }
            - call: "POST /personnel-qualifications/${pq_a_id}/qualify"
              as: MicrobiologyAnalyst
              captures: { pq_ver: $.data.version }
            - call: "POST /client-projects"
              payload: { client_name: "Sponsor A", molecule_name: "MOL-A", dosage_form: "VIAL", primary_suite_id: "${suite_id}", target_fill_weight_mg: 1000, historical_reject_rate_ppm: 2500, reserved_unit_budget: 30000 }
              as: ProgramManager
              captures: { proj_id: $.data.id }
            - call: "POST /client-projects/${proj_id}/advance-tech-transfer"
              payload: { to_stage: "GAP_ASSESSMENT", analytical_method_transfer_status: "IN_TRANSFER" }
              as: ProgramManager
            - call: "POST /client-projects/${proj_id}/advance-tech-transfer"
              payload: { to_stage: "ENGINEERING_RUN", analytical_method_transfer_status: "IN_TRANSFER" }
              as: ProgramManager
            - call: "POST /client-projects/${proj_id}/advance-tech-transfer"
              payload: { to_stage: "COMPLETE", analytical_method_transfer_status: "VALIDATED" }
              as: ProgramManager
              captures: { proj_ver: $.data.version }
            - call: "POST /batch-orders"
              payload: { client_project_id: "${proj_id}", suite_id: "${suite_id}", lead_operator_qualification_id: "${pq_a_id}", batch_number: "B-001", planned_start: "2026-09-10T08:00:00Z", planned_end: "2026-09-10T16:00:00Z", target_fill_units: 10000, expected_suite_version: "${ver_after_cleaning}" }
              as: ProgramManager
              captures: { batch_id: $.data.id }
            - call: "GET /filling-suites/${suite_id}"
              as: ProgramManager
              captures: { ver_after_batch: $.data.version }
          assert:
            - "${suite_ver_created} == 1"
            - "${ver_after_media_fill} == 2 — the suite is versioned by a write issued through the MediaFill endpoint"
            - "${ver_after_cleaning} == 3"
            - "${ver_after_batch} == 4 — scheduling bumps the suite once even though it also writes committed_minutes and the project's ledger"
            - "the two GETs at trigger calls 2 and 4 did not themselves change the version: repeating GET /filling-suites/${suite_id} still returns 4"
            - "${pq_ver} == 2 and ${proj_ver} == 4 — each entity counts only its own successful writes (three advance-tech-transfer calls on top of creation)"
            - "BatchOrder.${batch_id}.version == 1"

      - name: media_fill_failure_cascades_five_levels
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: media_fill_failure_five_level_freeze_and_component_restoration
          rationale: "The §1.8 multi_level_cascade instance already walks the depth-5 chain (qualification invalidated -> suite frozen -> batches suspended and quarantined -> reservations released -> exhausted lots restored) and asserts every hop, including the ledger restoration."

      - name: em_action_excursion_cascade_reopens_a_closed_review
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: em_action_excursion_four_level_reopens_closed_batch_record_review
          rationale: "The §1.8 multi_level_cascade instance already asserts the four-level environmental-excursion chain and the ordering sensitivity of the review reopening."

      - name: both_releasable_unit_variants_are_stamped_and_reconciled
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: batch_provisional_vs_final_releasable_units_diverge
          rationale: "The §1.8 dual_variant_divergence instance already asserts both variants on identical data, the delta, and that provisional_releasable_units is never overwritten when the final figure is stamped."

      - name: readiness_score_variants_diverge_on_identical_data
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: project_readiness_intake_forecast_vs_gmp_audit_diverge
          rationale: "The §1.8 dual_variant_divergence instance already asserts the 100-versus-47 divergence and the per-component breakdown for both readiness variants."

      - name: em_alert_and_action_limits_are_threshold_triggers
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: em_excursion_risk_index_four_factor_interaction
          rationale: "The §1.8 multi_factor_interaction instance already tests the alert and action limits at their exact boundaries per grade together with the saturating risk index, covering both the instantaneous threshold and its effect on the suite posture."

      - name: component_ledger_is_reconciled_on_cancellation
        claim_type: derived_field_reconciliation
        excluded_because:
          difficulty_instance: batch_cancellation_restores_component_unit_ledger_exactly
          rationale: "The §1.8 compensating_action instance already asserts that cancelling a batch restores quantity_available, committed_demand_units and committed_minutes to their exact pre-batch values with no drift."

  - section: consistency_model
    instances:
      - name: every_derived_field_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.em_excursion_risk_index
          - calculations.suite_posture
        distinguishing_aspect: "The declared model is immediate, so a single EM action excursion must return its own classification, limits and risk index in the creating response and the suite posture must already read RESTRICTED on the very next read — no second write, no background pass and no re-read delay may be required for any derived value."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; FS-1 is a grade B suite that is QUALIFIED and cleaned for MOL-A, so its posture is OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /filling-suites"
              payload: { suite_code: "FS-1", grade: "B", changeover_minutes_same_product: 60, changeover_minutes_product_change: 240, max_committed_minutes: 20000 }
              as: ProgramManager
              captures: { suite_id: $.data.id }
            - call: "POST /media-fills"
              payload: { suite_id: "${suite_id}", scheduled_run_date: "2026-09-02T08:00:00Z" }
              as: MicrobiologyAnalyst
              captures: { mf1_id: $.data.id }
            - call: "POST /media-fills/${mf1_id}/execute"
              payload: { units_filled: 6000, participating_operator_names: ["OP-A", "OP-B"] }
              as: MicrobiologyAnalyst
            - call: "POST /media-fills/${mf1_id}/read"
              payload: { contaminated_units: 0 }
              as: MicrobiologyAnalyst
            - call: "POST /personnel-qualifications"
              payload: { operator_name: "OP-A", suite_id: "${suite_id}", qualification_type: "ASEPTIC_INTERVENTION", expires_on: "2027-06-01T00:00:00Z", media_fill_id: "${mf1_id}" }
              as: MicrobiologyAnalyst
              captures: { pq_a_id: $.data.id }
            - call: "POST /personnel-qualifications/${pq_a_id}/qualify"
              as: MicrobiologyAnalyst
            - call: "POST /personnel-qualifications"
              payload: { operator_name: "OP-B", suite_id: "${suite_id}", qualification_type: "ASEPTIC_INTERVENTION", expires_on: "2027-06-01T00:00:00Z", media_fill_id: "${mf1_id}" }
              as: MicrobiologyAnalyst
              captures: { pq_b_id: $.data.id }
            - call: "POST /personnel-qualifications/${pq_b_id}/qualify"
              as: MicrobiologyAnalyst
            - call: "POST /filling-suites/${suite_id}/cleaning-validation"
              payload: { molecule_name: "MOL-A", residue_ug_per_swab: 12 }
              as: MicrobiologyAnalyst
            - call: "GET /filling-suites/${suite_id}"
              as: ProgramManager
              captures: { posture_before: $.data.posture }
          trigger:
            - call: "POST /em-samples"
              payload: { suite_id: "${suite_id}", sample_type: "VIABLE_AIR", cfu_count: 12 }
              as: MicrobiologyAnalyst
              captures: { em_id: $.data.id, cls: $.data.classification, risk: $.data.risk_index }
            - call: "GET /filling-suites/${suite_id}"
              as: ProgramManager
          assert:
            - "${posture_before} == 'OPEN'"
            - "trigger call 1: HTTP 201 and the creating response already carries alert_limit == 5, action_limit == 10, ${cls} == 'ACTION' and ${risk} == 48 — round_half_up(12/10 * 20 * 2.0) == 48 with a VIABLE_AIR surcharge of 0, below the 100 core cap"
            - "trigger call 1: data.investigation_status == 'REQUIRED' in the same response"
            - "trigger call 2: data.posture == 'RESTRICTED' — the open action excursion is counted immediately, with no intervening write"
            - "GET /em-samples/${em_id} returns the identical classification and risk_index as the creating response"
