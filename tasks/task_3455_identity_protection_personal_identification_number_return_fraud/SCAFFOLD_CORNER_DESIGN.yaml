          trigger:
            - { call: "POST /identity-protection/refund-disbursements/${disb}/release", payload: { expected_amount_cents: 999999 }, as: SystemAdmin, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_DISBURSEMENT_AMOUNT_MISMATCH"
            - "disbursement remains SCHEDULED (no partial release)"

