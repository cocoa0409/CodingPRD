            - "GET /orchestra/ticket-orders?concert_id=${c1} returns total_count == 0"
            - "Concert.${c1}.section_inventory[seat_section_id=${sec_orch}].held_count == 0"

      - name: publish_union_break_beats_venue_changeover
        grounds:
          - validations[priority=10]
          - validations[priority=14]
          - errors[ERR_UNION_BREAK_VIOLATION]
          - errors[ERR_VENUE_CHANGEOVER_CONFLICT]
