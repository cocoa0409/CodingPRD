      - name: truck_maintenance_cycle_triggered_at_service_interval
        claim_type: side_effect_execution
        grounds:
          - state_machines.ProductionTruck[IN_TRANSIT -> IN_MAINTENANCE]
          - calculations.truck_service_accrual
          - endpoints[POST /broadcast-ops/trucks/{id}/service-complete]
        distinguishing_aspect: |
          The engine-hour ledger must close the loop across three requests: wrap accrues
          8 + 4 + ceil(180/60) = 15 hours onto 485, arrive sees 500 >= 500 and sends the truck to
          IN_MAINTENANCE with hours_to_service 0 (at-or-above semantics, not strictly-above), and
          service-complete zeroes the counter, restores hours_to_service to the full 500 interval and
          stamps last_service_completed_at from the logical clock. Accruing on arrive instead of wrap,
          or truncating instead of ceiling the air hours, changes the arrive outcome.
