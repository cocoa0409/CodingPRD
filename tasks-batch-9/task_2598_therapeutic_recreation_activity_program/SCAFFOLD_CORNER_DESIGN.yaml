              as_user_id: "compliance-B"
              captures: { attester: $.data.attested_by_user_id }
          assert:
            - "the self-attestation returns 403 and ${sod_err} == \"ERR_SEGREGATION_OF_DUTIES\""
            - "${compiler} == \"compliance-A\""
            - "after the refusal SurveyPacket.${pkt_id}.status == COMPILED"
            - "the second-officer call returns 200 and ${attester} == \"compliance-B\""
            - "SurveyPacket.${pkt_id}.status == ATTESTED with compiled_by_user_id still \"compliance-A\""
