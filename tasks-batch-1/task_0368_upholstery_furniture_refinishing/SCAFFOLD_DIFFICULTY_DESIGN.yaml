  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: approve_state_vs_fiscal_state_wins
        grounds:
          - validations[priority=20]
          - validations[priority=50]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_DEPOSIT_TOO_LOW]
        distinguishing_aspect: |
          Error-category pair STATE (priority 20, ERR_INVALID_STATE) vs BUSINESS_FISCAL (priority 50,
          ERR_DEPOSIT_TOO_LOW): approving an order that is INTAKE (wrong state) AND with a too-low deposit
          must return ERR_INVALID_STATE (lower priority number wins), not the fiscal error.
        test_recipe:
          setup:
            - "A WorkOrder at INTAKE (no line items, no estimate) so approve is state-invalid; deposit 1 is also below any threshold."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Lee L", email: "lee@x.com", phone: "555-0108" }
              as: IntakeClerk
              captures: { cust_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", service_type: "REPAIR", rush_requested: false }
              as: IntakeClerk
              captures: { wo_id: $.data.id }
            - call: "GET /work-orders/${wo_id}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { wo_v: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${wo_v}", deposit_amount_cents: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: production_leg_materials_state_vs_capacity_safety_state_wins
        grounds:
          - validations[priority=22]
          - validations[priority=40]
          - errors[ERR_MATERIALS_OUTSTANDING]
          - errors[ERR_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair STATE (priority 22, ERR_MATERIALS_OUTSTANDING) vs BUSINESS_SAFETY
