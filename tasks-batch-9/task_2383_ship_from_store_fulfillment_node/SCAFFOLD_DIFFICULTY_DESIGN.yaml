      - name: fill_rate_exactly_at_the_floor_does_not_breach_while_one_tenth_lower_does
        grounds:
          - calculations.node_performance_metrics
          - state_machines.NodePerformanceWindow.OPEN_to_CLOSED
          - state_machines.Store.ELIGIBLE_to_PROBATION
        distinguishing_aspect: |
          Metric 3 = NodePerformanceWindow.fill_rate against FILL_RATE_FLOOR at endpoint
          POST /performance-windows/close: in one ops-run S1 closes at fill_rate exactly 0.9000
          (9 of 10 units) and must NOT raise FILL_RATE, while S3 closes at 0.8000 (4 of 5) and
          must raise it and move to PROBATION - an implementation using fill_rate <= floor
          would put both nodes on probation.
        test_recipe:
          setup:
            - "Clock 09:00; S1 (created first) stocks only SKU-A (on_hand 20 / safety 2) and S3 stocks only SKU-B (on_hand 10 / safety 0), so each order can only be routed to the node holding its SKU."
            - "Both nodes have MEDIUM_BOX / SMALL_BOX supplies and a 09:00Z-12:00Z pickup, and both hold an OPEN epoch-1 window."
            - "At 09:00 O1 (SKU-A x9, zone 4, GROUND) commits to S1 as a1 and O3 (SKU-B x4, zone 2, GROUND) commits to S3 as a3."
            - "Both are accepted 09:05, picked in full 09:10, packed 09:20 (labor_minutes_actual 15.00) and shipped 09:30 (cycle_time_minutes 30), giving final costs 1590 at S1 and 815 at S3."
            - "At 09:35 O2 (SKU-A x1) commits to S1 as a2 and O4 (SKU-B x1) commits to S3 as a4; both stay ASSIGNED, so S1's epoch-1 window promises 10 units and S3's promises 5."
