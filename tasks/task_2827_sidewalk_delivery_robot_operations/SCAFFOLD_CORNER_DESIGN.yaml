            - "DepotBay B1 bay_type CHARGE, state OPEN, power_kw 22.0, committed_minutes 60"
            - "BayReservation RES on B1 for R1, reservation_type CHARGE, window [2026-08-03T10:00:00.000Z, 2026-08-03T11:00:00.000Z), state HELD, window_minutes 60"
            - "the clock is still an hour before the window starts"
