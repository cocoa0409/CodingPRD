              payload: { style_id: "${style_bare_id}", requested_size: "M", requested_start_date: "2026-08-05", requested_end_date: "2026-08-09" }
              as: Member
              as_user_id: "${member_id}"
          assert:
            - "HTTP 201"
            - "Reservation.state == WAITLISTED"
