scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — dual_variant_calc (two calculations, different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_window_provisional_vs_final_on_invoice
        grounds:
          - calculations.invoice_window_provisional
          - calculations.invoice_window_final
          - entities.Invoice.fields.subtotal_cents
        distinguishing_aspect: |
          Invoice-domain dual variant: identical period [2026-06-01, 2026-06-11) billed while
          ADMITTED (forward-looking projection of all 10 days) yields subtotal 150000, while the
          same period generated after a 2026-06-05 discharge (chronological replay of the actual
          stay, discharge day included) yields 75000 — the two variants of the occupancy-window
          calculation diverge on the Invoice entity.
        test_recipe:
          setup:
            - "Licensed home (capacity 4) with one AVAILABLE bed and one ACTIVE caregiver"
            - "PRIVATE_PAY rate schedule: R&B 12000, add-ons 3000/6000/9000, effective_from 2026-06-01, open-ended"
            - "PRIVATE_PAY resident, assessment adl=2 hrs=4 (band LOW), admitted 2026-06-01T14:00:00Z"
            - "Logical clock at 2026-06-02T00:00:00Z when the provisional invoice is generated"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: Provider
            - call: "POST /api/homes"
              payload: { license_number: "AFH-1001", name: "Maple AFH", licensed_bed_capacity: 4 }
              as: Provider
              captures: { home_id: $.data.id }
            - call: "POST /api/homes/${home_id}/beds"
              payload: { label: "1A" }
              as: Provider
              captures: { bed_id: $.data.id, bed_v: $.data.version }
            - call: "POST /api/homes/${home_id}/caregivers"
              payload: { full_name: "Carol A", credential_id: "HCA-100", awake_overnight_qualified: true }
              as: Provider
            - call: "POST /api/homes/${home_id}/license"
              payload: {}
              as: Provider
            - call: "POST /api/homes/${home_id}/rate-schedules"
              payload: { payer_type: "PRIVATE_PAY", room_and_board_daily_cents: 12000, care_low_daily_cents: 3000, care_medium_daily_cents: 6000, care_high_daily_cents: 9000, effective_from: "2026-06-01" }
              as: Provider
            - call: "POST /api/homes/${home_id}/residents"
              payload: { full_name: "Res One", date_of_birth: "1940-01-01", payer_type: "PRIVATE_PAY" }
              as: Nurse
              captures: { res_id: $.data.id }
            - call: "POST /api/residents/${res_id}/assessments"
              payload: { nursing_hours_per_week: 4, adl_dependency_score: 2, care_plan: { diet: "REGULAR", mobility: "WALKER", medication_assistance: "FULL" } }
              as: Nurse
              captures: { asm_id: $.data.id }
            - call: "POST /api/assessments/${asm_id}/finalize"
              payload: {}
              as: Nurse
            - call: "POST /api/admissions"
              payload: { resident_id: "${res_id}", bed_id: "${bed_id}", assessment_id: "${asm_id}", expected_admission_date: "2026-06-01", expected_bed_version: "${bed_v}" }
              as: Provider
              as_user_id: "prov-1"
              captures: { adm_id: $.data.id }
            - call: "POST /api/admissions/${adm_id}/approve"
              payload: {}
              as: Provider
              as_user_id: "prov-2"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T14:00:00Z" }
              as: Provider
            - call: "POST /api/admissions/${adm_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "prov-2"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: Provider
            - call: "GET /api/residents/${res_id}"
              payload: {}
              as: Provider
              captures: { res_v: $.data.version }
            - call: "POST /api/residents/${res_id}/invoices/generate"
              payload: { period_start: "2026-06-01", period_end: "2026-06-11", due_date: "2026-06-20", expected_resident_version: "${res_v}" }
              as: Provider
              captures: { inv_prov: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T09:00:00Z" }
              as: Provider
            - call: "POST /api/residents/${res_id}/discharge"
              payload: { reason: "VOLUNTARY", notice_days: 30 }
              as: Provider
            - call: "GET /api/residents/${res_id}"
              payload: {}
              as: Provider
              captures: { res_v2: $.data.version }
          trigger:
            - call: "POST /api/residents/${res_id}/invoices/generate"
              payload: { period_start: "2026-06-01", period_end: "2026-06-11", due_date: "2026-06-20", expected_resident_version: "${res_v2}" }
              as: Provider
              captures: { inv_final: $.data.id }
          assert:
            - "Invoice.${inv_prov}.subtotal_cents == 150000 (10 projected days x 15000)"
            - "Invoice.${inv_final}.subtotal_cents == 75000 (5 elapsed days 06-01..06-05 x 15000)"
            - "Invoice.${inv_final}.payer_type_snapshot == PRIVATE_PAY"

      - name: medicaid_vs_private_pay_variant_on_assessment_pricing
        grounds:
          - calculations.medicaid_acuity_rate
          - entities.RateSchedule.fields.payer_type
          - entities.Assessment.fields.nursing_hours_per_week
        distinguishing_aspect: |
          Assessment/RateSchedule-domain dual variant: with identical band inputs (LOW: adl=2,
          hrs=4) and identical schedule amounts, the medicaid variant adds the capped prorated
          nursing_component (trunc(4*1500/7)=857 cents/day) while the private_pay variant skips
          it — 5-day final invoices diverge 79285 vs 75000, a per-payer variant split on the
          pricing domain rather than on the invoice-window domain.
        test_recipe:
          setup:
            - "Licensed home (capacity 4) with TWO beds: bed1 medicaid_certified=true, bed2 plain"
            - "PRIVATE_PAY and MEDICAID rate schedules with identical amounts (12000/3000/6000/9000, effective_from 2026-06-01)"
            - "Two residents, identical assessments (adl=2, hrs=4, band LOW): res_mc MEDICAID in bed1, res_pp PRIVATE_PAY in bed2; both admitted 2026-06-01T14:00:00Z, both discharged 2026-06-05T09:00:00Z"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: Provider
            - call: "POST /api/homes"
              payload: { license_number: "AFH-1002", name: "Cedar AFH", licensed_bed_capacity: 4 }
              as: Provider
              captures: { home_id: $.data.id }
            - call: "POST /api/homes/${home_id}/beds"
              payload: { label: "1A", medicaid_certified: true }
              as: Provider
              captures: { bed1_id: $.data.id, bed1_v: $.data.version }
            - call: "POST /api/homes/${home_id}/beds"
              payload: { label: "1B" }
              as: Provider
              captures: { bed2_id: $.data.id, bed2_v: $.data.version }
            - call: "POST /api/homes/${home_id}/caregivers"
              payload: { full_name: "Carol B", credential_id: "HCA-200", awake_overnight_qualified: true }
              as: Provider
            - call: "POST /api/homes/${home_id}/license"
              payload: {}
              as: Provider
            - call: "POST /api/homes/${home_id}/rate-schedules"
              payload: { payer_type: "PRIVATE_PAY", room_and_board_daily_cents: 12000, care_low_daily_cents: 3000, care_medium_daily_cents: 6000, care_high_daily_cents: 9000, effective_from: "2026-06-01" }
              as: Provider
            - call: "POST /api/homes/${home_id}/rate-schedules"
              payload: { payer_type: "MEDICAID", room_and_board_daily_cents: 12000, care_low_daily_cents: 3000, care_medium_daily_cents: 6000, care_high_daily_cents: 9000, effective_from: "2026-06-01" }
              as: Provider
            - call: "POST /api/homes/${home_id}/residents"
              payload: { full_name: "Res MC", date_of_birth: "1938-05-05", payer_type: "MEDICAID" }
              as: Nurse
              captures: { res_mc: $.data.id }
            - call: "POST /api/homes/${home_id}/residents"
              payload: { full_name: "Res PP", date_of_birth: "1941-03-03", payer_type: "PRIVATE_PAY" }
              as: Nurse
              captures: { res_pp: $.data.id }
            - call: "POST /api/residents/${res_mc}/assessments"
              payload: { nursing_hours_per_week: 4, adl_dependency_score: 2, care_plan: { diet: "REGULAR" } }
              as: Nurse
              captures: { asm_mc: $.data.id }
            - call: "POST /api/residents/${res_pp}/assessments"
              payload: { nursing_hours_per_week: 4, adl_dependency_score: 2, care_plan: { diet: "REGULAR" } }
              as: Nurse
              captures: { asm_pp: $.data.id }
            - call: "POST /api/assessments/${asm_mc}/finalize"
              payload: {}
              as: Nurse
            - call: "POST /api/assessments/${asm_pp}/finalize"
              payload: {}
              as: Nurse
            - call: "POST /api/admissions"
              payload: { resident_id: "${res_mc}", bed_id: "${bed1_id}", assessment_id: "${asm_mc}", expected_admission_date: "2026-06-01", expected_bed_version: "${bed1_v}" }
              as: Provider
              as_user_id: "prov-1"
              captures: { adm_mc: $.data.id }
            - call: "POST /api/admissions"
              payload: { resident_id: "${res_pp}", bed_id: "${bed2_id}", assessment_id: "${asm_pp}", expected_admission_date: "2026-06-01", expected_bed_version: "${bed2_v}" }
              as: Provider
              as_user_id: "prov-1"
              captures: { adm_pp: $.data.id }
            - call: "POST /api/admissions/${adm_mc}/approve"
              payload: {}
              as: Provider
              as_user_id: "prov-2"
            - call: "POST /api/admissions/${adm_pp}/approve"
              payload: {}
              as: Provider
              as_user_id: "prov-2"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T14:00:00Z" }
              as: Provider
            - call: "POST /api/admissions/${adm_mc}/complete"
              payload: {}
              as: Provider
              as_user_id: "prov-2"
            - call: "POST /api/admissions/${adm_pp}/complete"
              payload: {}
              as: Provider
              as_user_id: "prov-2"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T09:00:00Z" }
              as: Provider
            - call: "POST /api/residents/${res_mc}/discharge"
              payload: { reason: "VOLUNTARY", notice_days: 30 }
              as: Provider
            - call: "POST /api/residents/${res_pp}/discharge"
              payload: { reason: "VOLUNTARY", notice_days: 30 }
              as: Provider
            - call: "GET /api/residents/${res_mc}"
              payload: {}
              as: Provider
              captures: { res_mc_v: $.data.version }
            - call: "GET /api/residents/${res_pp}"
              payload: {}
              as: Provider
              captures: { res_pp_v: $.data.version }
          trigger:
            - call: "POST /api/residents/${res_mc}/invoices/generate"
              payload: { period_start: "2026-06-01", period_end: "2026-06-11", due_date: "2026-06-20", expected_resident_version: "${res_mc_v}" }
              as: Provider
              captures: { inv_mc: $.data.id }
            - call: "POST /api/residents/${res_pp}/invoices/generate"
              payload: { period_start: "2026-06-01", period_end: "2026-06-11", due_date: "2026-06-20", expected_resident_version: "${res_pp_v}" }
              as: Provider
              captures: { inv_pp: $.data.id }
          assert:
            - "Invoice.${inv_mc}.subtotal_cents == 79285 (5 days x 15857 medicaid daily)"
            - "Invoice.${inv_pp}.subtotal_cents == 75000 (5 days x 15000 private daily)"
            - "Invoice.${inv_mc}.payer_type_snapshot == MEDICAID"
            - "Invoice.${inv_mc}.subtotal_cents - Invoice.${inv_pp}.subtotal_cents == 4285 (5 x 857 nursing_component)"

  # =========================================================================
  # Rule 2 — combinatorial_formula (two different modes: (a) and (b))
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: medicaid_acuity_rate_three_input_nonlinear
        grounds:
          - calculations.medicaid_acuity_rate
          - entities.Assessment.fields.adl_dependency_score
        distinguishing_aspect: |
          Mode (a) combinatorial: the medicaid daily rate combines 3+ inputs (R&B floor, band
          add-on branch on adl/hours, and min-capped prorated nursing hours) with non-linear
          interaction — raising hours 4->10 inside MEDIUM moves the daily rate only 428 cents
          (nursing capped at 9000/week) while flipping the band LOW->MEDIUM moves it 3000 cents.
        test_recipe:
          setup:
            - "Licensed home (capacity 6) with two medicaid-certified beds"
            - "MEDICAID rate schedule 12000/3000/6000/9000 effective 2026-06-01 open-ended"
            - "resA: assessment adl=3 hrs=10 (MEDIUM, nursing capped); resB: assessment adl=2 hrs=4 (LOW); both admitted 2026-06-01T14:00:00Z and discharged 2026-06-05T09:00:00Z (5 chargeable days each)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: Provider
            - call: "POST /api/homes"
              payload: { license_number: "AFH-2001", name: "Birch AFH", licensed_bed_capacity: 6 }
              as: Provider
              captures: { home_id: $.data.id }
            - call: "POST /api/homes/${home_id}/beds"
              payload: { label: "A", medicaid_certified: true }
              as: Provider
              captures: { bedA: $.data.id, bedA_v: $.data.version }
            - call: "POST /api/homes/${home_id}/beds"
              payload: { label: "B", medicaid_certified: true }
              as: Provider
              captures: { bedB: $.data.id, bedB_v: $.data.version }
            - call: "POST /api/homes/${home_id}/caregivers"
              payload: { full_name: "Nurse Aid", credential_id: "HCA-300" }
              as: Provider
            - call: "POST /api/homes/${home_id}/license"
              payload: {}
              as: Provider
            - call: "POST /api/homes/${home_id}/rate-schedules"
              payload: { payer_type: "MEDICAID", room_and_board_daily_cents: 12000, care_low_daily_cents: 3000, care_medium_daily_cents: 6000, care_high_daily_cents: 9000, effective_from: "2026-06-01" }
              as: Provider
            - call: "POST /api/homes/${home_id}/residents"
              payload: { full_name: "Res A", date_of_birth: "1935-01-01", payer_type: "MEDICAID" }
              as: Nurse
              captures: { resA: $.data.id }
            - call: "POST /api/homes/${home_id}/residents"
              payload: { full_name: "Res B", date_of_birth: "1936-02-02", payer_type: "MEDICAID" }
              as: Nurse
              captures: { resB: $.data.id }
            - call: "POST /api/residents/${resA}/assessments"
              payload: { nursing_hours_per_week: 10, adl_dependency_score: 3, care_plan: { diet: "DIABETIC" } }
              as: Nurse
              captures: { asmA: $.data.id }
            - call: "POST /api/residents/${resB}/assessments"
              payload: { nursing_hours_per_week: 4, adl_dependency_score: 2, care_plan: { diet: "REGULAR" } }
              as: Nurse
              captures: { asmB: $.data.id }
            - call: "POST /api/assessments/${asmA}/finalize"
              payload: {}
              as: Nurse
            - call: "POST /api/assessments/${asmB}/finalize"
              payload: {}
              as: Nurse
            - call: "POST /api/admissions"
              payload: { resident_id: "${resA}", bed_id: "${bedA}", assessment_id: "${asmA}", expected_admission_date: "2026-06-01", expected_bed_version: "${bedA_v}" }
              as: Provider
              as_user_id: "prov-1"
              captures: { admA: $.data.id }
            - call: "POST /api/admissions"
              payload: { resident_id: "${resB}", bed_id: "${bedB}", assessment_id: "${asmB}", expected_admission_date: "2026-06-01", expected_bed_version: "${bedB_v}" }
              as: Provider
              as_user_id: "prov-1"
              captures: { admB: $.data.id }
            - call: "POST /api/admissions/${admA}/approve"
              payload: {}
              as: Provider
              as_user_id: "prov-2"
            - call: "POST /api/admissions/${admB}/approve"
              payload: {}
              as: Provider
              as_user_id: "prov-2"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T14:00:00Z" }
              as: Provider
            - call: "POST /api/admissions/${admA}/complete"
              payload: {}
              as: Provider
              as_user_id: "prov-2"
            - call: "POST /api/admissions/${admB}/complete"
              payload: {}
              as: Provider
              as_user_id: "prov-2"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T09:00:00Z" }
              as: Provider
            - call: "POST /api/residents/${resA}/discharge"
              payload: { reason: "HOSPITALIZATION", notice_days: 0 }
              as: Provider
            - call: "POST /api/residents/${resB}/discharge"
              payload: { reason: "HOSPITALIZATION", notice_days: 0 }
              as: Provider
            - call: "GET /api/residents/${resA}"
              payload: {}
              as: Provider
              captures: { resA_v: $.data.version }
            - call: "GET /api/residents/${resB}"
              payload: {}
              as: Provider
              captures: { resB_v: $.data.version }
          trigger:
            - call: "POST /api/residents/${resA}/invoices/generate"
              payload: { period_start: "2026-06-01", period_end: "2026-06-11", due_date: "2026-06-20", expected_resident_version: "${resA_v}" }
              as: Provider
              captures: { invA: $.data.id }
            - call: "POST /api/residents/${resB}/invoices/generate"
              payload: { period_start: "2026-06-01", period_end: "2026-06-11", due_date: "2026-06-20", expected_resident_version: "${resB_v}" }
              as: Provider
              captures: { invB: $.data.id }
          assert:
            - "Invoice.${invA}.subtotal_cents == 96425 (5 x 19285: 12000 + 6000 MEDIUM + trunc(min(10*1500,9000)/7)=1285)"
            - "Invoice.${invB}.subtotal_cents == 79285 (5 x 15857: 12000 + 3000 LOW + trunc(6000/7)=857)"
            - "Invoice.${invA}.subtotal_cents - Invoice.${invB}.subtotal_cents == 17140 (band jump 3000 dominates capped nursing delta 428 per day)"

      - name: invoice_line_rounding_order_per_line_then_sum
        grounds:
          - calculations.invoice_window_provisional
          - calculations.medicaid_acuity_rate
        distinguishing_aspect: |
          Mode (b) combinatorial: nested rounding order is pinned as 'truncate the nursing
          component per day-line, then sum integer lines'. A 7-day medicaid LOW provisional
          invoice yields 110999; summing unrounded daily rates first would yield 111000 —
          the scaffold's pinned order provably differs by 1 cent on identical inputs.
        test_recipe:
          setup:
            - "Licensed home (capacity 4), medicaid-certified bed, MEDICAID schedule 12000/3000/6000/9000 effective 2026-06-01"
            - "MEDICAID resident, assessment adl=2 hrs=4 (LOW), admitted 2026-06-01T14:00:00Z, still ADMITTED at generation time"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: Provider
            - call: "POST /api/homes"
              payload: { license_number: "AFH-2002", name: "Fir AFH", licensed_bed_capacity: 4 }
              as: Provider
              captures: { home_id: $.data.id }
            - call: "POST /api/homes/${home_id}/beds"
              payload: { label: "1A", medicaid_certified: true }
              as: Provider
              captures: { bed_id: $.data.id, bed_v: $.data.version }
            - call: "POST /api/homes/${home_id}/caregivers"
              payload: { full_name: "Cg One", credential_id: "HCA-301" }
              as: Provider
            - call: "POST /api/homes/${home_id}/license"
              payload: {}
              as: Provider
            - call: "POST /api/homes/${home_id}/rate-schedules"
              payload: { payer_type: "MEDICAID", room_and_board_daily_cents: 12000, care_low_daily_cents: 3000, care_medium_daily_cents: 6000, care_high_daily_cents: 9000, effective_from: "2026-06-01" }
              as: Provider
            - call: "POST /api/homes/${home_id}/residents"
              payload: { full_name: "Res Seven", date_of_birth: "1942-07-07", payer_type: "MEDICAID" }
              as: Nurse
              captures: { res_id: $.data.id }
            - call: "POST /api/residents/${res_id}/assessments"
              payload: { nursing_hours_per_week: 4, adl_dependency_score: 2, care_plan: { diet: "REGULAR" } }
              as: Nurse
              captures: { asm_id: $.data.id }
            - call: "POST /api/assessments/${asm_id}/finalize"
              payload: {}
              as: Nurse
            - call: "POST /api/admissions"
              payload: { resident_id: "${res_id}", bed_id: "${bed_id}", assessment_id: "${asm_id}", expected_admission_date: "2026-06-01", expected_bed_version: "${bed_v}" }
              as: Provider
              as_user_id: "prov-1"
              captures: { adm_id: $.data.id }
            - call: "POST /api/admissions/${adm_id}/approve"
              payload: {}
              as: Provider
              as_user_id: "prov-2"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T14:00:00Z" }
              as: Provider
            - call: "POST /api/admissions/${adm_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "prov-2"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: Provider
            - call: "GET /api/residents/${res_id}"
              payload: {}
              as: Provider
              captures: { res_v: $.data.version }
          trigger:
            - call: "POST /api/residents/${res_id}/invoices/generate"
              payload: { period_start: "2026-06-01", period_end: "2026-06-08", due_date: "2026-06-20", expected_resident_version: "${res_v}" }
              as: Provider
              captures: { inv7: $.data.id }
          assert:
            - "Invoice.${inv7}.subtotal_cents == 110999 (7 x 15857 per-line truncation)"
            - "Invoice.${inv7}.subtotal_cents != 111000 (sum-then-round alternative is rejected)"
            - "Invoice.${inv7}.status == DRAFT"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (cycle on two different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: incident_reopen_cycle_under_review_to_reported
        grounds:
          - state_machines.Incident.UNDER_REVIEW_to_REPORTED
          - state_machines.Incident.REPORTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          Cyclic machine on Incident: REPORTED -> UNDER_REVIEW -> REPORTED -> UNDER_REVIEW is a
          legal loop (reopen for additional findings) with the linked ComplianceCase pinned OPEN
          across the cycle — a non-linear revision loop, not a forward-only pipeline.
        test_recipe:
          setup:
            - "Licensed home with one ADMITTED resident"
            - "MAJOR incident occurred 2026-06-02T10:00:00Z, filed when clock reads 2026-06-02T20:00:00Z (within 24h), case opened"
