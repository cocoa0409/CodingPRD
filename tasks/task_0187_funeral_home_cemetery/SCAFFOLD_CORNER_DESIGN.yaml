        test_recipe:
          setup: ["PRENEED home state_trust_pct=0.90, admin_retention=0; one trustable SERVICE line 100000 SELECTED => trust_required 90000, contract_amount 100000; deposits 88000 PRINCIPAL + 30000 EARNINGS."]
