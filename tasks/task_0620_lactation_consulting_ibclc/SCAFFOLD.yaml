# =============================================================================
# PRD Benchmark Scaffold — Lactation Consulting & Breastfeeding Support (IBCLC)
# Difficulty band: Expert
# =============================================================================

scenario: |
  620. Lactation Consulting & Breastfeeding Support (IBCLC): consult type
  (prenatal/in-home/telehealth) & scheduling, intake & feeding assessment,
  superbill & insurance (ACA preventive) reimbursement, breast-pump DME
  qualification, follow-up plan & weighted feeds, package & sliding scale,
  pediatrician referral, no-show

domain_name: lactation-consulting-ibclc
api_prefix: ""
# Flat topology: peer resources live at top-level collection paths (/clients, /consults,
# /superbills, ...) rather than nested under /practices/{id}. api_prefix is empty so every
# entity's collection segment is its top-level path segment.

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities under a single Practice root, linked by foreign keys; FK
  # children are discovered via filtered-list GETs (e.g. GET /consults?client_id=).
  # No deep nested URL chains beyond /practices/{id}.

  state_machine_shape: cyclic
  # Consult carries a reschedule loop (SCHEDULED -> RESCHEDULED -> SCHEDULED) and a
  # no-show branch; Superbill carries a deny -> resubmit loop. Not a linear pipeline.

  relationship_patterns:
    - one_to_many        # Client has many Consults; Consult has many WeightedFeeds
    - cross_aggregate    # Superbill -> ReimbursementLedger on Client; DMEQualification -> Consult

  role_model: peer_roles
  # Consultant (IBCLC) owns clinical lifecycle; BillingSpecialist owns superbills &
  # reimbursement; FrontDesk owns scheduling/no-show; PracticeAdmin configures plans.
  # Client is an entity_backed self-service role with narrow rights.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Practice
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Practice / clinic name" }
      - { name: aca_preventive_enabled, type: boolean, source: input, default: true, description: "When true, claims flagged as ACA preventive are reimbursed at 100% with zero patient responsibility" }
      - { name: now_utc, type: datetime, source: system, default: "2026-01-01T00:00:00Z", description: "Logical clock for this practice; defaults to 2026-01-01T00:00:00Z until set via /_clock/set_current_utc" }

  - name: SlidingScaleTier
    parent: null
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id" }
      - { name: name, type: string, source: input, description: "Tier label (e.g. TIER_A)" }
      - { name: income_ceiling_cents, type: integer, source: input, description: "Inclusive upper bound of annual household income (cents) that qualifies for this tier; the tier applies when household_income_cents <= income_ceiling_cents" }
      - { name: discount_pct, type: integer, source: input, description: "Whole-number percent (0..100) discounted off the standard consult rate for clients in this tier" }

  - name: ServicePackage
    parent: null
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id" }
      - { name: name, type: string, source: input, description: "Package label (e.g. THREE_VISIT_BUNDLE)" }
      - { name: included_visits, type: integer, source: input, description: "Number of prepaid consult credits granted on purchase (>= 1)" }
      - { name: price_cents, type: integer, source: input, description: "Flat package price in cents" }
      - { name: per_visit_value_cents, type: integer, source: computed, description: "= floor(price_cents / included_visits); the credit value redeemed per consult" }

  - name: Consultant
    parent: null
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id" }
      - { name: full_name, type: string, source: input, description: "IBCLC consultant name" }
      - { name: standard_rate_cents, type: integer, source: input, description: "Standard self-pay consult rate before sliding scale / package" }
      - { name: travel_buffer_minutes, type: integer, source: input, default: 60, description: "Minutes of travel buffer required before and after an IN_HOME consult on this consultant's calendar" }

  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id" }
      - { name: full_name, type: string, source: input, description: "Parent/caregiver name" }
      - { name: infant_dob, type: datetime, source: input, description: "Infant date of birth (ISO 8601)" }
      - { name: household_income_cents, type: integer, source: input, description: "Annual household income in cents; drives sliding-scale tier selection" }
      - { name: package_id, type: string, source: input, required: false, description: "FK -> ServicePackage.id; the purchased package whose credits this client redeems, null if self-pay only" }
      - { name: package_credits_total, type: integer, source: computed, default: 0, description: "Total prepaid credits granted = ServicePackage.included_visits at purchase, else 0" }
      - { name: package_credits_consumed, type: integer, source: computed, default: 0, description: "Credits redeemed by COMPLETED or in-flight consults" }
      - { name: package_credits_remaining, type: integer, source: computed, default: 0, description: "= package_credits_total - package_credits_consumed; never negative" }
      - { name: reimbursement_ledger_cents, type: integer, source: computed, default: 0, description: "Sum of reimbursed_amount_cents across this client's superbills in PAID status; reversed when a paid superbill is voided" }
      - { name: no_show_strikes, type: integer, source: computed, default: 0, description: "Count of consults that reached NO_SHOW for this client" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED — SUSPENDED when no_show_strikes >= NO_SHOW_SUSPEND_THRESHOLD" }

  - name: Consult
    parent: null
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: consultant_id, type: string, source: input, description: "FK -> Consultant.id" }
      - { name: consult_type, type: enum, source: input, description: "PRENATAL | IN_HOME | TELEHEALTH" }
      - { name: scheduled_start_utc, type: datetime, source: input, description: "Appointment start (ISO 8601, UTC)" }
      - { name: scheduled_end_utc, type: datetime, source: input, description: "Appointment end (ISO 8601, UTC); must be strictly after scheduled_start_utc" }
      - { name: pay_method, type: enum, source: input, description: "SELF_PAY | PACKAGE — PACKAGE redeems a client credit, SELF_PAY applies sliding scale" }
      - { name: fee_cents, type: integer, source: computed, default: 0, description: "Patient charge for this consult; sliding-scale discounted rate for SELF_PAY, 0 for PACKAGE (credit redeemed)" }
      - { name: package_credit_redeemed, type: boolean, source: computed, default: false, description: "True when a package credit was consumed for this consult" }
      - { name: reschedule_count, type: integer, source: computed, default: 0, description: "Number of times this consult has been rescheduled" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED -> RESCHEDULED -> SCHEDULED (loop) | IN_PROGRESS | COMPLETED | CANCELLED | NO_SHOW" }

  - name: FeedingAssessment
    parent: null
    common_fields: false
    fields:
      - { name: consult_id, type: string, source: input, description: "FK -> Consult.id" }
      - { name: latch_score, type: integer, source: input, description: "LATCH assessment score 0..10" }
      - { name: pre_feed_weight_grams, type: integer, source: input, description: "Infant weight before feed in grams (> 0)" }
      - { name: post_feed_weight_grams, type: integer, source: input, description: "Infant weight after feed in grams (>= pre_feed_weight_grams)" }
      - { name: notes, type: string, source: input, required: false, description: "Free-text clinical notes" }

  - name: WeightedFeed
    parent: null
    common_fields: false
    fields:
      - { name: follow_up_plan_id, type: string, source: input, description: "FK -> FollowUpPlan.id" }
      - { name: pre_feed_weight_grams, type: integer, source: input, description: "Infant weight before the feed in grams (> 0)" }
      - { name: post_feed_weight_grams, type: integer, source: input, description: "Infant weight after the feed in grams (>= pre_feed_weight_grams)" }
      - { name: transfer_grams, type: integer, source: computed, description: "= post_feed_weight_grams - pre_feed_weight_grams; milk transferred this feed (1 gram = 1 mL)" }

  - name: FollowUpPlan
    parent: null
    common_fields: true
    fields:
      - { name: consult_id, type: string, source: input, description: "FK -> Consult.id; the COMPLETED consult this plan follows from" }
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; copied from the parent consult" }
      - { name: target_daily_transfer_grams, type: integer, source: input, description: "Goal total milk transfer per day in grams (> 0)" }
      - { name: avg_transfer_grams, type: integer, source: computed, default: 0, description: "Mean per-feed transfer over this plan's WeightedFeeds, rounded half-up; 0 when no feeds recorded" }
      - { name: total_transfer_grams, type: integer, source: computed, default: 0, description: "Sum of transfer_grams across this plan's WeightedFeeds" }
      - { name: meets_target, type: boolean, source: computed, default: false, description: "True when total_transfer_grams >= target_daily_transfer_grams" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CLOSED — CLOSED locks WeightedFeed entry" }

  - name: Superbill
    parent: null
    common_fields: true
    fields:
      - { name: consult_id, type: string, source: input, description: "FK -> Consult.id; the COMPLETED consult being billed" }
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; copied from the consult" }
      - { name: billed_amount_cents, type: integer, source: input, description: "Provider's billed charge submitted to insurer (cents)" }
      - { name: allowed_amount_cents, type: integer, source: input, description: "Insurer's allowed amount for the CPT code (cents); reimbursement is computed against this, not billed_amount_cents" }
      - { name: is_aca_preventive, type: boolean, source: input, default: false, description: "True when the consult is billed under ACA preventive lactation benefit (no cost share)" }
      - { name: deductible_remaining_cents, type: integer, source: input, default: 0, description: "Client's remaining deductible at submission (cents); ignored when is_aca_preventive is true" }
      - { name: coinsurance_pct, type: integer, source: input, default: 0, description: "Client coinsurance percent 0..100 applied after deductible; ignored when is_aca_preventive is true" }
      - { name: reimbursed_amount_cents, type: integer, source: computed, default: 0, description: "Insurer reimbursement computed at PAID; ACA-preventive = full allowed_amount, otherwise allowed minus deductible-and-coinsurance patient responsibility" }
      - { name: patient_responsibility_cents, type: integer, source: computed, default: 0, description: "= allowed_amount_cents - reimbursed_amount_cents; 0 when is_aca_preventive" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> SUBMITTED -> PAID | DENIED; DENIED -> SUBMITTED (resubmit loop); PAID -> VOID" }

  - name: DMEQualification
    parent: null
    common_fields: true
    fields:
      - { name: consult_id, type: string, source: input, description: "FK -> Consult.id; the COMPLETED consult establishing medical necessity" }
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; copied from the consult" }
      - { name: requested_utc, type: datetime, source: system, description: "Logical-clock timestamp when qualification was requested" }
      - { name: pump_type, type: enum, source: input, description: "STANDARD_ELECTRIC | HOSPITAL_GRADE" }
      - { name: qualified, type: boolean, source: computed, default: false, description: "True when the qualification window rule passed (request within DME_WINDOW_DAYS of infant DOB for STANDARD_ELECTRIC; any time for HOSPITAL_GRADE with a COMPLETED consult)" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING -> QUALIFIED | DENIED" }

  - name: PediatricianReferral
    parent: null
    common_fields: true
    fields:
      - { name: consult_id, type: string, source: input, description: "FK -> Consult.id; the consult that prompted the referral" }
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; copied from the consult" }
      - { name: reason, type: enum, source: input, description: "WEIGHT_CONCERN | TONGUE_TIE | JAUNDICE | OTHER" }
      - { name: pediatrician_name, type: string, source: input, description: "Receiving pediatrician name" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> ACKNOWLEDGED | CANCELLED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Consult
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: RESCHEDULED
        trigger: "POST /consults/{id}/reschedule"
        actor: FrontDesk
        preconditions:
          - "Consult.status == SCHEDULED (ERR_CONSULT_NOT_SCHEDULED)"
          - "Client.status == ACTIVE (ERR_CLIENT_SUSPENDED)"
          - "New buffer-padded interval does not overlap any non-terminal consult on the same consultant (ERR_CONSULTANT_DOUBLE_BOOKED)"
          - "New bare interval does not overlap any non-terminal consult for the same client (ERR_CLIENT_DOUBLE_BOOKED)"
        side_effects:
          - "scheduled_start_utc / scheduled_end_utc replaced with new values"
          - "reschedule_count += 1"
        note: "Reschedule is a holding state; immediately re-confirmed back to SCHEDULED in same request."

      - from: RESCHEDULED
        to: SCHEDULED
        trigger: "system (auto-confirm within the same reschedule request)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Completes the cyclic SCHEDULED -> RESCHEDULED -> SCHEDULED loop."

      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /consults/{id}/start"
        actor: Consultant
        preconditions:
          - "Consult.status == SCHEDULED (ERR_CONSULT_NOT_SCHEDULED)"
          - "Practice.now_utc >= scheduled_start_utc (ERR_CONSULT_NOT_STARTABLE)"
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /consults/{id}/complete"
        actor: Consultant
        preconditions:
          - "Consult.status == IN_PROGRESS (ERR_CONSULT_NOT_IN_PROGRESS)"
          - "A FeedingAssessment exists for this consult (ERR_NO_FEEDING_ASSESSMENT)"
        side_effects:
          - "If pay_method == PACKAGE: package_credit_redeemed set true and Client.package_credits_consumed += 1 (credit committed); Client.package_credits_remaining recomputed"
          - "Consult becomes eligible for Superbill, DMEQualification, FollowUpPlan, PediatricianReferral creation"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /consults/{id}/no-show"
        actor: FrontDesk
        preconditions:
          - "Consult.status == SCHEDULED (ERR_CONSULT_NOT_SCHEDULED)"
          - "Practice.now_utc >= scheduled_start_utc (ERR_CONSULT_NOT_STARTABLE)"
        side_effects:
          - "CASCADE step 1: Client.no_show_strikes += 1 (mutation on Client caused by this transition)"
          - "If this consult had a committed package credit: Client.package_credits_consumed -= 1 (credit returned, never below 0)"
          - "CASCADE step 2: the incremented strike count crossing NO_SHOW_SUSPEND_THRESHOLD (>=3) sets Client.status -> SUSPENDED (caused by step 1, not by the no-show directly)"
          - "CASCADE step 3: the SUSPENDED transition auto-cancels every OTHER SCHEDULED consult of that client; each auto-cancel returns its committed package credit (Client.package_credits_consumed -= 1 per credited consult) (caused by step 2)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /consults/{id}/cancel"
        actor: FrontDesk
        preconditions:
          - "Consult.status == SCHEDULED (ERR_CONSULT_NOT_CANCELLABLE)"
        side_effects:
          - "If pay_method == PACKAGE and package_credit_redeemed: Client.package_credits_consumed -= 1 (credit returned, never below 0); Client.package_credits_remaining recomputed"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (auto-cancel when the owning client is SUSPENDED by a no-show cascade)"
        actor: system
        preconditions:
          - "Consult.status == SCHEDULED"
          - "Owning Client just transitioned to SUSPENDED"
        side_effects:
          - "If this consult had a committed package credit: Client.package_credits_consumed -= 1 (credit returned, never below 0)"
        note: "Tail hop of the no-show suspension cascade (cascade step 3)."

  - entity: Superbill
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /superbills/{id}/submit"
        actor: BillingSpecialist
        preconditions:
          - "Superbill.status == DRAFT (ERR_SUPERBILL_NOT_SUBMITTABLE)"
          - "Parent Consult.status == COMPLETED (ERR_CONSULT_NOT_COMPLETED)"
        side_effects: []

      - from: SUBMITTED
        to: PAID
        trigger: "POST /superbills/{id}/adjudicate"
        actor: BillingSpecialist
        preconditions:
          - "Superbill.status == SUBMITTED (ERR_SUPERBILL_NOT_SUBMITTED)"
          - "outcome == PAID"
        side_effects:
          - "reimbursed_amount_cents and patient_responsibility_cents computed via reimbursement_amount calc (CASCADE step 2 from consult completion chain)"
          - "Client.reimbursement_ledger_cents += reimbursed_amount_cents (CASCADE step 3)"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /superbills/{id}/adjudicate"
        actor: BillingSpecialist
        preconditions:
          - "Superbill.status == SUBMITTED (ERR_SUPERBILL_NOT_SUBMITTED)"
          - "outcome == DENIED"
        side_effects:
          - "reimbursed_amount_cents set 0; patient_responsibility_cents set allowed_amount_cents"

      - from: DENIED
        to: SUBMITTED
        trigger: "POST /superbills/{id}/submit"
        actor: BillingSpecialist
        preconditions:
          - "Superbill.status == DENIED (ERR_SUPERBILL_NOT_SUBMITTABLE)"
          - "Parent Consult.status == COMPLETED (ERR_CONSULT_NOT_COMPLETED)"
        side_effects: []
        note: "Resubmit loop after a denial; completes the cyclic DENIED -> SUBMITTED branch."

      - from: PAID
        to: VOID
        trigger: "POST /superbills/{id}/void"
        actor: BillingSpecialist
        preconditions:
          - "Superbill.status == PAID (ERR_SUPERBILL_NOT_VOIDABLE)"
          - "Client.expected_client_version matches Client.version (OCC; ERR_STALE_CLIENT_VERSION)"
        side_effects:
          - "Client.reimbursement_ledger_cents -= reimbursed_amount_cents (compensating reversal; ledger returns to pre-payment value)"
          - "increments Client.version by 1"

  - entity: DMEQualification
    initial_state: PENDING
    terminal_states: [QUALIFIED, DENIED]
    transitions:
      - from: PENDING
        to: QUALIFIED
        trigger: "POST /dme-qualifications/{id}/adjudicate"
        actor: BillingSpecialist
        preconditions:
          - "DMEQualification.status == PENDING (ERR_DME_NOT_PENDING)"
          - "qualified == true (computed from dme_qualification_window calc) (ERR_DME_WINDOW_NOT_MET)"
        side_effects:
          - "status -> QUALIFIED"

      - from: PENDING
        to: DENIED
        trigger: "POST /dme-qualifications/{id}/adjudicate"
        actor: BillingSpecialist
        preconditions:
          - "DMEQualification.status == PENDING (ERR_DME_NOT_PENDING)"
          - "qualified == false"
        side_effects:
          - "status -> DENIED"

  - entity: FollowUpPlan
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /follow-up-plans/{id}/close"
        actor: Consultant
        preconditions:
          - "FollowUpPlan.status == OPEN (ERR_PLAN_NOT_OPEN)"
        side_effects:
          - "WeightedFeed entry locked (further POST /weighted-feeds rejected with ERR_PLAN_CLOSED)"

  - entity: PediatricianReferral
    initial_state: OPEN
    terminal_states: [ACKNOWLEDGED, CANCELLED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /pediatrician-referrals/{id}/acknowledge"
        actor: Consultant
        preconditions:
          - "PediatricianReferral.status == OPEN (ERR_REFERRAL_NOT_OPEN)"
        side_effects: []

      - from: OPEN
        to: CANCELLED
        trigger: "POST /pediatrician-referrals/{id}/cancel"
        actor: Consultant
        preconditions:
          - "PediatricianReferral.status == OPEN (ERR_REFERRAL_NOT_OPEN)"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: void-superbill-stale-client
    parent_entity: Client
    write_endpoint: "POST /superbills/{id}/void"
    occ_field: "expected_client_version"
    description: |
      Voiding a PAID superbill rolls its reimbursed amount back out of the
      owning Client's reimbursement_ledger_cents. The void carries the Client
      version the caller last observed; if another mutation (a second superbill
      paying out, a no-show strike) has advanced Client.version since then, the
      caller's view of the ledger is stale and the void is rejected so the
      reversal is never computed against an out-of-date balance.
    error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: sliding_scale_fee
    trigger: "Consult creation with pay_method == SELF_PAY"
    algorithm: threshold
    formula: |
      # Select the sliding-scale tier for the client, then discount the rate.
      candidate_tiers = SlidingScaleTier WHERE practice_id == client.practice_id
                         AND income_ceiling_cents >= client.household_income_cents
      IF candidate_tiers is empty:
        discount_pct = 0                       # no qualifying tier -> full rate
      ELSE:
        # smallest qualifying ceiling = tightest matching bracket;
        # tie-break: lowest discount_pct, then earliest created_at
        tier = min(candidate_tiers, key=(income_ceiling_cents, discount_pct, created_at))
        discount_pct = tier.discount_pct
      fee_cents = round_half_up(consultant.standard_rate_cents * (100 - discount_pct) / 100)
    input_set: "Tiers of the consult's practice whose income_ceiling_cents >= client.household_income_cents"
    constants: {}
    precision: "2 decimal places at cents level, round_half_up"
    variants:
      - name: self_pay_sliding_scale
        when: "pay_method == SELF_PAY"
        difference: "fee_cents = discounted standard rate; package credit not touched"
      - name: package_redemption
        when: "pay_method == PACKAGE"
        difference: "fee_cents = 0 and one package credit is committed at completion; sliding scale never evaluated"

  - name: reimbursement_amount
    trigger: "Superbill adjudication transition SUBMITTED -> PAID (POST /superbills/{id}/adjudicate, outcome PAID)"
    algorithm: threshold
    formula: |
      # >=3 inputs with non-linear interaction (ACA branch + min/max clamps).
      IF superbill.is_aca_preventive AND practice.aca_preventive_enabled:
        reimbursed_amount_cents = allowed_amount_cents          # 100% covered
        patient_responsibility_cents = 0
      ELSE:
        deductible_applied = min(allowed_amount_cents, deductible_remaining_cents)
        after_deductible = allowed_amount_cents - deductible_applied
        coinsurance = round_half_up(after_deductible * coinsurance_pct / 100)
        patient_responsibility_cents = deductible_applied + coinsurance
        reimbursed_amount_cents = allowed_amount_cents - patient_responsibility_cents
    input_set: "Single superbill at adjudication; uses allowed_amount_cents, deductible_remaining_cents, coinsurance_pct, is_aca_preventive, practice.aca_preventive_enabled"
    constants: {}
    precision: "2 decimal places at cents level, round_half_up"
    variants:
      - name: aca_preventive
        when: "is_aca_preventive == true AND practice.aca_preventive_enabled == true"
        difference: "Full allowed_amount reimbursed; patient_responsibility_cents == 0 regardless of deductible/coinsurance"
      - name: standard_cost_share
        when: "is_aca_preventive == false OR practice.aca_preventive_enabled == false"
        difference: "Deductible then coinsurance subtracted; reimbursed = allowed - patient responsibility"

  - name: weighted_feed_rollup
    trigger: "WeightedFeed creation under a FollowUpPlan; recomputed on each new feed"
    algorithm: aggregation
    formula: |
      feeds = WeightedFeed WHERE follow_up_plan_id == plan.id   # all feeds, no status filter
      per_feed_transfers = [ (f.post_feed_weight_grams - f.pre_feed_weight_grams) for f in feeds ]
      total_transfer_grams = sum(per_feed_transfers)            # sum of already-integer per-feed transfers
      IF len(feeds) == 0:
        avg_transfer_grams = 0
      ELSE:
        # rounding order is PINNED: round the mean ONCE after summing,
        # NOT per-feed. avg = round_half_up(total / count).
        avg_transfer_grams = round_half_up(total_transfer_grams / len(feeds))
      meets_target = (total_transfer_grams >= plan.target_daily_transfer_grams)
    input_set: "All WeightedFeed rows whose follow_up_plan_id == plan.id (no status filter; feeds are immutable)"
    constants: {}
    precision: "Integer grams; mean rounded half-up exactly once after summing (sum-then-round, not round-per-feed)"

  - name: no_show_suspension
    trigger: "Consult no-show transition SCHEDULED -> NO_SHOW (POST /consults/{id}/no-show)"
    algorithm: threshold
    formula: |
      client.no_show_strikes += 1
      IF client.no_show_strikes >= NO_SHOW_SUSPEND_THRESHOLD:
        client.status = SUSPENDED          # inclusive boundary: 3rd strike suspends, 2 does not
    input_set: "Single client; counts NO_SHOW consults for the client via the strike counter"
    constants:
      NO_SHOW_SUSPEND_THRESHOLD: 3
    precision: "Integer strike count"

  - name: dme_qualification_window
    trigger: "DMEQualification creation and adjudication"
    algorithm: threshold
    formula: |
      consult = Consult[qual.consult_id]
      client  = Client[consult.client_id]
      IF consult.status != COMPLETED:
        qualified = false
      ELIF qual.pump_type == HOSPITAL_GRADE:
        qualified = true                                        # always qualifies off a completed consult
      ELSE:  # STANDARD_ELECTRIC: must request within DME_WINDOW_DAYS of infant DOB
        age_days = floor( (qual.requested_utc - client.infant_dob) / 86400 seconds )
        qualified = (age_days <= DME_WINDOW_DAYS)               # inclusive boundary: 30 days qualifies, 31 does not
    input_set: "Single qualification; uses parent consult status, client.infant_dob, requested_utc, pump_type"
    constants:
      DME_WINDOW_DAYS: 30
    precision: "Integer days, floor"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All resource ids in the path exist (validated left-to-right)"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Referenced foreign-key ids in the request body exist (client_id, consultant_id, consult_id, package_id, follow_up_plan_id)"
    error_id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /consults, POST /superbills, POST /dme-qualifications, POST /follow-up-plans, POST /pediatrician-referrals, POST /weighted-feeds, POST /clients"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, scheduled_end_utc strictly after scheduled_start_utc, post_feed_weight >= pre_feed_weight"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 6
    category: business_referential
    check: "On POST /consults, the consultant and client belong to the same practice as the consult"
    error_id: ERR_CROSS_PRACTICE_REFERENCE
    http_status: 409
    applies_to: "POST /consults"

  - priority: 7
    category: state
    check: "Target resource is in the correct state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
    note: "Concrete state errors (ERR_CONSULT_NOT_SCHEDULED, ERR_SUPERBILL_NOT_SUBMITTED, etc.) are the per-transition specializations of this rule."

  - priority: 8
    category: state
    check: "On POST /consults and POST /consults/{id}/reschedule, the target client is ACTIVE (not SUSPENDED)"
    error_id: ERR_CLIENT_SUSPENDED
    http_status: 409
    applies_to: "POST /consults, POST /consults/{id}/reschedule"

  - priority: 9
    category: state
    check: "Superbill/DMEQualification/FollowUpPlan/PediatricianReferral creation requires the parent consult to be COMPLETED"
    error_id: ERR_CONSULT_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /superbills, POST /dme-qualifications, POST /follow-up-plans, POST /pediatrician-referrals"

  - priority: 10
    category: business_temporal
    check: "Consultant calendar: the new consult's BUFFER-PADDED interval does not overlap any non-terminal (SCHEDULED/IN_PROGRESS) consult on the same consultant. An IN_HOME consult occupies [start - travel_buffer_minutes, end + travel_buffer_minutes); PRENATAL/TELEHEALTH occupy the bare [start, end). Two occupied intervals conflict iff a.start_pad < b.end_pad AND b.start_pad < a.end_pad."
    error_id: ERR_CONSULTANT_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /consults, POST /consults/{id}/reschedule"

  - priority: 10.5
    category: business_temporal
    check: "Client calendar: the new consult's BARE half-open interval [start, end) does not overlap any non-terminal consult for the same client. No buffer is ever applied on the client axis, so two adjacent appointments sharing an instant ([10,11) and [11,12)) do NOT conflict. Two intervals conflict iff a.start < b.end AND b.start < a.end."
    error_id: ERR_CLIENT_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /consults, POST /consults/{id}/reschedule"

  - priority: 11
    category: business_referential
    check: "On POST /superbills, the practice's aca_preventive_enabled is true when is_aca_preventive is requested true"
    error_id: ERR_ACA_PREVENTIVE_DISABLED
    http_status: 409
    applies_to: "POST /superbills"

  - priority: 12
    category: business_fiscal
    check: "On POST /consults with pay_method == PACKAGE, the client has package_credits_remaining >= 1"
    error_id: ERR_NO_PACKAGE_CREDITS
    http_status: 402
    applies_to: "POST /consults"

  - priority: 13
    category: business_temporal
    check: "WeightedFeed may only be added while its FollowUpPlan is OPEN"
    error_id: ERR_PLAN_CLOSED
    http_status: 409
    applies_to: "POST /weighted-feeds"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Practice & clock ---
  - method: POST
    path: "/practices"
    description: "Create a practice"
    roles: [PracticeAdmin]
    code: 201
    input: [name, "aca_preventive_enabled?"]
    output: Practice
    side_effects: ["now_utc initialized to 2026-01-01T00:00:00Z"]

  - method: GET
    path: "/practices/{id}"
    description: "Get a practice"
    roles: [PracticeAdmin, BillingSpecialist, Consultant, FrontDesk, Client]
    code: 200
    input: []
    output: Practice
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the practice logical clock. Before any call, the clock reads the fixed default 2026-01-01T00:00:00Z (never real wall-clock)."
    roles: [PracticeAdmin]
    code: 200
    input: [practice_id, to_iso8601]
    output: Practice
    side_effects: ["Practice.now_utc set to to_iso8601"]

  # --- Sliding-scale tiers ---
  - method: POST
    path: "/sliding-scale-tiers"
    description: "Create a sliding-scale tier"
    roles: [PracticeAdmin]
    code: 201
    input: [practice_id, name, income_ceiling_cents, discount_pct]
    output: SlidingScaleTier
    side_effects: []

  - method: GET
    path: "/sliding-scale-tiers/{id}"
    description: "Get a sliding-scale tier"
    roles: [PracticeAdmin, BillingSpecialist, Consultant, FrontDesk]
    code: 200
    input: []
    output: SlidingScaleTier
    side_effects: []

  - method: GET
    path: "/sliding-scale-tiers"
    description: "List sliding-scale tiers, optionally filtered by practice"
    roles: [PracticeAdmin, BillingSpecialist, Consultant, FrontDesk]
    code: 200
    input: ["practice_id?", "limit?", "offset?"]
    output: "SlidingScaleTier[]"
    side_effects: []

  # --- Service packages ---
  - method: POST
    path: "/service-packages"
    description: "Create a service package"
    roles: [PracticeAdmin]
    code: 201
    input: [practice_id, name, included_visits, price_cents]
    output: ServicePackage
    side_effects: ["per_visit_value_cents computed = floor(price_cents / included_visits)"]

  - method: GET
    path: "/service-packages/{id}"
    description: "Get a service package"
    roles: [PracticeAdmin, BillingSpecialist, Consultant, FrontDesk]
    code: 200
    input: []
    output: ServicePackage
    side_effects: []

  - method: GET
    path: "/service-packages"
    description: "List service packages, optionally filtered by practice"
    roles: [PracticeAdmin, BillingSpecialist, Consultant, FrontDesk]
    code: 200
    input: ["practice_id?", "limit?", "offset?"]
    output: "ServicePackage[]"
    side_effects: []

  # --- Consultants ---
  - method: POST
    path: "/consultants"
    description: "Create an IBCLC consultant"
    roles: [PracticeAdmin]
    code: 201
    input: [practice_id, full_name, standard_rate_cents, "travel_buffer_minutes?"]
    output: Consultant
    side_effects: []

  - method: GET
    path: "/consultants/{id}"
    description: "Get a consultant"
    roles: [PracticeAdmin, BillingSpecialist, Consultant, FrontDesk]
    code: 200
    input: []
    output: Consultant
    side_effects: []

  - method: GET
    path: "/consultants"
    description: "List consultants, optionally filtered by practice"
    roles: [PracticeAdmin, BillingSpecialist, Consultant, FrontDesk]
    code: 200
    input: ["practice_id?", "limit?", "offset?"]
    output: "Consultant[]"
    side_effects: []

  # --- Clients ---
  - method: POST
    path: "/clients"
    description: "Register a client; if package_id supplied, grant package credits"
    roles: [FrontDesk, PracticeAdmin]
    code: 201
    input: [practice_id, full_name, infant_dob, household_income_cents, "package_id?"]
    output: Client
    side_effects:
      - "status = ACTIVE"
      - "If package_id supplied: package_credits_total = ServicePackage.included_visits; package_credits_remaining = same; package_credits_consumed = 0"

  - method: GET
    path: "/clients/{id}"
    description: "Get a client (with computed ledgers and credit balances)"
    roles: [PracticeAdmin, BillingSpecialist, Consultant, FrontDesk, Client]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: GET
    path: "/clients"
    description: "List clients, optionally filtered by practice or package"
    roles: [PracticeAdmin, BillingSpecialist, Consultant, FrontDesk]
    code: 200
    input: ["practice_id?", "package_id?", "limit?", "offset?"]
    output: "Client[]"
    side_effects: []

  # --- Consults ---
  - method: POST
    path: "/consults"
    description: "Schedule a consult"
    roles: [FrontDesk, PracticeAdmin]
    code: 201
    input: [practice_id, client_id, consultant_id, consult_type, scheduled_start_utc, scheduled_end_utc, pay_method]
    output: Consult
    side_effects:
      - "status = SCHEDULED"
      - "If pay_method == SELF_PAY: fee_cents = sliding_scale_fee"
      - "If pay_method == PACKAGE: fee_cents = 0 (credit committed at completion)"

  - method: GET
    path: "/consults/{id}"
    description: "Get a consult"
    roles: [PracticeAdmin, BillingSpecialist, Consultant, FrontDesk, Client]
    code: 200
    input: []
    output: Consult
    side_effects: []

  - method: GET
    path: "/consults"
    description: "List consults, optionally filtered by client, consultant, or practice"
    roles: [PracticeAdmin, BillingSpecialist, Consultant, FrontDesk, Client]
    code: 200
    input: ["client_id?", "consultant_id?", "practice_id?", "limit?", "offset?"]
    output: "Consult[]"
    side_effects: []

  - method: POST
    path: "/consults/{id}/reschedule"
    description: "Reschedule a SCHEDULED consult to a new window"
    roles: [FrontDesk, PracticeAdmin]
    code: 200
    input: [scheduled_start_utc, scheduled_end_utc]
    output: Consult
    side_effects:
      - "status SCHEDULED -> RESCHEDULED -> SCHEDULED (auto-confirm)"
      - "reschedule_count += 1"

  - method: POST
    path: "/consults/{id}/start"
    description: "Begin a consult"
    roles: [Consultant]
    code: 200
    input: []
    output: Consult
    side_effects: ["status -> IN_PROGRESS"]

  - method: POST
    path: "/consults/{id}/complete"
    description: "Complete a consult (requires a feeding assessment)"
    roles: [Consultant]
    code: 200
    input: []
    output: Consult
    side_effects:
      - "status -> COMPLETED"
      - "If pay_method == PACKAGE: package_credit_redeemed = true; Client.package_credits_consumed += 1; Client.package_credits_remaining recomputed"

  - method: POST
    path: "/consults/{id}/no-show"
    description: "Mark a consult as a no-show"
    roles: [FrontDesk, PracticeAdmin]
    code: 200
    input: []
    output: Consult
    side_effects:
      - "status -> NO_SHOW"
      - "Client.no_show_strikes += 1 (cascade step 1)"
      - "If package credit was committed: Client.package_credits_consumed -= 1 (returned)"
      - "If Client.no_show_strikes >= NO_SHOW_SUSPEND_THRESHOLD: Client.status -> SUSPENDED (cascade step 2)"
      - "On SUSPENDED: every other SCHEDULED consult of the client auto-cancels to CANCELLED, each returning its committed package credit (cascade step 3)"

  - method: POST
    path: "/consults/{id}/cancel"
    description: "Cancel a SCHEDULED consult"
    roles: [FrontDesk, PracticeAdmin]
    code: 200
    input: []
    output: Consult
    side_effects:
      - "status -> CANCELLED"
      - "If package credit was committed: Client.package_credits_consumed -= 1 (returned); Client.package_credits_remaining recomputed"

  # --- Feeding assessment ---
  - method: POST
    path: "/feeding-assessments"
    description: "Record an intake feeding assessment for a consult"
    roles: [Consultant]
    code: 201
    input: [consult_id, latch_score, pre_feed_weight_grams, post_feed_weight_grams, "notes?"]
    output: FeedingAssessment
    side_effects: []

  - method: GET
    path: "/feeding-assessments/{id}"
    description: "Get a feeding assessment"
    roles: [PracticeAdmin, BillingSpecialist, Consultant, FrontDesk]
    code: 200
    input: []
    output: FeedingAssessment
    side_effects: []

  - method: GET
    path: "/feeding-assessments"
    description: "List feeding assessments, optionally filtered by consult"
    roles: [PracticeAdmin, BillingSpecialist, Consultant, FrontDesk]
    code: 200
    input: ["consult_id?", "limit?", "offset?"]
    output: "FeedingAssessment[]"
    side_effects: []

  # --- Follow-up plans & weighted feeds ---
  - method: POST
    path: "/follow-up-plans"
    description: "Open a follow-up plan against a COMPLETED consult"
    roles: [Consultant]
    code: 201
    input: [consult_id, target_daily_transfer_grams]
    output: FollowUpPlan
    side_effects:
      - "status = OPEN"
      - "client_id copied from consult"

  - method: GET
    path: "/follow-up-plans/{id}"
    description: "Get a follow-up plan with rollups"
    roles: [PracticeAdmin, BillingSpecialist, Consultant, FrontDesk, Client]
    code: 200
    input: []
    output: FollowUpPlan
    side_effects: []

  - method: GET
    path: "/follow-up-plans"
    description: "List follow-up plans, optionally filtered by consult or client"
    roles: [PracticeAdmin, BillingSpecialist, Consultant, FrontDesk, Client]
    code: 200
    input: ["consult_id?", "client_id?", "limit?", "offset?"]
    output: "FollowUpPlan[]"
    side_effects: []

  - method: POST
    path: "/follow-up-plans/{id}/close"
    description: "Close a follow-up plan, locking weighted-feed entry"
    roles: [Consultant]
    code: 200
    input: []
    output: FollowUpPlan
    side_effects: ["status -> CLOSED"]

  - method: POST
    path: "/weighted-feeds"
    description: "Record a weighted feed under an OPEN follow-up plan"
    roles: [Consultant]
    code: 201
    input: [follow_up_plan_id, pre_feed_weight_grams, post_feed_weight_grams]
    output: WeightedFeed
    side_effects:
      - "transfer_grams computed = post - pre"
      - "Parent FollowUpPlan total_transfer_grams, avg_transfer_grams, meets_target recomputed via weighted_feed_rollup"

  - method: GET
    path: "/weighted-feeds/{id}"
    description: "Get a weighted feed"
    roles: [PracticeAdmin, BillingSpecialist, Consultant, FrontDesk, Client]
    code: 200
    input: []
    output: WeightedFeed
    side_effects: []

  - method: GET
    path: "/weighted-feeds"
    description: "List weighted feeds, optionally filtered by follow-up plan"
    roles: [PracticeAdmin, BillingSpecialist, Consultant, FrontDesk, Client]
    code: 200
    input: ["follow_up_plan_id?", "limit?", "offset?"]
    output: "WeightedFeed[]"
    side_effects: []

  # --- Superbills ---
  - method: POST
    path: "/superbills"
    description: "Draft a superbill against a COMPLETED consult"
    roles: [BillingSpecialist]
    code: 201
    input: [consult_id, billed_amount_cents, allowed_amount_cents, "is_aca_preventive?", "deductible_remaining_cents?", "coinsurance_pct?"]
    output: Superbill
    side_effects:
      - "status = DRAFT"
      - "client_id copied from consult"

  - method: GET
    path: "/superbills/{id}"
    description: "Get a superbill"
    roles: [PracticeAdmin, BillingSpecialist, Consultant, Client]
    code: 200
    input: []
    output: Superbill
    side_effects: []

  - method: GET
    path: "/superbills"
    description: "List superbills, optionally filtered by consult or client"
    roles: [PracticeAdmin, BillingSpecialist, Consultant, Client]
    code: 200
    input: ["consult_id?", "client_id?", "limit?", "offset?"]
    output: "Superbill[]"
    side_effects: []

  - method: POST
    path: "/superbills/{id}/submit"
    description: "Submit (or resubmit a denied) superbill to insurer"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Superbill
    side_effects: ["status -> SUBMITTED"]

  - method: POST
    path: "/superbills/{id}/adjudicate"
    description: "Adjudicate a submitted superbill (PAID or DENIED)"
    roles: [BillingSpecialist]
    code: 200
    input: [outcome]
    output: Superbill
    side_effects:
      - "On PAID: reimbursed_amount_cents & patient_responsibility_cents computed via reimbursement_amount; Client.reimbursement_ledger_cents += reimbursed_amount_cents; Client.version += 1"
      - "On DENIED: reimbursed_amount_cents = 0; patient_responsibility_cents = allowed_amount_cents"

  - method: POST
    path: "/superbills/{id}/void"
    description: "Void a PAID superbill, reversing its ledger contribution (OCC on Client.version)"
    roles: [BillingSpecialist]
    code: 200
    input: [expected_client_version]
    output: Superbill
    side_effects:
      - "status -> VOID"
      - "Client.reimbursement_ledger_cents -= reimbursed_amount_cents (compensating reversal)"
      - "increments Client.version by 1"

  # --- DME qualifications ---
  - method: POST
    path: "/dme-qualifications"
    description: "Request a breast-pump DME qualification against a COMPLETED consult"
    roles: [BillingSpecialist, Consultant]
    code: 201
    input: [consult_id, pump_type]
    output: DMEQualification
    side_effects:
      - "status = PENDING"
      - "client_id copied from consult; requested_utc = Practice.now_utc"
      - "qualified computed via dme_qualification_window"

  - method: GET
    path: "/dme-qualifications/{id}"
    description: "Get a DME qualification"
    roles: [PracticeAdmin, BillingSpecialist, Consultant, Client]
    code: 200
    input: []
    output: DMEQualification
    side_effects: []

  - method: GET
    path: "/dme-qualifications"
    description: "List DME qualifications, optionally filtered by consult or client"
    roles: [PracticeAdmin, BillingSpecialist, Consultant, Client]
    code: 200
    input: ["consult_id?", "client_id?", "limit?", "offset?"]
    output: "DMEQualification[]"
    side_effects: []

  - method: POST
    path: "/dme-qualifications/{id}/adjudicate"
    description: "Adjudicate a DME qualification (QUALIFIED if window rule met, else DENIED)"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: DMEQualification
    side_effects: ["status -> QUALIFIED or DENIED based on qualified flag"]

  # --- Pediatrician referrals ---
  - method: POST
    path: "/pediatrician-referrals"
    description: "Create a pediatrician referral against a COMPLETED consult"
    roles: [Consultant]
    code: 201
    input: [consult_id, reason, pediatrician_name]
    output: PediatricianReferral
    side_effects:
      - "status = OPEN"
      - "client_id copied from consult"

  - method: GET
    path: "/pediatrician-referrals/{id}"
    description: "Get a pediatrician referral"
    roles: [PracticeAdmin, BillingSpecialist, Consultant, Client]
    code: 200
    input: []
    output: PediatricianReferral
    side_effects: []

  - method: GET
    path: "/pediatrician-referrals"
    description: "List pediatrician referrals, optionally filtered by consult or client"
    roles: [PracticeAdmin, BillingSpecialist, Consultant, Client]
    code: 200
    input: ["consult_id?", "client_id?", "limit?", "offset?"]
    output: "PediatricianReferral[]"
    side_effects: []

  - method: POST
    path: "/pediatrician-referrals/{id}/acknowledge"
    description: "Mark a referral acknowledged by the pediatrician"
    roles: [Consultant]
    code: 200
    input: []
    output: PediatricianReferral
    side_effects: ["status -> ACKNOWLEDGED"]

  - method: POST
    path: "/pediatrician-referrals/{id}/cancel"
    description: "Cancel an open referral"
    roles: [Consultant]
    code: 200
    input: []
    output: PediatricianReferral
    side_effects: ["status -> CANCELLED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth / existence ---
  - { id: ERR_MISSING_AUTH_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "A resource id in the path does not exist" }
  - { id: ERR_REFERENCED_RESOURCE_NOT_FOUND, http: 404, condition: "A foreign-key id in the request body does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, end <= start, or post_feed_weight < pre_feed_weight" }
  # --- referential / cross-entity ---
  - { id: ERR_CROSS_PRACTICE_REFERENCE, http: 409, condition: "Consult's client and consultant are not in the same practice as the consult" }
  - { id: ERR_ACA_PREVENTIVE_DISABLED, http: 409, condition: "is_aca_preventive requested true but the practice has aca_preventive_enabled false" }
  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic: resource not in a valid state for the requested transition" }
  - { id: ERR_CONSULT_NOT_SCHEDULED, http: 409, condition: "Consult is not SCHEDULED (reschedule/start/no-show require SCHEDULED)" }
  - { id: ERR_CONSULT_NOT_IN_PROGRESS, http: 409, condition: "Consult is not IN_PROGRESS (complete requires IN_PROGRESS)" }
  - { id: ERR_CONSULT_NOT_STARTABLE, http: 409, condition: "Practice.now_utc is before scheduled_start_utc (start / no-show)" }
  - { id: ERR_CONSULT_NOT_CANCELLABLE, http: 409, condition: "Consult is not SCHEDULED and cannot be cancelled" }
  - { id: ERR_CONSULT_NOT_COMPLETED, http: 409, condition: "Parent consult is not COMPLETED for superbill/DME/follow-up/referral creation or submission" }
  - { id: ERR_NO_FEEDING_ASSESSMENT, http: 409, condition: "Completing a consult that has no FeedingAssessment" }
  - { id: ERR_CLIENT_SUSPENDED, http: 409, condition: "Client is SUSPENDED; cannot schedule or reschedule consults" }
  - { id: ERR_SUPERBILL_NOT_SUBMITTABLE, http: 409, condition: "Superbill is not in DRAFT or DENIED for submit" }
  - { id: ERR_SUPERBILL_NOT_SUBMITTED, http: 409, condition: "Superbill is not SUBMITTED for adjudicate" }
  - { id: ERR_SUPERBILL_NOT_VOIDABLE, http: 409, condition: "Superbill is not PAID and cannot be voided" }
  - { id: ERR_DME_NOT_PENDING, http: 409, condition: "DMEQualification is not PENDING for adjudicate" }
  - { id: ERR_DME_WINDOW_NOT_MET, http: 409, condition: "Adjudicating a DMEQualification to QUALIFIED but qualified == false" }
  - { id: ERR_PLAN_NOT_OPEN, http: 409, condition: "FollowUpPlan is not OPEN for close" }
  - { id: ERR_PLAN_CLOSED, http: 409, condition: "Adding a WeightedFeed to a CLOSED follow-up plan" }
  - { id: ERR_REFERRAL_NOT_OPEN, http: 409, condition: "PediatricianReferral is not OPEN for acknowledge/cancel" }
  # --- temporal / fiscal ---
  - { id: ERR_CONSULTANT_DOUBLE_BOOKED, http: 409, condition: "Consult buffer-padded interval overlaps another non-terminal consult on the same consultant (IN_HOME adds travel buffer)" }
  - { id: ERR_CLIENT_DOUBLE_BOOKED, http: 409, condition: "Consult bare half-open interval overlaps another non-terminal consult for the same client (no buffer; adjacency allowed)" }
  - { id: ERR_NO_PACKAGE_CREDITS, http: 402, condition: "pay_method == PACKAGE but client has package_credits_remaining < 1" }
  # --- concurrency ---
  - { id: ERR_STALE_CLIENT_VERSION, http: 412, condition: "expected_client_version on superbill void does not match current Client.version" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PracticeAdmin
    description: "Configures the practice: tiers, packages, consultants, clock; superset operational access."
    identity: opaque
    exclusive_operations:
      - "POST /practices — create practice"
      - "POST /_clock/set_current_utc — set logical clock"
      - "POST /sliding-scale-tiers — create tier"
      - "POST /service-packages — create package"
      - "POST /consultants — create consultant"
    shared_operations:
      - "POST /clients — register client (with FrontDesk)"
      - "POST /consults — schedule consult (with FrontDesk)"
      - "POST /consults/{id}/reschedule, no-show, cancel — manage scheduling (with FrontDesk)"
      - "GET endpoints — read access"

  - name: FrontDesk
    description: "Scheduling desk: registers clients, books/reschedules/cancels consults, records no-shows."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /clients — register client (with PracticeAdmin)"
      - "POST /consults — schedule consult (with PracticeAdmin)"
      - "POST /consults/{id}/reschedule — reschedule (with PracticeAdmin)"
      - "POST /consults/{id}/no-show — record no-show (with PracticeAdmin)"
      - "POST /consults/{id}/cancel — cancel (with PracticeAdmin)"
      - "GET endpoints — read access"

  - name: Consultant
    description: "IBCLC clinician: runs consults, records assessments, manages follow-up plans / weighted feeds / referrals, requests DME."
    identity: entity_backed:Consultant
    exclusive_operations:
      - "POST /consults/{id}/start — begin consult"
      - "POST /consults/{id}/complete — complete consult"
      - "POST /feeding-assessments — record assessment"
      - "POST /follow-up-plans — open follow-up plan"
      - "POST /follow-up-plans/{id}/close — close plan"
      - "POST /weighted-feeds — record weighted feed"
      - "POST /pediatrician-referrals — create referral"
      - "POST /pediatrician-referrals/{id}/acknowledge — acknowledge referral"
      - "POST /pediatrician-referrals/{id}/cancel — cancel referral"
    shared_operations:
      - "POST /dme-qualifications — request DME (with BillingSpecialist)"
      - "GET endpoints — read access"

  - name: BillingSpecialist
    description: "Revenue cycle: superbills, insurance adjudication, reimbursement ledger, DME adjudication."
    identity: opaque
    exclusive_operations:
      - "POST /superbills — draft superbill"
      - "POST /superbills/{id}/submit — submit/resubmit"
      - "POST /superbills/{id}/adjudicate — adjudicate superbill"
      - "POST /superbills/{id}/void — void paid superbill"
      - "POST /dme-qualifications/{id}/adjudicate — adjudicate DME"
    shared_operations:
      - "POST /dme-qualifications — request DME (with Consultant)"
      - "GET endpoints — read access"

  - name: Client
    description: "Self-service parent/caregiver: read-only access to own practice, consults, plans, superbills, referrals, DME."
    identity: entity_backed:Client
    exclusive_operations: []
    shared_operations:
      - "GET /practices/{id}, /clients/{id}, /consults, /consults/{id} — read own records"
      - "GET /follow-up-plans, /weighted-feeds, /superbills, /dme-qualifications, /pediatrician-referrals — read own clinical/billing records"
