        as_user_id: la-admin-1
      - call: POST /leases/${l_a1}/open
        payload: {}
        as: LeaseAdministrator
        as_user_id: la-admin-1
      - call: POST /leases/${l_a2}/open
        payload: {}
        as: LeaseAdministrator
        as_user_id: la-admin-1
      - call: POST /leases/${l_i1}/open
        payload: {}
        as: LeaseAdministrator
        as_user_id: la-admin-1
      - call: POST /leases/${l_i2}/open
        payload: {}
        as: LeaseAdministrator
        as_user_id: la-admin-1
      - call: POST /leases/${l_i3}/open
        payload: {}
        as: LeaseAdministrator
        as_user_id: la-admin-1
      - call: POST /leases/${l_i3}/go-dark
        payload: {}
        as: LeaseAdministrator
        as_user_id: la-admin-1
      - call: GET /centers/${ctr}
        as: ComplianceOfficer
        as_user_id: co-analyst-1
        captures:
          v1: $.data.version
      trigger:
      - call: POST /centers/${ctr}/occupancy-measurements
        payload:
          variant: SNAPSHOT_STRICT
          window_from_date: '2026-07-01'
          window_through_date: '2026-08-02'
          expected_center_version: ${v1}
        as: ComplianceOfficer
        as_user_id: co-analyst-1
        captures:
          m_strict: $.data.id
      - call: GET /centers/${ctr}
        as: ComplianceOfficer
        as_user_id: co-analyst-1
        captures:
          v2: $.data.version
      - call: POST /centers/${ctr}/occupancy-measurements
