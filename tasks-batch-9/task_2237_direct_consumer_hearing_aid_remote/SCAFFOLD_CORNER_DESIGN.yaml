            - { call: "POST /patients/${pat_v2}/screening-sessions", payload: {}, as: Patient, as_user_id: "${pat_v2}", captures: { scr_v2: "$.data.id" } }
            - { call: "PATCH /screening-sessions/${scr_v2}", payload: { pure_tone_avg_db: 40.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: ["VERTIGO"] }, as: Patient, as_user_id: "${pat_v2}" }
            - { call: "POST /screening-sessions/${scr_v2}/submit", payload: {}, as: Patient, as_user_id: "${pat_v2}", note: "screening_outcome RED_FLAG, one MANDATORY finding" }
