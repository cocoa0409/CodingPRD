              as: PlatformAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /material-seal-configs"
              payload: { pump_model_id: "${m1_id}", config_code: "MSC-CI-P11", casing_material: "CI_GG25", impeller_material: "CI_GG25", seal_type: "SINGLE_CARTRIDGE", flush_plan: "API_PLAN_11", service_class: "CLEAN", max_solids_pct: 0.0, max_viscosity_cst: 50.0, max_chloride_ppm: 200.0, max_temp_c: 120.0, min_running_clearance_mm: 0.30 }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /duty-applications"
              payload: { application_code: "APP-1003", customer_name: "Delta Refining", duty_flow_m3h: 265.0, duty_head_m: 74.0, npsha_available_m: 5.10, specific_gravity: 1.00, viscosity_cst: 1.2, solids_pct: 0.0, chloride_ppm: 150.0, process_temp_c: 60.0, min_efficiency_pct: 74.0, test_grade: "GRADE_1B", witness_required: true, service_class_required: "CLEAN" }
              as: ApplicationEngineer
              as_user_id: "eng-101"
              captures: { dn_id: $.data.id, dn_ver: $.data.version }
          trigger:
