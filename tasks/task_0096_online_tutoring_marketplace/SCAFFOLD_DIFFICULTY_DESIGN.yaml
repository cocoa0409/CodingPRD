              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STUDENT_TIME_CONFLICT and HTTP 409 (10:40 start is within STUDENT_GAP_MINUTES of the 10:30 end; buffered semantics on a different resource than the tutor rule)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # --- Instance 1: parent wallet conservation across booking hold + refund ---
      - name: wallet_money_conserved_across_settle_and_full_refund
        grounds:
          - calculations.settlement_reversal
          - state_machines.RefundCase.AGREED_to_RESOLVED_REFUND
          - entities.ParentAccount.fields.wallet_balance_cents
          - entities.Tutor.fields.clawback_owed_cents
        distinguishing_aspect: |
          Conserved quantity = total money in the system (parent wallet + tutor
          payout_balance + platform commission - tutor clawback). Forward settle then
          compensating full refund leave it invariant: after a trial (net 1500) and a
          standard (net 4500) settlement the tutor holds 6000; a full 6000 refund
          debits all 6000 (clawback 0) and credits the parent 6000, while the platform
          keeps the 3000 it took in commission; parent_wallet + tutor_balance +
          commission_retained - clawback equals the original 100000 deposit at all times.
        test_recipe:
          setup:
            - "Parent deposited 100000; a trial session settled (gross 3000, net 1500) and a standard session settled (gross 6000, net 4500, commission 1500); tutor payout_balance == 6000; RefundCase claiming 6000 open on the standard session."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /commission-policies"
              payload: { name: "P1", tier_breakpoints_cents: [0, 100000, 1000000], tier_rates_bps: [2500, 1500, 800], trial_commission_bps: 5000, trial_max_billed_minutes: 30, refund_window_hours: 168 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /commission-policies/${policy_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /subjects"
              payload: { code: "MATH_ALG2", display_name: "Algebra 2", category: "STEM", requires_credential: false }
              as: PlatformAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /tutors"
              payload: { email: "t1@x.com", full_name: "T One", base_hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { tutor_id: $.data.id }
            - call: "POST /credentials"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_id}", kind: "DEGREE", document_ref: "doc1" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { cred_id: $.data.id }
            - call: "POST /credentials/${cred_id}/start-review"
              payload: {}
              as: TrustOfficer
            - call: "POST /credentials/${cred_id}/verify"
              payload: {}
              as: TrustOfficer
            - call: "POST /subject-tags"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_id}" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { tag_id: $.data.id }
            - call: "POST /subject-tags/${tag_id}/approve"
              payload: {}
              as: TrustOfficer
            - call: "POST /parent-accounts"
              payload: { email: "p1@x.com", full_name: "P One" }
              as: ParentGuardian
              captures: { parent_id: $.data.id }
            - call: "POST /parent-accounts/${parent_id}/deposit"
              payload: { amount_cents: 100000 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
            - call: "POST /parent-accounts/${parent_id}/students"
              payload: { display_name: "Kid", grade_level: 9 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { student_id: $.data.id }
            - call: "POST /bookings"
              payload: { parent_account_id: "${parent_id}", student_id: "${student_id}", tutor_id: "${tutor_id}", subject_id: "${subj_id}", scheduled_start: "2026-06-02T08:00:00Z", planned_minutes: 30 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { trial_booking_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-02T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${trial_booking_id}/deliver"
              payload: { actual_minutes: 30 }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { trial_session_id: $.data.id }
            - call: "POST /sessions/${trial_session_id}/confirm"
              payload: {}
              as: ParentGuardian
              as_user_id: "${parent_id}"
            - call: "POST /bookings"
              payload: { parent_account_id: "${parent_id}", student_id: "${student_id}", tutor_id: "${tutor_id}", subject_id: "${subj_id}", scheduled_start: "2026-06-03T10:00:00Z", planned_minutes: 60 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { std_booking_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-03T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${std_booking_id}/deliver"
              payload: { actual_minutes: 60 }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { std_session_id: $.data.id }
            - call: "POST /sessions/${std_session_id}/confirm"
              payload: {}
              as: ParentGuardian
              as_user_id: "${parent_id}"
            - call: "POST /refund-cases"
              payload: { session_id: "${std_session_id}", claimed_amount_cents: 6000 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { case_id: $.data.id, case_v: $.data.version }
          trigger:
            - call: "POST /refund-cases/${case_id}/accept-offer"
              payload: { expected_refund_case_version: "${case_v}" }
              as: Tutor
              as_user_id: "${tutor_id}"
          assert:
            - "ParentAccount ${parent_id}.wallet_balance_cents == 97000 (100000 - trial gross 3000 - std gross 6000 + refund 6000)"
            - "Tutor ${tutor_id}.payout_balance_cents == 0 and clawback_owed_cents == 0 (full 6000 refund fully covered by the 6000 accumulated balance from both settlements)"
            - "Invariant: parent_wallet (97000) + tutor_balance (0) + platform_commission_retained (1500 trial + 1500 std = 3000) - tutor_clawback (0) == 100000 (original deposit conserved)"

      # --- Instance 2: subject-tag count conservation across approve + revoke ---
      - name: active_subject_count_conserved_across_approve_revoke
        grounds:
          - state_machines.TutorSubjectTag.PROPOSED_to_APPROVED
          - state_machines.TutorSubjectTag.APPROVED_to_REVOKED
          - entities.Tutor.fields.active_subject_count
        distinguishing_aspect: |
          Conserved quantity = Tutor.active_subject_count (a count, not money — a
          different conserved type than instance 1). Forward approve (+1) paired with
          its compensating revoke (-1) returns active_subject_count to its starting
          value with zero drift: pinned as count == approved_tag_count for that tutor.
        test_recipe:
          setup:
            - "VERIFIED tutor with one APPROVED tag (active_subject_count == 1)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subjects"
              payload: { code: "MATH_ALG2", display_name: "Algebra 2", category: "STEM", requires_credential: false }
              as: PlatformAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /tutors"
              payload: { email: "t1@x.com", full_name: "T One", base_hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { tutor_id: $.data.id }
            - call: "POST /credentials"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_id}", kind: "DEGREE", document_ref: "doc1" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { cred_id: $.data.id }
            - call: "POST /credentials/${cred_id}/start-review"
              payload: {}
              as: TrustOfficer
            - call: "POST /credentials/${cred_id}/verify"
              payload: {}
              as: TrustOfficer
            - call: "POST /subject-tags"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_id}" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { tag_id: $.data.id }
            - call: "POST /subject-tags/${tag_id}/approve"
              payload: {}
              as: TrustOfficer
          trigger:
            - call: "POST /subject-tags/${tag_id}/revoke"
              payload: {}
              as: TrustOfficer
          assert:
            - "before revoke: Tutor ${tutor_id}.active_subject_count == 1"
            - "after revoke: Tutor ${tutor_id}.active_subject_count == 0 (compensating revoke returns the count to its pre-approve value; no drift)"
            - "TutorSubjectTag ${tag_id}.status == REVOKED"
