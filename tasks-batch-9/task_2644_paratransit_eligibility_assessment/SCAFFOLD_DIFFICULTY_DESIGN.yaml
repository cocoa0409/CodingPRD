              as: IntakeClerk
              captures: { appn_id: $.data.id }
            - call: "POST /applications/${appn_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /applications/${appn_id}/verifications"
              payload: { provider_name: "Dr. H Lindqvist", provider_type: "PHYSICIAN", provider_license_number: "MD-77420" }
              as: IntakeClerk
              captures: { ver_id: $.data.id }
            - call: "POST /applications/${appn_id}/verifications/${ver_id}/receive"
              payload: { outcome: "ACCEPTED", attests_conditions: ["quadriplegia"], attests_permanent: true }
              as: IntakeClerk
            - call: "POST /assessment-slots"
              payload: { site_name: "Central Mobility Center", evaluator_user_id: "eval-1", starts_at: "2026-08-05T09:00:00Z", ends_at: "2026-08-05T10:00:00Z", capacity: 1, site_is_wheelchair_accessible: true }
              as: AccessibilityOfficeAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /applications/${appn_id}/assessments"
              payload: { slot_id: "${slot_id}", requires_wheelchair_position: true }
              as: IntakeClerk
              captures: { asmt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:30:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /assessments/${asmt_id}/attendance"
              payload: { attendance_status: "ATTENDED" }
              as: Evaluator
              as_user_id: "eval-1"
            - call: "POST /assessments/${asmt_id}/scores"
              payload: { board_alight_score: 0, wayfinding_score: 4, distance_meters_walked: 900, heat_sensitivity_flag: false }
              as: Evaluator
              as_user_id: "eval-1"
              captures: { rec_cat: $.data.recommended_category, rec_term: $.data.recommended_term_days }
            - call: "POST /assessments/${asmt_id}/sign-off"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: "spec-1"
            - call: "GET /applications/${appn_id}"
              payload: {}
              as: EligibilitySpecialist
              captures: { appn_v: $.data.version }
            - call: "POST /applications/${appn_id}/determinations"
              payload: { expected_application_version: "${appn_v}", category: "UNCONDITIONAL", effective_date: "2026-08-06", rationale: "Cannot board any fixed-route vehicle" }
              as: EligibilitySpecialist
              as_user_id: "spec-1"
              captures: { det_id: $.data.id }
            - call: "POST /determinations/${det_id}/issue"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: "spec-1"
              captures: { det_term: $.data.term_days, det_expiry: $.data.expires_at }
          trigger:
            - call: "POST /applicants/${rider_id}/travel-training-referrals"
              payload: { referral_reason: "STAFF_REFERRAL", determination_id: "${det_id}" }
