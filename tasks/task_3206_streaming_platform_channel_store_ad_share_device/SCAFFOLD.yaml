    roles: [Publisher]
    code: 201
    input: [campaign_id, slot_code, window_start, window_end]
    output: PlacementBooking
    side_effects: ["status=HELD; placement_overlap_check enforced"]
  - method: GET
    path: "/placement-bookings"
    description: "List placement bookings"
    roles: [PlatformAdmin, AdOps, Publisher]
    code: 200
    input: ["campaign_id?", "slot_code?", "status?", "limit?", "offset?"]
    output: "PlacementBooking[]"
    side_effects: []
  - method: GET
    path: "/placement-bookings/{id}"
    description: "Get a placement booking"
    roles: [PlatformAdmin, AdOps, Publisher]
    code: 200
    input: []
    output: PlacementBooking
    side_effects: []
  - method: POST
    path: "/placement-bookings/{id}/confirm"
    description: "Confirm a HELD booking"
    roles: [AdOps]
    code: 200
    input: []
    output: PlacementBooking
    side_effects: ["status HELD -> CONFIRMED"]
  - method: POST
    path: "/placement-bookings/{id}/release"
    description: "Release a HELD/CONFIRMED booking"
    roles: [AdOps]
    code: 200
    input: []
    output: PlacementBooking
    side_effects: ["status -> RELEASED; slot window freed"]

  # --- TV manufacturers ---
  - method: POST
    path: "/manufacturers"
    description: "License a television manufacturer"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, royalty_per_device_cents]
    output: TvManufacturer
    side_effects: ["license_status=LICENSED"]
  - method: GET
    path: "/manufacturers/{id}"
    description: "Get a manufacturer"
    roles: [PlatformAdmin, AdOps, TvManufacturer]
    code: 200
    input: []
    output: TvManufacturer
    side_effects: []
  - method: POST
    path: "/manufacturers/{id}/suspend"
