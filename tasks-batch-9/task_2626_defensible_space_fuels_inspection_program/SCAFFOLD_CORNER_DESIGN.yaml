      - name: void_notice_restores_parcel_posture_without_rescoring
        claim_type: Cross-entity
        grounds:
          - state_machines.ViolationNotice.ISSUED_to_VOIDED.side_effects
          - endpoints."POST /fire-district/violation-notices/{notice_id}/void"
          - entities.Parcel.fields.open_violation_count
