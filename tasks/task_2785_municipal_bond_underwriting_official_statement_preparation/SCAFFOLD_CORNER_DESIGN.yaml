      - name: rating_assignment_requires_a_presentation_that_was_actually_held
        claim_type: cross_entity_validation
        grounds:
          - validations[rating-requires-held-presentation] (priority 13, category business_safety)
          - errors[ERR_PRESENTATION_REQUIRED]
        distinguishing_aspect: |
          A SCHEDULED presentation is not a HELD one: the rating is refused while the slot is
          merely booked, and only after the logical clock passes ends_at - which auto-promotes
          the presentation to HELD - does the identical assign-rating call succeed. A CANCELLED
          slot never satisfies the rule.
        test_recipe:
          setup:
            - "A DRAFT deal has an UNDER_REVIEW MOODYS engagement acknowledged by analyst ra_1, one CANCELLED presentation and one SCHEDULED presentation ending 2026-08-10T15:00:00.000Z."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 5000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/rating-engagements"
              payload: { agency: "MOODYS" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /bond-offerings/rating-engagements/${eng_id}/acknowledge"
              payload: {}
              as: RatingAnalyst
              as_user_id: ra_1
            - call: "POST /bond-offerings/rating-engagements/${eng_id}/presentations"
              payload: { starts_at: "2026-08-10T09:00:00.000Z", ends_at: "2026-08-10T11:00:00.000Z", attendee_count: 6 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { pres_cancelled_id: $.data.id }
            - call: "POST /bond-offerings/rating-presentations/${pres_cancelled_id}/cancel"
              payload: { cancellation_reason: "Agency rescheduled the session." }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "POST /bond-offerings/rating-engagements/${eng_id}/presentations"
              payload: { starts_at: "2026-08-10T13:00:00.000Z", ends_at: "2026-08-10T15:00:00.000Z", attendee_count: 6 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { pres_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/rating-engagements/${eng_id}/assign-rating"
              payload: { assigned_rating: "AA2", outlook: "STABLE" }
              as: RatingAnalyst
              as_user_id: ra_1
            - call: "POST /bond-offerings/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T15:00:00.000Z" }
              as: ComplianceOfficer
            - call: "POST /bond-offerings/rating-engagements/${eng_id}/assign-rating"
              payload: { assigned_rating: "AA2", outlook: "STABLE" }
              as: RatingAnalyst
              as_user_id: ra_1
          assert:
            - "first call: HTTP 422 with data.error_id == 'ERR_PRESENTATION_REQUIRED' while RatingPresentation.${pres_id}.status == SCHEDULED"
            - "RatingEngagement.${eng_id}.status is still UNDER_REVIEW with assigned_rating null"
            - "after the clock advance: RatingPresentation.${pres_id}.status == HELD and RatingPresentation.${pres_cancelled_id}.status is still CANCELLED"
            - "third call: HTTP 200, RatingEngagement.${eng_id}.status == RATED with assigned_rating 'AA2' and outlook 'STABLE'"

      - name: liability_shares_may_not_exceed_the_whole_syndicate
        claim_type: aggregate_validation
        grounds:
          - validations[liability-shares-sum-to-whole] (priority 16, category business_fiscal)
          - errors[ERR_LIABILITY_PCT_SUM_INVALID]
        distinguishing_aspect: |
          Each member row is individually valid - 60.0000 and 45.0000 both sit inside the
          per-field range (0, 100] - but the COLLECTIVE sum 105.0000 breaks the whole, so the
          second add is refused; an add of exactly 40.0000, which lands the sum on 100.0000
          precisely, must be accepted. The same bound applies independently to
          takedown_share_pct.
        test_recipe:
          setup:
            - "A DRAFT deal has AU0001 seated as SENIOR_MANAGER with liability_pct 60.0000 and takedown_share_pct 60.0000."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/firms"
              payload: { name: "Alpha Underwriting", firm_type: "UNDERWRITER", msrb_registration_id: "AU0001" }
              as: ComplianceOfficer
              captures: { uw1_firm_id: $.data.id }
            - call: "POST /bond-offerings/firms"
              payload: { name: "Gamma Securities", firm_type: "UNDERWRITER", msrb_registration_id: "AU0002" }
              as: ComplianceOfficer
              captures: { uw2_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 5000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/syndicate-members"
              payload: { firm_id: "${uw1_firm_id}", member_role: "SENIOR_MANAGER", liability_pct: 60.0000, takedown_share_pct: 60.0000, priority_rank: 1 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { m1_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/deals/${deal_id}/syndicate-members"
              payload: { firm_id: "${uw2_firm_id}", member_role: "CO_MANAGER", liability_pct: 45.0000, takedown_share_pct: 40.0000, priority_rank: 2 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "POST /bond-offerings/deals/${deal_id}/syndicate-members"
              payload: { firm_id: "${uw2_firm_id}", member_role: "CO_MANAGER", liability_pct: 40.0000, takedown_share_pct: 45.0000, priority_rank: 2 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "POST /bond-offerings/deals/${deal_id}/syndicate-members"
              payload: { firm_id: "${uw2_firm_id}", member_role: "CO_MANAGER", liability_pct: 40.0000, takedown_share_pct: 40.0000, priority_rank: 2 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { m2_id: $.data.id }
          assert:
            - "first call: HTTP 422 with data.error_id == 'ERR_LIABILITY_PCT_SUM_INVALID' because liability would total 105.0000"
            - "second call: HTTP 422 with the same error_id because takedown_share_pct would total 105.0000"
            - "third call: HTTP 201, SyndicateMember.${m2_id}.liability_pct == 40.0000 and the deal's ACTIVE members now sum to exactly 100.0000 on both fields"
            - "SyndicateMember.${m1_id}.liability_pct is unchanged at 60.0000 after both refusals"

