  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: promo_window_halfopen_overlap_rejected
        grounds:
          - validations[priority=14]
          - entities.PromotionCampaign.fields.effective_from
          - entities.PromotionCampaign.fields.effective_to
          - errors[ERR_PROMO_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Half-open [from, to) interval semantics with NO buffer on PromotionCampaign: a second
          ACTIVE promo on the same category lane whose window overlaps the first is rejected, while
          a window that merely TOUCHES (new.from == existing.to) is allowed (half-open adjacency).
        test_recipe:
          setup:
            - "Promo P1 [2026-01-01, 2026-06-01) scope ALL exists; P3 [2026-06-01, 2026-09-01) merely touches (allowed); P2 [2026-05-01, 2026-09-01) overlaps (rejected)."
          setup_api_calls:
            - call: "POST /catalogs"
              payload: { name: "TIC", currency: "USD", price_lock_hours: 168, requote_tolerance_pct: 0.15, data_wipe_required_categories: [], recycle_floor_value_cents: 5000 }
              as: CatalogAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /catalogs/${cat_id}/promotion-campaigns"
              payload: { code: "P1", category_scope: "ALL", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z", bonus_pct: 0.10, bonus_flat_cents: 0, bonus_cap_cents: 6000 }
              as: CatalogAdmin
              captures: { p1: $.data.id }
            - call: "POST /catalogs/${cat_id}/promotion-campaigns"
              payload: { code: "P3", category_scope: "ALL", effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", bonus_pct: 0.10, bonus_flat_cents: 0, bonus_cap_cents: 6000 }
              as: CatalogAdmin
              captures: { p3: $.data.id }
          trigger:
            - call: "POST /catalogs/${cat_id}/promotion-campaigns"
              payload: { code: "P2", category_scope: "ALL", effective_from: "2026-05-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", bonus_pct: 0.10, bonus_flat_cents: 0, bonus_cap_cents: 6000 }
              as: CatalogAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PROMO_WINDOW_OVERLAP"
            - "GET /catalogs/${cat_id}/promotion-campaigns -> exactly 2 campaigns (P1, P3); P2 not created"

      - name: inspection_slot_buffered_closed_overlap_rejected
        grounds:
          - validations[priority=15]
          - entities.InspectionSlot.fields.slot_start
          - entities.InspectionSlot.fields.slot_end
          - errors[ERR_SLOT_OVERLAP]
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource (InspectionSlot): closed
          [start, end] PLUS a 30-minute buffer each side, so a slot starting only 15 minutes after
          the prior slot's end still collides — touching/near-adjacent bookings DO conflict, unlike
          the half-open no-buffer promo windows.
        test_recipe:
          setup:
            - "BOOKED SMARTPHONE slot [10:00, 11:00]; a new slot [11:15, 12:00] is within the 30-min buffer and overlaps."
          setup_api_calls:
            - call: "POST /catalogs"
              payload: { name: "TIC", currency: "USD", price_lock_hours: 168, requote_tolerance_pct: 0.15, data_wipe_required_categories: [], recycle_floor_value_cents: 5000 }
              as: CatalogAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /catalogs/${cat_id}/inspection-slots"
              payload: { lane_category: "SMARTPHONE", slot_start: "2026-06-10T10:00:00Z", slot_end: "2026-06-10T11:00:00Z" }
              as: GradingAgent
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /catalogs/${cat_id}/inspection-slots"
              payload: { lane_category: "SMARTPHONE", slot_start: "2026-06-10T11:15:00Z", slot_end: "2026-06-10T12:00:00Z" }
              as: GradingAgent
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SLOT_OVERLAP"
            - "GET /catalogs/${cat_id}/inspection-slots -> exactly 1 BOOKED slot on SMARTPHONE lane"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payout_reversal_conserves_lifetime_payout
        grounds:
          - state_machines.Payout.PAID_to_REVERSED
          - state_machines.TradeIn.ACCEPTED_to_PAID
          - calculations.wallet_settlement
          - entities.Customer.fields.lifetime_payout_cents
        distinguishing_aspect: |
          Conserved quantity #1: lifetime_payout_cents. Issuing a payout adds amount, reversing it
          subtracts the same amount, so an issue+reverse pair leaves lifetime_payout_cents at its
          pre-issue value (0) — pinned as lifetime_after == lifetime_before == 0.
        test_recipe:
          setup:
            - "FLAWLESS trade-in accepted at 60000; payout by ACH issued then reversed."
          setup_api_calls:
            - call: "POST /catalogs"
              payload: { name: "TIC", currency: "USD", price_lock_hours: 168, requote_tolerance_pct: 0.15, data_wipe_required_categories: [], recycle_floor_value_cents: 5000 }
              as: CatalogAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /catalogs/${cat_id}/device-models"
              payload: { manufacturer: "Acme", model_code: "PHN-1", category: "SMARTPHONE", base_value_cents: 60000, condition_multipliers: { FLAWLESS: 1.0, GOOD: 0.8, FAIR: 0.6, POOR: 0.35 }, defect_deductions: { CRACKED_SCREEN: 12000, BATTERY_DEGRADED: 4000, WATER_DAMAGE: 20000, MISSING_PARTS: 5000, WONT_POWER_ON: 15000, DENTED_BODY: 3000 } }
              as: CatalogAdmin
              captures: { dm_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "o@x.com", full_name: "O" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", device_model_id: "${dm_id}", declared_grade: "FLAWLESS", declared_defects: [], declared_powers_on: true }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_id: $.data.id }
            - call: "POST /trade-ins/${ti_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti_id}/ship-kit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti_id}/receive"
              payload: {}
              as: GradingAgent
            - call: "POST /trade-ins/${ti_id}/inspect"
              payload: { verified_grade: "FLAWLESS", verified_defects: [], verified_powers_on: true }
              as: GradingAgent
            - call: "POST /trade-ins/${ti_id}/payouts"
              payload: { method: "ACH" }
              as: FinanceOperator
              captures: { payout_id: $.data.id }
          trigger:
            - call: "POST /trade-ins/${ti_id}/payouts/${payout_id}/reverse"
              payload: {}
              as: FinanceOperator
          assert:
            - "GET /trade-ins/${ti_id}/payouts -> Payout.status == REVERSED"
            - "Customer.${cust_id}.lifetime_payout_cents == 0"

      - name: storecredit_reversal_conserves_wallet_balance
        grounds:
          - state_machines.Payout.PAID_to_REVERSED
          - calculations.wallet_settlement
          - entities.Customer.fields.wallet_balance_cents
        distinguishing_aspect: |
          DIFFERENT conserved quantity #2: wallet_balance_cents (store-credit ledger, not the
          lifetime aggregate). A STORE_CREDIT payout credits the wallet by amount; reversing it
          debits the same amount, leaving wallet_balance_cents back at its pre-issue value (0).
        test_recipe:
          setup:
            - "FLAWLESS trade-in accepted at 60000; STORE_CREDIT payout issued (wallet 60000) then reversed (wallet 0)."
          setup_api_calls:
            - call: "POST /catalogs"
              payload: { name: "TIC", currency: "USD", price_lock_hours: 168, requote_tolerance_pct: 0.15, data_wipe_required_categories: [], recycle_floor_value_cents: 5000 }
              as: CatalogAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /catalogs/${cat_id}/device-models"
              payload: { manufacturer: "Acme", model_code: "PHN-1", category: "SMARTPHONE", base_value_cents: 60000, condition_multipliers: { FLAWLESS: 1.0, GOOD: 0.8, FAIR: 0.6, POOR: 0.35 }, defect_deductions: { CRACKED_SCREEN: 12000, BATTERY_DEGRADED: 4000, WATER_DAMAGE: 20000, MISSING_PARTS: 5000, WONT_POWER_ON: 15000, DENTED_BODY: 3000 } }
              as: CatalogAdmin
              captures: { dm_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "p@x.com", full_name: "P" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", device_model_id: "${dm_id}", declared_grade: "FLAWLESS", declared_defects: [], declared_powers_on: true }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_id: $.data.id }
            - call: "POST /trade-ins/${ti_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti_id}/ship-kit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /trade-ins/${ti_id}/receive"
              payload: {}
              as: GradingAgent
            - call: "POST /trade-ins/${ti_id}/inspect"
              payload: { verified_grade: "FLAWLESS", verified_defects: [], verified_powers_on: true }
              as: GradingAgent
            - call: "POST /trade-ins/${ti_id}/payouts"
              payload: { method: "STORE_CREDIT" }
              as: FinanceOperator
              captures: { payout_id: $.data.id }
          trigger:
            - call: "POST /trade-ins/${ti_id}/payouts/${payout_id}/reverse"
              payload: {}
              as: FinanceOperator
          assert:
