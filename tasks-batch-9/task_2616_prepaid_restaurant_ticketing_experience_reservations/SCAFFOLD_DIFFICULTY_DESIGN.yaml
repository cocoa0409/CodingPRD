  - rule_id: compensating_invariant
    instances:

      - name: reservation_cash_ledger_conserved_through_forfeiture_reversal
        grounds:
          - calculations.payment_ledger_reconciliation
          - entities.PaymentTransaction.fields.signed_amount_cents
          - state_machines.Reservation.payment_status.FORFEITED_to_PARTIALLY_REFUNDED
        distinguishing_aspect: |
          Conserved quantity: cents on one Reservation's immutable ledger. The
          compensation is a FORFEITURE_REVERSAL row that undoes part of an
          earlier FORFEITURE without deleting it, so the reservation reaches the
          same net position by five append-only rows: I1 keeps the signed sum at
          0 and I2 keeps amount_paid equal to refunded plus forfeited across
          BOTH settlements. The reversal is what makes forfeited_cents a
          difference of two row kinds rather than a running total.
        test_recipe:
          setup:
            - "one restaurant with refund_scrutiny_threshold_cents 300000 so no scrutiny side effect interferes"
            - "one guest with a CONFIRMED party-of-2 reservation, grand_total 38610, deposit 11583 paid"
            - "the reservation cancelled at exactly 48 hours out on the STANDARD / DEPOSIT_BASIS ladder"
            - "a RefundException for 3000 cents filed by the guest and pending decision"
            - "logical clock at 2026-09-10T22:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /restaurants"
