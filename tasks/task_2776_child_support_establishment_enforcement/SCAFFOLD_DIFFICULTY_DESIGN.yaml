            - "Offer over 7 installments: pre_waiver 495000 + 8664 = 503664 -> tier ceiling 2000000 -> 0.50 -> waiver 4332, settlement 499332, monthly floor(499332/7) = 71333, final 499332 - 71333*6 = 71334."
            - "Accepted by the NCP at 2027-02-01 (next_installment_due_date 2027-03-01, written_off 4332, posture STAYED); one 71333 COMPROMISE_INSTALLMENT paid at 2027-02-01 moves the offer to ACTIVE and next_installment_due_date to 2027-04-01."
            - "Clock moved to 2027-04-02T00:00:00Z, one day past the second installment due date, and an accrual run posted."
