      - name: chargeback_won_restores_clawback_but_keeps_dispute_fee_conserved_gross
        grounds:
          - state_machines.Chargeback.RECEIVED_to_LOST
          - state_machines.Chargeback.REPRESENTED_to_WON
          - entities.Chargeback.fields.clawback_cents
          - entities.Chargeback.fields.dispute_fee_cents
        distinguishing_aspect: |
          Conserved quantity #2 (DIFFERENT type) = the order's reversible gross proceeds. A LOST
          chargeback debits full gross (clawback 20000) which a WON represent restores, but the flat
          dispute_fee_cents (1500) is NON-refundable by design. The invariant: net effect of
          represent-and-win on available balance equals the original proceeds minus exactly the
          1500 fee — gross is conserved, the fee is the only permanent loss.
        test_recipe:
          setup:
            - "Order gross 20000 matured AVAILABLE (proceeds +16340); chargeback RECEIVED (fee -1500), REPRESENTED, then WON"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformFinance
            - call: "POST /fee-schedules"
              payload: { category: "ELECTRONICS", commission_bps: 1500, fixed_fee_cents: 50, payment_processing_bps: 290, payment_processing_fixed_cents: 30, reserve_pct_standard: 0, reserve_pct_elevated: 20, reserve_pct_high: 50, maturation_days: 7 }
              as: PlatformFinance
            - call: "POST /sellers"
              payload: { legal_name: "Sierra LLC", email: "sierra@x.com", country_code: "US", tax_classification: "LLC", tin_last4: "2121" }
              as: PlatformReviewer
              captures: { seller_id: $.data.id }
            - call: "POST /orders"
              payload: { seller_id: "${seller_id}", category: "ELECTRONICS", gross_amount_cents: 20000 }
              as: PlatformFinance
              captures: { order_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: PlatformFinance
            - call: "POST /chargebacks"
              payload: { order_id: "${order_id}" }
              as: PlatformFinance
              captures: { cb_id: $.data.id }
            - call: "POST /chargebacks/${cb_id}/represent"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
          trigger:
            - call: "POST /chargebacks/${cb_id}/decision"
              payload: { outcome: "WON" }
              as: PlatformFinance
              as_user_id: "finance-2"
          assert:
            - "Chargeback.${cb_id}.chargeback_status == WON"
            - "Chargeback.${cb_id}.dispute_fee_cents == 1500"
            - "Seller.${seller_id}.available_balance_cents == 14840"
