          - entities.PreSaleContract.fields.negotiation_status
          - entities.PreSaleContract.fields.delivery_status
          - entities.PreSaleContract.fields.collection_status
          - calculations.license_and_holdback_dates.constants.MAX_NEGOTIATION_ROUNDS
          - validations[priority=94]
        distinguishing_aspect: |
          A different flavour of non-linearity from the Film instance: three INDEPENDENT status axes
          on one row plus a bounded loop on only one of them. OFFERED -> COUNTERED -> OFFERED runs
          twice, each pass rewriting minimum_guarantee_usd and re-deriving all four milestone
          amounts, and the loop is terminated by a counter at negotiation_round == 4 that returns
          ERR_NEGOTIATION_ROUND_LIMIT (422) while leaving negotiation_status at OFFERED. Meanwhile
          delivery_status never leaves PENDING and collection_status moves UNPAID ->
