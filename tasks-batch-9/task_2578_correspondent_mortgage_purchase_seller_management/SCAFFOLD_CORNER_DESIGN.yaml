      - name: mandatory_exposure_aggregate_admits_the_exact_limit_and_is_freed_by_pair_off
        claim_type: violation_to_error
        grounds:
          - validations[priority 67]
          - state_machines[Commitment LOCKED -> PAIRED_OFF]
        distinguishing_aspect: |
          Two 1500000000 MANDATORY lines land the seller EXACTLY on its
          3000000000 exposure limit and both are accepted; the next MANDATORY
          line is refused while a BEST_EFFORTS line of the same size is waved
          through (only MANDATORY notional counts); pairing off one line
          releases its full notional and the refused lock then succeeds.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "product CONF30F ${p_conf} with no pricing adjustments"
            - "CHAIN-APPROVED seller ${s1}: STANDARD tier, mandatory_exposure_limit_cents 3000000000"
            - "MANDATORY lines are given touching windows (08-01 -> 08-31, 08-31 -> 09-30, 09-30 -> 10-30) so the overlap rule at priority 47 never fires"
          setup_api_calls:
            - call: "POST /correspondent/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
            - call: "POST /correspondent/products"
              payload: { product_code: "CONF30F", base_price_pct: 101.250, min_fico: 680, max_ltv_pct: 95.0, max_loan_amount_cents: 76650000, allowed_commitment_types: ["MANDATORY", "BEST_EFFORTS"], allowed_occupancies: ["PRIMARY", "SECOND_HOME"], srp_pct: 1.250 }
