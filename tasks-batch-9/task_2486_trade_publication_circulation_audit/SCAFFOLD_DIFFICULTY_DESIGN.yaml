scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: breakdown_basis_variant_divergence_on_recompute
        grounds:
          - calculations.statement_circulation_breakdown
          - calculations.controlled_copies_cap_allowance
          - entities.CirculationStatement.fields.basis
          - entities.CirculationStatement.fields.total_qualified_copies
          - entities.SourceDocument.fields.purge_status
        distinguishing_aspect: |
          The two variants differ in the EVIDENCE GATE, not in the population filter: AS_OF_PERIOD_END
          counts every deliverable recipient whose qualification window spans period_end, while
          AUDIT_VERIFIED additionally demands a RETAINED source document, and dropping a recipient
          also shrinks `core`, which re-derives a smaller controlled_allowance — so the same three
          recipients report 1200 copies under one basis and 800 under the other, a 400-copy delta
          that is strictly larger than the 300 purged copies.
        test_recipe:
          setup:
            - "publication with controlled_cap_pct 25.00, source_doc_retention_months 36 and all three qualification rules defined"
            - "three DELIVERABLE recipients qualified at the default clock 2026-08-01: 600 PAID copies, 300 QUALIFIED_NON_PAID copies, 400 CONTROLLED copies"
            - "logical clock moved to 2026-10-01 so the statement period [2026-07-01, 2026-09-01) has closed"
            - "a DRAFT statement exists for that period on basis AS_OF_PERIOD_END"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Industrial Plant Weekly", frequency: "WEEKLY", industry_code: "MANUFACTURING", qualification_validity_months: 36, renewal_grace_days: 90, source_doc_retention_months: 36, undeliverable_restrict_pct: 5.00, materiality_pct: 2.00, controlled_cap_pct: 25.00 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "JOB_FUNCTION", allowed_values: ["ENGINEERING_MGMT", "PLANT_MGMT"], points: 45, is_mandatory: true }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "INDUSTRY", allowed_values: ["MANUFACTURING", "UTILITIES"], points: 30, is_mandatory: false }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "PURCHASING_AUTHORITY", allowed_values: ["SPECIFIES", "APPROVES"], points: 25, is_mandatory: false }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Acme Fabrication", contact_email: "a@acme.test", job_function_code: "ENGINEERING_MGMT", industry_code: "MANUFACTURING", purchasing_authority_level: "APPROVES", subscription_class: "PAID", copies: 600, paid_amount_cents: 12000 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_a_id: $.data.id, sub_a_ver: $.data.version }
            - call: "POST /circulation/subscribers/${sub_a_id}/source-documents"
              payload: { doc_type: "SIGNED_REQUEST_CARD", captured_at: "2026-07-15T00:00:00Z", storage_ref: "s3://circ/a-card" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { doc_a_id: $.data.id }
            - call: "POST /circulation/qualification-requests"
              payload: { subscriber_id: "${sub_a_id}", source_document_id: "${doc_a_id}", request_channel: "DIRECT_MAIL", signed_at: "2026-07-01T00:00:00Z", attested_job_function_code: "ENGINEERING_MGMT", attested_industry_code: "MANUFACTURING", attested_purchasing_authority: "APPROVES", expected_subscriber_version: "${sub_a_ver}" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { req_a_id: $.data.id }
            - call: "POST /circulation/qualification-requests/${req_a_id}/review"
              payload: { review_note: "documentation complete" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
            - call: "POST /circulation/qualification-requests/${req_a_id}/verify"
              payload: { decision_reason: "qualified on job function and authority" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Borealis Utilities", contact_email: "b@borealis.test", job_function_code: "PLANT_MGMT", industry_code: "UTILITIES", purchasing_authority_level: "SPECIFIES", subscription_class: "QUALIFIED_NON_PAID", copies: 300 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_b_id: $.data.id, sub_b_ver: $.data.version }
            - call: "POST /circulation/subscribers/${sub_b_id}/source-documents"
              payload: { doc_type: "WEB_FORM_CAPTURE", captured_at: "2026-07-15T00:00:00Z", storage_ref: "s3://circ/b-form" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { doc_b_id: $.data.id }
            - call: "POST /circulation/qualification-requests"
              payload: { subscriber_id: "${sub_b_id}", source_document_id: "${doc_b_id}", request_channel: "DIRECT_MAIL", signed_at: "2026-07-01T00:00:00Z", attested_job_function_code: "PLANT_MGMT", attested_industry_code: "UTILITIES", attested_purchasing_authority: "SPECIFIES", expected_subscriber_version: "${sub_b_ver}" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { req_b_id: $.data.id }
            - call: "POST /circulation/qualification-requests/${req_b_id}/review"
              payload: { review_note: "documentation complete" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
            - call: "POST /circulation/qualification-requests/${req_b_id}/verify"
              payload: { decision_reason: "qualified" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Cedar Tooling", contact_email: "c@cedar.test", job_function_code: "ENGINEERING_MGMT", industry_code: "MANUFACTURING", purchasing_authority_level: "APPROVES", subscription_class: "CONTROLLED", copies: 400 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_c_id: $.data.id, sub_c_ver: $.data.version }
            - call: "POST /circulation/subscribers/${sub_c_id}/source-documents"
              payload: { doc_type: "EMAIL_CONFIRMATION", captured_at: "2026-07-15T00:00:00Z", storage_ref: "s3://circ/c-email" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { doc_c_id: $.data.id }
            - call: "POST /circulation/qualification-requests"
              payload: { subscriber_id: "${sub_c_id}", source_document_id: "${doc_c_id}", request_channel: "DIRECT_MAIL", signed_at: "2026-07-01T00:00:00Z", attested_job_function_code: "ENGINEERING_MGMT", attested_industry_code: "MANUFACTURING", attested_purchasing_authority: "APPROVES", expected_subscriber_version: "${sub_c_ver}" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { req_c_id: $.data.id }
            - call: "POST /circulation/qualification-requests/${req_c_id}/review"
              payload: { review_note: "documentation complete" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
            - call: "POST /circulation/qualification-requests/${req_c_id}/verify"
              payload: { decision_reason: "qualified" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "GET /circulation/publications/${pub_id}"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_ver_1: $.data.version }
            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", basis: "AS_OF_PERIOD_END", expected_publication_version: "${pub_ver_1}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { st1_id: $.data.id, as_of_total: $.data.total_qualified_copies }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-07-15T00:00:00Z" }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/source-documents/${doc_b_id}/purge"
              payload: { purge_reason: "retention elapsed" }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/statements/${st1_id}/recompute"
              payload: { basis: "AUDIT_VERIFIED" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { audited_total: $.data.total_qualified_copies }
          assert:
            - "${as_of_total} == 1200"
            - "under AS_OF_PERIOD_END the statement recorded paid_copies == 600, qualified_non_paid_copies == 300, controlled_copies_included == 300, controlled_copies_excess == 100"
            - "${audited_total} == 800"
            - "under AUDIT_VERIFIED CirculationStatement.${st1_id}.paid_copies == 600, qualified_non_paid_copies == 0, controlled_copies_included == 200, controlled_copies_excess == 200"
            - "CirculationStatement.${st1_id}.statement_type == AUDITED after the switch (it was PUBLISHER_STATEMENT before)"
            - "the 400-copy delta exceeds the 300 purged copies, proving controlled_allowance was re-derived from core 600 (allowance 200) rather than held at 300"
            - "SourceDocument.${doc_b_id}.purge_status == PURGED and Subscriber.${sub_b_id}.qualification_status is still QUALIFIED"

      - name: digital_reach_gross_versus_deduplicated_divergence
        grounds:
          - calculations.digital_combined_reach
          - entities.DigitalAudienceSnapshot.fields.combined_reach_gross
          - entities.DigitalAudienceSnapshot.fields.combined_reach_deduplicated
          - entities.DigitalAudienceSnapshot.fields.overlap_pct
        distinguishing_aspect: |
          A second, structurally independent dual-variant site in a different entity: both variants
          are written on the SAME row from identical inputs, and they differ only by the overlap
          discount applied to newsletter opens BEFORE the addition (round_half_up of 12500 * 85 / 100
          = 10625, not a post-sum discount of 60500), so 60500 and 58625 must both be observable.
        test_recipe:
          setup:
            - "a publication exists"
            - "logical clock moved to 2026-10-01 so the measurement window [2026-07-01, 2026-08-01) has closed"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Industrial Plant Weekly", frequency: "WEEKLY", industry_code: "MANUFACTURING" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: CirculationManager
              as_user_id: "mgr-01"
          trigger:
            - call: "POST /circulation/publications/${pub_id}/digital-snapshots"
              payload: { window_start: "2026-07-01T00:00:00Z", window_end: "2026-08-01T00:00:00Z", website_unique_visitors: 48000, newsletter_sends: 40000, newsletter_unique_opens: 12500, overlap_pct: 15.00, source: "THIRD_PARTY_CERTIFIED" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { snap_id: $.data.id, gross: $.data.combined_reach_gross, dedup: $.data.combined_reach_deduplicated }
          assert:
            - "${gross} == 60500"
            - "${dedup} == 58625"
            - "the two variants differ by exactly 1875, which equals round_half_up(12500 * 15.00 / 100, 0)"
            - "DigitalAudienceSnapshot.${snap_id}.status == RECORDED (neither variant is admissible into a statement before validation)"

  - rule_id: combinatorial_formula
    instances:
      - name: makegood_credit_rounding_order_per_insertion_then_multiply
        grounds:
          - calculations.rate_base_shortfall_makegood
          - entities.MakeGoodObligation.fields.per_insertion_credit_cents
          - entities.MakeGoodObligation.fields.credit_cents
          - entities.AdvertiserContract.fields.makegood_credit_available_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding whose ORDER changes the result: rounding to whole cents per
          insertion and then multiplying by 12 insertions yields 4808796, while the equally plausible
          multiply-then-round order yields 4808790. The 6-cent gap is only reachable because
          per_insertion_credit_cents lands on a .5 boundary (400732.5 -> 400733).
