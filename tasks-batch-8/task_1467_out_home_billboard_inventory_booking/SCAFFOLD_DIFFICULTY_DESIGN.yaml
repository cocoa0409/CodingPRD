            - { call: "POST /api/faces", payload: { face_code: "F-NYC-002", structure_code: "ST-002", market_code: "NYC", display_type: "STATIC", illuminated: false, daily_traffic_count: 50000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f2: $.data.id } }
            - { call: "POST /api/faces", payload: { face_code: "F-NYC-003", structure_code: "ST-003", market_code: "NYC", display_type: "STATIC", illuminated: false, daily_traffic_count: 50000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f3: $.data.id } }
            - { call: "POST /api/permits", payload: { face_id: "${f1}", permit_number: "P-001", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /api/permits", payload: { face_id: "${f2}", permit_number: "P-002", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
