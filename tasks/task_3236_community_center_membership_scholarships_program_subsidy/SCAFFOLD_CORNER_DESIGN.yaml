            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 1000000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
            - call: "POST /categories"
              payload: { branch_id: "${branch_id}", name: "Adult", household_type: "ADULT", joining_fee_cents: 0, monthly_dues_cents: 8000, max_adults: 1, max_dependents: 0 }
              as: BranchDirector
              captures: { cat_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Pat Member", email: "pat@x.com", birth_date: "1990-04-01", home_branch_id: "${branch_id}" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /memberships"
              payload: { branch_id: "${branch_id}", category_id: "${cat_id}", primary_member_id: "${member_id}", member_ids: ["${member_id}"] }
              as: FrontDesk
              captures: { mship_id: $.data.id }
          trigger:
            - call: "POST /memberships/${mship_id}/hold"
              payload: { hold_until: "2026-09-21" }
              as: Member
              as_user_id: "${member_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /memberships/${mship_id}/hold"
              payload: { hold_until: "2027-03-20" }
              as: Member
              as_user_id: "${member_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "20-day hold returns 409 ERR_HOLD_WINDOW_INVALID"
            - "200-day hold returns 409 ERR_HOLD_WINDOW_INVALID"
            - "Membership.${mship_id}.status remains ACTIVE"

      - name: participant_age_outside_gate_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_8
          - errors.ERR_PARTICIPANT_AGE_INVALID
        distinguishing_aspect: "A swim program with max_age 12 rejects a 30-year-old participant with ERR_PARTICIPANT_AGE_INVALID; the age is computed at session start_on, not at registration time."
        test_recipe:
          setup:
            - "Clock 2026-09-10. Branch, pool space, SWIM_LESSON program min_age 3 max_age 12, session REG_OPEN."
          setup_api_calls:
