      - name: deed_restriction_compliance_cycle_ends_in_a_terminated_state_that_locks_out_actions
        claim_type: terminal_state_lockdown
        grounds:
          - validations.priority_33
          - validations.priority_44
          - validations.priority_65
          - validations.priority_66
