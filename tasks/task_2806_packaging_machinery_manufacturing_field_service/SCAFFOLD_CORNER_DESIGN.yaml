  - section: cross_cutting_complexity_layers
    instances:
      - name: build_slot_create_with_stale_order_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[build-slot-create-stale-order]
          - endpoints[POST /packaging-oem/build-slots]
          - errors[ERR_STALE_ORDER_VERSION]
        distinguishing_aspect: |
          The §1.2.1 rule's own write_endpoint and occ_field: the planner reads the order's version right
          after engineering, sales then advances the commercial dimension (bumping version), and the
          planner's slot create carries the now-stale token. Must be 412 with no BuildSlot row created
          and no change to ProductionLine.committed_slot_days.
        test_recipe:
          setup:
            - "one ENGINEERED MachineOrder whose commercial_status has since advanced to PO_RECEIVED"
            - "one OPEN FILLER line"
          setup_api_calls:
            - call: "POST /packaging-oem/customers"
              payload: { legal_name: "Northwind Beverages", region_code: "NA", product_variation_pct: 4.00 }
              as: PlatformAdmin
