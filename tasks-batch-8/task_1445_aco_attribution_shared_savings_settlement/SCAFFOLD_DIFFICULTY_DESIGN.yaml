  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: conflict_state_beats_temporal_on_claim_create
        grounds:
          - validations[priority=6]
          - validations[priority=11]
        distinguishing_aspect: |
          Pair {state, business_temporal}: a claim create that violates BOTH the period
          posture gate (period still SETUP) and the temporal rule (service_date 2027-05-01
          outside the 2026 span) MUST surface ERR_PERIOD_NOT_OPEN (priority 5), not
          ERR_DATE_OUTSIDE_PERIOD (priority 10).
        test_recipe:
          setup:
            - "Period in SETUP (never opened); one beneficiary exists"
          setup_api_calls:
            - { call: "POST /aco/agreement-periods", payload: { aco_tax_id: "ACO-PC1", aco_name: "PC1", performance_start_date: "2026-01-01", performance_end_date: "2026-12-31", track: "ONE_SIDED" }, as: AcoAdministrator, captures: { p1: $.data.id } }
            - { call: "POST /aco/beneficiaries", payload: { medicare_id: "MBI-PC1", birth_year: 1980 }, as: AcoAdministrator, captures: { b1: $.data.id } }
          trigger:
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${b1}", service_date: "2027-05-01", allowed_amount_cents: 1000, claim_type: "PART_A" }, as: ClaimsProcessor, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_PERIOD_NOT_OPEN'  (state priority 5 beats business_temporal priority 10)"

      - name: conflict_safety_beats_temporal_on_claim_create
        grounds:
          - validations[priority=9]
          - validations[priority=11]
        distinguishing_aspect: |
          Pair {business_safety, business_temporal} — a different category pair than
          {state, business_temporal}: a claim create for an opted-out beneficiary with an
          out-of-span service_date MUST surface ERR_BENEFICIARY_OPTED_OUT (priority 8), not
          ERR_DATE_OUTSIDE_PERIOD (priority 10).
        test_recipe:
          setup:
            - "Period OPEN; beneficiary BO has an OPT_OUT election effective 2026-01-01"
          setup_api_calls:
            - { call: "POST /aco/agreement-periods", payload: { aco_tax_id: "ACO-PC2", aco_name: "PC2", performance_start_date: "2026-01-01", performance_end_date: "2026-12-31", track: "ONE_SIDED" }, as: AcoAdministrator, captures: { p1: $.data.id } }
            - { call: "POST /aco/beneficiaries", payload: { medicare_id: "MBI-PC2", birth_year: 1980 }, as: AcoAdministrator, captures: { bo: $.data.id } }
            - { call: "POST /aco/agreement-periods/${p1}/open", payload: {}, as: AcoAdministrator }
            - { call: "POST /aco/beneficiaries/${bo}/data-sharing-elections", payload: { direction: "OPT_OUT", effective_date: "2026-01-01" }, as: AcoAdministrator }
          trigger:
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${bo}", service_date: "2027-05-01", allowed_amount_cents: 1000, claim_type: "PART_A" }, as: ClaimsProcessor, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_BENEFICIARY_OPTED_OUT'  (safety priority 8 beats temporal priority 10)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: truncation_at_exact_cap_vs_one_cent_over
        grounds:
          - calculations.expenditure_aggregation_with_truncation
          - entities.ClaimLine.fields.allowed_amount_cents
        distinguishing_aspect: |
          Metric: per-beneficiary truncated cents, endpoint GET expenditure-summary.
          Beneficiary B1 totals exactly 20000000 (== TRUNCATION_CAP_CENTS) and is NOT
          truncated; beneficiary B2 totals 20000001 and IS truncated by exactly 1 cent —
          the boundary is strict-greater, verified in one aggregate read.
        test_recipe:
          setup:
            - "Locked period; B1 claims 10000(PART_B)+9000000+9000000+1990000 = 20000000 exactly; B2 claims 10000(PART_B)+9000000+9000000+1990001 = 20000001; both FINAL-attributed"
          setup_api_calls:
