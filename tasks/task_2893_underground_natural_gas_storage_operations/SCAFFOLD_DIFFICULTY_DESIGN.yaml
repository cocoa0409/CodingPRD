  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: ticket_state_priority_7_wins_over_well_safety_priority_11_and_12
        grounds:
          - validations.priority_7_ERR_INVALID_TICKET_STATE
          - validations.priority_11_ERR_WELL_INTEGRITY_FAILED
          - validations.priority_12_ERR_WELL_NOT_IN_SERVICE
        distinguishing_aspect: |
          After the MIT failure the well is simultaneously MIT_FAILED (priority 11) and SHUT_IN (priority 12),
          and the already-CONFIRMED ticket also breaks the state gate (priority 7). Re-confirming that ticket
          must surface ERR_INVALID_TICKET_STATE, not either safety error; the paired call in the same world —
          confirming a still-PENDING ticket on the very same well — surfaces ERR_WELL_INTEGRITY_FAILED, proving
          the ordering rather than a hard-coded response. An implementation that checks the well before the
          ticket status returns ERR_WELL_INTEGRITY_FAILED for both calls.
        test_recipe:
          setup:
            - "Field F_STD with two wells: AUR-1 rated 600000 Dth/day and AUR-2 rated 60000 Dth/day, so failing AUR-1 leaves one well in service and the posture RESTRICTED (never FROZEN, which would outrank priority 11)."
            - "One FIRM contract, ACTIVE."
            - "Ticket T1: nomination 80000 Dth INJECTION for gas day 2026-08-02, ticket metering 80000 Dth, already CONFIRMED."
            - "Ticket T2: nomination 50000 Dth INJECTION for gas day 2026-08-11, ticket metering 50000 Dth, left PENDING."
            - "A SCHEDULED MIT on AUR-1 spanning 2026-08-10T00:00Z..06:00Z is failed at clock 2026-08-10T12:00:00Z, which shuts AUR-1 in and marks it MIT_FAILED."
