          Priority 60 makes over-remittance impossible one report at a time, so the only way to reach ERR_FEE_LEDGER_INCONSISTENT is a NEGATIVE fee_true_up_cents: the September reconciliation lowers fee_assessed_cents_total from 541 to 540 after 541 was already remitted, leaving fee_outstanding_cents at -1, and the October report's exact 180-cent remittance - which satisfies priority 60 - would drive the contract ledger further below zero and is refused.
