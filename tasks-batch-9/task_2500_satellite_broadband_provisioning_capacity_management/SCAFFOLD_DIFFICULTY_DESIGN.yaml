  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: activation_admitted_when_projected_ratio_lands_exactly_on_oversubscription_limit
        grounds:
          - calculations.beam_weighted_oversubscription
          - validations[priority=36]
          - entities.Beam.fields.oversubscription_ratio
          - endpoints["POST /satellite-broadband/subscriptions"]
        distinguishing_aspect: |
          Boundary 1 of 3 — a non-integer ratio metric on POST /satellite-broadband/subscriptions:
          projected_ratio == 4.0 equals oversubscription_limit exactly, and the declared test is
          `REJECT when projected_ratio > limit`, so the activation must succeed (201) and land the beam
          in CONSTRAINED, not be rejected with ERR_BEAM_OVERSUBSCRIBED.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; licence ACTIVE+COORDINATED; beam BEAM-01 forward_capacity_mbps 100 oversubscription_limit 4.0; cell CELL-001 max_active_terminals 2; plan PLAN-P1-200 (200 Mbps, PRIORITY_1)."
            - "One subscription is PENDING_ACTIVATION on CELL-001, so weighted_sold_mbps == 200.0 and oversubscription_ratio == 2.0 (NORMAL, since 2.0 <= 0.75 x 4.0 == 3.0)."
            - "Subscriber B holds a RESERVED order on CELL-001 and an INSTALLED terminal TRM-0002; the cell still has one free slot."
          setup_api_calls:
            - call: "POST /satellite-broadband/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkOpsEngineer
            - call: "POST /satellite-broadband/spectrum-licenses"
              payload: { license_code: "LIC-US-CA-KA-01", jurisdiction_code: "US-CA", frequency_band: "KA_FORWARD", max_eirp_dbw: 62.5, expires_at: "2027-12-31T00:00:00Z", consumer_disclosure_version: "CD-2026.1", in_motion_permitted: true }
              as: ComplianceOfficer
