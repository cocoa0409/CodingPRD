  # ===========================================================================
  # Rule 3 — non_linear_state_machine (3 instances, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: training_recertification_cycle
        grounds:
          - state_machines.TrainingRecord.CERTIFIED_to_EXPIRED
          - state_machines.TrainingRecord.EXPIRED_to_ENROLLED
          - calculations.training_expiry
        distinguishing_aspect: |
          TrainingRecord is cyclic: ENROLLED -> CERTIFIED -> EXPIRED (derived at
          the 12-month boundary) -> ENROLLED -> CERTIFIED again, with
          certified_at/expires_at cleared on re-enroll and re-stamped on
          recertification.
        test_recipe:
          setup:
            - "User u1 and instrument i1 exist; u1 ENROLLED then CERTIFIED at the default clock 2026-08-01T00:00:00Z (expires_at 2027-08-01T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL", is_pi: true }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /training-records", payload: { user_id: "${u1}", instrument_id: "${i1}" }, as: CoreStaff, as_user_id: "staff-1", captures: { t1: $.data.id } }
            - { call: "POST /training-records/${t1}/certify", payload: {}, as: CoreStaff, as_user_id: "staff-1", captures: { exp1: $.data.expires_at } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-01T00:00:00Z" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "GET /training-records/${t1}", payload: {}, as: CoreStaff, as_user_id: "staff-1", captures: { st_expired: $.data.status } }
            - { call: "POST /training-records/${t1}/re-enroll", payload: {}, as: CoreStaff, as_user_id: "staff-1", captures: { st_enrolled: $.data.status, cert_null: $.data.certified_at } }
            - { call: "POST /training-records/${t1}/certify", payload: {}, as: CoreStaff, as_user_id: "staff-1", captures: { st_cert: $.data.status, exp2: $.data.expires_at } }
          assert:
            - "At the default clock the record was CERTIFIED with expires_at == 2027-08-01T00:00:00Z"
            - "With the clock exactly AT 2027-08-01T00:00:00Z the record reports status == EXPIRED (>= boundary)"
            - "After re-enroll: status == ENROLLED and certified_at == null and expires_at == null"
            - "After the second certify: status == CERTIFIED with certified_at == 2027-08-01T00:00:00Z and expires_at == 2028-08-01T00:00:00Z — full cycle traversed"

      - name: recharge_entry_dispute_cycle
        grounds:
          - state_machines.RechargeEntry.BILLED_to_DISPUTED
          - state_machines.RechargeEntry.DISPUTED_to_BILLED
          - state_machines.RechargeEntry.DISPUTED_to_WRITTEN_OFF
        distinguishing_aspect: |
          RechargeEntry loops BILLED -> DISPUTED -> BILLED (UPHOLD clears the
          reason, ledger untouched) and can iterate; the compensating exit
          DISPUTED -> WRITTEN_OFF credits the grant and posts a -15000
          ADJUSTMENT into the next OPEN batch.
