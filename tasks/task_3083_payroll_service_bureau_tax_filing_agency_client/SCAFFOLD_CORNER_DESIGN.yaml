  # ===========================================================================
  - section: endpoints
    instances:

      - name: ep_initiate_impound_action_creates_child
        claim_type: action_endpoint
        grounds: ["endpoints.POST_/payroll-runs/{runId}/initiate-impound", entities.Impound]
        distinguishing_aspect: "The action endpoint returns 201 with the created Impound whose amount equals the run's impound_amount_cents and whose due_by is initiated_at + 2 business days (default clock Tuesday 2026-09-01 -> due 2026-09-03)."
        test_recipe:
          setup: ["Clock at default. Client ACTIVE; run SUBMITTED."]
          setup_api_calls:
            - *ck_jfed
            - *ck_client
            - *ck_onboard
            - *ck_reg_fed
            - *ck_verify
            - *ck_activate
            - *ck_run
            - *ck_submit
            - *ck_clv
          trigger:
            - call: "POST /payroll-runs/${ck_run}/initiate-impound"
              payload: { expected_client_version: "${ck_clv}" }
              as: ClientPayrollAdmin
              as_user_id: "${ck_cl}"
              captures: { aep_imp: $.data.id, aep_amt: $.data.amount_cents, aep_due: $.data.due_by }
          assert:
            - "the response status is 201"
            - "aep_amt == 1200000"
            - "aep_due date portion == 2026-09-03"
            - "Impound.${aep_imp}.status == PENDING and PayrollRun.${ck_run}.status == IMPOUNDED"

      - name: ep_summary_is_computed_read
        claim_type: computed_read
        grounds: ["endpoints.GET_/clients/{clientId}/wage-statements/summary"]
        distinguishing_aspect: "Excluded: the summary endpoint's computed totals and both variants are asserted in the §1.8 wage-summary instance."
        excluded_because:
          difficulty_instance: wage_summary_as_issued_vs_as_filed_history
          rationale: "Computed-read totals pinned there with literal values."

      - name: ep_registrations_filtered_list_reverse_reaches_children
        claim_type: computed_read
        grounds: ["endpoints.GET_/clients/{clientId}/registrations", entities.JurisdictionRegistration.fields.client_id]
        distinguishing_aspect: "The sub-resource list returns exactly the client's registrations and supports the status filter: after one verification, ?status=VERIFIED returns 1 row and ?status=PENDING returns 0."
        test_recipe:
          setup: ["Clock at default. Client with one VERIFIED registration."]
          setup_api_calls:
            - *ck_jfed
            - *ck_client
            - *ck_onboard
            - *ck_reg_fed
            - *ck_verify
          trigger:
            - call: "GET /clients/${ck_cl}/registrations"
              payload: { status: "VERIFIED" }
              as: BureauOnboarder
            - call: "GET /clients/${ck_cl}/registrations"
              payload: { status: "PENDING" }
              as: BureauOnboarder
          assert:
            - "the VERIFIED-filtered list returns exactly 1 row (id == ${ck_reg})"
            - "the PENDING-filtered list returns 0 rows"

      - name: ep_funding_failures_subresource_lists_strikes
        claim_type: computed_read
        grounds: ["endpoints.GET_/clients/{clientId}/funding-failures", entities.FundingFailureEvent.fields.client_id]
        distinguishing_aspect: "After one NSF fail, the sub-resource returns 1 unresolved row whose strike_count_after == 1; after treasury resolves it, ?resolved=false returns 0 rows and the client posture recomputes to NORMAL."
        test_recipe:
          setup: ["Clock at default. Client ACTIVE; run IMPOUNDED; impound FAILED (1 strike)."]
          setup_api_calls:
            - *ck_jfed
            - *ck_client
            - *ck_onboard
            - *ck_reg_fed
            - *ck_verify
            - *ck_activate
            - *ck_run
            - *ck_submit
            - *ck_clv
            - *ck_impound
            - call: "POST /impounds/${ck_imp}/fail"
              payload: {}
              as: BureauTreasury
          trigger:
            - call: "GET /clients/${ck_cl}/funding-failures"
              payload: { resolved: false }
              as: BureauTreasury
              captures: { ff_count1: "$.data[0].strike_count_after" }
            - call: "GET /clients/${ck_cl}/funding-failures"
              payload: {}
              as: BureauTreasury
              captures: { ff_ev: "$.data[0].id" }
            - call: "POST /funding-failures/${ff_ev}/resolve"
              payload: {}
              as: BureauTreasury
            - call: "GET /clients/${ck_cl}/funding-failures"
              payload: { resolved: false }
              as: BureauTreasury
            - call: "GET /clients/${ck_cl}"
              payload: {}
              as: BureauCompliance
              captures: { ff_posture: $.data.risk_posture }
          assert:
            - "first unresolved-filtered list returns 1 row and ff_count1 == 1"
            - "after resolve, the unresolved-filtered list returns 0 rows"
            - "ff_posture == NORMAL (cure resets the weighted base to 0)"

      - name: ep_cross_client_submit_forbidden
        claim_type: action_endpoint
        grounds: ["endpoints.POST_/payroll-runs/{runId}/submit", "validations[priority=3]", errors.ERR_FORBIDDEN]
        distinguishing_aspect: "ClientPayrollAdmin of client B cannot submit client A's run: 403 ERR_FORBIDDEN — entity-backed identity is enforced on action endpoints, not just reads."
        test_recipe:
          setup: ["Clock at default. Client A ACTIVE with a DRAFT run; client B exists."]
          setup_api_calls:
            - *ck_jfed
            - *ck_client
            - *ck_onboard
            - *ck_reg_fed
            - *ck_verify
            - *ck_activate
            - *ck_run
            - call: "POST /clients"
              payload: { legal_name: "Other Client", ein: "00-0000040" }
              as: BureauOnboarder
              captures: { other_cl: $.data.id }
          trigger:
            - call: "POST /payroll-runs/${ck_run}/submit"
              payload: {}
              as: ClientPayrollAdmin
              as_user_id: "${other_cl}"
              captures: { err_xc: $.data.error_id }
          assert:
            - "the response status is 403 and err_xc == ERR_FORBIDDEN"
            - "PayrollRun.${ck_run}.status == DRAFT (unchanged)"

