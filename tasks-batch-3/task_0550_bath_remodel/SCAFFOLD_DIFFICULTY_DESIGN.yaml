  - rule_id: compensating_invariant
    instances:
      - name: crew_slot_conserved_after_book_then_cancel
        grounds:
          - calculations.crew_available_slots
          - state_machines.InstallBooking.BOOKED_to_CANCELLED
          - entities.InstallBooking.fields.status
        distinguishing_aspect: >
          Crew max_installs_per_day=1: booking P1 fills the 2026-06-01 slot, cancelling P1
          releases it, and P2 can then be booked for the same crew and date — the available
          slot count (max - BOOKED) is conserved across the book+cancel round trip.
        test_recipe:
          setup:
            - "Crew max_installs_per_day=1; two INSTALL_READY projects P1 and P2; P1 booked on 2026-06-01 then that booking cancelled"
          setup_api_calls:
