      - name: driver_settlement_self_vs_other
        claim_type: rbac_deny
        grounds: ["roles", "validations[priority=3]", "errors[ERR_OWNERSHIP_MISMATCH]"]
        distinguishing_aspect: "GET weekly-settlement is shared but scoped: the driver may read his OWN settlement, the owning distributor may read it, but another driver or another distributor gets ERR_OWNERSHIP_MISMATCH."
        test_recipe:
          setup: ["Distributor D1 with drivers DR1/DR2 and distributor D2; no deliveries needed (zero settlement is still readable)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/distributors"
              payload: { name: "Dairy Dist FB", license_number: "LIC-FB-1" }
              as: TerritoryManager
              captures: { d1: "$.data.id" }
            - call: "POST /dairy/distributors"
              payload: { name: "Dairy Dist FC", license_number: "LIC-FC-1" }
              as: TerritoryManager
              captures: { d2: "$.data.id" }
            - call: "POST /dairy/drivers"
              payload: { distributor_id: "${d1}", name: "Hank Driver", cdl_class: "A" }
              as: DistributorOwner
