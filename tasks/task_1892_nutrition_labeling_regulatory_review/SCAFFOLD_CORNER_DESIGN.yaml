            - { call: "POST /api/products/${pid}/label-versions", payload: { market_code: "US_FDA", nutrient_basis: "DATABASE", racc_assignment_id: "${ra}", declared_format: "SIMPLIFIED", declared_type_size_in: 0.0625, ingredient_statement_text: "Wafers", contains_text: "Contains: None.", expected_product_version: "${pver2}" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { lvB: $.data.id } }
            - { call: "POST /api/label-versions/${lvB}/submit-review", as: LabelAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /api/label-versions/${lvA}/approve", as: RegulatoryReviewer, as_user_id: "reviewer-1" }
