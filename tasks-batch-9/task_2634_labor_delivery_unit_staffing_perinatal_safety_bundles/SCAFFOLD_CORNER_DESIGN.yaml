            latest assessment sits in TIER_2_NOTIFIED, which is in the unresolved set, and this beats the
            freshness clause (the reading is 0 minutes old) and the coverage floor (satisfied below).
            Final GET /labor-encounters/${enc_id}: labor_phase == "LATENT" (the advance was rejected),
            acuity_tier == "TIER_III" (the unresolved CATEGORY_II chain lifted the floor from TIER_I),
