          assert:
            - "${planned_stops} == 2 and ${planned_duty} == 265 (drive 120 + 45, service 75 + 25, no break) with ${planned_status} == PLANNED and ${dispatched_status} == DISPATCHED"
            - "${s1_status} == ARRIVED, ${s1_version} == 2"
            - "${t_after_arrive} == IN_PROGRESS - the bubble is visible in the very next read, with no endpoint of its own"
            - "${s1_done} == COMPLETED and ${s2_status} == ARRIVED"
            - "${t_after_second} == IN_PROGRESS - the second arrival does not re-fire the bubble"

      - name: trip_plan_and_settlement_dimensions_are_independent
        claim_type: Parallel State Dimensions
        excluded_because:
          difficulty_instance: trip_settlement_dimension_cycles_while_plan_dimension_stays_terminal
          rationale: "The §1.8 non_linear_state_machine instance already drives a COMPLETED trip through the full settlement cycle PENDING -> ACCRUED -> SETTLED -> DISPUTED -> ADJUSTED -> ACCRUED while asserting plan_status stays COMPLETED and every plan-dimension trigger is refused, which is exactly the `parallel` shape claim - independent dimensions advancing without interference. A separate corner instance would replay the same calls with weaker assertions."

      - name: driver_termination_side_effects_reach_bids_and_the_domicile
        claim_type: Cross-entity Side Effect
        excluded_because:
          difficulty_instance: driver_termination_cascades_to_open_bids_and_domicile_balance_index
          rationale: "The §1.8 transitive_cascade instance already asserts the whole ACTIVE -> TERMINATED side-effect list end to end: assigned_driver_count decremented, balance_index recomputed to 4 decimal places, every SUBMITTED bid moved to PASSED_OVER, each posting's bid_count decremented, and an AWARDED posting deliberately left AWARDED. Restating it here would add no distinguishing coverage."

  # ===========================================================================
  - section: calculations
    instances:

      - name: peak_case_load_is_the_running_maximum_not_the_cases_handled
        claim_type: Correct Result
        grounds:
          - calculations.trailer_peak_case_load
          - calculations.trip_plan_totals
          - validations[priority 15 constraint]
        distinguishing_aspect: "A trip that handles 1600 cases across a delivery, a vendor pickup and a drop-off never carries more than 600 at once, so a 600-case trailer plans successfully: the gate is the running maximum of the load walk (and it is inclusive at capacity), not the sum of cases touched and not the final load, which is 0."
        test_recipe:
          setup:
            - "Trip TRIP-C1A has three stops in sequence: DELIVERY 600 cases at S-4001 (rate 600 cases/h), VENDOR_PICKUP 500 cases, DROP_OFF 500 cases. The assigned trailer holds exactly 600 cases."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
