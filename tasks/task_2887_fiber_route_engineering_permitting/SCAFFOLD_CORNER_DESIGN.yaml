              as_user_id: "eng-dave"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status is 409 and $.data.error_id == ERR_INVALID_AS_BUILT_STATE"
            - "AsBuiltRecord.${ab_id}.status == ACCEPTED and certified_by_user_id == eng-carol"
            - "AsBuiltRecord.${ab_id}.length_variance_bp == 0 and submitted_by_user_id == the surveyor's X-User-ID"
            - "Route.${route_id}.status == RECORDS_UPDATED"

      - name: rewalk_rejection_cascade_hop_chain
        claim_type: Side Effect Execution
        grounds:
          - state_machines.FieldWalkout.transitions.SUBMITTED_to_REJECTED
          - state_machines.Route.transitions.PERMITTING_to_PLANNING
        excluded_because:
          difficulty_instance: transitive_cascade / rewalk_rejection_five_hop_cascade_resets_route_to_planning
          rationale: "All five hops of rewalk_rejection_cascade, including the segment cost-field reset and Route.status PLANNING, are asserted hop by hop by the named §1.8 instance."

      - name: permit_denial_cascade_hop_chain
        claim_type: Side Effect Execution
        grounds:
          - state_machines.PermitApplication.transitions.UNDER_REVIEW_to_DENIED
          - state_machines.DesignPackage.transitions.STAMPED_to_DRAFT
        excluded_because:
          difficulty_instance: transitive_cascade / permit_denial_five_hop_cascade_voids_stamp_and_reopens_route
          rationale: "All five hops of permit_denial_cascade, including the stamp void and Route CONSTRUCTION_READY -> PERMITTING, are asserted hop by hop by the named §1.8 instance."

      - name: segment_parallel_state_dimensions_move_independently
        claim_type: parallel
        grounds:
          - state_machines.RouteSegment.shape
          - entities.RouteSegment.fields.engineering_status
          - entities.RouteSegment.fields.permit_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / segment_parallel_dimensions_advance_independently
          rationale: "The independence of engineering_status and permit_status on one row is exactly the claim the named §1.8 instance asserts."

      - name: attachment_withdrawal_reverses_its_original_side_effects
        claim_type: Compensation
        grounds:
          - state_machines.PoleAttachmentApplication.transitions.any_to_WITHDRAWN
          - calculations.route_budget_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / attachment_withdrawal_restores_route_budget_exactly
          rationale: "The named §1.8 instance asserts every reversed side effect of the withdrawal, including the segment's bid-ready recomputation, with no drift."

  # ===========================================================================
  # 3 — calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: preliminary_cost_correct_for_an_aerial_urban_paved_400_foot_segment
        claim_type: Correct Result
        grounds:
          - calculations.segment_construction_cost
          - calculations.segment_construction_cost.constants.METHOD_BASE_RATE_CENTS_PER_FOOT
          - calculations.segment_construction_cost.constants.TERRAIN_MULTIPLIER_BP
          - endpoints[POST /segments/{id}/construction-method]
        distinguishing_aspect: "400 feet of AERIAL over URBAN_PAVED is 400 * 1237 * 12750 / 10000 = 630870 cents exactly, written to preliminary_cost_cents and rolled up into Route.total_preliminary_cost_cents while bid_ready_cost_cents stays null."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Harbor Loop' (RING_CLOSURE) in PLANNING with one RouteSegment: 400 feet, URBAN_PAVED, planned_work_start_on 2026-09-15"
            - "that segment's walkout is ACCEPTED with obstruction_count 0, so engineering_status is WALKED"
            - "no MoratoriumWindow exists anywhere"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Dock Street", municipality_code: "MUN-014", length_feet: 400, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-20" }
              as: RouteEngineer
              captures: { seg_id: $.data.id }
            - call: "POST /walkouts"
              payload: { segment_id: "${seg_id}", walked_on: "2026-08-11", obstruction_count: 0, conduit_available_confirmed: false }
              as: FieldSurveyor
              captures: { wo_id: $.data.id }
            - call: "POST /pole-observations"
              payload: { walkout_id: "${wo_id}", pole_tag: "P-001", pole_owner: "TELCO", condition_grade: "B", available_vertical_clearance_in: 45, existing_attachment_count: 2 }
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/submit"
              payload: {}
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/review"
              payload: { decision: "ACCEPTED" }
              as: RouteEngineer
              as_user_id: "eng-alice"
            - call: "GET /routes/${route_id}"
              payload: {}
              as: RouteEngineer
              captures: { rv1: $.data.version }
          trigger:
            - call: "POST /segments/${seg_id}/construction-method"
              payload: { method: "AERIAL", expected_route_version: "${rv1}" }
              as: RouteEngineer
          assert:
            - "response HTTP status is 200 and RouteSegment.${seg_id}.engineering_status == METHOD_SELECTED"
            - "RouteSegment.${seg_id}.construction_method == AERIAL"
            - "RouteSegment.${seg_id}.preliminary_cost_cents == 630870"
            - "RouteSegment.${seg_id}.bid_ready_cost_cents == null"
            - "RouteSegment.${seg_id}.moratorium_class == NONE and restoration_cost_cents == 0"
            - "Route.${route_id}.total_preliminary_cost_cents == 630870 and total_bid_ready_cost_cents == 0"

