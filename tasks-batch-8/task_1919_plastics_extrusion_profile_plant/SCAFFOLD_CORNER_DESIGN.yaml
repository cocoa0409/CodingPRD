          - calculations.blend_composition
        distinguishing_aspect: "Virgin lot 800 kg < required virgin draw 861.5 kg -> ERR_INSUFFICIENT_LOT_QUANTITY; regrind shortfall alone would NOT error (absorbed by the min() cap) — only virgin/colorant shortfall does."
        test_recipe:
