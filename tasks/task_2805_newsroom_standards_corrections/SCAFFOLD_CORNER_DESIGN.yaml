              payload: { story_id: "${st}", expected_story_version: "${stale_v}", high_risk_declared: false, submission_note: "Submitting on a stale read." }
              as: Reporter
              as_user_id: "${rep}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_STORY_VERSION"
            - "Story.${st}.publication_status == DRAFT"
            - "Story.${st}.version == ${stale_v} + 1"
            - "GET /standards-desk/stories/${st}/pre-publication-reviews returns total_count == 0"

      - name: second_booking_with_stale_reviewer_version_returns_stale_reviewer_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[review-assignment-create-stale-reviewer]
          - errors[ERR_STALE_REVIEWER_VERSION]
          - calculations.reviewer_minute_ledger
        distinguishing_aspect: "The first booking bumps Reviewer.version, so a second disjoint slot presented with the pre-booking token is refused 412 ERR_STALE_REVIEWER_VERSION even though the slot itself would not collide and the minutes would fit."
        test_recipe:
          setup:
            - "A SUBMITTED standards-only round exists with a STANDARDS reviewer of 480 weekly minutes"
            - "The reviewer's version is read once, then a 60-minute slot is booked with it"
          setup_api_calls:
            - call: "POST /standards-desk/newsrooms"
              payload: { name: "Metro Ledger" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { nr: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Dana Ruiz", email: "dana@ledger.test", role_title: "EXECUTIVE_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { exec: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Sam Okoye", email: "sam@ledger.test", role_title: "STANDARDS_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { sed: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Rae Lindqvist", email: "rae@ledger.test", role_title: "REPORTER" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { rep: $.data.id }
            - call: "POST /standards-desk/reviewers"
              payload: { newsroom_id: "${nr}", full_name: "Tomas Neri", discipline: "STANDARDS", weekly_capacity_minutes: 480 }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { rv: $.data.id, stale_rv: $.data.version }
            - call: "POST /standards-desk/stories"
              payload: { newsroom_id: "${nr}", lead_journalist_id: "${rep}", headline: "Two bookings, one token" }
              as: Reporter
              as_user_id: "${rep}"
              captures: { st: $.data.id }
            - call: "GET /standards-desk/stories/${st}"
              payload: {}
              as: Reporter
              as_user_id: "${rep}"
              captures: { st_v: $.data.version }
            - call: "POST /standards-desk/pre-publication-reviews"
              payload: { story_id: "${st}", expected_story_version: "${st_v}", high_risk_declared: false, submission_note: "Standards read only." }
              as: Reporter
              as_user_id: "${rep}"
              captures: { rvw: $.data.id }
            - call: "POST /standards-desk/review-assignments"
              payload: { review_id: "${rvw}", reviewer_id: "${rv}", starts_at: "2026-08-06T09:00:00Z", ends_at: "2026-08-06T10:00:00Z", expected_reviewer_version: "${stale_rv}" }
              as: StandardsEditor
              as_user_id: "${sed}"
              captures: { asg1: $.data.id }
          trigger:
            - call: "POST /standards-desk/review-assignments"
              payload: { review_id: "${rvw}", reviewer_id: "${rv}", starts_at: "2026-08-06T14:00:00Z", ends_at: "2026-08-06T15:00:00Z", expected_reviewer_version: "${stale_rv}" }
              as: StandardsEditor
              as_user_id: "${sed}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_REVIEWER_VERSION"
            - "Reviewer.${rv}.reserved_minutes == 60"
            - "Reviewer.${rv}.available_minutes == 420"
            - "Reviewer.${rv}.version == ${stale_rv} + 1"
            - "GET /standards-desk/review-assignments with reviewer_id ${rv} returns total_count == 1"

      - name: story_version_increments_on_every_write_that_touches_it
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[prepub-review-create-stale-story]
          - entities.Story.version
          - endpoints[POST /standards-desk/anonymous-source-approvals/{id}/decide]
        distinguishing_aspect: "The OCC token advances on writes the client never issued: a source approval and then a review submission each add exactly 1, so the version read after creation is two behind by the time the round is open."
        test_recipe:
          setup:
            - "A DRAFT story with one REQUESTED ELEVATED source, whose version was recorded at creation"
          setup_api_calls:
            - call: "POST /standards-desk/newsrooms"
              payload: { name: "Metro Ledger" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { nr: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Dana Ruiz", email: "dana@ledger.test", role_title: "EXECUTIVE_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { exec: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Sam Okoye", email: "sam@ledger.test", role_title: "STANDARDS_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { sed: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Rae Lindqvist", email: "rae@ledger.test", role_title: "REPORTER" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { rep: $.data.id }
            - call: "POST /standards-desk/stories"
              payload: { newsroom_id: "${nr}", lead_journalist_id: "${rep}", headline: "Counting the version bumps" }
              as: Reporter
              as_user_id: "${rep}"
              captures: { st: $.data.id, v0: $.data.version }
            - call: "POST /standards-desk/anonymous-source-approvals"
              payload: { story_id: "${st}", source_alias: "permit-clerk", source_category: "GOVERNMENT", harm_risk: "ELEVATED", identity_known_to_editor: true, corroboration_count: 2, justification_text: "Custodian of the permit ledger for four years." }
              as: Reporter
              as_user_id: "${rep}"
              captures: { src: $.data.id }
            - call: "POST /standards-desk/anonymous-source-approvals/${src}/decide"
              payload: { decision: "APPROVE", decision_note: "Identity verified." }
              as: StandardsEditor
              as_user_id: "${sed}"
          trigger:
            - call: "GET /standards-desk/stories/${st}"
              payload: {}
              as: Reporter
              as_user_id: "${rep}"
              captures: { v1: $.data.version }
          assert:
            - "response.status == 200"
            - "response.data.version == ${v0} + 1"
            - "response.data.risk_index_estimate == 2.00"
            - "a review submitted next with expected_story_version ${v1} is accepted 201 and leaves Story.version == ${v0} + 2"

      - name: excluded_cascading_side_effects_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / adjudication_cascades_correction_to_story_to_newsroom_posture, sustained_fabrication_cascades_suspension_to_reviewer_minute_release
          rationale: "Both §1.8 transitive-cascade instances walk a three-level chain end to end and assert every hop, which is this layer's claim."

      - name: excluded_dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / story_risk_index_estimate_versus_actual_diverge_after_severe_correction, correction_severity_provisional_versus_adjudicated_bands_disagree
          rationale: "The layer's 'both variants produce expected results and the delta is correct' claim is exactly what those two instances assert."

      - name: excluded_rate_threshold_trigger_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - calculations.newsroom_standards_posture
        excluded_because:
          difficulty_instance: boundary_precision_check / posture_flips_exactly_at_high_severity_open_threshold_not_one_below
          rationale: "The cumulative posture threshold is tested at threshold-1 and at threshold there, and the fall-back after a resolution is covered by the cross-entity instance."

  # =========================================================================
  - section: consistency_model
    instances:
      - name: adjudication_response_already_carries_every_recomputed_field
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /standards-desk/correction-requests/{id}/adjudicate]
          - calculations.correction_severity_score.adjudicated_final
        distinguishing_aspect: "Consistency is immediate, so the single adjudicate response already shows adjudicated_severity_score 14, band MAJOR and placement TOP_OF_STORY, and the story and desk counters are correct on the very next read with no settling period."
        test_recipe:
          setup:
            - "A default newsroom with one DRAFT story"
            - "A named subject has filed an IDENTIFICATION complaint with reach 900, now INVESTIGATING"
          setup_api_calls:
            - call: "POST /standards-desk/newsrooms"
              payload: { name: "Metro Ledger" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { nr: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Dana Ruiz", email: "dana@ledger.test", role_title: "EXECUTIVE_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { exec: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Sam Okoye", email: "sam@ledger.test", role_title: "STANDARDS_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { sed: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Rae Lindqvist", email: "rae@ledger.test", role_title: "REPORTER" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { rep: $.data.id }
            - call: "POST /standards-desk/stories"
              payload: { newsroom_id: "${nr}", lead_journalist_id: "${rep}", headline: "A misidentified subject" }
              as: Reporter
              as_user_id: "${rep}"
              captures: { st: $.data.id }
            - call: "POST /standards-desk/correction-requests"
              payload: { story_id: "${st}", submitter_type: "SUBJECT", submitter_email: "subject@example.test", claim_text: "The photograph is not of me.", claimed_error_category: "IDENTIFICATION", reader_reported_reach: 900, subject_named: true }
              as: PublicEditor
              as_user_id: "public-editor-1"
              captures: { cr: $.data.id }
            - call: "POST /standards-desk/correction-requests/${cr}/start-investigation"
              payload: { assigned_note: "Pulling the photo desk records." }
              as: StandardsEditor
              as_user_id: "${sed}"
          trigger:
            - call: "POST /standards-desk/correction-requests/${cr}/adjudicate"
              payload: { outcome_type: "CORRECTION", adjudicated_error_category: "IDENTIFICATION", verified_reach: 900, notice_text: "An earlier version used a photograph of the wrong person." }
              as: StandardsEditor
              as_user_id: "${sed}"
          assert:
            - "response.status == 200"
            - "response.data.status == ADJUDICATED"
            - "response.data.adjudicated_severity_score == 14"
            - "response.data.adjudicated_severity_band == MAJOR"
            - "response.data.placement == TOP_OF_STORY"
            - "response.data.response_due_at == 2026-08-02T00:00:00.000Z"
            - "Story.${st}.severe_correction_count == 1"
            - "Story.${st}.open_correction_request_count == 0"
            - "Story.${st}.standards_status == CORRECTED"
            - "GET /standards-desk/newsrooms/${nr}/standards-summary returns open_high_severity_count == 1 and standards_posture OPEN"
            - "GET /standards-desk/newsrooms/${nr}/audit-events with event_type CORRECTION_ADJUDICATED returns total_count == 1"
