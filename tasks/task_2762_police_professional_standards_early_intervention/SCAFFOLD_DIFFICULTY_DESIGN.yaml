          - state_machines.CredibilityDisclosure.ACTIVE_to_EXPUNGED
          - state_machines.Officer.SUSPENDED_to_ACTIVE
          - state_machines.Reinstatement.PENDING_to_FINALIZED
          - entities.Officer.fields.imposed_suspension_days_total
        distinguishing_aspect: |
          A single OVERTURNED decision walks the cascade backwards across four entities in one
          request - Discipline effective_days to 0, the officer ledger from 30 back to exactly 0
