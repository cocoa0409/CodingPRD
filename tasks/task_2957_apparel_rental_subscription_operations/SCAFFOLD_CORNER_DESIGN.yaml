          rationale: >-
            Both declared dual-variant calculations are exercised over a single fixture with literal per-variant
            results in the §1.8 dual_variant_calc rule, including the delta between them.
  - section: consistency_model
    instances:
      - name: consistency_restock_cascade_is_fully_visible_in_the_same_request
        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model"
          - "endpoints.POST /reverse-logistics-jobs/{job_id}/restock"
          - "state_machines.ReverseLogisticsJob.transitions.PHOTOGRAPHED_to_RESTOCKED"
        distinguishing_aspect: >-
          The declared consistency model is immediate, so the five-hop restock cascade must be readable by the
          very next call at the same logical clock: no denormalised field may lag. The reads that follow the
          restock cover a different entity at each hop — job, unit, reservation, style — and an implementation
          that recomputes style.floor_ready_unit_count on a later request returns 0 here.
