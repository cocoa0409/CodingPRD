            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/appraisal-schedules"
              payload: { neighborhood_code: "NB-EAST", per_unit_value_cents: 1234567, equity_adjustment_bps: 250, effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-001", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_id}", applicant_party_id: "${own_id}", requested_units: 22 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { app_id: $.data.id }
            - call: "POST /tdr/severance-applications/${app_id}/screen"
              payload: {}
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/certify"
              payload: {}
              as: ProgramAdministrator
