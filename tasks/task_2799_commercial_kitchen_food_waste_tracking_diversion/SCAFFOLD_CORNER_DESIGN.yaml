        claim_type: bulk_action
        grounds: ["endpoints[POST /data-quality-scans]", "validations[priority=115]", "calculations.data_quality_scan"]
        distinguishing_aspect: "The scan is a bulk creator whose empty case is explicitly a 200 with an empty array rather than an error — the empty-set guard that does apply to baselines and consignments deliberately does not apply here."
        test_recipe:
          setup: ["Site HK-01 with no tracking stations and no shifts at all."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: "*"
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
          trigger:
            - call: "POST /data-quality-scans"
              payload: { site_id: "${site_id}", scan_date: "2026-08-01" }
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
          assert:
            - "HTTP 200 (not an error) with data == [] and total_count == 0"
            - "GET /data-quality-findings?site_id=${site_id} returns total_count == 0"

      - name: attainment_endpoint_is_a_computed_read
        claim_type: computed_read
        grounds: ["endpoints[GET /reduction-targets/{id}/attainment]", "calculations.reduction_attainment"]
        excluded_because:
          difficulty_instance: reduction_attainment_absolute_versus_intensity_disagree_on_same_data
          rationale: "The depth probe reads the computed projection under both bases on identical data and asserts every derived field it returns, which is the whole content of the computed-read claim."

      - name: staging_is_a_conditional_action
        claim_type: conditional_action
        grounds: ["endpoints[POST /diversion-consignments/{id}/stage]", "endpoints[POST /diversion-consignments/{id}/dispatch]"]
        excluded_because:
          difficulty_instance: consignment_dispatch_requires_approved_hauler_while_staging_does_not
          rationale: "The depth probe contrasts the two actions' conditions on one fixture, showing staging permitted and dispatch refused under the same hauler status."

      - name: flag_and_clear_flag_are_action_endpoints
        claim_type: action_endpoint
        grounds: ["endpoints[POST /waste-entries/{id}/flag]", "endpoints[POST /waste-entries/{id}/clear-flag]"]
        excluded_because:
          difficulty_instance: waste_entry_flag_loop_twice_then_supersede_and_compensating_restore_to_recorded
          rationale: "Both action endpoints are driven repeatedly by the depth probe, which asserts the state after every call as well as the aggregate invariance across the loop."

  # =========================================================================
  # errors
  # =========================================================================
  - section: errors
    instances:
      - name: every_unknown_path_id_returns_its_owning_entity_not_found_code
        claim_type: error_triggerable
        grounds: ["validations[priority=40]", "errors[ERR_STATION_NOT_FOUND]", "errors[ERR_FOOD_TYPE_NOT_FOUND]", "errors[ERR_SHIFT_NOT_FOUND]", "errors[ERR_ENTRY_NOT_FOUND]", "errors[ERR_BASELINE_NOT_FOUND]", "errors[ERR_TARGET_NOT_FOUND]", "errors[ERR_HAULER_NOT_FOUND]", "errors[ERR_CONSIGNMENT_NOT_FOUND]", "errors[ERR_LINE_NOT_FOUND]", "errors[ERR_TICKET_NOT_FOUND]", "errors[ERR_ALERT_NOT_FOUND]", "errors[ERR_FINDING_NOT_FOUND]", "errors[ERR_ROLLUP_NOT_FOUND]"]
        distinguishing_aspect: "Priority 40 resolves the path parameter against the OWNING entity, so each read answers with its own code rather than one shared generic 404 — thirteen distinct codes over an empty database."
        test_recipe:
          setup: ["Empty database except for the clock; every id below is a well-formed UUID that was never issued."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: "*"
          trigger:
            - call: "GET /tracking-stations/00000000-0000-0000-0000-000000000001"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-1"
            - call: "GET /food-types/00000000-0000-0000-0000-000000000002"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-1"
            - call: "GET /shifts/00000000-0000-0000-0000-000000000003"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-1"
            - call: "GET /waste-entries/00000000-0000-0000-0000-000000000004"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-1"
            - call: "GET /baseline-periods/00000000-0000-0000-0000-000000000005"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-1"
            - call: "GET /reduction-targets/00000000-0000-0000-0000-000000000006"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-1"
            - call: "GET /haulers/00000000-0000-0000-0000-000000000007"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-1"
            - call: "GET /diversion-consignments/00000000-0000-0000-0000-000000000008"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-1"
            - call: "GET /consignment-lines/00000000-0000-0000-0000-000000000009"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-1"
            - call: "GET /hauler-tickets/00000000-0000-0000-0000-00000000000a"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-1"
            - call: "GET /coaching-alerts/00000000-0000-0000-0000-00000000000b"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-1"
            - call: "GET /data-quality-findings/00000000-0000-0000-0000-00000000000c"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-1"
            - call: "GET /corporate-rollups/00000000-0000-0000-0000-00000000000d"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-1"
          assert:
            - "every call answers HTTP 404"
            - "the error_id values are, in order, ERR_STATION_NOT_FOUND, ERR_FOOD_TYPE_NOT_FOUND, ERR_SHIFT_NOT_FOUND, ERR_ENTRY_NOT_FOUND, ERR_BASELINE_NOT_FOUND, ERR_TARGET_NOT_FOUND, ERR_HAULER_NOT_FOUND, ERR_CONSIGNMENT_NOT_FOUND, ERR_LINE_NOT_FOUND, ERR_TICKET_NOT_FOUND, ERR_ALERT_NOT_FOUND, ERR_FINDING_NOT_FOUND, ERR_ROLLUP_NOT_FOUND"
            - "GET /sites/00000000-0000-0000-0000-00000000000e likewise answers ERR_SITE_NOT_FOUND and GET /recipes/00000000-0000-0000-0000-00000000000f answers ERR_RECIPE_NOT_FOUND"

      - name: body_foreign_keys_that_resolve_to_nothing_are_not_found_at_priority_forty_five
        claim_type: error_triggerable
        grounds: ["validations[priority=45]", "errors[ERR_FOOD_TYPE_NOT_FOUND]", "errors[ERR_HAULER_NOT_FOUND]", "endpoints[POST /waste-entries]"]
        distinguishing_aspect: "A body foreign key is checked after every path id and answers with the REFERENCED entity's code, so a capture naming a real station and a phantom food type is a food-type 404 rather than an invalid-request 400."
        test_recipe:
          setup: ["Site HK-01, station PREP-1, OPEN AM shift; no food type is ever created and no hauler exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: "*"
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { station_id: "$.data.id" }
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-08-01", shift_code: "AM", meals_served: 250 }
