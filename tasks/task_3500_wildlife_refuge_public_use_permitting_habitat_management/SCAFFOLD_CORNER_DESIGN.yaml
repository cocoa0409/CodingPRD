  - section: validations
    instances:
      - name: missing_auth_headers_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role header fails authentication before anything else."
        test_recipe:
          setup: ["One unit exists."]
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "North Marsh", habitat_type: "WETLAND", acreage: 1200 }
              as: RefugeManager
              captures: { u1: $.data.id }
          trigger:
            - call: "GET /refuge/management-units/${u1}"
              captures: { err: $.data.error_id }
          assert:
            - "request sent WITHOUT X-User-Role / X-User-ID headers -> error_id == ERR_UNAUTHENTICATED, http 401"
      - name: missing_auth_precedes_not_found_returns_401
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=4]"]
        distinguishing_aspect: "Priority ordering across categories: unauthenticated AND nonexistent id -> 401 wins over 404 (auth checked before existence)."
        test_recipe:
          setup: ["Empty database (target id does not exist)."]
          setup_api_calls: []
          trigger:
            - call: "GET /refuge/permits/00000000-0000-0000-0000-000000000000"
              captures: { err: $.data.error_id }
          assert:
            - "request sent WITHOUT auth headers against a nonexistent id -> error_id == ERR_UNAUTHENTICATED (401), NOT ERR_NOT_FOUND (404)"
      - name: treatment_window_in_past_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_WINDOW_IN_PAST]"]
        distinguishing_aspect: "window_start before the current logical clock date (2026-09-01) is rejected at creation."
        test_recipe:
          setup: ["One unit; clock at default 2026-09-01."]
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "Prairie Unit", habitat_type: "GRASSLAND", acreage: 800 }
              as: RefugeManager
              captures: { u1: $.data.id }
          trigger:
            - call: "POST /refuge/management-units/${u1}/treatments"
              payload: { treatment_type: "INVASIVE_CONTROL", window_start: "2026-08-01", window_end: "2026-08-10" }
              as: Biologist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_WINDOW_IN_PAST, http 422"
      - name: permit_end_before_start_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_DATE_RANGE_INVALID]"]
        distinguishing_aspect: "end_date 2026-10-09 < start_date 2026-10-10 is rejected with ERR_DATE_RANGE_INVALID (both dates are in the future, isolating the range rule)."
        test_recipe:
          setup: ["One unit; one DRAFT RESEARCH determination (existence and use_type satisfied; FINAL not required at create)."]
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "North Marsh", habitat_type: "WETLAND", acreage: 1200 }
              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /refuge/determinations"
              payload: { use_type: "RESEARCH", title: "Research use", comment_open_date: "2026-09-05", comment_close_date: "2026-09-20" }
              as: PermitOfficer
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /refuge/permits"
              payload: { applicant_ref: "app-1", management_unit_id: "${u1}", determination_id: "${d1}", use_type: "RESEARCH", crew_size: 2, start_date: "2026-10-10", end_date: "2026-10-09" }
