            - "the valid call -> 201 and BreedingObjective.${obj_id}.program_id == ${prog_id}, taken from the path"
            - "GET /breeding-programs/${prog_id}/objectives returns total_count == 1"
            - "GET /breeding-objectives/${obj_id} returns the same row with min_advancement_index == 85.00"

      - name: trial_entry_junction_binds_series_line_and_site_across_the_graph
        claim_type: Parent Relationships
        grounds:
          - complexity_profile.entity_topology
          - entities.TrialEntry
          - validations[priority=6]
          - endpoints["POST /trial-series/{id}/entries"]
        distinguishing_aspect: "The topology is a graph, and TrialEntry is its junction: it must resolve three references at once - the series from the path plus line_id and trial_site_id from the body - and the body FKs are validated in the order the endpoint's input list declares them, so a request with both unknown reports ERR_LINE_NOT_FOUND rather than ERR_TRIAL_SITE_NOT_FOUND."
        test_recipe:
          setup:
