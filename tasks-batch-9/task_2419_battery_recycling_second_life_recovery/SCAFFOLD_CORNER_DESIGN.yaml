  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_expected_intake_version_blocks_the_second_module_write
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.module-create-stale-intake
          - errors[ERR_STALE_INTAKE_VERSION]
          - validations[priority=7]
          - endpoints[POST /recycling/intakes/{intake_id}/modules]
        distinguishing_aspect: "Every module write carries expected_intake_version, and the first module bumps Intake.version, so replaying the version captured before it fails with ERR_STALE_INTAKE_VERSION (412) - the classic lost-dismantling-update - while re-reading the row and resubmitting the same body succeeds; the 412 also outranks the duplicate serial_code shape error at priority 4."
        test_recipe:
          setup:
            - "Clock 2026-07-10T00:00:00.000Z; one campus, one supplier, one NMC622 intake identified to NMC622 so Intake.version is 2."
