      # --- calculations rows delegated to §1.8 --------------------------------
      - name: settlement_economics_produce_the_expected_figures
        claim_type: correct_result
        grounds:
          - calculations.draw_settlement_economics
        excluded_because:
          difficulty_instance: draw_provisional_versus_final_settlement_divergence
          rationale: "The §1.8 instance pins every PROVISIONAL and FINAL field of two draws to code-computed literals (52503/50003/897544 and 52402/40002/907646) including the rejected mode-b figure 52403, so a plain known-inputs check adds nothing."

      - name: provisional_to_final_delta_is_reconciled
        claim_type: reconciliation
        grounds:
          - calculations.draw_settlement_economics
        excluded_because:
          difficulty_instance: draw_provisional_versus_final_settlement_divergence
          rationale: "The same §1.8 instance asserts the reconciliation delta 10102 between the provisional estimate and the settled figure and shows which ledger fields absorb it."

      - name: dti_threshold_boundary_is_probed_at_the_edge
        claim_type: threshold
        grounds:
          - calculations.instant_credit_decision
          - validations[priority=48]
        excluded_because:
          difficulty_instance: acceptance_dti_ceiling_round_half_up_boundary
          rationale: "The §1.8 instance walks DTI 4500 / 4500 / 4501 across the round_half_up tie at 4320479 vs 4320480 and shows the ceiling re-tested at acceptance against existing program debt — a superset of a threshold-1 / threshold / threshold+1 probe."

      - name: reserve_aggregation_survives_add_then_reverse
        claim_type: aggregation
        grounds:
          - calculations.holdback_reserve_target
        excluded_because:
          difficulty_instance: draw_reversal_restores_the_funding_ledger_with_no_drift
          rationale: "The §1.8 instance builds the reserve to 96002 across two settlements and unwinds it exactly, covering running-total-after-add and running-total-after-reversal in one arc."

      - name: accrual_respects_chronological_event_order
        claim_type: chronological
        grounds:
          - calculations.deferred_interest_accrual
        excluded_because:
          difficulty_instance: loan_promo_satisfied_versus_capitalized_payoff_divergence
          rationale: "The §1.8 instance builds a multi-segment balance timeline (65369 vs the per-segment 65370, then 606660 at 2027-08-02) and drives it down both the PROMO_SATISFIED and the capitalized branch, which subsumes an out-of-order-events check."

      - name: reserve_target_propagates_to_a_fixed_point
        claim_type: constraint_propagation
        grounds:
          - calculations.holdback_reserve_target
        excluded_because:
          difficulty_instance: holdback_reserve_target_six_step_evaluation_order_pinned
          rationale: "The §1.8 instance pins all six steps and shows each of the three rejected orderings producing a different withheld figure, which is the strongest possible propagation-order check."

      - name: portfolio_weights_score_the_merchant_correctly
        claim_type: weighted_scoring
        grounds:
          - calculations.merchant_portfolio_performance
          - calculations.phantom_fraud_score
        excluded_because:
          difficulty_instance: confirmed_fraud_alert_three_hop_suspension_cascade
          rationale: "The §1.8 instance drives the phantom score from 55 to 93 through the pinned halve-the-aggregate rule and re-grades the portfolio at each step, so the weighting and the no-drift requirement are already exercised."

