  # ===========================================================================
  - section: endpoints
    instances:

      - name: quote_summary_computed_read_matches_formula
        claim_type: computed_read
        grounds:
          - endpoints.GET_/quotes/{id}/summary
          - calculations.package_bundle_price_cents
          - entities.Quote.fields.gross_subtotal_cents
        distinguishing_aspect: "The summary read returns derived pricing and dependency fields consistent with the formulas rather than echoing raw stored line prices."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-11T00:00:00Z. A SYSTEM_PACKAGE quote with an anchor guitar line and a dependent amp line."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
            - *c_asg
            - *c_accept
            - *c_guitar
            - *c_amp
            - *c_quote
            - *c_lgtr
            - *c_lamp
          trigger:
            - call: "POST /quotes/${quote_a_id}/submit"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
            - call: "GET /quotes/${quote_a_id}/summary"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { summary_subtotal: $.data.gross_subtotal_cents, summary_bundle: $.data.package_bundle_price_cents, summary_closure: $.data.dependency_closure_size }
          assert:
            - "the response status is 200 and response_type is object"
            - "gross_subtotal_cents == 69993 (guitar 39996 plus amp 29997)"
            - "package_bundle_price_cents == 69993 at tier 0 because 69993 is below TIER_MID_CENTS 200000"
            - "dependency_closure_size == 2 and bundle_ready == true"
            - "engineer_commission_cents == 2800 and commission_variant == provisional"
            - "GET /quotes/${quote_a_id} returns the same gross_subtotal_cents, so the summary and the entity read agree"

      - name: instrument_unit_create_on_unreserved_quote_line_is_not_reachable
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/instrument-units/{id}/start-setup
          - state_machines.InstrumentUnit.PENDING_SETUP_to_IN_SETUP
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "start-setup is a conditional action gated on the owning Quote being RESERVED, so a unit whose line sits on a SUBMITTED quote is refused with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-11T00:00:00Z. A submitted (not reserved) quote with one guitar line and a registered unit."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
            - *c_asg
            - *c_accept
            - *c_guitar
            - *c_quote
            - *c_lgtr
            - *c_submit
            - *c_unit
          trigger:
            - call: "POST /instrument-units/${unit_a_id}/start-setup"
              payload: {}
              as: SetupTechnician
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and data.error_id == ERR_INVALID_STATE"
            - "InstrumentUnit.${unit_a_id}.setup_status == PENDING_SETUP and setup_technician_id is null"
            - "the same call succeeds once the quote is reserved: after POST /quotes/${quote_a_id}/reserve with expected_quote_version ${quote_a_v0} the unit moves to IN_SETUP"

      - name: customers_list_paginates_across_three_rows
        claim_type: listing
        grounds:
          - endpoints.GET_/customers
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The customer list honours limit and offset with an accurate total_count and has_more, and defaults to limit 10 offset 0 when no query parameters are supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-12T00:00:00Z. Three customers with distinct home states."
          setup_api_calls:
            - *c_clock
            - *c_cust
            - call: "POST /customers"
              payload: { full_name: "Sasha Poe", email: "sasha.poe@example.com", home_state: "TN" }
              as: Anonymous
            - call: "POST /customers"
              payload: { full_name: "Ken Ives", email: "ken.ives@example.com", home_state: "OH" }
              as: Anonymous
          trigger:
            - call: "GET /customers"
              payload: { limit: 2, offset: 0 }
              as: SalesEngineerOps
            - call: "GET /customers"
              payload: { limit: 2, offset: 2 }
              as: SalesEngineerOps
          assert:
            - "GET /customers?limit=2&offset=0 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /customers?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /customers with no query parameters returns 3 rows with limit defaulting to 10"
            - "every returned row carries created_at and version"

      - name: customers_filter_by_status_uses_explicit_enum
        claim_type: standard_crud
        grounds:
          - endpoints.GET_/customers
          - entities.Customer.fields.status
        distinguishing_aspect: "The status filter selects on the explicit enum set rather than a fuzzy notion of active accounts, so only rows whose status equals the requested value are returned."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-12T00:00:00Z. Two PENDING customers, one of which has been activated."
          setup_api_calls:
            - *c_clock
            - *c_cust
            - call: "POST /customers"
              payload: { full_name: "Sasha Poe", email: "sasha.poe@example.com", home_state: "TN" }
              as: Anonymous
              captures: { cust_pending_id: $.data.id }
            - call: "POST /customers/${cust_a_id}/activate"
              payload: {}
              as: SalesEngineerOps
          trigger:
            - call: "GET /customers"
              payload: { status: "ACTIVE" }
              as: SalesEngineerOps
            - call: "GET /customers"
              payload: { status: "PENDING" }
              as: SalesEngineerOps
          assert:
            - "GET /customers?status=ACTIVE returns exactly 1 row, the activated customer ${cust_a_id}"
            - "GET /customers?status=PENDING returns exactly 1 row, the untouched customer ${cust_pending_id}"
            - "Customer.${cust_a_id}.status == ACTIVE and Customer.${cust_pending_id}.status == PENDING"
            - "no row is returned twice across the two filtered reads"

      - name: assignment_create_missing_expected_customer_version_returns_412_path
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/assignments
          - concurrency_rules[assignment-create-stale-customer]
          - errors[ERR_STALE_VERSION]
        excluded_because:
          difficulty_instance: accept_assignment_authorization_beats_book_and_overlap
          rationale: "The stale-version rejection on POST /assignments is a separate concurrency corner not asserted by that instance; see the dedicated optimistic_concurrency row below."

