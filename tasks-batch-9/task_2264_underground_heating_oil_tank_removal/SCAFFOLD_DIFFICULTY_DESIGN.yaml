          - state_machines.Permit.SUBMITTED_to_ISSUED
          - state_machines.Permit.SUBMITTED_to_DENIED
          - state_machines.Permit.ISSUED_to_REVOKED
          - state_machines.DecommissionWorkOrder.field_status.SCHEDULED_to_ABORTED
          - calculations.nfa_blocker_set
