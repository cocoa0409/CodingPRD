          - validations[priority=17]
          - calculations.certification_readiness_score
        distinguishing_aspect: >
          The two review axes are independent dimensions of one row: the security APPROVE lands FIRST
          here and must leave state == IN_REVIEW, and only the later conformance APPROVE flips state to
