  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: qa_breach_cascade_five_deep
        grounds:
          - state_machines.TruckTrip.QA_REVIEW_to_BREACH_CONFIRMED
          - state_machines.Return.APPROVED_to_CREDITED
          - state_machines.Invoice.OPEN_to_SETTLED
          - calculations.return_credit_amount
        distinguishing_aspect: |
          Trigger = POST adjudicate CONFIRM_BREACH: depth-5 chain
          TruckTrip -> RouteOrder lines flagged -> system Returns (COLD_CHAIN,
          auto-APPROVED) -> CreditMemos ISSUED -> auto-applied to Invoices ->
          payment_status re-derived; companion instance uses a different
          trigger (store deactivate) with depth 3.
        test_recipe:
          setup:
            - "Distributor D1, route R1 ACTIVE, store S1 (credit_limit 100000000), driver DR1; regulated product P1 (8.6 lb, margin 30c)"
            - "Period 2026-08 PROVISIONAL base 2100/35/60 diesel 299 -> unit 218.770c"
            - "Trip T1 2026-08-10; order O1 of 5 units CONFIRMED; trip DEPARTED after pre-cool; BOX readings 10:00=41.0F and 11:00=39.0F -> 60.0 excursion minutes"
            - "O1 DELIVERED (5 units, code 2026-08-20) at 11:30; invoice INV1 total 1094 OPEN"
            - "Trip COMPLETED at clock 12:00 -> cold_chain_breach == true; qa-review -> QA_REVIEW"
          setup_api_calls:
