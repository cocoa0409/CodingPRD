            - "GET /airhub/aircraft?hub_id=${hub_id} returns 0 rows"

      - name: package_create_checks_body_foreign_keys_in_declared_input_order_and_scopes
        claim_type: Parent Relationships
        grounds:
          - validations[priority=4]
          - endpoints.POST_/airhub/packages
          - errors.ERR_RESOURCE_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "The flat topology puts hub_id before aircraft_id in the declared input list, so with both unknown the answer is the hub miss; with a valid hub but an aircraft that belongs to a different hub the answer is still a 404, because the FK is validated within the hub scope rather than globally."
        test_recipe:
          setup:
            - "Clock 1400. SDF hub, alternate IND hub, BANK_A with N701UP on SDF, and a separate bank BANK_Z with aircraft N801UP on the IND hub."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - *c_lane_p1
            - *c_lane_s1
            - *c_bank
            - *c_ac1
            - *c_shift
