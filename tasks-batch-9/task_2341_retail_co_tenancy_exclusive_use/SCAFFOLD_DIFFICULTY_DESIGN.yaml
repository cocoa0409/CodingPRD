    - state_machines.CoTenancyCondition.status.BREACHED_to_CURED
    - entities.CoTenancyCondition.fields.last_evaluated_measurement_id
    distinguishing_aspect: 'The CoTenancyCondition status is a function of a DIFFERENT entitys state: certifying an OccupancyMeasurement switches the condition from the LIVE_STRICT engine to the CERTIFIED_MEASUREMENT
      engine, so the condition moves BREACHED -> CURED on the certified 85.00 figure even though ShoppingCenter.open_occupancy_pct remains 75.00.'
