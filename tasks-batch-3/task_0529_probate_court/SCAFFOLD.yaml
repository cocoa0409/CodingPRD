# =============================================================================
# PRD Benchmark Seed Tables — Probate Court & Estate Administration (Expert)
# =============================================================================
scenario: |
  Probate Court & Estate Administration: petition & will lodging,
  personal-representative appointment & letters, creditor notice & claim
  period, inventory & appraisal, asset marshaling & accounting, distribution
  & receipts, bond & court supervision, closing & discharge .

domain_name: probate-court
api_prefix: ""

# -----------------------------------------------------------------------------
# Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions

  entity_topology: flat
  # Estate is the conceptual aggregate root, but every entity is a top-level
  # collection joined by explicit FK fields (estate_id, petition_id,
  # representative_id, beneficiary_id, bond_id). Peers are reached by filtered
  # lists (GET /petitions?estate_id=...), not URL nesting.

  state_machine_shape: branching
  # Petition forks GRANTED/DENIED; CreditorClaim forks ALLOWED/REJECTED/BARRED;
  # Distribution has an approve-then-pay-or-return branch; Estate is a
  # compound aggregate whose gates depend on child states.

  relationship_patterns:
    - one_to_many          # Estate -> {Petition, PersonalRepresentative, Asset, ...}
    - cross_aggregate      # Distribution -> Beneficiary; CreditorClaim payment -> Asset ledger

  role_model: segregation_of_duties
  # A ProbateJudge may not also act as the PersonalRepresentative on the same
  # estate; the Clerk records but cannot adjudicate; the PR administers but
  # cannot grant its own letters.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# 1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Estate
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: decedent_name, type: string, source: input, description: "Full legal name of the decedent" }
      - { name: date_of_death, type: datetime, source: input, description: "ISO 8601 date of death; must be <= current logical clock at creation" }
      - { name: county_code, type: string, source: input, description: "Two-letter probate county code, e.g. LA, SF" }
      - { name: estate_type, type: enum, source: input, description: "TESTATE | INTESTATE — TESTATE requires a lodged will on the petition", constraints: "TESTATE | INTESTATE" }
      - { name: gross_estate_value_cents, type: integer, source: input, description: "PR-declared gross value in cents used for bond sizing and supervision level; > 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | INVENTORIED | ACCOUNTING | DISTRIBUTING | CLOSED", constraints: "DRAFT | OPEN | INVENTORIED | ACCOUNTING | DISTRIBUTING | CLOSED" }
      - { name: supervision_level, type: enum, source: computed, description: "FULL | LIMITED | INDEPENDENT — derived from gross_estate_value_cents and bond posture; see calc estate_supervision_level", constraints: "FULL | LIMITED | INDEPENDENT" }
      - { name: claim_period_opened_at, type: datetime, source: system, description: "Logical-clock instant the creditor claim period began (set when petition is GRANTED); null before" }
      - { name: claim_bar_date, type: datetime, source: computed, description: "claim_period_opened_at + CLAIM_PERIOD_DAYS; claims filed strictly after this instant are BARRED" }
      - { name: inventory_total_cents, type: integer, source: computed, description: "Sum of appraised_value_cents over Assets in {APPRAISED, MARSHALED, LIQUIDATED, DISTRIBUTED}; see calc inventory_total" }
      - { name: marshaled_cash_cents, type: integer, source: computed, description: "Running marshaling ledger: cash available to pay claims/distributions; see calc marshaled_cash" }
      - { name: allowed_claims_total_cents, type: integer, source: computed, description: "Sum of allowed_amount_cents over CreditorClaims in {ALLOWED, PAID}; see calc allowed_claims_total" }
      - { name: residue_cents, type: integer, source: computed, description: "Distributable residue after paid claims and admin; see calc distributable_residue" }

  - name: Petition
    parent: Estate
    common_fields: true
    fields:
      - { name: estate_id, type: string, source: system, description: "FK -> Estate.id; the estate this petition opens" }
      - { name: petitioner_name, type: string, source: input, description: "Name of the party filing the petition" }
      - { name: will_lodged, type: boolean, source: input, description: "Whether an original will document accompanies the petition" }
      - { name: will_date, type: datetime, source: input, description: "Execution date of the lodged will; required when will_lodged is true, else must be omitted" }
      - { name: nominated_representative_name, type: string, source: input, description: "PR nominee named in the petition/will" }
      - { name: status, type: enum, source: system, description: "PENDING | GRANTED | DENIED", constraints: "PENDING | GRANTED | DENIED" }
      - { name: denial_reason, type: string, source: input, description: "Reason recorded on DENY; required on DENY transition only" }

  - name: PersonalRepresentative
    parent: Estate
    common_fields: true
    fields:
      - { name: estate_id, type: string, source: system, description: "FK -> Estate.id; the estate this representative administers" }
      - { name: petition_id, type: string, source: input, description: "FK -> Petition.id; the granted petition that nominates this representative" }
      - { name: full_name, type: string, source: input, description: "Legal name of the personal representative" }
      - { name: representative_user_id, type: string, source: input, description: "X-User-ID this PR acts under once APPOINTED; the acting PersonalRepresentative role must match this id" }
      - { name: bond_required, type: boolean, source: computed, description: "True when the estate's supervision_level is FULL or LIMITED (i.e. not INDEPENDENT); false when INDEPENDENT; derives from calc estate_supervision_level" }
      - { name: bond_id, type: string, source: system, description: "FK -> Bond.id; the posted bond backing this appointment; null until a bond is FILED and this PR is APPOINTED" }
      - { name: status, type: enum, source: system, description: "NOMINATED | APPOINTED | SUSPENDED | DISCHARGED | REMOVED", constraints: "NOMINATED | APPOINTED | SUSPENDED | DISCHARGED | REMOVED" }
      - { name: letters_issued_at, type: datetime, source: system, description: "Logical-clock instant letters were issued (set on APPOINTED); null otherwise" }

  - name: Bond
    parent: Estate
    common_fields: true
    fields:
      - { name: estate_id, type: string, source: system, description: "FK -> Estate.id; the estate the bond secures" }
      - { name: representative_id, type: string, source: input, description: "FK -> PersonalRepresentative.id; the PR this bond backs" }
      - { name: surety_name, type: string, source: input, description: "Name of the surety company posting the bond" }
      - { name: penal_amount_cents, type: integer, source: input, description: "Face amount of the bond in cents; must be >= required_amount_cents on APPROVE" }
      - { name: required_amount_cents, type: integer, source: computed, description: "Minimum bond the court requires for this estate; see calc bond_required_amount" }
      - { name: status, type: enum, source: system, description: "FILED | APPROVED | EXONERATED | FORFEITED", constraints: "FILED | APPROVED | EXONERATED | FORFEITED" }

  - name: Beneficiary
    parent: Estate
    common_fields: true
    fields:
      - { name: estate_id, type: string, source: system, description: "FK -> Estate.id; the estate this beneficiary inherits from" }
      - { name: full_name, type: string, source: input, description: "Beneficiary legal name" }
      - { name: relationship, type: enum, source: input, description: "SPOUSE | CHILD | HEIR | DEVISEE | CREDITOR_RESIDUAL", constraints: "SPOUSE | CHILD | HEIR | DEVISEE | CREDITOR_RESIDUAL" }
      - { name: share_bps, type: integer, source: input, description: "Fractional residue share in basis points (1/10000); sum of active beneficiaries' share_bps must equal 10000 before distribution" }
      - { name: distributed_cents, type: integer, source: computed, description: "Total cents PAID to this beneficiary across Distributions; see calc beneficiary_distributed" }

  - name: CreditorClaim
    parent: Estate
    common_fields: true
    fields:
      - { name: estate_id, type: string, source: system, description: "FK -> Estate.id; the estate against which the claim is filed" }
      - { name: creditor_name, type: string, source: input, description: "Name of the claiming creditor" }
      - { name: claim_class, type: enum, source: input, description: "SECURED | FUNERAL | ADMIN | TAX | GENERAL — determines priority rank in the payment waterfall", constraints: "SECURED | FUNERAL | ADMIN | TAX | GENERAL" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount the creditor claims in cents; > 0" }
      - { name: allowed_amount_cents, type: integer, source: input, description: "Amount the PR allows on ALLOW transition; 0 < allowed_amount_cents <= claimed_amount_cents" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock instant the claim was filed; used against Estate.claim_bar_date" }
      - { name: paid_amount_cents, type: integer, source: computed, description: "Cents actually paid to this claim from the marshaling ledger on PAY; see calc claim_payment" }
      - { name: status, type: enum, source: system, description: "FILED | ALLOWED | REJECTED | BARRED | PAID", constraints: "FILED | ALLOWED | REJECTED | BARRED | PAID" }

  - name: Asset
    parent: Estate
    common_fields: true
    fields:
      - { name: estate_id, type: string, source: system, description: "FK -> Estate.id; the estate that owns the asset" }
      - { name: description, type: string, source: input, description: "Human description of the asset" }
      - { name: asset_class, type: enum, source: input, description: "REAL_PROPERTY | CASH | SECURITY | PERSONAL_PROPERTY", constraints: "REAL_PROPERTY | CASH | SECURITY | PERSONAL_PROPERTY" }
      - { name: declared_value_cents, type: integer, source: input, description: "PR-declared value at listing in cents; > 0" }
      - { name: appraised_value_cents, type: integer, source: input, description: "Independent appraiser value set on APPRAISE; > 0" }
      - { name: liquidation_proceeds_cents, type: integer, source: input, description: "Cash proceeds recorded on LIQUIDATE; required on LIQUIDATE for non-CASH assets" }
      - { name: status, type: enum, source: system, description: "LISTED | APPRAISED | MARSHALED | LIQUIDATED | DISTRIBUTED", constraints: "LISTED | APPRAISED | MARSHALED | LIQUIDATED | DISTRIBUTED" }

  - name: Distribution
    parent: Estate
    common_fields: true
    fields:
      - { name: estate_id, type: string, source: system, description: "FK -> Estate.id; the estate making the distribution" }
      - { name: beneficiary_id, type: string, source: input, description: "FK -> Beneficiary.id; the recipient of this distribution" }
      - { name: proposed_amount_cents, type: integer, source: input, description: "Amount proposed for distribution in cents; > 0" }
      - { name: receipt_reference, type: string, source: input, description: "Receipt/acknowledgement reference recorded on PAY (receipt filed)" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | PAID | RETURNED", constraints: "PROPOSED | APPROVED | PAID | RETURNED" }

  - name: AccountingReport
    parent: Estate
    common_fields: true
    fields:
      - { name: estate_id, type: string, source: system, description: "FK -> Estate.id; the estate this accounting covers" }
      - { name: report_type, type: enum, source: input, description: "INVENTORY | INTERIM | FINAL — FINAL is required to close the estate", constraints: "INVENTORY | INTERIM | FINAL" }
      - { name: snapshot_inventory_cents, type: integer, source: computed, description: "Estate.inventory_total_cents captured when the report is FILED" }
      - { name: snapshot_allowed_claims_cents, type: integer, source: computed, description: "Estate.allowed_claims_total_cents captured when the report is FILED" }
      - { name: snapshot_distributed_cents, type: integer, source: computed, description: "Sum of PAID Distributions captured when the report is FILED" }
      - { name: balances, type: boolean, source: computed, description: "True iff snapshot_inventory_cents + marshaled proceeds == paid claims + distributed + residue at FILE; see calc accounting_balance" }
      - { name: status, type: enum, source: system, description: "DRAFT | FILED | APPROVED | REJECTED", constraints: "DRAFT | FILED | APPROVED | REJECTED" }

  - name: Hearing
    parent: Estate
    common_fields: true
    fields:
      - { name: estate_id, type: string, source: system, description: "FK -> Estate.id; the estate this hearing supervises" }
      - { name: hearing_type, type: enum, source: input, description: "PETITION | ACCOUNTING | REMOVAL — subject of the court hearing", constraints: "PETITION | ACCOUNTING | REMOVAL" }
      - { name: courtroom_code, type: string, source: input, description: "Physical courtroom resource key; two SCHEDULED hearings on the same courtroom_code may not have overlapping [start,end) intervals" }
      - { name: judge_user_id, type: string, source: input, description: "Assigned ProbateJudge resource key; two SCHEDULED hearings on the same judge_user_id must be separated by JUDGE_RECESS_MINUTES (closed-interval + buffer)" }
      - { name: start_at, type: datetime, source: input, description: "Hearing start instant (ISO 8601)" }
      - { name: end_at, type: datetime, source: input, description: "Hearing end instant; must be strictly after start_at" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | HELD | VACATED", constraints: "SCHEDULED | HELD | VACATED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ------------------------------------------------------------------ Petition
  - entity: Petition
    initial_state: PENDING
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /petitions/{id}/grant"
        actor: ProbateJudge
        preconditions:
          - "Estate.status == DRAFT (ERR_INVALID_STATE)"
          - "If Estate.estate_type == TESTATE then will_lodged == true (ERR_WILL_NOT_LODGED)"
          - "expected_estate_version matches Estate.version (ERR_STALE_VERSION)"
        side_effects:
          - "Estate.status DRAFT -> OPEN"
          - "Estate.claim_period_opened_at set to current logical clock"
          - "Estate.claim_bar_date recomputed = claim_period_opened_at + CLAIM_PERIOD_DAYS (calc claim_bar_date)"
          - "Estate.version += 1"
        note: "Grant of the petition opens administration and starts the creditor claim period."
      - from: PENDING
        to: DENIED
        trigger: "POST /petitions/{id}/deny"
        actor: ProbateJudge
        preconditions:
          - "Estate.status == DRAFT (ERR_INVALID_STATE)"
          - "denial_reason present (ERR_MISSING_FIELD)"
          - "expected_estate_version matches Estate.version (ERR_STALE_VERSION)"
        side_effects:
          - "Estate.version += 1"

  # ---------------------------------------------- PersonalRepresentative (PR)
  - entity: PersonalRepresentative
    initial_state: NOMINATED
    terminal_states: [DISCHARGED, REMOVED]
    transitions:
      - from: NOMINATED
        to: APPOINTED
        trigger: "POST /representatives/{id}/appoint"
        actor: ProbateJudge
        preconditions:
          - "Petition referenced by petition_id is GRANTED (ERR_CROSS_ENTITY_STATE) — Petition state gates PR appointment"
          - "If bond_required then a Bond for this PR exists in status APPROVED (ERR_BOND_NOT_APPROVED)"
          - "The acting ProbateJudge id != representative_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "expected_estate_version matches Estate.version (ERR_STALE_VERSION)"
        side_effects:
          - "PR.letters_issued_at set to current logical clock"
          - "PR.bond_id set to the APPROVED bond's id when bond_required, else null"
          - "Estate.version += 1"
        note: "Issues letters; PR may now marshal assets and adjudicate claims."
      - from: APPOINTED
        to: SUSPENDED
        trigger: "POST /representatives/{id}/suspend"
        actor: ProbateJudge
        preconditions:
          - "expected_estate_version matches Estate.version (ERR_STALE_VERSION)"
        side_effects:
          - "Estate.version += 1"
      - from: SUSPENDED
        to: APPOINTED
        trigger: "POST /representatives/{id}/reinstate"
        actor: ProbateJudge
        preconditions:
          - "expected_estate_version matches Estate.version (ERR_STALE_VERSION)"
        side_effects:
          - "Estate.version += 1"
      - from: APPOINTED
        to: REMOVED
        trigger: "POST /representatives/{id}/remove"
        actor: ProbateJudge
        preconditions:
          - "expected_estate_version matches Estate.version (ERR_STALE_VERSION)"
        side_effects:
          - "If PR.bond_id present, that Bond FORFEITED"
          - "Estate.version += 1"
        note: "Removal forfeits the bond (cascade: PR.remove -> Bond.FORFEITED)."
      - from: SUSPENDED
        to: REMOVED
        trigger: "POST /representatives/{id}/remove"
        actor: ProbateJudge
        preconditions:
          - "expected_estate_version matches Estate.version (ERR_STALE_VERSION)"
        side_effects:
          - "If PR.bond_id present, that Bond FORFEITED"
          - "Estate.version += 1"
      - from: APPOINTED
        to: DISCHARGED
        trigger: "POST /representatives/{id}/discharge"
        actor: ProbateJudge
        preconditions:
          - "Estate.status == CLOSED (ERR_CROSS_ENTITY_STATE) — Estate closure gates PR discharge"
          - "expected_estate_version matches Estate.version (ERR_STALE_VERSION)"
        side_effects:
          - "If PR.bond_id present, that Bond EXONERATED (cascade: PR.discharge -> Bond.EXONERATED)"
          - "Estate.version += 1"

  # ----------------------------------------------------------------------- Bond
  - entity: Bond
    initial_state: FILED
    terminal_states: [EXONERATED, FORFEITED]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /bonds/{id}/approve"
        actor: ProbateJudge
        preconditions:
          - "penal_amount_cents >= required_amount_cents (ERR_BOND_INSUFFICIENT)"
          - "expected_estate_version matches Estate.version (ERR_STALE_VERSION)"
        side_effects:
          - "Estate.version += 1"
      - from: FILED
        to: FORFEITED
        trigger: "system: PR.remove while bond FILED or APPROVED"
        actor: system
        preconditions: []
        side_effects: []
        note: "Cascade target from PR removal."
      - from: APPROVED
        to: FORFEITED
        trigger: "system: PR.remove while bond APPROVED"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: EXONERATED
        trigger: "system: PR.discharge"
        actor: system
        preconditions: []
        side_effects: []

  # -------------------------------------------------------------- CreditorClaim
  - entity: CreditorClaim
    initial_state: FILED
    terminal_states: [REJECTED, BARRED, PAID]
    transitions:
      - from: FILED
        to: ALLOWED
        trigger: "POST /claims/{id}/allow"
        actor: PersonalRepresentative
        preconditions:
          - "Estate.status IN {OPEN, INVENTORIED, ACCOUNTING} (ERR_INVALID_STATE)"
          - "claim.filed_at <= Estate.claim_bar_date (ERR_CLAIM_PERIOD_CLOSED)"
          - "0 < allowed_amount_cents <= claimed_amount_cents (ERR_ALLOWED_AMOUNT_INVALID)"
          - "acting PersonalRepresentative is APPOINTED and owns this estate (ERR_CROSS_ENTITY_STATE) — PR state gates claim allowance"
          - "expected_estate_version matches Estate.version (ERR_STALE_VERSION)"
        side_effects:
          - "Estate.allowed_claims_total_cents recomputed (calc allowed_claims_total)"
          - "Estate.version += 1"
      - from: FILED
        to: REJECTED
        trigger: "POST /claims/{id}/reject"
        actor: PersonalRepresentative
        preconditions:
          - "acting PersonalRepresentative is APPOINTED and owns this estate (ERR_CROSS_ENTITY_STATE)"
          - "expected_estate_version matches Estate.version (ERR_STALE_VERSION)"
        side_effects:
          - "Estate.version += 1"
      - from: FILED
        to: BARRED
        trigger: "POST /claims/{id}/allow (auto-barred branch)"
        actor: PersonalRepresentative
        preconditions:
          - "claim.filed_at > Estate.claim_bar_date"
        side_effects:
          - "Claim marked BARRED instead of ALLOWED; allowed_amount_cents ignored"
          - "Estate.version += 1"
        note: "Branch of the allow trigger: late claims are auto-barred, not allowed."
      - from: ALLOWED
        to: PAID
        trigger: "POST /claims/{id}/pay"
        actor: PersonalRepresentative
        preconditions:
          - "Estate.status == ACCOUNTING (ERR_INVALID_STATE)"
          - "Estate.marshaled_cash_cents >= this claim's waterfall allocation (ERR_INSUFFICIENT_MARSHALED_FUNDS)"
          - "expected_estate_version matches Estate.version (ERR_STALE_VERSION)"
        side_effects:
          - "claim.paid_amount_cents set from waterfall allocation (calc claim_payment)"
          - "Estate.marshaled_cash_cents debited by paid_amount_cents (cascade: claim.pay -> Estate ledger -> residue recompute)"
          - "Estate.residue_cents recomputed (calc distributable_residue)"
          - "Estate.version += 1"

  # ---------------------------------------------------------------------- Asset
  - entity: Asset
    initial_state: LISTED
    terminal_states: [DISTRIBUTED]
    transitions:
      - from: LISTED
        to: APPRAISED
        trigger: "POST /assets/{id}/appraise"
        actor: PersonalRepresentative
        preconditions:
          - "Estate.status IN {OPEN, INVENTORIED} (ERR_INVALID_STATE)"
          - "appraised_value_cents > 0 present (ERR_MISSING_FIELD)"
          - "expected_estate_version matches Estate.version (ERR_STALE_VERSION)"
        side_effects:
          - "Estate.inventory_total_cents recomputed (calc inventory_total)"
          - "Estate.version += 1"
      - from: APPRAISED
        to: MARSHALED
        trigger: "POST /assets/{id}/marshal"
        actor: PersonalRepresentative
        preconditions:
          - "Estate.status IN {INVENTORIED, ACCOUNTING} (ERR_INVALID_STATE)"
          - "expected_estate_version matches Estate.version (ERR_STALE_VERSION)"
        side_effects:
          - "If asset_class == CASH: Estate.marshaled_cash_cents += appraised_value_cents (cascade -> residue recompute)"
          - "Estate.residue_cents recomputed (calc distributable_residue)"
          - "Estate.version += 1"
      - from: MARSHALED
        to: LIQUIDATED
        trigger: "POST /assets/{id}/liquidate"
        actor: PersonalRepresentative
        preconditions:
          - "Estate.status == ACCOUNTING (ERR_INVALID_STATE)"
          - "For non-CASH assets, liquidation_proceeds_cents > 0 present (ERR_MISSING_FIELD)"
          - "expected_estate_version matches Estate.version (ERR_STALE_VERSION)"
        side_effects:
          - "Estate.marshaled_cash_cents += liquidation_proceeds_cents (cascade: asset.liquidate -> Estate ledger -> residue recompute)"
          - "Estate.residue_cents recomputed (calc distributable_residue)"
          - "Estate.version += 1"
      - from: MARSHALED
        to: DISTRIBUTED
        trigger: "POST /assets/{id}/distribute-in-kind"
        actor: PersonalRepresentative
        preconditions:
          - "Estate.status == DISTRIBUTING (ERR_INVALID_STATE)"
          - "expected_estate_version matches Estate.version (ERR_STALE_VERSION)"
        side_effects:
          - "Estate.version += 1"

  # --------------------------------------------------------------- Distribution
  - entity: Distribution
    initial_state: PROPOSED
    terminal_states: [PAID, RETURNED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /distributions/{id}/approve"
        actor: ProbateJudge
        preconditions:
          - "Estate.status == DISTRIBUTING (ERR_INVALID_STATE)"
          - "Estate.allowed_claims_total_cents equals sum of PAID claims' paid_amount_cents (all allowed claims paid) (ERR_CLAIMS_UNPAID)"
          - "proposed_amount_cents <= Estate.residue_cents (ERR_DISTRIBUTION_EXCEEDS_RESIDUE)"
          - "expected_estate_version matches Estate.version (ERR_STALE_VERSION)"
        side_effects:
          - "Estate.version += 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /distributions/{id}/pay"
        actor: PersonalRepresentative
        preconditions:
          - "receipt_reference present (ERR_MISSING_FIELD)"
          - "Estate.marshaled_cash_cents >= proposed_amount_cents (ERR_INSUFFICIENT_MARSHALED_FUNDS)"
          - "expected_estate_version matches Estate.version (ERR_STALE_VERSION)"
        side_effects:
          - "Estate.marshaled_cash_cents debited by proposed_amount_cents (cascade: distribution.pay -> Estate ledger -> residue recompute)"
          - "Beneficiary.distributed_cents recomputed (calc beneficiary_distributed)"
          - "Estate.residue_cents recomputed (calc distributable_residue)"
          - "Estate.version += 1"
      - from: APPROVED
        to: RETURNED
        trigger: "POST /distributions/{id}/return"
        actor: PersonalRepresentative
        preconditions:
          - "expected_estate_version matches Estate.version (ERR_STALE_VERSION)"
        side_effects:
          - "Estate.version += 1"

  # ----------------------------------------------------------- AccountingReport
  - entity: AccountingReport
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /accountings/{id}/file"
        actor: PersonalRepresentative
        preconditions:
          - "report_type == INVENTORY requires Estate.status == OPEN; report_type == INTERIM requires Estate.status == INVENTORIED; report_type == FINAL requires Estate.status == ACCOUNTING (ERR_INVALID_STATE)"
          - "For report_type == FINAL: every ALLOWED CreditorClaim under the estate is already PAID (ERR_CLAIMS_UNPAID)"
          - "expected_estate_version matches Estate.version (ERR_STALE_VERSION)"
        side_effects:
          - "snapshot_inventory_cents := Estate.inventory_total_cents"
          - "snapshot_allowed_claims_cents := Estate.allowed_claims_total_cents"
          - "snapshot_distributed_cents := sum of PAID Distributions' proposed_amount_cents"
          - "balances computed (calc accounting_balance)"
          - "If report_type == FINAL: Estate.status ACCOUNTING -> DISTRIBUTING (opens the distribution phase; cascade: accounting.file(FINAL) -> Estate.DISTRIBUTING -> distributions may be proposed/approved)"
          - "Estate.version += 1"
      - from: FILED
        to: APPROVED
        trigger: "POST /accountings/{id}/approve"
        actor: ProbateJudge
        preconditions:
          - "accounting_balance recomputed fresh at approve time == true (ERR_ACCOUNTING_UNBALANCED)"
          - "expected_estate_version matches Estate.version (ERR_STALE_VERSION)"
        side_effects:
          - "If report_type == INVENTORY: Estate.status OPEN -> INVENTORIED"
          - "If report_type == INTERIM: Estate.status INVENTORIED -> ACCOUNTING"
          - "If report_type == FINAL: Estate.status DISTRIBUTING -> CLOSED (cascade: accounting.approve(FINAL) -> Estate.CLOSED -> eligible PR discharge)"
          - "Estate.version += 1"
      - from: FILED
        to: REJECTED
        trigger: "POST /accountings/{id}/reject"
        actor: ProbateJudge
        preconditions:
          - "expected_estate_version matches Estate.version (ERR_STALE_VERSION)"
        side_effects:
          - "Estate.version += 1"

  # ------------------------------------------------------------------- Hearing
  - entity: Hearing
    initial_state: SCHEDULED
    terminal_states: [HELD, VACATED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /hearings/{id}/hold"
        actor: ProbateJudge
        preconditions:
          - "Current logical clock >= start_at (ERR_INVALID_STATE)"
          - "expected_estate_version matches Estate.version (ERR_STALE_VERSION)"
        side_effects:
          - "Estate.version += 1"
      - from: SCHEDULED
        to: VACATED
        trigger: "POST /hearings/{id}/vacate"
        actor: ProbateJudge
        preconditions:
          - "expected_estate_version matches Estate.version (ERR_STALE_VERSION)"
        side_effects:
          - "Estate.version += 1"
        note: "Vacating frees the courtroom/judge interval so it no longer collides with future scheduling."

# -----------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: appoint-stale-estate
    parent_entity: Estate
    write_endpoint: "POST /representatives/{id}/appoint"
    occ_field: "expected_estate_version"
    description: |
      Appointing a PersonalRepresentative against an Estate whose version has
      advanced since the client last observed it is rejected. Another writer may
      have already appointed a competing nominee (which legitimately supersedes
      earlier appointment attempts for the same estate), so the current writer's
      view of the estate is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: distribution-approve-stale-estate
    parent_entity: Estate
    write_endpoint: "POST /distributions/{id}/approve"
    occ_field: "expected_estate_version"
    description: |
      Approving a Distribution against an Estate whose version has advanced
      since the client last observed it is rejected. A prior distribution
      approval or claim payment on the same estate legitimately consumes residue
      and bumps the estate version, rendering the current approver's residue
      view stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: bond_required_amount
    trigger: "Bond creation; recomputed when gross_estate_value_cents or supervision_level changes"
    algorithm: tiered_pricing
    formula: |
      # Cash-and-personal exposure the surety must cover, tiered by estate size.
      base = gross_estate_value_cents
      if supervision_level == INDEPENDENT:
        required = 0                      # independent administration waives bond
      else:
        # tiered marginal cover: 100% of first tier, 50% of next, 25% above
        t1 = min(base, TIER1_CENTS)                       # first 10,000,00c
        t2 = min(max(base - TIER1_CENTS, 0), TIER2_CENTS) # next 40,000,00c
        t3 = max(base - TIER1_CENTS - TIER2_CENTS, 0)     # remainder
        required = t1 + (t2 * 50 // 100) + (t3 * 25 // 100)
      Bond.required_amount_cents = required
    input_set: "Single Estate row; gross_estate_value_cents and computed supervision_level"
    constants:
      TIER1_CENTS: 1000000
      TIER2_CENTS: 4000000
    precision: "integer cents; marginal tiers use integer floor division (// 100), summed after per-tier flooring"
    variants:
      - name: full_or_limited
        when: "supervision_level in {FULL, LIMITED}"
        difference: "tiered marginal cover applied"
      - name: independent
        when: "supervision_level == INDEPENDENT"
        difference: "required = 0 (bond waived)"

  - name: estate_supervision_level
    trigger: "Estate creation and whenever gross_estate_value_cents is set"
    algorithm: threshold
    formula: |
      if gross_estate_value_cents < INDEPENDENT_MAX_CENTS:
        supervision_level = INDEPENDENT
      elif gross_estate_value_cents < FULL_MIN_CENTS:
        supervision_level = LIMITED
      else:
        supervision_level = FULL
    input_set: "Single Estate row"
    constants:
      INDEPENDENT_MAX_CENTS: 500000
      FULL_MIN_CENTS: 5000000
    precision: "integer comparison; strict < at each boundary (500000 -> LIMITED, 5000000 -> FULL)"

  - name: claim_bar_date
    trigger: "Petition GRANTED (sets Estate.claim_period_opened_at)"
    algorithm: interval_merge
    formula: |
      Estate.claim_bar_date = Estate.claim_period_opened_at + (CLAIM_PERIOD_DAYS days)
      # A claim's filed_at is compared with a HALF-OPEN upper bound:
      # filed_at <= claim_bar_date  -> in period (ALLOW eligible)
      # filed_at >  claim_bar_date  -> BARRED
    input_set: "Estate.claim_period_opened_at plus each CreditorClaim.filed_at at allow time"
    constants:
      CLAIM_PERIOD_DAYS: 120
    precision: "datetime; boundary is inclusive of claim_bar_date instant (<=), exclusive above (>)"

  - name: asset_carrying_value
    trigger: "read of an Asset; consumed by inventory_total and by distribution-in-kind sizing"
    algorithm: forward_looking
    formula: |
      # Dual-variant valuation on the Asset domain (distinct from Bond sizing).
      # PROVISIONAL (used before appraisal / for the working inventory estimate):
      #   carrying = declared_value_cents
      # FINAL (used once APPRAISED and thereafter):
      #   carrying = appraised_value_cents
      # The two produce different cents for the same asset whenever the
      # appraiser disagrees with the PR's declared value.
      if Asset.status == LISTED:
        carrying = declared_value_cents        # provisional
      else:
        carrying = appraised_value_cents       # final
    input_set: "A single Asset row; declared_value_cents (provisional) vs appraised_value_cents (final)"
    precision: "integer cents"
    variants:
      - name: provisional_declared
        when: "Asset.status == LISTED (not yet appraised)"
        difference: "uses PR-declared declared_value_cents"
      - name: final_appraised
        when: "Asset.status in {APPRAISED, MARSHALED, LIQUIDATED, DISTRIBUTED}"
        difference: "uses independent appraised_value_cents; delta vs provisional is the appraisal adjustment"

  - name: inventory_total
    trigger: "Asset APPRAISE / MARSHAL / LIQUIDATE"
    algorithm: aggregation
    formula: |
      inventory_total_cents = sum(appraised_value_cents
        for Asset in status {APPRAISED, MARSHALED, LIQUIDATED, DISTRIBUTED})
      # LISTED assets (not yet appraised) are excluded — they carry only a
      # provisional declared value and are not counted in the finalized inventory.
    input_set: "Assets under the estate with status in {APPRAISED, MARSHALED, LIQUIDATED, DISTRIBUTED}"
    precision: "integer cents; simple sum"

  - name: marshaled_cash
    trigger: "Asset MARSHAL(CASH) / LIQUIDATE; CreditorClaim PAY; Distribution PAY"
    algorithm: aggregation
    formula: |
      # Running ledger, updated incrementally by each transition's side effect:
      #   + appraised_value_cents on MARSHAL of a CASH asset
      #   + liquidation_proceeds_cents on LIQUIDATE
      #   - claim.paid_amount_cents on CreditorClaim PAY
      #   - distribution.proposed_amount_cents on Distribution PAY
      marshaled_cash_cents = (sum of cash brought in) - (sum of cash paid out)
    input_set: "Cumulative over all marshaling credits and claim/distribution debits under the estate"
    precision: "integer cents; incremental accumulator (never recomputed from scratch, order-independent because commutative sum)"

  - name: claim_payment
    trigger: "CreditorClaim PAY"
    algorithm: waterfall_allocation
    formula: |
      # Combinatorial mode (c): a circular-looking dependency whose evaluation
      # order is PINNED. The pool (marshaled_cash_cents) both gates whether a
      # claim may pay AND is debited by the payment; and a claim's eligibility
      # depends on the paid-state of higher-priority claims, which in turn were
      # sized by the same pool. The scaffold pins the order so the result is
      # well-defined:
      #   STEP 1 (eligibility): order ALLOWED claims by (rank ASC, created_at ASC),
      #     rank = { SECURED:0, FUNERAL:1, ADMIN:2, TAX:3, GENERAL:4 }.
      #     The claim being paid must be the lowest-ordered ALLOWED-not-PAID claim;
      #     if any strictly-higher-ordered ALLOWED claim is unpaid -> ERR_CLAIM_PRIORITY_VIOLATION.
      #   STEP 2 (funds gate): read pool = Estate.marshaled_cash_cents BEFORE this debit.
      #   STEP 3 (allocation): allocation = min(claim.allowed_amount_cents, pool).
      #     If pool < claim.allowed_amount_cents the pool is exhausted; allocation is
      #     the partial remainder and ERR_INSUFFICIENT_MARSHALED_FUNDS is NOT raised
      #     only when pool > 0 — a zero pool raises ERR_INSUFFICIENT_MARSHALED_FUNDS.
      #   STEP 4 (debit): pool -= allocation; claim.paid_amount_cents = allocation.
      # Ordering matters: paying GENERAL before SECURED would drain the pool and
      # starve the senior claim — forbidden by STEP 1.
      claim.paid_amount_cents = min(claim.allowed_amount_cents, pool_before_debit)
    input_set: "ALLOWED claims under the estate, ordered by (rank ASC, created_at ASC)"
    constants:
      RANK_SECURED: 0
      RANK_FUNERAL: 1
      RANK_ADMIN: 2
      RANK_TAX: 3
      RANK_GENERAL: 4
    precision: "integer cents; ties within a class broken by created_at ASC (never id); pool read strictly before its own debit"

  - name: distributable_residue
    trigger: "Asset MARSHAL/LIQUIDATE; CreditorClaim PAY; Distribution PAY"
    algorithm: aggregation
    formula: |
      residue_cents = marshaled_cash_cents
        - (sum of paid_amount_cents over PAID CreditorClaims)   # already debited from cash, tracked for reporting parity
        # note: marshaled_cash_cents is the live pool; residue equals the pool
        # remaining after claims are paid and before/after distributions.
      # Operationally: residue_cents = marshaled_cash_cents  (the live pool),
      # because claim and distribution payments already debit the pool.
      residue_cents = marshaled_cash_cents
    input_set: "Estate.marshaled_cash_cents"
    precision: "integer cents"

  - name: beneficiary_distributed
    trigger: "Distribution PAY"
    algorithm: aggregation
    formula: |
      Beneficiary.distributed_cents = sum(proposed_amount_cents
        for Distribution in status PAID where beneficiary_id == this beneficiary)
    input_set: "PAID Distributions under the estate grouped by beneficiary_id"
    precision: "integer cents"

  - name: accounting_balance
    trigger: "AccountingReport FILE"
    algorithm: aggregation
    formula: |
      # Conservation check pinned at FILE time:
      #   inflows  = snapshot_inventory_cents_cash_equiv (cash marshaled + liquidation proceeds)
      #   outflows = snapshot_allowed_claims_paid + snapshot_distributed
      # balances == true iff:
      #   (total_cash_marshaled) == (paid_claims_total + distributed_total + Estate.marshaled_cash_cents)
      total_cash_in = sum(appraised_value_cents for MARSHALED CASH assets)
                    + sum(liquidation_proceeds_cents for LIQUIDATED assets)
      paid_out = sum(paid_amount_cents for PAID claims)
               + sum(proposed_amount_cents for PAID distributions)
      balances = (total_cash_in == paid_out + Estate.marshaled_cash_cents)
    input_set: "All cash-affecting entities under the estate at FILE time"
    precision: "integer cents; exact equality"

  - name: courtroom_overlap
    trigger: "Hearing creation (POST /hearings)"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN interval semantics, NO buffer, keyed on courtroom_code.
      # New hearing N conflicts with an existing SCHEDULED hearing E (same
      # courtroom_code) iff their half-open [start,end) intervals intersect:
      #   conflict = (N.start_at < E.end_at) AND (E.start_at < N.end_at)
      # Adjacency (N.start_at == E.end_at) is NOT a conflict — back-to-back
      # hearings in the same courtroom are allowed.
      if any SCHEDULED E with E.courtroom_code == N.courtroom_code and
         (N.start_at < E.end_at and E.start_at < N.end_at):
        reject ERR_COURTROOM_CONFLICT
    input_set: "SCHEDULED Hearings sharing courtroom_code (VACATED/HELD excluded)"
    constants: {}
    precision: "datetime; half-open [start,end); strict < on both edges so adjacency passes"

  - name: judge_calendar_overlap
    trigger: "Hearing creation (POST /hearings)"
    algorithm: interval_merge
    formula: |
      # CLOSED interval + BUFFER semantics, keyed on judge_user_id.
      # New hearing N conflicts with existing SCHEDULED hearing E (same judge)
      # iff the buffered windows touch or overlap. Expand each interval by
      # JUDGE_RECESS_MINUTES on BOTH ends, then test closed-interval intersection:
      #   nStart = N.start_at - recess ; nEnd = N.end_at + recess
      #   conflict = (nStart <= E.end_at) AND (E.start_at <= nEnd)
      # Because edges use <= (closed), a gap of exactly JUDGE_RECESS_MINUTES is
      # STILL a conflict (touching buffers) — the gap must strictly exceed the
      # recess. This differs from courtroom_overlap where adjacency is allowed.
      if any SCHEDULED E with E.judge_user_id == N.judge_user_id and
         (N.start_at - recess <= E.end_at and E.start_at <= N.end_at + recess):
        reject ERR_JUDGE_CALENDAR_CONFLICT
    input_set: "SCHEDULED Hearings sharing judge_user_id (VACATED/HELD excluded)"
    constants:
      JUDGE_RECESS_MINUTES: 30
    precision: "datetime; closed-interval with +/- 30-minute buffer; <= on both edges so a touching buffer collides"

  - name: outstanding_bond_obligation
    trigger: "Bond APPROVE / FORFEIT / EXONERATE; PR appoint/remove/discharge"
    algorithm: aggregation
    formula: |
      # Conserved quantity #1: total surety obligation the court holds open.
      outstanding_bond_obligation_cents =
        sum(penal_amount_cents for Bond in status APPROVED under the estate)
      # Invariant: a forward pair (bond APPROVE then PR APPOINT that binds it)
      # raises this by the bond's penal_amount_cents; the compensating pair
      # (PR DISCHARGE -> Bond EXONERATED) lowers it by exactly the same
      # penal_amount_cents, returning the quantity to its pre-appointment value.
      # ERR-free round trip must leave outstanding_bond_obligation_cents unchanged.
    input_set: "APPROVED Bonds under the estate"
    precision: "integer cents; exact — approve/discharge round-trip is net zero"

  - name: cash_conservation_invariant
    trigger: "Distribution PROPOSE/APPROVE/PAY/RETURN"
    algorithm: aggregation
    formula: |
      # Conserved quantity #2: the marshaling cash pool.
      # INVARIANT (must hold after every transition):
      #   total_cash_in == Estate.marshaled_cash_cents
      #                    + sum(paid_amount_cents for PAID claims)
      #                    + sum(proposed_amount_cents for PAID distributions)
      # A distribution that goes PROPOSE -> APPROVE -> RETURN (compensating the
      # approval before any cash moves) leaves Estate.marshaled_cash_cents
      # unchanged: neither APPROVE nor RETURN debits the pool; only PAY debits.
      # Thus propose+approve+return is a net-zero round trip on the cash pool,
      # distinct from the bond-obligation invariant above.
    input_set: "Estate.marshaled_cash_cents plus PAID claims/distributions under the estate"
    precision: "integer cents; exact — propose/approve/return round-trip is net zero on the cash pool"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Segregation of duties: acting ProbateJudge id must not equal the PR's representative_user_id on appoint"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /representatives/{id}/appoint"

  - priority: 4
    category: existence
    check: "Referenced resources exist within scope, validated left-to-right in path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-scoped endpoints"

  - priority: 5
    category: business_referential
    check: "Body FK references (petition_id, representative_id, beneficiary_id) resolve to entities under the same estate"
    error_id: ERR_INVALID_REFERENCE
    http_status: 422
    applies_to: "POST create endpoints with FK body fields"

  - priority: 6
    category: business_constraint
    check: "Required body fields present and typed; enum members valid"
    error_id: ERR_MISSING_FIELD
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 7
    category: state
    check: "Optimistic concurrency: expected_estate_version equals Estate.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "all state-transition endpoints carrying expected_estate_version"

  - priority: 8
    category: state
    check: "Target resource in a valid from-state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: business_referential
    check: "Cross-entity state gate: Petition GRANTED for appoint; PR APPOINTED for claim allow; Estate CLOSED for discharge"
    error_id: ERR_CROSS_ENTITY_STATE
    http_status: 409
    applies_to: "appoint, claim allow/reject, discharge"

  - priority: 10
    category: business_temporal
    check: "Creditor claim filed_at within claim period (<= claim_bar_date) to be allowable"
    error_id: ERR_CLAIM_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST /claims/{id}/allow"

  - priority: 11
    category: business_safety
    check: "Priority waterfall: a claim may be PAID only if all strictly-higher-priority ALLOWED claims are already PAID"
    error_id: ERR_CLAIM_PRIORITY_VIOLATION
    http_status: 409
    applies_to: "POST /claims/{id}/pay"

  - priority: 12
    category: business_fiscal
    check: "Sufficient marshaled cash for the claim/distribution payment or bond adequacy for approval"
    error_id: ERR_INSUFFICIENT_MARSHALED_FUNDS
    http_status: 409
    applies_to: "claim pay, distribution pay"

  - priority: 13
    category: business_fiscal
    check: "Distribution proposed_amount_cents must not exceed Estate.residue_cents at approval"
    error_id: ERR_DISTRIBUTION_EXCEEDS_RESIDUE
    http_status: 409
    applies_to: "POST /distributions/{id}/approve"

  - priority: 14
    category: business_temporal
    check: "Courtroom overlap: new Hearing's [start_at, end_at) must not overlap any SCHEDULED Hearing sharing courtroom_code; half-open — adjacency (end==start) is allowed, no buffer"
    error_id: ERR_COURTROOM_CONFLICT
    http_status: 409
    applies_to: "POST /hearings"

  - priority: 15
    category: business_temporal
    check: "Judge calendar overlap: new Hearing must be separated from any SCHEDULED Hearing sharing judge_user_id by >= JUDGE_RECESS_MINUTES; closed-interval + buffer — the buffered window [start_at - recess, end_at + recess] must not contain another hearing's instant"
    error_id: ERR_JUDGE_CALENDAR_CONFLICT
    http_status: 409
    applies_to: "POST /hearings"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any set, the clock reads exactly this default and never falls back to wall-clock time. Deadlines/claim-bar rules read this clock."
    roles: [Clerk, ProbateJudge, PersonalRepresentative]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Logical clock advanced to to_iso8601"]

  # ---- Estate ----
  - method: POST
    path: "/estates"
    description: "Create (open a file for) an Estate in DRAFT"
    roles: [Clerk]
    code: 201
    input: [decedent_name, date_of_death, county_code, estate_type, gross_estate_value_cents]
    output: Estate
    side_effects: ["status=DRAFT", "supervision_level computed (calc estate_supervision_level)", "all ledger fields 0, claim_period_opened_at=null"]

  - method: GET
    path: "/estates/{id}"
    description: "Get an Estate with computed ledger and posture fields"
    roles: [Clerk, ProbateJudge, PersonalRepresentative]
    code: 200
    input: []
    output: Estate
    side_effects: []

  - method: GET
    path: "/estates"
    description: "List Estates (paginated); optional county/status filter"
    roles: [Clerk, ProbateJudge, PersonalRepresentative]
    code: 200
    input: ["county_code?", "status?", "limit?", "offset?"]
    output: Estate[]
    side_effects: []

  # ---- Petition ----
  - method: POST
    path: "/petitions"
    description: "File a petition (and lodge will) against a DRAFT estate"
    roles: [Clerk]
    code: 201
    input: [estate_id, petitioner_name, will_lodged, "will_date?", nominated_representative_name]
    output: Petition
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/petitions/{id}"
    description: "Get a Petition"
    roles: [Clerk, ProbateJudge, PersonalRepresentative]
    code: 200
    input: []
    output: Petition
    side_effects: []

  - method: GET
    path: "/petitions"
    description: "List Petitions; filter by estate_id (reverse lookup for Petition.estate_id)"
    roles: [Clerk, ProbateJudge, PersonalRepresentative]
    code: 200
    input: ["estate_id?", "status?", "limit?", "offset?"]
    output: Petition[]
    side_effects: []

  - method: POST
    path: "/petitions/{id}/grant"
    description: "Judge grants the petition; opens administration and starts claim period"
    roles: [ProbateJudge]
    code: 200
    input: [expected_estate_version]
    output: Petition
    side_effects: ["Petition PENDING->GRANTED", "Estate DRAFT->OPEN", "claim_period_opened_at set", "claim_bar_date computed", "increments Estate.version by 1"]

  - method: POST
    path: "/petitions/{id}/deny"
    description: "Judge denies the petition"
    roles: [ProbateJudge]
    code: 200
    input: [denial_reason, expected_estate_version]
    output: Petition
    side_effects: ["Petition PENDING->DENIED", "increments Estate.version by 1"]

  # ---- PersonalRepresentative ----
  - method: POST
    path: "/representatives"
    description: "Nominate a personal representative referencing a granted petition"
    roles: [Clerk]
    code: 201
    input: [estate_id, petition_id, full_name, representative_user_id]
    output: PersonalRepresentative
    side_effects: ["status=NOMINATED", "bond_required computed (calc estate_supervision_level)"]

  - method: GET
    path: "/representatives/{id}"
    description: "Get a PersonalRepresentative"
    roles: [Clerk, ProbateJudge, PersonalRepresentative]
    code: 200
    input: []
    output: PersonalRepresentative
    side_effects: []

  - method: GET
    path: "/representatives"
    description: "List PersonalRepresentatives; filter by estate_id, petition_id, or bond_id (reverse lookup for PR.estate_id, PR.petition_id, PR.bond_id)"
    roles: [Clerk, ProbateJudge, PersonalRepresentative]
    code: 200
    input: ["estate_id?", "petition_id?", "bond_id?", "status?", "limit?", "offset?"]
    output: PersonalRepresentative[]
    side_effects: []

  - method: POST
    path: "/representatives/{id}/appoint"
    description: "Judge appoints the PR and issues letters (bond must be APPROVED when required)"
    roles: [ProbateJudge]
    code: 200
    input: [expected_estate_version]
    output: PersonalRepresentative
    side_effects: ["PR NOMINATED->APPOINTED", "letters_issued_at set", "bond_id set", "increments Estate.version by 1"]

  - method: POST
    path: "/representatives/{id}/suspend"
    description: "Judge suspends an appointed PR"
    roles: [ProbateJudge]
    code: 200
    input: [expected_estate_version]
    output: PersonalRepresentative
    side_effects: ["PR APPOINTED->SUSPENDED", "increments Estate.version by 1"]

  - method: POST
    path: "/representatives/{id}/reinstate"
    description: "Judge reinstates a suspended PR"
    roles: [ProbateJudge]
    code: 200
    input: [expected_estate_version]
    output: PersonalRepresentative
    side_effects: ["PR SUSPENDED->APPOINTED", "increments Estate.version by 1"]

  - method: POST
    path: "/representatives/{id}/remove"
    description: "Judge removes a PR; forfeits any bond"
    roles: [ProbateJudge]
    code: 200
    input: [expected_estate_version]
    output: PersonalRepresentative
    side_effects: ["PR APPOINTED/SUSPENDED->REMOVED", "Bond FORFEITED if present", "increments Estate.version by 1"]

  - method: POST
    path: "/representatives/{id}/discharge"
    description: "Judge discharges a PR after estate closure; exonerates bond"
    roles: [ProbateJudge]
    code: 200
    input: [expected_estate_version]
    output: PersonalRepresentative
    side_effects: ["PR APPOINTED->DISCHARGED", "Bond EXONERATED if present", "increments Estate.version by 1"]

  # ---- Bond ----
  - method: POST
    path: "/bonds"
    description: "File a bond for a PR"
    roles: [PersonalRepresentative, Clerk]
    code: 201
    input: [estate_id, representative_id, surety_name, penal_amount_cents]
    output: Bond
    side_effects: ["status=FILED", "required_amount_cents computed (calc bond_required_amount)"]

  - method: GET
    path: "/bonds/{id}"
    description: "Get a Bond"
    roles: [Clerk, ProbateJudge, PersonalRepresentative]
    code: 200
    input: []
    output: Bond
    side_effects: []

  - method: GET
    path: "/bonds"
    description: "List Bonds; filter by estate_id or representative_id (reverse lookup for Bond.estate_id, Bond.representative_id)"
    roles: [Clerk, ProbateJudge, PersonalRepresentative]
    code: 200
    input: ["estate_id?", "representative_id?", "status?", "limit?", "offset?"]
    output: Bond[]
    side_effects: []

  - method: POST
    path: "/bonds/{id}/approve"
    description: "Judge approves the bond (penal amount must meet required amount)"
    roles: [ProbateJudge]
    code: 200
    input: [expected_estate_version]
    output: Bond
    side_effects: ["Bond FILED->APPROVED", "increments Estate.version by 1"]

  # ---- Beneficiary ----
  - method: POST
    path: "/beneficiaries"
    description: "Add a beneficiary with a residue share"
    roles: [Clerk, PersonalRepresentative]
    code: 201
    input: [estate_id, full_name, relationship, share_bps]
    output: Beneficiary
    side_effects: ["distributed_cents=0"]

  - method: GET
    path: "/beneficiaries/{id}"
    description: "Get a Beneficiary"
    roles: [Clerk, ProbateJudge, PersonalRepresentative]
    code: 200
    input: []
    output: Beneficiary
    side_effects: []

  - method: GET
    path: "/beneficiaries"
    description: "List Beneficiaries; filter by estate_id (reverse lookup for Beneficiary.estate_id)"
    roles: [Clerk, ProbateJudge, PersonalRepresentative]
    code: 200
    input: ["estate_id?", "limit?", "offset?"]
    output: Beneficiary[]
    side_effects: []

  # ---- CreditorClaim ----
  - method: POST
    path: "/claims"
    description: "File a creditor claim; filed_at stamped from logical clock"
    roles: [Clerk, PersonalRepresentative]
    code: 201
    input: [estate_id, creditor_name, claim_class, claimed_amount_cents]
    output: CreditorClaim
    side_effects: ["status=FILED", "filed_at set from logical clock"]

  - method: GET
    path: "/claims/{id}"
    description: "Get a CreditorClaim"
    roles: [Clerk, ProbateJudge, PersonalRepresentative]
    code: 200
    input: []
    output: CreditorClaim
    side_effects: []

  - method: GET
    path: "/claims"
    description: "List CreditorClaims; filter by estate_id/class/status (reverse lookup for CreditorClaim.estate_id)"
    roles: [Clerk, ProbateJudge, PersonalRepresentative]
    code: 200
    input: ["estate_id?", "claim_class?", "status?", "limit?", "offset?"]
    output: CreditorClaim[]
    side_effects: []

  - method: POST
    path: "/claims/{id}/allow"
    description: "PR allows a claim (within claim period) or auto-bars a late claim"
    roles: [PersonalRepresentative]
    code: 200
    input: ["allowed_amount_cents?", expected_estate_version]
    output: CreditorClaim
    side_effects: ["Claim FILED->ALLOWED (in period) or FILED->BARRED (late)", "allowed_claims_total recomputed", "increments Estate.version by 1"]

  - method: POST
    path: "/claims/{id}/reject"
    description: "PR rejects a claim"
    roles: [PersonalRepresentative]
    code: 200
    input: [expected_estate_version]
    output: CreditorClaim
    side_effects: ["Claim FILED->REJECTED", "increments Estate.version by 1"]

  - method: POST
    path: "/claims/{id}/pay"
    description: "PR pays an allowed claim from the marshaling ledger per the priority waterfall"
    roles: [PersonalRepresentative]
    code: 200
    input: [expected_estate_version]
    output: CreditorClaim
    side_effects: ["Claim ALLOWED->PAID", "paid_amount_cents set (calc claim_payment)", "marshaled_cash debited", "residue recomputed", "increments Estate.version by 1"]

  # ---- Asset ----
  - method: POST
    path: "/assets"
    description: "List (inventory) an asset in LISTED"
    roles: [Clerk, PersonalRepresentative]
    code: 201
    input: [estate_id, description, asset_class, declared_value_cents]
    output: Asset
    side_effects: ["status=LISTED"]

  - method: GET
    path: "/assets/{id}"
    description: "Get an Asset"
    roles: [Clerk, ProbateJudge, PersonalRepresentative]
    code: 200
    input: []
    output: Asset
    side_effects: []

  - method: GET
    path: "/assets"
    description: "List Assets; filter by estate_id/class/status (reverse lookup for Asset.estate_id)"
    roles: [Clerk, ProbateJudge, PersonalRepresentative]
    code: 200
    input: ["estate_id?", "asset_class?", "status?", "limit?", "offset?"]
    output: Asset[]
    side_effects: []

  - method: POST
    path: "/assets/{id}/appraise"
    description: "PR records the appraised value"
    roles: [PersonalRepresentative]
    code: 200
    input: [appraised_value_cents, expected_estate_version]
    output: Asset
    side_effects: ["Asset LISTED->APPRAISED", "inventory_total recomputed", "increments Estate.version by 1"]

  - method: POST
    path: "/assets/{id}/marshal"
    description: "PR marshals the asset into the estate; CASH adds to marshaled ledger"
    roles: [PersonalRepresentative]
    code: 200
    input: [expected_estate_version]
    output: Asset
    side_effects: ["Asset APPRAISED->MARSHALED", "marshaled_cash += appraised_value_cents if CASH", "residue recomputed", "increments Estate.version by 1"]

  - method: POST
    path: "/assets/{id}/liquidate"
    description: "PR liquidates a marshaled asset to cash"
    roles: [PersonalRepresentative]
    code: 200
    input: ["liquidation_proceeds_cents?", expected_estate_version]
    output: Asset
    side_effects: ["Asset MARSHALED->LIQUIDATED", "marshaled_cash += liquidation_proceeds_cents", "residue recomputed", "increments Estate.version by 1"]

  - method: POST
    path: "/assets/{id}/distribute-in-kind"
    description: "PR distributes a marshaled asset in kind to satisfy a devise"
    roles: [PersonalRepresentative]
    code: 200
    input: [expected_estate_version]
    output: Asset
    side_effects: ["Asset MARSHALED->DISTRIBUTED", "increments Estate.version by 1"]

  # ---- Distribution ----
  - method: POST
    path: "/distributions"
    description: "Propose a cash distribution to a beneficiary"
    roles: [PersonalRepresentative]
    code: 201
    input: [estate_id, beneficiary_id, proposed_amount_cents]
    output: Distribution
    side_effects: ["status=PROPOSED"]

  - method: GET
    path: "/distributions/{id}"
    description: "Get a Distribution"
    roles: [Clerk, ProbateJudge, PersonalRepresentative]
    code: 200
    input: []
    output: Distribution
    side_effects: []

  - method: GET
    path: "/distributions"
    description: "List Distributions; filter by estate_id/beneficiary_id/status (reverse lookup for Distribution.estate_id, Distribution.beneficiary_id)"
    roles: [Clerk, ProbateJudge, PersonalRepresentative]
    code: 200
    input: ["estate_id?", "beneficiary_id?", "status?", "limit?", "offset?"]
    output: Distribution[]
    side_effects: []

  - method: POST
    path: "/distributions/{id}/approve"
    description: "Judge approves a proposed distribution"
    roles: [ProbateJudge]
    code: 200
    input: [expected_estate_version]
    output: Distribution
    side_effects: ["Distribution PROPOSED->APPROVED", "increments Estate.version by 1"]

  - method: POST
    path: "/distributions/{id}/pay"
    description: "PR pays an approved distribution and files the receipt"
    roles: [PersonalRepresentative]
    code: 200
    input: [receipt_reference, expected_estate_version]
    output: Distribution
    side_effects: ["Distribution APPROVED->PAID", "marshaled_cash debited", "beneficiary_distributed recomputed", "residue recomputed", "increments Estate.version by 1"]

  - method: POST
    path: "/distributions/{id}/return"
    description: "PR records that an approved distribution was returned undelivered"
    roles: [PersonalRepresentative]
    code: 200
    input: [expected_estate_version]
    output: Distribution
    side_effects: ["Distribution APPROVED->RETURNED", "increments Estate.version by 1"]

  # ---- AccountingReport ----
  - method: POST
    path: "/accountings"
    description: "Draft an accounting report of a given type"
    roles: [PersonalRepresentative]
    code: 201
    input: [estate_id, report_type]
    output: AccountingReport
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/accountings/{id}"
    description: "Get an AccountingReport"
    roles: [Clerk, ProbateJudge, PersonalRepresentative]
    code: 200
    input: []
    output: AccountingReport
    side_effects: []

  - method: GET
    path: "/accountings"
    description: "List AccountingReports; filter by estate_id/type/status (reverse lookup for AccountingReport.estate_id)"
    roles: [Clerk, ProbateJudge, PersonalRepresentative]
    code: 200
    input: ["estate_id?", "report_type?", "status?", "limit?", "offset?"]
    output: AccountingReport[]
    side_effects: []

  - method: POST
    path: "/accountings/{id}/file"
    description: "PR files the accounting; snapshots ledger and computes balance"
    roles: [PersonalRepresentative]
    code: 200
    input: [expected_estate_version]
    output: AccountingReport
    side_effects: ["Report DRAFT->FILED", "snapshots captured", "balances computed (calc accounting_balance)", "increments Estate.version by 1"]

  - method: POST
    path: "/accountings/{id}/approve"
    description: "Judge approves a filed accounting; advances estate status (INVENTORY/INTERIM/FINAL)"
    roles: [ProbateJudge]
    code: 200
    input: [expected_estate_version]
    output: AccountingReport
    side_effects: ["Report FILED->APPROVED", "Estate.status advances per report_type", "increments Estate.version by 1"]

  - method: POST
    path: "/accountings/{id}/reject"
    description: "Judge rejects a filed accounting"
    roles: [ProbateJudge]
    code: 200
    input: [expected_estate_version]
    output: AccountingReport
    side_effects: ["Report FILED->REJECTED", "increments Estate.version by 1"]

  # ---- Hearing ----
  - method: POST
    path: "/hearings"
    description: "Schedule a court hearing on a courtroom/judge interval; rejected on courtroom or judge overlap"
    roles: [Clerk]
    code: 201
    input: [estate_id, hearing_type, courtroom_code, judge_user_id, start_at, end_at]
    output: Hearing
    side_effects: ["status=SCHEDULED", "courtroom_overlap and judge_calendar_overlap checked"]

  - method: GET
    path: "/hearings/{id}"
    description: "Get a Hearing"
    roles: [Clerk, ProbateJudge, PersonalRepresentative]
    code: 200
    input: []
    output: Hearing
    side_effects: []

  - method: GET
    path: "/hearings"
    description: "List Hearings; filter by estate_id/courtroom_code/judge_user_id/status (reverse lookup for Hearing.estate_id)"
    roles: [Clerk, ProbateJudge, PersonalRepresentative]
    code: 200
    input: ["estate_id?", "courtroom_code?", "judge_user_id?", "status?", "limit?", "offset?"]
    output: Hearing[]
    side_effects: []

  - method: POST
    path: "/hearings/{id}/hold"
    description: "Judge holds (conducts) a scheduled hearing whose start time has arrived"
    roles: [ProbateJudge]
    code: 200
    input: [expected_estate_version]
    output: Hearing
    side_effects: ["Hearing SCHEDULED->HELD", "increments Estate.version by 1"]

  - method: POST
    path: "/hearings/{id}/vacate"
    description: "Judge vacates a scheduled hearing, freeing its courtroom/judge interval"
    roles: [ProbateJudge]
    code: 200
    input: [expected_estate_version]
    output: Hearing
    side_effects: ["Hearing SCHEDULED->VACATED", "increments Estate.version by 1"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Acting ProbateJudge id equals the PR's representative_user_id on appoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced path resource does not exist within scope" }
  - { id: ERR_INVALID_REFERENCE, http: 422, condition: "Body FK reference does not resolve to an entity under the same estate" }
  - { id: ERR_MISSING_FIELD, http: 400, condition: "Required body field missing, wrong type, negative/zero where positive required, invalid enum value, or bad ISO date (incl. will_date when will_lodged, denial_reason on deny, liquidation_proceeds on non-CASH liquidate)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_estate_version does not match Estate.version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition" }
  - { id: ERR_CROSS_ENTITY_STATE, http: 409, condition: "A gating sibling/parent entity is in the wrong state (Petition not GRANTED, PR not APPOINTED, Estate not CLOSED)" }
  - { id: ERR_WILL_NOT_LODGED, http: 409, condition: "Grant of a TESTATE estate's petition attempted with no will lodged" }
  - { id: ERR_BOND_NOT_APPROVED, http: 409, condition: "Appoint attempted while a required bond is not APPROVED" }
  - { id: ERR_BOND_INSUFFICIENT, http: 409, condition: "Bond penal_amount_cents below required_amount_cents on approve" }
  - { id: ERR_CLAIM_PERIOD_CLOSED, http: 409, condition: "Claim allow attempted but filed_at is after Estate.claim_bar_date (claim is BARRED path)" }
  - { id: ERR_ALLOWED_AMOUNT_INVALID, http: 409, condition: "allowed_amount_cents not in (0, claimed_amount_cents] on allow" }
  - { id: ERR_CLAIM_PRIORITY_VIOLATION, http: 409, condition: "Claim pay attempted while a strictly-higher-priority ALLOWED claim is still unpaid" }
  - { id: ERR_INSUFFICIENT_MARSHALED_FUNDS, http: 409, condition: "Marshaled cash insufficient for the claim or distribution payment" }
  - { id: ERR_DISTRIBUTION_EXCEEDS_RESIDUE, http: 409, condition: "Distribution proposed_amount_cents exceeds Estate.residue_cents at approval" }
  - { id: ERR_CLAIMS_UNPAID, http: 409, condition: "Distribution approval attempted while some ALLOWED claims are not yet PAID" }
  - { id: ERR_ACCOUNTING_UNBALANCED, http: 409, condition: "Accounting approve attempted while balances == false" }
  - { id: ERR_COURTROOM_CONFLICT, http: 409, condition: "New hearing's half-open [start,end) overlaps a SCHEDULED hearing sharing courtroom_code" }
  - { id: ERR_JUDGE_CALENDAR_CONFLICT, http: 409, condition: "New hearing violates the JUDGE_RECESS_MINUTES buffer against a SCHEDULED hearing sharing judge_user_id" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Clerk
    description: "Court clerk: opens estate files, records petitions, nominates representatives, files bonds/claims/assets/beneficiaries. Records but never adjudicates."
    identity: "opaque"
    exclusive_operations:
      - "POST /estates — open an estate file"
      - "POST /petitions — file petition & lodge will"
      - "POST /representatives — nominate PR"
      - "POST /hearings — schedule a court hearing"
    shared_operations:
      - "POST /bonds — file bond (with PersonalRepresentative)"
      - "POST /beneficiaries — add beneficiary (with PersonalRepresentative)"
      - "POST /claims — file creditor claim (with PersonalRepresentative)"
      - "POST /assets — list asset (with PersonalRepresentative)"
      - "POST /_clock/set_current_utc — advance clock (shared)"
      - "GET endpoints — read all resources"

  - name: ProbateJudge
    description: "Adjudicates: grants/denies petitions, appoints/suspends/reinstates/removes/discharges PRs, approves bonds, approves distributions, approves/rejects accountings. Cannot act as the estate's PR (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /petitions/{id}/grant and .../deny"
      - "POST /representatives/{id}/appoint|suspend|reinstate|remove|discharge"
      - "POST /bonds/{id}/approve"
      - "POST /distributions/{id}/approve"
      - "POST /accountings/{id}/approve and .../reject"
      - "POST /hearings/{id}/hold and .../vacate"
    shared_operations:
      - "POST /_clock/set_current_utc — advance clock (shared)"
      - "GET endpoints — read all resources"

  - name: PersonalRepresentative
    description: "Once APPOINTED, administers the estate: appraises/marshals/liquidates/distributes assets, allows/rejects/pays claims, proposes/pays/returns distributions, drafts/files accountings. X-User-ID must equal the estate's PR representative_user_id for administration acts."
    identity: "opaque"
    exclusive_operations:
      - "POST /assets/{id}/appraise|marshal|liquidate|distribute-in-kind"
      - "POST /claims/{id}/allow|reject|pay"
      - "POST /distributions and .../pay and .../return"
      - "POST /accountings and .../file"
    shared_operations:
      - "POST /bonds — file bond (with Clerk)"
      - "POST /beneficiaries — add beneficiary (with Clerk)"
      - "POST /claims — file creditor claim (with Clerk)"
      - "POST /assets — list asset (with Clerk)"
      - "POST /_clock/set_current_utc — advance clock (shared)"
      - "GET endpoints — read all resources"
