  # Error-catalog audit (§1.6 has 56 ids). Every id below is triggered by at least
  # one instance in this file or in SCAFFOLD_DIFFICULTY_DESIGN.yaml:
  #   ERR_VALIDATION, ERR_CYCLE_NOT_FOUND, ERR_INDICATOR_NOT_FOUND -> entities section
  #   ERR_INVALID_STATE, ERR_INVALID_PHASE_TRANSITION, ERR_INPUT_WINDOW_CLOSED,
  #     ERR_INSUFFICIENT_INDICATOR_COVERAGE, ERR_NO_SELECTED_PRIORITY -> state_machines section
  #   ERR_DUPLICATE_FISCAL_YEAR, ERR_DUPLICATE_INDICATOR_NAME, ERR_DUPLICATE_ORGANIZATION,
  #     ERR_PARTY_FTE_CAPACITY_EXCEEDED, ERR_POSTING_BASIS_MISMATCH,
  #     ERR_DATA_POINT_OUT_OF_WINDOW -> validations section
  #   ERR_PARTY_TYPE_MISMATCH, ERR_DUPLICATE_EVALUATION_PERIOD,
  #     ERR_OBJECTIVE_PROGRESS_MISSING -> endpoints section
  #   ERR_UNAUTHORIZED, ERR_NOT_AGREEMENT_PARTY, ERR_SEGREGATION_OF_DUTIES -> rbac section
  #   ERR_STALE_CANDIDATE_VERSION, ERR_STALE_REPORT_VERSION -> cross_cutting_complexity_layers
  #   ERR_STRATEGY_LOCKED, ERR_PUBLIC_AVAILABILITY_NOT_MET, ERR_FACILITATOR_WINDOW_CONFLICT,
  #     ERR_INDICATOR_DATA_INSUFFICIENT, ERR_STRATEGY_NOT_APPROVED,
  #     ERR_PARTNERSHIP_NOT_EXECUTED, ERR_COMMITMENT_OUTSIDE_TERM,
  #     ERR_PARTNERSHIP_PLEDGE_WINDOW_EXCEEDED, ERR_PRIORITY_SCORE_BELOW_THRESHOLD,
  #     ERR_NO_COMMUNITY_INPUT, ERR_REPORT_EMPTY -> §1.8 instances
  #   the remaining 19 ids are triggered by the instances in this section.
  - section: errors
    instances:
      - name: missing_or_unknown_role_headers_return_unauthenticated
        claim_type: Error Triggerable
        grounds:
          - validations.priority_1.ERR_UNAUTHENTICATED
          - roles
        distinguishing_aspect: "Authentication is checked before role authorisation and before path existence: the same read fails with 401 ERR_UNAUTHENTICATED when X-User-Role is absent, when X-User-ID is absent, and when X-User-Role names a role outside the six declared ones — even if the path id does not exist."
        test_recipe:
          setup:
            - "one AssessmentCycle in DRAFT"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
              captures: { cyc: $.data.id }
          trigger:
            - call: "GET /assessment-cycles/${cyc}"
              payload: {}
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
          assert:
            - "the trigger call as written returns HTTP 200 — it is the authenticated baseline"
            - "the same GET reissued with the X-User-Role header omitted returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "the same GET reissued with the X-User-ID header omitted returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "the same GET reissued with X-User-Role: Auditor (a role not declared in §1.7) returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED, not 403"
            - "a GET /assessment-cycles/00000000-0000-4000-8000-000000000fff with no X-User-Role header returns 401, not 404 — authentication precedes existence"

      - name: unknown_path_ids_return_their_own_not_found_error
        claim_type: Error Triggerable
        grounds:
          - validations.priority_3
          - errors
        distinguishing_aspect: "Each of the eleven remaining resource paths reports its own NOT_FOUND id rather than a generic one, so a client can tell which segment of a nested path failed."
        test_recipe:
          setup:
            - "empty database (no rows of any entity type)"
          setup_api_calls:
            - call: "GET /assessment-cycles"
              payload: { limit: 10, offset: 0 }
              as: CommunityBenefitOfficer
          trigger:
            - call: "GET /indicator-data-points/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: DataSteward
            - call: "GET /responsible-parties/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: CommunityBenefitOfficer
            - call: "GET /stakeholder-interviews/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: CommunityBenefitOfficer
            - call: "GET /priority-candidates/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: BoardChair
            - call: "GET /implementation-strategies/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: BoardChair
            - call: "GET /strategy-objectives/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: CommunityBenefitOfficer
            - call: "GET /partnership-agreements/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /resource-commitments/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /community-benefit-reports/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /expense-postings/00000000-0000-4000-8000-00000000000a"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /progress-evaluations/00000000-0000-4000-8000-00000000000b"
              payload: {}
              as: PublicViewer
          assert:
            - "each trigger call returns HTTP 404 with response_type == \"error\""
            - "the error ids are, in order: ERR_DATA_POINT_NOT_FOUND, ERR_PARTY_NOT_FOUND, ERR_INTERVIEW_NOT_FOUND, ERR_CANDIDATE_NOT_FOUND, ERR_STRATEGY_NOT_FOUND, ERR_OBJECTIVE_NOT_FOUND, ERR_PARTNERSHIP_NOT_FOUND, ERR_COMMITMENT_NOT_FOUND, ERR_REPORT_NOT_FOUND, ERR_POSTING_NOT_FOUND, ERR_EVALUATION_NOT_FOUND"
            - "every response carries meta.api_request_id and a non-empty data.message"

      - name: duplicate_report_for_the_same_cycle_and_fiscal_year_rejected
        claim_type: Error Triggerable
        grounds:
          - validations.priority_18.ERR_DUPLICATE_REPORT
          - endpoints.POST_/community-benefit-reports
        distinguishing_aspect: "At most one CommunityBenefitReport may exist per (cycle_id, fiscal_year), which is also what makes the file-return rule able to speak of \"the\" report of a cycle."
        test_recipe:
          setup:
            - "one AssessmentCycle for fiscal_year 2026 with one OPEN CommunityBenefitReport for 2026"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
              captures: { cyc: $.data.id }
            - call: "POST /community-benefit-reports"
              payload: { cycle_id: "${cyc}", fiscal_year: 2026 }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
          trigger:
            - call: "POST /community-benefit-reports"
              payload: { cycle_id: "${cyc}", fiscal_year: 2026 }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_2"
            - call: "POST /community-benefit-reports"
              payload: { cycle_id: "${cyc}", fiscal_year: 2027 }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
            - call: "GET /community-benefit-reports"
              payload: { cycle_id: "${cyc}", limit: 10, offset: 0 }
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
          assert:
            - "trigger call 1: HTTP 409 with data.error_id == ERR_DUPLICATE_REPORT — a different acting user does not create a new scope"
            - "trigger call 2: HTTP 201 — the key includes fiscal_year, so a second reporting year is allowed on the same cycle"
            - "trigger call 3: total_count == 2 and both rows have status == OPEN"

      - name: board_action_quorum_and_vote_rules_rejected_before_adoption
        claim_type: Error Triggerable
        grounds:
          - validations.priority_23.ERR_QUORUM_NOT_MET
          - validations.priority_24.ERR_ADOPTION_VOTE_FAILED
        distinguishing_aspect: "The board rules are ordered: quorum is tested first, so a no-quorum action with a losing vote reports ERR_QUORUM_NOT_MET, and with quorum present a tied vote still fails because the rule is strict (votes_for > votes_against)."
