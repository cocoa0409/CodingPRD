  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: evaluator_window_half_open_rejects_overlap_allows_adjacency
        grounds:
          - validations[priority=13]
          - errors[ERR_EVALUATOR_WINDOW_CONFLICT]
          - entities.Observation.fields.scheduled_start
          - entities.Observation.fields.scheduled_end
        distinguishing_aspect: |
          Interval semantics A on the Evaluator resource: occupation is the half-open interval
          [scheduled_start, scheduled_end), so 09:30-10:30 against an existing 09:00-10:00 is a
          true intersection and is rejected, while 10:00-11:00 touches the previous end exactly
          and is accepted. Adjacency is legal because the end instant is excluded.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; policy at defaults."
            - "One certified evaluator, TWO educators in the same school, one cycle each, so the per-educator formal spacing rule cannot fire."
            - "Cycle 1 already holds a SCHEDULED FORMAL observation for that evaluator from 2026-09-10T09:00:00Z to 2026-09-10T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HrAdmin
            - call: "POST /evaluation-policies"
              payload: { school_year: "2026-2027" }
              as: HrAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /schools"
              payload: { name: "Lincoln High", code: "LHS", level: "HIGH", evaluation_budget_allocated_cents: 100000 }
              as: HrAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /educators"
              payload: { school_id: "${sch_id}", employee_number: "E-B101", full_name: "Ada Lin", service_start_date: "2024-08-15" }
              as: HrAdmin
              captures: { edu1_id: $.data.id }
            - call: "POST /educators"
              payload: { school_id: "${sch_id}", employee_number: "E-B102", full_name: "Bo Nash", service_start_date: "2024-08-15" }
              as: HrAdmin
              captures: { edu2_id: $.data.id }
            - call: "POST /evaluators"
              payload: { full_name: "Pat Ortiz" }
              as: HrAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /calibration-reviews"
              payload: { evaluator_id: "${ev_id}", anchor_lesson_code: "ANCH-1", anchor_score: 3.00, evaluator_score: 3.10 }
              as: HrAdmin
              captures: { cal1_id: $.data.id }
            - call: "POST /calibration-reviews/${cal1_id}/decide"
              payload: { policy_id: "${pol_id}" }
              as: HrAdmin
            - call: "POST /evaluation-cycles"
              payload: { educator_id: "${edu1_id}", policy_id: "${pol_id}", school_year: "2026-2027", cycle_type: "COMPREHENSIVE" }
              as: HrAdmin
              captures: { cyc1_id: $.data.id }
            - call: "POST /evaluation-cycles"
              payload: { educator_id: "${edu2_id}", policy_id: "${pol_id}", school_year: "2026-2027", cycle_type: "COMPREHENSIVE" }
              as: HrAdmin
              captures: { cyc2_id: $.data.id }
            - call: "POST /observations"
              payload: { cycle_id: "${cyc1_id}", evaluator_id: "${ev_id}", observation_type: "FORMAL", scheduled_start: "2026-09-10T09:00:00Z", scheduled_end: "2026-09-10T10:00:00Z", announced: true }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { obs1_id: $.data.id }
          trigger:
            - call: "POST /observations"
              payload: { cycle_id: "${cyc2_id}", evaluator_id: "${ev_id}", observation_type: "FORMAL", scheduled_start: "2026-09-10T09:30:00Z", scheduled_end: "2026-09-10T10:30:00Z", announced: true }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { err: $.data.error_id }
            - call: "POST /observations"
              payload: { cycle_id: "${cyc2_id}", evaluator_id: "${ev_id}", observation_type: "FORMAL", scheduled_start: "2026-09-10T10:00:00Z", scheduled_end: "2026-09-10T11:00:00Z", announced: true }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { obs3_id: $.data.id }
          assert:
            - "The overlapping request returns HTTP 409 with error_id == ERR_EVALUATOR_WINDOW_CONFLICT"
            - "The adjacent request returns HTTP 201"
            - "Observation.${obs3_id}.status == SCHEDULED"
            - "Observation.${obs3_id}.scheduled_start == 2026-09-10T10:00:00Z"
            - "GET /observations filtered by cycle_id ${cyc2_id} returns exactly 1 observation"
            - "GET /observations filtered by evaluator_id ${ev_id} returns exactly 2 observations"

      - name: educator_formal_spacing_buffer_rejects_nine_days_allows_ten
        grounds:
          - validations[priority=14]
          - errors[ERR_FORMAL_SPACING_VIOLATION]
          - entities.EvaluationPolicy.fields.min_days_between_formals
          - entities.Observation.fields.observation_type
        distinguishing_aspect: |
          Interval semantics B on a different resource entity, the Educator: the rule is not
          an intersection test at all but a buffered separation between scheduled_start
          instants across every cycle of that educator. Nine days apart is rejected and
          exactly ten days apart is accepted, because the comparison is a strict `<` against
          min_days_between_formals — windows that never overlap can still collide.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; policy at default min_days_between_formals 10."
            - "One certified evaluator, one educator, one cycle."
            - "One SCHEDULED FORMAL observation starting 2026-09-10T09:00:00Z and ending an hour later."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HrAdmin
            - call: "POST /evaluation-policies"
              payload: { school_year: "2026-2027", min_days_between_formals: 10 }
              as: HrAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /schools"
              payload: { name: "Lincoln High", code: "LHS", level: "HIGH", evaluation_budget_allocated_cents: 100000 }
              as: HrAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /educators"
              payload: { school_id: "${sch_id}", employee_number: "E-B201", full_name: "Cleo Marr", service_start_date: "2024-08-15" }
              as: HrAdmin
              captures: { edu_id: $.data.id }
            - call: "POST /evaluators"
              payload: { full_name: "Pat Ortiz" }
              as: HrAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /calibration-reviews"
              payload: { evaluator_id: "${ev_id}", anchor_lesson_code: "ANCH-1", anchor_score: 3.00, evaluator_score: 3.10 }
              as: HrAdmin
              captures: { cal1_id: $.data.id }
            - call: "POST /calibration-reviews/${cal1_id}/decide"
              payload: { policy_id: "${pol_id}" }
              as: HrAdmin
            - call: "POST /evaluation-cycles"
              payload: { educator_id: "${edu_id}", policy_id: "${pol_id}", school_year: "2026-2027", cycle_type: "COMPREHENSIVE" }
              as: HrAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /observations"
              payload: { cycle_id: "${cyc_id}", evaluator_id: "${ev_id}", observation_type: "FORMAL", scheduled_start: "2026-09-10T09:00:00Z", scheduled_end: "2026-09-10T10:00:00Z", announced: true }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { obs1_id: $.data.id }
          trigger:
            - call: "POST /observations"
              payload: { cycle_id: "${cyc_id}", evaluator_id: "${ev_id}", observation_type: "FORMAL", scheduled_start: "2026-09-19T09:00:00Z", scheduled_end: "2026-09-19T10:00:00Z", announced: true }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { err: $.data.error_id }
            - call: "POST /observations"
              payload: { cycle_id: "${cyc_id}", evaluator_id: "${ev_id}", observation_type: "FORMAL", scheduled_start: "2026-09-20T09:00:00Z", scheduled_end: "2026-09-20T10:00:00Z", announced: true }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { obs3_id: $.data.id }
          assert:
            - "The 9-day-apart request returns HTTP 409 with error_id == ERR_FORMAL_SPACING_VIOLATION"
            - "The 9-day-apart request does NOT return ERR_EVALUATOR_WINDOW_CONFLICT (the windows do not intersect)"
            - "The 10-day-apart request returns HTTP 201"
            - "Observation.${obs3_id}.status == SCHEDULED"
            - "Observation.${obs3_id}.scheduled_start == 2026-09-20T09:00:00Z"
            - "GET /observations filtered by cycle_id ${cyc_id} returns exactly 2 observations"

