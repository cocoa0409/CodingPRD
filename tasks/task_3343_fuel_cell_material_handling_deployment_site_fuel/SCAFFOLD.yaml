scenario: >-
  Fuel Cell Material Handling Deployment & On-Site Fuel Supply (Plug Power): customer
  site assessment for forklift fleet conversion with duty cycles, fueling station
  siting and safety review, hydrogen supply arrangements through delivered liquid,
  on-site generation or pipeline with pricing and reliability terms, fueling
  infrastructure construction with permitting, indoor dispensing approvals and fire
  code compliance, fleet conversion scheduling to avoid disrupting warehouse
  operations with transition periods running both technologies, service agreements
  covering unit maintenance, stack replacement and availability guarantees, fuel
  consumption measurement and billing with performance against expected productivity
  gains, incentive and tax credit qualification affecting project economics, safety
  training for warehouse personnel
domain_name: fuel-cell-mh-deployment-site-fuel
api_prefix: "/api"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - resource_temporal_overlap
  entity_topology: hierarchical
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: approval_chain
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Site
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Unique human-readable site code; unique across all sites."
        constraints: "1..40 chars; unique"
      - name: name
        type: string
        source: input
        description: "Customer-facing site name."
        constraints: "1..120 chars"
      - name: address
        type: string
        source: input
        description: "Street address of the deployment site."
        constraints: "1..200 chars"
      - name: status
        type: enum
        source: computed
        description: "ACTIVE, SUSPENDED, CLOSED. Initial ACTIVE. SUSPENDED when the site has zero ACTIVE supply contracts after an expiry/termination; back to ACTIVE when a contract activates while SUSPENDED; CLOSED only by explicit close."
        constraints: "enum {ACTIVE, SUSPENDED, CLOSED}; initial ACTIVE"
      - name: baseline_labor_rate_per_hour
        type: number
        source: input
        description: "Fully-loaded operator labor rate (USD/hour) used as the productivity baseline for incentive calculations."
        constraints: ">= 0.01"
      - name: actual_productivity_units_per_hour
        type: number
        source: system
        description: "Observed post-conversion throughput (pallet moves/hour); null until recorded via record-productivity."
        default: null
  - name: Assessment
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; owning site."
      - name: forklift_count
        type: integer
        source: input
        description: "Number of forklifts surveyed for conversion."
        constraints: ">= 1"
      - name: duty_cycle_hours_per_day
        type: number
        source: input
        description: "Average engine-on hours per forklift per day."
        constraints: "> 0"
      - name: peak_shift_hours
        type: integer
        source: input
        description: "Count of hours in the peak operating window."
        constraints: ">= 1 and <= 24"
      - name: daily_kg_estimate
        type: number
        source: computed
        description: "Estimated daily hydrogen consumption in kg (see daily_kg_estimate calculation)."
      - name: safety_findings_json
        type: string
        source: input
        description: "JSON document of safety review findings; must parse as a JSON object."
        constraints: "valid JSON object string"
      - name: status
        type: enum
        source: computed
        description: "DRAFT -> SUBMITTED -> APPROVED | REJECTED; REJECTED -> DRAFT allowed for revision."
        constraints: "enum {DRAFT, SUBMITTED, APPROVED, REJECTED}; initial DRAFT"
  - name: SupplyContract
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; owning site."
      - name: supply_mode
        type: enum
        source: input
        description: "Hydrogen supply channel."
        constraints: "enum {DELIVERED_LIQUID, ON_SITE_GENERATION, PIPELINE}"
      - name: start_date
        type: string
        source: input
        description: "Contract coverage start, ISO date YYYY-MM-DD."
        constraints: "YYYY-MM-DD"
      - name: end_date
        type: string
        source: input
        description: "Contract coverage end, ISO date YYYY-MM-DD; must be >= start_date."
        constraints: "YYYY-MM-DD; >= start_date"
      - name: base_price_per_kg
        type: number
        source: input
        description: "Base commodity price in USD per kg."
        constraints: "> 0"
      - name: reliability_sla_pct
        type: number
        source: input
        description: "Contractual availability guarantee as a percentage, e.g. 99.5."
        constraints: ">= 0 and <= 100"
      - name: committed_monthly_kg
        type: number
        source: input
        description: "Monthly take-or-pay commitment in kg."
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: "DRAFT -> ACTIVE -> EXPIRED | TERMINATED."
        constraints: "enum {DRAFT, ACTIVE, EXPIRED, TERMINATED}; initial DRAFT"
      - name: terminated_at
        type: string
        source: system
        description: "ISO datetime of termination; null until TERMINATED."
        constraints: "null or ISO8601"
  - name: FuelingStation
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; owning site."
      - name: station_code
        type: string
        source: input
        description: "Station identifier within the site."
        constraints: "1..40 chars"
      - name: location_type
        type: enum
        source: input
        description: "Siting classification driving fire-code checks."
        constraints: "enum {INDOOR, OUTDOOR}"
      - name: capacity_kg_per_day
        type: number
        source: input
        description: "Nameplate dispensing capacity in kg/day."
        constraints: "> 0"
      - name: storage_capacity_kg
        type: number
        source: input
        description: "On-site storage in kg; INDOOR stations must be <= 200 kg (fire-code maximum)."
        constraints: "> 0"
      - name: construction_start
        type: string
        source: input
        description: "Planned construction start date."
        constraints: "YYYY-MM-DD"
      - name: construction_end
        type: string
        source: input
        description: "Planned construction end date; must be >= construction_start."
        constraints: "YYYY-MM-DD; >= construction_start"
      - name: construction_status
        type: enum
        source: computed
        description: "PLANNED -> PERMITTED -> CONSTRUCTION -> COMMISSIONED; PERMITTED|CONSTRUCTION -> SUSPENDED when an ISSUED permit expires; COMMISSIONED terminal."
        constraints: "enum {PLANNED, PERMITTED, CONSTRUCTION, COMMISSIONED, SUSPENDED}; initial PLANNED"
      - name: commissioned_at
        type: string
        source: system
        description: "ISO datetime when the station was commissioned; null until COMMISSIONED."
        constraints: "null or ISO8601"
  - name: Permit
    parent: FuelingStation
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> FuelingStation.id; station this permit governs."
      - name: permit_type
        type: enum
        source: input
        description: "CONSTRUCTION and FIRE are required before construction starts; DISPENSING_INDOOR additionally before commissioning an INDOOR station."
        constraints: "enum {CONSTRUCTION, FIRE, DISPENSING_INDOOR}"
      - name: issued_date
        type: string
        source: input
        description: "Date the authority issued the permit."
        constraints: "YYYY-MM-DD"
      - name: expiry_date
        type: string
        source: input
        description: "Date the permit lapses; must be > issued_date."
        constraints: "YYYY-MM-DD; > issued_date"
      - name: status
        type: enum
        source: computed
        description: "PENDING -> ISSUED | REJECTED; ISSUED -> EXPIRED automatic when current date > expiry_date."
        constraints: "enum {PENDING, ISSUED, REJECTED, EXPIRED}; initial PENDING"
  - name: ConversionPlan
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; owning site."
      - name: name
        type: string
        source: input
        description: "Plan label, e.g. 'Q1 fleet wave'."
        constraints: "1..80 chars"
      - name: target_forklift_count
        type: integer
        source: input
        description: "Total units this plan intends to convert; must be <= the site's APPROVED assessment forklift_count at scheduling."
        constraints: ">= 1"
      - name: transition_mode
        type: enum
        source: input
        description: "PARALLEL runs both powertrains during the wave; CUTOVER converts units immediately."
        constraints: "enum {PARALLEL, CUTOVER}"
      - name: start_date
        type: string
        source: input
        description: "First conversion day."
        constraints: "YYYY-MM-DD"
      - name: end_date
        type: string
        source: input
        description: "Last conversion day; must be > start_date."
        constraints: "YYYY-MM-DD; > start_date"
      - name: status
        type: enum
        source: computed
        description: "DRAFT -> SCHEDULED -> IN_PROGRESS -> COMPLETED | CANCELLED; SCHEDULED -> DRAFT revert allowed while no ConversionEvent is COMPLETED."
        constraints: "enum {DRAFT, SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED}; initial DRAFT"
      - name: baseline_productivity_units_per_hour
        type: number
        source: input
        description: "Observed warehouse throughput (pallet moves/hour) before conversion; incentive baseline."
        constraints: "> 0"
      - name: expected_productivity_gain_pct
        type: number
        source: input
        description: "Contractually expected percentage uplift in throughput after conversion."
        constraints: ">= 0"
  - name: ConversionEvent
    parent: ConversionPlan
    common_fields: true
    fields:
      - name: conversion_plan_id
        type: string
        source: input
        description: "FK -> ConversionPlan.id; parent plan."
      - name: forklift_id
        type: string
        source: input
        description: "Unique unit identifier for the forklift being converted."
        constraints: "1..60 chars"
      - name: scheduled_start
        type: string
        source: input
        description: "Planned conversion start datetime (ISO8601 with Z)."
        constraints: "ISO8601"
      - name: scheduled_end
        type: string
        source: input
        description: "Planned conversion end datetime; must be > scheduled_start."
        constraints: "ISO8601; > scheduled_start"
      - name: technician_id
        type: string
        source: input
        description: "FK -> Technician.id; assigned technician."
      - name: status
        type: enum
        source: computed
        description: "SCHEDULED -> IN_PROGRESS -> COMPLETED | CANCELLED; IN_PROGRESS -> SCHEDULED revert allowed on technician unavailability."
        constraints: "enum {SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED}; initial SCHEDULED"
      - name: completed_at
        type: string
        source: system
        description: "ISO datetime of completion; null until COMPLETED."
        constraints: "null or ISO8601"
  - name: Technician
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Technician full name."
        constraints: "1..120 chars"
      - name: certification_level
        type: enum
        source: input
        description: "Highest fuel-cell certification held."
        constraints: "enum {BASIC, ADVANCED, MASTER}"
      - name: certified_until
        type: string
        source: input
        description: "Certification expiry date; must be a future date at creation."
        constraints: "YYYY-MM-DD; > current date at creation"
      - name: active
        type: boolean
        source: input
        description: "Whether the technician is available for assignment."
        default: true
  - name: ServiceAgreement
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; owning site."
      - name: coverage_start
        type: string
        source: input
        description: "Coverage start date."
        constraints: "YYYY-MM-DD"
      - name: coverage_end
        type: string
        source: input
        description: "Coverage end date; must be > coverage_start."
        constraints: "YYYY-MM-DD; > coverage_start"
      - name: stack_replacement_included
        type: boolean
        source: input
        description: "Whether fuel-cell stack replacements are covered at no parts charge."
        default: false
      - name: availability_guarantee_pct
        type: number
        source: input
        description: "Guaranteed fleet availability percentage; SLA credit applies when the monthly aggregate falls strictly below it."
        constraints: "> 0 and <= 100"
      - name: monthly_fee_cents
        type: integer
        source: input
        description: "Fixed monthly service fee in USD cents."
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "DRAFT -> ACTIVE -> TERMINATED | EXPIRED."
        constraints: "enum {DRAFT, ACTIVE, TERMINATED, EXPIRED}; initial DRAFT"
  - name: DowntimeReport
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; reporting site."
      - name: month
        type: string
        source: input
        description: "Calendar month the downtime belongs to, YYYY-MM."
        constraints: "YYYY-MM"
      - name: forklift_id
        type: string
        source: input
        description: "Unit identifier that was down."
        constraints: "1..60 chars"
      - name: downtime_hours
        type: number
        source: input
        description: "Hours the unit was unavailable in the month."
        constraints: ">= 0"
  - name: FuelingEvent
    parent: FuelingStation
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> FuelingStation.id; dispensing station."
      - name: forklift_id
        type: string
        source: input
        description: "Unit identifier that was fueled."
        constraints: "1..60 chars"
      - name: occurred_at
        type: string
        source: input
        description: "Dispense timestamp (ISO8601 with Z); must be >= the station's commissioned_at."
        constraints: "ISO8601; >= station.commissioned_at"
      - name: kg_dispensed
        type: number
        source: input
        description: "Hydrogen dispensed in kg."
        constraints: "> 0"
      - name: supply_contract_id
        type: string
        source: input
        description: "FK -> SupplyContract.id; contract this draw is billed under."
  - name: FuelInvoice
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; billed site."
      - name: supply_contract_id
        type: string
        source: input
        description: "FK -> SupplyContract.id; contract whose pricing applies."
      - name: period_start
        type: string
        source: input
        description: "Billing period start (inclusive), YYYY-MM-DD."
        constraints: "YYYY-MM-DD"
      - name: period_end
        type: string
        source: input
        description: "Billing period end (exclusive), YYYY-MM-DD; must be > period_start."
        constraints: "YYYY-MM-DD; > period_start"
      - name: total_kg
        type: number
        source: computed
        description: "Sum of kg over the invoice's FuelLineItems."
        default: 0
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Sum of line_amount_cents over the invoice's FuelLineItems."
        default: 0
      - name: credit_cents
        type: integer
        source: computed
        description: "Take-or-pay credit in cents; PROVISIONAL variant while DRAFT, FINAL variant frozen at ISSUED (see take_or_pay_credit)."
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "subtotal_cents - credit_cents, clamped at 0."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "DRAFT -> ISSUED -> PAID | DISPUTED | VOID; DISPUTED -> ISSUED on resolution."
        constraints: "enum {DRAFT, ISSUED, PAID, DISPUTED, VOID}; initial DRAFT"
  - name: FuelLineItem
    parent: FuelInvoice
    common_fields: true
    fields:
      - name: invoice_id
        type: string
        source: input
        description: "FK -> FuelInvoice.id; parent invoice."
      - name: fueling_event_id
        type: string
        source: input
        description: "FK -> FuelingEvent.id; billed dispense event."
      - name: kg
        type: number
        source: computed
        description: "Copied from FuelingEvent.kg_dispensed at line creation."
      - name: unit_price_per_kg
        type: number
        source: computed
        description: "Tiered unit price from supply_pricing_tier calculation at line creation."
      - name: line_amount_cents
        type: integer
        source: computed
        description: "ROUND_HALF_UP(kg * unit_price_per_kg * 100, 0); per-line rounding then sum (see supply_pricing_tier)."
  - name: IncentiveClaim
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; owning site."
      - name: incentive_type
        type: enum
        source: input
        description: "Qualification program."
        constraints: "enum {FEDERAL_ITC, STATE_REBATE, UTILITY_GRANT}"
      - name: claimed_amount_cents
        type: integer
        source: input
        description: "Amount claimed in USD cents."
        constraints: ">= 0"
      - name: qualification_date
        type: string
        source: input
        description: "Date the qualifying expenditure was placed in service."
        constraints: "YYYY-MM-DD"
      - name: approved_amount_cents
        type: integer
        source: computed
        description: "Amount approved; null until APPROVED. For FEDERAL_ITC computed via incentive_qualification_amount; for other types equals claimed_amount_cents."
        default: null
      - name: status
        type: enum
        source: computed
        description: "DRAFT -> SUBMITTED -> APPROVED | REJECTED."
        constraints: "enum {DRAFT, SUBMITTED, APPROVED, REJECTED}; initial DRAFT"
  - name: TrainingRecord
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; owning site."
      - name: trainee_employee_id
        type: string
        source: input
        description: "Customer-side employee identifier."
        constraints: "1..60 chars"
      - name: course_code
        type: enum
        source: input
        description: "Safety course taken."
        constraints: "enum {H2_BASIC, H2_OPERATOR, H2_EMERGENCY}"
      - name: completed_at
        type: string
        source: input
        description: "Course completion date."
        constraints: "YYYY-MM-DD"
      - name: expires_at
        type: string
        source: input
        description: "Certification expiry; must be > completed_at."
        constraints: "YYYY-MM-DD; > completed_at"
      - name: status
        type: enum
        source: computed
        description: "VALID -> EXPIRED automatic when current date > expires_at."
        constraints: "enum {VALID, EXPIRED}; initial VALID"

state_machines:
  - entity: Site
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /api/sites/{id}/close"
        actor: SiteManager
        preconditions:
          - "site.status == ACTIVE"
        side_effects:
          - "increments site.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "cascade: a SupplyContract of this site transitions ACTIVE -> EXPIRED or ACTIVE -> TERMINATED while the site has no other SupplyContract in ACTIVE status"
        actor: system
        preconditions:
          - "site.status == ACTIVE"
          - "count(SupplyContract for site with status == ACTIVE) == 0 after the triggering transition"
        side_effects:
          - "increments site.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "cascade: a SupplyContract of this site transitions DRAFT -> ACTIVE"
        actor: system
        preconditions:
          - "site.status == SUSPENDED"
        side_effects:
          - "increments site.version by 1"

  - entity: Assessment
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/sites/{id}/assessments/{aid}/submit"
        actor: SiteManager
        preconditions:
          - "assessment.status == DRAFT"
          - "site.status == ACTIVE"
        side_effects:
          - "assessment.daily_kg_estimate recomputed (daily_kg_estimate calculation)"
          - "increments assessment.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/sites/{id}/assessments/{aid}/approve"
        actor: SafetyOfficer
        preconditions:
          - "assessment.status == SUBMITTED"
          - "site.status == ACTIVE"
        side_effects:
          - "gates later ConversionPlan scheduling (cross-entity dependency ERR_ASSESSMENT_NOT_APPROVED)"
          - "increments assessment.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/sites/{id}/assessments/{aid}/reject"
        actor: SafetyOfficer
        preconditions:
          - "assessment.status == SUBMITTED"
        side_effects:
          - "increments assessment.version by 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /api/sites/{id}/assessments/{aid}/revise"
        actor: SiteManager
        preconditions:
          - "assessment.status == REJECTED"
        side_effects:
          - "increments assessment.version by 1"

  - entity: SupplyContract
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/sites/{id}/supply-contracts/{cid}/activate"
        actor: SiteManager
        preconditions:
          - "contract.status == DRAFT"
          - "site.status in {ACTIVE, SUSPENDED}"
          - "end_date >= start_date"
        side_effects:
          - "site.status SUSPENDED -> ACTIVE when the site was SUSPENDED (cascade)"
          - "increments contract.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system clock: current date > end_date"
        actor: system
        preconditions:
          - "contract.status == ACTIVE"
          - "current date > end_date"
        side_effects:
          - "site.status ACTIVE -> SUSPENDED if no other ACTIVE SupplyContract covers the site (cascade)"
          - "increments contract.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/sites/{id}/supply-contracts/{cid}/terminate"
        actor: SiteManager
        preconditions:
          - "contract.status == ACTIVE"
          - "no FuelInvoice for this contract in DRAFT, ISSUED, or DISPUTED status (open invoices block termination)"
        side_effects:
          - "contract.terminated_at = current timestamp"
          - "site.status ACTIVE -> SUSPENDED if no other ACTIVE SupplyContract remains (cascade)"
          - "increments contract.version by 1"

  - entity: FuelingStation
    initial_state: PLANNED
    terminal_states: [COMMISSIONED]
    transitions:
      - from: PLANNED
        to: PERMITTED
        trigger: "cascade: the second of the station's {CONSTRUCTION, FIRE} permits transitions PENDING -> ISSUED"
        actor: system
        preconditions:
          - "station.construction_status == PLANNED"
          - "Permit CONSTRUCTION.status == ISSUED for this station"
          - "Permit FIRE.status == ISSUED for this station"
        side_effects:
          - "increments station.version by 1"
      - from: PERMITTED
        to: CONSTRUCTION
        trigger: "POST /api/stations/{id}/start-construction"
        actor: SiteManager
        preconditions:
          - "station.construction_status == PERMITTED"
          - "current date >= construction_start"
        side_effects:
          - "increments station.version by 1"
      - from: CONSTRUCTION
        to: COMMISSIONED
        trigger: "POST /api/stations/{id}/commission"
        actor: ComplianceOfficer
        preconditions:
          - "station.construction_status == CONSTRUCTION"
          - "if location_type == INDOOR then Permit DISPENSING_INDOOR.status == ISSUED for this station"
          - "site.status == ACTIVE"
        side_effects:
          - "station.commissioned_at = current timestamp"
          - "FuelingEvents may now reference this station"
          - "increments station.version by 1"
      - from: PERMITTED
        to: SUSPENDED
        trigger: "cascade: any ISSUED permit for this station transitions ISSUED -> EXPIRED"
        actor: system
        preconditions:
          - "station.construction_status == PERMITTED"
        side_effects:
          - "increments station.version by 1"
      - from: CONSTRUCTION
        to: SUSPENDED
        trigger: "cascade: any ISSUED permit for this station transitions ISSUED -> EXPIRED"
        actor: system
        preconditions:
          - "station.construction_status == CONSTRUCTION"
        side_effects:
          - "increments station.version by 1"

  - entity: Permit
    initial_state: PENDING
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: PENDING
        to: ISSUED
        trigger: "POST /api/stations/{id}/permits/{pid}/issue"
        actor: ComplianceOfficer
        preconditions:
          - "permit.status == PENDING"
          - "expiry_date > issued_date"
        side_effects:
          - "if this issuance completes the CONSTRUCTION+FIRE pair, station transitions PLANNED -> PERMITTED (cascade)"
          - "increments permit.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /api/stations/{id}/permits/{pid}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "permit.status == PENDING"
        side_effects:
          - "increments permit.version by 1"
      - from: ISSUED
        to: EXPIRED
        trigger: "system clock: current date > expiry_date"
        actor: system
        preconditions:
          - "permit.status == ISSUED"
          - "current date > expiry_date"
        side_effects:
          - "station transitions PERMITTED|CONSTRUCTION -> SUSPENDED (cascade)"
          - "increments permit.version by 1"

  - entity: ConversionPlan
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /api/sites/{id}/conversion-plans/{pid}/schedule"
        actor: SiteManager
        preconditions:
          - "plan.status == DRAFT"
          - "site.status == ACTIVE"
          - "an Assessment with status == APPROVED exists for the site (cross-entity dependency)"
          - "target_forklift_count <= that assessment's forklift_count"
        side_effects:
          - "increments plan.version by 1"
      - from: SCHEDULED
        to: DRAFT
        trigger: "POST /api/sites/{id}/conversion-plans/{pid}/revert"
        actor: SiteManager
        preconditions:
          - "plan.status == SCHEDULED"
          - "no ConversionEvent for this plan in COMPLETED status"
        side_effects:
          - "increments plan.version by 1"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "cascade: first ConversionEvent for this plan transitions SCHEDULED -> IN_PROGRESS"
        actor: system
        preconditions:
          - "plan.status == SCHEDULED"
        side_effects:
          - "increments plan.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "cascade: all ConversionEvents for this plan reach terminal status (COMPLETED or CANCELLED) with at least one COMPLETED"
        actor: system
        preconditions:
          - "plan.status == IN_PROGRESS"
          - "count(events in COMPLETED) >= 1"
          - "count(events in SCHEDULED or IN_PROGRESS) == 0"
        side_effects:
          - "increments plan.version by 1"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /api/sites/{id}/conversion-plans/{pid}/cancel"
        actor: SiteManager
        preconditions:
          - "plan.status == IN_PROGRESS"
        side_effects:
          - "all ConversionEvents for this plan in SCHEDULED or IN_PROGRESS transition to CANCELLED (cascade down)"
          - "increments plan.version by 1"

  - entity: ConversionEvent
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /api/conversion-plans/{pid}/conversion-events/{eid}/start"
        actor: ConversionTechnician
        preconditions:
          - "event.status == SCHEDULED"
          - "X-User-ID == event.technician_id (the assigned technician acts on their own event)"
          - "technician.active == true and technician.certified_until > current date"
          - "parent plan.status in {SCHEDULED, IN_PROGRESS}"
        side_effects:
          - "parent plan transitions SCHEDULED -> IN_PROGRESS if still SCHEDULED (bubble up)"
          - "increments event.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/conversion-plans/{pid}/conversion-events/{eid}/complete"
        actor: ConversionTechnician
        preconditions:
          - "event.status == IN_PROGRESS"
        side_effects:
          - "event.completed_at = current timestamp"
          - "if all sibling events terminal and >= 1 COMPLETED, parent plan -> COMPLETED (bubble up)"
          - "increments event.version by 1"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /api/conversion-plans/{pid}/conversion-events/{eid}/cancel or parent plan cancel cascade"
        actor: ConversionTechnician
        preconditions:
          - "event.status == IN_PROGRESS"
        side_effects:
          - "increments event.version by 1"
      - from: IN_PROGRESS
        to: SCHEDULED
        trigger: "POST /api/conversion-plans/{pid}/conversion-events/{eid}/unstart"
        actor: ConversionTechnician
        preconditions:
          - "event.status == IN_PROGRESS"
        side_effects:
          - "increments event.version by 1"

  - entity: ServiceAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/sites/{id}/service-agreements/{aid}/activate"
        actor: SiteManager
        preconditions:
          - "agreement.status == DRAFT"
          - "site.status == ACTIVE"
        side_effects:
          - "increments agreement.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/sites/{id}/service-agreements/{aid}/terminate"
        actor: SiteManager
        preconditions:
          - "agreement.status == ACTIVE"
        side_effects:
          - "increments agreement.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system clock: current date > coverage_end"
        actor: system
        preconditions:
          - "agreement.status == ACTIVE"
          - "current date > coverage_end"
        side_effects:
          - "increments agreement.version by 1"

  - entity: FuelInvoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /api/invoices/{id}/issue"
        actor: BillingOperator
        preconditions:
          - "invoice.status == DRAFT"
          - "invoice has >= 1 FuelLineItem"
          - "invoice's supply_contract.status == ACTIVE (cross-entity dependency)"
        side_effects:
          - "credit_cents recomputed with the FINAL variant of take_or_pay_credit and frozen; total_cents recomputed"
          - "increments invoice.version by 1"
      - from: DRAFT
        to: VOID
        trigger: "POST /api/invoices/{id}/void"
        actor: BillingOperator
        preconditions:
          - "invoice.status == DRAFT"
        side_effects:
          - "increments invoice.version by 1"
      - from: ISSUED
        to: PAID
        trigger: "POST /api/invoices/{id}/pay"
        actor: BillingOperator
        preconditions:
          - "invoice.status == ISSUED"
        side_effects:
          - "increments invoice.version by 1"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /api/invoices/{id}/dispute"
        actor: SiteManager
        preconditions:
          - "invoice.status == ISSUED"
        side_effects:
          - "increments invoice.version by 1"
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /api/invoices/{id}/resolve"
        actor: BillingOperator
        preconditions:
          - "invoice.status == DISPUTED"
        side_effects:
          - "increments invoice.version by 1"

  - entity: IncentiveClaim
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/sites/{id}/incentive-claims/{cid}/submit"
        actor: SiteManager
        preconditions:
          - "claim.status == DRAFT"
          - "site.status == ACTIVE"
        side_effects:
          - "increments claim.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/sites/{id}/incentive-claims/{cid}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "claim.status == SUBMITTED"
          - "when incentive_type == FEDERAL_ITC: site.actual_productivity_units_per_hour is not null and >= plan.baseline_productivity_units_per_hour * (1 + plan.expected_productivity_gain_pct/100) for the site's governing COMPLETED ConversionPlan (productivity gate, ERR_PRODUCTIVITY_GATE_NOT_MET)"
        side_effects:
          - "claim.approved_amount_cents computed (incentive_qualification_amount for FEDERAL_ITC; equals claimed_amount_cents otherwise)"
          - "increments claim.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/sites/{id}/incentive-claims/{cid}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "increments claim.version by 1"

  - entity: TrainingRecord
    initial_state: VALID
    terminal_states: [EXPIRED]
    transitions:
      - from: VALID
        to: EXPIRED
        trigger: "system clock: current date > expires_at"
        actor: system
        preconditions:
          - "record.status == VALID"
          - "current date > expires_at"
        side_effects:
          - "increments record.version by 1"

concurrency_rules:
  - rule_id: invoice-add-line-stale-invoice
    parent_entity: FuelInvoice
    write_endpoint: "POST /api/invoices/{id}/line-items"
    occ_field: "expected_invoice_version"
    description: |
      Adding a FuelLineItem to a FuelInvoice whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just issued or voided the invoice (which freezes its computed
      totals) and the current writer's view of the invoice is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: plan-schedule-stale-plan
    parent_entity: ConversionPlan
    write_endpoint: "POST /api/sites/{id}/conversion-plans/{pid}/schedule"
    occ_field: "expected_plan_version"
    description: |
      Scheduling a ConversionPlan whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has just
      mutated the plan (a prior schedule, or a revert that returned it to DRAFT)
      and the current writer's view of the plan is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: daily_kg_estimate
    trigger: "Assessment creation; every update of duty_cycle_hours_per_day, forklift_count, or peak_shift_hours; and the DRAFT -> SUBMITTED transition"
    algorithm: aggregation
    formula: |
      daily_kg = forklift_count * duty_cycle_hours_per_day * KG_PER_HOUR
      shift_factor = 1.0 if peak_shift_hours <= 8 else 1.15
      result = ROUND_HALF_UP(daily_kg * shift_factor, 2)
    input_set: "Single Assessment row; no cross-entity state filter."
    constants:
      KG_PER_HOUR: 0.9
    precision: "2 decimal places, round_half_up"

  - name: supply_pricing_tier
    trigger: "FuelLineItem creation: price the event's kg under the invoice's SupplyContract tiered schedule"
    algorithm: tiered_pricing
    formula: |
      # Mode (a): 3+ inputs with non-linear interaction — tier selection depends on
      # prior billed kg for the contract+period, this line's kg straddling the
      # committed boundary, and the supply_mode markup.
      prior_billed_kg = sum(FuelLineItem.kg over FuelLineItems li where li.invoice.supply_contract_id == this invoice.supply_contract_id
                            and li.invoice.period_start == this invoice.period_start
                            and li.invoice.period_end == this invoice.period_end
                            and li.invoice.status in {DRAFT, ISSUED, PAID, DISPUTED}
                            and li.created_at < this_line.created_at)
      cumulative_kg = prior_billed_kg + this_line.kg
      boundary = contract.committed_monthly_kg
      if cumulative_kg <= boundary:
          unit_price = contract.base_price_per_kg
      else if prior_billed_kg >= boundary:
          unit_price = contract.base_price_per_kg * TIER2_DISCOUNT
      else:
          over_kg = cumulative_kg - boundary
          under_kg = this_line.kg - over_kg
          unit_price = (under_kg * contract.base_price_per_kg + over_kg * contract.base_price_per_kg * TIER2_DISCOUNT) / this_line.kg
      if contract.supply_mode == DELIVERED_LIQUID:
          unit_price = unit_price * DELIVERED_LIQUID_MARKUP
      # Mode (b): nested rounding pinned — round EACH line to integer cents with
      # ROUND_HALF_UP; the invoice subtotal is the SUM of rounded line amounts
      # (never round(sum)). unit_price kept at 4 decimals.
      line_amount_cents = ROUND_HALF_UP(this_line.kg * ROUND(unit_price, 4) * 100, 0)
    input_set: "FuelLineItems whose parent FuelInvoice shares this invoice's supply_contract_id and period, in any of {DRAFT, ISSUED, PAID, DISPUTED}, ordered by created_at ASC; ties broken by FuelingEvent.occurred_at ASC. VOID invoices' lines are excluded."
    constants:
      TIER2_DISCOUNT: 0.92
      DELIVERED_LIQUID_MARKUP: 1.08
    precision: "unit_price 4 decimal places; line_amount_cents integer cents, round_half_up; per-line-round-then-sum"

  - name: take_or_pay_credit
    trigger: "FuelInvoice read while DRAFT (provisional preview) and the DRAFT -> ISSUED transition (final freeze)"
    algorithm: waterfall_allocation
    formula: |
      shortfall_kg = max(0, contract.committed_monthly_kg - invoice.total_kg)
      gross_credit_cents = ROUND_HALF_UP(shortfall_kg * contract.base_price_per_kg * SHORTFALL_RATE * 100, 0)
      credit_cents = min(gross_credit_cents, invoice.subtotal_cents)
      total_cents = max(0, invoice.subtotal_cents - credit_cents)
    input_set: "The invoice's FuelLineItems. PROVISIONAL variant excludes lines whose FuelingEvent.occurred_at falls on the calendar day immediately preceding period_end (the last in-period day); FINAL variant includes all lines."
    constants:
      SHORTFALL_RATE: 0.25
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "Invoice in DRAFT; returned by GET /api/invoices/{id} as credit_cents/total_cents"
        difference: "Excludes last-in-period-day lines from total_kg and subtotal_cents before computing the shortfall; yields a larger shortfall and therefore a larger credit than final whenever last-day lines exist."
      - name: final
        when: "Invoice transitions DRAFT -> ISSUED"
        difference: "Includes all lines; credit_cents and total_cents frozen on the invoice."

  - name: availability_credit
    trigger: "GET /api/sites/{id}/availability-report?month=YYYY-MM"
    algorithm: threshold
    formula: |
      downtime_hours = sum(DowntimeReport.downtime_hours for reports with site_id == site.id and month == request month)
      fleet_hours = ACTIVE_ASSESSMENT_FORKLIFT_COUNT * HOURS_PER_MONTH
        where ACTIVE_ASSESSMENT_FORKLIFT_COUNT = forklift_count of the site's Assessment with status == APPROVED;
        if several APPROVED assessments exist, the one with the latest created_at wins; if none, fleet_hours = 0
      if fleet_hours == 0:
          availability_pct = null; credit_cents = 0
      else:
          availability_pct = ROUND_HALF_UP(100 * (1 - downtime_hours / fleet_hours), 2)
      # Boundary precision: strictly below the guarantee triggers the credit; exactly AT the guarantee earns none.
      agreements = ServiceAgreement for site with status == ACTIVE and coverage_start <= last day of month and coverage_end >= first day of month;
        if several, the one with the latest created_at wins; if none, credit_cents = 0 and guarantee_pct = null
      if availability_pct is not null and agreement exists and availability_pct < agreement.availability_guarantee_pct:
          credit_cents = ROUND_HALF_UP(agreement.monthly_fee_cents * AVAILABILITY_CREDIT_RATE, 0)
      else:
          credit_cents = 0
    input_set: "DowntimeReport rows for the site and month (no status filter — reports are append-only); the site's latest-created APPROVED Assessment for fleet size; the site's latest-created ACTIVE ServiceAgreement overlapping the month."
    constants:
      HOURS_PER_MONTH: 730
      AVAILABILITY_CREDIT_RATE: 0.10
    precision: "availability_pct 2 decimal places, round_half_up; credit integer cents, round_half_up"

  - name: invoice_availability_reconciliation
    trigger: "FuelInvoice DRAFT -> ISSUED transition, applied AFTER take_or_pay_credit final variant"
    algorithm: aggregation
    formula: |
      # Dual-variant credit composition on the invoice domain: the FINAL credit is the
      # take-or-pay credit PLUS the availability SLA credit for the invoice's period
      # month (period_start's calendar month), while the PROVISIONAL credit shown on a
      # DRAFT invoice is the take-or-pay credit alone. The availability credit is only
      # added when a ServiceAgreement exists for the site; it is clamped so that
      # credit_cents never exceeds subtotal_cents.
      availability_component = availability_credit.credit_cents for the invoice's site and period_start's calendar month
      final_credit_cents = min(take_or_pay_credit_final + availability_component, invoice.subtotal_cents)
      total_cents = max(0, invoice.subtotal_cents - final_credit_cents)
    input_set: "The invoice being issued; its site's DowntimeReport rows and ACTIVE ServiceAgreement for the period_start calendar month."
    constants: {}
    precision: "integer cents"
    variants:
      - name: provisional
        when: "Invoice DRAFT"
        difference: "credit_cents = take_or_pay_credit provisional only; availability component excluded."
      - name: final
        when: "Invoice DRAFT -> ISSUED"
        difference: "credit_cents = take_or_pay_credit final + availability component, clamped at subtotal_cents."

  - name: incentive_qualification_amount
    trigger: "IncentiveClaim SUBMITTED -> APPROVED when incentive_type == FEDERAL_ITC"
    algorithm: constraint_propagation
    formula: |
      # Mode (c): evaluation order pinned to break the circular-looking dependency —
      # approved amount depends on converted units, which depend on COMPLETED plans,
      # whose completion gates the productivity figure that also gates this approval.
      # Order: governing plan -> converted units -> capex -> uplift -> rate -> cap.
      governing_plan = the site's ConversionPlan with status == COMPLETED and the latest created_at;
        approval is rejected with ERR_PRODUCTIVITY_GATE_NOT_MET when none exists
      converted_units = count(ConversionEvent with status == COMPLETED under governing_plan)
      qualified_capex_cents = converted_units * CAPEX_PER_UNIT_CENTS
      gain_fraction = governing_plan.expected_productivity_gain_pct / 100
      uplifted_capex_cents = ROUND_HALF_UP(qualified_capex_cents * (1 + gain_fraction), 0)
      itc_cents = ROUND_HALF_UP(uplifted_capex_cents * ITC_RATE, 0)
      approved_amount_cents = min(itc_cents, claim.claimed_amount_cents)
    input_set: "The site's ConversionPlans in COMPLETED status (latest created_at governs) and that plan's COMPLETED ConversionEvents; the FEDERAL_ITC claim being approved."
    constants:
      CAPEX_PER_UNIT_CENTS: 1500000
      ITC_RATE: 0.30
    precision: "integer cents, round_half_up; evaluation order: plan -> converted_units -> capex -> uplift -> rate -> cap"

  - name: telematics_productivity_credit
    trigger: "POST /api/sites/{id}/record-productivity"
    algorithm: weighted_scoring
    formula: |
      # Dual-variant productivity measurement on the Site domain: TELEMATICS trusts the
      # metered figure verbatim; SELF_REPORTED applies a confidence haircut because
      # customer-reported throughput historically overstates gains. The recorded
      # actual_productivity_units_per_hour differs by variant for identical reported
      # input, which changes whether the FEDERAL_ITC productivity gate passes.
      if measurement_mode == TELEMATICS:
          recorded = reported_units_per_hour
      else:  # SELF_REPORTED
          recorded = ROUND_HALF_UP(reported_units_per_hour * SELF_REPORTED_CONFIDENCE, 2)
      site.actual_productivity_units_per_hour = recorded
    input_set: "Single Site row; measurement_mode and reported figure from the request."
    constants:
      SELF_REPORTED_CONFIDENCE: 0.90
    precision: "2 decimal places, round_half_up"
    variants:
      - name: telematics
        when: "measurement_mode == TELEMATICS"
        difference: "No haircut; recorded figure equals the reported figure exactly."
      - name: self_reported
        when: "measurement_mode == SELF_REPORTED"
        difference: "Recorded figure is 90% of the reported figure, rounded half-up to 2 decimals."

validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-referenced resources exist (site, assessment, contract, station, permit, plan, event, agreement, invoice, claim, record, technician), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Target resource in a valid from-state for the requested transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: state
    check: "Site is CLOSED: all writes to site-scoped resources are rejected"
    error_id: ERR_SITE_CLOSED
    http_status: 409
    applies_to: "all site-scoped write endpoints"
  - priority: 6
    category: business_constraint
    check: "Required input fields present and well-typed; enum values in declared sets; date/datetime formats valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 7
    category: business_constraint
    check: "Date coherence: end_date >= start_date on SupplyContract; coverage_end > coverage_start on ServiceAgreement; period_end > period_start on FuelInvoice; construction_end >= construction_start on FuelingStation; expiry > issue/completion dates on Permit and TrainingRecord; scheduled_end > scheduled_start on ConversionEvent"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "create endpoints for SupplyContract, ServiceAgreement, FuelInvoice, FuelingStation, Permit, TrainingRecord, ConversionEvent"
  - priority: 8
    category: business_safety
    check: "INDOOR FuelingStation storage_capacity_kg <= 200 (fire-code maximum); OUTDOOR stations unbounded by this rule"
    error_id: ERR_INDOOR_STORAGE_EXCEEDED
    http_status: 422
    applies_to: "POST /api/sites/{id}/stations, PUT /api/stations/{id}"
  - priority: 9
    category: business_safety
    check: "FuelingEvent requires station.construction_status == COMMISSIONED and occurred_at >= station.commissioned_at"
    error_id: ERR_STATION_NOT_COMMISSIONED
    http_status: 422
    applies_to: "POST /api/stations/{id}/fueling-events"
  - priority: 10
    category: business_safety
    check: "Commissioning an INDOOR station requires a DISPENSING_INDOOR Permit in ISSUED status for that station"
    error_id: ERR_INDOOR_DISPENSING_NOT_APPROVED
    http_status: 422
    applies_to: "POST /api/stations/{id}/commission"
  - priority: 11
    category: business_temporal
    check: "ConversionEvent scheduled window does not overlap another ConversionEvent in SCHEDULED or IN_PROGRESS status for the same technician — strict overlap: start < other.end AND end > other.start; touching intervals (end == other.start or start == other.end) are allowed"
    error_id: ERR_TECHNICIAN_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /api/conversion-plans/{pid}/conversion-events"
  - priority: 12
    category: business_temporal
    check: "SupplyContract date range does not overlap another DRAFT or ACTIVE contract for the same site with the same supply_mode — half-open [start_date, end_date); back-to-back contracts (one's start == other's end) are allowed; contracts of different supply_mode may overlap freely"
    error_id: ERR_CONTRACT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /api/sites/{id}/supply-contracts"
  - priority: 13
    category: business_fiscal
    check: "FuelInvoice issuance requires the invoice's supply_contract.status == ACTIVE"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /api/invoices/{id}/issue"
  - priority: 14
    category: business_fiscal
    check: "SupplyContract termination blocked while any FuelInvoice for the contract is in DRAFT, ISSUED, or DISPUTED status"
    error_id: ERR_OPEN_INVOICES_EXIST
    http_status: 422
    applies_to: "POST /api/sites/{id}/supply-contracts/{cid}/terminate"
  - priority: 15
    category: business_fiscal
    check: "FEDERAL_ITC claim approval requires a COMPLETED ConversionPlan and site.actual_productivity_units_per_hour >= plan.baseline_productivity_units_per_hour * (1 + plan.expected_productivity_gain_pct/100)"
    error_id: ERR_PRODUCTIVITY_GATE_NOT_MET
    http_status: 422
    applies_to: "POST /api/sites/{id}/incentive-claims/{cid}/approve"
  - priority: 16
    category: business_referential
    check: "ConversionPlan scheduling requires an APPROVED Assessment for the site and target_forklift_count <= that assessment's forklift_count"
    error_id: ERR_ASSESSMENT_NOT_APPROVED
    http_status: 422
    applies_to: "POST /api/sites/{id}/conversion-plans/{pid}/schedule"
  - priority: 17
    category: business_referential
    check: "FuelingEvent.supply_contract_id must reference a SupplyContract with status == ACTIVE for the same site as the station, with start_date <= occurred_at's date <= end_date"
    error_id: ERR_NO_ACTIVE_CONTRACT
    http_status: 422
    applies_to: "POST /api/stations/{id}/fueling-events"
  - priority: 18
    category: business_referential
    check: "FuelLineItem.fueling_event_id must reference a FuelingEvent whose occurred_at falls in [invoice.period_start, invoice.period_end), whose supply_contract_id == invoice.supply_contract_id, and which is not already referenced by another FuelLineItem on a non-VOID invoice"
    error_id: ERR_EVENT_NOT_BILLABLE
    http_status: 422
    applies_to: "POST /api/invoices/{id}/line-items"
  - priority: 19
    category: business_referential
    check: "ConversionEvent.technician_id must reference an existing Technician; start requires technician.active == true and certified_until > current date"
    error_id: ERR_TECHNICIAN_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /api/conversion-plans/{pid}/conversion-events/{eid}/start"
  - priority: 20
    category: business_constraint
    check: "Site.code unique across all sites"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /api/sites"
  - priority: 21
    category: business_constraint
    check: "expected_<parent>_version matches the parent's current version on OCC-guarded endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/invoices/{id}/line-items, POST /api/sites/{id}/conversion-plans/{pid}/schedule"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header missing or unrecognized"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this endpoint per RBAC matrix"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required input missing, wrong type, or enum value outside declared set"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "End date/datetime not after (or not on-or-after, where specified) the start date/datetime"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a valid from-state for the requested transition"
  - id: ERR_SITE_CLOSED
    http: 409
    condition: "Write attempted against a resource of a CLOSED site"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version on an OCC-guarded write"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "Site.code already exists"
  - id: ERR_INDOOR_STORAGE_EXCEEDED
    http: 422
    condition: "INDOOR station storage_capacity_kg exceeds the 200 kg fire-code maximum"
  - id: ERR_STATION_NOT_COMMISSIONED
    http: 422
    condition: "FuelingEvent recorded against a station not in COMMISSIONED status, or occurred_at before commissioned_at"
  - id: ERR_INDOOR_DISPENSING_NOT_APPROVED
    http: 422
    condition: "Commissioning an INDOOR station without an ISSUED DISPENSING_INDOOR permit"
  - id: ERR_TECHNICIAN_DOUBLE_BOOKED
    http: 409
    condition: "ConversionEvent window strictly overlaps another SCHEDULED or IN_PROGRESS event for the same technician"
  - id: ERR_CONTRACT_PERIOD_OVERLAP
    http: 409
    condition: "SupplyContract period overlaps another DRAFT or ACTIVE contract for the same site and supply_mode"
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 422
    condition: "Invoice issuance attempted while the supply contract is not ACTIVE"
  - id: ERR_OPEN_INVOICES_EXIST
    http: 422
    condition: "Supply contract termination attempted while DRAFT, ISSUED, or DISPUTED invoices exist for it"
  - id: ERR_PRODUCTIVITY_GATE_NOT_MET
    http: 422
    condition: "FEDERAL_ITC approval without a COMPLETED plan, or recorded productivity below baseline * (1 + expected gain)"
  - id: ERR_ASSESSMENT_NOT_APPROVED
    http: 422
    condition: "ConversionPlan scheduling without an APPROVED assessment, or target count exceeds the approved forklift count"
  - id: ERR_NO_ACTIVE_CONTRACT
    http: 422
    condition: "FuelingEvent references a supply contract that is not ACTIVE, belongs to another site, or does not cover occurred_at"
  - id: ERR_EVENT_NOT_BILLABLE
    http: 422
    condition: "FuelingEvent out of the invoice period, under a different contract, or already billed on a non-VOID invoice"
  - id: ERR_TECHNICIAN_NOT_CERTIFIED
    http: 422
    condition: "Technician inactive or certification expired at ConversionEvent start"

roles:
  - name: PlatformAdmin
    description: "Platform operator; manages the logical clock and the technician registry."
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
      - "POST /api/technicians"
    shared_operations:
      - "GET /api/sites"
      - "GET /api/sites/{id}"
  - name: SiteManager
    description: "Customer-side deployment manager; owns sites, assessments, contracts, stations, plans, agreements, fueling events, disputes, claims, training records, downtime reports."
    identity: opaque
    exclusive_operations:
      - "POST /api/sites"
      - "POST /api/sites/{id}/close"
      - "POST /api/sites/{id}/assessments; PUT /api/assessments/{id}; submit; revise"
      - "POST /api/sites/{id}/supply-contracts; activate; terminate"
      - "POST /api/sites/{id}/stations; PUT /api/stations/{id}; start-construction"
      - "POST /api/stations/{id}/permits"
      - "POST /api/sites/{id}/conversion-plans; schedule; revert; cancel"
      - "POST /api/conversion-plans/{pid}/conversion-events"
      - "POST /api/sites/{id}/service-agreements; activate; terminate"
      - "POST /api/stations/{id}/fueling-events"
      - "POST /api/sites/{id}/downtime-reports"
      - "POST /api/invoices/{id}/dispute"
      - "POST /api/sites/{id}/incentive-claims; submit"
      - "POST /api/sites/{id}/training-records"
      - "POST /api/sites/{id}/record-productivity"
    shared_operations:
      - "GET reads on sites, assessments, contracts, stations, permits, plans, events, agreements, fueling events, invoices, line items, claims, training records, downtime reports, availability report, technicians"
  - name: SafetyOfficer
    description: "Approves site assessments and inspects training records."
    identity: opaque
    exclusive_operations:
      - "POST /api/sites/{id}/assessments/{aid}/approve"
      - "POST /api/sites/{id}/assessments/{aid}/reject"
    shared_operations:
      - "GET reads on sites, assessments, stations, training records"
  - name: ComplianceOfficer
    description: "Issues permits, commissions stations, decides incentive claims."
    identity: opaque
    exclusive_operations:
      - "POST /api/stations/{id}/permits/{pid}/issue"
      - "POST /api/stations/{id}/permits/{pid}/reject"
      - "POST /api/stations/{id}/commission"
      - "POST /api/sites/{id}/incentive-claims/{cid}/approve"
      - "POST /api/sites/{id}/incentive-claims/{cid}/reject"
    shared_operations:
      - "GET reads on sites, stations, permits, incentive claims"
  - name: ConversionTechnician
    description: "Executes conversion events; acts on events assigned to their own Technician id."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /api/conversion-plans/{pid}/conversion-events/{eid}/start"
      - "POST /api/conversion-plans/{pid}/conversion-events/{eid}/complete"
      - "POST /api/conversion-plans/{pid}/conversion-events/{eid}/cancel"
      - "POST /api/conversion-plans/{pid}/conversion-events/{eid}/unstart"
    shared_operations:
      - "GET reads on technicians, conversion plans, conversion events"
  - name: BillingOperator
    description: "Runs invoicing, line items, and availability reporting."
    identity: opaque
    exclusive_operations:
      - "POST /api/invoices"
      - "POST /api/invoices/{id}/line-items"
      - "POST /api/invoices/{id}/issue"
      - "POST /api/invoices/{id}/void"
      - "POST /api/invoices/{id}/pay"
      - "POST /api/invoices/{id}/resolve"
    shared_operations:
      - "GET reads on sites, contracts, agreements, stations, fueling events, invoices, line items, availability report"

endpoints:
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-09-01T00:00:00Z; before any set_current_utc call the logical clock reads exactly this default and never falls back to wall-clock time. Drives all date-sensitive automatic transitions (Permit EXPIRED, TrainingRecord EXPIRED, SupplyContract EXPIRED, ServiceAgreement EXPIRED) and their cascades."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["applies all automatic clock-driven transitions whose condition the new time satisfies"]
  - method: POST
    path: "/api/sites"
    description: "Create a deployment site."
    roles: [SiteManager]
    code: 201
    input: [code, name, address, baseline_labor_rate_per_hour]
    output: Site
    side_effects: []
  - method: GET
    path: "/api/sites"
    description: "List sites with pagination and optional status filter."
    roles: [SiteManager, SafetyOfficer, ComplianceOfficer, BillingOperator, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Site[]"
    side_effects: []
  - method: GET
    path: "/api/sites/{id}"
    description: "Get a site."
    roles: [SiteManager, SafetyOfficer, ComplianceOfficer, BillingOperator, PlatformAdmin]
    code: 200
    input: []
    output: Site
    side_effects: []
  - method: POST
    path: "/api/sites/{id}/close"
    description: "Close a site (terminal; blocks all site-scoped writes)."
    roles: [SiteManager]
    code: 200
    input: []
    output: Site
    side_effects: ["site.status -> CLOSED"]
  - method: POST
    path: "/api/sites/{id}/record-productivity"
    description: "Record observed post-conversion throughput; applies the telematics_productivity_credit variant by measurement_mode."
    roles: [SiteManager]
    code: 200
    input: [measurement_mode, reported_units_per_hour]
    output: Site
    side_effects: ["site.actual_productivity_units_per_hour set per telematics_productivity_credit"]
  - method: POST
    path: "/api/sites/{id}/assessments"
    description: "Create a site assessment (DRAFT)."
    roles: [SiteManager]
    code: 201
    input: [forklift_count, duty_cycle_hours_per_day, peak_shift_hours, safety_findings_json, "site_id?"]
    output: Assessment
    side_effects: ["daily_kg_estimate computed"]
  - method: GET
    path: "/api/sites/{id}/assessments"
    description: "List assessments for a site."
    roles: [SiteManager, SafetyOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Assessment[]"
    side_effects: []
  - method: GET
    path: "/api/assessments/{id}"
    description: "Get an assessment."
    roles: [SiteManager, SafetyOfficer]
    code: 200
    input: []
    output: Assessment
    side_effects: []
  - method: PUT
    path: "/api/assessments/{id}"
    description: "Update assessment duty-cycle inputs while DRAFT or REJECTED."
    roles: [SiteManager]
    code: 200
    input: ["forklift_count?", "duty_cycle_hours_per_day?", "peak_shift_hours?", "safety_findings_json?"]
    output: Assessment
    side_effects: ["daily_kg_estimate recomputed", "increments assessment.version by 1"]
  - method: POST
    path: "/api/sites/{id}/assessments/{aid}/submit"
    description: "Submit assessment for safety approval."
    roles: [SiteManager]
    code: 200
    input: []
    output: Assessment
    side_effects: ["assessment.status -> SUBMITTED"]
  - method: POST
    path: "/api/sites/{id}/assessments/{aid}/approve"
    description: "Approve assessment."
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: Assessment
    side_effects: ["assessment.status -> APPROVED"]
  - method: POST
    path: "/api/sites/{id}/assessments/{aid}/reject"
    description: "Reject assessment."
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: Assessment
    side_effects: ["assessment.status -> REJECTED"]
  - method: POST
    path: "/api/sites/{id}/assessments/{aid}/revise"
    description: "Return rejected assessment to DRAFT for revision."
    roles: [SiteManager]
    code: 200
    input: []
    output: Assessment
    side_effects: ["assessment.status -> DRAFT"]
  - method: POST
    path: "/api/sites/{id}/supply-contracts"
    description: "Create a hydrogen supply contract (DRAFT)."
    roles: [SiteManager]
    code: 201
    input: [supply_mode, start_date, end_date, base_price_per_kg, reliability_sla_pct, committed_monthly_kg, "site_id?"]
    output: SupplyContract
    side_effects: []
  - method: GET
    path: "/api/sites/{id}/supply-contracts"
    description: "List supply contracts for a site."
    roles: [SiteManager, BillingOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: "SupplyContract[]"
    side_effects: []
  - method: GET
    path: "/api/supply-contracts/{id}"
    description: "Get a supply contract."
    roles: [SiteManager, BillingOperator]
    code: 200
    input: []
    output: SupplyContract
    side_effects: []
  - method: GET
    path: "/api/supply-contracts/{id}/fueling-events"
    description: "List fueling events billed under a contract."
    roles: [SiteManager, BillingOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: "FuelingEvent[]"
    side_effects: []
  - method: GET
    path: "/api/supply-contracts/{id}/invoices"
    description: "List invoices issued under a contract."
    roles: [SiteManager, BillingOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: "FuelInvoice[]"
    side_effects: []
  - method: POST
    path: "/api/sites/{id}/supply-contracts/{cid}/activate"
    description: "Activate a supply contract; reactivates a SUSPENDED site."
    roles: [SiteManager]
    code: 200
    input: []
    output: SupplyContract
    side_effects: ["contract.status -> ACTIVE", "site.status SUSPENDED -> ACTIVE when site was SUSPENDED"]
  - method: POST
    path: "/api/sites/{id}/supply-contracts/{cid}/terminate"
    description: "Terminate an active supply contract."
    roles: [SiteManager]
    code: 200
    input: []
    output: SupplyContract
    side_effects: ["contract.status -> TERMINATED", "terminated_at set", "site.status ACTIVE -> SUSPENDED if no other ACTIVE contract remains"]
  - method: POST
    path: "/api/sites/{id}/stations"
    description: "Create a fueling station (PLANNED)."
    roles: [SiteManager]
    code: 201
    input: [station_code, location_type, capacity_kg_per_day, storage_capacity_kg, construction_start, construction_end, "site_id?"]
    output: FuelingStation
    side_effects: []
  - method: GET
    path: "/api/sites/{id}/stations"
    description: "List stations for a site."
    roles: [SiteManager, SafetyOfficer, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "FuelingStation[]"
    side_effects: []
  - method: GET
    path: "/api/stations/{id}"
    description: "Get a station."
    roles: [SiteManager, SafetyOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: FuelingStation
    side_effects: []
  - method: PUT
    path: "/api/stations/{id}"
    description: "Update station attributes while PLANNED."
    roles: [SiteManager]
    code: 200
    input: ["station_code?", "location_type?", "capacity_kg_per_day?", "storage_capacity_kg?", "construction_start?", "construction_end?"]
    output: FuelingStation
    side_effects: ["increments station.version by 1"]
  - method: POST
    path: "/api/stations/{id}/start-construction"
    description: "Begin construction (PERMITTED -> CONSTRUCTION)."
    roles: [SiteManager]
    code: 200
    input: []
    output: FuelingStation
    side_effects: ["station.construction_status -> CONSTRUCTION"]
  - method: POST
    path: "/api/stations/{id}/commission"
    description: "Commission a station (CONSTRUCTION -> COMMISSIONED)."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: FuelingStation
    side_effects: ["station.construction_status -> COMMISSIONED", "commissioned_at set"]
  - method: POST
    path: "/api/stations/{id}/permits"
    description: "File a permit application (PENDING)."
    roles: [SiteManager]
    code: 201
    input: [permit_type, issued_date, expiry_date, "station_id?"]
    output: Permit
    side_effects: []
  - method: GET
    path: "/api/stations/{id}/permits"
    description: "List permits for a station."
    roles: [SiteManager, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Permit[]"
    side_effects: []
  - method: GET
    path: "/api/permits/{id}"
    description: "Get a permit."
    roles: [SiteManager, ComplianceOfficer]
    code: 200
    input: []
    output: Permit
    side_effects: []
  - method: POST
    path: "/api/stations/{id}/permits/{pid}/issue"
    description: "Mark a permit issued; completing the CONSTRUCTION+FIRE pair moves the station to PERMITTED."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Permit
    side_effects: ["permit.status -> ISSUED", "station PLANNED -> PERMITTED when CONSTRUCTION+FIRE both ISSUED"]
  - method: POST
    path: "/api/stations/{id}/permits/{pid}/reject"
    description: "Reject a permit application."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Permit
    side_effects: ["permit.status -> REJECTED"]
  - method: POST
    path: "/api/technicians"
    description: "Register a conversion technician."
    roles: [PlatformAdmin]
    code: 201
    input: [name, certification_level, certified_until, "active?"]
    output: Technician
    side_effects: []
  - method: GET
    path: "/api/technicians"
    description: "List technicians."
    roles: [SiteManager, ConversionTechnician, PlatformAdmin]
    code: 200
