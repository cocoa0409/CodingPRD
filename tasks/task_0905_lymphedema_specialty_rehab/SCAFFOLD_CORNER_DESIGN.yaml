  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: rbac_dme_coordinator_cannot_create_evaluation
        claim_type: Cannot Perform
        grounds: [roles]
        distinguishing_aspect: "A DMECoordinator calling POST /evaluations is rejected with 403 ERR_UNAUTHORIZED (evaluation creation is Clinician-exclusive)."
        test_recipe:
          setup: ["A patient exists."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "P", mrn: "MRN-1" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
          trigger:
            - call: "POST /evaluations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", etiology: "SECONDARY", isl_stage: "STAGE_II", interval_cm: 4, circumferences_cm: [18,18,20,22,24], contralateral_circumferences_cm: [16,16,17,18,19], expected_patient_version: "${pat_v}" }
              as: DMECoordinator
              captures: { err: $.data.error_id }
          assert:
