# ============================================================================
# PRD Benchmark Scaffold — Gift Card Fraud & Balance Protection
# Sections §1.0 – §1.7.  §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml and
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml (siblings of this file).
# ============================================================================

scenario: |
  Generate task harder than expert level!

  2618. Gift Card Fraud & Balance Protection (retail gift card risk team): activation controls at point of sale with tamper-evident packaging and rack monitoring, card draining detection through balance inquiry velocity and redemption pattern analysis, bulk purchase monitoring with limits and identity requirements on large transactions, digital gift card fraud screening at issuance with device, email and payment risk signals, victim claim intake with purchase and packaging evidence and reissue policy, retail floor procedures for suspicious activity and law enforcement referral, third-party reseller and secondary marketplace risk with card validation, balance liability accounting and unauthorized redemption reserves

domain_name: gift-card-fraud-balance-protection
api_prefix: "/"

complexity_profile:
  primary_archetype: event_sourcing
  secondary_archetype: compliance / audit
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by foreign keys. No business resource is created under
  # a nested URL path; action endpoints (`POST /gift-cards/{id}/redemptions`)
  # and reverse-reachability sub-resource reads are the only multi-segment
  # paths, and every collection is addressable at the top level.

  state_machine_shape: parallel
  # GiftCard carries two independent state dimensions on the same row:
  # `activation_state` (INACTIVE -> ACTIVE <-> DEPLETED -> CLOSED -> ACTIVE)
  # and `risk_posture` (CLEAR -> WATCH -> RESTRICTED -> FROZEN -> CLEAR).
  # Secondary shapes present: cyclic (VictimClaim evidence loop, DrainingAlert
  # reopen, LiabilityPeriod restatement self-loop), branching fork-join
  # (IssuanceRequest SUBMITTED -> {APPROVED, HELD_FOR_REVIEW, DECLINED}),
  # compound/posture_driven (RetailStore.floor_posture derived from its racks
  # and its cards' alerts, and gating child operations).

  relationship_patterns:
    - one_to_many          # RetailStore -> CardRack -> GiftCard -> LedgerEvent
    - self_referential     # GiftCard.reissued_from_card_id -> GiftCard.id;
                           # LedgerEvent.reverses_event_id -> LedgerEvent.id
    - cross_aggregate      # DrainingAlert/VictimClaim/ResellerListing all
                           # reference GiftCard across aggregate boundaries;
                           # LiabilityPeriod aggregates over all cards+alerts

  role_model: segregation_of_duties
  # The FraudAnalyst X-User-ID that triaged a DrainingAlert may not be the
  # X-User-ID that resolves it; the user that intook a VictimClaim may not be
  # the user that decides it. StoreManager is entity-backed by RetailStore, so
  # floor actions are scoped to the manager's own store.

  consistency_model: immediate

# ----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — VERBATIM)
# ----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
#
# Conventions that apply to EVERY entity below:
#  * `common_fields: true` expands to `id` (server-minted UUID, no type prefix),
#    `created_at`, `updated_at` (ISO 8601 UTC, three fractional digits) and
#    `version` (integer, starts at 1, +1 on every mutation including cascaded
#    side effects). `common_fields: false` expands to `id` and `created_at` only.
#  * `created_at` / `updated_at` / every `*_at` system timestamp is stamped from
#    the LOGICAL clock (§1.5 `POST /_clock/set_current_utc`), never from real
#    wall-clock time. The logical clock reads exactly `2026-08-01T00:00:00Z`
#    before any `set_current_utc` call.
#  * `id` is identity only. It is STRICTLY FORBIDDEN as an input to any
#    selector, ranking, tie-break, allocation order, cascade order, or
#    chronological replay order. Where a precise fallback over common fields is
#    needed the scaffold uses `created_at ASC`, never `id`.
# ----------------------------------------------------------------------------
entities:

  - name: RiskPolicy
    parent: null
    common_fields: true
    fields:
      - name: inquiry_velocity_window_minutes
        type: integer
        source: input
        description: Trailing window width, in minutes, for balance-inquiry velocity counting.
        default: 60
        constraints: ">= 1 and <= 10080"
      - name: inquiry_velocity_threshold
        type: integer
        source: input
        description: Inquiry count inside the trailing window at or above which a draining alert fires.
        default: 5
        constraints: ">= 2 and <= 100"
      - name: redemption_window_minutes
        type: integer
        source: input
        description: Trailing window width, in minutes, for the recent-redemption count used by the redemption-weighted drain score.
        default: 1440
        constraints: ">= 1 and <= 43200"
      - name: drain_watch_score_threshold
        type: integer
        source: input
        description: Drain risk score at or above which a card's risk_posture escalates to WATCH.
        default: 40
        constraints: ">= 1 and <= 100"
      - name: drain_restrict_score_threshold
        type: integer
        source: input
        description: Drain risk score at or above which a card's risk_posture escalates to RESTRICTED.
        default: 70
        constraints: ">= 1 and <= 100, and > drain_watch_score_threshold"
      - name: digital_hold_score_threshold
        type: integer
        source: input
        description: Digital issuance screening score at or above which the issuance request is held for review.
        default: 45
        constraints: ">= 1 and <= 100"
      - name: digital_decline_score_threshold
        type: integer
        source: input
        description: Digital issuance screening score at or above which the issuance request is auto-declined.
        default: 75
        constraints: ">= 1 and <= 100, and > digital_hold_score_threshold"
      - name: bulk_identity_threshold_cents
        type: integer
        source: input
        description: Bulk purchase order total_cents at or above which government identity capture is mandatory.
        default: 50000
        constraints: ">= 0"
      - name: bulk_quantity_limit
        type: integer
        source: input
        description: Maximum card_quantity accepted on a single bulk purchase order.
        default: 25
        constraints: ">= 1"
      - name: rack_shrink_threshold
        type: integer
        source: input
        description: Rack shrink (expected minus observed card count) at or above which the rack is marked TAMPERED.
        default: 3
        constraints: ">= 1"
      - name: rack_seal_break_threshold
        type: integer
        source: input
        description: Observed tamper-evident seal breaks at or above which the rack is marked TAMPERED.
        default: 3
        constraints: ">= 1"
      - name: floor_heightened_alert_threshold
        type: integer
        source: input
        description: Count of OPEN or TRIAGED draining alerts on a store's cards at or above which floor_posture becomes HEIGHTENED.
        default: 2
        constraints: ">= 1"
      - name: claim_window_days
        type: integer
        source: input
        description: Number of days after purchased_at during which a victim claim may be filed.
        default: 90
        constraints: ">= 1"
      - name: claim_evidence_round_limit
        type: integer
        source: input
        description: Maximum number of evidence-request rounds permitted on one victim claim.
        default: 3
        constraints: ">= 1"
      - name: reissue_cap_cents
        type: integer
        source: input
        description: Hard ceiling on gross_reissue_cents; an approval whose gross exceeds this cap is rejected outright.
        default: 100000
        constraints: ">= 0"
      - name: recovery_factor_bps
        type: integer
        source: input
        description: Basis points of each unauthorized redemption line that the reissue policy restores to the victim.
        default: 8500
        constraints: ">= 0 and <= 10000"
      - name: provisional_reserve_rate_bps
        type: integer
        source: input
        description: Basis points applied to gross alert exposure when a liability period is CLOSED (provisional reserve variant).
        default: 3500
        constraints: ">= 0 and <= 10000"
      - name: final_reserve_rate_bps
        type: integer
        source: input
        description: Basis points applied to CONFIRMED-only alert exposure when a liability period is RESTATED (final reserve variant).
        default: 1000
        constraints: ">= 0 and <= 10000"
    note: |
      Singleton configuration row. Exactly one RiskPolicy exists; the server
      seeds it at startup with every default above, so `GET /risk-policy`
      succeeds on an empty database. `PUT /risk-policy` is a partial update:
      omitted fields keep their current value.

  - name: RetailStore
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Store display name.
        constraints: "1..120 chars"
      - name: region_code
        type: string
        source: input
        description: Two-letter region code used for reporting rollups.
        constraints: "exactly 2 uppercase letters"
      - name: address_line
        type: string
        source: input
        description: Street address of the store.
        constraints: "1..200 chars"
      - name: floor_posture
        type: enum
        source: computed
        description: Derived retail-floor gate recomputed by §1.3 store_floor_posture on every rack and alert mutation touching this store.
        default: OPEN
        constraints: "OPEN | HEIGHTENED | SUSPENDED"
      - name: tampered_rack_count
        type: integer
        source: computed
        description: Count of CardRack rows with store_id == this store and tamper_state == TAMPERED.
        default: 0
      - name: suspect_rack_count
        type: integer
        source: computed
        description: Count of CardRack rows with store_id == this store and tamper_state == SUSPECT.
        default: 0
      - name: open_alert_count
        type: integer
        source: computed
        description: Count of DrainingAlert rows in state OPEN or TRIAGED whose card's store_id == this store.
        default: 0
      - name: declined_issuance_count
        type: integer
        source: system
        description: Monotonic counter incremented by 1 each time an IssuanceRequest with this store_id reaches state DECLINED.
        default: 0
    note: |
      Resource with a posture_driven derived field. `floor_posture` gates child
      operations (issuance submit/screen, redemption at this merchant store,
      bulk order approval) and is never writable through the API.

  - name: CardRack
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: FK -> RetailStore.id; the store whose floor holds this rack.
        constraints: required, immutable after creation
      - name: rack_label
        type: string
        source: input
        description: Planogram label printed on the rack fixture.
        constraints: "1..40 chars; unique per store_id"
      - name: expected_card_count
        type: integer
        source: input
        description: Planogram slot count — the number of tamper-sealed cards the rack is supposed to hold.
        constraints: ">= 0 and <= 500"
      - name: tamper_state
        type: enum
        source: computed
        description: Rack monitoring verdict recomputed by §1.3 rack_tamper_classification on every audit, and reset by clear-tamper.
        default: INTACT
        constraints: "INTACT | SUSPECT | TAMPERED"
      - name: observed_card_count
        type: integer
        source: system
        description: Card count physically observed during the most recent audit; null until the first audit.
        default: null
      - name: seal_breaks_observed
        type: integer
        source: system
        description: Tamper-evident seal breaks recorded by the most recent audit.
        default: 0
      - name: missing_card_count
        type: integer
        source: computed
        description: "max(0, expected_card_count - observed_card_count) from the most recent audit; 0 when no audit has run."
        default: 0
      - name: last_audit_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the most recent audit; null until the first audit.
        default: null
      - name: remediation_note
        type: string
        source: system
        description: Free text captured by the most recent clear-tamper action; null until a rack is cleared.
        default: null

  - name: GiftCard
    parent: null
    common_fields: true
    fields:
      - name: channel
        type: enum
        source: system
        description: PHYSICAL for rack-stocked plastic; DIGITAL for cards minted by an approved digital issuance request.
        constraints: "PHYSICAL | DIGITAL"
      - name: store_id
        type: string
        source: input
        description: FK -> RetailStore.id; the store that stocked the card. Always null for channel DIGITAL.
        default: null
      - name: rack_id
        type: string
        source: input
        description: FK -> CardRack.id; the rack the card was stocked on. Always null for channel DIGITAL, and cleared to null when the card is activated.
        default: null
      - name: reissued_from_card_id
        type: string
        source: system
        description: FK -> GiftCard.id; set only on a card minted by an approved victim claim, pointing at the drained original.
        default: null
      - name: card_number_masked
        type: string
        source: input
        description: Masked PAN of the form "****-****-****-NNNN"; server-generated when omitted at stocking.
        default: null
        constraints: "matches ^\\*{4}-\\*{4}-\\*{4}-[0-9]{4}$; unique across all cards"
      - name: activation_state
        type: enum
        source: computed
        description: Funding lifecycle dimension. Advanced by issuance approval, by balance reaching or leaving zero, and by claim approval/rescission.
        default: INACTIVE
        constraints: "INACTIVE | ACTIVE | DEPLETED | CLOSED | VOIDED"
      - name: risk_posture
        type: enum
        source: computed
        description: Fraud-gating dimension, independent of activation_state. Escalated by inquiry velocity, drain scoring and alert confirmation; reset by dismissal or by a RiskManager posture override.
        default: CLEAR
        constraints: "CLEAR | WATCH | RESTRICTED | FROZEN"
      - name: face_value_cents
        type: integer
        source: system
        description: Face value loaded at activation, copied from the approving IssuanceRequest; 0 while INACTIVE.
        default: 0
      - name: current_balance_cents
        type: integer
        source: computed
        description: Signed replay of every LedgerEvent with card_id == this card, per §1.3 card_balance_projection.
        default: 0
      - name: held_amount_cents
        type: integer
        source: computed
        description: Sum of amount_cents over RedemptionHold rows on this card with state == ACTIVE and hold_expires_at >= logical now.
        default: 0
      - name: available_balance_cents
        type: integer
        source: computed
        description: "max(0, current_balance_cents - held_amount_cents)."
        default: 0
      - name: total_loaded_cents
        type: integer
        source: computed
        description: Sum of amount_cents over LedgerEvent rows on this card of type ACTIVATION_LOAD, REISSUE_CREDIT or REISSUE_DEBIT_REVERSAL.
        default: 0
      - name: total_redeemed_cents
        type: integer
        source: computed
        description: Sum of REDEMPTION amount_cents minus sum of REDEMPTION_REVERSAL amount_cents over LedgerEvent rows on this card.
        default: 0
      - name: drawdown_ratio
        type: number
        source: computed
        description: "round_half_up(total_redeemed_cents / total_loaded_cents, 2) when total_loaded_cents > 0, else 0.00."
        default: 0.00
      - name: distinct_merchant_count
        type: integer
        source: computed
        description: Count of distinct merchant_store_id values among unreversed REDEMPTION LedgerEvent rows on this card.
        default: 0
      - name: recent_redemption_count
        type: integer
        source: computed
        description: Count of unreversed REDEMPTION LedgerEvent rows on this card whose occurred_at >= logical now minus RiskPolicy.redemption_window_minutes.
        default: 0
      - name: drain_risk_score_inquiry
        type: integer
        source: computed
        description: Inquiry-weighted variant of §1.3 card_drain_risk_score, refreshed on every balance inquiry against this card.
        default: 0
        constraints: "0..100"
      - name: drain_risk_score_redemption
        type: integer
        source: computed
        description: Redemption-weighted variant of §1.3 card_drain_risk_score, refreshed when a DrainingAlert on this card is triaged.
        default: 0
        constraints: "0..100"
      - name: activated_at
        type: datetime
        source: system
        description: Logical-clock timestamp at which activation_state first became ACTIVE; null while INACTIVE.
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock timestamp at which activation_state became CLOSED or VOIDED; null otherwise, and reset to null when a rescission restores the card to ACTIVE.
        default: null
    note: |
      The scaffold's central resource, carrying TWO independent state
      dimensions on one row (see §1.2 GiftCard.activation_state and
      GiftCard.risk_posture). Every balance figure is a projection over the
      append-only LedgerEvent stream — no balance field is ever written
      directly.

  - name: IssuanceRequest
    parent: null
    common_fields: true
    fields:
      - name: channel
        type: enum
        source: input
        description: PHYSICAL for point-of-sale activation of a rack-stocked card; DIGITAL for e-commerce issuance screened on device/email/payment signals.
        constraints: "PHYSICAL | DIGITAL"
      - name: store_id
        type: string
        source: input
        description: FK -> RetailStore.id; required when channel == PHYSICAL, must be omitted when channel == DIGITAL.
        default: null
      - name: rack_id
        type: string
        source: input
        description: FK -> CardRack.id; required when channel == PHYSICAL, must be omitted when channel == DIGITAL.
        default: null
      - name: card_id
        type: string
        source: input
        description: FK -> GiftCard.id; required when channel == PHYSICAL (an INACTIVE card stocked on rack_id). Must be omitted when channel == DIGITAL, in which case the server sets it to the id of the GiftCard minted at approval.
        default: null
      - name: bulk_order_id
        type: string
        source: input
        description: FK -> BulkPurchaseOrder.id; optional link when this issuance belongs to a bulk purchase.
        default: null
      - name: pos_terminal_id
        type: string
        source: input
        description: Terminal identifier of the register that raised a PHYSICAL request; required when channel == PHYSICAL.
        default: null
      - name: packaging_seal_intact
        type: boolean
        source: input
        description: POS attestation that the tamper-evident packaging was unbroken; required when channel == PHYSICAL.
        default: null
      - name: face_value_cents
        type: integer
        source: input
        description: Value to load onto the card at activation.
        constraints: ">= 100 and <= 500000"
      - name: device_reputation_score
        type: integer
        source: input
        description: Device reputation from the fraud vendor, 0..100 where higher is more trustworthy; required when channel == DIGITAL.
        default: null
        constraints: "0..100"
      - name: email_age_days
        type: integer
        source: input
        description: Age in days of the purchaser email address; required when channel == DIGITAL.
        default: null
        constraints: ">= 0"
      - name: payment_risk_band
        type: enum
        source: input
        description: Payment instrument risk band from the acquirer; required when channel == DIGITAL.
        default: null
        constraints: "LOW | MEDIUM | HIGH"
      - name: recipient_email_hash
        type: string
        source: input
        description: Salted hash of the digital recipient email; required when channel == DIGITAL.
        default: null
      - name: state
        type: enum
        source: computed
        description: Branching screening lifecycle; see §1.2 IssuanceRequest.
        default: SUBMITTED
        constraints: "SUBMITTED | HELD_FOR_REVIEW | APPROVED | DECLINED"
      - name: screening_score
        type: integer
        source: computed
        description: Output of §1.3 digital_issuance_risk_score; null for channel PHYSICAL and null before screening.
        default: null
        constraints: "0..100"
      - name: screening_components
        type: object
        source: computed
        description: "Frozen breakdown recorded at screening time: { device_component, email_component, payment_component, amount_component, bulk_pending_surcharge }. Null for channel PHYSICAL."
        default: null
      - name: decline_reason
        type: enum
        source: computed
        description: Why the request landed in DECLINED; null in every other state.
        default: null
        constraints: "DIGITAL_RISK_SCORE | MANUAL_DECLINE"
      - name: review_note
        type: string
        source: input
        description: Free text supplied by the reviewer on a manual decide call.
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the reviewer that manually decided a HELD_FOR_REVIEW request; null when the state was reached automatically.
        default: null
      - name: screened_at
        type: datetime
        source: system
        description: Logical-clock timestamp at which screening ran; null while SUBMITTED.
        default: null

  - name: LedgerEvent
    parent: null
    common_fields: false
    fields:
      - name: card_id
        type: string
        source: input
        description: FK -> GiftCard.id; the card whose balance this event moves.
        constraints: required, immutable
      - name: merchant_store_id
        type: string
        source: input
        description: FK -> RetailStore.id; merchant store where a REDEMPTION was taken. Null for every non-REDEMPTION type.
        default: null
      - name: reverses_event_id
        type: string
        source: input
        description: FK -> LedgerEvent.id; set only on compensating events (REDEMPTION_REVERSAL, REISSUE_CREDIT_REVERSAL, REISSUE_DEBIT_REVERSAL) and points at the event being undone.
        default: null
      - name: type
        type: enum
        source: system
        description: Event kind, fixed at append time by the endpoint that produced it.
        constraints: "ACTIVATION_LOAD | REDEMPTION | REDEMPTION_REVERSAL | REISSUE_CREDIT | REISSUE_DEBIT | REISSUE_CREDIT_REVERSAL | REISSUE_DEBIT_REVERSAL"
      - name: amount_cents
        type: integer
        source: input
        description: Absolute magnitude of the movement, always positive.
        constraints: ">= 1"
      - name: signed_amount_cents
        type: integer
        source: computed
        description: "+amount_cents for ACTIVATION_LOAD, REDEMPTION_REVERSAL, REISSUE_CREDIT, REISSUE_DEBIT_REVERSAL; -amount_cents for REDEMPTION, REISSUE_DEBIT, REISSUE_CREDIT_REVERSAL."
      - name: occurred_at
        type: datetime
        source: system
        description: Logical-clock timestamp at append time; the primary replay sort key.
      - name: pos_terminal_id
        type: string
        source: input
        description: Register or channel identifier that produced the movement.
        default: null
      - name: memo
        type: string
        source: input
        description: Operator free text describing the movement.
        default: null
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the caller that appended the event.
    note: |
      Append-only event log (`common_fields: false` — no version, no
      updated_at, no update or delete endpoint). Reversal is expressed by
      appending a NEW compensating event that points back through
      reverses_event_id; the reversed event itself is never mutated, so
      "has this event been reversed?" is answered by the existence of a child
      event, never by a flag on the parent.

  - name: BalanceInquiry
    parent: null
    common_fields: false
    fields:
      - name: card_id
        type: string
        source: input
        description: FK -> GiftCard.id; the card whose balance was probed.
        constraints: required, immutable
      - name: channel
        type: enum
        source: input
        description: Where the inquiry arrived from.
        constraints: "POS | IVR | WEB | MOBILE | RESELLER_API"
      - name: requester_ip_hash
        type: string
        source: input
        description: Salted hash of the requesting IP address or terminal fingerprint.
        constraints: "1..128 chars"
      - name: occurred_at
        type: datetime
        source: system
        description: Logical-clock timestamp at which the inquiry was logged; the velocity-window sort key.
      - name: velocity_count_at_inquiry
        type: integer
        source: computed
        description: Value of §1.3 inquiry_velocity_count evaluated inclusive of THIS inquiry.
      - name: drain_score_at_inquiry
        type: integer
        source: computed
        description: Inquiry-weighted drain risk score frozen at the moment this inquiry was logged.
        constraints: "0..100"
      - name: balance_disclosed_cents
        type: integer
        source: computed
        description: The card's current_balance_cents at the moment of the inquiry.
    note: Append-only probe log; the sole input to card-draining velocity detection.

  - name: RedemptionHold
    parent: null
    common_fields: true
    fields:
      - name: card_id
        type: string
        source: input
        description: FK -> GiftCard.id; the card whose value this hold reserves.
        constraints: required, immutable
      - name: amount_cents
        type: integer
        source: input
        description: Value reserved against the card for the duration of the hold interval.
        constraints: ">= 1"
      - name: hold_start
        type: datetime
        source: input
        description: Inclusive start of the CLOSED occupation interval.
        constraints: required
      - name: hold_expires_at
        type: datetime
        source: input
        description: Inclusive end of the CLOSED occupation interval; must be strictly after hold_start.
        constraints: required
      - name: state
        type: enum
        source: computed
        description: Hold lifecycle; see §1.2 RedemptionHold.
        default: ACTIVE
        constraints: "ACTIVE | RELEASED | CAPTURED | EXPIRED"
      - name: disposition
        type: enum
        source: input
        description: Settlement verb supplied to the settle endpoint; null while ACTIVE or EXPIRED.
        default: null
        constraints: "RELEASE | CAPTURE"
      - name: settle_note
        type: string
        source: input
        description: Free text recorded at settlement.
        default: null
      - name: captured_amount_cents
        type: integer
        source: computed
        description: amount_cents when disposition == CAPTURE, else 0.
        default: 0
    note: |
      Occupies a CLOSED time interval on the GiftCard resource with AGGREGATE
      capacity semantics: overlapping holds are legal, but the summed
      amount_cents of every ACTIVE hold intersecting the requested interval
      (touching endpoints count as intersecting) plus the new amount must not
      exceed the card's current_balance_cents.

  - name: BulkPurchaseOrder
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: FK -> RetailStore.id; the store taking the bulk order.
        constraints: required, immutable
      - name: card_quantity
        type: integer
        source: input
        description: Number of cards requested on the order.
        constraints: ">= 1"
      - name: face_value_cents_each
        type: integer
        source: input
        description: Face value requested per card.
        constraints: ">= 100 and <= 500000"
      - name: purchaser_name
        type: string
        source: input
        description: Name given by the purchaser at the counter.
        constraints: "1..120 chars"
      - name: payment_method
        type: enum
        source: input
        description: How the bulk purchase is being tendered.
        constraints: "CASH | DEBIT | CREDIT | CORPORATE_ACH"
      - name: face_value_subtotal_cents
        type: integer
        source: computed
        description: "card_quantity * face_value_cents_each — the PRE-FEE subtotal that alone selects the activation fee tier."
      - name: fee_rate_bps
        type: integer
        source: computed
        description: Activation fee tier in basis points, selected from face_value_subtotal_cents per §1.3 bulk_order_total.
      - name: activation_fee_cents
        type: integer
        source: computed
        description: "round_half_up(face_value_subtotal_cents * fee_rate_bps / 10000) — rounded exactly once."
      - name: total_cents
        type: integer
        source: computed
        description: "face_value_subtotal_cents + activation_fee_cents; compared against RiskPolicy.bulk_identity_threshold_cents to decide whether identity capture is mandatory."
      - name: state
        type: enum
        source: computed
        description: Identity/approval lifecycle with a REQUEST_INFO cycle; see §1.2 BulkPurchaseOrder.
        default: PENDING_IDENTITY
        constraints: "PENDING_IDENTITY | IDENTITY_VERIFIED | APPROVED | DECLINED"
      - name: identity_id_type
        type: enum
        source: input
        description: Kind of government identity captured; null until identity verification, and cleared back to null by a REQUEST_INFO decision.
        default: null
        constraints: "DRIVERS_LICENSE | PASSPORT | STATE_ID | MILITARY_ID"
      - name: identity_id_number_hash
        type: string
        source: input
        description: Salted hash of the captured identity number; null until identity verification, and cleared back to null by a REQUEST_INFO decision.
        default: null
      - name: identity_id_expiry_date
        type: datetime
        source: input
        description: Expiry date of the captured identity document; null until identity verification, and cleared back to null by a REQUEST_INFO decision.
        default: null
      - name: info_request_count
        type: integer
        source: computed
        description: Number of times a decide call with decision == REQUEST_INFO has cycled this order back to PENDING_IDENTITY.
        default: 0
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the caller that moved the order to APPROVED or DECLINED.
        default: null
      - name: decision_note
        type: string
        source: input
        description: Free text supplied on the decide call.
        default: null

  - name: DrainingAlert
    parent: null
    common_fields: true
    fields:
      - name: card_id
        type: string
        source: input
        description: FK -> GiftCard.id; the card suspected of being drained.
        constraints: required, immutable
      - name: detection_basis
        type: enum
        source: input
        description: What produced the alert.
        constraints: "INQUIRY_VELOCITY | REDEMPTION_PATTERN | RESELLER_SIGNAL | MANUAL_REVIEW"
      - name: state
        type: enum
        source: computed
        description: Investigation lifecycle with a DISMISSED -> OPEN reopen cycle; see §1.2 DrainingAlert.
        default: OPEN
        constraints: "OPEN | TRIAGED | CONFIRMED | DISMISSED"
      - name: exposure_cents
        type: integer
        source: computed
        description: Snapshot of the card's current_balance_cents taken at alert creation; the reserve basis and never recomputed afterwards.
      - name: basis_velocity_count
        type: integer
        source: computed
        description: Inquiry velocity count at alert creation; 0 when detection_basis is not INQUIRY_VELOCITY.
        default: 0
      - name: basis_drain_score
        type: integer
        source: computed
        description: Redemption-weighted drain risk score recorded at triage; 0 before triage.
        default: 0
        constraints: "0..100"
      - name: note
        type: string
        source: input
        description: Free text from the analyst that raised the alert.
        default: null
      - name: redemption_pattern_reviewed
        type: boolean
        source: input
        description: Analyst attestation, captured at triage, that the redemption pattern was inspected.
        default: null
      - name: triaged_by_user_id
        type: string
        source: system
        description: X-User-ID of the analyst that triaged the alert; the segregation-of-duties counterparty for resolution. Preserved across reopen.
        default: null
      - name: triage_note
        type: string
        source: input
        description: Free text captured at triage.
        default: null
      - name: resolution
        type: enum
        source: input
        description: Resolution verb supplied to the resolve endpoint; null while OPEN or TRIAGED.
        default: null
        constraints: "CONFIRM | DISMISS"
      - name: resolved_by_user_id
        type: string
        source: system
        description: X-User-ID of the risk manager that resolved the alert.
        default: null
      - name: resolution_note
        type: string
        source: input
        description: Free text captured at resolution.
        default: null
      - name: reopen_count
        type: integer
        source: computed
        description: Number of times the alert has cycled DISMISSED -> OPEN.
        default: 0

  - name: VictimClaim
    parent: null
    common_fields: true
    fields:
      - name: card_id
        type: string
        source: input
        description: FK -> GiftCard.id; the drained card the claimant purchased.
        constraints: required, immutable
      - name: alert_id
        type: string
        source: input
        description: FK -> DrainingAlert.id; optional link to the alert that surfaced the draining.
        default: null
      - name: reissued_card_id
        type: string
        source: system
        description: FK -> GiftCard.id; the replacement card minted when the claim was approved. Null until approval and retained after rescission.
        default: null
      - name: claimant_name
        type: string
        source: input
        description: Name of the claimant.
        constraints: "1..120 chars"
      - name: claimant_contact
        type: string
        source: input
        description: Callback phone or email for the claimant.
        constraints: "1..160 chars"
      - name: purchase_receipt_ref
        type: string
        source: input
        description: Reference to the uploaded purchase receipt evidence; null when not yet supplied.
        default: null
      - name: packaging_photo_ref
        type: string
        source: input
        description: Reference to the uploaded tamper-evident packaging photo evidence; null when not yet supplied.
        default: null
      - name: disputed_amount_cents
        type: integer
        source: input
        description: Amount the claimant asserts was drained; caps the reissue.
        constraints: ">= 1"
      - name: purchased_at
        type: datetime
        source: input
        description: When the claimant bought the card. Starts the claim-filing window and bounds the unauthorized-redemption line set.
        constraints: required
      - name: state
        type: enum
        source: computed
        description: Cyclic evidence/decision lifecycle; see §1.2 VictimClaim.
        default: SUBMITTED
        constraints: "SUBMITTED | EVIDENCE_REQUESTED | APPROVED | DENIED | RESCINDED"
      - name: evidence_round
        type: integer
        source: computed
        description: Number of evidence-request rounds already opened on this claim; incremented by request-evidence and bounded by RiskPolicy.claim_evidence_round_limit.
        default: 0
      - name: missing_evidence_kinds
        type: array
        source: input
        description: Evidence kinds the analyst asked for on the most recent request-evidence call; each element is one of RECEIPT, PACKAGING_PHOTO, CARD_BACK_PHOTO.
        default: []
      - name: unauthorized_line_count
        type: integer
        source: computed
        description: Count of unreversed REDEMPTION LedgerEvent rows on card_id whose occurred_at >= purchased_at, frozen at decision time.
        default: 0
      - name: gross_reissue_cents
        type: integer
        source: computed
        description: Per-line-rounded recovery total from §1.3 claim_reissue_amount, frozen at decision time; null before a decision.
        default: null
      - name: reissue_amount_cents
        type: integer
        source: computed
        description: "min(gross_reissue_cents, disputed_amount_cents) — the value actually restored; null unless the claim reached APPROVED."
        default: null
      - name: residual_transfer_cents
        type: integer
        source: computed
        description: The original card's current_balance_cents at approval time, transferred onto the replacement card; null before approval.
        default: null
      - name: intake_user_id
        type: string
        source: system
        description: X-User-ID of the caller that filed the claim; the segregation-of-duties counterparty for the decision.
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the risk manager that approved or denied the claim.
        default: null
      - name: decision_note
        type: string
        source: input
        description: Free text captured at decision.
        default: null
      - name: rescind_reason
        type: string
        source: input
        description: Free text captured when an approved claim is rescinded.
        default: null

  - name: LawEnforcementReferral
    parent: null
    common_fields: false
    fields:
      - name: alert_id
        type: string
        source: input
        description: FK -> DrainingAlert.id; the CONFIRMED alert this packet documents.
        constraints: required, immutable
      - name: agency_name
        type: string
        source: input
        description: Receiving law-enforcement agency.
        constraints: "1..120 chars"
      - name: case_reference
        type: string
        source: input
        description: Agency-assigned case number when already known.
        default: null
      - name: packet_summary
        type: string
        source: input
        description: Narrative summary transmitted with the referral packet.
        constraints: "1..2000 chars"
      - name: exposure_snapshot_cents
        type: integer
        source: computed
        description: Copy of the referenced alert's exposure_cents at referral time.
      - name: referred_by_user_id
        type: string
        source: system
        description: X-User-ID of the risk manager that filed the referral.
      - name: referred_at
        type: datetime
        source: system
        description: Logical-clock timestamp at which the referral was filed.
    note: |
      Immutable audit artefact (`common_fields: false`): no version, no
      updated_at, and no update, delete or state-transition endpoint exists.
      Referrals are discovered only through the reverse-reachability read
      `GET /draining-alerts/{id}/referrals`.

  - name: ResellerListing
    parent: null
    common_fields: true
    fields:
      - name: card_id
        type: string
        source: input
        description: FK -> GiftCard.id; the card offered on the secondary marketplace.
        constraints: required, immutable
      - name: reseller_partner_id
        type: string
        source: system
        description: X-User-ID of the ResellerPartner that submitted the listing. Opaque operator identifier, NOT a foreign key to any entity.
      - name: marketplace_name
        type: string
        source: input
        description: Secondary marketplace the card is listed on.
        constraints: "1..80 chars"
      - name: asking_price_cents
        type: integer
        source: input
        description: Price the reseller is asking for the card.
        constraints: ">= 1"
      - name: listed_balance_cents
        type: integer
        source: input
        description: Balance the reseller claims the card carries; must equal the card's current_balance_cents to validate.
        constraints: ">= 0"
      - name: state
        type: enum
        source: computed
        description: Card-validation lifecycle; see §1.2 ResellerListing.
        default: SUBMITTED
        constraints: "SUBMITTED | VALIDATED | REJECTED | BLOCKED"
      - name: block_reason
        type: enum
        source: computed
        description: Why validation rejected or blocked the listing; null while SUBMITTED or VALIDATED.
        default: null
        constraints: "CARD_NOT_ACTIVE | CARD_RISK_POSTURE | BALANCE_MISMATCH | DRAIN_SCORE"
      - name: validation_note
        type: string
        source: input
        description: Free text recorded by the validating analyst.
        default: null
      - name: validated_by_user_id
        type: string
        source: system
        description: X-User-ID of the analyst that ran card validation.
        default: null

  - name: LiabilityPeriod
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: Accounting label for the period, e.g. "FY26-AUG".
        constraints: "1..40 chars; unique"
      - name: period_start
        type: datetime
        source: input
        description: Inclusive start of the HALF-OPEN accounting interval [period_start, period_end).
        constraints: required
      - name: period_end
        type: datetime
        source: input
        description: Exclusive end of the HALF-OPEN accounting interval; must be strictly after period_start.
        constraints: required
      - name: state
        type: enum
        source: computed
        description: Accounting lifecycle with a RESTATED self-loop; see §1.2 LiabilityPeriod.
        default: OPEN
        constraints: "OPEN | CLOSED | RESTATED"
      - name: outstanding_liability_cents
        type: integer
        source: computed
        description: Sum of current_balance_cents over every GiftCard with activation_state IN {ACTIVE, DEPLETED}, snapshotted at close and refreshed at each restatement; null while OPEN.
        default: null
      - name: gross_exposure_cents
        type: integer
        source: computed
        description: Sum of exposure_cents over the alerts in the reserve basis of the most recent close or restatement; null while OPEN.
        default: null
      - name: reserve_basis_alert_count
        type: integer
        source: computed
        description: Count of alerts in the reserve basis of the most recent close or restatement; null while OPEN.
        default: null
      - name: provisional_reserve_cents
        type: integer
        source: computed
        description: Provisional variant of §1.3 unauthorized_redemption_reserve, written at close and never overwritten by a restatement; null while OPEN.
        default: null
      - name: final_reserve_cents
        type: integer
        source: computed
        description: Final variant of §1.3 unauthorized_redemption_reserve, written at each restatement; null until the first restatement.
        default: null
      - name: unauthorized_writeoff_cents
        type: integer
        source: computed
        description: Running total of reissue_amount_cents credited by APPROVED victim claims whose approval landed inside this period, decremented when such a claim is rescinded.
        default: 0
      - name: restatement_count
        type: integer
        source: computed
        description: Number of times this period has been restated.
        default: 0
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the close; null while OPEN.
        default: null
      - name: restated_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the most recent restatement; null until the first restatement.
        default: null
      - name: close_note
        type: string
        source: input
        description: Free text captured at close.
        default: null
      - name: restatement_note
        type: string
        source: input
        description: Free text captured at the most recent restatement.
        default: null
    note: |
      Occupies a HALF-OPEN interval [period_start, period_end) on the
      enterprise book with EXCLUSIVE occupancy: two periods may not overlap,
      but abutting periods (previous.period_end == next.period_start) are
      legal. Contrast RedemptionHold, whose CLOSED intervals may overlap under
      an aggregate capacity ceiling.

# ----------------------------------------------------------------------------
# §1.2 State Machine Table
# ----------------------------------------------------------------------------
state_machines:

  # ---- GiftCard, dimension 1 of 2: funding lifecycle -----------------------
  - entity: GiftCard
    dimension: activation_state
    initial_state: INACTIVE
    terminal_states: [VOIDED]
    note: |
      PARALLEL DIMENSION 1. This axis moves ONLY on funding events and claim
      settlement. It never reads or writes risk_posture, and risk_posture never
      reads or writes it — a card can be (ACTIVE, FROZEN), (DEPLETED, FROZEN),
      (CLOSED, RESTRICTED) and so on. VOIDED is the sole terminal state.
    transitions:
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /issuance-requests/{id}/screen or POST /issuance-requests/{id}/decide reaching IssuanceRequest state APPROVED"
        actor: system
        preconditions:
          - "GiftCard.activation_state == INACTIVE"
          - "IssuanceRequest.state transitions to APPROVED in the same request"
        side_effects:
          - "GiftCard.face_value_cents := IssuanceRequest.face_value_cents"
          - "append LedgerEvent{type: ACTIVATION_LOAD, amount_cents: IssuanceRequest.face_value_cents, card_id: this card, merchant_store_id: null}"
          - "recompute GiftCard.current_balance_cents, total_loaded_cents, available_balance_cents per §1.3 card_balance_projection"
          - "GiftCard.activated_at := logical now; GiftCard.rack_id := null"
          - "increment GiftCard.version by 1"
      - from: INACTIVE
        to: VOIDED
        trigger: "system cascade — the card's RetailStore.floor_posture became SUSPENDED"
        actor: system
        preconditions:
          - "GiftCard.activation_state == INACTIVE"
          - "GiftCard.store_id is not null AND RetailStore(GiftCard.store_id).floor_posture == SUSPENDED"
        side_effects:
          - "GiftCard.risk_posture := FROZEN (posture dimension forced, see dimension 2)"
          - "GiftCard.closed_at := logical now"
          - "increment GiftCard.version by 1"
        note: |
          HOP 3 of the rack-tamper cascade. Caused by the store posture change
          (hop 2), which was itself caused by the rack becoming TAMPERED
          (hop 1). Cards are processed in `created_at ASC` order; `id` is never
          consulted.
      - from: ACTIVE
        to: DEPLETED
        trigger: "system — any LedgerEvent append or reversal that leaves current_balance_cents == 0"
        actor: system
        preconditions:
          - "GiftCard.activation_state == ACTIVE"
          - "recomputed GiftCard.current_balance_cents == 0"
        side_effects:
          - "increment GiftCard.version by 1"
      - from: DEPLETED
        to: ACTIVE
        trigger: "system — any LedgerEvent append or reversal that leaves current_balance_cents > 0 (e.g. POST /ledger-events/{id}/reverse on a REDEMPTION)"
        actor: system
        preconditions:
          - "GiftCard.activation_state == DEPLETED"
          - "recomputed GiftCard.current_balance_cents > 0"
        side_effects:
          - "increment GiftCard.version by 1"
        note: CYCLE — DEPLETED and ACTIVE alternate as compensating ledger events land.
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /victim-claims/{id}/decide with decision APPROVE, where VictimClaim.card_id == this card"
        actor: system
        preconditions:
          - "GiftCard.activation_state IN {ACTIVE, DEPLETED}"
          - "VictimClaim.state transitions to APPROVED in the same request"
        side_effects:
          - "append LedgerEvent{type: REISSUE_DEBIT, amount_cents: this card's pre-transition current_balance_cents} when that balance > 0"
          - "recompute GiftCard.current_balance_cents (becomes 0)"
          - "GiftCard.closed_at := logical now"
          - "increment GiftCard.version by 1"
        note: HOP 3 of the claim-approval cascade — caused by the replacement card minted in hop 2.
      - from: DEPLETED
        to: CLOSED
        trigger: "POST /victim-claims/{id}/decide with decision APPROVE, where VictimClaim.card_id == this card and its balance is already 0"
        actor: system
        preconditions:
          - "GiftCard.activation_state == DEPLETED"
          - "VictimClaim.state transitions to APPROVED in the same request"
        side_effects:
          - "no LedgerEvent appended (pre-transition current_balance_cents == 0, so residual_transfer_cents == 0)"
          - "GiftCard.closed_at := logical now"
          - "increment GiftCard.version by 1"
      - from: CLOSED
        to: ACTIVE
        trigger: "POST /victim-claims/{id}/rescind"
        actor: system
        preconditions:
          - "GiftCard.activation_state == CLOSED"
          - "VictimClaim.state == APPROVED AND VictimClaim.card_id == this card"
        side_effects:
          - "append LedgerEvent{type: REISSUE_DEBIT_REVERSAL, amount_cents: VictimClaim.residual_transfer_cents, reverses_event_id: the REISSUE_DEBIT appended at approval} when residual_transfer_cents > 0"
          - "recompute GiftCard.current_balance_cents (returns to its pre-approval value)"
          - "GiftCard.closed_at := null"
          - "increment GiftCard.version by 1"
        note: CYCLE and COMPENSATION — exactly reverses the ACTIVE->CLOSED hop.
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /victim-claims/{id}/rescind, applied to the replacement card"
        actor: system
        preconditions:
          - "GiftCard.reissued_from_card_id is not null AND VictimClaim.reissued_card_id == this card"
          - "VictimClaim.state == APPROVED"
        side_effects:
          - "append LedgerEvent{type: REISSUE_CREDIT_REVERSAL, amount_cents: the REISSUE_CREDIT amount, reverses_event_id: that REISSUE_CREDIT}"
          - "recompute GiftCard.current_balance_cents (becomes 0)"
          - "GiftCard.risk_posture := FROZEN"
          - "GiftCard.closed_at := logical now"
          - "increment GiftCard.version by 1"

  # ---- GiftCard, dimension 2 of 2: fraud posture ---------------------------
  - entity: GiftCard
    dimension: risk_posture
    initial_state: CLEAR
    terminal_states: []
    note: |
      PARALLEL DIMENSION 2, evolving independently of activation_state. Ranks
      are CLEAR=0 < WATCH=1 < RESTRICTED=2 < FROZEN=3. Automatic escalation
      only ever RAISES the rank; only an explicit RiskManager posture override
      or an alert dismissal can lower it.
    transitions:
      - from: CLEAR
        to: WATCH
        trigger: "POST /gift-cards/{id}/balance-inquiries — recomputed drain_risk_score_inquiry >= RiskPolicy.drain_watch_score_threshold and < drain_restrict_score_threshold, and the velocity threshold was not breached"
        actor: system
        preconditions:
          - "GiftCard.risk_posture == CLEAR"
          - "GiftCard.drain_risk_score_inquiry >= RiskPolicy.drain_watch_score_threshold"
          - "GiftCard.drain_risk_score_inquiry < RiskPolicy.drain_restrict_score_threshold"
          - "inquiry_velocity_count < RiskPolicy.inquiry_velocity_threshold"
        side_effects:
          - "increment GiftCard.version by 1"
      - from: CLEAR
        to: RESTRICTED
        trigger: "POST /gift-cards/{id}/balance-inquiries — inquiry_velocity_count >= RiskPolicy.inquiry_velocity_threshold, or drain_risk_score_inquiry >= drain_restrict_score_threshold"
        actor: system
        preconditions:
          - "GiftCard.risk_posture == CLEAR"
          - "inquiry_velocity_count >= RiskPolicy.inquiry_velocity_threshold OR GiftCard.drain_risk_score_inquiry >= RiskPolicy.drain_restrict_score_threshold"
        side_effects:
          - "increment GiftCard.version by 1"
      - from: WATCH
        to: RESTRICTED
        trigger: "POST /gift-cards/{id}/balance-inquiries (velocity breach or score >= drain_restrict_score_threshold) or POST /draining-alerts/{id}/triage where the recomputed drain_risk_score_redemption >= drain_restrict_score_threshold"
        actor: system
        preconditions:
          - "GiftCard.risk_posture == WATCH"
          - "inquiry_velocity_count >= RiskPolicy.inquiry_velocity_threshold OR GiftCard.drain_risk_score_inquiry >= RiskPolicy.drain_restrict_score_threshold OR GiftCard.drain_risk_score_redemption >= RiskPolicy.drain_restrict_score_threshold"
        side_effects:
          - "increment GiftCard.version by 1"
      - from: CLEAR
        to: FROZEN
        trigger: "POST /draining-alerts/{id}/resolve with resolution CONFIRM, or POST /gift-cards/{id}/posture with risk_posture FROZEN"
        actor: RiskManager | system
        preconditions:
          - "GiftCard.risk_posture != FROZEN"
        side_effects:
          - "cascade: every ResellerListing with card_id == this card and state == VALIDATED transitions to BLOCKED with block_reason CARD_RISK_POSTURE, processed in created_at ASC order"
          - "increment GiftCard.version by 1"
      - from: WATCH
        to: FROZEN
        trigger: "POST /draining-alerts/{id}/resolve with resolution CONFIRM, or POST /gift-cards/{id}/posture with risk_posture FROZEN"
        actor: RiskManager | system
        preconditions:
          - "GiftCard.risk_posture != FROZEN"
        side_effects:
          - "cascade: every ResellerListing with card_id == this card and state == VALIDATED transitions to BLOCKED with block_reason CARD_RISK_POSTURE, processed in created_at ASC order"
          - "increment GiftCard.version by 1"
      - from: RESTRICTED
        to: FROZEN
        trigger: "POST /draining-alerts/{id}/resolve with resolution CONFIRM, or POST /gift-cards/{id}/posture with risk_posture FROZEN"
        actor: RiskManager | system
        preconditions:
          - "GiftCard.risk_posture != FROZEN"
        side_effects:
          - "cascade: every ResellerListing with card_id == this card and state == VALIDATED transitions to BLOCKED with block_reason CARD_RISK_POSTURE, processed in created_at ASC order"
          - "increment GiftCard.version by 1"
        note: HOP 2 of the alert-confirmation cascade; the listing block is hop 3.
      - from: FROZEN
        to: CLEAR
        trigger: "POST /gift-cards/{id}/posture with risk_posture CLEAR, or POST /draining-alerts/{id}/resolve with resolution DISMISS when no other alert on the card is in state OPEN or TRIAGED"
        actor: RiskManager | system
        preconditions:
          - "GiftCard.risk_posture == FROZEN"
        side_effects:
          - "increment GiftCard.version by 1"
        note: CYCLE — posture returns to CLEAR without touching activation_state.
      - from: RESTRICTED
        to: CLEAR
        trigger: "POST /gift-cards/{id}/posture with risk_posture CLEAR, or POST /draining-alerts/{id}/resolve with resolution DISMISS when no other alert on the card is in state OPEN or TRIAGED"
        actor: RiskManager | system
        preconditions:
          - "GiftCard.risk_posture == RESTRICTED"
        side_effects:
          - "increment GiftCard.version by 1"
      - from: WATCH
        to: CLEAR
        trigger: "POST /gift-cards/{id}/posture with risk_posture CLEAR, or POST /draining-alerts/{id}/resolve with resolution DISMISS when no other alert on the card is in state OPEN or TRIAGED"
        actor: RiskManager | system
        preconditions:
          - "GiftCard.risk_posture == WATCH"
        side_effects:
          - "increment GiftCard.version by 1"
      - from: CLEAR
        to: WATCH
        trigger: "POST /issuance-requests/{id}/screen reaching HELD_FOR_REVIEW for a PHYSICAL request, or POST /gift-cards/{id}/posture with risk_posture WATCH"
        actor: RiskManager | system
        preconditions:
          - "GiftCard.risk_posture == CLEAR"
        side_effects:
          - "increment GiftCard.version by 1"
        note: |
          Duplicate (CLEAR -> WATCH) edge with a second trigger set. A PHYSICAL
          request held because the store floor is HEIGHTENED puts the stocked
          card on WATCH while the card is still INACTIVE — proof that the two
          dimensions are independent.
      - from: WATCH
        to: RESTRICTED
        trigger: "POST /gift-cards/{id}/posture with risk_posture RESTRICTED"
        actor: RiskManager
        preconditions:
          - "GiftCard.risk_posture == WATCH"
        side_effects:
          - "increment GiftCard.version by 1"
      - from: CLEAR
        to: RESTRICTED
        trigger: "POST /gift-cards/{id}/posture with risk_posture RESTRICTED"
        actor: RiskManager
        preconditions:
          - "GiftCard.risk_posture == CLEAR"
        side_effects:
          - "increment GiftCard.version by 1"
      - from: RESTRICTED
        to: WATCH
        trigger: "POST /gift-cards/{id}/posture with risk_posture WATCH"
        actor: RiskManager
        preconditions:
          - "GiftCard.risk_posture == RESTRICTED"
        side_effects:
          - "increment GiftCard.version by 1"
      - from: FROZEN
        to: WATCH
        trigger: "POST /gift-cards/{id}/posture with risk_posture WATCH"
        actor: RiskManager
        preconditions:
          - "GiftCard.risk_posture == FROZEN"
        side_effects:
          - "increment GiftCard.version by 1"
      - from: FROZEN
        to: RESTRICTED
        trigger: "POST /gift-cards/{id}/posture with risk_posture RESTRICTED"
        actor: RiskManager
        preconditions:
          - "GiftCard.risk_posture == FROZEN"
        side_effects:
          - "increment GiftCard.version by 1"

  # ---- CardRack ------------------------------------------------------------
  - entity: CardRack
    dimension: tamper_state
    initial_state: INTACT
    terminal_states: []
    transitions:
      - from: INTACT
        to: SUSPECT
        trigger: "POST /card-racks/{id}/audits"
        actor: StoreManager | PosAssociate
        preconditions:
          - "CardRack.tamper_state == INTACT"
          - "§1.3 rack_tamper_classification yields SUSPECT (shrink >= 1 or seal_breaks_observed >= 1, and neither TAMPERED trigger is met)"
        side_effects:
          - "CardRack.observed_card_count, seal_breaks_observed, missing_card_count, last_audit_at updated from the audit"
          - "recompute RetailStore(CardRack.store_id).suspect_rack_count and floor_posture per §1.3 store_floor_posture (becomes HEIGHTENED)"
          - "increment CardRack.version by 1 and RetailStore.version by 1"
      - from: INTACT
        to: TAMPERED
        trigger: "POST /card-racks/{id}/audits"
        actor: StoreManager | PosAssociate
        preconditions:
          - "CardRack.tamper_state == INTACT"
          - "§1.3 rack_tamper_classification yields TAMPERED (shrink >= RiskPolicy.rack_shrink_threshold or seal_breaks_observed >= RiskPolicy.rack_seal_break_threshold)"
        side_effects:
          - "CardRack.observed_card_count, seal_breaks_observed, missing_card_count, last_audit_at updated from the audit"
          - "HOP 2: recompute RetailStore(CardRack.store_id).tampered_rack_count and floor_posture per §1.3 store_floor_posture — the store becomes SUSPENDED because it now has at least one TAMPERED rack"
          - "HOP 3: because the store's floor_posture is now SUSPENDED, every GiftCard with store_id == that store and activation_state == INACTIVE transitions INACTIVE -> VOIDED (and its risk_posture is forced to FROZEN), processed in created_at ASC order"
          - "increment CardRack.version, RetailStore.version, and each affected GiftCard.version by 1"
        note: HOP 1 of the three-hop rack-tamper cascade.
      - from: SUSPECT
        to: TAMPERED
        trigger: "POST /card-racks/{id}/audits"
        actor: StoreManager | PosAssociate
        preconditions:
          - "CardRack.tamper_state == SUSPECT"
          - "§1.3 rack_tamper_classification yields TAMPERED"
        side_effects:
          - "same three-hop cascade as INTACT -> TAMPERED"
          - "increment CardRack.version by 1"
      - from: SUSPECT
        to: SUSPECT
        trigger: "POST /card-racks/{id}/audits that again classifies SUSPECT"
        actor: StoreManager | PosAssociate
        preconditions:
          - "CardRack.tamper_state == SUSPECT"
          - "§1.3 rack_tamper_classification yields SUSPECT"
        side_effects:
          - "audit observation fields refreshed; RetailStore.floor_posture recomputed (unchanged)"
          - "increment CardRack.version by 1"
      - from: SUSPECT
        to: INTACT
        trigger: "POST /card-racks/{id}/clear-tamper"
        actor: StoreManager | RiskManager
        preconditions:
          - "CardRack.tamper_state IN {SUSPECT, TAMPERED}"
        side_effects:
          - "CardRack.remediation_note recorded; observed_card_count := expected_card_count; seal_breaks_observed := 0; missing_card_count := 0"
          - "recompute RetailStore(CardRack.store_id).floor_posture (may fall back to HEIGHTENED or OPEN); already-VOIDED cards are NOT restored"
          - "increment CardRack.version by 1 and RetailStore.version by 1"
      - from: TAMPERED
        to: INTACT
        trigger: "POST /card-racks/{id}/clear-tamper"
        actor: StoreManager | RiskManager
        preconditions:
          - "CardRack.tamper_state == TAMPERED"
        side_effects:
          - "CardRack.remediation_note recorded; observed_card_count := expected_card_count; seal_breaks_observed := 0; missing_card_count := 0"
          - "recompute RetailStore(CardRack.store_id).floor_posture per §1.3 store_floor_posture"
          - "increment CardRack.version by 1 and RetailStore.version by 1"
        note: |
          NOT a compensation: the VOIDED cards produced by the tamper cascade
          stay VOIDED (VOIDED is terminal). Only the store gate is released.
      - from: INTACT
        to: INTACT
        trigger: "POST /card-racks/{id}/audits with no shrink and no seal breaks"
        actor: StoreManager | PosAssociate
        preconditions:
          - "CardRack.tamper_state == INTACT"
          - "§1.3 rack_tamper_classification yields INTACT"
        side_effects:
          - "audit observation fields refreshed; RetailStore.floor_posture recomputed (unchanged)"
          - "increment CardRack.version by 1"

  # ---- RetailStore (compound / posture_driven) -----------------------------
  - entity: RetailStore
    dimension: floor_posture
    initial_state: OPEN
    terminal_states: []
    note: |
      Fully derived. Every transition is a system recomputation of §1.3
      store_floor_posture; no endpoint writes floor_posture directly. The
      posture GATES child operations: SUSPENDED blocks issuance submit/screen,
      bulk-order approval, and redemptions taken at this merchant store.
    transitions:
      - from: OPEN
        to: HEIGHTENED
        trigger: "system recomputation after POST /card-racks/{id}/audits, POST /draining-alerts, POST /gift-cards/{id}/balance-inquiries (auto-alert), POST /draining-alerts/{id}/triage, /resolve, /reopen"
        actor: system
        preconditions:
          - "tampered_rack_count == 0"
          - "suspect_rack_count >= 1 OR open_alert_count >= RiskPolicy.floor_heightened_alert_threshold"
        side_effects:
          - "increment RetailStore.version by 1"
      - from: OPEN
        to: SUSPENDED
        trigger: "system recomputation after POST /card-racks/{id}/audits classified a rack TAMPERED"
        actor: system
        preconditions:
          - "tampered_rack_count >= 1"
        side_effects:
          - "HOP 3 of the rack-tamper cascade: every GiftCard with this store_id and activation_state == INACTIVE transitions to VOIDED with risk_posture FROZEN"
          - "increment RetailStore.version by 1"
      - from: HEIGHTENED
        to: SUSPENDED
        trigger: "system recomputation after POST /card-racks/{id}/audits classified a rack TAMPERED"
        actor: system
        preconditions:
          - "tampered_rack_count >= 1"
        side_effects:
          - "HOP 3 of the rack-tamper cascade: every GiftCard with this store_id and activation_state == INACTIVE transitions to VOIDED with risk_posture FROZEN"
          - "increment RetailStore.version by 1"
      - from: HEIGHTENED
        to: OPEN
        trigger: "system recomputation after POST /card-racks/{id}/clear-tamper or POST /draining-alerts/{id}/resolve"
        actor: system
        preconditions:
          - "tampered_rack_count == 0 AND suspect_rack_count == 0"
          - "open_alert_count < RiskPolicy.floor_heightened_alert_threshold"
        side_effects:
          - "increment RetailStore.version by 1"
      - from: SUSPENDED
        to: HEIGHTENED
        trigger: "system recomputation after POST /card-racks/{id}/clear-tamper"
        actor: system
        preconditions:
          - "tampered_rack_count == 0"
          - "suspect_rack_count >= 1 OR open_alert_count >= RiskPolicy.floor_heightened_alert_threshold"
        side_effects:
          - "increment RetailStore.version by 1"
      - from: SUSPENDED
        to: OPEN
        trigger: "system recomputation after POST /card-racks/{id}/clear-tamper"
        actor: system
        preconditions:
          - "tampered_rack_count == 0 AND suspect_rack_count == 0"
          - "open_alert_count < RiskPolicy.floor_heightened_alert_threshold"
        side_effects:
          - "increment RetailStore.version by 1"

  # ---- IssuanceRequest (branching fork-join) -------------------------------
  - entity: IssuanceRequest
    dimension: state
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DECLINED]
    note: |
      BRANCHING fork-join: SUBMITTED forks to three targets with DIVERGENT
      side-effect sets, and HELD_FOR_REVIEW rejoins the same two terminals via
      a manual decision. The fork target depends on `channel`: DIGITAL forks on
      the §1.3 digital_issuance_risk_score bands, PHYSICAL forks on the
      referenced store's floor_posture.
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /issuance-requests/{id}/screen"
        actor: PosAssociate | StoreManager | PlatformAdmin
        preconditions:
          - "IssuanceRequest.state == SUBMITTED"
          - "channel == PHYSICAL: CardRack(rack_id).tamper_state == INTACT AND RetailStore(store_id).floor_posture == OPEN AND GiftCard(card_id).activation_state == INACTIVE"
          - "channel == DIGITAL: screening_score < RiskPolicy.digital_hold_score_threshold"
        side_effects:
          - "IssuanceRequest.screened_at := logical now; screening_score and screening_components written for DIGITAL only"
          - "channel == DIGITAL: mint a new GiftCard{channel: DIGITAL, store_id: null, rack_id: null, activation_state: INACTIVE, risk_posture: CLEAR} and set IssuanceRequest.card_id to it"
          - "GiftCard(card_id) transitions INACTIVE -> ACTIVE, which appends LedgerEvent{type: ACTIVATION_LOAD, amount_cents: face_value_cents}"
          - "increment IssuanceRequest.version by 1"
      - from: SUBMITTED
        to: HELD_FOR_REVIEW
        trigger: "POST /issuance-requests/{id}/screen"
        actor: PosAssociate | StoreManager | PlatformAdmin
        preconditions:
          - "IssuanceRequest.state == SUBMITTED"
          - "channel == PHYSICAL: RetailStore(store_id).floor_posture == HEIGHTENED (and rack INTACT, card INACTIVE)"
          - "channel == DIGITAL: RiskPolicy.digital_hold_score_threshold <= screening_score < RiskPolicy.digital_decline_score_threshold"
        side_effects:
          - "IssuanceRequest.screened_at := logical now; screening_score and screening_components written for DIGITAL only"
          - "channel == PHYSICAL: GiftCard(card_id).risk_posture escalates CLEAR -> WATCH; NO card is minted and NO LedgerEvent is appended"
          - "channel == DIGITAL: NO card is minted"
          - "increment IssuanceRequest.version by 1"
        note: DIVERGENT branch — the held branch produces no funding movement at all.
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /issuance-requests/{id}/screen"
        actor: PosAssociate | StoreManager | PlatformAdmin
        preconditions:
          - "IssuanceRequest.state == SUBMITTED"
          - "channel == DIGITAL AND screening_score >= RiskPolicy.digital_decline_score_threshold"
        side_effects:
          - "IssuanceRequest.decline_reason := DIGITAL_RISK_SCORE; screened_at := logical now; screening_score and screening_components written"
          - "when store_id is not null: increment RetailStore(store_id).declined_issuance_count by 1 and RetailStore.version by 1"
          - "increment IssuanceRequest.version by 1"
      - from: HELD_FOR_REVIEW
        to: APPROVED
        trigger: "POST /issuance-requests/{id}/decide with decision APPROVE"
        actor: StoreManager | RiskManager
        preconditions:
          - "IssuanceRequest.state == HELD_FOR_REVIEW"
          - "channel == PHYSICAL: CardRack(rack_id).tamper_state == INTACT AND RetailStore(store_id).floor_posture != SUSPENDED AND GiftCard(card_id).activation_state == INACTIVE"
        side_effects:
          - "IssuanceRequest.decided_by_user_id := X-User-ID; review_note recorded"
          - "channel == DIGITAL: mint a new GiftCard{channel: DIGITAL} and set IssuanceRequest.card_id to it"
          - "GiftCard(card_id) transitions INACTIVE -> ACTIVE, appending LedgerEvent{type: ACTIVATION_LOAD, amount_cents: face_value_cents}"
          - "increment IssuanceRequest.version by 1"
        note: JOIN point — reaches the same terminal as the direct SUBMITTED -> APPROVED fork.
      - from: HELD_FOR_REVIEW
        to: DECLINED
        trigger: "POST /issuance-requests/{id}/decide with decision DECLINE"
        actor: StoreManager | RiskManager
        preconditions:
          - "IssuanceRequest.state == HELD_FOR_REVIEW"
        side_effects:
          - "IssuanceRequest.decline_reason := MANUAL_DECLINE; decided_by_user_id := X-User-ID; review_note recorded"
          - "when store_id is not null: increment RetailStore(store_id).declined_issuance_count by 1 and RetailStore.version by 1"
          - "the referenced GiftCard, if any, stays INACTIVE with balance 0"
          - "increment IssuanceRequest.version by 1"

  # ---- RedemptionHold ------------------------------------------------------
  - entity: RedemptionHold
    dimension: state
    initial_state: ACTIVE
    terminal_states: [RELEASED, CAPTURED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /redemption-holds/{id}/settle with disposition RELEASE"
        actor: PosAssociate | RiskManager
        preconditions:
          - "RedemptionHold.state == ACTIVE"
        side_effects:
          - "RedemptionHold.disposition := RELEASE; settle_note recorded; captured_amount_cents stays 0"
          - "recompute GiftCard(card_id).held_amount_cents and available_balance_cents; current_balance_cents is unchanged"
          - "increment RedemptionHold.version by 1 and GiftCard.version by 1"
      - from: ACTIVE
        to: CAPTURED
        trigger: "POST /redemption-holds/{id}/settle with disposition CAPTURE"
        actor: PosAssociate | RiskManager
        preconditions:
          - "RedemptionHold.state == ACTIVE"
          - "GiftCard(card_id).activation_state == ACTIVE AND risk_posture != FROZEN"
        side_effects:
          - "append LedgerEvent{type: REDEMPTION, amount_cents: RedemptionHold.amount_cents, merchant_store_id: the settle call's merchant_store_id}"
          - "RedemptionHold.disposition := CAPTURE; captured_amount_cents := amount_cents"
          - "recompute GiftCard.current_balance_cents, total_redeemed_cents, drawdown_ratio, distinct_merchant_count, recent_redemption_count, held_amount_cents, available_balance_cents"
          - "GiftCard may auto-transition ACTIVE -> DEPLETED when the recomputed balance reaches 0"
          - "increment RedemptionHold.version by 1 and GiftCard.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing the logical clock past hold_expires_at"
        actor: system
        preconditions:
          - "RedemptionHold.state == ACTIVE"
          - "new logical now > RedemptionHold.hold_expires_at"
        side_effects:
          - "recompute GiftCard(card_id).held_amount_cents and available_balance_cents"
          - "increment RedemptionHold.version by 1 and GiftCard.version by 1"
        note: |
          Swept deterministically by the clock endpoint in
          (hold_expires_at ASC, created_at ASC) order — never lazily on read,
          and never using `id`.

  # ---- BulkPurchaseOrder (cyclic via REQUEST_INFO) -------------------------
  - entity: BulkPurchaseOrder
    dimension: state
    initial_state: PENDING_IDENTITY
    terminal_states: [APPROVED, DECLINED]
    transitions:
      - from: PENDING_IDENTITY
        to: IDENTITY_VERIFIED
        trigger: "POST /bulk-purchase-orders (system, immediately after creation, when total_cents < RiskPolicy.bulk_identity_threshold_cents)"
        actor: system
        preconditions:
          - "BulkPurchaseOrder.total_cents < RiskPolicy.bulk_identity_threshold_cents"
        side_effects:
          - "identity fields stay null — no identity is required below the threshold"
          - "increment BulkPurchaseOrder.version by 1"
        note: |
          Transient: an order whose total is under the threshold is already
          IDENTITY_VERIFIED in the creation response. The boundary is `>=`, so a
          total exactly equal to the threshold REMAINS in PENDING_IDENTITY.
      - from: PENDING_IDENTITY
        to: IDENTITY_VERIFIED
        trigger: "POST /bulk-purchase-orders/{id}/identity-verification"
        actor: PosAssociate | StoreManager
        preconditions:
          - "BulkPurchaseOrder.state == PENDING_IDENTITY"
        side_effects:
          - "identity_id_type, identity_id_number_hash, identity_id_expiry_date written"
          - "increment BulkPurchaseOrder.version by 1"
      - from: IDENTITY_VERIFIED
        to: PENDING_IDENTITY
        trigger: "POST /bulk-purchase-orders/{id}/decide with decision REQUEST_INFO"
        actor: StoreManager | RiskManager
        preconditions:
          - "BulkPurchaseOrder.state == IDENTITY_VERIFIED"
        side_effects:
          - "identity_id_type := null; identity_id_number_hash := null; identity_id_expiry_date := null"
          - "increment BulkPurchaseOrder.info_request_count by 1"
          - "increment BulkPurchaseOrder.version by 1"
        note: CYCLE — the order may loop PENDING_IDENTITY <-> IDENTITY_VERIFIED any number of times.
      - from: IDENTITY_VERIFIED
        to: APPROVED
        trigger: "POST /bulk-purchase-orders/{id}/decide with decision APPROVE"
        actor: StoreManager | RiskManager
        preconditions:
          - "BulkPurchaseOrder.state IN {PENDING_IDENTITY, IDENTITY_VERIFIED}"
          - "RetailStore(store_id).floor_posture != SUSPENDED"
          - "identity_id_number_hash is not null when total_cents >= RiskPolicy.bulk_identity_threshold_cents"
        side_effects:
          - "BulkPurchaseOrder.decided_by_user_id := X-User-ID; decision_note recorded"
          - "increment BulkPurchaseOrder.version by 1"
      - from: PENDING_IDENTITY
        to: APPROVED
        trigger: "POST /bulk-purchase-orders/{id}/decide with decision APPROVE (only reachable when total_cents < RiskPolicy.bulk_identity_threshold_cents so no identity is required)"
        actor: StoreManager | RiskManager
        preconditions:
          - "BulkPurchaseOrder.state == PENDING_IDENTITY"
          - "RetailStore(store_id).floor_posture != SUSPENDED"
          - "total_cents < RiskPolicy.bulk_identity_threshold_cents"
        side_effects:
          - "BulkPurchaseOrder.decided_by_user_id := X-User-ID; decision_note recorded"
          - "increment BulkPurchaseOrder.version by 1"
      - from: IDENTITY_VERIFIED
        to: DECLINED
        trigger: "POST /bulk-purchase-orders/{id}/decide with decision DECLINE"
        actor: StoreManager | RiskManager
        preconditions:
          - "BulkPurchaseOrder.state IN {PENDING_IDENTITY, IDENTITY_VERIFIED}"
        side_effects:
          - "BulkPurchaseOrder.decided_by_user_id := X-User-ID; decision_note recorded"
          - "increment BulkPurchaseOrder.version by 1"
      - from: PENDING_IDENTITY
        to: DECLINED
        trigger: "POST /bulk-purchase-orders/{id}/decide with decision DECLINE"
        actor: StoreManager | RiskManager
        preconditions:
          - "BulkPurchaseOrder.state == PENDING_IDENTITY"
        side_effects:
          - "BulkPurchaseOrder.decided_by_user_id := X-User-ID; decision_note recorded"
          - "increment BulkPurchaseOrder.version by 1"

  # ---- DrainingAlert (branching + reopen cycle) ----------------------------
  - entity: DrainingAlert
    dimension: state
    initial_state: OPEN
    terminal_states: [CONFIRMED]
    transitions:
      - from: OPEN
        to: TRIAGED
        trigger: "POST /draining-alerts/{id}/triage"
        actor: FraudAnalyst
        preconditions:
          - "DrainingAlert.state == OPEN"
        side_effects:
          - "DrainingAlert.triaged_by_user_id := X-User-ID; triage_note and redemption_pattern_reviewed recorded"
          - "recompute GiftCard(card_id).drain_risk_score_redemption per §1.3 card_drain_risk_score variant redemption_weighted and copy it into DrainingAlert.basis_drain_score"
          - "GiftCard.risk_posture escalates to RESTRICTED when the recomputed score >= RiskPolicy.drain_restrict_score_threshold and the current rank is lower"
          - "recompute RetailStore(card.store_id).open_alert_count and floor_posture"
          - "increment DrainingAlert.version, GiftCard.version and RetailStore.version by 1"
      - from: TRIAGED
        to: CONFIRMED
        trigger: "POST /draining-alerts/{id}/resolve with resolution CONFIRM"
        actor: RiskManager
        preconditions:
          - "DrainingAlert.state == TRIAGED"
          - "X-User-ID != DrainingAlert.triaged_by_user_id (segregation of duties)"
        side_effects:
          - "HOP 1: DrainingAlert.resolution := CONFIRM; resolved_by_user_id := X-User-ID; resolution_note recorded"
          - "HOP 2: because the alert is now CONFIRMED, GiftCard(card_id).risk_posture := FROZEN"
          - "HOP 3: because the card is now FROZEN, every ResellerListing on that card in state VALIDATED transitions to BLOCKED with block_reason CARD_RISK_POSTURE (created_at ASC order)"
          - "recompute RetailStore(card.store_id).open_alert_count and floor_posture"
          - "increment DrainingAlert.version, GiftCard.version, each affected ResellerListing.version and RetailStore.version by 1"
        note: DIVERGENT branch A of the fork, and a three-hop cascade in its own right.
      - from: TRIAGED
        to: DISMISSED
        trigger: "POST /draining-alerts/{id}/resolve with resolution DISMISS"
        actor: RiskManager
        preconditions:
          - "DrainingAlert.state == TRIAGED"
          - "X-User-ID != DrainingAlert.triaged_by_user_id (segregation of duties)"
        side_effects:
          - "DrainingAlert.resolution := DISMISS; resolved_by_user_id := X-User-ID; resolution_note recorded"
          - "GiftCard(card_id).risk_posture := CLEAR when no other DrainingAlert on the card is in state OPEN or TRIAGED; otherwise posture is left untouched"
          - "no ResellerListing is touched"
          - "recompute RetailStore(card.store_id).open_alert_count and floor_posture"
          - "increment DrainingAlert.version, GiftCard.version and RetailStore.version by 1"
        note: DIVERGENT branch B — same from-state, disjoint side-effect set from CONFIRM.
      - from: DISMISSED
        to: OPEN
        trigger: "POST /draining-alerts/{id}/reopen"
        actor: RiskManager
        preconditions:
          - "DrainingAlert.state == DISMISSED"
        side_effects:
          - "DrainingAlert.resolution := null; resolved_by_user_id := null; resolution_note := null; triaged_by_user_id is PRESERVED"
          - "increment DrainingAlert.reopen_count by 1"
          - "recompute RetailStore(card.store_id).open_alert_count and floor_posture"
          - "increment DrainingAlert.version and RetailStore.version by 1"
        note: CYCLE — DISMISSED -> OPEN -> TRIAGED -> DISMISSED may repeat; only CONFIRMED is terminal.

  # ---- VictimClaim (cyclic evidence loop) ---------------------------------
  - entity: VictimClaim
    dimension: state
    initial_state: SUBMITTED
    terminal_states: [DENIED, RESCINDED]
    transitions:
      - from: SUBMITTED
        to: EVIDENCE_REQUESTED
        trigger: "POST /victim-claims/{id}/request-evidence"
        actor: FraudAnalyst
        preconditions:
          - "VictimClaim.state == SUBMITTED"
          - "VictimClaim.evidence_round < RiskPolicy.claim_evidence_round_limit"
        side_effects:
          - "increment VictimClaim.evidence_round by 1; missing_evidence_kinds recorded"
          - "increment VictimClaim.version by 1"
      - from: EVIDENCE_REQUESTED
        to: SUBMITTED
        trigger: "POST /victim-claims/{id}/resubmit-evidence"
        actor: PosAssociate | FraudAnalyst
        preconditions:
          - "VictimClaim.state == EVIDENCE_REQUESTED"
        side_effects:
          - "purchase_receipt_ref and/or packaging_photo_ref overwritten with the supplied non-null values; evidence_round is NOT reset"
          - "increment VictimClaim.version by 1"
        note: CYCLE — the pair may loop up to RiskPolicy.claim_evidence_round_limit times.
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /victim-claims/{id}/decide with decision APPROVE"
        actor: RiskManager
        preconditions:
          - "VictimClaim.state == SUBMITTED"
          - "X-User-ID != VictimClaim.intake_user_id (segregation of duties)"
          - "purchase_receipt_ref is not null; packaging_photo_ref is not null when GiftCard(card_id).channel == PHYSICAL"
          - "gross_reissue_cents <= RiskPolicy.reissue_cap_cents"
        side_effects:
          - "HOP 1: VictimClaim.unauthorized_line_count, gross_reissue_cents, reissue_amount_cents and residual_transfer_cents frozen per §1.3 claim_reissue_amount; decided_by_user_id := X-User-ID"
          - "HOP 2: because the claim is APPROVED, mint a replacement GiftCard{channel: original card's channel, store_id: original card's store_id, rack_id: null, reissued_from_card_id: original card, activation_state: ACTIVE} and append LedgerEvent{type: REISSUE_CREDIT, amount_cents: reissue_amount_cents + residual_transfer_cents} on it; set VictimClaim.reissued_card_id"
          - "HOP 3: because the replacement card now carries the transferred residual, the ORIGINAL GiftCard transitions to CLOSED, appending LedgerEvent{type: REISSUE_DEBIT, amount_cents: residual_transfer_cents} when that residual > 0"
          - "HOP 4: because the original card was written off, the OPEN LiabilityPeriod whose [period_start, period_end) contains the logical now has unauthorized_writeoff_cents incremented by reissue_amount_cents (skipped when no such period exists)"
          - "increment VictimClaim.version, both GiftCard versions and LiabilityPeriod.version by 1"
        note: FOUR-HOP transitive cascade; each hop is caused by the previous hop.
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /victim-claims/{id}/decide with decision DENY"
        actor: RiskManager
        preconditions:
          - "VictimClaim.state == SUBMITTED"
          - "X-User-ID != VictimClaim.intake_user_id (segregation of duties)"
        side_effects:
          - "VictimClaim.decided_by_user_id := X-User-ID; decision_note recorded; reissue_amount_cents stays null"
          - "no GiftCard is minted and no LedgerEvent is appended"
          - "increment VictimClaim.version by 1"
      - from: APPROVED
        to: RESCINDED
        trigger: "POST /victim-claims/{id}/rescind"
        actor: RiskManager | LiabilityAccountant
        preconditions:
          - "VictimClaim.state == APPROVED"
        side_effects:
          - "the replacement GiftCard transitions ACTIVE -> VOIDED, appending LedgerEvent{type: REISSUE_CREDIT_REVERSAL, amount_cents: reissue_amount_cents + residual_transfer_cents, reverses_event_id: the REISSUE_CREDIT} and forcing risk_posture FROZEN"
          - "the ORIGINAL GiftCard transitions CLOSED -> ACTIVE, appending LedgerEvent{type: REISSUE_DEBIT_REVERSAL, amount_cents: residual_transfer_cents, reverses_event_id: the REISSUE_DEBIT} when residual_transfer_cents > 0, and closed_at := null"
          - "the OPEN LiabilityPeriod containing the logical now has unauthorized_writeoff_cents DECREMENTED by reissue_amount_cents"
          - "VictimClaim.rescind_reason recorded; reissue_amount_cents, residual_transfer_cents and reissued_card_id are RETAINED for audit"
          - "increment VictimClaim.version, both GiftCard versions and LiabilityPeriod.version by 1"
        note: |
          COMPENSATION for SUBMITTED -> APPROVED. Restores the conserved
          quantity `net_funded_liability_cents` to its pre-approval value
          exactly (see §1.3 net_funded_liability_invariant).

  # ---- ResellerListing -----------------------------------------------------
  - entity: ResellerListing
    dimension: state
    initial_state: SUBMITTED
    terminal_states: [REJECTED, BLOCKED]
    transitions:
      - from: SUBMITTED
        to: VALIDATED
        trigger: "POST /reseller-listings/{id}/validate"
        actor: FraudAnalyst
        preconditions:
          - "ResellerListing.state == SUBMITTED"
          - "GiftCard(card_id).activation_state == ACTIVE"
          - "GiftCard(card_id).risk_posture IN {CLEAR, WATCH}"
          - "ResellerListing.listed_balance_cents == GiftCard(card_id).current_balance_cents"
          - "GiftCard(card_id).drain_risk_score_inquiry < RiskPolicy.drain_restrict_score_threshold"
        side_effects:
          - "ResellerListing.validated_by_user_id := X-User-ID; validation_note recorded; block_reason stays null"
          - "increment ResellerListing.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /reseller-listings/{id}/validate"
        actor: FraudAnalyst
        preconditions:
          - "ResellerListing.state == SUBMITTED"
          - "§1.3 listing_validation_decision yields REJECTED — GiftCard.activation_state != ACTIVE, or listed_balance_cents != GiftCard.current_balance_cents"
        side_effects:
          - "ResellerListing.block_reason := CARD_NOT_ACTIVE or BALANCE_MISMATCH per §1.3 listing_validation_decision"
          - "ResellerListing.validated_by_user_id := X-User-ID"
          - "increment ResellerListing.version by 1"
      - from: SUBMITTED
        to: BLOCKED
        trigger: "POST /reseller-listings/{id}/validate"
        actor: FraudAnalyst
        preconditions:
          - "ResellerListing.state == SUBMITTED"
          - "§1.3 listing_validation_decision yields BLOCKED — GiftCard.risk_posture IN {RESTRICTED, FROZEN}, or drain_risk_score_inquiry >= RiskPolicy.drain_restrict_score_threshold"
        side_effects:
          - "ResellerListing.block_reason := CARD_RISK_POSTURE or DRAIN_SCORE per §1.3 listing_validation_decision"
          - "ResellerListing.validated_by_user_id := X-User-ID"
          - "increment ResellerListing.version by 1"
      - from: VALIDATED
        to: BLOCKED
        trigger: "system cascade — GiftCard(card_id).risk_posture became FROZEN (via POST /draining-alerts/{id}/resolve CONFIRM or POST /gift-cards/{id}/posture)"
        actor: system
        preconditions:
          - "ResellerListing.state == VALIDATED"
          - "GiftCard(card_id).risk_posture == FROZEN"
        side_effects:
          - "ResellerListing.block_reason := CARD_RISK_POSTURE"
          - "increment ResellerListing.version by 1"
        note: HOP 3 of the alert-confirmation cascade.

  # ---- LiabilityPeriod (restatement self-loop) ----------------------------
  - entity: LiabilityPeriod
    dimension: state
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /liability-periods/{id}/close"
        actor: LiabilityAccountant
        preconditions:
          - "LiabilityPeriod.state == OPEN"
        side_effects:
          - "outstanding_liability_cents, gross_exposure_cents, reserve_basis_alert_count and provisional_reserve_cents written per §1.3 unauthorized_redemption_reserve variant provisional"
          - "closed_at := logical now; close_note recorded"
          - "increment LiabilityPeriod.version by 1"
      - from: CLOSED
        to: RESTATED
        trigger: "POST /liability-periods/{id}/restate"
        actor: LiabilityAccountant
        preconditions:
          - "LiabilityPeriod.state IN {CLOSED, RESTATED}"
          - "expected_liability_period_version == LiabilityPeriod.version"
        side_effects:
          - "final_reserve_cents, gross_exposure_cents, reserve_basis_alert_count and outstanding_liability_cents rewritten per §1.3 unauthorized_redemption_reserve variant final; provisional_reserve_cents is NEVER overwritten"
          - "restated_at := logical now; restatement_note recorded; increment restatement_count by 1"
          - "increment LiabilityPeriod.version by 1"
      - from: RESTATED
        to: RESTATED
        trigger: "POST /liability-periods/{id}/restate"
        actor: LiabilityAccountant
        preconditions:
          - "LiabilityPeriod.state == RESTATED"
          - "expected_liability_period_version == LiabilityPeriod.version"
        side_effects:
          - "same recomputation as CLOSED -> RESTATED; restatement_count increments again"
          - "increment LiabilityPeriod.version by 1"
        note: CYCLE (self-loop) — a period may be restated repeatedly; there is no terminal state.

# ----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` ONLY)
# ----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: hold-create-stale-card
    parent_entity: GiftCard
    write_endpoint: "POST /gift-cards/{id}/redemption-holds"
    occ_field: "expected_gift_card_version"
    description: |
      Placing a RedemptionHold against a GiftCard whose `version` has advanced
      since the client last observed it is rejected with a stale-version error.
      Holds are legitimately additive — a second hold request that observed the
      same card state would itself succeed under the aggregate-capacity rule —
      so the write cannot be resolved by a state precondition. The client must
      re-read the card (whose version is bumped by every hold, redemption,
      reversal, posture change and cascade) and resubmit against the observed
      version.
    error_id: ERR_STALE_CARD_VERSION
    http_status: 412

  - rule_id: period-restate-stale-period
    parent_entity: LiabilityPeriod
    write_endpoint: "POST /liability-periods/{id}/restate"
    occ_field: "expected_liability_period_version"
    description: |
      Restating a LiabilityPeriod whose `version` has advanced since the client
      last observed it is rejected with a stale-version error. Restatement is
      legitimately repeatable (RESTATED -> RESTATED self-loop), so a second
      restatement is not blocked by any state precondition; the stale-version
      check is what stops an accountant from overwriting final_reserve_cents
      from a superseded view of the period's exposure basis.
    error_id: ERR_STALE_PERIOD_VERSION
    http_status: 412

# ----------------------------------------------------------------------------
# §1.3 Calculations
# ----------------------------------------------------------------------------
calculations:

  - name: card_balance_projection
    algorithm_type: projection
    entity: GiftCard
    output_fields:
      - GiftCard.current_balance_cents
      - GiftCard.total_loaded_cents
      - GiftCard.total_redeemed_cents
      - GiftCard.held_amount_cents
      - GiftCard.available_balance_cents
      - GiftCard.drawdown_ratio
      - GiftCard.distinct_merchant_count
      - GiftCard.recent_redemption_count
      - LedgerEvent.signed_amount_cents
    inputs:
      - "every LedgerEvent whose card_id == GiftCard.id"
      - "every RedemptionHold whose card_id == GiftCard.id and state == ACTIVE"
      - "RiskPolicy.redemption_window_minutes"
      - "the logical clock's current UTC instant (`now`)"
    constants: {}
    formula: |
      GiftCard is a pure projection of its own append-only LedgerEvent stream.
      No endpoint ever writes a balance directly; every balance field is
      re-derived by replaying the stream after each append.

      STEP 1 — sign each event (LedgerEvent.signed_amount_cents):
        CREDIT kinds  (signed = +amount_cents):
          ACTIVATION_LOAD, REDEMPTION_REVERSAL, REISSUE_CREDIT,
          REISSUE_DEBIT_REVERSAL
        DEBIT kinds   (signed = -amount_cents):
          REDEMPTION, REISSUE_DEBIT, REISSUE_CREDIT_REVERSAL

      STEP 2 — replay in (occurred_at ASC, created_at ASC) order. The pair is
      total because created_at is unique per append. `id` is NEVER consulted.
        current_balance_cents = SUM(signed_amount_cents) over all events
        total_loaded_cents    = SUM(amount_cents) over CREDIT kinds
        total_redeemed_cents  = SUM(amount_cents) over unreversed REDEMPTION
                                events only

      An event E is REVERSED iff some LedgerEvent R exists with
      R.reverses_event_id == E.id. Reversal is detected purely by the existence
      of that child event — LedgerEvent carries no mutable "reversed" flag.

      STEP 3 — drawdown_ratio, rounded HALF-UP to exactly 2 decimals:
        drawdown_ratio = 0.00 when total_loaded_cents == 0
                       = round_half_up(total_redeemed_cents / total_loaded_cents, 2)
                         otherwise
        The ratio is CLAMPED to the closed range [0.00, 1.00].

      STEP 4 — redemption-pattern counters, restricted to the recent window
      `now - RiskPolicy.redemption_window_minutes <= occurred_at <= now`
      (both bounds INCLUSIVE) over unreversed REDEMPTION events:
        distinct_merchant_count  = count of DISTINCT non-null merchant_store_id
        recent_redemption_count  = count of such events

      STEP 5 — holds. An ACTIVE RedemptionHold is COUNTED iff
      hold_expires_at >= now (a hold expiring exactly at `now` still counts):
        held_amount_cents      = SUM(amount_cents) over counted holds
        available_balance_cents = max(0, current_balance_cents - held_amount_cents)

      available_balance_cents therefore FLOORS AT ZERO while
      current_balance_cents may not be floored by holds at all — the two fields
      diverge whenever holds exceed the ledger balance.
    edge_cases:
      - "No events at all: every output is 0 and drawdown_ratio is 0.00 (not null, not an error)."
      - "A REDEMPTION_REVERSAL restores current_balance_cents exactly and drops the reversed line out of total_redeemed_cents, so drawdown_ratio falls back too."
      - "A late-arriving event (occurred_at earlier than an already-stored event) is inserted into the replay by occurred_at, not by created_at, so the projection is order-independent with respect to append order."
      - "A hold whose hold_expires_at is exactly `now` is still counted; one microsecond later the clock endpoint sweeps it to EXPIRED and it stops counting."
      - "distinct_merchant_count ignores null merchant_store_id entirely rather than counting null as its own merchant."

  - name: inquiry_velocity_count
    algorithm_type: aggregation
    entity: BalanceInquiry
    output_fields:
      - BalanceInquiry.velocity_count_at_inquiry
      - DrainingAlert.basis_velocity_count
    inputs:
      - "every BalanceInquiry whose card_id == GiftCard.id"
      - "RiskPolicy.inquiry_velocity_window_minutes"
      - "RiskPolicy.inquiry_velocity_threshold"
      - "the logical clock's current UTC instant (`now`)"
    constants:
      window_minutes_default: 60
      threshold_default: 5
    formula: |
      Evaluated INSIDE the POST /gift-cards/{id}/balance-inquiries handler,
      AFTER the new inquiry row has been appended, so the triggering inquiry
      counts itself.

        window_start = now - RiskPolicy.inquiry_velocity_window_minutes
        velocity_count_at_inquiry =
          COUNT(BalanceInquiry b WHERE b.card_id == card.id
                AND b.occurred_at >= window_start
                AND b.occurred_at <= now)

      Both bounds are INCLUSIVE: an inquiry sitting exactly on window_start is
      inside the window.

        breach = velocity_count_at_inquiry >= RiskPolicy.inquiry_velocity_threshold

      `breach` is TRUE at exactly the threshold, never at threshold - 1.
      On breach the handler auto-creates a DrainingAlert with
      detection_basis INQUIRY_VELOCITY, copying velocity_count_at_inquiry into
      DrainingAlert.basis_velocity_count — but only when no DrainingAlert on
      that card is already in state OPEN or TRIAGED with detection_basis
      INQUIRY_VELOCITY. Repeated breaches therefore do not fan out duplicate
      alerts.
    edge_cases:
      - "The very first inquiry on a card yields velocity_count_at_inquiry == 1, not 0."
      - "At exactly threshold - 1 no alert exists; the very next inquiry (== threshold) creates it."
      - "Advancing the logical clock past the window ages inquiries out, so the count can DECREASE between consecutive inquiries and a later inquiry may not breach even though an earlier one did."
      - "An inquiry landing exactly on window_start is counted (>= not >)."

  - name: card_drain_risk_score
    algorithm_type: weighted_scoring
    entity: GiftCard
    variants:
      - variant: inquiry_weighted
        applies_when: "computed by POST /gift-cards/{id}/balance-inquiries and written to GiftCard.drain_risk_score_inquiry and BalanceInquiry.drain_score_at_inquiry"
        weights:
          velocity_count: 12
          drawdown_ratio: 30
          distinct_merchant_count: 5
        formula: |
          raw = 12 * velocity_count_at_inquiry
              + 30 * GiftCard.drawdown_ratio
              +  5 * GiftCard.distinct_merchant_count
          score = min(100, max(0, round_half_up(raw)))
      - variant: redemption_weighted
        applies_when: "computed by POST /draining-alerts/{id}/triage and written to GiftCard.drain_risk_score_redemption and DrainingAlert.basis_drain_score"
        weights:
          drawdown_ratio: 45
          distinct_merchant_count: 14
          recent_redemption_count: 6
        formula: |
          raw = 45 * GiftCard.drawdown_ratio
              + 14 * GiftCard.distinct_merchant_count
              +  6 * GiftCard.recent_redemption_count
          score = min(100, max(0, round_half_up(raw)))
    output_fields:
      - GiftCard.drain_risk_score_inquiry
      - GiftCard.drain_risk_score_redemption
      - BalanceInquiry.drain_score_at_inquiry
      - DrainingAlert.basis_drain_score
      - GiftCard.risk_posture
    inputs:
      - "BalanceInquiry.velocity_count_at_inquiry from §1.3 inquiry_velocity_count"
      - "GiftCard.drawdown_ratio, distinct_merchant_count, recent_redemption_count from §1.3 card_balance_projection"
      - "RiskPolicy.drain_watch_score_threshold"
      - "RiskPolicy.drain_restrict_score_threshold"
    constants:
      watch_threshold_default: 40
      restrict_threshold_default: 70
    formula: |
      The two variants are NOT two roundings of one number — they consume
      DIFFERENT input sets with DIFFERENT weights and are stored in DIFFERENT
      columns, so the same card normally carries two different live scores at
      once:

        inquiry_weighted    reacts to INQUIRY pressure (velocity dominates,
                            weight 12/inquiry) and only lightly to redemption
                            spread (5/merchant). recent_redemption_count is
                            NOT an input.
        redemption_weighted reacts to REDEMPTION pattern (drawdown 45,
                            merchant spread 14, redemption count 6) and
                            ignores inquiry velocity ENTIRELY.

      Both variants round ONCE, at the very end, HALF-UP to an integer, then
      clamp into [0, 100]. Intermediate products are NOT rounded — a
      drawdown_ratio of 0.60 contributes exactly 18.0 to the inquiry variant
      and exactly 27.0 to the redemption variant.

      POSTURE ESCALATION (identical ladder for both variants, applied to
      whichever score was just recomputed):
        rank(CLEAR) = 0 < rank(WATCH) = 1 < rank(RESTRICTED) = 2 < rank(FROZEN) = 3
        target = RESTRICTED when `breach` (§1.3 inquiry_velocity_count) is TRUE
                            — the velocity breach alone forces RESTRICTED,
                            regardless of how low the score is
               = RESTRICTED when score >= RiskPolicy.drain_restrict_score_threshold
               = WATCH      when score >= RiskPolicy.drain_watch_score_threshold
               = CLEAR      otherwise
        GiftCard.risk_posture := target ONLY IF rank(target) > rank(current).
      The velocity clause applies only to the `inquiry_weighted` variant, since
      `breach` is only evaluated inside the balance-inquiry handler.
      Scoring never DE-escalates a posture; only alert dismissal or an explicit
      RiskManager posture override can lower it.
    edge_cases:
      - "A brand-new card with no ledger events scores 0 under both variants and stays CLEAR."
      - "A score landing exactly on drain_watch_score_threshold escalates to WATCH; one point below it does not."
      - "A card already FROZEN keeps FROZEN even when the freshly computed score maps to WATCH, because escalation is monotone upward."
      - "Because the variants read disjoint signal sets, a card can be RESTRICTED by the redemption variant while its inquiry score is still under the watch threshold, and vice versa."
      - "The clamp matters: a card with drawdown_ratio 1.00, 6 distinct merchants and 12 recent redemptions raws to 45 + 84 + 72 = 201 and stores 100."

  - name: digital_issuance_risk_score
    algorithm_type: weighted_scoring
    entity: IssuanceRequest
    output_fields:
      - IssuanceRequest.screening_score
      - IssuanceRequest.screening_components
      - IssuanceRequest.state
      - IssuanceRequest.decline_reason
    inputs:
      - IssuanceRequest.device_reputation_score
      - IssuanceRequest.email_age_days
      - IssuanceRequest.payment_risk_band
      - IssuanceRequest.face_value_cents
      - "BulkPurchaseOrder(IssuanceRequest.bulk_order_id).state, when bulk_order_id is not null"
      - "RiskPolicy.digital_hold_score_threshold"
      - "RiskPolicy.digital_decline_score_threshold"
    constants:
      device_weight: 0.35
      email_weight: 0.25
      payment_weight: 0.25
      amount_weight: 0.15
      email_band_established_days: 365
      email_band_seasoned_days: 90
      email_band_young_days: 7
      amount_step_cents: 5000
      amount_points_per_step: 5
      amount_component_cap: 30
      unverified_bulk_surcharge: 15
      hold_threshold_default: 45
      decline_threshold_default: 75
    formula: |
      MULTI-FACTOR, NON-LINEAR composition. Each raw signal is first mapped
      through its OWN transform — one linear inversion, one step function, one
      categorical lookup, one capped staircase — and only then are the four
      transformed components blended. Blending the raw signals directly gives a
      different answer, because none of the four transforms is linear in its
      input over the whole domain.

      COMPONENT 1 — device (linear inversion, floored at 0):
        device_component = max(0, 100 - device_reputation_score)

      COMPONENT 2 — email age (STEP function, NOT interpolated):
        email_age_days >= 365           -> email_component =  0
        90 <= email_age_days <= 364     -> email_component = 20
        7  <= email_age_days <= 89      -> email_component = 45
        email_age_days < 7              -> email_component = 70

      COMPONENT 3 — payment band (categorical lookup):
        LOW -> 0 ; MEDIUM -> 25 ; HIGH -> 60

      COMPONENT 4 — face value (capped staircase, floor division):
        amount_component = min(30, floor(face_value_cents / 5000) * 5)

      BLEND — round ONCE, HALF-UP, at the end:
        base = round_half_up(0.35 * device_component
                           + 0.25 * email_component
                           + 0.25 * payment_component
                           + 0.15 * amount_component)

      BULK SURCHARGE — applied AFTER the blend and AFTER the rounding, and only
      when the request is attached to a bulk order that has not yet cleared
      identity:
        if IssuanceRequest.bulk_order_id is not null
           AND BulkPurchaseOrder.state == PENDING_IDENTITY:
             screening_score = min(100, base + 15)
        else:
             screening_score = base

      Order is load-bearing: surcharging BEFORE the blend would scale the 15
      points by 0.35/0.25/... weights and produce a different score.

      screening_components stores the four transformed components verbatim as
      {"device": ..., "email": ..., "payment": ..., "amount": ..., "base": ..., "bulk_surcharge": ...}
      so the composition is auditable.

      DISPOSITION (evaluated on screening_score, thresholds inclusive):
        screening_score >= RiskPolicy.digital_decline_score_threshold
            -> state DECLINED, decline_reason DIGITAL_RISK_SCORE
        screening_score >= RiskPolicy.digital_hold_score_threshold
            -> state HELD_FOR_REVIEW, decline_reason null
        otherwise
            -> state APPROVED, decline_reason null
    edge_cases:
      - "device_reputation_score above 100 floors device_component at 0 rather than going negative."
      - "email_age_days exactly 365 scores 0 while 364 scores 20 — the step boundary is a 20-point cliff, so linear interpolation is detectably wrong."
      - "face_value_cents 29999 gives floor(5.9999)=5 -> 25 points; 30000 gives 6 -> 30 points; 500000 also gives 30 because of the cap."
      - "A score exactly equal to digital_hold_score_threshold is HELD_FOR_REVIEW, not APPROVED; a score exactly equal to digital_decline_score_threshold is DECLINED, not HELD."
      - "The bulk surcharge can flip an otherwise-APPROVED request to HELD_FOR_REVIEW without any signal changing, purely because its bulk order has not cleared identity yet."
      - "Once the bulk order reaches IDENTITY_VERIFIED the surcharge no longer applies, so re-screening the same request yields a LOWER score."

  - name: bulk_order_total
    algorithm_type: tiered_pricing
    entity: BulkPurchaseOrder
    output_fields:
      - BulkPurchaseOrder.face_value_subtotal_cents
      - BulkPurchaseOrder.fee_rate_bps
      - BulkPurchaseOrder.activation_fee_cents
      - BulkPurchaseOrder.total_cents
      - BulkPurchaseOrder.state
    inputs:
      - BulkPurchaseOrder.card_quantity
      - BulkPurchaseOrder.face_value_cents_each
      - "RiskPolicy.bulk_identity_threshold_cents"
      - "RiskPolicy.bulk_quantity_limit"
    constants:
      tier_1_upper_exclusive_cents: 25000
      tier_2_upper_exclusive_cents: 100000
      tier_3_upper_exclusive_cents: 500000
      tier_0_rate_bps: 0
      tier_1_rate_bps: 150
      tier_2_rate_bps: 225
      tier_3_rate_bps: 300
    formula: |
      EVALUATION ORDER IS PINNED and is the whole difficulty of this rule.

      STEP 1 — subtotal (exact, no rounding needed):
        face_value_subtotal_cents = card_quantity * face_value_cents_each

      STEP 2 — select the fee tier from the PRE-FEE SUBTOTAL. The tier is a
      whole-order (average-rate) band, not a marginal ladder: ONE rate applies
      to the ENTIRE subtotal.
        face_value_subtotal_cents <      25000 -> fee_rate_bps =   0
        25000 <= subtotal <             100000 -> fee_rate_bps = 150
        100000 <= subtotal <            500000 -> fee_rate_bps = 225
        face_value_subtotal_cents >=    500000 -> fee_rate_bps = 300

      STEP 3 — one single rounding, HALF-UP, applied to the whole-order fee:
        activation_fee_cents = round_half_up(face_value_subtotal_cents
                                             * fee_rate_bps / 10000)

      STEP 4 — total:
        total_cents = face_value_subtotal_cents + activation_fee_cents

      Two tempting but WRONG orders are explicitly excluded:
        (a) selecting the tier from total_cents (i.e. re-selecting after the fee
            is added) — an order whose subtotal sits just under a tier boundary
            would be pushed into the next tier by its own fee;
        (b) rounding per card (round_half_up(face_value_cents_each * bps/10000)
            then multiplying by card_quantity) — this accumulates up to
            card_quantity half-cent errors instead of one.

      STEP 5 — initial state, from the total:
        total_cents >= RiskPolicy.bulk_identity_threshold_cents
            -> state PENDING_IDENTITY (identity is mandatory before approval)
        total_cents <  RiskPolicy.bulk_identity_threshold_cents
            -> state IDENTITY_VERIFIED immediately, identity fields left null
      The boundary is `>=`, so a total EXACTLY on the threshold still requires
      identity.

      card_quantity > RiskPolicy.bulk_quantity_limit is rejected at creation by
      §1.4 p68 before any of the above runs.
    edge_cases:
      - "subtotal exactly 25000 sits in the 150 bps tier (>= is the lower edge); 24999 pays no fee at all."
      - "subtotal 99900 -> 150 bps -> fee round_half_up(1498.5) = 1499 -> total 101399. Tier-on-total would wrongly read 101399 as the 225 bps band."
      - "A half-cent exactly at .5 rounds UP (1498.5 -> 1499), never to even."
      - "card_quantity exactly equal to bulk_quantity_limit is accepted; limit + 1 is rejected."
      - "total exactly equal to bulk_identity_threshold_cents still lands in PENDING_IDENTITY."
      - "A REQUEST_INFO decision does NOT recompute any money field — subtotal, fee and total are frozen at creation."

  - name: claim_reissue_amount
    algorithm_type: aggregation
    entity: VictimClaim
    output_fields:
      - VictimClaim.unauthorized_line_count
      - VictimClaim.gross_reissue_cents
      - VictimClaim.reissue_amount_cents
      - VictimClaim.residual_transfer_cents
    inputs:
      - "every LedgerEvent on VictimClaim.card_id with type REDEMPTION"
      - VictimClaim.purchased_at
      - VictimClaim.disputed_amount_cents
      - "GiftCard(card_id).current_balance_cents"
      - "RiskPolicy.recovery_factor_bps"
      - "RiskPolicy.reissue_cap_cents"
    constants:
      recovery_factor_bps_default: 8500
      reissue_cap_cents_default: 100000
    formula: |
      Evaluated when POST /victim-claims/{id}/decide carries decision APPROVE.

      STEP 1 — INPUT SET FILTERING. A LedgerEvent L is an UNAUTHORIZED LINE iff
      ALL of:
        L.card_id == VictimClaim.card_id
        L.type    == REDEMPTION
        L.occurred_at >= VictimClaim.purchased_at        (INCLUSIVE)
        no LedgerEvent R exists with R.reverses_event_id == L.id
      Reversed redemptions are excluded because the cardholder already got that
      money back; pre-purchase redemptions are excluded because they cannot
      belong to this claimant.
        unauthorized_line_count = COUNT(unauthorized lines)

      STEP 2 — PER-LINE ROUNDING, THEN SUM. The recovery factor is applied to
      EACH line and each line is rounded to whole cents HALF-UP BEFORE the sum:
        gross_reissue_cents = SUM over unauthorized lines L of
                              round_half_up(L.amount_cents
                                            * RiskPolicy.recovery_factor_bps
                                            / 10000)
      Rounding the SUM instead of each line is a different number in general;
      the per-line order is normative. (Summing first then rounding once for
      lines 1010/1030/1050 at 8500 bps gives 2627, while per-line rounding gives
      859 + 876 + 893 = 2628.)

      STEP 3 — CAP CHECK (before any capping of the payout):
        gross_reissue_cents > RiskPolicy.reissue_cap_cents
            -> reject the approval with ERR_REISSUE_LIMIT_EXCEEDED (§1.4 p77);
               nothing is written and the claim stays SUBMITTED.
      The comparison is strict `>`, so a gross exactly on the cap is payable.

      STEP 4 — CLAIMANT CEILING:
        reissue_amount_cents = min(gross_reissue_cents,
                                   VictimClaim.disputed_amount_cents)
      A claimant can never be reissued more than they disputed, even when the
      recovered ledger lines total more.

      STEP 5 — RESIDUAL TRANSFER. Whatever is still live on the compromised card
      moves to the replacement card so no value is created or destroyed:
        residual_transfer_cents = GiftCard(card_id).current_balance_cents
      The replacement card is therefore credited
      reissue_amount_cents + residual_transfer_cents, and the original card is
      debited residual_transfer_cents on its way to CLOSED.
    edge_cases:
      - "Zero unauthorized lines: unauthorized_line_count 0, gross_reissue_cents 0, reissue_amount_cents 0, and the replacement card is still minted carrying only the residual."
      - "A redemption whose occurred_at is exactly purchased_at IS included (>=)."
      - "A redemption that was already reversed is excluded, so reversing first and then approving pays out less."
      - "gross exactly equal to reissue_cap_cents is allowed; cap + 1 raises ERR_REISSUE_LIMIT_EXCEEDED."
      - "disputed_amount_cents smaller than gross clamps the payout but does NOT change gross_reissue_cents, which is retained for audit."
      - "residual_transfer_cents of 0 means no REISSUE_DEBIT event is appended at all on the original card."

  - name: unauthorized_redemption_reserve
    algorithm_type: aggregation
    entity: LiabilityPeriod
    variants:
      - variant: provisional
        applies_when: "POST /liability-periods/{id}/close (OPEN -> CLOSED)"
        alert_state_filter: [OPEN, TRIAGED, CONFIRMED]
        rate_source: RiskPolicy.provisional_reserve_rate_bps
        output_field: LiabilityPeriod.provisional_reserve_cents
      - variant: final
        applies_when: "POST /liability-periods/{id}/restate (CLOSED -> RESTATED, RESTATED -> RESTATED)"
        alert_state_filter: [CONFIRMED]
        rate_source: RiskPolicy.final_reserve_rate_bps
        output_field: LiabilityPeriod.final_reserve_cents
    output_fields:
      - LiabilityPeriod.gross_exposure_cents
      - LiabilityPeriod.reserve_basis_alert_count
      - LiabilityPeriod.provisional_reserve_cents
      - LiabilityPeriod.final_reserve_cents
      - LiabilityPeriod.outstanding_liability_cents
    inputs:
      - "every DrainingAlert whose created_at falls in [LiabilityPeriod.period_start, LiabilityPeriod.period_end)"
      - "DrainingAlert.exposure_cents"
      - "every GiftCard whose activation_state IN {ACTIVE, DEPLETED}"
      - "RiskPolicy.provisional_reserve_rate_bps"
      - "RiskPolicy.final_reserve_rate_bps"
    constants:
      provisional_rate_bps_default: 3500
      final_rate_bps_default: 1000
    formula: |
      IN-PERIOD TEST (shared by both variants, HALF-OPEN):
        LiabilityPeriod.period_start <= DrainingAlert.created_at
                                      < LiabilityPeriod.period_end
      An alert created exactly at period_start belongs to this period; one
      created exactly at period_end belongs to the NEXT period. Adjacent
      periods therefore partition time with no double counting.

      VARIANT `provisional` — booked when the period is CLOSED, on the
      PRUDENT basis that every alert still under investigation might be real:
        basis alerts  = in-period alerts with state IN {OPEN, TRIAGED, CONFIRMED}
        gross_exposure_cents      = SUM(exposure_cents) over basis alerts
        reserve_basis_alert_count = COUNT(basis alerts)
        provisional_reserve_cents = round_half_up(gross_exposure_cents
                                     * RiskPolicy.provisional_reserve_rate_bps
                                     / 10000)

      VARIANT `final` — booked when the period is RESTATED, on the SETTLED
      basis that only confirmed fraud is reservable:
        basis alerts  = in-period alerts with state == CONFIRMED
        gross_exposure_cents      = SUM(exposure_cents) over basis alerts
        reserve_basis_alert_count = COUNT(basis alerts)
        final_reserve_cents       = round_half_up(gross_exposure_cents
                                     * RiskPolicy.final_reserve_rate_bps
                                     / 10000)

      The variants differ on BOTH axes at once — a WIDER alert state filter AND
      a HIGHER rate for provisional, a NARROWER filter AND a LOWER rate for
      final — so the final reserve is typically far below the provisional one
      and the two can never be derived from each other by a single scale factor.
      gross_exposure_cents and reserve_basis_alert_count are OVERWRITTEN by the
      restatement; provisional_reserve_cents is NEVER overwritten, so both
      numbers remain readable side by side after a restatement.

      OUTSTANDING LIABILITY (recomputed by both variants, alert-independent):
        outstanding_liability_cents = SUM(GiftCard.current_balance_cents
                                          over cards with activation_state
                                          IN {ACTIVE, DEPLETED})
      VOIDED and CLOSED cards are excluded because they can no longer be
      redeemed; INACTIVE cards are excluded because they were never funded.
    edge_cases:
      - "Zero in-period alerts: gross_exposure_cents 0, reserve_basis_alert_count 0, and the reserve is 0 — not null and not an error."
      - "An alert created exactly at period_end is NOT in the period; exactly at period_start it IS."
      - "A DISMISSED alert is excluded from BOTH variants, so dismissing between close and restate shrinks the basis twice over."
      - "Restating a period whose alerts are all still OPEN yields final_reserve_cents 0 while provisional_reserve_cents stays positive."
      - "Rounding is applied ONCE to the aggregated exposure, not per alert: 60011 at 3500 bps is round_half_up(21003.85) = 21004."
      - "unauthorized_writeoff_cents is NOT part of either reserve — it is maintained incrementally by claim approval and rescission and is only ever touched on the OPEN period."

  - name: alert_exposure_snapshot
    algorithm_type: aggregation
    entity: DrainingAlert
    output_fields:
      - DrainingAlert.exposure_cents
      - LawEnforcementReferral.exposure_snapshot_cents
    inputs:
      - "GiftCard(card_id).current_balance_cents at the instant the row is written"
      - "GiftCard(card_id).total_redeemed_cents at the instant the row is written"
    constants: {}
    formula: |
      DrainingAlert.exposure_cents is a FROZEN SNAPSHOT, written once at alert
      creation and never recomputed thereafter:
        exposure_cents = GiftCard.current_balance_cents
                         + GiftCard.total_redeemed_cents
      i.e. the total funds the alert puts at risk — what is still redeemable
      plus what has already been drained. Later redemptions, reversals, triage
      and resolution leave exposure_cents untouched, which is what makes
      §1.3 unauthorized_redemption_reserve reproducible after the fact.

      LawEnforcementReferral.exposure_snapshot_cents is a SECOND, INDEPENDENT
      snapshot taken at referral time:
        exposure_snapshot_cents = DrainingAlert.exposure_cents
      It is copied rather than joined so that the referral packet remains a
      standalone immutable record.
    edge_cases:
      - "A card with a zero balance that has already been fully drained still has a positive exposure_cents, because total_redeemed_cents carries the loss."
      - "A brand-new card with no ledger events yields exposure_cents 0."
      - "Reversing a redemption AFTER the alert exists does not lower exposure_cents; the snapshot is deliberately stale."

  - name: rack_tamper_classification
    algorithm_type: threshold
    entity: CardRack
    output_fields:
      - CardRack.missing_card_count
      - CardRack.tamper_state
      - CardRack.last_audit_at
    inputs:
      - CardRack.expected_card_count
      - "the audit call's observed_card_count"
      - "the audit call's seal_breaks_observed"
      - "RiskPolicy.rack_shrink_threshold"
      - "RiskPolicy.rack_seal_break_threshold"
    constants:
      shrink_threshold_default: 3
      seal_break_threshold_default: 3
    formula: |
      Evaluated by POST /card-racks/{id}/audits.

        missing_card_count = max(0, CardRack.expected_card_count
                                    - observed_card_count)
      The floor at 0 matters: finding MORE cards than expected is a stocking
      discrepancy, not shrink, and must not produce a negative count.

      Classification, evaluated STRICTLY IN THIS ORDER (first match wins):
        1. missing_card_count >= RiskPolicy.rack_shrink_threshold
           OR seal_breaks_observed >= RiskPolicy.rack_seal_break_threshold
             -> tamper_state = TAMPERED
        2. missing_card_count >= 1 OR seal_breaks_observed >= 1
             -> tamper_state = SUSPECT
        3. otherwise
             -> tamper_state = INTACT

      Either signal ALONE can reach TAMPERED — the rule is a disjunction, not a
      sum, so 3 missing cards with 0 seal breaks and 0 missing cards with 3 seal
      breaks are both TAMPERED.

      last_audit_at := the logical clock's current UTC instant.
      observed_card_count and seal_breaks_observed are persisted verbatim so the
      classification is reproducible from the stored row.

      Classification is FULLY RE-DERIVED on every audit — it is not sticky. An
      audit reporting 0 missing and 0 seal breaks pulls a SUSPECT rack back to
      INTACT. A TAMPERED rack is the one exception: it can only leave TAMPERED
      via POST /card-racks/{id}/clear-tamper, which resets observed_card_count
      to expected_card_count, seal_breaks_observed to 0 and tamper_state to
      INTACT while recording remediation_note.
    edge_cases:
      - "expected 10 / observed 7 / seal_breaks 0 -> missing 3 -> TAMPERED at exactly the threshold."
      - "expected 10 / observed 8 / seal_breaks 0 -> missing 2 -> SUSPECT (below the tamper threshold but above zero)."
      - "expected 10 / observed 12 -> missing_card_count 0, and with 0 seal breaks the rack is INTACT, never negative and never SUSPECT."
      - "expected 10 / observed 10 / seal_breaks 3 -> TAMPERED on the seal signal alone."
      - "A TAMPERED rack audited again with clean numbers stays TAMPERED until clear-tamper is called."

  - name: store_floor_posture
    algorithm_type: constraint_propagation
    entity: RetailStore
    output_fields:
      - RetailStore.tampered_rack_count
      - RetailStore.suspect_rack_count
      - RetailStore.open_alert_count
      - RetailStore.floor_posture
    inputs:
      - "every CardRack whose store_id == RetailStore.id, and its tamper_state"
      - "every DrainingAlert in state OPEN or TRIAGED whose card's store_id == RetailStore.id"
      - "RiskPolicy.floor_heightened_alert_threshold"
    constants:
      heightened_alert_threshold_default: 2
    formula: |
      FULLY DERIVED — no endpoint ever sets floor_posture directly. It is
      recomputed to a fixed point after every rack audit, every clear-tamper,
      every alert creation, triage, resolution and reopen.

        tampered_rack_count = COUNT(racks with tamper_state == TAMPERED)
        suspect_rack_count  = COUNT(racks with tamper_state == SUSPECT)
        open_alert_count    = COUNT(DrainingAlert a WHERE
                                    GiftCard(a.card_id).store_id == store.id
                                    AND a.state IN {OPEN, TRIAGED})

      Classification, first match wins:
        1. tampered_rack_count >= 1
             -> floor_posture = SUSPENDED
        2. suspect_rack_count >= 1
           OR open_alert_count >= RiskPolicy.floor_heightened_alert_threshold
             -> floor_posture = HEIGHTENED
        3. otherwise
             -> floor_posture = OPEN

      A SINGLE tampered rack suspends the whole floor; suspect racks and alert
      pressure only heighten it. Propagation is monotone in the inputs and
      terminates in one pass because the derivation reads only rack and alert
      state, never its own previous value — there is no feedback edge and hence
      no oscillation.

      Propagation is BIDIRECTIONAL over time: clearing the last tampered rack
      drops the store straight back to HEIGHTENED or OPEN, and resolving alerts
      below the threshold does the same.
    edge_cases:
      - "open_alert_count exactly equal to floor_heightened_alert_threshold heightens the floor; threshold - 1 does not."
      - "One TAMPERED rack outranks any number of alerts — the store is SUSPENDED, not HEIGHTENED."
      - "A DISMISSED alert stops counting immediately, and reopening it starts counting again."
      - "A CONFIRMED alert also stops counting toward open_alert_count (only OPEN and TRIAGED count), so confirming the last alert can RELAX the floor even though the fraud was real."
      - "A store with no racks and no alerts is OPEN."
      - "Alerts are attributed to the store via the CARD's store_id, so a card reissued with store_id preserved keeps contributing to that store."

  - name: hold_capacity_check
    algorithm_type: interval_merge
    entity: RedemptionHold
    output_fields:
      - RedemptionHold.state
      - GiftCard.held_amount_cents
      - GiftCard.available_balance_cents
    inputs:
      - "the candidate hold's amount_cents, hold_start and hold_expires_at"
      - "every existing RedemptionHold on the same card with state == ACTIVE"
      - "GiftCard.current_balance_cents"
    constants: {}
    formula: |
      Evaluated by POST /gift-cards/{id}/redemption-holds BEFORE the row is
      written.

      INTERVALS ARE CLOSED, [hold_start, hold_expires_at]. Two holds INTERSECT
      iff:
        existing.hold_start     <= candidate.hold_expires_at
        AND existing.hold_expires_at >= candidate.hold_start
      Because the intervals are closed, TOUCHING AT A SINGLE INSTANT COUNTS AS
      INTERSECTING — a hold ending at 12:00 and a hold starting at 12:00 are in
      conflict. (Contrast §1.3 liability_period_overlap, which uses HALF-OPEN
      [start, end) intervals where the same adjacency is legal.)

      AGGREGATE CAPACITY over the intersecting set, not pairwise:
        committed = SUM(amount_cents) over ACTIVE holds intersecting the
                    candidate
        reject when committed + candidate.amount_cents
                     > GiftCard.current_balance_cents
                  -> ERR_HOLD_CAPACITY_EXCEEDED (§1.4 p76)

      The comparison is STRICT `>`, so a candidate that exactly exhausts the
      balance is ACCEPTED and drives available_balance_cents to exactly 0.

      The candidate is compared against the UNION of everything it touches, so a
      short hold that bridges two otherwise-disjoint holds must fit under the
      SUM of both — pairwise checks would wrongly accept it.

      Only ACTIVE holds are capacity-bearing. RELEASED, CAPTURED and EXPIRED
      holds free their capacity immediately, which is why advancing the logical
      clock past a hold's expiry can turn a rejection into an acceptance with no
      other change.
    edge_cases:
      - "A candidate on a card with no other holds only has to fit under current_balance_cents."
      - "committed + candidate exactly equal to current_balance_cents is ACCEPTED (strict >); one cent more is rejected."
      - "A candidate whose interval touches an existing hold at exactly one instant DOES intersect it, because the intervals are closed."
      - "A bridging hold intersecting two disjoint holds must fit under the sum of BOTH, even though it overlaps neither's neighbour."
      - "Sweeping a hold to EXPIRED via the clock endpoint releases its capacity, so the same rejected candidate then succeeds."
      - "A CAPTURED hold has already turned into a REDEMPTION, so its capacity is reflected in current_balance_cents instead of held_amount_cents — no double counting."

  - name: liability_period_overlap
    algorithm_type: interval_merge
    entity: LiabilityPeriod
    output_fields:
      - LiabilityPeriod.state
    inputs:
      - "the candidate period's period_start and period_end"
      - "every existing LiabilityPeriod in any state"
    constants: {}
    formula: |
      Evaluated by POST /liability-periods before the row is written.

      INTERVALS ARE HALF-OPEN, [period_start, period_end). Two periods OVERLAP
      iff:
        candidate.period_start < existing.period_end
        AND existing.period_start < candidate.period_end
      Both comparisons are STRICT, so ADJACENCY IS LEGAL: a period ending at
      2026-09-01T00:00:00Z and a period starting at 2026-09-01T00:00:00Z do not
      overlap and both may exist. This is the deliberate opposite of §1.3
      hold_capacity_check, whose CLOSED intervals treat the same instant as a
      conflict.

      Any overlap -> ERR_PERIOD_OVERLAP (§1.4 p70). Periods in EVERY state
      participate in the check — closing or restating a period does not free its
      calendar span.

      Well-formedness (checked first, as §1.4 p25 ERR_INVALID_REQUEST):
        period_end must be strictly after period_start.
    edge_cases:
      - "Exact adjacency (candidate.period_start == existing.period_end) is accepted."
      - "A candidate fully containing an existing period overlaps and is rejected."
      - "A candidate fully contained inside an existing period overlaps and is rejected."
      - "A one-instant overlap (candidate.period_start one microsecond before existing.period_end) is rejected."
      - "period_end == period_start is ERR_INVALID_REQUEST, not ERR_PERIOD_OVERLAP, because well-formedness is checked at a lower priority number."
      - "A CLOSED or RESTATED period still blocks its span."

  - name: listing_validation_decision
    algorithm_type: threshold
    entity: ResellerListing
    output_fields:
      - ResellerListing.state
      - ResellerListing.block_reason
    inputs:
      - "GiftCard(card_id).activation_state"
      - "GiftCard(card_id).risk_posture"
      - "GiftCard(card_id).current_balance_cents"
      - "GiftCard(card_id).drain_risk_score_inquiry"
      - ResellerListing.listed_balance_cents
      - "RiskPolicy.drain_restrict_score_threshold"
    constants:
      restrict_threshold_default: 70
    formula: |
      Evaluated by POST /reseller-listings/{id}/validate. The four checks are
      applied IN THIS FIXED ORDER and the FIRST match decides; a listing failing
      several checks reports only the first reason.

        1. GiftCard.activation_state != ACTIVE
             -> state REJECTED, block_reason CARD_NOT_ACTIVE
        2. GiftCard.risk_posture IN {RESTRICTED, FROZEN}
             -> state BLOCKED,  block_reason CARD_RISK_POSTURE
        3. ResellerListing.listed_balance_cents
             != GiftCard.current_balance_cents
             -> state REJECTED, block_reason BALANCE_MISMATCH
        4. GiftCard.drain_risk_score_inquiry
             >= RiskPolicy.drain_restrict_score_threshold
             -> state BLOCKED,  block_reason DRAIN_SCORE
        5. otherwise
             -> state VALIDATED, block_reason stays null

      REJECTED means "the listing is wrong about the card"; BLOCKED means "the
      card itself is not safe to resell". The distinction is why the ordering
      matters: a FROZEN card with a stale balance reports CARD_RISK_POSTURE
      (check 2) rather than BALANCE_MISMATCH (check 3).

      A posture of CLEAR or WATCH passes check 2, so a WATCH card with a
      matching balance and a sub-threshold score is VALIDATED — WATCH is
      informational, not blocking.

      All five outcomes are terminal except VALIDATED, which the
      alert-confirmation cascade can later drive to BLOCKED with block_reason
      CARD_RISK_POSTURE.
    edge_cases:
      - "drain_risk_score_inquiry exactly equal to drain_restrict_score_threshold BLOCKS (>=); one point below VALIDATES."
      - "A DEPLETED card with listed_balance_cents 0 still REJECTS on CARD_NOT_ACTIVE, because check 1 precedes the balance check."
      - "A card whose balance changed by one cent since listing REJECTS on BALANCE_MISMATCH — the equality is exact, with no tolerance."
      - "A RESTRICTED card BLOCKS even when its inquiry score is below the threshold, because posture is checked before the score."
      - "A VALIDATED listing is not re-validated automatically when the balance later changes; only a posture escalation to FROZEN cascades."

  - name: net_funded_liability_invariant
    algorithm_type: aggregation
    entity: LiabilityPeriod
    output_fields: []
    inputs:
      - "every GiftCard with activation_state IN {ACTIVE, DEPLETED} and its current_balance_cents"
      - "the OPEN LiabilityPeriod's unauthorized_writeoff_cents"
    constants: {}
    formula: |
      A READ-ONLY CONSERVED QUANTITY, exposed by
      GET /liability-periods/{id}/exposure-summary as
      `net_funded_liability_cents`. It is never stored on any entity.

        net_funded_liability_cents =
            SUM(GiftCard.current_balance_cents over cards whose
                activation_state IN {ACTIVE, DEPLETED})
          - LiabilityPeriod.unauthorized_writeoff_cents

      INVARIANT: every compensating pair leaves this number unchanged.
        * A REDEMPTION followed by its REDEMPTION_REVERSAL restores the card's
          balance exactly, so the sum returns to its prior value and the writeoff
          term is untouched.
        * A claim APPROVAL moves residual_transfer_cents from the original card
          to the replacement card (net zero on the sum), ADDS
          reissue_amount_cents to the replacement card, and ADDS the same
          reissue_amount_cents to unauthorized_writeoff_cents — the two additions
          cancel in the difference.
        * The matching RESCIND reverses both legs, restoring the pre-approval
          value.
      Any drift in either leg is therefore detectable as a change in a single
      scalar, independently of §1.3 unauthorized_redemption_reserve (which
      conserves nothing and is a pure function of alert exposure).
    edge_cases:
      - "With no cards and no periods the summary reports 0."
      - "A VOIDED replacement card contributes 0 because VOIDED is outside {ACTIVE, DEPLETED}."
      - "An INACTIVE card contributes 0 even though it has a face value, because it was never funded."
      - "A DEPLETED card contributes 0 to the sum but is still counted as funded — its balance is genuinely zero, not excluded."

# ----------------------------------------------------------------------------
# §1.4 Validations  (evaluated in ascending `priority`; first violation wins)
# ----------------------------------------------------------------------------
validations:

  - priority: 10
    category: auth
    rule: "The X-User-ID request header is present and non-empty on every endpoint."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "every endpoint"

  - priority: 20
    category: auth
    rule: "The role resolved from X-User-ID appears in the target endpoint's declared `roles` list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "every endpoint"

  - priority: 22
    category: auth
    rule: "A StoreManager may only act on resources belonging to their own store: the effective store_id of the target (RetailStore.id, CardRack.store_id, GiftCard.store_id, IssuanceRequest.store_id or BulkPurchaseOrder.store_id) must equal the X-User-ID. When the target's effective store_id is null the StoreManager is denied."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "every endpoint whose target resolves to a store, when the caller's role is StoreManager"

  - priority: 25
    category: business_constraint
    rule: "The request body is well-formed: every field declared `required` in the endpoint's `input` is present and non-null; every enum field carries a declared value; every integer amount field (amount_cents, face_value_cents, face_value_cents_each, disputed_amount_cents, asking_price_cents, listed_balance_cents) is >= 1 except listed_balance_cents which is >= 0; card_quantity >= 1; expected_card_count >= 0; observed_card_count >= 0; seal_breaks_observed >= 0; device_reputation_score in 0..100; email_age_days >= 0; limit in 1..100; offset >= 0; every datetime parses as ISO-8601 UTC; hold_expires_at > hold_start; period_end > period_start; card_number_masked matches its declared pattern; missing_evidence_kinds contains only PURCHASE_RECEIPT or PACKAGING_PHOTO."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every endpoint that accepts a body or query parameters"

  - priority: 30
    category: existence
    rule: "Every referenced RetailStore id (path {id}, store_id, merchant_store_id) resolves to an existing RetailStore."
    error_id: ERR_STORE_NOT_FOUND
    http_status: 404
    applies_to: "GET /stores/{id}, POST /card-racks, POST /gift-cards, POST /issuance-requests, POST /bulk-purchase-orders, POST /gift-cards/{id}/redemptions, POST /redemption-holds/{id}/settle"

  - priority: 31
    category: existence
    rule: "Every referenced CardRack id (path {id} or rack_id) resolves to an existing CardRack."
    error_id: ERR_RACK_NOT_FOUND
    http_status: 404
    applies_to: "GET /card-racks/{id}, POST /card-racks/{id}/audits, POST /card-racks/{id}/clear-tamper, POST /gift-cards, POST /issuance-requests"

  - priority: 32
    category: existence
    rule: "Every referenced GiftCard id (path {id}, card_id or reissued_from_card_id) resolves to an existing GiftCard."
    error_id: ERR_CARD_NOT_FOUND
    http_status: 404
    applies_to: "GET /gift-cards/{id}, POST /gift-cards/{id}/balance-inquiries, GET /gift-cards/{id}/balance-inquiries, POST /gift-cards/{id}/redemptions, POST /gift-cards/{id}/redemption-holds, GET /gift-cards/{id}/redemption-holds, GET /gift-cards/{id}/reseller-listings, POST /gift-cards/{id}/posture, POST /issuance-requests, POST /draining-alerts, POST /victim-claims, POST /reseller-listings"

  - priority: 33
    category: existence
    rule: "The IssuanceRequest named by the path {id} exists."
    error_id: ERR_ISSUANCE_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "GET /issuance-requests/{id}, POST /issuance-requests/{id}/screen, POST /issuance-requests/{id}/decide"

  - priority: 34
    category: existence
    rule: "Every referenced BulkPurchaseOrder id (path {id} or bulk_order_id) resolves to an existing BulkPurchaseOrder."
    error_id: ERR_BULK_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "GET /bulk-purchase-orders/{id}, POST /bulk-purchase-orders/{id}/identity-verification, POST /bulk-purchase-orders/{id}/decide, POST /issuance-requests"

  - priority: 35
    category: existence
    rule: "Every referenced DrainingAlert id (path {id} or alert_id) resolves to an existing DrainingAlert."
    error_id: ERR_ALERT_NOT_FOUND
    http_status: 404
    applies_to: "GET /draining-alerts/{id}, POST /draining-alerts/{id}/triage, POST /draining-alerts/{id}/resolve, POST /draining-alerts/{id}/reopen, GET /draining-alerts/{id}/referrals, POST /law-enforcement-referrals, POST /victim-claims"

  - priority: 36
    category: existence
    rule: "The VictimClaim named by the path {id} exists."
    error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "GET /victim-claims/{id}, POST /victim-claims/{id}/request-evidence, POST /victim-claims/{id}/resubmit-evidence, POST /victim-claims/{id}/decide, POST /victim-claims/{id}/rescind"

  - priority: 37
    category: existence
    rule: "The ResellerListing named by the path {id} exists."
    error_id: ERR_LISTING_NOT_FOUND
    http_status: 404
    applies_to: "POST /reseller-listings/{id}/validate"

  - priority: 38
    category: existence
    rule: "The LiabilityPeriod named by the path {id} exists."
    error_id: ERR_PERIOD_NOT_FOUND
    http_status: 404
    applies_to: "GET /liability-periods/{id}, POST /liability-periods/{id}/close, POST /liability-periods/{id}/restate, GET /liability-periods/{id}/exposure-summary"

  - priority: 39
    category: existence
    rule: "Every referenced LedgerEvent id (path {id} or reverses_event_id) resolves to an existing LedgerEvent on the same card."
    error_id: ERR_LEDGER_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /ledger-events/{id}, POST /ledger-events/{id}/reverse"

  - priority: 40
    category: existence
    rule: "The RedemptionHold named by the path {id} exists."
    error_id: ERR_HOLD_NOT_FOUND
    http_status: 404
    applies_to: "POST /redemption-holds/{id}/settle"

  - priority: 41
    category: state
    rule: "expected_gift_card_version equals the current GiftCard.version (§1.2.1 hold-create-stale-card)."
    error_id: ERR_STALE_CARD_VERSION
    http_status: 412
    applies_to: "POST /gift-cards/{id}/redemption-holds"

  - priority: 42
    category: state
    rule: "expected_liability_period_version equals the current LiabilityPeriod.version (§1.2.1 period-restate-stale-period)."
    error_id: ERR_STALE_PERIOD_VERSION
    http_status: 412
    applies_to: "POST /liability-periods/{id}/restate"

  - priority: 45
    category: state
    rule: "The target GiftCard's activation_state is ACTIVE."
    error_id: ERR_CARD_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /gift-cards/{id}/redemptions, POST /gift-cards/{id}/redemption-holds, POST /redemption-holds/{id}/settle with disposition CAPTURE"

  - priority: 46
    category: state
    rule: "The target GiftCard's risk_posture is not FROZEN. Deliberately NOT applied to POST /ledger-events/{id}/reverse, so a frozen card's fraudulent redemptions can still be unwound."
    error_id: ERR_CARD_FROZEN
    http_status: 409
    applies_to: "POST /gift-cards/{id}/redemptions, POST /gift-cards/{id}/redemption-holds, POST /redemption-holds/{id}/settle with disposition CAPTURE"

  - priority: 47
    category: state
    rule: "The IssuanceRequest is in a state that admits the requested transition: SUBMITTED for screen; SUBMITTED or HELD_FOR_REVIEW for decide."
    error_id: ERR_INVALID_ISSUANCE_STATE
    http_status: 409
    applies_to: "POST /issuance-requests/{id}/screen, POST /issuance-requests/{id}/decide"

  - priority: 48
    category: state
    rule: "The BulkPurchaseOrder is in a state that admits the requested transition: PENDING_IDENTITY for identity-verification; PENDING_IDENTITY or IDENTITY_VERIFIED for decide; IDENTITY_VERIFIED only for the REQUEST_INFO decision."
    error_id: ERR_INVALID_BULK_ORDER_STATE
    http_status: 409
    applies_to: "POST /bulk-purchase-orders/{id}/identity-verification, POST /bulk-purchase-orders/{id}/decide"

  - priority: 49
    category: state
    rule: "The DrainingAlert is in a state that admits the requested transition: OPEN for triage; TRIAGED for resolve; DISMISSED for reopen."
    error_id: ERR_INVALID_ALERT_STATE
    http_status: 409
    applies_to: "POST /draining-alerts/{id}/triage, POST /draining-alerts/{id}/resolve, POST /draining-alerts/{id}/reopen"

  - priority: 50
    category: state
    rule: "The VictimClaim is in a state that admits the requested transition: SUBMITTED for request-evidence and decide; EVIDENCE_REQUESTED for resubmit-evidence; APPROVED for rescind."
    error_id: ERR_INVALID_CLAIM_STATE
    http_status: 409
    applies_to: "POST /victim-claims/{id}/request-evidence, POST /victim-claims/{id}/resubmit-evidence, POST /victim-claims/{id}/decide, POST /victim-claims/{id}/rescind"

  - priority: 51
    category: state
    rule: "The ResellerListing is in state SUBMITTED."
    error_id: ERR_INVALID_LISTING_STATE
    http_status: 409
    applies_to: "POST /reseller-listings/{id}/validate"

  - priority: 52
    category: state
    rule: "The LiabilityPeriod is in a state that admits the requested transition: OPEN for close; CLOSED or RESTATED for restate."
    error_id: ERR_INVALID_PERIOD_STATE
    http_status: 409
    applies_to: "POST /liability-periods/{id}/close, POST /liability-periods/{id}/restate"

  - priority: 53
    category: state
    rule: "The RedemptionHold is in state ACTIVE."
    error_id: ERR_INVALID_HOLD_STATE
    http_status: 409
    applies_to: "POST /redemption-holds/{id}/settle"

  - priority: 54
    category: state
    rule: "The LedgerEvent being reversed is itself a reversible kind (REDEMPTION) and no LedgerEvent already exists whose reverses_event_id points at it."
    error_id: ERR_LEDGER_EVENT_ALREADY_REVERSED
    http_status: 409
    applies_to: "POST /ledger-events/{id}/reverse"

  - priority: 55
    category: business_safety
    rule: "A PHYSICAL IssuanceRequest declares packaging_seal_intact == true. Tamper-evident packaging that has already been opened cannot be activated at the point of sale."
    error_id: ERR_PACKAGING_SEAL_BROKEN
    http_status: 422
    applies_to: "POST /issuance-requests (channel PHYSICAL), POST /issuance-requests/{id}/screen"

  - priority: 56
    category: business_safety
    rule: "The CardRack backing a PHYSICAL issuance has tamper_state == INTACT. A SUSPECT or TAMPERED rack cannot dispense activations."
    error_id: ERR_RACK_TAMPERED
    http_status: 422
    applies_to: "POST /issuance-requests (channel PHYSICAL), POST /issuance-requests/{id}/screen, POST /gift-cards"

  - priority: 57
    category: business_safety
    rule: "The RetailStore whose floor is involved has floor_posture != SUSPENDED. A suspended floor stops new issuance, bulk approvals and card redemptions at that store."
    error_id: ERR_STORE_FLOOR_SUSPENDED
    http_status: 422
    applies_to: "POST /issuance-requests, POST /issuance-requests/{id}/screen, POST /bulk-purchase-orders/{id}/decide with decision APPROVE, POST /gift-cards/{id}/redemptions"

  - priority: 58
    category: business_safety
    rule: "Segregation of duties: the X-User-ID resolving an alert must differ from DrainingAlert.triaged_by_user_id, and the X-User-ID deciding a claim must differ from VictimClaim.intake_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /draining-alerts/{id}/resolve, POST /victim-claims/{id}/decide"

  - priority: 60
    category: business_referential
    rule: "A BulkPurchaseOrder whose total_cents >= RiskPolicy.bulk_identity_threshold_cents carries a non-null identity_id_number_hash before it may be APPROVED."
    error_id: ERR_IDENTITY_VERIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /bulk-purchase-orders/{id}/decide with decision APPROVE"

  - priority: 61
    category: business_referential
    rule: "Claim evidence is complete for the card's channel: purchase_receipt_ref is non-null for every claim, and packaging_photo_ref is additionally non-null when GiftCard(card_id).channel == PHYSICAL. A DIGITAL card has no packaging, so only the receipt is required."
    error_id: ERR_EVIDENCE_INCOMPLETE
    http_status: 422
    applies_to: "POST /victim-claims/{id}/decide with decision APPROVE"

  - priority: 62
    category: business_referential
    rule: "A law-enforcement referral may only be filed against a DrainingAlert in state CONFIRMED."
    error_id: ERR_ALERT_NOT_CONFIRMED
    http_status: 422
    applies_to: "POST /law-enforcement-referrals"

  - priority: 65
    category: business_temporal
    rule: "The claim is inside its filing window: (logical now - VictimClaim.purchased_at) <= RiskPolicy.claim_window_days. Exactly on the boundary is accepted."
    error_id: ERR_CLAIM_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /victim-claims"

  - priority: 68
    category: business_constraint
    rule: "card_quantity <= RiskPolicy.bulk_quantity_limit. Exactly at the limit is accepted."
    error_id: ERR_BULK_QUANTITY_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /bulk-purchase-orders"

  - priority: 69
    category: business_constraint
    rule: "VictimClaim.evidence_round < RiskPolicy.claim_evidence_round_limit before a further evidence request is issued."
    error_id: ERR_EVIDENCE_ROUND_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /victim-claims/{id}/request-evidence"

  - priority: 70
    category: business_constraint
    rule: "The candidate LiabilityPeriod does not overlap any existing period under the HALF-OPEN rule of §1.3 liability_period_overlap."
    error_id: ERR_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /liability-periods"

  - priority: 71
    category: business_constraint
    rule: "No ResellerListing in state SUBMITTED or VALIDATED already exists for the same (card_id, marketplace_name) pair."
    error_id: ERR_DUPLICATE_LISTING
    http_status: 409
    applies_to: "POST /reseller-listings"

  - priority: 75
    category: business_fiscal
    rule: "A redemption may not exceed the card's spendable funds: amount_cents <= GiftCard.available_balance_cents."
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 422
    applies_to: "POST /gift-cards/{id}/redemptions"

  - priority: 76
    category: business_fiscal
    rule: "The candidate hold fits the aggregate capacity of every ACTIVE hold it intersects, per §1.3 hold_capacity_check."
    error_id: ERR_HOLD_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /gift-cards/{id}/redemption-holds"

  - priority: 77
    category: business_fiscal
    rule: "gross_reissue_cents <= RiskPolicy.reissue_cap_cents, per §1.3 claim_reissue_amount."
    error_id: ERR_REISSUE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /victim-claims/{id}/decide with decision APPROVE"

# ----------------------------------------------------------------------------
# §1.5 Endpoints
#
# `api_prefix` is "/" — every path below is absolute and complete.
# Every path template uses `{id}` for its own resource id.
# List endpoints declare `limit?` / `offset?` and every supported filter in
# `input:`; they return `<Entity>[]` alongside `total_count` / `has_more` in the
# §1.0 envelope's `meta` block.
# ----------------------------------------------------------------------------
endpoints:

  # ---- Configuration & logical clock --------------------------------------
  - method: GET
    path: /risk-policy
    purpose: Read the singleton risk-policy row that supplies every threshold and rate constant used by §1.3.
    roles: [StoreManager, PosAssociate, FraudAnalyst, RiskManager, LiabilityAccountant, ResellerPartner, PlatformAdmin]
    input: []
    output: RiskPolicy
    side_effects: []
    notes: |
      The row is seeded at process start with every §1.1 default, so this GET
      never 404s.

  - method: PUT
    path: /risk-policy
    purpose: Partially update the singleton risk policy so a test can move a threshold without rebuilding fixtures.
    roles: [PlatformAdmin]
    input:
      - inquiry_velocity_window_minutes?
      - inquiry_velocity_threshold?
      - redemption_window_minutes?
      - drain_watch_score_threshold?
      - drain_restrict_score_threshold?
      - digital_hold_score_threshold?
      - digital_decline_score_threshold?
      - bulk_identity_threshold_cents?
      - bulk_quantity_limit?
      - rack_shrink_threshold?
      - rack_seal_break_threshold?
      - floor_heightened_alert_threshold?
      - claim_window_days?
      - claim_evidence_round_limit?
      - reissue_cap_cents?
      - recovery_factor_bps?
      - provisional_reserve_rate_bps?
      - final_reserve_rate_bps?
    output: RiskPolicy
    side_effects:
      - "overwrites only the supplied keys; omitted keys keep their current values"
      - "increments RiskPolicy.version by 1"
      - "does NOT retroactively recompute any already-persisted score, fee or reserve — stored numbers stay on the constants that produced them"

  - method: POST
    path: /_clock/set_current_utc
    purpose: Test-driving endpoint that advances the deterministic logical clock, which is what makes every window, expiry and window-ageing rule in §1.3 reproducible.
    roles: [PlatformAdmin]
    input:
      - to_iso8601
    output:
      current_utc: string
      expired_hold_count: integer
    side_effects:
      - "sets the logical clock to `to_iso8601`; every subsequent created_at, updated_at, occurred_at, screened_at, closed_at and restated_at is read from it"
      - "sweeps every RedemptionHold in state ACTIVE whose hold_expires_at < the new clock value to EXPIRED, in (hold_expires_at ASC, created_at ASC) order, and returns how many were swept as expired_hold_count"
      - "recomputes held_amount_cents and available_balance_cents on every affected GiftCard and increments each swept hold's and each affected card's version by 1"
    notes: |
      The logical clock DEFAULTS to 2026-08-01T00:00:00Z at process start, so a
      test that never calls this endpoint still sees a fixed, reproducible now.
      Moving the clock BACKWARDS is allowed and performs no sweep.

  # ---- RetailStore ---------------------------------------------------------
  - method: POST
    path: /stores
    purpose: Register a retail store whose floor posture gates issuance, bulk approval and redemption.
    roles: [PlatformAdmin]
    input:
      - name
      - region_code
      - address_line
    output: RetailStore
    side_effects:
      - "creates the RetailStore with floor_posture OPEN and every derived counter at 0"

  - method: GET
    path: /stores
    purpose: List stores, filtered by region or current floor posture.
    roles: [StoreManager, PosAssociate, FraudAnalyst, RiskManager, LiabilityAccountant, ResellerPartner, PlatformAdmin]
    input:
      - region_code?
      - floor_posture?
      - limit?
      - offset?
    output: RetailStore[]
    side_effects: []
    notes: "Default order created_at ASC. `id` is never an ordering key."

  - method: GET
    path: /stores/{id}
    purpose: Read one store with its derived rack and alert counters and its current floor posture.
    roles: [StoreManager, PosAssociate, FraudAnalyst, RiskManager, LiabilityAccountant, ResellerPartner, PlatformAdmin]
    input: []
    output: RetailStore
    side_effects: []

  # ---- CardRack ------------------------------------------------------------
  - method: POST
    path: /card-racks
    purpose: Register a physical gift-card rack with its expected card count, the baseline against which shrink is measured.
    roles: [StoreManager, PlatformAdmin]
    input:
      - store_id
      - rack_label
      - expected_card_count
    output: CardRack
    side_effects:
      - "creates the CardRack with tamper_state INTACT, missing_card_count 0, seal_breaks_observed 0, observed_card_count null and last_audit_at null"
      - "recomputes RetailStore(store_id).floor_posture (an INTACT rack cannot change it) and increments RetailStore.version by 1"

  - method: GET
    path: /card-racks
    purpose: List racks, filtered by store or tamper state — the reverse lookup for CardRack.store_id.
    roles: [StoreManager, PosAssociate, FraudAnalyst, RiskManager, LiabilityAccountant, ResellerPartner, PlatformAdmin]
    input:
      - store_id?
      - tamper_state?
      - limit?
      - offset?
    output: CardRack[]
    side_effects: []

  - method: GET
    path: /card-racks/{id}
    purpose: Read one rack with its latest audit numbers and tamper classification.
    roles: [StoreManager, PosAssociate, FraudAnalyst, RiskManager, LiabilityAccountant, ResellerPartner, PlatformAdmin]
    input: []
    output: CardRack
    side_effects: []

  - method: POST
    path: /card-racks/{id}/audits
    purpose: Record a rack-monitoring audit — the entry point for the three-hop tamper cascade.
    roles: [StoreManager, PosAssociate]
    input:
      - observed_card_count
      - seal_breaks_observed
    output: CardRack
    side_effects:
      - "persists observed_card_count and seal_breaks_observed, sets last_audit_at to the logical now, and reclassifies tamper_state per §1.3 rack_tamper_classification"
      - "HOP 2: recomputes RetailStore(store_id).tampered_rack_count, suspect_rack_count and floor_posture per §1.3 store_floor_posture"
      - "HOP 3: when the rack became TAMPERED, every GiftCard with rack_id == this rack and activation_state == INACTIVE transitions to VOIDED and its risk_posture is forced to FROZEN, processed in created_at ASC order; ACTIVE, DEPLETED and CLOSED cards are left untouched"
      - "increments CardRack.version, RetailStore.version and every voided GiftCard's version by 1"
    notes: |
      Auditing is idempotent in effect but not in bookkeeping: re-auditing with
      the same numbers reclassifies to the same state and still bumps version.

  - method: POST
    path: /card-racks/{id}/clear-tamper
    purpose: Remediate a tampered or suspect rack so the store floor can reopen.
    roles: [StoreManager, RiskManager]
    input:
      - remediation_note
    output: CardRack
    side_effects:
      - "sets observed_card_count := expected_card_count, seal_breaks_observed := 0, missing_card_count := 0, tamper_state := INTACT and records remediation_note"
      - "recomputes RetailStore(store_id).tampered_rack_count, suspect_rack_count and floor_posture — the store falls back to HEIGHTENED or OPEN once no tampered rack remains"
      - "does NOT un-void any GiftCard the tamper cascade already voided"
      - "increments CardRack.version and RetailStore.version by 1"

  # ---- GiftCard ------------------------------------------------------------
  - method: POST
    path: /gift-cards
    purpose: Stock a PHYSICAL gift card on a rack. The card is created INACTIVE with a zero balance; activation happens only through an approved IssuanceRequest.
    roles: [PosAssociate, StoreManager]
    input:
      - store_id
      - rack_id
      - card_number_masked?
    output: GiftCard
    side_effects:
      - "creates the GiftCard with channel PHYSICAL, activation_state INACTIVE, risk_posture CLEAR, face_value_cents 0 and every balance field 0"
      - "rejects the call with ERR_RACK_TAMPERED when the rack is not INTACT — a compromised rack may not be restocked"
    notes: |
      DIGITAL cards are never created here; they are minted by the server when a
      DIGITAL IssuanceRequest is approved.

  - method: GET
    path: /gift-cards
    purpose: List cards with the filters that serve as reverse lookups for GiftCard.store_id, GiftCard.rack_id and GiftCard.reissued_from_card_id.
    roles: [StoreManager, PosAssociate, FraudAnalyst, RiskManager, LiabilityAccountant, ResellerPartner, PlatformAdmin]
    input:
      - store_id?
      - rack_id?
      - reissued_from_card_id?
      - activation_state?
      - risk_posture?
      - channel?
      - limit?
      - offset?
    output: GiftCard[]
    side_effects: []

  - method: GET
    path: /gift-cards/{id}
    purpose: Read one card with its fully re-derived balance projection, drawdown ratio, both drain scores and both state dimensions.
    roles: [StoreManager, PosAssociate, FraudAnalyst, RiskManager, LiabilityAccountant, ResellerPartner, PlatformAdmin]
    input: []
    output: GiftCard
    side_effects: []

  - method: POST
    path: /gift-cards/{id}/balance-inquiries
    purpose: Record a balance inquiry — the velocity signal that card-draining detection is built on.
    roles: [PosAssociate, FraudAnalyst, ResellerPartner]
    input:
      - channel
      - requester_ip_hash
    output: BalanceInquiry
    side_effects:
      - "appends the BalanceInquiry with occurred_at := logical now and balance_disclosed_cents := GiftCard.current_balance_cents"
      - "recomputes velocity_count_at_inquiry per §1.3 inquiry_velocity_count (the new row counts itself) and stores it on the inquiry"
      - "recomputes GiftCard.drain_risk_score_inquiry per §1.3 card_drain_risk_score variant inquiry_weighted and copies it to drain_score_at_inquiry"
      - "auto-creates a DrainingAlert{detection_basis: INQUIRY_VELOCITY, state: OPEN} on velocity breach, but only when no OPEN or TRIAGED INQUIRY_VELOCITY alert already exists on the card"
      - "escalates GiftCard.risk_posture upward only, per the §1.3 card_drain_risk_score posture ladder"
      - "recomputes RetailStore(card.store_id).open_alert_count and floor_posture when an alert was created"
      - "increments GiftCard.version by 1, and RetailStore.version by 1 when the store was touched"
    notes: |
      Permitted on cards in ANY activation_state and ANY risk_posture — a frozen
      card's balance may still be probed, and probing it is exactly how the
      velocity evidence accumulates.

  - method: GET
    path: /gift-cards/{id}/balance-inquiries
    purpose: Reverse lookup for BalanceInquiry.card_id — the audit trail of every probe against one card.
    roles: [StoreManager, FraudAnalyst, RiskManager, PlatformAdmin]
    input:
      - channel?
      - limit?
      - offset?
    output: BalanceInquiry[]
    side_effects: []
    notes: "Ordered occurred_at ASC, created_at ASC."

  - method: POST
    path: /gift-cards/{id}/redemptions
    purpose: Redeem value at the point of sale by appending a REDEMPTION event to the card's ledger.
    roles: [PosAssociate]
    input:
      - amount_cents
      - merchant_store_id
      - pos_terminal_id?
      - memo?
    output: LedgerEvent
    side_effects:
      - "appends LedgerEvent{type: REDEMPTION, signed_amount_cents: -amount_cents, occurred_at: logical now}"
      - "re-derives every GiftCard balance and pattern field per §1.3 card_balance_projection"
      - "transitions GiftCard ACTIVE -> DEPLETED when the re-derived current_balance_cents reaches 0"
      - "increments GiftCard.version by 1"
    notes: |
      Blocked by ERR_CARD_NOT_ACTIVE (p45), ERR_CARD_FROZEN (p46),
      ERR_STORE_FLOOR_SUSPENDED (p57) and ERR_INSUFFICIENT_BALANCE (p75), in
      that priority order.

  - method: POST
    path: /gift-cards/{id}/redemption-holds
    purpose: Reserve part of a card's balance for a pending authorization, under the OCC rule of §1.2.1 hold-create-stale-card.
    roles: [PosAssociate, RiskManager]
    input:
      - amount_cents
      - hold_start
      - hold_expires_at
      - expected_gift_card_version
    output: RedemptionHold
    side_effects:
      - "rejects with ERR_STALE_CARD_VERSION (412) when expected_gift_card_version != GiftCard.version"
      - "rejects with ERR_HOLD_CAPACITY_EXCEEDED (422) when the candidate fails the aggregate closed-interval capacity test of §1.3 hold_capacity_check"
      - "creates the RedemptionHold in state ACTIVE with captured_amount_cents 0"
      - "recomputes GiftCard.held_amount_cents and available_balance_cents; current_balance_cents is NOT changed"
      - "increments GiftCard.version by 1"

  - method: GET
    path: /gift-cards/{id}/redemption-holds
    purpose: Reverse lookup for RedemptionHold.card_id — every hold competing for one card's balance.
    roles: [StoreManager, PosAssociate, FraudAnalyst, RiskManager, LiabilityAccountant, ResellerPartner, PlatformAdmin]
    input:
      - state?
      - limit?
      - offset?
    output: RedemptionHold[]
    side_effects: []
    notes: "Ordered hold_start ASC, created_at ASC."

  - method: GET
    path: /gift-cards/{id}/reseller-listings
    purpose: Reverse lookup for ResellerListing.card_id — every secondary-marketplace listing of one card.
    roles: [FraudAnalyst, RiskManager, ResellerPartner, PlatformAdmin]
    input:
      - state?
      - limit?
      - offset?
    output: ResellerListing[]
    side_effects: []

  - method: POST
    path: /gift-cards/{id}/posture
    purpose: Manual risk-posture override — the only way to LOWER a posture, and a second trigger for the FROZEN listing cascade.
    roles: [RiskManager]
    input:
      - risk_posture
      - reason
    output: GiftCard
    side_effects:
      - "sets GiftCard.risk_posture to the supplied value, upward OR downward — the monotone escalation rule of §1.3 does not constrain a manual override"
      - "when the new posture is FROZEN, every ResellerListing on the card in state VALIDATED transitions to BLOCKED with block_reason CARD_RISK_POSTURE, in created_at ASC order"
      - "leaves activation_state and every balance field untouched, proving the two dimensions are independent"
      - "increments GiftCard.version by 1 and each affected ResellerListing.version by 1"

  # ---- RedemptionHold ------------------------------------------------------
  - method: GET
    path: /redemption-holds/{id}
    purpose: Read one hold with its state, interval and settlement disposition.
    roles: [StoreManager, PosAssociate, FraudAnalyst, RiskManager, LiabilityAccountant, ResellerPartner, PlatformAdmin]
    input: []
    output: RedemptionHold
    side_effects: []

  - method: POST
    path: /redemption-holds/{id}/settle
    purpose: Settle an active hold, either releasing the reservation or capturing it into a real redemption.
    roles: [PosAssociate, RiskManager]
    input:
      - disposition
      - merchant_store_id?
      - settle_note?
    output: RedemptionHold
    side_effects:
      - "disposition RELEASE: state -> RELEASED, captured_amount_cents stays 0, no LedgerEvent is appended"
      - "disposition CAPTURE: state -> CAPTURED, captured_amount_cents := amount_cents, and LedgerEvent{type: REDEMPTION, amount_cents: the hold's amount_cents, merchant_store_id: the supplied store} is appended"
      - "recomputes GiftCard.held_amount_cents, available_balance_cents and — for CAPTURE — every balance and pattern field per §1.3 card_balance_projection"
      - "increments RedemptionHold.version and GiftCard.version by 1"
    notes: |
      merchant_store_id is required in practice for CAPTURE and ignored for
      RELEASE; it is declared optional so a RELEASE need not supply it.

  # ---- IssuanceRequest ----------------------------------------------------
  - method: POST
    path: /issuance-requests
    purpose: Open an issuance request — PHYSICAL for point-of-sale activation of a racked card, DIGITAL for e-commerce issuance screened on device, email and payment signals.
    roles: [PosAssociate]
    input:
      - channel
      - face_value_cents
      - store_id?
      - rack_id?
      - card_id?
      - bulk_order_id?
      - pos_terminal_id?
      - packaging_seal_intact?
      - device_reputation_score?
      - email_age_days?
      - payment_risk_band?
      - recipient_email_hash?
    output: IssuanceRequest
    side_effects:
      - "creates the IssuanceRequest in state SUBMITTED with screening_score, screening_components and decline_reason all null"
      - "channel PHYSICAL requires store_id, rack_id, card_id and packaging_seal_intact; channel DIGITAL requires device_reputation_score, email_age_days, payment_risk_band and recipient_email_hash and must omit store_id, rack_id and card_id"
      - "rejects with ERR_PACKAGING_SEAL_BROKEN (p55) when a PHYSICAL request declares packaging_seal_intact false"
      - "rejects with ERR_RACK_TAMPERED (p56) when a PHYSICAL request names a rack that is not INTACT"
      - "rejects with ERR_STORE_FLOOR_SUSPENDED (p57) when the named store's floor is SUSPENDED"

  - method: GET
    path: /issuance-requests
    purpose: List issuance requests with the filters that serve as reverse lookups for store_id, rack_id, card_id and bulk_order_id.
    roles: [StoreManager, PosAssociate, FraudAnalyst, RiskManager, LiabilityAccountant, ResellerPartner, PlatformAdmin]
    input:
      - store_id?
      - rack_id?
      - card_id?
      - bulk_order_id?
      - channel?
      - state?
      - limit?
      - offset?
    output: IssuanceRequest[]
    side_effects: []

  - method: GET
    path: /issuance-requests/{id}
    purpose: Read one issuance request with its screening score and per-component breakdown.
    roles: [StoreManager, PosAssociate, FraudAnalyst, RiskManager, LiabilityAccountant, ResellerPartner, PlatformAdmin]
    input: []
    output: IssuanceRequest
    side_effects: []

  - method: POST
    path: /issuance-requests/{id}/screen
    purpose: Screen a submitted request — the branching fork that forks on floor posture for PHYSICAL and on the §1.3 digital_issuance_risk_score bands for DIGITAL.
    roles: [PosAssociate, StoreManager, FraudAnalyst, PlatformAdmin]
    input: []
    output: IssuanceRequest
    side_effects:
      - "channel DIGITAL: computes screening_score and screening_components per §1.3 digital_issuance_risk_score and forks to APPROVED, HELD_FOR_REVIEW or DECLINED on its two thresholds"
      - "channel PHYSICAL: forks to APPROVED when the store floor is OPEN, to HELD_FOR_REVIEW when it is HEIGHTENED, and is rejected with ERR_STORE_FLOOR_SUSPENDED when it is SUSPENDED"
      - "on APPROVED: the referenced GiftCard (or, for DIGITAL, a freshly minted one) transitions INACTIVE -> ACTIVE, its face_value_cents is set from the request and LedgerEvent{type: ACTIVATION_LOAD, amount_cents: face_value_cents} is appended"
      - "on HELD_FOR_REVIEW for PHYSICAL: the referenced GiftCard's risk_posture escalates CLEAR -> WATCH while it stays INACTIVE with a zero balance"
      - "on DECLINED: increments RetailStore.declined_issuance_count when store_id is not null"
      - "sets screened_at to the logical now and increments IssuanceRequest.version by 1"

  - method: POST
    path: /issuance-requests/{id}/decide
    purpose: Manually resolve a held request — the join point that reaches the same terminals as the automatic fork.
    roles: [StoreManager, RiskManager]
    input:
      - decision
      - review_note?
    output: IssuanceRequest
    side_effects:
      - "decision APPROVE: same activation side effects as the screen fork, but tolerating a HEIGHTENED floor (only SUSPENDED blocks it)"
      - "decision DECLINE: sets decline_reason MANUAL_DECLINE, leaves the card INACTIVE with a zero balance and increments RetailStore.declined_issuance_count when store_id is not null"
      - "records decided_by_user_id := X-User-ID and review_note; increments IssuanceRequest.version by 1"

  # ---- LedgerEvent ---------------------------------------------------------
  - method: GET
    path: /ledger-events
    purpose: List ledger events with the filters that serve as reverse lookups for card_id, merchant_store_id and reverses_event_id.
    roles: [StoreManager, PosAssociate, FraudAnalyst, RiskManager, LiabilityAccountant, ResellerPartner, PlatformAdmin]
    input:
      - card_id?
      - merchant_store_id?
      - reverses_event_id?
      - type?
      - limit?
      - offset?
    output: LedgerEvent[]
    side_effects: []
    notes: "Ordered occurred_at ASC, created_at ASC — the same total order §1.3 card_balance_projection replays."

  - method: GET
    path: /ledger-events/{id}
    purpose: Read one immutable ledger event with its signed amount.
    roles: [StoreManager, PosAssociate, FraudAnalyst, RiskManager, LiabilityAccountant, ResellerPartner, PlatformAdmin]
    input: []
    output: LedgerEvent
    side_effects: []

  - method: POST
    path: /ledger-events/{id}/reverse
    purpose: Compensate an unauthorized redemption by appending an offsetting event. The original event is never mutated.
    roles: [RiskManager]
    input:
      - reversal_reason
    output: LedgerEvent
    side_effects:
      - "appends LedgerEvent{type: REDEMPTION_REVERSAL, amount_cents: the original's amount_cents, signed_amount_cents: +amount_cents, reverses_event_id: the original's id, memo: reversal_reason, occurred_at: logical now}"
      - "re-derives every GiftCard balance and pattern field per §1.3 card_balance_projection, so current_balance_cents returns to its pre-redemption value and the reversed line drops out of total_redeemed_cents"
      - "transitions GiftCard DEPLETED -> ACTIVE when the re-derived balance is above 0"
      - "leaves risk_posture completely untouched — a FROZEN card stays FROZEN after its redemptions are unwound"
      - "increments GiftCard.version by 1"
    notes: |
      Deliberately NOT gated by ERR_CARD_FROZEN (p46): freezing a drained card
      must not prevent making the victim whole.

  # ---- BulkPurchaseOrder ---------------------------------------------------
  - method: POST
    path: /bulk-purchase-orders
    purpose: Open a bulk gift-card purchase, pricing it through the tiered activation fee and deciding whether identity capture is mandatory.
    roles: [PosAssociate, StoreManager]
    input:
      - store_id
      - card_quantity
      - face_value_cents_each
      - purchaser_name
      - payment_method
    output: BulkPurchaseOrder
    side_effects:
      - "rejects with ERR_BULK_QUANTITY_LIMIT_EXCEEDED (p68) when card_quantity > RiskPolicy.bulk_quantity_limit"
      - "computes face_value_subtotal_cents, fee_rate_bps, activation_fee_cents and total_cents per §1.3 bulk_order_total, selecting the tier from the PRE-FEE subtotal"
      - "sets state PENDING_IDENTITY when total_cents >= RiskPolicy.bulk_identity_threshold_cents, otherwise IDENTITY_VERIFIED immediately"

  - method: GET
    path: /bulk-purchase-orders
    purpose: List bulk orders — the reverse lookup for BulkPurchaseOrder.store_id.
    roles: [StoreManager, PosAssociate, FraudAnalyst, RiskManager, LiabilityAccountant, ResellerPartner, PlatformAdmin]
    input:
      - store_id?
      - state?
      - limit?
      - offset?
    output: BulkPurchaseOrder[]
    side_effects: []

  - method: GET
    path: /bulk-purchase-orders/{id}
    purpose: Read one bulk order with its pricing breakdown and identity status.
    roles: [StoreManager, PosAssociate, FraudAnalyst, RiskManager, LiabilityAccountant, ResellerPartner, PlatformAdmin]
    input: []
    output: BulkPurchaseOrder
    side_effects: []

  - method: POST
    path: /bulk-purchase-orders/{id}/identity-verification
    purpose: Capture the government identity that a large bulk purchase requires before it can be approved.
    roles: [PosAssociate, StoreManager]
    input:
      - id_type
      - id_number_hash
      - id_expiry_date
    output: BulkPurchaseOrder
    side_effects:
      - "writes identity_id_type, identity_id_number_hash and identity_id_expiry_date and transitions PENDING_IDENTITY -> IDENTITY_VERIFIED"
      - "increments BulkPurchaseOrder.version by 1"

  - method: POST
    path: /bulk-purchase-orders/{id}/decide
    purpose: Approve, decline, or bounce a bulk order back for more information — the cyclic edge of the bulk lifecycle.
    roles: [StoreManager, RiskManager]
    input:
      - decision
      - decision_note?
    output: BulkPurchaseOrder
    side_effects:
      - "decision REQUEST_INFO: state -> PENDING_IDENTITY, all three identity fields cleared to null, info_request_count incremented — the order may loop indefinitely"
      - "decision APPROVE: rejected with ERR_STORE_FLOOR_SUSPENDED (p57) when the store floor is SUSPENDED, and with ERR_IDENTITY_VERIFICATION_REQUIRED (p60) when identity_id_number_hash is null on an order at or above the identity threshold; otherwise state -> APPROVED"
      - "decision DECLINE: state -> DECLINED with no further checks"
      - "records decided_by_user_id := X-User-ID and decision_note; increments BulkPurchaseOrder.version by 1"
    notes: |
      p57 (business_safety) is checked BEFORE p60 (business_referential), so a
      suspended floor masks a missing identity.

  # ---- DrainingAlert -------------------------------------------------------
  - method: POST
    path: /draining-alerts
    purpose: Raise a card-draining alert manually, alongside the ones the balance-inquiry handler raises automatically.
    roles: [FraudAnalyst, RiskManager]
    input:
      - card_id
      - detection_basis
      - note?
    output: DrainingAlert
    side_effects:
      - "creates the DrainingAlert in state OPEN with exposure_cents snapshotted per §1.3 alert_exposure_snapshot and basis_velocity_count / basis_drain_score at 0"
      - "recomputes RetailStore(card.store_id).open_alert_count and floor_posture, which can heighten the floor once the alert count reaches the threshold"
      - "increments RetailStore.version by 1 when a store was touched"

  - method: GET
    path: /draining-alerts
    purpose: List alerts — the reverse lookup for DrainingAlert.card_id.
    roles: [StoreManager, PosAssociate, FraudAnalyst, RiskManager, LiabilityAccountant, ResellerPartner, PlatformAdmin]
    input:
      - card_id?
      - state?
      - detection_basis?
      - limit?
      - offset?
    output: DrainingAlert[]
    side_effects: []

  - method: GET
    path: /draining-alerts/{id}
    purpose: Read one alert with its frozen exposure snapshot and investigation trail.
    roles: [StoreManager, PosAssociate, FraudAnalyst, RiskManager, LiabilityAccountant, ResellerPartner, PlatformAdmin]
    input: []
    output: DrainingAlert
    side_effects: []

  - method: POST
    path: /draining-alerts/{id}/triage
    purpose: Triage an open alert by reviewing its redemption pattern, which re-scores the card on the redemption-weighted variant.
    roles: [FraudAnalyst]
    input:
      - triage_note
      - redemption_pattern_reviewed
    output: DrainingAlert
    side_effects:
      - "state OPEN -> TRIAGED; records triaged_by_user_id := X-User-ID, triage_note and redemption_pattern_reviewed"
      - "recomputes GiftCard.drain_risk_score_redemption per §1.3 card_drain_risk_score variant redemption_weighted and copies it into basis_drain_score"
      - "escalates GiftCard.risk_posture upward only, per the §1.3 posture ladder"
      - "recomputes RetailStore(card.store_id).open_alert_count and floor_posture"
      - "increments DrainingAlert.version, GiftCard.version and RetailStore.version by 1"

  - method: POST
    path: /draining-alerts/{id}/resolve
    purpose: Confirm or dismiss a triaged alert. CONFIRM is the head of the freeze-and-block cascade; DISMISS relaxes the card.
    roles: [RiskManager]
    input:
      - resolution
      - resolution_note
    output: DrainingAlert
    side_effects:
      - "rejected with ERR_SEGREGATION_OF_DUTIES (p58) when X-User-ID equals DrainingAlert.triaged_by_user_id"
      - "resolution CONFIRM: state -> CONFIRMED (HOP 1); GiftCard.risk_posture := FROZEN (HOP 2); every VALIDATED ResellerListing on that card -> BLOCKED with block_reason CARD_RISK_POSTURE in created_at ASC order (HOP 3)"
      - "resolution DISMISS: state -> DISMISSED; GiftCard.risk_posture := CLEAR only when no other alert on the card is OPEN or TRIAGED; no listing is touched"
      - "recomputes RetailStore(card.store_id).open_alert_count and floor_posture — CONFIRMED and DISMISSED both stop counting toward open_alert_count"
      - "records resolved_by_user_id := X-User-ID and resolution_note; increments DrainingAlert.version, GiftCard.version, RetailStore.version and each affected ResellerListing.version by 1"

  - method: POST
    path: /draining-alerts/{id}/reopen
    purpose: Reopen a dismissed alert when new evidence arrives, closing the investigation cycle.
    roles: [RiskManager]
    input:
      - reopen_reason
    output: DrainingAlert
    side_effects:
      - "state DISMISSED -> OPEN; clears resolution, resolved_by_user_id and resolution_note; PRESERVES triaged_by_user_id so segregation of duties still binds the same user on the next resolve"
      - "increments reopen_count by 1"
      - "recomputes RetailStore(card.store_id).open_alert_count and floor_posture"
      - "increments DrainingAlert.version and RetailStore.version by 1"

  - method: GET
    path: /draining-alerts/{id}/referrals
    purpose: Reverse lookup for LawEnforcementReferral.alert_id — every packet filed against one confirmed alert.
    roles: [FraudAnalyst, RiskManager, PlatformAdmin]
    input:
      - limit?
      - offset?
    output: LawEnforcementReferral[]
    side_effects: []

  # ---- LawEnforcementReferral ---------------------------------------------
  - method: POST
    path: /law-enforcement-referrals
    purpose: File an immutable law-enforcement referral packet for a confirmed draining alert.
    roles: [FraudAnalyst, RiskManager]
    input:
      - alert_id
      - agency_name
      - packet_summary
      - case_reference?
    output: LawEnforcementReferral
    side_effects:
      - "rejected with ERR_ALERT_NOT_CONFIRMED (p62) unless the alert is in state CONFIRMED"
      - "creates the referral with referred_by_user_id := X-User-ID, referred_at := logical now and exposure_snapshot_cents copied from DrainingAlert.exposure_cents"
    notes: |
      LawEnforcementReferral has `common_fields: false` — it carries id and
      created_at only, no updated_at and no version, and there is no update or
      delete endpoint anywhere in §1.5.

  - method: GET
    path: /law-enforcement-referrals/{id}
    purpose: Read one immutable referral packet.
    roles: [FraudAnalyst, RiskManager, PlatformAdmin]
    input: []
    output: LawEnforcementReferral
    side_effects: []

  # ---- VictimClaim ---------------------------------------------------------
  - method: POST
    path: /victim-claims
    purpose: Intake a victim claim with purchase and packaging evidence, inside the policy filing window.
    roles: [PosAssociate, FraudAnalyst]
    input:
      - card_id
      - claimant_name
      - claimant_contact
      - disputed_amount_cents
      - purchased_at
      - alert_id?
      - purchase_receipt_ref?
      - packaging_photo_ref?
    output: VictimClaim
    side_effects:
      - "rejected with ERR_CLAIM_WINDOW_EXPIRED (p65) when (logical now - purchased_at) exceeds RiskPolicy.claim_window_days"
      - "creates the VictimClaim in state SUBMITTED with evidence_round 0, intake_user_id := X-User-ID and every money field null"
    notes: |
      Evidence completeness is NOT checked at intake — a claim may be filed with
      no evidence at all and then chased through the evidence cycle. It is only
      checked at APPROVE time (p61), which is what makes the cycle useful.

  - method: GET
    path: /victim-claims
    purpose: List claims with the filters that serve as reverse lookups for card_id, alert_id and reissued_card_id.
    roles: [StoreManager, PosAssociate, FraudAnalyst, RiskManager, LiabilityAccountant, ResellerPartner, PlatformAdmin]
    input:
      - card_id?
      - alert_id?
      - reissued_card_id?
      - state?
      - limit?
      - offset?
    output: VictimClaim[]
    side_effects: []

  - method: GET
    path: /victim-claims/{id}
    purpose: Read one claim with its evidence round counter and frozen reissue arithmetic.
    roles: [StoreManager, PosAssociate, FraudAnalyst, RiskManager, LiabilityAccountant, ResellerPartner, PlatformAdmin]
    input: []
    output: VictimClaim
    side_effects: []

  - method: POST
    path: /victim-claims/{id}/request-evidence
    purpose: Bounce a claim back to the claimant for missing evidence — the outbound leg of the cyclic evidence loop.
    roles: [FraudAnalyst]
    input:
      - missing_evidence_kinds
    output: VictimClaim
    side_effects:
      - "rejected with ERR_EVIDENCE_ROUND_LIMIT_EXCEEDED (p69) when evidence_round is already at RiskPolicy.claim_evidence_round_limit"
      - "state SUBMITTED -> EVIDENCE_REQUESTED; increments evidence_round by 1 and records missing_evidence_kinds"
      - "increments VictimClaim.version by 1"

  - method: POST
    path: /victim-claims/{id}/resubmit-evidence
    purpose: Return a claim to review with fresh evidence — the inbound leg of the cyclic evidence loop.
    roles: [PosAssociate, FraudAnalyst]
    input:
      - purchase_receipt_ref?
      - packaging_photo_ref?
    output: VictimClaim
    side_effects:
      - "state EVIDENCE_REQUESTED -> SUBMITTED; overwrites only the supplied non-null evidence refs"
      - "does NOT reset evidence_round, so the loop is bounded by RiskPolicy.claim_evidence_round_limit"
      - "increments VictimClaim.version by 1"

  - method: POST
    path: /victim-claims/{id}/decide
    purpose: Approve or deny a claim. APPROVE is the head of the four-hop reissue cascade that reaches the open liability period.
    roles: [RiskManager]
    input:
      - decision
      - decision_note?
    output: VictimClaim
    side_effects:
      - "rejected with ERR_SEGREGATION_OF_DUTIES (p58) when X-User-ID equals VictimClaim.intake_user_id"
      - "decision APPROVE: rejected with ERR_EVIDENCE_INCOMPLETE (p61) when the channel-specific evidence is missing, and with ERR_REISSUE_LIMIT_EXCEEDED (p77) when gross_reissue_cents exceeds RiskPolicy.reissue_cap_cents"
      - "decision APPROVE HOP 1: freezes unauthorized_line_count, gross_reissue_cents, reissue_amount_cents and residual_transfer_cents per §1.3 claim_reissue_amount"
      - "decision APPROVE HOP 2: mints a replacement GiftCard with reissued_from_card_id set to the original, appends LedgerEvent{type: REISSUE_CREDIT, amount_cents: reissue_amount_cents + residual_transfer_cents} on it, and sets VictimClaim.reissued_card_id"
      - "decision APPROVE HOP 3: the original GiftCard transitions to CLOSED, appending LedgerEvent{type: REISSUE_DEBIT, amount_cents: residual_transfer_cents} when that residual is above 0"
      - "decision APPROVE HOP 4: the OPEN LiabilityPeriod containing the logical now has unauthorized_writeoff_cents incremented by reissue_amount_cents"
      - "decision DENY: state -> DENIED, every money field stays null, no card is minted and no ledger event is appended"
      - "records decided_by_user_id := X-User-ID and decision_note; increments VictimClaim.version, the affected GiftCard versions and LiabilityPeriod.version by 1"

  - method: POST
    path: /victim-claims/{id}/rescind
    purpose: Compensate an approved claim, unwinding all four hops so the conserved net funded liability returns to its pre-approval value.
    roles: [RiskManager, LiabilityAccountant]
    input:
      - rescind_reason
    output: VictimClaim
    side_effects:
      - "the replacement GiftCard transitions ACTIVE -> VOIDED, appending LedgerEvent{type: REISSUE_CREDIT_REVERSAL, amount_cents: reissue_amount_cents + residual_transfer_cents, reverses_event_id: the REISSUE_CREDIT}, and its risk_posture is forced to FROZEN"
      - "the original GiftCard transitions CLOSED -> ACTIVE with closed_at cleared, appending LedgerEvent{type: REISSUE_DEBIT_REVERSAL, amount_cents: residual_transfer_cents, reverses_event_id: the REISSUE_DEBIT} when that residual is above 0"
      - "the OPEN LiabilityPeriod containing the logical now has unauthorized_writeoff_cents decremented by reissue_amount_cents"
      - "state APPROVED -> RESCINDED; records rescind_reason and RETAINS reissue_amount_cents, residual_transfer_cents and reissued_card_id for audit"
      - "increments VictimClaim.version, both GiftCard versions and LiabilityPeriod.version by 1"

