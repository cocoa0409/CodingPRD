        grounds:
          - validations.priority_20_ERR_EVALUATION_REQUIRED_FOR_PERMIT
          - entities.LicenseApplication.fields.pathway
          - calculations.permit_window
          - calculations.net_fee_due_cents
        distinguishing_aspect: |
          Permit issuance depends on the existence of a *different* entity (CredentialEvaluation) rather
          than on anything about the TemporaryPermit request, and the MILITARY_SPOUSE_EXPEDITED pathway
          is the sole exemption. Both arms are SUBMITTED with fee_balance_cents 0, so the ENDORSEMENT arm
          fails on priority 20 alone while the exempt arm mints a 180-day-capped permit whose expires_at
          is nevertheless pinned to the 2026-09-30 grace cap.
        test_recipe:
          setup:
            - "Profession RN (standard_processing_days 90, permit_fee_cents 6000)."
            - "Applicant G with military_status NONE: ENDORSEMENT application submitted (gross 48000) and paid down to fee_balance_cents 0. No CredentialEvaluation is created."
            - "Applicant H with military_status MILITARY_SPOUSE: MILITARY_SPOUSE_EXPEDITED application submitted; the 1.00 waiver leaves fee_balance_cents 0 with no payment. No CredentialEvaluation is created."
            - "Both applications are therefore SUBMITTED, satisfying priority 8, and neither can be blocked by priority 36."
            - "Applicant H's expedited pathway sets review_deadline_at to 2026-08-31T00:00:00Z (EXPEDITE_PROCESSING_DAYS 30)."
            - "Each application's version is read immediately before its trigger call."
