  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT]"]
        distinguishing_aspect: "Missing X-User-ID / X-User-Role headers fail priority 1 with 400 before any other check (the test sends the request without the auth headers)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2301", legal_name: "NoAuth", fleet_size: 1 }, as: SafetyAdmin, captures: { err: $.data.error_id } }
          assert:
            - "when the X-User-ID / X-User-Role headers are omitted: error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT, HTTP 400, response_type == error"

      - name: forbidden_role_beats_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=4]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Authorization (priority 2) precedes existence (priority 4): a ComplianceAnalyst creating a violation against a non-existent inspection gets ERR_FORBIDDEN_ROLE, never the 404."
        test_recipe:
          setup: ["one carrier exists"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2302", legal_name: "Prio Carrier", fleet_size: 1 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "00000000-0000-0000-0000-000000000000", category_id: "00000000-0000-0000-0000-000000000000", violation_code: "X", severity_weight: 5, occurred_at: "2026-05-01T00:00:00Z" }, as: ComplianceAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE (HTTP 403) although the referenced inspection does not exist"

      - name: violation_create_fk_existence_order_returns_404
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_INSPECTION_NOT_FOUND]", "errors[ERR_CATEGORY_NOT_FOUND]"]
        distinguishing_aspect: "Body FK existence is checked in declared input order: bogus inspection_id -> ERR_INSPECTION_NOT_FOUND; valid inspection + bogus category_id -> ERR_CATEGORY_NOT_FOUND."
        test_recipe:
          setup: ["carrier, category, driver, inspection all exist"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2303", legal_name: "FK Carrier", fleet_size: 1 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/violation-categories", payload: { category_code: "VEHICLE_MAINTENANCE", display_name: "VM", intervention_threshold: 65, benchmark_measure: 10.0 }, as: SafetyAdmin, captures: { cat_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2303", full_name: "Sal Iko", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", report_number: "R-2303", inspection_date: "2026-05-01T00:00:00Z", inspection_level: 1, state_code: "ND" }, as: SafetyManager, captures: { i_id: $.data.id } }
          trigger:
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "00000000-0000-0000-0000-000000000000", category_id: "${cat_id}", violation_code: "X", severity_weight: 5, occurred_at: "2026-05-01T00:00:00Z" }, as: SafetyManager, captures: { err1: $.data.error_id } }
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "00000000-0000-0000-0000-000000000000", violation_code: "X", severity_weight: 5, occurred_at: "2026-05-01T00:00:00Z" }, as: SafetyManager, captures: { err2: $.data.error_id } }
          assert:
            - "bogus inspection -> ERR_INSPECTION_NOT_FOUND (404); valid inspection + bogus category -> ERR_CATEGORY_NOT_FOUND (404)"

      - name: invalid_enum_range_and_duplicate_category_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]", "errors[ERR_INVALID_SEVERITY_WEIGHT]", "errors[ERR_DUPLICATE_CATEGORY_CODE]"]
        distinguishing_aspect: "Shape/constraint errors: intervention_threshold 0 -> ERR_INVALID_REQUEST; severity_weight 11 -> ERR_INVALID_SEVERITY_WEIGHT; re-creating an existing category_code -> ERR_DUPLICATE_CATEGORY_CODE."
        test_recipe:
          setup: ["carrier, category VEHICLE_MAINTENANCE, driver, inspection exist"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2304", legal_name: "Shape Carrier", fleet_size: 1 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/violation-categories", payload: { category_code: "VEHICLE_MAINTENANCE", display_name: "VM", intervention_threshold: 65, benchmark_measure: 10.0 }, as: SafetyAdmin, captures: { cat_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2304", full_name: "Tia Obo", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", report_number: "R-2304", inspection_date: "2026-05-01T00:00:00Z", inspection_level: 1, state_code: "ND" }, as: SafetyManager, captures: { i_id: $.data.id } }
          trigger:
            - { call: "POST /safety/violation-categories", payload: { category_code: "HAZMAT", display_name: "HM", intervention_threshold: 0, benchmark_measure: 10.0 }, as: SafetyAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "${cat_id}", violation_code: "X", severity_weight: 11, occurred_at: "2026-05-01T00:00:00Z" }, as: SafetyManager, captures: { err2: $.data.error_id } }
            - { call: "POST /safety/violation-categories", payload: { category_code: "VEHICLE_MAINTENANCE", display_name: "VM again", intervention_threshold: 70, benchmark_measure: 8.0 }, as: SafetyAdmin, captures: { err3: $.data.error_id } }
          assert:
            - "threshold 0 -> ERR_INVALID_REQUEST (400); severity_weight 11 -> ERR_INVALID_SEVERITY_WEIGHT (400); duplicate code -> ERR_DUPLICATE_CATEGORY_CODE (409)"

      - name: future_occurrence_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_FUTURE_OCCURRENCE]"]
        distinguishing_aspect: "occurred_at after the current logical clock is rejected on violations and on accidents (temporal check against the logical clock, not wall time)."
        test_recipe:
          setup: ["carrier, category, driver, inspection exist; clock at the 2026-08-01 default"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2305", legal_name: "Future Carrier", fleet_size: 1 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/violation-categories", payload: { category_code: "UNSAFE_DRIVING", display_name: "UD", intervention_threshold: 65, benchmark_measure: 10.0 }, as: SafetyAdmin, captures: { cat_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2305", full_name: "Ugo Ama", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", report_number: "R-2305", inspection_date: "2026-05-01T00:00:00Z", inspection_level: 1, state_code: "WI" }, as: SafetyManager, captures: { i_id: $.data.id } }
          trigger:
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "${cat_id}", violation_code: "X", severity_weight: 5, occurred_at: "2027-01-01T00:00:00Z" }, as: SafetyManager, captures: { err1: $.data.error_id } }
            - { call: "POST /safety/accident-records", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", occurred_at: "2026-09-01T00:00:00Z", fatalities: 0, injuries: 1, tow_away: false }, as: SafetyManager, as_user_id: "sm-1", captures: { err2: $.data.error_id } }
          assert:
            - "violation occurred 2027-01-01 (future) -> ERR_FUTURE_OCCURRENCE (409); accident occurred 2026-09-01 (future) -> ERR_FUTURE_OCCURRENCE"

      - name: post_accident_window_alcohol_boundary
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_POST_ACCIDENT_WINDOW_MISSED]"]
        distinguishing_aspect: "The 8-hour alcohol window boundary is inclusive: collected exactly 8h after the accident succeeds; 8h 1s later fails with ERR_POST_ACCIDENT_WINDOW_MISSED."
        test_recipe:
          setup: ["carrier; ACTIVE driver; reportable accident occurred 2026-07-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2306", legal_name: "Window Carrier", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2306", full_name: "Vic Oda", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/accident-records", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", occurred_at: "2026-07-01T00:00:00Z", fatalities: 0, injuries: 1, tow_away: true }, as: SafetyManager, as_user_id: "sm-1", captures: { acc: $.data.id } }
          trigger:
            - { call: "POST /safety/drug-alcohol-tests", payload: { driver_id: "${d_id}", test_type: "POST_ACCIDENT", substance: "ALCOHOL", collected_at: "2026-07-01T08:00:00Z", accident_id: "${acc}" }, as: SafetyManager, captures: { t_ok: $.data.id } }
            - { call: "POST /safety/drug-alcohol-tests", payload: { driver_id: "${d_id}", test_type: "POST_ACCIDENT", substance: "ALCOHOL", collected_at: "2026-07-01T08:00:01Z", accident_id: "${acc}" }, as: SafetyManager, captures: { err: $.data.error_id } }
          assert:
            - "collected_at == occurred_at + 8h exactly -> 201 COLLECTED"
            - "collected_at == occurred_at + 8h1s -> ERR_POST_ACCIDENT_WINDOW_MISSED (409)"

      - name: sod_mro_verifier_is_recorder
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_SOD_VERIFIER_IS_RECORDER]"]
        distinguishing_aspect: "Segregation of duties on X-User-ID: the MRO verification is rejected when the verifier's user id equals the recorder's, even though the role is correct."
        test_recipe:
          setup: ["carrier; driver; RANDOM drug test in LAB_REPORTED (recorded by sm-1, lab NEGATIVE)"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2307", legal_name: "SoD Carrier", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2307", full_name: "Wes Ida", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/drug-alcohol-tests", payload: { driver_id: "${d_id}", test_type: "RANDOM", substance: "DRUG", collected_at: "2026-07-01T00:00:00Z" }, as: SafetyManager, as_user_id: "sm-1", captures: { t_id: $.data.id } }
            - { call: "POST /safety/drug-alcohol-tests/${t_id}/report-lab-result", payload: { lab_result: "NEGATIVE" }, as: SafetyManager }
          trigger:
            - { call: "POST /safety/drug-alcohol-tests/${t_id}/verify", payload: { verdict: "VERIFIED_NEGATIVE" }, as: MedicalReviewOfficer, as_user_id: "sm-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SOD_VERIFIER_IS_RECORDER (HTTP 409); test remains LAB_REPORTED with mro_verdict NONE"

      - name: sod_preventability_same_user
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_SOD_PREVENTABILITY_SAME_USER]"]
        distinguishing_aspect: "The preventability determiner must differ from the registrar: same user id -> ERR_SOD_PREVENTABILITY_SAME_USER; a different SafetyDirector user id succeeds."
        test_recipe:
          setup: ["carrier; driver; accident registered by sm-1"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2308", legal_name: "SoD Carrier Two", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2308", full_name: "Xia Ede", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/accident-records", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", occurred_at: "2026-06-01T00:00:00Z", fatalities: 0, injuries: 1, tow_away: false }, as: SafetyManager, as_user_id: "sm-1", captures: { acc: $.data.id } }
          trigger:
            - { call: "POST /safety/accident-records/${acc}/determine-preventability", payload: { determination: "PREVENTABLE" }, as: SafetyDirector, as_user_id: "sm-1", captures: { err: $.data.error_id } }
            - { call: "POST /safety/accident-records/${acc}/determine-preventability", payload: { determination: "PREVENTABLE" }, as: SafetyDirector, as_user_id: "sd-1", captures: { status: $.data.preventability_status } }
          assert:
            - "same user id as registrar -> ERR_SOD_PREVENTABILITY_SAME_USER (409)"
            - "different SafetyDirector user id -> preventability_status PREVENTABLE"

      - name: verdict_result_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_VERDICT_RESULT_MISMATCH]"]
        distinguishing_aspect: "MRO verdict must match the lab result: NEGATIVE lab + VERIFIED_POSITIVE verdict -> ERR_VERDICT_RESULT_MISMATCH."
        test_recipe:
          setup: ["carrier; driver; test in LAB_REPORTED with lab_result NEGATIVE (recorder sm-1)"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2309", legal_name: "Verdict Carrier", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2309", full_name: "Yve Aro", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/drug-alcohol-tests", payload: { driver_id: "${d_id}", test_type: "RANDOM", substance: "DRUG", collected_at: "2026-07-01T00:00:00Z" }, as: SafetyManager, as_user_id: "sm-1", captures: { t_id: $.data.id } }
            - { call: "POST /safety/drug-alcohol-tests/${t_id}/report-lab-result", payload: { lab_result: "NEGATIVE" }, as: SafetyManager }
          trigger:
            - { call: "POST /safety/drug-alcohol-tests/${t_id}/verify", payload: { verdict: "VERIFIED_POSITIVE" }, as: MedicalReviewOfficer, as_user_id: "mro-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VERDICT_RESULT_MISMATCH (409); test stays LAB_REPORTED"

      - name: upgrade_rating_not_upgradable
        claim_type: violation_to_error
        grounds: ["errors[ERR_RATING_NOT_UPGRADABLE]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Referential gate: carrier rating NONE cannot be upgraded via request (needs a compliance review); and requested_rating UNSATISFACTORY is not even a valid enum member (shape error fires first at priority 3)."
        test_recipe:
          setup: ["carrier with rating NONE"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2310", legal_name: "Upgrade Carrier", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /safety/rating-upgrade-requests", payload: { carrier_id: "${c_id}", requested_rating: "SATISFACTORY", justification_note: "please" }, as: SafetyManager, captures: { err1: $.data.error_id } }
            - { call: "POST /safety/rating-upgrade-requests", payload: { carrier_id: "${c_id}", requested_rating: "UNSATISFACTORY", justification_note: "please" }, as: SafetyManager, captures: { err2: $.data.error_id } }
          assert:
            - "rating NONE -> ERR_RATING_NOT_UPGRADABLE (409)"
            - "requested_rating UNSATISFACTORY -> ERR_INVALID_REQUEST (400, invalid enum member; shape precedes referential)"

      - name: driver_carrier_mismatch_rejected
        claim_type: cross_entity_validation
        grounds: ["errors[ERR_DRIVER_CARRIER_MISMATCH]"]
        distinguishing_aspect: "Cross-aggregate consistency: an inspection for carrier B cannot cite a driver employed by carrier A."
        test_recipe:
          setup: ["carriers A and B; driver under A"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2311A", legal_name: "Mismatch A", fleet_size: 2 }, as: SafetyAdmin, captures: { ca: $.data.id } }
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2311B", legal_name: "Mismatch B", fleet_size: 2 }, as: SafetyAdmin, captures: { cb: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${ca}", cdl_number: "CDL-2311", full_name: "Zoe Ibu", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
          trigger:
            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${cb}", driver_id: "${d_id}", report_number: "R-2311", inspection_date: "2026-05-01T00:00:00Z", inspection_level: 1, state_code: "MI" }, as: SafetyManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DRIVER_CARRIER_MISMATCH (409)"

      - name: cycle_twice_same_day_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_CYCLE_ALREADY_RUN_TODAY]"]
        distinguishing_aspect: "One measurement cycle per carrier per UTC date: the second run at the same clock is rejected; another carrier's cycle the same day is unaffected."
        test_recipe:
          setup: ["carriers A and B"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2312A", legal_name: "Cycle A", fleet_size: 1 }, as: SafetyAdmin, captures: { ca: $.data.id } }
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2312B", legal_name: "Cycle B", fleet_size: 1 }, as: SafetyAdmin, captures: { cb: $.data.id } }
            - { call: "POST /safety/measurement-cycles", payload: { carrier_id: "${ca}" }, as: ComplianceAnalyst }
          trigger:
            - { call: "POST /safety/measurement-cycles", payload: { carrier_id: "${ca}" }, as: ComplianceAnalyst, captures: { err: $.data.error_id } }
            - { call: "POST /safety/measurement-cycles", payload: { carrier_id: "${cb}" }, as: ComplianceAnalyst, captures: { ok: $.data.cycle_date } }
          assert:
            - "second cycle for carrier A same UTC date -> ERR_CYCLE_ALREADY_RUN_TODAY (409)"
            - "carrier B cycle the same day succeeds (cycle_date == 2026-08-01)"

      - name: clock_regression_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_CLOCK_REGRESSION]"]
        distinguishing_aspect: "The logical clock is strictly monotonic: moving it backward — or to the identical instant — returns ERR_CLOCK_REGRESSION."
        test_recipe:
          setup: ["clock advanced to 2026-08-03"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: SafetyAdmin }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SafetyAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: SafetyAdmin, captures: { err2: $.data.error_id } }
          assert:
            - "backward move -> ERR_CLOCK_REGRESSION (409); equal instant -> ERR_CLOCK_REGRESSION"

      - name: duplicate_report_number_scoped_per_carrier
        claim_type: violation_to_error
