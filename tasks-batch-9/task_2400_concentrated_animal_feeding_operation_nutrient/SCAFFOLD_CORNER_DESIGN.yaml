            - "FieldNutrientBudget.${bd_id}.applied_gallons_to_date == 100000.00 and remaining_gallons == 314396, proving the ACTIVE sibling budget is the only one debited"
            - "ManureStorage.${st_id}.current_volume_gallons == 900000.00 and cumulative_outflow_gallons == 100000.00"
      - name: expired_coverage_blocks_application_events
        claim_type: triggerable
        grounds:
          - errors.ERR_PERMIT_COVERAGE_EXPIRED
          - validations[priority=18]
        excluded_because:
          difficulty_instance: application_event_depends_on_permit_coverage_state
          rationale: "That §1.8 instance walks one operation's permit through COVERED, RENEWAL_PENDING and EXPIRED and replays the identical application event at each step, so the EXPIRED arm already triggers ERR_PERMIT_COVERAGE_EXPIRED with the 409 status."
      - name: lapsed_hauler_license_blocks_transfer_acknowledgement
        claim_type: triggerable
        grounds:
          - errors.ERR_HAULER_LICENSE_LAPSED
          - state_machines.ManureTransfer.INITIATED->ACKNOWLEDGED
        excluded_because:
          difficulty_instance: transfer_acknowledge_depends_on_hauler_license_state
          rationale: "That §1.8 instance advances the logical clock past license_expires_on so the hauler lapses under an already-INITIATED transfer, then acknowledges it and asserts ERR_HAULER_LICENSE_LAPSED with status 422."
      - name: certify_requires_granted_coverage
        claim_type: triggerable
        grounds:
          - errors.ERR_PERMIT_COVERAGE_REQUIRED
          - validations[priority=17]
        excluded_because:
          difficulty_instance: plan_certify_depends_on_permit_coverage_being_granted
          rationale: "That §1.8 instance certifies the same plan against a permit in APPLIED, then in COVERED, then in EXPIRED, so the ERR_PERMIT_COVERAGE_REQUIRED arm is already exercised with its 409 status."
      - name: overlapping_coverage_interval_is_rejected_on_submit
        claim_type: triggerable
        grounds:
          - errors.ERR_PERMIT_COVERAGE_OVERLAP
          - validations[priority=29]
        excluded_because:
          difficulty_instance: permit_coverage_intervals_touch_without_overlapping
          rationale: "That §1.8 boundary instance submits a successor permit whose effective_on equals the incumbent's expires_on (accepted) and then one day earlier (rejected), which is exactly the ERR_PERMIT_COVERAGE_OVERLAP trigger."

  - section: rbac
    instances:
      - name: header_role_and_ownership_failures_are_rejected_in_priority_order
        claim_type: unauthorized_operations
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=3]
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_OWNERSHIP_VIOLATION
          - roles.Operator.identity
          - roles.Hauler.identity
        distinguishing_aspect: |
          The three authorization gates are ordered 1 > 2 > 3, so a request that is simultaneously
          header-less and role-wrong must return 401 rather than 403, and a request with the right
          role but the wrong entity-backed identity must return ERR_OWNERSHIP_VIOLATION rather than
          any state or payload error. Both entity-backed identities are probed: Operator against a
          second operation's row and Hauler against another hauler's transfer.
        test_recipe:
          setup:
            - "Two registered operations, a COVERED permit and a filled lagoon on the first, and two ACTIVE haulers with one INITIATED transfer assigned to the first hauler"
          setup_api_calls:
            - call: "POST /cafo/operations"
              payload: { name: "Willow Creek Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 300, manure_handling: "LIQUID", open_lot_area_sqft: 40000, discharge_potential: "CONTINUOUS", has_conservation_plan: true }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_id: $.data.id }
            - call: "POST /cafo/operations"
              payload: { name: "Prairie Ridge Swine", county: "Story", animal_type: "SWINE_FINISHING", head_count: 400, manure_handling: "LIQUID", discharge_potential: "STORMWATER_ONLY" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_b: $.data.id }
            - call: "POST /cafo/manure-storages"
              payload: { operation_id: "${op_id}", structure_name: "Lagoon 1", structure_type: "EARTHEN_LAGOON", surface_area_sqft: 60000, total_depth_in: 144, required_freeboard_in: 24 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { st_id: $.data.id }
            - call: "POST /cafo/permits"
              payload: { operation_id: "${op_id}", permit_type: "GENERAL", effective_on: "2026-01-01T00:00:00Z" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { pm_id: $.data.id }
            - call: "POST /cafo/permits/${pm_id}/submit"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /cafo/permits/${pm_id}/issue-coverage"
              payload: {}
              as: StateReviewer
              as_user_id: "reviewer-1"
            - call: "POST /cafo/haulers"
              payload: { business_name: "Kroeger Pumping", license_number: "HL-1001", license_expires_on: "2027-06-30T00:00:00Z", certified_applicator: true }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { h1_id: $.data.id }
            - call: "POST /cafo/haulers"
              payload: { business_name: "Vandermeer Hauling", license_number: "HL-1002", license_expires_on: "2027-06-30T00:00:00Z", certified_applicator: false }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { h2_id: $.data.id }
            - call: "POST /cafo/manure-storages/${st_id}/intake"
              payload: { gallons: 1000000 }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /cafo/manure-transfers"
              payload: { operation_id: "${op_id}", storage_id: "${st_id}", hauler_id: "${h1_id}", recipient_name: "Duvall Row Crop", recipient_address: "2244 340th St, Linn", transferred_on: "2026-07-20T00:00:00Z", gallons_transferred: 200000, nutrient_analysis_provided: true }
              as: Operator
              as_user_id: "${op_id}"
              captures: { tr_id: $.data.id }
          trigger:
            - call: "GET /cafo/operations/${op_id}"
              payload: {}
              as: NONE
              as_user_id: NONE
              captures: { e_noauth: $.data.error_id }
            - call: "POST /cafo/haulers"
              payload: { business_name: "Ghost Hauling", license_number: "HL-9999", license_expires_on: "2027-06-30T00:00:00Z" }
              as: Regulator
              as_user_id: "ghost-1"
              captures: { e_badrole: $.data.error_id }
            - call: "POST /cafo/operations"
              payload: { name: "Self Registered Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 10, manure_handling: "DRY", discharge_potential: "NONE" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { e_role: $.data.error_id }
            - call: "GET /cafo/operations"
              payload: { county: "Linn" }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { e_list: $.data.error_id }
            - call: "PATCH /cafo/operations/${op_b}"
