              as_user_id: "${crew_a}"
            - call: "POST /install-jobs/${job}/complete"
              payload: { as_measured_sqft: 600, as_measured_crack_ft: 15 }
              as: Crew
              as_user_id: "${crew_a}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-13T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /install-jobs/${job}/mark-cured"
              payload: {}
              as: Scheduler
            - call: "GET /projects/${proj}/warranties"
              payload: {}
              as: WarrantyAgent
              captures: { war: "$.data[0].id" }
            - call: "POST /warranties/${war}/claims"
              payload: { defect_type: "PEEL" }
              as: Customer
              as_user_id: "${cust_d}"
              captures: { claim: $.data.id }
          trigger:
            - call: "POST /claims/${claim}/review"
              payload: { action: "REQUEST_INFO" }
              as: WarrantyAgent
            - call: "POST /claims/${claim}/resubmit"
              payload: {}
              as: Customer
              as_user_id: "${cust_d}"
            - call: "POST /claims/${claim}/review"
              payload: { action: "REQUEST_INFO" }
              as: WarrantyAgent
            - call: "POST /claims/${claim}/resubmit"
              payload: {}
              as: Customer
              as_user_id: "${cust_d}"
              captures: { rr: $.data.revision_rounds, st: $.data.status }
          assert:
            - "rr == 2 (two NEEDS_INFO -> SUBMITTED loops)"
