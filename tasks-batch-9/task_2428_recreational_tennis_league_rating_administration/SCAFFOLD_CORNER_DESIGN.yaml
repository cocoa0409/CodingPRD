              as: LeagueCoordinator
            - &a_xf1
              call: "POST /tennis/roster-spots"
              payload: {team_id: "${tma_id}", player_id: "${pf1_id}", expected_team_version: "${tma_v0}"}
              as: Captain
              as_user_id: "${pa1_id}"
              captures: {rsf1_id: "$.data.id", rsf1_status: "$.data.status"}
          trigger:
