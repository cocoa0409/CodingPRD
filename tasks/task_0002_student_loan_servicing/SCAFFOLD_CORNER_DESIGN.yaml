              payload: { borrower_id: "${brw_id}", discharge_type: "DEATH", va_certification_doc_id: "VA-DOC-X", filed_on: "2026-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_VA_DOC_REQUIRED_OR_FORBIDDEN"

      - name: invalid_clock_advance_to_past_returns_invalid
        claim_type: Violation → Error
        grounds:
          - endpoints["POST /v1/_clock/advance"]
          - errors[ERR_INVALID_CLOCK]
        distinguishing_aspect: "POST /_clock/advance with to_iso8601 less-than-or-equal to current clock returns 422 ERR_INVALID_CLOCK."
        test_recipe:
          setup: ["Clock at 2026-06-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
          trigger:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_CLOCK"
            - "response.http_status == 422"

  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_payments_filter_by_loan_id
        claim_type: Standard CRUD
        grounds:
          - endpoints["GET /v1/payments"]
        distinguishing_aspect: "GET /v1/payments?loan_id=X returns only payments on loan X (filter behavior)."
        test_recipe:
          setup: ["Borrower with two Loans; one Payment on each."]
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
