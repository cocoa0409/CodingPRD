      - name: three_no_shows_suspend_a_volunteer_and_bar_the_next_seat
        claim_type: violation_to_error
        grounds: ["validations[priority=28]", errors.ERR_VOLUNTEER_SUSPENDED, entities.VolunteerProfile.fields.no_show_strikes, entities.VolunteerProfile.fields.status, "state_machines.ShiftAssignment.status.CONFIRMED_to_NO_SHOW", "state_machines.ConstructionShift.status.LOCKED_to_COMPLETED"]
        distinguishing_aspect: "The suspension is not administratively set anywhere — it accrues. Three locked shifts complete with this volunteer confirmed and never checked in, driving no_show_strikes from 0 to 3 and flipping status to SUSPENDED, and only then does a fourth reservation fail. The strike ledger is asserted after each completion so the third strike is visibly the one that suspends."
        test_recipe:
          setup:
            - "Canonical program with one site at READY_TO_BUILD and one adult volunteer whose waiver runs to 2027-12-31. Three single-seat one-hour shifts sit on 2026-08-03, 2026-08-04 and 2026-08-05, each 08:00 to 09:00, all OPEN with the volunteer CONFIRMED and then LOCKED (a single seat needs ceil(0.60 * 1) == 1 confirmation). Distinct days keep the closed 60-minute site buffer and the half-open volunteer overlap rule satisfied, and 3 total hours are far under the 40.00 weekly cap. A fourth single-seat shift on 2026-08-06 has been created and opened but has no seats."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
