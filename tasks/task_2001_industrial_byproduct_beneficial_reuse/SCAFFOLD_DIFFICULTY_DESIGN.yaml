scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 - dual_variant_calc (two entity domains: Shipment money, Generator credits)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_settlement_diverge_on_index_move
        grounds:
          - calculations.shipment_settlement
          - calculations.market_price_selection
          - entities.Shipment.fields.provisional_settlement_cents
          - entities.Shipment.fields.final_gross_revenue_cents
        distinguishing_aspect: |
          Shipment-domain dual variant: provisional prices gross tons at the pickup-date index
          (20 t x 300 = 6000); final prices net tons at the acceptance-date index (20 t x 350 = 7000).
          Identical load, different cents, because the 350-cent entry (effective 2026-07-15) is
          published only after booking.
        test_recipe:
          setup:
            - "Dispatch-ready PA chain: stream with VERIFIED characterization, APPROVED PA eligibility [2026-01-01, 2027-01-01), ACTIVE PA FLY_ASH permit, ACTIVE agreement (committed 100, rev 0.6, freight 0.25, term 2026-01-01..2026-12-31), ACTIVE commitment (committed 100, max_moisture 10.0, max_arsenic 5.0)"
            - "Only index entry at booking time: 300 cents/ton effective 2026-01-01"
            - "Logical clock at default 2026-08-01T00:00:00Z, so the acceptance date is 2026-08-01"
          setup_api_calls:
            - { call: "POST /api/generators", payload: { legal_name: "GenCo", hq_state_code: "OH", contact_email: "g@x.com" }, as: BrokerOps, captures: { g_id: $.data.id } }
            - { call: "POST /api/offtakers", payload: { legal_name: "OffCo", hq_state_code: "PA", receiving_state_codes: ["PA", "WV"] }, as: BrokerOps, captures: { o_id: $.data.id } }
            - { call: "POST /api/streams", payload: { generator_id: "${g_id}", material_type: "FLY_ASH", declared_moisture_pct: 9.0, expected_tons_per_month: 500 }, as: Generator, as_user_id: "${g_id}", captures: { s_id: $.data.id } }
            - { call: "POST /api/streams/${s_id}/characterizations", payload: { lab_name: "LabCo", sampled_on: "2026-07-01", ph: 7.2, arsenic_ppm: 3.0, lead_ppm: 2.0, moisture_pct_measured: 9.5 }, as: Generator, as_user_id: "${g_id}", captures: { c_id: $.data.id } }
            - { call: "POST /api/characterizations/${c_id}/verify", payload: {}, as: BrokerOps }
            - { call: "POST /api/streams/${s_id}/eligibility-determinations", payload: { state_code: "PA", use_case: "CEMENT_ADDITIVE", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: ComplianceOfficer, as_user_id: "co_file", captures: { d_id: $.data.id } }
            - { call: "POST /api/eligibility-determinations/${d_id}/submit", payload: {}, as: ComplianceOfficer, as_user_id: "co_file" }
            - { call: "POST /api/eligibility-determinations/${d_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co_appr" }
            - { call: "POST /api/state-permits", payload: { state_code: "PA", material_type: "FLY_ASH", regime: "PERMIT", permit_number: "PA-001", issued_on: "2026-01-01", expires_on: "2026-12-31" }, as: ComplianceOfficer, as_user_id: "co_file", captures: { p_id: $.data.id } }
            - { call: "POST /api/state-permits/${p_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_file" }
            - { call: "POST /api/supply-agreements", payload: { generator_id: "${g_id}", stream_id: "${s_id}", committed_monthly_tons: 100, revenue_share_pct_to_generator: 0.6, freight_share_pct_to_generator: 0.25, term_start: "2026-01-01", term_end: "2026-12-31" }, as: Generator, as_user_id: "${g_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/supply-agreements/${a_id}/activate", payload: {}, as: BrokerOps }
            - { call: "GET /api/supply-agreements/${a_id}", payload: {}, as: BrokerOps, captures: { a_v: $.data.version } }
            - { call: "POST /api/offtake-commitments", payload: { offtaker_id: "${o_id}", stream_id: "${s_id}", destination_state_code: "PA", committed_monthly_tons: 100, max_moisture_pct: 10.0, max_arsenic_ppm: 5.0 }, as: Offtaker, as_user_id: "${o_id}", captures: { k_id: $.data.id } }
            - { call: "POST /api/offtake-commitments/${k_id}/activate", payload: {}, as: BrokerOps }
            - { call: "POST /api/price-index-entries", payload: { material_type: "FLY_ASH", region_code: "PA", effective_from: "2026-01-01", price_cents_per_ton: 300 }, as: BrokerOps }
          trigger:
            - { call: "POST /api/shipments", payload: { supply_agreement_id: "${a_id}", offtake_commitment_id: "${k_id}", pickup_date: "2026-08-05", distance_miles: 50, gross_tons: 20, loading_moisture_pct: 8.0, expected_supply_agreement_version: "${a_v}" }, as: Generator, as_user_id: "${g_id}", captures: { sh_id: $.data.id } }
            - { call: "POST /api/price-index-entries", payload: { material_type: "FLY_ASH", region_code: "PA", effective_from: "2026-07-15", price_cents_per_ton: 350 }, as: BrokerOps }
            - { call: "POST /api/shipments/${sh_id}/dispatch", payload: {}, as: Generator, as_user_id: "${g_id}" }
            - { call: "POST /api/shipments/${sh_id}/deliver", payload: { destination_moisture_pct: 8.0, destination_arsenic_ppm: 3.0 }, as: Offtaker, as_user_id: "${o_id}" }
            - { call: "POST /api/shipments/${sh_id}/accept", payload: {}, as: Offtaker, as_user_id: "${o_id}" }
          assert:
            - "Shipment.${sh_id}.price_at_pickup_cents_per_ton == 300"
            - "Shipment.${sh_id}.provisional_settlement_cents == 6000"
            - "Shipment.${sh_id}.price_at_acceptance_cents_per_ton == 350"
            - "Shipment.${sh_id}.net_billable_tons == 20.0"
            - "Shipment.${sh_id}.final_gross_revenue_cents == 7000"
            - "Shipment.${sh_id}.final_generator_share_cents == 4200"
            - "Shipment.${sh_id}.final_broker_share_cents == 2800"
            - "Shipment.${sh_id}.provisional_settlement_cents != Shipment.${sh_id}.final_gross_revenue_cents"

      - name: standard_vs_attested_credit_variants_diverge
        grounds:
          - calculations.sustainability_credit_accrual
          - entities.Generator.fields.total_credits
        distinguishing_aspect: |
          Generator-domain dual variant: the standard ledger variant nets the voided 45 t via a
          REVERSAL row (60 + 45 - 45 = 60.00 credits), while the attested variant re-derives from
          shipments still ACCEPTED with factor 0.92 (60 x 0.92 = 55.20) - same diversion history,
          different inclusion set and different factor.
        test_recipe:
          setup:
            - "Dispatch-ready PA chain identical in shape to provisional_vs_final_settlement_diverge_on_index_move but with committed 500 on both agreement and commitment and a single 300-cent index entry effective 2026-01-01"
            - "Logical clock at default 2026-08-01T00:00:00Z, so all postings land in period 2026-08"
          setup_api_calls:
            - { call: "POST /api/generators", payload: { legal_name: "GenCo", hq_state_code: "OH", contact_email: "g@x.com" }, as: BrokerOps, captures: { g_id: $.data.id } }
            - { call: "POST /api/offtakers", payload: { legal_name: "OffCo", hq_state_code: "PA", receiving_state_codes: ["PA", "WV"] }, as: BrokerOps, captures: { o_id: $.data.id } }
            - { call: "POST /api/streams", payload: { generator_id: "${g_id}", material_type: "FLY_ASH", declared_moisture_pct: 9.0, expected_tons_per_month: 500 }, as: Generator, as_user_id: "${g_id}", captures: { s_id: $.data.id } }
            - { call: "POST /api/streams/${s_id}/characterizations", payload: { lab_name: "LabCo", sampled_on: "2026-07-01", ph: 7.2, arsenic_ppm: 3.0, lead_ppm: 2.0, moisture_pct_measured: 9.5 }, as: Generator, as_user_id: "${g_id}", captures: { c_id: $.data.id } }
            - { call: "POST /api/characterizations/${c_id}/verify", payload: {}, as: BrokerOps }
            - { call: "POST /api/streams/${s_id}/eligibility-determinations", payload: { state_code: "PA", use_case: "CEMENT_ADDITIVE", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: ComplianceOfficer, as_user_id: "co_file", captures: { d_id: $.data.id } }
            - { call: "POST /api/eligibility-determinations/${d_id}/submit", payload: {}, as: ComplianceOfficer, as_user_id: "co_file" }
            - { call: "POST /api/eligibility-determinations/${d_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co_appr" }
            - { call: "POST /api/state-permits", payload: { state_code: "PA", material_type: "FLY_ASH", regime: "PERMIT", permit_number: "PA-001", issued_on: "2026-01-01", expires_on: "2026-12-31" }, as: ComplianceOfficer, as_user_id: "co_file", captures: { p_id: $.data.id } }
            - { call: "POST /api/state-permits/${p_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_file" }
            - { call: "POST /api/supply-agreements", payload: { generator_id: "${g_id}", stream_id: "${s_id}", committed_monthly_tons: 500, revenue_share_pct_to_generator: 0.6, freight_share_pct_to_generator: 0.25, term_start: "2026-01-01", term_end: "2026-12-31" }, as: Generator, as_user_id: "${g_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/supply-agreements/${a_id}/activate", payload: {}, as: BrokerOps }
            - { call: "GET /api/supply-agreements/${a_id}", payload: {}, as: BrokerOps, captures: { a_v1: $.data.version } }
            - { call: "POST /api/offtake-commitments", payload: { offtaker_id: "${o_id}", stream_id: "${s_id}", destination_state_code: "PA", committed_monthly_tons: 500, max_moisture_pct: 10.0, max_arsenic_ppm: 5.0 }, as: Offtaker, as_user_id: "${o_id}", captures: { k_id: $.data.id } }
            - { call: "POST /api/offtake-commitments/${k_id}/activate", payload: {}, as: BrokerOps }
            - { call: "POST /api/price-index-entries", payload: { material_type: "FLY_ASH", region_code: "PA", effective_from: "2026-01-01", price_cents_per_ton: 300 }, as: BrokerOps }
            - { call: "POST /api/shipments", payload: { supply_agreement_id: "${a_id}", offtake_commitment_id: "${k_id}", pickup_date: "2026-08-05", distance_miles: 50, gross_tons: 60, loading_moisture_pct: 8.0, expected_supply_agreement_version: "${a_v1}" }, as: Generator, as_user_id: "${g_id}", captures: { s1_id: $.data.id } }
            - { call: "POST /api/shipments/${s1_id}/dispatch", payload: {}, as: Generator, as_user_id: "${g_id}" }
            - { call: "POST /api/shipments/${s1_id}/deliver", payload: { destination_moisture_pct: 8.0, destination_arsenic_ppm: 3.0 }, as: Offtaker, as_user_id: "${o_id}" }
            - { call: "POST /api/shipments/${s1_id}/accept", payload: {}, as: Offtaker, as_user_id: "${o_id}" }
            - { call: "GET /api/supply-agreements/${a_id}", payload: {}, as: BrokerOps, captures: { a_v2: $.data.version } }
            - { call: "POST /api/shipments", payload: { supply_agreement_id: "${a_id}", offtake_commitment_id: "${k_id}", pickup_date: "2026-08-06", distance_miles: 50, gross_tons: 45, loading_moisture_pct: 8.0, expected_supply_agreement_version: "${a_v2}" }, as: Generator, as_user_id: "${g_id}", captures: { s2_id: $.data.id } }
            - { call: "POST /api/shipments/${s2_id}/dispatch", payload: {}, as: Generator, as_user_id: "${g_id}" }
            - { call: "POST /api/shipments/${s2_id}/deliver", payload: { destination_moisture_pct: 8.0, destination_arsenic_ppm: 3.0 }, as: Offtaker, as_user_id: "${o_id}" }
            - { call: "POST /api/shipments/${s2_id}/accept", payload: {}, as: Offtaker, as_user_id: "${o_id}" }
          trigger:
            - { call: "POST /api/shipments/${s2_id}/void", payload: { reason: "audit failure" }, as: BrokerOps }
            - { call: "GET /api/generators/${g_id}/credit-summary", payload: {}, as: BrokerOps }
          assert:
            - "credit-summary response data.standard_credits == 60.0"
            - "credit-summary response data.attested_credits == 55.2"
            - "credit-summary response data.total_net_tons == 60.0"
            - "Generator.${g_id}.total_credits == 60.0"
            - "attested variant excludes voided Shipment.${s2_id} entirely rather than offsetting it"

  # =========================================================================
  # Rule 2 - combinatorial_formula (mode (a) tiered+cap, mode (b) rounding order)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: freight_tiered_marginal_rates_with_share_cap
        grounds:
          - calculations.freight_cost_allocation
          - entities.Shipment.fields.freight_total_cents
          - entities.Shipment.fields.generator_freight_share_cents
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula - marginal per-mile tiers (100/300 mi
          breakpoints) plus a base fee, then a percentage split clamped by
          MAX_GENERATOR_FREIGHT_SHARE_CENTS. Booking A (600 mi, 50% share) hits the cap
          (min(93500, 60000) = 60000); booking B (350 mi, 30% share) straddles tier 3 without
          hitting the cap (40350).
        test_recipe:
          setup:
            - "Generator/stream with VERIFIED characterization; two ACTIVE agreements on the same stream: A1 freight share 0.50, A2 freight share 0.30 (both committed 1000, rev 0.5, term 2026-01-01..2026-12-31); one ACTIVE PA commitment committed 3000; index entry 300 effective 2026-01-01"
            - "Logical clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /api/generators", payload: { legal_name: "GenCo", hq_state_code: "OH", contact_email: "g@x.com" }, as: BrokerOps, captures: { g_id: $.data.id } }
            - { call: "POST /api/offtakers", payload: { legal_name: "OffCo", hq_state_code: "PA", receiving_state_codes: ["PA", "WV"] }, as: BrokerOps, captures: { o_id: $.data.id } }
            - { call: "POST /api/streams", payload: { generator_id: "${g_id}", material_type: "FLY_ASH", declared_moisture_pct: 9.0, expected_tons_per_month: 500 }, as: Generator, as_user_id: "${g_id}", captures: { s_id: $.data.id } }
            - { call: "POST /api/streams/${s_id}/characterizations", payload: { lab_name: "LabCo", sampled_on: "2026-07-01", ph: 7.2, arsenic_ppm: 3.0, lead_ppm: 2.0, moisture_pct_measured: 9.5 }, as: Generator, as_user_id: "${g_id}", captures: { c_id: $.data.id } }
            - { call: "POST /api/characterizations/${c_id}/verify", payload: {}, as: BrokerOps }
            - { call: "POST /api/supply-agreements", payload: { generator_id: "${g_id}", stream_id: "${s_id}", committed_monthly_tons: 1000, revenue_share_pct_to_generator: 0.5, freight_share_pct_to_generator: 0.5, term_start: "2026-01-01", term_end: "2026-12-31" }, as: Generator, as_user_id: "${g_id}", captures: { a1_id: $.data.id } }
            - { call: "POST /api/supply-agreements/${a1_id}/activate", payload: {}, as: BrokerOps }
            - { call: "GET /api/supply-agreements/${a1_id}", payload: {}, as: BrokerOps, captures: { a1_v: $.data.version } }
            - { call: "POST /api/supply-agreements", payload: { generator_id: "${g_id}", stream_id: "${s_id}", committed_monthly_tons: 1000, revenue_share_pct_to_generator: 0.5, freight_share_pct_to_generator: 0.3, term_start: "2026-01-01", term_end: "2026-12-31" }, as: Generator, as_user_id: "${g_id}", captures: { a2_id: $.data.id } }
            - { call: "POST /api/supply-agreements/${a2_id}/activate", payload: {}, as: BrokerOps }
            - { call: "GET /api/supply-agreements/${a2_id}", payload: {}, as: BrokerOps, captures: { a2_v: $.data.version } }
            - { call: "POST /api/offtake-commitments", payload: { offtaker_id: "${o_id}", stream_id: "${s_id}", destination_state_code: "PA", committed_monthly_tons: 3000, max_moisture_pct: 10.0, max_arsenic_ppm: 5.0 }, as: Offtaker, as_user_id: "${o_id}", captures: { k_id: $.data.id } }
            - { call: "POST /api/offtake-commitments/${k_id}/activate", payload: {}, as: BrokerOps }
            - { call: "POST /api/price-index-entries", payload: { material_type: "FLY_ASH", region_code: "PA", effective_from: "2026-01-01", price_cents_per_ton: 300 }, as: BrokerOps }
          trigger:
            - { call: "POST /api/shipments", payload: { supply_agreement_id: "${a1_id}", offtake_commitment_id: "${k_id}", pickup_date: "2026-08-05", distance_miles: 600, gross_tons: 10, loading_moisture_pct: 8.0, expected_supply_agreement_version: "${a1_v}" }, as: Generator, as_user_id: "${g_id}", captures: { sa_id: $.data.id } }
            - { call: "POST /api/shipments", payload: { supply_agreement_id: "${a2_id}", offtake_commitment_id: "${k_id}", pickup_date: "2026-08-05", distance_miles: 350, gross_tons: 10, loading_moisture_pct: 8.0, expected_supply_agreement_version: "${a2_v}" }, as: Generator, as_user_id: "${g_id}", captures: { sb_id: $.data.id } }
          assert:
            - "Shipment.${sa_id}.freight_total_cents == 187000"
            - "Shipment.${sa_id}.generator_freight_share_cents == 60000"
            - "Shipment.${sa_id}.broker_freight_share_cents == 127000"
            - "Shipment.${sb_id}.freight_total_cents == 134500"
            - "Shipment.${sb_id}.generator_freight_share_cents == 40350"
            - "Shipment.${sb_id}.broker_freight_share_cents == 94150"

      - name: settlement_rounding_order_pinned
        grounds:
          - calculations.shipment_settlement
          - entities.Shipment.fields.net_billable_tons
          - entities.Shipment.fields.final_gross_revenue_cents
        distinguishing_aspect: |
          Mode (b): nested rounding with pinned order - net tons are rounded to 3 decimals
          BEFORE the money multiply, and the broker share takes the residual. 17.75 gross tons
          with 1.9% deduction gives 17.41275 -> 17.413 t; x 999 cents = 17395.587 -> 17396,
          whereas multiplying unrounded tons would give 17395.337 -> 17395. The scaffold pins
          17396. Different mode than freight_tiered_marginal_rates_with_share_cap (mode (a)).
        test_recipe:
          setup:
            - "Dispatch-ready PA chain; agreement rev share 0.475, freight share 0.10, committed 500; commitment committed 500, max_moisture 10.0, max_arsenic 5.0; index entry 999 cents/ton effective 2026-01-01"
            - "Logical clock at default 2026-08-01T00:00:00Z (acceptance date 2026-08-01, priced at 999)"
          setup_api_calls:
            - { call: "POST /api/generators", payload: { legal_name: "GenCo", hq_state_code: "OH", contact_email: "g@x.com" }, as: BrokerOps, captures: { g_id: $.data.id } }
            - { call: "POST /api/offtakers", payload: { legal_name: "OffCo", hq_state_code: "PA", receiving_state_codes: ["PA", "WV"] }, as: BrokerOps, captures: { o_id: $.data.id } }
            - { call: "POST /api/streams", payload: { generator_id: "${g_id}", material_type: "FLY_ASH", declared_moisture_pct: 9.0, expected_tons_per_month: 500 }, as: Generator, as_user_id: "${g_id}", captures: { s_id: $.data.id } }
            - { call: "POST /api/streams/${s_id}/characterizations", payload: { lab_name: "LabCo", sampled_on: "2026-07-01", ph: 7.2, arsenic_ppm: 3.0, lead_ppm: 2.0, moisture_pct_measured: 9.5 }, as: Generator, as_user_id: "${g_id}", captures: { c_id: $.data.id } }
            - { call: "POST /api/characterizations/${c_id}/verify", payload: {}, as: BrokerOps }
            - { call: "POST /api/streams/${s_id}/eligibility-determinations", payload: { state_code: "PA", use_case: "CEMENT_ADDITIVE", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: ComplianceOfficer, as_user_id: "co_file", captures: { d_id: $.data.id } }
            - { call: "POST /api/eligibility-determinations/${d_id}/submit", payload: {}, as: ComplianceOfficer, as_user_id: "co_file" }
            - { call: "POST /api/eligibility-determinations/${d_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co_appr" }
            - { call: "POST /api/state-permits", payload: { state_code: "PA", material_type: "FLY_ASH", regime: "PERMIT", permit_number: "PA-001", issued_on: "2026-01-01", expires_on: "2026-12-31" }, as: ComplianceOfficer, as_user_id: "co_file", captures: { p_id: $.data.id } }
            - { call: "POST /api/state-permits/${p_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_file" }
            - { call: "POST /api/supply-agreements", payload: { generator_id: "${g_id}", stream_id: "${s_id}", committed_monthly_tons: 500, revenue_share_pct_to_generator: 0.475, freight_share_pct_to_generator: 0.1, term_start: "2026-01-01", term_end: "2026-12-31" }, as: Generator, as_user_id: "${g_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/supply-agreements/${a_id}/activate", payload: {}, as: BrokerOps }
            - { call: "GET /api/supply-agreements/${a_id}", payload: {}, as: BrokerOps, captures: { a_v: $.data.version } }
            - { call: "POST /api/offtake-commitments", payload: { offtaker_id: "${o_id}", stream_id: "${s_id}", destination_state_code: "PA", committed_monthly_tons: 500, max_moisture_pct: 10.0, max_arsenic_ppm: 5.0 }, as: Offtaker, as_user_id: "${o_id}", captures: { k_id: $.data.id } }
            - { call: "POST /api/offtake-commitments/${k_id}/activate", payload: {}, as: BrokerOps }
            - { call: "POST /api/price-index-entries", payload: { material_type: "FLY_ASH", region_code: "PA", effective_from: "2026-01-01", price_cents_per_ton: 999 }, as: BrokerOps }
          trigger:
            - { call: "POST /api/shipments", payload: { supply_agreement_id: "${a_id}", offtake_commitment_id: "${k_id}", pickup_date: "2026-08-05", distance_miles: 120, gross_tons: 17.75, loading_moisture_pct: 8.0, expected_supply_agreement_version: "${a_v}" }, as: Generator, as_user_id: "${g_id}", captures: { sh_id: $.data.id } }
            - { call: "POST /api/shipments/${sh_id}/dispatch", payload: {}, as: Generator, as_user_id: "${g_id}" }
            - { call: "POST /api/shipments/${sh_id}/deliver", payload: { destination_moisture_pct: 11.9, destination_arsenic_ppm: 3.0 }, as: Offtaker, as_user_id: "${o_id}" }
            - { call: "POST /api/shipments/${sh_id}/accept", payload: {}, as: Offtaker, as_user_id: "${o_id}" }
          assert:
            - "Shipment.${sh_id}.moisture_deduction_pct == 1.9"
            - "Shipment.${sh_id}.net_billable_tons == 17.413"
            - "Shipment.${sh_id}.final_gross_revenue_cents == 17396"
            - "Shipment.${sh_id}.final_generator_share_cents == 8263"
            - "Shipment.${sh_id}.final_broker_share_cents == 9133"
            - "Shipment.${sh_id}.freight_total_cents == 66400"
            - "Shipment.${sh_id}.generator_freight_share_cents == 6640"
            - "Shipment.${sh_id}.generator_net_payout_cents == 1623"
            - "Shipment.${sh_id}.provisional_settlement_cents == 17732"

  # =========================================================================
  # Rule 3 - non_linear_state_machine (Shipment cycle, ReuseEligibility cycles)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: shipment_reconditioning_cycle
        grounds:
          - state_machines.Shipment.REJECTED_to_RECONDITIONING
          - state_machines.Shipment.RECONDITIONING_to_DELIVERED
          - state_machines.Shipment.DELIVERED_to_ACCEPTED
        distinguishing_aspect: |
          Shipment is cyclic: DELIVERED -> REJECTED -> RECONDITIONING -> DELIVERED -> ACCEPTED;
          the reconditioned load re-enters DELIVERED with fresh measurements and is then accepted
          (net 20.0 t, revenue 6000 at the 300-cent index).
        test_recipe:
          setup:
            - "Dispatch-ready PA chain; agreement committed 500 (rev 0.6, freight 0.25); commitment committed 500 (max_moisture 10.0, max_arsenic 5.0); index 300 effective 2026-01-01; clock default 2026-08-01"
          setup_api_calls:
            - { call: "POST /api/generators", payload: { legal_name: "GenCo", hq_state_code: "OH", contact_email: "g@x.com" }, as: BrokerOps, captures: { g_id: $.data.id } }
            - { call: "POST /api/offtakers", payload: { legal_name: "OffCo", hq_state_code: "PA", receiving_state_codes: ["PA", "WV"] }, as: BrokerOps, captures: { o_id: $.data.id } }
            - { call: "POST /api/streams", payload: { generator_id: "${g_id}", material_type: "FLY_ASH", declared_moisture_pct: 9.0, expected_tons_per_month: 500 }, as: Generator, as_user_id: "${g_id}", captures: { s_id: $.data.id } }
