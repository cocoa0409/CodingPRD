# =============================================================================
# Scaffold: Propane / Heating Oil Delivery (Expert)
# =============================================================================

scenario: |
  Propane / Heating Oil Delivery: tank/customer profile, will-call vs automatic
  (degree-day) delivery, tank-monitor reading, route scheduling, price plan
  (fixed/cap/market), budget pay, leak/safety check, tank lease/rental

domain_name: propane-heating-oil-delivery
api_prefix: ""
# api_prefix is empty: resources are globally addressable by id at the top level
# (`GET /<collection>/{id}`) and lists are filterable by foreign key
# (`GET /<collection>?<fk>=...`). Nested POST/action paths express ownership.

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: hybrid
  # Account-rooted resources (PricePlan, Tank, lease/inspection/order/budget) form a
  # hierarchy; Truck/DeliveryRoute and the config entities (DegreeDayReading, MarketPrice)
  # are flat peers referenced by FK across the hierarchy.

  state_machine_shape: branching
  # DeliveryOrder branches and cycles (SCHEDULED<->CREATED revert, HOLD loop); Tank carries
  # two independent state dimensions (service_status x delivery_mode-driven reorder_status).

  relationship_patterns:
    - one_to_many        # Account -> Tank, Account -> DeliveryOrder, Tank -> reading/lease/inspection
    - cross_aggregate    # DeliveryOrder -> DeliveryRoute (under Truck), Tank -> region config

  role_model: peer_roles
  # Dispatcher owns routes/scheduling; AccountManager owns accounts/plans/tanks/leases;
  # Driver owns delivery completion + monitor readings; Inspector owns safety checks;
  # Customer (entity_backed:Account) owns will-call requests + budget enrollment.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: customer_name, type: string, source: input, description: "Customer / household name" }
      - { name: region_code, type: string, source: input, description: "Service region code, e.g. NE_01; keys MarketPrice and DegreeDayReading lookups", constraints: "non-empty string" }
      - { name: fuel_type, type: enum, source: input, description: "Fuel the account is served", constraints: "PROPANE | HEATING_OIL" }
      - { name: service_status, type: enum, source: system, default: ACTIVE, description: "Account service lifecycle", constraints: "ACTIVE | SUSPENDED | CLOSED" }
      - { name: credit_balance_cents, type: integer, source: computed, default: 0, description: "Running account credit (positive) or amount owed (negative); debited on delivery invoice, credited by budget-pay installments and delivery reversals" }
      - { name: active_price_plan_id, type: string, source: computed, default: null, description: "FK -> PricePlan.id; the currently ACTIVE PricePlan for this account (null until one is activated)" }
      - { name: clock_now, type: datetime, source: system, description: "Not stored; documents that delivery/lease/budget date math reads the system clock set via /_clock/set_current_utc" }

  - name: PricePlan
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: plan_type, type: enum, source: input, description: "Pricing model", constraints: "FIXED | CAP | MARKET" }
      - { name: locked_price_cents_per_gallon, type: integer, source: input, default: null, description: "Per-gallon price locked at activation; REQUIRED for FIXED, ignored for MARKET", constraints: ">= 1 when plan_type=FIXED" }
      - { name: cap_price_cents_per_gallon, type: integer, source: input, default: null, description: "Ceiling per-gallon price; REQUIRED for CAP, ignored otherwise", constraints: ">= 1 when plan_type=CAP" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Plan lifecycle", constraints: "DRAFT | ACTIVE | EXPIRED" }
      - { name: effective_from, type: datetime, source: system, default: null, description: "When the plan became ACTIVE (clock at activation)" }

  - name: Tank
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: capacity_gallons, type: integer, source: input, description: "Usable tank capacity in whole gallons", constraints: ">= 1" }
      - { name: current_gallons, type: integer, source: computed, default: 0, description: "Last-known fuel level in gallons; updated by monitor readings and by deliveries" }
      - { name: reorder_threshold_pct, type: integer, source: input, default: 30, description: "Auto-reorder fires when projected fill fraction <= this percent of capacity", constraints: "1..99" }
      - { name: k_factor, type: integer, source: input, description: "Degree-day burn rate: gallons consumed per heating-degree-day (HDD), expressed in milli-gallons/HDD to stay integer", constraints: ">= 1" }
      - { name: delivery_mode, type: enum, source: input, default: WILL_CALL, description: "Replenishment mode", constraints: "WILL_CALL | AUTOMATIC" }
      - { name: monitor_installed, type: boolean, source: input, default: false, description: "Whether a telemetry tank monitor is installed (gates monitor-based projection variant)" }
      - { name: last_delivery_at, type: datetime, source: computed, default: null, description: "Clock value when the most recent DeliveryOrder for this tank was DELIVERED" }
      - { name: last_reading_at, type: datetime, source: computed, default: null, description: "Clock value of the most recent TankMonitorReading" }
      - { name: service_status, type: enum, source: system, default: IN_SERVICE, description: "Physical tank lifecycle dimension", constraints: "IN_SERVICE | LOCKED_OUT | DECOMMISSIONED" }
      - { name: reorder_status, type: enum, source: computed, default: OK, description: "Reorder dimension recomputed on readings/deliveries", constraints: "OK | DUE" }

  - name: TankMonitorReading
    parent: Tank
    common_fields: false
    fields:
      - { name: tank_id, type: string, source: system, description: "FK -> Tank.id" }
      - { name: reading_gallons, type: integer, source: input, description: "Observed fuel level in gallons", constraints: "0..tank.capacity_gallons" }
      - { name: read_at, type: datetime, source: input, description: "Clock timestamp of the reading (ISO 8601 UTC)" }

  - name: DegreeDayReading
    parent: null
    common_fields: false
    fields:
      - { name: region_code, type: string, source: input, description: "Region these heating-degree-days apply to (matches Account.region_code)" }
      - { name: reading_date, type: datetime, source: input, description: "Calendar date (UTC midnight) the HDD total covers" }
      - { name: heating_degree_days, type: integer, source: input, description: "Whole heating-degree-days accumulated that date", constraints: ">= 0" }

  - name: MarketPrice
    parent: null
    common_fields: true
    fields:
      - { name: region_code, type: string, source: input, description: "Region this market quote applies to" }
      - { name: fuel_type, type: enum, source: input, description: "Fuel the quote covers", constraints: "PROPANE | HEATING_OIL" }
      - { name: market_price_cents_per_gallon, type: integer, source: input, description: "Current spot per-gallon market price", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Quote lifecycle; superseding a quote EXPIRES the prior one", constraints: "ACTIVE | EXPIRED" }

  - name: TankLease
    parent: Tank
    common_fields: true
    fields:
      - { name: tank_id, type: string, source: system, description: "FK -> Tank.id" }
      - { name: monthly_rent_cents, type: integer, source: input, description: "Monthly rental charge in cents", constraints: ">= 0" }
      - { name: lease_start, type: datetime, source: input, description: "Lease start (inclusive, half-open interval start)" }
      - { name: lease_end, type: datetime, source: input, description: "Lease end (exclusive, half-open interval end)", constraints: "lease_end > lease_start" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Lease lifecycle", constraints: "ACTIVE | TERMINATED" }

  - name: SafetyInspection
    parent: Tank
    common_fields: true
    fields:
      - { name: tank_id, type: string, source: system, description: "FK -> Tank.id" }
      - { name: result, type: enum, source: input, description: "Outcome of the leak/safety check", constraints: "PASSED | FAILED" }
      - { name: inspected_at, type: datetime, source: input, description: "Clock timestamp of the inspection" }
      - { name: notes, type: string, source: input, default: null, description: "Inspector notes" }

  - name: Truck
    parent: null
    common_fields: true
    fields:
      - { name: region_code, type: string, source: input, description: "Region the truck serves" }
      - { name: daily_capacity_gallons, type: integer, source: input, description: "Maximum gallons the truck can carry per route day", constraints: ">= 1" }
      - { name: turnaround_buffer_minutes, type: integer, source: input, default: 60, description: "Required idle buffer between two routes on this truck (closed-interval adjacency rule)", constraints: ">= 0" }

  - name: DeliveryRoute
    parent: Truck
    common_fields: true
    fields:
      - { name: truck_id, type: string, source: system, description: "FK -> Truck.id" }
      - { name: route_date, type: datetime, source: input, description: "Service date (UTC midnight) the route runs" }
      - { name: window_start, type: datetime, source: input, description: "Route window start (closed-interval start)" }
      - { name: window_end, type: datetime, source: input, description: "Route window end (closed-interval end)", constraints: "window_end > window_start" }
      - { name: status, type: enum, source: system, default: PLANNING, description: "Route lifecycle", constraints: "PLANNING | DISPATCHED | COMPLETED | CANCELLED" }
      - { name: reserved_gallons, type: integer, source: computed, default: 0, description: "Sum of gallons over SCHEDULED DeliveryOrders assigned to this route" }

  - name: DeliveryOrder
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: tank_id, type: string, source: input, description: "FK -> Tank.id; the tank to fill" }
      - { name: route_id, type: string, source: computed, default: null, description: "FK -> DeliveryRoute.id; set on SCHEDULED, cleared on revert" }
      - { name: origin, type: enum, source: system, description: "How the order was raised", constraints: "WILL_CALL | AUTOMATIC" }
      - { name: requested_gallons, type: integer, source: input, description: "Gallons requested (will-call) or computed fill-to-capacity target (automatic)", constraints: ">= 1" }
      - { name: priority, type: enum, source: input, default: STANDARD, description: "Scheduling priority; EMERGENCY adds a surcharge and is allocated before STANDARD", constraints: "STANDARD | EMERGENCY" }
      - { name: status, type: enum, source: system, default: CREATED, description: "Order lifecycle", constraints: "CREATED | SCHEDULED | HOLD | DELIVERED | CANCELLED" }
      - { name: delivered_gallons, type: integer, source: computed, default: null, description: "Actual gallons pumped, recorded at delivery" }
      - { name: price_cents_per_gallon, type: integer, source: computed, default: null, description: "Effective per-gallon price resolved from the account's ACTIVE PricePlan at delivery" }
      - { name: invoice_total_cents, type: integer, source: computed, default: null, description: "Total invoiced amount at delivery (fuel + surcharges)" }
      - { name: budget_plan_id, type: string, source: computed, default: null, description: "FK -> BudgetPlan.id; the BudgetPlan whose actuals this delivery settled into (null if account not on budget pay)" }

  - name: BudgetPlan
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: plan_year_start, type: datetime, source: input, description: "First day of the 12-month budget window (UTC midnight)" }
      - { name: estimated_annual_gallons, type: integer, source: input, description: "Forecast annual gallons used to size installments", constraints: ">= 1" }
      - { name: estimated_price_cents_per_gallon, type: integer, source: input, description: "Per-gallon price assumption used to size installments", constraints: ">= 1" }
      - { name: monthly_installment_cents, type: integer, source: computed, default: null, description: "Forward-looking even monthly installment (estimated annual cost / 12)" }
      - { name: installments_paid_count, type: integer, source: computed, default: 0, description: "Count of installments posted so far" }
      - { name: actual_cost_to_date_cents, type: integer, source: computed, default: 0, description: "Chronological sum of settled DeliveryOrder.invoice_total_cents for this plan" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Budget plan lifecycle", constraints: "ACTIVE | RECONCILED" }
      - { name: settlement_balance_cents, type: integer, source: computed, default: 0, description: "Reconciliation delta = installments paid - actual cost to date (positive = customer credit, negative = customer owes)" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Account
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /accounts/{accountId}/suspend"
        actor: AccountManager
        preconditions:
          - "Account.service_status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "service_status -> SUSPENDED"
          - "increments Account.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /accounts/{accountId}/reactivate"
        actor: AccountManager
        preconditions:
          - "Account.service_status == SUSPENDED (else ERR_INVALID_STATE)"
        side_effects:
          - "service_status -> ACTIVE"
          - "increments Account.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /accounts/{accountId}/close"
        actor: AccountManager
        preconditions:
          - "No DeliveryOrder for this account in CREATED, SCHEDULED, or HOLD (else ERR_ACCOUNT_HAS_OPEN_ORDERS)"
          - "No TankLease under this account's tanks in ACTIVE (else ERR_ACCOUNT_HAS_ACTIVE_LEASE)"
        side_effects:
          - "service_status -> CLOSED"
          - "increments Account.version by 1"
    note: "service_status is one dimension of the Account."

  - entity: PricePlan
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /accounts/{accountId}/price-plans/{planId}/activate"
        actor: AccountManager
        preconditions:
          - "PricePlan.status == DRAFT (else ERR_INVALID_STATE)"
          - "If plan_type==FIXED, locked_price_cents_per_gallon is set (else ERR_PLAN_PRICE_REQUIRED)"
          - "If plan_type==CAP, cap_price_cents_per_gallon is set (else ERR_PLAN_PRICE_REQUIRED)"
          - "If plan_type==MARKET, an ACTIVE MarketPrice exists for (account.region_code, account.fuel_type) (else ERR_NO_MARKET_PRICE)"
        side_effects:
          - "status -> ACTIVE; effective_from = clock_now"
          - "Any prior ACTIVE PricePlan on the account transitions ACTIVE -> EXPIRED (cascade)"
          - "Account.active_price_plan_id = this plan id (derived-field reconciliation)"
          - "increments Account.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (a newer PricePlan on the same account is activated)"
        actor: system
        preconditions:
          - "PricePlan.status == ACTIVE"
        side_effects:
          - "status -> EXPIRED"

  - entity: Tank
    initial_state: IN_SERVICE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: IN_SERVICE
        to: LOCKED_OUT
        trigger: "POST /tanks/{tankId}/inspections (with result=FAILED) OR POST /tanks/{tankId}/lockout"
        actor: Inspector
        preconditions:
          - "Tank.service_status == IN_SERVICE (else ERR_INVALID_STATE)"
        side_effects:
          - "service_status -> LOCKED_OUT"
          - "Any DeliveryOrder for this tank in CREATED or HOLD is left intact but cannot be SCHEDULED/DELIVERED while LOCKED_OUT (guard)"
      - from: LOCKED_OUT
        to: IN_SERVICE
        trigger: "POST /tanks/{tankId}/inspections (with result=PASSED)"
        actor: Inspector
        preconditions:
          - "Tank.service_status == LOCKED_OUT (else ERR_INVALID_STATE)"
        side_effects:
          - "service_status -> IN_SERVICE"
      - from: IN_SERVICE
        to: DECOMMISSIONED
        trigger: "POST /tanks/{tankId}/decommission"
        actor: AccountManager
        preconditions:
          - "No TankLease on this tank in ACTIVE (else ERR_ACCOUNT_HAS_ACTIVE_LEASE)"
          - "No DeliveryOrder for this tank in SCHEDULED or HOLD (else ERR_TANK_HAS_OPEN_ORDERS)"
        side_effects:
          - "service_status -> DECOMMISSIONED"
    note: "reorder_status (OK|DUE) is an independent computed dimension recomputed by readings/deliveries/auto-generation; it is not gated by service_status transitions."

  - entity: TankLease
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /tanks/{tankId}/leases/{leaseId}/terminate"
        actor: AccountManager
        preconditions:
          - "TankLease.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> TERMINATED"

  - entity: MarketPrice
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (a newer MarketPrice for the same region_code+fuel_type is created)"
        actor: system
        preconditions:
          - "MarketPrice.status == ACTIVE"
        side_effects:
          - "status -> EXPIRED"

  - entity: DeliveryRoute
    initial_state: PLANNING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNING
        to: DISPATCHED
        trigger: "POST /trucks/{truckId}/routes/{routeId}/dispatch"
        actor: Dispatcher
        preconditions:
          - "DeliveryRoute.status == PLANNING (else ERR_INVALID_STATE)"
          - "At least one DeliveryOrder is SCHEDULED on this route (else ERR_ROUTE_EMPTY)"
        side_effects:
          - "status -> DISPATCHED (orders remain SCHEDULED, now deliverable)"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "system (all SCHEDULED orders on the route reach DELIVERED or CANCELLED)"
        actor: system
        preconditions:
          - "DeliveryRoute.status == DISPATCHED"
          - "No DeliveryOrder on this route still in SCHEDULED"
        side_effects:
          - "status -> COMPLETED"
      - from: PLANNING
        to: CANCELLED
        trigger: "POST /trucks/{truckId}/routes/{routeId}/cancel"
        actor: Dispatcher
        preconditions:
          - "DeliveryRoute.status == PLANNING (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> CANCELLED"
          - "CASCADE: every DeliveryOrder with route_id == this route and status SCHEDULED reverts SCHEDULED -> CREATED"
          - "Each reverted order then clears route_id and the Truck capacity reservation for route_date is released (chained cascade; reserved_gallons recomputed to 0)"
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /trucks/{truckId}/routes/{routeId}/cancel"
        actor: Dispatcher
        preconditions:
          - "DeliveryRoute.status == DISPATCHED (else ERR_INVALID_STATE)"
          - "No DeliveryOrder on this route in DELIVERED (else ERR_ROUTE_HAS_DELIVERIES)"
        side_effects:
          - "status -> CANCELLED"
          - "CASCADE: every SCHEDULED DeliveryOrder on this route reverts SCHEDULED -> CREATED, clears route_id, releases reservation"

  - entity: DeliveryOrder
    initial_state: CREATED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: CREATED
        to: SCHEDULED
        trigger: "POST /accounts/{accountId}/delivery-orders/{orderId}/assign"
        actor: Dispatcher
        preconditions:
          - "DeliveryOrder.status == CREATED (else ERR_INVALID_STATE)"
          - "Target DeliveryRoute.status == PLANNING (else ERR_ROUTE_NOT_PLANNING) [Order->Route dependency]"
          - "Tank.service_status == IN_SERVICE (else ERR_TANK_NOT_IN_SERVICE) [Order->Tank dependency]"
          - "Tank has a SafetyInspection whose result==PASSED and is the most recent for that tank (else ERR_SAFETY_CHECK_REQUIRED)"
          - "Adding requested_gallons keeps Truck date capacity satisfied: route.reserved_gallons + requested_gallons <= truck.daily_capacity_gallons (else ERR_ROUTE_CAPACITY_EXCEEDED)"
        side_effects:
          - "status -> SCHEDULED; route_id = target route id"
          - "DeliveryRoute.reserved_gallons += requested_gallons (Truck capacity reserved; conserved quantity)"
      - from: SCHEDULED
        to: CREATED
        trigger: "POST /accounts/{accountId}/delivery-orders/{orderId}/unassign OR cascade from route cancel"
        actor: Dispatcher | system
        preconditions:
          - "DeliveryOrder.status == SCHEDULED (else ERR_INVALID_STATE)"
          - "Parent DeliveryRoute.status != DISPATCHED for the manual unassign path (else ERR_ROUTE_ALREADY_DISPATCHED)"
        side_effects:
          - "status -> CREATED; route_id cleared"
          - "DeliveryRoute.reserved_gallons -= requested_gallons (reservation released; capacity restored exactly)"
      - from: SCHEDULED
        to: HOLD
        trigger: "POST /accounts/{accountId}/delivery-orders/{orderId}/hold"
        actor: Dispatcher
        preconditions:
          - "DeliveryOrder.status == SCHEDULED (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> HOLD"
          - "DeliveryRoute.reserved_gallons -= requested_gallons (held order no longer reserves capacity); route_id retained for re-resume reference"
      - from: HOLD
        to: SCHEDULED
        trigger: "POST /accounts/{accountId}/delivery-orders/{orderId}/resume"
        actor: Dispatcher
        preconditions:
          - "DeliveryOrder.status == HOLD (else ERR_INVALID_STATE)"
          - "route_id's DeliveryRoute.status == PLANNING (else ERR_ROUTE_NOT_PLANNING)"
          - "route.reserved_gallons + requested_gallons <= truck.daily_capacity_gallons (else ERR_ROUTE_CAPACITY_EXCEEDED)"
        side_effects:
          - "status -> SCHEDULED"
          - "DeliveryRoute.reserved_gallons += requested_gallons (re-reserves; cyclic HOLD<->SCHEDULED)"
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /accounts/{accountId}/delivery-orders/{orderId}/deliver"
        actor: Driver
        preconditions:
          - "DeliveryOrder.status == SCHEDULED (else ERR_INVALID_STATE)"
          - "Parent DeliveryRoute.status == DISPATCHED (else ERR_ROUTE_NOT_DISPATCHED)"
          - "Tank.service_status == IN_SERVICE (else ERR_TANK_NOT_IN_SERVICE) [Order->Tank dependency]"
          - "Account has an ACTIVE PricePlan (else ERR_NO_ACTIVE_PRICE_PLAN)"
          - "delivered_gallons in body: 1 <= delivered_gallons; current_gallons + delivered_gallons <= tank.capacity_gallons (else ERR_DELIVERY_OVERFILL)"
        side_effects:
          - "status -> DELIVERED; delivered_gallons recorded"
          - "price_cents_per_gallon resolved via delivery_price calculation; invoice_total_cents computed via invoice_total calculation"
          - "CASCADE step 1: Tank.current_gallons += delivered_gallons; Tank.last_delivery_at = clock_now"
          - "CASCADE step 2: that Tank level change recomputes Tank.reorder_status via tank_reorder_projection (DUE->OK if now above threshold)"
          - "CASCADE step 3: Account.credit_balance_cents -= invoice_total_cents (debit) and, if account on an ACTIVE BudgetPlan, that BudgetPlan.actual_cost_to_date_cents += invoice_total_cents, settlement_balance_cents recomputed (budget_reconciliation), budget_plan_id stamped on the order"
          - "DeliveryRoute.reserved_gallons -= requested_gallons (reservation consumed)"
          - "If route now has no SCHEDULED orders, route auto-transitions DISPATCHED -> COMPLETED"
          - "increments Account.version by 1"
      - from: CREATED
        to: CANCELLED
        trigger: "POST /accounts/{accountId}/delivery-orders/{orderId}/cancel"
        actor: Dispatcher | Customer
        preconditions:
          - "DeliveryOrder.status == CREATED (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> CANCELLED"
      - from: HOLD
        to: CANCELLED
        trigger: "POST /accounts/{accountId}/delivery-orders/{orderId}/cancel"
        actor: Dispatcher | Customer
        preconditions:
          - "DeliveryOrder.status == HOLD (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> CANCELLED; route_id cleared (no reservation held while on HOLD, so no release needed)"
      - from: DELIVERED
        to: CANCELLED
        trigger: "POST /accounts/{accountId}/delivery-orders/{orderId}/reverse"
        actor: AccountManager
        preconditions:
          - "DeliveryOrder.status == DELIVERED (else ERR_INVALID_STATE)"
          - "expected_account_version matches Account.version (else ERR_STALE_VERSION)"
        side_effects:
          - "status -> CANCELLED (delivery reversed)"
          - "COMPENSATION: Tank.current_gallons -= delivered_gallons; Tank.reorder_status recomputed; Account.credit_balance_cents += invoice_total_cents"
          - "If budget_plan_id set: BudgetPlan.actual_cost_to_date_cents -= invoice_total_cents; settlement_balance_cents recomputed (ledger conserved across deliver+reverse)"
          - "increments Account.version by 1"

  - entity: BudgetPlan
    initial_state: ACTIVE
    terminal_states: [RECONCILED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /accounts/{accountId}/budget-plans/{budgetPlanId}/post-installment"
        actor: System | AccountManager
        preconditions:
          - "BudgetPlan.status == ACTIVE (else ERR_INVALID_STATE)"
          - "installments_paid_count < 12 (else ERR_BUDGET_PLAN_FULLY_PAID)"
        side_effects:
          - "installments_paid_count += 1"
          - "Account.credit_balance_cents += monthly_installment_cents (installment funds the account)"
          - "settlement_balance_cents recomputed (budget_reconciliation)"
      - from: ACTIVE
        to: RECONCILED
        trigger: "POST /accounts/{accountId}/budget-plans/{budgetPlanId}/reconcile"
        actor: AccountManager
        preconditions:
          - "BudgetPlan.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> RECONCILED"
          - "settlement_balance_cents finalized = (installments_paid_count * monthly_installment_cents) - actual_cost_to_date_cents"
          - "FINAL true-up: the finalized settlement_balance_cents is refunded out of the running ledger, i.e. Account.credit_balance_cents -= settlement_balance_cents (see budget_reconciliation FINAL variant)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: deliver-stale-account
    parent_entity: Account
    write_endpoint: "POST /accounts/{accountId}/delivery-orders/{orderId}/deliver"
    occ_field: "expected_account_version"
    description: |
      Delivering an order debits Account.credit_balance_cents and (for budget-pay
      accounts) advances BudgetPlan actuals. A delivery request that carries an
      Account.version older than the account's current version is rejected: the
      client's view of the account ledger is stale because another ledger-mutating
      delivery (or reversal) has already advanced it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: reverse-stale-account
    parent_entity: Account
    write_endpoint: "POST /accounts/{accountId}/delivery-orders/{orderId}/reverse"
    occ_field: "expected_account_version"
    description: |
      Reversing a delivery credits the account ledger back and backs out budget
      actuals. A reverse request carrying a stale Account.version is rejected,
      since a prior ledger mutation has already advanced the account version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: tank_reorder_projection
    trigger: "TankMonitorReading creation; DeliveryOrder deliver/reverse; POST /tanks/{tankId}/evaluate-reorder; auto-generation sweep"
    algorithm: forward_looking
    formula: |
      # Projects current fill fraction and flips reorder_status.
      # Two variants pick the level baseline differently (dual-variant on Tank domain).
      hdd_since = sum(DegreeDayReading.heating_degree_days
                      for region == account.region_code
                      AND reading_date >= baseline_at AND reading_date < clock_now)   # half-open
      consumed_gallons = floor(tank.k_factor * hdd_since / 1000)   # k_factor is milli-gallons/HDD
      projected_gallons = max(0, baseline_gallons - consumed_gallons)
      projected_pct = floor(projected_gallons * 100 / tank.capacity_gallons)
      reorder_status = DUE if projected_pct <= tank.reorder_threshold_pct else OK
    input_set: "DegreeDayReading rows for the account's region with reading_date in [baseline_at, clock_now); only rows in that half-open window count."
    constants:
      K_FACTOR_SCALE: 1000   # k_factor stored in milli-gallons per HDD
    precision: "integer gallons; floor on consumed_gallons and projected_pct"
    variants:
      - name: MONITOR_BASED
        when: "tank.monitor_installed == true AND a TankMonitorReading exists with read_at after last_delivery_at"
        difference: "baseline_gallons = latest TankMonitorReading.reading_gallons; baseline_at = that reading's read_at (chronological, actual-measured anchor)"
      - name: DEGREE_DAY_ESTIMATE
        when: "tank.monitor_installed == false OR no monitor reading after the baseline anchor"
        difference: "baseline_gallons = tank.current_gallons as last set by a delivery or at tank creation; baseline_at = tank.last_delivery_at, or tank.created_at when last_delivery_at is null (forward-looking model anchor) — yields a different projected_gallons than MONITOR_BASED for the same clock_now"

  - name: budget_reconciliation
    trigger: "BudgetPlan post-installment; DeliveryOrder deliver/reverse (actuals); BudgetPlan reconcile (final)"
    algorithm: chronological
    formula: |
      installments_funded = installments_paid_count * monthly_installment_cents
      settlement_balance_cents = installments_funded - actual_cost_to_date_cents
      # positive => customer is ahead (credit); negative => customer owes
    input_set: "actual_cost_to_date_cents is the chronological running sum of invoice_total_cents over DeliveryOrders with status DELIVERED whose budget_plan_id == this plan; installments accrue one per post-installment call."
    constants:
      MONTHS_PER_YEAR: 12
    precision: "integer cents"
    variants:
      - name: PROVISIONAL
        when: "BudgetPlan.status == ACTIVE; recomputed on each installment and each delivery"
        difference: "settlement_balance_cents is informational only; Account.credit_balance_cents is NOT trued-up to it — the ledger only carries posted installment credits and delivery debits as they occur"
      - name: FINAL
        when: "BudgetPlan reconcile (ACTIVE -> RECONCILED)"
        difference: "settlement_balance_cents is finalized and refunded out of the running ledger (Account.credit_balance_cents -= settlement_balance_cents), closing the plan — for identical installment/delivery history the account credit ends at a DIFFERENT value than the PROVISIONAL running ledger (which retains the settlement as credit)"

  - name: monthly_installment
    trigger: "BudgetPlan creation"
    algorithm: aggregation
    formula: |
      estimated_annual_cost_cents = estimated_annual_gallons * estimated_price_cents_per_gallon
      monthly_installment_cents = round_half_up(estimated_annual_cost_cents / 12)
    input_set: "estimated_annual_gallons and estimated_price_cents_per_gallon supplied at creation."
    constants:
      MONTHS_PER_YEAR: 12
    precision: "integer cents, round_half_up on the division by 12"

  - name: delivery_price
    trigger: "DeliveryOrder deliver (resolves price_cents_per_gallon)"
    algorithm: tiered_pricing
    formula: |
      # >=3 inputs (plan type, market quote, delivered gallons, priority) with
      # nested min/max and conditional branches => combinatorial mode (a).
      plan = account's ACTIVE PricePlan
      if plan.plan_type == FIXED:   base = plan.locked_price_cents_per_gallon
      elif plan.plan_type == MARKET: base = ACTIVE MarketPrice.market_price_cents_per_gallon for (region, fuel)
      elif plan.plan_type == CAP:    base = min(plan.cap_price_cents_per_gallon, ACTIVE MarketPrice.market_price_cents_per_gallon)
      # volume discount tier on delivered_gallons:
      if delivered_gallons >= VOL_TIER2_GALLONS:      discount_per_gal = VOL_TIER2_DISCOUNT_CENTS
      elif delivered_gallons >= VOL_TIER1_GALLONS:    discount_per_gal = VOL_TIER1_DISCOUNT_CENTS
      else:                                           discount_per_gal = 0
      price_cents_per_gallon = max(MIN_FLOOR_CENTS, base - discount_per_gal)
    input_set: "ACTIVE PricePlan for the account, ACTIVE MarketPrice for (region, fuel) when plan is MARKET/CAP, delivered_gallons."
    constants:
      VOL_TIER1_GALLONS: 150
      VOL_TIER1_DISCOUNT_CENTS: 5
      VOL_TIER2_GALLONS: 300
      VOL_TIER2_DISCOUNT_CENTS: 12
      MIN_FLOOR_CENTS: 50

  - name: invoice_total
    trigger: "DeliveryOrder deliver (after delivery_price resolves)"
    algorithm: aggregation
    formula: |
      # Combinatorial mode (b): nested rounding where ORDER matters. The scaffold PINS
      # "compute the single fuel line (gallons*price) then add the surcharge, rounding
      # the surcharge line separately, then sum" -- per-line rounding before summing.
      fuel_line_cents = delivered_gallons * price_cents_per_gallon            # exact, integer cents
      emergency_surcharge_cents = round_half_up(fuel_line_cents * EMERGENCY_SURCHARGE_PCT / 100)
                                   if order.priority == EMERGENCY else 0       # rounded on its OWN line
      off_route_fee_cents = OFF_ROUTE_FEE_CENTS if order.origin == WILL_CALL else 0
      invoice_total_cents = fuel_line_cents + emergency_surcharge_cents + off_route_fee_cents
    input_set: "delivered_gallons, resolved price_cents_per_gallon, order.priority, order.origin."
    constants:
      EMERGENCY_SURCHARGE_PCT: 10
      OFF_ROUTE_FEE_CENTS: 2500
    precision: "integer cents; round_half_up the emergency surcharge line BEFORE summing (per-line rounding, pinned order)"

  - name: auto_delivery_target
    trigger: "POST /tanks/{tankId}/generate-auto-order (auto-generation sweep) when reorder_status==DUE"
    algorithm: threshold
    formula: |
      # Fill-to-capacity target for AUTOMATIC tanks whose projection is DUE.
      requested_gallons = tank.capacity_gallons - projected_gallons   # from tank_reorder_projection
      # boundary: only DUE tanks generate; projected_pct <= reorder_threshold_pct is the trigger (<=, not <)
    input_set: "projected_gallons from tank_reorder_projection for the tank."
    constants: {}
    precision: "integer gallons"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "For Customer (entity_backed:Account) acting on an account-scoped resource, X-User-ID must equal the resource's account_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Customer-accessible account/order/budget endpoints"
  - priority: 4
    category: existence
    check: "All path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numbers positive where required"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 6
    category: state
    check: "Target resource in a state that permits the transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_referential
    check: "On assign: target DeliveryRoute must be PLANNING"
    error_id: ERR_ROUTE_NOT_PLANNING
    http_status: 409
    applies_to: "POST .../delivery-orders/{orderId}/assign, .../resume"
  - priority: 8
    category: business_safety
    check: "On assign/deliver: tank must be IN_SERVICE and have a most-recent PASSED SafetyInspection"
    error_id: "ERR_TANK_NOT_IN_SERVICE / ERR_SAFETY_CHECK_REQUIRED"
    http_status: 409
    applies_to: "POST .../delivery-orders/{orderId}/assign, .../deliver"
  - priority: 9
    category: business_temporal
    check: "On route create: route window must not collide with another non-cancelled route on the same truck (closed interval + turnaround buffer)"
    error_id: ERR_ROUTE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /trucks/{truckId}/routes"
  - priority: 10
    category: business_temporal
    check: "On lease create: lease window must not overlap another ACTIVE TankLease on the same tank (half-open [start,end) interval)"
    error_id: ERR_LEASE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /tanks/{tankId}/leases"
  - priority: 11
    category: business_fiscal
    check: "On assign/resume: route.reserved_gallons + requested_gallons must not exceed truck.daily_capacity_gallons"
    error_id: ERR_ROUTE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST .../delivery-orders/{orderId}/assign, .../resume"
  - priority: 12
    category: business_fiscal
    check: "On deliver: current_gallons + delivered_gallons must not exceed tank.capacity_gallons"
    error_id: ERR_DELIVERY_OVERFILL
    http_status: 409
    applies_to: "POST .../delivery-orders/{orderId}/deliver"
  - priority: 13
    category: business_constraint
    check: "On deliver: account must have an ACTIVE PricePlan; MARKET/CAP plans require an ACTIVE MarketPrice for (region, fuel)"
    error_id: "ERR_NO_ACTIVE_PRICE_PLAN / ERR_NO_MARKET_PRICE"
    http_status: 409
    applies_to: "POST .../delivery-orders/{orderId}/deliver"
  - priority: 14
    category: state
    check: "OCC: expected_account_version must equal Account.version on ledger-mutating delivery/reverse"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST .../delivery-orders/{orderId}/deliver, .../reverse"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Account ---
  - method: POST
    path: "/accounts"
    description: "Create a customer Account"
    roles: [AccountManager]
    code: 201
    input: [customer_name, region_code, fuel_type]
    output: Account
    side_effects: ["service_status=ACTIVE, credit_balance_cents=0, version=1"]
  - method: GET
    path: "/accounts/{accountId}"
    description: "Get an Account (single-resource read)"
    roles: [AccountManager, Dispatcher, Driver, Inspector, Customer]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: GET
    path: "/accounts"
    description: "List Accounts; filterable by active_price_plan_id (reverse-reachability for Account.active_price_plan_id -> PricePlan)"
    roles: [AccountManager, Dispatcher]
    code: 200
    input: ["region_code?", "service_status?", "active_price_plan_id?"]
    output: "Account[]"
    side_effects: []
  - method: POST
    path: "/accounts/{accountId}/suspend"
    description: "Suspend an Account"
    roles: [AccountManager]
    code: 200
    input: []
    output: Account
    side_effects: ["service_status -> SUSPENDED", "increments Account.version by 1"]
  - method: POST
    path: "/accounts/{accountId}/reactivate"
    description: "Reactivate a SUSPENDED Account"
    roles: [AccountManager]
    code: 200
    input: []
    output: Account
    side_effects: ["service_status -> ACTIVE", "increments Account.version by 1"]
  - method: POST
    path: "/accounts/{accountId}/close"
    description: "Close an Account"
    roles: [AccountManager]
    code: 200
    input: []
    output: Account
    side_effects: ["service_status -> CLOSED", "increments Account.version by 1"]

  # --- PricePlan ---
  - method: POST
    path: "/accounts/{accountId}/price-plans"
    description: "Create a DRAFT PricePlan for an account"
    roles: [AccountManager]
    code: 201
    input: [plan_type, "locked_price_cents_per_gallon?", "cap_price_cents_per_gallon?"]
    output: PricePlan
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/price-plans/{planId}"
    description: "Get a PricePlan (single-resource read)"
    roles: [AccountManager, Dispatcher, Customer]
    code: 200
    input: []
    output: PricePlan
    side_effects: []
  - method: GET
    path: "/price-plans"
    description: "List PricePlans; filter by account_id (reverse-reachability for PricePlan.account_id -> Account)"
    roles: [AccountManager, Dispatcher, Customer]
    code: 200
    input: ["account_id?", "status?"]
    output: "PricePlan[]"
    side_effects: []
  - method: POST
    path: "/accounts/{accountId}/price-plans/{planId}/activate"
    description: "Activate a DRAFT PricePlan (expires any prior ACTIVE plan)"
    roles: [AccountManager]
    code: 200
    input: []
    output: PricePlan
    side_effects:
      - "status -> ACTIVE; effective_from set"
      - "prior ACTIVE PricePlan -> EXPIRED (cascade)"
      - "Account.active_price_plan_id updated"
      - "increments Account.version by 1"

  # --- Tank ---
  - method: POST
    path: "/accounts/{accountId}/tanks"
    description: "Create a Tank under an account"
    roles: [AccountManager]
    code: 201
    input: [capacity_gallons, k_factor, "reorder_threshold_pct?", "delivery_mode?", "monitor_installed?", "current_gallons?"]
    output: Tank
    side_effects: ["service_status=IN_SERVICE, reorder_status=OK"]
  - method: GET
    path: "/tanks/{tankId}"
    description: "Get a Tank (single-resource read)"
    roles: [AccountManager, Dispatcher, Driver, Inspector, Customer]
    code: 200
    input: []
    output: Tank
    side_effects: []
  - method: GET
    path: "/tanks"
    description: "List Tanks; filter by account_id (reverse-reachability for Tank.account_id -> Account)"
    roles: [AccountManager, Dispatcher, Driver, Inspector, Customer]
    code: 200
    input: ["account_id?", "service_status?", "reorder_status?"]
    output: "Tank[]"
    side_effects: []
  - method: POST
    path: "/tanks/{tankId}/lockout"
    description: "Manually lock out a Tank from service"
    roles: [Inspector, AccountManager]
    code: 200
    input: []
    output: Tank
    side_effects: ["service_status -> LOCKED_OUT"]
  - method: POST
    path: "/tanks/{tankId}/decommission"
    description: "Decommission a Tank"
    roles: [AccountManager]
    code: 200
    input: []
    output: Tank
    side_effects: ["service_status -> DECOMMISSIONED"]
  - method: POST
    path: "/tanks/{tankId}/evaluate-reorder"
    description: "Recompute reorder_status via tank_reorder_projection at current clock"
    roles: [Dispatcher, AccountManager]
    code: 200
    input: []
    output: Tank
    side_effects: ["reorder_status recomputed (OK|DUE)"]
  - method: POST
    path: "/tanks/{tankId}/generate-auto-order"
    description: "If AUTOMATIC tank is DUE, create a CREATED AUTOMATIC DeliveryOrder with fill-to-capacity gallons"
    roles: [Dispatcher]
    code: 201
    input: []
    output: DeliveryOrder
    side_effects: ["auto_delivery_target computes requested_gallons", "DeliveryOrder origin=AUTOMATIC, status=CREATED; ERR_TANK_NOT_DUE if reorder_status==OK; ERR_TANK_NOT_AUTOMATIC if delivery_mode==WILL_CALL"]

  # --- TankMonitorReading ---
  - method: POST
    path: "/tanks/{tankId}/readings"
    description: "Record a tank-monitor reading"
    roles: [Driver, Inspector, Dispatcher]
    code: 201
    input: [reading_gallons, read_at]
    output: TankMonitorReading
    side_effects: ["Tank.current_gallons = reading_gallons; Tank.last_reading_at = read_at", "Tank.reorder_status recomputed via tank_reorder_projection"]
  - method: GET
    path: "/tank-readings/{readingId}"
    description: "Get a TankMonitorReading (single-resource read)"
    roles: [AccountManager, Dispatcher, Driver, Inspector, Customer]
    code: 200
    input: []
    output: TankMonitorReading
    side_effects: []
  - method: GET
    path: "/tank-readings"
    description: "List monitor readings; filter by tank_id (reverse-reachability for TankMonitorReading.tank_id -> Tank)"
    roles: [AccountManager, Dispatcher, Driver, Inspector, Customer]
    code: 200
    input: ["tank_id?"]
    output: "TankMonitorReading[]"
    side_effects: []

  # --- DegreeDayReading ---
  - method: POST
    path: "/degree-day-readings"
    description: "Record a regional heating-degree-day total for a date"
    roles: [Dispatcher, AccountManager]
    code: 201
    input: [region_code, reading_date, heating_degree_days]
    output: DegreeDayReading
    side_effects: []
  - method: GET
    path: "/degree-day-readings"
    description: "List degree-day readings"
    roles: [AccountManager, Dispatcher]
    code: 200
    input: ["region_code?"]
    output: "DegreeDayReading[]"
    side_effects: []

  # --- MarketPrice ---
  - method: POST
    path: "/market-prices"
    description: "Publish a market price quote (expires prior ACTIVE quote for same region+fuel)"
    roles: [AccountManager]
    code: 201
    input: [region_code, fuel_type, market_price_cents_per_gallon]
    output: MarketPrice
    side_effects: ["status=ACTIVE; prior ACTIVE quote for same region_code+fuel_type -> EXPIRED (cascade)"]
  - method: GET
    path: "/market-prices/{marketPriceId}"
    description: "Get a MarketPrice (single-resource read)"
    roles: [AccountManager, Dispatcher, Customer]
    code: 200
    input: []
    output: MarketPrice
    side_effects: []
  - method: GET
    path: "/market-prices"
    description: "List market prices"
    roles: [AccountManager, Dispatcher, Customer]
    code: 200
    input: ["region_code?", "fuel_type?", "status?"]
    output: "MarketPrice[]"
    side_effects: []

  # --- TankLease ---
  - method: POST
    path: "/tanks/{tankId}/leases"
    description: "Create a tank lease (rental) period"
    roles: [AccountManager]
    code: 201
    input: [monthly_rent_cents, lease_start, lease_end]
    output: TankLease
    side_effects: ["status=ACTIVE; ERR_LEASE_PERIOD_OVERLAP if overlaps another ACTIVE lease on the tank"]
  - method: GET
    path: "/tank-leases/{leaseId}"
    description: "Get a TankLease (single-resource read)"
    roles: [AccountManager, Customer]
    code: 200
    input: []
    output: TankLease
    side_effects: []
  - method: GET
    path: "/tank-leases"
    description: "List leases; filter by tank_id (reverse-reachability for TankLease.tank_id -> Tank)"
    roles: [AccountManager, Customer]
    code: 200
    input: ["tank_id?", "status?"]
    output: "TankLease[]"
    side_effects: []
  - method: POST
    path: "/tanks/{tankId}/leases/{leaseId}/terminate"
    description: "Terminate an ACTIVE lease"
    roles: [AccountManager]
    code: 200
    input: []
    output: TankLease
    side_effects: ["status -> TERMINATED"]

  # --- SafetyInspection ---
  - method: POST
    path: "/tanks/{tankId}/inspections"
    description: "Record a leak/safety inspection (PASSED or FAILED)"
    roles: [Inspector]
    code: 201
    input: [result, inspected_at, "notes?"]
    output: SafetyInspection
    side_effects:
      - "If result==FAILED and tank IN_SERVICE: Tank.service_status -> LOCKED_OUT"
      - "If result==PASSED and tank LOCKED_OUT: Tank.service_status -> IN_SERVICE"
  - method: GET
    path: "/safety-inspections/{inspectionId}"
    description: "Get a SafetyInspection (single-resource read)"
    roles: [AccountManager, Dispatcher, Inspector, Customer]
    code: 200
    input: []
    output: SafetyInspection
    side_effects: []
  - method: GET
    path: "/safety-inspections"
    description: "List safety inspections; filter by tank_id (reverse-reachability for SafetyInspection.tank_id -> Tank)"
    roles: [AccountManager, Dispatcher, Inspector, Customer]
    code: 200
    input: ["tank_id?", "result?"]
    output: "SafetyInspection[]"
    side_effects: []

  # --- Truck ---
  - method: POST
    path: "/trucks"
    description: "Create a delivery Truck"
    roles: [Dispatcher]
    code: 201
    input: [region_code, daily_capacity_gallons, "turnaround_buffer_minutes?"]
    output: Truck
    side_effects: []
  - method: GET
    path: "/trucks/{truckId}"
    description: "Get a Truck"
    roles: [Dispatcher, AccountManager]
    code: 200
    input: []
    output: Truck
    side_effects: []
  - method: GET
    path: "/trucks"
    description: "List Trucks"
    roles: [Dispatcher, AccountManager]
    code: 200
    input: ["region_code?"]
    output: "Truck[]"
    side_effects: []

  # --- DeliveryRoute ---
  - method: POST
    path: "/trucks/{truckId}/routes"
    description: "Create a route on a truck for a date/window"
    roles: [Dispatcher]
    code: 201
    input: [route_date, window_start, window_end]
    output: DeliveryRoute
    side_effects: ["status=PLANNING, reserved_gallons=0; ERR_ROUTE_WINDOW_CONFLICT if collides with another non-cancelled route on the truck"]
  - method: GET
    path: "/routes/{routeId}"
    description: "Get a DeliveryRoute (single-resource read)"
    roles: [Dispatcher, AccountManager, Driver]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: []
  - method: GET
    path: "/routes"
    description: "List routes; filter by truck_id (reverse-reachability for DeliveryRoute.truck_id -> Truck)"
    roles: [Dispatcher, AccountManager]
    code: 200
    input: ["truck_id?", "status?", "route_date?"]
    output: "DeliveryRoute[]"
    side_effects: []
  - method: POST
    path: "/trucks/{truckId}/routes/{routeId}/dispatch"
    description: "Dispatch a PLANNING route (must have >=1 SCHEDULED order)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: ["status -> DISPATCHED"]
  - method: POST
    path: "/trucks/{truckId}/routes/{routeId}/cancel"
    description: "Cancel a route; cascade-reverts SCHEDULED orders and releases reservations"
    roles: [Dispatcher]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects:
      - "status -> CANCELLED"
      - "CASCADE: SCHEDULED orders -> CREATED, route_id cleared, reserved_gallons released to 0"

  # --- DeliveryOrder ---
  - method: POST
    path: "/accounts/{accountId}/delivery-orders"
    description: "Create a will-call DeliveryOrder"
    roles: [Customer, Dispatcher]
    code: 201
    input: [tank_id, requested_gallons, "priority?"]
    output: DeliveryOrder
    side_effects: ["origin=WILL_CALL, status=CREATED"]
  - method: GET
    path: "/delivery-orders/{orderId}"
    description: "Get a DeliveryOrder (single-resource read)"
    roles: [AccountManager, Dispatcher, Driver, Customer]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: []
  - method: GET
    path: "/delivery-orders"
    description: "List delivery orders; filter by account_id / tank_id / route_id / budget_plan_id (reverse-reachability for all four DeliveryOrder FKs)"
    roles: [AccountManager, Dispatcher, Driver, Customer]
    code: 200
    input: ["account_id?", "tank_id?", "route_id?", "budget_plan_id?", "status?", "origin?"]
    output: "DeliveryOrder[]"
    side_effects: []
  - method: POST
    path: "/accounts/{accountId}/delivery-orders/{orderId}/assign"
    description: "Assign a CREATED order to a PLANNING route (reserves truck capacity)"
    roles: [Dispatcher]
    code: 200
    input: [route_id]
    output: DeliveryOrder
    side_effects: ["status -> SCHEDULED; route_id set; route.reserved_gallons += requested_gallons"]
  - method: POST
    path: "/accounts/{accountId}/delivery-orders/{orderId}/unassign"
    description: "Unassign a SCHEDULED order back to CREATED (releases reservation)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: ["status -> CREATED; route_id cleared; route.reserved_gallons -= requested_gallons"]
  - method: POST
    path: "/accounts/{accountId}/delivery-orders/{orderId}/hold"
    description: "Place a SCHEDULED order on HOLD (releases reservation, retains route_id)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: ["status -> HOLD; route.reserved_gallons -= requested_gallons"]
  - method: POST
    path: "/accounts/{accountId}/delivery-orders/{orderId}/resume"
    description: "Resume a HELD order back to SCHEDULED (re-reserves capacity)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: ["status -> SCHEDULED; route.reserved_gallons += requested_gallons"]
  - method: POST
    path: "/accounts/{accountId}/delivery-orders/{orderId}/deliver"
    description: "Mark a SCHEDULED order DELIVERED; prices, invoices, updates tank + ledger + budget"
    roles: [Driver]
    code: 200
    input: [delivered_gallons, expected_account_version]
    output: DeliveryOrder
    side_effects:
      - "status -> DELIVERED; delivered_gallons, price_cents_per_gallon, invoice_total_cents set"
      - "CASCADE: Tank.current_gallons += delivered_gallons -> reorder_status recompute -> Account.credit_balance_cents debit + BudgetPlan actuals update"
      - "route.reserved_gallons -= requested_gallons; route may auto-COMPLETE"
      - "increments Account.version by 1"
  - method: POST
    path: "/accounts/{accountId}/delivery-orders/{orderId}/cancel"
    description: "Cancel a CREATED or HOLD order"
    roles: [Dispatcher, Customer]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: ["status -> CANCELLED"]
  - method: POST
    path: "/accounts/{accountId}/delivery-orders/{orderId}/reverse"
    description: "Reverse a DELIVERED order (compensation): restore tank, credit ledger, back out budget actuals"
    roles: [AccountManager]
    code: 200
    input: [expected_account_version]
    output: DeliveryOrder
    side_effects:
      - "status -> CANCELLED"
      - "COMPENSATION: Tank.current_gallons -= delivered_gallons; reorder_status recompute; Account.credit_balance_cents += invoice_total_cents; BudgetPlan actuals backed out"
      - "increments Account.version by 1"

  # --- BudgetPlan ---
  - method: POST
    path: "/accounts/{accountId}/budget-plans"
    description: "Enroll an account in a budget-pay plan"
    roles: [AccountManager, Customer]
    code: 201
    input: [plan_year_start, estimated_annual_gallons, estimated_price_cents_per_gallon]
    output: BudgetPlan
    side_effects: ["status=ACTIVE; monthly_installment computed via monthly_installment calculation"]
  - method: GET
    path: "/budget-plans/{budgetPlanId}"
    description: "Get a BudgetPlan (single-resource read)"
    roles: [AccountManager, Customer]
    code: 200
    input: []
    output: BudgetPlan
    side_effects: []
  - method: GET
    path: "/budget-plans"
    description: "List budget plans; filter by account_id (reverse-reachability for BudgetPlan.account_id -> Account)"
    roles: [AccountManager, Customer]
    code: 200
    input: ["account_id?", "status?"]
    output: "BudgetPlan[]"
    side_effects: []
  - method: POST
    path: "/accounts/{accountId}/budget-plans/{budgetPlanId}/post-installment"
    description: "Post one monthly installment to the budget plan"
    roles: [AccountManager, System]
    code: 200
    input: []
    output: BudgetPlan
    side_effects: ["installments_paid_count += 1; Account.credit_balance_cents += monthly_installment_cents; settlement_balance_cents recomputed"]
  - method: POST
    path: "/accounts/{accountId}/budget-plans/{budgetPlanId}/reconcile"
    description: "Reconcile and close a budget plan (final settlement refunded out of account ledger)"
    roles: [AccountManager]
    code: 200
    input: []
    output: BudgetPlan
    side_effects: ["status -> RECONCILED; final settlement_balance_cents computed; Account.credit_balance_cents -= settlement_balance_cents (refund out)"]

  # --- Test-driving (clock) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the system clock used for delivery/lease/budget/projection date math"
    roles: [AccountManager, Dispatcher]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock_now := to_iso8601"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Customer X-User-ID does not match the account_id of the targeted resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum, non-positive quantity, lease_end <= lease_start, window_end <= window_start" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state that permits the requested transition" }
  - { id: ERR_ROUTE_NOT_PLANNING, http: 409, condition: "Assign/resume targets a route not in PLANNING" }
  - { id: ERR_ROUTE_NOT_DISPATCHED, http: 409, condition: "Deliver attempted on an order whose route is not DISPATCHED" }
  - { id: ERR_ROUTE_ALREADY_DISPATCHED, http: 409, condition: "Manual unassign attempted on an order whose route is already DISPATCHED" }
  - { id: ERR_ROUTE_EMPTY, http: 409, condition: "Dispatch attempted on a route with no SCHEDULED orders" }
  - { id: ERR_ROUTE_HAS_DELIVERIES, http: 409, condition: "Cancel attempted on a DISPATCHED route that already has DELIVERED orders" }
  - { id: ERR_TANK_NOT_IN_SERVICE, http: 409, condition: "Assign/deliver targets a tank whose service_status != IN_SERVICE" }
  - { id: ERR_SAFETY_CHECK_REQUIRED, http: 409, condition: "Assign/deliver targets a tank whose most-recent SafetyInspection is not PASSED (or none exists)" }
  - { id: ERR_TANK_HAS_OPEN_ORDERS, http: 409, condition: "Decommission attempted while tank has SCHEDULED/HOLD orders" }
  - { id: ERR_TANK_NOT_DUE, http: 409, condition: "Auto-order generation attempted on a tank whose reorder_status is OK" }
  - { id: ERR_TANK_NOT_AUTOMATIC, http: 409, condition: "Auto-order generation attempted on a WILL_CALL tank" }
  - { id: ERR_ROUTE_WINDOW_CONFLICT, http: 409, condition: "New route window collides with another non-cancelled route on the same truck within the turnaround buffer (closed interval)" }
  - { id: ERR_LEASE_PERIOD_OVERLAP, http: 409, condition: "New lease window overlaps an existing ACTIVE lease on the same tank (half-open interval)" }
  - { id: ERR_ROUTE_CAPACITY_EXCEEDED, http: 409, condition: "Assign/resume would push route.reserved_gallons above truck.daily_capacity_gallons" }
  - { id: ERR_DELIVERY_OVERFILL, http: 409, condition: "Deliver would push tank.current_gallons above capacity_gallons" }
  - { id: ERR_NO_ACTIVE_PRICE_PLAN, http: 409, condition: "Deliver attempted but account has no ACTIVE PricePlan" }
  - { id: ERR_NO_MARKET_PRICE, http: 409, condition: "MARKET/CAP plan needs an ACTIVE MarketPrice for (region, fuel) but none exists" }
  - { id: ERR_PLAN_PRICE_REQUIRED, http: 409, condition: "Activating a FIXED plan without locked price, or a CAP plan without cap price" }
  - { id: ERR_BUDGET_PLAN_FULLY_PAID, http: 409, condition: "post-installment attempted after 12 installments already posted" }
  - { id: ERR_ACCOUNT_HAS_OPEN_ORDERS, http: 409, condition: "Close attempted while account has CREATED/SCHEDULED/HOLD orders" }
  - { id: ERR_ACCOUNT_HAS_ACTIVE_LEASE, http: 409, condition: "Close/decommission attempted while an ACTIVE TankLease exists" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_account_version does not match Account.version on deliver/reverse" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AccountManager
    description: "Back-office account/plan/tank/lease/billing operations and admin overrides (reversals, reconciliation, decommission)"
    identity: opaque
    exclusive_operations:
      - "POST /accounts — create account"
      - "POST /accounts/{id}/suspend|reactivate|close — account lifecycle"
      - "POST /accounts/{id}/price-plans + /activate — price plan management"
      - "POST /accounts/{id}/tanks — create tank"
      - "POST /tanks/{id}/decommission — decommission tank"
      - "POST /tanks/{id}/leases + /terminate — lease management"
      - "POST /market-prices — publish market quote"
      - "POST /accounts/{id}/delivery-orders/{oid}/reverse — reverse a delivery"
      - "POST /accounts/{id}/budget-plans/{bid}/reconcile — reconcile budget plan"
    shared_operations:
      - "POST /tanks/{id}/lockout (with Inspector)"
      - "POST /tanks/{id}/evaluate-reorder (with Dispatcher)"
      - "POST /degree-day-readings (with Dispatcher)"
      - "POST /accounts/{id}/budget-plans + /post-installment (with Customer/System)"
      - "GET reads across accounts, tanks, plans, routes, leases, inspections"

  - name: Dispatcher
    description: "Routing and scheduling: trucks, routes, order assignment, dispatch, auto-order generation"
    identity: opaque
    exclusive_operations:
      - "POST /trucks — create truck"
      - "POST /trucks/{id}/routes + /dispatch + /cancel — route management"
      - "POST /tanks/{id}/generate-auto-order — auto-order generation"
      - "POST /accounts/{id}/delivery-orders/{oid}/assign|unassign|hold|resume — scheduling"
    shared_operations:
      - "POST /accounts/{id}/delivery-orders — create will-call order (with Customer)"
      - "POST /accounts/{id}/delivery-orders/{oid}/cancel (with Customer)"
      - "POST /tanks/{id}/readings (with Driver/Inspector)"
      - "POST /tanks/{id}/evaluate-reorder (with AccountManager)"
      - "POST /degree-day-readings (with AccountManager)"
      - "GET reads across accounts, tanks, routes, trucks, degree-day readings"

  - name: Driver
    description: "Field delivery: completes deliveries and records monitor readings"
    identity: opaque
    exclusive_operations:
      - "POST /accounts/{id}/delivery-orders/{oid}/deliver — complete delivery"
    shared_operations:
      - "POST /tanks/{id}/readings (with Dispatcher/Inspector)"
      - "GET reads on accounts, tanks, routes, delivery orders"

  - name: Inspector
    description: "Leak/safety inspections and tank lockout"
    identity: opaque
    exclusive_operations:
      - "POST /tanks/{id}/inspections — record safety inspection"
    shared_operations:
      - "POST /tanks/{id}/lockout (with AccountManager)"
      - "POST /tanks/{id}/readings (with Driver/Dispatcher)"
      - "GET reads on tanks, inspections, accounts"

  - name: Customer
    description: "Account owner: requests will-call deliveries, enrolls in budget pay, reads own resources"
    identity: "entity_backed:Account"
    exclusive_operations: []
    shared_operations:
      - "POST /accounts/{id}/delivery-orders — create will-call order on own account (with Dispatcher)"
      - "POST /accounts/{id}/delivery-orders/{oid}/cancel — cancel own CREATED/HOLD order (with Dispatcher)"
      - "POST /accounts/{id}/budget-plans + /post-installment — own budget enrollment/installments (with AccountManager/System)"
      - "GET reads scoped to own account (tanks, plans, leases, inspections, orders, budget plans, market prices)"

  - name: System
    description: "Automation role for system-triggered transitions (plan/quote expiry, route auto-complete, scheduled installments)"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /accounts/{id}/budget-plans/{bid}/post-installment (with AccountManager/Customer)"
