            - *cd2_clk1035
            - *cd2_demold
            - *cd2_disc
            - *cd2_trim1
            - *cd2_out1
            - *cd2_insp1
            - *cd2_trim2
            - *cd2_out2
            - *cd2_insp2
            - *cd2_whv1
            - *cd2_store1
            - *cd2_whv2
            - *cd2_store2
            - *cd2_cust
            - *cd2_ack
            - *cd2_shp
            - *cd2_shpv1
            - *cd2_line1
            - *cd2_shpv2
            - *cd2_line2
            - *cd2_seal
            - *cd2_clk1100
            - *cd2_depart
            - *cd2_clk0802
            - *cd2_deliver
            - *cd2_claim
            - *cd2_review
          trigger:
            - call: "GET /product-models/${pm}"
