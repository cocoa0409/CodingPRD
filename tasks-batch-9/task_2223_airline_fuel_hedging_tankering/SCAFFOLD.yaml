# =============================================================================
# PRD Benchmark Scaffold — Airline Fuel Hedging & Tankering
# §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in the
# sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2223. Airline Fuel Hedging & Tankering (airline fuel management): consumption forecasting by fleet, route and season for hedge sizing, hedge instrument selection across swaps, collars and options with policy limits on coverage percentage, counterparty credit, margin requirements and collateral posting, hedge accounting designation, effectiveness testing and earnings volatility management, into-plane fuel price differentials by station driving tankering decisions, tankering fuel burn penalty calculation against price savings with weight and performance limits, station supply contracts, consortium participation and inventory levels, monthly mark-to-market reporting and policy exception approval

domain_name: "airline-fuel-hedging-tankering"
api_prefix: "/fuel"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - ops_run_checkpoint
    - version_pinning_on_approval
    - derived_field_reconciliation
  entity_topology: graph
  # graph: HedgeInstrument links HedgeProgram x Counterparty; CollateralPosting links
  # Counterparty x HedgeInstrument; FlightLeg links Station (origin) x Station (destination);
  # PolicyException is polymorphic across HedgeProgram / HedgeInstrument / TankeringDirective.
  state_machine_shape: parallel
  # HedgeInstrument carries two independent dimensions (trade_status x accounting_status);
  # TankeringDirective is cyclic + branching; HedgeProgram is cyclic (return-to-SIZING) and
  # compound (activation gated on aggregate child coverage); MarkToMarketRun is an ops-run epoch.
  relationship_patterns:
    - one_to_many
    - many_to_many
    - polymorphic
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: HedgePolicy
    parent: null
    common_fields: true
    fields:
      - name: policy_code
        type: string
        source: input
        description: "Human-readable policy identifier."
        constraints: "1-32 chars; globally unique across HedgePolicy rows regardless of status"
      - name: fiscal_year
        type: integer
        source: input
        description: "Fiscal year the policy governs."
        constraints: "2020-2100; at most one HedgePolicy with status ACTIVE per fiscal_year"
      - name: max_coverage_pct
        type: number
        source: input
        description: "Upper bound on delta-adjusted hedge coverage for any program under this policy."
        constraints: "0 < value <= 100; 2 decimal places"
      - name: min_coverage_pct
        type: number
        source: input
        description: "Lower bound on planned delta-adjusted coverage required to activate a program."
        constraints: "0 <= value < max_coverage_pct; 2 decimal places"
      - name: max_single_counterparty_pct
        type: number
        source: input
        description: "Cap on one counterparty's EXECUTED notional as a percentage of program consumption_basis_gallons."
        constraints: "0 < value <= 100; 2 decimal places"
      - name: permitted_instrument_types
        type: array
        source: input
        description: "Instrument types this policy allows."
        constraints: "non-empty subset of {SWAP, COLLAR, CALL_OPTION}; no duplicates"
      - name: max_earnings_volatility_usd
        type: number
        source: input
        description: "Absolute undesignated mark-to-market value above which a program is in breach."
        constraints: "> 0; 2 decimal places"
      - name: max_tankering_uplift_gallons
        type: number
        source: input
        description: "Hard policy ceiling on tankering uplift for a single flight leg."
        constraints: "> 0"
      - name: min_days_cover
        type: number
        source: input
        description: "Minimum station days-of-cover below which a station is SHORT."
        constraints: "> 0; 2 decimal places"
      - name: eligible_fleet_types
        type: array
        source: input
        description: "Fleet types whose consumption forecasts enter the hedge sizing basis."
        constraints: "non-empty subset of {NARROWBODY, WIDEBODY, REGIONAL}; no duplicates"
      - name: status
        type: enum
        source: system
        description: "Policy lifecycle. Set to SUPERSEDED when a newer policy is created for the same fiscal_year."
        default: ACTIVE
        constraints: "ACTIVE | SUPERSEDED"
      - name: open_exception_count
        type: integer
        source: computed
        description: "Number of PolicyException rows with status REQUESTED that reference a program governed by this policy."
        default: 0

  - name: Counterparty
    parent: null
    common_fields: true
    fields:
      - name: counterparty_code
        type: string
        source: input
        description: "Short dealer code."
        constraints: "1-16 chars; globally unique"
      - name: legal_name
        type: string
        source: input
        description: "Legal entity name of the swap dealer or bank."
        constraints: "1-120 chars"
      - name: credit_rating
        type: enum
        source: input
        description: "Current external credit rating."
        constraints: "AA | A | BBB | BB"
      - name: credit_limit_usd
        type: number
        source: input
        description: "Maximum aggregate margin requirement the airline will carry against this counterparty."
        constraints: "> 0; 2 decimal places"
      - name: status
        type: enum
        source: system
        description: "APPROVED at creation; set to SUSPENDED whenever credit_rating is BB (creation or credit review), and back to APPROVED when a credit review raises the rating above BB."
        default: APPROVED
        constraints: "APPROVED | SUSPENDED"
      - name: utilized_credit_usd
        type: number
        source: computed
        description: "Sum of margin_requirement_usd over HedgeInstrument rows with this counterparty_id and trade_status == EXECUTED."
        default: 0
      - name: posted_collateral_usd
        type: number
        source: computed
        description: "Sum of posted_amount_usd over CollateralPosting rows with this counterparty_id and status == POSTED."
        default: 0
      - name: utilization_pct
        type: number
        source: computed
        description: "round(utilized_credit_usd / credit_limit_usd * 100, 2)."
        default: 0
      - name: credit_posture
        type: enum
        source: computed
        description: "Derived from utilization_pct per calculations.counterparty_credit_posture."
        default: NORMAL
        constraints: "NORMAL | WATCH | CONSTRAINED | BREACH"
      - name: open_margin_call_count
        type: integer
        source: computed
        description: "Count of CollateralPosting rows with this counterparty_id and status == REQUIRED."
        default: 0
      - name: last_review_note
        type: string
        source: system
        description: "Note recorded by the most recent credit review; null until the first review."
        default: null

  - name: Station
    parent: null
    common_fields: true
    fields:
      - name: iata_code
        type: string
        source: input
        description: "Three-letter station code."
        constraints: "exactly 3 uppercase letters; globally unique"
      - name: name
        type: string
        source: input
        description: "Station display name."
        constraints: "1-80 chars"
      - name: into_plane_fee_usd_per_gal
        type: number
        source: input
        description: "Into-plane handling fee added on top of the supply contract price at this station."
        constraints: ">= 0; 4 decimal places"
      - name: consortium_member
        type: boolean
        source: input
        description: "True when the airline participates in the station fuel consortium."
        default: false
      - name: consortium_share_pct
        type: number
        source: input
        description: "The airline's share of the consortium pool, in percent."
        default: 0
        constraints: "0 <= value <= 100; 2 decimal places; must be 0 when consortium_member is false"
      - name: consortium_pool_gallons
        type: number
        source: input
        description: "Total consortium tank farm inventory at this station."
        default: 0
        constraints: ">= 0; must be 0 when consortium_member is false"
      - name: avg_daily_liftings_gallons
        type: number
        source: input
        description: "Average daily uplift volume, used as the days-of-cover denominator."
        constraints: "> 0"
      - name: inventory_gallons
        type: number
        source: computed
        description: "Airline-owned inventory at this station. Moved only by inventory adjustments, tankering execution and tankering reconciliation."
        default: 0
      - name: effective_inventory_gallons
        type: number
        source: computed
        description: "inventory_gallons plus the airline's consortium entitlement per calculations.station_supply_posture."
        default: 0
      - name: days_cover
        type: number
        source: computed
        description: "round(effective_inventory_gallons / avg_daily_liftings_gallons, 2)."
        default: 0
      - name: supply_posture
        type: enum
        source: computed
        description: "Derived from days_cover and the ACTIVE HedgePolicy min_days_cover per calculations.station_supply_posture."
        default: SHORT
        constraints: "NORMAL | WATCH | SHORT"

  - name: SupplyContract
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: system
        description: "FK -> Station.id; taken from the path, never from the body."
      - name: contract_ref
        type: string
        source: input
        description: "Supplier contract reference."
        constraints: "1-32 chars; unique per station_id"
      - name: index_basis
        type: enum
        source: input
        description: "Published price index the contract prices off."
        constraints: "PLATTS_USGC | PLATTS_NWE | PLATTS_SGP"
      - name: index_price_usd_per_gal
        type: number
        source: input
        description: "Contracted index price per US gallon."
        constraints: "> 0; 4 decimal places"
      - name: differential_usd_per_gal
        type: number
        source: input
        description: "Supplier differential added to the index; may be negative."
        constraints: "4 decimal places; index_price_usd_per_gal + differential_usd_per_gal must be > 0"
      - name: term_start_date
        type: string
        source: input
        description: "First day the contract prices fuel, inclusive."
        constraints: "ISO 8601 date YYYY-MM-DD"
      - name: term_end_date
        type: string
        source: input
        description: "Last day the contract prices fuel, inclusive (closed interval)."
        constraints: "ISO 8601 date YYYY-MM-DD; must be >= term_start_date"
      - name: min_monthly_gallons
        type: number
        source: input
        description: "Contract minimum monthly lifting obligation."
        constraints: ">= 0"
      - name: max_monthly_gallons
        type: number
        source: input
        description: "Contract maximum monthly lifting entitlement."
        constraints: "> min_monthly_gallons"
      - name: status
        type: enum
        source: computed
        description: "Recomputed from the logical clock on every read and on every validation that consults this contract: SCHEDULED when clock date < term_start_date, ACTIVE when term_start_date <= clock date <= term_end_date, EXPIRED when clock date > term_end_date."
        default: SCHEDULED
        constraints: "SCHEDULED | ACTIVE | EXPIRED"
      - name: all_in_price_usd_per_gal
        type: number
        source: computed
        description: "round(index_price_usd_per_gal + differential_usd_per_gal + Station.into_plane_fee_usd_per_gal, 4)."
        default: 0

  - name: ConsumptionForecast
    parent: null
    common_fields: true
    fields:
      - name: fleet_type
        type: enum
        source: input
        description: "Fleet the forecast covers."
        constraints: "NARROWBODY | WIDEBODY | REGIONAL"
      - name: route_group
        type: enum
        source: input
        description: "Route grouping the forecast covers."
        constraints: "DOMESTIC_SHORT | DOMESTIC_LONG | TRANSATLANTIC | TRANSPACIFIC | LATAM"
      - name: season
        type: enum
        source: input
        description: "Season label driving the seasonal uplift factor."
        constraints: "WINTER | SPRING | SUMMER | FALL"
      - name: period_start_month
        type: string
        source: input
        description: "First month covered, inclusive."
        constraints: "YYYY-MM"
      - name: period_end_month
        type: string
        source: input
        description: "Exclusive end month; the forecast covers [period_start_month, period_end_month)."
        constraints: "YYYY-MM; must be strictly greater than period_start_month"
      - name: forecast_gallons
        type: number
        source: input
        description: "Unadjusted forecast burn for the whole period."
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "DRAFT at creation; PUBLISHED once published. Only PUBLISHED forecasts enter a hedge sizing basis."
        default: DRAFT
        constraints: "DRAFT | PUBLISHED"
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock instant at publication; null while DRAFT."
        default: null

  - name: HedgeProgram
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> HedgePolicy.id; the policy whose limits govern this program for its whole life."
      - name: program_code
        type: string
        source: input
        description: "Program identifier."
        constraints: "1-32 chars; globally unique"
      - name: period_start_month
        type: string
        source: input
        description: "First hedged month, inclusive."
        constraints: "YYYY-MM"
      - name: period_end_month
        type: string
        source: input
        description: "Last hedged month, inclusive."
        constraints: "YYYY-MM; must be >= period_start_month"
      - name: route_groups
        type: array
        source: input
        description: "Route groups in scope for sizing."
        constraints: "non-empty subset of the ConsumptionForecast.route_group enum; no duplicates"
      - name: target_coverage_pct
        type: number
        source: input
        description: "Desired delta-adjusted coverage; informational only, never enforced."
        constraints: "0 < value <= 100; 2 decimal places"
      - name: consumption_basis_gallons
        type: number
        source: computed
        description: "Season-weighted forecast basis frozen by the sizing run per calculations.consumption_basis_gallons."
        default: 0
      - name: hedged_gallons
        type: number
        source: computed
        description: "Sum of notional_gallons over child HedgeInstrument rows with trade_status == EXECUTED."
        default: 0
      - name: delta_adjusted_gallons
        type: number
        source: computed
        description: "Delta-weighted notional over child HedgeInstrument rows with trade_status == EXECUTED."
        default: 0
      - name: coverage_pct_notional
        type: number
        source: computed
        description: "Reported coverage on the notional basis per calculations.hedge_coverage_ratio."
        default: 0
      - name: coverage_pct_delta
        type: number
        source: computed
        description: "Reported coverage on the delta-adjusted basis per calculations.hedge_coverage_ratio."
        default: 0
      - name: planned_coverage_pct_delta
        type: number
        source: computed
        description: "Delta-adjusted coverage counting child instruments with trade_status IN {PROPOSED, EXECUTED}; the activation gate reads this field."
        default: 0
      - name: designated_mtm_usd
        type: number
        source: computed
        description: "Designated mark-to-market total from the most recently PUBLISHED MarkToMarketRun."
        default: 0
      - name: undesignated_mtm_usd
        type: number
        source: computed
        description: "Undesignated mark-to-market total from the most recently PUBLISHED MarkToMarketRun."
        default: 0
      - name: earnings_volatility_usd
        type: number
        source: computed
        description: "abs(undesignated_mtm_usd); compared against HedgePolicy.max_earnings_volatility_usd."
        default: 0
      - name: compliance_posture
        type: enum
        source: computed
        description: "BREACH when earnings_volatility_usd > HedgePolicy.max_earnings_volatility_usd, otherwise COMPLIANT."
        default: COMPLIANT
        constraints: "COMPLIANT | BREACH"
      - name: open_instrument_count
        type: integer
        source: computed
        description: "Count of child HedgeInstrument rows with trade_status IN {PROPOSED, EXECUTED}."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Program lifecycle state."
        default: DRAFT
        constraints: "DRAFT | SIZING | PENDING_APPROVAL | ACTIVE | CLOSED"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID that submitted the program for approval; null until submission. Used by the segregation-of-duties check on activation."
        default: null
      - name: return_count
        type: integer
        source: computed
        description: "Number of times the program has been returned from PENDING_APPROVAL to SIZING."
        default: 0

  - name: HedgeInstrument
    parent: HedgeProgram
    common_fields: true
    fields:
      - name: hedge_program_id
        type: string
        source: system
        description: "FK -> HedgeProgram.id; taken from the path, never from the body."
      - name: counterparty_id
        type: string
        source: input
        description: "FK -> Counterparty.id; the dealer facing this trade."
      - name: instrument_type
        type: enum
        source: input
        description: "Hedge instrument form."
        constraints: "SWAP | COLLAR | CALL_OPTION; must be a member of HedgePolicy.permitted_instrument_types"
      - name: notional_gallons
        type: number
        source: input
        description: "Hedged volume in US gallons."
        constraints: "> 0"
      - name: strike_usd_per_gal
        type: number
        source: input
        description: "Swap fixed price or option strike; ignored and stored as null for COLLAR."
        default: null
        constraints: "> 0 and 4 decimal places when instrument_type IN {SWAP, CALL_OPTION}; must be omitted for COLLAR"
      - name: cap_strike_usd_per_gal
        type: number
        source: input
        description: "Collar ceiling; required for COLLAR, must be omitted otherwise."
        default: null
        constraints: "> floor_strike_usd_per_gal; 4 decimal places"
      - name: floor_strike_usd_per_gal
        type: number
        source: input
        description: "Collar floor; required for COLLAR, must be omitted otherwise."
        default: null
        constraints: "> 0; 4 decimal places"
      - name: premium_usd
        type: number
        source: input
        description: "Option premium paid up front; must be 0 for SWAP and COLLAR."
        default: 0
        constraints: ">= 0; 2 decimal places"
      - name: maturity_month
        type: string
        source: input
        description: "Settlement month."
        constraints: "YYYY-MM; must fall inside [HedgeProgram.period_start_month, HedgeProgram.period_end_month]"
      - name: trade_status
        type: enum
        source: system
        description: "Trade-lifecycle dimension; evolves independently of accounting_status."
        default: PROPOSED
        constraints: "PROPOSED | EXECUTED | SETTLED | TERMINATED"
      - name: accounting_status
        type: enum
        source: system
        description: "Hedge-accounting dimension; evolves independently of trade_status."
        default: UNDESIGNATED
        constraints: "UNDESIGNATED | DESIGNATED | DEDESIGNATED"
      - name: delta_factor
        type: number
        source: computed
        description: "Instrument delta from calculations.hedge_coverage_ratio constants INSTRUMENT_DELTA."
        default: 0
      - name: delta_adjusted_gallons
        type: number
        source: computed
        description: "round(notional_gallons * delta_factor, 2)."
        default: 0
      - name: mtm_value_usd
        type: number
        source: computed
        description: "Per-instrument mark-to-market from the most recent COMPUTED or PUBLISHED MarkToMarketRun."
        default: 0
      - name: margin_requirement_usd
        type: number
        source: computed
        description: "Margin the counterparty demands per calculations.margin_requirement_usd."
        default: 0
      - name: collateral_posted_usd
        type: number
        source: computed
        description: "Sum of posted_amount_usd over CollateralPosting rows with this hedge_instrument_id and status == POSTED."
        default: 0
      - name: cumulative_hedge_change_usd
        type: number
        source: computed
        description: "Running sum of EffectivenessTest.hedge_change_usd across this instrument's tests, ordered by created_at ASC."
        default: 0
      - name: cumulative_item_change_usd
        type: number
        source: computed
        description: "Running sum of EffectivenessTest.hedged_item_change_usd across this instrument's tests, ordered by created_at ASC."
        default: 0
      - name: proposed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the analyst who proposed the trade."
      - name: executed_at
        type: datetime
        source: system
        description: "Logical-clock instant of execution; null while PROPOSED."
        default: null
      - name: designated_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent designation; null while never designated."
        default: null

  - name: CollateralPosting
    parent: Counterparty
    common_fields: true
    fields:
      - name: counterparty_id
        type: string
        source: system
        description: "FK -> Counterparty.id; taken from the path for manual postings and from the instrument for margin calls raised by a mark-to-market run."
      - name: hedge_instrument_id
        type: string
        source: input
        description: "FK -> HedgeInstrument.id; the trade whose margin this posting covers."
      - name: collateral_type
        type: enum
        source: input
        description: "Form of collateral offered."
        constraints: "CASH | LETTER_OF_CREDIT"
      - name: required_amount_usd
        type: number
        source: computed
        description: "max(0, HedgeInstrument.margin_requirement_usd - HedgeInstrument.collateral_posted_usd) evaluated at creation and frozen."
        default: 0
      - name: posted_amount_usd
        type: number
        source: computed
        description: "Amount actually posted; 0 until the posting moves to POSTED."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Posting lifecycle."
        default: REQUIRED
        constraints: "REQUIRED | POSTED | RETURNED"
      - name: origin
        type: enum
        source: system
        description: "MANUAL when created through the collateral-postings endpoint; MTM_MARGIN_CALL when synthesized by a mark-to-market run publication."
        default: MANUAL
        constraints: "MANUAL | MTM_MARGIN_CALL"
      - name: posted_at
        type: datetime
        source: system
        description: "Logical-clock instant the collateral was posted; null while REQUIRED."
        default: null
      - name: returned_at
        type: datetime
        source: system
        description: "Logical-clock instant the collateral was returned; null unless RETURNED."
        default: null

  - name: EffectivenessTest
    parent: HedgeInstrument
    common_fields: false
    fields:
      - name: hedge_instrument_id
        type: string
        source: system
        description: "FK -> HedgeInstrument.id; taken from the path, never from the body."
      - name: period_month
        type: string
        source: input
        description: "Month the retrospective test covers."
        constraints: "YYYY-MM"
      - name: hedge_change_usd
        type: number
        source: input
        description: "Change in the hedging instrument's fair value for the period; normally opposite in sign to hedged_item_change_usd."
        constraints: "2 decimal places; must not be 0"
      - name: hedged_item_change_usd
        type: number
        source: input
        description: "Change in the hedged item's expected cash flow for the period."
        constraints: "2 decimal places; must not be 0"
      - name: period_ratio
        type: number
        source: computed
        description: "Period dollar-offset ratio per calculations.effectiveness_ratio variant period_basis; informational only."
        default: 0
      - name: cumulative_ratio
        type: number
        source: computed
        description: "Cumulative dollar-offset ratio per calculations.effectiveness_ratio variant cumulative_basis; this is the field the PASS/FAIL comparison reads."
        default: 0
      - name: result
        type: enum
        source: computed
        description: "PASS when EFFECTIVENESS_MIN <= cumulative_ratio <= EFFECTIVENESS_MAX inclusive, otherwise FAIL."
        constraints: "PASS | FAIL"
      - name: tested_by_user_id
        type: string
        source: system
        description: "X-User-ID of the hedge accountant who ran the test."

  - name: MarkToMarketRun
    parent: null
    common_fields: true
    fields:
      - name: period_month
        type: string
        source: input
        description: "Reporting month."
        constraints: "YYYY-MM; globally unique across MarkToMarketRun rows"
      - name: settlement_index_usd_per_gal
        type: number
        source: input
        description: "Month-end settlement index used to revalue every in-scope instrument."
        constraints: "> 0; 4 decimal places"
      - name: status
        type: enum
        source: system
        description: "Run lifecycle; only PUBLISHED runs mutate program and counterparty ledgers."
        default: OPEN
        constraints: "OPEN | COMPUTED | PUBLISHED"
      - name: instrument_count
        type: integer
        source: computed
        description: "Number of instruments in scope per calculations.mtm_report_totals input_set."
        default: 0
      - name: total_mtm_usd
        type: number
        source: computed
        description: "Portfolio mark-to-market per calculations.mtm_report_totals."
        default: 0
      - name: designated_mtm_usd
        type: number
        source: computed
        description: "Sum of per-instrument rounded mark-to-market for instruments with accounting_status == DESIGNATED."
        default: 0
      - name: undesignated_mtm_usd
        type: number
        source: computed
        description: "Sum of per-instrument rounded mark-to-market for instruments with accounting_status IN {UNDESIGNATED, DEDESIGNATED}."
        default: 0
      - name: margin_calls_created
        type: integer
        source: computed
        description: "Number of CollateralPosting rows with origin MTM_MARGIN_CALL created by this run's publication."
        default: 0
      - name: settled_instrument_count
        type: integer
        source: computed
        description: "Number of instruments auto-settled by this run's publication."
        default: 0
      - name: computed_at
        type: datetime
        source: system
        description: "Logical-clock instant of computation; null while OPEN."
        default: null
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock instant of publication; null until PUBLISHED."
        default: null

  - name: FlightLeg
    parent: null
    common_fields: true
    fields:
      - name: flight_number
        type: string
        source: input
        description: "Operating flight number."
        constraints: "1-8 chars"
      - name: departure_date
        type: string
        source: input
        description: "Scheduled departure date."
        constraints: "ISO 8601 date YYYY-MM-DD; flight_number + departure_date is globally unique"
      - name: origin_station_id
        type: string
        source: input
        description: "FK -> Station.id; the uplift station whose price and inventory a tankering decision consumes."
      - name: destination_station_id
        type: string
        source: input
        description: "FK -> Station.id; the station whose price the tankering saving is measured against."
        constraints: "must differ from origin_station_id"
      - name: fleet_type
        type: enum
        source: input
        description: "Operating fleet, selecting the tankering burn factor."
        constraints: "NARROWBODY | WIDEBODY | REGIONAL"
      - name: planned_block_minutes
        type: integer
        source: input
        description: "Planned block time in minutes."
        constraints: "> 0"
      - name: planned_burn_gallons
        type: number
        source: input
        description: "Planned trip burn excluding any tankered fuel."
        constraints: "> 0"
      - name: tank_capacity_gallons
        type: number
        source: input
        description: "Usable tank capacity of the assigned airframe."
        constraints: "> planned_burn_gallons"
      - name: payload_lbs
        type: number
        source: input
        description: "Revenue payload weight."
        constraints: "> 0"
      - name: max_takeoff_payload_lbs
        type: number
        source: input
        description: "Structural payload limit used as the payload-ratio denominator."
        constraints: "> payload_lbs"
      - name: landing_weight_lbs
        type: number
        source: input
        description: "Forecast landing weight without tankered fuel."
        constraints: "> 0"
      - name: max_landing_weight_lbs
        type: number
        source: input
        description: "Structural maximum landing weight."
        constraints: ">= landing_weight_lbs"
      - name: uplift_cap_gallons
        type: number
        source: computed
        description: "Maximum tankerable uplift per calculations.tankering_uplift_cap_gallons; recomputed on every read."
        default: 0
      - name: actual_block_minutes
        type: integer
        source: system
        description: "Flown block time; populated from the tankering reconcile payload, null before reconciliation."
        default: null
      - name: actual_uplift_gallons
        type: number
        source: system
        description: "Gallons actually tankered; populated from the tankering reconcile payload, null before reconciliation."
        default: null

  - name: TankeringDirective
    parent: FlightLeg
    common_fields: true
    fields:
      - name: flight_leg_id
        type: string
        source: system
        description: "FK -> FlightLeg.id; taken from the path, never from the body."
      - name: requested_uplift_gallons
        type: number
        source: input
        description: "Gallons the analyst asks to tanker from the origin station."
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "Directive lifecycle."
        default: PROPOSED
        constraints: "PROPOSED | NEEDS_REVISION | APPROVED | REJECTED | EXECUTED | RECONCILED | SUPERSEDED"
      - name: planned_burn_penalty_gallons
        type: number
        source: computed
        description: "Tankering burn penalty per calculations.tankering_burn_penalty_gallons variant planned_basis."
        default: 0
      - name: planned_gross_savings_usd
        type: number
        source: computed
        description: "Gross price saving before the burn penalty, planned basis."
        default: 0
      - name: planned_penalty_cost_usd
        type: number
        source: computed
        description: "Burn penalty valued at the origin station all-in price, planned basis."
        default: 0
      - name: planned_net_savings_usd
        type: number
        source: computed
        description: "planned_gross_savings_usd - planned_penalty_cost_usd per calculations.tankering_net_savings_usd variant planned_basis."
        default: 0
      - name: pinned_origin_price_usd_per_gal
        type: number
        source: computed
        description: "Origin all_in_price_usd_per_gal frozen at approval; null until APPROVED."
        default: null
      - name: pinned_destination_price_usd_per_gal
        type: number
        source: computed
        description: "Destination all_in_price_usd_per_gal frozen at approval; null until APPROVED."
        default: null
      - name: pinned_origin_contract_ref
        type: string
        source: computed
        description: "contract_ref of the origin SupplyContract selected at approval; null until APPROVED."
        default: null
      - name: reconciled_burn_penalty_gallons
        type: number
        source: computed
        description: "Burn penalty recomputed from flown data per variant reconciled_basis; null until RECONCILED."
        default: null
      - name: reconciled_net_savings_usd
        type: number
        source: computed
        description: "Net saving recomputed from flown data and pinned prices; null until RECONCILED."
        default: null
      - name: savings_variance_usd
        type: number
        source: computed
        description: "round(reconciled_net_savings_usd - planned_net_savings_usd, 2); null until RECONCILED."
        default: null
      - name: revision_count
        type: integer
        source: computed
        description: "Number of times this directive has cycled NEEDS_REVISION -> PROPOSED."
        default: 0
      - name: proposed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the analyst who proposed the directive."
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the controller who approved the directive; null unless it reached APPROVED."
        default: null

  - name: PolicyException
    parent: null
    common_fields: true
    fields:
      - name: reason_code
        type: enum
        source: input
        description: "Policy limit the exception waives."
        constraints: "COVERAGE_LIMIT | COUNTERPARTY_CONCENTRATION | EARNINGS_VOLATILITY_BREACH | TANKERING_UNECONOMIC | INVENTORY_SHORT"
      - name: hedge_program_id
        type: string
        source: input
        description: "FK -> HedgeProgram.id; null when the exception targets a directive only."
        default: null
      - name: hedge_instrument_id
        type: string
        source: input
        description: "FK -> HedgeInstrument.id; null unless the exception targets a specific trade."
        default: null
      - name: tankering_directive_id
        type: string
        source: input
        description: "FK -> TankeringDirective.id; null unless the exception targets a specific directive."
        default: null
      - name: justification
        type: string
        source: input
        description: "Free-text business justification."
        constraints: "10-500 chars"
      - name: requested_limit_value
        type: number
        source: input
        description: "Limit value the requester asks to be tolerated; informational only."
        default: null
      - name: status
        type: enum
        source: system
        description: "Exception decision state."
        default: REQUESTED
        constraints: "REQUESTED | APPROVED | DENIED"
      - name: origin
        type: enum
        source: system
        description: "MANUAL when raised through the API; SYSTEM_BREACH when auto-raised by an earnings-volatility breach cascade."
        default: MANUAL
        constraints: "MANUAL | SYSTEM_BREACH"
      - name: requested_by_user_id
        type: string
        source: system
        description: "X-User-ID of the requester; null for SYSTEM_BREACH rows."
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the approver or denier; null while REQUESTED."
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant of the decision; null while REQUESTED."
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: ConsumptionForecast
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /fuel/consumption-forecasts/{id}/publish"
        actor: FuelAnalyst
        preconditions:
          - "forecast.status == DRAFT"
          - "no other ConsumptionForecast with the same fleet_type AND route_group AND status == PUBLISHED overlaps [period_start_month, period_end_month) per validations[priority=11]"
        side_effects:
          - "sets status = PUBLISHED"
          - "sets published_at = logical clock now"
          - "increments ConsumptionForecast.version by 1"
        note: "Overlap is only enforced against PUBLISHED siblings; DRAFT rows may overlap freely."

  - entity: HedgeProgram
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SIZING
        trigger: "POST /fuel/hedge-programs/{id}/size"
        actor: FuelAnalyst
        preconditions:
          - "program.status == DRAFT"
          - "HedgePolicy.status == ACTIVE for program.policy_id"
          - "at least one PUBLISHED ConsumptionForecast matches the sizing input_set per calculations.consumption_basis_gallons, otherwise ERR_NO_FORECAST_BASIS"
        side_effects:
          - "runs calculations.consumption_basis_gallons and writes consumption_basis_gallons"
          - "recomputes coverage_pct_notional, coverage_pct_delta and planned_coverage_pct_delta per calculations.hedge_coverage_ratio"
          - "sets status = SIZING"
          - "increments HedgeProgram.version by 1"
      - from: SIZING
        to: SIZING
        trigger: "POST /fuel/hedge-programs/{id}/size"
        actor: FuelAnalyst
        preconditions:
          - "program.status == SIZING"
          - "at least one PUBLISHED ConsumptionForecast matches the sizing input_set, otherwise ERR_NO_FORECAST_BASIS"
        side_effects:
          - "overwrites consumption_basis_gallons with the freshly computed basis"
          - "recomputes coverage_pct_notional, coverage_pct_delta and planned_coverage_pct_delta"
          - "increments HedgeProgram.version by 1"
        note: "Re-sizing is how a newly published forecast enters an already-sized program."
      - from: SIZING
        to: PENDING_APPROVAL
        trigger: "POST /fuel/hedge-programs/{id}/submit"
        actor: FuelAnalyst
        preconditions:
          - "program.status == SIZING"
          - "program.open_instrument_count >= 1"
        side_effects:
          - "sets status = PENDING_APPROVAL"
          - "sets submitted_by_user_id = X-User-ID of the caller"
          - "increments HedgeProgram.version by 1"
      - from: PENDING_APPROVAL
        to: SIZING
        trigger: "POST /fuel/hedge-programs/{id}/return"
        actor: TreasuryRiskManager
        preconditions:
          - "program.status == PENDING_APPROVAL"
        side_effects:
          - "sets status = SIZING"
          - "increments return_count by 1"
          - "clears submitted_by_user_id to null"
          - "increments HedgeProgram.version by 1"
        note: "Revision loop: SIZING -> PENDING_APPROVAL -> SIZING may repeat without bound."
      - from: PENDING_APPROVAL
        to: ACTIVE
        trigger: "POST /fuel/hedge-programs/{id}/activate"
        actor: TreasuryRiskManager
        preconditions:
          - "program.status == PENDING_APPROVAL"
          - "X-User-ID != program.submitted_by_user_id, otherwise ERR_SEGREGATION_OF_DUTIES"
          - "program.planned_coverage_pct_delta >= HedgePolicy.min_coverage_pct, otherwise ERR_COVERAGE_FLOOR_NOT_MET"
        side_effects:
          - "sets status = ACTIVE"
          - "increments HedgeProgram.version by 1"
        note: "Compound gate: the floor is read from planned_coverage_pct_delta, which counts child instruments in {PROPOSED, EXECUTED}."
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /fuel/hedge-programs/{id}/close"
        actor: TreasuryRiskManager
        preconditions:
          - "program.status == ACTIVE"
          - "program.open_instrument_count == 0, otherwise ERR_PROGRAM_HAS_OPEN_INSTRUMENTS"
        side_effects:
          - "sets status = CLOSED"
          - "increments HedgeProgram.version by 1"

  - entity: HedgeInstrument
    initial_state: "trade_status=PROPOSED x accounting_status=UNDESIGNATED"
    terminal_states: ["trade_status=SETTLED", "trade_status=TERMINATED"]
    transitions:
      # ---- dimension 1: trade_status ----
      - from: "trade_status=PROPOSED"
        to: "trade_status=EXECUTED"
        trigger: "POST /fuel/hedge-instruments/{id}/execute"
        actor: TreasuryRiskManager
        preconditions:
          - "instrument.trade_status == PROPOSED"
          - "HedgeProgram.status == ACTIVE, otherwise ERR_PROGRAM_NOT_ACTIVE"
          - "Counterparty.status == APPROVED, otherwise ERR_COUNTERPARTY_NOT_APPROVED"
          - "post-trade delta-adjusted coverage does not exceed HedgePolicy.max_coverage_pct per validations[priority=20], compared on the unrounded ratio"
          - "post-trade single-counterparty share does not exceed HedgePolicy.max_single_counterparty_pct unless an APPROVED PolicyException with reason_code COUNTERPARTY_CONCENTRATION references this instrument, otherwise ERR_EXCEPTION_REQUIRED"
          - "Counterparty.utilized_credit_usd + this trade's margin_requirement_usd <= Counterparty.credit_limit_usd, otherwise ERR_COUNTERPARTY_CREDIT_EXCEEDED"
        side_effects:
          - "sets trade_status = EXECUTED and executed_at = logical clock now"
          - "runs calculations.margin_requirement_usd and writes instrument.margin_requirement_usd"
          - "adds margin_requirement_usd to Counterparty.utilized_credit_usd, then recomputes Counterparty.utilization_pct and Counterparty.credit_posture per calculations.counterparty_credit_posture"
          - "adds notional_gallons to HedgeProgram.hedged_gallons and delta_adjusted_gallons to HedgeProgram.delta_adjusted_gallons, then recomputes coverage_pct_notional, coverage_pct_delta and planned_coverage_pct_delta"
          - "increments HedgeInstrument.version, Counterparty.version and HedgeProgram.version by 1 each"
      - from: "trade_status=PROPOSED"
        to: "trade_status=TERMINATED"
        trigger: "POST /fuel/hedge-instruments/{id}/terminate"
        actor: TreasuryRiskManager
        preconditions:
          - "instrument.trade_status == PROPOSED"
        side_effects:
          - "sets trade_status = TERMINATED"
          - "decrements HedgeProgram.open_instrument_count by 1 and recomputes planned_coverage_pct_delta"
          - "increments HedgeInstrument.version and HedgeProgram.version by 1 each"
      - from: "trade_status=EXECUTED"
        to: "trade_status=TERMINATED"
        trigger: "POST /fuel/hedge-instruments/{id}/terminate"
        actor: TreasuryRiskManager
        preconditions:
          - "instrument.trade_status == EXECUTED"
        side_effects:
          - "CASCADE HOP 1: sets trade_status = TERMINATED, sets margin_requirement_usd = 0, sets accounting_status = DEDESIGNATED when it was DESIGNATED, subtracts notional_gallons from HedgeProgram.hedged_gallons and delta_adjusted_gallons from HedgeProgram.delta_adjusted_gallons, decrements HedgeProgram.open_instrument_count by 1 and recomputes the three coverage fields"
          - "CASCADE HOP 2: because the trade is TERMINATED, every CollateralPosting with this hedge_instrument_id and status == POSTED transitions POSTED -> RETURNED (returned_at = logical clock now); postings still in REQUIRED are left untouched"
          - "CASCADE HOP 3: because those postings became RETURNED, Counterparty.posted_collateral_usd is reduced by their posted_amount_usd, Counterparty.utilized_credit_usd is reduced by the instrument's pre-termination margin_requirement_usd, and Counterparty.utilization_pct plus Counterparty.credit_posture are recomputed"
          - "increments HedgeInstrument.version, HedgeProgram.version, Counterparty.version and every touched CollateralPosting.version by 1 each"
        note: "Compensating action for execution: restores hedged_gallons, delta_adjusted_gallons, utilized_credit_usd and posted_collateral_usd to their pre-execution values."
      - from: "trade_status=EXECUTED"
        to: "trade_status=SETTLED"
        trigger: "system event: POST /fuel/mark-to-market-runs/{id}/publish where run.period_month >= instrument.maturity_month"
        actor: system
        preconditions:
          - "instrument.trade_status == EXECUTED"
          - "instrument.maturity_month <= run.period_month"
        side_effects:
          - "sets trade_status = SETTLED"
          - "subtracts notional_gallons from HedgeProgram.hedged_gallons and delta_adjusted_gallons from HedgeProgram.delta_adjusted_gallons, decrements HedgeProgram.open_instrument_count by 1 and recomputes the three coverage fields"
          - "releases margin: sets margin_requirement_usd = 0 and reduces Counterparty.utilized_credit_usd by the pre-settlement margin_requirement_usd, then recomputes Counterparty.utilization_pct and Counterparty.credit_posture"
          - "increments MarkToMarketRun.settled_instrument_count by 1"
          - "increments HedgeInstrument.version, HedgeProgram.version and Counterparty.version by 1 each"
      # ---- dimension 2: accounting_status ----
      - from: "accounting_status=UNDESIGNATED"
        to: "accounting_status=DESIGNATED"
        trigger: "POST /fuel/hedge-instruments/{id}/designate"
        actor: HedgeAccountant
        preconditions:
          - "instrument.accounting_status == UNDESIGNATED"
          - "instrument.trade_status == EXECUTED, otherwise ERR_INSTRUMENT_INVALID_TRADE_STATE"
          - "HedgeProgram.status == ACTIVE, otherwise ERR_PROGRAM_NOT_ACTIVE"
        side_effects:
          - "sets accounting_status = DESIGNATED and designated_at = logical clock now"
          - "increments HedgeInstrument.version by 1"
        note: "trade_status is untouched: the two dimensions advance independently."
      - from: "accounting_status=DESIGNATED"
        to: "accounting_status=DEDESIGNATED"
        trigger: "system event: POST /fuel/hedge-instruments/{id}/effectiveness-tests producing result == FAIL"
        actor: system
        preconditions:
          - "instrument.accounting_status == DESIGNATED"
          - "the new EffectivenessTest.result == FAIL"
        side_effects:
          - "CASCADE HOP 1: sets accounting_status = DEDESIGNATED (trade_status unchanged)"
          - "CASCADE HOP 2: because the instrument left DESIGNATED, HedgeProgram.designated_mtm_usd and HedgeProgram.undesignated_mtm_usd are reclassified by moving the instrument's mtm_value_usd from the designated bucket to the undesignated bucket, then HedgeProgram.earnings_volatility_usd = abs(undesignated_mtm_usd) and HedgeProgram.compliance_posture are recomputed"
          - "CASCADE HOP 3: because compliance_posture became BREACH, a PolicyException row is created with origin SYSTEM_BREACH, reason_code EARNINGS_VOLATILITY_BREACH, status REQUESTED, hedge_program_id = this program, hedge_instrument_id = this instrument, requested_by_user_id = null, justification = 'Auto-raised: undesignated mark-to-market exceeds policy earnings volatility limit.'"
          - "CASCADE HOP 4: because that PolicyException exists in REQUESTED, HedgePolicy.open_exception_count is incremented by 1"
          - "increments HedgeInstrument.version, HedgeProgram.version and HedgePolicy.version by 1 each"
        note: "Hops 2-4 fire only via the preceding hop; when compliance_posture stays COMPLIANT, hops 3 and 4 do not run."
      - from: "accounting_status=DEDESIGNATED"
        to: "accounting_status=DESIGNATED"
        trigger: "POST /fuel/hedge-instruments/{id}/designate"
        actor: HedgeAccountant
        preconditions:
          - "instrument.accounting_status == DEDESIGNATED"
          - "instrument.trade_status == EXECUTED, otherwise ERR_INSTRUMENT_INVALID_TRADE_STATE"
          - "HedgeProgram.status == ACTIVE, otherwise ERR_PROGRAM_NOT_ACTIVE"
          - "an APPROVED PolicyException with reason_code EARNINGS_VOLATILITY_BREACH referencing this hedge_instrument_id exists, otherwise ERR_EXCEPTION_REQUIRED"
        side_effects:
          - "sets accounting_status = DESIGNATED and designated_at = logical clock now"
          - "reclassifies the instrument's mtm_value_usd from HedgeProgram.undesignated_mtm_usd back into HedgeProgram.designated_mtm_usd, then recomputes earnings_volatility_usd and compliance_posture"
          - "when compliance_posture returns to COMPLIANT, no PolicyException row is closed or mutated"
          - "increments HedgeInstrument.version and HedgeProgram.version by 1 each"
        note: "Re-designation cycle: DESIGNATED -> DEDESIGNATED -> DESIGNATED may repeat without bound."

  - entity: CollateralPosting
    initial_state: REQUIRED
    terminal_states: [RETURNED]
    transitions:
      - from: REQUIRED
        to: POSTED
        trigger: "POST /fuel/collateral-postings/{id}/post"
        actor: RiskPolicyAdmin
        preconditions:
          - "posting.status == REQUIRED"
          - "HedgeInstrument.trade_status == EXECUTED, otherwise ERR_INSTRUMENT_INVALID_TRADE_STATE"
          - "request amount_usd >= posting.required_amount_usd, otherwise ERR_COLLATERAL_SHORTFALL"
        side_effects:
          - "sets status = POSTED, posted_amount_usd = request amount_usd, posted_at = logical clock now"
          - "adds posted_amount_usd to Counterparty.posted_collateral_usd and to HedgeInstrument.collateral_posted_usd"
          - "decrements Counterparty.open_margin_call_count by 1"
          - "increments CollateralPosting.version, Counterparty.version and HedgeInstrument.version by 1 each"
      - from: POSTED
        to: RETURNED
        trigger: "POST /fuel/collateral-postings/{id}/return"
        actor: RiskPolicyAdmin
        preconditions:
          - "posting.status == POSTED"
          - "HedgeInstrument.trade_status IN {SETTLED, TERMINATED} OR HedgeInstrument.margin_requirement_usd < HedgeInstrument.collateral_posted_usd, otherwise ERR_POSTING_INVALID_STATE"
        side_effects:
          - "sets status = RETURNED and returned_at = logical clock now"
          - "subtracts posted_amount_usd from Counterparty.posted_collateral_usd and from HedgeInstrument.collateral_posted_usd"
          - "increments CollateralPosting.version, Counterparty.version and HedgeInstrument.version by 1 each"
        note: "Compensating action for posting; posted_amount_usd is retained on the row for audit and is NOT zeroed."
      - from: POSTED
        to: RETURNED
        trigger: "system event: POST /fuel/hedge-instruments/{id}/terminate on the parent trade"
        actor: system
        preconditions:
          - "posting.status == POSTED"
          - "the parent HedgeInstrument just transitioned trade_status EXECUTED -> TERMINATED"
        side_effects:
          - "sets status = RETURNED and returned_at = logical clock now"
          - "subtracts posted_amount_usd from Counterparty.posted_collateral_usd and from HedgeInstrument.collateral_posted_usd"
          - "increments CollateralPosting.version by 1"

  - entity: MarkToMarketRun
    initial_state: OPEN
    terminal_states: [PUBLISHED]
    transitions:
      - from: OPEN
        to: COMPUTED
        trigger: "POST /fuel/mark-to-market-runs/{id}/compute"
        actor: HedgeAccountant
        preconditions:
          - "run.status == OPEN"
        side_effects:
          - "runs calculations.mtm_report_totals and writes instrument_count, total_mtm_usd, designated_mtm_usd, undesignated_mtm_usd"
          - "writes mtm_value_usd onto every in-scope HedgeInstrument"
          - "sets status = COMPUTED and computed_at = logical clock now"
          - "does NOT touch HedgeProgram, Counterparty or CollateralPosting"
          - "increments MarkToMarketRun.version and every touched HedgeInstrument.version by 1 each"
      - from: COMPUTED
        to: COMPUTED
        trigger: "POST /fuel/mark-to-market-runs/{id}/compute"
        actor: HedgeAccountant
        preconditions:
          - "run.status == COMPUTED"
        side_effects:
          - "recomputes and overwrites the four report totals and every in-scope instrument's mtm_value_usd"
          - "refreshes computed_at"
          - "increments MarkToMarketRun.version by 1"
      - from: COMPUTED
        to: PUBLISHED
        trigger: "POST /fuel/mark-to-market-runs/{id}/publish"
        actor: RiskPolicyAdmin
        preconditions:
          - "run.status == COMPUTED, otherwise ERR_MTM_RUN_INVALID_STATE"
        side_effects:
          - "sets status = PUBLISHED and published_at = logical clock now"
          - "CASCADE HOP 1: for every in-scope HedgeInstrument, re-runs calculations.margin_requirement_usd against the newly published mtm_value_usd and overwrites margin_requirement_usd"
          - "CASCADE HOP 2: because margin_requirement_usd moved, for each instrument whose margin_requirement_usd now exceeds collateral_posted_usd a CollateralPosting row is created with origin MTM_MARGIN_CALL, status REQUIRED, collateral_type CASH, required_amount_usd = margin_requirement_usd - collateral_posted_usd; run.margin_calls_created counts them"
          - "CASCADE HOP 3: because those postings exist in REQUIRED, each affected Counterparty has open_margin_call_count incremented by 1, utilized_credit_usd set to the sum of margin_requirement_usd over its EXECUTED instruments, and utilization_pct plus credit_posture recomputed"
          - "for every HedgeProgram owning an in-scope instrument, sets designated_mtm_usd and undesignated_mtm_usd from the per-program buckets of this run, then recomputes earnings_volatility_usd and compliance_posture; a program whose compliance_posture becomes BREACH auto-raises a SYSTEM_BREACH PolicyException exactly as in the de-designation cascade and increments HedgePolicy.open_exception_count"
          - "auto-settles every in-scope instrument whose maturity_month <= run.period_month per the HedgeInstrument trade_status transition EXECUTED -> SETTLED; settlement runs AFTER hops 1-3 so a matured trade still records its final margin recomputation"
          - "increments MarkToMarketRun.version and the version of every touched HedgeInstrument, HedgeProgram, Counterparty, HedgePolicy and CollateralPosting by 1 each"
        note: "Ops-run checkpoint: publication is the only transition that mutates program, counterparty and collateral ledgers."

  - entity: TankeringDirective
    initial_state: PROPOSED
    terminal_states: [REJECTED, RECONCILED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /fuel/tankering-directives/{id}/approve"
        actor: FuelOpsController
        preconditions:
          - "directive.status == PROPOSED"
          - "directive.requested_uplift_gallons <= FlightLeg.uplift_cap_gallons, otherwise ERR_TANKERING_WEIGHT_LIMIT"
          - "the origin Station has exactly one SupplyContract with status == ACTIVE and the destination Station has exactly one SupplyContract with status == ACTIVE, otherwise ERR_NO_ACTIVE_SUPPLY_CONTRACT"
          - "origin Station.supply_posture != SHORT, otherwise ERR_STATION_INVENTORY_SHORT"
          - "directive.planned_net_savings_usd > 0 unless an APPROVED PolicyException with reason_code TANKERING_UNECONOMIC references this directive, otherwise ERR_TANKERING_NOT_ECONOMIC"
        side_effects:
          - "sets status = APPROVED and approved_by_user_id = X-User-ID of the caller"
          - "pins pinned_origin_price_usd_per_gal, pinned_destination_price_usd_per_gal and pinned_origin_contract_ref from the two ACTIVE SupplyContract rows as of the approval instant; reconciliation later prices against these pinned values, never against live contracts"
          - "increments TankeringDirective.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /fuel/tankering-directives/{id}/reject"
        actor: FuelOpsController
        preconditions:
          - "directive.status == PROPOSED"
        side_effects:
          - "sets status = REJECTED"
          - "no price pinning, no inventory movement"
          - "increments TankeringDirective.version by 1"
      - from: PROPOSED
        to: NEEDS_REVISION
        trigger: "POST /fuel/tankering-directives/{id}/request-revision"
        actor: FuelOpsController
        preconditions:
          - "directive.status == PROPOSED"
        side_effects:
          - "sets status = NEEDS_REVISION"
          - "increments TankeringDirective.version by 1"
      - from: NEEDS_REVISION
        to: PROPOSED
        trigger: "POST /fuel/tankering-directives/{id}/revise"
        actor: FuelAnalyst
        preconditions:
          - "directive.status == NEEDS_REVISION"
        side_effects:
          - "overwrites requested_uplift_gallons with the request value"
          - "re-runs calculations.tankering_burn_penalty_gallons and calculations.tankering_net_savings_usd on the planned_basis variant and overwrites planned_burn_penalty_gallons, planned_gross_savings_usd, planned_penalty_cost_usd, planned_net_savings_usd"
          - "sets status = PROPOSED and increments revision_count by 1"
          - "increments TankeringDirective.version by 1"
        note: "Cycle: PROPOSED -> NEEDS_REVISION -> PROPOSED may repeat without bound; each pass re-prices against live contracts."
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system event: POST /fuel/flight-legs/{id}/tankering-directives creating a newer directive on the same leg"
        actor: system
        preconditions:
          - "directive.status IN {PROPOSED, NEEDS_REVISION}"
          - "a new TankeringDirective is being created on the same flight_leg_id"
        side_effects:
          - "sets status = SUPERSEDED"
          - "increments TankeringDirective.version by 1"
      - from: NEEDS_REVISION
        to: SUPERSEDED
        trigger: "system event: POST /fuel/flight-legs/{id}/tankering-directives creating a newer directive on the same leg"
        actor: system
        preconditions:
          - "directive.status IN {PROPOSED, NEEDS_REVISION}"
        side_effects:
          - "sets status = SUPERSEDED"
          - "increments TankeringDirective.version by 1"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /fuel/tankering-directives/{id}/execute"
        actor: FuelOpsController
        preconditions:
          - "directive.status == APPROVED"
          - "origin Station.inventory_gallons >= directive.requested_uplift_gallons, otherwise ERR_STATION_INVENTORY_SHORT"
        side_effects:
          - "sets status = EXECUTED"
          - "CASCADE HOP 1: subtracts requested_uplift_gallons from the origin Station.inventory_gallons"
          - "CASCADE HOP 2: because inventory_gallons moved, the origin Station.effective_inventory_gallons, days_cover and supply_posture are recomputed per calculations.station_supply_posture"
          - "increments TankeringDirective.version and Station.version by 1 each"
      - from: EXECUTED
        to: RECONCILED
        trigger: "POST /fuel/tankering-directives/{id}/reconcile"
        actor: FuelOpsController
        preconditions:
          - "directive.status == EXECUTED"
          - "request actual_uplift_gallons > 0 and <= FlightLeg.uplift_cap_gallons, otherwise ERR_TANKERING_WEIGHT_LIMIT"
        side_effects:
          - "writes FlightLeg.actual_uplift_gallons and FlightLeg.actual_block_minutes from the request"
          - "re-runs calculations.tankering_burn_penalty_gallons and calculations.tankering_net_savings_usd on the reconciled_basis variant using the pinned prices, writing reconciled_burn_penalty_gallons, reconciled_net_savings_usd and savings_variance_usd"
          - "adjusts the origin Station.inventory_gallons by (requested_uplift_gallons - actual_uplift_gallons) so that the station's net debit for this directive equals actual_uplift_gallons exactly, then recomputes effective_inventory_gallons, days_cover and supply_posture"
          - "sets status = RECONCILED"
          - "increments TankeringDirective.version, FlightLeg.version and Station.version by 1 each"
        note: "Compensating action for execution's provisional debit: the conserved quantity is the station's gallon ledger."

  - entity: PolicyException
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /fuel/policy-exceptions/{id}/approve"
        actor: RiskPolicyAdmin
        preconditions:
          - "exception.status == REQUESTED"
          - "X-User-ID != exception.requested_by_user_id, otherwise ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets status = APPROVED, decided_by_user_id = X-User-ID, decided_at = logical clock now"
          - "decrements HedgePolicy.open_exception_count by 1 for the policy governing exception.hedge_program_id when hedge_program_id is not null"
          - "increments PolicyException.version and, when applicable, HedgePolicy.version by 1 each"
        note: "A SYSTEM_BREACH row has requested_by_user_id null, so the segregation check never blocks it."
      - from: REQUESTED
        to: DENIED
        trigger: "POST /fuel/policy-exceptions/{id}/deny"
        actor: RiskPolicyAdmin
        preconditions:
          - "exception.status == REQUESTED"
          - "X-User-ID != exception.requested_by_user_id, otherwise ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets status = DENIED, decided_by_user_id = X-User-ID, decided_at = logical clock now"
          - "decrements HedgePolicy.open_exception_count by 1 for the policy governing exception.hedge_program_id when hedge_program_id is not null"
          - "increments PolicyException.version and, when applicable, HedgePolicy.version by 1 each"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version`)
# =============================================================================
concurrency_rules:
  - rule_id: instrument-create-stale-program
    parent_entity: HedgeProgram
    write_endpoint: "POST /fuel/hedge-programs/{id}/instruments"
    occ_field: "expected_hedge_program_version"
    description: |
      Proposing a HedgeInstrument against a HedgeProgram whose version has
      advanced since the client last read it is rejected. Adding a second
      instrument is legitimate product behavior, so the stale read cannot be
      caught by any state precondition; the client's coverage headroom
      arithmetic was computed against an outdated consumption_basis_gallons or
      an outdated hedged_gallons and must be redone.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: collateral-post-stale-counterparty
    parent_entity: Counterparty
    write_endpoint: "POST /fuel/counterparties/{id}/collateral-postings"
    occ_field: "expected_counterparty_version"
    description: |
      Creating a CollateralPosting against a Counterparty whose version has
      advanced since the client last read it is rejected. Multiple postings
      against one counterparty are legitimate, so no state precondition
      rejects the stale writer; the required_amount_usd it expects was derived
      from an outdated utilized_credit_usd or posted_collateral_usd.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: directive-create-stale-flight-leg
    parent_entity: FlightLeg
    write_endpoint: "POST /fuel/flight-legs/{id}/tankering-directives"
    occ_field: "expected_flight_leg_version"
    description: |
      Creating a TankeringDirective against a FlightLeg whose version has
      advanced since the client last read it is rejected. Because a new
      directive legitimately supersedes any prior PROPOSED or NEEDS_REVISION
      directive on the leg, the create would otherwise succeed and silently
      discard the directive the stale client never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: consumption_basis_gallons
    trigger: "HedgeProgram transitions DRAFT -> SIZING or SIZING -> SIZING via POST /fuel/hedge-programs/{id}/size; writes HedgeProgram.consumption_basis_gallons"
    algorithm: aggregation
    formula: |
      # (a) source entity + explicit status filter, (b) window with pinned boundaries,
      # (c) order-insensitive sum, so no tie-break is needed.
      matched = every ConsumptionForecast f such that
          f.status == PUBLISHED
        AND f.fleet_type IN HedgePolicy.eligible_fleet_types        # policy of program.policy_id
        AND f.route_group IN HedgeProgram.route_groups
        AND f.period_start_month >= HedgeProgram.period_start_month
        AND f.period_end_month  <= month_after(HedgeProgram.period_end_month)
      # The program window [period_start_month .. period_end_month] is INCLUSIVE at both
      # ends; the forecast window [period_start_month, period_end_month) is half-open.
      # Containment therefore compares the forecast's exclusive end against the month
      # AFTER the program's inclusive end. A forecast that only partially overlaps the
      # program window is EXCLUDED entirely; there is no pro-rating.
      if matched is empty: raise ERR_NO_FORECAST_BASIS      # boundary: empty input set
      raw = sum over f in matched of ( f.forecast_gallons * SEASON_FACTOR[f.season] )
      consumption_basis_gallons = round(raw, 0)             # ONE rounding, after the sum
    input_set: "ConsumptionForecast rows with status == PUBLISHED only; DRAFT rows never enter the basis, and a forecast published after a sizing run enters only on the next size call."
    constants:
      SEASON_FACTOR: { WINTER: 1.00, SPRING: 0.95, SUMMER: 1.10, FALL: 0.98 }
    precision: "0 decimal places (whole gallons), round_half_up, applied once to the summed product; per-forecast products are NOT rounded"

  - name: hedge_coverage_ratio
    trigger: "recomputed whenever HedgeProgram.consumption_basis_gallons, hedged_gallons or delta_adjusted_gallons changes — i.e. on POST /fuel/hedge-programs/{id}/size, POST /fuel/hedge-programs/{id}/instruments, POST /fuel/hedge-instruments/{id}/execute, POST /fuel/hedge-instruments/{id}/terminate and the system EXECUTED -> SETTLED transition; writes HedgeProgram.coverage_pct_notional, coverage_pct_delta and planned_coverage_pct_delta"
    algorithm: aggregation
    formula: |
      basis = HedgeProgram.consumption_basis_gallons
      # variant notional_basis
      hedged_gallons        = sum(i.notional_gallons for child i where i.trade_status == EXECUTED)
      coverage_pct_notional = 0.00 if basis == 0 else round(hedged_gallons / basis * 100, 2)
      # variant delta_adjusted_basis
      i.delta_factor           = INSTRUMENT_DELTA[i.instrument_type]
      i.delta_adjusted_gallons = round(i.notional_gallons * i.delta_factor, 2)
      delta_adjusted_gallons   = sum(i.delta_adjusted_gallons for child i where i.trade_status == EXECUTED)
      coverage_pct_delta       = 0.00 if basis == 0 else round(delta_adjusted_gallons / basis * 100, 2)
      # activation gate measure — wider input set
      planned_delta              = sum(i.delta_adjusted_gallons for child i where i.trade_status IN {PROPOSED, EXECUTED})
      planned_coverage_pct_delta = 0.00 if basis == 0 else round(planned_delta / basis * 100, 2)
      # POLICY COMPARISONS ARE MADE ON THE UNROUNDED RATIO, NOT ON THE STORED FIELD:
      #   ceiling test  (execute):  (delta_adjusted_gallons_after_trade / basis * 100) >  HedgePolicy.max_coverage_pct  -> ERR_COVERAGE_LIMIT_EXCEEDED
      #   floor test    (activate): round(planned_delta / basis * 100, 2)              >= HedgePolicy.min_coverage_pct  -> pass
      # The ceiling therefore rejects 60.00000909% even though coverage_pct_delta stores 60.00.
    input_set: "child HedgeInstrument rows of this program only; SETTLED and TERMINATED trades are excluded from all three measures; PROPOSED trades enter planned_coverage_pct_delta only."
    constants:
      INSTRUMENT_DELTA: { SWAP: 1.00, COLLAR: 0.65, CALL_OPTION: 0.50 }
    precision: "2 decimal places, round_half_up, for the three stored percentage fields; the ceiling comparison uses the unrounded quotient"
    variants:
      - name: notional_basis
        when: "reported coverage in HedgeProgram.coverage_pct_notional and in monthly reporting"
        difference: "every EXECUTED instrument contributes its full notional_gallons regardless of instrument_type"
      - name: delta_adjusted_basis
        when: "the max_coverage_pct ceiling test at execution and the min_coverage_pct floor test at activation"
        difference: "each instrument contributes notional_gallons * INSTRUMENT_DELTA, so a COLLAR counts 65% and a CALL_OPTION 50%; identical trades therefore yield a materially lower percentage than notional_basis"

  - name: counterparty_concentration_share_pct
    trigger: "evaluated inside POST /fuel/hedge-instruments/{id}/execute before the credit test; not persisted"
    algorithm: aggregation
    formula: |
      cp_notional = sum(i.notional_gallons
                        for i in HedgeInstrument
                        where i.hedge_program_id == this program
                          AND i.counterparty_id  == this instrument.counterparty_id
                          AND i.trade_status == EXECUTED)
                    + this_instrument.notional_gallons
      share_pct = 0.00 if consumption_basis_gallons == 0
                  else round(cp_notional / HedgeProgram.consumption_basis_gallons * 100, 2)
      if share_pct > HedgePolicy.max_single_counterparty_pct
         and no PolicyException with status == APPROVED
             and reason_code == COUNTERPARTY_CONCENTRATION
             and hedge_instrument_id == this instrument.id exists:
         raise ERR_EXCEPTION_REQUIRED
    input_set: "EXECUTED instruments of the same program and counterparty, plus the instrument being executed; PROPOSED, SETTLED and TERMINATED trades are excluded."
    precision: "2 decimal places, round_half_up; the comparison uses the rounded share_pct"

  - name: margin_requirement_usd
    trigger: "POST /fuel/hedge-instruments/{id}/execute (initial) and the CASCADE HOP 1 of POST /fuel/mark-to-market-runs/{id}/publish (revaluation); writes HedgeInstrument.margin_requirement_usd"
    algorithm: constraint_propagation
    formula: |
      # The concentration add-on looks circular: it is keyed on counterparty exposure,
      # and exposure is itself the sum of margin requirements. The evaluation order is
      # PINNED so the value is well defined:
      #
      # STEP 1 - base margin, independent of exposure
      base_margin_usd = round( notional_gallons * MARGIN_RATE_PER_GAL[instrument_type]
                               + max(0, -mtm_value_usd) * ADVERSE_MTM_FACTOR , 2)
      # STEP 2 - pre-addon exposure EXCLUDES this instrument's own contribution
      pre_addon_exposure_usd = Counterparty.utilized_credit_usd
                               - this_instrument.margin_requirement_usd_before_this_run
      #          (on the initial execute call the second term is 0, because the trade has
      #           never carried a requirement)
      # STEP 3 - concentration percentage from the pre-addon exposure
      concentration_pct = round(pre_addon_exposure_usd / Counterparty.credit_limit_usd * 100, 2)
      # STEP 4 - tier select on the rounded concentration_pct, lower bound inclusive
      addon_rate = 0.00 if concentration_pct <  50
                   0.10 if 50 <= concentration_pct < 75
                   0.25 if 75 <= concentration_pct < 90
                   0.50 if concentration_pct >= 90
      # STEP 5 - final requirement
      margin_requirement_usd = round(base_margin_usd * (1 + addon_rate), 2)
      # STEP 6 - only now is the counterparty ledger advanced, so the NEXT instrument's
      #          STEP 3 sees this requirement. Never re-enter STEP 3 for this instrument.
    input_set: "one HedgeInstrument at a time, processed in created_at ASC order when a mark-to-market publication revalues several trades of the same counterparty."
    constants:
      MARGIN_RATE_PER_GAL: { SWAP: 0.06, COLLAR: 0.04, CALL_OPTION: 0.02 }
      ADVERSE_MTM_FACTOR: 1.10
    precision: "2 decimal places, round_half_up at STEP 1, STEP 3 and STEP 5; no other intermediate rounding"

  - name: counterparty_credit_posture
    trigger: "recomputed whenever Counterparty.utilized_credit_usd changes — POST /fuel/hedge-instruments/{id}/execute, POST /fuel/hedge-instruments/{id}/terminate, the system EXECUTED -> SETTLED transition and CASCADE HOP 3 of POST /fuel/mark-to-market-runs/{id}/publish; writes Counterparty.utilization_pct and Counterparty.credit_posture"
    algorithm: threshold
    formula: |
      utilization_pct = round(utilized_credit_usd / credit_limit_usd * 100, 2)
      credit_posture = NORMAL      if utilization_pct <  70
                       WATCH       if 70  <= utilization_pct <  90
                       CONSTRAINED if 90  <= utilization_pct < 100
                       BREACH      if utilization_pct >= 100
      # Lower bounds are INCLUSIVE: exactly 90.00 is CONSTRAINED, exactly 100.00 is BREACH.
      # The comparison reads the ROUNDED utilization_pct.
    input_set: "the single Counterparty row; utilized_credit_usd is itself the sum of margin_requirement_usd over its EXECUTED instruments."
    constants:
      WATCH_PCT: 70
      CONSTRAINED_PCT: 90
      BREACH_PCT: 100
    precision: "2 decimal places, round_half_up for utilization_pct; the tier comparison uses the rounded value"

  - name: mtm_report_totals
    trigger: "POST /fuel/mark-to-market-runs/{id}/compute (OPEN -> COMPUTED and COMPUTED -> COMPUTED); writes MarkToMarketRun.instrument_count, total_mtm_usd, designated_mtm_usd, undesignated_mtm_usd and every in-scope HedgeInstrument.mtm_value_usd"
    algorithm: aggregation
    formula: |
      idx = MarkToMarketRun.settlement_index_usd_per_gal
      scope = every HedgeInstrument i where i.trade_status == EXECUTED
      # Scope is EXECUTED trades only, irrespective of maturity_month. maturity_month
      # governs auto-settlement at publication, NOT revaluation scope.
      # ROUNDING ORDER IS PINNED: round each instrument to cents FIRST, then sum the
      # rounded values. "Sum the exact values then round once" is WRONG and can differ
      # by whole cents on a three-trade portfolio.
      for i in scope, evaluated in created_at ASC order:
        if i.instrument_type == SWAP:
            exact_i = i.notional_gallons * (idx - i.strike_usd_per_gal)
        elif i.instrument_type == COLLAR:
            exact_i = i.notional_gallons * ( max(0, idx - i.cap_strike_usd_per_gal)
                                            - max(0, i.floor_strike_usd_per_gal - idx) )
        else:  # CALL_OPTION
            exact_i = i.notional_gallons * max(0, idx - i.strike_usd_per_gal) - i.premium_usd
        i.mtm_value_usd = round(exact_i, 2)                       # per-instrument rounding
      instrument_count      = count(scope)
      total_mtm_usd         = round( sum(i.mtm_value_usd for i in scope), 2 )
      designated_mtm_usd    = round( sum(i.mtm_value_usd for i in scope
                                         where i.accounting_status == DESIGNATED), 2 )
      undesignated_mtm_usd  = round( sum(i.mtm_value_usd for i in scope
                                         where i.accounting_status IN {UNDESIGNATED, DEDESIGNATED}), 2 )
      # designated_mtm_usd + undesignated_mtm_usd == total_mtm_usd always holds, because
      # the two accounting buckets partition scope and both sum already-rounded values.
    input_set: "every HedgeInstrument with trade_status == EXECUTED at the moment of the compute call; PROPOSED, SETTLED and TERMINATED trades are out of scope, so a trade settled by an earlier run never re-enters."
    precision: "2 decimal places, round_half_up, applied per instrument BEFORE summation and once more (a no-op) on each total"

  - name: effectiveness_ratio
    trigger: "POST /fuel/hedge-instruments/{id}/effectiveness-tests; writes EffectivenessTest.period_ratio, EffectivenessTest.cumulative_ratio, EffectivenessTest.result and the parent HedgeInstrument.cumulative_hedge_change_usd / cumulative_item_change_usd"
    algorithm: threshold
    formula: |
      # variant period_basis (informational)
      period_ratio = round( abs(hedge_change_usd / hedged_item_change_usd), 4 )
      # variant cumulative_basis (authoritative)
      cumulative_hedge_change_usd = HedgeInstrument.cumulative_hedge_change_usd + hedge_change_usd
      cumulative_item_change_usd  = HedgeInstrument.cumulative_item_change_usd  + hedged_item_change_usd
      cumulative_ratio = round( abs(cumulative_hedge_change_usd / cumulative_item_change_usd), 4 )
      # PASS/FAIL READS cumulative_ratio AFTER ROUNDING, bounds INCLUSIVE on both sides
      result = PASS if EFFECTIVENESS_MIN <= cumulative_ratio <= EFFECTIVENESS_MAX else FAIL
    input_set: "the new test plus the running cumulative totals carried on the parent instrument, which accumulate every prior test of that instrument in created_at ASC order; tests are never excluded once written."
    constants:
      EFFECTIVENESS_MIN: 0.8000
      EFFECTIVENESS_MAX: 1.2500
    precision: "4 decimal places, round_half_up, for both ratios; the PASS/FAIL comparison uses the rounded cumulative_ratio"
    variants:
      - name: period_basis
        when: "stored in period_ratio for the monthly effectiveness memo"
        difference: "uses only the current period's two amounts, so a single bad month reads as a failure"
      - name: cumulative_basis
        when: "the PASS/FAIL determination that drives de-designation"
        difference: "uses since-designation running totals, so a period_ratio of 0.5000 can still yield a PASS when the cumulative ratio is 0.8000"

  - name: tankering_uplift_cap_gallons
    trigger: "recomputed on every read of FlightLeg and evaluated inside POST /fuel/tankering-directives/{id}/approve, /revise and /reconcile; writes FlightLeg.uplift_cap_gallons"
    algorithm: threshold
    formula: |
      tank_headroom_gallons   = tank_capacity_gallons - planned_burn_gallons - RESERVE_GALLONS
      weight_headroom_gallons = (max_landing_weight_lbs - landing_weight_lbs) / LBS_PER_GAL
      uplift_cap_gallons = round( min( tank_headroom_gallons,
                                       weight_headroom_gallons,
                                       HedgePolicy.max_tankering_uplift_gallons ), 2 )
      # HedgePolicy here is the single row with status == ACTIVE; when none exists the
      # third term is treated as +infinity.
      if uplift_cap_gallons < 0: uplift_cap_gallons = 0.00
    input_set: "the single FlightLeg row plus the ACTIVE HedgePolicy."
    constants:
      RESERVE_GALLONS: 900
      LBS_PER_GAL: 6.7
    precision: "2 decimal places, round_half_up, applied once to the minimum"

  - name: tankering_burn_penalty_gallons
    trigger: "POST /fuel/flight-legs/{id}/tankering-directives and POST /fuel/tankering-directives/{id}/revise write planned_burn_penalty_gallons; POST /fuel/tankering-directives/{id}/reconcile writes reconciled_burn_penalty_gallons"
    algorithm: threshold
    formula: |
      # Four inputs interact non-linearly: uplift, fleet, block time and the payload
      # ratio, which enters through a hinge at PAYLOAD_RATIO_THRESHOLD.
      # STEP 1 (rounded to 4dp)
      payload_ratio = round( (FlightLeg.payload_lbs + uplift_gallons * LBS_PER_GAL)
                             / FlightLeg.max_takeoff_payload_lbs , 4 )
      # STEP 2 hinge — no penalty escalation at or below the threshold (rounded to 4dp)
      penalty_multiplier = round( 1 + max(0, payload_ratio - PAYLOAD_RATIO_THRESHOLD)
                                      * PAYLOAD_PENALTY_SLOPE , 4 )
      # STEP 3 raw carriage burn, NO intermediate rounding of block_hours
      raw_penalty_gallons = uplift_gallons
                            * FLEET_TANKER_BURN_FACTOR[FlightLeg.fleet_type]
                            * (block_minutes / 60)
      # STEP 4 single rounding to one tenth of a gallon
      burn_penalty_gallons = round(raw_penalty_gallons * penalty_multiplier, 1)
    input_set: "one directive at a time; uplift_gallons and block_minutes are taken from the variant in force."
    constants:
      FLEET_TANKER_BURN_FACTOR: { NARROWBODY: 0.030, WIDEBODY: 0.024, REGIONAL: 0.038 }
      PAYLOAD_RATIO_THRESHOLD: 0.85
      PAYLOAD_PENALTY_SLOPE: 2.0
      LBS_PER_GAL: 6.7
    precision: "payload_ratio and penalty_multiplier to 4 decimal places round_half_up; burn_penalty_gallons to 1 decimal place round_half_up; block_hours is never rounded"
    variants:
      - name: planned_basis
        when: "directive creation and every revision"
        difference: "uplift_gallons = TankeringDirective.requested_uplift_gallons, block_minutes = FlightLeg.planned_block_minutes"
      - name: reconciled_basis
        when: "directive reconciliation"
        difference: "uplift_gallons = FlightLeg.actual_uplift_gallons, block_minutes = FlightLeg.actual_block_minutes; the payload hinge is re-evaluated, so a smaller actual uplift can drop the multiplier back to 1.0000"

  - name: tankering_net_savings_usd
    trigger: "POST /fuel/flight-legs/{id}/tankering-directives and POST /fuel/tankering-directives/{id}/revise write planned_gross_savings_usd / planned_penalty_cost_usd / planned_net_savings_usd; POST /fuel/tankering-directives/{id}/reconcile writes reconciled_net_savings_usd and savings_variance_usd"
    algorithm: aggregation
    formula: |
      price_origin      = origin all-in price per gallon (see variants)
      price_destination = destination all-in price per gallon (see variants)
      gross_savings_usd = round( uplift_gallons * (price_destination - price_origin), 2 )
      penalty_cost_usd  = round( burn_penalty_gallons * price_origin, 2 )
      net_savings_usd   = round( gross_savings_usd - penalty_cost_usd, 2 )
      # savings_variance_usd is written only at reconciliation:
      savings_variance_usd = round( reconciled_net_savings_usd - planned_net_savings_usd, 2 )
      # all_in_price_usd_per_gal of a SupplyContract =
      #   round(index_price_usd_per_gal + differential_usd_per_gal
      #         + Station.into_plane_fee_usd_per_gal, 4)
    input_set: "the origin and destination Station rows, each with EXACTLY ONE SupplyContract whose status == ACTIVE at the evaluation instant; zero or two ACTIVE contracts at either station is ERR_NO_ACTIVE_SUPPLY_CONTRACT, so no ranking or tie-break over contracts is ever required."
    precision: "prices to 4 decimal places, round_half_up; all three USD outputs to 2 decimal places, round_half_up, each rounded independently (gross and penalty are NOT summed before rounding)"
    variants:
      - name: planned_basis
        when: "directive creation and every revision"
        difference: "prices are read LIVE from the ACTIVE SupplyContract rows at the moment of the call; uplift and burn penalty come from tankering_burn_penalty_gallons variant planned_basis"
      - name: reconciled_basis
        when: "directive reconciliation"
        difference: "prices are read from TankeringDirective.pinned_origin_price_usd_per_gal / pinned_destination_price_usd_per_gal frozen at approval, so a post-approval contract change cannot move the reconciled figure; uplift and burn penalty come from variant reconciled_basis"

  - name: station_supply_posture
    trigger: "recomputed on every read of Station and after POST /fuel/stations/{id}/inventory-adjustments, the TankeringDirective APPROVED -> EXECUTED transition and the EXECUTED -> RECONCILED transition; writes Station.effective_inventory_gallons, Station.days_cover and Station.supply_posture"
    algorithm: threshold
    formula: |
      consortium_entitlement_gallons =
          0 if consortium_member == false
            else round(consortium_share_pct / 100 * consortium_pool_gallons, 2)
      effective_inventory_gallons = inventory_gallons + consortium_entitlement_gallons
      days_cover = round(effective_inventory_gallons / avg_daily_liftings_gallons, 2)
      min_days = HedgePolicy.min_days_cover of the single ACTIVE HedgePolicy
      supply_posture = SHORT  if days_cover <  min_days
                       WATCH  if min_days <= days_cover < (2 * min_days)
                       NORMAL if days_cover >= (2 * min_days)
      # days_cover exactly equal to min_days is WATCH, never SHORT.
    input_set: "the single Station row plus the ACTIVE HedgePolicy; when no ACTIVE HedgePolicy exists, min_days is 0 and supply_posture is NORMAL."
    precision: "2 decimal places, round_half_up for the entitlement and for days_cover; tier comparison uses the rounded days_cover"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the role in X-User-Role is listed in the called endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "request body is well formed: every required input field present, types and enum members valid, numeric constraints honored, conditional strike fields consistent with instrument_type, and any required expected_*_version field present"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 4
    category: existence
    check: "every path-segment resource exists, validated left to right"
    error_id: "ERR_POLICY_NOT_FOUND | ERR_COUNTERPARTY_NOT_FOUND | ERR_STATION_NOT_FOUND | ERR_FORECAST_NOT_FOUND | ERR_PROGRAM_NOT_FOUND | ERR_INSTRUMENT_NOT_FOUND | ERR_COLLATERAL_POSTING_NOT_FOUND | ERR_MTM_RUN_NOT_FOUND | ERR_FLIGHT_LEG_NOT_FOUND | ERR_DIRECTIVE_NOT_FOUND | ERR_EXCEPTION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 5
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row (policy_id, counterparty_id, hedge_instrument_id, origin_station_id, destination_station_id, hedge_program_id, tankering_directive_id)"
    error_id: "ERR_POLICY_NOT_FOUND | ERR_COUNTERPARTY_NOT_FOUND | ERR_INSTRUMENT_NOT_FOUND | ERR_STATION_NOT_FOUND | ERR_PROGRAM_NOT_FOUND | ERR_DIRECTIVE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /fuel/hedge-programs, POST /fuel/counterparties/{id}/collateral-postings, POST /fuel/hedge-programs/{id}/instruments, POST /fuel/flight-legs, POST /fuel/policy-exceptions"
  - priority: 6
    category: auth
    check: "when X-User-Role is StationCoordinator, X-User-ID equals the Station.id in the path"
    error_id: ERR_STATION_NOT_OWNED
    http_status: 403
    applies_to: "POST /fuel/stations/{id}/inventory-adjustments"
  - priority: 7
    category: state
    check: "the target resource is in a state from which this transition is declared in §1.2, including cross-entity state gates (program ACTIVE for execute and designate, instrument EXECUTED for designate and collateral posting)"
    error_id: "ERR_PROGRAM_INVALID_STATE | ERR_PROGRAM_NOT_ACTIVE | ERR_INSTRUMENT_INVALID_TRADE_STATE | ERR_INSTRUMENT_INVALID_ACCOUNTING_STATE | ERR_DIRECTIVE_INVALID_STATE | ERR_POSTING_INVALID_STATE | ERR_MTM_RUN_INVALID_STATE | ERR_EXCEPTION_INVALID_STATE | ERR_FORECAST_INVALID_STATE"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 8
    category: state
    check: "expected_<parent>_version equals the parent's current version per §1.2.1"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /fuel/hedge-programs/{id}/instruments, POST /fuel/counterparties/{id}/collateral-postings, POST /fuel/flight-legs/{id}/tankering-directives"
  - priority: 9
    category: business_safety
    check: "tankering uplift does not exceed FlightLeg.uplift_cap_gallons (tank headroom, landing-weight headroom and the policy ceiling)"
    error_id: ERR_TANKERING_WEIGHT_LIMIT
    http_status: 422
    applies_to: "POST /fuel/tankering-directives/{id}/approve, POST /fuel/tankering-directives/{id}/reconcile"
  - priority: 10
    category: business_safety
    check: "uplift is strictly positive: requested_uplift_gallons on create/revise and actual_uplift_gallons on reconcile are both > 0"
    error_id: ERR_ZERO_UPLIFT
    http_status: 422
    applies_to: "POST /fuel/flight-legs/{id}/tankering-directives, POST /fuel/tankering-directives/{id}/revise, POST /fuel/tankering-directives/{id}/reconcile"
  - priority: 11
    category: business_temporal
    check: "half-open interval rule: the forecast's [period_start_month, period_end_month) must not intersect that of any other PUBLISHED ConsumptionForecast with the same fleet_type AND route_group. Touching intervals (A.period_end_month == B.period_start_month) do NOT intersect and are allowed."
    error_id: ERR_FORECAST_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /fuel/consumption-forecasts/{id}/publish"
  - priority: 12
    category: business_temporal
    check: "closed interval rule: the contract's [term_start_date, term_end_date] must not intersect that of any other SupplyContract on the same station_id. Both endpoints are inclusive, so sharing a single day is an intersection."
    error_id: ERR_CONTRACT_TERM_OVERLAP
    http_status: 409
    applies_to: "POST /fuel/stations/{id}/supply-contracts"
  - priority: 13
    category: business_temporal
    check: "changeover buffer rule: consecutive non-intersecting contracts on the same station must be separated by at least CHANGEOVER_BUFFER_DAYS = 7 clear days, i.e. (later.term_start_date - earlier.term_end_date) >= 7 days. A gap of exactly 7 days passes; 6 days fails."
    error_id: ERR_CONTRACT_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /fuel/stations/{id}/supply-contracts"
  - priority: 14
    category: business_referential
    check: "the origin Station and the destination Station each have exactly one SupplyContract with status == ACTIVE at the evaluation instant"
    error_id: ERR_NO_ACTIVE_SUPPLY_CONTRACT
    http_status: 409
    applies_to: "POST /fuel/flight-legs/{id}/tankering-directives, POST /fuel/tankering-directives/{id}/revise, POST /fuel/tankering-directives/{id}/approve"
  - priority: 15
    category: business_referential
    check: "the facing Counterparty has status == APPROVED"
    error_id: ERR_COUNTERPARTY_NOT_APPROVED
    http_status: 409
    applies_to: "POST /fuel/hedge-instruments/{id}/execute"
  - priority: 16
    category: business_referential
    check: "instrument_type is a member of the governing HedgePolicy.permitted_instrument_types"
    error_id: ERR_INSTRUMENT_TYPE_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /fuel/hedge-programs/{id}/instruments"
  - priority: 17
    category: business_constraint
    check: "uniqueness: HedgePolicy.policy_code, Counterparty.counterparty_code, Station.iata_code, HedgeProgram.program_code, MarkToMarketRun.period_month, FlightLeg.(flight_number, departure_date) globally; SupplyContract.contract_ref per station_id"
    error_id: "ERR_DUPLICATE_POLICY_CODE | ERR_DUPLICATE_COUNTERPARTY_CODE | ERR_DUPLICATE_STATION_CODE | ERR_DUPLICATE_PROGRAM_CODE | ERR_DUPLICATE_MTM_PERIOD | ERR_DUPLICATE_FLIGHT_LEG | ERR_DUPLICATE_CONTRACT_REF"
    http_status: 409
    applies_to: "POST /fuel/hedge-policies, POST /fuel/counterparties, POST /fuel/stations, POST /fuel/hedge-programs, POST /fuel/mark-to-market-runs, POST /fuel/flight-legs, POST /fuel/stations/{id}/supply-contracts"
  - priority: 18
    category: business_constraint
    check: "segregation of duties: X-User-ID must differ from HedgeProgram.submitted_by_user_id on activation and from PolicyException.requested_by_user_id on approve/deny"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /fuel/hedge-programs/{id}/activate, POST /fuel/policy-exceptions/{id}/approve, POST /fuel/policy-exceptions/{id}/deny"
  - priority: 19
    category: business_fiscal
    check: "planned_coverage_pct_delta >= HedgePolicy.min_coverage_pct"
    error_id: ERR_COVERAGE_FLOOR_NOT_MET
    http_status: 422
    applies_to: "POST /fuel/hedge-programs/{id}/activate"
  - priority: 20
    category: business_fiscal
    check: "the unrounded post-trade delta-adjusted coverage percentage must not exceed HedgePolicy.max_coverage_pct"
    error_id: ERR_COVERAGE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /fuel/hedge-instruments/{id}/execute"
  - priority: 21
    category: business_fiscal
    check: "post-trade counterparty_concentration_share_pct above HedgePolicy.max_single_counterparty_pct requires an APPROVED PolicyException with reason_code COUNTERPARTY_CONCENTRATION referencing this instrument; re-designating a DEDESIGNATED trade requires an APPROVED PolicyException with reason_code EARNINGS_VOLATILITY_BREACH referencing it"
    error_id: ERR_EXCEPTION_REQUIRED
    http_status: 422
    applies_to: "POST /fuel/hedge-instruments/{id}/execute, POST /fuel/hedge-instruments/{id}/designate"
  - priority: 22
    category: business_fiscal
    check: "Counterparty.utilized_credit_usd + this trade's margin_requirement_usd <= Counterparty.credit_limit_usd"
    error_id: ERR_COUNTERPARTY_CREDIT_EXCEEDED
    http_status: 422
    applies_to: "POST /fuel/hedge-instruments/{id}/execute"
  - priority: 23
    category: business_fiscal
    check: "the posted amount_usd is at least the posting's frozen required_amount_usd"
    error_id: ERR_COLLATERAL_SHORTFALL
    http_status: 422
    applies_to: "POST /fuel/collateral-postings/{id}/post"
  - priority: 24
    category: business_fiscal
    check: "planned_net_savings_usd > 0 unless an APPROVED PolicyException with reason_code TANKERING_UNECONOMIC references this directive"
    error_id: ERR_TANKERING_NOT_ECONOMIC
    http_status: 422
    applies_to: "POST /fuel/tankering-directives/{id}/approve"
  - priority: 25
    category: business_fiscal
    check: "origin Station.supply_posture != SHORT at approval, and origin Station.inventory_gallons >= requested_uplift_gallons at execution"
    error_id: ERR_STATION_INVENTORY_SHORT
    http_status: 422
    applies_to: "POST /fuel/tankering-directives/{id}/approve, POST /fuel/tankering-directives/{id}/execute"
  - priority: 26
    category: business_fiscal
    check: "the sizing input_set matched at least one PUBLISHED ConsumptionForecast"
    error_id: ERR_NO_FORECAST_BASIS
    http_status: 422
    applies_to: "POST /fuel/hedge-programs/{id}/size"
  - priority: 27
    category: business_constraint
    check: "HedgeProgram.open_instrument_count == 0 before closing"
    error_id: ERR_PROGRAM_HAS_OPEN_INSTRUMENTS
    http_status: 409
    applies_to: "POST /fuel/hedge-programs/{id}/close"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---------------------------------------------------------------- HedgePolicy
  - method: POST
    path: "/fuel/hedge-policies"
    description: "Create a fuel hedging policy. Creating a policy for a fiscal_year that already has an ACTIVE policy supersedes the older one."
    roles: [RiskPolicyAdmin]
    code: 201
    input: [policy_code, fiscal_year, max_coverage_pct, min_coverage_pct, max_single_counterparty_pct, permitted_instrument_types, max_earnings_volatility_usd, max_tankering_uplift_gallons, min_days_cover, eligible_fleet_types]
    output: HedgePolicy
    side_effects:
      - "creates the HedgePolicy with status ACTIVE and open_exception_count 0"
      - "sets status = SUPERSEDED on any pre-existing ACTIVE HedgePolicy with the same fiscal_year and increments its version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_DUPLICATE_POLICY_CODE]

  - method: GET
    path: "/fuel/hedge-policies/{id}"
    description: "Read one hedging policy including its live open_exception_count."
    roles: [RiskPolicyAdmin, FuelAnalyst, TreasuryRiskManager, HedgeAccountant, FuelOpsController, StationCoordinator]
    code: 200
    input: []
    output: HedgePolicy
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_POLICY_NOT_FOUND]

  # --------------------------------------------------------------- Counterparty
  - method: POST
    path: "/fuel/counterparties"
    description: "Register a swap dealer or bank as a hedge counterparty. A counterparty registered at credit_rating BB is created SUSPENDED."
    roles: [RiskPolicyAdmin]
    code: 201
    input: [counterparty_code, legal_name, credit_rating, credit_limit_usd]
    output: Counterparty
    side_effects:
      - "creates the Counterparty with status APPROVED, or SUSPENDED when credit_rating == BB"
      - "initialises utilized_credit_usd, posted_collateral_usd, utilization_pct and open_margin_call_count to 0 and credit_posture to NORMAL"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_DUPLICATE_COUNTERPARTY_CODE]

  - method: GET
    path: "/fuel/counterparties/{id}"
    description: "Read one counterparty with its live credit ledgers, utilization_pct and credit_posture."
    roles: [RiskPolicyAdmin, FuelAnalyst, TreasuryRiskManager, HedgeAccountant, FuelOpsController]
    code: 200
    input: []
    output: Counterparty
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_COUNTERPARTY_NOT_FOUND]

  - method: POST
    path: "/fuel/counterparties/{id}/credit-review"
    description: "Record a periodic credit review. A review that sets credit_rating to BB suspends the counterparty; a review that raises it above BB restores APPROVED."
    roles: [TreasuryRiskManager, RiskPolicyAdmin]
    code: 200
    input: [credit_rating, review_note, "credit_limit_usd?"]
    output: Counterparty
    side_effects:
      - "overwrites credit_rating, and credit_limit_usd when supplied"
      - "sets status = SUSPENDED when credit_rating == BB, otherwise APPROVED"
      - "sets last_review_note = review_note"
      - "recomputes utilization_pct and credit_posture per calculations.counterparty_credit_posture"
      - "increments Counterparty.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_COUNTERPARTY_NOT_FOUND]

  - method: POST
    path: "/fuel/counterparties/{id}/collateral-postings"
    description: "Raise a manual collateral posting requirement against one of this counterparty's EXECUTED trades. OCC-guarded on the counterparty per §1.2.1 rule collateral-post-stale-counterparty."
    roles: [RiskPolicyAdmin]
    code: 201
    input: [hedge_instrument_id, collateral_type, expected_counterparty_version]
    output: CollateralPosting
    side_effects:
      - "creates the CollateralPosting with status REQUIRED, origin MANUAL, posted_amount_usd 0 and required_amount_usd = max(0, HedgeInstrument.margin_requirement_usd - HedgeInstrument.collateral_posted_usd) frozen at creation"
      - "increments Counterparty.open_margin_call_count by 1"
      - "increments Counterparty.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_COUNTERPARTY_NOT_FOUND, ERR_INSTRUMENT_NOT_FOUND, ERR_INSTRUMENT_INVALID_TRADE_STATE, ERR_STALE_VERSION]

  - method: GET
    path: "/fuel/counterparties/{id}/collateral-postings"
    description: "List collateral postings held against this counterparty, ordered by created_at ASC."
    roles: [RiskPolicyAdmin, TreasuryRiskManager, HedgeAccountant]
    code: 200
    input: ["status?", "origin?", "limit?", "offset?"]
    output: CollateralPosting[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_COUNTERPARTY_NOT_FOUND]

  # -------------------------------------------------------------------- Station
  - method: POST
    path: "/fuel/stations"
    description: "Create a fuel station with its into-plane fee and consortium participation."
    roles: [RiskPolicyAdmin]
    code: 201
    input: [iata_code, name, into_plane_fee_usd_per_gal, avg_daily_liftings_gallons, "consortium_member?", "consortium_share_pct?", "consortium_pool_gallons?"]
    output: Station
    side_effects:
      - "creates the Station with inventory_gallons 0"
      - "runs calculations.station_supply_posture and writes effective_inventory_gallons, days_cover and supply_posture"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_DUPLICATE_STATION_CODE]

  - method: GET
    path: "/fuel/stations/{id}"
    description: "Read one station with its live inventory, days_cover and supply_posture."
    roles: [RiskPolicyAdmin, FuelAnalyst, TreasuryRiskManager, HedgeAccountant, FuelOpsController, StationCoordinator]
    code: 200
    input: []
    output: Station
    side_effects:
      - "recomputes effective_inventory_gallons, days_cover and supply_posture per calculations.station_supply_posture without incrementing version"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_STATION_NOT_FOUND]

  - method: POST
    path: "/fuel/stations/{id}/supply-contracts"
    description: "Add a station supply contract. Terms are closed intervals that must not overlap and must be separated by at least a 7-day changeover buffer."
    roles: [RiskPolicyAdmin]
    code: 201
    input: [contract_ref, index_basis, index_price_usd_per_gal, differential_usd_per_gal, term_start_date, term_end_date, min_monthly_gallons, max_monthly_gallons]
    output: SupplyContract
    side_effects:
      - "creates the SupplyContract with station_id taken from the path"
      - "computes all_in_price_usd_per_gal = round(index_price_usd_per_gal + differential_usd_per_gal + Station.into_plane_fee_usd_per_gal, 4)"
      - "derives status from the logical clock (SCHEDULED, ACTIVE or EXPIRED)"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_STATION_NOT_FOUND, ERR_CONTRACT_TERM_OVERLAP, ERR_CONTRACT_BUFFER_VIOLATION, ERR_DUPLICATE_CONTRACT_REF]

  - method: GET
    path: "/fuel/stations/{id}/supply-contracts"
    description: "List this station's supply contracts with clock-derived status, ordered by term_start_date ASC then created_at ASC."
    roles: [RiskPolicyAdmin, FuelAnalyst, TreasuryRiskManager, FuelOpsController, StationCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SupplyContract[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_STATION_NOT_FOUND]

  - method: POST
    path: "/fuel/stations/{id}/inventory-adjustments"
    description: "Record a physical inventory movement (delivery, meter correction, consortium pool restatement) at this station. A StationCoordinator may only adjust its own station."
    roles: [FuelOpsController, StationCoordinator]
    code: 200
    input: [delta_gallons, reason, "consortium_pool_gallons?"]
    output: Station
    side_effects:
      - "adds delta_gallons to Station.inventory_gallons (delta_gallons may be negative but the result must stay >= 0)"
      - "overwrites consortium_pool_gallons when supplied"
      - "recomputes effective_inventory_gallons, days_cover and supply_posture per calculations.station_supply_posture"
      - "increments Station.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_STATION_NOT_FOUND, ERR_STATION_NOT_OWNED]

  # -------------------------------------------------------- ConsumptionForecast
  - method: POST
    path: "/fuel/consumption-forecasts"
    description: "Create a DRAFT consumption forecast for a fleet, route group and season over a half-open month interval."
    roles: [FuelAnalyst]
    code: 201
    input: [fleet_type, route_group, season, period_start_month, period_end_month, forecast_gallons]
    output: ConsumptionForecast
    side_effects:
      - "creates the ConsumptionForecast with status DRAFT and published_at null"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: GET
    path: "/fuel/consumption-forecasts"
    description: "List consumption forecasts, ordered by period_start_month ASC then created_at ASC."
    roles: [RiskPolicyAdmin, FuelAnalyst, TreasuryRiskManager, HedgeAccountant]
    code: 200
    input: ["status?", "fleet_type?", "route_group?", "season?", "limit?", "offset?"]
    output: ConsumptionForecast[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: POST
    path: "/fuel/consumption-forecasts/{id}/publish"
    description: "Publish a DRAFT forecast so hedge sizing can consume it. Rejected when its half-open month interval overlaps another PUBLISHED forecast for the same fleet_type and route_group."
    roles: [FuelAnalyst]
    code: 200
    input: []
    output: ConsumptionForecast
    side_effects:
      - "sets status = PUBLISHED and published_at = logical clock now"
      - "increments ConsumptionForecast.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_FORECAST_NOT_FOUND, ERR_FORECAST_INVALID_STATE, ERR_FORECAST_PERIOD_OVERLAP]

  # --------------------------------------------------------------- HedgeProgram
  - method: POST
    path: "/fuel/hedge-programs"
    description: "Create a DRAFT hedge program bound to a policy for its whole life."
    roles: [FuelAnalyst]
    code: 201
    input: [policy_id, program_code, period_start_month, period_end_month, route_groups, target_coverage_pct]
    output: HedgeProgram
    side_effects:
      - "creates the HedgeProgram with status DRAFT, all computed ledgers 0, compliance_posture COMPLIANT, submitted_by_user_id null and return_count 0"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_POLICY_NOT_FOUND, ERR_DUPLICATE_PROGRAM_CODE]

  - method: GET
    path: "/fuel/hedge-programs/{id}"
    description: "Read one hedge program with its coverage, mark-to-market and compliance fields."
    roles: [RiskPolicyAdmin, FuelAnalyst, TreasuryRiskManager, HedgeAccountant, FuelOpsController]
    code: 200
    input: []
    output: HedgeProgram
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PROGRAM_NOT_FOUND]

  - method: GET
    path: "/fuel/hedge-programs"
    description: "List hedge programs, ordered by created_at ASC."
    roles: [RiskPolicyAdmin, FuelAnalyst, TreasuryRiskManager, HedgeAccountant]
    code: 200
    input: ["policy_id?", "status?", "compliance_posture?", "limit?", "offset?"]
    output: HedgeProgram[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: POST
    path: "/fuel/hedge-programs/{id}/size"
    description: "Run or re-run hedge sizing, freezing the season-weighted consumption basis from PUBLISHED forecasts. Valid from DRAFT and from SIZING."
    roles: [FuelAnalyst]
    code: 200
    input: []
    output: HedgeProgram
    side_effects:
      - "runs calculations.consumption_basis_gallons and overwrites consumption_basis_gallons"
      - "recomputes coverage_pct_notional, coverage_pct_delta and planned_coverage_pct_delta"
      - "sets status = SIZING"
      - "increments HedgeProgram.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PROGRAM_NOT_FOUND, ERR_PROGRAM_INVALID_STATE, ERR_NO_FORECAST_BASIS]

  - method: POST
    path: "/fuel/hedge-programs/{id}/submit"
    description: "Submit a sized program with at least one open instrument for treasury approval."
    roles: [FuelAnalyst]
    code: 200
    input: []
    output: HedgeProgram
    side_effects:
      - "sets status = PENDING_APPROVAL and submitted_by_user_id = X-User-ID"
      - "increments HedgeProgram.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PROGRAM_NOT_FOUND, ERR_PROGRAM_INVALID_STATE]

  - method: POST
    path: "/fuel/hedge-programs/{id}/return"
    description: "Return a submitted program to SIZING for rework."
    roles: [TreasuryRiskManager]
    code: 200
    input: [return_note]
    output: HedgeProgram
    side_effects:
      - "sets status = SIZING, increments return_count by 1 and clears submitted_by_user_id to null"
      - "increments HedgeProgram.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_PROGRAM_NOT_FOUND, ERR_PROGRAM_INVALID_STATE]

  - method: POST
    path: "/fuel/hedge-programs/{id}/activate"
    description: "Activate a submitted program. Segregation of duties blocks the submitter, and planned delta-adjusted coverage must reach the policy floor."
    roles: [TreasuryRiskManager]
    code: 200
    input: []
    output: HedgeProgram
    side_effects:
      - "sets status = ACTIVE"
      - "increments HedgeProgram.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PROGRAM_NOT_FOUND, ERR_PROGRAM_INVALID_STATE, ERR_SEGREGATION_OF_DUTIES, ERR_COVERAGE_FLOOR_NOT_MET]

  - method: POST
    path: "/fuel/hedge-programs/{id}/close"
    description: "Close an active program once no instrument remains PROPOSED or EXECUTED."
    roles: [TreasuryRiskManager]
    code: 200
    input: []
    output: HedgeProgram
    side_effects:
      - "sets status = CLOSED"
      - "increments HedgeProgram.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PROGRAM_NOT_FOUND, ERR_PROGRAM_INVALID_STATE, ERR_PROGRAM_HAS_OPEN_INSTRUMENTS]

  - method: POST
    path: "/fuel/hedge-programs/{id}/instruments"
    description: "Propose a hedge instrument on this program. OCC-guarded on the program per §1.2.1 rule instrument-create-stale-program. Valid while the program is SIZING, PENDING_APPROVAL or ACTIVE."
    roles: [FuelAnalyst]
    code: 201
    input: [counterparty_id, instrument_type, notional_gallons, maturity_month, expected_hedge_program_version, "strike_usd_per_gal?", "cap_strike_usd_per_gal?", "floor_strike_usd_per_gal?", "premium_usd?"]
    output: HedgeInstrument
    side_effects:
      - "creates the HedgeInstrument with hedge_program_id from the path, trade_status PROPOSED, accounting_status UNDESIGNATED and proposed_by_user_id = X-User-ID"
      - "writes delta_factor from INSTRUMENT_DELTA and delta_adjusted_gallons = round(notional_gallons * delta_factor, 2)"
      - "increments HedgeProgram.open_instrument_count by 1 and recomputes planned_coverage_pct_delta"
      - "increments HedgeProgram.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_PROGRAM_NOT_FOUND, ERR_COUNTERPARTY_NOT_FOUND, ERR_PROGRAM_INVALID_STATE, ERR_STALE_VERSION, ERR_INSTRUMENT_TYPE_NOT_PERMITTED]

  - method: GET
    path: "/fuel/hedge-programs/{id}/instruments"
    description: "List this program's hedge instruments, ordered by created_at ASC."
    roles: [RiskPolicyAdmin, FuelAnalyst, TreasuryRiskManager, HedgeAccountant]
    code: 200
    input: ["trade_status?", "accounting_status?", "counterparty_id?", "limit?", "offset?"]
    output: HedgeInstrument[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PROGRAM_NOT_FOUND]

  # ------------------------------------------------------------ HedgeInstrument
  - method: GET
    path: "/fuel/hedge-instruments/{id}"
    description: "Read one hedge instrument with both status dimensions, margin, collateral and cumulative effectiveness totals."
    roles: [RiskPolicyAdmin, FuelAnalyst, TreasuryRiskManager, HedgeAccountant]
    code: 200
    input: []
    output: HedgeInstrument
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INSTRUMENT_NOT_FOUND]

  - method: GET
    path: "/fuel/hedge-instruments"
    description: "List hedge instruments across programs, ordered by created_at ASC."
    roles: [RiskPolicyAdmin, FuelAnalyst, TreasuryRiskManager, HedgeAccountant]
    code: 200
    input: ["counterparty_id?", "hedge_program_id?", "trade_status?", "accounting_status?", "maturity_month?", "limit?", "offset?"]
    output: HedgeInstrument[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: POST
    path: "/fuel/hedge-instruments/{id}/execute"
    description: "Execute a proposed trade against the counterparty. Enforces the policy coverage ceiling on the unrounded delta-adjusted ratio, the single-counterparty concentration cap and the counterparty credit limit."
    roles: [TreasuryRiskManager]
    code: 200
    input: []
    output: HedgeInstrument
    side_effects:
      - "sets trade_status = EXECUTED and executed_at = logical clock now"
      - "runs calculations.margin_requirement_usd and writes margin_requirement_usd"
      - "adds margin_requirement_usd to Counterparty.utilized_credit_usd, then recomputes Counterparty.utilization_pct and credit_posture"
      - "adds notional_gallons and delta_adjusted_gallons to the program ledgers and recomputes coverage_pct_notional, coverage_pct_delta and planned_coverage_pct_delta"
      - "increments HedgeInstrument.version, Counterparty.version and HedgeProgram.version by 1 each"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INSTRUMENT_NOT_FOUND, ERR_INSTRUMENT_INVALID_TRADE_STATE, ERR_PROGRAM_NOT_ACTIVE, ERR_COUNTERPARTY_NOT_APPROVED, ERR_COVERAGE_LIMIT_EXCEEDED, ERR_EXCEPTION_REQUIRED, ERR_COUNTERPARTY_CREDIT_EXCEEDED]

  - method: POST
    path: "/fuel/hedge-instruments/{id}/designate"
    description: "Designate an executed trade as a cash-flow hedge, or re-designate a de-designated trade when an approved earnings-volatility exception exists."
    roles: [HedgeAccountant]
    code: 200
    input: []
    output: HedgeInstrument
    side_effects:
      - "sets accounting_status = DESIGNATED and designated_at = logical clock now, leaving trade_status untouched"
      - "on re-designation from DEDESIGNATED, reclassifies the instrument's mtm_value_usd from HedgeProgram.undesignated_mtm_usd into designated_mtm_usd and recomputes earnings_volatility_usd and compliance_posture"
      - "increments HedgeInstrument.version by 1, and HedgeProgram.version by 1 on re-designation"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INSTRUMENT_NOT_FOUND, ERR_INSTRUMENT_INVALID_ACCOUNTING_STATE, ERR_INSTRUMENT_INVALID_TRADE_STATE, ERR_PROGRAM_NOT_ACTIVE, ERR_EXCEPTION_REQUIRED]

  - method: POST
    path: "/fuel/hedge-instruments/{id}/terminate"
    description: "Unwind a proposed or executed trade. Termination of an executed trade returns its posted collateral and reverses its coverage and credit consumption."
    roles: [TreasuryRiskManager]
    code: 200
    input: [termination_reason]
    output: HedgeInstrument
    side_effects:
      - "sets trade_status = TERMINATED, zeroes margin_requirement_usd and de-designates the trade when it was DESIGNATED"
      - "reverses hedged_gallons, delta_adjusted_gallons and open_instrument_count on the program and recomputes the three coverage fields"
      - "transitions every POSTED CollateralPosting of this trade to RETURNED and reduces Counterparty.posted_collateral_usd accordingly"
      - "reduces Counterparty.utilized_credit_usd by the pre-termination margin_requirement_usd and recomputes utilization_pct and credit_posture"
      - "increments HedgeInstrument.version, HedgeProgram.version, Counterparty.version and each touched CollateralPosting.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_INSTRUMENT_NOT_FOUND, ERR_INSTRUMENT_INVALID_TRADE_STATE]

  - method: POST
    path: "/fuel/hedge-instruments/{id}/effectiveness-tests"
    description: "Record a retrospective dollar-offset effectiveness test. A FAIL on the cumulative ratio de-designates the trade and can cascade into an auto-raised policy exception."
    roles: [HedgeAccountant]
    code: 201
    input: [period_month, hedge_change_usd, hedged_item_change_usd]
    output: EffectivenessTest
    side_effects:
      - "creates the EffectivenessTest with tested_by_user_id = X-User-ID"
      - "runs calculations.effectiveness_ratio and writes period_ratio, cumulative_ratio and result"
      - "advances HedgeInstrument.cumulative_hedge_change_usd and cumulative_item_change_usd and increments HedgeInstrument.version by 1"
      - "on result FAIL with accounting_status DESIGNATED, runs the de-designation cascade of §1.2 (HedgeInstrument, HedgeProgram, PolicyException, HedgePolicy)"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_INSTRUMENT_NOT_FOUND, ERR_INSTRUMENT_INVALID_TRADE_STATE]

  - method: GET
    path: "/fuel/hedge-instruments/{id}/effectiveness-tests"
    description: "List this instrument's effectiveness tests, ordered by created_at ASC."
    roles: [RiskPolicyAdmin, TreasuryRiskManager, HedgeAccountant]
    code: 200
    input: ["result?", "limit?", "offset?"]
    output: EffectivenessTest[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INSTRUMENT_NOT_FOUND]

  - method: GET
    path: "/fuel/hedge-instruments/{id}/collateral-postings"
    description: "List collateral postings raised against this trade, including margin calls synthesized by mark-to-market publication, ordered by created_at ASC."
    roles: [RiskPolicyAdmin, TreasuryRiskManager, HedgeAccountant]
    code: 200
    input: ["status?", "origin?", "limit?", "offset?"]
    output: CollateralPosting[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INSTRUMENT_NOT_FOUND]

  # ----------------------------------------------------------- CollateralPosting
  - method: POST
    path: "/fuel/collateral-postings/{id}/post"
    description: "Post collateral against a required posting. The amount must at least cover the frozen required_amount_usd."
    roles: [RiskPolicyAdmin]
    code: 200
    input: [amount_usd]
    output: CollateralPosting
    side_effects:
      - "sets status = POSTED, posted_amount_usd = amount_usd and posted_at = logical clock now"
      - "adds posted_amount_usd to Counterparty.posted_collateral_usd and HedgeInstrument.collateral_posted_usd"
      - "decrements Counterparty.open_margin_call_count by 1"
      - "increments CollateralPosting.version, Counterparty.version and HedgeInstrument.version by 1 each"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_COLLATERAL_POSTING_NOT_FOUND, ERR_POSTING_INVALID_STATE, ERR_INSTRUMENT_INVALID_TRADE_STATE, ERR_COLLATERAL_SHORTFALL]

  - method: POST
    path: "/fuel/collateral-postings/{id}/return"
    description: "Return posted collateral once the trade has settled or terminated, or once the margin requirement has fallen below the posted amount."
    roles: [RiskPolicyAdmin]
    code: 200
    input: [return_reason]
    output: CollateralPosting
    side_effects:
      - "sets status = RETURNED and returned_at = logical clock now, retaining posted_amount_usd for audit"
      - "subtracts posted_amount_usd from Counterparty.posted_collateral_usd and HedgeInstrument.collateral_posted_usd"
      - "increments CollateralPosting.version, Counterparty.version and HedgeInstrument.version by 1 each"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_COLLATERAL_POSTING_NOT_FOUND, ERR_POSTING_INVALID_STATE]

  # ------------------------------------------------------------ MarkToMarketRun
  - method: POST
    path: "/fuel/mark-to-market-runs"
    description: "Open a monthly mark-to-market run for a reporting month at a given settlement index."
    roles: [HedgeAccountant]
    code: 201
    input: [period_month, settlement_index_usd_per_gal]
    output: MarkToMarketRun
    side_effects:
      - "creates the MarkToMarketRun with status OPEN and all report totals 0"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_DUPLICATE_MTM_PERIOD]

  - method: GET
    path: "/fuel/mark-to-market-runs/{id}"
    description: "Read one mark-to-market run with its portfolio totals, margin-call count and settled-instrument count."
    roles: [RiskPolicyAdmin, TreasuryRiskManager, HedgeAccountant]
    code: 200
    input: []
    output: MarkToMarketRun
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_MTM_RUN_NOT_FOUND]

  - method: POST
    path: "/fuel/mark-to-market-runs/{id}/compute"
    description: "Compute or recompute the run's portfolio revaluation. Rounds each instrument to cents before summing and never touches program, counterparty or collateral ledgers."
    roles: [HedgeAccountant]
    code: 200
    input: []
    output: MarkToMarketRun
    side_effects:
      - "runs calculations.mtm_report_totals and writes instrument_count, total_mtm_usd, designated_mtm_usd and undesignated_mtm_usd"
      - "writes mtm_value_usd on every in-scope HedgeInstrument and increments each of their versions by 1"
      - "sets status = COMPUTED and computed_at = logical clock now"
      - "increments MarkToMarketRun.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_MTM_RUN_NOT_FOUND, ERR_MTM_RUN_INVALID_STATE]

  - method: POST
    path: "/fuel/mark-to-market-runs/{id}/publish"
    description: "Publish a computed run. This is the ops-run checkpoint that revalues margin, raises margin calls, refreshes counterparty postures, reclassifies program earnings volatility and auto-settles matured trades."
    roles: [RiskPolicyAdmin]
    code: 200
    input: []
    output: MarkToMarketRun
    side_effects:
      - "sets status = PUBLISHED and published_at = logical clock now"
      - "runs the four-part publication cascade of §1.2 (margin revaluation, margin-call creation, counterparty posture refresh, program reclassification with SYSTEM_BREACH exception creation) and then auto-settles matured trades"
      - "writes margin_calls_created and settled_instrument_count"
      - "increments MarkToMarketRun.version and the version of every touched HedgeInstrument, HedgeProgram, Counterparty, HedgePolicy and CollateralPosting by 1 each"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_MTM_RUN_NOT_FOUND, ERR_MTM_RUN_INVALID_STATE]

  # ------------------------------------------------------------------ FlightLeg
  - method: POST
    path: "/fuel/flight-legs"
    description: "Create a flight leg with its weight and performance envelope, from which the tankering uplift cap is derived."
    roles: [FuelOpsController, FuelAnalyst]
    code: 201
    input: [flight_number, departure_date, origin_station_id, destination_station_id, fleet_type, planned_block_minutes, planned_burn_gallons, tank_capacity_gallons, payload_lbs, max_takeoff_payload_lbs, landing_weight_lbs, max_landing_weight_lbs]
    output: FlightLeg
    side_effects:
      - "creates the FlightLeg with actual_block_minutes and actual_uplift_gallons null"
      - "runs calculations.tankering_uplift_cap_gallons and writes uplift_cap_gallons"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_STATION_NOT_FOUND, ERR_DUPLICATE_FLIGHT_LEG]

  - method: GET
    path: "/fuel/flight-legs/{id}"
    description: "Read one flight leg including its recomputed uplift_cap_gallons."
    roles: [RiskPolicyAdmin, FuelAnalyst, FuelOpsController, StationCoordinator]
    code: 200
    input: []
    output: FlightLeg
    side_effects:
      - "recomputes uplift_cap_gallons per calculations.tankering_uplift_cap_gallons without incrementing version"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_FLIGHT_LEG_NOT_FOUND]

  - method: GET
    path: "/fuel/flight-legs"
    description: "List flight legs, ordered by departure_date ASC then created_at ASC."
    roles: [RiskPolicyAdmin, FuelAnalyst, FuelOpsController, StationCoordinator]
    code: 200
    input: ["origin_station_id?", "destination_station_id?", "departure_date?", "fleet_type?", "limit?", "offset?"]
    output: FlightLeg[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: POST
    path: "/fuel/flight-legs/{id}/tankering-directives"
    description: "Propose a tankering directive on this leg, priced against the live supply contracts. Supersedes any prior PROPOSED or NEEDS_REVISION directive on the leg. OCC-guarded on the leg per §1.2.1 rule directive-create-stale-flight-leg."
    roles: [FuelAnalyst]
    code: 201
    input: [requested_uplift_gallons, expected_flight_leg_version]
    output: TankeringDirective
    side_effects:
      - "creates the TankeringDirective with flight_leg_id from the path, status PROPOSED, revision_count 0, proposed_by_user_id = X-User-ID and all pinned and reconciled fields null"
      - "runs calculations.tankering_burn_penalty_gallons and calculations.tankering_net_savings_usd on the planned_basis variant and writes planned_burn_penalty_gallons, planned_gross_savings_usd, planned_penalty_cost_usd and planned_net_savings_usd"
      - "transitions any prior TankeringDirective on this leg with status in {PROPOSED, NEEDS_REVISION} to SUPERSEDED and increments its version by 1"
      - "increments FlightLeg.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_FLIGHT_LEG_NOT_FOUND, ERR_STALE_VERSION, ERR_ZERO_UPLIFT, ERR_NO_ACTIVE_SUPPLY_CONTRACT]

  - method: GET
    path: "/fuel/flight-legs/{id}/tankering-directives"
    description: "List this leg's tankering directives, ordered by created_at ASC."
    roles: [RiskPolicyAdmin, FuelAnalyst, FuelOpsController, StationCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TankeringDirective[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_FLIGHT_LEG_NOT_FOUND]

  # ---------------------------------------------------------- TankeringDirective
  - method: GET
    path: "/fuel/tankering-directives/{id}"
    description: "Read one tankering directive with its planned economics, pinned approval prices and reconciled outcome."
    roles: [RiskPolicyAdmin, FuelAnalyst, FuelOpsController, StationCoordinator]
    code: 200
    input: []
    output: TankeringDirective
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_DIRECTIVE_NOT_FOUND]

  - method: POST
    path: "/fuel/tankering-directives/{id}/approve"
    description: "Approve a proposed directive. Weight and performance limits are checked before supply, inventory and economics, and the two station prices are pinned onto the directive."
    roles: [FuelOpsController]
    code: 200
    input: []
    output: TankeringDirective
    side_effects:
      - "sets status = APPROVED and approved_by_user_id = X-User-ID"
      - "pins pinned_origin_price_usd_per_gal, pinned_destination_price_usd_per_gal and pinned_origin_contract_ref from the two ACTIVE SupplyContract rows"
      - "increments TankeringDirective.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_DIRECTIVE_NOT_FOUND, ERR_DIRECTIVE_INVALID_STATE, ERR_TANKERING_WEIGHT_LIMIT, ERR_NO_ACTIVE_SUPPLY_CONTRACT, ERR_STATION_INVENTORY_SHORT, ERR_TANKERING_NOT_ECONOMIC]

  - method: POST
    path: "/fuel/tankering-directives/{id}/reject"
    description: "Reject a proposed directive outright."
    roles: [FuelOpsController]
    code: 200
    input: [reject_reason]
    output: TankeringDirective
    side_effects:
      - "sets status = REJECTED with no price pinning and no inventory movement"
      - "increments TankeringDirective.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_DIRECTIVE_NOT_FOUND, ERR_DIRECTIVE_INVALID_STATE]

  - method: POST
    path: "/fuel/tankering-directives/{id}/request-revision"
    description: "Send a proposed directive back to the analyst for a revised uplift."
    roles: [FuelOpsController]
    code: 200
    input: [revision_note]
    output: TankeringDirective
    side_effects:
      - "sets status = NEEDS_REVISION"
      - "increments TankeringDirective.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_DIRECTIVE_NOT_FOUND, ERR_DIRECTIVE_INVALID_STATE]

  - method: POST
    path: "/fuel/tankering-directives/{id}/revise"
    description: "Revise the requested uplift on a directive in NEEDS_REVISION and re-price it against the live supply contracts, returning it to PROPOSED."
    roles: [FuelAnalyst]
    code: 200
    input: [requested_uplift_gallons]
    output: TankeringDirective
    side_effects:
      - "overwrites requested_uplift_gallons and re-runs the planned_basis variants of calculations.tankering_burn_penalty_gallons and calculations.tankering_net_savings_usd"
      - "sets status = PROPOSED and increments revision_count by 1"
      - "increments TankeringDirective.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_DIRECTIVE_NOT_FOUND, ERR_DIRECTIVE_INVALID_STATE, ERR_ZERO_UPLIFT, ERR_NO_ACTIVE_SUPPLY_CONTRACT]

  - method: POST
    path: "/fuel/tankering-directives/{id}/execute"
    description: "Record the uplift as loaded, provisionally debiting the requested gallons from the origin station."
    roles: [FuelOpsController]
    code: 200
    input: []
    output: TankeringDirective
    side_effects:
      - "sets status = EXECUTED"
      - "subtracts requested_uplift_gallons from the origin Station.inventory_gallons and recomputes effective_inventory_gallons, days_cover and supply_posture"
      - "increments TankeringDirective.version and Station.version by 1 each"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_DIRECTIVE_NOT_FOUND, ERR_DIRECTIVE_INVALID_STATE, ERR_STATION_INVENTORY_SHORT]

  - method: POST
    path: "/fuel/tankering-directives/{id}/reconcile"
    description: "Reconcile the directive against flown data, re-pricing at the pinned approval prices and truing up the origin station's gallon ledger to the actual uplift."
    roles: [FuelOpsController]
    code: 200
    input: [actual_uplift_gallons, actual_block_minutes]
    output: TankeringDirective
    side_effects:
      - "writes FlightLeg.actual_uplift_gallons and FlightLeg.actual_block_minutes and increments FlightLeg.version by 1"
      - "runs the reconciled_basis variants and writes reconciled_burn_penalty_gallons, reconciled_net_savings_usd and savings_variance_usd"
      - "adjusts the origin Station.inventory_gallons by (requested_uplift_gallons - actual_uplift_gallons) and recomputes effective_inventory_gallons, days_cover and supply_posture"
      - "sets status = RECONCILED"
      - "increments TankeringDirective.version and Station.version by 1 each"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_DIRECTIVE_NOT_FOUND, ERR_DIRECTIVE_INVALID_STATE, ERR_ZERO_UPLIFT, ERR_TANKERING_WEIGHT_LIMIT]

  # -------------------------------------------------------------- PolicyException
  - method: POST
    path: "/fuel/policy-exceptions"
    description: "Request a policy exception waiving a coverage, concentration, earnings-volatility, tankering-economics or inventory limit."
    roles: [FuelAnalyst, TreasuryRiskManager, HedgeAccountant, FuelOpsController]
    code: 201
    input: [reason_code, justification, "hedge_program_id?", "hedge_instrument_id?", "tankering_directive_id?", "requested_limit_value?"]
    output: PolicyException
    side_effects:
      - "creates the PolicyException with status REQUESTED, origin MANUAL and requested_by_user_id = X-User-ID"
      - "increments HedgePolicy.open_exception_count by 1 for the policy governing hedge_program_id when hedge_program_id is not null, and increments HedgePolicy.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_PROGRAM_NOT_FOUND, ERR_INSTRUMENT_NOT_FOUND, ERR_DIRECTIVE_NOT_FOUND]

  - method: GET
    path: "/fuel/policy-exceptions/{id}"
    description: "Read one policy exception with its decision fields."
    roles: [RiskPolicyAdmin, FuelAnalyst, TreasuryRiskManager, HedgeAccountant, FuelOpsController]
    code: 200
    input: []
    output: PolicyException
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_EXCEPTION_NOT_FOUND]

  - method: GET
    path: "/fuel/policy-exceptions"
    description: "List policy exceptions, including SYSTEM_BREACH rows raised by cascades, ordered by created_at ASC."
    roles: [RiskPolicyAdmin, FuelAnalyst, TreasuryRiskManager, HedgeAccountant, FuelOpsController]
    code: 200
    input: ["hedge_program_id?", "hedge_instrument_id?", "tankering_directive_id?", "status?", "reason_code?", "origin?", "limit?", "offset?"]
    output: PolicyException[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: POST
    path: "/fuel/policy-exceptions/{id}/approve"
    description: "Approve a requested exception. The requester may not approve their own request."
    roles: [RiskPolicyAdmin]
    code: 200
    input: [decision_note]
    output: PolicyException
    side_effects:
      - "sets status = APPROVED, decided_by_user_id = X-User-ID and decided_at = logical clock now"
      - "decrements HedgePolicy.open_exception_count by 1 when hedge_program_id is not null and increments HedgePolicy.version by 1"
      - "increments PolicyException.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_EXCEPTION_NOT_FOUND, ERR_EXCEPTION_INVALID_STATE, ERR_SEGREGATION_OF_DUTIES]

  - method: POST
    path: "/fuel/policy-exceptions/{id}/deny"
    description: "Deny a requested exception. The requester may not deny their own request."
    roles: [RiskPolicyAdmin]
    code: 200
    input: [decision_note]
    output: PolicyException
    side_effects:
      - "sets status = DENIED, decided_by_user_id = X-User-ID and decided_at = logical clock now"
      - "decrements HedgePolicy.open_exception_count by 1 when hedge_program_id is not null and increments HedgePolicy.version by 1"
      - "increments PolicyException.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_EXCEPTION_NOT_FOUND, ERR_EXCEPTION_INVALID_STATE, ERR_SEGREGATION_OF_DUTIES]

  # ------------------------------------------------------ test-driving endpoint
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which drives SupplyContract.status derivation and every *_at stamp. The server starts at the fixed default 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time before this endpoint is called."
    roles: [RiskPolicyAdmin, FuelAnalyst, TreasuryRiskManager, HedgeAccountant, FuelOpsController, StationCoordinator]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects:
      - "sets the logical clock to current_utc; no entity is mutated and no version is incremented"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- authentication / authorization
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the caller's role is not listed in the endpoint's roles"
  - id: ERR_STATION_NOT_OWNED
    http: 403
    condition: "a StationCoordinator posts an inventory adjustment for a station whose id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the caller activates a program they submitted, or decides a policy exception they requested"
  # ---- request shape
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, unknown enum member, out-of-range number, strike fields inconsistent with instrument_type, or a missing expected_*_version on an OCC-guarded write"
  # ---- existence
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "no HedgePolicy with the given id"
  - id: ERR_COUNTERPARTY_NOT_FOUND
    http: 404
    condition: "no Counterparty with the given id"
  - id: ERR_STATION_NOT_FOUND
    http: 404
    condition: "no Station with the given id, in the path or in origin_station_id / destination_station_id"
  - id: ERR_FORECAST_NOT_FOUND
    http: 404
    condition: "no ConsumptionForecast with the given id"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "no HedgeProgram with the given id, in the path or in policy_id-scoped bodies"
  - id: ERR_INSTRUMENT_NOT_FOUND
    http: 404
    condition: "no HedgeInstrument with the given id"
  - id: ERR_COLLATERAL_POSTING_NOT_FOUND
    http: 404
    condition: "no CollateralPosting with the given id"
  - id: ERR_MTM_RUN_NOT_FOUND
    http: 404
    condition: "no MarkToMarketRun with the given id"
  - id: ERR_FLIGHT_LEG_NOT_FOUND
    http: 404
    condition: "no FlightLeg with the given id"
  - id: ERR_DIRECTIVE_NOT_FOUND
    http: 404
    condition: "no TankeringDirective with the given id"
  - id: ERR_EXCEPTION_NOT_FOUND
    http: 404
    condition: "no PolicyException with the given id"
  # ---- state
  - id: ERR_FORECAST_INVALID_STATE
    http: 409
    condition: "publishing a ConsumptionForecast that is already PUBLISHED"
  - id: ERR_PROGRAM_INVALID_STATE
    http: 409
    condition: "a HedgeProgram transition invoked from a state that does not declare it in §1.2, or an instrument proposed against a program that is DRAFT or CLOSED"
  - id: ERR_PROGRAM_NOT_ACTIVE
    http: 409
    condition: "executing or designating an instrument whose HedgeProgram.status is not ACTIVE"
  - id: ERR_INSTRUMENT_INVALID_TRADE_STATE
    http: 409
    condition: "a trade_status transition invoked from a state that does not declare it, designating a trade that is not EXECUTED, running an effectiveness test on a trade that is not EXECUTED, or posting collateral against a trade that is not EXECUTED"
  - id: ERR_INSTRUMENT_INVALID_ACCOUNTING_STATE
    http: 409
    condition: "designating an instrument whose accounting_status is already DESIGNATED"
  - id: ERR_POSTING_INVALID_STATE
    http: 409
    condition: "posting a CollateralPosting that is not REQUIRED, returning one that is not POSTED, or returning collateral while the trade is still EXECUTED and fully margined"
  - id: ERR_MTM_RUN_INVALID_STATE
    http: 409
    condition: "computing a PUBLISHED run, or publishing a run that is OPEN or already PUBLISHED"
  - id: ERR_DIRECTIVE_INVALID_STATE
    http: 409
    condition: "a TankeringDirective transition invoked from a state that does not declare it, including any action on a SUPERSEDED, REJECTED or RECONCILED directive"
  - id: ERR_EXCEPTION_INVALID_STATE
    http: 409
    condition: "approving or denying a PolicyException that is no longer REQUESTED"
  - id: ERR_PROGRAM_HAS_OPEN_INSTRUMENTS
    http: 409
    condition: "closing a HedgeProgram whose open_instrument_count is greater than 0"
  # ---- optimistic concurrency
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_hedge_program_version, expected_counterparty_version or expected_flight_leg_version does not equal the parent's current version"
  # ---- temporal
  - id: ERR_FORECAST_PERIOD_OVERLAP
    http: 409
    condition: "publishing a forecast whose half-open [period_start_month, period_end_month) intersects another PUBLISHED forecast with the same fleet_type and route_group"
  - id: ERR_CONTRACT_TERM_OVERLAP
    http: 409
    condition: "a SupplyContract whose closed [term_start_date, term_end_date] intersects an existing contract on the same station"
  - id: ERR_CONTRACT_BUFFER_VIOLATION
    http: 409
    condition: "a non-overlapping SupplyContract separated from its neighbour on the same station by fewer than 7 clear changeover days"
  # ---- referential
  - id: ERR_NO_ACTIVE_SUPPLY_CONTRACT
    http: 409
    condition: "pricing or approving a tankering directive when the origin or destination station does not have exactly one SupplyContract with status ACTIVE"
  - id: ERR_COUNTERPARTY_NOT_APPROVED
    http: 409
    condition: "executing a trade whose Counterparty.status is SUSPENDED"
  - id: ERR_INSTRUMENT_TYPE_NOT_PERMITTED
    http: 422
    condition: "proposing an instrument_type absent from the governing HedgePolicy.permitted_instrument_types"
  # ---- uniqueness
  - id: ERR_DUPLICATE_POLICY_CODE
    http: 409
    condition: "policy_code already used by another HedgePolicy"
  - id: ERR_DUPLICATE_COUNTERPARTY_CODE
    http: 409
    condition: "counterparty_code already used by another Counterparty"
  - id: ERR_DUPLICATE_STATION_CODE
    http: 409
    condition: "iata_code already used by another Station"
  - id: ERR_DUPLICATE_PROGRAM_CODE
    http: 409
    condition: "program_code already used by another HedgeProgram"
  - id: ERR_DUPLICATE_CONTRACT_REF
    http: 409
    condition: "contract_ref already used by another SupplyContract on the same station"
  - id: ERR_DUPLICATE_MTM_PERIOD
    http: 409
    condition: "a MarkToMarketRun already exists for the given period_month"
  - id: ERR_DUPLICATE_FLIGHT_LEG
    http: 409
    condition: "a FlightLeg already exists with the same flight_number and departure_date"
  # ---- safety and fiscal
  - id: ERR_TANKERING_WEIGHT_LIMIT
    http: 422
    condition: "requested or actual uplift exceeds FlightLeg.uplift_cap_gallons, the binding constraint being tank headroom, landing-weight headroom or the policy uplift ceiling"
  - id: ERR_ZERO_UPLIFT
    http: 422
    condition: "requested_uplift_gallons or actual_uplift_gallons is not strictly positive"
  - id: ERR_COVERAGE_FLOOR_NOT_MET
    http: 422
    condition: "activating a program whose planned_coverage_pct_delta is below HedgePolicy.min_coverage_pct"
  - id: ERR_COVERAGE_LIMIT_EXCEEDED
    http: 422
    condition: "executing a trade that would push the unrounded delta-adjusted coverage above HedgePolicy.max_coverage_pct"
  - id: ERR_COUNTERPARTY_CREDIT_EXCEEDED
    http: 422
    condition: "executing a trade whose margin_requirement_usd would push Counterparty.utilized_credit_usd above credit_limit_usd"
  - id: ERR_COLLATERAL_SHORTFALL
    http: 422
    condition: "posting an amount_usd below the posting's frozen required_amount_usd"
  - id: ERR_EXCEPTION_REQUIRED
    http: 422
    condition: "a limit breach that policy tolerates only under an APPROVED PolicyException — single-counterparty concentration on execution, or re-designation of a DEDESIGNATED trade"
  - id: ERR_TANKERING_NOT_ECONOMIC
    http: 422
    condition: "approving a directive whose planned_net_savings_usd is not strictly positive without an APPROVED TANKERING_UNECONOMIC exception"
  - id: ERR_STATION_INVENTORY_SHORT
    http: 422
    condition: "approving a directive whose origin station supply_posture is SHORT, or executing one when origin inventory_gallons is below the requested uplift"
  - id: ERR_NO_FORECAST_BASIS
    http: 422
    condition: "sizing a program when no PUBLISHED ConsumptionForecast matches its fleet, route-group and month window"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RiskPolicyAdmin
    description: "Owns reference data and the collateral/exception control surface: policies, counterparties, stations, supply contracts, collateral movements, mark-to-market publication and exception decisions."
    identity: opaque
    exclusive_operations:
      - "POST /fuel/hedge-policies"
      - "POST /fuel/counterparties"
      - "POST /fuel/stations"
      - "POST /fuel/stations/{id}/supply-contracts"
      - "POST /fuel/counterparties/{id}/collateral-postings"
      - "POST /fuel/collateral-postings/{id}/post"
      - "POST /fuel/collateral-postings/{id}/return"
      - "POST /fuel/mark-to-market-runs/{id}/publish"
      - "POST /fuel/policy-exceptions/{id}/approve"
      - "POST /fuel/policy-exceptions/{id}/deny"
    shared_operations:
      - "POST /fuel/counterparties/{id}/credit-review (with TreasuryRiskManager)"
      - "all GET reads"
      - "POST /_clock/set_current_utc"

  - name: FuelAnalyst
    description: "Builds the hedge book from the demand side: consumption forecasts, program sizing and submission, instrument proposals, tankering proposals and revisions."
    identity: opaque
    exclusive_operations:
      - "POST /fuel/consumption-forecasts"
      - "POST /fuel/consumption-forecasts/{id}/publish"
      - "POST /fuel/hedge-programs"
      - "POST /fuel/hedge-programs/{id}/size"
      - "POST /fuel/hedge-programs/{id}/submit"
      - "POST /fuel/hedge-programs/{id}/instruments"
      - "POST /fuel/flight-legs/{id}/tankering-directives"
      - "POST /fuel/tankering-directives/{id}/revise"
    shared_operations:
      - "POST /fuel/flight-legs (with FuelOpsController)"
      - "POST /fuel/policy-exceptions (with TreasuryRiskManager, HedgeAccountant, FuelOpsController)"
      - "hedging and tankering GET reads"
      - "POST /_clock/set_current_utc"

  - name: TreasuryRiskManager
    description: "Approves and executes the hedge book: program return, activation and closure, trade execution and termination, counterparty credit reviews. Cannot propose the programs or instruments it approves."
    identity: opaque
    exclusive_operations:
      - "POST /fuel/hedge-programs/{id}/return"
      - "POST /fuel/hedge-programs/{id}/activate"
      - "POST /fuel/hedge-programs/{id}/close"
      - "POST /fuel/hedge-instruments/{id}/execute"
      - "POST /fuel/hedge-instruments/{id}/terminate"
    shared_operations:
      - "POST /fuel/counterparties/{id}/credit-review (with RiskPolicyAdmin)"
      - "POST /fuel/policy-exceptions (with FuelAnalyst, HedgeAccountant, FuelOpsController)"
      - "hedging GET reads"
      - "POST /_clock/set_current_utc"

  - name: HedgeAccountant
    description: "Owns hedge accounting: designation, effectiveness testing, and opening and computing monthly mark-to-market runs. Cannot publish a run, which is the ledger-mutating checkpoint."
    identity: opaque
    exclusive_operations:
      - "POST /fuel/hedge-instruments/{id}/designate"
      - "POST /fuel/hedge-instruments/{id}/effectiveness-tests"
      - "POST /fuel/mark-to-market-runs"
      - "POST /fuel/mark-to-market-runs/{id}/compute"
    shared_operations:
      - "POST /fuel/policy-exceptions (with FuelAnalyst, TreasuryRiskManager, FuelOpsController)"
      - "hedging and reporting GET reads"
      - "POST /_clock/set_current_utc"

  - name: FuelOpsController
    description: "Owns tankering execution on the operational side: directive approval, rejection, revision requests, loading and reconciliation, plus flight-leg setup and network-wide inventory adjustments."
    identity: opaque
    exclusive_operations:
      - "POST /fuel/tankering-directives/{id}/approve"
      - "POST /fuel/tankering-directives/{id}/reject"
      - "POST /fuel/tankering-directives/{id}/request-revision"
      - "POST /fuel/tankering-directives/{id}/execute"
      - "POST /fuel/tankering-directives/{id}/reconcile"
    shared_operations:
      - "POST /fuel/flight-legs (with FuelAnalyst)"
      - "POST /fuel/stations/{id}/inventory-adjustments (with StationCoordinator, but without the ownership restriction)"
      - "POST /fuel/policy-exceptions (with FuelAnalyst, TreasuryRiskManager, HedgeAccountant)"
      - "tankering and station GET reads"
      - "POST /_clock/set_current_utc"

  - name: StationCoordinator
    description: "A station's local fuel coordinator. X-User-ID is the Station.id the coordinator works at; it may adjust inventory only for that station and otherwise has read-only visibility of stations, contracts and tankering."
    identity: "entity_backed:Station"
    exclusive_operations: []
    shared_operations:
      - "POST /fuel/stations/{id}/inventory-adjustments (with FuelOpsController; restricted to X-User-ID == Station.id, otherwise ERR_STATION_NOT_OWNED)"
      - "GET /fuel/stations/{id}, GET /fuel/stations/{id}/supply-contracts, GET /fuel/hedge-policies/{id}"
      - "GET /fuel/flight-legs, GET /fuel/flight-legs/{id}, GET /fuel/flight-legs/{id}/tankering-directives, GET /fuel/tankering-directives/{id}"
      - "POST /_clock/set_current_utc"
