              as: PharmacyInformaticist
              as_user_id: "${pharm_id}"
              captures: { vra_id: $.data.id }
            - call: "POST /cds/vendor-releases/${vra_id}/deltas"
              payload: { rule_code: "DDI-A1", change_type: "SEVERITY_INCREASED", description: "Warfarin plus fluconazole raised", new_severity: "CONTRAINDICATED", prior_severity: "MAJOR" }
              as: PharmacyInformaticist
