        distinguishing_aspect: "The VEHICLE category requires three fields at once and the check is not satisfied piecemeal: supplying vin alone, then vin plus odometer_reading, both still answer 422, and only the full triple is accepted. A FURNITURE asset with none of the three is accepted in the same turn-in, proving the requirement is conditional on category rather than universal."
