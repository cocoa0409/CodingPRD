            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-07-13", target_market_date: "2026-08-24", head_placed: 500, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v2}" }, as: FieldTech, captures: { group_b: $.data.id } }
