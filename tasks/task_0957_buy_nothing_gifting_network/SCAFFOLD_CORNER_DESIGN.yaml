  # ===========================================================================
  - section: rbac
    instances:
      - name: member_cannot_approve_membership
        claim_type: rbac_denial
        grounds: ["roles[Member]", "roles[GroupModerator]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A plain Member (no MODERATOR membership) calling the approve endpoint is rejected with ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["APPROVAL_REQUIRED group; M1 REQUESTED membership; M2 a registered member"]
          setup_api_calls:
            - call: "POST /v1/members"
              payload: { email: "ra1@x.com", display_name: "M1" }
              as: Anonymous
              captures: { m1_id: $.data.id }
            - call: "POST /v1/members"
              payload: { email: "ra2@x.com", display_name: "M2" }
              as: Anonymous
              captures: { m2_id: $.data.id }
            - call: "POST /v1/groups"
              payload: { name: "RBAC Group", zip_code: "98234", join_policy: "APPROVAL_REQUIRED", capacity: 150 }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { ms1: $.data.id }
          trigger:
            - call: "POST /v1/memberships/${ms1}/approve"
              as: Member
              as_user_id: "${m2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED, http 403"
            - "GroupMembership.${ms1}.status remains REQUESTED"

      - name: member_cannot_set_clock
        claim_type: rbac_denial
        grounds: ["roles[PlatformAdmin]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "The logical-clock test-driving endpoint is PlatformAdmin-only; a Member role is rejected with ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["registered member M"]
          setup_api_calls:
            - call: "POST /v1/members"
              payload: { email: "clk@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED, http 403"
            - "logical clock unchanged (still default 2026-05-01T00:00:00Z)"

      - name: groupmoderator_can_approve_membership
        claim_type: rbac_allow
        grounds: ["roles[GroupModerator]"]
        distinguishing_aspect: "A member holding an APPROVED MODERATOR membership in the group can approve another membership as GroupModerator."
        test_recipe:
          setup: ["APPROVAL_REQUIRED group; MOD's membership approved by PlatformAdmin with role MODERATOR; M2 REQUESTED"]
          setup_api_calls:
            - call: "POST /v1/members"
              payload: { email: "mod@x.com", display_name: "Mod" }
              as: Anonymous
              captures: { mod_id: $.data.id }
            - call: "POST /v1/members"
              payload: { email: "jm2@x.com", display_name: "M2" }
              as: Anonymous
              captures: { m2_id: $.data.id }
            - call: "POST /v1/groups"
              payload: { name: "Mod Group", zip_code: "98235", join_policy: "APPROVAL_REQUIRED", capacity: 150 }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${mod_id}"
              captures: { ms_mod: $.data.id }
            - call: "POST /v1/memberships/${ms_mod}/approve"
              payload: { role: "MODERATOR" }
              as: PlatformAdmin
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { ms2: $.data.id }
          trigger:
            - call: "POST /v1/memberships/${ms2}/approve"
              as: GroupModerator
              as_user_id: "${mod_id}"
              captures: { ms2_status: $.data.status }
          assert:
            - "GroupMembership.${ms2}.status == APPROVED (moderator-authorized approve succeeds)"
            - "Group.${g_id}.member_count == 2"

      - name: non_owner_cannot_withdraw_post
        claim_type: rbac_denial
        grounds: ["roles[Member]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "A member of the group who is not the giver cannot withdraw the post: ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["clock set; group with giver G and member M2; G's post OPEN"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "nog@x.com", display_name: "G" }
              as: Anonymous
              captures: { g_m_id: $.data.id }
            - call: "POST /v1/members"
              payload: { email: "nom@x.com", display_name: "M2" }
              as: Anonymous
              captures: { m2_id: $.data.id }
            - call: "POST /v1/groups"
              payload: { name: "Owner Group", zip_code: "98236", join_policy: "OPEN", capacity: 150 }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${g_m_id}"
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${m2_id}"
            - call: "POST /v1/gift-posts"
              payload: { group_id: "${g_id}", title: "Shelf", category: "FURNITURE", claim_mode: "FIRST_COME", expires_at: "2026-06-10T00:00:00Z" }
              as: Member
              as_user_id: "${g_m_id}"
              captures: { p_id: $.data.id }
            - call: "POST /v1/gift-posts/${p_id}/publish"
              as: Member
              as_user_id: "${g_m_id}"
          trigger:
            - call: "POST /v1/gift-posts/${p_id}/withdraw"
              as: Member
              as_user_id: "${m2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_RESOURCE_OWNER, http 403"
            - "GiftPost.${p_id}.status remains OPEN"

      - name: overturn_strike_reinstates_suspended_member
        claim_type: rbac_allow
        grounds: ["roles[PlatformAdmin]", "state_machines.ModerationAction.ACTIVE_to_OVERTURNED", "state_machines.Member.SUSPENDED_to_ACTIVE"]
        distinguishing_aspect: "PlatformAdmin overturn of the only strike (severity 3) drops active points 3 -> 0 and compensates the suspension: member returns to ACTIVE with suspension_ends_at cleared."
        test_recipe:
          setup: ["clock 2026-05-10T09:00:00Z; group with T and R; T suspended by one severity-3 strike"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "ovt@x.com", display_name: "T" }
              as: Anonymous
              captures: { t_id: $.data.id }
            - call: "POST /v1/members"
              payload: { email: "ovr@x.com", display_name: "R" }
              as: Anonymous
              captures: { r_id: $.data.id }
            - call: "POST /v1/groups"
              payload: { name: "Reinstate Group", zip_code: "98237", join_policy: "OPEN", capacity: 150 }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${t_id}"
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${r_id}"
            - call: "POST /v1/reports"
              payload: { group_id: "${g_id}", target_type: "MEMBER", target_id: "${t_id}", category: "SAFETY" }
              as: Member
              as_user_id: "${r_id}"
              captures: { rp: $.data.id }
            - call: "POST /v1/reports/${rp}/start-review"
              as: PlatformAdmin
            - call: "POST /v1/reports/${rp}/resolve"
              payload: { resolution: "ACTION", action_type: "STRIKE", severity_points: 3 }
              as: PlatformAdmin
            - call: "GET /v1/moderation-actions?member_id=${t_id}&status=ACTIVE"
              as: PlatformAdmin
              captures: { act: "$.data[0].id" }
          trigger:
            - call: "POST /v1/moderation-actions/${act}/overturn"
              as: PlatformAdmin
            - call: "GET /v1/members/${t_id}"
              as: Member
              as_user_id: "${t_id}"
          assert:
            - "pre-trigger: Member.${t_id}.status was SUSPENDED with suspension_ends_at == '2026-05-24T09:00:00Z'"
            - "after overturn: ModerationAction.${act}.status == OVERTURNED"
            - "after overturn: Member.${t_id}.status == ACTIVE and active_strike_points == 0 and suspension_ends_at == null"

  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: occ_gift_post_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[gift-post-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two sequential edits against the same observed version: the first succeeds (version 1 -> 2), the second carrying the stale version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["clock set; group with giver G; DRAFT post P at version 1"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "ocg@x.com", display_name: "G" }
              as: Anonymous
              captures: { g_m_id: $.data.id }
            - call: "POST /v1/groups"
              payload: { name: "OCC Group", zip_code: "98238", join_policy: "OPEN", capacity: 150 }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${g_m_id}"
            - call: "POST /v1/gift-posts"
              payload: { group_id: "${g_id}", title: "Old title", category: "OTHER", claim_mode: "FIRST_COME", expires_at: "2026-06-10T00:00:00Z" }
              as: Member
              as_user_id: "${g_m_id}"
              captures: { p_id: $.data.id, p_v: $.data.version }
          trigger:
            - call: "PUT /v1/gift-posts/${p_id}"
              payload: { title: "New title", expected_gift_post_version: "${p_v}" }
              as: Member
              as_user_id: "${g_m_id}"
            - call: "PUT /v1/gift-posts/${p_id}"
              payload: { title: "Third title", expected_gift_post_version: "${p_v}" }
              as: Member
              as_user_id: "${g_m_id}"
              captures: { err: $.data.error_id }
            - call: "GET /v1/gift-posts/${p_id}"
              as: Member
              as_user_id: "${g_m_id}"
          assert:
            - "first PUT succeeds: version 1 -> 2, title == 'New title'"
            - "second PUT with the stale captured version rejected: error_id == ERR_STALE_VERSION, http 412"
            - "GiftPost.${p_id}.version == 2 and title == 'New title' (loser's write not applied)"

      - name: occ_group_policy_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[group-policy-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Same OCC pattern on the second parent entity: a group policy update carrying a stale expected_group_version is rejected 412 after a successful update advanced the version."
        test_recipe:
          setup: ["group G at version 1 (created by PlatformAdmin)"]
          setup_api_calls:
            - call: "POST /v1/groups"
              payload: { name: "Policy Group", zip_code: "98239", join_policy: "OPEN", capacity: 150 }
              as: PlatformAdmin
              captures: { g_id: $.data.id, g_v: $.data.version }
          trigger:
            - call: "PUT /v1/groups/${g_id}"
              payload: { join_policy: "APPROVAL_REQUIRED", expected_group_version: "${g_v}" }
              as: PlatformAdmin
            - call: "PUT /v1/groups/${g_id}"
              payload: { capacity: 200, expected_group_version: "${g_v}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "GET /v1/groups/${g_id}"
              as: PlatformAdmin
          assert:
            - "first PUT succeeds: version 1 -> 2, join_policy == APPROVAL_REQUIRED"
            - "second PUT with stale version rejected: error_id == ERR_STALE_VERSION, http 412"
            - "Group.${g_id}.capacity == 150 (loser's write not applied)"

      - name: selector_giver_pick_explicit_offer
        claim_type: selector_policy
        grounds: ["calculations.calc_claim_queue_rank", "state_machines.Claim.QUEUED_to_OFFERED"]
        distinguishing_aspect: "Under GIVER_PICK there is no automatic head promotion: both claims stay QUEUED until the giver explicitly offers, and the giver may select the SECOND claim rather than the chronological first."
        test_recipe:
          setup: ["clock set; group with G, C1, C2; GIVER_PICK post OPEN; C1 and C2 both claimed (both QUEUED)"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "gpg@x.com", display_name: "G" }
              as: Anonymous
              captures: { g_m_id: $.data.id }
            - call: "POST /v1/members"
              payload: { email: "gpc1@x.com", display_name: "C1" }
              as: Anonymous
              captures: { c1_id: $.data.id }
            - call: "POST /v1/members"
              payload: { email: "gpc2@x.com", display_name: "C2" }
              as: Anonymous
              captures: { c2_id: $.data.id }
            - call: "POST /v1/groups"
              payload: { name: "Pick Group", zip_code: "98240", join_policy: "OPEN", capacity: 150 }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${g_m_id}"
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${c1_id}"
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${c2_id}"
            - call: "POST /v1/gift-posts"
              payload: { group_id: "${g_id}", title: "Piano", category: "OTHER", claim_mode: "GIVER_PICK", expires_at: "2026-06-10T00:00:00Z" }
              as: Member
              as_user_id: "${g_m_id}"
              captures: { p_id: $.data.id }
            - call: "POST /v1/gift-posts/${p_id}/publish"
              as: Member
              as_user_id: "${g_m_id}"
            - call: "POST /v1/claims"
              payload: { post_id: "${p_id}" }
              as: Member
              as_user_id: "${c1_id}"
              captures: { cl1: $.data.id, cl1_status: $.data.status }
            - call: "POST /v1/claims"
              payload: { post_id: "${p_id}" }
              as: Member
              as_user_id: "${c2_id}"
              captures: { cl2: $.data.id }
          trigger:
            - call: "POST /v1/gift-posts/${p_id}/offer"
              payload: { claim_id: "${cl2}" }
              as: Member
              as_user_id: "${g_m_id}"
              captures: { off_status: $.data.status }
            - call: "GET /v1/claims/${cl1}"
              as: Member
              as_user_id: "${c1_id}"
            - call: "GET /v1/gift-posts/${p_id}"
              as: Member
              as_user_id: "${g_m_id}"
          assert:
            - "at creation under GIVER_PICK: Claim.${cl1}.status == QUEUED (no auto-promotion despite vacant head slot)"
            - "offer selects C2 (not the chronological first): response status == OFFERED with offer_expires_at == '2026-05-11T09:00:00Z'"
            - "Claim.${cl1}.status remains QUEUED"
            - "GiftPost.${p_id}.status == RESERVED and current_claim_id == ${cl2}"

      - name: offer_to_foreign_claim_rejected
        claim_type: selector_policy
        grounds: ["validations[priority=8]", "errors[ERR_CLAIM_NOT_QUEUED]"]
        distinguishing_aspect: "The giver-offer selector rejects a claim that is not a QUEUED claim of this post (here: a QUEUED claim belonging to a different post): ERR_CLAIM_NOT_QUEUED (409)."
        test_recipe:
          setup: ["clock set; group with G and C; two GIVER_PICK posts P1 and P2 by G; C holds a QUEUED claim on P2 only"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
              payload: { email: "ofg@x.com", display_name: "G" }
              as: Anonymous
              captures: { g_m_id: $.data.id }
            - call: "POST /v1/members"
              payload: { email: "ofc@x.com", display_name: "C" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /v1/groups"
              payload: { name: "Foreign Offer Group", zip_code: "98241", join_policy: "OPEN", capacity: 150 }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${g_m_id}"
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${c_id}"
            - call: "POST /v1/gift-posts"
              payload: { group_id: "${g_id}", title: "Chair P1", category: "FURNITURE", claim_mode: "GIVER_PICK", expires_at: "2026-06-10T00:00:00Z" }
              as: Member
              as_user_id: "${g_m_id}"
              captures: { p1: $.data.id }
            - call: "POST /v1/gift-posts/${p1}/publish"
              as: Member
              as_user_id: "${g_m_id}"
            - call: "POST /v1/gift-posts"
              payload: { group_id: "${g_id}", title: "Chair P2", category: "FURNITURE", claim_mode: "GIVER_PICK", expires_at: "2026-06-10T00:00:00Z" }
              as: Member
              as_user_id: "${g_m_id}"
              captures: { p2: $.data.id }
            - call: "POST /v1/gift-posts/${p2}/publish"
              as: Member
              as_user_id: "${g_m_id}"
            - call: "POST /v1/claims"
              payload: { post_id: "${p2}" }
              as: Member
              as_user_id: "${c_id}"
              captures: { cl_c: $.data.id }
          trigger:
            - call: "POST /v1/gift-posts/${p1}/offer"
              payload: { claim_id: "${cl_c}" }
              as: Member
              as_user_id: "${g_m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CLAIM_NOT_QUEUED, http 409 (claim ${cl_c} belongs to ${p2}, not ${p1})"
            - "GiftPost.${p1}.status remains OPEN with current_claim_id == null"

      - name: cascading_side_effects_coverage
        claim_type: cascade_chain
        grounds: ["state_machines.Claim.OFFERED_to_DECLINED"]
        excluded_because:
          difficulty_instance: claim_decline_promotes_next_and_recomputes_post
          rationale: "N-level cascade verified end-to-end by the named §1.8 instance (and the strike-suspension cascade by strike_resolve_suspends_member_and_requeues_offer)."

      - name: rate_threshold_trigger_coverage
        claim_type: threshold
        grounds: ["calculations.calc_strike_thresholds"]
        excluded_because:
          difficulty_instance: third_strike_point_exactly_suspends
          rationale: "Cumulative threshold at the exact boundary asserted by the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_on_membership_approve
        claim_type: immediate_visibility
        grounds: ["complexity_profile.consistency_model", "entities.NeighborhoodGroup.fields.member_count"]
        distinguishing_aspect: "Immediate consistency: the approve response itself carries APPROVED, and the very next GET on the group already reflects member_count incremented (no eventual lag)."
        test_recipe:
          setup: ["APPROVAL_REQUIRED group; M's membership REQUESTED"]
          setup_api_calls:
            - call: "POST /v1/members"
              payload: { email: "icm@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /v1/groups"
              payload: { name: "Immediate Group", zip_code: "98242", join_policy: "APPROVAL_REQUIRED", capacity: 150 }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { group_id: "${g_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ms: $.data.id }
          trigger:
            - call: "POST /v1/memberships/${ms}/approve"
              as: PlatformAdmin
              captures: { ms_status: $.data.status }
            - call: "GET /v1/groups/${g_id}"
              as: PlatformAdmin
          assert:
            - "approve response: GroupMembership.${ms}.status == APPROVED in the same request"
            - "immediately following GET: Group.${g_id}.member_count == 1 (derived field already reconciled)"
