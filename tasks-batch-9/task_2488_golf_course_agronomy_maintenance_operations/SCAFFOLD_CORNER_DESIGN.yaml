      - name: applied_load_counts_only_the_clock_years_applications
        claim_type: input_set_filtering
        grounds:
          - calculations.turf_nitrogen_load
          - entities.TurfArea.fields.nitrogen_applied_lb_per_1000_ytd
        distinguishing_aspect: "The year-to-date load is filtered by year(applied_at) == year(logical clock), not by row age: advancing the clock from 2025-12-31 to 2026-01-05 drops the December application's 1.583 to 0.000 with no write to any row, and the January application then reports 1.055 alone."
        test_recipe:
          setup:
            - "Logical clock at 2025-12-31T06:00:00Z."
            - "One course, one 4000 sq ft GREEN on hole 7."
            - "One CAT_3_TURF applicator and one urea product at 46 percent nitrogen with no REI, buffer or posting."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2025-12-31T06:00:00Z" }
              as: Superintendent
              as_user_id: "super-1"
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 4000, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Dana Reyes", license_number: "OR-CAT3-12003", license_category: "CAT_3_TURF", license_expires_on: "2027-06-30" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { appl_a_id: $.data.id }
            - call: "POST /pesticide-products"
              payload: { trade_name: "Urea 46-0-0", epa_reg_no: "NA-FERT-0003", requires_license_category: "CAT_3_TURF", rei_hours: 0, min_buffer_ft: 0, max_wind_speed_mph: 15, posting_required: false, nitrogen_pct: 46 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { urea_id: $.data.id }
            - call: "POST /applications"
              payload: { turf_area_id: "${green7_id}", product_id: "${urea_id}", applicator_id: "${appl_a_id}", applied_at: "2025-12-31T06:00:00Z", rate_lb_per_acre: 150, wind_speed_mph: 4, distance_to_water_ft: 40 }
              as: Applicator
              as_user_id: "${appl_a_id}"
              captures: { app_dec_id: $.data.id }
            - call: "GET /turf-areas/${green7_id}"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { ytd_dec: $.data.nitrogen_applied_lb_per_1000_ytd }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T06:00:00Z" }
              as: Superintendent
              as_user_id: "super-1"
            - call: "GET /turf-areas/${green7_id}"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { ytd_after_rollover: $.data.nitrogen_applied_lb_per_1000_ytd }
            - call: "POST /applications"
              payload: { turf_area_id: "${green7_id}", product_id: "${urea_id}", applicator_id: "${appl_a_id}", applied_at: "2026-01-05T06:00:00Z", rate_lb_per_acre: 100, wind_speed_mph: 4, distance_to_water_ft: 40 }
              as: Applicator
              as_user_id: "${appl_a_id}"
              captures: { app_jan_id: $.data.id }
            - call: "GET /turf-areas/${green7_id}"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { ytd_jan: $.data.nitrogen_applied_lb_per_1000_ytd }
          assert:
            - "${ytd_dec} == 1.583 (total_lb 13.77, nitrogen_lb 6.33, 6.33 / 4.0 == 1.5825 -> 1.583)"
            - "${ytd_after_rollover} == 0.000: the December row is outside the clock's year"
            - "Application.${app_jan_id}.total_lb == 9.18 and nitrogen_lb == 4.22 (100 * 0.09182736 == 9.182736 -> 9.18; 9.18 * 0.46 == 4.2228 -> 4.22)"
            - "${ytd_jan} == 1.055 (4.22 / 4.0 == 1.055 exactly; the December 1.583 is not added)"
            - "Application.${app_dec_id}.record_status == RECORDED and Application.${app_jan_id}.record_status == RECORDED: filtering is a read-time predicate, not a state change"

      - name: frost_pushback_paces_sequential_fields_and_exempts_the_shotgun
        claim_type: chronological
        grounds:
          - calculations.frost_release_schedule
          - state_machines.PlayEvent.SCHEDULED_to_DELAYED
          - entities.PlayEvent.fields.effective_start_at
        distinguishing_aspect: "Five fields are created out of chronological order, and the pinned start_at ASC walk with MIN_SEPARATION_MINUTES 10 releases them at 07:45 / 07:55 / 08:05 / 08:07; the 07:22 field's 08:07 is the discriminator, because a shotgun that advanced prev_effective would have forced 08:15, and the field starting exactly at expected_clear_at is never touched."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T06:30:00Z."
            - "One course at version 1."
            - "Five SCHEDULED play events on 2026-08-05, created in the order 07:22, 07:00, 08:00, 07:20 (shotgun), 07:05."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T06:30:00Z" }
              as: Superintendent
              as_user_id: "super-1"
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id, course_v1: $.data.version }
            - call: "POST /play-events"
              payload: { course_id: "${course_id}", event_type: "STANDARD_TEE_TIMES", start_at: "2026-08-05T07:22:00Z", end_at: "2026-08-05T11:00:00Z", holes_in_play: 18, field_size: 40 }
              as: TournamentOfficial
              as_user_id: "tourn-1"
              captures: { pe_0722_id: $.data.id }
            - call: "POST /play-events"
              payload: { course_id: "${course_id}", event_type: "STANDARD_TEE_TIMES", start_at: "2026-08-05T07:00:00Z", end_at: "2026-08-05T11:00:00Z", holes_in_play: 18, field_size: 60 }
              as: TournamentOfficial
              as_user_id: "tourn-1"
              captures: { pe_0700_id: $.data.id }
            - call: "POST /play-events"
              payload: { course_id: "${course_id}", event_type: "STANDARD_TEE_TIMES", start_at: "2026-08-05T08:00:00Z", end_at: "2026-08-05T12:00:00Z", holes_in_play: 18, field_size: 40 }
              as: TournamentOfficial
              as_user_id: "tourn-1"
              captures: { pe_0800_id: $.data.id }
            - call: "POST /play-events"
              payload: { course_id: "${course_id}", event_type: "SHOTGUN_START", start_at: "2026-08-05T07:20:00Z", end_at: "2026-08-05T12:00:00Z", holes_in_play: 18, field_size: 144 }
              as: TournamentOfficial
              as_user_id: "tourn-1"
              captures: { pe_shotgun_id: $.data.id }
            - call: "POST /play-events"
              payload: { course_id: "${course_id}", event_type: "TOURNAMENT_ROUND", start_at: "2026-08-05T07:05:00Z", end_at: "2026-08-05T11:30:00Z", holes_in_play: 18, field_size: 78 }
              as: TournamentOfficial
              as_user_id: "tourn-1"
              captures: { pe_0705_id: $.data.id }
          trigger:
            - call: "POST /weather-events"
              payload: { course_id: "${course_id}", event_type: "FROST", delay_minutes: 45, expected_clear_at: "2026-08-05T08:00:00Z", expected_course_version: "${course_v1}" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { wx_frost_id: $.data.id }
          assert:
            - "PlayEvent.${pe_0700_id}: effective_start_at == 2026-08-05T07:45:00Z, delayed_minutes == 45, status == DELAYED (naive pushback, no predecessor)"
            - "PlayEvent.${pe_0705_id}: effective_start_at == 2026-08-05T07:55:00Z, delayed_minutes == 50, status == DELAYED (max of naive 07:50 and 07:45 + 10)"
            - "PlayEvent.${pe_shotgun_id}: effective_start_at == 2026-08-05T08:05:00Z, delayed_minutes == 45, status == DELAYED (naive only; a simultaneous start needs no separation)"
            - "PlayEvent.${pe_0722_id}: effective_start_at == 2026-08-05T08:07:00Z, delayed_minutes == 45, status == DELAYED (max of naive 08:07 and prev_effective 07:55 + 10 == 08:05; had the shotgun advanced prev_effective to 08:05 this would be 08:15 with delayed_minutes 53)"
            - "PlayEvent.${pe_0800_id}: status == SCHEDULED, effective_start_at == 2026-08-05T08:00:00Z, delayed_minutes == 0 (start_at == expected_clear_at fails the strict predicate)"
            - "WeatherEvent.${wx_frost_id}.status == ACTIVE and declared_at == 2026-08-05T06:30:00Z"
            - "Course.${course_id}.play_posture == FROST_DELAY, frost_delay_minutes == 45 and version == 2"

      - name: play_posture_projects_the_active_event_set_by_precedence
        claim_type: projection
        grounds:
          - calculations.course_play_posture
          - state_machines.WeatherEvent.ACTIVE_to_CLEARED
          - entities.Course.fields.play_posture
        distinguishing_aspect: "Nine writes replay a full weather season on one course: the posture is always re-derived from the ACTIVE set rather than remembered, a LIGHTNING event masks an ACTIVE frost and zeroes frost_delay_minutes without erasing it, and two frosts declared at the same clock instant resolve on the created_at tie-break so the second one's 60 minutes governs until it clears."
        test_recipe:
          setup:
            - "One course at version 1; the logical clock stays at its default 2026-08-01T00:00:00Z so every event shares one declared_at."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id, cv1: $.data.version }
          trigger:
