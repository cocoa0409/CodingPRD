          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Metric = money exposure on the accept endpoint: exposure exactly equal
          to credit_limit_cents PASSES (strictly-greater rejects). Quote total
          is engineered to 110770; a customer with limit 110770 accepts while a
