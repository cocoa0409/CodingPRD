              as_user_id: "LIC-1"
              captures: { firm_lind: $.data.id }
            - call: "POST /plan-submissions"
              payload: { firm_registration_id: "${firm_lind}", project_name: "Riverside Pump Station", sheet_count: 12 }
              as: FirmAdmin
              as_user_id: "${firm_lind}"
              captures: { plan_lind: $.data.id }
          trigger:
            - call: "POST /plan-submissions/${plan_lind}/seal"
              payload: { sealing_license_id: "${lic_tova}", responsible_charge_attested: false }
              as: Licensee
              as_user_id: "${eng_tova}"
            - call: "POST /plan-submissions/${plan_lind}/seal"
              payload: { sealing_license_id: "${lic_tova}", responsible_charge_attested: true }
              as: Licensee
              as_user_id: "${eng_tova}"
            - call: "POST /plan-submissions/${plan_lind}/seal"
              payload: { sealing_license_id: "${lic_tova}", responsible_charge_attested: true }
              as: Licensee
              as_user_id: "${eng_tova}"
          assert:
