            - "EvidenceLink.${l1_id}.contribution == 0.94 (and the same for ${l2_id} and ${l3_id})"
            - "After the trigger, Finding.${f_id}.status == EVIDENCE_LOCKED"
            - "After the trigger, Finding.${f_id}.strength_variant == CORROBORATED"
            - "After the trigger, Finding.${f_id}.evidence_strength == 0.56"
            - "The two variants disagree on identical link data: 0.71 under PROVISIONAL vs 0.56 under CORROBORATED"
