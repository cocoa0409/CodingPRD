          - entities.Manuscript.fields.corresponding_author_id
        distinguishing_aspect: |
          Ownership is checked against Manuscript.corresponding_author_id, not merely against the Author
          role: a second, perfectly valid Author acting on someone else's REVISION_REQUESTED manuscript
          gets 403 ERR_NOT_RESOURCE_OWNER, and the manuscript stays in REVISION_REQUESTED at
          revision_round 0.
        test_recipe:
          setup:
            - "One journal with min_completed_reviews_for_decision 1 and max_revision_rounds 2."
            - "Author One's manuscript has received a MAJOR_REVISION decision, so it sits in REVISION_REQUESTED."
            - "A second Author row exists at a different institution."
