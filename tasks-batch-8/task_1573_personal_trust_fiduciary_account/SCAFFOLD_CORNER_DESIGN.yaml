      - name: unfiled_returns_block_tax_clearance
        claim_type: violation_to_error
        grounds: ["state_machines.TerminationCase.LIABILITIES_RESERVED_to_TAX_CLEARANCE_RECEIVED", "errors[ERR_UNFILED_TAX_RETURNS]"]
        distinguishing_aspect: "Cross-entity state gate: with a filing still in DATA_COLLECTION, record-tax-clearance fails with ERR_UNFILED_TAX_RETURNS."
        test_recipe:
          setup: ["ACTIVE DISCRETIONARY trust with principal 10,000.00; a 2026 filing in DATA_COLLECTION; TerminationCase in LIABILITIES_RESERVED (reserves 1,000.00 + 1,000.00)"]
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Clearance Block", trust_type: "IRREVOCABLE", grantor_name: "G", governing_state: "TX", ein: "04-0000065", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INITIAL_FUNDING", amount_cents: 1000000, value_date: "2026-08-05", description: "funding" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/tax-return-filings", payload: { trust_id: "${trust_id}", tax_year: 2026 }, as: TaxSpecialist, captures: { fil: $.data.id } }
            - { call: "POST /trusts/${trust_id}/terminate", payload: { reason: "directed" }, as: TrustOfficer }
            - { call: "GET /trusts/termination-cases", payload: { trust_id: "${trust_id}" }, as: TrustOfficer, captures: { case_id: "$.data[0].id" } }
            - { call: "POST /trusts/termination-cases/${case_id}/reserve-liabilities", payload: { reserve_taxes_cents: 100000, reserve_fees_cents: 100000 }, as: TrustOfficer }
          trigger:
            - { call: "POST /trusts/termination-cases/${case_id}/record-tax-clearance", as: TaxSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "Trigger fails: error_id == ERR_UNFILED_TAX_RETURNS, http 409"
            - "TerminationCase.${case_id}.status remains LIABILITIES_RESERVED"

      - name: close_blocked_until_final_statement_acknowledged
        claim_type: violation_to_error
        grounds: ["state_machines.TerminationCase.DISTRIBUTED_to_CLOSED", "errors[ERR_FINAL_STATEMENT_NOT_ACKNOWLEDGED]"]
        distinguishing_aspect: "Terminal-gate composition: after the waterfall distributes everything, close still fails until the final-year statement is ACKNOWLEDGED (and the final 1041 is ACCEPTED)."
        test_recipe:
          setup:
            - "ACTIVE DISCRETIONARY trust; sole INCOME beneficiary 10000 bps; principal 10,000.00, income 2,000.00; no filings"
            - "TerminationCase DISTRIBUTED (reserves 1,000.00 taxes + 1,000.00 fees; income line 2,000.00 to the beneficiary; principal remainder 8,000.00 has no remainder class so it stays as reserve-backed balance)"
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Close Gate", trust_type: "IRREVOCABLE", grantor_name: "G", governing_state: "TX", ein: "04-0000066", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/beneficiaries", payload: { trust_id: "${trust_id}", full_name: "Ivy", beneficiary_class: "INCOME", share_bps: 10000, date_of_birth: "1955-01-01" }, as: TrustOfficer, captures: { b_inc: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INITIAL_FUNDING", amount_cents: 1000000, value_date: "2026-08-05", description: "principal" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INTEREST", amount_cents: 200000, value_date: "2026-08-06", description: "income" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/${trust_id}/terminate", payload: { reason: "directed" }, as: TrustOfficer, as_user_id: "officer_init" }
            - { call: "GET /trusts/termination-cases", payload: { trust_id: "${trust_id}" }, as: TrustOfficer, captures: { case_id: "$.data[0].id" } }
            - { call: "POST /trusts/termination-cases/${case_id}/reserve-liabilities", payload: { reserve_taxes_cents: 100000, reserve_fees_cents: 100000 }, as: TrustOfficer }
            - { call: "POST /trusts/termination-cases/${case_id}/record-tax-clearance", as: TaxSpecialist }
            - { call: "POST /trusts/termination-cases/${case_id}/approve-final-accounting", as: TrustExecutive, as_user_id: "exec_other" }
            - { call: "POST /trusts/termination-cases/${case_id}/distribute", as: TrustOperationsOfficer }
          trigger:
            - { call: "POST /trusts/termination-cases/${case_id}/close", as: TrustOfficer, captures: { err: $.data.error_id } }
          assert:
            - "TrustAccount.${trust_id}.status == TERMINATED after distribute"
            - "Trigger fails: error_id == ERR_FINAL_STATEMENT_NOT_ACKNOWLEDGED, http 409 (no FY2026 statement was ever acknowledged)"
            - "TerminationCase.${case_id}.status remains DISTRIBUTED"

      - name: duplicate_statement_year_and_tax_year_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_STATEMENT_YEAR_EXISTS]", "errors[ERR_DUPLICATE_TAX_YEAR]"]
        distinguishing_aspect: "Two uniqueness constraints in one flow: a second non-SUPERSEDED FY2026 statement fails with ERR_STATEMENT_YEAR_EXISTS and a second 2026 filing fails with ERR_DUPLICATE_TAX_YEAR."
        test_recipe:
          setup: ["ACTIVE DISCRETIONARY trust; one FY2026 statement (DRAFT) and one 2026 filing (DATA_COLLECTION) already exist"]
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Dup Years", trust_type: "IRREVOCABLE", grantor_name: "G", governing_state: "DE", ein: "04-0000067", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/annual-statements", payload: { trust_id: "${trust_id}", fiscal_year: 2026 }, as: TrustOfficer, captures: { stmt: $.data.id } }
            - { call: "POST /trusts/tax-return-filings", payload: { trust_id: "${trust_id}", tax_year: 2026 }, as: TaxSpecialist, captures: { fil: $.data.id } }
          trigger:
            - { call: "POST /trusts/annual-statements", payload: { trust_id: "${trust_id}", fiscal_year: 2026 }, as: TrustOfficer, captures: { err1: $.data.error_id } }
            - { call: "POST /trusts/tax-return-filings", payload: { trust_id: "${trust_id}", tax_year: 2026 }, as: TaxSpecialist, captures: { err2: $.data.error_id } }
          assert:
            - "Second statement: error_id == ERR_STATEMENT_YEAR_EXISTS, http 409"
            - "Second filing: error_id == ERR_DUPLICATE_TAX_YEAR, http 409"

      - name: trust_not_active_gate
        claim_type: violation_to_error
        grounds: ["errors[ERR_TRUST_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / open_voting_blocked_when_trust_suspended
          rationale: "Asserted as the failure path of the named difficulty instance."

      - name: purpose_outside_standard_gate
        claim_type: violation_to_error
        grounds: ["errors[ERR_PURPOSE_OUTSIDE_STANDARD]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_beats_referential_on_request_create
          rationale: "Asserted as the winning error of the safety-vs-referential priority pair."

      - name: request_not_approved_gate
        claim_type: violation_to_error
        grounds: ["errors[ERR_REQUEST_NOT_APPROVED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_on_disburse
          rationale: "Asserted as the winning error of the state-vs-fiscal priority pair; also exercised standalone by corner disburse_submitted_request_rejected."

      - name: unposted_fee_assessments_gate
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNPOSTED_FEE_ASSESSMENTS]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / prepare_blocked_by_unposted_fee
          rationale: "Asserted as the failure path of the named difficulty instance."

      - name: ips_period_overlap_gate
        claim_type: violation_to_error
        grounds: ["errors[ERR_IPS_PERIOD_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / ips_half_open_adjacency_allowed_overlap_rejected
          rationale: "Asserted by the named difficulty instance."

      - name: fee_period_tiling_gate
        claim_type: violation_to_error
        grounds: ["errors[ERR_FEE_PERIOD_NOT_CONTIGUOUS]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / fee_period_gap_free_tiling
          rationale: "Asserted by the named difficulty instance (both gap and overlap variants)."

  - section: endpoints
    instances:
      - name: response_envelope_object_and_array
        claim_type: response_envelope
        grounds: ["response_envelope"]
        distinguishing_aspect: "Every response carries meta.api_request_id + meta.api_request_timestamp; single-resource reads use response_type 'object', list reads 'array' with the four pagination fields."
        test_recipe:
          setup: ["one DRAFT trust exists"]
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Envelope", trust_type: "REVOCABLE", grantor_name: "G", governing_state: "DE", ein: "04-0000071", fiscal_year_end_month: 12, distribution_standard: "HEMS" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
          trigger:
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer }
            - { call: "GET /trusts", as: TrustOfficer }
          assert:
            - "Single GET: response_type == 'object', meta.api_request_id present and non-empty, data.id == ${trust_id}"
            - "List GET: response_type == 'array', data is an array, and limit/offset/total_count/has_more are all present"

      - name: ledger_immutable_put_returns_405
        claim_type: conditional_action
        grounds: ["errors[ERR_LEDGER_IMMUTABLE]", "entities.LedgerEntry"]
        distinguishing_aspect: "The append-only ledger rejects PUT with ERR_LEDGER_IMMUTABLE (405) even for a valid operations user and an existing entry id."
        test_recipe:
          setup: ["ACTIVE DISCRETIONARY trust with one posted INTEREST receipt"]
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Immutable", trust_type: "IRREVOCABLE", grantor_name: "G", governing_state: "DE", ein: "04-0000072", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INTEREST", amount_cents: 100000, value_date: "2026-08-06", description: "income" }, as: TrustOperationsOfficer, captures: { entry: "$.data[0].id" } }
          trigger:
            - { call: "PUT /trusts/ledger-entries/${entry}", as: TrustOperationsOfficer, captures: { err: $.data.error_id } }
          assert:
            - "Trigger fails: error_id == ERR_LEDGER_IMMUTABLE, http 405"
            - "GET /trusts/ledger-entries/${entry} still shows amount_cents == 100000 (unchanged)"

  - section: rbac
    instances:
      - name: beneficiary_role_forbidden_from_staff_endpoints
        claim_type: rbac_denial
        grounds: ["roles[Beneficiary]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Peer-role isolation: the Beneficiary role is not in the role list of POST /trusts (or document/committee endpoints) and is denied with ERR_FORBIDDEN before any business logic."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /trusts", payload: { trust_name: "Nope", trust_type: "REVOCABLE", grantor_name: "G", governing_state: "DE", ein: "04-0000081", fiscal_year_end_month: 12, distribution_standard: "HEMS" }, as: Beneficiary, as_user_id: "ben_outsider", captures: { err: $.data.error_id } }
          assert:
            - "Trigger fails: error_id == ERR_FORBIDDEN, http 403"

      - name: officer_cannot_approve_document
        claim_type: rbac_denial
        grounds: ["roles[TrustExecutive]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Approval-chain step ownership: document approval is exclusive to TrustExecutive; the TrustOfficer who interpreted the document is denied (ERR_FORBIDDEN), the executive succeeds."
        test_recipe:
          setup: ["DRAFT trust with an INTERPRETED document"]
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "RBAC Doc", trust_type: "IRREVOCABLE", grantor_name: "G", governing_state: "DE", ein: "04-0000082", fiscal_year_end_month: 12, distribution_standard: "HEMS" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/documents", payload: { trust_id: "${trust_id}", version_number: 1, summary: "v1" }, as: TrustOfficer, captures: { doc: $.data.id } }
            - { call: "POST /trusts/documents/${doc}/submit", as: TrustOfficer }
            - { call: "POST /trusts/documents/${doc}/interpret", payload: { per_stirpes: false, interpretation_notes: "ok" }, as: TrustOfficer }
          trigger:
            - { call: "POST /trusts/documents/${doc}/approve", as: TrustOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /trusts/documents/${doc}/approve", as: TrustExecutive }
          assert:
            - "Officer attempt fails: error_id == ERR_FORBIDDEN, http 403"
            - "Executive attempt succeeds: TrustDocument.${doc}.status == APPROVED"

      - name: beneficiary_cannot_withdraw_others_request
        claim_type: rbac_denial
        grounds: ["roles[Beneficiary]", "errors[ERR_NOT_OWN_RESOURCE]"]
        distinguishing_aspect: "Entity-backed ownership: beneficiary B (same trust) attempting to withdraw beneficiary A's request fails with ERR_NOT_OWN_RESOURCE (403) even though Beneficiary is a listed role for withdraw."
        test_recipe:
          setup: ["ACTIVE DISCRETIONARY trust; income beneficiary A (6000 bps) and B (4000 bps); A has a SUBMITTED request"]
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Ownership", trust_type: "IRREVOCABLE", grantor_name: "G", governing_state: "DE", ein: "04-0000083", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/beneficiaries", payload: { trust_id: "${trust_id}", full_name: "A Aaa", beneficiary_class: "INCOME", share_bps: 6000, date_of_birth: "1950-01-01" }, as: TrustOfficer, captures: { ben_a: $.data.id } }
            - { call: "POST /trusts/beneficiaries", payload: { trust_id: "${trust_id}", full_name: "B Bbb", beneficiary_class: "INCOME", share_bps: 4000, date_of_birth: "1951-01-01" }, as: TrustOfficer, captures: { ben_b: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer, captures: { tv: $.data.version } }
            - { call: "POST /trusts/distribution-requests", payload: { trust_id: "${trust_id}", beneficiary_id: "${ben_a}", amount_cents: 50000, allocation_source: "INCOME_ONLY", purpose_category: "OTHER", expected_trust_account_version: "${tv}" }, as: Beneficiary, as_user_id: "${ben_a}", captures: { req: $.data.id } }
          trigger:
            - { call: "POST /trusts/distribution-requests/${req}/withdraw", as: Beneficiary, as_user_id: "${ben_b}", captures: { err: $.data.error_id } }
            - { call: "POST /trusts/distribution-requests/${req}/withdraw", as: Beneficiary, as_user_id: "${ben_a}" }
          assert:
            - "B's withdraw fails: error_id == ERR_NOT_OWN_RESOURCE, http 403"
            - "A's own withdraw succeeds: DistributionRequest.${req}.status == WITHDRAWN"

      - name: tax_specialist_cannot_activate_ips
        claim_type: rbac_denial
        grounds: ["roles[InvestmentManager]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Exclusive operation enforcement: IPS activation is exclusive to InvestmentManager; TaxSpecialist is denied with ERR_FORBIDDEN."
        test_recipe:
          setup: ["ACTIVE trust with a DRAFT IPS"]
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "RBAC IPS", trust_type: "IRREVOCABLE", grantor_name: "G", governing_state: "DE", ein: "04-0000084", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/investment-policy-statements", payload: { trust_id: "${trust_id}", effective_from: "2026-08-01", effective_to: "2027-08-01", equity_target_pct: 60.00, equity_band_pct: 5.00, fixed_income_target_pct: 30.00, fixed_income_band_pct: 5.00, alternatives_allowed: false }, as: InvestmentManager, captures: { ips: $.data.id } }
          trigger:
            - { call: "POST /trusts/investment-policy-statements/${ips}/activate", as: TaxSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "Trigger fails: error_id == ERR_FORBIDDEN, http 403"
            - "InvestmentPolicyStatement.${ips}.status remains DRAFT"

  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_on_request_create
        claim_type: optimistic_concurrency_stale_version
        grounds: ["concurrency_rules[request-create-stale-trust]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on TrustAccount.version for request creation: after a first successful create bumps the version, a second create carrying the previously observed version is rejected 412 ERR_STALE_VERSION - two strictly sequential calls, no wall-clock dependence."
        test_recipe:
          setup: ["ACTIVE DISCRETIONARY trust; income beneficiary; principal 10,000.00 and income 50,000.00 posted"]
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "OCC Req", trust_type: "IRREVOCABLE", grantor_name: "G", governing_state: "DE", ein: "04-0000091", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/beneficiaries", payload: { trust_id: "${trust_id}", full_name: "Ivy", beneficiary_class: "INCOME", share_bps: 10000, date_of_birth: "1955-01-01" }, as: TrustOfficer, captures: { b_inc: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INTEREST", amount_cents: 5000000, value_date: "2026-08-06", description: "income" }, as: TrustOperationsOfficer }
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer, captures: { tv: $.data.version } }
          trigger:
            - { call: "POST /trusts/distribution-requests", payload: { trust_id: "${trust_id}", beneficiary_id: "${b_inc}", amount_cents: 100000, allocation_source: "INCOME_ONLY", purpose_category: "OTHER", expected_trust_account_version: "${tv}" }, as: TrustOfficer, captures: { req1: $.data.id } }
            - { call: "POST /trusts/distribution-requests", payload: { trust_id: "${trust_id}", beneficiary_id: "${b_inc}", amount_cents: 200000, allocation_source: "INCOME_ONLY", purpose_category: "OTHER", expected_trust_account_version: "${tv}" }, as: TrustOfficer, captures: { err: $.data.error_id } }
          assert:
            - "First create succeeds (201): DistributionRequest.${req1}.status == SUBMITTED"
            - "Second create with the stale version fails: error_id == ERR_STALE_VERSION, http 412"
            - "TrustAccount.pending_distribution_count == 1 (the rejected create left no residue)"

      - name: occ_stale_version_on_holding_create
        claim_type: optimistic_concurrency_stale_version
        grounds: ["concurrency_rules[holding-create-stale-trust]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on TrustAccount.version for purchases: a second buy carrying the version observed before the first buy is rejected 412, protecting the cash-debit decision from a stale balance view."
        test_recipe:
          setup: ["ACTIVE DISCRETIONARY trust funded 1,000,000.00 principal; no IPS"]
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "OCC Hold", trust_type: "IRREVOCABLE", grantor_name: "G", governing_state: "DE", ein: "04-0000092", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INITIAL_FUNDING", amount_cents: 100000000, value_date: "2026-08-05", description: "funding" }, as: TrustOperationsOfficer }
            - { call: "GET /trusts/${trust_id}", as: InvestmentManager, captures: { tv: $.data.version } }
          trigger:
            - { call: "POST /trusts/investment-holdings", payload: { trust_id: "${trust_id}", asset_class: "EQUITY", ticker: "AAA", units: 10, unit_price_cents: 100000, expected_trust_account_version: "${tv}" }, as: InvestmentManager, captures: { h1: $.data.id } }
            - { call: "POST /trusts/investment-holdings", payload: { trust_id: "${trust_id}", asset_class: "EQUITY", ticker: "BBB", units: 10, unit_price_cents: 100000, expected_trust_account_version: "${tv}" }, as: InvestmentManager, captures: { err: "$.data.error_id" } }
          assert:
            - "First purchase succeeds: InvestmentHolding.${h1}.market_value_cents == 1000000"
            - "Second purchase with the stale version fails: error_id == ERR_STALE_VERSION, http 412; no BBB holding exists"

      - name: occ_version_increments_on_every_mutation
        claim_type: optimistic_concurrency_version_monotonic
        grounds: ["concurrency_rules[request-create-stale-trust]", "entities.TrustAccount"]
        distinguishing_aspect: "Version monotonicity: create -> submit -> accept -> receipt each increment TrustAccount.version by exactly 1, so the observed sequence is 1, 2, 3, 4."
        test_recipe:
          setup: ["fresh trust driven through four mutations"]
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Versions", trust_type: "REVOCABLE", grantor_name: "G", governing_state: "DE", ein: "04-0000093", fiscal_year_end_month: 12, distribution_standard: "HEMS" }, as: TrustOfficer, captures: { trust_id: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer, captures: { v2: $.data.version } }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive, captures: { v3: $.data.version } }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INITIAL_FUNDING", amount_cents: 100000, value_date: "2026-08-05", description: "funding" }, as: TrustOperationsOfficer }
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer, captures: { v4: $.data.version } }
          assert:
            - "v1 == 1, v2 == 2, v3 == 3, v4 == 4 (each mutation increments by exactly one, including cascaded balance recomputes counting as one mutation per request)"

      - name: derived_tmv_reconciliation_across_buy_reprice_sell
        claim_type: derived_field_reconciliation
        grounds: ["calculations.account_balances", "entities.InvestmentHolding.fields.market_value_cents"]
        distinguishing_aspect: "Derived-field reconciliation: TMV is invariant under buy/sell (cash <-> asset conversion) and moves exactly with repricing; cost basis reduces pro-rata on a partial sale with round_half_up."
        test_recipe:
          setup: ["ACTIVE DISCRETIONARY trust funded 1,000,000.00; holding AAA 1000 units @ 25,000 cents"]
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "TMV", trust_type: "IRREVOCABLE", grantor_name: "G", governing_state: "DE", ein: "04-0000094", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INITIAL_FUNDING", amount_cents: 100000000, value_date: "2026-08-05", description: "funding" }, as: TrustOperationsOfficer }
            - { call: "GET /trusts/${trust_id}", as: InvestmentManager, captures: { tv1: $.data.version } }
            - { call: "POST /trusts/investment-holdings", payload: { trust_id: "${trust_id}", asset_class: "EQUITY", ticker: "AAA", units: 1000, unit_price_cents: 25000, expected_trust_account_version: "${tv1}" }, as: InvestmentManager, captures: { h: $.data.id } }
          trigger:
            - { call: "GET /trusts/${trust_id}", as: InvestmentManager, captures: { tmv_after_buy: $.data.total_market_value_cents, cash_after_buy: $.data.principal_balance_cents } }
            - { call: "POST /trusts/investment-holdings/${h}/update-price", payload: { unit_price_cents: 26000, priced_at: "2026-09-01T00:00:00Z" }, as: InvestmentManager }
            - { call: "GET /trusts/${trust_id}", as: InvestmentManager, captures: { tmv_after_reprice: $.data.total_market_value_cents } }
            - { call: "POST /trusts/investment-holdings/${h}/sell", payload: { units: 500 }, as: InvestmentManager }
            - { call: "GET /trusts/investment-holdings/${h}", as: InvestmentManager, captures: { units_left: $.data.units, basis_left: $.data.cost_basis_cents } }
            - { call: "GET /trusts/${trust_id}", as: InvestmentManager, captures: { tmv_after_sell: $.data.total_market_value_cents, cash_after_sell: $.data.principal_balance_cents } }
          assert:
            - "After buy: total_market_value_cents == 100000000 (buy converts cash, TMV unchanged) and principal_balance_cents == 75000000"
            - "After reprice to 26,000: total_market_value_cents == 101000000 (gain of 1,000,000 cents)"
            - "After selling 500 units: units == 500, cost_basis_cents == 12500000 (round_half_up(25000000 * 500/1000)), principal_balance_cents == 88000000"
            - "total_market_value_cents == 101000000 after the sale (13,000,000 holdings + 88,000,000 cash)"

  - section: consistency_model
    instances:
      - name: immediate_read_after_write_visibility
        claim_type: immediate_visibility
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: the POST response and the very next GET already reflect the posted receipt - no delay, no stale read."
        test_recipe:
          setup: ["ACTIVE DISCRETIONARY trust"]
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Immediate", trust_type: "REVOCABLE", grantor_name: "G", governing_state: "DE", ein: "04-0000095", fiscal_year_end_month: 12, distribution_standard: "HEMS" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
          trigger:
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INTEREST", amount_cents: 123456, value_date: "2026-08-06", description: "income" }, as: TrustOperationsOfficer }
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer, captures: { bal: $.data.income_balance_cents } }
          assert:
            - "GET immediately after POST returns income_balance_cents == 123456"
