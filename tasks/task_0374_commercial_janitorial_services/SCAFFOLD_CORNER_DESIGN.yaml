          - errors[ERR_DUPLICATE_PERIOD]
          - entities.BillingPeriod.fields.period_month
        distinguishing_aspect: "A second POST /billing-periods for the same (contract_id, period_month) returns ERR_DUPLICATE_PERIOD (409); uniqueness constraint."
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site, ACTIVE contract, one OPEN period for 2026-06."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
