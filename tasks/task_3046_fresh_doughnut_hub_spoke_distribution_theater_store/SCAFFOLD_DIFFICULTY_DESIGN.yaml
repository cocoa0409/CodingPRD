              as: NetworkAdmin
              captures: { d8: $.data.id }
            - call: "POST /networks/${n8}/hubs/${h8}/batches"
              payload: { equipment_line_id: "${l8}", production_date: "2026-09-01", planned_dozens: 60 }
              as: HubManager
              captures: { b8: $.data.id }
            - call: "POST /networks/${n8}/hubs/${h8}/batches/${b8}/commit"
