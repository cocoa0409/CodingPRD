  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: assign_in_progress_audit_with_incompetent_auditor_state_wins
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_INVALID_AUDIT_STATE]
          - errors[ERR_AUDITOR_COMPETENCY_GAP]
        distinguishing_aspect: |
          Category pair = state (priority 5) vs business_constraint
          (priority 9). Assigning an auditor who lacks BAKERY competency to an
