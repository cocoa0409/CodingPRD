              captures: { bid: $.data.id, bv: $.data.version }
            - call: "POST /golf/members"
              payload: { email: "ns2@x.com", full_name: "NS2", tier: "PLATINUM" }
              as: RangeManager
              captures: { mid: $.data.id }
            - call: "POST /golf/members/${mid}/wallet/topup"
              payload: { amount_cents: 50000 }
              as: RangeManager
            - call: "POST /golf/reservations"
              payload: { venue_id: "${vid}", bay_id: "${bid}", member_id: "${mid}", start_utc: "2026-06-02T18:00:00Z", end_utc: "2026-06-02T19:00:00Z", time_band: "PEAK", day_type: "WEEKDAY", pay_source: "WALLET" }
              as: Guest
              as_user_id: "${mid}"
              captures: { rid: $.data.id }
            - call: "POST /golf/reservations/${rid}/confirm"
              payload: { expected_bay_version: "${bv}" }
              as: Guest
              as_user_id: "${mid}"
            - call: "POST /golf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T20:00:00Z" }
              as: RangeManager
          trigger:
            - call: "POST /golf/venues/${vid}/sweep_holds"
              payload: {}
              as: RangeManager
          assert:
            - "Reservation.${rid}.status == NO_SHOW"
            - "Reservation.${rid}.no_show_fee_cents == 3400"
            - "Member.${mid}.pending_loyalty_points == 0"

      - name: queue_ticket_expires_after_ttl_on_sweep
        claim_type: scheduled_actions
        grounds:
          - state_machines.QueueTicket.WAITING_to_EXPIRED
        distinguishing_aspect: "A WAITING queue ticket older than QUEUE_TTL_MINUTES is moved to EXPIRED by sweep_holds; it no longer counts in open_queue_length."
        test_recipe:
          setup: ["Venue+Member; one WAITING ticket created at 2026-06-01T12:00Z; clock advanced well past QUEUE_TTL."]
          setup_api_calls:
            - call: "POST /golf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: RangeManager
            - call: "POST /golf/venues"
              payload: { name: "V", bay_count: 1 }
              as: RangeManager
              captures: { vid: $.data.id }
            - call: "POST /golf/members"
              payload: { email: "qe@x.com", full_name: "QE" }
              as: RangeManager
              captures: { mid: $.data.id }
            - call: "POST /golf/queue-tickets"
              payload: { venue_id: "${vid}", member_id: "${mid}" }
              as: Guest
              as_user_id: "${mid}"
              captures: { tid: $.data.id }
            - call: "POST /golf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T20:00:00Z" }
              as: RangeManager
          trigger:
            - call: "POST /golf/venues/${vid}/sweep_holds"
              payload: {}
              as: RangeManager
          assert:
            - "QueueTicket.${tid}.status == EXPIRED"
            - "Venue.${vid}.open_queue_length == 0"

