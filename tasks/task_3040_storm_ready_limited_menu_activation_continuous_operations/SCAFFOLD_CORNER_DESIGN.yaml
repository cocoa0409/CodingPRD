          - errors[ERR_SERVICE_NOT_PAST]
        distinguishing_aspect: "A pledge dated 2026-09-11 cannot be confirmed while the logical clock is still 2026-09-10T23:59:59Z; the gate opens at service_date 00:00:00Z (>= semantics)."
        test_recipe:
          setup: ["Clock 2026-09-10T23:59:59Z. Storm WATCH; unit U power DOWN. ReliefOrg ACTIVE. Pledge for service_date 2026-09-11."]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
