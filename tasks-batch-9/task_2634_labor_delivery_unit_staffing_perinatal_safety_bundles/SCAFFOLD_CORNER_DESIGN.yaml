            - "all_first == \"Ana Reyes RN\""
            - "the third response reports limit 10, offset 0, total_count 5 and has_more false, with exactly 5 rows"
            - "HTTP 400 on the fourth trigger call with error_id == \"ERR_INVALID_FIELD_VALUE\""
            - "HTTP 400 on the fifth trigger call with error_id == \"ERR_INVALID_FIELD_VALUE\""
            - "HTTP 404 on the sixth trigger call with error_id == \"ERR_UNIT_NOT_FOUND\""
            - "the sixth trigger call does NOT return HTTP 200 with an empty data array"
            - "StaffMember.${staff_ana}.unit_id == \"${unit_id}\""
            - "StaffMember.${staff_eli}.drill_currency_state == \"LAPSED\""
            - "StaffMember.${staff_ben}.capacity_units == 0.0"

      - name: nested_checklist_item_path_validates_the_activation_before_the_item_and_refuses_a_foreign_item
        claim_type: Standard CRUD
        grounds:
          - endpoints[GET /bundle-activations/{activationId}/checklist-items/{itemId}]
          - endpoints[GET /bundle-activations/{activationId}/checklist-items]
          - validations[priority=3]
          - errors[ERR_ACTIVATION_NOT_FOUND]
          - errors[ERR_CHECKLIST_ITEM_NOT_FOUND]
          - entities.BundleChecklistItem.parent
        distinguishing_aspect: |
          This is the scaffold's only two-deep path, and §1.4 priority 3 pins its resolution order
          explicitly: "activationId before itemId". Three failure modes hide here. (1) With BOTH ids
          bogus the answer must be ERR_ACTIVATION_NOT_FOUND — an implementation that resolves the leaf
          first (SELECT item WHERE id = ?) answers ERR_CHECKLIST_ITEM_NOT_FOUND. (2) With a real
          activation and a bogus item the answer must be ERR_CHECKLIST_ITEM_NOT_FOUND. (3) The nastiest:
          a REAL item id belonging to a DIFFERENT activation must also be ERR_CHECKLIST_ITEM_NOT_FOUND,
          because the nested route asserts parentage, not mere existence — an implementation that
          ignores the activationId once the itemId resolves happily serves one patient's hemorrhage
          checklist under another patient's activation.
        test_recipe:
          setup: |
            One unit, one AVAILABLE LDR bed, and two encounters each with its own OBSTETRIC_HEMORRHAGE
            activation, so two disjoint 4-item checklists exist and each activation's stage-1 item is a
            real row that is foreign to the other activation.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
