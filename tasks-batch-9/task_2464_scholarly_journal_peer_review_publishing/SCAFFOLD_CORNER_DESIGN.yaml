              payload: { scan_type: "PLAGIARISM", similarity_pct: 5.0 }
              as: SystemAdmin
            - call: "GET /manuscripts/${m_id}"
              as: SystemAdmin
              captures: { m_v: $.data.version }
            - call: "POST /editor-assignments"
              payload: { manuscript_id: "${m_id}", editor_id: "${ed_h1_id}", expected_manuscript_version: "${m_v}" }
              as: EditorInChief
              as_user_id: "${ed_chief_id}"
              captures: { ea_id: $.data.id }
