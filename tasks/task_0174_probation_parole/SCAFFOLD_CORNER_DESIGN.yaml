# §1.9 Scaffold Corner Design (breadth probe).
# Walks references/claim-extraction-guide.md row-by-row against SCAFFOLD.yaml §1.1-§1.7.
# Every active instance carries an executable test_recipe; corners already covered by §1.8
# are emitted as excluded_because stubs citing the §1.8 instance by name.
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_officer_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Officer, endpoints]
        distinguishing_aspect: "POST /officers with all required fields returns 201 and an Officer whose badge_number/role_type echo the input and whose id/created_at/version are system-minted (version==1)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /officers"
              payload: { full_name: "Jane Officer", badge_number: "B-C001", role_type: "PAROLE", active: true }
              as: CompactAdministrator
              captures: { off_id: $.data.id, v: $.data.version }
          assert:
            - "response status == 201"
            - "Officer.${off_id}.role_type == PAROLE"
            - "Officer.${off_id}.version == 1"

      - name: get_supervisee_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Supervisee, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /supervisees/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /supervisees/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Officer
              as_user_id: "anon-officer"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: create_supervisee_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Supervisee, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /supervisees omitting docket_number returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A PROBATION Officer exists."]
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "O ReqA", badge_number: "B-C002", role_type: "PROBATION" }
              as: CompactAdministrator
              captures: { off_id: $.data.id }
          trigger:
            - call: "POST /supervisees"
              payload: { full_name: "No Docket", supervision_type: "PROBATION", assigned_officer_id: "${off_id}", sentence_state_code: "CA", ordered_term_months: 24, supervision_start_date: "2025-01-01T00:00:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: officer_active_default_applied
        claim_type: Defaults
        grounds: [entities.Officer.fields.active]
        distinguishing_aspect: "POST /officers omitting active defaults active to true."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /officers"
              payload: { full_name: "Def Officer", badge_number: "B-C003", role_type: "PROBATION" }
              as: CompactAdministrator
              captures: { off_id: $.data.id }
          assert:
            - "Officer.${off_id}.active == true"

      - name: supervisee_computed_fields_ignore_input
        claim_type: Computed Fields
        grounds: [entities.Supervisee.fields.cumulative_violation_points, entities.Supervisee.fields.restitution_balance_cents, entities.Supervisee.fields.supervision_level]
        distinguishing_aspect: "On POST /supervisees the computed fields are server-initialized (supervision_level=MINIMUM, cumulative_violation_points=0, restitution_balance_cents=0) regardless of any client attempt; create takes only declared inputs."
        test_recipe:
          setup: ["A PROBATION Officer exists."]
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "O Cmp", badge_number: "B-C004", role_type: "PROBATION" }
              as: CompactAdministrator
              captures: { off_id: $.data.id }
          trigger:
            - call: "POST /supervisees"
              payload: { full_name: "Cmp S", docket_number: "DK-C004", supervision_type: "PROBATION", assigned_officer_id: "${off_id}", sentence_state_code: "CA", ordered_term_months: 24, supervision_start_date: "2025-01-01T00:00:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { sup_id: $.data.id }
          assert:
            - "Supervisee.${sup_id}.supervision_level == MINIMUM"
            - "Supervisee.${sup_id}.cumulative_violation_points == 0"
            - "Supervisee.${sup_id}.restitution_balance_cents == 0"
            - "Supervisee.${sup_id}.fee_balance_cents == 0"

      - name: create_supervisee_invalid_enum_supervision_type
        claim_type: Type Constraints
        grounds: [entities.Supervisee.fields.supervision_type, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /supervisees with supervision_type='HOUSE_ARREST' (not in {PROBATION,PAROLE}) returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A PROBATION Officer exists."]
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "O Enum", badge_number: "B-C005", role_type: "PROBATION" }
              as: CompactAdministrator
              captures: { off_id: $.data.id }
          trigger:
            - call: "POST /supervisees"
              payload: { full_name: "Enum S", docket_number: "DK-C005", supervision_type: "HOUSE_ARREST", assigned_officer_id: "${off_id}", sentence_state_code: "CA", ordered_term_months: 24, supervision_start_date: "2025-01-01T00:00:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: payment_is_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Payment]
        distinguishing_aspect: "Payment has common_fields:false — created via POST /supervisees/{sid}/payments, it carries only id/created_at (no version), and there is no update endpoint for it."
        test_recipe:
          setup: ["An ACTIVE PROBATION Supervisee with one OPEN RESTITUTION obligation 5000."]
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "O Imm", badge_number: "B-C006", role_type: "PROBATION" }
              as: CompactAdministrator
              captures: { off_id: $.data.id }
            - call: "POST /supervisees"
              payload: { full_name: "Imm S", docket_number: "DK-C006", supervision_type: "PROBATION", assigned_officer_id: "${off_id}", sentence_state_code: "CA", ordered_term_months: 24, supervision_start_date: "2025-01-01T00:00:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { sup_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments"
              payload: { domain_scores: { criminal_history: 1, education_employment: 1, financial: 1, family_marital: 1, accommodation: 1, leisure_recreation: 1, companions: 1, alcohol_drug: 1, emotional_personal: 1, attitudes_orientation: 1 } }
              as: Officer
              as_user_id: "${off_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments/${ra_id}/adopt"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/activate"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/obligations"
              payload: { obligation_type: "RESTITUTION", principal_cents: 5000 }
              as: Officer
              as_user_id: "${off_id}"
              captures: { ob_id: $.data.id }
          trigger:
            - call: "POST /supervisees/${sup_id}/payments"
              payload: { amount_cents: 5000 }
              as: Officer
              as_user_id: "${off_id}"
              captures: { pay_id: $.data.id }
          assert:
            - "response status == 201"
            - "Payment.${pay_id} has no version field"
            - "FinancialObligation.${ob_id}.status == PAID"

      - name: create_supervisee_unknown_officer_reference_not_found
        claim_type: Parent Relationships
        grounds: [entities.Supervisee.fields.assigned_officer_id, "validations[priority=4]", "errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "POST /supervisees with assigned_officer_id pointing to a non-existent Officer returns ERR_REFERENCE_NOT_FOUND (422)."
        test_recipe:
          setup: ["Empty DB (no officers)."]
          setup_api_calls: []
          trigger:
            - call: "POST /supervisees"
              payload: { full_name: "Orphan S", docket_number: "DK-C007", supervision_type: "PROBATION", assigned_officer_id: "00000000-0000-0000-0000-000000000000", sentence_state_code: "CA", ordered_term_months: 24, supervision_start_date: "2025-01-01T00:00:00.000Z" }
              as: Officer
              as_user_id: "anon-officer"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "response error_id == ERR_REFERENCE_NOT_FOUND"

      - name: list_supervisees_pagination_envelope
        claim_type: Listing
        grounds: [entities.Supervisee, endpoints]
        distinguishing_aspect: "GET /supervisees returns an array envelope with pagination fields total_count and has_more honoring limit."
        test_recipe:
          setup: ["A PROBATION Officer and two supervisees exist."]
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "O List", badge_number: "B-C008", role_type: "PROBATION" }
              as: CompactAdministrator
              captures: { off_id: $.data.id }
            - call: "POST /supervisees"
              payload: { full_name: "L1", docket_number: "DK-C008A", supervision_type: "PROBATION", assigned_officer_id: "${off_id}", sentence_state_code: "CA", ordered_term_months: 24, supervision_start_date: "2025-01-01T00:00:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees"
              payload: { full_name: "L2", docket_number: "DK-C008B", supervision_type: "PROBATION", assigned_officer_id: "${off_id}", sentence_state_code: "CA", ordered_term_months: 24, supervision_start_date: "2025-01-01T00:00:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
          trigger:
            - call: "GET /supervisees?limit=1&offset=0"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
              captures: { tc: $.data }
          assert:
            - "response total_count >= 2"
            - "response has_more == true"
            - "length(response data) == 1"

  # =========================================================================
  - section: state_machines
    instances:
      - name: activate_supervisee_without_adopted_assessment_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Supervisee.INTAKE_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /supervisees/{id}/activate while no RiskAssessment is ADOPTED fails the activation precondition with ERR_INVALID_STATE; supervisee stays INTAKE."
        test_recipe:
          setup: ["A PROBATION Supervisee in INTAKE with only a DRAFT (un-adopted) assessment."]
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "O Sm1", badge_number: "B-C101", role_type: "PROBATION" }
              as: CompactAdministrator
              captures: { off_id: $.data.id }
            - call: "POST /supervisees"
              payload: { full_name: "Sm1", docket_number: "DK-C101", supervision_type: "PROBATION", assigned_officer_id: "${off_id}", sentence_state_code: "CA", ordered_term_months: 24, supervision_start_date: "2025-01-01T00:00:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { sup_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments"
              payload: { domain_scores: { criminal_history: 1, education_employment: 1, financial: 1, family_marital: 1, accommodation: 1, leisure_recreation: 1, companions: 1, alcohol_drug: 1, emotional_personal: 1, attitudes_orientation: 1 } }
              as: Officer
              as_user_id: "${off_id}"
          trigger:
            - call: "POST /supervisees/${sup_id}/activate"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_INVALID_STATE"
            - "Supervisee.${sup_id}.status == INTAKE"

      - name: double_excuse_checkin_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.CheckIn.SCHEDULED_to_EXCUSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Excusing an already-EXCUSED check-in fails with ERR_INVALID_STATE — EXCUSED is terminal, no transitions out."
        test_recipe:
          setup: ["An ACTIVE PROBATION Supervisee with one EXCUSED check-in."]
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "O Sm2", badge_number: "B-C102", role_type: "PROBATION" }
              as: CompactAdministrator
              captures: { off_id: $.data.id }
            - call: "POST /supervisees"
              payload: { full_name: "Sm2", docket_number: "DK-C102", supervision_type: "PROBATION", assigned_officer_id: "${off_id}", sentence_state_code: "CA", ordered_term_months: 24, supervision_start_date: "2025-01-01T00:00:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { sup_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments"
              payload: { domain_scores: { criminal_history: 1, education_employment: 1, financial: 1, family_marital: 1, accommodation: 1, leisure_recreation: 1, companions: 1, alcohol_drug: 1, emotional_personal: 1, attitudes_orientation: 1 } }
              as: Officer
              as_user_id: "${off_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments/${ra_id}/adopt"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/activate"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/check-ins"
              payload: { scheduled_for: "2026-05-01T09:00:00.000Z", window_minutes: 60 }
              as: Officer
              as_user_id: "${off_id}"
              captures: { ci_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/check-ins/${ci_id}/excuse"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
          trigger:
            - call: "POST /supervisees/${sup_id}/check-ins/${ci_id}/excuse"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: mark_missed_before_window_close_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.CheckIn.SCHEDULED_to_MISSED, "validations[priority=13]", "errors[ERR_WINDOW_NOT_CLOSED]"]
        distinguishing_aspect: "mark-missed before the clock passes scheduled_for + window_minutes returns ERR_WINDOW_NOT_CLOSED; the check-in stays SCHEDULED."
        test_recipe:
          setup: ["An ACTIVE PROBATION Supervisee with a SCHEDULED check-in at 2026-05-05T09:00 window 60; clock at 09:30 (window not closed)."]
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "O Sm3", badge_number: "B-C103", role_type: "PROBATION" }
              as: CompactAdministrator
              captures: { off_id: $.data.id }
            - call: "POST /supervisees"
              payload: { full_name: "Sm3", docket_number: "DK-C103", supervision_type: "PROBATION", assigned_officer_id: "${off_id}", sentence_state_code: "CA", ordered_term_months: 24, supervision_start_date: "2025-01-01T00:00:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { sup_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments"
              payload: { domain_scores: { criminal_history: 1, education_employment: 1, financial: 1, family_marital: 1, accommodation: 1, leisure_recreation: 1, companions: 1, alcohol_drug: 1, emotional_personal: 1, attitudes_orientation: 1 } }
              as: Officer
              as_user_id: "${off_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments/${ra_id}/adopt"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/activate"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T08:30:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/check-ins"
              payload: { scheduled_for: "2026-05-05T09:00:00.000Z", window_minutes: 60 }
              as: Officer
              as_user_id: "${off_id}"
              captures: { ci_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T09:30:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
          trigger:
            - call: "POST /supervisees/${sup_id}/check-ins/${ci_id}/mark-missed"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_WINDOW_NOT_CLOSED"
            - "CheckIn.${ci_id}.status == SCHEDULED"

      - name: mark_missed_side_effect_files_technical_violation
        claim_type: Side Effect Execution
        grounds: [state_machines.CheckIn.SCHEDULED_to_MISSED, entities.Violation.fields.violation_class]
        distinguishing_aspect: "Marking a check-in MISSED after the window closes auto-files exactly one TECHNICAL Violation (FILED) for the supervisee, discoverable via GET violations."
        test_recipe:
          setup: ["An ACTIVE PROBATION Supervisee with a SCHEDULED check-in whose window has closed."]
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "O Sm4", badge_number: "B-C104", role_type: "PROBATION" }
              as: CompactAdministrator
              captures: { off_id: $.data.id }
            - call: "POST /supervisees"
              payload: { full_name: "Sm4", docket_number: "DK-C104", supervision_type: "PROBATION", assigned_officer_id: "${off_id}", sentence_state_code: "CA", ordered_term_months: 24, supervision_start_date: "2025-01-01T00:00:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { sup_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments"
              payload: { domain_scores: { criminal_history: 1, education_employment: 1, financial: 1, family_marital: 1, accommodation: 1, leisure_recreation: 1, companions: 1, alcohol_drug: 1, emotional_personal: 1, attitudes_orientation: 1 } }
              as: Officer
              as_user_id: "${off_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments/${ra_id}/adopt"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/activate"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-06T08:30:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/check-ins"
              payload: { scheduled_for: "2026-05-06T09:00:00.000Z", window_minutes: 60 }
              as: Officer
              as_user_id: "${off_id}"
              captures: { ci_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-06T10:30:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
          trigger:
            - call: "POST /supervisees/${sup_id}/check-ins/${ci_id}/mark-missed"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
          assert:
            - "CheckIn.${ci_id}.status == MISSED"
            - "GET /supervisees/${sup_id}/violations?status=FILED returns at least one Violation with violation_class==TECHNICAL"

      - name: revoke_cascades_conditions_to_suspended
        claim_type: Cascade down
        grounds: [state_machines.Supervisee.REVOCATION_PENDING_to_REVOKED, state_machines.SupervisionCondition.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "Revoking a supervisee (terminal) cascades all ACTIVE conditions to SUSPENDED."
        test_recipe:
          setup: ["A REVOCATION_PENDING PROBATION Supervisee with one ACTIVE condition (minimum_level_required=MINIMUM); reached via refer-revocation after 12 points are NOT needed because abscond path is used."]
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "O Sm5", badge_number: "B-C105", role_type: "PROBATION" }
              as: CompactAdministrator
              captures: { off_id: $.data.id }
            - call: "POST /supervisees"
              payload: { full_name: "Sm5", docket_number: "DK-C105", supervision_type: "PROBATION", assigned_officer_id: "${off_id}", sentence_state_code: "CA", ordered_term_months: 24, supervision_start_date: "2025-01-01T00:00:00.000Z" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { sup_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments"
              payload: { domain_scores: { criminal_history: 1, education_employment: 1, financial: 1, family_marital: 1, accommodation: 1, leisure_recreation: 1, companions: 1, alcohol_drug: 1, emotional_personal: 1, attitudes_orientation: 1 } }
              as: Officer
              as_user_id: "${off_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/risk-assessments/${ra_id}/adopt"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/activate"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/conditions"
              payload: { condition_type: "CURFEW", minimum_level_required: "ADMINISTRATIVE", description: "10pm curfew" }
              as: Officer
              as_user_id: "${off_id}"
              captures: { cond_id: $.data.id }
            - call: "POST /supervisees/${sup_id}/conditions/${cond_id}/activate"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/abscond"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
            - call: "POST /supervisees/${sup_id}/refer-revocation"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
          trigger:
            - call: "POST /supervisees/${sup_id}/revoke"
              payload: {}
              as: SupervisingJudge
              as_user_id: "judge-c5"
          assert:
            - "Supervisee.${sup_id}.status == REVOKED"
            - "SupervisionCondition.${cond_id}.status == SUSPENDED"

      - name: transfer_accept_bubbles_supervisee_to_transferred_out
