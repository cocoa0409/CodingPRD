  # ---------------------------------------------------------------------------
  # RULE 8 — resource_temporal_overlap
  # Two DIFFERENT interval semantics on two DIFFERENT resource entities:
  #   (a) ForeignSupplier audit calendar — CLOSED intervals widened by a 30-day
  #       cool-off, touching endpoints CONFLICT, pairwise (never merged);
  #   (b) QualifiedIndividual assignment calendar — HALF-OPEN windows, adjacency
  #       ALLOWED, aggregate count against concurrent_activity_capacity.
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: onsite_audit_cooloff_closed_interval_conflict_on_supplier
        grounds:
          - validations[priority=39]
          - endpoints["POST /fsvp/verification-records"]
          - entities.VerificationRecord.fields.performed_start
        distinguishing_aspect: "Resource = the ForeignSupplier's onsite-audit calendar with CLOSED intervals plus a 30-day cool-off: an existing audit performed 2026-09-12 to 2026-09-14 makes a new audit starting exactly 2026-10-14 conflict (the widened start 2026-09-14 TOUCHES the existing end, and touching closed intervals overlap), while a start of 2026-10-15 is accepted. Half-open semantics or an exclusive cool-off would wrongly accept 2026-10-14."
        test_recipe:
          setup:
            - "Importer with QIs Ada Ruiz and Ben Osei, an APPROVED supplier, pair P1 with an APPROVED hazard analysis."
            - "Two APPROVED onsite-audit activities: A1 (window 2026-09-10 to 2026-09-20, Ada) and A5 (window 2026-10-10 to 2026-10-31, Ben)."
            - "Clock 2026-09-20T00:00:00Z while the first audit record (PASS, performed 2026-09-12 to 2026-09-14) is filed on A1, then the clock moves to 2026-11-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Northbrook Foods Import LLC", dnb_number: "123456789", unique_facility_identifier: "UFI-NB-0001" }
