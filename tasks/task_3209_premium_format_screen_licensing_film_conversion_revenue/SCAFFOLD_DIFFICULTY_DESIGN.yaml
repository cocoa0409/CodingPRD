            - "Slot C confirm returns 409 with error_id == ERR_SLOT_OVERLAP — overlap of one day with slot B (or A)"

      - name: conversion_post_schedule_uses_closed_closed_with_handoff_day
        grounds:
          - errors.ERR_POST_SCHEDULE_OVERLAP
          - state_machines.ConversionOrder.SUBMITTED_to_IN_POST
        distinguishing_aspect: |
          Resource: Studio post-production capacity. Interval semantics:
          closed-closed [start, end] with a one-day handoff required between
          conversions on the same studio's films. Two conversions where one's
          end + 1 day == the other's start still conflict; different from the
          half-open auditorium-slot semantics.
        test_recipe:
          setup:
            - "Studio ACTIVE. Film F1 conversion created with window [2026-09-01, 2026-09-03] (closed-closed) and driven to IN_POST."
            - "Film F2 conversion created with window [2026-09-04, 2026-09-06] (one day gap from F1's end is INSUFFICIENT because handoff requires other's end + 1 day > this.start to NOT hold; 2026-09-04 = F1.end + 1 day means F1.end + 1 = F2.start, so F1.end + 1 > F2.start is false → no conflict; need a tighter case)."
            - "Adjust: F2 with window [2026-09-03, 2026-09-05] — F2.start == F1.end (closed-closed overlap on boundary day)."
