            - "CommitteeVote.${vote_recast_id}.superseded == false"
            - "CommitteeVote.${vote_recast_id}.sequence_no == 5"
            - "PresentationSlot.${slot_id}.counted_vote_count == 4"
            - "PresentationSlot.${slot_id}.recommend_ratio == 0.5000"
