scaffold_corner_design:
  # ============================================================ 1. Entities
  - section: entities
    instances:
      - name: employee_creation_defaults_and_immediate_read
        claim_type: creation_defaults
        grounds: [entities.Employee, "endpoints.POST_/hr-helpdesk/employees"]
        distinguishing_aspect: "Employee created with only required fields gets status ACTIVE, has_pending_dcr false, open_ticket_count 0, version 1; read-after-write is immediately consistent and created_at equals the logical-clock default."
        test_recipe:
          setup: ["empty database; logical clock at startup default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E001", full_name: "Nia New", email: "nia@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
          trigger:
            - { call: "GET /hr-helpdesk/employees/${emp_id}", as: HRServicesAdmin, as_user_id: "admin-1" }
          assert:
            - "$.data.status == ACTIVE and $.data.has_pending_dcr == false"
            - "$.data.open_ticket_count == 0 and $.data.version == 1"
            - "$.data.created_at == 2026-08-01T00:00:00Z  (logical clock default, not wall clock)"
      - name: employee_duplicate_number_rejected
        claim_type: uniqueness_constraint
        grounds: [entities.Employee.fields.employee_number, "errors[ERR_DUPLICATE_EMPLOYEE_NUMBER]"]
        distinguishing_aspect: "Second employee with the same employee_number is rejected with ERR_DUPLICATE_EMPLOYEE_NUMBER (409)."
        test_recipe:
          setup: ["employee with employee_number E002 exists"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E002", full_name: "First", email: "f@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E002", full_name: "Second", email: "s@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { err: $.data.error_id } }
          assert: ["err == ERR_DUPLICATE_EMPLOYEE_NUMBER (http 409)"]
      - name: employee_manager_fk_reverse_list
        claim_type: parent_relationship
        grounds: [entities.Employee.fields.manager_id, "endpoints.GET_/hr-helpdesk/employees"]
        distinguishing_aspect: "Self-referential manager FK is stored and reverse-reachable: GET /employees?manager_id=M returns exactly the direct reports."
        test_recipe:
          setup: ["manager M and report R with manager_id = M exist"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E003", full_name: "Maya Mgr", email: "maya@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { mgr_id: $.data.id } }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E004", full_name: "Ray Report", email: "ray@x.com", manager_id: "${mgr_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { rep_id: $.data.id } }
          trigger:
            - { call: "GET /hr-helpdesk/employees", payload: { manager_id: "${mgr_id}" }, as: HRServicesAdmin, as_user_id: "admin-1" }
          assert:
            - "response total_count == 1 and the single row id == ${rep_id}"
      - name: ticket_creation_defaults
        claim_type: creation_defaults
        grounds: [entities.Ticket, calculations.sla_deadline_calculation]
        distinguishing_aspect: "Ticket intake without priority defaults to P3, workflow NEW, sla ON_TRACK, tier T1, sensitive copied false; WALL_CLOCK 60/240 policy pins dues to 01:00/04:00 of the same day."
        test_recipe:
          setup: ["team T; category CAT routed to T; WALL_CLOCK P3 policy 60/240; employee E"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "Def Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "DEF", name: "Default Cat", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 60, resolution_minutes: 240 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E005", full_name: "Tim Ticket", email: "tim@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
          trigger:
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "q", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t_id: $.data.id } }
          assert:
            - "$.data.priority == P3 and $.data.workflow_status == NEW and $.data.sla_status == ON_TRACK and $.data.tier == T1"
            - "$.data.sensitive == false and $.data.escalation_count == 0 and $.data.reopen_count == 0"
            - "$.data.first_response_due_at == 2026-08-01T01:00:00Z and $.data.resolution_due_at == 2026-08-01T04:00:00Z"
            - "$.data.source_article_id == null (no ArticleViews exist)"
      - name: article_view_increments_view_count
        claim_type: computed_field
        grounds: [entities.KbArticle.fields.view_count, entities.ArticleView]
        distinguishing_aspect: "Each ArticleView row raises the article's computed view_count; deflection_fail_count stays 0 while no ticket links the views."
        test_recipe:
          setup: ["category CAT; article ART published (author km-1, publisher km-2); employee E"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "KBV Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "KBV", name: "KB View Cat", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/kb-articles", payload: { title: "View Me", body: "b", category_id: "${cat_id}" }, as: KnowledgeManager, as_user_id: "km-1", captures: { art_id: $.data.id } }
            - { call: "POST /hr-helpdesk/kb-articles/${art_id}/submit-review", payload: { }, as: KnowledgeManager, as_user_id: "km-1" }
            - { call: "POST /hr-helpdesk/kb-articles/${art_id}/publish", payload: { }, as: KnowledgeManager, as_user_id: "km-2" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E006", full_name: "Vic View", email: "vic@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
            - { call: "POST /hr-helpdesk/article-views", payload: { article_id: "${art_id}" }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "POST /hr-helpdesk/article-views", payload: { article_id: "${art_id}" }, as: Employee, as_user_id: "${emp_id}" }
          trigger:
            - { call: "GET /hr-helpdesk/kb-articles/${art_id}", as: KnowledgeManager, as_user_id: "km-1" }
          assert:
            - "$.data.view_count == 2 and $.data.deflection_fail_count == 0"
      - name: audit_entry_field_level_content
        claim_type: computed_field
        grounds: [entities.AuditLogEntry]
        excluded_because:
          difficulty_instance: dcr_apply_employee_mutation_cancels_sibling_dcr
          rationale: "That instance asserts the audit log's count, dcr_id and change_source after a DCR apply; field-level old/new values ride the same assertions."

  # ====================================================== 2. State machines
  - section: state_machines
    instances:
      - name: resolve_from_new_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Ticket.workflow_status, "errors[ERR_TICKET_INVALID_STATE]"]
        distinguishing_aspect: "RESOLVE from NEW (never triaged/in-progress) fails with ERR_TICKET_INVALID_STATE; no survey is created."
        test_recipe:
          setup: ["category+policy+agent+employee; ticket in NEW"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "SM1 Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "A", email: "a@x.com", tier: "T1", team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { ag_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "SM1", name: "SM1", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 60, resolution_minutes: 240 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E101", full_name: "New Ned", email: "ned@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "q", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t_id: $.data.id } }
          trigger:
            - { call: "POST /hr-helpdesk/tickets/${t_id}/resolve", payload: { resolution_summary: "nope" }, as: HelpDeskAgent, as_user_id: "${ag_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_TICKET_INVALID_STATE (http 409)"
            - "GET /hr-helpdesk/surveys?ticket_id=${t_id} total_count == 0"
      - name: cancel_from_resolved_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Ticket.workflow_status.RESOLVED, "errors[ERR_TICKET_INVALID_STATE]"]
        distinguishing_aspect: "CANCEL is only offered from NEW/TRIAGED; from RESOLVED it fails with ERR_TICKET_INVALID_STATE."
        test_recipe:
          setup: ["ticket resolved (assigned then resolved by agent A)"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "SM2 Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "A", email: "a2@x.com", tier: "T1", team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { ag_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "SM2", name: "SM2", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 60, resolution_minutes: 240 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E102", full_name: "Can Cella", email: "cella@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "q", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /hr-helpdesk/tickets/${t_id}/assign", payload: { agent_id: "${ag_id}", expected_ticket_version: "${t_v}" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "POST /hr-helpdesk/tickets/${t_id}/resolve", payload: { resolution_summary: "fixed" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
          trigger:
            - { call: "POST /hr-helpdesk/tickets/${t_id}/cancel", payload: { }, as: Employee, as_user_id: "${emp_id}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_TICKET_INVALID_STATE (http 409); ticket remains RESOLVED"]
      - name: escalate_assigns_t2_specialist_and_keeps_sla_clock
        claim_type: valid_transition_side_effects
        grounds: [state_machines.Ticket.workflow_status.TRIAGED_to_ESCALATED, calculations.sla_deadline_calculation]
        distinguishing_aspect: "Escalation bumps tier to T2, auto-assigns the team's only eligible T2 specialist, and does NOT re-anchor resolution_due_at; a second escalate on the T2 ticket fails."
        test_recipe:
          setup: ["team T with T1 agent A1 and T2 agent SP; category CAT -> T, policy 480/480; employee E; ticket triaged by A1"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "ESC Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "Tier1", email: "t1@x.com", tier: "T1", team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { a1: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "Spec", email: "sp@x.com", tier: "T2", team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { sp: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "ESC", name: "Esc Cat", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 480, resolution_minutes: 480 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E103", full_name: "Eli Esc", email: "eli@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "q", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t_id: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets/${t_id}/triage", payload: { }, as: HelpDeskAgent, as_user_id: "${a1}" }
          trigger:
            - { call: "POST /hr-helpdesk/tickets/${t_id}/escalate", payload: { reason: "needs specialist" }, as: HelpDeskAgent, as_user_id: "${a1}" }
            - { call: "POST /hr-helpdesk/tickets/${t_id}/escalate", payload: { reason: "again" }, as: HelpDeskAgent, as_user_id: "${a1}", captures: { err2: $.data.error_id } }
          assert:
            - "first escalate: workflow_status == ESCALATED, tier == T2, escalation_count == 1, assigned_agent_id == ${sp}"
            - "resolution_due_at == 2026-08-01T08:00:00Z  (SLA clock untouched by escalation)"
            - "err2 == ERR_TICKET_INVALID_STATE  (tier already T2)"
            - "GET /hr-helpdesk/tickets/${t_id}/events contains an ESCALATED event"
      - name: escalate_no_eligible_specialist
        claim_type: precondition_enforcement
        grounds: [state_machines.Ticket.workflow_status.TRIAGED_to_ESCALATED, "errors[ERR_NO_ELIGIBLE_SPECIALIST]"]
        distinguishing_aspect: "Empty selector pool (the category's team has no active T2 agent under capacity) rejects escalation with ERR_NO_ELIGIBLE_SPECIALIST and leaves the ticket TRIAGED at tier T1."
        test_recipe:
          setup: ["team T with only T1 agent A1; category CAT -> T; ticket triaged"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "NoSpec Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "Only T1", email: "o@x.com", tier: "T1", team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { a1: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "NOS", name: "No Spec", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 480, resolution_minutes: 480 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E104", full_name: "Noel Spec", email: "noel@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "q", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t_id: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets/${t_id}/triage", payload: { }, as: HelpDeskAgent, as_user_id: "${a1}" }
          trigger:
            - { call: "POST /hr-helpdesk/tickets/${t_id}/escalate", payload: { }, as: HelpDeskAgent, as_user_id: "${a1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NO_ELIGIBLE_SPECIALIST (http 422)"
            - "ticket remains TRIAGED, tier T1, assigned_agent_id == null"
      - name: kb_author_cannot_publish_and_rework_loop
        claim_type: segregation_of_duties_and_cycle
        grounds: [state_machines.KbArticle, "errors[ERR_AUTHOR_CANNOT_PUBLISH]"]
        distinguishing_aspect: "SoD: author km-1 publishing own article fails with ERR_AUTHOR_CANNOT_PUBLISH; the IN_REVIEW->DRAFT rework loop then re-review -> PUBLISHED by km-2 exercises the cycle."
        test_recipe:
          setup: ["category CAT; article authored and submitted by km-1 (IN_REVIEW)"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "KBS Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "KBS", name: "KB SoD", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/kb-articles", payload: { title: "SoD Doc", body: "b", category_id: "${cat_id}" }, as: KnowledgeManager, as_user_id: "km-1", captures: { art_id: $.data.id } }
            - { call: "POST /hr-helpdesk/kb-articles/${art_id}/submit-review", payload: { }, as: KnowledgeManager, as_user_id: "km-1" }
          trigger:
            - { call: "POST /hr-helpdesk/kb-articles/${art_id}/publish", payload: { }, as: KnowledgeManager, as_user_id: "km-1", captures: { err: $.data.error_id } }
            - { call: "POST /hr-helpdesk/kb-articles/${art_id}/return-draft", payload: { note: "needs work" }, as: KnowledgeManager, as_user_id: "km-2" }
            - { call: "POST /hr-helpdesk/kb-articles/${art_id}/submit-review", payload: { }, as: KnowledgeManager, as_user_id: "km-1" }
            - { call: "POST /hr-helpdesk/kb-articles/${art_id}/publish", payload: { }, as: KnowledgeManager, as_user_id: "km-2" }
          assert:
            - "err == ERR_AUTHOR_CANNOT_PUBLISH (http 403)"
            - "after rework loop: status == PUBLISHED, published_by_user_id == km-2, published_at == 2026-08-01T00:00:00Z"
      - name: archive_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.KbArticle, "errors[ERR_ARTICLE_INVALID_STATE]"]
        distinguishing_aspect: "ARCHIVE is only valid from PUBLISHED; archiving a DRAFT fails with ERR_ARTICLE_INVALID_STATE."
        test_recipe:
          setup: ["category CAT; article in DRAFT"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "KBA Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "KBA", name: "KB Arc", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/kb-articles", payload: { title: "Draft Doc", body: "b", category_id: "${cat_id}" }, as: KnowledgeManager, as_user_id: "km-1", captures: { art_id: $.data.id } }
          trigger:
            - { call: "POST /hr-helpdesk/kb-articles/${art_id}/archive", payload: { }, as: KnowledgeManager, as_user_id: "km-1", captures: { err: $.data.error_id } }
          assert: ["err == ERR_ARTICLE_INVALID_STATE (http 409); article remains DRAFT"]
      - name: survey_double_submit_rejected
        claim_type: invalid_transition
        grounds: [state_machines.SurveyResponse, "errors[ERR_SURVEY_INVALID_STATE]"]
        distinguishing_aspect: "A SUBMITTED survey rejects a second submit with ERR_SURVEY_INVALID_STATE (terminal-state lockdown)."
        test_recipe:
          setup: ["ticket resolved by agent A; its survey submitted once with score 4"]
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "SV Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "A", email: "sv@x.com", tier: "T1", team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { ag_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "SVY", name: "Survey Cat", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 480, resolution_minutes: 480 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E105", full_name: "Sam Survey", email: "sam@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "q", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /hr-helpdesk/tickets/${t_id}/assign", payload: { agent_id: "${ag_id}", expected_ticket_version: "${t_v}" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "POST /hr-helpdesk/tickets/${t_id}/resolve", payload: { resolution_summary: "done" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "GET /hr-helpdesk/surveys", payload: { ticket_id: "${t_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { s_id: "$.data[0].id" } }
            - { call: "POST /hr-helpdesk/surveys/${s_id}/submit", payload: { score: 4 }, as: Employee, as_user_id: "${emp_id}" }
          trigger:
            - { call: "POST /hr-helpdesk/surveys/${s_id}/submit", payload: { score: 5 }, as: Employee, as_user_id: "${emp_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SURVEY_INVALID_STATE (http 409)"
            - "SurveyResponse.${s_id}.score remains 4"
      - name: survey_expiry_on_clock_advance
