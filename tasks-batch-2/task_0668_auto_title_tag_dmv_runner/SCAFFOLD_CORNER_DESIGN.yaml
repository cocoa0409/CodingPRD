      - name: accountholder_cannot_cancel_other_accounts_transaction
        claim_type: ownership_denial
        grounds: [roles, "validations[priority=4]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "An AccountHolder whose X-User-ID is account B cancelling account A's transaction returns 403 ERR_NOT_RESOURCE_OWNER."
        test_recipe:
          setup: ["Two RETAIL accounts A and B; a DRAFT transaction on account A."]
