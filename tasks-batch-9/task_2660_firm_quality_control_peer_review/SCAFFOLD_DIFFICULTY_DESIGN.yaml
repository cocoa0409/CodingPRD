            - "InspectionFinding.${f_id}.verified_at == null"
            - "InspectionFinding.${f_id}.reopen_count == 1"
            - "Firm.${firm_id}.open_material_failure_count == 0"
            - "Firm.${firm_id}.risk_posture == STABLE"
            - "the third trigger call returns HTTP 201"
            - "RemediationPlan.${plan1_id}.state == CLOSED"
            - "RemediationPlan.${plan2_id}.state == DRAFTED"
            - "InspectionFinding.${f_id}.state == REMEDIATION_ASSIGNED"
            - "Firm.${firm_id}.open_deficiency_count == 1"

      - name: partner_open_eqr_count_is_returned_by_a_withdrawal_and_re_consumed
        grounds:
          - entities.Partner.fields.open_eqr_count
          - state_machines.EngagementQualityReview.ASSIGNED_to_WITHDRAWN
          - concurrency_rules[eqr-assign-stale-engagement]
          - errors[ERR_STALE_VERSION]
          - errors[ERR_EQR_ALREADY_ASSIGNED]
          - entities.Engagement.fields.version
        distinguishing_aspect: |
          A third conserved quantity, on Partner rather than Firm or PeerReview: open_eqr_count is the
          reviewer's held capacity. Withdrawal must give it back (1 -> 0) AND bump the engagement's
          version, so the two halves of the compensation are observable independently. Re-assigning the
          SAME reviewer with the pre-withdrawal expected_engagement_version is refused with 412
          ERR_STALE_VERSION even though the capacity is free, and the same call with the refreshed
          version succeeds and consumes the capacity again (0 -> 1). An implementation that decrements
          open_eqr_count without touching Engagement.version passes the re-assignment with the stale
          version; one that keeps the withdrawn review live returns ERR_EQR_ALREADY_ASSIGNED instead.
        test_recipe:
          setup:
            - "Firm 'Yarrow Deane LLP' with engagement partner Ines Vale, QC director Quinn Cade, managing partner Marek Doyle and EQ reviewer Odile Frey (EQ_REVIEWER, cpe_hours_last_3y 240)."
            - "Engagement 'Cinder Utilities' is driven to FIELDWORK and its version is captured BEFORE the review is assigned; it is captured again after each write that touches it."
            - "An EngagementQualityReview is ASSIGNED to Odile Frey, so her open_eqr_count reads 1."
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Yarrow Deane LLP", state_code: "CA", aa_hours_last_year: 400, peer_review_year_end: "2026-12-31" }
              as: SystemAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/partners"
              payload: { full_name: "Ines Vale", cpa_license_state: "CA", designations: ["ENGAGEMENT_PARTNER"], cpe_hours_last_3y: 200 }
              as: SystemAdmin
              captures: { p_ep1_id: $.data.id }
            - call: "POST /firms/${firm_id}/partners"
              payload: { full_name: "Quinn Cade", cpa_license_state: "CA", designations: ["QC_DIRECTOR"], cpe_hours_last_3y: 200 }
              as: SystemAdmin
              captures: { p_qc_id: $.data.id }
            - call: "POST /firms/${firm_id}/partners"
              payload: { full_name: "Marek Doyle", cpa_license_state: "CA", designations: ["MANAGING_PARTNER"], cpe_hours_last_3y: 200 }
              as: SystemAdmin
              captures: { p_own_id: $.data.id }
            - call: "POST /firms/${firm_id}/partners"
              payload: { full_name: "Odile Frey", cpa_license_state: "CA", designations: ["EQ_REVIEWER"], cpe_hours_last_3y: 240 }
              as: SystemAdmin
              captures: { p_rev_id: $.data.id }
            - call: "POST /engagements"
              payload: { firm_id: "${firm_id}", client_name: "Cinder Utilities", engagement_type: "AUDIT", period_end: "2026-06-30", engagement_partner_id: "${p_ep1_id}", is_public_interest: false }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /engagements/${e1_id}/workflow-transitions"
              payload: { to_state: "FIELDWORK" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
              captures: { e1_v1: $.data.version }
            - call: "POST /engagements/${e1_id}/quality-reviews"
              payload: { reviewer_partner_id: "${p_rev_id}", objectivity_attested: true, expected_engagement_version: "${e1_v1}" }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
              captures: { eqr_a_id: $.data.id }
            - call: "GET /engagements/${e1_id}"
              payload: {}
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
              captures: { e1_v2: $.data.version }
          trigger:
            - call: "POST /quality-reviews/${eqr_a_id}/transitions"
              payload: { to_state: "WITHDRAWN" }
              as: FirmManagingPartner
              as_user_id: "${p_own_id}"
            - call: "POST /engagements/${e1_id}/quality-reviews"
              payload: { reviewer_partner_id: "${p_rev_id}", objectivity_attested: true, expected_engagement_version: "${e1_v2}" }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
              captures: { stale_error: $.data.error_id }
            - call: "GET /engagements/${e1_id}"
              payload: {}
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
              captures: { e1_v3: $.data.version }
            - call: "POST /engagements/${e1_id}/quality-reviews"
              payload: { reviewer_partner_id: "${p_rev_id}", objectivity_attested: true, expected_engagement_version: "${e1_v3}" }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
              captures: { eqr_b_id: $.data.id }
          assert:
            - "the first trigger call returns HTTP 200"
            - "EngagementQualityReview.${eqr_a_id}.state == WITHDRAWN"
            - "after the first trigger call Partner.${p_rev_id}.open_eqr_count == 0"
            - "the second trigger call returns HTTP 412 with error_id ERR_STALE_VERSION"
            - "the fourth trigger call returns HTTP 201"
            - "EngagementQualityReview.${eqr_b_id}.state == ASSIGNED"
            - "EngagementQualityReview.${eqr_b_id}.reviewer_partner_id == ${p_rev_id}"
            - "Partner.${p_rev_id}.open_eqr_count == 1"
            - "Engagement.${e1_id}.workflow_state == FIELDWORK"
