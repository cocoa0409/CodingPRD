# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules × 2 instances = 18 instances. Grounds resolve into
# SCAFFOLD.yaml §1.1–§1.7. All formula-derived asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: sale_total_quoted_vs_finalized_rounding
        grounds:
          - calculations.sale_ticket_total
          - entities.SaleTicket.fields.quoted_total_cents
          - entities.SaleTicket.fields.final_total_cents
          - state_machines.SaleTicket.UNRECONCILED_to_RECONCILED
        distinguishing_aspect: |
          On the SAME single-cup ticket (net 7.3 oz, 55c/oz, 10% seasonal promo),
          the QUOTED variant (discount per line then round → 361) differs from the
          FINALIZED variant (round base then discount the sum → 362); this dual
          variant lives on the SaleTicket domain.
        test_recipe:
          setup:
            - "Clock at default 2026-03-01T00:00:00Z; a 10% seasonal promo active; one machine, one flavor at 55c/oz; a single-line ticket charged then reconciled."
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000, initial_mix_oz: 1000 }
              as: Manager
              captures: { m_id: $.data.id }
            - call: "POST /flavors"
              payload: { machine_id: "${m_id}", name: "Tart", price_per_oz_cents: 55, cost_per_oz_cents: 20 }
              as: ShiftLead
              captures: { f_id: $.data.id }
            - call: "POST /seasonal-promotions"
              payload: { name: "Promo10", discount_pct: 0.10, starts_at: "2026-03-01T00:00:00Z", ends_at: "2026-03-02T00:00:00Z" }
              as: Manager
            - call: "POST /sale-tickets"
              payload: {}
              as: Cashier
              captures: { t_id: $.data.id }
            - call: "POST /sale-tickets/${t_id}/lines"
              payload: { flavor_id: "${f_id}", gross_weight_oz: 7.3 }
              as: Cashier
            - call: "POST /sale-tickets/${t_id}/checkout"
              payload: {}
              as: Cashier
            - call: "POST /daily-reconciliations"
              payload: { business_date: "2026-03-01" }
              as: Manager
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /daily-reconciliations/${rec_id}/close"
              payload: { counted_cash_cents: 362 }
              as: Manager
          assert:
            - "SaleTicket.${t_id}.quoted_total_cents == 361"
            - "SaleTicket.${t_id}.final_total_cents == 362"
            - "SaleTicket.${t_id}.reconciliation_status == RECONCILED"

      - name: waste_cogs_vs_retail_valuation
        grounds:
          - calculations.waste_valuation
          - entities.WasteEvent.fields.cogs_value_cents
          - entities.WasteEvent.fields.retail_value_cents
        distinguishing_aspect: |
          The SAME 12.0 oz mix melt is valued at cost basis (12*20 = 240c) and at
          retail basis (12*55 = 660c) — two valid approaches, different numbers, on
          the WasteEvent domain (distinct from the SaleTicket dual variant).
        test_recipe:
          setup:
            - "One machine and a flavor priced 55c/oz retail, 20c/oz cost; a 12.0 oz mix melt logged."
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000 }
              as: Manager
              captures: { m_id: $.data.id }
            - call: "POST /flavors"
              payload: { machine_id: "${m_id}", name: "Tart", price_per_oz_cents: 55, cost_per_oz_cents: 20 }
              as: ShiftLead
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /waste-events"
              payload: { machine_id: "${m_id}", flavor_id: "${f_id}", waste_weight_oz: 12.0, reason: "MELT" }
              as: ShiftLead
              captures: { w_id: $.data.id }
          assert:
            - "WasteEvent.${w_id}.cogs_value_cents == 240"
            - "WasteEvent.${w_id}.retail_value_cents == 660"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: sale_total_floor_nonlinear_multiinput
        grounds:
          - calculations.sale_ticket_total
          - entities.SaleTicket.fields.quoted_total_cents
          - validations[priority=8]
        distinguishing_aspect: |
          Mode (a): quoted_total combines >=3 inputs (net weight, price/oz, a topping
          surcharge, 10% promo) under a non-linear max() floor — a tiny 0.5 oz cup
          computes to 55c but is clamped up to MIN_TICKET_CHARGE_CENTS=100.
        test_recipe:
          setup:
            - "10% promo active; flavor 55c/oz; topping surcharge 30c; a 0.5 oz net cup (gross 1.0, tare 0.5) with that topping."
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000, initial_mix_oz: 1000 }
              as: Manager
              captures: { m_id: $.data.id }
            - call: "POST /flavors"
              payload: { machine_id: "${m_id}", name: "Tart", price_per_oz_cents: 55, cost_per_oz_cents: 20 }
              as: ShiftLead
              captures: { f_id: $.data.id }
            - call: "POST /toppings"
              payload: { name: "Mochi", surcharge_cents: 30, initial_units: 50 }
              as: ShiftLead
              captures: { top_id: $.data.id }
            - call: "POST /seasonal-promotions"
              payload: { name: "Promo10", discount_pct: 0.10, starts_at: "2026-03-01T00:00:00Z", ends_at: "2026-03-02T00:00:00Z" }
              as: Manager
            - call: "POST /sale-tickets"
              payload: {}
              as: Cashier
              captures: { t_id: $.data.id }
            - call: "POST /sale-tickets/${t_id}/lines"
              payload: { flavor_id: "${f_id}", gross_weight_oz: 1.0, container_tare_oz: 0.5, topping_ids: ["${top_id}"] }
              as: Cashier
          trigger:
            - call: "POST /sale-tickets/${t_id}/checkout"
              payload: {}
              as: Cashier
          assert:
            - "SaleTicket.${t_id}.quoted_total_cents == 100"

      - name: catering_invoice_round_per_line_then_sum
        grounds:
          - calculations.catering_invoice_total
          - entities.CateringOrder.fields.invoice_total_cents
          - entities.CateringOrder.fields.required_deposit_cents
          - state_machines.CateringOrder.DRAFT_to_QUOTED
        distinguishing_aspect: |
          Mode (b): two identical lines each raw 100.4c round per-line to 100 → sum 200;
          the pinned round-per-line-then-sum order yields 200, whereas sum-then-round
          (200.8 → 201) would differ by 1c.
        test_recipe:
          setup:
            - "A catering resource; a DRAFT order with two line items {qty 1, unit_price 251c, discount 0.60}."
          setup_api_calls:
            - call: "POST /catering-resources"
              payload: { name: "Cart-1" }
              as: Manager
              captures: { r_id: $.data.id }
            - call: "POST /catering-orders"
              payload: { resource_id: "${r_id}", event_start: "2026-03-10T10:00:00Z", event_end: "2026-03-10T12:00:00Z", guest_count: 10, line_items: [ { qty: 1, unit_price_cents: 251, discount_pct: 0.60 }, { qty: 1, unit_price_cents: 251, discount_pct: 0.60 } ] }
              as: Cashier
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /catering-orders/${o_id}/quote"
              payload: {}
              as: Manager
          assert:
            - "CateringOrder.${o_id}.invoice_total_cents == 200"
            - "CateringOrder.${o_id}.required_deposit_cents == 50"
            - "CateringOrder.${o_id}.status == QUOTED"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: machine_cyclic_ready_cleaning_ready
        grounds:
          - state_machines.Machine.READY_to_CLEANING
          - state_machines.Machine.CLEANING_to_READY
          - entities.Machine.fields.sanitation_status
          - entities.SanitationLog.fields.machine_id
        distinguishing_aspect: |
          Machine cycles READY → CLEANING → READY (a true loop back to the initial
          state, not a linear pipeline); completing the cycle appends one SanitationLog.
        test_recipe:
          setup:
            - "One machine created READY."
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000 }
              as: Manager
              captures: { m_id: $.data.id }
            - call: "POST /machines/${m_id}/start-cleaning"
              payload: {}
              as: ShiftLead
          trigger:
            - call: "POST /machines/${m_id}/complete-cleaning"
              payload: {}
              as: ShiftLead
          assert:
            - "Machine.${m_id}.sanitation_status == READY"
            - "GET /sanitation-logs?machine_id=${m_id} returns exactly 1 entry"

      - name: sale_ticket_parallel_payment_reconciliation
        grounds:
          - state_machines.SaleTicket.OPEN_to_CHARGED
          - state_machines.SaleTicket.UNRECONCILED_to_RECONCILED
          - entities.SaleTicket.fields.payment_status
          - entities.SaleTicket.fields.reconciliation_status
        distinguishing_aspect: |
          SaleTicket carries two independent axes: payment_status stays CHARGED while
          reconciliation_status advances UNRECONCILED → RECONCILED at close — parallel
          dimensions on one entity (distinct from the Machine cycle).
        test_recipe:
          setup:
            - "A charged single-line ticket, then a reconciliation is closed."
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000, initial_mix_oz: 1000 }
              as: Manager
              captures: { m_id: $.data.id }
            - call: "POST /flavors"
              payload: { machine_id: "${m_id}", name: "Tart", price_per_oz_cents: 55, cost_per_oz_cents: 20 }
              as: ShiftLead
              captures: { f_id: $.data.id }
            - call: "POST /sale-tickets"
              payload: {}
              as: Cashier
              captures: { t_id: $.data.id }
            - call: "POST /sale-tickets/${t_id}/lines"
              payload: { flavor_id: "${f_id}", gross_weight_oz: 7.3 }
              as: Cashier
            - call: "POST /sale-tickets/${t_id}/checkout"
              payload: {}
              as: Cashier
            - call: "POST /daily-reconciliations"
              payload: { business_date: "2026-03-01" }
              as: Manager
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /daily-reconciliations/${rec_id}/close"
              payload: { counted_cash_cents: 402 }
              as: Manager
          assert:
            - "SaleTicket.${t_id}.payment_status == CHARGED"
            - "SaleTicket.${t_id}.reconciliation_status == RECONCILED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: recon_close_ticket_loyalty_voucher
        grounds:
          - state_machines.DailyReconciliation.OPEN_to_CLOSED
          - state_machines.SaleTicket.UNRECONCILED_to_RECONCILED
          - calculations.loyalty_finalization
          - entities.RewardVoucher.fields.status
          - entities.LoyaltyAccount.fields.punch_count
        distinguishing_aspect: |
          Depth-3 chain: reconciliation close (A) reconciles the ticket (B); the
          ticket's finalization increments the LoyaltyAccount punch_count from 9 to 10,
          which crosses PUNCH_THRESHOLD and issues a RewardVoucher (C). Each hop is
          caused by the previous one.
        test_recipe:
          setup:
            - "A loyalty account seeded at punch_count 9; a charged single-line ticket attached to it; a reconciliation opened."
          setup_api_calls:
            - call: "POST /loyalty-accounts"
              payload: { member_name: "Ada", initial_punch_count: 9 }
              as: Cashier
              captures: { la_id: $.data.id }
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000, initial_mix_oz: 1000 }
              as: Manager
              captures: { m_id: $.data.id }
            - call: "POST /flavors"
              payload: { machine_id: "${m_id}", name: "Tart", price_per_oz_cents: 55, cost_per_oz_cents: 20 }
              as: ShiftLead
              captures: { f_id: $.data.id }
            - call: "POST /sale-tickets"
              payload: { loyalty_account_id: "${la_id}" }
              as: Cashier
              captures: { t_id: $.data.id }
            - call: "POST /sale-tickets/${t_id}/lines"
              payload: { flavor_id: "${f_id}", gross_weight_oz: 7.3 }
              as: Cashier
            - call: "POST /sale-tickets/${t_id}/checkout"
              payload: {}
              as: Cashier
            - call: "POST /daily-reconciliations"
              payload: { business_date: "2026-03-01" }
              as: Manager
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /daily-reconciliations/${rec_id}/close"
              payload: { counted_cash_cents: 402 }
              as: Manager
          assert:
            - "SaleTicket.${t_id}.reconciliation_status == RECONCILED"
            - "LoyaltyAccount.${la_id}.punch_count == 0"
            - "LoyaltyAccount.${la_id}.points_lifetime == 4"
            - "LoyaltyAccount.${la_id}.points_provisional == 0"
            - "GET /reward-vouchers?loyalty_account_id=${la_id} returns exactly 1 voucher with status ISSUED and value_cents 500"

      - name: machine_oos_suspends_flavors
        grounds:
          - state_machines.Machine.READY_to_OUT_OF_SERVICE
          - state_machines.Flavor.LOADED_to_SUSPENDED
          - entities.Flavor.fields.status
          - calculations.sale_ticket_total
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (sanitation cadence): a machine going
          READY → OUT_OF_SERVICE (A) cascades every LOADED flavor on it to SUSPENDED (B).
        test_recipe:
          setup:
            - "Machine created at clock 00:00 with two LOADED flavors; clock advanced 5h past the 4h cleaning cadence."
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000 }
              as: Manager
              captures: { m_id: $.data.id }
            - call: "POST /flavors"
              payload: { machine_id: "${m_id}", name: "Tart", price_per_oz_cents: 55, cost_per_oz_cents: 20 }
              as: ShiftLead
              captures: { f1_id: $.data.id }
            - call: "POST /flavors"
              payload: { machine_id: "${m_id}", name: "Vanilla", price_per_oz_cents: 55, cost_per_oz_cents: 20 }
              as: ShiftLead
              captures: { f2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T05:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /machines/${m_id}/check-sanitation"
              payload: {}
              as: ShiftLead
          assert:
            - "Machine.${m_id}.sanitation_status == OUT_OF_SERVICE"
            - "Flavor.${f1_id}.status == SUSPENDED"
            - "Flavor.${f2_id}.status == SUSPENDED"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: catering_confirm_state_beats_deposit_fiscal
        grounds:
          - validations[priority=4]
          - validations[priority=11]
          - errors[ERR_CATERING_INVALID_STATE]
          - errors[ERR_DEPOSIT_INSUFFICIENT]
        distinguishing_aspect: |
          Confirming a DRAFT (not QUOTED) order with deposit_paid_cents=0 violates both
          the state precondition (priority 4, category state) and the deposit rule
          (priority 11, category business_fiscal); the state error wins.
        test_recipe:
          setup:
            - "A catering resource and a DRAFT (un-quoted) catering order."
          setup_api_calls:
            - call: "POST /catering-resources"
              payload: { name: "Cart-1" }
              as: Manager
              captures: { r_id: $.data.id }
            - call: "POST /catering-orders"
              payload: { resource_id: "${r_id}", event_start: "2026-03-10T10:00:00Z", event_end: "2026-03-10T12:00:00Z", guest_count: 10, line_items: [ { qty: 1, unit_price_cents: 1000, discount_pct: 0 } ] }
              as: Cashier
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /catering-orders/${o_id}/confirm"
              payload: { deposit_paid_cents: 0 }
              as: Manager
          assert:
            - "response error_id == ERR_CATERING_INVALID_STATE"
            - "CateringOrder.${o_id}.status == DRAFT"

      - name: addline_allergen_safety_beats_topping_constraint
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_ALLERGEN_CONFLICT]
          - errors[ERR_TOPPING_UNAVAILABLE]
          - entities.SaleTicket.fields.excluded_allergens
        distinguishing_aspect: |
          Adding a cup whose topping is BOTH allergen-conflicting (excluded NUTS,
          topping tagged NUTS — priority 5, category business_safety) AND ROTATED_OUT
          (priority 7, category business_constraint) returns the safety error.
        test_recipe:
          setup:
            - "A READY machine and LOADED flavor; a NUTS-tagged topping that is rotated out; a ticket excluding NUTS."
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000, initial_mix_oz: 1000 }
              as: Manager
              captures: { m_id: $.data.id }
            - call: "POST /flavors"
              payload: { machine_id: "${m_id}", name: "Tart", price_per_oz_cents: 55, cost_per_oz_cents: 20 }
              as: ShiftLead
              captures: { f_id: $.data.id }
            - call: "POST /toppings"
              payload: { name: "Peanuts", surcharge_cents: 40, initial_units: 50, allergen_tags: ["NUTS"] }
              as: ShiftLead
              captures: { top_id: $.data.id }
            - call: "POST /toppings/${top_id}/rotate-out"
              payload: {}
              as: ShiftLead
            - call: "POST /sale-tickets"
              payload: { excluded_allergens: ["NUTS"] }
              as: Cashier
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /sale-tickets/${t_id}/lines"
              payload: { flavor_id: "${f_id}", gross_weight_oz: 5.0, topping_ids: ["${top_id}"] }
              as: Cashier
          assert:
            - "response error_id == ERR_ALLERGEN_CONFLICT"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: sale_line_net_weight_strictly_positive
        grounds:
          - validations[priority=8]
          - entities.SaleLine.fields.net_weight_oz
          - errors[ERR_INVALID_WEIGHT]
        distinguishing_aspect: |
          Boundary on the weight metric at the /sale-tickets/{id}/lines endpoint:
          gross 2.0 minus tare 2.0 = net 0.0, which is NOT strictly > 0 and is rejected.
        test_recipe:
          setup:
            - "A READY machine, a LOADED flavor, an OPEN ticket."
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000, initial_mix_oz: 1000 }
              as: Manager
              captures: { m_id: $.data.id }
            - call: "POST /flavors"
              payload: { machine_id: "${m_id}", name: "Tart", price_per_oz_cents: 55, cost_per_oz_cents: 20 }
              as: ShiftLead
              captures: { f_id: $.data.id }
            - call: "POST /sale-tickets"
              payload: {}
              as: Cashier
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /sale-tickets/${t_id}/lines"
              payload: { flavor_id: "${f_id}", gross_weight_oz: 2.0, container_tare_oz: 2.0 }
              as: Cashier
          assert:
            - "response error_id == ERR_INVALID_WEIGHT"

      - name: sanitation_cadence_inclusive_boundary
        grounds:
          - state_machines.Machine.READY_to_OUT_OF_SERVICE
          - entities.Machine.fields.last_cleaned_at
          - entities.Machine.fields.sanitation_status
        distinguishing_aspect: |
          Boundary on the time metric at the /machines/{id}/check-sanitation endpoint:
          at exactly last_cleaned_at + 4h (clock 04:00:00, inclusive >=) the machine
          flips READY → OUT_OF_SERVICE.
        test_recipe:
          setup:
            - "Machine created at clock 00:00 (last_cleaned_at=00:00); clock advanced to exactly 04:00:00."
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000 }
              as: Manager
              captures: { m_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T04:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /machines/${m_id}/check-sanitation"
              payload: {}
              as: ShiftLead
          assert:
            - "Machine.${m_id}.sanitation_status == OUT_OF_SERVICE"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: addline_requires_machine_ready
        grounds:
          - validations[priority=6]
          - state_machines.Machine.READY_to_OUT_OF_SERVICE
          - entities.SaleLine.fields.flavor_id
          - errors[ERR_MACHINE_NOT_READY]
        distinguishing_aspect: |
          A SaleLine add depends on the Machine (via flavor.machine_id): with the
          machine driven OUT_OF_SERVICE, dispensing is rejected — the SaleLine↔Machine pair.
        test_recipe:
          setup:
            - "Machine created at 00:00 with a flavor; clock advanced to 05:00 and check-sanitation run so the machine is OUT_OF_SERVICE; an OPEN ticket."
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000, initial_mix_oz: 1000 }
              as: Manager
              captures: { m_id: $.data.id }
            - call: "POST /flavors"
              payload: { machine_id: "${m_id}", name: "Tart", price_per_oz_cents: 55, cost_per_oz_cents: 20 }
              as: ShiftLead
              captures: { f_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T05:00:00Z" }
              as: Manager
            - call: "POST /machines/${m_id}/check-sanitation"
              payload: {}
              as: ShiftLead
            - call: "POST /sale-tickets"
              payload: {}
              as: Cashier
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /sale-tickets/${t_id}/lines"
              payload: { flavor_id: "${f_id}", gross_weight_oz: 5.0 }
              as: Cashier
          assert:
            - "response error_id == ERR_MACHINE_NOT_READY"

      - name: checkout_requires_loyalty_active
        grounds:
          - state_machines.SaleTicket.OPEN_to_CHARGED
          - state_machines.LoyaltyAccount.ACTIVE_to_SUSPENDED
          - entities.SaleTicket.fields.loyalty_account_id
          - errors[ERR_LOYALTY_ACCOUNT_SUSPENDED]
        distinguishing_aspect: |
          A ticket checkout depends on its attached LoyaltyAccount's state: a SUSPENDED
          account blocks checkout — the SaleTicket↔LoyaltyAccount pair (different from
          the SaleLine↔Machine pair).
        test_recipe:
          setup:
            - "A ticket with a valid line attached to a loyalty account that is then suspended."
          setup_api_calls:
            - call: "POST /loyalty-accounts"
              payload: { member_name: "Ada" }
              as: Cashier
              captures: { la_id: $.data.id }
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000, initial_mix_oz: 1000 }
              as: Manager
              captures: { m_id: $.data.id }
            - call: "POST /flavors"
              payload: { machine_id: "${m_id}", name: "Tart", price_per_oz_cents: 55, cost_per_oz_cents: 20 }
              as: ShiftLead
              captures: { f_id: $.data.id }
            - call: "POST /sale-tickets"
              payload: { loyalty_account_id: "${la_id}" }
              as: Cashier
              captures: { t_id: $.data.id }
            - call: "POST /sale-tickets/${t_id}/lines"
              payload: { flavor_id: "${f_id}", gross_weight_oz: 7.3 }
              as: Cashier
            - call: "POST /loyalty-accounts/${la_id}/suspend"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /sale-tickets/${t_id}/checkout"
              payload: {}
              as: Cashier
          assert:
            - "response error_id == ERR_LOYALTY_ACCOUNT_SUSPENDED"
            - "SaleTicket.${t_id}.payment_status == OPEN"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: catering_halfopen_overlap_rejected
        grounds:
          - validations[priority=9]
          - state_machines.CateringOrder.QUOTED_to_CONFIRMED
          - entities.CateringOrder.fields.event_start
          - errors[ERR_RESOURCE_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Half-open [event_start, event_end) overlap on a CateringResource: a second
          confirm over [11:00,13:00) collides with a CONFIRMED [10:00,12:00) booking.
        test_recipe:
          setup:
            - "One resource; order1 [10:00,12:00) quoted and CONFIRMED with sufficient deposit; order2 [11:00,13:00) quoted."
          setup_api_calls:
            - call: "POST /catering-resources"
              payload: { name: "Cart-1" }
              as: Manager
              captures: { r_id: $.data.id }
            - call: "POST /catering-orders"
              payload: { resource_id: "${r_id}", event_start: "2026-03-02T10:00:00Z", event_end: "2026-03-02T12:00:00Z", guest_count: 20, line_items: [ { qty: 1, unit_price_cents: 1000, discount_pct: 0 } ] }
              as: Cashier
              captures: { o1_id: $.data.id }
            - call: "POST /catering-orders/${o1_id}/quote"
              payload: {}
              as: Manager
            - call: "POST /catering-orders/${o1_id}/confirm"
              payload: { deposit_paid_cents: 250 }
              as: Manager
            - call: "POST /catering-orders"
              payload: { resource_id: "${r_id}", event_start: "2026-03-02T11:00:00Z", event_end: "2026-03-02T13:00:00Z", guest_count: 20, line_items: [ { qty: 1, unit_price_cents: 1000, discount_pct: 0 } ] }
              as: Cashier
              captures: { o2_id: $.data.id }
            - call: "POST /catering-orders/${o2_id}/quote"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /catering-orders/${o2_id}/confirm"
              payload: { deposit_paid_cents: 250 }
              as: Manager
          assert:
            - "response error_id == ERR_RESOURCE_DOUBLE_BOOKED"
            - "CateringOrder.${o2_id}.status == QUOTED"

      - name: maintenance_buffer_overlap_rejected
        grounds:
          - validations[priority=10]
          - entities.MaintenanceWindow.fields.window_start
          - concurrency_rules[maintenance-window-create-stale-machine]
          - errors[ERR_MAINTENANCE_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Closed-interval-plus-buffer overlap on a Machine: a window [11:15,12:00) sits
          only 15 min after a SCHEDULED [10:00,11:00) window — inside the 30-min buffer —
          so it is rejected (different interval semantics than the half-open catering rule).
        test_recipe:
          setup:
            - "A machine (version captured); window1 [10:00,11:00) scheduled with the matching version; the machine's new version re-read."
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000 }
              as: Manager
              captures: { m_id: $.data.id, m_v1: $.data.version }
            - call: "POST /maintenance-windows"
              payload: { machine_id: "${m_id}", window_start: "2026-03-05T10:00:00Z", window_end: "2026-03-05T11:00:00Z", expected_machine_version: "${m_v1}" }
              as: ShiftLead
            - call: "GET /machines/${m_id}"
              payload: {}
              as: ShiftLead
              captures: { m_v2: $.data.version }
          trigger:
            - call: "POST /maintenance-windows"
              payload: { machine_id: "${m_id}", window_start: "2026-03-05T11:15:00Z", window_end: "2026-03-05T12:00:00Z", expected_machine_version: "${m_v2}" }
              as: ShiftLead
          assert:
            - "response error_id == ERR_MAINTENANCE_WINDOW_CONFLICT"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: void_conserves_topping_units
        grounds:
          - state_machines.SaleTicket.CHARGED_to_VOIDED
          - entities.Topping.fields.on_hand_units
          - calculations.sale_ticket_total
        distinguishing_aspect: |
          Conserved quantity = topping on_hand_units: a cup consumes 1 unit (50→49) at
          add-line; voiding the charged ticket restores it to exactly 50 — no drift.
        test_recipe:
          setup:
            - "A topping with 50 units; a ticket with one cup using that topping, charged."
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000, initial_mix_oz: 1000 }
              as: Manager
              captures: { m_id: $.data.id }
            - call: "POST /flavors"
              payload: { machine_id: "${m_id}", name: "Tart", price_per_oz_cents: 55, cost_per_oz_cents: 20 }
              as: ShiftLead
              captures: { f_id: $.data.id }
            - call: "POST /toppings"
              payload: { name: "Mochi", surcharge_cents: 30, initial_units: 50 }
              as: ShiftLead
              captures: { top_id: $.data.id }
            - call: "POST /sale-tickets"
              payload: {}
              as: Cashier
              captures: { t_id: $.data.id }
            - call: "POST /sale-tickets/${t_id}/lines"
              payload: { flavor_id: "${f_id}", gross_weight_oz: 7.3, topping_ids: ["${top_id}"] }
              as: Cashier
            - call: "POST /sale-tickets/${t_id}/checkout"
              payload: {}
              as: Cashier
          trigger:
            - call: "POST /sale-tickets/${t_id}/void"
              payload: {}
              as: ShiftLead
          assert:
            - "Topping.${top_id}.on_hand_units == 50"
            - "SaleTicket.${t_id}.payment_status == VOIDED"

      - name: void_conserves_provisional_points
        grounds:
          - state_machines.SaleTicket.CHARGED_to_VOIDED
          - entities.LoyaltyAccount.fields.points_provisional
          - calculations.loyalty_finalization
        distinguishing_aspect: |
          Conserved quantity = provisional loyalty points: checkout accrues 4 provisional
          points (floor(402/100)); voiding reverses them so points_provisional returns to 0
          (a different conserved quantity than topping units).
        test_recipe:
          setup:
            - "A loyalty account at 0 provisional points; a charged single-line ticket (quoted 402c) attached to it."
          setup_api_calls:
            - call: "POST /loyalty-accounts"
              payload: { member_name: "Ada" }
              as: Cashier
              captures: { la_id: $.data.id }
            - call: "POST /machines"
              payload: { name: "Barrel-A", mix_par_oz: 1000, initial_mix_oz: 1000 }
              as: Manager
              captures: { m_id: $.data.id }
            - call: "POST /flavors"
              payload: { machine_id: "${m_id}", name: "Tart", price_per_oz_cents: 55, cost_per_oz_cents: 20 }
              as: ShiftLead
              captures: { f_id: $.data.id }
            - call: "POST /sale-tickets"
              payload: { loyalty_account_id: "${la_id}" }
              as: Cashier
              captures: { t_id: $.data.id }
            - call: "POST /sale-tickets/${t_id}/lines"
              payload: { flavor_id: "${f_id}", gross_weight_oz: 7.3 }
              as: Cashier
            - call: "POST /sale-tickets/${t_id}/checkout"
              payload: {}
              as: Cashier
          trigger:
            - call: "POST /sale-tickets/${t_id}/void"
              payload: {}
              as: ShiftLead
          assert:
            - "LoyaltyAccount.${la_id}.points_provisional == 0"
            - "SaleTicket.${t_id}.payment_status == VOIDED"
