      - name: caller_identity_and_reviewer_identity_violations_are_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ANALYST_IDENTITY_MISMATCH]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - validations[priority=6]
          - state_machines.ExaminationRequest[TECH_REVIEW->ADMIN_REVIEW]
          - rbac
        distinguishing_aspect: "Identity is enforced on two different axes with two different codes and two different statuses: acting as somebody else's Analyst row is a 403 identity mismatch (bench work and proficiency submission alike), while acting as the wrong person for a review step is a 409 segregation-of-duties violation. Both clauses of the segregation rule are exercised - the assigned analyst cannot technically review their own work, and the operator who signed the technical review cannot also sign the administrative release of the same revision_round even though the role is different."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Analyst A1 (bench): BIOLOGY, competency 4, capacity 40.00, training 8.00. Analyst A2 (peer): BIOLOGY, competency 5, capacity 40.00, training 8.00."
            - "Method M1 VALIDATED BIOLOGY, standard_hours_per_item 4.00, min_competency_level 3."
            - "Case C1 (OTHER -> P3_ROUTINE) ACCEPTED with BIOLOGICAL item E1; request R1 (item_count 1 -> 4.00 h) assigned to A1."
            - "ProficiencyTest PT1 belongs to A1 and is left ASSIGNED."
            - "The X-User-ID used for CaseManager calls is the opaque operator string operator-cm-01 except where the recipe deliberately reuses A2's id."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/analysts"
              payload: { full_name: "Identity Bench Examiner", disciplines: ["BIOLOGY"], competency_level: 4, weekly_capacity_hours: 40.00, training_hours_per_week: 8.00 }
              as: LabDirector
              captures: { a1: $.data.id }
            - call: "POST /lab/analysts"
              payload: { full_name: "Identity Peer Examiner", disciplines: ["BIOLOGY"], competency_level: 5, weekly_capacity_hours: 40.00, training_hours_per_week: 8.00 }
              as: LabDirector
              captures: { a2: $.data.id }
            - call: "POST /lab/methods"
              payload: { name: "Y-STR Typing", discipline: "BIOLOGY", standard_hours_per_item: 4.00, min_competency_level: 3, max_items_per_request: 6, accreditation_scope_code: "BIO-YST-01" }
              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 20, precision_cv_pct: 2.00, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/proficiency-tests"
              payload: { analyst_id: "${a1}", method_id: "${m1}", test_cycle: "2026-C1", due_utc: "2026-08-15T00:00:00Z" }
              as: QualityManager
              captures: { pt1: $.data.id }
            - call: "POST /lab/cases"
              payload: { agency_case_number: "O-2026-0507", submitting_agency: "METRO PD", offense_category: "OTHER" }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Sealed swab", item_type: "BIOLOGICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e1: $.data.id }
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e1}", method_id: "${m1}", item_count: 1 }
              as: CaseManager
              as_user_id: "operator-cm-01"
              captures: { r1: $.data.id, r1_v: $.data.version }
            - call: "POST /lab/examination-requests/${r1}/assignments"
              payload: { analyst_id: "${a1}", expected_examination_request_version: "${r1_v}", assignment_reason: "MANUAL" }
              as: CaseManager
              as_user_id: "operator-cm-01"
          trigger:
            - call: "POST /lab/examination-requests/${r1}/start-analysis"
              payload: {}
              as: Analyst
              as_user_id: "${a2}"
              captures: { e_start_identity: $.data.error_id }
            - call: "POST /lab/examination-requests/${r1}/start-analysis"
              payload: {}
              as: Analyst
              as_user_id: "${a1}"
            - call: "POST /lab/examination-requests/${r1}/complete-analysis"
              payload: { actual_hours: 4.00 }
              as: Analyst
              as_user_id: "${a2}"
              captures: { e_complete_identity: $.data.error_id }
            - call: "POST /lab/examination-requests/${r1}/complete-analysis"
              payload: { actual_hours: 4.00 }
              as: Analyst
              as_user_id: "${a1}"
            - call: "POST /lab/examination-requests/${r1}/technical-review"
              payload: { decision: "AGREE", rationale: "Self review attempt" }
              as: Analyst
              as_user_id: "${a1}"
              captures: { e_self_review: $.data.error_id }
            - call: "POST /lab/examination-requests/${r1}/technical-review"
              payload: { decision: "AGREE", rationale: "Independent verification of the profile" }
              as: Analyst
              as_user_id: "${a2}"
              captures: { rr_tech: $.data.id, rr_reviewer: $.data.reviewer_analyst_id }
            - call: "POST /lab/examination-requests/${r1}/administrative-review"
              payload: { decision: "APPROVE", rationale: "Same operator as the technical reviewer" }
              as: CaseManager
              as_user_id: "${a2}"
              captures: { e_same_operator: $.data.error_id }
            - call: "POST /lab/examination-requests/${r1}/administrative-review"
              payload: { decision: "APPROVE", rationale: "Report format, case numbers and scope statement verified" }
              as: CaseManager
              as_user_id: "operator-cm-01"
              captures: { rr_admin: $.data.id }
            - call: "POST /lab/proficiency-tests/${pt1}/submit"
              payload: {}
              as: Analyst
              as_user_id: "${a2}"
              captures: { e_pt_identity: $.data.error_id }
          assert:
            - "first trigger: HTTP status == 403 and ${e_start_identity} == ERR_ANALYST_IDENTITY_MISMATCH; ExaminationRequest.${r1}.status == ASSIGNED"
            - "second trigger: HTTP status == 200 and ExaminationRequest.${r1}.status == IN_ANALYSIS"
            - "third trigger: HTTP status == 403 and ${e_complete_identity} == ERR_ANALYST_IDENTITY_MISMATCH; ExaminationRequest.${r1}.status == IN_ANALYSIS"
            - "fourth trigger: HTTP status == 200 and ExaminationRequest.${r1}.status == TECH_REVIEW"
            - "fifth trigger: HTTP status == 409 and ${e_self_review} == ERR_SEGREGATION_OF_DUTIES (403 would be wrong - the role is permitted, the person is not)"
            - "no ReviewRecord exists for ${r1} after the fifth trigger"
            - "sixth trigger: HTTP status == 201, ${rr_reviewer} == ${a2}, ReviewRecord.${rr_tech}.review_type == TECHNICAL and ExaminationRequest.${r1}.status == ADMIN_REVIEW"
            - "seventh trigger: HTTP status == 409 and ${e_same_operator} == ERR_SEGREGATION_OF_DUTIES and ExaminationRequest.${r1}.status == ADMIN_REVIEW"
            - "eighth trigger: HTTP status == 201, ReviewRecord.${rr_admin}.review_type == ADMINISTRATIVE and ExaminationRequest.${r1}.status == RELEASED"
            - "ninth trigger: HTTP status == 403 and ${e_pt_identity} == ERR_ANALYST_IDENTITY_MISMATCH and ProficiencyTest.${pt1}.status == ASSIGNED"

      - name: reinstatement_of_a_suspended_analyst_is_rejected_until_both_gates_clear
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OPEN_NONCONFORMANCE_BLOCKS_REINSTATEMENT]
          - errors[ERR_REINSTATEMENT_PT_REQUIRED]
          - errors[ERR_ANALYST_INVALID_QUALIFICATION_STATE]
          - errors[ERR_NONCONFORMANCE_INVALID_STATE]
          - state_machines.Analyst[SUSPENDED->PROBATION]
        distinguishing_aspect: "Reinstatement has two independent gates that must be reported separately and in order: while any finding for the analyst is still open the answer is the nonconformance code even though the PT gate is also unmet, and only after every finding reaches CLOSED does the distinct PT code appear. The passing test must be scored strictly after suspended_at_utc, so a pass sitting in the history from before the suspension would not do. Reinstatement lands in PROBATION (not QUALIFIED), which makes an immediate second reinstate a plain state error."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Analyst A1: BIOLOGY, competency 4, capacity 40.00, training 8.00, QUALIFIED at the start."
            - "Method M1 VALIDATED BIOLOGY, standard_hours_per_item 4.00, min_competency_level 2."
            - "PT1 (cycle 2026-C1, due 2026-08-15) submitted on time and scored 50.00 -> FAIL (below PT_INCONCLUSIVE_PCT 70.0): consecutive_pt_failures 1, QUALIFIED -> PROBATION, and one Nonconformance (PT_FAILURE, MAJOR, analyst_id A1) is raised."
            - "PT2 (cycle 2026-C2, due 2026-08-20) submitted on time and scored 55.00 -> FAIL: consecutive_pt_failures 2 == PT_SUSPENSION_THRESHOLD, PROBATION -> SUSPENDED with suspended_at_utc == 2026-08-01T00:00:00Z, and a second PT_FAILURE / MAJOR finding is raised."
            - "The two findings are read back from the filtered listing in created_at ASC order as N1 (from PT1) and N2 (from PT2)."
            - "MAJOR severity gives each finding due_utc = 2026-08-01T00:00:00Z + CAPA_SLA_DAYS[MAJOR] (30) days == 2026-08-31T00:00:00Z, so nothing is overdue during this recipe."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/analysts"
              payload: { full_name: "Reinstatement Candidate", disciplines: ["BIOLOGY"], competency_level: 4, weekly_capacity_hours: 40.00, training_hours_per_week: 8.00 }
              as: LabDirector
              captures: { a1: $.data.id }
            - call: "POST /lab/methods"
              payload: { name: "Presumptive Blood Screen", discipline: "BIOLOGY", standard_hours_per_item: 4.00, min_competency_level: 2, max_items_per_request: 6, accreditation_scope_code: "BIO-PBS-01" }
              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 20, precision_cv_pct: 2.00, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/proficiency-tests"
              payload: { analyst_id: "${a1}", method_id: "${m1}", test_cycle: "2026-C1", due_utc: "2026-08-15T00:00:00Z" }
              as: QualityManager
              captures: { pt1: $.data.id }
            - call: "POST /lab/proficiency-tests/${pt1}/submit"
              payload: {}
              as: Analyst
              as_user_id: "${a1}"
            - call: "POST /lab/proficiency-tests/${pt1}/score"
              payload: { score_pct: 50.00 }
              as: QualityManager
            - call: "POST /lab/proficiency-tests"
              payload: { analyst_id: "${a1}", method_id: "${m1}", test_cycle: "2026-C2", due_utc: "2026-08-20T00:00:00Z" }
              as: QualityManager
              captures: { pt2: $.data.id }
            - call: "POST /lab/proficiency-tests/${pt2}/submit"
              payload: {}
              as: Analyst
              as_user_id: "${a1}"
            - call: "POST /lab/proficiency-tests/${pt2}/score"
              payload: { score_pct: 55.00 }
              as: QualityManager
              captures: { susp_state: $.data.status }
            - call: "GET /lab/nonconformances"
              payload: { analyst_id: "${a1}", source: "PT_FAILURE" }
              as: QualityManager
              captures: { n1: "$.data[0].id", n2: "$.data[1].id" }
          trigger:
            - call: "POST /lab/analysts/${a1}/reinstate"
              payload: { rationale: "Attempt with both gates unmet" }
              as: QualityManager
              captures: { e_open_ncr: $.data.error_id }
            - call: "POST /lab/nonconformances/${n1}/verify-close"
              payload: { closure_note: "Skipping the CAPA steps" }
              as: QualityManager
              captures: { e_ncr_state: $.data.error_id }
            - call: "POST /lab/nonconformances/${n1}/root-cause"
              payload: { root_cause_category: "TRAINING", corrective_action_plan: "Re-training on mixture interpretation plus a witnessed re-test" }
              as: CaseManager
            - call: "POST /lab/nonconformances/${n1}/capa-decision"
              payload: { decision: "APPROVE", rationale: "Plan addresses the identified gap" }
              as: QualityManager
            - call: "POST /lab/nonconformances/${n1}/verify-close"
              payload: { closure_note: "Training records verified" }
              as: QualityManager
            - call: "POST /lab/nonconformances/${n2}/root-cause"
              payload: { root_cause_category: "TRAINING", corrective_action_plan: "Second remediation cycle with supervised casework" }
              as: CaseManager
            - call: "POST /lab/nonconformances/${n2}/capa-decision"
              payload: { decision: "APPROVE", rationale: "Second plan accepted" }
              as: QualityManager
            - call: "POST /lab/nonconformances/${n2}/verify-close"
              payload: { closure_note: "Supervised casework reviewed" }
              as: QualityManager
              captures: { n2_status: $.data.status }
            - call: "POST /lab/analysts/${a1}/reinstate"
              payload: { rationale: "Findings closed but no passing test yet" }
              as: QualityManager
              captures: { e_pt_required: $.data.error_id }
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/proficiency-tests"
              payload: { analyst_id: "${a1}", method_id: "${m1}", test_cycle: "2026-C3", due_utc: "2026-08-25T00:00:00Z" }
              as: QualityManager
              captures: { pt3: $.data.id }
            - call: "POST /lab/proficiency-tests/${pt3}/submit"
              payload: {}
              as: Analyst
              as_user_id: "${a1}"
            - call: "POST /lab/proficiency-tests/${pt3}/score"
              payload: { score_pct: 95.00 }
              as: QualityManager
              captures: { pt3_result: $.data.result, pt3_scored: $.data.scored_at_utc }
            - call: "POST /lab/analysts/${a1}/reinstate"
              payload: { rationale: "Findings closed and 2026-C3 passed after the suspension" }
              as: QualityManager
              captures: { reinstated_state: $.data.qualification_state, reinstated_failures: $.data.consecutive_pt_failures }
            - call: "POST /lab/analysts/${a1}/reinstate"
              payload: { rationale: "Second reinstatement attempt" }
              as: QualityManager
              captures: { e_wrong_state: $.data.error_id }
          assert:
            - "setup: ${susp_state} == SCORED, Analyst.${a1}.qualification_state == SUSPENDED, Analyst.${a1}.consecutive_pt_failures == 2 and Analyst.${a1}.suspended_at_utc == 2026-08-01T00:00:00Z"
            - "setup: the PT_FAILURE listing returns total_count == 2 with both rows severity MAJOR and status OPEN and due_utc 2026-08-31T00:00:00Z"
            - "first trigger: HTTP status == 409 and ${e_open_ncr} == ERR_OPEN_NONCONFORMANCE_BLOCKS_REINSTATEMENT"
            - "second trigger: HTTP status == 409 and ${e_ncr_state} == ERR_NONCONFORMANCE_INVALID_STATE and Nonconformance.${n1}.status == OPEN"
            - "after the fifth trigger: Nonconformance.${n1}.status == CLOSED and Nonconformance.${n1}.closed_at_utc == 2026-08-01T00:00:00Z and Nonconformance.${n1}.overdue == false"
            - "eighth trigger: ${n2_status} == CLOSED, and Analyst.${a1}.qualification_state is still SUSPENDED (the verify-close cascade only lifts a PROBATION analyst)"
            - "ninth trigger: HTTP status == 409 and ${e_pt_required} == ERR_REINSTATEMENT_PT_REQUIRED"
            - "twelfth trigger: ${pt3_result} == PASS and ${pt3_scored} == 2026-08-05T00:00:00Z, which is strictly after suspended_at_utc"
            - "Analyst.${a1}.qualification_state is still SUSPENDED immediately after the PASS (no SUSPENDED transition is triggered by a pass)"
            - "thirteenth trigger: HTTP status == 200, ${reinstated_state} == PROBATION and ${reinstated_failures} == 0"
