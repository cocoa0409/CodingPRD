      - name: onboarding_capacity_and_offer_ownership_are_both_enforced_on_plans
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ONBOARDING_CAPACITY_REACHED]
          - errors[ERR_OFFER_CANDIDATE_MISMATCH]
          - validations[priority=14]
          - validations[priority=28]
          - entities.PracticeGroup.fields.active_onboarding_count
          - state_machines.IntegrationPlan.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Two hires competing for ONE onboarding slot is the only shape that separates these
          two failures, because both plans are otherwise perfectly legal. The mismatch fires
          at plan CREATE and is 422 (a pointer-agreement failure on an offer that exists and
          is ACCEPTED, just not this candidate's), whereas the capacity failure fires at plan
          ACTIVATE and is 409 with an INCLUSIVE boundary: active_onboarding_count 1 equals
          onboarding_capacity 1, so equality is already a rejection. The second plan must
          survive in DRAFT so the group can re-activate it after the first hire completes.
