        claim_type: role_denial
        grounds: ["roles", "validations[priority=12]"]
        distinguishing_aspect: "Volunteer V1 signing up with volunteer_id == V2 yields ERR_SELF_SERVICE_FORBIDDEN — entity_backed identity binds the role to its own rows."
        test_recipe:
