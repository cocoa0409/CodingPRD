      - name: panel_vote_and_sanction_proposal_gates_each_return_their_own_error
        claim_type: Violation → Error
        grounds:
          - validations[priority=26]
          - validations[priority=33]
          - validations[priority=35]
          - validations[priority=36]
          - validations[priority=37]
          - validations[priority=54]
          - validations[priority=55]
          - validations[priority=56]
          - errors.ERR_NOT_A_PANELIST
          - errors.ERR_SEVERITY_RECOMMENDATION_REQUIRED
          - errors.ERR_SEVERITY_RECOMMENDATION_NOT_ALLOWED
          - errors.ERR_SANCTION_ABOVE_LADDER_BAND
          - errors.ERR_SANCTION_BELOW_LADDER_BAND
          - errors.ERR_SANCTION_KIND_RANK_MISMATCH
          - errors.ERR_GRADE_COMPONENT_REQUIRED
        distinguishing_aspect: |
          Two clusters on one fixture. Voting: an off-panel faculty member is ERR_NOT_A_PANELIST, but the
          REPORTER - who is also off-panel - is ERR_PANEL_CONFLICT_OF_INTEREST because priority 26 outranks
          priority 35; RESPONSIBLE without a recommendation is ERR_SEVERITY_RECOMMENDATION_REQUIRED and
          ABSTAIN with one is ERR_SEVERITY_RECOMMENDATION_NOT_ALLOWED. Proposing: with
          recommended_ladder_rank 3 the office band is [2,4], so rank 5 is ERR_SANCTION_ABOVE_LADDER_BAND,
          rank 1 is ERR_SANCTION_BELOW_LADDER_BAND, rank 3 with kind WARNING is
          ERR_SANCTION_KIND_RANK_MISMATCH, and grade_component_code is ERR_GRADE_COMPONENT_REQUIRED both
          when it is missing for GRADE_PENALTY_ASSIGNMENT and when it is supplied for GRADE_PENALTY_COURSE.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; ENGL, reporter Rita trained, chair Cora trained, panelists pan1/pan2/pan3, an off-panel member Oke, ROOM-A"
            - "a FORMAL PLAGIARISM case on SEED-A evidence, acknowledged, with a 3-panelist session convened at 2026-08-20T10:00:00Z"
