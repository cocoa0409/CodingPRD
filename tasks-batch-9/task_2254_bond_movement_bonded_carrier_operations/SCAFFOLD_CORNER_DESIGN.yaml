        claim_type: compensation
        grounds:
          - state_machines.LiquidatedDamagesClaim.ISSUED_to_CANCELLED
        excluded_because:
          difficulty_instance: "compensating_invariant / cancelling_a_claim_nets_its_ledger_stream_to_zero"
          rationale: "Undo-transition reversal of all original side effects with no drift is that instance's conserved-quantity assert."

  # =======================================================================
  - section: calculations
    instances:

      - name: obligation_floor_binds_when_the_three_components_sum_below_the_minimum
        claim_type: constants_applied
        grounds:
          - calculations.movement_bond_obligation.constants.MIN_OBLIGATION
          - entities.InBondMovement.fields.obligation_amount
        distinguishing_aspect: "cargo 500.00 / 50.00 kg / 1 package rounds to 16.25 + 0.63 + 0.13 = 17.01, so MIN_OBLIGATION must lift the stored obligation to exactly 25.00 and the bond must be charged 25.00, not 17.01."
        test_recipe:
          setup:
            - "Ports 4601 (NE) / 3901 (MW); carrier ACTIVE; CONTINUOUS bond 50000.00; clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/ports"
              payload: { port_code: "4601", name: "Port of New York", region_code: "NE", exam_capacity_slots: 1, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_ny: $.data.id }
            - call: "POST /in-bond/ports"
              payload: { port_code: "3901", name: "Port of Chicago", region_code: "MW", exam_capacity_slots: 2, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_chi: $.data.id }
            - call: "POST /in-bond/carriers"
              payload: { name: "Atlas Bonded Carriage", irs_number: "12-3456789" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { c1: $.data.id }
            - call: "POST /in-bond/bonds"
              payload: { carrier_id: "${c1}", bond_type: "CONTINUOUS", limit_amount: 50000.00, effective_date: "2026-07-01T00:00:00Z", expiry_date: "2027-06-30T00:00:00Z", surety_code: "SUR-100" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0050", cargo_value: 500.00, gross_weight_kg: 50.00, package_count: 1, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { m_small: $.data.id }
          assert:
            - "HTTP status == 201"
            - "InBondMovement.${m_small}.obligation_amount == 25.00"
            - "CustomsBond.${b1}.obligated_amount == 25.00"
            - "CustomsBond.${b1}.available_amount == 49975.00"
            - "GET /in-bond/ledger-entries?movement_id=${m_small} returns 1 entry with amount == 25.00 and balance_after == 25.00"

      - name: overdue_measure_is_zero_at_the_deadline_and_one_a_second_later
        claim_type: precision
        grounds:
          - calculations.overdue_days_measure
          - state_machines.InBondMovement.transit_status.IN_TRANSIT_to_OVERDUE
        distinguishing_aspect: "A sweep run at exactly 2026-09-05T00:00:00Z must leave M1 IN_TRANSIT with overdue_days 0, while a sweep one second later must mark it OVERDUE with overdue_days == 1 (ceil of 1/86400 of a day)."
        test_recipe:
          setup:
            - "Ports 4601 / 3901; carrier ACTIVE; CONTINUOUS bond 50000.00."
            - "M1 filed 2026-08-01T00:00:00Z (deadline 2026-09-05T00:00:00Z) and departed with seal SEAL-100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
