# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- auth ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The caller's role is not listed in the endpoint's roles"
  - id: ERR_TRANSITION_ROLE_NOT_PERMITTED
    http: 403
    condition: "The caller's role may reach the endpoint but not the requested transition action"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID equals the user who performed the segregated prior step (cutting-test submitter, case-failure reporter)"

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum member, out-of-range number, malformed date, inverted interval, or a mutually exclusive field pair violated"

  # --- existence ---
  - id: ERR_DEPARTMENT_NOT_FOUND
    http: 404
    condition: "department_id does not resolve to a Department"
  - id: ERR_PRIMAL_PURCHASE_NOT_FOUND
    http: 404
    condition: "primal_purchase_id does not resolve to a PrimalPurchase"
  - id: ERR_CUTTING_TEST_NOT_FOUND
    http: 404
    condition: "cutting_test_id or the path id does not resolve to a CuttingTest"
  - id: ERR_CUTTING_TEST_LINE_NOT_FOUND
    http: 404
    condition: "cutting_test_line_id or the path id does not resolve to a CuttingTestLine"
  - id: ERR_RETAIL_ITEM_NOT_FOUND
    http: 404
    condition: "retail_item_id, target_retail_item_id or the path id does not resolve to a RetailItem"
  - id: ERR_CASE_PLAN_NOT_FOUND
    http: 404
    condition: "case_plan_id or the path id does not resolve to a CasePlan"
  - id: ERR_CASE_PLAN_LINE_NOT_FOUND
    http: 404
    condition: "staged_case_plan_line_id, fill_case_plan_line_id or the path id does not resolve to a CasePlanLine"
  - id: ERR_TRIM_LOT_NOT_FOUND
    http: 404
    condition: "trim_lot_id, source_trim_lot_id or the path id does not resolve to a TrimLot"
  - id: ERR_GRIND_RUN_NOT_FOUND
    http: 404
    condition: "grind_run_id or the path id does not resolve to a GrindRun"
  - id: ERR_GRIND_INPUT_NOT_FOUND
    http: 404
    condition: "The path id does not resolve to a GrindInput"
  - id: ERR_TEMPERATURE_LOG_NOT_FOUND
    http: 404
    condition: "trigger_temperature_log_id does not resolve to a TemperatureLog"
  - id: ERR_CASE_FAILURE_NOT_FOUND
    http: 404
    condition: "The path id does not resolve to a CaseFailure"
  - id: ERR_PRE_ORDER_NOT_FOUND
    http: 404
    condition: "The path id does not resolve to a PreOrder"
  - id: ERR_SHRINK_RECONCILIATION_NOT_FOUND
    http: 404
    condition: "The path id does not resolve to a ShrinkReconciliation"

  # --- concurrency / state ---
  - id: ERR_STALE_PARENT_VERSION
    http: 412
    condition: "expected_primal_purchase_version or expected_retail_item_version does not match the parent's current version"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The requested action is not a declared transition from the resource's current state, or its timing gate has not elapsed"
  - id: ERR_SOURCE_TEST_NOT_APPROVED
    http: 409
    condition: "A CUT_TEST_LINE price activation names a CuttingTest whose status is not APPROVED"
  - id: ERR_COST_BASIS_UNAVAILABLE
    http: 409
    condition: "A GRIND_BLEND price activation finds no COMPLETED GrindRun for the item"
  - id: ERR_ITEM_NOT_PRICED
    http: 409
    condition: "The referenced RetailItem.price_status is UNPRICED or SUSPENDED"
  - id: ERR_CASE_PLAN_NOT_PUBLISHED
    http: 409
    condition: "A fill, markdown or shrink event targets a line whose plan is not PUBLISHED"
  - id: ERR_GRIND_RUN_NOT_OPEN
    http: 409
    condition: "Inputs are added to a GrindRun whose status is COMPLETED or ABORTED"
  - id: ERR_TRIM_LOT_NOT_AVAILABLE
    http: 409
    condition: "The trim lot is FULLY_COMMITTED, CONSUMED or DISCARDED"
  - id: ERR_LINE_ON_HOLD
    http: 409
    condition: "The case line or pre-order is HELD by a posture cascade or plan suspension"
  - id: ERR_POSTURE_SALES_HALTED
    http: 409
    condition: "Department.case_posture == SALES_HALTED blocks the requested case, fill or grind operation"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "A scoped uniqueness constraint is violated (store_code, item_code, lot_code, service_date, line_seq, input_seq, trim lot per run)"
  - id: ERR_GRINDER_WINDOW_CONFLICT
    http: 409
    condition: "The requested half-open grinder window overlaps another SCHEDULED or IN_PROGRESS run in the department"
  - id: ERR_SANITATION_BUFFER_REQUIRED
    http: 409
    condition: "A declared_coo changeover between adjacent grinder windows leaves less than grind_sanitation_buffer_min minutes of idle time"
  - id: ERR_PICKUP_SLOT_CAPACITY_EXCEEDED
    http: 409
    condition: "Confirming the pre-order would exceed pickup_slot_capacity collisions over closed pickup intervals"

  # --- business rules ---
  - id: ERR_SELL_BY_EXPIRED
    http: 422
    condition: "The case line's sell_by_date is earlier than the logical clock's current date"
  - id: ERR_PROHIBITED_REGRIND
    http: 422
    condition: "A re-work would create a TrimLot whose rework_generation exceeds REGRIND_GENERATION_LIMIT"
  - id: ERR_COO_LABEL_MISMATCH
    http: 422
    condition: "The coo_label derived from the run inputs differs from the run's declared_coo"
  - id: ERR_DEPARTMENT_MISMATCH
    http: 422
    condition: "Entities referenced in one request belong to different departments"
  - id: ERR_PRODUCT_CLASS_MISMATCH
    http: 422
    condition: "Product classes are incompatible between the referenced entities"
  - id: ERR_PICKUP_WINDOW_CLOSED
    http: 422
    condition: "PICK_UP outside the closed pickup window, or FORFEIT before it closes"
  - id: ERR_YIELD_NOT_RECONCILED
    http: 422
    condition: "abs(unaccounted_lb) exceeds UNACCOUNTED_TOLERANCE_LB, or test_weight_lb differs from the purchase's net_weight_lb"
  - id: ERR_NO_SALABLE_YIELD
    http: 422
    condition: "The cutting test has no line with disposition == SALABLE_CUT"
  - id: ERR_NO_MARKET_VALUE_BASIS
    http: 422
    condition: "The value-bearing lines of the cutting test carry a zero market-value weight base"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 422
    condition: "revision_count == REVISION_LIMIT on REVISE, or amend_count == AMEND_LIMIT on AMEND"
  - id: ERR_LEAN_OUT_OF_TOLERANCE
    http: 422
    condition: "abs(blended_lean_pct - target_lean_pct) exceeds lean_tolerance_pct at completion"
  - id: ERR_NET_WEIGHT_NOT_POSITIVE
    http: 422
    condition: "receiving_shrink_lb is greater than or equal to gross_weight_lb"
  - id: ERR_PERIOD_HAS_SUSPENDED_PLAN
    http: 422
    condition: "A CasePlan inside the reconciled period is in plan_status SUSPENDED"
  - id: ERR_CASE_PLAN_HAS_UNFILLED_LINES
    http: 422
    condition: "CLOSE is requested while a CasePlanLine is still in line_status PLANNED"
  - id: ERR_TRIM_LOT_COMMITTED
    http: 422
    condition: "DISCARD is requested on a TrimLot whose allocated_lb > 0"
  - id: ERR_TRIM_INSUFFICIENT
    http: 422
    condition: "GrindInput.weight_lb exceeds the trim lot's remaining_lb"
  - id: ERR_MARKDOWN_BELOW_FLOOR
    http: 422
    condition: "markdown_price_per_lb_cents is below the yield-adjusted markdown floor"
  - id: ERR_FILL_EXCEEDS_REQUIRED
    http: 422
    condition: "The fill would push actual_fill_lb above required_fill_lb * FILL_OVERAGE_CAP"
  - id: ERR_LINE_POUNDS_UNAVAILABLE
    http: 422
    condition: "Requested markdown, shrink or staged pounds exceed the case line's unencumbered pounds"
  - id: ERR_SHRINK_EXCEEDS_TOLERANCE
    http: 422
    condition: "POST is requested on a reconciliation whose within_tolerance == false without an override_reason"

# =============================================================================
# §1.7 RBAC Matrix (segregation of duties; all roles are operator identities)
# =============================================================================
roles:

  - name: StoreAdmin
    description: "Store-level administrator who provisions departments, the item catalogue and the logical clock. Never touches yield, price activation or case execution."
    identity: "opaque"
    exclusive_operations:
      - "POST /meat-ops/departments"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /meat-ops/retail-items"
      - "all GET endpoints"

  - name: MeatCutter
    description: "Bench cutter who receives primals, records cutting tests, harvests and re-works trim, runs the grinder, fills the case and posts temperature readings."
    identity: "opaque"
    exclusive_operations:
      - "POST /meat-ops/cutting-tests"
      - "POST /meat-ops/cutting-tests/{id}/lines"
      - "POST /meat-ops/cutting-tests/{id}/transitions actions SUBMIT and REVISE"
      - "POST /meat-ops/trim-lots"
      - "POST /meat-ops/trim-lots/{id}/transitions"
      - "POST /meat-ops/grind-runs/{id}/inputs"
      - "POST /meat-ops/grind-runs/{id}/transitions actions START and COMPLETE"
      - "POST /meat-ops/case-plan-lines/{id}/fills"
      - "POST /meat-ops/pre-orders/{id}/transitions action=STAGE"
      - "POST /meat-ops/case-failures/{id}/transitions action=CONTAIN"
    shared_operations:
      - "POST /meat-ops/primal-purchases"
      - "POST /meat-ops/grind-runs"
      - "POST /meat-ops/temperature-logs"
