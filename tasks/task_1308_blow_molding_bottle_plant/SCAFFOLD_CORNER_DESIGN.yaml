  - section: validations
    instances:
      - name: missing_auth_on_missing_spec_returns_unauthenticated
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=4]"]
        distinguishing_aspect: "A request with no auth headers AND a non-existent spec id must return ERR_UNAUTHENTICATED (P1 beats P4; no resource existence leaks)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /plant/bottle-specs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED; http 401"

      - name: invalid_enum_material_type_returns_invalid_request
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", entities.MaterialLot.fields.material_type]
        distinguishing_aspect: "material_type WAX is outside {RESIN, COLORANT} -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /plant/material-lots", payload: { material_type: "WAX", lot_code: "R-9", received_kg: 100 }, as: PlantAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: duplicate_lot_code_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DUPLICATE_CODE]"]
        distinguishing_aspect: "Second lot with lot_code R-1 conflicts globally -> ERR_DUPLICATE_CODE."
        test_recipe:
          setup: ["lot R-1 exists"]
          setup_api_calls:
            - { call: "POST /plant/material-lots", payload: { material_type: "RESIN", resin_type: "PET", lot_code: "R-1", received_kg: 100 }, as: PlantAdmin }
          trigger:
            - { call: "POST /plant/material-lots", payload: { material_type: "RESIN", resin_type: "HDPE", lot_code: "R-1", received_kg: 50 }, as: PlantAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_DUPLICATE_CODE (uniqueness is global even across resin types)"

      - name: cavity_index_out_of_range_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_CAVITY_OUT_OF_RANGE]"]
        distinguishing_aspect: "cavity_index 9 on an 8-cavity mold -> ERR_CAVITY_OUT_OF_RANGE (422), checked before duplicate-blockout."
        test_recipe:
          setup: ["mold M8 INSTALLED on L1"]
          setup_api_calls:
            - { call: "POST /plant/machine-lines", payload: { line_code: "L1", has_inline_labeler: true, max_bottle_diameter_mm: 120, resident_volume_kg: 50 }, as: PlantAdmin, captures: { line_id: "$.data.id" } }
            - { call: "POST /plant/molds", payload: { mold_code: "M8", base_cavities: 8, compatible_resins: ["PET"], reference_weight_g: 20 }, as: PlantAdmin, captures: { mold_id: "$.data.id" } }
            - { call: "POST /plant/molds/${mold_id}/install", payload: { machine_line_id: "${line_id}" }, as: ProcessEngineer, captures: { mold_v: "$.data.version" } }
          trigger:
            - { call: "POST /plant/molds/${mold_id}/cavity-blockouts", payload: { cavity_index: 9, reason: "DAMAGE", expected_mold_version: "${mold_v}" }, as: ProcessEngineer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_CAVITY_OUT_OF_RANGE"

      - name: cavity_already_blocked_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_CAVITY_ALREADY_BLOCKED]"]
        distinguishing_aspect: "A second OPEN blockout on (mold, cavity 4) -> ERR_CAVITY_ALREADY_BLOCKED, even with a fresh OCC version."
        test_recipe:
          setup: ["mold M8 INSTALLED; blockout on cavity 4 OPEN"]
          setup_api_calls:
            - { call: "POST /plant/machine-lines", payload: { line_code: "L1", has_inline_labeler: true, max_bottle_diameter_mm: 120, resident_volume_kg: 50 }, as: PlantAdmin, captures: { line_id: "$.data.id" } }
            - { call: "POST /plant/molds", payload: { mold_code: "M8", base_cavities: 8, compatible_resins: ["PET"], reference_weight_g: 20 }, as: PlantAdmin, captures: { mold_id: "$.data.id" } }
            - { call: "POST /plant/molds/${mold_id}/install", payload: { machine_line_id: "${line_id}" }, as: ProcessEngineer, captures: { mold_v: "$.data.version" } }
            - { call: "POST /plant/molds/${mold_id}/cavity-blockouts", payload: { cavity_index: 4, reason: "DAMAGE", expected_mold_version: "${mold_v}" }, as: ProcessEngineer }
            - { call: "GET /plant/molds/${mold_id}", as: ProcessEngineer, captures: { mold_v2: "$.data.version" } }
          trigger:
            - { call: "POST /plant/molds/${mold_id}/cavity-blockouts", payload: { cavity_index: 4, reason: "PREVENTIVE", expected_mold_version: "${mold_v2}" }, as: ProcessEngineer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_CAVITY_ALREADY_BLOCKED"

      - name: cross_customer_review_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_CROSS_CUSTOMER_ACCESS]"]
        distinguishing_aspect: "CustomerQualityRep of customer B reviewing a run on customer A's spec -> ERR_CROSS_CUSTOMER_ACCESS (entity_backed identity check)."
        test_recipe:
          setup: ["customers ACME and OTHER; ACME spec's qualification run in CUSTOMER_REVIEW"]
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme Bev", customer_code: "ACME", credit_limit_cents: 100000000 }, as: PlantAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /plant/customers", payload: { name: "Other Co", customer_code: "OTHER", credit_limit_cents: 100000000 }, as: PlantAdmin, captures: { other_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs", payload: { customer_id: "${cust_id}", spec_code: "B500", resin_type: "PET", color_contrast_class: "CLEAR", target_weight_g: 22, weight_tolerance_pct: 2.0, neck_finish: "PCO1881", height_mm: 210, diameter_mm: 66, bottle_cube_cm3: 4000, preform_cube_cm3: 150, preform_weight_g: 22, unit_price_cents: 9, label_type: "NONE", min_cavitation_required: 4 }, as: ProcessEngineer, captures: { spec_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs/${spec_id}/submit", as: ProcessEngineer }
            - { call: "POST /plant/bottle-specs/${spec_id}/begin-qualification", as: ProcessEngineer, captures: { spec_v: "$.data.version" } }
            - { call: "POST /plant/qualification-runs", payload: { bottle_spec_id: "${spec_id}", sample_cavity_count: 8, expected_bottle_spec_version: "${spec_v}" }, as: ProcessEngineer, captures: { qrun_id: "$.data.id" } }
            - { call: "POST /plant/qualification-runs/${qrun_id}/execute", payload: { measured_mean_weight_g: 22.1, weight_spread_g: 0.4, visual_defects: 0 }, as: ProcessEngineer }
            - { call: "POST /plant/qualification-runs/${qrun_id}/submit-review", as: QualityTechnician }
          trigger:
            - { call: "POST /plant/qualification-runs/${qrun_id}/review", payload: { decision: "APPROVE" }, as: CustomerQualityRep, as_user_id: "${other_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_CROSS_CUSTOMER_ACCESS; run stays CUSTOMER_REVIEW; spec stays IN_QUALIFICATION"

      - name: active_qualification_run_blocks_second_run
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_ACTIVE_QUALIFICATION_EXISTS]"]
        distinguishing_aspect: "With a run already PLANNED, a second create carrying the CURRENT spec version passes OCC but fails the active-run constraint."
        test_recipe:
          setup: ["spec IN_QUALIFICATION with run Q1 PLANNED"]
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme Bev", customer_code: "ACME", credit_limit_cents: 100000000 }, as: PlantAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs", payload: { customer_id: "${cust_id}", spec_code: "B500", resin_type: "PET", color_contrast_class: "CLEAR", target_weight_g: 22, weight_tolerance_pct: 2.0, neck_finish: "PCO1881", height_mm: 210, diameter_mm: 66, bottle_cube_cm3: 4000, preform_cube_cm3: 150, preform_weight_g: 22, unit_price_cents: 9, label_type: "NONE", min_cavitation_required: 4 }, as: ProcessEngineer, captures: { spec_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs/${spec_id}/submit", as: ProcessEngineer }
            - { call: "POST /plant/bottle-specs/${spec_id}/begin-qualification", as: ProcessEngineer, captures: { spec_v: "$.data.version" } }
            - { call: "POST /plant/qualification-runs", payload: { bottle_spec_id: "${spec_id}", sample_cavity_count: 8, expected_bottle_spec_version: "${spec_v}" }, as: ProcessEngineer, captures: { qrun_id: "$.data.id" } }
            - { call: "GET /plant/bottle-specs/${spec_id}", as: ProcessEngineer, captures: { spec_v2: "$.data.version" } }
          trigger:
            - { call: "POST /plant/qualification-runs", payload: { bottle_spec_id: "${spec_id}", sample_cavity_count: 4, expected_bottle_spec_version: "${spec_v2}" }, as: ProcessEngineer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_ACTIVE_QUALIFICATION_EXISTS (OCC passed with the fresh version; the constraint, not staleness, rejects)"

      - name: weight_out_of_tolerance_blocks_approve
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_WEIGHT_OUT_OF_TOLERANCE]"]
        distinguishing_aspect: "Measured mean 23.0 g vs target 22 g with 2.0 pct tolerance (band +/-0.44) fails the approval gate; REJECT would still be allowed."
        test_recipe:
          setup: ["qualification run in CUSTOMER_REVIEW with weight_within_tolerance == false"]
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme Bev", customer_code: "ACME", credit_limit_cents: 100000000 }, as: PlantAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs", payload: { customer_id: "${cust_id}", spec_code: "B500", resin_type: "PET", color_contrast_class: "CLEAR", target_weight_g: 22, weight_tolerance_pct: 2.0, neck_finish: "PCO1881", height_mm: 210, diameter_mm: 66, bottle_cube_cm3: 4000, preform_cube_cm3: 150, preform_weight_g: 22, unit_price_cents: 9, label_type: "NONE", min_cavitation_required: 4 }, as: ProcessEngineer, captures: { spec_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs/${spec_id}/submit", as: ProcessEngineer }
            - { call: "POST /plant/bottle-specs/${spec_id}/begin-qualification", as: ProcessEngineer, captures: { spec_v: "$.data.version" } }
            - { call: "POST /plant/qualification-runs", payload: { bottle_spec_id: "${spec_id}", sample_cavity_count: 8, expected_bottle_spec_version: "${spec_v}" }, as: ProcessEngineer, captures: { qrun_id: "$.data.id" } }
            - { call: "POST /plant/qualification-runs/${qrun_id}/execute", payload: { measured_mean_weight_g: 23.0, weight_spread_g: 0.4, visual_defects: 0 }, as: ProcessEngineer, captures: { tol: "$.data.weight_within_tolerance" } }
            - { call: "POST /plant/qualification-runs/${qrun_id}/submit-review", as: QualityTechnician }
          trigger:
            - { call: "POST /plant/qualification-runs/${qrun_id}/review", payload: { decision: "APPROVE" }, as: CustomerQualityRep, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "execute computed weight_within_tolerance == false (|23.0 - 22| = 1.0 > 0.44)"
            - "APPROVE -> error_id == ERR_WEIGHT_OUT_OF_TOLERANCE; run stays CUSTOMER_REVIEW"

      - name: spec_revision_stale_blocks_run_after_requalification
        claim_type: cross_entity_validation
        grounds: ["validations[priority=9]", "errors[ERR_SPEC_REVISION_STALE]", entities.ProductionOrder.fields.spec_revision_baseline]
        distinguishing_aspect: "Order released under content_revision 1; spec edited (rev 2), re-edited (rev 3) and re-qualified at rev 3; the still-RELEASED order's baseline 1 is stale -> run create fails until hold+reschedule re-pins the baseline."
