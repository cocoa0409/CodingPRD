              as: Customer
              as_user_id: "${hh_id}"
              captures: { v_install: $.data.id }
            - call: "POST /coopcare/service-visits/${v_install}/assign"
              payload: { technician_id: "tech-1" }
              as: Dispatcher
            - call: "POST /coopcare/service-visits/${v_install}/check-in"
              as: ServiceTech
              as_user_id: "tech-1"
            - call: "POST /coopcare/service-visits/${v_install}/complete"
              payload: { observed_flock_size: 6, actual_duration_minutes: 180 }
              as: ServiceTech
              as_user_id: "tech-1"
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "PREDATOR_PROOFING", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { v_proof: $.data.id }
            - call: "POST /coopcare/service-visits/${v_proof}/assign"
              payload: { technician_id: "tech-1" }
              as: Dispatcher
            - call: "POST /coopcare/service-visits/${v_proof}/check-in"
              as: ServiceTech
              as_user_id: "tech-1"
            - call: "POST /coopcare/service-visits/${v_proof}/complete"
              payload: { observed_flock_size: 6, actual_duration_minutes: 90 }
              as: ServiceTech
              as_user_id: "tech-1"
            - call: "POST /coopcare/sitting-routes"
              payload: { technician_id: "tech-9", route_date: "2026-08-01T00:00:00Z", zone_code: "URBAN", max_stops: 4 }
              as: Dispatcher
              captures: { r1: $.data.id }
            - call: "POST /coopcare/sitting-routes/${r1}/publish"
              as: Dispatcher
            - call: "POST /coopcare/sitting-routes"
              payload: { technician_id: "tech-9", route_date: "2026-08-02T00:00:00Z", zone_code: "URBAN", max_stops: 4 }
              as: Dispatcher
              captures: { r2: $.data.id }
            - call: "POST /coopcare/sitting-routes/${r2}/publish"
              as: Dispatcher
            - call: "POST /coopcare/sitting-routes"
              payload: { technician_id: "tech-9", route_date: "2026-08-04T00:00:00Z", zone_code: "URBAN", max_stops: 4 }
              as: Dispatcher
              captures: { r4: $.data.id }
            - call: "POST /coopcare/sitting-routes/${r4}/publish"
              as: Dispatcher
            - call: "POST /coopcare/sitting-routes"
              payload: { technician_id: "tech-9", route_date: "2026-08-05T00:00:00Z", zone_code: "URBAN", max_stops: 4 }
              as: Dispatcher
              captures: { r5: $.data.id }
            - call: "POST /coopcare/sitting-routes/${r5}/publish"
              as: Dispatcher
            - call: "POST /coopcare/sitting-engagements"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-03T00:00:00Z", daily_window_start: "08:00" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { eng_a: $.data.id }
            - call: "POST /coopcare/sitting-engagements/${eng_a}/quote"
              as: Dispatcher
            - call: "POST /coopcare/sitting-engagements/${eng_a}/confirm"
              as: Customer
              as_user_id: "${hh_id}"
