      - name: workload_ceiling_trips_at_the_cumulative_boundary_and_resets_with_the_window
        claim_type: rate_threshold_triggers
        grounds:
          - "validations[priority=60]"
          - calculations.player_workload_index
          - errors[ERR_WORKLOAD_CEILING_EXCEEDED]
        distinguishing_aspect: "The effective ceiling is the clearance's 1.00 rather than the assignment default 12.00, and the threshold is cumulative: one 150-pitch outing is fine, a second inside the 14-day window is refused, and after the clock slides the window past the first outing the same 150-pitch outing is accepted again."
        test_recipe:
          setup:
            - "The logical clock starts at 2026-04-05T00:00:00Z."
            - "A SINGLE_A affiliate (LEVEL_WORKLOAD_MULTIPLIER 1.00) with an ACTIVE agreement (minimum_active_players 0)."
            - "One player whose LEVEL_ASSIGNMENT clearance was ISSUEd with cleared_workload_ceiling_index 1.00, holding an ACTIVE LEVEL assignment 2026-04-01..2026-08-31, so the effective ceiling is min(12.00, 1.00) == 1.00."
            - "Author-computed: one 150-pitch outing contributes 0.55 * (150/100) * 1.00 == 0.825, which rounds to 0.83 and is under the ceiling; two such outings inside the window total 1.65, which exceeds 1.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-05T00:00:00Z" }
              as: FarmDirector
              as_user_id: "u-farm-1"
            - call: "POST /affiliates"
              payload: { name: "Ceiling Club", level: "SINGLE_A", market_city: "Beloit", meal_stipend_cents_per_day: 2600 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { wc_aff: $.data.id }
            - call: "POST /affiliates/${wc_aff}/agreements"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", facility_standard_tier: "TIER_2", club_reimbursement_cap_cents: 900000, minimum_active_players: 0 }
              as: AffiliateOperator
              as_user_id: "${wc_aff}"
              captures: { wc_agr: $.data.id }
            - call: "POST /agreements/${wc_agr}/disposition"
              payload: { action: "SUBMIT" }
              as: AffiliateOperator
              as_user_id: "${wc_aff}"
            - call: "POST /agreements/${wc_agr}/disposition"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
            - call: "POST /players"
              payload: { full_name: "Ceiling Arm", origin: "DOMESTIC_DRAFT", signed_date: "2025-06-10" }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { wc_p: $.data.id }
            - call: "POST /players/${wc_p}/medical-clearances"
              payload: { clearance_type: "LEVEL_ASSIGNMENT" }
              as: MedicalDirector
              as_user_id: "u-med-1"
              captures: { wc_c: $.data.id }
            - call: "POST /medical-clearances/${wc_c}/disposition"
              payload: { action: "ISSUE", cleared_workload_ceiling_index: 1.00, expires_on: "2026-12-31" }
              as: MedicalDirector
              as_user_id: "u-med-1"
            - call: "GET /players/${wc_p}"
              payload: {}
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { wc_pv: $.data.version }
            - call: "POST /assignments"
              payload: { player_id: "${wc_p}", affiliate_id: "${wc_aff}", assignment_type: "LEVEL", movement_reason: "INITIAL", effective_date: "2026-04-01", end_date: "2026-08-31", expected_player_version: "${wc_pv}" }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { wc_asg: $.data.id }
            - call: "POST /assignments/${wc_asg}/disposition"
              payload: { action: "ACTIVATE" }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { wc_ceiling: $.data.workload_ceiling_index }
          trigger:
            - call: "POST /assignments/${wc_asg}/workload-logs"
              payload: { log_date: "2026-04-05", pitches_thrown: 150 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { wc_log1: $.data.id }
            - call: "GET /players/${wc_p}"
              payload: {}
              as: MedicalDirector
              as_user_id: "u-med-1"
              captures: { wc_idx1: $.data.workload_index }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-06T00:00:00Z" }
              as: FarmDirector
              as_user_id: "u-farm-1"
            - call: "POST /assignments/${wc_asg}/workload-logs"
              payload: { log_date: "2026-04-06", pitches_thrown: 150 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { wc_err: $.data.error_id }
            - call: "GET /players/${wc_p}"
              payload: {}
              as: MedicalDirector
              as_user_id: "u-med-1"
              captures: { wc_idx2: $.data.workload_index }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-25T00:00:00Z" }
              as: FarmDirector
              as_user_id: "u-farm-1"
            - call: "GET /players/${wc_p}"
              payload: {}
              as: MedicalDirector
              as_user_id: "u-med-1"
              captures: { wc_idx3: $.data.workload_index }
            - call: "POST /assignments/${wc_asg}/workload-logs"
              payload: { log_date: "2026-04-25", pitches_thrown: 150 }
              as: FarmDirector
