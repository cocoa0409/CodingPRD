              as: CaseWorker
              captures: { orderc: "$.data.id" }
          trigger:
            - call: "POST /child-support/orders/${ordera}/guideline-calculation"
              payload: {}
              as: CaseWorker
              captures: { a_g: "$.data.guideline_monthly_cents", a_imp: "$.data.imputation_applied", a_cpi: "$.data.guideline_cp_income_cents", a_ncpi: "$.data.guideline_ncp_income_cents", a_basic: "$.data.guideline_basic_obligation_cents", a_ratio: "$.data.guideline_ncp_share_ratio" }
            - call: "POST /child-support/orders/${orderb}/guideline-calculation"
              payload: {}
              as: CaseWorker
              captures: { b_g: "$.data.guideline_monthly_cents", b_imp: "$.data.imputation_applied", b_cpi: "$.data.guideline_cp_income_cents", b_ncpi: "$.data.guideline_ncp_income_cents", b_basic: "$.data.guideline_basic_obligation_cents", b_ratio: "$.data.guideline_ncp_share_ratio" }
            - call: "POST /child-support/orders/${orderc}/guideline-calculation"
              payload: {}
              as: CaseWorker
              captures: { c_g: "$.data.guideline_monthly_cents", c_imp: "$.data.imputation_applied", c_cpi: "$.data.guideline_cp_income_cents", c_ncpi: "$.data.guideline_ncp_income_cents", c_basic: "$.data.guideline_basic_obligation_cents", c_ratio: "$.data.guideline_ncp_share_ratio" }
          assert:
            - "${a_imp} == true and ${a_ncpi} == 182000  # null income takes the imputation branch"
            - "${a_cpi} == 100000 and ${a_basic} == 78960  # combined 282000 <= 400000 so band 1 two_children 0.28; round_half_up(282000 * 0.28) == 78960"
            - "${a_ratio} == 0.6454  # round_half_up_4dp(182000 / 282000) == round_half_up_4dp(0.645390...) == 0.6454"
            - "${a_g} == 50961  # round_half_up(78960 * 0.6454) == 50961, below available 182000 - 113200 == 68800"
            - "${b_imp} == true and ${b_ncpi} == 182000  # source NONE imputes even though 300000 was supplied"
            - "${b_g} == 50961  # byte-identical to case A: the reported 300000 never entered the formula"
            - "${c_imp} == false and ${c_ncpi} == 300000  # SELF_REPORTED is honoured"
            - "${c_basic} == 112000 and ${c_ratio} == 0.7500  # combined 400000 still band 1; round_half_up(400000 * 0.28) == 112000; 300000/400000 == 0.7500"
            - "${c_g} == 84000  # round_half_up(112000 * 0.7500) == 84000, below available 300000 - 113200 == 186800"
            - "${b_g} != ${c_g}  # the only difference between the two chains is the four-character enum value"

      - name: self_support_reserve_floors_the_order_at_the_minimum
        claim_type: constants_applied
        grounds:
          - "calculations.guideline_support_obligation.constants.SELF_SUPPORT_RESERVE_CENTS"
          - "calculations.guideline_support_obligation.constants.MINIMUM_ORDER_CENTS"
          - "entities.SupportOrder.fields.guideline_monthly_cents"
        distinguishing_aspect: >
          Three noncustodial incomes straddle the 113200 self-support reserve to
          prove both constants are wired exactly as declared and that the `available
          <= 0` comparison is non-strict: 100000 (available -13200) and 113200
          (available exactly 0) both collapse to MINIMUM_ORDER_CENTS 5000, while
          113201 (available 1) skips the minimum entirely and yields 1 cent - a
          smaller order than the poorer parent receives. Using `< 0` puts the 113200
          case at 0, and using max(minimum, available) puts the 113201 case at 5000.
