            - "${e1} == ERR_BLOCK_NOT_FOUND and ${e2} == ERR_CREW_NOT_FOUND and ${e3} == ERR_PICKER_NOT_FOUND"
            - "${e4} == ERR_WINDOW_NOT_FOUND and ${e5} == ERR_SESSION_NOT_FOUND and ${e6} == ERR_PAYROLL_RUN_NOT_FOUND"
            - "${e7} == ERR_LOT_NOT_FOUND and ${e8} == ERR_TUNNEL_NOT_FOUND"
            - "${e9} == ERR_COMMITMENT_NOT_FOUND and ${e10} == ERR_ALLOCATION_NOT_FOUND and ${e11} == ERR_WATER_TEST_NOT_FOUND"
            - "the eleven ids are pairwise distinct"

      - name: missing_or_undeclared_auth_headers_returns_unauthenticated
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
          - validations[priority=2]
          - roles.HarvestManager
        distinguishing_aspect: |
          Authentication is priority 1 and 2, ahead of every role, path and body
          check, and all three failure shapes collapse to the SAME 401
          ERR_UNAUTHENTICATED: an absent X-User-Role, an X-User-Role naming a role
          outside the declared seven, and an empty X-User-ID. The third call
          carries a fully valid block payload and still creates nothing, proving
          authentication runs before body handling.
        test_recipe:
          setup:
            - "An empty system; the logical clock is pinned for determinism."
          setup_api_calls:
            - call: "POST /berry-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: HarvestManager
              as_user_id: "hm-1"
          trigger:
            - call: "GET /berry-ops/blocks"
              payload: {}
              as: ""
              as_user_id: "hm-1"
              captures: { e1: $.data.error_id }
            - call: "GET /berry-ops/blocks"
              payload: {}
              as: FieldBoss
              as_user_id: "hm-1"
              captures: { e2: $.data.error_id }
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-V24", variety: "STRAWBERRY", acres: 8.00, planting_year: 2021, irrigation_source_code: "WELL-V24" }
              as: HarvestManager
              as_user_id: ""
              captures: { e3: $.data.error_id }
          assert:
            - "the first trigger omits the X-User-Role header entirely and is HTTP 401 with ${e1} == ERR_UNAUTHENTICATED"
            - "the second trigger sends X-User-Role: FieldBoss, which is not one of the seven declared roles, and is HTTP 401 with ${e2} == ERR_UNAUTHENTICATED"
            - "the third trigger sends an empty X-User-ID and is HTTP 401 with ${e3} == ERR_UNAUTHENTICATED"
            - "no 403 is returned for any of the three"
            - "GET /berry-ops/blocks as HarvestManager hm-1 returns total_count == 0, so the third call created nothing"

  - section: rbac
    instances:
      - name: cross_role_writes_cannot_borrow_another_roles_exclusive_operations
        claim_type: exclusive_operations
        grounds:
          - roles.HarvestManager
          - roles.CrewSupervisor
          - roles.PackhouseOperator
          - validations[priority=3]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: |
          The role matrix is partitioned, not hierarchical: a CrewSupervisor
          cannot register a Block (HarvestManager's exclusive operation) and a
          SalesManager cannot register a cooling tunnel (PackhouseOperator's),
          each returning 403 ERR_FORBIDDEN_ROLE rather than 404 or 422, and
          neither denial leaves a row behind.
        test_recipe:
          setup:
            - "An empty system; the logical clock is pinned for determinism."
          setup_api_calls:
            - call: "POST /berry-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: HarvestManager
              as_user_id: "hm-1"
          trigger:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-V25", variety: "STRAWBERRY", acres: 8.00, planting_year: 2021, irrigation_source_code: "WELL-V25" }
              as: CrewSupervisor
              as_user_id: "sup-1"
              captures: { e1: $.data.error_id }
            - call: "POST /berry-ops/cooling-tunnels"
              payload: { name: "TUN-V25", slot_capacity: 2, target_pulp_temp_f: 34.0 }
              as: SalesManager
              as_user_id: "sales-1"
              captures: { e2: $.data.error_id }
          assert:
            - "the first trigger is HTTP 403 with ${e1} == ERR_FORBIDDEN_ROLE"
            - "the second trigger is HTTP 403 with ${e2} == ERR_FORBIDDEN_ROLE"
            - "GET /berry-ops/blocks as HarvestManager hm-1 returns total_count == 0"
            - "GET /berry-ops/cooling-tunnels as PackhouseOperator pack-1 returns total_count == 0"

      - name: picker_role_without_an_entity_backed_picker_identity_is_forbidden
        claim_type: exclusive_operations
        grounds:
          - roles.Picker
          - validations[priority=4]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: |
          Picker is the only entity_backed role, so X-User-ID must itself resolve
          to a Picker row: sending X-User-Role Picker with an operator id is 403
          ERR_FORBIDDEN_ROLE (priority 4, not a 404), while the same read with the
          real picker id succeeds with an empty page. Identity, not membership, is
          what priority 4 checks.
        test_recipe:
          setup:
            - "One crew with one registered picker and no sessions."
          setup_api_calls:
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-V26", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/pickers"
              payload: { crew_id: "${crew}", full_name: "Picker V26", hygiene_training_on: "2026-06-01" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { pk: $.data.id }
          trigger:
            - call: "GET /berry-ops/pick-sessions"
              payload: {}
              as: Picker
              as_user_id: "hm-1"
              captures: { e1: $.data.error_id }
            - call: "GET /berry-ops/pick-sessions"
              payload: {}
              as: Picker
              as_user_id: "${pk}"
          assert:
            - "the first trigger is HTTP 403 with ${e1} == ERR_FORBIDDEN_ROLE"
            - "the second trigger is HTTP 200 with response_type == array and total_count == 0"
            - "Picker.${pk}.crew_id == ${crew} and Crew.${crew}.picker_count == 1"

      - name: tally_by_a_supervisor_of_another_crew_returns_not_session_supervisor
        claim_type: exclusive_operations
        grounds:
          - roles.CrewSupervisor
          - validations[priority=20]
          - errors[ERR_NOT_SESSION_SUPERVISOR]
        distinguishing_aspect: |
          Having the CrewSupervisor role is not enough to tally: priority 20
          compares X-User-ID against the supervisor_user_id of the crew that owns
          the session's window, so sup-2 tallying sup-1's session is 403
          ERR_NOT_SESSION_SUPERVISOR - a different id from the generic
          ERR_FORBIDDEN_ROLE - and the session stays OPEN with PENDING quality.
        test_recipe:
          setup:
            - "One CLEARED STRAWBERRY block; one crew whose supervisor_user_id is sup-1, with one trained picker, CERTIFIED; one OPEN window over 2026-08-03; one OPEN session."
          setup_api_calls:
