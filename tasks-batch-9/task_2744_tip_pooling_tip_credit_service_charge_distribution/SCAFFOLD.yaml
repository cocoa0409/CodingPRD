scenario: |
  Generate task harder than expert level!

  2744. Tip Pooling, Tip Credit & Service Charge Distribution (multi-unit restaurant payroll):
  tipped vs non-tipped role classification with dual-jobs and side-work time limits, tip credit
  application with minimum wage top-up calculation, mandatory pool contribution rules and manager
  exclusion, service charge treatment as wages versus tips for overtime regular-rate purposes,
  credit card processing fee deduction limits by state, tip declaration, allocated tips and
  reporting thresholds, shift-level pool computation and pay-period distribution, dispute and
  back-wage correction handling

domain_name: tip-pooling-payroll
api_prefix: "/"

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Compliance / audit
  complexity_layers:
    - dual_variant_calculation      # weekly-aggregate vs per-shift tip credit; actual vs capped card-fee deduction
    - rate_threshold_triggers       # 20% side-work limit, 30-minute continuous limit, $30/month tipped test, 8% allocated-tips test, 40-hour overtime
    - cascading_side_effects        # pool reversal / dispute adjudication / policy activation propagate 3-5 hops
    - optimistic_concurrency        # OCC on Location.version and PayLine.version for the two supersede-style creates

  entity_topology: flat
  # Every entity is addressed at a top-level collection and linked by explicit foreign keys
  # (`/shifts`, `/pay-lines`, `/shift-tip-pools`); no nesting appears in any URL path. Children are
  # discovered through filtered list endpoints, never through nested routes.

  state_machine_shape: cyclic
  # PayPeriod is the headline cycle (OPEN -> COMPUTED -> APPROVED -> OPEN via reopen). Two further
  # non-linear shapes coexist: Shift and ShiftTipPool each carry two independent state dimensions
  # (Shift.time_status x Shift.declaration_status, ShiftTipPool.contribution_status x
  # ShiftTipPool.distribution_status), and Dispute is a branching fork-join
  # (OPEN -> {UPHELD, PARTIALLY_UPHELD, DENIED} -> CLOSED) whose branches carry different
  # side-effect sets.

  relationship_patterns:
    - one_to_many          # Location -> Employee/Shift/PayPeriod/TipPoolPolicy/ShiftTipPool
    - many_to_many         # EmployeeRoleAssignment joins Employee x JobRole; PoolAllocation joins ShiftTipPool x Employee x Shift
    - self_referential     # BackWageCorrection.supersedes_correction_id -> BackWageCorrection.id
    - cross_aggregate      # ShiftTipPool (tip aggregate) mutates Shift and PayLine (payroll aggregate)

  role_model: segregation_of_duties
  # The operator who computes a pay period may not approve it, and the operator who issues a
  # back-wage correction may not apply it. Both checks compare X-User-ID values, so the two
  # opaque payroll roles cannot be collapsed onto one human.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Location
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Trading name of the restaurant unit"
        constraints: "1..120 characters"
      - name: state_code
        type: enum
        source: input
        description: "US state whose wage and card-fee rules govern this unit"
        constraints: "one of {CA, NY, TX, MA}"
      - name: state_min_wage_cents
        type: integer
        source: input
        description: "State minimum wage in cents per hour"
        constraints: ">= 725"
      - name: cash_wage_cents
        type: integer
        source: input
        description: "Direct cash wage per hour paid to tipped employees at this unit"
        constraints: ">= 213 and <= applicable_min_wage_cents"
      - name: tip_credit_enabled
        type: boolean
        source: input
        description: "Whether this unit claims a tip credit against the minimum wage"
        default: false
      - name: cc_fee_policy
        type: enum
        source: input
        description: "How much of the card processing fee may be deducted from charged tips"
        constraints: "one of {PROHIBITED, ACTUAL_ONLY, CAPPED_BPS}"
      - name: cc_fee_cap_bps
        type: integer
        source: input
        description: "Statutory cap on the deductible fee in basis points; required when cc_fee_policy == CAPPED_BPS, otherwise must be omitted"
        default: null
        constraints: "1..1000 when present"
      - name: service_charge_treatment
        type: enum
        source: input
        description: "Default treatment of mandatory service charges collected at this unit"
        constraints: "one of {WAGES, TIPS}"
      - name: applicable_min_wage_cents
        type: integer
        source: computed
        description: "max(FEDERAL_MIN_WAGE_CENTS, state_min_wage_cents); the wage floor every hour must reach"
      - name: max_tip_credit_per_hour_cents
        type: integer
        source: computed
        description: "applicable_min_wage_cents - cash_wage_cents when tip_credit_enabled is true, else 0"
      - name: pending_pool_cents
        type: integer
        source: computed
        description: "Sum of (ShiftTipPool.total_contributed_cents + ShiftTipPool.service_charge_tips_cents) over pools of this location whose contribution_status == CONTRIBUTED and distribution_status == PENDING: money already taken from shifts but not yet paid out. A pool drops out of the sum the moment it is DISTRIBUTED or REVERSED"
        default: 0

  - name: JobRole
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Chain-wide role code, unique across all JobRole rows"
        constraints: "uppercase A-Z and underscore, 2..40 characters"
      - name: title
        type: string
        source: input
        description: "Human-readable role title"
      - name: tip_status
        type: enum
        source: input
        description: "Whether the role is customarily and regularly tipped"
        constraints: "one of {TIPPED, NON_TIPPED}"
      - name: is_management
        type: boolean
        source: input
        description: "True for managers and supervisors, who are excluded from every tip pool in both directions"
        default: false
      - name: pool_contribution_pct_bps
        type: integer
        source: input
        description: "Mandatory pool contribution rate in basis points, applied to the policy's contribution basis"
        default: 0
        constraints: "0..5000; must be 0 when is_management is true"
      - name: pool_share_points
        type: integer
        source: input
        description: "Relative share points used to weight pool and receipt of distributions; 0 means the role contributes but never receives"
        default: 0
        constraints: "0..100; must be 0 when is_management is true"
      - name: side_work_eligible
        type: boolean
        source: input
        description: "Whether shifts in this role may record non-tip-producing side work minutes"
        default: false

  - name: Employee
    parent: Location
    common_fields: true
    fields:
      - name: location_id
        type: string
        source: input
        description: "FK -> Location.id; home unit that governs wage and card-fee rules for this employee"
      - name: full_name
        type: string
        source: input
        description: "Employee legal name"
      - name: external_payroll_ref
        type: string
        source: input
        description: "Identifier of this employee in the upstream payroll system"
      - name: monthly_tip_baseline_cents
        type: integer
        source: input
        description: "Tips already declared by this employee earlier in the current calendar month, carried in from the prior pay period"
        default: 0
        constraints: ">= 0"
      - name: separation_date
        type: datetime
        source: input
        description: "Date of separation; shifts with a business_date after this date are rejected. Null while employed"
        default: null
      - name: trailing_pool_receipts_cents
        type: integer
        source: computed
        description: "Sum of PoolAllocation.allocated_cents over every allocation row (DISTRIBUTION and REVERSAL) naming this employee"
        default: 0

  - name: EmployeeRoleAssignment
    parent: Employee
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the employee holding this job"
      - name: job_role_id
        type: string
        source: input
        description: "FK -> JobRole.id; the job held"
      - name: effective_from
        type: datetime
        source: input
        description: "First date (UTC, 00:00:00.000) on which this assignment authorises shifts"
      - name: effective_to
        type: datetime
        source: input
        description: "Last date on which this assignment authorises shifts; null means open-ended"
        default: null
      - name: tip_credit_notice_acknowledged_at
        type: datetime
        source: input
        description: "Instant at which the employee acknowledged the tip-credit notice for this role; null means no notice on file, which forbids any tip credit on shifts in this role"
        default: null
      - name: is_primary
        type: boolean
        source: input
        description: "Marks the employee's primary job when the employee holds more than one"
        default: false
      - name: dual_job
        type: boolean
        source: computed
        description: "True when the same employee holds another assignment whose date interval intersects this one and whose JobRole.tip_status differs from this one's"
        default: false

  - name: TipPoolPolicy
    parent: Location
    common_fields: true
    fields:
      - name: location_id
        type: string
        source: input
        description: "FK -> Location.id; unit whose pool this policy governs"
      - name: pool_type
        type: enum
        source: input
        description: "Which roles may receive from the pool: TIPPED_ONLY admits JobRole.tip_status == TIPPED only; ALL_NON_MANAGEMENT admits every non-management role and is legal only where the unit claims no tip credit"
        constraints: "one of {TIPPED_ONLY, ALL_NON_MANAGEMENT}"
      - name: contribution_basis
        type: enum
        source: input
        description: "Base amount each contributing shift's pool_contribution_pct_bps is applied to"
        constraints: "one of {TIPS_RECEIVED_PCT, GROSS_SALES_PCT}"
      - name: share_basis
        type: enum
        source: input
        description: "Weighting used to split the net pool: POINTS_ONLY uses JobRole.pool_share_points; HOURS_WEIGHTED_POINTS uses pool_share_points * Shift.scheduled_minutes"
        constraints: "one of {POINTS_ONLY, HOURS_WEIGHTED_POINTS}"
      - name: cc_fee_pass_through
        type: boolean
        source: input
        description: "Whether the unit's card processing fee is deducted from the pool before distribution"
        default: false
      - name: status
        type: enum
        source: system
        description: "Lifecycle state; only one policy per location may be ACTIVE at a time"
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, SUPERSEDED}"
      - name: activated_at
        type: datetime
        source: system
        description: "Logical-clock instant at which this policy became ACTIVE; null while DRAFT"
        default: null

  - name: PayPeriod
    parent: Location
    common_fields: true
    fields:
      - name: location_id
        type: string
        source: input
        description: "FK -> Location.id; unit whose payroll this period covers"
      - name: start_date
        type: datetime
        source: input
        description: "First date of the seven-day workweek (UTC, 00:00:00.000)"
      - name: end_date
        type: datetime
        source: input
        description: "Last date of the workweek; must equal start_date + 6 days"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state of the period"
        default: OPEN
        constraints: "one of {OPEN, COMPUTED, APPROVED}"
      - name: compute_variant
        type: enum
        source: computed
        description: "Which tip-credit algorithm produced the current PayLine set: WEEKLY_AGGREGATE after compute, PER_SHIFT after approve, null while OPEN"
        default: null
        constraints: "one of {WEEKLY_AGGREGATE, PER_SHIFT} or null"
      - name: computed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator whose compute call produced the current PayLine set; null while OPEN"
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who approved the period; null until APPROVED"
        default: null
      - name: total_credited_minutes
        type: integer
        source: computed
        description: "Sum of Shift.scheduled_minutes over shifts of this period whose time_status == CLOSED"
        default: 0
      - name: total_tip_credit_cents
        type: integer
        source: computed
        description: "Sum of PayLine.tip_credit_cents over PayLines of this period whose status != SUPERSEDED"
        default: 0
      - name: total_topup_cents
        type: integer
        source: computed
        description: "Sum of PayLine.topup_cents over PayLines of this period whose status != SUPERSEDED"
        default: 0
      - name: total_correction_cents
        type: integer
        source: computed
        description: "Sum of BackWageCorrection.amount_cents over corrections whose status is PENDING or APPLIED and whose pay_line_id names a PayLine of this period; a VOIDED correction drops out of the sum"
        default: 0
      - name: gross_receipts_cents
        type: integer
        source: computed
        description: "Sum of Shift.gross_sales_cents over shifts of this period whose time_status == CLOSED"
        default: 0
      - name: reported_tips_cents
        type: integer
        source: computed
        description: "Sum of PayLine.reported_tips_cents over PayLines of this period whose status != SUPERSEDED"
        default: 0
      - name: allocation_shortfall_cents
        type: integer
        source: computed
        description: "Amount by which reported_tips_cents fell below the 8% reporting threshold at approval; 0 when no allocation was required"
        default: 0

  - name: Shift
    parent: PayPeriod
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; who worked the shift"
      - name: location_id
        type: string
        source: input
        description: "FK -> Location.id; unit where the shift was worked"
      - name: job_role_id
        type: string
        source: input
        description: "FK -> JobRole.id; role worked on this shift, which decides tipped classification, contribution rate and share points"
      - name: pay_period_id
        type: string
        source: input
        description: "FK -> PayPeriod.id; period that pays this shift; business_date must fall inside its date interval"
      - name: shift_tip_pool_id
        type: string
        source: system
        description: "FK -> ShiftTipPool.id; pool this shift was folded into, null while unpooled and reset to null when the pool is reversed"
        default: null
      - name: business_date
        type: datetime
        source: input
        description: "Operating date the shift is booked to (UTC, 00:00:00.000); pools are computed per (location_id, business_date)"
      - name: start_at
        type: datetime
        source: input
        description: "Clock-in instant; shift occupies the half-open interval [start_at, end_at)"
      - name: end_at
        type: datetime
        source: input
        description: "Clock-out instant; must be strictly after start_at"
      - name: scheduled_minutes
        type: integer
        source: computed
        description: "Whole minutes between start_at and end_at"
      - name: side_work_minutes
        type: integer
        source: input
        description: "Minutes of non-tip-producing side work inside the shift"
        default: 0
        constraints: ">= 0 and <= scheduled_minutes; requires JobRole.side_work_eligible when > 0"
      - name: max_continuous_side_work_minutes
        type: integer
        source: input
        description: "Longest uninterrupted block of side work inside the shift"
        default: 0
        constraints: ">= 0 and <= side_work_minutes"
      - name: non_tip_credit_minutes
        type: integer
        source: computed
        description: "Minutes that must be paid at applicable_min_wage_cents with no tip credit, per the dual-jobs side-work rule; equals scheduled_minutes when the role or the unit or the missing notice disqualifies the shift entirely"
        default: 0
      - name: tip_credit_eligible_minutes
        type: integer
        source: computed
        description: "scheduled_minutes - non_tip_credit_minutes; the only minutes a tip credit may be claimed against"
        default: 0
      - name: gross_sales_cents
        type: integer
        source: input
        description: "Food and beverage sales rung by this shift"
        default: 0
        constraints: ">= 0"
      - name: charged_sales_cents
        type: integer
        source: input
        description: "Portion of gross_sales_cents settled on payment cards"
        default: 0
        constraints: ">= 0 and <= gross_sales_cents"
      - name: cc_processing_fee_bps
        type: integer
        source: input
        description: "Actual card processing fee rate for this shift's card batch, in basis points"
        default: 0
        constraints: "0..1000"
      - name: declared_cash_tips_cents
        type: integer
        source: system
        description: "Cash tips the employee declared for this shift"
        default: 0
      - name: declared_charged_tips_cents
        type: integer
        source: system
        description: "Card tips the employee declared for this shift"
        default: 0
      - name: declaration_count
        type: integer
        source: system
        description: "How many times tips have been declared for this shift; 1 means an original declaration, >= 2 means amendments"
        default: 0
      - name: time_status
        type: enum
        source: system
        description: "Timekeeping dimension of the shift, independent of the declaration dimension"
        default: OPEN
        constraints: "one of {OPEN, CLOSED, VOIDED}"
      - name: declaration_status
        type: enum
        source: system
        description: "Tip-declaration dimension of the shift, independent of the timekeeping dimension"
        default: UNDECLARED
        constraints: "one of {UNDECLARED, DECLARED, AMENDED}"
      - name: pool_contribution_cents
        type: integer
        source: computed
        description: "Amount this shift contributed to its pool; 0 while unpooled and reset to 0 when the pool is reversed"
        default: 0
      - name: retained_tips_cents
        type: integer
        source: computed
        description: "declared_cash_tips_cents + declared_charged_tips_cents - pool_contribution_cents"
        default: 0
      - name: shift_tip_credit_cents
        type: integer
        source: computed
        description: "Tip credit attributed to this shift by the PER_SHIFT variant; 0 until the owning period is approved"
        default: 0

  - name: ServiceChargeEvent
    parent: Location
    common_fields: true
    fields:
      - name: location_id
        type: string
        source: input
        description: "FK -> Location.id; unit that collected the service charge"
      - name: allocated_pool_id
        type: string
        source: system
        description: "FK -> ShiftTipPool.id; pool that absorbed this charge when treatment == TIPS, else null"
        default: null
      - name: allocated_pay_period_id
        type: string
        source: system
        description: "FK -> PayPeriod.id; period that absorbed this charge as wages when treatment == WAGES, else null"
        default: null
      - name: business_date
        type: datetime
        source: input
        description: "Operating date the charge was collected on (UTC, 00:00:00.000)"
      - name: amount_cents
        type: integer
        source: input
        description: "Mandatory service charge collected from the guest"
        constraints: "> 0"
      - name: description
        type: string
        source: input
        description: "Free-text note naming the banquet or party the charge came from"
      - name: treatment_override
        type: enum
        source: input
        description: "Overrides Location.service_charge_treatment for this single event"
        default: null
        constraints: "one of {WAGES, TIPS} or null"
      - name: treatment
        type: enum
        source: computed
        description: "Resolved treatment: treatment_override when supplied, else Location.service_charge_treatment. WAGES amounts are employer revenue paid out as wages and enter the overtime regular rate; TIPS amounts join the shift tip pool and are excluded from the regular rate"
        constraints: "one of {WAGES, TIPS}"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state of the charge"
        default: RECORDED
        constraints: "one of {RECORDED, ALLOCATED, VOIDED}"

  - name: ShiftTipPool
    parent: Location
    common_fields: true
    fields:
      - name: location_id
        type: string
        source: input
        description: "FK -> Location.id; unit whose shifts feed this pool"
      - name: tip_pool_policy_id
        type: string
        source: system
        description: "FK -> TipPoolPolicy.id; the location's ACTIVE policy at creation time, pinned for the life of the pool"
      - name: policy_version_pinned
        type: integer
        source: system
        description: "TipPoolPolicy.version observed when the pool was created; distribution re-reads the pinned policy row, never a newer one"
      - name: business_date
        type: datetime
        source: input
        description: "Operating date whose shifts this pool covers (UTC, 00:00:00.000)"
      - name: contribution_status
        type: enum
        source: system
        description: "Contribution dimension: CONTRIBUTED once shifts have been debited, REVERSED once the debits have been rolled back"
        default: CONTRIBUTED
        constraints: "one of {CONTRIBUTED, REVERSED}"
      - name: distribution_status
        type: enum
        source: system
        description: "Distribution dimension, independent of the contribution dimension"
        default: PENDING
        constraints: "one of {PENDING, DISTRIBUTED, REVERSED}"
      - name: contributing_shift_count
        type: integer
        source: computed
        description: "Number of shifts whose pool_contribution_cents was greater than 0 at creation"
        default: 0
      - name: participant_count
        type: integer
        source: computed
        description: "Number of shifts eligible to receive from the pool under the pinned policy"
        default: 0
      - name: total_contributed_cents
        type: integer
        source: computed
        description: "Sum of pool_contribution_cents over contributing shifts; 0 once contribution_status == REVERSED"
        default: 0
      - name: service_charge_tips_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over ServiceChargeEvent rows of this (location_id, business_date) whose treatment == TIPS and status was RECORDED at creation; 0 once contribution_status == REVERSED"
        default: 0
      - name: cc_fee_deducted_cents
        type: integer
        source: computed
        description: "Card processing fee withheld from the pool; 0 once contribution_status == REVERSED"
        default: 0
      - name: net_pool_cents
        type: integer
        source: computed
        description: "total_contributed_cents + service_charge_tips_cents - cc_fee_deducted_cents; 0 once contribution_status == REVERSED"
        default: 0
      - name: total_share_weight
        type: integer
        source: computed
        description: "Sum of participant share weights under the pinned policy's share_basis"
        default: 0
      - name: distributed_cents
        type: integer
        source: computed
        description: "Net sum of PoolAllocation.allocated_cents over every row of this pool, DISTRIBUTION and REVERSAL alike; 0 while PENDING, equal to net_pool_cents once DISTRIBUTED, and 0 again once distribution_status == REVERSED because the REVERSAL rows negate the DISTRIBUTION rows"
        default: 0
      - name: distributed_at
        type: datetime
        source: system
        description: "Logical clock instant at which distribution_status became DISTRIBUTED; null while PENDING"
        default: null
      - name: reversed_at
        type: datetime
        source: system
        description: "Logical clock instant at which contribution_status became REVERSED; null while CONTRIBUTED"
        default: null

  - name: PoolAllocation
    parent: ShiftTipPool
    common_fields: false
    fields:
      - name: shift_tip_pool_id
        type: string
        source: system
        description: "FK -> ShiftTipPool.id; pool this ledger row belongs to"
      - name: employee_id
        type: string
        source: system
        description: "FK -> Employee.id; employee credited (or debited on reversal)"
      - name: shift_id
        type: string
        source: system
        description: "FK -> Shift.id; shift whose participation earned this row"
      - name: entry_type
        type: enum
        source: system
        description: "DISTRIBUTION for the original credit, REVERSAL for the offsetting entry appended when the pool is reversed"
        constraints: "one of {DISTRIBUTION, REVERSAL}"
      - name: share_weight
        type: integer
        source: system
        description: "Weight used for this participant under the pinned policy's share_basis"
      - name: allocated_cents
        type: integer
        source: system
        description: "Cents credited on a DISTRIBUTION row; the exact negation of the offset row's amount on a REVERSAL row"
      - name: remainder_cent_awarded
        type: boolean
        source: system
        description: "True when this row received one of the leftover cents from the largest-remainder pass"
        default: false
      - name: business_date
        type: datetime
        source: system
        description: "Copy of the pool's business_date, carried so allocations can be read without joining the pool"

  - name: PayLine
    parent: PayPeriod
    common_fields: true
    fields:
      - name: pay_period_id
        type: string
        source: system
        description: "FK -> PayPeriod.id; period this line belongs to"
      - name: employee_id
        type: string
        source: system
        description: "FK -> Employee.id; employee this line pays"
      - name: variant
        type: enum
        source: system
        description: "Tip-credit algorithm that produced this line"
        constraints: "one of {WEEKLY_AGGREGATE, PER_SHIFT}"
      - name: status
        type: enum
        source: system
        description: "DRAFT after compute, FINAL after approve, SUPERSEDED once a recompute or an input change invalidates it"
        default: DRAFT
        constraints: "one of {DRAFT, FINAL, SUPERSEDED}"
      - name: total_minutes
        type: integer
        source: computed
        description: "Sum of Shift.scheduled_minutes over the employee's CLOSED shifts in the period"
        default: 0
      - name: tip_credit_eligible_minutes
        type: integer
        source: computed
        description: "Sum of Shift.tip_credit_eligible_minutes over the same shifts"
        default: 0
      - name: non_tip_credit_minutes
        type: integer
        source: computed
        description: "total_minutes - tip_credit_eligible_minutes"
        default: 0
      - name: regular_minutes
        type: integer
        source: computed
        description: "min(total_minutes, 2400); the straight-time portion of a 40-hour workweek"
        default: 0
      - name: overtime_minutes
        type: integer
        source: computed
        description: "max(0, total_minutes - 2400)"
        default: 0
      - name: straight_cash_cents
        type: integer
        source: computed
        description: "Direct cash wage for all worked minutes before any tip credit, rounded per rate band then summed"
        default: 0
      - name: service_charge_wages_cents
        type: integer
        source: computed
        description: "Share of WAGES-treated ServiceChargeEvent amounts allocated to this employee"
        default: 0
      - name: regular_rate_cents_per_hour
        type: integer
        source: computed
        description: "(straight_cash_cents + service_charge_wages_cents) / total hours, round_half_up; excludes tips, TIPS-treated service charges, the tip credit and the top-up"
        default: 0
      - name: overtime_premium_cents
        type: integer
        source: computed
        description: "Half-time premium on regular_rate_cents_per_hour for overtime hours"
        default: 0
      - name: minimum_wage_obligation_cents
        type: integer
        source: computed
        description: "applicable_min_wage_cents on straight-time hours plus 1.5x applicable_min_wage_cents on overtime hours"
        default: 0
      - name: tips_available_cents
        type: integer
        source: computed
        description: "Sum of Shift.retained_tips_cents over the employee's CLOSED shifts in the period plus pool_tips_cents"
        default: 0
      - name: pool_tips_cents
        type: integer
        source: computed
        description: "Sum of PoolAllocation.allocated_cents over rows naming this employee whose business_date falls in the period"
        default: 0
      - name: retained_tips_cents
        type: integer
        source: computed
        description: "Sum of Shift.retained_tips_cents over the employee's CLOSED shifts in the period"
        default: 0
      - name: tipped_employee_qualified
        type: boolean
        source: computed
        description: "True when Employee.monthly_tip_baseline_cents plus tips declared on the period's shifts reaches TIPPED_EMPLOYEE_MONTHLY_THRESHOLD_CENTS; false forbids any tip credit on this line"
        default: false
      - name: tip_credit_cents
        type: integer
        source: computed
        description: "Portion of the minimum wage obligation satisfied by tips under the line's variant"
        default: 0
      - name: topup_cents
        type: integer
        source: computed
        description: "Cash the employer must add so the line reaches minimum_wage_obligation_cents"
        default: 0
      - name: total_gross_cents
        type: integer
        source: computed
        description: "straight_cash_cents + service_charge_wages_cents + overtime_premium_cents + topup_cents + correction_applied_cents"
        default: 0
      - name: reported_tips_cents
        type: integer
        source: computed
        description: "retained_tips_cents + pool_tips_cents; the figure compared against the 8% reporting threshold"
        default: 0
      - name: allocated_tips_cents
        type: integer
        source: computed
        description: "Informational allocation of the establishment's 8% reporting shortfall to this employee; never enters total_gross_cents"
        default: 0
      - name: correction_applied_cents
        type: integer
        source: computed
        description: "Sum of BackWageCorrection.amount_cents over corrections on this line whose status == APPLIED"
        default: 0
      - name: pending_correction_cents
        type: integer
        source: computed
        description: "Sum of BackWageCorrection.amount_cents over corrections on this line whose status == PENDING"
        default: 0
      - name: open_dispute_count
        type: integer
        source: computed
        description: "Number of Dispute rows on this line whose status is not CLOSED"
        default: 0

  - name: Dispute
    parent: PayLine
    common_fields: true
    fields:
      - name: pay_line_id
        type: string
        source: input
        description: "FK -> PayLine.id; the disputed line, which must be FINAL"
      - name: raised_by_employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the employee raising the dispute, who must own the line"
      - name: category
        type: enum
        source: input
        description: "Which computation the employee is challenging"
        constraints: "one of {POOL_SHARE, TIP_CREDIT, CC_FEE, SERVICE_CHARGE}"
      - name: claimed_amount_cents
        type: integer
        source: input
        description: "Cents the employee claims were underpaid"
        constraints: "> 0"
      - name: narrative
        type: string
        source: input
        description: "Employee's account of the alleged error"
      - name: status
        type: enum
        source: system
        description: "OPEN on creation, then one of the three adjudication outcomes, then CLOSED"
        default: OPEN
        constraints: "one of {OPEN, UPHELD, PARTIALLY_UPHELD, DENIED, CLOSED}"
      - name: adjudicated_amount_cents
        type: integer
        source: system
        description: "Cents the adjudicator granted; equals claimed_amount_cents when UPHELD, the partial amount when PARTIALLY_UPHELD, 0 when DENIED"
        default: 0
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the compliance operator who adjudicated; null while OPEN"
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the dispute was closed; null until CLOSED"
        default: null

  - name: BackWageCorrection
    parent: PayLine
    common_fields: true
    fields:
      - name: pay_line_id
        type: string
        source: input
        description: "FK -> PayLine.id; the line the correction adjusts"
      - name: dispute_id
        type: string
        source: input
        description: "FK -> Dispute.id; the dispute that produced this correction, null for corrections issued by audit"
        default: null
      - name: supersedes_correction_id
        type: string
        source: input
        description: "FK -> BackWageCorrection.id; the PENDING correction on the same line that this one replaces; required when such a correction exists and forbidden when it does not"
        default: null
      - name: amount_cents
        type: integer
        source: input
        description: "Back wages owed to the employee"
        constraints: "> 0"
      - name: reason_code
        type: enum
        source: input
        description: "Regulatory reason the correction was issued"
        constraints: "one of {POOL_SHARE_SHORTFALL, TIP_CREDIT_INVALID, CC_FEE_OVERDEDUCTION, SERVICE_CHARGE_MISCLASSIFIED, SIDE_WORK_OVERAGE}"
      - name: status
        type: enum
        source: system
        description: "PENDING when issued, APPLIED once posted to the line, VOIDED when superseded by a later correction"
        default: PENDING
        constraints: "one of {PENDING, APPLIED, VOIDED}"
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who issued the correction"
      - name: applied_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who applied it; must differ from issued_by_user_id"
        default: null
      - name: applied_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the correction was posted; null until APPLIED"
        default: null
      - name: voided_at
        type: datetime
        source: system
        description: "Logical-clock instant at which a later correction superseded this one; null unless status == VOIDED"
        default: null

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: TipPoolPolicy
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /tip-pool-policies/{policy_id}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "policy.status == DRAFT"
          - "payload expected_location_version equals Location.version of policy.location_id"
          - "policy.pool_type == ALL_NON_MANAGEMENT requires Location.tip_credit_enabled == false"
        side_effects:
          - "sets policy.activated_at to the logical clock instant"
          - "CASCADE HOP 1 -> HOP 2: if another TipPoolPolicy of the same location_id has status == ACTIVE, that policy is driven ACTIVE -> SUPERSEDED (see the next transition)"
          - "CASCADE HOP 4: Location.pending_pool_cents is recomputed from the surviving CONTRIBUTED+PENDING pools, and Location.version is incremented by 1"
        note: "Activation is the only writer of Location.version, which is what makes the OCC check in §1.2.1 observable."
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event: a sibling TipPoolPolicy of the same location_id is activated"
        actor: system
        preconditions:
          - "a sibling policy of the same location_id has just entered ACTIVE"
        side_effects:
          - "CASCADE HOP 2 -> HOP 3: every ShiftTipPool whose tip_pool_policy_id names this now-SUPERSEDED policy and whose contribution_status == CONTRIBUTED and distribution_status == PENDING is driven CONTRIBUTED -> REVERSED and PENDING -> REVERSED (see the ShiftTipPool machine), because an undistributed pool may not be paid out under a retired policy"
        note: "Pools already DISTRIBUTED under this policy are left untouched; they keep policy_version_pinned for audit."

  - entity: PayPeriod
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: COMPUTED
        trigger: "POST /pay-periods/{pay_period_id}/compute"
        actor: PayrollPreparer
        preconditions:
          - "period.status == OPEN"
          - "every Shift of this period with time_status == CLOSED has declaration_status in {DECLARED, AMENDED}"
          - "for every (location_id, business_date) that has at least one CLOSED shift of this period, if the location has a TipPoolPolicy with status == ACTIVE then a ShiftTipPool for that (location_id, business_date) exists with contribution_status == CONTRIBUTED and distribution_status == DISTRIBUTED"
          - "every ServiceChargeEvent of this location with status == RECORDED, treatment == WAGES and business_date inside [start_date, end_date] has at least one CLOSED shift on its business_date"
        side_effects:
          - "creates one PayLine per employee holding at least one CLOSED shift in the period, with variant == WEEKLY_AGGREGATE and status == DRAFT, populated by calculations.service_charge_wages_allocation then calculations.pay_line_wage_computation"
          - "marks every pre-existing PayLine of this period status DRAFT|FINAL -> SUPERSEDED before inserting the new set"
          - "drives every RECORDED, WAGES-treated ServiceChargeEvent inside the period RECORDED -> ALLOCATED and stamps allocated_pay_period_id"
          - "sets period.compute_variant = WEEKLY_AGGREGATE, computed_by_user_id = X-User-ID"
          - "recomputes period.total_credited_minutes, total_tip_credit_cents, total_topup_cents, gross_receipts_cents, reported_tips_cents"
      - from: COMPUTED
        to: APPROVED
        trigger: "POST /pay-periods/{pay_period_id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "period.status == COMPUTED"
          - "X-User-ID differs from period.computed_by_user_id"
        side_effects:
          - "recomputes every non-SUPERSEDED PayLine of the period with variant == PER_SHIFT via calculations.pay_line_wage_computation, overwriting tip_credit_cents, topup_cents and total_gross_cents"
          - "runs calculations.allocated_tips_reporting and writes PayLine.allocated_tips_cents plus period.allocation_shortfall_cents"
          - "sets every non-SUPERSEDED PayLine status DRAFT -> FINAL"
          - "sets period.compute_variant = PER_SHIFT, approved_by_user_id = X-User-ID"
          - "recomputes period.total_tip_credit_cents and total_topup_cents from the PER_SHIFT figures"
      - from: COMPUTED
        to: OPEN
        trigger: "POST /pay-periods/{pay_period_id}/reopen"
        actor: ComplianceOfficer
        preconditions:
          - "period.status in {COMPUTED, APPROVED}"
          - "no BackWageCorrection with status == PENDING exists on any PayLine of this period"
        side_effects:
          - "marks every PayLine of this period status DRAFT|FINAL -> SUPERSEDED"
          - "sets period.compute_variant = null, computed_by_user_id = null, approved_by_user_id = null, allocation_shortfall_cents = 0"
          - "zeroes period.total_tip_credit_cents, total_topup_cents and reported_tips_cents"
          - "releases every ServiceChargeEvent whose allocated_pay_period_id names this period back to status ALLOCATED -> RECORDED with allocated_pay_period_id = null"
        note: "Reopening is what makes the PayPeriod machine cyclic: OPEN -> COMPUTED -> APPROVED -> OPEN, and the second compute may legitimately produce different numbers because shift inputs changed in between."
      - from: APPROVED
        to: OPEN
        trigger: "POST /pay-periods/{pay_period_id}/reopen"
        actor: ComplianceOfficer
        preconditions:
          - "period.status in {COMPUTED, APPROVED}"
          - "no BackWageCorrection with status == PENDING exists on any PayLine of this period"
        side_effects:
          - "identical side-effect set to the COMPUTED -> OPEN transition above"
      - from: COMPUTED
        to: OPEN
        trigger: "system event: an input of a COMPUTED period changed (pool reversal, shift void, or service-charge void)"
        actor: system
        preconditions:
          - "a Shift, PoolAllocation or ServiceChargeEvent feeding this period was mutated by a cascade"
        side_effects:
          - "marks every PayLine of this period status DRAFT|FINAL -> SUPERSEDED"
          - "sets period.compute_variant = null, computed_by_user_id = null, approved_by_user_id = null"
          - "zeroes period.total_tip_credit_cents, total_topup_cents, allocation_shortfall_cents and reported_tips_cents, then recomputes total_credited_minutes and gross_receipts_cents from the surviving CLOSED shifts"
      - from: APPROVED
        to: OPEN
        trigger: "system event: an input of an APPROVED period changed (pool reversal, shift void, or service-charge void)"
        actor: system
        preconditions:
          - "a Shift, PoolAllocation or ServiceChargeEvent feeding this period was mutated by a cascade"
        side_effects:
          - "identical side-effect set to the system COMPUTED -> OPEN transition above"

  - entity: Shift
    dimension: time_status
    initial_state: OPEN
    terminal_states: [VOIDED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /shifts/{shift_id}/close"
        actor: ShiftManager
        preconditions:
          - "shift.time_status == OPEN"
          - "the shift's PayPeriod.status == OPEN"
        side_effects:
          - "runs calculations.side_work_classification and writes non_tip_credit_minutes and tip_credit_eligible_minutes"
          - "recomputes PayPeriod.total_credited_minutes and PayPeriod.gross_receipts_cents"
      - from: OPEN
        to: VOIDED
        trigger: "POST /shifts/{shift_id}/void"
        actor: PayrollPreparer
        preconditions:
          - "shift.time_status in {OPEN, CLOSED}"
          - "shift.shift_tip_pool_id is null, or the named pool has contribution_status == REVERSED"
        side_effects:
          - "zeroes non_tip_credit_minutes, tip_credit_eligible_minutes and retained_tips_cents"
          - "recomputes PayPeriod.total_credited_minutes and PayPeriod.gross_receipts_cents"
      - from: CLOSED
        to: VOIDED
        trigger: "POST /shifts/{shift_id}/void"
        actor: PayrollPreparer
        preconditions:
          - "shift.time_status in {OPEN, CLOSED}"
          - "shift.shift_tip_pool_id is null, or the named pool has contribution_status == REVERSED"
        side_effects:
          - "zeroes non_tip_credit_minutes, tip_credit_eligible_minutes and retained_tips_cents"
          - "recomputes PayPeriod.total_credited_minutes and PayPeriod.gross_receipts_cents"
          - "if the shift's PayPeriod.status is COMPUTED or APPROVED, drives that period back to OPEN via the system transition, which supersedes every PayLine of the period"
        note: "Voiding a closed shift is the compensating action for creating and closing it; §1.9 and §1.8 both assert PayPeriod.total_credited_minutes returns to its pre-create value."

  - entity: Shift
    dimension: declaration_status
    initial_state: UNDECLARED
    terminal_states: []
    transitions:
      - from: UNDECLARED
        to: DECLARED
        trigger: "POST /shifts/{shift_id}/declare-tips"
        actor: Employee
        preconditions:
          - "shift.time_status == CLOSED"
          - "the shift's PayPeriod.status == OPEN"
          - "declared_charged_tips_cents <= shift.charged_sales_cents"
          - "acting Employee owns the shift, or the acting ShiftManager works at shift.location_id"
        side_effects:
          - "writes declared_cash_tips_cents and declared_charged_tips_cents"
          - "sets declaration_count = 1 and recomputes retained_tips_cents"
      - from: DECLARED
        to: AMENDED
        trigger: "POST /shifts/{shift_id}/declare-tips"
        actor: Employee
        preconditions:
          - "shift.time_status == CLOSED"
          - "the shift's PayPeriod.status == OPEN"
          - "declared_charged_tips_cents <= shift.charged_sales_cents"
        side_effects:
          - "overwrites the declared amounts, increments declaration_count, recomputes retained_tips_cents"
          - "if shift.shift_tip_pool_id is not null, the amendment is rejected instead: a pooled shift's declaration is frozen"
      - from: AMENDED
        to: AMENDED
        trigger: "POST /shifts/{shift_id}/declare-tips"
        actor: Employee
        preconditions:
          - "shift.time_status == CLOSED"
          - "the shift's PayPeriod.status == OPEN"
          - "shift.shift_tip_pool_id is null"
        side_effects:
          - "overwrites the declared amounts and increments declaration_count again"
        note: "The declaration dimension cycles inside AMENDED without bound while the period is OPEN and the shift is unpooled; the timekeeping dimension advances independently of it."

  - entity: ServiceChargeEvent
    initial_state: RECORDED
    terminal_states: [VOIDED]
    transitions:
      - from: RECORDED
        to: ALLOCATED
        trigger: "system event: POST /shift-tip-pools absorbs a TIPS-treated charge, or POST /pay-periods/{pay_period_id}/compute absorbs a WAGES-treated charge"
        actor: system
        preconditions:
          - "event.status == RECORDED"
          - "for treatment == TIPS: a ShiftTipPool for the same (location_id, business_date) is being created"
          - "for treatment == WAGES: at least one CLOSED shift exists at (location_id, business_date)"
        side_effects:
          - "stamps allocated_pool_id (TIPS) or allocated_pay_period_id (WAGES)"
          - "for TIPS: contributes amount_cents to ShiftTipPool.service_charge_tips_cents"
          - "for WAGES: contributes to PayLine.service_charge_wages_cents per calculations.service_charge_wages_allocation, which raises the regular rate and therefore the overtime premium"
      - from: RECORDED
        to: VOIDED
        trigger: "POST /service-charges/{service_charge_id}/void"
        actor: PayrollPreparer
        preconditions:
          - "event.status in {RECORDED, ALLOCATED}"
          - "if status == ALLOCATED and allocated_pool_id is not null, the named pool has distribution_status == PENDING"
        side_effects:
          - "clears allocated_pool_id and allocated_pay_period_id"
      - from: ALLOCATED
        to: VOIDED
        trigger: "POST /service-charges/{service_charge_id}/void"
        actor: PayrollPreparer
        preconditions:
          - "event.status in {RECORDED, ALLOCATED}"
          - "if allocated_pool_id is not null, the named pool has distribution_status == PENDING"
        side_effects:
          - "if allocated_pool_id is not null: subtracts amount_cents from that pool's service_charge_tips_cents and net_pool_cents, then recomputes Location.pending_pool_cents"
          - "if allocated_pay_period_id is not null: drives that period back to OPEN via the system transition, which supersedes every PayLine of the period"
          - "clears allocated_pool_id and allocated_pay_period_id"

  - entity: ShiftTipPool
    dimension: contribution_status
    initial_state: CONTRIBUTED
    terminal_states: [REVERSED]
    transitions:
      - from: CONTRIBUTED
        to: REVERSED
        trigger: "POST /shift-tip-pools/{pool_id}/reverse, or the system event raised when the pool's TipPoolPolicy is superseded while the pool is still PENDING"
        actor: ComplianceOfficer
        preconditions:
          - "pool.contribution_status == CONTRIBUTED"
          - "no PayPeriod covering pool.business_date at pool.location_id has status == APPROVED with a PayLine carrying an APPLIED BackWageCorrection"
        side_effects:
          - "CASCADE HOP 1: sets contribution_status = REVERSED and reversed_at to the logical clock instant"
          - "CASCADE HOP 2: if distribution_status == DISTRIBUTED, appends one PoolAllocation with entry_type == REVERSAL and allocated_cents equal to the negation of each DISTRIBUTION row of this pool, then sets distribution_status = REVERSED; the DISTRIBUTION rows themselves are never mutated"
          - "CASCADE HOP 3: every Shift whose shift_tip_pool_id names this pool has shift_tip_pool_id cleared, pool_contribution_cents zeroed, and retained_tips_cents restored to declared_cash_tips_cents + declared_charged_tips_cents"
          - "CASCADE HOP 4: for every PayPeriod that contains one of those shifts, if the period status is COMPUTED or APPROVED it is driven back to OPEN by the system transition, which marks every PayLine of that period SUPERSEDED"
          - "CASCADE HOP 5: Location.pending_pool_cents is recomputed over that location's surviving CONTRIBUTED and PENDING pools, and each affected PayPeriod's total_credited_minutes and gross_receipts_cents are recomputed from its surviving CLOSED shifts"
        note: "Reversal is the compensating action for create+distribute; the money invariant sum(declared tips) == sum(Shift.retained_tips_cents) + cc_fee_deducted_cents + net_pool_cents must hold before creation and again after reversal."

  - entity: ShiftTipPool
    dimension: distribution_status
    initial_state: PENDING
    terminal_states: [REVERSED]
    transitions:
      - from: PENDING
        to: DISTRIBUTED
        trigger: "POST /shift-tip-pools/{pool_id}/distribute"
        actor: PayrollPreparer
        preconditions:
          - "pool.distribution_status == PENDING"
          - "pool.contribution_status == CONTRIBUTED"
          - "pool.total_contributed_cents + pool.service_charge_tips_cents > 0"
          - "at least one participating shift exists, i.e. participant_count > 0"
        side_effects:
          - "runs calculations.pool_cc_fee_deduction and writes cc_fee_deducted_cents"
          - "runs calculations.pool_distribution and writes net_pool_cents, participant_count and total_share_weight"
          - "appends one PoolAllocation per participating shift with entry_type == DISTRIBUTION"
          - "credits each allocation to the receiving employee, which raises that employee's PayLine.pool_tips_cents at the next compute"
          - "sets distributed_at to the logical clock instant"
          - "recomputes Location.pending_pool_cents, dropping this pool from the pending sum"
      - from: PENDING
        to: REVERSED
        trigger: "POST /shift-tip-pools/{pool_id}/reverse"
        actor: ComplianceOfficer
        preconditions:
          - "pool.contribution_status == CONTRIBUTED"
        side_effects:
          - "no REVERSAL ledger rows are appended, because no DISTRIBUTION rows exist; only the contribution side is unwound (see the contribution_status machine)"
      - from: DISTRIBUTED
        to: REVERSED
        trigger: "POST /shift-tip-pools/{pool_id}/reverse"
        actor: ComplianceOfficer
        preconditions:
          - "pool.contribution_status == CONTRIBUTED"
        side_effects:
          - "appends the negating REVERSAL PoolAllocation rows described in the contribution_status machine, so every recipient's net PoolAllocation sum for this pool returns to 0"
        note: "The two dimensions are not independent in one direction only: distribute requires contribution_status == CONTRIBUTED, while reverse drives both dimensions to REVERSED in a single request."

  - entity: PayLine
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINAL
        trigger: "system event: POST /pay-periods/{pay_period_id}/approve"
        actor: system
        preconditions:
          - "pay_line.status == DRAFT"
          - "the owning PayPeriod is transitioning COMPUTED -> APPROVED"
        side_effects:
          - "variant is switched from WEEKLY_AGGREGATE to PER_SHIFT and the wage figures are recomputed under that variant"
          - "allocated_tips_cents is written by calculations.allocated_tips_reporting"
          - "version is incremented by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system event: the owning PayPeriod re-enters OPEN, or a fresh compute replaces the PayLine set"
        actor: system
        preconditions:
          - "pay_line.status in {DRAFT, FINAL}"
        side_effects:
          - "version is incremented by 1, which invalidates any expected_pay_line_version a client was holding"
      - from: FINAL
        to: SUPERSEDED
        trigger: "system event: the owning PayPeriod re-enters OPEN, or a fresh compute replaces the PayLine set"
        actor: system
        preconditions:
          - "pay_line.status in {DRAFT, FINAL}"
        side_effects:
          - "version is incremented by 1"
          - "pending_correction_cents and correction_applied_cents are carried over unchanged so the audit trail survives"

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: UPHELD
        trigger: "POST /disputes/{dispute_id}/adjudicate with resolution == UPHELD"
        actor: ComplianceOfficer
        preconditions:
          - "dispute.status == OPEN"
          - "the disputed PayLine.status == FINAL"
          - "payload awarded_cents is omitted for this resolution"
        side_effects:
          - "sets adjudicated_amount_cents = claimed_amount_cents per calculations.dispute_adjudication_amount"
          - "CASCADE HOP 2: creates a BackWageCorrection with status == PENDING, dispute_id set, amount_cents == adjudicated_amount_cents"
          - "CASCADE HOP 3: any pre-existing PENDING BackWageCorrection on the same PayLine is driven PENDING -> VOIDED and the new correction's supersedes_correction_id names it"
          - "CASCADE HOP 4: PayLine.pending_correction_cents is set to the new correction amount and PayLine.version is incremented by 1"
          - "CASCADE HOP 5: the owning PayPeriod.total_correction_cents is recomputed from the PENDING and APPLIED corrections of all its pay lines"
      - from: OPEN
        to: PARTIALLY_UPHELD
        trigger: "POST /disputes/{dispute_id}/adjudicate with resolution == PARTIALLY_UPHELD"
        actor: ComplianceOfficer
        preconditions:
          - "dispute.status == OPEN"
          - "the disputed PayLine.status == FINAL"
          - "payload awarded_cents is present and satisfies 0 < awarded_cents < claimed_amount_cents"
        side_effects:
          - "sets adjudicated_amount_cents = awarded_cents"
          - "creates a PENDING BackWageCorrection and runs the same hops 3 to 5 as the UPHELD branch"
      - from: OPEN
        to: DENIED
        trigger: "POST /disputes/{dispute_id}/adjudicate with resolution == DENIED"
        actor: ComplianceOfficer
        preconditions:
          - "dispute.status == OPEN"
          - "the disputed PayLine.status == FINAL"
          - "payload awarded_cents is omitted for this resolution"
        side_effects:
          - "sets adjudicated_amount_cents = 0"
          - "creates no BackWageCorrection, leaves PayLine.pending_correction_cents and PayLine.version untouched"
        note: "This is the divergent arm of the fork: the DENIED branch is distinguished from PARTIALLY_UPHELD with awarded_cents == 0 precisely because the latter is rejected by the strict 0 < awarded_cents guard."
      - from: UPHELD
        to: CLOSED
        trigger: "POST /disputes/{dispute_id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "dispute.status in {UPHELD, PARTIALLY_UPHELD, DENIED}"
          - "for UPHELD and PARTIALLY_UPHELD: the dispute's BackWageCorrection has status == APPLIED"
        side_effects:
          - "sets closed_at to the logical clock instant"
      - from: PARTIALLY_UPHELD
        to: CLOSED
        trigger: "POST /disputes/{dispute_id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "dispute.status in {UPHELD, PARTIALLY_UPHELD, DENIED}"
          - "the dispute's BackWageCorrection has status == APPLIED"
        side_effects:
          - "sets closed_at to the logical clock instant"
      - from: DENIED
        to: CLOSED
        trigger: "POST /disputes/{dispute_id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "dispute.status in {UPHELD, PARTIALLY_UPHELD, DENIED}"
        side_effects:
          - "sets closed_at to the logical clock instant"
        note: "The three adjudicated arms join at CLOSED, but only the two award-bearing arms carry the correction-applied guard, so the join is asymmetric."

  - entity: BackWageCorrection
    initial_state: PENDING
    terminal_states: [APPLIED, VOIDED]
    transitions:
      - from: PENDING
        to: APPLIED
        trigger: "POST /back-wage-corrections/{correction_id}/apply"
        actor: PayrollPreparer
        preconditions:
          - "correction.status == PENDING"
          - "the target PayLine.status == FINAL"
          - "X-User-ID differs from correction.issued_by_user_id"
        side_effects:
          - "sets applied_at to the logical clock instant"
          - "moves the amount out of PayLine.pending_correction_cents into PayLine.correction_applied_cents, adds it to PayLine.total_gross_cents, and increments PayLine.version by 1"
          - "recomputes the owning PayPeriod.total_topup_cents; total_correction_cents is unchanged because the amount merely moves from PENDING to APPLIED inside the same rollup"
      - from: PENDING
        to: VOIDED
        trigger: "system event: a later adjudication on the same PayLine issues a superseding correction"
        actor: system
        preconditions:
          - "correction.status == PENDING"
        side_effects:
          - "sets voided_at to the logical clock instant and removes the amount from PayLine.pending_correction_cents"
        note: "Only PENDING corrections can be voided this way; an APPLIED correction is terminal and must be undone by issuing a new, opposite-signed correction."

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules  (optimistic concurrency control only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - name: policy-activate-stale-location
    parent_entity: Location
    child_entity: TipPoolPolicy
    write_endpoint: "POST /tip-pool-policies/{policy_id}/activate"
    occ_field: expected_location_version
    version_source: Location.version
    error_id: ERR_STALE_LOCATION_VERSION
    status: 412
    description: >-
      Activating a tip-pool policy retires whatever policy was previously ACTIVE at that location
      and re-derives Location.pending_pool_cents, so the caller must present the Location.version
      it observed. The activate endpoint takes expected_location_version as a required input,
      compares it to the stored Location.version, rejects a mismatch with
      ERR_STALE_LOCATION_VERSION (412), and on success increments Location.version by exactly 1.
      A second activate replayed with the same expected_location_version therefore fails.

  - name: correction-create-stale-pay-line
    parent_entity: PayLine
    child_entity: BackWageCorrection
    write_endpoint: "POST /back-wage-corrections"
    occ_field: expected_pay_line_version
    version_source: PayLine.version
    error_id: ERR_STALE_PAY_LINE_VERSION
    status: 412
    description: >-
      Issuing a back-wage correction writes PayLine.pending_correction_cents and voids any prior
      PENDING correction on the same line, so the caller must present the PayLine.version it read.
      The create endpoint takes expected_pay_line_version as a required input, rejects a mismatch
      with ERR_STALE_PAY_LINE_VERSION (412), and on success increments PayLine.version by exactly 1.
      Because approve, reopen, compute and correction-apply all bump PayLine.version, a client that
      read the line before any of those operations is reliably rejected.

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules
# ---------------------------------------------------------------------------
calculations:
  - name: side_work_classification
    algorithm_type: threshold
    trigger: "POST /shifts/{shift_id}/close"
    input_set: >-
      the single Shift being closed, the JobRole named by shift.job_role_id, the
      EmployeeRoleAssignment that authorises the shift (the assignment of that employee and job role
      whose date interval contains business_date), and the Shift's Location
    precision: "whole minutes, integer arithmetic, floor where stated"
    constants:
      SIDE_WORK_PCT_LIMIT: 0.20
      SIDE_WORK_CONTINUOUS_LIMIT_MINUTES: 30
    formula: |
      Step 1. gate. The shift earns no tip-credit-eligible time at all, i.e.
              non_tip_credit_minutes = scheduled_minutes, when ANY of the following holds:
                (a) Location.tip_credit_enabled == false
                (b) JobRole.tip_status == NON_TIPPED
                (c) the authorising EmployeeRoleAssignment has
                    tip_credit_notice_acknowledged_at null, or strictly after Shift.start_at
                    (no written tip-credit notice was on file before the shift began)
              Otherwise continue.
      Step 2. percentage limb (the 80/20 rule):
                pct_allowance     = floor(SIDE_WORK_PCT_LIMIT * scheduled_minutes)
                excess_percentage = max(0, side_work_minutes - pct_allowance)
      Step 3. continuous limb (the 30-minute rule):
                excess_continuous = max(0, max_continuous_side_work_minutes
                                           - SIDE_WORK_CONTINUOUS_LIMIT_MINUTES)
      Step 4. the two limbs are NOT added; the binding limb wins:
                non_tip_credit_minutes = max(excess_percentage, excess_continuous)
      Step 5. tip_credit_eligible_minutes = scheduled_minutes - non_tip_credit_minutes
    worked_example: |
      scheduled_minutes 480, side_work_minutes 150, max_continuous_side_work_minutes 45, a TIPPED
      role at a tip_credit_enabled Location with notice acknowledged before start_at:
        pct_allowance = floor(0.20 * 480) = 96
        excess_percentage = 150 - 96 = 54
        excess_continuous = 45 - 30 = 15
        non_tip_credit_minutes = max(54, 15) = 54
        tip_credit_eligible_minutes = 480 - 54 = 426
      Boundary case: side_work_minutes exactly 96 and max_continuous_side_work_minutes exactly 30
        give excess_percentage 0 and excess_continuous 0, so non_tip_credit_minutes = 0 and
        tip_credit_eligible_minutes = 480. One more minute on either metric yields exactly 1.
      Gate case (c): the same 480-minute shift with tip_credit_notice_acknowledged_at null gives
        non_tip_credit_minutes = 480 and tip_credit_eligible_minutes = 0.
    note: >-
      max_continuous_side_work_minutes may not exceed side_work_minutes and side_work_minutes may
      not exceed scheduled_minutes; both bounds are rejected by validations rather than clamped
      here, so this calculation never sees contradictory inputs.

  - name: shift_pool_contribution
    algorithm_type: aggregation
    trigger: "POST /shift-tip-pools"
    input_set: >-
      every Shift at (location_id, business_date) with time_status == CLOSED,
      declaration_status in {DECLARED, AMENDED} and shift_tip_pool_id null, whose JobRole has
      is_management == false and (pool_contribution_pct_bps > 0 or pool_share_points > 0), and,
      when the pinned TipPoolPolicy.pool_type == TIPPED_ONLY, whose JobRole has
      tip_status == TIPPED. A role with pool_share_points > 0 but pool_contribution_pct_bps == 0
      is inside the input set and is stamped into the pool with contribution 0, because it must
      still be a participant when the pool is distributed
    precision: "cents, round_half_up"
    constants: {}
    formula: |
      For each contributing shift:
        tips_received = declared_cash_tips_cents + declared_charged_tips_cents
        basis = tips_received            when policy.contribution_basis == TIPS_RECEIVED_PCT
        basis = gross_sales_cents        when policy.contribution_basis == GROSS_SALES_PCT
        raw          = round_half_up(JobRole.pool_contribution_pct_bps / 10000 * basis)
        contribution = min(raw, tips_received)   # a shift never contributes more than it holds
      Then:
        Shift.pool_contribution_cents = contribution
        Shift.shift_tip_pool_id       = pool.id
        Shift.retained_tips_cents     = tips_received - contribution
        pool.total_contributed_cents  = sum of contribution over the contributing shifts
        pool.contributing_shift_count = count of shifts with contribution > 0
      Management shifts are excluded from the input set unconditionally: a manager may neither
      contribute to nor receive from a mandatory pool.
    worked_example: |
      Policy TIPPED_ONLY with contribution_basis TIPS_RECEIVED_PCT.
        S1 SERVER,    pool_contribution_pct_bps 1500, declared 4000 cash + 30020 charged
           tips_received 34020, raw = round_half_up(0.15 * 34020) = 5103, contribution 5103,
           retained_tips_cents 28917
        S2 BARTENDER, pool_contribution_pct_bps 1000, declared 2000 cash + 12020 charged
           tips_received 14020, raw = round_half_up(0.10 * 14020) = 1402, contribution 1402,
           retained_tips_cents 12618
        S3 BUSSER,    pool_contribution_pct_bps 0 but pool_share_points 5: in the input set, so
           shift_tip_pool_id is stamped and retained_tips_cents is unchanged, contribution 0
      total_contributed_cents = 5103 + 1402 = 6505, contributing_shift_count = 2
      GROSS_SALES_PCT variant: a SERVER shift with gross_sales_cents 100000 and
        pool_contribution_pct_bps 1500 contributes round_half_up(0.15 * 100000) = 15000, provided
        that does not exceed the tips the shift actually holds.

  - name: pool_cc_fee_deduction
    algorithm_type: tiered_pricing
    trigger: "POST /shift-tip-pools/{pool_id}/distribute"
    input_set: >-
      the contributing Shifts of the pool (those with pool_contribution_cents > 0), the pool's
      Location.cc_fee_policy and cc_fee_cap_bps, and the pinned TipPoolPolicy.cc_fee_pass_through
    precision: "cents, round_half_up, rounded once per contributing shift and then summed"
    constants: {}
    variants:
      - name: ACTUAL_ONLY
        applies_when: "Location.cc_fee_policy == ACTUAL_ONLY"
        formula: >-
          fee_i = round_half_up(Shift.cc_processing_fee_bps / 10000
                                * Shift.declared_charged_tips_cents)
      - name: CAPPED_BPS
        applies_when: "Location.cc_fee_policy == CAPPED_BPS"
        formula: >-
          effective_bps_i = min(Shift.cc_processing_fee_bps, Location.cc_fee_cap_bps);
          fee_i = round_half_up(effective_bps_i / 10000 * Shift.declared_charged_tips_cents)
      - name: PROHIBITED
        applies_when: "Location.cc_fee_policy == PROHIBITED"
        formula: "fee_i = 0 for every shift, whatever Shift.cc_processing_fee_bps says"
    formula: |
      Step 0. if the pinned TipPoolPolicy.cc_fee_pass_through == false, or
              Location.cc_fee_policy == PROHIBITED, then cc_fee_deducted_cents = 0 and stop.
      Step 1. MODE (b) EVALUATION ORDER IS PINNED. The fee is computed and rounded once per
              contributing shift, and the rounded per-shift figures are then summed:
                cc_fee_deducted_cents = sum over contributing shifts of fee_i
              It is NOT computed by summing the unrounded per-shift products and rounding the total
              once. The two orders differ by up to (contributing_shift_count - 1) cents.
      Step 2. the fee can never exceed the money in the pool:
                cc_fee_deducted_cents = min(cc_fee_deducted_cents,
                                            total_contributed_cents + service_charge_tips_cents)
    worked_example: |
      ACTUAL_ONLY, both contributing shifts at cc_processing_fee_bps 250, declaring 30020 and 12020
      charged tips:
        per shift: round_half_up(0.025 * 30020) = 751 and round_half_up(0.025 * 12020) = 301
        pinned per-shift-then-sum result:  751 + 301 = 1052
        the forbidden sum-then-round result: round_half_up(0.025 * 42040) = 1051
      The same two shifts at cc_processing_fee_bps 400 with Location.cc_fee_cap_bps 300:
        CAPPED_BPS:  effective 300 bps -> 901 + 361 = 1262
        ACTUAL_ONLY: 400 bps           -> 1201 + 481 = 1682
      A California Location with cc_fee_policy PROHIBITED yields 0 on the identical fixture.
    note: >-
      cc_processing_fee_bps is per Shift because a card batch rate genuinely varies by day and
      terminal; the cap and the outright prohibition live on Location because they are state law.

  - name: pool_distribution
    algorithm_type: weighted_scoring
    trigger: "POST /shift-tip-pools/{pool_id}/distribute"
    input_set: >-
      every Shift whose shift_tip_pool_id names this pool and whose time_status == CLOSED, whose
      JobRole has is_management == false and pool_share_points > 0, and, when the pinned
      TipPoolPolicy.pool_type == TIPPED_ONLY, whose JobRole has tip_status == TIPPED
    precision: "cents, floor for the base share plus a largest-remainder pass of single cents"
    constants: {}
    formula: |
      Step 1. net_pool_cents = total_contributed_cents + service_charge_tips_cents
                               - cc_fee_deducted_cents
      Step 2. per participating shift i, share_weight_i depends on policy.share_basis:
                POINTS_ONLY           -> share_weight_i = JobRole.pool_share_points
                HOURS_WEIGHTED_POINTS -> share_weight_i = JobRole.pool_share_points
                                                          * Shift.scheduled_minutes
                                         (points-minutes, an exact integer; no division is taken so
                                          no rounding enters the weight)
              total_share_weight = sum of share_weight_i
      Step 3. base_i = floor(net_pool_cents * share_weight_i / total_share_weight)
      Step 4. leftover = net_pool_cents - sum of base_i, which is strictly less than the participant
              count. Exactly one extra cent goes to each of the first `leftover` participants
              ordered by (share_weight_i DESC, Shift.created_at ASC), and those rows carry
              remainder_cent_awarded true.
      Step 5. allocated_cents_i = base_i plus the leftover cent if won; one PoolAllocation row with
              entry_type DISTRIBUTION is appended per participant, and
              pool.distributed_cents = sum of allocated_cents_i, which must equal net_pool_cents.
      participant_count = the number of participating shifts. If participant_count == 0 while
      total_contributed_cents + service_charge_tips_cents > 0 the distribution is rejected rather
      than leaving money stranded in the pool.
    worked_example: |
      HOURS_WEIGHTED_POINTS pool, net_pool_cents = 6505 + 0 - 1052 = 5453:
        S1 SERVER    pool_share_points 10, scheduled_minutes 480 -> weight 10 * 480 = 4800
        S2 BARTENDER pool_share_points  8, scheduled_minutes 480 -> weight  8 * 480 = 3840
        S3 BUSSER    pool_share_points  5, scheduled_minutes 360 -> weight  5 * 360 = 1800
        total_share_weight 10440
        base: floor(5453*4800/10440) = 2507, floor(5453*3840/10440) = 2005,
              floor(5453*1800/10440) = 940, sum 5452, leftover 1
        the single leftover cent goes to S1 (highest share_weight): 2508, 2005, 940, sum 5453
      POINTS_ONLY pool, net_pool_cents 23000, weights 10 and 4, total_share_weight 14:
        base floor(23000*10/14) = 16428 and floor(23000*4/14) = 6571, sum 22999, leftover 1
        -> 16429 and 6571
    note: >-
      The tie-break is Shift.created_at ASC and never Shift.id: opaque identifiers must not decide
      who receives money. share_weight uses Shift.scheduled_minutes and NOT
      tip_credit_eligible_minutes, so a side-work overage shrinks a worker's tip credit without
      also shrinking that worker's pool share, and a pool at a location with no tip credit still
      has non-zero weights.

  - name: service_charge_wages_allocation
    algorithm_type: weighted_scoring
    trigger: "POST /pay-periods/{pay_period_id}/compute"
    input_set: >-
      every ServiceChargeEvent of the period's Location with status == RECORDED, resolved
      treatment == WAGES and business_date inside [PayPeriod.start_date, PayPeriod.end_date],
      allocated across every Shift at that (location_id, business_date) with time_status == CLOSED
    precision: "cents, floor for the base share plus a largest-remainder pass of single cents"
    constants: {}
    formula: |
      For each qualifying ServiceChargeEvent, independently:
        weight_i     = Shift.scheduled_minutes of each CLOSED shift on the event's business_date
        total_weight = sum of weight_i
        base_i       = floor(amount_cents * weight_i / total_weight)
        leftover     = amount_cents - sum of base_i
        one extra cent to the first `leftover` shifts ordered by
          (weight_i DESC, Employee.created_at ASC)
      Each shift's share accrues to PayLine.service_charge_wages_cents of that shift's employee.
      Management shifts ARE included here, in deliberate contrast to pool_distribution: a service
      charge treated as WAGES is ordinary compensation and a manager may lawfully receive it.
      A qualifying event whose business_date carries no CLOSED shift cannot be allocated, and the
      compute is rejected rather than silently dropping the money.
    worked_example: |
      amount_cents 6001 over two CLOSED shifts of 480 and 300 minutes (total_weight 780):
        base = floor(6001*480/780) = 3692 and floor(6001*300/780) = 2308, sum 6000, leftover 1
        the leftover cent goes to the 480-minute shift: 3693 and 2308
      A single-shift day absorbs the whole amount: amount_cents 6000 over one 480-minute CLOSED
        shift gives that employee service_charge_wages_cents 6000.
    note: >-
      Because this figure enters regular_rate_cents_per_hour in pay_line_wage_computation,
      mis-treating a service charge as TIPS instead of WAGES understates the overtime premium; that
      is exactly the defect the SERVICE_CHARGE_MISCLASSIFIED correction reason code repairs.

  - name: pay_line_wage_computation
    algorithm_type: waterfall_allocation
    trigger: "POST /pay-periods/{pay_period_id}/compute for WEEKLY_AGGREGATE, POST /pay-periods/{pay_period_id}/approve for PER_SHIFT"
    input_set: >-
      every Shift of the pay period belonging to the employee whose time_status == CLOSED, the
      PoolAllocation rows naming that employee within the period, and that employee's
      PayLine.service_charge_wages_cents as written by service_charge_wages_allocation
    precision: "cents, round_half_up; each rate band is rounded once and the rounded bands are then summed"
    constants:
      FEDERAL_MIN_WAGE_CENTS: 725
      FEDERAL_CASH_WAGE_FLOOR_CENTS: 213
      TIPPED_EMPLOYEE_MONTHLY_THRESHOLD_CENTS: 3000
      OT_THRESHOLD_MINUTES: 2400
      OT_PREMIUM_MULTIPLIER: 0.5
      OT_OBLIGATION_MULTIPLIER: 1.5
    variants:
      - name: WEEKLY_AGGREGATE
        applies_when: "the PayPeriod is transitioning OPEN -> COMPUTED"
        formula: >-
          Steps S6 to S8 run ONCE across the employee's whole workweek: a single obligation, a
          single three-way tip-credit cap and a single top-up derived from the summed minutes and
          the summed tips.
      - name: PER_SHIFT
        applies_when: "the PayPeriod is transitioning COMPUTED -> APPROVED"
        formula: >-
          Steps S6 to S8 run separately for EACH CLOSED shift, using only that shift's minutes and
          only that shift's own tips, and the per-shift results are summed into the line. The
          period-level service_charge_wages_cents and overtime_premium_cents are subtracted from the
          residual cap of the earliest shift only, ordered by (business_date ASC, created_at ASC).
          The per-shift credit is also written back to Shift.shift_tip_credit_cents.
    formula: |
      THE EVALUATION ORDER IS PINNED. Steps run S0 through S9 in exactly this sequence; any
      reordering changes the result.

      S0. tipped-employee test -> PayLine.tipped_employee_qualified. True only if ALL of:
            Location.tip_credit_enabled == true, AND
            every CLOSED shift of the period has a valid pre-shift notice, i.e.
              tip_credit_eligible_minutes > 0 for at least one shift, AND
            Employee.monthly_tip_baseline_cents
              + sum over the period's CLOSED shifts of (declared_cash_tips_cents
                + declared_charged_tips_cents)
              >= TIPPED_EMPLOYEE_MONTHLY_THRESHOLD_CENTS
          If it is false, tip_credit_cents is 0 for the whole line.

      S1. minutes. total_minutes               = sum of Shift.scheduled_minutes
                   tip_credit_eligible_minutes = sum of Shift.tip_credit_eligible_minutes,
                                                 forced to 0 when tipped_employee_qualified is false
                   non_tip_credit_minutes      = total_minutes - tip_credit_eligible_minutes
                   overtime_minutes            = max(0, total_minutes - OT_THRESHOLD_MINUTES)
                   regular_minutes             = total_minutes - overtime_minutes

      S2. straight_cash_cents
            = round_half_up(Location.cash_wage_cents * tip_credit_eligible_minutes / 60)
            + round_half_up(Location.applicable_min_wage_cents * non_tip_credit_minutes / 60)
          Each rate band is rounded once and the two rounded bands are summed; a single rounding of
          a blended rate is a different, wrong answer.

      S3. service_charge_wages_cents is taken as already written by
          service_charge_wages_allocation. Tips and TIPS-treated service charges NEVER enter it.

      S4. regular_rate_cents_per_hour
            = round_half_up((straight_cash_cents + service_charge_wages_cents)
                            / (total_minutes / 60))
          topup_cents from S8 is deliberately EXCLUDED from the regular rate; including it would
          make the formula self-referential.

      S5. overtime_premium_cents = round_half_up(OT_PREMIUM_MULTIPLIER
                                                 * regular_rate_cents_per_hour
                                                 * overtime_minutes / 60)

      S6. minimum_wage_obligation_cents
            = round_half_up(Location.applicable_min_wage_cents * regular_minutes / 60)
            + round_half_up(OT_OBLIGATION_MULTIPLIER * Location.applicable_min_wage_cents
                            * overtime_minutes / 60)

      S7. retained_tips_cents = sum of Shift.retained_tips_cents over the CLOSED shifts
          pool_tips_cents     = sum of PoolAllocation.allocated_cents over rows naming this
                                employee whose business_date falls inside the period, counting
                                DISTRIBUTION rows positively and REVERSAL rows negatively
          tips_available_cents = retained_tips_cents + pool_tips_cents
          max_credit_cents     = round_half_up(Location.max_tip_credit_per_hour_cents
                                               * tip_credit_eligible_minutes / 60)
          residual_cents       = minimum_wage_obligation_cents - straight_cash_cents
                                 - service_charge_wages_cents - overtime_premium_cents
          tip_credit_cents = max(0, min(max_credit_cents, tips_available_cents, residual_cents))
          The credit is capped three ways at once and which cap binds varies by fixture.

      S8. topup_cents = max(0, minimum_wage_obligation_cents - straight_cash_cents
                              - service_charge_wages_cents - overtime_premium_cents
                              - tip_credit_cents)

      S9. total_gross_cents = straight_cash_cents + service_charge_wages_cents
                            + overtime_premium_cents + topup_cents + correction_applied_cents
          reported_tips_cents = retained_tips_cents + pool_tips_cents
    worked_example: |
      (i) VARIANT DIVERGENCE. Texas Location, applicable_min_wage_cents 725, cash_wage_cents 213,
      no service charges and no overtime. Two CLOSED 480-minute shifts, fully tip-credit eligible,
      declaring 5000 and 500 in tips.
        WEEKLY_AGGREGATE: total_minutes 960, straight_cash 3408, obligation 11600,
          max_credit 8192, tips_available 5500, residual 8192
          -> tip_credit_cents 5500, topup_cents 2692, total_gross_cents 6100
        PER_SHIFT: shift A straight 1704, obligation 5800, max_credit 4096, residual 4096,
          tips 5000 -> credit 4096, topup 0, gross 1704
                   shift B straight 1704, obligation 5800, max_credit 4096, residual 4096,
          tips 500  -> credit 500, topup 3596, gross 5300
          line totals: tip_credit_cents 4596, topup_cents 3596, total_gross_cents 7004
        The 904-cent gap is real: aggregating lets a heavy-tip shift subsidise a light-tip shift,
        which the per-shift reading forbids.
      (ii) OVERTIME WITH A WAGES-TREATED SERVICE CHARGE. New York Location,
      applicable_min_wage_cents 1500, cash_wage_cents 1000, max_tip_credit_per_hour_cents 500.
      total_minutes 2700 (45 hours), service_charge_wages_cents 6000, tips_available 40000.
        straight_cash 45000; regular_rate round_half_up(51000/45) = 1133;
        overtime_premium round_half_up(0.5 * 1133 * 5) = 2833;
        obligation 60000 + 11250 = 71250; max_credit 22500;
        residual 71250 - 45000 - 6000 - 2833 = 17417 <- the binding cap
        tip_credit_cents 17417, topup_cents 0, total_gross_cents 53833
      (iii) SIDE-WORK OVERAGE. Texas, one 480-minute shift with non_tip_credit_minutes 54:
        straight_cash = round_half_up(213*426/60) + round_half_up(725*54/60) = 1512 + 653 = 2165
        regular_rate round_half_up(2165/8) = 271; obligation 5800;
        max_credit round_half_up(512*426/60) = 3635; residual 5800 - 2165 = 3635
        tip_credit_cents 3635, topup_cents 0, total_gross_cents 2165
      (iv) $30 TEST BOUNDARY. Texas, one 480-minute shift, monthly_tip_baseline_cents 0.
        declared tips exactly 3000: tipped_employee_qualified true
          -> tip_credit_cents 3000, topup_cents 1096, total_gross_cents 2800
        declared tips 2999: tipped_employee_qualified false, so tip_credit_eligible_minutes
          collapses to 0 and every minute reverts to the applicable minimum wage
          -> straight_cash_cents 5800, tip_credit_cents 0, topup_cents 0, total_gross_cents 5800
      (v) NO WRITTEN NOTICE. Texas, one 480-minute shift whose authorising assignment has
        tip_credit_notice_acknowledged_at null: tip_credit_eligible_minutes 0, so
        straight_cash 5800, tip_credit_cents 0, topup_cents 0, total_gross_cents 5800, versus
        1704 of straight cash for the identical shift when notice was on file in time.
      (vi) NO TIP CREDIT BY STATE. California Location, applicable_min_wage_cents 1650 equal to
        cash_wage_cents 1650 with tip_credit_enabled false, one 480-minute shift:
        straight_cash 13200, max_credit 0, tip_credit_cents 0, topup_cents 0,
        total_gross_cents 13200.
    note: >-
      tips_available_cents is net of pool contributions and inclusive of pool receipts, so a pool
      reversal changes the tip credit and therefore the top-up; that is why reversal supersedes the
      affected pay lines rather than patching them in place.

  - name: allocated_tips_reporting
    algorithm_type: threshold
    trigger: "POST /pay-periods/{pay_period_id}/approve"
    input_set: >-
      PayPeriod.gross_receipts_cents, the reported_tips_cents of the period's non-SUPERSEDED
      PayLines, and those PayLines whose employee worked at least one CLOSED shift on a JobRole with
      tip_status == TIPPED and is_management == false
    precision: "cents, round_half_up for the threshold, floor plus largest remainder for the split"
    constants:
      ALLOCATED_TIPS_THRESHOLD_PCT: 0.08
    formula: |
      Step 1. threshold_cents = round_half_up(ALLOCATED_TIPS_THRESHOLD_PCT
                                              * PayPeriod.gross_receipts_cents)
      Step 2. PayPeriod.reported_tips_cents = sum of PayLine.reported_tips_cents over the period's
              non-SUPERSEDED lines
      Step 3. the comparison is STRICTLY LESS THAN:
                if reported_tips_cents < threshold_cents:
                    allocation_shortfall_cents = threshold_cents - reported_tips_cents
                else:
                    allocation_shortfall_cents = 0 and every PayLine.allocated_tips_cents = 0
      Step 4. the shortfall is split across the directly tipped lines pro rata by each employee's
              summed Shift.gross_sales_cents:
                base_i = floor(shortfall * sales_i / total_sales)
                leftover cents one each, ordered by (sales_i DESC, Employee.created_at ASC)
      Step 5. PayPeriod.allocation_shortfall_cents = allocation_shortfall_cents
      Allocated tips are a reporting figure only. They are written to PayLine.allocated_tips_cents,
      never added to total_gross_cents, and never enlarge tips_available_cents for the tip credit.
    worked_example: |
      gross_receipts_cents 100000 -> threshold_cents = round_half_up(0.08 * 100000) = 8000
        reported_tips_cents 7000        -> allocation_shortfall_cents 1000, split pro rata by sales
        reported_tips_cents exactly 8000 -> allocation_shortfall_cents 0 and every
                                            allocated_tips_cents 0
        reported_tips_cents 7999        -> allocation_shortfall_cents 1, the single cent going to
                                            the highest-sales directly tipped line

  - name: dispute_adjudication_amount
    algorithm_type: threshold
    trigger: "POST /disputes/{dispute_id}/adjudicate"
    input_set: "the single Dispute, its claimed_amount_cents, and the payload resolution plus awarded_cents"
    precision: "cents, exact integers, no rounding"
    constants: {}
    formula: |
      resolution == UPHELD           -> adjudicated_amount_cents = claimed_amount_cents,
                                        and awarded_cents must be absent from the payload
      resolution == PARTIALLY_UPHELD -> adjudicated_amount_cents = awarded_cents, which must
                                        satisfy 0 < awarded_cents < claimed_amount_cents
      resolution == DENIED           -> adjudicated_amount_cents = 0,
                                        and awarded_cents must be absent from the payload
      An adjudicated_amount_cents greater than 0 creates exactly one BackWageCorrection with
      status PENDING; an adjudicated_amount_cents of 0 creates none.
    worked_example: |
      claimed_amount_cents 2508:
        UPHELD                             -> adjudicated 2508, a PENDING correction of 2508
        PARTIALLY_UPHELD with awarded 1200 -> adjudicated 1200, a PENDING correction of 1200
        PARTIALLY_UPHELD with awarded 2508 -> rejected; the bound is strict at both ends
        PARTIALLY_UPHELD with awarded 0    -> rejected; DENIED is the way to award nothing
        DENIED                             -> adjudicated 0, no correction created

  - name: back_wage_correction_application
    algorithm_type: aggregation
    trigger: "POST /back-wage-corrections/{correction_id}/apply"
    input_set: "the single BackWageCorrection, its target PayLine, and that line's PayPeriod"
    precision: "cents, exact integers, no rounding"
    constants: {}
    formula: |
      On application, in this order:
        PayLine.pending_correction_cents -= correction.amount_cents
        PayLine.correction_applied_cents += correction.amount_cents
        PayLine.total_gross_cents        += correction.amount_cents
        PayLine.version                 += 1
        PayPeriod.total_correction_cents  = sum of amount_cents over corrections whose
                                            status is PENDING or APPLIED on that period's PayLines,
                                            which this application leaves unchanged because the
                                            amount merely moves from PENDING to APPLIED
        PayPeriod.total_topup_cents      += correction.amount_cents when
                                            correction.reason_code == TIP_CREDIT_INVALID, because
                                            such a correction is by definition a minimum-wage top-up
      Two ceilings are enforced before the write: a correction carrying a dispute_id may not exceed
      that dispute's adjudicated_amount_cents, and the sum of APPLIED corrections on a line may not
      exceed that line's minimum_wage_obligation_cents.
    worked_example: |
      A PayLine with total_gross_cents 6100, pending_correction_cents 2508,
      correction_applied_cents 0 and version 3, carrying a PENDING correction of 2508 with
      reason_code POOL_SHARE_SHORTFALL. After apply:
        pending_correction_cents 0, correction_applied_cents 2508, total_gross_cents 8608,
        version 4, PayPeriod.total_correction_cents 2508, PayPeriod.total_topup_cents unchanged
      The same correction with reason_code TIP_CREDIT_INVALID also raises
        PayPeriod.total_topup_cents by 2508.

# ---------------------------------------------------------------------------
# §1.4 Validation Rules (ordered by priority; lower number wins a dual failure)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the value of X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: >-
      request body and query parameters are structurally valid: every required input present,
      no unknown key, every enum value inside its declared domain, every *_cents and *_minutes and
      *_bps value a non-negative integer, every *_at value an ISO-8601 UTC instant, end_at strictly
      after start_at, end_date not before start_date, limit in [1, 100] and offset >= 0
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "every templated id in the path resolves to a stored row, checked left to right"
    error_id: "ERR_LOCATION_NOT_FOUND | ERR_EMPLOYEE_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_PAY_PERIOD_NOT_FOUND | ERR_SHIFT_NOT_FOUND | ERR_POOL_NOT_FOUND | ERR_PAY_LINE_NOT_FOUND | ERR_DISPUTE_NOT_FOUND | ERR_CORRECTION_NOT_FOUND | ERR_RECORD_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a templated path segment"

  - priority: 5
    category: existence
    check: >-
      every foreign key supplied in the request body resolves to a stored row, checked in the order
      the fields are declared on the entity in §1.1
    error_id: "ERR_LOCATION_NOT_FOUND | ERR_EMPLOYEE_NOT_FOUND | ERR_PAY_PERIOD_NOT_FOUND | ERR_PAY_LINE_NOT_FOUND | ERR_DISPUTE_NOT_FOUND | ERR_CORRECTION_NOT_FOUND | ERR_RECORD_NOT_FOUND"
    http_status: 404
    applies_to: "POST /employees, POST /role-assignments, POST /tip-pool-policies, POST /pay-periods, POST /shifts, POST /service-charges, POST /shift-tip-pools, POST /disputes, POST /back-wage-corrections"

  - priority: 6
    category: auth
    check: >-
      an acting Employee may only declare tips on a Shift whose employee_id equals X-User-ID, may
      only raise a Dispute whose raised_by_employee_id equals X-User-ID on a PayLine whose
      employee_id equals X-User-ID, and may only read PayLines, Shifts and PoolAllocations of that
      same employee_id; an acting ShiftManager is confined to the Location of the Employee row named
      by X-User-ID
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /shifts/{shift_id}/declare-tips, POST /disputes, GET /pay-lines/{pay_line_id}, GET /shifts/{shift_id}, GET /pool-allocations/{allocation_id}"

  - priority: 7
    category: auth
    check: >-
      segregation of duties: the X-User-ID approving a pay period must differ from
      PayPeriod.computed_by_user_id, and the X-User-ID applying a back-wage correction must differ
      from BackWageCorrection.issued_by_user_id
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /pay-periods/{pay_period_id}/approve, POST /back-wage-corrections/{correction_id}/apply"

  - priority: 8
    category: state
    check: "the target Shift.time_status == OPEN"
    error_id: ERR_SHIFT_NOT_OPEN
    http_status: 409
    applies_to: "POST /shifts/{shift_id}/close"

  - priority: 9
    category: state
    check: "the target Shift.time_status == CLOSED"
    error_id: ERR_SHIFT_NOT_CLOSED
    http_status: 409
    applies_to: "POST /shifts/{shift_id}/declare-tips"

  - priority: 10
    category: state
    check: "the target Shift.shift_tip_pool_id is null, so its declaration is not frozen by an existing pool"
    error_id: ERR_SHIFT_ALREADY_POOLED
    http_status: 409
    applies_to: "POST /shifts/{shift_id}/declare-tips, POST /shifts/{shift_id}/void"

  - priority: 11
    category: state
    check: "the target TipPoolPolicy.status == DRAFT"
    error_id: ERR_POLICY_NOT_DRAFT
    http_status: 409
    applies_to: "POST /tip-pool-policies/{policy_id}/activate"

  - priority: 12
    category: state
    check: >-
      the governing PayPeriod.status == OPEN: on POST /shifts the period named by pay_period_id, on
      shift close, declare-tips and void the period of the target shift, and on POST /shift-tip-pools
      the period covering business_date at that location
    error_id: ERR_PAY_PERIOD_NOT_OPEN
    http_status: 409
    applies_to: "POST /shifts, POST /shifts/{shift_id}/close, POST /shifts/{shift_id}/declare-tips, POST /pay-periods/{pay_period_id}/compute, POST /shift-tip-pools"

  - priority: 13
    category: state
    check: "the target PayPeriod.status == COMPUTED"
    error_id: ERR_PAY_PERIOD_NOT_COMPUTED
    http_status: 409
    applies_to: "POST /pay-periods/{pay_period_id}/approve"

  - priority: 14
    category: state
    check: "the target PayPeriod.status is COMPUTED or APPROVED"
    error_id: ERR_PAY_PERIOD_NOT_COMPUTED
    http_status: 409
    applies_to: "POST /pay-periods/{pay_period_id}/reopen"

  - priority: 15
    category: state
    check: "no BackWageCorrection with status == PENDING exists on any PayLine of the target period"
    error_id: ERR_PENDING_CORRECTION_EXISTS
    http_status: 409
    applies_to: "POST /pay-periods/{pay_period_id}/reopen"

  - priority: 16
    category: state
    check: "the target ShiftTipPool.distribution_status == PENDING"
    error_id: ERR_POOL_ALREADY_DISTRIBUTED
    http_status: 409
    applies_to: "POST /shift-tip-pools/{pool_id}/distribute"

  - priority: 17
    category: state
    check: "the target ShiftTipPool.contribution_status == CONTRIBUTED"
    error_id: ERR_POOL_REVERSED
    http_status: 409
    applies_to: "POST /shift-tip-pools/{pool_id}/distribute, POST /shift-tip-pools/{pool_id}/reverse"

  - priority: 18
    category: state
    check: >-
      for every (location_id, business_date) with at least one CLOSED shift in the period, when that
      location has a TipPoolPolicy with status == ACTIVE, a ShiftTipPool for that pair exists with
      contribution_status == CONTRIBUTED and distribution_status == DISTRIBUTED
    error_id: ERR_POOL_NOT_DISTRIBUTED
    http_status: 409
    applies_to: "POST /pay-periods/{pay_period_id}/compute"

  - priority: 19
    category: state
    check: "the target Dispute.status == OPEN"
    error_id: ERR_DISPUTE_NOT_OPEN
    http_status: 409
    applies_to: "POST /disputes/{dispute_id}/adjudicate"

  - priority: 20
    category: state
    check: >-
      the target Dispute.status is one of UPHELD, PARTIALLY_UPHELD or DENIED, and for the two
      award-bearing outcomes the dispute's BackWageCorrection has status == APPLIED
    error_id: ERR_DISPUTE_NOT_ADJUDICATED
    http_status: 409
    applies_to: "POST /disputes/{dispute_id}/close"

  - priority: 21
    category: state
    check: "the target BackWageCorrection.status == PENDING"
    error_id: ERR_CORRECTION_NOT_PENDING
    http_status: 409
    applies_to: "POST /back-wage-corrections/{correction_id}/apply"

  - priority: 22
    category: state
    check: "the PayLine named by pay_line_id has status == FINAL"
    error_id: ERR_PAY_LINE_NOT_FINAL
    http_status: 409
    applies_to: "POST /disputes, POST /back-wage-corrections, POST /back-wage-corrections/{correction_id}/apply"

  - priority: 23
    category: state
    check: "expected_location_version equals the stored Location.version of the policy's location"
    error_id: ERR_STALE_LOCATION_VERSION
    http_status: 412
    applies_to: "POST /tip-pool-policies/{policy_id}/activate"

  - priority: 24
    category: state
    check: "expected_pay_line_version equals the stored PayLine.version of the correction's target line"
    error_id: ERR_STALE_PAY_LINE_VERSION
    http_status: 412
    applies_to: "POST /back-wage-corrections"

  - priority: 25
    category: business_safety
    check: >-
      no Shift whose JobRole has is_management == true may contribute to or receive from a mandatory
      tip pool, so a pool whose only contributing or only participating shifts are management shifts
      is rejected
    error_id: ERR_MANAGER_POOL_PARTICIPATION
    http_status: 422
    applies_to: "POST /shift-tip-pools"

  - priority: 26
    category: business_safety
    check: >-
      a TipPoolPolicy with pool_type == ALL_NON_MANAGEMENT may only be activated at a Location whose
      tip_credit_enabled == false, because back-of-house employees may share a pool only where no tip
      credit is taken
    error_id: ERR_POOL_TYPE_REQUIRES_NO_TIP_CREDIT
    http_status: 422
    applies_to: "POST /tip-pool-policies/{policy_id}/activate"

  - priority: 27
    category: business_safety
    check: >-
      a TipPoolPolicy with cc_fee_pass_through == true may not be activated at a Location whose
      cc_fee_policy == PROHIBITED, because that state forbids deducting processing fees from tips
    error_id: ERR_CC_FEE_DEDUCTION_PROHIBITED
    http_status: 422
    applies_to: "POST /tip-pool-policies/{policy_id}/activate"

  - priority: 28
    category: business_safety
    check: >-
      a Location with tip_credit_enabled == true must have cash_wage_cents at least
      FEDERAL_CASH_WAGE_FLOOR_CENTS (213) and strictly below applicable_min_wage_cents
    error_id: ERR_CASH_WAGE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /locations"

  - priority: 29
    category: business_safety
    check: >-
      cc_fee_cap_bps is required and must be greater than 0 when cc_fee_policy == CAPPED_BPS, and
      must be omitted for the other two policies
    error_id: ERR_CC_FEE_CAP_REQUIRED
    http_status: 422
    applies_to: "POST /locations"

  - priority: 30
    category: business_safety
    check: >-
      side_work_minutes greater than 0 may only be recorded on a Shift whose JobRole has
      side_work_eligible == true
    error_id: ERR_SIDE_WORK_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /shifts"

  - priority: 31
    category: business_referential
    check: >-
      the shift's employee holds an EmployeeRoleAssignment for job_role_id whose date interval
      contains business_date
    error_id: ERR_NO_ACTIVE_ROLE_ASSIGNMENT
    http_status: 422
    applies_to: "POST /shifts"

  - priority: 32
    category: business_referential
    check: >-
      the Shift's location_id equals the Employee's location_id and the PayPeriod's location_id, and
      a Dispute's raised_by_employee_id matches the disputed PayLine's employee_id
    error_id: ERR_EMPLOYEE_LOCATION_MISMATCH
    http_status: 422
    applies_to: "POST /shifts, POST /disputes"

  - priority: 33
    category: business_referential
    check: "the pool's Location has exactly one TipPoolPolicy with status == ACTIVE to pin"
    error_id: ERR_NO_ACTIVE_POOL_POLICY
    http_status: 422
    applies_to: "POST /shift-tip-pools"

  - priority: 34
    category: business_referential
    check: >-
      every CLOSED Shift at the pool's (location_id, business_date) has declaration_status in
      {DECLARED, AMENDED}
    error_id: ERR_UNDECLARED_SHIFT_IN_POOL
    http_status: 422
    applies_to: "POST /shift-tip-pools"

  - priority: 35
    category: business_referential
    check: "every CLOSED Shift of the period has declaration_status in {DECLARED, AMENDED}"
    error_id: ERR_UNDECLARED_SHIFT_IN_PERIOD
    http_status: 422
    applies_to: "POST /pay-periods/{pay_period_id}/compute"

  - priority: 36
    category: business_referential
    check: >-
      every RECORDED ServiceChargeEvent inside the period whose resolved treatment == WAGES has at
      least one CLOSED Shift on its business_date to allocate against
    error_id: ERR_SERVICE_CHARGE_UNALLOCATABLE
    http_status: 422
    applies_to: "POST /pay-periods/{pay_period_id}/compute"

  - priority: 37
    category: business_referential
    check: >-
      supersedes_correction_id, when supplied, names a BackWageCorrection with status == PENDING on
      the same pay_line_id; and it is required whenever such a correction already exists on that line
    error_id: ERR_SUPERSEDE_TARGET_MISMATCH
    http_status: 422
    applies_to: "POST /back-wage-corrections"

  - priority: 38
    category: business_temporal
    check: >-
      the new Shift's half-open interval [start_at, end_at) does not intersect the interval of any
      non-VOIDED Shift of the same employee_id; touching endpoints are allowed
    error_id: ERR_SHIFT_OVERLAP
    http_status: 409
    applies_to: "POST /shifts"

  - priority: 39
    category: business_temporal
    check: >-
      the new PayPeriod's closed inclusive date interval [start_date, end_date] does not intersect
      the interval of any existing PayPeriod of the same location_id
    error_id: ERR_PAY_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /pay-periods"

  - priority: 40
    category: business_temporal
    check: >-
      the new EmployeeRoleAssignment's interval, treating a null effective_to as unbounded, does not
      intersect an existing assignment of the same employee_id and job_role_id
    error_id: ERR_ASSIGNMENT_OVERLAP
    http_status: 409
    applies_to: "POST /role-assignments"

  - priority: 41
    category: business_temporal
    check: "business_date is not after the logical clock date, and end_at is not after the logical clock instant"
    error_id: ERR_SHIFT_FUTURE_DATE
    http_status: 422
    applies_to: "POST /shifts, POST /service-charges"

  - priority: 42
    category: business_temporal
    check: >-
      business_date falls inside [PayPeriod.start_date, PayPeriod.end_date] of the named period, and
      start_at and end_at both fall on business_date or the calendar day after it
    error_id: ERR_BUSINESS_DATE_OUT_OF_PERIOD
    http_status: 422
    applies_to: "POST /shifts"

  - priority: 43
    category: business_temporal
    check: "end_date equals start_date plus exactly six days, so every period is one seven-day workweek"
    error_id: ERR_PAY_PERIOD_LENGTH
    http_status: 422
    applies_to: "POST /pay-periods"

  - priority: 44
    category: business_temporal
    check: >-
      the Employee has no separation_date, or the Shift's business_date is not after it and a new
      EmployeeRoleAssignment's effective_from is not after it, so a terminated employee's pre-separation
      history may still be recorded while no work may be dated past separation
    error_id: ERR_EMPLOYEE_SEPARATED
    http_status: 422
    applies_to: "POST /shifts, POST /role-assignments"

  - priority: 45
    category: business_constraint
    check: >-
      side_work_minutes does not exceed the shift's whole minutes, and
      max_continuous_side_work_minutes does not exceed side_work_minutes
    error_id: ERR_SIDE_WORK_EXCEEDS_SHIFT
    http_status: 422
    applies_to: "POST /shifts"

  - priority: 46
    category: business_constraint
    check: >-
      no ShiftTipPool with contribution_status == CONTRIBUTED already exists for the same
      (location_id, business_date)
    error_id: ERR_POOL_DATE_DUPLICATE
    http_status: 409
    applies_to: "POST /shift-tip-pools"

  - priority: 47
    category: business_constraint
    check: >-
      the employee has no other Dispute on the same pay_line_id with the same category whose status
      is not CLOSED
    error_id: ERR_DUPLICATE_DISPUTE_CATEGORY
    http_status: 409
    applies_to: "POST /disputes"

  - priority: 48
    category: business_constraint
    check: >-
      awarded_cents is required and must satisfy 0 < awarded_cents < claimed_amount_cents when
      resolution == PARTIALLY_UPHELD, and must be absent for UPHELD and DENIED
    error_id: ERR_PARTIAL_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /disputes/{dispute_id}/adjudicate"

  - priority: 49
    category: business_constraint
    check: "code is unique across all JobRole rows"
    error_id: ERR_DUPLICATE_JOB_ROLE_CODE
    http_status: 409
    applies_to: "POST /job-roles"

  - priority: 50
    category: business_fiscal
    check: >-
      declared_charged_tips_cents does not exceed the Shift's charged_sales_cents, since card tips
      cannot exceed the card sales that carried them
    error_id: ERR_DECLARED_CHARGED_TIPS_EXCEED_CHARGED_SALES
    http_status: 422
    applies_to: "POST /shifts/{shift_id}/declare-tips"

  - priority: 51
    category: business_fiscal
    check: >-
      charged_sales_cents does not exceed gross_sales_cents on a Shift, and a ServiceChargeEvent
      amount_cents is strictly greater than 0
    error_id: ERR_CHARGED_SALES_EXCEED_GROSS_SALES
    http_status: 422
    applies_to: "POST /shifts, POST /service-charges"

  - priority: 52
    category: business_fiscal
    check: >-
      total_contributed_cents + service_charge_tips_cents is strictly greater than 0 at pool creation
      and again at distribution, so an empty pool is never created or paid out
    error_id: ERR_EMPTY_POOL_NO_CONTRIBUTIONS
    http_status: 422
    applies_to: "POST /shift-tip-pools, POST /shift-tip-pools/{pool_id}/distribute"

  - priority: 53
    category: business_fiscal
    check: >-
      participant_count is strictly greater than 0 at distribution, so money is never stranded in a
      pool that has contributors but no eligible recipients
    error_id: ERR_NO_ELIGIBLE_PARTICIPANTS
    http_status: 422
    applies_to: "POST /shift-tip-pools/{pool_id}/distribute"

  - priority: 54
    category: business_fiscal
    check: >-
      amount_cents does not exceed Dispute.adjudicated_amount_cents when dispute_id is supplied, and
      is strictly greater than 0
    error_id: ERR_CORRECTION_EXCEEDS_CLAIM
    http_status: 422
    applies_to: "POST /back-wage-corrections"

  - priority: 55
    category: business_fiscal
    check: >-
      the sum of amount_cents over the line's APPLIED corrections plus this one does not exceed
      PayLine.minimum_wage_obligation_cents
    error_id: ERR_CORRECTION_EXCEEDS_OBLIGATION
    http_status: 422
    applies_to: "POST /back-wage-corrections/{correction_id}/apply"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/locations"
    description: "Register a restaurant unit with its state wage rules, tip-credit posture and card-fee policy"
    roles: [PayrollAdmin]
    code: 201
