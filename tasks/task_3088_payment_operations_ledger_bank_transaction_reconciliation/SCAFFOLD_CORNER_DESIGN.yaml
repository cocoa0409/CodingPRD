          allowed_rails: []
        as: LedgerController
      trigger:
      - call: POST /payment-orders
        payload:
          legal_entity_id: ${c25_entity}
          ledger_id: ${c25_ledger}
          counterparty_id: ${c25_cp}
          source_account_id: ${c25_acct}
          rail: ACH
          direction: CREDIT
          amount_cents: 1000
          idempotency_key: idem-c25
          payable_to_name: Quiet Co
        as: PaymentInitiator
        captures:
          c25_err: $.data.error_id
      assert:
      - the response is 409 and error_id == ERR_CALENDAR_HAS_NO_OPEN_CYCLE
      - 'no order row is created: GET /payment-orders?ledger_id=${c25_ledger} returns 0 rows'
      - publishing a fifth open cell for 2026-09-05 makes the identical create return 201 with a populated cutoff_snapshot_utc
