          - state_machines.ExportClassification.LICENSE_APPROVED_to_LICENSE_DENIED
          - state_machines.WorkOrder.compliance_status
          - state_machines.Assembly.ALIGNED_to_EXPORT_BLOCKED
          - endpoints.POST_/optics/export-classifications/{id}/revocation
          - entities.ExportClassification.fields.decision_note
          - conventions.governing_export_classification
        distinguishing_aspect: |
          Revoking an already-approved licence walks three hops in one request: the classification falls
          LICENSE_APPROVED -> LICENSE_DENIED with decision_note set to the revocation reason, the work
          order's compliance_status falls CLEARED -> BLOCKED while its process_status stays
          RELEASED_TO_ASSEMBLY, and the ALIGNED assembly holding that order's ACTIVE elements becomes
          EXPORT_BLOCKED — the components stay ACTIVE and total_transmitted_wavefront_waves stays 0.1049,
          because an export block is a paperwork state, not a re-measurement.
        test_recipe:
          setup:
            - "Exactly the ALIGNED-assembly state of the cement-derate chain: design OD-2540-A RELEASED, ExportClassification for DE in LICENSE_APPROVED with licence BIS-2540-001, WorkOrder WO-2540-1 in RELEASED_TO_ASSEMBLY / CLEARED, Assembly AS-2540-1 in ALIGNED with two ACTIVE components."
            - "Logical clock untouched at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
