scaffold_corner_design:
  - section: entities
    instances:
      - name: species_profile_creation_returns_full_row_with_derived_shrink
        claim_type: creation
        grounds: ["entities.SpeciesProfile", "endpoints.POST /mill/species-profiles", "calculations.dry_yield_conversion"]
        distinguishing_aspect: "A create with all six required inputs returns 201 and every declared field, including the derived green_to_dry_shrink_pct for DENSE."
        test_recipe:
          setup: ["Empty database with the logical clock pinned."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
          trigger:
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin }
          assert:
            - "Response status 201."
            - "data.species_code == \"RED_OAK\", data.common_name == \"Red Oak\", data.density_class == \"DENSE\"."
            - "data.tangential_shrinkage_coefficient == 0.145, data.target_moisture_pct == 7.0, data.max_moisture_gradient_pp == 2.0."
            - "data.green_to_dry_shrink_pct == 7.5, derived from density_class DENSE and not supplied by the caller."
            - "meta.api_request_id and meta.api_request_timestamp are present and response_type == \"object\"."

      - name: species_profile_retrieval_returns_stored_row
        claim_type: retrieval
        grounds: ["endpoints.GET /mill/species-profiles/{species_profile_id}"]
        distinguishing_aspect: "A GET by id returns the same field values the create returned, including the derived shrink percentage."
        test_recipe:
          setup: ["One MEDIUM species profile created."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "HARD_MAPLE", common_name: "Hard Maple", density_class: "MEDIUM", tangential_shrinkage_coefficient: 0.158, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id" } }
          trigger:
            - { call: "GET /mill/species-profiles/${species_id}", payload: {}, as: KilnOperator }
          assert:
            - "Response status 200 with data.id == the created id."
            - "data.species_code == \"HARD_MAPLE\" and data.green_to_dry_shrink_pct == 6.0."
            - "data.version == 1 because no drying schedule has been created against the profile yet."

      - name: green_receipt_listing_paginates_and_filters
        claim_type: listing
        grounds: ["endpoints.GET /mill/green-receipts", "response_envelope.pagination_fields"]
        distinguishing_aspect: "Three receipts across two species: limit/offset paging reports total_count and has_more, a species filter narrows the set, and limit 0 is rejected."
        test_recipe:
          setup: ["Two species profiles; two RED_OAK receipts and one HARD_MAPLE receipt."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { oak_id: "$.data.id" } }
            - { call: "POST /mill/species-profiles", payload: { species_code: "HARD_MAPLE", common_name: "Hard Maple", density_class: "MEDIUM", tangential_shrinkage_coefficient: 0.158, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { maple_id: "$.data.id" } }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${oak_id}", supplier_name: "Ridgeline Logging", received_board_feet: 6000, receipt_grade: "FAS", moisture_pct_at_receipt: 46.0 }, as: ProcurementClerk }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${oak_id}", supplier_name: "Ridgeline Logging", received_board_feet: 4000, receipt_grade: "SELECT", moisture_pct_at_receipt: 44.0 }, as: ProcurementClerk }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${maple_id}", supplier_name: "Northern Hardwoods", received_board_feet: 5200, receipt_grade: "NO1_COMMON", moisture_pct_at_receipt: 40.0 }, as: ProcurementClerk }
          trigger:
            - { call: "GET /mill/green-receipts", payload: { limit: 2, offset: 0 }, as: MillSupervisor }
            - { call: "GET /mill/green-receipts", payload: { limit: 2, offset: 2 }, as: MillSupervisor }
            - { call: "GET /mill/green-receipts", payload: { species_profile_id: "${maple_id}" }, as: MillSupervisor }
            - { call: "GET /mill/green-receipts", payload: { limit: 0 }, as: MillSupervisor }
          assert:
            - "First page: status 200, response_type == \"array\", 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0."
            - "Second page: 1 row, total_count == 3, has_more == false; the two pages together contain all three created ids with no repeats."
            - "Species filter: 1 row, total_count == 1, and that row's species_profile_id == the HARD_MAPLE id."
            - "limit 0: status 400 with data.error_id == \"ERR_INVALID_REQUEST\" (limit must be in [1, 100])."

      - name: kiln_charge_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_CHARGE_NOT_FOUND]", "validations[priority 6]"]
        distinguishing_aspect: "A syntactically valid but unknown kiln_charge_id yields the charge-specific 404 code, not the generic config code."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
          trigger:
            - { call: "GET /mill/kiln-charges/00000000-0000-0000-0000-00000000c0de", payload: {}, as: KilnOperator }
          assert:
            - "Response status 404 with data.error_id == \"ERR_CHARGE_NOT_FOUND\" and response_type == \"error\"."
            - "data.error_id is NOT \"ERR_CONFIG_NOT_FOUND\"."

      - name: green_receipt_missing_required_moisture_rejected
        claim_type: required_fields
        grounds: ["entities.GreenReceipt.moisture_pct_at_receipt", "validations[priority 3]"]
        distinguishing_aspect: "Omitting the required moisture reading fails schema validation before any row is written."
        test_recipe:
          setup: ["One species profile."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id" } }
          trigger:
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 6000, receipt_grade: "FAS" }, as: ProcurementClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "Response status 400 with data.error_id == \"ERR_INVALID_REQUEST\"."
            - "GET /mill/green-receipts returns total_count 0 - no partial row was persisted."

      - name: green_receipt_defaults_applied_on_create
        claim_type: defaults
        grounds: ["entities.GreenReceipt.status", "entities.GreenReceipt.accepted_board_feet", "entities.GreenReceipt.kiln_charge_id"]
        distinguishing_aspect: "A create that supplies only the five required inputs leaves accepted_board_feet at 0, status RECEIVED and both nullable system fields null."
        test_recipe:
          setup: ["One species profile."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id" } }
          trigger:
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 6000, receipt_grade: "FAS", moisture_pct_at_receipt: 46.0 }, as: ProcurementClerk }
          assert:
            - "Response status 201 with data.status == \"RECEIVED\" (the declared initial state)."
            - "data.accepted_board_feet == 0, data.kiln_charge_id == null, data.rejection_reason == null."
            - "data.received_board_feet == 6000 is stored exactly as supplied."

      - name: drying_schedule_planned_hours_client_input_ignored
        claim_type: computed_fields
        grounds: ["entities.DryingSchedule.planned_dry_hours", "calculations.kiln_schedule_duration"]
        distinguishing_aspect: "A caller-supplied planned_dry_hours is ignored; the stored value is the formula result 265.0, not the 99.9 sent."
        test_recipe:
          setup: ["One DENSE species profile at version 1."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id", species_v: "$.data.version" } }
          trigger:
            - { call: "POST /mill/drying-schedules", payload: { species_profile_id: "${species_id}", schedule_code: "RO-100", thickness_in: 1.00, initial_moisture_pct: 45.0, final_moisture_pct: 7.0, conditioning_hours: 24, stress_relief_hours: 12, planned_dry_hours: 99.9, expected_species_profile_version: "${species_v}" }, as: MillAdmin }
          assert:
            - "Response status 201 with data.planned_dry_hours == 265.0, not 99.9."
            - "GET /mill/species-profiles/{species_id} now shows version == 2, bumped by the successful create."

      - name: species_profile_system_fields_are_server_generated
        claim_type: system_fields
        grounds: ["entities.SpeciesProfile", "response_envelope.success"]
        distinguishing_aspect: "id, created_at, updated_at and version are all present on a fresh create with version starting at 1."
        test_recipe:
          setup: ["Empty database with the logical clock pinned to 2026-08-01T00:00:00.000Z."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
          trigger:
            - { call: "POST /mill/species-profiles", payload: { species_code: "WHITE_OAK", common_name: "White Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.137, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id", created: "$.data.created_at" } }
          assert:
            - "Response status 201; data.id is a server-generated uuid the request never supplied."
            - "data.created_at == data.updated_at == \"2026-08-01T00:00:00.000Z\" (the logical clock)."
            - "data.version == 1."

      - name: green_receipt_invalid_enum_grade_rejected
        claim_type: type_constraints
        grounds: ["entities.GreenReceipt.receipt_grade", "validations[priority 3]"]
        distinguishing_aspect: "A grade outside the four declared enum values is rejected at schema validation, not stored as free text."
        test_recipe:
          setup: ["One species profile."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id" } }
          trigger:
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 6000, receipt_grade: "PREMIUM", moisture_pct_at_receipt: 46.0 }, as: ProcurementClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "Response status 400 with data.error_id == \"ERR_INVALID_REQUEST\"."
            - "GET /mill/green-receipts returns total_count 0."

      - name: grade_bundle_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds: ["entities.GradeBundle", "endpoints.POST /mill/grade-runs/{grade_run_id}/bundles", "endpoints.GET /mill/grade-runs/{grade_run_id}/bundles"]
        distinguishing_aspect: "GradeBundle declares common_fields false: the created bundle exposes only id and created_at as system fields, has no version or updated_at, and §1.5 offers no update or delete route for it."
        test_recipe:
          setup: ["A MILLED lot (input 6000, net 4680) with a DRAFT MILL_CHARACTER grade run."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id", species_v: "$.data.version" } }
            - { call: "POST /mill/drying-schedules", payload: { species_profile_id: "${species_id}", schedule_code: "RO-100", thickness_in: 1.00, initial_moisture_pct: 45.0, final_moisture_pct: 7.0, conditioning_hours: 24, stress_relief_hours: 12, expected_species_profile_version: "${species_v}" }, as: MillAdmin, captures: { sched_id: "$.data.id" } }
            - { call: "POST /mill/kiln-chambers", payload: { chamber_code: "K1", capacity_board_feet: 12000 }, as: MillAdmin, captures: { chamber_id: "$.data.id" } }
            - { call: "POST /mill/kiln-charges", payload: { drying_schedule_id: "${sched_id}", kiln_chamber_id: "${chamber_id}", planned_start_utc: "2026-08-05T00:00:00.000Z" }, as: KilnOperator, captures: { charge_a: "$.data.id" } }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 6000, receipt_grade: "FAS", moisture_pct_at_receipt: 46.0 }, as: ProcurementClerk, captures: { r1: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r1}/accept", payload: { accepted_board_feet: 5800 }, as: ProcurementClerk }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 4000, receipt_grade: "SELECT", moisture_pct_at_receipt: 44.0 }, as: ProcurementClerk, captures: { r2: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r2}/accept", payload: { accepted_board_feet: 3900 }, as: ProcurementClerk }
            - { call: "POST /mill/kiln-charges/${charge_a}/allocate_receipt", payload: { green_receipt_id: "${r1}" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/allocate_receipt", payload: { green_receipt_id: "${r2}" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/load", payload: {}, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/start_drying", payload: {}, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/begin_conditioning", payload: {}, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/record_stress_test", payload: { shell_moisture_pct: 6.4, core_moisture_pct: 8.2 }, as: KilnOperator }
            - { call: "POST /mill/product-lines", payload: { line_code: "SOLID-RO-325", species_profile_id: "${species_id}", construction_type: "SOLID", nominal_width_in: 3.250, nominal_thickness_in: 0.750, material_value_cents_per_sf: 895, warranty_funded_total_cents: 600000 }, as: MillAdmin, captures: { line_id: "$.data.id" } }
            - { call: "POST /mill/flooring-lots", payload: { product_line_id: "${line_id}", kiln_charge_id: "${charge_a}", input_dry_bf: 6000 }, as: MillSupervisor, captures: { lot_id: "$.data.id" } }
            - { call: "POST /mill/flooring-lots/${lot_id}/complete_milling", payload: { actual_milled_width_in: 3.190, net_flooring_bf: 4680, shorts_bf: 180, sawdust_tons: 1.20, shavings_tons: 0.80 }, as: MillSupervisor, captures: { lot_v2: "$.data.version" } }
            - { call: "POST /mill/grade-runs", payload: { flooring_lot_id: "${lot_id}", inspector_ruleset: "MILL_CHARACTER", expected_lot_version: "${lot_v2}" }, as: GradeInspector, captures: { run_id: "$.data.id" } }
          trigger:
            - { call: "POST /mill/grade-runs/${run_id}/bundles", payload: { grade_class: "CLEAR", bundle_board_feet: 1187.25, average_length_in: 50 }, as: GradeInspector, captures: { bundle_id: "$.data.id" } }
          assert:
            - "Response status 201 with data.id and data.created_at present."
            - "The bundle payload carries no version and no updated_at field - GradeBundle declares common_fields false."
            - "data.length_factor == 1.07, data.credit_factor == 1.00, data.tally_value_cents == 813029."
            - "GET /mill/grade-runs/{run_id}/bundles returns total_count 1 and the same immutable values."
            - "§1.5 declares no PUT, PATCH or DELETE route on bundles, so the row cannot be edited after creation."

      - name: grade_bundle_listing_filters_by_grade_class
        claim_type: listing
        grounds: ["endpoints.GET /mill/grade-runs/{grade_run_id}/bundles"]
        distinguishing_aspect: "The sub-resource listing scopes to one run and narrows further by grade_class."
        test_recipe:
          setup: ["A DRAFT MILL_CHARACTER run on a MILLED lot (net 4680) carrying one CLEAR and two CHARACTER bundles."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id", species_v: "$.data.version" } }
            - { call: "POST /mill/drying-schedules", payload: { species_profile_id: "${species_id}", schedule_code: "RO-100", thickness_in: 1.00, initial_moisture_pct: 45.0, final_moisture_pct: 7.0, conditioning_hours: 24, stress_relief_hours: 12, expected_species_profile_version: "${species_v}" }, as: MillAdmin, captures: { sched_id: "$.data.id" } }
            - { call: "POST /mill/kiln-chambers", payload: { chamber_code: "K1", capacity_board_feet: 12000 }, as: MillAdmin, captures: { chamber_id: "$.data.id" } }
            - { call: "POST /mill/kiln-charges", payload: { drying_schedule_id: "${sched_id}", kiln_chamber_id: "${chamber_id}", planned_start_utc: "2026-08-05T00:00:00.000Z" }, as: KilnOperator, captures: { charge_a: "$.data.id" } }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 6000, receipt_grade: "FAS", moisture_pct_at_receipt: 46.0 }, as: ProcurementClerk, captures: { r1: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r1}/accept", payload: { accepted_board_feet: 5800 }, as: ProcurementClerk }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 4000, receipt_grade: "SELECT", moisture_pct_at_receipt: 44.0 }, as: ProcurementClerk, captures: { r2: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r2}/accept", payload: { accepted_board_feet: 3900 }, as: ProcurementClerk }
            - { call: "POST /mill/kiln-charges/${charge_a}/allocate_receipt", payload: { green_receipt_id: "${r1}" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/allocate_receipt", payload: { green_receipt_id: "${r2}" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/load", payload: {}, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/start_drying", payload: {}, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/begin_conditioning", payload: {}, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/record_stress_test", payload: { shell_moisture_pct: 6.4, core_moisture_pct: 8.2 }, as: KilnOperator }
            - { call: "POST /mill/product-lines", payload: { line_code: "SOLID-RO-325", species_profile_id: "${species_id}", construction_type: "SOLID", nominal_width_in: 3.250, nominal_thickness_in: 0.750, material_value_cents_per_sf: 895, warranty_funded_total_cents: 600000 }, as: MillAdmin, captures: { line_id: "$.data.id" } }
            - { call: "POST /mill/flooring-lots", payload: { product_line_id: "${line_id}", kiln_charge_id: "${charge_a}", input_dry_bf: 6000 }, as: MillSupervisor, captures: { lot_id: "$.data.id" } }
            - { call: "POST /mill/flooring-lots/${lot_id}/complete_milling", payload: { actual_milled_width_in: 3.190, net_flooring_bf: 4680, shorts_bf: 180, sawdust_tons: 1.20, shavings_tons: 0.80 }, as: MillSupervisor, captures: { lot_v2: "$.data.version" } }
            - { call: "POST /mill/grade-runs", payload: { flooring_lot_id: "${lot_id}", inspector_ruleset: "MILL_CHARACTER", expected_lot_version: "${lot_v2}" }, as: GradeInspector, captures: { run_id: "$.data.id" } }
            - { call: "POST /mill/grade-runs/${run_id}/bundles", payload: { grade_class: "CLEAR", bundle_board_feet: 1000.00, average_length_in: 50 }, as: GradeInspector }
            - { call: "POST /mill/grade-runs/${run_id}/bundles", payload: { grade_class: "CHARACTER", bundle_board_feet: 400.00, average_length_in: 20 }, as: GradeInspector }
            - { call: "POST /mill/grade-runs/${run_id}/bundles", payload: { grade_class: "CHARACTER", bundle_board_feet: 300.00, average_length_in: 20 }, as: GradeInspector }
          trigger:
            - { call: "GET /mill/grade-runs/${run_id}/bundles", payload: {}, as: MillSupervisor }
            - { call: "GET /mill/grade-runs/${run_id}/bundles", payload: { grade_class: "CHARACTER" }, as: MillSupervisor }
          assert:
            - "Unfiltered: status 200, total_count == 3, has_more == false."
            - "Filtered on CHARACTER: total_count == 2 and both rows have grade_class \"CHARACTER\" with credit_factor 0.60."
            - "The CLEAR bundle's tally_value_cents == 684800 (1000.00 * 640 * 1.07) and the 400.00 bf CHARACTER bundle's == 79680 (400 * 240 * 0.83)."

      - name: flooring_lot_unknown_core_stock_returns_config_not_found
        claim_type: parent_relationships
        grounds: ["entities.FlooringLot.core_stock_id", "validations[priority 4]", "errors[ERR_CONFIG_NOT_FOUND]"]
        distinguishing_aspect: "An unknown core_stock_id is a configuration-existence failure (404) and outranks the SOLID/ENGINEERED pairing rules at priority 30."
        test_recipe:
          setup: ["A RELEASED charge and a SOLID product line."]
          setup_api_calls:
