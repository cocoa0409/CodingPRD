            - call: "POST /compliance/business-units"
              payload: { name: "Industrial Coatings EMEA", market_code: "EU-COAT", market_share_bps: 1200, interaction_point_count: 4, competitor_overlap_pct: 25, exposure_budget_points: 200, review_minutes_budget: 480 }
