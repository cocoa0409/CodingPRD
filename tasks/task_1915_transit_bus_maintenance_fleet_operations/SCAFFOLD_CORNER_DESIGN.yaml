            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-08-10", planned_end_date: "2026-08-11", estimated_labor_hours: 1, estimated_cost_cents: 6500, expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id } }
          trigger:
