      - name: warranty_reserve_ledger_conserves_total_across_claim_approval_and_reversal
        grounds:
          - entities.ConnectedUnit.fields.reserve_balance_cents
          - entities.ConnectedUnit.fields.claims_paid_cents
          - entities.ConnectedUnit.fields.reserve_initial_cents
          - state_machines.WarrantyClaim.APPROVED_to_REVERSED
          - state_machines.ConnectedUnit.GRACE_to_ACTIVE
        distinguishing_aspect: |
          A two-column conservation law on a money ledger rather than a single reserved-capacity
          counter: reserve_balance_cents + claims_paid_cents must equal reserve_initial_cents at
          every instant. The compensation is also deeper than the slot case, because reversing the
          reserve-exhausting claim must additionally undo the coverage side effect it caused,
          returning the unit GRACE -> ACTIVE and clearing grace_expires_on to null while the
          untouched earlier claim keeps its own 150000 payout.
