  - section: errors
    instances:
      - name: board_review_refuses_early_advance_and_irregular_ballots
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PUBLIC_COMMENT_OPEN]
          - errors[ERR_INITIATOR_CANNOT_VOTE]
          - errors[ERR_DUPLICATE_BALLOT]
        distinguishing_aspect: "Three separate procedural guards on one case: the comment period must actually close before board review opens (the closing instant itself qualifies), the initiator may recuse but may not vote APPROVE or DENY, and each member_user_id gets exactly one ballot."
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z; a SALE deaccession case initiated by mgr-1 with comment_days 7, already advanced to PUBLIC_COMMENT"
          setup_api_calls:
            - call: "POST /public-art/artists"
