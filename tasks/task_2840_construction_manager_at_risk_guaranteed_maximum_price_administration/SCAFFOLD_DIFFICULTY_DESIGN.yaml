            - call: "POST /gmp-proposals"
              payload: { project_id: "${proj}", based_on_estimate_id: "${est}", cost_of_work_total: 3000000.00, general_conditions_total: 200000.00, owner_contingency_amount: 100000.00, construction_contingency_amount: 240000.00, expected_project_version: "${projv2}" }
