  - rule_id: boundary_precision_check
    instances:
      - name: specimen_minimum_exactly_at_declared_less_tolerance_conforms
        grounds:
          - calculations.thermal_conformance_verdict
          - entities.ThermalTest.min_r_value
          - entities.ThermalTest.mean_r_value
          - state_machines.ThermalTest.COMPLETED_to_IN_LAB
        distinguishing_aspect: |
          The two attempts differ by 0.001 in a single specimen and produce the SAME
          mean_r_value (12.900), so the verdict flip is attributable to min_r_value
          against the exact threshold declared_r_value_at_test - r_value_tolerance
          = 13.0 - 0.30 = 12.70 and to nothing else. A float implementation that
          computes 13.0 - 0.30 as 12.699999999999999 accepts attempt 1, and one that
          rounds specimens to 2 decimals before comparing also accepts attempt 1;
          both are caught. The comparison must be >= , not > .
        test_recipe:
          setup:
            - "Program RCERT-PS has conformance_basis PER_SPECIMEN, r_value_tolerance 0.30, min_specimen_count 3 and retest_limit 2."
            - "SKU PL-A declares declared_r_value 13.0, so the conformance floor is exactly 12.70."
            - "Run RUN-A has reached PACKAGED. ThermalTest TEST-1 was taken IN_LAB and its first result [12.699, 13.10, 12.90] was recorded, giving attempt_number 1, min_r_value 12.699, mean_r_value 12.900 and conformance_verdict NONCONFORMING."
            - "A retest was requested over [2026-08-05T13:00:00Z, 2026-08-05T17:00:00Z], clearing specimen_r_values and returning the row to IN_LAB at attempt_number 2."
