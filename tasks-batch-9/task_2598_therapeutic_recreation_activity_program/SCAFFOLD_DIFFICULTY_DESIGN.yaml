          assert:
            - "ActivitySession.${sess_id}.status == CANCELLED"
            - "ParticipationRecord.${rec_id}.status == VOID"
            - "VolunteerAssignment.${asg_id}.status == WITHDRAWN"
            - "VolunteerAssignment.${asg_id}.withdrawn_reason == SESSION_CANCELLED"
            - "Volunteer.${vol_id}.scheduled_hours_week == 0.0"
            - "Volunteer.${vol_id}.credited_service_hours == 0.0"
            - "Volunteer.${vol_id}.status == CLEARED"
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_outranks_staffing_on_cancelled_session
        higher_priority: 11
        lower_priority: 50
        grounds:
          - validations.priority_11_ERR_SESSION_INVALID_STATE
          - validations.priority_50_ERR_STAFFING_RATIO_EXCEEDED
          - calculations.session_staffing_requirement
        distinguishing_aspect: |
          Category pair state (11) vs business_fiscal (50). A single enrollment request violates
          both rules at once: the session has already been cancelled AND admitting the TIER_3
          resident would require 3 staff against the 1 assigned. Only the priority-11 error may
          surface. An implementation that runs the ratio arithmetic before the status guard leaks
          ERR_STAFFING_RATIO_EXCEEDED.
        test_recipe:
          setup:
            - "one ADMITTED resident, SEVERE_IMPAIRMENT + ASSIST_2 so supervision_tier == TIER_3"
            - "one PHYSICAL program with staffing_ratio_denominator 1, max_group_size 10 and max_supervision_tier TIER_3, so the tier itself is supported and only the ratio bites"
            - "one session with assigned_staff_count 1, then CANCELLED before any enrollment exists"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Walter Krupa", room_number: "230A", admission_date: "2026-01-30" }
              as: ActivityDirector
              captures: { res_id: $.data.id }
            - call: "POST /recreation/residents/${res_id}/assessments"
              payload: { cognitive_level: "SEVERE_IMPAIRMENT", functional_mobility: "ASSIST_2", interest_domains: ["PHYSICAL"], preferred_group_size: "ONE_TO_ONE", effective_date: "2026-07-20" }
              as: RecreationTherapist
            - call: "POST /recreation/programs"
              payload: { name: "Range of Motion", domain: "PHYSICAL", staffing_ratio_denominator: 1, max_group_size: 10, max_supervision_tier: "TIER_3" }
              as: ActivityDirector
              captures: { prog_id: $.data.id }
            - call: "POST /recreation/rooms"
              payload: { name: "Therapy Gym", capacity: 10, buffer_minutes: 0 }
              as: ActivityDirector
              captures: { room_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-08-07T10:00:00Z", ends_at: "2026-08-07T11:00:00Z", assigned_staff_count: 1 }
              as: ActivityDirector
              captures: { sess_id: $.data.id }
            - call: "POST /recreation/sessions/${sess_id}/status"
              payload: { action: "CANCEL", cancel_reason: "Staff callout" }
              as: ActivityDirector
          trigger:
            - call: "POST /recreation/sessions/${sess_id}/enrollments"
              payload: { resident_id: "${res_id}" }
              as: ActivityAide
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409"
            - "${err_id} == \"ERR_SESSION_INVALID_STATE\""
            - "${err_id} != \"ERR_STAFFING_RATIO_EXCEEDED\", even though admitting this TIER_3 resident at staffing_ratio_denominator 1 would need required_staff_count 3 against assigned_staff_count 1"
            - "ActivitySession.${sess_id}.enrolled_count == 0"
            - "ActivitySession.${sess_id}.weighted_supervision_load == 0.0"
            - "ActivitySession.${sess_id}.status == CANCELLED"
      - name: safety_gate_outranks_duplicate_enrollment
        higher_priority: 38
        lower_priority: 45
        grounds:
          - validations.priority_38_ERR_ENROLLMENT_GATED
          - validations.priority_45_ERR_DUPLICATE_ENROLLMENT
          - entities.Resident.fields.enrollment_gate
        distinguishing_aspect: |
          A different category pair — business_safety (38) vs business_referential (45) — on the
          same endpoint but reached by a different route. The resident already holds a live
          PLANNED record on a still-SCHEDULED session (so the duplicate rule is genuinely
          violated) and the resident's plan has since gone UNDER_REVISION (so the therapy gate is
          also violated). The clinical gate must win over the bookkeeping duplicate.
        test_recipe:
          setup:
            - "one ADMITTED resident, MILD_IMPAIRMENT + ASSIST_1 so supervision_tier == TIER_1"
            - "one ActivityPlan taken DRAFT -> ACTIVE for that resident"
            - "one SOCIAL session, still SCHEDULED, with the resident already enrolled once (a non-VOID PLANNED ParticipationRecord)"
            - "the plan is then moved to UNDER_REVISION with review_reason THERAPIST_REQUEST, which sets Resident.enrollment_gate = THERAPIST_REVIEW"
            - "the repeat enrollment is sent as ActivityAide with no gate_override_reason, so it cannot satisfy the priority-38 escape hatch"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Nadia Farrow", room_number: "225B", admission_date: "2026-02-08" }
              as: ActivityDirector
              captures: { res_id: $.data.id }
            - call: "POST /recreation/residents/${res_id}/assessments"
              payload: { cognitive_level: "MILD_IMPAIRMENT", functional_mobility: "ASSIST_1", interest_domains: ["SOCIAL"], preferred_group_size: "SMALL", effective_date: "2026-07-20" }
              as: RecreationTherapist
