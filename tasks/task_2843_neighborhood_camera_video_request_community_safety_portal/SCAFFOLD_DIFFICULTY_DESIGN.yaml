      - name: share_gated_on_device_status_while_solicitation_stays_open
        grounds:
          - validations[priority=19]
          - errors.ERR_DEVICE_DECOMMISSIONED
          - endpoints[PATCH /neighborhood-safety/devices/{id}]
          - entities.Device.fields.status
          - entities.Device.fields.pending_solicitation_count
          - state_machines.ConsentSolicitation.status.SOLICITED_to_EXPIRED
        distinguishing_aspect: |
          A different entity pair, (ConsentSolicitation, Device), and the dependency runs the
          opposite way round: here the parent is deliberately NOT cascaded. Decommissioning the
          camera leaves its solicitation in SOLICITED and leaves
          Device.pending_solicitation_count untouched, so the solicitation looks answerable in
          every field of its own row and only the Device's status makes the share illegal. The
          solicitation is then closed by the retention sweep at its deadline rather than by the
          decommission, which is what distinguishes "blocked by another entity's state" from
          "resolved by another entity's state". A sibling camera that is still ACTIVE shares
          successfully in the same trigger block as the control.
