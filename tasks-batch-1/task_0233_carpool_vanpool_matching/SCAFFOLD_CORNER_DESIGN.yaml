# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Carpool & Vanpool Matching — Expert tier (breadth probe)
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_employer_program_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.EmployerProgram, endpoints]
        distinguishing_aspect: "POST /employer-programs with all required fields returns 201; status defaults ACTIVE, subsidy_consumed_cents 0, grh_max_events_per_year default 4."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /employer-programs"
              payload: { employer_name: "Acme", hov_discount_pct: 0.50, employer_match_pct: 0.30, monthly_benefit_cap_cents: 31500, grh_annual_cap_cents: 20000, grh_per_event_cap_cents: 6000, subsidy_budget_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id, st: $.data.status, consumed: $.data.subsidy_consumed_cents, maxev: $.data.grh_max_events_per_year }
          assert:
            - "st == ACTIVE"
            - "consumed == 0"
            - "maxev == 4"

      - name: get_member_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Member
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /members/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformOps
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: create_member_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Member
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /members without full_name (an input field with no default) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["program exists"]
          setup_api_calls:
            - call: "POST /employer-programs"
              payload: { employer_name: "Acme", hov_discount_pct: 0.50, employer_match_pct: 0.30, monthly_benefit_cap_cents: 31500, grh_annual_cap_cents: 20000, grh_per_event_cap_cents: 6000, subsidy_budget_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", home_zone: "Z-N", work_zone: "Z-DT" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: member_defaults_applied_when_optional_omitted
        claim_type: Defaults
        grounds: [entities.Member.fields.can_drive, entities.Member.fields.wallet_balance_cents, entities.Member.fields.reliability_score]
        distinguishing_aspect: "POST /members omitting can_drive and wallet_balance_cents yields can_drive false, wallet_balance_cents 0, reliability_score 100.0."
        test_recipe:
          setup: ["program exists"]
          setup_api_calls:
            - call: "POST /employer-programs"
              payload: { employer_name: "Acme", hov_discount_pct: 0.50, employer_match_pct: 0.30, monthly_benefit_cap_cents: 31500, grh_annual_cap_cents: 20000, grh_per_event_cap_cents: 6000, subsidy_budget_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "Rae", home_zone: "Z-N", work_zone: "Z-DT" }
              as: ProgramAdmin
              captures: { can_drive: $.data.can_drive, wallet: $.data.wallet_balance_cents, rel: $.data.reliability_score }
          assert:
            - "can_drive == false"
            - "wallet == 0"
            - "rel == 100.0"

      - name: pool_seat_capacity_computed_from_vehicle_ignores_input
        claim_type: Computed Fields
        grounds: [entities.Pool.fields.seat_capacity, entities.Vehicle.fields.seat_capacity]
        distinguishing_aspect: "Pool.seat_capacity is computed (copied from the linked Vehicle.seat_capacity at creation); a vehicle with seat_capacity 6 yields Pool.seat_capacity 6, committed_seat_count 0."
        test_recipe:
          setup: ["program + driving member + vehicle seat_capacity 6"]
          setup_api_calls:
            - call: "POST /employer-programs"
              payload: { employer_name: "Acme", hov_discount_pct: 0.50, employer_match_pct: 0.30, monthly_benefit_cap_cents: 31500, grh_annual_cap_cents: 20000, grh_per_event_cap_cents: 6000, subsidy_budget_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "Dee", home_zone: "Z-N", work_zone: "Z-DT", can_drive: true }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_member_id: "${drv_id}", plate: "VAN-1", seat_capacity: 6 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /pools"
              payload: { employer_program_id: "${prog_id}", driver_member_id: "${drv_id}", vehicle_id: "${veh_id}", kind: "VANPOOL", origin_zone: "Z-N", dest_zone: "Z-DT", departure_days: ["MON","TUE","WED","THU","FRI"], base_cost_cents: 2000, per_mile_cents: 120 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { cap: $.data.seat_capacity, committed: $.data.committed_seat_count, st: $.data.status }
          assert:
            - "cap == 6"
            - "committed == 0"
            - "st == FORMING"

      - name: match_request_invalid_window_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.MatchRequest.fields.earliest_departure_min
          - entities.MatchRequest.fields.latest_departure_min
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /match-requests with latest_departure_min (400) < earliest_departure_min (600) violates the range constraint -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["program + rider exist"]
          setup_api_calls:
            - call: "POST /employer-programs"
              payload: { employer_name: "Acme", hov_discount_pct: 0.50, employer_match_pct: 0.30, monthly_benefit_cap_cents: 31500, grh_annual_cap_cents: 20000, grh_per_event_cap_cents: 6000, subsidy_budget_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "Rae", home_zone: "Z-N", work_zone: "Z-DT" }
              as: ProgramAdmin
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /match-requests"
              payload: { rider_member_id: "${r_id}", origin_zone: "Z-N", dest_zone: "Z-DT", needed_days: ["MON"], earliest_departure_min: 600, latest_departure_min: 400 }
              as: Rider
              as_user_id: "${r_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: subsidy_ledger_entry_is_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.SubsidyLedgerEntry]
        distinguishing_aspect: "SubsidyLedgerEntry has common_fields false (id + created_at only, no version, no update endpoint); it is only readable via GET /subsidy-ledger-entries and GET /employer-programs/{id}/ledger."
        test_recipe:
          setup: ["program with one finalized reservation produced a DEBIT ledger row"]
          setup_api_calls:
            - call: "POST /employer-programs"
              payload: { employer_name: "Acme", hov_discount_pct: 0.50, employer_match_pct: 0.30, monthly_benefit_cap_cents: 100000, grh_annual_cap_cents: 20000, grh_per_event_cap_cents: 6000, subsidy_budget_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "Dee", home_zone: "Z-N", work_zone: "Z-DT", can_drive: true }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "Rae", home_zone: "Z-N", work_zone: "Z-DT", wallet_balance_cents: 50000 }
              as: ProgramAdmin
              captures: { r_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_member_id: "${drv_id}", plate: "VAN-1", seat_capacity: 6, hov_eligible: true }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /pools"
              payload: { employer_program_id: "${prog_id}", driver_member_id: "${drv_id}", vehicle_id: "${veh_id}", kind: "VANPOOL", origin_zone: "Z-N", dest_zone: "Z-DT", departure_days: ["MON","TUE","WED","THU","FRI"], base_cost_cents: 2000, per_mile_cents: 120 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { pool_id: $.data.id, pool_v0: $.data.version }
            - call: "POST /memberships"
              payload: { pool_id: "${pool_id}", rider_member_id: "${r_id}", expected_pool_version: "${pool_v0}" }
              as: Rider
              as_user_id: "${r_id}"
            - call: "POST /pools/${pool_id}/activate"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips"
              payload: { pool_id: "${pool_id}", departure_at: "2026-06-09T15:00:00Z", duration_min: 40, distance_miles: 10.0, hov_lane_used: true }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { trip_id: $.data.id, trip_v0: $.data.version }
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", rider_member_id: "${r_id}", expected_trip_version: "${trip_v0}", seat_count: 1, pay_now: true }
              as: Rider
              as_user_id: "${r_id}"
              captures: { res_id: $.data.id }
            - call: "POST /trips/${trip_id}/open-boarding"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /reservations/${res_id}/check-in"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips/${trip_id}/depart"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips/${trip_id}/complete"
              payload: { hov_lane_used: true }
              as: Driver
              as_user_id: "${drv_id}"
          trigger:
            - call: "GET /employer-programs/${prog_id}/ledger"
              payload: {}
              as: ProgramAdmin
              captures: { first_type: "$.data[0].entry_type" }
          assert:
            - "first_type == DEBIT"
            - "EmployerProgram.${prog_id}.subsidy_consumed_cents == 2080"

      - name: list_members_pagination_envelope_fields_present
        claim_type: Listing
        grounds: [entities.Member, endpoints]
        distinguishing_aspect: "GET /members returns an array envelope carrying total_count and has_more; with limit=1 over two members has_more is true."
        test_recipe:
          setup: ["two members under one program"]
          setup_api_calls:
            - call: "POST /employer-programs"
              payload: { employer_name: "Acme", hov_discount_pct: 0.50, employer_match_pct: 0.30, monthly_benefit_cap_cents: 31500, grh_annual_cap_cents: 20000, grh_per_event_cap_cents: 6000, subsidy_budget_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "A", home_zone: "Z-N", work_zone: "Z-DT" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "B", home_zone: "Z-N", work_zone: "Z-DT" }
              as: ProgramAdmin
          trigger:
            - call: "GET /members?employer_program_id=${prog_id}&limit=1&offset=0"
              payload: {}
              as: ProgramAdmin
          assert:
            - "response meta present; response_type == array; total_count == 2; has_more == true; data length == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_pool_from_active_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Pool
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /pools/{id}/activate on an already-ACTIVE pool returns ERR_INVALID_STATE (409); no version bump."
        test_recipe:
          setup: ["pool ACTIVE (one membership, activated)"]
          setup_api_calls:
            - call: "POST /employer-programs"
              payload: { employer_name: "Acme", hov_discount_pct: 0.50, employer_match_pct: 0.30, monthly_benefit_cap_cents: 31500, grh_annual_cap_cents: 20000, grh_per_event_cap_cents: 6000, subsidy_budget_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "Dee", home_zone: "Z-N", work_zone: "Z-DT", can_drive: true }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "Rae", home_zone: "Z-N", work_zone: "Z-DT" }
              as: ProgramAdmin
              captures: { r_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_member_id: "${drv_id}", plate: "VAN-1", seat_capacity: 6 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /pools"
              payload: { employer_program_id: "${prog_id}", driver_member_id: "${drv_id}", vehicle_id: "${veh_id}", kind: "VANPOOL", origin_zone: "Z-N", dest_zone: "Z-DT", departure_days: ["MON","TUE","WED","THU","FRI"], base_cost_cents: 2000, per_mile_cents: 120 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { pool_id: $.data.id, pool_v0: $.data.version }
            - call: "POST /memberships"
              payload: { pool_id: "${pool_id}", rider_member_id: "${r_id}", expected_pool_version: "${pool_v0}" }
              as: Rider
              as_user_id: "${r_id}"
            - call: "POST /pools/${pool_id}/activate"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /pools/${pool_id}/activate"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: activate_forming_pool_with_no_membership_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Pool.FORMING_to_ACTIVE
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /pools/{id}/activate on a FORMING pool with committed_seat_count 0 fails the 'at least one ACTIVE Membership' precondition -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["pool FORMING with zero memberships"]
          setup_api_calls:
            - call: "POST /employer-programs"
              payload: { employer_name: "Acme", hov_discount_pct: 0.50, employer_match_pct: 0.30, monthly_benefit_cap_cents: 31500, grh_annual_cap_cents: 20000, grh_per_event_cap_cents: 6000, subsidy_budget_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "Dee", home_zone: "Z-N", work_zone: "Z-DT", can_drive: true }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_member_id: "${drv_id}", plate: "VAN-1", seat_capacity: 6 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /pools"
              payload: { employer_program_id: "${prog_id}", driver_member_id: "${drv_id}", vehicle_id: "${veh_id}", kind: "VANPOOL", origin_zone: "Z-N", dest_zone: "Z-DT", departure_days: ["MON","TUE","WED","THU","FRI"], base_cost_cents: 2000, per_mile_cents: 120 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { pool_id: $.data.id, pool_v0: $.data.version }
          trigger:
            - call: "POST /pools/${pool_id}/activate"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: cancel_completed_trip_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Trip
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /trips/{id}/cancel on a COMPLETED trip (terminal) returns ERR_INVALID_STATE (409); no reservations are touched."
        test_recipe:
          setup: ["trip COMPLETED with one completed reservation"]
          setup_api_calls:
            - call: "POST /employer-programs"
              payload: { employer_name: "Acme", hov_discount_pct: 0.50, employer_match_pct: 0.30, monthly_benefit_cap_cents: 100000, grh_annual_cap_cents: 20000, grh_per_event_cap_cents: 6000, subsidy_budget_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "Dee", home_zone: "Z-N", work_zone: "Z-DT", can_drive: true }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "Rae", home_zone: "Z-N", work_zone: "Z-DT", wallet_balance_cents: 50000 }
              as: ProgramAdmin
              captures: { r_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_member_id: "${drv_id}", plate: "VAN-1", seat_capacity: 6 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /pools"
              payload: { employer_program_id: "${prog_id}", driver_member_id: "${drv_id}", vehicle_id: "${veh_id}", kind: "VANPOOL", origin_zone: "Z-N", dest_zone: "Z-DT", departure_days: ["MON","TUE","WED","THU","FRI"], base_cost_cents: 2000, per_mile_cents: 120 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { pool_id: $.data.id, pool_v0: $.data.version }
            - call: "POST /memberships"
              payload: { pool_id: "${pool_id}", rider_member_id: "${r_id}", expected_pool_version: "${pool_v0}" }
              as: Rider
              as_user_id: "${r_id}"
            - call: "POST /pools/${pool_id}/activate"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips"
              payload: { pool_id: "${pool_id}", departure_at: "2026-06-09T15:00:00Z", duration_min: 40, distance_miles: 10.0 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { trip_id: $.data.id, trip_v0: $.data.version }
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", rider_member_id: "${r_id}", expected_trip_version: "${trip_v0}", seat_count: 1, pay_now: true }
              as: Rider
              as_user_id: "${r_id}"
              captures: { res_id: $.data.id }
            - call: "POST /trips/${trip_id}/open-boarding"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /reservations/${res_id}/check-in"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips/${trip_id}/depart"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips/${trip_id}/complete"
              payload: { hov_lane_used: false }
              as: Driver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /trips/${trip_id}/cancel"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: confirm_match_request_creates_membership_and_bumps_committed
        claim_type: Side Effect Execution
        grounds: [state_machines.MatchRequest.MATCHED_to_CONFIRMED, entities.Pool.fields.committed_seat_count]
        distinguishing_aspect: "POST /match-requests/{id}/confirm creates a Membership and increments matched Pool.committed_seat_count from 1 to 2; status -> CONFIRMED."
        test_recipe:
          setup: ["ACTIVE pool with one seed membership (committed 1); rider has a MATCHED request on that pool"]
          setup_api_calls:
            - call: "POST /employer-programs"
              payload: { employer_name: "Acme", hov_discount_pct: 0.50, employer_match_pct: 0.30, monthly_benefit_cap_cents: 31500, grh_annual_cap_cents: 20000, grh_per_event_cap_cents: 6000, subsidy_budget_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "Dee", home_zone: "Z-N", work_zone: "Z-DT", can_drive: true }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "Seed", home_zone: "Z-N", work_zone: "Z-DT" }
              as: ProgramAdmin
              captures: { seed_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "Rae", home_zone: "Z-N", work_zone: "Z-DT" }
              as: ProgramAdmin
              captures: { r_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_member_id: "${drv_id}", plate: "VAN-1", seat_capacity: 6 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /pools"
              payload: { employer_program_id: "${prog_id}", driver_member_id: "${drv_id}", vehicle_id: "${veh_id}", kind: "VANPOOL", origin_zone: "Z-N", dest_zone: "Z-DT", departure_days: ["MON","TUE","WED","THU","FRI"], base_cost_cents: 2000, per_mile_cents: 120 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { pool_id: $.data.id, pool_v0: $.data.version }
            - call: "POST /memberships"
              payload: { pool_id: "${pool_id}", rider_member_id: "${seed_id}", expected_pool_version: "${pool_v0}" }
              as: Rider
              as_user_id: "${seed_id}"
            - call: "POST /pools/${pool_id}/activate"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /match-requests"
              payload: { rider_member_id: "${r_id}", origin_zone: "Z-N", dest_zone: "Z-DT", needed_days: ["MON","TUE","WED","THU","FRI"], earliest_departure_min: 480, latest_departure_min: 600 }
              as: Rider
              as_user_id: "${r_id}"
              captures: { mr_id: $.data.id }
            - call: "POST /match-requests/${mr_id}/match"
              payload: {}
              as: Rider
              as_user_id: "${r_id}"
              captures: { matched_pool: $.data.matched_pool_id }
          trigger:
            - call: "POST /match-requests/${mr_id}/confirm"
              payload: {}
