# =============================================================================
# Scaffold: Compost Pickup & Organics Subscription (task 0989)
# Difficulty: beyond-expert (per scenario directive "generate task hard than
# expert level!") — dense cross-entity cascades, dual-variant ledgers,
# temporal windows, OCC, segregation of duties.
# =============================================================================

scenario: |
  generate task hard than expert level! 989. Compost Pickup & Organics
  Subscription: bin & route, weekly pickup & swap, contamination & tagging,
  finished-compost return credit, commercial vs residential, subscription &
  skip, diversion/impact, billing

domain_name: compost-pickup
api_prefix: ""

# =============================================================================
# Complexity profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing      # skip cutoffs, pause windows, weekly service dates, due dates
  secondary_archetype: ledger_reconciliation # estimated vs weighed diversion credits; invoice ledger
  complexity_layers:
    - dual_variant_calculation     # estimated vs weighed diversion; residential flat vs commercial metered
    - cascading_side_effects       # weigh ticket -> pickup -> credit entry -> balance; tag confirm -> strikes -> suspension -> pickup cancellations
    - optimistic_concurrency       # OCC on Subscription.version for plan-change
    - rate_threshold_triggers      # strike suspension threshold, skip allowance, credit cap, overage tier
  entity_topology: flat            # peer entities with FK references; no nested create paths
  state_machine_shape: cyclic      # Subscription ACTIVE<->PAUSED; Bin status x condition parallel dims; PickupEvent revert loop via waived tags
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties # the driver who tags contamination may not confirm/waive it (tracked by X-User-ID)
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: ServicePlan
    parent: null
    common_fields: false   # config entity: id + created_at only
    fields:
      - { name: code, type: string, source: input, description: "Unique plan code, e.g. RES_BIN / COM_BIN" }
      - { name: name, type: string, source: input, description: "Human-readable plan name" }
      - { name: subscriber_type, type: enum, source: input, description: "RESIDENTIAL | COMMERCIAL" }
      - { name: bin_type, type: enum, source: input, description: "BIN_35L | BIN_70L | BIN_240L | BIN_960L" }
      - { name: included_bins, type: integer, source: input, description: "Number of bins assigned to a subscription of this plan" }
      - { name: weekly_price_cents, type: integer, source: input, description: "Flat weekly charge; residential billing basis (0 for commercial plans)" }
      - { name: metered_base_cents, type: integer, source: input, description: "Weekly base charge when a commercial pickup is attempted/completed (0 for residential)" }
      - { name: per_kg_rate_cents, type: integer, source: input, description: "Commercial per-kg overage rate beyond included_kg_per_week (0 for residential)" }
      - { name: included_kg_per_week, type: number, source: input, description: "Commercial weekly included kilograms before overage (0 for residential)" }
      - { name: credit_rate_cents_per_kg, type: integer, source: input, description: "Diversion credit earned per collected kg, before seasonal multiplier" }
      - { name: skip_allowance_per_quarter, type: integer, source: input, description: "Skips allowed per calendar quarter for subscriptions on this plan" }

  - name: Subscriber
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: full_name, type: string, source: input, description: "Subscriber name" }
      - { name: subscriber_type, type: enum, source: input, description: "RESIDENTIAL | COMMERCIAL" }
      - { name: address, type: string, source: input, description: "Service address" }
      - { name: account_standing, type: enum, source: computed, description: "GOOD_STANDING | DELINQUENT — derived from overdue ISSUED invoices (calculations.account_standing)" }
      - { name: credit_balance_cents, type: integer, source: computed, default: 0, description: "Sum of signed amount_cents over all CompostCreditEntry rows for this subscriber" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: subscriber_id, type: string, source: input, description: "FK -> Subscriber.id; owner" }
      - { name: plan_id, type: string, source: input, description: "FK -> ServicePlan.id; current plan (mutated by plan-change)" }
      - { name: route_id, type: string, source: input, description: "FK -> Route.id; weekly service route" }
      - { name: start_date, type: string, source: input, description: "ISO date; first eligible service date" }
      - { name: service_status, type: enum, source: system, description: "ACTIVE | PAUSED | SUSPENDED | CANCELLED" }
      - { name: strike_count, type: integer, source: system, default: 0, description: "Confirmed contamination strikes; >= 3 auto-suspends" }
      - { name: skips_used_this_quarter, type: integer, source: system, default: 0, description: "Skips consumed in current calendar quarter (lazy reset, calculations.skip_allowance)" }
      - { name: current_quarter, type: string, source: system, description: "Quarter label of last skip accounting, e.g. 2026-Q2" }
      - { name: pause_windows, type: array, source: system, default: [], description: "Recorded pause windows [{pause_start, pause_end}], half-open [start, end); append-only" }

  - name: Route
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Route code" }
      - { name: weekday, type: enum, source: input, description: "MON | TUE | WED | THU | FRI | SAT | SUN — weekly service day" }
      - { name: max_stops, type: integer, source: input, description: "Maximum number of coexisting ACTIVE subscriptions on this route (weekly slot capacity)" }
      - { name: active_subscriptions_count, type: integer, source: computed, description: "Count of subscriptions with service_status == ACTIVE on this route" }

  - name: Bin
    parent: null
    common_fields: true
    fields:
      - { name: bin_type, type: enum, source: input, description: "BIN_35L | BIN_70L | BIN_240L | BIN_960L" }
      - { name: nominal_capacity_kg, type: number, source: input, description: "Kilograms of organics at 100% fullness" }
      - { name: status, type: enum, source: system, description: "IN_DEPOT | AT_CUSTOMER — parallel dimension 1 (RETIRED not used)" }
      - { name: condition, type: enum, source: system, description: "CLEAN | NEEDS_WASH — parallel dimension 2, independent of status" }
      - { name: current_subscription_id, type: string, source: system, description: "FK -> Subscription.id; set while AT_CUSTOMER, null while IN_DEPOT", constraints: "nullable" }

  - name: PickupEvent
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; set at generation" }
      - { name: route_id, type: string, source: system, description: "FK -> Route.id; set at generation" }
      - { name: service_date, type: string, source: system, description: "ISO date of the scheduled weekly stop" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | SKIPPED | MISSED | REJECTED_CONTAMINATION | CANCELLED_SYSTEM | VOIDED" }
      - { name: fullness_pct, type: number, source: input, description: "Driver-recorded fill fraction 0..1, supplied at completion" }
      - { name: estimated_kg, type: number, source: computed, description: "round(nominal_capacity_kg x fullness_pct, 2) at completion" }
      - { name: final_kg, type: number, source: computed, description: "Weigh-ticket allocated kilograms; null until ticket posted", constraints: "nullable" }
      - { name: collected_bin_id, type: string, source: system, description: "FK -> Bin.id; bin taken at completion", constraints: "nullable" }
      - { name: replacement_bin_id, type: string, source: system, description: "FK -> Bin.id; clean bin left at completion", constraints: "nullable" }

  - name: ContaminationTag
    parent: null
    common_fields: true
    fields:
      - { name: pickup_id, type: string, source: system, description: "FK -> PickupEvent.id; tagged pickup (path parameter)" }
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; denormalized from pickup for filtering" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH" }
      - { name: category, type: enum, source: input, description: "PLASTIC | GLASS | METAL | LIQUIDS | OTHER" }
      - { name: note, type: string, source: input, description: "Free-text note", constraints: "optional" }
      - { name: tagged_by_driver_id, type: string, source: system, description: "X-User-ID of the tagging driver; segregation-of-duties anchor" }
      - { name: status, type: enum, source: system, description: "TAGGED | DISPUTED | CONFIRMED | WAIVED" }
      - { name: surcharge_cents, type: integer, source: computed, description: "Set on CONFIRMED per calculations.contamination_surcharge_cents; null otherwise", constraints: "nullable" }
      - { name: resolved_by, type: string, source: system, description: "X-User-ID of confirming/waiving OperationsManager", constraints: "nullable" }
      - { name: resolved_at, type: datetime, source: system, description: "Logical-clock timestamp of CONFIRMED/WAIVED transition; drives surcharge invoice week", constraints: "nullable" }

  - name: WeighTicket
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> Route.id; weighed route (path parameter)" }
      - { name: service_date, type: string, source: input, description: "ISO date of the weighed load" }
      - { name: gross_kg, type: number, source: input, description: "Gross scale reading" }
      - { name: tare_kg, type: number, source: input, description: "Vehicle tare" }
      - { name: net_kg, type: number, source: computed, description: "gross_kg - tare_kg, must be > 0" }
      - { name: status, type: enum, source: system, description: "POSTED (only state; ticket posting is final)" }

  - name: CompostCreditEntry
    parent: null
    common_fields: false   # append-only ledger event: id + created_at only
    fields:
      - { name: subscriber_id, type: string, source: system, description: "FK -> Subscriber.id" }
      - { name: pickup_id, type: string, source: system, description: "FK -> PickupEvent.id; set for EARNED_* and credit REVERSAL entries", constraints: "nullable" }
      - { name: redemption_id, type: string, source: system, description: "FK -> CreditRedemption.id; set for REDEMPTION_DEBIT entries", constraints: "nullable" }
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; set for INVOICE_APPLICATION_DEBIT and its REVERSAL", constraints: "nullable" }
      - { name: entry_type, type: enum, source: system, description: "EARNED_ESTIMATED | EARNED_FINAL_ADJUSTMENT | REDEMPTION_DEBIT | INVOICE_APPLICATION_DEBIT | MANUAL_ADJUSTMENT | REVERSAL" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents; credits positive, debits negative (input-supplied only for MANUAL_ADJUSTMENT)" }
      - { name: reason, type: string, source: input, description: "Operator note for MANUAL_ADJUSTMENT", constraints: "nullable" }
      - { name: season, type: string, source: system, description: "Season label of the causal event, e.g. 2026-SUMMER (calculations.season_of_date)" }

  - name: CreditRedemption
    parent: null
    common_fields: true
    fields:
      - { name: subscriber_id, type: string, source: input, description: "FK -> Subscriber.id; redeeming subscriber" }
      - { name: bags, type: integer, source: input, description: "Number of finished-compost bags (>= 1)" }
      - { name: total_kg, type: number, source: computed, description: "bags x BAG_KG(10)" }
      - { name: total_cents, type: integer, source: computed, description: "bags x BAG_PRICE_CENTS(500)" }
      - { name: status, type: enum, source: system, description: "REQUESTED | FULFILLED | CANCELLED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: subscriber_id, type: string, source: system, description: "FK -> Subscriber.id; billed subscriber" }
      - { name: week_start_date, type: string, source: system, description: "Monday of the billed service week" }
      - { name: lines, type: array, source: system, description: "Charge lines: {line_type: WEEKLY_FLAT | METERED_BASE | OVERAGE_KG | CONTAMINATION_SURCHARGE, reference_id, amount_cents}" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of integer line amounts (per-line rounding pinned in calculations.weekly_invoice_amount)" }
      - { name: credit_applied_cents, type: integer, source: computed, description: "Credits applied at issuance per calculations.credit_application_order" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - credit_applied_cents" }
      - { name: status, type: enum, source: system, description: "ISSUED | PAID | VOID" }
      - { name: due_date, type: string, source: system, description: "week_start_date + INVOICE_DUE_DAYS(14)" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /subscriptions/{id}/pause"
        actor: "Subscriber (own) | OperationsManager"
        preconditions:
          - "service_status == ACTIVE (else ERR_SUBSCRIPTION_STATE_CONFLICT)"
          - "subscriber account_standing == GOOD_STANDING (else ERR_ACCOUNT_DELINQUENT)"
          - "pause_end > pause_start (else ERR_INVALID_REQUEST)"
          - "new half-open window [pause_start, pause_end) must not overlap any recorded pause_windows entry (else ERR_PAUSE_WINDOW_OVERLAP); adjacency (new start == existing end) is allowed"
        side_effects:
          - "pause_windows += {pause_start, pause_end}"
          - "PickupEvents of this subscription with status == SCHEDULED and service_date inside [pause_start, pause_end) transition to CANCELLED_SYSTEM"
          - "increments Subscription.version by 1"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/resume"
        actor: "Subscriber (own) | OperationsManager"
        preconditions:
          - "service_status == PAUSED (else ERR_SUBSCRIPTION_STATE_CONFLICT)"
          - "subscriber account_standing == GOOD_STANDING (else ERR_ACCOUNT_DELINQUENT)"
        side_effects:
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: "Subscriber (own) | OperationsManager"
        preconditions: []
        side_effects:
          - "all SCHEDULED PickupEvents of this subscription transition to CANCELLED_SYSTEM"
          - "each assigned Bin: status -> IN_DEPOT, condition -> NEEDS_WASH, current_subscription_id -> null"
          - "increments Subscription.version by 1"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: "Subscriber (own) | OperationsManager"
        preconditions: []
        side_effects:
          - "all SCHEDULED PickupEvents of this subscription transition to CANCELLED_SYSTEM"
          - "each assigned Bin: status -> IN_DEPOT, condition -> NEEDS_WASH, current_subscription_id -> null"
          - "increments Subscription.version by 1"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: "Subscriber (own) | OperationsManager"
        preconditions: []
        side_effects:
          - "each assigned Bin: status -> IN_DEPOT, condition -> NEEDS_WASH, current_subscription_id -> null"
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/plan-change (self-transition: plan_id replaced)"
        actor: "Subscriber (own) | OperationsManager"
        preconditions:
          - "service_status == ACTIVE (else ERR_SUBSCRIPTION_STATE_CONFLICT)"
          - "expected_subscription_version == current Subscription.version (else ERR_STALE_VERSION, concurrency rule plan-change-stale-subscription)"
          - "new plan exists (else ERR_NOT_FOUND) and new plan.subscriber_type == subscriber.subscriber_type and new plan.included_bins >= number of bins currently assigned (else ERR_PLAN_DOWNGRADE_BLOCKED)"
        side_effects:
          - "plan_id := new_plan_id"
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when strike_count reaches STRIKE_SUSPENSION_THRESHOLD(3) after a ContaminationTag CONFIRMED transition)"
        actor: system
        preconditions: []
        side_effects:
          - "all SCHEDULED PickupEvents of this subscription transition to CANCELLED_SYSTEM (third hop of the tag-confirm cascade)"
          - "increments Subscription.version by 1"
    note: "Cyclic shape: ACTIVE -> PAUSED -> ACTIVE loops indefinitely; SUSPENDED is absorbing except cancel."

  - entity: Bin
    initial_state: "IN_DEPOT (condition CLEAN)"
    terminal_states: []
    transitions:
      - from: IN_DEPOT
        to: AT_CUSTOMER
        trigger: "system (bin selector on POST /subscriptions or as replacement during POST /pickups/{id}/complete)"
        actor: system
        preconditions:
          - "bin.condition == CLEAN (dirty bins are never selected)"
        side_effects:
          - "current_subscription_id := target subscription"
      - from: AT_CUSTOMER
        to: IN_DEPOT
        trigger: "system (swap during POST /pickups/{id}/complete, or subscription cancel return)"
        actor: system
        preconditions: []
        side_effects:
          - "condition := NEEDS_WASH"
          - "current_subscription_id := null"
      - from: IN_DEPOT
        to: IN_DEPOT
        trigger: "POST /bins/{id}/wash (condition NEEDS_WASH -> CLEAN; status unchanged)"
        actor: OperationsManager
        preconditions:
          - "status == IN_DEPOT and condition == NEEDS_WASH (else ERR_INVALID_STATE)"
        side_effects:
          - "condition := CLEAN"
          - "increments Bin.version by 1"
    note: "Parallel state dimensions: status (IN_DEPOT/AT_CUSTOMER) evolves independently of condition (CLEAN/NEEDS_WASH) except that AT_CUSTOMER -> IN_DEPOT forces NEEDS_WASH and only CLEAN bins may leave the depot."

  - entity: PickupEvent
    initial_state: SCHEDULED
    terminal_states: [SKIPPED, MISSED, CANCELLED_SYSTEM, VOIDED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /pickups/{id}/complete"
        actor: Driver
        preconditions:
          - "status == SCHEDULED (else ERR_PICKUP_NOT_ACTIONABLE)"
          - "0 <= fullness_pct <= 1 (else ERR_INVALID_REQUEST)"
          - "a replacement bin must be selectable: Bin with bin_type == plan.bin_type, status == IN_DEPOT, condition == CLEAN (selector: earliest created_at; else ERR_NO_BIN_AVAILABLE). Atomic: on selector failure no field mutates."
        side_effects:
          - "estimated_kg := round(bin.nominal_capacity_kg x fullness_pct, 2)"
          - "collected_bin_id := subscription's current bin; that Bin -> IN_DEPOT + NEEDS_WASH, current_subscription_id -> null"
          - "replacement_bin_id := selected clean Bin; that Bin -> AT_CUSTOMER, current_subscription_id := subscription"
          - "create CompostCreditEntry EARNED_ESTIMATED (calculations.estimated_diversion_credit); Subscriber.credit_balance_cents += amount"
          - "increments PickupEvent.version by 1"
      - from: SCHEDULED
        to: SKIPPED
        trigger: "POST /pickups/{id}/skip"
        actor: "Subscriber (own)"
        preconditions:
          - "status == SCHEDULED (else ERR_PICKUP_NOT_ACTIONABLE)"
          - "subscription.service_status == ACTIVE (else ERR_SUBSCRIPTION_NOT_ACTIVE)"
          - "skips_used_this_quarter < plan.skip_allowance_per_quarter after lazy quarter reset (else ERR_SKIP_LIMIT_EXCEEDED)"
          - "logical now < service_date 00:00Z minus SKIP_CUTOFF_HOURS(48) (else ERR_SKIP_CUTOFF_PASSED; exactly at the cutoff instant is rejected)"
        side_effects:
          - "skips_used_this_quarter += 1 (with lazy reset, calculations.skip_allowance)"
          - "increments PickupEvent.version by 1"
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /pickups/{id}/miss"
        actor: Driver
        preconditions:
          - "status == SCHEDULED (else ERR_PICKUP_NOT_ACTIONABLE)"
        side_effects:
          - "increments PickupEvent.version by 1"
        note: "Driver fault: week is not billed."
      - from: SCHEDULED
        to: REJECTED_CONTAMINATION
        trigger: "POST /pickups/{id}/contamination-tags"
        actor: Driver
        preconditions:
          - "status == SCHEDULED (else ERR_PICKUP_NOT_ACTIONABLE)"
        side_effects:
          - "bin is left with the customer (no swap, no credit)"
          - "increments PickupEvent.version by 1"
      - from: REJECTED_CONTAMINATION
        to: SCHEDULED
        trigger: "system (automatic when the open ContaminationTag on this pickup transitions to WAIVED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments PickupEvent.version by 1"
        note: "Revert loop: a waived tag returns the pickup for a make-up attempt; completion after service_date is allowed."
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /pickups/{id}/void"
        actor: OperationsManager
        preconditions:
          - "status == COMPLETED (else ERR_PICKUP_NOT_ACTIONABLE)"
          - "no WeighTicket posted for (route_id, service_date) (else ERR_PICKUP_LOCKED_BY_WEIGH_TICKET)"
        side_effects:
          - "create CompostCreditEntry REVERSAL amount = -(the pickup's EARNED_ESTIMATED amount); Subscriber.credit_balance_cents adjusted (compensating invariant: complete+void nets balance to zero drift)"
          - "physical swap is NOT undone (bins stay as completed left them)"
          - "increments PickupEvent.version by 1"
    note: "COMPLETED also accepts contamination tags (facility discovery): tagging COMPLETED does not change pickup status but forfeits the earned credit via REVERSAL."

  - entity: ContaminationTag
    initial_state: TAGGED
    terminal_states: [CONFIRMED, WAIVED]
    transitions:
      - from: TAGGED
        to: DISPUTED
        trigger: "POST /contamination-tags/{id}/dispute"
        actor: "Subscriber (own)"
        preconditions:
          - "status == TAGGED (else ERR_TAG_NOT_RESOLVABLE)"
        side_effects:
          - "increments ContaminationTag.version by 1"
      - from: TAGGED
        to: CONFIRMED
        trigger: "POST /contamination-tags/{id}/confirm"
        actor: OperationsManager
        preconditions:
          - "status in {TAGGED, DISPUTED} (else ERR_TAG_NOT_RESOLVABLE)"
          - "X-User-ID != tagged_by_driver_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "surcharge_cents := calculations.contamination_surcharge_cents (uses strike_count BEFORE this increment); resolved_at := logical now; resolved_by := X-User-ID"
          - "Subscription.strike_count += 1 (hop 1)"
          - "if strike_count reaches 3: Subscription ACTIVE -> SUSPENDED (hop 2)"
          - "if suspended: all SCHEDULED PickupEvents of the subscription -> CANCELLED_SYSTEM (hop 3)"
          - "increments ContaminationTag.version by 1"
      - from: TAGGED
        to: WAIVED
        trigger: "POST /contamination-tags/{id}/waive"
        actor: OperationsManager
        preconditions:
          - "status in {TAGGED, DISPUTED} (else ERR_TAG_NOT_RESOLVABLE)"
          - "X-User-ID != tagged_by_driver_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "resolved_at := logical now; resolved_by := X-User-ID; no strike"
          - "if pickup.status == REJECTED_CONTAMINATION: pickup -> SCHEDULED (make-up attempt)"
          - "if the pickup's credit was forfeited (a REVERSAL entry exists for this pickup): create CompostCreditEntry MANUAL_ADJUSTMENT restoring the forfeited amount, reason TAG_WAIVED_CREDIT_RESTORE"
          - "increments ContaminationTag.version by 1"
      - from: DISPUTED
        to: CONFIRMED
        trigger: "POST /contamination-tags/{id}/confirm"
        actor: OperationsManager
        preconditions:
          - "status in {TAGGED, DISPUTED} (else ERR_TAG_NOT_RESOLVABLE)"
          - "X-User-ID != tagged_by_driver_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["same as TAGGED -> CONFIRMED"]
      - from: DISPUTED
        to: WAIVED
        trigger: "POST /contamination-tags/{id}/waive"
        actor: OperationsManager
        preconditions:
          - "status in {TAGGED, DISPUTED} (else ERR_TAG_NOT_RESOLVABLE)"
          - "X-User-ID != tagged_by_driver_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["same as TAGGED -> WAIVED"]
    note: "Branching shape: TAGGED forks to DISPUTED/CONFIRMED/WAIVED; DISPUTED rejoins {CONFIRMED, WAIVED}."

  - entity: CreditRedemption
    initial_state: REQUESTED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: FULFILLED
        trigger: "POST /credit-redemptions/{id}/fulfill"
        actor: OperationsManager
        preconditions:
          - "status == REQUESTED (else ERR_REDEMPTION_NOT_FULFILLABLE)"
          - "subscriber.credit_balance_cents >= total_cents at fulfill time (else ERR_INSUFFICIENT_CREDIT)"
        side_effects:
          - "create CompostCreditEntry REDEMPTION_DEBIT amount = -total_cents with redemption_id set; Subscriber.credit_balance_cents -= total_cents"
          - "reserved stock converts to redeemed (calculations.compost_stock)"
          - "increments CreditRedemption.version by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /credit-redemptions/{id}/cancel"
        actor: "Subscriber (own) | OperationsManager"
        preconditions:
          - "status == REQUESTED (else ERR_REDEMPTION_NOT_FULFILLABLE)"
        side_effects:
          - "stock reservation released (no debit was taken at create)"
          - "increments CreditRedemption.version by 1"

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: "Subscriber (own) | OperationsManager"
        preconditions:
          - "status == ISSUED (else ERR_INVOICE_NOT_PAYABLE)"
        side_effects:
          - "subscriber.account_standing recomputes on next read (no longer overdue via this invoice)"
          - "increments Invoice.version by 1"
      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: OperationsManager
        preconditions:
          - "status == ISSUED (else ERR_INVOICE_NOT_PAYABLE)"
        side_effects:
          - "if credit_applied_cents > 0: create CompostCreditEntry REVERSAL amount = +credit_applied_cents with invoice_id set; Subscriber.credit_balance_cents restored"
          - "increments Invoice.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only; all other conflicts are state preconditions)
# =============================================================================
concurrency_rules:
  - rule_id: plan-change-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /subscriptions/{id}/plan-change"
    occ_field: expected_subscription_version
    description: |
      A plan-change carries the Subscription.version the caller last observed.
      If the subscription's version has since advanced (e.g., another accepted
      plan-change replaced the plan, or a pause/resume mutated the row), the
      caller's view is stale and the change is rejected with 412. The new plan
      legitimately supersedes the prior one, so without OCC two sequential
      changes would silently discard the first writer's intent.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: season_of_date
    trigger: "any credit or pricing computation referencing a service/resolved date"
    algorithm: aggregation
    formula: |
      SPRING = Mar 1 .. May 31; SUMMER = Jun 1 .. Aug 31; FALL = Sep 1 .. Nov 30; WINTER = Dec 1 .. Feb end.
      season label: "<year>-SPRING" etc.; WINTER of Dec 2026 is labeled 2026-WINTER, of Jan/Feb 2027 is 2027-WINTER.
    input_set: "the single date under consideration"
    constants:
      SEASON_MULTIPLIER_SPRING: 1.0
      SEASON_MULTIPLIER_SUMMER: 1.2
      SEASON_MULTIPLIER_FALL: 1.0
      SEASON_MULTIPLIER_WINTER: 0.8
    precision: "multiplier applied before final cent rounding"

  - name: estimated_diversion_credit
    trigger: "POST /pickups/{id}/complete (SCHEDULED -> COMPLETED)"
    algorithm: aggregation
    formula: |
      estimated_kg = round_half_up(bin.nominal_capacity_kg * fullness_pct, 2)
      credit_cents = round_half_up(estimated_kg * plan.credit_rate_cents_per_kg * SEASON_MULTIPLIER(service_date))   # integer cents
      create CompostCreditEntry EARNED_ESTIMATED amount_cents = credit_cents
    input_set: "the completing pickup, its subscription's current plan, the collected bin"
    precision: "kg to 2 decimals round_half_up; money integer cents round_half_up"
    variants:
      - name: estimated
        when: "at pickup completion, before any weigh ticket"
        difference: "uses driver fullness estimate; provisional credit"
      - name: weighed
        when: "after the route's WeighTicket is posted (see weighed_allocation)"
        difference: "uses facility scale net kg allocated across pickups; identical pickup data yields different cents"

  - name: weighed_allocation
    trigger: "POST /routes/{id}/weigh-tickets (WeighTicket POSTED)"
    algorithm: waterfall_allocation
    formula: |
      included = COMPLETED PickupEvents of (route_id, service_date) with estimated_kg > 0
      require |included| >= 1 (else ERR_INVALID_WEIGHT)
      S = sum(estimated_kg over included)
      for each pickup i: final_kg_i = round_half_up(net_kg * estimated_kg_i / S, 2)
      remainder = round_half_up(net_kg - sum(final_kg_i), 2)
      remainder is added to the pickup with the largest estimated_kg; tie-break: earliest pickup created_at
      for each pickup i:
        final_credit_i = round_half_up(final_kg_i * plan_i.credit_rate_cents_per_kg * SEASON_MULTIPLIER(service_date))
        delta_i = final_credit_i - (the pickup's EARNED_ESTIMATED amount_cents)
        if delta_i != 0: create CompostCreditEntry EARNED_FINAL_ADJUSTMENT amount_cents = delta_i
      Subscriber.credit_balance_cents recomputed as sum of all signed entries
    input_set: "COMPLETED pickups on the route+date with estimated_kg > 0; their subscriptions' plans"
    precision: "kg 2 decimals round_half_up; money integer cents round_half_up"
    variants:
      - name: weighed
        when: "ticket posted"
        difference: "scale truth replaces driver estimate; delta reconciles the ledger (dual variant of estimated_diversion_credit)"

  - name: contamination_surcharge_cents
    trigger: "ContaminationTag -> CONFIRMED"
    algorithm: tiered_pricing
    formula: |
      surcharge = BASE[severity] * TYPE_MULT[subscriber.subscriber_type] * (1 + ESCALATOR_STEP * min(strike_count_before, 3))
      strike_count_before = subscription.strike_count before this confirmation's increment
      result is an exact integer (all factors produce .0 or .5 products; round_half_up to integer cents)
    input_set: "the confirmed tag, its subscription, the subscriber type"
    constants:
      BASE_LOW: 500
      BASE_MEDIUM: 1000
      BASE_HIGH: 1500
      TYPE_MULT_RESIDENTIAL: 1.0
      TYPE_MULT_COMMERCIAL: 2.0
      ESCALATOR_STEP: 0.5
      STRIKE_SUSPENSION_THRESHOLD: 3
    precision: "integer cents"

  - name: weekly_invoice_amount
    trigger: "POST /billing/run for a week_start_date (must be a Monday, else ERR_INVALID_REQUEST)"
    algorithm: tiered_pricing
    formula: |
      For each subscriber with billable activity in [week_start, week_start+7):
      Gate: every COMPLETED pickup of a COMMERCIAL subscription in the week MUST have a posted WeighTicket
            for its (route_id, service_date) (else abort whole run with ERR_WEIGH_TICKET_PENDING).
      Lines (per subscription, per pickup with service_date in week):
        RESIDENTIAL plan:
          COMPLETED or REJECTED_CONTAMINATION -> line WEEKLY_FLAT amount = plan.weekly_price_cents
          SKIPPED / MISSED / CANCELLED_SYSTEM / VOIDED -> no line
        COMMERCIAL plan:
          COMPLETED -> line METERED_BASE amount = plan.metered_base_cents
                       PLUS, only when final_kg > plan.included_kg_per_week,
                       line OVERAGE_KG amount = round_half_up(plan.per_kg_rate_cents * (final_kg - plan.included_kg_per_week))
          REJECTED_CONTAMINATION -> line METERED_BASE only (service attempted; subscriber at fault)
          SKIPPED / MISSED / CANCELLED_SYSTEM / VOIDED -> no line
      Surcharge lines: each ContaminationTag of the subscriber with status CONFIRMED and resolved_at
          within the week -> line CONTAMINATION_SURCHARGE amount = tag.surcharge_cents
      ROUNDING ORDER (pinned): every line amount is an integer computed in isolation
          (round_half_up per line), then subtotal_cents = sum of integer lines.
          Never sum raw floats then round.
      Idempotency: at most one invoice per (subscriber_id, week_start_date); a rerun skips existing
          pairs and reports them in skipped_subscriber_ids.
      No invoice is created when subtotal_cents == 0.
      due_date = week_start_date + 14 days.
    input_set: "all PickupEvents with service_date in the week (any status), CONFIRMED tags resolved in the week, plans"
    constants:
      INVOICE_DUE_DAYS: 14
    precision: "integer cents; per-line round_half_up then sum"
    variants:
      - name: residential_flat
        when: "plan.subscriber_type == RESIDENTIAL"
        difference: "flat weekly price independent of kilograms; no weigh ticket required"
      - name: commercial_metered
        when: "plan.subscriber_type == COMMERCIAL"
        difference: "base + per-kg overage over final (weighed) kg; identical weekly activity bills a different amount than residential_flat"

  - name: credit_application_order
    trigger: "invoice issuance inside POST /billing/run"
    algorithm: waterfall_allocation
    formula: |
      Evaluation order pinned to break the circular dependency (cap depends on subtotal, total depends on credits):
        1. subtotal_cents := sum of integer line amounts (weekly_invoice_amount)
        2. credit_applied_cents := min(subscriber.credit_balance_cents, floor(CREDIT_CAP_PCT * subtotal_cents))
        3. total_cents := subtotal_cents - credit_applied_cents
        4. if credit_applied_cents > 0: create CompostCreditEntry INVOICE_APPLICATION_DEBIT
             amount = -credit_applied_cents with invoice_id set; balance decreases immediately
    input_set: "the issuing subscriber and their freshly computed lines"
    constants:
      CREDIT_CAP_PCT: 0.5
    precision: "integer cents; floor for the cap"

  - name: account_standing
    trigger: "read of Subscriber.account_standing (derived on read, immediate consistency)"
    algorithm: threshold
    formula: |
      DELINQUENT if exists Invoice of subscriber with status == ISSUED and due_date < current logical date;
      else GOOD_STANDING.
    input_set: "subscriber's invoices, logical clock"

  - name: skip_allowance
    trigger: "POST /pickups/{id}/skip"
    algorithm: threshold
    formula: |
      quarter_of(date): Q1 = Jan-Mar, Q2 = Apr-Jun, Q3 = Jul-Sep, Q4 = Oct-Dec; label "<year>-Q<n>".
      Lazy reset: if subscription.current_quarter != quarter_of(logical today):
          skips_used_this_quarter := 0; current_quarter := quarter_of(today)
      Allow skip iff skips_used_this_quarter < plan.skip_allowance_per_quarter (boundary: AT the allowance is rejected).
    input_set: "the subscription, its plan, logical clock"

  - name: compost_stock
    trigger: "POST /credit-redemptions (create check), POST /credit-redemptions/{id}/fulfill, GET /compost-stock"
    algorithm: aggregation
    formula: |
      produced_kg  = round_half_up(COMPOST_YIELD * sum(final_kg over all PickupEvents with final_kg not null), 2)
      redeemed_kg  = sum(total_kg over CreditRedemptions with status == FULFILLED)
      reserved_kg  = sum(total_kg over CreditRedemptions with status == REQUESTED)
      available_kg = produced_kg - redeemed_kg - reserved_kg
      Create requires total_kg <= available_kg (boundary: exactly equal is allowed, else ERR_INSUFFICIENT_STOCK).
    input_set: "all weighed pickups, all non-cancelled redemptions"
    constants:
      COMPOST_YIELD: 0.3
      BAG_KG: 10
      BAG_PRICE_CENTS: 500

  - name: impact_report
    trigger: "GET /subscribers/{id}/impact"
    algorithm: aggregation
    formula: |
      over all PickupEvents of the subscriber's subscriptions with status == COMPLETED:
        kg = final_kg if not null else estimated_kg
      total_kg_diverted = round_half_up(sum(kg), 2)
      total_co2e_kg = round_half_up(total_kg_diverted * CO2E_PER_KG, 2)
      pickups_completed = count of those pickups
      contamination_tags_confirmed = count of subscriber's tags with status == CONFIRMED
    input_set: "subscriber's subscriptions' pickups and tags"
    constants:
      CO2E_PER_KG: 0.5
    precision: "2 decimals round_half_up"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role is listed on the endpoint AND (for Subscriber) the caller owns the target resource (resource's subscriber chain == X-User-ID)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "request body shape: required fields present, enums valid, ranges valid (fullness_pct in 0..1, bags >= 1, pause_end > pause_start, week_start is Monday, amount_cents nonzero)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "every id in path and body (plan_id, route_id, subscriber_id, new_plan_id) resolves to an existing entity"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: existence
    check: "OCC: expected_subscription_version == current Subscription.version on plan-change"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /subscriptions/{id}/plan-change"
  - priority: 6
    category: state
    check: "target resource in a valid from-state for the operation (subscription/pickup/tag/redemption/invoice state gates)"
    error_id: "ERR_SUBSCRIPTION_STATE_CONFLICT | ERR_SUBSCRIPTION_NOT_ACTIVE | ERR_PICKUP_NOT_ACTIONABLE | ERR_TAG_NOT_RESOLVABLE | ERR_REDEMPTION_NOT_FULFILLABLE | ERR_INVOICE_NOT_PAYABLE | ERR_INVALID_STATE"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_safety
    check: "segregation of duties: tag confirm/waive X-User-ID must differ from tagged_by_driver_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /contamination-tags/{id}/confirm, POST /contamination-tags/{id}/waive"
  - priority: 8
    category: business_fiscal
    check: "fiscal gates: account not DELINQUENT (pause/resume/redemption-create); credit balance suffices (redemption create/fulfill, negative-going adjustment); quarterly skip allowance remains"
    error_id: "ERR_ACCOUNT_DELINQUENT | ERR_INSUFFICIENT_CREDIT | ERR_SKIP_LIMIT_EXCEEDED"
    http_status: 402
    applies_to: "pause, resume, credit-redemption create/fulfill, credit-adjustments, pickup skip"
  - priority: 9
    category: business_constraint
    check: "structural constraints: route weekly slot capacity; clean-bin availability; plan-change bin-count compatibility; one open tag per pickup; weigh ticket uniqueness and allocatability; void locked after weigh ticket"
    error_id: "ERR_ROUTE_CAPACITY | ERR_NO_BIN_AVAILABLE | ERR_PLAN_DOWNGRADE_BLOCKED | ERR_TAG_ALREADY_OPEN | ERR_DUPLICATE_WEIGH_TICKET | ERR_INVALID_WEIGHT | ERR_PICKUP_LOCKED_BY_WEIGH_TICKET"
    http_status: 409
    applies_to: "subscription create/plan-change, pickup complete/void, tag create, weigh-ticket create"
  - priority: 10
    category: business_temporal
    check: "temporal rules: skip cutoff (now < service_date - 48h); pause window overlap (half-open, adjacency allowed); generate-stops service_date weekday matches route weekday; commercial billing requires posted weigh tickets"
    error_id: "ERR_SKIP_CUTOFF_PASSED | ERR_PAUSE_WINDOW_OVERLAP | ERR_SERVICE_DATE_WEEKDAY_MISMATCH | ERR_WEIGH_TICKET_PENDING"
    http_status: 422
    applies_to: "skip, pause, generate-stops, billing run"

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# (list endpoints sort by created_at ASC unless noted; Subscriber-scoped lists
#  are force-filtered to the caller's own subscriber id)
# =============================================================================
endpoints:
  # --- ServicePlan ---
  - { method: POST, path: "/service-plans", description: "Create a service plan (config)", roles: [OperationsManager], code: 201, input: [code, name, subscriber_type, bin_type, included_bins, weekly_price_cents, metered_base_cents, per_kg_rate_cents, included_kg_per_week, credit_rate_cents_per_kg, skip_allowance_per_quarter], output: ServicePlan, side_effects: [] }
  - { method: GET, path: "/service-plans/{id}", description: "Read a service plan", roles: [Subscriber, OperationsManager], code: 200, input: [], output: ServicePlan, side_effects: [] }

  # --- Subscriber ---
  - { method: POST, path: "/subscribers", description: "Self-signup a subscriber; account_standing GOOD_STANDING, credit_balance_cents 0", roles: [Anonymous], code: 201, input: [email, full_name, subscriber_type, address], output: Subscriber, side_effects: [] }
  - { method: GET, path: "/subscribers/{id}", description: "Read a subscriber (own or ops); account_standing derived on read", roles: [Subscriber, OperationsManager], code: 200, input: [], output: Subscriber, side_effects: [] }
  - { method: GET, path: "/subscribers/{id}/impact", description: "Diversion/impact report (calculations.impact_report)", roles: [Subscriber, OperationsManager], code: 200, input: [], output: "{ total_kg_diverted: number, total_co2e_kg: number, pickups_completed: integer, contamination_tags_confirmed: integer }", side_effects: [] }
  - { method: POST, path: "/subscribers/{id}/credit-adjustments", description: "Manual signed credit adjustment; balance must not go negative", roles: [OperationsManager], code: 201, input: [amount_cents, reason], output: CompostCreditEntry, side_effects: ["create MANUAL_ADJUSTMENT entry; Subscriber.credit_balance_cents += amount_cents (reject if result < 0, ERR_INSUFFICIENT_CREDIT)"] }

  # --- Subscription ---
  - method: POST
    path: "/subscriptions"
    description: "Create a subscription; plan.subscriber_type must equal subscriber.subscriber_type (else ERR_INVALID_REQUEST); auto-assigns included_bins clean depot bins (selector: bin_type == plan.bin_type AND status == IN_DEPOT AND condition == CLEAN, ordered by created_at ASC; shortage -> ERR_NO_BIN_AVAILABLE); route must have a free weekly slot (active_subscriptions_count < max_stops else ERR_ROUTE_CAPACITY)"
    roles: [Subscriber, OperationsManager]
    code: 201
    input: [subscriber_id, plan_id, route_id, start_date]
    output: Subscription
    side_effects: ["service_status ACTIVE", "selected bins -> AT_CUSTOMER with current_subscription_id set", "route.active_subscriptions_count recomputed"]
  - { method: GET, path: "/subscriptions", description: "List subscriptions with optional filters (Subscriber callers are force-scoped to own id)", roles: [Subscriber, OperationsManager], code: 200, input: ["subscriber_id?", "plan_id?", "route_id?", "status?"], output: "Subscription[]", side_effects: [] }
  - { method: GET, path: "/subscriptions/{id}", description: "Read a subscription", roles: [Subscriber, OperationsManager], code: 200, input: [], output: Subscription, side_effects: [] }
  - { method: POST, path: "/subscriptions/{id}/pause", description: "Pause service over a half-open window; see Subscription state machine", roles: [Subscriber, OperationsManager], code: 200, input: [pause_start, pause_end], output: Subscription, side_effects: ["window appended; SCHEDULED pickups inside window -> CANCELLED_SYSTEM; version + 1"] }
  - { method: POST, path: "/subscriptions/{id}/resume", description: "Resume a paused subscription; blocked while delinquent", roles: [Subscriber, OperationsManager], code: 200, input: [], output: Subscription, side_effects: ["version + 1"] }
  - { method: POST, path: "/subscriptions/{id}/cancel", description: "Cancel from ACTIVE/PAUSED/SUSPENDED; returns bins to depot NEEDS_WASH; cancels SCHEDULED pickups", roles: [Subscriber, OperationsManager], code: 200, input: [], output: Subscription, side_effects: ["bins returned", "SCHEDULED pickups -> CANCELLED_SYSTEM", "version + 1"] }
  - { method: POST, path: "/subscriptions/{id}/plan-change", description: "Replace plan (OCC on Subscription.version; same subscriber_type; no downgrade below assigned bin count)", roles: [Subscriber, OperationsManager], code: 200, input: [new_plan_id, expected_subscription_version], output: Subscription, side_effects: ["plan_id replaced", "increments Subscription.version by 1"] }

  # --- Route ---
  - { method: POST, path: "/routes", description: "Create a weekly route", roles: [OperationsManager], code: 201, input: [code, weekday, max_stops], output: Route, side_effects: [] }
  - { method: GET, path: "/routes/{id}", description: "Read a route (includes active_subscriptions_count)", roles: [Driver, OperationsManager], code: 200, input: [], output: Route, side_effects: [] }
  - method: POST
    path: "/routes/{id}/generate-stops"
    description: "Generate the week's PickupEvents: for each subscription with service_status == ACTIVE, route_id == this route, start_date <= service_date, and no existing pickup for service_date, in subscription.created_at ASC order. Idempotent: already-covered subscriptions are skipped."
    roles: [OperationsManager]
    code: 200
    input: [service_date]
    output: "{ created_count: integer, pickup_ids: string[] }"
    side_effects: ["creates SCHEDULED PickupEvents"]
  - method: POST
    path: "/routes/{id}/weigh-tickets"
    description: "Post facility weigh-in for a route+date; allocates net kg to COMPLETED pickups and reconciles credits (calculations.weighed_allocation)"
    roles: [Driver, OperationsManager]
    code: 201
    input: [service_date, gross_kg, tare_kg]
    output: WeighTicket
    side_effects: ["final_kg set per pickup", "EARNED_FINAL_ADJUSTMENT entries created", "Subscriber.credit_balance_cents recomputed"]

  # --- Bin ---
  - { method: POST, path: "/bins", description: "Register a bin into the depot fleet (status IN_DEPOT, condition CLEAN)", roles: [OperationsManager], code: 201, input: [bin_type, nominal_capacity_kg], output: Bin, side_effects: [] }
  - { method: GET, path: "/bins", description: "List bins with optional filters", roles: [Driver, OperationsManager], code: 200, input: ["current_subscription_id?", "status?", "condition?"], output: "Bin[]", side_effects: [] }
  - { method: GET, path: "/bins/{id}", description: "Read a bin", roles: [Driver, OperationsManager], code: 200, input: [], output: Bin, side_effects: [] }
  - { method: POST, path: "/bins/{id}/wash", description: "Wash a returned bin: IN_DEPOT + NEEDS_WASH -> condition CLEAN (status unchanged)", roles: [OperationsManager], code: 200, input: [], output: Bin, side_effects: ["condition := CLEAN", "version + 1"] }

  # --- PickupEvent ---
  - { method: GET, path: "/pickups", description: "List pickups with optional filters, created_at ASC (Subscriber callers force-scoped to own subscriptions)", roles: [Subscriber, Driver, OperationsManager], code: 200, input: ["subscription_id?", "route_id?", "collected_bin_id?", "replacement_bin_id?", "status?"], output: "PickupEvent[]", side_effects: [] }
  - { method: GET, path: "/pickups/{id}", description: "Read a pickup", roles: [Subscriber, Driver, OperationsManager], code: 200, input: [], output: PickupEvent, side_effects: [] }
  - { method: POST, path: "/pickups/{id}/complete", description: "Driver completes a stop: records fullness, swaps bin, posts estimated credit (atomic)", roles: [Driver], code: 200, input: [fullness_pct], output: PickupEvent, side_effects: ["status COMPLETED", "bin swap", "EARNED_ESTIMATED credit entry", "version + 1"] }
  - { method: POST, path: "/pickups/{id}/miss", description: "Driver marks a stop missed (driver fault; week not billed)", roles: [Driver], code: 200, input: [], output: PickupEvent, side_effects: ["status MISSED", "version + 1"] }
  - { method: POST, path: "/pickups/{id}/skip", description: "Subscriber skips a stop before the 48h cutoff within quarterly allowance", roles: [Subscriber], code: 200, input: [], output: PickupEvent, side_effects: ["status SKIPPED", "skips_used_this_quarter += 1 (lazy quarter reset)", "version + 1"] }
  - { method: POST, path: "/pickups/{id}/void", description: "Ops voids a completed pickup before its weigh ticket; reverses estimated credit", roles: [OperationsManager], code: 200, input: [], output: PickupEvent, side_effects: ["status VOIDED", "REVERSAL credit entry", "version + 1"] }

  # --- ContaminationTag ---
  - { method: POST, path: "/pickups/{id}/contamination-tags", description: "Driver tags contamination on a SCHEDULED or COMPLETED pickup; one open tag per pickup. SCHEDULED pickup -> REJECTED_CONTAMINATION; COMPLETED pickup keeps status but forfeits earned credit via REVERSAL", roles: [Driver], code: 201, input: [severity, category, "note?"], output: ContaminationTag, side_effects: ["tag TAGGED with tagged_by_driver_id", "pickup transition or credit forfeiture"] }
  - { method: GET, path: "/contamination-tags", description: "List tags with optional filters (Subscriber callers force-scoped to own)", roles: [Subscriber, Driver, OperationsManager], code: 200, input: ["pickup_id?", "subscription_id?", "status?"], output: "ContaminationTag[]", side_effects: [] }
  - { method: GET, path: "/contamination-tags/{id}", description: "Read a contamination tag", roles: [Subscriber, Driver, OperationsManager], code: 200, input: [], output: ContaminationTag, side_effects: [] }
  - { method: POST, path: "/contamination-tags/{id}/dispute", description: "Subscriber disputes an open tag (TAGGED -> DISPUTED)", roles: [Subscriber], code: 200, input: [], output: ContaminationTag, side_effects: ["version + 1"] }
  - { method: POST, path: "/contamination-tags/{id}/confirm", description: "Ops confirms a tag (never the tagging driver): surcharge computed, strike cascade", roles: [OperationsManager], code: 200, input: [], output: ContaminationTag, side_effects: ["surcharge_cents stamped", "strike_count += 1", "possible suspension cascade", "resolved_at set", "version + 1"] }
  - { method: POST, path: "/contamination-tags/{id}/waive", description: "Ops waives a tag (never the tagging driver): pickup returns to SCHEDULED; forfeited credit restored", roles: [OperationsManager], code: 200, input: [], output: ContaminationTag, side_effects: ["pickup REJECTED_CONTAMINATION -> SCHEDULED", "credit restore if forfeited", "resolved_at set", "version + 1"] }

  # --- WeighTicket ---
  - { method: GET, path: "/weigh-tickets", description: "List weigh tickets with optional route filter", roles: [Driver, OperationsManager], code: 200, input: ["route_id?"], output: "WeighTicket[]", side_effects: [] }
  - { method: GET, path: "/weigh-tickets/{id}", description: "Read a weigh ticket", roles: [Driver, OperationsManager], code: 200, input: [], output: WeighTicket, side_effects: [] }

  # --- CompostCreditEntry ---
  - { method: GET, path: "/credit-entries", description: "List ledger entries with optional filters, created_at ASC (Subscriber callers force-scoped to own)", roles: [Subscriber, OperationsManager], code: 200, input: ["subscriber_id?", "pickup_id?", "redemption_id?", "invoice_id?", "entry_type?"], output: "CompostCreditEntry[]", side_effects: [] }
  - { method: GET, path: "/credit-entries/{id}", description: "Read a single ledger entry", roles: [Subscriber, OperationsManager], code: 200, input: [], output: CompostCreditEntry, side_effects: [] }

  # --- CreditRedemption ---
  - { method: POST, path: "/credit-redemptions", description: "Request finished-compost bags; requires an ACTIVE subscription, GOOD_STANDING, sufficient credit balance and stock (reserves stock at create; debits credit at fulfill)", roles: [Subscriber, OperationsManager], code: 201, input: [subscriber_id, bags], output: CreditRedemption, side_effects: ["stock reservation", "total_kg / total_cents computed"] }
  - { method: GET, path: "/credit-redemptions", description: "List redemptions (Subscriber callers force-scoped to own)", roles: [Subscriber, OperationsManager], code: 200, input: ["subscriber_id?", "status?"], output: "CreditRedemption[]", side_effects: [] }
  - { method: GET, path: "/credit-redemptions/{id}", description: "Read a redemption", roles: [Subscriber, OperationsManager], code: 200, input: [], output: CreditRedemption, side_effects: [] }
  - { method: POST, path: "/credit-redemptions/{id}/fulfill", description: "Ops fulfills a request: re-checks balance, posts REDEMPTION_DEBIT, converts reserved stock to redeemed", roles: [OperationsManager], code: 200, input: [], output: CreditRedemption, side_effects: ["REDEMPTION_DEBIT entry", "balance decreased", "version + 1"] }
  - { method: POST, path: "/credit-redemptions/{id}/cancel", description: "Cancel a pending request; releases the stock reservation", roles: [Subscriber, OperationsManager], code: 200, input: [], output: CreditRedemption, side_effects: ["reservation released", "version + 1"] }

  # --- Compost stock (computed read) ---
  - { method: GET, path: "/compost-stock", description: "Finished-compost stock (calculations.compost_stock)", roles: [Subscriber, Driver, OperationsManager], code: 200, input: [], output: "{ produced_kg: number, redeemed_kg: number, reserved_kg: number, available_kg: number }", side_effects: [] }

  # --- Billing / Invoice ---
  - method: POST
    path: "/billing/run"
    description: "Weekly billing run for a Monday week_start_date; one invoice per subscriber with billable activity; idempotent per (subscriber, week)"
    roles: [OperationsManager]
    code: 200
    input: [week_start_date]
    output: "{ issued_count: integer, invoice_ids: string[], skipped_subscriber_ids: string[] }"
    side_effects: ["invoices ISSUED with lines, credit application, INVOICE_APPLICATION_DEBIT entries"]
  - { method: GET, path: "/invoices", description: "List invoices (Subscriber callers force-scoped to own)", roles: [Subscriber, OperationsManager], code: 200, input: ["subscriber_id?", "status?"], output: "Invoice[]", side_effects: [] }
  - { method: GET, path: "/invoices/{id}", description: "Read an invoice", roles: [Subscriber, OperationsManager], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/invoices/{id}/pay", description: "Pay an ISSUED invoice", roles: [Subscriber, OperationsManager], code: 200, input: [], output: Invoice, side_effects: ["status PAID", "version + 1"] }
  - { method: POST, path: "/invoices/{id}/void", description: "Void an ISSUED invoice; restores applied credit via REVERSAL", roles: [OperationsManager], code: 200, input: [], output: Invoice, side_effects: ["status VOID", "credit restore", "version + 1"] }

  # --- Logical clock (test-driving endpoint) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time. All cutoff/due-date/quarter/season rules read this clock."
    roles: [OperationsManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not allowed on endpoint, or Subscriber caller does not own the target resource" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Tag confirm/waive attempted by the same X-User-ID that tagged the pickup" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum/range, pause_end <= pause_start, week_start not Monday, zero adjustment amount" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body id does not resolve" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_subscription_version does not match current Subscription.version on plan-change" }
  - { id: ERR_SUBSCRIPTION_STATE_CONFLICT, http: 409, condition: "Subscription in wrong from-state for pause/resume/plan-change (incl. terminal CANCELLED)" }
  - { id: ERR_SUBSCRIPTION_NOT_ACTIVE, http: 409, condition: "Dependent operation requires an ACTIVE subscription (skip, redemption create)" }
  - { id: ERR_PICKUP_NOT_ACTIONABLE, http: 409, condition: "Pickup in wrong state for complete/miss/skip/tag/void" }
  - { id: ERR_TAG_NOT_RESOLVABLE, http: 409, condition: "Tag not in TAGGED/DISPUTED for dispute/confirm/waive" }
  - { id: ERR_REDEMPTION_NOT_FULFILLABLE, http: 409, condition: "Redemption not REQUESTED for fulfill/cancel" }
  - { id: ERR_INVOICE_NOT_PAYABLE, http: 409, condition: "Invoice not ISSUED for pay/void" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Bin wash requires IN_DEPOT + NEEDS_WASH" }
  - { id: ERR_ACCOUNT_DELINQUENT, http: 402, condition: "Subscriber has an overdue ISSUED invoice; blocks pause/resume/redemption create" }
  - { id: ERR_INSUFFICIENT_CREDIT, http: 422, condition: "Credit balance below required amount (redemption create/fulfill, negative adjustment)" }
  - { id: ERR_SKIP_LIMIT_EXCEEDED, http: 422, condition: "Quarterly skip allowance exhausted (boundary: at the allowance is rejected)" }
  - { id: ERR_ROUTE_CAPACITY, http: 422, condition: "Route has no free weekly slot (active_subscriptions_count >= max_stops)" }
  - { id: ERR_NO_BIN_AVAILABLE, http: 422, condition: "No clean depot bin of the plan's bin_type for assignment or swap" }
  - { id: ERR_PLAN_DOWNGRADE_BLOCKED, http: 422, condition: "Plan-change crosses subscriber_type or new plan includes fewer bins than currently assigned" }
  - { id: ERR_TAG_ALREADY_OPEN, http: 409, condition: "Pickup already has an open (TAGGED/DISPUTED) contamination tag" }
  - { id: ERR_DUPLICATE_WEIGH_TICKET, http: 409, condition: "Weigh ticket already posted for (route_id, service_date)" }
  - { id: ERR_INVALID_WEIGHT, http: 422, condition: "net_kg <= 0, or no COMPLETED pickup with estimated_kg > 0 to allocate" }
  - { id: ERR_PICKUP_LOCKED_BY_WEIGH_TICKET, http: 409, condition: "Void or credit-forfeiting tag on a COMPLETED pickup whose route+date is already weighed" }
  - { id: ERR_SKIP_CUTOFF_PASSED, http: 422, condition: "Skip attempted at or after service_date 00:00Z minus 48h" }
  - { id: ERR_PAUSE_WINDOW_OVERLAP, http: 422, condition: "New pause window overlaps a recorded window (half-open; adjacency allowed)" }
  - { id: ERR_SERVICE_DATE_WEEKDAY_MISMATCH, http: 422, condition: "generate-stops service_date weekday != route.weekday" }
  - { id: ERR_WEIGH_TICKET_PENDING, http: 422, condition: "Billing run aborted: a COMPLETED commercial pickup in the week lacks a weigh ticket" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated signup caller"
    identity: opaque
    exclusive_operations:
      - "POST /subscribers"
    shared_operations: []

  - name: Subscriber
    description: "Service customer; owns subscriptions, pickups, tags, redemptions, invoices via subscriber chain"
    identity: "entity_backed:Subscriber"
    exclusive_operations:
      - "POST /pickups/{id}/skip"
      - "POST /contamination-tags/{id}/dispute"
    shared_operations:
      - "GET own subscribers / subscriptions / pickups / contamination-tags / credit-entries / credit-redemptions / invoices (force-scoped)"
      - "GET /subscribers/{id}/impact, GET /compost-stock, GET /service-plans/{id}"
      - "POST /subscriptions, POST /subscriptions/{id}/pause|resume|cancel|plan-change (own)"
      - "POST /credit-redemptions, POST /credit-redemptions/{id}/cancel (own)"
      - "POST /invoices/{id}/pay (own)"

  - name: Driver
    description: "Route operator; X-User-ID is an opaque operator id recorded as tagged_by_driver_id (segregation-of-duties anchor)"
    identity: opaque
    exclusive_operations:
      - "POST /pickups/{id}/complete"
      - "POST /pickups/{id}/miss"
      - "POST /pickups/{id}/contamination-tags"
    shared_operations:
      - "GET /routes/{id}, GET /pickups(+{id}), GET /bins(+{id}), GET /contamination-tags, GET /weigh-tickets, GET /compost-stock"
      - "POST /routes/{id}/weigh-tickets"

  - name: OperationsManager
    description: "Back-office operator; X-User-ID is an opaque operator id; a person holding both Driver and OperationsManager grants is still barred from resolving their own tags"
    identity: opaque
    exclusive_operations:
      - "POST /service-plans, POST /routes, POST /routes/{id}/generate-stops, POST /bins, POST /bins/{id}/wash"
      - "POST /pickups/{id}/void"
      - "POST /contamination-tags/{id}/confirm, POST /contamination-tags/{id}/waive"
      - "POST /subscribers/{id}/credit-adjustments"
      - "POST /credit-redemptions/{id}/fulfill"
      - "POST /billing/run, POST /invoices/{id}/void"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"
      - "POST /subscriptions(+actions), POST /credit-redemptions(+cancel), POST /invoices/{id}/pay, POST /routes/{id}/weigh-tickets"
