  # =========================================================================
  # Cross-cutting layers — OCC, cascade, FK integrity
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: order_version_increments_on_each_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.RentalOrder.fields.version, "concurrency_rules[order-confirm-stale-version]"]
        distinguishing_aspect: "RentalOrder.version starts at 1 on create and increments by exactly 1 on each mutation: after one add-line it is 2."
        test_recipe:
          setup: ["CatalogItem CHAIR46; Customer C46; DRAFT order O46."]
          setup_api_calls:
            - call: "POST /catalog-items"
              payload: { sku: "CHAIR-46", name: "Chair 46", category: "CHAIR", total_units: 20, daily_rate_cents: 200, deposit_per_unit_cents: 0 }
              as: RentalAgent
              captures: { ch46_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c46@x.com", full_name: "C FortySix", phone: "555-0047" }
              as: RentalAgent
              captures: { c46_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c46_id}", fulfillment: "WILL_CALL", event_start: "2026-06-01T00:00:00.000Z", event_end: "2026-06-01T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c46_id}"
              captures: { o46_id: $.data.id, o46_v0: $.data.version }
          trigger:
            - call: "POST /orders/${o46_id}/lines"
              payload: { item_id: "${ch46_id}", quantity: 1 }
              as: Customer
              as_user_id: "${c46_id}"
              captures: { o46_v1: $.data.version }
          assert:
            - "RentalOrder.${o46_id}.version == 2"

      - name: cancel_cascades_release_lines_and_runs
        claim_type: cascading_side_effects
        grounds: [state_machines.RentalOrder.field=booking_status.CONFIRMED_to_CANCELLED, entities.OrderLine.fields.status, entities.DeliveryRun.fields.status]
        distinguishing_aspect: "Cancelling a CONFIRMED DELIVERY order with a SCHEDULED DROP_OFF run cascades: lines RESERVED->RELEASED and the run SCHEDULED->CANCELLED in one request."
        test_recipe:
          setup:
            - "CatalogItem CHAIR47 (total_units=20, deposit_per_unit=0). Customer C47; Venue V47; Crew CR47."
            - "DELIVERY order O47 confirmed (1 chair); DROP_OFF run R47 SCHEDULED."
          setup_api_calls:
            - call: "POST /catalog-items"
              payload: { sku: "CHAIR-47", name: "Chair 47", category: "CHAIR", total_units: 20, daily_rate_cents: 200, deposit_per_unit_cents: 0 }
              as: RentalAgent
              captures: { ch47_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c47@x.com", full_name: "C FortySeven", phone: "555-0048" }
              as: RentalAgent
              captures: { c47_id: $.data.id }
            - call: "POST /venues"
              payload: { customer_id: "${c47_id}", name: "Hall 47", address: "47 St", delivery_zone: "LOCAL" }
              as: Customer
              as_user_id: "${c47_id}"
              captures: { v47_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c47_id}", venue_id: "${v47_id}", fulfillment: "DELIVERY", event_start: "2026-07-28T00:00:00.000Z", event_end: "2026-07-28T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c47_id}"
              captures: { o47_id: $.data.id }
            - call: "POST /orders/${o47_id}/lines"
              payload: { item_id: "${ch47_id}", quantity: 1 }
              as: Customer
              as_user_id: "${c47_id}"
              captures: { o47_v: $.data.version }
            - call: "POST /orders/${o47_id}/confirm"
              payload: { expected_order_version: "${o47_v}" }
              as: Customer
              as_user_id: "${c47_id}"
              captures: { o47_v_conf: $.data.version }
            - call: "POST /crews"
              payload: { name: "Truck 47", turnaround_minutes: 0 }
              as: RentalAgent
              captures: { cr47_id: $.data.id }
            - call: "POST /delivery-runs"
              payload: { order_id: "${o47_id}", leg: "DROP_OFF", crew_id: "${cr47_id}", window_start: "2026-07-28T08:00:00.000Z", window_end: "2026-07-28T09:00:00.000Z" }
              as: RentalAgent
              captures: { r47_id: $.data.id }
          trigger:
