scenario: |
  Union Signatory & Production Agreement Compliance (SAG-AFTRA/IATSE signatory producer): signatory application & bond/security requirements, agreement selection by budget tier, crew classification & minimum staffing requirements, work rule (turnaround/meal/rest) monitoring, dispute/grievance intake & resolution, contribution reporting & audit, low-budget agreement compliance & upgrade triggers, strike/force majeure provisions

domain_name: union-signatory-production-agreement
api_prefix: /union-compliance

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - rate_threshold_triggers        # budget tier caps, grievance-count posture threshold
    - cascading_side_effects         # budget revision -> tier upgrade -> bond underfunded -> posture restricted; audit close -> bond forfeit -> company suspended
    - dual_variant_calculation       # contribution dues provisional vs final; audit assessment per-period vs aggregate
    - optimistic_concurrency         # OCC on Production.version (budget revisions) and Grievance.version (settlement proposals)
  entity_topology: flat              # peer entities joined by foreign keys; no nested creation paths
  state_machine_shape: cyclic        # application info-request loop and grievance negotiation loop; plus posture-gated lifecycle
  relationship_patterns:
    - one_to_many                    # Production -> Bond/CrewAssignment/WorkDayLog(via assignment)/Grievance/ContributionReport/Audit/ForceMajeureEvent
    - cross_aggregate                # Grievance references Production AND CrewAssignment; ContributionReport references WorkDayLog ids
  role_model: segregation_of_duties  # grievance intake vs settlement proposal; audit open vs close must be different operators
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ProducerCompany
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the production company" }
      - { name: fein, type: string, source: input, description: "Federal Employer Identification Number; unique across companies" }
      - { name: status, type: enum, source: system, description: "PENDING | SIGNATORY | SUSPENDED. Initial PENDING. SIGNATORY when an application is approved; SUSPENDED when any of its productions' bonds is forfeited; reinstated to SIGNATORY when the forfeited bond is re-posted and no bond of any of the company's productions remains FORFEITED or UNDERFUNDED" }
      - { name: signatory_since, type: datetime, source: system, default: null, description: "Logical-clock timestamp of first transition PENDING -> SIGNATORY; null while PENDING" }

  - name: SignatoryApplication
    parent: null
    common_fields: true
    fields:
      - { name: producer_company_id, type: string, source: input, description: "FK -> ProducerCompany.id; the applicant company" }
      - { name: requested_agreement_scope, type: enum, source: input, description: "THEATRICAL | TELEVISION | NEW_MEDIA" }
      - { name: estimated_slate_budget_cents, type: integer, source: input, description: "Estimated aggregate budget of the company's planned slate" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | INFO_REQUESTED | APPROVED | DENIED. Initial DRAFT" }
      - { name: review_rounds, type: integer, source: system, default: 0, description: "Number of UNDER_REVIEW -> INFO_REQUESTED cycles consumed; capped at MAX_REVIEW_ROUNDS = 3" }
      - { name: denial_reason, type: string, source: system, default: null, description: "Set from decide payload when decision = DENY" }

  - name: Production
    parent: null
    common_fields: true
    fields:
      - { name: producer_company_id, type: string, source: input, description: "FK -> ProducerCompany.id; owning company (ownership anchor for ProducerRep)" }
      - { name: title, type: string, source: input, description: "Production title" }
      - { name: agreement_tier, type: enum, source: input, description: "ULTRA_LOW_BUDGET | MODIFIED_LOW_BUDGET | LOW_BUDGET | BASIC. Chosen at creation (must cover budget_cents); auto-upgraded (never downgraded) by budget revisions per budget_tier_selection" }
      - { name: budget_cents, type: integer, source: input, description: "Current total production budget; mutated by POST budget-revisions" }
      - { name: status, type: enum, source: system, description: "REGISTERED | STAFFING | IN_PRODUCTION | SUSPENDED | WRAPPED | CLOSED. Initial REGISTERED" }
      - { name: pre_suspension_status, type: enum, source: system, default: null, description: "Status (STAFFING or IN_PRODUCTION) recorded when a force majeure event suspends the production; restored on lift" }
      - { name: compliance_posture, type: enum, source: computed, description: "CLEAR | RESTRICTED | FROZEN. Persisted derived field per posture_derivation; recomputed on every triggering mutation; gates crew hiring (requires CLEAR) and work-log/report creation (requires not FROZEN)" }

  - name: Bond
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: system, description: "FK -> Production.id; auto-created (status PENDING) as a side effect of Production creation; exactly one Bond per Production" }
      - { name: amount_required_cents, type: integer, source: computed, description: "Flat per-tier requirement from BOND_REQUIRED_BY_TIER keyed on the production's CURRENT agreement_tier; recomputed on tier upgrade" }
      - { name: amount_held_cents, type: integer, source: computed, description: "= total_posted_cents - total_released_cents - total_forfeited_cents" }
      - { name: total_posted_cents, type: integer, source: system, default: 0, description: "Cumulative cents posted via post/top-up" }
      - { name: total_released_cents, type: integer, source: system, default: 0, description: "Cumulative cents released" }
      - { name: total_forfeited_cents, type: integer, source: system, default: 0, description: "Cumulative cents forfeited to cover unpaid audit assessments" }
      - { name: status, type: enum, source: system, description: "PENDING | POSTED | UNDERFUNDED | RELEASED | FORFEITED. Initial PENDING" }

  - name: CrewAssignment
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: crew_member_ref, type: string, source: input, description: "External worker reference; at most one assignment per (production_id, crew_member_ref) with status IN {HIRED, ACTIVE}" }
      - { name: department, type: enum, source: input, description: "CAMERA | GRIP_ELECTRIC | SOUND" }
      - { name: classification, type: enum, source: input, description: "DIRECTOR_OF_PHOTOGRAPHY | CAMERA_OPERATOR | GAFFER | KEY_GRIP | BOOM_OPERATOR | SOUND_MIXER" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Daily wage in cents; must be > 0" }
      - { name: status, type: enum, source: system, description: "HIRED | ACTIVE | WRAPPED | TERMINATED. Initial HIRED" }

  - name: WorkDayLog
    parent: null
    common_fields: true
    fields:
      - { name: crew_assignment_id, type: string, source: input, description: "FK -> CrewAssignment.id; at most one non-VOIDED log per (crew_assignment_id, work_date)" }
      - { name: work_date, type: string, source: input, description: "ISO 8601 calendar date (YYYY-MM-DD) of the work day" }
      - { name: call_time_minutes, type: integer, source: input, description: "Call time as minutes since midnight, 0 <= v < 1440" }
      - { name: wrap_time_minutes, type: integer, source: input, description: "Wrap time as minutes since midnight, 0 <= v < 1440, strictly greater than call_time_minutes" }
      - { name: meal_breaks, type: array, source: input, description: "List of {start_minutes, end_minutes} within [call_time_minutes, wrap_time_minutes]; may be empty (first meal is then treated as starting at wrap)" }
      - { name: meal_penalty_units, type: integer, source: computed, description: "Half-hour penalty units per work_log_penalties" }
      - { name: meal_penalty_cents, type: integer, source: computed, description: "meal_penalty_units * unit penalty (per-unit rounding pinned in work_log_penalties)" }
      - { name: turnaround_violation, type: boolean, source: computed, description: "True iff the immediately preceding calendar day has a non-VOIDED log for the same assignment and the rest interval is shorter than TURNAROUND_HOURS_BY_TIER of the production's current tier" }
      - { name: turnaround_penalty_cents, type: integer, source: computed, description: "round_half_up(daily_rate_cents / 8) when turnaround_violation else 0" }
      - { name: penalty_cents, type: integer, source: computed, description: "meal_penalty_cents + turnaround_penalty_cents" }
      - { name: status, type: enum, source: system, description: "OPEN | SUBMITTED | VOIDED. Initial OPEN" }

  - name: Grievance
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: crew_assignment_id, type: string, source: input, default: null, description: "FK -> CrewAssignment.id; optional; when provided the assignment MUST belong to production_id" }
      - { name: category, type: enum, source: input, description: "WORK_RULE | PAY | CLASSIFICATION | SAFETY | OTHER" }
      - { name: incident_date, type: string, source: input, description: "ISO 8601 date of the incident; filing window validated per grievance_filing_deadline" }
      - { name: description, type: string, source: input, description: "Free-text description" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the filing UnionRep (opaque operator id recorded for audit)" }
      - { name: intake_user_id, type: string, source: system, default: null, description: "X-User-ID of the UnionRep who accepted intake; settlement proposals must come from a DIFFERENT UnionRep user (segregation of duties)" }
      - { name: proposal_amount_cents, type: integer, source: system, default: null, description: "Amount of the current settlement proposal; a new proposal supersedes any OPEN proposal" }
      - { name: proposal_status, type: enum, source: system, description: "NONE | OPEN | SUPERSEDED | ACCEPTED | REJECTED. Initial NONE" }
      - { name: settlement_agreed_cents, type: integer, source: system, default: 0, description: "Agreed settlement (accepted proposal amount or arbitration award)" }
      - { name: settlement_paid_cents, type: integer, source: system, default: 0, description: "Cumulative payments minus refunds against the settlement" }
      - { name: status, type: enum, source: system, description: "FILED | INVESTIGATING | PROPOSED_SETTLEMENT | ESCALATED | RESOLVED | DECIDED | CLOSED. Initial FILED" }

  - name: ContributionReport
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: period_index, type: integer, source: input, description: "Reporting period number (>= 1); at most one report per (production_id, period_index) with status IN {DRAFT, SUBMITTED, ACCEPTED}" }
      - { name: work_day_log_ids, type: array, source: input, description: "Explicit inclusion set of WorkDayLog ids; each must belong (via CrewAssignment) to production_id, be non-VOIDED at creation, and not be listed on any other ACCEPTED report; must be non-empty" }
      - { name: provisional_gross_wages_cents, type: integer, source: computed, description: "Provisional-variant wage base at creation (OPEN and SUBMITTED listed logs, tier at creation)" }
      - { name: provisional_contributions_due_cents, type: integer, source: computed, description: "Provisional-variant dues at creation per contribution_dues" }
      - { name: final_gross_wages_cents, type: integer, source: computed, default: null, description: "Final-variant wage base computed at submit (SUBMITTED listed logs only, tier at submit)" }
      - { name: final_contributions_due_cents, type: integer, source: computed, default: null, description: "Final-variant dues computed at submit per contribution_dues" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED. Initial DRAFT" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "Set from review payload when decision = REJECT" }

  - name: Audit
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: scope_period_indices, type: array, source: input, description: "Period indices examined; non-empty" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID of the FundTrustee who opened the audit" }
      - { name: closed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the FundTrustee who closed the audit; MUST differ from opened_by_user_id (segregation of duties)" }
      - { name: assessment_cents, type: integer, source: computed, default: null, description: "Official assessment per audit_assessment per_period variant; computed at issue-findings" }
      - { name: alt_assessment_cents, type: integer, source: computed, default: null, description: "Informational aggregate variant per audit_assessment; computed at issue-findings" }
      - { name: assessment_paid_cents, type: integer, source: system, default: 0, description: "Cumulative payments against the assessment" }
      - { name: status, type: enum, source: system, description: "OPEN | FINDINGS_ISSUED | CLOSED. Initial OPEN" }

  - name: ForceMajeureEvent
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: event_type, type: enum, source: input, description: "STRIKE | NATURAL_DISASTER | OTHER" }
      - { name: start_date, type: string, source: input, description: "ISO 8601 date the event begins (inclusive)" }
      - { name: end_date, type: string, source: input, default: null, description: "ISO 8601 date the event ends (EXCLUSIVE bound); null = open-ended until lifted" }
      - { name: lifted_date, type: string, source: system, default: null, description: "ISO 8601 date (logical clock) the event was lifted" }
      - { name: status, type: enum, source: system, description: "ACTIVE | LIFTED. Initial ACTIVE" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ProducerCompany
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: SIGNATORY
        trigger: "side effect of SignatoryApplication decide with decision = APPROVE"
        actor: system
        preconditions: ["the approved application belongs to this company"]
        side_effects:
          - "signatory_since := current logical clock timestamp"
          - "increments ProducerCompany.version by 1"
      - from: SIGNATORY
        to: SUSPENDED
        trigger: "side effect of Bond -> FORFEITED on any production of this company (audit close with unpaid assessment)"
        actor: system
        preconditions: ["a Bond of one of the company's productions transitions to FORFEITED"]
        side_effects:
          - "increments ProducerCompany.version by 1"
      - from: SUSPENDED
        to: SIGNATORY
        trigger: "side effect of Bond re-post (FORFEITED -> POSTED) when no bond of any of the company's productions remains FORFEITED or UNDERFUNDED"
        actor: system
        preconditions: ["after the re-post, zero bonds across the company's productions are in status FORFEITED or UNDERFUNDED"]
        side_effects:
          - "increments ProducerCompany.version by 1"

  - entity: SignatoryApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /union-compliance/signatory-applications/{id}/submit"
        actor: ProducerRep
        preconditions: ["application status == DRAFT", "producer company status IN {PENDING, SIGNATORY, SUSPENDED}"]
        side_effects: ["increments SignatoryApplication.version by 1"]
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /union-compliance/signatory-applications/{id}/request-info"
        actor: UnionRep
        preconditions: ["application status == UNDER_REVIEW", "review_rounds < 3 (else ERR_REVIEW_ROUNDS_EXHAUSTED)"]
        side_effects: ["review_rounds += 1", "increments SignatoryApplication.version by 1"]
        note: "cycle leg of the info-request negotiation loop"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /union-compliance/signatory-applications/{id}/provide-info"
        actor: ProducerRep
        preconditions: ["application status == INFO_REQUESTED"]
        side_effects: ["increments SignatoryApplication.version by 1"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /union-compliance/signatory-applications/{id}/decide with decision = APPROVE"
        actor: UnionRep
        preconditions: ["application status == UNDER_REVIEW"]
        side_effects:
          - "if producer_company.status == PENDING then producer_company -> SIGNATORY and signatory_since stamped"
          - "increments SignatoryApplication.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /union-compliance/signatory-applications/{id}/decide with decision = DENY"
        actor: UnionRep
        preconditions: ["application status == UNDER_REVIEW", "denial_reason provided"]
        side_effects: ["denial_reason := payload value", "increments SignatoryApplication.version by 1"]

  - entity: Production
    initial_state: REGISTERED
    terminal_states: [CLOSED]
    transitions:
      - from: REGISTERED
        to: STAFFING
        trigger: "side effect of Bond PENDING -> POSTED"
        actor: system
        preconditions: ["the production's Bond transitions PENDING -> POSTED"]
        side_effects: ["increments Production.version by 1"]
      - from: STAFFING
        to: IN_PRODUCTION
        trigger: "POST /union-compliance/productions/{id}/start-production"
        actor: ProducerRep
        preconditions:
          - "production status == STAFFING (else ERR_PRODUCTION_STATE)"
          - "compliance_posture == CLEAR (RESTRICTED -> ERR_POSTURE_RESTRICTED; FROZEN -> ERR_POSTURE_FROZEN)"
          - "min_staffing_check satisfied for the production's agreement_tier (else ERR_MIN_STAFF_UNMET)"
        side_effects: ["increments Production.version by 1"]
      - from: IN_PRODUCTION
        to: WRAPPED
        trigger: "POST /union-compliance/productions/{id}/wrap-production"
        actor: ProducerRep
        preconditions:
          - "production status == IN_PRODUCTION"
          - "compliance_posture != FROZEN"
          - "every CrewAssignment of the production has status IN {WRAPPED, TERMINATED} (else ERR_PRODUCTION_STATE)"
        side_effects: ["increments Production.version by 1"]
      - from: WRAPPED
        to: CLOSED
        trigger: "POST /union-compliance/productions/{id}/close"
        actor: ProducerRep
        preconditions:
          - "production status == WRAPPED"
          - "compliance_posture != FROZEN"
          - "every ContributionReport of the production has status ACCEPTED (vacuously true when none exist)"
          - "every Grievance of the production has status CLOSED (vacuously true when none exist)"
          - "every Audit of the production has status CLOSED (vacuously true when none exist)"
          - "Bond status IN {POSTED, RELEASED}"
        side_effects: ["increments Production.version by 1"]
      - from: STAFFING
        to: SUSPENDED
        trigger: "side effect of ForceMajeureEvent declaration (POST /union-compliance/force-majeure-events)"
        actor: system
        preconditions: ["production status IN {STAFFING, IN_PRODUCTION} at declaration time"]
        side_effects:
          - "pre_suspension_status := STAFFING"
          - "compliance_posture recomputed (FROZEN while any event ACTIVE)"
          - "increments Production.version by 1"
      - from: IN_PRODUCTION
        to: SUSPENDED
        trigger: "side effect of ForceMajeureEvent declaration (POST /union-compliance/force-majeure-events)"
        actor: system
        preconditions: ["production status IN {STAFFING, IN_PRODUCTION} at declaration time"]
        side_effects:
          - "pre_suspension_status := IN_PRODUCTION"
          - "compliance_posture recomputed (FROZEN while any event ACTIVE)"
          - "increments Production.version by 1"
      - from: SUSPENDED
        to: STAFFING
        trigger: "side effect of ForceMajeureEvent lift when pre_suspension_status == STAFFING and no other event remains ACTIVE"
        actor: system
        preconditions: ["the lifted event was the last ACTIVE event of the production", "pre_suspension_status == STAFFING"]
        side_effects: ["pre_suspension_status := null", "compliance_posture recomputed", "increments Production.version by 1"]
      - from: SUSPENDED
        to: IN_PRODUCTION
        trigger: "side effect of ForceMajeureEvent lift when pre_suspension_status == IN_PRODUCTION and no other event remains ACTIVE"
        actor: system
        preconditions: ["the lifted event was the last ACTIVE event of the production", "pre_suspension_status == IN_PRODUCTION"]
        side_effects: ["pre_suspension_status := null", "compliance_posture recomputed", "increments Production.version by 1"]
      - from: ANY_NON_TERMINAL
        to: SAME
        trigger: "POST /union-compliance/productions/{id}/budget-revisions (not a status change; mutates budget_cents and possibly agreement_tier)"
        actor: ProducerRep
        preconditions:
          - "production status IN {REGISTERED, STAFFING, IN_PRODUCTION, SUSPENDED, WRAPPED}"
          - "expected_production_version == production.version (OCC, else ERR_STALE_VERSION)"
          - "new_budget_cents > 0 (else ERR_VALIDATION)"
        side_effects:
          - "budget_cents := new_budget_cents"
          - "if new_budget_cents exceeds the current tier cap, agreement_tier := smallest tier whose cap covers the new budget (budget_tier_selection; tier never downgrades)"
          - "TIER-UPGRADE CASCADE (when the tier changed): Bond.amount_required_cents recomputed from BOND_REQUIRED_BY_TIER of the new tier; if bond.amount_held_cents < new amount_required_cents then Bond POSTED -> UNDERFUNDED (its own transition), and that bond transition itself recomputes Production.compliance_posture (UNDERFUNDED bond forces RESTRICTED)"
          - "increments Production.version by 1"

  - entity: Bond
    initial_state: PENDING
    terminal_states: [RELEASED]
    transitions:
      - from: PENDING
        to: POSTED
        trigger: "POST /union-compliance/bonds/{id}/post"
        actor: ProducerRep
        preconditions: ["bond status == PENDING", "amount_cents >= amount_required_cents (else ERR_BOND_AMOUNT_INSUFFICIENT)"]
        side_effects:
          - "total_posted_cents += amount_cents; amount_held_cents recomputed"
          - "production REGISTERED -> STAFFING"
          - "production.compliance_posture recomputed"
          - "increments Bond.version by 1"
      - from: POSTED
        to: UNDERFUNDED
        trigger: "system: tier upgrade raised amount_required_cents above amount_held_cents"
        actor: system
        preconditions: ["production budget revision upgraded the tier", "amount_held_cents < amount_required_cents"]
        side_effects:
          - "production.compliance_posture recomputed (becomes RESTRICTED unless FROZEN)"
          - "increments Bond.version by 1"
      - from: UNDERFUNDED
        to: POSTED
        trigger: "POST /union-compliance/bonds/{id}/top-up"
        actor: ProducerRep
        preconditions: ["bond status == UNDERFUNDED", "amount_cents >= amount_required_cents - amount_held_cents (else ERR_BOND_AMOUNT_INSUFFICIENT)"]
        side_effects:
          - "total_posted_cents += amount_cents; amount_held_cents recomputed"
          - "production.compliance_posture recomputed (may return to CLEAR)"
          - "increments Bond.version by 1"
      - from: POSTED
        to: RELEASED
        trigger: "POST /union-compliance/bonds/{id}/release"
        actor: FundTrustee
        preconditions: ["bond status == POSTED", "production status == CLOSED (else ERR_BOND_STATE)"]
        side_effects:
          - "total_released_cents += amount_held_cents; amount_held_cents := 0 (full release)"
          - "increments Bond.version by 1"
      - from: POSTED
        to: FORFEITED
        trigger: "system: side effect of Audit close with assessment_paid_cents < assessment_cents"
        actor: system
        preconditions: ["audit of this bond's production closed with unpaid assessment"]
        side_effects:
          - "total_forfeited_cents += amount_held_cents; amount_held_cents := 0 (full forfeiture)"
          - "producer company SIGNATORY -> SUSPENDED (this company transition itself is the company-suspension cascade)"
          - "production.compliance_posture recomputed"
          - "increments Bond.version by 1"
      - from: UNDERFUNDED
        to: FORFEITED
        trigger: "system: side effect of Audit close with assessment_paid_cents < assessment_cents"
        actor: system
        preconditions: ["audit of this bond's production closed with unpaid assessment"]
        side_effects:
          - "total_forfeited_cents += amount_held_cents; amount_held_cents := 0"
          - "producer company SIGNATORY -> SUSPENDED"
          - "production.compliance_posture recomputed"
          - "increments Bond.version by 1"
      - from: FORFEITED
        to: POSTED
        trigger: "POST /union-compliance/bonds/{id}/post (re-post after forfeiture)"
        actor: ProducerRep
        preconditions: ["bond status == FORFEITED", "amount_cents >= amount_required_cents (else ERR_BOND_AMOUNT_INSUFFICIENT)"]
        side_effects:
          - "total_posted_cents += amount_cents; amount_held_cents recomputed"
          - "company reinstatement check: if no bond of any production of the company is FORFEITED or UNDERFUNDED, company SUSPENDED -> SIGNATORY"
          - "production.compliance_posture recomputed"
          - "increments Bond.version by 1"

  - entity: CrewAssignment
    initial_state: HIRED
    terminal_states: [WRAPPED, TERMINATED]
    transitions:
      - from: HIRED
        to: ACTIVE
        trigger: "POST /union-compliance/crew-assignments/{id}/transition with to_state = ACTIVE"
        actor: ProducerRep
        preconditions: ["assignment status == HIRED", "production status == IN_PRODUCTION (else ERR_PRODUCTION_STATE)", "production.compliance_posture != FROZEN"]
        side_effects: ["increments CrewAssignment.version by 1"]
      - from: HIRED
        to: WRAPPED
        trigger: "POST /union-compliance/crew-assignments/{id}/transition with to_state = WRAPPED"
        actor: ProducerRep
        preconditions: ["assignment status IN {HIRED, ACTIVE}", "production status == IN_PRODUCTION"]
        side_effects: ["increments CrewAssignment.version by 1"]
      - from: ACTIVE
        to: WRAPPED
        trigger: "POST /union-compliance/crew-assignments/{id}/transition with to_state = WRAPPED"
        actor: ProducerRep
        preconditions: ["assignment status IN {HIRED, ACTIVE}", "production status == IN_PRODUCTION"]
        side_effects: ["increments CrewAssignment.version by 1"]
      - from: HIRED
        to: TERMINATED
        trigger: "POST /union-compliance/crew-assignments/{id}/transition with to_state = TERMINATED"
        actor: ProducerRep
        preconditions: ["assignment status IN {HIRED, ACTIVE}", "production status != CLOSED"]
        side_effects: ["increments CrewAssignment.version by 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /union-compliance/crew-assignments/{id}/transition with to_state = TERMINATED"
        actor: ProducerRep
        preconditions: ["assignment status IN {HIRED, ACTIVE}", "production status != CLOSED"]
        side_effects: ["increments CrewAssignment.version by 1"]

  - entity: WorkDayLog
    initial_state: OPEN
    terminal_states: [VOIDED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /union-compliance/work-day-logs/{id}/submit"
        actor: ProducerRep
        preconditions: ["log status == OPEN (else ERR_WORKLOG_STATE)", "production.compliance_posture != FROZEN"]
        side_effects: ["penalty fields recomputed per work_log_penalties", "increments WorkDayLog.version by 1"]
      - from: OPEN
        to: VOIDED
        trigger: "POST /union-compliance/work-day-logs/{id}/void"
        actor: ProducerRep
        preconditions: ["log status IN {OPEN, SUBMITTED} (else ERR_WORKLOG_STATE)", "production.compliance_posture != FROZEN"]
        side_effects: ["log excluded from all contribution/audit aggregates from now on", "increments WorkDayLog.version by 1"]
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /union-compliance/work-day-logs/{id}/void (post-submission correction; allowed even when the log is listed on an ACCEPTED report — the resulting over-report is what audits detect)"
        actor: ProducerRep
        preconditions: ["log status IN {OPEN, SUBMITTED} (else ERR_WORKLOG_STATE)", "production.compliance_posture != FROZEN"]
        side_effects: ["log excluded from all contribution/audit aggregates from now on", "increments WorkDayLog.version by 1"]

  - entity: Grievance
    initial_state: FILED
    terminal_states: [CLOSED]
    transitions:
      - from: FILED
        to: INVESTIGATING
        trigger: "POST /union-compliance/grievances/{id}/accept-intake"
        actor: UnionRep
        preconditions: ["grievance status == FILED (else ERR_GRIEVANCE_STATE)"]
        side_effects: ["intake_user_id := X-User-ID of the acting UnionRep", "increments Grievance.version by 1"]
      - from: INVESTIGATING
        to: PROPOSED_SETTLEMENT
        trigger: "POST /union-compliance/grievances/{id}/propose-settlement"
        actor: UnionRep
        preconditions:
          - "grievance status == INVESTIGATING"
          - "X-User-ID of the acting UnionRep != intake_user_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"
          - "expected_grievance_version == grievance.version (OCC, else ERR_STALE_VERSION)"
        side_effects:
          - "if proposal_status == OPEN then proposal_status := SUPERSEDED (a new proposal supersedes the prior open one)"
          - "proposal_amount_cents := payload amount; proposal_status := OPEN"
          - "increments Grievance.version by 1"
      - from: PROPOSED_SETTLEMENT
        to: RESOLVED
        trigger: "POST /union-compliance/grievances/{id}/respond-settlement with decision = ACCEPT"
        actor: ProducerRep
        preconditions: ["grievance status == PROPOSED_SETTLEMENT", "proposal_status == OPEN"]
        side_effects:
          - "proposal_status := ACCEPTED; settlement_agreed_cents := proposal_amount_cents"
          - "if settlement_agreed_cents == 0 then grievance -> CLOSED immediately (and production.compliance_posture recomputed)"
          - "increments Grievance.version by 1"
      - from: PROPOSED_SETTLEMENT
        to: INVESTIGATING
        trigger: "POST /union-compliance/grievances/{id}/respond-settlement with decision = REJECT"
        actor: ProducerRep
        preconditions: ["grievance status == PROPOSED_SETTLEMENT", "proposal_status == OPEN"]
        side_effects: ["proposal_status := REJECTED", "increments Grievance.version by 1"]
        note: "cycle leg of the negotiation loop"
      - from: INVESTIGATING
        to: ESCALATED
        trigger: "POST /union-compliance/grievances/{id}/escalate"
        actor: UnionRep
        preconditions: ["grievance status IN {INVESTIGATING, PROPOSED_SETTLEMENT}"]
        side_effects: ["if proposal_status == OPEN then proposal_status := SUPERSEDED", "increments Grievance.version by 1"]
      - from: PROPOSED_SETTLEMENT
        to: ESCALATED
        trigger: "POST /union-compliance/grievances/{id}/escalate"
        actor: ProducerRep
        preconditions: ["grievance status IN {INVESTIGATING, PROPOSED_SETTLEMENT}"]
        side_effects: ["if proposal_status == OPEN then proposal_status := SUPERSEDED", "increments Grievance.version by 1"]
      - from: ESCALATED
        to: DECIDED
        trigger: "POST /union-compliance/grievances/{id}/decide"
        actor: Arbitrator
        preconditions: ["grievance status == ESCALATED (else ERR_GRIEVANCE_STATE)"]
        side_effects:
          - "settlement_agreed_cents := award_cents"
          - "if award_cents == 0 then grievance -> CLOSED immediately (and production.compliance_posture recomputed)"
          - "increments Grievance.version by 1"
      - from: RESOLVED
        to: CLOSED
        trigger: "system: side effect of POST /union-compliance/grievances/{id}/payments bringing settlement_paid_cents == settlement_agreed_cents"
        actor: system
        preconditions: ["settlement_paid_cents == settlement_agreed_cents after the payment"]
        side_effects: ["production.compliance_posture recomputed (open-grievance count drops)", "increments Grievance.version by 1"]
      - from: DECIDED
        to: CLOSED
        trigger: "system: side effect of POST /union-compliance/grievances/{id}/payments bringing settlement_paid_cents == settlement_agreed_cents"
        actor: system
        preconditions: ["settlement_paid_cents == settlement_agreed_cents after the payment"]
        side_effects: ["production.compliance_posture recomputed", "increments Grievance.version by 1"]

  - entity: ContributionReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /union-compliance/contribution-reports/{id}/submit"
        actor: ProducerRep
        preconditions: ["report status == DRAFT (else ERR_REPORT_STATE)", "production.compliance_posture != FROZEN"]
        side_effects:
          - "final_gross_wages_cents and final_contributions_due_cents computed per contribution_dues final variant (tier of the production AT SUBMIT TIME — a tier upgrade between create and submit retroactively changes the rate)"
          - "increments ContributionReport.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /union-compliance/contribution-reports/{id}/review with decision = ACCEPT"
        actor: FundTrustee
        preconditions: ["report status == SUBMITTED"]
        side_effects: ["listed work day logs become reported (ERR_LOG_ALREADY_REPORTED on future reports)", "increments ContributionReport.version by 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /union-compliance/contribution-reports/{id}/review with decision = REJECT"
        actor: FundTrustee
        preconditions: ["report status == SUBMITTED", "rejection_reason provided"]
        side_effects: ["rejection_reason := payload value; listed logs are freed for a replacement report", "increments ContributionReport.version by 1"]

  - entity: Audit
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FINDINGS_ISSUED
        trigger: "POST /union-compliance/audits/{id}/issue-findings"
        actor: FundTrustee
        preconditions: ["audit status == OPEN (else ERR_AUDIT_STATE)"]
        side_effects:
          - "assessment_cents (per_period variant) and alt_assessment_cents (aggregate variant) computed per audit_assessment"
          - "production.compliance_posture recomputed (FINDINGS_ISSUED with assessment_paid_cents < assessment_cents forces RESTRICTED)"
          - "increments Audit.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /union-compliance/audits/{id}/close (no findings issued; assessment treated as 0)"
        actor: FundTrustee
        preconditions: ["audit status IN {OPEN, FINDINGS_ISSUED}", "X-User-ID of the acting FundTrustee != opened_by_user_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["closed_by_user_id := X-User-ID", "production.compliance_posture recomputed", "increments Audit.version by 1"]
      - from: FINDINGS_ISSUED
        to: CLOSED
        trigger: "POST /union-compliance/audits/{id}/close"
        actor: FundTrustee
        preconditions: ["audit status IN {OPEN, FINDINGS_ISSUED}", "X-User-ID of the acting FundTrustee != opened_by_user_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects:
          - "closed_by_user_id := X-User-ID"
          - "if assessment_paid_cents < assessment_cents: FORFEIT CASCADE — the production's Bond transitions {POSTED, UNDERFUNDED} -> FORFEITED (full forfeiture of amount_held_cents), and that bond transition itself transitions ProducerCompany SIGNATORY -> SUSPENDED and recomputes Production.compliance_posture"
          - "production.compliance_posture recomputed"
          - "increments Audit.version by 1"

  - entity: ForceMajeureEvent
    initial_state: ACTIVE
    terminal_states: [LIFTED]
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /union-compliance/force-majeure-events/{id}/lift"
        actor: UnionRep
        preconditions: ["event status == ACTIVE (else ERR_FM_STATE)"]
        side_effects:
          - "lifted_date := current logical clock date"
          - "if no other event of the production remains ACTIVE: production SUSPENDED -> pre_suspension_status and pre_suspension_status := null"
          - "production.compliance_posture recomputed"
          - "increments ForceMajeureEvent.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: budget-revision-stale-production
    parent_entity: Production
    write_endpoint: "POST /union-compliance/productions/{id}/budget-revisions"
    occ_field: expected_production_version
    description: |
      Applying a budget revision to a Production whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just applied a budget revision (which may have
      legitimately upgraded the agreement tier and cascaded into the bond and
      posture) and the current writer's view of the production is therefore
      stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: grievance-proposal-stale-grievance
    parent_entity: Grievance
    write_endpoint: "POST /union-compliance/grievances/{id}/propose-settlement"
    occ_field: expected_grievance_version
    description: |
      Submitting a settlement proposal against a Grievance whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just proposed a settlement (which
      legitimately supersedes the prior open proposal) and the current
      writer's view of the grievance is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: budget_tier_selection
    trigger: "Production creation and POST /union-compliance/productions/{id}/budget-revisions"
    algorithm: threshold
    formula: |
      TIER_CAPS = { ULTRA_LOW_BUDGET: 30000000, MODIFIED_LOW_BUDGET: 75000000,
                    LOW_BUDGET: 250000000, BASIC: +infinity }
      covering(tier, budget) := budget <= TIER_CAPS[tier]   # boundary is INCLUSIVE
      At creation: the client-selected tier must satisfy covering(tier, budget_cents),
        else ERR_TIER_CAP_EXCEEDED.
      On budget revision: if covering(current_tier, new_budget_cents), tier unchanged
        (a lower budget NEVER downgrades the tier). Otherwise agreement_tier :=
        smallest tier T (in declaration order ULTRA_LOW_BUDGET < MODIFIED_LOW_BUDGET
        < LOW_BUDGET < BASIC) such that covering(T, new_budget_cents).
    input_set: "the production's budget_cents and agreement_tier"
    constants:
      ULB_CAP_CENTS: 30000000
      MODIFIED_LOW_CAP_CENTS: 75000000
      LOW_BUDGET_CAP_CENTS: 250000000
    precision: "integer cents; exact comparison"

  - name: bond_requirement
    trigger: "Production creation (Bond auto-created) and any tier upgrade"
    algorithm: threshold
    formula: |
      amount_required_cents := BOND_REQUIRED_BY_TIER[production.agreement_tier]
      Flat per-tier amounts; an upgrade strictly increases the requirement.
    input_set: "the production's current agreement_tier"
    constants:
      BOND_REQUIRED_BY_TIER: { ULTRA_LOW_BUDGET: 2500000, MODIFIED_LOW_BUDGET: 5000000, LOW_BUDGET: 10000000, BASIC: 25000000 }
    precision: "integer cents"

  - name: min_staffing_check
    trigger: "POST /union-compliance/productions/{id}/start-production"
    algorithm: threshold
    formula: |
      For each department D in {CAMERA, GRIP_ELECTRIC, SOUND}:
        count_D := number of CrewAssignments of the production with
                   department == D AND status IN {HIRED, ACTIVE}
      Requirement satisfied iff count_D >= MIN_CREW_BY_TIER_DEPT[tier][D] for ALL D.
      Boundary is INCLUSIVE: count == minimum passes; count == minimum - 1 fails.
    input_set: "CrewAssignments of the production with status IN {HIRED, ACTIVE} (WRAPPED and TERMINATED excluded)"
    constants:
      MIN_CREW_BY_TIER_DEPT:
        ULTRA_LOW_BUDGET: { CAMERA: 1, GRIP_ELECTRIC: 1, SOUND: 1 }
        MODIFIED_LOW_BUDGET: { CAMERA: 2, GRIP_ELECTRIC: 2, SOUND: 1 }
        LOW_BUDGET: { CAMERA: 3, GRIP_ELECTRIC: 2, SOUND: 2 }
        BASIC: { CAMERA: 4, GRIP_ELECTRIC: 3, SOUND: 2 }
    precision: "integer headcounts"

  - name: work_log_penalties
    trigger: "WorkDayLog creation and again on submit"
    algorithm: aggregation
    formula: |
      Let R := crew assignment's daily_rate_cents, T := production's current agreement_tier.
      FIRST_MEAL_START := min(start_minutes over meal_breaks) if meal_breaks non-empty
                          else wrap_time_minutes.
      delay_minutes := FIRST_MEAL_START - (call_time_minutes + MEAL_WINDOW_MINUTES)
      meal_penalty_units := 0 if delay_minutes <= 0 else ceil(delay_minutes / MEAL_PENALTY_UNIT_MINUTES)
      # NESTED ROUNDING ORDER (pinned): round the per-unit penalty FIRST, then multiply.
      unit_penalty_cents := round_half_up(R / 32)          # quarter-hour of an 8-hour day rate
      meal_penalty_cents := meal_penalty_units * unit_penalty_cents
      # Turnaround: look at the same assignment's non-VOIDED log whose work_date is
      # exactly the previous calendar day (this log's work_date - 1). If none, no violation.
      # elapsed_rest_minutes := (1440 - prev.wrap_time_minutes) + this.call_time_minutes
      # turnaround_violation := elapsed_rest_minutes < TURNAROUND_HOURS_BY_TIER[T] * 60
      # Boundary: elapsed == threshold minutes is NOT a violation (strict <).
      turnaround_penalty_cents := round_half_up(R / 8) if turnaround_violation else 0
      penalty_cents := meal_penalty_cents + turnaround_penalty_cents
    input_set: "the log itself; the previous calendar day's non-VOIDED WorkDayLog of the same crew assignment (if any); the assignment's daily_rate_cents; the production's current agreement_tier"
    constants:
      MEAL_WINDOW_MINUTES: 360
      MEAL_PENALTY_UNIT_MINUTES: 30
      TURNAROUND_HOURS_BY_TIER: { ULTRA_LOW_BUDGET: 12, MODIFIED_LOW_BUDGET: 12, LOW_BUDGET: 10, BASIC: 10 }
    precision: "integer cents; round_half_up applied per unit BEFORE multiplication (per-unit-then-multiply is the pinned order; sum-then-round is the rejected alternative)"

  - name: contribution_dues
    trigger: "ContributionReport creation (provisional variant) and submit (final variant)"
    algorithm: tiered_pricing
    formula: |
      wage_per_log_i := min(daily_rate_cents of log_i's assignment, DAILY_WAGE_CAP_CENTS[tier])
      gross_wages := sum(wage_per_log_i over included logs)
      contributions_due := round_half_up(gross_wages * RATE_NUM[tier] / 100)
      # Integer-exact: compute gross_wages * RATE_NUM first, then divide by 100 with
      # round_half_up to whole cents.
    input_set: "the report's explicit work_day_log_ids, filtered by the active variant's status rule"
    constants:
      CONTRIBUTION_RATE_NUM: { ULTRA_LOW_BUDGET: 17, MODIFIED_LOW_BUDGET: 18, LOW_BUDGET: 19, BASIC: 20 }
      DAILY_WAGE_CAP_CENTS: { ULTRA_LOW_BUDGET: 100000, MODIFIED_LOW_BUDGET: 150000, LOW_BUDGET: 250000, BASIC: 500000 }
    precision: "integer cents; round_half_up once at the end"
    variants:
      - name: provisional
        when: "at report creation"
        difference: "includes listed logs with status IN {OPEN, SUBMITTED} and uses the production's agreement_tier AT CREATION TIME; writes provisional_gross_wages_cents and provisional_contributions_due_cents"
      - name: final
        when: "at report submit"
        difference: "includes only listed logs with status == SUBMITTED (logs still OPEN contribute zero) and uses the production's agreement_tier AT SUBMIT TIME; writes final_gross_wages_cents and final_contributions_due_cents"

  - name: grievance_filing_deadline
    trigger: "POST /union-compliance/grievances (validation)"
    algorithm: interval_merge
    formula: |
      # CIRCULAR-LOOKING DEPENDENCY, pinned to exactly TWO passes (no further iteration):
      # Pass 1: provisional_deadline := incident_date + FILING_WINDOW_DAYS
      # Tolling: collect all ForceMajeureEvents of the production (status ACTIVE or LIFTED);
      #   each contributes the half-open interval [start_date, effective_end) where
      #   effective_end := COALESCE(end_date, lifted_date, current clock date).
      #   Merge overlapping intervals (union), intersect with [incident_date, provisional_deadline],
      #   tolling_days := total whole days of the intersection (end-exclusive day count).
      # Pass 2 (final): deadline := incident_date + FILING_WINDOW_DAYS + tolling_days.
      # Filing is valid iff current clock date <= deadline (INCLUSIVE boundary).
      # Violation -> ERR_FILING_WINDOW_EXPIRED.
    input_set: "grievance incident_date; all ForceMajeureEvents of the production; current logical clock date"
    constants:
      FILING_WINDOW_DAYS: 30
    precision: "whole days; half-open interval day counts"

  - name: audit_assessment
    trigger: "POST /union-compliance/audits/{id}/issue-findings"
    algorithm: aggregation
    formula: |
      For each ACCEPTED ContributionReport r of the production with r.period_index IN scope_period_indices:
        expected_r := contribution_dues FINAL formula evaluated over r.work_day_log_ids
                      keeping only logs whose CURRENT status != VOIDED, using the
                      production's CURRENT agreement_tier rate and cap.
        shortfall_r := expected_r - r.final_contributions_due_cents   # may be negative (over-report)
      OFFICIAL per_period variant (writes assessment_cents):
        assessment_cents := sum over r of round_half_up(max(0, shortfall_r) * 110 / 100)
        # per-period penalty with NO cross-period netting; per-period rounding then sum.
      INFORMATIONAL aggregate variant (writes alt_assessment_cents):
        alt_assessment_cents := round_half_up(max(0, sum(shortfall_r)) * 110 / 100)
        # nets over-reports against under-reports across periods before the penalty.
      If no ACCEPTED report exists in scope, both are 0.
    input_set: "ACCEPTED ContributionReports of the production in scope periods; current (non-VOIDED) status of their listed logs; the production's current agreement_tier"
    constants:
      AUDIT_PENALTY_RATE_NUM: 110   # 1.10x multiplier as 110/100
    precision: "integer cents; per-period round_half_up then sum (per_period); single round_half_up (aggregate)"
    variants:
      - name: per_period
        when: "official assessment (assessment_cents)"
        difference: "max(0, shortfall) applied per period BEFORE the penalty — over-reported periods cannot offset under-reported ones"
      - name: aggregate
        when: "informational comparison (alt_assessment_cents)"
        difference: "shortfalls netted across periods first, penalty applied to the net"

  - name: posture_derivation
    trigger: "recomputed and persisted whenever any input changes: ForceMajeureEvent declared/lifted; Grievance created or reaches CLOSED; Bond transitions PENDING/POSTED/UNDERFUNDED/FORFEITED; Audit transitions or payments"
    algorithm: aggregation
    formula: |
      open_grievances := count of Grievances of the production with
                         status IN {FILED, INVESTIGATING, PROPOSED_SETTLEMENT, ESCALATED}
      unpaid_audit_findings := any Audit of the production with status == FINDINGS_ISSUED
                               AND assessment_paid_cents < assessment_cents
      if any ForceMajeureEvent of the production has status == ACTIVE:
          compliance_posture := FROZEN
      elif open_grievances >= GRIEVANCE_RESTRICTION_THRESHOLD
           or bond.status IN {UNDERFUNDED, FORFEITED}
           or unpaid_audit_findings:
          compliance_posture := RESTRICTED
      else:
          compliance_posture := CLEAR
      # Evaluation priority is pinned: FROZEN > RESTRICTED > CLEAR.
    input_set: "ForceMajeureEvents, Grievances, Bond, Audits of the production with the explicit status filters above"
    constants:
      GRIEVANCE_RESTRICTION_THRESHOLD: 2
    precision: "integer counts; inclusive >= threshold"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role is in the endpoint's roles list", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "ProducerRep ownership: X-User-ID equals the id of the ProducerCompany that owns the target resource (directly, or via production_id)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "all ProducerRep endpoints except POST /union-compliance/producer-companies" }
  - { priority: 4, category: existence, check: "request body parses; all required fields present; enum fields carry declared members; integer fields in declared ranges", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 5, category: existence, check: "path ids and body FK references (producer_company_id, production_id, crew_assignment_id, work_day_log_ids elements) exist", error_id: ERR_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 6, category: state, check: "OCC: expected_<parent>_version equals the parent entity's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /union-compliance/productions/{id}/budget-revisions", "POST /union-compliance/grievances/{id}/propose-settlement"] }
  - { priority: 7, category: state, check: "production status permits the operation (crew create requires STAFFING|IN_PRODUCTION; log create requires IN_PRODUCTION; report create requires IN_PRODUCTION|WRAPPED; lifecycle actions require their from-state; FM declare requires STAFFING|IN_PRODUCTION; wrap-production additionally requires all assignments terminal)", error_id: ERR_PRODUCTION_STATE, http_status: 409, applies_to: ["POST /union-compliance/productions/{id}/start-production", "POST /union-compliance/productions/{id}/wrap-production", "POST /union-compliance/productions/{id}/close", "POST /union-compliance/productions/{id}/budget-revisions", "POST /union-compliance/crew-assignments", "POST /union-compliance/work-day-logs", "POST /union-compliance/contribution-reports", "POST /union-compliance/force-majeure-events", "POST /union-compliance/crew-assignments/{id}/transition"] }
  - { priority: 8, category: state, check: "production compliance_posture != FROZEN for work-log create/submit/void, report create/submit, crew transition; posture == CLEAR additionally required for crew create and start-production", error_id: ERR_POSTURE_FROZEN, http_status: 409, applies_to: ["POST /union-compliance/work-day-logs", "POST /union-compliance/work-day-logs/{id}/submit", "POST /union-compliance/work-day-logs/{id}/void", "POST /union-compliance/contribution-reports", "POST /union-compliance/contribution-reports/{id}/submit", "POST /union-compliance/crew-assignments/{id}/transition", "POST /union-compliance/crew-assignments", "POST /union-compliance/productions/{id}/start-production"] }
  - { priority: 9, category: state, check: "production compliance_posture == CLEAR where required (crew create, start-production); fires when posture is RESTRICTED (CLEAR-or-FROZEN handled by priorities 7-8)", error_id: ERR_POSTURE_RESTRICTED, http_status: 409, applies_to: ["POST /union-compliance/crew-assignments", "POST /union-compliance/productions/{id}/start-production"] }
  - { priority: 10, category: state, check: "application in required from-state (submit: DRAFT; request-info/decide: UNDER_REVIEW; provide-info: INFO_REQUESTED)", error_id: ERR_APPLICATION_STATE, http_status: 409, applies_to: ["POST /union-compliance/signatory-applications/{id}/submit", "POST /union-compliance/signatory-applications/{id}/request-info", "POST /union-compliance/signatory-applications/{id}/provide-info", "POST /union-compliance/signatory-applications/{id}/decide"] }
  - { priority: 11, category: state, check: "bond in required from-state (post: PENDING or FORFEITED; top-up: UNDERFUNDED; release: POSTED with production CLOSED)", error_id: ERR_BOND_STATE, http_status: 409, applies_to: ["POST /union-compliance/bonds/{id}/post", "POST /union-compliance/bonds/{id}/top-up", "POST /union-compliance/bonds/{id}/release"] }
  - { priority: 12, category: state, check: "crew assignment in required from-state (HIRED|ACTIVE for transitions; HIRED for activation); work-log creation requires the referenced assignment status == ACTIVE", error_id: ERR_ASSIGNMENT_STATE, http_status: 409, applies_to: ["POST /union-compliance/crew-assignments/{id}/transition", "POST /union-compliance/work-day-logs"] }
  - { priority: 13, category: state, check: "work log in required from-state (submit: OPEN; void: OPEN|SUBMITTED); also fires when a VOIDED log is listed in a new report", error_id: ERR_WORKLOG_STATE, http_status: 409, applies_to: ["POST /union-compliance/work-day-logs/{id}/submit", "POST /union-compliance/work-day-logs/{id}/void", "POST /union-compliance/contribution-reports"] }
  - { priority: 14, category: state, check: "grievance in required from-state (accept-intake: FILED; propose: INVESTIGATING; respond: PROPOSED_SETTLEMENT with proposal OPEN; escalate: INVESTIGATING|PROPOSED_SETTLEMENT; decide: ESCALATED; payments/refunds: RESOLVED|DECIDED)", error_id: ERR_GRIEVANCE_STATE, http_status: 409, applies_to: ["POST /union-compliance/grievances/{id}/accept-intake", "POST /union-compliance/grievances/{id}/propose-settlement", "POST /union-compliance/grievances/{id}/respond-settlement", "POST /union-compliance/grievances/{id}/escalate", "POST /union-compliance/grievances/{id}/decide", "POST /union-compliance/grievances/{id}/payments", "POST /union-compliance/grievances/{id}/refunds"] }
  - { priority: 15, category: state, check: "report in required from-state (submit: DRAFT; review: SUBMITTED)", error_id: ERR_REPORT_STATE, http_status: 409, applies_to: ["POST /union-compliance/contribution-reports/{id}/submit", "POST /union-compliance/contribution-reports/{id}/review"] }
  - { priority: 16, category: state, check: "audit in required from-state (issue-findings: OPEN; payments: FINDINGS_ISSUED; close: OPEN|FINDINGS_ISSUED)", error_id: ERR_AUDIT_STATE, http_status: 409, applies_to: ["POST /union-compliance/audits/{id}/issue-findings", "POST /union-compliance/audits/{id}/payments", "POST /union-compliance/audits/{id}/close"] }
  - { priority: 17, category: state, check: "force majeure event status == ACTIVE for lift", error_id: ERR_FM_STATE, http_status: 409, applies_to: ["POST /union-compliance/force-majeure-events/{id}/lift"] }
  - { priority: 18, category: state, check: "cross-entity: producer company status == SIGNATORY when creating a production", error_id: ERR_COMPANY_NOT_SIGNATORY, http_status: 409, applies_to: ["POST /union-compliance/productions"] }
  - { priority: 19, category: business_safety, check: "min_staffing_check satisfied for the production's tier at start-production", error_id: ERR_MIN_STAFF_UNMET, http_status: 422, applies_to: ["POST /union-compliance/productions/{id}/start-production"] }
  - { priority: 20, category: business_temporal, check: "grievance filing within window per grievance_filing_deadline (clock date <= incident_date + 30 + tolling_days)", error_id: ERR_FILING_WINDOW_EXPIRED, http_status: 422, applies_to: ["POST /union-compliance/grievances"] }
  - { priority: 21, category: business_referential, check: "grievance.crew_assignment_id (when provided) belongs to grievance.production_id; every id in report.work_day_log_ids belongs (via its assignment) to report.production_id", error_id: ERR_CROSS_PRODUCTION_REFERENCE, http_status: 422, applies_to: ["POST /union-compliance/grievances", "POST /union-compliance/contribution-reports"] }
  - { priority: 22, category: business_referential, check: "no id in report.work_day_log_ids appears on any other ACCEPTED report of the same production", error_id: ERR_LOG_ALREADY_REPORTED, http_status: 409, applies_to: ["POST /union-compliance/contribution-reports"] }
  - { priority: 23, category: business_constraint, check: "at most one CrewAssignment per (production_id, crew_member_ref) with status IN {HIRED, ACTIVE}", error_id: ERR_DUPLICATE_ACTIVE_ASSIGNMENT, http_status: 409, applies_to: ["POST /union-compliance/crew-assignments"] }
  - { priority: 24, category: business_constraint, check: "at most one non-VOIDED WorkDayLog per (crew_assignment_id, work_date) — day-point occupancy: the same calendar date is occupied; adjacent dates are unaffected", error_id: ERR_DUPLICATE_WORK_LOG, http_status: 409, applies_to: ["POST /union-compliance/work-day-logs"] }
  - { priority: 25, category: business_constraint, check: "at most one ContributionReport per (production_id, period_index) with status IN {DRAFT, SUBMITTED, ACCEPTED}", error_id: ERR_DUPLICATE_REPORT_PERIOD, http_status: 409, applies_to: ["POST /union-compliance/contribution-reports"] }
  - { priority: 26, category: business_constraint, check: "new force majeure event interval [start_date, COALESCE(end_date, +infinity)) must not overlap any existing event (ACTIVE or LIFTED) of the same production, using half-open semantics with effective end COALESCE(end_date, lifted_date); adjacency (start == other effective end) is ALLOWED", error_id: ERR_FM_OVERLAP, http_status: 409, applies_to: ["POST /union-compliance/force-majeure-events"] }
  - { priority: 27, category: business_constraint, check: "segregation of duties: propose-settlement actor != grievance.intake_user_id; audit close actor != audit.opened_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: ["POST /union-compliance/grievances/{id}/propose-settlement", "POST /union-compliance/audits/{id}/close"] }
  - { priority: 28, category: business_constraint, check: "application review_rounds < 3 before request-info", error_id: ERR_REVIEW_ROUNDS_EXHAUSTED, http_status: 422, applies_to: ["POST /union-compliance/signatory-applications/{id}/request-info"] }
  - { priority: 29, category: business_constraint, check: "report work_day_log_ids non-empty", error_id: ERR_EMPTY_REPORT, http_status: 422, applies_to: ["POST /union-compliance/contribution-reports"] }
  - { priority: 30, category: business_constraint, check: "wrap_time_minutes > call_time_minutes; every meal break lies within [call_time_minutes, wrap_time_minutes] with start < end; both times in [0, 1440)", error_id: ERR_INVALID_WORKLOG_TIMES, http_status: 422, applies_to: ["POST /union-compliance/work-day-logs"] }
  - { priority: 31, category: business_constraint, check: "at production creation the selected agreement_tier covers budget_cents per budget_tier_selection (budget <= tier cap, inclusive)", error_id: ERR_TIER_CAP_EXCEEDED, http_status: 422, applies_to: ["POST /union-compliance/productions"] }
  - { priority: 32, category: business_fiscal, check: "bond post/top-up amount sufficient (post: amount_cents >= amount_required_cents; top-up: amount_cents >= amount_required_cents - amount_held_cents)", error_id: ERR_BOND_AMOUNT_INSUFFICIENT, http_status: 422, applies_to: ["POST /union-compliance/bonds/{id}/post", "POST /union-compliance/bonds/{id}/top-up"] }
  - { priority: 33, category: business_fiscal, check: "payment would exceed the outstanding obligation (grievance: settlement_paid_cents + amount_cents <= settlement_agreed_cents; audit: assessment_paid_cents + amount_cents <= assessment_cents); amount_cents > 0", error_id: ERR_OVERPAYMENT, http_status: 422, applies_to: ["POST /union-compliance/grievances/{id}/payments", "POST /union-compliance/audits/{id}/payments"] }
  - { priority: 34, category: business_fiscal, check: "refund amount_cents > 0 and <= settlement_paid_cents", error_id: ERR_REFUND_EXCEEDS_PAID, http_status: 422, applies_to: ["POST /union-compliance/grievances/{id}/refunds"] }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving endpoint; outside the business surface) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time; all filing-window, signatory_since and lifted_date stamps read this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock := to_iso8601"]

  # --- ProducerCompany ---
  - method: POST
    path: "/union-compliance/producer-companies"
    description: "Register a production company (status PENDING). The response id becomes the caller's X-User-ID for subsequent ProducerRep calls."
    roles: [ProducerRep]
    code: 201
    input: [legal_name, fein]
    output: ProducerCompany
    side_effects: ["company created with status PENDING, version 1"]

  - method: GET
    path: "/union-compliance/producer-companies/{id}"
    description: "Read one company"
    roles: [ProducerRep, UnionRep, FundTrustee, Arbitrator, PlatformAdmin]
    code: 200
    input: []
    output: ProducerCompany
    side_effects: []

  - method: GET
    path: "/union-compliance/producer-companies/{id}/signatory-applications"
    description: "List a company's signatory applications (reverse reachability for SignatoryApplication.producer_company_id)"
    roles: [ProducerRep, UnionRep, FundTrustee, Arbitrator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: SignatoryApplication[]
    side_effects: []

  - method: GET
    path: "/union-compliance/producer-companies/{id}/productions"
    description: "List a company's productions (reverse reachability for Production.producer_company_id); supports limit/offset pagination"
    roles: [ProducerRep, UnionRep, FundTrustee, Arbitrator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Production[]
    side_effects: []

  # --- SignatoryApplication ---
  - method: POST
    path: "/union-compliance/signatory-applications"
    description: "Create a signatory application (status DRAFT) for a company"
    roles: [ProducerRep]
    code: 201
    input: [producer_company_id, requested_agreement_scope, estimated_slate_budget_cents]
    output: SignatoryApplication
    side_effects: []

  - method: POST
    path: "/union-compliance/signatory-applications/{id}/submit"
    description: "Submit application for union review: DRAFT -> UNDER_REVIEW"
    roles: [ProducerRep]
    code: 200
    input: []
    output: SignatoryApplication
    side_effects: ["transition per SignatoryApplication state machine"]

  - method: POST
    path: "/union-compliance/signatory-applications/{id}/request-info"
    description: "Union requests more information: UNDER_REVIEW -> INFO_REQUESTED (review_rounds += 1; max 3 rounds)"
    roles: [UnionRep]
    code: 200
    input: [info_request_note]
    output: SignatoryApplication
    side_effects: ["transition per SignatoryApplication state machine"]

  - method: POST
    path: "/union-compliance/signatory-applications/{id}/provide-info"
    description: "Producer answers an info request: INFO_REQUESTED -> UNDER_REVIEW"
    roles: [ProducerRep]
    code: 200
    input: [info_response]
    output: SignatoryApplication
    side_effects: ["transition per SignatoryApplication state machine"]

  - method: POST
    path: "/union-compliance/signatory-applications/{id}/decide"
    description: "Union decides the application: UNDER_REVIEW -> APPROVED (company PENDING -> SIGNATORY) or DENIED"
    roles: [UnionRep]
    code: 200
    input: [decision, "denial_reason?"]
    output: SignatoryApplication
    side_effects: ["on APPROVE: company transition per ProducerCompany state machine"]

  # --- Production ---
  - method: POST
    path: "/union-compliance/productions"
    description: "Create a production under an agreement tier (status REGISTERED; compliance_posture CLEAR). Auto-creates the production's Bond (PENDING) with amount_required_cents per bond_requirement."
    roles: [ProducerRep]
    code: 201
    input: [producer_company_id, title, agreement_tier, budget_cents]
    output: Production
    side_effects: ["Bond auto-created (PENDING)", "company must be SIGNATORY (ERR_COMPANY_NOT_SIGNATORY)", "tier must cover budget (ERR_TIER_CAP_EXCEEDED)"]

  - method: GET
    path: "/union-compliance/productions/{id}"
    description: "Read one production (including computed compliance_posture and current version for OCC)"
    roles: [ProducerRep, UnionRep, FundTrustee, Arbitrator, PlatformAdmin]
    code: 200
    input: []
    output: Production
    side_effects: []

  - method: POST
    path: "/union-compliance/productions/{id}/budget-revisions"
    description: "Apply a budget revision (OCC-guarded). May upgrade the agreement tier; tier upgrade cascades into bond requirement and posture."
    roles: [ProducerRep]
    code: 200
    input: [new_budget_cents, expected_production_version]
    output: Production
    side_effects: ["budget_cents updated", "possible tier upgrade per budget_tier_selection", "tier upgrade recomputes Bond.amount_required_cents and may flip Bond POSTED -> UNDERFUNDED", "posture recomputed", "increments Production.version by 1"]

  - method: POST
    path: "/union-compliance/productions/{id}/start-production"
    description: "STAFFING -> IN_PRODUCTION; requires posture CLEAR and per-tier minimum staffing"
    roles: [ProducerRep]
    code: 200
    input: []
    output: Production
    side_effects: ["transition per Production state machine"]

  - method: POST
    path: "/union-compliance/productions/{id}/wrap-production"
    description: "IN_PRODUCTION -> WRAPPED; requires all crew assignments terminal"
    roles: [ProducerRep]
    code: 200
    input: []
    output: Production
    side_effects: ["transition per Production state machine"]

  - method: POST
    path: "/union-compliance/productions/{id}/close"
    description: "WRAPPED -> CLOSED; requires all reports ACCEPTED, all grievances CLOSED, all audits CLOSED, bond POSTED or RELEASED"
    roles: [ProducerRep]
    code: 200
    input: []
    output: Production
    side_effects: ["transition per Production state machine"]

  - method: GET
    path: "/union-compliance/productions/{id}/bonds"
    description: "List the production's bond (0 or 1 element; reverse reachability for Bond.production_id)"
    roles: [ProducerRep, UnionRep, FundTrustee, Arbitrator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Bond[]
    side_effects: []

  - method: GET
    path: "/union-compliance/productions/{id}/crew-assignments"
    description: "List the production's crew assignments (reverse reachability for CrewAssignment.production_id)"
    roles: [ProducerRep, UnionRep, FundTrustee, Arbitrator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: CrewAssignment[]
    side_effects: []

  - method: GET
    path: "/union-compliance/productions/{id}/grievances"
    description: "List the production's grievances (reverse reachability for Grievance.production_id)"
    roles: [ProducerRep, UnionRep, FundTrustee, Arbitrator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Grievance[]
    side_effects: []

  - method: GET
    path: "/union-compliance/productions/{id}/contribution-reports"
    description: "List the production's contribution reports (reverse reachability for ContributionReport.production_id)"
    roles: [ProducerRep, UnionRep, FundTrustee, Arbitrator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ContributionReport[]
    side_effects: []

  - method: GET
    path: "/union-compliance/productions/{id}/audits"
    description: "List the production's audits (reverse reachability for Audit.production_id)"
    roles: [ProducerRep, UnionRep, FundTrustee, Arbitrator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Audit[]
    side_effects: []

  - method: GET
    path: "/union-compliance/productions/{id}/force-majeure-events"
    description: "List the production's force majeure events (reverse reachability for ForceMajeureEvent.production_id)"
    roles: [ProducerRep, UnionRep, FundTrustee, Arbitrator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ForceMajeureEvent[]
    side_effects: []

  # --- Bond ---
  - method: POST
    path: "/union-compliance/bonds/{id}/post"
    description: "Post the bond (PENDING -> POSTED) or re-post after forfeiture (FORFEITED -> POSTED). Posting flips production REGISTERED -> STAFFING; re-posting may reinstate the company."
    roles: [ProducerRep]
    code: 200
    input: [amount_cents]
    output: Bond
    side_effects: ["ledger totals updated", "production transition + posture recompute", "company reinstatement check on re-post", "increments Bond.version by 1"]

  - method: POST
    path: "/union-compliance/bonds/{id}/top-up"
    description: "Top up an UNDERFUNDED bond back to POSTED"
    roles: [ProducerRep]
    code: 200
    input: [amount_cents]
    output: Bond
    side_effects: ["ledger totals updated", "posture recomputed", "increments Bond.version by 1"]

  - method: POST
    path: "/union-compliance/bonds/{id}/release"
    description: "Release the full held amount of a POSTED bond once the production is CLOSED"
    roles: [FundTrustee]
    code: 200
    input: []
    output: Bond
    side_effects: ["total_released_cents += amount_held_cents; amount_held_cents := 0", "increments Bond.version by 1"]

  # --- CrewAssignment ---
  - method: POST
    path: "/union-compliance/crew-assignments"
    description: "Hire a crew member onto a production (status HIRED). Requires production STAFFING|IN_PRODUCTION and posture CLEAR (no workforce expansion while restricted)."
    roles: [ProducerRep]
    code: 201
    input: [production_id, crew_member_ref, department, classification, daily_rate_cents]
    output: CrewAssignment
    side_effects: []

  - method: GET
    path: "/union-compliance/crew-assignments/{id}"
    description: "Read one crew assignment"
    roles: [ProducerRep, UnionRep, FundTrustee, Arbitrator, PlatformAdmin]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: []

  - method: GET
    path: "/union-compliance/crew-assignments/{id}/work-day-logs"
    description: "List an assignment's work day logs (reverse reachability for WorkDayLog.crew_assignment_id)"
    roles: [ProducerRep, UnionRep, FundTrustee, Arbitrator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: WorkDayLog[]
    side_effects: []

  - method: GET
    path: "/union-compliance/crew-assignments/{id}/grievances"
    description: "List grievances filed against this assignment (reverse reachability for Grievance.crew_assignment_id)"
    roles: [ProducerRep, UnionRep, FundTrustee, Arbitrator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Grievance[]
    side_effects: []

  - method: POST
    path: "/union-compliance/crew-assignments/{id}/transition"
    description: "Transition an assignment: HIRED -> ACTIVE (production must be IN_PRODUCTION), HIRED|ACTIVE -> WRAPPED (production IN_PRODUCTION), HIRED|ACTIVE -> TERMINATED"
    roles: [ProducerRep]
    code: 200
    input: [to_state]
    output: CrewAssignment
    side_effects: ["transition per CrewAssignment state machine"]

  # --- WorkDayLog ---
  - method: POST
    path: "/union-compliance/work-day-logs"
    description: "Record a work day (status OPEN) for an ACTIVE assignment of an IN_PRODUCTION, non-FROZEN production. Penalty fields computed per work_log_penalties at creation."
    roles: [ProducerRep]
    code: 201
    input: [crew_assignment_id, work_date, call_time_minutes, wrap_time_minutes, meal_breaks]
    output: WorkDayLog
    side_effects: ["penalty fields computed per work_log_penalties"]

  - method: POST
    path: "/union-compliance/work-day-logs/{id}/submit"
    description: "OPEN -> SUBMITTED; penalty fields recomputed"
    roles: [ProducerRep]
    code: 200
    input: []
    output: WorkDayLog
    side_effects: ["penalty fields recomputed per work_log_penalties"]

  - method: POST
    path: "/union-compliance/work-day-logs/{id}/void"
    description: "OPEN|SUBMITTED -> VOIDED (correction). Allowed even when the log is listed on an ACCEPTED report; the over-report is detected at audit."
    roles: [ProducerRep]
    code: 200
    input: []
    output: WorkDayLog
    side_effects: ["log excluded from contribution/audit aggregates"]

  # --- Grievance ---
  - method: POST
    path: "/union-compliance/grievances"
    description: "File a grievance against a production (status FILED). Filing is NOT posture-gated (grievances may be filed during a strike). Filing window validated per grievance_filing_deadline."
    roles: [UnionRep]
    code: 201
    input: [production_id, "crew_assignment_id?", category, incident_date, description]
    output: Grievance
    side_effects: ["filed_by_user_id := X-User-ID", "production.compliance_posture recomputed (open-grievance count)"]

  - method: POST
    path: "/union-compliance/grievances/{id}/accept-intake"
    description: "FILED -> INVESTIGATING; records intake_user_id (the intaking UnionRep may NOT later propose the settlement)"
    roles: [UnionRep]
    code: 200
    input: []
    output: Grievance
    side_effects: ["intake_user_id := X-User-ID", "increments Grievance.version by 1"]

  - method: POST
    path: "/union-compliance/grievances/{id}/propose-settlement"
    description: "INVESTIGATING -> PROPOSED_SETTLEMENT (OCC-guarded). A new proposal supersedes any OPEN proposal. Segregation of duties vs intake_user_id."
    roles: [UnionRep]
    code: 200
    input: [proposal_amount_cents, expected_grievance_version]
    output: Grievance
    side_effects: ["prior OPEN proposal superseded", "proposal fields set", "increments Grievance.version by 1"]

  - method: POST
    path: "/union-compliance/grievances/{id}/respond-settlement"
    description: "Producer responds to an open proposal: ACCEPT -> RESOLVED (CLOSED immediately if amount is 0), REJECT -> back to INVESTIGATING (negotiation cycle)"
    roles: [ProducerRep]
    code: 200
    input: [decision]
    output: Grievance
    side_effects: ["settlement_agreed_cents set on ACCEPT", "posture recomputed if auto-CLOSED", "increments Grievance.version by 1"]

  - method: POST
    path: "/union-compliance/grievances/{id}/escalate"
    description: "INVESTIGATING|PROPOSED_SETTLEMENT -> ESCALATED; any open proposal is superseded"
    roles: [UnionRep, ProducerRep]
    code: 200
    input: []
    output: Grievance
    side_effects: ["proposal superseded if OPEN", "increments Grievance.version by 1"]

  - method: POST
    path: "/union-compliance/grievances/{id}/decide"
    description: "Arbitrator decides an ESCALATED grievance: ESCALATED -> DECIDED (CLOSED immediately if award is 0)"
    roles: [Arbitrator]
    code: 200
    input: [award_cents, "decision_notes?"]
    output: Grievance
    side_effects: ["settlement_agreed_cents := award_cents", "posture recomputed if auto-CLOSED", "increments Grievance.version by 1"]

  - method: POST
    path: "/union-compliance/grievances/{id}/payments"
    description: "Pay against an agreed settlement (RESOLVED|DECIDED). Auto-CLOSED when settlement_paid_cents reaches settlement_agreed_cents."
    roles: [ProducerRep]
    code: 200
    input: [amount_cents]
    output: Grievance
    side_effects: ["settlement_paid_cents += amount_cents", "possible auto-CLOSE + posture recompute", "increments Grievance.version by 1"]

  - method: POST
    path: "/union-compliance/grievances/{id}/refunds"
    description: "Reverse part of a settlement payment (compensating action; RESOLVED|DECIDED only, amount <= settlement_paid_cents)"
    roles: [ProducerRep]
    code: 200
    input: [amount_cents]
    output: Grievance
    side_effects: ["settlement_paid_cents -= amount_cents", "increments Grievance.version by 1"]

  # --- ContributionReport ---
  - method: POST
    path: "/union-compliance/contribution-reports"
    description: "Create a contribution report (status DRAFT) for a production and period with an explicit work_day_log_ids inclusion set. Provisional variant computed at creation."
    roles: [ProducerRep]
    code: 201
    input: [production_id, period_index, work_day_log_ids]
    output: ContributionReport
    side_effects: ["provisional fields computed per contribution_dues (provisional variant)"]

  - method: POST
    path: "/union-compliance/contribution-reports/{id}/submit"
    description: "DRAFT -> SUBMITTED; final variant computed using the production's tier at submit time"
    roles: [ProducerRep]
    code: 200
    input: []
    output: ContributionReport
    side_effects: ["final fields computed per contribution_dues (final variant)"]

  - method: POST
    path: "/union-compliance/contribution-reports/{id}/review"
    description: "Fund review: SUBMITTED -> ACCEPTED or REJECTED"
    roles: [FundTrustee]
    code: 200
    input: [decision, "rejection_reason?"]
    output: ContributionReport
    side_effects: ["on ACCEPT: listed logs become reported; on REJECT: logs freed"]

  # --- Audit ---
  - method: POST
    path: "/union-compliance/audits"
    description: "Open a fund audit of a production (status OPEN); opened_by_user_id recorded for segregation of duties"
    roles: [FundTrustee]
    code: 201
    input: [production_id, scope_period_indices]
    output: Audit
    side_effects: ["opened_by_user_id := X-User-ID"]

  - method: POST
    path: "/union-compliance/audits/{id}/issue-findings"
    description: "OPEN -> FINDINGS_ISSUED; computes assessment_cents (per_period) and alt_assessment_cents (aggregate) per audit_assessment"
    roles: [FundTrustee]
    code: 200
    input: []
    output: Audit
    side_effects: ["assessment fields computed", "posture recomputed"]

  - method: POST
    path: "/union-compliance/audits/{id}/payments"
    description: "Producer pays against an issued assessment (FINDINGS_ISSUED only)"
    roles: [ProducerRep]
    code: 200
    input: [amount_cents]
    output: Audit
    side_effects: ["assessment_paid_cents += amount_cents", "posture recomputed (paid-in-full may clear RESTRICTED)"]

  - method: POST
    path: "/union-compliance/audits/{id}/close"
    description: "OPEN|FINDINGS_ISSUED -> CLOSED. Segregation of duties vs opened_by_user_id. Unpaid assessment triggers the bond-forfeit cascade."
    roles: [FundTrustee]
    code: 200
    input: []
    output: Audit
    side_effects: ["closed_by_user_id := X-User-ID", "forfeit cascade when assessment_paid_cents < assessment_cents", "posture recomputed"]

  # --- ForceMajeureEvent ---
  - method: POST
    path: "/union-compliance/force-majeure-events"
    description: "Declare a strike/force majeure event (status ACTIVE). Suspends the production and freezes its posture. Half-open interval overlap check against existing events."
    roles: [UnionRep, ProducerRep]
    code: 201
    input: [production_id, event_type, start_date, "end_date?"]
    output: ForceMajeureEvent
    side_effects: ["production {STAFFING, IN_PRODUCTION} -> SUSPENDED with pre_suspension_status recorded", "posture -> FROZEN"]

  - method: POST
    path: "/union-compliance/force-majeure-events/{id}/lift"
    description: "ACTIVE -> LIFTED; restores the production's pre-suspension status when no other event remains ACTIVE"
    roles: [UnionRep]
    code: 200
    input: []
    output: ForceMajeureEvent
    side_effects: ["lifted_date := clock date", "production restored", "posture recomputed"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "role not in the endpoint's roles list" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "ProducerRep's X-User-ID does not match the ProducerCompany owning the target resource" }
  - { id: ERR_VALIDATION, http: 400, condition: "malformed body, missing required field, undeclared enum member, or out-of-range value" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "path id or body FK reference does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_APPLICATION_STATE, http: 409, condition: "application not in the required from-state for the requested action" }
  - { id: ERR_PRODUCTION_STATE, http: 409, condition: "production status does not permit the operation" }
  - { id: ERR_POSTURE_FROZEN, http: 409, condition: "operation blocked while production compliance_posture == FROZEN (active force majeure)" }
  - { id: ERR_POSTURE_RESTRICTED, http: 409, condition: "operation requires compliance_posture == CLEAR but posture is RESTRICTED" }
  - { id: ERR_BOND_STATE, http: 409, condition: "bond not in the required from-state (post: PENDING|FORFEITED; top-up: UNDERFUNDED; release: POSTED with production CLOSED)" }
  - { id: ERR_ASSIGNMENT_STATE, http: 409, condition: "crew assignment not in the required from-state (e.g., activate from non-HIRED, transition from terminal WRAPPED|TERMINATED)" }
  - { id: ERR_WORKLOG_STATE, http: 409, condition: "work log not in the required from-state, or a VOIDED log listed in a new contribution report" }
  - { id: ERR_GRIEVANCE_STATE, http: 409, condition: "grievance not in the required from-state (including respond without an OPEN proposal, payments outside RESOLVED|DECIDED, decide outside ESCALATED)" }
  - { id: ERR_REPORT_STATE, http: 409, condition: "contribution report not in the required from-state (submit: DRAFT; review: SUBMITTED)" }
  - { id: ERR_AUDIT_STATE, http: 409, condition: "audit not in the required from-state (issue-findings: OPEN; payments: FINDINGS_ISSUED; close: OPEN|FINDINGS_ISSUED)" }
  - { id: ERR_FM_STATE, http: 409, condition: "force majeure event not ACTIVE for lift" }
  - { id: ERR_COMPANY_NOT_SIGNATORY, http: 409, condition: "production creation requires the company status == SIGNATORY" }
  - { id: ERR_MIN_STAFF_UNMET, http: 422, condition: "per-tier per-department minimum staffing not satisfied at start-production" }
  - { id: ERR_FILING_WINDOW_EXPIRED, http: 422, condition: "grievance filed after incident_date + 30 days + force-majeure tolling (inclusive deadline)" }
  - { id: ERR_CROSS_PRODUCTION_REFERENCE, http: 422, condition: "referenced crew assignment or work day log belongs to a different production than the one named in the request" }
  - { id: ERR_LOG_ALREADY_REPORTED, http: 409, condition: "a listed work day log already appears on another ACCEPTED contribution report of the production" }
  - { id: ERR_DUPLICATE_ACTIVE_ASSIGNMENT, http: 409, condition: "another assignment for the same (production_id, crew_member_ref) exists with status HIRED or ACTIVE" }
  - { id: ERR_DUPLICATE_WORK_LOG, http: 409, condition: "a non-VOIDED work day log already exists for the same (crew_assignment_id, work_date)" }
  - { id: ERR_DUPLICATE_REPORT_PERIOD, http: 409, condition: "a report with status DRAFT, SUBMITTED or ACCEPTED already exists for the same (production_id, period_index)" }
  - { id: ERR_FM_OVERLAP, http: 409, condition: "force majeure interval overlaps an existing event of the production (half-open semantics; adjacency allowed)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "same operator attempted both steps of a segregated pair (grievance intake vs settlement proposal; audit open vs close)" }
  - { id: ERR_REVIEW_ROUNDS_EXHAUSTED, http: 422, condition: "request-info when application review_rounds has reached 3" }
  - { id: ERR_EMPTY_REPORT, http: 422, condition: "contribution report created with an empty work_day_log_ids set" }
  - { id: ERR_INVALID_WORKLOG_TIMES, http: 422, condition: "wrap not after call, times outside [0,1440), or meal break outside [call, wrap] / with start >= end" }
  - { id: ERR_TIER_CAP_EXCEEDED, http: 422, condition: "at creation, budget_cents exceeds the selected agreement tier's cap (inclusive boundary: budget == cap is allowed)" }
  - { id: ERR_BOND_AMOUNT_INSUFFICIENT, http: 422, condition: "bond post below amount_required_cents, or top-up below amount_required_cents - amount_held_cents" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "payment would exceed the outstanding settlement/assessment, or amount_cents <= 0" }
  - { id: ERR_REFUND_EXCEEDS_PAID, http: 422, condition: "refund exceeds settlement_paid_cents, or amount_cents <= 0" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProducerRep
    description: "Representative of a signatory (or applicant) production company; owns the company's productions and operates all production-side workflows"
    identity: "entity_backed:ProducerCompany"
    exclusive_operations:
      - create productions, apply budget revisions, run production lifecycle (start/wrap/close)
      - post/top-up bonds
      - hire and transition crew, record/submit/void work day logs
      - create/submit contribution reports
      - respond to settlement proposals, pay/refund settlements, pay audit assessments
    shared_operations:
      - create/submit/provide-info on own signatory applications (UnionRep reviews)
      - declare force majeure events (with UnionRep)
      - escalate grievances (with UnionRep)
      - read access to all resources

  - name: UnionRep
    description: "Union staffer (SAG-AFTRA/IATSE side); reviews signatory applications, files and works grievances, lifts force majeure events"
    identity: "opaque"
    exclusive_operations:
      - request-info / decide on signatory applications
      - file grievances, accept intake, propose settlements
      - lift force majeure events
    shared_operations:
      - declare force majeure events (with ProducerRep)
      - escalate grievances (with ProducerRep)
      - read access to all resources

  - name: FundTrustee
    description: "Pension & health fund trustee; reviews contribution reports, runs audits, releases bonds"
    identity: "opaque"
    exclusive_operations:
      - review (accept/reject) contribution reports
      - open audits, issue findings, close audits
      - release bonds
    shared_operations:
      - read access to all resources

  - name: Arbitrator
    description: "Neutral arbitrator deciding escalated grievances"
    identity: "opaque"
    exclusive_operations:
      - decide escalated grievances (binding award)
    shared_operations:
      - read access to all resources

  - name: PlatformAdmin
    description: "Platform operator; drives the logical clock for deterministic time-dependent behavior"
    identity: "opaque"
    exclusive_operations:
      - set the logical clock (POST /_clock/set_current_utc)
    shared_operations:
      - read access to all resources
