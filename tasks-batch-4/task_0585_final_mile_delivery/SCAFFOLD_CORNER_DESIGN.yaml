scaffold_corner_design:
  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_depot_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Depot, endpoints]
        distinguishing_aspect: "POST /depots with name+region_code returns 201 and a server-minted id, created_at, version=1, plus the echoed fields."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /depots"
              payload: { name: "Depot A", region_code: "CA" }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
          assert:
            - "trigger response HTTP status == 201"
            - "Depot.${depot_id}.region_code == 'CA'"
            - "Depot.${depot_id}.version == 1"

      - name: create_order_missing_service_level_returns_validation
        claim_type: Required Fields
        grounds: [entities.DeliveryOrder.fields.service_level, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /delivery-orders omitting the required service_level returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A CA customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cara", address_line: "1 St", region_code: "CA", geo_lat: 34.0, geo_lng: -118.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Table", weight_lbs: 100, volume_cuft: 20, declared_value_cents: 10000 }
              as: DispatchPlanner
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == 'ERR_VALIDATION'"
            - "trigger response HTTP status == 422"

      - name: create_order_applies_flag_defaults
        claim_type: Defaults
        grounds: [entities.DeliveryOrder.fields.assembly_required, entities.DeliveryOrder.fields.haul_away_required, entities.DeliveryOrder.fields.stair_flights]
        distinguishing_aspect: "Omitting assembly_required/haul_away_required/stair_flights defaults them to false/false/0; quoted_fee for a THRESHOLD weight-100 order == 5500."
        test_recipe:
          setup: ["A CA customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cara", address_line: "1 St", region_code: "CA", geo_lat: 34.0, geo_lng: -118.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Table", weight_lbs: 100, volume_cuft: 20, declared_value_cents: 10000, service_level: "THRESHOLD" }
              as: DispatchPlanner
              captures: { order_id: $.data.id }
          assert:
            - "DeliveryOrder.${order_id}.assembly_required == false"
            - "DeliveryOrder.${order_id}.haul_away_required == false"
            - "DeliveryOrder.${order_id}.stair_flights == 0"
            - "DeliveryOrder.${order_id}.quoted_fee_cents == 5500"

      - name: new_team_liability_points_default_zero
        claim_type: Computed Fields
        grounds: [entities.DeliveryTeam.fields.estimated_liability_points, entities.DeliveryTeam.fields.settled_liability_points]
        distinguishing_aspect: "A freshly created team has estimated_liability_points==0 and settled_liability_points==0."
        test_recipe:
          setup: ["A depot exists."]
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot A", region_code: "CA" }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
          trigger:
            - call: "POST /delivery-teams"
              payload: { depot_id: "${depot_id}", team_name: "T1", lead_name: "Lee", member2_name: "Max", region_code: "CA", max_daily_stops: 10, max_daily_weight_lbs: 500, max_daily_volume_cuft: 1000 }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
          assert:
            - "DeliveryTeam.${team_id}.estimated_liability_points == 0"
            - "DeliveryTeam.${team_id}.settled_liability_points == 0"

      - name: new_dock_status_defaults_open
        claim_type: Defaults
        grounds: [entities.Dock.fields.status, entities.Dock.fields.buffer_min]
        distinguishing_aspect: "A new dock defaults status==OPEN and buffer_min==30 when buffer_min is omitted."
        test_recipe:
          setup: ["A depot exists."]
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot A", region_code: "CA" }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
          trigger:
            - call: "POST /docks"
              payload: { depot_id: "${depot_id}", dock_code: "D1" }
              as: PlatformAdmin
              captures: { dock_id: $.data.id }
          assert:
            - "Dock.${dock_id}.status == 'OPEN'"
            - "Dock.${dock_id}.buffer_min == 30"

      - name: get_order_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "GET /delivery-orders/{unknown} returns ERR_ORDER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /delivery-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DispatchPlanner
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == 'ERR_ORDER_NOT_FOUND'"
            - "trigger response HTTP status == 404"

      - name: create_order_invalid_enum_service_level_returns_validation
        claim_type: Type Constraints
        grounds: [entities.DeliveryOrder.fields.service_level, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "A service_level outside {THRESHOLD,ROOM_OF_CHOICE,WHITE_GLOVE} returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A CA customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cara", address_line: "1 St", region_code: "CA", geo_lat: 34.0, geo_lng: -118.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Table", weight_lbs: 100, volume_cuft: 20, declared_value_cents: 10000, service_level: "PLATINUM" }
              as: DispatchPlanner
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == 'ERR_VALIDATION'"
            - "trigger response HTTP status == 422"

      - name: create_order_nonpositive_weight_invalid_request
        claim_type: Type Constraints
        grounds: [entities.DeliveryOrder.fields.weight_lbs, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "weight_lbs == 0 (not > 0) returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A CA customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cara", address_line: "1 St", region_code: "CA", geo_lat: 34.0, geo_lng: -118.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Table", weight_lbs: 0, volume_cuft: 20, declared_value_cents: 10000, service_level: "THRESHOLD" }
              as: DispatchPlanner
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == 'ERR_VALIDATION'"
            - "trigger response HTTP status == 422"

      - name: create_order_customer_not_found_returns_404
        claim_type: Parent Relationships
        grounds: [entities.DeliveryOrder.fields.customer_id, "errors[ERR_CUSTOMER_NOT_FOUND]"]
        distinguishing_aspect: "Creating an order with an unknown customer_id returns ERR_CUSTOMER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /delivery-orders"
              payload: { customer_id: "00000000-0000-4000-8000-000000000000", item_description: "Table", weight_lbs: 100, volume_cuft: 20, declared_value_cents: 10000, service_level: "THRESHOLD" }
              as: DispatchPlanner
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == 'ERR_CUSTOMER_NOT_FOUND'"
            - "trigger response HTTP status == 404"

      - name: list_orders_returns_pagination_envelope
        claim_type: Listing
        grounds: [entities.DeliveryOrder, endpoints]
        distinguishing_aspect: "GET /delivery-orders returns response_type array with meta pagination fields total_count and has_more."
        test_recipe:
          setup: ["One customer and one order exist."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cara", address_line: "1 St", region_code: "CA", geo_lat: 34.0, geo_lng: -118.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Table", weight_lbs: 100, volume_cuft: 20, declared_value_cents: 10000, service_level: "THRESHOLD" }
              as: DispatchPlanner
              captures: { order_id: $.data.id }
          trigger:
            - call: "GET /delivery-orders"
              payload: {}
              as: DispatchPlanner
          assert:
            - "trigger response response_type == 'array'"
            - "trigger response meta.total_count >= 1"
            - "trigger response meta.has_more == false"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: cancel_delivered_order_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.DeliveryOrder.CREATED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an order already DELIVERED returns ERR_INVALID_STATE (409); cancel only permits {CREATED,SCHEDULED,REFUSED_RETRY}."
        test_recipe:
          setup: ["A THRESHOLD order delivered (status DELIVERED) via a full route cycle."]
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot A", region_code: "CA" }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /docks"
              payload: { depot_id: "${depot_id}", dock_code: "D1" }
              as: PlatformAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /delivery-teams"
              payload: { depot_id: "${depot_id}", team_name: "T1", lead_name: "Lee", member2_name: "Max", region_code: "CA", max_daily_stops: 10, max_daily_weight_lbs: 500, max_daily_volume_cuft: 1000 }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cara", address_line: "1 St", region_code: "CA", geo_lat: 34.0, geo_lng: -118.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Table", weight_lbs: 100, volume_cuft: 20, declared_value_cents: 10000, service_level: "THRESHOLD" }
              as: DispatchPlanner
              captures: { order_id: $.data.id, o_v: $.data.version }
            - call: "POST /delivery-orders/${order_id}/windows"
              payload: { team_id: "${team_id}", service_date: "2026-06-01", window_start_min: 480, window_end_min: 600, expected_order_version: "${o_v}" }
              as: DispatchPlanner
              captures: { w1_id: $.data.id }
            - call: "POST /routes"
              payload: { depot_id: "${depot_id}", team_id: "${team_id}", service_date: "2026-06-01" }
              as: DispatchPlanner
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { order_id: "${order_id}", window_id: "${w1_id}" }
              as: DispatchPlanner
              captures: { s1_id: $.data.id }
            - call: "POST /routes/${route_id}/dock-appointments"
              payload: { dock_id: "${dock_id}", appt_date: "2026-06-01", appt_start_min: 360, appt_end_min: 420 }
              as: DockCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: DispatchPlanner
            - call: "POST /delivery-orders/${order_id}/attempts"
              payload: { outcome: "DELIVERED", placement: "THRESHOLD", signature_captured: true, photo_count: 1 }
              as: DeliveryLead
              as_user_id: "${team_id}"
          trigger:
            - call: "POST /delivery-orders/${order_id}/cancel"
              payload: {}
              as: DispatchPlanner
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == 'ERR_INVALID_STATE'"
            - "trigger response HTTP status == 409"

      - name: dispatch_already_dispatched_route_rejected
        claim_type: Idempotency
        grounds: [state_machines.Route.PLANNING_to_DISPATCHED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Dispatching a route that is already DISPATCHED returns ERR_INVALID_STATE (409) on the second call."
        test_recipe:
          setup: ["A route with one stop and a BOOKED dock appointment already DISPATCHED."]
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot A", region_code: "CA" }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /docks"
              payload: { depot_id: "${depot_id}", dock_code: "D1" }
              as: PlatformAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /delivery-teams"
              payload: { depot_id: "${depot_id}", team_name: "T1", lead_name: "Lee", member2_name: "Max", region_code: "CA", max_daily_stops: 10, max_daily_weight_lbs: 500, max_daily_volume_cuft: 1000 }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cara", address_line: "1 St", region_code: "CA", geo_lat: 34.0, geo_lng: -118.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Table", weight_lbs: 100, volume_cuft: 20, declared_value_cents: 10000, service_level: "THRESHOLD" }
              as: DispatchPlanner
              captures: { order_id: $.data.id, o_v: $.data.version }
            - call: "POST /delivery-orders/${order_id}/windows"
              payload: { team_id: "${team_id}", service_date: "2026-06-01", window_start_min: 480, window_end_min: 600, expected_order_version: "${o_v}" }
              as: DispatchPlanner
              captures: { w1_id: $.data.id }
            - call: "POST /routes"
              payload: { depot_id: "${depot_id}", team_id: "${team_id}", service_date: "2026-06-01" }
              as: DispatchPlanner
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { order_id: "${order_id}", window_id: "${w1_id}" }
              as: DispatchPlanner
              captures: { s1_id: $.data.id }
            - call: "POST /routes/${route_id}/dock-appointments"
              payload: { dock_id: "${dock_id}", appt_date: "2026-06-01", appt_start_min: 360, appt_end_min: 420 }
              as: DockCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: DispatchPlanner
          trigger:
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: DispatchPlanner
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == 'ERR_INVALID_STATE'"
            - "trigger response HTTP status == 409"

      - name: settle_non_delivered_order_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.DeliveryOrder.DELIVERED_to_SETTLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Settling a CREATED order (not DELIVERED) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A freshly CREATED order (never delivered)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cara", address_line: "1 St", region_code: "CA", geo_lat: 34.0, geo_lng: -118.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Table", weight_lbs: 100, volume_cuft: 20, declared_value_cents: 10000, service_level: "THRESHOLD" }
              as: DispatchPlanner
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /delivery-orders/${order_id}/settle"
              payload: {}
              as: DispatchPlanner
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == 'ERR_INVALID_STATE'"
            - "trigger response HTTP status == 409"

      - name: attempt_on_scheduled_order_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.DeliveryOrder.OUT_FOR_DELIVERY_to_DELIVERED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Recording an attempt on an order that is only SCHEDULED (not OUT_FOR_DELIVERY) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A SCHEDULED order (window reserved) not yet dispatched; acting DeliveryLead is the reserved team."]
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot A", region_code: "CA" }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /delivery-teams"
              payload: { depot_id: "${depot_id}", team_name: "T1", lead_name: "Lee", member2_name: "Max", region_code: "CA", max_daily_stops: 10, max_daily_weight_lbs: 500, max_daily_volume_cuft: 1000 }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cara", address_line: "1 St", region_code: "CA", geo_lat: 34.0, geo_lng: -118.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Table", weight_lbs: 100, volume_cuft: 20, declared_value_cents: 10000, service_level: "THRESHOLD" }
              as: DispatchPlanner
              captures: { order_id: $.data.id, o_v: $.data.version }
            - call: "POST /delivery-orders/${order_id}/windows"
              payload: { team_id: "${team_id}", service_date: "2026-06-01", window_start_min: 480, window_end_min: 600, expected_order_version: "${o_v}" }
              as: DispatchPlanner
              captures: { w1_id: $.data.id }
          trigger:
            - call: "POST /delivery-orders/${order_id}/attempts"
              payload: { outcome: "DELIVERED", placement: "THRESHOLD", signature_captured: true, photo_count: 1 }
              as: DeliveryLead
              as_user_id: "${team_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == 'ERR_INVALID_STATE'"
            - "trigger response HTTP status == 409"

      - name: close_route_with_planned_stop_not_ready
        claim_type: Precondition Enforcement
        grounds: [state_machines.Route.DISPATCHED_to_CLOSED, "errors[ERR_ROUTE_NOT_READY_TO_CLOSE]"]
        distinguishing_aspect: "Closing a DISPATCHED route whose stop is still PLANNED (no attempt yet) returns ERR_ROUTE_NOT_READY_TO_CLOSE (409)."
        test_recipe:
          setup: ["A route dispatched with one still-PLANNED stop (order OUT_FOR_DELIVERY, no attempt recorded)."]
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot A", region_code: "CA" }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /docks"
              payload: { depot_id: "${depot_id}", dock_code: "D1" }
              as: PlatformAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /delivery-teams"
              payload: { depot_id: "${depot_id}", team_name: "T1", lead_name: "Lee", member2_name: "Max", region_code: "CA", max_daily_stops: 10, max_daily_weight_lbs: 500, max_daily_volume_cuft: 1000 }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cara", address_line: "1 St", region_code: "CA", geo_lat: 34.0, geo_lng: -118.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Table", weight_lbs: 100, volume_cuft: 20, declared_value_cents: 10000, service_level: "THRESHOLD" }
              as: DispatchPlanner
              captures: { order_id: $.data.id, o_v: $.data.version }
            - call: "POST /delivery-orders/${order_id}/windows"
              payload: { team_id: "${team_id}", service_date: "2026-06-01", window_start_min: 480, window_end_min: 600, expected_order_version: "${o_v}" }
              as: DispatchPlanner
              captures: { w1_id: $.data.id }
            - call: "POST /routes"
              payload: { depot_id: "${depot_id}", team_id: "${team_id}", service_date: "2026-06-01" }
              as: DispatchPlanner
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { order_id: "${order_id}", window_id: "${w1_id}" }
              as: DispatchPlanner
              captures: { s1_id: $.data.id }
            - call: "POST /routes/${route_id}/dock-appointments"
              payload: { dock_id: "${dock_id}", appt_date: "2026-06-01", appt_start_min: 360, appt_end_min: 420 }
              as: DockCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: DispatchPlanner
          trigger:
            - call: "POST /routes/${route_id}/close"
              payload: {}
              as: DispatchPlanner
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == 'ERR_ROUTE_NOT_READY_TO_CLOSE'"
            - "trigger response HTTP status == 409"

      - name: confirm_released_window_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.DeliveryWindow.RESERVED_to_RELEASED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Confirming a window already RELEASED (superseded by a later reservation) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Order has window1 superseded (RELEASED) by a later window2; customer owns the order."]
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot A", region_code: "CA" }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /delivery-teams"
              payload: { depot_id: "${depot_id}", team_name: "T1", lead_name: "Lee", member2_name: "Max", region_code: "CA", max_daily_stops: 10, max_daily_weight_lbs: 500, max_daily_volume_cuft: 1000 }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cara", address_line: "1 St", region_code: "CA", geo_lat: 34.0, geo_lng: -118.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Table", weight_lbs: 100, volume_cuft: 20, declared_value_cents: 10000, service_level: "THRESHOLD" }
              as: DispatchPlanner
              captures: { order_id: $.data.id, o_v: $.data.version }
            - call: "POST /delivery-orders/${order_id}/windows"
