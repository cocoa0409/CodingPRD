# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# vacation-travel-insurance (Expert)
# Breadth walk of references/claim-extraction-guide.md against §1.1–§1.7.
# §1.8 instances cover the depth probes; stubs mark corners already exercised.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_plan_returns_201_with_all_fields
        claim_type: Creation
        grounds:
          - "entities.Plan"
          - "endpoints"
        distinguishing_aspect: "POST /plans with all required config fields -> 201; response echoes code, tier, base_rate_bps and a system id/version=1, status=ACTIVE."
        test_recipe:
          setup: ["Empty DB; CarrierAdmin creates a plan."]
          setup_api_calls: []
          trigger:
            - call: "POST /plans"
              payload: { code: "P-CR1", tier: "STANDARD", base_rate_bps: 600, cancellation_limit_pct: 100, medical_limit_cents: 500000, delay_block_cap_cents: 20000, delay_limit_cents: 100000, baggage_item_sublimit_cents: 30000, baggage_limit_cents: 100000, baggage_depreciation_bps: 2000, waiver_window_days: 14, free_look_days: 10, claim_filing_window_days: 90, cfar_loading_bps: 4000, cfar_reimbursement_pct: 75, senior_loading_bps: 5000 }
              as: CarrierAdmin
              captures: { plan_id: $.data.id, ver: $.data.version, st: $.data.status }
          assert:
            - "Response status == 201"
            - "data.code == P-CR1 AND data.tier == STANDARD AND data.status == ACTIVE AND data.version == 1"

      - name: get_policy_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "entities.Policy"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /policies/{random-uuid} for a non-existent id -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /policies/00000000-0000-4000-8000-000000000000"
              as: CarrierAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_plan_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.Plan.fields.base_rate_bps"
          - "errors[ERR_INVALID_REQUEST]"
          - "validations[priority=5]"
        distinguishing_aspect: "POST /plans omitting base_rate_bps (source:input, no default) -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /plans"
              payload: { code: "P-MISS", tier: "STANDARD", cancellation_limit_pct: 100, medical_limit_cents: 500000, delay_block_cap_cents: 20000, delay_limit_cents: 100000, baggage_item_sublimit_cents: 30000, baggage_limit_cents: 100000, baggage_depreciation_bps: 2000, waiver_window_days: 14, free_look_days: 10, claim_filing_window_days: 90, cfar_loading_bps: 4000, cfar_reimbursement_pct: 75, senior_loading_bps: 5000 }
              as: CarrierAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_plan_invalid_tier_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - "entities.Plan.fields.tier"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /plans with tier='GOLD' (not in BASIC|STANDARD|PREMIER) -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /plans"
              payload: { code: "P-ENUM", tier: "GOLD", base_rate_bps: 600, cancellation_limit_pct: 100, medical_limit_cents: 500000, delay_block_cap_cents: 20000, delay_limit_cents: 100000, baggage_item_sublimit_cents: 30000, baggage_limit_cents: 100000, baggage_depreciation_bps: 2000, waiver_window_days: 14, free_look_days: 10, claim_filing_window_days: 90, cfar_loading_bps: 4000, cfar_reimbursement_pct: 75, senior_loading_bps: 5000 }
              as: CarrierAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: duplicate_plan_code_returns_conflict
        claim_type: Type Constraints
        grounds:
          - "entities.Plan.fields.code"
          - "errors[ERR_DUPLICATE_CODE]"
        distinguishing_aspect: "Creating a second plan with an existing code -> ERR_DUPLICATE_CODE (409)."
        test_recipe:
          setup: ["A plan with code 'DUP-1' already exists."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { code: "DUP-1", tier: "BASIC", base_rate_bps: 400, cancellation_limit_pct: 100, medical_limit_cents: 500000, delay_block_cap_cents: 20000, delay_limit_cents: 100000, baggage_item_sublimit_cents: 30000, baggage_limit_cents: 100000, baggage_depreciation_bps: 2000, waiver_window_days: 14, free_look_days: 10, claim_filing_window_days: 90, cfar_loading_bps: 4000, cfar_reimbursement_pct: 75, senior_loading_bps: 5000 }
              as: CarrierAdmin
          trigger:
            - call: "POST /plans"
              payload: { code: "DUP-1", tier: "STANDARD", base_rate_bps: 600, cancellation_limit_pct: 100, medical_limit_cents: 500000, delay_block_cap_cents: 20000, delay_limit_cents: 100000, baggage_item_sublimit_cents: 30000, baggage_limit_cents: 100000, baggage_depreciation_bps: 2000, waiver_window_days: 14, free_look_days: 10, claim_filing_window_days: 90, cfar_loading_bps: 4000, cfar_reimbursement_pct: 75, senior_loading_bps: 5000 }
              as: CarrierAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_DUPLICATE_CODE"

      - name: duplicate_traveler_email_returns_conflict
        claim_type: Type Constraints
        grounds:
          - "entities.Traveler.fields.email"
          - "errors[ERR_DUPLICATE_EMAIL]"
        distinguishing_aspect: "Registering a second traveler with an in-use email -> ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup: ["A traveler with email 'dup@x.com' exists."]
          setup_api_calls:
            - call: "POST /travelers"
              payload: { email: "dup@x.com", full_name: "A", date_of_birth: "1990-01-01" }
              as: CarrierAdmin
          trigger:
            - call: "POST /travelers"
              payload: { email: "dup@x.com", full_name: "B", date_of_birth: "1991-01-01" }
              as: CarrierAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_DUPLICATE_EMAIL"

      - name: system_fields_generated_input_ignored_on_policy_create
        claim_type: System Fields
        grounds:
          - "entities.Policy.fields.coverage_status"
          - "entities.Policy.fields.version"
        distinguishing_aspect: "POST /policies -> server mints id, version=1, coverage_status=QUOTED, payment_status=PENDING regardless of body; computed premium fields present."
        test_recipe:
          setup: ["A plan and traveler exist."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { code: "SYS-1", tier: "BASIC", base_rate_bps: 400, cancellation_limit_pct: 100, medical_limit_cents: 500000, delay_block_cap_cents: 20000, delay_limit_cents: 100000, baggage_item_sublimit_cents: 30000, baggage_limit_cents: 100000, baggage_depreciation_bps: 2000, waiver_window_days: 14, free_look_days: 10, claim_filing_window_days: 90, cfar_loading_bps: 4000, cfar_reimbursement_pct: 75, senior_loading_bps: 5000 }
              as: CarrierAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "sys@x.com", full_name: "S", date_of_birth: "1990-01-01" }
              as: CarrierAdmin
              captures: { trav_id: $.data.id }
          trigger:
            - call: "POST /policies"
              payload: { plan_id: "${plan_id}", owner_traveler_id: "${trav_id}", trip_cost_cents: 500000, initial_deposit_at: "2026-05-25T00:00:00Z", trip_start_at: "2026-07-01T00:00:00Z", trip_end_at: "2026-07-15T00:00:00Z" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { pol_id: $.data.id, ver: $.data.version, cov: $.data.coverage_status, pay: $.data.payment_status, base: $.data.base_premium_cents }
          assert:
            - "Response status == 201"
            - "data.version == 1 AND data.coverage_status == QUOTED AND data.payment_status == PENDING"
            - "data.base_premium_cents == 20000"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: start_review_on_already_under_review_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Claim.SUBMITTED_to_UNDER_REVIEW"
          - "errors[ERR_INVALID_STATE]"
          - "validations[priority=6]"
        distinguishing_aspect: "Calling start-review twice: the second call (status already UNDER_REVIEW) -> ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["ACTIVE policy; a MEDICAL claim already moved to UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /plans"
              payload: { code: "SM-1", tier: "BASIC", base_rate_bps: 400, cancellation_limit_pct: 100, medical_limit_cents: 500000, delay_block_cap_cents: 20000, delay_limit_cents: 100000, baggage_item_sublimit_cents: 30000, baggage_limit_cents: 100000, baggage_depreciation_bps: 2000, waiver_window_days: 14, free_look_days: 10, claim_filing_window_days: 90, cfar_loading_bps: 4000, cfar_reimbursement_pct: 75, senior_loading_bps: 5000 }
              as: CarrierAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "sm1@x.com", full_name: "S1", date_of_birth: "1990-01-01" }
              as: CarrierAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /policies"
              payload: { plan_id: "${plan_id}", owner_traveler_id: "${trav_id}", trip_cost_cents: 500000, initial_deposit_at: "2026-05-25T00:00:00Z", trip_start_at: "2026-07-01T00:00:00Z", trip_end_at: "2026-07-15T00:00:00Z" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/insured-travelers"
              payload: { traveler_id: "${trav_id}", age_at_departure: 36, covered_trip_cost_cents: 500000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { ins_id: $.data.id, pol_v: $.data.version }
            - call: "GET /policies/${pol_id}"
              as: Any
              captures: { pol_id_polver: $.data.version }
            - call: "POST /policies/${pol_id}/record-payment"
              payload: { expected_policy_version: "${pol_id_polver}" }
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /policies/${pol_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", insured_traveler_id: "${ins_id}", peril: "MEDICAL", incident_at: "2026-06-02T00:00:00Z" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /claims/${claim_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: deny_terminal_claim_lockdown_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Claim.UNDER_REVIEW_to_DENIED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A DENIED claim is terminal: a second deny -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["ACTIVE policy; MEDICAL claim under review then denied."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /plans"
              payload: { code: "SM-2", tier: "BASIC", base_rate_bps: 400, cancellation_limit_pct: 100, medical_limit_cents: 500000, delay_block_cap_cents: 20000, delay_limit_cents: 100000, baggage_item_sublimit_cents: 30000, baggage_limit_cents: 100000, baggage_depreciation_bps: 2000, waiver_window_days: 14, free_look_days: 10, claim_filing_window_days: 90, cfar_loading_bps: 4000, cfar_reimbursement_pct: 75, senior_loading_bps: 5000 }
              as: CarrierAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "sm2@x.com", full_name: "S2", date_of_birth: "1990-01-01" }
              as: CarrierAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /policies"
              payload: { plan_id: "${plan_id}", owner_traveler_id: "${trav_id}", trip_cost_cents: 500000, initial_deposit_at: "2026-05-25T00:00:00Z", trip_start_at: "2026-07-01T00:00:00Z", trip_end_at: "2026-07-15T00:00:00Z" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/insured-travelers"
              payload: { traveler_id: "${trav_id}", age_at_departure: 36, covered_trip_cost_cents: 500000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { ins_id: $.data.id, pol_v: $.data.version }
            - call: "GET /policies/${pol_id}"
              as: Any
              captures: { pol_id_polver: $.data.version }
            - call: "POST /policies/${pol_id}/record-payment"
              payload: { expected_policy_version: "${pol_id_polver}" }
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /policies/${pol_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", insured_traveler_id: "${ins_id}", peril: "MEDICAL", incident_at: "2026-06-02T00:00:00Z" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_id}/deny"
              payload: { denial_reason: "INSUFFICIENT_PROOF" }
              as: ClaimsAdjuster
          trigger:
            - call: "POST /claims/${claim_id}/deny"
              payload: { denial_reason: "AGAIN" }
              as: ClaimsAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: issue_without_paid_premium_returns_premium_not_paid
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Policy.coverage:QUOTED_to_coverage:ACTIVE"
          - "errors[ERR_PREMIUM_NOT_PAID]"
        distinguishing_aspect: "Issuing a QUOTED policy whose payment_status is still PENDING -> ERR_PREMIUM_NOT_PAID (409)."
        test_recipe:
          setup: ["QUOTED policy with one COVERED insured covering full cost; premium NOT recorded."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { code: "SM-3", tier: "BASIC", base_rate_bps: 400, cancellation_limit_pct: 100, medical_limit_cents: 500000, delay_block_cap_cents: 20000, delay_limit_cents: 100000, baggage_item_sublimit_cents: 30000, baggage_limit_cents: 100000, baggage_depreciation_bps: 2000, waiver_window_days: 14, free_look_days: 10, claim_filing_window_days: 90, cfar_loading_bps: 4000, cfar_reimbursement_pct: 75, senior_loading_bps: 5000 }
              as: CarrierAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "sm3@x.com", full_name: "S3", date_of_birth: "1990-01-01" }
              as: CarrierAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /policies"
              payload: { plan_id: "${plan_id}", owner_traveler_id: "${trav_id}", trip_cost_cents: 500000, initial_deposit_at: "2026-05-25T00:00:00Z", trip_start_at: "2026-07-01T00:00:00Z", trip_end_at: "2026-07-15T00:00:00Z" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/insured-travelers"
              payload: { traveler_id: "${trav_id}", age_at_departure: 36, covered_trip_cost_cents: 500000 }
              as: Traveler
              as_user_id: "${trav_id}"
          trigger:
            - call: "POST /policies/${pol_id}/issue"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_PREMIUM_NOT_PAID"

      - name: issue_with_trip_cost_mismatch_returns_mismatch
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Policy.coverage:QUOTED_to_coverage:ACTIVE"
          - "errors[ERR_TRIP_COST_MISMATCH]"
          - "entities.InsuredTraveler.fields.covered_trip_cost_cents"
        distinguishing_aspect: "Sum of COVERED insured covered_trip_cost_cents (400000) != trip_cost_cents (500000) at issue -> ERR_TRIP_COST_MISMATCH (409)."
        test_recipe:
          setup: ["Paid QUOTED policy trip_cost 500000 but a single insured covering only 400000."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { code: "SM-4", tier: "BASIC", base_rate_bps: 400, cancellation_limit_pct: 100, medical_limit_cents: 500000, delay_block_cap_cents: 20000, delay_limit_cents: 100000, baggage_item_sublimit_cents: 30000, baggage_limit_cents: 100000, baggage_depreciation_bps: 2000, waiver_window_days: 14, free_look_days: 10, claim_filing_window_days: 90, cfar_loading_bps: 4000, cfar_reimbursement_pct: 75, senior_loading_bps: 5000 }
              as: CarrierAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "sm4@x.com", full_name: "S4", date_of_birth: "1990-01-01" }
              as: CarrierAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /policies"
              payload: { plan_id: "${plan_id}", owner_traveler_id: "${trav_id}", trip_cost_cents: 500000, initial_deposit_at: "2026-05-25T00:00:00Z", trip_start_at: "2026-07-01T00:00:00Z", trip_end_at: "2026-07-15T00:00:00Z" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/insured-travelers"
              payload: { traveler_id: "${trav_id}", age_at_departure: 36, covered_trip_cost_cents: 400000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { pol_v: $.data.version }
            - call: "GET /policies/${pol_id}"
              as: Any
              captures: { pol_id_polver: $.data.version }
            - call: "POST /policies/${pol_id}/record-payment"
              payload: { expected_policy_version: "${pol_id_polver}" }
              as: Traveler
              as_user_id: "${trav_id}"
          trigger:
            - call: "POST /policies/${pol_id}/issue"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_TRIP_COST_MISMATCH"

      - name: free_look_cancel_blocked_when_policy_has_claims
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Policy.coverage:ACTIVE_to_coverage:CANCELLED"
          - "errors[ERR_POLICY_HAS_CLAIMS]"
        distinguishing_aspect: "Free-look-cancel on an ACTIVE policy that has a SUBMITTED claim -> ERR_POLICY_HAS_CLAIMS (409); coverage stays ACTIVE."
        test_recipe:
          setup: ["ACTIVE policy inside free-look window with one SUBMITTED claim."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /plans"
              payload: { code: "SM-5", tier: "BASIC", base_rate_bps: 400, cancellation_limit_pct: 100, medical_limit_cents: 500000, delay_block_cap_cents: 20000, delay_limit_cents: 100000, baggage_item_sublimit_cents: 30000, baggage_limit_cents: 100000, baggage_depreciation_bps: 2000, waiver_window_days: 14, free_look_days: 10, claim_filing_window_days: 90, cfar_loading_bps: 4000, cfar_reimbursement_pct: 75, senior_loading_bps: 5000 }
              as: CarrierAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /travelers"
