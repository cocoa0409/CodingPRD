      - name: regression_pct_rounds_half_up_to_one_decimal
        claim_type: precision
        grounds:
          - calculations.regression_recoupment_analysis
          - entities.EligibilityDetermination.fields.max_regression_pct
          - endpoints.POST_/esy/eligibility-determinations/{determination_id}/analyze
        distinguishing_aspect: "A probe whose exact regression is 31.25 percent must store 31.3 (round_half_up at 1 decimal), not 31.2 - and 28.8889 must store 28.9, so max_regression_pct == 31.3."
        test_recipe:
          setup:
            - "Clock 2027-06-01T00:00:00Z; Student S1; one DRAFT PROBE_BASED determination with two probes: 80 -> 55 (exactly 31.25 percent) and 90 -> 64 (28.888... percent), both with recoupment_days_observed 21 and trials_count 4."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: CaseManager
            - call: "POST /esy/students"
              payload: { student_number: "S-2841-001", first_name: "Ada", last_name: "Reyes", grade_band: "MS_6_8", primary_disability: "AUTISM", iep_weekly_minutes_total: 250, home_school_code: "MS-014", transportation_required: true }
              as: CaseManager
              captures: { s1_id: $.data.id }
            - call: "POST /esy/eligibility-determinations"
              payload: { student_id: "${s1_id}", school_year: "2026-2027", analysis_variant: "PROBE_BASED", skill_probes: [{ skill_domain: "READING_FLUENCY", pre_break_mastery_pct: 80, post_break_mastery_pct: 55, recoupment_days_observed: 21, trials_count: 4 }, { skill_domain: "MATH_COMPUTATION", pre_break_mastery_pct: 90, post_break_mastery_pct: 64, recoupment_days_observed: 21, trials_count: 4 }] }
              as: CaseManager
              captures: { d2_id: $.data.id }
          trigger:
            - call: "POST /esy/eligibility-determinations/${d2_id}/analyze"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
          assert:
            - "HTTP 200"
            - "EligibilityDetermination.${d2_id}.max_regression_pct == 31.3"
            - "EligibilityDetermination.${d2_id}.max_recoupment_days == 21"
            - "EligibilityDetermination.${d2_id}.criteria_met_count == 2"
            - "EligibilityDetermination.${d2_id}.data_sufficiency == SUFFICIENT"
            - "EligibilityDetermination.${d2_id}.eligibility_recommendation == ELIGIBLE"
            - "EligibilityDetermination.${d2_id}.status == PARENT_REVIEW"
            - "Student.${s1_id}.esy_eligibility_status == NOT_DETERMINED (only finalize writes it)"

      - name: minute_plan_correct_result_from_pinned_inputs
        claim_type: correct_result
        grounds:
          - calculations.esy_service_minutes_plan
          - entities.ServiceCommitment.fields.planned_total_minutes
        excluded_because:
          difficulty_instance: combinatorial_formula / minute_plan_round_per_week_then_sum_beats_sum_then_round
          rationale: "That instance computes the whole plan from pinned inputs (250 weekly minutes over a 22-day, 6-week calendar) and asserts planned_total_minutes == 1376, weekly_minutes_committed == 229 and daily_minutes == 57."

      - name: recoupment_threshold_constant_is_applied_at_its_declared_value
        claim_type: constants_applied
        grounds:
          - calculations.regression_recoupment_analysis
          - calculations.regression_recoupment_analysis.constants.RECOUPMENT_DAYS_THRESHOLD
        excluded_because:
          difficulty_instance: boundary_precision_check / recoupment_days_threshold_boundary_across_objection_rounds
          rationale: "That instance walks recoupment_days_observed 19, 20 and 21 against RECOUPMENT_DAYS_THRESHOLD == 20 and asserts criteria_met_count and the recommendation flip at each value."

      - name: award_minutes_threshold_at_the_minimum_awardable_boundary
        claim_type: threshold
        grounds:
          - calculations.compensatory_award_minutes
          - calculations.compensatory_award_minutes.constants.MIN_AWARDABLE_MINUTES
        excluded_because:
          difficulty_instance: boundary_precision_check / min_awardable_minutes_boundary_on_award_creation
          rationale: "That instance sits on MIN_AWARDABLE_MINUTES == 30 from both sides (29 minutes rejected with ERR_NO_COMPENSABLE_MINUTES, 30 minutes accepted)."

      - name: fund_waterfall_fills_the_highest_priority_bucket_first
        claim_type: waterfall_allocation
        grounds:
          - calculations.fund_charge_waterfall
          - calculations.fund_charge_waterfall.constants.FUND_PRIORITY
        excluded_because:
          difficulty_instance: combinatorial_formula / fund_waterfall_selection_pinned_on_base_cost_then_indirect_overage
          rationale: "That instance asserts FUND_PRIORITY ordering, base-cost-only selection and the ERR_FUND_INDIRECT_OVERAGE remainder behaviour of the five-step waterfall."

      - name: award_and_eligibility_variants_diverge_on_identical_data
        claim_type: variant_divergence
        grounds:
          - calculations.compensatory_award_minutes
          - calculations.regression_recoupment_analysis
        excluded_because:
          difficulty_instance: dual_variant_calc / award_variant_divergence_minute_for_minute_vs_qualitative_benefit
          rationale: "That instance holds the log set fixed and asserts MINUTE_FOR_MINUTE == 85 versus QUALITATIVE_BENEFIT == 105 minutes; its sibling instance does the same for PROBE_BASED versus TEAM_JUDGMENT eligibility."

      - name: provider_weekly_interval_merge_semantics
        claim_type: interval_merge
        grounds:
          - calculations.provider_load_and_conflict
          - calculations.transport_run_occupancy
        excluded_because:
          difficulty_instance: resource_temporal_overlap / provider_weekly_slots_use_half_open_intervals_and_date_intersection
          rationale: "That instance asserts adjacent (gap == 0) slots coexist under half-open semantics while overlapping ones collide; its sibling asserts the closed-interval plus turnaround-gap variant for transportation runs."

      - name: commitment_ledger_aggregation_survives_add_and_reversal
        claim_type: aggregation
        grounds:
          - calculations.commitment_minutes_ledger
          - calculations.student_minutes_ledger
        excluded_because:
          difficulty_instance: transitive_cascade / cancel_day_cascades_log_to_commitment_to_student_alert_threshold
          rationale: "That instance asserts the running totals after each synthesized log (57 then 114 owed minutes) and the alert flip, which is the add side; the void compensation instance covers the reversal side."

  - section: validations
    instances:
      - name: duplicate_service_log_for_same_commitment_and_date_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_28_ERR_DUPLICATE_SERVICE_LOG
          - errors[ERR_DUPLICATE_SERVICE_LOG]
          - state_machines.ServiceLog.VERIFIED_to_VOIDED
          - endpoints.POST_/esy/service-logs
        distinguishing_aspect: "A second log for the same (commitment_id, service_date) returns ERR_DUPLICATE_SERVICE_LOG 409 while the first is VERIFIED, and the identical call succeeds once the first row is VOIDED - the uniqueness scope is VERIFIED rows only."
