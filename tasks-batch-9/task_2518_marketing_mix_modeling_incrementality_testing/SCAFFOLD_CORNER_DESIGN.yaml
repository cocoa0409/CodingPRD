      - name: contribution_confidence_interval_half_width_and_bounds
        claim_type: weighted_scoring
        grounds:
          - "calculations.contribution_confidence_interval formula - ci_half_width_pct = round(CI_BASE_PCT / sqrt(observation_period_count), 2); the two bounds at 4 dp"
          - "calculations.contribution_confidence_interval input_set - the run's own observation_period_count, identical for every channel of a run"
          - "global_constants.CI_BASE_PCT 40.0"
          - "entities.ChannelContribution.ci_half_width_pct, ci_low_units, ci_high_units"
        distinguishing_aspect: |
          The half width depends only on the run-level period count, so BOTH channels share the identical
          20.00 while their absolute bounds differ in proportion to their own contribution: A_SEARCH
          [2922.6666, 4384.0000] and B_SOCIAL [1611.4286, 2417.1428]; a per-channel half width or a
          sqrt taken over the holdout-excluded period count would break the shared value.
          
        test_recipe:
          setup:
            - "Fixture F1 fitted with EFFECT_PERIOD. observation_period_count is 4, so ci_half_width_pct = round(40.0 / 2, 2) = 20.00 for the whole run."
            - "contribution_units are A_SEARCH 3653.3333 and B_SOCIAL 2014.2857; 3653.3333 * 0.8 = 2922.66664 and 3653.3333 * 1.2 = 4383.99996, 2014.2857 * 0.8 = 1611.428560 and 2014.2857 * 1.2 = 2417.142840."
