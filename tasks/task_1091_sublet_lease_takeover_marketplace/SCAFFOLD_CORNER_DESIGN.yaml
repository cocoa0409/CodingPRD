# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe over §1.1-§1.7).
# Same 7-point contract as §1.8. excluded_because stubs cite §1.8 instance names.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_landlord_returns_201_with_envelope
        claim_type: Creation
        grounds: [entities.Landlord, endpoints]
        distinguishing_aspect: "POST /landlords with name+email returns 201, response_type object, server-minted id/created_at/updated_at/version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /landlords", payload: { name: "Ada", email: "ada@x.com" }, as: PlatformAdmin, captures: { ll_id: $.data.id, v: $.data.version } }
          assert:
            - "response.status == 201"
            - "Landlord.${ll_id}.version == 1"
            - "response.response_type == object"

      - name: get_lease_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Lease, "errors[ERR_LEASE_NOT_FOUND]"]
        distinguishing_aspect: "GET /leases/{unknown-uuid} returns ERR_LEASE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /leases/00000000-0000-0000-0000-000000000000", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_LEASE_NOT_FOUND"

      - name: create_applicant_missing_income_returns_validation
        claim_type: Required Fields
        grounds: [entities.Applicant.fields.annual_income_cents, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /applicants omitting the required annual_income_cents returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /applicants", payload: { name: "No Income", email: "ni@x.com", credit_score: 700 }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: list_leases_pagination_shape
        claim_type: Listing
        grounds: [entities.Lease, endpoints]
        distinguishing_aspect: "GET /leases returns response_type array plus total_count and has_more pagination fields; limit/offset honored."
        test_recipe:
          setup: ["One landlord, one leaseholder, one lease."]
          setup_api_calls:
            - { call: "POST /landlords", payload: { name: "LL", email: "ll@x.com" }, as: PlatformAdmin, captures: { ll_id: $.data.id } }
            - { call: "POST /leaseholders", payload: { name: "LH", email: "lh@x.com" }, as: PlatformAdmin, captures: { lh_id: $.data.id } }
            - { call: "POST /leases", payload: { landlord_id: "${ll_id}", leaseholder_id: "${lh_id}", monthly_rent_cents: 300000, security_deposit_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31", allows_sublet: true }, as: Landlord, as_user_id: "${ll_id}" }
          trigger:
            - { call: "GET /leases", payload: { landlord_id: "${ll_id}", limit: 10, offset: 0 }, as: PlatformAdmin }
          assert:
            - "response.status == 200"
            - "response.response_type == array"
            - "response has total_count == 1 and has_more == false"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: verify_lease_not_pending_review_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Lease.PENDING_REVIEW_to_VERIFIED, "errors[ERR_LEASE_NOT_PENDING_REVIEW]"]
        distinguishing_aspect: "verify on a lease still UNVERIFIED (never submitted) fails with ERR_LEASE_NOT_PENDING_REVIEW; no state change."
        test_recipe:
          setup: ["Landlord, leaseholder, lease in UNVERIFIED."]
          setup_api_calls:
            - { call: "POST /landlords", payload: { name: "LL", email: "ll@x.com" }, as: PlatformAdmin, captures: { ll_id: $.data.id } }
            - { call: "POST /leaseholders", payload: { name: "LH", email: "lh@x.com" }, as: PlatformAdmin, captures: { lh_id: $.data.id } }
            - { call: "POST /leases", payload: { landlord_id: "${ll_id}", leaseholder_id: "${lh_id}", monthly_rent_cents: 300000, security_deposit_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31", allows_sublet: true }, as: Landlord, as_user_id: "${ll_id}", captures: { lease_id: $.data.id } }
          trigger:
            - { call: "POST /leases/${lease_id}/verify", payload: { decision: "VERIFIED" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_LEASE_NOT_PENDING_REVIEW"

      - name: submit_verification_twice_idempotency_rejected
        claim_type: Idempotency
        grounds: [state_machines.Lease.UNVERIFIED_to_PENDING_REVIEW, "errors[ERR_LEASE_NOT_VERIFIABLE]"]
        distinguishing_aspect: "Second submit-verification on the same lease (now PENDING_REVIEW) fails with ERR_LEASE_NOT_VERIFIABLE."
        test_recipe:
          setup: ["Lease submitted once (PENDING_REVIEW)."]
          setup_api_calls:
            - { call: "POST /landlords", payload: { name: "LL", email: "ll@x.com" }, as: PlatformAdmin, captures: { ll_id: $.data.id } }
            - { call: "POST /leaseholders", payload: { name: "LH", email: "lh@x.com" }, as: PlatformAdmin, captures: { lh_id: $.data.id } }
            - { call: "POST /leases", payload: { landlord_id: "${ll_id}", leaseholder_id: "${lh_id}", monthly_rent_cents: 300000, security_deposit_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31", allows_sublet: true }, as: Landlord, as_user_id: "${ll_id}", captures: { lease_id: $.data.id } }
            - { call: "POST /leases/${lease_id}/submit-verification", payload: {}, as: Landlord, as_user_id: "${ll_id}" }
          trigger:
            - { call: "POST /leases/${lease_id}/submit-verification", payload: {}, as: Landlord, as_user_id: "${ll_id}", captures: { err: $.data.error_id } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_LEASE_NOT_VERIFIABLE"

      - name: lease_verify_rejected_path
        claim_type: Valid Transition
        grounds: [state_machines.Lease.PENDING_REVIEW_to_REJECTED, entities.Lease.fields.status]
        distinguishing_aspect: "verify with decision REJECTED moves a PENDING_REVIEW lease to terminal REJECTED."
        test_recipe:
          setup: ["Lease in PENDING_REVIEW."]
          setup_api_calls:
            - { call: "POST /landlords", payload: { name: "LL", email: "ll@x.com" }, as: PlatformAdmin, captures: { ll_id: $.data.id } }
            - { call: "POST /leaseholders", payload: { name: "LH", email: "lh@x.com" }, as: PlatformAdmin, captures: { lh_id: $.data.id } }
            - { call: "POST /leases", payload: { landlord_id: "${ll_id}", leaseholder_id: "${lh_id}", monthly_rent_cents: 300000, security_deposit_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31", allows_sublet: true }, as: Landlord, as_user_id: "${ll_id}", captures: { lease_id: $.data.id } }
            - { call: "POST /leases/${lease_id}/submit-verification", payload: {}, as: Landlord, as_user_id: "${ll_id}" }
          trigger:
            - { call: "POST /leases/${lease_id}/verify", payload: { decision: "REJECTED" }, as: ComplianceOfficer, captures: { st: $.data.status } }
          assert:
            - "response.status == 200"
            - "Lease.${lease_id}.status == REJECTED"

      - name: approve_listing_not_pending_approval_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Listing.PENDING_APPROVAL_to_OPEN, "errors[ERR_LISTING_NOT_PENDING_APPROVAL]"]
        distinguishing_aspect: "approve on a DRAFT listing (never requested approval) fails with ERR_LISTING_NOT_PENDING_APPROVAL."
        test_recipe:
          setup: ["Verified lease, DRAFT SUBLET listing."]
          setup_api_calls:
            - { call: "POST /landlords", payload: { name: "LL", email: "ll@x.com" }, as: PlatformAdmin, captures: { ll_id: $.data.id } }
            - { call: "POST /leaseholders", payload: { name: "LH", email: "lh@x.com" }, as: PlatformAdmin, captures: { lh_id: $.data.id } }
            - { call: "POST /leases", payload: { landlord_id: "${ll_id}", leaseholder_id: "${lh_id}", monthly_rent_cents: 300000, security_deposit_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31", allows_sublet: true }, as: Landlord, as_user_id: "${ll_id}", captures: { lease_id: $.data.id } }
            - { call: "POST /leases/${lease_id}/submit-verification", payload: {}, as: Landlord, as_user_id: "${ll_id}" }
            - { call: "POST /leases/${lease_id}/verify", payload: { decision: "VERIFIED" }, as: ComplianceOfficer }
            - { call: "POST /listings", payload: { lease_id: "${lease_id}", listing_type: "SUBLET", asking_rent_cents: 300000, available_from: "2026-06-01", available_to: "2026-12-31", min_term_months: 2, screening_policy: "STANDARD" }, as: Leaseholder, as_user_id: "${lh_id}", captures: { listing_id: $.data.id } }
          trigger:
            - { call: "POST /listings/${listing_id}/approve", payload: {}, as: Landlord, as_user_id: "${ll_id}", captures: { err: $.data.error_id } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_LISTING_NOT_PENDING_APPROVAL"

      - name: fee_lifecycle_charge_then_refund
        claim_type: Valid Transition
        grounds: [state_machines.Fee.PENDING_to_CHARGED, state_machines.Fee.CHARGED_to_REFUNDED]
        distinguishing_aspect: "Fee PENDING -> CHARGED -> REFUNDED; refunding a PENDING fee (not charged) fails with ERR_FEE_NOT_CHARGED."
        test_recipe:
          setup: ["ACTIVE-agreement chain omitted; fee attaches to any existing agreement id. Build minimal agreement in DRAFT and a PENDING fee on it, then charge it."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /landlords", payload: { name: "LL", email: "ll@x.com" }, as: PlatformAdmin, captures: { ll_id: $.data.id } }
            - { call: "POST /leaseholders", payload: { name: "LH", email: "lh@x.com" }, as: PlatformAdmin, captures: { lh_id: $.data.id } }
            - { call: "POST /applicants", payload: { name: "AP", email: "ap@x.com", annual_income_cents: 15000000, monthly_debt_cents: 0, credit_score: 720 }, as: PlatformAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /leases", payload: { landlord_id: "${ll_id}", leaseholder_id: "${lh_id}", monthly_rent_cents: 300000, security_deposit_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31", allows_sublet: true }, as: Landlord, as_user_id: "${ll_id}", captures: { lease_id: $.data.id } }
            - { call: "POST /leases/${lease_id}/submit-verification", payload: {}, as: Landlord, as_user_id: "${ll_id}" }
            - { call: "POST /leases/${lease_id}/verify", payload: { decision: "VERIFIED" }, as: ComplianceOfficer }
            - { call: "POST /listings", payload: { lease_id: "${lease_id}", listing_type: "SUBLET", asking_rent_cents: 300000, available_from: "2026-06-01", available_to: "2026-12-31", min_term_months: 2, screening_policy: "STANDARD" }, as: Leaseholder, as_user_id: "${lh_id}", captures: { listing_id: $.data.id } }
            - { call: "POST /listings/${listing_id}/request-approval", payload: {}, as: Leaseholder, as_user_id: "${lh_id}" }
            - { call: "POST /listings/${listing_id}/approve", payload: {}, as: Landlord, as_user_id: "${ll_id}", captures: { listing_v: $.data.version } }
            - { call: "POST /applications", payload: { listing_id: "${listing_id}", applicant_id: "${ap_id}", proposed_move_in_date: "2026-06-10", proposed_move_out_date: "2026-08-31" }, as: Applicant, as_user_id: "${ap_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/start-screening", payload: {}, as: ComplianceOfficer }
            - { call: "POST /applications/${app_id}/screening-report", payload: { credit_score: 720, income_verified: true }, as: ComplianceOfficer }
            - { call: "POST /applications/${app_id}/match", payload: {}, as: ComplianceOfficer }
            - { call: "POST /agreements", payload: { application_id: "${app_id}", expected_listing_version: "${listing_v}", occupancy_start_date: "2026-06-10", occupancy_end_date: "2026-08-31" }, as: Leaseholder, as_user_id: "${lh_id}", captures: { agr_id: $.data.id } }
            - { call: "POST /fees", payload: { agreement_id: "${agr_id}", fee_type: "SCREENING", amount_cents: 5000 }, as: PlatformAdmin, captures: { fee_id: $.data.id } }
          trigger:
            - { call: "POST /fees/${fee_id}/charge", payload: {}, as: PlatformAdmin, captures: { st: $.data.status } }
            - { call: "POST /fees/${fee_id}/refund", payload: {}, as: PlatformAdmin, captures: { st2: $.data.status } }
          assert:
            - "Fee.${fee_id}.status after charge == CHARGED"
            - "Fee.${fee_id}.status after refund == REFUNDED"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: lease_dates_invalid_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_LEASE_DATES_INVALID]"]
        distinguishing_aspect: "POST /leases with term_end_date not after term_start_date returns ERR_LEASE_DATES_INVALID (422)."
        test_recipe:
          setup: ["Landlord + leaseholder."]
          setup_api_calls:
            - { call: "POST /landlords", payload: { name: "LL", email: "ll@x.com" }, as: PlatformAdmin, captures: { ll_id: $.data.id } }
            - { call: "POST /leaseholders", payload: { name: "LH", email: "lh@x.com" }, as: PlatformAdmin, captures: { lh_id: $.data.id } }
          trigger:
            - { call: "POST /leases", payload: { landlord_id: "${ll_id}", leaseholder_id: "${lh_id}", monthly_rent_cents: 300000, security_deposit_cents: 500000, term_start_date: "2026-12-31", term_end_date: "2026-01-01", allows_sublet: true }, as: Landlord, as_user_id: "${ll_id}", captures: { err: $.data.error_id } }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_LEASE_DATES_INVALID"

      - name: listing_type_not_allowed_by_lease
        claim_type: Cross-entity validation
        grounds: ["validations[priority=8]", "errors[ERR_LISTING_TYPE_NOT_ALLOWED]"]
        distinguishing_aspect: "request-approval on a SUBLET listing whose lease has allows_sublet=false returns ERR_LISTING_TYPE_NOT_ALLOWED."
        test_recipe:
          setup: ["Verified lease with allows_sublet=false; SUBLET listing in DRAFT."]
          setup_api_calls:
            - { call: "POST /landlords", payload: { name: "LL", email: "ll@x.com" }, as: PlatformAdmin, captures: { ll_id: $.data.id } }
            - { call: "POST /leaseholders", payload: { name: "LH", email: "lh@x.com" }, as: PlatformAdmin, captures: { lh_id: $.data.id } }
            - { call: "POST /leases", payload: { landlord_id: "${ll_id}", leaseholder_id: "${lh_id}", monthly_rent_cents: 300000, security_deposit_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31", allows_sublet: false, allows_assignment: false }, as: Landlord, as_user_id: "${ll_id}", captures: { lease_id: $.data.id } }
            - { call: "POST /leases/${lease_id}/submit-verification", payload: {}, as: Landlord, as_user_id: "${ll_id}" }
            - { call: "POST /leases/${lease_id}/verify", payload: { decision: "VERIFIED" }, as: ComplianceOfficer }
            - { call: "POST /listings", payload: { lease_id: "${lease_id}", listing_type: "SUBLET", asking_rent_cents: 300000, available_from: "2026-06-01", available_to: "2026-12-31", min_term_months: 2, screening_policy: "STANDARD" }, as: Leaseholder, as_user_id: "${lh_id}", captures: { listing_id: $.data.id } }
          trigger:
            - { call: "POST /listings/${listing_id}/request-approval", payload: {}, as: Leaseholder, as_user_id: "${lh_id}", captures: { err: $.data.error_id } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_LISTING_TYPE_NOT_ALLOWED"

      - name: application_term_too_short
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_TERM_TOO_SHORT]"]
        distinguishing_aspect: "POST /applications with a proposed occupancy shorter than listing.min_term_months (3) returns ERR_TERM_TOO_SHORT."
        test_recipe:
          setup: ["OPEN SUBLET listing, min_term_months 3, wide availability."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /landlords", payload: { name: "LL", email: "ll@x.com" }, as: PlatformAdmin, captures: { ll_id: $.data.id } }
            - { call: "POST /leaseholders", payload: { name: "LH", email: "lh@x.com" }, as: PlatformAdmin, captures: { lh_id: $.data.id } }
            - { call: "POST /applicants", payload: { name: "AP", email: "ap@x.com", annual_income_cents: 15000000, monthly_debt_cents: 0, credit_score: 720 }, as: PlatformAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /leases", payload: { landlord_id: "${ll_id}", leaseholder_id: "${lh_id}", monthly_rent_cents: 300000, security_deposit_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31", allows_sublet: true }, as: Landlord, as_user_id: "${ll_id}", captures: { lease_id: $.data.id } }
            - { call: "POST /leases/${lease_id}/submit-verification", payload: {}, as: Landlord, as_user_id: "${ll_id}" }
            - { call: "POST /leases/${lease_id}/verify", payload: { decision: "VERIFIED" }, as: ComplianceOfficer }
            - { call: "POST /listings", payload: { lease_id: "${lease_id}", listing_type: "SUBLET", asking_rent_cents: 300000, available_from: "2026-06-01", available_to: "2026-12-31", min_term_months: 3, screening_policy: "STANDARD" }, as: Leaseholder, as_user_id: "${lh_id}", captures: { listing_id: $.data.id } }
            - { call: "POST /listings/${listing_id}/request-approval", payload: {}, as: Leaseholder, as_user_id: "${lh_id}" }
            - { call: "POST /listings/${listing_id}/approve", payload: {}, as: Landlord, as_user_id: "${ll_id}" }
          trigger:
            - { call: "POST /applications", payload: { listing_id: "${listing_id}", applicant_id: "${ap_id}", proposed_move_in_date: "2026-06-01", proposed_move_out_date: "2026-06-20" }, as: Applicant, as_user_id: "${ap_id}", captures: { err: $.data.error_id } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_TERM_TOO_SHORT"

      - name: funding_amount_mismatch_on_fresh_settlement
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_FUNDING_AMOUNT_MISMATCH]"]
        distinguishing_aspect: "Funding a PENDING settlement with an amount != total_move_in_cents (746000) returns ERR_FUNDING_AMOUNT_MISMATCH (402); state is valid so only the fiscal check fires."
        test_recipe:
          setup: ["Drafted agreement with auto-created PENDING settlement (total 746000)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /landlords", payload: { name: "LL", email: "ll@x.com" }, as: PlatformAdmin, captures: { ll_id: $.data.id } }
            - { call: "POST /leaseholders", payload: { name: "LH", email: "lh@x.com" }, as: PlatformAdmin, captures: { lh_id: $.data.id } }
            - { call: "POST /applicants", payload: { name: "AP", email: "ap@x.com", annual_income_cents: 15000000, monthly_debt_cents: 0, credit_score: 720 }, as: PlatformAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /leases", payload: { landlord_id: "${ll_id}", leaseholder_id: "${lh_id}", monthly_rent_cents: 300000, security_deposit_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31", allows_sublet: true }, as: Landlord, as_user_id: "${ll_id}", captures: { lease_id: $.data.id } }
            - { call: "POST /leases/${lease_id}/submit-verification", payload: {}, as: Landlord, as_user_id: "${ll_id}" }
            - { call: "POST /leases/${lease_id}/verify", payload: { decision: "VERIFIED" }, as: ComplianceOfficer }
            - { call: "POST /listings", payload: { lease_id: "${lease_id}", listing_type: "SUBLET", asking_rent_cents: 300000, available_from: "2026-06-01", available_to: "2026-12-31", min_term_months: 2, screening_policy: "STANDARD" }, as: Leaseholder, as_user_id: "${lh_id}", captures: { listing_id: $.data.id } }
            - { call: "POST /listings/${listing_id}/request-approval", payload: {}, as: Leaseholder, as_user_id: "${lh_id}" }
            - { call: "POST /listings/${listing_id}/approve", payload: {}, as: Landlord, as_user_id: "${ll_id}", captures: { listing_v: $.data.version } }
            - { call: "POST /applications", payload: { listing_id: "${listing_id}", applicant_id: "${ap_id}", proposed_move_in_date: "2026-06-10", proposed_move_out_date: "2026-08-31" }, as: Applicant, as_user_id: "${ap_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/start-screening", payload: {}, as: ComplianceOfficer }
            - { call: "POST /applications/${app_id}/screening-report", payload: { credit_score: 720, income_verified: true }, as: ComplianceOfficer }
            - { call: "POST /applications/${app_id}/match", payload: {}, as: ComplianceOfficer }
            - { call: "POST /agreements", payload: { application_id: "${app_id}", expected_listing_version: "${listing_v}", occupancy_start_date: "2026-06-10", occupancy_end_date: "2026-08-31" }, as: Leaseholder, as_user_id: "${lh_id}", captures: { agr_id: $.data.id } }
            - { call: "GET /settlements", payload: { agreement_id: "${agr_id}" }, as: Leaseholder, captures: { sett_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /settlements/${sett_id}/fund", payload: { funded_amount_cents: 700000 }, as: Applicant, as_user_id: "${ap_id}", captures: { err: $.data.error_id } }
          assert:
            - "response.status == 402"
            - "response.data.error_id == ERR_FUNDING_AMOUNT_MISMATCH"

      - name: match_fail_screening_rejected
        claim_type: Cross-entity validation
        grounds: ["validations[priority=7]", "errors[ERR_SCREENING_NOT_PASSED]", calculations.income_qualification]
        distinguishing_aspect: "match on a SCREENED application whose STRICT screening_result is FAIL (income 5000000, multiple 16.67<40) returns ERR_SCREENING_NOT_PASSED."
        test_recipe:
          setup: ["OPEN STRICT SUBLET listing; applicant income 5000000 screened FAIL."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /landlords", payload: { name: "LL", email: "ll@x.com" }, as: PlatformAdmin, captures: { ll_id: $.data.id } }
            - { call: "POST /leaseholders", payload: { name: "LH", email: "lh@x.com" }, as: PlatformAdmin, captures: { lh_id: $.data.id } }
