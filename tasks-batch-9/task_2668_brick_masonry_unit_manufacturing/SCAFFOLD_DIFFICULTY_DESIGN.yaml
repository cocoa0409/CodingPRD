      - name: package_with_uncertified_blend_returns_blend_not_certified_masking_pallet_shortfall
        grounds:
          - validations[priority=29]
          - validations[priority=46]
          - endpoints["POST /orders/{id}/package"]
          - calculations.order_freight_cost
        distinguishing_aspect: |
          The pair is priority 29 (category business_referential, ERR_BLEND_NOT_CERTIFIED,
          409) against priority 46 (category business_fiscal,
          ERR_PALLET_COUNT_INSUFFICIENT, 422) - a SEVENTEEN-step gap that also crosses
          HTTP status classes (409 vs 422) and crosses entities (the winning rule reads
          ShippedBlend while the losing rule reads only the Order payload). The other
          instance in this rule is a narrow state-vs-safety pair inside a single entity.
        test_recipe:
          setup:
            - "Fired lot L1 with 9600 units at color_index 52.18"
