              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/vehicles"
              payload: { vin: "1VWSA7A3XFC000021", model_line: "LX500" }
              as: PortOperationsPlanner
            - call: "GET /vpc/processing-centers/${center_id}"
              payload: {}
              as: PortOperationsPlanner
              captures: { posture_at_3: $.data.yard_posture, free_at_3: $.data.yard_free_slots }
          trigger:
            - call: "POST /vpc/vessels/${vessel_id}/vehicles"
              payload: { vin: "1VWSA7A3XFC000022", model_line: "LX500" }
              as: PortOperationsPlanner
              captures: { veh_4: $.data.id }
            - call: "GET /vpc/processing-centers/${center_id}"
              payload: {}
              as: PortOperationsPlanner
              captures: { posture_at_4: $.data.yard_posture, occupied_at_4: $.data.yard_occupied_slots }
            - call: "POST /vpc/vessels/${vessel_id}/vehicles"
              payload: { vin: "1VWSA7A3XFC000023", model_line: "LX500" }
