            - call: "GET /lottery/applications"
              payload: { school_id: "${s19_id}", status: "WAITLISTED" }
              as: DistrictAdmin
          assert:
            - "Conservation invariant: ACCEPTED count == 2 AND WAITLISTED count == 2; 2 + 2 == 4 original SUBMITTED apps. No drift; every app accounted for in exactly one bucket."
            - "Application.${ai1}.status IN {ACCEPTED, WAITLISTED}"
            - "Application.${ai2}.status IN {ACCEPTED, WAITLISTED}"
            - "Application.${ai3}.status IN {ACCEPTED, WAITLISTED}"
            - "Application.${ai4}.status IN {ACCEPTED, WAITLISTED}"

      - name: offer_count_invariant_after_decline_promote_one_in_one_out
        grounds:
          - state_machines.Offer.OFFERED_to_DECLINED
          - state_machines.WaitlistEntry.ACTIVE_to_PROMOTED
          - state_machines.Application.WAITLISTED_to_ACCEPTED
        distinguishing_aspect: |
          Conserved quantity = ACTIVE-Offer-equivalent count per school (i.e., count of Applications with status==ACCEPTED for school S). After Offer decline + waitlist promotion compensating action, the ACCEPTED-application count for the school MUST remain unchanged (1 declined out, 1 promoted in). Different conserved quantity (seats-currently-occupied) from instance 1's seats-applied-for invariant.
