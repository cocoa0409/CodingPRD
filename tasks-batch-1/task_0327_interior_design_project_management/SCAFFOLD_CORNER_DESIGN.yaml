# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Interior Design Project Management — Expert
# Breadth probe over claim-extraction-guide sections; §1.8 depth-covered corners
# are emitted as excluded_because stubs (no test_recipe).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_project_returns_201_with_initial_ledger
        claim_type: Creation
        grounds: [entities.Project, endpoints]
        distinguishing_aspect: "POST /projects with all required fields returns 201; status=BRIEFING, posture=OPEN, committed_cents=0, design_fee_cents=0, version=1."
        test_recipe:
          setup: ["A registered Client exists."]
          setup_api_calls:
            - { call: "POST /clients", payload: { display_name: "Ann", email: "ann.c1@x.com" }, as: StudioAdmin, captures: { cid: $.data.id } }
          trigger:
            - { call: "POST /projects", payload: { client_name: "Ann", client_user_id: "${cid}", brief_summary: "studio", budget_cents: 5000000, fee_model: "FLAT", flat_fee_cents: 200000 }, as: StudioAdmin, captures: { pid: $.data.id, ver: $.data.version } }
          assert:
            - "HTTP 201; Project.${pid}.status == BRIEFING; Project.${pid}.posture == OPEN"
            - "Project.${pid}.committed_cents == 0; Project.${pid}.design_fee_cents == 0; Project.${pid}.version == 1"

      - name: get_project_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Project, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /projects/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /projects/00000000-0000-4000-8000-000000000000", payload: {}, as: StudioAdmin, captures: { eid: $.data.error_id } }
          assert: ["HTTP 404; error_id == ERR_NOT_FOUND"]

      - name: create_project_missing_budget_returns_422
        claim_type: Required Fields
        grounds: [entities.Project.fields.budget_cents, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required budget_cents on POST /projects returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A Client exists."]
          setup_api_calls:
            - { call: "POST /clients", payload: { display_name: "Bo", email: "bo.c1@x.com" }, as: StudioAdmin, captures: { cid: $.data.id } }
          trigger:
            - { call: "POST /projects", payload: { client_name: "Bo", client_user_id: "${cid}", brief_summary: "x", fee_model: "FLAT", flat_fee_cents: 100 }, as: StudioAdmin, captures: { eid: $.data.error_id } }
          assert: ["HTTP 422; error_id == ERR_INVALID_REQUEST"]

      - name: create_project_fee_model_fields_inconsistent_returns_422
        claim_type: Type Constraints
        grounds: ["validations[priority=14]", "errors[ERR_FEE_MODEL_FIELDS]", entities.Project.fields.fee_model]
        distinguishing_aspect: "fee_model=HOURLY but hourly_rate_cents omitted (and flat_fee_cents set) is inconsistent -> ERR_FEE_MODEL_FIELDS (422)."
        test_recipe:
          setup: ["A Client exists."]
          setup_api_calls:
            - { call: "POST /clients", payload: { display_name: "Cy", email: "cy.c1@x.com" }, as: StudioAdmin, captures: { cid: $.data.id } }
          trigger:
            - { call: "POST /projects", payload: { client_name: "Cy", client_user_id: "${cid}", brief_summary: "x", budget_cents: 100000, fee_model: "HOURLY", flat_fee_cents: 5000 }, as: StudioAdmin, captures: { eid: $.data.error_id } }
          assert: ["HTTP 422; error_id == ERR_FEE_MODEL_FIELDS"]

      - name: selection_unit_cost_snapshot_ignores_input
        claim_type: System Fields
        grounds: [entities.DesignSelection.fields.unit_cost_cents, calculations.selection_line_net]
        distinguishing_aspect: "unit_cost_cents is system-sourced: it equals the FFEItem.list_unit_cost_cents at create time regardless of any client-supplied value; line_net_cents is computed from it."
        test_recipe:
          setup: ["A project and an FFEItem with list_unit_cost_cents=10000; a room exists."]
          setup_api_calls:
            - { call: "POST /clients", payload: { display_name: "Dot", email: "dot.c1@x.com" }, as: StudioAdmin, captures: { cid: $.data.id } }
            - { call: "POST /projects", payload: { client_name: "Dot", client_user_id: "${cid}", brief_summary: "x", budget_cents: 10000000, fee_model: "FLAT", flat_fee_cents: 100000 }, as: StudioAdmin, captures: { pid: $.data.id } }
            - { call: "POST /ffe-items", payload: { sku: "SN-A", name: "Stool", category: "FURNITURE", list_unit_cost_cents: 10000, lead_time_days: 1 }, as: StudioAdmin, captures: { f1: $.data.id } }
            - { call: "POST /projects/${pid}/rooms", payload: { name: "R1", scope_note: "s", room_budget_cents: 0 }, as: Designer, captures: { rid: $.data.id } }
          trigger:
            - { call: "POST /projects/${pid}/selections", payload: { room_id: "${rid}", ffe_item_id: "${f1}", quantity: 4, trade_discount_pct: 0.10, spec_note: "x" }, as: Designer, captures: { s1: $.data.id } }
          assert:
            - "DesignSelection.${s1}.unit_cost_cents == 10000 (snapshot of FFEItem.list_unit_cost_cents)"
            - "DesignSelection.${s1}.line_net_cents == 36000 (round_half_up(10000*4*0.90))"

      - name: ffe_item_duplicate_sku_returns_409
        claim_type: Type Constraints
        grounds: ["validations[priority=13]", "errors[ERR_DUPLICATE]", entities.FFEItem.fields.sku]
        distinguishing_aspect: "Creating a second FFEItem with an already-used sku returns ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["An FFEItem with sku 'DUP-1' exists."]
          setup_api_calls:
            - { call: "POST /ffe-items", payload: { sku: "DUP-1", name: "A", category: "DECOR", list_unit_cost_cents: 500, lead_time_days: 1 }, as: StudioAdmin, captures: { f1: $.data.id } }
          trigger:
            - { call: "POST /ffe-items", payload: { sku: "DUP-1", name: "B", category: "DECOR", list_unit_cost_cents: 600, lead_time_days: 1 }, as: StudioAdmin, captures: { eid: $.data.error_id } }
          assert: ["HTTP 409; error_id == ERR_DUPLICATE"]

      - name: room_duplicate_name_within_project_returns_409
        claim_type: Type Constraints
        grounds: ["validations[priority=13]", "errors[ERR_DUPLICATE]", entities.Room.fields.name]
        distinguishing_aspect: "A second Room with a name already used within the SAME project returns ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["A project with a room named 'Kitchen'."]
          setup_api_calls:
            - { call: "POST /clients", payload: { display_name: "Ed", email: "ed.c1@x.com" }, as: StudioAdmin, captures: { cid: $.data.id } }
            - { call: "POST /projects", payload: { client_name: "Ed", client_user_id: "${cid}", brief_summary: "x", budget_cents: 10000000, fee_model: "FLAT", flat_fee_cents: 100000 }, as: StudioAdmin, captures: { pid: $.data.id } }
            - { call: "POST /projects/${pid}/rooms", payload: { name: "Kitchen", scope_note: "s", room_budget_cents: 0 }, as: Designer, captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /projects/${pid}/rooms", payload: { name: "Kitchen", scope_note: "s2", room_budget_cents: 0 }, as: Designer, captures: { eid: $.data.error_id } }
          assert: ["HTTP 409; error_id == ERR_DUPLICATE"]

      - name: list_projects_pagination_envelope
        claim_type: Listing
        grounds: [entities.Project, endpoints]
        distinguishing_aspect: "GET /projects returns an array response_type with pagination fields total_count and has_more in meta/data per §1.0."
        test_recipe:
          setup: ["Two projects for the same client exist."]
          setup_api_calls:
            - { call: "POST /clients", payload: { display_name: "Fi", email: "fi.c1@x.com" }, as: StudioAdmin, captures: { cid: $.data.id } }
            - { call: "POST /projects", payload: { client_name: "Fi", client_user_id: "${cid}", brief_summary: "a", budget_cents: 100000, fee_model: "FLAT", flat_fee_cents: 100 }, as: StudioAdmin }
            - { call: "POST /projects", payload: { client_name: "Fi", client_user_id: "${cid}", brief_summary: "b", budget_cents: 100000, fee_model: "FLAT", flat_fee_cents: 100 }, as: StudioAdmin }
          trigger:
            - { call: "GET /projects", payload: { client_user_id: "${cid}", limit: 1, offset: 0 }, as: StudioAdmin }
          assert:
            - "response_type == array; total_count == 2; has_more == true; exactly 1 item returned"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: place_already_ordered_order_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ProcurementOrder.DRAFT_to_ORDERED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Placing an order already in ORDERED (not DRAFT) returns ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["A placed (ORDERED) order on a FLAT project."]
          setup_api_calls:
            - { call: "POST /clients", payload: { display_name: "Gи", email: "g.c1@x.com" }, as: StudioAdmin, captures: { cid: $.data.id } }
            - { call: "POST /projects", payload: { client_name: "G", client_user_id: "${cid}", brief_summary: "x", budget_cents: 100000000, fee_model: "FLAT", flat_fee_cents: 100000 }, as: StudioAdmin, captures: { pid: $.data.id } }
            - { call: "POST /vendors", payload: { name: "V", trade: "SUPPLIER" }, as: ProcurementCoordinator, captures: { vid: $.data.id } }
            - { call: "POST /ffe-items", payload: { sku: "IV-A", name: "Sofa", category: "FURNITURE", list_unit_cost_cents: 20000, lead_time_days: 1 }, as: StudioAdmin, captures: { f1: $.data.id } }
            - { call: "POST /projects/${pid}/rooms", payload: { name: "R1", scope_note: "s", room_budget_cents: 0 }, as: Designer, captures: { rid: $.data.id } }
            - { call: "POST /rooms/${rid}/moodboards", payload: { title: "mb", palette: ["x"] }, as: Designer, captures: { mb: $.data.id } }
            - { call: "POST /moodboards/${mb}/present", payload: {}, as: Designer }
            - { call: "POST /rooms/${rid}/present-moodboard", payload: {}, as: Designer }
            - { call: "POST /rooms/${rid}/approve", payload: {}, as: Client, as_user_id: "${cid}" }
            - { call: "POST /projects/${pid}/selections", payload: { room_id: "${rid}", ffe_item_id: "${f1}", quantity: 1, spec_note: "a" }, as: Designer, captures: { s1: $.data.id } }
            - { call: "POST /selections/${s1}/specify", payload: {}, as: Designer }
            - { call: "POST /projects/${pid}/orders", payload: { vendor_id: "${vid}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-07-02T00:00:00Z" }, as: ProcurementCoordinator, captures: { o1: $.data.id } }
            - { call: "POST /orders/${o1}/lines", payload: { selection_id: "${s1}" }, as: ProcurementCoordinator }
            - { call: "GET /projects/${pid}", payload: {}, as: StudioAdmin, captures: { pv: $.data.version } }
            - { call: "POST /orders/${o1}/place", payload: { expected_project_version: "${pv}" }, as: ProcurementCoordinator }
            - { call: "GET /projects/${pid}", payload: {}, as: StudioAdmin, captures: { pv2: $.data.version } }
          trigger:
            - { call: "POST /orders/${o1}/ship", payload: {}, as: ProcurementCoordinator }
            - { call: "POST /orders/${o1}/place", payload: { expected_project_version: "${pv2}" }, as: ProcurementCoordinator, captures: { eid: $.data.error_id } }
          assert: ["Second place returns HTTP 409; error_id == ERR_INVALID_STATE"]

      - name: present_second_moodboard_when_one_already_presented_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.MoodBoard.DRAFT_to_PRESENTED, "errors[ERR_MOODBOARD_ALREADY_PRESENTED]"]
        distinguishing_aspect: "Presenting a second mood board for a room that already has a PRESENTED board returns ERR_MOODBOARD_ALREADY_PRESENTED."
        test_recipe:
          setup: ["A room with one PRESENTED mood board and a second DRAFT mood board."]
          setup_api_calls:
            - { call: "POST /clients", payload: { display_name: "Ha", email: "ha.c1@x.com" }, as: StudioAdmin, captures: { cid: $.data.id } }
            - { call: "POST /projects", payload: { client_name: "Ha", client_user_id: "${cid}", brief_summary: "x", budget_cents: 10000000, fee_model: "FLAT", flat_fee_cents: 100000 }, as: StudioAdmin, captures: { pid: $.data.id } }
            - { call: "POST /projects/${pid}/rooms", payload: { name: "R1", scope_note: "s", room_budget_cents: 0 }, as: Designer, captures: { rid: $.data.id } }
            - { call: "POST /rooms/${rid}/moodboards", payload: { title: "mb1", palette: ["x"] }, as: Designer, captures: { mb1: $.data.id } }
            - { call: "POST /rooms/${rid}/moodboards", payload: { title: "mb2", palette: ["y"] }, as: Designer, captures: { mb2: $.data.id } }
            - { call: "POST /moodboards/${mb1}/present", payload: {}, as: Designer }
          trigger:
            - { call: "POST /moodboards/${mb2}/present", payload: {}, as: Designer, captures: { eid: $.data.error_id } }
          assert: ["HTTP 409; error_id == ERR_MOODBOARD_ALREADY_PRESENTED; MoodBoard.${mb2}.status == DRAFT"]

      - name: room_approve_cascades_sibling_moodboards_superseded
        claim_type: Side Effect Execution
        grounds: [state_machines.Room.MOODBOARD_READY_to_APPROVED, state_machines.MoodBoard.DRAFT_to_SUPERSEDED, entities.Room.fields.approved_moodboard_id]
        distinguishing_aspect: "Room approval pins the PRESENTED board to ACCEPTED and supersedes all other (DRAFT) boards of that room; approved_moodboard_id is set to the accepted board id."
        test_recipe:
          setup: ["A MOODBOARD_READY room with one PRESENTED board and one DRAFT sibling board."]
          setup_api_calls:
            - { call: "POST /clients", payload: { display_name: "Io", email: "io.c1@x.com" }, as: StudioAdmin, captures: { cid: $.data.id } }
            - { call: "POST /projects", payload: { client_name: "Io", client_user_id: "${cid}", brief_summary: "x", budget_cents: 10000000, fee_model: "FLAT", flat_fee_cents: 100000 }, as: StudioAdmin, captures: { pid: $.data.id } }
            - { call: "POST /projects/${pid}/rooms", payload: { name: "R1", scope_note: "s", room_budget_cents: 0 }, as: Designer, captures: { rid: $.data.id } }
            - { call: "POST /rooms/${rid}/moodboards", payload: { title: "mb1", palette: ["x"] }, as: Designer, captures: { mb1: $.data.id } }
            - { call: "POST /rooms/${rid}/moodboards", payload: { title: "mb2", palette: ["y"] }, as: Designer, captures: { mb2: $.data.id } }
            - { call: "POST /moodboards/${mb1}/present", payload: {}, as: Designer }
            - { call: "POST /rooms/${rid}/present-moodboard", payload: {}, as: Designer }
          trigger:
            - { call: "POST /rooms/${rid}/approve", payload: {}, as: Client, as_user_id: "${cid}" }
          assert:
            - "Room.${rid}.status == APPROVED; Room.${rid}.approved_moodboard_id == ${mb1}"
            - "MoodBoard.${mb1}.status == ACCEPTED; MoodBoard.${mb2}.status == SUPERSEDED"

      - name: terminal_order_cancelled_cannot_transition
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ProcurementOrder.ORDERED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED order is terminal; shipping it returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["An order placed then cancelled (CANCELLED)."]
          setup_api_calls:
            - { call: "POST /clients", payload: { display_name: "Ja", email: "ja.c1@x.com" }, as: StudioAdmin, captures: { cid: $.data.id } }
            - { call: "POST /projects", payload: { client_name: "Ja", client_user_id: "${cid}", brief_summary: "x", budget_cents: 100000000, fee_model: "FLAT", flat_fee_cents: 100000 }, as: StudioAdmin, captures: { pid: $.data.id } }
            - { call: "POST /vendors", payload: { name: "V", trade: "SUPPLIER" }, as: ProcurementCoordinator, captures: { vid: $.data.id } }
            - { call: "POST /ffe-items", payload: { sku: "TL-A", name: "Sofa", category: "FURNITURE", list_unit_cost_cents: 20000, lead_time_days: 1 }, as: StudioAdmin, captures: { f1: $.data.id } }
            - { call: "POST /projects/${pid}/rooms", payload: { name: "R1", scope_note: "s", room_budget_cents: 0 }, as: Designer, captures: { rid: $.data.id } }
            - { call: "POST /rooms/${rid}/moodboards", payload: { title: "mb", palette: ["x"] }, as: Designer, captures: { mb: $.data.id } }
            - { call: "POST /moodboards/${mb}/present", payload: {}, as: Designer }
            - { call: "POST /rooms/${rid}/present-moodboard", payload: {}, as: Designer }
            - { call: "POST /rooms/${rid}/approve", payload: {}, as: Client, as_user_id: "${cid}" }
            - { call: "POST /projects/${pid}/selections", payload: { room_id: "${rid}", ffe_item_id: "${f1}", quantity: 1, spec_note: "a" }, as: Designer, captures: { s1: $.data.id } }
            - { call: "POST /selections/${s1}/specify", payload: {}, as: Designer }
            - { call: "POST /projects/${pid}/orders", payload: { vendor_id: "${vid}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-07-02T00:00:00Z" }, as: ProcurementCoordinator, captures: { o1: $.data.id } }
            - { call: "POST /orders/${o1}/lines", payload: { selection_id: "${s1}" }, as: ProcurementCoordinator }
            - { call: "GET /projects/${pid}", payload: {}, as: StudioAdmin, captures: { pv: $.data.version } }
            - { call: "POST /orders/${o1}/place", payload: { expected_project_version: "${pv}" }, as: ProcurementCoordinator }
            - { call: "POST /orders/${o1}/cancel", payload: {}, as: ProcurementCoordinator }
          trigger:
            - { call: "POST /orders/${o1}/ship", payload: {}, as: ProcurementCoordinator, captures: { eid: $.data.error_id } }
          assert: ["HTTP 409; error_id == ERR_INVALID_STATE; ProcurementOrder.${o1}.status == CANCELLED"]

      - name: close_order_with_open_punch_items_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.ProcurementOrder.DELIVERED_to_CLOSED, "errors[ERR_PUNCH_ITEMS_OPEN]"]
        distinguishing_aspect: "Closing a DELIVERED order that still has an OPEN punch item returns ERR_PUNCH_ITEMS_OPEN."
        test_recipe:
          setup: ["A DELIVERED order with one OPEN MINOR punch item."]
          setup_api_calls:
            - { call: "POST /clients", payload: { display_name: "Ka", email: "ka.c1@x.com" }, as: StudioAdmin, captures: { cid: $.data.id } }
            - { call: "POST /projects", payload: { client_name: "Ka", client_user_id: "${cid}", brief_summary: "x", budget_cents: 100000000, fee_model: "FLAT", flat_fee_cents: 100000 }, as: StudioAdmin, captures: { pid: $.data.id } }
            - { call: "POST /vendors", payload: { name: "V", trade: "SUPPLIER" }, as: ProcurementCoordinator, captures: { vid: $.data.id } }
            - { call: "POST /ffe-items", payload: { sku: "PO-A", name: "Sofa", category: "FURNITURE", list_unit_cost_cents: 20000, lead_time_days: 1 }, as: StudioAdmin, captures: { f1: $.data.id } }
            - { call: "POST /projects/${pid}/rooms", payload: { name: "R1", scope_note: "s", room_budget_cents: 0 }, as: Designer, captures: { rid: $.data.id } }
            - { call: "POST /rooms/${rid}/moodboards", payload: { title: "mb", palette: ["x"] }, as: Designer, captures: { mb: $.data.id } }
            - { call: "POST /moodboards/${mb}/present", payload: {}, as: Designer }
            - { call: "POST /rooms/${rid}/present-moodboard", payload: {}, as: Designer }
            - { call: "POST /rooms/${rid}/approve", payload: {}, as: Client, as_user_id: "${cid}" }
            - { call: "POST /projects/${pid}/selections", payload: { room_id: "${rid}", ffe_item_id: "${f1}", quantity: 1, spec_note: "a" }, as: Designer, captures: { s1: $.data.id } }
            - { call: "POST /selections/${s1}/specify", payload: {}, as: Designer }
            - { call: "POST /projects/${pid}/orders", payload: { vendor_id: "${vid}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-07-02T00:00:00Z" }, as: ProcurementCoordinator, captures: { o1: $.data.id } }
            - { call: "POST /orders/${o1}/lines", payload: { selection_id: "${s1}" }, as: ProcurementCoordinator }
            - { call: "GET /projects/${pid}", payload: {}, as: StudioAdmin, captures: { pv: $.data.version } }
            - { call: "POST /orders/${o1}/place", payload: { expected_project_version: "${pv}" }, as: ProcurementCoordinator }
            - { call: "POST /orders/${o1}/ship", payload: {}, as: ProcurementCoordinator }
            - { call: "POST /orders/${o1}/deliver", payload: {}, as: ProcurementCoordinator }
            - { call: "POST /orders/${o1}/punch-items", payload: { description: "scuff", severity: "MINOR" }, as: ProcurementCoordinator, captures: { pi: $.data.id } }
          trigger:
            - { call: "POST /orders/${o1}/close-order", payload: {}, as: ProcurementCoordinator, captures: { eid: $.data.error_id } }
          assert: ["HTTP 409; error_id == ERR_PUNCH_ITEMS_OPEN; ProcurementOrder.${o1}.status == DELIVERED"]

      - name: return_delivered_order_without_blocking_punch_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.ProcurementOrder.DELIVERED_to_RETURNED, "errors[ERR_RETURN_NOT_JUSTIFIED]"]
        distinguishing_aspect: "Returning a DELIVERED order that has no BLOCKING punch item returns ERR_RETURN_NOT_JUSTIFIED."
        test_recipe:
          setup: ["A DELIVERED order with one MINOR (not BLOCKING) punch item."]
          setup_api_calls:
            - { call: "POST /clients", payload: { display_name: "Lo", email: "lo.c1@x.com" }, as: StudioAdmin, captures: { cid: $.data.id } }
            - { call: "POST /projects", payload: { client_name: "Lo", client_user_id: "${cid}", brief_summary: "x", budget_cents: 100000000, fee_model: "FLAT", flat_fee_cents: 100000 }, as: StudioAdmin, captures: { pid: $.data.id } }
            - { call: "POST /vendors", payload: { name: "V", trade: "SUPPLIER" }, as: ProcurementCoordinator, captures: { vid: $.data.id } }
            - { call: "POST /ffe-items", payload: { sku: "RN-A", name: "Sofa", category: "FURNITURE", list_unit_cost_cents: 20000, lead_time_days: 1 }, as: StudioAdmin, captures: { f1: $.data.id } }
            - { call: "POST /projects/${pid}/rooms", payload: { name: "R1", scope_note: "s", room_budget_cents: 0 }, as: Designer, captures: { rid: $.data.id } }
            - { call: "POST /rooms/${rid}/moodboards", payload: { title: "mb", palette: ["x"] }, as: Designer, captures: { mb: $.data.id } }
            - { call: "POST /moodboards/${mb}/present", payload: {}, as: Designer }
            - { call: "POST /rooms/${rid}/present-moodboard", payload: {}, as: Designer }
            - { call: "POST /rooms/${rid}/approve", payload: {}, as: Client, as_user_id: "${cid}" }
            - { call: "POST /projects/${pid}/selections", payload: { room_id: "${rid}", ffe_item_id: "${f1}", quantity: 1, spec_note: "a" }, as: Designer, captures: { s1: $.data.id } }
            - { call: "POST /selections/${s1}/specify", payload: {}, as: Designer }
            - { call: "POST /projects/${pid}/orders", payload: { vendor_id: "${vid}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-07-02T00:00:00Z" }, as: ProcurementCoordinator, captures: { o1: $.data.id } }
            - { call: "POST /orders/${o1}/lines", payload: { selection_id: "${s1}" }, as: ProcurementCoordinator }
            - { call: "GET /projects/${pid}", payload: {}, as: StudioAdmin, captures: { pv: $.data.version } }
            - { call: "POST /orders/${o1}/place", payload: { expected_project_version: "${pv}" }, as: ProcurementCoordinator }
