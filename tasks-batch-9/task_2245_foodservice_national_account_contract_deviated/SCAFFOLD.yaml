  # --- contract construction ------------------------------------------------
  - method: POST
    path: "/nac/contracts"
    description: "Create a contract draft for an operator."
    roles: [NationalAccountManager]
    code: 201
    input: [operator_id, contract_code, rebate_funding_manufacturer_id, effective_from, effective_to, "notice_period_days?", "contracted_purchase_pct_target?", "compliance_basis?", "allow_out_of_market?"]
    output: Contract
    side_effects: ["Contract.status set to DRAFT; compliance_posture set to OPEN"]

  - method: GET
    path: "/nac/contracts/{contract_id}"
    description: "Read one contract including compliance_posture and rebate ledger counters."
    roles: [NationalAccountManager, PricingAnalyst, OperatorBuyer, RebateAccountant, ContractAuditor, SystemAdmin]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: GET
    path: "/nac/contracts"
    description: "List contracts, filterable by operator, funding manufacturer, amended parent and status."
    roles: [NationalAccountManager, PricingAnalyst, OperatorBuyer, RebateAccountant, ContractAuditor, SystemAdmin]
    code: 200
    input: ["operator_id?", "rebate_funding_manufacturer_id?", "amends_contract_id?", "status?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []

  - method: POST
    path: "/nac/contracts/{contract_id}/submit-for-signature"
    description: "Move a fully-configured draft to PENDING_SIGNATURE."
    roles: [NationalAccountManager]
    code: 200
    input: []
    output: Contract
    side_effects: ["Contract DRAFT -> PENDING_SIGNATURE", "increments Contract.version by 1"]

  - method: POST
    path: "/nac/contracts/{contract_id}/return-to-draft"
    description: "Operator sends the contract back for revision."
    roles: [OperatorBuyer]
    code: 200
    input: ["note?"]
    output: Contract
    side_effects: ["Contract PENDING_SIGNATURE -> DRAFT", "increments Contract.version by 1"]

  - method: POST
    path: "/nac/contracts/{contract_id}/sign"
    description: "Operator signs; an amendment draft additionally expires its parent and supersedes the parent's tiers and coverages."
    roles: [OperatorBuyer]
    code: 200
    input: []
    output: Contract
    side_effects:
      - "Contract PENDING_SIGNATURE -> ACTIVE; signed_at and signed_by_user_id stamped"
      - "compliance_posture recomputed by contract_compliance_posture"
      - "when amends_contract_id is set: parent AMENDING -> EXPIRED, parent tiers ACTIVE -> SUPERSEDED, parent coverages ACTIVE -> ENDED"
      - "increments Contract.version by 1"

  - method: POST
    path: "/nac/contracts/{contract_id}/amendments"
    description: "Open an amendment: the live contract moves to AMENDING and a new DRAFT contract is returned with amends_contract_id set."
    roles: [NationalAccountManager]
    code: 201
    input: [contract_code, effective_from, effective_to, "notice_period_days?", "contracted_purchase_pct_target?", "compliance_basis?", "allow_out_of_market?"]
    output: Contract
    side_effects: ["parent Contract ACTIVE -> AMENDING", "creates the amendment draft Contract", "increments parent Contract.version by 1"]

  - method: POST
    path: "/nac/contracts/{contract_id}/suspend"
    description: "Suspend a live contract."
    roles: [NationalAccountManager]
    code: 200
    input: ["note?"]
    output: Contract
    side_effects: ["Contract ACTIVE -> SUSPENDED", "increments Contract.version by 1"]

  - method: POST
    path: "/nac/contracts/{contract_id}/reinstate"
    description: "Return a suspended contract to ACTIVE and recompute its posture."
    roles: [NationalAccountManager]
    code: 200
    input: []
    output: Contract
    side_effects: ["Contract SUSPENDED -> ACTIVE", "compliance_posture recomputed", "increments Contract.version by 1"]

  - method: POST
    path: "/nac/contracts/{contract_id}/terminate"
    description: "Terminate a contract or abandon an amendment draft; cascades to deviations, tiers and coverages."
    roles: [NationalAccountManager]
    code: 200
    input: ["reason?"]
    output: Contract
    side_effects:
      - "Contract -> TERMINATED"
      - "non-terminal DeviationAgreement rows of the contract -> TERMINATED"
      - "ACTIVE ContractTier rows -> SUPERSEDED; ACTIVE DcCoverage rows -> ENDED"
      - "when this row is an amendment draft, the parent AMENDING -> ACTIVE"
      - "increments Contract.version by 1"

  - method: GET
    path: "/nac/contracts/{contract_id}/compliance-report"
    description: "Computed read: contracted-item purchase percentage of the most recent closed period, the target, the shortfall and the derived posture."
    roles: [NationalAccountManager, OperatorBuyer, RebateAccountant, ContractAuditor]
    code: 200
    input: []
    output: "{ contract_id: string, evaluated_at: datetime, closed_period_count: integer, latest_period_id: string, latest_compliance_pct: number, latest_rebate_rate_pct: number, contracted_purchase_pct_target: number, shortfall_pct: number, compliance_basis: string, compliance_posture: string }"
    side_effects: []

  # --- markup tiers and DC coverage ----------------------------------------
  - method: POST
    path: "/nac/contract-tiers"
    description: "Add a cost-plus markup tier for a product class and case-volume band."
    roles: [NationalAccountManager]
    code: 201
    input: [contract_id, product_class_code, cost_basis, markup_type, markup_value, min_case_volume, "max_case_volume?", "counts_as_contracted?"]
