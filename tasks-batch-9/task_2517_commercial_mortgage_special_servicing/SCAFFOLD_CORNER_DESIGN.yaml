              payload: { loan_id: "${loan_id}" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { advance_status_after: "$.data[0].status" }
            - call: "GET /special-servicing/fee-accruals"
              payload: { loan_id: "${loan_id}", fee_type: "LIQUIDATION_FEE" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { fee_count: "$.data" }
          assert:
            - "REOAsset.remic_disposition_deadline == 2029-08-01T00:00:00Z and status after the trigger == WRITTEN_OFF (terminal)"
            - "Loan.servicing_status == WRITTEN_OFF, current_principal_balance_usd == 0.00 and realized_loss_usd == 10350000.00 (10,000,000.00 principal + 350,000.00 outstanding advance principal)"
            - "Loan.advances_outstanding_usd is still 350000.00 and both advances are still OUTSTANDING with reimbursed_principal_usd 0.00 — a write-off neither reimburses nor deems anything nonrecoverable"
            - "No LIQUIDATION_FEE FeeAccrual exists on the loan: the fee waterfall belongs to SOLD, not to WRITTEN_OFF"
            - "Trust.realized_loss_usd == 10350000.00 via the roll-up declared on Loan.realized_loss_usd, controlling_class_notional_usd == 29650000.00 and control_status is still CONTROLLING because 29,650,000.00 >= 10,000,000.00"
            - "Trust.loans_in_special_servicing_count fell from 1 to 0 because WRITTEN_OFF is outside {SPECIAL_SERVICING, IN_WORKOUT, REO}"
            - "REOAsset.version, Loan.version and Trust.version each incremented by exactly 1"
            - "A subsequent POST /reo-assets/{id}/status with to_status MARKETED returns ERR_INVALID_STATE_TRANSITION (409)"

      - name: plan_execution_guarded_by_a_fresh_accepted_appraisal_on_another_entity
