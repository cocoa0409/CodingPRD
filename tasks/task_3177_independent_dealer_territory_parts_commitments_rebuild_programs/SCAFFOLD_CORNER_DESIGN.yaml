        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One dealer T-410 with an ACTIVE agreement but every commitment still healthy."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - *n_agree
