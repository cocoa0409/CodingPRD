            - { call: "POST /api/nominations/${nom}/approve", payload: { expected_nomination_version: "${nom_v}" }, as: HRAdmin }
            - { call: "POST /api/vendors", payload: { name: "V", vendor_code: "V1", daily_ship_capacity: 10, lead_time_business_days: 1, supported_categories: ["MERCH"] }, as: VendorOps, captures: { vend: $.data.id } }
