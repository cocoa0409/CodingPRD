scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: frax_with_bmd_versus_without_bmd_diverges_on_identical_risk_profile
        grounds:
          - calculations.frax_probability
          - entities.FraxAssessment.fields.variant
          - entities.FraxAssessment.fields.bmd_points
          - entities.FraxAssessment.fields.major_osteoporotic_10yr_pct
          - entities.FraxAssessment.fields.hip_fracture_10yr_pct
          - entities.FraxAssessment.fields.threshold_basis
          - endpoints["POST /bone-density/frax-assessments"]
        distinguishing_aspect: |
          Both variants read the same Patient and the same ACTIVE RiskFactorProfile, and differ only in
          whether the FEMORAL_NECK t_score contributes bmd_points, so WITH_BMD lands on
          major_osteoporotic_10yr_pct 31.2 / hip_fracture_10yr_pct 7.9 / threshold_basis BOTH while
          WITHOUT_BMD lands on 16.8 / 4.1 / threshold_basis HIP from byte-identical stored inputs.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T09:05:00Z."
            - "One PayerPolicy PAY-STD with baseline_screening_min_interval_months 24."
            - "One Densitometer HLG-0001, status ACTIVE, phantom baseline 1.0000 / 0.0100, lsc_g_cm2 0.0277 from an accepted precision assessment."
            - "One Patient MRN-1001, FEMALE, postmenopausal, born 1958-05-12 (age 67 at the clock), baseline_height_cm 165.0."
            - "One ACTIVE RiskFactorProfile with height_cm 160.0, weight_kg 52.0, bmi 20.31 and every clinical risk factor false."
            - "One ScanSession in acquisition_status SUBMITTED carrying a single FEMORAL_NECK SiteMeasurement whose t_score is exactly -2.0."
          setup_api_calls:
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/payer-policies"
              payload: { payer_code: "PAY-STD", name: "Standard Bone Health", baseline_screening_min_interval_months: 24, high_risk_min_interval_months: 12, treatment_monitoring_min_interval_months: 12, vfa_covered: true, vfa_requires_height_loss_cm: 4.0, repeat_scan_grace_days: 30, max_lifetime_screening_scans: 6, appeal_allowed: false }
              as: ProgramAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /bone-density/densitometers"
              payload: { serial_number: "HLG-0001", manufacturer: "HOLOGIC", model: "Horizon A", site_code: "MAIN", phantom_baseline_bmd_g_cm2: 1.0000, phantom_baseline_sd_g_cm2: 0.0100, appointment_buffer_minutes: 15, daily_scan_capacity: 12 }
              as: ProgramAdmin
              captures: { dev_a_id: $.data.id, dev_a_version: $.data.version }
            - call: "POST /bone-density/densitometers/${dev_a_id}/precision-assessment"
              payload: { expected_densitometer_version: "${dev_a_version}", technologist_user_id: "tech-001", patient_count: 30, scans_per_patient: 2, rms_sd_g_cm2: 0.0100 }
              as: ProgramAdmin
            - call: "POST /bone-density/patients"
              payload: { mrn: "MRN-1001", primary_payer_policy_id: "${policy_id}", birth_date: "1958-05-12", sex: "FEMALE", postmenopausal: true, baseline_height_cm: 165.0 }
              as: Scheduler
              captures: { pat_id: $.data.id, pat_version: $.data.version }
            - call: "POST /bone-density/patients/${pat_id}/risk-factor-profiles"
              payload: { expected_patient_version: "${pat_version}", height_cm: 160.0, weight_kg: 52.0, prior_fragility_fracture: false, parental_hip_fracture: false, current_smoker: false, glucocorticoid_use: false, rheumatoid_arthritis: false, secondary_osteoporosis: false, alcohol_units_per_day: 0.0 }
              as: Scheduler
              captures: { rfp_id: $.data.id }
            - call: "POST /bone-density/scan-orders"
              payload: { patient_id: "${pat_id}", indication: "BASELINE_SCREENING", requested_sites: ["FEMORAL_NECK"], requested_scan_date: "2026-03-10", vfa_requested: false }
              as: Scheduler
              captures: { order1_id: $.data.id }
            - call: "POST /bone-density/scan-appointments"
              payload: { scan_order_id: "${order1_id}", densitometer_id: "${dev_a_id}", start_utc: "2026-03-10T09:00:00Z", end_utc: "2026-03-10T09:30:00Z" }
              as: Scheduler
              captures: { appt1_id: $.data.id }
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T09:05:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/scan-appointments/${appt1_id}/scan-sessions"
              payload: { scan_mode: "ARRAY" }
              as: Technologist
              as_user_id: "tech-001"
              captures: { sess1_id: $.data.id }
            - call: "POST /bone-density/scan-sessions/${sess1_id}/site-measurements"
              payload: { site_code: "FEMORAL_NECK", bmd_g_cm2: 0.6500, area_cm2: 5.20, bmc_g: 3.38, reference_mean_bmd_g_cm2: 0.8500, reference_sd_g_cm2: 0.1000, age_matched_mean_bmd_g_cm2: 0.7000, age_matched_sd_g_cm2: 0.1000 }
              as: Technologist
              as_user_id: "tech-001"
            - call: "POST /bone-density/scan-sessions/${sess1_id}/submit-acquisition"
              payload: {}
              as: Technologist
              as_user_id: "tech-001"
          trigger:
            - call: "POST /bone-density/frax-assessments"
              payload: { patient_id: "${pat_id}", risk_factor_profile_id: "${rfp_id}", scan_session_id: "${sess1_id}" }
              as: InterpretingPhysician
              as_user_id: "phys-001"
              captures: { frax_with_id: $.data.id }
            - call: "POST /bone-density/frax-assessments"
              payload: { patient_id: "${pat_id}", risk_factor_profile_id: "${rfp_id}" }
              as: InterpretingPhysician
              as_user_id: "phys-001"
              captures: { frax_without_id: $.data.id }
          assert:
            - "FraxAssessment.${frax_with_id}.variant == WITH_BMD"
            - "FraxAssessment.${frax_with_id}.age_years == 67"
            - "FraxAssessment.${frax_with_id}.bmi_used == 20.31"
            - "FraxAssessment.${frax_with_id}.age_points == 1.70"
            - "FraxAssessment.${frax_with_id}.sex_points == 0.60"
            - "FraxAssessment.${frax_with_id}.bmi_points == 0.00"
            - "FraxAssessment.${frax_with_id}.clinical_risk_points == 0.00"
            - "FraxAssessment.${frax_with_id}.bmd_points == 2.40"
            - "FraxAssessment.${frax_with_id}.raw_score == 4.70"
            - "FraxAssessment.${frax_with_id}.major_osteoporotic_10yr_pct == 31.2"
            - "FraxAssessment.${frax_with_id}.hip_fracture_10yr_pct == 7.9"
            - "FraxAssessment.${frax_with_id}.treatment_threshold_met == true"
            - "FraxAssessment.${frax_with_id}.threshold_basis == BOTH"
            - "FraxAssessment.${frax_without_id}.variant == WITHOUT_BMD"
            - "FraxAssessment.${frax_without_id}.bmd_points == 0.00"
            - "FraxAssessment.${frax_without_id}.raw_score == 2.30"
            - "FraxAssessment.${frax_without_id}.major_osteoporotic_10yr_pct == 16.8"
            - "FraxAssessment.${frax_without_id}.hip_fracture_10yr_pct == 4.1"
            - "FraxAssessment.${frax_without_id}.treatment_threshold_met == true"
            - "FraxAssessment.${frax_without_id}.threshold_basis == HIP"
            - "FraxAssessment.${frax_with_id}.major_osteoporotic_10yr_pct - FraxAssessment.${frax_without_id}.major_osteoporotic_10yr_pct == 14.4"
      - name: mpr_claims_only_versus_all_sources_weighted_flips_adherence_status
        grounds:
          - calculations.medication_possession_ratio
          - entities.TreatmentPlan.fields.adherence_source_policy
          - entities.TreatmentPlan.fields.medication_possession_ratio
          - entities.TreatmentPlan.fields.adherence_status
          - entities.AdherenceRefill.fields.source_weight
          - state_machines.TreatmentPlan.INITIATED_to_ON_THERAPY
          - endpoints["POST /bone-density/treatment-plans/{id}/adherence-review"]
        distinguishing_aspect: |
          The divergence lives on TreatmentPlan adherence, a different entity domain from the
          FraxAssessment risk instance: two plans holding byte-identical AdherenceRefill rows over the
          same 91-day window produce medication_possession_ratio 0.659 / PARTIAL under CLAIMS_ONLY and
          0.824 / ADHERENT under ALL_SOURCES_WEIGHTED, because the 30-day PATIENT_REPORT refill is
          dropped entirely by one variant and weighted 0.5 by the other.
        test_recipe:
          setup:
            - "The full baseline chain of the frax instance, carried through to a FINALIZED DiagnosticReport whose recommended_action is INITIATE_TREATMENT."
            - "Logical clock at 2026-06-15T08:00:00Z when the refills are recorded and 2026-07-01T08:00:00Z at review time."
            - "Two TreatmentPlan rows for the same patient, both BISPHOSPHONATE_ORAL (followup_interval_months 3) starting 2026-04-01, one CLAIMS_ONLY and one ALL_SOURCES_WEIGHTED."
            - "Each plan carries the same three refills: 30 PHARMACY_CLAIM days dispensed 2026-04-01, 30 PHARMACY_CLAIM days dispensed 2026-05-01, and 30 PATIENT_REPORT days dispensed 2026-06-01."
          setup_api_calls:
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: ProgramAdmin
