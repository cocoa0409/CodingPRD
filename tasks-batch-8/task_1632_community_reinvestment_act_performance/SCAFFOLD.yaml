# =============================================================================
# SCAFFOLD.yaml — Community Reinvestment Act (CRA) Performance Management
# §1.0–§1.7 seed tables. Difficulty design (§1.8) and corner design (§1.9)
# live in SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Community Reinvestment Act Performance Management (bank CRA officer): assessment
  area delineation & demographic analysis, lending/investment/service test data
  tracking, community development activity qualification & documentation, small
  business/farm loan reporting, branch distribution & access analysis, public file
  maintenance & comment handling, exam preparation & performance context narrative,
  rating impact on expansion applications

domain_name: cra-performance-management
api_prefix: /cra

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: AssessmentArea
    parent: null
    common_fields: true
    fields:
      - { name: area_code, type: string, source: input, description: "Bank-internal unique code for the assessment area", constraints: "unique across all assessment areas (ERR_DUPLICATE_AREA_CODE)" }
      - { name: name, type: string, source: input, description: "Display name of the assessment area" }
      - { name: msa_code, type: string, source: input, description: "Metropolitan statistical area code the area sits in; period-overlap checks are scoped per msa_code" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code" }
      - { name: census_tracts, type: array, source: input, description: "Array of census tract id strings delineating the area; editable only while status is DRAFT or UNDER_REVIEW; must be non-empty at activation" }
      - { name: effective_start_date, type: string, source: input, description: "ISO date the delineation takes effect; half-open window start" }
      - { name: effective_end_date, type: string, source: system, description: "ISO date the area was retired; null while not RETIRED; half-open window end (exclusive)" }
      - { name: annual_cd_budget_cents, type: integer, source: input, description: "Annual community-development dollar budget (>= 0) that caps qualified CD amounts per calendar year" }
      - { name: confirmed_loan_count, type: integer, source: computed, description: "Count of LoanRecords with assessment_area_id = this area and status IN {CONFIRMED, REPORTED}; recomputed on every loan confirm/return-to-draft/mark-reported", default: 0 }
      - { name: qualified_cd_total_cents, type: integer, source: computed, description: "Sum of qualified_amount_cents over CommunityDevelopmentActivity rows with assessment_area_id = this area and status QUALIFIED (all years); recomputed on every review-decision", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | UNDER_REVIEW | RETIRED" }

  - name: DemographicProfile
    parent: null
    common_fields: true
    fields:
      - { name: assessment_area_id, type: string, source: input, description: "FK -> AssessmentArea.id; profile describes this area" }
      - { name: data_year, type: integer, source: input, description: "Census data vintage year; a newer POST for the same (assessment_area_id, data_year) supersedes the prior CURRENT profile" }
      - { name: total_tracts, type: integer, source: input, description: "Total census tracts in the area per the data source (>= 0)" }
      - { name: low_income_tracts, type: integer, source: input, description: "Count of low-income tracts (>= 0)" }
      - { name: moderate_income_tracts, type: integer, source: input, description: "Count of moderate-income tracts (>= 0)" }
      - { name: total_population, type: integer, source: input, description: "Total population of the area (>= 0)" }
      - { name: lmi_population, type: integer, source: input, description: "Low- and moderate-income population (>= 0, <= total_population)" }
      - { name: median_family_income, type: integer, source: input, description: "Median family income in whole dollars (>= 0)" }
      - { name: lmi_population_pct, type: number, source: computed, description: "round_half_up(lmi_population / total_population, 4); 0 when total_population == 0" }
      - { name: lmi_tract_pct, type: number, source: computed, description: "round_half_up((low_income_tracts + moderate_income_tracts) / total_tracts, 4); 0 when total_tracts == 0" }
      - { name: status, type: enum, source: system, description: "CURRENT | SUPERSEDED" }

  - name: LoanRecord
    parent: null
    common_fields: true
    fields:
      - { name: assessment_area_id, type: string, source: input, description: "FK -> AssessmentArea.id; CRA-reportable loan booked in this area" }
      - { name: loan_type, type: enum, source: input, description: "SMALL_BUSINESS | SMALL_FARM" }
      - { name: loan_amount_cents, type: integer, source: input, description: "Original loan amount in cents (> 0)" }
      - { name: borrower_gross_annual_revenue_cents, type: integer, source: input, description: "Borrower gross annual revenue in cents (>= 0)" }
      - { name: action_date, type: string, source: input, description: "ISO date of origination; determines reporting_year and exam-window membership" }
      - { name: census_tract, type: string, source: input, description: "Census tract id of the borrower location" }
      - { name: tract_income_level, type: enum, source: input, description: "LOW | MODERATE | MIDDLE | UPPER — income classification of census_tract" }
      - { name: inside_assessment_area, type: boolean, source: computed, description: "Live-derived: census_tract is an element of the referenced AssessmentArea.census_tracts at read time" }
      - { name: small_revenue_flag, type: boolean, source: computed, description: "true iff borrower_gross_annual_revenue_cents <= 100000000 ($1MM gross-annual-revenue threshold, inclusive)" }
      - { name: lmi_geography_flag, type: boolean, source: computed, description: "true iff tract_income_level IN {LOW, MODERATE}" }
      - { name: reporting_year, type: integer, source: computed, description: "Four-digit calendar year of action_date" }
      - { name: status, type: enum, source: system, description: "DRAFT | CONFIRMED | REPORTED" }

  - name: CommunityDevelopmentActivity
    parent: null
    common_fields: true
    fields:
      - { name: assessment_area_id, type: string, source: input, description: "FK -> AssessmentArea.id; activity benefits this area" }
      - { name: activity_type, type: enum, source: input, description: "CD_LOAN | QUALIFIED_INVESTMENT | CD_SERVICE" }
      - { name: amount_cents, type: integer, source: input, description: "Dollar amount (or dollar value of services) in cents (> 0)" }
      - { name: primary_purpose_category, type: enum, source: input, description: "AFFORDABLE_HOUSING | COMMUNITY_SERVICES_LMI | ECONOMIC_DEVELOPMENT | REVITALIZATION_STABILIZATION" }
      - { name: lmi_benefit_pct, type: number, source: input, description: "Share of benefit flowing to LMI persons/geographies, 0..1 inclusive" }
      - { name: activity_date, type: string, source: input, description: "ISO date the activity was funded/performed; calendar year of this date scopes the CD budget check" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceAnalyst who created the activity; used for segregation-of-duties" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the QualificationReviewer who last decided; null until first review" }
      - { name: disqualify_reason, type: string, source: system, description: "Reviewer-supplied reason when decision=DISQUALIFY; null otherwise" }
      - { name: allocation_method, type: enum, source: system, description: "FULL_COUNT | PRO_RATA — set at qualification; null until QUALIFIED" }
      - { name: qualified_amount_cents, type: integer, source: computed, description: "0 unless status == QUALIFIED; FULL_COUNT -> amount_cents; PRO_RATA -> round_half_up(amount_cents * lmi_benefit_pct) to whole cents" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | QUALIFIED | DISQUALIFIED" }

  - name: Branch
    parent: null
    common_fields: true
    fields:
      - { name: branch_code, type: string, source: input, description: "Bank-internal unique branch code", constraints: "unique across all branches" }
      - { name: assessment_area_id, type: string, source: input, description: "FK -> AssessmentArea.id; branch operates in this area" }
      - { name: census_tract, type: string, source: input, description: "Census tract id of the branch site" }
      - { name: tract_income_level, type: enum, source: input, description: "LOW | MODERATE | MIDDLE | UPPER" }
      - { name: expansion_application_id, type: string, source: system, description: "FK -> ExpansionApplication.id; non-null when the branch was staged by a BRANCH_OPENING application submission, null for directly created branches" }
      - { name: opened_date, type: string, source: system, description: "ISO date set when status becomes OPEN; null until opened" }
      - { name: closed_date, type: string, source: system, description: "ISO date (logical clock) set when status becomes CLOSED; null until closed" }
      - { name: notice_posted_date, type: string, source: system, description: "ISO date of public closure notice supplied at close; null until closed" }
      - { name: status, type: enum, source: system, description: "PROPOSED | OPEN | CLOSED | WITHDRAWN" }

  - name: PublicComment
    parent: null
    common_fields: true
    fields:
      - { name: commenter_name, type: string, source: input, description: "Name of the member of the public submitting the comment" }
      - { name: channel, type: enum, source: input, description: "WRITTEN_LETTER | EMAIL | PUBLIC_MEETING" }
      - { name: subject_area, type: enum, source: input, description: "LENDING | INVESTMENT | SERVICE | BRANCH_ACCESS | OTHER" }
      - { name: content, type: string, source: input, description: "Verbatim comment text" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp at creation" }
      - { name: response_text, type: string, source: system, description: "Bank response text; null until RESPONDED" }
      - { name: status, type: enum, source: system, description: "RECEIVED | PUBLISHED | RESPONDED" }

  - name: PublicFile
    parent: null
    common_fields: true
    fields:
      - { name: bank_name, type: string, source: input, description: "Legal name of the bank; exactly one PublicFile may exist (ERR_PUBLIC_FILE_EXISTS)" }
      - { name: branch_list_current, type: boolean, source: system, description: "true when the public file's branch list reflects all OPEN/CLOSED transitions; set false by branch open/close cascades; set true via refresh-items", default: true }
      - { name: aa_list_current, type: boolean, source: system, description: "true when the public file's assessment-area list reflects the latest delineation changes; set false by area activate/complete-review/retire cascades; set true via refresh-items", default: true }
      - { name: disclosure_statement_present, type: boolean, source: system, description: "true once the CRA disclosure statement has been placed in the file via refresh-items", default: false }
      - { name: pending_comment_count, type: integer, source: computed, description: "Count of PublicComments in status RECEIVED; incremented on comment creation, decremented on publish", default: 0 }
      - { name: posture, type: enum, source: computed, description: "COMPLETE iff branch_list_current AND aa_list_current AND disclosure_statement_present AND pending_comment_count == 0; else INCOMPLETE" }

  - name: ExamCycle
    parent: null
    common_fields: true
    fields:
      - { name: exam_type, type: enum, source: input, description: "LARGE_BANK | INTERMEDIATE_SMALL_BANK" }
      - { name: evaluation_window_start, type: string, source: input, description: "ISO date, closed-interval start of the evaluation window" }
      - { name: evaluation_window_end, type: string, source: input, description: "ISO date, closed-interval end; must be >= evaluation_window_start; windows may not share any date with another exam (ERR_EXAM_WINDOW_OVERLAP)" }
      - { name: performance_context_narrative, type: string, source: input, description: "Bank-prepared performance context narrative; editable while status IN {SCHEDULED, DATA_COLLECTION, FIELDWORK}", default: "" }
      - { name: lending_test_rating, type: enum, source: input, description: "OUTSTANDING | SATISFACTORY | NEEDS_TO_IMPROVE | SUBSTANTIAL_NONCOMPLIANCE — set at assign-preliminary-rating" }
      - { name: investment_test_rating, type: enum, source: input, description: "Same enum; set at assign-preliminary-rating" }
      - { name: service_test_rating, type: enum, source: input, description: "Same enum; set at assign-preliminary-rating" }
      - { name: composite_points, type: number, source: computed, description: "round_half_up(0.5*L + 0.25*I + 0.25*S, 2) using points {OUTSTANDING:10, SATISFACTORY:6, NEEDS_TO_IMPROVE:2, SUBSTANTIAL_NONCOMPLIANCE:0}" }
      - { name: composite_rating, type: enum, source: computed, description: "OUTSTANDING iff composite_points >= 8.50; SATISFACTORY iff >= 5.00; NEEDS_TO_IMPROVE iff >= 2.50; else SUBSTANTIAL_NONCOMPLIANCE" }
      - { name: appeal_reason, type: string, source: system, description: "Reason recorded on appeal; null unless appealed" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DATA_COLLECTION | FIELDWORK | PRELIMINARY_RATING | APPEALED | FINALIZED" }

  - name: ExpansionApplication
    parent: null
    common_fields: true
    fields:
      - { name: application_type, type: enum, source: input, description: "BRANCH_OPENING | BRANCH_CLOSURE | MERGER" }
      - { name: target_assessment_area_id, type: string, source: input, description: "FK -> AssessmentArea.id; area affected by the expansion" }
      - { name: branch_code, type: string, source: input, description: "Required when application_type == BRANCH_OPENING; staged branch's unique code" }
      - { name: branch_census_tract, type: string, source: input, description: "Required when application_type == BRANCH_OPENING" }
      - { name: branch_tract_income_level, type: enum, source: input, description: "LOW | MODERATE | MIDDLE | UPPER; required when application_type == BRANCH_OPENING" }
      - { name: linked_branch_id, type: string, source: system, description: "id of the PROPOSED Branch staged on submit (BRANCH_OPENING only); null otherwise" }
      - { name: decision_reason, type: string, source: system, description: "Recorded at decide or at auto-denial cascade (RATING_BLOCK); null until decided" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | DENIED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AssessmentArea
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /cra/assessment-areas/{id}/activate
        actor: CRAOfficer
        preconditions:
          - "census_tracts non-empty (else ERR_VALIDATION)"
          - "no census_tract overlaps a tract of any other area with status IN {ACTIVE, UNDER_REVIEW} (ERR_TRACT_OVERLAP)"
        side_effects:
          - "If a PublicFile exists: PublicFile.aa_list_current := false, then PublicFile.posture recomputed"
          - "increments AssessmentArea.version by 1"
      - from: ACTIVE
        to: UNDER_REVIEW
        trigger: POST /cra/assessment-areas/{id}/begin-review
        actor: CRAOfficer
        preconditions: []
        side_effects:
          - "increments AssessmentArea.version by 1"
      - from: UNDER_REVIEW
        to: ACTIVE
        trigger: POST /cra/assessment-areas/{id}/complete-review
        actor: CRAOfficer
        preconditions:
          - "census_tracts non-empty (else ERR_VALIDATION)"
          - "no census_tract overlaps a tract of any other area with status IN {ACTIVE, UNDER_REVIEW} (ERR_TRACT_OVERLAP)"
        side_effects:
          - "If a PublicFile exists: PublicFile.aa_list_current := false, then PublicFile.posture recomputed"
          - "increments AssessmentArea.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: POST /cra/assessment-areas/{id}/retire
        actor: CRAOfficer
        preconditions: []
        side_effects:
          - "effective_end_date := logical-clock date (half-open window end, exclusive)"
          - "If a PublicFile exists: PublicFile.aa_list_current := false, then PublicFile.posture recomputed"
          - "increments AssessmentArea.version by 1"
        note: "Cyclic review loop ACTIVE -> UNDER_REVIEW -> ACTIVE is allowed repeatedly."

  - entity: DemographicProfile
    initial_state: CURRENT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: CURRENT
        to: SUPERSEDED
        trigger: "system — POST /cra/assessment-areas/{id}/demographic-profiles with the same (assessment_area_id, data_year) as an existing CURRENT profile"
        actor: system
        preconditions: []
        side_effects:
          - "prior CURRENT profile for that (assessment_area_id, data_year) becomes SUPERSEDED; new profile becomes CURRENT"

  - entity: LoanRecord
    initial_state: DRAFT
    terminal_states: [REPORTED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: POST /cra/loan-records/{id}/confirm
        actor: ComplianceAnalyst
        preconditions:
          - "referenced AssessmentArea.status == ACTIVE (ERR_AREA_NOT_ACTIVE)"
          - "census_tract is an element of AssessmentArea.census_tracts (ERR_TRACT_NOT_IN_AREA)"
        side_effects:
          - "AssessmentArea.confirmed_loan_count recomputed (+1)"
          - "increments LoanRecord.version by 1"
      - from: CONFIRMED
        to: DRAFT
        trigger: POST /cra/loan-records/{id}/return-to-draft
        actor: ComplianceAnalyst
        preconditions: []
        side_effects:
          - "AssessmentArea.confirmed_loan_count recomputed (-1)"
          - "increments LoanRecord.version by 1"
        note: "Correction loop CONFIRMED -> DRAFT -> CONFIRMED is allowed repeatedly."
      - from: CONFIRMED
        to: REPORTED
        trigger: POST /cra/loan-records/{id}/mark-reported
        actor: ComplianceAnalyst
        preconditions: []
        side_effects:
          - "AssessmentArea.confirmed_loan_count unchanged (REPORTED still counts)"
          - "increments LoanRecord.version by 1"

  - entity: CommunityDevelopmentActivity
    initial_state: SUBMITTED
    terminal_states: []
    transitions:
      - from: SUBMITTED
        to: QUALIFIED
        trigger: POST /cra/community-development-activities/{id}/review-decision with decision=QUALIFY
        actor: QualificationReviewer
        preconditions:
          - "X-User-ID != submitted_by_user_id (segregation of duties; ERR_SEGREGATION_OF_DUTIES)"
          - "if allocation_method == FULL_COUNT then lmi_benefit_pct >= 0.51 (ERR_LMI_THRESHOLD_NOT_MET)"
          - "referenced AssessmentArea.status == ACTIVE (ERR_AREA_NOT_ACTIVE)"
          - "sum of qualified_amount_cents over QUALIFIED activities in the same area with activity_date in the same calendar year, plus this activity's qualified_amount_cents, <= AssessmentArea.annual_cd_budget_cents (ERR_CD_BUDGET_EXCEEDED)"
        side_effects:
          - "qualified_amount_cents computed per calculation activity_qualified_amount"
          - "reviewed_by_user_id := X-User-ID; allocation_method recorded"
          - "AssessmentArea.qualified_cd_total_cents recomputed"
          - "increments CommunityDevelopmentActivity.version by 1"
      - from: SUBMITTED
        to: DISQUALIFIED
        trigger: POST /cra/community-development-activities/{id}/review-decision with decision=DISQUALIFY
        actor: QualificationReviewer
        preconditions:
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "disqualify_reason recorded; reviewed_by_user_id := X-User-ID"
          - "increments CommunityDevelopmentActivity.version by 1"
      - from: DISQUALIFIED
        to: SUBMITTED
        trigger: POST /cra/community-development-activities/{id}/resubmit
        actor: ComplianceAnalyst
        preconditions:
          - "referenced AssessmentArea.status == ACTIVE (ERR_AREA_NOT_ACTIVE)"
        side_effects:
          - "disqualify_reason := null; reviewed_by_user_id := null; allocation_method := null; qualified_amount_cents := 0"
          - "increments CommunityDevelopmentActivity.version by 1"
        note: "Resubmission loop DISQUALIFIED -> SUBMITTED -> QUALIFIED/DISQUALIFIED is allowed repeatedly."

  - entity: Branch
    initial_state: PROPOSED
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: OPEN
        trigger: POST /cra/branches/{id}/open
        actor: BankExecutive
        preconditions:
          - "if expansion_application_id is non-null, the referenced ExpansionApplication.status == APPROVED (ERR_APPLICATION_NOT_APPROVED)"
        side_effects:
          - "opened_date := logical-clock date"
          - "If a PublicFile exists: PublicFile.branch_list_current := false, then PublicFile.posture recomputed"
          - "increments Branch.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: POST /cra/branches/{id}/close
        actor: BankExecutive
        preconditions:
          - "(logical-clock date - notice_posted_date) >= 90 days (ERR_CLOSURE_NOTICE_SHORT)"
        side_effects:
          - "closed_date := logical-clock date; notice_posted_date recorded"
          - "PublicFile.branch_list_current := false (no-op if no PublicFile exists)"
          - "PublicFile.posture recomputed (COMPLETE -> INCOMPLETE when other items unchanged)"
          - "increments Branch.version by 1"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "system — linked ExpansionApplication transitions SUBMITTED -> DENIED (examiner decision or exam-finalize cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Branch.version by 1"

  - entity: PublicComment
    initial_state: RECEIVED
    terminal_states: [RESPONDED]
    transitions:
      - from: RECEIVED
        to: PUBLISHED
        trigger: POST /cra/public-comments/{id}/publish
        actor: CRAOfficer
        preconditions: []
        side_effects:
          - "If a PublicFile exists: PublicFile.pending_comment_count -= 1, then PublicFile.posture recomputed"
          - "increments PublicComment.version by 1"
      - from: PUBLISHED
        to: RESPONDED
        trigger: POST /cra/public-comments/{id}/respond
        actor: CRAOfficer
        preconditions: []
        side_effects:
          - "response_text recorded"
          - "increments PublicComment.version by 1"
    note: "Comment creation itself cascades: if a PublicFile exists, pending_comment_count += 1 and posture is recomputed."

  - entity: ExamCycle
    initial_state: SCHEDULED
    terminal_states: [FINALIZED]
    transitions:
      - from: SCHEDULED
        to: DATA_COLLECTION
        trigger: POST /cra/exam-cycles/{id}/begin-data-collection
        actor: BankExaminer
        preconditions: []
        side_effects:
          - "increments ExamCycle.version by 1"
      - from: DATA_COLLECTION
        to: FIELDWORK
        trigger: POST /cra/exam-cycles/{id}/begin-fieldwork
        actor: BankExaminer
        preconditions:
          - "the singleton PublicFile exists and PublicFile.posture == COMPLETE (ERR_PUBLIC_FILE_INCOMPLETE)"
        side_effects:
          - "increments ExamCycle.version by 1"
      - from: FIELDWORK
        to: PRELIMINARY_RATING
        trigger: POST /cra/exam-cycles/{id}/assign-preliminary-rating
        actor: BankExaminer
        preconditions: []
        side_effects:
          - "composite_points and composite_rating computed per calculation exam_composite_rating"
          - "increments ExamCycle.version by 1"
      - from: PRELIMINARY_RATING
        to: FINALIZED
        trigger: POST /cra/exam-cycles/{id}/finalize
        actor: BankExaminer
        preconditions: []
        side_effects:
          - "if composite_rating IN {NEEDS_TO_IMPROVE, SUBSTANTIAL_NONCOMPLIANCE}: every ExpansionApplication with status == SUBMITTED transitions to DENIED with decision_reason RATING_BLOCK"
          - "each such auto-denied ExpansionApplication with linked_branch_id non-null causes that Branch (status PROPOSED) to transition to WITHDRAWN"
          - "increments ExamCycle.version by 1"
        note: "Cascade chain: finalize -> application DENIED -> staged Branch WITHDRAWN (depth 3)."
      - from: PRELIMINARY_RATING
        to: APPEALED
        trigger: POST /cra/exam-cycles/{id}/appeal
        actor: CRAOfficer
        preconditions: []
        side_effects:
          - "appeal_reason recorded"
          - "increments ExamCycle.version by 1"
      - from: APPEALED
        to: FIELDWORK
        trigger: POST /cra/exam-cycles/{id}/reopen-fieldwork
        actor: BankExaminer
        preconditions: []
        side_effects:
          - "increments ExamCycle.version by 1"
        note: "Appeal cycle PRELIMINARY_RATING -> APPEALED -> FIELDWORK -> PRELIMINARY_RATING is allowed repeatedly; composite is recomputed on each assign-preliminary-rating."

  - entity: ExpansionApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /cra/expansion-applications/{id}/submit
        actor: BankExecutive
        preconditions:
          - "if any ExamCycle has status FINALIZED, the latest of them (max evaluation_window_end; tie-break: latest created_at) has composite_rating IN {OUTSTANDING, SATISFACTORY} (ERR_RATING_BLOCKS_EXPANSION)"
        side_effects:
          - "if application_type == BRANCH_OPENING: a Branch is created with status PROPOSED, expansion_application_id := this application, branch_code/census_tract/tract_income_level/assessment_area_id copied from the application; linked_branch_id := new Branch.id"
          - "increments ExpansionApplication.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: POST /cra/expansion-applications/{id}/decide with decision=APPROVE
        actor: BankExaminer
        preconditions: []
        side_effects:
          - "decision_reason recorded"
          - "increments ExpansionApplication.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: POST /cra/expansion-applications/{id}/decide with decision=DENY
        actor: BankExaminer
        preconditions: []
        side_effects:
          - "decision_reason recorded"
          - "if linked_branch_id non-null and that Branch.status == PROPOSED: Branch -> WITHDRAWN"
          - "increments ExpansionApplication.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: demographic-profile-create-stale-area
    parent_entity: AssessmentArea
    write_endpoint: "POST /cra/assessment-areas/{id}/demographic-profiles"
    occ_field: expected_assessment_area_version
    description: |
      Creating a DemographicProfile against an AssessmentArea whose version has
      advanced since the client last observed it is rejected. A prior successful
      profile creation (or any other area mutation) bumps the area version, so a
      second create carrying the earlier expected version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: assessment-area-patch-stale-version
    parent_entity: AssessmentArea
    write_endpoint: "PATCH /cra/assessment-areas/{id}"
    occ_field: expected_assessment_area_version
    description: |
      Updating an AssessmentArea (name or census_tracts) with an
      expected_assessment_area_version that no longer matches the area's current
      version is rejected; the client must re-read the area and retry.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: activity_qualified_amount
    description: "Qualified dollar amount of a community development activity at qualification time"
    trigger: "POST /cra/community-development-activities/{id}/review-decision with decision=QUALIFY"
    algorithm: threshold
    formula: |
      if allocation_method == FULL_COUNT:
          qualified_amount_cents = amount_cents
      else:  # PRO_RATA
          qualified_amount_cents = round_half_up(amount_cents * lmi_benefit_pct) to whole cents
    input_set: "the single CommunityDevelopmentActivity being qualified"
    constants:
      FULL_COUNT_LMI_THRESHOLD: 0.51
    precision: "whole cents, round_half_up"
    variants:
      - name: FULL_COUNT
        when: "reviewer selects allocation_method=FULL_COUNT; requires lmi_benefit_pct >= 0.51"
        difference: "entire amount_cents counts as qualified"
      - name: PRO_RATA
        when: "reviewer selects allocation_method=PRO_RATA; always allowed"
        difference: "only the LMI-benefit share counts; identical inputs yield a strictly smaller qualified amount whenever 0 < lmi_benefit_pct < 1"

  - name: lending_test_metrics
    description: "Lending-test penetration metrics over loan records in an exam's evaluation window"
    trigger: "GET /cra/exam-cycles/{id}/lending-metrics"
    algorithm: aggregation
    formula: |
      window = closed interval [evaluation_window_start, evaluation_window_end] on action_date
      loans = LoanRecords with action_date in window AND status filter per basis
      loan_count = len(loans)
      inside_aa_pct        = round_half_up(count(inside_assessment_area) / loan_count, 4)   (0 when loan_count == 0)
      lmi_geography_pct    = round_half_up(count(lmi_geography_flag) / loan_count, 4)        (0 when loan_count == 0)
      lmi_borrower_pct     = round_half_up(count(small_revenue_flag) / loan_count, 4)        (0 when loan_count == 0)
    input_set: "basis=CURRENT: status IN {CONFIRMED, REPORTED}; basis=SNAPSHOT: status == REPORTED"
    constants: {}
    precision: "4 decimal places, round_half_up"
    variants:
      - name: SNAPSHOT
        when: "basis=SNAPSHOT — the as-reported register view used for official CRA submission"
        difference: "includes only REPORTED loans; excludes CONFIRMED-not-yet-reported loans"
      - name: CURRENT
        when: "basis=CURRENT (default) — the examiner's working view during fieldwork"
        difference: "includes CONFIRMED and REPORTED loans; identical window yields larger denominators and different percentages whenever any loan is CONFIRMED but not REPORTED"

  - name: loan_register_report_totals
    description: "Annual CRA small-business / small-farm register totals with pinned rounding order"
    trigger: "GET /cra/exam-cycles/{id}/lending-metrics (register fields of the response)"
    algorithm: aggregation
    formula: |
      for each REPORTED LoanRecord with action_date in the closed evaluation window, grouped by loan_type:
          capped_cents   = min(loan_amount_cents, 100000000)          # $1MM CRA reportable cap
          rounded_cents  = round_half_up(capped_cents / 100000) * 100000   # round EACH loan to nearest $1,000 FIRST
      register_total_cents = sum(rounded_cents)                       # THEN sum; never sum-then-round
    input_set: "status == REPORTED only, action_date within closed exam window, per loan_type"
    constants:
      CRA_REPORTABLE_CAP_CENTS: 100000000
      ROUND_UNIT_CENTS: 100000
    precision: "whole cents; per-loan round_half_up to $1,000 units, then sum (order pinned)"
    variants: []

  - name: exam_composite_rating
    description: "Composite CRA rating from the three test ratings"
    trigger: "POST /cra/exam-cycles/{id}/assign-preliminary-rating (recomputed again only via appeal cycle re-assignment)"
    algorithm: threshold
    formula: |
      points = {OUTSTANDING: 10, SATISFACTORY: 6, NEEDS_TO_IMPROVE: 2, SUBSTANTIAL_NONCOMPLIANCE: 0}
      composite_points = round_half_up(0.5*points[lending] + 0.25*points[investment] + 0.25*points[service], 2)
      composite_rating = OUTSTANDING             if composite_points >= 8.50
                         SATISFACTORY            if composite_points >= 5.00
                         NEEDS_TO_IMPROVE        if composite_points >= 2.50
                         SUBSTANTIAL_NONCOMPLIANCE otherwise
    input_set: "the three test ratings supplied in the request"
    constants:
      W_LENDING: 0.5
      W_INVESTMENT: 0.25
      W_SERVICE: 0.25
      BAND_OUTSTANDING: 8.50
      BAND_SATISFACTORY: 5.00
      BAND_NEEDS_TO_IMPROVE: 2.50
    precision: "2 decimal places, round_half_up; band boundaries are inclusive (>="
    variants: []

  - name: branch_access_score
    description: "Branch distribution & access score for an assessment area"
    trigger: "GET /cra/assessment-areas/{id}/access-analysis"
    algorithm: threshold
    formula: |
      open_branches = Branches with assessment_area_id = area AND status == OPEN
      if len(open_branches) == 0: access_score = 0; lmi_branch_pct = 0
      else:
          lmi_branch_pct = round_half_up(count(tract_income_level IN {LOW, MODERATE}) / len(open_branches), 4)
      benchmark = lmi_tract_pct of the area's CURRENT DemographicProfile with the max data_year (0 when none exists)
      lmi_closures_12m = count of Branches in this area with status == CLOSED,
                         tract_income_level IN {LOW, MODERATE},
                         and closed_date within (logical_clock_date - 365 days, logical_clock_date]
      raw = 50 + 100*(lmi_branch_pct - benchmark) - 5*lmi_closures_12m
      access_score = max(0, min(100, round_half_up(raw, 2)))
    input_set: "OPEN branches of the area; CURRENT DemographicProfile with max data_year; CLOSED LMI branches in trailing 365-day window"
    constants:
      BASE_SCORE: 50
      DISPERSION_WEIGHT: 100
      LMI_CLOSURE_PENALTY: 5
      SCORE_FLOOR: 0
      SCORE_CEILING: 100
    precision: "lmi_branch_pct 4 dp round_half_up; access_score 2 dp round_half_up with floor/ceiling"
    variants: []

  - name: demographic_pct
    description: "LMI population and tract percentages on a DemographicProfile"
    trigger: "POST /cra/assessment-areas/{id}/demographic-profiles (at creation)"
    algorithm: aggregation
    formula: |
      lmi_population_pct = round_half_up(lmi_population / total_population, 4)   (0 when total_population == 0)
      lmi_tract_pct      = round_half_up((low_income_tracts + moderate_income_tracts) / total_tracts, 4)   (0 when total_tracts == 0)
    input_set: "the single DemographicProfile being created"
    constants: {}
    precision: "4 decimal places, round_half_up"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role is permitted for this endpoint per RBAC", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "every path-template id resolves to an existing resource, validated left-to-right", error_id: ERR_ASSESSMENT_AREA_NOT_FOUND, http_status: 404, applies_to: "endpoints under /cra/assessment-areas/{id}" }
  - { priority: 3, category: existence, check: "loan record id exists", error_id: ERR_LOAN_RECORD_NOT_FOUND, http_status: 404, applies_to: "/cra/loan-records/{id}/*" }
  - { priority: 3, category: existence, check: "activity id exists", error_id: ERR_ACTIVITY_NOT_FOUND, http_status: 404, applies_to: "/cra/community-development-activities/{id}/*" }
  - { priority: 3, category: existence, check: "branch id exists", error_id: ERR_BRANCH_NOT_FOUND, http_status: 404, applies_to: "/cra/branches/{id}/*" }
  - { priority: 3, category: existence, check: "comment id exists", error_id: ERR_PUBLIC_COMMENT_NOT_FOUND, http_status: 404, applies_to: "/cra/public-comments/{id}/*" }
  - { priority: 3, category: existence, check: "public file id exists", error_id: ERR_PUBLIC_FILE_NOT_FOUND, http_status: 404, applies_to: "/cra/public-files/{id}*" }
  - { priority: 3, category: existence, check: "exam cycle id exists", error_id: ERR_EXAM_CYCLE_NOT_FOUND, http_status: 404, applies_to: "/cra/exam-cycles/{id}*" }
  - { priority: 3, category: existence, check: "application id exists", error_id: ERR_APPLICATION_NOT_FOUND, http_status: 404, applies_to: "/cra/expansion-applications/{id}*" }
  - { priority: 3, category: existence, check: "malformed body, missing required field, invalid enum value, non-positive amount, lmi_benefit_pct outside 0..1, lmi_population > total_population", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 4, category: state, check: "target resource is in a from-state that names this trigger per §1.2 (covers wrong-from transitions and terminal-state lockdown)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 5, category: business_safety, check: "review-decision: X-User-ID != submitted_by_user_id (segregation of duties)", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 422, applies_to: "POST /cra/community-development-activities/{id}/review-decision" }
  - { priority: 5, category: business_safety, check: "begin-fieldwork: singleton PublicFile exists and posture == COMPLETE", error_id: ERR_PUBLIC_FILE_INCOMPLETE, http_status: 422, applies_to: "POST /cra/exam-cycles/{id}/begin-fieldwork" }
  - { priority: 5, category: business_safety, check: "submit: latest FINALIZED exam (max evaluation_window_end, tie-break latest created_at) has composite_rating IN {OUTSTANDING, SATISFACTORY}", error_id: ERR_RATING_BLOCKS_EXPANSION, http_status: 422, applies_to: "POST /cra/expansion-applications/{id}/submit" }
  - { priority: 6, category: business_constraint, check: "POST /cra/assessment-areas: area_code unique; effective window does not overlap another area with the same msa_code under half-open [start, end) semantics (RETIRED areas use effective_end_date; non-retired areas are open-ended)", error_id: ERR_DUPLICATE_AREA_CODE, http_status: 409, applies_to: "POST /cra/assessment-areas" }
  - { priority: 6, category: business_constraint, check: "assessment-area effective-period overlap, half-open semantics: new area's [effective_start_date, effective_end_date) may not intersect another same-msa_code area's window; adjacency (new start == existing end) is allowed", error_id: ERR_AREA_PERIOD_OVERLAP, http_status: 409, applies_to: "POST /cra/assessment-areas" }
  - { priority: 6, category: business_constraint, check: "census tract exclusivity: no tract may appear in two areas whose status IN {ACTIVE, UNDER_REVIEW}; checked on PATCH, activate, complete-review", error_id: ERR_TRACT_OVERLAP, http_status: 409, applies_to: "PATCH /cra/assessment-areas/{id}, POST /cra/assessment-areas/{id}/activate, POST /cra/assessment-areas/{id}/complete-review" }
  - { priority: 6, category: business_constraint, check: "exam evaluation windows may not share any calendar date (closed-interval semantics); checked against all existing exams regardless of status", error_id: ERR_EXAM_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /cra/exam-cycles" }
  - { priority: 6, category: business_constraint, check: "review-decision: allocation_method=FULL_COUNT requires lmi_benefit_pct >= 0.51", error_id: ERR_LMI_THRESHOLD_NOT_MET, http_status: 422, applies_to: "POST /cra/community-development-activities/{id}/review-decision" }
  - { priority: 6, category: business_constraint, check: "only one PublicFile may exist", error_id: ERR_PUBLIC_FILE_EXISTS, http_status: 409, applies_to: "POST /cra/public-files" }
  - { priority: 7, category: business_temporal, check: "POST /cra/exam-cycles: evaluation_window_end >= evaluation_window_start", error_id: ERR_INVALID_WINDOW, http_status: 400, applies_to: "POST /cra/exam-cycles" }
  - { priority: 7, category: business_temporal, check: "branch close: (logical-clock date - notice_posted_date) >= 90 days", error_id: ERR_CLOSURE_NOTICE_SHORT, http_status: 422, applies_to: "POST /cra/branches/{id}/close" }
  - { priority: 8, category: business_referential, check: "referenced AssessmentArea.status == ACTIVE", error_id: ERR_AREA_NOT_ACTIVE, http_status: 422, applies_to: "POST /cra/loan-records/{id}/confirm, POST /cra/community-development-activities/{id}/review-decision, POST /cra/community-development-activities/{id}/resubmit" }
  - { priority: 8, category: business_referential, check: "loan confirm: census_tract is an element of the referenced area's census_tracts", error_id: ERR_TRACT_NOT_IN_AREA, http_status: 422, applies_to: "POST /cra/loan-records/{id}/confirm" }
  - { priority: 8, category: business_referential, check: "branch open: non-null expansion_application_id requires referenced application status == APPROVED", error_id: ERR_APPLICATION_NOT_APPROVED, http_status: 422, applies_to: "POST /cra/branches/{id}/open" }
  - { priority: 9, category: business_fiscal, check: "review-decision QUALIFY: same-area same-calendar-year qualified total + this activity's qualified_amount_cents <= AssessmentArea.annual_cd_budget_cents", error_id: ERR_CD_BUDGET_EXCEEDED, http_status: 422, applies_to: "POST /cra/community-development-activities/{id}/review-decision" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/cra/assessment-areas", description: "Create an assessment area in DRAFT", roles: [CRAOfficer], code: 201, input: [area_code, name, msa_code, state_code, census_tracts, effective_start_date, annual_cd_budget_cents], output: AssessmentArea, side_effects: ["status DRAFT; version 1"] }
  - { method: GET, path: "/cra/assessment-areas/{id}", description: "Read one assessment area", roles: [CRAOfficer, ComplianceAnalyst, QualificationReviewer, BankExaminer, BankExecutive, PlatformAdmin], code: 200, input: [], output: AssessmentArea, side_effects: [] }
  - { method: PATCH, path: "/cra/assessment-areas/{id}", description: "Edit name and/or census_tracts (state must be DRAFT or UNDER_REVIEW); OCC-guarded", roles: [CRAOfficer], code: 200, input: [expected_assessment_area_version, "name?", "census_tracts?"], output: AssessmentArea, side_effects: ["tract exclusivity re-checked (ERR_TRACT_OVERLAP)", "increments AssessmentArea.version by 1"] }
  - { method: POST, path: "/cra/assessment-areas/{id}/activate", description: "DRAFT -> ACTIVE", roles: [CRAOfficer], code: 200, input: [], output: AssessmentArea, side_effects: ["PublicFile.aa_list_current := false + posture recompute (if file exists)"] }
  - { method: POST, path: "/cra/assessment-areas/{id}/begin-review", description: "ACTIVE -> UNDER_REVIEW", roles: [CRAOfficer], code: 200, input: [], output: AssessmentArea, side_effects: [] }
  - { method: POST, path: "/cra/assessment-areas/{id}/complete-review", description: "UNDER_REVIEW -> ACTIVE", roles: [CRAOfficer], code: 200, input: [], output: AssessmentArea, side_effects: ["PublicFile.aa_list_current := false + posture recompute (if file exists)"] }
  - { method: POST, path: "/cra/assessment-areas/{id}/retire", description: "ACTIVE -> RETIRED; sets effective_end_date from logical clock", roles: [CRAOfficer], code: 200, input: [], output: AssessmentArea, side_effects: ["PublicFile.aa_list_current := false + posture recompute (if file exists)"] }
  - { method: POST, path: "/cra/assessment-areas/{id}/demographic-profiles", description: "Create a demographic profile for the area; same (area, data_year) supersedes the prior CURRENT profile; OCC-guarded on the area version", roles: [CRAOfficer], code: 201, input: [expected_assessment_area_version, data_year, total_tracts, low_income_tracts, moderate_income_tracts, total_population, lmi_population, median_family_income], output: DemographicProfile, side_effects: ["prior CURRENT profile for same (area, data_year) -> SUPERSEDED", "lmi_population_pct and lmi_tract_pct computed", "increments AssessmentArea.version by 1"] }
  - { method: GET, path: "/cra/assessment-areas/{id}/demographic-profiles", description: "List profiles of an area (both CURRENT and SUPERSEDED)", roles: [CRAOfficer, ComplianceAnalyst, QualificationReviewer, BankExaminer, BankExecutive, PlatformAdmin], code: 200, input: ["status?", "data_year?", "limit?", "offset?"], output: "DemographicProfile[]", side_effects: [] }
  - { method: GET, path: "/cra/assessment-areas/{id}/access-analysis", description: "Computed branch distribution & access analysis for the area", roles: [CRAOfficer, ComplianceAnalyst, QualificationReviewer, BankExaminer, BankExecutive, PlatformAdmin], code: 200, input: [], output: "{ open_branch_count: integer, lmi_branch_pct: number, benchmark_lmi_tract_pct: number, lmi_closures_12m: integer, access_score: number }", side_effects: ["runs calculation branch_access_score"] }
  - { method: GET, path: "/cra/assessment-areas/{id}/loan-records", description: "List loan records of an area", roles: [CRAOfficer, ComplianceAnalyst, QualificationReviewer, BankExaminer, BankExecutive, PlatformAdmin], code: 200, input: ["status?", "reporting_year?", "loan_type?", "limit?", "offset?"], output: "LoanRecord[]", side_effects: [] }
  - { method: GET, path: "/cra/assessment-areas/{id}/community-development-activities", description: "List CD activities of an area", roles: [CRAOfficer, ComplianceAnalyst, QualificationReviewer, BankExaminer, BankExecutive, PlatformAdmin], code: 200, input: ["status?", "activity_type?", "limit?", "offset?"], output: "CommunityDevelopmentActivity[]", side_effects: [] }
  - { method: GET, path: "/cra/assessment-areas/{id}/branches", description: "List branches of an area", roles: [CRAOfficer, ComplianceAnalyst, QualificationReviewer, BankExaminer, BankExecutive, PlatformAdmin], code: 200, input: ["status?", "tract_income_level?", "limit?", "offset?"], output: "Branch[]", side_effects: [] }
  - { method: GET, path: "/cra/assessment-areas/{id}/expansion-applications", description: "List expansion applications targeting an area", roles: [CRAOfficer, ComplianceAnalyst, QualificationReviewer, BankExaminer, BankExecutive, PlatformAdmin], code: 200, input: ["status?", "application_type?", "limit?", "offset?"], output: "ExpansionApplication[]", side_effects: [] }
  - { method: POST, path: "/cra/loan-records", description: "Record a small business/farm loan in DRAFT", roles: [ComplianceAnalyst], code: 201, input: [assessment_area_id, loan_type, loan_amount_cents, borrower_gross_annual_revenue_cents, action_date, census_tract, tract_income_level], output: LoanRecord, side_effects: ["computed flags inside_assessment_area/small_revenue_flag/lmi_geography_flag/reporting_year"] }
  - { method: GET, path: "/cra/loan-records/{id}", description: "Read one loan record", roles: [CRAOfficer, ComplianceAnalyst, QualificationReviewer, BankExaminer, BankExecutive, PlatformAdmin], code: 200, input: [], output: LoanRecord, side_effects: [] }
  - { method: POST, path: "/cra/loan-records/{id}/confirm", description: "DRAFT -> CONFIRMED", roles: [ComplianceAnalyst], code: 200, input: [], output: LoanRecord, side_effects: ["AssessmentArea.confirmed_loan_count recomputed"] }
  - { method: POST, path: "/cra/loan-records/{id}/return-to-draft", description: "CONFIRMED -> DRAFT (correction loop)", roles: [ComplianceAnalyst], code: 200, input: [], output: LoanRecord, side_effects: ["AssessmentArea.confirmed_loan_count recomputed"] }
  - { method: POST, path: "/cra/loan-records/{id}/mark-reported", description: "CONFIRMED -> REPORTED (placed on the CRA register)", roles: [ComplianceAnalyst], code: 200, input: [], output: LoanRecord, side_effects: [] }
  - { method: POST, path: "/cra/community-development-activities", description: "Submit a CD activity (status SUBMITTED); submitter recorded from X-User-ID", roles: [ComplianceAnalyst], code: 201, input: [assessment_area_id, activity_type, amount_cents, primary_purpose_category, lmi_benefit_pct, activity_date], output: CommunityDevelopmentActivity, side_effects: ["submitted_by_user_id := X-User-ID"] }
  - { method: POST, path: "/cra/community-development-activities/{id}/review-decision", description: "Qualify or disqualify a SUBMITTED activity", roles: [QualificationReviewer], code: 200, input: [decision, "allocation_method?", "disqualify_reason?"], output: CommunityDevelopmentActivity, side_effects: ["on QUALIFY: qualified_amount_cents computed; AssessmentArea.qualified_cd_total_cents recomputed"] }
  - { method: POST, path: "/cra/community-development-activities/{id}/resubmit", description: "DISQUALIFIED -> SUBMITTED", roles: [ComplianceAnalyst], code: 200, input: [], output: CommunityDevelopmentActivity, side_effects: ["review fields cleared"] }
  - { method: POST, path: "/cra/branches", description: "Directly create a branch in PROPOSED (not tied to an application)", roles: [BankExecutive], code: 201, input: [branch_code, assessment_area_id, census_tract, tract_income_level], output: Branch, side_effects: ["expansion_application_id := null"] }
  - { method: GET, path: "/cra/branches/{id}", description: "Read one branch", roles: [CRAOfficer, ComplianceAnalyst, QualificationReviewer, BankExaminer, BankExecutive, PlatformAdmin], code: 200, input: [], output: Branch, side_effects: [] }
  - { method: POST, path: "/cra/branches/{id}/open", description: "PROPOSED -> OPEN", roles: [BankExecutive], code: 200, input: [], output: Branch, side_effects: ["opened_date set", "PublicFile.branch_list_current := false + posture recompute (if file exists)"] }
  - { method: POST, path: "/cra/branches/{id}/close", description: "OPEN -> CLOSED with 90-day public notice check", roles: [BankExecutive], code: 200, input: [notice_posted_date], output: Branch, side_effects: ["closed_date + notice_posted_date set", "PublicFile.branch_list_current := false + posture recompute (if file exists)"] }
  - { method: POST, path: "/cra/public-comments", description: "Record a received public comment (status RECEIVED)", roles: [CRAOfficer, ComplianceAnalyst], code: 201, input: [commenter_name, channel, subject_area, content], output: PublicComment, side_effects: ["PublicFile.pending_comment_count += 1 + posture recompute (if file exists)"] }
  - { method: POST, path: "/cra/public-comments/{id}/publish", description: "RECEIVED -> PUBLISHED (placed into the public file)", roles: [CRAOfficer], code: 200, input: [], output: PublicComment, side_effects: ["PublicFile.pending_comment_count -= 1 + posture recompute (if file exists)"] }
  - { method: POST, path: "/cra/public-comments/{id}/respond", description: "PUBLISHED -> RESPONDED with response text", roles: [CRAOfficer], code: 200, input: [response_text], output: PublicComment, side_effects: [] }
  - { method: POST, path: "/cra/public-files", description: "Create the singleton CRA public file (only one may exist)", roles: [CRAOfficer], code: 201, input: [bank_name], output: PublicFile, side_effects: ["defaults: branch_list_current=true, aa_list_current=true, disclosure_statement_present=false, pending_comment_count=0 -> posture INCOMPLETE"] }
  - { method: GET, path: "/cra/public-files/{id}", description: "Read the public file including posture", roles: [CRAOfficer, ComplianceAnalyst, QualificationReviewer, BankExaminer, BankExecutive, PlatformAdmin], code: 200, input: [], output: PublicFile, side_effects: [] }
  - { method: POST, path: "/cra/public-files/{id}/refresh-items", description: "Mark public-file checklist items current (only true has effect; omitted/false leaves the flag unchanged); posture recomputed", roles: [CRAOfficer], code: 200, input: ["branch_list?", "aa_list?", "disclosure_statement?"], output: PublicFile, side_effects: ["posture recomputed; increments PublicFile.version by 1 when any flag changes"] }
  - { method: POST, path: "/cra/exam-cycles", description: "Schedule an exam (status SCHEDULED); closed evaluation window must not share any date with another exam", roles: [BankExaminer], code: 201, input: [exam_type, evaluation_window_start, evaluation_window_end, "performance_context_narrative?"], output: ExamCycle, side_effects: [] }
  - { method: GET, path: "/cra/exam-cycles/{id}", description: "Read one exam cycle", roles: [CRAOfficer, ComplianceAnalyst, QualificationReviewer, BankExaminer, BankExecutive, PlatformAdmin], code: 200, input: [], output: ExamCycle, side_effects: [] }
  - { method: PATCH, path: "/cra/exam-cycles/{id}/performance-context", description: "Update the performance context narrative while status IN {SCHEDULED, DATA_COLLECTION, FIELDWORK}", roles: [CRAOfficer], code: 200, input: [performance_context_narrative], output: ExamCycle, side_effects: ["increments ExamCycle.version by 1"] }
  - { method: POST, path: "/cra/exam-cycles/{id}/begin-data-collection", description: "SCHEDULED -> DATA_COLLECTION", roles: [BankExaminer], code: 200, input: [], output: ExamCycle, side_effects: [] }
  - { method: POST, path: "/cra/exam-cycles/{id}/begin-fieldwork", description: "DATA_COLLECTION -> FIELDWORK; requires public file COMPLETE", roles: [BankExaminer], code: 200, input: [], output: ExamCycle, side_effects: [] }
  - { method: POST, path: "/cra/exam-cycles/{id}/assign-preliminary-rating", description: "FIELDWORK -> PRELIMINARY_RATING; assigns the three test ratings and computes composite", roles: [BankExaminer], code: 200, input: [lending_test_rating, investment_test_rating, service_test_rating], output: ExamCycle, side_effects: ["composite_points + composite_rating computed"] }
  - { method: POST, path: "/cra/exam-cycles/{id}/appeal", description: "PRELIMINARY_RATING -> APPEALED", roles: [CRAOfficer], code: 200, input: [appeal_reason], output: ExamCycle, side_effects: [] }
  - { method: POST, path: "/cra/exam-cycles/{id}/reopen-fieldwork", description: "APPEALED -> FIELDWORK (appeal cycle)", roles: [BankExaminer], code: 200, input: [], output: ExamCycle, side_effects: [] }
  - { method: POST, path: "/cra/exam-cycles/{id}/finalize", description: "PRELIMINARY_RATING -> FINALIZED; adverse composite cascades to SUBMITTED applications and their staged branches", roles: [BankExaminer], code: 200, input: [], output: ExamCycle, side_effects: ["if composite IN {NEEDS_TO_IMPROVE, SUBSTANTIAL_NONCOMPLIANCE}: SUBMITTED applications -> DENIED (RATING_BLOCK); their PROPOSED linked branches -> WITHDRAWN"] }
  - { method: GET, path: "/cra/exam-cycles/{id}/lending-metrics", description: "Computed lending-test metrics and CRA register totals over the exam window", roles: [CRAOfficer, ComplianceAnalyst, QualificationReviewer, BankExaminer, BankExecutive, PlatformAdmin], code: 200, input: ["basis?"], output: "{ loan_count: integer, inside_aa_pct: number, lmi_geography_pct: number, lmi_borrower_pct: number, small_business_register_total_cents: integer, small_farm_register_total_cents: integer }", side_effects: ["runs calculations lending_test_metrics (basis=CURRENT default | SNAPSHOT) and loan_register_report_totals"] }
  - { method: POST, path: "/cra/expansion-applications", description: "Draft an expansion application (status DRAFT)", roles: [BankExecutive], code: 201, input: [application_type, target_assessment_area_id, "branch_code?", "branch_census_tract?", "branch_tract_income_level?"], output: ExpansionApplication, side_effects: [] }
  - { method: GET, path: "/cra/expansion-applications/{id}", description: "Read one expansion application", roles: [CRAOfficer, ComplianceAnalyst, QualificationReviewer, BankExaminer, BankExecutive, PlatformAdmin], code: 200, input: [], output: ExpansionApplication, side_effects: [] }
  - { method: POST, path: "/cra/expansion-applications/{id}/submit", description: "DRAFT -> SUBMITTED; rating guard applies; BRANCH_OPENING stages a PROPOSED branch", roles: [BankExecutive], code: 200, input: [], output: ExpansionApplication, side_effects: ["creates PROPOSED Branch when type == BRANCH_OPENING; linked_branch_id set"] }
  - { method: POST, path: "/cra/expansion-applications/{id}/decide", description: "SUBMITTED -> APPROVED | DENIED (regulator decision)", roles: [BankExaminer], code: 200, input: [decision, "decision_reason?"], output: ExpansionApplication, side_effects: ["on DENY: linked PROPOSED branch -> WITHDRAWN"] }
  - { method: GET, path: "/cra/expansion-applications/{id}/branches", description: "List branches staged by this application (0 or 1 element)", roles: [CRAOfficer, ComplianceAnalyst, QualificationReviewer, BankExaminer, BankExecutive, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "Branch[]", side_effects: [] }
  - { method: POST, path: "/cra/_clock/set_current_utc", description: "Set the logical clock (ISO8601). Server startup default before any set call is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time; all date arithmetic (notice periods, trailing windows, retirement dates) reads this clock.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock advanced"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or role not declared" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "authenticated role not permitted for this endpoint" }
  - { id: ERR_VALIDATION, http: 400, condition: "malformed body, missing required field, invalid enum value, non-positive amount, lmi_benefit_pct outside 0..1, empty census_tracts at activation, lmi_population > total_population" }
  - { id: ERR_INVALID_WINDOW, http: 400, condition: "evaluation_window_end < evaluation_window_start" }
  - { id: ERR_ASSESSMENT_AREA_NOT_FOUND, http: 404, condition: "assessment area id does not exist" }
  - { id: ERR_LOAN_RECORD_NOT_FOUND, http: 404, condition: "loan record id does not exist" }
  - { id: ERR_ACTIVITY_NOT_FOUND, http: 404, condition: "community development activity id does not exist" }
  - { id: ERR_BRANCH_NOT_FOUND, http: 404, condition: "branch id does not exist" }
  - { id: ERR_PUBLIC_COMMENT_NOT_FOUND, http: 404, condition: "public comment id does not exist" }
  - { id: ERR_PUBLIC_FILE_NOT_FOUND, http: 404, condition: "public file id does not exist" }
  - { id: ERR_EXAM_CYCLE_NOT_FOUND, http: 404, condition: "exam cycle id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "expansion application id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "trigger named for a from-state the resource is not in, or target already in a terminal state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_assessment_area_version does not match the area's current version (OCC)" }
  - { id: ERR_DUPLICATE_AREA_CODE, http: 409, condition: "area_code already exists" }
  - { id: ERR_AREA_PERIOD_OVERLAP, http: 409, condition: "new area's half-open effective window intersects another same-msa_code area's window" }
  - { id: ERR_TRACT_OVERLAP, http: 409, condition: "a census tract would belong to two areas with status IN {ACTIVE, UNDER_REVIEW}" }
  - { id: ERR_EXAM_WINDOW_OVERLAP, http: 409, condition: "closed evaluation window shares at least one calendar date with an existing exam" }
  - { id: ERR_PUBLIC_FILE_EXISTS, http: 409, condition: "a PublicFile already exists (singleton)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "review-decision X-User-ID equals the activity's submitted_by_user_id" }
  - { id: ERR_PUBLIC_FILE_INCOMPLETE, http: 422, condition: "begin-fieldwork while the public file posture is INCOMPLETE or no public file exists" }
  - { id: ERR_RATING_BLOCKS_EXPANSION, http: 422, condition: "latest FINALIZED exam composite_rating is NEEDS_TO_IMPROVE or SUBSTANTIAL_NONCOMPLIANCE" }
  - { id: ERR_LMI_THRESHOLD_NOT_MET, http: 422, condition: "allocation_method=FULL_COUNT with lmi_benefit_pct < 0.51" }
  - { id: ERR_AREA_NOT_ACTIVE, http: 422, condition: "referenced assessment area status is not ACTIVE" }
  - { id: ERR_TRACT_NOT_IN_AREA, http: 422, condition: "loan record census_tract is not an element of the referenced area's census_tracts" }
  - { id: ERR_APPLICATION_NOT_APPROVED, http: 422, condition: "branch open with linked application whose status is not APPROVED" }
  - { id: ERR_CLOSURE_NOTICE_SHORT, http: 422, condition: "branch closure notice posted fewer than 90 days before the logical-clock date" }
  - { id: ERR_CD_BUDGET_EXCEEDED, http: 422, condition: "qualification would push the area's same-calendar-year qualified CD total above annual_cd_budget_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CRAOfficer
    description: "Bank CRA officer; owns delineation, public file, comments, narrative, appeals"
    identity: opaque
    exclusive_operations: ["assessment-area create/patch/activate/begin-review/complete-review/retire", "demographic-profile create", "public-file create/refresh", "public-comment publish/respond", "exam performance-context edit", "exam appeal"]
    shared_operations: ["public-comment create", "all GET reads"]
  - name: ComplianceAnalyst
    description: "Compliance analyst; records loan data and CD activity documentation"
    identity: opaque
    exclusive_operations: ["loan-record create/confirm/return-to-draft/mark-reported", "community-development-activity create/resubmit"]
    shared_operations: ["public-comment create", "all GET reads"]
  - name: QualificationReviewer
    description: "CD qualification reviewer; segregated from activity submission"
    identity: opaque
    exclusive_operations: ["community-development-activity review-decision"]
    shared_operations: ["all GET reads"]
  - name: BankExaminer
    description: "Regulatory examiner; drives exam lifecycle, assigns ratings, decides expansion applications"
    identity: opaque
    exclusive_operations: ["exam-cycle create/begin-data-collection/begin-fieldwork/assign-preliminary-rating/reopen-fieldwork/finalize", "expansion-application decide"]
    shared_operations: ["all GET reads"]
  - name: BankExecutive
    description: "Bank executive; files expansion applications and operates branches"
    identity: opaque
    exclusive_operations: ["expansion-application create/submit", "branch create/open/close"]
    shared_operations: ["all GET reads"]
  - name: PlatformAdmin
    description: "Operations administrator; drives the logical clock"
    identity: opaque
    exclusive_operations: ["_clock/set_current_utc"]
    shared_operations: ["all GET reads"]
