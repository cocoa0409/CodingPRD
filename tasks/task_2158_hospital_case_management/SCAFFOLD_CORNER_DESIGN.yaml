              payload: { patient_id: "${pat_id}", admission_type: "EMERGENT", drg_code: "DRG-291", drg_gmlos_days: 4.5, attending_unit: "5W", admitted_at: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403 and data.error_id == ERR_FORBIDDEN_ROLE"
            - "GET /episodes returns total_count == 0"
            - "the same body sent as CaseManager returns HTTP 201"

