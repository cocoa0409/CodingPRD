            - call: "POST /cte/programs-of-study/${pos_id}/educators"
              payload: { full_name: "Amir Bell", certification_route: "INDUSTRY_EXPERIENCE", claimed_industry_hours: 4200, credential_expires_on: "2029-06-30" }
              as: CteDirector
              as_user_id: "u_dir_1"
