      - name: assign_division_selects_narrowest_eligible_band_over_wider_and_wrong_type
        claim_type: correct_result
        grounds:
          - calculations.entry_division_assignment_selection
          - endpoints[POST /regatta-ops/entries/{id}/assign-division]
          - entities.Division.fields.boat_type_filter
        distinguishing_aspect: |
          Boat A's band key 171.3 sits inside an ANY division 160.0-200.0 (width 40) and a MONOHULL
          division 165.0-175.0 (width 10), and also inside a MULTIHULL division 170.0-172.0 that is
          narrower still: the selector takes the narrowest ELIGIBLE band, so the entry lands in the
          MONOHULL 165.0-175.0 division and the narrower wrong-hull division is filtered out before
          ranking ever happens.
        test_recipe:
          setup:
            - "A regatta with the notice of race published and three divisions: W (ANY, 160.0-200.0), N (MONOHULL, 165.0-175.0) and M (MULTIHULL, 170.0-172.0), each with min_entries 2."
            - "Boat A (MONOHULL) carries an ISSUED TOD_PHRF certificate with band_key_spm 171.3 and one SUBMITTED entry."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Mara Vance", email: "mara.vance@yc.test", measurer_license_id: "M-101" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_mea: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test", safety_course_expiry_utc: "2027-06-30T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_a: $.data.id, b_a_v: $.data.version } }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOD_PHRF", sail_area_m2: 68.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_a_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_a: $.data.id } }
            - { call: "POST /regatta-ops/rating-certificates/${c_a}/issue", payload: {}, as: Measurer, as_user_id: "${m_mea}" }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Autumn Handicap Series", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", discard_policy: "NONE", handicap_basis: "PER_CERTIFICATE", planned_race_count: 6, fleet_minimum: 2, protest_time_limit_minutes: 90, jury_quorum_required: 2, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id, reg_v1: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice of race revision 1", effective_utc: "2026-07-10T00:00:00Z", expected_regatta_version: "${reg_v1}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/divisions", payload: { regatta_id: "${reg}", code: "W", boat_type_filter: "ANY", rating_band_low: 160.0, rating_band_high: 200.0, min_entries: 2 }, as: RegattaChair, as_user_id: "${m_ch}", captures: { div_w: $.data.id } }
            - { call: "POST /regatta-ops/divisions", payload: { regatta_id: "${reg}", code: "N", boat_type_filter: "MONOHULL", rating_band_low: 165.0, rating_band_high: 175.0, min_entries: 2 }, as: RegattaChair, as_user_id: "${m_ch}", captures: { div_n: $.data.id } }
            - { call: "POST /regatta-ops/divisions", payload: { regatta_id: "${reg}", code: "M", boat_type_filter: "MULTIHULL", rating_band_low: 170.0, rating_band_high: 172.0, min_entries: 2 }, as: RegattaChair, as_user_id: "${m_ch}", captures: { div_m: $.data.id } }
            - { call: "POST /regatta-ops/entries", payload: { regatta_id: "${reg}", boat_id: "${b_a}", certificate_id: "${c_a}", helm_member_id: "${m_h1}", declared_crew_count: 1 }, as: Competitor, as_user_id: "${m_h1}", captures: { e_a: $.data.id } }
          trigger:
            - { call: "POST /regatta-ops/entries/${e_a}/assign-division", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
          assert:
            - "the trigger call returns HTTP 200 with Entry.${e_a}.division_id == ${div_n}"
            - "Division.${div_n}.assigned_entry_count == 1 and Division.${div_n}.accepted_entry_count == 0"
            - "Division.${div_w}.assigned_entry_count == 0: the wider eligible band lost the ranking"
            - "Division.${div_m}.assigned_entry_count == 0: the narrowest band of all was ineligible on boat_type"
            - "Entry.${e_a}.registration_status == SUBMITTED and Entry.${e_a}.version == 2"

      - name: division_merge_selects_nearest_band_midpoint_target
        claim_type: constraint_propagation
        grounds:
          - calculations.division_merge_target_selection
          - state_machines.Division.PROVISIONAL_to_MERGED
          - endpoints[POST /regatta-ops/divisions/{id}/merge]
        distinguishing_aspect: |
          Division A (165.0-175.0, midpoint 170.0) is short of the floor with one entry, and the
          merge target is chosen by band-midpoint distance, not by band adjacency or creation
          order: B (176.0-200.0, midpoint 188.0, distance 18.0) wins over C (201.0-230.0, midpoint
          215.5, distance 45.5), the entry is re-pointed to B, and B stays PROVISIONAL because one
          absorbed entry is still under its own floor of 2.
        test_recipe:
          setup:
            - "A regatta with fleet_minimum 2, the notice of race published, and three MONOHULL divisions with min_entries 2: A 165.0-175.0, B 176.0-200.0 and C 201.0-230.0."
            - "Boat A (band 171.3) has one entry assigned into division A, so A holds assigned_entry_count 1 against an effective floor of 2."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
