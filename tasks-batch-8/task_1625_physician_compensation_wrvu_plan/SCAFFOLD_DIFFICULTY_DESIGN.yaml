            - { call: "POST /comp/_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /comp/physicians", payload: { npi: "1000000020", full_name: "Dr Trueup", specialty: "IM", provider_type: PHYSICIAN, fte: 1.0, hire_date: "2017-01-01" }, as: SystemAdmin, captures: { phys: $.data.id } }
            - { call: "POST /comp/comp-plans", payload: { name: "TU Plan", fiscal_year_start: "2026-01-01", fiscal_year_end: "2026-12-31", credit_attribution_mode: SERVICE_DATE, quality_model: ALL_OR_NOTHING, quality_pool_cents: 100000, fmv_cap_cents: 90000000, tiers: [ { tier_code: T1, threshold_wrvu: 0, conversion_factor_cents: 4500, tier_bonus_cents: 0 }, { tier_code: T2, threshold_wrvu: 5000, conversion_factor_cents: 5500, tier_bonus_cents: 250000 }, { tier_code: T3, threshold_wrvu: 8000, conversion_factor_cents: 6500, tier_bonus_cents: 500000 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { plan: $.data.id } }
            - { call: "POST /comp/comp-plans/${plan}/cpt-rates", payload: { cpt_code: "99285", wrvu_value: 5.0, effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/submit-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/review-decision", payload: { decision: APPROVED }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/comp-plans/${plan}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements", payload: { physician_id: "${phys}", plan_id: "${plan}", base_salary_cents: 24000000, period_draw_cents: 1000000, effective_date: "2026-01-01" }, as: CompAnalyst, as_user_id: an_1, captures: { agr: $.data.id } }
            - { call: "POST /comp/physician-agreements/${agr}/submit-fmv", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/physician-agreements/${agr}/fmv-review", payload: { decision: APPROVED, benchmark_percentile: 55 }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/physician-agreements/${agr}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements/${agr}/production-captures", payload: { cpt_code: "99285", units: 1000, service_date: "2026-02-05", posting_date: "2026-02-05" }, as: CompAnalyst, as_user_id: an_1, captures: { cap1: $.data.id } }
            - { call: "POST /comp/production-captures/${cap1}/validate", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/physician-agreements/${agr}/production-captures", payload: { cpt_code: "99285", units: 200, service_date: "2026-02-20", posting_date: "2026-02-20" }, as: CompAnalyst, as_user_id: an_1, captures: { cap2: $.data.id } }
            - { call: "POST /comp/production-captures/${cap2}/validate", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/physician-agreements/${agr}/comp-statements", payload: { period_year: 2026, period_month: 2 }, as: CompAnalyst, as_user_id: an_1, captures: { stmt1: $.data.id } }
            - { call: "POST /comp/comp-statements/${stmt1}/submit-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-statements/${stmt1}/finalize", payload: {}, as: CompCommittee, as_user_id: cc_9 }
            - { call: "POST /comp/disputes", payload: { subject_type: CAPTURE, subject_capture_id: "${cap2}", reason: "duplicate posting" }, as: Physician, as_user_id: "${phys}", captures: { dsp: $.data.id } }
            - { call: "POST /comp/disputes/${dsp}/start-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/disputes/${dsp}/resolve", payload: { resolution: ACCEPTED }, as: CompCommittee, as_user_id: cc_9 }
            - { call: "POST /comp/comp-plans/${plan}/true-up-runs", payload: { as_of_period: "2026-02" }, as: CompAnalyst, as_user_id: an_1, captures: { run: $.data.id } }
            - { call: "POST /comp/true-up-runs/${run}/post", payload: {}, as: CompCommittee, as_user_id: cc_1 }
          trigger:
