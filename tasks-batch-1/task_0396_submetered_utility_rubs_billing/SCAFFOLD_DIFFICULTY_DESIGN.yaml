  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      # --- instance 1: read validation band exactly 3x accepted vs 3x+epsilon rejected
      - name: read_validation_band_exactly_3x_vs_over_3x
        grounds:
          - calculations.read_validation_band
          - validations[priority=9]
          - state_machines.MeterRead.SUBMITTED_to_VALIDATED
          - entities.Meter.fields.last_validated_reading
        distinguishing_aspect: |
          With Meter.last_validated_reading=100 (HIGH_READING_MULTIPLE=3), a read of
          consumption exactly 300 (==3x) VALIDATES, while consumption 301 (3x+1) is
          rejected with ERR_READING_OUT_OF_RANGE. Boundary metric: numeric `<=` band
          crossing on Meter consumption, reached through POST /meter-reads/{id}/validate.
          Distinct metric+endpoint from instance 2's temporal `>` boundary.
        test_recipe:
          setup:
            - "Meter with a prior VALIDATED read setting last_validated_reading=100, in an OPEN cycle."
            - "Two fresh reads on the same meter+period: reading_value 400 (consumption 300) and 401 (consumption 301)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PropertyManager
            - call: "POST /properties"
              payload: { name: "PB", state_code: "TX", recovery_cap_pct: 0.85, common_area_pct: 0.10 }
              as: PropertyManager
              captures: { pb_id: $.data.id }
            - call: "POST /utilities"
              payload: { property_id: "${pb_id}", utility_type: "ELECTRIC", allocation_method: "CONSUMPTION", unit_of_measure: "KWH" }
              as: PropertyManager
              captures: { ub_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${pb_id}", unit_number: "BU", square_feet: 700 }
              as: PropertyManager
              captures: { bu_id: $.data.id }
            - call: "POST /meters"
              payload: { property_id: "${pb_id}", utility_id: "${ub_id}", serial_number: "BS" }
              as: PropertyManager
              captures: { bm_id: $.data.id }
            - call: "POST /meters/${bm_id}/assign"
              payload: { unit_id: "${bu_id}", effective_from: "2026-06-01T00:00:00Z" }
              as: PropertyManager
            - call: "POST /vendor-bills"
              payload: { property_id: "${pb_id}", utility_id: "${ub_id}", period_label: "2026-06", total_cost_cents: 50000 }
              as: PropertyManager
              captures: { bvb_id: $.data.id }
            - call: "POST /billing-cycles"
              payload: { property_id: "${pb_id}", utility_id: "${ub_id}", vendor_bill_id: "${bvb_id}", period_label: "2026-06", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: PropertyManager
              captures: { bbc_id: $.data.id }
            # prior validated read in the SAME OPEN 2026-06 cycle sets last_validated_reading = 100
            - call: "POST /meter-reads"
              payload: { meter_id: "${bm_id}", property_id: "${pb_id}", period_label: "2026-06", reading_value: 100 }
              as: MeterTech
              captures: { br0_id: $.data.id }
            - call: "POST /meter-reads/${br0_id}/submit"
              payload: {}
              as: MeterTech
            - call: "POST /meter-reads/${br0_id}/validate"
              payload: {}
              as: PropertyManager
            # candidate read at exactly 3x: consumption = 400 - 100 = 300 (supersedes br0 on validate)
            - call: "POST /meter-reads"
              payload: { meter_id: "${bm_id}", property_id: "${pb_id}", period_label: "2026-06", reading_value: 400 }
              as: MeterTech
              captures: { br3x_id: $.data.id }
            - call: "POST /meter-reads/${br3x_id}/submit"
              payload: {}
              as: MeterTech
          trigger:
            - call: "POST /meter-reads/${br3x_id}/validate"
              payload: {}
              as: PropertyManager
          assert:
            - "MeterRead ${br3x_id}.consumption == 300  # exactly 3 * 100"
            - "MeterRead ${br3x_id}.status == VALIDATED  # <= band accepts exactly 3x"
            - "A sibling read of reading_value 401 (consumption 301) submitted then validated would return 409 ERR_READING_OUT_OF_RANGE (3x + 1 exceeds band)"

      # --- instance 2: late-fee delinquency strict `>` due_date + GRACE_DAYS boundary
      - name: delinquency_strict_greater_than_due_plus_grace_boundary
        grounds:
          - calculations.statement_schedule
          - validations[priority=12]
          - state_machines.TenantStatement.payment_UNPAID_to_DELINQUENT
          - entities.TenantStatement.fields.due_date
        distinguishing_aspect: |
          assess-late-fee uses strict `>`: at clock == due_date + GRACE_DAYS exactly
          (the boundary day) it is rejected ERR_NOT_YET_DELINQUENT, while one whole
          day later it succeeds and moves payment_status -> DELINQUENT. Boundary
          metric: temporal `>` on the server clock vs due_date+GRACE, reached through
          POST /statements/{id}/assess-late-fee. Distinct metric+endpoint from
          instance 1's numeric `<=` consumption band.
        test_recipe:
          setup:
            - "An ISSUED, UNPAID statement issued at 2026-06-15 (NET_DAYS=21 -> due 2026-07-06, GRACE_DAYS=5 -> boundary day 2026-07-11)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PropertyManager
            - call: "POST /properties"
              payload: { name: "PT", state_code: "NY", recovery_cap_pct: 0.85, common_area_pct: 0.00 }
              as: PropertyManager
              captures: { pt_id: $.data.id }
            - call: "POST /utilities"
              payload: { property_id: "${pt_id}", utility_type: "WATER", allocation_method: "RUBS", unit_of_measure: "GAL", monthly_admin_fee_cents: 0 }
              as: PropertyManager
              captures: { ut_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${pt_id}", unit_number: "TU", square_feet: 800 }
              as: PropertyManager
              captures: { tu_id: $.data.id }
            - call: "POST /leases"
              payload: { unit_id: "${tu_id}", property_id: "${pt_id}", tenant_user_id: "tT", occupant_count: 1, move_in_date: "2026-06-01T00:00:00Z" }
              as: PropertyManager
              captures: { tl_id: $.data.id }
            - call: "POST /leases/${tl_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /vendor-bills"
              payload: { property_id: "${pt_id}", utility_id: "${ut_id}", period_label: "2026-06", total_cost_cents: 20000 }
              as: PropertyManager
              captures: { tvb_id: $.data.id }
            - call: "POST /vendor-bills/${tvb_id}/approve"
              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles"
              payload: { property_id: "${pt_id}", utility_id: "${ut_id}", vendor_bill_id: "${tvb_id}", period_label: "2026-06", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: PropertyManager
              captures: { tbc_id: $.data.id }
            - call: "POST /billing-cycles/${tbc_id}/lock-reads"
              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles/${tbc_id}/allocate"
              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles/${tbc_id}/issue-statements"
              payload: {}
              as: PropertyManager
            - call: "GET /statements"
              payload: { billing_cycle_id: "${tbc_id}" }
              as: PropertyManager
              captures: { tst_id: "$.data[0].id" }
            # clock at the exact boundary day: due_date(2026-07-06) + GRACE_DAYS(5) = 2026-07-11
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-11T00:00:00Z" }
              as: PropertyManager
          trigger:
            - call: "POST /statements/${tst_id}/assess-late-fee"
              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "At clock == 2026-07-11 (due+GRACE exactly): HTTP 409, error_id == ERR_NOT_YET_DELINQUENT  # strict > not satisfied"
            - "After advancing clock to 2026-07-12 and re-calling, the statement moves to payment_status == DELINQUENT"

