      - name: authorization_version_increments_on_every_write
        claim_type: optimistic_concurrency
        grounds:
          - state_machines.AuthorizationRequest.SUBMITTED_to_PENDED
          - entities.AuthorizationRequest.fields.resubmission_count
          - complexity_profile.complexity_layers.optimistic_concurrency
        distinguishing_aspect: "Three successive writes (create, submit, payer PEND) leave AuthorizationRequest.version at exactly 3 and resubmission_count at 0 — the version counter tracks writes, not state changes, and a PEND does not consume a resubmission."
        test_recipe:
          setup:
            - "Unit and patient exist; a fresh AuthorizationRequest is created and submitted, then the payer PENDs it."
          setup_api_calls:
            - call: "POST /neurodiagnostics/units"
              payload: { name: "EMU Layer Unit", bed_count: 1, storage_quota_gb: 500.00 }
              as: UnitCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /neurodiagnostics/patients"
              payload: { mrn: "MRN-C-81", display_name: "Corner EightyOne", risk_tier: "LOW" }
              as: UnitCoordinator
              captures: { patient_id: $.data.id }
