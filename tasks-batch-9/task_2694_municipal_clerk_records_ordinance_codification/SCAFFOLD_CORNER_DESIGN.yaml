              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/agenda-packets/${pkt}/post"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/meetings/${mtg}/convene"
              payload: { present_member_count: 5 }
              as: PresidingOfficer
              as_user_id: "po-01"
            - call: "POST /clerk/motions"
              payload: { meeting_id: "${mtg}", motion_type: "PROCEDURAL", majority_rule: "SIMPLE", moved_by_member_id: "cm-01", seconded_by_member_id: "cm-02" }
              as: DeputyClerk
              as_user_id: "dc-01"
              captures: { mo: $.data.id }
          trigger:
            - call: "POST /clerk/meetings/${mtg}/adjourn"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
              captures: { e_clerk: $.data.error_id }
            - call: "POST /clerk/motions/${mo}/tally"
              payload: { yes_count: 3, no_count: 2, abstain_count: 0, recused_count: 0 }
