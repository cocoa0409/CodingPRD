          rationale: "That instance drives REJECTED -> DRAFT -> PENDING_REVIEW and asserts reject_reason cleared plus fee recomputation."

      - name: zone_reescalation_cycle
        claim_type: valid_transition
        grounds:
          - state_machines.OutbreakZone.CONTAINED_to_ACTIVE
        excluded_because:
          difficulty_instance: "non_linear_state_machine / outbreak_zone_reescalation_cycle"
          rationale: "That instance drives MONITORING -> ACTIVE -> CONTAINED -> ACTIVE, covering the re-escalation arc."

      - name: escalate_cascade_depth3
        claim_type: side_effect_execution
        grounds:
          - state_machines.OutbreakZone.MONITORING_to_ACTIVE
        excluded_because:
          difficulty_instance: "transitive_cascade / outbreak_escalate_cascades_three_levels"
          rationale: "That instance asserts premises -> QUARANTINE_HOLD, certificate -> ENTRY_BLOCKED (pre_block_status ISSUED), permit -> SUSPENDED from one escalate."

      - name: void_cascade_depth2
        claim_type: side_effect_execution
        grounds:
          - state_machines.Certificate.ISSUED_to_VOID
        excluded_because:
          difficulty_instance: "transitive_cascade / certificate_void_cascades_permit_and_records"
          rationale: "That instance asserts permit -> VOIDED, IN_TRANSIT record -> CANCELLED, and inventory restore from the void trigger."

      - name: schedule_blocked_while_permit_suspended
        claim_type: precondition_enforcement
        grounds:
          - state_machines.MovementRecord.SCHEDULED_to_IN_TRANSIT
          - errors[ERR_PERMIT_NOT_ISSUED]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / movement_scheduling_gated_by_permit_status"
          rationale: "That instance asserts ERR_PERMIT_NOT_ISSUED on POST /api/movement-records after the outbreak cascade suspends the permit."

      - name: submit_blocked_by_premises_disease_hold
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Certificate.DRAFT_to_PENDING_REVIEW
          - errors[ERR_PREMISES_DISEASE_HOLD]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / certificate_submit_gated_by_premises_disease_hold"
          rationale: "That instance asserts ERR_PREMISES_DISEASE_HOLD on submit once an ACTIVE quarantine holds the origin premises."

  # ===========================================================================
  # Section: calculations (guide table 3)
  # ===========================================================================
  - section: calculations
    instances:

      - name: cvi_fee_species_rate_constants
        claim_type: constants_applied
        grounds:
          - calculations.cvi_issuance_fee
        distinguishing_aspect: |
          PER_HEAD_RATE_CENTS is species-keyed: a 10-head SWINE consignment on a
          MONITORED premises yields 2500 + 90*10 + 1000 == 4400 and a 100-head
          POULTRY consignment yields 2500 + 25*100 + 1000 == 6000 — both far
          from the CATTLE rate exercised by §1.8.
        test_recipe:
          setup:
            - "SWINE premises (200 head) and POULTRY premises (200 head), both MONITORED; NONE-type matrix rows for KS/SWINE and KS/POULTRY; clock 2026-08-10"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Hog Farm", county: "Yolo", state_code: "CA", species_code: "SWINE", initial_head_count: 200, disease_status: "MONITORED" }
              as: ProgramAdmin
              captures: { prem_s: $.data.id }
            - call: "POST /api/premises"
              payload: { name: "Poultry Farm", county: "Yolo", state_code: "CA", species_code: "POULTRY", initial_head_count: 200, disease_status: "MONITORED" }
              as: ProgramAdmin
              captures: { prem_p: $.data.id }
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Ada", accreditation_number: "ACCRED-1", accreditation_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "SWINE", test_type: "NONE", test_validity_days: 30, vaccination_required: false, permit_required: false, effective_from: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "POULTRY", test_type: "NONE", test_validity_days: 30, vaccination_required: false, permit_required: false, effective_from: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem_s}", destination_state_code: "KS", species_code: "SWINE", head_count: 10, inspection_date: "2026-08-10T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { cert_s: $.data.id }
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem_p}", destination_state_code: "KS", species_code: "POULTRY", head_count: 100, inspection_date: "2026-08-10T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { cert_p: $.data.id }
          trigger:
            - call: "POST /api/certificates/${cert_s}/submit"
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { fee_s: $.data.provisional_fee_cents }
            - call: "POST /api/certificates/${cert_p}/submit"
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { fee_p: $.data.provisional_fee_cents }
          assert:
            - "Certificate.${cert_s}.provisional_fee_cents == 4400 (2500 base + 90*10 SWINE + 1000 MONITORED surcharge)"
            - "Certificate.${cert_p}.provisional_fee_cents == 6000 (2500 base + 25*100 POULTRY + 1000 surcharge)"

      - name: movement_fee_swine_rate_rounding
        claim_type: correct_result
        grounds:
          - calculations.movement_fee_reconciliation
          - entities.MovementRecord.fields.movement_fee_cents
        distinguishing_aspect: |
          SWINE's 62.5-cent rate exercises half-up rounding at the half-cent
          exactly: round_half_up(3 * 62.5) == 188, and the permit total agrees.
        test_recipe:
          setup:
            - "SWINE premises (30 head); NONE matrix; ISSUED certificate (10 head); ISSUED permit (alloc 10, window [2026-08-11, 2026-09-08]); clock 2026-08-10"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Hog Farm C4", county: "Yolo", state_code: "CA", species_code: "SWINE", initial_head_count: 30, disease_status: "MONITORED" }
              as: ProgramAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Ada", accreditation_number: "ACCRED-1", accreditation_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "SWINE", test_type: "NONE", test_validity_days: 30, vaccination_required: false, permit_required: true, effective_from: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem_id}", destination_state_code: "KS", species_code: "SWINE", head_count: 10, inspection_date: "2026-08-10T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /api/certificates/${cert_id}/submit"
              as: AccreditedVet
              as_user_id: "${vet_id}"
            - call: "POST /api/certificates/${cert_id}/issue"
              as: StateVetOfficer
            - call: "POST /api/movement-permits"
              payload: { certificate_id: "${cert_id}", allocated_head_count: 10, valid_from: "2026-08-11T00:00:00Z", valid_until: "2026-09-08T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { perm_id: $.data.id }
            - call: "POST /api/movement-permits/${perm_id}/issue"
              as: StateVetOfficer
          trigger:
            - call: "POST /api/movement-records"
              payload: { permit_id: "${perm_id}", head_count: 3, destination_name: "KS Feedlot", planned_ship_date: "2026-08-21T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { rec_id: $.data.id, rec_fee: $.data.movement_fee_cents }
            - call: "GET /api/movement-permits/${perm_id}"
              as: StateAuditor
              captures: { total: $.data.total_movement_fees_cents }
          assert:
            - "MovementRecord.${rec_id}.movement_fee_cents == 188 (round_half_up(3 * 62.5))"
            - "MovementPermit.${perm_id}.total_movement_fees_cents == 188"

      - name: movement_fee_total_excludes_cancelled_reconciles
        claim_type: input_set_filtering
        grounds:
          - calculations.movement_fee_reconciliation
          - calculations.permit_headroom
          - calculations.premises_inventory
        distinguishing_aspect: |
          Derived-field reconciliation across the lifecycle: cancelling a
          SCHEDULED record removes it from BOTH the fee total and both
          headrooms, while an IN_TRANSIT (then DELIVERED) record keeps
          contributing; SCHEDULED records never touch premises inventory.
        test_recipe:
          setup:
            - "CATTLE premises (30 head); ISSUED certificate; ISSUED permit (alloc 10); rec1 and rec2 (3 head each, fee 413); rec2 departed at clock 2026-08-21"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch C5", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 30, disease_status: "MONITORED" }
              as: ProgramAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Ada", accreditation_number: "ACCRED-1", accreditation_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE", test_type: "NONE", test_validity_days: 30, vaccination_required: false, permit_required: true, effective_from: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem_id}", destination_state_code: "KS", species_code: "CATTLE", head_count: 10, inspection_date: "2026-08-10T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /api/certificates/${cert_id}/submit"
              as: AccreditedVet
              as_user_id: "${vet_id}"
            - call: "POST /api/certificates/${cert_id}/issue"
              as: StateVetOfficer
            - call: "POST /api/movement-permits"
              payload: { certificate_id: "${cert_id}", allocated_head_count: 10, valid_from: "2026-08-11T00:00:00Z", valid_until: "2026-09-08T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { perm_id: $.data.id }
            - call: "POST /api/movement-permits/${perm_id}/issue"
              as: StateVetOfficer
            - call: "POST /api/movement-records"
              payload: { permit_id: "${perm_id}", head_count: 3, destination_name: "KS Feedlot", planned_ship_date: "2026-08-21T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { rec1: $.data.id }
            - call: "POST /api/movement-records"
              payload: { permit_id: "${perm_id}", head_count: 3, destination_name: "KS Feedlot", planned_ship_date: "2026-08-22T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { rec2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/movement-records/${rec2}/depart"
              as: AccreditedVet
              as_user_id: "${vet_id}"
          trigger:
            - call: "POST /api/movement-records/${rec1}/cancel"
              as: AccreditedVet
              as_user_id: "${vet_id}"
            - call: "GET /api/movement-permits/${perm_id}"
              as: StateAuditor
              captures: { total_mid: $.data.total_movement_fees_cents, comm_mid: $.data.committed_headroom, proj_mid: $.data.projected_headroom }
            - call: "POST /api/movement-records/${rec2}/arrive"
              as: AccreditedVet
              as_user_id: "${vet_id}"
            - call: "GET /api/movement-permits/${perm_id}"
              as: StateAuditor
              captures: { total_end: $.data.total_movement_fees_cents, comm_end: $.data.committed_headroom, proj_end: $.data.projected_headroom }
            - call: "GET /api/premises/${prem_id}"
              as: StateAuditor
              captures: { inv_end: $.data.current_head_count }
          assert:
            - "After cancelling SCHEDULED rec1: total_movement_fees_cents == 413 (only IN_TRANSIT rec2 contributes)"
            - "committed_headroom == 7 and projected_headroom == 7 (rec2's 3 head counted in both; rec1 fully released)"
            - "After rec2 arrives (DELIVERED): totals unchanged (DELIVERED still in the input set)"
            - "Premises.${prem_id}.current_head_count == 27 (only the departed 3 moved; the SCHEDULED-then-CANCELLED record never touched inventory)"

      - name: provisional_vs_final_fee_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.cvi_issuance_fee
        excluded_because:
          difficulty_instance: "dual_variant_calc / cvi_fee_provisional_vs_final_on_premises_upgrade"
          rationale: "That instance pins provisional 5000 vs final 4000 for identical certificate data after accredit."

      - name: variant_selection_submit_vs_issue
        claim_type: variant_selection
        grounds:
          - calculations.cvi_issuance_fee
        excluded_because:
          difficulty_instance: "dual_variant_calc / cvi_fee_provisional_vs_final_on_premises_upgrade"
          rationale: "The same instance exercises provisional-at-submit then final-at-issue and asserts the 1000-cent delta reconciliation."

      - name: committed_vs_projected_headroom
        claim_type: variant_divergence
        grounds:
          - calculations.permit_headroom
        excluded_because:
          difficulty_instance: "dual_variant_calc / permit_headroom_committed_vs_projected_diverge"
          rationale: "That instance asserts committed 14 vs projected 20 for one SCHEDULED record of 6 against allocation 20."

      - name: fee_cap_boundary
        claim_type: constants_applied
        grounds:
          - calculations.cvi_issuance_fee
        excluded_because:
          difficulty_instance: "combinatorial_formula / cvi_fee_tiered_surcharge_cap_combination"
          rationale: "That instance asserts the 20000 cap clamps a 32500 raw fee and lands exactly on 20000 without effect at the boundary."

      - name: movement_fee_per_line_rounding
        claim_type: precision
        grounds:
          - calculations.movement_fee_reconciliation
        excluded_because:
          difficulty_instance: "combinatorial_formula / movement_fee_per_line_rounding_pinned"
          rationale: "That instance pins per-line rounding: two 3-head CATTLE records of 413 each total 826, not the sum-then-round 825."

      - name: test_validity_inclusive_boundary
        claim_type: constants_applied
        grounds:
          - calculations.test_and_vaccination_window
        excluded_because:
          difficulty_instance: "boundary_precision_check / test_validity_day_boundary_inclusive"
          rationale: "That instance asserts age 30 == validity 30 submits while age 31 fails ERR_TEST_VALIDITY_EXPIRED."

      - name: headroom_conserved_on_cancel
        claim_type: reconciliation
        grounds:
          - calculations.permit_headroom
        excluded_because:
          difficulty_instance: "compensating_invariant / permit_headroom_conserved_by_cancel"
          rationale: "That instance asserts committed_headroom 10 -> 4 -> 10 across schedule and cancel."

      - name: inventory_conserved_on_depart_cancel
        claim_type: reconciliation
        grounds:
          - calculations.premises_inventory
        excluded_because:
          difficulty_instance: "compensating_invariant / premises_inventory_conserved_by_depart_cancel"
          rationale: "That instance asserts current_head_count 20 -> 15 -> 20 across depart and cancel-from-IN_TRANSIT."

  # ===========================================================================
  # Section: validations (guide table 4)
  # ===========================================================================
  - section: validations
    instances:

      - name: empty_user_context_header_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: |
          Priority 1 dominates everything: an empty X-User-ID on even a
          role-correct, body-free GET returns
          ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400).
        test_recipe:
          setup:
            - "Empty DB; the trigger sends X-User-Role: ProgramAdmin with an EMPTY X-User-ID"
          setup_api_calls: []
          trigger:
            - call: "GET /api/entry-requirements"
              as: ProgramAdmin
              as_user_id: ""
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER' with HTTP 400"

      - name: forbidden_beats_body_validation
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: |
          Authorization (priority 2) precedes body schema (priority 3): a
          StateVetOfficer POSTing a premises with a MISSING required field gets
          ERR_FORBIDDEN, not ERR_VALIDATION.
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /api/premises"
              payload: { name: "Ranch V2", state_code: "CA", species_code: "CATTLE", initial_head_count: 5 }
              as: StateVetOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_FORBIDDEN' with HTTP 403 (role check wins over the missing-county schema error)"

      - name: entry_requirement_amend_window_overlap_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_REQUIREMENT_WINDOW_OVERLAP]
          - concurrency_rules[requirement-amend-stale-version]
        distinguishing_aspect: |
          The window-overlap rule is re-evaluated on amend: extending R1's
          effective_until into R2's window fails ERR_REQUIREMENT_WINDOW_OVERLAP
          (409), while shrinking it inside its own span succeeds.
        test_recipe:
          setup:
            - "R1 KS/CATTLE/BRUCELLOSIS [2026-06-01, 2026-07-01); R2 same key [2026-07-01, 2026-08-01)"
          setup_api_calls:
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_validity_days: 30, vaccination_required: false, permit_required: true, effective_from: "2026-06-01T00:00:00Z", effective_until: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { r1: $.data.id, r1_ver: $.data.version }
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_validity_days: 30, vaccination_required: false, permit_required: true, effective_from: "2026-07-01T00:00:00Z", effective_until: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { r2: $.data.id }
          trigger:
            - call: "PATCH /api/entry-requirements/${r1}"
              payload: { expected_requirement_version: "${r1_ver}", effective_until: "2026-07-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { err_ovl: $.data.error_id }
            - call: "PATCH /api/entry-requirements/${r1}"
              payload: { expected_requirement_version: "${r1_ver}", effective_until: "2026-06-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { r1_until: $.data.effective_until }
          assert:
            - "PATCH extending R1 to 2026-07-15 (overlapping R2) -> error_id == 'ERR_REQUIREMENT_WINDOW_OVERLAP' (409); version unchanged so the retry with the same expected version still passes OCC"
            - "PATCH shrinking R1 to 2026-06-20 (inside its own span) succeeds: effective_until == '2026-06-20T00:00:00Z'"

      - name: entry_requirement_create_overlap_key_scoped
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_REQUIREMENT_WINDOW_OVERLAP]
          - entities.EntryRequirement.fields.destination_state_code
        distinguishing_aspect: |
          Overlap is keyed on (destination_state_code, species_code,
          test_type): a second row with the same key and overlapping window is
          rejected, while rows differing in test_type, destination, or species
          may overlap freely.
        test_recipe:
          setup:
            - "R1 KS/CATTLE/BRUCELLOSIS [2026-06-01, open-ended)"
          setup_api_calls:
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_validity_days: 30, vaccination_required: false, permit_required: true, effective_from: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_validity_days: 45, vaccination_required: false, permit_required: true, effective_from: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { err_same: $.data.error_id }
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE", test_type: "TUBERCULOSIS", test_validity_days: 45, vaccination_required: false, permit_required: false, effective_from: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { r3: $.data.id, st3: $.data.status }
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "TX", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_validity_days: 45, vaccination_required: false, permit_required: true, effective_from: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { r4: $.data.id, st4: $.data.status }
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "SWINE", test_type: "BRUCELLOSIS", test_validity_days: 45, vaccination_required: false, permit_required: false, effective_from: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { r5: $.data.id, st5: $.data.status }
          assert:
            - "Same key overlapping window -> error_id == 'ERR_REQUIREMENT_WINDOW_OVERLAP' (409)"
            - "Different test_type (TUBERCULOSIS) overlapping window -> created ACTIVE"
            - "Different destination (TX) overlapping window -> created ACTIVE"
            - "Different species (SWINE) overlapping window -> created ACTIVE"

      - name: zone_window_overlap_ignores_resolved
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=10]
          - errors[ERR_ZONE_WINDOW_OVERLAP]
          - entities.OutbreakZone.fields.status
        distinguishing_aspect: |
          The zone overlap sweep covers only non-terminal zones: a RESOLVED
          zone's window stops blocking new declarations, while a MONITORING
          zone's window still does.
        test_recipe:
          setup:
            - "Z1 (Colusa, AVIAN_INFLUENZA, POULTRY) [2026-08-10, 2026-08-20) created then resolved directly from MONITORING"
          setup_api_calls:
            - call: "POST /api/outbreak-zones"
              payload: { county: "Colusa", state_code: "CA", disease_code: "AVIAN_INFLUENZA", species_code: "POULTRY", severity: "LOW", effective_from: "2026-08-10T00:00:00Z", effective_until: "2026-08-20T00:00:00Z" }
              as: StateVetOfficer
              captures: { z1: $.data.id }
            - call: "POST /api/outbreak-zones/${z1}/resolve"
              as: StateVetOfficer
              captures: { z1_status: $.data.status }
          trigger:
            - call: "POST /api/outbreak-zones"
              payload: { county: "Colusa", state_code: "CA", disease_code: "AVIAN_INFLUENZA", species_code: "POULTRY", severity: "MODERATE", effective_from: "2026-08-15T00:00:00Z", effective_until: "2026-08-25T00:00:00Z" }
              as: StateVetOfficer
              captures: { z2: $.data.id, z2_status: $.data.status }
            - call: "POST /api/outbreak-zones"
              payload: { county: "Colusa", state_code: "CA", disease_code: "AVIAN_INFLUENZA", species_code: "POULTRY", severity: "HIGH", effective_from: "2026-08-22T00:00:00Z", effective_until: "2026-08-30T00:00:00Z" }
              as: StateVetOfficer
              captures: { err_z3: $.data.error_id }
          assert:
            - "Z1 resolved directly: status 'RESOLVED'"
            - "Z2 [2026-08-15, 2026-08-25) overlapping only RESOLVED Z1 -> created 'MONITORED' (terminal zones excluded from the sweep)"
            - "Z3 [2026-08-22, 2026-08-30) overlapping MONITORING Z2 -> error_id == 'ERR_ZONE_WINDOW_OVERLAP' (409; rule still active for non-terminal zones)"

      - name: state_beats_safety_on_issue
        claim_type: priority_ordering
        grounds:
          - validations[priority=6]
          - validations[priority=7]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / state_blocks_safety_on_issue"
          rationale: "That instance asserts ERR_CERTIFICATE_NOT_PENDING_REVIEW wins over ERR_PREMISES_DISEASE_HOLD on issue."

      - name: referential_beats_temporal_on_submit
        claim_type: priority_ordering
        grounds:
          - validations[priority=8]
          - validations[priority=9]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / referential_mismatch_beats_temporal_expiry"
          rationale: "That instance asserts ERR_TEST_RECORD_MISMATCH wins over ERR_TEST_VALIDITY_EXPIRED on submit."

      - name: permit_headroom_exceeded_at_zero
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_PERMIT_HEADROOM_EXCEEDED]
        excluded_because:
          difficulty_instance: "boundary_precision_check / permit_headroom_exact_fit"
          rationale: "That instance asserts head_count == committed_headroom schedules and one more head fails ERR_PERMIT_HEADROOM_EXCEEDED."

      - name: zone_window_overlap_half_open_adjacency
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_ZONE_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / outbreak_zone_half_open_adjacency"
          rationale: "That instance asserts gap-0 adjacency is accepted while a one-day overlap fails ERR_ZONE_WINDOW_OVERLAP."

      - name: quarantine_closed_interval_conflict_and_gap
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_QUARANTINE_WINDOW_CONFLICT]
          - errors[ERR_QUARANTINE_MIN_GAP_VIOLATION]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / quarantine_closed_interval_with_min_gap"
          rationale: "That instance asserts the 14-day gap boundary, the closed-interval overlap conflict, and the exact-14-day pass."

  # ===========================================================================
  # Section: rbac (guide table 7)
  # ===========================================================================
  - section: rbac
    instances:

      - name: rbac_write_denials_officer_admin_lab
        claim_type: role_exclusive_denied
        grounds:
          - validations[priority=2]
          - roles.ProgramAdmin
          - roles.StateVetOfficer
          - roles.LabTechnician
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: |
          Role checks are exclusive per endpoint and fire at priority 2 (before
          existence): StateVetOfficer cannot create premises, certificates, or
          test records; ProgramAdmin cannot declare zones or report results;
          LabTechnician cannot issue certificates or quarantine orders — every
          denial is ERR_FORBIDDEN 403 with well-formed payloads.
        test_recipe:
          setup:
            - "Empty DB (priority-2 role check fires before any existence check, so bogus path ids are sufficient)"
          setup_api_calls: []
          trigger:
            - call: "POST /api/premises"
              payload: { name: "Ranch R1", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 5 }
              as: StateVetOfficer
              captures: { e1: $.data.error_id }
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "00000000-0000-0000-0000-0000000000aa", destination_state_code: "KS", species_code: "CATTLE", head_count: 5, inspection_date: "2026-08-01T00:00:00Z" }
              as: StateVetOfficer
              captures: { e2: $.data.error_id }
            - call: "POST /api/test-records"
              payload: { premises_id: "00000000-0000-0000-0000-0000000000aa", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_date: "2026-07-12T00:00:00Z", lab_reference: "LAB-R1" }
              as: StateVetOfficer
              captures: { e3: $.data.error_id }
            - call: "POST /api/outbreak-zones"
              payload: { county: "Yolo", state_code: "CA", disease_code: "VESICULAR_STOMATITIS", species_code: "CATTLE", severity: "LOW", effective_from: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { e4: $.data.error_id }
            - call: "POST /api/test-records/00000000-0000-0000-0000-0000000000bb/result"
              payload: { result: "NEGATIVE" }
              as: ProgramAdmin
              captures: { e5: $.data.error_id }
            - call: "POST /api/quarantine-orders"
              payload: { premises_id: "00000000-0000-0000-0000-0000000000aa", species_code: "CATTLE", disease_code: "BRUCELLOSIS", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-15T00:00:00Z", reason: "X" }
              as: LabTechnician
              captures: { e6: $.data.error_id }
            - call: "POST /api/certificates/00000000-0000-0000-0000-0000000000cc/issue"
              as: LabTechnician
              captures: { e7: $.data.error_id }
          assert:
            - "StateVetOfficer POST /api/premises -> ERR_FORBIDDEN (ProgramAdmin exclusive)"
            - "StateVetOfficer POST /api/certificates -> ERR_FORBIDDEN (AccreditedVet exclusive)"
            - "StateVetOfficer POST /api/test-records -> ERR_FORBIDDEN (LabTechnician exclusive)"
            - "ProgramAdmin POST /api/outbreak-zones -> ERR_FORBIDDEN (StateVetOfficer exclusive)"
            - "ProgramAdmin POST /api/test-records/{id}/result -> ERR_FORBIDDEN"
            - "LabTechnician POST /api/quarantine-orders -> ERR_FORBIDDEN"
            - "LabTechnician POST /api/certificates/{id}/issue -> ERR_FORBIDDEN"
            - "All seven denials return HTTP 403 with response_type 'error'"

      - name: rbac_write_denials_vet_and_auditor
        claim_type: role_exclusive_denied
        grounds:
          - validations[priority=2]
          - roles.AccreditedVet
          - roles.StateAuditor
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: |
          AccreditedVet is blocked from every state-office and lab write
          (issue, zones, quarantines, test registration, veterinarian
          registry), and StateAuditor is read-only — its writes to premises,
          submit, and movement-records all fail ERR_FORBIDDEN.
        test_recipe:
          setup:
            - "Vet V exists (identity for AccreditedVet calls)"
          setup_api_calls:
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Ada", accreditation_number: "ACCRED-1", accreditation_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { vet_id: $.data.id }
          trigger:
            - call: "POST /api/certificates/00000000-0000-0000-0000-0000000000cc/issue"
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { e1: $.data.error_id }
            - call: "POST /api/outbreak-zones"
              payload: { county: "Yolo", state_code: "CA", disease_code: "VESICULAR_STOMATITIS", species_code: "CATTLE", severity: "LOW", effective_from: "2026-08-01T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { e2: $.data.error_id }
            - call: "POST /api/test-records"
              payload: { premises_id: "00000000-0000-0000-0000-0000000000aa", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_date: "2026-07-12T00:00:00Z", lab_reference: "LAB-R2" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { e3: $.data.error_id }
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Fake", accreditation_number: "ACCRED-F", accreditation_expires_at: "2027-01-01T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { e4: $.data.error_id }
            - call: "POST /api/premises"
              payload: { name: "Ranch R3", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 5 }
              as: StateAuditor
              captures: { e5: $.data.error_id }
            - call: "POST /api/certificates/00000000-0000-0000-0000-0000000000cc/submit"
              as: StateAuditor
              captures: { e6: $.data.error_id }
            - call: "POST /api/movement-records"
              payload: { permit_id: "00000000-0000-0000-0000-0000000000dd", head_count: 2, destination_name: "Nowhere", planned_ship_date: "2026-08-21T00:00:00Z" }
              as: StateAuditor
              captures: { e7: $.data.error_id }
          assert:
            - "AccreditedVet issue -> ERR_FORBIDDEN (StateVetOfficer exclusive)"
            - "AccreditedVet outbreak-zone create -> ERR_FORBIDDEN"
            - "AccreditedVet test-record create -> ERR_FORBIDDEN"
            - "AccreditedVet veterinarian create -> ERR_FORBIDDEN (ProgramAdmin exclusive)"
            - "StateAuditor POST /api/premises -> ERR_FORBIDDEN (read-only role)"
            - "StateAuditor submit -> ERR_FORBIDDEN"
            - "StateAuditor movement-record create -> ERR_FORBIDDEN"

      - name: ownership_enforced_for_vet_of_record
        claim_type: role_exclusive_denied
        grounds:
          - validations[priority=5]
          - roles.AccreditedVet
          - errors[ERR_NOT_CERTIFICATE_OWNER]
        distinguishing_aspect: |
          AccreditedVet identity is entity_backed:Veterinarian, so ownership is
          enforced end-to-end: vet B cannot submit or revise vet A's
          certificate, and cannot schedule movements under a permit whose
          certificate belongs to vet A — all ERR_NOT_CERTIFICATE_OWNER (403) —
          while vet A performs the same operations successfully.
        test_recipe:
          setup:
            - "Vets A and B; premises; NONE matrix; clock 2026-08-10; certificate owned by A"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch R4", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 30, disease_status: "MONITORED" }
              as: ProgramAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Ada", accreditation_number: "ACCRED-1", accreditation_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { vet_a: $.data.id }
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Bob", accreditation_number: "ACCRED-2", accreditation_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { vet_b: $.data.id }
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE", test_type: "NONE", test_validity_days: 30, vaccination_required: false, permit_required: true, effective_from: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem_id}", destination_state_code: "KS", species_code: "CATTLE", head_count: 10, inspection_date: "2026-08-10T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_a}"
              captures: { cert_id: $.data.id }
          trigger:
            - call: "POST /api/certificates/${cert_id}/submit"
              as: AccreditedVet
              as_user_id: "${vet_b}"
              captures: { err_sub_b: $.data.error_id }
            - call: "POST /api/certificates/${cert_id}/submit"
              as: AccreditedVet
              as_user_id: "${vet_a}"
              captures: { st_a: $.data.status }
            - call: "POST /api/certificates/${cert_id}/reject"
              payload: { reason_code: "INCOMPLETE" }
              as: StateVetOfficer
            - call: "POST /api/certificates/${cert_id}/revise"
              as: AccreditedVet
              as_user_id: "${vet_b}"
              captures: { err_rev_b: $.data.error_id }
            - call: "POST /api/certificates/${cert_id}/revise"
              as: AccreditedVet
              as_user_id: "${vet_a}"
              captures: { st_rev_a: $.data.status }
            - call: "POST /api/certificates/${cert_id}/submit"
              as: AccreditedVet
              as_user_id: "${vet_a}"
            - call: "POST /api/certificates/${cert_id}/issue"
              as: StateVetOfficer
            - call: "POST /api/movement-permits"
              payload: { certificate_id: "${cert_id}", allocated_head_count: 10, valid_from: "2026-08-11T00:00:00Z", valid_until: "2026-09-08T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_a}"
              captures: { perm_id: $.data.id }
            - call: "POST /api/movement-permits/${perm_id}/issue"
              as: StateVetOfficer
            - call: "POST /api/movement-records"
              payload: { permit_id: "${perm_id}", head_count: 2, destination_name: "KS Feedlot", planned_ship_date: "2026-08-21T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_b}"
              captures: { err_mov_b: $.data.error_id }
            - call: "POST /api/movement-records"
              payload: { permit_id: "${perm_id}", head_count: 2, destination_name: "KS Feedlot", planned_ship_date: "2026-08-21T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_a}"
              captures: { st_mov_a: $.data.status }
          assert:
            - "Vet B submit of A's certificate -> error_id == 'ERR_NOT_CERTIFICATE_OWNER' (403)"
            - "Vet A submit succeeds: 'PENDING_REVIEW'"
            - "Vet B revise of A's REJECTED certificate -> error_id == 'ERR_NOT_CERTIFICATE_OWNER'"
            - "Vet A revise succeeds: back to 'DRAFT'"
            - "Vet B movement-record create under A's permit -> error_id == 'ERR_NOT_CERTIFICATE_OWNER' (ownership traced via permit -> certificate)"
            - "Vet A movement-record create succeeds: 'SCHEDULED'"

  # ===========================================================================
  # Section: cross_cutting_layers (guide table 8)
  # complexity_layers: cascading_side_effects, optimistic_concurrency,
  # derived_field_reconciliation, rate_threshold_triggers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: permit_adjust_stale_version_rejected
        claim_type: occ_stale_version_rejected
        grounds:
          - concurrency_rules[permit-adjust-stale-version]
          - validations[priority=11]
          - errors[ERR_STALE_PERMIT_VERSION]
        distinguishing_aspect: |
          OCC on MovementPermit.version: a PATCH carrying the version observed
          before a prior successful adjust is rejected with
          ERR_STALE_PERMIT_VERSION (412), while the fresh write succeeds and
          increments version by exactly 1.
        test_recipe:
          setup:
            - "ISSUED certificate + ISSUED permit (alloc 10) at clock 2026-08-10"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch L1", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 30, disease_status: "MONITORED" }
              as: ProgramAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Ada", accreditation_number: "ACCRED-1", accreditation_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE", test_type: "NONE", test_validity_days: 30, vaccination_required: false, permit_required: true, effective_from: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem_id}", destination_state_code: "KS", species_code: "CATTLE", head_count: 10, inspection_date: "2026-08-10T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /api/certificates/${cert_id}/submit"
              as: AccreditedVet
              as_user_id: "${vet_id}"
            - call: "POST /api/certificates/${cert_id}/issue"
              as: StateVetOfficer
            - call: "POST /api/movement-permits"
              payload: { certificate_id: "${cert_id}", allocated_head_count: 10, valid_from: "2026-08-11T00:00:00Z", valid_until: "2026-09-08T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { perm_id: $.data.id }
            - call: "POST /api/movement-permits/${perm_id}/issue"
              as: StateVetOfficer
            - call: "GET /api/movement-permits/${perm_id}"
              as: StateAuditor
              captures: { pv: $.data.version }
          trigger:
            - call: "PATCH /api/movement-permits/${perm_id}"
              payload: { expected_permit_version: "${pv}", allocated_head_count: 15 }
              as: StateVetOfficer
              captures: { alloc1: $.data.allocated_head_count, v1: $.data.version, comm1: $.data.committed_headroom }
            - call: "PATCH /api/movement-permits/${perm_id}"
              payload: { expected_permit_version: "${pv}", allocated_head_count: 18 }
              as: StateVetOfficer
              captures: { err: $.data.error_id }
            - call: "GET /api/movement-permits/${perm_id}"
              as: StateAuditor
              captures: { alloc_end: $.data.allocated_head_count, v_end: $.data.version }
          assert:
            - "First PATCH with current version succeeds: allocated_head_count == 15, committed_headroom == 15, version == ${pv} + 1"
            - "Second PATCH replaying the stale version -> error_id == 'ERR_STALE_PERMIT_VERSION' with HTTP 412"
            - "No drift: allocated_head_count stays 15 and version stays ${pv} + 1 after the rejected write"

      - name: entry_requirement_amend_stale_version_rejected
        claim_type: occ_stale_version_rejected
        grounds:
          - concurrency_rules[requirement-amend-stale-version]
          - validations[priority=11]
          - errors[ERR_STALE_REQUIREMENT_VERSION]
        distinguishing_aspect: |
          OCC on EntryRequirement.version: amending against a version captured
          before a prior amend is rejected ERR_STALE_REQUIREMENT_VERSION (412);
          the row remains ACTIVE throughout (state checks never fire).
        test_recipe:
          setup:
            - "One ACTIVE KS/CATTLE/BRUCELLOSIS matrix row"
          setup_api_calls:
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_validity_days: 30, vaccination_required: false, permit_required: true, effective_from: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { req_id: $.data.id, rv: $.data.version }
          trigger:
            - call: "PATCH /api/entry-requirements/${req_id}"
              payload: { expected_requirement_version: "${rv}", test_validity_days: 45 }
              as: ProgramAdmin
              captures: { days1: $.data.test_validity_days, v1: $.data.version, st1: $.data.status }
            - call: "PATCH /api/entry-requirements/${req_id}"
              payload: { expected_requirement_version: "${rv}", test_validity_days: 60 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
            - call: "GET /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE" }
              as: StateAuditor
              captures: { days_end: "$.data[0].test_validity_days" }
          assert:
            - "First amend with current version succeeds: test_validity_days == 45, version == ${rv} + 1, status stays 'ACTIVE'"
            - "Second amend replaying the stale version -> error_id == 'ERR_STALE_REQUIREMENT_VERSION' with HTTP 412"
            - "Matrix row still reads test_validity_days == 45 (rejected write left no drift)"

  # ===========================================================================
  # Section: consistency_model (guide table 9)
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_mutation_visibility_in_response
        claim_type: immediate_visibility
        grounds:
          - calculations.cvi_issuance_fee
          - entities.Certificate.fields.status
          - entities.Premises.fields.disease_status
        distinguishing_aspect: |
          Consistency model is immediate: every mutation's effects (defaults,
          computed fees, minted identifiers) are visible in the same request's
          response envelope with no re-read.
        test_recipe:
          setup:
            - "Standard NONE-matrix fixture; clock 2026-08-10"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch L3", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 30 }
              as: ProgramAdmin
              captures: { prem_id: $.data.id, prem_status: $.data.disease_status, prem_head: $.data.current_head_count }
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Ada", accreditation_number: "ACCRED-1", accreditation_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { vet_id: $.data.id, vet_status: $.data.status, vet_current: $.data.is_credential_current }
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE", test_type: "NONE", test_validity_days: 30, vaccination_required: false, permit_required: true, effective_from: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              captures: { clock_now: $.data.current_utc }
          trigger:
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem_id}", destination_state_code: "KS", species_code: "CATTLE", head_count: 10, inspection_date: "2026-08-10T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { cert_id: $.data.id, c_status: $.data.status, c_vet: $.data.vet_id }
            - call: "POST /api/certificates/${cert_id}/submit"
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { sub_status: $.data.status, sub_fee: $.data.provisional_fee_cents }
            - call: "POST /api/certificates/${cert_id}/issue"
              as: StateVetOfficer
              captures: { iss_status: $.data.status, iss_fee: $.data.final_fee_cents, iss_cvi: $.data.cvi_number, iss_vu: $.data.valid_until }
          assert:
            - "Premises create response already carries disease_status 'MONITORED' and current_head_count 30"
            - "Veterinarian create response already carries status 'ACTIVE' and is_credential_current true"
            - "Clock-set response echoes current_utc == '2026-08-10T00:00:00Z'"
            - "Certificate create response carries status 'DRAFT' and vet_id == ${vet_id}"
