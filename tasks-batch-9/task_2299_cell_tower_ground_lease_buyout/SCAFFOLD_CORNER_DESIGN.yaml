scaffold_corner_design:
  - section: entities
    instances:
      - name: creation_portfolio_initializes_capital_ledger_at_zero_utilization
        claim_type: creation
        grounds:
          - entities.Portfolio
          - endpoints[POST /lease-buyouts/portfolios]
          - calculations.portfolio_capital_ledger
        distinguishing_aspect: |
          Creation with all three required inputs returns 201 and every computed ledger field is
          initialized from an empty deal set rather than left null: committed, deployed and utilization are
          0, available equals total_capital_cents and the posture is OPEN.
        test_recipe:
          setup:
            - "Empty database; the logical clock is at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            []
          trigger:
            - { call: "POST /lease-buyouts/portfolios", payload: { name: "Northeast Tower Aggregation", program_code: "NE-AGG-01", total_capital_cents: 50000000 }, as: PlatformAdmin, captures: { pf_id: $.data.id } }
          assert:
            - "The response status is 201 and success is true"
            - "Portfolio.${pf_id}.name == Northeast Tower Aggregation"
            - "Portfolio.${pf_id}.program_code == NE-AGG-01"
            - "Portfolio.${pf_id}.total_capital_cents == 50000000"
            - "Portfolio.${pf_id}.committed_capital_cents == 0"
            - "Portfolio.${pf_id}.deployed_capital_cents == 0"
            - "Portfolio.${pf_id}.available_capital_cents == 50000000"
            - "Portfolio.${pf_id}.utilization_bps == 0"
            - "Portfolio.${pf_id}.capital_posture == OPEN"
            - "Portfolio.${pf_id}.active_deal_count == 0"
            - "Portfolio.${pf_id}.version == 1"
      - name: retrieval_lease_stream_returns_stored_inputs_and_derived_tenancy_fields
        claim_type: retrieval
        grounds:
          - entities.LeaseStream
          - endpoints[GET /lease-buyouts/lease-streams/{id}]
        distinguishing_aspect: |
          A single-resource GET echoes the stored input fields unchanged and also serves the derived
          tenancy fields, so the read path is not a partial projection: rent, escalator and term come back
          as submitted while tenancy_quality_score, anchor_carrier_name and active_tenancy_count reflect
          the one ACTIVE tenancy created afterwards.
        test_recipe:
          setup:
            - "A lease stream with annual rent 3600000 cents, FIXED_PCT 300 bps, 180 remaining months."
            - "One ACTIVE INVESTMENT_GRADE ANCHOR tenancy for Vantage Wireless."
          setup_api_calls:
            - { call: "POST /lease-buyouts/tower-companies", payload: { legal_name: "Summit Towers LLC", notice_email: "rofr@summit.example", rofr_required: false, rofr_window_days: 30 }, as: PlatformAdmin, captures: { tc_id: $.data.id } }
            - { call: "POST /lease-buyouts/tower-sites", payload: { tower_company_id: "${tc_id}", site_code: "NE-1042", state_code: "NY", ground_area_sqft: 2500, structure_type: "MONOPOLE" }, as: AcquisitionAnalyst, captures: { ts_id: $.data.id } }
            - { call: "POST /lease-buyouts/landowners", payload: { legal_name: "Hollis Farm LLC", entity_type: "LLC", contact_email: "owner@hollis.example" }, as: AcquisitionAnalyst, captures: { lo_id: $.data.id } }
            - { call: "POST /lease-buyouts/lease-streams", payload: { tower_site_id: "${ts_id}", landowner_id: "${lo_id}", current_annual_rent_cents: 3600000, escalator_type: "FIXED_PCT", escalator_pct_bps: 300, remaining_term_months: 180 }, as: AcquisitionAnalyst, captures: { ls_id: $.data.id } }
            - { call: "POST /lease-buyouts/lease-streams/${ls_id}/tenancies", payload: { carrier_name: "Vantage Wireless", carrier_credit_tier: "INVESTMENT_GRADE", tenancy_type: "ANCHOR", monthly_rent_share_cents: 250000, term_end_date: "2034-06-30" }, as: AcquisitionAnalyst, captures: { t1_id: $.data.id } }
          trigger:
            - { call: "GET /lease-buyouts/lease-streams/${ls_id}", payload: {}, as: AcquisitionAnalyst, captures: { read_score: $.data.tenancy_quality_score, read_anchor: $.data.anchor_carrier_name } }
          assert:
            - "${read_score} == 40"
            - "${read_anchor} == Vantage Wireless"
            - "LeaseStream.${ls_id}.current_annual_rent_cents == 3600000"
            - "LeaseStream.${ls_id}.escalator_type == FIXED_PCT"
            - "LeaseStream.${ls_id}.escalator_pct_bps == 300"
            - "LeaseStream.${ls_id}.remaining_term_months == 180"
            - "LeaseStream.${ls_id}.active_tenancy_count == 1"
            - "LeaseStream.${ls_id}.acquisition_status == PROSPECT"
            - "LeaseStream.${ls_id}.servicing_status == PERFORMING"
            - "LeaseStream.${ls_id}.rent_redirection_status == NOT_APPLICABLE"
      - name: listing_lease_streams_filtered_by_acquisition_status_with_pagination
        claim_type: listing
        grounds:
          - endpoints[GET /lease-buyouts/lease-streams]
          - response_envelope.list_shape
          - response_envelope.pagination
        distinguishing_aspect: |
          The list endpoint applies the acquisition_status filter before pagination and reports
          total_count over the filtered set, not over the table: three PROSPECT streams with limit 2 return
          2 items, total_count 3 and has_more true, and offset 2 returns the remaining 1 with has_more
          false.
        test_recipe:
          setup:
            - "Three lease streams on three tower sites, all in acquisition_status PROSPECT."
            - "Pagination defaults are limit 20, offset 0."
          setup_api_calls:
            - { call: "POST /lease-buyouts/tower-companies", payload: { legal_name: "Summit Towers LLC", notice_email: "rofr@summit.example", rofr_required: false, rofr_window_days: 30 }, as: PlatformAdmin, captures: { tc_id: $.data.id } }
            - { call: "POST /lease-buyouts/landowners", payload: { legal_name: "Hollis Farm LLC", entity_type: "LLC", contact_email: "owner@hollis.example" }, as: AcquisitionAnalyst, captures: { lo_id: $.data.id } }
            - { call: "POST /lease-buyouts/tower-sites", payload: { tower_company_id: "${tc_id}", site_code: "NE-7001", state_code: "NY", ground_area_sqft: 2500, structure_type: "MONOPOLE" }, as: AcquisitionAnalyst, captures: { ts_1: $.data.id } }
            - { call: "POST /lease-buyouts/tower-sites", payload: { tower_company_id: "${tc_id}", site_code: "NE-7002", state_code: "NY", ground_area_sqft: 2500, structure_type: "MONOPOLE" }, as: AcquisitionAnalyst, captures: { ts_2: $.data.id } }
            - { call: "POST /lease-buyouts/tower-sites", payload: { tower_company_id: "${tc_id}", site_code: "NE-7003", state_code: "NY", ground_area_sqft: 2500, structure_type: "MONOPOLE" }, as: AcquisitionAnalyst, captures: { ts_3: $.data.id } }
            - { call: "POST /lease-buyouts/lease-streams", payload: { tower_site_id: "${ts_1}", landowner_id: "${lo_id}", current_annual_rent_cents: 3600000, escalator_type: "FIXED_PCT", escalator_pct_bps: 300, remaining_term_months: 180 }, as: AcquisitionAnalyst, captures: { ls_1: $.data.id } }
            - { call: "POST /lease-buyouts/lease-streams", payload: { tower_site_id: "${ts_2}", landowner_id: "${lo_id}", current_annual_rent_cents: 3600000, escalator_type: "FIXED_PCT", escalator_pct_bps: 300, remaining_term_months: 180 }, as: AcquisitionAnalyst, captures: { ls_2: $.data.id } }
            - { call: "POST /lease-buyouts/lease-streams", payload: { tower_site_id: "${ts_3}", landowner_id: "${lo_id}", current_annual_rent_cents: 3600000, escalator_type: "FIXED_PCT", escalator_pct_bps: 300, remaining_term_months: 180 }, as: AcquisitionAnalyst, captures: { ls_3: $.data.id } }
          trigger:
            - { call: "GET /lease-buyouts/lease-streams", payload: { acquisition_status: "PROSPECT", limit: 2, offset: 0 }, as: AcquisitionAnalyst }
            - { call: "GET /lease-buyouts/lease-streams", payload: { acquisition_status: "PROSPECT", limit: 2, offset: 2 }, as: AcquisitionAnalyst }
            - { call: "GET /lease-buyouts/lease-streams", payload: { acquisition_status: "ACQUIRED" }, as: AcquisitionAnalyst }
          assert:
            - "The first page returns data.items with 2 entries, data.total_count 3 and data.has_more true"
            - "The second page returns data.items with 1 entry, data.total_count 3 and data.has_more false"
            - "The ACQUIRED query returns data.items empty, data.total_count 0 and data.has_more false"
            - "Every returned item carries id, created_at, updated_at and version"
            - "TowerSite.${ts_1}.lease_stream_count == 1"
      - name: not_found_lease_stream_unknown_uuid_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_LEASE_STREAM_NOT_FOUND]
          - validations[priority=3]
          - endpoints[GET /lease-buyouts/lease-streams/{id}]
        distinguishing_aspect: |
          A well-formed but unknown uuid in the outermost path segment is an existence failure, not a
          schema failure: the response is 404 ERR_LEASE_STREAM_NOT_FOUND rather than 400
          ERR_INVALID_REQUEST, and the sibling stream that does exist is untouched.
        test_recipe:
          setup:
            - "One lease stream exists."
            - "The uuid 3f7c1a52-9b64-4d18-8e2a-6c5f0b91d4e7 belongs to no entity."
          setup_api_calls:
            - { call: "POST /lease-buyouts/tower-companies", payload: { legal_name: "Summit Towers LLC", notice_email: "rofr@summit.example", rofr_required: false, rofr_window_days: 30 }, as: PlatformAdmin, captures: { tc_id: $.data.id } }
            - { call: "POST /lease-buyouts/tower-sites", payload: { tower_company_id: "${tc_id}", site_code: "NE-1042", state_code: "NY", ground_area_sqft: 2500, structure_type: "MONOPOLE" }, as: AcquisitionAnalyst, captures: { ts_id: $.data.id } }
            - { call: "POST /lease-buyouts/landowners", payload: { legal_name: "Hollis Farm LLC", entity_type: "LLC", contact_email: "owner@hollis.example" }, as: AcquisitionAnalyst, captures: { lo_id: $.data.id } }
            - { call: "POST /lease-buyouts/lease-streams", payload: { tower_site_id: "${ts_id}", landowner_id: "${lo_id}", current_annual_rent_cents: 3600000, escalator_type: "FIXED_PCT", escalator_pct_bps: 300, remaining_term_months: 180 }, as: AcquisitionAnalyst, captures: { ls_id: $.data.id } }
          trigger:
            - { call: "GET /lease-buyouts/lease-streams/3f7c1a52-9b64-4d18-8e2a-6c5f0b91d4e7", payload: {}, as: AcquisitionAnalyst, captures: { err_id: $.data.error_id } }
          assert:
            - "The response status is 404 with error_id ERR_LEASE_STREAM_NOT_FOUND"
            - "${err_id} != ERR_INVALID_REQUEST"
            - "The response envelope has success false and an error.message string"
            - "LeaseStream.${ls_id}.version == 1"
      - name: required_fields_missing_current_annual_rent_rejected
        claim_type: required_fields
        grounds:
          - entities.LeaseStream.fields.current_annual_rent_cents
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          current_annual_rent_cents is `source: input` with no default, so omitting it is a schema
          violation caught before any FK or business check: the response is 400 ERR_INVALID_REQUEST and no
          LeaseStream row is created even though tower_site_id and landowner_id both resolve.
        test_recipe:
          setup:
            - "A tower site and a landowner exist and both ids are valid."
            - "The request omits current_annual_rent_cents entirely."
          setup_api_calls:
            - { call: "POST /lease-buyouts/tower-companies", payload: { legal_name: "Summit Towers LLC", notice_email: "rofr@summit.example", rofr_required: false, rofr_window_days: 30 }, as: PlatformAdmin, captures: { tc_id: $.data.id } }
            - { call: "POST /lease-buyouts/tower-sites", payload: { tower_company_id: "${tc_id}", site_code: "NE-1042", state_code: "NY", ground_area_sqft: 2500, structure_type: "MONOPOLE" }, as: AcquisitionAnalyst, captures: { ts_id: $.data.id } }
            - { call: "POST /lease-buyouts/landowners", payload: { legal_name: "Hollis Farm LLC", entity_type: "LLC", contact_email: "owner@hollis.example" }, as: AcquisitionAnalyst, captures: { lo_id: $.data.id } }
          trigger:
            - { call: "POST /lease-buyouts/lease-streams", payload: { tower_site_id: "${ts_id}", landowner_id: "${lo_id}", escalator_type: "FIXED_PCT", escalator_pct_bps: 300, remaining_term_months: 180 }, as: AcquisitionAnalyst, captures: { err_id: $.data.error_id } }
          assert:
            - "The response status is 400 with error_id ERR_INVALID_REQUEST"
            - "TowerSite.${ts_id}.lease_stream_count == 0"
            - "GET /lease-buyouts/lease-streams returns data.total_count 0"
      - name: defaults_omitted_optional_inputs_apply_declared_default_values
        claim_type: defaults
        grounds:
          - entities.TowerCompany.fields.rofr_required
          - entities.TowerCompany.fields.rofr_window_days
          - entities.LeaseStream.fields.escalator_pct_bps
          - entities.FinancingFacility.fields.carrier_concentration_limit_bps
          - entities.Deal.fields.revenue_share_bps
        distinguishing_aspect: |
          Every optional input with a declared default is materialized on create rather than stored null:
          a tower company created without ROFR fields is rofr_required false with a 30 day window, a NONE
          escalator stream without escalator_pct_bps is 0 bps, a facility without a concentration limit is
          5000 bps and a deal without revenue_share_bps is 2500 bps.
        test_recipe:
          setup:
            - "A portfolio with 50000000 cents of capital exists."
            - "None of the four creates supply the optional fields under test."
          setup_api_calls:
            - { call: "POST /lease-buyouts/portfolios", payload: { name: "Northeast Tower Aggregation", program_code: "NE-AGG-01", total_capital_cents: 50000000 }, as: PlatformAdmin, captures: { pf_id: $.data.id } }
          trigger:
            - { call: "POST /lease-buyouts/tower-companies", payload: { legal_name: "Summit Towers LLC", notice_email: "rofr@summit.example" }, as: PlatformAdmin, captures: { tc_id: $.data.id } }
            - { call: "POST /lease-buyouts/tower-sites", payload: { tower_company_id: "${tc_id}", site_code: "NE-1042", state_code: "NY", ground_area_sqft: 2500, structure_type: "MONOPOLE" }, as: AcquisitionAnalyst, captures: { ts_id: $.data.id } }
            - { call: "POST /lease-buyouts/landowners", payload: { legal_name: "Hollis Farm LLC", entity_type: "LLC", contact_email: "owner@hollis.example" }, as: AcquisitionAnalyst, captures: { lo_id: $.data.id } }
            - { call: "POST /lease-buyouts/lease-streams", payload: { tower_site_id: "${ts_id}", landowner_id: "${lo_id}", current_annual_rent_cents: 3600000, escalator_type: "NONE", remaining_term_months: 180 }, as: AcquisitionAnalyst, captures: { ls_id: $.data.id } }
            - { call: "POST /lease-buyouts/lease-streams/${ls_id}/tenancies", payload: { carrier_name: "Vantage Wireless", carrier_credit_tier: "INVESTMENT_GRADE", tenancy_type: "ANCHOR", monthly_rent_share_cents: 250000, term_end_date: "2034-06-30" }, as: AcquisitionAnalyst, captures: { t1_id: $.data.id } }
            - { call: "GET /lease-buyouts/lease-streams/${ls_id}", payload: {}, as: AcquisitionAnalyst, captures: { ls_v1: $.data.version } }
            - { call: "POST /lease-buyouts/lease-streams/${ls_id}/valuations", payload: { method: "LUMP_SUM_PERPETUAL", expected_lease_stream_version: "${ls_v1}" }, as: AcquisitionAnalyst, captures: { val_id: $.data.id } }
            - { call: "POST /lease-buyouts/stream-valuations/${val_id}/approve", payload: {}, as: PortfolioManager, as_user_id: "pm-alice" }
            - { call: "POST /lease-buyouts/deals", payload: { portfolio_id: "${pf_id}", lease_stream_id: "${ls_id}", valuation_id: "${val_id}", easement_type: "PERPETUAL_EASEMENT" }, as: AcquisitionAnalyst, captures: { deal_id: $.data.id } }
            - { call: "POST /lease-buyouts/financing-facilities", payload: { portfolio_id: "${pf_id}", facility_name: "Warehouse A", advance_rate_bps: 6500, valuation_basis: "MARK_TO_MODEL" }, as: TreasuryOfficer, captures: { fac_id: $.data.id } }
          assert:
            - "TowerCompany.${tc_id}.rofr_required == false"
            - "TowerCompany.${tc_id}.rofr_window_days == 30"
            - "LeaseStream.${ls_id}.escalator_pct_bps == 0"
            - "StreamValuation.${val_id}.growth_rate_bps == 0"
            - "Deal.${deal_id}.revenue_share_bps == 2500"
            - "Deal.${deal_id}.easement_term_years == 0"
            - "Deal.${deal_id}.rofr_state == NOT_REQUIRED"
            - "FinancingFacility.${fac_id}.carrier_concentration_limit_bps == 5000"
            - "FinancingFacility.${fac_id}.compliance_state == COMPLIANT"
      - name: computed_fields_tenancy_mix_drives_score_anchor_and_active_count
        claim_type: computed_fields
        grounds:
          - entities.LeaseStream.fields.tenancy_quality_score
          - entities.LeaseStream.fields.anchor_carrier_name
          - entities.CarrierTenancy.fields.quality_points
          - calculations.tenancy_quality_score
        distinguishing_aspect: |
          The stream's computed fields are re-derived on every tenancy write rather than frozen at
          creation: after an INVESTMENT_GRADE ANCHOR (40 points) and a SPECULATIVE COLOCATION
          (10 x 0.60 = 6.00 points) the score is 46, anchor_carrier_name is the ANCHOR carrier and not the
          colocator, and active_tenancy_count is 2.
        test_recipe:
          setup:
            - "A lease stream with rent 3600000 cents, FIXED_PCT 300 bps, 180 months and no tenancies yet."
          setup_api_calls:
            - { call: "POST /lease-buyouts/tower-companies", payload: { legal_name: "Summit Towers LLC", notice_email: "rofr@summit.example", rofr_required: false, rofr_window_days: 30 }, as: PlatformAdmin, captures: { tc_id: $.data.id } }
            - { call: "POST /lease-buyouts/tower-sites", payload: { tower_company_id: "${tc_id}", site_code: "NE-1042", state_code: "NY", ground_area_sqft: 2500, structure_type: "MONOPOLE" }, as: AcquisitionAnalyst, captures: { ts_id: $.data.id } }
            - { call: "POST /lease-buyouts/landowners", payload: { legal_name: "Hollis Farm LLC", entity_type: "LLC", contact_email: "owner@hollis.example" }, as: AcquisitionAnalyst, captures: { lo_id: $.data.id } }
            - { call: "POST /lease-buyouts/lease-streams", payload: { tower_site_id: "${ts_id}", landowner_id: "${lo_id}", current_annual_rent_cents: 3600000, escalator_type: "FIXED_PCT", escalator_pct_bps: 300, remaining_term_months: 180 }, as: AcquisitionAnalyst, captures: { ls_id: $.data.id } }
          trigger:
            - { call: "POST /lease-buyouts/lease-streams/${ls_id}/tenancies", payload: { carrier_name: "Vantage Wireless", carrier_credit_tier: "INVESTMENT_GRADE", tenancy_type: "ANCHOR", monthly_rent_share_cents: 250000, term_end_date: "2034-06-30" }, as: AcquisitionAnalyst, captures: { t_anchor: $.data.id } }
            - { call: "POST /lease-buyouts/lease-streams/${ls_id}/tenancies", payload: { carrier_name: "Bluewave Mobile", carrier_credit_tier: "SPECULATIVE", tenancy_type: "COLOCATION", monthly_rent_share_cents: 80000, term_end_date: "2034-06-30" }, as: ServicingAgent, captures: { t_colo: $.data.id } }
          assert:
            - "CarrierTenancy.${t_anchor}.quality_points == 40"
            - "CarrierTenancy.${t_anchor}.status == ACTIVE"
            - "CarrierTenancy.${t_anchor}.redirection_notice_status == NOT_APPLICABLE"
            - "CarrierTenancy.${t_colo}.quality_points == 6"
            - "LeaseStream.${ls_id}.tenancy_quality_score == 46"
            - "LeaseStream.${ls_id}.anchor_carrier_name == Vantage Wireless"
            - "LeaseStream.${ls_id}.active_tenancy_count == 2"
      - name: system_fields_id_timestamps_and_version_generated_from_logical_clock
        claim_type: system_fields
        grounds:
          - response_envelope.common_fields
          - response_envelope.logical_clock
          - endpoints[POST /lease-buyouts/landowners]
        distinguishing_aspect: |
          id, created_at, updated_at and version are system-assigned and the timestamps come from the
          logical clock rather than wall time: a landowner created after the clock is set to
          2026-09-15T12:00:00Z carries exactly that created_at, version 1 and updated_at == created_at,
          and a later PATCH advances version to 2 and updated_at to the new clock value.
        test_recipe:
          setup:
            - "The logical clock has been set to 2026-09-15T12:00:00Z before the create and to 2026-09-16T12:00:00Z before the update."
          setup_api_calls:
            - { call: "POST /lease-buyouts/_clock/set_current_utc", payload: { current_utc: "2026-09-15T12:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /lease-buyouts/landowners", payload: { legal_name: "Hollis Farm LLC", entity_type: "LLC", contact_email: "owner@hollis.example" }, as: AcquisitionAnalyst, captures: { lo_id: $.data.id } }
            - { call: "POST /lease-buyouts/_clock/set_current_utc", payload: { current_utc: "2026-09-16T12:00:00Z" }, as: PlatformAdmin }
            - { call: "PATCH /lease-buyouts/landowners/${lo_id}", payload: { contact_email: "estate@hollis.example" }, as: AcquisitionAnalyst }
          assert:
            - "Landowner.${lo_id}.id is a uuid the client never supplied"
            - "Landowner.${lo_id}.created_at == 2026-09-15T12:00:00Z"
            - "Landowner.${lo_id}.updated_at == 2026-09-16T12:00:00Z"
            - "Landowner.${lo_id}.version == 2"
            - "Landowner.${lo_id}.contact_email == estate@hollis.example"
            - "Landowner.${lo_id}.outreach_status == NEW"
            - "Landowner.${lo_id}.open_dispute_count == 0"
      - name: type_constraints_invalid_escalator_enum_and_out_of_range_bps_rejected
        claim_type: type_constraints
        grounds:
          - entities.LeaseStream.fields.escalator_type
          - entities.LeaseStream.fields.escalator_pct_bps
          - entities.TowerSite.fields.structure_type
          - validations[priority=5]
        distinguishing_aspect: |
          Enum membership and numeric range are both enforced at the schema layer, so all three variants
          return 400 ERR_INVALID_REQUEST: an escalator_type of FIXED_PERCENT is not in the declared enum, an
          escalator_pct_bps of 1001 exceeds the declared max 1000, and a structure_type of TREE is not a
          permitted TowerSite structure.
        test_recipe:
          setup:
            - "A tower site and a landowner exist so that only the field under test is invalid."
          setup_api_calls:
            - { call: "POST /lease-buyouts/tower-companies", payload: { legal_name: "Summit Towers LLC", notice_email: "rofr@summit.example", rofr_required: false, rofr_window_days: 30 }, as: PlatformAdmin, captures: { tc_id: $.data.id } }
            - { call: "POST /lease-buyouts/tower-sites", payload: { tower_company_id: "${tc_id}", site_code: "NE-1042", state_code: "NY", ground_area_sqft: 2500, structure_type: "MONOPOLE" }, as: AcquisitionAnalyst, captures: { ts_id: $.data.id } }
            - { call: "POST /lease-buyouts/landowners", payload: { legal_name: "Hollis Farm LLC", entity_type: "LLC", contact_email: "owner@hollis.example" }, as: AcquisitionAnalyst, captures: { lo_id: $.data.id } }
          trigger:
            - { call: "POST /lease-buyouts/lease-streams", payload: { tower_site_id: "${ts_id}", landowner_id: "${lo_id}", current_annual_rent_cents: 3600000, escalator_type: "FIXED_PERCENT", remaining_term_months: 180 }, as: AcquisitionAnalyst, captures: { err_enum: $.data.error_id } }
            - { call: "POST /lease-buyouts/lease-streams", payload: { tower_site_id: "${ts_id}", landowner_id: "${lo_id}", current_annual_rent_cents: 3600000, escalator_type: "FIXED_PCT", escalator_pct_bps: 1001, remaining_term_months: 180 }, as: AcquisitionAnalyst, captures: { err_range: $.data.error_id } }
            - { call: "POST /lease-buyouts/tower-sites", payload: { tower_company_id: "${tc_id}", site_code: "NE-1043", state_code: "NY", ground_area_sqft: 2500, structure_type: "TREE" }, as: AcquisitionAnalyst, captures: { err_struct: $.data.error_id } }
          assert:
            - "${err_enum} == ERR_INVALID_REQUEST with status 400"
            - "${err_range} == ERR_INVALID_REQUEST with status 400"
            - "${err_struct} == ERR_INVALID_REQUEST with status 400"
            - "GET /lease-buyouts/lease-streams returns data.total_count 0"
            - "TowerCompany.${tc_id}.site_count == 1"
      - name: parent_relationships_lease_stream_with_unknown_tower_site_rejected
