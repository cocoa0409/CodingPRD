            - "error_id == \"ERR_INVALID_STATE_TRANSITION\""
            - "SupportPersonPass.${pass_id}.status == \"CHECKED_OUT\""
            - "SupportPersonPass.${pass_id}.checked_out_at == \"2026-08-01T06:00:00Z\""
            - "SupportPersonPass.${pass_id}.checked_in_at == \"2026-08-01T06:00:00Z\""
            - "SupportPersonPass.${pass_id}.reentry_count == 0"
            - "SupportPersonPass.${pass_id}.valid_until == \"2026-08-02T06:00:00Z\""
