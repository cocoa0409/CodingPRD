              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (filing is SUBMITTED; submit is only declared from PREPARED/REJECTED_OFFICE)"
            - "error_id != ERR_OUTSIDE_FILING_WINDOW although the clock (2033-03-01) is beyond grace close 2033-02-10 — state priority 5 beats temporal priority 10"
            - "MaintenanceFiling.${fil_id}.status still == SUBMITTED"

