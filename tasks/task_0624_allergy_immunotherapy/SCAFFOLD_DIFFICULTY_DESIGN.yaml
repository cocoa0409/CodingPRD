            - call: "POST /immunotherapy-plans"
              payload: { patient_id: "${pat_id}", panel_id: "${panel_id}" }
              as: Allergist
              captures: { plan_id: $.data.id, plan_v0: $.data.version, start_color: $.data.starting_vial_color }
            - call: "POST /serum-lots"
              payload: { vial_color: "GREEN", lot_number: "GRN-600", concentrate_potency_pnu_per_ml: 10000, received_at_iso: "2026-01-01T00:00:00Z" }
              as: Pharmacist
