          - "errors[ERR_POLICY_LIMIT_EXCEEDED]"
        distinguishing_aspect: |
          Error-category pair (state vs business_fiscal): a supplement create against a FILED
          (not settled) claim with amount 200000000 exceeding remaining limit 100000000 fails
          both, and priority 4 (state) wins -> ERR_INVALID_STATE, not ERR_POLICY_LIMIT_EXCEEDED.
        test_recipe:
          setup:
