          trigger:
            - call: "POST /donations"
              payload: { member_id: "${m1_id}", amount_cents: 10000, donation_date: "2026-06-15", payment_method: "CHECK", campaign_id: "${c1_id}", split_across: true }
              as: FinanceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_ACTIVE_PLEDGE  # zero active pledges → empty candidate set"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: volunteer_accept_requires_event_scheduled
        grounds:
          - state_machines.VolunteerAssignment.INVITED_to_ACCEPTED
          - state_machines.Event.SCHEDULED_to_CANCELLED
          - validations[priority=6]
          - errors[ERR_DEPENDENCY_STATE]
        distinguishing_aspect: |
          VolunteerAssignment's INVITED->ACCEPTED transition depends on
          Event.status == SCHEDULED (sibling entity state). Cross-entity pair
          = (VolunteerAssignment, Event).
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z"
            - "Event E1 SERVICE created SCHEDULED then CANCELLED; VolunteerAssignment A1 for M1 on E1 role USHER, status INVITED (created before cancel)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "H", address_line1: "1 St", postal_code: "10001" }
              as: Registrar
              captures: { h1_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h1_id}", full_name: "M1", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m1_id: $.data.id }
            - call: "POST /events"
              payload: { name: "Sun 10am", event_type: "SERVICE", starts_at: "2026-05-10T10:00:00Z", ends_at: "2026-05-10T11:00:00Z", expected_attendance: 100, volunteer_slots: 4 }
              as: Coordinator
              captures: { e1_id: $.data.id }
            - call: "POST /volunteer-assignments"
              payload: { event_id: "${e1_id}", member_id: "${m1_id}", role_type: "USHER" }
              as: Coordinator
              captures: { a1_id: $.data.id }
              # A1 is still INVITED after this. Note: Event.cancel cascades INVITED assignments to CANCELLED,
              # so we cannot trigger the dependency error by cancelling E1 (A1 would be CANCELLED too).
              # Instead we complete E1 (SCHEDULED -> COMPLETED) so E1.status != SCHEDULED while A1 remains INVITED.
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T11:30:00Z" }
              as: PlatformAdmin
              # advance past ends_at so complete precondition holds
            - call: "POST /events/${e1_id}/complete"
              payload: {}
              as: Coordinator
              # E1 now COMPLETED; A1 is still INVITED (complete only touches CHECKED_IN volunteers)
          trigger:
            - call: "POST /volunteer-assignments/${a1_id}/accept"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DEPENDENCY_STATE  # accept blocked because Event.${e1_id}.status != SCHEDULED"
            - "VolunteerAssignment.${a1_id}.status == INVITED  # unchanged"

      - name: pledge_create_requires_campaign_active
        grounds:
          - state_machines.PledgeCampaign
          - validations[priority=6]
          - errors[ERR_DEPENDENCY_STATE]
        distinguishing_aspect: |
          Pledge creation depends on PledgeCampaign.status == ACTIVE (sibling
          entity state). Cross-entity pair = (Pledge, PledgeCampaign) — different
          from the (VolunteerAssignment, Event) pair above.
        test_recipe:
          setup:
            - "Clock at 2026-06-15T00:00:00Z"
            - "Campaign C1 created in DRAFT and NEVER activated"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "H", address_line1: "1 St", postal_code: "10001" }
              as: Registrar
              captures: { h1_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h1_id}", full_name: "M1", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m1_id: $.data.id }
            - call: "POST /pledge-campaigns"
              payload: { name: "Draft C", target_amount_cents: 50000, starts_on: "2026-05-01", ends_on: "2026-12-31" }
              as: FinanceAdmin
              captures: { c1_id: $.data.id }
              # not activated
          trigger:
            - call: "POST /pledges"
              payload: { campaign_id: "${c1_id}", member_id: "${m1_id}", pledged_amount_cents: 10000, frequency: "ONE_TIME", first_expected_on: "2026-06-01" }
              as: FinanceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DEPENDENCY_STATE  # pledge create blocked because PledgeCampaign.${c1_id}.status == DRAFT"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: facility_booking_buffered_overlap
        grounds:
          - validations[priority=8]
          - errors[ERR_FACILITY_OVERLAP]
          - entities.Facility.fields.buffer_minutes
        distinguishing_aspect: |
          Facility overlap uses BUFFERED half-open intervals: two bookings
          [a,b) and [c,d) conflict iff (a - buffer) < d AND (c - buffer) < b
          (equivalently, expand each interval by buffer_minutes on both sides
          and test overlap). Resource entity: Facility. Buffer=30min; a booking
          10:00-11:00 blocks any second booking starting before 11:30, and a
          second 11:30-12:30 is still rejected because 11:00+30 == 11:30 is not
          strictly before 11:30 — but with buffer applied on BOTH sides, the
          second's expanded start = 11:30 - 30 = 11:00 which equals the first
          expanded end, and the geometry treats coincident endpoints as
          non-overlap only in the unbuffered variant.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T09:00:00Z"
            - "Facility F1 capacity 200 buffer_minutes=30; first booking B1 [2026-05-10T10:00:00Z, 2026-05-10T11:00:00Z) CONFIRMED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /facilities"
              payload: { name: "Sanctuary", capacity: 200, buffer_minutes: 30 }
              as: Coordinator
              captures: { f1_id: $.data.id, f1_v0: $.data.version }
            - call: "POST /facility-bookings"
              payload: { facility_id: "${f1_id}", booking_type: "EXTERNAL", starts_at: "2026-05-10T10:00:00Z", ends_at: "2026-05-10T11:00:00Z", headcount: 100, expected_facility_version: "${f1_v0}" }
              as: Coordinator
              captures: { b1_id: $.data.id }
            - call: "GET /facilities/${f1_id}"
              payload: {}
              as: Coordinator
              captures: { f1_v1: $.data.version }
          trigger:
            - call: "POST /facility-bookings"
              payload: { facility_id: "${f1_id}", booking_type: "EXTERNAL", starts_at: "2026-05-10T11:20:00Z", ends_at: "2026-05-10T12:00:00Z", headcount: 100, expected_facility_version: "${f1_v1}" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_FACILITY_OVERLAP  # 11:20 falls inside the 30-min buffer after B1 ends at 11:00"

      - name: volunteer_unbuffered_event_overlap
        grounds:
          - validations[priority=8]
          - errors[ERR_VOLUNTEER_OVERLAP]
          - state_machines.VolunteerAssignment.INVITED_to_ACCEPTED
        distinguishing_aspect: |
          Volunteer overlap uses UNBUFFERED half-open intervals on Member (the
          scarce resource): two accepted assignments conflict iff their events'
          [starts_at, ends_at) intervals overlap in the strict half-open sense
          — an event ending at 11:00 does NOT conflict with one starting at
          11:00. Different resource entity (Member) and different interval
          semantics (unbuffered vs buffered) from the Facility instance above.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T09:00:00Z"
            - "Member M1 ADULT; Event E1 [2026-05-10T10:00:00Z, 2026-05-10T11:00:00Z); Event E2 [2026-05-10T10:30:00Z, 2026-05-10T11:30:00Z); Assignments A1 (E1, USHER) and A2 (E2, USHER) both INVITED; A1 already ACCEPTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "H", address_line1: "1 St", postal_code: "10001" }
              as: Registrar
              captures: { h1_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h1_id}", full_name: "M1", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m1_id: $.data.id }
            - call: "POST /events"
              payload: { name: "E1", event_type: "SERVICE", starts_at: "2026-05-10T10:00:00Z", ends_at: "2026-05-10T11:00:00Z", expected_attendance: 100, volunteer_slots: 4 }
              as: Coordinator
              captures: { e1_id: $.data.id }
            - call: "POST /events"
              payload: { name: "E2", event_type: "CLASS", starts_at: "2026-05-10T10:30:00Z", ends_at: "2026-05-10T11:30:00Z", expected_attendance: 30, volunteer_slots: 2 }
              as: Coordinator
              captures: { e2_id: $.data.id }
            - call: "POST /volunteer-assignments"
              payload: { event_id: "${e1_id}", member_id: "${m1_id}", role_type: "USHER" }
              as: Coordinator
              captures: { a1_id: $.data.id }
            - call: "POST /volunteer-assignments"
              payload: { event_id: "${e2_id}", member_id: "${m1_id}", role_type: "USHER" }
              as: Coordinator
              captures: { a2_id: $.data.id }
            - call: "POST /volunteer-assignments/${a1_id}/accept"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
          trigger:
            - call: "POST /volunteer-assignments/${a2_id}/accept"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_VOLUNTEER_OVERLAP  # E1 [10:00,11:00) overlaps E2 [10:30,11:30) — unbuffered"
            - "VolunteerAssignment.${a2_id}.status == INVITED  # unchanged"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: donation_post_then_refund_preserves_campaign_received_total
        grounds:
          - state_machines.Donation.PENDING_to_POSTED
          - state_machines.Donation.POSTED_to_REFUNDED
          - entities.PledgeCampaign.fields.received_total_cents
          - entities.Pledge.fields.received_amount_cents
        distinguishing_aspect: |
          Conserved quantity: PledgeCampaign.received_total_cents and paired
          Pledge.received_amount_cents. A POST (POSTED) mutation followed by
          the REFUND compensation MUST return both to their pre-POST values.
          Named invariant: sum-over-POSTED-donations = campaign.received_total_cents,
          preserved under (POST, REFUND) pair.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z"
            - "Campaign C1 ACTIVE; Pledge P1 pledged 10000 ACTIVE (received 0); pre-condition: PledgeCampaign.received_total_cents == 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "H", address_line1: "1 St", postal_code: "10001" }
              as: Registrar
              captures: { h1_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h1_id}", full_name: "M1", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m1_id: $.data.id }
            - call: "POST /pledge-campaigns"
              payload: { name: "Inv", target_amount_cents: 50000, starts_on: "2026-05-01", ends_on: "2026-12-31" }
              as: FinanceAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pledge-campaigns/${c1_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /pledges"
              payload: { campaign_id: "${c1_id}", member_id: "${m1_id}", pledged_amount_cents: 10000, frequency: "ONE_TIME", first_expected_on: "2026-06-01" }
              as: FinanceAdmin
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /donations"
              payload: { member_id: "${m1_id}", amount_cents: 4000, donation_date: "2026-06-01", payment_method: "CHECK", campaign_id: "${c1_id}", pledge_id: "${p1_id}" }
              as: FinanceAdmin
              captures: { d1_id: $.data.id }
              # CHECK auto-POSTED: campaign received=4000, pledge received=4000
            - call: "POST /donations/${d1_id}/refund"
              payload: {}
              as: FinanceAdmin
              # compensation
          assert:
            - "PledgeCampaign.${c1_id}.received_total_cents == 0  # invariant: post-then-refund is a no-op on received_total_cents"
            - "Pledge.${p1_id}.received_amount_cents == 0  # paired conserved quantity"
            - "Pledge.${p1_id}.status == ACTIVE  # never crossed threshold to FULFILLED; if it had, refund restores"
            - "PledgeCampaign.${c1_id}.fulfilled_pledge_count == 0"

      - name: group_membership_create_then_deactivate_preserves_roster_count
        grounds:
          - state_machines.GroupMembership
          - entities.SmallGroup.fields.roster_count
        distinguishing_aspect: |
          Different conserved quantity: SmallGroup.roster_count. Creating a
          GroupMembership (roster_count += 1) followed by deactivating it
          (roster_count -= 1) is a no-op on the roster counter. Distinct
          quantity type (integer roster count of an aggregate group) from the
          monetary received_total_cents above.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z"
            - "Member M1 ADULT REGULAR; Member M2 ADULT REGULAR (both in same household); SmallGroup G1 leader M1 ministry_area STUDY capacity 10 (roster_count=0 initially because leader is not auto-enrolled by scaffold)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "H", address_line1: "1 St", postal_code: "10001" }
              as: Registrar
              captures: { h1_id: $.data.id }
            - call: "POST /members"
              payload: { household_id: "${h1_id}", full_name: "M1", date_of_birth: "1990-01-01", member_type: "ADULT", email: "m1@x.com" }
              as: Registrar
              captures: { m1_id: $.data.id }
            - call: "PATCH /members/${m1_id}"
              payload: { membership_status: "REGULAR" }
              as: Registrar
            - call: "POST /members"
              payload: { household_id: "${h1_id}", full_name: "M2", date_of_birth: "1992-01-01", member_type: "ADULT", email: "m2@x.com" }
              as: Registrar
              captures: { m2_id: $.data.id }
            - call: "POST /small-groups"
              payload: { name: "Bible Study", leader_member_id: "${m1_id}", ministry_area: "STUDY", capacity: 10 }
              as: Coordinator
              captures: { g1_id: $.data.id }
          trigger:
            - call: "POST /group-memberships"
              payload: { group_id: "${g1_id}", member_id: "${m2_id}", role: "MEMBER" }
              as: Coordinator
              captures: { gm1_id: $.data.id }
            - call: "POST /group-memberships/${gm1_id}/deactivate"
              payload: {}
              as: Coordinator
          assert:
            - "SmallGroup.${g1_id}.roster_count == 0  # invariant: add+deactivate is a no-op on roster_count"
            - "GroupMembership.${gm1_id}.status == PAST"
