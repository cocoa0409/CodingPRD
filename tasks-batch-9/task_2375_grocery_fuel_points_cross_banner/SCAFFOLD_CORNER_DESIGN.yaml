            - "the reject returned HTTP 200 with ${draft_reject_status} == \"REJECTED\""
            - "the follow-up submit returned HTTP 409 with ${locked_err} == \"ERR_INVALID_STATE_TRANSITION\""
            - "SettlementBatch.${cbatch_id}.reimbursement_cents == 0 and submitted_by_user_id == null"
            - "GET /settlement-batches?site_id=${cp_id}&status=DRAFT returns meta total_count == 0"

      - name: redemption_authorization_and_settlement_axes_start_independently
        claim_type: Initial State
        grounds:
          - state_machines.FuelRedemption
          - complexity_profile.state_machine_shape
          - entities.FuelRedemption.fields.settlement_status
        distinguishing_aspect: "The parallel machine's two axes are initialised separately: a fresh redemption is AUTHORIZED on the authorization axis but NOT_APPLICABLE — not PENDING — on the settlement axis, and settlement_batch_id, gallons_dispensed and dispensed_at are all null until the pump reports."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site, owned fuel centre and a member holding 300 points; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_fuel
            - *cx_member
            - *cx_basket
            - *cx_post
            - *cx_member_version
          trigger:
            - *cx_redeem
          assert:
            - "the response status is 201"
            - "FuelRedemption.${cr_id}.authorization_status == \"AUTHORIZED\" and settlement_status == \"NOT_APPLICABLE\""
            - "FuelRedemption.${cr_id}.settlement_batch_id == null, gallons_dispensed == null and dispensed_at == null"
            - "FuelRedemption.${cr_id}.authorized_at == \"2026-08-01T00:00:00Z\" and points_debited_at_auth == 300"
            - "Member.${cm_id}.available_points == 0"

  # ===========================================================================
  - section: calculations
    instances:

      - name: redemption_authorization_caps_cents_off_and_refunds_the_uncapped_points
        claim_type: Constants Applied
        grounds:
          - calculations.redemption_authorization
          - entities.Banner.fields.max_cents_off_per_gallon
          - entities.FuelRedemption.fields.blocks_effective
        distinguishing_aspect: "Committing 1500 points asks for 15 blocks and 150 cents off, but the banner ceiling of 100 cents caps it at 10 effective blocks, and the debit is back-derived from the capped cents: only 1000 points are taken and the other 500 stay spendable — the surplus is never silently consumed."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site, owned fuel centre and a member holding 2000 points from a 200000-cent grocery basket; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_fuel
            - *cx_member
            - call: "POST /purchase-transactions"
              payload: { member_id: "${cm_id}", site_id: "${cg_id}", transacted_at: "2026-08-01T00:00:00Z", lines: [{ category: "GROCERY", amount_cents: 200000, quantity: 1 }] }
              as: StoreOperator
              as_user_id: "${cg_id}"
              captures: { cbig_id: $.data.id }
            - call: "POST /purchase-transactions/${cbig_id}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${cg_id}"
            - call: "GET /members/${cm_id}"
              payload: {}
              as: PumpTerminal
              as_user_id: "${cf_id}"
              captures: { cmv_big: $.data.version }
          trigger:
            - call: "POST /fuel-redemptions"
              payload: { member_id: "${cm_id}", site_id: "${cf_id}", alt_id_presented: "6660000001", points_committed: 1500, expected_member_version: "${cmv_big}" }
              as: PumpTerminal
              as_user_id: "${cf_id}"
              captures: { ccap_id: $.data.id, ccap_cents: $.data.cents_off_per_gallon, ccap_debit: $.data.points_debited_at_auth }
          assert:
            - "the response status is 201, ${ccap_cents} == 100 and ${ccap_debit} == 1000"
            - "FuelRedemption.${ccap_id}.blocks_effective == 10 and gallons_authorized == 35.000"
            - "Member.${cm_id}.available_points == 1000 (2000 accrued minus the 1000 actually debited)"
            - "GET /point-ledger-entries?member_id=${cm_id}&entry_type=REDEMPTION returns meta total_count == 1 with points_delta == -1000"

      - name: redemption_authorization_floors_partial_blocks_and_leaves_the_remainder
        claim_type: Precision
        grounds:
          - calculations.redemption_authorization
          - entities.Banner.fields.points_per_discount_block
        distinguishing_aspect: "149 points buys exactly one 100-point block: floor, not round, converts points to blocks, so cents_off_per_gallon is 10, only 100 points are debited and the 49-point remainder stays in the balance instead of being rounded up to a second block."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site, owned fuel centre and a member holding 300 points; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_fuel
            - *cx_member
            - *cx_basket
            - *cx_post
            - *cx_member_version
          trigger:
            - call: "POST /fuel-redemptions"
              payload: { member_id: "${cm_id}", site_id: "${cf_id}", alt_id_presented: "6660000001", points_committed: 149, expected_member_version: "${cmv}" }
              as: PumpTerminal
              as_user_id: "${cf_id}"
              captures: { cfloor_id: $.data.id, cfloor_cents: $.data.cents_off_per_gallon, cfloor_debit: $.data.points_debited_at_auth }
          assert:
            - "the response status is 201, ${cfloor_cents} == 10 and ${cfloor_debit} == 100"
            - "FuelRedemption.${cfloor_id}.blocks_effective == 1 and points_committed == 149"
            - "Member.${cm_id}.available_points == 200"

      - name: pharmacy_accrual_pays_per_script_and_ignores_the_dollar_amount
        claim_type: Correct Result
        grounds:
          - calculations.purchase_point_accrual
          - entities.Banner.fields.pharmacy_points_per_script
          - entities.Banner.fields.pharmacy_multiplier
        distinguishing_aspect: "A PHARMACY line pays 50 points per script times the 2x pharmacy multiplier regardless of its dollar value: three scripts worth 12 cents earn 300 points while a single script worth 90000 cents earns 100, which no dollar-based formula can reproduce."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site and one member; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_member
            - call: "POST /purchase-transactions"
              payload: { member_id: "${cm_id}", site_id: "${cg_id}", transacted_at: "2026-08-01T00:00:00Z", lines: [{ category: "PHARMACY", amount_cents: 12, quantity: 3 }, { category: "PHARMACY", amount_cents: 90000, quantity: 1 }] }
              as: StoreOperator
              as_user_id: "${cg_id}"
              captures: { crx_id: $.data.id }
          trigger:
            - call: "POST /purchase-transactions/${crx_id}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${cg_id}"
              captures: { rx_points: $.data.gross_points_awarded, rx_breakdown: $.data.line_points_breakdown }
          assert:
            - "${rx_points} == 400 and ${rx_breakdown} == [300, 100]"
            - "PurchaseTransaction.${crx_id}.subtotal_cents == 90012"
            - "Member.${cm_id}.available_points == 400"

      - name: tobacco_and_alcohol_lines_are_excluded_from_the_accrual_input_set
        claim_type: Input Set Filtering
        grounds:
          - calculations.purchase_point_accrual
          - entities.PurchaseTransaction.fields.lines
        distinguishing_aspect: "Only GROCERY, GIFT_CARD and PHARMACY lines earn: a basket of one 10000-cent GROCERY line plus TOBACCO, ALCOHOL and FUEL lines yields breakdown [100, 0, 0, 0] and 100 points, so the excluded categories still appear in subtotal_cents but contribute nothing."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site and one member; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_member
            - call: "POST /purchase-transactions"
              payload: { member_id: "${cm_id}", site_id: "${cg_id}", transacted_at: "2026-08-01T00:00:00Z", lines: [{ category: "GROCERY", amount_cents: 10000, quantity: 1 }, { category: "TOBACCO", amount_cents: 5000, quantity: 2 }, { category: "ALCOHOL", amount_cents: 3000, quantity: 1 }, { category: "FUEL", amount_cents: 4000, quantity: 10 }] }
              as: StoreOperator
              as_user_id: "${cg_id}"
              captures: { cmix_id: $.data.id }
          trigger:
            - call: "POST /purchase-transactions/${cmix_id}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${cg_id}"
              captures: { mix_points: $.data.gross_points_awarded, mix_breakdown: $.data.line_points_breakdown }
          assert:
            - "${mix_points} == 100 and ${mix_breakdown} == [100, 0, 0, 0]"
            - "PurchaseTransaction.${cmix_id}.subtotal_cents == 22000"
            - "Member.${cm_id}.available_points == 100"

      - name: settlement_tier_boundary_splits_two_thousand_gallons_from_the_next_thousandth
        claim_type: Correct Result
        grounds:
          - calculations.settlement_batch_reimbursement
          - entities.SettlementBatch.fields.tier_rate_pct
        distinguishing_aspect: "Two batches with the SAME gross_discount_cents of 60000 settle differently because the tier ladder reads gallons, not cents: exactly 2000.000 gallons is still the MID band at 0.90 (pre-fee 54000, fee 810, net 53190) while 2000.001 gallons crosses into HIGH at 0.95 (pre-fee 57000, fee 855, net 56145)."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site and two partner stations P_MID and P_HIGH, each with per_gallon_cap_cents 30 and max_gallons_per_redemption 2500."
            - "Member CM holds 600 points; one DISPENSED redemption of exactly 2000.000 gallons sits at P_MID and one of 2000.001 gallons at P_HIGH; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_member
            - call: "POST /sites"
              payload: { banner_id: "${cb_id}", site_number: "P-MID", site_type: "PARTNER_STATION", partner_code: "PTRMID", per_gallon_cap_cents: 30, max_gallons_per_redemption: 2500 }
              as: ProgramAdmin
              captures: { cpm_id: $.data.id }
            - call: "POST /sites"
              payload: { banner_id: "${cb_id}", site_number: "P-HIGH", site_type: "PARTNER_STATION", partner_code: "PTRHIGH", per_gallon_cap_cents: 30, max_gallons_per_redemption: 2500 }
              as: ProgramAdmin
              captures: { cph_id: $.data.id }
            - call: "POST /purchase-transactions"
              payload: { member_id: "${cm_id}", site_id: "${cg_id}", transacted_at: "2026-08-01T00:00:00Z", lines: [{ category: "GROCERY", amount_cents: 60000, quantity: 1 }] }
              as: StoreOperator
              as_user_id: "${cg_id}"
              captures: { ctier_tx_id: $.data.id }
            - call: "POST /purchase-transactions/${ctier_tx_id}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${cg_id}"
            - call: "GET /members/${cm_id}"
              payload: {}
              as: PumpTerminal
              as_user_id: "${cpm_id}"
              captures: { cmv_mid: $.data.version }
            - call: "POST /fuel-redemptions"
              payload: { member_id: "${cm_id}", site_id: "${cpm_id}", alt_id_presented: "6660000001", points_committed: 300, expected_member_version: "${cmv_mid}" }
              as: PumpTerminal
              as_user_id: "${cpm_id}"
              captures: { crm_id: $.data.id }
            - call: "POST /fuel-redemptions/${crm_id}/complete"
              payload: { gallons_dispensed: 2000.000 }
              as: PumpTerminal
              as_user_id: "${cpm_id}"
            - call: "GET /members/${cm_id}"
              payload: {}
              as: PumpTerminal
              as_user_id: "${cph_id}"
              captures: { cmv_high: $.data.version }
            - call: "POST /fuel-redemptions"
              payload: { member_id: "${cm_id}", site_id: "${cph_id}", alt_id_presented: "6660000001", points_committed: 300, expected_member_version: "${cmv_high}" }
              as: PumpTerminal
              as_user_id: "${cph_id}"
              captures: { crh_id: $.data.id }
            - call: "POST /fuel-redemptions/${crh_id}/complete"
              payload: { gallons_dispensed: 2000.001 }
              as: PumpTerminal
              as_user_id: "${cph_id}"
            - call: "GET /sites/${cpm_id}"
              payload: {}
              as: SettlementClerk
              as_user_id: "${cpm_id}"
              captures: { csvm: $.data.version }
            - call: "POST /settlement-batches"
              payload: { site_id: "${cpm_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59.999Z", expected_site_version: "${csvm}" }
              as: SettlementClerk
              as_user_id: "${cpm_id}"
              captures: { cbm_id: $.data.id }
            - call: "GET /sites/${cph_id}"
              payload: {}
              as: SettlementClerk
              as_user_id: "${cph_id}"
              captures: { csvh: $.data.version }
            - call: "POST /settlement-batches"
              payload: { site_id: "${cph_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59.999Z", expected_site_version: "${csvh}" }
              as: SettlementClerk
              as_user_id: "${cph_id}"
              captures: { cbh_id: $.data.id }
          trigger:
            - call: "POST /settlement-batches/${cbm_id}/submit"
              payload: {}
              as: SettlementClerk
              as_user_id: "${cpm_id}"
              captures: { mid_rate: $.data.tier_rate_pct, mid_net: $.data.reimbursement_cents }
            - call: "POST /settlement-batches/${cbh_id}/submit"
