          setup:
            - "Batch harvested/packed 46.00 lb on R-01 (WL-A), safety RELEASED; sanitation PASS on WL-A completed 2026-08-22T03:30:00Z"
            - "Shipment S1 confirm-packed (10.00 lb line PACKED) on the batch, window 2026-08-24 08:00-20:00"
            - "Second sanitation cycle CY2 on WL-A scheduled 2026-08-24 13:00-15:00 (buffer vs prior end respected)"
