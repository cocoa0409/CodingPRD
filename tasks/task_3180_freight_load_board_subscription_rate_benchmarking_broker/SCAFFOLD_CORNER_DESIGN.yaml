      - name: broker_admin_cannot_withdraw_another_brokers_load
        claim_type: rbac_denial
        grounds:
          - "validations[priority=6\"]"
          - "errors.ERR_NOT_RESOURCE_OWNER"
        distinguishing_aspect: "Ownership check: BrokerAdmin B2 attempting to withdraw broker B's load returns 403 ERR_NOT_RESOURCE_OWNER — the role is correct but the org identity does not match the resource's broker_org_id."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z. Broker B VERIFIED + subscribed with 1 OPEN load; second broker B2 exists."]
          setup_api_calls:
