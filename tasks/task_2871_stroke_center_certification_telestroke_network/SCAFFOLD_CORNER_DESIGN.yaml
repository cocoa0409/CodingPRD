      - 'starting the review makes the SAME return-for-info succeed: ${sb_dst2} == RETURNED_FOR_INFO'
  - name: a_closed_case_answers_case_not_active_rather_than_absolute_contraindication
    claim_type: priority_ordering
    grounds:
    - validations priority 40 -> ERR_CASE_NOT_ACTIVE (409)
    - validations priority 50 -> ERR_ABSOLUTE_CONTRAINDICATION (422)
    excluded_because:
      difficulty_instance: closed_case_outranks_absolute_contraindication_on_administer
      rationale: The §1.8 instance already administers a thrombolytic to a CLOSED case that also carries a documented absolute contraindication and pins the answer to ERR_CASE_NOT_ACTIVE, including the 409-versus-422 status flip. Restating it here would duplicate the same two-rule conflict on the same endpoint.
  - name: an_offline_center_answers_equipment_offline_rather_than_agreement_window_closed
    claim_type: priority_ordering
    grounds:
    - validations priority 58 -> ERR_CENTER_EQUIPMENT_OFFLINE (409)
    - validations priority 65 -> ERR_AGREEMENT_WINDOW_CLOSED (409)
    excluded_because:
      difficulty_instance: equipment_offline_outranks_agreement_window_on_consult_request
      rationale: The §1.8 instance requests a consult at a centre whose equipment is OFFLINE under an agreement that has not yet taken effect and pins the answer to ERR_CENTER_EQUIPMENT_OFFLINE, then repairs each violation in turn. The window rule's own positive case is covered here by a_consult_cannot_be_requested_before_the_agreement_takes_effect.
  - name: a_suspended_agreement_cannot_carry_a_new_consult
    claim_type: cross_entity_validation
    grounds:
    - validations priority 66 -> ERR_AGREEMENT_NOT_ACTIVE (409)
    - state_machines.SpokeAgreement ACTIVE -> SUSPENDED -> ACTIVE
    excluded_because:
      difficulty_instance: consult_request_depends_on_spoke_agreement_active_state
      rationale: The §1.8 cross-entity instance already drives the agreement DRAFT -> ACTIVE -> SUSPENDED -> ACTIVE and shows the identical consult request failing and then succeeding purely because of the agreement's state, including the automatic ACTIVE -> TERMINATED expiry branch.
  - name: overlapping_report_periods_for_one_center_are_refused
    claim_type: temporal_validation
    grounds:
    - validations priority 68 -> ERR_REPORT_PERIOD_OVERLAP (409)
    excluded_because:
      difficulty_instance: report_period_half_open_adjacency_admitted_and_interior_conflict_detected
      rationale: 'The §1.8 resource-temporal-overlap instance covers the half-open interval semantics in full: an adjacent period sharing an endpoint is admitted while a period that overlaps by a single instant is refused, plus the SUPERSEDED exclusion from the conflict pool.'
  - name: a_neurologist_inside_the_cooldown_buffer_cannot_accept
    claim_type: temporal_validation
    grounds:
    - validations priority 69 -> ERR_NEUROLOGIST_COOLDOWN_ACTIVE (409)
    excluded_because:
      difficulty_instance: neurologist_cooldown_buffer_excludes_nine_minutes_and_admits_ten
      rationale: The §1.8 instance pins both sides of the positive-buffer boundary — an acceptance exactly 9 minutes after the previous completion is refused and exactly 10 minutes is admitted — which is strictly stronger than a single mid-buffer rejection.
  - name: an_amended_checklist_blocks_administration_until_it_is_re_determined
    claim_type: cascading_validation
    grounds:
    - validations priority 51 -> ERR_ELIGIBILITY_NOT_DETERMINED (409)
    - state_machines.ThrombolyticChecklist DETERMINED -> AMENDED
    excluded_because:
      difficulty_instance: administer_depends_on_checklist_determination_state_after_amendment
      rationale: The §1.8 cross-entity-state instance already amends a DETERMINED checklist, shows the previously permitted administration start failing with ERR_ELIGIBILITY_NOT_DETERMINED, and then re-determines to unblock it. The no-checklist-at-all variant of rule 51 is covered here by administering_without_any_checklist_determination_is_refused.
  - name: a_one_hundred_seventy_nine_second_session_does_not_satisfy_the_consult_record
    claim_type: violation_to_error
    grounds:
    - validations priority 48 -> ERR_NO_VALID_VIDEO_SESSION (409)
    - calculations.video_session_validity MIN_VALID_SESSION_SEC 180
    excluded_because:
      difficulty_instance: video_session_validity_boundary_at_one_eighty_and_one_seventy_nine_seconds
      rationale: The §1.8 boundary instance pins the duration clause at both 179 and 180 seconds. The quality and disconnect clauses of the same rule are covered here by a_consult_cannot_be_completed_on_audio_only_or_repeatedly_dropped_sessions.
- section: endpoints
  instances:
  - name: patching_a_center_touches_only_the_two_editable_fields
    claim_type: standard_crud
    grounds:
    - endpoints.PATCH /stroke-network/stroke-centers/{id} input [name?, ems_region_code?]
    - entities.StrokeCenter common_fields (version)
    distinguishing_aspect: This is the ONLY update endpoint in the whole API and it exposes exactly two of the StrokeCenter's twenty-odd fields. A partial body must leave the omitted field alone, an unknown key must be refused outright, and the write must still increment version even though PATCH carries no expected_version field of its own — StrokeCenter OCC is asserted by report creation, not by PATCH.
    test_recipe:
      setup:
      - Clock set to 2026-09-01T08:00:00Z; one SPOKE centre named 'Riverside Community Spoke' in EMS region CA-R1.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Riverside Community Spoke
          facility_type: SPOKE
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          pt_ctr: $.data.id
          pt_v0: $.data.version
          pt_ft0: $.data.facility_type
      trigger:
      - call: PATCH /stroke-network/stroke-centers/${pt_ctr}
        payload:
          name: Riverside Regional Spoke
        as: ProgramCoordinator
        captures:
          pt_name1: $.data.name
          pt_reg1: $.data.ems_region_code
          pt_v1: $.data.version
          pt_ft1: $.data.facility_type
          pt_cert1: $.data.certification_status
      - call: PATCH /stroke-network/stroke-centers/${pt_ctr}
        payload:
          ems_region_code: CA-R4
        as: ProgramCoordinator
        captures:
          pt_name2: $.data.name
          pt_reg2: $.data.ems_region_code
          pt_v2: $.data.version
      - call: PATCH /stroke-network/stroke-centers/${pt_ctr}
        payload:
          facility_type: HUB_PRIMARY
        as: ProgramCoordinator
        captures:
          pt1_id: $.data.error_id
          pt1_msg: $.data.message
      - call: PATCH /stroke-network/stroke-centers/${pt_ctr}
        payload:
          certification_status: CERTIFIED
        as: ProgramCoordinator
        captures:
          pt2_id: $.data.error_id
          pt2_msg: $.data.message
      - call: GET /stroke-network/stroke-centers/${pt_ctr}
        as: ProgramCoordinator
        captures:
          pt_name3: $.data.name
          pt_reg3: $.data.ems_region_code
          pt_v3: $.data.version
          pt_ft3: $.data.facility_type
      - call: GET /stroke-network/stroke-centers/11111111-1111-4111-8111-111111111111
        as: ProgramCoordinator
        captures:
          pt_gone: $.data.error_id
      assert:
      - 'the name-only patch renames and leaves the region: ${pt_name1} == Riverside Regional Spoke with ${pt_reg1} == CA-R1'
      - ${pt_v1} == ${pt_v0} + 1 — a partial update is still a version-bearing write
      - '${pt_ft1} == ${pt_ft0} == SPOKE and ${pt_cert1} == PROVISIONAL: no other field moved'
      - 'the region-only patch keeps the new name: ${pt_name2} == Riverside Regional Spoke, ${pt_reg2} == CA-R4, ${pt_v2} == ${pt_v1} + 1'
      - patching facility_type gives ${pt1_id} == ERR_INVALID_REQUEST and patching certification_status gives ${pt2_id} == ERR_INVALID_REQUEST — neither is an editable field
      - ${pt_name3}, ${pt_reg3} and ${pt_ft3} confirm the refusals wrote nothing and ${pt_v3} == ${pt_v2}
      - ${pt_gone} == ERR_CENTER_NOT_FOUND for an unknown id, proving the 404 path is distinct from the 422 path
  - name: the_logical_clock_endpoint_supplies_every_system_timestamp
    claim_type: action_endpoint
    grounds:
    - endpoints.POST /_clock/set_current_utc input [current_utc] output None
    - entities.CodeStrokeCase.imaging_at, entities.CodeStrokeCase.door_to_imaging_minutes
    distinguishing_aspect: The clock endpoint is the only write in the API that returns NO entity, and every system and computed timestamp must read from it rather than from wall time. The pointed contrast is door_at, which is INPUT and therefore may sit before the clock, versus imaging_at, which is SYSTEM and must equal the clock exactly — and the derived interval must be measured between the two.
    test_recipe:
      setup:
      - An empty database; the clock has not been set yet in this test.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Riverside Community Spoke
          facility_type: SPOKE
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          ck_ctr: $.data.id
          ck_ca: $.data.created_at
          ck_ua: $.data.updated_at
      trigger:
      - call: POST /stroke-network/code-strokes
        payload:
          center_id: ${ck_ctr}
          patient_ref: P-CK-001
          door_at: '2026-09-01T07:30:00Z'
          lkw_precision: EXACT
          arrival_mode: EMS
          last_known_well_at: '2026-09-01T07:10:00Z'
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          ck_case: $.data.id
          ck_ca2: $.data.created_at
          ck_door: $.data.door_at
          ck_act: $.data.activation_at
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T09:00:00Z'
        as: EdPhysician
      - call: POST /stroke-network/code-strokes/${ck_case}/imaging-complete
        payload:
          imaging_modality: CT_NON_CONTRAST
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          ck_img: $.data.imaging_at
          ck_dti: $.data.door_to_imaging_minutes
          ck_ua2: $.data.updated_at
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T10:00:00Z'
        as: QualityAbstractor
      - call: GET /stroke-network/code-strokes/${ck_case}
        as: EdPhysician
        captures:
          ck_img2: $.data.imaging_at
          ck_dti2: $.data.door_to_imaging_minutes
      assert:
      - the clock call itself returns a success envelope with no entity body — nothing may be captured from it
      - '${ck_ca} == ${ck_ua} == 2026-09-01T08:00:00Z: creation stamps come from the clock, not from wall time'
      - ${ck_ca2} == 2026-09-01T08:00:00Z while ${ck_door} == 2026-09-01T07:30:00Z — an INPUT instant may precede the clock
      - '${ck_act} == 2026-09-01T08:00:00Z: activation_at is a SYSTEM field and follows the clock, not door_at'
      - after advancing the clock ${ck_img} == 2026-09-01T09:00:00Z and ${ck_ua2} == 2026-09-01T09:00:00Z
      - ${ck_dti} == 90 — measured from door_at 07:30 to imaging_at 09:00, so the interval spans an input instant and a clock instant
      - 'advancing the clock again changes nothing already stamped: ${ck_img2} == ${ck_img} and ${ck_dti2} == ${ck_dti}'
      - the endpoint is callable by every one of the six roles, as the EdPhysician and QualityAbstractor calls above show
  - name: granting_a_proxy_credential_requires_both_sides_to_exist_and_makes_the_neurologist_routable
    claim_type: cross_reference_link
    grounds:
    - endpoints.POST /stroke-network/spoke-agreements/{id}/proxy-credentials
    - errors ERR_AGREEMENT_NOT_FOUND, ERR_NEUROLOGIST_NOT_FOUND
    - calculations.consult_routing_selection STEP 1 clause (5)
    distinguishing_aspect: 'The junction write names one entity in the PATH and the other in the BODY, so it has two distinct 404 paths that must not be conflated. More importantly the link is not cosmetic: before the grant the routing selector finds NO eligible neurologist and escalates the consult, and after the grant the same request assigns him — the association is observable only through a third entity.'
    test_recipe:
      setup:
      - Clock walked from 2026-09-01T08:00:00Z; hub, spoke and an ACTIVE SpokeAgreement with an EMPTY proxy_credentials array.
      - One board-certified Neurologist homed at the hub, ON_CALL, licensed in CA, roster_rank 10, with NO proxy credential yet.
