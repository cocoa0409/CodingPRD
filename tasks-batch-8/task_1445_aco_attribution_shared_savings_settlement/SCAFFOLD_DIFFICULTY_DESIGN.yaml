      - name: flag_then_auto_dismiss_conserves_flagged_review_count
        grounds:
          - calculations.high_cost_flag_threshold
          - state_machines.HighCostReview.FLAGGED_to_DISMISSED
        distinguishing_aspect: |
          Conserved quantity: COUNT of FLAGGED reviews (a cardinality, not a money field).
          Adjudications crossing 10000000 raise the count 0 -> 1; voiding back below the
          threshold auto-dismisses (THRESHOLD_FALLEN) and restores the count to exactly 0 —
          no residual FLAGGED review remains.
        test_recipe:
          setup:
            - "Period OPEN; beneficiary BH with claims 6000000 and 4000000 (both PART_A)"
          setup_api_calls:
            - { call: "POST /aco/agreement-periods", payload: { aco_tax_id: "ACO-FD", aco_name: "FD", performance_start_date: "2026-01-01", performance_end_date: "2026-12-31", track: "ONE_SIDED" }, as: AcoAdministrator, captures: { p1: $.data.id } }
            - { call: "POST /aco/participants", payload: { agreement_period_id: "${p1}", tin: "100000001", legal_name: "PA", share_weight_bp: 10000 }, as: AcoAdministrator, captures: { pa: $.data.id } }
            - { call: "POST /aco/beneficiaries", payload: { medicare_id: "MBI-FD-1", birth_year: 1980 }, as: AcoAdministrator, captures: { bh: $.data.id } }
            - { call: "POST /aco/agreement-periods/${p1}/open", payload: {}, as: AcoAdministrator }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${bh}", participant_id: "${pa}", service_date: "2026-02-01", allowed_amount_cents: 6000000, claim_type: "PART_A" }, as: ClaimsProcessor, captures: { c1: $.data.id } }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${bh}", participant_id: "${pa}", service_date: "2026-03-01", allowed_amount_cents: 4000000, claim_type: "PART_A" }, as: ClaimsProcessor, captures: { c2: $.data.id } }
          trigger:
            - { call: "POST /aco/claims/${c1}/adjudicate", payload: {}, as: ClaimsProcessor }
            - { call: "POST /aco/claims/${c2}/adjudicate", payload: {}, as: ClaimsProcessor }
            - { call: "GET /aco/high-cost-reviews?beneficiary_id=${bh}", as: AcoAdministrator, captures: { hcr: "$.data[0].id", hcr_status1: "$.data[0].status" } }
            - { call: "POST /aco/claims/${c2}/void", payload: { reason: "duplicate submission" }, as: ClaimsProcessor }
            - { call: "GET /aco/high-cost-reviews/${hcr}", as: AcoAdministrator, captures: { hcr_status2: $.data.status, hcr_reason: $.data.dismissal_reason } }
          assert:
            - "hcr_status1 == 'FLAGGED'  (count of FLAGGED reviews went 0 -> 1 at the crossing)"
            - "hcr_status2 == 'DISMISSED' AND hcr_reason == 'THRESHOLD_FALLEN'  (compensating void restores the count to 0)"
            - "GET /aco/high-cost-reviews?agreement_period_id=${p1}&status=FLAGGED returns an empty list (total_count == 0)"
