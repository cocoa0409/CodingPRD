            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2026-08-01", check_out_date: "2026-08-29", expected_site_version: "${site_v0}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id, dep_due: $.data.deposit_due_cents, sc: $.data.stay_class }
            - call: "POST /reservations/${res_id}/payments"
              payload: { type: "DEPOSIT", amount_cents: "${dep_due}" }
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
          trigger:
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
              captures: { ps: $.data.payment_status }
          assert:
            - "Reservation.${res_id}.stay_class == LONG_TERM"
            - "Reservation.${res_id}.reservation_status == CANCELLED"
            - "Reservation.${res_id}.payment_status == DEPOSIT_PAID (no refund issued; deposit non-refundable)"
            - "No REFUND Payment exists for Reservation.${res_id}"

