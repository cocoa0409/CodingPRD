# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Domain: museum-exhibit-design-fabrication (task_2583)
# Every instance grounds exclusively in SCAFFOLD.yaml §1.1-§1.7. Deleting this
# file would not change one byte of declared behaviour; it only makes the
# coverage audit harder.
#
# Shared literals used across instances (all pinned, never derived at test time):
#   logical clock default ........ 2026-08-01T00:00:00Z
#   contract_value_cents ......... 9000000
#   passing design package ....... egress 112 / turn 76 / peak 180 / area 95.0
#                                  -> flow_capacity_score 81.20, accessibility_pass true
#   panel [Curator, Conservator, ProjectManager] -> required_vote_count 2
#   user ids ..................... pm-01 (ProjectManager), cur-01 (Curator),
#                                  con-01 (Conservator), fab-01 (FabricationLead),
#                                  ops-01 (MuseumOperations), acc-01 (AccessibilitySpecialist)

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: fabrication_estimate_versus_shop_actual_on_one_drawing
        grounds:
          - calculations.fabrication_cost_estimate
          - entities.ShopDrawing.fields.estimate_total_cents
          - entities.ShopDrawing.fields.actual_cost_cents
          - entities.ExhibitProject.fields.committed_fabrication_cents
        distinguishing_aspect: |
          The two variants read the SAME ShopDrawing row and differ only in the
          labor_multiplier (1.15 schematic contingency vs 1.00) and the waste
          factor (1.20 vs the shop's actual 1.00), so identical hours and area
          yield estimate_total_cents 447810 and actual_cost_cents 380726 - a
          67084-cent divergence - and only the actual variant moves the ledger.
        test_recipe:
          setup:
            - "project in phase FABRICATION with contract_value_cents 9000000 and an untouched ledger (uncommitted 9000000)"
            - "one Interactive at PROTOTYPE_APPROVED to be the drawing's subject"
            - "one MaterialSpec used_in INTERACTIVE_HOUSING at status APPROVED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
              payload: { name: "Deep Time Hall", museum_name: "Ridgeline Museum", storyline_title: "Deep Time: Reading the Rock Record", objective_codes: ["OBJ-STRATA", "OBJ-EXTINCTION"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 9000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj: $.data.id }
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "SCHEMATIC" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj_v2: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${proj_v2}", stage: "SCHEMATIC", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 180, circulation_area_sqm: 95.0 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { pkg1: $.data.id }
            - call: "POST /design-packages/${pkg1}/review-rounds"
              payload: { panel_roles: ["Curator", "Conservator", "ProjectManager"], decision_deadline_at: "2026-08-20T00:00:00Z" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { rnd1: $.data.id }
            - call: "POST /review-rounds/${rnd1}/votes"
              payload: { decision: "APPROVE" }
              as: Curator
              as_user_id: cur-01
            - call: "POST /review-rounds/${rnd1}/votes"
              payload: { decision: "APPROVE" }
              as: Conservator
              as_user_id: con-01
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "DESIGN_DEV" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj_v3: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${proj_v3}", stage: "DESIGN_DEV", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 180, circulation_area_sqm: 95.0 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { pkg2: $.data.id }
            - call: "POST /design-packages/${pkg2}/review-rounds"
              payload: { panel_roles: ["Curator", "Conservator", "ProjectManager"], decision_deadline_at: "2026-08-20T00:00:00Z" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { rnd2: $.data.id }
            - call: "POST /review-rounds/${rnd2}/votes"
              payload: { decision: "APPROVE" }
              as: Curator
              as_user_id: cur-01
            - call: "POST /review-rounds/${rnd2}/votes"
              payload: { decision: "APPROVE" }
              as: Conservator
              as_user_id: con-01
            - call: "POST /exhibit-projects/${proj}/interactives"
              payload: { code: "INT-STRATA", kind: "TOUCHSCREEN", objective_code: "OBJ-STRATA", expected_daily_uses: 150, duty_hours_per_day: 6.0, mtbf_cycles: 1200000, parts_availability_years: 10, warranty_months: 24 }
              as: FabricationLead
              as_user_id: fab-01
              captures: { int1: $.data.id }
            - call: "POST /exhibit-projects/${proj}/interactives"
              payload: { code: "INT-EXT", kind: "AUDIO", objective_code: "OBJ-EXTINCTION", expected_daily_uses: 40, duty_hours_per_day: 4.0, mtbf_cycles: 2000000, parts_availability_years: 10, warranty_months: 24 }
              as: FabricationLead
              as_user_id: fab-01
              captures: { int2: $.data.id }
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "FABRICATION" }
              as: ProjectManager
              as_user_id: pm-01
            - call: "POST /interactives/${int1}/submit-prototype"
              payload: { measured_daily_uses: 60, measured_mtbf_cycles: 1500000 }
              as: FabricationLead
              as_user_id: fab-01
            - call: "POST /interactives/${int1}/prototype-decision"
              payload: { decision: "APPROVE" }
              as: ProjectManager
              as_user_id: pm-01
            - call: "POST /exhibit-projects/${proj}/material-specs"
              payload: { material_name: "Powder-coated aluminium housing", used_in: "INTERACTIVE_HOUSING", oddy_test_result: "PASS", voc_mg_per_m2_day: 0.12, formaldehyde_ppm: 0.02, cure_days: 14 }
              as: FabricationLead
              as_user_id: fab-01
              captures: { mat1: $.data.id }
            - call: "POST /material-specs/${mat1}/submit-for-conservation"
              payload: {}
              as: FabricationLead
              as_user_id: fab-01
            - call: "POST /material-specs/${mat1}/conservator-decision"
              payload: { decision: "APPROVE" }
              as: Conservator
              as_user_id: con-01
          trigger:
            - call: "POST /shop-drawings"
              payload: { project_id: "${proj}", material_spec_id: "${mat1}", drawing_number: "SD-101", complexity_tier: "PRECISION", shop_hours: 12.5, material_area_m2: 3.7, finish_grade: "MUSEUM_GLOSS", subject_interactive_id: "${int1}" }
              as: FabricationLead
              as_user_id: fab-01
              captures: { dwg1: $.data.id, est_total: $.data.estimate_total_cents }
            - call: "POST /shop-drawings/${dwg1}/start-review"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
            - call: "POST /shop-drawings/${dwg1}/decision"
              payload: { decision: "APPROVE", actual_shop_hours: 12.5, actual_waste_factor: 1.0 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { act_total: $.data.actual_cost_cents }
            - call: "GET /exhibit-projects/${proj}"
              as: ProjectManager
              as_user_id: pm-01
          assert:
            - "the create response has estimate_labor_cents == 208438, estimate_material_cents == 210900, estimate_finishing_cents == 28472, estimate_total_cents == 447810"
            - "the decision response has actual_labor_cents == 181250, actual_material_cents == 175750, actual_finishing_cents == 23726, actual_cost_cents == 380726"
            - "${est_total} - ${act_total} == 67084"
            - "GET /exhibit-projects/${proj} shows committed_fabrication_cents == 380726 and uncommitted_cents == 8619274 - the schematic estimate never touched the ledger"
            - "retainage_held_cents == 0, warranty_reserve_cents == 0, released_cents == 0, and 8619274 + 380726 + 0 + 0 + 0 == 9000000"

      - name: durability_index_spec_versus_prototype_verified_moves_maintenance_tier
        grounds:
          - calculations.interactive_durability_index
          - entities.Interactive.fields.durability_index_spec
          - entities.Interactive.fields.durability_index_verified
          - entities.Interactive.fields.maintenance_tier
          - validations[priority=76]
        distinguishing_aspect: |
          Same Interactive row, but the spec variant reads expected_daily_uses /
          mtbf_cycles with prototype_credit 0 while the verified variant reads
          measured_daily_uses / measured_mtbf_cycles with credit 8; the score
          moves 70.60 -> 87.58 and maintenance_tier moves MEDIUM -> LOW, which
          in turn lowers the warranty term validation priority 76 enforces from
          24 months to 12.
        test_recipe:
          setup:
            - "project in phase INTERPRETIVE is enough - interactives may be specified from the first phase"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
              payload: { name: "Deep Time Hall", museum_name: "Ridgeline Museum", storyline_title: "Deep Time: Reading the Rock Record", objective_codes: ["OBJ-STRATA", "OBJ-EXTINCTION"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 9000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /exhibit-projects/${proj}/interactives"
              payload: { code: "INT-STRATA", kind: "TOUCHSCREEN", objective_code: "OBJ-STRATA", expected_daily_uses: 150, duty_hours_per_day: 6.0, mtbf_cycles: 1200000, parts_availability_years: 10, warranty_months: 12 }
              as: FabricationLead
              as_user_id: fab-01
              captures: { int1: $.data.id, spec_idx: $.data.durability_index_spec, spec_tier: $.data.maintenance_tier }
            - call: "POST /interactives/${int1}/submit-prototype"
              payload: { measured_daily_uses: 60, measured_mtbf_cycles: 1500000 }
              as: FabricationLead
              as_user_id: fab-01
            - call: "POST /interactives/${int1}/prototype-decision"
              payload: { decision: "APPROVE" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { ver_idx: $.data.durability_index_verified, ver_tier: $.data.maintenance_tier }
          assert:
            - "${spec_idx} == 70.60 (wear 0.55 * 24.0 = 13.20, kind 0.9 * 18 = 16.20, parts 0, no credit)"
            - "${spec_tier} == MEDIUM"
            - "${ver_idx} == 87.58 (wear 0.55 * 7.68 = 4.224, kind 16.20, parts 0, credit +8, rounded half-up to 2dp)"
            - "${ver_tier} == LOW - the tier is re-derived from durability_index_verified once it is non-null"
            - "durability_index_spec is still exactly 70.60 after the approval; the verified value does not overwrite it"

      - name: verified_index_can_degrade_the_tier_and_raise_the_required_warranty
        grounds:
          - calculations.interactive_durability_index
          - validations[priority=76]
          - errors[ERR_WARRANTY_TERM_TOO_SHORT]
          - state_machines.Interactive.FABRICATED_to_COMMISSIONED
        distinguishing_aspect: |
          The reconciliation direction is reversed relative to the previous
          instance: measured figures WORSE than spec (900 uses/day against a
          300000-cycle MTBF) drive the wear ratio to 3.84, which the
          WEAR_PENALTY_CAP of 60.0 clamps, moving the tier LOW -> MEDIUM and
          making a warranty_months of 12 that was legal at specification time
          illegal at commissioning time.
        test_recipe:
          setup:
            - "project in phase COMMISSIONING is not required for the tier move; only the commission call needs it, so this instance asserts the tier and then probes the term rule with the interactive at FABRICATED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
              payload: { name: "Deep Time Hall", museum_name: "Ridgeline Museum", storyline_title: "Deep Time: Reading the Rock Record", objective_codes: ["OBJ-STRATA", "OBJ-EXTINCTION"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 9000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj: $.data.id }
            - call: "POST /exhibit-projects/${proj}/interactives"
              payload: { code: "INT-EXT", kind: "AUDIO", objective_code: "OBJ-EXTINCTION", expected_daily_uses: 40, duty_hours_per_day: 4.0, mtbf_cycles: 2000000, parts_availability_years: 10, warranty_months: 12 }
              as: FabricationLead
              as_user_id: fab-01
              captures: { int2: $.data.id, spec_idx: $.data.durability_index_spec, spec_tier: $.data.maintenance_tier }
            - call: "POST /interactives/${int2}/submit-prototype"
              payload: { measured_daily_uses: 900, measured_mtbf_cycles: 300000 }
              as: FabricationLead
              as_user_id: fab-01
          trigger:
            - call: "POST /interactives/${int2}/prototype-decision"
              payload: { decision: "APPROVE" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { ver_idx: $.data.durability_index_verified, ver_tier: $.data.maintenance_tier }
          assert:
            - "${spec_idx} == 91.39 and ${spec_tier} == LOW (wear 0.55 * 2.56 = 1.408, kind 0.9 * 8 = 7.20, parts 0)"
            - "${ver_idx} == 67.80 - the uncapped wear penalty would be 0.55 * 384 = 211.2 and would drive the score negative, so the WEAR_PENALTY_CAP of 60.0 is load-bearing: 100 - 33.00 - 7.20 - 0 + 8 == 67.80"
            - "${ver_tier} == MEDIUM, so MIN_WARRANTY_MONTHS_BY_TIER now demands 24 while the stored warranty_months is still 12"
            - "warranty_months on the row is unchanged at 12 - the tier move does not silently repair the warranty term"

  - rule_id: combinatorial_formula
    instances:
      - name: per_line_item_rounding_order_changes_the_drawing_total
        grounds:
          - calculations.fabrication_cost_estimate
          - entities.ShopDrawing.fields.estimate_total_cents
        distinguishing_aspect: |
          The pinned order is round-each-line-item-then-sum. With shop_hours 12.5
          the labor line lands on exactly 208437.5 and the finishing line on
          exactly 28471.5; rounding each half-up first gives 208438 + 210900 +
          28472 == 447810, whereas summing the unrounded lines (447809.0) and
          rounding once gives 447809. The one-cent gap is the whole claim.
        test_recipe:
          setup:
            - "project in phase FABRICATION, one PROTOTYPE_APPROVED interactive, one APPROVED MaterialSpec used_in INTERACTIVE_HOUSING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
              payload: { name: "Deep Time Hall", museum_name: "Ridgeline Museum", storyline_title: "Deep Time: Reading the Rock Record", objective_codes: ["OBJ-STRATA", "OBJ-EXTINCTION"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 9000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj: $.data.id }
            - call: "POST /exhibit-projects/${proj}/advance-phase"
