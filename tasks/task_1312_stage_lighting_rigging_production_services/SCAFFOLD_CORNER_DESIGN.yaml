            - { call: "POST /api/productions/${p1}/plots", payload: { title: "Rig v1", expected_production_version: "${pv1}" }, as: ProductionManager, captures: { pl1: $.data.id } }
            - { call: "POST /api/productions/${p1}/plots", payload: { title: "Rig v2", expected_production_version: "${pv1}" }, as: ProductionManager, captures: { err: $.data.error_id } }
          assert:
            - "first plot create succeeds (production advances to version 3)"
            - "second create with the previously observed version returns error_id ERR_STALE_VERSION (HTTP 412)"

