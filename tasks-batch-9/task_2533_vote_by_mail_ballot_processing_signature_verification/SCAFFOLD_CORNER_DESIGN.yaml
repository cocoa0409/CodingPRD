  - section: errors
    instances:
      - name: missing_or_unknown_role_header_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "The priority-1 auth gate fires before the priority-2 role gate: an absent X-User-Role header and a header carrying a role outside the five declared roles both return 401 ERR_UNAUTHENTICATED, not 403 ERR_ROLE_FORBIDDEN."
        test_recipe:
          setup:
            - "Election e1 exists; the request carries no X-User-Role header, then one carrying the undeclared role BallotClerk."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
          trigger:
            - call: "GET /vote-by-mail/elections/${e1}"
              payload: {}
              as: "<absent>"
              captures: { unauth_err: $.data.error_id }
            - call: "GET /vote-by-mail/elections/${e1}"
              payload: {}
              as: BallotClerk
              captures: { unknown_role_err: $.data.error_id }
          assert:
            - "No X-User-Role header: HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\""
            - "X-User-Role: BallotClerk: HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\" (undeclared role is an auth failure, not a role failure)"
            - "The same GET as ElectionsClerk returns HTTP 200 with data.id == ${e1}"

      - name: unknown_reviewer_ids_return_reviewer_not_found
        claim_type: Violation → Error
        grounds:
          - errors[ERR_REVIEWER_NOT_FOUND]
          - validations[ERR_REVIEWER_NOT_FOUND]
          - endpoints[POST /vote-by-mail/return-envelopes/{id}/remakes]
        distinguishing_aspect: "Both a direct reviewer read and a remake naming an unknown team_member_b_reviewer_id return 404 ERR_REVIEWER_NOT_FOUND — the priority-4 existence check on the remake body runs before the priority-10 bipartisan-team check, so a bogus id never surfaces as ERR_REMAKE_TEAM_NOT_BIPARTISAN."
        test_recipe:
          setup:
            - "Envelope en1 SEALED and UNVERIFIED; rvB exists; the id 00000000-0000-0000-0000-0000000000aa matches no Reviewer."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_reviewer_b
            - *c_request1
            - *c_av1_lookup
            - *c_av1_same
            - *c_approve1
            - *c_batch1
            - *c_packet1
            - *c_seal1
            - *c_dispatch1
            - *c_clock_nov3
            - *c_envelope1
          trigger:
            - call: "GET /vote-by-mail/reviewers/00000000-0000-0000-0000-0000000000aa"
              payload: {}
              as: ElectionsAdmin
              captures: { reviewer_get_err: $.data.error_id }
            - call: "POST /vote-by-mail/return-envelopes/${en1}/remakes"
              payload: { team_member_a_reviewer_id: "${rvB}", team_member_b_reviewer_id: "00000000-0000-0000-0000-0000000000aa", reason_code: "DAMAGED", session_start_at: "2026-11-03T13:00:00Z", session_end_at: "2026-11-03T14:00:00Z", expected_envelope_version: "${en1_v}" }
              as: CanvassSupervisor
              captures: { remake_member_err: $.data.error_id }
          assert:
            - "Reviewer read: HTTP 404 with data.error_id == \"ERR_REVIEWER_NOT_FOUND\""
            - "Remake: HTTP 404 with data.error_id == \"ERR_REVIEWER_NOT_FOUND\" (not ERR_REMAKE_TEAM_NOT_BIPARTISAN)"
            - "GET /vote-by-mail/remake-records?original_envelope_id=${en1} returns total_count == 0"
            - "GET /vote-by-mail/return-envelopes/${en1} returns version == ${en1_v} and custody_status == \"SEALED\""

      - name: separation_run_with_an_unknown_envelope_id_returns_envelope_not_found
        claim_type: Violation → Error
        grounds:
          - errors[ERR_ENVELOPE_NOT_FOUND]
          - validations[ERR_ENVELOPE_NOT_FOUND]
          - endpoints[POST /vote-by-mail/elections/{id}/separation-runs]
        distinguishing_aspect: "The array elements are resolved in order, so a run of [en1, unknown] returns 404 ERR_ENVELOPE_NOT_FOUND before the priority-11 secrecy-pool cardinality rule can reject the two-element list, and en1 is left SEALED."
        test_recipe:
          setup:
            - "Election e1 in RECEIVING with one SEALED envelope en1; the id 00000000-0000-0000-0000-0000000000bb matches no ReturnEnvelope."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_request1
            - *c_av1_lookup
            - *c_av1_same
            - *c_approve1
            - *c_batch1
            - *c_packet1
            - *c_seal1
            - *c_dispatch1
            - *c_clock_nov3
            - *c_envelope1
          trigger:
            - call: "POST /vote-by-mail/elections/${e1}/separation-runs"
              payload: { return_envelope_ids: ["${en1}", "00000000-0000-0000-0000-0000000000bb"] }
              as: CanvassSupervisor
              captures: { envelope_missing_err: $.data.error_id }
          assert:
            - "HTTP 404; data.error_id == \"ERR_ENVELOPE_NOT_FOUND\" (not ERR_BALLOT_SECRECY_POOL_TOO_SMALL)"
            - "GET /vote-by-mail/return-envelopes/${en1} returns custody_status == \"SEALED\" and separation_run_sequence == null"
            - "GET /vote-by-mail/elections/${e1} returns separation_run_sequence == 0"

      - name: cure_notice_on_an_accepted_envelope_returns_signature_state_invalid
        claim_type: Violation → Error
        grounds:
          - errors[ERR_ENVELOPE_SIGNATURE_STATE_INVALID]
          - validations[ERR_ENVELOPE_SIGNATURE_STATE_INVALID]
          - endpoints[POST /vote-by-mail/return-envelopes/{id}/cure-notices]
        distinguishing_aspect: "Cure issuance requires signature_status == CURE_REQUIRED and a further review round requires UNVERIFIED or ESCALATED; on an ACCEPTED envelope both return 409 ERR_ENVELOPE_SIGNATURE_STATE_INVALID and Election.open_cure_count stays 0."
        test_recipe:
          setup:
            - "Envelope en1 ACCEPTED by rv1's round-1 MATCH decision at similarity 80."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
