scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: withdrawal_fee_instant_vs_standard_on_withdrawal
        grounds:
          - calculations.withdrawal_fee
          - entities.Withdrawal.fields.fee_cents
          - entities.Withdrawal.fields.net_amount_cents
          - state_machines.Withdrawal.REQUESTED_to_PAID
        distinguishing_aspect: |
          Same gross 10000c on the Withdrawal entity: INSTANT yields fee_cents=175 / net=9825 while
          STANDARD yields fee_cents=0 / net=10000 — two valid speed variants diverge on the same input.
        test_recipe:
          setup:
            - "Two ACTIVE Accounts A (sender) each with a VERIFIED FundingSource and available_balance_cents=500000."
            - "Clock pinned so all actions share one instant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "a_inst@x.com", display_name: "A Inst" }
              as: PlatformAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /_ledger/seed_credit"
              payload: { account_id: "${a1_id}", amount_cents: 500000, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /funding-sources"
              payload: { account_id: "${a1_id}", kind: "BANK", last4: "1111" }
              as: AccountHolder
              as_user_id: "${a1_id}"
              captures: { fs1_id: $.data.id, fs1_code: $.data.micro_deposit_code }
            - call: "POST /funding-sources/${fs1_id}/verify"
              payload: { code: "${fs1_code}" }
              as: AccountHolder
              as_user_id: "${a1_id}"
            - call: "GET /accounts/${a1_id}"
              payload: {}
              as: AccountHolder
              as_user_id: "${a1_id}"
              captures: { a1_v: $.data.version }
          trigger:
            - call: "POST /withdrawals"
              payload: { account_id: "${a1_id}", funding_source_id: "${fs1_id}", gross_amount_cents: 10000, speed: "INSTANT", expected_account_version: "${a1_v}" }
              as: AccountHolder
              as_user_id: "${a1_id}"
              captures: { w_inst_id: $.data.id }
          assert:
            - "Withdrawal.${w_inst_id}.fee_cents == 175"
            - "Withdrawal.${w_inst_id}.net_amount_cents == 9825"
            - "Withdrawal.${w_inst_id}.status == PAID"

      - name: risk_score_update_increase_vs_decrease_on_account
        grounds:
          - calculations.risk_score_update
          - entities.Account.fields.risk_score
          - entities.Account.fields.risk_tier
          - state_machines.RiskHold.PENDING_REVIEW_to_BLOCKED
          - state_machines.Dispute.OPEN_to_DENIED
        distinguishing_aspect: |
          On the Account entity (a different domain than Withdrawal): the increase variant (+20 when a hold on
          sender O is BLOCKED) raises O.risk_score to 20, then the decrease variant (-10 when O's later dispute
          is DENIED) lowers it to 10 — both signed deltas of risk_score_update applied to the same Account.
        test_recipe:
          setup:
            - "Opener/sender Account O starts at risk_score 0; verified recipient R; O has ample balance; clock fixed."
            - "O first incurs +20 via a BLOCKED hold on a LARGE_AMOUNT send (O->R, 100000c), then a small SETTLED send (O->R, 2000c) it later disputes; ComplianceOfficer not a party."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "o@x.com", display_name: "O" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "r@x.com", display_name: "R" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /_ledger/seed_credit"
              payload: { account_id: "${o_id}", amount_cents: 500000, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /recipient-verifications"
              payload: { account_id: "${r_id}", channel: "EMAIL" }
              as: AccountHolder
              as_user_id: "${r_id}"
              captures: { rv_id: $.data.id, rv_tok: $.data.confirm_token }
            - call: "POST /recipient-verifications/${rv_id}/confirm"
              payload: { token: "${rv_tok}" }
              as: AccountHolder
              as_user_id: "${r_id}"
            - call: "POST /transfers"
              payload: { sender_account_id: "${o_id}", recipient_account_id: "${r_id}", amount_cents: 100000 }
              as: AccountHolder
              as_user_id: "${o_id}"
              captures: { t_held_id: $.data.id, held_hold_id: $.data.hold_id }
            - call: "POST /risk-holds/${held_hold_id}/block"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /transfers"
              payload: { sender_account_id: "${o_id}", recipient_account_id: "${r_id}", amount_cents: 2000 }
              as: AccountHolder
              as_user_id: "${o_id}"
              captures: { t_dis2_id: $.data.id }
            - call: "POST /disputes"
              payload: { transfer_id: "${t_dis2_id}", opener_account_id: "${o_id}", reason: "NOT_RECEIVED" }
              as: AccountHolder
              as_user_id: "${o_id}"
              captures: { dis2_id: $.data.id }
          trigger:
            - call: "POST /disputes/${dis2_id}/deny"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "Account.${o_id}.risk_score == 10"
            - "Account.${o_id}.risk_tier == LOW"
            - "Dispute.${dis2_id}.status == DENIED"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: transfer_limit_nested_min_across_two_windows
        grounds:
          - calculations.transfer_limit_check
          - entities.Account.fields.daily_send_limit_cents
          - entities.Account.fields.weekly_send_limit_cents
          - validations[priority=13]
          - validations[priority=14]
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs and non-linear interaction: effective_remaining =
          min(daily_send_limit-daily_used, weekly_send_limit-weekly_used). With weekly tightened to
          120000 and 100000 already used this week (daily window empty), weekly is binding:
          remaining=20000, a send of 25000 is rejected ERR_WEEKLY_LIMIT_EXCEEDED even though daily has room.
        test_recipe:
          setup:
            - "Sender S has daily_send_limit_cents=250000, weekly_send_limit_cents=120000, balance 500000."
            - "6 days ago S sent 100000 to verified R (counts in weekly window, NOT in 24h daily window)."
            - "Clock now = 2026-06-08T00:00:00Z; the 100000 send was at 2026-06-02T00:00:00Z (>24h ago, <7d ago)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s_lim@x.com", display_name: "S Lim", daily_send_limit_cents: 250000, weekly_send_limit_cents: 120000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "r_lim@x.com", display_name: "R Lim" }
              as: PlatformAdmin
              captures: { rl_id: $.data.id }
            - call: "POST /_ledger/seed_credit"
              payload: { account_id: "${s_id}", amount_cents: 500000, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /recipient-verifications"
              payload: { account_id: "${rl_id}", channel: "EMAIL" }
              as: AccountHolder
              as_user_id: "${rl_id}"
              captures: { rvl_id: $.data.id, rvl_tok: $.data.confirm_token }
            - call: "POST /recipient-verifications/${rvl_id}/confirm"
              payload: { token: "${rvl_tok}" }
              as: AccountHolder
              as_user_id: "${rl_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /transfers"
              payload: { sender_account_id: "${s_id}", recipient_account_id: "${rl_id}", amount_cents: 100000 }
              as: AccountHolder
              as_user_id: "${s_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /transfers"
              payload: { sender_account_id: "${s_id}", recipient_account_id: "${rl_id}", amount_cents: 25000 }
              as: AccountHolder
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_WEEKLY_LIMIT_EXCEEDED"

      - name: split_share_largest_remainder_rounding_order
        grounds:
          - calculations.split_share_allocation
          - entities.SplitParticipant.fields.share_amount_cents
          - entities.SplitRequest.fields.total_amount_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: WEIGHTED total 10000c over weights [1,2,3]
          floors to [1666,3333,5000] (sum 9999), then the 1 leftover cent goes to the largest
          fractional remainder (participant weight=1, raw 1666.67) yielding [1667,3333,5000];
          'floor-then-distribute-leftover' differs from 'round-each' which would not sum to 10000.
        test_recipe:
          setup:
            - "Organizer ORG and three participant accounts P1(weight1), P2(weight2), P3(weight3) created in that order."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "org@x.com", display_name: "ORG" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "p1@x.com", display_name: "P1" }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "p2@x.com", display_name: "P2" }
              as: PlatformAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "p3@x.com", display_name: "P3" }
              as: PlatformAdmin
              captures: { p3_id: $.data.id }
            - call: "POST /split-requests"
              payload: { organizer_account_id: "${org_id}", total_amount_cents: 10000, split_mode: "WEIGHTED", participants: [ { participant_account_id: "${p1_id}", weight: 1 }, { participant_account_id: "${p2_id}", weight: 2 }, { participant_account_id: "${p3_id}", weight: 3 } ] }
              as: AccountHolder
              as_user_id: "${org_id}"
              captures: { sr_id: $.data.id }
          trigger:
            - call: "GET /split-requests/${sr_id}/participants"
              payload: {}
              as: AccountHolder
              as_user_id: "${org_id}"
          assert:
            - "participant with participant_account_id == ${p1_id} has share_amount_cents == 1667"
            - "participant with participant_account_id == ${p2_id} has share_amount_cents == 3333"
            - "participant with participant_account_id == ${p3_id} has share_amount_cents == 5000"
            - "sum of share_amount_cents over all participants == 10000"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: transfer_branching_fork_sent_to_held_vs_settled
        grounds:
          - state_machines.Transfer.SENT_to_HELD
          - state_machines.Transfer.SENT_to_SETTLED
          - calculations.transfer_risk_gate
          - entities.Transfer.fields.risk_flagged
        distinguishing_aspect: |
          On the Transfer entity, the risk gate forks SENT into two branches with divergent side-effects:
          a LARGE_AMOUNT send (100000c, >= threshold) routes to HELD (risk_flagged=true, RiskHold created,
          recipient NOT credited) whereas a sub-threshold send (99999c) routes to SETTLED (recipient credited).
        test_recipe:
          setup:
            - "Verified recipient R; sender S (LOW tier) with balance 500000."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s_fork@x.com", display_name: "S Fork" }
              as: PlatformAdmin
              captures: { sf_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "r_fork@x.com", display_name: "R Fork" }
              as: PlatformAdmin
              captures: { rf_id: $.data.id }
            - call: "POST /_ledger/seed_credit"
              payload: { account_id: "${sf_id}", amount_cents: 500000, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /recipient-verifications"
              payload: { account_id: "${rf_id}", channel: "EMAIL" }
              as: AccountHolder
              as_user_id: "${rf_id}"
              captures: { rvf_id: $.data.id, rvf_tok: $.data.confirm_token }
            - call: "POST /recipient-verifications/${rvf_id}/confirm"
              payload: { token: "${rvf_tok}" }
              as: AccountHolder
              as_user_id: "${rf_id}"
          trigger:
            - call: "POST /transfers"
              payload: { sender_account_id: "${sf_id}", recipient_account_id: "${rf_id}", amount_cents: 100000 }
              as: AccountHolder
              as_user_id: "${sf_id}"
              captures: { t_held_id: $.data.id }
          assert:
            - "Transfer.${t_held_id}.status == HELD"
            - "Transfer.${t_held_id}.risk_flagged == true"
            - "Account.${rf_id}.available_balance_cents == 0"

      - name: dispute_cyclic_open_needs_info_open_loop
        grounds:
          - state_machines.Dispute.OPEN_to_NEEDS_INFO
          - state_machines.Dispute.NEEDS_INFO_to_OPEN
          - entities.Dispute.fields.status
        distinguishing_aspect: |
          On the Dispute entity (different from Transfer), the OPEN <-> NEEDS_INFO cycle is exercised:
          request-info drives OPEN->NEEDS_INFO and provide-info drives NEEDS_INFO->OPEN, returning to
          OPEN — a true cyclic edge, not a linear pipeline.
        test_recipe:
          setup:
            - "A SETTLED Transfer O->R inside the dispute window; an OPEN Dispute opened by O; ComplianceOfficer C not a party."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "o_cyc@x.com", display_name: "O Cyc" }
              as: PlatformAdmin
              captures: { oc_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "r_cyc@x.com", display_name: "R Cyc" }
              as: PlatformAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /_ledger/seed_credit"
              payload: { account_id: "${oc_id}", amount_cents: 100000, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /recipient-verifications"
              payload: { account_id: "${rc_id}", channel: "EMAIL" }
              as: AccountHolder
              as_user_id: "${rc_id}"
              captures: { rvc_id: $.data.id, rvc_tok: $.data.confirm_token }
            - call: "POST /recipient-verifications/${rvc_id}/confirm"
              payload: { token: "${rvc_tok}" }
              as: AccountHolder
              as_user_id: "${rc_id}"
            - call: "POST /transfers"
              payload: { sender_account_id: "${oc_id}", recipient_account_id: "${rc_id}", amount_cents: 2000 }
              as: AccountHolder
              as_user_id: "${oc_id}"
              captures: { tc_id: $.data.id }
            - call: "POST /disputes"
              payload: { transfer_id: "${tc_id}", opener_account_id: "${oc_id}", reason: "UNAUTHORIZED" }
              as: AccountHolder
              as_user_id: "${oc_id}"
              captures: { disc_id: $.data.id }
            - call: "POST /disputes/${disc_id}/request-info"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-2"
          trigger:
            - call: "POST /disputes/${disc_id}/provide-info"
              payload: {}
              as: AccountHolder
              as_user_id: "${oc_id}"
          assert:
            - "Dispute.${disc_id}.status == OPEN"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: dispute_uphold_depth3_cascade
        grounds:
          - state_machines.Dispute.OPEN_to_UPHELD
          - state_machines.Transfer.SENT_to_SETTLED
          - calculations.risk_score_update
          - entities.Reversal.fields.amount_cents
          - entities.Account.fields.risk_score
        distinguishing_aspect: |
          Depth-3 cascade from POST /disputes/{id}/uphold: (1) Dispute->UPHELD creates a Reversal and drives
          (2) Transfer SETTLED->REVERSED, whose own side-effects drive (3) recipient Account ledger DEBIT +
          risk_score +35 (-> risk_tier recompute). Each hop is caused by the prior, not by the original call.
        test_recipe:
          setup:
            - "SETTLED Transfer O->R for 2000c inside the dispute window; R has risk_score 0; O has balance to send; OPEN Dispute by O; ComplianceOfficer C not a party."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "o_up@x.com", display_name: "O Up" }
              as: PlatformAdmin
              captures: { ou_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "r_up@x.com", display_name: "R Up" }
              as: PlatformAdmin
              captures: { ru_id: $.data.id }
            - call: "POST /_ledger/seed_credit"
              payload: { account_id: "${ou_id}", amount_cents: 100000, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /recipient-verifications"
              payload: { account_id: "${ru_id}", channel: "EMAIL" }
              as: AccountHolder
              as_user_id: "${ru_id}"
              captures: { rvu_id: $.data.id, rvu_tok: $.data.confirm_token }
            - call: "POST /recipient-verifications/${rvu_id}/confirm"
              payload: { token: "${rvu_tok}" }
              as: AccountHolder
              as_user_id: "${ru_id}"
            - call: "POST /transfers"
              payload: { sender_account_id: "${ou_id}", recipient_account_id: "${ru_id}", amount_cents: 2000 }
              as: AccountHolder
              as_user_id: "${ou_id}"
              captures: { tu_id: $.data.id }
            - call: "POST /disputes"
              payload: { transfer_id: "${tu_id}", opener_account_id: "${ou_id}", reason: "UNAUTHORIZED" }
              as: AccountHolder
              as_user_id: "${ou_id}"
              captures: { disu_id: $.data.id }
          trigger:
            - call: "POST /disputes/${disu_id}/uphold"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-3"
          assert:
            - "Dispute.${disu_id}.status == UPHELD"
            - "Transfer.${tu_id}.status == REVERSED"
            - "Account.${ru_id}.risk_score == 35"
            - "Account.${ru_id}.risk_tier == ELEVATED"
            - "Account.${ru_id}.available_balance_cents == 0"

      - name: riskhold_clear_depth2_cascade
        grounds:
          - state_machines.RiskHold.PENDING_REVIEW_to_CLEARED
          - state_machines.Transfer.HELD_to_SETTLED
          - entities.Account.fields.available_balance_cents
          - entities.Account.fields.held_balance_cents
        distinguishing_aspect: |
          Cascade of depth >=2 from a DIFFERENT trigger POST /risk-holds/{id}/clear: (1) RiskHold->CLEARED
          drives (2) Transfer HELD->SETTLED, whose side-effect credits the recipient Account and drops the
          sender's held_balance_cents. Distinct propagation pattern from the dispute-uphold chain.
        test_recipe:
          setup:
            - "A LARGE_AMOUNT Transfer (100000c) S->R is HELD with a PENDING_REVIEW RiskHold; sender held_balance_cents=100000; recipient balance=0; ComplianceOfficer not a party."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s_clr@x.com", display_name: "S Clr" }
              as: PlatformAdmin
              captures: { sc_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "r_clr@x.com", display_name: "R Clr" }
              as: PlatformAdmin
              captures: { rcl_id: $.data.id }
            - call: "POST /_ledger/seed_credit"
              payload: { account_id: "${sc_id}", amount_cents: 500000, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /recipient-verifications"
              payload: { account_id: "${rcl_id}", channel: "EMAIL" }
              as: AccountHolder
              as_user_id: "${rcl_id}"
              captures: { rvcl_id: $.data.id, rvcl_tok: $.data.confirm_token }
            - call: "POST /recipient-verifications/${rvcl_id}/confirm"
              payload: { token: "${rvcl_tok}" }
              as: AccountHolder
              as_user_id: "${rcl_id}"
            - call: "POST /transfers"
              payload: { sender_account_id: "${sc_id}", recipient_account_id: "${rcl_id}", amount_cents: 100000 }
              as: AccountHolder
              as_user_id: "${sc_id}"
              captures: { tcl_id: $.data.id, hold_id: $.data.hold_id }
          trigger:
            - call: "POST /risk-holds/${hold_id}/clear"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-4"
          assert:
            - "Transfer.${tcl_id}.status == SETTLED"
            - "Account.${rcl_id}.available_balance_cents == 100000"
            - "Account.${sc_id}.held_balance_cents == 0"
            - "Account.${sc_id}.available_balance_cents == 400000"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: daily_limit_constraint_beats_insufficient_funds_fiscal
        grounds:
          - validations[priority=13]
          - validations[priority=15]
          - errors[ERR_DAILY_LIMIT_EXCEEDED]
          - errors[ERR_INSUFFICIENT_FUNDS]
        distinguishing_aspect: |
          Error-category pair business_constraint (p13 ERR_DAILY_LIMIT_EXCEEDED) vs business_fiscal
          (p15 ERR_INSUFFICIENT_FUNDS): a send of 300000 that both exceeds the 250000 daily limit AND
          exceeds the 200000 balance must return ERR_DAILY_LIMIT_EXCEEDED (lower priority number wins).
        test_recipe:
          setup:
            - "Sender S: daily_send_limit_cents=250000, balance=200000; verified recipient R; clock fixed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "s_p5a@x.com", display_name: "S P5a", daily_send_limit_cents: 250000, weekly_send_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "r_p5a@x.com", display_name: "R P5a" }
              as: PlatformAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /_ledger/seed_credit"
              payload: { account_id: "${sp_id}", amount_cents: 200000, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /recipient-verifications"
              payload: { account_id: "${rp_id}", channel: "EMAIL" }
              as: AccountHolder
              as_user_id: "${rp_id}"
              captures: { rvp_id: $.data.id, rvp_tok: $.data.confirm_token }
            - call: "POST /recipient-verifications/${rvp_id}/confirm"
              payload: { token: "${rvp_tok}" }
              as: AccountHolder
              as_user_id: "${rp_id}"
          trigger:
            - call: "POST /transfers"
              payload: { sender_account_id: "${sp_id}", recipient_account_id: "${rp_id}", amount_cents: 300000 }
              as: AccountHolder
              as_user_id: "${sp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_DAILY_LIMIT_EXCEEDED"

      - name: segregation_safety_beats_invalid_state
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Error-category pair business_safety (p5 ERR_SEGREGATION_OF_DUTIES) vs state (p6 ERR_INVALID_STATE):
          a ComplianceOfficer who IS the recipient party attempts to uphold an already-UPHELD (terminal)
          dispute; both the segregation rule and the state rule are violated, but p5 wins -> ERR_SEGREGATION_OF_DUTIES.
        test_recipe:
          setup:
            - "Dispute already UPHELD (terminal). The acting ComplianceOfficer X-User-ID equals the recipient_account_id of the disputed Transfer (a party), violating segregation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "o_p5b@x.com", display_name: "O P5b" }
              as: PlatformAdmin
              captures: { ob_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "r_p5b@x.com", display_name: "R P5b" }
              as: PlatformAdmin
              captures: { rb_id: $.data.id }
            - call: "POST /_ledger/seed_credit"
              payload: { account_id: "${ob_id}", amount_cents: 100000, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /recipient-verifications"
              payload: { account_id: "${rb_id}", channel: "EMAIL" }
              as: AccountHolder
              as_user_id: "${rb_id}"
              captures: { rvb_id: $.data.id, rvb_tok: $.data.confirm_token }
            - call: "POST /recipient-verifications/${rvb_id}/confirm"
              payload: { token: "${rvb_tok}" }
              as: AccountHolder
              as_user_id: "${rb_id}"
            - call: "POST /transfers"
              payload: { sender_account_id: "${ob_id}", recipient_account_id: "${rb_id}", amount_cents: 2000 }
              as: AccountHolder
              as_user_id: "${ob_id}"
              captures: { tb_id: $.data.id }
            - call: "POST /disputes"
              payload: { transfer_id: "${tb_id}", opener_account_id: "${ob_id}", reason: "UNAUTHORIZED" }
              as: AccountHolder
              as_user_id: "${ob_id}"
              captures: { disb_id: $.data.id }
            - call: "POST /disputes/${disb_id}/uphold"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-5"
          trigger:
            - call: "POST /disputes/${disb_id}/uphold"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${rb_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_SEGREGATION_OF_DUTIES"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: large_amount_threshold_ge_on_transfers
        grounds:
          - calculations.transfer_risk_gate
          - state_machines.Transfer.SENT_to_HELD
          - state_machines.Transfer.SENT_to_SETTLED
        distinguishing_aspect: |
          Numeric threshold crossing via POST /transfers: LARGE_AMOUNT uses >= 100000, so a send of exactly
          100000c routes to HELD while 99999c routes to SETTLED — the >=/> distinction at the 100000 boundary.
        test_recipe:
          setup:
            - "Verified recipient R; sender S (LOW tier) with balance 500000 and high limits."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s_b1@x.com", display_name: "S B1" }
              as: PlatformAdmin
              captures: { sb1_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "r_b1@x.com", display_name: "R B1" }
              as: PlatformAdmin
              captures: { rb1_id: $.data.id }
            - call: "POST /_ledger/seed_credit"
              payload: { account_id: "${sb1_id}", amount_cents: 500000, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /recipient-verifications"
              payload: { account_id: "${rb1_id}", channel: "EMAIL" }
              as: AccountHolder
              as_user_id: "${rb1_id}"
              captures: { rvb1_id: $.data.id, rvb1_tok: $.data.confirm_token }
            - call: "POST /recipient-verifications/${rvb1_id}/confirm"
              payload: { token: "${rvb1_tok}" }
              as: AccountHolder
              as_user_id: "${rb1_id}"
            - call: "POST /transfers"
              payload: { sender_account_id: "${sb1_id}", recipient_account_id: "${rb1_id}", amount_cents: 99999 }
              as: AccountHolder
              as_user_id: "${sb1_id}"
              captures: { t_below_id: $.data.id }
          trigger:
            - call: "POST /transfers"
              payload: { sender_account_id: "${sb1_id}", recipient_account_id: "${rb1_id}", amount_cents: 100000 }
              as: AccountHolder
              as_user_id: "${sb1_id}"
              captures: { t_at_id: $.data.id }
          assert:
            - "Transfer.${t_below_id}.status == SETTLED"
            - "Transfer.${t_at_id}.status == HELD"

      - name: split_cancel_zero_paid_empty_set_boundary
        grounds:
          - state_machines.SplitRequest.OPEN_to_CANCELLED
          - calculations.split_status_rollup
          - entities.SplitParticipant.fields.status
        distinguishing_aspect: |
          Empty-set / count==0 boundary via POST /split-requests/{id}/cancel: cancel is allowed only when
          the count of PAID participants is exactly 0; with zero PAID the cancel succeeds and all OWED
          participants flip to FORGIVEN — a different metric (collection-count edge) and endpoint than the transfer threshold.
        test_recipe:
          setup:
            - "An OPEN SplitRequest with two OWED participants, none PAID."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "org_b2@x.com", display_name: "ORG B2" }
              as: PlatformAdmin
              captures: { orgb_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "p1_b2@x.com", display_name: "P1 B2" }
              as: PlatformAdmin
              captures: { p1b_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "p2_b2@x.com", display_name: "P2 B2" }
              as: PlatformAdmin
              captures: { p2b_id: $.data.id }
            - call: "POST /split-requests"
              payload: { organizer_account_id: "${orgb_id}", total_amount_cents: 1000, split_mode: "EVEN", participants: [ { participant_account_id: "${p1b_id}" }, { participant_account_id: "${p2b_id}" } ] }
              as: AccountHolder
              as_user_id: "${orgb_id}"
              captures: { srb_id: $.data.id }
          trigger:
            - call: "POST /split-requests/${srb_id}/cancel"
              payload: {}
              as: AccountHolder
              as_user_id: "${orgb_id}"
              captures: { srb_status: $.data.status }
          assert:
            - "SplitRequest.${srb_id}.status == CANCELLED"
            - "every participant of ${srb_id} has status == FORGIVEN"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: transfer_settle_depends_on_riskhold_cleared
        grounds:
          - state_machines.Transfer.HELD_to_SETTLED
          - state_machines.RiskHold.PENDING_REVIEW_to_CLEARED
          - entities.RiskHold.fields.status
        distinguishing_aspect: |
          Entity pair Transfer<-RiskHold: a HELD Transfer can only reach SETTLED as the side-effect of its
          owning RiskHold transitioning to CLEARED — the Transfer's valid transition depends on RiskHold state.
        test_recipe:
          setup:
            - "A HELD Transfer S->R (LARGE_AMOUNT 100000c) with a PENDING_REVIEW RiskHold; ComplianceOfficer not a party."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s_c7a@x.com", display_name: "S C7a" }
              as: PlatformAdmin
              captures: { s7_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "r_c7a@x.com", display_name: "R C7a" }
              as: PlatformAdmin
              captures: { r7_id: $.data.id }
            - call: "POST /_ledger/seed_credit"
              payload: { account_id: "${s7_id}", amount_cents: 500000, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /recipient-verifications"
              payload: { account_id: "${r7_id}", channel: "EMAIL" }
              as: AccountHolder
              as_user_id: "${r7_id}"
              captures: { rv7_id: $.data.id, rv7_tok: $.data.confirm_token }
            - call: "POST /recipient-verifications/${rv7_id}/confirm"
              payload: { token: "${rv7_tok}" }
              as: AccountHolder
              as_user_id: "${r7_id}"
            - call: "POST /transfers"
              payload: { sender_account_id: "${s7_id}", recipient_account_id: "${r7_id}", amount_cents: 100000 }
              as: AccountHolder
              as_user_id: "${s7_id}"
              captures: { t7_id: $.data.id, hold7_id: $.data.hold_id }
          trigger:
            - call: "POST /risk-holds/${hold7_id}/clear"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-7"
              captures: { hold7_status: $.data.status }
          assert:
            - "RiskHold.${hold7_id}.status == CLEARED"
            - "Transfer.${t7_id}.status == SETTLED"

      - name: funding_source_remove_blocked_by_requested_withdrawal
        grounds:
          - state_machines.FundingSource.VERIFIED_to_REMOVED
          - entities.Withdrawal.fields.status
          - errors[ERR_FUNDING_SOURCE_IN_USE]
        distinguishing_aspect: |
          Entity pair FundingSource<-Withdrawal (different from Transfer<-RiskHold): a VERIFIED FundingSource
          cannot transition to REMOVED while any Withdrawal in REQUESTED references it -> ERR_FUNDING_SOURCE_IN_USE.
        test_recipe:
          setup:
            - "Account A with a VERIFIED FundingSource FS and a Withdrawal in REQUESTED state referencing FS (so deletion is blocked)."
            - "To keep the Withdrawal in REQUESTED (not auto-PAID), use a STANDARD speed that the impl leaves REQUESTED; here we model a Withdrawal that stays REQUESTED via the standard payout queue."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "a_c7b@x.com", display_name: "A C7b" }
              as: PlatformAdmin
              captures: { a7_id: $.data.id }
            - call: "POST /_ledger/seed_credit"
              payload: { account_id: "${a7_id}", amount_cents: 500000, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /funding-sources"
              payload: { account_id: "${a7_id}", kind: "BANK", last4: "2222" }
              as: AccountHolder
              as_user_id: "${a7_id}"
              captures: { fs7_id: $.data.id, fs7_code: $.data.micro_deposit_code }
            - call: "POST /funding-sources/${fs7_id}/verify"
              payload: { code: "${fs7_code}" }
              as: AccountHolder
              as_user_id: "${a7_id}"
            - call: "GET /accounts/${a7_id}"
              payload: {}
              as: AccountHolder
              as_user_id: "${a7_id}"
              captures: { a7_v: $.data.version }
            - call: "POST /withdrawals"
              payload: { account_id: "${a7_id}", funding_source_id: "${fs7_id}", gross_amount_cents: 10000, speed: "STANDARD", expected_account_version: "${a7_v}" }
              as: AccountHolder
              as_user_id: "${a7_id}"
              captures: { w7_id: $.data.id }
          trigger:
            - call: "DELETE /funding-sources/${fs7_id}"
              payload: {}
              as: AccountHolder
              as_user_id: "${a7_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_FUNDING_SOURCE_IN_USE"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: account_daily_window_aggregate_capacity_overlap
        grounds:
          - calculations.transfer_limit_check
          - entities.Account.fields.daily_send_limit_cents
          - validations[priority=13]
        distinguishing_aspect: |
          Interval semantics = aggregate capacity over a sliding 24h window on the Account resource: two
          sends 12h apart both fall inside [now-24h, now] and their amounts AGGREGATE (200000 + 60000) against
          the 250000 daily ceiling, so the second is rejected — capacity-overlap, not point-collision.
        test_recipe:
          setup:
            - "Sender S daily_send_limit_cents=250000, weekly high, balance=500000; verified recipient R."
            - "First send of 200000 at 2026-06-01T00:00:00Z; second attempt 60000 at 2026-06-01T12:00:00Z (12h later, same daily window)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s_o1@x.com", display_name: "S O1", daily_send_limit_cents: 250000, weekly_send_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { so1_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "r_o1@x.com", display_name: "R O1" }
              as: PlatformAdmin
              captures: { ro1_id: $.data.id }
            - call: "POST /_ledger/seed_credit"
              payload: { account_id: "${so1_id}", amount_cents: 500000, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /recipient-verifications"
              payload: { account_id: "${ro1_id}", channel: "EMAIL" }
              as: AccountHolder
              as_user_id: "${ro1_id}"
              captures: { rvo1_id: $.data.id, rvo1_tok: $.data.confirm_token }
            - call: "POST /recipient-verifications/${rvo1_id}/confirm"
              payload: { token: "${rvo1_tok}" }
              as: AccountHolder
              as_user_id: "${ro1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /transfers"
              payload: { sender_account_id: "${so1_id}", recipient_account_id: "${ro1_id}", amount_cents: 200000 }
              as: AccountHolder
              as_user_id: "${so1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /transfers"
              payload: { sender_account_id: "${so1_id}", recipient_account_id: "${ro1_id}", amount_cents: 60000 }
              as: AccountHolder
              as_user_id: "${so1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_DAILY_LIMIT_EXCEEDED"

      - name: recipient_verification_live_window_point_overlap
        grounds:
          - validations[priority=11]
          - entities.RecipientVerification.fields.expires_at
          - errors[ERR_VERIFICATION_ALREADY_PENDING]
        distinguishing_aspect: |
          Different interval semantics on a different resource (RecipientVerification): single live-window
          point-overlap. A second PENDING verification for the same (Account, EMAIL) created while the first
          is still within [created_at, expires_at) (now < expires_at) collides -> ERR_VERIFICATION_ALREADY_PENDING;
          this is point-falls-inside-interval, not aggregate capacity.
        test_recipe:
          setup:
            - "Account A has one PENDING RecipientVerification on EMAIL created at 2026-06-01T00:00:00Z (expires 2026-06-02T00:00:00Z)."
            - "Second EMAIL verification attempted at 2026-06-01T06:00:00Z, still inside the live window."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "a_o2@x.com", display_name: "A O2" }
              as: PlatformAdmin
              captures: { ao2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recipient-verifications"
              payload: { account_id: "${ao2_id}", channel: "EMAIL" }
              as: AccountHolder
              as_user_id: "${ao2_id}"
              captures: { rvo2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T06:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /recipient-verifications"
              payload: { account_id: "${ao2_id}", channel: "EMAIL" }
              as: AccountHolder
              as_user_id: "${ao2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_VERIFICATION_ALREADY_PENDING"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: withdrawal_create_then_cancel_conserves_balance
        grounds:
          - state_machines.Withdrawal.REQUESTED_to_PAID
          - state_machines.Withdrawal.REQUESTED_to_CANCELLED
          - entities.Account.fields.available_balance_cents
          - entities.LedgerEntry.fields.direction
        distinguishing_aspect: |
          Conserved quantity = Account.available_balance_cents. Forward action POST /withdrawals debits gross
          (10000); compensating POST /withdrawals/{id}/cancel credits gross back. Net invariant: balance returns
          to 500000 (pre-withdrawal), pinned as available_balance_cents_after == available_balance_cents_before.
        test_recipe:
          setup:
            - "Account A with VERIFIED FS and available_balance_cents=500000."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "a_inv1@x.com", display_name: "A Inv1" }
              as: PlatformAdmin
              captures: { ai1_id: $.data.id }
            - call: "POST /_ledger/seed_credit"
              payload: { account_id: "${ai1_id}", amount_cents: 500000, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /funding-sources"
              payload: { account_id: "${ai1_id}", kind: "BANK", last4: "3333" }
              as: AccountHolder
              as_user_id: "${ai1_id}"
              captures: { fsi1_id: $.data.id, fsi1_code: $.data.micro_deposit_code }
            - call: "POST /funding-sources/${fsi1_id}/verify"
              payload: { code: "${fsi1_code}" }
              as: AccountHolder
              as_user_id: "${ai1_id}"
            - call: "GET /accounts/${ai1_id}"
              payload: {}
              as: AccountHolder
              as_user_id: "${ai1_id}"
              captures: { ai1_v: $.data.version }
            - call: "POST /withdrawals"
              payload: { account_id: "${ai1_id}", funding_source_id: "${fsi1_id}", gross_amount_cents: 10000, speed: "STANDARD", expected_account_version: "${ai1_v}" }
              as: AccountHolder
              as_user_id: "${ai1_id}"
              captures: { wi1_id: $.data.id }
          trigger:
            - call: "POST /withdrawals/${wi1_id}/cancel"
              payload: {}
              as: AccountHolder
              as_user_id: "${ai1_id}"
          assert:
            - "Withdrawal.${wi1_id}.status == CANCELLED"
            - "Account.${ai1_id}.available_balance_cents == 500000"

      - name: held_transfer_block_conserves_limit_usage
        grounds:
          - state_machines.Transfer.SENT_to_HELD
          - state_machines.Transfer.HELD_to_REVERSED
          - state_machines.RiskHold.PENDING_REVIEW_to_BLOCKED
          - calculations.transfer_limit_check
        distinguishing_aspect: |
          Conserved quantity = the sender's rolling daily_used window usage (a DIFFERENT conserved quantity
          than balance cents). Forward: a 100000 HELD transfer accumulates 100000 usage; compensating BLOCK
          REVERSES it, excluding it from {SENT,HELD,SETTLED}, so a subsequent 250000 send (== full daily limit)
          succeeds — proving usage rewound to 0.
        test_recipe:
          setup:
            - "Sender S daily_send_limit_cents=250000, balance=600000; verified recipient R; clock fixed."
            - "A 100000 send is HELD (LARGE_AMOUNT), then BLOCKED; usage must rewind so a 250000 send fits the daily limit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "s_inv2@x.com", display_name: "S Inv2", daily_send_limit_cents: 250000, weekly_send_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { si2_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "r_inv2@x.com", display_name: "R Inv2" }
              as: PlatformAdmin
              captures: { ri2_id: $.data.id }
            - call: "POST /_ledger/seed_credit"
              payload: { account_id: "${si2_id}", amount_cents: 600000, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /recipient-verifications"
              payload: { account_id: "${ri2_id}", channel: "EMAIL" }
              as: AccountHolder
              as_user_id: "${ri2_id}"
              captures: { rvi2_id: $.data.id, rvi2_tok: $.data.confirm_token }
            - call: "POST /recipient-verifications/${rvi2_id}/confirm"
              payload: { token: "${rvi2_tok}" }
              as: AccountHolder
              as_user_id: "${ri2_id}"
            - call: "POST /transfers"
              payload: { sender_account_id: "${si2_id}", recipient_account_id: "${ri2_id}", amount_cents: 100000 }
              as: AccountHolder
              as_user_id: "${si2_id}"
              captures: { ti2_id: $.data.id, holdi2_id: $.data.hold_id }
            - call: "POST /risk-holds/${holdi2_id}/block"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-9"
          trigger:
            - call: "POST /transfers"
              payload: { sender_account_id: "${si2_id}", recipient_account_id: "${ri2_id}", amount_cents: 250000 }
              as: AccountHolder
              as_user_id: "${si2_id}"
              captures: { ti2b_id: $.data.id }
          assert:
            - "Transfer.${ti2_id}.status == REVERSED"
            - "Transfer.${ti2b_id}.status == HELD"
            - "Account.${si2_id}.available_balance_cents == 350000"
