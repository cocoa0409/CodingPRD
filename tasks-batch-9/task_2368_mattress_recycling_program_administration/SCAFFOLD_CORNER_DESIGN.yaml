  # ===========================================================================
  - section: validations
    instances:

      - name: pagination_limit_above_maximum_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=26]
          - errors[ERR_INVALID_PAGINATION]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "limit=101 exceeds the declared maximum of 100 and returns 400 ERR_INVALID_PAGINATION instead of being silently clamped to 100, while limit=100 is accepted."
        test_recipe:
          setup:
            - "One CA program and one registrant exist so the listing is non-empty."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", program_name: "California Mattress Recycling Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_ca_id: $.data.id }
          trigger:
            - call: "GET /fee-rate-schedules?state_program_id=${prog_ca_id}&limit=101"
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "GET /fee-rate-schedules?state_program_id=${prog_ca_id}&limit=0"
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "GET /fee-rate-schedules?state_program_id=${prog_ca_id}&limit=100&offset=0"
              as: ProgramAdministrator
              as_user_id: "admin-1"
          assert:
            - "limit=101 response: HTTP 400 with data.error_id == ERR_INVALID_PAGINATION"
            - "limit=0 response: HTTP 400 with data.error_id == ERR_INVALID_PAGINATION (minimum is 1)"
            - "limit=100 response: HTTP 200 with data.meta.limit == 100 and data.meta.total_count == 0"

      - name: duplicate_original_remittance_period_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=78]
          - errors[ERR_DUPLICATE_REMITTANCE_PERIOD]
        distinguishing_aspect: "A second original remittance for the same (registrant, program, period_code) is 409, and the uniqueness scope ignores amendment children so the first row's amendment path stays open."
        test_recipe:
          setup:
            - "CA program with an ACTIVE MATTRESS 1100c rate, one registrant and a DRAFT 2026Q2 remittance."
