          assert:
            - "trigger call 1 response.data.error_id == ERR_EVENT_NOT_DECLARED"
            - "trigger call 1 response HTTP status == 409"
            - "after trigger call 1: HousingBlock.${hb}.status == PENDING"
            - "after trigger call 1: CatastropheEvent.${ev}.status == MONITORING"
            - "trigger call 3 response HTTP status == 200"
            - "after trigger call 3: HousingBlock.${hb}.status == ACTIVE"
            - "HousingBlock.${hb}.rooms_total == 5"
            - "HousingBlock.${hb}.rooms_available == 5"
            - "HousingBlock.${hb}.rooms_occupied == 0"
            - "HousingBlock.${hb}.block_night_count == 10"

      - name: vendor_assignment_accept_gated_by_firm_network_status
        grounds:
          - state_machines.VendorAssignment.DISPATCHED_to_ACCEPTED
          - state_machines.VendorFirm.NETWORK_INACTIVE_to_ACTIVATED
          - errors[ERR_VENDOR_NOT_ACTIVATED]
          - roles.VendorCoordinator
        distinguishing_aspect: |
          Entity pair VendorAssignment -> VendorFirm. Third distinct pair, and the dependency is entity_backed:
          the acting VendorCoordinator owns the firm (X-User-ID == vendor_firm_id, so ERR_NOT_ASSIGNED_VENDOR is
          not in play), the assignment is DISPATCHED, and capacity is free (0 < 2) — the ONLY unmet condition is
          the firm's own NETWORK_INACTIVE status. Activating the firm onto the event unblocks the same accept.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z startup default."
            - "One CatastropheEvent 'CAT-2026-703' in DECLARED: WILDFIRE, NC."
            - "One VendorFirm in NETWORK_INACTIVE: vendor_type MITIGATION, service_states [NC], max_concurrent_jobs 2, performance_score 88.00, activated_for_event_id null."
            - "One Claim on the event TRIAGED at COMPLEX (severity_score 59.25)."
            - "One VendorAssignment DISPATCHED with vendor_firm_id supplied explicitly, so selection_reason is EXPLICIT_VENDOR and calculations.vendor_selector (which would have filtered out the inactive firm) is bypassed."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-703", peril_type: "WILDFIRE", jurisdiction_state: "NC", event_start_utc: "2026-07-27T00:00:00.000Z", exposure_count: 350, avg_insured_value: 280000, expected_severity_index: 0.1500 }
