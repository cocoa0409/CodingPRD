scaffold_corner_design:
- section: entities
  instances:
  - name: create_customer_success_defaults_and_envelope
    claim_type: creation
    grounds:
    - entities.Customer
    - endpoints["POST /api/customers"]
    - response_envelope
    distinguishing_aspect: POST with required field returns 201; computed aggregates default to 0; success envelope carries
      meta.api_request_id and response_type == object.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls:
      - call: POST /api/customers
        payload:
          brand_name: Acme
        as: ProductionPlanner
        captures:
          cust_id: $.data.id
      trigger:
      - call: GET /api/customers/${cust_id}
        payload: {}
        as: QAManager
      assert:
      - Customer.${cust_id}.committed_order_value_cents == 0 and open_order_count == 0 and lifetime_receipts_cents == 0 and
        open_recall_count == 0
      - Response envelope contains meta.api_request_id and response_type == 'object'
  - name: create_customer_missing_brand_name_returns_invalid_request
    claim_type: required_fields
    grounds:
    - entities.Customer.fields.brand_name
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Omitting the only required input field yields 400 ERR_INVALID_REQUEST.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /api/customers
        payload: {}
        as: ProductionPlanner
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_INVALID_REQUEST (400)
  - name: create_raw_material_invalid_enum_returns_invalid_request
    claim_type: type_constraints
    grounds:
    - entities.RawMaterial.fields.allergen_class
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: allergen_class outside the declared enum set is rejected 400.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /api/raw-materials
        payload:
          name: Mystery
          allergen_class: LATEX
        as: ProductionPlanner
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_INVALID_REQUEST
  - name: get_batch_unknown_id_returns_not_found
    claim_type: not_found
    grounds:
    - errors[ERR_NOT_FOUND]
    - endpoints["GET /api/batches/{id}"]
    distinguishing_aspect: GET with a well-formed but unknown UUID yields 404 ERR_NOT_FOUND.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: GET /api/batches/00000000-0000-0000-0000-000000000000
        payload: {}
        as: QAManager
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_NOT_FOUND (404)
  - name: material_lot_receipt_initializes_qty_remaining
    claim_type: computed_fields
    grounds:
    - entities.MaterialLot.fields.qty_remaining
    - calculations.lot_qty_reconciliation
    distinguishing_aspect: On receipt, qty_remaining == qty_received and status == QUARANTINE (initial state + derived field
      at creation).
    test_recipe:
      setup:
      - raw material exists
      setup_api_calls:
      - call: POST /api/raw-materials
        payload:
          name: VitC
          allergen_class: NONE
        as: ProductionPlanner
        captures:
          rm_id: $.data.id
      trigger:
      - call: POST /api/material-lots
        payload:
          raw_material_id: ${rm_id}
          supplier_name: SuppCo
          supplier_coa_ref: COA-1
          qty_received: 250000
        as: ProductionOperator
        captures:
          lot_id: $.data.id
          lot_remaining: $.data.qty_remaining
          lot_status: $.data.status
      assert:
      - ${lot_remaining} == 250000
      - ${lot_status} == QUARANTINE
  - name: formula_created_nested_under_customer_in_draft
    claim_type: parent_relationships
    grounds:
    - entities.Formula.fields.customer_id
    - endpoints["POST /api/customers/{customerId}/formulas"]
    distinguishing_aspect: Nested creation binds the formula to the path customer; status starts DRAFT and lines are created
      from the payload.
    test_recipe:
      setup:
      - customer and raw material exist
      setup_api_calls:
      - call: POST /api/customers
        payload:
          brand_name: Acme
        as: ProductionPlanner
        captures:
          cust_id: $.data.id
      - call: POST /api/raw-materials
        payload:
          name: VitC
          allergen_class: NONE
        as: ProductionPlanner
        captures:
          rm_id: $.data.id
      trigger:
      - call: POST /api/customers/${cust_id}/formulas
        payload:
          name: C500
          dosage_form: TABLET
          allergen_class: NONE
          min_order_qty: 1000
          batch_size_units: 10000
          shelf_life_months: 24
          overage_basis: THEORETICAL
          lines:
          - raw_material_id: ${rm_id}
            theoretical_qty_mg_per_unit: 500
            overage_pct: 10
            is_label_claim_line: true
            label_claim_mg_per_unit: 450
          price_tiers:
          - min_qty: 1000
            unit_price_cents: 120
        as: ProductionPlanner
        captures:
          f_id: $.data.id
          f_status: $.data.status
      assert:
      - ${f_status} == DRAFT
      - GET /api/customers/${cust_id}/formulas contains exactly the created formula (parent binding via path)
  - name: clock_default_timestamp_applied_without_set
    claim_type: system_fields
    grounds:
    - endpoints["POST /api/_clock/set_current_utc"]
    - entities.Customer
    distinguishing_aspect: Without any clock-set call, server-stamped created_at equals the fixed default 2026-08-01T00:00:00.000Z
      (never wall clock).
    test_recipe:
      setup:
      - empty DB; logical clock untouched
      setup_api_calls: []
      trigger:
      - call: POST /api/customers
        payload:
          brand_name: Acme
        as: ProductionPlanner
        captures:
          created: $.data.created_at
      assert:
      - ${created} == '2026-08-01T00:00:00.000Z'
  - name: list_batches_pagination_and_filter
    claim_type: listing
    grounds:
    - endpoints["GET /api/batches"]
    - response_envelope
    distinguishing_aspect: limit=1 returns exactly 1 row with total_count == 2 and has_more == true; mo_id filter narrows
      to the single matching batch.
    test_recipe:
      setup:
      - Two batches exist (two scheduled MOs on the same line, non-overlapping windows)
      setup_api_calls:
      - call: POST /api/customers
        payload:
          brand_name: Acme
        as: ProductionPlanner
        captures:
          cust_id: $.data.id
      - call: POST /api/raw-materials
        payload:
          name: VitC
          allergen_class: NONE
        as: ProductionPlanner
        captures:
          rm_id: $.data.id
      - call: POST /api/customers/${cust_id}/formulas
        payload:
          name: C500
          dosage_form: TABLET
          allergen_class: NONE
          min_order_qty: 1000
          batch_size_units: 10000
          shelf_life_months: 24
          overage_basis: THEORETICAL
          lines:
          - raw_material_id: ${rm_id}
            theoretical_qty_mg_per_unit: 500
            overage_pct: 10
            is_label_claim_line: true
            label_claim_mg_per_unit: 450
          price_tiers:
          - min_qty: 1000
            unit_price_cents: 120
        as: ProductionPlanner
        captures:
          f_id: $.data.id
      - call: POST /api/formulas/${f_id}/approve
        payload: {}
        as: QAManager
      - call: POST /api/production-lines
        payload:
          name: L1
        as: ProductionPlanner
        captures:
          line_id: $.data.id
      - call: POST /api/manufacturing-orders
        payload:
          customer_id: ${cust_id}
          formula_id: ${f_id}
          ordered_qty: 10000
        as: BrandRep
        as_user_id: ${cust_id}
        captures:
          mo1_id: $.data.id
      - call: POST /api/manufacturing-orders/${mo1_id}/schedule
        payload:
          production_line_id: ${line_id}
          planned_start: '2026-09-01T08:00:00Z'
          planned_end: '2026-09-01T16:00:00Z'
        as: ProductionPlanner
        captures:
          b1_id: $.data.id
      - call: POST /api/manufacturing-orders
        payload:
          customer_id: ${cust_id}
          formula_id: ${f_id}
          ordered_qty: 10000
        as: BrandRep
        as_user_id: ${cust_id}
        captures:
          mo2_id: $.data.id
      - call: POST /api/manufacturing-orders/${mo2_id}/schedule
        payload:
          production_line_id: ${line_id}
          planned_start: '2026-09-02T08:00:00Z'
          planned_end: '2026-09-02T16:00:00Z'
        as: ProductionPlanner
        captures:
          b2_id: $.data.id
      trigger:
      - call: GET /api/batches
        payload:
          limit: 1
        as: QAManager
      - call: GET /api/batches
        payload:
          mo_id: ${mo1_id}
        as: QAManager
        captures:
          only_b1: $.data[0].id
      assert:
      - 'Unfiltered page: data length == 1, total_count == 2, has_more == true'
      - 'Filtered by mo_id: data length == 1 and ${only_b1} == ${b1_id}'
- section: state_machines
  instances:
  - name: lot_full_path_quarantine_to_released
    claim_type: valid_transition
    grounds:
    - state_machines.MaterialLot
    - state_machines.IdentityTest
    distinguishing_aspect: Happy-path chain QUARANTINE -> IDENTITY_PASSED -> RELEASED with test record COA_APPROVED.
    test_recipe:
      setup:
      - raw material and lot exist
      setup_api_calls:
      - call: POST /api/raw-materials
        payload:
          name: VitC
          allergen_class: NONE
        as: ProductionPlanner
        captures:
          rm_id: $.data.id
      - call: POST /api/material-lots
        payload:
          raw_material_id: ${rm_id}
          supplier_name: SuppCo
          supplier_coa_ref: COA-1
          qty_received: 100000
        as: ProductionOperator
        captures:
          lot_id: $.data.id
      trigger:
      - call: POST /api/material-lots/${lot_id}/identity-tests
        payload:
          result: PASS
          coa_match: true
        as: QAChemist
        as_user_id: chem-1
        captures:
          it_id: $.data.id
      - call: POST /api/identity-tests/${it_id}/coa-review
        payload:
          review_outcome: APPROVE
        as: QAManager
        as_user_id: qm-1
      assert:
      - 'After test: MaterialLot.${lot_id}.status == IDENTITY_PASSED and IdentityTest.${it_id}.status == SUBMITTED'
      - 'After review: MaterialLot.${lot_id}.status == RELEASED and IdentityTest.${it_id}.status == COA_APPROVED and reviewed_by_id
        == ''qm-1'''
  - name: lot_retest_cycle_failed_then_passed
    claim_type: valid_transition
    grounds:
    - state_machines.MaterialLot.IDENTITY_FAILED_to_IDENTITY_PASSED
    distinguishing_aspect: 'Cyclic edge: after a FAIL (IDENTITY_FAILED) a new PASS retest moves the lot to IDENTITY_PASSED,
      and COA approval then releases it.'
    test_recipe:
      setup:
      - lot received
      setup_api_calls:
      - call: POST /api/raw-materials
        payload:
          name: VitC
          allergen_class: NONE
        as: ProductionPlanner
        captures:
          rm_id: $.data.id
      - call: POST /api/material-lots
        payload:
          raw_material_id: ${rm_id}
          supplier_name: SuppCo
          supplier_coa_ref: COA-1
          qty_received: 100000
        as: ProductionOperator
        captures:
          lot_id: $.data.id
      - call: POST /api/material-lots/${lot_id}/identity-tests
        payload:
          result: FAIL
          coa_match: false
        as: QAChemist
        as_user_id: chem-1
      trigger:
      - call: POST /api/material-lots/${lot_id}/identity-tests
        payload:
          result: PASS
          coa_match: true
        as: QAChemist
        as_user_id: chem-1
        captures:
          it2_id: $.data.id
      - call: POST /api/identity-tests/${it2_id}/coa-review
        payload:
          review_outcome: APPROVE
        as: QAManager
        as_user_id: qm-1
      assert:
      - 'After FAIL: status == IDENTITY_FAILED'
      - 'After retest PASS: status == IDENTITY_PASSED (cycle edge taken)'
      - 'After COA APPROVE: status == RELEASED'
  - name: identity_test_on_released_lot_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.MaterialLot
    - errors[ERR_LOT_STATE]
    distinguishing_aspect: Once RELEASED, further identity tests are rejected with ERR_LOT_STATE.
    test_recipe:
      setup:
      - lot fully released
      setup_api_calls:
      - call: POST /api/raw-materials
        payload:
          name: VitC
          allergen_class: NONE
        as: ProductionPlanner
        captures:
          rm_id: $.data.id
      - call: POST /api/material-lots
        payload:
          raw_material_id: ${rm_id}
          supplier_name: SuppCo
          supplier_coa_ref: COA-1
          qty_received: 100000
        as: ProductionOperator
        captures:
          lot_id: $.data.id
      - call: POST /api/material-lots/${lot_id}/identity-tests
        payload:
          result: PASS
          coa_match: true
        as: QAChemist
        as_user_id: chem-1
        captures:
          it_id: $.data.id
      - call: POST /api/identity-tests/${it_id}/coa-review
        payload:
          review_outcome: APPROVE
        as: QAManager
        as_user_id: qm-1
      trigger:
      - call: POST /api/material-lots/${lot_id}/identity-tests
        payload:
          result: PASS
          coa_match: true
        as: QAChemist
        as_user_id: chem-1
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_LOT_STATE
  - name: coa_review_twice_rejected
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.IdentityTest
    - errors[ERR_IDENTITY_TEST_STATE]
    distinguishing_aspect: A COA_APPROVED test is terminal; a second review is rejected.
    test_recipe:
      setup:
      - lot with COA_APPROVED test
      setup_api_calls:
      - call: POST /api/raw-materials
        payload:
          name: VitC
          allergen_class: NONE
        as: ProductionPlanner
        captures:
          rm_id: $.data.id
      - call: POST /api/material-lots
        payload:
          raw_material_id: ${rm_id}
          supplier_name: SuppCo
          supplier_coa_ref: COA-1
          qty_received: 100000
        as: ProductionOperator
        captures:
          lot_id: $.data.id
      - call: POST /api/material-lots/${lot_id}/identity-tests
        payload:
          result: PASS
          coa_match: true
        as: QAChemist
        as_user_id: chem-1
        captures:
          it_id: $.data.id
      - call: POST /api/identity-tests/${it_id}/coa-review
        payload:
          review_outcome: APPROVE
        as: QAManager
        as_user_id: qm-1
      trigger:
      - call: POST /api/identity-tests/${it_id}/coa-review
        payload:
          review_outcome: REJECT
        as: QAManager
        as_user_id: qm-2
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_IDENTITY_TEST_STATE
      - MaterialLot.${lot_id}.status == RELEASED (unchanged)
  - name: coa_review_by_testing_user_rejected_sod
    claim_type: precondition_enforcement
    grounds:
    - state_machines.IdentityTest
    - errors[ERR_SOD_VIOLATION]
    - validations[priority=8]
    distinguishing_aspect: 'Segregation of duties: the QAManager whose X-User-ID equals tested_by_id is refused with 403 ERR_SOD_VIOLATION
      even though the role is correct.'
    test_recipe:
      setup:
      - lot with SUBMITTED test by user 'shared-1'
      setup_api_calls:
      - call: POST /api/raw-materials
        payload:
          name: VitC
          allergen_class: NONE
        as: ProductionPlanner
        captures:
          rm_id: $.data.id
      - call: POST /api/material-lots
        payload:
          raw_material_id: ${rm_id}
          supplier_name: SuppCo
          supplier_coa_ref: COA-1
          qty_received: 100000
        as: ProductionOperator
        captures:
          lot_id: $.data.id
      - call: POST /api/material-lots/${lot_id}/identity-tests
        payload:
          result: PASS
          coa_match: true
        as: QAChemist
        as_user_id: shared-1
        captures:
          it_id: $.data.id
      trigger:
      - call: POST /api/identity-tests/${it_id}/coa-review
        payload:
          review_outcome: APPROVE
        as: QAManager
        as_user_id: shared-1
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_SOD_VIOLATION (403)
  - name: coa_approve_of_fail_test_returns_invalid_request
    claim_type: violation_to_error
    grounds:
    - errors[ERR_INVALID_REQUEST]
    - state_machines.IdentityTest
    distinguishing_aspect: APPROVE on a FAIL test is a 400 (result must be PASS); REJECT is the only valid review of a failing
      test and drives the lot to REJECTED.
    test_recipe:
      setup:
      - lot with SUBMITTED FAIL test
      setup_api_calls:
      - call: POST /api/raw-materials
        payload:
          name: VitC
          allergen_class: NONE
        as: ProductionPlanner
        captures:
          rm_id: $.data.id
      - call: POST /api/material-lots
        payload:
          raw_material_id: ${rm_id}
          supplier_name: SuppCo
          supplier_coa_ref: COA-1
          qty_received: 100000
        as: ProductionOperator
        captures:
          lot_id: $.data.id
      - call: POST /api/material-lots/${lot_id}/identity-tests
        payload:
          result: FAIL
          coa_match: false
        as: QAChemist
        as_user_id: chem-1
        captures:
          it_id: $.data.id
      trigger:
      - call: POST /api/identity-tests/${it_id}/coa-review
        payload:
          review_outcome: APPROVE
        as: QAManager
        as_user_id: qm-1
        captures:
          err: $.data.error_id
      - call: POST /api/identity-tests/${it_id}/coa-review
        payload:
          review_outcome: REJECT
        as: QAManager
        as_user_id: qm-1
      assert:
      - APPROVE of FAIL -> ${err} == ERR_INVALID_REQUEST (400)
      - REJECT -> IdentityTest COA_REJECTED; MaterialLot.${lot_id}.status == REJECTED
  - name: formula_approve_without_lines_rejected_incomplete
    claim_type: violation_to_error
    grounds:
    - errors[ERR_FORMULA_INCOMPLETE]
    - state_machines.Formula
    distinguishing_aspect: Approval of a formula with an empty lines array fails ERR_FORMULA_INCOMPLETE.
    test_recipe:
      setup:
      - 'customer exists; DRAFT formula with lines: []'
      setup_api_calls:
      - call: POST /api/customers
        payload:
          brand_name: Acme
        as: ProductionPlanner
        captures:
          cust_id: $.data.id
      - call: POST /api/customers/${cust_id}/formulas
        payload:
          name: Empty
          dosage_form: TABLET
          allergen_class: NONE
          min_order_qty: 1000
          batch_size_units: 10000
          shelf_life_months: 24
          overage_basis: THEORETICAL
          lines: []
          price_tiers:
          - min_qty: 1000
            unit_price_cents: 120
        as: ProductionPlanner
        captures:
          f_id: $.data.id
      trigger:
      - call: POST /api/formulas/${f_id}/approve
        payload: {}
        as: QAManager
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_FORMULA_INCOMPLETE
  - name: formula_approve_with_two_label_claim_lines_rejected
    claim_type: violation_to_error
    grounds:
    - errors[ERR_FORMULA_INCOMPLETE]
    - entities.FormulaLine.fields.is_label_claim_line
    distinguishing_aspect: 'Exactly-one-label-claim rule enforced at approval: two label-claim lines fail ERR_FORMULA_INCOMPLETE.'
    test_recipe:
      setup:
      - DRAFT formula with two label-claim lines
      setup_api_calls:
      - call: POST /api/customers
        payload:
          brand_name: Acme
        as: ProductionPlanner
        captures:
          cust_id: $.data.id
      - call: POST /api/raw-materials
        payload:
          name: VitC
          allergen_class: NONE
        as: ProductionPlanner
        captures:
          rm_id: $.data.id
      - call: POST /api/customers/${cust_id}/formulas
        payload:
          name: TwoClaims
          dosage_form: TABLET
          allergen_class: NONE
          min_order_qty: 1000
          batch_size_units: 10000
          shelf_life_months: 24
          overage_basis: THEORETICAL
          lines:
          - raw_material_id: ${rm_id}
            theoretical_qty_mg_per_unit: 500
            overage_pct: 10
            is_label_claim_line: true
            label_claim_mg_per_unit: 450
          - raw_material_id: ${rm_id}
            theoretical_qty_mg_per_unit: 100
            overage_pct: 0
            is_label_claim_line: true
            label_claim_mg_per_unit: 100
          price_tiers:
          - min_qty: 1000
            unit_price_cents: 120
        as: ProductionPlanner
        captures:
          f_id: $.data.id
      trigger:
      - call: POST /api/formulas/${f_id}/approve
        payload: {}
        as: QAManager
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_FORMULA_INCOMPLETE
  - name: formula_approve_twice_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.Formula
    - errors[ERR_FORMULA_STATE]
    distinguishing_aspect: Second approve of an APPROVED formula is rejected (idempotency of the approval action).
    test_recipe:
      setup:
      - APPROVED formula
      setup_api_calls:
      - call: POST /api/customers
        payload:
          brand_name: Acme
        as: ProductionPlanner
        captures:
          cust_id: $.data.id
      - call: POST /api/raw-materials
        payload:
          name: VitC
          allergen_class: NONE
        as: ProductionPlanner
        captures:
          rm_id: $.data.id
      - call: POST /api/customers/${cust_id}/formulas
        payload:
          name: C500
          dosage_form: TABLET
          allergen_class: NONE
          min_order_qty: 1000
          batch_size_units: 10000
          shelf_life_months: 24
          overage_basis: THEORETICAL
          lines:
          - raw_material_id: ${rm_id}
            theoretical_qty_mg_per_unit: 500
            overage_pct: 10
            is_label_claim_line: true
            label_claim_mg_per_unit: 450
          price_tiers:
          - min_qty: 1000
            unit_price_cents: 120
        as: ProductionPlanner
        captures:
          f_id: $.data.id
      - call: POST /api/formulas/${f_id}/approve
        payload: {}
        as: QAManager
      trigger:
      - call: POST /api/formulas/${f_id}/approve
        payload: {}
        as: QAManager
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_FORMULA_STATE
  - name: formula_update_after_approve_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.Formula.DRAFT_to_DRAFT
    - errors[ERR_FORMULA_STATE]
    distinguishing_aspect: PUT with the CURRENT version (OCC passes) still fails with ERR_FORMULA_STATE because the formula
      is APPROVED — proves state check runs after the OCC check.
