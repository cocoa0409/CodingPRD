        grounds: ["errors[ERR_PARCEL_EXEMPT]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / exempt_parcel_constraint_beats_credit_overlap_temporal
          rationale: "ERR_PARCEL_EXEMPT is asserted as the winning error of the named §1.8 conflict instance."
      - name: error_credit_window_overlap_covered
        claim_type: violation_to_error
