      - name: late_acknowledgement_compensates_the_delinquency_sweep_on_both_entities
        claim_type: Side Effect Execution
        grounds:
          - state_machines[RetailerNotification].transitions[ISSUED -> DELINQUENT]
          - state_machines[RetailerNotification].transitions[DELINQUENT -> ACKNOWLEDGED]
          - state_machines[Recall].transitions[DEFICIENT -> IN_PROGRESS]
          - endpoints["POST /product-safety/recalls/{id}/compliance-sweep"]
        distinguishing_aspect: |
          A Compensation pattern that is NOT one of the two named cascades: the
          sweep pushes the notification to DELINQUENT, bumps
          Retailer.delinquent_count and flips the recall's outreach axis to
          DEFICIENT; the late acknowledgement must then restore the retailer's
          posture to STOP_SALE_ACTIVE (because open_stop_sale_count is still 1,
          NOT to CLEAR) and pull the recall back to IN_PROGRESS — while leaving
          delinquent_count at 1, because the delinquency HAPPENED and is a
          historical counter rather than a reversible reserve. Resetting the
          counter or restoring CLEAR are the two natural over-corrections.
        test_recipe:
          setup:
            - "fixture chain F1 through approve-plan, so one RetailerNotification is ISSUED with ack_due_at = 2026-03-13T00:00:00Z + 72h = 2026-03-16T00:00:00Z, Retailer.compliance_posture == STOP_SALE_ACTIVE and open_stop_sale_count == 1"
            - "the clock is then moved to 2026-03-17T00:00:00Z, strictly past ack_due_at"
