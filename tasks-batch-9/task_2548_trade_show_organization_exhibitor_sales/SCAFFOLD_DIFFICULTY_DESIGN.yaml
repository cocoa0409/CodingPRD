              as_user_id: "u_rep_1"
              captures: { d2: $.data.id }
            - call: "POST /sponsorship-packages/${pkg_id}/deals"
              payload: { exhibitor_id: "${ex3}", negotiated_price_cents: 950000 }
              as: SalesRep
              as_user_id: "u_rep_1"
              captures: { err_exhausted: $.data.error_id }
            - call: "POST /sponsorship-deals/${d1}/sign"
              payload: {}
              as: ShowDirector
              as_user_id: "u_dir_1"
            - call: "POST /sponsorship-deals/${d2}/cancel"
              payload: { cancellation_reason: "Sponsor could not clear the artwork deadline" }
              as: ShowDirector
              as_user_id: "u_dir_1"
            - call: "POST /sponsorship-packages/${pkg_id}/deals"
              payload: { exhibitor_id: "${ex3}", negotiated_price_cents: 950000 }
              as: SalesRep
              as_user_id: "u_rep_1"
