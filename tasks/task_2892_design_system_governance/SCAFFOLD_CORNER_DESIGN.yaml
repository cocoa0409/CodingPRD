# ===========================================================================
# 1.9 Scaffold Corner Design — breadth coverage index for task 2892
# (Design System Governance). Walked row-by-row against
# references/claim-extraction-guide.md; `section:` values are the guide's nine
# sections and `claim_type:` values are its per-section table rows.
# Corners already probed by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# `excluded_because:` stubs naming the covering §1.8 instance.
# Query-string parameters (limit / offset / filters / view) travel in
# `payload:` because §1.5 declares them in each endpoint's `input:` list.
# ===========================================================================
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:

      - name: component_creation_returns_201_with_success_envelope_and_declared_defaults
        claim_type: Creation
        grounds:
          - entities.Component
          - entities.Component.fields.maturity_level
          - entities.Component.fields.lifecycle_state
          - endpoints["POST /design-system/components"]
        distinguishing_aspect: |
          A create carrying only the required inputs must return 201, the success envelope
          (meta.api_request_id, meta.api_request_timestamp, response_type object, data) and
          every declared default at once: maturity_level EXPERIMENTAL, lifecycle_state ACTIVE,
          current_major_version 1, docs_state MISSING, coverage_state NONE, version 1.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild` exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
          trigger:
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id, maturity: $.data.maturity_level, lifecycle: $.data.lifecycle_state, docs: $.data.docs_state, major: $.data.current_major_version, coverage: $.data.coverage_state, ver: $.data.version, created: $.data.created_at }
          assert:
            - "HTTP status == 201"
            - "response_type == object and meta.api_request_id is present and meta.api_request_timestamp is present"
            - "${maturity} == EXPERIMENTAL and ${lifecycle} == ACTIVE and ${docs} == MISSING"
            - "${major} == 1 and ${coverage} == NONE and ${ver} == 1"
            - "${created} == 2026-08-01T00:00:00.000Z"
            - "Component.${comp_id}.owning_team_id == ${team_id}"
            - "Component.${comp_id}.conformance_baseline_at == 2026-08-01T00:00:00.000Z"

      - name: component_read_returns_exactly_the_stored_row
        claim_type: Retrieval
        grounds:
          - entities.Component
          - endpoints["GET /design-system/components/{id}"]
        distinguishing_aspect: |
          GET /{id} must echo the stored row unchanged — same id, slug, owning_team_id,
          docs_state and version as the create response — and a read must never bump version.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; Component `badge` created with docs_state DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}", docs_state: "DRAFT" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id, ver_on_create: $.data.version }
          trigger:
            - call: "GET /design-system/components/${comp_id}"
              payload: {}
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { read_id: $.data.id, read_slug: $.data.slug, read_team: $.data.owning_team_id, read_ver: $.data.version, read_docs: $.data.docs_state }
          assert:
            - "HTTP status == 200 and response_type == object"
            - "${read_id} == ${comp_id} and ${read_slug} == badge and ${read_team} == ${team_id}"
            - "${read_docs} == DRAFT"
            - "${ver_on_create} == 1 and ${read_ver} == 1"

      - name: component_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - entities.Component
          - endpoints["GET /design-system/components"]
        distinguishing_aspect: |
          Three components with limit 2 / offset 0 must return exactly 2 rows, total_count 3
          and has_more true; the same call at offset 2 returns 1 row and has_more false, with
          no id repeated across the two pages.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; Components `badge`, `chip`, `switch`"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { c1: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Chip", slug: "chip", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { c2: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Switch", slug: "switch", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { c3: $.data.id }
          trigger:
            - call: "GET /design-system/components"
              payload: { limit: 2, offset: 0 }
              as: DesignSystemLead
          assert:
            - "HTTP status == 200 and response_type == array"
            - "len(data) == 2 and total_count == 3 and has_more == true and limit == 2 and offset == 0"
            - "the same GET with limit 2 / offset 2 returns len(data) == 1, total_count 3, has_more == false"
            - "every returned id is drawn from {${c1}, ${c2}, ${c3}} with no id repeated across the two pages"

      - name: component_read_with_unknown_uuid_returns_component_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_COMPONENT_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: |
          A well-formed but unknown path id must produce ERR_COMPONENT_NOT_FOUND at 404 with
          response_type error — not an empty 200 body and not a 400.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "no Component with id 11111111-1111-4111-8111-111111111111 exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
          trigger:
            - call: "GET /design-system/components/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: DesignSystemLead
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_COMPONENT_NOT_FOUND"
            - "HTTP status == 404 and response_type == error"
            - "data.message is a non-empty string and data carries no Component fields"

      - name: team_creation_without_slug_is_refused_as_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - entities.Team.fields.slug
        distinguishing_aspect: |
          `slug` is source input with no default, so omitting it must fail shape validation
          with ERR_INVALID_REQUEST at 400 and persist no Team row at all.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "no Team rows exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /design-system/teams"
              payload: { name: "Slugless Team", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status == 400"
            - "GET /design-system/teams returns total_count == 0"

      - name: team_and_release_optional_inputs_fall_back_to_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Team.fields.platform_scope
          - entities.Team.fields.debt_budget_points
          - entities.Release.fields.channel
          - entities.Release.fields.release_notes_state
        distinguishing_aspect: |
          Omitting platform_scope and debt_budget_points must yield ALL and 40.00 exactly —
          not null and not 0.00 — and omitting a Release channel must yield STABLE with state
          DRAFT, release_notes_state PENDING and semver still null before publication.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /design-system/teams"
              payload: { name: "Defaults Team", slug: "defaults-team" }
              as: SystemAdmin
              captures: { team_id: $.data.id, scope: $.data.platform_scope, budget: $.data.debt_budget_points, debt_state: $.data.debt_state, out_debt: $.data.outstanding_debt_points, adopt_latest: $.data.adoption_index_latest }
            - call: "POST /design-system/releases"
              payload: { semver_base: "3.4.0" }
              as: SystemAdmin
              captures: { rel_channel: $.data.channel, rel_state: $.data.state, rel_notes: $.data.release_notes_state, rel_semver: $.data.semver, rel_bc: $.data.breaking_change_count }
          assert:
            - "HTTP status == 201 for both calls"
            - "${scope} == ALL and ${budget} == 40.00 and ${debt_state} == CLEAR"
            - "${out_debt} == 0.00 and ${adopt_latest} == 0.00"
            - "${rel_channel} == STABLE and ${rel_state} == DRAFT and ${rel_notes} == PENDING"
            - "${rel_semver} == null and ${rel_bc} == 0"

      - name: implementation_computed_fields_ignore_client_supplied_values
        claim_type: Computed Fields
        grounds:
          - entities.PlatformImplementation.fields.status
          - entities.PlatformImplementation.fields.conformance_score
          - entities.PlatformImplementation.fields.last_audit_sequence
          - endpoints["POST /design-system/components/{id}/platform-implementations"]
        distinguishing_aspect: |
          status, conformance_score and last_audit_sequence are not in the endpoint's input
          list; supplying them in the body must be ignored outright and the server values
          (PLANNED, 0.00, 0, shipped_at null) written instead, leaving coverage_state NONE.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; Component `badge`"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
          trigger:
            - call: "POST /design-system/components/${comp_id}/platform-implementations"
              payload: { platform: "WEB", package_name: "@ds/badge-web", package_version: "1.0.0", token_compliance_ratio: 0.94 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { impl_id: $.data.id, status: $.data.status, score: $.data.conformance_score, seq: $.data.last_audit_sequence, shipped: $.data.shipped_at }
            - call: "POST /design-system/platform-implementations/${impl_id}/accessibility-audits"
              payload: { method: "AUTOMATED", wcag_level: "AA", violations_critical: 0, violations_serious: 1, violations_moderate: 3, evidence_url: "https://ds.example.com/a11y/web-1" }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { load: $.data.defect_load, seq_1: $.data.audit_sequence }
            - call: "GET /design-system/platform-implementations/${impl_id}"
              payload: {}
              as: DesignSystemLead
              captures: { score_after: $.data.conformance_score, seq_after: $.data.last_audit_sequence }
          assert:
            - "HTTP status == 201"
            - "${status} == PLANNED"
            - "${score} == 0.00 and ${seq} == 0 and ${shipped} == null"
            - "${load} == 7 and ${seq_1} == 1"
            - "${score_after} == 72.20 and ${seq_after} == 1"
            - "PlatformImplementation.${impl_id}.token_compliance_ratio == 0.94 (the one field on this row a client may set)"
            - "Component.${comp_id}.shipped_platform_count == 0 and Component.${comp_id}.coverage_state == NONE"

      - name: system_fields_are_server_minted_and_client_ids_are_ignored
        claim_type: System Fields
        grounds:
          - entities.Component
          - entities.Team
        distinguishing_aspect: |
          id / created_at / updated_at / version are server-minted, and §1.5 declares no input
          slot for any of them on any endpoint: the minted id must be a bare UUID with no type
          prefix, version must start at exactly 1, created_at and updated_at must both be the
          logical clock (not wall-clock time), and two creations in the same request instant must
          still receive distinct ids.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
          trigger:
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id, ver: $.data.version, created: $.data.created_at, updated: $.data.updated_at }
            - call: "POST /design-system/components"
              payload: { name: "Chip", slug: "chip", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { comp_id_2: $.data.id, ver_2: $.data.version, created_2: $.data.created_at }
          assert:
            - "HTTP status == 201"
            - "${comp_id} and ${comp_id_2} are bare UUID strings with no type prefix and ${comp_id} != ${comp_id_2}"
            - "${ver} == 1 and ${ver_2} == 1"
            - "${created} == 2026-08-01T00:00:00.000Z and ${updated} == 2026-08-01T00:00:00.000Z"
            - "${created_2} == 2026-08-01T00:00:00.000Z (the pinned logical clock, not wall-clock time)"

      - name: invalid_platform_enum_member_is_refused_by_shape_validation
        claim_type: Type Constraints
        grounds:
          - validations[priority=3]
          - entities.PlatformImplementation.fields.platform
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          `platform` is constrained to WEB / IOS / ANDROID; the plausible-but-undeclared
          member WATCH must be refused with ERR_INVALID_REQUEST at 400 with no row written.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; Component `badge`"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
          trigger:
            - call: "POST /design-system/components/${comp_id}/platform-implementations"
              payload: { platform: "WATCH", package_name: "@ds/badge-watch", package_version: "1.0.0", token_compliance_ratio: 0.95 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status == 400"
            - "GET /design-system/components/${comp_id}/platform-implementations returns total_count == 0"

      - name: accessibility_audit_rows_are_append_only_with_no_version_field
        claim_type: Immutability
        grounds:
          - entities.AccessibilityAudit
          - entities.AdoptionScan
          - entities.ReviewRecord
        distinguishing_aspect: |
          AccessibilityAudit declares common_fields false, so its response must carry id and
          created_at but NEITHER version NOR updated_at, and §1.5 must expose no PUT/PATCH/
          DELETE route for it — evidence is corrected only by filing a newer row, which is
          precisely why the governance_sweep variant keeps seeing the worst historical row.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; Component `badge` with one WEB implementation"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
            - call: "POST /design-system/components/${comp_id}/platform-implementations"
              payload: { platform: "WEB", package_name: "@ds/badge-web", package_version: "1.0.0", token_compliance_ratio: 0.95 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { impl_id: $.data.id }
          trigger:
            - call: "POST /design-system/platform-implementations/${impl_id}/accessibility-audits"
              payload: { method: "AUTOMATED", wcag_level: "AA", violations_critical: 0, violations_serious: 1, violations_moderate: 2, evidence_url: "https://ds.example.com/a11y/badge-auto-1" }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { audit_id: $.data.id, seq: $.data.audit_sequence, load: $.data.defect_load, audited: $.data.audited_at }
          assert:
            - "HTTP status == 201"
            - "${seq} == 1 and ${load} == 6 and ${audited} == 2026-08-01T00:00:00.000Z"
            - "the data object for ${audit_id} contains id and created_at but contains neither version nor updated_at"
            - "§1.5 declares no PUT, PATCH or DELETE route addressing an AccessibilityAudit, AdoptionScan or ReviewRecord row"
            - "PlatformImplementation.${impl_id}.last_audit_sequence == 1"

      - name: implementation_creation_under_unknown_component_path_id_is_refused
        claim_type: Parent Relationships
        grounds:
          - validations[priority=4]
          - errors[ERR_COMPONENT_NOT_FOUND]
          - endpoints["POST /design-system/components/{id}/platform-implementations"]
        distinguishing_aspect: |
          The sub-resource route resolves its path id before any body-level check, so an
          unknown parent component id must give ERR_COMPONENT_NOT_FOUND at 404 even though the
          body itself is perfectly well formed.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild` exists; no Component with id 33333333-3333-4333-8333-333333333333 exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
          trigger:
            - call: "POST /design-system/components/33333333-3333-4333-8333-333333333333/platform-implementations"
              payload: { platform: "WEB", package_name: "@ds/ghost-web", package_version: "1.0.0", token_compliance_ratio: 0.95 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_COMPONENT_NOT_FOUND"
            - "HTTP status == 404"

      - name: dependency_edge_that_would_close_a_graph_cycle_is_refused
        claim_type: graph
        grounds:
          - validations[priority=18]
          - errors[ERR_DEPENDENCY_CYCLE]
          - entities.ComponentDependency
        distinguishing_aspect: |
          ComponentDependency is a DAG junction: with alpha -> beta and beta -> gamma present,
          the edge gamma -> alpha closes a three-node cycle over the transitive closure and
          must be refused with ERR_DEPENDENCY_CYCLE at 409 while both existing edges stay
          COMPATIBLE and no third edge row is created.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; Components `alpha`, `beta`, `gamma` at current_major_version 1"
            - "dependency edges alpha -> beta and beta -> gamma, both COMPATIBLE at pinned_provider_major 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Alpha", slug: "alpha", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { a_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Beta", slug: "beta", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { b_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Gamma", slug: "gamma", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { g_id: $.data.id }
            - call: "POST /design-system/components/${a_id}/dependencies"
              payload: { provider_component_id: "${b_id}", pinned_provider_major: 1 }
              as: DesignSystemLead
              captures: { dep_ab: $.data.id, dep_ab_state: $.data.compatibility_state }
            - call: "POST /design-system/components/${b_id}/dependencies"
              payload: { provider_component_id: "${g_id}", pinned_provider_major: 1 }
              as: DesignSystemLead
              captures: { dep_bg: $.data.id, dep_bg_state: $.data.compatibility_state }
          trigger:
            - call: "POST /design-system/components/${g_id}/dependencies"
              payload: { provider_component_id: "${a_id}", pinned_provider_major: 1 }
              as: DesignSystemLead
              captures: { err: $.data.error_id }
          assert:
            - "${dep_ab_state} == COMPATIBLE and ${dep_bg_state} == COMPATIBLE"
            - "${err} == ERR_DEPENDENCY_CYCLE"
            - "HTTP status == 409"
            - "ComponentDependency.${dep_ab}.compatibility_state == COMPATIBLE and ComponentDependency.${dep_bg}.compatibility_state == COMPATIBLE"
            - "GET /design-system/components/${g_id}/dependencies with direction CONSUMES returns total_count == 0"

  # =========================================================================
  - section: state_machines
    instances:

      - name: newly_created_rows_start_in_their_declared_initial_states
        claim_type: Initial State
        grounds:
          - state_machines.ContributionProposal.initial_state
          - state_machines.PlatformImplementation.initial_state
          - state_machines.ExceptionGrant.initial_state
          - state_machines.DeprecationPlan.initial_state
        distinguishing_aspect: |
          Four independent machines must each open in their declared initial state on the very
          first write: ContributionProposal DRAFT, PlatformImplementation PLANNED,
          ExceptionGrant REQUESTED, DeprecationPlan DRAFT — and none of them may skip ahead
          because a later gate would have been satisfiable.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; TokenSet `core`; Component `badge`"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/token-sets"
              payload: { name: "Core", slug: "core", default_brand: "BASE", default_mode: "LIGHT" }
              as: DesignSystemLead
              captures: { ts_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
          trigger:
            - call: "POST /design-system/contribution-proposals"
              payload: { title: "Badge density tweak", author_team_id: "${team_id}", target_component_id: "${comp_id}", pinned_token_set_id: "${ts_id}", proposal_kind: "ENHANCEMENT", touches_public_api: false }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { prop_id: $.data.id, prop_state: $.data.state, prop_round: $.data.revision_round, prop_submitted: $.data.submitted_at }
            - call: "POST /design-system/components/${comp_id}/platform-implementations"
              payload: { platform: "WEB", package_name: "@ds/badge-web", package_version: "1.0.0", token_compliance_ratio: 0.95 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { impl_id: $.data.id, impl_status: $.data.status }
            - call: "POST /design-system/exception-grants"
              payload: { requesting_team_id: "${team_id}", substitute_for_component_id: "${comp_id}", exception_kind: "RAW_TOKEN_USAGE", platform_scope: "WEB", justification: "temporary hard-coded brand blue", expires_at: "2026-10-01T00:00:00.000Z" }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { grant_id: $.data.id, grant_state: $.data.state, grant_points: $.data.debt_points }
            - call: "POST /design-system/components/${comp_id}/deprecation-plans"
              payload: { announced_at: "2026-08-01T00:00:00.000Z", sunset_at: "2026-08-20T00:00:00.000Z", removal_at: "2026-09-25T00:00:00.000Z", migration_guide_url: "https://ds.example.com/migrate/badge" }
              as: DesignSystemLead
              captures: { plan_id: $.data.id, plan_state: $.data.state, guide_state: $.data.migration_guide_state }
          assert:
            - "${prop_state} == DRAFT and ${prop_round} == 0 and ${prop_submitted} == null"
            - "${impl_status} == PLANNED"
            - "${grant_state} == REQUESTED and ${grant_points} == 0.00"
            - "${plan_state} == DRAFT and ${guide_state} == DRAFT"
            - "Team.${team_id}.outstanding_debt_points == 0.00 (a REQUESTED grant carries no debt)"
            - "Component.${comp_id}.lifecycle_state == ACTIVE (a DRAFT plan does not announce anything)"

      - name: proposal_submit_pins_token_version_and_freezes_the_evidence_set
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ContributionProposal.transitions.DRAFT_to_DESIGN_CRITIQUE
          - calculations.required_evidence_kinds
          - entities.ContributionProposal.fields.pinned_token_set_version
          - entities.ContributionProposal.fields.revision_round
        distinguishing_aspect: |
          One submit must execute every declared side effect at once: state DRAFT ->
          DESIGN_CRITIQUE, revision_round 0 -> 1, submitted_at stamped from the logical clock,
          pinned_token_set_version pinned to the TokenSet's current version 2 (not 1, because a
          token write already bumped it) and required_evidence_kinds computed as the
          ENHANCEMENT base set [A11Y_AUTOMATED, TOKEN_COMPLIANCE] with no PLATFORM_PARITY,
          since the target component's coverage_state is still NONE.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; TokenSet `core` carrying one token so its version is 2"
            - "Component `badge` with no shipped implementation (coverage_state NONE)"
            - "DRAFT ENHANCEMENT proposal that does not touch the public API"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/token-sets"
              payload: { name: "Core", slug: "core", default_brand: "BASE", default_mode: "LIGHT" }
              as: DesignSystemLead
              captures: { ts_id: $.data.id, ts_ver_0: $.data.version }
            - call: "POST /design-system/tokens"
              payload: { token_set_id: "${ts_id}", name: "color.brand.base", category: "COLOR", expected_token_set_version: "${ts_ver_0}", raw_value: "#0055FF" }
              as: DesignSystemLead
              captures: { tok_id: $.data.id }
            - call: "GET /design-system/token-sets/${ts_id}"
              payload: {}
              as: DesignSystemLead
              captures: { ts_ver_1: $.data.version }
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
            - call: "POST /design-system/contribution-proposals"
              payload: { title: "Badge density tweak", author_team_id: "${team_id}", target_component_id: "${comp_id}", pinned_token_set_id: "${ts_id}", proposal_kind: "ENHANCEMENT", touches_public_api: false }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /design-system/contribution-proposals/${prop_id}/submit"
              payload: {}
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { state: $.data.state, round: $.data.revision_round, submitted: $.data.submitted_at, pinned: $.data.pinned_token_set_version, required: $.data.required_evidence_kinds, submitted_kinds: $.data.submitted_evidence_kinds }
          assert:
            - "HTTP status == 200"
            - "${ts_ver_1} == 2"
            - "${state} == DESIGN_CRITIQUE and ${round} == 1"
            - "${submitted} == 2026-08-01T00:00:00.000Z"
            - "${pinned} == 2"
            - "${required} == [A11Y_AUTOMATED, TOKEN_COMPLIANCE]"
            - "${submitted_kinds} == []"

      - name: submit_by_a_team_that_does_not_own_the_proposal_is_refused
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=6]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - state_machines.ContributionProposal.transitions.DRAFT_to_DESIGN_CRITIQUE
        distinguishing_aspect: |
          The transition's ownership precondition is enforced against X-User-ID, not against the
          role: a second ContributingTeam with a perfectly valid role is refused with
          ERR_NOT_RESOURCE_OWNER at 403 and the proposal stays in DRAFT at revision_round 0.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Teams `design-guild` (author) and `intruder`; TokenSet `core`; Component `badge`"
            - "DRAFT proposal authored by `design-guild`"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/teams"
              payload: { name: "Intruder", slug: "intruder", platform_scope: "WEB_ONLY", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { other_team_id: $.data.id }
            - call: "POST /design-system/token-sets"
              payload: { name: "Core", slug: "core", default_brand: "BASE", default_mode: "LIGHT" }
              as: DesignSystemLead
              captures: { ts_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
            - call: "POST /design-system/contribution-proposals"
              payload: { title: "Badge density tweak", author_team_id: "${team_id}", target_component_id: "${comp_id}", pinned_token_set_id: "${ts_id}", proposal_kind: "ENHANCEMENT", touches_public_api: false }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /design-system/contribution-proposals/${prop_id}/submit"
              payload: {}
              as: ContributingTeam
              as_user_id: "${other_team_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_RESOURCE_OWNER"
            - "HTTP status == 403"
            - "ContributionProposal.${prop_id}.state == DRAFT and ContributionProposal.${prop_id}.revision_round == 0"
            - "ContributionProposal.${prop_id}.submitted_at == null"

      - name: accept_attempted_from_design_critique_is_not_a_declared_transition
        claim_type: Invalid Transitions
        grounds:
          - validations[priority=7]
          - errors[ERR_INVALID_PROPOSAL_STATE]
          - state_machines.ContributionProposal.transitions.READY_FOR_ACCEPTANCE_to_ACCEPTED
        distinguishing_aspect: |
          accept is declared only out of READY_FOR_ACCEPTANCE. Firing it while the proposal sits
          at DESIGN_CRITIQUE must give ERR_INVALID_PROPOSAL_STATE at 409 — the state gate at
          priority 7 outranks the evidence and OCC checks, so the response is 409 rather than
          the 422 the incomplete evidence set would otherwise produce.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; TokenSet `core`; Component `badge`; DRAFT release cut"
            - "proposal submitted once, so it sits at DESIGN_CRITIQUE with no evidence filed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/token-sets"
              payload: { name: "Core", slug: "core", default_brand: "BASE", default_mode: "LIGHT" }
              as: DesignSystemLead
              captures: { ts_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id, comp_ver: $.data.version }
            - call: "POST /design-system/releases"
              payload: { semver_base: "2.3.4" }
              as: SystemAdmin
              captures: { rel_id: $.data.id }
            - call: "POST /design-system/contribution-proposals"
              payload: { title: "Badge density tweak", author_team_id: "${team_id}", target_component_id: "${comp_id}", pinned_token_set_id: "${ts_id}", proposal_kind: "ENHANCEMENT", touches_public_api: false }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /design-system/contribution-proposals/${prop_id}/submit"
              payload: {}
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { state_after_submit: $.data.state }
          trigger:
            - call: "POST /design-system/contribution-proposals/${prop_id}/accept"
              payload: { release_id: "${rel_id}", expected_component_version: "${comp_ver}" }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { err: $.data.error_id }
          assert:
            - "${state_after_submit} == DESIGN_CRITIQUE"
            - "${err} == ERR_INVALID_PROPOSAL_STATE"
            - "HTTP status == 409"
            - "ContributionProposal.${prop_id}.state == DESIGN_CRITIQUE and ContributionProposal.${prop_id}.released_in_release_id == null"
            - "ContributionProposal.${prop_id}.accepted_at == null"

      - name: republishing_a_published_release_is_refused_from_its_terminal_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Release.transitions.DRAFT_to_PUBLISHED
          - state_machines.Release.terminal_states
          - errors[ERR_INVALID_RELEASE_STATE]
          - calculations.release_version_bump
        distinguishing_aspect: |
          PUBLISHED is the Release machine's only terminal state. The first publish must run the
          version bump over one PATCH-class proposal (semver_base 2.3.4 -> semver 2.3.5,
          policy_tier INCREMENTAL, breaking_ratio 0.0000, breaking_change_count 0,
          escalated_proposal_count 0, release_notes_state PUBLISHED); a second publish must be
          refused with ERR_INVALID_RELEASE_STATE at 409 and must not re-run the bump, so the
          semver stays 2.3.5 rather than sliding to 2.3.6.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; TokenSet `core` at version 1; Component `badge` (EXPERIMENTAL, coverage NONE, docs MISSING)"
            - "one ENHANCEMENT proposal not touching the public API, reviewed through both gates and accepted into a DRAFT release cut from semver_base 2.3.4"
            - "the release has already been published once"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/token-sets"
              payload: { name: "Core", slug: "core", default_brand: "BASE", default_mode: "LIGHT" }
              as: DesignSystemLead
              captures: { ts_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
            - call: "POST /design-system/releases"
              payload: { semver_base: "2.3.4", channel: "STABLE" }
              as: SystemAdmin
              captures: { rel_id: $.data.id, rel_state_0: $.data.state, rel_semver_0: $.data.semver }
            - call: "POST /design-system/contribution-proposals"
              payload: { title: "Badge density tweak", author_team_id: "${team_id}", target_component_id: "${comp_id}", pinned_token_set_id: "${ts_id}", proposal_kind: "ENHANCEMENT", touches_public_api: false }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /design-system/contribution-proposals/${prop_id}/submit"
              payload: {}
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { required: $.data.required_evidence_kinds }
            - call: "POST /design-system/contribution-proposals/${prop_id}/acceptance-evidence"
              payload: { evidence_kinds: ["A11Y_AUTOMATED", "TOKEN_COMPLIANCE", "DOC_PAGE"], evidence_url: "https://ds.example.com/evidence/badge-r1" }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { submitted_kinds: $.data.submitted_evidence_kinds }
            - call: "POST /design-system/contribution-proposals/${prop_id}/reviews"
              payload: { stage: "DESIGN_CRITIQUE", verdict: "APPROVE", notes: "spacing reads well" }
              as: DesignCritiqueReviewer
              as_user_id: "critic-1"
              captures: { r1_result: $.data.resulting_proposal_state }
            - call: "POST /design-system/contribution-proposals/${prop_id}/reviews"
              payload: { stage: "ENGINEERING_REVIEW", verdict: "APPROVE", notes: "no public API change" }
              as: EngineeringReviewer
              as_user_id: "eng-1"
              captures: { r2_result: $.data.resulting_proposal_state }
            - call: "GET /design-system/components/${comp_id}"
              payload: {}
              as: DesignSystemLead
              captures: { comp_ver: $.data.version }
            - call: "POST /design-system/contribution-proposals/${prop_id}/accept"
              payload: { release_id: "${rel_id}", expected_component_version: "${comp_ver}" }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { prop_state: $.data.state, prop_release: $.data.released_in_release_id, prop_accepted: $.data.accepted_at }
            - call: "GET /design-system/components/${comp_id}"
              payload: {}
              as: DesignSystemLead
              captures: { docs_after_accept: $.data.docs_state }
            - call: "POST /design-system/releases/${rel_id}/publish"
              payload: {}
              as: SystemAdmin
              captures: { rel_state_1: $.data.state, semver_1: $.data.semver, tier_1: $.data.policy_tier, ratio_1: $.data.breaking_ratio, bc_1: $.data.breaking_change_count, esc_1: $.data.escalated_proposal_count, notes_1: $.data.release_notes_state, published_1: $.data.published_at }
          trigger:
            - call: "POST /design-system/releases/${rel_id}/publish"
              payload: {}
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${rel_state_0} == DRAFT and ${rel_semver_0} == null"
            - "${required} == [A11Y_AUTOMATED, TOKEN_COMPLIANCE]"
            - "${submitted_kinds} == [A11Y_AUTOMATED, DOC_PAGE, TOKEN_COMPLIANCE]"
            - "${r1_result} == ENGINEERING_REVIEW and ${r2_result} == READY_FOR_ACCEPTANCE"
            - "${comp_ver} == 1"
            - "${prop_state} == ACCEPTED and ${prop_release} == ${rel_id} and ${prop_accepted} == 2026-08-01T00:00:00.000Z"
            - "${docs_after_accept} == PUBLISHED"
            - "${rel_state_1} == PUBLISHED and ${semver_1} == 2.3.5 and ${tier_1} == INCREMENTAL"
            - "${ratio_1} == 0.0000 and ${bc_1} == 0 and ${esc_1} == 0"
            - "${notes_1} == PUBLISHED and ${published_1} == 2026-08-01T00:00:00.000Z"
            - "${err} == ERR_INVALID_RELEASE_STATE"
            - "HTTP status == 409 on the second publish"
            - "GET /design-system/contribution-proposals with released_in_release_id ${rel_id} returns total_count == 1 and that row's state == ACCEPTED and effective_change_class == PATCH"

      - name: shipping_an_already_shipped_implementation_twice_is_refused
        claim_type: Idempotency
        grounds:
          - state_machines.PlatformImplementation.transitions.PLANNED_to_SHIPPED
          - validations[priority=7]
          - errors[ERR_INVALID_IMPLEMENTATION_STATE]
          - calculations.platform_coverage_state
        distinguishing_aspect: |
          ship is declared out of PLANNED and BLOCKED only. The first ship must succeed and
          write shipped_platform_count 1 / coverage_state WEB_ONLY / governance score 75.00
          (AUTOMATED-only clean evidence carries one 25.00 missing-method penalty); firing the
          identical request again must give ERR_INVALID_IMPLEMENTATION_STATE at 409 without
          re-stamping shipped_at and without double-counting the platform.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; Component `badge`; WEB implementation with one clean AUTOMATED AA audit"
            - "the implementation has already been shipped once"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
            - call: "POST /design-system/components/${comp_id}/platform-implementations"
              payload: { platform: "WEB", package_name: "@ds/badge-web", package_version: "1.0.0", token_compliance_ratio: 0.95 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { impl_id: $.data.id }
            - call: "POST /design-system/platform-implementations/${impl_id}/accessibility-audits"
              payload: { method: "AUTOMATED", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/badge-clean" }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { load_0: $.data.defect_load }
            - call: "POST /design-system/platform-implementations/${impl_id}/ship"
              payload: { package_version: "1.0.0", token_compliance_ratio: 0.95 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { status_1: $.data.status, shipped_1: $.data.shipped_at, score_1: $.data.conformance_score, blocked_1: $.data.blocked_reason }
            - call: "GET /design-system/components/${comp_id}"
              payload: {}
              as: DesignSystemLead
              captures: { count_1: $.data.shipped_platform_count, coverage_1: $.data.coverage_state, gov_1: $.data.governance_conformance_score }
          trigger:
            - call: "POST /design-system/platform-implementations/${impl_id}/ship"
              payload: { package_version: "1.0.1", token_compliance_ratio: 0.99 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${load_0} == 0"
            - "${status_1} == SHIPPED and ${shipped_1} == 2026-08-01T00:00:00.000Z and ${blocked_1} == NONE"
            - "${score_1} == 75.00"
            - "${count_1} == 1 and ${coverage_1} == WEB_ONLY and ${gov_1} == 75.00"
            - "${err} == ERR_INVALID_IMPLEMENTATION_STATE"
            - "HTTP status == 409"
            - "PlatformImplementation.${impl_id}.package_version == 1.0.0 and token_compliance_ratio == 0.95 (the refused call wrote nothing)"
            - "Component.${comp_id}.shipped_platform_count == 1 and Component.${comp_id}.coverage_state == WEB_ONLY"

      - name: fourth_submit_hits_the_revision_round_termination_condition
        claim_type: cyclic
        grounds:
          - state_machines.ContributionProposal.transitions.CHANGES_REQUESTED_to_DESIGN_CRITIQUE
          - validations[priority=22]
          - errors[ERR_REVISION_LIMIT_EXCEEDED]
          - entities.ContributionProposal.fields.revision_round
        distinguishing_aspect: |
          The proposal machine is cyclic, and the loop's termination condition is
          revision_round + 1 <= 3. Three submit / REQUEST_CHANGES laps must all be admitted
          (rounds 1, 2, 3); the fourth submit must be refused with ERR_REVISION_LIMIT_EXCEEDED
          at 422 with the proposal left in CHANGES_REQUESTED at round 3 — an entirely different
          claim from the §1.8 cycle instance, which asserts what a lap does to the evidence set
          rather than where the lap counter stops.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; TokenSet `core`; Component `badge`"
            - "proposal submitted and sent back three times, so it sits in CHANGES_REQUESTED at revision_round 3"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/token-sets"
              payload: { name: "Core", slug: "core", default_brand: "BASE", default_mode: "LIGHT" }
              as: DesignSystemLead
              captures: { ts_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
            - call: "POST /design-system/contribution-proposals"
              payload: { title: "Badge density tweak", author_team_id: "${team_id}", target_component_id: "${comp_id}", pinned_token_set_id: "${ts_id}", proposal_kind: "ENHANCEMENT", touches_public_api: false }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /design-system/contribution-proposals/${prop_id}/submit"
              payload: {}
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { round_1: $.data.revision_round }
            - call: "POST /design-system/contribution-proposals/${prop_id}/reviews"
              payload: { stage: "DESIGN_CRITIQUE", verdict: "REQUEST_CHANGES", notes: "tighten the density scale" }
              as: DesignCritiqueReviewer
              as_user_id: "critic-1"
              captures: { back_1: $.data.resulting_proposal_state }
            - call: "POST /design-system/contribution-proposals/${prop_id}/submit"
              payload: {}
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { round_2: $.data.revision_round }
            - call: "POST /design-system/contribution-proposals/${prop_id}/reviews"
              payload: { stage: "DESIGN_CRITIQUE", verdict: "REQUEST_CHANGES", notes: "still off by one step" }
              as: DesignCritiqueReviewer
              as_user_id: "critic-1"
              captures: { back_2: $.data.resulting_proposal_state }
            - call: "POST /design-system/contribution-proposals/${prop_id}/submit"
              payload: {}
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { round_3: $.data.revision_round }
            - call: "POST /design-system/contribution-proposals/${prop_id}/reviews"
              payload: { stage: "DESIGN_CRITIQUE", verdict: "REQUEST_CHANGES", notes: "one more pass please" }
              as: DesignCritiqueReviewer
              as_user_id: "critic-1"
              captures: { back_3: $.data.resulting_proposal_state }
          trigger:
            - call: "POST /design-system/contribution-proposals/${prop_id}/submit"
              payload: {}
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${round_1} == 1 and ${round_2} == 2 and ${round_3} == 3"
            - "${back_1} == CHANGES_REQUESTED and ${back_2} == CHANGES_REQUESTED and ${back_3} == CHANGES_REQUESTED"
            - "${err} == ERR_REVISION_LIMIT_EXCEEDED"
            - "HTTP status == 422"
            - "ContributionProposal.${prop_id}.state == CHANGES_REQUESTED and ContributionProposal.${prop_id}.revision_round == 3"
            - "GET /design-system/contribution-proposals/${prop_id}/reviews returns total_count == 3 with revision_round values 1, 2, 3 in created_at ASC order"

      - name: advancing_an_announced_plan_before_its_sunset_instant_is_refused
        claim_type: guarded transitions
        grounds:
          - state_machines.DeprecationPlan.transitions.ANNOUNCED_to_SUNSET
          - validations[priority=28]
          - errors[ERR_DEPRECATION_ADVANCE_NOT_DUE]
          - calculations.deprecation_notice_window
        distinguishing_aspect: |
          ANNOUNCED -> SUNSET is guarded by the logical clock, not by the caller: with the clock
          at 2026-08-01 and sunset_at 2026-08-20 the advance must fail with
          ERR_DEPRECATION_ADVANCE_NOT_DUE at 409 even though the migration guide is already
          PUBLISHED — so the timing guard, not the guide guard, is what refuses the call — and
          the component must stay in DEPRECATION_ANNOUNCED rather than sliding to SUNSET.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; Component `badge` (EXPERIMENTAL, coverage NONE -> required_notice_days 14)"
            - "plan announced_at 2026-08-01, sunset_at 2026-08-20 (actual_notice_days 19), removal_at 2026-09-25 (36 sunset days)"
            - "the migration guide has been attached with publish=true, so the plan is ANNOUNCED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
            - call: "POST /design-system/components/${comp_id}/deprecation-plans"
              payload: { announced_at: "2026-08-01T00:00:00.000Z", sunset_at: "2026-08-20T00:00:00.000Z", removal_at: "2026-09-25T00:00:00.000Z" }
              as: DesignSystemLead
              captures: { plan_id: $.data.id, req_days: $.data.required_notice_days, act_days: $.data.actual_notice_days, guide_0: $.data.migration_guide_state }
            - call: "POST /design-system/deprecation-plans/${plan_id}/migration-guide"
              payload: { migration_guide_url: "https://ds.example.com/migrate/badge", publish: true }
              as: DesignSystemLead
              captures: { plan_state_1: $.data.state, guide_1: $.data.migration_guide_state }
            - call: "GET /design-system/components/${comp_id}"
              payload: {}
              as: DesignSystemLead
              captures: { lifecycle_1: $.data.lifecycle_state }
          trigger:
            - call: "POST /design-system/deprecation-plans/${plan_id}/advance"
              payload: {}
              as: DesignSystemLead
              captures: { err: $.data.error_id }
          assert:
            - "${req_days} == 14 and ${act_days} == 19 and ${guide_0} == MISSING"
            - "${plan_state_1} == ANNOUNCED and ${guide_1} == PUBLISHED"
            - "${lifecycle_1} == DEPRECATION_ANNOUNCED"
            - "${err} == ERR_DEPRECATION_ADVANCE_NOT_DUE"
            - "HTTP status == 409"
            - "DeprecationPlan.${plan_id}.state == ANNOUNCED and Component.${comp_id}.lifecycle_state == DEPRECATION_ANNOUNCED"

      - name: breaking_change_cascade_down_to_dependent_implementations
        claim_type: Cascade down
        grounds:
          - state_machines.PlatformImplementation.transitions.SHIPPED_to_BLOCKED
          - entities.Team.fields.blocked_implementation_count
        excluded_because:
          difficulty_instance: transitive_cascade / breaking_change_accept_cascades_four_hops_to_team_counter
          rationale: "The four-hop parent-to-children cascade, and the fact that only non-terminal SHIPPED rows are affected, is the whole subject of the named §1.8 instance."

      - name: provider_sunset_cross_entity_adjustment_of_consumer_component
        claim_type: Cross-entity
        grounds:
          - state_machines.Component.transitions.STABLE_to_BETA
          - entities.ComponentDependency.fields.compatibility_state
        excluded_because:
          difficulty_instance: transitive_cascade / provider_sunset_cascades_three_hops_and_demotes_stable_consumer
          rationale: "Entity-A-changes-entity-B verification, including the consumer's demoted maturity_level and its maturity_demotion_reason, is asserted end to end by the named §1.8 instance."

      - name: exception_state_change_syncs_the_team_debt_ledger
        claim_type: Ledger sync
        grounds:
          - entities.Team.fields.outstanding_debt_points
          - entities.Team.fields.lifetime_debt_points
        excluded_because:
          difficulty_instance: compensating_invariant / exception_repayment_returns_outstanding_debt_to_its_pre_approval_value
          rationale: "The named §1.8 instance reconciles the ancestor ledger before and after the grant state change, including the lifetime figure that must NOT move back."

      - name: deprecation_rescission_reverses_its_original_side_effects
        claim_type: Compensation
        grounds:
          - state_machines.DeprecationPlan.transitions.SUNSET_to_RESCINDED
          - entities.Component.fields.blocked_dependency_count
        excluded_because:
          difficulty_instance: compensating_invariant / deprecation_rescission_returns_the_dependency_block_total_but_not_the_demotion
          rationale: "Undo-transition drift is exactly what the named §1.8 instance measures: the dependency block total is restored while the maturity demotion is deliberately not."

      - name: block_cascade_applies_only_to_shipped_dependent_rows
        claim_type: Conditional cascade
        grounds:
          - state_machines.PlatformImplementation.transitions.BLOCKED_to_SHIPPED
          - entities.PlatformImplementation.fields.blocked_reason
        excluded_because:
          difficulty_instance: non_linear_state_machine / implementation_ship_block_reship_cycle_via_dependency_repin
          rationale: "The named §1.8 instance drives the ship -> block -> re-ship lap and asserts that the block applies to the shipped row and is cleared on re-ship."

  # =========================================================================
  - section: calculations
    instances:

      - name: coverage_state_walks_web_only_then_partial_then_full_as_platforms_ship
        claim_type: Correct Result
        grounds:
          - calculations.platform_coverage_state
          - entities.Component.fields.coverage_state
          - entities.Component.fields.shipped_platform_count
        distinguishing_aspect: |
          The enum is not a count: shipping WEB alone gives WEB_ONLY (1), adding IOS gives
          PARTIAL (2) because WEB is present with exactly one mobile platform, and adding
          ANDROID gives FULL (3). The same three ships in mobile-first order would pass through
          MOBILE_ONLY instead, so the state depends on membership rather than cardinality.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; Component `badge` with WEB, IOS and ANDROID implementations"
            - "each implementation carries one clean AUTOMATED AA audit so the ship gate passes"
            - "WEB and IOS have already been shipped"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
            - call: "POST /design-system/components/${comp_id}/platform-implementations"
              payload: { platform: "WEB", package_name: "@ds/badge-web", package_version: "1.0.0", token_compliance_ratio: 0.95 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { web_id: $.data.id }
            - call: "POST /design-system/components/${comp_id}/platform-implementations"
              payload: { platform: "IOS", package_name: "DSBadge", package_version: "1.0.0", token_compliance_ratio: 0.95 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { ios_id: $.data.id }
            - call: "POST /design-system/components/${comp_id}/platform-implementations"
