# =============================================================================
# Task 902 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances. Grounds resolve into
# SCAFFOLD.yaml §1.1–§1.7. All formula-derived asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: claim_estimated_vs_adjudicated_reimbursement
        grounds:
          - calculations.claim_reimbursement
          - state_machines.BillingClaim.SUBMITTED_to_PAID
          - entities.BillingClaim.fields.estimated_reimbursement_cents
          - entities.BillingClaim.fields.adjudicated_reimbursement_cents
        distinguishing_aspect: "On the BILLING domain (BillingClaim): estimated reimbursement uses authorization.allowed_amount_cents (16000) while adjudicated uses payer-returned adjudicated_allowed_cents (15000) — same billed 19500 yields divergent reimbursement/responsibility."
        test_recipe:
          setup:
            - "ACTIVE MODERATE-risk CARDIAC program; TELEMETRY station; APPROVED authorization allowed_amount_cents=18000 copay_cents=2000; one COMPLETED MONITORED_EXERCISE session"
          setup_api_calls:
            - { call: "POST /rehab/patients", payload: { mrn: "M-001", full_name: "Pat One", date_of_birth: "1959-03-15" }, as: RehabCoordinator, captures: { pat: $.data.id } }
            - { call: "POST /rehab/physicians", payload: { full_name: "Dr Ref", npi: "1000000001" }, as: RehabCoordinator, captures: { phy: $.data.id } }
            - { call: "POST /rehab/clinicians", payload: { full_name: "EP One", credential: "EP" }, as: RehabCoordinator, captures: { clin: $.data.id } }
            - { call: "POST /rehab/stations", payload: { name: "Tele-1", station_type: "TELEMETRY" }, as: RehabCoordinator, captures: { st: $.data.id } }
            - { call: "POST /rehab/referrals", payload: { patient_id: "${pat}", physician_id: "${phy}", program_type: "CARDIAC", indication: "post-MI", risk_stratification: "MODERATE" }, as: ReferringPhysician, as_user_id: "${phy}", captures: { ref: $.data.id } }
            - { call: "POST /rehab/referrals/${ref}/decision", payload: { decision: "ACCEPT" }, as: RehabCoordinator }
            - { call: "POST /rehab/programs", payload: { referral_id: "${ref}", current_phase: "PHASE_II" }, as: RehabCoordinator, captures: { prog: $.data.id } }
            - { call: "POST /rehab/authorizations", payload: { program_id: "${prog}", payer_name: "Acme", authorized_visits: 10, allowed_amount_cents: 18000, copay_cents: 2000 }, as: RehabCoordinator, captures: { auth: $.data.id } }
            - { call: "POST /rehab/authorizations/${auth}/approve", payload: {}, as: RehabCoordinator }
            - { call: "POST /rehab/outcomes", payload: { program_id: "${prog}", timing: "BASELINE", distance_meters: 300 }, as: RehabClinician, as_user_id: "${clin}", captures: { base_out: $.data.id } }
            - { call: "POST /rehab/outcomes/${base_out}/finalize", payload: {}, as: RehabClinician, as_user_id: "${clin}" }
            - { call: "POST /rehab/programs/${prog}/activate", payload: {}, as: RehabCoordinator, captures: { pv1: $.data.version } }
            - { call: "POST /rehab/sessions", payload: { program_id: "${prog}", clinician_id: "${clin}", station_id: "${st}", session_type: "MONITORED_EXERCISE", phase: "PHASE_II", scheduled_start: "2026-05-04T09:00:00Z", scheduled_end: "2026-05-04T10:00:00Z", expected_program_version: "${pv1}" }, as: RehabCoordinator, captures: { sess: $.data.id } }
            - { call: "POST /rehab/sessions/${sess}/complete", payload: { post_spo2: 95, rpe: 12, exercise_minutes: 30 }, as: RehabClinician, as_user_id: "${clin}" }
            - { call: "POST /rehab/claims", payload: { program_id: "${prog}", session_id: "${sess}", authorization_id: "${auth}" }, as: BillingSpecialist, captures: { claim: $.data.id, est_reimb: $.data.estimated_reimbursement_cents } }
          trigger:
            - { call: "POST /rehab/claims/${claim}/submit", payload: {}, as: BillingSpecialist }
            - { call: "POST /rehab/claims/${claim}/adjudicate", payload: { outcome: "PAID", adjudicated_allowed_cents: 17000 }, as: BillingSpecialist }
          assert:
            - "BillingClaim.${claim}.billed_amount_cents == 19500"
            - "BillingClaim.${claim}.estimated_reimbursement_cents == 16000"
            - "BillingClaim.${claim}.estimated_patient_responsibility_cents == 3500"
            - "BillingClaim.${claim}.adjudicated_reimbursement_cents == 15000"
            - "BillingClaim.${claim}.patient_responsibility_cents == 4500"

      - name: six_minute_walk_provisional_vs_verified_improvement
        grounds:
          - calculations.six_minute_walk_improvement
          - state_machines.OutcomeAssessment.DRAFT_to_FINALIZED
          - entities.OutcomeAssessment.fields.improvement_meters
          - entities.OutcomeAssessment.fields.improvement_pct
        distinguishing_aspect: "On the CLINICAL OUTCOME domain (OutcomeAssessment): provisional improvement uses the DRAFT discharge distance 360 (60m / 20.0%) while verified uses the finalize-corrected 345 (45m / 15.0%) — a distinct entity domain from claim_reimbursement."
        test_recipe:
          setup:
            - "ACTIVE program with FINALIZED BASELINE 6MWT distance 300; a DRAFT DISCHARGE 6MWT distance 360"
          setup_api_calls:
            - { call: "POST /rehab/patients", payload: { mrn: "M-002", full_name: "Pat Two", date_of_birth: "1960-01-01" }, as: RehabCoordinator, captures: { pat: $.data.id } }
            - { call: "POST /rehab/physicians", payload: { full_name: "Dr Ref", npi: "1000000002" }, as: RehabCoordinator, captures: { phy: $.data.id } }
            - { call: "POST /rehab/clinicians", payload: { full_name: "EP Two", credential: "EP" }, as: RehabCoordinator, captures: { clin: $.data.id } }
            - { call: "POST /rehab/stations", payload: { name: "Tele-2", station_type: "TELEMETRY" }, as: RehabCoordinator, captures: { st: $.data.id } }
            - { call: "POST /rehab/referrals", payload: { patient_id: "${pat}", physician_id: "${phy}", program_type: "PULMONARY", indication: "COPD", risk_stratification: "MODERATE" }, as: ReferringPhysician, as_user_id: "${phy}", captures: { ref: $.data.id } }
            - { call: "POST /rehab/referrals/${ref}/decision", payload: { decision: "ACCEPT" }, as: RehabCoordinator }
            - { call: "POST /rehab/programs", payload: { referral_id: "${ref}" }, as: RehabCoordinator, captures: { prog: $.data.id } }
            - { call: "POST /rehab/authorizations", payload: { program_id: "${prog}", payer_name: "Acme", authorized_visits: 10, allowed_amount_cents: 18000, copay_cents: 2000 }, as: RehabCoordinator, captures: { auth: $.data.id } }
            - { call: "POST /rehab/authorizations/${auth}/approve", payload: {}, as: RehabCoordinator }
            - { call: "POST /rehab/outcomes", payload: { program_id: "${prog}", timing: "BASELINE", distance_meters: 300 }, as: RehabClinician, as_user_id: "${clin}", captures: { base_out: $.data.id } }
            - { call: "POST /rehab/outcomes/${base_out}/finalize", payload: {}, as: RehabClinician, as_user_id: "${clin}" }
            - { call: "POST /rehab/programs/${prog}/activate", payload: {}, as: RehabCoordinator }
            - { call: "POST /rehab/outcomes", payload: { program_id: "${prog}", timing: "DISCHARGE", distance_meters: 360 }, as: RehabClinician, as_user_id: "${clin}", captures: { disch: $.data.id } }
          trigger:
            - { call: "GET /rehab/outcomes/${disch}", payload: {}, as: RehabClinician, as_user_id: "${clin}", captures: { prov_meters: $.data.improvement_meters } }
            - { call: "POST /rehab/outcomes/${disch}/finalize", payload: { final_distance_meters: 345 }, as: RehabClinician, as_user_id: "${clin}" }
          assert:
            - "provisional read: OutcomeAssessment.${disch}.improvement_meters == 60 and improvement_pct == 20.0 while status==DRAFT"
            - "verified after finalize: OutcomeAssessment.${disch}.improvement_meters == 45"
            - "verified after finalize: OutcomeAssessment.${disch}.improvement_pct == 15.0"
            - "OutcomeAssessment.${disch}.status == FINALIZED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: session_billed_amount_multifactor_cap
        grounds:
          - calculations.session_billed_amount
          - entities.BillingClaim.fields.billed_amount_cents
          - entities.RehabProgram.fields.risk_stratification
          - entities.MonitoringStation.fields.station_type
        distinguishing_aspect: "Mode (a): >=3 inputs (session_type=MONITORED_EXERCISE, risk=HIGH x1.25, station=TELEMETRY +3000) produce raw 21750 which the min(., MAX_BILLED_PER_SESSION_CENTS=20000) cap clamps to 20000 — non-linear interaction of tiered multiplier + conditional surcharge + cap."
        test_recipe:
          setup:
            - "ACTIVE HIGH-risk program on a TELEMETRY station; one COMPLETED MONITORED_EXERCISE session; APPROVED authorization"
          setup_api_calls:
            - { call: "POST /rehab/patients", payload: { mrn: "M-003", full_name: "Pat Three", date_of_birth: "1955-06-06" }, as: RehabCoordinator, captures: { pat: $.data.id } }
            - { call: "POST /rehab/physicians", payload: { full_name: "Dr Ref", npi: "1000000003" }, as: RehabCoordinator, captures: { phy: $.data.id } }
            - { call: "POST /rehab/clinicians", payload: { full_name: "EP Three", credential: "EP" }, as: RehabCoordinator, captures: { clin: $.data.id } }
            - { call: "POST /rehab/stations", payload: { name: "Tele-3", station_type: "TELEMETRY" }, as: RehabCoordinator, captures: { st: $.data.id } }
            - { call: "POST /rehab/referrals", payload: { patient_id: "${pat}", physician_id: "${phy}", program_type: "CARDIAC", indication: "CABG", risk_stratification: "HIGH" }, as: ReferringPhysician, as_user_id: "${phy}", captures: { ref: $.data.id } }
            - { call: "POST /rehab/referrals/${ref}/decision", payload: { decision: "ACCEPT" }, as: RehabCoordinator }
            - { call: "POST /rehab/programs", payload: { referral_id: "${ref}", current_phase: "PHASE_II" }, as: RehabCoordinator, captures: { prog: $.data.id } }
            - { call: "POST /rehab/authorizations", payload: { program_id: "${prog}", payer_name: "Acme", authorized_visits: 10, allowed_amount_cents: 25000, copay_cents: 2000 }, as: RehabCoordinator, captures: { auth: $.data.id } }
            - { call: "POST /rehab/authorizations/${auth}/approve", payload: {}, as: RehabCoordinator }
            - { call: "POST /rehab/outcomes", payload: { program_id: "${prog}", timing: "BASELINE", distance_meters: 250 }, as: RehabClinician, as_user_id: "${clin}", captures: { base_out: $.data.id } }
            - { call: "POST /rehab/outcomes/${base_out}/finalize", payload: {}, as: RehabClinician, as_user_id: "${clin}" }
            - { call: "POST /rehab/programs/${prog}/activate", payload: {}, as: RehabCoordinator, captures: { pv1: $.data.version } }
            - { call: "POST /rehab/sessions", payload: { program_id: "${prog}", clinician_id: "${clin}", station_id: "${st}", session_type: "MONITORED_EXERCISE", phase: "PHASE_II", scheduled_start: "2026-05-04T09:00:00Z", scheduled_end: "2026-05-04T10:00:00Z", expected_program_version: "${pv1}" }, as: RehabCoordinator, captures: { sess: $.data.id } }
            - { call: "POST /rehab/sessions/${sess}/complete", payload: { post_spo2: 96, rpe: 13, exercise_minutes: 30 }, as: RehabClinician, as_user_id: "${clin}" }
          trigger:
            - { call: "POST /rehab/claims", payload: { program_id: "${prog}", session_id: "${sess}", authorization_id: "${auth}" }, as: BillingSpecialist, captures: { claim: $.data.id } }
          assert:
            - "BillingClaim.${claim}.billed_amount_cents == 20000"
            - "uncapped raw would be 21750 (15000*1.25=18750 + 3000 telemetry); cap MAX_BILLED_PER_SESSION_CENTS=20000 applied"

      - name: patient_statement_dollar_rounding_order
        grounds:
          - calculations.patient_statement_total
          - endpoints["GET /rehab/programs/{programId}/statement"]
          - entities.BillingClaim.fields.patient_responsibility_cents
        distinguishing_aspect: "Mode (b): two claims each patient_responsibility_cents=1250 — round-per-claim-then-sum gives round_half_up(12.50)+round_half_up(12.50)=13+13=$26, whereas sum-then-round gives round_half_up(2500/100)=$25; scaffold pins round-per-line-then-sum → 26."
        test_recipe:
          setup:
            - "ACTIVE LOW-risk program on STANDARD station; APPROVED authorization copay_cents=1250 allowed_amount_cents=20000 authorized_visits=5; two COMPLETED MONITORED_EXERCISE sessions each billed 15000 (patient responsibility 1250)"
          setup_api_calls:
            - { call: "POST /rehab/patients", payload: { mrn: "M-004", full_name: "Pat Four", date_of_birth: "1962-02-02" }, as: RehabCoordinator, captures: { pat: $.data.id } }
            - { call: "POST /rehab/physicians", payload: { full_name: "Dr Ref", npi: "1000000004" }, as: RehabCoordinator, captures: { phy: $.data.id } }
            - { call: "POST /rehab/clinicians", payload: { full_name: "EP Four", credential: "EP" }, as: RehabCoordinator, captures: { clin: $.data.id } }
            - { call: "POST /rehab/stations", payload: { name: "Std-4", station_type: "STANDARD" }, as: RehabCoordinator, captures: { st: $.data.id } }
            - { call: "POST /rehab/referrals", payload: { patient_id: "${pat}", physician_id: "${phy}", program_type: "CARDIAC", indication: "stable-angina", risk_stratification: "LOW" }, as: ReferringPhysician, as_user_id: "${phy}", captures: { ref: $.data.id } }
            - { call: "POST /rehab/referrals/${ref}/decision", payload: { decision: "ACCEPT" }, as: RehabCoordinator }
            - { call: "POST /rehab/programs", payload: { referral_id: "${ref}" }, as: RehabCoordinator, captures: { prog: $.data.id } }
            - { call: "POST /rehab/authorizations", payload: { program_id: "${prog}", payer_name: "Acme", authorized_visits: 5, allowed_amount_cents: 20000, copay_cents: 1250 }, as: RehabCoordinator, captures: { auth: $.data.id } }
            - { call: "POST /rehab/authorizations/${auth}/approve", payload: {}, as: RehabCoordinator }
            - { call: "POST /rehab/outcomes", payload: { program_id: "${prog}", timing: "BASELINE", distance_meters: 400 }, as: RehabClinician, as_user_id: "${clin}", captures: { base_out: $.data.id } }
            - { call: "POST /rehab/outcomes/${base_out}/finalize", payload: {}, as: RehabClinician, as_user_id: "${clin}" }
            - { call: "POST /rehab/programs/${prog}/activate", payload: {}, as: RehabCoordinator, captures: { pv1: $.data.version } }
            - { call: "POST /rehab/sessions", payload: { program_id: "${prog}", clinician_id: "${clin}", station_id: "${st}", session_type: "MONITORED_EXERCISE", phase: "PHASE_II", scheduled_start: "2026-05-04T09:00:00Z", scheduled_end: "2026-05-04T10:00:00Z", expected_program_version: "${pv1}" }, as: RehabCoordinator, captures: { s1: $.data.id } }
            - { call: "POST /rehab/sessions/${s1}/complete", payload: { post_spo2: 97, rpe: 11, exercise_minutes: 30 }, as: RehabClinician, as_user_id: "${clin}" }
            - { call: "GET /rehab/programs/${prog}", payload: {}, as: RehabCoordinator, captures: { pv2: $.data.version } }
            - { call: "POST /rehab/sessions", payload: { program_id: "${prog}", clinician_id: "${clin}", station_id: "${st}", session_type: "MONITORED_EXERCISE", phase: "PHASE_II", scheduled_start: "2026-05-04T11:00:00Z", scheduled_end: "2026-05-04T12:00:00Z", expected_program_version: "${pv2}" }, as: RehabCoordinator, captures: { s2: $.data.id } }
            - { call: "POST /rehab/sessions/${s2}/complete", payload: { post_spo2: 97, rpe: 11, exercise_minutes: 30 }, as: RehabClinician, as_user_id: "${clin}" }
            - { call: "POST /rehab/claims", payload: { program_id: "${prog}", session_id: "${s1}", authorization_id: "${auth}" }, as: BillingSpecialist, captures: { c1: $.data.id } }
            - { call: "POST /rehab/claims", payload: { program_id: "${prog}", session_id: "${s2}", authorization_id: "${auth}" }, as: BillingSpecialist, captures: { c2: $.data.id } }
          trigger:
            - { call: "GET /rehab/programs/${prog}/statement", payload: {}, as: BillingSpecialist, captures: { total: $.data.statement_total_dollars } }
          assert:
            - "BillingClaim.${c1}.patient_responsibility_cents == 1250"
            - "BillingClaim.${c2}.patient_responsibility_cents == 1250"
            - "statement.statement_total_dollars == 26"
            - "statement.total_patient_responsibility_cents == 2500 (sum-then-round would give 25 dollars; scaffold pins 26)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: session_missed_reschedule_cycle
        grounds:
          - state_machines.RehabSession.SCHEDULED_to_MISSED
          - state_machines.RehabSession.MISSED_to_SCHEDULED
          - entities.RehabSession.fields.status
        distinguishing_aspect: "On RehabSession: the MISSED -> SCHEDULED reschedule edge forms a cycle (SCHEDULED -> MISSED -> SCHEDULED), a non-linear shape distinct from any linear pipeline."
        test_recipe:
          setup:
            - "ACTIVE program with one SCHEDULED session"
          setup_api_calls:
            - { call: "POST /rehab/patients", payload: { mrn: "M-005", full_name: "Pat Five", date_of_birth: "1958-08-08" }, as: RehabCoordinator, captures: { pat: $.data.id } }
            - { call: "POST /rehab/physicians", payload: { full_name: "Dr Ref", npi: "1000000005" }, as: RehabCoordinator, captures: { phy: $.data.id } }
            - { call: "POST /rehab/clinicians", payload: { full_name: "EP Five", credential: "EP" }, as: RehabCoordinator, captures: { clin: $.data.id } }
            - { call: "POST /rehab/stations", payload: { name: "Tele-5", station_type: "TELEMETRY" }, as: RehabCoordinator, captures: { st: $.data.id } }
            - { call: "POST /rehab/referrals", payload: { patient_id: "${pat}", physician_id: "${phy}", program_type: "CARDIAC", indication: "post-MI", risk_stratification: "MODERATE" }, as: ReferringPhysician, as_user_id: "${phy}", captures: { ref: $.data.id } }
            - { call: "POST /rehab/referrals/${ref}/decision", payload: { decision: "ACCEPT" }, as: RehabCoordinator }
            - { call: "POST /rehab/programs", payload: { referral_id: "${ref}" }, as: RehabCoordinator, captures: { prog: $.data.id } }
            - { call: "POST /rehab/authorizations", payload: { program_id: "${prog}", payer_name: "Acme", authorized_visits: 10, allowed_amount_cents: 18000, copay_cents: 2000 }, as: RehabCoordinator, captures: { auth: $.data.id } }
            - { call: "POST /rehab/authorizations/${auth}/approve", payload: {}, as: RehabCoordinator }
            - { call: "POST /rehab/outcomes", payload: { program_id: "${prog}", timing: "BASELINE", distance_meters: 300 }, as: RehabClinician, as_user_id: "${clin}", captures: { base_out: $.data.id } }
            - { call: "POST /rehab/outcomes/${base_out}/finalize", payload: {}, as: RehabClinician, as_user_id: "${clin}" }
            - { call: "POST /rehab/programs/${prog}/activate", payload: {}, as: RehabCoordinator, captures: { pv1: $.data.version } }
            - { call: "POST /rehab/sessions", payload: { program_id: "${prog}", clinician_id: "${clin}", station_id: "${st}", session_type: "MONITORED_EXERCISE", phase: "PHASE_II", scheduled_start: "2026-05-04T09:00:00Z", scheduled_end: "2026-05-04T10:00:00Z", expected_program_version: "${pv1}" }, as: RehabCoordinator, captures: { sess: $.data.id } }
          trigger:
            - { call: "POST /rehab/sessions/${sess}/mark-missed", payload: {}, as: RehabClinician, as_user_id: "${clin}" }
            - { call: "POST /rehab/sessions/${sess}/reschedule", payload: { scheduled_start: "2026-05-06T09:00:00Z", scheduled_end: "2026-05-06T10:00:00Z" }, as: RehabCoordinator }
          assert:
            - "after mark-missed: RehabSession.${sess}.status == MISSED"
            - "after reschedule: RehabSession.${sess}.status == SCHEDULED"
            - "RehabSession.${sess}.scheduled_start == 2026-05-06T09:00:00Z"

      - name: claim_denied_resubmit_cycle
        grounds:
          - state_machines.BillingClaim.SUBMITTED_to_DENIED
          - state_machines.BillingClaim.DENIED_to_SUBMITTED
          - entities.BillingClaim.fields.status
        distinguishing_aspect: "On BillingClaim: the DENIED -> SUBMITTED resubmit edge forms a cycle (SUBMITTED -> DENIED -> SUBMITTED), a non-linear shape on a different entity than RehabSession."
        test_recipe:
          setup:
            - "ACTIVE program; one COMPLETED session; a DRAFT claim"
          setup_api_calls:
            - { call: "POST /rehab/patients", payload: { mrn: "M-006", full_name: "Pat Six", date_of_birth: "1957-07-07" }, as: RehabCoordinator, captures: { pat: $.data.id } }
            - { call: "POST /rehab/physicians", payload: { full_name: "Dr Ref", npi: "1000000006" }, as: RehabCoordinator, captures: { phy: $.data.id } }
            - { call: "POST /rehab/clinicians", payload: { full_name: "EP Six", credential: "EP" }, as: RehabCoordinator, captures: { clin: $.data.id } }
            - { call: "POST /rehab/stations", payload: { name: "Tele-6", station_type: "TELEMETRY" }, as: RehabCoordinator, captures: { st: $.data.id } }
            - { call: "POST /rehab/referrals", payload: { patient_id: "${pat}", physician_id: "${phy}", program_type: "CARDIAC", indication: "post-MI", risk_stratification: "MODERATE" }, as: ReferringPhysician, as_user_id: "${phy}", captures: { ref: $.data.id } }
            - { call: "POST /rehab/referrals/${ref}/decision", payload: { decision: "ACCEPT" }, as: RehabCoordinator }
            - { call: "POST /rehab/programs", payload: { referral_id: "${ref}" }, as: RehabCoordinator, captures: { prog: $.data.id } }
            - { call: "POST /rehab/authorizations", payload: { program_id: "${prog}", payer_name: "Acme", authorized_visits: 10, allowed_amount_cents: 18000, copay_cents: 2000 }, as: RehabCoordinator, captures: { auth: $.data.id } }
            - { call: "POST /rehab/authorizations/${auth}/approve", payload: {}, as: RehabCoordinator }
            - { call: "POST /rehab/outcomes", payload: { program_id: "${prog}", timing: "BASELINE", distance_meters: 300 }, as: RehabClinician, as_user_id: "${clin}", captures: { base_out: $.data.id } }
            - { call: "POST /rehab/outcomes/${base_out}/finalize", payload: {}, as: RehabClinician, as_user_id: "${clin}" }
            - { call: "POST /rehab/programs/${prog}/activate", payload: {}, as: RehabCoordinator, captures: { pv1: $.data.version } }
            - { call: "POST /rehab/sessions", payload: { program_id: "${prog}", clinician_id: "${clin}", station_id: "${st}", session_type: "MONITORED_EXERCISE", phase: "PHASE_II", scheduled_start: "2026-05-04T09:00:00Z", scheduled_end: "2026-05-04T10:00:00Z", expected_program_version: "${pv1}" }, as: RehabCoordinator, captures: { sess: $.data.id } }
            - { call: "POST /rehab/sessions/${sess}/complete", payload: { post_spo2: 95, rpe: 12, exercise_minutes: 30 }, as: RehabClinician, as_user_id: "${clin}" }
            - { call: "POST /rehab/claims", payload: { program_id: "${prog}", session_id: "${sess}", authorization_id: "${auth}" }, as: BillingSpecialist, captures: { claim: $.data.id } }
          trigger:
            - { call: "POST /rehab/claims/${claim}/submit", payload: {}, as: BillingSpecialist }
            - { call: "POST /rehab/claims/${claim}/adjudicate", payload: { outcome: "DENIED", denial_reason: "coding error" }, as: BillingSpecialist }
            - { call: "POST /rehab/claims/${claim}/resubmit", payload: {}, as: BillingSpecialist }
          assert:
            - "after adjudicate DENIED: BillingClaim.${claim}.status == DENIED"
            - "after resubmit: BillingClaim.${claim}.status == SUBMITTED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: adverse_vitals_hold_cancels_scheduled
        grounds:
          - state_machines.RehabSession.SCHEDULED_to_COMPLETED
          - state_machines.RehabProgram.ACTIVE_to_ON_HOLD
