              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { s2_id: $.data.id }
            - call: "POST /floorplan-configurations"
              payload: { building_spec_id: "${s2_id}", name: "Open Plan", private_offices: 2, restrooms: 1, partition_linear_ft: 22, hvac_tons: 2.0 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { c2_id: $.data.id }
