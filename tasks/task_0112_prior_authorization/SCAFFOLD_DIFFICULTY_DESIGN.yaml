scaffold_difficulty_design:

  # =========================================================================
  # Rule 1: Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: standard_vs_expedited_decision_deadline
        grounds:
          - calculations.decision_deadline
          - entities.AuthorizationRequest.fields.urgency
          - entities.ServiceCatalogItem.fields.standard_sla_hours
          - entities.ServiceCatalogItem.fields.expedited_sla_hours
        distinguishing_aspect: |
          Same submitted_at and same ServiceCatalogItem produce different decision_deadline_at
          values purely because of AuthorizationRequest.urgency — STANDARD uses standard_sla_hours
          (336h default) and EXPEDITED uses expedited_sla_hours (72h default). The two variants
          live on the AuthorizationRequest entity domain.
        test_recipe:
          setup:
            - "Set clock to 2026-05-16T00:00:00Z"
            - "Create ServiceCatalogItem with standard_sla_hours=336, expedited_sla_hours=72, required_evidence_categories=[LAB, IMAGING, NOTES, MED_HISTORY]"
            - "Create Patient (ACTIVE), Provider (ACTIVE)"
            - "Create AuthorizationRequest A in DRAFT with urgency=STANDARD"
            - "Create AuthorizationRequest B in DRAFT with urgency=EXPEDITED and 60-char clinical_justification"
            - "Attach 2 ClinicalEvidence rows of distinct required categories to each"
          trigger:
            - "POST /authorization-requests/{A}/submit"
            - "POST /authorization-requests/{B}/submit"
          assert:
            - "A.decision_deadline_at == 2026-05-30T00:00:00.000Z (336 hours after submission)"
            - "B.decision_deadline_at == 2026-05-19T00:00:00.000Z (72 hours after submission)"

      - name: initial_vs_appeal_overturn_approval_expiration
        grounds:
          - calculations.approval_expiration
          - state_machines.AuthorizationRequest.UNDER_REVIEW_to_APPROVED
          - state_machines.AuthorizationRequest.DENIED_to_APPROVED
          - entities.AuthorizationRequest.fields.service_catalog_item_version
          - entities.ServiceCatalogItem.fields.approval_validity_days
        distinguishing_aspect: |
          The two variants operate on the Decision/AuthorizationRequest domain (different entity
          domain from variant 1's deadline-on-AuthorizationRequest). Both yield expires_at, but
          the initial_approval variant uses the catalog version pinned at original submission,
          while the appeal_overturn variant — even though the catalog has since been PATCHed to a
          new approval_validity_days — STILL uses the originally pinned value, producing the same
          expires_at relative to decided_at as if the catalog had not changed.
        test_recipe:
          setup:
            - "Set clock to 2026-05-16T00:00:00Z"
            - "Create ServiceCatalogItem (approval_validity_days=90), Patient, Provider"
            - "Submit AuthorizationRequest R; service_catalog_item_version pins to 1"
            - "PATCH service-catalog-items/{itemId} to set approval_validity_days=30 (version=2)"
            - "POST /authorization-requests/{R}/start-review; POST /authorization-requests/{R}/decide outcome=DENIED"
            - "Advance clock to 2026-05-20T00:00:00Z"
          trigger:
            - "POST /authorization-requests/{R}/appeals (file tier=1)"
            - "POST /appeals/{A1}/decide outcome=OVERTURNED, approved_units=1 (as InitialReviewer)"
          assert:
            - "AuthorizationRequest.expires_at == 2026-08-18T00:00:00.000Z (decided_at 2026-05-20 + 90 days, using pinned approval_validity_days=90, NOT current 30)"

  # =========================================================================
  # Rule 2: Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: evidence_completeness_three_inputs_with_conditional
        grounds:
          - calculations.evidence_completeness
          - calculations.evidence_reuse_discount
          - entities.AuthorizationRequest.fields.evidence_completeness_score
        distinguishing_aspect: |
          Mode (a): formula with 3+ inputs (base_score from required-evidence ratio, post_p2p_bonus
          conditional on PeerToPeerReview outcome, evidence_reuse_discount) combined via additive
          composition with a final clamp to [0, 1]. Non-linear interaction: the bonus and discount
          can fully cancel, and the clamp triggers only when their sum overflows.
        test_recipe:
          setup:
            - "Create ServiceCatalogItem with required_evidence_categories=[LAB, IMAGING, NOTES, MED_HISTORY] (4 required)"
            - "Create prior AuthorizationRequest in EXPIRED state with 3 ATTACHED evidence rows"
            - "Create new resubmission AuthorizationRequest R with prior_request_id set"
            - "Attach 4 evidence rows (one per required category) to R; sourced_from_request_id set on 3 of them"
            - "Submit R; start-review; request peer-to-peer; complete P2P with outcome=OVERTURNED"
          trigger:
            - "GET /authorization-requests/{R}"
          assert:
            - "R.evidence_reuse_discount == 0.15 (3 reused × 0.05)"
            - "R.evidence_completeness_score == 0.95 (base 1.00 + post_p2p_bonus 0.10 − reuse_discount 0.15, clamped)"

      - name: evidence_reuse_discount_cap_then_completeness_clamp_order
        grounds:
          - calculations.evidence_completeness
          - calculations.evidence_reuse_discount
          - entities.AuthorizationRequest.fields.evidence_reuse_discount
        distinguishing_aspect: |
          Mode (b): nested rounding/cap order matters. The scaffold pins: first compute reuse count,
          then apply per-doc factor (0.05), then cap at 0.20, then subtract from base in
          evidence_completeness, then clamp to [0, 1]. Computing "subtract per-doc then cap" or
          "subtract after clamp" produces a different score. This is a distinct mode from instance 1's
          conditional-input combination.
        test_recipe:
          setup:
            - "Create ServiceCatalogItem with required_evidence_categories=[LAB, IMAGING, NOTES, MED_HISTORY]"
            - "Create prior EXPIRED AuthorizationRequest P with 6 ATTACHED evidence rows"
            - "Create resubmission R with prior_request_id=P.id"
            - "Attach 4 evidence rows (one per required category) AND 2 extra evidence rows, ALL with sourced_from_request_id=P.id (total reused=6)"
          trigger:
            - "POST /authorization-requests/{R}/submit"
            - "GET /authorization-requests/{R}"
          assert:
            - "R.evidence_reuse_discount == 0.20 (6 × 0.05 = 0.30 capped at 0.20, NOT 0.30)"
            - "R.evidence_completeness_score == 0.80 (1.00 − 0.20 reuse discount, NO p2p bonus, no clamp triggered)"

      - name: decision_deadline_circular_extension_evaluation_order
        grounds:
          - calculations.decision_deadline
          - state_machines.AuthorizationRequest.UNDER_REVIEW_to_PENDING_INFO
          - state_machines.AuthorizationRequest.PENDING_INFO_to_UNDER_REVIEW
        distinguishing_aspect: |
          Mode (c): an apparent circular dependency. decision_deadline_at must be recomputed on every
          PENDING_INFO → UNDER_REVIEW closure, but each cycle ADDS extension hours that depend on
          urgency — which itself never changes. The scaffold pins evaluation: count completed
          PENDING_INFO round-trips first, multiply by per-cycle extension, then add to base SLA.
          Two completed pending-info cycles produce a deterministic, well-defined deadline.
        test_recipe:
          setup:
            - "Set clock to 2026-05-16T00:00:00Z"
            - "Create ServiceCatalogItem standard_sla_hours=336"
            - "Submit STANDARD AuthorizationRequest R; start-review"
          trigger:
            - "POST /authorization-requests/{R}/request-info  # cycle 1 opens"
            - "Attach more evidence to reach >= 0.75"
            - "POST /authorization-requests/{R}/resume-review  # cycle 1 closes"
            - "POST /authorization-requests/{R}/request-info  # cycle 2 opens"
            - "Attach yet more evidence"
            - "POST /authorization-requests/{R}/resume-review  # cycle 2 closes"
          assert:
            - "R.decision_deadline_at == 2026-06-13T00:00:00.000Z (336 base + 168 + 168 = 672 hours = 28 days after 2026-05-16T00:00:00Z)"

  # =========================================================================
  # Rule 3: Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: authorization_request_cyclic_review_loop
        grounds:
          - state_machines.AuthorizationRequest.UNDER_REVIEW_to_PENDING_INFO
          - state_machines.AuthorizationRequest.PENDING_INFO_to_UNDER_REVIEW
          - state_machines.AuthorizationRequest.UNDER_REVIEW_to_PEER_REVIEW
          - state_machines.AuthorizationRequest.PEER_REVIEW_to_UNDER_REVIEW
          - state_machines.AuthorizationRequest.DENIED_to_APPROVED
        distinguishing_aspect: |
          AuthorizationRequest has two distinct cyclic loops on the same entity: (UNDER_REVIEW ↔
          PENDING_INFO) and (UNDER_REVIEW ↔ PEER_REVIEW), AND a non-linear DENIED → APPROVED
          back-edge triggered by appeal overturn — a clear cycle in a forward pipeline.
        test_recipe:
          setup:
            - "Submit AuthorizationRequest R; start-review"
          trigger:
            - "POST /authorization-requests/{R}/request-info"
            - "POST /authorization-requests/{R}/resume-review"
            - "POST /authorization-requests/{R}/peer-to-peer"
            - "POST /peer-to-peer-reviews/{p2pId}/complete with outcome=UPHELD"
            - "POST /authorization-requests/{R}/decide outcome=DENIED, denial_reason_code=NOT_MEDICALLY_NECESSARY"
            - "POST /authorization-requests/{R}/appeals (tier=1)"
            - "POST /appeals/{A1}/decide outcome=OVERTURNED, approved_units=1"
          assert:
            - "After resume-review, R.status == UNDER_REVIEW"
            - "After P2P complete, R.status == UNDER_REVIEW (re-entered, cycle 1)"
            - "After decide DENIED, R.status == DENIED"
            - "After OVERTURNED appeal, R.status == APPROVED (DENIED → APPROVED back-edge)"

      - name: appeal_branching_per_tier_with_role_branch
        grounds:
          - state_machines.Appeal.PENDING_to_UPHELD
          - state_machines.Appeal.PENDING_to_OVERTURNED
          - state_machines.Appeal.PENDING_to_WITHDRAWN
          - entities.Appeal.fields.tier
          - validations[priority=16]
          - validations[priority=17]
        distinguishing_aspect: |
          Appeal has a branching shape: from PENDING the state machine forks into three distinct
          terminal states (UPHELD / OVERTURNED / WITHDRAWN), and the OVERTURNED branch alone
          triggers a cascading mutation on the parent AuthorizationRequest (DENIED → APPROVED with
          a new superseding Decision). Distinct entity from instance 1.
        test_recipe:
          setup:
            - "Reach AuthorizationRequest R in DENIED with a tier=1 Appeal already UPHELD"
            - "File tier=2 Appeal A2"
          trigger:
            - "POST /appeals/{A2}/decide outcome=OVERTURNED, approved_units=1 as MedicalDirector"
          assert:
            - "A2.outcome == OVERTURNED"
            - "R.status == APPROVED (cascading branch effect)"
            - "Latest Decision.supersedes_decision_id == prior DENIED Decision.id"

  # =========================================================================
  # Rule 4: Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: appeal_overturn_cascade_depth_three
        grounds:
          - state_machines.Appeal.PENDING_to_OVERTURNED
          - state_machines.AuthorizationRequest.DENIED_to_APPROVED
          - calculations.approval_expiration
          - entities.AuthorizationRequest.fields.expires_at
          - entities.Decision.fields.supersedes_decision_id
        distinguishing_aspect: |
          Depth-3 chain: (1) POST /appeals/{id}/decide outcome=OVERTURNED mutates Appeal — that
          mutation (2) drives AuthorizationRequest.status DENIED → APPROVED — and THAT transition
          (3) creates a new Decision row and computes expires_at via approval_expiration. Each
          hop is caused by the previous hop, not by the original trigger.
        test_recipe:
          setup:
            - "Set clock to 2026-05-16T00:00:00Z"
            - "Reach R in DENIED with tier=1 PENDING Appeal A1"
          trigger:
            - "POST /appeals/{A1}/decide outcome=OVERTURNED, approved_units=2 (InitialReviewer)"
          assert:
            - "A1.outcome == OVERTURNED (hop 1)"
            - "R.status == APPROVED (hop 2)"
            - "A new Decision is created with decided_by_role=INITIAL_REVIEWER and supersedes_decision_id == prior DENIED Decision.id (hop 3)"
            - "R.expires_at == 2026-08-14T00:00:00.000Z (decided_at + 90 days from version-pinned ServiceCatalogItem) (hop 3 continued)"

      - name: p2p_overturn_recompute_unlocks_decision_chain_depth_two
        grounds:
          - state_machines.PeerToPeerReview.SCHEDULED_to_COMPLETED
          - calculations.evidence_completeness
          - state_machines.AuthorizationRequest.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Depth-2 chain originating from a DIFFERENT trigger (P2P completion, not appeal decision):
          (1) POST /peer-to-peer-reviews/{id}/complete with outcome=OVERTURNED mutates P2P; (2) that
          mutation recomputes AuthorizationRequest.evidence_completeness_score via the post_p2p
          variant (+0.10 bonus), which can unlock a subsequent decide endpoint that would have
          failed at 0.74 but succeeds at 0.84. Different originating transition from instance 1.
        test_recipe:
          setup:
            - "Configure ServiceCatalogItem.required_evidence_categories=[LAB, IMAGING, NOTES, MED_HISTORY]"
            - "Submit AuthorizationRequest R with 3 of 4 required categories attached (base score = 0.75)"
            - "start-review; POST .../peer-to-peer; "
          trigger:
            - "POST /peer-to-peer-reviews/{p2pId}/complete with outcome=OVERTURNED"
          assert:
            - "P2P.outcome == OVERTURNED (hop 1)"
            - "R.evidence_completeness_score == 0.85 (0.75 base + 0.10 post_p2p bonus, hop 2)"
            - "R.status == UNDER_REVIEW after the cascade (PEER_REVIEW → UNDER_REVIEW)"

  # =========================================================================
  # Rule 5: Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_constraint_evidence_on_submitted
        grounds:
          - validations[priority=5]
          - validations[priority=10]
        distinguishing_aspect: |
          Pair: state (priority 5, ERR_INVALID_STATE) vs business_constraint (priority 10,
          ERR_EVIDENCE_INSUFFICIENT). When a caller tries start-review on a DRAFT request with
          incomplete evidence, BOTH would fail; state (5) wins per priority ordering.
        test_recipe:
          setup:
            - "Create AuthorizationRequest in DRAFT (never submitted, evidence_completeness_score=0)"
          trigger:
            - "POST /authorization-requests/{id}/start-review as InitialReviewer"
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE (state error wins over evidence-insufficient business_constraint)"

      - name: business_safety_vs_business_constraint_retired_catalog_on_expedited_submit
        grounds:
          - validations[priority=6]
          - validations[priority=9]
        distinguishing_aspect: |
          Different category pair from instance 1: business_safety (priority 6,
          ERR_CATALOG_RETIRED) vs business_constraint (priority 9,
          ERR_EXPEDITED_JUSTIFICATION_REQUIRED). A submit on a RETIRED catalog item with an
          insufficient (<50 char) expedited justification triggers both; safety wins.
        test_recipe:
          setup:
            - "Create ServiceCatalogItem then PATCH it to RETIRED (set status=RETIRED via admin action)"
            - "Create AuthorizationRequest in DRAFT with urgency=EXPEDITED and clinical_justification of length 10"
          trigger:
            - "POST /authorization-requests/{id}/submit"
          assert:
            - "HTTP 409 with error_id == ERR_CATALOG_RETIRED (safety wins over expedited-justification business_constraint)"

  # =========================================================================
  # Rule 6: Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: evidence_completeness_at_exact_0_50_threshold
        grounds:
          - calculations.evidence_completeness
          - validations[priority=10]
          - endpoints[POST /authorization-requests/{authId}/start-review]
        distinguishing_aspect: |
          Numeric threshold crossing: evidence_completeness_score >= 0.50 must include exactly
          0.50 (inclusive). With 2 of 4 required categories attached the score is exactly 0.50,
          and start-review must succeed (NOT reject). This pins '>=' semantics on the start-review
          endpoint.
        test_recipe:
          setup:
            - "Create ServiceCatalogItem with required_evidence_categories=[LAB, IMAGING, NOTES, MED_HISTORY]"
            - "Submit AuthorizationRequest with exactly 2 attached evidence rows of distinct required categories"
          trigger:
            - "POST /authorization-requests/{id}/start-review"
          assert:
            - "HTTP 200 — evidence_completeness_score == 0.50 satisfies the >= 0.50 gate"

      - name: empty_required_evidence_categories_yields_score_one
        grounds:
          - calculations.evidence_completeness
          - entities.ServiceCatalogItem.fields.required_evidence_categories
          - endpoints[POST /authorization-requests/{authId}/start-review]
        distinguishing_aspect: |
          Different metric (empty-collection edge, not numeric threshold) on a DIFFERENT endpoint
          path (still start-review, but reachable also via /decide subsequently). When
          required_evidence_categories is the empty array [], the formula's base_score must be
          1.0 (not 0/0 → NaN or 0/0 → 0). The benchmark must NOT reject for ERR_EVIDENCE_INSUFFICIENT.
        test_recipe:
          setup:
            - "Create ServiceCatalogItem with required_evidence_categories=[]"
            - "Submit AuthorizationRequest with zero ClinicalEvidence rows"
          trigger:
            - "POST /authorization-requests/{id}/start-review"
            - "POST /authorization-requests/{id}/decide outcome=APPROVED approved_units=1"
          assert:
            - "AuthorizationRequest.evidence_completeness_score == 1.0"
            - "start-review returns 200, decide returns 201 — no ERR_EVIDENCE_INSUFFICIENT raised"

  # =========================================================================
  # Rule 7: Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: appeal_filing_depends_on_authorization_request_state
        grounds:
          - endpoints[POST /authorization-requests/{authId}/appeals]
          - validations[priority=5]
          - entities.AuthorizationRequest.fields.status
          - entities.Appeal.fields.tier
        distinguishing_aspect: |
          Entity pair (Appeal, AuthorizationRequest). The creation/decide of an Appeal is gated by
          the PARENT AuthorizationRequest.status. A new appeal can only be filed when
          AuthorizationRequest.status == DENIED — filing from APPROVED, EXPIRED, SUBMITTED, or any
          other state must be rejected. The Appeal entity's own admissibility is determined by
          another entity's field.
        test_recipe:
          setup:
            - "Submit AuthorizationRequest R, start-review, decide APPROVED. R.status == APPROVED, no appeals yet"
          trigger:
            - "POST /authorization-requests/{R}/appeals with reason='disagree with units' as Provider"
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE — parent AuthorizationRequest.status is APPROVED, not DENIED, so Appeal cannot be filed"

      - name: authorization_request_submit_depends_on_service_catalog_item_status
        grounds:
          - state_machines.AuthorizationRequest.DRAFT_to_SUBMITTED
          - entities.ServiceCatalogItem.fields.status
          - validations[priority=6]
        distinguishing_aspect: |
          Different entity pair (AuthorizationRequest, ServiceCatalogItem). Submitting an
          AuthorizationRequest depends on ServiceCatalogItem.status == ACTIVE at the moment of
          submit; a RETIRED catalog item rejects with ERR_CATALOG_RETIRED. Pair is different from
          (Appeal, AuthorizationRequest).
        test_recipe:
          setup:
            - "Create ServiceCatalogItem and PATCH status to RETIRED"
            - "Create AuthorizationRequest in DRAFT referencing this item"
          trigger:
            - "POST /authorization-requests/{id}/submit"
          assert:
            - "HTTP 409 with error_id == ERR_CATALOG_RETIRED"

  # =========================================================================
  # Rule 8: Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: peer_to_peer_half_open_interval_overlap
        grounds:
          - validations[priority=21]
          - entities.PeerToPeerReview.fields.scheduled_at
          - entities.PeerToPeerReview.fields.duration_minutes
          - entities.PeerToPeerReview.fields.payer_reviewer_id
        distinguishing_aspect: |
          Interval semantics: half-open [scheduled_at, scheduled_at + duration_minutes) for a
          payer_reviewer's SCHEDULED P2P calls. A second P2P beginning at exactly the prior
          slot's end-time DOES NOT overlap (boundary touching at end is allowed). A second P2P
          beginning one minute before the prior end-time DOES overlap and is rejected.
        test_recipe:
          setup:
            - "Create AuthorizationRequest R1 in UNDER_REVIEW; schedule P2P with payer_reviewer_id=X at 2026-05-20T10:00:00Z, duration=30 (occupies [10:00, 10:30))"
            - "Create AuthorizationRequest R2 in UNDER_REVIEW (different patient/provider)"
          trigger:
            - "POST /authorization-requests/{R2}/peer-to-peer with payer_reviewer_id=X, scheduled_at=2026-05-20T10:30:00Z, duration=30 (should succeed — boundary touch)"
            - "Create AuthorizationRequest R3; POST /authorization-requests/{R3}/peer-to-peer with payer_reviewer_id=X, scheduled_at=2026-05-20T10:29:00Z, duration=30 (should fail)"
          assert:
            - "R2's P2P scheduling returns 201 (boundary touch at 10:30:00 is NOT an overlap)"
            - "R3's P2P scheduling returns 409 with error_id == ERR_PEER_REVIEW_TIME_CONFLICT (10:29 < 10:30 end)"

      - name: peer_to_peer_per_authorization_aggregate_capacity_one
        grounds:
          - validations[priority=20]
          - state_machines.PeerToPeerReview.SCHEDULED_to_COMPLETED
          - entities.PeerToPeerReview.fields.status
        distinguishing_aspect: |
          DIFFERENT interval semantics from instance 1: not a geometric overlap on a timeline but
          an AGGREGATE-CAPACITY-of-one rule per AuthorizationRequest, evaluated over the lifetime
          set {SCHEDULED, COMPLETED} (CANCELLED P2Ps are excluded from the count). A P2P that has
          been CANCELLED frees the capacity, but a COMPLETED one does NOT. Different resource
          entity scope (AuthorizationRequest, not payer_reviewer_id).
        test_recipe:
          setup:
            - "AuthorizationRequest R reaches UNDER_REVIEW; schedule P2P1; complete it (status=COMPLETED). R returns to UNDER_REVIEW."
          trigger:
            - "POST /authorization-requests/{R}/peer-to-peer for a second P2P"
          assert:
            - "HTTP 409 with error_id == ERR_PEER_REVIEW_ALREADY_SCHEDULED (capacity-1 over {SCHEDULED, COMPLETED} consumed by the prior COMPLETED P2P)"

  # =========================================================================
  # Rule 9: Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: peer_to_peer_cancel_preserves_under_review_state_and_evidence_score
        grounds:
          - state_machines.AuthorizationRequest.UNDER_REVIEW_to_PEER_REVIEW
          - state_machines.PeerToPeerReview.SCHEDULED_to_CANCELLED
          - calculations.evidence_completeness
          - entities.AuthorizationRequest.fields.evidence_completeness_score
        distinguishing_aspect: |
          Conserved quantity 1: the (AuthorizationRequest.status, AuthorizationRequest.evidence_completeness_score)
          pair. Forward action: POST .../peer-to-peer transitions UNDER_REVIEW → PEER_REVIEW.
          Compensating action: POST /peer-to-peer-reviews/{id}/cancel transitions back to
          UNDER_REVIEW. Invariant: the pair after (forward + compensate) equals the pair before
          forward. No post_p2p bonus is applied since the P2P never COMPLETED — score is unchanged.
          Formula: status_before == status_after AND evidence_completeness_score_before == evidence_completeness_score_after.
        test_recipe:
          setup:
            - "AuthorizationRequest R in UNDER_REVIEW with evidence_completeness_score=0.75; record initial values"
          trigger:
            - "POST /authorization-requests/{R}/peer-to-peer (forward action)"
            - "POST /peer-to-peer-reviews/{p2pId}/cancel (compensating action)"
          assert:
            - "R.status == UNDER_REVIEW (returned to pre-forward state)"
            - "R.evidence_completeness_score == 0.75 (unchanged — no post_p2p bonus applied because P2P never COMPLETED)"

      - name: appeal_withdraw_preserves_tier_counter_invariant
        grounds:
          - state_machines.Appeal.PENDING_to_WITHDRAWN
          - endpoints[POST /authorization-requests/{authId}/appeals]
          - entities.Appeal.fields.tier
          - entities.Appeal.fields.outcome
        distinguishing_aspect: |
          DIFFERENT conserved quantity: the tier-eligibility counter, defined as
          tier_counter(R) = count of Appeal rows where authorization_request_id=R.id and outcome=UPHELD.
          Forward action: POST .../appeals files a new tier=N Appeal. Compensating action: POST
          /appeals/{id}/withdraw transitions it to WITHDRAWN. Invariant: tier_counter(R) before
          forward == tier_counter(R) after compensate. A WITHDRAWN appeal does NOT count toward
          UPHELD, so the next allowed tier is the same as before.
        test_recipe:
          setup:
            - "Reach R in DENIED with NO appeals (tier_counter=0; next allowed tier=1)"
          trigger:
            - "POST /authorization-requests/{R}/appeals (forward, creates tier=1 Appeal A1)"
            - "POST /appeals/{A1}/withdraw (compensate)"
            - "POST /authorization-requests/{R}/appeals (file again)"
          assert:
            - "The newly filed appeal has tier == 1 (NOT tier 2) — tier_counter remained 0 after withdraw"
            - "count of UPHELD Appeal rows for R == 0"
