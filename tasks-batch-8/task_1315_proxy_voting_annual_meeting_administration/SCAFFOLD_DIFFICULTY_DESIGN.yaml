              payload: { company_name: "Lambda AG", ticker: "LAM", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Holder One", account_number: "A-1001", share_class: "COMMON", shares_held: 5000 }
              as: TransferAgent
              captures: { a1_id: $.data.id, cn1: $.data.control_number }
            - call: "POST /proxy/meetings/${m_id}/lock-record-date"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/proposals"
              payload: { meeting_id: "${m_id}", proposal_number: 1, title: "Say on pay", proposal_type: "SAY_ON_PAY", vote_standard: "MAJORITY_OF_VOTES_CAST" }
              as: ProxyAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /proxy/material-distributions/generate"
              payload: { meeting_id: "${m_id}" }
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/open-voting"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/vote-instructions"
              payload: { meeting_id: "${m_id}", proposal_id: "${p1_id}", account_id: "${a1_id}", channel: "INTERNET", choice: "FOR", control_number: "${cn1}" }
              as: Shareholder
              as_user_id: "${a1_id}"
            - call: "POST /proxy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T16:00:00Z" }
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/convene"
              payload: {}
              as: ProxyAdministrator
          trigger:
            - call: "GET /proxy/meetings/${m_id}/quorum?variant=FINAL"
              as: ProxyAdministrator
              captures: { pct_bp: $.data.quorum_pct_bp, thr_bp: $.data.threshold_bp, met: $.data.quorum_met }
            - call: "POST /proxy/meetings/${m_id}/conclude"
              payload: {}
              as: ProxyAdministrator
              captures: { m_status: $.data.status }
          assert:
            - "quorum_pct_bp == 5000 and threshold_bp == 5000"
            - "quorum_met == true (boundary is inclusive: >=)"
            - "conclude succeeds: meeting status == MEETING_HELD"

      - name: zero_votes_cast_proposal_fails_without_division
        grounds:
          - calculations.weighted_tabulation
          - endpoints[GET /proxy/proposals/{id}/tabulation]
        distinguishing_aspect: |
          Metric: empty vote-set count at the GET tabulation endpoint (a different metric and
          endpoint from the quorum ratio instance). MAJORITY_OF_VOTES_CAST with votes_cast == 0
          must resolve to FAIL via the zero-guard, not divide by zero or default to PASS.
        test_recipe:
          setup:
            - "ANNUAL meeting VOTING_OPEN with proposal p1 (MAJORITY_OF_VOTES_CAST); no votes cast at all"
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Mu NV", ticker: "MU", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Holder One", account_number: "A-1001", share_class: "COMMON", shares_held: 6000 }
              as: TransferAgent
            - call: "POST /proxy/meetings/${m_id}/lock-record-date"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/proposals"
              payload: { meeting_id: "${m_id}", proposal_number: 1, title: "Say on pay", proposal_type: "SAY_ON_PAY", vote_standard: "MAJORITY_OF_VOTES_CAST" }
              as: ProxyAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /proxy/material-distributions/generate"
              payload: { meeting_id: "${m_id}" }
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/open-voting"
              payload: {}
              as: ProxyAdministrator
          trigger:
            - call: "GET /proxy/proposals/${p1_id}/tabulation?variant=UNOFFICIAL"
              as: ProxyAdministrator
              captures: { cast: $.data.votes_cast, outcome: $.data.projected_outcome, for_v: $.data.for_votes }
          assert:
            - "votes_cast == 0 (empty set)"
            - "for_votes == 0 and against_votes == 0"
            - "projected_outcome == FAIL (zero-guard: majority of an empty cast is not attainable)"

