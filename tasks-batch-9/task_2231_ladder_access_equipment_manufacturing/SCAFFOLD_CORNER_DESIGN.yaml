  - name: articulated_ladder_type_bonus_applied_without_material_bonus
    claim_type: constants_applied
    grounds:
    - calculations.required_test_load_derivation.constants.TYPE_SF_BONUS
    - calculations.required_test_load_derivation.constants.FIBERGLASS_SF_BONUS
    distinguishing_aspect: An ARTICULATED_LADDER in ALUMINUM_EXTRUSION at TYPE_I picks up the 0.10 product-type bonus and the 0.30 two-step-band bonus but no fiberglass bonus, so the safety factor is 4.40
      and required_test_load_lb is 250 x 4.40 = 1100.00.
    test_recipe:
      setup:
      - No products exist.
      - The logical clock is 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemOperator
      trigger:
      - call: POST /ladder-ops/products
        payload:
          model_code: AL-ART-20-I
          product_type: ARTICULATED_LADDER
          material: ALUMINUM_EXTRUSION
          duty_rating: TYPE_I
          working_length_ft: 20.0
          retail_sku: SKU-AL20I
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          pa: $.data.id
      assert:
      - HTTP status == 201
      - Product.${pa}.rated_load_lb == 250
      - Product.${pa}.safety_factor == 4.40
      - Product.${pa}.required_test_load_lb == 1100.00
      - Product.${pa}.required_pull_force_lbf == 375.00
      - Product.${pa}.max_allowed_deflection_in == 1.333
      - adding a FIBERGLASS_PULTRUSION bonus here would give 4.55 / 1137.50 and fails this test
  - name: load_test_permanent_set_exceeded_is_the_third_ordered_failure_code
    claim_type: correct_result
    grounds:
    - calculations.load_test_outcome
    distinguishing_aspect: 'With applied load and deflection both inside limits, the only remaining check is permanent set: 0.021 in against the 0.020 in ceiling yields outcome FAIL with failure_reason_code
      PERMANENT_SET_EXCEEDED, the third and last code in the evaluation order.'
    test_recipe:
      setup:
      - Product FG-EXT-24-IA has required_test_load_lb 1350.00 and max_allowed_deflection_in 1.600.
      - A DESIGN_QUALIFICATION campaign is IN_PROGRESS on BENCH-1.
      - The logical clock is 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemOperator
      - call: POST /ladder-ops/products
