          - endpoints.POST_/wellness/bookings
        distinguishing_aspect: "The conflict pairs the business_referential band against the business_constraint band, a different error-category pair from the posture-versus-capacity instance: a client in PORTABILITY_HOLD booking a full session through an unregistered network must report the referential error, never the capacity error or the missing-network error."
