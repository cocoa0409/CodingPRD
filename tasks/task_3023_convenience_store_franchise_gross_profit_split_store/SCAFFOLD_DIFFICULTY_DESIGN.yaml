            - "Logical clock at 2026-09-01T12:00:00Z. One franchisee with stated_net_worth_cents 30000000, one ACTIVE store with cold_chain_certified true, one ACTIVE agreement, one OPEN settlement for [2026-09-01, 2026-09-08) with a SERVICES line 1000000/700000, one draw of 600000 on that store, and one SCHEDULED delivery window with a PLACED fresh order of 300 units confirmed into CONFIRMED."
