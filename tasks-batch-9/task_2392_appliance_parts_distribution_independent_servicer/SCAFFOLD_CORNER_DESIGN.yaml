            - "Order A: 3 units of P1, credit-approved, allocated, fulfilled — invoiced_total_cents 31197, settlement INVOICED."
            - "Order B: 2 units of P1, left DRAFT / PENDING_CREDIT — total_cents 20798, counted in exposure."
            - "credit_used_cents before the trigger is 31197 + 20798 == 51995."
