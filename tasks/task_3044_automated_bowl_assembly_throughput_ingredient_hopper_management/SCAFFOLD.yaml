- method: POST
  path: /api/labor-assignments
  description: Redeploy a staff member from MAKE_LINE to PREP or HOSPITALITY over a closed window
  roles:
  - ShiftManager
  code: 201
  input:
  - restaurant_id
  - staff_user_id
  - from_role
  - to_role
  - window_start
  - window_end
  output: LaborAssignment
  side_effects: []
- method: GET
  path: /api/labor-assignments
  description: List labor assignments
  roles:
  - OpsAdmin
  - ShiftManager
  code: 200
  input:
  - restaurant_id?
  - staff_user_id?
  - limit?
  - offset?
  output: LaborAssignment[]
  side_effects: []
- method: GET
  path: /api/labor-assignments/{id}
  description: Get one labor assignment
  roles:
  - OpsAdmin
  - ShiftManager
  code: 200
  input: []
  output: LaborAssignment
  side_effects: []
- method: GET
  path: /api/portion-verifications
  description: List portion verifications across orders/hoppers (analytics view)
  roles:
  - OpsAdmin
  - ShiftManager
  - LineOperator
  - QualityLead
  code: 200
  input:
  - order_id?
  - hopper_id?
  - ingredient_id?
  - result?
  - limit?
  - offset?
  output: PortionVerification[]
  side_effects: []
- method: GET
  path: /api/portion-verifications/{id}
  description: Get one portion verification
  roles:
  - OpsAdmin
  - ShiftManager
  - LineOperator
  - QualityLead
  code: 200
  input: []
  output: PortionVerification
  side_effects: []
- method: GET
  path: /api/hoppers
  description: List hoppers across lines with optional filters
  roles:
  - OpsAdmin
  - ShiftManager
  - LineOperator
  - PrepCook
  - QualityLead
  code: 200
  input:
  - line_id?
  - ingredient_id?
  - status?
  - limit?
  - offset?
  output: Hopper[]
  side_effects: []
errors:
- id: ERR_UNAUTHENTICATED
  http: 401
  condition: Missing or unrecognized X-User-Role / X-User-ID headers
- id: ERR_UNAUTHORIZED_ROLE
  http: 403
  condition: Role not permitted for the endpoint per §1.5
- id: ERR_SEGREGATION_OF_DUTIES
  http: 403
  condition: Calibration approver equals the verifier who recorded the most recent PortionVerification on the hopper
- id: ERR_NOT_FOUND
  http: 404
  condition: Path or body-referenced resource does not exist
- id: ERR_INVALID_STATE
  http: 409
  condition: Resource state does not permit the requested transition per §1.2
- id: ERR_ALREADY_EIGHTY_SIXED
  http: 409
  condition: Eighty-six attempted on an ingredient already EIGHTY_SIXED
- id: ERR_LINE_NOT_OPEN
  http: 409
  condition: start-assembly attempted while assigned line posture is not OPEN
- id: ERR_STALE_RECIPE_VERSION
  http: 412
  condition: expected_recipe_version does not match current Recipe.version
- id: ERR_STALE_HOPPER_VERSION
  http: 412
  condition: expected_hopper_version does not match current Hopper.version
- id: ERR_VALIDATION
  http: 400
  condition: Scalar field constraint violated (ranges, enums, sku uniqueness, required fields)
- id: ERR_INVALID_CUSTOMIZATION
  http: 422
  condition: Customization references an ingredient not in the portion spec, an unknown substitution pair, or duplicates an ingredient
- id: ERR_NO_LINE_AVAILABLE
  http: 422
  condition: No eligible line exists for the computed route at the restaurant
- id: ERR_RECIPE_UNAVAILABLE
  http: 422
  condition: Recipe.is_available is false at order creation (eighty-six without covering substitution)
- id: ERR_HOPPER_CAPACITY_EXCEEDED
  http: 422
  condition: current_grams + load_grams would exceed capacity_grams
- id: ERR_SENSOR_READING_OUT_OF_RANGE
  http: 422
  condition: grams_reading < 0 or > capacity_grams
- id: ERR_SUBSTITUTION_CONFLICT
  http: 422
  condition: to_ingredient EIGHTY_SIXED, from == to, overlapping ACTIVE rule window for same from_ingredient, or effective_end <= effective_start
- id: ERR_SANITATION_OVERLAP
  http: 422
  condition: New cycle overlaps a non-terminal cycle on the same line (touching allowed), or start attempted outside the scheduled half-open window
- id: ERR_LABOR_OVERLAP
  http: 422
  condition: Labor assignment window overlaps an existing assignment for the same staff under closed-interval semantics (touching endpoints conflict)
- id: ERR_PREP_BATCH_EXPIRED
  http: 422
  condition: Refill start attempted with allocated batch no longer READY or expires_at <= now
- id: ERR_VERIFICATION_MISMATCH
  http: 422
  condition: Measurements missing/extra hoppers, negative actual_grams, or a zero expected_grams line
- id: ERR_REFILL_BUDGET_EXCEEDED
  http: 402
  condition: Manual refill would push the restaurant's daily allocated refill grams over DAILY_REFILL_BUDGET_GRAMS (50000)
- id: ERR_LINE_BUSY
  http: 409
  condition: Pause or sanitation start attempted while the line hosts an in-flight order or a REFILLING hopper
- id: ERR_INGREDIENT_STATION_MISMATCH
  http: 422
  condition: Hopper's station_slot maps to a station class inconsistent with the ingredient's station_type (slot 0 BASE, 1 PROTEIN, 2-5 TOPPING,
    6 DRESSING)
roles:
- name: OpsAdmin
  description: Platform operator; seeds restaurants, lines, ingredients, recipes, hoppers; drives the logical clock
  identity: opaque
  exclusive_operations:
  - POST /api/restaurants
  - POST /api/assembly-lines
  - POST /api/ingredients
  - POST /api/recipes
  - POST /api/hoppers
  - POST /api/substitution-rules
  - POST /api/_clock/set_current_utc
  shared_operations:
  - all GET endpoints
- name: ShiftManager
  description: Store manager; pauses/resumes lines, eighty-sixes ingredients, approves substitutions, schedules sanitation, manages labor, cancels
    refills, runs expire sweeps, reroutes orders
  identity: opaque
  exclusive_operations:
  - POST /api/assembly-lines/{id}/pause
  - POST /api/assembly-lines/{id}/resume
  - POST /api/ingredients/{id}/eighty-six
  - POST /api/ingredients/{id}/restore
  - POST /api/substitution-rules/{id}/activate
  - POST /api/substitution-rules/{id}/reject
  - POST /api/substitution-rules/{id}/retire
  - POST /api/sanitation-cycles
  - POST /api/sanitation-cycles/{id}/abort
  - POST /api/refill-tasks/{id}/cancel
  - POST /api/prep-batches/expire-sweep
  - POST /api/orders/{id}/reroute
  - POST /api/labor-assignments
  shared_operations:
  - GET endpoints
  - POST /api/refill-tasks
- name: LineOperator
  description: Make-line operator; loads hoppers, reports sensor readings, runs refill tasks, assembles orders, submits verifications, starts/completes
    sanitation
  identity: opaque
  exclusive_operations:
  - POST /api/hoppers/{id}/load
  - POST /api/hoppers/{id}/sensor-reading
  - POST /api/refill-tasks/{id}/start
  - POST /api/refill-tasks/{id}/complete
  - POST /api/orders/{id}/start-assembly
  - POST /api/orders/{id}/submit-verification
  - POST /api/sanitation-cycles/{id}/start
  - POST /api/sanitation-cycles/{id}/complete
  shared_operations:
  - GET endpoints
  - POST /api/refill-tasks
- name: PrepCook
  description: Prep-room cook; registers and marks prep batches ready
  identity: opaque
  exclusive_operations:
  - POST /api/prep-batches
  - POST /api/prep-batches/{id}/mark-ready
  shared_operations:
  - GET endpoints
- name: QualityLead
  description: Quality approver; approves calibration adjustments on quarantined hoppers (subject to segregation of duties vs the verifying operator)
  identity: opaque
  exclusive_operations:
  - POST /api/hoppers/{id}/calibration-adjustments
  shared_operations:
  - GET endpoints
- name: Customer
  description: Diner placing and cancelling orders
  identity: opaque
  exclusive_operations:
  - POST /api/orders
  - POST /api/orders/{id}/cancel
  shared_operations:
  - GET /api/restaurants*, GET /api/ingredients*, GET /api/recipes*, GET /api/orders/{id}
