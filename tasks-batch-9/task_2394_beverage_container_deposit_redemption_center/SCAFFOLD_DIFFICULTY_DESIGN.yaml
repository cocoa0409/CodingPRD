  - rule_id: transitive_cascade
    instances:

      - name: close_count_cap_breach_flags_account_and_withholds_payout
        grounds:
          - calculations.visit_payout_valuation
          - calculations.daily_cap_ledger
          - state_machines.RedemptionVisit.COUNTING_to_COUNTED
          - state_machines.RedeemerAccount.ACTIVE_to_FLAGGED
          - state_machines.RedemptionVisit.PENDING_to_WITHHELD
          - entities.RedemptionCenter.fields.withheld_visit_count
        distinguishing_aspect: |
          One close-count call propagates five levels: (1) visit_payout_valuation sets
          payable_count 220, (2) the daily-cap breach records the account's second fraud strike,
          (3) the account transitions ACTIVE -> FLAGGED, (4) that flag rewrites the triggering
          visit's withhold_reason to ACCOUNT_FLAGGED and moves payout_status to WITHHELD, and
          (5) RedemptionCenter.withheld_visit_count is recomputed to 2 — a cascade that starts on
          RedemptionVisit and terminates on RedemptionCenter through RedeemerAccount.
        test_recipe:
          setup:
            - "Clock at 2026-08-05T09:00:00Z; OPERATIONAL center with daily_account_cap_containers 300 and one PET_PLASTIC machine"
            - "REGISTERED covered PET_PLASTIC product with deposit_cents 10; ACTIVE account"
            - "Visit 1 already COUNTED from 100 presented with 20 marked out of state: out_of_state_ratio 0.2, one fraud strike, payout_status WITHHELD with reason OUT_OF_STATE_RATIO, payable_count 80"
            - "Visit 2 is COUNTING for the same account with two 150-container lots"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /distributors"
