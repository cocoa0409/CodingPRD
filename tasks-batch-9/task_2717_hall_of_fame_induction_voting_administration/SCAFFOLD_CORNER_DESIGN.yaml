          An Elector may file on their own behalf only. Both electors are real and credentialed, so
          priorities 4, 8, 43 and 44 all pass; the defect is purely that X-User-ID is elector one
          while nominated_by_elector_id names elector two, which is 403
          ERR_NOMINATOR_IDENTITY_MISMATCH. The same body sent by ElectionAdministrator would be
          accepted, since the rule is scoped to the Elector role.
        test_recipe:
          setup:
            - "A NOMINATIONS_OPEN 2026 cycle with two credentialed electors and one eligible candidate."
            - "Elector one acts while naming elector two as the nominator."
