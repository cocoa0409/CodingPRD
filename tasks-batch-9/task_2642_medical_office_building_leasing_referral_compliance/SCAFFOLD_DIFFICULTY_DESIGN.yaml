# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Task 2642 — Medical Office Building Leasing & Referral Compliance
#
# 9 rule_id blocks, 19 instances. Every instance grounds only in elements
# already declared in SCAFFOLD.yaml §1.1–§1.7.
#
# Shared facts used by every chain below (no call needed to establish them):
#   * the logical clock starts at exactly 2026-08-01T00:00:00Z
#   * SUITE_CLASS_PREMIUM_PSF = {STANDARD_EXAM 0.00, IMAGING 6.50,
#     PROCEDURE 4.25, INFUSION 3.00}
#   * a Building with market_base_rent_psf_annual 30.00 therefore has published
#     bands [24.00, 34.50] for STANDARD_EXAM, [29.20, 41.98] for IMAGING,
#     [27.40, 39.39] for PROCEDURE and [26.40, 37.95] for INFUSION
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: lease_rent_provisional_published_versus_certified_appraisal_divergence
        grounds:
          - calculations.effective_base_rent_annual
          - entities.Lease.fields.provisional_base_rent_annual
          - entities.Lease.fields.certified_base_rent_annual
          - entities.Lease.fields.effective_base_rent_annual
          - entities.Lease.fields.fmv_variance_annual
          - entities.Lease.fields.fmv_variance_pct
          - state_machines.Lease.PENDING_FMV_REVIEW_to_FMV_CERTIFIED
        distinguishing_aspect: |
          This instance is rent accounting on a Lease: the PROVISIONAL_PUBLISHED
          variant values a 5000 sf STANDARD_EXAM suite at the building rate card
          (150000.00) while the CERTIFIED_APPRAISAL variant values the same suite
          at the negotiated 32.00 psf (160000.00), and both figures survive on
          the row so fmv_variance_annual reads exactly 10000.00.
        test_recipe:
          setup:
            - "One Building 'Meridian Medical Plaza' with market_base_rent_psf_annual 30.00 and one 5000 sf STANDARD_EXAM suite."
            - "One physician-owned INDEPENDENT_PRACTICE tenant with a DIRECT lease at 32.00 psf for 2026-09-01 through 2029-08-31."
            - "One QUALIFIED appraisal opining 30.00/34.00 psf, so the certified band is [28.80, 34.50] and 32.00 sits inside it."
            - "The lease has been submitted for review by agent-001 and certified by compliance-001, so its status is FMV_CERTIFIED and fmv_certification_status is CERTIFIED."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /buildings/${b1_id}/suites"
              payload: { suite_number: "210", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 200 }
              as: PortfolioAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Lakeside Orthopedic Group", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "ORTHOPEDICS", is_physician_owned: true, npi: "1234567893" }
              as: PortfolioAdmin
              captures: { t_ortho_id: $.data.id }
            - call: "POST /leases"
              payload: { building_id: "${b1_id}", suite_id: "${s1_id}", tenant_id: "${t_ortho_id}", lease_type: "DIRECT", term_start: "2026-09-01", term_end: "2029-08-31", base_rent_psf_annual: 32.00 }
              as: LeasingAgent
              captures: { l1_id: $.data.id, l1_v: $.data.version }
            - call: "POST /leases/${l1_id}/appraisals"
              payload: { expected_lease_version: "${l1_v}", appraiser_firm: "Harbor Valuation LLC", appraisal_date: "2026-07-15", opinion_low_psf: 30.00, opinion_high_psf: 34.00, independence_attested: true }
              as: ComplianceOfficer
              captures: { ap1_id: $.data.id }
            - call: "POST /appraisals/${ap1_id}/decision"
              payload: { action: "QUALIFY", decision_reason: "Independent MAI opinion accepted" }
              as: ComplianceOfficer
            - call: "POST /leases/${l1_id}/submit-fmv-review"
              payload: { submission_note: "Initial submission for FMV review" }
              as: LeasingAgent
              as_user_id: "agent-001"
            - call: "POST /leases/${l1_id}/certify-fmv"
              payload: { certification_note: "32.00 psf sits inside the certified band" }
              as: ComplianceOfficer
              as_user_id: "compliance-001"
          trigger:
            - call: "GET /leases/${l1_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "Lease.${l1_id}.fmv_certification_status == CERTIFIED"
            - "Lease.${l1_id}.provisional_base_rent_annual == 150000.00"
            - "Lease.${l1_id}.certified_base_rent_annual == 160000.00"
            - "Lease.${l1_id}.effective_base_rent_annual == 160000.00"
            - "Lease.${l1_id}.fmv_variance_annual == 10000.00"
            - "Lease.${l1_id}.fmv_variance_pct == 0.0667"
            - "Lease.${l1_id}.certified_fmv_floor_psf == 28.80"
            - "Lease.${l1_id}.certified_fmv_ceiling_psf == 34.50"

      - name: tenant_risk_rolling_window_versus_strict_cumulative_divergence
        grounds:
          - calculations.referral_compliance_risk_score
          - entities.Tenant.fields.referral_compliance_risk_score
          - entities.Tenant.fields.strict_cumulative_risk_score
          - entities.Tenant.fields.compliance_watch_status
          - state_machines.RentInvoice.ISSUED_to_DELINQUENT
          - endpoints["POST /_ops/run-daily-close"]
        distinguishing_aspect: |
          This instance is risk scoring on a Tenant, not rent accounting on a
          Lease: advancing the clock past 365 days after the invoice due_date
          drops the tier-50 event out of the ROLLING_12M score (0) while the
          STRICT_CUMULATIVE score keeps it forever (50), so the same single event
          yields two different numbers on the same row with no new data.
        test_recipe:
          setup:
            - "One Building with market_base_rent_psf_annual 30.00 and one 5000 sf STANDARD_EXAM suite."
            - "One physician-owned tenant whose DIRECT lease at 32.00 psf is ACTIVE from 2026-09-01."
            - "One RentInvoice for 2026-09-01 through 2026-09-30 due 2026-09-05, never paid."
            - "The clock stands at 2026-11-07 and a daily close has already run, so the invoice is DELINQUENT with days_past_due_at_flag 63 and delinquency_tier_weight 50, and the tenant reads 50 on both score variants with compliance_watch_status WATCH plus one OPEN RENT_DELINQUENCY case."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { b2_id: $.data.id }
            - call: "POST /buildings/${b2_id}/suites"
              payload: { suite_number: "210", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 200 }
              as: PortfolioAdmin
              captures: { s2a_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Lakeside Orthopedic Group", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "ORTHOPEDICS", is_physician_owned: true, npi: "1234567893" }
              as: PortfolioAdmin
              captures: { t2_id: $.data.id }
            - call: "POST /leases"
              payload: { building_id: "${b2_id}", suite_id: "${s2a_id}", tenant_id: "${t2_id}", lease_type: "DIRECT", term_start: "2026-09-01", term_end: "2029-08-31", base_rent_psf_annual: 32.00 }
              as: LeasingAgent
              captures: { l2_id: $.data.id, l2_v: $.data.version }
            - call: "POST /leases/${l2_id}/appraisals"
              payload: { expected_lease_version: "${l2_v}", appraiser_firm: "Harbor Valuation LLC", appraisal_date: "2026-07-15", opinion_low_psf: 30.00, opinion_high_psf: 34.00, independence_attested: true }
              as: ComplianceOfficer
              captures: { ap2_id: $.data.id }
            - call: "POST /appraisals/${ap2_id}/decision"
              payload: { action: "QUALIFY", decision_reason: "Independent MAI opinion accepted" }
              as: ComplianceOfficer
            - call: "POST /leases/${l2_id}/submit-fmv-review"
              payload: { submission_note: "Initial submission for FMV review" }
              as: LeasingAgent
              as_user_id: "agent-001"
            - call: "POST /leases/${l2_id}/certify-fmv"
              payload: { certification_note: "Within band" }
              as: ComplianceOfficer
              as_user_id: "compliance-001"
            - call: "POST /leases/${l2_id}/compliance-attestations"
              payload: { attestation_type: "SIGNED_LEASE", on_file: true, document_reference: "LSE-2642-0002" }
              as: LeasingAgent
            - call: "POST /leases/${l2_id}/execute"
              payload: { execution_note: "Executed" }
              as: LeasingAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /leases/${l2_id}/commence"
              payload: { commencement_note: "Keys delivered" }
              as: PropertyManager
            - call: "POST /leases/${l2_id}/rent-invoices"
              payload: { period_start: "2026-09-01", period_end: "2026-09-30", due_date: "2026-09-05" }
              as: PropertyManager
              captures: { inv2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-07T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /_ops/run-daily-close"
              payload: { close_note: "First close: flags the September invoice delinquent" }
              as: PortfolioAdmin
            - call: "GET /tenants/${t2_id}"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-11-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /_ops/run-daily-close"
              payload: { close_note: "Second close: the rolling window now excludes the 2026-09-05 due date" }
              as: PortfolioAdmin
            - call: "GET /tenants/${t2_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "RentInvoice.${inv2_id}.status == DELINQUENT"
            - "RentInvoice.${inv2_id}.days_past_due_at_flag == 63"
            - "RentInvoice.${inv2_id}.delinquency_tier_weight == 50"
            - "Tenant.${t2_id}.referral_compliance_risk_score == 0"
            - "Tenant.${t2_id}.strict_cumulative_risk_score == 50"
            - "Tenant.${t2_id}.delinquency_event_count == 1"
            - "Tenant.${t2_id}.compliance_watch_status == WATCH"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: fmv_band_nested_clamp_takes_floor_and_ceiling_from_different_sources
        grounds:
          - calculations.suite_fmv_band
          - entities.Lease.fields.certified_fmv_floor_psf
          - entities.Lease.fields.certified_fmv_ceiling_psf
          - entities.Appraisal.fields.opinion_midpoint_psf
          - entities.Tenant.fields.is_physician_owned
          - entities.Suite.fields.suite_class
        distinguishing_aspect: |
          MODE (a) — a four-input non-linear formula whose two outputs come from
          different sources: with market rate 30.00, an IMAGING premium of 6.50
          and an appraisal midpoint of 40.00, max(36.00, 29.20) takes the floor
          from the appraisal while min(44.00, 41.98) takes the ceiling from the
          published rate card, so the band is [36.00, 41.98] and neither side can
          be reproduced by a single linear rule.
        test_recipe:
          setup:
            - "One Building with market_base_rent_psf_annual 30.00 and one 8000 sf IMAGING suite, so the published band is [29.20, 41.98]."
            - "One physician-owned INDEPENDENT_PRACTICE radiology tenant whose DIRECT lease is priced at exactly 41.98 psf for 2026-09-01 through 2029-08-31."
            - "One QUALIFIED appraisal opining 38.00/42.00 psf, giving opinion_midpoint_psf 40.00 and an appraisal band of [36.00, 44.00]."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { b3_id: $.data.id }
            - call: "POST /buildings/${b3_id}/suites"
              payload: { suite_number: "150", floor: 1, rentable_sf: 8000, suite_class: "IMAGING", power_amps_available: 600, medical_gas_available: false, shielding_certified: true, lead_thickness_mm: 2.5 }
              as: PortfolioAdmin
              captures: { s3_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Clearview Imaging Partners", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "RADIOLOGY", is_physician_owned: true, npi: "1234567901" }
              as: PortfolioAdmin
              captures: { t3_id: $.data.id }
            - call: "POST /leases"
              payload: { building_id: "${b3_id}", suite_id: "${s3_id}", tenant_id: "${t3_id}", lease_type: "DIRECT", term_start: "2026-09-01", term_end: "2029-08-31", base_rent_psf_annual: 41.98 }
              as: LeasingAgent
              captures: { l3_id: $.data.id, l3_v: $.data.version }
            - call: "POST /leases/${l3_id}/appraisals"
              payload: { expected_lease_version: "${l3_v}", appraiser_firm: "Harbor Valuation LLC", appraisal_date: "2026-07-20", opinion_low_psf: 38.00, opinion_high_psf: 42.00, independence_attested: true }
              as: ComplianceOfficer
              captures: { ap3_id: $.data.id }
            - call: "POST /appraisals/${ap3_id}/decision"
              payload: { action: "QUALIFY", decision_reason: "Independent imaging-suite opinion accepted" }
              as: ComplianceOfficer
            - call: "POST /leases/${l3_id}/submit-fmv-review"
              payload: { submission_note: "Imaging suite priced at the clamped ceiling" }
              as: LeasingAgent
              as_user_id: "agent-001"
          trigger:
            - call: "POST /leases/${l3_id}/certify-fmv"
              payload: { certification_note: "41.98 psf equals the published ceiling" }
              as: ComplianceOfficer
              as_user_id: "compliance-001"
            - call: "GET /leases/${l3_id}/appraisals"
              payload: { status: "QUALIFIED" }
              as: ComplianceOfficer
            - call: "GET /tenants/${t3_id}/compliance-cases"
              payload: { case_type: "FMV_DEVIATION" }
              as: ComplianceOfficer
          assert:
            - "Appraisal.${ap3_id}.opinion_midpoint_psf == 40.00"
            - "Appraisal.${ap3_id}.is_controlling == true"
            - "Lease.${l3_id}.certified_fmv_floor_psf == 36.00"
            - "Lease.${l3_id}.certified_fmv_ceiling_psf == 41.98"
            - "Lease.${l3_id}.status == FMV_CERTIFIED"
            - "Lease.${l3_id}.provisional_base_rent_annual == 292000.00"
            - "Lease.${l3_id}.certified_base_rent_annual == 335840.00"
            - "Lease.${l3_id}.fmv_variance_annual == 43840.00"
            - "Lease.${l3_id}.fmv_variance_pct == 0.1501"
            - "GET /tenants/${t3_id}/compliance-cases?case_type=FMV_DEVIATION returns meta.total_count == 1 with that case status OPEN"

      - name: ti_cost_share_round_per_line_then_sum_pinned_order
        grounds:
          - calculations.ti_cost_share
          - entities.TILineItem.fields.effective_share_pct
          - entities.TILineItem.fields.landlord_share_amount
          - entities.TILineItem.fields.tenant_share_amount
          - entities.TenantImprovementProject.fields.landlord_committed_amount
          - entities.TenantImprovementProject.fields.allowance_remaining
          - concurrency_rules[ti-line-item-create-stale-project]
        distinguishing_aspect: |
          MODE (b) — the three 0.60-share lines cost 12345.04, 23456.09 and
          34567.14; rounding each product then summing gives 42220.95 while
          summing the raw products and rounding once gives 42220.96, so the
          pinned round-per-line-then-sum order is worth exactly one cent and
          landlord_committed_amount must read 130220.95, not 130220.96.
        test_recipe:
          setup:
            - "One Building with a 5000 sf STANDARD_EXAM suite rated at 200 amps."
            - "One non-physician-owned INDEPENDENT_PRACTICE tenant with a DRAFT DIRECT lease at 30.00 psf."
            - "One TenantImprovementProject on that lease targeting IMAGING, authorized_allowance_total 500000.00 and landlord_share_pct 0.60, in status DESIGN with no line items yet."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { b4_id: $.data.id }
            - call: "POST /buildings/${b4_id}/suites"
              payload: { suite_number: "210", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 200 }
              as: PortfolioAdmin
              captures: { s4_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Northgate Medical Group PC", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "GASTROENTEROLOGY", is_physician_owned: false, npi: "1234567911" }
              as: PortfolioAdmin
              captures: { t4_id: $.data.id }
            - call: "POST /leases"
              payload: { building_id: "${b4_id}", suite_id: "${s4_id}", tenant_id: "${t4_id}", lease_type: "DIRECT", term_start: "2026-09-01", term_end: "2029-08-31", base_rent_psf_annual: 30.00 }
              as: LeasingAgent
              captures: { l4_id: $.data.id }
            - call: "POST /leases/${l4_id}/ti-projects"
              payload: { suite_id: "${s4_id}", target_suite_class: "IMAGING", lead_thickness_mm: 2.5, power_amps_requested: 150, medical_gas_requested: false, authorized_allowance_total: 500000.00, landlord_share_pct: 0.60 }
              as: LeasingAgent
              captures: { tp4_id: $.data.id, tp4_v1: $.data.version }
          trigger:
            - call: "POST /ti-projects/${tp4_id}/line-items"
              payload: { expected_ti_project_version: "${tp4_v1}", description: "Lead shielding, walls and ceiling", category: "SHIELDING", cost_amount: 88000.00 }
              as: LeasingAgent
              captures: { li4a_id: $.data.id }
            - call: "GET /ti-projects/${tp4_id}"
              payload: {}
              as: LeasingAgent
              captures: { tp4_v2: $.data.version }
            - call: "POST /ti-projects/${tp4_id}/line-items"
              payload: { expected_ti_project_version: "${tp4_v2}", description: "Dedicated 3-phase feeder", category: "POWER", cost_amount: 12345.04 }
              as: LeasingAgent
              captures: { li4b_id: $.data.id }
            - call: "GET /ti-projects/${tp4_id}"
              payload: {}
              as: LeasingAgent
              captures: { tp4_v3: $.data.version }
            - call: "POST /ti-projects/${tp4_id}/line-items"
              payload: { expected_ti_project_version: "${tp4_v3}", description: "Panel upgrade and conduit", category: "POWER", cost_amount: 23456.09 }
              as: LeasingAgent
              captures: { li4c_id: $.data.id }
            - call: "GET /ti-projects/${tp4_id}"
              payload: {}
              as: LeasingAgent
              captures: { tp4_v4: $.data.version }
            - call: "POST /ti-projects/${tp4_id}/line-items"
              payload: { expected_ti_project_version: "${tp4_v4}", description: "Flooring, casework and paint", category: "FINISHES", cost_amount: 34567.14 }
              as: LeasingAgent
              captures: { li4d_id: $.data.id }
            - call: "GET /ti-projects/${tp4_id}"
              payload: {}
              as: LeasingAgent
          assert:
            - "TILineItem.${li4a_id}.sequence_no == 1 and effective_share_pct == 1.00 and landlord_share_amount == 88000.00 and tenant_share_amount == 0.00"
            - "TILineItem.${li4b_id}.sequence_no == 2 and effective_share_pct == 0.60 and landlord_share_amount == 7407.02 and tenant_share_amount == 4938.02"
            - "TILineItem.${li4c_id}.sequence_no == 3 and landlord_share_amount == 14073.65 and tenant_share_amount == 9382.44"
            - "TILineItem.${li4d_id}.sequence_no == 4 and landlord_share_amount == 20740.28 and tenant_share_amount == 13826.86"
            - "TenantImprovementProject.${tp4_id}.landlord_committed_amount == 130220.95"
            - "TenantImprovementProject.${tp4_id}.tenant_committed_amount == 28147.32"
            - "TenantImprovementProject.${tp4_id}.allowance_remaining == 369779.05"
            - "TenantImprovementProject.${tp4_id}.line_item_count == 4"

      - name: monthly_occupancy_charge_waiver_tier_keyed_on_combined_pre_waiver_total
        grounds:
          - calculations.monthly_occupancy_charge
          - entities.RentInvoice.fields.pre_waiver_total
          - entities.RentInvoice.fields.parking_waiver_tier_pct
          - entities.RentInvoice.fields.parking_waiver_amount
          - entities.RentInvoice.fields.total_amount
          - calculations.parking_pool_balance
          - concurrency_rules[parking-allocation-create-stale-building]
        distinguishing_aspect: |
          MODE (c) — parking_fee_gross (step 3) feeds pre_waiver_total (step 4),
          which selects the waiver tier (step 5) that is then applied back to
          parking (step 6); with base 13333.33 + cam 4000.00 + parking 1000.00 the
          pre-waiver total is 18333.33, landing in the 0.50 tier and producing a
          500.00 waiver and a 17833.33 total, a value no evaluation order other
          than the pinned one reproduces.
        test_recipe:
          setup:
            - "One Building with market_base_rent_psf_annual 30.00, operating_expense_annual_psf 9.60 and 400 stalls at a 0.60 patient reserve."
            - "One 5000 sf STANDARD_EXAM suite and one non-physician-owned INDEPENDENT_PRACTICE tenant."
            - "A DIRECT lease certified at 32.00 psf (certified_base_rent_annual 160000.00) that is ACTIVE from 2026-09-01, with the clock at 2026-09-01."
            - "Twenty ACTIVE STAFF stalls and thirty ACTIVE PATIENT stalls allocated to that lease, so the building reads staff_allocated_stalls 20, patient_allocated_stalls 30 and unallocated_stalls 350."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { b5_id: $.data.id }
            - call: "POST /buildings/${b5_id}/suites"
              payload: { suite_number: "210", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 200 }
              as: PortfolioAdmin
              captures: { s5_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Northgate Medical Group PC", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "GASTROENTEROLOGY", is_physician_owned: false, npi: "1234567911" }
              as: PortfolioAdmin
              captures: { t5_id: $.data.id }
            - call: "POST /leases"
              payload: { building_id: "${b5_id}", suite_id: "${s5_id}", tenant_id: "${t5_id}", lease_type: "DIRECT", term_start: "2026-09-01", term_end: "2029-08-31", base_rent_psf_annual: 32.00 }
              as: LeasingAgent
