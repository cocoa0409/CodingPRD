  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: cost_transfer_money_conservation
        grounds:
          - calculations.cost_transfer_money_conservation
          - state_machines.CostTransfer.PENDING_COUNTERSIGN_to_APPROVED
          - state_machines.Expenditure.POSTED_to_TRANSFERRED_OUT
        distinguishing_aspect: |
          Conserved quantity = direct money: sum of spent_cents over the union of both awards' budget
          lines is invariant across the transfer (100000 before, 100000 after); the source line credit
          and target line debit are compensating entries linked by the mirror's transferred_from_id.
        test_recipe:
          setup:
            - "Source S4: TRAVEL 200000 (obligated 300000), ACTIVE, e 100000 POSTED; target T4: TRAVEL 100000 (obligated 150000), ACTIVE, nothing spent"
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000, late_payment_apr_bps: 0 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "S4-001", title: "Cons source", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 300000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw_s: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "T4-001", title: "Cons target", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 150000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw_t: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw_s}", category: "TRAVEL", authorized_cents: 200000 }, as: GrantCoordinator, captures: { l_s: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw_t}", category: "TRAVEL", authorized_cents: 100000 }, as: GrantCoordinator, captures: { l_t: $.data.id } }
            - { call: "POST /api/awards/${aw_s}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/awards/${aw_t}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw_s}", budget_line_id: "${l_s}", expenditure_type: "TRAVEL", amount_cents: 100000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { e: $.data.id } }
            - { call: "POST /api/expenditures/${e}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/cost-transfers", payload: { source_expenditure_id: "${e}", target_award_id: "${aw_t}", target_budget_line_id: "${l_t}", justification: "reallocate travel to the correct award" }, as: GrantCoordinator, as_user_id: "gc-1", captures: { tr: $.data.id } }
            - { call: "POST /api/cost-transfers/${tr}/submit", payload: {}, as: GrantCoordinator, as_user_id: "gc-1" }
          trigger:
            - { call: "POST /api/cost-transfers/${tr}/approve", payload: {}, as: GrantsAccountant, as_user_id: "ga-1" }
            - { call: "GET /api/budget-lines/${l_s}", as: GrantsAccountant, captures: { s_after: $.data.spent_cents } }
            - { call: "GET /api/budget-lines/${l_t}", as: GrantsAccountant, captures: { t_after: $.data.spent_cents } }
            - { call: "GET /api/expenditures", payload: { transferred_from_id: "${e}" }, as: GrantsAccountant, captures: { mirror: "$.data[0].amount_cents", mirror_mtdc: "$.data[0].mtdc_eligible_cents" } }
            - { call: "GET /api/awards/${aw_t}", as: GrantsAccountant, captures: { t_mtdc: $.data.mtdc_spent_cents, t_fa: $.data.f_and_a_accrued_cents } }
          assert:
            - "s_after + t_after == 100000  (before: 100000 + 0; after: 0 + 100000 — conserved across the pair)"
            - "s_after == 0 and t_after == 100000"
            - "mirror == 100000 and mirror_mtdc == 100000  (compensating entry carries the same amount and MTDC class)"
            - "t_mtdc == 100000 and t_fa == 50000  (target award aggregates re-derived from the mirror)"

      - name: effort_certification_total_100_invariant
        grounds:
          - calculations.effort_total_conservation
          - calculations.effort_charged_percentage
          - state_machines.EffortCycle.CERTIFYING_to_CLOSED
          - errors[ERR_EFFORT_TOTAL_NOT_100]
        distinguishing_aspect: |
          Conserved quantity = a person's 100.00% total effort per cycle: closing with 41.67 + 50.00 +
          8.32 = 99.99 fails (ERR_EFFORT_TOTAL_NOT_100); only the compensating re-certification of the
          NON_SPONSORED statement to 8.33 restores the invariant and lets the cycle close.
        test_recipe:
          setup:
            - "W1 (FED cap 20000000): SAL 5100000 (F&A 2550000, obligated 7650000), fringe 0, PA committed 50% key; salary charge effort 50% x 6mo on 2026-03-01 -> 5000001 (capped), charged 41.67"
            - "W2 (FOUNDATION, no cap, f&a 2000): SAL 6000000 (F&A 1200000, obligated 7200000), fringe 0, PA committed 50%; charge -> 6000000, charged 50.00"
            - "Cycle 2026-H1 CERTIFYING with three statements for PA (W1, W2, NON_SPONSORED)"
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000, late_payment_apr_bps: 0 }, as: SponsoredProgramsOfficer, captures: { sp1: $.data.id } }
            - { call: "POST /api/sponsors", payload: { name: "FDN", sponsor_type: "FOUNDATION", payment_method: "COST_REIMBURSABLE_INVOICE", f_and_a_rate_bps: 2000, late_payment_apr_bps: 0 }, as: SponsoredProgramsOfficer, captures: { sp2: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "P. Alpha", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 24000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pa: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp1}", pi_id: "${pa}", award_number: "W1-001", title: "Capped award", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 7650000, fringe_rate_bps: 0 }, as: SponsoredProgramsOfficer, captures: { w1: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp2}", pi_id: "${pa}", award_number: "W2-001", title: "Uncapped award", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 7200000, fringe_rate_bps: 0 }, as: SponsoredProgramsOfficer, captures: { w2: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${w1}", category: "PERSONNEL_SALARIES", authorized_cents: 5100000 }, as: GrantCoordinator, captures: { sal1: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${w2}", category: "PERSONNEL_SALARIES", authorized_cents: 6000000 }, as: GrantCoordinator, captures: { sal2: $.data.id } }
            - { call: "POST /api/awards/${w1}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/awards/${w2}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/effort-commitments", payload: { award_id: "${w1}", person_id: "${pa}", committed_effort_pct: 50.0, is_key_personnel: true }, as: GrantCoordinator }
            - { call: "POST /api/effort-commitments", payload: { award_id: "${w2}", person_id: "${pa}", committed_effort_pct: 50.0, is_key_personnel: false }, as: GrantCoordinator }
            - { call: "POST /api/expenditures", payload: { award_id: "${w1}", budget_line_id: "${sal1}", expenditure_type: "SALARY", person_id: "${pa}", effort_pct: 50.0, period_months: 6, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /api/expenditures/${e1}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/expenditures", payload: { award_id: "${w2}", budget_line_id: "${sal2}", expenditure_type: "SALARY", person_id: "${pa}", effort_pct: 50.0, period_months: 6, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { e2: $.data.id } }
            - { call: "POST /api/expenditures/${e2}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/effort-cycles", payload: { cycle_code: "2026-H1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", cycle_months: 6 }, as: GrantsAccountant, captures: { cyc: $.data.id } }
            - { call: "POST /api/effort-cycles/${cyc}/open", payload: {}, as: GrantsAccountant }
            - { call: "GET /api/effort-statements", payload: { cycle_id: "${cyc}", award_id: "${w1}" }, as: GrantsAccountant, captures: { s1: "$.data[0].id", s1v: "$.data[0].version", s1c: "$.data[0].charged_effort_pct" } }
            - { call: "GET /api/effort-statements", payload: { cycle_id: "${cyc}", award_id: "${w2}" }, as: GrantsAccountant, captures: { s2: "$.data[0].id", s2v: "$.data[0].version", s2c: "$.data[0].charged_effort_pct" } }
            - { call: "GET /api/effort-statements", payload: { cycle_id: "${cyc}", person_id: "${pa}", statement_kind: "NON_SPONSORED" }, as: GrantsAccountant, captures: { sn: "$.data[0].id", snv: "$.data[0].version" } }
            - { call: "POST /api/effort-statements/${s1}/certify", payload: { certified_effort_pct: 41.67, expected_effort_statement_version: "${s1v}" }, as: PrincipalInvestigator, as_user_id: "${pa}" }
            - { call: "POST /api/effort-statements/${s2}/certify", payload: { certified_effort_pct: 50.0, expected_effort_statement_version: "${s2v}" }, as: PrincipalInvestigator, as_user_id: "${pa}" }
            - { call: "POST /api/effort-statements/${sn}/certify", payload: { certified_effort_pct: 8.32, expected_effort_statement_version: "${snv}", payroll_adjustment_note: "residual institutional effort allocation" }, as: PrincipalInvestigator, as_user_id: "${pa}" }
          trigger:
            - { call: "POST /api/effort-cycles/${cyc}/close", payload: { actual_fringe_rate_bps: 0 }, as: GrantsAccountant, captures: { err: $.data.error_id } }
            - { call: "POST /api/effort-statements/${sn}/reopen", payload: { reason: "correct institutional split" }, as: GrantsAccountant, captures: { snv2: $.data.version } }
            - { call: "POST /api/effort-statements/${sn}/certify", payload: { certified_effort_pct: 8.33, expected_effort_statement_version: "${snv2}", payroll_adjustment_note: "residual institutional effort allocation" }, as: PrincipalInvestigator, as_user_id: "${pa}" }
            - { call: "POST /api/effort-cycles/${cyc}/close", payload: { actual_fringe_rate_bps: 0 }, as: GrantsAccountant, captures: { cyc_st: $.data.status } }
          assert:
            - "s1c == 41.67  (5000001 / 12000000 — the cap, not the nominal 50%, caps charged effort)"
            - "s2c == 50.0"
            - "err == ERR_EFFORT_TOTAL_NOT_100  (41.67 + 50.00 + 8.32 = 99.99 violates the invariant)"
            - "EffortCycle.${cyc}.status stays CERTIFYING after the failed close"
            - "cyc_st == CLOSED  (after the compensating re-certification to 8.33: total exactly 100.00)"

      - name: drawdown_pool_conservation_across_settle_and_reject
        grounds:
          - calculations.drawdown_pool_conservation
          - state_machines.DrawdownRequest.SUBMITTED_to_SETTLED
          - state_machines.DrawdownRequest.SUBMITTED_to_REJECTED_BY_SPONSOR
        distinguishing_aspect: |
          Conserved quantity = the LOC eligible pool: cumulative_drawn + reserved + available ==
          350000 at every step — submit moves 200000 from available to reserved, settle moves it from
          reserved to drawn, reject of a second draw moves 150000 back from reserved to available; the
          invariant holds after every transition (and an over-pool submit fails without disturbing it).
        test_recipe:
          setup:
            - "Award L9 (LOC): TRAVEL 100000 + MATERIALS 50000 + EQUIPMENT 200000 (obligated 425000), ACTIVE; E1 100000 cash, E2 50000 NOT disbursed, E3 200000 cash posted -> eligible pool 350000"
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000, late_payment_apr_bps: 0 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "L9-001", title: "Pool conservation", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 425000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "TRAVEL", authorized_cents: 100000 }, as: GrantCoordinator, captures: { travel: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "MATERIALS_SUPPLIES", authorized_cents: 50000 }, as: GrantCoordinator, captures: { mat: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "EQUIPMENT", authorized_cents: 200000 }, as: GrantCoordinator, captures: { equip: $.data.id } }
            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${travel}", expenditure_type: "TRAVEL", amount_cents: 100000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /api/expenditures/${e1}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${mat}", expenditure_type: "SUPPLIES", amount_cents: 50000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: false }, as: GrantCoordinator, captures: { e2: $.data.id } }
            - { call: "POST /api/expenditures/${e2}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${equip}", expenditure_type: "EQUIPMENT", amount_cents: 200000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { e3: $.data.id } }
            - { call: "POST /api/expenditures/${e3}/post", payload: {}, as: GrantsAccountant }
            - { call: "GET /api/awards/${aw}", as: GrantsAccountant, captures: { v1: $.data.version } }
            - { call: "POST /api/drawdown-requests", payload: { award_id: "${aw}", amount_cents: 200000, expected_award_version: "${v1}" }, as: GrantsAccountant, captures: { d1: $.data.id } }
            - { call: "POST /api/drawdown-requests/${d1}/submit", payload: {}, as: GrantsAccountant }
          trigger:
            - { call: "GET /api/awards/${aw}", as: GrantsAccountant, captures: { s1_drawn: $.data.cumulative_drawn_cents, s1_res: $.data.reserved_draw_cents, s1_avail: $.data.available_draw_pool_cents, v2: $.data.version } }
            - { call: "POST /api/drawdown-requests/${d1}/settle", payload: {}, as: SponsorOfficial }
            - { call: "GET /api/awards/${aw}", as: GrantsAccountant, captures: { s2_drawn: $.data.cumulative_drawn_cents, s2_res: $.data.reserved_draw_cents, s2_avail: $.data.available_draw_pool_cents, v3: $.data.version } }
            - { call: "POST /api/drawdown-requests", payload: { award_id: "${aw}", amount_cents: 150001, expected_award_version: "${v3}" }, as: GrantsAccountant, captures: { d2: $.data.id } }
            - { call: "POST /api/drawdown-requests/${d2}/submit", payload: {}, as: GrantsAccountant, captures: { err: $.data.error_id } }
            - { call: "GET /api/awards/${aw}", as: GrantsAccountant, captures: { v4: $.data.version } }
            - { call: "POST /api/drawdown-requests", payload: { award_id: "${aw}", amount_cents: 150000, expected_award_version: "${v4}" }, as: GrantsAccountant, captures: { d3: $.data.id } }
            - { call: "POST /api/drawdown-requests/${d3}/submit", payload: {}, as: GrantsAccountant }
            - { call: "GET /api/awards/${aw}", as: GrantsAccountant, captures: { s3_drawn: $.data.cumulative_drawn_cents, s3_res: $.data.reserved_draw_cents, s3_avail: $.data.available_draw_pool_cents } }
            - { call: "POST /api/drawdown-requests/${d3}/reject", payload: { reject_reason: "sponsor cash-management review" }, as: SponsorOfficial }
            - { call: "GET /api/awards/${aw}", as: GrantsAccountant, captures: { s4_drawn: $.data.cumulative_drawn_cents, s4_res: $.data.reserved_draw_cents, s4_avail: $.data.available_draw_pool_cents } }
          assert:
            - "s1_drawn == 0 and s1_res == 200000 and s1_avail == 150000   (sum 350000)"
            - "s2_drawn == 200000 and s2_res == 0 and s2_avail == 150000     (settle moved reserved -> drawn; sum 350000)"
            - "err == ERR_DRAWDOWN_EXCEEDS_ELIGIBLE  (150001 > available 150000; pool undisturbed)"
            - "s3_drawn == 200000 and s3_res == 150000 and s3_avail == 0       (sum 350000)"
            - "s4_drawn == 200000 and s4_res == 0 and s4_avail == 150000     (reject released the reservation; sum 350000)"
