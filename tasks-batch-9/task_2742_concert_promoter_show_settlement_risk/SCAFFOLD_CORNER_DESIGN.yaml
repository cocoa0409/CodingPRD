            - "PRIORITY 40 PREEMPTS PRIORITY 41 — ${ag_err_frozen} == ERR_MARKET_POSTURE_FROZEN with HTTP 409, NOT ERR_MARKET_EXPOSURE_EXCEEDED 402, even though 1200000 + 400000 also breaks the limit; the posture is read pre-transition and show 4 has no override"
            - "SEATS AGGREGATE THE SAME WAY — the 400 + 400 tiers are created, then ${ag_err_capacity} == ERR_VENUE_CAPACITY_EXCEEDED with HTTP 422 because 400 + 400 + 400 == 1200 > 1000 counting the tier being created"
            - "EXACT FIT STILL PASSES — the retried tier at ${ag_tt_3_alloc} == 200 is created (800 + 200 == 1000 == gross_capacity) and GET /ticket-tiers?show_id=${ag_sh_1} returns total_count 3, so the refused 400-seat attempt left nothing behind"

      - name: cash_limit_and_deal_coherence_apply_only_to_the_configuration_that_names_them
        claim_type: Conditional validation
        grounds:
          - "validations[priority=25]"
          - "validations[priority=42]"
          - "constants.CASH_PAYMENT_LIMIT_CENTS"
        distinguishing_aspect: "Both rules are conditional on a field of the request rather than on the state of the world. The cash limit is checked only when payment_method == CASH: the SAME settlement with payment_due_cents 1000001 is 422 under CASH and PAID under WIRE, while a second settlement at exactly 1000000 is PAID under CASH because the limit is inclusive. Rule 25 is a three-way fork on deal_structure: versus_pct is forbidden under FLAT_GUARANTEE, required under VERSUS, and the deposit clause applies in every structure — so an implementation that validates the union of the fields instead of the branch selected by deal_structure fails in both directions at once."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z. Market Cond Market limit 5000000, Venue Cond Hall gross_capacity 1000 / facility_fee 0 / ticket_tax_pct 0 (so the only deduction is the 2.5% card fee), three Artists with withholding_pct 0."
            - "Show C1: FLAT_GUARANTEE guarantee 1000001, deposit 0, expense_cap 500000; GA 5000 x 200 fully sold; one PRODUCTION line budgeted 100000, is_artist_deductible false, with NO invoice, so actual_cents is 0, variance_pct is -100.00, variance_status is WITHIN_TOLERANCE and settlement_expense_cents is 0. Priority 30 is satisfied and priorities 36 and 37 are both clean."
            - "Show C2: identical except guarantee_cents 1000000 exactly."
            - "Show C3: PLANNED, no offer yet — the target of the rule 25 probes."
            - "Both C1 and C2 are performed, settled to CALCULATED, and signed by their ArtistRep before any payment is attempted; the paying X-User-ID differs from the signing one."
