# =============================================================================
# §1.9 Scaffold Corner Design — task_2369 Conference Program Committee &
# Abstract Review
#
# Breadth probe over the claims declared by SCAFFOLD.yaml §1.1-§1.7 that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) does not already assert. Sections and
# claim_type values are taken only from references/claim-extraction-guide.md.
#
# Shared fixture vocabulary (every chain starts from an empty database):
#   clock       POST /_clock/set_current_utc  -> 2026-01-05T00:00:00Z
#   Conference  GOS26, event 2026-09-01T08:00Z .. 2026-09-03T18:00Z,
#               abstract_deadline 2026-03-01T23:59Z, review_deadline
#               2026-05-01T23:59Z, program_freeze 2026-08-15T00:00Z,
#               cme pool 600 minutes
#   Committee   Cho (CHAIR), Dana (CHAIR), Rui / Mei (REVIEWER); each member is
#               created, files a ConflictDeclaration with
#               conflict_subject_type NONE, then transitions INVITED -> ACTIVE
#   Authors     Ada (submitting), Ben (second author)
#   Abstracts   keywords ["oncology", "immunotherapy"]
#   Reviews     4/4/4/4 HIGH -> weighted 4.00 and 3/3/3/3 MEDIUM -> weighted
#               3.00, i.e. a spread of 1.00 that stays under a 4.00 threshold
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — Entities (§1.1)
  # ===========================================================================
  - section: entities
    instances:

      - name: conference_creation_returns_draft_status_and_zeroed_ledgers
        claim_type: creation
        grounds:
          - endpoints.POST./conferences
          - entities.Conference.fields.status
          - entities.Conference.fields.cme_minutes_available
        distinguishing_aspect: |
          POST /conferences with every required field returns 201 and the full
          entity: status DRAFT, all four acceptance counters 0, the CME ledger
          split as allocated 0 / available == cme_minutes_pool_total, and both
          bounded cycle counters at 0. An implementation that leaves
          cme_minutes_available at its declared field default of 0 instead of
          seeding it from the pool total fails here.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-01-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
          trigger:
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 3, poster_slot_capacity: 2, workshop_slot_capacity: 1, cme_minutes_pool_total: 600 }
              as: ConferenceAdmin
              captures: { conf_id: "$.data.id", conf_status: "$.data.status", available: "$.data.cme_minutes_available" }
          assert:
            - "HTTP 201"
            - "Conference.${conf_id}.status == DRAFT"
            - "Conference.${conf_id}.accepted_oral_count == 0"
            - "Conference.${conf_id}.accepted_poster_count == 0"
            - "Conference.${conf_id}.accepted_workshop_count == 0"
            - "Conference.${conf_id}.waitlisted_count == 0"
            - "Conference.${conf_id}.cme_minutes_allocated == 0"
            - "Conference.${conf_id}.cme_minutes_available == 600"
            - "Conference.${conf_id}.cfa_extension_count == 0"
            - "Conference.${conf_id}.review_reopen_count == 0"
            - "Conference.${conf_id}.abstract_sequence == 0"
            - "the response body carries id, created_at, updated_at and version"

      - name: conference_retrieval_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - endpoints.GET./conferences/{conferenceId}
          - entities.Conference.fields.code
        distinguishing_aspect: |
          GET /conferences/{conferenceId} echoes exactly what POST /conferences
          persisted - the input datetimes and capacities round-trip unmodified
          and no counter has drifted from the create response.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z; Conference GOS26 exists in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 3, poster_slot_capacity: 2, workshop_slot_capacity: 1, cme_minutes_pool_total: 600 }
              as: ConferenceAdmin
              captures: { conf_id: "$.data.id" }
          trigger:
            - call: "GET /conferences/${conf_id}"
              as: ConferenceAdmin
              captures: { code: "$.data.code", oral_cap: "$.data.oral_slot_capacity", freeze: "$.data.program_freeze_utc" }
          assert:
            - "HTTP 200"
            - "Conference.${conf_id}.code == GOS26"
            - "Conference.${conf_id}.event_start_utc == 2026-09-01T08:00:00Z"
            - "Conference.${conf_id}.program_freeze_utc == 2026-08-15T00:00:00Z"
            - "Conference.${conf_id}.oral_slot_capacity == 3"
            - "Conference.${conf_id}.poster_slot_capacity == 2"
            - "Conference.${conf_id}.workshop_slot_capacity == 1"
            - "Conference.${conf_id}.status == DRAFT"

      - name: category_omitted_optionals_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - endpoints.POST./categories
          - entities.SubmissionCategory.fields.min_reviews_required
          - entities.SubmissionCategory.fields.discrepancy_threshold
          - entities.SubmissionCategory.fields.cme_eligible
        distinguishing_aspect: |
          A category created without min_reviews_required, discrepancy_threshold
          or cme_eligible must materialise the declared defaults 3, 2.50 and
          false - not null, and not the tighter values other fixtures pass
          explicitly.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z; Conference GOS26 exists in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 3, poster_slot_capacity: 2, workshop_slot_capacity: 1, cme_minutes_pool_total: 600 }
              as: ConferenceAdmin
              captures: { conf_id: "$.data.id" }
          trigger:
            - call: "POST /categories"
              payload: { conference_id: "${conf_id}", code: "GEN", name: "General Oncology", max_word_count: 300, allowed_formats: ["ORAL", "POSTER"] }
              as: ConferenceAdmin
              captures: { cat_id: "$.data.id", minr: "$.data.min_reviews_required", thr: "$.data.discrepancy_threshold", cme: "$.data.cme_eligible" }
          assert:
            - "HTTP 201"
            - "SubmissionCategory.${cat_id}.min_reviews_required == 3"
            - "SubmissionCategory.${cat_id}.discrepancy_threshold == 2.50"
            - "SubmissionCategory.${cat_id}.cme_eligible == false"
            - "SubmissionCategory.${cat_id}.allowed_formats == [ORAL, POSTER]"

      - name: abstract_blind_code_and_sequence_are_minted_by_the_server
        claim_type: system_fields
        grounds:
          - endpoints.POST./abstracts
          - entities.Abstract.fields.blind_code
          - entities.Conference.fields.abstract_sequence
        distinguishing_aspect: |
          blind_code is minted as <Conference.code>-B<sequence zero-padded to 4>
          and the conference sequence advances per submission, so the first two
          abstracts of GOS26 are GOS26-B0001 and GOS26-B0002 with
          abstract_sequence 2 - the client never supplies these, and status,
          revision_round and embargo_status are seeded by the server.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z; Conference GOS26 at CFA_OPEN with category GEN (ORAL, POSTER)."
            - "Authors Ada and Ben exist; no abstract has been submitted, so abstract_sequence is 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 3, poster_slot_capacity: 2, workshop_slot_capacity: 1, cme_minutes_pool_total: 600 }
              as: ConferenceAdmin
              captures: { conf_id: "$.data.id" }
            - call: "POST /categories"
              payload: { conference_id: "${conf_id}", code: "GEN", name: "General Oncology", max_word_count: 300, allowed_formats: ["ORAL", "POSTER"], min_reviews_required: 2, discrepancy_threshold: 4.00 }
              as: ConferenceAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /authors"
              payload: { full_name: "Ada Rivera", email: "ada@lab.example", affiliation: "Northline University" }
              as: ConferenceAdmin
              captures: { au_ada_id: "$.data.id" }
            - call: "POST /authors"
              payload: { full_name: "Ben Ohara", email: "ben@lab.example", affiliation: "Seaboard Institute" }
              as: ConferenceAdmin
              captures: { au_ben_id: "$.data.id" }
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "CFA_OPEN" }
              as: ConferenceAdmin
          trigger:
            - call: "POST /abstracts"
              payload: { conference_id: "${conf_id}", category_id: "${cat_id}", submitting_author_id: "${au_ada_id}", title: "Immunotherapy response imaging", body_word_count: 280, requested_format: "ORAL", keywords: ["oncology", "immunotherapy"], body_structured: true, coauthor_emails: [], is_newsworthy: false }
              as: Author
              as_user_id: "${au_ada_id}"
              captures: { ab1_id: "$.data.id", code1: "$.data.blind_code", st1: "$.data.status" }
            - call: "POST /abstracts"
              payload: { conference_id: "${conf_id}", category_id: "${cat_id}", submitting_author_id: "${au_ben_id}", title: "Adjuvant sequencing in early disease", body_word_count: 260, requested_format: "POSTER", keywords: ["oncology", "immunotherapy"], body_structured: true, coauthor_emails: [], is_newsworthy: false }
              as: Author
              as_user_id: "${au_ben_id}"
              captures: { ab2_id: "$.data.id", code2: "$.data.blind_code" }
            - call: "GET /conferences/${conf_id}"
              as: ConferenceAdmin
              captures: { seq: "$.data.abstract_sequence" }
          assert:
            - "HTTP 201 for both submissions"
            - "Abstract.${ab1_id}.blind_code == GOS26-B0001"
            - "Abstract.${ab2_id}.blind_code == GOS26-B0002"
            - "Abstract.${ab1_id}.status == SUBMITTED"
            - "Abstract.${ab1_id}.revision_round == 0"
            - "Abstract.${ab1_id}.embargo_status == NONE"
            - "Abstract.${ab1_id}.submitted_review_count == 0"
            - "Abstract.${ab1_id}.provisional_score == null"
            - "Abstract.${ab1_id}.final_score == null"
            - "Abstract.${ab1_id}.decision == null"
            - "Conference.${conf_id}.abstract_sequence == 2"

      - name: author_registration_stamps_the_computed_registration_fields
        claim_type: computed_fields
        grounds:
          - endpoints.POST./authors/{authorId}/registration
          - entities.Author.fields.is_registered
          - entities.Author.fields.registered_at
        distinguishing_aspect: |
          Author.is_registered and registered_at are server-written: a fresh
          author is false/null, registration stamps the logical clock (NOT wall
          time), and clearing registration nulls the stamp again. The sanction
          fields stay at their computed defaults throughout.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z; Author Ada exists with is_registered false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /authors"
              payload: { full_name: "Ada Rivera", email: "ada@lab.example", affiliation: "Northline University" }
              as: ConferenceAdmin
              captures: { au_ada_id: "$.data.id", reg0: "$.data.is_registered", stamp0: "$.data.registered_at" }
          trigger:
            - call: "POST /authors/${au_ada_id}/registration"
              payload: { is_registered: true }
              as: Author
              as_user_id: "${au_ada_id}"
              captures: { reg1: "$.data.is_registered", stamp1: "$.data.registered_at" }
            - call: "POST /authors/${au_ada_id}/registration"
              payload: { is_registered: false }
              as: ConferenceAdmin
              captures: { reg2: "$.data.is_registered", stamp2: "$.data.registered_at" }
          assert:
            - "on creation Author.${au_ada_id}.is_registered == false and registered_at == null"
            - "after the first call Author.${au_ada_id}.is_registered == true and registered_at == 2026-01-05T00:00:00Z"
            - "after the second call Author.${au_ada_id}.is_registered == false and registered_at == null"
            - "Author.${au_ada_id}.no_show_strikes == 0"
            - "Author.${au_ada_id}.embargo_breach_count == 0"
            - "Author.${au_ada_id}.sanction_status == NONE"

      - name: conflict_declaration_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.ConflictDeclaration.fields.declared_at
          - endpoints.POST./conflict-declarations
          - endpoints.GET./conflict-declarations/{declarationId}
        distinguishing_aspect: |
          ConflictDeclaration is declared with common_fields false: the row has
          id and declared_at but NO version and NO updated_at, §1.5 exposes no
          update or delete endpoint for it, and the declaration read back is
          byte-identical to the one written.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z; Conference GOS26 with reviewer Rui INVITED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 3, poster_slot_capacity: 2, workshop_slot_capacity: 1, cme_minutes_pool_total: 600 }
              as: ConferenceAdmin
              captures: { conf_id: "$.data.id" }
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Rui Alvarez", email: "rui@panel.example", member_role: "REVIEWER", expertise_keywords: ["oncology", "imaging"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_r1_id: "$.data.id" }
          trigger:
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_r1_id}", conflict_subject_type: "AFFILIATION", conflict_subject_value: "Northline University", conflict_type: "INSTITUTIONAL" }
              as: Reviewer
              as_user_id: "${mb_r1_id}"
              captures: { decl_id: "$.data.id", declared: "$.data.declared_at" }
            - call: "GET /conflict-declarations/${decl_id}"
              as: Reviewer
              as_user_id: "${mb_r1_id}"
              captures: { subj: "$.data.conflict_subject_value", ctype: "$.data.conflict_type" }
          assert:
            - "HTTP 201 then HTTP 200"
            - "ConflictDeclaration.${decl_id}.declared_at == 2026-01-05T00:00:00Z"
            - "ConflictDeclaration.${decl_id}.conflict_subject_type == AFFILIATION"
            - "ConflictDeclaration.${decl_id}.conflict_subject_value == Northline University"
            - "ConflictDeclaration.${decl_id}.conflict_type == INSTITUTIONAL"
            - "the response body has no version field and no updated_at field"
            - "§1.5 declares no PATCH, PUT or DELETE endpoint for /conflict-declarations"

      - name: unknown_abstract_id_on_get_returns_abstract_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET./abstracts/{abstractId}
          - errors[ERR_ABSTRACT_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: |
          A syntactically valid UUID that matches no row resolves to
          ERR_ABSTRACT_NOT_FOUND with HTTP 404 - the entity-specific code from
          the §1.6 catalog, not a generic 404 body and not ERR_VALIDATION.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z; the database holds no Abstract rows at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
          trigger:
            - call: "GET /abstracts/00000000-0000-4000-8000-0000000009ff"
              as: ConferenceAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404"
            - "error_id == ERR_ABSTRACT_NOT_FOUND"
            - "the envelope is the §1.5 error envelope with response_type error and a data.message string"

      - name: abstract_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET./abstracts
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Three abstracts with limit 2 return exactly 2 rows, total_count 3 and
          has_more true; offset 2 returns the remaining 1 row with has_more
          false. total_count counts the filtered set, not the page.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z; Conference GOS26 at CFA_OPEN with category GEN."
            - "Author Ada has submitted three abstracts, all SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 3, poster_slot_capacity: 2, workshop_slot_capacity: 1, cme_minutes_pool_total: 600 }
              as: ConferenceAdmin
              captures: { conf_id: "$.data.id" }
            - call: "POST /categories"
              payload: { conference_id: "${conf_id}", code: "GEN", name: "General Oncology", max_word_count: 300, allowed_formats: ["ORAL", "POSTER"], min_reviews_required: 2, discrepancy_threshold: 4.00 }
              as: ConferenceAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /authors"
              payload: { full_name: "Ada Rivera", email: "ada@lab.example", affiliation: "Northline University" }
              as: ConferenceAdmin
              captures: { au_ada_id: "$.data.id" }
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "CFA_OPEN" }
              as: ConferenceAdmin
            - call: "POST /abstracts"
              payload: { conference_id: "${conf_id}", category_id: "${cat_id}", submitting_author_id: "${au_ada_id}", title: "Paper one", body_word_count: 210, requested_format: "ORAL", keywords: ["oncology", "immunotherapy"] }
              as: Author
              as_user_id: "${au_ada_id}"
              captures: { ab1_id: "$.data.id" }
            - call: "POST /abstracts"
              payload: { conference_id: "${conf_id}", category_id: "${cat_id}", submitting_author_id: "${au_ada_id}", title: "Paper two", body_word_count: 220, requested_format: "ORAL", keywords: ["oncology", "immunotherapy"] }
              as: Author
              as_user_id: "${au_ada_id}"
              captures: { ab2_id: "$.data.id" }
            - call: "POST /abstracts"
              payload: { conference_id: "${conf_id}", category_id: "${cat_id}", submitting_author_id: "${au_ada_id}", title: "Paper three", body_word_count: 230, requested_format: "POSTER", keywords: ["oncology", "immunotherapy"] }
              as: Author
              as_user_id: "${au_ada_id}"
              captures: { ab3_id: "$.data.id" }
          trigger:
            - call: "GET /abstracts"
              payload: { conference_id: "${conf_id}", limit: 2, offset: 0 }
              as: Author
              as_user_id: "${au_ada_id}"
              captures: { page1_first: "$.data[0].id", page1_total: "$.meta.total_count" }
            - call: "GET /abstracts"
              payload: { conference_id: "${conf_id}", limit: 2, offset: 2 }
              as: ConferenceAdmin
              captures: { page2_first: "$.data[0].id", page2_total: "$.meta.total_count" }
          assert:
            - "HTTP 200 for both pages"
            - "the first page contains exactly 2 Abstract rows with meta.total_count == 3 and meta.has_more == true"
            - "the second page contains exactly 1 Abstract row with meta.total_count == 3 and meta.has_more == false"
            - "the three ids across both pages are distinct and cover ${ab1_id}, ${ab2_id} and ${ab3_id}"
            - "response_type == array on both pages"

      - name: rubric_score_above_five_is_rejected_by_schema_validation
        claim_type: type_constraints
        grounds:
          - entities.Review.fields.score_originality
          - validations[priority=7]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: |
          score_originality is constrained to 1..5, so a 6 is a priority-7
          schema failure with HTTP 400 ERR_VALIDATION - it must NOT be clamped
          into range and must not reach the weighted-score calculation, so the
          review stays ASSIGNED and the reviewer's load is untouched.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z; Conference GOS26 at REVIEW_OPEN with category GEN (min_reviews_required 2, discrepancy_threshold 4.00)."
            - "Ada's abstract is UNDER_REVIEW with one ASSIGNED review held by Rui, whose current_review_load is 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 3, poster_slot_capacity: 2, workshop_slot_capacity: 1, cme_minutes_pool_total: 600 }
              as: ConferenceAdmin
              captures: { conf_id: "$.data.id" }
            - call: "POST /categories"
              payload: { conference_id: "${conf_id}", code: "GEN", name: "General Oncology", max_word_count: 300, allowed_formats: ["ORAL", "POSTER"], min_reviews_required: 2, discrepancy_threshold: 4.00 }
              as: ConferenceAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /authors"
              payload: { full_name: "Ada Rivera", email: "ada@lab.example", affiliation: "Northline University" }
              as: ConferenceAdmin
              captures: { au_ada_id: "$.data.id" }
            - call: "POST /committee-members"
