              as: AltEdTeacher
              as_user_id: "teach-01"
              captures: { enr_id: $.data.id }
            - call: "POST /course-enrollments/${enr_id}/progress"
              payload: { modules_passed_delta: 8, seat_hours_delta: 50.00, module_avg_percent: 88.00 }
              as: AltEdTeacher
              as_user_id: "teach-01"
            - call: "POST /support-providers"
              payload: { center_id: "${ctr_id}", role_type: "COUNSELOR", full_name: "Rae Vance", max_concurrent_students: 2 }
              as: DistrictAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /support-sessions"
              payload: { support_provider_id: "${prov_id}", placement_id: "${pl_id}", start_at: "2026-08-04T13:00:00Z", end_at: "2026-08-04T14:00:00Z", service_code: "ACADEMIC_COUNSELING" }
