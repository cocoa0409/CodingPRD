              as_user_id: "${law_id}"
              captures: { bca_id: $.data.id }
            - call: "POST /gis/emergency-service-boundaries/${b_id}/propose"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${law_id}"
            - call: "POST /gis/emergency-service-boundaries/${b_id}/activate"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${law_id}"
          trigger:
            - call: "POST /gis/emergency-service-boundaries/${b_id}/activate"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${law_id}"
              captures: { err_id: $.data.error_id }
          assert:
