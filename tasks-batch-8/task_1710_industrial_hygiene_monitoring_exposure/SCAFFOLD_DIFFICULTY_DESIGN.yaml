  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: plan_reject_and_regress_cycles
        grounds:
          - state_machines.SamplingPlan.PENDING_APPROVAL_to_DRAFT
          - state_machines.SamplingPlan.FIELD_COMPLETE_to_APPROVED
        distinguishing_aspect: |
          SamplingPlan is CYCLIC (not a linear pipeline): the reject loop
          DRAFT->PENDING_APPROVAL->DRAFT and the invalidation regress FIELD_COMPLETE->APPROVED
          are both exercised on one plan, ending back in FIELD_COMPLETE after a replacement
          sample reuses the released calibration.
        test_recipe:
          setup:
            - "SEG H=3, plan required 3; three SEALED samples; plan has already looped DRAFT->PENDING_APPROVAL->DRAFT once"
          setup_api_calls:
            - { call: "POST /ih/sites", payload: { name: "Apex Coating", industry_code: "332812" }, as: FirmAdmin, captures: { site: $.data.id } }
            - { call: "POST /ih/exposure-limits", payload: { analyte_code: "PB", basis: "OSHA_PEL", limit_type: "TWA8", limit_mg_m3: 0.05 }, as: FirmAdmin, captures: { lim: $.data.id } }
