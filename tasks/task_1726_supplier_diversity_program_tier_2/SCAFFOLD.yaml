# =============================================================================
# PRD Benchmark Scaffold — Supplier Diversity Program & Tier-2 Reporting
# =============================================================================

scenario: |
  Supplier Diversity Program & Tier-2 Reporting (corporate supplier diversity
  office): diverse supplier certification verification & expiration, spend
  attribution by diversity category, tier-2 subcontracting reporting collection
  from primes, program goal setting & business unit scorecards, sourcing event
  inclusion requirements, customer/government reporting obligations, supplier
  development & mentoring program, data quality & self-certification audit

domain_name: supplier-diversity-tier2
api_prefix: /api/v1

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: BusinessUnit
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Business unit display name" }
      - { name: code, type: string, source: input, description: "Short unique BU code (e.g., AEROSPACE); unique across all business units", constraints: "unique; immutable after creation" }
      - { name: lead_user_id, type: string, source: input, description: "Opaque X-User-ID of the BusinessUnitLead who owns sourcing events for this BU" }
      - { name: inclusion_min_diverse_bidders, type: integer, source: input, default: 1, description: "Default minimum diverse bidders required on sourcing events of this BU; 0..10" }
      - { name: lifetime_imported_spend_cents, type: integer, source: computed, default: 0, description: "Monotonic sum of amount_cents over every SpendRecord ever imported for this BU (never decremented)" }
      - { name: lifetime_voided_spend_cents, type: integer, source: computed, default: 0, description: "Monotonic sum of amount_cents over SpendRecords voided for this BU (never decremented)" }

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name" }
      - { name: tax_id, type: string, source: input, description: "Tax identifier; unique across all suppliers", constraints: "unique" }
      - { name: kind, type: enum, source: input, description: "DIVERSE | PRIME | BOTH — PRIME/BOTH suppliers may submit tier-2 reports" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: status, type: enum, source: system, description: "REGISTERED | ACTIVE | SUSPENDED" }
      - { name: diverse_eligible, type: boolean, source: computed, default: false, description: "true iff supplier has >=1 Certification with status VERIFIED whose [valid_from, valid_to] closed window covers the current logical-clock date" }
      - { name: risk_score_standard, type: integer, source: computed, default: 0, description: "Compliance risk score, STANDARD variant (confirmed findings only); see calculations.supplier_risk_score" }
      - { name: risk_score_conservative, type: integer, source: computed, default: 0, description: "Compliance risk score, CONSERVATIVE variant (adds pending signals); see calculations.supplier_risk_score" }

  - name: Certification
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: system, description: "FK -> Supplier.id; owning supplier (from path)" }
      - { name: cert_type, type: enum, source: input, description: "MBE | WBE | VET | SDVET | LGBTQBE | DOBE | SBA8A | SELF_CERT" }
      - { name: certifying_body, type: string, source: input, description: "Issuing body (e.g., NMSDC, WBENC); literal 'SELF' for SELF_CERT" }
      - { name: certificate_number, type: string, source: input, description: "External certificate identifier" }
      - { name: valid_from, type: string, source: input, description: "ISO date (YYYY-MM-DD), first covered day (inclusive)" }
      - { name: valid_to, type: string, source: input, description: "ISO date (YYYY-MM-DD), last covered day (inclusive); must be >= valid_from" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | VERIFIED | REJECTED | EXPIRED | REVOKED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the submitter (segregation-of-duties anchor)" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the verifier; null until VERIFIED" }
      - { name: review_note, type: string, source: system, description: "Latest reviewer note (request-info / reject reason)" }

  - name: SpendRecord
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; supplier paid" }
      - { name: business_unit_id, type: string, source: input, description: "FK -> BusinessUnit.id; sponsoring business unit" }
      - { name: amount_cents, type: integer, source: input, description: "Spend amount in cents; must be > 0" }
      - { name: transaction_date, type: string, source: input, description: "ISO date of the purchase transaction (ACCRUAL basis date)" }
      - { name: payment_date, type: string, source: input, description: "ISO date cash left the company (CASH basis date)" }
      - { name: po_number, type: string, source: input, description: "Optional purchase order reference" }
      - { name: status, type: enum, source: system, description: "POSTED | VOIDED" }

  - name: Tier2Report
    parent: null
    common_fields: true
    fields:
      - { name: prime_supplier_id, type: string, source: input, description: "FK -> Supplier.id; prime contractor reporting (kind PRIME or BOTH). For PrimeContact callers must equal X-User-ID" }
      - { name: business_unit_id, type: string, source: input, description: "FK -> BusinessUnit.id; sponsoring business unit this report feeds" }
      - { name: reporting_period, type: string, source: input, description: "Quarter label 'YYYY-Qn' (n in 1..4); maps to inclusive calendar quarter date range" }
      - { name: lines, type: array, source: input, description: "Array of { diverse_supplier_id, gross_subcontract_cents (>0), diverse_share_pct (0 < pct <= 100.00, 2 decimals) }" }
      - { name: total_subcontracted_cents, type: integer, source: computed, description: "Sum of gross_subcontract_cents over lines" }
      - { name: total_diverse_tier2_cents, type: integer, source: computed, description: "Sum of per-line allocated_cents (per-line round_half_up first, then sum) — see calculations.tier2_spend_aggregation" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | RETURNED | APPROVED | SUPERSEDED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID that last submitted the report" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the admin who approved; null until APPROVED" }

  - name: ProgramGoal
    parent: null
    common_fields: true
    fields:
      - { name: business_unit_id, type: string, source: system, description: "FK -> BusinessUnit.id; owning BU (from path)" }
      - { name: fiscal_year, type: integer, source: input, description: "Calendar fiscal year, e.g. 2026" }
      - { name: cert_category, type: enum, source: input, description: "ALL | MBE | WBE | VET | SDVET | LGBTQBE | DOBE | SBA8A | SELF_CERT — category the goal measures; scorecards use the cert_category=ALL goal" }
      - { name: goal_type, type: enum, source: input, description: "PERCENT_OF_SPEND | ABSOLUTE_AMOUNT" }
      - { name: target_value, type: number, source: input, description: "PERCENT_OF_SPEND: 0 < value <= 100.00 (percent, 2 decimals). ABSOLUTE_AMOUNT: integer cents > 0" }
      - { name: include_tier2, type: boolean, source: input, default: true, description: "Whether approved tier-2 spend counts toward attainment numerator" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | SUPERSEDED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator (SoD anchor for publish)" }

  - name: Scorecard
    parent: null
    common_fields: true
    fields:
      - { name: business_unit_id, type: string, source: system, description: "FK -> BusinessUnit.id; owning BU (from path)" }
      - { name: reporting_period, type: string, source: input, description: "Quarter label 'YYYY-Qn'" }
      - { name: attribution_basis, type: enum, source: input, description: "ACCRUAL (transaction_date) | CASH (payment_date) — immutable after generation" }
      - { name: total_spend_cents, type: integer, source: computed, description: "All POSTED spend for the BU inside the period under the stored basis" }
      - { name: direct_diverse_spend_cents, type: integer, source: computed, description: "POSTED spend attributable to a diversity-eligible certification under the stored basis" }
      - { name: tier2_diverse_spend_cents, type: integer, source: computed, description: "Sum of total_diverse_tier2_cents over APPROVED Tier2Reports for this BU + period" }
      - { name: spend_by_category, type: object, source: computed, description: "Map cert_type -> attributed cents for direct diverse spend (only categories with > 0 appear)" }
      - { name: attainment_pct, type: number, source: computed, description: "Percent of the PUBLISHED ALL-category goal achieved (2 decimals, round_half_up); null when no PUBLISHED goal" }
      - { name: rating, type: enum, source: computed, description: "EXCEEDS | MEETS | NEAR | BELOW | NO_GOAL" }
      - { name: goal_id, type: string, source: computed, description: "FK -> ProgramGoal.id; the PUBLISHED goal used for attainment, null when none (informational link, not an owning FK)" }
      - { name: status, type: enum, source: system, description: "GENERATED | PUBLISHED (PUBLISHED snapshots are immutable; recompute rejected)" }

  - name: SourcingEvent
    parent: null
    common_fields: true
    fields:
      - { name: business_unit_id, type: string, source: input, description: "FK -> BusinessUnit.id; owning BU" }
      - { name: title, type: string, source: input, description: "Event title" }
      - { name: estimated_value_cents, type: integer, source: input, description: "Estimated contract value in cents; award cap (> 0)" }
      - { name: required_diverse_bidders, type: integer, source: input, description: "Minimum diverse bidders with BID_SUBMITTED required to award without waiver; 0..10; defaults to BU inclusion_min_diverse_bidders when omitted" }
      - { name: award_supplier_id, type: string, source: system, description: "Winning supplier id; null until AWARDED" }
      - { name: award_amount_cents, type: integer, source: system, description: "Awarded amount; null until AWARDED" }
      - { name: inclusion_waiver_reason, type: string, source: system, description: "Waiver justification recorded at award; null when awarded without waiver" }
      - { name: diverse_bid_count, type: integer, source: computed, default: 0, description: "Denormalized count of invitations in status BID_SUBMITTED whose supplier is currently diverse_eligible; recomputed on every invitation mutation and supplier eligibility change" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | AWARDED | CANCELLED" }

  - name: BidderInvitation
    parent: null
    common_fields: true
    fields:
      - { name: sourcing_event_id, type: string, source: system, description: "FK -> SourcingEvent.id; owning event (from path at creation)" }
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; invited supplier" }
      - { name: status, type: enum, source: system, description: "INVITED | BID_SUBMITTED | DECLINED | NO_RESPONSE | WON | LOST | WITHDRAWN" }

  - name: DevelopmentEngagement
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: system, description: "FK -> Supplier.id; enrolled supplier (from path)" }
      - { name: track, type: enum, source: input, description: "MENTORING | CAPABILITY_BUILDING | ACCESS_TO_CAPITAL" }
      - { name: start_date, type: string, source: input, description: "ISO date; engagement activates when clock reaches it" }
      - { name: end_date, type: string, source: input, description: "ISO date; half-open window end (exclusive); must be > start_date" }
      - { name: mentor_name, type: string, source: input, description: "Assigned mentor" }
      - { name: capacity_score_before, type: integer, source: input, description: "Baseline capability score 0..100" }
      - { name: capacity_score_after, type: integer, source: system, description: "Exit capability score 0..100 recorded at completion; null until COMPLETED" }
      - { name: improvement, type: integer, source: computed, description: "capacity_score_after - capacity_score_before; null until COMPLETED" }
      - { name: status, type: enum, source: system, description: "ENROLLED | ACTIVE | COMPLETED | WITHDRAWN" }

  - name: AuditCase
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; audited supplier" }
      - { name: certification_id, type: string, source: input, description: "FK -> Certification.id; audited certification (must be cert_type SELF_CERT and status VERIFIED)" }
      - { name: reason, type: string, source: input, description: "Audit trigger reason (e.g., RANDOM_SAMPLE, DATA_QUALITY_FLAG)" }
      - { name: auditor_user_id, type: string, source: system, description: "X-User-ID of the auditor (from header); must differ from certification.verified_by_user_id (SoD)" }
      - { name: outcome, type: enum, source: system, description: "CONFIRMED | FAILED; null until recorded" }
      - { name: outcome_recorded_at, type: datetime, source: system, description: "Logical-clock timestamp when outcome was recorded; null until then (drives 90-day self-cert cooling-off)" }
      - { name: status, type: enum, source: system, description: "OPEN | CONFIRMED | FAILED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Supplier
    initial_state: REGISTERED
    terminal_states: []
    transitions:
      - from: REGISTERED
        to: ACTIVE
        trigger: "system (automatic when the supplier's first Certification reaches VERIFIED)"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute supplier.diverse_eligible"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/v1/suppliers/{id}/suspend"
        actor: DiversityAdmin
        preconditions: []
        side_effects:
          - "supplier.diverse_eligible recomputed (cert revocation or suspension forces false when no VERIFIED covering cert remains)"
          - "Every BidderInvitation for this supplier in status INVITED or BID_SUBMITTED transitions to WITHDRAWN (withdrawal cascade)"
          - "Each withdrawal recomputes the owning SourcingEvent.diverse_bid_count"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when an AuditCase on this supplier records outcome FAILED — fired by the certification revocation cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "supplier.diverse_eligible recomputed"
          - "Every BidderInvitation for this supplier in status INVITED or BID_SUBMITTED transitions to WITHDRAWN"
          - "Each withdrawal recomputes the owning SourcingEvent.diverse_bid_count"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/v1/suppliers/{id}/reinstate"
        actor: DiversityAdmin
        preconditions:
          - "No AuditCase for this supplier in status OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "supplier.diverse_eligible recomputed (does NOT restore WITHDRAWN invitations)"

  - entity: Certification
    initial_state: SUBMITTED
    terminal_states: [REJECTED, EXPIRED, REVOKED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /api/v1/certifications/{id}/begin-review"
        actor: DiversityAnalyst | DiversityAdmin
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /api/v1/certifications/{id}/request-info"
        actor: DiversityAnalyst | DiversityAdmin
        preconditions: []
        side_effects:
          - "review_note := request note"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /api/v1/certifications/{id}/resubmit"
        actor: DiversityAnalyst | DiversityAdmin
        preconditions: []
        side_effects:
          - "Replace certificate_number / valid_from / valid_to with resubmitted values"
          - "submitted_by_user_id := resubmitting X-User-ID"
      - from: UNDER_REVIEW
        to: VERIFIED
        trigger: "POST /api/v1/certifications/{id}/verify"
        actor: DiversityAnalyst | DiversityAdmin
        preconditions:
          - "Caller X-User-ID != certification.submitted_by_user_id (segregation of duties — ERR_SOD_VIOLATION)"
          - "valid_to >= current logical-clock date (ERR_CERT_WINDOW_EXPIRED)"
          - "No other Certification of same supplier + cert_type in status VERIFIED or EXPIRED with overlapping closed [valid_from, valid_to] window — boundaries inclusive (ERR_CERT_WINDOW_OVERLAP)"
        side_effects:
          - "verified_by_user_id := caller X-User-ID"
          - "If supplier.status == REGISTERED: supplier -> ACTIVE (first verified certification)"
          - "Recompute supplier.diverse_eligible; if it changed, recompute diverse_bid_count on every SourcingEvent holding an invitation for this supplier"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /api/v1/certifications/{id}/reject"
        actor: DiversityAnalyst | DiversityAdmin
        preconditions:
          - "Caller X-User-ID != certification.submitted_by_user_id (segregation of duties — ERR_SOD_VIOLATION)"
        side_effects:
          - "review_note := reject reason"
      - from: VERIFIED
        to: EXPIRED
        trigger: "system (expiration sweep inside POST /api/v1/_clock/set_current_utc: VERIFIED certifications whose valid_to is strictly before the new clock date)"
        actor: system
        preconditions:
          - "valid_to < new clock date (on valid_to itself the certification remains VERIFIED — closed window)"
        side_effects:
          - "Recompute supplier.diverse_eligible; if it changed, recompute diverse_bid_count on every SourcingEvent holding an invitation for this supplier"
      - from: VERIFIED
        to: REVOKED
        trigger: "system (only via AuditCase record-outcome FAILED)"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute supplier.diverse_eligible"
          - "Supplier -> SUSPENDED (audit-failure cascade: ACTIVE -> SUSPENDED, system trigger)"
          - "Recompute supplier risk scores (FAILED audit term applies)"

  - entity: SpendRecord
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: VOIDED
        trigger: "POST /api/v1/spend-records/{id}/void"
        actor: DiversityAnalyst
        preconditions: []
        side_effects:
          - "BusinessUnit.lifetime_voided_spend_cents += amount_cents (net posted spend conserved: lifetime_imported - lifetime_voided == sum of POSTED amounts)"
          - "GENERATED scorecards are snapshots and are NOT mutated; the void is visible only after scorecard recompute"

  - entity: Tier2Report
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/v1/tier-2-reports/{id}/submit"
        actor: PrimeContact
        preconditions:
          - "Caller X-User-ID == report.prime_supplier_id (ownership — ERR_FORBIDDEN_FOR_ROLE)"
          - "lines must be non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "submitted_by_user_id := caller X-User-ID"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /api/v1/tier-2-reports/{id}/submit (after correcting lines via PUT)"
        actor: PrimeContact
        preconditions:
          - "Caller X-User-ID == report.prime_supplier_id"
          - "lines must be non-empty"
        side_effects:
          - "submitted_by_user_id := caller X-User-ID"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /api/v1/tier-2-reports/{id}/return"
        actor: DiversityAnalyst | DiversityAdmin
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/v1/tier-2-reports/{id}/approve"
        actor: DiversityAdmin
        preconditions:
          - "Every line's diverse_supplier_id references a Supplier with kind DIVERSE or BOTH (ERR_SUPPLIER_NOT_ELIGIBLE)"
          - "Every line's supplier holds a Certification with status VERIFIED or EXPIRED whose closed window covers the reporting_period end date (REVOKED certifications never qualify — ERR_SUPPLIER_NOT_ELIGIBLE)"
        side_effects:
          - "reviewed_by_user_id := caller X-User-ID"
          - "Any other Tier2Report in status APPROVED with the same (prime_supplier_id, reporting_period) transitions to SUPERSEDED (exactly-one-approved invariant)"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (automatic when a newer report for the same (prime_supplier_id, reporting_period) is approved)"
        actor: system
        preconditions: []
        side_effects:
          - "GENERATED scorecards are snapshots and are NOT mutated; supersession is visible after scorecard recompute"

  - entity: ProgramGoal
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/v1/goals/{id}/publish"
        actor: DiversityAdmin
        preconditions:
          - "Caller X-User-ID != goal.created_by_user_id (segregation of duties — ERR_SOD_VIOLATION)"
        side_effects:
          - "Any other PUBLISHED ProgramGoal with same (business_unit_id, cert_category, fiscal_year) transitions to SUPERSEDED"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (automatic when a new DRAFT goal is created for the same (business_unit_id, cert_category, fiscal_year))"
        actor: system
        preconditions: []
        side_effects: []
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (automatic when another goal for the same key is published)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Scorecard
    initial_state: GENERATED
    terminal_states: []
    transitions:
      - from: GENERATED
        to: PUBLISHED
        trigger: "POST /api/v1/scorecards/{id}/publish"
        actor: DiversityAdmin
        preconditions: []
        side_effects:
          - "Snapshot locked: recompute on PUBLISHED scorecards is rejected (ERR_SCORECARD_LOCKED)"

  - entity: SourcingEvent
    initial_state: DRAFT
    terminal_states: [AWARDED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /api/v1/sourcing-events/{id}/open"
        actor: BusinessUnitLead | DiversityAdmin
        preconditions:
          - "BusinessUnitLead caller: X-User-ID == business_unit.lead_user_id of the event's BU (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects: []
      - from: OPEN
        to: AWARDED
        trigger: "POST /api/v1/sourcing-events/{id}/award"
        actor: BusinessUnitLead | DiversityAdmin
        preconditions:
          - "BusinessUnitLead caller: X-User-ID == business_unit.lead_user_id; award carrying inclusion_waiver_reason is restricted to DiversityAdmin (ERR_FORBIDDEN_FOR_ROLE)"
          - "award_supplier_id holds a BidderInvitation on this event in status BID_SUBMITTED and that supplier.status == ACTIVE (ERR_SUPPLIER_NOT_ELIGIBLE)"
          - "diverse_bid_count >= required_diverse_bidders, unless inclusion_waiver_reason is provided (ERR_INCLUSION_SHORTFALL)"
          - "award_amount_cents <= estimated_value_cents (ERR_AWARD_ABOVE_LIMIT)"
        side_effects:
          - "Winning invitation -> WON; other invitations in BID_SUBMITTED -> LOST; invitations still INVITED -> NO_RESPONSE; DECLINED/WITHDRAWN unchanged"
          - "award_supplier_id, award_amount_cents, inclusion_waiver_reason recorded"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/v1/sourcing-events/{id}/cancel"
        actor: BusinessUnitLead | DiversityAdmin
        preconditions:
          - "BusinessUnitLead caller: X-User-ID == business_unit.lead_user_id"
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "POST /api/v1/sourcing-events/{id}/cancel"
        actor: BusinessUnitLead | DiversityAdmin
        preconditions:
          - "BusinessUnitLead caller: X-User-ID == business_unit.lead_user_id"
        side_effects:
          - "Invitations in INVITED -> WITHDRAWN; BID_SUBMITTED/DECLINED unchanged"

  - entity: BidderInvitation
    initial_state: INVITED
    terminal_states: [DECLINED, NO_RESPONSE, WON, LOST, WITHDRAWN]
    transitions:
      - from: INVITED
        to: BID_SUBMITTED
        trigger: "POST /api/v1/invitations/{id}/respond with response=BID_SUBMITTED"
        actor: BusinessUnitLead | DiversityAdmin
        preconditions:
          - "Owning SourcingEvent.status == OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "Recompute owning SourcingEvent.diverse_bid_count"
      - from: INVITED
        to: DECLINED
        trigger: "POST /api/v1/invitations/{id}/respond with response=DECLINED"
        actor: BusinessUnitLead | DiversityAdmin
        preconditions:
          - "Owning SourcingEvent.status == OPEN (ERR_INVALID_STATE)"
        side_effects: []
      - from: INVITED
        to: WITHDRAWN
        trigger: "system (supplier suspension cascade, or owning event cancelled from OPEN)"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute owning SourcingEvent.diverse_bid_count"
      - from: BID_SUBMITTED
        to: WITHDRAWN
        trigger: "system (supplier suspension cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute owning SourcingEvent.diverse_bid_count"
      - from: INVITED
        to: NO_RESPONSE
        trigger: "system (owning event awarded)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BID_SUBMITTED
        to: WON
        trigger: "system (owning event awarded to this supplier)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BID_SUBMITTED
        to: LOST
        trigger: "system (owning event awarded to a different supplier)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DevelopmentEngagement
    initial_state: ENROLLED
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: ENROLLED
        to: ACTIVE
        trigger: "system (activation sweep inside POST /api/v1/_clock/set_current_utc: ENROLLED engagements whose start_date <= new clock date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /api/v1/development-engagements/{id}/complete"
        actor: DiversityAnalyst | DiversityAdmin
        preconditions: []
        side_effects:
          - "capacity_score_after := input; improvement := capacity_score_after - capacity_score_before"
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /api/v1/development-engagements/{id}/withdraw"
        actor: DiversityAnalyst | DiversityAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /api/v1/development-engagements/{id}/withdraw"
        actor: DiversityAnalyst | DiversityAdmin
        preconditions: []
        side_effects: []

  - entity: AuditCase
    initial_state: OPEN
    terminal_states: [CONFIRMED, FAILED]
    transitions:
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /api/v1/audit-cases/{id}/record-outcome with outcome=CONFIRMED"
        actor: Auditor
        preconditions:
          - "Caller X-User-ID == audit_case.auditor_user_id (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "outcome_recorded_at := current logical clock; supplier risk scores recomputed"
      - from: OPEN
        to: FAILED
        trigger: "POST /api/v1/audit-cases/{id}/record-outcome with outcome=FAILED"
        actor: Auditor
        preconditions:
          - "Caller X-User-ID == audit_case.auditor_user_id (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "outcome_recorded_at := current logical clock"
          - "Audited Certification -> REVOKED (only producer of REVOKED)"
          - "Certification revocation suspends the Supplier, which withdraws its INVITED/BID_SUBMITTED BidderInvitations, each withdrawal recomputing its SourcingEvent.diverse_bid_count"
          - "Supplier risk scores recomputed (FAILED term +40)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: goal-create-stale-business-unit
    parent_entity: BusinessUnit
    write_endpoint: "POST /api/v1/business-units/{id}/goals"
    occ_field: "expected_business_unit_version"
    description: |
      Creating a ProgramGoal against a BusinessUnit whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just created a goal for the same
      (cert_category, fiscal_year) key — which legitimately supersedes the
      prior DRAFT under the goal-supersession rule — and the current writer's
      view of the business unit is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: diverse_spend_attribution
    trigger: "Scorecard generation (POST /api/v1/business-units/{id}/scorecards) and scorecard recompute"
    algorithm: aggregation
    formula: |
      period_range("YYYY-Qn") = inclusive calendar quarter date range
        (Q1 = Jan 1..Mar 31, Q2 = Apr 1..Jun 30, Q3 = Jul 1..Sep 30, Q4 = Oct 1..Dec 31)
      basis_date(r) = r.transaction_date if attribution_basis == ACCRUAL else r.payment_date
      input_set = SpendRecords r with r.business_unit_id == scorecard.business_unit_id,
                  r.status == POSTED, basis_date(r) inside period_range (inclusive)
      total_spend_cents = sum(r.amount_cents over input_set)
      For each r in input_set, r is diverse-attributable iff there EXISTS Certification c with
        c.supplier_id == r.supplier_id,
        c.status IN {VERIFIED, EXPIRED}      (REVOKED never qualifies; REJECTED/INFO_REQUESTED/etc never qualify),
        c.valid_from <= basis_date(r) <= c.valid_to   (closed window — boundary day covered)
      direct_diverse_spend_cents = sum(r.amount_cents over attributable r)
      spend_by_category[c.cert_type] += r.amount_cents for the covering c;
        if multiple covering certs exist for r, attribute to the cert whose valid_from is latest;
        tie-break (identical valid_from): Certification.created_at ASC
    input_set: "POSTED SpendRecords of the BU whose basis date falls in the scorecard period; VOIDED excluded"
    precision: "integer cents; no rounding"
    variants:
      - name: ACCRUAL
        when: "scorecard.attribution_basis == ACCRUAL (default corporate reporting basis)"
        difference: "Period membership and certification-window coverage are evaluated on transaction_date"
      - name: CASH
        when: "scorecard.attribution_basis == CASH (government/cash-basis customer reports)"
        difference: "Period membership and certification-window coverage are evaluated on payment_date — identical records can yield different totals"

  - name: tier2_spend_aggregation
    trigger: "Tier2Report creation and PUT line replacement"
    algorithm: nested_rounding
    formula: |
      For each line: allocated_cents = round_half_up(gross_subcontract_cents * diverse_share_pct / 100)
        — ROUND PER LINE FIRST (pinned order), then aggregate.
      total_subcontracted_cents = sum(gross_subcontract_cents over lines)
      total_diverse_tier2_cents = sum(allocated_cents over lines)
      (Sum-then-round would give a different cent total; the pinned order is per-line-round-first.)
    input_set: "The report's current lines array"
    precision: "allocated_cents integer cents, round_half_up; diverse_share_pct given with exactly 2 decimals"
    variants: []

  - name: scorecard_attainment_rating
    trigger: "Scorecard generation and recompute, after diverse_spend_attribution and tier2 roll-up"
    algorithm: weighted_scoring
    formula: |
      Goal selection: the unique ProgramGoal with business_unit_id == scorecard.business_unit_id,
        cert_category == ALL, fiscal_year == year of the period, status == PUBLISHED.
        (Supersession guarantees at most one.) None found -> attainment_pct = null, rating = NO_GOAL, goal_id = null.
      tier2_diverse_spend_cents = sum(total_diverse_tier2_cents over Tier2Reports with
        business_unit_id == BU, reporting_period == scorecard.reporting_period, status == APPROVED)
      effective_diverse = direct_diverse_spend_cents + (goal.include_tier2 ? tier2_diverse_spend_cents : 0)
      If goal.goal_type == PERCENT_OF_SPEND:
        actual_pct = (total_spend_cents == 0) ? 0.00 : round_half_up(100 * effective_diverse / total_spend_cents, 2)
        attainment_pct = round_half_up(100 * actual_pct / goal.target_value, 2)
      If goal.goal_type == ABSOLUTE_AMOUNT:
        attainment_pct = round_half_up(100 * effective_diverse / goal.target_value, 2)
      attainment_pct = min(attainment_pct, 999.99)   # display cap
      Rating bands on attainment_pct:
        >= 110.00 -> EXCEEDS
        >= 100.00 -> MEETS      (exactly 100.00 is MEETS, not EXCEEDS)
        >=  80.00 -> NEAR
        else      -> BELOW
    input_set: "Scorecard computed totals + the selected PUBLISHED goal + APPROVED tier-2 reports for the BU/period"
    precision: "2 decimal places, round_half_up, applied at each pinned step in the order written"
    constants:
      EXCEEDS_BAND: 110.00
      MEETS_BAND: 100.00
      NEAR_BAND: 80.00
      ATTAINMENT_CAP: 999.99
    variants: []

  - name: supplier_risk_score
    trigger: "Recomputed on: audit outcome recorded, certification EXPIRED sweep, certification INFO_REQUESTED, audit case opened"
    algorithm: weighted_scoring
    formula: |
      failed_audits    = count(AuditCase: supplier_id == s.id, status == FAILED)
      open_audits      = count(AuditCase: supplier_id == s.id, status == OPEN)
      expired_unrenewed = count(Certification c: c.supplier_id == s.id, c.status == EXPIRED,
                                AND no other Certification of same cert_type with status VERIFIED)
      info_requested   = count(Certification: supplier_id == s.id, status == INFO_REQUESTED)
      risk_score_standard     = min(100, 40*failed_audits + 10*expired_unrenewed)
      risk_score_conservative = min(100, 40*failed_audits + 10*expired_unrenewed
                                       + 15*open_audits + 5*info_requested)
    input_set: "AuditCases and Certifications of the supplier, all statuses as filtered above"
    precision: "integer, capped at 100"
    constants:
      FAILED_AUDIT_POINTS: 40
      EXPIRED_UNRENEWED_POINTS: 10
      OPEN_AUDIT_POINTS: 15
      INFO_REQUESTED_POINTS: 5
      SCORE_CAP: 100
    variants:
      - name: STANDARD
        when: "Shown to business units on the supplier record (confirmed findings only)"
        difference: "Counts FAILED audits and expired-unrenewed certifications only"
      - name: CONSERVATIVE
        when: "Used by the compliance office for audit sampling"
        difference: "Additionally counts OPEN audit cases (+15) and INFO_REQUESTED certifications (+5) — identical supplier data yields a higher-or-equal score"

  - name: certification_expiration_sweep
    trigger: "POST /api/v1/_clock/set_current_utc"
    algorithm: threshold
    formula: |
      For each Certification with status == VERIFIED:
        if valid_to < new_clock_date (date comparison, UTC): status -> EXPIRED
        if valid_to == new_clock_date: remains VERIFIED (closed window, boundary day covered)
      Then for each DevelopmentEngagement with status == ENROLLED:
        if start_date <= new_clock_date: status -> ACTIVE
    input_set: "All VERIFIED certifications; all ENROLLED engagements"
    precision: "date granularity (UTC date of the clock timestamp)"
    variants: []

  - name: inclusion_compliance_check
    trigger: "POST /api/v1/sourcing-events/{id}/award (unless waiver supplied by DiversityAdmin)"
    algorithm: threshold
    formula: |
      diverse_bid_count = count(BidderInvitation i: i.sourcing_event_id == e.id,
                                i.status == BID_SUBMITTED,
                                supplier(i).diverse_eligible == true at current clock)
      Pass iff diverse_bid_count >= required_diverse_bidders   (exactly equal passes)
    input_set: "Invitations of the event in BID_SUBMITTED whose supplier is currently diverse-eligible"
    precision: "integer count"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles; ownership/scope clauses on the endpoint (PrimeContact owns report, BusinessUnitLead owns BU, Auditor owns case, waiver restricted to DiversityAdmin)"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path ids and request-body foreign keys reference existing resources (left-to-right in path, then body fields)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition/action is defined (includes ERR_CERT_NOT_REVIEWABLE for certification review actions, ERR_REPORT_NOT_EDITABLE for PUT lines outside DRAFT/RETURNED, ERR_SCORECARD_LOCKED for recompute of PUBLISHED scorecards)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition and state-gated endpoints"

  - priority: 5
    category: business_safety
    check: "Segregation of duties and supplier eligibility: certifier != submitter and auditor != certifier and goal publisher != creator (ERR_SOD_VIOLATION); award winner / invitee / tier-2 line supplier eligibility (ERR_SUPPLIER_NOT_ELIGIBLE); self-cert submission inside 90-day audit-failure cooling-off (ERR_AUDIT_COOLING_OFF); tier-2 report for non-prime supplier (ERR_PRIME_ONLY); audit target certification must be cert_type SELF_CERT (ERR_CERT_NOT_SELF_CERT)"
    error_id: "ERR_SOD_VIOLATION | ERR_SUPPLIER_NOT_ELIGIBLE | ERR_AUDIT_COOLING_OFF | ERR_PRIME_ONLY | ERR_CERT_NOT_SELF_CERT"
    http_status: 409
    applies_to: "verify/reject certification, create audit case, publish goal, award/invite, create tier-2 report, submit SELF_CERT certification"

  - priority: 6
    category: business_constraint
    check: "Uniqueness, overlap and quota constraints: tax_id unique (ERR_DUPLICATE_TAX_ID); one invitation per (event, supplier) (ERR_DUPLICATE_INVITATION); one OPEN audit per certification (ERR_AUDIT_ALREADY_OPEN); certification window overlap on verify (ERR_CERT_WINDOW_OVERLAP); development engagement half-open window + 30-day buffer overlap (ERR_ENGAGEMENT_OVERLAP); sourcing award inclusion quorum diverse_bid_count >= required_diverse_bidders unless waived (ERR_INCLUSION_SHORTFALL)"
    error_id: "ERR_DUPLICATE_TAX_ID | ERR_DUPLICATE_INVITATION | ERR_AUDIT_ALREADY_OPEN | ERR_CERT_WINDOW_OVERLAP | ERR_ENGAGEMENT_OVERLAP | ERR_INCLUSION_SHORTFALL"
    http_status: 409
    applies_to: "supplier create, invitation create, audit create, certification verify, engagement create"

  - priority: 7
    category: business_temporal
    check: "Time-window validity at action time: certification verify requires valid_to >= current clock date (ERR_CERT_WINDOW_EXPIRED)"
    error_id: ERR_CERT_WINDOW_EXPIRED
    http_status: 409
    applies_to: "certification verify"

  - priority: 8
    category: business_fiscal
    check: "Money/quantity limits: award_amount_cents <= estimated_value_cents (ERR_AWARD_ABOVE_LIMIT); structural field constraints — amount_cents > 0, gross_subcontract_cents > 0, 0 < diverse_share_pct <= 100.00, target_value in range per goal_type, valid_to >= valid_from, end_date > start_date, reporting_period matches 'YYYY-Qn', capacity scores 0..100, required fields present, enum members valid (ERR_INVALID_REQUEST)"
    error_id: "ERR_AWARD_ABOVE_LIMIT | ERR_INVALID_REQUEST"
    http_status: "409 | 400"
    applies_to: "create/write endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Business units ---
  - method: POST
    path: "/api/v1/business-units"
    description: "Create a business unit"
    roles: [DiversityAdmin]
    code: 201
    input: [name, code, lead_user_id, "inclusion_min_diverse_bidders?"]
    output: BusinessUnit
    side_effects: ["lifetime counters initialized to 0; version=1"]

  - method: GET
    path: "/api/v1/business-units/{id}"
    description: "Get a business unit (includes computed lifetime spend counters)"
    roles: [DiversityAdmin, DiversityAnalyst, BusinessUnitLead, Auditor]
    code: 200
    input: []
    output: BusinessUnit
    side_effects: []

  # --- Suppliers ---
  - method: POST
    path: "/api/v1/suppliers"
    description: "Register a supplier (diverse, prime, or both)"
    roles: [DiversityAdmin, DiversityAnalyst]
    code: 201
    input: [legal_name, tax_id, kind, contact_email]
    output: Supplier
    side_effects: ["status=REGISTERED; diverse_eligible=false; risk scores 0"]

  - method: GET
    path: "/api/v1/suppliers/{id}"
    description: "Get a supplier (includes diverse_eligible and both risk score variants)"
    roles: [DiversityAdmin, DiversityAnalyst, BusinessUnitLead, Auditor, PrimeContact]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  - method: POST
    path: "/api/v1/suppliers/{id}/suspend"
    description: "Suspend a supplier; withdraws its INVITED/BID_SUBMITTED invitations and recomputes event diverse_bid_count"
    roles: [DiversityAdmin]
    code: 200
    input: []
    output: Supplier
    side_effects:
      - "Supplier ACTIVE -> SUSPENDED"
      - "BidderInvitations in INVITED or BID_SUBMITTED -> WITHDRAWN"
      - "Owning SourcingEvent.diverse_bid_count recomputed per withdrawal"
      - "increments Supplier.version by 1"

  - method: POST
    path: "/api/v1/suppliers/{id}/reinstate"
    description: "Reinstate a suspended supplier (blocked while an audit case is OPEN)"
    roles: [DiversityAdmin]
    code: 200
    input: []
    output: Supplier
    side_effects: ["Supplier SUSPENDED -> ACTIVE; diverse_eligible recomputed; increments Supplier.version by 1"]

  # --- Certifications ---
  - method: POST
    path: "/api/v1/suppliers/{id}/certifications"
    description: "Submit a certification for review; submitted_by_user_id := caller. SELF_CERT submissions are rejected during the 90-day cooling-off after a FAILED audit"
    roles: [DiversityAdmin, DiversityAnalyst]
    code: 201
    input: [cert_type, certifying_body, certificate_number, valid_from, valid_to]
    output: Certification
    side_effects: ["status=SUBMITTED; submitted_by_user_id set from X-User-ID"]

  - method: GET
    path: "/api/v1/suppliers/{id}/certifications"
    description: "List certifications of a supplier"
    roles: [DiversityAdmin, DiversityAnalyst, BusinessUnitLead, Auditor, PrimeContact]
    code: 200
    input: ["status?", "cert_type?"]
    output: Certification[]
    side_effects: []

  - method: POST
    path: "/api/v1/certifications/{id}/begin-review"
    description: "Move certification SUBMITTED -> UNDER_REVIEW"
    roles: [DiversityAdmin, DiversityAnalyst]
    code: 200
    input: []
    output: Certification
    side_effects: ["increments Certification.version by 1"]

  - method: POST
    path: "/api/v1/certifications/{id}/request-info"
    description: "Move certification UNDER_REVIEW -> INFO_REQUESTED with a note"
    roles: [DiversityAdmin, DiversityAnalyst]
    code: 200
    input: [note]
    output: Certification
    side_effects: ["review_note := note; supplier risk scores recomputed (CONSERVATIVE info-requested term); increments Certification.version by 1"]

  - method: POST
    path: "/api/v1/certifications/{id}/resubmit"
    description: "Move certification INFO_REQUESTED -> SUBMITTED with corrected fields"
    roles: [DiversityAdmin, DiversityAnalyst]
    code: 200
    input: [certificate_number, valid_from, valid_to]
    output: Certification
    side_effects: ["fields replaced; submitted_by_user_id := caller; increments Certification.version by 1"]

  - method: POST
    path: "/api/v1/certifications/{id}/verify"
    description: "Verify a certification (SoD: caller != submitter). Checks window-not-expired and same-type window overlap"
    roles: [DiversityAdmin, DiversityAnalyst]
    code: 200
    input: []
    output: Certification
    side_effects:
      - "Certification UNDER_REVIEW -> VERIFIED; verified_by_user_id := caller"
      - "First verified certification: Supplier REGISTERED -> ACTIVE"
      - "supplier.diverse_eligible recomputed; SourcingEvent.diverse_bid_count recomputed where eligibility changed"
      - "increments Certification.version by 1"

  - method: POST
    path: "/api/v1/certifications/{id}/reject"
    description: "Reject a certification under review (SoD: caller != submitter)"
    roles: [DiversityAdmin, DiversityAnalyst]
    code: 200
    input: [reason]
    output: Certification
    side_effects: ["Certification UNDER_REVIEW -> REJECTED; increments Certification.version by 1"]

  # --- Spend records ---
  - method: POST
    path: "/api/v1/spend-records"
    description: "Import a spend record"
    roles: [DiversityAnalyst]
    code: 201
    input: [supplier_id, business_unit_id, amount_cents, transaction_date, payment_date, "po_number?"]
    output: SpendRecord
    side_effects:
      - "status=POSTED"
      - "BusinessUnit.lifetime_imported_spend_cents += amount_cents"
      - "increments BusinessUnit.version by 1"

  - method: GET
    path: "/api/v1/spend-records"
    description: "List spend records with filters and pagination"
    roles: [DiversityAdmin, DiversityAnalyst, Auditor]
    code: 200
    input: ["supplier_id?", "business_unit_id?", "status?", "limit?", "offset?"]
    output: SpendRecord[]
    side_effects: []

  - method: GET
    path: "/api/v1/spend-records/{id}"
    description: "Get a spend record"
    roles: [DiversityAdmin, DiversityAnalyst, Auditor]
    code: 200
    input: []
    output: SpendRecord
    side_effects: []

  - method: POST
    path: "/api/v1/spend-records/{id}/void"
    description: "Void a posted spend record (compensating action; snapshot scorecards unchanged)"
    roles: [DiversityAnalyst]
    code: 200
    input: []
    output: SpendRecord
    side_effects:
      - "SpendRecord POSTED -> VOIDED"
      - "BusinessUnit.lifetime_voided_spend_cents += amount_cents"
      - "increments BusinessUnit.version by 1"

  # --- Tier-2 reports ---
  - method: POST
    path: "/api/v1/tier-2-reports"
    description: "Prime creates a DRAFT tier-2 report; per-line allocated_cents and totals computed per tier2_spend_aggregation"
    roles: [PrimeContact]
    code: 201
    input: [prime_supplier_id, business_unit_id, reporting_period, lines]
    output: Tier2Report
    side_effects: ["status=DRAFT; totals computed (per-line round_half_up then sum)"]

  - method: GET
    path: "/api/v1/tier-2-reports"
    description: "List tier-2 reports with filters and pagination"
    roles: [DiversityAdmin, DiversityAnalyst, Auditor, PrimeContact]
    code: 200
    input: ["prime_supplier_id?", "business_unit_id?", "reporting_period?", "status?"]
    output: Tier2Report[]
    side_effects: []

  - method: GET
    path: "/api/v1/tier-2-reports/{id}"
    description: "Get a tier-2 report"
    roles: [DiversityAdmin, DiversityAnalyst, Auditor, PrimeContact]
    code: 200
    input: []
    output: Tier2Report
    side_effects: []

  - method: PUT
    path: "/api/v1/tier-2-reports/{id}"
    description: "Replace lines while DRAFT or RETURNED (ERR_REPORT_NOT_EDITABLE otherwise); totals recomputed"
    roles: [PrimeContact]
    code: 200
    input: [lines]
    output: Tier2Report
    side_effects: ["lines replaced; totals recomputed; increments Tier2Report.version by 1"]

  - method: POST
    path: "/api/v1/tier-2-reports/{id}/submit"
    description: "Submit a DRAFT or RETURNED report (owner only)"
    roles: [PrimeContact]
    code: 200
    input: []
    output: Tier2Report
    side_effects: ["status -> SUBMITTED; submitted_by_user_id := caller; increments Tier2Report.version by 1"]

  - method: POST
    path: "/api/v1/tier-2-reports/{id}/approve"
    description: "Approve a SUBMITTED report after line-supplier eligibility checks; supersedes prior APPROVED report for the same prime+period"
    roles: [DiversityAdmin]
    code: 200
    input: []
    output: Tier2Report
    side_effects:
      - "status SUBMITTED -> APPROVED; reviewed_by_user_id := caller"
      - "Prior APPROVED report for same (prime_supplier_id, reporting_period) -> SUPERSEDED"
      - "increments Tier2Report.version by 1"

  - method: POST
    path: "/api/v1/tier-2-reports/{id}/return"
    description: "Return a SUBMITTED report to the prime for correction"
    roles: [DiversityAdmin, DiversityAnalyst]
    code: 200
    input: [note]
    output: Tier2Report
    side_effects: ["status SUBMITTED -> RETURNED; increments Tier2Report.version by 1"]

  # --- Program goals ---
  - method: POST
    path: "/api/v1/business-units/{id}/goals"
    description: "Create a DRAFT goal for a BU (OCC: expected_business_unit_version required). A new DRAFT supersedes any existing DRAFT with the same (cert_category, fiscal_year)"
    roles: [DiversityAdmin]
    code: 201
    input: [fiscal_year, cert_category, goal_type, target_value, "include_tier2?", expected_business_unit_version]
    output: ProgramGoal
    side_effects:
      - "status=DRAFT; created_by_user_id := caller"
      - "Existing DRAFT goal with same (business_unit_id, cert_category, fiscal_year) -> SUPERSEDED"
      - "increments BusinessUnit.version by 1"

  - method: GET
    path: "/api/v1/business-units/{id}/goals"
    description: "List goals of a business unit"
    roles: [DiversityAdmin, DiversityAnalyst, BusinessUnitLead, Auditor]
    code: 200
    input: ["fiscal_year?", "status?"]
    output: ProgramGoal[]
    side_effects: []

  - method: POST
    path: "/api/v1/goals/{id}/publish"
    description: "Publish a DRAFT goal (SoD: caller != creator); supersedes the currently PUBLISHED goal for the same key"
    roles: [DiversityAdmin]
    code: 200
    input: []
    output: ProgramGoal
    side_effects: ["status DRAFT -> PUBLISHED; prior PUBLISHED same key -> SUPERSEDED; increments ProgramGoal.version by 1"]

  # --- Scorecards ---
  - method: POST
    path: "/api/v1/business-units/{id}/scorecards"
    description: "Generate a point-in-time scorecard snapshot for a quarter under ACCRUAL or CASH basis"
    roles: [DiversityAdmin, DiversityAnalyst]
    code: 201
    input: [reporting_period, attribution_basis]
    output: Scorecard
    side_effects: ["Runs diverse_spend_attribution, tier-2 roll-up, scorecard_attainment_rating; status=GENERATED"]

  - method: GET
    path: "/api/v1/business-units/{id}/scorecards"
    description: "List scorecards of a business unit"
    roles: [DiversityAdmin, DiversityAnalyst, BusinessUnitLead, Auditor]
    code: 200
    input: ["reporting_period?", "status?"]
    output: Scorecard[]
    side_effects: []

  - method: GET
    path: "/api/v1/scorecards/{id}"
    description: "Get a scorecard"
    roles: [DiversityAdmin, DiversityAnalyst, BusinessUnitLead, Auditor]
    code: 200
    input: []
    output: Scorecard
    side_effects: []

  - method: GET
    path: "/api/v1/scorecards"
    description: "List scorecards across business units with filters and pagination"
    roles: [DiversityAdmin, DiversityAnalyst, BusinessUnitLead, Auditor]
    code: 200
    input: ["business_unit_id?", "goal_id?", "reporting_period?", "status?"]
    output: Scorecard[]
    side_effects: []

  - method: POST
    path: "/api/v1/scorecards/{id}/recompute"
    description: "Recompute a GENERATED scorecard from current underlying data (ERR_SCORECARD_LOCKED when PUBLISHED)"
    roles: [DiversityAdmin, DiversityAnalyst]
    code: 200
    input: []
    output: Scorecard
    side_effects: ["All computed fields refreshed under the stored attribution_basis; increments Scorecard.version by 1"]

  - method: POST
    path: "/api/v1/scorecards/{id}/publish"
    description: "Publish (lock) a GENERATED scorecard for customer/government reporting"
    roles: [DiversityAdmin]
    code: 200
    input: []
    output: Scorecard
    side_effects: ["status GENERATED -> PUBLISHED; increments Scorecard.version by 1"]

  # --- Sourcing events & invitations ---
  - method: POST
    path: "/api/v1/sourcing-events"
    description: "Create a sourcing event (required_diverse_bidders defaults to the BU's inclusion_min_diverse_bidders)"
    roles: [BusinessUnitLead, DiversityAdmin]
    code: 201
    input: [business_unit_id, title, estimated_value_cents, "required_diverse_bidders?"]
    output: SourcingEvent
    side_effects: ["status=DRAFT; diverse_bid_count=0"]

  - method: GET
    path: "/api/v1/sourcing-events"
    description: "List sourcing events with filters and pagination"
    roles: [DiversityAdmin, DiversityAnalyst, BusinessUnitLead, Auditor]
    code: 200
    input: ["business_unit_id?", "status?"]
    output: SourcingEvent[]
    side_effects: []

  - method: GET
    path: "/api/v1/sourcing-events/{id}"
    description: "Get a sourcing event (includes computed diverse_bid_count)"
    roles: [DiversityAdmin, DiversityAnalyst, BusinessUnitLead, Auditor]
    code: 200
    input: []
    output: SourcingEvent
    side_effects: []

  - method: POST
    path: "/api/v1/sourcing-events/{id}/open"
    description: "Open a DRAFT event for bidding"
    roles: [BusinessUnitLead, DiversityAdmin]
    code: 200
    input: []
    output: SourcingEvent
    side_effects: ["status DRAFT -> OPEN; increments SourcingEvent.version by 1"]

  - method: POST
    path: "/api/v1/sourcing-events/{id}/award"
    description: "Award an OPEN event. Inclusion check (diverse_bid_count >= required_diverse_bidders) unless a waiver reason is supplied by DiversityAdmin"
    roles: [BusinessUnitLead, DiversityAdmin]
    code: 200
    input: [award_supplier_id, award_amount_cents, "inclusion_waiver_reason?"]
    output: SourcingEvent
    side_effects:
      - "status OPEN -> AWARDED"
      - "Winning invitation -> WON; other BID_SUBMITTED -> LOST; INVITED -> NO_RESPONSE"
      - "increments SourcingEvent.version by 1"

  - method: POST
    path: "/api/v1/sourcing-events/{id}/cancel"
    description: "Cancel a DRAFT or OPEN event; INVITED invitations of an OPEN event become WITHDRAWN"
    roles: [BusinessUnitLead, DiversityAdmin]
    code: 200
    input: []
    output: SourcingEvent
    side_effects: ["status -> CANCELLED; INVITED invitations -> WITHDRAWN; increments SourcingEvent.version by 1"]

  - method: POST
    path: "/api/v1/sourcing-events/{id}/invitations"
    description: "Invite a supplier to an OPEN event (rejects SUSPENDED suppliers and duplicate invitations)"
    roles: [BusinessUnitLead, DiversityAdmin]
    code: 201
    input: [supplier_id]
    output: BidderInvitation
    side_effects: ["status=INVITED"]

  - method: GET
    path: "/api/v1/sourcing-events/{id}/invitations"
    description: "List invitations of a sourcing event"
    roles: [DiversityAdmin, DiversityAnalyst, BusinessUnitLead, Auditor]
    code: 200
    input: ["status?"]
    output: BidderInvitation[]
    side_effects: []

  - method: GET
    path: "/api/v1/suppliers/{id}/invitations"
    description: "List invitations received by a supplier"
    roles: [DiversityAdmin, DiversityAnalyst, BusinessUnitLead, Auditor]
    code: 200
    input: ["status?"]
    output: BidderInvitation[]
    side_effects: []

  - method: POST
    path: "/api/v1/invitations/{id}/respond"
    description: "Record a bid response (BID_SUBMITTED or DECLINED) for an INVITED invitation on an OPEN event"
    roles: [BusinessUnitLead, DiversityAdmin]
    code: 200
    input: [response]
    output: BidderInvitation
    side_effects: ["status INVITED -> BID_SUBMITTED | DECLINED; recomputes owning SourcingEvent.diverse_bid_count; increments BidderInvitation.version by 1"]

  # --- Development engagements ---
  - method: POST
    path: "/api/v1/suppliers/{id}/development-engagements"
    description: "Enroll a supplier in a development track; enforces half-open window + 30-day buffer against the supplier's other ENROLLED/ACTIVE engagements"
    roles: [DiversityAdmin, DiversityAnalyst]
    code: 201
    input: [track, start_date, end_date, mentor_name, capacity_score_before]
    output: DevelopmentEngagement
    side_effects: ["status=ENROLLED (becomes ACTIVE via clock sweep when start_date is reached)"]

  - method: GET
    path: "/api/v1/suppliers/{id}/development-engagements"
    description: "List development engagements of a supplier"
    roles: [DiversityAdmin, DiversityAnalyst, Auditor]
    code: 200
    input: ["status?"]
    output: DevelopmentEngagement[]
    side_effects: []

  - method: POST
    path: "/api/v1/development-engagements/{id}/complete"
    description: "Complete an ACTIVE engagement with an exit capacity score"
    roles: [DiversityAdmin, DiversityAnalyst]
    code: 200
    input: [capacity_score_after]
    output: DevelopmentEngagement
    side_effects: ["status ACTIVE -> COMPLETED; improvement := after - before; increments DevelopmentEngagement.version by 1"]

  - method: POST
    path: "/api/v1/development-engagements/{id}/withdraw"
    description: "Withdraw an ENROLLED or ACTIVE engagement"
    roles: [DiversityAdmin, DiversityAnalyst]
    code: 200
    input: []
    output: DevelopmentEngagement
    side_effects: ["status -> WITHDRAWN; increments DevelopmentEngagement.version by 1"]

  # --- Audit cases ---
  - method: POST
    path: "/api/v1/audit-cases"
    description: "Open a data-quality audit on a VERIFIED SELF_CERT certification (SoD: auditor != cert verifier; one OPEN audit per certification)"
    roles: [Auditor]
    code: 201
    input: [supplier_id, certification_id, reason]
    output: AuditCase
    side_effects: ["status=OPEN; auditor_user_id := caller; supplier risk scores recomputed (CONSERVATIVE open-audit term)"]

  - method: GET
    path: "/api/v1/audit-cases"
    description: "List audit cases with filters and pagination"
    roles: [DiversityAdmin, DiversityAnalyst, Auditor]
    code: 200
    input: ["supplier_id?", "certification_id?", "status?"]
    output: AuditCase[]
    side_effects: []

  - method: GET
    path: "/api/v1/audit-cases/{id}"
    description: "Get an audit case"
    roles: [DiversityAdmin, DiversityAnalyst, Auditor]
    code: 200
    input: []
    output: AuditCase
    side_effects: []

  - method: POST
    path: "/api/v1/audit-cases/{id}/record-outcome"
    description: "Record CONFIRMED or FAILED for an OPEN audit (owning auditor only). FAILED revokes the certification, suspends the supplier, withdraws its invitations, recomputes event counts and risk scores"
    roles: [Auditor]
    code: 200
    input: [outcome]
    output: AuditCase
    side_effects:
      - "status OPEN -> CONFIRMED | FAILED; outcome_recorded_at := clock"
      - "FAILED: Certification VERIFIED -> REVOKED"
      - "FAILED: Supplier -> SUSPENDED; invitations INVITED/BID_SUBMITTED -> WITHDRAWN; SourcingEvent.diverse_bid_count recomputed per withdrawal"
      - "Supplier risk scores recomputed"

  # --- Logical clock (test-driving endpoint) ---
  - method: POST
    path: "/api/v1/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time before the first call. Fires the certification expiration sweep and the engagement activation sweep at the new date"
    roles: [DiversityAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "certification_expiration_sweep: VERIFIED certs with valid_to < new date -> EXPIRED (valid_to == new date stays VERIFIED)"
      - "engagement activation sweep: ENROLLED engagements with start_date <= new date -> ACTIVE"
      - "supplier.diverse_eligible recomputed where certification status changed; SourcingEvent.diverse_bid_count recomputed where eligibility changed"
      - "supplier risk scores recomputed for suppliers whose certifications expired (expired-unrenewed term)"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role value not a declared role" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted for the endpoint, or ownership/scope clause violated (PrimeContact not the report's prime, BusinessUnitLead not the BU's lead, Auditor not the case owner, waiver supplied by non-DiversityAdmin)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or request-body foreign key references a non-existent resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, malformed date/period, amount_cents <= 0, diverse_share_pct outside (0, 100.00], target_value out of range for goal_type, valid_to < valid_from, end_date <= start_date, capacity score outside 0..100, empty lines on submit" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition/action is not defined from the resource's current state (generic illegal transition; also reinstate with an OPEN audit case)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_business_unit_version does not match the BusinessUnit's current version (OCC)" }
  - { id: ERR_CERT_NOT_REVIEWABLE, http: 409, condition: "Certification review action (begin-review, request-info, resubmit, verify, reject) attempted from a state where it is not defined (e.g., verify an EXPIRED/REVOKED/REJECTED certification)" }
  - { id: ERR_CERT_WINDOW_EXPIRED, http: 409, condition: "Verify attempted with valid_to strictly before the current logical-clock date" }
  - { id: ERR_CERT_WINDOW_OVERLAP, http: 409, condition: "Verify would create two VERIFIED/EXPIRED certifications of the same cert_type for the supplier with overlapping closed [valid_from, valid_to] windows (shared boundary day counts as overlap)" }
  - { id: ERR_CERT_NOT_SELF_CERT, http: 409, condition: "Audit case targets a certification whose cert_type is not SELF_CERT" }
  - { id: ERR_AUDIT_ALREADY_OPEN, http: 409, condition: "An OPEN audit case already exists for the certification" }
  - { id: ERR_AUDIT_COOLING_OFF, http: 409, condition: "SELF_CERT certification submitted within 90 days of a FAILED audit outcome for the supplier" }
  - { id: ERR_SOD_VIOLATION, http: 409, condition: "Segregation of duties violated: verifier equals submitter, auditor equals certification verifier, or goal publisher equals goal creator" }
  - { id: ERR_SUPPLIER_NOT_ELIGIBLE, http: 409, condition: "Award winner lacks a BID_SUBMITTED invitation or is not ACTIVE; invitee is SUSPENDED; tier-2 line supplier is not DIVERSE/BOTH or lacks a covering VERIFIED/EXPIRED certification at period end" }
  - { id: ERR_PRIME_ONLY, http: 409, condition: "Tier-2 report created for a supplier whose kind is not PRIME or BOTH" }
  - { id: ERR_INCLUSION_SHORTFALL, http: 409, condition: "Award without waiver while diverse_bid_count < required_diverse_bidders" }
  - { id: ERR_AWARD_ABOVE_LIMIT, http: 409, condition: "award_amount_cents > estimated_value_cents" }
  - { id: ERR_SCORECARD_LOCKED, http: 409, condition: "Recompute attempted on a PUBLISHED scorecard" }
  - { id: ERR_REPORT_NOT_EDITABLE, http: 409, condition: "PUT lines attempted on a tier-2 report not in DRAFT or RETURNED" }
  - { id: ERR_DUPLICATE_INVITATION, http: 409, condition: "An invitation for the same (sourcing_event, supplier) already exists" }
  - { id: ERR_DUPLICATE_TAX_ID, http: 409, condition: "Supplier created with a tax_id already registered" }
  - { id: ERR_ENGAGEMENT_OVERLAP, http: 409, condition: "New engagement's half-open [start_date, end_date) window overlaps another ENROLLED/ACTIVE engagement of the supplier, or starts less than 30 days after that engagement's end_date" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DiversityAdmin
    description: "Supplier diversity program office administrator; owns configuration, verification decisions, publishing, waivers, suspensions, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/v1/business-units"
      - "POST /api/v1/business-units/{id}/goals"
      - "POST /api/v1/goals/{id}/publish"
      - "POST /api/v1/scorecards/{id}/publish"
      - "POST /api/v1/tier-2-reports/{id}/approve"
      - "POST /api/v1/suppliers/{id}/suspend"
      - "POST /api/v1/suppliers/{id}/reinstate"
      - "POST /api/v1/sourcing-events/{id}/award with inclusion_waiver_reason"
      - "POST /api/v1/_clock/set_current_utc"
    shared_operations:
      - "certification review actions (begin-review, request-info, resubmit, verify, reject) — never on own submissions"
      - "supplier creation, scorecard generation/recompute, sourcing event create/open/award (no waiver)/cancel, invitations, development engagements, tier-2 return"
      - "all GET endpoints"

  - name: DiversityAnalyst
    description: "Program analyst; imports spend, submits and reviews certifications, builds scorecards, manages development engagements"
    identity: opaque
    exclusive_operations:
      - "POST /api/v1/spend-records"
      - "POST /api/v1/spend-records/{id}/void"
    shared_operations:
      - "supplier creation, certification review actions (never on own submissions), scorecard generation/recompute, development engagement create/complete/withdraw, tier-2 return"
      - "GET endpoints for suppliers, certifications, spend, tier-2, scorecards, goals, audit cases, sourcing events"

  - name: BusinessUnitLead
    description: "Business unit sourcing lead; runs sourcing events for the BU whose lead_user_id equals the caller's X-User-ID"
    identity: opaque
    exclusive_operations:
      - "POST /api/v1/sourcing-events, /open, /award (without waiver), /cancel, /invitations, invitation respond — scoped to own BU"
    shared_operations:
      - "GET endpoints for business units, suppliers, certifications, scorecards, goals, sourcing events, invitations"

  - name: PrimeContact
    description: "External prime contractor contact; X-User-ID equals the prime Supplier.id; files and corrects tier-2 reports for that prime only"
    identity: "entity_backed:Supplier"
    exclusive_operations:
      - "POST /api/v1/tier-2-reports (prime_supplier_id must equal X-User-ID)"
      - "PUT /api/v1/tier-2-reports/{id} (owner only)"
      - "POST /api/v1/tier-2-reports/{id}/submit (owner only)"
    shared_operations:
      - "GET /api/v1/tier-2-reports, GET /api/v1/tier-2-reports/{id}, GET /api/v1/suppliers/{id}, GET /api/v1/suppliers/{id}/certifications"

  - name: Auditor
    description: "Compliance auditor; opens data-quality audits on self-certifications and records outcomes; may never audit a certification they verified"
    identity: opaque
    exclusive_operations:
      - "POST /api/v1/audit-cases"
      - "POST /api/v1/audit-cases/{id}/record-outcome (owning auditor only)"
    shared_operations:
      - "GET endpoints for suppliers, certifications, spend, tier-2, scorecards, goals, audit cases, sourcing events"
