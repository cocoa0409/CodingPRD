            - call: "POST /drones/${drone_id}/install-battery"
              payload: { battery_id: "${bat_old}" }
              as: MaintenanceTech
            - call: "POST /customers"
              payload: { name: "Ann", email: "ann@x.com", dropoff_lat: 37.05, dropoff_lon: -122.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
