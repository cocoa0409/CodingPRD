scaffold_corner_design:

  # =========================================================================
  # Entities — creation, defaults, computed/system fields, not-found, FK integrity
  # =========================================================================
  - section: entities
    instances:
      - name: create_apiary_returns_201_with_system_and_default_fields
        claim_type: Creation
        grounds:
          - entities.Apiary
          - endpoints
        distinguishing_aspect: "POST /apiaries with all required fields returns 201; server mints id/created_at/version=1 and computes registration_status=UNREGISTERED, active_colony_count=0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /apiaries"
              payload: { name: "Yard1", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 40 }
              as: ApiaryManager
              captures: { ap_id: $.data.id, v: $.data.version }
          assert:
            - "Apiary.${ap_id}.registration_status == UNREGISTERED"
            - "Apiary.${ap_id}.active_colony_count == 0"
            - "Apiary.${ap_id}.version == 1"

      - name: create_hive_missing_required_apiary_id_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Hive.fields.apiary_id
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /hives without required apiary_id returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /hives"
              payload: { tag: "H1", brood_frames: 5 }
              as: ApiaryManager
              as_user_id: "anything"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_hive_brood_frames_default_zero
        claim_type: Defaults
        grounds:
          - entities.Hive.fields.brood_frames
        distinguishing_aspect: "Omitting brood_frames on POST /hives applies the declared default 0."
        test_recipe:
          setup: ["Apiary CA exists."]
          setup_api_calls:
            - call: "POST /apiaries"
              payload: { name: "CA", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 40 }
              as: ApiaryManager
              captures: { ap_id: $.data.id }
          trigger:
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H1" }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { bf: $.data.brood_frames }
          assert:
            - "Hive.brood_frames == 0"

      - name: hive_create_increments_apiary_active_colony_count
        claim_type: Computed Fields
        grounds:
          - entities.Apiary.fields.active_colony_count
          - endpoints
        distinguishing_aspect: "Creating a hive bumps owning Apiary.active_colony_count from 0 to 1 (derived-field reconciliation on create)."
        test_recipe:
          setup: ["Apiary CA with 0 colonies."]
          setup_api_calls:
            - call: "POST /apiaries"
              payload: { name: "CA", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 40 }
              as: ApiaryManager
              captures: { ap_id: $.data.id }
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H1", brood_frames: 4 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
          trigger:
            - call: "GET /apiaries/${ap_id}"
              payload: {}
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { acc: $.data.active_colony_count }
          assert:
            - "Apiary.${ap_id}.active_colony_count == 1"

      - name: get_hive_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Hive
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /hives/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /hives/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ApiaryManager
              as_user_id: "anything"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: create_hive_unknown_apiary_fk_returns_fk_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Hive.fields.apiary_id
          - errors[ERR_FK_NOT_FOUND]
        distinguishing_aspect: "POST /hives with apiary_id referencing a non-existent apiary returns ERR_FK_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /hives"
              payload: { apiary_id: "00000000-0000-4000-8000-000000000001", tag: "H1", brood_frames: 5 }
              as: ApiaryManager
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FK_NOT_FOUND"

      - name: inspection_immutable_entity_no_version_field
        claim_type: Immutability
        grounds:
          - entities.Inspection
        distinguishing_aspect: "Inspection has common_fields:false — it is append-only with id+created_at only; no update endpoint and no version field exist for it."
        test_recipe:
          setup: ["Apiary CA; Hive H1; one inspection recorded."]
          setup_api_calls:
            - call: "POST /apiaries"
              payload: { name: "CA", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 40 }
              as: ApiaryManager
              captures: { ap_id: $.data.id }
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H1", brood_frames: 5 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { h1_id: $.data.id }
          trigger:
            - call: "POST /hives/${h1_id}/inspections"
              payload: { inspected_at: "2026-01-06T00:00:00Z", mites_per_100_bees: 1.0, brood_frames_observed: 5, honey_frames_observed: 3, queen_seen: true }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { insp_id: $.data.id }
          assert:
            - "Inspection.${insp_id}.id is a server-minted UUID with created_at present"
            - "no PUT/PATCH endpoint exists for Inspection; it carries no version field"

  # =========================================================================
  # State Machines — valid transitions, invalid-from, terminal lockdown, side-effects
  # =========================================================================
  - section: state_machines
    instances:
      - name: registration_approve_pending_to_active_sets_apiary_status
        claim_type: Valid Transition
        grounds:
          - state_machines.StateRegistration.PENDING_to_ACTIVE
          - entities.Apiary.fields.registration_status
        distinguishing_aspect: "Approving a PENDING registration moves it to ACTIVE and sets Apiary.registration_status=ACTIVE (side-effect)."
        test_recipe:
          setup: ["Apiary CA with a PENDING registration; clock 2026-01-06 within effective window."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /apiaries"
              payload: { name: "CA", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 40 }
              as: ApiaryManager
              captures: { ap_id: $.data.id }
            - call: "POST /apiaries/${ap_id}/registrations"
              payload: { registration_number: "CA-001", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z" }
              as: StateApiarist
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /apiaries/${ap_id}/registrations/${reg_id}/approve"
              payload: {}
              as: StateApiarist
              captures: { st: $.data.status }
            - call: "GET /apiaries/${ap_id}"
              payload: {}
              as: StateApiarist
              captures: { ap_st: $.data.registration_status }
          assert:
            - "StateRegistration.${reg_id}.status == ACTIVE"
            - "Apiary.${ap_id}.registration_status == ACTIVE"

      - name: sign_contract_from_signed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.PollinationContract.DRAFT_to_SIGNED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Calling POST /pollination-contracts/{id}/sign on an already-SIGNED contract (not DRAFT) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Contract C1 SIGNED."]
          setup_api_calls:
            - call: "POST /pollination-contracts"
              payload: { grower_name: "A", orchard_state_code: "CA", bloom_start: "2026-02-04T00:00:00Z", bloom_end: "2026-03-06T00:00:00Z", required_strong_hives: 1, max_hives_on_site: 4, base_rate_cents: 20000 }
              as: ContractCoordinator
              captures: { c1_id: $.data.id }
            - call: "POST /pollination-contracts/${c1_id}/sign"
              payload: {}
              as: ContractCoordinator
          trigger:
            - call: "POST /pollination-contracts/${c1_id}/sign"
              payload: {}
              as: ContractCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: requeen_start_before_due_date_returns_too_early
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.RequeenSchedule.SCHEDULED_to_COMPLETED
          - validations[priority=16]
          - errors[ERR_TOO_EARLY]
        distinguishing_aspect: "POST /requeen-schedules/{id}/start before due_date (clock 2026-03-01 < due 2026-04-01) returns ERR_TOO_EARLY (409)."
        test_recipe:
          setup: ["Apiary CA; Hive H1 QUEENLESS; RequeenSchedule due 2026-04-01; clock 2026-03-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /apiaries"
              payload: { name: "CA", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 40 }
              as: ApiaryManager
              captures: { ap_id: $.data.id }
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H1", brood_frames: 5 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { h1_id: $.data.id }
            - call: "POST /hives/${h1_id}/mark-queenless"
              payload: {}
              as: ApiaryManager
              as_user_id: "${ap_id}"
            - call: "POST /hives/${h1_id}/requeen-schedules"
              payload: { due_date: "2026-04-01T00:00:00Z", reason: "QUEENLESS" }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { rq_id: $.data.id }
          trigger:
            - call: "POST /requeen-schedules/${rq_id}/start"
              payload: {}
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TOO_EARLY"

      - name: deadout_is_terminal_no_further_transition
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Hive
          - validations[priority=7]
          - errors[ERR_TERMINAL_STATE]
        distinguishing_aspect: "A DEADOUT hive is terminal on the health axis — re-marking it DEADOUT returns ERR_TERMINAL_STATE (409) and fires no side effects."
        test_recipe:
          setup: ["Apiary CA; Hive H1 DEADOUT."]
          setup_api_calls:
            - call: "POST /apiaries"
              payload: { name: "CA", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 40 }
              as: ApiaryManager
              captures: { ap_id: $.data.id }
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H1", brood_frames: 5 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { h1_id: $.data.id }
            - call: "POST /hives/${h1_id}/deadout"
              payload: {}
              as: ApiaryManager
              as_user_id: "${ap_id}"
          trigger:
            - call: "POST /hives/${h1_id}/deadout"
              payload: {}
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TERMINAL_STATE"

      - name: clock_advance_expires_active_registration
        claim_type: Side Effect Execution
        grounds:
          - state_machines.StateRegistration.ACTIVE_to_EXPIRED
          - endpoints
          - entities.Apiary.fields.registration_status
        distinguishing_aspect: "Advancing the clock to >= expiry_date auto-transitions an ACTIVE registration to EXPIRED and sets Apiary.registration_status=EXPIRED (scheduled side-effect via clock)."
        test_recipe:
          setup: ["Apiary CA with ACTIVE registration expiring 2026-06-01; clock at 2026-01-06."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /apiaries"
              payload: { name: "CA", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 40 }
              as: ApiaryManager
              captures: { ap_id: $.data.id }
            - call: "POST /apiaries/${ap_id}/registrations"
              payload: { registration_number: "CA-001", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2026-06-01T00:00:00Z" }
              as: StateApiarist
              captures: { reg_id: $.data.id }
            - call: "POST /apiaries/${ap_id}/registrations/${reg_id}/approve"
              payload: {}
              as: StateApiarist
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /apiaries/${ap_id}"
              payload: {}
              as: StateApiarist
              captures: { ap_st: $.data.registration_status }
          assert:
            - "Apiary.${ap_id}.registration_status == EXPIRED"

      - name: harvest_void_idempotency_second_void_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.Harvest.RECORDED_to_VOID
          - validations[priority=7]
          - errors[ERR_TERMINAL_STATE]
        distinguishing_aspect: "VOID is terminal for Harvest — voiding an already-VOID harvest a second time returns ERR_TERMINAL_STATE (409); the gross-weight restore is not applied twice."
        test_recipe:
          setup: ["Apiary CA; Hive H1; HoneyLot L1 DRAFT with one RECORDED harvest already VOIDed once."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /apiaries"
              payload: { name: "CA", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 40 }
              as: ApiaryManager
              captures: { ap_id: $.data.id }
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H1", brood_frames: 6 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { h1_id: $.data.id }
            - call: "POST /honey-lots"
              payload: { apiary_id: "${ap_id}", lot_code: "L1", floral_source: "WILDFLOWER" }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /honey-lots/${l1_id}/harvests"
              payload: { hive_id: "${h1_id}", frames_pulled: 4, weight_kg: 12.0 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { hv_id: $.data.id }
            - call: "POST /harvests/${hv_id}/void"
              payload: {}
              as: ApiaryManager
              as_user_id: "${ap_id}"
          trigger:
            - call: "POST /harvests/${hv_id}/void"
              payload: {}
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TERMINAL_STATE"

      - name: treatment_complete_clears_health_to_healthy
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Treatment.ACTIVE_to_COMPLETED
          - entities.Hive.fields.health_status
          - entities.Hive.fields.harvest_blocked_until
        distinguishing_aspect: "Completing the only ACTIVE treatment after its duration sets Treatment.status=COMPLETED and returns Hive.health_status to HEALTHY; harvest block recomputed."
        test_recipe:
          setup: ["Apiary CA; Hive H1 under OXALIC_ACID treatment (dur 1, withdrawal 0); clock advanced past duration."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /apiaries"
              payload: { name: "CA", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 40 }
              as: ApiaryManager
              captures: { ap_id: $.data.id }
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H1", brood_frames: 6 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { h1_id: $.data.id }
            - call: "POST /hives/${h1_id}/treatments"
              payload: { product: "OXALIC_ACID", applied_at: "2026-05-01T00:00:00Z", duration_days: 1 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { tx_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /treatments/${tx_id}/complete"
              payload: {}
              as: ApiaryManager
              as_user_id: "${ap_id}"
            - call: "GET /hives/${h1_id}"
              payload: {}
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { hs: $.data.health_status }
          assert:
            - "Treatment.${tx_id}.status == COMPLETED"
            - "Hive.${h1_id}.health_status == HEALTHY"

      - name: placement_cancel_from_confirmed_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.HivePlacement.PROPOSED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /hive-placements/{id}/cancel is only valid from PROPOSED; calling it on a CONFIRMED placement returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Clock 2026-01-06; Apiary CA ACTIVE-registered; Hive H1 inspected; Contract C1 SIGNED; placement P1 CONFIRMED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /apiaries"
              payload: { name: "CA", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 40 }
              as: ApiaryManager
              captures: { ap_id: $.data.id }
            - call: "POST /apiaries/${ap_id}/registrations"
              payload: { registration_number: "CA-001", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z" }
              as: StateApiarist
              captures: { reg_id: $.data.id }
            - call: "POST /apiaries/${ap_id}/registrations/${reg_id}/approve"
              payload: {}
              as: StateApiarist
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H1", brood_frames: 5 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { h1_id: $.data.id }
            - call: "POST /hives/${h1_id}/inspections"
              payload: { inspected_at: "2026-01-06T00:00:00Z", mites_per_100_bees: 1.0, brood_frames_observed: 5, honey_frames_observed: 3, queen_seen: true }
              as: ApiaryManager
              as_user_id: "${ap_id}"
            - call: "POST /pollination-contracts"
              payload: { grower_name: "A", orchard_state_code: "CA", bloom_start: "2026-02-04T00:00:00Z", bloom_end: "2026-03-06T00:00:00Z", required_strong_hives: 1, max_hives_on_site: 4, base_rate_cents: 20000 }
              as: ContractCoordinator
              captures: { c1_id: $.data.id }
            - call: "POST /pollination-contracts/${c1_id}/sign"
              payload: {}
              as: ContractCoordinator
              captures: { c1_v0: $.data.version }
            - call: "POST /pollination-contracts/${c1_id}/placements"
              payload: { hive_id: "${h1_id}", placement_start: "2026-02-04T00:00:00Z", removal_due: "2026-03-06T00:00:00Z" }
              as: ContractCoordinator
              captures: { p1_id: $.data.id }
            - call: "POST /hive-placements/${p1_id}/confirm"
              payload: { expected_contract_version: "${c1_v0}" }
              as: ContractCoordinator
          trigger:
            - call: "POST /hive-placements/${p1_id}/cancel"
              payload: {}
              as: ContractCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

  # =========================================================================
  # Calculations — boundary / variant correctness not covered in §1.8
  # =========================================================================
  - section: calculations
    instances:
      - name: mite_threshold_just_below_three_no_recommendation
        claim_type: Constants Applied
        grounds:
          - calculations.colony_strength_scoring
          - entities.Inspection.fields.treatment_recommended
        distinguishing_aspect: "mites_per_100_bees==2.9 (< 3.0) yields treatment_recommended=false and no mite penalty applied to inspection_strength."
        test_recipe:
          setup: ["Apiary CA; Hive H1 HEALTHY."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /apiaries"
              payload: { name: "CA", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 40 }
              as: ApiaryManager
              captures: { ap_id: $.data.id }
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H1", brood_frames: 5 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { h1_id: $.data.id }
          trigger:
            - call: "POST /hives/${h1_id}/inspections"
              payload: { inspected_at: "2026-01-06T00:00:00Z", mites_per_100_bees: 2.9, brood_frames_observed: 5, honey_frames_observed: 3, queen_seen: true }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { rec: $.data.treatment_recommended }
            - call: "GET /hives/${h1_id}"
              payload: {}
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { strength: $.data.inspection_strength }
          assert:
            - "Inspection.treatment_recommended == false"
            - "Hive.${h1_id}.inspection_strength == 59"

      - name: inspection_strength_mite_penalty_applied_above_threshold
        claim_type: Correct Result
        grounds:
          - calculations.colony_strength_scoring
          - entities.Hive.fields.inspection_strength
        distinguishing_aspect: "With mite==4.0 (>=3.0), inspection_strength = 5*8 + 3*3 - 25 + 10 = 34 (mite penalty 25 subtracted, queen bonus 10 added)."
        test_recipe:
