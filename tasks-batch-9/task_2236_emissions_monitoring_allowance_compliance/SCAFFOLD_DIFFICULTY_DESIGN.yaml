            - "AllowanceAccount.${acct_id}.holdings_next_vintage_tons == 1.000"
            - "AllowanceAccount.${acct_id}.status == TRUE_UP_LOCKED"
            - "dropping the ENFORCEABLE event's 2-ton debit would give obligation 30, surrendered 25, shortfall 5 and penalty 10 — every downstream figure moves"

  # ===========================================================================
  # RULE 3 — non_linear_state_machine
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: non_linear_monitoring_system_qa_and_calibration_dimensions_move_independently
        grounds:
          - state_machines.MonitoringSystem
          - state_machines.MonitoringSystem.CERTIFIED_to_OUT_OF_CONTROL
          - state_machines.MonitoringSystem.OUT_OF_CONTROL_to_CERTIFIED
          - calculations.daily_calibration_error
          - entities.MonitoringSystem.fields.qa_status
          - entities.MonitoringSystem.fields.cal_status
          - entities.MonitoringSystem.fields.consecutive_failed_calibrations
          - validations[priority=250]
        distinguishing_aspect: |
          PARALLEL DIMENSIONS on MonitoringSystem: cal_status cycles
          CAL_CURRENT -> CAL_FAILED -> CAL_CURRENT -> CAL_FAILED twice while
          qa_status stays pinned at CERTIFIED, and only the SECOND consecutive
          failure couples the two dimensions by driving qa_status to
          OUT_OF_CONTROL — the combined state (OUT_OF_CONTROL, CAL_CURRENT) is
          reachable and is the only one from which re-certification succeeds.
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "one facility with unit U1"
            - "one SO2 CEM, span_value 400.0, calibration_error_spec_pct 2.5, freshly created (RECERTIFICATION_PENDING / CAL_EXPIRED, consecutive_failed_calibrations 0)"
            - "no OperatingHour and no RataTest exist, so the OUT_OF_CONTROL cascade has nothing downstream to touch"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "SO2", system_type: "CEM", span_value: 400.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { cem_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 368.0 }
              as: QAAnalyst
              captures: { cal1_id: $.data.id, v2: $.data.monitoring_system_version_after }
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
              captures: { v3: $.data.version }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${v3}", calibration_utc: "2026-04-01T01:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 374.0 }
              as: QAAnalyst
              captures: { cal2_id: $.data.id, v4: $.data.monitoring_system_version_after }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${v4}", calibration_utc: "2026-04-01T02:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 368.0 }
              as: QAAnalyst
              captures: { cal3_id: $.data.id, v5: $.data.monitoring_system_version_after }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${v5}", calibration_utc: "2026-04-01T03:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 374.0 }
              as: QAAnalyst
              captures: { cal4_id: $.data.id, v6: $.data.monitoring_system_version_after }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${v6}", calibration_utc: "2026-04-01T04:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 375.0 }
              as: QAAnalyst
              captures: { cal5_id: $.data.id, v7: $.data.monitoring_system_version_after }
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
              captures: { blocked_error_id: $.data.error_id }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${v7}", calibration_utc: "2026-04-01T05:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 368.0 }
              as: QAAnalyst
              captures: { cal6_id: $.data.id, v8: $.data.monitoring_system_version_after }
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
              captures: { v9: $.data.version }
          assert:
            - "DailyCalibration.${cal1_id}.span_error_pct_of_span == 2.00 and DailyCalibration.${cal1_id}.result == PASSED"
            - "after trigger 1: MonitoringSystem.${cem_id}.qa_status == RECERTIFICATION_PENDING and MonitoringSystem.${cem_id}.cal_status == CAL_CURRENT"
            - "after trigger 2: MonitoringSystem.${cem_id}.qa_status == CERTIFIED and MonitoringSystem.${cem_id}.cal_status == CAL_CURRENT"
            - "DailyCalibration.${cal2_id}.span_error_pct_of_span == 3.50 and DailyCalibration.${cal2_id}.result == FAILED"
            - "after trigger 3: MonitoringSystem.${cem_id}.cal_status == CAL_FAILED and MonitoringSystem.${cem_id}.qa_status == CERTIFIED  # qa dimension did NOT move"
            - "after trigger 3: MonitoringSystem.${cem_id}.consecutive_failed_calibrations == 1"
            - "DailyCalibration.${cal3_id}.result == PASSED"
            - "after trigger 4: MonitoringSystem.${cem_id}.cal_status == CAL_CURRENT and MonitoringSystem.${cem_id}.consecutive_failed_calibrations == 0  # the counter reset, not merely stalled"
            - "DailyCalibration.${cal4_id}.result == FAILED and after trigger 5 MonitoringSystem.${cem_id}.qa_status == CERTIFIED"
            - "DailyCalibration.${cal5_id}.span_error_pct_of_span == 3.75 and DailyCalibration.${cal5_id}.result == OUT_OF_CONTROL_TRIGGERED"
            - "after trigger 6: MonitoringSystem.${cem_id}.qa_status == OUT_OF_CONTROL and MonitoringSystem.${cem_id}.cal_status == CAL_FAILED"
            - "after trigger 6: MonitoringSystem.${cem_id}.out_of_control_since_utc == 2026-04-01T04:00:00Z"
            - "trigger 7 returns HTTP 409 with error_id == ERR_CALIBRATION_NOT_CURRENT"
            - "after trigger 8: MonitoringSystem.${cem_id}.qa_status == OUT_OF_CONTROL and MonitoringSystem.${cem_id}.cal_status == CAL_CURRENT  # combined state reachable"
            - "after trigger 9: MonitoringSystem.${cem_id}.qa_status == CERTIFIED and MonitoringSystem.${cem_id}.cal_status == CAL_CURRENT"
            - "after trigger 9: MonitoringSystem.${cem_id}.out_of_control_since_utc == null and MonitoringSystem.${cem_id}.bias_adjustment_factor == 1.0"
            - "GET /emissions/monitoring-systems/${cem_id}/daily-calibrations returns 6 rows and none of them carries a version field (DailyCalibration is common_fields false)"

      - name: non_linear_rata_test_cycles_back_to_scheduled_and_bumps_attempt_number
        grounds:
          - state_machines.RataTest.RUNS_RECORDED_to_FAILED
          - state_machines.RataTest.FAILED_to_SCHEDULED
          - state_machines.RataTest.RUNS_RECORDED_to_PASSED
          - calculations.relative_accuracy_and_bias
          - entities.RataTest.fields.attempt_number
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          CYCLE on a DIFFERENT entity than the parallel-dimension instance:
          RataTest walks SCHEDULED -> RUNS_RECORDED -> FAILED -> SCHEDULED with
          attempt_number 1 -> 2, the retained applicable_standard_value proving
          the reschedule is a partial and not a total reset, and the cycle has a
          termination condition — once PASSED, reschedule is refused.
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "unit U1 with dispatch_state ONLINE"
            - "one NOX_RATE CEM (span 0.800) on the unit"
            - "one SCHEDULED RataTest, window [2026-04-03T00:00:00Z, 2026-04-04T00:00:00Z), applicable_standard_value 0.500, attempt_number 1"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "SCR" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "PATCH /emissions/units/${unit_id}/dispatch"
              payload: { dispatch_state: "ONLINE" }
              as: FacilityOperator
              as_user_id: "op_alpha"
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "NOX_RATE", system_type: "CEM", span_value: 0.800, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { nox_sys_id: $.data.id }
            - call: "POST /emissions/monitoring-systems/${nox_sys_id}/rata-tests"
              payload: { window_start_utc: "2026-04-03T00:00:00Z", window_end_utc: "2026-04-04T00:00:00Z", applicable_standard_value: 0.500 }
              as: QAAnalyst
              captures: { rt_id: $.data.id }
          trigger:
            - call: "POST /emissions/rata-tests/${rt_id}/runs"
              payload: { runs: [{ reference_value: 0.262, cems_value: 0.246 }, { reference_value: 0.266, cems_value: 0.236 }, { reference_value: 0.268, cems_value: 0.244 }, { reference_value: 0.270, cems_value: 0.258 }, { reference_value: 0.270, cems_value: 0.238 }, { reference_value: 0.272, cems_value: 0.248 }, { reference_value: 0.274, cems_value: 0.254 }, { reference_value: 0.274, cems_value: 0.246 }, { reference_value: 0.274, cems_value: 0.240 }] }
              as: QAAnalyst
            - call: "POST /emissions/rata-tests/${rt_id}/evaluate"
              payload: { ra_basis: "REFERENCE_MEAN" }
              as: QAAnalyst
            - call: "POST /emissions/rata-tests/${rt_id}/reschedule"
              payload: { window_start_utc: "2026-04-06T00:00:00Z", window_end_utc: "2026-04-07T00:00:00Z" }
              as: QAAnalyst
            - call: "POST /emissions/rata-tests/${rt_id}/runs"
              payload: { runs: [{ reference_value: 0.262, cems_value: 0.248 }, { reference_value: 0.266, cems_value: 0.240 }, { reference_value: 0.268, cems_value: 0.234 }, { reference_value: 0.270, cems_value: 0.252 }, { reference_value: 0.270, cems_value: 0.256 }, { reference_value: 0.272, cems_value: 0.252 }, { reference_value: 0.274, cems_value: 0.240 }, { reference_value: 0.274, cems_value: 0.260 }, { reference_value: 0.274, cems_value: 0.251 }] }
              as: QAAnalyst
            - call: "POST /emissions/rata-tests/${rt_id}/evaluate"
              payload: { ra_basis: "REFERENCE_MEAN" }
              as: QAAnalyst
            - call: "POST /emissions/rata-tests/${rt_id}/reschedule"
              payload: { window_start_utc: "2026-04-08T00:00:00Z", window_end_utc: "2026-04-09T00:00:00Z" }
              as: QAAnalyst
              captures: { terminal_error_id: $.data.error_id }
          assert:
            - "after trigger 1: RataTest.${rt_id}.status == RUNS_RECORDED and RataTest.${rt_id}.run_count == 9"
            - "after trigger 2: RataTest.${rt_id}.relative_accuracy_pct == 10.7 and RataTest.${rt_id}.status == FAILED"
            - "after trigger 2: MonitoringSystem.${nox_sys_id}.qa_status == RECERTIFICATION_PENDING  # never certified, so no demotion applies"
            - "after trigger 3: RataTest.${rt_id}.status == SCHEDULED"
            - "after trigger 3: RataTest.${rt_id}.attempt_number == 2"
            - "after trigger 3: RataTest.${rt_id}.run_count == 0 and RataTest.${rt_id}.reference_mean == null and RataTest.${rt_id}.cems_mean == null"
            - "after trigger 3: RataTest.${rt_id}.mean_difference == null and RataTest.${rt_id}.confidence_coefficient == null and RataTest.${rt_id}.relative_accuracy_pct == null"
            - "after trigger 3: RataTest.${rt_id}.bias_adjustment_factor == 1.0 and RataTest.${rt_id}.ra_basis == REFERENCE_MEAN"
            - "after trigger 3: RataTest.${rt_id}.applicable_standard_value == 0.500  # survives the cycle"
            - "after trigger 3: RataTest.${rt_id}.window_start_utc == 2026-04-06T00:00:00Z"
            - "after trigger 5: RataTest.${rt_id}.cems_mean == 0.2481 and RataTest.${rt_id}.mean_difference == 0.0219"
            - "after trigger 5: RataTest.${rt_id}.relative_accuracy_pct == 10.0 and RataTest.${rt_id}.status == PASSED"
            - "after trigger 5: RataTest.${rt_id}.bias_test_failed == true and RataTest.${rt_id}.bias_adjustment_factor == 1.0883"
            - "after trigger 5: RataTest.${rt_id}.attempt_number == 2  # a successful evaluate does not bump the counter"
            - "trigger 6 returns HTTP 409 with error_id == ERR_INVALID_STATE_TRANSITION and RataTest.${rt_id}.status stays PASSED"

      - name: non_linear_quarterly_report_cycles_rejected_back_to_draft_and_resubmits
        grounds:
          - state_machines.QuarterlyReport.CERTIFIED_to_REJECTED
          - state_machines.QuarterlyReport.REJECTED_to_DRAFT
          - state_machines.QuarterlyReport.SUBMITTED_to_CERTIFIED
          - state_machines.QuarterlyReport.CERTIFIED_to_ACCEPTED
          - entities.QuarterlyReport.fields.resubmission_count
          - entities.ComplianceCertification.fields.status
          - validations[priority=40]
        distinguishing_aspect: |
          BRANCHING PLUS CYCLE on a third entity: the CERTIFIED state forks to
          ACCEPTED or REJECTED, and the REJECTED branch loops the report back to
          DRAFT with resubmission_count 0 -> 1 while clearing
          submitted_by_user_id — which is what lets a DIFFERENT preparer submit
          the second attempt and still satisfy segregation of duties against the
          same designated representative.
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "unit U1 with a CERTIFIED, CAL_CURRENT SO2 CEM (span 400)"
            - "a DRAFT 2026 Q2 report carrying three identical MEASURED CEMS hours (flow 8000000, co2 12.5, so2 220 ppm, nox 0.180, op 1.0)"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "SO2", system_type: "CEM", span_value: 400.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { cem_id: $.data.id, cem_v1: $.data.version }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${cem_v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 368.0 }
              as: QAAnalyst
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/quarterly-reports"
              payload: { year: 2026, quarter: 2 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { q2_id: $.data.id, q2_v1: $.data.version }
            - call: "POST /emissions/units/${unit_id}/operating-hours/bulk"
              payload: { expected_quarterly_report_version: "${q2_v1}", hours: [{ hour_begin_utc: "2026-04-01T00:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }, { hour_begin_utc: "2026-04-01T01:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }, { hour_begin_utc: "2026-04-01T02:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }] }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
          trigger:
            - call: "POST /emissions/quarterly-reports/${q2_id}/validate"
              payload: {}
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
            - call: "POST /emissions/quarterly-reports/${q2_id}/submit"
              payload: { submission_format: "XML_ECMPS" }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { v_sub1: $.data.version }
            - call: "POST /emissions/quarterly-reports/${q2_id}/certifications"
              payload: { expected_quarterly_report_version: "${v_sub1}", statement_text: "I certify under penalty of law that the submitted data are true and complete." }
              as: DesignatedRepresentative
              as_user_id: "dr_1"
              captures: { cert1_id: $.data.id }
            - call: "POST /emissions/quarterly-reports/${q2_id}/disposition"
              payload: { decision: "REJECT", reason: "flow monitor span value inconsistent with the certified configuration" }
              as: RegulatoryReviewer
            - call: "POST /emissions/quarterly-reports/${q2_id}/reopen"
              payload: {}
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
            - call: "POST /emissions/quarterly-reports/${q2_id}/validate"
              payload: {}
              as: EmissionsReportPreparer
              as_user_id: "prep_2"
            - call: "POST /emissions/quarterly-reports/${q2_id}/submit"
              payload: { submission_format: "JSON_ECMPS" }
              as: EmissionsReportPreparer
              as_user_id: "prep_2"
              captures: { v_sub2: $.data.version }
            - call: "POST /emissions/quarterly-reports/${q2_id}/certifications"
              payload: { expected_quarterly_report_version: "${v_sub2}", statement_text: "I certify under penalty of law that the resubmitted data are true and complete." }
              as: DesignatedRepresentative
              as_user_id: "dr_1"
              captures: { cert2_id: $.data.id }
            - call: "POST /emissions/quarterly-reports/${q2_id}/disposition"
              payload: { decision: "ACCEPT" }
              as: RegulatoryReviewer
          assert:
            - "after trigger 1: QuarterlyReport.${q2_id}.status == VALIDATED and QuarterlyReport.${q2_id}.total_so2_lbs == 876.6"
            - "after trigger 1: QuarterlyReport.${q2_id}.total_heat_input_mmbtu == 1666.668 and QuarterlyReport.${q2_id}.total_nox_lbs == 300.0"
            - "after trigger 1: QuarterlyReport.${q2_id}.total_co2_tons == 179.100 and QuarterlyReport.${q2_id}.total_so2_tons == 0.438"
            - "after trigger 2: QuarterlyReport.${q2_id}.status == SUBMITTED and QuarterlyReport.${q2_id}.submitted_by_user_id == prep_1"
            - "after trigger 3: QuarterlyReport.${q2_id}.status == CERTIFIED and Unit.${unit_id}.certified_so2_lbs_ytd == 876.6"
            - "after trigger 3: ComplianceCertification.${cert1_id}.certified_so2_lbs_snapshot == 876.6 and ComplianceCertification.${cert1_id}.status == SIGNED"
            - "after trigger 4: QuarterlyReport.${q2_id}.status == REJECTED and QuarterlyReport.${q2_id}.rejection_reason is the supplied text"
            - "after trigger 4: ComplianceCertification.${cert1_id}.status == REVOKED and Unit.${unit_id}.certified_so2_lbs_ytd == 0.0"
            - "after trigger 5: QuarterlyReport.${q2_id}.status == DRAFT and QuarterlyReport.${q2_id}.resubmission_count == 1"
            - "after trigger 5: QuarterlyReport.${q2_id}.submitted_by_user_id == null and QuarterlyReport.${q2_id}.submission_format == null and QuarterlyReport.${q2_id}.rejection_reason == null"
            - "after trigger 5: QuarterlyReport.${q2_id}.total_so2_lbs == 876.6  # reopening does not discard the hour data"
            - "after trigger 7: QuarterlyReport.${q2_id}.submitted_by_user_id == prep_2 and QuarterlyReport.${q2_id}.submission_format == JSON_ECMPS"
            - "trigger 8 returns HTTP 201 (dr_1 may certify prep_2's submission) and Unit.${unit_id}.certified_so2_lbs_ytd == 876.6"
            - "after trigger 9: QuarterlyReport.${q2_id}.status == ACCEPTED and GET /emissions/quarterly-reports/${q2_id}/certifications returns 2 rows, exactly one SIGNED"

  # ===========================================================================
  # RULE 4 — transitive_cascade
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: cascade_out_of_control_calibration_flips_hours_reverts_report_and_withdraws_event
        grounds:
          - state_machines.MonitoringSystem.CERTIFIED_to_OUT_OF_CONTROL
          - state_machines.QuarterlyReport.VALIDATED_to_DRAFT
          - state_machines.ExcessEmissionEvent.DETECTED_to_WITHDRAWN
          - calculations.daily_calibration_error
          - calculations.monitor_data_availability_pct
          - calculations.quarterly_report_totals
          - calculations.rolling_average_limit_check
        distinguishing_aspect: |
          DEPTH-4 cascade triggered by MonitoringSystem CERTIFIED ->
          OUT_OF_CONTROL: one failing calibration walks calibration -> hour
          data_quality flips -> quarterly-report recompute and VALIDATED ->
          DRAFT demotion -> permit-limit re-evaluation that withdraws an
          already-DETECTED excess-emission event, so link 4 is only reachable
          because links 2 and 3 ran first.
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "unit U1 with a CERTIFIED, CAL_CURRENT SO2 CEM (span 400, spec 2.5, consecutive_failed_calibrations 0)"
            - "a 2026 Q2 report in VALIDATED carrying three identical MEASURED CEMS hours at 00:00 / 01:00 / 02:00 (each so2_mass_lbs 292.2)"
            - "one PermitLimit SO2 LB_PER_HR ROLLING_3_HOUR limit_value 250.0 effective 2026-01-01, already evaluated at anchor 2026-04-01T03:00:00Z and therefore EXCEEDED with one DETECTED ExcessEmissionEvent"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
