      - name: return_closure_waits_for_the_repositioning_leg_to_actually_fly
        claim_type: Violation -> Error
        grounds:
          - validations[priority 75 ERR_REPOSITIONING_LEG_INCOMPLETE]
          - errors.ERR_REPOSITIONING_LEG_INCOMPLETE
          - state_machines.ReturnCondition[CLEARED -> CLOSED]
          - state_machines.LeaseAgreement[TERMINATING -> RETURNED]
        distinguishing_aspect: |
          A repositioning leg that exists, sits on the right lease and terminates at the redelivery
          station is still not enough - it must be COMPLETED. The identical close call is rejected
          with 409 while the leg is SCHEDULED and succeeds the moment it has flown, and only then do
          all four closure side effects land: ReturnCondition CLOSED, lease RETURNED (terminal),
          airframe released to AVAILABLE with assigned_lease_id cleared, and every QUALIFIED
          CrewQualification on the lease REVOKED.
          
