      - call: POST /therapist-licenses/${lic}/review
        payload: { decision: "VERIFIED" }
        as: ComplianceOfficer
        as_user_id: "co-2"
      - call: POST /therapists/${th}/certifications
        payload: { skill_code: "SWEDISH", scope_level: "BASIC", granted_on: "2026-01-01", expires_on: "2027-01-01" }
        as: ComplianceOfficer
        as_user_id: "co-1"
      - call: POST /therapists/${th}/shift-blocks
        payload: { block_type: "AVAILABLE", start_at: "2026-08-09T11:00:00.000Z", end_at: "2026-08-09T18:00:00.000Z" }
        as: SpaCoordinator
      - call: POST /appointments
        payload: { guest_id: "${g1}", treatment_type_id: "${tt_dry}", room_id: "${room_a}", therapist_id: "${th}", start_at: "2026-08-09T11:00:00.000Z" }
        as: SpaCoordinator
        captures: { appt: $.data.id }
      - call: POST /appointments/${appt}/confirm
        payload: {}
        as: SpaCoordinator
      - call: GET /guests/${g1}
        as: SpaCoordinator
        captures: { v_before: $.data.version }
      - call: POST /guests/${g1}/intake-forms
        payload: { expected_guest_version: "${v_before}", condition_codes: ["ACUTE_HYPERTENSION"], medications: ["LISINOPRIL"] }
        as: Guest
        as_user_id: "${g1}"
        captures: { in2: $.data.id }
      - call: POST /intake-forms/${in2}/consent
        payload: { consent_version: "2026.1" }
        as: Guest
        as_user_id: "${g1}"
      - call: POST /intake-forms/${in2}/submit
        payload: {}
        as: Guest
        as_user_id: "${g1}"
      trigger:
      - call: POST /intake-forms/${in2}/screen
        payload: {}
        as: ComplianceOfficer
        as_user_id: "co-3"
      - call: GET /guests/${g1}
        as: SpaCoordinator
      - call: GET /intake-forms/${in1}
        as: SpaCoordinator
      - call: GET /appointments/${appt}
        as: SpaCoordinator
      - call: GET /appointments
        payload: { guest_id: "${g1}", clearance_status: "BLOCKED" }
        as: SpaCoordinator
      - call: GET /guests/${g1}/intake-forms
        payload: { status: "SUPERSEDED" }
        as: ComplianceOfficer
      assert:
      - "the screen response itself returns status SCREENED_FLAGGED with flagged_condition_codes [\"ACUTE_HYPERTENSION\"], screened_by_user_id co-3 and screened_at 2026-08-09T09:00:00.000Z"
      - "the guest read issued immediately afterwards already shows authoritative_intake_form_id ${in2}, screened_condition_codes [\"ACUTE_HYPERTENSION\"] and version ${v_before} + 2 (the second form's create and its screening)"
      - "GET /intake-forms/${in1} already shows status SUPERSEDED: the displacement of the previous authoritative form is not deferred"
      - "GET /appointments/${appt} already shows clearance_status BLOCKED with clearance_block_reason INTAKE_FLAGGED while schedule_status is still CONFIRMED, so the parallel dimensions moved independently inside the screening call"
      - "GET /appointments?guest_id=${g1}&clearance_status=BLOCKED already returns exactly [${appt}] with total_count 1: the list channel sees the cascade with no lag"
      - "GET /guests/${g1}/intake-forms?status=SUPERSEDED already returns exactly [${in1}] with total_count 1"
      - "no clock movement occurred between the screening and any of these five reads, so none of the observations can be explained by a later evaluation instant"
