  - rule_id: non_linear_state_machine
    instances:
      - name: rfp_amendment_cycle_returns_to_delivered_until_round_cap
        grounds:
          - state_machines.RequestForPayment.DELIVERED_to_AMENDMENT_REQUESTED
          - state_machines.RequestForPayment.AMENDMENT_REQUESTED_to_DELIVERED
          - entities.RequestForPayment.fields.amendment_round
          - validations[priority=96]
          - errors[ERR_AMENDMENT_ROUNDS_EXHAUSTED]
        distinguishing_aspect: |
          A genuine cycle, not a forward chain: DELIVERED -> AMENDMENT_REQUESTED -> DELIVERED
          re-enters a state already visited, the loop is bounded by amendment_round rather than by
          the state graph, and the third traversal is refused by a business_constraint rule even
          though the state machine itself still declares the hop.
        test_recipe:
          setup:
            - "Alpha National Bank (routing 021000021) and Beta Trust Bank (routing 021000089) are both LIVE with prefunded position accounts."
            - "Beta owns customer account CUST-BETA-0001 (CORPORATE, baseline 20)."
            - "Alpha raises a request for payment for 5,000,000 cents expiring 2026-08-04T13:00:00Z; the clock stays at 2026-08-03T13:00:00Z throughout so the request never expires."
            - "The request is delivered, amended twice through the AMENDMENT_REQUESTED loop (amounts 4,500,000 then 4,000,000), and is sitting in AMENDMENT_REQUESTED for the third time."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
