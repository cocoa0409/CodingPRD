              payload: { draft_cycle_id: "${cycle_id}", club_id: "${elm_id}", claim_type: "DEPARTURE", player_name: "Dane Whitlock", departed_apy_cents: 1450000000, snap_pct: 0.72, postseason_honor: "ALL_CONFERENCE" }
