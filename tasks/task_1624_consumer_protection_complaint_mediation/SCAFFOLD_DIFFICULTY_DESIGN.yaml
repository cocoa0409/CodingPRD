    instances:
      - name: d_overlap_mediator_buffer_semantics
        grounds:
          - validations[priority=8]
          - errors[ERR_MEDIATOR_TIME_CONFLICT]
          - entities.MediationSession.fields.starts_at
        distinguishing_aspect: |
          Resource = Mediator; semantics = half-open intervals PLUS a 30-minute
          turnover buffer: an existing 10:00-11:00 session conflicts with a new
          11:00-11:30 proposal (11:00 < 11:00+30m) but a new 11:30-12:00 proposal
          satisfies the buffer exactly (11:30 < 11:30 is false -> allowed).
