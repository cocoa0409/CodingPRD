  - rule_id: resource_temporal_overlap
    instances:
      - name: exam_seat_overlap_scoped_to_seat_label
        grounds:
          - calculations.exam_seat_interval_conflict
          - validations[priority=20]
          - errors.ERR_SEAT_WINDOW_CONFLICT
          - calculations.test_center_seat_ledger
          - conserved_invariants.seat_capacity_conservation
        distinguishing_aspect: |
          The exclusion key is the PAIR (test_center_id, seat_label), not the test center alone and not the
          candidate. The identical 12:00-20:00 window is refused on the occupied seat and then accepted on
          the sibling seat of the SAME centre at the SAME instant, which fails any implementation that scans
          for centre-wide or candidate-wide collisions. The refused window is also a partial straddle
          (it starts inside the incumbent window and ends outside it), the shape that a naive
          "new_start >= old_start AND new_end <= old_end" containment test misses entirely.
