      - "Household.write_gate_state recomputed (RESTRICTED -> OPEN when the status axis allows)"
      - "increments Subscription.version by 1"

  - method: POST
    path: "/vault/subscriptions/{subscription_id}/reinstate"
    description: "Brings a LAPSED subscription back to ACTIVE after a quota re-check. On the WRITE_GATE_EXCLUSION_LIST."
