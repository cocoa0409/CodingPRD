            - { call: "POST /shop/equipment-items", payload: { gear_type: "SNOWBOARD", size_label: "154cm", tier: "DEMO", din_min: 2, din_max: 10, purchase_price_cents: 50000, base_daily_rate_cents: 5000 }, as: Manager, captures: { du1: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SNOWBOARD", size_label: "156cm", tier: "DEMO", din_min: 2, din_max: 10, purchase_price_cents: 50000, base_daily_rate_cents: 5000 }, as: Manager, captures: { du2: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SNOWBOARD", size_label: "158cm", tier: "DEMO", din_min: 2, din_max: 10, purchase_price_cents: 60000, base_daily_rate_cents: 5000 }, as: Manager, captures: { pu: "$.data.id" } }
            - { call: "POST /shop/demo-credits", payload: { customer_id: "${cust}", equipment_item_id: "${du1}", demo_date: "2026-12-01", fee_paid_cents: 5000 }, as: FrontDesk, captures: { cr1: "$.data.id" } }
            - { call: "POST /shop/demo-credits", payload: { customer_id: "${cust}", equipment_item_id: "${du2}", demo_date: "2026-12-05", fee_paid_cents: 8000 }, as: FrontDesk, captures: { cr2: "$.data.id" } }
          trigger:
            - { call: "POST /shop/purchase-orders", payload: { customer_id: "${cust}", equipment_item_id: "${pu}" }, as: Customer, as_user_id: "${cust}", captures: { po: "$.data.id", lp: "$.data.list_price_cents", ca: "$.data.credit_applied_cents", due: "$.data.amount_due_cents" } }
