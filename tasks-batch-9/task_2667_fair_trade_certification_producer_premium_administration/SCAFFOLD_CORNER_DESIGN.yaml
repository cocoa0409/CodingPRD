        distinguishing_aspect: "Closing an audit that still carries one OPEN finding returns 409 ERR_AUDIT_HAS_OPEN_NONCONFORMITIES; after the corrective action is accepted the same call succeeds and sets next_audit_due_at to 2028-08-08T00:00:00Z from the 24-month cadence at score 100."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "CERTIFIED producer with an audit over 2026-08-01..2026-08-08 started by auditor-1"
            - "one MAJOR finding raised on that audit, so the audit is REPORT_PENDING with open_nonconformity_count 1"
