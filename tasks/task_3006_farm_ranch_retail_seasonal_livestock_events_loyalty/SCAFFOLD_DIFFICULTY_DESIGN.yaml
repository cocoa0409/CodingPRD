              as: StoreManager
            - call: "POST /season-campaigns/${ko_camp}/verify"
              payload: { audit_passed: true }
              as: RegionalAdmin
            - call: "POST /season-campaigns/${ko_camp}/activate"
              payload: { expected_store_version: "${store_v0}" }
              as: RegionalAdmin
            - call: "POST /loyalty-accounts"
              payload: { full_name: "Vern Tibbs", phone: "555-0133" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /weighted-sales"
              payload: { store_id: "${store_id}", sale_kind: "PROPANE_EXCHANGE", container_class: "CYLINDER_20", gross_weight_lbs: 101.8 }
              as: StoreAssociate
              captures: { hw1: $.data.id }
            - call: "POST /weighted-sales/${hw1}/finalize"
              payload: { measured_tare_lbs: 17 }
              as: StoreAssociate
            - call: "POST /weighted-sales"
              payload: { store_id: "${store_id}", sale_kind: "PROPANE_EXCHANGE", container_class: "CYLINDER_20", gross_weight_lbs: 101.8 }
              as: StoreAssociate
              captures: { hw2: $.data.id }
            - call: "POST /weighted-sales/${hw2}/finalize"
              payload: { measured_tare_lbs: 17 }
              as: StoreAssociate
            - call: "POST /weighted-sales"
              payload: { store_id: "${store_id}", sale_kind: "PROPANE_EXCHANGE", container_class: "CYLINDER_20", gross_weight_lbs: 40, loyalty_account_id: "${acct_id}" }
              as: StoreAssociate
