            - { call: "POST /aco/claims/${c1}/adjudicate", payload: {}, as: ClaimsProcessor }
            - { call: "POST /aco/claims/${c2}/adjudicate", payload: {}, as: ClaimsProcessor }
            - { call: "POST /aco/claims/${c3}/adjudicate", payload: {}, as: ClaimsProcessor }
            - { call: "POST /aco/claims/${c4}/adjudicate", payload: {}, as: ClaimsProcessor }
            - { call: "POST /aco/claims/${c5}/adjudicate", payload: {}, as: ClaimsProcessor }
            - { call: "POST /aco/claims/${c6}/adjudicate", payload: {}, as: ClaimsProcessor }
