            - "the matching-lot-on-narrow-line request returns HTTP 422 with error_id ERR_GAUGE_EXCEEDS_LINE_CAPACITY because 1.6 > 1.3"
            - "the matching-lot-on-wide-line request returns HTTP 201 with status SCHEDULED and coating_code G115 copied from the lot's coating spec"
            - "after the successful schedule the lot reports reserved_kg 6600.0 and remaining_kg 13400.0 == 20000.0 - 6600.0"
            - "neither rejected request reserved any mass: GET /roll-forming-runs filtered by coil_lot_id returns total_count 1"

      - name: window_order_is_strict_for_line_runs_and_inclusive_for_yard_windows
        claim_type: violation_to_error
        grounds:
          - validations.p19
          - errors.ERR_WINDOW_ORDER_INVALID
        distinguishing_aspect: "One rule, two endpoints, two different comparisons: a roll-forming window must be STRICTLY ordered, so a zero-length window with window_end == window_start is rejected, while a yard window only has to be non-inverted, so yard_window_end == yard_window_start is accepted as a single-instant staging window. The zero-length run request also carries planned_kg 30000.0 against a lot holding only 20000.0, and still returns the priority-19 temporal error rather than the priority-31 mass error, which pins the ordering as well as the comparison."
