            - { call: "POST /valuations/${va2}/approve", payload: {}, as: ValuationApprover, as_user_id: "va_1" }
            - { call: "GET /acknowledgments", payload: { item_id: "${it1}" }, as: FinanceOfficer, captures: { ack1: "$.data[0].id" } }
            - { call: "GET /acknowledgments", payload: { item_id: "${it2}" }, as: FinanceOfficer, captures: { ack2: "$.data[0].id" } }
          trigger:
            - { call: "POST /acknowledgments/${ack1}/issue", payload: {}, as: FinanceOfficer, captures: { err_id: "$.data.error_id" } }
            - { call: "POST /acknowledgments/${ack2}/issue", payload: {}, as: FinanceOfficer, captures: { st2: "$.data.status" } }
          assert:
            - "FMV 24999 -> error_id == ERR_ACK_THRESHOLD_NOT_MET (below 25000 threshold)"
            - "FMV 25000 -> status == ISSUED (>= boundary)"

