          - calculations.fill_charge_net
          - entities.ScanEvent.fields.dwell_days_closed
          - entities.Keg.fields.cumulative_dwell_days
        distinguishing_aspect: "A 30-day-23-hour brewer spell floors to 30 whole days, not 31: dwell_days_closed is 30, the surcharge excess is max(0, 30 - 30) = 0 and the fill still costs the bare 2200 — rounding the spell up would post 2230 and would also flip the keg to OVERDUE."
