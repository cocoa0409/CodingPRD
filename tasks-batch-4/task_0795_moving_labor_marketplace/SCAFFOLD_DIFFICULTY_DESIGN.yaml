            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${pol}", job_type: "MOVE", crew_size: 2, estimated_hours: 2.5, window_start: "2026-03-11T09:00:00Z", window_end: "2026-03-11T12:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { jAbove: "$.data.id" } }
