roles:

  - name: ProgramOfficer
    identity: opaque
    description: >
      Sponsor-bank fintech program office staff, and the broadest operational surface in the
      system. Opens partner records and diligence files, drafts program agreements, files marketing materials for
      compliance review, opens and reconciles settlement batches, books ledger entries, releases program funds to the
      partner and claws them back, opens and closes oversight cycles, and drafts, submits and executes wind-down plans.
      It submits diligence files, program agreements and wind-down plans for decision but never decides them itself:
      diligence and marketing outcomes belong to ComplianceOfficer, agreement and wind-down outcomes to RiskCommittee.
      Also the only role permitted to advance the logical clock.
    exclusive_operations:
      - "POST /oversight/partners"
      - "POST /oversight/partners/{id}/go-live"
      - "POST /oversight/diligence-reviews"
      - "POST /oversight/diligence-reviews/{id}/submit"
      - "POST /oversight/agreements"
      - "POST /oversight/agreements/{id}/submit-for-approval"
      - "POST /oversight/settlement-batches/{id}/fund"
      - "POST /oversight/settlement-batches/{id}/clawback"
