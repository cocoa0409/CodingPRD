scenario: "Gleaning & Farm Surplus Recovery Program (Society of St. Andrew style gleaner): farmer surplus notification & harvest window, volunteer crew scheduling & liability waiver, poundage tracking & recipient agency distribution, food-safety handling & cold chain, tax-deduction documentation for donor, transportation & container logistics, seasonal capacity vs agency need matching, grant reporting & impact metrics"
domain_name: gleaning-farm-surplus-recovery
api_prefix: /glean
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Farm
    parent: null
    common_fields: true
    fields:
      - { name: farm_name, type: string, source: input, description: "Legal farm / donor name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact for donor tax documentation" }
      - { name: county_code, type: string, source: input, description: "County code used for grant reporting rollups" }
      - { name: donor_tin, type: string, source: input, description: "Tax identification number for donation receipts" }
      - { name: active_flag, type: boolean, source: input, description: "Whether farm may publish new surplus offers", default: true }
      - { name: lifetime_donated_lbs, type: number, source: computed, description: "Cumulative pounds across all CLOSED glean events sourced from this farm" }

  - name: SurplusOffer
    parent: null
    common_fields: true
    fields:
      - { name: farm_id, type: string, source: input, description: "FK -> Farm.id; donor of the surplus" }
      - { name: crop_code, type: string, source: input, description: "Crop identifier (e.g. SWEET_CORN, APPLES)" }
      - { name: estimated_lbs, type: number, source: input, description: "Farmer's estimate of available pounds; must be > 0" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the harvest window" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive end of the harvest window; must be strictly after window_start" }
      - { name: perishability_class, type: enum, source: input, description: "HIGH (leafy/berry, 24h cold-chain limit), MEDIUM (stone fruit, 72h), LOW (root/winter squash, 168h)", constraints: "one of {HIGH, MEDIUM, LOW}" }
      - { name: requires_refrigeration, type: boolean, source: input, description: "True if cold chain mandatory from field to agency" }
      - { name: status, type: enum, source: system, description: "Lifecycle: OFFERED -> SCHEDULED -> GLEANED -> CLOSED | CANCELLED | EXPIRED", constraints: "one of {OFFERED, SCHEDULED, GLEANED, CLOSED, CANCELLED, EXPIRED}", default: OFFERED }
      - { name: actual_lbs, type: number, source: computed, description: "Sum of verified HarvestLot pounds across all GleanEvents of this offer", default: 0 }
      - { name: salvage_ratio, type: number, source: computed, description: "actual_lbs / estimated_lbs, computed at CLOSED; 4 decimal places, round_half_up" }

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Volunteer legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across volunteers" }
      - { name: crew_leader_certified, type: boolean, source: input, description: "True if the volunteer may lead a crew", default: false }
      - { name: status, type: enum, source: system, description: "ACTIVE or SUSPENDED (after 2 no-shows)", constraints: "one of {ACTIVE, SUSPENDED}", default: ACTIVE }
      - { name: no_show_count, type: integer, source: computed, description: "Count of assignments that transitioned to NO_SHOW", default: 0 }

  - name: Waiver
    parent: null
    common_fields: false
    fields:
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; signer of the waiver" }
      - { name: glean_event_id, type: string, source: input, description: "FK -> GleanEvent.id; waiver scoped to a single event" }
      - { name: signed_at, type: datetime, source: system, description: "Server timestamp of signing (logical clock)" }
      - { name: signature_payload, type: string, source: input, description: "Opaque signature attestation string" }
      - { name: witness_volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; crew leader who witnessed the signature; MUST differ from volunteer_id (segregation of duties)" }

  - name: Agency
    parent: null
    common_fields: true
    fields:
      - { name: agency_name, type: string, source: input, description: "Recipient food bank / pantry name" }
      - { name: county_code, type: string, source: input, description: "County served; used for grant rollup matching" }
      - { name: weekly_capacity_lbs, type: number, source: input, description: "Max pounds the agency can accept per ISO week; > 0" }
      - { name: refrigeration_capable, type: boolean, source: input, description: "True if the agency can receive cold-chain loads" }
      - { name: active_flag, type: boolean, source: input, description: "Whether agency is eligible for new distributions", default: true }
      - { name: current_week_committed_lbs, type: number, source: computed, description: "Sum of pounds across Distributions in SCHEDULED or DELIVERED status whose delivery date falls in the current ISO week", default: 0 }

  - name: GleanEvent
    parent: null
    common_fields: true
    fields:
      - { name: surplus_offer_id, type: string, source: input, description: "FK -> SurplusOffer.id; the offer being gleaned" }
      - { name: scheduled_start, type: datetime, source: input, description: "Crew arrival time; must fall within the offer's [window_start, window_end)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Crew departure deadline; must be strictly after scheduled_start and within [window_start, window_end]" }
      - { name: crew_leader_volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; must have crew_leader_certified=true" }
      - { name: assigned_vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; refrigerated iff offer.requires_refrigeration" }
      - { name: crew_capacity, type: integer, source: input, description: "Maximum crew size for this event; > 0" }
      - { name: status, type: enum, source: system, description: "DRAFT -> OPEN -> FULL -> IN_PROGRESS -> HARVESTED -> RECONCILED | CANCELLED", constraints: "one of {DRAFT, OPEN, FULL, IN_PROGRESS, HARVESTED, RECONCILED, CANCELLED}", default: DRAFT }
      - { name: crew_confirmed_count, type: integer, source: computed, description: "Count of CrewAssignments in CONFIRMED status", default: 0 }
      - { name: total_harvested_lbs, type: number, source: computed, description: "Sum of pounds over this event's verified HarvestLots", default: 0 }
      - { name: total_distributed_lbs, type: number, source: computed, description: "Sum of pounds over this event's Distributions in SCHEDULED or DELIVERED", default: 0 }
      - { name: undistributed_lbs, type: number, source: computed, description: "total_harvested_lbs - total_distributed_lbs - total_wasted_lbs", default: 0 }

  - name: CrewAssignment
    parent: null
    common_fields: true
    fields:
      - { name: glean_event_id, type: string, source: input, description: "FK -> GleanEvent.id; the event joined" }
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; the crew member" }
      - { name: status, type: enum, source: system, description: "PENDING -> CONFIRMED | DECLINED | NO_SHOW | COMPLETED", constraints: "one of {PENDING, CONFIRMED, DECLINED, NO_SHOW, COMPLETED}", default: PENDING }
      - { name: confirmed_at, type: datetime, source: system, description: "Server timestamp when waiver was validated and status -> CONFIRMED" }
      - { name: hours_worked, type: number, source: input, description: "Reported hours; required to transition to COMPLETED" }

  - name: HarvestLot
    parent: null
    common_fields: true
    fields:
      - { name: glean_event_id, type: string, source: input, description: "FK -> GleanEvent.id; producing event" }
      - { name: container_id, type: string, source: input, description: "FK -> Container.id; container used" }
      - { name: gross_lbs, type: number, source: input, description: "Field-scale gross weight; > 0" }
      - { name: tare_lbs, type: number, source: input, description: "Container tare weight; >= 0; defaults to the container's tare_lbs when omitted" }
      - { name: cull_lbs, type: number, source: input, description: "Field-culled (non-food) pounds; >= 0 and <= gross_lbs - tare_lbs" }
      - { name: net_lbs, type: number, source: computed, description: "gross_lbs - tare_lbs - cull_lbs" }
      - { name: recorded_by_volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; crew leader who weighed the lot" }
      - { name: verified_by_coordinator_id, type: string, source: input, description: "FK -> Volunteer.id; program coordinator who verified; MUST differ from recorded_by_volunteer_id" }
      - { name: status, type: enum, source: system, description: "PENDING -> VERIFIED | REJECTED", constraints: "one of {PENDING, VERIFIED, REJECTED}", default: PENDING }

  - name: Distribution
    parent: null
    common_fields: true
    fields:
      - { name: glean_event_id, type: string, source: input, description: "FK -> GleanEvent.id; source event" }
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; recipient" }
      - { name: planned_lbs, type: number, source: input, description: "Pounds allocated to the agency; > 0" }
      - { name: delivery_date, type: datetime, source: input, description: "Planned delivery date; determines the ISO week for agency capacity" }
      - { name: delivered_lbs, type: number, source: input, description: "Actual delivered pounds, recorded at DELIVERED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> DELIVERED | SHORTFALL | CANCELLED", constraints: "one of {SCHEDULED, DELIVERED, SHORTFALL, CANCELLED}", default: SCHEDULED }
      - { name: cold_chain_intact, type: boolean, source: computed, description: "False iff any TempLog breach attached to this distribution's event occurred between event HARVESTED and this distribution's delivery", default: true }

  - name: Container
    parent: null
    common_fields: true
    fields:
      - { name: label, type: string, source: input, description: "Human-readable bin label; unique" }
      - { name: tare_lbs, type: number, source: input, description: "Empty container weight; > 0" }
      - { name: capacity_lbs, type: number, source: input, description: "Max net payload; > 0" }
      - { name: refrigerated, type: boolean, source: input, description: "True if the container is a refrigerated tote" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | IN_USE | RETIRED", constraints: "one of {AVAILABLE, IN_USE, RETIRED}", default: AVAILABLE }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: plate, type: string, source: input, description: "Vehicle plate; unique" }
      - { name: payload_capacity_lbs, type: number, source: input, description: "Max combined net pounds the vehicle may carry per trip; > 0" }
      - { name: refrigerated, type: boolean, source: input, description: "True if refrigerated truck" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ASSIGNED | OUT_OF_SERVICE", constraints: "one of {AVAILABLE, ASSIGNED, OUT_OF_SERVICE}", default: AVAILABLE }

  - name: TempLog
    parent: null
    common_fields: false
    fields:
      - { name: glean_event_id, type: string, source: input, description: "FK -> GleanEvent.id; event whose cold chain is monitored" }
      - { name: recorded_at, type: datetime, source: input, description: "Timestamp of the temperature reading" }
      - { name: temp_f, type: number, source: input, description: "Observed Fahrenheit temperature" }
      - { name: breach_flag, type: boolean, source: computed, description: "True iff temp_f > 41.0 for HIGH/MEDIUM perishability loads, or temp_f > 55.0 for LOW; thresholds pinned in calculations.cold_chain_breach" }

  - name: FoodSafetyIncident
    parent: null
    common_fields: true
    fields:
      - { name: glean_event_id, type: string, source: input, description: "FK -> GleanEvent.id; affected event" }
      - { name: severity, type: enum, source: input, description: "MINOR (isolated container loss) or CRITICAL (whole-load condemnation)", constraints: "one of {MINOR, CRITICAL}" }
      - { name: condemned_lbs, type: number, source: input, description: "Pounds condemned; > 0" }
      - { name: reported_by_volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; reporter" }
      - { name: disposition, type: enum, source: system, description: "OPEN -> RESOLVED_COMPOST | RESOLVED_ANIMAL_FEED | RESOLVED_LANDFILL", constraints: "one of {OPEN, RESOLVED_COMPOST, RESOLVED_ANIMAL_FEED, RESOLVED_LANDFILL}", default: OPEN }

  - name: DonationReceipt
    parent: null
    common_fields: false
    fields:
      - { name: surplus_offer_id, type: string, source: input, description: "FK -> SurplusOffer.id; one receipt per CLOSED offer" }
      - { name: farm_id, type: string, source: computed, description: "FK -> Farm.id; copied from the offer at issuance" }
      - { name: receipt_lbs, type: number, source: computed, description: "Pounds credited to the donor: VERIFIED HarvestLot net_lbs minus incident-condemned pounds" }
      - { name: fair_market_value_cents, type: integer, source: computed, description: "receipt_lbs * price_per_lb_cents for the offer's crop, rounded half-up; pricing table in calculations.donation_valuation" }
      - { name: issued_at, type: datetime, source: system, description: "Server timestamp of issuance (logical clock)" }

  - name: GrantReport
    parent: null
    common_fields: true
    fields:
      - { name: county_code, type: string, source: input, description: "County this report covers" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive start of reporting period" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive end of reporting period; strictly after period_start" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> ACCEPTED | RETURNED (RETURNED may loop back to SUBMITTED)", constraints: "one of {DRAFT, SUBMITTED, ACCEPTED, RETURNED}", default: DRAFT }
      - { name: total_gleaned_lbs, type: number, source: computed, description: "Sum of verified net pounds across CLOSED offers of farms in this county within the period" }
      - { name: meals_equivalent, type: integer, source: computed, description: "total_gleaned_lbs * MEALS_PER_LB from calculations.impact_metrics, truncated to integer" }
      - { name: agency_count, type: integer, source: computed, description: "Distinct agencies receiving DELIVERED distributions of this county's events in the period" }

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: SurplusOffer
    initial_state: OFFERED
    terminal_states: [CLOSED, CANCELLED, EXPIRED]
    transitions:
      - from: OFFERED
        to: SCHEDULED
        trigger: "POST /glean/events (first event created against this offer)"
        actor: ProgramCoordinator
        preconditions:
          - "Farm.active_flag == true"
          - "logical clock now < window_end"
        side_effects:
          - "increments SurplusOffer.version by 1"
        note: "Subsequent event creations while the offer is SCHEDULED are allowed (one offer may have multiple events) and do not change offer status; event creation against an offer in {GLEANED, CLOSED, CANCELLED, EXPIRED} is rejected with ERR_INVALID_STATE."
      - from: SCHEDULED
        to: GLEANED
        trigger: "system event: every GleanEvent of this offer reaches HARVESTED or RECONCILED and at least one reached HARVESTED"
        actor: system
        preconditions:
          - "no GleanEvent of this offer remains in {DRAFT, OPEN, FULL, IN_PROGRESS}"
        side_effects:
          - "recompute SurplusOffer.actual_lbs per calculations.actual_poundage"
          - "increments SurplusOffer.version by 1"
      - from: GLEANED
        to: CLOSED
        trigger: "POST /glean/offers/{id}/close"
        actor: ProgramCoordinator
        preconditions:
          - "every GleanEvent of this offer is in {RECONCILED, CANCELLED}"
          - "no FoodSafetyIncident of this offer's events remains OPEN"
        side_effects:
          - "compute SurplusOffer.salvage_ratio per calculations.salvage_ratio"
          - "create DonationReceipt for this offer per calculations.donation_valuation"
          - "Farm.lifetime_donated_lbs += receipt_lbs (cascade to Farm, bumps Farm.version)"
          - "increments SurplusOffer.version by 1"
      - from: OFFERED
        to: CANCELLED
        trigger: "POST /glean/offers/{id}/cancel"
        actor: ProgramCoordinator
        preconditions:
          - "no GleanEvent of this offer exists in {FULL, IN_PROGRESS, HARVESTED, RECONCILED}"
        side_effects:
          - "every GleanEvent of this offer in {DRAFT, OPEN} transitions to CANCELLED (cascade; bumps each event's version)"
          - "every CrewAssignment of those events in {PENDING, CONFIRMED} transitions to DECLINED"
          - "increments SurplusOffer.version by 1"
      - from: OFFERED
        to: EXPIRED
        trigger: "system event: logical clock reaches window_end while offer is OFFERED"
        actor: system
        preconditions:
          - "no GleanEvent exists for this offer"
        side_effects:
          - "increments SurplusOffer.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /glean/offers/{id}/cancel"
        actor: ProgramCoordinator
        preconditions:
          - "every GleanEvent of this offer is in {DRAFT, OPEN, CANCELLED}"
        side_effects:
          - "every GleanEvent of this offer in {DRAFT, OPEN} transitions to CANCELLED; their CrewAssignments in {PENDING, CONFIRMED} transition to DECLINED; containers return to AVAILABLE; vehicles return to AVAILABLE"
          - "increments SurplusOffer.version by 1"

  - entity: GleanEvent
    initial_state: DRAFT
    terminal_states: [RECONCILED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /glean/events/{id}/publish"
        actor: ProgramCoordinator
        preconditions:
          - "SurplusOffer.status == SCHEDULED"
          - "assigned vehicle status == AVAILABLE"
          - "scheduled window within offer's [window_start, window_end)"
        side_effects:
          - "Vehicle.status AVAILABLE -> ASSIGNED"
          - "increments GleanEvent.version by 1"
      - from: OPEN
        to: FULL
        trigger: "system event: crew_confirmed_count reaches crew_capacity"
        actor: system
        preconditions: []
        side_effects:
          - "increments GleanEvent.version by 1"
      - from: FULL
        to: OPEN
        trigger: "system event: a CONFIRMED CrewAssignment transitions to DECLINED, dropping crew_confirmed_count below crew_capacity"
        actor: system
        preconditions: []
        side_effects:
          - "increments GleanEvent.version by 1"
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /glean/events/{id}/start"
        actor: CrewLeader
        preconditions:
          - "logical clock now >= scheduled_start and now < scheduled_end"
          - "crew_confirmed_count >= 1"
          - "acting CrewLeader is the event's crew_leader_volunteer_id"
        side_effects:
          - "increments GleanEvent.version by 1"
      - from: FULL
        to: IN_PROGRESS
        trigger: "POST /glean/events/{id}/start"
        actor: CrewLeader
        preconditions:
          - "logical clock now >= scheduled_start and now < scheduled_end"
          - "acting CrewLeader is the event's crew_leader_volunteer_id"
        side_effects:
          - "increments GleanEvent.version by 1"
      - from: IN_PROGRESS
        to: HARVESTED
        trigger: "POST /glean/events/{id}/finish"
        actor: CrewLeader
        preconditions:
          - "at least one HarvestLot of this event is in VERIFIED status"
        side_effects:
          - "recompute GleanEvent.total_harvested_lbs per calculations.actual_poundage"
          - "every CrewAssignment in CONFIRMED transitions to COMPLETED; every CrewAssignment still in PENDING transitions to NO_SHOW (cascade; bumps Volunteer.no_show_count and possibly Volunteer.status)"
          - "SurplusOffer re-evaluates GLEANED transition"
          - "increments GleanEvent.version by 1"
      - from: HARVESTED
        to: RECONCILED
        trigger: "POST /glean/events/{id}/reconcile"
        actor: ProgramCoordinator
        preconditions:
          - "every Distribution of this event is in {DELIVERED, SHORTFALL, CANCELLED}"
          - "every HarvestLot of this event is in {VERIFIED, REJECTED}"
          - "no FoodSafetyIncident of this event is OPEN"
        side_effects:
          - "recompute GleanEvent.total_distributed_lbs and undistributed_lbs"
          - "every Container referenced by this event's VERIFIED HarvestLots transitions IN_USE -> AVAILABLE"
          - "Vehicle.status ASSIGNED -> AVAILABLE"
          - "SurplusOffer re-evaluates GLEANED transition"
          - "increments GleanEvent.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /glean/events/{id}/cancel"
        actor: ProgramCoordinator
        preconditions: []
        side_effects:
          - "increments GleanEvent.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /glean/events/{id}/cancel"
        actor: ProgramCoordinator
        preconditions: []
        side_effects:
          - "CrewAssignments in {PENDING, CONFIRMED} transition to DECLINED"
          - "Vehicle.status ASSIGNED -> AVAILABLE"
          - "increments GleanEvent.version by 1"

  - entity: CrewAssignment
    initial_state: PENDING
    terminal_states: [DECLINED, NO_SHOW, COMPLETED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /glean/assignments/{id}/confirm"
        actor: Volunteer
        preconditions:
          - "acting volunteer is the assignment's volunteer_id"
          - "Volunteer.status == ACTIVE"
          - "a Waiver exists for (volunteer_id, glean_event_id) signed by a different witness_volunteer_id"
          - "GleanEvent.status in {OPEN, FULL} (i.e., not already IN_PROGRESS or beyond)"
          - "confirming would not exceed GleanEvent.crew_capacity"
        side_effects:
          - "GleanEvent.crew_confirmed_count += 1; if it reaches crew_capacity, GleanEvent transitions OPEN -> FULL"
          - "increments CrewAssignment.version by 1"
      - from: PENDING
        to: DECLINED
        trigger: "POST /glean/assignments/{id}/decline"
        actor: Volunteer
        preconditions:
          - "acting volunteer is the assignment's volunteer_id"
        side_effects:
          - "increments CrewAssignment.version by 1"
      - from: CONFIRMED
        to: DECLINED
        trigger: "POST /glean/assignments/{id}/decline"
        actor: Volunteer
        preconditions:
          - "acting volunteer is the assignment's volunteer_id"
          - "GleanEvent.status in {OPEN, FULL}"
        side_effects:
          - "GleanEvent.crew_confirmed_count -= 1; if GleanEvent was FULL, transitions FULL -> OPEN"
          - "increments CrewAssignment.version by 1"

  - entity: HarvestLot
    initial_state: PENDING
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /glean/lots/{id}/verify"
        actor: ProgramCoordinator
        preconditions:
          - "verified_by_coordinator_id != recorded_by_volunteer_id (segregation of duties)"
          - "GleanEvent.status == IN_PROGRESS"
        side_effects:
          - "Container referenced by container_id transitions AVAILABLE -> IN_USE"
          - "GleanEvent.total_harvested_lbs recomputed per calculations.actual_poundage"
          - "increments HarvestLot.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /glean/lots/{id}/reject"
        actor: ProgramCoordinator
        preconditions:
          - "GleanEvent.status == IN_PROGRESS"
        side_effects:
          - "increments HarvestLot.version by 1"

  - entity: Distribution
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, SHORTFALL, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /glean/distributions/{id}/deliver"
        actor: CrewLeader
        preconditions:
          - "GleanEvent.status == HARVESTED"
          - "delivered_lbs provided and delivered_lbs == planned_lbs"
          - "cold_chain_intact == true when the offer requires_refrigeration"
        side_effects:
          - "Agency.current_week_committed_lbs recomputed"
          - "GleanEvent.total_distributed_lbs recomputed"
          - "increments Distribution.version by 1"
      - from: SCHEDULED
        to: SHORTFALL
        trigger: "POST /glean/distributions/{id}/deliver"
        actor: CrewLeader
        preconditions:
          - "GleanEvent.status == HARVESTED"
          - "delivered_lbs provided and 0 < delivered_lbs < planned_lbs"
          - "cold_chain_intact == true when the offer requires_refrigeration"
        side_effects:
          - "Agency.current_week_committed_lbs recomputed (counts delivered_lbs, not planned_lbs)"
          - "GleanEvent.total_distributed_lbs recomputed"
          - "increments Distribution.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /glean/distributions/{id}/cancel"
        actor: ProgramCoordinator
        preconditions: []
        side_effects:
          - "Agency.current_week_committed_lbs recomputed"
          - "increments Distribution.version by 1"

  - entity: Volunteer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: no_show_count reaches 2"
        actor: system
        preconditions: []
        side_effects:
          - "increments Volunteer.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /glean/volunteers/{id}/reinstate"
        actor: ProgramCoordinator
        preconditions: []
        side_effects:
          - "Volunteer.no_show_count resets to 0"
          - "increments Volunteer.version by 1"

  - entity: FoodSafetyIncident
    initial_state: OPEN
    terminal_states: [RESOLVED_COMPOST, RESOLVED_ANIMAL_FEED, RESOLVED_LANDFILL]
    transitions:
      - from: OPEN
        to: RESOLVED_COMPOST
        trigger: "POST /glean/incidents/{id}/resolve"
        actor: FoodSafetyOfficer
        preconditions:
          - "payload disposition == COMPOST"
        side_effects:
          - "GleanEvent.undistributed_lbs recomputed"
          - "increments FoodSafetyIncident.version by 1"
      - from: OPEN
        to: RESOLVED_ANIMAL_FEED
        trigger: "POST /glean/incidents/{id}/resolve"
        actor: FoodSafetyOfficer
        preconditions:
          - "payload disposition == ANIMAL_FEED"
        side_effects:
          - "GleanEvent.undistributed_lbs recomputed"
          - "increments FoodSafetyIncident.version by 1"
      - from: OPEN
        to: RESOLVED_LANDFILL
        trigger: "POST /glean/incidents/{id}/resolve"
        actor: FoodSafetyOfficer
        preconditions:
          - "payload disposition == LANDFILL"
        side_effects:
          - "GleanEvent.undistributed_lbs recomputed"
          - "increments FoodSafetyIncident.version by 1"

  - entity: GrantReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /glean/reports/{id}/submit"
        actor: ProgramCoordinator
        preconditions: []
        side_effects:
          - "recompute total_gleaned_lbs, meals_equivalent, agency_count per calculations.impact_metrics snapshot at submit time"
          - "increments GrantReport.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /glean/reports/{id}/accept"
        actor: GrantReviewer
        preconditions: []
        side_effects:
          - "increments GrantReport.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /glean/reports/{id}/return"
        actor: GrantReviewer
        preconditions: []
        side_effects:
          - "increments GrantReport.version by 1"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /glean/reports/{id}/submit"
        actor: ProgramCoordinator
        preconditions: []
        side_effects:
          - "recompute metrics snapshot per calculations.impact_metrics at resubmit time"
          - "increments GrantReport.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: distribution-create-stale-event
    parent_entity: GleanEvent
    write_endpoint: "POST /glean/distributions"
    occ_field: "expected_event_version"
    description: |
      Creating a Distribution against a GleanEvent whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just created or cancelled a distribution on the
      same event (advancing the event's version), so the current writer's view
      of remaining undistributed pounds is stale.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412
  - rule_id: offer-close-stale-version
    parent_entity: SurplusOffer
    write_endpoint: "POST /glean/offers/{id}/close"
    occ_field: "expected_offer_version"
    description: |
      Closing a SurplusOffer whose version has advanced since the client last
      observed it is rejected. A late-arriving lot verification or incident
      resolution may have advanced the offer version, invalidating the
      receipt-poundage basis the client relied upon.
    error_id: ERR_STALE_OFFER_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: net_lot_weight
    trigger: "on HarvestLot creation"
    algorithm: aggregation
    formula: |
      net_lbs = gross_lbs - tare_lbs - cull_lbs
      where tare_lbs defaults to the referenced Container.tare_lbs when omitted
      REJECT (ERR_CULL_EXCEEDS_NET) if cull_lbs > gross_lbs - tare_lbs
    input_set: "the single HarvestLot being created; Container referenced by container_id"
    constants: {}
    precision: "1 decimal place, round_half_up on inputs; subtraction exact"

  - name: actual_poundage
    trigger: "on HarvestLot VERIFIED, on GleanEvent finish, on GleanEvent reconcile, and on SurplusOffer GLEANED evaluation"
    algorithm: aggregation
    formula: |
      GleanEvent.total_harvested_lbs = sum(net_lbs) over HarvestLots of this event with status == VERIFIED
      SurplusOffer.actual_lbs = sum over the offer's GleanEvents of total_harvested_lbs
    input_set: "HarvestLots with status VERIFIED only; PENDING and REJECTED lots excluded"
    constants: {}
    precision: "1 decimal place, round_half_up"

  - name: salvage_ratio
    trigger: "on SurplusOffer CLOSED"
    algorithm: aggregation
    formula: |
      salvage_ratio = actual_lbs / estimated_lbs
      Two variants exist for the receipt basis (see donation_valuation) but the
      salvage ratio itself always uses actual_lbs (all VERIFIED pounds).
    input_set: "the SurplusOffer being closed"
    constants: {}
    precision: "4 decimal places, round_half_up"
    variants:
      - name: raw_ratio
        when: "default"
        difference: "no adjustment; actual_lbs includes pounds later condemned"
      - name: net_of_condemnation_ratio
        when: "computed alongside for grant reporting via impact_metrics"
        difference: "(actual_lbs - condemned_lbs_resolved) / estimated_lbs, 4dp round_half_up"

  - name: donation_valuation
    trigger: "on SurplusOffer CLOSED, materializing DonationReceipt"
    algorithm: tiered_pricing
    formula: |
      # Step 1: receipt poundage basis — TWO variants (see variants below)
      base_lbs = actual_lbs                       # gross basis
      # Step 2: price per pound keyed on crop_code
      price_cents = PRICE_PER_LB_CENTS[crop_code]
      # Step 3: fair market value
      fair_market_value_cents = round_half_up(base_lbs * price_cents)
    input_set: "the CLOSED SurplusOffer, its VERIFIED HarvestLots, its events' RESOLVED FoodSafetyIncidents"
    constants:
      PRICE_PER_LB_CENTS: { SWEET_CORN: 33, APPLES: 41, LEAFY_GREENS: 74, TOMATOES: 58, ROOT_VEG: 29, WINTER_SQUASH: 36 }
      DEFAULT_PRICE_CENTS: 40
    precision: "integer cents, round_half_up"
    variants:
      - name: gross_receipt
        when: "no FoodSafetyIncident for any of the offer's events reached a RESOLVED_* state"
        difference: "receipt_lbs = actual_lbs"
      - name: net_receipt
        when: "at least one RESOLVED_* FoodSafetyIncident exists across the offer's events"
        difference: "receipt_lbs = actual_lbs - sum(condemned_lbs over RESOLVED_* incidents); receipt_lbs floored at 0"

  - name: cold_chain_breach
    trigger: "on TempLog creation"
    algorithm: threshold
    formula: |
      threshold_f = 41.0 if offer.perishability_class in {HIGH, MEDIUM} else 55.0  # LOW
      breach_flag = (temp_f > threshold_f)      # strictly greater; 41.0 exactly is NOT a breach for HIGH/MEDIUM
      On breach: every SCHEDULED Distribution of this event has cold_chain_intact recomputed to false;
      a breach therefore gates the deliver transition for refrigeration-required offers.
    input_set: "the new TempLog plus the parent GleanEvent's SurplusOffer perishability_class"
    constants:
      THRESHOLD_HIGH_MEDIUM_F: 41.0
      THRESHOLD_LOW_F: 55.0
    precision: "1 decimal place comparison, strict >"

  - name: agency_capacity_check
    trigger: "on Distribution creation"
    algorithm: constraint_propagation
    formula: |
      week_of(delivery_date) = ISO-8601 week containing delivery_date
      committed = sum(planned_lbs of Distributions in SCHEDULED) + sum(delivered_lbs of Distributions in {DELIVERED, SHORTFALL})
                over this agency, where week_of(delivery_date) == week_of(new delivery_date)
      # CANCELLed distributions excluded entirely
      REJECT (ERR_AGENCY_CAPACITY_EXCEEDED) if committed + planned_lbs > agency.weekly_capacity_lbs
      # Boundary: equality (committed + planned_lbs == weekly_capacity_lbs) is ALLOWED
    input_set: "Distributions of the agency in the same ISO week, filtered by status in {SCHEDULED, DELIVERED, SHORTFALL}"
    constants: {}
    precision: "1 decimal place, round_half_up"

  - name: event_allocation_feasibility
    trigger: "on Distribution creation"
    algorithm: waterfall_allocation
    formula: |
      available_lbs = GleanEvent.total_harvested_lbs
                    - sum(planned_lbs of this event's Distributions in SCHEDULED)
                    - sum(delivered_lbs of this event's Distributions in {DELIVERED, SHORTFALL})
                    - sum(condemned_lbs of this event's FoodSafetyIncidents in RESOLVED_* )
      REJECT (ERR_ALLOCATION_EXCEEDS_HARVEST) if planned_lbs > available_lbs
      # Boundary: planned_lbs == available_lbs is ALLOWED (fully allocates the event)
    input_set: "the GleanEvent's own Distributions and RESOLVED incidents"
    constants: {}
    precision: "1 decimal place, round_half_up"

  - name: vehicle_payload_check
    trigger: "on GleanEvent creation and on HarvestLot verification"
    algorithm: constraint_propagation
    formula: |
      projected_payload = sum(net_lbs of VERIFIED HarvestLots of the event)
      REJECT lot verification (ERR_VEHICLE_PAYLOAD_EXCEEDED) if projected_payload > vehicle.payload_capacity_lbs
      # Boundary: projected_payload == payload_capacity_lbs is ALLOWED
      On event creation: REJECT (ERR_VEHICLE_REFRIGERATION_MISMATCH) if offer.requires_refrigeration != vehicle.refrigerated
    input_set: "the event's VERIFIED lots and its assigned Vehicle"
    constants: {}
    precision: "1 decimal place, round_half_up"

  - name: impact_metrics
    trigger: "on GrantReport submit (DRAFT->SUBMITTED and RETURNED->SUBMITTED)"
    algorithm: aggregation
    formula: |
      events_in_scope = GleanEvents whose SurplusOffer.farm.county_code == report.county_code
                        AND SurplusOffer.status == CLOSED
                        AND SurplusOffer.updated_at (at CLOSED transition) within [period_start, period_end)
      total_gleaned_lbs = sum over events_in_scope of total_harvested_lbs
                        - sum over RESOLVED_* incidents of those events of condemned_lbs
      meals_equivalent = floor(total_gleaned_lbs * MEALS_PER_LB)
      agency_count = count(distinct Distribution.agency_id) over DELIVERED distributions
                     of events_in_scope
      # Snapshot semantics: values frozen at submit time; later farm/agency/lot changes do not mutate a SUBMITTED report.
    input_set: "CLOSED offers, RESOLVED incidents, DELIVERED distributions — explicit status filters as above; period window is half-open [start, end)"
    constants:
      MEALS_PER_LB: 1.2
    precision: "total_gleaned_lbs 1 decimal round_half_up; meals_equivalent truncated to integer"

  - name: crew_fill_projection
    trigger: "on CrewAssignment confirm and decline"
    algorithm: aggregation
    formula: |
      crew_confirmed_count = count of CrewAssignments of the event with status == CONFIRMED
      If count reaches crew_capacity and event.status == OPEN: event transitions to FULL
      If count drops below crew_capacity and event.status == FULL: event transitions to OPEN
      # Boundary: count == crew_capacity - 1 remains OPEN; count == crew_capacity flips to FULL
    input_set: "CrewAssignments of the event with status CONFIRMED only"
    constants: {}
    precision: "integer count"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID present for entity-backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "role permitted to invoke this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "every id in the path exists (validated left-to-right); every FK in the body exists"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"
  - priority: 4
    category: state
    check: "target resource in a state that permits the requested transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_safety
    check: "food-safety gate: delivery of a refrigeration-required offer's distribution requires cold_chain_intact == true"
    error_id: ERR_COLD_CHAIN_BREACH
    http_status: 422
    applies_to: "POST /glean/distributions/{id}/deliver"
  - priority: 6
    category: business_safety
    check: "segregation of duties: HarvestLot.verified_by_coordinator_id must differ from recorded_by_volunteer_id; Waiver.witness_volunteer_id must differ from volunteer_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /glean/lots/{id}/verify, POST /glean/waivers"
  - priority: 7
    category: business_temporal
    check: "event window containment: scheduled_start >= offer.window_start, scheduled_end <= offer.window_end, scheduled_start < scheduled_end"
    error_id: ERR_EVENT_WINDOW_OUTSIDE_OFFER
    http_status: 422
    applies_to: "POST /glean/events"
  - priority: 8
    category: business_temporal
    check: "offer overlap: a Farm may not have two non-terminal SurplusOffers for the same crop_code whose [window_start, window_end) intervals overlap (adjacency where end == start is permitted)"
    error_id: ERR_OFFER_WINDOW_OVERLAP
    http_status: 422
    applies_to: "POST /glean/offers"
  - priority: 9
    category: business_temporal
    check: "volunteer double-booking: a volunteer may not hold CONFIRMED assignments on two events whose [scheduled_start, scheduled_end) intervals overlap (adjacency permitted)"
    error_id: ERR_VOLUNTEER_DOUBLE_BOOKED
    http_status: 422
    applies_to: "POST /glean/assignments/{id}/confirm"
  - priority: 10
    category: business_temporal
    check: "vehicle scheduling: a vehicle may not be assigned to two events in {OPEN, FULL, IN_PROGRESS, HARVESTED} whose [scheduled_start, scheduled_end) overlap (adjacency permitted)"
    error_id: ERR_VEHICLE_SCHEDULE_CONFLICT
    http_status: 422
    applies_to: "POST /glean/events, POST /glean/events/{id}/publish"
  - priority: 11
    category: business_constraint
    check: "waiver presence: volunteer must hold a Waiver for this event signed by a distinct witness before confirming"
    error_id: ERR_WAIVER_MISSING
    http_status: 422
    applies_to: "POST /glean/assignments/{id}/confirm"
  - priority: 12
    category: business_constraint
    check: "crew capacity: confirming an assignment must not push crew_confirmed_count above crew_capacity"
    error_id: ERR_CREW_FULL
    http_status: 422
    applies_to: "POST /glean/assignments/{id}/confirm"
  - priority: 13
    category: business_constraint
    check: "refrigeration match: offer.requires_refrigeration must equal vehicle.refrigerated at event creation; agency.refrigeration_capable must be true when delivering refrigerated loads"
    error_id: ERR_VEHICLE_REFRIGERATION_MISMATCH
    http_status: 422
    applies_to: "POST /glean/events, POST /glean/distributions"
  - priority: 14
    category: business_referential
    check: "allocation feasibility: planned_lbs must not exceed available_lbs per calculations.event_allocation_feasibility"
    error_id: ERR_ALLOCATION_EXCEEDS_HARVEST
    http_status: 422
    applies_to: "POST /glean/distributions"
  - priority: 15
    category: business_referential
    check: "cull sanity: cull_lbs must be <= gross_lbs - tare_lbs per calculations.net_lot_weight"
    error_id: ERR_CULL_EXCEEDS_NET
    http_status: 422
    applies_to: "POST /glean/lots"
  - priority: 16
    category: business_fiscal
    check: "vehicle payload: verifying a lot must not push projected_payload above vehicle.payload_capacity_lbs per calculations.vehicle_payload_check"
    error_id: ERR_VEHICLE_PAYLOAD_EXCEEDED
    http_status: 422
    applies_to: "POST /glean/lots/{id}/verify"
  - priority: 17
    category: business_fiscal
    check: "agency weekly capacity: committed + planned_lbs must not exceed weekly_capacity_lbs per calculations.agency_capacity_check (equality allowed)"
    error_id: ERR_AGENCY_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /glean/distributions"
  - priority: 18
    category: business_constraint
    check: "uniqueness: Volunteer.email unique; Container.label unique; Vehicle.plate unique; one DonationReceipt per SurplusOffer"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /glean/volunteers, POST /glean/containers, POST /glean/vehicles, POST /glean/offers/{id}/close"
  - priority: 19
    category: state
    check: "OCC: expected_<parent>_version must equal the parent's current version per §1.2.1"
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412
    applies_to: "POST /glean/distributions, POST /glean/offers/{id}/close"
  - priority: 20
    category: state
    check: "terminal-state lockdown: any action endpoint invoked on a resource already in a terminal state is rejected"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 21
    category: business_temporal
    check: "event start gate: logical clock must satisfy scheduled_start <= now < scheduled_end"
    error_id: ERR_EVENT_NOT_STARTED
    http_status: 422
    applies_to: "POST /glean/events/{id}/start"
  - priority: 22
    category: business_constraint
    check: "volunteer standing: volunteer.status must be ACTIVE to confirm an assignment"
    error_id: ERR_VOLUNTEER_SUSPENDED
    http_status: 422
    applies_to: "POST /glean/assignments/{id}/confirm"
  - priority: 23
    category: business_constraint
    check: "parent flags: offer creation requires Farm.active_flag == true; distribution creation requires Agency.active_flag == true"
    error_id: ERR_FARM_INACTIVE
    http_status: 422
    applies_to: "POST /glean/offers, POST /glean/distributions"
  - priority: 24
    category: business_constraint
    check: "agency active gate for distributions (shares priority band with farm gate; agency variant raises its own error)"
    error_id: ERR_AGENCY_INACTIVE
    http_status: 422
    applies_to: "POST /glean/distributions"
  - priority: 25
    category: business_safety
    check: "close/reconcile gate: no FoodSafetyIncident on the target's events may remain OPEN"
    error_id: ERR_INCIDENT_OPEN
    http_status: 422
    applies_to: "POST /glean/offers/{id}/close, POST /glean/events/{id}/reconcile"
  - priority: 26
    category: business_constraint
    check: "required input fields present and typed per §1.1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/glean/farms"
    description: "Register a donor farm"
    roles: [ProgramCoordinator]
    code: 201
    input: ["farm_name", "contact_email", "county_code", "donor_tin", "active_flag?"]
    output: Farm
    side_effects: []
  - method: GET
    path: "/glean/farms"
    description: "List farms with pagination; optional county_code filter"
    roles: [ProgramCoordinator, GrantReviewer, FoodSafetyOfficer]
    code: 200
    input: ["limit?", "offset?", "county_code?"]
    output: Farm[]
    side_effects: []
  - method: GET
    path: "/glean/farms/{id}"
    description: "Fetch one farm"
    roles: [ProgramCoordinator, GrantReviewer]
    code: 200
    input: []
    output: Farm
    side_effects: []
  - method: POST
    path: "/glean/offers"
    description: "Publish a surplus offer (creates in OFFERED); validates per-farm per-crop window non-overlap"
    roles: [ProgramCoordinator]
    code: 201
    input: ["farm_id", "crop_code", "estimated_lbs", "window_start", "window_end", "perishability_class", "requires_refrigeration"]
    output: SurplusOffer
    side_effects: ["increments Farm.version via farm touched? No — creation only touches the offer"]
  - method: GET
    path: "/glean/offers"
    description: "List offers; optional farm_id and status filters"
    roles: [ProgramCoordinator, GrantReviewer, FoodSafetyOfficer, CrewLeader]
    code: 200
    input: ["limit?", "offset?", "farm_id?", "status?"]
    output: SurplusOffer[]
    side_effects: []
  - method: GET
    path: "/glean/offers/{id}"
    description: "Fetch one offer"
    roles: [ProgramCoordinator, GrantReviewer, FoodSafetyOfficer, CrewLeader]
    code: 200
    input: []
    output: SurplusOffer
    side_effects: []
  - method: POST
    path: "/glean/offers/{id}/cancel"
    description: "Cancel an offer in OFFERED or SCHEDULED; cascades to draft/open events and their assignments, releases containers and vehicles"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: SurplusOffer
    side_effects: ["cascade-cancel events per state_machines.SurplusOffer"]
  - method: POST
    path: "/glean/offers/{id}/close"
    description: "Close a GLEANED offer; computes salvage_ratio, mints the DonationReceipt, rolls pounds into Farm.lifetime_donated_lbs. OCC-guarded."
    roles: [ProgramCoordinator]
    code: 200
    input: ["expected_offer_version"]
    output: SurplusOffer
    side_effects:
      - "create DonationReceipt per calculations.donation_valuation"
      - "Farm.lifetime_donated_lbs += receipt_lbs; Farm.version += 1"
      - "increments SurplusOffer.version by 1"
  - method: GET
    path: "/glean/offers/{id}/receipt"
    description: "Fetch the DonationReceipt minted at close (array of 0 or 1)"
    roles: [ProgramCoordinator, GrantReviewer]
    code: 200
    input: []
    output: DonationReceipt[]
    side_effects: []
  - method: GET
    path: "/glean/farms/{id}/receipts"
    description: "Reverse-reachability: donation receipts issued to a farm"
    roles: [ProgramCoordinator, GrantReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: DonationReceipt[]
    side_effects: []
  - method: GET
    path: "/glean/farms/{id}/offers"
    description: "Reverse-reachability: offers of a farm"
    roles: [ProgramCoordinator, GrantReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: SurplusOffer[]
    side_effects: []
  - method: POST
    path: "/glean/volunteers"
    description: "Register a volunteer"
    roles: [ProgramCoordinator]
    code: 201
    input: ["full_name", "email", "crew_leader_certified?"]
    output: Volunteer
    side_effects: []
  - method: GET
    path: "/glean/volunteers"
    description: "List volunteers; optional email filter"
    roles: [ProgramCoordinator]
    code: 200
    input: ["limit?", "offset?", "email?"]
    output: Volunteer[]
    side_effects: []
  - method: GET
    path: "/glean/volunteers/{id}"
    description: "Fetch one volunteer"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Volunteer
    side_effects: []
  - method: POST
    path: "/glean/volunteers/{id}/reinstate"
    description: "SUSPENDED -> ACTIVE; resets no_show_count"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Volunteer
    side_effects: ["Volunteer.no_show_count = 0"]
  - method: GET
    path: "/glean/volunteers/{id}/waivers"
    description: "Reverse-reachability: waivers signed by a volunteer"
    roles: [ProgramCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: Waiver[]
    side_effects: []
  - method: POST
    path: "/glean/waivers"
    description: "Sign a liability waiver for an event; witness must differ from signer (segregation of duties)"
    roles: [Volunteer]
