              payload: { backhaul_offer_id: "${offer_y}", expected_trip_version: "${v_after_accept}" }
              as: TransportManager
              captures: { relink_offer: $.data.backhaul_offer_id, relink_credit: $.data.backhaul_credit_cents, v_after_relink: $.data.version }
            - call: "GET /fleet/backhaul-offers/${offer_x}"
              payload: {}
              as: FleetPlanner
              captures: { x_status_after: $.data.status, x_round_after: $.data.review_round, x_exception_after: $.data.margin_exception_approved, x_cm_after: $.data.contribution_margin_cents }
            - call: "POST /fleet/backhaul-offers/${offer_y}/accept"
