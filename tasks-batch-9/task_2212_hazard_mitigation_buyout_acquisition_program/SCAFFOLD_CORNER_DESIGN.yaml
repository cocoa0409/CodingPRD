        distinguishing_aspect: |
          Five distinct refusals share one error id and one project: approve and return before
          submission, a program-income entry before approval, a second submit after SUBMITTED, and a
          closeout INITIATE from SUBMITTED - and after approval the same 409 blocks a further parcel
