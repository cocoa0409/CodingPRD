      - name: live_space_change_control_errors_mop_required_risk_class_and_locked_posture
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_MOP_REQUIRED] (409, a live-space write is attempted in a LIVE hall without a covering IN_EXECUTION method of procedure)"
          - "errors[ERR_RISK_CLASS_TOO_LOW] (422, busway or cooling work in a LIVE hall is submitted with risk_class other than HIGH)"
          - "errors[ERR_RELEASE_POSTURE_BLOCKED] (409, a release packet is accepted while hall.release_posture != OPEN or a POWERED rack of the cage is short a feed)"
          - "calculations[hall_release_posture]: an IN_EXECUTION MOP or an AT_RISK rack drives release_posture to LOCKED"
        distinguishing_aspect: "All three codes only exist once the hall is LIVE, and each is about coverage rather than permission: the same PDU derate write that is routine in FIT_OUT becomes 409 ERR_MOP_REQUIRED in a LIVE hall and only succeeds while a MOP targeting THAT PDU is IN_EXECUTION (a MOP on the busway does not cover it); a LIVE-space busway MOP is refused at submit unless it is HIGH risk; and operations acceptance is refused while any MOP of the hall is executing, then succeeds unchanged after the MOP closes. An implementation that treats release_posture as a static flag, or that lets any IN_EXECUTION MOP authorise any live-space write, fails."
          # (falsifiable: swap the covering MOP's target from PDU-A1 to BW-A1 and the final derate write must go back to 409)
        test_recipe:
          setup: "Hall CX79 (MULTI_TENANT, design 400.00 kW) driven all the way to LIVE: canonical FIT_OUT build, cage CG-1 fully secured (CAM-1 covering 40.0 of 40.0 m, readers Z1 and Z2), rack R-1-1 (15.00 kW, two feeds, asset tag AT-0301) POWERED, a SUBMITTED release packet for CG-1, then L4 and L5 commissioning packages each certified over a passing load bank run, which bubbles the hall to LIVE with release_posture OPEN."
          setup_api_calls:
            - name: set_clock
              call: "POST /_clock/set_current_utc"
              as: FacilityPlanner
              payload: { current_utc: "2026-08-01T00:00:00Z" }
            - name: create_hall
              call: "POST /halls"
              as: FacilityPlanner
              payload: { name: "Live Change Control Hall", code: "CX79", tenant_mode: "MULTI_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              captures: { hall_id: "$.data.id" }
            - name: create_tenant
              call: "POST /tenants"
              as: FacilityPlanner
              payload: { name: "Tenant 79", code: "TN79", contracted_kw: 100.00, contract_start_date: "2026-08-01" }
              captures: { tenant_id: "$.data.id" }
            - name: create_pdu_a
              call: "POST /pdus"
              as: ElectricalContractor
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              captures: { pdu_a: "$.data.id" }
            - name: create_pdu_b
              call: "POST /pdus"
              as: ElectricalContractor
              payload: { hall_id: "${hall_id}", name: "PDU-B1", feed_side: "B", rated_kw: 300.00 }
              captures: { pdu_b: "$.data.id" }
            - name: commission_pdu_a
              call: "PATCH /pdus/${pdu_a}"
              as: ElectricalContractor
              payload: { measured_derate_factor: 1.00 }
            - name: commission_pdu_b
              call: "PATCH /pdus/${pdu_b}"
