            - call: "POST /portfolio/reversion-assessments/${assess_e_id}/holdback"
              payload: { acknowledged_holdback_cents: 1000000 }
              as: AssetManager
              as_user_id: "am-2"
            - call: "POST /portfolio/reversion-assessments/${assess_f_id}/holdback"
