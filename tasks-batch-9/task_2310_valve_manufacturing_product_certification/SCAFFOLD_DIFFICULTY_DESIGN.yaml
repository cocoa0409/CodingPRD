      - name: component_creation_blocked_by_qualification_pressure_class_ceiling
        grounds:
          - validations[priority=41]
          - state_machines.FoundryQualification.PENDING_to_QUALIFIED
          - entities.FoundryQualification.max_pressure_class
        distinguishing_aspect: |
          Entity pair Component <- FoundryQualification (a different pair, and a create rather than an action):
          the lot is RELEASED and the mass is available, but the foundry's QUALIFIED envelope tops out at class
          300 while the target model is class 600, so the create is refused on a third entity's field.
        test_recipe:
          setup:
            - "A foundry whose only QUALIFIED CASTING/CF8M qualification has max_pressure_class 300."
            - "A RELEASED heat lot of 500.000 kg from that foundry."
            - "A class 600 BALL model in CF8M as the component target."
          setup_api_calls:
            - call: "POST /valve-mfg/foundries"
