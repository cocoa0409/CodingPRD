# =============================================================================
# Task 1825 — Astronomy Club & Public Observing Night
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  1825. Astronomy Club & Public Observing Night (amateur astronomy club):
  membership & dues with observatory access levels, event scheduling around
  moon phase & weather cancellation, telescope loan program & training
  requirement, volunteer operator scheduling for public nights, light
  pollution advocacy & dark-sky measurements, equipment maintenance &
  collimation, group/school visit booking, safety protocol for solar
  observing

domain_name: astronomy-club-observing
api_prefix: /club

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: MembershipTier
    parent: null
    common_fields: true
    fields:
      - { name: code, type: enum, source: input, description: "Tier code", constraints: "STUDENT | INDIVIDUAL | FAMILY | PATRON" }
      - { name: annual_dues_cents, type: integer, source: input, description: "Annual dues in cents" }
      - { name: observatory_access_level, type: integer, source: input, description: "Observatory access level 1–3; 1=public nights only, 2=member nights, 3=unaccompanied keyholder", constraints: "1 <= level <= 3" }
      - { name: loan_privilege, type: boolean, source: input, description: "Whether tier grants telescope loan eligibility" }
      - { name: max_concurrent_loans, type: integer, source: input, description: "Max non-terminal loan reservations a member of this tier may hold at once", constraints: ">= 0" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: email, type: string, source: input, description: "Member email (unique)" }
      - { name: tier_id, type: string, source: input, description: "FK -> MembershipTier.id; member's current tier" }
      - { name: status, type: enum, source: system, description: "Membership lifecycle", constraints: "ACTIVE | SUSPENDED | LAPSED | RESIGNED" }
      - { name: dues_paid_through, type: datetime, source: computed, description: "Read-only: latest paid-through instant from posted DuesPayments" }
      - { name: effective_access_level, type: integer, source: computed, description: "Read-only: tier.observatory_access_level when status==ACTIVE, else 0" }
      - { name: no_show_strikes, type: integer, source: computed, description: "Read-only: count of no-show marks in trailing 365 days window; drives booking throttles" }
      - { name: joined_at, type: datetime, source: system, description: "Join timestamp (server-stamped at registration)" }

  - name: DuesInvoice
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; invoiced member" }
      - { name: period_start, type: datetime, source: input, description: "Coverage period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Coverage period end (exclusive)" }
      - { name: amount_cents, type: integer, source: computed, description: "Read-only: pro-rated dues per dues_proration calculation" }
      - { name: status, type: enum, source: system, description: "OPEN | PAID | VOID", constraints: "OPEN | PAID | VOID" }

  - name: DuesPayment
    parent: null
    common_fields: false
    fields:
      - { name: invoice_id, type: string, source: input, description: "FK -> DuesInvoice.id; invoice being settled" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; paying member (must match invoice.member_id)" }
      - { name: amount_cents, type: integer, source: input, description: "Tendered amount; overpayment credits member balance" }
      - { name: posted_at, type: datetime, source: system, description: "Server-stamped posting time (logical clock)" }
      - { name: credit_applied_cents, type: integer, source: system, description: "Portion of a prior overpayment credit consumed by this settlement" }

  - name: Telescope
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Equipment display name" }
      - { name: equipment_class, type: enum, source: input, description: "Certification class required to borrow or operate", constraints: "REFRACTOR | REFLECTOR | SCT | DOBSONIAN | SOLAR_SCOPE" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | RESERVED | ON_LOAN | MAINTENANCE | RETIRED", constraints: "AVAILABLE | RESERVED | ON_LOAN | MAINTENANCE | RETIRED" }
      - { name: collimation_due_at, type: datetime, source: computed, description: "Read-only: last collimation verification + COLLIMATION_INTERVAL_DAYS (180); initialized to created_at + 180 days (new inventory assumed freshly collimated); drives maintenance gating" }
      - { name: condition_score, type: integer, source: computed, description: "Read-only: 100 minus cumulative maintenance deductions; floor 0" }

  - name: TrainingCertification
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; certified member" }
      - { name: equipment_class, type: enum, source: input, description: "Certified equipment class", constraints: "REFRACTOR | REFLECTOR | SCT | DOBSONIAN | SOLAR_SCOPE" }
      - { name: issued_at, type: datetime, source: system, description: "Server-stamped issuance time" }
      - { name: expires_at, type: datetime, source: input, description: "Expiry instant; certification unusable at/after this time" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | REVOKED", constraints: "ACTIVE | EXPIRED | REVOKED" }

  - name: LoanReservation
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; borrowing member" }
      - { name: telescope_id, type: string, source: input, description: "FK -> Telescope.id; reserved telescope" }
      - { name: window_start, type: datetime, source: input, description: "Loan window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Loan window end (exclusive)" }
      - { name: status, type: enum, source: system, description: "RESERVED | CHECKED_OUT | RETURNED | OVERDUE | CANCELLED", constraints: "RESERVED | CHECKED_OUT | RETURNED | OVERDUE | CANCELLED" }
      - { name: checkout_at, type: datetime, source: system, description: "Server-stamped actual checkout instant; null until checked out" }
      - { name: returned_at, type: datetime, source: system, description: "Server-stamped return instant; null until returned" }
      - { name: overdue_fees_cents, type: integer, source: computed, description: "Read-only: accrued late fee per overdue_fee calculation" }

  - name: MaintenanceTicket
    parent: null
    common_fields: true
    fields:
      - { name: telescope_id, type: string, source: input, description: "FK -> Telescope.id; telescope under service" }
      - { name: kind, type: enum, source: input, description: "COLLIMATION | REPAIR | CLEANING", constraints: "COLLIMATION | REPAIR | CLEANING" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH", constraints: "LOW | MEDIUM | HIGH" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_PROGRESS | VERIFICATION | CLOSED", constraints: "OPEN | IN_PROGRESS | VERIFICATION | CLOSED" }
      - { name: opened_at, type: datetime, source: system, description: "Server-stamped open time" }
      - { name: closed_at, type: datetime, source: system, description: "Server-stamped close time; null until closed" }
      - { name: condition_delta, type: integer, source: input, description: "Signed adjustment applied to Telescope.condition_score on close (negative for damage found)" }

  - name: ObservingEvent
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Event title" }
      - { name: event_kind, type: enum, source: input, description: "PUBLIC_NIGHT | MEMBER_NIGHT | SOLAR_SESSION", constraints: "PUBLIC_NIGHT | MEMBER_NIGHT | SOLAR_SESSION" }
      - { name: window_start, type: datetime, source: input, description: "Event window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Event window end (exclusive)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SCHEDULED | CONFIRMED | CANCELLED | COMPLETED", constraints: "DRAFT | SCHEDULED | CONFIRMED | CANCELLED | COMPLETED" }
      - { name: moon_illumination_pct, type: integer, source: input, description: "Expected moon illumination 0–100 for the event night; gates PUBLIC_NIGHT scheduling" }
      - { name: weather_cancellation_pct, type: integer, source: system, description: "Latest forecast cancellation probability recorded via weather check; 0–100" }
      - { name: min_operators, type: integer, source: input, description: "Minimum confirmed operator coverage required to CONFIRM", constraints: ">= 1" }
      - { name: confirmed_operator_count, type: integer, source: computed, description: "Read-only: count of EventOperatorAssignments in CONFIRMED status for this event" }
      - { name: cancellation_reason, type: enum, source: system, description: "WEATHER | LOW_COVERAGE | MOON | OTHER; null unless CANCELLED", constraints: "WEATHER | LOW_COVERAGE | MOON | OTHER | null" }

  - name: EventOperatorAssignment
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> ObservingEvent.id; event being staffed" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; volunteer operator" }
      - { name: telescope_id, type: string, source: input, description: "FK -> Telescope.id; telescope the operator will run" }
      - { name: status, type: enum, source: system, description: "INVITED | CONFIRMED | DECLINED | NO_SHOW | WITHDRAWN", constraints: "INVITED | CONFIRMED | DECLINED | NO_SHOW | WITHDRAWN" }
      - { name: invited_at, type: datetime, source: system, description: "Server-stamped invite time" }

  - name: GroupVisitBooking
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> ObservingEvent.id; host event (PUBLIC_NIGHT only)" }
      - { name: group_name, type: string, source: input, description: "School/organization name" }
      - { name: party_size, type: integer, source: input, description: "Number of attendees", constraints: ">= 1" }
      - { name: contact_member_id, type: string, source: input, description: "FK -> Member.id; sponsoring member" }
      - { name: deposit_cents, type: integer, source: computed, description: "Read-only: deposit per group_deposit calculation" }
      - { name: status, type: enum, source: system, description: "PENDING | CONFIRMED | CANCELLED | COMPLETED | NO_SHOW", constraints: "PENDING | CONFIRMED | CANCELLED | COMPLETED | NO_SHOW" }

  - name: SkyQualityReading
    parent: null
    common_fields: false
    fields:
      - { name: taken_by_member_id, type: string, source: input, description: "FK -> Member.id; member who recorded the reading" }
      - { name: event_id, type: string, source: input, description: "FK -> ObservingEvent.id; event during which the reading was taken" }
      - { name: sqm_value, type: number, source: input, description: "Sky Quality Meter mag/arcsec^2 reading, 10.00–22.99", constraints: "10.00 <= v <= 22.99" }
      - { name: taken_at, type: datetime, source: system, description: "Server-stamped reading time (logical clock)" }

  - name: DarkSkyReport
    parent: null
    common_fields: true
    fields:
      - { name: period_start, type: datetime, source: input, description: "Report window start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Report window end (exclusive)" }
      - { name: status, type: enum, source: system, description: "OPEN | FINALIZED", constraints: "OPEN | FINALIZED" }
      - { name: reading_count, type: integer, source: computed, description: "Read-only: readings swept into this report" }
      - { name: median_sqm, type: number, source: computed, description: "Read-only: per dark_sky_median calculation (provisional while OPEN, final when FINALIZED)" }
      - { name: advocacy_grade, type: enum, source: computed, description: "Read-only: letter grade A–F from median_sqm band", constraints: "A | B | C | D | F" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    initial_state: ACTIVE
    terminal_states: [RESIGNED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when logical clock passes dues_paid_through + GRACE_PERIOD_DAYS while status==ACTIVE)"
        actor: system
        preconditions:
          - "logical clock >= Member.dues_paid_through + GRACE_PERIOD_DAYS"
        side_effects:
          - "Member.effective_access_level recomputes to 0"
          - "Every LoanReservation of this member in status RESERVED -> CANCELLED (releases Telescope per its own cascade)"
          - "Every EventOperatorAssignment of this member in status INVITED or CONFIRMED -> WITHDRAWN (host event confirmed_operator_count recomputes per operator_coverage)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /club/members/{memberId}/reinstate"
        actor: ClubOfficer
        preconditions:
          - "Member.status == SUSPENDED"
          - "logical clock < Member.dues_paid_through (a DuesPayment posted while suspended brings dues_paid_through forward)"
        side_effects:
          - "Member.effective_access_level recomputes to tier.observatory_access_level"
      - from: ACTIVE
        to: LAPSED
        trigger: "system (automatic when logical clock passes dues_paid_through + LAPSE_PERIOD_DAYS while status==ACTIVE or SUSPENDED)"
        actor: system
        preconditions:
          - "logical clock >= Member.dues_paid_through + LAPSE_PERIOD_DAYS"
        side_effects:
          - "Member.effective_access_level recomputes to 0"
      - from: SUSPENDED
        to: LAPSED
        trigger: "system (automatic when logical clock passes dues_paid_through + LAPSE_PERIOD_DAYS)"
        actor: system
        preconditions: []
        side_effects:
          - "Member.effective_access_level recomputes to 0"
      - from: ACTIVE
        to: RESIGNED
        trigger: "POST /club/members/{memberId}/resign"
        actor: Member
        preconditions:
          - "Member.status == ACTIVE"
          - "No LoanReservation of this member in status CHECKED_OUT or OVERDUE (ERR_LOANS_OUTSTANDING)"
        side_effects:
          - "Every LoanReservation of this member in status RESERVED -> CANCELLED"
          - "Every EventOperatorAssignment of this member in status INVITED or CONFIRMED -> WITHDRAWN"
      - from: SUSPENDED
        to: RESIGNED
        trigger: "POST /club/members/{memberId}/resign"
        actor: Member
        preconditions:
          - "No LoanReservation of this member in status CHECKED_OUT or OVERDUE (ERR_LOANS_OUTSTANDING)"
        side_effects: []
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /club/dues-payments (a posted payment covering through a future instant revives the member)"
        actor: Member
        preconditions:
          - "Payment settles an OPEN invoice whose period_end > logical clock"
        side_effects:
          - "Member.dues_paid_through recomputes"
          - "Member.effective_access_level recomputes to tier.observatory_access_level"

  - entity: DuesInvoice
    initial_state: OPEN
    terminal_states: [PAID, VOID]
    transitions:
      - from: OPEN
        to: PAID
        trigger: "POST /club/dues-payments (payment covers invoice amount_cents in full)"
        actor: Member
        preconditions:
          - "DuesInvoice.status == OPEN"
        side_effects:
          - "Member.dues_paid_through := max(current dues_paid_through, invoice.period_end)"
          - "If Member.status == LAPSED and invoice.period_end > logical clock: Member -> ACTIVE"
      - from: OPEN
        to: VOID
        trigger: "POST /club/dues-invoices/{invoiceId}/void"
        actor: ClubOfficer
        preconditions:
          - "DuesInvoice.status == OPEN"
        side_effects: []

  - entity: Telescope
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "system (on LoanReservation creation naming this telescope)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESERVED
        to: ON_LOAN
        trigger: "POST /club/loan-reservations/{loanId}/checkout"
        actor: EquipmentChair
        preconditions:
          - "LoanReservation.status == RESERVED"
        side_effects: []
      - from: ON_LOAN
        to: AVAILABLE
        trigger: "POST /club/loan-reservations/{loanId}/return (telescope returns with no damage ticket opened)"
        actor: EquipmentChair
        preconditions: []
        side_effects: []
      - from: ON_LOAN
        to: MAINTENANCE
        trigger: "POST /club/loan-reservations/{loanId}/return with damage_reported=true (opens MaintenanceTicket)"
        actor: EquipmentChair
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "POST /club/maintenance-tickets (ticket opened while telescope AVAILABLE; collimation due also gates reservation creation)"
        actor: EquipmentChair
        preconditions: []
        side_effects: []
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /club/maintenance-tickets/{ticketId}/close (ticket CLOSED and telescope passes verification)"
        actor: EquipmentChair
        preconditions:
          - "All MaintenanceTickets for this telescope are CLOSED"
        side_effects:
          - "Telescope.condition_score := max(0, 100 + sum of condition_delta across all CLOSED tickets)"
          - "Telescope.collimation_due_at := logical clock + COLLIMATION_INTERVAL_DAYS when the closed ticket kind == COLLIMATION"
      - from: RESERVED
        to: AVAILABLE
        trigger: "system (on LoanReservation -> CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /club/telescopes/{telescopeId}/retire"
        actor: EquipmentChair
        preconditions:
          - "Telescope.status == AVAILABLE"
          - "No LoanReservation for this telescope in status RESERVED, CHECKED_OUT, or OVERDUE"
        side_effects: []
      - from: MAINTENANCE
        to: RETIRED
        trigger: "POST /club/telescopes/{telescopeId}/retire (write-off while under repair)"
        actor: EquipmentChair
        preconditions:
          - "No LoanReservation for this telescope in status CHECKED_OUT or OVERDUE"
        side_effects:
          - "All non-CLOSED MaintenanceTickets for this telescope -> CLOSED with condition_delta applied"

  - entity: TrainingCertification
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when logical clock >= expires_at)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /club/training-certifications/{certId}/revoke"
        actor: EquipmentChair
        preconditions:
          - "TrainingCertification.status == ACTIVE"
        side_effects:
          - "If the member holds LoanReservations in RESERVED whose telescope.equipment_class matches: those reservations -> CANCELLED"

  - entity: LoanReservation
    initial_state: RESERVED
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: RESERVED
        to: CHECKED_OUT
        trigger: "POST /club/loan-reservations/{loanId}/checkout"
        actor: EquipmentChair
        preconditions:
          - "LoanReservation.status == RESERVED"
          - "logical clock >= window_start and logical clock < window_end"
          - "Telescope.status == RESERVED"
          - "Member.status == ACTIVE"
        side_effects:
          - "Telescope -> ON_LOAN"
          - "checkout_at := logical clock"
      - from: CHECKED_OUT
        to: OVERDUE
        trigger: "system (automatic when logical clock >= window_end while status==CHECKED_OUT)"
        actor: system
        preconditions: []
        side_effects:
          - "overdue_fees_cents begins accruing per overdue_fee calculation"
      - from: CHECKED_OUT
        to: RETURNED
        trigger: "POST /club/loan-reservations/{loanId}/return"
        actor: EquipmentChair
        preconditions:
          - "LoanReservation.status == CHECKED_OUT"
        side_effects:
          - "returned_at := logical clock"
          - "Telescope -> AVAILABLE (or MAINTENANCE if damage_reported=true, which also opens a MaintenanceTicket)"
      - from: OVERDUE
        to: RETURNED
        trigger: "POST /club/loan-reservations/{loanId}/return"
        actor: EquipmentChair
        preconditions:
          - "LoanReservation.status == OVERDUE"
        side_effects:
          - "returned_at := logical clock"
          - "overdue_fees_cents finalized per overdue_fee calculation"
          - "Telescope -> AVAILABLE (or MAINTENANCE if damage_reported=true)"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /club/loan-reservations/{loanId}/cancel (borrower or officer); also cascaded from Member suspension/resignation and certification revocation"
        actor: Member
        preconditions:
          - "LoanReservation.status == RESERVED"
        side_effects:
          - "Telescope -> AVAILABLE"

  - entity: MaintenanceTicket
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /club/maintenance-tickets/{ticketId}/start"
        actor: EquipmentChair
        preconditions:
          - "MaintenanceTicket.status == OPEN"
        side_effects: []
      - from: IN_PROGRESS
        to: VERIFICATION
        trigger: "POST /club/maintenance-tickets/{ticketId}/submit-verification"
        actor: EquipmentChair
        preconditions:
          - "MaintenanceTicket.status == IN_PROGRESS"
        side_effects: []
      - from: VERIFICATION
        to: IN_PROGRESS
        trigger: "POST /club/maintenance-tickets/{ticketId}/reopen (verification failed — work continues)"
        actor: EquipmentChair
        preconditions:
          - "MaintenanceTicket.status == VERIFICATION"
        side_effects: []
      - from: VERIFICATION
        to: CLOSED
        trigger: "POST /club/maintenance-tickets/{ticketId}/close"
        actor: EquipmentChair
        preconditions:
          - "MaintenanceTicket.status == VERIFICATION"
        side_effects:
          - "closed_at := logical clock"
          - "Telescope.condition_score recomputed across CLOSED tickets"
          - "If no other non-CLOSED ticket remains for the telescope: Telescope -> AVAILABLE"

  - entity: ObservingEvent
    initial_state: DRAFT
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /club/observing-events/{eventId}/schedule"
        actor: EventCoordinator
        preconditions:
          - "ObservingEvent.status == DRAFT"
          - "If event_kind == PUBLIC_NIGHT: moon_illumination_pct <= MOON_ILLUMINATION_LIMIT (ERR_MOON_TOO_BRIGHT)"
          - "If event_kind == SOLAR_SESSION: window lies entirely within civil daylight — the server uses a fixed daylight table for the observatory site: every date's civil daylight is [06:00Z, 20:00Z) (window_start >= 06:00Z and window_end <= 20:00Z of the same UTC date; ERR_NOT_DAYLIGHT_WINDOW)"
        side_effects: []
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /club/observing-events/{eventId}/confirm"
        actor: EventCoordinator
        preconditions:
          - "ObservingEvent.status == SCHEDULED"
          - "confirmed_operator_count >= min_operators (ERR_INSUFFICIENT_OPERATORS)"
          - "weather_cancellation_pct < WEATHER_CANCEL_THRESHOLD (ERR_WEATHER_RISK)"
          - "If event_kind == SOLAR_SESSION: at least one CONFIRMED operator holds an ACTIVE SOLAR_SCOPE TrainingCertification (ERR_NO_SOLAR_CERTIFIED_OPERATOR)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /club/observing-events/{eventId}/cancel"
        actor: EventCoordinator
        preconditions: []
        side_effects:
          - "Every EventOperatorAssignment of this event in INVITED or CONFIRMED -> WITHDRAWN"
          - "Every GroupVisitBooking of this event in PENDING or CONFIRMED -> CANCELLED"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /club/observing-events/{eventId}/cancel (weather cancellation may also be triggered by POST /club/observing-events/{eventId}/weather-check recording weather_cancellation_pct >= WEATHER_CANCEL_THRESHOLD)"
        actor: EventCoordinator
        preconditions: []
        side_effects:
          - "Every EventOperatorAssignment of this event in INVITED or CONFIRMED -> WITHDRAWN"
          - "Every GroupVisitBooking of this event in CONFIRMED -> CANCELLED with deposit refund note"
      - from: CONFIRMED
        to: SCHEDULED
        trigger: "system (automatic when confirmed_operator_count falls below min_operators due to WITHDRAWN/NO_SHOW — coverage lapse)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /club/observing-events/{eventId}/complete"
        actor: EventCoordinator
        preconditions:
          - "ObservingEvent.status == CONFIRMED"
          - "logical clock >= window_end"
        side_effects:
          - "Every GroupVisitBooking of this event in CONFIRMED -> COMPLETED"
          - "Every EventOperatorAssignment still CONFIRMED remains CONFIRMED (attendance recorded separately via no-show marking)"
      - from: SCHEDULED
        to: DRAFT
        trigger: "POST /club/observing-events/{eventId}/unschedule (send back for replanning)"
        actor: EventCoordinator
        preconditions:
          - "ObservingEvent.status == SCHEDULED"
        side_effects: []

  - entity: EventOperatorAssignment
    initial_state: INVITED
    terminal_states: [DECLINED, NO_SHOW, WITHDRAWN]
    transitions:
      - from: INVITED
        to: CONFIRMED
        trigger: "POST /club/event-operator-assignments/{assignmentId}/accept"
        actor: Member
        preconditions:
          - "EventOperatorAssignment.member_id == acting Member"
          - "EventOperatorAssignment.status == INVITED"
          - "Member.status == ACTIVE"
          - "Member holds ACTIVE TrainingCertification for the telescope's equipment_class (ERR_CERTIFICATION_REQUIRED)"
          - "No other CONFIRMED assignment of this member overlaps the host event window (ERR_OPERATOR_OVERLAP)"
        side_effects:
          - "Host ObservingEvent.confirmed_operator_count recomputed per operator_coverage"
      - from: INVITED
        to: DECLINED
        trigger: "POST /club/event-operator-assignments/{assignmentId}/decline"
        actor: Member
        preconditions:
          - "EventOperatorAssignment.member_id == acting Member"
          - "EventOperatorAssignment.status == INVITED"
        side_effects: []
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "POST /club/event-operator-assignments/{assignmentId}/withdraw; also cascaded from Member suspension/resignation and event cancellation"
        actor: Member
        preconditions:
          - "EventOperatorAssignment.status == CONFIRMED"
        side_effects:
          - "Host ObservingEvent.confirmed_operator_count recomputed; if host was CONFIRMED and count drops below min_operators, host -> SCHEDULED"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /club/event-operator-assignments/{assignmentId}/mark-no-show"
        actor: EventCoordinator
        preconditions:
          - "EventOperatorAssignment.status == CONFIRMED"
          - "Host ObservingEvent.status == COMPLETED"
        side_effects:
          - "Member.no_show_strikes recomputed per no_show_strikes calculation"
          - "Host ObservingEvent.confirmed_operator_count recomputed (NO_SHOW no longer counts)"

  - entity: GroupVisitBooking
    initial_state: PENDING
    terminal_states: [CANCELLED, COMPLETED, NO_SHOW]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /club/group-visit-bookings/{bookingId}/confirm"
        actor: EventCoordinator
        preconditions:
          - "GroupVisitBooking.status == PENDING"
          - "Host ObservingEvent.status IN {SCHEDULED, CONFIRMED}"
          - "Aggregate confirmed party_size across this event's CONFIRMED bookings + this party_size <= GROUP_CAPACITY_PER_EVENT (ERR_EVENT_GROUP_CAPACITY)"
        side_effects: []
      - from: PENDING
        to: CANCELLED
        trigger: "POST /club/group-visit-bookings/{bookingId}/cancel"
        actor: Member
        preconditions:
          - "GroupVisitBooking.contact_member_id == acting Member or actor is EventCoordinator"
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /club/group-visit-bookings/{bookingId}/cancel; also cascaded from event cancellation"
        actor: Member
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system (cascade from host event completion)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /club/group-visit-bookings/{bookingId}/mark-no-show"
        actor: EventCoordinator
        preconditions:
          - "GroupVisitBooking.status == CONFIRMED"
          - "Host ObservingEvent.status == COMPLETED"
        side_effects:
          - "contact Member.no_show_strikes recomputed per no_show_strikes calculation"

  - entity: DarkSkyReport
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /club/dark-sky-reports/{reportId}/finalize"
        actor: ClubOfficer
        preconditions:
          - "DarkSkyReport.status == OPEN"
          - "reading_count >= MIN_READINGS_PER_REPORT (ERR_INSUFFICIENT_READINGS)"
        side_effects:
          - "median_sqm and advocacy_grade frozen per dark_sky_median final variant"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: event-confirm-stale-version
    parent_entity: ObservingEvent
    write_endpoint: "POST /club/observing-events/{eventId}/confirm"
    occ_field: "expected_event_version"
    description: |
      Confirming an ObservingEvent whose version has advanced since the client
      last read it is rejected. Operator accept/withdraw cascades bump the
      event's version whenever confirmed_operator_count changes, so a confirm
      carrying a stale expected_event_version would silently rely on a
      coverage count that no longer matches the server's.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: telescope-update-stale-version
    parent_entity: Telescope
    write_endpoint: "PUT /club/telescopes/{telescopeId}"
    occ_field: "expected_telescope_version"
    description: |
      Updating a Telescope's descriptive fields whose version has advanced
      since the client last read it is rejected. Reservation/checkout/return
      cascades bump the telescope's version on every status change, so a
      stale expected_telescope_version means the client edited from a
      superseded snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: dues_proration
    trigger: "DuesInvoice creation (POST /club/dues-invoices)"
    algorithm: tiered_pricing
    formula: |
      days_total = (period_end - period_start).days
      days_full_year = 365
      # Variant base (FULL_PERIOD): charge the whole annual dues when the
      # invoice covers a full membership year.
      # Variant MID_YEAR: pro-rate linearly by day count, rounding per the
      # pinned order below.
      raw_cents = tier.annual_dues_cents * days_total / days_full_year
      amount_cents = round_half_up(raw_cents)   # round ONCE, at the end
      # Pinned rounding order: compute the unrounded rational first, then a
      # single round_half_up to integer cents. (Rounding per-month then
      # summing is a different, forbidden interpretation.)
    input_set: "The member's MembershipTier (annual_dues_cents) and the invoice period; no status filtering applies"
    constants:
      DAYS_FULL_YEAR: 365
    precision: "integer cents, round_half_up, single final rounding"
    variants:
      - name: full_period
        when: "days_total == 365 (standard annual renewal)"
        difference: "amount_cents := tier.annual_dues_cents exactly, no proration arithmetic"
      - name: mid_year
        when: "days_total != 365 (new member joining mid-cycle)"
        difference: "amount_cents := round_half_up(annual_dues_cents * days_total / 365); can differ from the naive monthly-rounding interpretation by whole cents"

  - name: overdue_fee
    trigger: "LoanReservation CHECKED_OUT->OVERDUE (accrual start), OVERDUE->RETURNED (finalization), and GET of an OVERDUE loan (provisional read)"
    algorithm: threshold
    formula: |
      days_late = max(0, (logical_clock_or_returned_at - window_end).days)
      billable_days = max(0, days_late - GRACE_DAYS)
      overdue_fees_cents = billable_days * DAILY_FEE_CENTS
      # Boundary precision: the first GRACE_DAYS days are free;
      # days_late == GRACE_DAYS yields 0; days_late == GRACE_DAYS + 1 yields
      # exactly DAILY_FEE_CENTS (>= boundary, not >).
    input_set: "The single LoanReservation; uses window_end and returned_at (or logical clock for provisional reads)"
    constants:
      GRACE_DAYS: 2
      DAILY_FEE_CENTS: 500
      FEE_CAP_CENTS: 10000
    precision: "integer cents"
    variants:
      - name: provisional
        when: "Read of a loan still in OVERDUE status"
        difference: "Computed against logical clock; continues to grow; not persisted"
      - name: final
        when: "Return transition OVERDUE->RETURNED"
        difference: "Computed against returned_at, then capped at FEE_CAP_CENTS and persisted; provisional reads are uncapped"

  - name: operator_coverage
    trigger: "EventOperatorAssignment transitions (accept, withdraw, no-show) and ObservingEvent confirm"
    algorithm: aggregation
    formula: |
      confirmed_operator_count = count(assignments a where a.event_id == event.id
                                   and a.status == CONFIRMED)
      # Coverage sufficiency for confirm: confirmed_operator_count >= min_operators
      # (boundary: exactly min_operators passes; min_operators - 1 fails)
    input_set: "EventOperatorAssignments of the event in status CONFIRMED only (INVITED, DECLINED, NO_SHOW, WITHDRAWN excluded)"
    constants: {}
    precision: "integer count"

  - name: group_deposit
    trigger: "GroupVisitBooking creation (POST /club/group-visit-bookings)"
    algorithm: tiered_pricing
    formula: |
      # Tiered by party_size, MARGINAL allocation across tiers:
      #   first 10 attendees: 0 cents each
      #   attendees 11..30:  1000 cents each
      #   attendees 31+:     2000 cents each
      tier1 = min(party_size, 10) * 0
      tier2 = max(0, min(party_size, 30) - 10) * 1000
      tier3 = max(0, party_size - 30) * 2000
      deposit_cents = tier1 + tier2 + tier3
      # Marginal, not average-rate: a party of 31 pays
      # 0 + 20*1000 + 1*2000 = 22000, NOT 31*2000 = 62000.
    input_set: "party_size of the booking"
    constants:
      TIER1_FREE_UP_TO: 10
      TIER2_RATE_CENTS: 1000
      TIER2_UP_TO: 30
      TIER3_RATE_CENTS: 2000
    precision: "integer cents"

  - name: dark_sky_median
    trigger: "DarkSkyReport OPEN (provisional recompute on every reading swept in) and OPEN->FINALIZED (final freeze)"
    algorithm: aggregation
    formula: |
      readings = [r.sqm_value for r in SkyQualityReading
                  where r.taken_at >= period_start and r.taken_at < period_end]
      # Half-open window [period_start, period_end): a reading exactly at
      # period_end belongs to the NEXT report.
      readings_sorted = sort(readings ASC)   # ties irrelevant for median value
      n = len(readings_sorted)
      if n == 0: median_sqm = null
      elif n % 2 == 1: median_sqm = readings_sorted[(n-1)/2]
      else: median_sqm = round_half_up((readings_sorted[n/2 - 1] + readings_sorted[n/2]) / 2, 2)
      # advocacy_grade banding on median_sqm (higher SQM = darker sky):
      #   >= 21.50: A ; >= 20.50: B ; >= 19.50: C ; >= 18.50: D ; else F
      # Boundary: exactly 21.50 is A (>= band edges).
    input_set: "SkyQualityReadings with taken_at in [period_start, period_end); no status filter (readings are append-only)"
    constants:
      MIN_READINGS_PER_REPORT: 3
      GRADE_A_MIN: 21.50
      GRADE_B_MIN: 20.50
      GRADE_C_MIN: 19.50
      GRADE_D_MIN: 18.50
    precision: "2 decimal places, round_half_up (even-count average only)"
    variants:
      - name: provisional
        when: "Report OPEN: median recomputed on every newly swept reading"
        difference: "median_sqm can move as new readings arrive within the window; advocacy_grade recomputes with it"
      - name: final
        when: "Report FINALIZED"
        difference: "median_sqm and advocacy_grade frozen at finalize time; later readings inside the window do NOT change the frozen values"

  - name: no_show_strikes
    trigger: "EventOperatorAssignment CONFIRMED->NO_SHOW and GroupVisitBooking CONFIRMED->NO_SHOW; read during booking confirmation throttle"
    algorithm: chronological
    formula: |
      events = no-show marks on this Member ordered by mark instant ASC
                 (server-stamped at the mark-no-show call; ties broken by
                 mark instant then by the marked entity's created_at ASC)
      window_start = logical_clock - 365 days
      no_show_strikes = count(events where mark_instant >= window_start)
      # Rolling 365-day window: a strike 365 days old TODAY still counts;
      # after the logical clock passes mark_instant + 365d it drops off.
      # Throttle: members with no_show_strikes >= STRIKE_THROTTLE_LIMIT may
      # not create GroupVisitBookings (ERR_NO_SHOW_THROTTLED).
    input_set: "No-show marks (operator assignments in NO_SHOW + group bookings in NO_SHOW) whose member matches; window [logical_clock - 365d, logical_clock]"
    constants:
      STRIKE_WINDOW_DAYS: 365
      STRIKE_THROTTLE_LIMIT: 2
    precision: "integer count"

  - name: membership_clock_thresholds
    trigger: "logical clock advance (POST /club/_clock/set_current_utc)"
    algorithm: threshold
    formula: |
      # Dues-standing thresholds over Member.dues_paid_through:
      if logical_clock >= dues_paid_through + GRACE_PERIOD_DAYS and status == ACTIVE: -> SUSPENDED
      if logical_clock >= dues_paid_through + LAPSE_PERIOD_DAYS and status IN {ACTIVE, SUSPENDED}: -> LAPSED
      # Boundary: exactly at dues_paid_through + GRACE_PERIOD_DAYS the member
      # IS suspended (>=, inclusive); one second before, still ACTIVE.
    input_set: "All Members in non-terminal status (ACTIVE, SUSPENDED)"
    constants:
      GRACE_PERIOD_DAYS: 7
      LAPSE_PERIOD_DAYS: 37
      COLLIMATION_INTERVAL_DAYS: 180
      MOON_ILLUMINATION_LIMIT: 40
      WEATHER_CANCEL_THRESHOLD: 70
      GROUP_CAPACITY_PER_EVENT: 60
    precision: "day granularity on dates; whole-percent on thresholds"

  - name: condition_score_reconcile
    trigger: "MaintenanceTicket -> CLOSED (including retire cascade)"
    algorithm: aggregation
    formula: |
      condition_score = max(0, 100 + sum(t.condition_delta for t in MaintenanceTicket
                        where t.telescope_id == telescope.id and t.status == CLOSED))
      # Full recompute over ALL CLOSED tickets on every close — commutative,
      # idempotent, no incremental drift. A ticket's delta applies exactly once
      # regardless of IN_PROGRESS<->VERIFICATION loops.
      if closed_ticket.kind == COLLIMATION:
          telescope.collimation_due_at = logical_clock + COLLIMATION_INTERVAL_DAYS
    input_set: "MaintenanceTickets of the telescope in status CLOSED only (OPEN/IN_PROGRESS/VERIFICATION excluded)"
    constants:
      COLLIMATION_INTERVAL_DAYS: 180
    precision: "integer score, floor 0"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role is permitted for this endpoint per §1.5 roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path ids resolve to existing resources (validated left-to-right)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: existence, check: "Body-referenced ids (member_id, telescope_id, event_id, tier_id, invoice_id, contact_member_id) resolve to existing resources", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "POST/PUT endpoints with FK body fields" }
  - { priority: 5, category: business_constraint, check: "Required input fields present and well-typed; enum values within declared sets; numeric ranges honored (sqm 10.00–22.99; moon_illumination_pct 0–100; party_size >= 1; min_operators >= 1)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all POST/PUT endpoints" }
  - { priority: 6, category: state, check: "Target resource in a state from which the requested transition exists per §1.2", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: business_temporal, check: "Window sanity: window_start < window_end (strict), period_start < period_end (strict)", error_id: ERR_INVALID_WINDOW, http_status: 422, applies_to: "POST /club/loan-reservations, POST /club/observing-events, POST /club/dark-sky-reports, POST /club/dues-invoices" }
  - { priority: 8, category: business_safety, check: "Solar safety: SOLAR_SESSION events require window inside civil daylight and, at confirm, a CONFIRMED operator holding ACTIVE SOLAR_SCOPE certification", error_id: ERR_NO_SOLAR_CERTIFIED_OPERATOR, http_status: 422, applies_to: "POST /club/observing-events/{eventId}/confirm" }
  - { priority: 9, category: business_safety, check: "Certification gate: member accepting an operator assignment must hold ACTIVE TrainingCertification for the assigned telescope's equipment_class; likewise member creating a LoanReservation must hold ACTIVE certification for the telescope's class", error_id: ERR_CERTIFICATION_REQUIRED, http_status: 422, applies_to: "POST /club/event-operator-assignments/{assignmentId}/accept, POST /club/loan-reservations" }
  - { priority: 10, category: business_referential, check: "Member standing gate: member.status == ACTIVE for loan creation, assignment acceptance, group-booking creation; effective tier loan_privilege true for loan creation", error_id: ERR_MEMBER_NOT_IN_GOOD_STANDING, http_status: 422, applies_to: "POST /club/loan-reservations, POST /club/event-operator-assignments/{assignmentId}/accept, POST /club/group-visit-bookings" }
  - { priority: 11, category: business_constraint, check: "Telescope reservable: telescope.status == AVAILABLE and collimation_due_at > logical clock at loan creation", error_id: ERR_TELESCOPE_NOT_RESERVABLE, http_status: 409, applies_to: "POST /club/loan-reservations" }
  - { priority: 12, category: business_temporal, check: "Temporal overlap — loan windows: the borrowing member's own schedule. The new LoanReservation [window_start, window_end) must not intersect any non-terminal LoanReservation of the SAME MEMBER, regardless of telescope (a borrower cannot be responsible for two kits over one night). Half-open interval semantics: window_start == prior.window_end is legal (touching windows do not intersect). Telescope-level double-booking is prevented structurally by p11 (a telescope with a live reservation is RESERVED/ON_LOAN, not AVAILABLE)", error_id: ERR_LOAN_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /club/loan-reservations" }
  - { priority: 23, category: business_constraint, check: "Concurrent loan cap: count of the member's non-terminal LoanReservations (RESERVED, CHECKED_OUT, OVERDUE) must be < tier.max_concurrent_loans before creating another", error_id: ERR_LOAN_CAP_REACHED, http_status: 422, applies_to: "POST /club/loan-reservations" }
  - { priority: 13, category: business_temporal, check: "Temporal overlap — operator assignments: a member may hold at most one CONFIRMED assignment whose host event window intersects another CONFIRMED assignment's host window (closed-interval touch at exactly window_end == window_start counts as overlap because operators need teardown time)", error_id: ERR_OPERATOR_OVERLAP, http_status: 409, applies_to: "POST /club/event-operator-assignments/{assignmentId}/accept" }
  - { priority: 14, category: business_constraint, check: "Aggregate capacity: sum of party_size over the event's CONFIRMED GroupVisitBookings + new party_size <= GROUP_CAPACITY_PER_EVENT (60)", error_id: ERR_EVENT_GROUP_CAPACITY, http_status: 422, applies_to: "POST /club/group-visit-bookings/{bookingId}/confirm" }
  - { priority: 15, category: business_constraint, check: "Moon illumination gate: PUBLIC_NIGHT events require moon_illumination_pct <= 40 at schedule", error_id: ERR_MOON_TOO_BRIGHT, http_status: 422, applies_to: "POST /club/observing-events/{eventId}/schedule" }
  - { priority: 16, category: business_fiscal, check: "Payment sufficiency: DuesPayment amount_cents + available member credit >= invoice.amount_cents", error_id: ERR_PAYMENT_INSUFFICIENT, http_status: 422, applies_to: "POST /club/dues-payments" }
  - { priority: 17, category: business_fiscal, check: "Outstanding loans: member resigning must have no CHECKED_OUT/OVERDUE LoanReservations", error_id: ERR_LOANS_OUTSTANDING, http_status: 422, applies_to: "POST /club/members/{memberId}/resign" }
  - { priority: 18, category: business_constraint, check: "No-show throttle: contact member with no_show_strikes >= 2 may not create GroupVisitBooking", error_id: ERR_NO_SHOW_THROTTLED, http_status: 422, applies_to: "POST /club/group-visit-bookings" }
  - { priority: 19, category: business_constraint, check: "Report readiness: DarkSkyReport finalize requires reading_count >= 3", error_id: ERR_INSUFFICIENT_READINGS, http_status: 422, applies_to: "POST /club/dark-sky-reports/{reportId}/finalize" }
  - { priority: 20, category: business_temporal, check: "Weather risk gate: confirm requires latest weather_cancellation_pct < 70", error_id: ERR_WEATHER_RISK, http_status: 422, applies_to: "POST /club/observing-events/{eventId}/confirm" }
  - { priority: 21, category: business_constraint, check: "Operator coverage gate: confirm requires confirmed_operator_count >= min_operators", error_id: ERR_INSUFFICIENT_OPERATORS, http_status: 422, applies_to: "POST /club/observing-events/{eventId}/confirm" }
  - { priority: 22, category: business_temporal, check: "Daylight window gate: SOLAR_SESSION window must lie within civil daylight of the event date", error_id: ERR_NOT_DAYLIGHT_WINDOW, http_status: 422, applies_to: "POST /club/observing-events/{eventId}/schedule" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: /club/_clock/set_current_utc
    description: "Set the server logical clock. Startup default is 2026-08-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time. Setting the clock forward fires all time-based system transitions (dues suspension/lapse, certification expiry, loan OVERDUE)."
    roles: [ClubOfficer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["fires automatic transitions whose preconditions the new clock satisfies"]

  # --- MembershipTier ---
  - method: POST
    path: /club/membership-tiers
    description: "Create a membership tier"
    roles: [ClubOfficer]
    code: 201
    input: [code, annual_dues_cents, observatory_access_level, loan_privilege, max_concurrent_loans]
    output: MembershipTier
    side_effects: []
  - method: GET
    path: /club/membership-tiers/{tierId}
    description: "Fetch one tier"
    roles: [ClubOfficer, Member, EventCoordinator, EquipmentChair]
    code: 200
    input: []
    output: MembershipTier
    side_effects: []
  - method: GET
    path: /club/membership-tiers
    description: "List tiers"
    roles: [ClubOfficer, Member, EventCoordinator, EquipmentChair]
    code: 200
    input: ["limit?", "offset?"]
    output: MembershipTier[]
    side_effects: []

  # --- Member ---
  - method: POST
    path: /club/members
    description: "Register a member (initial status ACTIVE; dues_paid_through initialized to joined_at + 0 days, so first invoice is due immediately)"
    roles: [ClubOfficer]
    code: 201
    input: [full_name, email, tier_id]
    output: Member
    side_effects: []
  - method: GET
    path: /club/members/{memberId}
    description: "Fetch one member"
    roles: [ClubOfficer, Member, EventCoordinator, EquipmentChair]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: GET
    path: /club/members
    description: "List members; filter by status or tier_id"
    roles: [ClubOfficer, EventCoordinator, EquipmentChair]
    code: 200
    input: ["status?", "tier_id?", "limit?", "offset?"]
    output: Member[]
    side_effects: []
  - method: POST
    path: /club/members/{memberId}/reinstate
    description: "SUSPENDED -> ACTIVE once dues current"
    roles: [ClubOfficer]
    code: 200
    input: []
    output: Member
    side_effects: ["Member effective_access_level recompute"]
  - method: POST
    path: /club/members/{memberId}/resign
    description: "ACTIVE or SUSPENDED -> RESIGNED; cascades cancel reserved loans and withdraw assignments"
    roles: [Member, ClubOfficer]
    code: 200
    input: []
    output: Member
    side_effects: ["LoanReservation RESERVED -> CANCELLED (Telescope -> AVAILABLE)", "EventOperatorAssignment INVITED/CONFIRMED -> WITHDRAWN (event coverage recompute, possible CONFIRMED -> SCHEDULED)"]

  # --- Dues invoicing & payment ---
  - method: POST
    path: /club/dues-invoices
    description: "Issue a dues invoice; amount_cents computed via dues_proration"
    roles: [ClubOfficer]
    code: 201
    input: [member_id, period_start, period_end]
    output: DuesInvoice
    side_effects: ["dues_proration calculation"]
  - method: GET
    path: /club/dues-invoices/{invoiceId}
    description: "Fetch one invoice"
    roles: [ClubOfficer, Member]
    code: 200
    input: []
    output: DuesInvoice
    side_effects: []
  - method: GET
    path: /club/dues-invoices
    description: "List invoices; filter by member_id or status"
    roles: [ClubOfficer, Member]
    code: 200
