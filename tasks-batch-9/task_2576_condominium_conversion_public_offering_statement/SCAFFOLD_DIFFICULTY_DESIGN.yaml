          One TenantHousehold row carries three independent state fields (notice_status,
          rofr_status, relocation_status) whose machines advance on different triggers and can sit
          in incompatible-looking combinations - (NOTICE_SERVED, OFFERED, PAID) then
          (NOTICE_WITHDRAWN, EXERCISED, REVERSED) - which is a parallel-dimension shape on an
