        claim_type: segregation_of_duties
        grounds: ["validations[priority=6]", "errors[ERR_SEGREGATION_OF_DUTIES]", roles.QAManager]
        distinguishing_aspect: "Even with the correct QAManager role, an X-User-ID equal to the ACCEPTED test's technician_id is denied — the same person may not record and release."
