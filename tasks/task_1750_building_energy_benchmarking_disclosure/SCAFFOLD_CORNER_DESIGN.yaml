          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "OCC on Building.version: a PATCH carrying the pre-update version (captured before a successful PATCH bumped it to 2) is a 412; two strictly sequential requests, no parallelism."
        test_recipe:
          setup: ["owner; building b1 created (version 1 captured)"]
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner X2", contact_email: "ox2@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
