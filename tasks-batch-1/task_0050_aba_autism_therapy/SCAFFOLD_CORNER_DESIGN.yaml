# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Breadth probe across §1.1–§1.7. Taxonomy from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_client_returns_201_with_intake_status_and_system_fields
        claim_type: Creation
        grounds: [entities.Client, endpoints]
        distinguishing_aspect: "POST /clients with all required fields returns 201, status defaults to INTAKE, and id/created_at/updated_at/version are server-minted."
        test_recipe:
          setup: ["A payer exists to reference as insurance_payer_id."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Corner Payer", allowed_rate_cents: 2800, coinsurance_pct: 0.20, supervision_ratio_pct: 0.10 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
          trigger:
            - call: "POST /clients"
              payload: { full_name: "Corner Child", date_of_birth: "2019-01-01", caregiver_user_id: "cg-corner", insurance_payer_id: "${payer_id}" }
              as: IntakeCoordinator
              captures: { client_id: $.data.id, status: $.data.status, version: $.data.version }
          assert:
            - "Response status == 201"
            - "Client.${client_id}.status == INTAKE"
            - "Client.${client_id}.version == 1 and id, created_at, updated_at are present"

      - name: create_client_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds: [entities.Client.fields.insurance_payer_id, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /clients without insurance_payer_id returns 422 ERR_VALIDATION."
        test_recipe:
          setup: ["No prerequisites beyond an authenticated IntakeCoordinator."]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { full_name: "No Payer Child", date_of_birth: "2019-01-01", caregiver_user_id: "cg-x" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 422 with error_id == ERR_VALIDATION (insurance_payer_id missing)"

      - name: get_client_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Client, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /clients/{id} with a random non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /clients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 404 with error_id == ERR_NOT_FOUND"

      - name: provider_supervising_bcba_id_default_null_for_bcba
        claim_type: Defaults
        grounds: [entities.Provider.fields.supervising_bcba_id, entities.Provider.fields.status]
        distinguishing_aspect: "Creating a BCBA without supervising_bcba_id succeeds with status ACTIVE and supervising_bcba_id null (optional field)."
        test_recipe:
          setup: ["No prerequisites."]
          setup_api_calls: []
          trigger:
            - call: "POST /providers"
              payload: { full_name: "Solo BCBA", credential: "BCBA", npi: "2000000001" }
              as: IntakeCoordinator
              captures: { bcba_id: $.data.id, status: $.data.status }
          assert:
            - "Response status == 201; Provider.${bcba_id}.status == ACTIVE; supervising_bcba_id is null"

      - name: diagnostic_evaluation_severity_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.DiagnosticEvaluation.fields.severity_level, entities.DiagnosticEvaluation.fields.recommended_weekly_units, calculations.diagnostic_severity]
        distinguishing_aspect: "assessment_score=130 computes severity_level=SEVERE and recommended_weekly_units=160 on submit; client cannot set these directly."
        test_recipe:
          setup: ["A client and BCBA exist."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Sev Payer", allowed_rate_cents: 2800, coinsurance_pct: 0.20, supervision_ratio_pct: 0.10 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Sev BCBA", credential: "BCBA", npi: "2000000010" }
              as: IntakeCoordinator
              captures: { bcba_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Sev Child", date_of_birth: "2018-01-01", caregiver_user_id: "cg-sev", insurance_payer_id: "${payer_id}" }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /diagnostic-evaluations"
              payload: { client_id: "${client_id}", evaluator_bcba_id: "${bcba_id}", assessment_score: 130 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { eval_id: $.data.id }
          trigger:
            - call: "POST /diagnostic-evaluations/${eval_id}/submit"
              payload: {}
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { sev: $.data.severity_level, rec: $.data.recommended_weekly_units }
          assert:
            - "DiagnosticEvaluation.${eval_id}.severity_level == SEVERE (130 >= 120)"
            - "DiagnosticEvaluation.${eval_id}.recommended_weekly_units == 160"

      - name: diagnostic_severity_moderate_boundary_at_60
        claim_type: Computed Fields
        grounds: [calculations.diagnostic_severity, entities.DiagnosticEvaluation.fields.severity_level]
        distinguishing_aspect: "assessment_score=60 is MODERATE (inclusive lower bound), recommended_weekly_units=100; score=59 would be MILD=40."
        test_recipe:
          setup: ["A client and BCBA exist."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Mod Payer", allowed_rate_cents: 2800, coinsurance_pct: 0.20, supervision_ratio_pct: 0.10 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Mod BCBA", credential: "BCBA", npi: "2000000020" }
              as: IntakeCoordinator
              captures: { bcba_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Mod Child", date_of_birth: "2018-01-01", caregiver_user_id: "cg-mod", insurance_payer_id: "${payer_id}" }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /diagnostic-evaluations"
              payload: { client_id: "${client_id}", evaluator_bcba_id: "${bcba_id}", assessment_score: 60 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { eval_id: $.data.id }
          trigger:
            - call: "POST /diagnostic-evaluations/${eval_id}/submit"
              payload: {}
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { sev: $.data.severity_level, rec: $.data.recommended_weekly_units }
          assert:
            - "DiagnosticEvaluation.${eval_id}.severity_level == MODERATE (60 >= 60)"
            - "DiagnosticEvaluation.${eval_id}.recommended_weekly_units == 100"

      - name: list_providers_pagination_envelope_fields
        claim_type: Listing
        grounds: [entities.Provider, endpoints]
        distinguishing_aspect: "GET /providers returns an array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["Two providers exist."]
          setup_api_calls:
            - call: "POST /providers"
              payload: { full_name: "P1", credential: "BCBA", npi: "2000000030" }
              as: IntakeCoordinator
            - call: "POST /providers"
              payload: { full_name: "P2", credential: "BCBA", npi: "2000000031" }
              as: IntakeCoordinator
          trigger:
            - call: "GET /providers"
              payload: {}
              as: IntakeCoordinator
          assert:
            - "response_type == array; meta.total_count >= 2; has_more present in pagination fields"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: review_evaluation_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.DiagnosticEvaluation, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Reviewing a DiagnosticEvaluation still in DRAFT (never submitted) returns 409 ERR_INVALID_STATE; no review transition is defined from DRAFT."
        test_recipe:
          setup: ["A DRAFT evaluation that was never submitted."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "InvS Payer", allowed_rate_cents: 2800, coinsurance_pct: 0.20, supervision_ratio_pct: 0.10 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "InvS BCBA", credential: "BCBA", npi: "2000000040" }
              as: IntakeCoordinator
              captures: { bcba_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "InvS Child", date_of_birth: "2018-01-01", caregiver_user_id: "cg-invs", insurance_payer_id: "${payer_id}" }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /diagnostic-evaluations"
              payload: { client_id: "${client_id}", evaluator_bcba_id: "${bcba_id}", assessment_score: 70 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { eval_id: $.data.id }
          trigger:
            - call: "POST /diagnostic-evaluations/${eval_id}/review"
              payload: { decision: "FINALIZE" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409 with error_id == ERR_INVALID_STATE"

      - name: deliver_already_delivered_session_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.TherapySession, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Delivering a session twice — the second deliver from DELIVERED (terminal) returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A session scheduled and delivered once."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Dbl Payer", allowed_rate_cents: 2800, coinsurance_pct: 0.20, supervision_ratio_pct: 0.10 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dbl BCBA", credential: "BCBA", npi: "2000000050" }
              as: IntakeCoordinator
              captures: { bcba_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dbl RBT", credential: "RBT", npi: "2000000051", supervising_bcba_id: "${bcba_id}" }
              as: IntakeCoordinator
              captures: { rbt_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Dbl Child", date_of_birth: "2018-01-01", caregiver_user_id: "cg-dbl", insurance_payer_id: "${payer_id}" }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /diagnostic-evaluations"
              payload: { client_id: "${client_id}", evaluator_bcba_id: "${bcba_id}", assessment_score: 70 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { eval_id: $.data.id }
            - call: "POST /diagnostic-evaluations/${eval_id}/submit"
              payload: {}
              as: BCBA
              as_user_id: "${bcba_id}"
            - call: "POST /diagnostic-evaluations/${eval_id}/review"
              payload: { decision: "FINALIZE" }
              as: IntakeCoordinator
            - call: "POST /treatment-plans"
              payload: { client_id: "${client_id}", evaluation_id: "${eval_id}", author_bcba_id: "${bcba_id}", requested_direct_units: 100, requested_supervision_units: 20, requested_parent_training_units: 8 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/submit"
              payload: {}
              as: BCBA
              as_user_id: "${bcba_id}"
            - call: "POST /treatment-plans/${plan_id}/review"
              payload: { decision: "APPROVE" }
              as: IntakeCoordinator
            - call: "POST /authorizations"
              payload: { treatment_plan_id: "${plan_id}", payer_id: "${payer_id}", authorized_direct_units: 100, authorized_supervision_units: 20, authorized_parent_training_units: 8, period_start: "2026-01-01", period_end: "2026-12-31" }
              as: BillingSpecialist
              captures: { auth_id: $.data.id }
            - call: "POST /therapy-sessions"
              payload: { authorization_id: "${auth_id}", provider_id: "${rbt_id}", service_line: "DIRECT_THERAPY", scheduled_start: "2026-02-02T09:00:00Z", scheduled_end: "2026-02-02T11:00:00Z", scheduled_units: 8 }
              as: RBT
              as_user_id: "${rbt_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /therapy-sessions/${sess_id}/deliver"
              payload: { delivered_units: 8 }
              as: RBT
              as_user_id: "${rbt_id}"
          trigger:
            - call: "POST /therapy-sessions/${sess_id}/deliver"
              payload: { delivered_units: 8 }
              as: RBT
              as_user_id: "${rbt_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409 with error_id == ERR_INVALID_STATE (session already DELIVERED)"

      - name: initial_state_authorization_is_active
        claim_type: Initial State
        grounds: [state_machines.Authorization, entities.Authorization.fields.status]
        distinguishing_aspect: "A newly created Authorization starts in ACTIVE with all reserved/delivered pools at 0 and remaining_direct_units == authorized_direct_units."
        test_recipe:
          setup: ["An APPROVED plan to authorize."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Init Payer", allowed_rate_cents: 2800, coinsurance_pct: 0.20, supervision_ratio_pct: 0.10 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Init BCBA", credential: "BCBA", npi: "2000000060" }
              as: IntakeCoordinator
              captures: { bcba_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Init Child", date_of_birth: "2018-01-01", caregiver_user_id: "cg-init", insurance_payer_id: "${payer_id}" }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /diagnostic-evaluations"
              payload: { client_id: "${client_id}", evaluator_bcba_id: "${bcba_id}", assessment_score: 70 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { eval_id: $.data.id }
            - call: "POST /diagnostic-evaluations/${eval_id}/submit"
              payload: {}
              as: BCBA
              as_user_id: "${bcba_id}"
            - call: "POST /diagnostic-evaluations/${eval_id}/review"
              payload: { decision: "FINALIZE" }
              as: IntakeCoordinator
            - call: "POST /treatment-plans"
              payload: { client_id: "${client_id}", evaluation_id: "${eval_id}", author_bcba_id: "${bcba_id}", requested_direct_units: 100, requested_supervision_units: 20, requested_parent_training_units: 8 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/submit"
              payload: {}
              as: BCBA
              as_user_id: "${bcba_id}"
            - call: "POST /treatment-plans/${plan_id}/review"
              payload: { decision: "APPROVE" }
              as: IntakeCoordinator
          trigger:
            - call: "POST /authorizations"
              payload: { treatment_plan_id: "${plan_id}", payer_id: "${payer_id}", authorized_direct_units: 100, authorized_supervision_units: 20, authorized_parent_training_units: 8, period_start: "2026-01-01", period_end: "2026-12-31" }
              as: BillingSpecialist
              captures: { auth_id: $.data.id, status: $.data.status, remaining: $.data.remaining_direct_units }
          assert:
            - "Authorization.${auth_id}.status == ACTIVE"
            - "Authorization.${auth_id}.reserved_direct_units == 0, delivered_direct_units == 0, remaining_direct_units == 100"

      - name: close_authorization_before_period_end_returns_not_expirable
        claim_type: Precondition Enforcement
        grounds: [state_machines.Authorization.ACTIVE_to_EXPIRED, "validations[priority=16]", "errors[ERR_AUTHORIZATION_NOT_EXPIRABLE]"]
        distinguishing_aspect: "Closing an Authorization while the clock is still before period_end returns 409 ERR_AUTHORIZATION_NOT_EXPIRABLE."
        test_recipe:
          setup: ["An ACTIVE authorization with period_end far in the future; clock at a date before period_end."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: BillingSpecialist
            - call: "POST /payers"
              payload: { name: "NotExp Payer", allowed_rate_cents: 2800, coinsurance_pct: 0.20, supervision_ratio_pct: 0.10 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "NotExp BCBA", credential: "BCBA", npi: "2000000070" }
              as: IntakeCoordinator
              captures: { bcba_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "NotExp Child", date_of_birth: "2018-01-01", caregiver_user_id: "cg-nx", insurance_payer_id: "${payer_id}" }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /diagnostic-evaluations"
              payload: { client_id: "${client_id}", evaluator_bcba_id: "${bcba_id}", assessment_score: 70 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { eval_id: $.data.id }
            - call: "POST /diagnostic-evaluations/${eval_id}/submit"
              payload: {}
              as: BCBA
              as_user_id: "${bcba_id}"
            - call: "POST /diagnostic-evaluations/${eval_id}/review"
              payload: { decision: "FINALIZE" }
              as: IntakeCoordinator
            - call: "POST /treatment-plans"
              payload: { client_id: "${client_id}", evaluation_id: "${eval_id}", author_bcba_id: "${bcba_id}", requested_direct_units: 100, requested_supervision_units: 20, requested_parent_training_units: 8 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/submit"
              payload: {}
              as: BCBA
              as_user_id: "${bcba_id}"
            - call: "POST /treatment-plans/${plan_id}/review"
              payload: { decision: "APPROVE" }
              as: IntakeCoordinator
            - call: "POST /authorizations"
              payload: { treatment_plan_id: "${plan_id}", payer_id: "${payer_id}", authorized_direct_units: 100, authorized_supervision_units: 20, authorized_parent_training_units: 8, period_start: "2026-01-01", period_end: "2026-12-31" }
              as: BillingSpecialist
              captures: { auth_id: $.data.id }
          trigger:
            - call: "POST /authorizations/${auth_id}/close"
              payload: {}
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409 with error_id == ERR_AUTHORIZATION_NOT_EXPIRABLE (clock 2026-01-15 is not past period_end 2026-12-31)"

      - name: claim_deny_path_zeroes_money_and_sets_reason
        claim_type: Side Effect Execution
        grounds: [state_machines.Claim.SUBMITTED_to_DENIED, entities.Claim.fields.denial_reason, entities.Claim.fields.payer_paid_cents]
        distinguishing_aspect: "Adjudicating DENY sets denial_reason from the body and zeroes allowed_cents/patient_responsibility_cents/payer_paid_cents."
        test_recipe:
          setup: ["A SUBMITTED claim on a delivered session."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Deny Payer", allowed_rate_cents: 2800, coinsurance_pct: 0.20, supervision_ratio_pct: 0.10 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Deny BCBA", credential: "BCBA", npi: "2000000080" }
              as: IntakeCoordinator
              captures: { bcba_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Deny RBT", credential: "RBT", npi: "2000000081", supervising_bcba_id: "${bcba_id}" }
              as: IntakeCoordinator
              captures: { rbt_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Deny Child", date_of_birth: "2018-01-01", caregiver_user_id: "cg-deny", insurance_payer_id: "${payer_id}" }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /diagnostic-evaluations"
              payload: { client_id: "${client_id}", evaluator_bcba_id: "${bcba_id}", assessment_score: 70 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { eval_id: $.data.id }
            - call: "POST /diagnostic-evaluations/${eval_id}/submit"
              payload: {}
              as: BCBA
              as_user_id: "${bcba_id}"
            - call: "POST /diagnostic-evaluations/${eval_id}/review"
              payload: { decision: "FINALIZE" }
              as: IntakeCoordinator
            - call: "POST /treatment-plans"
              payload: { client_id: "${client_id}", evaluation_id: "${eval_id}", author_bcba_id: "${bcba_id}", requested_direct_units: 100, requested_supervision_units: 20, requested_parent_training_units: 8 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/submit"
              payload: {}
              as: BCBA
              as_user_id: "${bcba_id}"
            - call: "POST /treatment-plans/${plan_id}/review"
              payload: { decision: "APPROVE" }
              as: IntakeCoordinator
            - call: "POST /authorizations"
              payload: { treatment_plan_id: "${plan_id}", payer_id: "${payer_id}", authorized_direct_units: 100, authorized_supervision_units: 20, authorized_parent_training_units: 8, period_start: "2026-01-01", period_end: "2026-12-31" }
              as: BillingSpecialist
              captures: { auth_id: $.data.id }
            - call: "POST /therapy-sessions"
              payload: { authorization_id: "${auth_id}", provider_id: "${rbt_id}", service_line: "DIRECT_THERAPY", scheduled_start: "2026-02-02T09:00:00Z", scheduled_end: "2026-02-02T11:00:00Z", scheduled_units: 8 }
              as: RBT
              as_user_id: "${rbt_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /therapy-sessions/${sess_id}/deliver"
              payload: { delivered_units: 8 }
              as: RBT
              as_user_id: "${rbt_id}"
            - call: "POST /claims"
              payload: { session_id: "${sess_id}" }
              as: BillingSpecialist
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/submit"
              payload: {}
              as: BillingSpecialist
          trigger:
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: { decision: "DENY", denial_reason: "NOT_AUTHORIZED" }
              as: BillingSpecialist
              captures: { st: $.data.status, reason: $.data.denial_reason }
          assert:
            - "Claim.${claim_id}.status == DENIED; denial_reason == NOT_AUTHORIZED"
            - "Claim.${claim_id}.allowed_cents == 0, patient_responsibility_cents == 0, payer_paid_cents == 0"

      - name: terminal_claim_paid_cannot_be_readjudicated
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Claim, "errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: compensating_invariant / claim_money_conserved_allowed_equals_patient_plus_payer
          rationale: "The PAID terminal state is reached by that §1.8 instance; re-adjudicating a PAID claim is the same ERR_INVALID_STATE lockdown and need not be duplicated as a full recipe here."

      - name: revision_loop_cycle_covered_by_difficulty
        claim_type: cyclic
        grounds: [state_machines.TreatmentPlan.REVISION_REQUESTED_to_SUBMITTED]
        excluded_because:
