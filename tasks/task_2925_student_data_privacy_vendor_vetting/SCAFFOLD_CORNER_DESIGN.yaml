      - name: incident_weight_halves_once_past_the_ninety_day_shelf
        claim_type: decay_function
        grounds:
          - calculations.vendor_risk_score
          - endpoints[POST /compliance-sweeps]
        distinguishing_aspect: |
          The decay curve is a step function on floor(age_days): a HIGH incident weighs
          18 * 1.0 == 18.00 while age_days <= 90 and 18 * 0.5 == 9.00 once age_days is
          122, and the drop only becomes visible when something recomputes the score --
          here the sweep. The notification is sent BEFORE the clock advances so the
          OVERDUE branch cannot confound the posture.
        test_recipe:
          setup:
            - "Clock at 2026-04-01T00:00:00Z; Vendor V (US, breach_notification_hours 48, no subprocessors, no applications)."
            - "Incident I reported for V, detected_at 2026-04-01T00:00:00Z, 500 affected students, max_data_tier 2, so severity is HIGH."
            - "The notification is sent while the clock is still 2026-04-01, leaving notification_status SENT."
            - "The clock then advances to 2026-08-01T00:00:00Z, which is 122 days after detection."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /vendors"
              payload: { legal_name: "Brightpath Reading Co", hq_country_code: "US", breach_notification_hours: 48, data_deletion_days: 30, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { v_id: $.data.id }
            - call: "POST /vendor-incidents"
              payload: { vendor_id: "${v_id}", incident_type: "UNAUTHORIZED_DISCLOSURE", detected_at: "2026-04-01T00:00:00Z", affected_student_count: 500, max_data_tier: 2 }
              as: PrivacyOfficeAdmin
              captures: { inc_id: $.data.id }
            - call: "POST /vendor-incidents/${inc_id}/send-notification"
              payload: { notified_party_count: 500 }
              as: PrivacyOfficeAdmin
            - call: "GET /vendors/${v_id}"
              as: PrivacyOfficeAdmin
              captures: { risk_before: $.data.risk_score }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
          trigger:
            - call: "POST /compliance-sweeps"
              payload: {}
              as: PrivacyOfficeAdmin
          assert:
            - "${risk_before} == 18.00 (age_days 0, decay 1.0)"
            - "trigger: status == 200 with recomputed_vendor_count == 1, overdue_notification_count == 0, evaluated_entry_count == 0"
            - "VendorIncident.${inc_id}.severity == HIGH"
            - "VendorIncident.${inc_id}.notification_due_at == 2026-04-03T00:00:00.000Z"
            - "VendorIncident.${inc_id}.notification_status == SENT"
            - "Vendor.${v_id}.risk_score == 9.00"
            - "Vendor.${v_id}.privacy_posture == RESTRICTED (the incident is still REPORTED, so rule 2 fires before the WATCH rule)"

      - name: justification_bonus_uses_three_pinned_length_tiers
