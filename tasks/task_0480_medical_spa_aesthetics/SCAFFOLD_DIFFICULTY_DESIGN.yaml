# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Medical Spa & Aesthetics — Expert tier
# 9 rule_ids x 2 instances = 18 instances.
# All clinical actors are Providers (entity_backed:Provider); as_user_id is the
# acting Provider.id. ClinicAdmin is opaque; as_user_id omitted.
# Logical-clock default is 2026-01-01T00:00:00Z (set explicitly where windows matter).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: session_charge_member_vs_nonmember_diverges
        grounds:
          - calculations.session_charge
          - entities.MembershipPackage.fields.member_discount_pct
          - state_machines.TreatmentSession.BOOKED_to_COMMITTED
        distinguishing_aspect: |
          On the TreatmentSession COST domain: committing 30 units @1333 cents/unit
          yields final_charge_cents=33992 for a PLUS member (15% line discount) but
          39990 for a non-member (0% discount) — same units/price, different result.
        test_recipe:
          setup:
            - "PLUS MembershipPackage (member_discount_pct=0.15) and a non-member patient and a member patient, each with an ACTIVE plan, valid order/exam/lot, signed consent, BEFORE photo."
          setup_api_calls:
            - call: "POST /aesthetics/membership-packages"
              payload: { tier: "PLUS", member_discount_pct: 0.15, loyalty_program: "ALLE", monthly_fee_cents: 9900 }
              as: ClinicAdmin
              captures: { plus_pkg: $.data.id }
            - call: "POST /aesthetics/providers"
              payload: { full_name: "Inj One", license_number: "L-INJ-1", role_kind: "INJECTOR" }
              as: ClinicAdmin
              captures: { inj1: $.data.id }
            - call: "POST /aesthetics/providers"
              payload: { full_name: "Dir One", license_number: "L-MD-1", role_kind: "MEDICAL_DIRECTOR" }
              as: ClinicAdmin
              captures: { dir1: $.data.id }
            - call: "POST /aesthetics/injectable-lots"
              payload: { product: "BOTOX", lot_number: "LOT-A", expiration_date: "2026-12-01T00:00:00Z", total_units: 200 }
              as: ClinicAdmin
              captures: { lot_a: $.data.id }
            - call: "POST /aesthetics/patients"
              payload: { full_name: "Member Pat", date_of_birth: "1990-01-01T00:00:00Z", membership_id: "${plus_pkg}" }
              as: ClinicAdmin
              captures: { pat_m: $.data.id }
            - call: "POST /aesthetics/consent-photos"
              payload: { patient_id: "${pat_m}", kind: "CONSENT", storage_uri: "s3://c1", signed: true }
              as: Provider
              as_user_id: "${inj1}"
            - call: "POST /aesthetics/consultations"
              payload: { patient_id: "${pat_m}", exam_provider_id: "${inj1}", chief_complaint: "glabellar lines" }
              as: Provider
              as_user_id: "${inj1}"
              captures: { cons_m: $.data.id }
            - call: "POST /aesthetics/consultations/${cons_m}/complete-exam"
              payload: {}
              as: Provider
              as_user_id: "${inj1}"
            - call: "POST /aesthetics/standing-orders"
              payload: { consultation_id: "${cons_m}", director_provider_id: "${dir1}", product: "BOTOX", max_units_authorized: 60, valid_until_utc: "2026-12-01T00:00:00Z" }
              as: Provider
              as_user_id: "${dir1}"
              captures: { so_m: $.data.id }
            - call: "POST /aesthetics/treatment-plans"
              payload: { patient_id: "${pat_m}", consultation_id: "${cons_m}", product: "BOTOX", planned_sessions: 1, planned_units_per_session: 30, list_price_per_unit_cents: 1333, required_deposit_cents: 0 }
              as: Provider
              as_user_id: "${inj1}"
              captures: { plan_m: $.data.id, plan_m_v: $.data.version }
            - call: "POST /aesthetics/treatment-plans/${plan_m}/activate"
              payload: { expected_treatment_plan_version: "${plan_m_v}" }
              as: Provider
              as_user_id: "${inj1}"
              captures: { plan_m_v2: $.data.version }
            - call: "POST /aesthetics/treatment-sessions"
              payload: { treatment_plan_id: "${plan_m}", standing_order_id: "${so_m}", injector_provider_id: "${inj1}", injectable_lot_id: "${lot_a}", planned_units: 30, loyalty_points_redeemed: 0, expected_treatment_plan_version: "${plan_m_v2}" }
              as: Provider
              as_user_id: "${inj1}"
              captures: { sess_m: $.data.id }
            - call: "POST /aesthetics/consent-photos"
              payload: { patient_id: "${pat_m}", treatment_session_id: "${sess_m}", kind: "BEFORE", storage_uri: "s3://b1" }
              as: Provider
              as_user_id: "${inj1}"
          trigger:
            - call: "POST /aesthetics/treatment-sessions/${sess_m}/commit"
              payload: { actual_units: 30 }
              as: Provider
              as_user_id: "${inj1}"
          assert:
            - "TreatmentSession.${sess_m}.final_charge_cents == 33992"
            - "TreatmentSession.${sess_m}.points_earned_cents_basis == 339"

      - name: provider_complication_rate_provisional_vs_settled_diverges
        grounds:
          - calculations.provider_complication_rate
          - entities.Provider.fields.open_complication_count
          - entities.Provider.fields.resolved_complication_count
        distinguishing_aspect: |
          On the Provider RISK domain (distinct from the cost domain): a Provider
          with committed_session_count=2, open_complication_count=1,
          resolved_complication_count=0 has provisional_rate=5000 bps (numerator
          open+resolved=1) but settled_rate=0 bps (numerator resolved=0).
        test_recipe:
          setup:
            - "One INJECTOR with two COMMITTED sessions (committed_session_count==2) and one OPEN complication on the second."
          setup_api_calls:
            - call: "POST /aesthetics/providers"
              payload: { full_name: "Inj Two", license_number: "L-INJ-2", role_kind: "INJECTOR" }
              as: ClinicAdmin
              captures: { inj2: $.data.id }
            - call: "POST /aesthetics/providers"
              payload: { full_name: "Dir Two", license_number: "L-MD-2", role_kind: "MEDICAL_DIRECTOR" }
              as: ClinicAdmin
              captures: { dir2: $.data.id }
            - call: "POST /aesthetics/injectable-lots"
              payload: { product: "BOTOX", lot_number: "LOT-R", expiration_date: "2026-12-01T00:00:00Z", total_units: 200 }
              as: ClinicAdmin
              captures: { lot_r: $.data.id }
            - call: "POST /aesthetics/patients"
              payload: { full_name: "Risk Pat", date_of_birth: "1985-05-05T00:00:00Z" }
              as: ClinicAdmin
              captures: { pat_r: $.data.id }
            - call: "POST /aesthetics/consent-photos"
              payload: { patient_id: "${pat_r}", kind: "CONSENT", storage_uri: "s3://cr", signed: true }
              as: Provider
              as_user_id: "${inj2}"
            - call: "POST /aesthetics/consultations"
              payload: { patient_id: "${pat_r}", exam_provider_id: "${inj2}", chief_complaint: "forehead" }
              as: Provider
              as_user_id: "${inj2}"
              captures: { cons_r: $.data.id }
            - call: "POST /aesthetics/consultations/${cons_r}/complete-exam"
              payload: {}
              as: Provider
              as_user_id: "${inj2}"
            - call: "POST /aesthetics/standing-orders"
              payload: { consultation_id: "${cons_r}", director_provider_id: "${dir2}", product: "BOTOX", max_units_authorized: 40, valid_until_utc: "2026-12-01T00:00:00Z" }
              as: Provider
              as_user_id: "${dir2}"
              captures: { so_r: $.data.id }
            - call: "POST /aesthetics/treatment-plans"
              payload: { patient_id: "${pat_r}", consultation_id: "${cons_r}", product: "BOTOX", planned_sessions: 2, planned_units_per_session: 20, list_price_per_unit_cents: 1000, required_deposit_cents: 0 }
              as: Provider
              as_user_id: "${inj2}"
              captures: { plan_r: $.data.id, plan_r_v: $.data.version }
            - call: "POST /aesthetics/treatment-plans/${plan_r}/activate"
              payload: { expected_treatment_plan_version: "${plan_r_v}" }
              as: Provider
              as_user_id: "${inj2}"
              captures: { plan_r_v1: $.data.version }
            - call: "POST /aesthetics/treatment-sessions"
              payload: { treatment_plan_id: "${plan_r}", standing_order_id: "${so_r}", injector_provider_id: "${inj2}", injectable_lot_id: "${lot_r}", planned_units: 20, expected_treatment_plan_version: "${plan_r_v1}" }
              as: Provider
              as_user_id: "${inj2}"
              captures: { sess_r1: $.data.id }
            - call: "POST /aesthetics/consent-photos"
              payload: { patient_id: "${pat_r}", treatment_session_id: "${sess_r1}", kind: "BEFORE", storage_uri: "s3://br1" }
              as: Provider
              as_user_id: "${inj2}"
            - call: "POST /aesthetics/treatment-sessions/${sess_r1}/commit"
              payload: {}
              as: Provider
              as_user_id: "${inj2}"
              captures: { plan_r_v2: $.data.treatment_plan_id }
            - call: "GET /aesthetics/treatment-plans/${plan_r}"
              payload: {}
              as: Provider
              as_user_id: "${inj2}"
              captures: { plan_r_v3: $.data.version }
            - call: "POST /aesthetics/treatment-sessions"
              payload: { treatment_plan_id: "${plan_r}", standing_order_id: "${so_r}", injector_provider_id: "${inj2}", injectable_lot_id: "${lot_r}", planned_units: 20, expected_treatment_plan_version: "${plan_r_v3}" }
              as: Provider
              as_user_id: "${inj2}"
              captures: { sess_r2: $.data.id }
            - call: "POST /aesthetics/consent-photos"
              payload: { patient_id: "${pat_r}", treatment_session_id: "${sess_r2}", kind: "BEFORE", storage_uri: "s3://br2" }
              as: Provider
              as_user_id: "${inj2}"
            - call: "POST /aesthetics/treatment-sessions/${sess_r2}/commit"
              payload: {}
              as: Provider
              as_user_id: "${inj2}"
            - call: "POST /aesthetics/complication-cases"
              payload: { treatment_session_id: "${sess_r2}", severity: "MODERATE" }
              as: Provider
              as_user_id: "${inj2}"
          trigger:
            - call: "GET /aesthetics/providers/${inj2}"
              payload: {}
              as: Provider
              as_user_id: "${inj2}"
          assert:
            - "Provider.${inj2}.committed_session_count == 2"
            - "Provider.${inj2}.open_complication_count == 1"
            - "Provider.${inj2}.resolved_complication_count == 0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: session_charge_round_per_line_then_sum_order_pinned
        grounds:
          - calculations.session_charge
          - entities.TreatmentPlan.fields.list_price_per_unit_cents
        distinguishing_aspect: |
          Mode (b) nested-rounding-order: committing a PLUS member's session of
          30 units @1333 cents/unit at 15% line discount produces line_cents
          rounded round_half_up (33991.5 -> 33992) BEFORE the loyalty subtraction;
          the pinned per-line rounding yields final_charge_cents=33992, not 33991.
        test_recipe:
          setup:
            - "PLUS member with ACTIVE 1-session plan @1333 list price, valid order/exam/lot, signed consent, BEFORE photo."
          setup_api_calls:
            - call: "POST /aesthetics/membership-packages"
              payload: { tier: "PLUS", member_discount_pct: 0.15, loyalty_program: "ALLE", monthly_fee_cents: 9900 }
              as: ClinicAdmin
              captures: { cf_pkg: $.data.id }
            - call: "POST /aesthetics/providers"
              payload: { full_name: "CF Inj", license_number: "L-CF-I", role_kind: "INJECTOR" }
              as: ClinicAdmin
              captures: { cf_inj: $.data.id }
            - call: "POST /aesthetics/providers"
              payload: { full_name: "CF Dir", license_number: "L-CF-D", role_kind: "MEDICAL_DIRECTOR" }
              as: ClinicAdmin
              captures: { cf_dir: $.data.id }
            - call: "POST /aesthetics/injectable-lots"
              payload: { product: "BOTOX", lot_number: "LOT-CF", expiration_date: "2026-12-01T00:00:00Z", total_units: 100 }
              as: ClinicAdmin
              captures: { cf_lot: $.data.id }
            - call: "POST /aesthetics/patients"
              payload: { full_name: "CF Pat", date_of_birth: "1991-02-02T00:00:00Z", membership_id: "${cf_pkg}" }
              as: ClinicAdmin
              captures: { cf_pat: $.data.id }
            - call: "POST /aesthetics/consent-photos"
              payload: { patient_id: "${cf_pat}", kind: "CONSENT", storage_uri: "s3://cf-c", signed: true }
              as: Provider
              as_user_id: "${cf_inj}"
            - call: "POST /aesthetics/consultations"
              payload: { patient_id: "${cf_pat}", exam_provider_id: "${cf_inj}", chief_complaint: "crows feet" }
              as: Provider
              as_user_id: "${cf_inj}"
              captures: { cf_cons: $.data.id }
            - call: "POST /aesthetics/consultations/${cf_cons}/complete-exam"
              payload: {}
              as: Provider
              as_user_id: "${cf_inj}"
            - call: "POST /aesthetics/standing-orders"
              payload: { consultation_id: "${cf_cons}", director_provider_id: "${cf_dir}", product: "BOTOX", max_units_authorized: 30, valid_until_utc: "2026-12-01T00:00:00Z" }
              as: Provider
              as_user_id: "${cf_dir}"
              captures: { cf_so: $.data.id }
            - call: "POST /aesthetics/treatment-plans"
              payload: { patient_id: "${cf_pat}", consultation_id: "${cf_cons}", product: "BOTOX", planned_sessions: 1, planned_units_per_session: 30, list_price_per_unit_cents: 1333, required_deposit_cents: 0 }
              as: Provider
              as_user_id: "${cf_inj}"
              captures: { cf_plan: $.data.id, cf_plan_v: $.data.version }
            - call: "POST /aesthetics/treatment-plans/${cf_plan}/activate"
              payload: { expected_treatment_plan_version: "${cf_plan_v}" }
              as: Provider
              as_user_id: "${cf_inj}"
              captures: { cf_plan_v2: $.data.version }
            - call: "POST /aesthetics/treatment-sessions"
              payload: { treatment_plan_id: "${cf_plan}", standing_order_id: "${cf_so}", injector_provider_id: "${cf_inj}", injectable_lot_id: "${cf_lot}", planned_units: 30, expected_treatment_plan_version: "${cf_plan_v2}" }
              as: Provider
              as_user_id: "${cf_inj}"
              captures: { cf_sess: $.data.id }
            - call: "POST /aesthetics/consent-photos"
              payload: { patient_id: "${cf_pat}", treatment_session_id: "${cf_sess}", kind: "BEFORE", storage_uri: "s3://cf-b" }
              as: Provider
              as_user_id: "${cf_inj}"
          trigger:
            - call: "POST /aesthetics/treatment-sessions/${cf_sess}/commit"
              payload: { actual_units: 30 }
              as: Provider
              as_user_id: "${cf_inj}"
          assert:
            - "TreatmentSession.${cf_sess}.final_charge_cents == 33992"

      - name: session_charge_loyalty_floor_and_deposit_alloc_nonlinear
        grounds:
          - calculations.session_charge
          - entities.TreatmentSession.fields.loyalty_points_redeemed
          - entities.TreatmentSession.fields.balance_due_cents
          - entities.TreatmentPlan.fields.deposit_paid_cents
        distinguishing_aspect: |
          Mode (a) ≥3-input non-linear with conditional branches: final_charge =
          max(0, subtotal - loyalty_redemption) and balance_due = max(0,
          final_charge - min(final_charge, deposit_paid)). Non-member 30u @1333
          (subtotal 39990), loyalty_redeemed=0, deposit_paid=25000 -> final 39990,
          balance_due 14990 (interaction of floor + min, not a simple subtraction).
        test_recipe:
          setup:
            - "Non-member with ACTIVE 1-session plan @1333, required_deposit 25000 already POSTED, valid order/exam/lot, signed consent, BEFORE photo."
          setup_api_calls:
            - call: "POST /aesthetics/providers"
              payload: { full_name: "CF2 Inj", license_number: "L-CF2-I", role_kind: "INJECTOR" }
              as: ClinicAdmin
              captures: { cf2_inj: $.data.id }
            - call: "POST /aesthetics/providers"
              payload: { full_name: "CF2 Dir", license_number: "L-CF2-D", role_kind: "MEDICAL_DIRECTOR" }
              as: ClinicAdmin
              captures: { cf2_dir: $.data.id }
            - call: "POST /aesthetics/injectable-lots"
              payload: { product: "BOTOX", lot_number: "LOT-CF2", expiration_date: "2026-12-01T00:00:00Z", total_units: 100 }
              as: ClinicAdmin
              captures: { cf2_lot: $.data.id }
            - call: "POST /aesthetics/patients"
              payload: { full_name: "CF2 Pat", date_of_birth: "1988-03-03T00:00:00Z" }
              as: ClinicAdmin
              captures: { cf2_pat: $.data.id }
            - call: "POST /aesthetics/consent-photos"
              payload: { patient_id: "${cf2_pat}", kind: "CONSENT", storage_uri: "s3://cf2-c", signed: true }
              as: Provider
              as_user_id: "${cf2_inj}"
            - call: "POST /aesthetics/consultations"
              payload: { patient_id: "${cf2_pat}", exam_provider_id: "${cf2_inj}", chief_complaint: "lips" }
              as: Provider
              as_user_id: "${cf2_inj}"
              captures: { cf2_cons: $.data.id }
            - call: "POST /aesthetics/consultations/${cf2_cons}/complete-exam"
              payload: {}
              as: Provider
              as_user_id: "${cf2_inj}"
            - call: "POST /aesthetics/standing-orders"
              payload: { consultation_id: "${cf2_cons}", director_provider_id: "${cf2_dir}", product: "BOTOX", max_units_authorized: 30, valid_until_utc: "2026-12-01T00:00:00Z" }
              as: Provider
              as_user_id: "${cf2_dir}"
              captures: { cf2_so: $.data.id }
            - call: "POST /aesthetics/treatment-plans"
              payload: { patient_id: "${cf2_pat}", consultation_id: "${cf2_cons}", product: "BOTOX", planned_sessions: 1, planned_units_per_session: 30, list_price_per_unit_cents: 1333, required_deposit_cents: 25000 }
              as: Provider
              as_user_id: "${cf2_inj}"
              captures: { cf2_plan: $.data.id, cf2_plan_v0: $.data.version }
            - call: "POST /aesthetics/deposits"
              payload: { treatment_plan_id: "${cf2_plan}", amount_cents: 25000, expected_treatment_plan_version: "${cf2_plan_v0}" }
              as: ClinicAdmin
              captures: { cf2_plan_v1: $.data.treatment_plan_id }
            - call: "GET /aesthetics/treatment-plans/${cf2_plan}"
              payload: {}
              as: Provider
              as_user_id: "${cf2_inj}"
              captures: { cf2_plan_v2: $.data.version }
            - call: "POST /aesthetics/treatment-plans/${cf2_plan}/activate"
              payload: { expected_treatment_plan_version: "${cf2_plan_v2}" }
              as: Provider
              as_user_id: "${cf2_inj}"
              captures: { cf2_plan_v3: $.data.version }
            - call: "POST /aesthetics/treatment-sessions"
              payload: { treatment_plan_id: "${cf2_plan}", standing_order_id: "${cf2_so}", injector_provider_id: "${cf2_inj}", injectable_lot_id: "${cf2_lot}", planned_units: 30, expected_treatment_plan_version: "${cf2_plan_v3}" }
              as: Provider
              as_user_id: "${cf2_inj}"
              captures: { cf2_sess: $.data.id }
            - call: "POST /aesthetics/consent-photos"
              payload: { patient_id: "${cf2_pat}", treatment_session_id: "${cf2_sess}", kind: "BEFORE", storage_uri: "s3://cf2-b" }
              as: Provider
              as_user_id: "${cf2_inj}"
          trigger:
            - call: "POST /aesthetics/treatment-sessions/${cf2_sess}/commit"
              payload: { actual_units: 30 }
              as: Provider
              as_user_id: "${cf2_inj}"
          assert:
            - "TreatmentSession.${cf2_sess}.final_charge_cents == 39990"
            - "TreatmentSession.${cf2_sess}.balance_due_cents == 14990"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: complication_case_cycle_open_touchup_open
        grounds:
          - state_machines.ComplicationCase.OPEN_to_IN_TOUCHUP
          - state_machines.ComplicationCase.IN_TOUCHUP_to_OPEN
          - entities.ComplicationCase.fields.touchup_rounds
        distinguishing_aspect: |
          ComplicationCase is cyclic on a distinct entity: OPEN -> IN_TOUCHUP
          (touchup_rounds 0->1) -> OPEN (touchup-failed) -> IN_TOUCHUP
          (touchup_rounds 1->2) is a real loop, ending touchup_rounds==2.
        test_recipe:
          setup:
            - "A COMMITTED session with a MODERATE OPEN complication case (touchup_rounds=0)."
          setup_api_calls:
            - call: "POST /aesthetics/providers"
              payload: { full_name: "Cyc Inj", license_number: "L-CY-I", role_kind: "INJECTOR" }
              as: ClinicAdmin
              captures: { cy_inj: $.data.id }
            - call: "POST /aesthetics/providers"
              payload: { full_name: "Cyc Dir", license_number: "L-CY-D", role_kind: "MEDICAL_DIRECTOR" }
