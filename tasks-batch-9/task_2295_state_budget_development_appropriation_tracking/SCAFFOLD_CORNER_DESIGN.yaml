      - name: allow_partial_true_accepts_a_ceiling_below_the_request
        claim_type: Conditional validation
        grounds:
          - validations[priority=39]
          - errors[ERR_ALLOTMENT_EXCEEDS_CEILING]
          - entities.Allotment.fields.allow_partial
          - calculations.allotment_release_ceiling
        distinguishing_aspect: |
          A flag on the row decides whether an under-ceiling result is an error or a partial
          fill: with allow_partial false a request of 600000000 against a 440000000 quarter
          cap is refused with ERR_ALLOTMENT_EXCEEDS_CEILING, and with allow_partial true the
          identical request is accepted and truncated to 440000000 with binding_constraint
          QUARTER_CAP.
