scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_spot_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Spot, endpoints]
        distinguishing_aspect: "POST /spots with all required fields returns 201 and a LISTED Spot with listing_status=LISTED, version=1."
        test_recipe:
          setup: ["Host H exists."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "c1@x.com", display_name: "C1", payout_account_ref: "pa" }
              as: Anonymous
              captures: { h: $.data.id }
          trigger:
            - call: "POST /spots"
              payload: { host_id: "${h}", title: "T", zone_code: "Z", base_hourly_cents: 400, base_daily_cents: 6000, monthly_flat_cents: 120000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-05-01T00:00:00Z" }
              as: Host
              as_user_id: "${h}"
              captures: { sp: $.data.id, st: $.data.listing_status, sv: $.data.version }
          assert:
            - "Spot.${sp}.listing_status == LISTED"
            - "Spot.${sp}.version == 1"

      - name: get_booking_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Booking, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /bookings/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Driver D exists for auth."]
          setup_api_calls:
            - call: "POST /drivers"
              payload: { email: "c2@x.com", display_name: "C2" }
              as: Anonymous
              captures: { d: $.data.id }
          trigger:
            - call: "GET /bookings/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Driver
              as_user_id: "${d}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: create_spot_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Spot.fields.base_hourly_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /spots omitting base_hourly_cents (required, no default) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Host H exists."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "c3@x.com", display_name: "C3", payout_account_ref: "pa" }
              as: Anonymous
              captures: { h: $.data.id }
          trigger:
            - call: "POST /spots"
              payload: { host_id: "${h}", title: "T", zone_code: "Z", base_daily_cents: 6000, monthly_flat_cents: 120000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-05-01T00:00:00Z" }
              as: Host
              as_user_id: "${h}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_host_default_platform_fee_bps_applied
        claim_type: Defaults
        grounds: [entities.Host.fields.platform_fee_bps]
        distinguishing_aspect: "Omitting platform_fee_bps on POST /hosts applies the default 1500."
        test_recipe:
          setup: ["none"]
          setup_api_calls: []
          trigger:
            - call: "POST /hosts"
              payload: { email: "c4@x.com", display_name: "C4", payout_account_ref: "pa" }
              as: Anonymous
              captures: { h: $.data.id, fee: $.data.platform_fee_bps }
          assert:
            - "Host.${h}.platform_fee_bps == 1500"

      - name: booking_quoted_amount_is_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Booking.fields.quoted_amount_cents]
        distinguishing_aspect: "quoted_amount_cents is server-computed (800 for a 2h HOURLY at base 400); any client-supplied value is rejected as an unknown field / ignored."
        test_recipe:
          setup: ["Spot S base 400; Driver D funded; clock at 2026-04-08T09:00Z."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "c5@x.com", display_name: "C5", payout_account_ref: "pa" }
              as: Anonymous
              captures: { h: $.data.id }
            - call: "POST /drivers"
              payload: { email: "d5c@x.com", display_name: "D5c" }
              as: Anonymous
              captures: { d: $.data.id }
            - call: "POST /drivers/${d}/wallet/topup"
              payload: { amount_cents: 5000 }
              as: Driver
              as_user_id: "${d}"
            - call: "POST /spots"
              payload: { host_id: "${h}", title: "T", zone_code: "Z5C", base_hourly_cents: 400, base_daily_cents: 6000, monthly_flat_cents: 120000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-05-01T00:00:00Z" }
              as: Host
              as_user_id: "${h}"
              captures: { sp: $.data.id, sv: $.data.version }
          trigger:
            - call: "POST /bookings"
              payload: { spot_id: "${sp}", driver_id: "${d}", rate_kind: "HOURLY", start_at: "2026-04-20T10:00:00Z", end_at: "2026-04-20T12:00:00Z", expected_spot_version: "${sv}" }
              as: Driver
              as_user_id: "${d}"
              captures: { b: $.data.id, q: $.data.quoted_amount_cents }
          assert:
            - "Booking.${b}.quoted_amount_cents == 800"

      - name: spot_listing_status_invalid_enum_on_create_ignored_system_field
        claim_type: System Fields
        grounds: [entities.Spot.fields.listing_status]
        distinguishing_aspect: "listing_status is source:system; client cannot set it (unknown field) — new spot is always LISTED."
        excluded_because:
          difficulty_instance: non_linear_state_machine / booking_parallel_dimensions_occupancy_vs_settlement
          rationale: "System-set status semantics asserted via the parallel-dimension instance's status reads; the create-LISTED claim is covered by create_spot_returns_201_with_all_fields above."

      - name: create_booking_invalid_rate_kind_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.Booking.fields.rate_kind, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "rate_kind not in {HOURLY,DAILY,MONTHLY} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Spot S; Driver D funded."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "c6@x.com", display_name: "C6", payout_account_ref: "pa" }
              as: Anonymous
              captures: { h: $.data.id }
            - call: "POST /drivers"
              payload: { email: "d6c@x.com", display_name: "D6c" }
              as: Anonymous
              captures: { d: $.data.id }
            - call: "POST /drivers/${d}/wallet/topup"
              payload: { amount_cents: 5000 }
              as: Driver
              as_user_id: "${d}"
            - call: "POST /spots"
              payload: { host_id: "${h}", title: "T", zone_code: "Z6C", base_hourly_cents: 400, base_daily_cents: 6000, monthly_flat_cents: 120000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-05-01T00:00:00Z" }
              as: Host
              as_user_id: "${h}"
              captures: { sp: $.data.id, sv: $.data.version }
          trigger:
            - call: "POST /bookings"
              payload: { spot_id: "${sp}", driver_id: "${d}", rate_kind: "YEARLY", start_at: "2026-04-20T10:00:00Z", end_at: "2026-04-20T12:00:00Z", expected_spot_version: "${sv}" }
              as: Driver
              as_user_id: "${d}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: access_pass_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.AccessPass]
        distinguishing_aspect: "AccessPass has common_fields:false — it carries id+created_at only, no version field; it is read via GET /bookings/{id}/access-pass and mutated only by redeem/checkout side-effects."
        excluded_because:
          difficulty_instance: dual_variant_calc / booking_quote_vs_final_settlement_overstay_delta
          rationale: "AccessPass minting/invalidation is exercised by the checkout instance; the no-version immutability is a structural property with no independent endpoint to assert it."

      - name: spot_requires_existing_host_parent
        claim_type: Parent Relationships
        grounds: [entities.Spot.fields.host_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /spots with a non-existent host_id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["A host H exists to satisfy the acting role identity, but the body host_id points elsewhere."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "c7@x.com", display_name: "C7", payout_account_ref: "pa" }
              as: Anonymous
              captures: { h: $.data.id }
          trigger:
            - call: "POST /spots"
              payload: { host_id: "00000000-0000-0000-0000-000000000000", title: "T", zone_code: "Z", base_hourly_cents: 400, base_daily_cents: 6000, monthly_flat_cents: 120000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-05-01T00:00:00Z" }
              as: Host
              as_user_id: "${h}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: list_spots_pagination_envelope
        claim_type: Listing
        grounds: [entities.Spot, endpoints]
        distinguishing_aspect: "GET /spots returns an array envelope with total_count and has_more; limit/offset honored."
        test_recipe:
          setup: ["Host H with one Spot."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "c8@x.com", display_name: "C8", payout_account_ref: "pa" }
              as: Anonymous
              captures: { h: $.data.id }
            - call: "POST /spots"
              payload: { host_id: "${h}", title: "T", zone_code: "Z8C", base_hourly_cents: 400, base_daily_cents: 6000, monthly_flat_cents: 120000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-05-01T00:00:00Z" }
              as: Host
              as_user_id: "${h}"
              captures: { sp: $.data.id }
          trigger:
            - call: "GET /spots"
              payload: { host_id: "${h}", limit: 10, offset: 0 }
              as: Host
              as_user_id: "${h}"
          assert:
            - "response_type == array"
            - "data contains Spot ${sp}; total_count == 1; has_more == false"

      - name: list_spots_invalid_pagination_rejected
        claim_type: Type Constraints
        grounds: ["validations[priority=61]", "errors[ERR_INVALID_PAGINATION]"]
        distinguishing_aspect: "GET /spots with limit=0 (below min 1) returns ERR_INVALID_PAGINATION (400)."
        test_recipe:
          setup: ["Host H exists."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "c9@x.com", display_name: "C9", payout_account_ref: "pa" }
              as: Anonymous
              captures: { h: $.data.id }
          trigger:
            - call: "GET /spots"
              payload: { limit: 0 }
              as: Host
              as_user_id: "${h}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_PAGINATION"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_booking_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Booking.RESERVED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a Booking already in CANCELLED returns ERR_INVALID_STATE (409); no second refund."
        test_recipe:
          setup: ["Booking B RESERVED then cancelled once (lead >7d, refund full)."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "sm1@x.com", display_name: "SM1", payout_account_ref: "pa" }
              as: Anonymous
              captures: { h: $.data.id }
            - call: "POST /drivers"
              payload: { email: "smd1@x.com", display_name: "SMD1" }
              as: Anonymous
              captures: { d: $.data.id }
            - call: "POST /drivers/${d}/wallet/topup"
              payload: { amount_cents: 5000 }
              as: Driver
              as_user_id: "${d}"
            - call: "POST /spots"
              payload: { host_id: "${h}", title: "T", zone_code: "ZSM1", base_hourly_cents: 400, base_daily_cents: 6000, monthly_flat_cents: 120000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-05-01T00:00:00Z" }
              as: Host
              as_user_id: "${h}"
              captures: { sp: $.data.id, sv: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-08T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings"
              payload: { spot_id: "${sp}", driver_id: "${d}", rate_kind: "HOURLY", start_at: "2026-04-20T10:00:00Z", end_at: "2026-04-20T11:00:00Z", expected_spot_version: "${sv}" }
              as: Driver
              as_user_id: "${d}"
              captures: { b: $.data.id }
            - call: "POST /bookings/${b}/cancel"
              payload: {}
              as: Driver
              as_user_id: "${d}"
          trigger:
            - call: "POST /bookings/${b}/cancel"
              payload: {}
              as: Driver
              as_user_id: "${d}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: checkout_from_reserved_without_checkin_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Booking.CHECKED_IN_to_CHECKED_OUT, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "check-out on a RESERVED (not CHECKED_IN) booking returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Booking B RESERVED (never checked in)."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "sm2@x.com", display_name: "SM2", payout_account_ref: "pa" }
              as: Anonymous
              captures: { h: $.data.id }
            - call: "POST /drivers"
              payload: { email: "smd2@x.com", display_name: "SMD2" }
              as: Anonymous
              captures: { d: $.data.id }
            - call: "POST /drivers/${d}/wallet/topup"
              payload: { amount_cents: 5000 }
              as: Driver
              as_user_id: "${d}"
            - call: "POST /spots"
              payload: { host_id: "${h}", title: "T", zone_code: "ZSM2", base_hourly_cents: 400, base_daily_cents: 6000, monthly_flat_cents: 120000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-05-01T00:00:00Z" }
              as: Host
              as_user_id: "${h}"
              captures: { sp: $.data.id, sv: $.data.version }
            - call: "POST /bookings"
              payload: { spot_id: "${sp}", driver_id: "${d}", rate_kind: "HOURLY", start_at: "2026-04-20T10:00:00Z", end_at: "2026-04-20T11:00:00Z", expected_spot_version: "${sv}" }
              as: Driver
              as_user_id: "${d}"
              captures: { b: $.data.id }
          trigger:
            - call: "POST /bookings/${b}/check-out"
              payload: {}
              as: Driver
              as_user_id: "${d}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: checkin_before_start_returns_window_closed
        claim_type: Precondition Enforcement
        grounds: [state_machines.Booking.RESERVED_to_CHECKED_IN, "validations[priority=21]", "errors[ERR_CHECKIN_WINDOW_CLOSED]"]
        distinguishing_aspect: "check-in at a clock strictly before start_at returns ERR_CHECKIN_WINDOW_CLOSED (409) (lower-edge boundary, complements the §1.8 upper-edge boundary)."
        test_recipe:
          setup: ["Booking B [10:00,11:00); clock at 09:00 (before start)."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "sm3@x.com", display_name: "SM3", payout_account_ref: "pa" }
              as: Anonymous
              captures: { h: $.data.id }
            - call: "POST /drivers"
              payload: { email: "smd3@x.com", display_name: "SMD3" }
              as: Anonymous
              captures: { d: $.data.id }
            - call: "POST /drivers/${d}/wallet/topup"
              payload: { amount_cents: 5000 }
              as: Driver
              as_user_id: "${d}"
            - call: "POST /spots"
              payload: { host_id: "${h}", title: "T", zone_code: "ZSM3", base_hourly_cents: 400, base_daily_cents: 6000, monthly_flat_cents: 120000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-05-01T00:00:00Z", overstay_grace_minutes: 15 }
              as: Host
              as_user_id: "${h}"
              captures: { sp: $.data.id, sv: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-08T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings"
              payload: { spot_id: "${sp}", driver_id: "${d}", rate_kind: "HOURLY", start_at: "2026-04-08T10:00:00Z", end_at: "2026-04-08T11:00:00Z", expected_spot_version: "${sv}" }
              as: Driver
              as_user_id: "${d}"
              captures: { b: $.data.id }
          trigger:
            - call: "POST /bookings/${b}/check-in"
              payload: {}
              as: Driver
              as_user_id: "${d}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CHECKIN_WINDOW_CLOSED"

      - name: mark_no_show_before_expiry_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Booking.RESERVED_to_NO_SHOW, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "mark-no-show before clock reaches end_at+grace returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Booking B [10:00,11:00) grace 15; clock at 10:30 (before end+grace=11:15)."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "sm4@x.com", display_name: "SM4", payout_account_ref: "pa" }
              as: Anonymous
              captures: { h: $.data.id }
            - call: "POST /drivers"
              payload: { email: "smd4@x.com", display_name: "SMD4" }
              as: Anonymous
              captures: { d: $.data.id }
            - call: "POST /drivers/${d}/wallet/topup"
              payload: { amount_cents: 5000 }
              as: Driver
              as_user_id: "${d}"
            - call: "POST /spots"
              payload: { host_id: "${h}", title: "T", zone_code: "ZSM4", base_hourly_cents: 400, base_daily_cents: 6000, monthly_flat_cents: 120000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-05-01T00:00:00Z", overstay_grace_minutes: 15 }
              as: Host
              as_user_id: "${h}"
              captures: { sp: $.data.id, sv: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-08T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings"
              payload: { spot_id: "${sp}", driver_id: "${d}", rate_kind: "HOURLY", start_at: "2026-04-08T10:00:00Z", end_at: "2026-04-08T11:00:00Z", expected_spot_version: "${sv}" }
              as: Driver
              as_user_id: "${d}"
              captures: { b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-08T10:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookings/${b}/mark-no-show"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: relisted_spot_accepts_booking_cyclic
        claim_type: cyclic
        grounds: [state_machines.Spot.UNLISTED_to_LISTED, state_machines.Spot.LISTED_to_UNLISTED]
        distinguishing_aspect: "Spot cycles LISTED->UNLISTED->LISTED; after relist a booking on it succeeds (201), proving the cycle re-enables bookings."
        test_recipe:
          setup: ["Spot S listed, unlisted, relisted; Driver D funded."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "sm5@x.com", display_name: "SM5", payout_account_ref: "pa" }
              as: Anonymous
              captures: { h: $.data.id }
            - call: "POST /drivers"
              payload: { email: "smd5@x.com", display_name: "SMD5" }
              as: Anonymous
              captures: { d: $.data.id }
            - call: "POST /drivers/${d}/wallet/topup"
              payload: { amount_cents: 5000 }
              as: Driver
              as_user_id: "${d}"
            - call: "POST /spots"
              payload: { host_id: "${h}", title: "T", zone_code: "ZSM5", base_hourly_cents: 400, base_daily_cents: 6000, monthly_flat_cents: 120000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-05-01T00:00:00Z" }
              as: Host
              as_user_id: "${h}"
              captures: { sp: $.data.id }
            - call: "POST /spots/${sp}/unlist"
              payload: {}
              as: Host
              as_user_id: "${h}"
            - call: "POST /spots/${sp}/relist"
              payload: {}
              as: Host
              as_user_id: "${h}"
              captures: { sv: $.data.version }
          trigger:
            - call: "POST /bookings"
              payload: { spot_id: "${sp}", driver_id: "${d}", rate_kind: "HOURLY", start_at: "2026-04-20T10:00:00Z", end_at: "2026-04-20T11:00:00Z", expected_spot_version: "${sv}" }
              as: Driver
              as_user_id: "${d}"
              captures: { b: $.data.id, occ: $.data.occupancy_status }
          assert:
            - "Booking.${b}.occupancy_status == RESERVED"

      - name: unlist_spot_with_active_booking_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Spot.LISTED_to_UNLISTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Unlisting a Spot with a RESERVED booking returns ERR_INVALID_STATE (409); the listing_status stays LISTED."
        test_recipe:
          setup: ["Spot S with a RESERVED booking."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "sm6@x.com", display_name: "SM6", payout_account_ref: "pa" }
              as: Anonymous
              captures: { h: $.data.id }
            - call: "POST /drivers"
              payload: { email: "smd6@x.com", display_name: "SMD6" }
              as: Anonymous
              captures: { d: $.data.id }
            - call: "POST /drivers/${d}/wallet/topup"
              payload: { amount_cents: 5000 }
              as: Driver
              as_user_id: "${d}"
            - call: "POST /spots"
              payload: { host_id: "${h}", title: "T", zone_code: "ZSM6", base_hourly_cents: 400, base_daily_cents: 6000, monthly_flat_cents: 120000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-05-01T00:00:00Z" }
              as: Host
              as_user_id: "${h}"
              captures: { sp: $.data.id, sv: $.data.version }
            - call: "POST /bookings"
              payload: { spot_id: "${sp}", driver_id: "${d}", rate_kind: "HOURLY", start_at: "2026-04-20T10:00:00Z", end_at: "2026-04-20T11:00:00Z", expected_spot_version: "${sv}" }
              as: Driver
              as_user_id: "${d}"
              captures: { b: $.data.id }
          trigger:
            - call: "POST /spots/${sp}/unlist"
              payload: {}
              as: Host
              as_user_id: "${h}"
