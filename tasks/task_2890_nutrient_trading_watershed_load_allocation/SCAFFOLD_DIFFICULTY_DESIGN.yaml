              as: PracticeVerifier
              as_user_id: "verifier-3"
            - call: "POST /credit-batches/${batch_a_id}/list"
              payload: {}
              as: RegistryAdministrator
              as_user_id: "registry-1"
          assert:
            - "before trigger call 1, PracticeProject.${pp_a_id}.status == PENDING_REVERIFICATION"
            - "before trigger call 1, CreditBatch.${batch_a_id}.status == ISSUED and CreditBatch.${batch_a_id}.verified_ratio == 0.7500"
            - "trigger call 1 responds 409 with data.error_id == ERR_PROJECT_NOT_CERTIFIED"
            - "after trigger call 1, CreditBatch.${batch_a_id}.status is still ISSUED and listed_at is null"
