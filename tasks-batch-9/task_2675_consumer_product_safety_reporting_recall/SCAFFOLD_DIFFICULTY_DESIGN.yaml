          setup:
            - "logical clock at 2026-03-13T00:00:00Z at the moment of approval"
            - "a Recall in plan_status SUBMITTED with notification_status NOT_STARTED"
            - "one Retailer MegaMart with open_stop_sale_count 0 and compliance_posture COMPLIANT"
            - "one PENDING RetailerNotification linking the recall to that retailer, created with stop_sale_required at its false default so that the cascade itself has to set it"
