              as: AllocationManager
              captures: { ag_citra_id: $.data.id }
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${ag_id}", variety_id: "${ag_citra_id}", crop_year_program_id: "${ag_prog_id}", contract_type: "FIXED_CROP_YEAR", contracted_lbs: 5000, price_per_lb_cents: 250.00, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-12-31T00:00:00Z" }
              as: AllocationManager
              captures: { ag_k_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { brewer_id: "${ag_id}", requested_ship_date: "2026-10-01T00:00:00Z" }
              as: Brewer
              as_user_id: "${ag_id}"
              captures: { ag_o_id: $.data.id }
            - call: "POST /sales-orders/${ag_o_id}/lines"
              payload: { item_type: "HOP", quantity: 3000, uom: "LB", allocation_source: "CONTRACT", hop_variety_id: "${ag_citra_id}", hop_contract_id: "${ag_k_id}" }
              as: Brewer
              as_user_id: "${ag_id}"
              captures: { ag_line_a: $.data.id }
            - call: "POST /sales-orders/${ag_o_id}/lines"
              payload: { item_type: "HOP", quantity: 3000, uom: "LB", allocation_source: "CONTRACT", hop_variety_id: "${ag_citra_id}", hop_contract_id: "${ag_k_id}" }
              as: Brewer
              as_user_id: "${ag_id}"
              captures: { ag_line_b: $.data.id }
          trigger:
            - call: "POST /sales-orders/${ag_o_id}/confirm"
