            - "AssignmentCharge[0].own_cost_cents == 60800, exactly allocated_cents(26000) + wear(round(20*900)=18000) + fixed(4*4200=16800) — proving rental_allocation outputs feed own_vs_rent (pinned order)"
            - "AssignmentCharge[0].rent_cost_cents == 42000 (4*9000 + 4*1500)"
            - "AssignmentCharge[0].cheaper_variant == RENT"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (2 instances, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: equipment_parallel_availability_and_maintenance_evolve_independently
        grounds:
          - state_machines.Equipment.availability_status
          - state_machines.Equipment.maintenance_status
          - calculations.service_threshold
          - entities.Equipment.fields.availability_status
          - entities.Equipment.fields.maintenance_status
        distinguishing_aspect: |
          Equipment carries two PARALLEL state dimensions that evolve
          independently: while availability stays ON_RENT, a telematics-driven
          threshold crossing flips maintenance SERVICE_OK -> SERVICE_DUE; a
          later mark-down moves availability ON_RENT -> DOWN while maintenance
          stays SERVICE_DUE — combined state (DOWN, SERVICE_DUE) proves neither
          dimension is a projection of the other.
        test_recipe:
          setup:
            - "Class C7: service_interval_hours=50 (threshold 50000 milli); daily_rate_cents=10000"
            - "Project P7 OPEN budget 100000000; Equipment E7 OWNED; Assignment A7 [2026-08-03, 2026-08-14) ACTIVE (E7 ON_RENT)"
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-370", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 50, idle_alert_utilization_bp: 3000, expected_life_hours: 10000, salvage_value_cents: 500000 }
              as: FleetAdmin
              captures: { c7_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-G", name: "Project G", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p7_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-7", class_id: "${c7_id}", ownership: "OWNED", acquisition_cost_cents: 10000000, acquisition_date: "2026-01-01", useful_life_months: 60 }
              as: FleetAdmin
              captures: { e7_id: $.data.id, e7_v: $.data.version }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e7_id}", project_id: "${p7_id}", start_date: "2026-08-03", end_date: "2026-08-14", expected_equipment_version: "${e7_v}" }
              as: FleetAdmin
              captures: { a7_id: $.data.id }
            - call: "POST /fleet/assignments/${a7_id}/activate"
              as: FleetAdmin
          trigger:
            - call: "POST /fleet/equipment/${e7_id}/readings"
              payload: { recorded_date: "2026-08-03", engine_hours_delta_milli: 24000, fuel_used_milliliters: 12000 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e7_id}/readings"
              payload: { recorded_date: "2026-08-04", engine_hours_delta_milli: 24000, fuel_used_milliliters: 12000 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e7_id}/readings"
              payload: { recorded_date: "2026-08-05", engine_hours_delta_milli: 24000, fuel_used_milliliters: 12000 }
              as: FleetAdmin
            - call: "GET /fleet/equipment/${e7_id}"
              as: FleetAdmin
              captures: { e7_avail_mid: $.data.availability_status, e7_maint_mid: $.data.maintenance_status }
            - call: "POST /fleet/equipment/${e7_id}/mark-down"
              as: FleetAdmin
            - call: "GET /fleet/equipment/${e7_id}"
              as: FleetAdmin
              captures: { e7_avail_end: $.data.availability_status, e7_maint_end: $.data.maintenance_status }
            - call: "GET /fleet/equipment/${e7_id}/work-orders"
              as: FleetAdmin
              captures: { e7_wo_status: "$.data[0].status", e7_wo_kind: "$.data[0].kind" }
          assert:
            - "After the third reading (72000 >= 50000 milli): availability_status == ON_RENT (unchanged) AND maintenance_status == SERVICE_DUE — maintenance dimension moved alone"
            - "An auto-created WorkOrder exists with kind == PREVENTIVE and status == OPEN"
            - "After mark-down: availability_status == DOWN AND maintenance_status == SERVICE_DUE — availability dimension moved alone"
            - "Assignment.${a7_id}.status == SUSPENDED after mark-down (availability cascade), with no change to the maintenance dimension"

      - name: damage_report_cyclic_dispute_reassess_loop_multiple_rounds
        grounds:
          - state_machines.DamageReport.ASSESSED_to_DISPUTED
          - state_machines.DamageReport.DISPUTED_to_ASSESSED
          - calculations.damage_chargeback
          - concurrency_rules[damage-reassess-stale-version]
        distinguishing_aspect: |
          DamageReport is a CYCLIC machine (ASSESSED -> DISPUTED -> ASSESSED,
          unbounded rounds) — unlike any linear pipeline: two full dispute /
          reassess rounds succeed, line_items are replaced from scratch each
          reassess (assessed 10000 -> 7000 -> 5000), and version increments by
          1 on every mutation so OCC inputs must track the cycle.
        test_recipe:
          setup:
            - "Class C8, Project P8 OPEN budget 100000000, Equipment E8 OWNED ON_RENT at P8 via ACTIVE assignment A8"
            - "DamageReport D8 FILED (abuse_flag=false, line_items [{a, 10000}]) then ASSESSED (assessed_charge_cents == 10000)"
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-380", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 10000, salvage_value_cents: 500000 }
              as: FleetAdmin
              captures: { c8_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-H", name: "Project H", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p8_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-8", class_id: "${c8_id}", ownership: "OWNED", acquisition_cost_cents: 10000000, acquisition_date: "2026-01-01", useful_life_months: 60 }
              as: FleetAdmin
              captures: { e8_id: $.data.id, e8_v: $.data.version }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e8_id}", project_id: "${p8_id}", start_date: "2026-08-03", end_date: "2026-08-10", expected_equipment_version: "${e8_v}" }
              as: FleetAdmin
              captures: { a8_id: $.data.id }
            - call: "POST /fleet/assignments/${a8_id}/activate"
              as: FleetAdmin
            - call: "POST /fleet/damage-reports"
              payload: { equipment_id: "${e8_id}", project_id: "${p8_id}", description: "cracked panel", abuse_flag: false, line_items: [{ description: "panel", amount_cents: 10000 }] }
              as: FleetAdmin
              captures: { d8_id: $.data.id }
            - call: "POST /fleet/damage-reports/${d8_id}/assess"
              as: FleetAdmin
          trigger:
            - call: "POST /fleet/damage-reports/${d8_id}/dispute"
              payload: { dispute_note: "panel was pre-cracked" }
              as: ProjectManager
              captures: { d8_v_disputed1: $.data.version }
            - call: "POST /fleet/damage-reports/${d8_id}/reassess"
              payload: { line_items: [{ description: "panel (used part)", amount_cents: 7000 }], expected_damage_report_version: "${d8_v_disputed1}" }
              as: FleetAdmin
              captures: { d8_assessed2: $.data.assessed_charge_cents, d8_v_assessed2: $.data.version }
            - call: "POST /fleet/damage-reports/${d8_id}/dispute"
              payload: { dispute_note: "still too high" }
              as: ProjectManager
              captures: { d8_v_disputed2: $.data.version }
            - call: "POST /fleet/damage-reports/${d8_id}/reassess"
              payload: { line_items: [{ description: "panel (used part)", amount_cents: 4000 }, { description: "paint", amount_cents: 1000 }], expected_damage_report_version: "${d8_v_disputed2}" }
              as: FleetAdmin
              captures: { d8_assessed3: $.data.assessed_charge_cents, d8_v_assessed3: $.data.version }
          assert:
            - "Round 1: DISPUTED -> ASSESSED with assessed_charge_cents == 7000 (line_items replaced wholesale, no abuse multiplier)"
            - "Round 2: DISPUTED -> ASSESSED again with assessed_charge_cents == 5000 (4000+1000) — the cycle is unbounded, not one-shot"
            - "DamageReport.${d8_id}.version == 6 after create(1), assess(2), dispute(3), reassess(4), dispute(5), reassess(6)"
            - "DamageReport.${d8_id}.status == ASSESSED at end and project.billed_total_cents == 0 (nothing posted until confirm)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (2 instances, different triggers, depth >=3 / >=2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: repair_completion_cascades_through_equipment_assignment_project
        grounds:
          - state_machines.Equipment.DOWN_to_IDLE
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - state_machines.Assignment.SUSPENDED_to_ACTIVE
          - entities.Project.fields.active_assignment_count
        distinguishing_aspect: |
          Depth-3 cascade from the work-order-complete trigger: completing the
          REPAIR WorkOrder (link0) restores Equipment DOWN -> IDLE (link1);
          the earliest-created SUSPENDED assignment whose project is OPEN
          reactivates to ACTIVE, flipping Equipment IDLE -> ON_RENT (link2);
          Project.active_assignment_count recomputes 0 -> 1 (link3) — each hop
          is caused by the previous hop, not by the original trigger.
        test_recipe:
          setup:
            - "Class C9 service_interval_hours=10000; Project P9 OPEN budget 100000000; Equipment E9 OWNED"
            - "Assignment A9 [2026-08-03, 2026-08-10) ACTIVE; one ACCEPTED reading 8000 milli on 08-03"
            - "E9 marked DOWN at 2026-08-04T12:00Z (A9 SUSPENDED, P9.active_assignment_count == 0); Mechanic M9 AVAILABLE; REPAIR WorkOrder W9 DISPATCHED to M9 then IN_PROGRESS at 2026-08-06T09:00Z"
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-390", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 10000, salvage_value_cents: 500000 }
              as: FleetAdmin
              captures: { c9_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-I", name: "Project I", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p9_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-9", class_id: "${c9_id}", ownership: "OWNED", acquisition_cost_cents: 10000000, acquisition_date: "2026-01-01", useful_life_months: 60 }
              as: FleetAdmin
              captures: { e9_id: $.data.id, e9_v: $.data.version }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e9_id}", project_id: "${p9_id}", start_date: "2026-08-03", end_date: "2026-08-10", expected_equipment_version: "${e9_v}" }
              as: FleetAdmin
              captures: { a9_id: $.data.id }
            - call: "POST /fleet/assignments/${a9_id}/activate"
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e9_id}/readings"
              payload: { recorded_date: "2026-08-03", engine_hours_delta_milli: 8000, fuel_used_milliliters: 4000 }
              as: FleetAdmin
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T12:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e9_id}/mark-down"
              as: FleetAdmin
            - call: "POST /fleet/mechanics"
              payload: { mechanic_code: "MECH-9", name: "Mac Nine", home_project_id: "${p9_id}" }
              as: FleetAdmin
              captures: { m9_id: $.data.id }
            - call: "POST /fleet/work-orders"
              payload: { equipment_id: "${e9_id}", kind: "REPAIR", notes: "track tension" }
              as: FleetAdmin
              captures: { w9_id: $.data.id }
            - call: "POST /fleet/work-orders/${w9_id}/dispatch"
              payload: { mechanic_id: "${m9_id}" }
              as: FleetAdmin
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/work-orders/${w9_id}/start"
              as: Mechanic
              as_user_id: "${m9_id}"
          trigger:
            - call: "POST /fleet/work-orders/${w9_id}/complete"
              as: Mechanic
              as_user_id: "${m9_id}"
            - call: "GET /fleet/equipment/${e9_id}"
              as: FleetAdmin
              captures: { e9_avail: $.data.availability_status, e9_maint: $.data.maintenance_status, e9_hls: $.data.hours_at_last_service_milli, e9_hours: $.data.engine_hours_milli }
            - call: "GET /fleet/assignments/${a9_id}"
              as: FleetAdmin
              captures: { a9_status: $.data.status }
            - call: "GET /fleet/projects/${p9_id}"
              as: FleetAdmin
              captures: { p9_aac: $.data.active_assignment_count }
            - call: "GET /fleet/mechanics/${m9_id}"
              as: FleetAdmin
              captures: { m9_count: $.data.active_work_order_count, m9_status: $.data.status }
          assert:
            - "WorkOrder.${w9_id}.status == COMPLETED and completed_at set"
            - "link1: Equipment.${e9_id}.availability_status == ON_RENT (DOWN -> IDLE by repair, then IDLE -> ON_RENT by reactivation) and maintenance_status == SERVICE_OK"
            - "link2: Assignment.${a9_id}.status == ACTIVE (reactivated because Project P9 is OPEN)"
            - "link3: Project.${p9_id}.active_assignment_count == 1 (recomputed from the reactivated assignment)"
            - "Equipment.${e9_id}.hours_at_last_service_milli == 8000 == engine_hours_milli (service baseline reset at completion)"
            - "Mechanic.${m9_id}.active_work_order_count == 0 and status == AVAILABLE (decrement + recompute)"

      - name: reading_void_uncrosses_threshold_and_cancels_auto_work_order
        grounds:
          - state_machines.Equipment.SERVICE_DUE_to_SERVICE_OK
          - calculations.service_threshold
          - entities.TelematicsReading.fields.status
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (reading void, not
          work-order complete): voiding the reading that crossed the service
          threshold recomputes the meter below threshold (link1: maintenance
          SERVICE_DUE -> SERVICE_OK) which itself cancels the still-OPEN
          auto-created PREVENTIVE WorkOrder (link2: WorkOrder OPEN ->
          CANCELLED) — the cancel is caused by the un-crossing, not directly
          by the void.
        test_recipe:
          setup:
            - "Class C10: service_interval_hours=50 (threshold 50000 milli); Equipment E10 OWNED, no assignments"
            - "Three ACCEPTED readings of 24000 milli on 08-03, 08-04, 08-05: meter 72000 milli, maintenance SERVICE_DUE, one auto-created PREVENTIVE WorkOrder OPEN"
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-400", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 50, idle_alert_utilization_bp: 3000, expected_life_hours: 10000, salvage_value_cents: 500000 }
              as: FleetAdmin
              captures: { c10_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-10", class_id: "${c10_id}", ownership: "OWNED", acquisition_cost_cents: 10000000, acquisition_date: "2026-01-01", useful_life_months: 60 }
              as: FleetAdmin
              captures: { e10_id: $.data.id }
            - call: "POST /fleet/equipment/${e10_id}/readings"
              payload: { recorded_date: "2026-08-03", engine_hours_delta_milli: 24000, fuel_used_milliliters: 12000 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e10_id}/readings"
              payload: { recorded_date: "2026-08-04", engine_hours_delta_milli: 24000, fuel_used_milliliters: 12000 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e10_id}/readings"
              payload: { recorded_date: "2026-08-05", engine_hours_delta_milli: 24000, fuel_used_milliliters: 12000 }
              as: FleetAdmin
              captures: { r10_id: $.data.id }
            - call: "GET /fleet/equipment/${e10_id}/work-orders"
              as: FleetAdmin
              captures: { w10_id: "$.data[0].id" }
          trigger:
            - call: "POST /fleet/readings/${r10_id}/void"
              payload: { void_reason: "meter rollover misread" }
              as: FleetAdmin
            - call: "GET /fleet/equipment/${e10_id}"
              as: FleetAdmin
              captures: { e10_hours: $.data.engine_hours_milli, e10_maint: $.data.maintenance_status }
            - call: "GET /fleet/work-orders/${w10_id}"
              as: FleetAdmin
              captures: { w10_status: $.data.status }
          assert:
            - "TelematicsReading.${r10_id}.status == VOIDED"
            - "link1: Equipment.${e10_id}.engine_hours_milli == 48000 (72000 - 24000) and maintenance_status == SERVICE_OK (48000 < 50000 un-crosses)"
            - "link2: WorkOrder.${w10_id}.status == CANCELLED (auto-created PREVENTIVE still OPEN at void time, cancelled by the un-crossing — not by a direct work-order call)"
            - "Equipment.${e10_id}.availability_status == IDLE throughout (void cascade does not touch the availability dimension)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (2 instances, different pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: availability_state_check_beats_service_safety_check
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_EQUIPMENT_NOT_AVAILABLE]
          - errors[ERR_SERVICE_DUE]
        distinguishing_aspect: |
          Error-category pair (state, business_safety): on assignment create
          for a unit that is simultaneously ON_RENT (violates priority-8
          availability, ERR_EQUIPMENT_NOT_AVAILABLE) and SERVICE_DUE (violates
          priority-9 maintenance gate, ERR_SERVICE_DUE), the priority-8 state
          error MUST win.
        test_recipe:
          setup:
            - "Class C11: service_interval_hours=50; Project P11 OPEN budget 100000000; Equipment E11 OWNED"
            - "Assignment A11 [2026-08-03, 2026-08-14) ACTIVE (E11 ON_RENT); readings 3x24000 milli push meter to 72000 >= 50000 -> E11 maintenance SERVICE_DUE"
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-410", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 50, idle_alert_utilization_bp: 3000, expected_life_hours: 10000, salvage_value_cents: 500000 }
              as: FleetAdmin
              captures: { c11_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-K", name: "Project K", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p11_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-11", class_id: "${c11_id}", ownership: "OWNED", acquisition_cost_cents: 10000000, acquisition_date: "2026-01-01", useful_life_months: 60 }
              as: FleetAdmin
              captures: { e11_id: $.data.id, e11_v: $.data.version }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e11_id}", project_id: "${p11_id}", start_date: "2026-08-03", end_date: "2026-08-14", expected_equipment_version: "${e11_v}" }
              as: FleetAdmin
              captures: { a11_id: $.data.id }
            - call: "POST /fleet/assignments/${a11_id}/activate"
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e11_id}/readings"
              payload: { recorded_date: "2026-08-03", engine_hours_delta_milli: 24000, fuel_used_milliliters: 12000 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e11_id}/readings"
              payload: { recorded_date: "2026-08-04", engine_hours_delta_milli: 24000, fuel_used_milliliters: 12000 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e11_id}/readings"
              payload: { recorded_date: "2026-08-05", engine_hours_delta_milli: 24000, fuel_used_milliliters: 12000 }
              as: FleetAdmin
            - call: "GET /fleet/equipment/${e11_id}"
              as: FleetAdmin
              captures: { e11_v_now: $.data.version }
          trigger:
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e11_id}", project_id: "${p11_id}", start_date: "2026-08-15", end_date: "2026-08-20", expected_equipment_version: "${e11_v_now}" }
              as: FleetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_EQUIPMENT_NOT_AVAILABLE (priority 8 state) — NOT ERR_SERVICE_DUE (priority 9 business_safety) although both checks fail"
            - "http_status == 409"
            - "No new assignment exists: GET /fleet/equipment/${e11_id}/assignments returns exactly 1 row (A11)"

      - name: budget_fiscal_check_beats_project_state_check
        grounds:
          - validations[priority=18]
          - validations[priority=19]
          - errors[ERR_BUDGET_EXCEEDED]
          - errors[ERR_PROJECT_NOT_OPEN]
          - calculations.budget_guard
        distinguishing_aspect: |
          Error-category pair (business_fiscal, state) — different from
          instance 1's (state, business_safety): on assignment activate where
          the project is SUSPENDED (violates priority-19 ERR_PROJECT_NOT_OPEN)
          AND the budget guard fails (violates priority-18
          ERR_BUDGET_EXCEEDED), the priority-18 fiscal error MUST win.
        test_recipe:
          setup:
            - "Class C12 daily_rate_cents=10000; Project P12 created with equipment_budget_cents=5000 then SUSPENDED"
            - "Equipment E12 OWNED IDLE SERVICE_OK; Assignment A12 [2026-08-20, 2026-08-25) RESERVED (create does not gate on project status)"
          setup_api_calls:
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-420", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 10000, salvage_value_cents: 500000 }
              as: FleetAdmin
              captures: { c12_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-L", name: "Project L", equipment_budget_cents: 5000 }
              as: FleetAdmin
              captures: { p12_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-12", class_id: "${c12_id}", ownership: "OWNED", acquisition_cost_cents: 10000000, acquisition_date: "2026-01-01", useful_life_months: 60 }
              as: FleetAdmin
              captures: { e12_id: $.data.id, e12_v: $.data.version }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e12_id}", project_id: "${p12_id}", start_date: "2026-08-20", end_date: "2026-08-25", expected_equipment_version: "${e12_v}" }
              as: FleetAdmin
              captures: { a12_id: $.data.id }
            - call: "POST /fleet/projects/${p12_id}/suspend"
              as: FleetAdmin
          trigger:
            - call: "POST /fleet/assignments/${a12_id}/activate"
              as: FleetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BUDGET_EXCEEDED (priority 18 business_fiscal: 0 + 10000 > 5000) — NOT ERR_PROJECT_NOT_OPEN (priority 19 state) although both checks fail"
            - "http_status == 422"
            - "Assignment.${a12_id}.status == RESERVED (unchanged) and Equipment.${e12_id}.availability_status == RESERVED"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (3 instances, different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: service_threshold_inclusive_at_exact_interval
        grounds:
          - calculations.service_threshold
          - validations[priority=21]
          - state_machines.Equipment.SERVICE_OK_to_SERVICE_DUE
        distinguishing_aspect: |
          Metric: engine-hours (milli) at the inclusive >= threshold, reached
          via POST /fleet/equipment/{id}/readings: at 49999 milli
          hours_since_service nothing fires; the reading that lands the meter
          EXACTLY on 50000 milli (== service_interval_hours 50 * 1000) flips
          maintenance to SERVICE_DUE and auto-creates the PREVENTIVE WorkOrder.
        test_recipe:
          setup:
            - "Class C13: service_interval_hours=50; Equipment E13 OWNED IDLE; meter raised to exactly 50000 milli via three readings (24000 + 24000 + 2000)"
          setup_api_calls:
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-430", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 50, idle_alert_utilization_bp: 3000, expected_life_hours: 10000, salvage_value_cents: 500000 }
              as: FleetAdmin
              captures: { c13_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-13", class_id: "${c13_id}", ownership: "OWNED", acquisition_cost_cents: 10000000, acquisition_date: "2026-01-01", useful_life_months: 60 }
              as: FleetAdmin
              captures: { e13_id: $.data.id }
            - call: "POST /fleet/equipment/${e13_id}/readings"
              payload: { recorded_date: "2026-08-03", engine_hours_delta_milli: 24000, fuel_used_milliliters: 12000 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e13_id}/readings"
              payload: { recorded_date: "2026-08-04", engine_hours_delta_milli: 24000, fuel_used_milliliters: 12000 }
              as: FleetAdmin
            - call: "GET /fleet/equipment/${e13_id}"
              as: FleetAdmin
              captures: { e13_maint_pre: $.data.maintenance_status }
          trigger:
            - call: "POST /fleet/equipment/${e13_id}/readings"
              payload: { recorded_date: "2026-08-05", engine_hours_delta_milli: 1999, fuel_used_milliliters: 1000 }
              as: FleetAdmin
            - call: "GET /fleet/equipment/${e13_id}"
              as: FleetAdmin
              captures: { e13_maint_49999: $.data.maintenance_status }
            - call: "POST /fleet/equipment/${e13_id}/readings"
              payload: { recorded_date: "2026-08-06", engine_hours_delta_milli: 1, fuel_used_milliliters: 1 }
              as: FleetAdmin
            - call: "GET /fleet/equipment/${e13_id}"
              as: FleetAdmin
              captures: { e13_maint_50000: $.data.maintenance_status }
            - call: "GET /fleet/equipment/${e13_id}/work-orders"
              as: FleetAdmin
              captures: { e13_wo_kind: "$.data[0].kind", e13_wo_status: "$.data[0].status", e13_wo_trigger: "$.data[0].trigger_hours_milli" }
          assert:
            - "At 48000 milli: maintenance_status == SERVICE_OK (below threshold)"
            - "At 49999 milli: maintenance_status == SERVICE_OK (threshold-1 milli does NOT fire)"
            - "At exactly 50000 milli: maintenance_status == SERVICE_DUE (inclusive >= boundary)"
            - "Exactly one auto-created WorkOrder with kind == PREVENTIVE, status == OPEN, trigger_hours_milli == 50000"

      - name: budget_cap_inclusive_at_exact_equality
        grounds:
          - calculations.budget_guard
          - validations[priority=18]
          - errors[ERR_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Metric: project budget cents at the inclusive <= cap, reached via
          POST /fleet/assignments/{id}/activate: with billed_total_cents == 0,
          budget == daily_rate == 10000 activates successfully (equality
          allowed), while budget == 9999 (one cent under the projected
          first-day charge) is rejected ERR_BUDGET_EXCEEDED.
        test_recipe:
          setup:
            - "Class C14 daily_rate_cents=10000; Projects P_OK (budget 10000) and P_BAD (budget 9999), both OPEN"
            - "Equipments E_OK, E_BAD OWNED IDLE SERVICE_OK; RESERVED assignments A_OK on P_OK and A_BAD on P_BAD"
          setup_api_calls:
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-440", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 10000, salvage_value_cents: 500000 }
              as: FleetAdmin
              captures: { c14_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-OK", name: "Budget OK", equipment_budget_cents: 10000 }
              as: FleetAdmin
              captures: { p_ok_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-BAD", name: "Budget Bad", equipment_budget_cents: 9999 }
              as: FleetAdmin
              captures: { p_bad_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-OK", class_id: "${c14_id}", ownership: "OWNED", acquisition_cost_cents: 10000000, acquisition_date: "2026-01-01", useful_life_months: 60 }
              as: FleetAdmin
              captures: { e_ok_id: $.data.id, e_ok_v: $.data.version }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-BAD", class_id: "${c14_id}", ownership: "OWNED", acquisition_cost_cents: 10000000, acquisition_date: "2026-01-01", useful_life_months: 60 }
              as: FleetAdmin
              captures: { e_bad_id: $.data.id, e_bad_v: $.data.version }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e_ok_id}", project_id: "${p_ok_id}", start_date: "2026-08-03", end_date: "2026-08-05", expected_equipment_version: "${e_ok_v}" }
              as: FleetAdmin
              captures: { a_ok_id: $.data.id }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e_bad_id}", project_id: "${p_bad_id}", start_date: "2026-08-03", end_date: "2026-08-05", expected_equipment_version: "${e_bad_v}" }
              as: FleetAdmin
              captures: { a_bad_id: $.data.id }
          trigger:
            - call: "POST /fleet/assignments/${a_ok_id}/activate"
              as: FleetAdmin
              captures: { a_ok_status: $.data.status }
            - call: "POST /fleet/assignments/${a_bad_id}/activate"
              as: FleetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "A_OK activates: status == ACTIVE (0 + 10000 <= 10000 — equality at the cap is INCLUSIVE)"
            - "A_BAD rejected: error_id == ERR_BUDGET_EXCEEDED, http 422 (0 + 10000 > 9999 — one cent over)"
            - "Assignment.${a_bad_id}.status == RESERVED (unchanged); Equipment.${e_bad_id}.availability_status == RESERVED"

      - name: mechanic_capacity_boundary_at_two_active_orders
        grounds:
          - validations[priority=14]
          - state_machines.Mechanic.AVAILABLE_to_ON_JOB
          - errors[ERR_MECHANIC_UNAVAILABLE]
          - entities.Mechanic.fields.active_work_order_count
        distinguishing_aspect: |
          Metric: active work-order COUNT (integer) at boundary 2, reached via
          POST /fleet/work-orders/{id}/dispatch: dispatch #1 leaves count 1 /
          AVAILABLE, dispatch #2 is allowed and flips status to ON_JOB at
          exactly count == 2, dispatch #3 is rejected
          ERR_MECHANIC_UNAVAILABLE.
        test_recipe:
          setup:
            - "Class C15, Project P15 OPEN, Equipment E15 OWNED, Mechanic M15 AVAILABLE (home P15)"
            - "Three OPEN REPAIR WorkOrders W1, W2, W3 on E15"
          setup_api_calls:
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-450", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 10000, salvage_value_cents: 500000 }
              as: FleetAdmin
              captures: { c15_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-M", name: "Project M", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p15_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-15", class_id: "${c15_id}", ownership: "OWNED", acquisition_cost_cents: 10000000, acquisition_date: "2026-01-01", useful_life_months: 60 }
              as: FleetAdmin
              captures: { e15_id: $.data.id }
            - call: "POST /fleet/mechanics"
              payload: { mechanic_code: "MECH-15", name: "Mac Fifteen", home_project_id: "${p15_id}" }
              as: FleetAdmin
              captures: { m15_id: $.data.id }
            - call: "POST /fleet/work-orders"
              payload: { equipment_id: "${e15_id}", kind: "REPAIR", notes: "w1" }
              as: FleetAdmin
              captures: { w1_id: $.data.id }
            - call: "POST /fleet/work-orders"
              payload: { equipment_id: "${e15_id}", kind: "REPAIR", notes: "w2" }
              as: FleetAdmin
              captures: { w2_id: $.data.id }
            - call: "POST /fleet/work-orders"
              payload: { equipment_id: "${e15_id}", kind: "REPAIR", notes: "w3" }
              as: FleetAdmin
              captures: { w3_id: $.data.id }
          trigger:
            - call: "POST /fleet/work-orders/${w1_id}/dispatch"
              payload: { mechanic_id: "${m15_id}" }
              as: FleetAdmin
            - call: "GET /fleet/mechanics/${m15_id}"
              as: FleetAdmin
              captures: { m15_count1: $.data.active_work_order_count, m15_status1: $.data.status }
            - call: "POST /fleet/work-orders/${w2_id}/dispatch"
              payload: { mechanic_id: "${m15_id}" }
              as: FleetAdmin
            - call: "GET /fleet/mechanics/${m15_id}"
              as: FleetAdmin
              captures: { m15_count2: $.data.active_work_order_count, m15_status2: $.data.status }
            - call: "POST /fleet/work-orders/${w3_id}/dispatch"
              payload: { mechanic_id: "${m15_id}" }
              as: FleetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "After dispatch #1: active_work_order_count == 1 and status == AVAILABLE (1 < 2)"
            - "After dispatch #2: active_work_order_count == 2 and status == ON_JOB (boundary reached — dispatch itself was allowed at count == 1)"
            - "Dispatch #3 rejected: error_id == ERR_MECHANIC_UNAVAILABLE, http 409 (count == 2 is NOT < 2)"
            - "WorkOrder.${w3_id}.status == OPEN (unchanged)"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (3 instances, different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: assignment_activation_depends_on_project_open
        grounds:
          - state_machines.Assignment.RESERVED_to_ACTIVE
          - validations[priority=19]
          - errors[ERR_PROJECT_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair Assignment -> Project: the RESERVED -> ACTIVE transition
          is gated on a DIFFERENT entity's state (Project.status == OPEN);
          suspending the project after reservation makes activation fail with
          ERR_PROJECT_NOT_OPEN, and resuming it makes the same activate call
          succeed — the assignment's own fields never change.
        test_recipe:
          setup:
            - "Class C16 daily_rate_cents=10000; Project P16 budget 100000000 (budget deliberately ample so ONLY the state gate can fail)"
            - "Equipment E16 OWNED; Assignment A16 [2026-08-03, 2026-08-07) RESERVED; P16 then SUSPENDED"
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-460", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 10000, salvage_value_cents: 500000 }
              as: FleetAdmin
              captures: { c16_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-N", name: "Project N", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p16_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-16", class_id: "${c16_id}", ownership: "OWNED", acquisition_cost_cents: 10000000, acquisition_date: "2026-01-01", useful_life_months: 60 }
              as: FleetAdmin
              captures: { e16_id: $.data.id, e16_v: $.data.version }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e16_id}", project_id: "${p16_id}", start_date: "2026-08-03", end_date: "2026-08-07", expected_equipment_version: "${e16_v}" }
              as: FleetAdmin
              captures: { a16_id: $.data.id }
            - call: "POST /fleet/projects/${p16_id}/suspend"
              as: FleetAdmin
          trigger:
            - call: "POST /fleet/assignments/${a16_id}/activate"
              as: FleetAdmin
              captures: { err: $.data.error_id }
            - call: "POST /fleet/projects/${p16_id}/resume"
              as: FleetAdmin
            - call: "POST /fleet/assignments/${a16_id}/activate"
              as: FleetAdmin
              captures: { a16_status: $.data.status }
          assert:
            - "First activate: error_id == ERR_PROJECT_NOT_OPEN, http 409 (Project SUSPENDED gates the Assignment transition)"
            - "After project resume: second identical activate succeeds, status == ACTIVE"
            - "Equipment.${e16_id}.availability_status == ON_RENT and current_project_id == ${p16_id} after successful activation"

      - name: work_order_start_depends_on_dispatched_mechanic_identity
        grounds:
          - state_machines.WorkOrder.DISPATCHED_to_IN_PROGRESS
          - validations[priority=13]
          - errors[ERR_NOT_ASSIGNED_MECHANIC]
        distinguishing_aspect: |
          Entity pair WorkOrder -> Mechanic: the DISPATCHED -> IN_PROGRESS
          transition depends on the acting Mechanic's identity matching
          work_order.mechanic_id (entity_backed X-User-ID); mechanic M2
          starting a work order dispatched to M1 fails
          ERR_NOT_ASSIGNED_MECHANIC while M1 succeeds — the work order's own
          state is valid in both attempts.
        test_recipe:
          setup:
            - "Class C17, Project P17 OPEN, Equipment E17 OWNED; Mechanics M1 and M2 both AVAILABLE homed at P17"
            - "REPAIR WorkOrder W17 DISPATCHED to M1"
          setup_api_calls:
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-470", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 10000, salvage_value_cents: 500000 }
              as: FleetAdmin
              captures: { c17_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-O", name: "Project O", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p17_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-17", class_id: "${c17_id}", ownership: "OWNED", acquisition_cost_cents: 10000000, acquisition_date: "2026-01-01", useful_life_months: 60 }
              as: FleetAdmin
              captures: { e17_id: $.data.id }
            - call: "POST /fleet/mechanics"
              payload: { mechanic_code: "MECH-A", name: "Mac A", home_project_id: "${p17_id}" }
              as: FleetAdmin
              captures: { m17a_id: $.data.id }
            - call: "POST /fleet/mechanics"
              payload: { mechanic_code: "MECH-B", name: "Mac B", home_project_id: "${p17_id}" }
              as: FleetAdmin
              captures: { m17b_id: $.data.id }
            - call: "POST /fleet/work-orders"
              payload: { equipment_id: "${e17_id}", kind: "REPAIR", notes: "w17" }
              as: FleetAdmin
              captures: { w17_id: $.data.id }
            - call: "POST /fleet/work-orders/${w17_id}/dispatch"
              payload: { mechanic_id: "${m17a_id}" }
              as: FleetAdmin
          trigger:
            - call: "POST /fleet/work-orders/${w17_id}/start"
              as: Mechanic
              as_user_id: "${m17b_id}"
              captures: { err: $.data.error_id }
            - call: "POST /fleet/work-orders/${w17_id}/start"
              as: Mechanic
              as_user_id: "${m17a_id}"
              captures: { w17_status: $.data.status }
          assert:
            - "M2 start: error_id == ERR_NOT_ASSIGNED_MECHANIC, http 403 (WorkOrder.mechanic_id == ${m17a_id} != X-User-ID ${m17b_id})"
            - "M1 start: succeeds, status == IN_PROGRESS"
            - "Equipment.${e17_id}.maintenance_status == IN_SERVICE after the successful start"

      - name: transport_creation_depends_on_equipment_physical_site
        grounds:
          - state_machines.Equipment.IDLE_to_IN_TRANSIT
          - validations[priority=11]
          - errors[ERR_TRANSPORT_CONFLICT]
        distinguishing_aspect: |
          Entity pair TransportJob -> Equipment: the PLANNED create is gated
          on Equipment.current_site_id == from_project_id; a unit whose last
          delivered site is P_ORIGIN cannot be hauled "from" P_ELSE — rejected
          ERR_TRANSPORT_CONFLICT — while the identical request with
          from_project_id == P_ORIGIN succeeds.
        test_recipe:
          setup:
            - "Class C18; Projects P_ORG, P_DST, P_ELSE OPEN with budget 100000000; Lowboy L18 AVAILABLE"
            - "Equipment E18 completed an assignment at P_ORG and now: availability IDLE, current_site_id == P_ORG"
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-480", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 10000, salvage_value_cents: 500000 }
              as: FleetAdmin
              captures: { c18_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-ORG", name: "Origin Yard", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p_org_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-DST", name: "Destination", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p_dst_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-ELS", name: "Elsewhere", equipment_budget_cents: 100000000 }
