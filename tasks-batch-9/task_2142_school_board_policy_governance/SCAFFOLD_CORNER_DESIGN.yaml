        distinguishing_aspect: "Version drafting is the one write both PolicyAnalyst and Superintendent may perform: two successive drafts, one from each role, both succeed and produce version_no 1 and 2 on the same policy."
        test_recipe:
          setup: ["One policy BP-6155 at version 1."]
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { code: "BP-6155", title: "Homework and Grading", category: "INSTRUCTION", legal_requirement_level: "RECOMMENDED", manual_section: "6000.55" }
              as: PolicyAnalyst
              captures: { pol: $.data.id, pol_v: $.data.version }
          trigger:
