# =============================================================================
# SCAFFOLD_CORNER_DESIGN — task_1017 (Coverage Index for Non-Difficulty Tests, §1.9)
# Breadth probe across the claim-extraction taxonomy. Recipes are empty-DB
# executable; excluded_because stubs point at the §1.8 instance that covers them.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_member_returns_pending_with_member_number
        claim_type: Creation
        grounds: [entities.Member, endpoints]
        distinguishing_aspect: "POST /coop/members with full_name+email returns 201, membership_status PENDING, equity_paid_in_cents 0, and a system member_number."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /coop/members", payload: { full_name: "Ada L", email: "ada@x.com" }, as: CoopAdmin, captures: { m_id: "$.data.id" } }
          assert:
            - "response.status == 201"
            - "Member.${m_id}.membership_status == PENDING"
            - "Member.${m_id}.equity_paid_in_cents == 0"
            - "Member.${m_id}.version == 1"

      - name: member_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Member, "errors[ERR_MEMBER_NOT_FOUND]"]
        distinguishing_aspect: "GET /coop/members/{unknown-uuid} returns ERR_MEMBER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /coop/members/00000000-0000-4000-8000-000000000000", payload: {}, as: CoopAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_MEMBER_NOT_FOUND"

      - name: product_missing_required_department_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Product.fields.department, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /coop/products omitting the required department field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A vendor exists to satisfy the vendor_id FK (existence passes before the required-field check)."]
          setup_api_calls:
            - { call: "POST /coop/vendors", payload: { name: "V" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
          trigger:
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "X", name: "No Dept", unit_type: "EACH", base_price_cents: 100, reorder_point: 0, reorder_qty: 1 }, as: InventoryManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: product_invalid_enum_department_rejected
        claim_type: Type Constraints
        grounds: [entities.Product.fields.department, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /coop/products with department not in {GROCERY,PRODUCE,BULK,CAFE_DELI} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A vendor exists."]
          setup_api_calls:
            - { call: "POST /coop/vendors", payload: { name: "V" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
          trigger:
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "X", name: "Bad Dept", department: "FROZEN", unit_type: "EACH", base_price_cents: 100, reorder_point: 0, reorder_qty: 1 }, as: InventoryManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: computed_weight_tare_line_pricing
        claim_type: Computed Fields
        grounds: [calculations.sale_line_price, entities.Product.fields.tare_grams, entities.Product.fields.unit_type]
        distinguishing_aspect: "WEIGHT product base 1000 cents/kg with tare 50g: a line at gross 550g nets 500g -> 0.5kg -> line_subtotal 500; the tare is deducted before pricing."
        test_recipe:
          setup: ["OPEN register; WEIGHT product base 1000/kg, tare 50g; a POSTED lot for it; a BUILDING non-member sale."]
          setup_api_calls:
            - { call: "POST /coop/vendors", payload: { name: "V" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /coop/vendors/${v_id}/set-status", payload: { status: "APPROVED" }, as: InventoryManager }
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "BULKNUT", name: "Bulk Almonds", department: "BULK", unit_type: "WEIGHT", base_price_cents: 1000, tare_grams: 50, reorder_point: 0, reorder_qty: 100 }, as: InventoryManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots", payload: { product_id: "${p_id}", vendor_id: "${v_id}", received_qty: 100, unit_cost_cents: 400 }, as: InventoryManager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots/${lot_id}/post", payload: {}, as: InventoryManager }
            - { call: "POST /coop/registers", payload: { name: "R1" }, as: Cashier, captures: { reg_id: "$.data.id" } }
            - { call: "POST /coop/registers/${reg_id}/set-open", payload: { is_open: true }, as: Cashier }
            - { call: "POST /coop/sales", payload: { register_id: "${reg_id}" }, as: Cashier, captures: { s_id: "$.data.id" } }
          trigger:
            - { call: "POST /coop/sales/${s_id}/lines", payload: { product_id: "${p_id}", inventory_lot_id: "${lot_id}", gross_weight_grams: 550 }, as: Cashier }
          assert:
            - "Sale.${s_id}.subtotal_cents == 500"
            - "Sale.${s_id}.total_cents == 500"

      - name: system_ids_generated_input_ignored
        claim_type: System Fields
        grounds: [entities.Vendor]
        distinguishing_aspect: "Server mints id/created_at/version on POST /coop/vendors; a fresh vendor starts at version 1 and status PENDING regardless of any client-supplied id."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /coop/vendors", payload: { name: "Sunrise Bakery" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
          assert:
            - "Vendor.${v_id}.status == PENDING"
            - "Vendor.${v_id}.version == 1"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: finalize_already_finalized_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.Sale.BUILDING_to_FINALIZED, "errors[ERR_SALE_NOT_BUILDING]"]
        distinguishing_aspect: "A second finalize on an already-FINALIZED sale returns ERR_SALE_NOT_BUILDING (409); idempotency guard on checkout_status."
        test_recipe:
          setup: ["A finalized non-member sale (OPEN register, one in-stock line)."]
          setup_api_calls:
            - { call: "POST /coop/vendors", payload: { name: "V" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /coop/vendors/${v_id}/set-status", payload: { status: "APPROVED" }, as: InventoryManager }
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "TOM", name: "Tomatoes", department: "PRODUCE", unit_type: "EACH", base_price_cents: 200, reorder_point: 0, reorder_qty: 10 }, as: InventoryManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots", payload: { product_id: "${p_id}", vendor_id: "${v_id}", received_qty: 10, unit_cost_cents: 90 }, as: InventoryManager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots/${lot_id}/post", payload: {}, as: InventoryManager }
            - { call: "POST /coop/registers", payload: { name: "R1" }, as: Cashier, captures: { reg_id: "$.data.id" } }
            - { call: "POST /coop/registers/${reg_id}/set-open", payload: { is_open: true }, as: Cashier }
            - { call: "POST /coop/sales", payload: { register_id: "${reg_id}" }, as: Cashier, captures: { s_id: "$.data.id" } }
            - { call: "POST /coop/sales/${s_id}/lines", payload: { product_id: "${p_id}", inventory_lot_id: "${lot_id}", quantity: 1 }, as: Cashier }
            - { call: "POST /coop/sales/${s_id}/finalize", payload: {}, as: Cashier }
          trigger:
            - { call: "POST /coop/sales/${s_id}/finalize", payload: {}, as: Cashier, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SALE_NOT_BUILDING"

      - name: allocation_finalize_after_finalized_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.PatronageAllocation.DRAFT_to_FINALIZED, "errors[ERR_ALLOCATION_NOT_DRAFT]"]
        distinguishing_aspect: "Finalizing an allocation already in FINALIZED returns ERR_ALLOCATION_NOT_DRAFT (409); terminal-state lockdown."
        test_recipe:
          setup: ["A FINALIZED ESTIMATED allocation on an OPEN year with no eligible members (dividend 0)."]
          setup_api_calls:
            - { call: "POST /coop/fiscal-years", payload: { year: 2026, patronage_rate: 0.05, equity_share_price_cents: 10000 }, as: CoopAdmin, captures: { fy_id: "$.data.id" } }
            - { call: "GET /coop/fiscal-years/${fy_id}", payload: {}, as: FinanceManager, captures: { fy_ver: "$.data.version" } }
            - { call: "POST /coop/patronage-allocations", payload: { fiscal_year_id: "${fy_id}", method: "ESTIMATED", expected_fiscal_year_version: "${fy_ver}" }, as: FinanceManager, captures: { alloc_id: "$.data.id" } }
            - { call: "POST /coop/patronage-allocations/${alloc_id}/finalize", payload: {}, as: FinanceManager }
          trigger:
            - { call: "POST /coop/patronage-allocations/${alloc_id}/finalize", payload: {}, as: FinanceManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ALLOCATION_NOT_DRAFT"

      - name: member_lapses_on_year_close_low_participation
        claim_type: Side Effect Execution
        grounds: [state_machines.FiscalYear.OPEN_to_CLOSED, state_machines.Member.ACTIVE_to_LAPSED, entities.Member.fields.membership_status]
        distinguishing_aspect: "FiscalYear close lapses an ACTIVE member whose patronage_cents_ytd (0) is below MIN_PATRONAGE_CENTS (5000): membership_status ACTIVE -> LAPSED. Produces the LAPSED enum value."
        test_recipe:
          setup: ["OPEN FiscalYear; Member M ACTIVE (equity 10000, approved) with no purchases (patronage 0)."]
          setup_api_calls:
            - { call: "POST /coop/fiscal-years", payload: { year: 2026, patronage_rate: 0.05, equity_share_price_cents: 10000 }, as: CoopAdmin, captures: { fy_id: "$.data.id" } }
            - { call: "POST /coop/members", payload: { full_name: "Lea P", email: "lea@x.com" }, as: CoopAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /coop/members/${m_id}/equity-contribution", payload: { amount_cents: 10000 }, as: FinanceManager }
            - { call: "POST /coop/members/${m_id}/approve", payload: {}, as: CoopAdmin }
          trigger:
            - { call: "POST /coop/fiscal-years/${fy_id}/close", payload: {}, as: FinanceManager }
          assert:
            - "Member.${m_id}.membership_status == LAPSED"
            - "FiscalYear.${fy_id}.status == CLOSED"

      - name: lapsed_member_reactivated_by_approve
        claim_type: Valid Transition
        grounds: [state_machines.Member.PENDING_to_ACTIVE, entities.Member.fields.membership_status]
        distinguishing_aspect: "A LAPSED member with equity still >= share price is reactivated to ACTIVE via POST /coop/members/{id}/approve."
        test_recipe:
          setup: ["Member M LAPSED (approved ACTIVE with equity 10000, then year closed with patronage 0)."]
          setup_api_calls:
            - { call: "POST /coop/fiscal-years", payload: { year: 2026, patronage_rate: 0.05, equity_share_price_cents: 10000 }, as: CoopAdmin, captures: { fy_id: "$.data.id" } }
            - { call: "POST /coop/members", payload: { full_name: "Lea P", email: "lea2@x.com" }, as: CoopAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /coop/members/${m_id}/equity-contribution", payload: { amount_cents: 10000 }, as: FinanceManager }
            - { call: "POST /coop/members/${m_id}/approve", payload: {}, as: CoopAdmin }
            - { call: "POST /coop/fiscal-years/${fy_id}/close", payload: {}, as: FinanceManager }
          trigger:
            - { call: "POST /coop/members/${m_id}/approve", payload: {}, as: CoopAdmin }
          assert:
            - "Member.${m_id}.membership_status == ACTIVE"

      - name: vendor_suspend_then_reapprove_cycle
        claim_type: Valid Transition
        grounds: [state_machines.Vendor.APPROVED_to_SUSPENDED, state_machines.Vendor.SUSPENDED_to_APPROVED]
        distinguishing_aspect: "Vendor cycles PENDING->APPROVED->SUSPENDED->APPROVED via set-status; the SUSPENDED->APPROVED edge is reachable."
        test_recipe:
          setup: ["A PENDING vendor."]
          setup_api_calls:
            - { call: "POST /coop/vendors", payload: { name: "Cycle Co" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /coop/vendors/${v_id}/set-status", payload: { status: "APPROVED" }, as: InventoryManager }
            - { call: "POST /coop/vendors/${v_id}/set-status", payload: { status: "SUSPENDED" }, as: InventoryManager }
          trigger:
            - { call: "POST /coop/vendors/${v_id}/set-status", payload: { status: "APPROVED" }, as: InventoryManager }
          assert:
            - "Vendor.${v_id}.status == APPROVED"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: prepared_food_excluded_from_patronage
        claim_type: Input Set Filtering
        grounds: [calculations.sale_line_price, calculations.sale_totals, entities.Product.fields.is_prepared_food, entities.Sale.fields.patronage_eligible_cents]
        distinguishing_aspect: "A cafe/deli prepared-food line (is_prepared_food true) contributes to subtotal but NOT to patronage_eligible_cents; a member sale of only prepared food accrues 0 patronage."
        test_recipe:
          setup: ["OPEN FiscalYear; Member M ACTIVE; POSTED prepared-food product (base 700, taxable); OPEN register; member sale one line qty 1; finalized."]
          setup_api_calls:
            - { call: "POST /coop/fiscal-years", payload: { year: 2026, patronage_rate: 0.05, equity_share_price_cents: 10000 }, as: CoopAdmin, captures: { fy_id: "$.data.id" } }
            - { call: "POST /coop/vendors", payload: { name: "Deli Co" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /coop/vendors/${v_id}/set-status", payload: { status: "APPROVED" }, as: InventoryManager }
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "SANDW", name: "Deli Sandwich", department: "CAFE_DELI", unit_type: "EACH", base_price_cents: 700, reorder_point: 0, reorder_qty: 20, is_taxable: true, is_prepared_food: true }, as: InventoryManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots", payload: { product_id: "${p_id}", vendor_id: "${v_id}", received_qty: 20, unit_cost_cents: 300 }, as: InventoryManager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots/${lot_id}/post", payload: {}, as: InventoryManager }
            - { call: "POST /coop/members", payload: { full_name: "Deli M", email: "delim@x.com" }, as: CoopAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /coop/members/${m_id}/equity-contribution", payload: { amount_cents: 10000 }, as: FinanceManager }
            - { call: "POST /coop/members/${m_id}/approve", payload: {}, as: CoopAdmin }
            - { call: "POST /coop/registers", payload: { name: "R1" }, as: Cashier, captures: { reg_id: "$.data.id" } }
            - { call: "POST /coop/registers/${reg_id}/set-open", payload: { is_open: true }, as: Cashier }
            - { call: "POST /coop/sales", payload: { register_id: "${reg_id}", member_id: "${m_id}" }, as: Cashier, captures: { s_id: "$.data.id" } }
            - { call: "POST /coop/sales/${s_id}/lines", payload: { product_id: "${p_id}", inventory_lot_id: "${lot_id}", quantity: 1 }, as: Cashier }
          trigger:
            - { call: "POST /coop/sales/${s_id}/finalize", payload: {}, as: Cashier }
          assert:
            - "Sale.${s_id}.subtotal_cents == 700"
            - "Sale.${s_id}.patronage_eligible_cents == 0"
            - "Member.${m_id}.patronage_cents_ytd == 0"

      - name: ad_promo_stacks_working_member_discount
        claim_type: Correct Result
        grounds: [calculations.sale_line_price, entities.Promotion.fields.member_only, entities.Member.fields.is_working_member]
        distinguishing_aspect: "An AD promo (member_only false) DOES stack with the 10% working-member discount: promo 450 then *0.9 = 405 (unlike the member_only case which suppresses it)."
        test_recipe:
          setup: ["Product base 500 with active AD promo 450 (member_only false); working member M (COMPLETED 12h shift); OPEN register; member sale."]
          setup_api_calls:
            - { call: "POST /coop/vendors", payload: { name: "V" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /coop/vendors/${v_id}/set-status", payload: { status: "APPROVED" }, as: InventoryManager }
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "COF", name: "Fair Coffee", department: "GROCERY", unit_type: "EACH", base_price_cents: 500, reorder_point: 0, reorder_qty: 20, is_taxable: false }, as: InventoryManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /coop/promotions", payload: { product_id: "${p_id}", deal_type: "AD", promo_price_cents: 450, member_only: false, start_date: "2026-06-01T00:00:00Z", end_date: "2026-08-01T00:00:00Z" }, as: InventoryManager, captures: { promo_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots", payload: { product_id: "${p_id}", vendor_id: "${v_id}", received_qty: 20, unit_cost_cents: 200 }, as: InventoryManager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots/${lot_id}/post", payload: {}, as: InventoryManager }
            - { call: "POST /coop/members", payload: { full_name: "Work M", email: "workm@x.com" }, as: CoopAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /coop/working-shifts", payload: { member_id: "${m_id}", department: "GROCERY", start_at: "2026-07-01T08:00:00Z", end_at: "2026-07-01T20:00:00Z" }, as: CoopAdmin, captures: { sh_id: "$.data.id" } }
            - { call: "POST /coop/working-shifts/${sh_id}/complete", payload: {}, as: InventoryManager }
            - { call: "POST /coop/registers", payload: { name: "R1" }, as: Cashier, captures: { reg_id: "$.data.id" } }
            - { call: "POST /coop/registers/${reg_id}/set-open", payload: { is_open: true }, as: Cashier }
            - { call: "POST /coop/sales", payload: { register_id: "${reg_id}", member_id: "${m_id}" }, as: Cashier, captures: { s_id: "$.data.id" } }
          trigger:
            - { call: "POST /coop/sales/${s_id}/lines", payload: { product_id: "${p_id}", inventory_lot_id: "${lot_id}", quantity: 1 }, as: Cashier }
          assert:
            - "Sale.${s_id}.subtotal_cents == 405"

      - name: dividend_below_min_patronage_excluded
        claim_type: Input Set Filtering
        grounds: [calculations.patronage_dividend, entities.PatronageAllocation.fields.total_dividend_cents, entities.Member.fields.patronage_dividend_cents]
        distinguishing_aspect: "An ACTIVE member with patronage_cents_ytd 0 (< MIN_PATRONAGE_CENTS 5000) is excluded from the dividend run: total_dividend_cents 0 and member dividend 0."
        test_recipe:
          setup: ["OPEN FiscalYear; Member M ACTIVE, patronage 0; a DRAFT ESTIMATED allocation."]
          setup_api_calls:
            - { call: "POST /coop/fiscal-years", payload: { year: 2026, patronage_rate: 0.05, equity_share_price_cents: 10000 }, as: CoopAdmin, captures: { fy_id: "$.data.id" } }
            - { call: "POST /coop/members", payload: { full_name: "Zero P", email: "zero@x.com" }, as: CoopAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /coop/members/${m_id}/equity-contribution", payload: { amount_cents: 10000 }, as: FinanceManager }
            - { call: "POST /coop/members/${m_id}/approve", payload: {}, as: CoopAdmin }
            - { call: "GET /coop/fiscal-years/${fy_id}", payload: {}, as: FinanceManager, captures: { fy_ver: "$.data.version" } }
            - { call: "POST /coop/patronage-allocations", payload: { fiscal_year_id: "${fy_id}", method: "ESTIMATED", expected_fiscal_year_version: "${fy_ver}" }, as: FinanceManager, captures: { alloc_id: "$.data.id" } }
          trigger:
            - { call: "POST /coop/patronage-allocations/${alloc_id}/finalize", payload: {}, as: FinanceManager }
          assert:
            - "PatronageAllocation.${alloc_id}.total_dividend_cents == 0"
            - "PatronageAllocation.${alloc_id}.member_count == 0"
            - "Member.${m_id}.patronage_dividend_cents == 0"

      - name: final_variant_dividend_on_closed_year
        claim_type: Variant Selection
        grounds: [calculations.patronage_dividend, entities.PatronageAllocation.fields.method, state_machines.FiscalYear.OPEN_to_CLOSED]
        distinguishing_aspect: "FINAL variant selection: on a CLOSED year, a FINAL allocation with declared_rate 0.08 pays the member patronage_cents_ytd 20000 a dividend of 1600 (vs the ESTIMATED 1000)."
        test_recipe:
          setup: ["Member M ACTIVE with patronage_cents_ytd 20000; FiscalYear then CLOSED; a DRAFT FINAL allocation with declared_rate 0.08."]
          setup_api_calls:
            - { call: "POST /coop/fiscal-years", payload: { year: 2026, patronage_rate: 0.05, equity_share_price_cents: 10000 }, as: CoopAdmin, captures: { fy_id: "$.data.id" } }
            - { call: "POST /coop/vendors", payload: { name: "V" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /coop/vendors/${v_id}/set-status", payload: { status: "APPROVED" }, as: InventoryManager }
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "OATS", name: "Oats", department: "GROCERY", unit_type: "EACH", base_price_cents: 10000, reorder_point: 0, reorder_qty: 10, is_taxable: false }, as: InventoryManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots", payload: { product_id: "${p_id}", vendor_id: "${v_id}", received_qty: 10, unit_cost_cents: 5000 }, as: InventoryManager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots/${lot_id}/post", payload: {}, as: InventoryManager }
            - { call: "POST /coop/members", payload: { full_name: "Fin M", email: "finm@x.com" }, as: CoopAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /coop/members/${m_id}/equity-contribution", payload: { amount_cents: 10000 }, as: FinanceManager }
            - { call: "POST /coop/members/${m_id}/approve", payload: {}, as: CoopAdmin }
            - { call: "POST /coop/registers", payload: { name: "R1" }, as: Cashier, captures: { reg_id: "$.data.id" } }
            - { call: "POST /coop/registers/${reg_id}/set-open", payload: { is_open: true }, as: Cashier }
            - { call: "POST /coop/sales", payload: { register_id: "${reg_id}", member_id: "${m_id}" }, as: Cashier, captures: { s_id: "$.data.id" } }
            - { call: "POST /coop/sales/${s_id}/lines", payload: { product_id: "${p_id}", inventory_lot_id: "${lot_id}", quantity: 2 }, as: Cashier }
            - { call: "POST /coop/sales/${s_id}/finalize", payload: {}, as: Cashier }
            - { call: "POST /coop/fiscal-years/${fy_id}/close", payload: {}, as: FinanceManager }
            - { call: "GET /coop/fiscal-years/${fy_id}", payload: {}, as: FinanceManager, captures: { fy_ver: "$.data.version" } }
            - { call: "POST /coop/patronage-allocations", payload: { fiscal_year_id: "${fy_id}", method: "FINAL", declared_rate: 0.08, expected_fiscal_year_version: "${fy_ver}" }, as: FinanceManager, captures: { alloc_id: "$.data.id" } }
          trigger:
            - { call: "POST /coop/patronage-allocations/${alloc_id}/finalize", payload: {}, as: FinanceManager }
          assert:
            - "Member.${m_id}.patronage_dividend_cents == 1600"
            - "PatronageAllocation.${alloc_id}.total_dividend_cents == 1600"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: final_allocation_declared_rate_required_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", "errors[ERR_DECLARED_RATE_REQUIRED]", entities.PatronageAllocation.fields.declared_rate]
        distinguishing_aspect: "Finalizing a FINAL allocation created without declared_rate returns ERR_DECLARED_RATE_REQUIRED (422)."
        test_recipe:
          setup: ["CLOSED fiscal year; a DRAFT FINAL allocation created WITHOUT declared_rate."]
          setup_api_calls:
            - { call: "POST /coop/fiscal-years", payload: { year: 2026, patronage_rate: 0.05, equity_share_price_cents: 10000 }, as: CoopAdmin, captures: { fy_id: "$.data.id" } }
            - { call: "POST /coop/fiscal-years/${fy_id}/close", payload: {}, as: FinanceManager }
            - { call: "GET /coop/fiscal-years/${fy_id}", payload: {}, as: FinanceManager, captures: { fy_ver: "$.data.version" } }
            - { call: "POST /coop/patronage-allocations", payload: { fiscal_year_id: "${fy_id}", method: "FINAL", expected_fiscal_year_version: "${fy_ver}" }, as: FinanceManager, captures: { alloc_id: "$.data.id" } }
          trigger:
            - { call: "POST /coop/patronage-allocations/${alloc_id}/finalize", payload: {}, as: FinanceManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_DECLARED_RATE_REQUIRED"

      - name: create_second_open_fiscal_year_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=8]", "errors[ERR_OPEN_FISCAL_YEAR_EXISTS]"]
        distinguishing_aspect: "Creating a second fiscal year while one is OPEN returns ERR_OPEN_FISCAL_YEAR_EXISTS (409)."
        test_recipe:
          setup: ["One OPEN fiscal year exists."]
          setup_api_calls:
            - { call: "POST /coop/fiscal-years", payload: { year: 2026, patronage_rate: 0.05, equity_share_price_cents: 10000 }, as: CoopAdmin, captures: { fy_id: "$.data.id" } }
          trigger:
            - { call: "POST /coop/fiscal-years", payload: { year: 2027, patronage_rate: 0.04, equity_share_price_cents: 10000 }, as: CoopAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_OPEN_FISCAL_YEAR_EXISTS"

      - name: line_unit_input_invalid_rejected
        claim_type: Violation → Error
        grounds: ["errors[ERR_LINE_UNIT_INPUT_INVALID]", calculations.sale_line_price]
        distinguishing_aspect: "Adding an EACH-product line with no quantity returns ERR_LINE_UNIT_INPUT_INVALID (400)."
        test_recipe:
          setup: ["OPEN register; POSTED EACH product; BUILDING non-member sale."]
          setup_api_calls:
            - { call: "POST /coop/vendors", payload: { name: "V" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /coop/vendors/${v_id}/set-status", payload: { status: "APPROVED" }, as: InventoryManager }
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "EGG", name: "Eggs", department: "GROCERY", unit_type: "EACH", base_price_cents: 400, reorder_point: 0, reorder_qty: 10 }, as: InventoryManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots", payload: { product_id: "${p_id}", vendor_id: "${v_id}", received_qty: 10, unit_cost_cents: 200 }, as: InventoryManager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots/${lot_id}/post", payload: {}, as: InventoryManager }
            - { call: "POST /coop/registers", payload: { name: "R1" }, as: Cashier, captures: { reg_id: "$.data.id" } }
            - { call: "POST /coop/registers/${reg_id}/set-open", payload: { is_open: true }, as: Cashier }
            - { call: "POST /coop/sales", payload: { register_id: "${reg_id}" }, as: Cashier, captures: { s_id: "$.data.id" } }
          trigger:
            - { call: "POST /coop/sales/${s_id}/lines", payload: { product_id: "${p_id}", inventory_lot_id: "${lot_id}" }, as: Cashier, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_LINE_UNIT_INPUT_INVALID"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: products_list_pagination
        claim_type: Listing
        grounds: [endpoints, entities.Product]
        distinguishing_aspect: "GET /coop/products with limit=1 over two seeded products returns total_count 2 and has_more true."
        test_recipe:
          setup: ["Two products under the same vendor."]
          setup_api_calls:
            - { call: "POST /coop/vendors", payload: { name: "V" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "A", name: "A", department: "GROCERY", unit_type: "EACH", base_price_cents: 100, reorder_point: 0, reorder_qty: 1 }, as: InventoryManager, captures: { p1: "$.data.id" } }
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "B", name: "B", department: "GROCERY", unit_type: "EACH", base_price_cents: 100, reorder_point: 0, reorder_qty: 1 }, as: InventoryManager, captures: { p2: "$.data.id" } }
          trigger:
            - { call: "GET /coop/products", payload: { vendor_id: "${v_id}", limit: 1, offset: 0 }, as: InventoryManager }
          assert:
            - "response.pagination.total_count == 2"
            - "response.pagination.has_more == true"

      - name: fk_reverse_lots_filtered_by_product
        claim_type: Retrieval
        grounds: [entities.InventoryLot.fields.product_id, endpoints]
        distinguishing_aspect: "GET /coop/inventory-lots?product_id=<p> returns exactly the lots for that product (FK reverse-reachability)."
        test_recipe:
          setup: ["One product with one DRAFT lot."]
          setup_api_calls:
            - { call: "POST /coop/vendors", payload: { name: "V" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "A", name: "A", department: "GROCERY", unit_type: "EACH", base_price_cents: 100, reorder_point: 0, reorder_qty: 1 }, as: InventoryManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots", payload: { product_id: "${p_id}", vendor_id: "${v_id}", received_qty: 5, unit_cost_cents: 50 }, as: InventoryManager, captures: { lot_id: "$.data.id" } }
          trigger:
            - { call: "GET /coop/inventory-lots", payload: { product_id: "${p_id}" }, as: InventoryManager }
          assert:
            - "response.data is an array containing a lot whose id == ${lot_id}"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: cashier_cannot_create_product
        claim_type: Authorization
        grounds: [roles, endpoints, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Cashier calling POST /coop/products (InventoryManager-exclusive) is denied with ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A vendor exists."]
          setup_api_calls:
            - { call: "POST /coop/vendors", payload: { name: "V" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
          trigger:
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "X", name: "X", department: "GROCERY", unit_type: "EACH", base_price_cents: 100, reorder_point: 0, reorder_qty: 1 }, as: Cashier, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: governance_quorum_approves_proposal
        claim_type: Valid Transition
        grounds: [calculations.board_tally, state_machines.BoardProposal.VOTING_to_APPROVED, entities.BoardProposal.fields.quorum_met]
        distinguishing_aspect: "One ACTIVE board member (eligible snapshot 1, quorum ceil(0.5*1)=1) casts FOR; tally reaches APPROVED with quorum_met true and for>against."
        test_recipe:
          setup: ["OPEN FiscalYear; Member B ACTIVE and is_board_member; a proposal advanced to VOTING; B has voted FOR."]
          setup_api_calls:
            - { call: "POST /coop/fiscal-years", payload: { year: 2026, patronage_rate: 0.05, equity_share_price_cents: 10000 }, as: CoopAdmin, captures: { fy_id: "$.data.id" } }
            - { call: "POST /coop/members", payload: { full_name: "Bea B", email: "bea@x.com", is_board_member: true }, as: CoopAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /coop/members/${b_id}/equity-contribution", payload: { amount_cents: 10000 }, as: FinanceManager }
            - { call: "POST /coop/members/${b_id}/approve", payload: {}, as: CoopAdmin }
            - { call: "POST /coop/board-proposals", payload: { title: "Budget 2026", proposal_type: "BUDGET" }, as: BoardAdmin, captures: { bp_id: "$.data.id" } }
            - { call: "POST /coop/board-proposals/${bp_id}/advance", payload: { action: "SUBMIT" }, as: BoardAdmin }
            - { call: "POST /coop/board-proposals/${bp_id}/advance", payload: { action: "OPEN_VOTING" }, as: BoardAdmin }
            - { call: "POST /coop/board-proposals/${bp_id}/votes", payload: { member_id: "${b_id}", vote: "FOR" }, as: Member, as_user_id: "${b_id}" }
          trigger:
            - { call: "POST /coop/board-proposals/${bp_id}/tally", payload: {}, as: BoardAdmin }
          assert:
            - "BoardProposal.${bp_id}.quorum_met == true"
            - "BoardProposal.${bp_id}.status == APPROVED"
            - "BoardProposal.${bp_id}.for_count == 1"

      - name: non_board_member_vote_rejected_not_eligible
        claim_type: Authorization
        grounds: ["validations[priority=7]", "errors[ERR_NOT_ELIGIBLE_VOTER]", entities.Member.fields.is_board_member]
        distinguishing_aspect: "An ACTIVE member who is not a board member is refused a vote with ERR_NOT_ELIGIBLE_VOTER (409)."
        test_recipe:
          setup: ["A VOTING proposal (eligible board member snapshot may be 0); a non-board ACTIVE member N."]
          setup_api_calls:
            - { call: "POST /coop/members", payload: { full_name: "Non B", email: "nonb@x.com", is_board_member: false }, as: CoopAdmin, captures: { n_id: "$.data.id" } }
            - { call: "POST /coop/board-proposals", payload: { title: "Policy P", proposal_type: "POLICY" }, as: BoardAdmin, captures: { bp_id: "$.data.id" } }
            - { call: "POST /coop/board-proposals/${bp_id}/advance", payload: { action: "SUBMIT" }, as: BoardAdmin }
            - { call: "POST /coop/board-proposals/${bp_id}/advance", payload: { action: "OPEN_VOTING" }, as: BoardAdmin }
          trigger:
            - { call: "POST /coop/board-proposals/${bp_id}/votes", payload: { member_id: "${n_id}", vote: "FOR" }, as: Member, as_user_id: "${n_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NOT_ELIGIBLE_VOTER"

      - name: duplicate_board_vote_rejected
        claim_type: Authorization
        grounds: ["validations[priority=8]", "errors[ERR_ALREADY_VOTED]", entities.BoardProposal.fields.voter_member_ids]
        distinguishing_aspect: "A board member casting a second vote on the same proposal is refused with ERR_ALREADY_VOTED (409)."
        test_recipe:
          setup: ["VOTING proposal; board member B ACTIVE who has already voted FOR once."]
          setup_api_calls:
            - { call: "POST /coop/fiscal-years", payload: { year: 2026, patronage_rate: 0.05, equity_share_price_cents: 10000 }, as: CoopAdmin, captures: { fy_id: "$.data.id" } }
            - { call: "POST /coop/members", payload: { full_name: "Dup B", email: "dupb@x.com", is_board_member: true }, as: CoopAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /coop/members/${b_id}/equity-contribution", payload: { amount_cents: 10000 }, as: FinanceManager }
            - { call: "POST /coop/members/${b_id}/approve", payload: {}, as: CoopAdmin }
            - { call: "POST /coop/board-proposals", payload: { title: "Bylaw C", proposal_type: "BYLAW" }, as: BoardAdmin, captures: { bp_id: "$.data.id" } }
            - { call: "POST /coop/board-proposals/${bp_id}/advance", payload: { action: "SUBMIT" }, as: BoardAdmin }
            - { call: "POST /coop/board-proposals/${bp_id}/advance", payload: { action: "OPEN_VOTING" }, as: BoardAdmin }
            - { call: "POST /coop/board-proposals/${bp_id}/votes", payload: { member_id: "${b_id}", vote: "FOR" }, as: Member, as_user_id: "${b_id}" }
          trigger:
            - { call: "POST /coop/board-proposals/${bp_id}/votes", payload: { member_id: "${b_id}", vote: "AGAINST" }, as: Member, as_user_id: "${b_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ALREADY_VOTED"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_fiscal_year_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[allocation-create-stale-fiscal-year]", "errors[ERR_STALE_FISCAL_YEAR_VERSION]"]
        distinguishing_aspect: "After allocation A creates against fiscal year version v (advancing it to v+1), a second create still carrying expected_fiscal_year_version=v is refused with ERR_STALE_FISCAL_YEAR_VERSION (412); two strictly sequential requests."
        test_recipe:
          setup: ["An OPEN fiscal year; its version captured as fy_ver0; one ESTIMATED allocation A already created with expected_fiscal_year_version=${fy_ver0} (which advanced the version)."]
          setup_api_calls:
            - { call: "POST /coop/fiscal-years", payload: { year: 2026, patronage_rate: 0.05, equity_share_price_cents: 10000 }, as: CoopAdmin, captures: { fy_id: "$.data.id" } }
            - { call: "GET /coop/fiscal-years/${fy_id}", payload: {}, as: FinanceManager, captures: { fy_ver0: "$.data.version" } }
            - { call: "POST /coop/patronage-allocations", payload: { fiscal_year_id: "${fy_id}", method: "ESTIMATED", expected_fiscal_year_version: "${fy_ver0}" }, as: FinanceManager, captures: { alloc_a: "$.data.id" } }
          trigger:
            - { call: "POST /coop/patronage-allocations", payload: { fiscal_year_id: "${fy_id}", method: "ESTIMATED", expected_fiscal_year_version: "${fy_ver0}" }, as: FinanceManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_FISCAL_YEAR_VERSION"

      - name: derived_inventory_value_on_lot_post
        claim_type: derived_field_reconciliation
        grounds: [state_machines.InventoryLot.DRAFT_to_POSTED, entities.Product.fields.inventory_value_cents, entities.Product.fields.qty_on_hand_total]
        distinguishing_aspect: "Posting a lot of received 5 @ unit_cost 200 reconciles the derived Product fields: qty_on_hand_total 5 and inventory_value_cents 1000."
        test_recipe:
          setup: ["APPROVED vendor; ACTIVE product; a DRAFT lot received 5 @ 200."]
          setup_api_calls:
            - { call: "POST /coop/vendors", payload: { name: "V" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /coop/vendors/${v_id}/set-status", payload: { status: "APPROVED" }, as: InventoryManager }
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "FLR", name: "Flour", department: "GROCERY", unit_type: "EACH", base_price_cents: 300, reorder_point: 2, reorder_qty: 10 }, as: InventoryManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots", payload: { product_id: "${p_id}", vendor_id: "${v_id}", received_qty: 5, unit_cost_cents: 200 }, as: InventoryManager, captures: { lot_id: "$.data.id" } }
          trigger:
            - { call: "POST /coop/inventory-lots/${lot_id}/post", payload: {}, as: InventoryManager }
          assert:
            - "Product.${p_id}.qty_on_hand_total == 5"
            - "Product.${p_id}.inventory_value_cents == 1000"
            - "Product.${p_id}.needs_reorder == false"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_line_totals_visible_same_request
        claim_type: immediate
        grounds: [calculations.sale_totals, entities.Sale.fields.subtotal_cents]
        distinguishing_aspect: "The add-line response reflects the updated running subtotal immediately (immediate consistency): after adding a qty-2 line of an EACH product base 250, the sale subtotal_cents is 500 in the same response."
        test_recipe:
          setup: ["OPEN register; POSTED EACH product base 250; BUILDING non-member sale."]
          setup_api_calls:
            - { call: "POST /coop/vendors", payload: { name: "V" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /coop/vendors/${v_id}/set-status", payload: { status: "APPROVED" }, as: InventoryManager }
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "PAS", name: "Pasta", department: "GROCERY", unit_type: "EACH", base_price_cents: 250, reorder_point: 0, reorder_qty: 10 }, as: InventoryManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots", payload: { product_id: "${p_id}", vendor_id: "${v_id}", received_qty: 10, unit_cost_cents: 100 }, as: InventoryManager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots/${lot_id}/post", payload: {}, as: InventoryManager }
            - { call: "POST /coop/registers", payload: { name: "R1" }, as: Cashier, captures: { reg_id: "$.data.id" } }
            - { call: "POST /coop/registers/${reg_id}/set-open", payload: { is_open: true }, as: Cashier }
            - { call: "POST /coop/sales", payload: { register_id: "${reg_id}" }, as: Cashier, captures: { s_id: "$.data.id" } }
          trigger:
            - { call: "POST /coop/sales/${s_id}/lines", payload: { product_id: "${p_id}", inventory_lot_id: "${lot_id}", quantity: 2 }, as: Cashier }
          assert:
            - "Sale.${s_id}.subtotal_cents == 500"

  # ---------------------------------------------------------------------------
  # Corners already covered by §1.8 difficulty instances (stubs, no test_recipe)
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_register_closed_on_finalize
        claim_type: Violation → Error
        grounds: ["errors[ERR_REGISTER_CLOSED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cesd_sale_finalize_requires_register_open
          rationale: "The ERR_REGISTER_CLOSED trigger is exercised as the cross-entity gate of the named §1.8 instance (and again in ppvc_state_beats_fiscal_on_finalize)."
      - name: error_vendor_not_approved_on_lot_post
        claim_type: Violation → Error
        grounds: ["errors[ERR_VENDOR_NOT_APPROVED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cesd_lot_post_requires_vendor_approved
          rationale: "ERR_VENDOR_NOT_APPROVED is the asserted failure of the named §1.8 instance."
      - name: error_product_recalled_on_add_line
        claim_type: Violation → Error
        grounds: ["errors[ERR_PRODUCT_RECALLED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / ppvc_safety_beats_referential_on_add_line
          rationale: "ERR_PRODUCT_RECALLED is the winning error of the named §1.8 priority-conflict instance."
      - name: error_promo_window_overlap
        claim_type: Violation → Error
        grounds: ["errors[ERR_PROMO_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rto_promotion_window_overlap_on_product
          rationale: "ERR_PROMO_WINDOW_OVERLAP is the asserted failure of the named §1.8 instance."
      - name: error_shift_overlap
        claim_type: Violation → Error
        grounds: ["errors[ERR_SHIFT_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rto_shift_rest_buffer_on_member
          rationale: "ERR_SHIFT_OVERLAP is the asserted failure of the named §1.8 instance."
      - name: error_insufficient_inventory_on_finalize
        claim_type: Violation → Error
        grounds: ["errors[ERR_INSUFFICIENT_INVENTORY]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / ppvc_state_beats_fiscal_on_finalize
          rationale: "The insufficient-inventory fiscal check is the losing (fiscal) leg of the named §1.8 conflict; its standalone trigger is the same code path."

  - section: state_machines
    instances:
      - name: compensation_inventory_units_on_refund
        claim_type: Compensation
        grounds: [state_machines.Sale.PAID_to_REFUNDED]
        excluded_because:
          difficulty_instance: compensating_invariant / ci_inventory_units_conserved_on_sale_refund
          rationale: "Refund inventory restock (compensation) is fully asserted by the named §1.8 instance."
      - name: compensation_equity_money_on_drop
        claim_type: Compensation
        grounds: [state_machines.Member.ACTIVE_to_DROPPED]
        excluded_because:
          difficulty_instance: compensating_invariant / ci_equity_money_conserved_on_member_drop
          rationale: "Equity refund (compensation) is fully asserted by the named §1.8 instance."
