          assert:
            - "permit issue after certificate lapse -> error_id == 'ERR_PERMIT_NOT_ISSUABLE' (certificate no longer ISSUED/TRANSMITTED)"
            - "transmit lapsed certificate -> error_id == 'ERR_CERTIFICATE_NOT_TRANSMITTABLE'"
