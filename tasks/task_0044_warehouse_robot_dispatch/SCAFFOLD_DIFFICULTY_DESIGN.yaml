scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual_variant_calc (≥2; different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: parent_task_aggregate_status_provisional_vs_persisted
        grounds:
          - calculations.parent_task_status
          - state_machines.Task.QUEUED_to_MERGED
          - endpoints["GET /fleets/{fleet_id}/tasks/{task_id}"]
        distinguishing_aspect: |
          Operates on entity domain Task (parent/children aggregation): GET .../tasks/{id} returns the persisted parent status (still QUEUED while children remain non-terminal), while GET .../tasks/{id}?view=projected returns COMPLETED for the same parent if every non-terminal child would project to COMPLETED. Same inputs, two valid algorithms produce different status values.
        test_recipe:
          setup:
            - "Create fleet, two map nodes (PICKUP CHARGER LANE) and an edge between them."
            - "POST a Task T with payload_units=15, max_units_per_robot=5 (will split into 3 children)."
            - "POST :split T; children C1,C2,C3 each payload_units=5, status=QUEUED."
            - "Complete only C1 via the full lifecycle (assign, start, step, complete) so C1.status=COMPLETED while C2,C3 remain QUEUED."
          trigger:
            - "GET /fleets/{fleet_id}/tasks/{T.id}"
            - "GET /fleets/{fleet_id}/tasks/{T.id}?view=projected"
          assert:
            - "First response data.status == 'QUEUED' (persisted: not all children terminal)"
            - "Second response data.status == 'COMPLETED' (projected: treats non-terminal children as if COMPLETED)"

      - name: throughput_metrics_closed_vs_open_window_boundary
        grounds:
          - calculations.throughput_metrics
          - endpoints["GET /fleets/{fleet_id}/metrics"]
          - entities.Task.fields.completed_at
        distinguishing_aspect: |
          Operates on entity domain Fleet-level metrics (different domain from Task aggregation): GET /metrics with window_boundary=closed counts a task whose completed_at == cutoff in the numerator S, while window_boundary=open excludes it. Same inputs (one task completed exactly at cutoff), two valid algorithms produce different task_completion_rate.
        test_recipe:
          setup:
            - "Create fleet with default config; advance_clock to clock_now=3600s."
            - "Create one map node and one robot, no other tasks."
            - "Construct exactly one task T1 with queued_at=0, started_at=0, completed_at=0 by running its full lifecycle at the very start (clock_now still 0)."
            - "Advance clock to 3600 so cutoff for default window_seconds=3600 is 3600-3600 = 0 = T1.completed_at."
          trigger:
            - "GET /fleets/{fleet_id}/metrics?window_seconds=3600&window_boundary=closed"
            - "GET /fleets/{fleet_id}/metrics?window_seconds=3600&window_boundary=open"
          assert:
            - "Closed-window task_completion_rate == 1.0000 (T1 counted in S because completed_at >= cutoff)"
            - "Open-window task_completion_rate == 0.0000 (T1 excluded because completed_at > cutoff is false)"

  # =========================================================================
  # Rule 2 — combinatorial_formula (≥2; different modes from a/b/c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: priority_score_mode_a_three_inputs_with_branching
        grounds:
          - calculations.priority_score
          - entities.Task.fields.priority_class
          - entities.Task.fields.queued_at
          - entities.Fleet.fields.clock_now
        distinguishing_aspect: |
          Mode (a) — formula with ≥3 inputs and non-linear interaction. priority_score = PRIORITY_BASE[priority_class] - floor((clock_now - queued_at) / 60) * 10, where PRIORITY_BASE switches on enum priority_class (CRITICAL=0, HIGH=1000, NORMAL=2000, LOW=3000). Three inputs (priority_class, queued_at, clock_now) combine non-linearly via the enum lookup and integer flooring; a NORMAL task aged 65s ranks above a HIGH task aged 0s because 2000 - floor(65/60)*10 = 1990 > 1000 - 0 = 1000 is false, but 2000 - floor(6065/60)*10 = 2000 - 1010 = 990 < 1000 — the crossing is non-monotone in priority_class given enough age.
        test_recipe:
          setup:
            - "Create fleet (defaults). Create one IDLE robot R near pickup node."
            - "At clock_now=0: POST task A with priority_class=HIGH, queued_at recorded as 0."
            - "Advance clock to clock_now=6065. POST task B with priority_class=NORMAL at clock_now=6065 (queued_at=6065)."
            - "Then advance clock by 0 (skip — we evaluate dispatch now). priority_score(A) = 1000 - floor(6065/60)*10 = 1000 - 101*10 = -10; priority_score(B) = 2000 - 0 = 2000. A wins."
          trigger:
            - "POST /fleets/{fleet_id}/dispatch"
          assert:
            - "Dispatch result first task assigned == A.id (priority_score -10 beats 2000)"
            - "B.status == 'QUEUED' after dispatch (only one robot, A took it)"

      - name: throughput_metrics_mode_b_rounding_order_pinned
        grounds:
          - calculations.throughput_metrics
          - endpoints["GET /fleets/{fleet_id}/metrics"]
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. fleet_robot_utilization is computed as round(mean(round(executing_seconds_i / window_seconds, 4) over robots i), 4) — i.e., "round per-robot then average then round again", NOT "sum then divide then round". For 3 robots with executing_seconds = 1, 1, 1 and window_seconds = 3 the per-robot ratios are 1/3 = 0.333333... round-half-up to 4dp = 0.3333; mean = (0.3333+0.3333+0.3333)/3 = 0.3333; final round = 0.3333. Sum-then-round would give round(3/9, 4) = 0.3333 — same. But with executing_seconds = 1,1,2 and window_seconds=3: per-robot rounds = 0.3333, 0.3333, 0.6667; mean = 0.4444333… round to 0.4444. Sum-then-round = round(4/9,4) = 0.4444. Equal here too. Use 5,5,5 with window 7: per-robot = round(5/7,4)=0.7143 (three times); mean=0.7143; final=0.7143. Sum-then-round = round(15/21,4)=0.7143. Pick a case where they diverge: executing_seconds=[2,2,2,2,2,2,1] window=3 — see assert.
        test_recipe:
          setup:
            - "Create fleet with 7 robots R1..R7. We need executing windows for each robot. Use the test driver to schedule full task lifecycles such that within a 3-second window: R1..R6 each spend 2s EXECUTING and R7 spends 1s EXECUTING. Concretely: set up tasks at clock_now=0 for R1..R6 with started_at=0, completed_at=2; and one task for R7 with started_at=2, completed_at=3. Then advance_clock to 3."
          trigger:
            - "GET /fleets/{fleet_id}/metrics?window_seconds=3"
          assert:
            - "Per-robot utilizations per-formula: round(2/3,4) = 0.6667 (×6 robots), round(1/3,4) = 0.3333 (×1 robot)."
            - "fleet_robot_utilization == round((0.6667*6 + 0.3333) / 7, 4) == round(4.3335/7, 4) == round(0.619071..., 4) == 0.6191"
            - "If implementer used sum-then-round they would output round((2*6+1)/(3*7), 4) == round(13/21, 4) == 0.6190 — distinct from 0.6191"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (≥2; different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: task_cyclic_rollback_to_queued
        grounds:
          - state_machines.Task.EXECUTING_to_ROLLED_BACK
          - state_machines.Task.ROLLED_BACK_to_QUEUED
          - entities.Task.fields.rollback_count
          - state_machines.Robot.IDLE_to_OUT_OF_SERVICE
        distinguishing_aspect: |
          Entity Task has a cycle: EXECUTING → ROLLED_BACK → QUEUED → ASSIGNED → EXECUTING → ROLLED_BACK → … This is structurally cyclic (not linear A→B→C), bounded by rollback_count <= 3 (after which CANCELLED). The cycle is the canonical revision-loop shape from §0.5 rule_id non_linear_state_machine.
        test_recipe:
          setup:
            - "Create fleet, simple 2-node map (P=pickup, D=dropoff with directed edge), 1 robot R at P, 1 task T pickup=P dropoff=D priority=HIGH."
            - "POST /dispatch → T.status==ASSIGNED; POST :start → T.status==EXECUTING; T.rollback_count==0"
            - "POST /faults on R with kind=MECHANICAL_FAULT → Task auto-transitions EXECUTING→ROLLED_BACK→QUEUED, T.rollback_count==1"
            - "POST :resolve on the incident → R returns to IDLE."
          trigger:
            - "POST /dispatch (second iteration) → T re-ASSIGNED"
            - "POST :start → EXECUTING again"
          assert:
            - "After step 1 (faults): T.status == 'QUEUED' AND T.rollback_count == 1 (proves cycle entry)"
            - "After step 2 (dispatch+start): T.status == 'EXECUTING' (proves second loop around the cycle)"

      - name: robot_parallel_dimensions_connectivity_x_operational_x_fault
        grounds:
          - state_machines.Robot.ONLINE_to_OFFLINE
          - state_machines.Robot.OFFLINE_to_ONLINE
          - state_machines.Robot.IDLE_to_OUT_OF_SERVICE
          - entities.Robot.fields.connectivity
          - entities.Robot.fields.operational_state
          - entities.Robot.fields.fault_state
        distinguishing_aspect: |
          Entity Robot carries three parallel state dimensions on a single row — operational_state (IDLE/EXECUTING/…), connectivity (ONLINE/OFFLINE), and fault_state (OK/FAULTED) — each evolving by its own trigger set independently of the others. Heartbeat timeout flips connectivity without touching operational_state until the cascading fault then opens; manual takeover/resolve flips fault_state while operational_state passes through UNDER_MANUAL_CONTROL→IDLE. This is the canonical "parallel state dimensions on one entity" shape from §0.5, and it is on a different entity (Robot) than Task's cyclic machine.
        test_recipe:
          setup:
            - "Create fleet, 1-node map (a CHARGER node N just to host the robot), 1 robot R at N with last_heartbeat_at=0."
            - "Confirm R: connectivity=ONLINE, operational_state=IDLE, fault_state=OK."
          trigger:
            - "POST /fleets/{fleet_id}:advance_clock with delta_seconds=15 (HEARTBEAT_TIMEOUT_SECONDS)"
            - "GET /fleets/{fleet_id}/robots/{R.id}"
            - "POST /fleets/{fleet_id}/fault_incidents/{incident_id}:takeover then :resolve"
            - "POST /fleets/{fleet_id}/robots/{R.id}:heartbeat"
          assert:
            - "After advance_clock: R.connectivity == 'OFFLINE' AND R.fault_state == 'FAULTED' AND R.operational_state == 'OUT_OF_SERVICE' (heartbeat timeout cascaded into fault)"
            - "After resolve (still no heartbeat): R.fault_state == 'OK' AND R.operational_state == 'IDLE' AND R.connectivity == 'OFFLINE' (proves connectivity is independent — fault resolution did NOT flip connectivity)"
            - "After heartbeat: R.connectivity == 'ONLINE' (proves connectivity dimension moves on its own trigger)"

  # =========================================================================
  # Rule 4 — transitive_cascade (≥2; different triggers; one depth ≥3)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: fault_incident_deep_cascade
        grounds:
          - state_machines.Robot.IDLE_to_OUT_OF_SERVICE
          - state_machines.Task.EXECUTING_to_ROLLED_BACK
          - state_machines.Task.ROLLED_BACK_to_QUEUED
          - state_machines.MapNode.OPEN_to_BLOCKED
          - entities.FaultIncident.fields.isolation_node_ids
        distinguishing_aspect: |
          Cascade depth = 4, originating from POST /faults: A (POST /faults) → B (Robot.fault_state=FAULTED, operational_state=OUT_OF_SERVICE) → C (Task.status EXECUTING→ROLLED_BACK, caused by B because rollback only fires when the robot owning the task is OUT_OF_SERVICE) → D (Task ROLLED_BACK→QUEUED, caused by C and rollback_count<=3) → E (isolation_node_ids set: MapNodes around robot.position_node_id BLOCKED, caused by the OPEN→FAULTED transition's isolation side-effect). Each link is caused by the previous, not by the original action — the QUEUED re-entry would not happen without the prior ROLLED_BACK.
        test_recipe:
          setup:
            - "Create fleet, 5-node map: a LANE strip N1-N2-N3-N4-N5 with edges in both directions; robot R at N3 mid-strip. Task T pickup=N2 dropoff=N4, max_units_per_robot=10 payload_units=1."
            - "Dispatch+start so T.status=EXECUTING and R.position=N3 with planned_path=[N3,N4]."
          trigger:
            - "POST /fleets/{fleet_id}/robots/{R.id}/faults with kind=MECHANICAL_FAULT"
          assert:
            - "Link 1: R.fault_state == 'FAULTED' AND R.operational_state == 'OUT_OF_SERVICE'"
            - "Link 2: T.status == 'QUEUED' AND T.rollback_count == 1 AND T.assigned_robot_id == null (ROLLED_BACK→QUEUED chain ran)"
            - "Link 3: MapNode N3 status == 'BLOCKED' AND blocked_reason == 'OBSTACLE'"
            - "Link 4: MapNode N2 status == 'BLOCKED' (Manhattan-distance-1 of N3) AND N4 status == 'BLOCKED'"
            - "FaultIncident.isolation_node_ids contains N2,N3,N4"

      - name: charging_session_completion_queue_advance_cascade
        grounds:
          - state_machines.ChargingSession.CHARGING_to_COMPLETED
          - state_machines.Robot.WAITING_CHARGER_to_CHARGING
          - entities.ChargingStation.fields.status
          - entities.ChargingStation.fields.occupying_robot_id
          - calculations.charge_progression
        distinguishing_aspect: |
          Cascade depth = 3, originating from POST :advance_clock that pushes a CHARGING robot past full threshold (different trigger than rule_4 instance 1, which originated from POST /faults). A (advance_clock) → B (battery_pct >= charging_full_pct causes ChargingSession.status CHARGING→COMPLETED) → C (caused by B: ChargingStation.status flips OCCUPIED→AVAILABLE and occupying_robot_id=null) → D (caused by C: the WAITING_CHARGER robot with the lowest battery_pct transitions to CHARGING; station immediately flips AVAILABLE→OCCUPIED via the next QUEUED→CHARGING transition). The selection of D's beneficiary requires C to have fired first.
        test_recipe:
          setup:
            - "Create fleet (defaults), 1 CHARGER node N, 1 charging station S at N."
            - "Create robot Ra at N with battery_pct=94, then POST :dock → ChargingSession_a CHARGING started_at=0; S.status=OCCUPIED."
            - "Create robot Rb (at N) with battery_pct=10, POST :queue_charger with charging_station_id=S.id → ChargingSession_b QUEUED; Rb.operational_state=WAITING_CHARGER."
          trigger:
            - "POST /fleets/{fleet_id}:advance_clock with delta_seconds=2 (battery 94 + 2*1 = 96 >= 95 charging_full_pct)"
          assert:
            - "Link 1: ChargingSession_a.status == 'COMPLETED' AND Ra.battery_pct == 96 AND Ra.operational_state == 'IDLE' (charge_progression completed it)"
            - "Link 2: S.status == 'OCCUPIED' AND S.occupying_robot_id == Rb.id (queue advanced; this would not happen without link 1's COMPLETED)"
            - "Link 3: ChargingSession_b.status == 'CHARGING' AND Rb.operational_state == 'CHARGING' (caused by link 2's station availability)"

  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict (≥2; different category pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: existence_beats_state_on_nonexistent_task
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - endpoints["POST /fleets/{fleet_id}/tasks/{task_id}:cancel"]
        distinguishing_aspect: |
          Category pair: existence (priority 3) vs state (priority 4). When both checks would fail (task does not exist AND would be in a non-cancellable state hypothetically), existence wins per validation ordering. Concretely: POST :cancel on a nonexistent task_id while the body could also be malformed for state purposes — error_id must be ERR_NOT_FOUND, NOT ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Create fleet F. Do not create any tasks."
          trigger:
            - "POST /fleets/{F.id}/tasks/nonexistent-task-id:cancel"
          assert:
            - "Response.status_code == 404 AND response.body.data.error_id == 'ERR_NOT_FOUND' (existence beats state)"
            - "The implementation MUST NOT return ERR_INVALID_STATE here"

      - name: business_safety_beats_business_constraint_on_faulted_robot_step
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - state_machines.Robot.IDLE_to_OUT_OF_SERVICE
          - endpoints["POST /fleets/{fleet_id}/robots/{robot_id}:step"]
        distinguishing_aspect: |
          Category pair: business_safety (priority 5, ERR_ROBOT_FAULTED) vs business_constraint (priority 10, ERR_RIGHT_OF_WAY_MISSING). A FAULTED robot attempting :step at an INTERSECTION without a HELD slot reservation would fail BOTH checks. business_safety wins.
        test_recipe:
          setup:
            - "Create fleet, map with one LANE node L and one INTERSECTION node I (capacity 1), edge L→I."
            - "Create robot R at L with battery_pct=100, no slot reservation at I."
            - "Create task T pickup=L dropoff=I; dispatch+start so T.status=EXECUTING and planned_path=[L,I]."
            - "POST /faults on R with kind=SENSOR_ANOMALY → R is now FAULTED."
          trigger:
            - "POST /fleets/{fleet_id}/robots/{R.id}:step"
          assert:
            - "Response.status_code == 409 AND response.body.data.error_id == 'ERR_ROBOT_FAULTED' (safety wins)"
            - "The implementation MUST NOT return ERR_RIGHT_OF_WAY_MISSING here even though that check would also fail"

  # =========================================================================
  # Rule 6 — boundary_precision_check (≥2; different metrics/endpoints)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: battery_assign_strict_greater_than_threshold
        grounds:
          - validations[priority=8]
          - entities.Fleet.fields.charging_low_threshold_pct
          - entities.Robot.fields.battery_pct
          - endpoints["POST /fleets/{fleet_id}/tasks/{task_id}:assign"]
        distinguishing_aspect: |
          Boundary on :assign uses strict greater-than (>). With Fleet.charging_low_threshold_pct=20 and Robot.battery_pct=20, assignment must be REJECTED (because 20 > 20 is false), not accepted. battery_pct=21 must succeed. This is a numeric threshold crossing on the :assign endpoint.
        test_recipe:
          setup:
            - "Create fleet with charging_low_threshold_pct=20 (default)."
            - "Map: 2 nodes (P, D) with edge P→D; cost 1."
            - "Create task T pickup=P dropoff=D priority=HIGH."
            - "Create robot Ra at P with battery_pct=20 (exactly at threshold)."
            - "Create robot Rb at P with battery_pct=21 (one above)."
          trigger:
            - "POST /fleets/{fleet_id}/tasks/{T.id}:assign with robot_id=Ra.id"
            - "POST /fleets/{fleet_id}/tasks/{T.id}:assign with robot_id=Rb.id"
          assert:
            - "First call: 409 with error_id == 'ERR_BATTERY_LOW' (20 > 20 is false)"
            - "Second call: 200, T.status == 'ASSIGNED', T.assigned_robot_id == Rb.id (21 > 20 is true)"

      - name: empty_set_throughput_metrics_no_division_by_zero
        grounds:
          - calculations.throughput_metrics
          - endpoints["GET /fleets/{fleet_id}/metrics"]
        distinguishing_aspect: |
          Empty-set boundary on /metrics: with zero tasks in window AND zero robots executing, task_completion_rate formula uses max(1, |T|) in denominator → result is 0.0000, not error and not NaN. This is the empty-collection edge on a different endpoint (/metrics) from the threshold-crossing on :assign in instance 1.
        test_recipe:
          setup:
            - "Create fleet F (defaults). Do NOT create any tasks. Do NOT create any robots."
          trigger:
            - "GET /fleets/{F.id}/metrics?window_seconds=3600"
          assert:
            - "Response.status_code == 200"
            - "data.task_completion_rate == 0.0000"
            - "data.fleet_robot_utilization == 0.0000 (mean over empty robot set, treated as 0)"
            - "data.fault_rate == 0.0000"
            - "data.bottleneck_zones == [] (empty list, not null)"

  # =========================================================================
  # Rule 7 — cross_entity_state_dependency (≥2; different entity pairs)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: task_start_depends_on_robot_connectivity
        grounds:
          - state_machines.Task.ASSIGNED_to_EXECUTING
          - validations[priority=6]
          - entities.Robot.fields.connectivity
          - endpoints["POST /fleets/{fleet_id}/tasks/{task_id}:start"]
        distinguishing_aspect: |
          Entity pair Task↔Robot: Task.status ASSIGNED→EXECUTING is only valid when the assigned Robot.connectivity == ONLINE. The transition is on Task, but its precondition reads a field on Robot. Failing this check yields ERR_ROBOT_OFFLINE on :start.
        test_recipe:
          setup:
            - "Create fleet (defaults; HEARTBEAT_TIMEOUT_SECONDS=15)."
            - "Map: 2 nodes P (PARK) and D (SHELF) with edge P→D cost=1."
            - "Create robot R at P with battery_pct=100, last_heartbeat_at=0 (Fleet.clock_now=0)."
            - "Create task T pickup=P dropoff=D. POST /dispatch — T.status becomes ASSIGNED, R.current_task_id = T.id."
            - "Confirm: T.status == 'ASSIGNED' AND R.connectivity == 'ONLINE'."
          trigger:
            - "POST /fleets/{fleet_id}:advance_clock with delta_seconds=15"
            - "GET /fleets/{fleet_id}/tasks/{T.id}"
            - "GET /fleets/{fleet_id}/robots/{R.id}"
          assert:
            - "After advance_clock: R.connectivity == 'OFFLINE' (cross-entity trigger fired)"
            - "T.status == 'QUEUED' (Task left ASSIGNED state purely because of R's connectivity flip — the dependency is observable as the rollback chain that runs only when R leaves connectivity=ONLINE)"
            - "T.assigned_robot_id == null AND T.rollback_count == 1 (rollback chain proves the cross-entity precondition was the cause)"

      - name: charging_session_to_charging_depends_on_station_status
        grounds:
          - state_machines.ChargingSession.QUEUED_to_CHARGING
          - entities.ChargingStation.fields.status
          - endpoints["POST /fleets/{fleet_id}/robots/{robot_id}:queue_charger"]
        distinguishing_aspect: |
          Entity pair ChargingSession↔ChargingStation (a different pair than Task↔Robot in instance 1): ChargingSession.status QUEUED→CHARGING is gated on the related ChargingStation.status == AVAILABLE. The transition occurs on ChargingSession but its precondition reads a field on ChargingStation. The dependency is observable by the order in which queued sessions become CHARGING when the station flips AVAILABLE.
        test_recipe:
          setup:
            - "Create fleet, 1 CHARGER node N, 1 station S at N."
            - "Create robot Ra at N, POST :dock → ChargingSession_a CHARGING; S OCCUPIED."
            - "Create robot Rb at N, POST :queue_charger with S.id → ChargingSession_b status=QUEUED."
            - "Confirm before unlock: ChargingSession_b.status == 'QUEUED' (because S.status == 'OCCUPIED')."
          trigger:
            - "POST /fleets/{fleet_id}/charging_sessions/{ChargingSession_a.id}:cancel"
          assert:
            - "ChargingSession_a.status == 'CANCELLED'"
            - "S.status == 'OCCUPIED' (because queue advance assigned it to Rb during the cancel cascade)"
            - "ChargingSession_b.status == 'CHARGING' AND Rb.operational_state == 'CHARGING' (state transitioned only because S.status flipped to AVAILABLE briefly during the cancel)"

  # =========================================================================
  # Rule 8 — resource_temporal_overlap (≥2; different interval semantics)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: slot_reservation_per_slot_uniqueness
        grounds:
          - entities.SlotReservation
          - concurrency_rules[2]   # "Two robots reserve the same intersection slot"
          - validations[priority=12]
          - endpoints["POST /fleets/{fleet_id}/slot_reservations"]
        distinguishing_aspect: |
          Interval semantics: discrete closed slot intervals [slot_index, slot_index] of length Fleet.slot_seconds, keyed by (node_id, slot_index). Two reservations on the same node with adjacent slot_index values (e.g., 0 and 1) MUST both succeed (no buffer), but two reservations on the same node with identical slot_index MUST collide (unique HELD). Resource: SlotReservation entity. This is point-in-discrete-time uniqueness.
        test_recipe:
          setup:
            - "Create fleet with slot_seconds=10."
            - "Create map node I kind=INTERSECTION capacity=1 plus minimal infrastructure to put two robots Ra, Rb on adjacent nodes."
          trigger:
            - "POST /fleets/{fleet_id}/slot_reservations with node_id=I.id, robot_id=Ra.id, scheduled_at='1970-01-01T00:00:00.000Z' (slot_index=0)"
            - "POST /fleets/{fleet_id}/slot_reservations with node_id=I.id, robot_id=Rb.id, scheduled_at='1970-01-01T00:00:10.000Z' (slot_index=1)"
            - "POST /fleets/{fleet_id}/slot_reservations with node_id=I.id, robot_id=Rb.id, scheduled_at='1970-01-01T00:00:00.000Z' (slot_index=0 — collision)"
          assert:
            - "First call: 201, status=HELD, slot_index=0"
            - "Second call: 201, status=HELD, slot_index=1 (adjacent slot OK — no buffer)"
            - "Third call: 409 with error_id == 'ERR_SLOT_ALREADY_RESERVED'"

      - name: mapnode_capacity_aggregate_occupancy
        grounds:
          - entities.MapNode.fields.capacity
          - state_machines.Robot.EXECUTING_to_WAITING_RIGHT_OF_WAY
          - state_machines.Robot.WAITING_RIGHT_OF_WAY_to_EXECUTING
          - endpoints["POST /fleets/{fleet_id}/robots/{robot_id}:step"]
        distinguishing_aspect: |
          Interval semantics: aggregate spatial capacity over a node — a LANE node with capacity=3 can hold up to three robots simultaneously (occupants(node) < capacity), with NO time discretization. Different from slot reservations because the constraint is per-instant aggregate count, not per-slot point uniqueness. Resource: MapNode entity (different from SlotReservation entity in instance 1).
        test_recipe:
          setup:
            - "Create fleet. Map: source nodes S1,S2,S3,S4 all with edges to one LANE node L with capacity=3."
            - "Create 4 robots R1..R4 at S1..S4 each, all IDLE."
            - "Create 4 tasks T1..T4, pickup at L and arbitrary dropoffs along outgoing edges; dispatch each so R1..R4 are EXECUTING; planned_path begins with stepping to L."
          trigger:
            - "POST :step on R1 — R1.position=L"
            - "POST :step on R2 — R2.position=L (occupants=2 < 3)"
            - "POST :step on R3 — R3.position=L (occupants=3, but check is 'next move would make occupants=3, still < capacity? actually current check at step-time is occupants(L) < capacity BEFORE the move. Before R3 moves: occupants=2 < 3 OK, after move occupants=3.)"
            - "POST :step on R4 — would push occupants from 3 to 4 (3 < 3 is false), robot transitions to WAITING_RIGHT_OF_WAY"
          assert:
            - "After step R1, R2, R3: each Robot.position_node_id == L, all operational_state == 'EXECUTING' (3 robots co-occupy capacity-3 LANE node)"
            - "After step R4 attempt: R4.operational_state == 'WAITING_RIGHT_OF_WAY' AND R4.position_node_id == S4 (did not move)"
            - "After POST :complete on R1 (assume planned_path lets R1 finish at L for its task — adjust drop = L): R1 leaves L, then POST :step on R4 succeeds (occupants now 2 < 3)"

  # =========================================================================
  # Rule 9 — compensating_invariant (≥2; different conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: split_conserves_payload_units_invariant
        grounds:
          - state_machines.Task.QUEUED_to_QUEUED   # the split self-transition
          - entities.Task.fields.payload_units
          - entities.Task.fields.parent_task_id
          - endpoints["POST /fleets/{fleet_id}/tasks/{task_id}:split"]
        distinguishing_aspect: |
          Conserved quantity: parent.payload_units. Forward action :split creates N children; the named global invariant is parent.payload_units == sum(child.payload_units for child in children of parent). The compensating action — :cancel on every child — leaves the parent's payload_units field unchanged. The invariant is on integer payload units (a financial-style conserved scalar), distinct from rule_9 instance 2 (count of OPEN map nodes).
        test_recipe:
          setup:
            - "Create fleet, minimal map (P,D). Create task T payload_units=23 max_units_per_robot=5 priority=NORMAL pickup=P dropoff=D status=QUEUED."
          trigger:
            - "POST /fleets/{fleet_id}/tasks/{T.id}:split"
            - "GET T and each child"
            - "POST :cancel on each child"
            - "GET T again"
          assert:
            - "After split: ceil(23/5) == 5 children created; child payload_units = [5,5,5,5,3] (last child absorbs remainder); sum == 23 == T.payload_units"
            - "Sum invariant: sum(c.payload_units for c in T.children) == T.payload_units == 23 (exact integer equality)"
            - "After cancelling every child: T.payload_units still == 23 (compensating action leaves named quantity unchanged)"

      - name: fault_isolation_conserves_open_node_count_invariant
        grounds:
          - state_machines.MapNode.OPEN_to_BLOCKED
          - state_machines.MapNode.BLOCKED_to_OPEN
          - entities.FaultIncident.fields.isolation_node_ids
          - endpoints["POST /fleets/{fleet_id}/fault_incidents/{incident_id}:resolve"]
        distinguishing_aspect: |
          Conserved quantity: count of MapNodes with status == OPEN. Forward action POST /faults sets K nodes BLOCKED (from OPEN) — count_open decreases by exactly K. Compensating action :resolve on the same incident restores those exact K nodes to OPEN — count_open returns to its pre-incident value. The invariant is "count_open after (POST /faults; :takeover; :resolve) equals count_open before". This is a discrete-count cardinality invariant (different conserved quantity type from rule_9 instance 1's payload_units scalar).
        test_recipe:
          setup:
            - "Create fleet, 5 LANE nodes N1..N5 all status=OPEN."
            - "Create robot R at N3, no current task, fault_state=OK."
            - "Record count_open_before = count(MapNode where status == 'OPEN') == 5."
          trigger:
            - "POST /fleets/{fleet_id}/robots/{R.id}/faults with kind=MECHANICAL_FAULT"
            - "Record count_open_mid"
            - "POST /fleets/{fleet_id}/fault_incidents/{incident_id}:takeover then :resolve"
            - "Record count_open_after"
          assert:
            - "count_open_mid < count_open_before (some nodes within Manhattan distance 1 of N3 went BLOCKED)"
            - "count_open_after == count_open_before == 5 (the named conserved quantity is preserved by the OPEN→TAKEOVER→RESOLVE compensation cycle)"
            - "FaultIncident.status == 'RESOLVED' AND every MapNode in FaultIncident.isolation_node_ids has status == 'OPEN' AND blocked_reason == null"
