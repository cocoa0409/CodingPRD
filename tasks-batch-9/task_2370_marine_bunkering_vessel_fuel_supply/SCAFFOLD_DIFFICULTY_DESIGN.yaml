          A different direction and a different pair of entities: creating a BunkerDeliveryNote
          depends on the SECOND, parallel state dimension of its DeliveryOrder
          (measurement_status), not on the logistics dimension, which is already DELIVERED. Under
          a JOINT_SURVEY_MANDATORY customer the order stops at FIGURES_RECORDED, so BDN issuance
          fails with ERR_MEASUREMENT_NOT_AGREED and only succeeds after the joint survey and the
          AGREE decision, at which point delivered_quantity_mt is 1191.850 rather than 1198.450.
