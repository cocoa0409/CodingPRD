scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (>=2, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: spoilage_credit_original_paper_vs_post_harvest_pricing
        grounds:
          - calculations.spoilage_credit
          - entities.SpoilageCredit.fields.pricing_variant
          - entities.SpoilageCredit.fields.credit_cents
        distinguishing_aspect: |
          Same spoilage inputs (credit_qty_kg=1.0 on an 800 c/kg line) produce
          different credit_cents depending on pricing_variant: ORIGINAL_PAPER
          credits at the invoiced price (800), POST_HARVEST_PRICING credits at
          the capped post-harvest unit price (640 when overweight_excess=0.20
          drives price_adjustment to 0.80). Entity domain: SpoilageCredit / OrderItem.
        test_recipe:
          setup:
            - "FoodSafetyPlan APPROVED; LISTED variety at 800 c/kg; RELEASED seed lot"
            - "CropPlan base_harvest_kg=80 (4 trays x 20kg), harvested 60 -> harvest_ratio 0.75 (cap 1.00)"
            - "Variety-level plan base 40kg, harvested 52 -> overweight_ratio 1.30, excess 0.20, price_adjustment 0.80"
            - "Customer with a CONFIRMED standing order, one line 2.4kg @800 -> ext 1920; delivered; stop DELIVERED"
          setup_api_calls:
            - { call: "POST /grow/food-safety-plans", payload: { plan_code: "FSP-A", water_test_current: true, sanitation_sop_version: "SOP-1" }, as: OpsManager, captures: { fsp_id: "$.data.id" } }
            - { call: "POST /grow/food-safety-plans/${fsp_id}/approve", payload: {}, as: OpsManager }
            - { call: "POST /grow/varieties", payload: { name: "Red Amaranth", crop_category: "MICROGREEN", days_to_harvest: 10, expected_yield_grams_per_tray: 20000, listed_price_cents_per_kg: 800, min_order_grams: 250 }, as: Grower, captures: { var_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials", payload: { variety_id: "${var_id}", sow_date: "2026-08-03", chef_panel_size: 1, yield_score: 7.0 }, as: Grower, captures: { trial_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials/${trial_id}/record-panel", payload: { scores: [7.0] }, as: Grower }
            - { call: "POST /grow/variety-trials/${trial_id}/decide", payload: { outcome: "ADOPT" }, as: Grower }
            - { call: "POST /grow/seed-lots", payload: { variety_id: "${var_id}", supplier_name: "SeedCo", lot_code: "L1", received_date: "2026-08-01", seeds_on_hand_grams: 500 }, as: Grower, captures: { lot_id: "$.data.id" } }
            - { call: "POST /grow/germination-tests", payload: { seed_lot_id: "${lot_id}", seeds_sown_count: 96 }, as: Grower, captures: { gt_id: "$.data.id" } }
            - { call: "POST /grow/germination-tests/${gt_id}/record-result", payload: { germinated_count: 84 }, as: Grower }
            - { call: "POST /grow/crop-plans", payload: { variety_id: "${var_id}", planned_sow_date: "2026-08-03", planned_tray_count: 4, seed_grams_required: 20 }, as: Grower, captures: { plan_id: "$.data.id", plan_v: "$.data.version" } }
            - { call: "POST /grow/crop-plans/${plan_id}/sow", payload: { seed_lot_id: "${lot_id}", expected_crop_plan_version: "${plan_v}" }, as: Grower }
            - { call: "POST /grow/customers", payload: { business_name: "Bistro", contact_email: "c@b.com", delivery_zone: "NORTH" }, as: OpsManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /grow/standing-orders", payload: { customer_id: "${cust_id}", effective_week_start: "2026-08-03", change_cutoff_day: 2 }, as: Chef, as_user_id: "${cust_id}", captures: { so_id: "$.data.id", so_v: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/lines", payload: { variety_id: "${var_id}", qty_kg: 2.4, expected_standing_order_version: "${so_v}" }, as: Chef, as_user_id: "${cust_id}", captures: { item_id: "$.data.id" } }
            - { call: "GET /grow/standing-orders/${so_id}", payload: {}, as: Chef, as_user_id: "${cust_id}", captures: { so_v2: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/confirm", payload: { expected_standing_order_version: "${so_v2}" }, as: Chef, as_user_id: "${cust_id}" }
            - { call: "POST /grow/delivery-routes", payload: { route_code: "R-N1", service_date: "2026-08-14", min_stop_subtotal_cents: 1000 }, as: OpsManager, captures: { route_id: "$.data.id" } }
            - { call: "POST /grow/delivery-routes/${route_id}/stops", payload: { customer_id: "${cust_id}", standing_order_id: "${so_id}" }, as: OpsManager, captures: { stop_id: "$.data.id" } }
            - { call: "POST /grow/delivery-routes/${route_id}/dispatch", payload: {}, as: OpsManager }
            - { call: "POST /grow/delivery-stops/${stop_id}/deliver", payload: {}, as: OpsManager }
          trigger:
            - { call: "POST /grow/spoilage-credits", payload: { delivery_stop_id: "${stop_id}", order_item_id: "${item_id}", credit_qty_kg: 1.0, pricing_variant: "ORIGINAL_PAPER" }, as: OpsManager, captures: { credit_op: "$.data.credit_cents" } }
            - { call: "POST /grow/spoilage-credits", payload: { delivery_stop_id: "${stop_id}", order_item_id: "${item_id}", credit_qty_kg: 1.0, pricing_variant: "POST_HARVEST_PRICING" }, as: OpsManager, captures: { credit_ph: "$.data.credit_cents" } }
          assert:
            - "SpoilageCredit(ORIGINAL_PAPER).credit_cents == 800"
            - "SpoilageCredit(POST_HARVEST_PRICING).credit_cents == 640"
            - "credit_op != credit_ph"

      - name: standing_order_projection_all_lines_vs_confirmed_only
        grounds:
          - calculations.standing_order_revenue_projection
          - calculations.order_line_extension
          - entities.StandingOrder.fields.weekly_subtotal_cents
        distinguishing_aspect: |
          Same order's revenue projection differs by variant: all_lines counts
          DRAFT edits (5800), confirmed_only excludes the unconfirmed 900-cent
          line (4900). Entity domain: StandingOrder / OrderItem (distinct from
          the SpoilageCredit domain of the sibling instance).
        test_recipe:
          setup:
            - "LISTED variety; customer; one standing order with lines 2x800, 1x1500, 3x600 CONFIRMED"
            - "A 4th line 1x900 added but left unconfirmed (order reverted to DRAFT edit state)"
          setup_api_calls:
            - { call: "POST /grow/varieties", payload: { name: "Pea Shoots", crop_category: "MICROGREEN", days_to_harvest: 9, expected_yield_grams_per_tray: 18000, listed_price_cents_per_kg: 800, min_order_grams: 250 }, as: Grower, captures: { var_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials", payload: { variety_id: "${var_id}", sow_date: "2026-08-03", chef_panel_size: 1, yield_score: 7.0 }, as: Grower, captures: { trial_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials/${trial_id}/record-panel", payload: { scores: [7.5] }, as: Grower }
            - { call: "POST /grow/variety-trials/${trial_id}/decide", payload: { outcome: "ADOPT" }, as: Grower }
            - { call: "POST /grow/customers", payload: { business_name: "Cafe", contact_email: "c@c.com", delivery_zone: "SOUTH" }, as: OpsManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /grow/standing-orders", payload: { customer_id: "${cust_id}", effective_week_start: "2026-08-03", change_cutoff_day: 2 }, as: Chef, as_user_id: "${cust_id}", captures: { so_id: "$.data.id", so_v: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/lines", payload: { variety_id: "${var_id}", qty_kg: 2.0, expected_standing_order_version: "${so_v}" }, as: Chef, as_user_id: "${cust_id}" }
            - { call: "GET /grow/standing-orders/${so_id}", payload: {}, as: Chef, as_user_id: "${cust_id}", captures: { so_v1: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/lines", payload: { variety_id: "${var_id}", qty_kg: 1.0, unit_price_cents_per_kg: 1500, expected_standing_order_version: "${so_v1}" }, as: Chef, as_user_id: "${cust_id}" }
            - { call: "GET /grow/standing-orders/${so_id}", payload: {}, as: Chef, as_user_id: "${cust_id}", captures: { so_v2: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/lines", payload: { variety_id: "${var_id}", qty_kg: 3.0, unit_price_cents_per_kg: 600, expected_standing_order_version: "${so_v2}" }, as: Chef, as_user_id: "${cust_id}" }
            - { call: "GET /grow/standing-orders/${so_id}", payload: {}, as: Chef, as_user_id: "${cust_id}", captures: { so_v3: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/confirm", payload: { expected_standing_order_version: "${so_v3}" }, as: Chef, as_user_id: "${cust_id}", captures: { so_v4: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/lines", payload: { variety_id: "${var_id}", qty_kg: 1.0, unit_price_cents_per_kg: 900, expected_standing_order_version: "${so_v4}" }, as: Chef, as_user_id: "${cust_id}" }
          trigger:
            - { call: "GET /grow/standing-orders/${so_id}/projection", payload: {}, as: Grower, captures: { proj_all: "$.data.weekly_subtotal_cents" } }
          assert:
            - "projection all_lines == 5800"
            - "projection confirmed_only == 4900"
            - "all_lines != confirmed_only"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (>=2, different modes a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: post_harvest_credit_multi_input_nonlinear
        grounds:
          - calculations.spoilage_credit
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs and non-linear interaction — the
          POST_HARVEST_PRICING unit price multiplies plan_cap_factor (threshold
          on harvest_ratio) by price_adjustment (nested min/max on
          overweight_excess), then multiplies by qty and rounds once. With
          harvest_ratio=0.625 (<0.70 -> cap 0.85) and overweight_ratio=1.30
          (excess 0.20 -> adjustment 0.80), unit = 800*0.85*0.80 = 544, and
          credit for 1.5kg = 816.
        test_recipe:
          setup:
            - "APPROVED FSP; LISTED variety 800 c/kg; RELEASED lot"
            - "CropPlan base 80kg; harvested 50 -> harvest_ratio 0.625 (<0.70 -> cap 0.85)"
            - "Variety-level base 40kg, harvested 52 -> overweight_ratio 1.30 -> excess 0.20 -> adj 0.80"
            - "Delivered order line for the variety; stop DELIVERED"
          setup_api_calls:
            - { call: "POST /grow/food-safety-plans", payload: { plan_code: "FSP-B", water_test_current: true, sanitation_sop_version: "SOP-1" }, as: OpsManager, captures: { fsp_id: "$.data.id" } }
            - { call: "POST /grow/food-safety-plans/${fsp_id}/approve", payload: {}, as: OpsManager }
            - { call: "POST /grow/varieties", payload: { name: "Sunflower", crop_category: "MICROGREEN", days_to_harvest: 8, expected_yield_grams_per_tray: 20000, listed_price_cents_per_kg: 800, min_order_grams: 250 }, as: Grower, captures: { var_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials", payload: { variety_id: "${var_id}", sow_date: "2026-08-03", chef_panel_size: 1, yield_score: 6.5 }, as: Grower, captures: { trial_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials/${trial_id}/record-panel", payload: { scores: [6.5] }, as: Grower }
            - { call: "POST /grow/variety-trials/${trial_id}/decide", payload: { outcome: "ADOPT" }, as: Grower }
            - { call: "POST /grow/seed-lots", payload: { variety_id: "${var_id}", supplier_name: "SeedCo", lot_code: "L2", received_date: "2026-08-01", seeds_on_hand_grams: 500 }, as: Grower, captures: { lot_id: "$.data.id" } }
            - { call: "POST /grow/germination-tests", payload: { seed_lot_id: "${lot_id}", seeds_sown_count: 100 }, as: Grower, captures: { gt_id: "$.data.id" } }
            - { call: "POST /grow/germination-tests/${gt_id}/record-result", payload: { germinated_count: 90 }, as: Grower }
            - { call: "POST /grow/crop-plans", payload: { variety_id: "${var_id}", planned_sow_date: "2026-08-03", planned_tray_count: 4, seed_grams_required: 20 }, as: Grower, captures: { plan_id: "$.data.id", plan_v: "$.data.version" } }
            - { call: "POST /grow/crop-plans/${plan_id}/sow", payload: { seed_lot_id: "${lot_id}", expected_crop_plan_version: "${plan_v}" }, as: Grower }
            - { call: "POST /grow/customers", payload: { business_name: "Deli", contact_email: "d@d.com", delivery_zone: "NORTH" }, as: OpsManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /grow/standing-orders", payload: { customer_id: "${cust_id}", effective_week_start: "2026-08-03", change_cutoff_day: 2 }, as: Chef, as_user_id: "${cust_id}", captures: { so_id: "$.data.id", so_v: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/lines", payload: { variety_id: "${var_id}", qty_kg: 2.0, expected_standing_order_version: "${so_v}" }, as: Chef, as_user_id: "${cust_id}", captures: { item_id: "$.data.id" } }
            - { call: "GET /grow/standing-orders/${so_id}", payload: {}, as: Chef, as_user_id: "${cust_id}", captures: { so_v2: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/confirm", payload: { expected_standing_order_version: "${so_v2}" }, as: Chef, as_user_id: "${cust_id}" }
            - { call: "POST /grow/delivery-routes", payload: { route_code: "R-N2", service_date: "2026-08-14", min_stop_subtotal_cents: 500 }, as: OpsManager, captures: { route_id: "$.data.id" } }
            - { call: "POST /grow/delivery-routes/${route_id}/stops", payload: { customer_id: "${cust_id}", standing_order_id: "${so_id}" }, as: OpsManager, captures: { stop_id: "$.data.id" } }
            - { call: "POST /grow/delivery-routes/${route_id}/dispatch", payload: {}, as: OpsManager }
            - { call: "POST /grow/delivery-stops/${stop_id}/deliver", payload: {}, as: OpsManager }
          trigger:
            - { call: "POST /grow/spoilage-credits", payload: { delivery_stop_id: "${stop_id}", order_item_id: "${item_id}", credit_qty_kg: 1.5, pricing_variant: "POST_HARVEST_PRICING" }, as: OpsManager }
          assert:
            - "SpoilageCredit.credit_cents == 816"

      - name: order_subtotal_per_line_round_then_sum
        grounds:
          - calculations.order_line_extension
          - entities.OrderItem.fields.line_extension_cents
          - entities.StandingOrder.fields.weekly_subtotal_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The scaffold pins
          round-per-line-then-sum. Two lines of 1.005 kg @ 100 c/kg each round
          to 101 per line, summing to 202; the alternative sum-then-round gives
          201. Asserting 202 pins the rounding order. Distinct mode from the
          sibling (which is mode a).
        test_recipe:
          setup:
            - "LISTED variety at 100 c/kg; customer; DRAFT standing order"
            - "Two lines each 1.005 kg @ 100 c/kg"
          setup_api_calls:
            - { call: "POST /grow/varieties", payload: { name: "Basil", crop_category: "SPECIALTY_HERB", days_to_harvest: 21, expected_yield_grams_per_tray: 5000, listed_price_cents_per_kg: 100, min_order_grams: 100 }, as: Grower, captures: { var_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials", payload: { variety_id: "${var_id}", sow_date: "2026-08-03", chef_panel_size: 1, yield_score: 8.0 }, as: Grower, captures: { trial_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials/${trial_id}/record-panel", payload: { scores: [8.0] }, as: Grower }
            - { call: "POST /grow/variety-trials/${trial_id}/decide", payload: { outcome: "ADOPT" }, as: Grower }
            - { call: "POST /grow/customers", payload: { business_name: "Bakery", contact_email: "b@b.com", delivery_zone: "SOUTH" }, as: OpsManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /grow/standing-orders", payload: { customer_id: "${cust_id}", effective_week_start: "2026-08-03", change_cutoff_day: 2 }, as: Chef, as_user_id: "${cust_id}", captures: { so_id: "$.data.id", so_v: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/lines", payload: { variety_id: "${var_id}", qty_kg: 1.005, expected_standing_order_version: "${so_v}" }, as: Chef, as_user_id: "${cust_id}" }
            - { call: "GET /grow/standing-orders/${so_id}", payload: {}, as: Chef, as_user_id: "${cust_id}", captures: { so_v1: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/lines", payload: { variety_id: "${var_id}", qty_kg: 1.005, expected_standing_order_version: "${so_v1}" }, as: Chef, as_user_id: "${cust_id}" }
          trigger:
            - { call: "GET /grow/standing-orders/${so_id}", payload: {}, as: Chef, as_user_id: "${cust_id}", captures: { subtotal: "$.data.weekly_subtotal_cents" } }
          assert:
            - "each OrderItem.line_extension_cents == 101"
            - "StandingOrder.weekly_subtotal_cents == 202"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (>=2, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: variety_trial_evaluation_retrial_cycle
        grounds:
          - state_machines.Variety.EVALUATION_to_TRIAL
          - entities.VarietyTrial.fields.decision
        distinguishing_aspect: |
          Cyclic shape on Variety: EVALUATION -> TRIAL on a RETRIAL decision
          (revision loop), letting the variety be re-trialed. Non-linear cycle
          on the Variety entity.
        test_recipe:
          setup:
            - "Variety created (TRIAL); trial opened and panel recorded (EVALUATION)"
          setup_api_calls:
            - { call: "POST /grow/varieties", payload: { name: "Shiso", crop_category: "SPECIALTY_HERB", days_to_harvest: 25, expected_yield_grams_per_tray: 3000, listed_price_cents_per_kg: 4000, min_order_grams: 100 }, as: Grower, captures: { var_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials", payload: { variety_id: "${var_id}", sow_date: "2026-08-03", chef_panel_size: 1, yield_score: 4.0 }, as: Grower, captures: { trial_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials/${trial_id}/record-panel", payload: { scores: [5.0] }, as: Grower }
          trigger:
            - { call: "POST /grow/variety-trials/${trial_id}/decide", payload: { outcome: "RETRIAL" }, as: Grower }
          assert:
            - "Variety.stage == TRIAL"
            - "VarietyTrial.decision == REJECTED"

      - name: standing_order_confirm_lock_rollover_cycle
        grounds:
          - state_machines.StandingOrder.CONFIRMED_to_LOCKED
          - state_machines.StandingOrder.LOCKED_to_CONFIRMED
        distinguishing_aspect: |
          Cyclic shape on StandingOrder: CONFIRMED -> LOCKED at weekly cutoff,
          then LOCKED -> CONFIRMED on weekly rollover — a recurring cycle on a
          different entity (StandingOrder) than the sibling (Variety).
        test_recipe:
          setup:
            - "LISTED variety; customer; CONFIRMED standing order with one line; cutoff day 2"
          setup_api_calls:
            - { call: "POST /grow/varieties", payload: { name: "Arugula", crop_category: "PETITE_GREEN", days_to_harvest: 12, expected_yield_grams_per_tray: 12000, listed_price_cents_per_kg: 900, min_order_grams: 250 }, as: Grower, captures: { var_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials", payload: { variety_id: "${var_id}", sow_date: "2026-08-03", chef_panel_size: 1, yield_score: 7.0 }, as: Grower, captures: { trial_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials/${trial_id}/record-panel", payload: { scores: [7.0] }, as: Grower }
            - { call: "POST /grow/variety-trials/${trial_id}/decide", payload: { outcome: "ADOPT" }, as: Grower }
            - { call: "POST /grow/customers", payload: { business_name: "Trattoria", contact_email: "t@t.com", delivery_zone: "NORTH" }, as: OpsManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /grow/standing-orders", payload: { customer_id: "${cust_id}", effective_week_start: "2026-08-03", change_cutoff_day: 2 }, as: Chef, as_user_id: "${cust_id}", captures: { so_id: "$.data.id", so_v: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/lines", payload: { variety_id: "${var_id}", qty_kg: 1.0, expected_standing_order_version: "${so_v}" }, as: Chef, as_user_id: "${cust_id}" }
            - { call: "GET /grow/standing-orders/${so_id}", payload: {}, as: Chef, as_user_id: "${cust_id}", captures: { so_v2: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/confirm", payload: { expected_standing_order_version: "${so_v2}" }, as: Chef, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /grow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: OpsManager, captures: { so_after: "$.data" } }
            - { call: "GET /grow/standing-orders/${so_id}", payload: {}, as: Chef, as_user_id: "${cust_id}" }
          assert:
            - "StandingOrder.status == LOCKED after clock passes cutoff weekday"

  # ===========================================================================
  # Rule 4 — transitive_cascade (>=2, one depth>=3, one depth>=2, different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: seed_lot_block_cascade_batch_plan_order_stop
        grounds:
          - state_machines.SeedLot.QUARANTINE_to_BLOCKED
          - calculations.tray_batch_failure_cascade
          - calculations.harvest_allocation
        distinguishing_aspect: |
          Depth-3+ cascade from SeedLot record-result FAIL: SeedLot -> BLOCKED
          causes TrayBatch -> FAILED, which causes CropPlan shortfall recompute,
          which marks PLANNED OrderItems SHORTED, which reduces the linked
          DeliveryStop subtotal and can flip it to SKIPPED on next dispatch.
        test_recipe:
          setup:
            - "APPROVED FSP; LISTED variety; seed lot QUARANTINE with sown batch GROWING"
            - "CONFIRMED order with PLANNED line for the variety; stop SCHEDULED on a route"
          setup_api_calls:
            - { call: "POST /grow/food-safety-plans", payload: { plan_code: "FSP-C", water_test_current: true, sanitation_sop_version: "SOP-1" }, as: OpsManager, captures: { fsp_id: "$.data.id" } }
            - { call: "POST /grow/food-safety-plans/${fsp_id}/approve", payload: {}, as: OpsManager }
            - { call: "POST /grow/varieties", payload: { name: "Radish", crop_category: "MICROGREEN", days_to_harvest: 7, expected_yield_grams_per_tray: 15000, listed_price_cents_per_kg: 700, min_order_grams: 250 }, as: Grower, captures: { var_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials", payload: { variety_id: "${var_id}", sow_date: "2026-08-03", chef_panel_size: 1, yield_score: 7.0 }, as: Grower, captures: { trial_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials/${trial_id}/record-panel", payload: { scores: [7.0] }, as: Grower }
            - { call: "POST /grow/variety-trials/${trial_id}/decide", payload: { outcome: "ADOPT" }, as: Grower }
            - { call: "POST /grow/seed-lots", payload: { variety_id: "${var_id}", supplier_name: "SeedCo", lot_code: "L3", received_date: "2026-08-01", seeds_on_hand_grams: 500 }, as: Grower, captures: { lot_id: "$.data.id" } }
            - { call: "POST /grow/germination-tests", payload: { seed_lot_id: "${lot_id}", seeds_sown_count: 100 }, as: Grower, captures: { gt_id: "$.data.id" } }
            - { call: "POST /grow/germination-tests/${gt_id}/record-result", payload: { germinated_count: 90 }, as: Grower }
            - { call: "POST /grow/crop-plans", payload: { variety_id: "${var_id}", planned_sow_date: "2026-08-03", planned_tray_count: 4, seed_grams_required: 20 }, as: Grower, captures: { plan_id: "$.data.id", plan_v: "$.data.version" } }
            - { call: "POST /grow/crop-plans/${plan_id}/sow", payload: { seed_lot_id: "${lot_id}", expected_crop_plan_version: "${plan_v}" }, as: Grower }
            - { call: "GET /grow/tray-batches", payload: { crop_plan_id: "${plan_id}" }, as: Grower, captures: { batch_id: "$.data[0].id" } }
            - { call: "POST /grow/tray-batches/${batch_id}/advance", payload: {}, as: Grower }
            - { call: "POST /grow/tray-batches/${batch_id}/advance", payload: {}, as: Grower }
            - { call: "POST /grow/customers", payload: { business_name: "Catering", contact_email: "c@c.com", delivery_zone: "NORTH" }, as: OpsManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /grow/standing-orders", payload: { customer_id: "${cust_id}", effective_week_start: "2026-08-03", change_cutoff_day: 2 }, as: Chef, as_user_id: "${cust_id}", captures: { so_id: "$.data.id", so_v: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/lines", payload: { variety_id: "${var_id}", qty_kg: 2.0, expected_standing_order_version: "${so_v}" }, as: Chef, as_user_id: "${cust_id}", captures: { item_id: "$.data.id" } }
            - { call: "GET /grow/standing-orders/${so_id}", payload: {}, as: Chef, as_user_id: "${cust_id}", captures: { so_v2: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/confirm", payload: { expected_standing_order_version: "${so_v2}" }, as: Chef, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /grow/germination-tests", payload: { seed_lot_id: "${lot_id}", seeds_sown_count: 96 }, as: Grower, captures: { gt2_id: "$.data.id" } }
            - { call: "POST /grow/germination-tests/${gt2_id}/record-result", payload: { germinated_count: 70 }, as: Grower }
          assert:
            - "SeedLot(${lot_id}).status == BLOCKED (recall: RELEASED -> BLOCKED on re-test FAIL)"
            - "TrayBatch(${batch_id}).status == FAILED (cascade hop 1)"
            - "OrderItem(${item_id}).fulfillment == SHORTED (cascade hop 2: crop shortfall marks PLANNED line)"

      - name: standing_order_cancel_cascade_items_and_stops
        grounds:
          - state_machines.StandingOrder.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (order cancel, not lot block):
          StandingOrder CONFIRMED -> CANCELLED causes its PLANNED OrderItems ->
          SHORTED, which causes any linked DeliveryStop -> SKIPPED. Different
          originating transition than the seed-lot cascade.
        test_recipe:
          setup:
            - "LISTED variety; customer; CONFIRMED order with one PLANNED line"
            - "Route with a SCHEDULED stop referencing the order"
          setup_api_calls:
            - { call: "POST /grow/varieties", payload: { name: "Kale", crop_category: "PETITE_GREEN", days_to_harvest: 14, expected_yield_grams_per_tray: 10000, listed_price_cents_per_kg: 600, min_order_grams: 250 }, as: Grower, captures: { var_id: "$.data.id" } }
