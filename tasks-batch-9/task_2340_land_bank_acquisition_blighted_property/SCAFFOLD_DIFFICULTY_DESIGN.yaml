  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: funds_conserved_across_order_cancellation
        grounds:
          - calculations.funding_ledger_position
          - state_machines.MaintenanceOrder.status.SCHEDULED_to_CANCELLED
          - entities.FundingSource.fields.available_cents
          - endpoints["POST /land-bank/maintenance-orders/{id}/cancel"]
        distinguishing_aspect: |
          The conserved quantity is money in cents: the ledger identity
          authorized_cents == available_cents + committed_cents + disbursed_cents must hold both
          while the 19703-cent MOW estimate is committed and after the cancellation compensates it,
          and the cancellation must return the full estimate to available_cents with no residue in
          disbursed_cents - the source ends numerically indistinguishable from its pre-order state.
        test_recipe:
          setup:
            - "One ACTIVE funding source, restriction ANY, authorized 1000000 cents, reserve_floor_cents 50000."
            - "One 10000 sqft parcel acquired by donation with a zero title fee, so disbursed_cents starts at 0."
            - "One MOW order for 19703 cents in the window 2026-09-01 to 2026-09-03."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Maintenance Line", source_type: "GENERAL_FUND", authorized_cents: 1000000, restriction: "ANY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_id: $.data.id, reserve: $.data.reserve_floor_cents }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-100190", address: "190 Quarry Rd", situs_ward: 5, lot_area_sqft: 10000, assessed_value_cents: 200000, structure_present: false, structure_condition_grade: "C", vacancy_months: 5 }
