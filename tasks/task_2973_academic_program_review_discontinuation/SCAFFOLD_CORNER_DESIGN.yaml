            - call: "GET /provost/academic-programs/${prog_id}"
              payload: {}
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { prog_v3: $.data.version }
            - call: "POST /provost/academic-programs/${prog_id}/teach-out-plans"
              payload: { decision_id: "${dec_id}", last_admit_term_index: 3, first_teach_out_term_index: 4, final_award_term_index: 7, expected_program_version: "${prog_v3}" }
