          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
          trigger:
            - call: "POST /paywall/offer-plans"
              payload: { name: "Bad Ladder", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 4, cycle_days: 30, step_up_schedule: [{ from_cycle: 2, price_cents: 999 }, { from_cycle: 5, price_cents: 1299 }] }
              as: RevenueManager
              captures: { err_ld: "$.data.error_id" }
          assert:
            - "the response status is 422 and error_id == ERR_STEP_UP_SCHEDULE_INVALID"
            - "OfferPlan rows == 0"

      - name: vacation_hold_on_digital_only_plan_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=46]
          - errors[ERR_PLAN_NOT_PRINT_BUNDLE]
        distinguishing_aspect: "Vacation holds are a print-fulfilment concept: on a DIGITAL_ONLY subscription the request must fail 422 with ERR_PLAN_NOT_PRINT_BUNDLE, whereas a PAUSE_BILLING hold on the very same subscription is accepted."
