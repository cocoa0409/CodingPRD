      - name: segregation_of_duties_refuses_the_self_verifier_on_both_endpoints
        claim_type: violation_to_error
        grounds:
          - validations.priority_26_ERR_SOD_REMEDIATION_SELF_VERIFICATION
          - errors.ERR_SOD_REMEDIATION_SELF_VERIFICATION
          - segregation_of_duties_rules
          - entities.RemediationProgram.fields.completed_by_user_id
          - entities.RegulatoryReport.fields.prepared_by_user_id
        distinguishing_aspect: |
          One error code guards two unrelated endpoints, and in both cases the identity compared is
          NOT the caller's role but a user id stored on a different row: the remediation completion is
          measured against the triggering MechanicalIntegrityTest.recorded_by_user_id (not against the
          program's own creator, which is the system) and the report submission against
          RegulatoryReport.prepared_by_user_id. Both refusals are 403 and both leave the target row
          untouched, so the same call from a second holder of the identical role then succeeds.
        test_recipe:
          setup:
            - "Field F_MINI with two wells MINI-1 and MINI-2; MINI-1's PRESSURE_TEST over 2026-08-02T00:00:00Z-06:00:00Z is recorded FAIL by eng-a at clock 2026-08-02T07:00:00Z, opening RemediationProgram P1."
            - "An INVENTORY_VERIFICATION report on F_MINI for 2026-08-01..2026-08-31 is prepared by officer-a with measured_inventory_dth 250000."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-2", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w2: $.data.id }
            - call: "POST /mechanical-integrity-tests"
              payload: { well_id: "${w1}", test_type: "PRESSURE_TEST", scheduled_start_at: "2026-08-02T00:00:00Z", scheduled_end_at: "2026-08-02T06:00:00Z" }
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { m1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T07:00:00Z" }
              as: FieldOperator
            - call: "POST /mechanical-integrity-tests/${m1}/record-result"
              payload: { outcome: "FAIL", result_pressure_psig: 400 }
              as: IntegrityEngineer
              as_user_id: "eng-a"
            - call: "GET /remediation-programs"
              payload: { well_id: "${w1}", status: "OPEN", limit: 100 }
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { p1: "$.data[0].id" }
            - call: "POST /regulatory-reports"
              payload: { storage_field_id: "${f1}", report_type: "INVENTORY_VERIFICATION", period_start_date: "2026-08-01", period_end_date: "2026-08-31", measured_inventory_dth: 250000 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /remediation-programs/${p1}/complete"
              payload: { verification_notes: "Casing repaired and re-tested by the same engineer" }
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { e1: $.data.error_id }
            - call: "POST /regulatory-reports/${r1}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { e2: $.data.error_id }
            - call: "POST /remediation-programs/${p1}/complete"
              payload: { verification_notes: "Casing repair verified independently" }
              as: IntegrityEngineer
              as_user_id: "eng-b"
            - call: "POST /regulatory-reports/${r1}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-b"
            - call: "GET /wells/${w1}"
              payload: {}
              as: IntegrityEngineer
              as_user_id: "eng-b"
          assert:
            - "${e1} == ERR_SOD_REMEDIATION_SELF_VERIFICATION with HTTP 403 and RemediationProgram.${p1}.status still OPEN with completed_by_user_id null"
            - "${e2} == ERR_SOD_REMEDIATION_SELF_VERIFICATION with HTTP 403 and RegulatoryReport.${r1}.status still PREPARED with submitted_by_user_id null"
            - "the eng-b completion returns HTTP 200: RemediationProgram.${p1}.status == COMPLETED, completed_by_user_id == eng-b, completed_at == 2026-08-02T07:00:00Z"
            - "the officer-b submission returns HTTP 200: RegulatoryReport.${r1}.status == SUBMITTED, submitted_by_user_id == officer-b, prepared_by_user_id == officer-a"
            - "Well.${w1}.integrity_state == REMEDIATED with operational_state still SHUT_IN and shut_in_reason null"
            - "the report's open_finding_count is 0 at submission because the only OPEN program was closed first"

      - name: remediation_completion_blocked_while_an_emergency_is_being_worked
        claim_type: violation_to_error
        grounds:
          - validations.priority_32_ERR_REMEDIATION_ESCALATED
          - errors.ERR_REMEDIATION_ESCALATED
          - state_machines.EmergencyEvent.transitions.DETECTED_to_RESPONDING
          - state_machines.EmergencyEvent.transitions.RESPONDING_to_CONTAINED
        distinguishing_aspect: |
          The block is keyed on the EmergencyEvent's status, not on the program's: while the event is
          merely RESPONDING the program stays OPEN and its completion is refused with
          ERR_REMEDIATION_ESCALATED (409) — a DETECTED event does not block it and a CONTAINED event
          stops blocking it, so the same call by the same engineer succeeds before the advance and
          after the containment without the program ever changing state.
        test_recipe:
          setup:
            - "Field F_MINI with two wells; MINI-1 fails a PRESSURE_TEST recorded by eng-a at clock 2026-08-02T07:00:00Z, opening RemediationProgram P1 in status OPEN."
            - "A LEAK EmergencyEvent E1 of severity MINOR is detected on F_MINI at 2026-08-02T07:00:00Z."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-2", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w2: $.data.id }
            - call: "POST /mechanical-integrity-tests"
              payload: { well_id: "${w1}", test_type: "PRESSURE_TEST", scheduled_start_at: "2026-08-02T00:00:00Z", scheduled_end_at: "2026-08-02T06:00:00Z" }
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { m1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T07:00:00Z" }
              as: FieldOperator
            - call: "POST /mechanical-integrity-tests/${m1}/record-result"
              payload: { outcome: "FAIL", result_pressure_psig: 400 }
              as: IntegrityEngineer
              as_user_id: "eng-a"
            - call: "GET /remediation-programs"
              payload: { well_id: "${w1}", status: "OPEN", limit: 100 }
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { p1: "$.data[0].id" }
            - call: "POST /emergency-events"
              payload: { storage_field_id: "${f1}", event_type: "LEAK", severity: "MINOR", detected_at: "2026-08-02T07:00:00Z" }
              as: FieldOperator
              captures: { ev1: $.data.id }
          trigger:
            - call: "POST /emergency-events/${ev1}/advance"
              payload: { to_status: "RESPONDING", responder_notes: "Crew dispatched to the wellhead" }
              as: FieldOperator
            - call: "POST /remediation-programs/${p1}/complete"
              payload: { verification_notes: "Casing repair verified" }
              as: IntegrityEngineer
              as_user_id: "eng-b"
              captures: { e1: $.data.error_id }
            - call: "POST /emergency-events/${ev1}/advance"
              payload: { to_status: "CONTAINED", responder_notes: "Leak isolated and vented" }
              as: FieldOperator
            - call: "POST /remediation-programs/${p1}/complete"
              payload: { verification_notes: "Casing repair verified" }
              as: IntegrityEngineer
              as_user_id: "eng-b"
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: FieldOperator
          assert:
            - "${e1} == ERR_REMEDIATION_ESCALATED with HTTP 409 while EmergencyEvent.${ev1}.status == RESPONDING"
            - "RemediationProgram.${p1}.status is still OPEN after the refusal — it was NOT escalated, because only an EVACUATION_ORDERED advance escalates programs"
            - "StorageField.${f1}.field_posture == FROZEN while the event is RESPONDING"
            - "after the CONTAINED advance the same completion returns HTTP 200 with RemediationProgram.${p1}.status == COMPLETED and completed_by_user_id == eng-b"
            - "StorageField.${f1}.field_posture == OPEN once the event is CONTAINED and the program is closed: wells_in_service_count == 1 (MINI-2) and MINI-1 is no longer MIT_FAILED, so no ladder clause matches"
            - "Well.${w1}.integrity_state == REMEDIATED and StorageField.${f1}.working_gas_inventory_dth == 250000 throughout"

      - name: cash_out_requires_unsettled_days_and_refuses_an_overlapping_period
        claim_type: violation_to_error
        grounds:
          - validations.priority_36_ERR_CASH_OUT_PERIOD_SETTLED
          - validations.priority_37_ERR_NOTHING_TO_CASH_OUT
          - errors.ERR_CASH_OUT_PERIOD_SETTLED
          - errors.ERR_NOTHING_TO_CASH_OUT
          - calculations.imbalance_cash_out.variants.MONTHLY_AGGREGATE
          - entities.StorageContract.fields.cash_out_through_date
        distinguishing_aspect: |
          Two adjacent gates fail for opposite reasons and their order is visible: a September period
          is refused as ERR_NOTHING_TO_CASH_OUT even AFTER August is settled (the settled-date gate at
          priority 36 passes, since 2026-09-01 is strictly after 2026-08-31, and only priority 37
          bites), while a period starting 2026-08-15 is refused as ERR_CASH_OUT_PERIOD_SETTLED because
          the start date must be strictly after the through date. A cash-out-reversal attempted before
          any cash-out exists is refused under the same 422 code as the empty period.
        test_recipe:
          setup:
            - "Field F_MINI with one well MINI-1; shipper NORTHLINE (penalty_threshold_usd 500000.00) with ACTIVE FIRM contract CN-1 on MONTHLY_AGGREGATE at index_price 3.4500."
            - "Gas day 2026-08-20: nomination confirmed at 80000, ticket metered 76000 and confirmed, leaving imbalance_dth -4000.000 and one DAILY_IMBALANCE ledger row."
          setup_api_calls:
