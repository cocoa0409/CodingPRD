  - name: car_assignment_return_on_completed_placement_covered_by_1_8
    claim_type: Invalid Transitions
    grounds:
    - state_machines.CarAssignment.ACTIVE_to_COMPLETED
    - validations[priority=5]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / state_vs_business_fiscal_return_conflict
      rationale: The second POST /car-returns against a COMPLETED placement — where ACTIVE_to_COMPLETED's
        from-state no longer holds — is asserted by that §1.8 instance, which pins the priority-5 ERR_INVALID_STATE
        outcome over the priority-18 fiscal rule.
  - name: car_assignment_suspend_while_contract_not_active_covered_by_1_8
    claim_type: Precondition Enforcement
    grounds:
    - state_machines.CarAssignment.ACTIVE_to_SUSPENDED
    - entities.LeaseContract.fields.status
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / suspend_assignment_gated_on_contract_status
      rationale: The 'governing LeaseContract.status == ACTIVE' precondition on suspend is asserted by
        that §1.8 instance, which drives the contract to AMENDMENT_DRAFTED and pins the 409 ERR_INVALID_STATE
        rejection before the identical call succeeds.
  - name: lease_fleet_car_sold_held_void_cycle_covered_by_1_8
    claim_type: Valid Transition
    grounds:
    - state_machines.LeaseFleetCar.SOLD_to_HELD
    - state_machines.LeaseFleetSale.PENDING_SETTLEMENT_to_VOIDED
    excluded_because:
      difficulty_instance: non_linear_state_machine / lease_fleet_car_sold_held_void_cycle
      rationale: The compensating re-entry SOLD -> HELD through POST /lease-fleet-sales/{id}/void — the
        one legal out-transition from a declared terminal state — is asserted by that §1.8 instance, which
        also pins priority 6's deliberate omission of the void endpoint.
  - name: lease_fleet_car_settle_returns_valid_transition_covered_by_1_8
    claim_type: Valid Transition
    grounds:
    - state_machines.LeaseFleetCar.UNDER_REPAIR_to_HELD
    - validations[priority=23]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / settle_returns_gated_on_car_return_settlement
      rationale: The UNDER_REPAIR -> HELD success path through POST /lease-fleet-cars/{id}/settle-returns,
        including the requirement that every CarReturn already be SETTLED, is asserted as that §1.8 instance's
        gated failure and subsequent 200.
  - name: car_assignment_placement_buffer_covered_by_1_8
    claim_type: Invalid Transitions
    grounds:
    - state_machines.LeaseFleetCar.HELD_to_ASSIGNED
    - validations[priority=11]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / placement_interval_one_day_buffer_boundary
      rationale: The rejection of a placement that violates the mandatory one-day gap buffer on the same
        car is asserted by that §1.8 instance, which pins [2026-10-17, 2026-11-16) to 409 ERR_ASSIGNMENT_OVERLAP
        while [2026-10-18, 2026-11-17) is accepted.
  - name: retrofit_work_order_shop_window_overlap_covered_by_1_8
    claim_type: Invalid Transitions
    grounds:
    - state_machines.RetrofitWorkOrder.SCHEDULED_to_IN_PROGRESS
    - validations[priority=10]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / shop_line_half_open_touching_windows_allowed
      rationale: The half-open shop-line collision rule — touching windows accepted, overlapping windows
        rejected with 409 ERR_SHOP_SLOT_OVERLAP — is asserted by that §1.8 instance on SHOP-R8A, so the
        work-order scheduling rejection is already realised.
  - name: portfolio_ledger_settle_side_effect_covered_by_1_8
    claim_type: Side Effect Execution
    grounds:
    - state_machines.PortfolioLedger.OPEN_to_OPEN
    - entities.LeaseFleetSale.fields.gain_loss_cents
    excluded_because:
      difficulty_instance: transitive_cascade / sale_settlement_realized_gain_cascade
      rationale: The ledger hop that fires when a PENDING_SETTLEMENT sale settles — realized_gain_cents
        moving by exactly the sale's gain_loss_cents — is asserted as that §1.8 instance's depth-2 cascade.
  - name: production_order_reserve_cancel_stock_conservation_covered_by_1_8
    claim_type: Side Effect Execution
    grounds:
    - state_machines.ProductionOrder.COMPONENT_RESERVED_to_CANCELLED
    - calculations.component_allocation
    excluded_because:
      difficulty_instance: compensating_invariant / reserve_cancel_conserves_component_on_hand
      rationale: The reserve-then-cancel side effects (on_hand_qty restored to its exact pre-reservation
        count, reserved_qty legitimately left unchanged) are asserted end-to-end by that §1.8 instance.
  - name: substitution_endorsement_patch_after_superseded_invalid_state
    claim_type: Terminal State Lockdown
    grounds:
    - state_machines.SubstitutionEndorsement.REJECTED_to_PENDING
    - entities.SubstitutionEndorsement.fields.status
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: SUPERSEDED is terminal (the REJECTED -> PENDING retry cycle does not reach
      it), so PATCHing a superseded endorsement returns 409 ERR_INVALID_STATE with the row still SUPERSEDED
      and the newer endorsement still PENDING.
    test_recipe:
      setup:
      - Empty DB; two endorsements raised against the same order for the same original component, so the
        first was auto-superseded by the second.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/car-types
        payload:
          model_code: BOX-100
          car_class: BOXCAR
          build_hours: 10
          regulatory_life_years: 25
          line_count_family: LINE-A
        as: ProductionPlanner
        captures:
          ct_box_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: WS-500
          component_class: WHEELSET
          unit_cost_cents: 200000
          lead_time_days: 10
        as: SupplyChainCoordinator
        captures:
          ws500_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: CS-600
          component_class: CASTING
          unit_cost_cents: 150000
          lead_time_days: 20
        as: SupplyChainCoordinator
        captures:
          cs600_id: $.data.id
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_box_id}
          quantity: 1
          planned_shop_days: 10
          disposition: SOLD
          priority_rank: 1
          order_date: '2026-09-01'
          required_delivery_date: '2026-11-30'
        as: ProductionPlanner
        captures:
          po_id: $.data.id
          po_v: $.data.version
      - call: POST /api/v1/substitution-endorsements
        payload:
          production_order_id: ${po_id}
          original_component_id: ${ws500_id}
          substitute_component_id: ${cs600_id}
          substitute_qty_per_car: 2
          decides_material: false
          expected_production_order_version: ${po_v}
        as: ProductionPlanner
        as_user_id: user-planner-7
        captures:
          se_first_id: $.data.id
      - call: GET /api/v1/production-orders/${po_id}
        payload: {}
        as: PlatformAdmin
        captures:
          po_v2: $.data.version
      - call: POST /api/v1/substitution-endorsements
        payload:
          production_order_id: ${po_id}
          original_component_id: ${ws500_id}
          substitute_component_id: ${cs600_id}
          substitute_qty_per_car: 3
          decides_material: false
          expected_production_order_version: ${po_v2}
        as: ProductionPlanner
        as_user_id: user-planner-7
        captures:
          se_second_id: $.data.id
      trigger:
      - call: PATCH /api/v1/substitution-endorsements/${se_first_id}
        payload:
          status: REJECTED
        as: LeaseAdministrator
        as_user_id: user-lease-3
        captures:
          err_id: $.data.error_id
      - call: GET /api/v1/substitution-endorsements/${se_first_id}
        payload: {}
        as: PlatformAdmin
      - call: GET /api/v1/substitution-endorsements/${se_second_id}
        payload: {}
        as: PlatformAdmin
      assert:
      - SubstitutionEndorsement.${se_first_id}.status == "SUPERSEDED" after the second endorsement is
        raised
      - PATCH /substitution-endorsements/${se_first_id} on the SUPERSEDED row returns HTTP 409
      - error_id == "ERR_INVALID_STATE"
      - SubstitutionEndorsement.${se_first_id}.status == "SUPERSEDED" (unchanged)
      - SubstitutionEndorsement.${se_second_id}.status == "PENDING" (the live endorsement is untouched)
- section: calculations
  instances:
  - name: order_price_quote_correct_result_three_line_committed_quote
    claim_type: Correct Result
    grounds:
    - calculations.order_price_quote
    - entities.ProductionOrder.fields.unit_price_cents
    - validations[priority=14]
    distinguishing_aspect: A three-row bill of materials (wheelset, casting, coating) quotes exactly 1614500
      cents on the SOLD order BOX-200 x5 at day 0 past order_date, proving the per-line ceiling plus the
      45000-cent labor rate are summed before any fee term is added.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z, the same day as the order_date, so the
        forecast variant's 120-day lapse window is empty and forecast == committed.
      - 'Car type BOX-200 (BOXCAR, build_hours 30, regulatory_life_years 25, line_count_family LINE-B)
        carries three bill-of-material rows: WS-210 WHEELSET qty_per_car 4 unit_cost 18000, CS-210 CASTING
        qty_per_car 2 unit_cost 40000, CT-210 COATING qty_per_car 3 unit_cost 12500.'
      - Wheelset stock 40 and casting stock 20 cover the order's 20-unit and 10-unit requirements exactly,
        so the reservation at priority 13 passes.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/car-types
        payload:
          model_code: BOX-200
          car_class: BOXCAR
          build_hours: 30
          regulatory_life_years: 25
          line_count_family: LINE-B
        as: ProductionPlanner
        captures:
          ct_box_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: WS-210
          component_class: WHEELSET
          unit_cost_cents: 18000
          lead_time_days: 30
          on_hand_qty: 40
        as: SupplyChainCoordinator
        captures:
          ws210_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: CS-210
          component_class: CASTING
          unit_cost_cents: 40000
          lead_time_days: 45
          on_hand_qty: 20
        as: SupplyChainCoordinator
        captures:
          cs210_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: CT-210
          component_class: COATING
          unit_cost_cents: 12500
          lead_time_days: 20
          on_hand_qty: 100
        as: SupplyChainCoordinator
        captures:
          ct210_id: $.data.id
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_box_id}
          component_id: ${ws210_id}
          qty_per_car: 4
        as: ProductionPlanner
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_box_id}
          component_id: ${cs210_id}
          qty_per_car: 2
        as: ProductionPlanner
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_box_id}
          component_id: ${ct210_id}
          qty_per_car: 3
        as: ProductionPlanner
      trigger:
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_box_id}
          quantity: 5
          planned_shop_days: 150
          disposition: SOLD
          priority_rank: 1
          order_date: '2026-09-01'
          required_delivery_date: '2026-12-01'
        as: ProductionPlanner
        captures:
          po_id: $.data.id
          price_draft: $.data.unit_price_cents
          po_status: $.data.status
      - call: POST /api/v1/production-orders/${po_id}/reserve-components
        payload: {}
        as: ProductionPlanner
        captures:
          price_committed: $.data.unit_price_cents
          po_status_reserved: $.data.status
      assert:
      - ProductionOrder.${po_id}.status == ${po_status} == "DRAFT" after creation and ${po_status_reserved}
        == "COMPONENT_RESERVED" after the reservation
      - 'Line values before summing: WS-210 ceil((4 * 18000 + 25000) / 100) * 100 == 97000; CS-210 ceil((2
        * 40000 + 25000) / 100) * 100 == 105000; CT-210 ceil((3 * 12500 + 25000) / 100) * 100 == 62500'
      - COMPONENT_SUBTOTAL == 97000 + 105000 + 62500 == 264500 and LABOR_CENTS == 30 * 45000 == 1350000,
        so UNROUNDED == 1614500
      - CHANGE_FEE == 0 because RAW_FEE == 15000 * 0 endorsements in {APPROVED, APPLIED} == 0, so ProductionOrder.${po_id}.unit_price_cents
        == ${price_draft} == 1614500
      - 'The committed re-quote is the same literal: ${price_committed} == 1614500, since day 0 past order_date
        leaves the forecast variant''s lapse uplift empty'
      - 'The lead-time gate passed rather than short-circuiting the quote: horizon 2026-09-01 to 2026-12-01
        == 91 days >= worst_lead max(ceil(30/4), ceil(45/2)) == 23'
  - name: lease_fleet_capital_allocation_correct_result_retained_completion
    claim_type: Correct Result
    grounds:
    - calculations.lease_fleet_capital_allocation
    - entities.LeaseContract.fields.capital_allocation_cents
    - state_machines.ProductionOrder.IN_PRODUCTION_to_COMPLETED
    distinguishing_aspect: Completing a RETAINED order of 2 cars at unit_price_cents 1614500 sets LeaseContract.capital_allocation_cents
      to exactly 3229000 (2 live cars x the committed quote) and the derived lessor equity to exactly
      226030.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - Car type BOX-200 (BOXCAR, build_hours 30, regulatory_life_years 25, line_count_family LINE-B)
        with WS-210 WHEELSET qty 4 cost 18000 on_hand 40, CS-210 CASTING qty 2 cost 40000 on_hand 20,
        CT-210 COATING qty 3 cost 12500 on_hand 100.
      - An ACTIVE FULL_SERVICE contract (per_diem_rate_cents 5000, liability_bearer LESSOR, term 2026-09-01..2027-09-01,
        fleet_car_cap 10) names the lessee; a CONFIRMED coating purchase order with expected_receipt_date
        2026-09-21 satisfies the release precondition for the COATING row.
      - RETAINED order of 2 cars, planned_shop_days 60 == build_hours 30 * quantity 2, reserved and released
        against that contract, changed over on LINE-B for [2026-09-05, 2026-11-04) (width 60) and completed
        on 2026-11-04 with completed_qty 2.
