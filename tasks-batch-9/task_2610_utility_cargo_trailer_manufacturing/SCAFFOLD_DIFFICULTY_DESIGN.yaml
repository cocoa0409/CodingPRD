              as_user_id: "ws-1"
              captures: { unit2_id: $.data.id }
            - call: "POST /weld-jigs/${jig_id}/jig-reservations"
              payload: { unit_id: "${unit1_id}", window_start_at: "2026-08-03T09:00:00Z", window_end_at: "2026-08-03T11:00:00Z", expected_weld_jig_version: "${jig_v0}" }
              as: WeldSupervisor
              as_user_id: "ws-1"
              captures: { res1_id: $.data.id }
            - call: "GET /weld-jigs/${jig_id}"
              payload: {}
