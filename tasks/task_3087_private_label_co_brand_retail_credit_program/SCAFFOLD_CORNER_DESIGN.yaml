            - "GET /servicing/credit-programs/${g_id}/summary program_profitability_cents equals the full_recompute value"
            - "the second batch contributes exactly 0 because its window contains no new promotion, so profitability is unchanged at 21196"

  # ===========================================================================
  - section: validations
    instances:

      - name: promo_term_shadowing_vs_min_charge_pair
        claim_type: Priority Ordering
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors.ERR_INVALID_PROMO_TERM
        excluded_because:
          difficulty_instance: promo_term_vs_minimum_charge_safety_precedence
          rationale: "The priority-7 over priority-8 conflict is already asserted as this §1.8 instance's failure path."

      - name: delinquency_two_percent_floor_rule_passes_when_met
        claim_type: Satisfaction -> Pass
        grounds:
          - calculations.account_minimum_payment
          - validations[priority=9]
        distinguishing_aspect: "A purchase that keeps the account within its limit succeeds — the credit-limit validation does not fire when outstanding plus the new amount is exactly the limit."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One account with limit 200000 and 190000 principal."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - *c_agreement
            - *c_neg
            - *c_exec
            - *c_program
            - *c_app
            - *c_decide
            - *c_acct
