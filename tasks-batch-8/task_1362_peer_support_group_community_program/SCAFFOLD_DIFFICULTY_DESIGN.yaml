              captures: { fv: $.data.version }
          trigger:
            - call: "POST /programs/${pid}/groups/${gid}/sessions/${sid}/schedule"
              payload: { expected_facilitator_version: "${fv}" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Facilitator.${fid}.level == 2 (1 base + 1 training_point + 0 supervision_bonus)"
            - "PeerGroup.${gid}.required_facilitator_level == 3"
            - "Cross-entity dependency: Session scheduling depends on Facilitator state"
            - "err == ERR_FACILITATOR_LEVEL_TOO_LOW"

  # ==========================================================================
  # Rule 8: Resource temporal-overlap conflicts across different interval semantics
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: room_overlap_half_open_allows_adjacent_sessions
        grounds:
          - calculations.room_overlap_rule
        distinguishing_aspect: |
          Resource: Room. Interval semantics: half-open [start_at, end_at).
          Adjacent sessions (existing.end_at == new.start_at) do NOT conflict
          (boundary is exclusive on end). A new session at 11:00-12:00 against
          existing 10:00-11:00 on the same room is allowed.
        test_recipe:
          setup:
            - "Room R physical_capacity=10, AVAILABLE"
