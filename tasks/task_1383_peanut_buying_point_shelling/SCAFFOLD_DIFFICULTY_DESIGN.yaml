              as_user_id: "${g1}"
              captures: { la2: $.data.id }
            - { call: "POST /buying-points/loads/${la2}/weigh", payload: { gross_tons: 25.0 }, as: BuyingPointAdmin }
            - call: "POST /buying-points/loads"
              payload: { grower_id: "${g1}", crop_year: 2026 }
              as: Grower
              as_user_id: "${g1}"
              captures: { la3: $.data.id }
