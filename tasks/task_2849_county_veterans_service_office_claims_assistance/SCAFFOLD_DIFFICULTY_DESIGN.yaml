# §1.8 Scaffold Difficulty Design — task 2849 County Veterans Service Office & Claims Assistance
# Depth probe: the nine §0.5 difficulty rules, each with differentiated instances.
# Every `grounds:` entry resolves into SCAFFOLD.yaml §1.1–§1.7. Every numeric literal in
# `assert:` was computed by executing the referenced §1.3 formula against its `constants:`.
# Logical clock default is 2026-08-01T00:00:00Z (POST /cvso/_clock/set_current_utc).

scaffold_difficulty_design:

  # =====================================================================
  # RULE 1 — dual_variant_calc
  # Two instances in different entity domains: a Claim-domain monetary
  # award and an OutcomeReport-domain performance percentage.
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: retro_award_itf_anchored_versus_filed_anchored_divergence
        grounds:
          - calculations.claim_retro_award_cents
          - state_machines.Claim.READY_TO_FILE_to_FILED
          - state_machines.Claim.FILED_to_DECIDED
          - entities.Claim.fields.effective_date_basis
          - entities.Claim.fields.retro_award_cents
          - concurrency_rules[poa-accept-stale-veteran]
        distinguishing_aspect: |
          Two Claims of the SAME veteran, with identical rating (70), identical dependent count (2),
          identical filed_on (2026-08-10) and identical decided_on (2026-12-20), differ only in whether
          intent_to_file_date is present; the INTENT_TO_FILE_ANCHORED variant yields retro_award_cents
          2884500 and the FILED_DATE_ANCHORED variant yields 769200 — a pinned delta of 2115300 cents.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Representative rep_a (COUNTY_CVSO) and rep_b (VSO_ORG) both accreditation_status ACTIVE."
            - "Veteran vet with dependent_count 2, HONORABLE discharge VERIFIED, intake_status SCREENED."
            - "PowerOfAttorney poa designating rep_a, status ACTIVE."
            - "Claim claim_itf (1 condition, intent_to_file_date 2025-09-15) and Claim claim_filed (1 condition, no intent_to_file_date), both driven to READY_TO_FILE with evidence_completeness_pct 83.42."
            - "Both claims FILED on 2026-08-10; clock then advanced to 2026-12-20."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-001", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Ingrid Osei", accreditation_number: "ACC-2849-002", accreditation_type: "VSO_ORG", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_b: $.data.id }
            - call: "POST /cvso/representatives/${rep_b}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
            - call: "POST /cvso/veterans"
              payload: { full_name: "Alex Rivera", date_of_birth: "1979-03-04", service_start_date: "2001-09-11", service_end_date: "2005-09-10", household_income_cents: 1500000, net_worth_cents: 2000000, dependent_count: 2, homeless_status: "NOT_HOMELESS", referral_source: "WALK_IN" }
              as: IntakeClerk
              captures: { vet: $.data.id }
            - call: "POST /cvso/veterans/${vet}/discharge-documents"
              payload: { document_type: "DD214", source: "VETERAN_PROVIDED", claimed_service_start: "2001-09-11", claimed_service_end: "2005-09-10", claimed_character_of_service: "HONORABLE" }
              as: IntakeClerk
              captures: { doc: $.data.id }
            - call: "POST /cvso/discharge-documents/${doc}/review"
              payload: { action: "VERIFY" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/veterans/${vet}/screen"
              payload: {}
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/powers-of-attorney"
              payload: { veteran_id: "${vet}", representative_id: "${rep_a}", form_type: "VA_21_22", scope: "ALL_BENEFITS", executed_on: "2026-08-01" }
              as: IntakeClerk
              captures: { poa: $.data.id }
            - call: "GET /cvso/veterans/${vet}"
              payload: {}
              as: IntakeClerk
              captures: { vet_v: $.data.version }
            - call: "POST /cvso/powers-of-attorney/${poa}/accept"
              payload: { expected_veteran_version: "${vet_v}" }
              as: VeteranClient
              as_user_id: "${vet}"
            - call: "POST /cvso/claims"
              payload: { veteran_id: "${vet}", poa_id: "${poa}", claim_type: "DISABILITY_COMPENSATION", claimed_conditions: ["tinnitus"], intent_to_file_date: "2025-09-15" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { claim_itf: $.data.id }
            - call: "POST /cvso/claims/${claim_itf}/transitions"
              payload: { action: "OPEN_EVIDENCE_DEVELOPMENT" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/claims/${claim_itf}/evidence-items"
              payload: { evidence_type: "NEXUS_LETTER", provider_name: "Dr. Chen", nexus_opinion_strength: "AT_LEAST_AS_LIKELY_AS_NOT" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { ev_itf_nexus: $.data.id }
            - call: "POST /cvso/claims/${claim_itf}/evidence-items"
              payload: { evidence_type: "SERVICE_TREATMENT_RECORD", provider_name: "NPRC St Louis" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { ev_itf_str: $.data.id }
            - call: "POST /cvso/evidence-items/${ev_itf_nexus}/status"
              payload: { action: "RECEIVE" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/evidence-items/${ev_itf_str}/status"
              payload: { action: "RECEIVE" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/claims/${claim_itf}/transitions"
              payload: { action: "SUBMIT_FOR_REVIEW", reviewer_representative_id: "${rep_b}" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/claims/${claim_itf}/transitions"
              payload: { action: "MARK_READY" }
              as: CountyOfficer
              as_user_id: "${rep_b}"
            - call: "POST /cvso/claims"
              payload: { veteran_id: "${vet}", poa_id: "${poa}", claim_type: "DISABILITY_COMPENSATION", claimed_conditions: ["lumbar strain"] }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { claim_filed: $.data.id }
            - call: "POST /cvso/claims/${claim_filed}/transitions"
              payload: { action: "OPEN_EVIDENCE_DEVELOPMENT" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/claims/${claim_filed}/evidence-items"
              payload: { evidence_type: "NEXUS_LETTER", provider_name: "Dr. Chen", nexus_opinion_strength: "AT_LEAST_AS_LIKELY_AS_NOT" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { ev_fil_nexus: $.data.id }
            - call: "POST /cvso/claims/${claim_filed}/evidence-items"
              payload: { evidence_type: "SERVICE_TREATMENT_RECORD", provider_name: "NPRC St Louis" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { ev_fil_str: $.data.id }
            - call: "POST /cvso/evidence-items/${ev_fil_nexus}/status"
              payload: { action: "RECEIVE" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/evidence-items/${ev_fil_str}/status"
              payload: { action: "RECEIVE" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/claims/${claim_filed}/transitions"
              payload: { action: "SUBMIT_FOR_REVIEW", reviewer_representative_id: "${rep_b}" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/claims/${claim_filed}/transitions"
              payload: { action: "MARK_READY" }
              as: CountyOfficer
              as_user_id: "${rep_b}"
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/claims/${claim_itf}/transitions"
              payload: { action: "FILE", filed_on: "2026-08-10" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/claims/${claim_filed}/transitions"
              payload: { action: "FILE", filed_on: "2026-08-10" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-12-20T09:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /cvso/claims/${claim_itf}/record-decision"
              payload: { decision_outcome: "GRANTED", awarded_rating_pct: 70, decided_on: "2026-12-20" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/claims/${claim_filed}/record-decision"
              payload: { decision_outcome: "GRANTED", awarded_rating_pct: 70, decided_on: "2026-12-20" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
          assert:
            - "Claim.${claim_itf}.effective_date_basis == INTENT_TO_FILE_ANCHORED"
            - "Claim.${claim_itf}.effective_date == 2025-09-15"
            - "Claim.${claim_itf}.retro_award_cents == 2884500"
            - "Claim.${claim_filed}.effective_date_basis == FILED_DATE_ANCHORED"
            - "Claim.${claim_filed}.effective_date == 2026-08-10"
            - "Claim.${claim_filed}.retro_award_cents == 769200"
            - "Claim.${claim_itf}.retro_award_cents - Claim.${claim_filed}.retro_award_cents == 2115300"
            - "Claim.${claim_itf}.status == DECIDED and Claim.${claim_filed}.status == DECIDED"

      - name: performance_score_claim_weighted_versus_veteran_weighted_divergence
        grounds:
          - calculations.outcome_report_performance_score
          - entities.OutcomeReport.fields.weighting_basis
          - entities.OutcomeReport.fields.performance_score
          - entities.OutcomeReport.fields.retro_dollars_cents
          - validations[priority=59]
        distinguishing_aspect: |
          One veteran files two claims inside 2026Q4 — one GRANTED, one DENIED — so the identical row set
          scores performance_score 50.0 under CLAIM_WEIGHTED (1 favorable of 2 claims) and 100.0 under
          VETERAN_WEIGHTED (1 favorable veteran of 1 distinct veteran); this is the OutcomeReport domain,
          not the Claim-award domain covered by retro_award_itf_anchored_versus_filed_anchored_divergence.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z, then advanced through the quarter to 2027-01-05."
            - "rep_a ACTIVE COUNTY_CVSO preparer, rep_b ACTIVE VSO_ORG reviewer."
            - "One Veteran vet with dependent_count 2, discharge VERIFIED, intake_status SCREENED, ACTIVE PowerOfAttorney designating rep_a."
            - "Two claims claim_g and claim_d, each 1 condition and no intent_to_file_date, both FILED on 2026-10-05."
            - "claim_g decided GRANTED at awarded_rating_pct 70 on 2026-12-20; claim_d decided DENIED at awarded_rating_pct 0 on 2026-12-20."
            - "No OutreachEvent exists, so veterans_contacted_total must be 0."
            - "OutcomeReport report for fiscal_quarter 2026Q4 created after the quarter closed."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-011", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Ingrid Osei", accreditation_number: "ACC-2849-012", accreditation_type: "VSO_ORG", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_b: $.data.id }
            - call: "POST /cvso/representatives/${rep_b}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
            - call: "POST /cvso/veterans"
              payload: { full_name: "Alex Rivera", date_of_birth: "1979-03-04", service_start_date: "2001-09-11", service_end_date: "2005-09-10", household_income_cents: 1500000, net_worth_cents: 2000000, dependent_count: 2, homeless_status: "NOT_HOMELESS", referral_source: "WALK_IN" }
              as: IntakeClerk
              captures: { vet: $.data.id }
            - call: "POST /cvso/veterans/${vet}/discharge-documents"
              payload: { document_type: "DD214", source: "VETERAN_PROVIDED", claimed_service_start: "2001-09-11", claimed_service_end: "2005-09-10", claimed_character_of_service: "HONORABLE" }
              as: IntakeClerk
              captures: { doc: $.data.id }
            - call: "POST /cvso/discharge-documents/${doc}/review"
              payload: { action: "VERIFY" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/veterans/${vet}/screen"
              payload: {}
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/powers-of-attorney"
              payload: { veteran_id: "${vet}", representative_id: "${rep_a}", form_type: "VA_21_22", scope: "ALL_BENEFITS", executed_on: "2026-08-01" }
              as: IntakeClerk
              captures: { poa: $.data.id }
            - call: "GET /cvso/veterans/${vet}"
              payload: {}
              as: IntakeClerk
              captures: { vet_v: $.data.version }
            - call: "POST /cvso/powers-of-attorney/${poa}/accept"
              payload: { expected_veteran_version: "${vet_v}" }
              as: VeteranClient
              as_user_id: "${vet}"
            - call: "POST /cvso/claims"
              payload: { veteran_id: "${vet}", poa_id: "${poa}", claim_type: "DISABILITY_COMPENSATION", claimed_conditions: ["tinnitus"] }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { claim_g: $.data.id }
            - call: "POST /cvso/claims/${claim_g}/transitions"
              payload: { action: "OPEN_EVIDENCE_DEVELOPMENT" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/claims/${claim_g}/evidence-items"
              payload: { evidence_type: "NEXUS_LETTER", provider_name: "Dr. Chen", nexus_opinion_strength: "AT_LEAST_AS_LIKELY_AS_NOT" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { ev_g_nexus: $.data.id }
            - call: "POST /cvso/claims/${claim_g}/evidence-items"
              payload: { evidence_type: "SERVICE_TREATMENT_RECORD", provider_name: "NPRC St Louis" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { ev_g_str: $.data.id }
            - call: "POST /cvso/evidence-items/${ev_g_nexus}/status"
              payload: { action: "RECEIVE" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/evidence-items/${ev_g_str}/status"
              payload: { action: "RECEIVE" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/claims/${claim_g}/transitions"
              payload: { action: "SUBMIT_FOR_REVIEW", reviewer_representative_id: "${rep_b}" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/claims/${claim_g}/transitions"
              payload: { action: "MARK_READY" }
              as: CountyOfficer
              as_user_id: "${rep_b}"
            - call: "POST /cvso/claims"
              payload: { veteran_id: "${vet}", poa_id: "${poa}", claim_type: "DISABILITY_COMPENSATION", claimed_conditions: ["lumbar strain"] }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { claim_d: $.data.id }
            - call: "POST /cvso/claims/${claim_d}/transitions"
              payload: { action: "OPEN_EVIDENCE_DEVELOPMENT" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/claims/${claim_d}/evidence-items"
              payload: { evidence_type: "NEXUS_LETTER", provider_name: "Dr. Chen", nexus_opinion_strength: "AT_LEAST_AS_LIKELY_AS_NOT" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { ev_d_nexus: $.data.id }
            - call: "POST /cvso/claims/${claim_d}/evidence-items"
              payload: { evidence_type: "SERVICE_TREATMENT_RECORD", provider_name: "NPRC St Louis" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { ev_d_str: $.data.id }
            - call: "POST /cvso/evidence-items/${ev_d_nexus}/status"
              payload: { action: "RECEIVE" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/evidence-items/${ev_d_str}/status"
              payload: { action: "RECEIVE" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/claims/${claim_d}/transitions"
              payload: { action: "SUBMIT_FOR_REVIEW", reviewer_representative_id: "${rep_b}" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/claims/${claim_d}/transitions"
              payload: { action: "MARK_READY" }
              as: CountyOfficer
              as_user_id: "${rep_b}"
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-10-05T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/claims/${claim_g}/transitions"
              payload: { action: "FILE", filed_on: "2026-10-05" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/claims/${claim_d}/transitions"
              payload: { action: "FILE", filed_on: "2026-10-05" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-12-20T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/claims/${claim_g}/record-decision"
              payload: { decision_outcome: "GRANTED", awarded_rating_pct: 70, decided_on: "2026-12-20" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/claims/${claim_d}/record-decision"
              payload: { decision_outcome: "DENIED", awarded_rating_pct: 0, decided_on: "2026-12-20" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/outcome-reports"
              payload: { fiscal_quarter: "2026Q4" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { report: $.data.id }
          trigger:
            - call: "POST /cvso/outcome-reports/${report}/compute"
              payload: { weighting_basis: "CLAIM_WEIGHTED" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { score_claim: $.data.performance_score }
            - call: "POST /cvso/outcome-reports/${report}/compute"
              payload: { weighting_basis: "VETERAN_WEIGHTED" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { score_vet: $.data.performance_score }
          assert:
            - "${score_claim} == 50.0"
            - "${score_vet} == 100.0"
            - "OutcomeReport.${report}.weighting_basis == VETERAN_WEIGHTED"
            - "OutcomeReport.${report}.filed_claim_count == 2"
            - "OutcomeReport.${report}.favorable_claim_count == 1"
            - "OutcomeReport.${report}.retro_dollars_cents == 384600"
            - "OutcomeReport.${report}.veterans_contacted_total == 0"
            - "OutcomeReport.${report}.status == OPEN"

  # =====================================================================
  # RULE 2 — combinatorial_formula
  # Mode (a): >= 3 inputs with conditional gating (retro dependent add-on).
  # Mode (b): pinned rounding ORDER (per-item then sum, not sum then round).
  # Mode (c): pinned evaluation ORDER (fee band keyed on GROSS, not net).
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: retro_dependent_add_on_gated_off_below_rating_floor
        grounds:
          - calculations.claim_retro_award_cents
          - state_machines.Claim.FILED_to_DECIDED
          - entities.Veteran.fields.dependent_count
          - entities.Claim.fields.awarded_rating_pct
        distinguishing_aspect: |
          Mode (a): retro_award_cents combines four inputs — effective_date, decided_on,
          awarded_rating_pct and Veteran.dependent_count — and the dependent add-on is CONDITIONALLY
          gated on awarded_rating_pct >= 30, so a veteran with dependent_count 2 awarded 20 pct over
          15 retro months earns exactly 519000 cents (15 * 34600) and NOT 765000 (15 * 51000).
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, advanced to 2026-08-10 for filing and 2026-12-20 for the decision."
            - "rep_a ACTIVE COUNTY_CVSO preparer, rep_b ACTIVE VSO_ORG reviewer."
            - "Veteran vet with dependent_count 2 (deliberately non-zero), discharge VERIFIED, intake_status SCREENED."
            - "Claim claim_low with 1 condition and intent_to_file_date 2025-09-15, evidence_completeness_pct 83.42, FILED on 2026-08-10 with effective_date 2025-09-15."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-021", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Ingrid Osei", accreditation_number: "ACC-2849-022", accreditation_type: "VSO_ORG", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_b: $.data.id }
            - call: "POST /cvso/representatives/${rep_b}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
            - call: "POST /cvso/veterans"
              payload: { full_name: "Alex Rivera", date_of_birth: "1979-03-04", service_start_date: "2001-09-11", service_end_date: "2005-09-10", household_income_cents: 1500000, net_worth_cents: 2000000, dependent_count: 2, homeless_status: "NOT_HOMELESS", referral_source: "WALK_IN" }
              as: IntakeClerk
              captures: { vet: $.data.id }
            - call: "POST /cvso/veterans/${vet}/discharge-documents"
              payload: { document_type: "DD214", source: "VETERAN_PROVIDED", claimed_service_start: "2001-09-11", claimed_service_end: "2005-09-10", claimed_character_of_service: "HONORABLE" }
              as: IntakeClerk
