# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Clinical Trial Smart Matching — 9 rules x >=2 instances = 19 instances.
#
# Reusable setup pattern "OPEN trial + ELIGIBLE screening": create a Sponsor
# trial with 2 arms + 1 inclusion criterion + a DRAFT consent; APPROVE the
# protocol IRB review; APPROVE the consent IRB review; activate the consent
# (posture -> OPEN); register a participant satisfying the criterion; screen
# (ELIGIBLE); create an enrollment (SCREENED). OCC versions are always captured
# fresh from GET /trials/{id} immediately before the guarded call.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_eligibility_snapshot_vs_revalidation_drift
        grounds:
          - calculations.eligibility_match
          - validations[priority=15]
          - errors[ERR_ELIGIBILITY_DRIFTED]
          - entities.Screening.fields.match_result
        distinguishing_aspect: "Operates on the Screening/Participant domain: the frozen screening_snapshot says ELIGIBLE but the enrollment_revalidation variant, run after the participant's age_years dropped below the inclusion threshold, yields INELIGIBLE and rejects enrollment — same predicates, two evaluation times, divergent results."
        test_recipe:
          setup:
            - "A trial in SETUP with one INCLUSION criterion age_years GE 18."
            - "A participant aged 20 screened ELIGIBLE against that trial, then PATCHed to age 17 before enrollment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Sponsor
            - call: "POST /trials"
              payload: { title: "Drift Trial", target_enrollment: 5, randomization_method: "SIMPLE" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { trial_id: $.data.id }
            - call: "POST /trials/${trial_id}/criteria"
              payload: { kind: "INCLUSION", attribute: "age_years", comparator: "GE", threshold: 18 }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /participants"
              payload: { full_name: "P Drift", age_years: 20, weight_kg: 70, hba1c: 6.0 }
              as: CoordinatorStaff
              captures: { participant_id: $.data.id }
            - call: "POST /trials/${trial_id}/screen-participant"
              payload: { participant_id: "${participant_id}" }
              as: CoordinatorStaff
              captures: { screening_id: $.data.id, screen_result: $.data.match_result }
            - call: "PATCH /participants/${participant_id}"
              payload: { age_years: 17 }
              as: CoordinatorStaff
          trigger:
            - call: "POST /enrollments"
              payload: { screening_id: "${screening_id}" }
              as: CoordinatorStaff
              captures: { err: $.data.error_id }
          assert:
            - "Screening.${screening_id}.match_result == ELIGIBLE"
            - "POST /enrollments response status == 409"
            - "response.data.error_id == ERR_ELIGIBILITY_DRIFTED"

      - name: dvc_compensation_standard_vs_early_termination
        grounds:
          - calculations.compensation_sweep
          - entities.CompensationPayment.fields.amount_cents
          - entities.Enrollment.fields.enrollment_status
        distinguishing_aspect: "Operates on the Enrollment/Payment domain (distinct from eligibility's Screening domain): at an identical gross of 33600, standard_sweep withholds 10% (net 30240) while early_termination_sweep on a WITHDRAWN enrollment withholds nothing (net 33600)."
        test_recipe:
          setup:
            - "An ACTIVE enrollment in an OPEN trial with three COMPLETED on-time visits (seq 1,2,3) -> payable 10000/11200/12400, gross 33600."
            - "A second, independent ACTIVE enrollment likewise with three COMPLETED visits, then WITHDRAWN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: Sponsor
            - call: "POST /trials"
              payload: { title: "Pay Trial", target_enrollment: 5, randomization_method: "SIMPLE" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { trial_id: $.data.id }
            - call: "POST /trials/${trial_id}/arms"
              payload: { name: "TREATMENT", allocation_weight: 1 }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /trials/${trial_id}/arms"
              payload: { name: "PLACEBO", allocation_weight: 1 }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /trials/${trial_id}/consent-documents"
              payload: { body_hash: "h1" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { doc_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews"
              payload: { scope: "PROTOCOL" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { prot_review_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews/${prot_review_id}/decide"
              payload: { action: "APPROVE" }
              as: IRBReviewer
              as_user_id: "irb-1"
            - call: "POST /trials/${trial_id}/irb-reviews"
              payload: { scope: "CONSENT", consent_document_id: "${doc_id}" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { cons_review_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews/${cons_review_id}/decide"
              payload: { action: "APPROVE" }
              as: IRBReviewer
              as_user_id: "irb-1"
            - call: "GET /trials/${trial_id}"
              payload: {}
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { tv_act: $.data.version }
            - call: "POST /trials/${trial_id}/consent-documents/${doc_id}/activate"
              payload: { expected_trial_version: "${tv_act}" }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /participants"
              payload: { full_name: "P Pay A", age_years: 40, weight_kg: 80, hba1c: 6.0 }
              as: CoordinatorStaff
              captures: { pa_id: $.data.id }
            - call: "POST /trials/${trial_id}/screen-participant"
              payload: { participant_id: "${pa_id}" }
              as: CoordinatorStaff
              captures: { scr_a: $.data.id }
            - call: "POST /enrollments"
              payload: { screening_id: "${scr_a}" }
              as: CoordinatorStaff
              captures: { enr_a: $.data.id }
            - call: "POST /enrollments/${enr_a}/transition"
              payload: { action: "CONSENT", consent_document_id: "${doc_id}" }
              as: CoordinatorStaff
            - call: "GET /trials/${trial_id}"
              payload: {}
              as: CoordinatorStaff
              captures: { tv_a: $.data.version }
            - call: "POST /enrollments/${enr_a}/transition"
              payload: { action: "RANDOMIZE", expected_trial_version: "${tv_a}" }
              as: CoordinatorStaff
            - call: "POST /enrollments/${enr_a}/transition"
              payload: { action: "ACTIVATE" }
              as: CoordinatorStaff
            - call: "POST /enrollments/${enr_a}/visits"
              payload: { sequence_index: 1, scheduled_at: "2026-06-02T10:00:00Z", draw_window_minutes: 30 }
              as: CoordinatorStaff
              captures: { v_a1: $.data.id }
            - call: "POST /enrollments/${enr_a}/visits"
              payload: { sequence_index: 2, scheduled_at: "2026-06-03T10:00:00Z", draw_window_minutes: 30 }
              as: CoordinatorStaff
              captures: { v_a2: $.data.id }
            - call: "POST /enrollments/${enr_a}/visits"
              payload: { sequence_index: 3, scheduled_at: "2026-06-04T10:00:00Z", draw_window_minutes: 30 }
              as: CoordinatorStaff
              captures: { v_a3: $.data.id }
            - call: "POST /visits/${v_a1}/complete"
              payload: { drawn_at: "2026-06-02T10:00:00Z" }
              as: CoordinatorStaff
            - call: "POST /visits/${v_a2}/complete"
              payload: { drawn_at: "2026-06-03T10:00:00Z" }
              as: CoordinatorStaff
            - call: "POST /visits/${v_a3}/complete"
              payload: { drawn_at: "2026-06-04T10:00:00Z" }
              as: CoordinatorStaff
          trigger:
            - call: "POST /enrollments/${enr_a}/payments"
              payload: {}
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { pay_a_gross: $.data.gross_cents, pay_a_net: $.data.amount_cents }
          assert:
            - "CompensationPayment.gross_cents == 33600"
            - "CompensationPayment.amount_cents == 30240"
            - "the early_termination_sweep counterpart (a WITHDRAWN enrollment with the same three completed visits) returns amount_cents == 33600 (no withholding) at the identical gross 33600"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cf_match_score_weighted_mode_a
        grounds:
          - calculations.match_score
          - entities.Screening.fields.match_score
        distinguishing_aspect: "Mode (a): >=3 inputs (inclusion-pass ratio, exclusion-clear ratio, two weights) combined non-linearly with a min(1.0,.) clamp and category-folding branches; with 2 inclusion (1 passed) + 1 exclusion (cleared) the score is 0.6*0.5 + 0.4*1.0 = 0.7000."
        test_recipe:
          setup:
            - "A trial with two INCLUSION criteria (age_years GE 18, hba1c GE 7.0) and one EXCLUSION (prior_trials_count GE 3)."
            - "A participant aged 20, hba1c 6.0 (fails the hba1c inclusion), prior_trials_count 0 (clears the exclusion)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Sponsor
            - call: "POST /trials"
              payload: { title: "Score Trial", target_enrollment: 5, randomization_method: "SIMPLE" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { trial_id: $.data.id }
            - call: "POST /trials/${trial_id}/criteria"
              payload: { kind: "INCLUSION", attribute: "age_years", comparator: "GE", threshold: 18 }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /trials/${trial_id}/criteria"
              payload: { kind: "INCLUSION", attribute: "hba1c", comparator: "GE", threshold: 7.0 }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /trials/${trial_id}/criteria"
              payload: { kind: "EXCLUSION", attribute: "prior_trials_count", comparator: "GE", threshold: 3 }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /participants"
              payload: { full_name: "P Score", age_years: 20, weight_kg: 70, hba1c: 6.0, prior_trials_count: 0 }
              as: CoordinatorStaff
              captures: { participant_id: $.data.id }
          trigger:
            - call: "POST /trials/${trial_id}/screen-participant"
              payload: { participant_id: "${participant_id}" }
              as: CoordinatorStaff
              captures: { score: $.data.match_score, fc: $.data.failed_criteria_count, res: $.data.match_result }
          assert:
            - "Screening.match_score == 0.7"
            - "Screening.failed_criteria_count == 1"
            - "Screening.match_result == INELIGIBLE"

      - name: cf_compensation_sweep_circular_mode_c
        grounds:
          - calculations.compensation_sweep
          - entities.CompensationPayment.fields.amount_cents
          - entities.CompensationPayment.fields.gross_cents
        distinguishing_aspect: "Mode (c): circular-looking dependency — the withholding tier is keyed on the gross subtotal, so the net cannot be evaluated until gross is fixed; pinned order gross(33600) -> tier(HIGH, gross>=30000) -> withholding(3360) -> net(30240)."
        test_recipe:
          setup:
            - "An ACTIVE enrollment with three COMPLETED on-time visits (seq 1,2,3): payable 10000 + 11200 + 12400 = gross 33600."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: Sponsor
            - call: "POST /trials"
              payload: { title: "Sweep Trial", target_enrollment: 5, randomization_method: "SIMPLE" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { trial_id: $.data.id }
            - call: "POST /trials/${trial_id}/arms"
              payload: { name: "TREATMENT", allocation_weight: 1 }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /trials/${trial_id}/arms"
              payload: { name: "PLACEBO", allocation_weight: 1 }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /trials/${trial_id}/consent-documents"
              payload: { body_hash: "h1" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { doc_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews"
              payload: { scope: "PROTOCOL" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { prot_review_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews/${prot_review_id}/decide"
              payload: { action: "APPROVE" }
              as: IRBReviewer
              as_user_id: "irb-1"
            - call: "POST /trials/${trial_id}/irb-reviews"
              payload: { scope: "CONSENT", consent_document_id: "${doc_id}" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { cons_review_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews/${cons_review_id}/decide"
              payload: { action: "APPROVE" }
              as: IRBReviewer
              as_user_id: "irb-1"
            - call: "GET /trials/${trial_id}"
              payload: {}
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { tv_act: $.data.version }
            - call: "POST /trials/${trial_id}/consent-documents/${doc_id}/activate"
              payload: { expected_trial_version: "${tv_act}" }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /participants"
              payload: { full_name: "P Sweep", age_years: 40, weight_kg: 80, hba1c: 6.0 }
              as: CoordinatorStaff
              captures: { participant_id: $.data.id }
            - call: "POST /trials/${trial_id}/screen-participant"
              payload: { participant_id: "${participant_id}" }
              as: CoordinatorStaff
              captures: { screening_id: $.data.id }
            - call: "POST /enrollments"
              payload: { screening_id: "${screening_id}" }
              as: CoordinatorStaff
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/transition"
              payload: { action: "CONSENT", consent_document_id: "${doc_id}" }
              as: CoordinatorStaff
            - call: "GET /trials/${trial_id}"
              payload: {}
              as: CoordinatorStaff
              captures: { tv_r: $.data.version }
            - call: "POST /enrollments/${enr_id}/transition"
              payload: { action: "RANDOMIZE", expected_trial_version: "${tv_r}" }
              as: CoordinatorStaff
            - call: "POST /enrollments/${enr_id}/transition"
              payload: { action: "ACTIVATE" }
              as: CoordinatorStaff
            - call: "POST /enrollments/${enr_id}/visits"
              payload: { sequence_index: 1, scheduled_at: "2026-06-02T10:00:00Z", draw_window_minutes: 30 }
              as: CoordinatorStaff
              captures: { v1: $.data.id }
            - call: "POST /enrollments/${enr_id}/visits"
              payload: { sequence_index: 2, scheduled_at: "2026-06-03T10:00:00Z", draw_window_minutes: 30 }
              as: CoordinatorStaff
              captures: { v2: $.data.id }
            - call: "POST /enrollments/${enr_id}/visits"
              payload: { sequence_index: 3, scheduled_at: "2026-06-04T10:00:00Z", draw_window_minutes: 30 }
              as: CoordinatorStaff
              captures: { v3: $.data.id }
            - call: "POST /visits/${v1}/complete"
              payload: { drawn_at: "2026-06-02T10:00:00Z" }
              as: CoordinatorStaff
            - call: "POST /visits/${v2}/complete"
              payload: { drawn_at: "2026-06-03T10:00:00Z" }
              as: CoordinatorStaff
            - call: "POST /visits/${v3}/complete"
              payload: { drawn_at: "2026-06-04T10:00:00Z" }
              as: CoordinatorStaff
          trigger:
            - call: "POST /enrollments/${enr_id}/payments"
              payload: {}
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { gross: $.data.gross_cents, net: $.data.amount_cents }
          assert:
            - "CompensationPayment.gross_cents == 33600"
            - "CompensationPayment.amount_cents == 30240"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_irb_review_branching_fork
        grounds:
          - state_machines.IRBReview.PENDING_to_APPROVED
          - state_machines.IRBReview.PENDING_to_REJECTED
          - state_machines.IRBReview.PENDING_to_REVISE_REQUESTED
        distinguishing_aspect: "IRBReview is a branching fork on entity IRBReview: from PENDING the same /decide endpoint forks to APPROVED, REJECTED, or REVISE_REQUESTED with divergent side-effects (APPROVE sets Trial.irb_status=APPROVED; REJECT sets REJECTED; REVISE leaves it PENDING but locks the review)."
        test_recipe:
          setup:
            - "A trial with a PENDING PROTOCOL IRB review."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Sponsor
            - call: "POST /trials"
              payload: { title: "Fork Trial", target_enrollment: 3, randomization_method: "SIMPLE" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { trial_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews"
              payload: { scope: "PROTOCOL" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { review_id: $.data.id }
          trigger:
            - call: "POST /trials/${trial_id}/irb-reviews/${review_id}/decide"
              payload: { action: "REJECT" }
              as: IRBReviewer
              as_user_id: "irb-1"
              captures: { dec: $.data.decision }
          assert:
            - "IRBReview.decision == REJECTED"
            - "Trial.irb_status == REJECTED"
            - "a sibling fork from PENDING with action=REVISE yields IRBReview.decision == REVISE_REQUESTED and Trial.irb_status stays PENDING (different side-effect set)"

      - name: nlsm_enrollment_parallel_dimensions_independent
        grounds:
          - state_machines.Enrollment.CLEAR_to_FLAGGED
          - state_machines.Enrollment.CONSENTED_to_RANDOMIZED
          - entities.Enrollment.fields.safety_status
          - entities.Enrollment.fields.enrollment_status
        distinguishing_aspect: "Enrollment carries two parallel dimensions on the SAME row (different entity than IRBReview): enrollment_status advances RANDOMIZED while safety_status moves CLEAR->FLAGGED independently when an adverse event is triaged — the two axes evolve without ordering coupling."
        test_recipe:
          setup:
            - "A RANDOMIZED enrollment (enrollment_status=RANDOMIZED, safety_status=CLEAR) with a REPORTED adverse event."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: Sponsor
            - call: "POST /trials"
              payload: { title: "Parallel Trial", target_enrollment: 5, randomization_method: "SIMPLE" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { trial_id: $.data.id }
            - call: "POST /trials/${trial_id}/arms"
              payload: { name: "TREATMENT", allocation_weight: 1 }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /trials/${trial_id}/arms"
              payload: { name: "PLACEBO", allocation_weight: 1 }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /trials/${trial_id}/consent-documents"
              payload: { body_hash: "h1" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { doc_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews"
              payload: { scope: "PROTOCOL" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { prot_review_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews/${prot_review_id}/decide"
              payload: { action: "APPROVE" }
              as: IRBReviewer
              as_user_id: "irb-1"
            - call: "POST /trials/${trial_id}/irb-reviews"
              payload: { scope: "CONSENT", consent_document_id: "${doc_id}" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { cons_review_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews/${cons_review_id}/decide"
              payload: { action: "APPROVE" }
              as: IRBReviewer
              as_user_id: "irb-1"
            - call: "GET /trials/${trial_id}"
              payload: {}
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { tv_act: $.data.version }
            - call: "POST /trials/${trial_id}/consent-documents/${doc_id}/activate"
              payload: { expected_trial_version: "${tv_act}" }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /participants"
              payload: { full_name: "P Par", age_years: 40, weight_kg: 80, hba1c: 6.0 }
              as: CoordinatorStaff
              captures: { participant_id: $.data.id }
            - call: "POST /trials/${trial_id}/screen-participant"
              payload: { participant_id: "${participant_id}" }
              as: CoordinatorStaff
              captures: { screening_id: $.data.id }
            - call: "POST /enrollments"
              payload: { screening_id: "${screening_id}" }
              as: CoordinatorStaff
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/transition"
              payload: { action: "CONSENT", consent_document_id: "${doc_id}" }
              as: CoordinatorStaff
            - call: "GET /trials/${trial_id}"
              payload: {}
              as: CoordinatorStaff
              captures: { tv_r: $.data.version }
            - call: "POST /enrollments/${enr_id}/transition"
              payload: { action: "RANDOMIZE", expected_trial_version: "${tv_r}" }
              as: CoordinatorStaff
            - call: "POST /enrollments/${enr_id}/adverse-events"
              payload: { severity: "MODERATE", occurred_at: "2026-06-01T09:00:00Z" }
              as: Investigator
              as_user_id: "inv-1"
              captures: { ae_id: $.data.id }
          trigger:
            - call: "POST /adverse-events/${ae_id}/review"
              payload: { action: "TRIAGE" }
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "GET /enrollments/${enr_id}"
              payload: {}
              as: CoordinatorStaff
              captures: { es: $.data.enrollment_status, ss: $.data.safety_status }
          assert:
            - "Enrollment.${enr_id}.enrollment_status == RANDOMIZED"
            - "Enrollment.${enr_id}.safety_status == FLAGGED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: tc_consent_activate_supersede_reconsent_depth3
        grounds:
          - state_machines.ConsentDocument.IRB_APPROVED_to_ACTIVE
          - state_machines.ConsentDocument.ACTIVE_to_SUPERSEDED
          - state_machines.Enrollment.CONSENTED_to_SCREENED
        distinguishing_aspect: "Depth-3 chain rooted at consent-document activate: activate v2 (hop1) -> prior ACTIVE v1 SUPERSEDED (hop2, caused by activate) -> every Enrollment that signed v1 and is CONSENTED reverts CONSENTED->SCREENED (hop3, caused by the supersede, not the activate)."
        test_recipe:
          setup:
            - "An OPEN trial with ACTIVE consent v1; one enrollment CONSENTED against v1; consent v2 created, IRB-approved, ready to activate."
          setup_api_calls:
