  - section: consistency_model
    intent: >
      §0.2 declares consistency_model immediate, which for this scaffold is a strong claim:
      the money ledger on UtilityProgram, the denormalised counters on Project and
      Technician and the cascade-driven fields on DuctSystem and SealJob are all
      denormalised, and every one of them must be correct in the very response that caused
      the change — no read-your-writes lag, no recompute-on-read that a second identical GET
      would change.
    instances:
      - name: denormalised_counters_and_the_money_ledger_are_correct_in_the_causing_response
        claim_type: immediate
        grounds:
          - entities.UtilityProgram.remaining_budget_cents
          - entities.Project.duct_system_count
          - entities.Technician.open_seal_job_count
          - endpoints[POST /duct-sealing/rebate-claims]
        distinguishing_aspect: "The claim create is the deepest write in the domain: it computes both rebate variants, picks one, commits money against the programme and freezes the breakdown. Under immediate consistency the committing call's OWN response body must already carry the frozen money, the programme read taken immediately afterwards must already show the commitment, and a second identical read must return byte-identical values — which is what separates immediate from a recompute-on-read or eventual implementation."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; the full happy path on AHU-1 (300.00 -> 55.00) with an ISSUED report, no claim yet; programme budget 5000000 cents, PER_CFM at 1200 cents, cap 500000, invoice 480000 cents"
