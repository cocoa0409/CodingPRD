  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: fraud_confirm_taints_streams_then_slashes_statement_share
        grounds:
          - state_machines.FraudCase.OPEN_to_CONFIRMED
          - calculations.clawback_amount
          - calculations.royalty_pool_share
        distinguishing_aspect: |
          Depth-3 cascade from adjudicate CONFIRM: FraudCase -> StreamEvent
          rows flip is_tainted -> those streams drop out of the close-time
          input set -> the artist's RoyaltyStatement share_bps falls (B drops
          from 7500 to 5000, A rises 2500 to 5000), AND clawback_cents 0.40
          lands on the closed-not-settled statement (net 38888 - 0.40 ==
          38887.60). Each hop is caused by the previous one.
        test_recipe:
          setup:
            - "Artists A and B, each LIVE with a focus track; OPEN period [2026-09-01, 2026-10-01) pool 77777."
            - "Streams: A one organic; B three organic (09-11, 09-12, 09-13)."
            - "Fraud case on B's track over [2026-09-13T00:00:00Z, 2026-09-14T00:00:00Z) with signals 1.0/1.0/0.6 (confidence 0.9000) — created AUTO_FLAGGED."
          setup_api_calls:
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog/artists"
              payload: { stage_name: "CasA", primary_genre: "POP", home_territory: "US", follower_count: 5000 }
              as: PlatformAdmin
              captures: { art_ca: $.data.id }
            - call: "POST /catalog/artists"
              payload: { stage_name: "CasB", primary_genre: "POP", home_territory: "US", follower_count: 5000 }
              as: PlatformAdmin
              captures: { art_cb: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_ca}", title: "RA", release_type: "SINGLE", release_date: "2026-09-10T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_ca}"
              captures: { rel_ca: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_cb}", title: "RB", release_type: "SINGLE", release_date: "2026-09-10T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_cb}"
              captures: { rel_cb: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_ca}", title: "TA", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_ca}"
              captures: { trk_ca: $.data.id }
            - call: "POST /catalog/tracks"
