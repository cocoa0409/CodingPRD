        grounds:
          - state_machines.AuditEngagement.status.OPENED_to_FINDINGS_ISSUED
          - state_machines.RoyaltyReport.review_status.ACCEPTED_to_DISPUTED
          - calculations.propagator_royalty_ledger
          - calculations.propagator_compliance_score
          - state_machines.PropagatorAgreement.status.ACTIVE_to_SUSPENDED
          - state_machines.ProductionQuota.status.ACTIVE_to_FROZEN
        distinguishing_aspect: |
          A completely different trigger - a single business write, POST
          /audit-engagements/{id}/finalize with finding_severity MATERIAL - and a
          different four-deep chain that crosses four other entities: the finding
          disputes the audited report and zeroes its booked amount (1), the
          un-booking re-aggregates Propagator.royalty_payable_cents to 0 (2), the
          MATERIAL penalty suspends the agreement with suspension_reason
          AUDIT_FINDING (3), and that suspension freezes the agreement's ACTIVE
          quotas (4). It also shows a link REMOVING a penalty: the QUOTA_OVERRUN
          points vanish because the report is no longer ACCEPTED.
