          Entity pair Enrollment -> Installment (different from Enrollment->LicenseProgram):
          Enrollment ACTIVE->PASSED is blocked while any non-VOID Installment remains DUE
          (financing_balance_cents > 0); certify PASS returns ERR_BALANCE_OUTSTANDING until
          the remaining installments are PAID.
        test_recipe:
