            - { call: "POST /api/show-designs/${d1}/lock", payload: { expected_show_event_version: "${v1}" }, as: ProductionPlanner }
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { v2: $.data.version } }
            - { call: "POST /api/safety-configurations", payload: { show_event_id: "${show_id}", geofence_radius_m: 250, altitude_hard_ceiling_ft: 400, lost_link_action: "RETURN_TO_HOME", geofence_breach_action: "IMMEDIATE_LAND", battery_rtl_threshold_pct: 30, expected_show_event_version: "${v2}" }, as: ProductionPlanner, as_user_id: "planner-1", captures: { config_id: $.data.id } }
            - { call: "POST /api/safety-configurations/${config_id}/approve", payload: {}, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /api/airspace-authorizations", payload: { show_event_id: "${show_id}", window_start: "2026-08-10T18:00:00Z", window_end: "2026-08-10T21:00:00Z", altitude_ceiling_ft: 450, waiver_types: ["NIGHT_OPS"] }, as: ProductionPlanner, captures: { auth_id: $.data.id } }
            - { call: "POST /api/airspace-authorizations/${auth_id}/submit", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/airspace-authorizations/${auth_id}/decide", payload: { decision: "APPROVED" }, as: AuthorityOfficer, as_user_id: "ao-1" }
            - { call: "POST /api/show-events/${show_id}/authorize", payload: { authorization_id: "${auth_id}" }, as: ProductionPlanner, captures: { pre_status: $.data.lifecycle_status } }
            - { call: "POST /api/show-designs", payload: { show_event_id: "${show_id}", drone_count: 10, max_altitude_ft: 320, duration_sec: 600, min_separation_m: 3.0 }, as: ProductionPlanner, captures: { d2: $.data.id } }
            - { call: "POST /api/simulation-runs", payload: { show_design_id: "${d2}", min_separation_observed_m: 3.5, battery_draw_pct: 55, max_speed_mps: 9.0 }, as: ProductionPlanner }
          trigger:
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { v3: $.data.version } }
            - { call: "POST /api/show-designs/${d2}/lock", payload: { expected_show_event_version: "${v3}" }, as: ProductionPlanner, captures: { d2_status: $.data.status } }
            - { call: "GET /api/show-designs/${d1}", as: ProductionPlanner, captures: { d1_status: $.data.status } }
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { show_status: $.data.lifecycle_status, pinned: $.data.pinned_design_id, posture: $.data.readiness_posture } }
          assert:
            - "setup held: ${pre_status} == AUTHORIZED with D1 pinned"
            - "link 1: ${d2_status} == LOCKED and ${d1_status} == SUPERSEDED"
            - "link 2: ${pinned} == ${d2} and ${show_status} == DESIGN_LOCKED (re-pin downgraded AUTHORIZED) and ${posture} == NOT_READY (g3 authorization gate now unpinned-satisfied but lifecycle reverted; g5 grid empty)"

      - name: authorization_expiry_sweep_cascade
        grounds:
          - state_machines.AirspaceAuthorization.APPROVED_to_EXPIRED
          - state_machines.ShowEvent.AUTHORIZED_to_PLANNING
        distinguishing_aspect: |
          Depth-2 chain from the ops sweep (system trigger, not an incident or a
          lock): run_sweep expires the APPROVED authorization whose window has
          passed (link 1); the expiry downgrades the pinning show AUTHORIZED ->
          PLANNING and drops posture to NOT_READY (link 2).
        test_recipe:
          setup:
            - "Site A; Show S (10 drones) AUTHORIZED with APPROVED authorization window 2026-08-10T18:00-21:00Z"
            - "clock advanced to 2026-08-11T00:00:00Z (past the authorization window_end)"
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show S", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 10 }, as: ProductionPlanner, captures: { show_id: $.data.id } }
            - { call: "POST /api/show-designs", payload: { show_event_id: "${show_id}", drone_count: 10, max_altitude_ft: 300, duration_sec: 600, min_separation_m: 3.0 }, as: ProductionPlanner, captures: { design_id: $.data.id } }
            - { call: "POST /api/simulation-runs", payload: { show_design_id: "${design_id}", min_separation_observed_m: 3.5, battery_draw_pct: 55, max_speed_mps: 9.0 }, as: ProductionPlanner }
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { v1: $.data.version } }
            - { call: "POST /api/show-designs/${design_id}/lock", payload: { expected_show_event_version: "${v1}" }, as: ProductionPlanner }
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { v2: $.data.version } }
            - { call: "POST /api/safety-configurations", payload: { show_event_id: "${show_id}", geofence_radius_m: 250, altitude_hard_ceiling_ft: 400, lost_link_action: "RETURN_TO_HOME", geofence_breach_action: "IMMEDIATE_LAND", battery_rtl_threshold_pct: 30, expected_show_event_version: "${v2}" }, as: ProductionPlanner, as_user_id: "planner-1", captures: { config_id: $.data.id } }
            - { call: "POST /api/safety-configurations/${config_id}/approve", payload: {}, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /api/airspace-authorizations", payload: { show_event_id: "${show_id}", window_start: "2026-08-10T18:00:00Z", window_end: "2026-08-10T21:00:00Z", altitude_ceiling_ft: 450, waiver_types: ["NIGHT_OPS"] }, as: ProductionPlanner, captures: { auth_id: $.data.id } }
            - { call: "POST /api/airspace-authorizations/${auth_id}/submit", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/airspace-authorizations/${auth_id}/decide", payload: { decision: "APPROVED" }, as: AuthorityOfficer, as_user_id: "ao-1" }
            - { call: "POST /api/show-events/${show_id}/authorize", payload: { authorization_id: "${auth_id}" }, as: ProductionPlanner, captures: { pre: $.data.lifecycle_status } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: OpsAdmin }
          trigger:
            - { call: "POST /api/_ops/run_sweep", payload: {}, as: OpsAdmin, captures: { expired: $.data.expired_authorization_ids, downgraded: $.data.downgraded_show_ids } }
            - { call: "GET /api/airspace-authorizations/${auth_id}", as: ProductionPlanner, captures: { auth_status: $.data.status } }
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { show_status: $.data.lifecycle_status, show_posture: $.data.readiness_posture } }
          assert:
            - "setup held: ${pre} == AUTHORIZED"
            - "link 1: ${auth_status} == EXPIRED and ${expired} includes ${auth_id}"
            - "link 2: ${show_status} == PLANNING and ${show_posture} == NOT_READY and ${downgraded} includes ${show_id}"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: assignment_state_precedes_drone_safety
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_DRONE_NOT_FLYABLE]
        distinguishing_aspect: |
          Pair state(5) x business_safety(7): one assignment request violates
          both (show still PLANNING AND drone GROUNDED); the p5 state error
          ERR_INVALID_STATE must win over ERR_DRONE_NOT_FLYABLE.
        test_recipe:
          setup:
            - "Site A; Show S in PLANNING (no design locked); drone d1 GROUNDED"
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show S", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 10 }, as: ProductionPlanner, captures: { show_id: $.data.id } }
            - { call: "POST /api/drones", payload: { serial_number: "SN-D01", model: "LUM-2" }, as: FleetManager, captures: { d1: $.data.id } }
            - { call: "POST /api/drones/${d1}/ground", payload: {}, as: SafetyOfficer, as_user_id: "so-1" }
          trigger:
            - { call: "POST /api/launch-grid-assignments", payload: { show_event_id: "${show_id}", drone_id: "${d1}", grid_row: 0, grid_col: 0 }, as: FleetManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE (state priority 5 beats business_safety priority 7, even though the drone is also GROUNDED)"

      - name: authorization_ceiling_safety_precedes_window_overlap
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_ALTITUDE_CEILING_EXCEEDS_SITE]
          - errors[ERR_AUTHORIZATION_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Pair business_safety(7) x business_temporal(8): one submit violates
          both (ceiling 600ft > site max 500ft AND window overlaps an
          UNDER_REVIEW authorization); the safety error
          ERR_ALTITUDE_CEILING_EXCEEDS_SITE must win over
          ERR_AUTHORIZATION_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Site A; Show A (window 2026-08-10T19:00-19:30Z) with auth A UNDER_REVIEW (window 18:00-21:00)"
            - "Show B (window 2026-08-10T22:00-22:30Z; 150min turnaround gap OK) with auth B DRAFT: window 2026-08-10T20:30-22:45Z (overlaps auth A), ceiling 600ft (> site max 500)"
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show A", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 10 }, as: ProductionPlanner, captures: { show_a: $.data.id } }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show B", window_start: "2026-08-10T22:00:00Z", window_end: "2026-08-10T22:30:00Z", drone_count_planned: 5 }, as: ProductionPlanner, captures: { show_b: $.data.id } }
            - { call: "POST /api/airspace-authorizations", payload: { show_event_id: "${show_a}", window_start: "2026-08-10T18:00:00Z", window_end: "2026-08-10T21:00:00Z", altitude_ceiling_ft: 450, waiver_types: ["NIGHT_OPS"] }, as: ProductionPlanner, captures: { auth_a: $.data.id } }
            - { call: "POST /api/airspace-authorizations/${auth_a}/submit", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/airspace-authorizations", payload: { show_event_id: "${show_b}", window_start: "2026-08-10T20:30:00Z", window_end: "2026-08-10T22:45:00Z", altitude_ceiling_ft: 600, waiver_types: ["NIGHT_OPS"] }, as: ProductionPlanner, captures: { auth_b: $.data.id } }
          trigger:
            - { call: "POST /api/airspace-authorizations/${auth_b}/submit", payload: {}, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_ALTITUDE_CEILING_EXCEEDS_SITE (business_safety priority 7 beats business_temporal priority 8, even though the window also overlaps auth A)"

      - name: drone_double_booking_temporal_precedes_slot_constraint
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_DRONE_DOUBLE_BOOKED]
          - errors[ERR_GRID_SLOT_OCCUPIED]
        distinguishing_aspect: |
          Pair business_temporal(8) x business_constraint(9): one assignment
          violates both (drone already ASSIGNED on a window-overlapping show at
          ANOTHER site AND the target slot is occupied); the temporal error
          ERR_DRONE_DOUBLE_BOOKED must win over ERR_GRID_SLOT_OCCUPIED.
        test_recipe:
          setup:
            - "Site A and Site C (identical limits); Show A at Site A and Show C at Site C, both window 2026-08-10T19:00-19:30Z, both AUTHORIZED (1-drone designs)"
