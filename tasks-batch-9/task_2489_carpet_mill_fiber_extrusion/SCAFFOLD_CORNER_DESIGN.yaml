            - "the clock call returns current_utc == \"2026-08-05T08:00:00Z\" with lapsed_certification_ids == [], suspended_style_ids == [] and held_production_run_ids == []"
            - "the second load-setup returns HTTP 200 with ProductionRun.${pr}.status == TUFTING"
            - "after the second load-setup, ProductionRun.${pr}.stitch_rate_per_inch == 10.0"

      - name: start_dyeing_before_dye_window_returns_dye_window_not_open
        claim_type: precondition_enforcement
        grounds:
          - state_machines.DyeLot.FORMULATED_to_DYEING
