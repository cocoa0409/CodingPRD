            - "data.error_id == \"ERR_VALIDATION\" - not ERR_ZERO_HOURS_NOT_ALLOWED"
            - "GET /volunteers/${vol_id}/availability-windows returns HTTP 200 with total_count == 0"
      - name: error_zero_hours_beats_window_outside_cycle
