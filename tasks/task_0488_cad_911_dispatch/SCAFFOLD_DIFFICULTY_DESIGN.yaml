  # =========================================================================
  # Rule 6 — Boundary-precision checks on DIFFERENT metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: sla_breach_strict_greater_at_exact_boundary
        grounds:
          - calculations.sla_breach_evaluation
          - entities.Incident.fields.sla_breached
          - entities.Agency.fields.response_sla_seconds
        distinguishing_aspect: |
          Numeric threshold crossing on the response-time endpoint (PATCH assignments status ONSCENE):
          handle_time exactly equal to governing SLA (480 == 480) yields sla_breached==false because
          the rule uses strict '>'; one extra second would flip it to true.
        test_recipe:
          setup:
            - "EMS agency sla=480, MEDIC_ALS unit at ALI; MEDICAL incident received 08:00:00, dispatched 08:01:00, ONSCENE 08:08:00 -> handle exactly 480."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:00:00Z" }
              as: SystemClock
            - call: "POST /agencies"
