      - name: deliverability_variant_divergence_on_one_field_state
        claim_type: variant_divergence
        grounds:
          - calculations.deliverability_rates.variants.CURVE_INTERPOLATED
          - calculations.deliverability_rates.variants.TIER_FLOOR
        excluded_because:
          difficulty_instance: deliverability_curve_interpolated_vs_tier_floor_on_identical_field_state
          rationale: |
            The §1.8 instance already pins both variants against byte-identical field state and
            curve rows, asserting the two rate pairs that diverge; a breadth copy would re-run the
            same two fields with the same literals and add no independent signal.

      - name: deliverability_variant_is_selected_by_the_stored_method_flag
        claim_type: variant_selection
        grounds:
          - calculations.deliverability_rates
          - entities.StorageField.fields.deliverability_method
        excluded_because:
          difficulty_instance: deliverability_curve_interpolated_vs_tier_floor_on_identical_field_state
          rationale: |
            Selection is the mechanism that §1.8 instance exercises — the ONLY difference between
            its two fields is deliverability_method, so the selector is already under test and a
            separate instance would just re-read the flag.

      - name: ticket_charge_breakdown_produces_the_six_stamped_amounts
        claim_type: correct_result
        grounds:
          - calculations.ticket_charge_breakdown
          - entities.GasMovementTicket.fields.total_charge_usd
        excluded_because:
          difficulty_instance: ticket_charge_six_step_order_with_discount_tier_keyed_on_commodity_only
          rationale: |
            The §1.8 instance asserts all six stamped amounts on a ticket whose tier flips if the
            discount is keyed on the post-fuel total, so the happy-path result is covered there; the
            corner value left over is the tier boundary itself, which
            ticket_discount_tier_boundaries_make_a_bigger_haul_cheaper covers instead.

      - name: cash_out_method_flag_picks_the_pricing_variant
        claim_type: variant_selection
        grounds:
          - calculations.imbalance_cash_out.variants.MONTHLY_AGGREGATE
          - calculations.imbalance_cash_out.variants.DAILY_RATCHET
          - entities.StorageContract.fields.cash_out_method
        excluded_because:
          difficulty_instance: cash_out_monthly_aggregate_vs_daily_ratchet_over_identical_imbalance_ledger
          rationale: |
            That §1.8 instance runs two contracts whose ONLY difference is cash_out_method over an
            identical ledger, so both the selection and the divergence (offsetting days cancelling
            under the aggregate variant but not under the ratchet) are already pinned.

      - name: cash_out_walks_the_ledger_day_by_day_in_gas_day_order
        claim_type: chronological
        grounds:
          - calculations.imbalance_cash_out
          - entities.ImbalanceLedgerEntry.fields.gas_day
        excluded_because:
          difficulty_instance: cash_out_monthly_aggregate_vs_daily_ratchet_over_identical_imbalance_ledger
          rationale: |
            The DAILY_RATCHET half of that instance already prices each gas day separately and
            rounds per day before summing, which is exactly the chronological walk; its literals
            were chosen so that a sum-then-round implementation reports a different amount.

      - name: report_variance_pct_reconciles_measured_against_book_inventory
        claim_type: reconciliation
        grounds:
          - calculations.report_variance
          - entities.RegulatoryReport.fields.variance_dth
          - entities.RegulatoryReport.fields.variance_pct
        excluded_because:
          difficulty_instance: report_variance_tolerance_boundary_is_inclusive_at_exactly_half_a_percent
          rationale: |
            Reconciliation of measured against book inventory IS that instance's subject, including
            the signed variance, the 4-decimal percentage and the inclusive MAX_REPORT_VARIANCE_PCT
            comparison at exactly 0.5000; nothing about the reconciliation is left untested.

  # =========================================================================
  # VALIDATIONS
  # =========================================================================
  - section: validations
    instances:

      - name: injection_capacity_gate_measures_the_net_volume_against_the_working_gas_ceiling
        claim_type: violation_to_error
        grounds:
          - validations.priority_14_ERR_WORKING_GAS_CAPACITY_EXCEEDED
          - errors.ERR_WORKING_GAS_CAPACITY_EXCEEDED
          - entities.StorageField.fields.max_working_gas_dth
          - calculations.ticket_charge_breakdown
        distinguishing_aspect: |
          The ceiling test is applied to net_volume_dth, so a nearly full field admits or refuses a
          ticket on a quantity the operator never metered: on F_TIGHT (max_working_gas_dth 200000,
          working gas 190000) a 10500 Dth injection is refused because 190000 + 10374.000 exceeds
          200000, and the refusal is a pure no-op — the ticket stays PENDING, the field version does
          not move and retained_fuel_pool_dth stays 0.000. A 5000 Dth injection then passes.
        test_recipe:
          setup:
            - "Field F_TIGHT (total 300000 / cushion 100000 / max working 200000) with opening working gas 190000 and one well TIGHT-1."
            - "Shipper NORTHLINE with FIRM contract CT-1 (max_daily_injection_dth 20000)."
            - "Two INJECTION nominations, 10500 Dth on gas day 2026-08-20 and 5000 Dth on 2026-08-21, both confirmed in full."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Tight Cavern", field_code: "F-TIGHT", total_capacity_dth: 300000, cushion_gas_dth: 100000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 190000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
