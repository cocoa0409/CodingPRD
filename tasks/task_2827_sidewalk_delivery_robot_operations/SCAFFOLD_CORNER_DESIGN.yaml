            - call: "POST /sidewalk-segments/${s4}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
          trigger:
            - call: "GET /sidewalk-segments?zone_id=${z}&status=APPROVED&segment_type=CROSSING"
              as: FleetDispatcher
            - call: "GET /sidewalk-segments?zone_id=${z}&status=APPROVED"
              as: FleetDispatcher
            - call: "GET /sidewalk-segments?zone_id=${z}&segment_type=CROSSING"
              as: FleetDispatcher
            - call: "GET /sidewalk-segments?zone_id=${z}"
              as: FleetDispatcher
          assert:
            - "the two-filter listing returns 200 with exactly 1 row and total_count == 1"
            - "that row is SidewalkSegment.${s2} with status == APPROVED and segment_type == CROSSING"
            - "the status-only listing returns 2 rows and total_count == 2"
            - "the type-only listing returns 2 rows and total_count == 2"
            - "the zone-only listing returns 3 rows and total_count == 3"
            - "SidewalkSegment.${s4}.status == SURVEYED and SidewalkSegment.${s4}.crossing_risk_score == 46.6"
      - name: pagination_beyond_the_last_page_returns_an_empty_page
        claim_type: pagination
        grounds:
          - "endpoints[GET /delivery-orders]"
          - "response_envelope.pagination_fields"
          - "response_envelope.pagination_defaults"
        distinguishing_aspect: >-
          Paging is offset based over a created_at ASC ordering and total_count always describes the whole
          filtered set rather than the page: limit 2 offset 0 returns the two oldest rows with
          has_more true, offset 2 returns the last row with has_more false, and offset 3 returns an empty
          data array with 200 and total_count 3 rather than a 404 - and omitting limit applies the declared
          default of 10, not an unbounded page.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z, advanced to 09:05 and then 09:10 between the creates"
            - "ServiceZone Z1 PERMITTED with segments S1, S2, S3, S5 APPROVED and Merchant M1 ACTIVE PREFERRED"
            - "orders C-A, C-B and C-C were created in that order at 09:00, 09:05 and 09:10, all 22.0 L and all promised 2026-08-03T11:00:00.000Z"
            - "all three are RECEIVED with quoted_fee_cents 679 and urgency_flag false"
