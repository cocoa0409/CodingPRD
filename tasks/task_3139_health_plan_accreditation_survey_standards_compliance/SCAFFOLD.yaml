# =============================================================================
# SCAFFOLD — Health Plan Accreditation Survey & Standards Compliance (NCQA)
# Task: task_3139_health_plan_accreditation_survey_standards_compliance
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Health Plan Accreditation Survey & Standards Compliance (NCQA): accreditation application with product line and geography scoping, standards evidence assembly across utilization management, credentialing, member rights and quality improvement, file review samples for denials, appeals and credentialing decisions against required timeliness, quality measure results and consumer survey scores contributing to the accreditation outcome, survey scheduling with virtual and on-site components and surveyor questions, scoring, accreditation status assignment and public display rules, corrective action for element-level gaps with resurvey options, annual reporting between survey cycles and standards year transitions

domain_name: health-plan-accreditation
api_prefix: /accreditation

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - scheduled_deferred_actions
  entity_topology: hierarchical
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: HealthPlan
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal plan name" }
      - { name: plan_code, type: string, source: input, description: "Unique plan code; duplicates rejected with ERR_PLAN_CODE_DUPLICATE", constraints: "unique across all health plans" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED; starts ACTIVE", default: ACTIVE }

  - name: ProductLineScope
    parent: HealthPlan
    common_fields: true
    fields:
      - { name: health_plan_id, type: string, source: system, description: "FK -> HealthPlan.id; owning plan" }
      - { name: product_line, type: enum, source: input, description: "COMMERCIAL | MEDICARE | MEDICAID | MARKETPLACE" }
      - { name: state_codes, type: array, source: input, description: "Non-empty array of 2-letter US state codes in scope" }
      - { name: member_count, type: integer, source: input, description: "Covered members; must be >= 1", constraints: ">= 1" }

  - name: StandardsEdition
    parent: null
    common_fields: true
    fields:
      - { name: edition_year, type: integer, source: input, description: "Standards year, e.g. 2026; unique", constraints: "unique" }
      - { name: effective_from, type: datetime, source: input, description: "Edition effective window start (inclusive)" }
      - { name: effective_until, type: datetime, source: input, description: "Edition effective window end (inclusive); must be > effective_from" }
      - { name: min_file_sample_per_category, type: integer, source: input, description: "Minimum required_size for any FileReviewSample created under applications on this edition; >= 1", constraints: ">= 1" }
      - { name: timeliness_threshold, type: number, source: input, description: "Pass threshold for sample timeliness_rate, e.g. 0.90; comparison is rate >= threshold", constraints: "0 < value <= 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | SUPERSEDED; starts DRAFT", default: DRAFT }

  - name: StandardElement
    parent: StandardsEdition
    common_fields: true
    fields:
      - { name: standards_edition_id, type: string, source: system, description: "FK -> StandardsEdition.id; owning edition" }
      - { name: element_code, type: string, source: input, description: "Element code, unique within its edition", constraints: "unique per standards_edition_id" }
      - { name: category, type: enum, source: input, description: "UM | CR | MRR | QI (utilization management, credentialing, member rights & responsibilities, quality improvement)" }
      - { name: max_points, type: integer, source: input, description: "Maximum scorable points; >= 1", constraints: ">= 1" }
      - { name: is_must_pass, type: boolean, source: input, description: "Must-pass element flag; failure gates ACCREDITED status" }
      - { name: evidence_required_count, type: integer, source: input, description: "Minimum ACCEPTED EvidenceItems required before survey scheduling; >= 0", constraints: ">= 0" }

  - name: AccreditationApplication
    parent: HealthPlan
    common_fields: true
    fields:
      - { name: health_plan_id, type: string, source: system, description: "FK -> HealthPlan.id; owning plan" }
      - { name: product_line_scope_id, type: string, source: input, description: "FK -> ProductLineScope.id; scope under review; must belong to health_plan_id" }
      - { name: standards_edition_id, type: string, source: input, description: "FK -> StandardsEdition.id; edition the application is scored against" }
      - { name: review_period_start, type: datetime, source: input, description: "File review lookback window start (inclusive)" }
      - { name: review_period_end, type: datetime, source: input, description: "File review lookback window end (inclusive); must be > review_period_start" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | EVIDENCE_REVIEW | SURVEY_SCHEDULING | SURVEY_IN_PROGRESS | SCORING | DECIDED | CORRECTIVE_ACTION | RESURVEY_IN_PROGRESS | WITHDRAWN | CLOSED", default: DRAFT }
      - { name: total_awarded_points, type: number, source: computed, description: "Sum of awarded_points over FINAL, non-VOIDED ElementScores of this application; 0 when none" }
      - { name: total_forfeited_points, type: number, source: computed, description: "Sum of forfeited_points over FINAL, non-VOIDED ElementScores of this application; 0 when none" }

  - name: EvidenceItem
    parent: AccreditationApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> AccreditationApplication.id; owning application" }
      - { name: standard_element_id, type: string, source: input, description: "FK -> StandardElement.id; element this evidence supports" }
      - { name: title, type: string, source: input, description: "Evidence title" }
      - { name: review_note, type: string, source: system, description: "Reviewer note recorded at accept/reject; null until reviewed", default: null }
      - { name: revision_count, type: integer, source: system, description: "Number of resubmissions; 0 at creation, +1 per resubmit", default: 0 }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | REJECTED | VOIDED; starts SUBMITTED", default: SUBMITTED }

  - name: FileReviewSample
    parent: AccreditationApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> AccreditationApplication.id; owning application" }
      - { name: sample_type, type: enum, source: input, description: "DENIAL | APPEAL | CREDENTIALING" }
      - { name: category, type: enum, source: computed, description: "Derived: DENIAL -> UM, APPEAL -> UM, CREDENTIALING -> CR" }
      - { name: required_size, type: integer, source: input, description: "Required number of cases; must be >= edition.min_file_sample_per_category", constraints: ">= owning edition.min_file_sample_per_category" }
      - { name: timeliness_basis, type: enum, source: input, description: "DECISION_DATE | RESOLUTION_DATE; which date is compared against required_turnaround_days" }
      - { name: timely_case_count, type: integer, source: computed, description: "Count of cases with is_timely == true; computed at score time", default: 0 }
      - { name: timeliness_rate, type: number, source: computed, description: "timely_case_count / case count, rounded to 4 decimal places round_half_up; null until SCORED", default: null }
      - { name: must_pass_threshold_breached, type: boolean, source: computed, description: "true when timeliness_rate < edition.timeliness_threshold AND the sample category contains at least one is_must_pass element in the edition; computed at score time", default: false }
      - { name: status, type: enum, source: system, description: "OPEN | SUBMITTED | SCORED; starts OPEN", default: OPEN }

  - name: FileReviewCase
    parent: FileReviewSample
    common_fields: true
    fields:
      - { name: file_review_sample_id, type: string, source: system, description: "FK -> FileReviewSample.id; owning sample" }
      - { name: case_reference, type: string, source: input, description: "Plan-side case reference" }
      - { name: service_date, type: datetime, source: input, description: "Date of service/decision request; must lie within the application's [review_period_start, review_period_end] inclusive" }
      - { name: decision_date, type: datetime, source: input, description: "Date the denial/appeal/credentialing decision was rendered" }
      - { name: resolution_date, type: datetime, source: input, description: "Date the case was fully resolved (notification sent / file closed)" }
      - { name: required_turnaround_days, type: integer, source: input, description: "Regulatory turnaround in whole days; must be >= 1", constraints: ">= 1" }
      - { name: is_timely, type: boolean, source: computed, description: "(basis_date - service_date) in whole days <= required_turnaround_days, where basis_date is decision_date when sample.timeliness_basis == DECISION_DATE else resolution_date" }
      - { name: days_to_basis, type: integer, source: computed, description: "Whole calendar days between service_date and the sample's timeliness basis date (floor of elapsed time)" }

  - name: Survey
    parent: AccreditationApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> AccreditationApplication.id; owning application" }
      - { name: survey_type, type: enum, source: input, description: "FULL | RESURVEY" }
      - { name: mode, type: enum, source: input, description: "VIRTUAL | ONSITE | HYBRID" }
      - { name: start_date, type: string, source: input, description: "Survey window start date (YYYY-MM-DD, inclusive)" }
      - { name: end_date, type: string, source: input, description: "Survey window end date (YYYY-MM-DD, inclusive); must be >= start_date" }
      - { name: budgeted_surveyor_hours, type: integer, source: input, description: "Planned surveyor hours; >= 1", constraints: ">= 1" }
      - { name: frozen_cap_closure_rate, type: number, source: computed, description: "For RESURVEY only: VERIFIED CAPs / total CAPs of the application, frozen at confirm time (4 decimals round_half_up); null for FULL surveys", default: null }
      - { name: scheduled_minutes, type: integer, source: computed, description: "Sum of duration_minutes over sessions in SCHEDULED status", default: 0 }
      - { name: completed_minutes, type: integer, source: computed, description: "Sum of duration_minutes over sessions in COMPLETED status", default: 0 }
      - { name: cancelled_minutes, type: integer, source: computed, description: "Sum of duration_minutes over sessions in CANCELLED status", default: 0 }
      - { name: active_minutes, type: integer, source: computed, description: "scheduled_minutes + completed_minutes", default: 0 }
      - { name: status, type: enum, source: system, description: "PLANNED | CONFIRMED | COMPLETED | CANCELLED; starts PLANNED", default: PLANNED }

  - name: SurveySession
    parent: Survey
    common_fields: true
    fields:
      - { name: survey_id, type: string, source: system, description: "FK -> Survey.id; owning survey" }
      - { name: surveyor_id, type: string, source: input, description: "FK -> Surveyor.id; assigned surveyor" }
      - { name: session_date, type: string, source: input, description: "Session calendar date (YYYY-MM-DD); must lie within the survey [start_date, end_date] inclusive" }
      - { name: start_minute, type: integer, source: input, description: "Start minute of day, 0..1439", constraints: "0 <= value <= 1439" }
      - { name: end_minute, type: integer, source: input, description: "End minute of day, 1..1440; must be > start_minute", constraints: "start_minute < value <= 1440" }
      - { name: is_onsite, type: boolean, source: input, description: "true for on-site sessions; at most one on-site session per calendar date per survey" }
      - { name: duration_minutes, type: integer, source: computed, description: "end_minute - start_minute" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED; starts SCHEDULED", default: SCHEDULED }

  - name: Surveyor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Surveyor full name" }
      - { name: credential_level, type: enum, source: input, description: "LEAD | STAFF" }
      - { name: active, type: boolean, source: system, description: "Always true; retained for roster display", default: true }

  - name: SurveyorQuestion
    parent: SurveySession
    common_fields: true
    fields:
      - { name: survey_session_id, type: string, source: system, description: "FK -> SurveySession.id; session where the question was asked" }
      - { name: standard_element_id, type: string, source: input, description: "FK -> StandardElement.id; element the question probes; must belong to the application's edition" }
      - { name: question_text, type: string, source: input, description: "Verbatim surveyor question" }
      - { name: raises_gap, type: boolean, source: input, description: "true when the surveyor flags a potential element-level gap" }
      - { name: gap_confirmed, type: boolean, source: computed, description: "Set at adjudication; null until ADJUDICATED", default: null }
      - { name: status, type: enum, source: system, description: "LOGGED | ADJUDICATED; starts LOGGED", default: LOGGED }

  - name: ElementScore
    parent: AccreditationApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> AccreditationApplication.id; owning application" }
      - { name: standard_element_id, type: string, source: input, description: "FK -> StandardElement.id; scored element; at most one non-VOIDED score per (application, element)" }
      - { name: scoring_basis, type: enum, source: computed, description: "FILE_REVIEW when the application has never completed a RESURVEY survey; RESURVEY otherwise", default: FILE_REVIEW }
      - { name: sample_rate_used, type: number, source: computed, description: "Category sample rate applied at computation time (min over SCORED samples of the element's category; null when the category has no SCORED sample)", default: null }
      - { name: evidence_count_used, type: integer, source: computed, description: "ACCEPTED evidence count applied at computation time", default: 0 }
      - { name: gap_count_used, type: integer, source: computed, description: "Confirmed gap count applied at computation time; always 0 while PROVISIONAL", default: 0 }
      - { name: awarded_points, type: number, source: computed, description: "Points awarded, 2 decimals round_half_up per calculations.element_score" }
      - { name: forfeited_points, type: number, source: computed, description: "max_points - awarded_points; invariant awarded + forfeited == max_points" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINAL | VOIDED; starts PROVISIONAL", default: PROVISIONAL }

  - name: QualityMeasureResult
    parent: ProductLineScope
    common_fields: true
    fields:
      - { name: product_line_scope_id, type: string, source: system, description: "FK -> ProductLineScope.id; owning scope" }
      - { name: measure_code, type: string, source: input, description: "Measure identifier (e.g. HEDIS code); unique per (scope, measure_code, measurement_year)" }
      - { name: measurement_year, type: integer, source: input, description: "Measurement year the result applies to" }
      - { name: percentile, type: integer, source: input, description: "National percentile 0..100", constraints: "0 <= value <= 100" }
      - { name: is_reportable, type: boolean, source: input, description: "Only reportable results feed the composite score" }

  - name: ConsumerSurveyScore
    parent: ProductLineScope
    common_fields: true
    fields:
      - { name: product_line_scope_id, type: string, source: system, description: "FK -> ProductLineScope.id; owning scope" }
      - { name: survey_year, type: integer, source: input, description: "Survey administration year" }
      - { name: composite_score, type: number, source: input, description: "Consumer survey composite 0..100, 2 decimals", constraints: "0 <= value <= 100" }
      - { name: response_count, type: integer, source: input, description: "Number of respondents; >= 1", constraints: ">= 1" }

  - name: CorrectiveActionPlan
    parent: AccreditationApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> AccreditationApplication.id; owning application" }
      - { name: standard_element_id, type: string, source: input, description: "FK -> StandardElement.id; element with the gap; at most one non-VOIDED CAP per (application, element)" }
      - { name: gap_description, type: string, source: input, description: "Description of the element-level gap" }
      - { name: due_date, type: string, source: input, description: "CAP due date (YYYY-MM-DD)" }
      - { name: is_overdue, type: boolean, source: computed, description: "true when due_date < logical clock date and status != VERIFIED" }
      - { name: origin, type: enum, source: computed, description: "AUTO when created by the decide cascade; MANUAL when created via POST", default: MANUAL }
      - { name: status, type: enum, source: system, description: "OPEN | EVIDENCE_SUBMITTED | VERIFIED; starts OPEN", default: OPEN }

  - name: AccreditationOutcome
    parent: AccreditationApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> AccreditationApplication.id; 1:1 with the application" }
      - { name: composite_score, type: number, source: computed, description: "round(base*100 + measure_bonus, 2) per calculations.composite_accreditation_score" }
      - { name: measure_bonus, type: number, source: computed, description: "round(quality_component,2) + round(consumer_component,2); component rounding pinned in calculations.composite_accreditation_score" }
      - { name: must_pass_failure_count, type: integer, source: computed, description: "Count of FINAL ElementScores where element.is_must_pass AND awarded_points < element.max_points / 2" }
      - { name: status, type: enum, source: computed, description: "ACCREDITED | ACCREDITED_WITH_CAP | PROVISIONAL | DENIED per calculations.accreditation_status_determination" }
      - { name: decision_sequence, type: integer, source: computed, description: "1 at creation; +1 per revise", default: 1 }
      - { name: published, type: boolean, source: computed, description: "true after POST publish", default: false }
      - { name: public_display_until, type: datetime, source: computed, description: "decided_at + 36 months; null until published", default: null }
      - { name: is_publicly_displayed, type: boolean, source: computed, description: "published AND logical clock <= public_display_until AND no other published outcome exists for the same product_line_scope with a higher decision_sequence or later decided_at", default: false }
      - { name: decided_at, type: datetime, source: computed, description: "Logical-clock timestamp of the latest decide/revise" }

  - name: AnnualReport
    parent: AccreditationApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> AccreditationApplication.id; owning application" }
      - { name: reporting_year, type: integer, source: input, description: "Calendar year being reported; unique per application", constraints: "unique per application_id" }
      - { name: attestation, type: string, source: input, description: "Attestation text, >= 20 characters", constraints: "length >= 20" }
      - { name: due_date, type: datetime, source: computed, description: "(reporting_year + 1)-03-31T23:59:59Z" }
      - { name: is_late, type: boolean, source: computed, description: "Set at submit: logical clock > due_date", default: false }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | LATE | ACCEPTED | RETURNED; starts DRAFT", default: DRAFT }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: HealthPlan
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /accreditation/health-plans/{planId}/retire"
        actor: PlatformAdmin
        preconditions:
          - "Plan is ACTIVE (ERR_APPLICATION_INVALID_STATE never applies here; wrong-state retire returns ERR_PLAN_NOT_ACTIVE)"
          - "No AccreditationApplication of this plan is in a non-terminal status (status NOT IN {WITHDRAWN, CLOSED}); else ERR_ACTIVE_APPLICATIONS_EXIST"
        side_effects: []

  - entity: StandardsEdition
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /accreditation/standards-editions/{editionId}/publish"
        actor: PlatformAdmin
        preconditions:
          - "Edition is DRAFT (ERR_EDITION_NOT_PUBLISHED when invoked from any other state)"
          - "Edition has at least one StandardElement (ERR_EDITION_HAS_NO_ELEMENTS)"
        side_effects: []
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "POST /accreditation/standards-editions/{editionId}/supersede"
        actor: PlatformAdmin
        preconditions:
          - "superseded_by_edition_id must differ from the path edition id (ERR_INVALID_REQUEST, 400)"
          - "Edition is PUBLISHED (ERR_EDITION_NOT_SUPERSEDABLE otherwise)"
          - "superseded_by_edition_id references a different StandardsEdition in PUBLISHED status (ERR_EDITION_NOT_PUBLISHED)"
        side_effects:
          - "Every AccreditationApplication with standards_edition_id == this edition AND status == DRAFT transitions DRAFT -> WITHDRAWN (system trigger)"
          - "Each such application's withdrawal then voids its SUBMITTED EvidenceItems (see AccreditationApplication DRAFT -> WITHDRAWN side effects)"

  - entity: AccreditationApplication
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /accreditation/applications/{applicationId}/submit"
        actor: PlanCoordinator
        preconditions:
          - "Application is DRAFT (ERR_APPLICATION_INVALID_STATE)"
          - "expected_application_version matches application.version (ERR_STALE_VERSION)"
          - "Application's StandardsEdition is PUBLISHED (ERR_EDITION_NOT_PUBLISHED)"
          - "No other AccreditationApplication for the same (product_line_scope_id, standards_edition_id) exists in a non-terminal status (status NOT IN {WITHDRAWN, CLOSED}); else ERR_DUPLICATE_ACTIVE_APPLICATION"
        side_effects:
          - "increments AccreditationApplication.version by 1"
      - from: SUBMITTED
        to: EVIDENCE_REVIEW
        trigger: "POST /accreditation/applications/{applicationId}/begin-evidence-review"
        actor: AccreditationOfficer
        preconditions:
          - "Application is SUBMITTED (ERR_APPLICATION_INVALID_STATE)"
        side_effects:
          - "increments AccreditationApplication.version by 1"
      - from: EVIDENCE_REVIEW
        to: SURVEY_SCHEDULING
        trigger: "POST /accreditation/applications/{applicationId}/advance-to-survey-scheduling"
        actor: AccreditationOfficer
        preconditions:
          - "Application is EVIDENCE_REVIEW (ERR_APPLICATION_INVALID_STATE)"
          - "Every StandardElement of the application's edition with evidence_required_count > 0 has at least evidence_required_count EvidenceItems in ACCEPTED status for this application (ERR_EVIDENCE_COMPLETENESS_UNMET)"
        side_effects:
          - "increments AccreditationApplication.version by 1"
      - from: SURVEY_SCHEDULING
        to: SURVEY_IN_PROGRESS
        trigger: "system (when a FULL Survey of this application is confirmed)"
        actor: system
        preconditions: []
        side_effects:
          - "increments AccreditationApplication.version by 1"
      - from: SURVEY_IN_PROGRESS
        to: SCORING
        trigger: "system (when the CONFIRMED FULL Survey of this application completes)"
        actor: system
        preconditions: []
        side_effects:
          - "increments AccreditationApplication.version by 1"
      - from: SCORING
        to: DECIDED
        trigger: "system (when POST /accreditation/applications/{applicationId}/outcome or POST /accreditation/outcomes/{outcomeId}/revise succeeds)"
        actor: system
        preconditions: []
        side_effects:
          - "Immediately re-evaluated: transitions DECIDED -> CORRECTIVE_ACTION when at least one CorrectiveActionPlan of the application is in OPEN or EVIDENCE_SUBMITTED status after CAP auto-creation; otherwise DECIDED -> CLOSED"
      - from: DECIDED
        to: CORRECTIVE_ACTION
        trigger: "system (post-decision re-evaluation: >= 1 CAP in OPEN or EVIDENCE_SUBMITTED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments AccreditationApplication.version by 1"
      - from: DECIDED
        to: CLOSED
        trigger: "system (post-decision re-evaluation: zero CAPs in OPEN or EVIDENCE_SUBMITTED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments AccreditationApplication.version by 1"
      - from: CORRECTIVE_ACTION
        to: RESURVEY_IN_PROGRESS
        trigger: "system (when a RESURVEY Survey of this application is confirmed)"
        actor: system
        preconditions: []
        side_effects:
          - "increments AccreditationApplication.version by 1"
      - from: RESURVEY_IN_PROGRESS
        to: SCORING
        trigger: "system (when the CONFIRMED RESURVEY Survey of this application completes)"
        actor: system
        preconditions: []
        side_effects:
          - "Every ElementScore of this application in FINAL status whose standard_element_id matches an existing CAP's standard_element_id transitions FINAL -> VOIDED"
          - "increments AccreditationApplication.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /accreditation/applications/{applicationId}/withdraw OR system (owning StandardsEdition superseded while application is DRAFT)"
        actor: PlanCoordinator | system
        preconditions:
          - "Application is DRAFT (manual path: ERR_APPLICATION_INVALID_STATE otherwise)"
        side_effects:
          - "Every EvidenceItem of this application in SUBMITTED status transitions SUBMITTED -> VOIDED"
          - "increments AccreditationApplication.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /accreditation/applications/{applicationId}/withdraw"
        actor: PlanCoordinator
        preconditions:
          - "Application is SUBMITTED (ERR_APPLICATION_INVALID_STATE otherwise)"
        side_effects:
          - "Every EvidenceItem of this application in SUBMITTED status transitions SUBMITTED -> VOIDED"
          - "increments AccreditationApplication.version by 1"

  - entity: EvidenceItem
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, VOIDED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /accreditation/evidence-items/{evidenceItemId}/accept"
        actor: AccreditationOfficer
        preconditions:
          - "EvidenceItem is SUBMITTED (ERR_EVIDENCE_NOT_REVIEWABLE)"
          - "Owning application is in EVIDENCE_REVIEW (ERR_APPLICATION_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /accreditation/evidence-items/{evidenceItemId}/reject"
        actor: AccreditationOfficer
        preconditions:
          - "EvidenceItem is SUBMITTED (ERR_EVIDENCE_NOT_REVIEWABLE)"
          - "Owning application is in EVIDENCE_REVIEW (ERR_APPLICATION_INVALID_STATE)"
        side_effects: []
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /accreditation/evidence-items/{evidenceItemId}/resubmit"
        actor: PlanCoordinator
        preconditions:
          - "EvidenceItem is REJECTED (ERR_EVIDENCE_NOT_RESUBMITTABLE)"
          - "Owning application is in EVIDENCE_REVIEW (ERR_APPLICATION_INVALID_STATE)"
        side_effects:
          - "revision_count += 1; review_note reset to null"
      - from: SUBMITTED
        to: VOIDED
        trigger: "system (owning application withdrawn)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FileReviewSample
    initial_state: OPEN
    terminal_states: [SCORED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /accreditation/file-review-samples/{sampleId}/submit"
        actor: PlanCoordinator
        preconditions:
          - "Sample is OPEN (ERR_SAMPLE_NOT_OPEN)"
          - "Case count >= required_size (ERR_SAMPLE_INCOMPLETE)"
        side_effects: []
      - from: SUBMITTED
        to: SCORED
        trigger: "POST /accreditation/file-review-samples/{sampleId}/score"
        actor: AccreditationOfficer
        preconditions:
          - "Sample is SUBMITTED (ERR_SAMPLE_NOT_SUBMITTED)"
        side_effects:
          - "Recompute is_timely / days_to_basis for every case from the sample's timeliness_basis"
          - "Set timely_case_count, timeliness_rate (4 decimals round_half_up), must_pass_threshold_breached per calculations.sample_timeliness_rate"

  - entity: Survey
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: CONFIRMED
        trigger: "POST /accreditation/surveys/{surveyId}/confirm"
        actor: AccreditationOfficer
        preconditions:
          - "Survey is PLANNED (ERR_SURVEY_INVALID_STATE)"
          - "At least one SurveySession of this survey is SCHEDULED (ERR_NO_SCHEDULED_SESSIONS)"
          - "Every SCHEDULED session lies within [start_date, end_date] (ERR_SESSION_OUTSIDE_SURVEY_WINDOW)"
          - "FULL: owning application is SURVEY_SCHEDULING (ERR_APPLICATION_INVALID_STATE)"
          - "RESURVEY: owning application is CORRECTIVE_ACTION (ERR_APPLICATION_INVALID_STATE)"
          - "RESURVEY: no CorrectiveActionPlan of the application is in EVIDENCE_SUBMITTED status (ERR_CAP_REVIEW_PENDING)"
          - "RESURVEY: no overdue CAP (is_overdue == true) exists for the application (ERR_CAP_OVERDUE)"
          - "No other Survey of the same application in PLANNED/CONFIRMED status has a closed date range [start_date, end_date] intersecting this survey's [start_date, end_date] (touching boundary dates count as overlap; ERR_SURVEY_DATE_OVERLAP)"
        side_effects:
          - "FULL: application SURVEY_SCHEDULING -> SURVEY_IN_PROGRESS"
          - "RESURVEY: application CORRECTIVE_ACTION -> RESURVEY_IN_PROGRESS; frozen_cap_closure_rate = round(VERIFIED CAPs / total CAPs, 4) round_half_up evaluated at this instant"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /accreditation/surveys/{surveyId}/complete"
        actor: AccreditationOfficer
        preconditions:
          - "Survey is CONFIRMED (ERR_SURVEY_INVALID_STATE)"
          - "Every SurveySession of this survey is COMPLETED or CANCELLED (ERR_SESSIONS_NOT_FINISHED)"
        side_effects:
          - "FULL: application SURVEY_IN_PROGRESS -> SCORING"
          - "RESURVEY: application RESURVEY_IN_PROGRESS -> SCORING; FINAL ElementScores for elements with an existing CAP are VOIDED"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /accreditation/surveys/{surveyId}/cancel"
        actor: AccreditationOfficer
        preconditions:
          - "Survey is PLANNED or CONFIRMED (ERR_SURVEY_INVALID_STATE)"
        side_effects:
          - "Every SCHEDULED SurveySession of this survey transitions SCHEDULED -> CANCELLED"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /accreditation/surveys/{surveyId}/cancel"
        actor: AccreditationOfficer
        preconditions:
          - "Survey is PLANNED or CONFIRMED (ERR_SURVEY_INVALID_STATE)"
        side_effects:
          - "Every SCHEDULED SurveySession of this survey transitions SCHEDULED -> CANCELLED"

  - entity: SurveySession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /accreditation/survey-sessions/{sessionId}/complete"
        actor: Surveyor
        preconditions:
          - "Session is SCHEDULED (ERR_SESSION_INVALID_STATE)"
          - "Owning survey is CONFIRMED (ERR_SURVEY_INVALID_STATE)"
          - "X-User-ID equals session.surveyor_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /accreditation/survey-sessions/{sessionId}/cancel OR system (owning survey cancelled)"
        actor: AccreditationOfficer | system
        preconditions:
          - "Session is SCHEDULED (ERR_SESSION_INVALID_STATE)"
        side_effects: []
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /accreditation/survey-sessions/{sessionId}/reschedule"
        actor: AccreditationOfficer
        preconditions:
          - "Session is SCHEDULED (ERR_SESSION_INVALID_STATE)"
          - "Owning survey is PLANNED or CONFIRMED (ERR_SURVEY_INVALID_STATE)"
          - "New session_date lies within the survey [start_date, end_date] (ERR_SESSION_OUTSIDE_SURVEY_WINDOW)"
          - "New [start_minute, end_minute) half-open interval does not overlap any other SCHEDULED or COMPLETED session of the same surveyor on the same session_date; adjacency (end == start) is allowed (ERR_SURVEYOR_SESSION_OVERLAP)"
          - "If is_onsite is true, no other non-CANCELLED on-site session of the same survey exists on the new session_date (ERR_ONSITE_SAME_DATE_CONFLICT)"
        side_effects:
          - "session_date, start_minute, end_minute replaced; duration_minutes recomputed"
        note: "Self-loop cycle: a session may be rescheduled any number of times while SCHEDULED"

  - entity: SurveyorQuestion
    initial_state: LOGGED
    terminal_states: [ADJUDICATED]
    transitions:
      - from: LOGGED
        to: ADJUDICATED
        trigger: "POST /accreditation/surveyor-questions/{questionId}/adjudicate"
        actor: AccreditationOfficer
        preconditions:
          - "Question is LOGGED (ERR_QUESTION_ALREADY_ADJUDICATED)"
        side_effects:
          - "gap_confirmed set from payload"

  - entity: ElementScore
    initial_state: PROVISIONAL
    terminal_states: [FINAL, VOIDED]
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /accreditation/element-scores/{scoreId}/finalize"
        actor: AccreditationOfficer
        preconditions:
          - "Score is PROVISIONAL (ERR_SCORE_NOT_PROVISIONAL)"
          - "Owning application is SCORING (ERR_APPLICATION_INVALID_STATE)"
          - "If a FileReviewSample exists for the element's category, at least one such sample is SCORED (ERR_SAMPLE_NOT_SCORED)"
          - "No SurveyorQuestion with raises_gap == true AND status == LOGGED references this element within this application's surveys (ERR_OPEN_GAP_QUESTIONS_REMAIN)"
        side_effects:
          - "Recompute awarded_points with the FINAL variant (gap deductions included); set gap_count_used, forfeited_points"
      - from: PROVISIONAL
        to: VOIDED
        trigger: "POST /accreditation/element-scores/{scoreId}/void"
        actor: AccreditationOfficer
        preconditions:
          - "Score is PROVISIONAL (ERR_SCORE_NOT_PROVISIONAL)"
        side_effects: []
      - from: FINAL
        to: VOIDED
        trigger: "system (RESURVEY survey completed and element has a CAP)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CorrectiveActionPlan
    initial_state: OPEN
    terminal_states: [VERIFIED]
    transitions:
      - from: OPEN
        to: EVIDENCE_SUBMITTED
        trigger: "POST /accreditation/corrective-action-plans/{capId}/submit-evidence"
        actor: PlanCoordinator
        preconditions:
          - "CAP is OPEN (ERR_CAP_INVALID_STATE)"
          - "Owning application is CORRECTIVE_ACTION (ERR_APPLICATION_INVALID_STATE)"
        side_effects: []
      - from: EVIDENCE_SUBMITTED
        to: VERIFIED
        trigger: "POST /accreditation/corrective-action-plans/{capId}/verify with approved=true"
        actor: AccreditationOfficer
        preconditions:
          - "CAP is EVIDENCE_SUBMITTED (ERR_CAP_INVALID_STATE)"
        side_effects: []
      - from: EVIDENCE_SUBMITTED
        to: OPEN
        trigger: "POST /accreditation/corrective-action-plans/{capId}/verify with approved=false"
        actor: AccreditationOfficer
        preconditions:
          - "CAP is EVIDENCE_SUBMITTED (ERR_CAP_INVALID_STATE)"
        side_effects: []
        note: "Reopen cycle: verification rejection returns the CAP to OPEN; the plan may loop OPEN -> EVIDENCE_SUBMITTED -> OPEN repeatedly"

  - entity: AnnualReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /accreditation/annual-reports/{reportId}/submit when logical clock <= due_date"
        actor: PlanCoordinator
        preconditions:
          - "Report is DRAFT (ERR_REPORT_INVALID_STATE)"
        side_effects:
          - "is_late = false"
      - from: DRAFT
        to: LATE
        trigger: "POST /accreditation/annual-reports/{reportId}/submit when logical clock > due_date"
        actor: PlanCoordinator
        preconditions:
          - "Report is DRAFT (ERR_REPORT_INVALID_STATE)"
        side_effects:
          - "is_late = true"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /accreditation/annual-reports/{reportId}/review with accepted=true"
        actor: AccreditationOfficer
        preconditions:
          - "Report is SUBMITTED or LATE (ERR_REPORT_INVALID_STATE)"
        side_effects: []
      - from: LATE
        to: ACCEPTED
        trigger: "POST /accreditation/annual-reports/{reportId}/review with accepted=true"
        actor: AccreditationOfficer
        preconditions:
          - "Report is SUBMITTED or LATE (ERR_REPORT_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /accreditation/annual-reports/{reportId}/review with accepted=false"
        actor: AccreditationOfficer
        preconditions:
          - "Report is SUBMITTED or LATE (ERR_REPORT_INVALID_STATE)"
        side_effects: []
      - from: LATE
        to: RETURNED
        trigger: "POST /accreditation/annual-reports/{reportId}/review with accepted=false"
        actor: AccreditationOfficer
        preconditions:
          - "Report is SUBMITTED or LATE (ERR_REPORT_INVALID_STATE)"
        side_effects: []
      - from: RETURNED
        to: DRAFT
        trigger: "POST /accreditation/annual-reports/{reportId}/reopen"
        actor: PlanCoordinator
        preconditions:
          - "Report is RETURNED (ERR_REPORT_INVALID_STATE)"
        side_effects:
          - "is_late reset to false"
        note: "Cycle: RETURNED reports re-enter DRAFT and may be resubmitted; lateness is re-evaluated at each submit against the same fixed due_date"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: evidence-create-stale-application
    parent_entity: AccreditationApplication
    write_endpoint: "POST /accreditation/applications/{applicationId}/evidence-items"
    occ_field: "expected_application_version"
    description: |
      Creating an EvidenceItem against an AccreditationApplication whose
      version has advanced since the client last observed it is rejected with
      ERR_STALE_VERSION. Adding evidence does not itself change application
      status, so a second request carrying a superseded version would
      otherwise legitimately succeed; the OCC check on the application's
      version is the rejection mechanism.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: survey-create-stale-application
    parent_entity: AccreditationApplication
    write_endpoint: "POST /accreditation/applications/{applicationId}/surveys"
    occ_field: "expected_application_version"
    description: |
      Creating a Survey (FULL or RESURVEY) against an AccreditationApplication
      whose version has advanced since the client last observed it is rejected
      with ERR_STALE_VERSION. Survey creation leaves application status
      untouched (the application only moves at confirm time), so a stale
      request would otherwise succeed; the OCC check rejects it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: file_case_timeliness
    trigger: "file review sample scoring (POST /accreditation/file-review-samples/{sampleId}/score)"
    algorithm: threshold
    formula: |
      basis_date = case.decision_date if sample.timeliness_basis == DECISION_DATE
                   else case.resolution_date
      days_to_basis = floor((basis_date - service_date) elapsed time / 24h)
      is_timely = (days_to_basis <= case.required_turnaround_days)
      Boundary: days_to_basis == required_turnaround_days is TIMELY (<=).
    input_set: "All FileReviewCases of the sample, regardless of their current values; recomputed in case creation order (created_at ASC) for determinism"
    precision: "whole days; no rounding"
    variants:
      - name: decision_date_basis
        when: "sample.timeliness_basis == DECISION_DATE"
        difference: "Uses decision_date; a case decided promptly but resolved late is timely under this basis"
      - name: resolution_date_basis
        when: "sample.timeliness_basis == RESOLUTION_DATE"
        difference: "Uses resolution_date; the identical case is NOT timely when resolution lags beyond the turnaround even if the decision was prompt — same inputs, different result"

  - name: sample_timeliness_rate
    trigger: "file review sample scoring (POST /accreditation/file-review-samples/{sampleId}/score)"
    algorithm: aggregation
    formula: |
      timely_case_count = count of cases with is_timely == true
      timeliness_rate = round(timely_case_count / total_cases, 4)  # round_half_up
      must_pass_threshold_breached =
          timeliness_rate < edition.timeliness_threshold
          AND exists at least one StandardElement in the application's edition
              with category == sample.category AND is_must_pass == true
      Boundary: timeliness_rate >= threshold passes; strictly less breaches.
    input_set: "All FileReviewCases of the sample (no status filter — every case counts)"
    constants:
      RATE_DECIMALS: 4
    precision: "4 decimal places, round_half_up"

  - name: element_score
    trigger: "element score creation (PROVISIONAL variant) and finalization (FINAL variant)"
    algorithm: weighted_scoring
    formula: |
      # Component selection
      category = element.category
      if any SCORED FileReviewSample of the application has category == element.category:
          sample_rate = min over those samples of timeliness_rate   # most conservative; deterministic (min, no tie-break needed)
          sample_breached = any such sample has must_pass_threshold_breached == true
      else:
          sample_rate = null   # no file review for this category
          sample_breached = false
      accepted_evidence = count of EvidenceItems of the application with
                          standard_element_id == element.id AND status == ACCEPTED
      # Must-pass override
      if element.is_must_pass AND sample_breached:
          awarded_points = 0
      else:
          if sample_rate is null:
              file_points = round(element.max_points * 0.6, 2)     # full file component, desk-review only
          else:
              file_points = round(element.max_points * 0.6 * sample_rate, 2)
          if element.evidence_required_count == 0:
              evidence_points = round(element.max_points * 0.4, 2) # full evidence component
          else:
              evidence_points = round(element.max_points * 0.4 * min(1, accepted_evidence / element.evidence_required_count), 2)
          gap_deduction = round(element.max_points * 0.1 * confirmed_gap_count, 2)
          raw = file_points + evidence_points - gap_deduction
          awarded_points = min(element.max_points, max(0, raw))
      forfeited_points = element.max_points - awarded_points
      # confirmed_gap_count: SurveyorQuestions of this application's surveys with
      # standard_element_id == element.id AND raises_gap == true AND status == ADJUDICATED
      # AND gap_confirmed == true.
      # Invariant: awarded_points + forfeited_points == element.max_points, always.
    input_set: "SCORED FileReviewSamples of the application in the element's category; ACCEPTED EvidenceItems for the element; ADJUDICATED gap-confirmed SurveyorQuestions for the element (FINAL variant only)"
    constants:
      FILE_WEIGHT: 0.6
      EVIDENCE_WEIGHT: 0.4
      GAP_DEDUCTION_RATE: 0.1
    precision: "each component rounded to 2 decimals round_half_up BEFORE combining; final value is exact to 2 decimals"
    variants:
      - name: provisional
        when: "POST /accreditation/applications/{applicationId}/element-scores (score creation)"
        difference: "confirmed_gap_count is treated as 0 — survey gaps are not yet adjudicated; identical file/evidence data yields a higher or equal awarded_points than the final variant"
      - name: final
        when: "POST /accreditation/element-scores/{scoreId}/finalize"
        difference: "confirmed_gap_count uses actual adjudicated gaps; the same application data yields strictly lower awarded_points whenever at least one gap is confirmed"

  - name: resurvey_recovery
    trigger: "element score creation when the application has completed a RESURVEY survey (scoring_basis == RESURVEY)"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is pinned to break the apparent cycle
      # (recovery depends on closure rate which depends on CAP state which the resurvey itself changes):
      #   1. At RESURVEY survey CONFIRM time: freeze closure_rate = round(VERIFIED CAPs / total CAPs, 4)
      #      AND snapshot, per CAP element, awarded_at_freeze / forfeited_at_freeze from the then-FINAL scores.
      #   2. At RESURVEY survey COMPLETE time: those FINAL scores are VOIDED.
      #   3. At rescore (POST element-scores), for an element with a CAP and a frozen snapshot:
      #        recovery = round(survey.frozen_cap_closure_rate * forfeited_at_freeze, 2)
      #        provisional awarded_points = min(max_points, awarded_at_freeze + recovery)
      #      Later CAP verifications (after confirm) do NOT change the frozen rate.
      #   4. For elements without a CAP, the ordinary element_score formula applies unchanged.
    input_set: "CAPs of the application; the RESURVEY survey's frozen_cap_closure_rate; frozen score snapshots taken at confirm time"
    precision: "2 decimals round_half_up"

  - name: composite_accreditation_score
    trigger: "accreditation decision (POST /accreditation/applications/{applicationId}/outcome) and revision (POST /accreditation/outcomes/{outcomeId}/revise)"
    algorithm: weighted_scoring
    formula: |
      # Rounding order is PINNED: per-category ratio rounded to 4 decimals first,
      # then weighted and summed unrounded, then scaled and combined with the bonus,
      # then the total rounded to 2 decimals. (Computing unrounded throughout and
      # rounding only at the end is the FORBIDDEN trap order.)
      for each cat in {UM, CR, MRR, QI}:
          awarded_sum = sum of awarded_points over FINAL, non-VOIDED ElementScores
                        of the application whose element.category == cat
          max_sum = sum of element.max_points over the same set
          ratio[cat] = round(awarded_sum / max_sum, 4)   # round_half_up; max_sum > 0 guaranteed because decide requires every edition element scored
          weighted[cat] = ratio[cat] * WEIGHT[cat]        # unrounded
      base = sum of weighted[cat]                          # unrounded
      # measure bonus: component rounding pinned — round each component to 2 decimals
      # round_half_up BEFORE summing (sum-then-round is the FORBIDDEN trap order).
      reportable = QualityMeasureResults of the application's product_line_scope with
                   is_reportable == true AND measurement_year == year(review_period_end)
      avg_pct = mean of percentile over reportable (unrounded; 0 when the set is empty)
      quality_component = round(avg_pct / 100 * 2.0, 2)
      consumer = ConsumerSurveyScores of the application's product_line_scope with
                 survey_year == year(review_period_end)
      avg_consumer = mean of composite_score over consumer (unrounded; 0 when the set is empty)
      consumer_component = round(avg_consumer / 100 * 2.0, 2)
      measure_bonus = quality_component + consumer_component   # exact sum of rounded components
      composite_score = round(base * 100 + measure_bonus, 2)   # round_half_up; NO cap
    input_set: "FINAL non-VOIDED ElementScores of the application; reportable QualityMeasureResults and ConsumerSurveyScores of the application's product_line_scope whose year equals year(review_period_end)"
    constants:
      WEIGHT_UM: 0.30
      WEIGHT_CR: 0.30
      WEIGHT_MRR: 0.20
      WEIGHT_QI: 0.20
      QUALITY_BONUS_MAX: 2.0
      CONSUMER_BONUS_MAX: 2.0
    precision: "4-decimal category ratios, 2-decimal components, 2-decimal final; round_half_up everywhere"

  - name: accreditation_status_determination
    trigger: "accreditation decision and revision (same endpoints as composite_accreditation_score)"
    algorithm: threshold
    formula: |
      # Evaluation order is PINNED: the must-pass gate is evaluated BEFORE the
      # points thresholds. (The forbidden trap reading checks composite >= 90
      # first and would label a 90+ plan with a must-pass failure ACCREDITED.)
      must_pass_failure_count = count of FINAL non-VOIDED ElementScores where
          element.is_must_pass AND awarded_points < element.max_points / 2
      # Boundary: awarded == max_points/2 exactly is NOT a failure (strict <).
      if composite_score < 60.00 OR must_pass_failure_count >= 2:
          status = DENIED
      elif must_pass_failure_count >= 1:
          status = ACCREDITED_WITH_CAP      # gate-first: never ACCREDITED with any must-pass failure
      elif composite_score >= 90.00:
          status = ACCREDITED
      elif composite_score >= 75.00:
          status = ACCREDITED_WITH_CAP
      else:
          status = PROVISIONAL              # 60.00 <= composite < 75.00, zero must-pass failures
      # Threshold boundaries are inclusive: composite == 90.00 qualifies, == 75.00 qualifies,
      # == 60.00 escapes DENIED.
    input_set: "composite_accreditation_score output; FINAL non-VOIDED ElementScores of the application"
    constants:
      DENIED_FLOOR: 60.00
      FULL_THRESHOLD: 90.00
      CAP_THRESHOLD: 75.00
    precision: "2-decimal comparisons against the rounded composite_score"
    variants:
      - name: gate_first
        when: "the pinned, correct order"
        difference: "must-pass failures are checked before composite thresholds; composite 91.40 with 1 must-pass failure yields ACCREDITED_WITH_CAP"
      - name: points_first
        when: "the forbidden trap reading"
        difference: "composite thresholds checked first; the same data (91.40, 1 failure) would wrongly yield ACCREDITED"

  - name: public_display_window
    trigger: "outcome publish (POST /accreditation/outcomes/{outcomeId}/publish); is_publicly_displayed recomputed on every read"
    algorithm: chronological
    formula: |
      on publish:
          public_display_until = decided_at + 36 months (same day-of-month; month-end clamps to last day)
          published = true
          for every OTHER AccreditationOutcome linked (via its application) to the same
          product_line_scope with published == true:
              its is_publicly_displayed becomes false   # newer publication supersedes
      on read:
          is_publicly_displayed = published
              AND logical_clock <= public_display_until
              AND no other published outcome exists for the same product_line_scope
                  with later decided_at (tie-break on equal decided_at: higher decision_sequence wins)
    input_set: "All AccreditationOutcomes whose application's product_line_scope matches"
    precision: "datetimes compared to the second"

  - name: survey_minutes_reconciliation
    trigger: "survey session create / complete / cancel / reschedule"
    algorithm: aggregation
    formula: |
      scheduled_minutes = sum(duration_minutes) over sessions with status == SCHEDULED
      completed_minutes = sum(duration_minutes) over sessions with status == COMPLETED
      cancelled_minutes = sum(duration_minutes) over sessions with status == CANCELLED
      active_minutes    = scheduled_minutes + completed_minutes
      # Conserved quantity across the (cancel session, schedule replacement) pair:
      # active_minutes is unchanged once a replacement of equal duration is scheduled.
    input_set: "All SurveySessions of the survey"
    precision: "integer minutes"

  - name: annual_report_due_date
    trigger: "annual report creation and submission"
    algorithm: threshold
    formula: |
      due_date = (reporting_year + 1)-03-31T23:59:59Z   # fixed, stored at creation
      on submit: is_late = (logical_clock > due_date)
      Boundary: submitted_at == due_date exactly is NOT late (<=).
    input_set: "The report row and the logical clock"
    precision: "second precision"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present; X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role must be listed in the endpoint's roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    check: "Ownership scope: PlanCoordinator's X-User-ID must equal the owning HealthPlan id of the targeted resource; Surveyor's X-User-ID must equal the target session's surveyor_id on session complete/question log"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "plan-scoped PlanCoordinator endpoints; Surveyor session/question endpoints"

  - priority: 4
    category: existence
    check: "Path ids must exist, validated left-to-right; entity-specific 404 per segment"
    error_id: "ERR_HEALTH_PLAN_NOT_FOUND | ERR_PRODUCT_LINE_SCOPE_NOT_FOUND | ERR_STANDARDS_EDITION_NOT_FOUND | ERR_STANDARD_ELEMENT_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_EVIDENCE_ITEM_NOT_FOUND | ERR_FILE_REVIEW_SAMPLE_NOT_FOUND | ERR_FILE_REVIEW_CASE_NOT_FOUND | ERR_SURVEY_NOT_FOUND | ERR_SURVEY_SESSION_NOT_FOUND | ERR_SURVEYOR_NOT_FOUND | ERR_SURVEYOR_QUESTION_NOT_FOUND | ERR_ELEMENT_SCORE_NOT_FOUND | ERR_CORRECTIVE_ACTION_PLAN_NOT_FOUND | ERR_ACCREDITATION_OUTCOME_NOT_FOUND | ERR_ANNUAL_REPORT_NOT_FOUND | ERR_QUALITY_MEASURE_RESULT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 5
    category: existence
    check: "Request shape: required fields present, types correct, enum values in the declared set, string length and numeric range constraints met"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 6
    category: state
    check: "OCC: expected_application_version (when the endpoint declares it) must equal the application's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /accreditation/applications/{id}/submit, POST /accreditation/applications/{id}/evidence-items, POST /accreditation/applications/{id}/surveys"

  - priority: 7
    category: state
    check: "State-machine preconditions of the target resource (application/edition/sample/survey/session/score/CAP/report/evidence state gates per §1.2)"
    error_id: "ERR_APPLICATION_INVALID_STATE | ERR_PLAN_NOT_ACTIVE | ERR_EDITION_NOT_PUBLISHED | ERR_EDITION_NOT_SUPERSEDABLE | ERR_EDITION_HAS_NO_ELEMENTS | ERR_EVIDENCE_NOT_REVIEWABLE | ERR_EVIDENCE_NOT_RESUBMITTABLE | ERR_SAMPLE_NOT_OPEN | ERR_SAMPLE_NOT_SUBMITTED | ERR_SURVEY_INVALID_STATE | ERR_SESSION_INVALID_STATE | ERR_SCORE_NOT_PROVISIONAL | ERR_CAP_INVALID_STATE | ERR_REPORT_INVALID_STATE | ERR_QUESTION_ALREADY_ADJUDICATED"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: business_safety
    check: "RESURVEY confirm: no CAP of the application is in EVIDENCE_SUBMITTED status (pending officer review), and no CAP is overdue (is_overdue == true)"
    error_id: "ERR_CAP_REVIEW_PENDING | ERR_CAP_OVERDUE"
    http_status: 422
    applies_to: "POST /accreditation/surveys/{surveyId}/confirm (RESURVEY)"

  - priority: 9
    category: business_referential
    check: "Cross-entity integrity: product_line_scope must belong to the path's health plan; evidence/score/question/CAP element ids must belong to the application's standards edition; surveyor must exist and be active"
    error_id: "ERR_SCOPE_PLAN_MISMATCH | ERR_ELEMENT_EDITION_MISMATCH"
    http_status: 422
    applies_to: "POST applications, POST evidence-items, POST element-scores, POST questions, POST corrective-action-plans"

  - priority: 10
    category: business_temporal
    check: "Windows and overlaps: review_period_start < review_period_end; survey start_date <= end_date; session within survey window; case service_date within review period; surveyor half-open session overlap; survey closed date-range overlap; one on-site session per date per survey"
    error_id: "ERR_REVIEW_PERIOD_INVALID | ERR_SURVEY_WINDOW_INVALID | ERR_SESSION_OUTSIDE_SURVEY_WINDOW | ERR_CASE_OUTSIDE_REVIEW_PERIOD | ERR_SURVEYOR_SESSION_OVERLAP | ERR_SURVEY_DATE_OVERLAP | ERR_ONSITE_SAME_DATE_CONFLICT"
    http_status: 422
    applies_to: "POST applications, POST surveys, POST sessions, POST reschedule, POST cases, POST survey confirm"
    note: "ERR_SURVEYOR_SESSION_OVERLAP, ERR_SURVEY_DATE_OVERLAP and ERR_ONSITE_SAME_DATE_CONFLICT return 409 instead of 422"

  - priority: 11
    category: business_constraint
    check: "Uniqueness and cardinality: plan_code unique; edition_year unique; (plan, product_line) unique; (edition, element_code) unique; no duplicate active application per (scope, edition); one non-VOIDED ElementScore per (application, element); one non-VOIDED CAP per (application, element); one outcome per application; (scope, measure_code, measurement_year) unique; (application, reporting_year) unique; required_turnaround_days >= 1; edition must have >= 1 element at publish; survey confirm requires >= 1 SCHEDULED session; evidence completeness at advance; all elements FINAL at decide; no open gap questions at finalize; all sessions finished at survey complete"
    error_id: "ERR_PLAN_CODE_DUPLICATE | ERR_EDITION_YEAR_DUPLICATE | ERR_PRODUCT_LINE_DUPLICATE | ERR_ELEMENT_CODE_DUPLICATE | ERR_DUPLICATE_ACTIVE_APPLICATION | ERR_ELEMENT_SCORE_EXISTS | ERR_CAP_EXISTS | ERR_OUTCOME_ALREADY_EXISTS | ERR_MEASURE_RESULT_DUPLICATE | ERR_ANNUAL_REPORT_DUPLICATE | ERR_INVALID_TURNAROUND_DAYS | ERR_NO_SCHEDULED_SESSIONS | ERR_EVIDENCE_COMPLETENESS_UNMET | ERR_ELEMENT_SCORES_INCOMPLETE | ERR_OPEN_GAP_QUESTIONS_REMAIN | ERR_SESSIONS_NOT_FINISHED | ERR_SAMPLE_INCOMPLETE | ERR_ACTIVE_APPLICATIONS_EXIST"
    http_status: 409
    applies_to: "create endpoints and gated transitions"
    note: "ERR_EVIDENCE_COMPLETENESS_UNMET, ERR_ELEMENT_SCORES_INCOMPLETE, ERR_OPEN_GAP_QUESTIONS_REMAIN, ERR_SAMPLE_INCOMPLETE and ERR_INVALID_TURNAROUND_DAYS return 422 instead of 409"

  - priority: 12
    category: business_fiscal
    check: "Sample quota: FileReviewSample.required_size must be >= owning edition.min_file_sample_per_category at creation"
    error_id: ERR_SAMPLE_SIZE_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /accreditation/applications/{applicationId}/file-review-samples"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/accreditation/_clock/set_current_utc"
    description: "Set the logical clock. Before any call to this endpoint the clock reads exactly 2026-09-01T00:00:00Z (the server startup default) and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["recompute is_overdue on all non-VERIFIED CAPs; recompute is_publicly_displayed on published outcomes"]

  # --- standards editions & elements ---
  - method: POST
    path: "/accreditation/standards-editions"
    description: "Create a StandardsEdition (DRAFT)"
    roles: [PlatformAdmin]
    code: 201
    input: [edition_year, effective_from, effective_until, min_file_sample_per_category, timeliness_threshold]
    output: StandardsEdition
    side_effects: []
  - method: GET
    path: "/accreditation/standards-editions"
    description: "List standards editions (paginated)"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "StandardsEdition[]"
    side_effects: []
  - method: GET
    path: "/accreditation/standards-editions/{editionId}"
    description: "Get a standards edition"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: []
    output: StandardsEdition
    side_effects: []
  - method: POST
    path: "/accreditation/standards-editions/{editionId}/publish"
    description: "Publish a DRAFT edition (requires >= 1 element)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: StandardsEdition
    side_effects: ["status -> PUBLISHED; increments StandardsEdition.version by 1"]
  - method: POST
    path: "/accreditation/standards-editions/{editionId}/supersede"
    description: "Supersede a PUBLISHED edition by another PUBLISHED edition"
    roles: [PlatformAdmin]
    code: 200
    input: [superseded_by_edition_id]
    output: StandardsEdition
    side_effects:
      - "status -> SUPERSEDED; increments StandardsEdition.version by 1"
      - "DRAFT applications on this edition -> WITHDRAWN (cascade); their SUBMITTED EvidenceItems -> VOIDED"
  - method: POST
    path: "/accreditation/standards-editions/{editionId}/standard-elements"
    description: "Add a StandardElement to an edition (edition must be DRAFT)"
    roles: [PlatformAdmin]
    code: 201
    input: [element_code, category, max_points, is_must_pass, evidence_required_count]
    output: StandardElement
    side_effects: []
  - method: GET
    path: "/accreditation/standards-editions/{editionId}/standard-elements"
    description: "List elements of an edition"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "StandardElement[]"
    side_effects: []
  - method: GET
    path: "/accreditation/standard-elements/{elementId}"
    description: "Get a standard element"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: []
    output: StandardElement
    side_effects: []

  # --- health plans & scopes ---
  - method: POST
    path: "/accreditation/health-plans"
    description: "Create a HealthPlan (ACTIVE)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, plan_code]
    output: HealthPlan
    side_effects: []
  - method: GET
    path: "/accreditation/health-plans"
    description: "List health plans (paginated)"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "HealthPlan[]"
    side_effects: []
  - method: GET
    path: "/accreditation/health-plans/{planId}"
    description: "Get a health plan"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: []
    output: HealthPlan
    side_effects: []
  - method: POST
    path: "/accreditation/health-plans/{planId}/retire"
    description: "Retire a plan; blocked while any application is non-terminal"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: HealthPlan
    side_effects: ["status -> RETIRED; increments HealthPlan.version by 1"]
  - method: POST
    path: "/accreditation/health-plans/{planId}/product-line-scopes"
    description: "Create a product line scope for a plan"
    roles: [PlanCoordinator]
    code: 201
    input: [product_line, state_codes, member_count]
    output: ProductLineScope
    side_effects: []
  - method: GET
    path: "/accreditation/health-plans/{planId}/product-line-scopes"
    description: "List scopes of a plan"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "ProductLineScope[]"
    side_effects: []
  - method: GET
    path: "/accreditation/product-line-scopes/{scopeId}"
    description: "Get a product line scope"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: []
    output: ProductLineScope
    side_effects: []

  # --- surveyors ---
  - method: POST
    path: "/accreditation/surveyors"
    description: "Register a surveyor"
    roles: [PlatformAdmin]
    code: 201
    input: [name, credential_level]
    output: Surveyor
    side_effects: []
  - method: GET
    path: "/accreditation/surveyors"
    description: "List surveyors (paginated)"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Surveyor[]"
    side_effects: []
  - method: GET
    path: "/accreditation/surveyors/{surveyorId}"
    description: "Get a surveyor"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: []
    output: Surveyor
    side_effects: []
  - method: GET
    path: "/accreditation/surveyors/{surveyorId}/sessions"
    description: "List all sessions assigned to a surveyor"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "SurveySession[]"
    side_effects: []

  # --- applications ---
  - method: POST
    path: "/accreditation/health-plans/{planId}/applications"
    description: "Create an accreditation application (DRAFT)"
    roles: [PlanCoordinator]
    code: 201
    input: [product_line_scope_id, standards_edition_id, review_period_start, review_period_end]
    output: AccreditationApplication
    side_effects: []
  - method: GET
    path: "/accreditation/health-plans/{planId}/applications"
    description: "List applications of a plan"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "AccreditationApplication[]"
    side_effects: []
  - method: GET
    path: "/accreditation/applications"
    description: "List applications with optional filters"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["health_plan_id?", "product_line_scope_id?", "standards_edition_id?", "status?", "limit?", "offset?"]
    output: "AccreditationApplication[]"
    side_effects: []
  - method: GET
    path: "/accreditation/applications/{applicationId}"
    description: "Get an application"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: []
    output: AccreditationApplication
    side_effects: []
  - method: POST
    path: "/accreditation/applications/{applicationId}/submit"
    description: "Submit a DRAFT application (OCC-guarded)"
    roles: [PlanCoordinator]
    code: 200
    input: [expected_application_version]
    output: AccreditationApplication
    side_effects: ["status -> SUBMITTED; increments AccreditationApplication.version by 1"]
  - method: POST
    path: "/accreditation/applications/{applicationId}/begin-evidence-review"
    description: "Move a SUBMITTED application into evidence review"
    roles: [AccreditationOfficer]
    code: 200
    input: []
    output: AccreditationApplication
    side_effects: ["status -> EVIDENCE_REVIEW; increments AccreditationApplication.version by 1"]
  - method: POST
    path: "/accreditation/applications/{applicationId}/advance-to-survey-scheduling"
    description: "Move to survey scheduling once evidence completeness holds"
    roles: [AccreditationOfficer]
    code: 200
    input: []
    output: AccreditationApplication
    side_effects: ["status -> SURVEY_SCHEDULING; increments AccreditationApplication.version by 1"]
  - method: POST
    path: "/accreditation/applications/{applicationId}/withdraw"
    description: "Withdraw a DRAFT or SUBMITTED application"
    roles: [PlanCoordinator]
    code: 200
    input: []
    output: AccreditationApplication
    side_effects: ["status -> WITHDRAWN; SUBMITTED EvidenceItems -> VOIDED; increments AccreditationApplication.version by 1"]

  # --- evidence items ---
  - method: POST
    path: "/accreditation/applications/{applicationId}/evidence-items"
    description: "Add an evidence item (application must be SUBMITTED or EVIDENCE_REVIEW; OCC-guarded)"
    roles: [PlanCoordinator]
    code: 201
    input: [standard_element_id, title, expected_application_version]
    output: EvidenceItem
    side_effects: ["increments AccreditationApplication.version by 1"]
  - method: GET
    path: "/accreditation/applications/{applicationId}/evidence-items"
    description: "List evidence items of an application"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "EvidenceItem[]"
    side_effects: []
  - method: GET
    path: "/accreditation/evidence-items"
    description: "List evidence items with optional element filter"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["standard_element_id?", "application_id?", "limit?", "offset?"]
    output: "EvidenceItem[]"
    side_effects: []
  - method: GET
    path: "/accreditation/evidence-items/{evidenceItemId}"
    description: "Get an evidence item"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: []
    output: EvidenceItem
    side_effects: []
  - method: POST
    path: "/accreditation/evidence-items/{evidenceItemId}/accept"
    description: "Accept a SUBMITTED evidence item"
    roles: [AccreditationOfficer]
    code: 200
    input: ["review_note?"]
    output: EvidenceItem
    side_effects: ["status -> ACCEPTED; review_note recorded"]
  - method: POST
    path: "/accreditation/evidence-items/{evidenceItemId}/reject"
    description: "Reject a SUBMITTED evidence item"
    roles: [AccreditationOfficer]
    code: 200
    input: [review_note]
    output: EvidenceItem
    side_effects: ["status -> REJECTED; review_note recorded"]
  - method: POST
    path: "/accreditation/evidence-items/{evidenceItemId}/resubmit"
    description: "Resubmit a REJECTED evidence item (cycle back to SUBMITTED)"
    roles: [PlanCoordinator]
    code: 200
    input: ["title?"]
    output: EvidenceItem
    side_effects: ["status -> SUBMITTED; revision_count += 1; review_note reset to null"]

  # --- file review samples & cases ---
  - method: POST
    path: "/accreditation/applications/{applicationId}/file-review-samples"
    description: "Create a file review sample (application must be EVIDENCE_REVIEW or SURVEY_SCHEDULING)"
    roles: [AccreditationOfficer]
    code: 201
    input: [sample_type, required_size, timeliness_basis]
    output: FileReviewSample
    side_effects: ["category derived from sample_type"]
  - method: GET
    path: "/accreditation/applications/{applicationId}/file-review-samples"
    description: "List file review samples of an application"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "FileReviewSample[]"
    side_effects: []
  - method: GET
    path: "/accreditation/file-review-samples/{sampleId}"
    description: "Get a file review sample"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: []
    output: FileReviewSample
    side_effects: []
  - method: POST
    path: "/accreditation/file-review-samples/{sampleId}/cases"
    description: "Add a case to an OPEN sample (sample must be OPEN and the owning application must be in EVIDENCE_REVIEW or SURVEY_SCHEDULING)"
    roles: [PlanCoordinator]
    code: 201
    input: [case_reference, service_date, decision_date, resolution_date, required_turnaround_days]
    output: FileReviewCase
    side_effects: []
  - method: GET
    path: "/accreditation/file-review-samples/{sampleId}/cases"
    description: "List cases of a sample (ordered by created_at ASC)"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "FileReviewCase[]"
    side_effects: []
  - method: GET
    path: "/accreditation/file-review-cases/{caseId}"
    description: "Get a file review case"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: []
    output: FileReviewCase
    side_effects: []
  - method: POST
    path: "/accreditation/file-review-samples/{sampleId}/submit"
    description: "Submit an OPEN sample whose case count >= required_size"
    roles: [PlanCoordinator]
    code: 200
    input: []
    output: FileReviewSample
    side_effects: ["status -> SUBMITTED"]
  - method: POST
    path: "/accreditation/file-review-samples/{sampleId}/score"
    description: "Score a SUBMITTED sample; computes timeliness fields"
    roles: [AccreditationOfficer]
    code: 200
    input: []
    output: FileReviewSample
    side_effects: ["status -> SCORED; recompute case is_timely/days_to_basis; set timely_case_count, timeliness_rate, must_pass_threshold_breached"]

  # --- surveys & sessions ---
  - method: POST
    path: "/accreditation/applications/{applicationId}/surveys"
    description: "Create a survey (PLANNED; OCC-guarded). FULL requires application SURVEY_SCHEDULING; RESURVEY requires CORRECTIVE_ACTION."
    roles: [AccreditationOfficer]
    code: 201
    input: [survey_type, mode, start_date, end_date, budgeted_surveyor_hours, expected_application_version]
    output: Survey
    side_effects: ["increments AccreditationApplication.version by 1"]
  - method: GET
    path: "/accreditation/applications/{applicationId}/surveys"
    description: "List surveys of an application"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Survey[]"
    side_effects: []
  - method: GET
    path: "/accreditation/surveys/{surveyId}"
    description: "Get a survey"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: []
    output: Survey
    side_effects: []
  - method: POST
    path: "/accreditation/surveys/{surveyId}/confirm"
    description: "Confirm a PLANNED survey; freezes CAP closure rate for RESURVEY"
    roles: [AccreditationOfficer]
    code: 200
    input: []
    output: Survey
    side_effects: ["status -> CONFIRMED; application SURVEY_SCHEDULING -> SURVEY_IN_PROGRESS (FULL) or CORRECTIVE_ACTION -> RESURVEY_IN_PROGRESS (RESURVEY); RESURVEY freezes frozen_cap_closure_rate and per-CAP-element score snapshots"]
  - method: POST
    path: "/accreditation/surveys/{surveyId}/complete"
    description: "Complete a CONFIRMED survey once all sessions are finished"
    roles: [AccreditationOfficer]
    code: 200
    input: []
    output: Survey
    side_effects: ["status -> COMPLETED; application -> SCORING; RESURVEY additionally voids FINAL ElementScores of CAP elements"]
  - method: POST
    path: "/accreditation/surveys/{surveyId}/cancel"
    description: "Cancel a PLANNED or CONFIRMED survey"
    roles: [AccreditationOfficer]
    code: 200
    input: []
    output: Survey
    side_effects: ["status -> CANCELLED; SCHEDULED sessions -> CANCELLED"]
  - method: POST
    path: "/accreditation/surveys/{surveyId}/sessions"
    description: "Schedule a session (survey must be PLANNED or CONFIRMED)"
    roles: [AccreditationOfficer]
    code: 201
    input: [surveyor_id, session_date, start_minute, end_minute, is_onsite]
    output: SurveySession
    side_effects: ["survey scheduled_minutes/active_minutes recomputed"]
  - method: GET
    path: "/accreditation/surveys/{surveyId}/sessions"
    description: "List sessions of a survey"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "SurveySession[]"
    side_effects: []
  - method: GET
    path: "/accreditation/survey-sessions/{sessionId}"
    description: "Get a survey session"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: []
    output: SurveySession
    side_effects: []
  - method: POST
    path: "/accreditation/survey-sessions/{sessionId}/complete"
    description: "Surveyor completes their own session"
    roles: [Surveyor]
    code: 200
    input: []
    output: SurveySession
    side_effects: ["status -> COMPLETED; survey completed_minutes/active_minutes recomputed"]
  - method: POST
    path: "/accreditation/survey-sessions/{sessionId}/cancel"
    description: "Cancel a SCHEDULED session"
    roles: [AccreditationOfficer]
    code: 200
    input: []
    output: SurveySession
    side_effects: ["status -> CANCELLED; survey minutes recomputed"]
  - method: POST
    path: "/accreditation/survey-sessions/{sessionId}/reschedule"
    description: "Reschedule a SCHEDULED session (self-loop)"
    roles: [AccreditationOfficer]
    code: 200
    input: [session_date, start_minute, end_minute]
    output: SurveySession
    side_effects: ["times replaced; duration_minutes and survey minutes recomputed"]

  # --- surveyor questions ---
  - method: POST
    path: "/accreditation/survey-sessions/{sessionId}/questions"
    description: "Log a surveyor question on a session of a CONFIRMED survey"
    roles: [Surveyor]
    code: 201
    input: [standard_element_id, question_text, raises_gap]
    output: SurveyorQuestion
    side_effects: []
  - method: GET
    path: "/accreditation/survey-sessions/{sessionId}/questions"
    description: "List questions of a session"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "SurveyorQuestion[]"
    side_effects: []
  - method: GET
    path: "/accreditation/surveyor-questions"
    description: "List questions with optional element filter"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["standard_element_id?", "survey_session_id?", "limit?", "offset?"]
    output: "SurveyorQuestion[]"
    side_effects: []
  - method: GET
    path: "/accreditation/surveyor-questions/{questionId}"
    description: "Get a surveyor question"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: []
    output: SurveyorQuestion
    side_effects: []
  - method: POST
    path: "/accreditation/surveyor-questions/{questionId}/adjudicate"
    description: "Adjudicate a LOGGED question"
    roles: [AccreditationOfficer]
    code: 200
    input: [gap_confirmed]
    output: SurveyorQuestion
    side_effects: ["status -> ADJUDICATED; gap_confirmed set"]

  # --- element scores ---
  - method: POST
    path: "/accreditation/applications/{applicationId}/element-scores"
    description: "Create a PROVISIONAL element score (application must be EVIDENCE_REVIEW, SURVEY_SCHEDULING, SURVEY_IN_PROGRESS, SCORING, or RESURVEY_IN_PROGRESS)"
    roles: [AccreditationOfficer]
    code: 201
    input: [standard_element_id]
    output: ElementScore
    side_effects: ["provisional variant of calculations.element_score (or calculations.resurvey_recovery when scoring_basis == RESURVEY); gap_count_used = 0"]
  - method: GET
    path: "/accreditation/applications/{applicationId}/element-scores"
    description: "List element scores of an application"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "ElementScore[]"
    side_effects: []
  - method: GET
    path: "/accreditation/element-scores"
    description: "List element scores with optional element filter"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["standard_element_id?", "application_id?", "limit?", "offset?"]
    output: "ElementScore[]"
    side_effects: []
  - method: GET
    path: "/accreditation/element-scores/{scoreId}"
    description: "Get an element score"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: []
    output: ElementScore
    side_effects: []
  - method: POST
    path: "/accreditation/element-scores/{scoreId}/finalize"
    description: "Finalize a PROVISIONAL score (application must be SCORING)"
    roles: [AccreditationOfficer]
    code: 200
    input: []
    output: ElementScore
    side_effects: ["status -> FINAL; FINAL variant recompute including confirmed gap deductions; application total_awarded_points/total_forfeited_points recomputed"]
  - method: POST
    path: "/accreditation/element-scores/{scoreId}/void"
    description: "Void a PROVISIONAL score"
    roles: [AccreditationOfficer]
    code: 200
    input: []
    output: ElementScore
    side_effects: ["status -> VOIDED"]

  # --- quality measures & consumer survey scores ---
  - method: POST
    path: "/accreditation/product-line-scopes/{scopeId}/quality-measure-results"
    description: "Record a quality measure result for a scope"
    roles: [PlanCoordinator]
    code: 201
    input: [measure_code, measurement_year, percentile, is_reportable]
    output: QualityMeasureResult
    side_effects: []
  - method: GET
    path: "/accreditation/product-line-scopes/{scopeId}/quality-measure-results"
    description: "List quality measure results of a scope"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "QualityMeasureResult[]"
    side_effects: []
  - method: GET
    path: "/accreditation/quality-measure-results/{resultId}"
    description: "Get a quality measure result"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: []
    output: QualityMeasureResult
    side_effects: []
  - method: POST
    path: "/accreditation/product-line-scopes/{scopeId}/consumer-survey-scores"
    description: "Record a consumer survey composite score for a scope"
    roles: [PlanCoordinator]
    code: 201
    input: [survey_year, composite_score, response_count]
    output: ConsumerSurveyScore
    side_effects: []
  - method: GET
    path: "/accreditation/product-line-scopes/{scopeId}/consumer-survey-scores"
    description: "List consumer survey scores of a scope"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "ConsumerSurveyScore[]"
    side_effects: []

  - method: GET
    path: "/accreditation/consumer-survey-scores/{consumerSurveyScoreId}"
    description: "Get a consumer survey score"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: []
    output: ConsumerSurveyScore
    side_effects: []

  # --- corrective action plans ---
  - method: POST
    path: "/accreditation/applications/{applicationId}/corrective-action-plans"
    description: "Manually create a CAP (application must be DECIDED or CORRECTIVE_ACTION)"
    roles: [AccreditationOfficer]
    code: 201
    input: [standard_element_id, gap_description, due_date]
    output: CorrectiveActionPlan
    side_effects: ["origin = MANUAL"]
  - method: GET
    path: "/accreditation/applications/{applicationId}/corrective-action-plans"
    description: "List CAPs of an application"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "CorrectiveActionPlan[]"
    side_effects: []
  - method: GET
    path: "/accreditation/corrective-action-plans"
    description: "List CAPs with optional element filter"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["standard_element_id?", "application_id?", "limit?", "offset?"]
    output: "CorrectiveActionPlan[]"
    side_effects: []
  - method: GET
    path: "/accreditation/corrective-action-plans/{capId}"
    description: "Get a CAP"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: []
    output: CorrectiveActionPlan
    side_effects: []
  - method: POST
    path: "/accreditation/corrective-action-plans/{capId}/submit-evidence"
    description: "Plan submits CAP remediation evidence"
    roles: [PlanCoordinator]
    code: 200
    input: [evidence_summary]
    output: CorrectiveActionPlan
    side_effects: ["status -> EVIDENCE_SUBMITTED"]
  - method: POST
    path: "/accreditation/corrective-action-plans/{capId}/verify"
    description: "Officer verifies (approved=true) or rejects (approved=false) CAP evidence"
    roles: [AccreditationOfficer]
    code: 200
    input: [approved]
    output: CorrectiveActionPlan
    side_effects: ["status -> VERIFIED (approved) or OPEN (rejected)"]

  # --- outcomes & public display ---
  - method: POST
    path: "/accreditation/applications/{applicationId}/outcome"
    description: "Decide the accreditation outcome (application must be SCORING; all elements FINAL; all samples SCORED); exactly one outcome per application"
    roles: [AccreditationOfficer]
    code: 201
    input: []
    output: AccreditationOutcome
    side_effects:
      - "compute composite_score, measure_bonus, must_pass_failure_count, status per calculations"
      - "application SCORING -> DECIDED, then immediately DECIDED -> CORRECTIVE_ACTION or CLOSED"
      - "auto-create OPEN CAPs (origin AUTO, due_date = decided_at date + 90 days) for every element whose FINAL awarded_points < element.max_points AND (element.is_must_pass OR awarded_points == 0) AND no non-VOIDED CAP already exists for that (application, element)"
  - method: GET
    path: "/accreditation/applications/{applicationId}/outcome"
    description: "Get the application's outcome (array of length 0 or 1)"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: []
    output: "AccreditationOutcome[]"
    side_effects: []
  - method: GET
    path: "/accreditation/outcomes/{outcomeId}"
    description: "Get an outcome"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: []
    output: AccreditationOutcome
    side_effects: []
  - method: POST
    path: "/accreditation/outcomes/{outcomeId}/revise"
    description: "Re-decide after resurvey (application must be SCORING again); increments decision_sequence"
    roles: [AccreditationOfficer]
    code: 200
    input: []
    output: AccreditationOutcome
    side_effects:
      - "recompute composite_score, measure_bonus, must_pass_failure_count, status; decided_at refreshed; decision_sequence += 1"
      - "same post-decision CAP auto-creation and application re-evaluation as initial decide"
  - method: POST
    path: "/accreditation/outcomes/{outcomeId}/publish"
    description: "Publish the outcome for public display"
    roles: [AccreditationOfficer]
    code: 200
    input: []
    output: AccreditationOutcome
    side_effects: ["published = true; public_display_until = decided_at + 36 months; previously published outcomes for the same product_line_scope lose is_publicly_displayed"]
  - method: GET
    path: "/accreditation/public/plans/{planId}/accreditation-status"
    description: "Public display view: per-scope current publicly displayed accreditation status"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: []
    output: "{ plan_id: string, plan_name: string, scopes: array }"
    side_effects: []

  # --- annual reports ---
  - method: POST
    path: "/accreditation/applications/{applicationId}/annual-reports"
    description: "Create an annual report (application must be CLOSED or CORRECTIVE_ACTION with a decided outcome whose status is ACCREDITED or ACCREDITED_WITH_CAP)"
    roles: [PlanCoordinator]
    code: 201
    input: [reporting_year, attestation]
    output: AnnualReport
    side_effects: ["due_date computed as (reporting_year + 1)-03-31T23:59:59Z"]
  - method: GET
    path: "/accreditation/applications/{applicationId}/annual-reports"
    description: "List annual reports of an application"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "AnnualReport[]"
    side_effects: []
  - method: GET
    path: "/accreditation/annual-reports/{reportId}"
    description: "Get an annual report"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: []
    output: AnnualReport
    side_effects: []
  - method: POST
    path: "/accreditation/annual-reports/{reportId}/submit"
    description: "Submit a DRAFT report; becomes SUBMITTED or LATE depending on the logical clock vs due_date"
    roles: [PlanCoordinator]
    code: 200
    input: []
    output: AnnualReport
    side_effects: ["status -> SUBMITTED or LATE; is_late set"]
  - method: POST
    path: "/accreditation/annual-reports/{reportId}/review"
    description: "Officer accepts or returns a SUBMITTED/LATE report"
    roles: [AccreditationOfficer]
    code: 200
    input: [accepted]
    output: AnnualReport
    side_effects: ["status -> ACCEPTED or RETURNED"]
  - method: POST
    path: "/accreditation/annual-reports/{reportId}/reopen"
    description: "Reopen a RETURNED report into DRAFT"
    roles: [PlanCoordinator]
    code: 200
    input: []
    output: AnnualReport
    side_effects: ["status -> DRAFT; is_late reset to false"]

  # --- reverse-reachability additions (FK check f) ---
  - method: GET
    path: "/accreditation/product-line-scopes"
    description: "List product line scopes with optional plan filter"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["health_plan_id?", "limit?", "offset?"]
    output: "ProductLineScope[]"
    side_effects: []
  - method: GET
    path: "/accreditation/standard-elements"
    description: "List standard elements with optional edition filter"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["standards_edition_id?", "limit?", "offset?"]
    output: "StandardElement[]"
    side_effects: []
  - method: GET
    path: "/accreditation/file-review-samples"
    description: "List file review samples with optional application filter"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["application_id?", "limit?", "offset?"]
    output: "FileReviewSample[]"
    side_effects: []
  - method: GET
    path: "/accreditation/file-review-cases"
    description: "List file review cases with optional sample filter"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["file_review_sample_id?", "limit?", "offset?"]
    output: "FileReviewCase[]"
    side_effects: []
  - method: GET
    path: "/accreditation/surveys"
    description: "List surveys with optional application filter"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["application_id?", "limit?", "offset?"]
    output: "Survey[]"
    side_effects: []
  - method: GET
    path: "/accreditation/survey-sessions"
    description: "List survey sessions with optional surveyor filter"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["surveyor_id?", "survey_id?", "limit?", "offset?"]
    output: "SurveySession[]"
    side_effects: []
  - method: GET
    path: "/accreditation/quality-measure-results"
    description: "List quality measure results with optional scope filter"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["product_line_scope_id?", "limit?", "offset?"]
    output: "QualityMeasureResult[]"
    side_effects: []
  - method: GET
    path: "/accreditation/consumer-survey-scores"
    description: "List consumer survey scores with optional scope filter"
    roles: [PlatformAdmin, PlanCoordinator, AccreditationOfficer, Surveyor, PublicViewer]
    code: 200
    input: ["product_line_scope_id?", "limit?", "offset?"]
    output: "ConsumerSurveyScore[]"
    side_effects: []
  - method: GET
    path: "/accreditation/outcomes"
    description: "List outcomes with optional application filter"
