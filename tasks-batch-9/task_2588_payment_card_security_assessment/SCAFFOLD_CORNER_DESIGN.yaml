      - name: rbac_role_denial_is_decided_before_any_business_gate
        claim_type: Role Denied
        grounds:
          - validations[priority=2]
          - validations[priority=13]
          - roles.PlatformAdmin
          - roles.Assessor
        distinguishing_aspect: "Priority 2 precedes every constraint check, so the platform operator concluding a requirement gets 403 ERR_UNAUTHORIZED rather than ERR_EVIDENCE_INCOMPLETE or ERR_SAMPLING_PLAN_STALE - both of which that request would also violate. Symmetrically, an assessor touching the operator-only assessor registry gets 403 even though the payload is perfectly valid."
        test_recipe:
          setup:
            - "Engagement 'Northwind Retail Inc' exists with requirement 1.2.1 in IN_TESTING, no evidence at all and no sampling plan - so a conclusion would fail two separate priority-13 rules."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Kim Vance", email: "kim.vance@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_legal_name: "Northwind Retail Inc", merchant_level: "L1", assessment_year: 2026, acquirer_name: "First Coast Bank", fieldwork_start_date: "2026-08-10", fieldwork_end_date: "2026-08-28", approved_budget_amount: 200000.00, lead_assessor_id: "${lead_id}", qa_reviewer_id: "${qa_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/requirement-assessments"
              payload: { requirement_ref: "1.2.1", requirement_family: "R1", testing_procedure_count: 3, applicability: "APPLICABLE" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { req_a_id: $.data.id }
            - call: "POST /requirement-assessments/${req_a_id}/start-testing"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
          trigger:
            - call: "POST /requirement-assessments/${req_a_id}/conclusion"
              payload: { conclusion: "IN_PLACE", conclusion_rationale: "Operator asserts the control is fine." }
              as: PlatformAdmin
              captures: { err_admin_conclusion: $.data.error_id }
            - call: "PATCH /assessors/${qa_id}"
              payload: { qa_qualified: false }
              as: Assessor
              as_user_id: "${lead_id}"
              captures: { err_assessor_patch: $.data.error_id }
            - call: "POST /engagements/${eng_id}/scope-lock"
              payload: {}
              as: PlatformAdmin
              captures: { err_admin_lock: $.data.error_id }
          assert:
            - "${err_admin_conclusion} == ERR_UNAUTHORIZED with HTTP 403 - not ERR_EVIDENCE_INCOMPLETE and not ERR_SAMPLING_PLAN_STALE"
            - "RequirementAssessment.${req_a_id}.test_status is still IN_TESTING and its version is unchanged"
            - "${err_assessor_patch} == ERR_UNAUTHORIZED with HTTP 403; Assessor.${qa_id}.qa_qualified is still true"
            - "${err_admin_lock} == ERR_UNAUTHORIZED with HTTP 403 - the operator opens engagements but does not run them, and the missing CDE segment is never reported"
            - "Engagement.${eng_id}.status is still SCOPING and scope_locked == false"

      - name: rbac_engagement_ownership_is_checked_after_the_role_list
        claim_type: hierarchical_override
        grounds:
          - validations[priority=6]
          - errors[ERR_NOT_ENGAGEMENT_LEAD]
          - roles.LeadAssessor
        distinguishing_aspect: "Holding the LeadAssessor role is not the same as leading this engagement: an assessor who leads a different engagement passes the priority-2 role check and is then refused at priority 6 with 403 ERR_NOT_ENGAGEMENT_LEAD. The ownership gate is declared per endpoint, so the same outsider may still add a segment to the engagement as an Assessor - data entry is shared, lifecycle authority is not."
