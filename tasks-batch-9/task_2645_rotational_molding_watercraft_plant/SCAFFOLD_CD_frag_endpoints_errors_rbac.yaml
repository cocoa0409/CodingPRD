              as_user_id: "planner-1"
          assert:
            - "all nine trigger calls return status 403 with data.error_id 'ERR_ROLE_NOT_PERMITTED'"
            - "the cycle create is refused because POST /molding-cycles is exclusive to MoldingOperator and appears in no ResinTechnician list, and GET /molding-cycles?production_order_id=${po} still returns total_count 1"
            - "the charge create is refused because POST /resin-charges is exclusive to ResinTechnician, and GET /resin-charges?molding_cycle_id=${cyc} still returns total_count 1"
            - "FinishedUnit.${fu1}.build_status is still 'SELLABLE' and FinishedUnit.${fu2}.build_status is still 'SELLABLE' — neither the trim nor the inspect denial changed a hull"
            - "ResinLot.${lot}.status is still 'AVAILABLE' and ResinLot.${lot}.version == ${lot_v10} after the quarantine denial: quarantine is exclusive to QualityInspector"
            - "FinishedUnit.${fu1}.logistics_status is still 'STORED' and Warehouse.${wh}.version == ${wh_v2} + 1 (unchanged by the release-storage denial), because store and release-storage are exclusive to LogisticsPlanner"
            - "GET /shipments returns total_count 0 — PlantAdmin cannot create a trailer even though it owns all reference data"
            - "GET /molds?product_model_id=${pm} returns total_count 1 — LogisticsPlanner cannot register a mould"
            - "the retire call on the nonexistent mould id returns 403 'ERR_ROLE_NOT_PERMITTED', NOT 404 'ERR_MOLD_NOT_FOUND': the role gate at priority 3 is evaluated before path-id resolution at priority 10"

      - name: rbac_warranty_adjudication_split_across_agent_admin_and_customer
        claim_type: "Cannot perform other roles' exclusive_operations"
        grounds:
