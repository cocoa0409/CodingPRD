          setup:
            - "Contract with monthly_case_cap 1."
            - "Two perfusionists hold covering PRIMARY_CALL slots [2026-08-01T00:00:00Z, 2026-08-05T00:00:00Z); the merged primary cover of 4320 minutes over the 72-hour horizon makes coverage_posture at least THIN, which admits ELECTIVE case creation."
