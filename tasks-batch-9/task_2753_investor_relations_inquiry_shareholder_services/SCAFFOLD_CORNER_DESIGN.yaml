            - "$.data.published_at == 2026-08-05T12:00:00.000Z and $.data.version == 2"
            - "$.data.is_guidance == false and $.data.withdrawal_reason == null"

      - name: guidance_publish_without_period_label_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Disclosure.DRAFT_to_PUBLISHED
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "The publish precondition for a GUIDANCE_UPDATE row requires metric, period_label, guidance_low and guidance_high all present: a row with metric EPS and a range but no period_label is refused with ERR_INVALID_REQUEST and stays DRAFT at version 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One company with a DRAFT GUIDANCE_UPDATE disclosure carrying metric EPS and a range but no period_label."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
