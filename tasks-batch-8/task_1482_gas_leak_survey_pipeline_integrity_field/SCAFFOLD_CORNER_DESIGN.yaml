              as: CalibrationTech
              as_user_id: "${ct_id}"
              captures: { err: $.data.error_id }
            - call: "GET /instruments/${instr_id}"
              payload: {}
              as: CalibrationTech
              as_user_id: "${ct_id}"
              captures: { instr_status: $.data.status }
          assert:
            - "err == ERR_CALIBRATION_DRIFT_EXCEEDED"
            - "instr_status == OUT_OF_CALIBRATION (no reactivation on FAIL)"

