      - name: escalation_safety_error_precedes_sanction_window_temporal_error
        grounds:
          - validations[priority=46]
          - validations[priority=48]
          - entities.Consultant.fields.highest_sanction_order
          - entities.ComplianceCase.fields.sanction_order
        distinguishing_aspect: |
          Error-category pair business_safety (422) vs business_temporal (409), a different
          pair from the state/business_fiscal instance: a second PROBATION request whose window
          also overlaps the first sanction returns ERR_DISCIPLINARY_ESCALATION_REQUIRED, and
          only after the level is raised to SUSPENSION does the same overlapping window surface
          ERR_SANCTION_WINDOW_CONFLICT.
