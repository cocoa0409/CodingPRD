              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SHIFT_ADEQUATELY_STAFFED (priority 7 business_safety beats priority 10 business_fiscal ERR_INCENTIVE_BUDGET_EXCEEDED)"
            - "HTTP status == 409"

  # ===========================================================================
  # Rule 6 — boundary_precision_check
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: exact_ratio_multiple_required_nurses
        grounds:
          - calculations.required_nurses_from_acuity
          - "endpoints[POST /acuity-snapshots]"
        distinguishing_aspect: |
          Metric: required nurse headcount. At an exact ratio multiple (8 patients at 1:4) the
          requirement is exactly 2 — ceil must not over-count; one more patient (9) crosses to 3.
          Reached via POST /acuity-snapshots.
        test_recipe:
          setup:
            - "ICU unit with matrix (LOW ratio 4); no shifts"
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU I", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
          trigger:
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 8, census_moderate: 0, census_high: 0, census_critical: 0 }
              as: ChargeNurse
              captures: { req8: $.data.required_nurses }
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "NIGHT", census_low: 9, census_moderate: 0, census_high: 0, census_critical: 0 }
              as: ChargeNurse
              captures: { req9: $.data.required_nurses }
          assert:
            - "DAY snapshot required_nurses == 2 (ceil(8/4) == 2 exactly; a floor()-style bug gives 2 but a ceil+1 bug gives 3)"
            - "NIGHT snapshot required_nurses == 3 (ceil(9/4) == 3; the 9th patient crosses the ratio boundary)"

      - name: exact_40h_no_overtime_then_beyond
        grounds:
          - calculations.final_assignment_cost
          - "endpoints[POST /assignments/{assignmentId}/complete]"
        distinguishing_aspect: |
          Metric: weekly overtime hours. At a running total of exactly 40.0h the OT portion is 0
          (>= vs > precision); the next completed hour beyond 40 is entirely OT. Reached via
          POST /assignments/{id}/complete — a different endpoint and metric than the ratio boundary.
        test_recipe:
          setup:
            - "ICU unit with matrix; four DAY shifts Mon-Thu 2026-08-10..13 (ISO week 33), each required 2"
            - "CORE ICU nurse at 4000 cents/h; Mon actual 16.0 and Tue actual 12.0 completed (running 28.0h)"
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU J", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
            - call: "POST /acuity-snapshots"
