      - name: scan_unit_item_with_zero_quantity_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_QUANTITY]"]
        distinguishing_aspect: "quantity 0 on a UNIT item is a shape violation (ERR_INVALID_QUANTITY), distinct from a missing quantity and from the weighted-item weight rule."
