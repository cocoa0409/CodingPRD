# =============================================================================
# SCAFFOLD.yaml — task_3038_real_estate_rent_based_franchise_economics
#
# §1.0–§1.7. Neither scaffold_difficulty_design nor scaffold_corner_design
# appears here; they live in their sibling files.
# =============================================================================

scenario: |
  Real Estate and Rent-Based Franchise Economics (McDonald's): site acquisition
  or long-term ground lease held by the franchisor with the operator subleasing,
  rent computed as the greater of a base rent or a percentage of sales with
  periodic escalations, initial franchise fee, royalty and advertising fund
  contributions layered on the occupancy cost, reinvestment and remodel
  obligations tied to franchise term renewal, operator financial capacity review
  and store portfolio rebalancing, rewrite of terms at renewal with capital
  contribution requirements, sublease default and store repossession handling,
  national advertising fund governance and local co-op assessments

domain_name: real-estate-rent-franchise
api_prefix: /franchise-system

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: site_code, type: string, source: input, description: "Unique human-readable site identifier" }
      - { name: address, type: string, source: input, description: "Street address of the parcel" }
      - { name: acquisition_type, type: enum, source: input, description: "FEE_SIMPLE (franchisor buys the land) | GROUND_LEASE (franchisor holds a long-term ground lease from a third-party landowner)", constraints: "FEE_SIMPLE | GROUND_LEASE" }
      - { name: ground_lease_expiry, type: datetime, source: input, description: "Expiry of the third-party ground lease; required iff acquisition_type == GROUND_LEASE, forbidden otherwise" }
      - { name: holding_status, type: enum, source: system, description: "HELD (no store, available) | COMMITTED (exactly one OPEN or SUSPENDED store) | DIVESTED (after repossession unwind)", constraints: "HELD | COMMITTED | DIVESTED" }

  - name: Operator
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal entity name of the franchisee" }
      - { name: status, type: enum, source: system, description: "CANDIDATE | APPROVED | SUSPENDED | TERMINATED", constraints: "CANDIDATE | APPROVED | SUSPENDED | TERMINATED" }
      - { name: fy_net_worth_cents, type: integer, source: input, description: "Most recent fiscal-year net worth, whole cents, >= 0" }
      - { name: fy_operating_income_cents, type: integer, source: input, description: "Most recent fiscal-year operating income, whole cents (may be negative)" }
      - { name: capacity_score, type: integer, source: computed, description: "Read-only composite 0..100 from the most recent SUBMITTED CapacityReview (null before any review)" }
      - { name: capacity_grade, type: enum, source: computed, description: "STRONG (score >= 80) | ADEQUATE (60..79) | WEAK (40..59) | FAILING (< 40); null before any review", constraints: "STRONG | ADEQUATE | WEAK | FAILING" }
      - { name: max_stores, type: integer, source: computed, description: "STRONG -> 12, ADEQUATE -> 6, WEAK -> 2, FAILING -> 0, null -> 0" }
      - { name: stores_operated_count, type: integer, source: computed, description: "Count of Stores with status OPEN operated by this operator" }
      - { name: delinquency_balance_cents, type: integer, source: computed, description: "Sum of unpaid amount over all this operator's stores' OPEN RentCharges plus OPEN FundAssessments" }
      - { name: escrow_balance_cents, type: integer, source: computed, description: "Escrow reserve held against default; credited on deposits, debited by the cure waterfall" }

  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: store_code, type: string, source: input, description: "Unique human-readable store identifier" }
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; site must be HOLDING_STATUS == HELD at store creation" }
      - { name: operator_id, type: string, source: input, description: "FK -> Operator.id; operator must be APPROVED at store creation" }
      - { name: status, type: enum, source: system, description: "SETUP (no active sublease) | OPEN (sublease ACTIVE) | SUSPENDED (post-default, pre-cure/repossess) | REPOSSESSED (terminal; franchisor took the store back)", constraints: "SETUP | OPEN | SUSPENDED | REPOSSESSED" }
      - { name: opened_at, type: datetime, source: system, description: "Timestamp of SETUP -> OPEN transition" }

  - name: FranchiseAgreement
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: operator_id, type: string, source: input, description: "FK -> Operator.id; must equal Store.operator_id" }
      - { name: initial_fee_cents, type: integer, source: input, description: "Initial franchise fee, whole cents, > 0" }
      - { name: royalty_rate, type: number, source: input, description: "Royalty rate on royalty-allocated sales, decimal (e.g. 0.04), 0 < rate < 1" }
      - { name: ad_fund_rate, type: number, source: input, description: "National advertising fund rate on royalty-allocated sales, decimal, 0 < rate < 1" }
      - { name: occupancy_allocation_pct, type: number, source: input, description: "Fraction of monthly sales deemed occupancy-allocated (the rest is royalty-allocated); 0 < pct < 1" }
      - { name: term_years, type: integer, source: input, description: "Franchise term length in whole years, >= 1" }
      - { name: term_start_date, type: string, source: input, description: "ISO date; term effective date" }
      - { name: term_end_date, type: string, source: computed, description: "term_start_date + term_years (same calendar day, minus one day)" }
      - { name: renewal_of_id, type: string, source: input, description: "FK -> FranchiseAgreement.id; null for original agreements; when set, the referenced agreement must be ACTIVE and its term must end within RENEWAL_WINDOW_DAYS" }
      - { name: status, type: enum, source: system, description: "DRAFT | FEE_PENDING (fee invoiced, awaiting payment) | ACTIVE | EXPIRED (term ended without renewal) | SUPERSEDED (rewritten by a renewal agreement) | TERMINATED (store repossessed)", constraints: "DRAFT | FEE_PENDING | ACTIVE | EXPIRED | SUPERSEDED | TERMINATED" }

  - name: Sublease
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; at most one non-terminal sublease per store" }
      - { name: operator_id, type: string, source: input, description: "FK -> Operator.id; must equal Store.operator_id" }
      - { name: base_rent_cents, type: integer, source: input, description: "Annual base rent in whole cents at term start (year-1 basis), > 0" }
      - { name: pct_rent_rate, type: number, source: input, description: "Percentage-of-sales rent rate, decimal, 0 < rate < 1" }
      - { name: escalation_rate, type: number, source: input, description: "Annual escalation applied to base rent on each anniversary, decimal >= 0 (e.g. 0.02)" }
      - { name: escalation_month, type: integer, source: input, description: "Calendar month (1-12) of the annual escalation anniversary" }
      - { name: escalation_day, type: integer, source: input, description: "Day of month (1-28) of the annual escalation anniversary" }
      - { name: start_date, type: string, source: input, description: "ISO date; sublease effective date" }
      - { name: end_date, type: string, source: input, description: "ISO date; must be > start_date; for GROUND_LEASE sites must be <= ground_lease_expiry" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | DEFAULTED | CURED | REPOSSESSED | EXPIRED", constraints: "PENDING | ACTIVE | DEFAULTED | CURED | REPOSSESSED | EXPIRED" }
      - { name: active_default_id, type: string, source: system, description: "FK -> DefaultEvent.id; set while a RESOLVED-able default is outstanding; null otherwise" }

  - name: SalesReport
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: period_month, type: string, source: input, description: "Billing month, format YYYY-MM; one report per store per month" }
      - { name: gross_sales_cents, type: integer, source: input, description: "Gross sales for the month, whole cents, >= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | LOCKED (a BillingRun has consumed it)", constraints: "DRAFT | SUBMITTED | LOCKED" }

  - name: RentCharge
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: sublease_id, type: string, source: computed, description: "FK -> Sublease.id; the ACTIVE sublease at billing time" }
      - { name: billing_period, type: string, source: input, description: "Billing year, format YYYY; one RentCharge per store per billing year" }
      - { name: period_start, type: string, source: input, description: "ISO date; start of the billing year (inclusive)" }
      - { name: period_end, type: string, source: input, description: "ISO date; end of the billing year (inclusive); must be >= period_start and the pair must lie inside the sublease term" }
      - { name: escalation_count, type: integer, source: computed, description: "Number of escalation anniversaries (month/day) inside [period_start, period_end]" }
      - { name: effective_base_rent_cents, type: integer, source: computed, description: "round_half_up(base_rent_cents * (1 + escalation_rate) ^ escalation_count) — single composite rounding, NOT iterative" }
      - { name: percentage_rent_cents, type: integer, source: computed, description: "round_half_up(annual_sales_cents * pct_rent_rate)" }
      - { name: annual_sales_cents, type: integer, source: computed, description: "Sum of gross_sales_cents over the store's LOCKED SalesReports whose period_month falls inside the billing year" }
      - { name: selected_rent_cents, type: integer, source: computed, description: "max(effective_base_rent_cents, percentage_rent_cents) — the greater-of rule" }
      - { name: amount_paid_cents, type: integer, source: system, description: "Cumulative payments applied to this charge" }
      - { name: status, type: enum, source: system, description: "OPEN | PAID | WAIVED (voided by repossession)", constraints: "OPEN | PAID | WAIVED" }

  - name: FundAssessment
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: computed, description: "FK -> Store.id" }
      - { name: agreement_id, type: string, source: computed, description: "FK -> FranchiseAgreement.id" }
      - { name: period_month, type: string, source: computed, description: "Billing month, YYYY-MM" }
      - { name: occupancy_share_cents, type: integer, source: computed, description: "round_half_up(gross_sales_cents * occupancy_allocation_pct) — rounded FIRST" }
      - { name: royalty_sales_cents, type: integer, source: computed, description: "gross_sales_cents - occupancy_share_cents (remainder, never independently rounded)" }
      - { name: royalty_cents, type: integer, source: computed, description: "round_half_up(royalty_sales_cents * royalty_rate)" }
      - { name: ad_fund_cents, type: integer, source: computed, description: "round_half_up(royalty_sales_cents * ad_fund_rate)" }
      - { name: provisional_royalty_cents, type: integer, source: computed, description: "12 * royalty_cents at the month the assessment was generated (provisional variant)" }
      - { name: final_royalty_cents, type: integer, source: computed, description: "Set at annual reconciliation: round_half_up(actual annual royalty-allocated sales * royalty_rate); null until reconciliation" }
      - { name: status, type: enum, source: system, description: "OPEN | PAID | WAIVED", constraints: "OPEN | PAID | WAIVED" }

  - name: ReinvestmentObligation
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: agreement_id, type: string, source: input, description: "FK -> FranchiseAgreement.id; obligation rides on a specific agreement/renewal" }
      - { name: required_budget_cents, type: integer, source: input, description: "Committed remodel budget, whole cents, > 0" }
      - { name: deadline_date, type: string, source: input, description: "ISO date; spend must be submitted on or before this date" }
      - { name: min_spend_cents, type: integer, source: computed, description: "round_half_up(required_budget_cents * 0.70) — 70% minimum coverage" }
      - { name: verified_spend_cents, type: integer, source: system, description: "Sum of approved spend submissions" }
      - { name: status, type: enum, source: system, description: "PENDING | SUBMITTED (spend submitted for review) | SATISFIED (verified_spend >= min_spend) | BREACHED (deadline passed under-spent, or spend rejected)", constraints: "PENDING | SUBMITTED | SATISFIED | BREACHED" }

  - name: DefaultEvent
    parent: null
    common_fields: true
    fields:
      - { name: sublease_id, type: string, source: input, description: "FK -> Sublease.id" }
      - { name: store_id, type: string, source: computed, description: "FK -> Store.id; copied from the sublease" }
      - { name: reason, type: string, source: input, description: "Free-text default reason (e.g. RENT_NONPAYMENT)" }
      - { name: cure_fee_cents, type: integer, source: input, description: "Administrative cure fee, whole cents, >= 0" }
      - { name: shortfall_cents, type: integer, source: computed, description: "Delinquent OPEN charges on the store at default declaration" }
      - { name: status, type: enum, source: system, description: "DECLARED | CURED | REPOSSESSED", constraints: "DECLARED | CURED | REPOSSESSED" }

  - name: AdvertisingFund
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Fund name (e.g. National Brand Fund)" }
      - { name: fund_type, type: enum, source: input, description: "NATIONAL | LOCAL_COOP", constraints: "NATIONAL | LOCAL_COOP" }
      - { name: admin_fee_rate, type: number, source: input, description: "Administration fee withheld from assessments, decimal >= 0 (e.g. 0.02)" }
      - { name: region_code, type: string, source: input, description: "Region code for LOCAL_COOP funds; null for NATIONAL" }
      - { name: balance_cents, type: integer, source: computed, description: "sum(assessments) - sum(disbursements) - sum(admin fees withheld)" }
      - { name: governance_status, type: enum, source: system, description: "ACTIVE | FROZEN (no disbursements while frozen)", constraints: "ACTIVE | FROZEN" }

  - name: CoopAssessment
    parent: null
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> AdvertisingFund.id (LOCAL_COOP only)" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: amount_cents, type: integer, source: input, description: "Assessment amount, whole cents, > 0" }
      - { name: status, type: enum, source: system, description: "ASSESSED | PAID | WAIVED", constraints: "ASSESSED | PAID | WAIVED" }

  - name: CapacityReview
    parent: null
    common_fields: true
    fields:
      - { name: operator_id, type: string, source: input, description: "FK -> Operator.id" }
      - { name: review_period, type: string, source: input, description: "Fiscal year under review, format YYYY" }
      - { name: active_defaults_count, type: integer, source: computed, description: "Operator's DefaultEvents in DECLARED status at submission" }
      - { name: pending_reinvestment_count, type: integer, source: computed, description: "Operator's ReinvestmentObligations in PENDING or BREACHED status at submission" }
      - { name: composite_score, type: integer, source: computed, description: "Weighted score per operator_capacity_score calculation" }
      - { name: grade, type: enum, source: computed, description: "STRONG | ADEQUATE | WEAK | FAILING (banded from composite_score)", constraints: "STRONG | ADEQUATE | WEAK | FAILING" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED (scores frozen and pushed to the Operator)", constraints: "DRAFT | SUBMITTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Site
    initial_state: HELD
    terminal_states: [DIVESTED]
    transitions:
      - from: HELD
        to: COMMITTED
        trigger: "system (automatic when a Store referencing this site is created)"
        actor: system
        preconditions: []
        side_effects: ["Site.holding_status -> COMMITTED", "increments Site.version by 1"]
      - from: COMMITTED
        to: DIVESTED
        trigger: "system (automatic when the site's store completes REPOSSESSED and the divest endpoint is invoked)"
        actor: FranchisorAdmin
        preconditions:
          - "The site's single Store is in REPOSSESSED (ERR_SITE_STORE_NOT_REPOSSESSED)"
        side_effects:
          - "Site.holding_status -> DIVESTED"
          - "increments Site.version by 1"

  - entity: Store
    initial_state: SETUP
    terminal_states: [REPOSSESSED]
    transitions:
      - from: SETUP
        to: OPEN
        trigger: "POST /franchise-system/stores/{storeId}/open"
        actor: FranchisorAdmin
        preconditions:
          - "Store has a FranchiseAgreement in ACTIVE status (ERR_AGREEMENT_NOT_ACTIVE)"
          - "Store has a Sublease in ACTIVE status (ERR_SUBLEASE_NOT_ACTIVE)"
          - "Store.operator_id is an Operator in APPROVED status (ERR_OPERATOR_NOT_APPROVED)"
        side_effects:
          - "Store.opened_at = current clock"
          - "Operator.stores_operated_count recomputed"
          - "increments Store.version by 1"
      - from: OPEN
        to: SUSPENDED
        trigger: "system (automatic when a DefaultEvent is declared on the store's ACTIVE sublease)"
        actor: system
        preconditions: []
        side_effects:
          - "Operator.stores_operated_count recomputed (store no longer OPEN)"
          - "Operator.delinquency_balance_cents recomputed"
          - "increments Store.version by 1"
      - from: SUSPENDED
        to: OPEN
        trigger: "system (automatic when the store's DefaultEvent is CURED)"
        actor: system
        preconditions: []
        side_effects:
          - "Operator.stores_operated_count recomputed"
          - "Operator.delinquency_balance_cents recomputed"
          - "increments Store.version by 1"
      - from: SUSPENDED
        to: REPOSSESSED
        trigger: "system (automatic when the store's DefaultEvent moves to REPOSSESSED)"
        actor: system
        preconditions: []
        side_effects:
          - "Store's ACTIVE FranchiseAgreement -> TERMINATED"
          - "Store's ACTIVE Sublease -> REPOSSESSED"
          - "All store's OPEN RentCharges -> WAIVED; all OPEN FundAssessments -> WAIVED; all ASSESSED CoopAssessments -> WAIVED"
          - "All store's PENDING or SUBMITTED ReinvestmentObligations -> BREACHED"
          - "Operator.status -> TERMINATED; Operator.delinquency_balance_cents recomputed (waived charges drop out)"
          - "increments Store.version by 1"

  - entity: Operator
    initial_state: CANDIDATE
    terminal_states: [TERMINATED]
    transitions:
      - from: CANDIDATE
        to: APPROVED
        trigger: "POST /franchise-system/operators/{operatorId}/approve"
        actor: FranchisorAdmin
        preconditions:
          - "A SUBMITTED CapacityReview exists for this operator whose grade is STRONG or ADEQUATE (ERR_CAPACITY_REVIEW_REQUIRED)"
        side_effects:
          - "Operator.max_stores recomputed from grade"
          - "increments Operator.version by 1"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /franchise-system/operators/{operatorId}/suspend"
        actor: FranchisorAdmin
        preconditions: []
        side_effects:
          - "increments Operator.version by 1"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /franchise-system/operators/{operatorId}/reinstate"
        actor: FranchisorAdmin
        preconditions:
          - "Operator.capacity_grade is not FAILING (ERR_CAPACITY_GRADE_FAILING)"
          - "Operator.delinquency_balance_cents == 0 (ERR_OUTSTANDING_DELINQUENCY)"
        side_effects:
          - "increments Operator.version by 1"
      - from: APPROVED
        to: TERMINATED
        trigger: "system (automatic when any of the operator's stores completes REPOSSESSED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Operator.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "system (automatic when any of the operator's stores completes REPOSSESSED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Operator.version by 1"

  - entity: FranchiseAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED, SUPERSEDED, TERMINATED]
    transitions:
      - from: DRAFT
        to: FEE_PENDING
        trigger: "POST /franchise-system/agreements/{agreementId}/submit"
        actor: FranchisorAdmin
        preconditions:
          - "Store has no other FranchiseAgreement in DRAFT, FEE_PENDING, or ACTIVE status (ERR_ACTIVE_AGREEMENT_EXISTS)"
          - "If renewal_of_id is set: the referenced agreement is ACTIVE and (renewal agreement) carries a ReinvestmentObligation in SATISFIED status (ERR_RENEWAL_REINVESTMENT_UNMET)"
          - "If renewal_of_id is set: referenced agreement's term ends within RENEWAL_WINDOW_DAYS of the clock (ERR_RENEWAL_WINDOW_NOT_OPEN)"
        side_effects:
          - "increments FranchiseAgreement.version by 1"
      - from: FEE_PENDING
        to: ACTIVE
        trigger: "POST /franchise-system/agreements/{agreementId}/record-fee-payment"
        actor: FranchiseFinance
        preconditions:
          - "payload.amount_cents >= agreement.initial_fee_cents (ERR_INSUFFICIENT_FEE_PAYMENT)"
        side_effects:
          - "If renewal_of_id is set: the referenced agreement -> SUPERSEDED (terms rewritten at renewal)"
          - "increments FranchiseAgreement.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when the clock passes term_end_date with no renewal agreement submitted)"
        actor: system
        preconditions: []
        side_effects:
          - "increments FranchiseAgreement.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (automatic when the renewal agreement referencing this one via renewal_of_id reaches ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "increments FranchiseAgreement.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system (automatic when the store completes REPOSSESSED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments FranchiseAgreement.version by 1"

  - entity: Sublease
    initial_state: PENDING
    terminal_states: [REPOSSESSED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /franchise-system/subleases/{subleaseId}/activate"
        actor: FranchisorAdmin
        preconditions:
          - "Store's FranchiseAgreement is ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
          - "Store has no other Sublease in ACTIVE, DEFAULTED, or CURED status (ERR_ACTIVE_SUBLEASE_EXISTS)"
          - "For GROUND_LEASE sites: sublease end_date <= Site.ground_lease_expiry (ERR_SUBLEASE_BEYOND_GROUND_LEASE)"
        side_effects:
          - "increments Sublease.version by 1"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /franchise-system/subleases/{subleaseId}/declare-default"
        actor: FranchisorAdmin
        preconditions:
          - "payload.reason present; payload.cure_fee_cents >= 0"
        side_effects:
          - "Create DefaultEvent(status DECLARED, shortfall_cents = store's current delinquency); Sublease.active_default_id = it"
          - "Store OPEN -> SUSPENDED (which itself recomputes Operator.stores_operated_count and delinquency)"
          - "increments Sublease.version by 1"
      - from: DEFAULTED
        to: CURED
        trigger: "POST /franchise-system/default-events/{defaultId}/cure"
        actor: FranchiseFinance
        preconditions:
          - "DefaultEvent is DECLARED (ERR_DEFAULT_NOT_DECLARED)"
        side_effects:
          - "Escrow waterfall: applied_cents = min(operator.escrow_balance_cents, default.shortfall_cents); if applied_cents < shortfall_cents -> ERR_INSUFFICIENT_CURE_FUNDS and no state change"
          - "Operator.escrow_balance_cents -= applied_cents; cure_fee_cents additionally debited from escrow (ERR_INSUFFICIENT_CURE_FUNDS if escrow < shortfall + fee)"
          - "Store's OPEN RentCharges marked PAID up to applied_cents in created_at ASC order"
          - "DefaultEvent -> CURED; Sublease.active_default_id = null"
          - "Store SUSPENDED -> OPEN (which itself recomputes Operator counters)"
          - "increments Sublease.version by 1"
      - from: CURED
        to: ACTIVE
        trigger: "POST /franchise-system/subleases/{subleaseId}/reinstate"
        actor: FranchisorAdmin
        preconditions: []
        side_effects:
          - "increments Sublease.version by 1"
      - from: DEFAULTED
        to: REPOSSESSED
        trigger: "POST /franchise-system/default-events/{defaultId}/repossess"
        actor: FranchisorAdmin
        preconditions:
          - "DefaultEvent is DECLARED (ERR_DEFAULT_NOT_DECLARED)"
        side_effects:
          - "DefaultEvent -> REPOSSESSED"
          - "Store SUSPENDED -> REPOSSESSED (which itself cascades: agreement TERMINATED, charges/assessments WAIVED, obligations BREACHED, Operator TERMINATED)"
          - "increments Sublease.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when the clock passes end_date)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Sublease.version by 1"

  - entity: SalesReport
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /franchise-system/sales-reports/{reportId}/submit"
        actor: Operator
        preconditions:
          - "X-User-ID == report's store's operator_id (ERR_NOT_RESOURCE_OWNER)"
          - "Store is OPEN (ERR_STORE_NOT_OPEN)"
        side_effects:
          - "increments SalesReport.version by 1"
      - from: SUBMITTED
        to: LOCKED
        trigger: "system (automatic when a BillingRun for the covering period is posted)"
        actor: system
        preconditions: []
        side_effects:
          - "increments SalesReport.version by 1"

  - entity: RentCharge
    initial_state: OPEN
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: OPEN
        to: PAID
        trigger: "POST /franchise-system/rent-charges/{chargeId}/pay (full or cure-waterfall)"
        actor: FranchiseFinance
        preconditions:
          - "Charge is OPEN (ERR_CHARGE_NOT_OPEN)"
        side_effects:
          - "Operator.delinquency_balance_cents recomputed"
          - "increments RentCharge.version by 1"
      - from: OPEN
        to: WAIVED
        trigger: "system (automatic when the store completes REPOSSESSED)"
        actor: system
        preconditions: []
        side_effects:
          - "Operator.delinquency_balance_cents recomputed"
          - "increments RentCharge.version by 1"

  - entity: ReinvestmentObligation
    initial_state: PENDING
    terminal_states: [SATISFIED, BREACHED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /franchise-system/reinvestment-obligations/{obligationId}/submit-spend"
        actor: Operator
        preconditions:
          - "X-User-ID == obligation's store's operator_id (ERR_NOT_RESOURCE_OWNER)"
          - "Clock is on or before deadline_date (ERR_REINVESTMENT_DEADLINE_PASSED)"
        side_effects:
          - "increments ReinvestmentObligation.version by 1"
      - from: SUBMITTED
        to: SATISFIED
        trigger: "POST /franchise-system/reinvestment-obligations/{obligationId}/verify-spend"
        actor: FranchiseFinance
        preconditions:
          - "verified_spend_cents (post-addition) >= min_spend_cents (ERR_REINVESTMENT_UNDERFUNDED)"
        side_effects:
          - "increments ReinvestmentObligation.version by 1"
      - from: SUBMITTED
        to: BREACHED
        trigger: "POST /franchise-system/reinvestment-obligations/{obligationId}/reject-spend"
        actor: FranchiseFinance
        preconditions: []
        side_effects:
          - "increments ReinvestmentObligation.version by 1"
      - from: PENDING
        to: BREACHED
        trigger: "system (automatic when the clock passes deadline_date while still PENDING)"
        actor: system
        preconditions: []
        side_effects:
          - "increments ReinvestmentObligation.version by 1"

  - entity: DefaultEvent
    initial_state: DECLARED
    terminal_states: [CURED, REPOSSESSED]
    transitions:
      - from: DECLARED
        to: CURED
        trigger: "POST /franchise-system/default-events/{defaultId}/cure"
        actor: FranchiseFinance
        preconditions:
          - "Sufficient escrow (see Sublease DEFAULTED -> CURED waterfall)"
        side_effects: ["See Sublease DEFAULTED -> CURED"]
      - from: DECLARED
        to: REPOSSESSED
        trigger: "POST /franchise-system/default-events/{defaultId}/repossess"
        actor: FranchisorAdmin
        preconditions: []
        side_effects: ["See Sublease DEFAULTED -> REPOSSESSED"]

  - entity: CapacityReview
    initial_state: DRAFT
    terminal_states: [SUBMITTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /franchise-system/capacity-reviews/{reviewId}/submit"
        actor: FranchiseFinance
        preconditions: []
        side_effects:
          - "Compute composite_score and grade; write Operator.capacity_score, capacity_grade, max_stores"
          - "increments CapacityReview.version by 1; increments Operator.version by 1"

  - entity: AdvertisingFund
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /franchise-system/advertising-funds/{fundId}/freeze"
        actor: FranchisorAdmin
        preconditions: []
        side_effects: ["increments AdvertisingFund.version by 1"]
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /franchise-system/advertising-funds/{fundId}/unfreeze"
        actor: FranchisorAdmin
        preconditions: []
        side_effects: ["increments AdvertisingFund.version by 1"]

  - entity: FundAssessment
    initial_state: OPEN
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: OPEN
        to: PAID
        trigger: "POST /franchise-system/fund-assessments/{assessmentId}/pay"
        actor: FranchiseFinance
        preconditions: ["Assessment is OPEN (ERR_ASSESSMENT_NOT_OPEN)"]
        side_effects:
          - "National fund balance_cents credited by ad_fund_cents (assessments in, admin fee withheld per fund config)"
          - "increments FundAssessment.version by 1"
      - from: OPEN
        to: WAIVED
        trigger: "system (automatic when the store completes REPOSSESSED)"
        actor: system
        preconditions: []
        side_effects: ["increments FundAssessment.version by 1"]

  - entity: CoopAssessment
    initial_state: ASSESSED
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: ASSESSED
        to: PAID
        trigger: "POST /franchise-system/coop-assessments/{assessmentId}/pay"
        actor: FranchiseFinance
        preconditions: ["Assessment is ASSESSED (ERR_ASSESSMENT_NOT_OPEN)"]
        side_effects:
          - "Local co-op fund balance_cents credited"
          - "increments CoopAssessment.version by 1"
      - from: ASSESSED
        to: WAIVED
        trigger: "system (automatic when the store completes REPOSSESSED)"
        actor: system
        preconditions: []
        side_effects: ["increments CoopAssessment.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: store-create-stale-operator
    parent_entity: Operator
    write_endpoint: "POST /franchise-system/stores"
    occ_field: "expected_operator_version"
    description: |
      Creating a Store against an Operator whose version has advanced since the
      client last observed it is rejected. A store creation legitimately consumes
      portfolio capacity; if another writer has just created a store (or a
      capacity review submission has changed max_stores), the current writer's
      view of the operator's headroom is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: rent-charge-create-stale-sublease
    parent_entity: Sublease
    write_endpoint: "POST /franchise-system/rent-charges"
    occ_field: "expected_sublease_version"
    description: |
      Posting a RentCharge against a Sublease whose version has advanced since
      the client last observed it is rejected. A default declaration or
      activation change rewrites the terms the charge would be computed against,
      so the client's charge inputs rest on a stale read of the sublease.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: escalated_base_rent
    trigger: "RentCharge creation"
    algorithm: aggregation
    formula: |
      1. escalation_count = number of dates D constructed as
         (year Y, escalation_month, escalation_day) with
         period_start <= D <= period_end, scanning Y from year(period_start)
         to year(period_end) inclusive.
      2. effective_base_rent_cents =
         round_half_up(base_rent_cents * (1 + escalation_rate) ^ escalation_count)
      The composite factor is rounded ONCE. Iterative rounding
      (round(base*r), then round(result*r), ...) is FORBIDDEN.
    input_set: "The sublease under charge; the billing year [period_start, period_end]"
    constants:
      ROUNDING: round_half_up
    precision: "whole cents, round_half_up"

  - name: selected_rent
    trigger: "RentCharge creation (after escalated_base_rent)"
    algorithm: threshold
    formula: |
      percentage_rent_cents = round_half_up(annual_sales_cents * pct_rent_rate)
      selected_rent_cents = max(effective_base_rent_cents, percentage_rent_cents)
      annual_sales_cents is the sum of gross_sales_cents over the store's
      SalesReports whose status is LOCKED and whose period_month falls inside
      [period_start, period_end]. DRAFT and SUBMITTED reports are EXCLUDED.
    input_set: "Store's LOCKED SalesReports in the billing year; the sublease"
    constants:
      ROUNDING: round_half_up
    precision: "whole cents, round_half_up"
    variants:
      - name: base_binds
        when: "effective_base_rent_cents >= percentage_rent_cents"
        difference: "charge equals escalated base; percentage component reported but not billed"
      - name: percentage_binds
        when: "percentage_rent_cents > effective_base_rent_cents"
        difference: "charge equals percentage-of-sales; escalated base reported but not billed"

  - name: monthly_royalty_ad_split
    trigger: "BillingRun posting (per LOCKED SalesReport)"
    algorithm: waterfall_allocation
    formula: |
      occupancy_share_cents = round_half_up(gross_sales_cents * occupancy_allocation_pct)
      royalty_sales_cents = gross_sales_cents - occupancy_share_cents
      royalty_cents = round_half_up(royalty_sales_cents * royalty_rate)
      ad_fund_cents = round_half_up(royalty_sales_cents * ad_fund_rate)
      Rounding order is pinned: occupancy share rounds FIRST; the royalty base
      is the un-rounded remainder; royalty and ad-fund round per-line from that
      remainder. Summing-then-rounding at any other stage is FORBIDDEN.
    input_set: "One LOCKED SalesReport; the store's ACTIVE FranchiseAgreement"
    constants:
      ROUNDING: round_half_up
    precision: "whole cents, round_half_up"

  - name: annual_royalty_reconciliation
    trigger: "Annual reconciliation endpoint for a store's fiscal year"
    algorithm: chronological
    formula: |
      provisional_royalty_cents (per month) = 12 * that month's royalty_cents
      final_royalty_cents (per store-year) =
        round_half_up(sum over the year's LOCKED reports of royalty_sales_cents
                      * royalty_rate)
      The provisional variant is forward-looking (annualizes one month); the
      final variant is chronological (replays the year's actual locked reports).
      Identical underlying data produces different totals whenever monthly
      sales are not uniform.
    input_set: "Store's LOCKED SalesReports for the year; ACTIVE FranchiseAgreement"
    constants:
      ROUNDING: round_half_up
    precision: "whole cents, round_half_up"
    variants:
      - name: provisional
        when: "At FundAssessment generation (per-month)"
        difference: "12 * monthly royalty; ignores the rest of the year's actuals"
      - name: final
        when: "At annual reconciliation"
        difference: "Rate applied to the year's actual summed royalty-allocated sales"

  - name: operator_capacity_score
    trigger: "CapacityReview submission"
    algorithm: weighted_scoring
    formula: |
      net_component  = 100 * min(1.0, fy_net_worth_cents / NET_WORTH_FULL_CREDIT)
      opm_component  = 100 * min(1.0, max(0.0, fy_operating_income_cents / fy_net_worth_cents) / OPM_FULL_CREDIT)
      port_component = 100 * min(1.0, stores_operated_count / PORTFOLIO_FULL_CREDIT)
      compliance_component = 100
        - DEFAULT_PENALTY * active_defaults_count
        - REINVEST_PENALTY * pending_reinvestment_count
        - DELINQ_PENALTY * min(1.0, delinquency_balance_cents / DELINQ_FULL_PENALTY)
      composite_score = round_half_up(
        0.35 * net_component + 0.25 * opm_component
        + 0.20 * port_component + 0.20 * compliance_component)
      grade: >= 80 STRONG; 60..79 ADEQUATE; 40..59 WEAK; < 40 FAILING
      active_defaults_count counts the operator's DefaultEvents in DECLARED
      status at submission; pending_reinvestment_count counts the operator's
      ReinvestmentObligations in PENDING or BREACHED status at submission.
      Boundary is INCLUSIVE at the low edge of each band (score == 60 is ADEQUATE).
    input_set: "Operator fiscal fields; counts of DECLARED DefaultEvents and PENDING/BREACHED ReinvestmentObligations; delinquency_balance_cents"
    constants:
      NET_WORTH_FULL_CREDIT: 200000000
      OPM_FULL_CREDIT: 0.25
      PORTFOLIO_FULL_CREDIT: 10
      DEFAULT_PENALTY: 30
      REINVEST_PENALTY: 20
      DELINQ_PENALTY: 20
      DELINQ_FULL_PENALTY: 5000000
    precision: "integer score 0..100, round_half_up on the final composite only"

  - name: reinvestment_min_spend
    trigger: "ReinvestmentObligation creation"
    algorithm: threshold
    formula: |
      min_spend_cents = round_half_up(required_budget_cents * MIN_COVERAGE_RATE)
      SATISFIED requires verified_spend_cents >= min_spend_cents (inclusive).
    input_set: "The obligation"
    constants:
      MIN_COVERAGE_RATE: 0.70
    precision: "whole cents, round_half_up"

  - name: cure_escrow_waterfall
    trigger: "DefaultEvent cure"
    algorithm: waterfall_allocation
    formula: |
      required_cents = default.shortfall_cents + default.cure_fee_cents
      if operator.escrow_balance_cents < required_cents:
        reject ERR_INSUFFICIENT_CURE_FUNDS (no partial application, no state change)
      else:
        debit escrow by required_cents
        apply shortfall_cents to the store's OPEN RentCharges in
        created_at ASC order (oldest first), marking each PAID as covered
      The waterfall is all-or-nothing; a partial cure is never persisted.
    input_set: "The DefaultEvent; operator escrow; the store's OPEN RentCharges"
    constants: {}
    precision: "whole cents"

  - name: fund_balance_rollup
    trigger: "FundAssessment payment, CoopAssessment payment, disbursement posting"
    algorithm: aggregation
    formula: |
      balance_cents = sum(assessment credits) - sum(disbursements)
                      - sum(round_half_up(credit * admin_fee_rate) per credit)
      Admin fee is withheld per-credit at posting time, rounded per-credit.
    input_set: "The fund's posted credits and disbursements"
    constants:
      ROUNDING: round_half_up
    precision: "whole cents, round_half_up"

  - name: store_portfolio_headroom
    trigger: "Store creation"
    algorithm: threshold
    formula: |
      stores_operated_count counts the operator's Stores with status == OPEN
      (SETUP, SUSPENDED and REPOSSESSED are EXCLUDED).
      headroom = max_stores - stores_operated_count
      Store creation requires headroom > 0 (strictly greater; at the exact
      boundary headroom == 0 the creation is rejected).
      max_stores derives from capacity_grade: STRONG 12, ADEQUATE 6, WEAK 2,
      FAILING 0, no-review 0.
    input_set: "The operator and its stores"
    constants: {}
    precision: "integer"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Resource ids in the path must exist, validated left-to-right"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: existence
    check: "Foreign-key ids in the request body must reference existing resources (site_id, operator_id, store_id, renewal_of_id, fund_id, sublease_id)"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "creation endpoints"

  - priority: 5
    category: state
    check: "Target resource must be in the required state for the operation (per §1.2 transition preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"

  - priority: 6
    category: business_safety
    check: "Operator role callers may only act on resources owned by their X-User-ID (sales report submission, spend submission)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /franchise-system/sales-reports/{id}/submit, POST /franchise-system/reinvestment-obligations/{id}/submit-spend"

  - priority: 7
    category: business_constraint
    check: "Store creation: site must be HELD; operator must be APPROVED; headroom = max_stores - stores_operated_count must be > 0"
    error_id: ERR_PORTFOLIO_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /franchise-system/stores"

  - priority: 8
    category: business_temporal
    check: "Sublease end_date must be > start_date; for GROUND_LEASE sites end_date must be <= Site.ground_lease_expiry"
    error_id: ERR_SUBLEASE_BEYOND_GROUND_LEASE
    http_status: 422
    applies_to: "POST /franchise-system/subleases, POST /franchise-system/subleases/{id}/activate"

  - priority: 9
    category: business_temporal
    check: "RentCharge [period_start, period_end] must lie inside the sublease [start_date, end_date]"
    error_id: ERR_CHARGE_PERIOD_OUT_OF_TERM
    http_status: 422
    applies_to: "POST /franchise-system/rent-charges"

  - priority: 10
    category: business_referential
    check: "At most one non-terminal Sublease per store; at most one non-terminal FranchiseAgreement per store"
    error_id: ERR_ACTIVE_SUBLEASE_EXISTS
    http_status: 409
    applies_to: "POST /franchise-system/subleases, POST /franchise-system/agreements"

  - priority: 11
    category: business_temporal
    check: "Renewal submission: referenced agreement's term must end within RENEWAL_WINDOW_DAYS (180 days) of the clock, and its ReinvestmentObligation must be SATISFIED"
    error_id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /franchise-system/agreements/{id}/submit"

  - priority: 12
    category: business_fiscal
    check: "record-fee-payment amount must cover initial_fee_cents; cure requires escrow >= shortfall + cure_fee; fund disbursement requires fund ACTIVE and balance sufficient"
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 402
    applies_to: "POST /franchise-system/agreements/{id}/record-fee-payment, POST /franchise-system/default-events/{id}/cure, POST /franchise-system/advertising-funds/{id}/disburse"

  - priority: 13
    category: business_constraint
    check: "OCC: expected_<parent>_version in the body must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /franchise-system/stores, POST /franchise-system/rent-charges"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/franchise-system/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-09-01T00:00:00Z; before any set_current_utc call the logical clock reads exactly this default and never falls back to wall-clock time."
    roles: [FranchisorAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: []

  # --- Site ---
  - method: POST
    path: "/franchise-system/sites"
    description: "Register a site (fee-simple purchase or ground lease)"
    roles: [FranchisorAdmin]
    code: 201
    input: [site_code, address, acquisition_type, "ground_lease_expiry?"]
    output: Site
    side_effects: ["holding_status = HELD"]

  - method: GET
    path: "/franchise-system/sites"
    description: "List sites"
    roles: [FranchisorAdmin, FranchiseFinance, Operator, CoopManager]
    code: 200
    input: ["limit?", "offset?", "holding_status?"]
    output: "Site[]"
    side_effects: []

  - method: GET
    path: "/franchise-system/sites/{siteId}"
    description: "Get one site"
    roles: [FranchisorAdmin, FranchiseFinance, Operator, CoopManager]
    code: 200
    input: []
    output: Site
    side_effects: []

  - method: POST
    path: "/franchise-system/sites/{siteId}/divest"
    description: "Divest a COMMITTED site whose store was repossessed"
    roles: [FranchisorAdmin]
    code: 200
    input: []
    output: Site
    side_effects: ["Site COMMITTED -> DIVESTED", "increments Site.version by 1"]

  - method: GET
    path: "/franchise-system/sites/{siteId}/stores"
    description: "List stores on a site (reverse-reachability for Store.site_id)"
    roles: [FranchisorAdmin, FranchiseFinance, Operator, CoopManager]
    code: 200
    input: []
    output: "Store[]"
    side_effects: []

  # --- Operator ---
  - method: POST
    path: "/franchise-system/operators"
    description: "Register an operator candidate"
    roles: [FranchisorAdmin]
    code: 201
    input: [legal_name, fy_net_worth_cents, fy_operating_income_cents]
    output: Operator
    side_effects: ["status = CANDIDATE", "capacity_score/capacity_grade null", "stores_operated_count 0", "delinquency_balance_cents 0", "escrow_balance_cents 0"]

  - method: GET
    path: "/franchise-system/operators"
    description: "List operators"
    roles: [FranchisorAdmin, FranchiseFinance, Operator, CoopManager]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Operator[]"
    side_effects: []

  - method: GET
    path: "/franchise-system/operators/{operatorId}"
    description: "Get one operator"
    roles: [FranchisorAdmin, FranchiseFinance, Operator, CoopManager]
    code: 200
    input: []
    output: Operator
    side_effects: []

  - method: POST
    path: "/franchise-system/operators/{operatorId}/approve"
    description: "Approve a CANDIDATE operator"
    roles: [FranchisorAdmin]
    code: 200
    input: []
    output: Operator
    side_effects: ["Operator CANDIDATE -> APPROVED", "increments Operator.version by 1"]

  - method: POST
    path: "/franchise-system/operators/{operatorId}/suspend"
    description: "Suspend an APPROVED operator"
    roles: [FranchisorAdmin]
    code: 200
    input: []
    output: Operator
    side_effects: ["Operator APPROVED -> SUSPENDED", "increments Operator.version by 1"]

  - method: POST
    path: "/franchise-system/operators/{operatorId}/reinstate"
    description: "Reinstate a SUSPENDED operator"
    roles: [FranchisorAdmin]
    code: 200
    input: []
    output: Operator
    side_effects: ["Operator SUSPENDED -> APPROVED", "increments Operator.version by 1"]

  - method: PUT
    path: "/franchise-system/operators/{operatorId}/fiscal-snapshot"
    description: "Update an operator's fiscal-year net worth and operating income (feeds subsequent capacity reviews)"
    roles: [FranchiseFinance]
    code: 200
    input: [fy_net_worth_cents, fy_operating_income_cents]
    output: Operator
    side_effects: ["fy fields updated", "increments Operator.version by 1"]

  - method: POST
    path: "/franchise-system/operators/{operatorId}/escrow-deposits"
    description: "Deposit escrow reserve against future default cure"
    roles: [FranchiseFinance]
    code: 200
    input: [amount_cents]
    output: Operator
    side_effects: ["Operator.escrow_balance_cents += amount_cents", "increments Operator.version by 1"]

  # --- CapacityReview ---
  - method: POST
    path: "/franchise-system/capacity-reviews"
    description: "Open a capacity review (DRAFT) for an operator"
    roles: [FranchiseFinance]
    code: 201
    input: [operator_id, review_period]
    output: CapacityReview
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/franchise-system/capacity-reviews"
    description: "List capacity reviews"
    roles: [FranchisorAdmin, FranchiseFinance]
    code: 200
    input: ["limit?", "offset?", "operator_id?"]
    output: "CapacityReview[]"
    side_effects: []

  - method: GET
    path: "/franchise-system/capacity-reviews/{reviewId}"
    description: "Get one capacity review"
    roles: [FranchisorAdmin, FranchiseFinance]
    code: 200
    input: []
    output: CapacityReview
    side_effects: []

  - method: POST
    path: "/franchise-system/capacity-reviews/{reviewId}/submit"
    description: "Submit a review; freezes score and pushes grade to the operator"
    roles: [FranchiseFinance]
    code: 200
    input: []
    output: CapacityReview
    side_effects: ["Compute composite_score/grade", "Operator.capacity_score/capacity_grade/max_stores updated", "increments CapacityReview.version by 1", "increments Operator.version by 1"]

  # --- Store ---
  - method: POST
    path: "/franchise-system/stores"
    description: "Create a store on a held site for an approved operator (OCC on operator)"
    roles: [FranchisorAdmin]
    code: 201
    input: [store_code, site_id, operator_id, expected_operator_version]
    output: Store
    side_effects: ["status = SETUP", "Site HELD -> COMMITTED", "increments Operator.version by 1"]

  - method: GET
    path: "/franchise-system/stores"
    description: "List stores"
    roles: [FranchisorAdmin, FranchiseFinance, Operator, CoopManager]
    code: 200
    input: ["limit?", "offset?", "site_id?", "operator_id?", "status?"]
    output: "Store[]"
    side_effects: []

  - method: GET
    path: "/franchise-system/stores/{storeId}"
    description: "Get one store"
    roles: [FranchisorAdmin, FranchiseFinance, Operator, CoopManager]
    code: 200
    input: []
    output: Store
    side_effects: []

  - method: POST
    path: "/franchise-system/stores/{storeId}/open"
    description: "Open a SETUP store once agreement and sublease are ACTIVE"
    roles: [FranchisorAdmin]
    code: 200
    input: []
    output: Store
    side_effects: ["Store SETUP -> OPEN", "Operator.stores_operated_count recomputed", "increments Store.version by 1"]

  # --- FranchiseAgreement ---
  - method: POST
    path: "/franchise-system/agreements"
    description: "Draft a franchise agreement (original or renewal via renewal_of_id)"
    roles: [FranchisorAdmin]
    code: 201
    input: [store_id, operator_id, initial_fee_cents, royalty_rate, ad_fund_rate, occupancy_allocation_pct, term_years, term_start_date, "renewal_of_id?"]
    output: FranchiseAgreement
    side_effects: ["status = DRAFT", "term_end_date computed"]

  - method: GET
    path: "/franchise-system/agreements"
    description: "List agreements"
    roles: [FranchisorAdmin, FranchiseFinance, Operator]
    code: 200
    input: ["limit?", "offset?", "store_id?", "operator_id?", "status?", "renewal_of_id?"]
    output: "FranchiseAgreement[]"
    side_effects: []

  - method: GET
    path: "/franchise-system/agreements/{agreementId}"
    description: "Get one agreement"
    roles: [FranchisorAdmin, FranchiseFinance, Operator]
    code: 200
    input: []
    output: FranchiseAgreement
    side_effects: []

  - method: POST
    path: "/franchise-system/agreements/{agreementId}/submit"
    description: "Submit a DRAFT agreement for fee invoicing"
    roles: [FranchisorAdmin]
    code: 200
    input: []
    output: FranchiseAgreement
    side_effects: ["Agreement DRAFT -> FEE_PENDING", "increments FranchiseAgreement.version by 1"]

  - method: POST
    path: "/franchise-system/agreements/{agreementId}/record-fee-payment"
    description: "Record the initial franchise fee payment (segregated from submit)"
    roles: [FranchiseFinance]
    code: 200
    input: [amount_cents]
    output: FranchiseAgreement
    side_effects: ["Agreement FEE_PENDING -> ACTIVE", "referenced renewal_of agreement -> SUPERSEDED", "increments FranchiseAgreement.version by 1"]

  # --- Sublease ---
  - method: POST
    path: "/franchise-system/subleases"
    description: "Draft a sublease for a store"
    roles: [FranchisorAdmin]
    code: 201
    input: [store_id, operator_id, base_rent_cents, pct_rent_rate, escalation_rate, escalation_month, escalation_day, start_date, end_date]
    output: Sublease
    side_effects: ["status = PENDING"]

  - method: GET
    path: "/franchise-system/subleases"
    description: "List subleases"
    roles: [FranchisorAdmin, FranchiseFinance, Operator]
    code: 200
    input: ["limit?", "offset?", "store_id?", "operator_id?", "status?", "active_default_id?"]
    output: "Sublease[]"
    side_effects: []

  - method: GET
    path: "/franchise-system/subleases/{subleaseId}"
    description: "Get one sublease"
    roles: [FranchisorAdmin, FranchiseFinance, Operator]
    code: 200
    input: []
    output: Sublease
    side_effects: []

  - method: POST
    path: "/franchise-system/subleases/{subleaseId}/activate"
    description: "Activate a PENDING sublease"
    roles: [FranchisorAdmin]
    code: 200
    input: []
    output: Sublease
    side_effects: ["Sublease PENDING -> ACTIVE", "increments Sublease.version by 1"]

  - method: POST
    path: "/franchise-system/subleases/{subleaseId}/declare-default"
    description: "Declare default on an ACTIVE sublease"
    roles: [FranchisorAdmin]
    code: 200
    input: [reason, cure_fee_cents]
    output: DefaultEvent
    side_effects: ["Create DefaultEvent DECLARED", "Sublease ACTIVE -> DEFAULTED", "Store OPEN -> SUSPENDED", "increments Sublease.version by 1"]

  - method: POST
    path: "/franchise-system/subleases/{subleaseId}/reinstate"
    description: "Reinstate a CURED sublease to ACTIVE"
    roles: [FranchisorAdmin]
    code: 200
    input: []
    output: Sublease
    side_effects: ["Sublease CURED -> ACTIVE", "increments Sublease.version by 1"]

  # --- DefaultEvent ---
  - method: GET
    path: "/franchise-system/default-events"
    description: "List default events"
    roles: [FranchisorAdmin, FranchiseFinance]
    code: 200
    input: ["limit?", "offset?", "sublease_id?", "store_id?", "status?"]
    output: "DefaultEvent[]"
    side_effects: []

  - method: GET
    path: "/franchise-system/default-events/{defaultId}"
    description: "Get one default event"
    roles: [FranchisorAdmin, FranchiseFinance]
    code: 200
    input: []
    output: DefaultEvent
    side_effects: []

  - method: POST
    path: "/franchise-system/default-events/{defaultId}/cure"
    description: "Cure a DECLARED default via the escrow waterfall"
    roles: [FranchiseFinance]
    code: 200
    input: []
    output: DefaultEvent
    side_effects: ["Escrow waterfall per cure_escrow_waterfall", "DefaultEvent -> CURED", "Sublease DEFAULTED -> CURED", "Store SUSPENDED -> OPEN"]

  - method: POST
    path: "/franchise-system/default-events/{defaultId}/repossess"
    description: "Repossess the store behind a DECLARED default"
    roles: [FranchisorAdmin]
    code: 200
    input: []
    output: DefaultEvent
    side_effects: ["DefaultEvent -> REPOSSESSED", "Sublease DEFAULTED -> REPOSSESSED", "Store SUSPENDED -> REPOSSESSED with full cascade"]

  # --- SalesReport ---
  - method: POST
    path: "/franchise-system/sales-reports"
    description: "Create a monthly sales report (DRAFT)"
    roles: [Operator]
    code: 201
    input: [store_id, period_month, gross_sales_cents]
    output: SalesReport
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/franchise-system/sales-reports"
    description: "List sales reports"
    roles: [FranchisorAdmin, FranchiseFinance, Operator]
    code: 200
    input: ["limit?", "offset?", "store_id?", "status?", "period_month?"]
    output: "SalesReport[]"
    side_effects: []

  - method: GET
    path: "/franchise-system/sales-reports/{reportId}"
    description: "Get one sales report"
    roles: [FranchisorAdmin, FranchiseFinance, Operator]
    code: 200
    input: []
    output: SalesReport
    side_effects: []

  - method: POST
    path: "/franchise-system/sales-reports/{reportId}/submit"
    description: "Submit a DRAFT report (owner-operator only)"
    roles: [Operator]
    code: 200
    input: []
    output: SalesReport
    side_effects: ["SalesReport DRAFT -> SUBMITTED", "increments SalesReport.version by 1"]

  # --- RentCharge ---
  - method: POST
    path: "/franchise-system/rent-charges"
    description: "Post an annual rent charge (OCC on sublease)"
    roles: [FranchiseFinance]
    code: 201
    input: [store_id, billing_period, period_start, period_end, expected_sublease_version]
    output: RentCharge
    side_effects: ["Compute escalated_base_rent + selected_rent", "status = OPEN", "Operator.delinquency_balance_cents recomputed", "increments Sublease.version by 1"]

  - method: GET
    path: "/franchise-system/rent-charges"
    description: "List rent charges"
    roles: [FranchisorAdmin, FranchiseFinance, Operator]
    code: 200
    input: ["limit?", "offset?", "store_id?", "sublease_id?", "status?"]
    output: "RentCharge[]"
    side_effects: []

  - method: GET
    path: "/franchise-system/rent-charges/{chargeId}"
    description: "Get one rent charge"
    roles: [FranchisorAdmin, FranchiseFinance, Operator]
    code: 200
    input: []
    output: RentCharge
    side_effects: []

  - method: POST
    path: "/franchise-system/rent-charges/{chargeId}/pay"
    description: "Pay an OPEN rent charge"
    roles: [FranchiseFinance]
    code: 200
    input: [amount_cents]
    output: RentCharge
    side_effects: ["amount_paid_cents += amount_cents; PAID when fully covered", "Operator.delinquency_balance_cents recomputed", "increments RentCharge.version by 1"]

  # --- BillingRun (locks sales reports and emits FundAssessments) ---
  - method: POST
    path: "/franchise-system/billing-runs"
    description: "Post a monthly billing run for a store; locks the month's SUBMITTED report and emits a FundAssessment"
    roles: [FranchiseFinance]
    code: 201
    input: [store_id, period_month]
    output: FundAssessment
    side_effects: ["SalesReport SUBMITTED -> LOCKED", "Compute monthly_royalty_ad_split", "FundAssessment OPEN created"]

  # --- FundAssessment ---
  - method: GET
    path: "/franchise-system/fund-assessments"
    description: "List fund assessments"
    roles: [FranchisorAdmin, FranchiseFinance, Operator]
    code: 200
    input: ["limit?", "offset?", "store_id?", "agreement_id?", "status?"]
    output: "FundAssessment[]"
    side_effects: []

  - method: GET
    path: "/franchise-system/fund-assessments/{assessmentId}"
    description: "Get one fund assessment"
    roles: [FranchisorAdmin, FranchiseFinance, Operator]
    code: 200
    input: []
    output: FundAssessment
    side_effects: []

  - method: POST
    path: "/franchise-system/fund-assessments/{assessmentId}/pay"
    description: "Pay an OPEN fund assessment"
    roles: [FranchiseFinance]
    code: 200
    input: []
    output: FundAssessment
    side_effects: ["FundAssessment OPEN -> PAID", "National fund balance credited", "increments FundAssessment.version by 1"]

  - method: POST
    path: "/franchise-system/stores/{storeId}/annual-reconciliation"
    description: "Run annual royalty reconciliation (final variant) for a store-year"
    roles: [FranchiseFinance]
    code: 200
    input: [fiscal_year]
    output: FundAssessment
    side_effects: ["final_royalty_cents populated on the year's assessments", "delta vs provisional surfaced"]

  # --- ReinvestmentObligation ---
  - method: POST
    path: "/franchise-system/reinvestment-obligations"
    description: "Attach a remodel/reinvestment obligation to an agreement"
    roles: [FranchisorAdmin]
    code: 201
    input: [store_id, agreement_id, required_budget_cents, deadline_date]
    output: ReinvestmentObligation
    side_effects: ["min_spend_cents computed", "status = PENDING"]

  - method: GET
    path: "/franchise-system/reinvestment-obligations"
    description: "List reinvestment obligations"
    roles: [FranchisorAdmin, FranchiseFinance, Operator]
    code: 200
    input: ["limit?", "offset?", "store_id?", "agreement_id?", "status?"]
    output: "ReinvestmentObligation[]"
    side_effects: []

  - method: GET
    path: "/franchise-system/reinvestment-obligations/{obligationId}"
    description: "Get one obligation"
    roles: [FranchisorAdmin, FranchiseFinance, Operator]
    code: 200
    input: []
    output: ReinvestmentObligation
    side_effects: []

  - method: POST
    path: "/franchise-system/reinvestment-obligations/{obligationId}/submit-spend"
    description: "Operator submits remodel spend (owner only)"
    roles: [Operator]
    code: 200
    input: [amount_cents]
    output: ReinvestmentObligation
    side_effects: ["verified_spend_cents += amount_cents (pending verification)", "PENDING -> SUBMITTED", "increments ReinvestmentObligation.version by 1"]

  - method: POST
    path: "/franchise-system/reinvestment-obligations/{obligationId}/verify-spend"
    description: "Finance verifies submitted spend"
    roles: [FranchiseFinance]
    code: 200
    input: []
    output: ReinvestmentObligation
    side_effects: ["SUBMITTED -> SATISFIED iff verified_spend_cents >= min_spend_cents", "increments ReinvestmentObligation.version by 1"]

  - method: POST
    path: "/franchise-system/reinvestment-obligations/{obligationId}/reject-spend"
    description: "Finance rejects submitted spend"
    roles: [FranchiseFinance]
    code: 200
    input: []
    output: ReinvestmentObligation
    side_effects: ["SUBMITTED -> BREACHED", "increments ReinvestmentObligation.version by 1"]

  # --- AdvertisingFund ---
  - method: POST
    path: "/franchise-system/advertising-funds"
    description: "Create the national fund or a local co-op fund"
    roles: [FranchisorAdmin]
    code: 201
    input: [name, fund_type, admin_fee_rate, "region_code?"]
    output: AdvertisingFund
    side_effects: ["governance_status = ACTIVE", "balance_cents = 0"]

  - method: GET
    path: "/franchise-system/advertising-funds"
    description: "List funds"
    roles: [FranchisorAdmin, FranchiseFinance, CoopManager]
    code: 200
    input: ["limit?", "offset?", "fund_type?", "region_code?"]
    output: "AdvertisingFund[]"
    side_effects: []

  - method: GET
    path: "/franchise-system/advertising-funds/{fundId}"
    description: "Get one fund"
    roles: [FranchisorAdmin, FranchiseFinance, CoopManager]
    code: 200
    input: []
    output: AdvertisingFund
    side_effects: []

  - method: POST
    path: "/franchise-system/advertising-funds/{fundId}/freeze"
    description: "Freeze a fund (halts disbursements)"
    roles: [FranchisorAdmin]
    code: 200
    input: []
    output: AdvertisingFund
    side_effects: ["ACTIVE -> FROZEN", "increments AdvertisingFund.version by 1"]

  - method: POST
    path: "/franchise-system/advertising-funds/{fundId}/unfreeze"
    description: "Unfreeze a fund"
    roles: [FranchisorAdmin]
    code: 200
    input: []
    output: AdvertisingFund
    side_effects: ["FROZEN -> ACTIVE", "increments AdvertisingFund.version by 1"]

  - method: POST
    path: "/franchise-system/advertising-funds/{fundId}/disburse"
    description: "Disburse from a fund (governance-gated)"
    roles: [FranchisorAdmin, CoopManager]
    code: 200
    input: [amount_cents, purpose]
    output: AdvertisingFund
    side_effects: ["balance_cents -= amount_cents", "CoopManager restricted to LOCAL_COOP funds (ERR_INSUFFICIENT_PERMISSIONS otherwise)", "increments AdvertisingFund.version by 1"]

  # --- CoopAssessment ---
  - method: POST
    path: "/franchise-system/coop-assessments"
    description: "Assess a store into a local co-op fund"
    roles: [CoopManager]
    code: 201
    input: [fund_id, store_id, amount_cents]
    output: CoopAssessment
    side_effects: ["status = ASSESSED", "Local co-op fund balance credited on payment"]

  - method: GET
    path: "/franchise-system/coop-assessments"
    description: "List co-op assessments"
    roles: [FranchisorAdmin, FranchiseFinance, CoopManager, Operator]
    code: 200
    input: ["limit?", "offset?", "fund_id?", "store_id?", "status?"]
    output: "CoopAssessment[]"
    side_effects: []

  - method: GET
    path: "/franchise-system/coop-assessments/{assessmentId}"
    description: "Get one co-op assessment"
    roles: [FranchisorAdmin, FranchiseFinance, CoopManager, Operator]
    code: 200
    input: []
    output: CoopAssessment
    side_effects: []

  - method: POST
    path: "/franchise-system/coop-assessments/{assessmentId}/pay"
    description: "Pay an ASSESSED co-op assessment"
    roles: [FranchiseFinance]
    code: 200
    input: []
    output: CoopAssessment
    side_effects: ["ASSESSED -> PAID", "Local co-op fund balance credited", "increments CoopAssessment.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or blank" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint (incl. CoopManager disbursing from a NATIONAL fund)" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "Path or body FK id does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-precondition failure on a transition endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Operator role acting on a resource owned by a different operator" }
  - { id: ERR_SITE_STORE_NOT_REPOSSESSED, http: 409, condition: "Divest requires the site's store to be REPOSSESSED" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Store open / sublease activation requires an ACTIVE FranchiseAgreement" }
  - { id: ERR_SUBLEASE_NOT_ACTIVE, http: 409, condition: "Store open requires an ACTIVE Sublease" }
  - { id: ERR_OPERATOR_NOT_APPROVED, http: 409, condition: "Store open requires an APPROVED operator" }
  - { id: ERR_CAPACITY_REVIEW_REQUIRED, http: 409, condition: "Operator approval requires a SUBMITTED CapacityReview graded STRONG or ADEQUATE" }
  - { id: ERR_CAPACITY_GRADE_FAILING, http: 409, condition: "Reinstatement blocked while capacity_grade is FAILING" }
  - { id: ERR_OUTSTANDING_DELINQUENCY, http: 409, condition: "Reinstatement blocked while delinquency_balance_cents > 0" }
  - { id: ERR_PORTFOLIO_LIMIT_REACHED, http: 409, condition: "Store creation would exceed max_stores for the operator's grade (headroom <= 0)" }
  - { id: ERR_ACTIVE_AGREEMENT_EXISTS, http: 409, condition: "Store already has a DRAFT/FEE_PENDING/ACTIVE agreement" }
  - { id: ERR_ACTIVE_SUBLEASE_EXISTS, http: 409, condition: "Store already has a PENDING/ACTIVE/DEFAULTED/CURED sublease" }
  - { id: ERR_RENEWAL_WINDOW_NOT_OPEN, http: 409, condition: "Referenced agreement's term does not end within RENEWAL_WINDOW_DAYS (180 days)" }
  - { id: ERR_RENEWAL_REINVESTMENT_UNMET, http: 409, condition: "Renewal requires the referenced agreement's ReinvestmentObligation to be SATISFIED" }
  - { id: ERR_INSUFFICIENT_FEE_PAYMENT, http: 402, condition: "record-fee-payment amount_cents < initial_fee_cents" }
  - { id: ERR_SUBLEASE_BEYOND_GROUND_LEASE, http: 422, condition: "GROUND_LEASE site: sublease end_date exceeds the site's ground_lease_expiry" }
  - { id: ERR_CHARGE_PERIOD_OUT_OF_TERM, http: 422, condition: "RentCharge billing period falls outside the sublease term" }
  - { id: ERR_CHARGE_NOT_OPEN, http: 409, condition: "Payment target charge is not OPEN" }
  - { id: ERR_ASSESSMENT_NOT_OPEN, http: 409, condition: "Payment target assessment is not OPEN/ASSESSED" }
  - { id: ERR_STORE_NOT_OPEN, http: 409, condition: "Sales report submission requires the store OPEN" }
  - { id: ERR_DEFAULT_NOT_DECLARED, http: 409, condition: "Cure/repossess requires the DefaultEvent in DECLARED" }
  - { id: ERR_INSUFFICIENT_CURE_FUNDS, http: 402, condition: "Escrow balance < shortfall + cure fee at cure time" }
  - { id: ERR_REINVESTMENT_DEADLINE_PASSED, http: 409, condition: "Spend submission after the obligation deadline_date" }
  - { id: ERR_REINVESTMENT_UNDERFUNDED, http: 409, condition: "verify-spend with verified_spend_cents < min_spend_cents" }
  - { id: ERR_FUND_FROZEN, http: 409, condition: "Disbursement while fund governance_status is FROZEN" }
  - { id: ERR_INSUFFICIENT_FUND_BALANCE, http: 402, condition: "Disbursement amount exceeds fund balance_cents" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FranchisorAdmin
    description: "Franchisor real-estate and franchising administrator; owns sites, agreements, subleases, defaults, fund governance"
    identity: opaque
    exclusive_operations:
      - "POST /franchise-system/sites and /sites/{id}/divest"
      - "POST /franchise-system/operators and /operators/{id}/approve|suspend|reinstate"
      - "POST /franchise-system/stores and /stores/{id}/open"
      - "POST /franchise-system/agreements and /agreements/{id}/submit"
      - "POST /franchise-system/subleases and /subleases/{id}/activate|declare-default|reinstate"
      - "POST /franchise-system/default-events/{id}/repossess"
      - "POST /franchise-system/reinvestment-obligations"
      - "POST /franchise-system/advertising-funds and freeze/unfreeze"
      - "POST /franchise-system/_clock/set_current_utc"
    shared_operations:
      - "GET on all resources"
      - "POST /franchise-system/advertising-funds/{id}/disburse"

  - name: FranchiseFinance
    description: "Franchisor finance officer; money movement, billing, capacity reviews, spend verification — segregated from agreement submission and repossession"
    identity: opaque
    exclusive_operations:
      - "POST /franchise-system/capacity-reviews and /capacity-reviews/{id}/submit"
      - "PUT /franchise-system/operators/{id}/fiscal-snapshot"
      - "POST /franchise-system/operators/{id}/escrow-deposits"
      - "POST /franchise-system/agreements/{id}/record-fee-payment"
      - "POST /franchise-system/rent-charges and /rent-charges/{id}/pay"
      - "POST /franchise-system/billing-runs"
      - "POST /franchise-system/fund-assessments/{id}/pay"
      - "POST /franchise-system/coop-assessments/{id}/pay"
      - "POST /franchise-system/stores/{id}/annual-reconciliation"
      - "POST /franchise-system/default-events/{id}/cure"
      - "POST /franchise-system/reinvestment-obligations/{id}/verify-spend and /reject-spend"
    shared_operations:
      - "GET on all resources"

  - name: Operator
    description: "Franchisee; reports sales and submits remodel spend for owned stores only"
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "POST /franchise-system/sales-reports and /sales-reports/{id}/submit"
      - "POST /franchise-system/reinvestment-obligations/{id}/submit-spend"
    shared_operations:
      - "GET on own stores, agreements, subleases, charges, assessments"

  - name: CoopManager
    description: "Local advertising co-op manager; assesses member stores and disburses from LOCAL_COOP funds only"
    identity: opaque
    exclusive_operations:
      - "POST /franchise-system/coop-assessments"
    shared_operations:
      - "POST /franchise-system/advertising-funds/{id}/disburse (LOCAL_COOP funds only)"
      - "GET on funds, assessments, sites, stores"
