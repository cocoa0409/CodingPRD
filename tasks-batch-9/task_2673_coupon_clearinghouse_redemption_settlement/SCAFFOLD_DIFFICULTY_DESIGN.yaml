  # =====================================================================
  - rule_id: transitive_cascade
    instances:

      - name: coupon_item_reject_depth_four_money_rollup
        grounds:
          - endpoints.POST./submission-lots/{id}/finalize
          - state_machines.CouponItem.CAPTURED_to_REJECTED_COUNTERFEIT
          - state_machines.SubmissionLot.SORTED_to_VALIDATED
          - state_machines.Submission.intake_status=SORTED_to_intake_status=CLOSED
          - calculations.lot_gross_face_value
          - calculations.lot_handling_fee
          - calculations.retailer_fraud_score
        distinguishing_aspect: |
          One finalize call propagates through four entity levels in a fixed
          order: CouponItem statuses (level 1) -> SubmissionLot accepted_qty /
          rejected_qty / gross_face_value_cents / handling_fee_cents / status
          (level 2) -> Submission adjudicated / accepted / rejected / settled
          money fields and intake_status CLOSED (level 3) -> Retailer
          counterfeit_rate, fraud_score, handling_fee_tier and last_rescored_at
          (level 4), with Offer.accepted_redemption_count updated on a side
          branch off level 2. The order is load-bearing: the level-4 rescore
          reads the level-1 statuses, so a rescore that ran before adjudication
          would report counterfeit_rate 0.00, and a level-2 fee computed from
          counted_qty instead of projected_accepted_units would bill 21 cents
          instead of 14 and carry that error all the way into level 3.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z default"
            - "manufacturer 038000 CONTRACT_RATE at 7 cents per unit; retailer STANDARD (TIER_MULTIPLIER 1.00), ROLLING_WINDOW scoring, all rates 0.00"
            - "offer SOUP50 face 50, purchase_requirement_units 2, grace 30, GS1_DATABAR -> barcode_payload 8110380000005002261231030"
            - "submission verified 3, one lot counted_qty 3 (<= SAMPLE_THRESHOLD_QTY 40 so valuation_variant FULL_COUNT, sample_size 3)"
            - "three items captured in this order: two with the correct barcode and matching purchase records, then one whose barcode encodes grace 031 instead of 030"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000", handling_fee_policy: "CONTRACT_RATE", dispute_window_days: 45 }
