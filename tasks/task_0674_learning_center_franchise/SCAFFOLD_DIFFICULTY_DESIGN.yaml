  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: enrollment_double_book_half_open_overlap_rejected_touching_allowed
        grounds:
          - validations[priority=8]
          - errors[ERR_SESSION_OVERLAP]
          - entities.Session.fields.start_at
          - entities.Session.fields.end_at
        distinguishing_aspect: |
          Half-open [start,end) interval semantics on the AttendanceRecord/Enrollment
          resource: an enrollment booked on session 09:00-10:00 is rejected when booking a
          second overlapping session 09:30-10:30 (ERR_SESSION_OVERLAP), but an adjacent
          session 10:00-11:00 (touching end==start) is accepted.
        test_recipe:
          setup:
            - "Center OPERATING; one ACTIVE enrollment; three OPEN sessions at the center: S1 09:00-10:00, S2 09:30-10:30 (overlaps S1), S3 10:00-11:00 (adjacent to S1)."
            - "Enrollment already BOOKED on S1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: FranchiseAdmin
