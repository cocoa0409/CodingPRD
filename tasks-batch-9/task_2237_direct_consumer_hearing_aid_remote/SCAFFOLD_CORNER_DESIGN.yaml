            - { call: "POST /remote-fitting-sessions/${sess_ov}/complete", payload: {}, as: LicensedAudiologist, as_user_id: "${prov_o}" }
            - { call: "POST /provider-referrals/${ref_ov}/determination", payload: { clearance_outcome: "NOT_CLEARED", clearance_note: "active pathology" }, as: LicensedAudiologist, as_user_id: "${prov_o}" }
            - { call: "POST /patients/${pat_ov}/compliance-overrides", payload: { justification: "second opinion obtained offline" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { ovr_ov: "$.data.id" } }
          trigger:
