  # =====================================================================
  # SECTION 2 - From Table 2 (State Machines)
  # =====================================================================
  - section: state_machines
    instances:
      - claim_type: initial_state
        name: every_lifecycle_entity_starts_in_its_declared_initial_state
        grounds:
          - state_machines.ConcessionAgreement.initial_state
          - state_machines.ExclusivityGrant.initial_state
          - state_machines.CustomsAudit.initial_state
          - state_machines.Brand.initial_state
        distinguishing_aspect: |
          ConcessionAgreement starts DRAFT (NOT ACTIVE - rent must not accrue before activation),
          ExclusivityGrant starts ACTIVE immediately, CustomsAudit starts DRAFT with round_count 1 and
          no counted_qty, and Brand starts ACTIVE. Creating an agreement that is already ACTIVE would
          let sales accrue against an unactivated concession.
        test_recipe:
          setup:
            - "Terminal SIN in SG and one LISTED LIQUOR product with a stock item"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "SIN", name: "Changi T3 Duty Free", country_code: "SG", sealed_bag_regime: "NONE", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_sin: $.data.id }
            - call: "POST /brands"
              payload: { name: "Aurora Spirits", category: "LIQUOR" }
              as: TerminalAdmin
              captures: { b_aurora: $.data.id }
            - call: "POST /products"
              payload: { brand_id: "${b_aurora}", sku: "AUR-WHISKY-700", category: "LIQUOR", unit_price_cents: 8000, duty_rate_bps: 1500, vat_rate_bps: 900, is_liquid: true, liquid_ml: 700, target_nationality_code: "CN", required_nationality_share_bps: 0 }
              as: TerminalAdmin
              captures: { p_whisky: $.data.id }
            - call: "POST /bonded-stock-items"
              payload: { terminal_id: "${t_sin}", product_id: "${p_whisky}" }
              as: StockController
              captures: { si_whisky: $.data.id }
          trigger:
            - call: "POST /concession-agreements"
              payload: { terminal_id: "${t_sin}", period_code: "2026-08", period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2026-09-01T00:00:00Z", rent_pct_bps: 1200, minimum_guarantee_cents: 10000 }
              as: TerminalAdmin
              captures: { ag_1: $.data.id }
            - call: "POST /exclusivity-grants"
              payload: { brand_id: "${b_aurora}", terminal_id: "${t_sin}", category: "LIQUOR", scope: "CATEGORY_PREFERRED", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: TerminalAdmin
              captures: { g_1: $.data.id }
            - call: "POST /customs-audits"
              payload: { terminal_id: "${t_sin}", stock_item_id: "${si_whisky}", period_code: "2026-08" }
              as: StockController
              as_user_id: "user-stock-01"
              captures: { au_1: $.data.id }
          assert:
            - "ConcessionAgreement.${ag_1}.status == DRAFT"
            - "ConcessionAgreement.${ag_1}.gross_sales_cents == 0"
            - "ConcessionAgreement.${ag_1}.rent_basis == null"
            - "ConcessionAgreement.${ag_1}.closed_at == null"
            - "ExclusivityGrant.${g_1}.status == ACTIVE"
            - "ExclusivityGrant.${g_1}.revoked_at == null"
            - "CustomsAudit.${au_1}.status == DRAFT"
            - "CustomsAudit.${au_1}.round_count == 1"
            - "CustomsAudit.${au_1}.counted_qty == null"
            - "CustomsAudit.${au_1}.preparer_user_id == user-stock-01"
            - "CustomsAudit.${au_1}.auditor_user_id == null"
            - "Brand.${b_aurora}.status == ACTIVE"

      - claim_type: side_effect_execution
        name: sealed_bag_issuance_computes_liquid_volume_and_seal_expiry
        grounds:
          - calculations.sealed_bag_liquid_volume
          - state_machines.SealedBag.initial_state
          - endpoints["POST /sealed-bags"]
          - endpoints["POST /sales/{sale_id}/clear-eligibility"]
        distinguishing_aspect: |
          Issuing a bag MUST snapshot total_liquid_ml as sum(qty * liquid_ml) over LIQUID lines only
          (non-liquid lines contribute 0, not their qty) and set expires_at to departure_utc plus exactly
          96 hours - NOT to the issuance instant plus 96 hours. sealed_bag_required MUST also have been
          set true at clearance because the regime is ICAO_STEB, the itinerary connects, and a liquid
          line exists.
        test_recipe:
          setup:
            - "Terminal HKG in HK with sealed_bag_regime ICAO_STEB and liquid_limit_ml 3000"
            - "A liquid LIQUOR product (700 ml, 8000 cents, 2400 bps) and a non-liquid ELECTRONICS product, both LISTED, 10 units each"
            - "AU/LIQUOR allowance 5 units and AU/ELECTRONICS allowance 5 units"
