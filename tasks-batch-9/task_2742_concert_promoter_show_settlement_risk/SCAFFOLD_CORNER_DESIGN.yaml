      - name: vendor_invoice_cycles_submitted_verified_disputed_submitted_three_times
        claim_type: cyclic
        grounds:
          - "state_machines.VendorInvoice.transitions.DISPUTED_to_SUBMITTED"
          - "state_machines.VendorInvoice.transitions.SUBMITTED_to_VERIFIED"
          - "state_machines.VendorInvoice.transitions.VERIFIED_to_DISPUTED"
          - "state_machines.VendorInvoice.transitions.VERIFIED_to_APPROVED"
          - "state_machines.VendorInvoice.terminal_states"
          - "entities.VendorInvoice.fields.resubmit_count"
          - "calculations.budget_line_variance_recognition"
        distinguishing_aspect: "The VendorInvoice loop has NO round limit — unlike the Offer loop, which dies at NEGOTIATION_ROUND_LIMIT — so three full SUBMITTED -> VERIFIED -> DISPUTED -> SUBMITTED laps all succeed, resubmit_count reads exactly 1, 2, 3, the amount is replaced each lap while budget_line.actual_cents stays 0, and the loop terminates only when the row reaches the terminal APPROVED, after which a fourth dispute returns ERR_ALREADY_TERMINAL 409."
        test_recipe:
          setup:
            - "BASE(Cycle Market limit 5000000, Loop Ensemble, Loop Hall cap 600 / facility 0 / tax 0)."
            - "One CONFIRMED show (RENTAL, rental_fee 0) carrying an accepted 600000 FLAT_GUARANTEE offer."
            - "One ACTIVE PRODUCTION BudgetLine budgeted 100000 and one SUBMITTED VendorInvoice for 100000 against it."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Cycle Market", region_code: "CY", guarantee_exposure_limit_cents: 5000000 }
              as: RiskOfficer
              captures: { cy_mk_id: $.data.id }
            - call: "POST /artists"
