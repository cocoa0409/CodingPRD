            - { call: "POST /api/samples/${s1}/decide", payload: { outcome: "REJECTED" }, as: ContractManager }
          trigger:
            - { call: "POST /api/samples", payload: { pellet_lot_id: "${pellet_id}", brewery_name: "CraftBrew" }, as: ContractManager, captures: { r2: $.data.sample_round, st2: $.data.status } }
          assert:
            - "captured r1 == 1 and captured r2 == 2 and captured st2 == SENT"

      - name: spot_reserve_cancel_releases_lot
        claim_type: compensation
        grounds:
          - state_machines.PelletLot.AVAILABLE_to_RESERVED
          - state_machines.PelletLot.RESERVED_to_AVAILABLE
          - state_machines.SpotSale.DRAFT_to_CANCELLED
        distinguishing_aspect: "Draft then cancel is a perfect compensation: the lot returns to AVAILABLE and no sale fields persist beyond the CANCELLED record."
        test_recipe:
          setup: ["pellet lot 736 AVAILABLE"]
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { p_id: $.data.id } }
            - { call: "POST /api/planting-plans/${p_id}/approve", payload: {}, as: FarmManager }
            - { call: "POST /api/planting-plans/${p_id}/open-harvest", payload: {}, as: FarmManager }
            - { call: "POST /api/kilns", payload: { name: "K1" }, as: FarmManager, captures: { k_id: $.data.id } }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 3000 }, as: FarmManager, captures: { lot_id: $.data.id } }
            - { call: "POST /api/harvest-lots/${lot_id}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T08:00:00Z", kiln_window_end: "2026-08-20T12:00:00Z" }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_id}/finish-drying", payload: { dried_lbs: 800 }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_id}/release", payload: {}, as: FarmManager }
            - { call: "POST /api/pellet-lots", payload: { source_lot_ids: ["${lot_id}"], storage_room: "R1" }, as: FarmManager, captures: { pellet_id: $.data.id } }
            - { call: "POST /api/spot-sales", payload: { pellet_lot_id: "${pellet_id}", buyer_name: "CraftBrew", price_cents_per_lb: 650, buyer_credit_limit_cents: 1000000 }, as: ContractManager, captures: { sale_id: $.data.id } }
            - { call: "GET /api/pellet-lots/${pellet_id}", payload: {}, as: ContractManager, captures: { mid: $.data.inventory_status } }
          trigger:
            - { call: "POST /api/spot-sales/${sale_id}/cancel", payload: {}, as: ContractManager }
            - { call: "GET /api/pellet-lots/${pellet_id}", payload: {}, as: ContractManager, captures: { after: $.data.inventory_status } }
          assert:
            - "captured mid == RESERVED and captured after == AVAILABLE (reserve fully compensated by cancel)"

  - section: rbac
    instances:
      - name: farm_manager_cannot_create_contract
        claim_type: rbac_denial
        grounds:
          - roles[FarmManager]
          - roles[ContractManager]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Contract creation is exclusive to ContractManager; FarmManager gets ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/contracts", payload: { brewery_name: "BrewCo", variety: "CASCADE", term_start_year: 2026, term_end_year: 2028, annual_volume_lbs: 736, base_price_cents_per_lb: 500, alpha_floor_pct: 12.0, alpha_premium_cents_per_point: 40, alpha_discount_cents_per_point: 60 }, as: FarmManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_FORBIDDEN"

      - name: contract_manager_cannot_post_lab_test
        claim_type: rbac_denial
        grounds:
          - roles[LabTechnician]
          - roles[ContractManager]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Lab tests are exclusive to LabTechnician; ContractManager gets ERR_FORBIDDEN (403) — role check fires before existence, so even a non-existent lot id yields 403."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/lab-tests", payload: { harvest_lot_id: "00000000-0000-0000-0000-000000000000", test_type: "PROVISIONAL", alpha_pct: 12.0 }, as: ContractManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_FORBIDDEN"

  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_rejected_then_fresh_succeeds
        claim_type: stale_version_conflict
        grounds:
          - concurrency_rules[contract-amend-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Amendment carrying expected_contract_version one behind the live version is rejected 412; the same amendment with the current version succeeds and bumps version to 3."
        test_recipe:
          setup: ["contract created (version 1) then activated (version 2)"]
          setup_api_calls:
            - { call: "POST /api/contracts", payload: { brewery_name: "BrewCo", variety: "CASCADE", term_start_year: 2026, term_end_year: 2028, annual_volume_lbs: 736, base_price_cents_per_lb: 500, alpha_floor_pct: 12.0, alpha_premium_cents_per_point: 40, alpha_discount_cents_per_point: 60 }, as: ContractManager, captures: { c_id: $.data.id, c_v: $.data.version } }
            - { call: "POST /api/contracts/${c_id}/activate", payload: {}, as: ContractManager }
            - { call: "GET /api/contracts/${c_id}", payload: {}, as: ContractManager, captures: { v2: $.data.version } }
          trigger:
            - { call: "POST /api/contracts/${c_id}/amendments", payload: { expected_contract_version: "${v2} - 1", annual_volume_lbs: 1500 }, as: ContractManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/contracts/${c_id}/amendments", payload: { expected_contract_version: "${v2}", annual_volume_lbs: 1500 }, as: ContractManager, captures: { v3: $.data.version, vol3: $.data.annual_volume_lbs } }
          assert:
            - "captured err == ERR_STALE_VERSION (412) for the stale expected version"
            - "captured v3 == 3 and vol3 == 1500 (fresh amendment applied, version bumped)"

  - section: errors
    instances:
      - name: err_field_season_conflict_trigger
