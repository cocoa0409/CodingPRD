          rationale: "The §1.8 priority_pair_validation_conflict instance already violates priority 60 and priority 95 with one scheduling call and asserts that ERR_MEDIA_FILL_QUALIFICATION_EXPIRED wins, which is also the only test needed for ERR_PROJECT_UNIT_BUDGET_EXCEEDED's ordering."

      - name: terminal_quality_state_outranks_the_open_critical_deviation
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: qp_release_terminal_quality_state_outranks_open_critical_deviation
          rationale: "The §1.8 priority_pair_validation_conflict instance already violates priority 45 and priority 68 with one qp-release call and asserts that ERR_BATCH_QUALITY_STATE_INVALID wins over ERR_OPEN_CRITICAL_DEVIATION and ERR_SEGREGATION_OF_DUTIES."

