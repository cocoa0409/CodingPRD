            - "Response HTTP status == 409"

  # =====================================================================
  # Calculations (§1.3) — boundary precision and input-set filtering
  # claims not covered by §1.8.
  # =====================================================================
  - section: calculations
    instances:

      - name: provisional_copay_under_cap_equals_service_fee_only
        claim_type: Correct Result
        grounds:
          - calculations.provisional_copay
        distinguishing_aspect: |
          When R = 20000 (under cap C = 25000), provisional_copay reduces to
          0 + service_fee_cents (= 7500). Variant under_cap branch verified.
        test_recipe:
          setup:
            - "An ACTIVE Contract with one CoveredItem. ClaimTicket filed."
          setup_api_calls:
            - call: "POST /contract-packages"
              payload: { code: "PLUS", name: "Plus", annual_premium_cents: 50000, service_fee_cents: 7500, copay_cap_cents: 25000, copay_share_pct: 0.20, return_visit_window_days: 30, max_covered_items: 5 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "uc@example.com", full_name: "UC", home_address: "10 Pine" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /covered-items"
              payload: { contract_id: "${contract_id}", category: "HVAC", brand: "B", model: "M", install_year: 2022 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_id: $.data.id }
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", covered_item_id: "${item_id}", issue_summary: "Under cap" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/assess"
              payload: { estimated_repair_cost_cents: 20000 }
              as: Dispatcher
              captures: { pc: $.data.provisional_copay_cents }
          assert:
            - "ClaimTicket.${claim_id}.provisional_copay_cents == 7500 (R=20000 <= C=25000 → only service_fee)"

      - name: final_copay_return_visit_under_cap_equals_zero
        claim_type: Variant Divergence
        grounds:
          - calculations.final_copay
        distinguishing_aspect: |
          Return-visit + under-cap variant: final_copay = 0. SF waived AND
          no co-pay sharing.
        test_recipe:
          setup:
            - "An ACTIVE Contract with one CoveredItem that already had a previously-completed Dispatch (so last_dispatch_completed_utc is set within the 30-day window)."
            - "A second ClaimTicket on the same item with R = 18000 (under cap C = 25000), dispatched within the return-visit window, dispatch completed, ready for /resolve."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /contract-packages"
              payload: { code: "PLUS", name: "Plus", annual_premium_cents: 50000, service_fee_cents: 7500, copay_cap_cents: 25000, copay_share_pct: 0.20, return_visit_window_days: 30, max_covered_items: 5 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "rv@example.com", full_name: "RV", home_address: "11 Pine" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /covered-items"
              payload: { contract_id: "${contract_id}", category: "HVAC", brand: "B", model: "M", install_year: 2022 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_id: $.data.id }
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", covered_item_id: "${item_id}", issue_summary: "First" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { c1: $.data.id }
            - call: "POST /claims/${c1}/assess"
              payload: { estimated_repair_cost_cents: 18000 }
              as: Dispatcher
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /claims/${c1}/dispatch"
              payload: { technician_id: "tech-A", scheduled_utc: "2026-02-01T09:00:00Z" }
              as: Dispatcher
            - call: "GET /dispatches"
              payload: { claim_id: "${c1}" }
              as: Dispatcher
              captures: { d1: "$.data[0].id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /dispatches/${d1}/start"
              payload: {}
              as: Technician
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dispatches/${d1}/complete"
              payload: {}
              as: Technician
            - call: "POST /claims/${c1}/resolve"
              payload: { actual_repair_cost_cents: 18000 }
              as: Dispatcher
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-10T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", covered_item_id: "${item_id}", issue_summary: "Again" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { c2: $.data.id }
            - call: "POST /claims/${c2}/assess"
              payload: { estimated_repair_cost_cents: 18000 }
              as: Dispatcher
            - call: "POST /claims/${c2}/dispatch"
              payload: { technician_id: "tech-B", scheduled_utc: "2026-02-10T15:00:00Z" }
              as: Dispatcher
            - call: "GET /dispatches"
              payload: { claim_id: "${c2}" }
              as: Dispatcher
              captures: { d2: "$.data[0].id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-10T15:30:00Z" }
              as: PlatformAdmin
            - call: "POST /dispatches/${d2}/start"
              payload: {}
              as: Technician
            - call: "POST /dispatches/${d2}/complete"
              payload: {}
              as: Technician
          trigger:
            - call: "POST /claims/${c2}/resolve"
              payload: { actual_repair_cost_cents: 18000 }
              as: Dispatcher
              captures: { fc: $.data.final_copay_cents }
          assert:
            - "ClaimTicket.${c2}.final_copay_cents == 0 (return_visit_under_cap: SF waived + R <= C)"

      - name: is_return_visit_no_prior_completion_returns_false
        claim_type: Variant Selection
        grounds:
          - calculations.is_return_visit
          - entities.CoveredItem.fields.last_dispatch_completed_utc
        distinguishing_aspect: |
          When CoveredItem.last_dispatch_completed_utc is null (no prior
          completion), is_return_visit is unconditionally false regardless
          of clock_now or W.
        test_recipe:
          setup:
            - "An ACTIVE Contract with one CoveredItem that has NEVER had a Dispatch completed. A ClaimTicket on it, ASSESSED, ready to /dispatch."
          setup_api_calls:
            - call: "POST /contract-packages"
              payload: { code: "PLUS", name: "Plus", annual_premium_cents: 50000, service_fee_cents: 7500, copay_cap_cents: 25000, copay_share_pct: 0.20, return_visit_window_days: 30, max_covered_items: 5 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "np@example.com", full_name: "Np", home_address: "12 Pine" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /covered-items"
              payload: { contract_id: "${contract_id}", category: "DRYER", brand: "B", model: "M", install_year: 2022 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_id: $.data.id }
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", covered_item_id: "${item_id}", issue_summary: "First ever" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/assess"
              payload: { estimated_repair_cost_cents: 30000 }
              as: Dispatcher
          trigger:
            - call: "POST /claims/${claim_id}/dispatch"
              payload: { technician_id: "tech-N", scheduled_utc: "2030-01-01T10:00:00Z" }
              as: Dispatcher
              captures: { is_rv: $.data.is_return_visit, sf: $.data.service_fee_charged_cents }
          assert:
            - "ClaimTicket.${claim_id}.is_return_visit == false (L is null)"
            - "ClaimTicket.${claim_id}.service_fee_charged_cents == 7500 (SF charged normally)"

      - name: error_pre_existing_excluded_on_assess
        claim_type: Violation to Error
        grounds:
          - validations[priority=7]
          - errors[ERR_PRE_EXISTING_EXCLUDED]
        distinguishing_aspect: |
          POST /claims/{id}/assess against a CoveredItem with
          pre_existing_flag=true returns ERR_PRE_EXISTING_EXCLUDED. Not
          covered by §1.8 priority conflict instance B (which uses /assess
          against a REJECTED claim).
        test_recipe:
          setup:
            - "An ACTIVE Contract with a CoveredItem where pre_existing_flag = true. A SUBMITTED ClaimTicket on it."
          setup_api_calls:
            - call: "POST /contract-packages"
              payload: { code: "PLUS", name: "Plus", annual_premium_cents: 50000, service_fee_cents: 7500, copay_cap_cents: 25000, copay_share_pct: 0.20, return_visit_window_days: 30, max_covered_items: 5 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "pe@example.com", full_name: "Pe", home_address: "13 Pine" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /covered-items"
              payload: { contract_id: "${contract_id}", category: "REFRIGERATOR", brand: "B", model: "M", install_year: 2010, pre_existing_flag: true }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_id: $.data.id }
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", covered_item_id: "${item_id}", issue_summary: "Was already broken" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/assess"
              payload: { estimated_repair_cost_cents: 10000 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
