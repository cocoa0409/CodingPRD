        grounds:
          - calculations.collected_fees_reconciliation
          - state_machines.PermissionSlip.UNPAID_to_PAID
          - state_machines.PermissionSlip.PAID_to_REFUNDED
          - entities.FieldTrip.fields.collected_fees_cents
          - entities.PermissionSlip.fields.net_paid_cents
        distinguishing_aspect: |
          Conserved quantity = NET CASH. Invariant pinned as
          FieldTrip.collected_fees_cents == sum over slips of net_paid_cents.
          A PAYMENT of 1000 followed by a full TRIP_CANCELLATION refund of -1000
          leaves both at 0 — no cash drift.
