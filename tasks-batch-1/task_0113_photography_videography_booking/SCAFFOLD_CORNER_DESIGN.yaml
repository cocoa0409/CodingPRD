            - call: "POST /studio/galleries/${g7}/request-revision"
              payload: {}
              as: Client
              as_user_id: "${ce7}"
            - call: "POST /studio/galleries/${g7}/upload"
              payload: { delivered_image_count: 31 }
              as: Photographer
              as_user_id: "${pe7}"
            - call: "POST /studio/galleries/${g7}/request-revision"
              payload: {}
              as: Client
              as_user_id: "${ce7}"
            - call: "POST /studio/galleries/${g7}/upload"
              payload: { delivered_image_count: 32 }
              as: Photographer
              as_user_id: "${pe7}"
          trigger:
            - call: "POST /studio/galleries/${g7}/request-revision"
              payload: {}
              as: Client
              as_user_id: "${ce7}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "data.error_id == ERR_REVISION_LIMIT"

      - name: shoot_complete_before_end_returns_shoot_not_ended
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=16]", state_machines.ShootSchedule.SCHEDULED_to_COMPLETED, "errors[ERR_SHOOT_NOT_ENDED]"]
        distinguishing_aspect: "Completing a shoot while current_utc < end_utc -> ERR_SHOOT_NOT_ENDED (409), even though the booking is DEPOSIT_PAID."
        test_recipe:
          setup: ["CONFIRMED + DEPOSIT_PAID booking with a SCHEDULED shoot ending 2026-07-30T12:00Z; clock at 2026-07-30T11:00Z (before end)."]
          setup_api_calls:
            - call: "POST /studio/clients"
              payload: { email: "ce8@x.com", full_name: "CE Eight", phone: "8" }
              as: StudioAdmin
              captures: { ce8: $.data.id }
            - call: "POST /studio/photographers"
              payload: { email: "pe8@x.com", full_name: "PE Eight", skills: ["PHOTO"], hourly_rate_cents: 7000 }
              as: StudioAdmin
              captures: { pe8: $.data.id }
            - call: "POST /studio/session-packages"
              payload: { name: "PB E8", session_type: "PORTRAIT", tier: "BASIC", base_fee_cents: 100000, included_shoot_hours: 2, overage_hourly_rate_cents: 12000, included_edited_images: 30, deposit_pct: 0.30, active: true }
              as: StudioAdmin
              captures: { pke8: $.data.id }
            - call: "POST /studio/bookings"
              payload: { client_id: "${ce8}", package_id: "${pke8}", lead_photographer_id: "${pe8}", requested_shoot_hours: 2 }
              as: Client
              as_user_id: "${ce8}"
              captures: { bk8: $.data.id }
            - call: "POST /studio/contracts"
              payload: { booking_id: "${bk8}" }
              as: StudioAdmin
              captures: { ct8: $.data.id }
            - call: "POST /studio/contracts/${ct8}/send"
              payload: {}
              as: StudioAdmin
            - call: "POST /studio/contracts/${ct8}/sign"
              payload: {}
              as: Client
              as_user_id: "${ce8}"
            - call: "POST /studio/shoot-schedules"
              payload: { booking_id: "${bk8}", start_utc: "2026-07-30T10:00:00Z", end_utc: "2026-07-30T12:00:00Z" }
              as: StudioAdmin
              captures: { sc8: $.data.id }
