  - section: errors
    instances:
      - name: error_slot_capacity_exceeded_covered
        claim_type: Violation -> Error
        grounds: ['errors[ERR_SLOT_CAPACITY_EXCEEDED]']
        excluded_because:
          difficulty_instance: resource_temporal_overlap / delivery_slot_overlap_aggregate_capacity_halfopen
          rationale: "The overlapping-delivery-slot §1.8 instance already triggers ERR_SLOT_CAPACITY_EXCEEDED."

      - name: error_cycle_window_conflict_covered
        claim_type: Violation -> Error
        grounds: ['errors[ERR_CYCLE_WINDOW_CONFLICT]']
        excluded_because:
          difficulty_instance: resource_temporal_overlap / cycle_window_buffer_conflict_closed_interval
          rationale: "The same-region cycle-window §1.8 instance already triggers ERR_CYCLE_WINDOW_CONFLICT."

      - name: error_product_farm_mismatch_covered
        claim_type: Violation -> Error
        grounds: ['errors[ERR_PRODUCT_FARM_MISMATCH]']
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / offering_product_mismatch_beats_snap_auth
          rationale: "The CONFLICT-B §1.8 instance asserts ERR_PRODUCT_FARM_MISMATCH as the winning error."

      - name: error_insufficient_availability_covered
        claim_type: Violation -> Error
        grounds: ['errors[ERR_INSUFFICIENT_AVAILABILITY]']
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / addline_cycle_not_open_beats_availability
          rationale: "The CONFLICT-A §1.8 instance exercises the availability check (as the losing leg); the boundary instance exercises its exact edge."

      - name: error_lines_not_packed_covered
        claim_type: Violation -> Error
        grounds: ['errors[ERR_LINES_NOT_PACKED]']
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / fulfill_requires_all_lines_packed_order_vs_line
          rationale: "The fulfill-gating §1.8 instance already triggers ERR_LINES_NOT_PACKED."

      - name: error_cycle_not_open_covered
        claim_type: Violation -> Error
        grounds: ['errors[ERR_CYCLE_NOT_OPEN]']
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / checkout_requires_cycle_open_order_vs_cycle
          rationale: "The checkout cross-entity §1.8 instance already triggers ERR_CYCLE_NOT_OPEN."

      - name: settlement_commission_computed_covered
        claim_type: Correct Result
        grounds: [calculations.vendor_settlement_payout, entities.VendorSettlement.fields.commission_cents]
        excluded_because:
          difficulty_instance: combinatorial_formula / settlement_commission_per_line_rounding_mode_b
          rationale: "Settlement gross/commission/net computation is asserted with literals by the per-line-rounding §1.8 instance."
