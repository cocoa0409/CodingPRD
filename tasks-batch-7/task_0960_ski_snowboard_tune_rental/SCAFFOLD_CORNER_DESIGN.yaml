        grounds: ["validations[priority=15]", "errors[ERR_WINDOW_FULL]", "calculations.pickup_window_posture"]
        distinguishing_aspect: "Capacity boundary >=: the first booking exactly fills a capacity-1 window (posture FULL); the second is rejected ERR_WINDOW_FULL."
        test_recipe:
          setup: ["Window cap 1; two CONFIRMED reservations (each 2 days, rate 4000, deposit 1600)"]
          setup_api_calls:
            - { call: "POST /shop/pickup-windows", payload: { service_date: "2026-12-20", start_time: "10:00", end_time: "12:00", location_label: "CANYON", van_capacity: 1 }, as: Manager, captures: { win: "$.data.id" } }
