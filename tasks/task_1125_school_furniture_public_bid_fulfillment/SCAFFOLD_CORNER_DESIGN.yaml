            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po1}", spec_line_id: "${slA}", ordered_qty: 10 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { l1: $.data.id } }
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po1}", spec_line_id: "${slA}", ordered_qty: 8 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { l2: $.data.id } }
            - { call: "POST /v1/purchase-orders/${po1}/accept", payload: {}, as: FulfillmentCoordinator }
            - { call: "POST /v1/po-lines/${l1}/declare-backorder", payload: { initial_eta_date: "2026-07-20" }, as: FulfillmentCoordinator }
            - { call: "POST /v1/po-lines/${l2}/declare-backorder", payload: { initial_eta_date: "2026-07-22" }, as: FulfillmentCoordinator }
            - { call: "GET /v1/purchase-orders/${po1}", payload: {}, as: FulfillmentCoordinator, captures: { posture_mid: $.data.posture, cnt_mid: $.data.open_backorder_count } }
          trigger:
            - { call: "POST /v1/shipments", payload: { purchase_order_id: "${po1}", school_site_id: "${site1}", scheduled_date: "2026-07-25", lines: [ { po_line_id: "${l1}", qty: 10 }, { po_line_id: "${l2}", qty: 8 } ] }, as: FulfillmentCoordinator, captures: { ship1: $.data.id } }
            - { call: "POST /v1/shipments/${ship1}/mark-delivered", payload: { lines: [ { po_line_id: "${l1}", delivered_qty: 10, manufacturer: "Acme", model: "Desk-100" }, { po_line_id: "${l2}", delivered_qty: 8, manufacturer: "Acme", model: "Desk-100" } ] }, as: FulfillmentCoordinator }
            - { call: "GET /v1/purchase-orders/${po1}", payload: {}, as: FulfillmentCoordinator, captures: { posture_end: $.data.posture, cnt_end: $.data.open_backorder_count } }
            - { call: "GET /v1/backorder-notices", payload: { po_line_id: "${l1}" }, as: FulfillmentCoordinator, captures: { n1_status : "$.data[0].status" } }
            - { call: "GET /v1/backorder-notices", payload: { po_line_id: "${l2}" }, as: FulfillmentCoordinator, captures: { n2_status : "$.data[0].status" } }
          assert:
