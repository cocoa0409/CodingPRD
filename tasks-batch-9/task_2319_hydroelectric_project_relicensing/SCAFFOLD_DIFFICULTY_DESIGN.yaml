  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: study_site_half_open_window_plus_rest_buffer_boundary
        grounds:
          - validations[priority=60]
          - entities.StudySite.fields.min_rest_buffer_days
          - entities.ResourceStudy.fields.fieldwork_window_start
          - entities.ResourceStudy.fields.fieldwork_status
        distinguishing_aspect: |
          Site occupancy is half-open [start, end) with the end extended by min_rest_buffer_days, and
          touching exactly at the buffered boundary is legal. A study ending 2026-10-01 at a site with
          a 14-day buffer blocks up to 2026-10-15 exclusive: a start of 2026-10-14 conflicts and a
          start of 2026-10-15 does not. Occupancy is also status-filtered, so completing the first
          study frees its original window for a study that fully overlaps it.
        test_recipe:
          setup:
            - "Project at STUDY_PHASE with a study plan submitted into UNDER_AGENCY_REVIEW (so Study A's fieldwork may start)."
            - "StudySite S2 with min_rest_buffer_days 14 and cultural_sensitivity NONE."
            - "Study A at S2 with window 2026-09-01 to 2026-10-01 and fieldwork_status PLANNED, so S2 is occupied through 2026-10-15 exclusive."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-4429", project_name: "Buffer Reach", installed_capacity_mw: 14.0, base_annual_generation_mwh: 250000, license_expiration_date: "2033-12-31" }
              as: Regulator
              captures: { proj: $.data.id }
