      - name: corner_guarded_placement_requires_a_printed_label_and_a_placed_task
        claim_type: guarded_transitions
        grounds:
          - state_machines.LabelTask.placement_status_UNPLACED_to_PLACED
          - errors.ERR_LABEL_NOT_PRINTED
          - errors.ERR_LABEL_TASK_INVALID_STATE
        distinguishing_aspect: "The two LabelTask axes guard each other: placing while print_status == NOT_PRINTED is ERR_LABEL_NOT_PRINTED (409), whereas verifying while placement_status == UNPLACED is ERR_LABEL_TASK_INVALID_STATE (409) — a cross-axis guard and an own-axis guard with different codes."
        test_recipe:
          setup:
            - "A DISTRIBUTED file with one line and one LabelTask on aisle A01, assigned to certified la1; nothing printed or placed yet."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
