          Metric under test is the materiality percentage on POST /payroll/gross-to-net-runs:
          variance_pct lands on exactly 5.00 against a materiality_pct of 5.00 with an
          absolute move of 500000 against a floor of 100000, so the inclusive comparison
          must escalate. A strict greater-than would clear the run, and 5.00 is still below
          the 10.00 incident threshold, so the boundary shows up as ESCALATED with zero
          incidents.
