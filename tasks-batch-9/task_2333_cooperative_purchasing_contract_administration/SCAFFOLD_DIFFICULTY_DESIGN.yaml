  # =====================================================================================
  # RULE 3 - non_linear_state_machine
  # =====================================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: member_docs_request_cycle_exhausts_at_three_rounds_yet_verify_remains_open
        grounds:
          - state_machines.MemberAgency.registration_status.PENDING_VERIFICATION_to_DOCS_REQUESTED
          - state_machines.MemberAgency.registration_status.DOCS_REQUESTED_to_PENDING_VERIFICATION
          - state_machines.MemberAgency.registration_status.PENDING_VERIFICATION_to_ACTIVE
          - entities.MemberAgency.fields.docs_request_count
          - errors.ERR_DOCS_REQUEST_ROUNDS_EXHAUSTED
        distinguishing_aspect: |
          The machine is a bounded cycle whose counter advances on the RETURN leg
          (RESUBMIT_DOCS), not on the outbound leg, so REQUEST_DOCS succeeds on rounds 1, 2
          and 3 and fails only on the fourth attempt with docs_request_count == 3. Exhausting
          the cycle does NOT lock the entity: the very next call, VERIFY from the same
          PENDING_VERIFICATION state, still succeeds. A linear reading (counter on the
          outbound leg, or exhaustion as a terminal condition) fails one of the two halves.
        test_recipe:
          setup:
            - "StateLawRule row exists for TX."
            - "MemberAgency Sandia Valley Water District (TX, SPECIAL_DISTRICT) has just been created, so registration_status == PENDING_VERIFICATION and docs_request_count == 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CoopAdministrator
            - call: "POST /coop/state-law-rules"
              payload: { state_code: "TX", piggyback_doctrine: "STATUTORY_STRICT", min_notice_days: 14, requires_lead_agency_in_state: false, allows_nonprofit_participation: true, max_contract_term_months: 60, requires_local_solicitation_waiver: false, reciprocity_state_codes: [] }
              as: CoopAdministrator
            - call: "POST /coop/member-agencies"
              payload: { legal_name: "Sandia Valley Water District", state_code: "TX", member_category: "SPECIAL_DISTRICT", annual_spend_ceiling_cents: 10000000, governing_body_resolution_number: "RES-SV-2026-001" }
              as: CoopAdministrator
              as_user_id: "adm-intake-01"
