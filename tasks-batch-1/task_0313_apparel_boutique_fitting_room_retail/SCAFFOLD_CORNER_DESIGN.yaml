        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[markdown-create-stale-style]", "errors[ERR_STALE_STYLE_VERSION]"]
        distinguishing_aspect: "Creating a markdown with expected_style_version one behind the current Style.version (after a prior create bumped it) returns ERR_STALE_STYLE_VERSION (412)."
        test_recipe:
          setup: ["A style at version v0; one markdown created (bumps Style.version); a second create reuses the stale v0."]
          setup_api_calls:
            - call: "POST /boutiques"
              payload: { name: "Bq23", state_code: "CA", tax_rate_bps: 875 }
              as: StoreManager
              captures: { bq: $.data.id }
            - call: "POST /styles"
              payload: { boutique_id: "${bq}", style_code: "ST-23", name: "X", category: "TOPS", season: "SPRING", list_price_cents: 8000 }
              as: Merchandiser
              captures: { st: $.data.id, v0: $.data.version }
            - call: "POST /markdown-schedules"
              payload: { style_id: "${st}", phase: "SEASONAL", markdown_pct: 20, effective_date: 0, expected_style_version: "${v0}" }
              as: Merchandiser
          trigger:
            - call: "POST /markdown-schedules"
              payload: { style_id: "${st}", phase: "SEASONAL", markdown_pct: 30, effective_date: 0, expected_style_version: "${v0}" }
              as: Merchandiser
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_STALE_STYLE_VERSION"
            - "response.status == 412"

      - name: occ_correct_style_version_succeeds_and_supersedes
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[markdown-create-stale-style]", "state_machines.MarkdownSchedule.SCHEDULED_to_SUPERSEDED"]
        distinguishing_aspect: "Re-reading Style.version after the first markdown create and passing the fresh version on a second create succeeds (201) and SUPERSEDES the prior DRAFT schedule."
        test_recipe:
          setup: ["Style at v0; first markdown created (now version v1); read v1; second create with v1."]
          setup_api_calls:
            - call: "POST /boutiques"
              payload: { name: "Bq24", state_code: "CA", tax_rate_bps: 875 }
