  - name: guard_sourcing_and_resubmission_are_shared_by_coordinator_and_liaison
    claim_type: shared_operations
    grounds:
    - roles.StaffingCoordinator.shared_operations
    - roles.SubcontractorLiaison.shared_operations
    - roles.SubcontractorLiaison.identity
    - endpoints[POST /event-security/guards]
    distinguishing_aspect: |
      Guard creation and SUBMIT_FOR_REVIEW are the only operations shared between an opaque role and an entity_backed one, so the positive claim is that BOTH callers reach the identical outcome on the identical endpoint — the liaison acting as its own vendor id creates a SUBCONTRACTED guard exactly as the coordinator does — while the auditor-only verbs stay closed to both. A role table that keys sourcing on the opaque role alone locks the vendor out of its own roster.
    test_recipe:
      setup:
      - logical clock at 2026-09-01T00:00:00Z
      - one APPROVED Subcontractor "Vanguard Protective" (license SC-3001, insurance_expires_on 2027-06-30T00:00:00Z, markup_pct 0.18)
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: SystemOperator
      - call: POST /event-security/subcontractors
        payload:
          company_name: Vanguard Protective
          license_number: SC-3001
          insurance_expires_on: '2027-06-30T00:00:00Z'
          markup_pct: 0.18
        as: CredentialAuditor
        captures:
          sub_id: $.data.id
      - call: POST /event-security/subcontractors/${sub_id}/decision
        payload:
          action: APPROVE
        as: CredentialAuditor
      trigger:
      - call: POST /event-security/guards
        payload:
          full_name: Vendor Hand A
          employment_type: SUBCONTRACTED
          credential_level: 1
          license_number: GC-5001
          credential_expires_on: '2026-12-31T00:00:00Z'
          base_hourly_rate_cents: 2400
          subcontractor_id: ${sub_id}
        as: StaffingCoordinator
        captures:
          gv1_id: $.data.id
      - call: POST /event-security/guards
        payload:
          full_name: Vendor Hand B
          employment_type: SUBCONTRACTED
          credential_level: 1
          license_number: GC-5002
          credential_expires_on: '2026-12-31T00:00:00Z'
          base_hourly_rate_cents: 2400
          subcontractor_id: ${sub_id}
        as: SubcontractorLiaison
        as_user_id: ${sub_id}
        captures:
          gv2_id: $.data.id
      - call: POST /event-security/guards/${gv2_id}/credential-verification
        payload:
          action: SUBMIT_FOR_REVIEW
        as: SubcontractorLiaison
        as_user_id: ${sub_id}
      - call: POST /event-security/guards/${gv2_id}/credential-verification
        payload:
          action: VERIFY
        as: CredentialAuditor
      - call: GET /event-security/guards
        payload:
          subcontractor_id: ${sub_id}
        as: SubcontractorLiaison
        as_user_id: ${sub_id}
      - call: GET /event-security/subcontractors/${sub_id}
        payload: {}
        as: SubcontractorLiaison
        as_user_id: ${sub_id}
      assert:
      - the coordinator-sourced SUBCONTRACTED guard returns 201 with employment_type == SUBCONTRACTED, subcontractor_id == ${sub_id} and verification_status == UNVERIFIED
      - the liaison-sourced guard, created under X-User-ID == ${sub_id} with a matching subcontractor_id, also returns 201 with the identical field shape — the shared operation is genuinely shared
      - SUBMIT_FOR_REVIEW by the liaison returns 200 with Guard.${gv2_id}.verification_status == PENDING_REVIEW
      - VERIFY by the CredentialAuditor returns 200 with Guard.${gv2_id}.verification_status == VERIFIED
      - the liaison's guard listing filtered by its own subcontractor_id returns total_count == 2
      - Subcontractor.${sub_id}.verified_guard_count == 1 and status == APPROVED — only the verified guard is counted
- section: cross_cutting_complexity_layers
  instances:
  - name: occ_event_profile_update_rejects_stale_expected_event_version
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[rule_id=event-profile-update-stale]
    - endpoints[PATCH /event-security/security-events/{id}]
    - validations[priority=9]
    - errors.ERR_STALE_EVENT_VERSION
    distinguishing_aspect: |
      This is the §1.2.1 rule whose parent and target are the SAME row, so the version the client supplies is the version of the record it is editing — the replayed request is byte-identical to the accepted one and must still be refused, which is exactly the lost-update that a last-writer-wins PATCH silently accepts. The two successive box-office updates also pin that version advances by one per accepted write.
    test_recipe:
      setup:
      - logical clock at 2026-09-01T00:00:00Z
      - Venue "Harbor Arena" (gross_capacity 8000, door_count 1) with zones ZF (FLOOR, 200 sqm), ZI (CONCOURSE, 100 sqm, ingress) and ZE (EXIT_CORRIDOR, 50 sqm); SecurityEvent with expected_attendance 200,
        doors_open_at 2026-09-12T17:00:00Z, event_start_at 18:30:00Z, event_end_at 22:30:00Z; RiskAssessment APPROVED at version 3 (composite_threat_score 3.75, T1, required_total_staff 5, required_supervisors
        1, required_screening_lanes 2, minimum_staffing_cost_floor_cents 36000); logical clock 2026-09-01T00:00:00Z
      - the event's version has been read into ${event_v} after the assessment approval cascade
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: SystemOperator
      - call: POST /event-security/venues
        payload:
          name: Harbor Arena
          gross_capacity: 8000
          door_count: 1
          egress_capacity_per_minute: 500
          perimeter_length_m: 400
          alcohol_licensed: false
          prior_incident_rate: 0
        as: SecurityDirector
        captures:
          venue_id: $.data.id
      - call: POST /event-security/venues/${venue_id}/zones
        payload:
          zone_code: ZF
          zone_type: FLOOR
          floor_area_sqm: 200
          posted_capacity: 300
          exit_units: 3
          post_slot_capacity: 12
          is_ingress_zone: false
        as: SecurityDirector
        captures:
          zf_id: $.data.id
      - call: POST /event-security/venues/${venue_id}/zones
        payload:
          zone_code: ZI
          zone_type: CONCOURSE
          floor_area_sqm: 100
          posted_capacity: 150
          exit_units: 2
          post_slot_capacity: 12
          is_ingress_zone: true
        as: SecurityDirector
        captures:
          zi_id: $.data.id
      - call: POST /event-security/venues/${venue_id}/zones
        payload:
          zone_code: ZE
          zone_type: EXIT_CORRIDOR
          floor_area_sqm: 50
          posted_capacity: 80
          exit_units: 1
          post_slot_capacity: 6
          is_ingress_zone: false
        as: SecurityDirector
        captures:
          ze_id: $.data.id
      - call: POST /event-security/security-events
        payload:
          venue_id: ${venue_id}
          event_name: Autumn Gala
          event_type: CONCERT
          doors_open_at: '2026-09-12T17:00:00Z'
          event_start_at: '2026-09-12T18:30:00Z'
          event_end_at: '2026-09-12T22:30:00Z'
          expected_attendance: 200
          alcohol_served: false
          vip_present: false
        as: SecurityDirector
        captures:
          event_id: $.data.id
      - call: POST /event-security/security-events/${event_id}/risk-assessments
        payload:
          threat_level_input: LOW
          protest_likelihood: NONE
          crowd_profile: SEATED
          ingress_door_count: 1
          layout_complexity_score: 1
          history_incident_rate: 0
        as: RiskAnalyst
        as_user_id: analyst-1
        captures:
          ra_id: $.data.id
      - call: POST /event-security/risk-assessments/${ra_id}/decision
        payload:
          action: SUBMIT
        as: RiskAnalyst
        as_user_id: analyst-1
      - call: POST /event-security/risk-assessments/${ra_id}/decision
        payload:
          action: APPROVE
        as: SecurityDirector
        as_user_id: director-1
      - call: GET /event-security/security-events/${event_id}
        payload: {}
        as: SecurityDirector
        captures:
          event_v: $.data.version
      trigger:
      - call: PATCH /event-security/security-events/${event_id}
        payload:
          expected_event_version: ${event_v}
          ticketed_attendance: 400
        as: SecurityDirector
        as_user_id: director-1
      - call: PATCH /event-security/security-events/${event_id}
        payload:
          expected_event_version: ${event_v}
          ticketed_attendance: 500
        as: SecurityDirector
        as_user_id: director-1
      - call: GET /event-security/security-events/${event_id}
        payload: {}
        as: SecurityDirector
        captures:
          event_v2: $.data.version
      - call: PATCH /event-security/security-events/${event_id}
        payload:
          expected_event_version: ${event_v2}
          vip_present: true
        as: SecurityDirector
        as_user_id: director-1
      - call: PATCH /event-security/security-events/${event_id}
        payload:
          expected_event_version: ${event_v2}
          alcohol_served: true
        as: SecurityDirector
        as_user_id: director-1
      - call: GET /event-security/security-events/${event_id}
        payload: {}
        as: SecurityDirector
        as_user_id: director-1
      assert:
      - the first PATCH returns 200 with SecurityEvent.${event_id}.ticketed_attendance == 400 and version incremented by exactly 1 over ${event_v}
      - the second PATCH, replaying the now-stale ${event_v}, returns 412 with data.error_id == "ERR_STALE_EVENT_VERSION" and ticketed_attendance is still 400 — the lost update is refused, not applied
      - the re-read supplies ${event_v2}, and the PATCH carrying it returns 200 with vip_present == true
      - the second PATCH carrying the now-consumed ${event_v2} returns 412 with data.error_id == "ERR_STALE_EVENT_VERSION" and alcohol_served is still false — one version value authorises exactly one write
      - the final read shows ticketed_attendance == 400, vip_present == true, alcohol_served == false and a version exactly 2 greater than ${event_v}
      - SecurityEvent.${event_id}.status is still RISK_ASSESSED throughout — the OCC check is independent of the lifecycle
  - name: occ_plan_create_rejects_stale_expected_event_version
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[rule_id=plan-create-stale-event]
    - endpoints[POST /event-security/security-events/{id}/staffing-plans]
    - validations[priority=9]
    - errors.ERR_STALE_EVENT_VERSION
    - state_machines.StaffingPlan.DRAFT_to_SUPERSEDED
    distinguishing_aspect: |
      This is the only §1.2.1 rule where the OCC field guards a CREATE on a child rather than an update, and the reason is destructive: an accepted create supersedes the event's prior DRAFT plan. So the claim is that a writer whose view of the event is stale is refused BEFORE any supersede happens — the pre-existing plan must still be DRAFT and is_current after the 412, which is what separates a real precondition check from one applied after the cascade.
    test_recipe:
      setup:
      - logical clock at 2026-09-01T00:00:00Z
