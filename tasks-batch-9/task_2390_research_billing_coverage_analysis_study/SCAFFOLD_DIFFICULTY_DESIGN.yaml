  # =========================================================================
  # RULE 3 - non_linear_state_machine
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: analysis_return_loop_closes_twice_then_is_bounded
        grounds: "§1.2 CoverageAnalysis transitions DRAFT -> UNDER_REVIEW -> RETURNED -> DRAFT with the RETURNED -> DRAFT edge triggered by POST /research-billing/coverage-items; §1.4 priority 31 and §1.6 ERR_RETURN_LIMIT_EXCEEDED; constant ANALYSIS_MAX_RETURNS 2."
        distinguishing_aspect: "The cycle is genuine (the analysis re-enters DRAFT, a state it has already occupied, and can be resubmitted) but bounded by a counter that only the RETURN edge increments, not the DRAFT re-entry. A linear implementation forbids the second submit; an unbounded cyclic implementation accepts a third return. Only a bounded cycle produces: return_count 1, back to DRAFT, return_count 2, back to DRAFT, third return refused with the analysis left in UNDER_REVIEW rather than RETURNED."
        test_recipe:
          setup:
            - "One study with one coverage analysis that is submitted and returned twice, being reopened to DRAFT by adding a fresh item each time, and submitted a third time so that it sits in UNDER_REVIEW with return_count == 2."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-F", title: "Return-loop probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v1}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", analysis_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v1}", item_code: "36415", description: "Research blood draw", classification: "RESEARCH_PAID", medicare_coverage_basis: "NOT_COVERED", budget_category: "PER_PATIENT", charge_master_unit_cents: 5000, negotiated_unit_cents: 3000, units_per_occurrence: 1, expected_occurrences: 4 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/return"
              payload: { return_reason: "Item 36415 needs a payer-coverage citation" }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
              captures: { return_count_after_first: "$.data.return_count", analysis_v_after_first_return: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v_after_first_return}", item_code: "80053", description: "Comprehensive metabolic panel", classification: "ROUTINE_CARE", medicare_coverage_basis: "STANDARD_OF_CARE", budget_category: "PER_PATIENT", charge_master_unit_cents: 9000, negotiated_unit_cents: 9000, units_per_occurrence: 1, expected_occurrences: 3 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/return"
              payload: { return_reason: "Metabolic panel frequency does not match the protocol" }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
              captures: { return_count_after_second: "$.data.return_count", analysis_v_after_second_return: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v_after_second_return}", item_code: "71260", description: "CT abdomen with contrast", classification: "RESEARCH_PAID", medicare_coverage_basis: "NOT_COVERED", budget_category: "PER_PATIENT", charge_master_unit_cents: 200000, negotiated_unit_cents: 180000, units_per_occurrence: 1, expected_occurrences: 2 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
          trigger:
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/return"
              payload: { return_reason: "Third pass - still not acceptable" }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
              captures: { observed_error: "$.data.error_id" }
          assert:
            - "the first return in setup returned return_count == 1 and status == \"RETURNED\""
            - "adding item 80053 to the RETURNED analysis moved status back to \"DRAFT\" (the cycle closes) and left return_count == 1"
            - "the second return returned return_count == 2 and status == \"RETURNED\"; adding item 71260 moved it to \"DRAFT\" again"
            - "trigger response 409 with error_id == \"ERR_RETURN_LIMIT_EXCEEDED\""
            - "GET /research-billing/coverage-analyses/${analysis_id} after the trigger shows status == \"UNDER_REVIEW\" (not RETURNED), return_count == 2, item_count == 3, and return_reason still the second reason"
            - "POST /research-billing/coverage-analyses/${analysis_id}/approve by reviewer_2 afterwards still succeeds - the bound blocks only the return edge, not the escape from the cycle"

      - name: charge_routing_and_billing_dimensions_move_independently
        grounds: "§1.2 Charge carries the parallel dimensions routing_state (RT-1..RT-3) and billing_state (BL-1..BL-5); §1.3 calculations.sponsor_invoice_line_selection eligibility requires the pair (ROUTED_SPONSOR, UNBILLED)."
        distinguishing_aspect: "The two dimensions are neither independent nor locked: HOLD_FOR_SPONSOR moves routing_state alone and deliberately leaves billing_state UNBILLED, NO_CHARGE_PROMOTIONAL moves both in one step (ROUTED_NONE + WRITTEN_OFF), and invoice submission moves billing_state alone while routing_state stays ROUTED_SPONSOR forever. An implementation collapsing them into one status field cannot express the invoiceable pair (ROUTED_SPONSOR, UNBILLED) at all, and one treating them as fully independent lets the promotional write-off leave billing_state UNBILLED."
        test_recipe:
          setup:
            - "An INDUSTRY_SPONSORED study with a qualifying QCT determination and an approved analysis carrying one sponsor-paid item (J9999, negotiated 40000) and one promotional item (99213, negotiated 0, NOT_BUDGETED). Two interface charges are posted: 40000 for J9999 and 0 for 99213. The sponsor charge is reviewed HOLD_FOR_SPONSOR, the promotional charge NO_CHARGE_PROMOTIONAL, and a DRAFT sponsor invoice is raised."
