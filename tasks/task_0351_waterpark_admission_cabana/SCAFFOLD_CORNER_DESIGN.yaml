      - name: checkin_without_bound_guest_returns_guest_not_bound
        claim_type: Cross-entity validation
        grounds: ["validations[priority=8]", "errors[ERR_GUEST_NOT_BOUND]"]
        distinguishing_aspect: "Check-in on a CONFIRMED admission that has no bound guest_id returns ERR_GUEST_NOT_BOUND."
        test_recipe:
