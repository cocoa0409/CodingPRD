        excluded_because:
          difficulty_instance: throughput_certified_best_window_versus_as_tested_full_series
          rationale: "The §1.8 dual_variant_calc instance already runs one four-run series through both variants, asserts 66.06 against 63.22 and re-runs a three-run series where the two variants coincide."

      - name: price_variant_reconciliation_on_release
        claim_type: Reconciliation
        excluded_because:
          difficulty_instance: config_pricing_indicative_versus_firm_diverge_by_undiscounted_branding
          rationale: "The §1.8 dual_variant_calc instance already asserts the indicative figure, the firm figure stamped at release, and that their delta equals the undiscounted BRANDING_KIT_CENTS."

