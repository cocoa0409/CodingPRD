# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Scenario 2404 — Children's Online Privacy Compliance
#
# 9 rule_ids x >= 2 instances = 23 instances.
# Every `grounds:` ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# Every numeric assert below was computed by executing the referenced
# calculations[].formula with its declared constants (contract item 7):
#   design_factor_weighted_score: contributions rounded to 2dp BEFORE summation
#     {SUBJECT_MATTER MODERATE}                                    -> 0.60
#     {SUBJECT_MATTER STRONG}                                      -> 1.00
#     {SUBJECT_MATTER INCIDENTAL}                                  -> 0.25
#     {VISUAL_CONTENT ABSENT}                                      -> 0.00
#     {SM MODERATE, CHILD_CELEBRITIES INCIDENTAL, LANGUAGE INCIDENTAL}
#         pinned 0.33+0.07+0.05 = 0.45   (naive single-round = 0.44)
#     {SM MODERATE, VISUAL_CONTENT STRONG, CHILD_CELEBRITIES MODERATE,
#      INTERACTIVE_DESIGN STRONG}
#         pinned 0.26+0.29+0.13+0.07 = 0.75  (naive single-round = 0.74)
#     {SM MODERATE, VISUAL_CONTENT STRONG}                         -> 0.76
#   audience_child_share: summed numerator / summed denominator, 4dp
#     600/4000 = 0.1500 | 800/4000 = 0.2000 | 799/4000 = 0.1998 | 4000/10000 = 0.4000
#   clock arithmetic from the 2026-08-01T00:00:00Z default
#     +14d = 2026-08-15T00:00:00Z | +30d = 2026-08-31T00:00:00Z
#     +365d = 2027-08-01T00:00:00Z | 2027-08-01 +30d = 2027-08-31T00:00:00Z
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: determination_variant_divergence_audience_first_vs_design_first
        grounds:
          - calculations.child_directed_determination
          - calculations.audience_child_share
          - calculations.design_factor_weighted_score
          - entities.OnlineService.fields.determination_variant_applied
          - entities.DeterminationEvidence.fields.sample_verified
          - state_machines.OnlineService.determination_status=NOT_ASSESSED_to_determination_status=GENERAL_AUDIENCE|MIXED_AUDIENCE|CHILD_DIRECTED_PRIMARY
        distinguishing_aspect: |
          Two services carry byte-identical design evidence (SUBJECT_MATTER STRONG, design_score
          1.00) and byte-identical audience numbers (4000 total / 600 under 13); the ONLY
          difference is measurement_method PANEL vs AGE_SCREEN_LOG, which decides the variant, and
          the variants disagree on the outcome: AUDIENCE_FIRST caps at MIXED_AUDIENCE (0.1500 is
          below both share thresholds, design only escalates) while DESIGN_FIRST reaches
          CHILD_DIRECTED_PRIMARY on the very same design_score of 1.00.
        test_recipe:
          setup:
            - "Logical clock at the 2026-08-01T00:00:00Z default."
            - "Service A and service B both registered, both NOT_ASSESSED, both posture OPEN."
            - "Both services carry exactly one DESIGN_FACTOR row: SUBJECT_MATTER / STRONG."
            - "Service A additionally carries a verified PANEL sample over [2026-06-01, 2026-07-01): total_users 4000, users_under_13 600."
            - "Service B additionally carries a verified AGE_SCREEN_LOG sample with the SAME period and the SAME numbers."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Bubble Bunny World", operator_organization: "Bunny Media LLC", service_category: "GAME", subject_matter_code: "CHILD_ENTERTAINMENT" }
              as: ComplianceOfficer
              captures: { svc_a: $.data.id }
            - call: "POST /online-services"
              payload: { name: "Bubble Bunny Clips", operator_organization: "Bunny Media LLC", service_category: "VIDEO_PLATFORM", subject_matter_code: "CHILD_ENTERTAINMENT" }
              as: ComplianceOfficer
              captures: { svc_b: $.data.id }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_a}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "STRONG", evidence_note: "cartoon animal world" }
              as: ComplianceOfficer
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_a}", evidence_kind: "AUDIENCE_SAMPLE", measurement_method: "PANEL", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", total_users: 4000, users_under_13: 600, sample_verified: true }
              as: ComplianceOfficer
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_b}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "STRONG", evidence_note: "same cartoon animal world" }
              as: ComplianceOfficer
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_b}", evidence_kind: "AUDIENCE_SAMPLE", measurement_method: "AGE_SCREEN_LOG", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", total_users: 4000, users_under_13: 600, sample_verified: true }
              as: ComplianceOfficer
          trigger:
            - call: "POST /online-services/${svc_a}/determination"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /online-services/${svc_b}/determination"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "OnlineService.${svc_a}.determination_variant_applied == AUDIENCE_FIRST"
            - "OnlineService.${svc_a}.audience_child_share == 0.1500"
            - "OnlineService.${svc_a}.design_score == 1.00"
            - "OnlineService.${svc_a}.determination_status == MIXED_AUDIENCE"
            - "OnlineService.${svc_b}.determination_variant_applied == DESIGN_FIRST"
            - "OnlineService.${svc_b}.audience_child_share == null"
            - "OnlineService.${svc_b}.design_score == 1.00"
            - "OnlineService.${svc_b}.determination_status == CHILD_DIRECTED_PRIMARY"
            - "The two services differ ONLY in measurement_method, yet determination_status differs: MIXED_AUDIENCE vs CHILD_DIRECTED_PRIMARY"
            - "OnlineService.${svc_a}.determination_evaluated_at == 2026-08-01T00:00:00Z"
            - "OnlineService.${svc_a}.compliance_posture == OPEN and OnlineService.${svc_b}.compliance_posture == OPEN (the determination axis alone moves no posture)"

      - name: rights_scope_variant_divergence_parent_consent_vs_child_identity
        grounds:
          - calculations.rights_request_scope_resolution
          - entities.ParentalRightsRequest.fields.scope_mode
          - entities.ParentalRightsRequest.fields.in_scope_record_count
          - entities.ChildDataRecord.fields.child_pseudonym
          - state_machines.ParentalRightsRequest.VERIFIED_to_FULFILLED
        distinguishing_aspect: |
          One child pseudonym "child-014" holds two independent GRANTED consents (two different
          parent_email values, so neither supersedes the other) with one collected record each;
          fulfilling a REVIEW right under PARENT_CONSENT_SCOPE reports in_scope_record_count == 1
          while the same right under CHILD_IDENTITY_SCOPE reports 2 over the identical record set,
          and because right_type is REVIEW both records stay COLLECTED so the delta is attributable
          to the variant alone, not to a mutation.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; service MIXED_AUDIENCE (design_score 0.60) with an ACTIVE neutral age screen."
            - "Activity AVATAR_BUILDER whitelists SCREEN_NAME; a retention schedule covers (SCREEN_NAME, PARTICIPATION_CORE)."
            - "Notice published with all 7 content keys."
            - "Consent 1: parent_email guardian.one@x.test, child_pseudonym child-014, KNOWLEDGE_BASED_AUTH, GRANTED."
            - "Consent 2: parent_email guardian.two@x.test, SAME child_pseudonym child-014, KNOWLEDGE_BASED_AUTH, GRANTED."
            - "One SCREEN_NAME record collected under each consent (live_child_data_element_count == 2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Avatar Isle", operator_organization: "Isle Interactive Inc", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "MODERATE" }
              as: ComplianceOfficer
            - call: "POST /online-services/${svc_id}/determination"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /age-screens"
              payload: { service_id: "${svc_id}", mechanism: "NEUTRAL_DOB_ENTRY", retry_allowed_on_fail: false, outcome_session_persisted: true }
              as: PrivacyEngineer
              captures: { screen_id: $.data.id }
            - call: "POST /age-screens/${screen_id}/status"
              payload: { to_status: "IN_REVIEW" }
              as: PrivacyEngineer
            - call: "POST /age-screens/${screen_id}/status"
              payload: { to_status: "ACTIVE", review_note: "neutral DOB entry, no prefill" }
              as: ComplianceOfficer
            - call: "POST /activities"
              payload: { service_id: "${svc_id}", activity_code: "AVATAR_BUILDER", participation_required_elements: ["SCREEN_NAME"] }
              as: ComplianceOfficer
              captures: { act_id: $.data.id }
            - call: "POST /retention-schedules"
              payload: { service_id: "${svc_id}", data_element_code: "SCREEN_NAME", purpose_code: "PARTICIPATION_CORE", retention_days: 30, disposal_method: "ANONYMIZE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", defined_purpose_statement: "Screen name retained for the duration of avatar play." }
              as: ComplianceOfficer
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv1: $.data.version }
            - call: "POST /parental-notices"
              payload: { service_id: "${svc_id}", notice_label: "Direct notice r1", delivery_channel: "EMAIL", content_keys: ["OPERATOR_IDENTITY_CONTACT", "ELEMENTS_COLLECTED", "USE_PURPOSES", "THIRD_PARTY_DISCLOSURE", "PARENTAL_RIGHTS", "NO_CONDITIONING_OF_PARTICIPATION", "RETENTION_AND_DISPOSAL"], expected_service_version: "${sv1}" }
              as: ComplianceOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /parental-notices/${notice_id}/publish"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv2: $.data.version }
            - call: "POST /consent-requests"
              payload: { service_id: "${svc_id}", notice_id: "${notice_id}", parent_email: "guardian.one@x.test", child_pseudonym: "child-014", intended_uses: ["PARTICIPATION_CORE"], consent_method: "KNOWLEDGE_BASED_AUTH", expected_service_version: "${sv2}" }
              as: ComplianceOfficer
              captures: { consent_1: $.data.id }
            - call: "POST /consent-requests/${consent_1}/status"
              payload: { to_status: "NOTICE_DELIVERED" }
              as: ComplianceOfficer
            - call: "POST /consent-requests/${consent_1}/status"
              payload: { to_status: "PENDING_VERIFICATION" }
              as: ComplianceOfficer
            - call: "POST /consent-requests/${consent_1}/status"
              payload: { to_status: "GRANTED", verification_evidence_code: "KBA-OK-1" }
              as: ComplianceOfficer
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv3: $.data.version }
            - call: "POST /consent-requests"
              payload: { service_id: "${svc_id}", notice_id: "${notice_id}", parent_email: "guardian.two@x.test", child_pseudonym: "child-014", intended_uses: ["PARTICIPATION_CORE"], consent_method: "KNOWLEDGE_BASED_AUTH", expected_service_version: "${sv3}" }
              as: ComplianceOfficer
              captures: { consent_2: $.data.id }
            - call: "POST /consent-requests/${consent_2}/status"
              payload: { to_status: "NOTICE_DELIVERED" }
              as: ComplianceOfficer
            - call: "POST /consent-requests/${consent_2}/status"
              payload: { to_status: "PENDING_VERIFICATION" }
              as: ComplianceOfficer
            - call: "POST /consent-requests/${consent_2}/status"
              payload: { to_status: "GRANTED", verification_evidence_code: "KBA-OK-2" }
              as: ComplianceOfficer
            - call: "POST /child-data-records"
              payload: { service_id: "${svc_id}", consent_request_id: "${consent_1}", activity_id: "${act_id}", data_element_code: "SCREEN_NAME", purpose_code: "PARTICIPATION_CORE", age_screen_outcome: "UNDER_13" }
              as: PrivacyEngineer
              captures: { rec_1: $.data.id }
            - call: "POST /child-data-records"
              payload: { service_id: "${svc_id}", consent_request_id: "${consent_2}", activity_id: "${act_id}", data_element_code: "SCREEN_NAME", purpose_code: "PARTICIPATION_CORE", age_screen_outcome: "UNDER_13" }
              as: PrivacyEngineer
              captures: { rec_2: $.data.id }
            - call: "POST /parental-rights-requests"
              payload: { service_id: "${svc_id}", consent_request_id: "${consent_1}", right_type: "REVIEW", requester_email: "guardian.one@x.test" }
              as: Parent
              as_user_id: "${consent_1}"
              captures: { rr_1: $.data.id }
            - call: "POST /parental-rights-requests/${rr_1}/status"
              payload: { to_status: "VERIFYING", verification_method: "GOVT_ID_MATCH" }
              as: ComplianceOfficer
            - call: "POST /parental-rights-requests/${rr_1}/status"
              payload: { to_status: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /parental-rights-requests"
              payload: { service_id: "${svc_id}", consent_request_id: "${consent_2}", right_type: "REVIEW", requester_email: "guardian.two@x.test" }
              as: Parent
              as_user_id: "${consent_2}"
              captures: { rr_2: $.data.id }
            - call: "POST /parental-rights-requests/${rr_2}/status"
              payload: { to_status: "VERIFYING", verification_method: "GOVT_ID_MATCH" }
              as: ComplianceOfficer
            - call: "POST /parental-rights-requests/${rr_2}/status"
              payload: { to_status: "VERIFIED" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /parental-rights-requests/${rr_1}/status"
              payload: { to_status: "FULFILLED", scope_mode: "PARENT_CONSENT_SCOPE" }
              as: ComplianceOfficer
              captures: { n_parent_scope: $.data.in_scope_record_count }
            - call: "POST /parental-rights-requests/${rr_2}/status"
              payload: { to_status: "FULFILLED", scope_mode: "CHILD_IDENTITY_SCOPE" }
              as: ComplianceOfficer
              captures: { n_identity_scope: $.data.in_scope_record_count }
          assert:
            - "ParentalRightsRequest.${rr_1}.scope_mode == PARENT_CONSENT_SCOPE"
            - "ParentalRightsRequest.${rr_1}.in_scope_record_count == 1"
            - "ParentalRightsRequest.${rr_2}.scope_mode == CHILD_IDENTITY_SCOPE"
            - "ParentalRightsRequest.${rr_2}.in_scope_record_count == 2"
            - "${n_identity_scope} - ${n_parent_scope} == 1 (the delta is exactly the record held under the other parent's consent)"
            - "ChildDataRecord.${rec_1}.status == COLLECTED and ChildDataRecord.${rec_2}.status == COLLECTED (right_type=REVIEW mutates nothing)"
            - "ChildDataRecord.${rec_1}.child_pseudonym == child-014 and ChildDataRecord.${rec_2}.child_pseudonym == child-014"
            - "OnlineService.${svc_id}.live_child_data_element_count == 2"
            - "OnlineService.${svc_id}.lifetime_collected_element_count == 2"
            - "ConsentRequest.${consent_1}.status == GRANTED and ConsentRequest.${consent_2}.status == GRANTED (REVIEW triggers no revocation cascade)"
            - "OnlineService.${svc_id}.active_consent_count == 2"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: design_score_rounding_order_flips_two_determination_thresholds
        grounds:
          - calculations.design_factor_weighted_score
          - calculations.child_directed_determination
          - entities.OnlineService.fields.design_score
          - entities.DeterminationEvidence.fields.factor_code
          - entities.DeterminationEvidence.fields.rating
        distinguishing_aspect: |
          The renormalised-weight formula is combinatorial in the SET of factor_codes present
          (present_points is the sum of only the present factors' points, so adding a factor
          re-weights every other factor) AND the rounding ORDER is load-bearing: rounding each
          contribution to 2dp before summation yields exactly 0.45 and 0.75 on the two fixtures,
          while the rejected sum-then-round order yields 0.44 and 0.74 — flipping
          GENERAL_AUDIENCE/MIXED_AUDIENCE on service C and MIXED_AUDIENCE/CHILD_DIRECTED_PRIMARY
          on service D against the >= 0.45 and >= 0.75 thresholds.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Service C carries three DESIGN_FACTOR rows: SUBJECT_MATTER/MODERATE, CHILD_CELEBRITIES/INCIDENTAL, LANGUAGE/INCIDENTAL (present_points 55)."
            - "Service D carries four DESIGN_FACTOR rows: SUBJECT_MATTER/MODERATE, VISUAL_CONTENT/STRONG, CHILD_CELEBRITIES/MODERATE, INTERACTIVE_DESIGN/STRONG (present_points 70)."
            - "Neither service has any AUDIENCE_SAMPLE row, so both take the DESIGN_FIRST variant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Homework Helper", operator_organization: "Helper Learning Co", service_category: "EDUCATION_APP", subject_matter_code: "CHILD_EDUCATION" }
              as: ComplianceOfficer
              captures: { svc_c: $.data.id }
            - call: "POST /online-services"
              payload: { name: "Star Squad Stream", operator_organization: "Squad Media Co", service_category: "VIDEO_PLATFORM", subject_matter_code: "CHILD_ENTERTAINMENT" }
              as: ComplianceOfficer
              captures: { svc_d: $.data.id }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_c}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "MODERATE" }
              as: ComplianceOfficer
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_c}", evidence_kind: "DESIGN_FACTOR", factor_code: "CHILD_CELEBRITIES", rating: "INCIDENTAL" }
              as: ComplianceOfficer
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_c}", evidence_kind: "DESIGN_FACTOR", factor_code: "LANGUAGE", rating: "INCIDENTAL" }
              as: ComplianceOfficer
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_d}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "MODERATE" }
              as: ComplianceOfficer
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_d}", evidence_kind: "DESIGN_FACTOR", factor_code: "VISUAL_CONTENT", rating: "STRONG" }
              as: ComplianceOfficer
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_d}", evidence_kind: "DESIGN_FACTOR", factor_code: "CHILD_CELEBRITIES", rating: "MODERATE" }
              as: ComplianceOfficer
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_d}", evidence_kind: "DESIGN_FACTOR", factor_code: "INTERACTIVE_DESIGN", rating: "STRONG" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /online-services/${svc_c}/determination"
              payload: {}
              as: ComplianceOfficer
              captures: { score_c: $.data.design_score }
            - call: "POST /online-services/${svc_d}/determination"
              payload: {}
              as: ComplianceOfficer
              captures: { score_d: $.data.design_score }
          assert:
            - "OnlineService.${svc_c}.design_score == 0.45"
            - "OnlineService.${svc_c}.design_score != 0.44 (the rejected sum-then-round order)"
            - "OnlineService.${svc_c}.determination_variant_applied == DESIGN_FIRST"
            - "OnlineService.${svc_c}.determination_status == MIXED_AUDIENCE (0.45 >= DESIGN_MIXED_THRESHOLD 0.45, inclusive)"
            - "OnlineService.${svc_d}.design_score == 0.75"
            - "OnlineService.${svc_d}.design_score != 0.74 (the rejected sum-then-round order)"
            - "OnlineService.${svc_d}.determination_status == CHILD_DIRECTED_PRIMARY (0.75 >= DESIGN_PRIMARY_THRESHOLD 0.75, inclusive)"
            - "OnlineService.${svc_c}.audience_child_share == null and OnlineService.${svc_d}.audience_child_share == null"
            - "GET /online-services/${svc_c}/determination-evidence returns total_count == 3 with evidence_sequence values 1, 2, 3 in ascending order"
            - "GET /online-services/${svc_d}/determination-evidence returns total_count == 4 with evidence_sequence values 1, 2, 3, 4 in ascending order"

      - name: required_tier_pinned_snapshot_vs_live_integration_set
        grounds:
          - calculations.required_consent_tier
          - entities.ConsentRequest.fields.required_tier_at_creation
          - entities.ConsentRequest.fields.method_assurance_tier
          - entities.ThirdPartyIntegration.fields.collects_persistent_identifier
          - validations[priority=90]
          - concurrency_rules[consent-create-stale-service]
        distinguishing_aspect: |
          required_tier_at_creation is a combinatorial max over USE_TIER of intended_uses plus a
          +1 bump from the APPROVED persistent-identifier integration set, snapshotted at creation
          and capped at MAX_TIER 3: consent A (created BEFORE MetricPulse is approved) pins 2 and
          grants successfully with a tier-2 method, while consent B with the IDENTICAL
          intended_uses and the IDENTICAL method (created AFTER the approval) pins 3 and is
          refused at grant time with ERR_CONSENT_METHOD_TIER_INSUFFICIENT — proving the snapshot
          is pinned per row and never re-derived.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; service MIXED_AUDIENCE (design_score 0.60)."
            - "Notice published with all 7 content keys and disclosed_integration_vendors ['MetricPulse']."
            - "Consent A: intended_uses [PARTICIPATION_CORE, CONTESTS_PRIZES], consent_method KNOWLEDGE_BASED_AUTH, created while the service has ZERO approved integrations, advanced to PENDING_VERIFICATION."
            - "Integration MetricPulse: ANALYTICS, collects_persistent_identifier true, placement CHILD_DIRECTED_AREA, moved DECLARED -> AUDIT_PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Puzzle Pals", operator_organization: "Pals Digital Ltd", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "MODERATE" }
              as: ComplianceOfficer
            - call: "POST /online-services/${svc_id}/determination"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv1: $.data.version }
            - call: "POST /parental-notices"
              payload: { service_id: "${svc_id}", notice_label: "Direct notice r1", delivery_channel: "EMAIL", content_keys: ["OPERATOR_IDENTITY_CONTACT", "ELEMENTS_COLLECTED", "USE_PURPOSES", "THIRD_PARTY_DISCLOSURE", "PARENTAL_RIGHTS", "NO_CONDITIONING_OF_PARTICIPATION", "RETENTION_AND_DISPOSAL"], disclosed_integration_vendors: ["MetricPulse"], expected_service_version: "${sv1}" }
              as: ComplianceOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /parental-notices/${notice_id}/publish"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv2: $.data.version }
            - call: "POST /consent-requests"
              payload: { service_id: "${svc_id}", notice_id: "${notice_id}", parent_email: "guardian.a@x.test", child_pseudonym: "child-a1", intended_uses: ["PARTICIPATION_CORE", "CONTESTS_PRIZES"], consent_method: "KNOWLEDGE_BASED_AUTH", expected_service_version: "${sv2}" }
              as: ComplianceOfficer
