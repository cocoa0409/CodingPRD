              as: Director
          trigger:
            - call: "POST /eeoc/investigation-cases/${inv_i1}/interviews"
              payload: { witness_name: "W1", interview_start: "2026-09-10T10:00:00Z", interview_end: "2026-09-10T11:00:00Z", summary: "first" }
              as: Investigator
