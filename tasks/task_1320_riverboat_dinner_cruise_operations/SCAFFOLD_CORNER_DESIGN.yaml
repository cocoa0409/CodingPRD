      - name: computed_read_cruise_reserved_covers
        claim_type: computed_read
        grounds: ["entities.CruiseInstance.fields.reserved_covers", "endpoints[GET /cruises/{cruiseId}]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / coast_guard_capacity_exact_fit_vs_over_by_one
          rationale: "reserved_covers aggregate asserted at 4, 6 (exact fit) in the named §1.8 instance."

  # ===========================================================================
  # Section: errors — triggerability sweep for codes not exercised elsewhere
  # ===========================================================================
  - section: errors
    instances:
      - name: error_stale_version_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]"]
        excluded_because:
          difficulty_instance: occ_stale_version / booking_create_stale_cruise_version
          rationale: "412 path asserted in the named §1.8 instance."

      - name: error_capacity_exceeded_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / coast_guard_capacity_exact_fit_vs_over_by_one
          rationale: "Asserted as the failure of the over-by-one booking in the named §1.8 instance."

      - name: error_manifest_not_frozen_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_MANIFEST_NOT_FROZEN]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cruise_boarding_gated_on_manifest_frozen
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_alcohol_cert_expired_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_ALCOHOL_CERT_EXPIRED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / bartender_confirm_gated_on_staffmember_cert
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_dock_slot_conflict_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_DOCK_SLOT_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / dock_slot_turnaround_buffer_adjacency
          rationale: "Asserted at the 16:44-in-buffer rejection in the named §1.8 instance."

      - name: error_parking_full_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_PARKING_FULL]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / parking_pool_zero_capacity_empty_set_edge
          rationale: "Asserted at 0-capacity and 1-capacity boundaries in the named §1.8 instance."

      - name: error_credits_not_pending_not_triggerable_after_cancel
        claim_type: violation_to_error
        grounds: ["errors[ERR_CREDITS_NOT_PENDING]", "validations[priority=12]"]
        distinguishing_aspect: "ERR_CREDITS_NOT_PENDING guards settle-credits against a partially-cascaded event; reachable only if a covered cruise's bookings are not all REFUND_PENDING — with immediate consistency this is a defensive invariant verified by satisfying the happy path instead (settle succeeds when all REFUND_PENDING)."
        test_recipe:
          setup: ["Weather-cancelled cruise, one PAID booking; event in CANCELLATION_ISSUED"]
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id, cruise_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 1, expected_cruise_version: "${cruise_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_a: $.data.id } }
            - { call: "POST /bookings/${bk_a}/pay", payload: {}, as: Customer, as_user_id: "${cust_a}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T13:00:00Z" }, as: OperationsManager }
            - { call: "POST /weather-events", payload: { severity: "CANCELLATION_REQUIRED", window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-11T00:00:00Z" }, as: OperationsManager, captures: { wev: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/weather-cancel", payload: {}, as: OperationsManager }
          trigger:
            - { call: "POST /weather-events/${wev}/settle-credits", payload: {}, as: OperationsManager }
          assert:
            - "Settle succeeds (satisfaction path): WeatherEvent.${wev}.status == CREDITS_SETTLED"
            - "Booking.${bk_a}.payment_status == CREDITED"

  # ===========================================================================
  # Section: rbac — role denials across the peer/segregation matrix
  # ===========================================================================
  - section: rbac
    instances:
      - name: customer_cannot_create_cruise
        claim_type: rbac_denial
        grounds: ["roles.OperationsManager", "endpoints[POST /cruises]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "Customer role calling POST /cruises is denied 403 ERR_INSUFFICIENT_PERMISSIONS (peer-role resource ownership)."
        test_recipe:
          setup: ["Vessel and tier exist"]
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
          trigger:
            - call: "POST /cruises"
              payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }
              as: Customer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (403)"

      - name: captain_cannot_weather_cancel
        claim_type: rbac_denial
        grounds: ["roles.OperationsManager", "endpoints[POST /cruises/{cruiseId}/weather-cancel]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "Captain (depart/complete/manifest owner) cannot weather-cancel — OperationsManager exclusive."
        test_recipe:
          setup: ["Cruise with covering weather event"]
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id } }
            - { call: "POST /weather-events", payload: { severity: "CANCELLATION_REQUIRED", window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-11T00:00:00Z" }, as: OperationsManager, captures: { wev: $.data.id } }
          trigger:
            - call: "POST /cruises/${cruise_id}/weather-cancel"
              payload: {}
              as: Captain
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (403)"

      - name: charter_sales_agent_cannot_convert
        claim_type: rbac_denial
        grounds: ["roles.CharterSalesAgent", "roles.OperationsManager", "endpoints[POST /charter-inquiries/{inquiryId}/convert]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "The role that quotes (CharterSalesAgent) is barred from converting — segregation of duties at the RBAC level (distinct from the per-user ERR_SEGREGATION_OF_DUTIES rule)."
        test_recipe:
          setup: ["Inquiry ACCEPTED"]
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 60, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id } }
            - { call: "POST /customers", payload: { email: "corp@x.com", full_name: "Corp" }, as: OperationsManager, captures: { cust_c: $.data.id } }
            - { call: "POST /charter-inquiries", payload: { cruise_id: "${cruise_id}", customer_id: "${cust_c}" }, as: CharterSalesAgent, captures: { inq: $.data.id, inq_v: $.data.version } }
            - { call: "POST /charter-inquiries/${inq}/quote", payload: { expected_inquiry_version: "${inq_v}" }, as: CharterSalesAgent }
            - { call: "POST /charter-inquiries/${inq}/accept", payload: {}, as: Customer, as_user_id: "${cust_c}" }
          trigger:
            - call: "POST /charter-inquiries/${inq}/convert"
              payload: {}
              as: CharterSalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (403, segregation of duties at role level)"

      - name: galley_manager_cannot_confirm_staff
        claim_type: rbac_denial
        grounds: ["roles.OperationsManager", "endpoints[POST /cruises/{cruiseId}/staff-assignments/{assignmentId}/confirm]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "GalleyManager owns provisioning only; staff confirmation is OperationsManager-exclusive."
        test_recipe:
          setup: ["Cruise with an ASSIGNED server assignment"]
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id } }
            - { call: "POST /staff-members", payload: { full_name: "Sam", role_code: "SERVER" }, as: OperationsManager, captures: { staff_id: $.data.id } }
            - { call: "POST /cruises/${cruise_id}/staff-assignments", payload: { staff_member_id: "${staff_id}", assigned_role: "SERVER" }, as: OperationsManager, captures: { asg_id: $.data.id } }
          trigger:
            - call: "POST /cruises/${cruise_id}/staff-assignments/${asg_id}/confirm"
              payload: {}
              as: GalleyManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (403)"

  # ===========================================================================
  # Section: cross-cutting complexity layers
  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: occ_correct_version_succeeds_and_increments
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[booking-create-stale-cruise]"]
        distinguishing_aspect: "Happy-path OCC: booking create with the current version succeeds and bumps CruiseInstance.version by exactly 1."
        test_recipe:
          setup: ["Cruise created; version captured as 1"]
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id, cruise_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
          trigger:
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 1, expected_cruise_version: "${cruise_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_a: $.data.id } }
            - { call: "GET /cruises/${cruise_id}", payload: {}, as: OperationsManager, captures: { cruise_v2: $.data.version } }
          assert:
            - "Booking create with current version succeeds (201)"
            - "CruiseInstance.${cruise_id}.version == ${cruise_v} + 1 (incremented exactly once)"

      - name: derived_field_recompute_on_booking_cancel
        claim_type: derived_field_reconciliation
        grounds: ["entities.CruiseInstance.fields.reserved_covers", "state_machines.Booking"]
        excluded_because:
          difficulty_instance: compensating_invariant / reserved_covers_conserved_under_booking_cancel
          rationale: "reserved_covers recomputation verified as a conserved-quantity round-trip in the named §1.8 instance."

      - name: cascading_side_effects_end_to_end
        claim_type: cascading_side_effects
        grounds: ["state_machines.CruiseInstance.SCHEDULED_to_CANCELLED"]
        excluded_because:
          difficulty_instance: transitive_cascade / weather_cancel_cascade_depth4
          rationale: "The depth-4 weather cascade with per-hop assertions is the named §1.8 instance."

      - name: clock_default_and_set
        claim_type: scheduled_actions
        grounds: ["endpoints[POST /_clock/set_current_utc]"]
        distinguishing_aspect: "Before any set, the logical clock reads exactly 2026-08-01T00:00:00Z; after set, it reads the new value (drives notice-tier and cert-expiry determinism)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: OperationsManager, captures: { now: $.data.current_utc } }
          assert:
            - "POST returns current_utc == 2026-08-05T00:00:00Z after set (default before set is 2026-08-01T00:00:00Z)"

  # ===========================================================================
  # Section: consistency_model — immediate consistency
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: booking_create_immediately_visible_in_cruise_aggregate
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model", "entities.CruiseInstance.fields.reserved_covers"]
        distinguishing_aspect: "reserved_covers read in the same-request aftermath equals the sum including the just-created booking — no async lag."
        test_recipe:
          setup: ["Cruise created"]
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id, cruise_v: $.data.version } }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "A" }, as: OperationsManager, captures: { cust_a: $.data.id } }
          trigger:
            - { call: "POST /cruises/${cruise_id}/bookings", payload: { customer_id: "${cust_a}", party_size: 3, expected_cruise_version: "${cruise_v}" }, as: Customer, as_user_id: "${cust_a}", captures: { bk_a: $.data.id } }
            - { call: "GET /cruises/${cruise_id}", payload: {}, as: OperationsManager, captures: { covers: $.data.reserved_covers } }
          assert:
            - "GET immediately after create shows reserved_covers == 3 (immediate consistency)"
