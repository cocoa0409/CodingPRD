# SCAFFOLD.yaml — Academic Integrity Case Adjudication
# Sections §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.

scenario: |
  2991. Academic Integrity Case Adjudication (university academic integrity office): report intake from faculty with evidence attachment and similarity report review, student notification and meeting scheduling with advisor rights, informal instructor resolution versus formal hearing pathways, sanction ladder from grade penalty to suspension with prior-case escalation, repeat-offense database and cross-course pattern detection, appeal on grounds of procedure, evidence or sanction severity, transcript notation policy and expungement requests, faculty training and reporting rate monitoring by department

domain_name: academic-integrity-case-adjudication
api_prefix: /integrity

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

  difficulty_level: expert_plus
  notes: |
    Flat peer topology: every entity owns a top-level collection under /integrity and carries its
    foreign keys in the request body; no aggregate root wraps the URL space. The Case entity carries
    two INDEPENDENT state dimensions (adjudication_status x notation_status) that advance on
    different triggers by different roles, and each dimension contains a cycle (rehearing loop on
    adjudication_status; re-request loop on notation_status). Severity assessment is deliberately
    two-algorithm: the instructor-facing informal assessment is barred by policy from reading the
    repeat-offense database, so the same Case yields two different recommended ladder ranks that are
    both persisted and both observable.

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Department
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Short department code, uppercase letters and digits, 2-8 chars"
        constraints: "unique across Departments; ^[A-Z0-9]{2,8}$"
      - name: name
        type: string
        source: input
        description: "Human-readable department name, 1-120 chars"
      - name: enrolled_student_count
        type: integer
        source: input
        description: "Census enrollment used as the denominator of the reporting-rate metric"
        constraints: ">= 1"
      - name: faculty_headcount
        type: integer
        source: input
        description: "Census faculty count used as the denominator of training_completion_pct"
        constraints: ">= 1"
      - name: open_case_count
        type: integer
        source: computed
        description: "Count of Case rows whose offering belongs to this department and whose adjudication_status is NOT IN {CLOSED, DISMISSED}"
        default: 0
      - name: training_completion_pct
        type: number
        source: computed
        description: "See calculations.department_training_completion_pct; 2 decimal places"
        default: 0.00
      - name: reporting_rate_per_1k_submitted
        type: number
        source: computed
        description: "See calculations.department_reporting_rate, variant submitted_basis, evaluated at the current logical clock"
        default: 0.00
      - name: monitoring_flag
        type: enum
        source: computed
        description: "See calculations.department_monitoring_flag"
        default: NORMAL
        constraints: "one of NORMAL, TRAINING_DEFICIT, UNDER_REPORTING, ELEVATED"

  - name: FacultyMember
    parent: null
    common_fields: true
    fields:
      - name: department_id
        type: string
        source: input
        description: "FK -> Department.id; the department that employs this faculty member"
      - name: full_name
        type: string
        source: input
        description: "Faculty member full name, 1-120 chars"
      - name: email
        type: string
        source: input
        description: "Contact email; unique across FacultyMember"
        constraints: "must contain exactly one '@'"
      - name: training_status
        type: enum
        source: computed
        description: "CURRENT when a training completion exists whose completed_at is within TRAINING_VALID_DAYS of the current logical clock, else LAPSED"
        default: LAPSED
        constraints: "one of LAPSED, CURRENT"
      - name: training_completed_at
        type: datetime
        source: computed
        description: "completed_at of the most recent training completion recorded for this faculty member (created_at DESC tie-break), null when none"
        default: null
      - name: training_module_code
        type: string
        source: computed
        description: "module_code of the most recent training completion, null when none"
        default: null
      - name: reports_submitted_count
        type: integer
        source: computed
        description: "Count of IntegrityReport rows with reporter_id equal to this member and status NOT IN {DRAFT}"
        default: 0

  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Student full name, 1-120 chars"
      - name: email
        type: string
        source: input
        description: "Contact email; unique across Student"
        constraints: "must contain exactly one '@'"
      - name: program_code
        type: string
        source: input
        description: "Degree program code, 2-16 chars"
      - name: class_year
        type: integer
        source: input
        description: "Year of study"
        constraints: "1..8"
      - name: prior_upheld_count
        type: integer
        source: computed
        description: "Count of Case rows for this student with responsibility_finding = RESPONSIBLE, overturned = false and adjudication_status IN {SANCTION_IMPOSED, CLOSED}"
        default: 0
      - name: active_sanction_points
        type: integer
        source: computed
        description: "Sum of ladder_rank over Sanction rows belonging to this student's cases whose status = IMPOSED"
        default: 0
      - name: standing
        type: enum
        source: computed
        description: "SUSPENDED when any IMPOSED Sanction of this student has ladder_rank >= 6; else PROBATION when any IMPOSED Sanction has ladder_rank = 5; else GOOD_STANDING"
        default: GOOD_STANDING
        constraints: "one of GOOD_STANDING, PROBATION, SUSPENDED"
      - name: transcript_notation
        type: enum
        source: computed
        description: "POSTED when any Case of this student has notation_status = POSTED; else EXPUNGED when any Case has notation_status = EXPUNGED; else NONE"
        default: NONE
        constraints: "one of NONE, POSTED, EXPUNGED"

  - name: CourseOffering
    parent: null
    common_fields: true
    fields:
      - name: department_id
        type: string
        source: input
        description: "FK -> Department.id; department that owns the course"
      - name: instructor_id
        type: string
        source: input
        description: "FK -> FacultyMember.id; instructor of record for this offering"
      - name: course_code
        type: string
        source: input
        description: "Catalog course code such as ENGL-201; the cross-course pattern detector groups on this value"
        constraints: "^[A-Z]{2,6}-[0-9]{3}$"
      - name: term_code
        type: string
        source: input
        description: "Academic term code such as 2026FA"
        constraints: "^[0-9]{4}(SP|SU|FA)$"
      - name: grade_components
        type: array
        source: input
        description: "Ordered array of objects { code, max_points, weight_pct } defining the gradebook; evaluation order for calculations.adjusted_course_grade_pct is this array order"
        constraints: "1..8 entries; code unique and ^[A-Z0-9_]{2,16}$; max_points integer >= 1; weight_pct integer 1..100; sum(weight_pct) == 100"

  - name: IntegrityReport
    parent: null
    common_fields: true
    fields:
      - name: offering_id
        type: string
        source: input
        description: "FK -> CourseOffering.id; the offering in which the alleged violation occurred"
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the accused student"
      - name: reporter_id
        type: string
        source: system
        description: "FK -> FacultyMember.id; set from X-User-ID of the FacultyReporter who created the report; input ignored"
      - name: alleged_violation_type
        type: enum
        source: input
        description: "Alleged violation category; keys calculations.case_severity_index constant BASE_POINTS"
        constraints: "one of PLAGIARISM, UNAUTHORIZED_COLLABORATION, EXAM_CHEATING, FABRICATION_OF_DATA, CONTRACT_CHEATING, FACILITATION"
      - name: narrative
        type: string
        source: input
        description: "Reporter narrative, 20-4000 chars"
      - name: incident_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant of the alleged incident; must be <= current logical clock"
      - name: component_scores
        type: array
        source: input
        description: "Array of objects { code, earned_points } snapshotting the student's gradebook at intake; must contain exactly one entry per code in the offering's grade_components"
        constraints: "earned_points integer >= 0 and <= the matching component max_points"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical clock at the moment status became SUBMITTED (first submission only); null while DRAFT"
        default: null
      - name: status
        type: enum
        source: system
        description: "See state_machines.IntegrityReport"
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, RETURNED_FOR_INFO, ACCEPTED, REJECTED_INSUFFICIENT"
      - name: evidence_strength_score
        type: number
        source: computed
        description: "See calculations.evidence_strength_score; recomputed on every EvidenceItem create for this report"
        default: 0.00
      - name: evidence_complete
        type: boolean
        source: computed
        description: "True when the report has >= 1 EvidenceItem AND (alleged_violation_type != PLAGIARISM OR >= 1 EvidenceItem of kind SIMILARITY_REPORT)"
        default: false
      - name: returned_at
        type: datetime
        source: system
        description: "Logical clock at the moment status last became RETURNED_FOR_INFO; null if the report was never returned"
        default: null
      - name: triaged_at
        type: datetime
        source: system
        description: "Logical clock at the moment status became ACCEPTED or REJECTED_INSUFFICIENT; null otherwise"
        default: null
      - name: resubmission_count
        type: integer
        source: system
        description: "Number of times the report re-entered SUBMITTED from RETURNED_FOR_INFO; never decremented"
        default: 0
      - name: triage_note
        type: string
        source: input
        description: "Most recent triage note recorded by the IntegrityOfficer, null while untriaged"
        default: null

  - name: EvidenceItem
    parent: null
    common_fields: false
    fields:
      - name: report_id
        type: string
        source: input
        description: "FK -> IntegrityReport.id; the report this evidence is attached to"
      - name: kind
        type: enum
        source: input
        description: "Evidence kind; keys calculations.evidence_strength_score constant KIND_WEIGHT"
        constraints: "one of SIMILARITY_REPORT, PROCTOR_LOG, WITNESS_STATEMENT, DOCUMENT"
      - name: sha256
        type: string
        source: input
        description: "Lowercase hex digest of the attachment, exactly 64 chars"
        constraints: "^[0-9a-f]{64}$"
      - name: page_count
        type: integer
        source: input
        description: "Page count of the attachment"
        constraints: "0..500"
      - name: similarity_pct
        type: number
        source: input
        description: "Similarity percentage reported by the text-matching service; required when kind = SIMILARITY_REPORT, must be omitted otherwise"
        default: null
        constraints: "0.00..100.00, at most 2 decimal places"

  - name: Case
    parent: null
    common_fields: true
    fields:
      - name: report_id
        type: string
        source: input
        description: "FK -> IntegrityReport.id; null for rows created by the legacy repeat-offense import"
        default: null
      - name: student_id
        type: string
        source: system
        description: "FK -> Student.id; copied from the source report (or supplied directly by the legacy import)"
      - name: offering_id
        type: string
        source: system
        description: "FK -> CourseOffering.id; copied from the source report (or supplied directly by the legacy import)"
      - name: case_number
        type: string
        source: system
        description: "Office case number, format AIC-<zero-padded 6-digit sequence>, allocated in Case created_at ASC order starting at AIC-000001"
      - name: origin
        type: enum
        source: system
        description: "OFFICE_INTAKE for cases opened from a report, LEGACY_IMPORT for rows loaded from the historical repeat-offense database"
        default: OFFICE_INTAKE
        constraints: "one of OFFICE_INTAKE, LEGACY_IMPORT"
      - name: pathway
        type: enum
        source: system
        description: "Adjudication pathway; UNASSIGNED until POST /integrity/cases/{id}/pathway, flipped to FORMAL when the student declines an informal resolution"
        default: UNASSIGNED
        constraints: "one of UNASSIGNED, INFORMAL, FORMAL"
      - name: adjudication_status
        type: enum
        source: system
        description: "Procedural dimension; see state_machines.Case (dimension adjudication_status)"
        default: INTAKE_REVIEW
        constraints: "one of INTAKE_REVIEW, NOTIFIED, INFORMAL_PROPOSED, INFORMAL_ACCEPTED, FORMAL_REFERRED, HEARING_SCHEDULED, HEARING_IN_PROGRESS, DECIDED, APPEAL_UNDER_REVIEW, SANCTION_IMPOSED, CLOSED, DISMISSED"
      - name: notation_status
        type: enum
        source: system
        description: "Transcript-notation dimension; advances independently of adjudication_status; see state_machines.Case (dimension notation_status)"
        default: NOT_APPLICABLE
        constraints: "one of NOT_APPLICABLE, PENDING_POSTING, POSTED, EXPUNGEMENT_REQUESTED, EXPUNGED, EXPUNGEMENT_DENIED"
      - name: responsibility_finding
        type: enum
        source: system
        description: "UNDETERMINED until the case is decided by admission, panel or appeal"
        default: UNDETERMINED
        constraints: "one of UNDETERMINED, RESPONSIBLE, NOT_RESPONSIBLE"
      - name: finding_basis
        type: enum
        source: system
        description: "How responsibility_finding was reached"
        default: NONE
        constraints: "one of NONE, ADMISSION, PANEL, APPEAL, LEGACY"
      - name: hearing_round
        type: integer
        source: system
        description: "Number of hearing rounds opened for this case; starts at 0 and is incremented by exactly 1 each time a HearingSession is scheduled. Adjournment and appeal remand do NOT increment it and never decrement it - they only make a further scheduling call legal, which is what raises the counter"
        default: 0
      - name: overturned
        type: boolean
        source: system
        description: "True once an appeal outcome OVERTURNED has vacated the finding; excluded from Student.prior_upheld_count while true"
        default: false
      - name: decided_at
        type: datetime
        source: system
        description: "Logical clock at the moment responsibility_finding last became RESPONSIBLE or NOT_RESPONSIBLE; null while UNDETERMINED"
        default: null
      - name: evidence_strength_score
        type: number
        source: computed
        description: "Snapshot of IntegrityReport.evidence_strength_score taken when the case was opened; 0.00 for LEGACY_IMPORT rows"
        default: 0.00
      - name: baseline_course_grade_pct
        type: number
        source: computed
        description: "See calculations.adjusted_course_grade_pct, variant baseline; computed at case open from the report's component_scores"
        default: 0.00
      - name: cross_course_pattern_points
        type: integer
        source: computed
        description: "See calculations.cross_course_pattern_points"
        default: 0
      - name: prior_upheld_count_at_assessment
        type: integer
        source: computed
        description: "Value of Student.prior_upheld_count excluding this case, as of the most recent severity assessment"
        default: 0
      - name: prior_escalation_points
        type: integer
        source: computed
        description: "See calculations.case_severity_index step 3; keyed on provisional_severity_index, never on severity_index"
        default: 0
      - name: provisional_severity_index
        type: number
        source: computed
        description: "See calculations.case_severity_index step 2 (FORMAL basis); excludes prior_escalation_points"
        default: 0.00
      - name: severity_index
        type: number
        source: computed
        description: "See calculations.case_severity_index (FORMAL basis); provisional_severity_index + prior_escalation_points"
        default: 0.00
      - name: recommended_ladder_rank
        type: integer
        source: computed
        description: "See calculations.sanction_ladder_placement, variant formal_full"
        default: 1
        constraints: "1..8"
      - name: informal_severity_index
        type: number
        source: computed
        description: "See calculations.case_severity_index (INFORMAL basis); excludes cross_course_pattern_points and prior_escalation_points"
        default: 0.00
      - name: informal_recommended_ladder_rank
        type: integer
        source: computed
        description: "See calculations.sanction_ladder_placement, variant informal_instructor"
        default: 1
        constraints: "1..3"
      - name: panel_severity_recommendation
        type: integer
        source: computed
        description: "Median RESPONSIBLE-vote severity_recommendation of the deciding HearingSession; null until a panel decides"
        default: null
      - name: pre_appeal_adjudication_status
        type: enum
        source: system
        description: "adjudication_status the case held immediately before it moved to APPEAL_UNDER_REVIEW; restored verbatim on appeal outcome UPHELD_ORIGINAL or SANCTION_REDUCED; null when no appeal is pending"
        default: null
        constraints: "one of DECIDED, INFORMAL_ACCEPTED or null"
      - name: dismiss_reason
        type: string
        source: input
        description: "Reason recorded when the office dismisses the case; null otherwise"
        default: null
      - name: expungement_eligible_at
        type: datetime
        source: computed
        description: "See calculations.notation_expungement_eligibility; null while notation_status IN {NOT_APPLICABLE, PENDING_POSTING} or when the imposed ladder_rank is 8"
        default: null

  - name: Notification
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case this notice belongs to"
      - name: kind
        type: enum
        source: input
        description: "Notice kind; only ALLEGATION_NOTICE may be created through POST /integrity/cases/{id}/notifications, all other kinds are system-generated side effects"
        constraints: "one of ALLEGATION_NOTICE, MEETING_NOTICE, HEARING_NOTICE, REHEARING_NOTICE, SANCTION_NOTICE, SANCTION_RECOMPUTE_NOTICE, APPEAL_OUTCOME_NOTICE"
      - name: response_window_days
        type: integer
        source: input
        description: "Length of the student response window in days"
        default: 7
        constraints: "integer >= 1; the policy range RESPONSE_WINDOW_MIN_DAYS..RESPONSE_WINDOW_MAX_DAYS (5..30) is NOT a shape constraint - it is enforced by validations priority 46 as ERR_RESPONSE_WINDOW_OUT_OF_RANGE (409), so a value of 4 is a business rejection and not ERR_INVALID_REQUEST"
      - name: sent_at
        type: datetime
        source: system
        description: "Logical clock at creation"
      - name: response_deadline_at
        type: datetime
        source: computed
        description: "sent_at + response_window_days days"
      - name: acknowledged_at
        type: datetime
        source: system
        description: "Logical clock at the moment the student acknowledged the notice; null while unacknowledged"
        default: null

  - name: AdvisorEngagement
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case the advisor is engaged for"
      - name: advisor_full_name
        type: string
        source: input
        description: "Advisor full name, 1-120 chars"
      - name: advisor_kind
        type: enum
        source: input
        description: "Advisor category recognised by the procedural-rights policy"
        constraints: "one of FACULTY_ADVISOR, STUDENT_PEER, ATTORNEY"
      - name: advisor_bar_licensed
        type: boolean
        source: input
        description: "Whether the advisor holds a bar licence; must be true when advisor_kind = ATTORNEY"
        default: false
      - name: status
        type: enum
        source: system
        description: "See state_machines.AdvisorEngagement"
        default: REQUESTED
        constraints: "one of REQUESTED, APPROVED, DENIED"
      - name: speaking_rights
        type: boolean
        source: computed
        description: "True only when status = APPROVED AND advisor_kind = ATTORNEY AND the case pathway = FORMAL; otherwise false"
        default: false
      - name: reconfirmation_required
        type: boolean
        source: computed
        description: "Set true when a REHEARING_NOTICE side effect pushes an APPROVED engagement back to REQUESTED; cleared on the next APPROVE"
        default: false
      - name: decision_reason
        type: string
        source: input
        description: "Reason recorded by the IntegrityOfficer when denying the engagement; null otherwise"
        default: null

  - name: CaseMeeting
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case discussed at this meeting"
      - name: instructor_id
        type: string
        source: system
        description: "FK -> FacultyMember.id; copied from the case's report reporter_id; this member's calendar is the occupied resource"
      - name: start_at
        type: datetime
        source: input
        description: "ISO 8601 UTC start instant of the meeting; the occupied interval is half-open [start_at, end_at)"
      - name: end_at
        type: datetime
        source: input
        description: "ISO 8601 UTC end instant, exclusive"
      - name: duration_minutes
        type: integer
        source: computed
        description: "Whole minutes between start_at and end_at"
      - name: status
        type: enum
        source: system
        description: "See state_machines.CaseMeeting"
        default: SCHEDULED
        constraints: "one of SCHEDULED, HELD, NO_SHOW, CANCELLED"
      - name: advisor_present
        type: boolean
        source: input
        description: "Whether the student's approved advisor attended; recorded with the outcome"
        default: false

  - name: HearingRoom
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Room code, unique across HearingRoom"
        constraints: "^[A-Z0-9-]{2,12}$"
      - name: seat_capacity
        type: integer
        source: input
        description: "Number of seats in the room"
        constraints: "4..200"
      - name: buffer_minutes
        type: integer
        source: input
        description: "Turnover buffer applied on BOTH sides of every session; the occupied interval is the CLOSED interval [start_at - buffer_minutes, end_at + buffer_minutes]"
        default: 30
        constraints: "0..120"
      - name: sessions_per_day_cap
        type: integer
        source: input
        description: "Maximum number of non-CANCELLED HearingSession rows this room may hold per UTC calendar day, keyed on start_at date"
        default: 2
        constraints: "1..8"
      - name: booked_minutes_total
        type: integer
        source: computed
        description: "Sum over non-CANCELLED HearingSession rows in this room of (whole minutes between start_at and end_at) + 2 * buffer_minutes"
        default: 0

  - name: HearingSession
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case being heard"
      - name: room_id
        type: string
        source: input
        description: "FK -> HearingRoom.id; the room whose buffered interval is occupied"
      - name: chair_id
        type: string
        source: input
        description: "FK -> FacultyMember.id; presiding chair, must hold training_status = CURRENT and must not be the reporter"
      - name: panelist_ids
        type: array
        source: input
        description: "Ordered array of FacultyMember.id values forming the voting panel; reverse lookup is available through PanelVote.panelist_id"
        constraints: "length must equal the case's required_panel_size; values distinct; must not contain chair_id or the case's reporter_id"
      - name: required_panel_size
        type: integer
        source: computed
        description: "3 when the case's recommended_ladder_rank at scheduling time is <= 5, else 5"
      - name: start_at
        type: datetime
        source: input
        description: "ISO 8601 UTC scheduled start instant"
      - name: end_at
        type: datetime
        source: input
        description: "ISO 8601 UTC scheduled end instant, must be > start_at"
      - name: status
        type: enum
        source: system
        description: "See state_machines.HearingSession"
        default: SCHEDULED
        constraints: "one of SCHEDULED, CONVENED, DECIDED, ADJOURNED, CANCELLED"
      - name: round_number
        type: integer
        source: system
        description: "Case.hearing_round value assigned to this session when it was scheduled"
      - name: effective_vote_count
        type: integer
        source: computed
        description: "Count of PanelVote rows for this session with verdict != ABSTAIN"
        default: 0
      - name: quorum_required
        type: integer
        source: computed
        description: "ceil(required_panel_size * 2 / 3): 2 for a 3-member panel, 4 for a 5-member panel"
      - name: panel_finding
        type: enum
        source: computed
        description: "Set on decide; see calculations.panel_decision_tally"
        default: null
        constraints: "one of RESPONSIBLE, NOT_RESPONSIBLE or null"
      - name: panel_severity_recommendation
        type: integer
        source: computed
        description: "Set on decide; median severity_recommendation over RESPONSIBLE votes, lower-of-two-middles tie-break; null when panel_finding = NOT_RESPONSIBLE"
        default: null
      - name: adjourn_reason
        type: string
        source: input
        description: "Reason recorded on adjournment, null otherwise"
        default: null

  - name: PanelVote
    parent: null
    common_fields: false
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> HearingSession.id; the session in which the vote was cast"
      - name: panelist_id
        type: string
        source: input
        description: "FK -> FacultyMember.id; the voting panelist, must appear in the session's panelist_ids"
      - name: verdict
        type: enum
        source: input
        description: "The panelist's verdict"
        constraints: "one of RESPONSIBLE, NOT_RESPONSIBLE, ABSTAIN"
      - name: severity_recommendation
        type: integer
        source: input
        description: "Ladder rank the panelist recommends; required when verdict = RESPONSIBLE, must be omitted otherwise"
        default: null
        constraints: "1..8"
      - name: cast_at
        type: datetime
        source: system
        description: "Logical clock at the moment the vote was recorded"

  - name: Sanction
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case this sanction belongs to"
      - name: replaces_sanction_id
        type: string
        source: system
        description: "FK -> Sanction.id; set on a sanction that the system created to replace a reduced or superseded predecessor, null otherwise"
        default: null
      - name: kind
        type: enum
        source: input
        description: "Sanction kind; must equal LADDER_KIND[ladder_rank] declared in calculations.sanction_ladder_placement"
        constraints: "one of WARNING, GRADE_PENALTY_ASSIGNMENT, GRADE_PENALTY_COURSE, TRANSCRIPT_NOTATION_ONLY, DISCIPLINARY_PROBATION, SUSPENSION_ONE_TERM, SUSPENSION_ONE_YEAR, EXPULSION_RECOMMENDATION"
      - name: ladder_rank
        type: integer
        source: input
        description: "Position on the sanction ladder"
        constraints: "1..8"
      - name: grade_component_code
        type: string
        source: input
        description: "grade_components code zeroed by a GRADE_PENALTY_ASSIGNMENT sanction; required for that kind, must be omitted for all other kinds"
        default: null
      - name: effective_from
        type: datetime
        source: input
        description: "ISO 8601 UTC instant from which the sanction applies; must be >= the case decided_at when the case is already decided"
      - name: status
        type: enum
        source: system
        description: "See state_machines.Sanction"
        default: PROPOSED
        constraints: "one of PROPOSED, ACCEPTED, DECLINED, SUPERSEDED, IMPOSED, VACATED, COMPLETED"
      - name: origin
        type: enum
        source: system
        description: "INFORMAL_PROPOSAL when created through the informal-resolution endpoint, OFFICE_PROPOSAL through POST /integrity/sanctions, APPEAL_REDUCTION when synthesized by an appeal outcome SANCTION_REDUCED"
        default: OFFICE_PROPOSAL
        constraints: "one of OFFICE_PROPOSAL, INFORMAL_PROPOSAL, APPEAL_REDUCTION"
      - name: baseline_course_grade_pct
        type: number
        source: computed
        description: "Snapshot of Case.baseline_course_grade_pct at sanction creation; 0.00 when kind is not a grade penalty"
        default: 0.00
      - name: adjusted_course_grade_pct
        type: number
        source: computed
        description: "See calculations.adjusted_course_grade_pct, variant penalty_applied; 0.00 when kind is not a grade penalty"
        default: 0.00
      - name: grade_penalty_delta_pct
        type: number
        source: computed
        description: "round(baseline_course_grade_pct - adjusted_course_grade_pct, 2); 0.00 when kind is not a grade penalty"
        default: 0.00
      - name: imposed_at
        type: datetime
        source: system
        description: "Logical clock at the moment status became IMPOSED; null otherwise"
        default: null
      - name: completed_at
        type: datetime
        source: input
        description: "Instant the student finished serving the sanction, supplied on completion; null otherwise"
        default: null
      - name: vacated_reason
        type: enum
        source: system
        description: "Why the sanction was vacated"
        default: null
        constraints: "one of APPEAL_OVERTURNED, APPEAL_REMANDED, APPEAL_REDUCED, CASE_DISMISSED, LADDER_RECOMPUTE or null"

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case under appeal"
      - name: grounds
        type: enum
        source: input
        description: "Sole ground asserted by the appellant"
        constraints: "one of PROCEDURE, EVIDENCE, SANCTION_SEVERITY"
      - name: statement
        type: string
        source: input
        description: "Appellant statement, 20-4000 chars"
      - name: filed_at
        type: datetime
        source: system
        description: "Logical clock at filing"
      - name: status
        type: enum
        source: system
        description: "See state_machines.Appeal"
        default: SUBMITTED
        constraints: "one of SUBMITTED, UNDER_REVIEW, DENIED_NO_GROUNDS, UPHELD_ORIGINAL, SANCTION_REDUCED, REMANDED, OVERTURNED"
      - name: hearing_round_at_filing
        type: integer
        source: system
        description: "Case.hearing_round value at the moment the appeal was filed"
      - name: reduced_ladder_rank
        type: integer
        source: input
        description: "Replacement ladder rank supplied with outcome SANCTION_REDUCED; null otherwise"
        default: null
        constraints: "1..7"
      - name: decision_reason
        type: string
        source: input
        description: "Reason recorded by the AppealsDean at screening or decision; null while SUBMITTED"
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: "Logical clock at the moment the appeal reached a terminal status; null otherwise"
        default: null

# ============================================================================
# §1.2 STATE MACHINES
# ============================================================================
state_machines:
  - entity: IntegrityReport
    state_field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED_INSUFFICIENT]
    notes: "Cyclic: SUBMITTED -> RETURNED_FOR_INFO -> SUBMITTED may repeat without bound; resubmission_count records the number of times the report re-entered SUBMITTED from RETURNED_FOR_INFO."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /integrity/reports/{id}/submit"
        actor: FacultyReporter
        preconditions:
          - "report.status == DRAFT"
          - "the acting X-User-ID equals report.reporter_id"
          - "at least one EvidenceItem exists for the report, else ERR_EVIDENCE_INCOMPLETE"
          - "at least one EvidenceItem with kind == SIMILARITY_REPORT exists when report.alleged_violation_type == PLAGIARISM, else ERR_EVIDENCE_INCOMPLETE"
          - "the reporter's FacultyMember.training_status == CURRENT, else ERR_REPORTER_TRAINING_LAPSED"
        side_effects:
          - "report.status := SUBMITTED"
          - "report.submitted_at := current logical clock"
          - "report.evidence_strength_score := calculations.evidence_strength_score over the report's EvidenceItem set (frozen at first submission and recomputed on every later submission)"
          - "reporter FacultyMember.reports_submitted_count += 1"
          - "report.version += 1"
      - from: RETURNED_FOR_INFO
        to: SUBMITTED
        trigger: "POST /integrity/reports/{id}/submit"
        actor: FacultyReporter
        preconditions:
          - "report.status == RETURNED_FOR_INFO"
          - "the acting X-User-ID equals report.reporter_id"
          - "at least one EvidenceItem has been added since report.returned_at, else ERR_EVIDENCE_INCOMPLETE"
          - "the reporter's FacultyMember.training_status == CURRENT, else ERR_REPORTER_TRAINING_LAPSED"
        side_effects:
          - "report.status := SUBMITTED"
          - "report.submitted_at is NOT modified (it always records the first submission)"
          - "report.resubmission_count += 1"
          - "report.evidence_strength_score := calculations.evidence_strength_score recomputed over the enlarged EvidenceItem set"
          - "reporter FacultyMember.reports_submitted_count is NOT incremented again"
          - "report.version += 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /integrity/reports/{id}/triage with decision == ACCEPT"
        actor: IntegrityOfficer
        preconditions:
          - "report.status == SUBMITTED"
          - "report.evidence_strength_score >= 20.00, else ERR_EVIDENCE_INCOMPLETE"
        side_effects:
          - "report.status := ACCEPTED"
          - "report.triaged_at := current logical clock"
          - "report.triage_note := the supplied note"
          - "report.version += 1"
      - from: SUBMITTED
        to: RETURNED_FOR_INFO
        trigger: "POST /integrity/reports/{id}/triage with decision == RETURN_FOR_INFO"
        actor: IntegrityOfficer
        preconditions:
          - "report.status == SUBMITTED"
        side_effects:
          - "report.status := RETURNED_FOR_INFO"
          - "report.returned_at := current logical clock"
          - "report.triage_note := the supplied note"
          - "report.version += 1"
      - from: SUBMITTED
        to: REJECTED_INSUFFICIENT
        trigger: "POST /integrity/reports/{id}/triage with decision == REJECT_INSUFFICIENT"
        actor: IntegrityOfficer
        preconditions:
          - "report.status == SUBMITTED"
        side_effects:
          - "report.status := REJECTED_INSUFFICIENT"
          - "report.triaged_at := current logical clock"
          - "report.triage_note := the supplied note"
          - "no Case may afterwards be opened from this report (POST /integrity/cases requires report.status == ACCEPTED)"
          - "report.version += 1"

  - entity: Case
    state_field: adjudication_status
    dimension: adjudication
    initial_state: INTAKE_REVIEW
    terminal_states: [CLOSED, DISMISSED]
    notes: "Runs in parallel with the notation dimension below; the two dimensions advance independently except where a side effect names the other dimension explicitly. Cyclic through FORMAL_REFERRED: HEARING_SCHEDULED -> HEARING_IN_PROGRESS -> FORMAL_REFERRED -> HEARING_SCHEDULED (adjournment) and APPEAL_UNDER_REVIEW -> FORMAL_REFERRED (remand). Case.hearing_round counts HearingSession rows ever scheduled for the case and is never decremented."
    transitions:
      - from: INTAKE_REVIEW
        to: NOTIFIED
        trigger: "POST /integrity/cases/{id}/notifications with kind == ALLEGATION_NOTICE"
        actor: IntegrityOfficer
        preconditions:
          - "case.adjudication_status == INTAKE_REVIEW"
          - "no Notification with kind == ALLEGATION_NOTICE already exists for the case, else ERR_CASE_STATE_INVALID"
          - "response_window_days is between 5 and 30 inclusive, else ERR_RESPONSE_WINDOW_OUT_OF_RANGE"
        side_effects:
          - "Notification created with sent_at := current logical clock and response_deadline_at := sent_at + response_window_days days"
          - "case.notified_at := the notification's sent_at"
          - "case.adjudication_status := NOTIFIED"
          - "case.version += 1"
      - from: NOTIFIED
        to: INFORMAL_PROPOSED
        trigger: "POST /integrity/cases/{id}/informal-resolution"
        actor: FacultyReporter
        preconditions:
          - "case.adjudication_status == NOTIFIED"
          - "case.pathway == INFORMAL, else ERR_CASE_PATHWAY_NOT_SET"
          - "expected_case_version matches case.version, else ERR_STALE_CASE_VERSION (see concurrency_rules.informal-proposal-stale-case)"
          - "the acting X-User-ID equals the reporter_id of the case's originating IntegrityReport, else ERR_NOT_RESOURCE_OWNER"
          - "proposed_ladder_rank lies inside the informal ladder band from calculations.sanction_ladder_placement variant informal_instructor, else ERR_SANCTION_ABOVE_LADDER_BAND or ERR_SANCTION_BELOW_LADDER_BAND"
        side_effects:
          - "any Sanction for the case with status == PROPOSED transitions to SUPERSEDED (see state_machines.Sanction.PROPOSED_to_SUPERSEDED)"
          - "a Sanction is created with status PROPOSED, origin INFORMAL_PROPOSAL and ladder_rank := proposed_ladder_rank"
          - "case.adjudication_status := INFORMAL_PROPOSED"
          - "case.version += 1"
      - from: INFORMAL_PROPOSED
        to: INFORMAL_ACCEPTED
        trigger: "POST /integrity/cases/{id}/informal-response with response == ACCEPT"
        actor: Student
        preconditions:
          - "case.adjudication_status == INFORMAL_PROPOSED"
          - "the acting X-User-ID equals case.student_id, else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "the case's PROPOSED Sanction transitions to ACCEPTED"
          - "case.responsibility_finding := RESPONSIBLE"
          - "case.finding_basis := ADMISSION"
          - "case.decided_at := current logical clock"
          - "case.adjudication_status := INFORMAL_ACCEPTED"
          - "case.version += 1"
      - from: INFORMAL_PROPOSED
        to: FORMAL_REFERRED
        trigger: "POST /integrity/cases/{id}/informal-response with response == DECLINE"
        actor: Student
        preconditions:
          - "case.adjudication_status == INFORMAL_PROPOSED"
          - "the acting X-User-ID equals case.student_id, else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "the case's PROPOSED Sanction transitions to DECLINED"
          - "case.pathway := FORMAL"
          - "case.severity_index, case.cross_course_pattern_points, case.prior_escalation_points and case.recommended_ladder_rank are recomputed under calculations.sanction_ladder_placement variant formal_full (the declined informal cap no longer applies)"
          - "case.responsibility_finding remains UNDETERMINED and case.decided_at remains null"
          - "case.adjudication_status := FORMAL_REFERRED"
          - "case.version += 1"
      - from: NOTIFIED
        to: HEARING_SCHEDULED
        trigger: "POST /integrity/hearing-sessions"
        actor: IntegrityOfficer
        preconditions:
          - "case.adjudication_status == NOTIFIED"
          - "case.pathway == FORMAL, else ERR_CASE_PATHWAY_NOT_SET"
          - "start_at >= case.notified_at + MIN_HEARING_NOTICE_DAYS (10) days, else ERR_NOTICE_PERIOD_TOO_SHORT"
          - "the buffered room interval is free, else ERR_ROOM_BUFFER_CONFLICT"
          - "the room's sessions_per_day_cap is not exceeded on the UTC calendar date of start_at, else ERR_ROOM_DAILY_CAPACITY_EXCEEDED"
          - "the chair's FacultyMember.training_status == CURRENT, else ERR_CHAIR_TRAINING_LAPSED"
          - "len(panelist_ids) equals the required panel size for case.recommended_ladder_rank, else ERR_PANEL_SIZE_INVALID"
          - "neither chair_id nor any element of panelist_ids equals the reporter_id of the case's originating IntegrityReport, else ERR_PANEL_CONFLICT_OF_INTEREST"
        side_effects:
          - "HearingSession created with status SCHEDULED, round_number := case.hearing_round + 1 and quorum_required := ceil(len(panelist_ids) * 2 / 3)"
          - "case.hearing_round += 1"
          - "HearingRoom.booked_minutes_total += (duration_minutes + 2 * room.buffer_minutes) [INV inv-room-minutes-conserved]"
          - "a Notification with kind HEARING_NOTICE is created for the case"
          - "case.adjudication_status := HEARING_SCHEDULED"
          - "case.version += 1"
      - from: FORMAL_REFERRED
        to: HEARING_SCHEDULED
        trigger: "POST /integrity/hearing-sessions"
        actor: IntegrityOfficer
        preconditions:
          - "case.adjudication_status == FORMAL_REFERRED"
          - "all preconditions of NOTIFIED_to_HEARING_SCHEDULED apply unchanged, except that the notice lead time is measured from the sent_at of the case's most recent Notification with kind in (ALLEGATION_NOTICE, REHEARING_NOTICE)"
        side_effects:
          - "identical to NOTIFIED_to_HEARING_SCHEDULED"
      - from: HEARING_SCHEDULED
        to: FORMAL_REFERRED
        trigger: "POST /integrity/hearing-sessions/{id}/cancel"
        actor: IntegrityOfficer
        preconditions:
          - "session.status == SCHEDULED, else ERR_SESSION_STATE_INVALID"
        side_effects:
          - "session.status := CANCELLED"
          - "HearingRoom.booked_minutes_total -= (session.duration span in minutes + 2 * room.buffer_minutes), restoring the value it held before the session was scheduled [INV inv-room-minutes-conserved]"
          - "case.hearing_round is NOT decremented"
          - "case.adjudication_status := FORMAL_REFERRED"
          - "case.version += 1"
      - from: HEARING_SCHEDULED
        to: HEARING_IN_PROGRESS
        trigger: "POST /integrity/hearing-sessions/{id}/convene"
        actor: PanelChair
        preconditions:
          - "session.status == SCHEDULED, else ERR_SESSION_STATE_INVALID"
          - "the acting X-User-ID equals session.chair_id, else ERR_NOT_RESOURCE_OWNER"
          - "current logical clock >= session.start_at, else ERR_MEETING_WINDOW_INVALID"
          - "no AdvisorEngagement for the case has status REQUESTED, else ERR_ADVISOR_REQUEST_PENDING (cross-entity guard, see difficulty rule cross_entity_state_dependency)"
          - "the case's ALLEGATION_NOTICE has acknowledged_at != null OR current logical clock > its response_deadline_at, else ERR_RESPONSE_WINDOW_OPEN"
        side_effects:
          - "session.status := CONVENED"
          - "case.adjudication_status := HEARING_IN_PROGRESS"
          - "case.version += 1"
      - from: HEARING_IN_PROGRESS
        to: DECIDED
        trigger: "POST /integrity/hearing-sessions/{id}/decide"
        actor: PanelChair
        preconditions:
          - "session.status == CONVENED, else ERR_SESSION_STATE_INVALID"
          - "the acting X-User-ID equals session.chair_id, else ERR_NOT_RESOURCE_OWNER"
          - "the number of PanelVote rows for the session >= session.quorum_required, else ERR_QUORUM_NOT_MET"
          - "at least one PanelVote has verdict != ABSTAIN, else ERR_NO_EFFECTIVE_VOTES"
        side_effects:
          - "session.effective_vote_count, session.panel_finding and session.panel_severity_recommendation := calculations.panel_decision_tally"
          - "session.status := DECIDED"
          - "case.responsibility_finding := session.panel_finding"
          - "case.finding_basis := PANEL"
          - "case.panel_severity_recommendation := session.panel_severity_recommendation (null when panel_finding == NOT_RESPONSIBLE)"
          - "case.severity_index, case.prior_escalation_points and case.recommended_ladder_rank are recomputed under calculations.sanction_ladder_placement variant formal_full using the panel recommendation floor"
          - "case.decided_at := current logical clock"
          - "case.adjudication_status := DECIDED when panel_finding == RESPONSIBLE, otherwise DISMISSED with dismiss_reason NOT_RESPONSIBLE_PANEL_FINDING"
          - "case.version += 1"
      - from: HEARING_IN_PROGRESS
        to: FORMAL_REFERRED
        trigger: "POST /integrity/hearing-sessions/{id}/adjourn"
        actor: PanelChair
        preconditions:
          - "session.status == CONVENED, else ERR_SESSION_STATE_INVALID"
          - "the acting X-User-ID equals session.chair_id, else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "session.status := ADJOURNED and session.adjourn_reason := the supplied reason"
          - "HearingRoom.booked_minutes_total is NOT released (the room was actually occupied)"
          - "a Notification with kind REHEARING_NOTICE is created for the case"
          - "every AdvisorEngagement for the case with status APPROVED returns to REQUESTED with reconfirmation_required := true and speaking_rights := false"
          - "case.adjudication_status := FORMAL_REFERRED"
          - "case.version += 1"
      - from: INFORMAL_ACCEPTED
        to: SANCTION_IMPOSED
        trigger: "POST /integrity/sanctions/{id}/impose"
        actor: IntegrityOfficer
        preconditions:
          - "sanction.status == ACCEPTED, else ERR_SANCTION_STATE_INVALID"
          - "sanction.effective_from >= case.decided_at, else ERR_SANCTION_EFFECTIVE_BEFORE_DECISION"
        side_effects:
          - "see the depth-5 cascade documented on state_machines.Sanction.ACCEPTED_to_IMPOSED"
          - "case.adjudication_status := SANCTION_IMPOSED"
      - from: DECIDED
        to: SANCTION_IMPOSED
        trigger: "POST /integrity/sanctions/{id}/impose"
        actor: IntegrityOfficer
        preconditions:
          - "sanction.status == PROPOSED, else ERR_SANCTION_STATE_INVALID"
          - "case.responsibility_finding == RESPONSIBLE, else ERR_CASE_STATE_INVALID"
          - "sanction.effective_from >= case.decided_at, else ERR_SANCTION_EFFECTIVE_BEFORE_DECISION"
        side_effects:
          - "see the depth-5 cascade documented on state_machines.Sanction.PROPOSED_to_IMPOSED"
          - "case.adjudication_status := SANCTION_IMPOSED"
      - from: DECIDED
        to: APPEAL_UNDER_REVIEW
        trigger: "POST /integrity/appeals/{id}/screen with decision == ACCEPT_FOR_REVIEW"
        actor: AppealsDean
        preconditions:
          - "appeal.status == SUBMITTED, else ERR_APPEAL_STATE_INVALID"
          - "case.adjudication_status in (DECIDED, INFORMAL_ACCEPTED, SANCTION_IMPOSED)"
        side_effects:
          - "appeal.status := UNDER_REVIEW"
          - "case.pre_appeal_adjudication_status := case.adjudication_status"
          - "case.adjudication_status := APPEAL_UNDER_REVIEW"
          - "case.version += 1"
      - from: INFORMAL_ACCEPTED
        to: APPEAL_UNDER_REVIEW
        trigger: "POST /integrity/appeals/{id}/screen with decision == ACCEPT_FOR_REVIEW"
        actor: AppealsDean
        preconditions:
          - "identical to DECIDED_to_APPEAL_UNDER_REVIEW; additionally appeal.grounds must be PROCEDURE because an accepted informal resolution is not appealable on EVIDENCE or SANCTION_SEVERITY grounds, else ERR_INFORMAL_RESOLUTION_NOT_APPEALABLE"
        side_effects:
          - "identical to DECIDED_to_APPEAL_UNDER_REVIEW"
      - from: SANCTION_IMPOSED
        to: APPEAL_UNDER_REVIEW
        trigger: "POST /integrity/appeals/{id}/screen with decision == ACCEPT_FOR_REVIEW"
        actor: AppealsDean
        preconditions:
          - "identical to DECIDED_to_APPEAL_UNDER_REVIEW"
        side_effects:
          - "identical to DECIDED_to_APPEAL_UNDER_REVIEW"
      - from: APPEAL_UNDER_REVIEW
        to: DECIDED
        trigger: "POST /integrity/appeals/{id}/decide with outcome in (UPHELD_ORIGINAL, SANCTION_REDUCED) when case.pre_appeal_adjudication_status == DECIDED"
        actor: AppealsDean
        preconditions:
          - "appeal.status == UNDER_REVIEW, else ERR_APPEAL_STATE_INVALID"
        side_effects:
          - "see state_machines.Appeal for the outcome-specific effects"
          - "case.adjudication_status := case.pre_appeal_adjudication_status, then case.pre_appeal_adjudication_status := null"
          - "case.version += 1"
      - from: APPEAL_UNDER_REVIEW
        to: INFORMAL_ACCEPTED
        trigger: "POST /integrity/appeals/{id}/decide with outcome in (UPHELD_ORIGINAL, SANCTION_REDUCED) when case.pre_appeal_adjudication_status == INFORMAL_ACCEPTED"
        actor: AppealsDean
        preconditions:
          - "appeal.status == UNDER_REVIEW, else ERR_APPEAL_STATE_INVALID"
        side_effects:
          - "identical to APPEAL_UNDER_REVIEW_to_DECIDED but the restored status is INFORMAL_ACCEPTED"
      - from: APPEAL_UNDER_REVIEW
        to: SANCTION_IMPOSED
        trigger: "POST /integrity/appeals/{id}/decide with outcome in (UPHELD_ORIGINAL, SANCTION_REDUCED) when case.pre_appeal_adjudication_status == SANCTION_IMPOSED"
        actor: AppealsDean
        preconditions:
          - "appeal.status == UNDER_REVIEW, else ERR_APPEAL_STATE_INVALID"
        side_effects:
          - "identical to APPEAL_UNDER_REVIEW_to_DECIDED but the restored status is SANCTION_IMPOSED"
      - from: APPEAL_UNDER_REVIEW
        to: FORMAL_REFERRED
        trigger: "POST /integrity/appeals/{id}/decide with outcome == REMANDED"
        actor: AppealsDean
        preconditions:
          - "appeal.status == UNDER_REVIEW, else ERR_APPEAL_STATE_INVALID"
          - "appeal.grounds in (PROCEDURE, EVIDENCE), else ERR_APPEAL_GROUNDS_MISMATCH"
          - "case.pathway == FORMAL, else ERR_CASE_PATHWAY_NOT_SET"
          - "case.hearing_round <= 1, else ERR_REMAND_LIMIT_REACHED"
        side_effects:
          - "appeal.status := REMANDED and appeal.decided_at := current logical clock"
          - "every Sanction for the case with status in (PROPOSED, ACCEPTED, IMPOSED) transitions to VACATED with vacated_reason APPEAL_REMANDED"
          - "case.responsibility_finding := UNDETERMINED, case.finding_basis := NONE, case.panel_severity_recommendation := null, case.decided_at := null"
          - "case.recommended_ladder_rank and the office band are recomputed under calculations.sanction_ladder_placement variant formal_full with panel_severity_recommendation null, so the rank falls back to the tier_rank"
          - "case.notation_status := NOT_APPLICABLE when it was PENDING_POSTING, and remains POSTED when it was already POSTED"
          - "a Notification with kind REHEARING_NOTICE is created for the case"
          - "every AdvisorEngagement for the case with status APPROVED returns to REQUESTED"
          - "Student.active_sanction_points is recomputed [INV inv-active-sanction-points]"
          - "case.pre_appeal_adjudication_status := null"
          - "case.adjudication_status := FORMAL_REFERRED"
          - "case.version += 1"
      - from: APPEAL_UNDER_REVIEW
        to: CLOSED
        trigger: "POST /integrity/appeals/{id}/decide with outcome == OVERTURNED"
        actor: AppealsDean
        preconditions:
          - "appeal.status == UNDER_REVIEW, else ERR_APPEAL_STATE_INVALID"
          - "appeal.grounds in (PROCEDURE, EVIDENCE), else ERR_APPEAL_GROUNDS_MISMATCH"
        side_effects:
          - "the depth-4 cascade documented on state_machines.Appeal.UNDER_REVIEW_to_OVERTURNED runs in full"
          - "case.overturned := true"
          - "case.adjudication_status := CLOSED"
          - "case.version += 1"
      - from: SANCTION_IMPOSED
        to: CLOSED
        trigger: "POST /integrity/sanctions/{id}/complete"
        actor: IntegrityOfficer
        preconditions:
          - "sanction.status == IMPOSED, else ERR_SANCTION_STATE_INVALID"
          - "no Appeal for the case has status in (SUBMITTED, UNDER_REVIEW), else ERR_CASE_STATE_INVALID"
        side_effects:
          - "sanction.status := COMPLETED and sanction.completed_at := current logical clock"
          - "Student.active_sanction_points -= sanction.ladder_rank [INV inv-active-sanction-points]"
          - "Student.standing is recomputed from the new active_sanction_points"
          - "case.expungement_eligible_at := calculations.notation_expungement_eligibility when case.notation_status == POSTED, otherwise unchanged"
          - "Department.open_case_count -= 1 [INV inv-department-open-cases]"
          - "case.adjudication_status := CLOSED"
          - "case.version += 1"
      - from: INTAKE_REVIEW
        to: DISMISSED
        trigger: "POST /integrity/cases/{id}/dismiss"
        actor: IntegrityOfficer
        preconditions:
          - "case.adjudication_status in (INTAKE_REVIEW, NOTIFIED, FORMAL_REFERRED), else ERR_CASE_STATE_INVALID"
        side_effects:
          - "case.dismiss_reason := the supplied reason"
          - "every Sanction for the case with status in (PROPOSED, ACCEPTED) transitions to VACATED with vacated_reason CASE_DISMISSED"
          - "Department.open_case_count -= 1 [INV inv-department-open-cases]"
          - "case.adjudication_status := DISMISSED"
          - "case.version += 1"
      - from: NOTIFIED
        to: DISMISSED
        trigger: "POST /integrity/cases/{id}/dismiss"
        actor: IntegrityOfficer
        preconditions:
          - "identical to INTAKE_REVIEW_to_DISMISSED"
        side_effects:
          - "identical to INTAKE_REVIEW_to_DISMISSED"
      - from: FORMAL_REFERRED
        to: DISMISSED
        trigger: "POST /integrity/cases/{id}/dismiss"
        actor: IntegrityOfficer
        preconditions:
          - "identical to INTAKE_REVIEW_to_DISMISSED"
        side_effects:
          - "identical to INTAKE_REVIEW_to_DISMISSED"

  - entity: Case
    state_field: notation_status
    dimension: notation
    initial_state: NOT_APPLICABLE
    terminal_states: [EXPUNGED]
    notes: "Second, independent dimension of the same Case row. It is driven by the RegistrarOfficer and the Student, never by the IntegrityOfficer, and it contains the cycle EXPUNGEMENT_REQUESTED -> EXPUNGEMENT_DENIED -> EXPUNGEMENT_REQUESTED. A Case may sit in adjudication_status CLOSED while notation_status is still POSTED."
    transitions:
      - from: NOT_APPLICABLE
        to: PENDING_POSTING
        trigger: "system, as a side effect of POST /integrity/sanctions/{id}/impose"
        actor: system
        preconditions:
          - "the imposed Sanction.ladder_rank >= NOTATION_MIN_RANK (4)"
        side_effects:
          - "case.notation_status := PENDING_POSTING"
          - "case.expungement_eligible_at remains null until the sanction is COMPLETED"
      - from: PENDING_POSTING
        to: POSTED
        trigger: "POST /integrity/cases/{id}/notation/post"
        actor: RegistrarOfficer
        preconditions:
          - "case.notation_status == PENDING_POSTING, else ERR_NOTATION_STATE_INVALID"
        side_effects:
          - "case.notation_status := POSTED"
          - "Student.transcript_notation := POSTED [see entities.Student.fields.transcript_notation]"
          - "case.expungement_eligible_at := calculations.notation_expungement_eligibility, or null when the governing Sanction is not yet COMPLETED"
          - "case.version += 1"
      - from: POSTED
        to: EXPUNGEMENT_REQUESTED
        trigger: "POST /integrity/cases/{id}/notation/expungement-request"
        actor: Student
        preconditions:
          - "case.notation_status in (POSTED, EXPUNGEMENT_DENIED), else ERR_NOTATION_STATE_INVALID"
          - "the acting X-User-ID equals case.student_id, else ERR_NOT_RESOURCE_OWNER"
          - "the governing Sanction.ladder_rank has a non-null entry in ELIGIBILITY_DAYS, else ERR_NOTATION_NOT_EXPUNGEABLE"
          - "case.expungement_eligible_at != null AND current logical clock >= case.expungement_eligible_at, else ERR_EXPUNGEMENT_TOO_EARLY"
        side_effects:
          - "case.notation_status := EXPUNGEMENT_REQUESTED"
          - "case.version += 1"
      - from: EXPUNGEMENT_DENIED
        to: EXPUNGEMENT_REQUESTED
        trigger: "POST /integrity/cases/{id}/notation/expungement-request"
        actor: Student
        preconditions:
          - "identical to POSTED_to_EXPUNGEMENT_REQUESTED; the cycle may repeat without bound"
        side_effects:
          - "identical to POSTED_to_EXPUNGEMENT_REQUESTED"
      - from: EXPUNGEMENT_REQUESTED
        to: EXPUNGED
        trigger: "POST /integrity/cases/{id}/notation/expungement-decision with decision == GRANT"
        actor: RegistrarOfficer
        preconditions:
          - "case.notation_status == EXPUNGEMENT_REQUESTED, else ERR_NOTATION_STATE_INVALID"
        side_effects:
          - "case.notation_status := EXPUNGED"
          - "Student.transcript_notation is re-derived: POSTED when any other Case of the student still has notation_status == POSTED, else EXPUNGED (this case now has notation_status EXPUNGED), never NONE"
          - "case.version += 1"
      - from: EXPUNGEMENT_REQUESTED
        to: EXPUNGEMENT_DENIED
        trigger: "POST /integrity/cases/{id}/notation/expungement-decision with decision == DENY"
        actor: RegistrarOfficer
        preconditions:
          - "case.notation_status == EXPUNGEMENT_REQUESTED, else ERR_NOTATION_STATE_INVALID"
        side_effects:
          - "case.notation_status := EXPUNGEMENT_DENIED"
          - "Student.transcript_notation is unchanged"
          - "case.version += 1"
      - from: POSTED
        to: EXPUNGED
        trigger: "system, as a side effect of POST /integrity/appeals/{id}/decide with outcome == OVERTURNED"
        actor: system
        preconditions:
          - "case.notation_status == POSTED"
        side_effects:
          - "case.notation_status := EXPUNGED with no eligibility waiting period (an overturned finding is expunged immediately)"
          - "Student.transcript_notation is recomputed"
      - from: PENDING_POSTING
        to: NOT_APPLICABLE
        trigger: "system, as a side effect of POST /integrity/appeals/{id}/decide with outcome == OVERTURNED or REMANDED"
        actor: system
        preconditions:
          - "case.notation_status == PENDING_POSTING"
        side_effects:
          - "case.notation_status := NOT_APPLICABLE (the notation was never posted, so nothing to expunge)"

  - entity: AdvisorEngagement
    state_field: status
    initial_state: REQUESTED
    terminal_states: [DENIED]
    notes: "Cyclic: APPROVED -> REQUESTED whenever a REHEARING_NOTICE is created for the case, so an approved advisor must be re-confirmed for every new hearing round."
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /integrity/advisor-engagements/{id}/review with decision == APPROVE"
        actor: IntegrityOfficer
        preconditions:
          - "engagement.status == REQUESTED, else ERR_ADVISOR_ENGAGEMENT_STATE_INVALID"
        side_effects:
          - "engagement.status := APPROVED"
          - "engagement.reconfirmation_required := false"
          - "engagement.speaking_rights := true when advisor_kind == ATTORNEY, else false (non-attorney advisors may attend but not speak)"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /integrity/advisor-engagements/{id}/review with decision == DENY"
        actor: IntegrityOfficer
        preconditions:
          - "engagement.status == REQUESTED, else ERR_ADVISOR_ENGAGEMENT_STATE_INVALID"
          - "decision_reason is present, else ERR_INVALID_REQUEST"
        side_effects:
          - "engagement.status := DENIED and engagement.decision_reason := the supplied reason"
          - "engagement.speaking_rights := false"
          - "the engagement no longer counts against ADVISOR_LIMIT_PER_CASE"
      - from: APPROVED
        to: REQUESTED
        trigger: "system, whenever a Notification with kind REHEARING_NOTICE is created for the engagement's case (adjournment or remand)"
        actor: system
        preconditions:
          - "engagement.status == APPROVED"
        side_effects:
          - "engagement.status := REQUESTED"
          - "engagement.reconfirmation_required := true"
          - "engagement.speaking_rights := false"
          - "the case can no longer be convened until the engagement is reviewed again (see ERR_ADVISOR_REQUEST_PENDING)"

  - entity: CaseMeeting
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [HELD, NO_SHOW, CANCELLED]
    notes: "Branching: the three terminal outcomes carry different side-effect sets."
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /integrity/case-meetings/{id}/outcome with outcome == HELD"
        actor: FacultyReporter
        preconditions:
          - "meeting.status == SCHEDULED, else ERR_MEETING_STATE_INVALID"
          - "the acting X-User-ID equals meeting.instructor_id, else ERR_NOT_RESOURCE_OWNER"
          - "current logical clock >= meeting.start_at, else ERR_MEETING_WINDOW_INVALID"
        side_effects:
          - "meeting.status := HELD"
          - "meeting.advisor_present := true when the case has an AdvisorEngagement with status APPROVED at the moment of the call, else false"
          - "the meeting keeps occupying the instructor's calendar interval"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /integrity/case-meetings/{id}/outcome with outcome == NO_SHOW"
        actor: FacultyReporter
        preconditions:
          - "meeting.status == SCHEDULED, else ERR_MEETING_STATE_INVALID"
          - "the acting X-User-ID equals meeting.instructor_id, else ERR_NOT_RESOURCE_OWNER"
          - "current logical clock >= meeting.end_at, else ERR_MEETING_WINDOW_INVALID"
        side_effects:
          - "meeting.status := NO_SHOW"
          - "meeting.advisor_present := false"
          - "the meeting keeps occupying the instructor's calendar interval"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /integrity/case-meetings/{id}/outcome with outcome == CANCELLED"
        actor: IntegrityOfficer
        preconditions:
          - "meeting.status == SCHEDULED, else ERR_MEETING_STATE_INVALID"
        side_effects:
          - "meeting.status := CANCELLED"
          - "meeting.advisor_present := false"
          - "the instructor's calendar interval is released, so a later CaseMeeting may occupy the same half-open interval"

  - entity: HearingSession
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [DECIDED, ADJOURNED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CONVENED
        trigger: "POST /integrity/hearing-sessions/{id}/convene"
        actor: PanelChair
        preconditions:
          - "see state_machines.Case.HEARING_SCHEDULED_to_HEARING_IN_PROGRESS"
        side_effects:
          - "session.status := CONVENED and the case advances to HEARING_IN_PROGRESS"
      - from: CONVENED
        to: DECIDED
        trigger: "POST /integrity/hearing-sessions/{id}/decide"
        actor: PanelChair
        preconditions:
          - "see state_machines.Case.HEARING_IN_PROGRESS_to_DECIDED"
        side_effects:
          - "session.effective_vote_count, panel_finding and panel_severity_recommendation are written from calculations.panel_decision_tally"
          - "no further PanelVote may be cast for the session (POST /integrity/panel-votes requires session.status == CONVENED)"
      - from: CONVENED
        to: ADJOURNED
        trigger: "POST /integrity/hearing-sessions/{id}/adjourn"
        actor: PanelChair
        preconditions:
          - "see state_machines.Case.HEARING_IN_PROGRESS_to_FORMAL_REFERRED"
        side_effects:
          - "session.status := ADJOURNED; the PanelVote rows already cast remain attached to this session and are never counted again in a later round"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /integrity/hearing-sessions/{id}/cancel"
        actor: IntegrityOfficer
        preconditions:
          - "see state_machines.Case.HEARING_SCHEDULED_to_FORMAL_REFERRED"
        side_effects:
          - "session.status := CANCELLED and the room's booked_minutes_total is released [INV inv-room-minutes-conserved]"

  - entity: Sanction
    state_field: status
    initial_state: PROPOSED
    terminal_states: [DECLINED, SUPERSEDED, VACATED, COMPLETED]
    transitions:
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system, when a newer Sanction is created for the same case by POST /integrity/sanctions or POST /integrity/cases/{id}/informal-resolution"
        actor: system
        preconditions:
          - "sanction.status == PROPOSED"
        side_effects:
          - "sanction.status := SUPERSEDED and sanction.vacated_reason := SUPERSEDED_BY_NEWER_PROPOSAL"
          - "the newer Sanction.replaces_sanction_id := this sanction's id"
          - "Student.active_sanction_points is unaffected (PROPOSED sanctions never contributed) [INV inv-active-sanction-points]"
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /integrity/cases/{id}/informal-response with response == ACCEPT"
        actor: Student
        preconditions:
          - "sanction.status == PROPOSED and sanction.origin == INFORMAL_PROPOSAL"
        side_effects:
          - "sanction.status := ACCEPTED"
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /integrity/cases/{id}/informal-response with response == DECLINE"
        actor: Student
        preconditions:
          - "sanction.status == PROPOSED and sanction.origin == INFORMAL_PROPOSAL"
        side_effects:
          - "sanction.status := DECLINED"
          - "the case moves to FORMAL_REFERRED and its severity is re-derived under the formal_full variant"
      - from: PROPOSED
        to: IMPOSED
        trigger: "POST /integrity/sanctions/{id}/impose"
        actor: IntegrityOfficer
        preconditions:
          - "sanction.status == PROPOSED, else ERR_SANCTION_STATE_INVALID"
          - "case.adjudication_status == DECIDED, else ERR_CASE_STATE_INVALID"
          - "case.responsibility_finding == RESPONSIBLE, else ERR_CASE_STATE_INVALID"
          - "sanction.effective_from >= case.decided_at, else ERR_SANCTION_EFFECTIVE_BEFORE_DECISION"
        side_effects:
          - "HOP 1 - sanction.status := IMPOSED, sanction.imposed_at := current logical clock; when sanction.kind in (GRADE_PENALTY_ASSIGNMENT, GRADE_PENALTY_COURSE) the fields baseline_course_grade_pct, adjusted_course_grade_pct and grade_penalty_delta_pct are written from calculations.adjusted_course_grade_pct"
          - "HOP 2 - case.adjudication_status := SANCTION_IMPOSED; case.notation_status := PENDING_POSTING when sanction.ladder_rank >= NOTATION_MIN_RANK (4); case.version += 1"
          - "HOP 3 - Student.prior_upheld_count is recomputed (it now includes this case), Student.active_sanction_points += sanction.ladder_rank [INV inv-active-sanction-points], Student.standing is recomputed from the new points total"
          - "HOP 4 - every OTHER Case of the same student whose adjudication_status is NOT IN (CLOSED, DISMISSED) is re-assessed in created_at ASC order: cross_course_pattern_points, prior_upheld_count_at_assessment, prior_escalation_points, provisional_severity_index, severity_index and recommended_ladder_rank are recomputed from the student's new prior_upheld_count"
          - "HOP 5 - for each sibling case re-assessed in HOP 4, any Sanction with status == PROPOSED whose ladder_rank now falls outside the recomputed office band transitions to VACATED with vacated_reason LADDER_RECOMPUTE, and a Notification with kind SANCTION_RECOMPUTE_NOTICE is created on that sibling case"
      - from: ACCEPTED
        to: IMPOSED
        trigger: "POST /integrity/sanctions/{id}/impose"
        actor: IntegrityOfficer
        preconditions:
          - "sanction.status == ACCEPTED, else ERR_SANCTION_STATE_INVALID"
          - "case.adjudication_status == INFORMAL_ACCEPTED, else ERR_CASE_STATE_INVALID"
          - "sanction.effective_from >= case.decided_at, else ERR_SANCTION_EFFECTIVE_BEFORE_DECISION"
        side_effects:
          - "identical five-hop cascade to PROPOSED_to_IMPOSED, except that HOP 2 sets case.adjudication_status := SANCTION_IMPOSED from INFORMAL_ACCEPTED"
      - from: IMPOSED
        to: COMPLETED
        trigger: "POST /integrity/sanctions/{id}/complete"
        actor: IntegrityOfficer
        preconditions:
          - "sanction.status == IMPOSED, else ERR_SANCTION_STATE_INVALID"
          - "no Appeal for the case has status in (SUBMITTED, UNDER_REVIEW), else ERR_CASE_STATE_INVALID"
        side_effects:
          - "sanction.status := COMPLETED and sanction.completed_at := current logical clock"
          - "Student.active_sanction_points -= sanction.ladder_rank [INV inv-active-sanction-points]"
          - "case.expungement_eligible_at := calculations.notation_expungement_eligibility when case.notation_status == POSTED"
          - "case.adjudication_status := CLOSED and Department.open_case_count -= 1 [INV inv-department-open-cases]"
      - from: PROPOSED
        to: VACATED
        trigger: "system, on POST /integrity/appeals/{id}/decide with outcome in (OVERTURNED, REMANDED, SANCTION_REDUCED), on POST /integrity/cases/{id}/dismiss, or on a HOP 5 ladder recompute"
        actor: system
        preconditions:
          - "sanction.status == PROPOSED"
        side_effects:
          - "sanction.status := VACATED and sanction.vacated_reason := one of APPEAL_OVERTURNED, APPEAL_REMANDED, APPEAL_REDUCED, CASE_DISMISSED, LADDER_RECOMPUTE"
          - "Student.active_sanction_points is unchanged"
      - from: ACCEPTED
        to: VACATED
        trigger: "system, on POST /integrity/appeals/{id}/decide with outcome in (OVERTURNED, SANCTION_REDUCED) or on POST /integrity/cases/{id}/dismiss"
        actor: system
        preconditions:
          - "sanction.status == ACCEPTED"
        side_effects:
          - "sanction.status := VACATED with the corresponding vacated_reason"
          - "Student.active_sanction_points is unchanged"
      - from: IMPOSED
        to: VACATED
        trigger: "system, on POST /integrity/appeals/{id}/decide with outcome in (OVERTURNED, REMANDED, SANCTION_REDUCED)"
        actor: system
        preconditions:
          - "sanction.status == IMPOSED"
        side_effects:
          - "sanction.status := VACATED with the corresponding vacated_reason"
          - "Student.active_sanction_points -= sanction.ladder_rank, exactly reversing the HOP 3 increment [INV inv-active-sanction-points]"
          - "Student.standing is recomputed"

  - entity: Appeal
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [DENIED_NO_GROUNDS, UPHELD_ORIGINAL, SANCTION_REDUCED, REMANDED, OVERTURNED]
    notes: "Branching: five terminal outcomes with five distinct side-effect sets. Only one Appeal may be open per case at a time and at most APPEAL_MAX_PER_CASE (2) appeals may ever be filed for a case."
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /integrity/appeals/{id}/screen with decision == ACCEPT_FOR_REVIEW"
        actor: AppealsDean
        preconditions:
          - "appeal.status == SUBMITTED, else ERR_APPEAL_STATE_INVALID"
          - "when case.pathway == INFORMAL and case.adjudication_status == INFORMAL_ACCEPTED, appeal.grounds must be PROCEDURE, else ERR_INFORMAL_RESOLUTION_NOT_APPEALABLE"
        side_effects:
          - "appeal.status := UNDER_REVIEW"
          - "case.pre_appeal_adjudication_status := case.adjudication_status and case.adjudication_status := APPEAL_UNDER_REVIEW"
      - from: SUBMITTED
        to: DENIED_NO_GROUNDS
        trigger: "POST /integrity/appeals/{id}/screen with decision == DENY_NO_GROUNDS"
        actor: AppealsDean
        preconditions:
          - "appeal.status == SUBMITTED, else ERR_APPEAL_STATE_INVALID"
          - "decision_reason is present, else ERR_INVALID_REQUEST"
        side_effects:
          - "appeal.status := DENIED_NO_GROUNDS, appeal.decision_reason := the supplied reason, appeal.decided_at := current logical clock"
          - "case.adjudication_status is NOT changed (the appeal never reached review)"
          - "a Notification with kind APPEAL_OUTCOME_NOTICE is created for the case"
      - from: UNDER_REVIEW
        to: UPHELD_ORIGINAL
        trigger: "POST /integrity/appeals/{id}/decide with outcome == UPHELD_ORIGINAL"
        actor: AppealsDean
        preconditions:
          - "appeal.status == UNDER_REVIEW, else ERR_APPEAL_STATE_INVALID"
        side_effects:
          - "appeal.status := UPHELD_ORIGINAL and appeal.decided_at := current logical clock"
          - "no Sanction changes status; the case's severity fields are untouched"
          - "case.adjudication_status := case.pre_appeal_adjudication_status and case.pre_appeal_adjudication_status := null"
          - "a Notification with kind APPEAL_OUTCOME_NOTICE is created for the case"
      - from: UNDER_REVIEW
        to: SANCTION_REDUCED
        trigger: "POST /integrity/appeals/{id}/decide with outcome == SANCTION_REDUCED"
        actor: AppealsDean
        preconditions:
          - "appeal.status == UNDER_REVIEW, else ERR_APPEAL_STATE_INVALID"
          - "appeal.grounds == SANCTION_SEVERITY, else ERR_APPEAL_GROUNDS_MISMATCH"
          - "reduced_ladder_rank is present, else ERR_INVALID_REQUEST"
          - "1 <= reduced_ladder_rank < the governing Sanction.ladder_rank, else ERR_REDUCED_RANK_INVALID"
        side_effects:
          - "the governing Sanction transitions to VACATED with vacated_reason APPEAL_REDUCED"
          - "a replacement Sanction is created with origin APPEAL_REDUCTION, replaces_sanction_id := the vacated sanction's id, ladder_rank := reduced_ladder_rank, kind := LADDER_KIND[reduced_ladder_rank], and status := IMPOSED when the vacated sanction was IMPOSED, otherwise PROPOSED"
          - "Student.active_sanction_points is recomputed, so it drops by (old ladder_rank - reduced_ladder_rank) when the sanction was IMPOSED [INV inv-active-sanction-points]"
          - "Student.standing is recomputed"
          - "case.notation_status := NOT_APPLICABLE (from PENDING_POSTING) or EXPUNGED (from POSTED) when reduced_ladder_rank < NOTATION_MIN_RANK (4), otherwise unchanged"
          - "case.adjudication_status := case.pre_appeal_adjudication_status and case.pre_appeal_adjudication_status := null"
          - "a Notification with kind APPEAL_OUTCOME_NOTICE is created for the case"
      - from: UNDER_REVIEW
        to: REMANDED
        trigger: "POST /integrity/appeals/{id}/decide with outcome == REMANDED"
        actor: AppealsDean
        preconditions:
          - "see state_machines.Case.APPEAL_UNDER_REVIEW_to_FORMAL_REFERRED"
        side_effects:
          - "see state_machines.Case.APPEAL_UNDER_REVIEW_to_FORMAL_REFERRED"
      - from: UNDER_REVIEW
        to: OVERTURNED
        trigger: "POST /integrity/appeals/{id}/decide with outcome == OVERTURNED"
        actor: AppealsDean
        preconditions:
          - "appeal.status == UNDER_REVIEW, else ERR_APPEAL_STATE_INVALID"
          - "appeal.grounds in (PROCEDURE, EVIDENCE), else ERR_APPEAL_GROUNDS_MISMATCH"
        side_effects:
          - "HOP 1 - appeal.status := OVERTURNED and appeal.decided_at := current logical clock"
          - "HOP 2 - case.overturned := true, case.responsibility_finding := NOT_RESPONSIBLE, case.finding_basis := APPEAL, case.adjudication_status := CLOSED, case.pre_appeal_adjudication_status := null; case.notation_status := EXPUNGED when it was POSTED and NOT_APPLICABLE when it was PENDING_POSTING; every Sanction for the case with status in (PROPOSED, ACCEPTED, IMPOSED) transitions to VACATED with vacated_reason APPEAL_OVERTURNED"
          - "HOP 3 - Student.prior_upheld_count is recomputed (this case no longer counts), Student.active_sanction_points drops by the ladder_rank of every sanction that was IMPOSED [INV inv-active-sanction-points], Student.standing and Student.transcript_notation are recomputed, and Department.open_case_count -= 1 [INV inv-department-open-cases]"
          - "HOP 4 - every OTHER Case of the same student whose adjudication_status is NOT IN (CLOSED, DISMISSED) is re-assessed in created_at ASC order (cross_course_pattern_points, prior_upheld_count_at_assessment, prior_escalation_points, provisional_severity_index, severity_index, recommended_ladder_rank), and any sibling Sanction with status == PROPOSED that now falls outside the recomputed office band transitions to VACATED with vacated_reason LADDER_RECOMPUTE"
          - "a Notification with kind APPEAL_OUTCOME_NOTICE is created for the case"

# ============================================================================
# §1.2.1 CONCURRENCY RULES (optimistic concurrency control)
# ============================================================================
concurrency_rules:
  - name: formal-sanction-create-stale-case
    rule_id: formal-sanction-create-stale-case
    parent_entity: Case
    parent_version_field: version
    child_entity: Sanction
    occ_field: expected_case_version
    write_endpoint: "POST /integrity/sanctions"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    description: |
      A formal sanction proposal is written against the Case snapshot the officer read. The request
      body carries expected_case_version; the server compares it with Case.version and rejects the
      write with ERR_STALE_CASE_VERSION (412) when the values differ. Every accepted write bumps
      Case.version, so a client that has not re-read GET /integrity/cases/{id} after any earlier
      accepted write on the same case is rejected. Because the write also supersedes an existing
      PROPOSED sanction, a stale proposal must never be allowed to displace a newer one.
    version_source: "GET /integrity/cases/{id} -> data.version"
    side_effects_on_success:
      - "Case.version += 1"
      - "any prior Sanction for the case with status == PROPOSED transitions to SUPERSEDED"

  - name: informal-proposal-stale-case
    rule_id: informal-proposal-stale-case
    parent_entity: Case
    parent_version_field: version
    child_entity: Sanction
    occ_field: expected_case_version
    write_endpoint: "POST /integrity/cases/{id}/informal-resolution"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    description: |
      An informal instructor proposal is likewise written against a Case snapshot. The instructor
      supplies expected_case_version taken from the Case read before drafting the proposal; a
      mismatch with Case.version yields ERR_STALE_CASE_VERSION (412) and no Sanction is created.
      This matters because the office may have re-assessed severity (HOP 4 of a sibling-case
      recompute) between the instructor's read and write, which would move the permitted informal
      ladder band under the instructor's feet.
    version_source: "GET /integrity/cases/{id} -> data.version"
    side_effects_on_success:
      - "Case.version += 1"
      - "Case.adjudication_status := INFORMAL_PROPOSED"
      - "any prior Sanction for the case with status == PROPOSED transitions to SUPERSEDED"

# ============================================================================
# §1.3 CALCULATION RULES
# All arithmetic uses decimal semantics with ROUND_HALF_UP at every rounding
# step named below. Money-free domain: all percentages and indices carry
# exactly 2 decimal places; ladder ranks and point counts are integers.
# ============================================================================
calculations:
  - name: evidence_strength_score
    algorithm_type: weighted_scoring
    applies_to: IntegrityReport
    output_field: IntegrityReport.evidence_strength_score
    recomputed_on:
      - "POST /integrity/evidence-items (every attachment for the report)"
      - "POST /integrity/reports/{id}/submit"
    constants:
      EXCLUDED_QUOTE_ALLOWANCE_PCT: 5.00
      SIMILARITY_BAND_HIGH_PCT: 40.00
      SIMILARITY_BAND_HIGH_MULTIPLIER: 1.20
      SIMILARITY_BAND_MID_PCT: 20.00
      SIMILARITY_BAND_MID_MULTIPLIER: 1.00
      SIMILARITY_BAND_LOW_MULTIPLIER: 0.70
      KIND_WEIGHT: { SIMILARITY_REPORT: 1.00, PROCTOR_LOG: 0.60, WITNESS_STATEMENT: 0.40, DOCUMENT: 0.20 }
      KIND_DIVERSITY_SCALE: 10
      PAGE_POINTS_PER_PAGE: 0.50
      PAGE_CAP: 20
      CORROBORATION_BONUS: 15.00
      SCORE_CAP: 100.00
    input_set: "all EvidenceItem rows whose report_id equals this report"
    formula: |
      The five steps below are DEPENDENCY-ORDERED and must run in exactly this sequence; step 3
      consumes the multiplier chosen in step 2, which consumes the allowance subtraction of step 1.
      Choosing the band from the raw similarity_pct instead of the allowance-adjusted value is the
      classic error and is observable at the 45.00 / 44.99 boundary.

      STEP 1  adjusted_similarity_pct = max(0.00, MAX(similarity_pct over EvidenceItems with
              kind == SIMILARITY_REPORT) - EXCLUDED_QUOTE_ALLOWANCE_PCT).
              When the report has no SIMILARITY_REPORT evidence, adjusted_similarity_pct = 0.00.
      STEP 2  band_multiplier = SIMILARITY_BAND_HIGH_MULTIPLIER when
              adjusted_similarity_pct >= SIMILARITY_BAND_HIGH_PCT;
              else SIMILARITY_BAND_MID_MULTIPLIER when
              adjusted_similarity_pct >= SIMILARITY_BAND_MID_PCT;
              else SIMILARITY_BAND_LOW_MULTIPLIER.
      STEP 3  similarity_points = ROUND(adjusted_similarity_pct * band_multiplier, 2).
      STEP 4  page_points = ROUND(MIN(SUM(page_count over ALL EvidenceItems of the report),
              PAGE_CAP) * PAGE_POINTS_PER_PAGE, 2).
      STEP 5  kind_diversity_points = ROUND(SUM(KIND_WEIGHT[k] for each DISTINCT kind k present)
              * KIND_DIVERSITY_SCALE, 2).
      STEP 6  corroboration_bonus = CORROBORATION_BONUS when the report has >= 2 distinct evidence
              kinds AND at least one of those kinds is not DOCUMENT; else 0.00.
      STEP 7  evidence_strength_score = MIN(SCORE_CAP, ROUND(similarity_points + page_points
              + kind_diversity_points + corroboration_bonus, 2)).
    worked_examples:
      - name: SEED-A (one SIMILARITY_REPORT, similarity_pct 45.00, page_count 4)
        steps: "adjusted 40.00 -> band 1.20 -> similarity_points 48.00; page_points 4*0.50 = 2.00; kind_diversity 1.00*10 = 10.00; corroboration 0.00"
        result: 60.00
      - name: SEED-A-LOW (identical but similarity_pct 44.99)
        steps: "adjusted 39.99 -> band 1.00 -> similarity_points 39.99; page_points 2.00; kind_diversity 10.00; corroboration 0.00"
        result: 51.99
      - name: SEED-B (SIMILARITY_REPORT 45.00 / 4 pages plus PROCTOR_LOG / 1 page)
        steps: "similarity_points 48.00; page_points 5*0.50 = 2.50; kind_diversity (1.00+0.60)*10 = 16.00; corroboration 15.00"
        result: 81.50
      - name: SEED-B-LOW (same two items but similarity_pct 44.99)
        steps: "similarity_points 39.99; page_points 2.50; kind_diversity 16.00; corroboration 15.00"
        result: 73.49
      - name: SEED-PAGE-CAP (SIMILARITY_REPORT 45.00 / 12 pages plus PROCTOR_LOG / 3 pages)
        steps: "page total 15 is under PAGE_CAP so page_points 7.50; the rest as SEED-B"
        result: 86.50
      - name: SEED-DOC-ONLY (one DOCUMENT, 6 pages, no similarity report)
        steps: "adjusted 0.00 -> band 0.70 -> similarity_points 0.00; page_points 3.00; kind_diversity 0.20*10 = 2.00; corroboration 0.00 (single kind)"
        result: 5.00

  - name: cross_course_pattern_points
    algorithm_type: aggregation
    applies_to: Case
    output_field: Case.cross_course_pattern_points
    recomputed_on:
      - "POST /integrity/cases"
      - "GET /integrity/cases/{id}/severity-assessment"
      - "HOP 4 of the impose and appeal-overturn cascades"
    constants:
      PATTERN_WINDOW_DAYS: 730
      POINTS_ZERO_OTHER_COURSES: 0
      POINTS_ONE_OTHER_COURSE: 4
      POINTS_TWO_OR_MORE_OTHER_COURSES: 10
    input_set: |
      Case rows OTHER than this one belonging to the same student_id, with
      responsibility_finding == RESPONSIBLE, overturned == false, decided_at != null, and
      decided_at inside the INCLUSIVE window [current_clock - PATTERN_WINDOW_DAYS days,
      current_clock]. Cases with adjudication_status DISMISSED are excluded even when a finding
      was once recorded.
    formula: |
      distinct_other_course_codes = COUNT(DISTINCT CourseOffering.course_code over the input set),
      excluding the course_code of THIS case's own offering.
      cross_course_pattern_points =
        0  when distinct_other_course_codes == 0
        4  when distinct_other_course_codes == 1
        10 when distinct_other_course_codes >= 2
      Two prior cases in the SAME other course count as one distinct course_code and therefore
      yield 4, not 10 - the metric measures breadth, not volume.
    worked_examples:
      - name: no priors
        result: 0
      - name: two upheld priors both in HIST-110
        result: 4
      - name: upheld priors in HIST-110 and PHIL-220
        result: 10
      - name: prior in HIST-110 decided 731 days before the clock
        result: 0

  - name: case_severity_index
    algorithm_type: threshold
    applies_to: Case
    output_fields:
      - Case.provisional_severity_index
      - Case.prior_escalation_points
      - Case.severity_index
    recomputed_on:
      - "POST /integrity/cases"
      - "POST /integrity/cases/{id}/informal-response with response == DECLINE"
      - "POST /integrity/hearing-sessions/{id}/decide"
      - "GET /integrity/cases/{id}/severity-assessment"
      - "HOP 4 of the impose and appeal-overturn cascades"
    constants:
      BASE_POINTS: { PLAGIARISM: 20, UNAUTHORIZED_COLLABORATION: 18, EXAM_CHEATING: 28, FABRICATION_OF_DATA: 32, CONTRACT_CHEATING: 40, FACILITATION: 24 }
      EVIDENCE_WEIGHT: 0.40
      ESCALATION_PIVOT: 50.00
      ESCALATION_ONE_PRIOR_BELOW_PIVOT: 8
      ESCALATION_ONE_PRIOR_AT_OR_ABOVE_PIVOT: 14
      ESCALATION_MANY_PRIORS_BELOW_PIVOT: 18
      ESCALATION_MANY_PRIORS_AT_OR_ABOVE_PIVOT: 26
      INDEX_CAP: 120.00
    formula: |
      ORDER OF OPERATIONS IS PINNED. The escalation band is selected from the PROVISIONAL index,
      i.e. BEFORE the escalation points are added. Selecting it from the final index instead is a
      self-referential shortcut that silently inflates the result whenever the provisional index
      sits in [42.00, 50.00) with exactly one prior, or in [32.00, 50.00) with two or more priors.

      STEP 1  evidence_contribution = ROUND(evidence_strength_score * EVIDENCE_WEIGHT, 2), where
              evidence_strength_score is Case.evidence_strength_score (copied from the originating
              IntegrityReport at case creation and never re-read afterwards).
      STEP 2  provisional_severity_index = ROUND(BASE_POINTS[alleged_violation_type]
              + evidence_contribution + cross_course_pattern_points, 2).
      STEP 3  prior_upheld_count_at_assessment = Student.prior_upheld_count at assessment time,
              EXCLUDING this case itself.
      STEP 4  prior_escalation_points =
                0                                       when prior_upheld_count_at_assessment == 0
                ESCALATION_ONE_PRIOR_BELOW_PIVOT         when == 1 and provisional < ESCALATION_PIVOT
                ESCALATION_ONE_PRIOR_AT_OR_ABOVE_PIVOT   when == 1 and provisional >= ESCALATION_PIVOT
                ESCALATION_MANY_PRIORS_BELOW_PIVOT       when >= 2 and provisional < ESCALATION_PIVOT
                ESCALATION_MANY_PRIORS_AT_OR_ABOVE_PIVOT when >= 2 and provisional >= ESCALATION_PIVOT
      STEP 5  severity_index = MIN(INDEX_CAP,
                ROUND(provisional_severity_index + prior_escalation_points, 2)).
    worked_examples:
      - name: CASE-A (PLAGIARISM, SEED-A evidence 60.00, cross 0, one prior)
        steps: "contribution 24.00; provisional 44.00 (< 50.00) -> escalation 8; index 52.00"
        result: { provisional_severity_index: 44.00, prior_escalation_points: 8, severity_index: 52.00 }
        wrong_result_if_order_swapped: { prior_escalation_points: 14, severity_index: 58.00 }
      - name: CASE-B (PLAGIARISM, SEED-A evidence 60.00, cross 4, one prior)
        steps: "contribution 24.00; provisional 48.00 (< 50.00) -> escalation 8; index 56.00"
        result: { provisional_severity_index: 48.00, prior_escalation_points: 8, severity_index: 56.00 }
      - name: CASE-C (PLAGIARISM, SEED-A evidence 60.00, cross 0, no priors)
        result: { provisional_severity_index: 44.00, prior_escalation_points: 0, severity_index: 44.00 }
      - name: CASE-D (EXAM_CHEATING, SEED-B evidence 81.50, cross 10, two priors)
        steps: "contribution 32.60; provisional 70.60 (>= 50.00) -> escalation 26; index 96.60"
        result: { provisional_severity_index: 70.60, prior_escalation_points: 26, severity_index: 96.60 }
      - name: CASE-F (CONTRACT_CHEATING, SEED-B evidence 81.50, cross 10, two priors)
        steps: "contribution 32.60; provisional 82.60 -> escalation 26; index 108.60 (under the 120.00 cap)"
        result: { provisional_severity_index: 82.60, prior_escalation_points: 26, severity_index: 108.60 }
      - name: CASE-G (UNAUTHORIZED_COLLABORATION, SEED-A evidence 60.00, cross 0, two priors)
        steps: "contribution 24.00; provisional 42.00 (< 50.00) -> escalation 18; index 60.00"
        result: { provisional_severity_index: 42.00, prior_escalation_points: 18, severity_index: 60.00 }
        wrong_result_if_order_swapped: { prior_escalation_points: 26, severity_index: 68.00 }

  - name: sanction_ladder_placement
    algorithm_type: threshold
    applies_to: Case
    output_fields:
      - Case.recommended_ladder_rank
      - Case.informal_severity_index
      - Case.informal_recommended_ladder_rank
    recomputed_on:
      - "POST /integrity/cases"
      - "POST /integrity/cases/{id}/informal-response"
      - "POST /integrity/hearing-sessions/{id}/decide"
      - "GET /integrity/cases/{id}/severity-assessment"
      - "HOP 4 of the impose and appeal-overturn cascades"
    constants:
      LADDER_TIERS: "severity < 25.00 -> 1; < 40.00 -> 2; < 55.00 -> 3; < 70.00 -> 5; < 85.00 -> 6; < 100.00 -> 7; >= 100.00 -> 8"
      LADDER_KIND: { 1: WARNING, 2: GRADE_PENALTY_ASSIGNMENT, 3: GRADE_PENALTY_COURSE, 4: TRANSCRIPT_NOTATION_ONLY, 5: DISCIPLINARY_PROBATION, 6: SUSPENSION_ONE_TERM, 7: SUSPENSION_ONE_YEAR, 8: EXPULSION_RECOMMENDATION }
      INFORMAL_MAX_RANK: 3
      OFFICE_BAND_HALF_WIDTH: 1
      RANK_MIN: 1
      RANK_MAX: 8
      PANEL_SIZE_SMALL: 3
      PANEL_SIZE_LARGE: 5
      PANEL_SIZE_LARGE_MIN_RANK: 6
      ATTORNEY_ADVISOR_MIN_RANK: 6
      NOTATION_MIN_RANK: 4
    notes: |
      Rank 4 (TRANSCRIPT_NOTATION_ONLY) is deliberately UNREACHABLE from the tier table - the tiers
      jump from 3 to 5. Rank 4 can only enter the system through a panel severity recommendation
      floor or through an appeal reduction, so an implementation that derives the kind purely from
      the tier table will never emit TRANSCRIPT_NOTATION_ONLY and will fail the panel-floor tests.
    variants:
      - name: formal_full
        used_when: "case.pathway == FORMAL, and for every office-side write (POST /integrity/sanctions) and every GET /integrity/cases/{id}/severity-assessment call with pathway_basis omitted or FORMAL"
        input_set: "evidence_strength_score, alleged_violation_type, cross_course_pattern_points AND prior_escalation_points (the full repeat-offense database is visible to the office)"
        formula: |
          tier_rank = LADDER_TIERS(case.severity_index)
          recommended_ladder_rank = MAX(tier_rank, case.panel_severity_recommendation) when
            case.panel_severity_recommendation != null, else tier_rank.
          permitted office band = [MAX(RANK_MIN, recommended_ladder_rank - OFFICE_BAND_HALF_WIDTH),
                                   MIN(RANK_MAX, recommended_ladder_rank + OFFICE_BAND_HALF_WIDTH)]
          required_panel_size = PANEL_SIZE_LARGE when recommended_ladder_rank >= PANEL_SIZE_LARGE_MIN_RANK else PANEL_SIZE_SMALL
      - name: informal_instructor
        used_when: "POST /integrity/cases/{id}/informal-resolution, and GET /integrity/cases/{id}/severity-assessment with pathway_basis == INFORMAL"
        input_set: "evidence_strength_score and alleged_violation_type ONLY - cross_course_pattern_points and prior_escalation_points are EXCLUDED because policy bars instructors from reading the repeat-offense database"
        formula: |
          informal_severity_index = ROUND(BASE_POINTS[alleged_violation_type]
            + ROUND(evidence_strength_score * EVIDENCE_WEIGHT, 2), 2)
          informal_recommended_ladder_rank = MIN(LADDER_TIERS(informal_severity_index), INFORMAL_MAX_RANK)
          permitted informal band = [RANK_MIN, informal_recommended_ladder_rank]
            (an instructor may always propose a LOWER rank than the recommendation, never a higher one)
    variant_divergence_examples:
      - name: CASE-A (cross 0, one prior)
        formal: { severity_index: 52.00, tier_rank: 3, recommended_ladder_rank: 3, office_band: [2, 4], required_panel_size: 3 }
        informal: { informal_severity_index: 44.00, informal_recommended_ladder_rank: 3, informal_band: [1, 3] }
        divergence: "ranks agree here, but the permitted bands differ - the office may propose rank 4 while the instructor may not"
      - name: CASE-B (cross 4, one prior)
        formal: { severity_index: 56.00, tier_rank: 5, recommended_ladder_rank: 5, office_band: [4, 6], required_panel_size: 3 }
        informal: { informal_severity_index: 44.00, informal_recommended_ladder_rank: 3, informal_band: [1, 3] }
        divergence: "5 vs 3 - the bands [4,6] and [1,3] are DISJOINT, so no single proposed rank is legal under both variants"
      - name: CASE-D (EXAM_CHEATING, cross 10, two priors)
        formal: { severity_index: 96.60, tier_rank: 7, recommended_ladder_rank: 7, office_band: [6, 8], required_panel_size: 5 }
        informal: { informal_severity_index: 60.60, informal_recommended_ladder_rank: 3, informal_band: [1, 3] }
        divergence: "7 vs 3; the INFORMAL pathway itself is barred because recommended_ladder_rank > INFORMAL_MAX_RANK (ERR_INFORMAL_PATHWAY_NOT_PERMITTED)"
      - name: CASE-A with a panel floor of 4
        formal: { severity_index: 52.00, tier_rank: 3, panel_severity_recommendation: 4, recommended_ladder_rank: 4, office_band: [3, 5] }
        note: "this is the only route to LADDER_KIND 4 = TRANSCRIPT_NOTATION_ONLY"

  - name: adjusted_course_grade_pct
    algorithm_type: weighted_scoring
    applies_to: Sanction
    output_fields:
      - Case.baseline_course_grade_pct
      - Sanction.baseline_course_grade_pct
      - Sanction.adjusted_course_grade_pct
      - Sanction.grade_penalty_delta_pct
    recomputed_on:
      - "POST /integrity/cases (baseline only)"
      - "POST /integrity/sanctions/{id}/impose when sanction.kind in (GRADE_PENALTY_ASSIGNMENT, GRADE_PENALTY_COURSE)"
    constants:
      COMPONENT_PCT_DECIMALS: 2
      WEIGHTED_TOTAL_DECIMALS: 2
      ROUNDING_MODE: ROUND_HALF_UP
    input_set: "the offering's grade_components array joined by code to the report's component_scores array; every component code must appear exactly once on both sides, else ERR_COMPONENT_SCORES_INCOMPLETE"
    formula: |
      ROUNDING ORDER IS PINNED: each component percentage is rounded to 2 decimals FIRST, then the
      rounded percentages are weighted and summed, and the weighted sum is rounded ONCE at the end.
      Weighting the unrounded component percentages and rounding only at the end is off by one cent
      on the canonical fixture and is the mode-(b) trap.

      STEP 1  for each component c:  pct[c] = ROUND(earned_points[c] * 100 / max_points[c], 2)
      STEP 2  weighted_total = SUM over c of ( pct[c] * weight_pct[c] / 100 )   -- NOT rounded here
      STEP 3  course_grade_pct = ROUND(weighted_total, 2)
      STEP 4  baseline_course_grade_pct = course_grade_pct computed from the untouched
              component_scores.
      STEP 5  adjusted_course_grade_pct:
                kind == GRADE_PENALTY_ASSIGNMENT -> re-run STEPS 1..3 with
                  earned_points[sanction.grade_component_code] forced to 0
                kind == GRADE_PENALTY_COURSE     -> 0.00 (the whole course grade is forfeited)
                any other kind                   -> null (no grade effect)
      STEP 6  grade_penalty_delta_pct = ROUND(baseline_course_grade_pct
                - adjusted_course_grade_pct, 2), or null when adjusted is null.
    canonical_fixture:
      grade_components: "[{code: ESSAY, max_points: 200, weight_pct: 40}, {code: MIDTERM, max_points: 70, weight_pct: 30}, {code: PROJECT, max_points: 90, weight_pct: 20}, {code: FINAL, max_points: 180, weight_pct: 10}]"
      component_scores: "[{code: ESSAY, earned_points: 156}, {code: MIDTERM, earned_points: 68}, {code: PROJECT, earned_points: 56}, {code: FINAL, earned_points: 113}]"
      component_pcts: "ESSAY 78.00, MIDTERM 97.14 (from 97.142857...), PROJECT 62.22 (from 62.222222...), FINAL 62.78 (from 62.777777...)"
    worked_examples:
      - name: baseline
        steps: "78.00*0.40 + 97.14*0.30 + 62.22*0.20 + 62.78*0.10 = 31.2000 + 29.1420 + 12.4440 + 6.2780 = 79.0640 -> 79.06"
        result: 79.06
        wrong_result_if_rounded_last: 79.07
      - name: GRADE_PENALTY_ASSIGNMENT on ESSAY
        steps: "ESSAY pct becomes 0.00; 0.0000 + 29.1420 + 12.4440 + 6.2780 = 47.8640 -> 47.86"
        result: { adjusted_course_grade_pct: 47.86, grade_penalty_delta_pct: 31.20 }
        wrong_result_if_rounded_last: { adjusted_course_grade_pct: 47.87, grade_penalty_delta_pct: 31.20 }
      - name: GRADE_PENALTY_COURSE
        result: { adjusted_course_grade_pct: 0.00, grade_penalty_delta_pct: 79.06 }
      - name: GRADE_PENALTY_ASSIGNMENT on MIDTERM
        steps: "MIDTERM pct becomes 0.00; 31.2000 + 0.0000 + 12.4440 + 6.2780 = 49.9220 -> 49.92"
        result: { adjusted_course_grade_pct: 49.92, grade_penalty_delta_pct: 29.14 }

  - name: panel_decision_tally
    algorithm_type: aggregation
    applies_to: HearingSession
    output_fields:
      - HearingSession.effective_vote_count
      - HearingSession.panel_finding
      - HearingSession.panel_severity_recommendation
      - HearingSession.quorum_required
    recomputed_on:
      - "POST /integrity/hearing-sessions (quorum_required only)"
      - "POST /integrity/hearing-sessions/{id}/decide"
    constants:
      QUORUM_NUMERATOR: 2
      QUORUM_DENOMINATOR: 3
      QUORUM_ROUNDING: CEILING
      MAJORITY_RULE: "strict majority of EFFECTIVE votes"
      MEDIAN_EVEN_TIE_BREAK: LOWER_OF_TWO_MIDDLE_VALUES
    input_set: "all PanelVote rows whose session_id equals this session"
    formula: |
      STEP 1  quorum_required = CEILING(len(session.panelist_ids) * QUORUM_NUMERATOR
                / QUORUM_DENOMINATOR).  Panel size 3 -> 2; panel size 5 -> 4.
      STEP 2  cast_votes = COUNT(PanelVote rows for the session).  cast_votes < quorum_required
              -> ERR_QUORUM_NOT_MET.  ABSTAIN votes DO count toward quorum.
      STEP 3  effective_vote_count = COUNT(votes with verdict != ABSTAIN).
              effective_vote_count == 0 -> ERR_NO_EFFECTIVE_VOTES (an all-abstain panel that
              satisfies quorum still cannot decide).
      STEP 4  responsible_votes = COUNT(votes with verdict == RESPONSIBLE).
              panel_finding = RESPONSIBLE when responsible_votes * 2 > effective_vote_count,
              else NOT_RESPONSIBLE.  A dead-even split is NOT_RESPONSIBLE.
      STEP 5  panel_severity_recommendation = null when panel_finding == NOT_RESPONSIBLE.
              Otherwise take severity_recommendation from the votes with verdict == RESPONSIBLE,
              sort ASCENDING, and return the median; for an EVEN count return the LOWER of the two
              middle values (not their mean).
    worked_examples:
      - name: panel of 3, votes RESPONSIBLE/6, RESPONSIBLE/4, NOT_RESPONSIBLE
        steps: "quorum 2; cast 3; effective 3; responsible 2; 2*2 = 4 > 3 -> RESPONSIBLE; recommendations [4, 6] -> even -> lower middle = 4"
        result: { effective_vote_count: 3, panel_finding: RESPONSIBLE, panel_severity_recommendation: 4 }
      - name: panel of 3, votes RESPONSIBLE/7, ABSTAIN, NOT_RESPONSIBLE
        steps: "effective 2; responsible 1; 1*2 = 2 is NOT > 2 -> NOT_RESPONSIBLE"
        result: { effective_vote_count: 2, panel_finding: NOT_RESPONSIBLE, panel_severity_recommendation: null }
      - name: panel of 3, votes ABSTAIN, ABSTAIN, ABSTAIN
        steps: "quorum 2 satisfied by 3 cast votes, but effective_vote_count == 0"
        result: ERR_NO_EFFECTIVE_VOTES
      - name: panel of 5, votes RESPONSIBLE/8, RESPONSIBLE/5, RESPONSIBLE/6, ABSTAIN (only 4 cast)
        steps: "quorum CEILING(5*2/3) = CEILING(3.33) = 4; cast 4 -> quorum met; effective 3; responsible 3; 6 > 3 -> RESPONSIBLE; recommendations sorted [5, 6, 8] -> median 6"
        result: { effective_vote_count: 3, panel_finding: RESPONSIBLE, panel_severity_recommendation: 6 }
      - name: panel of 5, only 3 votes cast
        result: ERR_QUORUM_NOT_MET

  - name: department_reporting_rate
    algorithm_type: aggregation
    applies_to: Department
    output_field: Department.reporting_rate_per_1k_submitted
    recomputed_on:
      - "POST /integrity/reports/{id}/submit"
      - "POST /integrity/hearing-sessions/{id}/decide"
      - "GET /integrity/departments/{id}/reporting-metrics"
    constants:
      REPORTING_WINDOW_DAYS: 365
      RATE_SCALE: 1000
      RATE_DECIMALS: 2
    variants:
      - name: submitted_basis
        used_when: "the persisted Department.reporting_rate_per_1k_submitted field, and GET /integrity/departments/{id}/reporting-metrics with basis omitted or basis == SUBMITTED"
        input_set: |
          IntegrityReport rows whose offering's department_id equals this department, whose
          status != DRAFT, and whose submitted_at falls inside the INCLUSIVE window
          [as_of - REPORTING_WINDOW_DAYS days, as_of]. Reports returned for more information and
          resubmitted are counted ONCE, by their original submitted_at.
        formula: "rate = ROUND(numerator * RATE_SCALE / Department.enrolled_student_count, RATE_DECIMALS)"
      - name: adjudicated_basis
        used_when: "GET /integrity/departments/{id}/reporting-metrics with basis == ADJUDICATED"
        input_set: |
          Case rows whose offering's department_id equals this department, with
          responsibility_finding == RESPONSIBLE, overturned == false, and decided_at inside the
          same INCLUSIVE window. Cases dismissed or still undecided are excluded.
        formula: "rate = ROUND(numerator * RATE_SCALE / Department.enrolled_student_count, RATE_DECIMALS)"
    variant_divergence_examples:
      - name: department ENGL (enrolled_student_count 2000) with 3 submitted reports of which 1 reached an upheld finding
        submitted_basis: 1.50
        adjudicated_basis: 0.50
        delta: 1.00
      - name: department HIST (enrolled_student_count 1000) with 0 submitted reports
        submitted_basis: 0.00
        adjudicated_basis: 0.00
      - name: department PHIL (enrolled_student_count 500) with 2 submitted reports, none decided
        submitted_basis: 4.00
        adjudicated_basis: 0.00
    boundary_notes: "A report whose submitted_at is exactly as_of - 365 days IS inside the window; one at as_of - 366 days is outside. as_of defaults to the current logical clock."

  - name: department_training_completion_pct
    algorithm_type: aggregation
    applies_to: Department
    output_field: Department.training_completion_pct
    recomputed_on:
      - "POST /integrity/faculty-members"
      - "POST /integrity/faculty-members/{id}/training-completions"
      - "POST /_clock/set_current_utc"
      - "GET /integrity/departments/{id}/reporting-metrics"
    constants:
      TRAINING_VALID_DAYS: 730
      PCT_DECIMALS: 2
    input_set: "FacultyMember rows whose department_id equals this department"
    formula: |
      STEP 1  a FacultyMember has training_status == CURRENT when its most recent training
              completion satisfies completed_at + TRAINING_VALID_DAYS days >= current logical
              clock; otherwise LAPSED. A member with no recorded completion is LAPSED.
      STEP 2  training_completion_pct = ROUND(COUNT(members with training_status == CURRENT)
              * 100 / Department.faculty_headcount, PCT_DECIMALS).
      faculty_headcount is the census figure supplied at department creation, NOT the number of
      FacultyMember rows actually created, so the percentage can be below 100.00 even when every
      created member is current.
    worked_examples:
      - name: ENGL with faculty_headcount 5 and 4 current members
        result: 80.00
      - name: HIST with faculty_headcount 4 and 2 current members
        result: 50.00
      - name: PHIL with faculty_headcount 3 and 1 current member
        steps: "1 * 100 / 3 = 33.3333... -> 33.33"
        result: 33.33
      - name: a member whose completed_at is exactly 730 days before the clock
        result: "still CURRENT (the boundary is inclusive); at 731 days it becomes LAPSED"

  - name: department_monitoring_flag
    algorithm_type: threshold
    applies_to: Department
    output_field: Department.monitoring_flag
    recomputed_on:
      - "POST /integrity/departments"
      - "POST /integrity/reports/{id}/submit"
      - "POST /integrity/faculty-members/{id}/training-completions"
      - "GET /integrity/departments/{id}/reporting-metrics"
    constants:
      TRAINING_DEFICIT_THRESHOLD_PCT: 80.00
      ELEVATED_MEDIAN_MULTIPLIER: 2.00
      UNDER_REPORTING_RATE: 0.00
      MEDIAN_EVEN_RULE: "ROUND((lower_middle + upper_middle) / 2, 2)"
    formula: |
      PRECEDENCE IS PINNED. The four branches are evaluated in exactly this order and the FIRST
      match wins; a department can satisfy several branches at once, and evaluating them in any
      other order returns a different flag.

      STEP 1  peer_median_rate = the median of reporting_rate_per_1k_submitted (submitted_basis)
              over ALL Department rows including this one, sorted ASCENDING. For an EVEN count the
              median is ROUND((lower_middle + upper_middle) / 2, 2).
      STEP 2  branch 1: UNDER_REPORTING     when rate == UNDER_REPORTING_RATE (0.00)
              branch 2: ELEVATED            when rate > ROUND(ELEVATED_MEDIAN_MULTIPLIER
                                            * peer_median_rate, 2)      [STRICTLY greater]
              branch 3: TRAINING_DEFICIT    when training_completion_pct
                                            < TRAINING_DEFICIT_THRESHOLD_PCT   [STRICTLY less]
              branch 4: NORMAL
    worked_examples:
      - name: three departments with rates 0.00 (HIST), 1.50 (ENGL), 4.00 (PHIL)
        steps: "peer_median_rate = 1.50; threshold = 2.00 * 1.50 = 3.00"
        results:
          HIST: "UNDER_REPORTING - branch 1 wins even though HIST's training_completion_pct is 50.00, which would also satisfy branch 3"
          ENGL: "NORMAL - 1.50 is not > 3.00, and training_completion_pct 80.00 is not < 80.00 (boundary is exclusive)"
          PHIL: "ELEVATED - 4.00 > 3.00; branch 2 wins even though training_completion_pct 33.33 also satisfies branch 3"
      - name: two departments with rates 0.00 and 1.50
        steps: "even count -> peer_median_rate = ROUND((0.00 + 1.50) / 2, 2) = 0.75; threshold = 1.50"
        results:
          ENGL: "NORMAL - 1.50 > 1.50 is false at the exact boundary, and 80.00 < 80.00 is false"
      - name: ENGL with training_completion_pct 79.99
        result: TRAINING_DEFICIT

  - name: notation_expungement_eligibility
    algorithm_type: forward_looking
    applies_to: Case
    output_field: Case.expungement_eligible_at
    recomputed_on:
      - "POST /integrity/cases/{id}/notation/post"
      - "POST /integrity/sanctions/{id}/complete"
    constants:
      ELIGIBILITY_DAYS: { 4: 365, 5: 365, 6: 730, 7: 1095, 8: null }
      MIN_POST_DECISION_DAYS: 365
    formula: |
      governing_sanction = the Sanction of the case with status in (IMPOSED, COMPLETED); when the
      case has more than one, take the most recently imposed (imposed_at DESC, created_at DESC).

      expungement_eligible_at = null when ANY of the following holds:
        - governing_sanction is null
        - governing_sanction.status != COMPLETED
        - ELIGIBILITY_DAYS[governing_sanction.ladder_rank] is null (rank 8 notations are permanent)
      Otherwise:
        expungement_eligible_at = MAX(
            governing_sanction.completed_at + ELIGIBILITY_DAYS[ladder_rank] days,
            case.decided_at         + MIN_POST_DECISION_DAYS days )
      The MAX is what makes this forward-looking: a sanction completed very quickly is still gated
      by the 365-day floor measured from the finding date, and a slowly completed high-rank sanction
      is gated by the ladder period instead.
    worked_examples:
      - name: rank 5 sanction, decided_at 2026-08-20T00:00:00Z, completed_at 2026-09-01T00:00:00Z
        steps: "completed + 365d = 2027-09-01; decided + 365d = 2027-08-20; MAX = 2027-09-01T00:00:00Z"
        result: "2027-09-01T00:00:00Z"
      - name: rank 4 sanction, decided_at 2026-08-20T00:00:00Z, completed_at 2026-08-21T00:00:00Z
        steps: "completed + 365d = 2027-08-21; decided + 365d = 2027-08-20; MAX = 2027-08-21T00:00:00Z"
        result: "2027-08-21T00:00:00Z"
      - name: rank 7 sanction, decided_at 2026-08-20T00:00:00Z, completed_at 2026-09-01T00:00:00Z
        steps: "completed + 1095d = 2029-08-31; decided + 365d = 2027-08-20; MAX = 2029-08-31T00:00:00Z"
        result: "2029-08-31T00:00:00Z"
      - name: rank 8 sanction, COMPLETED
        result: "null - ERR_NOTATION_NOT_EXPUNGEABLE on any expungement request"
      - name: rank 6 sanction still IMPOSED
        result: "null - ERR_EXPUNGEMENT_TOO_EARLY on any expungement request"

# ============================================================================
# §1.4 VALIDATION ORDER
# Priorities are strictly sequential integers. When a request violates more
# than one rule, the response carries the error_id of the LOWEST priority
# number that matches. Every rule below is evaluated before any side effect is
# applied, and no partial write is ever visible.
# ============================================================================
validation_order_summary:
  - "1-2    auth              -> ERR_UNAUTHENTICATED (401)"
  - "3      role              -> ERR_ROLE_NOT_PERMITTED (403)"
  - "4      ownership         -> ERR_NOT_RESOURCE_OWNER (403)"
  - "5-6    request_shape     -> ERR_INVALID_REQUEST (400)"
  - "7      pagination        -> ERR_INVALID_PAGINATION (400)"
  - "8      path_existence    -> ERR_<ENTITY>_NOT_FOUND (404)"
  - "9      body_fk_existence -> ERR_<ENTITY>_NOT_FOUND (404)"
  - "10     uniqueness        -> ERR_DUPLICATE_RESOURCE (409)"
  - "11-22  state             -> ERR_<ENTITY>_STATE_INVALID and friends (409)"
  - "23     occ               -> ERR_STALE_CASE_VERSION (412)"
  - "24-31  business_safety   -> due-process and competence guards (409)"
  - "32-37  business_referential -> cross-entity membership guards (404/409)"
  - "38-45  business_temporal -> notice, overlap and waiting-period guards (409)"
  - "46-61  business_constraint -> capacity, band and count guards (409)"

validations:
  - priority: 1
    category: auth
    applies_to: "every endpoint including POST /_clock/set_current_utc"
    condition: "X-User-Role header is absent, or is present with an empty string value; or X-User-ID is absent or empty for any role other than IntegrityOfficer, AppealsDean and RegistrarOfficer acting on read-only endpoints"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    notes: "A header sent as an empty string \"\" counts as present-but-blank and still fails here; a header consisting only of spaces is also blank."
  - priority: 2
    category: auth
    applies_to: "every endpoint"
    condition: "X-User-Role is not one of IntegrityOfficer, FacultyReporter, PanelChair, Student, AppealsDean, RegistrarOfficer; or the role is entity-backed (FacultyReporter, PanelChair -> FacultyMember; Student -> Student) and X-User-ID does not resolve to an existing row of that backing entity"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
  - priority: 3
    category: role
    applies_to: "every endpoint"
    condition: "the resolved role is not listed in the endpoint's roles set in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
  - priority: 4
    category: ownership
    applies_to: "POST /integrity/reports/{id}/submit, POST /integrity/evidence-items, POST /integrity/cases/{id}/informal-resolution, POST /integrity/cases/{id}/informal-response, POST /integrity/cases/{id}/notation/expungement-request, POST /integrity/appeals, POST /integrity/notifications/{id}/acknowledge, POST /integrity/case-meetings/{id}/outcome, POST /integrity/hearing-sessions/{id}/convene, POST /integrity/hearing-sessions/{id}/decide, POST /integrity/hearing-sessions/{id}/adjourn, POST /integrity/panel-votes, POST /integrity/advisor-engagements"
    condition: "the acting X-User-ID is not the owner the endpoint requires (report.reporter_id for reporter actions, case.student_id for student actions, session.chair_id for chair actions, and session.chair_id for vote casting because the chair records each panelist's vote on the record)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
  - priority: 5
    category: request_shape
    applies_to: "every write endpoint"
    condition: "a required body field is missing or null; a field has the wrong JSON type; an enum value is outside its declared set; a string violates its length or regex constraint; an integer is outside its declared range; a decimal carries more than 2 fractional digits; an unknown field is present"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
  - priority: 6
    category: request_shape
    applies_to: "POST /integrity/evidence-items, POST /integrity/sanctions, POST /integrity/panel-votes, POST /integrity/appeals/{id}/decide, POST /integrity/advisor-engagements/{id}/review, POST /integrity/cases/{id}/notation/expungement-decision"
    condition: "a conditionally required field is absent when required, or present when forbidden: similarity_pct must be present exactly when kind == SIMILARITY_REPORT; decision_reason is required for every DENY decision; reduced_ladder_rank is required exactly when outcome == SANCTION_REDUCED; adjourn_reason is required on adjourn"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
  - priority: 7
    category: pagination
    applies_to: "every list endpoint"
    condition: "limit is not an integer, limit < 1 or limit > 100, offset is not an integer, or offset < 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
  - priority: 8
    category: path_existence
    applies_to: "every endpoint with an {id} path parameter"
    condition: "the path id is a syntactically valid identifier that matches no stored row"
    error_id: "ERR_DEPARTMENT_NOT_FOUND, ERR_FACULTY_MEMBER_NOT_FOUND, ERR_STUDENT_NOT_FOUND, ERR_OFFERING_NOT_FOUND, ERR_REPORT_NOT_FOUND, ERR_EVIDENCE_ITEM_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_NOTIFICATION_NOT_FOUND, ERR_ADVISOR_ENGAGEMENT_NOT_FOUND, ERR_MEETING_NOT_FOUND, ERR_ROOM_NOT_FOUND, ERR_SESSION_NOT_FOUND, ERR_PANEL_VOTE_NOT_FOUND, ERR_SANCTION_NOT_FOUND, ERR_APPEAL_NOT_FOUND"
    http_status: 404
  - priority: 9
    category: body_fk_existence
    applies_to: "every write endpoint that carries a foreign key in its body"
    condition: "a body foreign key names no stored row; checked in the field order declared by the endpoint's input list"
    error_id: "the matching ERR_<ENTITY>_NOT_FOUND from priority 8"
    http_status: 404
  - priority: 10
    category: uniqueness
    applies_to: "POST /integrity/departments, POST /integrity/faculty-members, POST /integrity/students, POST /integrity/course-offerings, POST /integrity/hearing-rooms"
    condition: "Department.code, HearingRoom.code, FacultyMember.email, Student.email, or the pair (CourseOffering.course_code, CourseOffering.term_code) already exists"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
  - priority: 11
    category: state
    applies_to: "POST /integrity/reports/{id}/submit, POST /integrity/reports/{id}/triage, POST /integrity/evidence-items, POST /integrity/cases, POST /integrity/cases/legacy-import"
    condition: "report.status does not admit the operation: submit requires DRAFT or RETURNED_FOR_INFO; triage requires SUBMITTED; evidence attachment requires DRAFT or RETURNED_FOR_INFO; case creation requires ACCEPTED; legacy import requires DRAFT, because a historical record is backfilled directly and is never submitted or triaged"
    error_id: ERR_REPORT_STATE_INVALID
    http_status: 409
  - priority: 12
    category: state
    applies_to: "POST /integrity/cases"
    condition: "a Case already exists for the supplied report_id"
    error_id: ERR_CASE_ALREADY_OPENED
    http_status: 409
  - priority: 13
    category: state
    applies_to: "POST /integrity/cases/{id}/pathway, POST /integrity/cases/{id}/notifications, POST /integrity/cases/{id}/dismiss, POST /integrity/cases/{id}/informal-resolution, POST /integrity/cases/{id}/informal-response, POST /integrity/case-meetings, POST /integrity/hearing-sessions, POST /integrity/sanctions, POST /integrity/sanctions/{id}/impose, POST /integrity/sanctions/{id}/complete, POST /integrity/appeals, POST /integrity/appeals/{id}/screen"
    condition: "case.adjudication_status is not one from which the operation is permitted by §1.2 (for example scheduling a hearing while the case is still INTAKE_REVIEW, or proposing a formal sanction while the case is NOTIFIED). For POST /integrity/case-meetings the permitted statuses are exactly NOTIFIED, INFORMAL_PROPOSED and FORMAL_REFERRED - an instructor meeting cannot be booked before the student has been notified nor after the case has been decided. For POST /integrity/cases/{id}/pathway the permitted statuses are exactly INTAKE_REVIEW and NOTIFIED, so a pathway can never be chosen for a DISMISSED or CLOSED case (this check at priority 13 outranks the already-set check at priority 14)"
    error_id: ERR_CASE_STATE_INVALID
    http_status: 409
    conflict_note: "DESIGNED CONFLICT 1 - this rule outranks priority 38 ERR_NOTICE_PERIOD_TOO_SHORT on POST /integrity/hearing-sessions."
  - priority: 14
    category: state
    applies_to: "POST /integrity/cases/{id}/pathway"
    condition: "case.pathway is already INFORMAL or FORMAL"
    error_id: ERR_CASE_PATHWAY_ALREADY_SET
    http_status: 409
  - priority: 15
    category: state
    applies_to: "POST /integrity/cases/{id}/informal-resolution, POST /integrity/hearing-sessions, POST /integrity/appeals/{id}/decide with outcome REMANDED"
    condition: "case.pathway is UNASSIGNED, or it is set to the other pathway than the one the operation belongs to"
    error_id: ERR_CASE_PATHWAY_NOT_SET
    http_status: 409
  - priority: 16
    category: state
    applies_to: "POST /integrity/cases/{id}/notation/post, POST /integrity/cases/{id}/notation/expungement-request, POST /integrity/cases/{id}/notation/expungement-decision"
    condition: "case.notation_status does not admit the operation per the notation dimension of §1.2"
    error_id: ERR_NOTATION_STATE_INVALID
    http_status: 409
  - priority: 17
    category: state
    applies_to: "POST /integrity/hearing-sessions/{id}/convene, .../adjourn, .../decide, .../cancel, POST /integrity/panel-votes"
    condition: "session.status does not admit the operation: convene and cancel require SCHEDULED; adjourn, decide and vote casting require CONVENED"
    error_id: ERR_SESSION_STATE_INVALID
    http_status: 409
  - priority: 18
    category: state
    applies_to: "POST /integrity/case-meetings/{id}/outcome"
    condition: "meeting.status != SCHEDULED"
    error_id: ERR_MEETING_STATE_INVALID
    http_status: 409
  - priority: 19
    category: state
    applies_to: "POST /integrity/sanctions/{id}/impose, POST /integrity/sanctions/{id}/complete"
    condition: "sanction.status does not admit the operation: impose requires PROPOSED or ACCEPTED; complete requires IMPOSED"
    error_id: ERR_SANCTION_STATE_INVALID
    http_status: 409
  - priority: 20
    category: state
    applies_to: "POST /integrity/appeals/{id}/screen, POST /integrity/appeals/{id}/decide"
    condition: "appeal.status does not admit the operation: screen requires SUBMITTED; decide requires UNDER_REVIEW"
    error_id: ERR_APPEAL_STATE_INVALID
    http_status: 409
  - priority: 21
    category: state
    applies_to: "POST /integrity/advisor-engagements/{id}/review"
    condition: "engagement.status != REQUESTED"
    error_id: ERR_ADVISOR_ENGAGEMENT_STATE_INVALID
    http_status: 409
  - priority: 22
    category: state
    applies_to: "POST /integrity/notifications/{id}/acknowledge"
    condition: "notification.acknowledged_at is already set"
    error_id: ERR_NOTIFICATION_ALREADY_ACKNOWLEDGED
    http_status: 409
  - priority: 23
    category: occ
    applies_to: "POST /integrity/sanctions, POST /integrity/cases/{id}/informal-resolution"
    condition: "expected_case_version does not equal the target Case.version"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    notes: "Runs AFTER every state check, so a request that is both stale and state-invalid returns the state error."
  - priority: 24
    category: business_safety
    applies_to: "POST /integrity/reports/{id}/submit"
    condition: "the reporter's FacultyMember.training_status == LAPSED at the moment of submission"
    error_id: ERR_REPORTER_TRAINING_LAPSED
    http_status: 409
    notes: "Cross-entity guard: the report is perfectly valid, but the acting FacultyMember is not."
  - priority: 25
    category: business_safety
    applies_to: "POST /integrity/hearing-sessions"
    condition: "the FacultyMember named by chair_id has training_status == LAPSED"
    error_id: ERR_CHAIR_TRAINING_LAPSED
    http_status: 409
  - priority: 26
    category: business_safety
    applies_to: "POST /integrity/hearing-sessions, POST /integrity/panel-votes"
    condition: "chair_id or any element of panelist_ids equals the reporter_id of the case's originating IntegrityReport, or equals the instructor_id of the case's CourseOffering; or a vote is cast by a panelist who is the reporter"
    error_id: ERR_PANEL_CONFLICT_OF_INTEREST
    http_status: 409
    notes: "Segregation of duties: the faculty member who reported the case may never sit on, chair, or vote in its hearing."
  - priority: 27
    category: business_safety
    applies_to: "POST /integrity/advisor-engagements"
    condition: "advisor_kind == ATTORNEY while the case's recommended_ladder_rank < ATTORNEY_ADVISOR_MIN_RANK (6)"
    error_id: ERR_ATTORNEY_ADVISOR_NOT_PERMITTED
    http_status: 409
    conflict_note: "DESIGNED CONFLICT 2 - this rule outranks priority 47 ERR_ADVISOR_LIMIT_REACHED on POST /integrity/advisor-engagements."
  - priority: 28
    category: business_safety
    applies_to: "POST /integrity/advisor-engagements"
    condition: "advisor_kind == ATTORNEY and advisor_bar_licensed == false"
    error_id: ERR_ATTORNEY_NOT_LICENSED
    http_status: 409
  - priority: 29
    category: business_safety
    applies_to: "POST /integrity/cases/{id}/pathway with pathway == INFORMAL, POST /integrity/cases/{id}/informal-resolution"
    condition: "the case's recommended_ladder_rank > INFORMAL_MAX_RANK (3), i.e. the formal severity assessment places the case above the instructor-resolvable band"
    error_id: ERR_INFORMAL_PATHWAY_NOT_PERMITTED
    http_status: 409
  - priority: 30
    category: business_safety
    applies_to: "POST /integrity/appeals/{id}/screen"
    condition: "case.pathway == INFORMAL and case.adjudication_status == INFORMAL_ACCEPTED and appeal.grounds != PROCEDURE"
    error_id: ERR_INFORMAL_RESOLUTION_NOT_APPEALABLE
    http_status: 409
    notes: "A student who accepted an informal resolution waived the EVIDENCE and SANCTION_SEVERITY grounds but never the PROCEDURE ground."
  - priority: 31
    category: business_safety
    applies_to: "POST /integrity/reports/{id}/submit, POST /integrity/reports/{id}/triage with decision == ACCEPT"
    condition: "on submit: the report has no EvidenceItem, or alleged_violation_type == PLAGIARISM and no EvidenceItem of kind SIMILARITY_REPORT exists, or the report is RETURNED_FOR_INFO and no EvidenceItem was added after returned_at. On ACCEPT triage: report.evidence_strength_score < 20.00"
    error_id: ERR_EVIDENCE_INCOMPLETE
    http_status: 409
  - priority: 32
    category: business_referential
    applies_to: "POST /integrity/sanctions, POST /integrity/cases/{id}/informal-resolution"
    condition: "grade_component_code is present but names no code in the case's CourseOffering.grade_components array"
    error_id: ERR_GRADE_COMPONENT_NOT_FOUND
    http_status: 404
    conflict_note: "DESIGNED CONFLICT 3 - this rule outranks priority 44 ERR_SANCTION_EFFECTIVE_BEFORE_DECISION on POST /integrity/sanctions."
  - priority: 33
    category: business_referential
    applies_to: "POST /integrity/sanctions, POST /integrity/cases/{id}/informal-resolution"
    condition: "the resolved sanction kind is GRADE_PENALTY_ASSIGNMENT and grade_component_code is absent, or the resolved kind is anything else and grade_component_code is present"
    error_id: ERR_GRADE_COMPONENT_REQUIRED
    http_status: 409
  - priority: 34
    category: business_referential
    applies_to: "POST /integrity/reports, POST /integrity/sanctions/{id}/impose"
    condition: "the report's component_scores array does not contain exactly one entry for every code in the offering's grade_components array, or contains a code that is not in grade_components"
    error_id: ERR_COMPONENT_SCORES_INCOMPLETE
    http_status: 409
  - priority: 35
    category: business_referential
    applies_to: "POST /integrity/panel-votes"
    condition: "panelist_id is not an element of the session's panelist_ids array"
    error_id: ERR_NOT_A_PANELIST
    http_status: 409
  - priority: 36
    category: business_referential
    applies_to: "POST /integrity/panel-votes"
    condition: "verdict == RESPONSIBLE and severity_recommendation is absent"
    error_id: ERR_SEVERITY_RECOMMENDATION_REQUIRED
    http_status: 409
  - priority: 37
    category: business_referential
    applies_to: "POST /integrity/panel-votes"
    condition: "verdict in (NOT_RESPONSIBLE, ABSTAIN) and severity_recommendation is present"
    error_id: ERR_SEVERITY_RECOMMENDATION_NOT_ALLOWED
    http_status: 409
  - priority: 38
    category: business_temporal
    applies_to: "POST /integrity/hearing-sessions"
    condition: "start_at < the governing notice sent_at + MIN_HEARING_NOTICE_DAYS (10) days, where the governing notice is the case's most recent Notification with kind in (ALLEGATION_NOTICE, REHEARING_NOTICE)"
    error_id: ERR_NOTICE_PERIOD_TOO_SHORT
    http_status: 409
    conflict_note: "loses DESIGNED CONFLICT 1 to priority 13."
  - priority: 39
    category: business_temporal
    applies_to: "POST /integrity/hearing-sessions"
    condition: "the CLOSED buffered interval [start_at - room.buffer_minutes, end_at + room.buffer_minutes] intersects the same buffered interval of any HearingSession in the same room whose status is SCHEDULED or CONVENED; touching endpoints DO conflict"
    error_id: ERR_ROOM_BUFFER_CONFLICT
    http_status: 409
  - priority: 40
    category: business_temporal
    applies_to: "POST /integrity/case-meetings"
    condition: "the HALF-OPEN interval [start_at, end_at) intersects the half-open interval of any CaseMeeting for the same instructor_id whose status is SCHEDULED, HELD or NO_SHOW; back-to-back meetings that share an endpoint do NOT conflict"
    error_id: ERR_INSTRUCTOR_CALENDAR_CONFLICT
    http_status: 409
  - priority: 41
    category: business_temporal
    applies_to: "POST /integrity/case-meetings, POST /integrity/case-meetings/{id}/outcome, POST /integrity/hearing-sessions"
    condition: "start_at >= end_at; or the interval is not a whole number of minutes; or duration is outside 15..240 minutes; or an outcome of HELD is recorded before start_at, or an outcome of NO_SHOW before end_at"
    error_id: ERR_MEETING_WINDOW_INVALID
    http_status: 409
  - priority: 42
    category: business_temporal
    applies_to: "POST /integrity/hearing-sessions/{id}/convene"
    condition: "the case's ALLEGATION_NOTICE has acknowledged_at == null AND the current logical clock is still <= its response_deadline_at"
    error_id: ERR_RESPONSE_WINDOW_OPEN
    http_status: 409
  - priority: 43
    category: business_temporal
    applies_to: "POST /integrity/appeals"
    condition: "the current logical clock > case.decided_at + APPEAL_WINDOW_DAYS (10) days"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    notes: "Filing exactly at decided_at + 10 days is inside the window; one second later is outside."
  - priority: 44
    category: business_temporal
    applies_to: "POST /integrity/sanctions, POST /integrity/sanctions/{id}/impose"
    condition: "sanction.effective_from < case.decided_at"
    error_id: ERR_SANCTION_EFFECTIVE_BEFORE_DECISION
    http_status: 409
    conflict_note: "loses DESIGNED CONFLICT 3 to priority 32."
  - priority: 45
    category: business_temporal
    applies_to: "POST /integrity/cases/{id}/notation/expungement-request"
    condition: "case.expungement_eligible_at is null because the governing sanction is not COMPLETED, or the current logical clock < case.expungement_eligible_at"
    error_id: ERR_EXPUNGEMENT_TOO_EARLY
    http_status: 409
  - priority: 46
    category: business_constraint
    applies_to: "POST /integrity/cases/{id}/notifications"
    condition: "response_window_days < 5 or > 30"
    error_id: ERR_RESPONSE_WINDOW_OUT_OF_RANGE
    http_status: 409
  - priority: 47
    category: business_constraint
    applies_to: "POST /integrity/advisor-engagements"
    condition: "the case already has ADVISOR_LIMIT_PER_CASE (2) AdvisorEngagement rows whose status is REQUESTED or APPROVED"
    error_id: ERR_ADVISOR_LIMIT_REACHED
    http_status: 409
    conflict_note: "loses DESIGNED CONFLICT 2 to priority 27."
  - priority: 48
    category: business_constraint
    applies_to: "POST /integrity/hearing-sessions/{id}/convene"
    condition: "at least one AdvisorEngagement for the case still has status REQUESTED"
    error_id: ERR_ADVISOR_REQUEST_PENDING
    http_status: 409
  - priority: 49
    category: business_constraint
    applies_to: "POST /integrity/hearing-sessions"
    condition: "len(panelist_ids) != the required_panel_size derived from the case's recommended_ladder_rank (5 when the rank is >= 6, otherwise 3), or panelist_ids contains duplicates, or chair_id appears in panelist_ids"
    error_id: ERR_PANEL_SIZE_INVALID
    http_status: 409
  - priority: 50
    category: business_constraint
    applies_to: "POST /integrity/hearing-sessions"
    condition: "the room already has sessions_per_day_cap HearingSession rows with status SCHEDULED or CONVENED whose start_at falls on the same UTC calendar date as the requested start_at"
    error_id: ERR_ROOM_DAILY_CAPACITY_EXCEEDED
    http_status: 409
  - priority: 51
    category: business_constraint
    applies_to: "POST /integrity/panel-votes"
    condition: "a PanelVote already exists for the same (session_id, panelist_id) pair"
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
  - priority: 52
    category: business_constraint
    applies_to: "POST /integrity/hearing-sessions/{id}/decide"
    condition: "the number of PanelVote rows for the session is less than session.quorum_required"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 409
  - priority: 53
    category: business_constraint
    applies_to: "POST /integrity/hearing-sessions/{id}/decide"
    condition: "every PanelVote for the session has verdict == ABSTAIN, so effective_vote_count would be 0"
    error_id: ERR_NO_EFFECTIVE_VOTES
    http_status: 409
    notes: "Evaluated strictly AFTER the quorum check, so an all-abstain panel that is also short of quorum returns ERR_QUORUM_NOT_MET."
  - priority: 54
    category: business_constraint
    applies_to: "POST /integrity/sanctions, POST /integrity/cases/{id}/informal-resolution"
    condition: "the proposed ladder_rank exceeds the upper bound of the applicable band (office band recommended_ladder_rank + 1 clamped to 8; informal band informal_recommended_ladder_rank)"
    error_id: ERR_SANCTION_ABOVE_LADDER_BAND
    http_status: 409
  - priority: 55
    category: business_constraint
    applies_to: "POST /integrity/sanctions"
    condition: "the proposed ladder_rank is below the lower bound of the office band (recommended_ladder_rank - 1 clamped to 1); the informal band has no lower bound"
    error_id: ERR_SANCTION_BELOW_LADDER_BAND
    http_status: 409
  - priority: 56
    category: business_constraint
    applies_to: "POST /integrity/sanctions, POST /integrity/cases/{id}/informal-resolution"
    condition: "the supplied kind does not equal LADDER_KIND[ladder_rank]"
    error_id: ERR_SANCTION_KIND_RANK_MISMATCH
    http_status: 409
  - priority: 57
    category: business_constraint
    applies_to: "POST /integrity/appeals"
    condition: "an Appeal for the case already has status SUBMITTED or UNDER_REVIEW, or the case already has APPEAL_MAX_PER_CASE (2) Appeal rows"
    error_id: ERR_APPEAL_ALREADY_FILED
    http_status: 409
  - priority: 58
    category: business_constraint
    applies_to: "POST /integrity/appeals/{id}/decide"
    condition: "outcome == SANCTION_REDUCED while grounds != SANCTION_SEVERITY, or outcome in (REMANDED, OVERTURNED) while grounds == SANCTION_SEVERITY"
    error_id: ERR_APPEAL_GROUNDS_MISMATCH
    http_status: 409
  - priority: 59
    category: business_constraint
    applies_to: "POST /integrity/appeals/{id}/decide"
    condition: "outcome == SANCTION_REDUCED and reduced_ladder_rank is not in [1, governing_sanction.ladder_rank - 1]"
    error_id: ERR_REDUCED_RANK_INVALID
    http_status: 409
  - priority: 60
    category: business_constraint
    applies_to: "POST /integrity/appeals/{id}/decide"
    condition: "outcome == REMANDED and case.hearing_round > 1"
    error_id: ERR_REMAND_LIMIT_REACHED
    http_status: 409
  - priority: 61
    category: business_constraint
    applies_to: "POST /integrity/cases/{id}/notation/expungement-request"
    condition: "ELIGIBILITY_DAYS[governing_sanction.ladder_rank] is null, i.e. the notation arises from an EXPULSION_RECOMMENDATION at rank 8"
    error_id: ERR_NOTATION_NOT_EXPUNGEABLE
    http_status: 409
    notes: "Evaluated AFTER priority 45, so a rank-8 notation whose governing sanction is not yet COMPLETED returns ERR_EXPUNGEMENT_TOO_EARLY."

designed_priority_conflicts:
  - name: state-outranks-temporal-on-hearing-scheduling
    endpoint: "POST /integrity/hearing-sessions"
    lower_priority_rule: { priority: 13, category: state, error_id: ERR_CASE_STATE_INVALID }
    higher_priority_number_rule: { priority: 38, category: business_temporal, error_id: ERR_NOTICE_PERIOD_TOO_SHORT }
    setup: "the case is already HEARING_SCHEDULED (a first session exists) AND the second session's start_at is only 2 days after the governing ALLEGATION_NOTICE sent_at"
    expected_error_id: ERR_CASE_STATE_INVALID
  - name: safety-outranks-constraint-on-advisor-request
    endpoint: "POST /integrity/advisor-engagements"
    lower_priority_rule: { priority: 27, category: business_safety, error_id: ERR_ATTORNEY_ADVISOR_NOT_PERMITTED }
    higher_priority_number_rule: { priority: 47, category: business_constraint, error_id: ERR_ADVISOR_LIMIT_REACHED }
    setup: "a case with recommended_ladder_rank 3 that already holds 2 APPROVED AdvisorEngagement rows receives a third request with advisor_kind == ATTORNEY"
    expected_error_id: ERR_ATTORNEY_ADVISOR_NOT_PERMITTED
  - name: referential-outranks-temporal-on-sanction-create
    endpoint: "POST /integrity/sanctions"
    lower_priority_rule: { priority: 32, category: business_referential, error_id: ERR_GRADE_COMPONENT_NOT_FOUND }
    higher_priority_number_rule: { priority: 44, category: business_temporal, error_id: ERR_SANCTION_EFFECTIVE_BEFORE_DECISION }
    setup: "a DECIDED case receives a GRADE_PENALTY_ASSIGNMENT proposal whose grade_component_code is LAB (absent from the offering) AND whose effective_from is one day before case.decided_at"
    expected_error_id: ERR_GRADE_COMPONENT_NOT_FOUND

# ============================================================================
# §1.5 ENDPOINT TABLE
# All business paths sit under the api_prefix /integrity. Every single-resource
# and sub-resource path parameter is literally {id}. Every list endpoint accepts
# limit? and offset? and returns the paginated envelope of §1.0.
# ============================================================================
endpoints:
  - method: POST
    path: /_clock/set_current_utc
    purpose: "Set the logical clock that every temporal rule reads. MANDATORY test-harness endpoint."
    roles: [IntegrityOfficer, FacultyReporter, PanelChair, Student, AppealsDean, RegistrarOfficer]
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "the logical clock is set; FacultyMember.training_status, Department.training_completion_pct and Department.monitoring_flag are re-derived on next read"
    errors: [ERR_UNAUTHENTICATED, ERR_INVALID_REQUEST]
    notes: "Default logical clock before any call: 2026-08-01T00:00:00Z."

  - method: POST
    path: /integrity/departments
    purpose: "Register an academic department."
    roles: [IntegrityOfficer]
    input: [code, name, enrolled_student_count, faculty_headcount]
    output: Department
    side_effects:
      - "monitoring_flag is computed from the new peer median (a first department with rate 0.00 is UNDER_REPORTING)"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_DUPLICATE_RESOURCE]
  - method: GET
    path: /integrity/departments
    purpose: "List departments."
    roles: [IntegrityOfficer, RegistrarOfficer]
    input: ["code?", "monitoring_flag?", "limit?", "offset?"]
    output: Department[]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_PAGINATION]
  - method: GET
    path: /integrity/departments/{id}
    purpose: "Read one department with its derived monitoring fields."
    roles: [IntegrityOfficer, RegistrarOfficer, FacultyReporter, AppealsDean]
    input: []
    output: Department
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_DEPARTMENT_NOT_FOUND]
  - method: GET
    path: /integrity/departments/{id}/reporting-metrics
    purpose: "Computed read of the department's reporting rate under either basis, its training completion percentage, the peer median and the resulting monitoring flag."
    roles: [IntegrityOfficer, RegistrarOfficer]
    input: ["basis?", "as_of?"]
    output: "{ department_id: string, basis: string, as_of: string, window_days: integer, numerator: integer, enrolled_student_count: integer, reporting_rate_per_1k: number, peer_median_rate: number, elevated_threshold_rate: number, training_completion_pct: number, faculty_current_count: integer, faculty_headcount: integer, monitoring_flag: string }"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_DEPARTMENT_NOT_FOUND, ERR_INVALID_REQUEST]
    notes: "basis defaults to SUBMITTED; as_of defaults to the current logical clock, and an as_of in the future relative to the clock is permitted. A read with basis omitted or SUBMITTED recomputes and PERSISTS Department.reporting_rate_per_1k_submitted, training_completion_pct and monitoring_flag; a read with basis == ADJUDICATED persists NOTHING, so it can never disturb the peer median. training_completion_pct is always measured from the current logical clock and is unaffected by as_of, which shifts only the reporting window."

  - method: POST
    path: /integrity/faculty-members
    purpose: "Register a faculty member."
    roles: [IntegrityOfficer]
    input: [department_id, full_name, email]
    output: FacultyMember
    side_effects:
      - "training_status starts LAPSED; the department's training_completion_pct and monitoring_flag are recomputed"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_DEPARTMENT_NOT_FOUND, ERR_DUPLICATE_RESOURCE]
  - method: GET
    path: /integrity/faculty-members
    purpose: "List faculty members, filterable by department and training status."
    roles: [IntegrityOfficer, RegistrarOfficer]
    input: ["department_id?", "training_status?", "email?", "limit?", "offset?"]
    output: FacultyMember[]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_PAGINATION, ERR_DEPARTMENT_NOT_FOUND]
  - method: GET
    path: /integrity/faculty-members/{id}
    purpose: "Read one faculty member with derived training fields."
    roles: [IntegrityOfficer, FacultyReporter, PanelChair, RegistrarOfficer]
    input: []
    output: FacultyMember
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_FACULTY_MEMBER_NOT_FOUND]
  - method: POST
    path: /integrity/faculty-members/{id}/training-completions
    purpose: "Record completion of an academic-integrity training module for a faculty member."
    roles: [IntegrityOfficer, FacultyReporter]
    input: [module_code, completed_at]
    output: FacultyMember
    side_effects:
      - "training_completed_at, training_module_code and training_status are re-derived from the newest completion"
      - "the member's department has training_completion_pct and monitoring_flag recomputed"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_FACULTY_MEMBER_NOT_FOUND]
    notes: "completed_at may be in the past but never after the current logical clock."

  - method: POST
    path: /integrity/students
    purpose: "Register a student."
    roles: [IntegrityOfficer]
    input: [full_name, email, program_code, class_year]
    output: Student
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_DUPLICATE_RESOURCE]
  - method: GET
    path: /integrity/students
    purpose: "List students."
    roles: [IntegrityOfficer, RegistrarOfficer]
    input: ["email?", "standing?", "transcript_notation?", "limit?", "offset?"]
    output: Student[]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_PAGINATION]
  - method: GET
    path: /integrity/students/{id}
    purpose: "Read one student with the derived repeat-offense counters."
    roles: [IntegrityOfficer, RegistrarOfficer, AppealsDean, Student]
    input: []
    output: Student
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_STUDENT_NOT_FOUND]

  - method: POST
    path: /integrity/course-offerings
    purpose: "Register a course offering with its weighted gradebook structure."
    roles: [IntegrityOfficer]
    input: [department_id, instructor_id, course_code, term_code, grade_components]
    output: CourseOffering
    side_effects:
      - "grade_components weight_pct values must sum to exactly 100"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_DEPARTMENT_NOT_FOUND, ERR_FACULTY_MEMBER_NOT_FOUND, ERR_DUPLICATE_RESOURCE]
  - method: GET
    path: /integrity/course-offerings
    purpose: "List course offerings, filterable by department, instructor and term."
    roles: [IntegrityOfficer, FacultyReporter, RegistrarOfficer]
    input: ["department_id?", "instructor_id?", "term_code?", "course_code?", "limit?", "offset?"]
    output: CourseOffering[]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_PAGINATION, ERR_DEPARTMENT_NOT_FOUND, ERR_FACULTY_MEMBER_NOT_FOUND]
  - method: GET
    path: /integrity/course-offerings/{id}
    purpose: "Read one course offering."
    roles: [IntegrityOfficer, FacultyReporter, PanelChair, RegistrarOfficer]
    input: []
    output: CourseOffering
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_OFFERING_NOT_FOUND]

  - method: POST
    path: /integrity/reports
    purpose: "Create a DRAFT integrity report; reporter_id is taken from X-User-ID."
    roles: [FacultyReporter]
    input: [offering_id, student_id, alleged_violation_type, narrative, incident_at, component_scores]
    output: IntegrityReport
    side_effects:
      - "status DRAFT, evidence_strength_score 0.00, evidence_complete false"
      - "component_scores are validated against the offering's grade_components"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_OFFERING_NOT_FOUND, ERR_STUDENT_NOT_FOUND, ERR_COMPONENT_SCORES_INCOMPLETE]
  - method: GET
    path: /integrity/reports
    purpose: "List integrity reports, filterable by offering, student, reporter and status."
    roles: [IntegrityOfficer, FacultyReporter]
    input: ["offering_id?", "student_id?", "reporter_id?", "status?", "limit?", "offset?"]
    output: IntegrityReport[]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_PAGINATION, ERR_OFFERING_NOT_FOUND, ERR_STUDENT_NOT_FOUND, ERR_FACULTY_MEMBER_NOT_FOUND]
  - method: GET
    path: /integrity/reports/{id}
    purpose: "Read one report with its current evidence strength score."
    roles: [IntegrityOfficer, FacultyReporter, AppealsDean]
    input: []
    output: IntegrityReport
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_REPORT_NOT_FOUND]
  - method: POST
    path: /integrity/reports/{id}/submit
    purpose: "Submit a DRAFT or RETURNED_FOR_INFO report to the integrity office."
    roles: [FacultyReporter]
    input: []
    output: IntegrityReport
    side_effects:
      - "see state_machines.IntegrityReport.DRAFT_to_SUBMITTED and RETURNED_FOR_INFO_to_SUBMITTED"
      - "the reporter's department reporting rate and monitoring flag are recomputed"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_NOT_RESOURCE_OWNER, ERR_REPORT_NOT_FOUND, ERR_REPORT_STATE_INVALID, ERR_REPORTER_TRAINING_LAPSED, ERR_EVIDENCE_INCOMPLETE]
  - method: POST
    path: /integrity/reports/{id}/triage
    purpose: "Office triage of a submitted report: ACCEPT, RETURN_FOR_INFO or REJECT_INSUFFICIENT."
    roles: [IntegrityOfficer]
    input: [decision, triage_note]
    output: IntegrityReport
    side_effects:
      - "see state_machines.IntegrityReport for the three branches"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_REPORT_NOT_FOUND, ERR_REPORT_STATE_INVALID, ERR_EVIDENCE_INCOMPLETE]

  - method: POST
    path: /integrity/evidence-items
    purpose: "Attach an immutable evidence item to a DRAFT or RETURNED_FOR_INFO report."
    roles: [FacultyReporter]
    input: [report_id, kind, sha256, page_count, "similarity_pct?"]
    output: EvidenceItem
    side_effects:
      - "the report's evidence_strength_score and evidence_complete are recomputed immediately"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_NOT_RESOURCE_OWNER, ERR_INVALID_REQUEST, ERR_REPORT_NOT_FOUND, ERR_REPORT_STATE_INVALID]
  - method: GET
    path: /integrity/evidence-items
    purpose: "List evidence items, filterable by report and kind."
    roles: [IntegrityOfficer, FacultyReporter, AppealsDean]
    input: ["report_id?", "kind?", "limit?", "offset?"]
    output: EvidenceItem[]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_PAGINATION, ERR_REPORT_NOT_FOUND]
  - method: GET
    path: /integrity/evidence-items/{id}
    purpose: "Read one evidence item. Immutable entity: no update endpoint and no version field."
    roles: [IntegrityOfficer, FacultyReporter, AppealsDean]
    input: []
    output: EvidenceItem
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_EVIDENCE_ITEM_NOT_FOUND]
  - method: GET
    path: /integrity/reports/{id}/evidence-items
    purpose: "Sub-resource listing of a report's evidence."
    roles: [IntegrityOfficer, FacultyReporter, AppealsDean, Student]
    input: ["limit?", "offset?"]
    output: EvidenceItem[]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_PAGINATION, ERR_REPORT_NOT_FOUND]

  - method: POST
    path: /integrity/cases
    purpose: "Open a case from an ACCEPTED report and run the full intake assessment."
    roles: [IntegrityOfficer]
    input: [report_id]
    output: Case
    side_effects:
      - "Case created with adjudication_status INTAKE_REVIEW, notation_status NOT_APPLICABLE, pathway UNASSIGNED, hearing_round 0, version 1"
      - "evidence_strength_score is copied from the report and frozen on the case"
      - "baseline_course_grade_pct is computed from the offering's grade_components and the report's component_scores"
      - "cross_course_pattern_points, prior_upheld_count_at_assessment, prior_escalation_points, provisional_severity_index, severity_index and recommended_ladder_rank are computed"
      - "informal_severity_index and informal_recommended_ladder_rank are computed under the informal_instructor variant"
      - "Department.open_case_count += 1 [INV inv-department-open-cases]"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_REPORT_NOT_FOUND, ERR_REPORT_STATE_INVALID, ERR_CASE_ALREADY_OPENED, ERR_COMPONENT_SCORES_INCOMPLETE]
  - method: POST
    path: /integrity/cases/legacy-import
    purpose: "Import a historical, already-closed case so that the repeat-offense database and cross-course pattern detector have prior history to read. This is the only way to create a Case whose decided_at predates the current logical clock."
    roles: [IntegrityOfficer]
    input: [report_id, decided_at, responsibility_finding, imposed_ladder_rank, completed_at]
    output: Case
    side_effects:
      - "Case created directly in adjudication_status CLOSED with pathway FORMAL, overturned false, notation_status NOT_APPLICABLE, finding_basis LEGACY and the supplied decided_at"
      - "a Sanction is created in status COMPLETED with ladder_rank imposed_ladder_rank, kind LADDER_KIND[imposed_ladder_rank], imposed_at decided_at and the supplied completed_at"
      - "Student.prior_upheld_count is recomputed (a RESPONSIBLE import increments it); Student.active_sanction_points is NOT changed because the sanction is already COMPLETED"
      - "Department.open_case_count is NOT incremented"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_REPORT_NOT_FOUND, ERR_REPORT_STATE_INVALID, ERR_CASE_ALREADY_OPENED]
    notes: "decided_at must be <= the current logical clock and completed_at must be >= decided_at."
  - method: GET
    path: /integrity/cases
    purpose: "List cases, filterable on both state dimensions and on every owning reference."
    roles: [IntegrityOfficer, RegistrarOfficer, AppealsDean]
    input: ["report_id?", "student_id?", "offering_id?", "adjudication_status?", "notation_status?", "pathway?", "limit?", "offset?"]
    output: Case[]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_PAGINATION, ERR_REPORT_NOT_FOUND, ERR_STUDENT_NOT_FOUND, ERR_OFFERING_NOT_FOUND]
  - method: GET
    path: /integrity/cases/{id}
    purpose: "Read one case, including both state dimensions, every severity field and the version used for optimistic concurrency."
    roles: [IntegrityOfficer, FacultyReporter, PanelChair, Student, AppealsDean, RegistrarOfficer]
    input: []
    output: Case
