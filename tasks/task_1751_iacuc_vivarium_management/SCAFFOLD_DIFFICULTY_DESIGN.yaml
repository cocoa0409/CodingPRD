              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /iacuc/protocols/${proto_id}/review-decisions"
              payload:
                decisions:
                  - reviewer_kind: "DESIGNATED_MEMBER"
                    decision: "APPROVE"
              as: IacucAdministrator
            - call: "POST /iacuc/cages"
              payload: { cage_barcode: "POP-A", room_code: "VIV-702", species: "MOUSE", cage_kind: "STANDARD", capacity_adults: 5, protocol_id: "${proto_id}" }
              as: FacilityManager
              captures: { cage_a: $.data.id }
            - call: "POST /iacuc/cages"
              payload: { cage_barcode: "POP-B", room_code: "VIV-702", species: "MOUSE", cage_kind: "STANDARD", capacity_adults: 5, protocol_id: "${proto_id}" }
              as: FacilityManager
              captures: { cage_b: $.data.id }
            - call: "POST /iacuc/animals"
              payload: { animal_tag: "POP-1", cage_id: "${cage_a}", protocol_id: "${proto_id}", species: "MOUSE", date_of_birth: "2026-05-01T00:00:00Z", sex: "M" }
              as: AnimalCareStaff
              captures: { a1: $.data.id }
            - call: "POST /iacuc/animals"
              payload: { animal_tag: "POP-2", cage_id: "${cage_a}", protocol_id: "${proto_id}", species: "MOUSE", date_of_birth: "2026-05-01T00:00:00Z", sex: "F" }
              as: AnimalCareStaff
              captures: { a2: $.data.id }
          trigger:
            - call: "POST /iacuc/animals/${a1}/transfer"
              payload: { target_cage_id: "${cage_b}" }
              as: AnimalCareStaff
            - call: "GET /iacuc/protocols/${proto_id}"
              payload: {}
              as: IacucAdministrator
              captures: { used_after_transfer: $.data.animals_used_count }
            - call: "GET /iacuc/cages/${cage_a}/animals"
              payload: {}
              as: AnimalCareStaff
            - call: "GET /iacuc/cages/${cage_b}/animals"
              payload: {}
              as: AnimalCareStaff
            - call: "POST /iacuc/animals/${a1}/retire"
              payload: {}
              as: AnimalCareStaff
            - call: "GET /iacuc/protocols/${proto_id}"
              payload: {}
              as: IacucAdministrator
              captures: { used_after_retire: $.data.animals_used_count }
          assert:
            - "animals_used_count == 2 after transfer (transfer conserves population)"
            - "Cage A holds exactly 1 ALIVE animal; cage B holds exactly 1 ALIVE animal; total across cages == 2"
            - "animals_used_count == 2 after retire (RETIRED still counts; only TRANSFERRED_OUT is excluded per formula) and ALIVE total == 1"

