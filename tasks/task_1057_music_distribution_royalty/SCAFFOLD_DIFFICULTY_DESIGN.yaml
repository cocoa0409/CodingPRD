scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: statement_provisional_vs_final_commission_divergence
        grounds:
          - calculations.statement_commission_cents
          - calculations.statement_net_cents
          - calculations.content_id_bonus_cents
          - state_machines.RoyaltyStatement.INGESTING_to_RECONCILED
          - state_machines.RoyaltyStatement.RECONCILED_to_CLOSED
          - entities.RoyaltyStatement.fields.provisional_net_cents
          - entities.RoyaltyStatement.fields.net_cents
        distinguishing_aspect: |
          This dual variant lives in the revenue-accounting domain on RoyaltyStatement: identical
          RoyaltyLine data yields commission 75000 under PROVISIONAL (whole gross at the plan rate)
          and 90000 under FINAL (CONTENT_ID gross re-rated at 3000 bps), so provisional_net_cents
          425000 and net_cents 412000 differ by exactly 13000 cents on the same row.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z."
            - "Plan PRO with commission_bps 1500, 5 release slots, Content-ID allowed."
            - "Stores SPOTIFY (surcharge 0) and YOUTUBE (surcharge 0)."
            - "Artist NOVA with an ACTIVE subscription on PRO and lifetime_gross_cents 0."
            - "Release AURORA in DRAFT with two tracks, each carrying one LOCKED SplitSheet."
            - "RoyaltyStatement for period [2026-05-01, 2026-06-01) in status INGESTING holding two lines: STREAMING 400000 cents on track A via SPOTIFY, CONTENT_ID 100000 cents on track B via YOUTUBE."
            - "Statement already RECONCILED by FinanceOps operator fin-1."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/subscription-plans"
              payload: { code: "PRO", name: "Pro", annual_fee_cents: 2000, included_release_slots: 5, commission_bps: 1500, allows_content_id: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /api/stores"
              payload: { code: "SPOTIFY", name: "Spotify", delivery_lead_days: 5, requires_isrc: true, requires_explicit_flag: true, surcharge_bps: 0, max_concurrent_deliveries: 2 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { store_spot: $.data.id }
            - call: "POST /api/stores"
              payload: { code: "YOUTUBE", name: "YouTube", delivery_lead_days: 5, requires_isrc: true, requires_explicit_flag: true, surcharge_bps: 0, max_concurrent_deliveries: 2 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { store_yt: $.data.id }
            - call: "POST /api/artists"
              payload: { display_name: "Nova", legal_name: "Nova LLC", country_code: "US", email: "nova@example.com" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { artist_id: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { artist_id: "${artist_id}", plan_id: "${plan_id}", auto_renew: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { sub_id: $.data.id }
            - call: "POST /api/subscriptions/${sub_id}/activate"
              payload: { payment_reference: "pay-nova-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/releases"
              payload: { artist_id: "${artist_id}", title: "Aurora", release_date: "2026-09-01T00:00:00Z", primary_genre: "Pop", label_name: "Nova Rec", upc: "012345678905" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { release_id: $.data.id }
            - call: "POST /api/releases/${release_id}/tracks"
              payload: { title: "Dawn", duration_seconds: 210, track_number: 1, isrc: "USNVA2600001", explicit: false }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { track_a: $.data.id, track_a_v: $.data.version }
            - call: "POST /api/releases/${release_id}/tracks"
              payload: { title: "Dusk", duration_seconds: 195, track_number: 2, isrc: "USNVA2600002", explicit: false }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { track_b: $.data.id, track_b_v: $.data.version }
            - call: "POST /api/collaborators"
              payload: { artist_id: "${artist_id}", name: "Rae", email: "rae@example.com", country_code: "US", tax_form_status: "VERIFIED", payout_method: "PAYPAL" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { c1: $.data.id }
            - call: "POST /api/collaborators"
              payload: { artist_id: "${artist_id}", name: "Milo", email: "milo@example.com", country_code: "GB", tax_form_status: "VERIFIED", payout_method: "PAYPAL" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { c2: $.data.id }
            - call: "POST /api/split-sheets"
              payload: { track_id: "${track_a}", effective_from: "2026-01-01T00:00:00Z", expected_track_version: "${track_a_v}" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { sheet_a: $.data.id }
            - call: "POST /api/split-sheets/${sheet_a}/shares"
              payload: { collaborator_id: "${c1}", share_bps: 6667 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { share_a1: $.data.id }
            - call: "POST /api/split-sheets/${sheet_a}/shares"
              payload: { collaborator_id: "${c2}", share_bps: 3333 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { share_a2: $.data.id }
            - call: "POST /api/split-sheets/${sheet_a}/send"
              payload: {}
              as: Artist
              as_user_id: "${artist_id}"
            - call: "POST /api/split-shares/${share_a1}/accept"
              payload: {}
              as: Collaborator
              as_user_id: "${c1}"
            - call: "POST /api/split-shares/${share_a2}/accept"
              payload: {}
              as: Collaborator
              as_user_id: "${c2}"
            - call: "POST /api/split-sheets/${sheet_a}/lock"
              payload: {}
              as: Artist
              as_user_id: "${artist_id}"
            - call: "POST /api/split-sheets"
              payload: { track_id: "${track_b}", effective_from: "2026-01-01T00:00:00Z", expected_track_version: "${track_b_v}" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { sheet_b: $.data.id }
            - call: "POST /api/split-sheets/${sheet_b}/shares"
              payload: { collaborator_id: "${c1}", share_bps: 10000 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { share_b1: $.data.id }
            - call: "POST /api/split-sheets/${sheet_b}/send"
              payload: {}
              as: Artist
              as_user_id: "${artist_id}"
            - call: "POST /api/split-shares/${share_b1}/accept"
              payload: {}
              as: Collaborator
              as_user_id: "${c1}"
            - call: "POST /api/split-sheets/${sheet_b}/lock"
              payload: {}
              as: Artist
              as_user_id: "${artist_id}"
            - call: "POST /api/royalty-statements"
              payload: { artist_id: "${artist_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z" }
              as: FinanceOps
              as_user_id: "fin-1"
              captures: { stmt_id: $.data.id, stmt_v: $.data.version }
            - call: "POST /api/royalty-statements/${stmt_id}/ingest"
              payload:
                expected_statement_version: "${stmt_v}"
                lines:
                  - { track_id: "${track_a}", store_id: "${store_spot}", units: 1200000, gross_cents: 400000, source: "STREAMING", reported_at: "2026-05-10T00:00:00Z" }
                  - { track_id: "${track_b}", store_id: "${store_yt}", units: 300000, gross_cents: 100000, source: "CONTENT_ID", reported_at: "2026-05-11T00:00:00Z" }
              as: FinanceOps
              as_user_id: "fin-1"
            - call: "POST /api/royalty-statements/${stmt_id}/reconcile"
              payload: {}
              as: FinanceOps
              as_user_id: "fin-1"
          trigger:
            - call: "POST /api/royalty-statements/${stmt_id}/close"
              payload: {}
              as: FinanceOps
              as_user_id: "fin-2"
          assert:
            - "RoyaltyStatement.${stmt_id}.gross_cents == 500000"
            - "RoyaltyStatement.${stmt_id}.content_id_gross_cents == 100000"
            - "RoyaltyStatement.${stmt_id}.provisional_net_cents == 425000"
            - "RoyaltyStatement.${stmt_id}.commission_cents == 90000"
            - "RoyaltyStatement.${stmt_id}.content_id_bonus_cents == 2000"
            - "RoyaltyStatement.${stmt_id}.net_cents == 412000"
            - "RoyaltyStatement.${stmt_id}.status == CLOSED"
            - "GET /api/royalty-statements/${stmt_id}/summary returns variant_delta_cents == 13000"

      - name: collaborator_treaty_vs_statutory_withholding_divergence
        grounds:
          - calculations.collaborator_withholding_bps
          - calculations.payout_net_cents
          - entities.Collaborator.fields.withholding_bps
          - entities.Collaborator.fields.tax_form_status
          - entities.Payout.fields.withholding_cents
        distinguishing_aspect: |
          This dual variant lives in the payee-tax domain on Collaborator/Payout, not on
          RoyaltyStatement: two GB collaborators holding an identical 5000 bps share of the same
          track receive identical gross_cents 45000 but net 40500 under the TREATY variant
          (tax_form_status VERIFIED, 1000 bps) versus 31500 under the STATUTORY variant
          (tax_form_status SUBMITTED, 3000 bps).
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z."
            - "Plan LITE with commission_bps 1000."
            - "Store SPOTIFY with surcharge_bps 0."
            - "Artist VEGA with an ACTIVE subscription, one DRAFT release and one track."
            - "Two GB collaborators on the track's LOCKED SplitSheet at 5000 bps each: MIA with tax_form_status VERIFIED and NEO with tax_form_status SUBMITTED."
            - "Statement for [2026-05-01, 2026-06-01) RECONCILED by fin-1 with a single STREAMING line of 100000 cents."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/subscription-plans"
              payload: { code: "LITE", name: "Lite", annual_fee_cents: 1000, included_release_slots: 3, commission_bps: 1000, allows_content_id: false }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /api/stores"
              payload: { code: "SPOTIFY", name: "Spotify", delivery_lead_days: 5, requires_isrc: true, requires_explicit_flag: true, surcharge_bps: 0, max_concurrent_deliveries: 2 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { store_spot: $.data.id }
            - call: "POST /api/artists"
              payload: { display_name: "Vega", legal_name: "Vega Ltd", country_code: "US", email: "vega@example.com" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { artist_id: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { artist_id: "${artist_id}", plan_id: "${plan_id}", auto_renew: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { sub_id: $.data.id }
            - call: "POST /api/subscriptions/${sub_id}/activate"
              payload: { payment_reference: "pay-vega-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/releases"
              payload: { artist_id: "${artist_id}", title: "Lyra", release_date: "2026-09-01T00:00:00Z", primary_genre: "Indie", label_name: "Vega Rec", upc: "012345678912" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { release_id: $.data.id }
            - call: "POST /api/releases/${release_id}/tracks"
              payload: { title: "Orbit", duration_seconds: 200, track_number: 1, isrc: "USVEG2600001", explicit: false }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { track_a: $.data.id, track_a_v: $.data.version }
            - call: "POST /api/collaborators"
              payload: { artist_id: "${artist_id}", name: "Mia", email: "mia@example.com", country_code: "GB", tax_form_status: "VERIFIED", payout_method: "PAYPAL" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { c_treaty: $.data.id }
            - call: "POST /api/collaborators"
              payload: { artist_id: "${artist_id}", name: "Neo", email: "neo@example.com", country_code: "GB", tax_form_status: "SUBMITTED", payout_method: "PAYPAL" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { c_statutory: $.data.id }
            - call: "POST /api/split-sheets"
              payload: { track_id: "${track_a}", effective_from: "2026-01-01T00:00:00Z", expected_track_version: "${track_a_v}" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { sheet_a: $.data.id }
            - call: "POST /api/split-sheets/${sheet_a}/shares"
              payload: { collaborator_id: "${c_treaty}", share_bps: 5000 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { share_t: $.data.id }
            - call: "POST /api/split-sheets/${sheet_a}/shares"
              payload: { collaborator_id: "${c_statutory}", share_bps: 5000 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { share_s: $.data.id }
            - call: "POST /api/split-sheets/${sheet_a}/send"
              payload: {}
              as: Artist
              as_user_id: "${artist_id}"
            - call: "POST /api/split-shares/${share_t}/accept"
              payload: {}
              as: Collaborator
              as_user_id: "${c_treaty}"
            - call: "POST /api/split-shares/${share_s}/accept"
              payload: {}
              as: Collaborator
              as_user_id: "${c_statutory}"
            - call: "POST /api/split-sheets/${sheet_a}/lock"
              payload: {}
              as: Artist
              as_user_id: "${artist_id}"
            - call: "POST /api/royalty-statements"
              payload: { artist_id: "${artist_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z" }
              as: FinanceOps
              as_user_id: "fin-1"
              captures: { stmt_id: $.data.id, stmt_v: $.data.version }
            - call: "POST /api/royalty-statements/${stmt_id}/ingest"
              payload:
                expected_statement_version: "${stmt_v}"
                lines:
                  - { track_id: "${track_a}", store_id: "${store_spot}", units: 500000, gross_cents: 100000, source: "STREAMING", reported_at: "2026-05-12T00:00:00Z" }
              as: FinanceOps
              as_user_id: "fin-1"
            - call: "POST /api/royalty-statements/${stmt_id}/reconcile"
              payload: {}
              as: FinanceOps
              as_user_id: "fin-1"
          trigger:
            - call: "POST /api/royalty-statements/${stmt_id}/close"
              payload: {}
              as: FinanceOps
              as_user_id: "fin-2"
          assert:
            - "RoyaltyStatement.${stmt_id}.commission_cents == 10000"
            - "RoyaltyStatement.${stmt_id}.net_cents == 90000"
            - "GET /api/payouts?collaborator_id=${c_treaty} returns exactly 1 payout with gross_cents == 45000, withholding_bps == 1000, withholding_cents == 4500, net_cents == 40500"
            - "GET /api/payouts?collaborator_id=${c_statutory} returns exactly 1 payout with gross_cents == 45000, withholding_bps == 3000, withholding_cents == 13500, net_cents == 31500"
            - "Collaborator.${c_treaty}.pending_payout_cents == 40500"
            - "Collaborator.${c_statutory}.pending_payout_cents == 31500"

  # =====================================================================
  # Rule 2 — combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: payout_two_level_floor_largest_remainder_rounding_order
        grounds:
          - calculations.payout_split_allocation
          - calculations.statement_net_cents
          - entities.Payout.fields.gross_cents
          - entities.SplitShare.fields.share_bps
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters. The scaffold pins
          floor-then-largest-remainder at each of the two allocation levels; on net_cents 850 split
          3333/3333/3334 bps the pinned order yields 283/283/284 (summing to exactly 850), whereas
          round-half-up-per-share-then-sum yields 283/283/283 and loses a cent.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z."
            - "Plan MICRO with commission_bps 1500."
            - "Store SPOTIFY with surcharge_bps 0."
            - "Artist ORION with an ACTIVE subscription, one DRAFT release, one track."
            - "The track's LOCKED SplitSheet holds three US VERIFIED collaborators at 3333, 3333 and 3334 bps, created in that order."
            - "Statement for [2026-05-01, 2026-06-01) RECONCILED by fin-1 with a single STREAMING line of 1000 cents."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/subscription-plans"
              payload: { code: "MICRO", name: "Micro", annual_fee_cents: 500, included_release_slots: 2, commission_bps: 1500, allows_content_id: false }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /api/stores"
              payload: { code: "SPOTIFY", name: "Spotify", delivery_lead_days: 5, requires_isrc: true, requires_explicit_flag: true, surcharge_bps: 0, max_concurrent_deliveries: 2 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { store_spot: $.data.id }
            - call: "POST /api/artists"
              payload: { display_name: "Orion", legal_name: "Orion LLC", country_code: "US", email: "orion@example.com" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { artist_id: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { artist_id: "${artist_id}", plan_id: "${plan_id}", auto_renew: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { sub_id: $.data.id }
            - call: "POST /api/subscriptions/${sub_id}/activate"
              payload: { payment_reference: "pay-orion-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/releases"
              payload: { artist_id: "${artist_id}", title: "Belt", release_date: "2026-09-01T00:00:00Z", primary_genre: "Ambient", label_name: "Orion Rec", upc: "012345678929" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { release_id: $.data.id }
            - call: "POST /api/releases/${release_id}/tracks"
              payload: { title: "Rigel", duration_seconds: 240, track_number: 1, isrc: "USORI2600001", explicit: false }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { track_a: $.data.id, track_a_v: $.data.version }
            - call: "POST /api/collaborators"
              payload: { artist_id: "${artist_id}", name: "Ann", email: "ann@example.com", country_code: "US", tax_form_status: "VERIFIED", payout_method: "PAYPAL" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { cx: $.data.id }
            - call: "POST /api/collaborators"
              payload: { artist_id: "${artist_id}", name: "Ben", email: "ben@example.com", country_code: "US", tax_form_status: "VERIFIED", payout_method: "PAYPAL" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { cy: $.data.id }
            - call: "POST /api/collaborators"
              payload: { artist_id: "${artist_id}", name: "Cal", email: "cal@example.com", country_code: "US", tax_form_status: "VERIFIED", payout_method: "PAYPAL" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { cz: $.data.id }
            - call: "POST /api/split-sheets"
              payload: { track_id: "${track_a}", effective_from: "2026-01-01T00:00:00Z", expected_track_version: "${track_a_v}" }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { sheet_a: $.data.id }
            - call: "POST /api/split-sheets/${sheet_a}/shares"
              payload: { collaborator_id: "${cx}", share_bps: 3333 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { share_x: $.data.id }
            - call: "POST /api/split-sheets/${sheet_a}/shares"
              payload: { collaborator_id: "${cy}", share_bps: 3333 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { share_y: $.data.id }
            - call: "POST /api/split-sheets/${sheet_a}/shares"
              payload: { collaborator_id: "${cz}", share_bps: 3334 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { share_z: $.data.id }
            - call: "POST /api/split-sheets/${sheet_a}/send"
              payload: {}
              as: Artist
              as_user_id: "${artist_id}"
            - call: "POST /api/split-shares/${share_x}/accept"
              payload: {}
              as: Collaborator
              as_user_id: "${cx}"
            - call: "POST /api/split-shares/${share_y}/accept"
              payload: {}
              as: Collaborator
              as_user_id: "${cy}"
            - call: "POST /api/split-shares/${share_z}/accept"
              payload: {}
              as: Collaborator
              as_user_id: "${cz}"
            - call: "POST /api/split-sheets/${sheet_a}/lock"
              payload: {}
              as: Artist
              as_user_id: "${artist_id}"
            - call: "POST /api/royalty-statements"
              payload: { artist_id: "${artist_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z" }
              as: FinanceOps
              as_user_id: "fin-1"
              captures: { stmt_id: $.data.id, stmt_v: $.data.version }
            - call: "POST /api/royalty-statements/${stmt_id}/ingest"
              payload:
                expected_statement_version: "${stmt_v}"
                lines:
                  - { track_id: "${track_a}", store_id: "${store_spot}", units: 4000, gross_cents: 1000, source: "STREAMING", reported_at: "2026-05-14T00:00:00Z" }
              as: FinanceOps
              as_user_id: "fin-1"
            - call: "POST /api/royalty-statements/${stmt_id}/reconcile"
              payload: {}
              as: FinanceOps
              as_user_id: "fin-1"
          trigger:
            - call: "POST /api/royalty-statements/${stmt_id}/close"
              payload: {}
              as: FinanceOps
              as_user_id: "fin-2"
          assert:
            - "RoyaltyStatement.${stmt_id}.commission_cents == 150"
            - "RoyaltyStatement.${stmt_id}.net_cents == 850"
            - "GET /api/payouts?collaborator_id=${cx} returns exactly 1 payout with gross_cents == 283 and net_cents == 283"
            - "GET /api/payouts?collaborator_id=${cy} returns exactly 1 payout with gross_cents == 283 and net_cents == 283"
            - "GET /api/payouts?collaborator_id=${cz} returns exactly 1 payout with gross_cents == 284 and net_cents == 284"
