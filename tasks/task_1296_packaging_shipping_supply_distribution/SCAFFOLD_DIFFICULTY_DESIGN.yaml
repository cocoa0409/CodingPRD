          assert:
            - "first submit error_id == ERR_ACCOUNT_SUSPENDED (captured ${err_1}) — state p5 outranks business_constraint p7"
            - "after reactivate, second submit error_id == ERR_PO_REQUIRED (captured ${err_2}) — the masked constraint surfaces once state clears"

      - name: suspended_account_outranks_credit_limit
        grounds:
          - validations[priority=5]
          - validations[priority=16]
        distinguishing_aspect: |
          Error-category pair state-vs-business_fiscal: one approve violates
          both ERR_ACCOUNT_SUSPENDED (p5, state) and ERR_CREDIT_LIMIT_EXCEEDED
          (p16, business_fiscal); the state error must win. Pair differs from
          the sibling instance's state-vs-business_constraint.
        test_recipe:
          setup:
            - "CORPORATE account po_required=true credit_limit_cents=100; order po PO-CR with line qty 11 at base 100000 -> grand 1118005 routes to PO_REVIEW; account then SUSPENDED before approve"
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
