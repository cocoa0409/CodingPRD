          assert:
            - "${disc} == 370"
            - "${auth_after_complete} == \"DISPENSED\""
            - "${settle_after_reject} == \"PENDING\""
            - "${auth_after_reject} == \"DISPENSED\""
            - "FuelRedemption.${r6_id}.authorization_status == \"DISPENSED\""
            - "FuelRedemption.${r6_id}.settlement_status == \"SETTLED\""
            - "FuelRedemption.${r6_id}.settlement_batch_id == \"${sb3_id}\""
            - "SettlementBatch.${sb2_id}.status == \"REJECTED\" and SettlementBatch.${sb2_id}.reimbursement_cents == 0"
            - "SettlementBatch.${sb3_id}.status == \"APPROVED\" and SettlementBatch.${sb3_id}.reimbursement_cents == 310"
            - "Site.${p2_id}.settlement_balance_cents == 310"

  # =========================================================================
  # Rule 4 — transitive_cascade (different triggering transitions)
  #   * depth 5 from POST /purchase-transactions/{id}/void  (POSTED branch)
  #   * depth 3 from POST /household-links/{id}/revoke       (ACTIVE branch)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: purchase_void_cascades_reversal_autovoid_signal_and_household_freeze
        grounds:
          - state_machines.PurchaseTransaction.POSTED_ACCRUED_to_VOIDED_REVERSED
          - calculations.overdraw_auto_void_selection
          - calculations.household_fraud_score
          - state_machines.Household.ACTIVE_to_FROZEN
        distinguishing_aspect: |
          Five hops, each caused strictly by its predecessor: the void reverses
          the accrual (hop 2), the resulting negative balance is what selects the
          AUTHORIZED redemption for auto-void (hop 3), the auto-void is what
          writes the OVERDRAWN_AUTH signal of weight 40 (hop 4), and that signal
          is what pushes fraud_score to 65 and freezes the household (hop 5).
          Its trigger is a PurchaseTransaction void — a different transition from
          this rule's other instance, which starts at a link revocation.
        test_recipe:
          setup:
            - "Banner B_CASC on defaults (freeze_threshold_score 60, INSTANTANEOUS scoring); cycles 2026-08 and 2026-09 exist; clock at 2026-08-05T10:00:00Z."
            - "Household H4 ACTIVE with one pre-existing OPEN analyst signal of weight 25, so fraud_score is 25 and the household is below the freeze threshold."
            - "Member M7 holds an ACTIVE PRIMARY link into H4 and 500 accrued points from a POSTED basket."
            - "M7 holds one AUTHORIZED redemption that debited 400 points, leaving available_points at 100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /banners"
              payload: { banner_code: "CASC", name: "Cascade Banner" }
              as: ProgramAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${bc_id}", cycle_month: "2026-08", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-31T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { cc_aug_id: $.data.id }
            - call: "POST /point-cycles"
              payload: { banner_id: "${bc_id}", cycle_month: "2026-09", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-30T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { cc_sep_id: $.data.id }
            - call: "POST /sites"
              payload: { banner_id: "${bc_id}", site_number: "G-006", site_type: "GROCERY" }
              as: ProgramAdmin
              captures: { g6_id: $.data.id }
            - call: "POST /sites"
              payload: { banner_id: "${bc_id}", site_number: "F-006", site_type: "OWNED_FUEL_CENTER" }
              as: ProgramAdmin
              captures: { f6_id: $.data.id }
            - call: "POST /households"
              payload: { banner_id: "${bc_id}", household_code: "HH-CASC-1" }
              as: LoyaltyAnalyst
              captures: { h4_id: $.data.id }
            - call: "POST /members"
              payload: { banner_id: "${bc_id}", alt_id: "5550000007", card_number: "4000000000000007", full_name: "Gus Cascade" }
              as: ProgramAdmin
              captures: { m7_id: $.data.id }
            - call: "POST /household-links"
              payload: { household_id: "${h4_id}", member_id: "${m7_id}", link_role: "PRIMARY" }
              as: LoyaltyAnalyst
              captures: { l4_id: $.data.id }
            - call: "POST /household-links/${l4_id}/activate"
              payload: {}
              as: LoyaltyAnalyst
            - call: "POST /fraud-signals"
              payload: { household_id: "${h4_id}", signal_type: "CROSS_BANNER_VELOCITY", severity_weight: 25 }
              as: LoyaltyAnalyst
              captures: { sig7_id: $.data.id }
            - call: "POST /purchase-transactions"
              payload: { member_id: "${m7_id}", site_id: "${g6_id}", transacted_at: "2026-08-05T10:00:00Z", lines: [{ category: "GROCERY", amount_cents: 50000, quantity: 1 }] }
              as: StoreOperator
              as_user_id: "${g6_id}"
              captures: { t7_id: $.data.id }
            - call: "POST /purchase-transactions/${t7_id}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${g6_id}"
            - call: "GET /members/${m7_id}"
              payload: {}
              as: PumpTerminal
              as_user_id: "${f6_id}"
              captures: { mv7: $.data.version }
            - call: "POST /fuel-redemptions"
              payload: { member_id: "${m7_id}", site_id: "${f6_id}", alt_id_presented: "5550000007", points_committed: 400, expected_member_version: "${mv7}" }
              as: PumpTerminal
              as_user_id: "${f6_id}"
              captures: { r7_id: $.data.id }
          trigger:
            - call: "POST /purchase-transactions/${t7_id}/void"
              payload: {}
              as: StoreOperator
              as_user_id: "${g6_id}"
              captures: { post_status: $.data.posting_status, accr_status: $.data.accrual_status }
          assert:
            - "${post_status} == \"VOIDED\""
            - "${accr_status} == \"REVERSED\""
            - "GET /point-ledger-entries?member_id=${m7_id}&entry_type=REVERSAL returns meta total_count == 1 and data[0].points_delta == -500"
            - "FuelRedemption.${r7_id}.authorization_status == \"VOIDED\""
            - "FuelRedemption.${r7_id}.points_debited_at_auth == 400"
            - "GET /point-ledger-entries?member_id=${m7_id}&entry_type=REDEMPTION_RELEASE returns meta total_count == 1 and data[0].points_delta == 400"
            - "Member.${m7_id}.available_points == 0"
            - "Member.${m7_id}.lifetime_points == 0"
            - "GET /households/${h4_id}/fraud-signals?signal_type=OVERDRAWN_AUTH returns meta total_count == 1, data[0].severity_weight == 40, data[0].source == \"SYSTEM\" and data[0].status == \"OPEN\""
            - "Household.${h4_id}.fraud_score == 65"
            - "Household.${h4_id}.status == \"FROZEN\""
            - "Household.${h4_id}.frozen_reason == \"AUTO_FRAUD_SCORE\""

      - name: link_revoke_cascades_coverage_recompute_and_cross_banner_autovoid
        grounds:
          - state_machines.HouseholdLink.ACTIVE_to_REVOKED
          - entities.Household.fields.cross_banner_member_ids
          - state_machines.FuelRedemption.AUTHORIZED_NOT_APPLICABLE_to_VOIDED_NOT_APPLICABLE
          - validations[priority=54]
        distinguishing_aspect: |
          Three hops from a link revocation: the status write (hop 1) forces the
          household's cross_banner_member_ids to be recomputed (hop 2), and it is
          the member's disappearance from that recomputed set — not the status
          write itself — that voids the AUTHORIZED redemption standing at the
          other banner's fuel center (hop 3). Its trigger is a HouseholdLink
          revocation, distinct from this rule's purchase-void instance.
        test_recipe:
          setup:
            - "Banner B_HOME (the member's banner) and Banner B_AWAY, each on defaults."
            - "B_HOME has cycles 2026-08 and 2026-09; grocery site G7 under B_HOME; owned fuel center F_AWAY under B_AWAY."
            - "Member M8 belongs to B_HOME and holds 300 accrued points."
            - "Household H5 belongs to B_AWAY and holds an ACTIVE SECONDARY link to M8, so M8 appears in H5.cross_banner_member_ids."
            - "M8 holds one AUTHORIZED cross-banner redemption at F_AWAY that debited 300 points."
            - "Logical clock at 2026-08-05T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:00:00Z" }
