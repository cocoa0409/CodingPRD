              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { sp_d: $.data.id }
          assert:
            - "AuxiliarySystem.${sp_a}.demand_gpm == 1000.0 - capped at 42.0 ft"
            - "AuxiliarySystem.${sp_b}.demand_gpm == 1000.0 - exactly 150.0 ft is still not a high rise"
            - "AuxiliarySystem.${sp_c}.demand_gpm == 1250.0 - above the trigger the raw figure survives"
            - "AuxiliarySystem.${sp_d}.demand_gpm == 750.0 - below either cap, unaffected"
            - "Project.${p1}.auxiliary_demand_gpm == 1000.0"
            - "Project.${p2}.auxiliary_demand_gpm == 1000.0"
            - "Project.${p3}.auxiliary_demand_gpm == 2000.0"

      - name: cooking_water_wash_term_is_worth_exactly_sixty_gpm
        claim_type: correct_result
        grounds:
          - calculations.auxiliary_system_demand
          - entities.AuxiliarySystem.fields.water_wash_enabled
          - entities.AuxiliarySystem.fields.interlock_required
        distinguishing_aspect: |
          Two COOKING systems with the same appliance_count 4 differ only in water_wash_enabled:
          40.0 + 15.0 x 4 + 60.0 == 160.0 with the wash and 40.0 + 15.0 x 4 == 100.0 without it, a
          delta of exactly the 60.0 constant. interlock_required is true for both because it keys off
          system_type alone, never off the wash flag, and the ledger carries 260.0.
