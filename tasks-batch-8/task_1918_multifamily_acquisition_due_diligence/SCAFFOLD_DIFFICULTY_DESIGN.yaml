            - { call: "POST /acquisitions/inspections/${insp}/complete", payload: { condition_rating: 4, no_findings_declared: true }, as: PropertyOperationsLead, as_user_id: "pol-1", captures: { st3: $.data.status } }
            - { call: "POST /acquisitions/inspections/${insp}/qa-accept", payload: {}, as: PropertyOperationsLead, as_user_id: "pol-2", captures: { st4: $.data.status } }
          assert:
            - "qa-reject lands QA_REJECTED and posture becomes AT_RISK (any QA_REJECTED inspection)"
            - "reschedule lands SCHEDULED with reschedule_count == 1"
            - "Second complete lands COMPLETED; second qa-accept lands QA_ACCEPTED (terminal) after exactly one loop"

