              as: CaseWorker
              captures: { ncpp4: "$.data.id" }
            - call: "POST /child-support/participants/${ncpp4}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "PA_REFERRAL", custodial_party_id: "${cpp4}", noncustodial_party_id: "${ncpp4}", child_count: 2, tanf_assistance: true, good_cause_claim: false }
