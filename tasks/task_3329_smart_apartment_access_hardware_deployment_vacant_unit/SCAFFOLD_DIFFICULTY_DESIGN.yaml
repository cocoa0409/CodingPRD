              captures: { res_gg: $.data.id }
            - call: "POST /residents/${res_gg}/onboard"
              payload: {}
              as: PropertyManager
            - call: "POST /units/${unit_gg}/guest-passes"
              payload: { host_resident_id: "${res_gg}", guest_label: "First", start_at: "2026-09-10T09:00:00Z", end_at: "2026-09-12T09:00:00Z" }
              as: PropertyManager
              captures: { pass_g1: $.data.id }
          trigger:
            - call: "POST /units/${unit_gg}/guest-passes"
              payload: { host_resident_id: "${res_gg}", guest_label: "Overlap", start_at: "2026-09-11T10:00:00Z", end_at: "2026-09-13T10:00:00Z" }
              as: PropertyManager
              captures: { err_g2: $.data.error_id }
            - call: "POST /units/${unit_gg}/guest-passes"
              payload: { host_resident_id: "${res_gg}", guest_label: "Adjacent", start_at: "2026-09-12T09:00:00Z", end_at: "2026-09-13T09:00:00Z" }
              as: PropertyManager
          assert:
            - "the overlapping pass returns ERR_UNIT_SCHEDULE_CONFLICT (interval 2026-09-11T10:00–2026-09-13T10:00 intersects G1)"
            - "the adjacent pass starting exactly at G1 end_at 2026-09-12T09:00:00Z is accepted with status ACTIVE and no conflict"
            - "GuestPass.${pass_g1}.status remains ACTIVE after both attempts"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: credential_status_partition_conservation
        grounds:
          - calculations.resident_credential_conservation
          - entities.AccessCredential.fields.status
          - state_machines.AccessCredential.transitions.ACTIVE_to_REVOKED
          - state_machines.AccessCredential.transitions.REVOKED_to_ACTIVE
          - entities.Resident.fields.status
        distinguishing_aspect: "Conserved COUNT invariant: across issue→revoke→re-issue for one unit, active + expired + revoked always equals the number of AccessCredential rows created (never a drift), so revoking moves a credential between buckets rather than deleting it."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Property P, building B (rssi=-60), unit U, ONLINE SMART_LOCK. Resident R is ACTIVE on U with one live RESIDENT credential, and one guest pass adds a GUEST credential, so the unit has 2 credential rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Ledger Loft", address_line: "4 Count Ct", unit_capacity: 1, temp_budget_cents_per_day: 500000 }
              as: PlatformAdmin
              captures: { prop_cl: $.data.id }
            - call: "POST /properties/${prop_cl}/buildings"
              payload: { name: "CL-B1", network_design: "FIELD_MESH", wifi_rssi_dbm: -60 }
              as: PlatformAdmin
              captures: { bld_cl: $.data.id }
            - call: "POST /properties/${prop_cl}/units"
              payload: { unit_number: "U-CL1", building_id: "${bld_cl}" }
              as: PropertyManager
              captures: { unit_cl: $.data.id }
            - call: "POST /devices"
              payload: { device_type: "SMART_LOCK", unit_id: "${unit_cl}", building_id: "${bld_cl}", firmware_version: "LATEST", battery_pct: 100 }
              as: HardwareTechnician
              captures: { dev_cl: $.data.id }
            - call: "POST /buildings/${bld_cl}/device-scans"
              payload: { reachable_device_ids: ["${dev_cl}"] }
              as: HardwareTechnician
            - call: "POST /residents"
              payload: { property_id: "${prop_cl}", unit_id: "${unit_cl}", full_name: "Cara Count", email: "cara@x.com" }
              as: PropertyManager
              captures: { res_cl: $.data.id }
            - call: "POST /residents/${res_cl}/onboard"
              payload: {}
              as: PropertyManager
            - call: "POST /units/${unit_cl}/guest-passes"
              payload: { host_resident_id: "${res_cl}", guest_label: "Count Guest", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-06T09:00:00Z" }
              as: PropertyManager
          trigger:
            - call: "POST /residents/${res_cl}/deactivate"
              payload: { notice_end_at: "2026-09-20T00:00:00Z" }
              as: PropertyManager
            - call: "POST /residents/${res_cl}/onboard"
              payload: {}
              as: PropertyManager
          assert:
            - "before deactivate: GET /access-credentials?unit_id=${unit_cl} returns 2 rows, both status ACTIVE"
            - "after deactivate: the same GET returns 2 rows, both status REVOKED, and active + expired + revoked == 2 (no row vanished)"
            - "after re-onboard: the GET returns 3 rows (one new ACTIVE RESIDENT credential), and active + expired + revoked == 3"
            - "at every step the count of rows equals active + expired + revoked"

      - name: property_committed_budget_zero_sum_on_cancel
        grounds:
          - calculations.maintenance_budget_accrual_cents
          - entities.Property.fields.budget_committed_cents
          - state_machines.MaintenanceVisit.transitions.NOTICE_CERTIFIED_to_CANCELLED
          - state_machines.MaintenanceVisit.transitions.REQUESTED_to_NOTICE_CERTIFIED
        distinguishing_aspect: "Conserved CENTS invariant (a different quantity type from the credential count): certify accrues +4100 onto the property budget and cancelling the same visit resets its accrual to 0, leaving Property.budget_committed_cents exactly where it started."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Property P (temp_budget_cents_per_day=500000), unit U (VACANT), non-emergency MaintenanceVisit V requested for 2026-09-03T10:00–12:30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Sum Station", address_line: "0 Net Zero Way", unit_capacity: 1, temp_budget_cents_per_day: 500000 }
              as: PlatformAdmin
              captures: { prop_zs: $.data.id }
            - call: "POST /properties/${prop_zs}/units"
              payload: { unit_number: "U-ZS1" }
              as: PropertyManager
              captures: { unit_zs: $.data.id }
            - call: "POST /units/${unit_zs}/maintenance-visits"
              payload: { technician_id: "tech-lee", start_at: "2026-09-03T10:00:00Z", end_at: "2026-09-03T12:30:00Z", is_emergency: false }
              as: PropertyManager
              captures: { visit_zs: $.data.id }
          trigger:
            - call: "POST /maintenance-visits/${visit_zs}/certify_notice"
              payload: { notice_mailed_at: "2026-09-01T09:00:00Z" }
              as: PropertyManager
            - call: "POST /maintenance-visits/${visit_zs}/complete"
              payload: { cancelled: true }
              as: PropertyManager
          assert:
            - "after certify: Property.${prop_zs}.budget_committed_cents == 4100 and MaintenanceVisit.${visit_zs}.accrued_cost_cents == 4100"
            - "after cancel: MaintenanceVisit.${visit_zs}.accrued_cost_cents == 0 and status == CANCELLED"
            - "after cancel: Property.${prop_zs}.budget_committed_cents == 0, the exact starting value (zero net drift)"
            - "the certify-then-cancel pair leaves the property budget unchanged from before the visit"