            - "After cancel: remaining_cents 150, committed_cents 0, consumed_cents 0, status ACTIVE; 150 == 150 + 0 + 0 — byte-for-byte the pre-reservation split"
            - "Delivery.${d1_id}.custody_status == CANCELLED, settlement_status == VOIDED, fee_subtotal_cents == 0"
            - "GET /fee-allocations?delivery_id=${d1_id} returns total_count 1 with status VOIDED — the reversal is recorded, not erased"
            - "PharmacyOrder.${o1_id}.status == READY (returned to the reservable pool) and DeliveryWindow.${w1_id}.reserved_slots == 0, available_slots == 1, status == OPEN"
            - "No double release: a second POST /deliveries/${d1_id}/cancel returns 409 ERR_INVALID_CUSTODY_STATE and PlanGrant.${g1_id}.remaining_cents stays 150"

      - name: window_slot_count_conserved_across_reschedule
        conserved_quantity: "sum over DeliveryWindow of reserved_slots == number of Deliveries in the reserving custody set, and per window reserved_slots + available_slots == capacity_slots"
        grounds:
          - calculations.window_slot_occupancy
          - state_machines.DeliveryWindow.OPEN_to_FULL
          - entities.DeliveryWindow.fields.available_slots
        distinguishing_aspect: |
          A different conserved quantity — integer slot capacity rather than money — and a different
          compensating operation. A reschedule is a paired release-and-reserve across two windows,
          so the network-wide reserved total must be invariant while both windows' derived
          occupancy and status change in opposite directions.
        test_recipe:
          setup:
            - "Zone Z1 with two non-overlapping SCHEDULED windows: W1 [14:00Z, 16:00Z) capacity 2 and W2 [17:00Z, 19:00Z) capacity 1."
            - "One READY standard order reserved onto W1."
            - "The clock stays at 09:00Z so both windows are more than 120 minutes out and either is reservable."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: NetworkOps
            - call: "POST /health-plans"
              payload: { name: "Meridian Health", payer_type: "COMMERCIAL", member_cost_share_pct: 0.10 }
              as: NetworkOps
              captures: { hp1_id: $.data.id }
            - call: "POST /plan-grants"
              payload: { health_plan_id: "${hp1_id}", benefit_year: 2026, grant_budget_cents: 100000, per_delivery_cap_cents: 150 }
              as: NetworkOps
              captures: { g1_id: $.data.id }
            - call: "POST /pharmacies"
              payload: { name: "Cedar Rx", state_code: "WA", cold_chain_certified: true, controlled_license_tier: "CII_V", return_window_minutes: 240 }
              as: NetworkOps
              captures: { ph1_id: $.data.id }
            - call: "POST /delivery-zones"
              payload: { zone_code: "Z1", distance_band_miles: 6.4, base_fee_cents: 705, per_mile_cents: 123, cold_pack_fee_cents: 455, controlled_handling_fee_cents: 605, after_hours_fee_cents: 305, cold_chain_supported: true, controlled_delivery_allowed: true }
              as: NetworkOps
              captures: { z1_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1970-04-12", phone_last4: "4417", address_line: "881 Alder St", zone_code: "Z1", hipaa_consent_status: "GRANTED" }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { pat1_id: $.data.id }
            - call: "POST /pharmacy-orders"
              payload: { pharmacy_id: "${ph1_id}", patient_id: "${pat1_id}", health_plan_id: "${hp1_id}", rx_line_count: 1, cold_chain_required: false, controlled_schedule: "NONE", total_rx_value_cents: 1000 }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /pharmacy-orders/${o1_id}/mark-ready"
              payload: {}
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
            - call: "POST /delivery-windows"
              payload: { zone_id: "${z1_id}", courier_mode: "SCHEDULED", window_start: "2026-08-03T14:00:00Z", window_end: "2026-08-03T16:00:00Z", capacity_slots: 2 }
              as: NetworkOps
              captures: { w1_id: $.data.id, w1_v: $.data.version }
            - call: "POST /delivery-windows"
              payload: { zone_id: "${z1_id}", courier_mode: "SCHEDULED", window_start: "2026-08-03T17:00:00Z", window_end: "2026-08-03T19:00:00Z", capacity_slots: 1 }
              as: NetworkOps
              captures: { w2_id: $.data.id }
            - call: "POST /deliveries"
              payload: { order_id: "${o1_id}", window_id: "${w1_id}", expected_window_version: "${w1_v}" }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { d1_id: $.data.id }
            - call: "GET /delivery-windows/${w1_id}"
              payload: {}
              as: NetworkOps
            - call: "GET /delivery-windows/${w2_id}"
              payload: {}
              as: NetworkOps
          trigger:
            - call: "POST /deliveries/${d1_id}/reschedule"
              payload: { window_id: "${w2_id}" }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
          assert:
            - "Before: DeliveryWindow.${w1_id} has reserved_slots 1, available_slots 1, status OPEN; DeliveryWindow.${w2_id} has reserved_slots 0, available_slots 1, status OPEN; network-wide reserved total 1"
            - "After: DeliveryWindow.${w1_id} has reserved_slots 0, available_slots 2, status OPEN"
            - "After: DeliveryWindow.${w2_id} has reserved_slots 1, available_slots 0, status FULL (capacity reached)"
            - "Network-wide reserved total is still 1 — the slot moved, it was neither duplicated nor dropped"
            - "Per-window identity holds on both rows: reserved_slots + available_slots == capacity_slots (0+2==2 and 1+0==1)"
            - "Delivery.${d1_id}.window_id == ${w2_id} and custody_status is still QUEUED"
            - "Money was re-derived rather than double-committed: GET /fee-allocations?delivery_id=${d1_id} returns total_count 2 (one SUPERSEDED, one ACTIVE) and PlanGrant.${g1_id}.committed_cents == 150, not 300"
            - "A further reschedule of a second order onto ${w2_id} returns 409 ERR_WINDOW_FULL, confirming available_slots 0 is enforced and not merely reported"
