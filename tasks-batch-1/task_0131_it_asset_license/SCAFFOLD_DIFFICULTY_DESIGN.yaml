              payload: { software_product_id: "${pid}", hardware_asset_id: "${aid}", license_entitlement_id: "${eid}", expected_entitlement_version: "${ev5}" }
              as: AssetManager
              captures: { j6: $.data.id }
          trigger:
            - call: "POST /assets/installations/${j5}/activate"
              payload: {}
              as: AssetManager
              captures: { st5: $.data.status }
