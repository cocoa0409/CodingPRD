            - "second release on terminal escrow returns error_id == ERR_INVALID_STATE (http 409), NOT ERR_NO_RELEASABLE_AMOUNT — state (p7) outranks business_fiscal (p11)"

      - name: scheduling_window_priority_over_rep_conflict
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - calculations.appointment_window_check
          - calculations.orientation_overlap_check
        distinguishing_aspect: |
          Category pair (business_temporal vs business_constraint): the
          requested slot violates BOTH the closing-window rule (1 day before
          closing < 5-day minimum) AND the rep overlap rule (inside another
          appointment's buffered interval); the temporal error
          ERR_OUTSIDE_SCHEDULING_WINDOW must win. Distinct pair from
          release_state_priority_over_fiscal_on_terminal_escrow
          (state vs business_fiscal).
        test_recipe:
          setup:
            - "Default community (min 5 days, buffer 30, duration 120)"
            - "Rep r1 already occupies 2026-08-25T14:00+120min (buffered closed interval [13:30, 16:30]) via home h1's appointment"
