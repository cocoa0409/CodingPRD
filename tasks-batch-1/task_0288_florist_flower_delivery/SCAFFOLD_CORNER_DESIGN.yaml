              captures: { flor_id: $.data.id }
          trigger:
            - call: "GET /floral/florists?covered_zone_id=${zone_id}"
              payload: {}
              as: Dispatcher
          assert:
            - "response_type == array"
            - "meta.total_count == 1"

  # =========================================================================
  # Errors
  # =========================================================================
  - section: errors
    instances:
      - name: zone_inactive_quote_returns_zone_inactive
        claim_type: violation_to_error
        grounds: ["errors[ERR_ZONE_INACTIVE]", entities.DeliveryZone.fields.active]
        distinguishing_aspect: "Quoting an order whose zone.active=false returns ERR_ZONE_INACTIVE (409)."
        test_recipe:
          setup: ["order on an inactive zone"]
          setup_api_calls:
            - call: "POST /floral/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T08:00:00Z" }
              as: Dispatcher
            - call: "POST /floral/zones"
              payload: { zone_code: "ZR1", base_delivery_fee_cents: 800, same_day_cutoff_hour_utc: 14, window_capacity_per_slot: 5, active: false }
              as: CatalogAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /floral/arrangements"
              payload: { sku: "CR1", display_name: "CR1", base_price_cents: 5000 }
              as: CatalogAdmin
              captures: { arr_id: $.data.id }
            - call: "POST /floral/customers"
              payload: { email: "zi@x.com", full_name: "ZI C" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /floral/orders"
              payload: { customer_id: "${cust_id}", arrangement_id: "${arr_id}", zone_id: "${zone_id}", delivery_date: "2027-06-10", window_start_minute: 540, window_end_minute: 720 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /floral/orders/${ord_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "response error_id == ERR_ZONE_INACTIVE"

      - name: claim_on_undelivered_order_returns_claim_window_invalid
        claim_type: violation_to_error
        grounds: ["errors[ERR_CLAIM_WINDOW_INVALID]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / claim_approve_requires_order_delivered
          rationale: "Filing a claim on a non-DELIVERED order is asserted by that §1.8 instance."

      - name: stale_order_version_on_resolve_returns_412
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_ORDER_VERSION]", "concurrency_rules[claim-resolve-stale-order]"]
        distinguishing_aspect: "Resolving an APPROVED claim with a stale expected_order_version returns ERR_STALE_ORDER_VERSION (412)."
        test_recipe:
          setup: ["a DELIVERED order with an APPROVED REFUND claim; client holds a pre-approval Order version that is now stale"]
          setup_api_calls:
            - call: "POST /floral/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-15T08:00:00Z" }
              as: Dispatcher
            - call: "POST /floral/zones"
              payload: { zone_code: "ZR2", base_delivery_fee_cents: 800, same_day_cutoff_hour_utc: 14, window_capacity_per_slot: 5 }
              as: CatalogAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /floral/arrangements"
              payload: { sku: "CR2", display_name: "CR2", base_price_cents: 5000 }
              as: CatalogAdmin
              captures: { arr_id: $.data.id }
            - call: "POST /floral/customers"
              payload: { email: "sov@x.com", full_name: "SOV C" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /floral/florists"
              payload: { shop_name: "ShopR2", covered_zone_id: "${zone_id}", daily_capacity: 5 }
              as: Dispatcher
              captures: { flor_id: $.data.id }
            - call: "POST /floral/orders"
              payload: { customer_id: "${cust_id}", arrangement_id: "${arr_id}", zone_id: "${zone_id}", delivery_date: "2027-06-20", window_start_minute: 540, window_end_minute: 720 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /floral/orders/${ord_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /floral/_payments/mark_authorized"
              payload: { order_id: "${ord_id}" }
              as: Dispatcher
              captures: { ord_v_auth: $.data.version }
            - call: "POST /floral/orders/${ord_id}/book"
              payload: { expected_order_version: "${ord_v_auth}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /floral/orders/${ord_id}/wire-fulfillments"
              payload: {}
              as: Dispatcher
              captures: { wf_real_id: "$.data[0].id" }
            - call: "POST /floral/wire-fulfillments/${wf_real_id}/accept"
              payload: {}
              as: Dispatcher
            - call: "POST /floral/orders/${ord_id}/dispatch"
              payload: {}
              as: Florist
              as_user_id: "${flor_id}"
              captures: { ord_v_stale: $.data.version }
            - call: "POST /floral/orders/${ord_id}/confirm-delivery"
              payload: {}
              as: Florist
              as_user_id: "${flor_id}"
            - call: "POST /floral/claims"
              payload: { order_id: "${ord_id}", customer_id: "${cust_id}", reason: "WILTED", requested_remedy: "REFUND" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /floral/claims/${claim_id}/approve"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /floral/claims/${claim_id}/resolve"
              payload: { expected_order_version: "${ord_v_stale}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response code == 412"
            - "response error_id == ERR_STALE_ORDER_VERSION"
            - "QualityClaim.${claim_id}.status == APPROVED"

      - name: book_stale_order_version_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_ORDER_VERSION]", "concurrency_rules[book-stale-order]"]
        excluded_because:
          difficulty_instance: compensating_invariant / cancel_booked_conserves_florist_daily_capacity
          rationale: "Booking with the correct version is exercised throughout §1.8; the stale-resolve variant above covers the 412 path, so the book-OCC negative is a stub here to avoid duplicate breadth coverage of the same 412 error_id."

