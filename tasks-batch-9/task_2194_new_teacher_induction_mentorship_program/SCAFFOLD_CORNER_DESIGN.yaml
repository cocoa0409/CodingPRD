        distinguishing_aspect: "The period boundary is strict against the logical clock: a period_end exactly equal to clock_now is refused, and the same request with period_end one entry earlier succeeds — so an implementation using <= instead of < is caught, and the verified log at the closed-interval endpoint still counts."
        test_recipe:
          setup: ["One ContactLog of 60 ONE_ON_ONE minutes was VERIFIED at 2026-08-04T12:00:00Z on an ACTIVE EXACT-tier match. The logical clock has since moved to 2026-08-05T00:00:00Z. No StipendDisbursement exists."]
