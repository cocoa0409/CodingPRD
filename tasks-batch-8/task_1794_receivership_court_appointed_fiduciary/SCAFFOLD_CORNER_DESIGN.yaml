      - name: fee_cap_boundary_at_approval
        claim_type: priority_ordering
        grounds: [calculations.engagement_fee_cap, "errors[ERR_FEE_CAP_EXCEEDED]"]
        distinguishing_aspect: "Boundary precision on the committed-fees cap: committed 60000 + approval 40000 == fee_cap_cents 100000 is permitted (<=), while the next approval of even 20000 more (120000 > 100000) is rejected with ERR_FEE_CAP_EXCEEDED."
        test_recipe:
          setup: ["Case ACTIVE; engagement APPROVED with fee_cap_cents 100000; application 1 APPROVED at 60000 (not paid)"]
