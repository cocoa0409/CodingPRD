            - call: "POST /releases"
              payload: { engagement_id: "${eng_id}", milestone_id: "${m1_id}", version_label: "v1.0.0" }
              as: Engineer
              as_user_id: "eng-001"
              captures: { rel_id: $.data.id }
            - call: "POST /releases/${rel_id}/qa-result"
