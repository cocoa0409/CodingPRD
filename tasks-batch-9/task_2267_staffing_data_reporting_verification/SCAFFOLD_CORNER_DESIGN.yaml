          - validations[priority 10 ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "Both segregation rules are identity-based rather than role-based: a dual-role worker holding both STAFFING_COORDINATOR and FACILITY_ADMINISTRATOR still cannot attest what it validated, and the auditor who verified an hour entry cannot be the auditor who accepts the quarter."
