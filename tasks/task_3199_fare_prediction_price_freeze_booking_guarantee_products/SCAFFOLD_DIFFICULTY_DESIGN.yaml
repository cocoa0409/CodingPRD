  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: cascade_posture_to_freeze_hold_to_itinerary_lock_to_watch_buynow
        grounds:
          - state_machines.Route.ACTIVE_to_RESTRICTED
          - state_machines.PriceFreeze.HELD_to_FROZEN
          - state_machines.WatchSubscription.ARMED_to_BUY_NOW
          - entities.Itinerary.fields.guarantee_locked
        distinguishing_aspect: |
          A depth-4 chain in which each hop is caused only by the previous hop: the posture move freezes
          the deposit accrual, that frozen accrual blocks the freeze from advancing to FROZEN, the
          blocked freeze keeps the itinerary's guarantee locked, and the locked guarantee forces the
          watch into BUY_NOW — one action, four dependent mutations, not a fan-out.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 has a regional RiskPool with absorbed_regression_cents > 0 so its posture can legally leave ACTIVE. Itinerary I1 carries a HELD freeze F1 with a 7500-cent deposit and an ARMED watch W1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/risk-pools"
              payload: { region: "WEST", pool_code: "WEST-RP-1" }
              as: RiskAnalyst
              captures: { pool_id: $.data.id }
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "Fare products are optional and separate from the ticket" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id, r1_version: $.data.version }
            - call: "POST /fare/demand-curves"
              payload: { route_id: "${r1_id}", price_date: "2026-09-01T00:00:00Z", each_day_prices_cents: [8200, 9000, 9600, 11200, 12800], seats_left_at_each_day: [9, 8, 6, 4, 2] }
              as: OpsAgent
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id, i1_version: $.data.version }
            - call: "POST /fare/price-observations"
              payload: { route_id: "${r1_id}", itinerary_id: "${i1_id}", fare_cents: 10000, seats_left: 6 }
              as: OpsAgent
            - call: "POST /fare/itineraries/${i1_id}/watch-subscription"
              payload: { expected_itinerary_version: "${i1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { w1_id: $.data.id, i1_v2: $.data.version }
            - call: "POST /fare/itineraries/${i1_id}/price-freezes"
              payload: { deposit_cents: 7500, disclosure_version: 1, disclosure_acknowledged: true, expected_itinerary_version: "${i1_v2}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_id: $.data.id, f1_version: $.data.version }
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
            - call: "POST /fare/hedging-positions"
              payload: { route_id: "${r1_id}", coverage_date: "2026-09-15T00:00:00Z", hedge_price_cents: 9000, contract_quantity_cents: 500000, expected_route_version: "${r1_version}" }
              as: RiskAnalyst
              captures: { hp_id: $.data.id }
            - call: "POST /fare/hedging-positions/${hp_id}/marks"
              payload: { projected_day_cost_cents: 7000 }
              as: RiskAnalyst
            - call: "POST /fare/hedge-regression-sweeps"
              payload: { pool_id: "${pool_id}" }
              as: RiskAnalyst
          trigger:
            - call: "POST /fare/routes/${r1_id}/posture-transitions"
              payload: { to_posture: "RESTRICTED", posture_reason_code: "REGIONAL_POOL_BREACH", expected_route_version: "${r1_version}" }
              as: PlatformAdmin
            - call: "POST /fare/watch-subscriptions/${w1_id}/notifications"
              payload: { request_source: "SYSTEM" }
              as: Traveler
              as_user_id: "tv-mara"
          assert:
            - "Route.${r1_id}.posture == RESTRICTED with posture_reason_code REGIONAL_POOL_BREACH"
            - "PriceFreeze.${f1_id}.status stays HELD and deposit_attributed_cents == 0 at the RESTRICTED instant and is still 0 after the clock advances seven more days"
            - "Itinerary.${i1_id}.guarantee_locked == true, carried from the freeze that could no longer advance"
            - "WatchSubscription.${w1_id}.notification_status == BUY_NOW and Itinerary.${i1_id}.booking_hold_expires_at == 2026-09-02T00:00:00Z"

      - name: cascade_cancel_to_forfeit_to_payment_sink_to_posture_release
        grounds:
          - state_machines.Itinerary.PLANNED_to_CANCELLED
          - state_machines.PriceFreeze.FROZEN_to_CANCELLED
          - state_machines.Payment.CAPTURED_to_FORFEITED
          - state_machines.Route.SURGE_to_ACTIVE
        distinguishing_aspect: |
          A depth-4 chain originating from a different trigger: cancelling an itinerary forfeits its
          freeze, that forfeiture sinks the membership payment, and the surrendered exposure is what
          lets the clock's re-derivation release the route's posture — each hop caused by the one
          before it, ending in a different terminal state than the first cascade.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 is in SURGE with a FROZEN freeze F1 on itinerary I1, a captured MEMBERSHIP_2 payment M1 for I1, and a regional pool that has already absorbed and released a regression."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/risk-pools"
              payload: { region: "WEST", pool_code: "WEST-RP-1" }
              as: RiskAnalyst
              captures: { pool_id: $.data.id }
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "Fare products are optional and separate from the ticket" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id, r1_version: $.data.version }
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id, i1_version: $.data.version }
            - call: "POST /fare/itineraries/${i1_id}/price-freezes"
              payload: { deposit_cents: 250, disclosure_version: 1, disclosure_acknowledged: true, expected_itinerary_version: "${i1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_id: $.data.id, f1_version: $.data.version }
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_v2: $.data.version }
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_v2}" }
              as: Traveler
              as_user_id: "tv-mara"
            - call: "POST /fare/payments"
              payload: { itinerary_id: "${i1_id}", payment_kind: "MEMBERSHIP_2", amount_cents: 2500, capture: true }
              as: OpsAgent
              captures: { m1_id: $.data.id }
            - call: "POST /fare/routes/${r1_id}/posture-transitions"
              payload: { to_posture: "SURGE", posture_reason_code: "DEMAND_PEAK", expected_route_version: "${r1_version}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fare/itineraries/${i1_id}/cancellations"
              payload: { cancel_reason: "TRAVELER_PLAN_CHANGE" }
              as: Traveler
              as_user_id: "tv-mara"
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "Itinerary.${i1_id}.travel_status == CANCELLED"
            - "PriceFreeze.${f1_id}.status == CANCELLED with deposit_forfeited_cents == 500, i.e. 2 x deposit_cents"
            - "Payment.${m1_id}.status == FORFEITED with refundable_remaining_cents == 0"
            - "Route.${r1_id}.posture == ACTIVE only after the clock's re-derivation sees zero pooled exposure, so the posture hop is caused by the forfeiture hop rather than by the cancellation request"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: priority_conflict_regulatory_posture_over_exposure_cap
        grounds:
          - validations[priority=13]
          - validations[priority=14]
          - errors.ERR_ROUTE_RESTRICTED
          - errors.ERR_GUARANTEE_EXPOSURE_EXCEEDED
        distinguishing_aspect: |
          A single activation request violates the business_safety posture gate and the business_fiscal
          exposure cap, and the response must be ERR_ROUTE_RESTRICTED at priority 13 rather than
          ERR_GUARANTEE_EXPOSURE_EXCEEDED at priority 14.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 sits in RESTRICTED and already carries reserved_exposure_cents 48000 against a 50000 ceiling, so the freeze F1 pending activation would breach the cap if the posture gate were skipped."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/risk-pools"
              payload: { region: "WEST", pool_code: "WEST-RP-1" }
              as: RiskAnalyst
              captures: { pool_id: $.data.id }
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, max_guarantee_exposure_cents: 50000, disclosure_headline: "Fare products are optional and separate from the ticket" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id, r1_version: $.data.version }
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id, i1_version: $.data.version }
            - call: "POST /fare/itineraries/${i1_id}/price-freezes"
              payload: { deposit_cents: 5000, disclosure_version: 1, disclosure_acknowledged: true, expected_itinerary_version: "${i1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_id: $.data.id, f1_version: $.data.version }
            - call: "POST /fare/routes/${r1_id}/posture-transitions"
              payload: { to_posture: "RESTRICTED", posture_reason_code: "REGIONAL_POOL_BREACH", expected_route_version: "${r1_version}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fare/price-freezes/${f1_id}/activations"
