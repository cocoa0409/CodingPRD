            - call: "POST /plm/part-revisions/${ce1r_id}/submit-review"
              payload: {}
              as: Designer
            - call: "POST /plm/change-requests"
              payload: { title: "ce1", affected_part_id: "${ce1_id}", reason_code: "DESIGN_DEFECT" }
              as: Designer
              captures: { ce1_ecr: $.data.id }
            - call: "POST /plm/change-requests/${ce1_ecr}/submit"
              payload: {}
              as: Designer
            - call: "POST /plm/change-requests/${ce1_ecr}/approve"
              payload: {}
              as: ChangeAdmin
            - call: "POST /plm/change-orders"
              payload: { change_request_id: "${ce1_ecr}", effectivity_date: "2026-01-02T00:00:00Z", required_approvals: 1 }
              as: ChangeAdmin
              as_user_id: "ca1"
              captures: { ce1_eco: $.data.id }
            - call: "POST /plm/change-orders/${ce1_eco}/affected-items"
              payload: { part_revision_id: "${ce1r_id}" }
              as: ChangeAdmin
              as_user_id: "ca1"
            - call: "POST /plm/change-orders/${ce1_eco}/approval-tasks"
              payload: { assignee_user_id: "ap1" }
              as: ChangeAdmin
              as_user_id: "ca1"
              captures: { ce1_t: $.data.id }
            - call: "POST /plm/change-orders/${ce1_eco}/submit-for-approval"
              payload: {}
              as: ChangeAdmin
              as_user_id: "ca1"
            - call: "POST /plm/approval-tasks/${ce1_t}/approve"
              payload: {}
              as: Approver
              as_user_id: "ap1"
