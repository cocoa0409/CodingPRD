            - "with two ACTIVE sanctions Community.${alpha_id}.applying_sanction_count == 2 and enforcement_tier == 2"
            - "after a third sanction applying_sanction_count == 3 and enforcement_tier == 3"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: bulk_reinstatement_has_no_partial_success_semantics
        claim_type: Bulk action
        grounds:
          - endpoints.POST_/api/community-administration/sanction-reinstatements
          - errors[ERR_ACTIVE_SANCTION_CONFLICT]
          - state_machines.AccountSanction.LIFTED_to_ACTIVE
        distinguishing_aspect: "The reinstatement endpoint takes one sanction per request and is all-or-nothing: a request naming a sanction that is already ACTIVE changes nothing, and no portion of the call is applied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community holding one ACTIVE sanction and one LIFTED sanction for the same account."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
            - call: "POST /api/community-administration/account-sanctions"
              payload: { account_id: "u-mixed", community_id: "${alpha_id}", decision_outcome: "WARNING_ISSUED" }
              as: PlatformAdmin
              captures:
                san_active: $.data.id
            - call: "POST /api/community-administration/account-sanctions"
              payload: { account_id: "u-mixed", community_id: "${alpha_id}", decision_outcome: "BAN_ISSUED" }
              as: PlatformAdmin
              captures:
                san_liftable: $.data.id
            - call: "POST /api/accounts/u-mixed/appeals"
              payload: { sanction_id: "${san_liftable}", ground_code: "ANALYSIS_ERROR", new_evidence_url: null, sanction_misapplication_present: false }
              as: PlatformAdmin
              captures:
                appeal_mixed: $.data.id
            - call: "POST /api/accounts/u-mixed/appeals/${appeal_mixed}/submit"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/accounts/u-mixed/appeals/${appeal_mixed}/decide"
              payload: { decision: "GRANT" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/community-administration/sanction-reinstatements"
              payload: { sanction_id: "${san_active}" }
              as: PlatformAdmin
              captures:
                error_id: $.data.error_id
          assert:
            - "the request returns 409 with error_id == ERR_ACTIVE_SANCTION_CONFLICT"
            - "AccountSanction.${san_active}.status == ACTIVE and sanitized_on_utc == null"
            - "AccountSanction.${san_liftable}.status == LIFTED and sanitized_on_utc != null"
            - "GET /api/accounts/u-mixed/sanctions?status=ACTIVE returns exactly 1 row"

      - name: decision_read_reports_every_derived_field
        claim_type: Computed read
        grounds:
          - endpoints.GET_/api/communities/{id}/content-decisions/{decisionId}
          - entities.ContentDecision.fields.effective_enforcement_tier
          - entities.ContentDecision.fields.community_safety_override
          - entities.ContentDecision.fields.audit_log_ref
        distinguishing_aspect: "The decision read surfaces the derived fields rather than the raw inputs: a ban recorded with band 0 exposes tier 5 with both the override flag and the cross-power flag set and a non-null audit reference distinct from the id."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community with an ACTIVE top moderator and one OPEN backlog item."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
            - call: "POST /api/communities/${alpha_id}/automated-detection-backlog-items"
              payload: { source_type: "POST", source_id: "src-a", subject_account_id: "u-target", signal_severity_band: 5, detection_confidence: 0.90, overlap_ratio: 0.30, published_at_utc: "2026-09-12T00:00:00Z" }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                item_id: $.data.id
          trigger:
            - call: "POST /api/communities/${alpha_id}/content-decisions"
              payload: { auto_detection_backlog_item_id: "${item_id}", decision_outcome: "BAN_ISSUED", decision_confidence: 0.90, dissection_band: 0, precedent_approval_count: 0 }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                dec_id: $.data.id
            - call: "GET /api/communities/${alpha_id}/content-decisions/${dec_id}"
              payload: {}
              as: Moderator
              as_user_id: "mod-alpha"
          assert:
            - "ContentDecision.${dec_id}.effective_enforcement_tier == 5"
            - "ContentDecision.${dec_id}.community_safety_override == true"
            - "ContentDecision.${dec_id}.requires_cross_power_approval == true"
            - "ContentDecision.${dec_id}.overlap_ratio == 0.30"
            - "ContentDecision.${dec_id}.is_account_wide == false"
            - "the read reports a non-null audit_log_ref that is not equal to the id"
            - "GET /api/communities/${alpha_id}/content-decisions returns exactly 1 row"

      - name: conditional_action_requires_cross_power_approval_flag
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/api/community-administration/decision-audits
          - state_machines.ContentDecision.RECORDED_to_AUDITED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "The audit endpoint is conditional on the decision's own requires_cross_power_approval flag, so a tier-4 decision cannot be audited while a tier-5 decision can."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community holding one RECORDED tier-4 decision."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
            - call: "POST /api/communities/${alpha_id}/automated-detection-backlog-items"
              payload: { source_type: "POST", source_id: "src-la", subject_account_id: "u-target", signal_severity_band: 4, detection_confidence: 0.85, overlap_ratio: 0.20, published_at_utc: "2026-09-12T00:00:00Z" }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                item_la: $.data.id
            - call: "POST /api/communities/${alpha_id}/content-decisions"
              payload: { auto_detection_backlog_item_id: "${item_la}", decision_outcome: "LOCK", decision_confidence: 0.85, dissection_band: 1, precedent_approval_count: 0 }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                dec_la: $.data.id
          trigger:
            - call: "POST /api/community-administration/decision-audits"
              payload: { decision_id: "${dec_la}" }
              as: PlatformAdmin
              captures:
                error_id: $.data.error_id
          assert:
            - "ContentDecision.${dec_la}.effective_enforcement_tier == 4"
            - "ContentDecision.${dec_la}.requires_cross_power_approval == false"
            - "the audit returns 409 with error_id == ERR_INVALID_STATE"
            - "ContentDecision.${dec_la}.status == RECORDED"


  - section: errors
