scaffold_corner_design:

  # =========================== entities ===========================
  - section: entities
    instances:
      - name: player_create_defaults_status_active
        claim_type: defaults
        grounds:
          - "entities.Player.fields.status"
        distinguishing_aspect: "A player created with only required inputs starts ACTIVE with version 1 and server-minted id/created_at."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /players", payload: { full_name: "Dee Fault", position_group: "OFFENSE" }, as: EquipmentManager, captures: { p: $.data.id } }
          assert:
            - "Player.${p}.status == ACTIVE"
            - "Player.${p}.version == 1"
            - "Player.${p}.id is a server-minted UUID and created_at is ISO8601 UTC"

      - name: pool_create_computed_availability
        claim_type: computed_fields
        grounds:
          - "entities.InventoryPool.fields.available_quantity"
          - "entities.InventoryPool.fields.reserved_quantity"
        distinguishing_aspect: "Computed pool counters initialize from stock_on_hand: reserved 0, in_laundry 0, available == stock, reorder_blocked false, status ACTIVE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 10, reorder_point: 2, reorder_batch_size: 3 }, as: EquipmentManager, captures: { pool: $.data.id } }
          assert:
            - "InventoryPool.${pool}.reserved_quantity == 0 and in_laundry_quantity == 0"
            - "InventoryPool.${pool}.available_quantity == 10"
            - "InventoryPool.${pool}.reorder_blocked == false and status == ACTIVE"

      - name: gear_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_GEAR_ITEM_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but unknown gear id returns 404 ERR_GEAR_ITEM_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /gear-items/00000000-0000-0000-0000-000000000000", payload: {}, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "http status == 404 and error_id == ERR_GEAR_ITEM_NOT_FOUND"

      - name: kit_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required jersey_number yields ERR_INVALID_REQUEST before any state or business check."
        test_recipe:
          setup: ["player and two pools exist"]
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 5, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { jp: $.data.id } }
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_PANTS", size_code: "34", stock_on_hand: 5, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { pp: $.data.id } }
            - { call: "POST /players", payload: { full_name: "Req One", position_group: "OFFENSE" }, as: EquipmentManager, captures: { p: $.data.id } }
          trigger:
            - { call: "POST /kit-assignments", payload: { player_id: "${p}", season_label: "2026-FALL", jersey_pool_id: "${jp}", pants_pool_id: "${pp}" }, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "http status == 400 and error_id == ERR_INVALID_REQUEST"

      - name: event_create_invalid_kit_enum_returns_400
        claim_type: type_constraints
        grounds:
          - "entities.GameEvent.fields.designated_kit"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "designated_kit outside {HOME, AWAY, ALTERNATE} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /game-events", payload: { season_label: "2026-FALL", opponent_name: "X", kickoff_at: "2026-09-05T15:00:00Z", designated_kit: "THIRD" }, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "http status == 400 and error_id == ERR_INVALID_REQUEST"

      - name: order_expected_delivery_from_lead_time
        claim_type: computed_fields
        grounds:
          - "entities.KitOrder.fields.expected_delivery_on"
        excluded_because:
          difficulty_instance: order_blocked_until_contract_activated
          rationale: "Asserted there as expected_delivery_on == 2026-08-31 (default clock + 30 day lead)."

      - name: job_due_back_and_cert_validity_dates
        claim_type: computed_fields
        grounds:
          - "entities.ReconditioningJob.fields.due_back_on"
          - "entities.ReconditioningJob.fields.certification_valid_until"
        excluded_because:
          difficulty_instance: provider_concurrent_job_capacity_enforced
          rationale: "due_back_on literals 2026-02-19/2026-02-24 asserted there; certification_valid_until asserted in gear_item_issue_recondition_cycle."

      - name: claim_provisional_fee_and_initial_state
        claim_type: initial_state
        grounds:
          - "state_machines.DamageClaim"
          - "entities.DamageClaim.fields.provisional_fee_cents"
        distinguishing_aspect: "A created claim starts REPORTED with provisional_fee_cents from the REPLACEMENT variant and null assessed/final fees."
        test_recipe:
          setup: ["ACTIVE player with an ISSUED HELMET"]
          setup_api_calls:
            - { call: "POST /players", payload: { full_name: "Init One", position_group: "DEFENSE" }, as: EquipmentManager, captures: { p: $.data.id } }
            - { call: "POST /gear-items", payload: { asset_tag: "HLM-901", item_type: "HELMET", size_spec: "HELMET-L", acquired_on: "2025-01-01", certification_expires_on: "2028-01-01T00:00:00Z" }, as: EquipmentManager, captures: { g: $.data.id } }
            - { call: "POST /gear-items/${g}/issue", payload: { player_id: "${p}" }, as: EquipmentManager }
          trigger:
            - { call: "POST /damage-claims", payload: { player_id: "${p}", claim_type: "DAMAGED", base_value_cents: 40000, gear_item_id: "${g}" }, as: EquipmentManager, captures: { c: $.data.id } }
          assert:
            - "DamageClaim.${c}.status == REPORTED"
            - "DamageClaim.${c}.provisional_fee_cents == 40000 (REPLACEMENT variant ignores grade/age)"
            - "DamageClaim.${c}.assessed_fee_cents == null and final_fee_cents == null"

  # =========================== state_machines ===========================
  - section: state_machines
    instances:
      - name: kit_issue_from_issued_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.KitAssignment.RESERVED_to_ISSUED"
          - "errors[ERR_KIT_NOT_RESERVED]"
        distinguishing_aspect: "issue is only valid from RESERVED; an ISSUED kit rejects a second issue with ERR_KIT_NOT_RESERVED."
        test_recipe:
          setup: ["kit ISSUED to an ACTIVE player"]
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 5, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { jp: $.data.id } }
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_PANTS", size_code: "34", stock_on_hand: 5, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { pp: $.data.id } }
            - { call: "POST /players", payload: { full_name: "Tr One", position_group: "OFFENSE" }, as: EquipmentManager, captures: { p: $.data.id } }
            - { call: "POST /kit-assignments", payload: { player_id: "${p}", season_label: "2026-FALL", jersey_number: 41, jersey_pool_id: "${jp}", pants_pool_id: "${pp}" }, as: EquipmentManager, captures: { ka: $.data.id } }
            - { call: "POST /kit-assignments/${ka}/issue", payload: {}, as: EquipmentManager }
          trigger:
            - { call: "POST /kit-assignments/${ka}/issue", payload: {}, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "http status == 409 and error_id == ERR_KIT_NOT_RESERVED"
            - "KitAssignment.${ka}.status remains ISSUED"

      - name: kit_terminal_lockdown_after_return
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.KitAssignment.ISSUED_to_RETURNED"
          - "errors[ERR_KIT_NOT_ISSUED]"
        distinguishing_aspect: "A RETURNED kit is terminal: further issue/return calls are rejected and no pool counters move."
        test_recipe:
          setup: ["kit ISSUED then RETURNED; pool stock restored to 5"]
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 5, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { jp: $.data.id } }
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_PANTS", size_code: "34", stock_on_hand: 5, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { pp: $.data.id } }
            - { call: "POST /players", payload: { full_name: "Term One", position_group: "OFFENSE" }, as: EquipmentManager, captures: { p: $.data.id } }
            - { call: "POST /kit-assignments", payload: { player_id: "${p}", season_label: "2026-FALL", jersey_number: 42, jersey_pool_id: "${jp}", pants_pool_id: "${pp}" }, as: EquipmentManager, captures: { ka: $.data.id } }
            - { call: "POST /kit-assignments/${ka}/issue", payload: {}, as: EquipmentManager }
            - { call: "POST /kit-assignments/${ka}/return", payload: {}, as: EquipmentManager }
          trigger:
            - { call: "POST /kit-assignments/${ka}/return", payload: {}, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "http status == 409 and error_id == ERR_KIT_NOT_ISSUED"
            - "InventoryPool.${jp}.stock_on_hand == 5 (no double restock)"

      - name: order_cancel_from_received_rejected
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.KitOrder.SUBMITTED_to_CANCELLED"
          - "errors[ERR_ORDER_NOT_OPEN]"
        distinguishing_aspect: "A fully RECEIVED order is terminal for cancel: ERR_ORDER_NOT_OPEN; committed units stay counted."
        test_recipe:
          setup: ["ACTIVE contract cap GAME_JERSEY 10; pool stock 2; order qty 2 fully received"]
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 2, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { jp: $.data.id } }
            - { call: "POST /supplier-contracts", payload: { vendor_name: "TERMCO", season_label: "2026-FALL", start_on: "2026-06-01", end_on: "2027-05-31", allocation_caps: [{ garment_type: "GAME_JERSEY", max_units: 10 }], default_lead_time_days: 30 }, as: TeamAdmin, captures: { sc: $.data.id } }
            - { call: "POST /supplier-contracts/${sc}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /kit-orders", payload: { supplier_contract_id: "${sc}", lines: [{ garment_type: "GAME_JERSEY", size_code: "M", quantity: 2, unit_price_cents: 5000 }] }, as: EquipmentManager, captures: { ord: $.data.id } }
            - { call: "POST /kit-orders/${ord}/receive", payload: { received_lines: [{ garment_type: "GAME_JERSEY", size_code: "M", received_quantity: 2 }] }, as: EquipmentManager }
          trigger:
            - { call: "POST /kit-orders/${ord}/cancel", payload: {}, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "http status == 409 and error_id == ERR_ORDER_NOT_OPEN"
            - "KitOrder.${ord}.status remains RECEIVED"
            - "InventoryPool.${jp}.stock_on_hand == 4 (received stock unaffected)"

      - name: job_record_result_after_passed_rejected
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.ReconditioningJob.OUT_to_PASSED"
          - "errors[ERR_JOB_NOT_OPEN]"
        distinguishing_aspect: "record-result on a terminal (PASSED) job is rejected with ERR_JOB_NOT_OPEN."
        test_recipe:
          setup: ["job OUT for an IN_STOCK helmet"]
          setup_api_calls:
            - { call: "POST /gear-items", payload: { asset_tag: "HLM-902", item_type: "HELMET", size_spec: "HELMET-L", acquired_on: "2025-01-01", certification_expires_on: "2028-01-01T00:00:00Z" }, as: EquipmentManager, captures: { g: $.data.id } }
            - { call: "POST /reconditioning-jobs", payload: { item_id: "${g}", provider_name: "RCOA", sent_on: "2026-08-01" }, as: EquipmentManager, captures: { j: $.data.id } }
            - { call: "POST /reconditioning-jobs/${j}/record-result", payload: { outcome: "PASSED", result_grade: "A" }, as: EquipmentManager }
          trigger:
            - { call: "POST /reconditioning-jobs/${j}/record-result", payload: { outcome: "PASSED", result_grade: "A" }, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "http status == 409 and error_id == ERR_JOB_NOT_OPEN"

      - name: event_complete_from_scheduled_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.GameEvent.KIT_LOCKED_to_COMPLETED"
          - "errors[ERR_EVENT_NOT_LOCKED]"
        distinguishing_aspect: "complete requires KIT_LOCKED; from SCHEDULED it fails with ERR_EVENT_NOT_LOCKED."
        test_recipe:
          setup: ["event SCHEDULED with empty checklist"]
          setup_api_calls:
            - { call: "POST /game-events", payload: { season_label: "2026-FALL", opponent_name: "A", kickoff_at: "2026-09-05T15:00:00Z", designated_kit: "HOME" }, as: EquipmentManager, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /game-events/${ev}/complete", payload: { laundry_load: [] }, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "http status == 409 and error_id == ERR_EVENT_NOT_LOCKED"
            - "GameEvent.${ev}.status remains SCHEDULED"

      - name: laundry_advance_from_not_started_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.GameEvent"
          - "errors[ERR_LAUNDRY_INVALID_TRANSITION]"
        distinguishing_aspect: "laundry-advance is invalid while laundry_status == NOT_STARTED (event not yet completed with a load)."
        test_recipe:
          setup: ["event SCHEDULED (laundry NOT_STARTED)"]
          setup_api_calls:
            - { call: "POST /game-events", payload: { season_label: "2026-FALL", opponent_name: "A", kickoff_at: "2026-09-05T15:00:00Z", designated_kit: "HOME" }, as: EquipmentManager, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /game-events/${ev}/laundry-advance", payload: {}, as: LaundryVendor, captures: { err: $.data.error_id } }
          assert:
            - "http status == 409 and error_id == ERR_LAUNDRY_INVALID_TRANSITION"

      - name: claim_settle_from_reported_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.DamageClaim.ASSESSED_to_SETTLED"
          - "errors[ERR_CLAIM_NOT_ASSESSED]"
        distinguishing_aspect: "settle requires ASSESSED; from REPORTED it fails with ERR_CLAIM_NOT_ASSESSED."
        test_recipe:
          setup: ["claim REPORTED on an issued gear item"]
          setup_api_calls:
            - { call: "POST /players", payload: { full_name: "Pre One", position_group: "OFFENSE" }, as: EquipmentManager, captures: { p: $.data.id } }
            - { call: "POST /gear-items", payload: { asset_tag: "HLM-903", item_type: "HELMET", size_spec: "HELMET-L", acquired_on: "2025-01-01", certification_expires_on: "2028-01-01T00:00:00Z" }, as: EquipmentManager, captures: { g: $.data.id } }
            - { call: "POST /gear-items/${g}/issue", payload: { player_id: "${p}" }, as: EquipmentManager }
            - { call: "POST /damage-claims", payload: { player_id: "${p}", claim_type: "DAMAGED", base_value_cents: 10000, gear_item_id: "${g}" }, as: EquipmentManager, captures: { c: $.data.id } }
          trigger:
            - { call: "POST /damage-claims/${c}/settle", payload: {}, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "http status == 409 and error_id == ERR_CLAIM_NOT_ASSESSED"
            - "DamageClaim.${c}.status remains REPORTED"

      - name: disposition_execute_from_proposed_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.DispositionCase.APPROVED_to_EXECUTED"
          - "errors[ERR_DISPOSITION_NOT_APPROVED]"
        distinguishing_aspect: "execute requires APPROVED; from PROPOSED it fails with ERR_DISPOSITION_NOT_APPROVED."
        test_recipe:
          setup: ["pool exists; disposition case PROPOSED"]
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "SOCKS", size_code: "L", stock_on_hand: 3, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager }
            - { call: "POST /disposition-cases", payload: { season_label: "2026-FALL", garment_type: "SOCKS", method: "DISCARD" }, as: EquipmentManager, captures: { dc: $.data.id } }
          trigger:
            - { call: "POST /disposition-cases/${dc}/execute", payload: {}, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "http status == 409 and error_id == ERR_DISPOSITION_NOT_APPROVED"
            - "DispositionCase.${dc}.status remains PROPOSED"

      - name: player_invalid_status_transition_rejected
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.Player"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A RELEASED player is terminal: PATCH back to ACTIVE is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["player created (ACTIVE) then released (no issued kits)"]
          setup_api_calls:
            - { call: "POST /players", payload: { full_name: "Rel One", position_group: "OFFENSE" }, as: EquipmentManager, captures: { p: $.data.id } }
            - { call: "PATCH /players/${p}", payload: { status: "RELEASED" }, as: EquipmentManager }
          trigger:
            - { call: "PATCH /players/${p}", payload: { status: "ACTIVE" }, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "http status == 409 and error_id == ERR_INVALID_STATE"
            - "Player.${p}.status remains RELEASED"

      - name: gear_issue_from_issued_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.GearItem.IN_STOCK_to_ISSUED"
          - "errors[ERR_GEAR_NOT_IN_STOCK]"
        distinguishing_aspect: "issue requires IN_STOCK; an already-ISSUED item rejects issue to another player with ERR_GEAR_NOT_IN_STOCK."
        test_recipe:
          setup: ["two ACTIVE players; one helmet ISSUED to player 1"]
          setup_api_calls:
            - { call: "POST /players", payload: { full_name: "G One", position_group: "OFFENSE" }, as: EquipmentManager, captures: { p1: $.data.id } }
            - { call: "POST /players", payload: { full_name: "G Two", position_group: "DEFENSE" }, as: EquipmentManager, captures: { p2: $.data.id } }
            - { call: "POST /gear-items", payload: { asset_tag: "HLM-904", item_type: "HELMET", size_spec: "HELMET-L", acquired_on: "2025-01-01", certification_expires_on: "2028-01-01T00:00:00Z" }, as: EquipmentManager, captures: { g: $.data.id } }
            - { call: "POST /gear-items/${g}/issue", payload: { player_id: "${p1}" }, as: EquipmentManager }
          trigger:
            - { call: "POST /gear-items/${g}/issue", payload: { player_id: "${p2}" }, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "http status == 409 and error_id == ERR_GEAR_NOT_IN_STOCK"
            - "GearItem.${g}.current_holder_id == ${p1}"

      - name: gear_return_from_in_stock_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.GearItem.ISSUED_to_IN_STOCK"
          - "errors[ERR_GEAR_NOT_ISSUED]"
        distinguishing_aspect: "return requires ISSUED; an IN_STOCK item rejects return with ERR_GEAR_NOT_ISSUED."
        test_recipe:
          setup: ["one IN_STOCK knee brace"]
          setup_api_calls:
            - { call: "POST /gear-items", payload: { asset_tag: "KBR-901", item_type: "KNEE_BRACE", size_spec: "KNEE-M", acquired_on: "2025-01-01" }, as: EquipmentManager, captures: { g: $.data.id } }
          trigger:
            - { call: "POST /gear-items/${g}/return", payload: {}, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "http status == 409 and error_id == ERR_GEAR_NOT_ISSUED"

      - name: claim_assess_twice_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.DamageClaim.REPORTED_to_ASSESSED"
          - "errors[ERR_CLAIM_NOT_REPORTED]"
        distinguishing_aspect: "assess requires REPORTED; a second assess on an ASSESSED claim fails with ERR_CLAIM_NOT_REPORTED."
        test_recipe:
          setup: ["claim ASSESSED"]
          setup_api_calls:
            - { call: "POST /players", payload: { full_name: "Asmt One", position_group: "OFFENSE" }, as: EquipmentManager, captures: { p: $.data.id } }
            - { call: "POST /gear-items", payload: { asset_tag: "HLM-905", item_type: "HELMET", size_spec: "HELMET-L", acquired_on: "2025-01-01", certification_expires_on: "2028-01-01T00:00:00Z" }, as: EquipmentManager, captures: { g: $.data.id } }
            - { call: "POST /gear-items/${g}/issue", payload: { player_id: "${p}" }, as: EquipmentManager }
            - { call: "POST /damage-claims", payload: { player_id: "${p}", claim_type: "DAMAGED", base_value_cents: 10000, gear_item_id: "${g}" }, as: EquipmentManager, captures: { c: $.data.id } }
            - { call: "POST /damage-claims/${c}/assess", payload: { condition_grade: "B" }, as: EquipmentManager }
          trigger:
            - { call: "POST /damage-claims/${c}/assess", payload: { condition_grade: "C" }, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "http status == 409 and error_id == ERR_CLAIM_NOT_REPORTED"
            - "DamageClaim.${c}.assessed_fee_cents unchanged (grade B value 5600: 10000 x 0.80 x 0.70, age 577 days at default clock)"

      - name: disposition_approve_twice_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.DispositionCase.PROPOSED_to_APPROVED"
          - "errors[ERR_DISPOSITION_NOT_PROPOSED]"
        distinguishing_aspect: "approve requires PROPOSED; a second approve fails with ERR_DISPOSITION_NOT_PROPOSED."
        test_recipe:
          setup: ["pool exists; case APPROVED"]
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "SOCKS", size_code: "M", stock_on_hand: 2, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager }
            - { call: "POST /disposition-cases", payload: { season_label: "2026-FALL", garment_type: "SOCKS", method: "DONATE" }, as: EquipmentManager, captures: { dc: $.data.id } }
            - { call: "POST /disposition-cases/${dc}/approve", payload: {}, as: TeamAdmin }
          trigger:
            - { call: "POST /disposition-cases/${dc}/approve", payload: {}, as: TeamAdmin, captures: { err: $.data.error_id } }
          assert:
            - "http status == 409 and error_id == ERR_DISPOSITION_NOT_PROPOSED"

      - name: event_lock_kit_twice_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.GameEvent.SCHEDULED_to_KIT_LOCKED"
          - "errors[ERR_EVENT_NOT_SCHEDULED]"
        distinguishing_aspect: "lock-kit requires SCHEDULED; a second lock fails with ERR_EVENT_NOT_SCHEDULED."
        test_recipe:
          setup: ["event KIT_LOCKED"]
          setup_api_calls:
            - { call: "POST /game-events", payload: { season_label: "2026-FALL", opponent_name: "A", kickoff_at: "2026-09-05T15:00:00Z", designated_kit: "HOME" }, as: EquipmentManager, captures: { ev: $.data.id } }
            - { call: "POST /game-events/${ev}/lock-kit", payload: {}, as: EquipmentManager }
          trigger:
            - { call: "POST /game-events/${ev}/lock-kit", payload: {}, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "http status == 409 and error_id == ERR_EVENT_NOT_SCHEDULED"

      - name: gear_cycle_cyclic_shape
        claim_type: invalid_transition
        grounds:
          - "state_machines.GearItem"
        excluded_because:
          difficulty_instance: gear_item_issue_recondition_cycle
          rationale: "Cycle traversal and re-entry asserted in the difficulty instance."

      - name: claim_reopen_cyclic_shape
        claim_type: invalid_transition
        grounds:
          - "state_machines.DamageClaim"
        excluded_because:
          difficulty_instance: damage_claim_assess_reopen_cycle
          rationale: "ASSESSED -> REPORTED -> ASSESSED loop asserted in the difficulty instance."

  # =========================== calculations ===========================
  - section: calculations
    instances:
      - name: pool_availability_excludes_reserved_units
        claim_type: correct_result
        grounds:
          - "calculations.pool_availability_reconciliation"
        distinguishing_aspect: "available_quantity subtracts reserved units: stock 10 with two RESERVED kits yields reserved 2 and available 8."
        test_recipe:
          setup: ["jersey pool stock 10 point 0; pants pool stock 10; two ACTIVE players"]
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 10, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { jp: $.data.id } }
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_PANTS", size_code: "34", stock_on_hand: 10, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { pp: $.data.id } }
            - { call: "POST /players", payload: { full_name: "Av One", position_group: "OFFENSE" }, as: EquipmentManager, captures: { p1: $.data.id } }
            - { call: "POST /players", payload: { full_name: "Av Two", position_group: "DEFENSE" }, as: EquipmentManager, captures: { p2: $.data.id } }
            - { call: "POST /kit-assignments", payload: { player_id: "${p1}", season_label: "2026-FALL", jersey_number: 51, jersey_pool_id: "${jp}", pants_pool_id: "${pp}" }, as: EquipmentManager }
            - { call: "POST /kit-assignments", payload: { player_id: "${p2}", season_label: "2026-FALL", jersey_number: 52, jersey_pool_id: "${jp}", pants_pool_id: "${pp}" }, as: EquipmentManager }
          trigger:
            - { call: "GET /inventory-pools/${jp}", payload: {}, as: EquipmentManager }
          assert:
            - "InventoryPool.${jp}.stock_on_hand == 10"
            - "InventoryPool.${jp}.reserved_quantity == 2"
            - "InventoryPool.${jp}.available_quantity == 8"

      - name: order_total_rebate_applied_after_subtotal
        claim_type: constants_applied
        grounds:
          - "calculations.order_total_cents"
        distinguishing_aspect: "Contract rebate applies to the summed subtotal: one line 2000 x 10 = 20000 with rebate 10% yields total 18000."
        test_recipe:
          setup: ["ACTIVE contract with rebate 0.10, cap GAME_JERSEY 100; pool GAME_JERSEY/L"]
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "L", stock_on_hand: 50, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager }
            - { call: "POST /supplier-contracts", payload: { vendor_name: "REBATECO", season_label: "2026-FALL", start_on: "2026-06-01", end_on: "2027-05-31", allocation_caps: [{ garment_type: "GAME_JERSEY", max_units: 100 }], default_lead_time_days: 30, contract_rebate_pct: 0.10 }, as: TeamAdmin, captures: { sc: $.data.id } }
            - { call: "POST /supplier-contracts/${sc}/activate", payload: {}, as: TeamAdmin }
          trigger:
            - { call: "POST /kit-orders", payload: { supplier_contract_id: "${sc}", lines: [{ garment_type: "GAME_JERSEY", size_code: "L", quantity: 10, unit_price_cents: 2000 }] }, as: EquipmentManager, captures: { ord: $.data.id } }
          assert:
            - "KitOrder.${ord}.subtotal_cents == 20000"
            - "KitOrder.${ord}.total_cents == 18000 (20000 x (1 - 0.10))"

      - name: alternate_kit_count_excludes_cancelled
        claim_type: input_set_filtering
        grounds:
          - "calculations.alternate_kit_rotation_count"
          - "state_machines.GameEvent.SCHEDULED_to_CANCELLED"
        distinguishing_aspect: "Cancelled events drop out of the rotation count: after 3 ALTERNATE creations and 1 cancellation, a 4th ALTERNATE is allowed again."
        test_recipe:
          setup: ["season 2026-FALL"]
          setup_api_calls: []
          trigger:
            - { call: "POST /game-events", payload: { season_label: "2026-FALL", opponent_name: "A", kickoff_at: "2026-09-05T15:00:00Z", designated_kit: "ALTERNATE" }, as: EquipmentManager }
            - { call: "POST /game-events", payload: { season_label: "2026-FALL", opponent_name: "B", kickoff_at: "2026-09-12T15:00:00Z", designated_kit: "ALTERNATE" }, as: EquipmentManager }
            - { call: "POST /game-events", payload: { season_label: "2026-FALL", opponent_name: "C", kickoff_at: "2026-09-19T15:00:00Z", designated_kit: "ALTERNATE" }, as: EquipmentManager, captures: { e3: $.data.id } }
            - { call: "POST /game-events/${e3}/cancel", payload: {}, as: EquipmentManager }
            - { call: "POST /game-events", payload: { season_label: "2026-FALL", opponent_name: "D", kickoff_at: "2026-09-26T15:00:00Z", designated_kit: "ALTERNATE" }, as: EquipmentManager, captures: { e4: $.data.id } }
          assert:
            - "GameEvent.${e4}.status == SCHEDULED (count dropped to 2 after cancel, so the 4th designation is allowed)"
            - "GameEvent.${e3}.status == CANCELLED"

      - name: certification_expiry_boundary_exactly_now_rejected
        claim_type: precision
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_GEAR_CERTIFICATION_EXPIRED]"
        distinguishing_aspect: "Strict > comparison against the default clock: certification expiring exactly at 2026-08-01T00:00:00Z fails; one second later succeeds."
        test_recipe:
          setup: ["ACTIVE player; two IN_STOCK helmets, one cert exactly at the default clock, one one second after"]
          setup_api_calls:
            - { call: "POST /players", payload: { full_name: "Cert One", position_group: "OFFENSE" }, as: EquipmentManager, captures: { p: $.data.id } }
            - { call: "POST /gear-items", payload: { asset_tag: "HLM-906", item_type: "HELMET", size_spec: "HELMET-L", acquired_on: "2025-01-01", certification_expires_on: "2026-08-01T00:00:00Z" }, as: EquipmentManager, captures: { g_bad: $.data.id } }
            - { call: "POST /gear-items", payload: { asset_tag: "HLM-907", item_type: "HELMET", size_spec: "HELMET-L", acquired_on: "2025-01-01", certification_expires_on: "2026-08-01T00:00:01Z" }, as: EquipmentManager, captures: { g_ok: $.data.id } }
          trigger:
            - { call: "POST /gear-items/${g_bad}/issue", payload: { player_id: "${p}" }, as: EquipmentManager, captures: { err: $.data.error_id } }
            - { call: "POST /gear-items/${g_ok}/issue", payload: { player_id: "${p}" }, as: EquipmentManager }
          assert:
            - "first issue rejected with error_id == ERR_GEAR_CERTIFICATION_EXPIRED (expiry == now is not strictly greater)"
            - "second issue succeeds: GearItem.${g_ok}.status == ISSUED"

      - name: disposition_memorabilia_proceeds_totals
        claim_type: correct_result
        grounds:
          - "calculations.disposition_execution_totals"
          - "state_machines.DispositionCase.APPROVED_to_EXECUTED"
        distinguishing_aspect: "MEMORABILIA_SALE execution aggregates across sizes: pools M(4) + L(6) yield units_disposed 10 and proceeds 15000 at 1500 per unit; both pools end CLOSED with stock 0."
        test_recipe:
          setup: ["two GAME_JERSEY pools (M stock 4, L stock 6) for season 2026-FALL"]
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 4, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { pm: $.data.id } }
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "L", stock_on_hand: 6, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { pl: $.data.id } }
            - { call: "POST /disposition-cases", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", method: "MEMORABILIA_SALE", unit_price_cents: 1500 }, as: EquipmentManager, captures: { dc: $.data.id } }
            - { call: "POST /disposition-cases/${dc}/approve", payload: {}, as: TeamAdmin }
          trigger:
            - { call: "POST /disposition-cases/${dc}/execute", payload: {}, as: EquipmentManager }
            - { call: "GET /inventory-pools/${pm}", payload: {}, as: EquipmentManager }
          assert:
            - "DispositionCase.${dc}.status == EXECUTED"
            - "DispositionCase.${dc}.units_disposed == 10 and proceeds_cents == 15000"
            - "InventoryPool.${pm}.stock_on_hand == 0 and status == CLOSED"

      - name: reorder_dual_variant_quantity
        claim_type: correct_result
        grounds:
          - "calculations.reorder_threshold_check"
        excluded_because:
          difficulty_instance: reorder_quantity_onhand_vs_forward_looking
          rationale: "FORWARD_LOOKING vs ON_HAND_ONLY divergence asserted there (qty 1 vs 5)."

      - name: order_per_line_rounding_order
        claim_type: precision
        grounds:
          - "calculations.order_total_cents"
        excluded_because:
          difficulty_instance: order_total_per_line_rounding_order
          rationale: "Pinned per-line rounding (1891 vs 1890) asserted there."

      - name: pool_conservation_invariant
        claim_type: correct_result
        grounds:
          - "calculations.pool_availability_reconciliation"
        excluded_because:
          difficulty_instance: pool_reserve_issue_return_conservation
          rationale: "Conservation across reserve/issue/return asserted there."

      - name: contract_conservation_invariant
        claim_type: correct_result
        grounds:
          - "calculations.units_committed_reconciliation"
        excluded_because:
          difficulty_instance: contract_commit_cancel_conservation
          rationale: "Commit/cancel conservation asserted there."

  # =========================== validations ===========================
  - section: validations
    instances:
      - name: auth_missing_headers_returns_400
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A request with no X-User-ID/X-User-Role headers fails priority 1 with 400 before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /players/00000000-0000-0000-0000-000000000000", payload: {}, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "http status == 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: jersey_number_taken_then_freed
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_JERSEY_NUMBER_TAKEN]"
          - "state_machines.KitAssignment.RESERVED_to_RELEASED"
        distinguishing_aspect: "(season, number) uniqueness holds among RESERVED/ISSUED kits; releasing the holder frees the number for reuse."
        test_recipe:
          setup: ["jersey/pants pools stock 5 point 0; three ACTIVE players"]
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 5, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { jp: $.data.id } }
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_PANTS", size_code: "34", stock_on_hand: 5, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { pp: $.data.id } }
            - { call: "POST /players", payload: { full_name: "N One", position_group: "OFFENSE" }, as: EquipmentManager, captures: { p1: $.data.id } }
            - { call: "POST /players", payload: { full_name: "N Two", position_group: "DEFENSE" }, as: EquipmentManager, captures: { p2: $.data.id } }
            - { call: "POST /players", payload: { full_name: "N Three", position_group: "OFFENSE" }, as: EquipmentManager, captures: { p3: $.data.id } }
            - { call: "POST /kit-assignments", payload: { player_id: "${p1}", season_label: "2026-FALL", jersey_number: 7, jersey_pool_id: "${jp}", pants_pool_id: "${pp}" }, as: EquipmentManager, captures: { ka1: $.data.id } }
          trigger:
            - { call: "POST /kit-assignments", payload: { player_id: "${p2}", season_label: "2026-FALL", jersey_number: 7, jersey_pool_id: "${jp}", pants_pool_id: "${pp}" }, as: EquipmentManager, captures: { err: $.data.error_id } }
            - { call: "POST /kit-assignments/${ka1}/release", payload: {}, as: EquipmentManager }
            - { call: "POST /kit-assignments", payload: { player_id: "${p3}", season_label: "2026-FALL", jersey_number: 7, jersey_pool_id: "${jp}", pants_pool_id: "${pp}" }, as: EquipmentManager, captures: { ka3: $.data.id } }
          assert:
            - "duplicate number rejected with error_id == ERR_JERSEY_NUMBER_TAKEN (http 409)"
            - "KitAssignment.${ka1}.status == RELEASED"
            - "KitAssignment.${ka3}.status == RESERVED with jersey_number == 7 (freed by release)"

      - name: claim_subject_neither_fk_returns_400
        claim_type: violation_to_error
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_INVALID_CLAIM_SUBJECT]"
        distinguishing_aspect: "A claim with neither kit_assignment_id nor gear_item_id violates the exactly-one-subject schema rule."
        test_recipe:
          setup: ["one ACTIVE player"]
          setup_api_calls:
            - { call: "POST /players", payload: { full_name: "Sub One", position_group: "OFFENSE" }, as: EquipmentManager, captures: { p: $.data.id } }
          trigger:
            - { call: "POST /damage-claims", payload: { player_id: "${p}", claim_type: "LOST", base_value_cents: 10000 }, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "http status == 400 and error_id == ERR_INVALID_CLAIM_SUBJECT"

      - name: claim_player_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_CLAIM_PLAYER_MISMATCH]"
        distinguishing_aspect: "The claim subject must be issued to claim.player_id: a kit issued to P1 cannot be claimed under P2."
        test_recipe:
          setup: ["players P1, P2; kit ISSUED to P1"]
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 5, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { jp: $.data.id } }
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_PANTS", size_code: "34", stock_on_hand: 5, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { pp: $.data.id } }
            - { call: "POST /players", payload: { full_name: "Own One", position_group: "OFFENSE" }, as: EquipmentManager, captures: { p1: $.data.id } }
            - { call: "POST /players", payload: { full_name: "Own Two", position_group: "DEFENSE" }, as: EquipmentManager, captures: { p2: $.data.id } }
            - { call: "POST /kit-assignments", payload: { player_id: "${p1}", season_label: "2026-FALL", jersey_number: 61, jersey_pool_id: "${jp}", pants_pool_id: "${pp}" }, as: EquipmentManager, captures: { ka: $.data.id } }
            - { call: "POST /kit-assignments/${ka}/issue", payload: {}, as: EquipmentManager }
          trigger:
            - { call: "POST /damage-claims", payload: { player_id: "${p2}", claim_type: "LOST", base_value_cents: 12000, kit_assignment_id: "${ka}" }, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "http status == 409 and error_id == ERR_CLAIM_PLAYER_MISMATCH"

      - name: pool_duplicate_key_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_POOL_ALREADY_EXISTS]"
        distinguishing_aspect: "(season_label, garment_type, size_code) uniqueness: second pool with the same key is rejected."
        test_recipe:
          setup: ["one pool (2026-FALL, GAME_JERSEY, M)"]
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 5, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager }
          trigger:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 3, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "http status == 409 and error_id == ERR_POOL_ALREADY_EXISTS"

      - name: gear_duplicate_asset_tag_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_ASSET_TAG_TAKEN]"
        distinguishing_aspect: "asset_tag uniqueness across all gear items."
        test_recipe:
          setup: ["one gear item with asset_tag HLM-908"]
          setup_api_calls:
            - { call: "POST /gear-items", payload: { asset_tag: "HLM-908", item_type: "HELMET", size_spec: "HELMET-L", acquired_on: "2025-01-01", certification_expires_on: "2028-01-01T00:00:00Z" }, as: EquipmentManager }
          trigger:
            - { call: "POST /gear-items", payload: { asset_tag: "HLM-908", item_type: "SHOULDER_PADS", size_spec: "PADS-L", acquired_on: "2025-01-01" }, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "http status == 409 and error_id == ERR_ASSET_TAG_TAKEN"

      - name: receive_exceeds_outstanding_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_RECEIVE_EXCEEDS_OUTSTANDING]"
          - "state_machines.KitOrder.SUBMITTED_to_RECEIVED"
        distinguishing_aspect: "Receiving more than the outstanding line quantity is rejected; receiving exactly the remainder completes the order and restocks the pool."
        test_recipe:
          setup: ["ACTIVE contract cap 10; pool stock 2; order qty 3 SUBMITTED"]
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 2, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { jp: $.data.id } }
            - { call: "POST /supplier-contracts", payload: { vendor_name: "RCVCO", season_label: "2026-FALL", start_on: "2026-06-01", end_on: "2027-05-31", allocation_caps: [{ garment_type: "GAME_JERSEY", max_units: 10 }], default_lead_time_days: 30 }, as: TeamAdmin, captures: { sc: $.data.id } }
            - { call: "POST /supplier-contracts/${sc}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /kit-orders", payload: { supplier_contract_id: "${sc}", lines: [{ garment_type: "GAME_JERSEY", size_code: "M", quantity: 3, unit_price_cents: 5000 }] }, as: EquipmentManager, captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /kit-orders/${ord}/receive", payload: { received_lines: [{ garment_type: "GAME_JERSEY", size_code: "M", received_quantity: 4 }] }, as: EquipmentManager, captures: { err: $.data.error_id } }
            - { call: "POST /kit-orders/${ord}/receive", payload: { received_lines: [{ garment_type: "GAME_JERSEY", size_code: "M", received_quantity: 3 }] }, as: EquipmentManager }
            - { call: "GET /inventory-pools/${jp}", payload: {}, as: EquipmentManager }
          assert:
            - "over-receive rejected with error_id == ERR_RECEIVE_EXCEEDS_OUTSTANDING (http 409)"
            - "exact receive succeeds: KitOrder.${ord}.status == RECEIVED"
            - "InventoryPool.${jp}.stock_on_hand == 5 (2 + 3 received)"

      - name: stock_adjustment_below_commitments_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_STOCK_BELOW_COMMITMENTS]"
          - "concurrency_rules[pool-adjustment-stale-version]"
        distinguishing_aspect: "An adjustment may not set stock below reserved + in_laundry even with a correct OCC version."
        test_recipe:
          setup: ["pool stock 5 with one RESERVED kit (reserved 1)"]
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 5, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { jp: $.data.id } }
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_PANTS", size_code: "34", stock_on_hand: 5, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { pp: $.data.id } }
            - { call: "POST /players", payload: { full_name: "Adj One", position_group: "OFFENSE" }, as: EquipmentManager, captures: { p: $.data.id } }
            - { call: "POST /kit-assignments", payload: { player_id: "${p}", season_label: "2026-FALL", jersey_number: 71, jersey_pool_id: "${jp}", pants_pool_id: "${pp}" }, as: EquipmentManager }
            - { call: "GET /inventory-pools/${jp}", payload: {}, as: EquipmentManager, captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /inventory-pools/${jp}/stock-adjustments", payload: { new_stock_on_hand: 0, expected_pool_version: "${pv}" }, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "http status == 409 and error_id == ERR_STOCK_BELOW_COMMITMENTS (0 < reserved 1)"
            - "InventoryPool.${jp}.stock_on_hand remains 5"

      - name: disposition_scope_empty_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_DISPOSITION_SCOPE_EMPTY]"
          - "state_machines.DispositionCase.APPROVED_to_EXECUTED"
        distinguishing_aspect: "Executing an approved case whose scope matches zero ACTIVE pools fails with ERR_DISPOSITION_SCOPE_EMPTY."
        test_recipe:
          setup: ["no pools for season 2027-FALL; case approved"]
          setup_api_calls:
            - { call: "POST /disposition-cases", payload: { season_label: "2027-FALL", garment_type: "SOCKS", method: "DISCARD" }, as: EquipmentManager, captures: { dc: $.data.id } }
            - { call: "POST /disposition-cases/${dc}/approve", payload: {}, as: TeamAdmin }
          trigger:
            - { call: "POST /disposition-cases/${dc}/execute", payload: {}, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "http status == 409 and error_id == ERR_DISPOSITION_SCOPE_EMPTY"
            - "DispositionCase.${dc}.status remains APPROVED"

      - name: disposition_blocked_by_reserved_pool_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_POOL_HAS_ACTIVE_COMMITMENTS]"
        distinguishing_aspect: "A pool with reserved units blocks disposition execution with ERR_POOL_HAS_ACTIVE_COMMITMENTS."
        test_recipe:
          setup: ["jersey pool stock 4 with one RESERVED kit against it; DONATE case approved"]
          setup_api_calls:
