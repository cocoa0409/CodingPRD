# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3415_domestic_shoe_manufacturing_content_claim_substantiation
#
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# YAML anchors (&k_*) are defined at first textual use and aliased (*k_*)
# later in THIS document; every instance is an independent empty-DB test.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: factory_create_applies_defaults_and_default_logical_clock
        claim_type: Creation
        grounds:
          - entities.Factory
          - endpoints.POST_/footwear/factories
        distinguishing_aspect: "Creating a factory without government_cleared and without any prior clock call yields status ACTIVE, version 1, government_cleared false, created_at/updated_at exactly 2026-09-01T00:00:00Z (the pinned logical-clock default), and both skill-coverage fields at 100.0 (no runs in production -> required headcount 0)."
        test_recipe:
          setup:
            - "Empty database. No clock call is made — the server's logical clock must read its pinned default 2026-09-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - &k_fac
              call: "POST /footwear/factories"
              payload: { factory_name: "Lawrence MA Plant", location_type: "DOMESTIC", weekly_capacity_units: 1000, line_count: 3, labor_rate_cents_per_minute: 50, overhead_cents_per_pair: 600 }
              as: PlatformAdmin
              captures: { f_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Factory.${f_id}.status == ACTIVE and version == 1"
            - "Factory.${f_id}.government_cleared == false (default applied; the field was omitted)"
            - "Factory.${f_id}.created_at == '2026-09-01T00:00:00Z' and updated_at == '2026-09-01T00:00:00Z' — the logical clock default, not wall clock"
            - "Factory.${f_id}.skill_coverage_certified_pct == 100.0 and skill_coverage_pipeline_pct == 100.0"
            - "Factory.${f_id}.id is a UUID with no type prefix"

      - name: model_create_returns_bom_and_null_pricing
        claim_type: Creation
        grounds:
          - entities.ShoeModel
          - endpoints.POST_/footwear/models
        distinguishing_aspect: "A new model echoes its BOM verbatim, starts ACTIVE at version 1, and both computed pricing fields (domestic_unit_cost_cents, domestic_price_cents) are null until a CERTIFIED report exists on a DOMESTIC run — client input cannot set them."
        test_recipe:
          setup:
            - "Logical clock set to 2026-09-01T00:00:00Z. One DOMESTIC factory; one thread component."
          setup_api_calls:
            - &k_clk
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - *k_fac
            - &k_comp_t
              call: "POST /footwear/components"
              payload: { component_name: "Bonded nylon thread", component_type: "THREAD" }
              as: SourcingManager
              captures: { c_t: $.data.id }
          trigger:
            - &k_model_std
              call: "POST /footwear/models"
              payload: { style_code: "MSTD", production_policy: "DUAL_SOURCE", base_price_cents: 5000, import_cost_basis_cents: 2000, bom_lines: [ { component_id: "${c_t}", quantity_per_pair: 1.0, sourcing_requirement: "IMPORT_ALLOWED", planned_unit_cost_cents: 100, planned_is_domestic: false } ], standard_stitching_minutes: 0, standard_lasting_minutes: 0, standard_assembly_minutes: 0 }
              as: SourcingManager
              captures: { m_id: $.data.id }
          assert:
            - "the response status is 201"
            - "ShoeModel.${m_id}.status == ACTIVE and version == 1"
            - "ShoeModel.${m_id}.bom_lines has exactly 1 line with quantity_per_pair 1.0, sourcing_requirement IMPORT_ALLOWED, planned_unit_cost_cents 100, planned_is_domestic false"
            - "ShoeModel.${m_id}.domestic_unit_cost_cents is null and domestic_price_cents is null (no CERTIFIED report on a DOMESTIC run exists)"

      - name: lot_create_initializes_remaining_and_stamps_received_at
        claim_type: System Fields
        grounds:
          - entities.MaterialLot.fields.quantity_remaining
          - entities.MaterialLot.fields.received_at
        distinguishing_aspect: "quantity_remaining is system-initialized to quantity_received and received_at is stamped from the logical clock (2026-09-01T00:00:00Z) — neither is client-settable."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; factory and thread component exist."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_t
          trigger:
            - &k_lot_t
              call: "POST /footwear/lots"
              payload: { component_id: "${c_t}", supplier_name: "Fall River Mills", is_domestic: true, quantity_received: 1000, unit_cost_cents: 100 }
              as: SourcingManager
              captures: { l_t: $.data.id }
          assert:
            - "the response status is 201"
            - "MaterialLot.${l_t}.quantity_remaining == 1000 == quantity_received"
            - "MaterialLot.${l_t}.received_at == '2026-09-01T00:00:00Z'"
            - "MaterialLot.${l_t}.version == 1"

      - name: run_create_starts_planned_with_empty_consumption
        claim_type: Initial State
        grounds:
          - entities.ProductionRun
          - state_machines.ProductionRun
          - endpoints.POST_/footwear/production-runs
        distinguishing_aspect: "A new run starts PLANNED at version 1 with consumed_lots [], null actual minutes and null certified_unit_cost_cents; capacity allocation for its week exists but is untouched (OPEN)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; factory, thread component, lot of 1000, and model MSTD exist; week 2026-W36 allocation (total 100) is OPEN."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_t
            - *k_lot_t
            - *k_model_std
            - &k_alloc
              call: "POST /footwear/capacity-allocations"
              payload: { factory_id: "${f_id}", iso_week: "2026-W36", total_reserved_units: 100 }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
          trigger:
            - &k_run_std
              call: "POST /footwear/production-runs"
              payload: { model_id: "${m_id}", factory_id: "${f_id}", run_type: "STOCK", planned_units: 10, line_index: 1, start_day: "2026-09-07", end_day: "2026-09-11", iso_week: "2026-W36" }
              as: ProductionPlanner
              captures: { r_id: $.data.id }
          assert:
            - "the response status is 201"
            - "ProductionRun.${r_id}.status == PLANNED and version == 1"
            - "ProductionRun.${r_id}.consumed_lots == [] and actual_stitching_minutes / actual_lasting_minutes / actual_assembly_minutes are null"
            - "ProductionRun.${r_id}.certified_unit_cost_cents is null"
            - "CapacityAllocation.${a_id}.status == OPEN with domestic_reserved_units == 0 and import_reserved_units == 100"

      - name: claim_create_starts_draft
        claim_type: Initial State
        grounds:
          - entities.LabelClaim
          - state_machines.LabelClaim
          - endpoints.POST_/footwear/label-claims
        distinguishing_aspect: "A new claim starts DRAFT at version 1 with report_id, substantiated_at and published_at all null."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; factory, component, model MSTD exist."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_t
            - *k_model_std
          trigger:
            - &k_claim_std
              call: "POST /footwear/label-claims"
              payload: { model_id: "${m_id}", claim_type: "MADE_IN_USA" }
              as: ComplianceOfficer
              captures: { cl_id: $.data.id }
          assert:
            - "the response status is 201"
            - "LabelClaim.${cl_id}.status == DRAFT and version == 1"
            - "LabelClaim.${cl_id}.report_id is null; substantiated_at and published_at are null"

      - name: allocation_create_starts_open_with_zero_domestic
        claim_type: Initial State
        grounds:
          - entities.CapacityAllocation
          - state_machines.CapacityAllocation
          - endpoints.POST_/footwear/capacity-allocations
        distinguishing_aspect: "A new allocation starts OPEN with domestic_reserved_units 0 and import_reserved_units == total_reserved_units; only the lock waterfall moves units into the domestic pool."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; factory exists."
          setup_api_calls:
            - *k_clk
            - *k_fac
          trigger:
            - &k_alloc_open
              call: "POST /footwear/capacity-allocations"
              payload: { factory_id: "${f_id}", iso_week: "2026-W37", total_reserved_units: 250 }
              as: PlatformAdmin
              captures: { a2_id: $.data.id }
          assert:
            - "the response status is 201"
            - "CapacityAllocation.${a2_id}.status == OPEN, domestic_reserved_units == 0, import_reserved_units == 250, version == 1"

      - name: get_factory_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/footwear/factories/{id}
          - errors.ERR_FACTORY_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unallocated UUID yields the entity-specific 404 ERR_FACTORY_NOT_FOUND, not a generic 400."
        test_recipe:
          setup:
            - "Empty database (logical clock default)."
          setup_api_calls: []
          trigger:
            - call: "GET /footwear/factories/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and err == ERR_FACTORY_NOT_FOUND"

      - name: models_list_paginates_with_envelope
        claim_type: Listing
        grounds:
          - endpoints.GET_/footwear/models
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three models on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false; no params applies the envelope defaults (limit 10, offset 0)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; factory and thread component exist; three models P1/P2/P3."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_t
            - call: "POST /footwear/models"
              payload: { style_code: "P1", production_policy: "DUAL_SOURCE", base_price_cents: 5000, import_cost_basis_cents: 2000, bom_lines: [ { component_id: "${c_t}", quantity_per_pair: 1.0, sourcing_requirement: "IMPORT_ALLOWED", planned_unit_cost_cents: 100, planned_is_domestic: false } ], standard_stitching_minutes: 0, standard_lasting_minutes: 0, standard_assembly_minutes: 0 }
              as: SourcingManager
            - call: "POST /footwear/models"
              payload: { style_code: "P2", production_policy: "IMPORT_ONLY", base_price_cents: 6000, import_cost_basis_cents: 2500, bom_lines: [ { component_id: "${c_t}", quantity_per_pair: 1.0, sourcing_requirement: "IMPORT_ALLOWED", planned_unit_cost_cents: 100, planned_is_domestic: false } ], standard_stitching_minutes: 0, standard_lasting_minutes: 0, standard_assembly_minutes: 0 }
              as: SourcingManager
            - call: "POST /footwear/models"
              payload: { style_code: "P3", production_policy: "DOMESTIC_ONLY", base_price_cents: 7000, import_cost_basis_cents: 3000, bom_lines: [ { component_id: "${c_t}", quantity_per_pair: 1.0, sourcing_requirement: "DOMESTIC_REQUIRED", planned_unit_cost_cents: 100, planned_is_domestic: true } ], standard_stitching_minutes: 0, standard_lasting_minutes: 0, standard_assembly_minutes: 0 }
              as: SourcingManager
          trigger:
            - call: "GET /footwear/models"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
          assert:
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /footwear/models with limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /footwear/models with no parameters returns 3 rows (defaults limit 10, offset 0)"
            - "GET /footwear/models?production_policy=IMPORT_ONLY returns exactly the P2 row; ?status=ACTIVE returns 3 rows"

      - name: run_create_missing_planned_units_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/footwear/production-runs
          - errors.ERR_INVALID_REQUEST
          - validations[priority=5]
        distinguishing_aspect: "Omitting required planned_units yields 400 ERR_INVALID_REQUEST and no run is created; the error fires even though all referenced entities exist."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; factory, component, lot, model, allocation exist."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_t
            - *k_lot_t
            - *k_model_std
            - *k_alloc
          trigger:
            - call: "POST /footwear/production-runs"
              payload: { model_id: "${m_id}", factory_id: "${f_id}", run_type: "STOCK", line_index: 1, start_day: "2026-09-07", end_day: "2026-09-11", iso_week: "2026-W36" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST"
            - "GET /footwear/production-runs?factory_id=${f_id} returns 0 rows"

      - name: evidence_create_with_two_links_is_rejected
        claim_type: Type Constraints
        grounds:
          - entities.EvidenceDocument.fields.claim_id
          - errors.ERR_DOC_LINK_AMBIGUOUS
          - validations[priority=5]
        distinguishing_aspect: "Exactly-one-link rule: setting both claim_id and material_lot_id (and likewise setting neither) is a 400 ERR_DOC_LINK_AMBIGUOUS — the mutual-exclusion constraint is enforced at creation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; factory, component, lot, model, and a DRAFT claim exist."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_t
            - *k_lot_t
            - *k_model_std
            - *k_claim_std
          trigger:
            - &k_doc_amb
              call: "POST /footwear/evidence-documents"
              payload: { doc_type: "SUPPLIER_ORIGIN_CERT", issuer: "Fall River Mills", valid_from: "2026-08-01", valid_until: "2027-08-31", claim_id: "${cl_id}", material_lot_id: "${l_t}" }
              as: SourcingManager
              as_user_id: "sm-1"
              captures: { err1: $.data.error_id }
            - &k_doc_nolink
              call: "POST /footwear/evidence-documents"
              payload: { doc_type: "COST_BREAKDOWN", issuer: "Fall River Mills", valid_from: "2026-08-01", valid_until: "2027-08-31" }
              as: SourcingManager
              as_user_id: "sm-1"
              captures: { err2: $.data.error_id }
          assert:
            - "both calls return 400; err1 == ERR_DOC_LINK_AMBIGUOUS (two links) and err2 == ERR_DOC_LINK_AMBIGUOUS (zero links)"
            - "GET /footwear/evidence-documents?claim_id=${cl_id} returns 0 rows"

      - name: run_create_domestic_only_model_on_overseas_factory_is_rejected
        claim_type: Conditional validation
        grounds:
          - errors.ERR_POLICY_FORBIDS_IMPORT
          - validations[priority=7]
          - entities.ShoeModel.fields.production_policy
        distinguishing_aspect: "Policy-direction rule fires only for the DOMESTIC_ONLY x OVERSEAS combination: the same model on a DOMESTIC factory is accepted, and a DUAL_SOURCE model on the OVERSEAS factory is accepted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; DOMESTIC factory and OVERSEAS factory exist; DOMESTIC_ONLY model MDOM and DUAL_SOURCE model MSTD exist."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - &k_fac_os
              call: "POST /footwear/factories"
              payload: { factory_name: "Hanoi Partner Plant", location_type: "OVERSEAS", weekly_capacity_units: 2000, line_count: 2, labor_rate_cents_per_minute: 10, overhead_cents_per_pair: 100 }
              as: PlatformAdmin
              captures: { f_os: $.data.id }
            - *k_comp_t
            - &k_model_dom
              call: "POST /footwear/models"
              payload: { style_code: "MDOM", production_policy: "DOMESTIC_ONLY", base_price_cents: 20000, import_cost_basis_cents: 8000, bom_lines: [ { component_id: "${c_t}", quantity_per_pair: 1.0, sourcing_requirement: "DOMESTIC_REQUIRED", planned_unit_cost_cents: 100, planned_is_domestic: true } ], standard_stitching_minutes: 0, standard_lasting_minutes: 0, standard_assembly_minutes: 0 }
              as: SourcingManager
              captures: { m_dom: $.data.id }
            - *k_model_std
          trigger:
            - &k_run_os_bad
              call: "POST /footwear/production-runs"
              payload: { model_id: "${m_dom}", factory_id: "${f_os}", run_type: "STOCK", planned_units: 10, line_index: 1, start_day: "2026-09-07", end_day: "2026-09-11", iso_week: "2026-W36" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
            - &k_run_os_ok
              call: "POST /footwear/production-runs"
              payload: { model_id: "${m_id}", factory_id: "${f_os}", run_type: "STOCK", planned_units: 10, line_index: 1, start_day: "2026-09-07", end_day: "2026-09-11", iso_week: "2026-W36" }
              as: ProductionPlanner
              captures: { r_os: $.data.id }
          assert:
            - "DOMESTIC_ONLY model on OVERSEAS factory: 422 and err == ERR_POLICY_FORBIDS_IMPORT"
            - "DUAL_SOURCE model on the same OVERSEAS factory: 201 and ProductionRun.${r_os}.status == PLANNED"

      - name: government_run_on_uncleared_factory_is_rejected
        claim_type: Conditional validation
        grounds:
          - errors.ERR_GOV_RUN_REQUIRES_CLEARED_DOMESTIC_FACTORY
          - validations[priority=7]
          - entities.Factory.fields.government_cleared
        distinguishing_aspect: "GOVERNMENT runs require BOTH DOMESTIC and government_cleared: an uncleared DOMESTIC factory rejects a GOVERNMENT run (422) while accepting the equivalent STOCK run (201)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; uncleared DOMESTIC factory; DOMESTIC_ONLY model MDOM."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_t
            - *k_model_dom
          trigger:
            - call: "POST /footwear/production-runs"
              payload: { model_id: "${m_dom}", factory_id: "${f_id}", run_type: "GOVERNMENT", planned_units: 10, line_index: 1, start_day: "2026-09-07", end_day: "2026-09-11", iso_week: "2026-W36" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
            - call: "POST /footwear/production-runs"
              payload: { model_id: "${m_dom}", factory_id: "${f_id}", run_type: "STOCK", planned_units: 10, line_index: 1, start_day: "2026-09-07", end_day: "2026-09-11", iso_week: "2026-W36" }
              as: ProductionPlanner
              captures: { r_ok: $.data.id }
          assert:
            - "GOVERNMENT run on uncleared factory: 422 and err == ERR_GOV_RUN_REQUIRES_CLEARED_DOMESTIC_FACTORY"
            - "STOCK run of the same model on the same factory: 201 (the clearance rule is specific to run_type GOVERNMENT)"

      - name: unique_key_collisions_are_rejected
        claim_type: Type Constraints
        grounds:
          - errors.ERR_STYLE_CODE_EXISTS
          - errors.ERR_ALLOCATION_ALREADY_EXISTS
          - errors.ERR_CLAIM_ALREADY_EXISTS
          - errors.ERR_CONTRACT_NUMBER_EXISTS
          - validations[priority=9]
        distinguishing_aspect: "Four distinct uniqueness scopes: style_code globally, (factory_id, iso_week) for allocations, (model_id, claim_type) among non-REVOKED claims, and contract_number globally — each collision returns 409 with its own error id."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; factory, component, model MSTD; week 2026-W36 allocation; DRAFT MADE_IN_USA claim on MSTD; contract G-200."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_t
            - *k_model_std
            - *k_alloc
            - *k_claim_std
            - &k_contract_u
              call: "POST /footwear/gov-contracts"
              payload: { contract_number: "G-200", model_id: "${m_id}", factory_id: "${f_id}", awarded_units: 5, fulfillment_start: "2026-12-01", fulfillment_end: "2026-12-31" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /footwear/models"
              payload: { style_code: "MSTD", production_policy: "DUAL_SOURCE", base_price_cents: 9000, import_cost_basis_cents: 4000, bom_lines: [ { component_id: "${c_t}", quantity_per_pair: 1.0, sourcing_requirement: "IMPORT_ALLOWED", planned_unit_cost_cents: 100, planned_is_domestic: false } ], standard_stitching_minutes: 0, standard_lasting_minutes: 0, standard_assembly_minutes: 0 }
              as: SourcingManager
              captures: { err1: $.data.error_id }
            - call: "POST /footwear/capacity-allocations"
              payload: { factory_id: "${f_id}", iso_week: "2026-W36", total_reserved_units: 50 }
              as: PlatformAdmin
              captures: { err2: $.data.error_id }
            - call: "POST /footwear/label-claims"
              payload: { model_id: "${m_id}", claim_type: "MADE_IN_USA" }
              as: ComplianceOfficer
              captures: { err3: $.data.error_id }
            - call: "POST /footwear/label-claims"
              payload: { model_id: "${m_id}", claim_type: "IMPORTED" }
              as: ComplianceOfficer
              captures: { cl2: $.data.id }
            - call: "POST /footwear/gov-contracts"
              payload: { contract_number: "G-200", model_id: "${m_id}", factory_id: "${f_id}", awarded_units: 5, fulfillment_start: "2027-01-01", fulfillment_end: "2027-01-31" }
              as: PlatformAdmin
              captures: { err4: $.data.error_id }
          assert:
            - "err1 == ERR_STYLE_CODE_EXISTS (409); err2 == ERR_ALLOCATION_ALREADY_EXISTS (409); err3 == ERR_CLAIM_ALREADY_EXISTS (409); err4 == ERR_CONTRACT_NUMBER_EXISTS (409)"
            - "the IMPORTED claim on the same model IS created (201): uniqueness scopes on (model_id, claim_type), not on model alone"

      - name: allocation_total_above_weekly_capacity_is_rejected
        claim_type: Boundary / Edge
        grounds:
          - errors.ERR_TOTAL_EXCEEDS_WEEKLY_CAPACITY
          - entities.CapacityAllocation.fields.total_reserved_units
          - validations[priority=11]
        distinguishing_aspect: "Boundary at factory.weekly_capacity_units: total == 1000 is accepted (inclusive), total == 1001 is rejected with 422 ERR_TOTAL_EXCEEDS_WEEKLY_CAPACITY."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; factory with weekly_capacity_units 1000."
          setup_api_calls:
            - *k_clk
            - *k_fac
          trigger:
            - call: "POST /footwear/capacity-allocations"
              payload: { factory_id: "${f_id}", iso_week: "2026-W38", total_reserved_units: 1000 }
              as: PlatformAdmin
              captures: { a_ok: $.data.id }
            - call: "POST /footwear/capacity-allocations"
              payload: { factory_id: "${f_id}", iso_week: "2026-W39", total_reserved_units: 1001 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "total 1000 == weekly_capacity_units: 201 (CapacityAllocation.${a_ok} created)"
            - "total 1001: 422 and err == ERR_TOTAL_EXCEEDS_WEEKLY_CAPACITY"

      - name: enrollment_for_suspended_worker_is_rejected
        claim_type: Precondition Enforcement
        grounds:
          - errors.ERR_WORKER_NOT_ACTIVE
          - entities.Worker.fields.status
          - endpoints.POST_/footwear/training-enrollments
        distinguishing_aspect: "Cross-entity precondition: training enrollment requires worker.status == ACTIVE; a SUSPENDED worker yields 409 ERR_WORKER_NOT_ACTIVE, and after reinstatement the same enrollment succeeds."
        test_recipe:
          setup:
