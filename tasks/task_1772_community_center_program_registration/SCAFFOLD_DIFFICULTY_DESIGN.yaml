            - { call: "GET /registrations/${rb}", as: ProgramCoordinator, captures: { rb_st: $.data.enrollment_status } }
          assert:
            - "INVARIANT: enrolled_count before drop == 1 AND after drop+promotion == 1 (seat handed off, not destroyed)"
            - "waitlist_count transitions 0 -> 1 (RB waitlists) -> 0 (RB promoted)"
            - "Registration.${ra}.enrollment_status == DROPPED; Registration.${rb}.enrollment_status == ENROLLED"

      - name: cancellation_money_conservation
        grounds:
          - state_machines.ClassSession.PUBLISHED_to_CANCELLED
          - calculations.registration_refund
          - entities.Household.fields.account_credit_cents
        distinguishing_aspect: |
          Conserved quantity: participant money. Session cancellation (ADMIN variant = 100% refund)
          paired with its refund issuance MUST leave total participant outlay at zero: for every
          cancelled registration refund_total_cents == net_paid_cents, each household's credit
          increases by exactly its net_paid, and WAIVED registrations generate no movement at all.
        test_recipe:
          setup:
            - "Season PUBLISHED (budget 100000); session fees 6000/6000, capacity 5, min_enrollment 1, one meeting, PUBLISHED"
            - "H1/P1 registered and PAID 6000 EXTERNAL; H2 with APPROVED 100% scholarship (commitment 6000) registered -> fee 0, payment WAIVED"
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "Fall 2026", start_date: "2026-09-01T00:00:00Z", end_date: "2026-12-15T00:00:00Z", resident_opens_at: "2026-08-10T00:00:00Z", general_opens_at: "2026-08-17T00:00:00Z", registration_closes_at: "2026-09-15T00:00:00Z", scholarship_budget_cents: 100000 }, as: ProgramCoordinator, captures: { sn: $.data.id } }
            - { call: "POST /seasons/${sn}/publish", payload: {}, as: ProgramCoordinator }
            - { call: "POST /programs", payload: { season_id: "${sn}", name: "Woodwork", category: "Arts", min_age: 0, max_age: 120 }, as: ProgramCoordinator, captures: { pg: $.data.id } }
            - { call: "POST /rooms", payload: { name: "Workshop", capacity: 50 }, as: ProgramCoordinator, captures: { rm: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Wood W", email: "ww@x.com" }, as: ProgramCoordinator, captures: { ins: $.data.id } }
            - { call: "POST /class-sessions", payload: { program_id: "${pg}", instructor_id: "${ins}", title: "Woodwork", capacity: 5, min_enrollment: 1, fee_resident_cents: 6000, fee_nonresident_cents: 6000, enrollment_check_at: "2026-09-08T00:00:00Z" }, as: ProgramCoordinator, captures: { ss: $.data.id } }
            - { call: "POST /instructor-contracts", payload: { session_id: "${ss}", instructor_id: "${ins}", revenue_share_bp: 5000, guarantee_min_cents: 0, cancellation_guarantee_cents: 0, settlement_basis: ENROLLMENT_BASIS }, as: ProgramCoordinator, captures: { ct: $.data.id } }
            - { call: "POST /class-meetings", payload: { session_id: "${ss}", room_id: "${rm}", starts_at: "2026-09-20T18:00:00Z", ends_at: "2026-09-20T19:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /instructor-contracts/${ct}/accept", payload: {}, as: Instructor, as_user_id: "${ins}" }
            - { call: "POST /class-sessions/${ss}/publish", payload: {}, as: ProgramCoordinator, captures: { ss_v: $.data.version } }
            - { call: "POST /households", payload: { account_name: "H1" }, as: HouseholdManager, captures: { h1: $.data.id } }
            - { call: "POST /households", payload: { account_name: "H2" }, as: HouseholdManager, captures: { h2: $.data.id } }
            - { call: "POST /participants", payload: { household_id: "${h1}", full_name: "Chip One", birth_date: "1990-01-01T00:00:00Z" }, as: HouseholdManager, as_user_id: "${h1}", captures: { p1: $.data.id } }
            - { call: "POST /participants", payload: { household_id: "${h2}", full_name: "Chip Two", birth_date: "1991-01-01T00:00:00Z" }, as: HouseholdManager, as_user_id: "${h2}", captures: { p2: $.data.id } }
            - { call: "POST /scholarship-applications", payload: { household_id: "${h2}", season_id: "${sn}", household_size: 2, annual_income_cents: 1000000 }, as: HouseholdManager, as_user_id: "${h2}", captures: { ap: $.data.id } }
            - { call: "POST /scholarship-applications/${ap}/start-review", payload: {}, as: ScholarshipReviewer, as_user_id: "rev-1" }
            - { call: "POST /scholarship-applications/${ap}/approve", payload: { approved_pct: 100, estimated_commitment_cents: 6000 }, as: ScholarshipReviewer, as_user_id: "rev-2" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /registrations", payload: { session_id: "${ss}", participant_id: "${p1}", expected_class_session_version: "${ss_v}" }, as: HouseholdManager, as_user_id: "${h1}", captures: { r1: $.data.id } }
            - { call: "POST /registrations/${r1}/payment", payload: { amount_cents: 6000, method: EXTERNAL }, as: HouseholdManager, as_user_id: "${h1}" }
            - { call: "GET /class-sessions/${ss}", as: ProgramCoordinator, captures: { ss_v2: $.data.version } }
            - { call: "POST /registrations", payload: { session_id: "${ss}", participant_id: "${p2}", expected_class_session_version: "${ss_v2}" }, as: HouseholdManager, as_user_id: "${h2}", captures: { r2: $.data.id, r2_fee: $.data.fee_charged_cents, r2_pay: $.data.payment_status } }
          trigger:
            - { call: "POST /class-sessions/${ss}/cancel", payload: {}, as: ProgramCoordinator }
            - { call: "GET /registrations/${r1}", as: FinanceOfficer, captures: { r1_net: $.data.net_paid_cents, r1_ref: $.data.refund_total_cents, r1_pay: $.data.payment_status } }
            - { call: "GET /registrations/${r2}", as: FinanceOfficer, captures: { r2_ref2: $.data.refund_total_cents, r2_pay2: $.data.payment_status, r2_enr2: $.data.enrollment_status } }
            - { call: "GET /households/${h1}", as: FinanceOfficer, captures: { h1_cr: $.data.account_credit_cents } }
            - { call: "GET /households/${h2}", as: FinanceOfficer, captures: { h2_cr: $.data.account_credit_cents } }
          assert:
            - "Registration.${r2} at creation: fee_charged_cents == 0 and payment_status == WAIVED (100% scholarship)"
            - "INVARIANT per registration: r1.refund_total_cents == r1.net_paid_cents == 6000 (100% admin refund)"
            - "INVARIANT household ledger: Household.${h1}.account_credit_cents == 6000 (credit delta == net_paid; outlay back to zero)"
            - "WAIVED registration conserved at zero movement: r2.refund_total_cents == 0, payment_status stays WAIVED, enrollment_status == CANCELLED"
            - "Household.${h2}.account_credit_cents == 0 (no refund for a zero-fee registration)"
            - "r1.payment_status == REFUNDED (6000 < 10000 threshold -> auto-approved)"
