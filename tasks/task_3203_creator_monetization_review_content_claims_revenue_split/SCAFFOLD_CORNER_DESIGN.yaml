        distinguishing_aspect: "With two members on 3 and 2 paid months the first is granted 75 and the second is clamped by the remaining 25, so the run spends exactly 100 rather than 125."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Channel US approved with two ACTIVE memberships."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
