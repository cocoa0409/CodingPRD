      - name: cooling_acceptance_floor_and_thermal_margin_errors
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_AIRFLOW_BELOW_DESIGN] (422, a cooling unit is commissioned with measured_airflow_cfm below 90 percent of design_airflow_cfm)"
          - "errors[ERR_COOLING_MARGIN_EXCEEDED] (422, hall.cooling_margin_kw recomputed with the candidate rack included must be >= 0.00)"
          - "calculations[hall_cooling_model]: per-unit airflow_capacity_kw = round(measured_airflow_cfm * (1 - leak_fraction) * supply_delta_t_f * 1.08 / 3412, 5); capacity = min(nameplate, airflow); thermal_load = sum(design_kw of POWERED/AT_RISK/RELEASED racks) * 0.85"
        distinguishing_aspect: "Two cooling errors on two different endpoints with two different arithmetic bases: commissioning is refused on a raw CFM ratio (2699 of 3000 fails, 2700 passes at exactly the 0.90 floor), while power-on is refused on the airflow-derived capacity, not the nameplate rating — the unit is rated 20.00 kW nameplate yet only delivers 9.74 kW after the 5 percent containment leak, so a 15.00 kW rack (12.75 kW diversified) is refused even though nameplate would cover it. Adding a second identical unit lifts airflow capacity to 19.49 kW and the same power-on then succeeds."
