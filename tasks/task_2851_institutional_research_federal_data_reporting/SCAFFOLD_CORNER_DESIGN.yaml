      - name: corner_federal_definition_is_immutable_and_versioned_by_cycle_code
        claim_type: Immutability
        grounds:
          - entities.FederalDefinition
          - entities.FederalDefinition.fields.required
          - errors[ERR_DUPLICATE_DEFINITION]
          - validations[priority=27]
        distinguishing_aspect: |
          FederalDefinition declares common_fields false, so its create response carries id and
          created_at but no version and no updated_at, and §1.5 exposes no PUT/PATCH/DELETE for
          it: a correction is a new row under a different effective_cycle_code, while repeating
          (definition_code, effective_cycle_code) is ERR_DUPLICATE_DEFINITION.
        test_recipe:
          setup:
            - "Empty definition library."
          setup_api_calls: []
          trigger:
            - call: "POST /ir/federal-definitions"
              payload: { definition_code: "ENR_LEVEL", survey_component: "ENROLLMENT", value_domain: ["UNDERGRAD", "GRADUATE"], unit_of_measure: "code", effective_cycle_code: "IPEDS-2027" }
              as: DataSteward
              captures: { def1: $.data.id }
            - call: "POST /ir/federal-definitions"
              payload: { definition_code: "ENR_LEVEL", survey_component: "ENROLLMENT", value_domain: ["UNDERGRAD", "GRADUATE", "NON_DEGREE"], unit_of_measure: "code", effective_cycle_code: "IPEDS-2028" }
              as: DataSteward
              captures: { def2: $.data.id }
            - call: "POST /ir/federal-definitions"
              payload: { definition_code: "ENR_LEVEL", survey_component: "ENROLLMENT", value_domain: ["UNDERGRAD"], unit_of_measure: "code", effective_cycle_code: "IPEDS-2027" }
              as: DataSteward
              captures: { err: $.data.error_id }
          assert:
            - "FederalDefinition.${def1} response carries id and created_at and carries no version field and no updated_at field"
            - "FederalDefinition.${def1}.required == true (declared default applied when the input is omitted)"
            - "FederalDefinition.${def1}.value_domain == [\"UNDERGRAD\", \"GRADUATE\"]"
            - "FederalDefinition.${def2}.effective_cycle_code == \"IPEDS-2028\" and value_domain has length 3"
            - "Third call: HTTP status == 409 and response.error_id == \"ERR_DUPLICATE_DEFINITION\""
            - "GET /ir/federal-definitions?survey_component=ENROLLMENT -> total_count == 2"
            - "§1.5 declares no PUT, PATCH or DELETE endpoint whose path is /ir/federal-definitions/{definition_id}"

      - name: corner_component_requires_its_parent_cycle_and_a_same_cycle_extract
        claim_type: Parent Relationships
        grounds:
          - entities.SurveyComponent.fields.cycle_id
          - entities.SurveyComponent.fields.frozen_file_id
          - validations[priority=5]
          - errors[ERR_CYCLE_NOT_FOUND]
          - errors[ERR_FROZEN_FILE_NOT_FOUND]
        distinguishing_aspect: |
          An unknown cycle_id gives ERR_CYCLE_NOT_FOUND, and a frozen_file_id that exists but
          belongs to the other cycle gives ERR_FROZEN_FILE_NOT_FOUND (404, not a 409 state
          error) — the extract must hang off the same ReportingCycle as the component.
        test_recipe:
          setup:
            - "Two cycles exist: IPEDS-2027 (CENSUS_LOCKED, ACTIVE ENROLLMENT extract EX-A) and IPEDS-2026 (OPEN, ACTIVE ENROLLMENT extract EX-B)."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
