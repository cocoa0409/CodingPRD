          setup: ["Site (capacity 2, 1 shower, 1 laundry); 2 pumps; diesel price 385; register + OPEN shift; member (plate AAA111, 0 pts); reservation 22:00-06:00 checked in at 22:30; 1 queued shower ticket; stock item low (5 <= 10); clock set 2026-08-12T10:00 then advanced to 22:30"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site E2", parking_total_spaces: 10, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id", site_v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/fuel-prices", payload: { fuel_type: "DIESEL", retail_cents_per_gallon: 385, effective_from: "2026-08-01T00:00:00Z", expected_site_version: "${site_v}" }, as: FuelDeskLead }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 1, fuel_types: ["DIESEL"] }, as: FuelDeskLead, captures: { p1: "$.data.id" } }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 2, fuel_types: ["DIESEL"] }, as: FuelDeskLead }
