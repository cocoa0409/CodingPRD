            - call: "POST /film-sales/films/${film_id}/state"
              payload: { to_status: "IN_MARKET" }
              as: HeadOfSales
            - call: "GET /film-sales/buyers/${buyer_de_id}"
              payload: {}
              as: SalesAgent
              captures: { buyer_v1: $.data.version }
            - call: "POST /film-sales/pre-sale-contracts"
              payload: { film_id: "${film_id}", buyer_id: "${buyer_de_id}", territory_id: "${terr_de_id}", minimum_guarantee_usd: 2000000.00, license_term_months: 24, holdback_days: 60, expected_buyer_version: "${buyer_v1}" }
              as: SalesAgent
