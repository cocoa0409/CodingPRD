      - name: grinding_stage_gates_are_lenient_where_the_polishing_gates_are_not
        claim_type: precondition_enforcement
        grounds:
          - calculations.metrology_acceptance_verdict
          - calculations.metrology_acceptance_verdict.constants.STAGE_FIGURE_MULTIPLIER
          - state_machines.WorkOrder.GRINDING_to_POLISHING
          - state_machines.ProcessRun.AWAITING_METROLOGY_to_REWORK_REQUIRED
        distinguishing_aspect: |
          One and the same measurement — surface_rms_waves 0.2500 with surface_roughness_nm_rms 5.0000 —
          is ACCEPTED at GRINDING (budget 0.025 * 10 == 0.2500, hit exactly, and the roughness gate is
          suppressed outright) and REWORK_REQUIRED at POLISHING (budget 0.0750); and because §1.2 declares
          no REWORK transition out of POLISHING, the rework leaves process_status POLISHING with
          figuring_iteration_count still 0 while the run itself becomes REWORK_REQUIRED.
        test_recipe:
          setup:
            - "A RELEASED design OD-2540-A (aperture 120.0 mm, RMS 0.0400, tolerance budget 0.0800, transmitted-wavefront budget 0.1050, one 0.0375-wave ACTIVE allocation, tolerance_verdict PASS) and a RELEASED lot GL-2540-1 with total_blank_count 20."
            - "One work order WO-2540-1 with element_count 2, so spare_blank_count 1 and reserved_blank_count 3 (lot ledger 17/3/0/0)."
            - "One interferometer IF-2540-1 calibrated at 2026-08-01T00:00:00Z with base_uncertainty_waves 0.0010, so capability_ratio 4 * 0.001000 / 0.0800 == 0.0500 and instrument_status CALIBRATED."
            - "A GRINDING run 08:00-10:00 was started and completed with material_removed_nm 800.0, and a DRAFT report by mt-001 carries surface_rms_waves 0.2500 and surface_roughness_nm_rms 5.0000."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z throughout."
