              as: PlatformAdmin
            - call: "POST /channel-versions/${ver}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channels/${ch}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { publisher_id: "${pub}", channel_id: "${ch}", flight_start: "2026-09-01T00:00:00Z", flight_end: "2026-09-30T00:00:00Z", budget_cents: 50000, targeting_mode: "CONTEXTUAL" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { k: $.data.id }
            - call: "POST /campaigns/${k}/schedule"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
            - call: "POST /campaigns/${k}/start"
              payload: {}
              as: AdOps
            - call: "POST /placement-bookings"
              payload: { campaign_id: "${k}", slot_code: "HOME_ROW_5", window_start: "2026-09-15T09:00:00Z", window_end: "2026-09-15T12:00:00Z" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { b: $.data.id }
            - call: "POST /placement-bookings/${b}/confirm"
              payload: {}
              as: AdOps
