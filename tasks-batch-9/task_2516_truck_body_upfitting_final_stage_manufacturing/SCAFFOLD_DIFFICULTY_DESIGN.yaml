              as: ProductionScheduler
              as_user_id: "ps-1"
              captures: { slot1: "$.data.id" }
            - call: "POST /upfit/build-slots/${slot1}/start"
              payload: {}
              as: InstallTechnician
              as_user_id: "tech-1"
            - call: "POST /upfit/upfit-orders/${uo}/body-install"
              payload: { body_actual_weight_lb: 2100 }
              as: InstallTechnician
              as_user_id: "tech-1"
              captures: { uo_v2: "$.data.version" }
            - call: "POST /upfit/weight-certifications"
              payload: { upfit_order_id: "${uo}", basis: "AS_MEASURED", expected_upfit_order_version: "${uo_v2}" }
              as: UpfitEngineer
              as_user_id: "eng-1"
              captures: { wc_m: "$.data.id" }
            - call: "POST /upfit/weight-certifications/${wc_m}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /upfit/compliance-labels"
              payload: { upfit_order_id: "${uo}", weight_certification_id: "${wc_m}" }
              as: ComplianceOfficer
              as_user_id: "co-2"
              captures: { lbl: "$.data.id" }
            - call: "POST /upfit/build-slots/${slot1}/close"
              payload: {}
              as: InstallTechnician
              as_user_id: "tech-1"
            - call: "POST /upfit/upfit-orders/${uo}/deliver"
              payload: {}
              as: ProductionScheduler
              as_user_id: "ps-1"
            - call: "POST /upfit/warranty-claims"
              payload: { upfit_order_id: "${uo}", claim_number: "WC-3901", failure_system: "CHASSIS_ELECTRICAL", claim_cost_cents: 73333 }
              as: WarrantyAdministrator
              as_user_id: "wa-1"
              captures: { clm: "$.data.id" }
            - call: "POST /upfit/warranty-claims/${clm}/inspect"
              payload: { taint_confirmed: true }
              as: WarrantyAdministrator
              as_user_id: "wa-1"
            - call: "POST /upfit/warranty-claims/${clm}/adjudicate"
              payload: {}
              as: WarrantyAdministrator
              as_user_id: "wa-1"
          trigger:
            - call: "POST /upfit/warranty-claims/${clm}/dispute"
              payload: { reason: "fleet disputes the upfitter share of the harness failure" }
              as: WarrantyAdministrator
              as_user_id: "wa-1"
            - call: "POST /upfit/warranty-claims/${clm}/inspect"
              payload: { taint_confirmed: true }
              as: WarrantyAdministrator
              as_user_id: "wa-1"
            - call: "POST /upfit/warranty-claims/${clm}/adjudicate"
              payload: {}
              as: WarrantyAdministrator
              as_user_id: "wa-1"
          assert:
            - "before the trigger UpfitOrder.${uo}.chassis_liability_cents == 11000, upfitter_liability_cents == 58666 and customer_goodwill_cents == 3667"
            - "after the dispute UpfitOrder.${uo}.chassis_liability_cents == 0"
            - "after the dispute UpfitOrder.${uo}.upfitter_liability_cents == 0"
            - "after the dispute UpfitOrder.${uo}.customer_goodwill_cents == 0"
            - "after the dispute WarrantyClaim.${clm}.chassis_liability_cents == 11000, upfitter_liability_cents == 58666 and customer_goodwill_cents == 3667 — the claim row is untouched"
            - "after the dispute WarrantyClaim.${clm}.status == DISPUTED and dispute_round == 1"
            - "after the re-inspection WarrantyClaim.${clm}.status == INSPECTED and dispute_round == 1"
            - "after the re-adjudication WarrantyClaim.${clm}.status == ADJUDICATED and split_basis == FINAL"
            - "after the re-adjudication UpfitOrder.${uo}.chassis_liability_cents == 11000"
            - "after the re-adjudication UpfitOrder.${uo}.upfitter_liability_cents == 58666"
            - "after the re-adjudication UpfitOrder.${uo}.customer_goodwill_cents == 3667"
            - "WarrantyClaim.${clm}.dispute_round == 1 — the dispute counter increments only on the dispute edge, never on re-inspection or re-adjudication"
            - "at every observation the claim's three cents fields sum to exactly 73333"
