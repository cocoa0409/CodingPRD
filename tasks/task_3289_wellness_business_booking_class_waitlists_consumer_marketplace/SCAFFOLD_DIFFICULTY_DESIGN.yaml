              as: StudioOwner
              as_user_id: "${studio_out_id}"
              captures: { pp_out_id: $.data.id }
            - call: "POST /wellness/payroll-periods"
              payload: { studio_id: "${studio_in_id}", period_index: 1, start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-30T23:59:59Z" }
              as: StudioOwner
              as_user_id: "${studio_in_id}"
              captures: { pp_in_id: $.data.id }
            - call: "POST /wellness/class-templates"
              payload: { studio_id: "${studio_out_id}", name: "Reformer Flow 50", duration_minutes: 50, base_price_cents: 4000, default_capacity: 2, credit_cost: 1, is_off_peak: true, buffer_minutes: 15 }
              as: StudioOwner
              as_user_id: "${studio_out_id}"
              captures: { tpl_out_id: $.data.id }
            - call: "POST /wellness/class-templates"
              payload: { studio_id: "${studio_in_id}", name: "Reformer Flow 50", duration_minutes: 50, base_price_cents: 4000, default_capacity: 2, credit_cost: 1, is_off_peak: true, buffer_minutes: 15 }
              as: StudioOwner
              as_user_id: "${studio_in_id}"
              captures: { tpl_in_id: $.data.id }
            - call: "POST /wellness/staff-members"
              payload: { studio_id: "${studio_out_id}", full_name: "Ivy Chen", staff_role: "INSTRUCTOR", primary_class_template_id: "${tpl_out_id}", substitute_class_template_ids: ["${tpl_out_id}"], commission_rate_bps: 0 }
              as: StudioOwner
