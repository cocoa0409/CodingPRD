              payload: { cashier_id: "${emp}" }
              as: StoreManager
              as_user_id: ${store}
              captures: { shift: $.data.id }
            - call: "POST /v1/register-shifts/${shift}/scan"
              payload: { items_count: 500 }
              as: Cashier
              as_user_id: ${emp}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:30:00Z" }
              as: OperationsAdmin
          trigger:
            - call: "POST /v1/register-shifts/${shift}/close"
              as: StoreManager
              as_user_id: ${store}
              captures: { rate: $.data.final_scan_rate, comp: $.data.compliance }
          assert:
            - "final_scan_rate == 1000.0 exactly (500*3600/1800)"
            - "compliance == COMPLIANT at the exact threshold (>= boundary)"

  # =====================================================================
  # Rule 7: cross_entity_state_dependency — different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: evaluate_requires_all_panels_scored
        grounds:
          - state_machines.SupplierTender.CLOSED_to_EVALUATING
          - errors[ERR_PANEL_INCOMPLETE]
        distinguishing_aspect: |
          Entity pair SupplierTender -> BlindQualityPanel: evaluate is rejected
          with ERR_PANEL_INCOMPLETE while any bid's panel is still SCHEDULED;
          after scoring it, the same evaluate succeeds.
        test_recipe:
          setup:
            - "Tender CLOSED with two bids; panel A SCORED, panel B still SCHEDULED"
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup A", contact_email: "a@x.com" }
              as: ProcurementLead
              captures: { sup_a: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup B", contact_email: "b@x.com" }
              as: ProcurementLead
              captures: { sup_b: $.data.id }
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-1", name: "Prod One", kind: "CORE", shelf_ready_packaging: true, barcode_count: 2, unit_cost_cents: 200, price_cents: 349 }
              as: CategoryManager
              captures: { prod: $.data.id }
            - call: "POST /v1/tenders"
              payload: { product_id: "${prod}", bid_ceiling_cents: 1000 }
              as: ProcurementLead
              captures: { tend: $.data.id }
            - call: "POST /v1/tenders/${tend}/open"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend}/bids"
              payload: { supplier_id: "${sup_a}", unit_cost_cents: 700 }
              as: SupplierRep
              as_user_id: ${sup_a}
              captures: { bid_a: $.data.id }
            - call: "POST /v1/tenders/${tend}/bids"
              payload: { supplier_id: "${sup_b}", unit_cost_cents: 800 }
              as: SupplierRep
              as_user_id: ${sup_b}
              captures: { bid_b: $.data.id }
            - call: "POST /v1/bids/${bid_a}/panels"
              payload: { sample_code: "BLIND-A1" }
              as: QualityAssuranceLead
              captures: { pan_a: $.data.id }
            - call: "POST /v1/panels/${pan_a}/score"
              payload: { score: 80 }
              as: QualityAssuranceLead
            - call: "POST /v1/bids/${bid_b}/panels"
              payload: { sample_code: "BLIND-B1" }
              as: QualityAssuranceLead
              captures: { pan_b: $.data.id }
            - call: "POST /v1/tenders/${tend}/close"
              as: ProcurementLead
          trigger:
            - call: "POST /v1/tenders/${tend}/evaluate"
              as: ProcurementLead
              captures: { err: $.data.error_id }
            - call: "POST /v1/panels/${pan_b}/score"
              payload: { score: 70 }
              as: QualityAssuranceLead
            - call: "POST /v1/tenders/${tend}/evaluate"
              as: ProcurementLead
              captures: { ok_status: $.data.status }
          assert:
            - "first evaluate rejected: error_id == ERR_PANEL_INCOMPLETE, HTTP 409 (panel B SCHEDULED)"
            - "after scoring panel B: evaluate succeeds, SupplierTender.status == EVALUATING"

      - name: finds_activation_requires_product_active
        grounds:
          - state_machines.FindsBuy.ALLOCATED_to_ON_SALE
          - errors[ERR_PRODUCT_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair FindsBuy -> Product (different pair than
          SupplierTender -> BlindQualityPanel): activating an allocated buy whose
          product is still PROPOSED fails with ERR_PRODUCT_NOT_ACTIVE; after the
          tender award activates the product, the same activation succeeds.
        test_recipe:
          setup:
            - "FINDS product PROPOSED; store exists; buy fully allocated; tender for the product EVALUATING with two ELIGIBLE bids"
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup A", contact_email: "a@x.com" }
              as: ProcurementLead
              captures: { sup_a: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup B", contact_email: "b@x.com" }
              as: ProcurementLead
              captures: { sup_b: $.data.id }
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-F1", name: "Find One", kind: "FINDS", shelf_ready_packaging: true, barcode_count: 3, unit_cost_cents: 100, price_cents: 199 }
              as: CategoryManager
              captures: { prod: $.data.id }
            - call: "POST /v1/tenders"
              payload: { product_id: "${prod}", bid_ceiling_cents: 1000 }
              as: ProcurementLead
              captures: { tend: $.data.id }
            - call: "POST /v1/tenders/${tend}/open"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend}/bids"
              payload: { supplier_id: "${sup_a}", unit_cost_cents: 700 }
              as: SupplierRep
              as_user_id: ${sup_a}
              captures: { bid_a: $.data.id }
            - call: "POST /v1/tenders/${tend}/bids"
              payload: { supplier_id: "${sup_b}", unit_cost_cents: 800 }
              as: SupplierRep
              as_user_id: ${sup_b}
              captures: { bid_b: $.data.id }
            - call: "POST /v1/bids/${bid_a}/panels"
              payload: { sample_code: "BLIND-A1" }
              as: QualityAssuranceLead
              captures: { pan_a: $.data.id }
            - call: "POST /v1/panels/${pan_a}/score"
              payload: { score: 80 }
              as: QualityAssuranceLead
            - call: "POST /v1/bids/${bid_b}/panels"
              payload: { sample_code: "BLIND-B1" }
              as: QualityAssuranceLead
              captures: { pan_b: $.data.id }
            - call: "POST /v1/panels/${pan_b}/score"
              payload: { score: 70 }
              as: QualityAssuranceLead
            - call: "POST /v1/tenders/${tend}/close"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend}/evaluate"
              as: ProcurementLead
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store: $.data.id }
            - call: "POST /v1/finds-buys"
              payload: { product_id: "${prod}", week_start_date: "2026-09-07", week_end_date: "2026-09-13", total_quantity: 5 }
              as: CategoryManager
              captures: { buy: $.data.id, buy_v: $.data.version }
            - call: "POST /v1/finds-buys/${buy}/allocations"
              payload: { expected_finds_buy_version: "${buy_v}" }
              as: CategoryManager
          trigger:
            - call: "POST /v1/finds-buys/${buy}/activate"
              as: CategoryManager
              captures: { err: $.data.error_id }
            - call: "POST /v1/tenders/${tend}/award"
              payload: { primary_bid_id: "${bid_a}", secondary_bid_id: "${bid_b}" }
              as: ProcurementLead
            - call: "POST /v1/finds-buys/${buy}/activate"
              as: CategoryManager
              captures: { ok_status: $.data.status }
          assert:
            - "first activate rejected: error_id == ERR_PRODUCT_NOT_ACTIVE, HTTP 409"
            - "after award activates the product: activate succeeds, FindsBuy.status == ON_SALE"

  # =====================================================================
  # Rule 8: resource_temporal_overlap — different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: labor_window_half_open_overlap
        grounds:
          - validations[priority=7]
          - errors[ERR_WINDOW_OVERLAP]
          - entities.LaborWindow.fields.aisle_zone
        distinguishing_aspect: |
          Half-open [start, end) semantics on the LaborWindow resource scoped by
          (store, aisle_zone): 07:00-09:00 overlaps existing 06:00-08:00 in Z1
          (conflict), but 08:00-10:00 touching at the boundary is allowed.
        test_recipe:
          setup:
            - "Store S1 with existing window Z1 2026-09-07T06:00-08:00 PLANNED"
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store: $.data.id }
            - call: "POST /v1/stores/${store}/labor-windows"
              payload: { aisle_zone: "Z1", role: "STOCKER", starts_at: "2026-09-07T06:00:00Z", ends_at: "2026-09-07T08:00:00Z" }
              as: StoreManager
              as_user_id: ${store}
          trigger:
            - call: "POST /v1/stores/${store}/labor-windows"
              payload: { aisle_zone: "Z1", role: "STOCKER", starts_at: "2026-09-07T07:00:00Z", ends_at: "2026-09-07T09:00:00Z" }
              as: StoreManager
              as_user_id: ${store}
              captures: { err: $.data.error_id }
            - call: "POST /v1/stores/${store}/labor-windows"
              payload: { aisle_zone: "Z1", role: "STOCKER", starts_at: "2026-09-07T08:00:00Z", ends_at: "2026-09-07T10:00:00Z" }
              as: StoreManager
              as_user_id: ${store}
              captures: { ok_id: $.data.id }
            - call: "POST /v1/stores/${store}/labor-windows"
              payload: { aisle_zone: "Z2", role: "STOCKER", starts_at: "2026-09-07T07:00:00Z", ends_at: "2026-09-07T09:00:00Z" }
              as: StoreManager
              as_user_id: ${store}
              captures: { ok_id2: $.data.id }
          assert:
            - "overlapping window rejected: error_id == ERR_WINDOW_OVERLAP, HTTP 409"
            - "touching window (08:00 == prior end) accepted under half-open semantics"
            - "same time on different zone Z2 accepted (scope is per store+zone)"

      - name: finds_sale_window_inclusive_overlap_and_gap
        grounds:
          - state_machines.FindsBuy.ALLOCATED_to_ON_SALE
          - errors[ERR_SALE_WINDOW_CONFLICT]
          - errors[ERR_CLEARANCE_GAP_VIOLATION]
        distinguishing_aspect: |
          Different interval semantics on a different resource (store's
          FindsAllocation sale windows): day-granularity INCLUSIVE windows —
