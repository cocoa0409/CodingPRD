  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: invariant_donation_pair_conserves_every_donor_cent
        grounds:
          - calculations.fundraising_split_at_commitment
          - entities.ResearchFund.fields.research_balance_cents
          - entities.ResearchFund.fields.patient_support_balance_cents
          - entities.ResearchFund.fields.fundraising_raised_cents
        distinguishing_aspect: "A forward donation paired with its compensating reversal must leave the net donation total, and therefore the sum of the two derived pools, exactly where it was: 320000000 cents before and after."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; fund SJ-FY26 with 400000000 cents raised, 80000000 federal, allocation 0.4."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /programs/research-funds"
              payload: { fund_code: "SJ-FY26", fiscal_year: 2026, fundraising_raised_cents: 400000000, research_allocation_pct: 0.4, federal_grant_cents: 80000000 }
              as: PlatformAdmin
              captures: { fund_id: $.data.id }
          trigger:
            - call: "POST /programs/research-funds/${fund_id}/donations"
              payload: { amount_cents: 25000000, is_federal_grant: false }
              as: PlatformAdmin
              captures: { research_after_add: $.data.research_balance_cents }
            - call: "POST /programs/research-funds/${fund_id}/donations"
              payload: { amount_cents: -25000000, is_federal_grant: false }
              as: PlatformAdmin
              captures: { research_after_reverse: $.data.research_balance_cents }
          assert:
            - "ResearchFund.${fund_id}.fundraising_raised_cents == 400000000 after the reversal"
            - "ResearchFund.${fund_id}.research_balance_cents == 160000000 after the reversal"
            - "ResearchFund.${fund_id}.patient_support_balance_cents == 160000000 after the reversal"
            - "ResearchFund.${fund_id}.research_balance_cents + ResearchFund.${fund_id}.patient_support_balance_cents == 320000000, which equals fundraising_raised_cents - federal_grant_cents"
            - "the invariant holds across the pair even though research_balance_cents read 170000000 immediately after the forward donation"

      - name: invariant_travel_pair_conserves_the_family_support_pool
        grounds:
          - calculations.final_family_day_charge
          - calculations.protocol_research_day_accrual
