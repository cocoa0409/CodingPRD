  - rule_id: priority_pair_validation_conflict
    instances:

      - name: finalize_suspended_practice_state_error_beats_unsettled_batches_fiscal_error
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors.ERR_PRACTICE_NOT_AFFILIATED
          - errors.ERR_UNSETTLED_BATCHES_EXIST
        distinguishing_aspect: |
          Pair: state (priority 6) vs business_fiscal (priority 11). The finalize
          request violates BOTH — practice is SUSPENDED and a batch is still
          POSTED — and must surface ERR_PRACTICE_NOT_AFFILIATED, proving the
          state check runs before the fiscal check.
        test_recipe:
          setup:
            - "Base affiliated setup with EFFECTIVE enrollment; batch posted in 2026-09 and deliberately left POSTED; statement created; practice then SUSPENDED."
          setup_api_calls:
            - *k_clock
            - *k_group
            - *k_group_act
            - *k_market
            - *k_wave
            - *k_wave_lock
            - *k_wave_start
            - *k_practice
            - *k_agreement
            - *k_agreement_exec
            - *k_provider
            - *k_contract
            - *k_rate
            - *k_vote
            - *k_vote_cast
            - *k_contract_act
            - *k_enrollment
            - *k_enroll_approve
            - *k_wave_complete
            - *k_batch_a
            - *k_statement
            - call: "POST /api/practices/${prac_id}/suspend"
              payload: {}
              as: GroupAdministrator
              as_user_id: "ga-root"
          trigger:
            - call: "POST /api/distribution-statements/${stmt_id}/finalize"
              payload: {}
              as: GroupFinancialController
              as_user_id: "gfc-lena"
              captures: { err_finalize: $.data.error_id }
          assert:
            - "err_finalize == ERR_PRACTICE_NOT_AFFILIATED with http 409"
            - "err_finalize != ERR_UNSETTLED_BATCHES_EXIST — fiscal check is never reached"
            - "DistributionStatement.${stmt_id}.status remains PROVISIONAL_ISSUED"

      - name: wave_create_malformed_window_temporal_error_beats_overlap_constraint_error
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors.ERR_INVALID_CUTOVER_WINDOW
          - errors.ERR_WAVE_WINDOW_OVERLAP
        distinguishing_aspect: |
          Pair: business_temporal (priority 8) vs business_constraint (priority 9)
          — a different category pair than the state-vs-fiscal conflict. The new
          wave's window is both internally malformed (end < start) and overlapping
          an existing wave; the temporal error must win.
        test_recipe:
          setup:
            - "Group OPERATING; market exists; one wave already occupies [2026-08-01, 2026-12-31) half-open."
          setup_api_calls:
            - *k_clock
            - *k_group
            - *k_group_act
            - *k_market
            - *k_wave
          trigger:
            - call: "POST /api/implementation-waves"
              payload: { market_id: "${mkt_id}", wave_code: "W2-BAD", cutover_start_date: "2026-10-01", cutover_end_date: "2026-09-01" }
              as: GroupAdministrator
              as_user_id: "ga-root"
              captures: { err_wave: $.data.error_id }
          assert:
            - "err_wave == ERR_INVALID_CUTOVER_WINDOW with http 422"
            - "err_wave != ERR_WAVE_WINDOW_OVERLAP — the malformed window is reported before overlap is even evaluated"
            - "GET /api/implementation-waves?market_id=${mkt_id} returns exactly 1 row"

