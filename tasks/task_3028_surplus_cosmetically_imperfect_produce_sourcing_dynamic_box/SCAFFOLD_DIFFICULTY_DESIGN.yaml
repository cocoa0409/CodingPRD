    - entities.SupplyLot.fields.quantity_available
    - endpoints.POST_/produce/box-orders/{id}/crash-out
    distinguishing_aspect: 'The compensating pair build-then-crash-out must return the lot''s on-hand units to the pre-build value exactly: quantity_available is a conserved count, and after the pair it equals the value before the build even though the order''s own status is terminal.'
