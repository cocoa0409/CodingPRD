              as: ConformanceReviewer
              as_user_id: "reviewer-1"
              captures: { refusal: $.data.error_id }
          assert:
            - "${coverage_a} == 45.00"
            - "${state_a} == COMPLETE"
            - "${coverage_b} == 43.88"
            - "${state_b} == IN_TESTING"
            - "${attested_state} == ATTESTED"
            - "Second attest returns HTTP 409 and ${refusal} == ERR_COMPONENT_ASSESSMENT_INCOMPLETE"
            - "CriterionAssessment.${ca_b_id}.attestation_state == DRAFT"
            - "Product.${prod_id}.components_complete_count == 1"

      - name: publish_at_zero_in_scope_components_then_at_one
        grounds:
          - validations[priority=68]
          - entities.Product.fields.components_in_scope_count
          - state_machines.ConformanceReport.APPROVED_to_PUBLISHED
        distinguishing_aspect: |
          Boundary 2 of 3 is an empty-collection cardinality boundary on a different metric
          (components_in_scope_count 0 versus 1) probed through a different endpoint
          (POST /conformance-reports/{id}/publish): the inventory is non-empty yet fully excluded,
          so only the in-scope count matters, and flipping the count from 0 to 1 flips a 422 into
          a successful publication.
        test_recipe:
          setup:
            - "Standard WCAG_2_2 with no success criteria, so no criterion-level or disability-coverage precondition can bite"
            - "Two components exist, both with in_scope false, so components_in_scope_count is 0 while the inventory holds two rows"
            - "A report has been opened, submitted and approved with an empty pinned evidence list"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Internal Admin Console", component_type: "DESKTOP_APP", in_scope: false, assessment_scope: "EXCLUDED", applicable_criteria_count: 40, user_reach_pct: 5 }
              as: AccessibilityLead
              captures: { comp_out_1_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Batch Import CLI", component_type: "DESKTOP_APP", in_scope: false, assessment_scope: "EXCLUDED", applicable_criteria_count: 40, user_reach_pct: 2 }
              as: AccessibilityLead
              captures: { comp_out_2_id: $.data.id }
            - call: "GET /products/${prod_id}"
              payload: {}
              as: AccessibilityLead
              captures: { prod_v1: $.data.version, count_zero: $.data.components_in_scope_count }
            - call: "POST /conformance-reports"
              payload: { product_id: "${prod_id}", standard_id: "${std_id}", report_title: "ACR Insight Portal 7.0", expected_product_version: "${prod_v1}" }
              as: AccessibilityLead
              captures: { rep_id: $.data.id }
            - call: "POST /conformance-reports/${rep_id}/submit"
              payload: { submission_note: "Shell report for the excluded inventory" }
              as: ProductOwner
              as_user_id: "${prod_id}"
            - call: "POST /conformance-reports/${rep_id}/approve"
              payload: { approval_note: "Approved with no pinned evidence" }
              as: ConformanceReviewer
              as_user_id: "reviewer-1"
          trigger:
            - call: "POST /conformance-reports/${rep_id}/publish"
              payload: { publication_channel: "CUSTOMER_TRUST_PORTAL" }
              as: AccessibilityLead
              captures: { zero_error: $.data.error_id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_in_id: $.data.id }
            - call: "POST /components/${comp_in_id}/design-review"
              payload: { review_decision: "PASS", review_note: "Acceptance criteria include the AT matrix" }
              as: ConformanceReviewer
              as_user_id: "reviewer-1"
            - call: "POST /conformance-reports/${rep_id}/publish"
              payload: { publication_channel: "CUSTOMER_TRUST_PORTAL" }
              as: AccessibilityLead
              captures: { published_state: $.data.state }
          assert:
            - "${count_zero} == 0"
            - "First publish returns HTTP 422 and ${zero_error} == ERR_NO_IN_SCOPE_COMPONENTS"
            - "ConformanceReport.${rep_id}.state was still APPROVED after the refusal"
            - "Product.${prod_id}.components_in_scope_count == 1 after the in-scope component is added"
            - "${published_state} == PUBLISHED"
            - "ConformanceReport.${rep_id}.pinned_assessment_ids == []"
            - "ConformanceReport.${rep_id}.published_issue_count == 0"

      - name: train_effort_capacity_at_exact_equality_then_one_point_over
        grounds:
          - validations[priority=82]
          - entities.ReleaseTrain.fields.committed_effort_points
          - state_machines.KnownIssue.TRIAGED_to_COMMITTED
        distinguishing_aspect: |
          Boundary 3 of 3 sits on an integer capacity sum rather than a percentage or a collection
          size, and is probed through POST /known-issues/{id}/commit: 0 + 8 <= 8 is admitted at
          exact equality, and the very next point (8 + 1 > 8) is refused, so the rule is proven
          inclusive at the limit.
        test_recipe:
          setup:
            - "Release train 2026.09 with window 2026-09-01..2026-09-30, freeze_days 5 and effort_capacity_points 8"
            - "Two TRIAGED known issues on the same product, one of effort_points 8 and one of effort_points 1, both with target_remediation_date 2026-09-10 (inside the usable window that ends 2026-09-25)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /standards/${std_id}/criteria"
              payload: { criterion_number: "1.1.1", title: "Non-text Content", level: "A", disability_categories: ["VISION", "COGNITIVE"], applies_to_surfaces: ["WEB"] }
              as: AccessibilityLead
              captures: { crit1_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_id: $.data.id }
            - call: "POST /release-trains"
              payload: { name: "Train 2026.09", window_start: "2026-09-01", window_end: "2026-09-30", freeze_days: 5, effort_capacity_points: 8, remediation_budget_cents: 0 }
              as: AccessibilityLead
              captures: { train_id: $.data.id }
            - call: "POST /known-issues"
              payload: { product_id: "${prod_id}", component_id: "${comp_id}", criterion_id: "${crit1_id}", severity: "BLOCKER", summary: "Primary navigation is unreachable by keyboard", effort_points: 8, target_remediation_date: "2026-09-10", publish_intent: "INCLUDED" }
              as: AccessibilityTester
              captures: { iss_big_id: $.data.id }
            - call: "POST /known-issues"
              payload: { product_id: "${prod_id}", component_id: "${comp_id}", criterion_id: "${crit1_id}", severity: "MINOR", summary: "Decorative icons expose redundant alternative text", effort_points: 1, target_remediation_date: "2026-09-10", publish_intent: "INCLUDED" }
              as: AccessibilityTester
              captures: { iss_small_id: $.data.id }
            - call: "POST /known-issues/${iss_big_id}/triage"
              payload: { triage_note: "Reproduced on Windows and macOS" }
              as: AccessibilityLead
            - call: "POST /known-issues/${iss_small_id}/triage"
              payload: { triage_note: "Cosmetic, low reach" }
              as: AccessibilityLead
          trigger:
            - call: "POST /known-issues/${iss_big_id}/commit"
              payload: { release_train_id: "${train_id}" }
              as: AccessibilityLead
              captures: { big_state: $.data.state }
            - call: "POST /known-issues/${iss_small_id}/commit"
              payload: { release_train_id: "${train_id}" }
              as: AccessibilityLead
              captures: { over_error: $.data.error_id }
          assert:
            - "${big_state} == COMMITTED"
            - "ReleaseTrain.${train_id}.committed_effort_points == 8 (exactly equal to effort_capacity_points, which is admitted)"
            - "Second commit returns HTTP 409 and ${over_error} == ERR_TRAIN_CAPACITY_EXCEEDED"
            - "KnownIssue.${iss_small_id}.state == TRIAGED"
            - "KnownIssue.${iss_small_id}.release_train_id is null"
            - "ReleaseTrain.${train_id}.committed_effort_points == 8 (unchanged by the refusal)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: attest_requires_component_complete
        grounds:
          - validations[priority=58]
          - state_machines.CriterionAssessment.DRAFT_to_ATTESTED
          - state_machines.ProductComponent.PLANNED_to_IN_TESTING
          - entities.ProductComponent.fields.assessment_state
        distinguishing_aspect: |
          Dependency 1 of 3 couples CriterionAssessment to ProductComponent: an attestation is
          legal only while the component's assessment_state is COMPLETE. Nothing about the
          assessment row changes between the refusal and the success — only the other entity's
          state moves, driven by completing a run.
        test_recipe:
          setup:
            - "One in-scope component with applicable_criteria_count 40 and no assessment runs at all, so assessment_state is PLANNED and coverage_pct is 0.00"
            - "One DRAFT assessment for criterion 1.1.1 authored by tester-1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
            - call: "POST /standards/${std_id}/criteria"
              payload: { criterion_number: "1.1.1", title: "Non-text Content", level: "A", disability_categories: ["VISION", "COGNITIVE"], applies_to_surfaces: ["WEB"] }
              as: AccessibilityLead
              captures: { crit1_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insight Portal", version_label: "7.0", standard_id: "${std_id}", target_level: "AA", surface_type: "WEB" }
              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_id: $.data.id, planned_state: $.data.assessment_state }
            - call: "GET /components/${comp_id}"
              payload: {}
              as: AccessibilityTester
              captures: { comp_v1: $.data.version }
            - call: "POST /criterion-assessments"
              payload: { component_id: "${comp_id}", criterion_id: "${crit1_id}", support_level: "SUPPORTS", expected_component_version: "${comp_v1}" }
              as: AccessibilityTester
              as_user_id: "tester-1"
              captures: { ca1_id: $.data.id }
            - call: "POST /test-environments"
              payload: { name: "NVDA Bench 1", at_profile: "SCREEN_READER", at_product_name: "NVDA 2026.1", os_platform: "WINDOWS", reconfiguration_buffer_minutes: 30 }
              as: AccessibilityLead
              captures: { env_sr_id: $.data.id }
          trigger:
            - call: "POST /criterion-assessments/${ca1_id}/attest"
              payload: { attestation_note: "Attesting before any testing has happened" }
              as: ConformanceReviewer
              as_user_id: "reviewer-1"
              captures: { blocked: $.data.error_id }
            - call: "POST /assessment-runs"
              payload: { component_id: "${comp_id}", environment_id: "${env_sr_id}", method: "MANUAL", at_profile: "SCREEN_READER", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T12:00:00Z", criteria_exercised: 40, disability_categories_validated: ["VISION", "COGNITIVE"] }
              as: AccessibilityTester
              captures: { run_sr_id: $.data.id }
            - call: "POST /assessment-runs/${run_sr_id}/complete"
              payload: { defects_found: 3 }
              as: AccessibilityTester
            - call: "POST /criterion-assessments/${ca1_id}/attest"
              payload: { attestation_note: "Reproduced with NVDA 2026.1 on Windows" }
              as: ConformanceReviewer
              as_user_id: "reviewer-1"
              captures: { attested_state: $.data.attestation_state }
          assert:
            - "${planned_state} == PLANNED"
            - "First attest returns HTTP 409 and ${blocked} == ERR_COMPONENT_ASSESSMENT_INCOMPLETE"
            - "ProductComponent.${comp_id}.coverage_pct == 45.00 after the run completes"
            - "ProductComponent.${comp_id}.assessment_state == COMPLETE"
            - "${attested_state} == ATTESTED"
            - "CriterionAssessment.${ca1_id}.attested_by_user_id == reviewer-1"
            - "Product.${prod_id}.conformance_index_provisional == 100.00"

      - name: questionnaire_attest_requires_published_report
        grounds:
          - validations[priority=70]
          - state_machines.QuestionnaireResponse.SUBMITTED_to_ATTESTED
          - state_machines.ConformanceReport.APPROVED_to_PUBLISHED
