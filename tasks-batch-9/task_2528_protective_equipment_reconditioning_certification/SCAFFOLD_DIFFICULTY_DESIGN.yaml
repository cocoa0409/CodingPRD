# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2528 — Protective Equipment Reconditioning & Certification
#
# 9 rule_ids x 2 instances = 18 instances.
# Every literal in an `assert:` line was computed against the §1.3 formulas and
# their `constants:` before being written here.
#
# Shared setup facts assumed by every chain below:
#   * the logical clock starts at 2026-08-01T00:00:00Z (see §1.5
#     POST /_clock/set_current_utc); each chain sets it explicitly anyway.
#   * ModelSpec "SF-2026" (anchor *c_model): POLYCARBONATE, max_service_life 10,
#     warranty_years 5, record_retention_years 3, pass_si_max 300.0,
#     repair_si_max 360.0, max_retest_count 3, required_component_codes [SHELL]
#     with SHELL criteria HIGHER_IS_WORSE replace 4.0 / fail 6.0.
#   * a unit identified with manufacture_date 2018-09-15 on age basis
#     MANUFACTURE_DATE has service_age_years 7 -> life_expired false,
#     warranty_coverage OUT_OF_WARRANTY (7 > 5), condemn_required false.
#   * a SHELL inspection measuring 1.50 mm is PASS (1.50 < replace 4.0),
#     which completes required_component_codes and drives DISASSEMBLED->INSPECTED
#     with inspection_verdict_summary CLEAR.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: unit_service_age_manufacture_vs_season_basis_diverge
        grounds:
          - calculations.unit_service_age
          - entities.EquipmentUnit.fields.age_basis
          - entities.EquipmentUnit.fields.service_age_years
          - entities.EquipmentUnit.fields.life_expired
          - entities.EquipmentUnit.fields.condemn_required
          - state_machines.EquipmentUnit.recon_status.RECEIVED_to_IDENTIFIED
        distinguishing_aspect: |
          Two units with the byte-identical manufacture_date 2016-09-15 and the
          same ModelSpec produce service_age_years 9 under MANUFACTURE_DATE
          (floor(3607/365)) and 10 under FIRST_SEASON (2026 - 2016), which puts
          only the second unit at max_service_life_years 10 and therefore flips
          life_expired and condemn_required for that unit alone. The variant
          lives on EquipmentUnit (equipment ageing domain), unlike the second
          instance of this rule which lives on IntakeShipment (money domain).
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z"
            - "one ModelSpec SF-2026 with max_service_life_years 10 and warranty_years 5"
            - "one CustomerAccount with liability_waiver_status ON_FILE"
            - "one STANDARD IntakeShipment in ACCEPTED with counted_unit_count 2 and two registered units, both in recon_status RECEIVED"
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - &c_model
              call: "POST /model-specs"
              payload: { manufacturer: "Riddell", model_code: "SF-2026", standard_code: "ND002", shell_material: "POLYCARBONATE", max_service_life_years: 10, warranty_years: 5, record_retention_years: 3, pass_si_max: 300.0, repair_si_max: 360.0, max_retest_count: 3, reconditionable: true, required_component_codes: ["SHELL"], component_criteria: [{ code: "SHELL", metric: "crack_length_mm", metric_direction: "HIGHER_IS_WORSE", replace_threshold: 4.0, fail_threshold: 6.0, unit: "mm" }] }
              as: PlantManager
              captures: { model_id: $.data.id }
            - &c_acct
              call: "POST /customer-accounts"
              payload: { org_name: "Northside High", org_type: "SCHOOL", sport: "FOOTBALL", contact_email: "ad@northside.example" }
              as: PlantManager
              captures: { acct_id: $.data.id }
            - &c_waiver
              call: "POST /customer-accounts/${acct_id}/liability-acknowledgment"
              payload: { waiver_version: "2026.1", signer_name: "R. Vega" }
              as: IntakeClerk
            - call: "POST /intake-shipments"
              payload: { customer_account_id: "${acct_id}", sport: "FOOTBALL", service_tier: "STANDARD", declared_unit_count: 2, season_start_date: "2026-08-25T00:00:00Z", season_end_date: "2026-11-20T00:00:00Z" }
              as: IntakeClerk
              captures: { ship_id: $.data.id }
            - call: "POST /intake-shipments/${ship_id}/count"
              payload: { counted_unit_count: 2 }
              as: IntakeClerk
            - call: "POST /equipment-units"
              payload: { intake_shipment_id: "${ship_id}", serial_number: "SN-0001", declared_model_code: "SF-2026" }
              as: IntakeClerk
              captures: { u1_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { intake_shipment_id: "${ship_id}", serial_number: "SN-0002", declared_model_code: "SF-2026" }
              as: IntakeClerk
              captures: { u2_id: $.data.id }
            - call: "POST /intake-shipments/${ship_id}/accept"
              payload: { discrepancy_resolution: "MATCHED" }
              as: IntakeClerk
          trigger:
            - call: "POST /equipment-units/${u1_id}/identify"
              payload: { model_spec_id: "${model_id}", manufacture_date: "2016-09-15T00:00:00Z", age_basis: "MANUFACTURE_DATE" }
              as: IntakeClerk
            - call: "POST /equipment-units/${u2_id}/identify"
              payload: { model_spec_id: "${model_id}", manufacture_date: "2016-09-15T00:00:00Z", age_basis: "FIRST_SEASON" }
              as: IntakeClerk
          assert:
            - "EquipmentUnit.${u1_id}.service_age_years == 9"
            - "EquipmentUnit.${u2_id}.service_age_years == 10"
            - "EquipmentUnit.${u1_id}.life_expired == false"
            - "EquipmentUnit.${u2_id}.life_expired == true"
            - "EquipmentUnit.${u1_id}.condemn_required == false"
            - "EquipmentUnit.${u2_id}.condemn_required == true"
            - "EquipmentUnit.${u1_id}.warranty_coverage == OUT_OF_WARRANTY"
            - "EquipmentUnit.${u2_id}.warranty_coverage == OUT_OF_WARRANTY"
            - "EquipmentUnit.${u1_id}.recon_status == IDENTIFIED"
            - "EquipmentUnit.${u2_id}.recon_status == IDENTIFIED"
            - "EquipmentUnit.${u1_id}.manufacture_date == EquipmentUnit.${u2_id}.manufacture_date"

      - name: shipment_settlement_provisional_vs_final_rounding_order_diverge
        grounds:
          - calculations.shipment_settlement_total
          - entities.IntakeShipment.fields.provisional_total_cents
          - entities.IntakeShipment.fields.final_total_cents
          - state_machines.IntakeShipment.status.COUNTED_to_ACCEPTED
          - state_machines.IntakeShipment.status.READY_FOR_RETURN_to_CLOSED
        distinguishing_aspect: |
          Over the identical two-unit billable set of a PRIORITY_RUSH shipment
          (8996 * 1.35 = 12144.60 per line, no extras), the PROVISIONAL variant
          sums the exact lines and rounds once (24289.20 -> gross 24289 ->
          total 21678) while the FINAL variant rounds each line first and then
          sums (12145 + 12145 = gross 24290 -> total 21679); the one-cent
          divergence survives the 12.5% tier discount and the 2% surcharge. The
          variant axis here is rounding order on IntakeShipment money fields,
          not the ageing-basis axis on EquipmentUnit used above.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z"
            - "one PRIORITY_RUSH IntakeShipment with counted_unit_count 2, both units certified, no repairs and no condemnations"
            - "provisional_total_cents already written at accept time over 2 rush lines"
            - "shipment in READY_FOR_RETURN with units_in_process 0 and units_certified 2"
          setup_api_calls:
            - *c_clock
            - *c_model
            - *c_acct
            - *c_waiver
            - call: "POST /intake-shipments"
              payload: { customer_account_id: "${acct_id}", sport: "FOOTBALL", service_tier: "PRIORITY_RUSH", declared_unit_count: 2, season_start_date: "2026-08-25T00:00:00Z", season_end_date: "2026-11-20T00:00:00Z" }
              as: IntakeClerk
              captures: { ship_id: $.data.id }
            - call: "POST /intake-shipments/${ship_id}/count"
              payload: { counted_unit_count: 2 }
              as: IntakeClerk
            - call: "POST /equipment-units"
              payload: { intake_shipment_id: "${ship_id}", serial_number: "SN-0001", declared_model_code: "SF-2026" }
              as: IntakeClerk
              captures: { u1_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { intake_shipment_id: "${ship_id}", serial_number: "SN-0002", declared_model_code: "SF-2026" }
              as: IntakeClerk
              captures: { u2_id: $.data.id }
            - call: "POST /intake-shipments/${ship_id}/accept"
              payload: { discrepancy_resolution: "MATCHED" }
              as: IntakeClerk
            - call: "POST /equipment-units/${u1_id}/identify"
              payload: { model_spec_id: "${model_id}", manufacture_date: "2018-09-15T00:00:00Z", age_basis: "MANUFACTURE_DATE" }
              as: IntakeClerk
            - call: "POST /equipment-units/${u2_id}/identify"
              payload: { model_spec_id: "${model_id}", manufacture_date: "2018-09-15T00:00:00Z", age_basis: "MANUFACTURE_DATE" }
              as: IntakeClerk
            - call: "POST /equipment-units/${u1_id}/disassemble"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /equipment-units/${u1_id}/inspections"
              payload: { component_code: "SHELL", measurement_value: 1.50, measurement_unit: "mm", note: "no crown cracking" }
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /equipment-units/${u2_id}/disassemble"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /equipment-units/${u2_id}/inspections"
              payload: { component_code: "SHELL", measurement_value: 1.50, measurement_unit: "mm", note: "no crown cracking" }
              as: Technician
              as_user_id: "tech-1"
            - &c_bench
              call: "POST /test-benches"
              payload: { bench_code: "RIG-1", test_type: "DROP_IMPACT", daily_session_quota: 6, cooldown_minutes: 45 }
              as: PlantManager
              captures: { bench_id: $.data.id }
            - &c_cal
              call: "POST /test-benches/${bench_id}/calibrate"
              payload: { calibration_valid_until: "2026-12-31T00:00:00Z" }
              as: PlantManager
            - call: "POST /shell-tests"
              payload: { equipment_unit_id: "${u1_id}", test_bench_id: "${bench_id}", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T10:00:00Z", conditioning: "AMBIENT" }
              as: Technician
              as_user_id: "tech-1"
              captures: { t1_id: $.data.id }
            - call: "POST /shell-tests/${t1_id}/record-impacts"
              payload: { peak_g_front: 300, peak_g_side: 300, peak_g_crown: 300 }
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /shell-tests/${t1_id}/determine"
              payload: { determination: "PASS" }
              as: CertifyingInspector
              as_user_id: "insp-1"
            - call: "GET /equipment-units/${u1_id}"
              payload: {}
              as: CertifyingInspector
              as_user_id: "insp-1"
              captures: { u1_v: $.data.version }
            - call: "POST /certification-labels"
              payload: { equipment_unit_id: "${u1_id}", expected_equipment_unit_version: "${u1_v}" }
              as: CertifyingInspector
              as_user_id: "insp-1"
            - call: "POST /shell-tests"
              payload: { equipment_unit_id: "${u2_id}", test_bench_id: "${bench_id}", window_start: "2026-08-01T11:00:00Z", window_end: "2026-08-01T12:00:00Z", conditioning: "AMBIENT" }
              as: Technician
              as_user_id: "tech-1"
              captures: { t2_id: $.data.id }
            - call: "POST /shell-tests/${t2_id}/record-impacts"
              payload: { peak_g_front: 300, peak_g_side: 300, peak_g_crown: 300 }
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /shell-tests/${t2_id}/determine"
              payload: { determination: "PASS" }
              as: CertifyingInspector
              as_user_id: "insp-1"
            - call: "GET /equipment-units/${u2_id}"
              payload: {}
              as: CertifyingInspector
              as_user_id: "insp-1"
              captures: { u2_v: $.data.version }
            - call: "POST /certification-labels"
              payload: { equipment_unit_id: "${u2_id}", expected_equipment_unit_version: "${u2_v}" }
              as: CertifyingInspector
              as_user_id: "insp-1"
          trigger:
            - call: "POST /intake-shipments/${ship_id}/settle"
              payload: {}
              as: PlantManager
          assert:
            - "IntakeShipment.${ship_id}.provisional_total_cents == 21678"
            - "IntakeShipment.${ship_id}.final_total_cents == 21679"
            - "IntakeShipment.${ship_id}.final_total_cents - IntakeShipment.${ship_id}.provisional_total_cents == 1"
            - "IntakeShipment.${ship_id}.settlement_locked == true"
            - "IntakeShipment.${ship_id}.status == CLOSED"
            - "IntakeShipment.${ship_id}.units_certified == 2"
            - "IntakeShipment.${ship_id}.units_in_process == 0"
            - "IntakeShipment.${ship_id}.loaner_required == false"
            - "IntakeShipment.${ship_id}.raw_due_at == 2026-08-12T00:00:00Z"
            - "IntakeShipment.${ship_id}.committed_due_at == 2026-08-12T00:00:00Z"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: severity_index_per_site_cap_applied_before_summation
        grounds:
          - calculations.shell_test_severity_index
          - entities.ShellTest.fields.severity_index
          - entities.ShellTest.fields.computed_result
          - entities.EquipmentUnit.fields.current_si
          - state_machines.ShellTest.status.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          Mode: three independently capped weighted terms. With 400/600/900 g the
          uncapped weighted terms are 200.0 + 180.0 + 180.0 = 560.0, but each
          term saturates at SITE_CONTRIBUTION_CAP 150.0, so severity_index is
          exactly 450.0 — an implementation that caps the sum instead of each
          term, or forgets the cap, cannot produce 450.0.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z"
            - "one unit in recon_status INSPECTED with inspection_verdict_summary CLEAR under ModelSpec SF-2026 (pass_si_max 300.0, repair_si_max 360.0, POLYCARBONATE)"
            - "one calibrated bench with a SCHEDULED shell test on that unit, conditioning AMBIENT"
          setup_api_calls:
            - *c_clock
            - *c_model
            - *c_acct
            - *c_waiver
            - call: "POST /intake-shipments"
              payload: { customer_account_id: "${acct_id}", sport: "FOOTBALL", service_tier: "STANDARD", declared_unit_count: 1, season_start_date: "2026-08-25T00:00:00Z", season_end_date: "2026-11-20T00:00:00Z" }
              as: IntakeClerk
              captures: { ship_id: $.data.id }
            - call: "POST /intake-shipments/${ship_id}/count"
              payload: { counted_unit_count: 1 }
              as: IntakeClerk
            - call: "POST /equipment-units"
              payload: { intake_shipment_id: "${ship_id}", serial_number: "SN-0001", declared_model_code: "SF-2026" }
              as: IntakeClerk
              captures: { u1_id: $.data.id }
            - call: "POST /intake-shipments/${ship_id}/accept"
              payload: { discrepancy_resolution: "MATCHED" }
              as: IntakeClerk
            - call: "POST /equipment-units/${u1_id}/identify"
              payload: { model_spec_id: "${model_id}", manufacture_date: "2018-09-15T00:00:00Z", age_basis: "MANUFACTURE_DATE" }
              as: IntakeClerk
            - call: "POST /equipment-units/${u1_id}/disassemble"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /equipment-units/${u1_id}/inspections"
              payload: { component_code: "SHELL", measurement_value: 1.50, measurement_unit: "mm", note: "no crown cracking" }
              as: Technician
              as_user_id: "tech-1"
            - *c_bench
            - *c_cal
            - call: "POST /shell-tests"
              payload: { equipment_unit_id: "${u1_id}", test_bench_id: "${bench_id}", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T10:00:00Z", conditioning: "AMBIENT" }
              as: Technician
              as_user_id: "tech-1"
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /shell-tests/${t1_id}/record-impacts"
              payload: { peak_g_front: 400, peak_g_side: 600, peak_g_crown: 900 }
              as: Technician
              as_user_id: "tech-1"
          assert:
            - "ShellTest.${t1_id}.severity_index == 450.0"
            - "ShellTest.${t1_id}.computed_result == CONDEMN"
            - "ShellTest.${t1_id}.status == COMPLETED"
            - "EquipmentUnit.${u1_id}.current_si == 450.0"
            - "EquipmentUnit.${u1_id}.recon_status == TESTED"

      - name: settlement_tier_selected_from_gross_then_surcharge_on_net
        grounds:
          - calculations.shipment_settlement_total
          - entities.IntakeShipment.fields.provisional_total_cents
          - entities.IntakeShipment.fields.raw_due_at
          - entities.IntakeShipment.fields.committed_due_at
          - entities.IntakeShipment.fields.loaner_required
          - calculations.turnaround_commitment
          - state_machines.IntakeShipment.status.COUNTED_to_ACCEPTED
        distinguishing_aspect: |
          Mode: chained rate stages where each stage consumes the previous
          stage's output. Two STANDARD lines give gross 17992, which is what
          selects discount rate 0.125 (>= DISCOUNT_TIER_1_FLOOR 10000) -> discount
          2249 -> net 15743; the 2% compliance surcharge then applies to that net
          (315), giving 16058. Applying the surcharge to the gross instead would
          yield 360 and a total of 16103, and a single-line shipment (gross 8996)
          would select rate 0.000 — so the staging order is observable.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z"
            - "one CustomerAccount with liability_waiver_status ON_FILE and open_shipment_count 0"
            - "one STANDARD IntakeShipment in COUNTED with counted_unit_count 2, both units registered, season_start_date 2026-08-25"
          setup_api_calls:
            - *c_clock
            - *c_model
            - *c_acct
            - *c_waiver
            - call: "POST /intake-shipments"
              payload: { customer_account_id: "${acct_id}", sport: "FOOTBALL", service_tier: "STANDARD", declared_unit_count: 2, season_start_date: "2026-08-25T00:00:00Z", season_end_date: "2026-11-20T00:00:00Z" }
              as: IntakeClerk
              captures: { ship_id: $.data.id }
            - call: "POST /intake-shipments/${ship_id}/count"
              payload: { counted_unit_count: 2 }
              as: IntakeClerk
            - call: "POST /equipment-units"
              payload: { intake_shipment_id: "${ship_id}", serial_number: "SN-0001", declared_model_code: "SF-2026" }
              as: IntakeClerk
              captures: { u1_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { intake_shipment_id: "${ship_id}", serial_number: "SN-0002", declared_model_code: "SF-2026" }
              as: IntakeClerk
              captures: { u2_id: $.data.id }
          trigger:
            - call: "POST /intake-shipments/${ship_id}/accept"
              payload: { discrepancy_resolution: "MATCHED" }
              as: IntakeClerk
          assert:
            - "IntakeShipment.${ship_id}.provisional_total_cents == 16058"
            - "IntakeShipment.${ship_id}.final_total_cents == null"
            - "IntakeShipment.${ship_id}.status == ACCEPTED"
            - "IntakeShipment.${ship_id}.units_in_process == 2"
            - "IntakeShipment.${ship_id}.accepted_at == 2026-08-01T00:00:00Z"
            - "IntakeShipment.${ship_id}.raw_due_at == 2026-09-01T00:00:00Z"
            - "IntakeShipment.${ship_id}.committed_due_at == 2026-08-18T00:00:00Z"
            - "IntakeShipment.${ship_id}.loaner_required == true"
            - "CustomerAccount.${acct_id}.open_shipment_count == 1"
            - "CustomerAccount.${acct_id}.loaner_recall_due_at == null"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: unit_recon_and_custody_axes_advance_independently
        grounds:
          - state_machines.EquipmentUnit.recon_status
          - state_machines.EquipmentUnit.custody_status
          - entities.EquipmentUnit.fields.recon_status
          - entities.EquipmentUnit.fields.custody_status
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          Shape: two parallel state dimensions on one entity. stage-return moves
          custody_status AT_PLANT -> STAGED_FOR_RETURN while leaving
          recon_status CERTIFIED untouched; voiding the label then drags
          recon_status CERTIFIED -> REPAIR_PENDING while leaving custody_status
          at STAGED_FOR_RETURN. A single fused status column cannot represent
          the resulting (REPAIR_PENDING, STAGED_FOR_RETURN) combination.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z"
            - "one STANDARD IntakeShipment with counted_unit_count 1, its single unit CERTIFIED with an ACTIVE CertificationLabel, custody_status AT_PLANT"
          setup_api_calls:
            - *c_clock
            - *c_model
            - *c_acct
            - *c_waiver
            - call: "POST /intake-shipments"
              payload: { customer_account_id: "${acct_id}", sport: "FOOTBALL", service_tier: "STANDARD", declared_unit_count: 1, season_start_date: "2026-08-25T00:00:00Z", season_end_date: "2026-11-20T00:00:00Z" }
              as: IntakeClerk
              captures: { ship_id: $.data.id }
            - call: "POST /intake-shipments/${ship_id}/count"
              payload: { counted_unit_count: 1 }
              as: IntakeClerk
            - call: "POST /equipment-units"
              payload: { intake_shipment_id: "${ship_id}", serial_number: "SN-0001", declared_model_code: "SF-2026" }
              as: IntakeClerk
              captures: { u1_id: $.data.id }
            - call: "POST /intake-shipments/${ship_id}/accept"
              payload: { discrepancy_resolution: "MATCHED" }
              as: IntakeClerk
            - call: "POST /equipment-units/${u1_id}/identify"
              payload: { model_spec_id: "${model_id}", manufacture_date: "2018-09-15T00:00:00Z", age_basis: "MANUFACTURE_DATE" }
              as: IntakeClerk
            - call: "POST /equipment-units/${u1_id}/disassemble"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /equipment-units/${u1_id}/inspections"
              payload: { component_code: "SHELL", measurement_value: 1.50, measurement_unit: "mm", note: "no crown cracking" }
              as: Technician
              as_user_id: "tech-1"
            - *c_bench
            - *c_cal
            - call: "POST /shell-tests"
              payload: { equipment_unit_id: "${u1_id}", test_bench_id: "${bench_id}", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T10:00:00Z", conditioning: "AMBIENT" }
              as: Technician
              as_user_id: "tech-1"
              captures: { t1_id: $.data.id }
            - call: "POST /shell-tests/${t1_id}/record-impacts"
