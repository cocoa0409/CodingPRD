# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Electrical Contractor Service & Dispatch — Expert tier
# Breadth probe: every testable §1.1–§1.7 claim NOT already covered by §1.8.
# section: / claim_type: values drawn verbatim from references/claim-extraction-guide.md.
# excluded_because: stubs cite §1.8 instances by name; those have NO test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_customer_returns_201_with_all_fields
        claim_type: Creation
        grounds:
          - entities.Customer
          - 'endpoints."POST /v1/customers"'
        distinguishing_aspect: "POST /v1/customers with full_name, email, service_zip, phone returns 201 and echoes all four inputs plus a server-minted id, created_at, updated_at, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/customers"
              payload: { full_name: "Jane Doe", email: "jane@x.com", service_zip: "12345", phone: "555-1000" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "data.full_name == 'Jane Doe' and data.email == 'jane@x.com' and data.service_zip == '12345' and data.phone == '555-1000'"
            - "data.version == 1 and data.id is a non-empty string"

      - name: get_customer_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - entities.Customer
          - 'endpoints."GET /v1/customers/{customerId}"'
        distinguishing_aspect: "GET /v1/customers/{id} returns the exact customer previously created with matching id and fields."
        test_recipe:
          setup: ["One customer exists."]
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { full_name: "Get Me", email: "getme@x.com", service_zip: "22222", phone: "555" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
          trigger:
            - call: "GET /v1/customers/${cust_id}"
              payload: {}
              as: Dispatcher
          assert:
            - "HTTP status == 200"
            - "data.id == ${cust_id} and data.email == 'getme@x.com'"

      - name: list_customers_paginated_envelope
        claim_type: Listing
        grounds:
          - entities.Customer
          - 'endpoints."GET /v1/customers"'
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /v1/customers returns response_type=array with total_count and has_more present, honoring limit/offset defaults (limit 10, offset 0)."
        test_recipe:
          setup: ["Two customers exist."]
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { full_name: "L1", email: "l1@x.com", service_zip: "30000", phone: "1" }
              as: Dispatcher
            - call: "POST /v1/customers"
              payload: { full_name: "L2", email: "l2@x.com", service_zip: "30001", phone: "2" }
              as: Dispatcher
          trigger:
            - call: "GET /v1/customers"
              payload: { limit: 1, offset: 0 }
              as: Dispatcher
          assert:
            - "HTTP status == 200 and meta.response_type == 'array'"
            - "data array length == 1 and total_count == 2 and has_more == true"

      - name: get_customer_not_found
        claim_type: Not Found
        grounds:
          - entities.Customer
          - 'endpoints."GET /v1/customers/{customerId}"'
          - 'errors[ERR_NOT_FOUND]'
        distinguishing_aspect: "GET /v1/customers/{nonexistent-uuid} returns ERR_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/customers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 and data.error_id == ERR_NOT_FOUND"

      - name: create_customer_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.Customer.fields.email
          - 'validations[priority=5]'
          - 'errors[ERR_INVALID_REQUEST]'
        distinguishing_aspect: "POST /v1/customers omitting required email returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/customers"
              payload: { full_name: "No Email", service_zip: "44444", phone: "9" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422 and data.error_id == ERR_INVALID_REQUEST"

      - name: technician_oncall_default_false
        claim_type: Defaults
        grounds:
          - entities.Technician.fields.on_call
          - 'endpoints."POST /v1/technicians"'
        distinguishing_aspect: "POST /v1/technicians omitting on_call applies the default on_call=false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/technicians"
              payload: { full_name: "Def Tech", license_class: "JOURNEYMAN", service_zone: "120", hourly_rate_cents: 9000 }
              as: Dispatcher
          assert:
            - "HTTP status == 201 and data.on_call == false"

      - name: servicejob_requires_permit_computed_for_panel
        claim_type: Computed Fields
        grounds:
          - entities.ServiceJob.fields.requires_permit
          - 'endpoints."POST /v1/service-jobs"'
        distinguishing_aspect: "Creating a PANEL job computes requires_permit=true; an OUTLET job computes requires_permit=false; any client-supplied requires_permit is ignored."
        test_recipe:
          setup: ["One customer exists."]
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { full_name: "RP Cust", email: "rp@x.com", service_zip: "55555", phone: "5" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /v1/service-jobs"
              payload: { customer_id: "${cust_id}", scope: "PANEL", job_class: "INSTALL" }
              as: Dispatcher
              captures: { job_id: $.data.id }
          assert:
            - "data.requires_permit == true and data.scope == PANEL"
            - "data.status == DRAFT and data.total_due_cents == 0"

      - name: servicejob_membership_snapshot_on_create
        claim_type: Computed Fields
        grounds:
          - entities.ServiceJob.fields.membership_id
          - entities.Membership
          - 'endpoints."POST /v1/service-jobs"'
        distinguishing_aspect: "Creating a job for a customer with an ACTIVE membership snapshots membership_id onto the job; a customer with no membership snapshots null."
        test_recipe:
          setup: ["A customer enrolled ACTIVE in a plan, and a customer with no membership."]
          setup_api_calls:
            - call: "POST /v1/membership-plans"
              payload: { name: "Basic", tier: "BASIC", monthly_fee_cents: 1000, labor_discount_pct: 0.10 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /v1/customers"
              payload: { full_name: "Mem", email: "memsnap@x.com", service_zip: "60000", phone: "6" }
              as: Dispatcher
              captures: { mem_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { customer_id: "${mem_id}", plan_id: "${plan_id}" }
              as: Dispatcher
              captures: { mship_id: $.data.id }
          trigger:
            - call: "POST /v1/service-jobs"
              payload: { customer_id: "${mem_id}", scope: "OUTLET", job_class: "SERVICE" }
              as: Dispatcher
              captures: { job_id: $.data.id }
          assert:
            - "ServiceJob.${job_id}.membership_id == ${mship_id}"

      - name: system_fields_generated_ignored_on_input
        claim_type: System Fields
        grounds:
          - entities.Customer.fields
          - 'endpoints."POST /v1/customers"'
        distinguishing_aspect: "Server mints id/created_at/updated_at/version on create from a valid input-only payload; the returned id is a fresh UUID and version starts at 1 (system fields are not client-controllable)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/customers"
              payload: { full_name: "Sys", email: "sys@x.com", service_zip: "70000", phone: "7" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
          assert:
            - "data.version == 1"
            - "data.created_at is a non-empty ISO-8601 string and data.id is a fresh server-minted UUID"

      - name: invalid_enum_scope_rejected
        claim_type: Type Constraints
        grounds:
          - entities.ServiceJob.fields.scope
          - 'validations[priority=5]'
          - 'errors[ERR_INVALID_REQUEST]'
        distinguishing_aspect: "POST /v1/service-jobs with scope not in {OUTLET,PANEL,EV_CHARGER} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["One customer exists."]
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { full_name: "Enum Cust", email: "enum@x.com", service_zip: "80000", phone: "8" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /v1/service-jobs"
              payload: { customer_id: "${cust_id}", scope: "FURNACE", job_class: "SERVICE" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422 and data.error_id == ERR_INVALID_REQUEST"

      - name: dispatch_window_start_not_before_end_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Dispatch.fields.window_start
          - 'validations[priority=5]'
          - 'errors[ERR_INVALID_REQUEST]'
        distinguishing_aspect: "POST /v1/dispatches with window_start >= window_end returns ERR_INVALID_REQUEST (422) before any overlap/zone/state checks."
        test_recipe:
          setup: ["A QUOTED job and a matching-zone tech."]
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { full_name: "WIN Cust", email: "win@x.com", service_zip: "13001", phone: "1" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /v1/technicians"
              payload: { full_name: "WIN Tech", license_class: "JOURNEYMAN", service_zone: "130", hourly_rate_cents: 9000, on_call: false }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /v1/service-jobs"
              payload: { customer_id: "${cust_id}", scope: "OUTLET", job_class: "SERVICE" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /v1/estimates"
              payload: { job_id: "${job_id}", pricing_mode: "FLAT_RATE", expected_job_version: "${job_v0}", flat_rate_cents: 10000 }
              as: Dispatcher
              captures: { est_id: $.data.id }
            - call: "POST /v1/estimates/${est_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /v1/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /v1/service-jobs/${job_id}"
              payload: {}
              as: Dispatcher
              captures: { job_vacc: $.data.version }
          trigger:
            - call: "POST /v1/dispatches"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-08-01T11:00:00Z", window_end: "2026-08-01T11:00:00Z", expected_job_version: "${job_vacc}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422 and data.error_id == ERR_INVALID_REQUEST"

      - name: fk_integrity_dispatch_references_missing_technician
        claim_type: Parent Relationships
        grounds:
          - entities.Dispatch.fields.technician_id
          - 'validations[priority=3]'
          - 'errors[ERR_NOT_FOUND]'
        distinguishing_aspect: "flat topology FK integrity: POST /v1/dispatches against a real QUOTED job but whose technician_id points to a non-existent Technician returns ERR_NOT_FOUND (404), as existence (priority 3) precedes all dispatch business checks."
        test_recipe:
          setup: ["A real QUOTED job exists; no technician with the referenced id exists."]
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { full_name: "FK Cust", email: "fkdisp@x.com", service_zip: "12001", phone: "1" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /v1/service-jobs"
              payload: { customer_id: "${cust_id}", scope: "OUTLET", job_class: "SERVICE" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /v1/estimates"
              payload: { job_id: "${job_id}", pricing_mode: "FLAT_RATE", expected_job_version: "${job_v0}", flat_rate_cents: 10000 }
              as: Dispatcher
              captures: { est_id: $.data.id }
            - call: "POST /v1/estimates/${est_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /v1/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /v1/service-jobs/${job_id}"
              payload: {}
              as: Dispatcher
              captures: { job_vacc: $.data.version }
          trigger:
            - call: "POST /v1/dispatches"
              payload: { job_id: "${job_id}", technician_id: "00000000-0000-0000-0000-000000000000", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T10:00:00Z", expected_job_version: "${job_vacc}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 and data.error_id == ERR_NOT_FOUND"

      - name: truckstock_low_stock_computed_on_create
        claim_type: Computed Fields
        grounds:
          - entities.TruckStockItem.fields.low_stock
          - calculations.truck_stock_balance
          - 'endpoints."POST /v1/truck-stock-items"'
        distinguishing_aspect: "TruckStockItem.low_stock is computed as quantity_on_hand <= reorder_threshold at create (quantity 2, threshold 3 -> low_stock true)."
        test_recipe:
          setup: ["A technician and a SKU exist."]
          setup_api_calls:
            - call: "POST /v1/technicians"
              payload: { full_name: "LS Tech", license_class: "JOURNEYMAN", service_zone: "140", hourly_rate_cents: 9000, on_call: false }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /v1/material-skus"
              payload: { sku_code: "LS-SKU", description: "Nut", unit_price_cents: 100, taxable: true }
              as: Dispatcher
              captures: { sku_id: $.data.id }
          trigger:
            - call: "POST /v1/truck-stock-items"
              payload: { technician_id: "${tech_id}", sku_id: "${sku_id}", quantity_on_hand: 2, reorder_threshold: 3 }
              as: Dispatcher
          assert:
            - "data.low_stock == true and data.quantity_on_hand == 2"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: estimate_send_from_draft_valid
        claim_type: Valid Transition
        grounds:
          - state_machines.Estimate.DRAFT_to_SENT
          - 'endpoints."POST /v1/estimates/{estimateId}/send"'
        distinguishing_aspect: "POST /v1/estimates/{id}/send moves a DRAFT estimate to SENT."
        test_recipe:
          setup: ["A DRAFT estimate on a DRAFT job."]
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { full_name: "SE Cust", email: "se@x.com", service_zip: "15001", phone: "1" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /v1/service-jobs"
              payload: { customer_id: "${cust_id}", scope: "OUTLET", job_class: "SERVICE" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /v1/estimates"
              payload: { job_id: "${job_id}", pricing_mode: "FLAT_RATE", expected_job_version: "${job_v0}", flat_rate_cents: 12000 }
              as: Dispatcher
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /v1/estimates/${est_id}/send"
              payload: {}
              as: Dispatcher
          assert:
            - "Estimate.${est_id}.status == SENT"

      - name: estimate_reject_from_sent_valid
        claim_type: Valid Transition
        grounds:
          - state_machines.Estimate.SENT_to_REJECTED
          - 'endpoints."POST /v1/estimates/{estimateId}/reject"'
        distinguishing_aspect: "Customer rejecting a SENT estimate moves it to REJECTED and does NOT bubble the job to QUOTED."
        test_recipe:
          setup: ["A SENT estimate on a DRAFT job owned by the acting customer."]
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { full_name: "RJ Cust", email: "rj@x.com", service_zip: "16001", phone: "1" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /v1/service-jobs"
              payload: { customer_id: "${cust_id}", scope: "OUTLET", job_class: "SERVICE" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /v1/estimates"
              payload: { job_id: "${job_id}", pricing_mode: "FLAT_RATE", expected_job_version: "${job_v0}", flat_rate_cents: 12000 }
              as: Dispatcher
              captures: { est_id: $.data.id }
            - call: "POST /v1/estimates/${est_id}/send"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /v1/estimates/${est_id}/reject"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Estimate.${est_id}.status == REJECTED"
            - "ServiceJob.${job_id}.status == DRAFT (unchanged)"

      - name: dispatch_depart_from_assigned_valid
        claim_type: Valid Transition
        grounds:
          - state_machines.Dispatch.ASSIGNED_to_EN_ROUTE
          - 'endpoints."POST /v1/dispatches/{dispatchId}/depart"'
        distinguishing_aspect: "Assigned technician departing moves the dispatch ASSIGNED -> EN_ROUTE."
        test_recipe:
          setup: ["An ASSIGNED dispatch on a SCHEDULED job."]
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { full_name: "DP Cust", email: "dp@x.com", service_zip: "17001", phone: "1" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /v1/technicians"
              payload: { full_name: "DP Tech", license_class: "JOURNEYMAN", service_zone: "170", hourly_rate_cents: 9000, on_call: false }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /v1/service-jobs"
              payload: { customer_id: "${cust_id}", scope: "OUTLET", job_class: "SERVICE" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /v1/estimates"
              payload: { job_id: "${job_id}", pricing_mode: "FLAT_RATE", expected_job_version: "${job_v0}", flat_rate_cents: 12000 }
              as: Dispatcher
              captures: { est_id: $.data.id }
            - call: "POST /v1/estimates/${est_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /v1/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /v1/service-jobs/${job_id}"
              payload: {}
              as: Dispatcher
              captures: { job_vacc: $.data.version }
            - call: "POST /v1/dispatches"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-08-02T09:00:00Z", window_end: "2026-08-02T10:00:00Z", expected_job_version: "${job_vacc}" }
              as: Dispatcher
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /v1/dispatches/${disp_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          assert:
            - "Dispatch.${disp_id}.status == EN_ROUTE"

      - name: permit_issue_from_applied_valid
        claim_type: Valid Transition
        grounds:
          - state_machines.Permit.APPLIED_to_ISSUED
          - 'endpoints."POST /v1/permits/{permitId}/issue"'
        distinguishing_aspect: "Inspector issuing an APPLIED permit moves it to ISSUED."
        test_recipe:
          setup: ["A PANEL job with an APPLIED permit."]
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { full_name: "PI Cust", email: "pi@x.com", service_zip: "18001", phone: "1" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /v1/service-jobs"
              payload: { customer_id: "${cust_id}", scope: "PANEL", job_class: "INSTALL" }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /v1/permits"
              payload: { job_id: "${job_id}", jurisdiction: "Town", permit_number: "PI-1" }
              as: Dispatcher
              captures: { permit_id: $.data.id }
          trigger:
            - call: "POST /v1/permits/${permit_id}/issue"
              payload: {}
              as: Inspector
          assert:
            - "Permit.${permit_id}.status == ISSUED"

      - name: callback_resolve_from_open_valid
        claim_type: Valid Transition
        grounds:
          - state_machines.Callback.OPEN_to_RESOLVED
          - 'endpoints."POST /v1/callbacks/{callbackId}/resolve"'
        distinguishing_aspect: "Resolving an OPEN callback whose parent job is back in COMPLETED/INVOICED moves the callback to RESOLVED."
        test_recipe:
          setup: ["A warranty-covered callback OPEN on a job; the job re-worked to COMPLETED via the warranty loop, leaving the callback resolvable."]
          setup_api_calls:
            - call: "POST /v1/_clock/set"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: Dispatcher
            - call: "POST /v1/customers"
              payload: { full_name: "CR Cust", email: "cr@x.com", service_zip: "19001", phone: "1" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /v1/technicians"
              payload: { full_name: "CR Tech", license_class: "JOURNEYMAN", service_zone: "190", hourly_rate_cents: 9000, on_call: false }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /v1/service-jobs"
              payload: { customer_id: "${cust_id}", scope: "OUTLET", job_class: "SERVICE" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /v1/estimates"
              payload: { job_id: "${job_id}", pricing_mode: "FLAT_RATE", expected_job_version: "${job_v0}", flat_rate_cents: 10000 }
              as: Dispatcher
              captures: { est_id: $.data.id }
            - call: "POST /v1/estimates/${est_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /v1/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /v1/service-jobs/${job_id}"
              payload: {}
              as: Dispatcher
              captures: { job_vacc: $.data.version }
            - call: "POST /v1/dispatches"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z", expected_job_version: "${job_vacc}" }
              as: Dispatcher
              captures: { disp_id: $.data.id }
            - call: "POST /v1/dispatches/${disp_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /v1/dispatches/${disp_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /v1/service-jobs/${job_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
