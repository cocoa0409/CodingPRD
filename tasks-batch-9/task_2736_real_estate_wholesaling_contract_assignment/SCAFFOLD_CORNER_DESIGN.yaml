      - name: dual_variant_valuation_produces_two_distinct_ceilings
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.arv_and_mao.variants
        excluded_because:
          difficulty_instance: mao_diverges_between_conservative_and_aggressive_valuation
          rationale: "The §1.8 dual_variant_calc instance already finalizes two analyses over the identical five-comparable set and asserts both variant triples (CONSERVATIVE 30250000 / 5835500 / 14339500 against AGGRESSIVE 30447464 / 3600000 / 18235598) plus the resulting divergence in which purchase prices are admissible. A second dual-variant probe would restate it."

      - name: contract_cancel_cascade_reaches_buyer_capital
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines.PurchaseContract.contract_status.SIGNED_to_CANCELLED.side_effects
        excluded_because:
          difficulty_instance: contract_cancel_cascades_offer_agreement_buyer_tier
          rationale: "The §1.8 transitive_cascade instance already verifies the full four-level chain from a single cancel request — offer to LAPSED, agreement to TERMINATED_UPSTREAM, buyer committed capital and tier recomputed, deposit to REFUNDED_TO_WHOLESALER and title order to CANCELLED — end to end in one request."

      - name: adverse_finding_threshold_flips_compliance_hold
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - state_machines.ComplianceReview.OPENED_to_ADJUDICATED_ADVERSE.side_effects
        excluded_because:
          difficulty_instance: adverse_compliance_finding_cascades_hold_and_campaign_suspension
          rationale: "The §1.8 transitive_cascade instance already tests the COMPLIANCE_HOLD_THRESHOLD boundary directly: one adverse finding leaves compliance_hold false and campaigns PUBLISHED, while the second adverse finding flips the hold and cascades campaign suspension and lead_gen_blocked."

