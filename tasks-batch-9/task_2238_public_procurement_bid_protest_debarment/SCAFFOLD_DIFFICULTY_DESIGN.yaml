  - rule_id: cross_entity_state_dependency
    instances:
      - name: bid_creation_rejected_because_vendor_is_interim_suspended
        grounds:
          - validations[priority=18]
          - errors[ERR_VENDOR_NOT_ELIGIBLE]
          - state_machines.Vendor.ELIGIBLE_to_SUSPENDED
          - entities.Vendor.fields.eligibility_status
          - endpoints[POST /procurement/bids]
        distinguishing_aspect: |
          The dependency pair is Bid -> Vendor: the write target (a new Bid) is legal in
          every respect on its OWN entity — the solicitation is ISSUED, the clock is inside
          the bid window, the OCC version is fresh — and is refused solely because a
          DIFFERENT entity, the referenced Vendor, sits in SUSPENDED rather than ELIGIBLE.
        test_recipe:
          setup:
            - "logical clock starts at its default 2026-08-01T00:00:00Z"
            - "one Vendor V17, initially ELIGIBLE"
            - "one Solicitation S14 with estimated_value_cents 10000000, issued by U-OFFICER-1, original_question_deadline_utc 2026-08-20T00:00:00Z and original_bid_due_utc 2026-08-27T00:00:00Z, so at 2026-08-01T00:00:00Z the bid window is wide open"
            - "one DebarmentProceeding D4 on V17 with cause_code FRAUD, aggravating_factor_codes [FRAUD] (interim severity 40.00, clearing INTERIM_THRESHOLD 35) and interim_suspension true, which drives V17 ELIGIBLE -> SUSPENDED with interim_status INTERIM_SUSPENDED"
