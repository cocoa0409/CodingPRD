        distinguishing_aspect: "Resolving a NON-RECALL (PAID) dispatch on a NON_COMPLIANT unit triggers the recall-posture safety check (priority 9, business_safety) and fails with ERR_UNIT_NON_COMPLIANT before any segregation check (priority 15, business_constraint) is reachable. Category pair = business_safety vs business_constraint."
