              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0305", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/operators"
              payload: { employee_code: "OP-0305", full_name: "Lead", certifications: ["CSE_1"], home_zone: "Z1" }
              as: UtilityAdmin
              captures: { op_id: $.data.id }
            - call: "POST /lift-station-ops/stations/${st_id}/wet-well-cleanings"
              payload: { scheduled_for: "2026-08-01T00:00:00Z", grease_depth_inches_pre: 5.0, crew_lead_operator_id: "${op_id}", requires_confined_space_entry: false }
              as: MaintenancePlanner
              captures: { cl_id: $.data.id }
            - call: "POST /lift-station-ops/wet-well-cleanings/${cl_id}/start"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
          trigger:
            - call: "POST /lift-station-ops/wet-well-cleanings/${cl_id}/complete"
              payload: { grease_depth_inches_post: 5.5 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_GREASE_DEPTH_INVALID"


      - name: sso_submit_after_deadline_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=21]", "errors[ERR_REPORT_DEADLINE_MISSED]"]
        distinguishing_aspect: "Submitting report after regulator_deadline_at (no override_note) returns ERR_REPORT_DEADLINE_MISSED."
        test_recipe:
          setup: ["SsoEvent in REPORT_DRAFT with deadline passed"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
