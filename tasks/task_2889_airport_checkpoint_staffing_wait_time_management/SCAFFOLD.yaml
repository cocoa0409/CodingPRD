# =============================================================================
# PRD Benchmark Scaffold — §1.0–§1.7
# Task: task_2889_airport_checkpoint_staffing_wait_time_management
# The scenario couples demand forecasting, labour allocation, physical capacity,
# and live queue telemetry into ONE feedback loop — every entity participates in
# at least two cross-entity gates.
# =============================================================================
scenario: |
  2889. Airport Checkpoint Staffing & Wait Time Management (airport security screening operations): passenger volume forecasting by checkpoint and time band from flight schedules and historical show-up curves, staffing plan by lane type with certified officer availability and break rotation, lane opening decisions with expedited and standard lane balancing, wait time measurement, publication and threshold escalation to open additional lanes, equipment availability, alarm resolution and secondary screening capacity, special screening procedures for passengers with disabilities, medical devices and young children, seasonal and special event surge staffing with overtime and detail assignments, throughput and diversion analysis feeding checkpoint design changes

domain_name: airport-checkpoint-staffing
api_prefix: ""           # flat topology: /checkpoints, /lanes, /officers, /staffing-plans, ...

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - rate_threshold_triggers        # wait-time publication thresholds, consecutive-breach counters, admin-fee tiers
    - dual_variant_calculation       # SCHEDULE_ONLY vs CURVE_BLENDED demand; FORWARD_LOOKING_PLANNED vs CHRONOLOGICAL_ACTUAL labour
    - cascading_side_effects         # equipment fault -> lane -> checkpoint posture -> escalation ticket
    - optimistic_concurrency         # OCC on Checkpoint.version and Officer.version
  entity_topology: flat
  # Peer entities linked by explicit foreign keys. Only three read paths are
  # nested (`/checkpoints/{id}/lanes`, `/checkpoints/{id}/time-bands`,
  # `/checkpoints/{id}/wait-observations`, `/lanes/{id}/equipment-units`); every
  # write endpoint is a top-level collection carrying its FKs in the body.
  state_machine_shape: parallel
  # LaneAssignment carries TWO independent axes on the same row
  # (assignment_state x break_state); Lane and StaffingPlan are cyclic;
  # EscalationTicket and ScreeningReferral are branching fork-with-divergent-
  # side-effects; Checkpoint.posture is a compound/derived aggregate gate.
  relationship_patterns:
    - one_to_many          # Checkpoint -> Lane, Lane -> EquipmentUnit
    - many_to_many         # LaneAssignment is the Officer x Lane x TimeBand junction
    - self_referential     # StaffingPlan.superseded_by_staffing_plan_id -> StaffingPlan.id
    - cross_aggregate      # SurgeDetail spans StaffingPlan and Officer; EscalationTicket spans Checkpoint and Lane
  role_model: segregation_of_duties
  # A StaffingPlanner's own X-User-ID may not approve the plan it prepared, and a
  # ScreeningReferral's detecting officer may not be its resolving officer.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Checkpoint
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Operator-facing checkpoint name", constraints: "1..80 chars, non-blank" }
      - { name: terminal_code, type: string, source: input, description: "Terminal the checkpoint serves", constraints: "1..4 chars, uppercase A-Z0-9" }
      - { name: total_lane_positions, type: integer, source: input, description: "Physical officer positions the checkpoint floor can sustain at once", constraints: ">= 1" }
      - { name: available_lane_positions, type: integer, source: computed, description: "total_lane_positions minus the sum of required_officer_count over Lane rows with lane_state == OPEN; the conserved quantity of invariant lane_position_conservation" }
      - { name: open_lane_count, type: integer, source: computed, description: "Count of Lane rows with checkpoint_id == this.id AND lane_state == OPEN", default: 0 }
      - { name: suspended, type: boolean, source: input, description: "Manual suspension flag set through PATCH /checkpoints/{checkpoint_id}", default: false }
      - { name: posture, type: enum, source: computed, description: "Derived aggregate gate over lanes and escalations; see calculations.checkpoint_posture", constraints: "one of NORMAL, ELEVATED, SURGE, SUSPENDED", default: "NORMAL" }
      - { name: wait_threshold_minutes_standard, type: integer, source: input, description: "Published standard-lane wait at or above which an observation counts as a breach", constraints: ">= 1" }
      - { name: wait_threshold_minutes_expedited, type: integer, source: input, description: "Published expedited-lane wait at or above which an observation counts as a breach", constraints: ">= 1" }
      - { name: connecting_pax_discount_pct, type: number, source: input, description: "Share of forecast demand removed as connecting passengers who never re-enter screening; applied by the CURVE_BLENDED variant only", default: 0, constraints: "0.00..50.00, exactly 2 decimals" }
      - { name: secondary_slot_capacity, type: integer, source: input, description: "Simultaneous secondary-screening / special-procedure slots the checkpoint can hold", constraints: ">= 0" }
      - { name: secondary_slots_in_use, type: integer, source: computed, description: "Count of ScreeningReferral rows on this checkpoint's lanes with state IN {RAISED, IN_PROGRESS}", default: 0 }
      - { name: plan_cost_cap_cents, type: integer, source: input, description: "Hard ceiling on StaffingPlan.total_cost_cents enforced at approval", constraints: ">= 0" }
      - { name: consecutive_breach_count_standard, type: integer, source: computed, description: "Run length of consecutive STANDARD wait observations whose published_wait_minutes_snapshot breached the standard threshold; reset to 0 by the first non-breaching STANDARD observation", default: 0 }
      - { name: consecutive_breach_count_expedited, type: integer, source: computed, description: "Same counter for EXPEDITED observations", default: 0 }
      - { name: diverted_pax_total, type: integer, source: computed, description: "Cumulative passengers diverted away from this checkpoint: incremented by EscalationTicket RESOLVED_DIVERTED resolutions and by ScreeningReferral DENIED_ENTRY outcomes", default: 0 }
      - { name: leo_referral_count, type: integer, source: computed, description: "Cumulative ScreeningReferral rows resolved REFERRED_LEO", default: 0 }
      - { name: denied_entry_count, type: integer, source: computed, description: "Cumulative ScreeningReferral rows resolved DENIED_ENTRY", default: 0 }
      - { name: cleared_referral_count, type: integer, source: computed, description: "Cumulative ScreeningReferral rows resolved CLEARED", default: 0 }

  - name: Lane
    parent: null
    common_fields: true
    fields:
      - { name: checkpoint_id, type: string, source: input, description: "FK -> Checkpoint.id; the checkpoint whose floor this lane occupies" }
      - { name: lane_type, type: enum, source: input, description: "Screening modality of the lane", constraints: "one of STANDARD, EXPEDITED" }
      - { name: position_index, type: integer, source: input, description: "Physical left-to-right index on the checkpoint floor; the sole deterministic ordering key for the lane waterfall in calculations.lane_requirement", constraints: ">= 1; unique per checkpoint_id among Lane rows with lane_state != DECOMMISSIONED" }
      - { name: required_officer_count, type: integer, source: input, description: "Officer positions this lane consumes from Checkpoint.available_lane_positions while OPEN", constraints: ">= 1" }
      - { name: max_concurrent_officers, type: integer, source: input, description: "Ceiling used by the closed-interval lane occupancy rule in validations[priority=25]", constraints: ">= 1" }
      - { name: secondary_positions, type: integer, source: input, description: "Secondary-screening stations physically attached to this lane", constraints: ">= 0" }
      - { name: lane_state, type: enum, source: system, description: "Operational axis of the lane state machine", constraints: "one of CLOSED, OPEN, PAUSED, DECOMMISSIONED", default: "CLOSED" }
      - { name: equipment_state, type: enum, source: computed, description: "Derived from this lane's EquipmentUnit rows: OUT_OF_SERVICE when any required-for-lane_type type is missing or OUT_OF_SERVICE; else DEGRADED when any required unit is DEGRADED; else SERVICEABLE", constraints: "one of SERVICEABLE, DEGRADED, OUT_OF_SERVICE", default: "OUT_OF_SERVICE" }
      - { name: opened_at_utc, type: datetime, source: system, description: "Logical-clock instant of the most recent transition into OPEN; null before the first open", default: null }
      - { name: paused_reason_code, type: enum, source: system, description: "Why the lane last left OPEN; null while OPEN or CLOSED-without-pause", constraints: "one of EQUIPMENT_FAULT, STAFF_SHORTFALL, LOW_DEMAND, SECURITY_INCIDENT", default: null }

  - name: EquipmentUnit
    parent: null
    common_fields: true
    fields:
      - { name: lane_id, type: string, source: input, description: "FK -> Lane.id; the lane this unit is installed in" }
      - { name: equipment_type, type: enum, source: input, description: "Screening equipment class", constraints: "one of WTMD, AT_XRAY, ADVANCED_IMAGING, ETD, CT" }
      - { name: serial_number, type: string, source: input, description: "Asset serial", constraints: "1..40 chars, globally unique" }
      - { name: calibration_due_utc, type: datetime, source: input, description: "Instant at which the unit's calibration lapses; a lane cannot open when a required unit's calibration_due_utc <= current logical clock", constraints: "ISO 8601 UTC" }
      - { name: state, type: enum, source: system, description: "Serviceability of the unit, driven by POST /equipment-units/{equipment_unit_id}/report-state", constraints: "one of SERVICEABLE, DEGRADED, OUT_OF_SERVICE", default: "SERVICEABLE" }
      - { name: last_state_note, type: string, source: system, description: "Free-text note carried by the most recent report-state call; null when none supplied", default: null }

  - name: Officer
    parent: null
    common_fields: true
    fields:
      - { name: badge_number, type: string, source: input, description: "Officer badge", constraints: "1..16 chars, globally unique" }
      - { name: full_name, type: string, source: input, description: "Officer name", constraints: "1..80 chars" }
      - { name: certifications, type: array, source: input, description: "Certifications held; gates lane-type assignment, special procedures, and supervisory actions", constraints: "non-empty array of distinct values from STANDARD_LANE, EXPEDITED_LANE, ADVANCED_IMAGING, ETD_RESOLUTION, SPECIAL_PROCEDURES, SUPERVISOR" }
      - { name: base_rate_cents_per_minute, type: integer, source: input, description: "Straight-time labour rate used by calculations.staffing_plan_cost", constraints: ">= 1" }
      - { name: weekly_regular_minutes_cap, type: integer, source: input, description: "Minutes per ISO week paid at straight time before overtime begins", constraints: ">= 1" }
      - { name: weekly_overtime_minutes_cap, type: integer, source: input, description: "Maximum overtime minutes per ISO week; breaching it blocks plan approval and check-in", constraints: ">= 0" }
      - { name: duty_status, type: enum, source: system, description: "Duty axis of the officer state machine", constraints: "one of OFF_DUTY, ON_DUTY, ON_BREAK, SEPARATED", default: "OFF_DUTY" }
      - { name: committed_duty_minutes, type: integer, source: computed, description: "Conserved quantity of invariant officer_duty_minute_conservation: sum of LaneAssignment.planned_minutes over this officer's rows with assignment_state IN {SCHEDULED, CHECKED_IN, REASSIGN_PENDING} PLUS sum of SurgeDetail.detail_minutes over this officer's rows with state == APPROVED", default: 0 }
      - { name: approved_detail_minutes, type: integer, source: computed, description: "Sum of SurgeDetail.detail_minutes over this officer's rows with state == APPROVED", default: 0 }

  - name: ShowUpCurve
    parent: null
    common_fields: false
    fields:
      - { name: name, type: string, source: input, description: "Curve label", constraints: "1..60 chars, globally unique" }
      - { name: carrier_type, type: enum, source: input, description: "Carrier class the curve was measured on", constraints: "one of DOMESTIC, INTERNATIONAL" }
      - { name: season_code, type: enum, source: input, description: "Season the curve was measured in", constraints: "one of OFF_PEAK, SHOULDER, PEAK, HOLIDAY" }
      - { name: window_start_minutes_before, type: integer, source: input, description: "Earliest show-up point, in minutes before scheduled departure (larger number = earlier)", constraints: "> window_end_minutes_before, <= 600" }
      - { name: window_end_minutes_before, type: integer, source: input, description: "Latest show-up point, in minutes before scheduled departure", constraints: ">= 0" }
      - { name: buckets, type: array, source: input, description: "Histogram of show-up share; objects { minutes_before_start: integer, minutes_before_end: integer, share_pct: number }", constraints: "non-empty; buckets are contiguous and non-overlapping and exactly tile [window_end_minutes_before, window_start_minutes_before]; every minutes_before_start > minutes_before_end; sum of share_pct == 100 exactly" }

  - name: FlightScheduleEntry
    parent: null
    common_fields: true
    fields:
      - { name: checkpoint_id, type: string, source: input, description: "FK -> Checkpoint.id; the checkpoint this flight's departing passengers are routed to" }
      - { name: show_up_curve_id, type: string, source: input, description: "FK -> ShowUpCurve.id; the historical show-up curve applied to this flight" }
      - { name: flight_number, type: string, source: input, description: "Carrier flight number; secondary ordering key of the forecast sweep", constraints: "1..8 chars, uppercase A-Z0-9" }
      - { name: scheduled_departure_utc, type: datetime, source: input, description: "Scheduled departure instant; primary ordering key of the forecast sweep", constraints: "ISO 8601 UTC" }
      - { name: seats_sold, type: integer, source: input, description: "Seats sold on the flight", constraints: ">= 0" }
      - { name: load_factor_pct, type: number, source: input, description: "Expected share of sold seats that actually shows up at the airport", constraints: "0.00..100.00, exactly 2 decimals" }
      - { name: carrier_type, type: enum, source: input, description: "Carrier class", constraints: "one of DOMESTIC, INTERNATIONAL" }
      - { name: status, type: enum, source: system, description: "SCHEDULED rows feed the forecast input set; CANCELLED rows are excluded", constraints: "one of SCHEDULED, CANCELLED", default: "SCHEDULED" }
      - { name: projected_pax_count, type: integer, source: computed, description: "round_half_up(seats_sold * load_factor_pct / 100) to a whole passenger; the per-flight population both forecast variants distribute over time bands" }

  - name: TimeBand
    parent: null
    common_fields: true
    fields:
      - { name: checkpoint_id, type: string, source: input, description: "FK -> Checkpoint.id; the checkpoint the band forecasts demand for" }
      - { name: band_start_utc, type: datetime, source: input, description: "Inclusive start of the half-open band interval [band_start_utc, band_end_utc)", constraints: "ISO 8601 UTC; minute component must be exactly 00 or 30; seconds and fractional seconds must be zero" }
      - { name: band_end_utc, type: datetime, source: computed, description: "band_start_utc + BAND_MINUTES (30); exclusive end of the band interval" }
      - { name: expedited_share_pct, type: integer, source: input, description: "Share of the band's forecast demand routed to EXPEDITED lanes", constraints: "0..100" }
      - { name: seasonal_multiplier, type: number, source: input, description: "Seasonal / special-event demand multiplier applied by the CURVE_BLENDED variant only", default: 1.00, constraints: "0.50..3.00, exactly 2 decimals" }
      - { name: forecast_variant, type: enum, source: computed, description: "Which variant produced the stored forecast; null until POST /time-bands/{time_band_id}/forecast runs", constraints: "one of SCHEDULE_ONLY, CURVE_BLENDED", default: null }
      - { name: forecast_pax_count, type: integer, source: computed, description: "Stored output of calculations.time_band_pax_forecast for the recorded variant; null until first forecast", default: null }
      - { name: forecast_computed_at_utc, type: datetime, source: computed, description: "Logical-clock instant of the most recent forecast run", default: null }
      - { name: required_standard_lanes, type: integer, source: computed, description: "Stored output of calculations.lane_requirement for lane_type STANDARD", default: null }
      - { name: required_expedited_lanes, type: integer, source: computed, description: "Stored output of calculations.lane_requirement for lane_type EXPEDITED", default: null }
      - { name: unmet_standard_demand, type: integer, source: computed, description: "Standard-lane demand the checkpoint's entire non-decommissioned STANDARD lane pool cannot absorb in this band; 0 when the pool suffices", default: null }
      - { name: unmet_expedited_demand, type: integer, source: computed, description: "Same for EXPEDITED", default: null }

  - name: StaffingPlan
    parent: null
    common_fields: true
    fields:
      - { name: checkpoint_id, type: string, source: input, description: "FK -> Checkpoint.id; the checkpoint the plan staffs" }
      - { name: superseded_by_staffing_plan_id, type: string, source: system, description: "FK -> StaffingPlan.id; set on the losing plan when a later plan for the same (checkpoint_id, operational_date) is approved; null otherwise", default: null }
      - { name: operational_date, type: string, source: input, description: "Calendar date the plan covers, in the checkpoint's UTC day", constraints: "YYYY-MM-DD" }
      - { name: state, type: enum, source: system, description: "Plan lifecycle with a REJECTED -> DRAFT revision cycle", constraints: "one of DRAFT, SUBMITTED, APPROVED, REJECTED, ACTIVATED, CLOSED, SUPERSEDED", default: "DRAFT" }
      - { name: revision_number, type: integer, source: system, description: "Increments by 1 on every REJECTED -> DRAFT revise", default: 1 }
      - { name: prepared_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the StaffingPlanner that created the plan; the segregation-of-duties comparand at approval (not an entity reference)" }
      - { name: approved_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the DutyManager that approved the plan; null until approval (not an entity reference)", default: null }
      - { name: rejection_reason_code, type: enum, source: system, description: "Why the plan was rejected; cleared back to null on revise", constraints: "one of COST, COVERAGE, CERTIFICATION_GAP, POLICY", default: null }
      - { name: submitted_at_utc, type: datetime, source: system, description: "Logical-clock instant of the most recent DRAFT -> SUBMITTED", default: null }
      - { name: approved_at_utc, type: datetime, source: system, description: "Logical-clock instant of SUBMITTED -> APPROVED", default: null }
      - { name: activated_at_utc, type: datetime, source: system, description: "Logical-clock instant of APPROVED -> ACTIVATED", default: null }
      - { name: closed_at_utc, type: datetime, source: system, description: "Logical-clock instant of ACTIVATED -> CLOSED", default: null }
      - { name: planned_regular_minutes, type: integer, source: computed, description: "Sum over the plan's officers of regular_i from calculations.staffing_plan_cost step 1; null until the plan has at least one LaneAssignment row", default: null }
      - { name: planned_overtime_minutes, type: integer, source: computed, description: "Sum over the plan's officers of overtime_i from calculations.staffing_plan_cost step 1; null until the plan has at least one LaneAssignment row", default: null }
      - { name: base_cost_cents, type: integer, source: computed, description: "Step 4 of calculations.staffing_plan_cost", default: null }
      - { name: overtime_cost_cents, type: integer, source: computed, description: "Step 5 of calculations.staffing_plan_cost", default: null }
      - { name: detail_cost_cents, type: integer, source: computed, description: "Step 6 of calculations.staffing_plan_cost", default: null }
      - { name: subtotal_cents, type: integer, source: computed, description: "Step 7: base_cost_cents + overtime_cost_cents + detail_cost_cents; the ONLY input to the admin-fee tier lookup", default: null }
      - { name: admin_fee_rate, type: number, source: computed, description: "Step 8 tier rate selected on subtotal_cents", constraints: "one of 0.060, 0.045, 0.030", default: null }
      - { name: admin_fee_cents, type: integer, source: computed, description: "Step 8: round_half_up(subtotal_cents * admin_fee_rate)", default: null }
      - { name: total_cost_cents, type: integer, source: computed, description: "Step 8: subtotal_cents + admin_fee_cents; compared against Checkpoint.plan_cost_cap_cents at approval", default: null }

  - name: LaneAssignment
    parent: null
    common_fields: true
    fields:
      - { name: staffing_plan_id, type: string, source: input, description: "FK -> StaffingPlan.id; the plan that owns this assignment" }
      - { name: lane_id, type: string, source: input, description: "FK -> Lane.id; the lane position the officer works" }
      - { name: officer_id, type: string, source: input, description: "FK -> Officer.id; the assigned officer" }
      - { name: time_band_id, type: string, source: input, description: "FK -> TimeBand.id; the 30-minute band the assignment occupies" }
      - { name: assignment_state, type: enum, source: system, description: "Duty axis; evolves independently of break_state", constraints: "one of SCHEDULED, CHECKED_IN, REASSIGN_PENDING, RELEASED, CANCELLED", default: "SCHEDULED" }
      - { name: break_state, type: enum, source: system, description: "Break-rotation axis; evolves independently of assignment_state and cycles COMPLETED -> DUE", constraints: "one of NOT_DUE, DUE, ON_BREAK, COMPLETED", default: "NOT_DUE" }
      - { name: checked_in_at_utc, type: datetime, source: system, description: "Logical-clock instant of SCHEDULED -> CHECKED_IN; chronological ordering key of the CHRONOLOGICAL_ACTUAL duty ledger", default: null }
      - { name: released_at_utc, type: datetime, source: system, description: "Logical-clock instant of the transition into RELEASED", default: null }
      - { name: break_baseline_utc, type: datetime, source: system, description: "Instant the current on-position run started: checked_in_at_utc, or break_ended_at_utc after a completed break", default: null }
      - { name: break_started_at_utc, type: datetime, source: system, description: "Logical-clock instant of DUE -> ON_BREAK", default: null }
      - { name: break_ended_at_utc, type: datetime, source: system, description: "Logical-clock instant of ON_BREAK -> COMPLETED", default: null }
      - { name: break_minutes_taken, type: integer, source: system, description: "Cumulative whole minutes spent ON_BREAK on this assignment; subtracted by the CHRONOLOGICAL_ACTUAL duty ledger only", default: 0 }
      - { name: planned_minutes, type: integer, source: computed, description: "TimeBand.band_end_utc - TimeBand.band_start_utc in whole minutes for the referenced band (always 30)" }
      - { name: actual_minutes, type: integer, source: computed, description: "max(0, (released_at_utc or current logical clock) - checked_in_at_utc in whole minutes) - break_minutes_taken; null while assignment_state IN {SCHEDULED, CANCELLED}", default: null }

  - name: WaitTimeObservation
    parent: null
    common_fields: false
    fields:
      - { name: checkpoint_id, type: string, source: input, description: "FK -> Checkpoint.id; the measured checkpoint" }
      - { name: lane_type, type: enum, source: input, description: "Queue the sample was taken from", constraints: "one of STANDARD, EXPEDITED" }
      - { name: sampled_wait_seconds, type: integer, source: input, description: "Measured queue traversal time in seconds", constraints: "0..7200" }
      - { name: measurement_method, type: enum, source: input, description: "How the sample was taken; determines its weight in the publication average", constraints: "one of BLE_SENSOR, MANUAL_TIMESTAMP, STAFF_ESTIMATE" }
      - { name: sample_size, type: integer, source: input, description: "Number of passengers behind this sample; multiplies the method weight", constraints: "1..500" }
      - { name: observed_at_utc, type: datetime, source: system, description: "Logical-clock instant at which the observation was posted; the publication window is anchored on this field" }
      - { name: published_wait_minutes_snapshot, type: integer, source: computed, description: "calculations.published_wait_time evaluated immediately after this observation landed, for this checkpoint and lane_type; null only when the publication window is empty (impossible at post time, so always non-null here)" }
      - { name: breached_threshold, type: boolean, source: computed, description: "true when published_wait_minutes_snapshot >= the checkpoint's threshold for this lane_type (>=, not >)" }

  - name: EscalationTicket
    parent: null
    common_fields: true
    fields:
      - { name: checkpoint_id, type: string, source: system, description: "FK -> Checkpoint.id; the escalating checkpoint" }
      - { name: resolved_lane_id, type: string, source: input, description: "FK -> Lane.id; the lane opened to mitigate the escalation; null unless state == RESOLVED_LANE_OPENED", default: null }
      - { name: acknowledged_by_officer_id, type: string, source: system, description: "FK -> Officer.id; the SupervisoryOfficer that acknowledged the ticket, taken from X-User-ID", default: null }
      - { name: trigger_reason, type: enum, source: system, description: "Why the ticket was raised", constraints: "one of WAIT_THRESHOLD_BREACH, POSTURE_DEGRADATION" }
      - { name: lane_type_scope, type: enum, source: system, description: "Queue the escalation concerns; ALL for POSTURE_DEGRADATION tickets", constraints: "one of STANDARD, EXPEDITED, ALL" }
      - { name: state, type: enum, source: system, description: "Branching lifecycle with three divergent resolutions", constraints: "one of RAISED, ACKNOWLEDGED, RESOLVED_LANE_OPENED, RESOLVED_DIVERTED, EXPIRED", default: "RAISED" }
      - { name: published_wait_minutes_at_raise, type: integer, source: system, description: "Published wait for lane_type_scope at the instant the ticket was raised; null for POSTURE_DEGRADATION tickets raised while the publication window was empty", default: null }
      - { name: diverted_pax_count, type: integer, source: input, description: "Passengers redirected to another checkpoint; required and >= 1 for a MITIGATED_BY_DIVERSION resolution, null otherwise", default: null }
      - { name: resolution_note, type: string, source: input, description: "Free-text resolution note; null when not supplied", default: null }
      - { name: raised_at_utc, type: datetime, source: system, description: "Logical-clock instant the ticket was raised" }
      - { name: acknowledged_at_utc, type: datetime, source: system, description: "Logical-clock instant of RAISED -> ACKNOWLEDGED", default: null }
      - { name: resolved_at_utc, type: datetime, source: system, description: "Logical-clock instant of the transition into a terminal state", default: null }

  - name: ScreeningReferral
    parent: null
    common_fields: true
    fields:
      - { name: lane_id, type: string, source: input, description: "FK -> Lane.id; the lane the passenger was pulled from" }
      - { name: detecting_officer_id, type: string, source: system, description: "FK -> Officer.id; the ScreeningOfficer that raised the referral, taken from X-User-ID" }
      - { name: resolving_officer_id, type: string, source: input, description: "FK -> Officer.id; the officer nominated to work the secondary; null until RAISED -> IN_PROGRESS", default: null }
      - { name: referral_reason, type: enum, source: input, description: "Why the passenger needs non-standard handling; the three accommodation reasons demand SPECIAL_PROCEDURES certification, ALARM demands a serviceable ETD unit on the lane", constraints: "one of ALARM, DISABILITY_ACCOMMODATION, MEDICAL_DEVICE, YOUNG_CHILD, RANDOM" }
      - { name: passenger_category, type: enum, source: input, description: "Passenger handling class recorded for audit and reporting", constraints: "one of ADULT, MINOR_UNDER_12, WHEELCHAIR_USER, MEDICAL_DEVICE_WEARER, SERVICE_ANIMAL_HANDLER" }
      - { name: requires_private_screening, type: boolean, source: input, description: "Whether a private screening room is requested", default: false }
      - { name: state, type: enum, source: system, description: "Branching lifecycle with four divergent terminal outcomes", constraints: "one of RAISED, IN_PROGRESS, CLEARED, REFERRED_LEO, DENIED_ENTRY, WITHDRAWN", default: "RAISED" }
      - { name: secondary_slot_held, type: boolean, source: computed, description: "true exactly while state IN {RAISED, IN_PROGRESS}; the per-row contribution to Checkpoint.secondary_slots_in_use" }
      - { name: resolution_note, type: string, source: input, description: "Free-text note captured at resolution; null when not supplied", default: null }
      - { name: raised_at_utc, type: datetime, source: system, description: "Logical-clock instant the referral was raised" }
      - { name: started_at_utc, type: datetime, source: system, description: "Logical-clock instant of RAISED -> IN_PROGRESS", default: null }
      - { name: resolved_at_utc, type: datetime, source: system, description: "Logical-clock instant of the transition into a terminal state", default: null }

  - name: SurgeDetail
    parent: null
    common_fields: true
    fields:
      - { name: staffing_plan_id, type: string, source: input, description: "FK -> StaffingPlan.id; the plan the detail is charged to" }
      - { name: officer_id, type: string, source: input, description: "FK -> Officer.id; the officer detailed to the surge" }
      - { name: event_code, type: enum, source: input, description: "Surge driver", constraints: "one of HOLIDAY_PEAK, SPORTING_EVENT, CONVENTION, IRREGULAR_OPS" }
      - { name: window_start_utc, type: datetime, source: input, description: "Start of the detail window; must fall inside the plan's operational_date UTC day", constraints: "ISO 8601 UTC" }
      - { name: detail_minutes, type: integer, source: input, description: "Paid detail duration; credited to Officer.committed_duty_minutes on approval and debited on cancellation", constraints: "1..720" }
      - { name: state, type: enum, source: system, description: "Request lifecycle", constraints: "one of REQUESTED, APPROVED, DENIED, CANCELLED", default: "REQUESTED" }
      - { name: requested_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the requesting StaffingPlanner (not an entity reference)" }
      - { name: decided_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the deciding DutyManager (not an entity reference)", default: null }
      - { name: denial_reason_code, type: enum, source: system, description: "Why the detail was denied", constraints: "one of BUDGET, COVERAGE, OFFICER_UNAVAILABLE", default: null }
      - { name: detail_cost_cents, type: integer, source: computed, description: "round_half_up(detail_minutes * DETAIL_RATE_CENTS_PER_MINUTE); non-null only while state == APPROVED", default: null }
      - { name: decided_at_utc, type: datetime, source: system, description: "Logical-clock instant of the APPROVE or DENY decision", default: null }
      - { name: cancelled_at_utc, type: datetime, source: system, description: "Logical-clock instant of APPROVED -> CANCELLED", default: null }

# =============================================================================
# §1.2 State Machine Table
#
# Shapes present:
#   Checkpoint        posture_driven / compound (derived aggregate gate, no terminal state)
#   Lane              cyclic (CLOSED -> OPEN -> PAUSED -> OPEN -> CLOSED)
#   EquipmentUnit     cyclic (SERVICEABLE <-> DEGRADED <-> OUT_OF_SERVICE)
#   Officer           cyclic (ON_DUTY -> ON_BREAK -> ON_DUTY) with a terminal SEPARATED
#   StaffingPlan      cyclic + branching (SUBMITTED -> {APPROVED, REJECTED}; REJECTED -> DRAFT)
#   LaneAssignment    PARALLEL: assignment_state x break_state on the same row, break axis cyclic
#   EscalationTicket  branching fork with divergent side-effect sets per resolution
#   ScreeningReferral branching fork with four divergent terminal outcomes
#   SurgeDetail       branching with a compensating CANCELLED path
# =============================================================================
state_machines:

  - entity: Checkpoint
    initial_state: NORMAL
    terminal_states: []          # posture is a derived gate and is never terminal
    transitions:
      - from: NORMAL
        to: ELEVATED
        trigger: "system — calculations.checkpoint_posture re-evaluates after any mutation that changes open_escalation_count or oos_lane_count (lane pause/open/close, equipment report-state, escalation raise/resolve/expire)"
        actor: system
        preconditions: ["Checkpoint.suspended == false", "open_escalation_count == 1 OR oos_lane_count >= 1", "NOT (open_escalation_count >= 2)"]
        side_effects:
          - "Checkpoint.posture := ELEVATED"
          - "Checkpoint.version incremented by 1 and updated_at refreshed"
          - "when the checkpoint's most recent WaitTimeObservation for lane_type STANDARD has published_wait_minutes_snapshot >= wait_threshold_minutes_standard AND no EscalationTicket for this checkpoint is in state RAISED or ACKNOWLEDGED with trigger_reason POSTURE_DEGRADATION, a new EscalationTicket is created with trigger_reason POSTURE_DEGRADATION, lane_type_scope ALL, state RAISED (link 4 of cascade equipment_fault_to_escalation)"
      - from: ELEVATED
        to: SURGE
        trigger: "system — posture re-evaluation after an EscalationTicket is raised"
        actor: system
        preconditions: ["Checkpoint.suspended == false", "open_escalation_count >= 2"]
        side_effects:
          - "Checkpoint.posture := SURGE"
          - "every subsequent calculations.lane_requirement evaluation derates per-lane capacity by SURGE_POSTURE_DERATE"
          - "Checkpoint.version incremented by 1"
      - from: SURGE
        to: ELEVATED
        trigger: "system — posture re-evaluation after an EscalationTicket reaches a terminal state"
        actor: system
        preconditions: ["Checkpoint.suspended == false", "open_escalation_count == 1 OR oos_lane_count >= 1", "NOT (open_escalation_count >= 2)"]
        side_effects: ["Checkpoint.posture := ELEVATED", "Checkpoint.version incremented by 1"]
      - from: ELEVATED
        to: NORMAL
        trigger: "system — posture re-evaluation after the last open escalation terminates and every non-decommissioned lane's equipment_state != OUT_OF_SERVICE"
        actor: system
        preconditions: ["Checkpoint.suspended == false", "open_escalation_count == 0", "oos_lane_count == 0"]
        side_effects: ["Checkpoint.posture := NORMAL", "Checkpoint.version incremented by 1"]
      - from: NORMAL
        to: SUSPENDED
        trigger: "PATCH /checkpoints/{checkpoint_id} with suspended = true"
        actor: CheckpointManager
        preconditions: ["Checkpoint.suspended == false"]
        side_effects:
          - "Checkpoint.suspended := true and Checkpoint.posture := SUSPENDED"
          - "every Lane of this checkpoint with lane_state == OPEN transitions OPEN -> PAUSED with paused_reason_code SECURITY_INCIDENT (cascade down)"
          - "each of those pauses restores required_officer_count to Checkpoint.available_lane_positions and flips that lane's CHECKED_IN LaneAssignment rows to REASSIGN_PENDING"
          - "Checkpoint.version incremented by 1"
        note: "ELEVATED -> SUSPENDED and SURGE -> SUSPENDED are identical; posture is overridden by the flag regardless of counters."
      - from: SUSPENDED
        to: NORMAL
        trigger: "PATCH /checkpoints/{checkpoint_id} with suspended = false"
        actor: CheckpointManager
        preconditions: ["Checkpoint.suspended == true", "open_escalation_count == 0", "oos_lane_count == 0"]
        side_effects:
          - "Checkpoint.suspended := false and posture recomputed by calculations.checkpoint_posture (NORMAL here; ELEVATED or SURGE when counters are non-zero)"
          - "lanes are NOT auto-reopened — each requires an explicit POST /lanes/{lane_id}/open"
          - "Checkpoint.version incremented by 1"

  - entity: EquipmentUnit
    initial_state: SERVICEABLE
    terminal_states: []
    transitions:
      - from: SERVICEABLE
        to: OUT_OF_SERVICE
        trigger: "POST /equipment-units/{equipment_unit_id}/report-state with state = OUT_OF_SERVICE"
        actor: SupervisoryOfficer
        preconditions: ["EquipmentUnit.state != OUT_OF_SERVICE", "the unit's Lane.lane_state != DECOMMISSIONED"]
        side_effects:
          - "LINK 1 — EquipmentUnit.state := OUT_OF_SERVICE, last_state_note := note, version incremented by 1"
          - "LINK 2 (caused by link 1) — the owning Lane recomputes equipment_state; because this unit's equipment_type is required for the lane's lane_type, Lane.equipment_state := OUT_OF_SERVICE and, when Lane.lane_state == OPEN, the lane transitions OPEN -> PAUSED with paused_reason_code EQUIPMENT_FAULT"
          - "LINK 2b (caused by link 2) — every LaneAssignment on that lane with assignment_state == CHECKED_IN transitions CHECKED_IN -> REASSIGN_PENDING; break_state is untouched"
          - "LINK 3 (caused by link 2) — because a lane left OPEN, Checkpoint.available_lane_positions += lane.required_officer_count, Checkpoint.open_lane_count -= 1, and oos_lane_count becomes >= 1, so calculations.checkpoint_posture moves the checkpoint NORMAL -> ELEVATED"
          - "LINK 4 (caused by link 3) — the NORMAL -> ELEVATED transition's own side effect auto-raises a POSTURE_DEGRADATION EscalationTicket when the latest published STANDARD wait is at or above the checkpoint's standard threshold"
        note: "This is the depth-4 transitive cascade `equipment_fault_to_escalation`. Each link is caused by the previous link, not by the original request."
      - from: SERVICEABLE
        to: DEGRADED
        trigger: "POST /equipment-units/{equipment_unit_id}/report-state with state = DEGRADED"
        actor: SupervisoryOfficer
        preconditions: ["EquipmentUnit.state != DEGRADED", "the unit's Lane.lane_state != DECOMMISSIONED"]
        side_effects:
          - "EquipmentUnit.state := DEGRADED"
          - "the owning Lane recomputes equipment_state := DEGRADED (no lane_state change — a DEGRADED lane stays OPEN)"
          - "every later calculations.lane_requirement evaluation multiplies that lane's per-band capacity by DEGRADED_EQUIPMENT_FACTOR"
      - from: DEGRADED
        to: OUT_OF_SERVICE
        trigger: "POST /equipment-units/{equipment_unit_id}/report-state with state = OUT_OF_SERVICE"
        actor: CheckpointManager
        preconditions: ["EquipmentUnit.state == DEGRADED"]
        side_effects: ["identical to the SERVICEABLE -> OUT_OF_SERVICE cascade above"]
      - from: OUT_OF_SERVICE
        to: SERVICEABLE
        trigger: "POST /equipment-units/{equipment_unit_id}/report-state with state = SERVICEABLE"
        actor: CheckpointManager
        preconditions: ["EquipmentUnit.state != SERVICEABLE"]
        side_effects:
          - "EquipmentUnit.state := SERVICEABLE"
          - "the owning Lane recomputes equipment_state; the lane does NOT auto-reopen and stays PAUSED until an explicit open"
          - "when no non-decommissioned lane of the checkpoint is left with equipment_state == OUT_OF_SERVICE and open_escalation_count == 0, posture recomputes ELEVATED -> NORMAL"
      - from: DEGRADED
        to: SERVICEABLE
        trigger: "POST /equipment-units/{equipment_unit_id}/report-state with state = SERVICEABLE"
        actor: CheckpointManager
        preconditions: ["EquipmentUnit.state == DEGRADED"]
        side_effects: ["EquipmentUnit.state := SERVICEABLE", "the owning Lane recomputes equipment_state := SERVICEABLE, restoring un-derated capacity"]

  - entity: Lane
    initial_state: CLOSED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: CLOSED
        to: OPEN
        trigger: "POST /lanes/{lane_id}/open"
        actor: SupervisoryOfficer
        preconditions:
          - "Lane.lane_state == CLOSED"
          - "when the caller acts as SupervisoryOfficer, X-User-ID must resolve to an Officer holding SUPERVISOR in certifications; a CheckpointManager opens the lane on an opaque identity and this check does not apply"
          - "Checkpoint.posture != SUSPENDED"
          - "CROSS-ENTITY (Lane -> EquipmentUnit): every equipment_type in REQUIRED_EQUIPMENT_BY_LANE_TYPE[lane.lane_type] has at least one EquipmentUnit row on this lane with state IN {SERVICEABLE, DEGRADED}"
          - "for every such required unit, calibration_due_utc > current logical clock"
          - "Checkpoint.available_lane_positions >= Lane.required_officer_count"
        side_effects:
          - "Lane.lane_state := OPEN, opened_at_utc := current logical clock, paused_reason_code := null"
          - "Checkpoint.available_lane_positions -= Lane.required_officer_count and Checkpoint.open_lane_count += 1 (forward leg of invariant lane_position_conservation)"
          - "Checkpoint.posture recomputed by calculations.checkpoint_posture"
          - "Checkpoint.version incremented by 1"
      - from: PAUSED
        to: OPEN
        trigger: "POST /lanes/{lane_id}/open"
        actor: SupervisoryOfficer
        preconditions: ["Lane.lane_state == PAUSED", "identical to the CLOSED -> OPEN precondition list"]
        side_effects:
          - "identical to CLOSED -> OPEN"
          - "every LaneAssignment on this lane with assignment_state == REASSIGN_PENDING transitions REASSIGN_PENDING -> CHECKED_IN and its break_baseline_utc is reset to the current logical clock"
        note: "This edge closes the lane cycle CLOSED -> OPEN -> PAUSED -> OPEN."
      - from: OPEN
        to: PAUSED
        trigger: "POST /lanes/{lane_id}/stand-down with target_state = PAUSED, or system on the equipment-fault cascade, or system on checkpoint suspension"
        actor: SupervisoryOfficer
        preconditions: ["Lane.lane_state == OPEN"]
        side_effects:
          - "Lane.lane_state := PAUSED and paused_reason_code := the supplied reason_code (EQUIPMENT_FAULT when driven by the cascade, SECURITY_INCIDENT when driven by suspension)"
          - "Checkpoint.available_lane_positions += Lane.required_officer_count and Checkpoint.open_lane_count -= 1 (compensating leg of invariant lane_position_conservation)"
          - "every LaneAssignment on this lane with assignment_state == CHECKED_IN transitions CHECKED_IN -> REASSIGN_PENDING; break_state and break_minutes_taken are untouched"
          - "Checkpoint.posture recomputed"
      - from: OPEN
        to: CLOSED
        trigger: "POST /lanes/{lane_id}/stand-down with target_state = CLOSED"
        actor: SupervisoryOfficer
        preconditions: ["Lane.lane_state == OPEN", "no ScreeningReferral on this lane is in state RAISED or IN_PROGRESS"]
        side_effects:
          - "Lane.lane_state := CLOSED, paused_reason_code := the supplied reason_code, opened_at_utc retained"
          - "Checkpoint.available_lane_positions += Lane.required_officer_count and Checkpoint.open_lane_count -= 1"
          - "every LaneAssignment on this lane with assignment_state IN {CHECKED_IN, REASSIGN_PENDING} transitions to RELEASED with released_at_utc := current logical clock; break_state ON_BREAK rows are first ended (break_minutes_taken accrued)"
          - "Checkpoint.posture recomputed"
      - from: PAUSED
        to: CLOSED
        trigger: "POST /lanes/{lane_id}/stand-down with target_state = CLOSED"
        actor: SupervisoryOfficer
        preconditions: ["Lane.lane_state == PAUSED", "no ScreeningReferral on this lane is in state RAISED or IN_PROGRESS"]
        side_effects:
          - "Lane.lane_state := CLOSED"
          - "Checkpoint.available_lane_positions unchanged (a PAUSED lane already released its positions)"
          - "every REASSIGN_PENDING LaneAssignment on this lane transitions to RELEASED"
      - from: CLOSED
        to: DECOMMISSIONED
        trigger: "POST /lanes/{lane_id}/stand-down with target_state = DECOMMISSIONED"
        actor: SupervisoryOfficer
        preconditions:
          - "Lane.lane_state == CLOSED"
          - "no LaneAssignment on this lane has assignment_state IN {SCHEDULED, CHECKED_IN, REASSIGN_PENDING}"
        side_effects:
          - "Lane.lane_state := DECOMMISSIONED"
          - "the lane leaves the candidate pool of calculations.lane_requirement and frees its position_index for reuse"
          - "Checkpoint.total_lane_positions is NOT changed, so invariant lane_position_conservation still holds"

  - entity: Officer
    initial_state: OFF_DUTY
    terminal_states: [SEPARATED]
    transitions:
      - from: OFF_DUTY
        to: ON_DUTY
        trigger: "POST /officers/{officer_id}/duty-status with duty_status = ON_DUTY"
        actor: CheckpointManager
        preconditions: ["Officer.duty_status == OFF_DUTY"]
        side_effects: ["Officer.duty_status := ON_DUTY", "Officer.version incremented by 1"]
      - from: ON_DUTY
        to: ON_BREAK
        trigger: "system — POST /lane-assignments/{lane_assignment_id}/break with action = START on any of this officer's assignments"
        actor: system
        preconditions: ["Officer.duty_status == ON_DUTY"]
        side_effects: ["Officer.duty_status := ON_BREAK", "Officer.version incremented by 1"]
      - from: ON_BREAK
        to: ON_DUTY
        trigger: "system — POST /lane-assignments/{lane_assignment_id}/break with action = END"
        actor: system
        preconditions: ["Officer.duty_status == ON_BREAK"]
        side_effects: ["Officer.duty_status := ON_DUTY", "Officer.version incremented by 1"]
        note: "Closes the officer break cycle ON_DUTY -> ON_BREAK -> ON_DUTY."
      - from: ON_DUTY
        to: OFF_DUTY
        trigger: "POST /officers/{officer_id}/duty-status with duty_status = OFF_DUTY; OR system — the officer's last live LaneAssignment is retired (SCHEDULED -> CANCELLED, or CHECKED_IN / REASSIGN_PENDING -> RELEASED) by a plan supersede or a plan close, driving Officer.committed_duty_minutes down to 0 (see StaffingPlan SUBMITTED -> APPROVED side effect LINK 3)"
        actor: "CheckpointManager (explicit call) or system (ledger reached zero)"
        preconditions: ["Officer.duty_status == ON_DUTY", "no LaneAssignment for this officer has assignment_state IN {CHECKED_IN, REASSIGN_PENDING}", "for the system-driven variant only: Officer.committed_duty_minutes == 0 after the recomputation"]
        side_effects: ["Officer.duty_status := OFF_DUTY", "Officer.version incremented by 1"]
      - from: OFF_DUTY
        to: SEPARATED
        trigger: "POST /officers/{officer_id}/duty-status with duty_status = SEPARATED"
        actor: CheckpointManager
        preconditions:
          - "Officer.duty_status == OFF_DUTY"
          - "no LaneAssignment for this officer has assignment_state IN {SCHEDULED, CHECKED_IN, REASSIGN_PENDING}"
          - "no SurgeDetail for this officer has state IN {REQUESTED, APPROVED}"
        side_effects: ["Officer.duty_status := SEPARATED (terminal — the officer can no longer be assigned)", "Officer.version incremented by 1"]

  - entity: StaffingPlan
    initial_state: DRAFT
    terminal_states: [CLOSED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /staffing-plans/{staffing_plan_id}/submit"
        actor: StaffingPlanner
        preconditions:
          - "StaffingPlan.state == DRAFT"
          - "at least one LaneAssignment on this plan has assignment_state != CANCELLED"
          - "for every TimeBand referenced by a non-cancelled assignment, required_standard_lanes is non-null (the band has been forecast) and the count of distinct lane_id values of lane_type STANDARD on that band is >= MIN_OPEN_LANES.STANDARD"
        side_effects:
          - "StaffingPlan.state := SUBMITTED, submitted_at_utc := current logical clock"
          - "calculations.staffing_plan_cost runs end-to-end and writes planned_regular_minutes, planned_overtime_minutes, base_cost_cents, overtime_cost_cents, detail_cost_cents, subtotal_cents, admin_fee_rate, admin_fee_cents, total_cost_cents"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /staffing-plans/{staffing_plan_id}/decision with decision = APPROVE"
        actor: DutyManager
        preconditions:
          - "StaffingPlan.state == SUBMITTED"
          - "SEGREGATION OF DUTIES: X-User-ID != StaffingPlan.prepared_by_user_id"
          - "for every officer on the plan, overtime_i from calculations.staffing_plan_cost step 1 <= Officer.weekly_overtime_minutes_cap"
          - "StaffingPlan.total_cost_cents <= Checkpoint.plan_cost_cap_cents"
        side_effects:
          - "LINK 1 — StaffingPlan.state := APPROVED, approved_by_user_id := X-User-ID, approved_at_utc := current logical clock; and every OTHER StaffingPlan with the same checkpoint_id and operational_date whose state IN {APPROVED, ACTIVATED} transitions to SUPERSEDED with superseded_by_staffing_plan_id := this plan's id"
          - "LINK 2 (caused by link 1) — because a plan became SUPERSEDED, every LaneAssignment on that superseded plan with assignment_state == SCHEDULED transitions SCHEDULED -> CANCELLED, and every row with assignment_state IN {CHECKED_IN, REASSIGN_PENDING} transitions to RELEASED"
          - "LINK 3 (caused by link 2) — because those assignments left {SCHEDULED, CHECKED_IN, REASSIGN_PENDING}, each affected Officer.committed_duty_minutes is recomputed downward and every Officer whose committed_duty_minutes reaches 0 while duty_status == ON_DUTY is transitioned ON_DUTY -> OFF_DUTY"
          - "Checkpoint.version incremented by 1 (this is what makes a previously observed expected_checkpoint_version stale)"
        note: "This is the depth-3 transitive cascade `plan_approval_supersede`, triggered by a different transition than the equipment cascade."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /staffing-plans/{staffing_plan_id}/decision with decision = REJECT"
        actor: DutyManager
        preconditions: ["StaffingPlan.state == SUBMITTED", "SEGREGATION OF DUTIES: X-User-ID != StaffingPlan.prepared_by_user_id", "rejection_reason_code supplied in the request body"]
        side_effects:
          - "StaffingPlan.state := REJECTED, rejection_reason_code := the supplied rejection_reason_code"
          - "cost fields are retained so the planner can see what was rejected"
          - "no LaneAssignment is touched"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /staffing-plans/{staffing_plan_id}/revise"
        actor: StaffingPlanner
        preconditions: ["StaffingPlan.state == REJECTED"]
        side_effects:
          - "StaffingPlan.state := DRAFT, revision_number += 1, rejection_reason_code := null"
          - "all nine cost fields (planned_regular_minutes .. total_cost_cents) reset to null"
          - "submitted_at_utc reset to null"
        note: "Closes the plan revision cycle DRAFT -> SUBMITTED -> REJECTED -> DRAFT."
      - from: APPROVED
        to: ACTIVATED
        trigger: "POST /staffing-plans/{staffing_plan_id}/lifecycle with action = ACTIVATE"
        actor: CheckpointManager
        preconditions:
          - "StaffingPlan.state == APPROVED"
          - "Checkpoint.posture != SUSPENDED"
          - "StaffingPlan.operational_date == the UTC calendar date of the current logical clock"
        side_effects: ["StaffingPlan.state := ACTIVATED, activated_at_utc := current logical clock", "the plan's LaneAssignment rows become eligible for check-in"]
      - from: ACTIVATED
        to: CLOSED
        trigger: "POST /staffing-plans/{staffing_plan_id}/lifecycle with action = CLOSE"
        actor: CheckpointManager
        preconditions: ["StaffingPlan.state == ACTIVATED"]
        side_effects:
          - "StaffingPlan.state := CLOSED, closed_at_utc := current logical clock"
          - "every LaneAssignment on this plan with assignment_state == SCHEDULED transitions to CANCELLED; every row with assignment_state IN {CHECKED_IN, REASSIGN_PENDING} transitions to RELEASED (ON_BREAK rows are ended first so break_minutes_taken accrues)"
          - "each affected Officer.committed_duty_minutes recomputed"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system — another StaffingPlan for the same (checkpoint_id, operational_date) reaches APPROVED"
        actor: system
        preconditions: ["StaffingPlan.state IN {APPROVED, ACTIVATED}"]
        side_effects: ["see links 1-3 of the plan_approval_supersede cascade above"]
      - from: ACTIVATED
        to: SUPERSEDED
        trigger: "system — another StaffingPlan for the same (checkpoint_id, operational_date) reaches APPROVED"
        actor: system
        preconditions: ["StaffingPlan.state == ACTIVATED"]
        side_effects: ["see links 1-3 of the plan_approval_supersede cascade above"]

  - entity: LaneAssignment
    initial_state: SCHEDULED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      # ---- AXIS 1: assignment_state -------------------------------------------
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /lane-assignments/{lane_assignment_id}/duty with action = CHECK_IN"
        actor: ScreeningOfficer
        preconditions:
          - "LaneAssignment.assignment_state == SCHEDULED"
          - "X-User-ID == LaneAssignment.officer_id when acting as an entity_backed role (ScreeningOfficer / SupervisoryOfficer); a DutyManager acts on behalf of the officer and is exempt from the ownership comparison (see validations priority 7, which binds entity_backed roles only)"
          - "Checkpoint.posture != SUSPENDED"
          - "CROSS-ENTITY (LaneAssignment -> StaffingPlan): the assignment's StaffingPlan.state == ACTIVATED"
          - "Officer.duty_status != SEPARATED"
          - "the officer's projected weekly overtime under the CHRONOLOGICAL_ACTUAL duty ledger, including this assignment's planned_minutes, <= Officer.weekly_overtime_minutes_cap"
        side_effects:
          - "LaneAssignment.assignment_state := CHECKED_IN, checked_in_at_utc := current logical clock, break_baseline_utc := current logical clock"
          - "break_state remains on its own axis and is re-evaluated by the NOT_DUE -> DUE system rule"
          - "Officer.committed_duty_minutes is unchanged (SCHEDULED and CHECKED_IN both count toward it — the conserved quantity does not move on check-in)"
      - from: CHECKED_IN
        to: RELEASED
        trigger: "POST /lane-assignments/{lane_assignment_id}/duty with action = RELEASE"
        actor: ScreeningOfficer
        preconditions: ["LaneAssignment.assignment_state == CHECKED_IN", "break_state != ON_BREAK", "X-User-ID == LaneAssignment.officer_id when acting as ScreeningOfficer; a SupervisoryOfficer may release any assignment on a lane of their checkpoint"]
        side_effects:
          - "LaneAssignment.assignment_state := RELEASED, released_at_utc := current logical clock"
          - "actual_minutes computed as max(0, released_at_utc - checked_in_at_utc in whole minutes) - break_minutes_taken"
          - "Officer.committed_duty_minutes recomputed downward by this row's planned_minutes"
      - from: CHECKED_IN
        to: REASSIGN_PENDING
        trigger: "system — the assignment's Lane leaves OPEN (stand-down PAUSED, equipment-fault cascade link 2, or checkpoint suspension)"
        actor: system
        preconditions: ["LaneAssignment.assignment_state == CHECKED_IN"]
        side_effects: ["LaneAssignment.assignment_state := REASSIGN_PENDING", "break_state, break_minutes_taken and break_baseline_utc are all preserved", "Officer.committed_duty_minutes unchanged (REASSIGN_PENDING still counts)"]
      - from: REASSIGN_PENDING
        to: CHECKED_IN
        trigger: "system — the assignment's Lane transitions PAUSED -> OPEN"
        actor: system
        preconditions: ["LaneAssignment.assignment_state == REASSIGN_PENDING", "the assignment's StaffingPlan.state == ACTIVATED"]
        side_effects: ["LaneAssignment.assignment_state := CHECKED_IN", "break_baseline_utc := current logical clock so the on-position run restarts"]
        note: "Closes the reassignment cycle CHECKED_IN -> REASSIGN_PENDING -> CHECKED_IN."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /lane-assignments/{lane_assignment_id}/duty with action = CANCEL, or system on plan supersede/close"
        actor: StaffingPlanner
        preconditions: ["LaneAssignment.assignment_state == SCHEDULED"]
        side_effects:
          - "LaneAssignment.assignment_state := CANCELLED"
          - "Officer.committed_duty_minutes recomputed downward by this row's planned_minutes"
          - "the row leaves the input set of both duty-ledger variants and of calculations.staffing_plan_cost"
      - from: REASSIGN_PENDING
        to: RELEASED
        trigger: "system — the assignment's Lane transitions to CLOSED, or the plan closes"
        actor: system
        preconditions: ["LaneAssignment.assignment_state == REASSIGN_PENDING"]
        side_effects: ["LaneAssignment.assignment_state := RELEASED, released_at_utc := current logical clock", "Officer.committed_duty_minutes recomputed downward"]
      # ---- AXIS 2: break_state (independent of axis 1) -------------------------
      - from: NOT_DUE
        to: DUE
        trigger: "system — re-evaluated at the start of handling any request that reads or mutates this LaneAssignment: (current logical clock - break_baseline_utc) in whole minutes >= MAX_CONSECUTIVE_ON_POSITION_MINUTES"
        actor: system
        preconditions: ["LaneAssignment.break_state == NOT_DUE", "LaneAssignment.assignment_state IN {CHECKED_IN, REASSIGN_PENDING}", "break_baseline_utc is non-null"]
        side_effects: ["LaneAssignment.break_state := DUE", "assignment_state is untouched — the two axes advance independently"]
      - from: DUE
        to: ON_BREAK
        trigger: "POST /lane-assignments/{lane_assignment_id}/break with action = START"
        actor: ScreeningOfficer
        preconditions: ["LaneAssignment.break_state == DUE", "LaneAssignment.assignment_state == CHECKED_IN", "X-User-ID == LaneAssignment.officer_id"]
        side_effects:
          - "LaneAssignment.break_state := ON_BREAK, break_started_at_utc := current logical clock"
          - "the officer transitions ON_DUTY -> ON_BREAK"
          - "assignment_state stays CHECKED_IN"
      - from: ON_BREAK
        to: COMPLETED
        trigger: "POST /lane-assignments/{lane_assignment_id}/break with action = END"
        actor: ScreeningOfficer
        preconditions: ["LaneAssignment.break_state == ON_BREAK", "X-User-ID == LaneAssignment.officer_id"]
        side_effects:
          - "LaneAssignment.break_state := COMPLETED, break_ended_at_utc := current logical clock"
          - "break_minutes_taken += floor((break_ended_at_utc - break_started_at_utc) in seconds / 60)"
          - "break_baseline_utc := break_ended_at_utc, restarting the on-position run"
          - "the officer transitions ON_BREAK -> ON_DUTY"
      - from: COMPLETED
        to: DUE
        trigger: "system — same re-evaluation rule as NOT_DUE -> DUE, measured from the new break_baseline_utc"
        actor: system
        preconditions: ["LaneAssignment.break_state == COMPLETED", "LaneAssignment.assignment_state IN {CHECKED_IN, REASSIGN_PENDING}", "(current logical clock - break_baseline_utc) >= MAX_CONSECUTIVE_ON_POSITION_MINUTES"]
        side_effects: ["LaneAssignment.break_state := DUE"]
        note: "Closes the break cycle DUE -> ON_BREAK -> COMPLETED -> DUE on the same row while assignment_state stays CHECKED_IN."

  - entity: EscalationTicket
    initial_state: RAISED
    terminal_states: [RESOLVED_LANE_OPENED, RESOLVED_DIVERTED, EXPIRED]
    transitions:
      - from: NONE
        to: RAISED
        trigger: "system — POST /checkpoints/{checkpoint_id}/wait-observations whose recomputed publication breaches the threshold for lane_type and drives Checkpoint.consecutive_breach_count_<lane_type> to exactly ESCALATION_BREACH_COUNT_REQUIRED"
        actor: system
        preconditions:
          - "the observation's published_wait_minutes_snapshot >= the checkpoint's threshold for the observation's lane_type"
          - "Checkpoint.consecutive_breach_count_<lane_type> == ESCALATION_BREACH_COUNT_REQUIRED after this observation"
          - "no EscalationTicket for this checkpoint with trigger_reason WAIT_THRESHOLD_BREACH and lane_type_scope == this lane_type is in state RAISED or ACKNOWLEDGED"
        side_effects:
          - "a new EscalationTicket row is created in state RAISED with trigger_reason WAIT_THRESHOLD_BREACH, lane_type_scope := the observation's lane_type, published_wait_minutes_at_raise := the snapshot, raised_at_utc := current logical clock"
          - "Checkpoint.posture recomputed (open_escalation_count increased by 1)"
        note: "Creation edge. The cumulative-threshold nature matters: one breaching observation does NOT raise a ticket, the second consecutive one does; a single non-breaching observation resets the counter to 0."
      - from: RAISED
        to: ACKNOWLEDGED
        trigger: "POST /escalation-tickets/{escalation_ticket_id}/acknowledge"
        actor: SupervisoryOfficer
        preconditions: ["EscalationTicket.state == RAISED", "the acting Officer has SUPERVISOR in certifications"]
        side_effects: ["state := ACKNOWLEDGED, acknowledged_at_utc := current logical clock, acknowledged_by_officer_id := X-User-ID", "the ticket still counts toward open_escalation_count, so posture does not change"]
      - from: ACKNOWLEDGED
        to: RESOLVED_LANE_OPENED
        trigger: "POST /escalation-tickets/{escalation_ticket_id}/resolve with resolution = LANE_OPENED"
        actor: SupervisoryOfficer
        preconditions:
          - "EscalationTicket.state == ACKNOWLEDGED"
          - "resolved_lane_id supplied in the request body; that Lane.checkpoint_id == EscalationTicket.checkpoint_id; that Lane.lane_state == OPEN"
          - "diverted_pax_count is absent"
        side_effects:
          - "state := RESOLVED_LANE_OPENED, resolved_lane_id := the supplied resolved_lane_id, resolved_at_utc := current logical clock"
          - "Checkpoint.diverted_pax_total is NOT changed (branch-specific)"
          - "Checkpoint.posture recomputed (open_escalation_count decreased by 1), which may move SURGE -> ELEVATED or ELEVATED -> NORMAL"
      - from: ACKNOWLEDGED
        to: RESOLVED_DIVERTED
        trigger: "POST /escalation-tickets/{escalation_ticket_id}/resolve with resolution = MITIGATED_BY_DIVERSION"
        actor: SupervisoryOfficer
        preconditions:
          - "EscalationTicket.state == ACKNOWLEDGED"
          - "diverted_pax_count supplied and >= 1"
          - "resolved_lane_id is absent"
        side_effects:
          - "state := RESOLVED_DIVERTED, diverted_pax_count stored, resolved_at_utc := current logical clock"
          - "Checkpoint.diverted_pax_total += diverted_pax_count (branch-specific — this is the leg that feeds calculations.throughput_and_diversion_index)"
          - "resolved_lane_id stays null"
          - "Checkpoint.posture recomputed"
        note: "Divergent side-effect sets across the two resolutions are what makes this machine a branching fork rather than a linear pipeline."
      - from: RAISED
        to: EXPIRED
        trigger: "system — a later POST /checkpoints/{checkpoint_id}/wait-observations for the same lane_type recomputes a publication strictly below the threshold"
        actor: system
        preconditions:
          - "EscalationTicket.state == RAISED (an ACKNOWLEDGED ticket is never auto-expired)"
          - "EscalationTicket.trigger_reason == WAIT_THRESHOLD_BREACH"
          - "the new observation's published_wait_minutes_snapshot < the checkpoint's threshold for that lane_type"
        side_effects:
          - "state := EXPIRED, resolved_at_utc := current logical clock"
          - "Checkpoint.consecutive_breach_count_<lane_type> := 0"
          - "Checkpoint.posture recomputed"

  - entity: ScreeningReferral
    initial_state: RAISED
    terminal_states: [CLEARED, REFERRED_LEO, DENIED_ENTRY, WITHDRAWN]
    transitions:
      - from: RAISED
        to: IN_PROGRESS
        trigger: "POST /screening-referrals/{screening_referral_id}/begin"
        actor: SupervisoryOfficer
        preconditions:
          - "ScreeningReferral.state == RAISED"
          - "the acting Officer has SUPERVISOR in certifications"
          - "SEGREGATION OF DUTIES: resolving_officer_id != ScreeningReferral.detecting_officer_id"
          - "the nominated resolving Officer.duty_status == ON_DUTY"
          - "when referral_reason IN {DISABILITY_ACCOMMODATION, MEDICAL_DEVICE, YOUNG_CHILD}: the resolving Officer has SPECIAL_PROCEDURES in certifications"
          - "when referral_reason == ALARM: the referral's Lane has at least one EquipmentUnit of equipment_type ETD with state IN {SERVICEABLE, DEGRADED}, and the resolving Officer has ETD_RESOLUTION in certifications"
          - "the referral's Lane.lane_state == OPEN"
          - "Checkpoint.posture != SUSPENDED"
        side_effects: ["state := IN_PROGRESS, resolving_officer_id stored, started_at_utc := current logical clock", "secondary_slot_held stays true — the slot was reserved at creation and is not double-counted"]
      - from: IN_PROGRESS
        to: CLEARED
        trigger: "POST /screening-referrals/{screening_referral_id}/resolve with outcome = CLEARED"
        actor: ScreeningOfficer
        preconditions: ["ScreeningReferral.state == IN_PROGRESS", "X-User-ID == ScreeningReferral.resolving_officer_id when acting as ScreeningOfficer; a SupervisoryOfficer may resolve any referral on their checkpoint"]
        side_effects:
          - "state := CLEARED, resolved_at_utc := current logical clock, secondary_slot_held := false"
          - "Checkpoint.secondary_slots_in_use -= 1 (compensating leg of invariant secondary_slot_conservation)"
          - "Checkpoint.cleared_referral_count += 1"
      - from: IN_PROGRESS
        to: REFERRED_LEO
        trigger: "POST /screening-referrals/{screening_referral_id}/resolve with outcome = REFERRED_LEO"
        actor: SupervisoryOfficer
        preconditions: ["ScreeningReferral.state == IN_PROGRESS", "the acting Officer has SUPERVISOR in certifications", "note supplied"]
        side_effects:
          - "state := REFERRED_LEO, resolution_note stored, secondary_slot_held := false"
          - "Checkpoint.secondary_slots_in_use -= 1"
          - "Checkpoint.leo_referral_count += 1"
          - "the referral's Lane transitions OPEN -> PAUSED with paused_reason_code SECURITY_INCIDENT when referral_reason == ALARM (branch-specific cascade), which in turn flips that lane's CHECKED_IN assignments to REASSIGN_PENDING and restores the lane's positions"
      - from: IN_PROGRESS
        to: DENIED_ENTRY
        trigger: "POST /screening-referrals/{screening_referral_id}/resolve with outcome = DENIED_ENTRY"
        actor: SupervisoryOfficer
        preconditions: ["ScreeningReferral.state == IN_PROGRESS", "the acting Officer has SUPERVISOR in certifications", "note supplied"]
        side_effects:
          - "state := DENIED_ENTRY, resolution_note stored, secondary_slot_held := false"
          - "Checkpoint.secondary_slots_in_use -= 1"
          - "Checkpoint.denied_entry_count += 1 AND Checkpoint.diverted_pax_total += 1 (branch-specific — a denied passenger leaves the queue and counts as diverted demand)"
      - from: RAISED
        to: WITHDRAWN
        trigger: "POST /screening-referrals/{screening_referral_id}/resolve with outcome = WITHDRAWN"
        actor: SupervisoryOfficer
        preconditions: ["ScreeningReferral.state == RAISED (a referral already IN_PROGRESS can no longer be withdrawn)", "the acting Officer has SUPERVISOR in certifications"]
        side_effects:
          - "state := WITHDRAWN, resolved_at_utc := current logical clock, secondary_slot_held := false"
          - "Checkpoint.secondary_slots_in_use -= 1"
          - "no counter other than secondary_slots_in_use moves"

  - entity: SurgeDetail
    initial_state: REQUESTED
    terminal_states: [DENIED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /surge-details/{surge_detail_id}/decision with decision = APPROVE"
        actor: DutyManager
        preconditions:
          - "SurgeDetail.state == REQUESTED"
          - "SEGREGATION OF DUTIES: X-User-ID != SurgeDetail.requested_by_user_id"
          - "the SurgeDetail's StaffingPlan.state IN {SUBMITTED, APPROVED, ACTIVATED}"
          - "Officer.duty_status != SEPARATED"
        side_effects:
          - "state := APPROVED, decided_by_user_id := X-User-ID, decided_at_utc := current logical clock"
          - "detail_cost_cents := round_half_up(detail_minutes * DETAIL_RATE_CENTS_PER_MINUTE)"
          - "FORWARD LEG of invariant officer_duty_minute_conservation: Officer.approved_detail_minutes += detail_minutes and Officer.committed_duty_minutes += detail_minutes; Officer.version incremented by 1"
          - "calculations.staffing_plan_cost is recomputed immediately for the owning plan, so detail_cost_cents enters subtotal_cents (and can move admin_fee_rate to a different tier) within this same response"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /surge-details/{surge_detail_id}/decision with decision = DENY"
        actor: DutyManager
        preconditions: ["SurgeDetail.state == REQUESTED", "SEGREGATION OF DUTIES: X-User-ID != SurgeDetail.requested_by_user_id", "denial_reason_code supplied in the request body"]
        side_effects: ["state := DENIED, denial_reason_code := reason_code, decided_at_utc := current logical clock", "detail_cost_cents stays null", "Officer.committed_duty_minutes unchanged"]
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /surge-details/{surge_detail_id}/cancel"
        actor: DutyManager
        preconditions: ["SurgeDetail.state == APPROVED"]
        side_effects:
          - "state := CANCELLED, cancelled_at_utc := current logical clock, detail_cost_cents := null"
          - "COMPENSATING LEG of invariant officer_duty_minute_conservation: Officer.approved_detail_minutes -= detail_minutes and Officer.committed_duty_minutes -= detail_minutes, restoring both to their exact pre-approval values; Officer.version incremented by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on a parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-checkpoint
    parent_entity: Checkpoint
    write_endpoint: "POST /staffing-plans"
    occ_field: "expected_checkpoint_version"
    description: |
      Creating a StaffingPlan against a Checkpoint whose version has advanced
      since the client last read it is rejected with a stale-version error. The
      product deliberately allows a second plan for the same (checkpoint,
      operational_date) to be created and, once approved, to supersede the prior
      one, so a second sequential create against unchanged state would itself
      legitimately succeed; OCC is what pins the planner's view of the floor
      (lane roster, posture, thresholds, an approval that already superseded a
      plan) to the version it actually observed.
    error_id: ERR_STALE_CHECKPOINT_VERSION
    http_status: 412
  - rule_id: surge-detail-create-stale-officer
    parent_entity: Officer
    write_endpoint: "POST /surge-details"
    occ_field: "expected_officer_version"
    description: |
      Creating a SurgeDetail against an Officer whose version has advanced since
      the client last read it is rejected with a stale-version error. Multiple
      details for the same officer are legitimate, so a second sequential create
      against unchanged state would succeed; OCC pins the requester's view of the
      officer's committed_duty_minutes and approved_detail_minutes, both of which
      any detail approval, cancellation or assignment cascade silently moves.
    error_id: ERR_STALE_OFFICER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: time_band_pax_forecast
    trigger: "POST /time-bands/{time_band_id}/forecast; writes TimeBand.forecast_pax_count, forecast_variant and forecast_computed_at_utc"
    algorithm: forward_looking
    formula: |
      INPUT SET (both variants):
        flights = FlightScheduleEntry rows where checkpoint_id == band.checkpoint_id
                  AND status == SCHEDULED           # CANCELLED rows are excluded
        processed in order (scheduled_departure_utc ASC, flight_number ASC)   # never by id
      band interval is HALF-OPEN: [band.band_start_utc, band.band_end_utc), always 30 minutes.
      overlap_minutes(a0, a1, b0, b1) = max(0, (min(a1, b1) - max(a0, b0)) in whole minutes)
        # both arguments are half-open intervals, so touching endpoints contribute 0

      for each flight f:
        pax_f = round_half_up(f.seats_sold * f.load_factor_pct / 100)    # == f.projected_pax_count
        curve = ShowUpCurve where id == f.show_up_curve_id

        if variant == SCHEDULE_ONLY:
          w0   = f.scheduled_departure_utc - curve.window_start_minutes_before minutes
          w1   = f.scheduled_departure_utc - curve.window_end_minutes_before   minutes
          span = curve.window_start_minutes_before - curve.window_end_minutes_before
          contrib_f = pax_f * overlap_minutes(band_start, band_end, w0, w1) / span
          # bucket shares, connecting_pax_discount_pct and seasonal_multiplier are ALL ignored

        else:   # variant == CURVE_BLENDED
          contrib_f = 0
          for each bucket b of curve.buckets, ordered by minutes_before_start DESC:
            b0     = f.scheduled_departure_utc - b.minutes_before_start minutes
            b1     = f.scheduled_departure_utc - b.minutes_before_end   minutes
            b_span = b.minutes_before_start - b.minutes_before_end
            contrib_f += pax_f * (b.share_pct / 100)
                         * overlap_minutes(band_start, band_end, b0, b1) / b_span
          contrib_f = contrib_f * (1 - checkpoint.connecting_pax_discount_pct / 100)
          contrib_f = contrib_f * band.seasonal_multiplier

        total += round_half_up(contrib_f)    # <-- ROUNDING ORDER IS PINNED:
                                            #     round EACH (flight, band) contribution to a
                                            #     whole passenger FIRST, then sum. Summing the
                                            #     exact contributions and rounding once at the
                                            #     end is WRONG and yields a different integer.
      forecast_pax_count = total
    input_set: "FlightScheduleEntry rows for the band's checkpoint with status == SCHEDULED; CANCELLED flights contribute nothing. Every flight is evaluated even when its show-up window does not intersect the band (contribution 0)."
    constants:
      BAND_MINUTES: 30
    precision: "contrib_f is carried at full decimal precision; each per-flight contribution is rounded to an integer with round_half_up; the band total is the sum of those integers"
    variants:
      - name: SCHEDULE_ONLY
        when: "D-1 planning: POST /time-bands/{time_band_id}/forecast with variant = SCHEDULE_ONLY"
        difference: "Spreads each flight's projected_pax_count UNIFORMLY across the curve's whole [window_end_minutes_before, window_start_minutes_before] window, and applies NEITHER connecting_pax_discount_pct NOR seasonal_multiplier."
      - name: CURVE_BLENDED
        when: "day-of operations: POST /time-bands/{time_band_id}/forecast with variant = CURVE_BLENDED"
        difference: "Distributes each flight's projected_pax_count across the curve's individual buckets weighted by share_pct, THEN removes connecting_pax_discount_pct, THEN applies seasonal_multiplier. On identical inputs the two variants return different integers (e.g. 100 vs 80 for the worked fixture in SCAFFOLD_DIFFICULTY_DESIGN.yaml)."

  - name: lane_requirement
    trigger: "POST /time-bands/{time_band_id}/forecast (immediately after time_band_pax_forecast) and on every GET /time-bands read via the stored fields; writes TimeBand.required_standard_lanes, required_expedited_lanes, unmet_standard_demand, unmet_expedited_demand"
    algorithm: waterfall_allocation
    formula: |
      D = band.forecast_pax_count                       # output of time_band_pax_forecast
      expedited_demand = ceil(D * band.expedited_share_pct / 100)
      standard_demand  = D - expedited_demand           # remainder, never recomputed from (100 - share)

      for lane_type in {STANDARD, EXPEDITED}:
        demand = standard_demand or expedited_demand
        candidates = Lane rows where checkpoint_id == band.checkpoint_id
                     AND lane_type == this lane_type
                     AND lane_state IN {CLOSED, OPEN, PAUSED}        # DECOMMISSIONED excluded
                     ordered by position_index ASC                   # sole ordering key, never id
        capacity(lane) =
           0                                                       if lane.equipment_state == OUT_OF_SERVICE
           else floor( LANE_BASE_THROUGHPUT_PPH[lane_type] * BAND_MINUTES / 60
                       * (DEGRADED_EQUIPMENT_FACTOR if lane.equipment_state == DEGRADED else 1.0)
                       * (SURGE_POSTURE_DERATE      if checkpoint.posture == SURGE    else 1.0) )
        # waterfall: fill lanes in position_index order until cumulative capacity covers demand
        cumulative = 0; consumed = 0
        for lane in candidates:
          if cumulative >= demand: break
          cumulative += capacity(lane); consumed += 1
        required = max(MIN_OPEN_LANES[lane_type], consumed)
        required = min(required, count(candidates))
        unmet    = max(0, demand - cumulative)
      required_standard_lanes  = required for STANDARD
      required_expedited_lanes = required for EXPEDITED
      unmet_standard_demand    = unmet for STANDARD
      unmet_expedited_demand   = unmet for EXPEDITED
    input_set: "Lane rows of the band's checkpoint with lane_state IN {CLOSED, OPEN, PAUSED}; a lane's capacity depends on its own equipment_state AND on the checkpoint's current posture, so the same band re-forecast after a posture change can require more lanes."
    constants:
      LANE_BASE_THROUGHPUT_PPH: { STANDARD: 180, EXPEDITED: 300 }
      BAND_MINUTES: 30
      DEGRADED_EQUIPMENT_FACTOR: 0.80
      SURGE_POSTURE_DERATE: 0.90
      MIN_OPEN_LANES: { STANDARD: 1, EXPEDITED: 0 }
    precision: "capacity is floored to a whole passenger per lane per band; expedited_demand is ceilinged; required counts are integers"
    variants: []

  - name: officer_duty_ledger
    trigger: "GET /officers/{officer_id}/duty-ledger?variant=...; also evaluated internally on POST /lane-assignments and POST /lane-assignments/{id}/duty to enforce the overtime cap"
    algorithm: chronological
    formula: |
      variant FORWARD_LOOKING_PLANNED:
        rows = LaneAssignment where officer_id == officer
               AND assignment_state IN {SCHEDULED, CHECKED_IN, RELEASED}
               # REASSIGN_PENDING and CANCELLED are excluded
        worked_minutes = SUM over rows of row.planned_minutes
          # planned_minutes = whole minutes of the assignment's TimeBand
          #                   [band_start_utc, band_end_utc) == BAND_MINUTES
          # breaks are NOT deducted: a planned break is paid position time

      variant CHRONOLOGICAL_ACTUAL:
        rows = LaneAssignment where officer_id == officer
               AND assignment_state IN {CHECKED_IN, RELEASED}
               # SCHEDULED rows have not happened yet and are excluded
               replayed in order (checked_in_at_utc ASC, created_at ASC)
        for each row:
          elapsed = whole minutes from row.checked_in_at_utc to
                    (row.released_at_utc if present else current_utc)
          worked_minutes += max(0, elapsed - row.break_minutes_taken)
          # actual breaks ARE deducted

      approved_detail_minutes = SUM of SurgeDetail.detail_minutes
                                where officer_id == officer AND state == APPROVED
      total_minutes    = worked_minutes + approved_detail_minutes
      regular_minutes  = min(total_minutes, officer.weekly_regular_minutes_cap)
      overtime_minutes = max(0, total_minutes - officer.weekly_regular_minutes_cap)
      cap_headroom_minutes = officer.weekly_overtime_minutes_cap - overtime_minutes
      # ERR_OVERTIME_CAP_EXCEEDED is raised when a prospective write would drive
      # cap_headroom_minutes strictly below 0.
    input_set: "LaneAssignment rows of the officer, filtered by assignment_state per variant, plus SurgeDetail rows in state APPROVED. Cancelled assignments and denied/cancelled details never contribute."
    constants:
      BAND_MINUTES: 30
    precision: "all durations are whole minutes; partial minutes are truncated toward zero when computing elapsed"
    variants:
      - name: FORWARD_LOOKING_PLANNED
        when: "capacity planning and the pre-write overtime-cap check on POST /lane-assignments — the default when ?variant= is omitted"
        difference: "Counts SCHEDULED rows, uses each row's planned_minutes (band length), and does NOT subtract break_minutes_taken."
      - name: CHRONOLOGICAL_ACTUAL
        when: "payroll reconciliation: GET /officers/{officer_id}/duty-ledger?variant=CHRONOLOGICAL_ACTUAL"
        difference: "Ignores SCHEDULED rows entirely, measures elapsed wall-clock minutes between checked_in_at_utc and released_at_utc (or the logical clock for an open assignment), and SUBTRACTS break_minutes_taken. On the same officer the two variants disagree whenever a break was taken or an assignment is still SCHEDULED."

  - name: staffing_plan_cost
    trigger: "POST /staffing-plans/{staffing_plan_id}/submit and every subsequent write that changes the plan's assignments or approved details; readable at GET /staffing-plans/{staffing_plan_id}/cost-summary"
    algorithm: tiered_pricing
    formula: |
      STEP 1 — per-officer minute split (officers ordered by badge_number ASC):
        for each distinct officer o appearing in the plan's LaneAssignment rows
        with assignment_state IN {SCHEDULED, CHECKED_IN, RELEASED}:
          o_minutes  = SUM of planned_minutes over those rows
          # the split is per PLAN, against the officer's weekly regular cap
          o_regular  = min(o_minutes, o.weekly_regular_minutes_cap)
          o_overtime = max(0, o_minutes - o.weekly_regular_minutes_cap)
      STEP 2 — planned_regular_minutes  = SUM of o_regular
      STEP 3 — planned_overtime_minutes = SUM of o_overtime
      STEP 4 — base_cost_cents = SUM over officers of
                 round_half_up(o_regular * o.base_rate_cents_per_minute)
               # ROUNDING ORDER PINNED: round PER OFFICER, then sum
      STEP 5 — overtime_cost_cents = SUM over officers of
                 round_half_up(o_overtime * o.base_rate_cents_per_minute * OVERTIME_MULTIPLIER)
      STEP 6 — detail_cost_cents = SUM over SurgeDetail rows of this plan with state == APPROVED of
                 (detail_minutes * DETAIL_RATE_CENTS_PER_MINUTE)
               # DENIED, REQUESTED and CANCELLED details contribute 0
      STEP 7 — subtotal_cents = base_cost_cents + overtime_cost_cents + detail_cost_cents
      STEP 8 — admin_fee_rate = tier rate selected by subtotal_cents ONLY:
                 subtotal_cents <  5000                        -> 0.060
                 5000 <= subtotal_cents <= 19999               -> 0.045
                 subtotal_cents >= 20000                       -> 0.030
               admin_fee_cents = round_half_up(subtotal_cents * admin_fee_rate)
               total_cost_cents = subtotal_cents + admin_fee_cents
      # The tier is chosen from the SUBTOTAL, never from total_cost_cents; this breaks the
      # apparent circular dependency (fee depends on subtotal, total depends on fee).
      # ERR_PLAN_COST_CAP_EXCEEDED fires when total_cost_cents > checkpoint.plan_cost_cap_cents.
    input_set: "LaneAssignment rows of the plan in state SCHEDULED, CHECKED_IN or RELEASED (REASSIGN_PENDING and CANCELLED excluded), plus SurgeDetail rows of the plan in state APPROVED."
    constants:
      OVERTIME_MULTIPLIER: 1.5
      DETAIL_RATE_CENTS_PER_MINUTE: 100
      ADMIN_FEE_TIER_1_MAX_EXCLUSIVE: 5000
      ADMIN_FEE_TIER_1_RATE: 0.060
      ADMIN_FEE_TIER_2_MAX_EXCLUSIVE: 20000
      ADMIN_FEE_TIER_2_RATE: 0.045
      ADMIN_FEE_TIER_3_RATE: 0.030
    precision: "all money is integer cents; base and overtime components are rounded per officer with round_half_up before summing; admin_fee_cents is round_half_up of subtotal x rate; admin_fee_rate is serialized as a 3-decimal string"
    variants: []

  - name: published_wait_time
    trigger: "GET /checkpoints/{checkpoint_id}/wait-time; recomputed and snapshotted on every POST /checkpoints/{checkpoint_id}/wait-observations into WaitTimeObservation.published_wait_minutes_snapshot"
    algorithm: weighted_scoring
    formula: |
      For the requested lane_type (STANDARD and EXPEDITED are published independently):
        window = [ current_utc - PUBLICATION_WINDOW_MINUTES, current_utc ]   # INCLUSIVE-INCLUSIVE
        samples = WaitTimeObservation where checkpoint_id == checkpoint
                  AND lane_type == requested type
                  AND observed_at_utc within window
        if count(samples) == 0:
          published_wait_minutes = null; weighted_average_seconds = null; sample_count = 0
        elif count(samples) < MIN_SAMPLES_FOR_WEIGHTED_AVERAGE:
          # thin data: fall back to the single most recent observation
          latest = samples ordered by (observed_at_utc DESC, created_at DESC) first
          weighted_average_seconds = round_half_up(latest.sampled_wait_seconds, 2)
        else:
          weight(s) = METHOD_WEIGHTS[s.measurement_method] * s.sample_size
          weighted_average_seconds =
            round_half_up( SUM(weight(s) * s.sampled_wait_seconds) / SUM(weight(s)), 2 )
        published_wait_minutes = round_half_up(weighted_average_seconds / 60)   # whole minutes
        breach = published_wait_minutes >= threshold_for(lane_type)
          # threshold_for(STANDARD)  = checkpoint.wait_threshold_minutes_standard
          # threshold_for(EXPEDITED) = checkpoint.wait_threshold_minutes_expedited
          # the comparison is >= : exactly at the threshold IS a breach
    input_set: "WaitTimeObservation rows for the checkpoint and lane_type whose observed_at_utc lies in the inclusive 20-minute window ending at the logical clock. Observations exactly 20 minutes old are INCLUDED; 20 minutes and 1 second old are excluded."
    constants:
      PUBLICATION_WINDOW_MINUTES: 20
      MIN_SAMPLES_FOR_WEIGHTED_AVERAGE: 3
      METHOD_WEIGHTS: { BLE_SENSOR: 3, MANUAL_TIMESTAMP: 2, STAFF_ESTIMATE: 1 }
    precision: "weighted_average_seconds is round_half_up to 2 decimals and serialized as a string; published_wait_minutes is an integer obtained by round_half_up of seconds/60 (e.g. 690 s -> 11.5 -> 12)"
    variants: []

  - name: checkpoint_posture
    trigger: "re-derived synchronously at the end of every write that touches a Lane's lane_state, an EquipmentUnit's state, an EscalationTicket's state, or Checkpoint.suspended; exposed as Checkpoint.posture"
    algorithm: threshold
    formula: |
      open_escalation_count = count(EscalationTicket where checkpoint_id == checkpoint
                                    AND state IN {RAISED, ACKNOWLEDGED})
      oos_lane_count        = count(Lane where checkpoint_id == checkpoint
                                    AND lane_state != DECOMMISSIONED
                                    AND equipment_state == OUT_OF_SERVICE)
      # first matching branch wins — evaluated strictly top to bottom
      if checkpoint.suspended == true:                 posture = SUSPENDED
      elif open_escalation_count >= 2:                 posture = SURGE
      elif open_escalation_count == 1 or oos_lane_count >= 1:  posture = ELEVATED
      else:                                            posture = NORMAL
      # SUSPENDED masks everything: a suspended checkpoint with 3 open tickets is
      # SUSPENDED, not SURGE. Masking is not clearing — the counters keep their
      # values underneath, and the §1.2 SUSPENDED -> NORMAL edge refuses to fire
      # while open_escalation_count > 0 or oos_lane_count > 0, so the flag can
      # only be lowered once those counters are back to 0 (posture then
      # re-derives NORMAL).
    input_set: "EscalationTicket rows in RAISED or ACKNOWLEDGED (resolved and expired tickets do not count) and non-DECOMMISSIONED Lane rows whose computed equipment_state is OUT_OF_SERVICE."
    constants:
      SURGE_OPEN_ESCALATION_THRESHOLD: 2
      ELEVATED_OOS_LANE_THRESHOLD: 1
    precision: "integer counts; comparisons are >= at the stated thresholds"
    variants: []

  - name: throughput_and_diversion_index
    trigger: "GET /checkpoints/{checkpoint_id}/throughput-analysis"
    algorithm: aggregation
    formula: |
      bands = TimeBand where checkpoint_id == checkpoint AND forecast_pax_count is not null
              ordered by (band_start_utc ASC, created_at ASC)
      for each band b:
        served_capacity_pax(b) = SUM over Lane rows of the checkpoint with lane_state == OPEN of
          floor( LANE_BASE_THROUGHPUT_PPH[lane.lane_type] * BAND_MINUTES / 60
                 * (DEGRADED_EQUIPMENT_FACTOR if lane.equipment_state == DEGRADED else 1.0) )
          # OUT_OF_SERVICE lanes contribute 0; the SURGE derate is NOT applied here
        b.shortfall = (b.forecast_pax_count > 0) and
                      (served_capacity_pax(b) / b.forecast_pax_count < THROUGHPUT_SHORTFALL_RATIO)
                      # STRICTLY less than 0.80; a ratio of exactly 0.80 is NOT a shortfall
      max_consecutive_shortfall_bands = longest run of consecutive shortfall == true bands
                                        in the (band_start_utc ASC) ordering
      total_forecast_pax = SUM of b.forecast_pax_count
      diversion_rate = 0.0000 if total_forecast_pax == 0
                       else round_half_up(checkpoint.diverted_pax_total / total_forecast_pax, 4)
      design_change_recommended =
          diversion_rate >= DIVERSION_RATE_DESIGN_THRESHOLD
          AND max_consecutive_shortfall_bands >= CONSECUTIVE_SHORTFALL_BANDS_REQUIRED
          # BOTH conditions are required; either one alone returns false
    input_set: "TimeBand rows of the checkpoint that have been forecast at least once, plus the checkpoint's currently OPEN lanes. Bands are never re-forecast by this read."
    constants:
      LANE_BASE_THROUGHPUT_PPH: { STANDARD: 180, EXPEDITED: 300 }
      BAND_MINUTES: 30
      DEGRADED_EQUIPMENT_FACTOR: 0.80
      THROUGHPUT_SHORTFALL_RATIO: 0.80
      DIVERSION_RATE_DESIGN_THRESHOLD: 0.05
      CONSECUTIVE_SHORTFALL_BANDS_REQUIRED: 2
    precision: "served_capacity_pax is a floored integer per lane then summed; diversion_rate is round_half_up to 4 decimals and serialized as a string; the shortfall comparison uses exact rational arithmetic, not a rounded ratio"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:

  # --- 1-2: authentication and coarse authorization -------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty (a header consisting only of whitespace counts as absent)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the six roles declared in §1.7 AND is listed in the target endpoint's roles[]"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  # --- 3: request shape ----------------------------------------------------
  - priority: 3
    category: existence
    check: "request body parses, every required field of the endpoint's input[] is present, every field has the declared type, and every enum value is a declared member (unknown extra fields are ignored)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST and PATCH endpoints"

  # --- 4-5: existence ------------------------------------------------------
  - priority: 4
    category: existence
    check: "every path id resolves to an existing row, validated STRICTLY LEFT-TO-RIGHT: for GET /checkpoints/{checkpoint_id}/lanes a bad checkpoint_id yields ERR_CHECKPOINT_NOT_FOUND before any lane is examined"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 5
    category: existence
    check: "every foreign-key id in the request body resolves to an existing row, validated in the order the fields appear in the endpoint's input[] declaration"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /lanes, POST /equipment-units, POST /flight-schedule-entries, POST /time-bands, POST /staffing-plans, POST /lane-assignments, POST /surge-details, POST /escalation-tickets/{id}/resolve, POST /screening-referrals, POST /screening-referrals/{id}/resolve"

  # --- 6-8: fine-grained authorization ------------------------------------
  - priority: 6
    category: auth
    check: "the requested action VALUE must be permitted for the acting role even though the role is listed on the endpoint: on POST /screening-referrals/{screening_referral_id}/resolve a ScreeningOfficer may only send outcome = CLEARED (REFERRED_LEO, DENIED_ENTRY and WITHDRAWN are SupervisoryOfficer-only); on PATCH /checkpoints/{checkpoint_id} only CheckpointManager may set suspended and only PlatformAdmin may change plan_cost_cap_cents"
    error_id: ERR_FORBIDDEN_ACTION_FOR_ROLE
    http_status: 403
    applies_to: "POST /screening-referrals/{screening_referral_id}/resolve, PATCH /checkpoints/{checkpoint_id}"
  - priority: 7
    category: auth
    check: "for entity_backed roles the acting X-User-ID must equal the Officer id the operation is scoped to: a ScreeningOfficer may only CHECK_IN / RELEASE / start-or-end a break on a LaneAssignment whose officer_id equals X-User-ID, and a SupervisoryOfficer is likewise bound for CHECK_IN and for both break actions — the ONE carve-out is action = RELEASE, which a SupervisoryOfficer may perform on any assignment whose Lane belongs to their checkpoint (see §1.2 CHECKED_IN -> RELEASED)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /lane-assignments/{lane_assignment_id}/duty, POST /lane-assignments/{lane_assignment_id}/break"
  - priority: 8
    category: auth
    check: "segregation of duties: on a plan decision the acting X-User-ID must differ from StaffingPlan.prepared_by_user_id; on a referral resolve the acting officer must differ from ScreeningReferral.detecting_officer_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /staffing-plans/{staffing_plan_id}/decision, POST /screening-referrals/{screening_referral_id}/resolve"

  # --- 9: optimistic concurrency ------------------------------------------
  - priority: 9
    category: state
    check: "when the endpoint declares an expected_<parent>_version input, its value must equal the parent's current version"
    error_id: "ERR_STALE_CHECKPOINT_VERSION | ERR_STALE_OFFICER_VERSION"
    http_status: 412
    applies_to: "POST /staffing-plans, POST /surge-details"

  # --- 10-14: state preconditions -----------------------------------------
  - priority: 10
    category: state
    check: "the owning Checkpoint's posture must not be SUSPENDED for any operational write (lane opening, assignment duty, wait observation, referral creation, plan submit/decision/activate); reads and PATCH /checkpoints/{id} remain permitted"
    error_id: ERR_CHECKPOINT_SUSPENDED
    http_status: 409
    applies_to: "POST /lanes/{lane_id}/open, POST /lane-assignments, POST /lane-assignments/{id}/duty, POST /checkpoints/{id}/wait-observations, POST /screening-referrals, POST /staffing-plans/{id}/submit, POST /staffing-plans/{id}/decision, POST /staffing-plans/{id}/lifecycle"
  - priority: 11
    category: state
    check: "the requested transition must be declared in §1.2 for the entity's current state (includes terminal-state lockdown and the second-identical-trigger idempotency rejection)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints that change a state field"
  - priority: 12
    category: state
    check: "a LaneAssignment duty action (CHECK_IN) requires its StaffingPlan.state == ACTIVATED; DRAFT, SUBMITTED, APPROVED, REJECTED, CLOSED and SUPERSEDED plans are all rejected"
    error_id: ERR_PLAN_NOT_ACTIVATED
    http_status: 409
    applies_to: "POST /lane-assignments/{lane_assignment_id}/duty"
  - priority: 13
    category: state
    check: "a LaneAssignment duty CHECK_IN requires its Lane.lane_state == OPEN; CLOSED, PAUSED and DECOMMISSIONED lanes are rejected"
    error_id: ERR_LANE_NOT_OPEN
    http_status: 409
    applies_to: "POST /lane-assignments/{lane_assignment_id}/duty"
  - priority: 14
    category: state
    check: "a break START requires break_state == DUE, i.e. current_utc - break_baseline_utc >= MAX_CONSECUTIVE_ON_POSITION_MINUTES (60); a break END requires break_state == ON_BREAK"
    error_id: ERR_BREAK_NOT_DUE
    http_status: 409
    applies_to: "POST /lane-assignments/{lane_assignment_id}/break"

  # --- 15-18: safety / regulatory (screening compliance outranks money) ----
  - priority: 15
    category: business_safety
    check: "the Officer must hold every certification the position demands: STANDARD_LANE or EXPEDITED_LANE matching Lane.lane_type, ADVANCED_IMAGING when the lane hosts an ADVANCED_IMAGING unit, ETD_RESOLUTION to resolve an ALARM referral, SPECIAL_PROCEDURES to resolve a DISABILITY_ACCOMMODATION / MEDICAL_DEVICE / YOUNG_CHILD referral"
    error_id: ERR_OFFICER_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /lane-assignments, POST /screening-referrals/{screening_referral_id}/begin, POST /screening-referrals/{screening_referral_id}/resolve"
  - priority: 16
    category: business_safety
    check: "opening a lane requires every equipment type in REQUIRED_EQUIPMENT_BY_LANE_TYPE for that lane_type to be present on the lane with state IN {SERVICEABLE, DEGRADED} (STANDARD needs WTMD + AT_XRAY + ADVANCED_IMAGING; EXPEDITED needs WTMD + AT_XRAY). A DEGRADED unit does NOT block the open — it only derates the lane capacity by DEGRADED_EQUIPMENT_FACTOR — but an OUT_OF_SERVICE or absent unit does"
    error_id: ERR_LANE_EQUIPMENT_UNAVAILABLE
    http_status: 422
    applies_to: "POST /lanes/{lane_id}/open"
  - priority: 17
    category: business_safety
    check: "no required equipment unit on the lane may have calibration_due_utc strictly earlier than current_utc; a unit due exactly at current_utc is still acceptable"
    error_id: ERR_CALIBRATION_OVERDUE
    http_status: 422
    applies_to: "POST /lanes/{lane_id}/open, POST /lane-assignments/{lane_assignment_id}/duty"
  - priority: 18
    category: business_safety
    check: "a private secondary screening (requires_private_screening == true), a REFERRED_LEO / DENIED_ENTRY resolution, or opening a lane while acting as SupervisoryOfficer requires the acting officer to hold the SUPERVISOR certification. A CheckpointManager is an opaque role and is never subject to this check"
    error_id: ERR_SUPERVISOR_CERTIFICATION_REQUIRED
    http_status: 403
    applies_to: "POST /screening-referrals/{screening_referral_id}/begin, POST /screening-referrals/{screening_referral_id}/resolve, POST /lanes/{lane_id}/open"

  # --- 19-21: referential coherence across aggregates ---------------------
  - priority: 19
    category: business_referential
    check: "every entity named in one request must belong to the same Checkpoint: LaneAssignment.lane_id's Lane.checkpoint_id must equal the plan's checkpoint_id (else ERR_LANE_CHECKPOINT_MISMATCH) and LaneAssignment.time_band_id's TimeBand.checkpoint_id must equal it too (else ERR_TIME_BAND_CHECKPOINT_MISMATCH)"
    error_id: "ERR_LANE_CHECKPOINT_MISMATCH | ERR_TIME_BAND_CHECKPOINT_MISMATCH"
    http_status: 422
    applies_to: "POST /lane-assignments"
  - priority: 20
    category: business_referential
    check: "resolving an EscalationTicket with resolution = LANE_OPENED requires a resolved_lane_id whose Lane belongs to the ticket's checkpoint, whose lane_type equals the ticket's lane_type_scope, and whose lane_state is already OPEN"
    error_id: ERR_RESOLUTION_LANE_INVALID
    http_status: 422
    applies_to: "POST /escalation-tickets/{escalation_ticket_id}/resolve"
  - priority: 21
    category: business_temporal
    check: "the assigned TimeBand's [band_start_utc, band_end_utc) must fall entirely inside the plan's operational_date UTC day; a band that straddles midnight into the next day is rejected"
    error_id: ERR_BAND_OUTSIDE_OPERATIONAL_DATE
    http_status: 422
    applies_to: "POST /lane-assignments"

  # --- 22-24: temporal conflicts -----------------------------------------
  - priority: 22
    category: business_temporal
    check: "an Officer may not hold two live assignments whose TimeBand intervals overlap; intervals are HALF-OPEN so a band ending at 10:30 and a band starting at 10:30 do NOT overlap. Live means assignment_state IN {SCHEDULED, CHECKED_IN}; CANCELLED, RELEASED and REASSIGN_PENDING rows are ignored"
    error_id: ERR_OFFICER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /lane-assignments"
  - priority: 23
    category: business_temporal
    check: "CONDITIONAL rest buffer: if the new band would extend an officer's contiguous run of adjacent live bands to strictly more than MAX_CONSECUTIVE_ON_POSITION_MINUTES (60), the new band must start at least REST_BUFFER_MINUTES (15) after the end of the preceding run. A third adjacent 30-minute band is therefore rejected while the second is accepted"
    error_id: ERR_OFFICER_REST_BUFFER_REQUIRED
    http_status: 409
    applies_to: "POST /lane-assignments"
  - priority: 24
    category: business_temporal
    check: "a SurgeDetail's [window_start_utc, window_start_utc + detail_minutes) must fall inside the plan's operational_date UTC day"
    error_id: ERR_DETAIL_WINDOW_OUTSIDE_PLAN
    http_status: 422
    applies_to: "POST /surge-details"

  # --- 25-28: capacity / aggregate constraints ---------------------------
  - priority: 25
    category: business_constraint
    check: "AGGREGATE, CLOSED-interval geometry: for a given Lane the maximum number of live assignments (assignment_state IN {SCHEDULED, CHECKED_IN}) whose TimeBand CLOSED intervals [band_start_utc, band_end_utc] mutually intersect must not exceed Lane.max_concurrent_officers. Because the lane side is closed, two 30-minute bands that merely share an endpoint (10:30) DO contend for the same lane minute — the opposite of the half-open geometry priority 22 applies to the officer. Each assignment is individually valid; only the collective breaches"
    error_id: ERR_LANE_POSITION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /lane-assignments"
  - priority: 26
    category: business_constraint
    check: "opening a lane requires enough unused physical floor positions: Checkpoint.available_lane_positions must be >= Lane.required_officer_count. Each individual lane fits; only the collective set of OPEN lanes exhausts the floor"
    error_id: ERR_LANE_POSITIONS_EXHAUSTED
    http_status: 409
    applies_to: "POST /lanes/{lane_id}/open"
  - priority: 27
    category: business_constraint
    check: "beginning a secondary screening requires the count of OTHER ScreeningReferral rows on this checkpoint with state IN {RAISED, IN_PROGRESS} (i.e. Checkpoint.secondary_slots_in_use minus this referral's own already-held slot) to be < Checkpoint.secondary_slot_capacity; the slot is reserved at creation, is not double-counted at begin, and is released on any terminal resolution"
    error_id: ERR_SECONDARY_CAPACITY_EXHAUSTED
    http_status: 409
    applies_to: "POST /screening-referrals/{screening_referral_id}/begin"
  - priority: 28
    category: business_constraint
    check: "submitting a plan requires that every TimeBand referenced by the plan's own LaneAssignment rows has already been forecast (else ERR_BAND_NOT_FORECAST) and that, for each such band, the number of distinct lanes the plan staffs meets required_standard_lanes and required_expedited_lanes as computed by lane_requirement, including the MIN_OPEN_LANES[STANDARD] floor of 1. Bands the plan does not reference are not audited"
    error_id: ERR_MIN_LANES_NOT_MET
    http_status: 422
    applies_to: "POST /staffing-plans/{staffing_plan_id}/submit"

  # --- 29-30: fiscal (last, per the domain's safety-before-money ordering) -
  - priority: 29
    category: business_fiscal
    check: "a write must not drive an officer's overtime_minutes (officer_duty_ledger, FORWARD_LOOKING_PLANNED) above Officer.weekly_overtime_minutes_cap"
    error_id: ERR_OVERTIME_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /lane-assignments, POST /lane-assignments/{lane_assignment_id}/duty, POST /surge-details/{surge_detail_id}/decision"
  - priority: 30
    category: business_fiscal
    check: "a write must not drive staffing_plan_cost.total_cost_cents above Checkpoint.plan_cost_cap_cents"
    error_id: ERR_PLAN_COST_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /staffing-plans/{staffing_plan_id}/submit, POST /surge-details/{surge_detail_id}/decision"

# =============================================================================
# §1.5 API Endpoint Table   (api_prefix is "", so paths are absolute)
# =============================================================================
endpoints:

  # ---- logical clock (test-driving, §1.5 priority-ladder rung 3) -----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock to an arbitrary instant. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Every deadline, publication window, break-due evaluation and calibration check reads this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime }"
    side_effects:
      - "re-evaluates every live LaneAssignment.break_state (NOT_DUE -> DUE and COMPLETED -> DUE) lazily on the next request that touches the row"

  # ---- ShowUpCurve --------------------------------------------------------
  - method: POST
    path: "/show-up-curves"
    description: "Registers an immutable historical show-up curve. buckets is an array of { minutes_before_start, minutes_before_end, share_pct } objects whose share_pct values must sum to exactly 100 and whose intervals must tile [window_end_minutes_before, window_start_minutes_before] without gaps or overlaps."
    roles: [PlatformAdmin, StaffingPlanner]
    code: 201
    input: [name, carrier_type, season_code, window_start_minutes_before, window_end_minutes_before, buckets]
    output: ShowUpCurve
    side_effects: []
  - method: GET
    path: "/show-up-curves/{show_up_curve_id}"
    description: "Reads one show-up curve. Immutable: there is no update endpoint and no version field."
    roles: [PlatformAdmin, CheckpointManager, StaffingPlanner, DutyManager, ScreeningOfficer, SupervisoryOfficer]
    code: 200
    input: []
    output: ShowUpCurve
    side_effects: []

  # ---- Checkpoint ---------------------------------------------------------
  - method: POST
    path: "/checkpoints"
    description: "Creates a checkpoint. posture starts NORMAL, available_lane_positions starts equal to total_lane_positions, and every cumulative counter starts at 0."
    roles: [PlatformAdmin]
    code: 201
    input: [name, terminal_code, total_lane_positions, wait_threshold_minutes_standard, wait_threshold_minutes_expedited, connecting_pax_discount_pct, secondary_slot_capacity, plan_cost_cap_cents, "suspended?"]
    output: Checkpoint
    side_effects: []
  - method: GET
    path: "/checkpoints/{checkpoint_id}"
    description: "Reads one checkpoint including the derived posture, available_lane_positions, open_lane_count, secondary_slots_in_use, the two consecutive_breach_count fields and the cumulative referral/diversion counters."
    roles: [PlatformAdmin, CheckpointManager, StaffingPlanner, DutyManager, ScreeningOfficer, SupervisoryOfficer]
    code: 200
    input: []
    output: Checkpoint
    side_effects: []
  - method: PATCH
    path: "/checkpoints/{checkpoint_id}"
    description: "Updates operating parameters. Only CheckpointManager may set suspended; only PlatformAdmin may change plan_cost_cap_cents; both roles may change the wait thresholds, connecting_pax_discount_pct and secondary_slot_capacity."
    roles: [PlatformAdmin, CheckpointManager]
    code: 200
    input: ["wait_threshold_minutes_standard?", "wait_threshold_minutes_expedited?", "connecting_pax_discount_pct?", "secondary_slot_capacity?", "plan_cost_cap_cents?", "suspended?"]
    output: Checkpoint
    side_effects:
      - "suspended = true drives Checkpoint NORMAL/ELEVATED/SURGE -> SUSPENDED, pauses every OPEN lane and flips their CHECKED_IN LaneAssignment rows to REASSIGN_PENDING"
      - "suspended = false re-derives posture from the live escalation and equipment counts via calculations.checkpoint_posture"
      - "increments `Checkpoint`.version by 1"

  # ---- Lane ---------------------------------------------------------------
  - method: POST
    path: "/lanes"
    description: "Creates a lane on a checkpoint's floor in state CLOSED with equipment_state OUT_OF_SERVICE (no units installed yet). position_index must be unique per checkpoint."
    roles: [PlatformAdmin, CheckpointManager]
    code: 201
    input: [checkpoint_id, lane_type, position_index, required_officer_count, max_concurrent_officers, secondary_positions]
    output: Lane
    side_effects:
      - "increments `Checkpoint`.version by 1"
  - method: GET
    path: "/lanes/{lane_id}"
    description: "Reads one lane including the computed equipment_state."
    roles: [PlatformAdmin, CheckpointManager, StaffingPlanner, DutyManager, ScreeningOfficer, SupervisoryOfficer]
    code: 200
    input: []
    output: Lane
    side_effects: []
  - method: GET
    path: "/lanes"
    description: "Reverse-reachability filtered list for Lane.checkpoint_id, ordered by position_index ASC — the same order calculations.lane_requirement waterfalls through."
    roles: [PlatformAdmin, CheckpointManager, StaffingPlanner, DutyManager, ScreeningOfficer, SupervisoryOfficer]
    code: 200
    input: ["checkpoint_id?", "lane_type?", "lane_state?", "equipment_state?", "limit?", "offset?"]
    output: Lane[]
    side_effects: []
  - method: POST
    path: "/lanes/{lane_id}/open"
    description: "Opens a CLOSED or PAUSED lane. Requires the full REQUIRED_EQUIPMENT_BY_LANE_TYPE set SERVICEABLE and in calibration, an un-suspended checkpoint, and enough available_lane_positions."
    roles: [CheckpointManager, SupervisoryOfficer]
    code: 200
    input: []
    output: Lane
    side_effects:
      - "sets Lane.lane_state = OPEN, stamps opened_at_utc from the logical clock and clears paused_reason_code"
      - "Checkpoint.available_lane_positions -= Lane.required_officer_count and Checkpoint.open_lane_count += 1 (forward leg of invariant lane_position_conservation)"
      - "on PAUSED -> OPEN, every REASSIGN_PENDING LaneAssignment on this lane returns to CHECKED_IN"
      - "re-derives Checkpoint.posture via calculations.checkpoint_posture"
      - "increments `Checkpoint`.version by 1"
  - method: POST
    path: "/lanes/{lane_id}/stand-down"
    description: "Moves a lane out of service. target_state is one of PAUSED, CLOSED or DECOMMISSIONED; paused_reason_code is required when target_state = PAUSED. DECOMMISSIONED is terminal and only reachable from CLOSED."
    roles: [CheckpointManager, SupervisoryOfficer]
    code: 200
    input: [target_state, "paused_reason_code?"]
    output: Lane
    side_effects:
      - "OPEN -> PAUSED or OPEN -> CLOSED returns Lane.required_officer_count to Checkpoint.available_lane_positions and decrements Checkpoint.open_lane_count (compensating leg of invariant lane_position_conservation)"
      - "OPEN -> PAUSED flips this lane's CHECKED_IN LaneAssignment rows to REASSIGN_PENDING; -> CLOSED moves REASSIGN_PENDING rows to RELEASED"
      - "re-derives Checkpoint.posture via calculations.checkpoint_posture"
      - "increments `Checkpoint`.version by 1"

  # ---- EquipmentUnit ------------------------------------------------------
  - method: POST
    path: "/equipment-units"
    description: "Installs an equipment unit in a lane in state SERVICEABLE. Adding a unit re-derives the lane's computed equipment_state."
    roles: [PlatformAdmin, CheckpointManager]
    code: 201
    input: [lane_id, equipment_type, serial_number, calibration_due_utc]
    output: EquipmentUnit
    side_effects:
      - "re-derives Lane.equipment_state from the lane's whole unit set"
      - "re-derives Checkpoint.posture via calculations.checkpoint_posture"
  - method: GET
    path: "/equipment-units/{equipment_unit_id}"
    description: "Reads one equipment unit including its current serviceability state and last_state_note."
    roles: [PlatformAdmin, CheckpointManager, StaffingPlanner, DutyManager, ScreeningOfficer, SupervisoryOfficer]
    code: 200
    input: []
    output: EquipmentUnit
    side_effects: []
  - method: GET
    path: "/equipment-units"
    description: "Reverse-reachability filtered list for EquipmentUnit.lane_id, ordered by created_at ASC."
    roles: [PlatformAdmin, CheckpointManager, StaffingPlanner, DutyManager, ScreeningOfficer, SupervisoryOfficer]
    code: 200
    input: ["lane_id?", "state?", "equipment_type?", "limit?", "offset?"]
    output: EquipmentUnit[]
    side_effects: []
  - method: POST
    path: "/equipment-units/{equipment_unit_id}/report-state"
    description: "Reports a serviceability change on one unit. This is the head of the depth-4 equipment_fault_to_escalation cascade: unit -> lane equipment_state -> lane pause and assignment reassignment -> checkpoint posture."
    roles: [CheckpointManager, SupervisoryOfficer]
    code: 200
    input: [state, "note?"]
    output: EquipmentUnit
    side_effects:
      - "sets EquipmentUnit.state and last_state_note"
      - "LINK 1 — re-derives Lane.equipment_state (OUT_OF_SERVICE if any unit OUT_OF_SERVICE, else DEGRADED if any unit DEGRADED, else SERVICEABLE)"
      - "LINK 2 — an OPEN lane whose equipment_state becomes OUT_OF_SERVICE is forced OPEN -> PAUSED with paused_reason_code = EQUIPMENT_FAULT and its CHECKED_IN assignments flip to REASSIGN_PENDING"
      - "LINK 3 — Checkpoint.available_lane_positions and open_lane_count adjust for the pause"
      - "LINK 4 — re-derives Checkpoint.posture via calculations.checkpoint_posture"
      - "increments `Checkpoint`.version by 1 when links 2-4 fire"

  # ---- Officer ------------------------------------------------------------
  - method: POST
    path: "/officers"
    description: "Registers an officer in duty_status OFF_DUTY with committed_duty_minutes = 0 and approved_detail_minutes = 0. certifications is an array drawn from STANDARD_LANE, EXPEDITED_LANE, ADVANCED_IMAGING, ETD_RESOLUTION, SPECIAL_PROCEDURES, SUPERVISOR."
    roles: [PlatformAdmin]
    code: 201
    input: [badge_number, full_name, certifications, base_rate_cents_per_minute, weekly_regular_minutes_cap, weekly_overtime_minutes_cap]
    output: Officer
    side_effects: []
  - method: GET
    path: "/officers/{officer_id}"
    description: "Reads one officer including the conserved committed_duty_minutes and approved_detail_minutes ledgers."
    roles: [PlatformAdmin, CheckpointManager, StaffingPlanner, DutyManager, ScreeningOfficer, SupervisoryOfficer]
    code: 200
    input: []
    output: Officer
    side_effects: []
  - method: POST
    path: "/officers/{officer_id}/duty-status"
    description: "Drives the officer duty axis: OFF_DUTY <-> ON_DUTY and the terminal OFF_DUTY -> SEPARATED. ON_BREAK is only reachable through a LaneAssignment break, never through this endpoint."
    roles: [PlatformAdmin, CheckpointManager]
    code: 200
    input: [duty_status]
    output: Officer
    side_effects:
      - "SEPARATED is REFUSED with ERR_INVALID_STATE_TRANSITION while the officer still holds a LaneAssignment in {SCHEDULED, CHECKED_IN, REASSIGN_PENDING} or a SurgeDetail in {REQUESTED, APPROVED}: the caller must cancel or release them first, and separation never cascades a cancellation of its own"
      - "increments `Officer`.version by 1"
  - method: GET
    path: "/officers/{officer_id}/duty-ledger"
    description: "Computed read of calculations.officer_duty_ledger. variant is FORWARD_LOOKING_PLANNED (default when omitted) or CHRONOLOGICAL_ACTUAL; the two variants return different minute totals for the same officer."
    roles: [PlatformAdmin, CheckpointManager, StaffingPlanner, DutyManager, SupervisoryOfficer]
    code: 200
    input: ["variant?"]
    output: "{ officer_id: string, variant: string, worked_minutes: integer, approved_detail_minutes: integer, total_minutes: integer, regular_minutes: integer, overtime_minutes: integer, cap_headroom_minutes: integer }"
    side_effects: []

  # ---- FlightScheduleEntry ------------------------------------------------
  - method: POST
    path: "/flight-schedule-entries"
    description: "Loads one flight into a checkpoint's demand feed in status SCHEDULED. projected_pax_count is computed as round_half_up(seats_sold * load_factor_pct / 100); any client-supplied value is ignored."
    roles: [PlatformAdmin, StaffingPlanner]
    code: 201
    input: [checkpoint_id, show_up_curve_id, flight_number, scheduled_departure_utc, seats_sold, load_factor_pct, carrier_type]
    output: FlightScheduleEntry
    side_effects:
      - "computes FlightScheduleEntry.projected_pax_count"
  - method: GET
    path: "/flight-schedule-entries/{flight_schedule_entry_id}"
    description: "Reads one flight schedule entry."
    roles: [PlatformAdmin, CheckpointManager, StaffingPlanner, DutyManager, ScreeningOfficer, SupervisoryOfficer]
    code: 200
    input: []
    output: FlightScheduleEntry
    side_effects: []
  - method: GET
    path: "/flight-schedule-entries"
    description: "Reverse-reachability filtered list for FlightScheduleEntry.checkpoint_id and FlightScheduleEntry.show_up_curve_id, ordered by (scheduled_departure_utc ASC, flight_number ASC) — the same sweep order calculations.time_band_pax_forecast uses."
    roles: [PlatformAdmin, CheckpointManager, StaffingPlanner, DutyManager, ScreeningOfficer, SupervisoryOfficer]
    code: 200
    input: ["checkpoint_id?", "show_up_curve_id?", "status?", "limit?", "offset?"]
    output: FlightScheduleEntry[]
    side_effects: []
  - method: POST
    path: "/flight-schedule-entries/{flight_schedule_entry_id}/cancel"
    description: "Marks a flight CANCELLED, removing it from the forecast input set. Cancelling an already-CANCELLED flight is rejected."
    roles: [PlatformAdmin, StaffingPlanner]
    code: 200
    input: []
    output: FlightScheduleEntry
    side_effects:
      - "sets FlightScheduleEntry.status = CANCELLED; already-computed TimeBand forecasts are NOT retroactively recomputed and must be re-forecast explicitly"

  # ---- TimeBand -----------------------------------------------------------
  - method: POST
    path: "/time-bands"
    description: "Creates a 30-minute demand band. band_end_utc is computed as band_start_utc + BAND_MINUTES; band_start_utc must be minute-aligned and unique per checkpoint. seasonal_multiplier is optional and defaults to 1.00 when omitted. All forecast and lane-requirement fields start null."
    roles: [PlatformAdmin, StaffingPlanner]
    code: 201
    input: [checkpoint_id, band_start_utc, expedited_share_pct, "seasonal_multiplier?"]
    output: TimeBand
    side_effects:
      - "computes TimeBand.band_end_utc"
  - method: GET
    path: "/time-bands/{time_band_id}"
    description: "Reads one band including forecast_variant, forecast_pax_count, the two required_*_lanes counts and the two unmet_*_demand counts."
    roles: [PlatformAdmin, CheckpointManager, StaffingPlanner, DutyManager, ScreeningOfficer, SupervisoryOfficer]
    code: 200
    input: []
    output: TimeBand
    side_effects: []
  - method: GET
    path: "/time-bands"
    description: "Reverse-reachability filtered list for TimeBand.checkpoint_id, ordered by (band_start_utc ASC, created_at ASC) — the order calculations.throughput_and_diversion_index walks when measuring consecutive shortfall runs."
    roles: [PlatformAdmin, CheckpointManager, StaffingPlanner, DutyManager, ScreeningOfficer, SupervisoryOfficer]
    code: 200
    input: ["checkpoint_id?", "from_utc?", "to_utc?", "forecast_variant?", "limit?", "offset?"]
    output: TimeBand[]
    side_effects: []
  - method: POST
    path: "/time-bands/{time_band_id}/forecast"
    description: "Runs calculations.time_band_pax_forecast for the requested variant (SCHEDULE_ONLY or CURVE_BLENDED) and then calculations.lane_requirement, storing both results on the band. Re-running with the other variant overwrites the stored numbers."
    roles: [PlatformAdmin, StaffingPlanner, DutyManager]
    code: 200
    input: [variant]
    output: TimeBand
    side_effects:
      - "sets TimeBand.forecast_variant, forecast_pax_count and forecast_computed_at_utc"
      - "sets TimeBand.required_standard_lanes, required_expedited_lanes, unmet_standard_demand and unmet_expedited_demand via calculations.lane_requirement"

  # ---- StaffingPlan -------------------------------------------------------
  - method: POST
    path: "/staffing-plans"
    description: "Creates a DRAFT staffing plan for one checkpoint and operational_date, revision_number 1, prepared_by_user_id taken from X-User-ID. Guarded by concurrency_rules.plan-create-stale-checkpoint: expected_checkpoint_version must equal the checkpoint's current version."
    roles: [StaffingPlanner]
    code: 201
    input: [checkpoint_id, operational_date, expected_checkpoint_version]
    output: StaffingPlan
    side_effects:
      - "sets StaffingPlan.prepared_by_user_id from the X-User-ID header"
      - "increments `Checkpoint`.version by 1"
  - method: GET
    path: "/staffing-plans/{staffing_plan_id}"
    description: "Reads one plan including revision_number, the four lifecycle timestamps and every cost field."
    roles: [PlatformAdmin, CheckpointManager, StaffingPlanner, DutyManager, ScreeningOfficer, SupervisoryOfficer]
    code: 200
    input: []
    output: StaffingPlan
    side_effects: []
  - method: GET
    path: "/staffing-plans"
    description: "Reverse-reachability filtered list for StaffingPlan.checkpoint_id and the self-referential StaffingPlan.superseded_by_staffing_plan_id, ordered by (operational_date ASC, created_at ASC)."
    roles: [PlatformAdmin, CheckpointManager, StaffingPlanner, DutyManager, ScreeningOfficer, SupervisoryOfficer]
    code: 200
    input: ["checkpoint_id?", "superseded_by_staffing_plan_id?", "state?", "operational_date?", "limit?", "offset?"]
    output: StaffingPlan[]
    side_effects: []
  - method: POST
    path: "/staffing-plans/{staffing_plan_id}/submit"
    description: "Moves a DRAFT plan to SUBMITTED. Runs calculations.staffing_plan_cost and enforces ERR_MIN_LANES_NOT_MET, ERR_OVERTIME_CAP_EXCEEDED and ERR_PLAN_COST_CAP_EXCEEDED in that priority order."
    roles: [StaffingPlanner]
    code: 200
    input: []
    output: StaffingPlan
    side_effects:
      - "stamps submitted_at_utc from the logical clock"
      - "recomputes planned_regular_minutes, planned_overtime_minutes, base_cost_cents, overtime_cost_cents, detail_cost_cents, subtotal_cents, admin_fee_rate, admin_fee_cents and total_cost_cents"
  - method: POST
    path: "/staffing-plans/{staffing_plan_id}/decision"
    description: "SUBMITTED -> APPROVED or SUBMITTED -> REJECTED. decision is APPROVE or REJECT; rejection_reason_code is required for REJECT and forbidden for APPROVE. Segregation of duties: X-User-ID must differ from prepared_by_user_id."
    roles: [DutyManager]
    code: 200
    input: [decision, "rejection_reason_code?"]
    output: StaffingPlan
    side_effects:
      - "APPROVE stamps approved_at_utc, sets approved_by_user_id from X-User-ID, and is the head of the depth-3 plan_approval_supersede cascade: every other APPROVED or ACTIVATED plan for the same (checkpoint_id, operational_date) moves to SUPERSEDED, their SCHEDULED LaneAssignment rows are CANCELLED, and each affected officer's committed_duty_minutes is debited"
      - "APPROVE sets superseded_by_staffing_plan_id on each losing plan to this plan's id"
      - "REJECT stamps rejection_reason_code and leaves every cost field untouched"
  - method: POST
    path: "/staffing-plans/{staffing_plan_id}/revise"
    description: "REJECTED -> DRAFT revision cycle. Clears rejection_reason_code and increments revision_number by 1, so the plan can be edited and re-submitted."
    roles: [StaffingPlanner]
    code: 200
    input: []
    output: StaffingPlan
    side_effects:
      - "increments StaffingPlan.revision_number by 1, clears rejection_reason_code and submitted_at_utc"
  - method: POST
    path: "/staffing-plans/{staffing_plan_id}/lifecycle"
    description: "APPROVED -> ACTIVATED (action = ACTIVATE) or ACTIVATED -> CLOSED (action = CLOSE). Only an ACTIVATED plan permits LaneAssignment CHECK_IN."
    roles: [CheckpointManager]
    code: 200
    input: [action]
    output: StaffingPlan
    side_effects:
      - "ACTIVATE stamps activated_at_utc"
      - "CLOSE stamps closed_at_utc, RELEASES every CHECKED_IN or REASSIGN_PENDING assignment and CANCELS every still-SCHEDULED assignment"
  - method: GET
    path: "/staffing-plans/{staffing_plan_id}/cost-summary"
    description: "Computed read of calculations.staffing_plan_cost, exposing the per-officer minute split alongside the plan-level money fields so the round-per-officer-then-sum order is observable."
    roles: [PlatformAdmin, CheckpointManager, StaffingPlanner, DutyManager]
    code: 200
    input: []
    output: "{ staffing_plan_id: string, planned_regular_minutes: integer, planned_overtime_minutes: integer, base_cost_cents: integer, overtime_cost_cents: integer, detail_cost_cents: integer, subtotal_cents: integer, admin_fee_rate: string, admin_fee_cents: integer, total_cost_cents: integer, officer_breakdown: array }"
    side_effects: []

  # ---- LaneAssignment -----------------------------------------------------
  - method: POST
    path: "/lane-assignments"
    description: "Assigns an officer to a lane for one time band. Created in assignment_state SCHEDULED and break_state NOT_DUE. Enforces certification (priority 15) before the temporal overlap and rest-buffer checks (priorities 22-23), the per-lane aggregate capacity check (25) and finally the overtime cap (29)."
    roles: [StaffingPlanner]
    code: 201
    input: [staffing_plan_id, lane_id, officer_id, time_band_id]
    output: LaneAssignment
    side_effects:
      - "computes LaneAssignment.planned_minutes from the band length"
      - "credits Officer.committed_duty_minutes by planned_minutes (forward leg of invariant officer_duty_minute_conservation)"
      - "recomputes calculations.staffing_plan_cost for the owning plan"
  - method: GET
    path: "/lane-assignments/{lane_assignment_id}"
    description: "Reads one assignment including both state axes, the break ledger and the computed planned_minutes / actual_minutes. Reading the row re-evaluates break_state NOT_DUE -> DUE and COMPLETED -> DUE against the logical clock."
    roles: [PlatformAdmin, CheckpointManager, StaffingPlanner, DutyManager, ScreeningOfficer, SupervisoryOfficer]
    code: 200
    input: []
    output: LaneAssignment
    side_effects:
      - "lazily re-evaluates LaneAssignment.break_state against the logical clock"
  - method: GET
    path: "/lane-assignments"
    description: "Reverse-reachability filtered list collapsing all four LaneAssignment FKs, ordered by (checked_in_at_utc ASC NULLS LAST, created_at ASC) — the replay order calculations.officer_duty_ledger CHRONOLOGICAL_ACTUAL uses."
    roles: [PlatformAdmin, CheckpointManager, StaffingPlanner, DutyManager, ScreeningOfficer, SupervisoryOfficer]
    code: 200
    input: ["staffing_plan_id?", "lane_id?", "officer_id?", "time_band_id?", "assignment_state?", "break_state?", "limit?", "offset?"]
    output: LaneAssignment[]
    side_effects: []
  - method: POST
    path: "/lane-assignments/{lane_assignment_id}/duty"
    description: "Drives the duty axis. action is CHECK_IN, RELEASE or CANCEL. CHECK_IN requires the plan ACTIVATED (priority 12) and the lane OPEN (priority 13); an entity_backed actor must be the assignment's own officer (priority 7)."
    roles: [DutyManager, ScreeningOfficer, SupervisoryOfficer]
    code: 200
    input: [action]
    output: LaneAssignment
    side_effects:
      - "CHECK_IN stamps checked_in_at_utc, sets break_baseline_utc = checked_in_at_utc and moves Officer OFF_DUTY -> ON_DUTY when the officer is not already on duty"
      - "RELEASE stamps released_at_utc and freezes actual_minutes"
      - "CANCEL debits Officer.committed_duty_minutes by planned_minutes (compensating leg of invariant officer_duty_minute_conservation) and recomputes the plan cost"
  - method: POST
    path: "/lane-assignments/{lane_assignment_id}/break"
    description: "Drives the independent break axis. action is START (requires break_state DUE) or END (requires break_state ON_BREAK). The duty axis is untouched: an assignment stays CHECKED_IN throughout a break."
    roles: [ScreeningOfficer, SupervisoryOfficer]
    code: 200
    input: [action]
    output: LaneAssignment
    side_effects:
      - "START stamps break_started_at_utc and moves the Officer ON_DUTY -> ON_BREAK"
      - "END stamps break_ended_at_utc, adds the elapsed whole minutes to break_minutes_taken, resets break_baseline_utc to break_ended_at_utc, sets break_state = COMPLETED and moves the Officer ON_BREAK -> ON_DUTY"

  # ---- WaitTimeObservation and publication --------------------------------
  - method: POST
    path: "/checkpoints/{checkpoint_id}/wait-observations"
    description: "Records an immutable wait sample and immediately recomputes calculations.published_wait_time for that lane_type, snapshotting the result on the observation. This is the rate_threshold_triggers head: two consecutive breaching publications raise an EscalationTicket."
    roles: [CheckpointManager, DutyManager, SupervisoryOfficer]
    code: 201
    input: [lane_type, sampled_wait_seconds, measurement_method, sample_size]
    output: WaitTimeObservation
    side_effects:
      - "stamps observed_at_utc from the logical clock and computes published_wait_minutes_snapshot and breached_threshold"
      - "increments Checkpoint.consecutive_breach_count_<lane_type> when breached_threshold is true, resets it to 0 otherwise"
      - "raises an EscalationTicket (state RAISED, trigger_reason WAIT_THRESHOLD_BREACH) when the counter reaches exactly ESCALATION_BREACH_COUNT_REQUIRED (2)"
      - "expires any still-RAISED WAIT_THRESHOLD_BREACH ticket for the same lane_type when the recomputed publication falls strictly below the threshold"
      - "re-derives Checkpoint.posture via calculations.checkpoint_posture"
      - "increments `Checkpoint`.version by 1"
  - method: GET
    path: "/wait-observations/{wait_time_observation_id}"
    description: "Reads one wait observation, including the published_wait_minutes_snapshot and breached_threshold computed at the instant it was posted. Immutable: no update endpoint and no version field."
    roles: [PlatformAdmin, CheckpointManager, StaffingPlanner, DutyManager, ScreeningOfficer, SupervisoryOfficer]
    code: 200
    input: []
    output: WaitTimeObservation
    side_effects: []
  - method: GET
    path: "/wait-observations"
    description: "Reverse-reachability filtered list for WaitTimeObservation.checkpoint_id, ordered by observed_at_utc DESC then created_at DESC — the tie-break order calculations.published_wait_time uses to pick the latest sample."
    roles: [PlatformAdmin, CheckpointManager, StaffingPlanner, DutyManager, ScreeningOfficer, SupervisoryOfficer]
    code: 200
    input: ["checkpoint_id?", "lane_type?", "measurement_method?", "limit?", "offset?"]
    output: WaitTimeObservation[]
    side_effects: []
  - method: GET
    path: "/checkpoints/{checkpoint_id}/wait-time"
    description: "Computed read of calculations.published_wait_time for one lane_type over the inclusive 20-minute window ending at the logical clock. Returns published_wait_minutes = null and sample_count = 0 when the window is empty."
    roles: [PlatformAdmin, CheckpointManager, StaffingPlanner, DutyManager, ScreeningOfficer, SupervisoryOfficer]
    code: 200
    input: [lane_type]
    output: "{ checkpoint_id: string, lane_type: string, published_wait_minutes: integer, weighted_average_seconds: string, sample_count: integer, threshold_minutes: integer, breached: boolean, window_start_utc: datetime, window_end_utc: datetime }"
    side_effects: []

  # ---- EscalationTicket (system-created; no POST collection) --------------
  - method: GET
    path: "/escalation-tickets/{escalation_ticket_id}"
    description: "Reads one escalation ticket. Tickets are never created by a client — they are raised by the wait-observation threshold cascade, so this read and the filtered list are their only discovery channels."
    roles: [PlatformAdmin, CheckpointManager, StaffingPlanner, DutyManager, ScreeningOfficer, SupervisoryOfficer]
    code: 200
    input: []
    output: EscalationTicket
    side_effects: []
  - method: GET
    path: "/escalation-tickets"
    description: "Reverse-reachability filtered list for EscalationTicket.checkpoint_id, resolved_lane_id and acknowledged_by_officer_id, ordered by raised_at_utc ASC then created_at ASC."
    roles: [PlatformAdmin, CheckpointManager, StaffingPlanner, DutyManager, ScreeningOfficer, SupervisoryOfficer]
    code: 200
    input: ["checkpoint_id?", "resolved_lane_id?", "acknowledged_by_officer_id?", "state?", "lane_type_scope?", "limit?", "offset?"]
    output: EscalationTicket[]
    side_effects: []
  - method: POST
    path: "/escalation-tickets/{escalation_ticket_id}/acknowledge"
    description: "RAISED -> ACKNOWLEDGED. Records the acting SupervisoryOfficer as acknowledged_by_officer_id. A second acknowledge is rejected as an illegal transition."
    roles: [SupervisoryOfficer]
    code: 200
    input: []
    output: EscalationTicket
    side_effects:
      - "sets acknowledged_by_officer_id from X-User-ID and stamps acknowledged_at_utc"
  - method: POST
    path: "/escalation-tickets/{escalation_ticket_id}/resolve"
    description: "ACKNOWLEDGED -> RESOLVED_LANE_OPENED (resolution = LANE_OPENED, resolved_lane_id required and must already be OPEN, of the ticket's lane_type_scope and on the ticket's checkpoint) or ACKNOWLEDGED -> RESOLVED_DIVERTED (resolution = MITIGATED_BY_DIVERSION, diverted_pax_count required and >= 1). The two resolutions have deliberately divergent side effects."
    roles: [SupervisoryOfficer]
    code: 200
    input: [resolution, "resolved_lane_id?", "diverted_pax_count?", "resolution_note?"]
    output: EscalationTicket
    side_effects:
      - "stamps resolved_at_utc and resets Checkpoint.consecutive_breach_count_<lane_type_scope> to 0"
      - "LANE_OPENED leaves Checkpoint.diverted_pax_total untouched"
      - "MITIGATED_BY_DIVERSION adds diverted_pax_count to Checkpoint.diverted_pax_total, which feeds calculations.throughput_and_diversion_index"
      - "re-derives Checkpoint.posture via calculations.checkpoint_posture"
      - "increments `Checkpoint`.version by 1"

  # ---- ScreeningReferral --------------------------------------------------
  - method: POST
    path: "/screening-referrals"
    description: "Raises a secondary-screening or special-procedure referral on a lane in state RAISED with secondary_slot_held = true. detecting_officer_id is taken from X-User-ID. referral_reason is ALARM, DISABILITY_ACCOMMODATION, MEDICAL_DEVICE, YOUNG_CHILD or RANDOM."
    roles: [ScreeningOfficer, SupervisoryOfficer]
    code: 201
    input: [lane_id, referral_reason, passenger_category, requires_private_screening]
    output: ScreeningReferral
    side_effects:
      - "sets detecting_officer_id from X-User-ID and stamps raised_at_utc"
      - "sets secondary_slot_held = true and increments Checkpoint.secondary_slots_in_use"
  - method: GET
    path: "/screening-referrals/{screening_referral_id}"
    description: "Reads one referral including secondary_slot_held and the three lifecycle timestamps."
    roles: [PlatformAdmin, CheckpointManager, StaffingPlanner, DutyManager, ScreeningOfficer, SupervisoryOfficer]
    code: 200
    input: []
    output: ScreeningReferral
    side_effects: []
  - method: GET
    path: "/screening-referrals"
    description: "Reverse-reachability filtered list for ScreeningReferral.lane_id, detecting_officer_id and resolving_officer_id, ordered by raised_at_utc ASC then created_at ASC."
    roles: [PlatformAdmin, CheckpointManager, StaffingPlanner, DutyManager, ScreeningOfficer, SupervisoryOfficer]
    code: 200
    input: ["lane_id?", "detecting_officer_id?", "resolving_officer_id?", "state?", "referral_reason?", "limit?", "offset?"]
    output: ScreeningReferral[]
    side_effects: []
  - method: POST
    path: "/screening-referrals/{screening_referral_id}/begin"
    description: "RAISED -> IN_PROGRESS. resolving_officer_id nominates the officer who will work the secondary; that officer must hold the certification the referral_reason demands (ETD_RESOLUTION for ALARM, SPECIAL_PROCEDURES for the three accommodation reasons). requires_private_screening additionally demands SUPERVISOR on the acting officer. Requires free secondary capacity."
    roles: [SupervisoryOfficer]
    code: 200
    input: [resolving_officer_id]
    output: ScreeningReferral
    side_effects:
      - "sets resolving_officer_id and stamps started_at_utc; the held secondary slot is retained"
  - method: POST
    path: "/screening-referrals/{screening_referral_id}/resolve"
    description: "IN_PROGRESS -> CLEARED | REFERRED_LEO | DENIED_ENTRY, or RAISED -> WITHDRAWN. outcome selects the branch. A ScreeningOfficer may only send CLEARED; the other three outcomes are SupervisoryOfficer-only (priority 6) and REFERRED_LEO / DENIED_ENTRY additionally require the SUPERVISOR certification on the acting officer (priority 18). Segregation of duties: X-User-ID must differ from detecting_officer_id."
    roles: [ScreeningOfficer, SupervisoryOfficer]
    code: 200
    input: [outcome, "resolution_note?"]
    output: ScreeningReferral
    side_effects:
      - "stamps resolved_at_utc, sets secondary_slot_held = false and decrements Checkpoint.secondary_slots_in_use (compensating leg of invariant secondary_slot_conservation)"
      - "CLEARED increments Checkpoint.cleared_referral_count only"
      - "REFERRED_LEO increments Checkpoint.leo_referral_count only"
      - "DENIED_ENTRY increments Checkpoint.denied_entry_count only"
      - "WITHDRAWN increments none of the three counters"
      - "increments `Checkpoint`.version by 1"

  # ---- SurgeDetail --------------------------------------------------------
  - method: POST
    path: "/surge-details"
    description: "Requests an overtime / detail assignment for a surge event in state REQUESTED. Guarded by concurrency_rules.surge-detail-create-stale-officer: expected_officer_version must equal the officer's current version. detail_cost_cents is computed as detail_minutes * DETAIL_RATE_CENTS_PER_MINUTE and is null until approval."
    roles: [StaffingPlanner]
    code: 201
    input: [staffing_plan_id, officer_id, event_code, window_start_utc, detail_minutes, expected_officer_version]
    output: SurgeDetail
    side_effects:
      - "sets requested_by_user_id from X-User-ID"
      - "increments `Officer`.version by 1"
  - method: GET
    path: "/surge-details/{surge_detail_id}"
    description: "Reads one surge detail including detail_cost_cents and the decision timestamps."
    roles: [PlatformAdmin, CheckpointManager, StaffingPlanner, DutyManager, ScreeningOfficer, SupervisoryOfficer]
    code: 200
    input: []
    output: SurgeDetail
    side_effects: []
  - method: GET
    path: "/surge-details"
    description: "Reverse-reachability filtered list for SurgeDetail.staffing_plan_id and SurgeDetail.officer_id, ordered by (window_start_utc ASC, created_at ASC)."
    roles: [PlatformAdmin, CheckpointManager, StaffingPlanner, DutyManager, ScreeningOfficer, SupervisoryOfficer]
    code: 200
    input: ["staffing_plan_id?", "officer_id?", "state?", "event_code?", "limit?", "offset?"]
    output: SurgeDetail[]
    side_effects: []
  - method: POST
    path: "/surge-details/{surge_detail_id}/decision"
    description: "REQUESTED -> APPROVED (decision = APPROVE) or REQUESTED -> DENIED (decision = DENY, denial_reason_code required). APPROVE is the forward leg of invariant officer_duty_minute_conservation and re-runs the overtime and cost-cap checks."
    roles: [DutyManager]
    code: 200
    input: [decision, "denial_reason_code?"]
    output: SurgeDetail
    side_effects:
      - "APPROVE computes detail_cost_cents, credits Officer.committed_duty_minutes and Officer.approved_detail_minutes by detail_minutes, and recomputes calculations.staffing_plan_cost"
      - "DENY stamps denial_reason_code and leaves both officer ledgers and every plan cost field untouched"
      - "stamps decided_at_utc and decided_by_user_id from X-User-ID"
      - "increments `Officer`.version by 1"
  - method: POST
    path: "/surge-details/{surge_detail_id}/cancel"
    description: "APPROVED -> CANCELLED. The compensating leg of invariant officer_duty_minute_conservation: every ledger effect of approval is reversed with no drift."
    roles: [DutyManager]
    code: 200
    input: []
    output: SurgeDetail
    side_effects:
      - "debits Officer.committed_duty_minutes and Officer.approved_detail_minutes by detail_minutes, restoring the pre-approval values exactly"
      - "clears detail_cost_cents back to null, stamps cancelled_at_utc and recomputes calculations.staffing_plan_cost"
      - "increments `Officer`.version by 1"

  # ---- analytics ----------------------------------------------------------
  - method: GET
    path: "/checkpoints/{checkpoint_id}/throughput-analysis"
    description: "Computed read of calculations.throughput_and_diversion_index: per-band served capacity vs forecast, the longest consecutive shortfall run, the diversion rate and the design_change_recommended flag that feeds checkpoint design changes."
    roles: [PlatformAdmin, CheckpointManager, StaffingPlanner, DutyManager]
    code: 200
    input: []
    output: "{ checkpoint_id: string, total_forecast_pax: integer, band_results: array, max_consecutive_shortfall_bands: integer, diverted_pax_total: integer, diversion_rate: string, design_change_recommended: boolean }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- authentication / authorization -------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header absent, empty, or whitespace-only"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "X-User-Role is not a declared role, or is not listed in the target endpoint's roles[]"
  - id: ERR_FORBIDDEN_ACTION_FOR_ROLE
    http: 403
    condition: "the acting role is listed on the endpoint but not permitted for the specific action value: ScreeningOfficer sending outcome REFERRED_LEO / DENIED_ENTRY / WITHDRAWN, PlatformAdmin setting suspended, or CheckpointManager changing plan_cost_cap_cents"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed actor (ScreeningOfficer / SupervisoryOfficer) acts on a LaneAssignment whose officer_id differs from X-User-ID, EXCEPT a SupervisoryOfficer sending action = RELEASE, who may release any assignment on a Lane of their own checkpoint"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the plan decider's X-User-ID equals StaffingPlan.prepared_by_user_id, or the referral resolver's X-User-ID equals ScreeningReferral.detecting_officer_id"
  - id: ERR_SUPERVISOR_CERTIFICATION_REQUIRED
    http: 403
    condition: "a private secondary screening is begun, or a REFERRED_LEO / DENIED_ENTRY resolution is attempted, by an officer whose certifications do not include SUPERVISOR"

  # --- request shape ------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "unparseable body, missing required input field, wrong scalar type, undeclared enum value, out-of-range numeric, or a conditionally-required field omitted (rejection_reason_code on REJECT, paused_reason_code on PAUSE, denial_reason_code on DENY, resolved_lane_id on LANE_OPENED, diverted_pax_count on MITIGATED_BY_DIVERSION)"

  # --- existence ----------------------------------------------------------
  - id: ERR_CHECKPOINT_NOT_FOUND
    http: 404
    condition: "checkpoint_id in a path or body does not resolve"
  - id: ERR_LANE_NOT_FOUND
    http: 404
    condition: "lane_id or resolved_lane_id does not resolve"
  - id: ERR_EQUIPMENT_UNIT_NOT_FOUND
    http: 404
    condition: "equipment_unit_id does not resolve"
  - id: ERR_OFFICER_NOT_FOUND
    http: 404
    condition: "officer_id or resolving_officer_id does not resolve"
  - id: ERR_SHOW_UP_CURVE_NOT_FOUND
    http: 404
    condition: "show_up_curve_id does not resolve"
  - id: ERR_FLIGHT_SCHEDULE_ENTRY_NOT_FOUND
    http: 404
    condition: "flight_schedule_entry_id does not resolve"
  - id: ERR_TIME_BAND_NOT_FOUND
    http: 404
    condition: "time_band_id does not resolve"
  - id: ERR_STAFFING_PLAN_NOT_FOUND
    http: 404
    condition: "staffing_plan_id does not resolve"
  - id: ERR_LANE_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "lane_assignment_id does not resolve"
  - id: ERR_WAIT_TIME_OBSERVATION_NOT_FOUND
    http: 404
    condition: "wait_time_observation_id does not resolve"
  - id: ERR_ESCALATION_TICKET_NOT_FOUND
    http: 404
    condition: "escalation_ticket_id does not resolve"
  - id: ERR_SCREENING_REFERRAL_NOT_FOUND
    http: 404
    condition: "screening_referral_id does not resolve"
  - id: ERR_SURGE_DETAIL_NOT_FOUND
    http: 404
    condition: "surge_detail_id does not resolve"

  # --- optimistic concurrency --------------------------------------------
  - id: ERR_STALE_CHECKPOINT_VERSION
    http: 412
    condition: "expected_checkpoint_version on POST /staffing-plans does not equal the checkpoint's current version"
  - id: ERR_STALE_OFFICER_VERSION
    http: 412
    condition: "expected_officer_version on POST /surge-details does not equal the officer's current version"

  # --- state preconditions ------------------------------------------------
  - id: ERR_CHECKPOINT_SUSPENDED
    http: 409
    condition: "an operational write targets a checkpoint whose derived posture is SUSPENDED"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested transition is not declared in §1.2 for the entity's current state, including terminal-state lockdown (DECOMMISSIONED lane, SEPARATED officer, CLOSED / SUPERSEDED plan, RELEASED / CANCELLED assignment, any resolved ticket or referral, DENIED / CANCELLED detail) and the second identical trigger"
  - id: ERR_PLAN_NOT_ACTIVATED
    http: 409
    condition: "a LaneAssignment CHECK_IN is attempted while the owning StaffingPlan is not in state ACTIVATED"
  - id: ERR_LANE_NOT_OPEN
    http: 409
    condition: "a LaneAssignment CHECK_IN is attempted while the assignment's Lane is not in lane_state OPEN"
  - id: ERR_BREAK_NOT_DUE
    http: 409
    condition: "break action START while break_state is not DUE, or break action END while break_state is not ON_BREAK"

  # --- safety / regulatory ------------------------------------------------
  - id: ERR_OFFICER_NOT_CERTIFIED
    http: 422
    condition: "the officer lacks a certification the position or referral demands: the lane_type certification, ADVANCED_IMAGING for a lane hosting an advanced-imaging unit, ETD_RESOLUTION for an ALARM referral, or SPECIAL_PROCEDURES for a DISABILITY_ACCOMMODATION / MEDICAL_DEVICE / YOUNG_CHILD referral"
  - id: ERR_LANE_EQUIPMENT_UNAVAILABLE
    http: 422
    condition: "a lane open is attempted while a required equipment type for its lane_type is absent from the lane or present with state OUT_OF_SERVICE; a DEGRADED unit does not raise this error, it only derates capacity"
  - id: ERR_CALIBRATION_OVERDUE
    http: 422
    condition: "a required equipment unit on the lane has calibration_due_utc strictly earlier than the logical clock"

  # --- referential coherence ---------------------------------------------
  - id: ERR_LANE_CHECKPOINT_MISMATCH
    http: 422
    condition: "the assigned Lane belongs to a different checkpoint than the assignment's StaffingPlan"
  - id: ERR_TIME_BAND_CHECKPOINT_MISMATCH
    http: 422
    condition: "the assigned TimeBand belongs to a different checkpoint than the assignment's StaffingPlan"
  - id: ERR_RESOLUTION_LANE_INVALID
    http: 422
    condition: "resolved_lane_id names a lane on another checkpoint, of the wrong lane_type for the ticket's lane_type_scope, or not currently OPEN"

  # --- temporal ----------------------------------------------------------
  - id: ERR_BAND_OUTSIDE_OPERATIONAL_DATE
    http: 422
    condition: "the assigned TimeBand's half-open interval is not entirely inside the plan's operational_date UTC day"
  - id: ERR_OFFICER_DOUBLE_BOOKED
    http: 409
    condition: "the officer already holds a SCHEDULED or CHECKED_IN assignment whose TimeBand half-open interval overlaps the requested band"
  - id: ERR_OFFICER_REST_BUFFER_REQUIRED
    http: 409
    condition: "the requested band would extend the officer's contiguous run of adjacent live bands beyond MAX_CONSECUTIVE_ON_POSITION_MINUTES (60) without at least REST_BUFFER_MINUTES (15) of separation"
  - id: ERR_DETAIL_WINDOW_OUTSIDE_PLAN
    http: 422
    condition: "the surge detail's [window_start_utc, window_start_utc + detail_minutes) interval falls outside the plan's operational_date UTC day"

  # --- capacity / aggregate ---------------------------------------------
  - id: ERR_LANE_POSITION_CAPACITY_EXCEEDED
    http: 409
    condition: "the count of live assignments on the lane for overlapping bands would exceed Lane.max_concurrent_officers (each assignment individually valid, the collective is not)"
  - id: ERR_LANE_POSITIONS_EXHAUSTED
    http: 409
    condition: "a lane open would need more officer positions than Checkpoint.available_lane_positions still offers"
  - id: ERR_SECONDARY_CAPACITY_EXHAUSTED
    http: 409
    condition: "a referral begin is attempted while the OTHER RAISED / IN_PROGRESS referrals on the checkpoint (secondary_slots_in_use minus this referral's own held slot) already number secondary_slot_capacity"
  - id: ERR_MIN_LANES_NOT_MET
    http: 422
    condition: "a plan submit leaves some band REFERENCED BY THE PLAN'S OWN non-cancelled assignments staffed below required_standard_lanes, required_expedited_lanes, or the MIN_OPEN_LANES[STANDARD] floor of 1; bands the plan does not reference are not audited"

  # --- fiscal ------------------------------------------------------------
  - id: ERR_OVERTIME_CAP_EXCEEDED
    http: 422
    condition: "the write would drive the officer's overtime_minutes above Officer.weekly_overtime_minutes_cap"
  - id: ERR_PLAN_COST_CAP_EXCEEDED
    http: 422
    condition: "the write would drive StaffingPlan.total_cost_cents above Checkpoint.plan_cost_cap_cents"

  # --- uniqueness / data integrity --------------------------------------
  - id: ERR_DUPLICATE_LANE_POSITION
    http: 409
    condition: "another non-DECOMMISSIONED lane on the same checkpoint already uses that position_index"
  - id: ERR_DUPLICATE_TIME_BAND
    http: 409
    condition: "another TimeBand on the same checkpoint already starts at that band_start_utc"
  - id: ERR_DUPLICATE_BADGE_NUMBER
    http: 409
    condition: "another Officer already holds that badge_number"
  - id: ERR_CURVE_BUCKETS_INVALID
    http: 422
    condition: "a show-up curve's buckets do not tile [window_end_minutes_before, window_start_minutes_before] without gaps or overlaps, or their share_pct values do not sum to exactly 100"
  - id: ERR_BAND_NOT_FORECAST
    http: 422
    condition: "a plan submit references a TimeBand whose forecast_pax_count is still null"

# =============================================================================
# §1.7 RBAC Matrix   (role_model: segregation_of_duties)
# =============================================================================
roles:

  - name: PlatformAdmin
    description: "Operational superuser that seeds reference data (checkpoints, lanes, equipment, officers, show-up curves, flight schedules) and drives the logical clock. Never participates in the plan approval chain."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /checkpoints"
      - "POST /officers"
      - "PATCH /checkpoints/{checkpoint_id} changing plan_cost_cap_cents"
    shared_operations:
      - "POST /show-up-curves, POST /flight-schedule-entries, POST /flight-schedule-entries/{id}/cancel (with StaffingPlanner)"
      - "POST /lanes, POST /equipment-units (with CheckpointManager)"
      - "POST /officers/{officer_id}/duty-status (with CheckpointManager)"
      - "POST /time-bands, POST /time-bands/{id}/forecast (with StaffingPlanner)"
      - "every GET read endpoint"

  - name: CheckpointManager
    description: "Owns the physical checkpoint: floor configuration, suspension, equipment serviceability, officer duty status, and the plan ACTIVATE / CLOSE lifecycle. Cannot prepare or decide a plan."
    identity: opaque
    exclusive_operations:
      - "POST /staffing-plans/{staffing_plan_id}/lifecycle"
      - "PATCH /checkpoints/{checkpoint_id} setting suspended"
    shared_operations:
      - "POST /lanes, POST /equipment-units (with PlatformAdmin)"
      - "POST /lanes/{lane_id}/open, POST /lanes/{lane_id}/stand-down, POST /equipment-units/{id}/report-state (with SupervisoryOfficer)"
      - "POST /officers/{officer_id}/duty-status (with PlatformAdmin)"
      - "POST /checkpoints/{checkpoint_id}/wait-observations (with DutyManager and SupervisoryOfficer)"
      - "every GET read endpoint"

  - name: StaffingPlanner
    description: "Prepares demand forecasts, staffing plans, lane assignments and surge-detail requests. Deliberately excluded from every approval decision — the segregation-of-duties leg of the model."
    identity: opaque
    exclusive_operations:
      - "POST /staffing-plans"
      - "POST /staffing-plans/{staffing_plan_id}/submit"
      - "POST /staffing-plans/{staffing_plan_id}/revise"
      - "POST /lane-assignments"
      - "POST /surge-details"
    shared_operations:
      - "POST /show-up-curves, POST /flight-schedule-entries, POST /flight-schedule-entries/{id}/cancel (with PlatformAdmin)"
      - "POST /time-bands, POST /time-bands/{id}/forecast (with PlatformAdmin and DutyManager)"
      - "every GET read endpoint"

  - name: DutyManager
    description: "Decides staffing plans and surge details and may cancel an approved detail. Cannot prepare, submit or revise the plan it decides, and cannot activate it."
    identity: opaque
    exclusive_operations:
      - "POST /staffing-plans/{staffing_plan_id}/decision"
      - "POST /surge-details/{surge_detail_id}/decision"
      - "POST /surge-details/{surge_detail_id}/cancel"
    shared_operations:
      - "POST /time-bands/{time_band_id}/forecast (with PlatformAdmin and StaffingPlanner)"
      - "POST /checkpoints/{checkpoint_id}/wait-observations (with CheckpointManager and SupervisoryOfficer)"
      - "POST /lane-assignments/{lane_assignment_id}/duty (with ScreeningOfficer and SupervisoryOfficer)"
      - "every GET read endpoint"

  - name: ScreeningOfficer
    description: "Line officer working a lane position. X-User-ID is an Officer.id, so ownership checks compare it directly against LaneAssignment.officer_id and ScreeningReferral.detecting_officer_id."
    identity: "entity_backed:Officer"
    exclusive_operations: []
    shared_operations:
      - "POST /lane-assignments/{lane_assignment_id}/duty, POST /lane-assignments/{lane_assignment_id}/break (with SupervisoryOfficer)"
      - "POST /screening-referrals (with SupervisoryOfficer)"
      - "POST /screening-referrals/{screening_referral_id}/resolve with outcome = CLEARED only (with SupervisoryOfficer)"
      - "every GET read endpoint except the three computed analytics reads"

  - name: SupervisoryOfficer
    description: "Floor supervisor. Same Officer-backed identity as ScreeningOfficer but authorised for lane opening, equipment reporting, escalation handling and the three non-CLEARED referral outcomes — the latter additionally gated on the SUPERVISOR certification of the Officer row."
    identity: "entity_backed:Officer"
    exclusive_operations:
      - "POST /escalation-tickets/{escalation_ticket_id}/acknowledge"
      - "POST /escalation-tickets/{escalation_ticket_id}/resolve"
      - "POST /screening-referrals/{screening_referral_id}/begin"
      - "POST /screening-referrals/{screening_referral_id}/resolve with outcome REFERRED_LEO, DENIED_ENTRY or WITHDRAWN"
    shared_operations:
      - "POST /lanes/{lane_id}/open, POST /lanes/{lane_id}/stand-down, POST /equipment-units/{id}/report-state (with CheckpointManager)"
      - "POST /checkpoints/{checkpoint_id}/wait-observations (with CheckpointManager and DutyManager)"
      - "POST /lane-assignments/{lane_assignment_id}/duty, POST /lane-assignments/{lane_assignment_id}/break, POST /screening-referrals (with ScreeningOfficer)"
      - "every GET read endpoint"
