  - name: retained_completion_fleet_capital_cascade
    grounds:
    - state_machines.ProductionOrder.IN_PRODUCTION_to_COMPLETED
    - calculations.lease_fleet_capital_allocation
    - calculations.order_price_quote
    - calculations.fleet_capital_reconciliation
    - entities.LeaseFleetCar.fields.acquisition_cost_cents
    - entities.LeaseContract.fields.capital_allocation_cents
    - state_machines.PortfolioLedger.OPEN_to_OPEN
    distinguishing_aspect: 'A depth-3 chain in which each hop is caused by the previous hop rather than
      by the

      trigger: ProductionOrder IN_PRODUCTION -> COMPLETED creates the LeaseFleetCar rows,

      and only then does lease_fleet_capital_allocation re-derive

      LeaseContract.capital_allocation_cents from the count of those new rows (2 x 660000),

      with PortfolioLedger.fleet_nbv_cents as the terminal hop over the same live-car set -

      no hop is a parallel mutation of the original action.

      '
    test_recipe:
      setup:
      - Logical clock at 2026-06-01T00:00:00Z; a BOXCAR car type BOX-100 (build_hours 4) whose bill of
        materials is one WHEELSET row (part WS-1000, unit_cost_cents 250000) and one CASTING row (part
        CS-2000, unit_cost_cents 180000), each qty_per_car 1, with on_hand_qty 4 each and no COATING row.
      - A lessee and an ACTIVE FULL_SERVICE contract with per_diem_rate_cents 45000, liability_bearer
        LESSOR and fleet_car_cap 2, so the 2-car retention fits validation priority 19.
      - A RETAINED production order of 2 cars is component-reserved, released against that contract and
        scheduled on BOX_LINE with a 8-day window, leaving the order IN_PRODUCTION and the fleet empty.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-06-01T00:00:00Z'
