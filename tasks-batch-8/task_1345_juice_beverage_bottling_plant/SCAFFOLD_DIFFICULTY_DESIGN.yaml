            - { call: "POST /v1/batches/${batch_id}/apply-adjustment", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/record-blend", payload: { measured_brix: 12.9 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/qa-verdict", payload: { verdict: "FAIL" }, as: QAInspector, as_user_id: "qa-1" }
          trigger:
            - { call: "POST /v1/batches/${batch_id}/apply-adjustment", payload: {}, as: BlendOperator, as_user_id: "op-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REBLEND_LIMIT_EXCEEDED (adjustment_count == 2 before the call; the check is count < 2, i.e. the THIRD adjustment is refused)"
            - "Batch.${batch_id}.adjustment_count == 2 and status remains QA_FAILED"
            - "Batch.${batch_id}.quantity_liters == 2153.4 (no partial adjustment applied)"

      - name: minimum_run_exactly_met_vs_one_below
        grounds:
          - errors[ERR_MINIMUM_RUN_NOT_MET]
          - entities.CustomerAccount.fields.minimum_run_units
        distinguishing_aspect: |
          Metric: planned units; endpoint: confirm. planned_units == 500 (exactly
          the customer minimum) confirms; planned_units == 499 fails — the gate
          is >= (inclusive), not >.
        test_recipe:
          setup:
            - "ACTIVE customer with minimum_run_units 500; APPROVED formula; run A planned 500, run B planned 499, both QUOTED"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "MinRunCo", credit_limit_cents: 1000000, minimum_run_units: 500, pallet_deposit_cents: 1500 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_id}/approve-credit", payload: {}, as: FinanceClerk }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "MR-1", name: "MinRun Juice", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id, form_v: $.data.version } }
            - { call: "POST /v1/formulas/${form_id}/submit-label-review", payload: { expected_formula_version: "${form_v}" }, as: ProductDeveloper, as_user_id: "dev-1", captures: { rev_id: $.data.id } }
            - { call: "POST /v1/label-reviews/${rev_id}/approve", payload: {}, as: LabelComplianceReviewer, as_user_id: "rev-1" }
            - { call: "POST /v1/production-runs", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", container_type: "PET_473", planned_units: 500, unit_price_cents: 150 }, as: ProductionPlanner, captures: { run_a: $.data.id } }
            - { call: "POST /v1/production-runs", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", container_type: "PET_473", planned_units: 499, unit_price_cents: 150 }, as: ProductionPlanner, captures: { run_b: $.data.id } }
          trigger:
            - { call: "POST /v1/production-runs/${run_a}/confirm", payload: {}, as: ProductionPlanner, captures: { a_status: $.data.production_status } }
            - { call: "POST /v1/production-runs/${run_b}/confirm", payload: {}, as: ProductionPlanner, captures: { b_err: $.data.error_id } }
          assert:
            - "run A: a_status == CONFIRMED (500 >= 500, inclusive boundary)"
            - "run B: b_err == ERR_MINIMUM_RUN_NOT_MET, HTTP 422 (499 < 500)"

      - name: credit_sweep_strictly_greater_boundary
        grounds:
          - calculations.credit_sweep
          - state_machines.CustomerAccount.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Metric: outstanding cents vs credit limit; endpoint: ops-runs. With
          outstanding == limit (149400 == 149400) the sweep leaves the customer
          ACTIVE; after a +1500 escrow charge (150900 > 149400) the next sweep
          suspends. Strictly-greater, not >=.
        test_recipe:
          setup:
            - "ACTIVE customer with credit_limit_cents EXACTLY 149400; run completed so outstanding == 149400 (provisional invoice)"
            - "Shipment order for 500 units (1 pallet, deposit 1500) placed and allocated"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "EdgeCredit", credit_limit_cents: 149400, minimum_run_units: 500, pallet_deposit_cents: 1500 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_id}/approve-credit", payload: {}, as: FinanceClerk }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "EC-473", name: "Edge Juice", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 120, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id, form_v: $.data.version } }
            - { call: "POST /v1/formulas/${form_id}/submit-label-review", payload: { expected_formula_version: "${form_v}" }, as: ProductDeveloper, as_user_id: "dev-1", captures: { rev_id: $.data.id } }
