      - name: load_patch_recomputes_counted
        claim_type: derived_field_reconciliation
        grounds: [calculations.load_calculation, "entities.ApplianceLoad.fields.counted_load_cfph", "concurrency_rules[appliance-load-update-stale]"]
        distinguishing_aspect: "PATCHing quantity 1→2 recomputes counted_load_cfph 80.0 → 160.0 immediately in the response and bumps version 1 → 2."
        test_recipe:
