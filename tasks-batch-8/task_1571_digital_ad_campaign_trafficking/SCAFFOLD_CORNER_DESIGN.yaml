      - name: creative_archived_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.Creative]
        distinguishing_aspect: "An ARCHIVED creative (via line-item cancel cascade) rejects any further transition, e.g. SUBMIT_QA → ERR_INVALID_STATE."
