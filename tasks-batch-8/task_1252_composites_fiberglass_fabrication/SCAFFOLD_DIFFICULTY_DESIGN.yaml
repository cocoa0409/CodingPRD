            - "err_touch == ERR_MOLD_OCCUPANCY_CONFLICT (start at exactly the demold instant intersects the closed interval)"
            - "wo2_status == LAYUP_IN_PROGRESS (one second later the interval no longer intersects)"

      - name: equipment_aggregate_capacity_half_open_adjacency
        grounds:
          - calculations.equipment_window_capacity
          - entities.CureCycle
          - validations[priority=10]
        distinguishing_aspect: |
          Resource = CureEquipment, interval semantics = half-open windows with
          AGGREGATE capacity: an adjacent cycle (start == prior end) does not
          overlap and is admitted even at quantity 2 on a 3-part oven, while a
          cycle straddling both windows pushes the overlapping quantity sum to
          6 > 3 and is rejected. Companion instance uses closed-interval
          exclusivity on a different resource (Mold).
        test_recipe:
          setup:
            - "Clock T0; permit; approved PN-100; three PRODUCTION molds interval 10; WO-A1/WO-B1/WO-C1 each at AWAITING_CURE with quantity 2; OVEN-CAP max_parts_per_cycle 3"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: ShopManager }
