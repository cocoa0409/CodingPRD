          - state_machines.RepairOrder.TEARDOWN_to_BLUEPRINTED
          - validations.priority_70
          - errors.ERR_NO_TEARDOWN_FINDINGS
        distinguishing_aspect: >-
          Rule 37 deliberately admits INTAKE into the blueprint from-set so that the finding-count
          check is the error the caller sees: an untorn-down order answers ERR_NO_TEARDOWN_FINDINGS
          (422), not ERR_STAGE_PRECONDITION, and no blueprint side effect fires - blueprint_by_user_id
          stays null and refinish_hours_provisional stays 0.
        test_recipe:
          setup:
            - "One Customer, one Insurer and one RepairOrder at INTAKE with teardown_finding_count 0."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Oli Bex", phone: "555-1014", email: "oli@example.com" }
