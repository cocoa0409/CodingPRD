        distinguishing_aspect: |
          Mode (b) second axis inside the fee formula itself: SUMMER_2027 STUDENT purchased 2027-06-07 — weekly rate
          round_half_up(6000/11) = 545 FIRST, x ceil(61/7) = 9 => 4905; the day-ratio interpretation (6000 * 61/75 = 4880)
