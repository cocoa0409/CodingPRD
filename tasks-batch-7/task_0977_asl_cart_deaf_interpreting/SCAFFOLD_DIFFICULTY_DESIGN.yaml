  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: submit_blocked_when_org_suspended
        grounds:
          - validations[priority=7]
          - state_machines.InterpretingRequest.DRAFT_to_MATCHING
        distinguishing_aspect: |
          Pair (RequestingOrg -> InterpretingRequest): the request's DRAFT -> MATCHING
          transition is gated on the OWNING ORG's status — a DRAFT request of a SUSPENDED
          org cannot submit, returning ERR_ORG_NOT_ACTIVE, independent of the request's
          own valid from-state.
        test_recipe:
          setup:
            - "Org created ACTIVE; request created in DRAFT; org then SUSPENDED by PlatformAdmin"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /orgs"
              payload: { name: "Metro Hospital", org_type: "MEDICAL", credit_limit_cents: 500000 }
              as: PlatformAdmin
              captures: { org1: $.data.id }
            - call: "POST /requests"
              payload: { org_id: "${org1}", consumer_name: "Pat Patient", modality: "VRI", ada_context: "GENERAL", scheduled_start: "2026-06-10T14:00:00Z", scheduled_end: "2026-06-10T15:00:00Z" }
              as: OrgRequester
              as_user_id: "${org1}"
              captures: { req1: $.data.id }
            - { call: "POST /orgs/${org1}/suspend", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /requests/${req1}/submit", payload: {}, as: OrgRequester, as_user_id: "${org1}", captures: { err_submit: $.data.error_id } }
            - { call: "GET /requests/${req1}", payload: {}, as: Any }
          assert:
            - "submit error_id == ERR_ORG_NOT_ACTIVE (409)"
            - "Request.${req1}.status remains DRAFT"

