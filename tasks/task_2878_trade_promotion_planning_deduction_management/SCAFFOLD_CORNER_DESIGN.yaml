              captures: { err: $.data.error_id }
          assert:
            - "${bal} == 0.00 and Promotion.${promo_id}.gross_accrued_amount == 0.00"
            - "HTTP 422 and ${err} == ERR_ACCRUAL_BALANCE_INSUFFICIENT"
            - "${err} != ERR_NO_PERFORMANCE_EVIDENCE — that rule does not apply under AGREEMENT_CAP"
            - "Deduction.${ded_id}.status == MATCHED and .validated_amount == null"

      - name: promotion_revision_cycle_bounded_at_two_rounds_corner_stub_errors
        claim_type: error_triggerable
        grounds:
