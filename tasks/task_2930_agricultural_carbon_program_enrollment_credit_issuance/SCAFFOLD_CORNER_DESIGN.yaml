          assert:
            - "the unknown-enrollment read returns HTTP 404 with response_type == \"error\", data.error_id == \"ERR_ENROLLMENT_NOT_FOUND\" and a non-empty data.message"
            - "the grower create with legal_name omitted returns HTTP 422 with data.error_id == \"ERR_INVALID_REQUEST\" and the response body carries no grower fields"
            - "the Grower calling the ProgramAdmin-exclusive baseline proposal returns HTTP 403 with data.error_id == \"ERR_UNAUTHORIZED\" and no Baseline is created"
