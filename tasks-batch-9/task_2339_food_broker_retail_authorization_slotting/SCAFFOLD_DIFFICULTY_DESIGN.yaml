            - "Principal.${prin}.slotting_committed_cents == 5887000, open_slotting_liability_cents == 5887000, liability_ratio_bps == 2943, credit_posture == NORMAL"
            - "Principal.${prin}.version incremented by exactly 1 by this accept"

      - name: deduction_settlement_and_dispute_dimensions_advance_independently
        grounds:
          - state_machines.Deduction.NOT_DISPUTED_to_FILED
          - state_machines.Deduction.FILED_to_SUBSTANTIATED
          - state_machines.Deduction.SUBSTANTIATED_to_DENIED
          - state_machines.Deduction.DENIED_to_FILED
          - state_machines.Deduction.SUBSTANTIATED_to_APPROVED
          - state_machines.Deduction.OPEN_to_RECOVERED
          - entities.Deduction.fields.refile_count
          - entities.Deduction.fields.open_cents
          - calculations.post_audit_recovery
        distinguishing_aspect: |
          Two PARALLEL state dimensions on one entity: dispute_state runs
          NOT_DISPUTED→FILED→SUBSTANTIATED→DENIED→FILED→SUBSTANTIATED→APPROVED
          while settlement_state stays OPEN for the entire round trip and only
          moves at the terminal approval. The DENIED→FILED refile is money-neutral
          (open_cents never changes, recovered/conceded stay 0) and resets
          substantiation_doc_count while incrementing refile_count. The sibling
          instance is a bounded CYCLE on a single dimension (SlottingDeal
          negotiation), not two independent dimensions.
        test_recipe:
          setup:
            - "Retailer BIGMART with deduction_dispute_window_days=90; principal NWF (PROSPECT is sufficient — deductions do not require an active principal)."
            - "Clock at 2026-08-01. A SHORTAGE deduction of 90000 cents dated 2026-08-01 exists, settlement_state OPEN / dispute_state NOT_DISPUTED, open_cents 90000."
            - "Broker user u_am_1 filed a claim for the full 90000 and attached two documents (dispute_state SUBSTANTIATED); audit user u_audit_1 then DENIED it, leaving settlement_state OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART", total_store_count: 1200, deduction_dispute_window_days: 90 }
              as: BrokerAdmin
              captures: { ret: $.data.id }
            - call: "POST /principals"
              payload: { name: "Northwind Foods", code: "NWF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { prin: $.data.id }
            - call: "POST /deductions"
              payload: { retailer_id: "${ret}", principal_id: "${prin}", reason_code: "SHORTAGE", amount_cents: 90000, deduction_date: "2026-08-01" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { ded: $.data.id }
            - call: "POST /deductions/${ded}/dispute"
              payload: { claim_amount_cents: 90000 }
              as: BrokerAccountManager
              as_user_id: "u_am_1"
            - call: "POST /deductions/${ded}/substantiate"
              payload: { document_ref: "POD-1001" }
              as: BrokerAccountManager
              as_user_id: "u_am_1"
            - call: "POST /deductions/${ded}/substantiate"
              payload: { document_ref: "INV-2002" }
              as: BrokerAccountManager
              as_user_id: "u_am_1"
            - call: "POST /deductions/${ded}/deny-recovery"
              payload: { denial_reason: "Shortage not evidenced at store level" }
              as: BrokerAuditManager
              as_user_id: "u_audit_1"
          trigger:
            - call: "POST /deductions/${ded}/dispute"
              payload: { claim_amount_cents: 90000 }
              as: BrokerAccountManager
              as_user_id: "u_am_1"
            - call: "POST /deductions/${ded}/substantiate"
              payload: { document_ref: "POD-1001-REV" }
              as: BrokerAccountManager
              as_user_id: "u_am_1"
            - call: "POST /deductions/${ded}/substantiate"
              payload: { document_ref: "SIGNED-BOL-3003" }
              as: BrokerAccountManager
              as_user_id: "u_am_1"
            - call: "POST /deductions/${ded}/approve-recovery"
              payload: {}
              as: BrokerAuditManager
              as_user_id: "u_audit_1"
          assert:
            - "After the setup denial: Deduction.${ded}.dispute_state == DENIED while settlement_state == OPEN, open_cents == 90000, recovered_cents == 0, conceded_cents == 0"
            - "After the refile: Deduction.${ded}.dispute_state == FILED, refile_count == 1, substantiation_doc_count reset to 0, denial_reason == null, and settlement_state still OPEN with open_cents == 90000"
            - "After the two substantiate calls: dispute_state == SUBSTANTIATED and substantiation_doc_count == 2 (the second call only increments the counter — no further transition)"
            - "After approve-recovery: dispute_state == APPROVED and settlement_state == RECOVERED"
