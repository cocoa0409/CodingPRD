              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "BRAND", channel_kind: "DIRECT_BRAND", commission_bp: 0 }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /distribution/channels/${brand_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://brand.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-10" }
              as: RevenueManager
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-11" }
              as: RevenueManager
              captures: { inv_11: $.data.id }
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-12" }
              as: RevenueManager
            - call: "POST /distribution/restrictions"
              payload: { room_type_id: "${king_id}", restriction_type: "CLOSED_TO_ARRIVAL", start_date: "2026-09-11", end_date: "2026-09-11" }
              as: RevenueManager
          trigger:
