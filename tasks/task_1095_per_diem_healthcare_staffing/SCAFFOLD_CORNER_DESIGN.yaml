          - entities.RateCard.fields.effective_from
          - entities.Shift.fields.base_pay_rate_cents_per_hour
        distinguishing_aspect: "Two open-ended RN cards are both selectable for a 2026-06-08 shift; the ranking rule picks the one with the greatest effective_from (2026-06-01, 9000 cents), so estimated_pay_cents is 103500 rather than 86250."
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; facility Kestrel with two RN rate cards: 7500 effective from 2026-01-01 and 9000 effective from 2026-06-01, both open-ended."
          setup_api_calls:
            - call: "POST /staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
