      - name: third_reinstatement_returns_reinstatement_limit_reached
        claim_type: error_triggerable
        grounds:
          - validations[priority=37]
          - errors[ERR_REINSTATEMENT_LIMIT_REACHED]
          - state_machines.LicenseRegistration.EXPIRED_to_ACTIVE
        distinguishing_aspect: |
          reinstatement_count < 2 permits exactly two trips around the reinstatement loop; the
          third REINSTATE is rejected 422 ERR_REINSTATEMENT_LIMIT_REACHED and the licence is
          left EXPIRED with reinstatement_count still 2 (the counter is not bumped by the
          failed attempt). Each successful reinstatement re-bases the calendar off the CLOCK,
          not off the old expiration_date: 2026-09-02 + 365 = 2027-09-02 with the window at
          2027-07-04, then 2027-09-03 + 365 = 2028-09-02 with the window at 2028-07-04. Because
          no renewal completion ever runs, ce_reporting_year stays 2026 and the same eight CE
          hours keep satisfying the reinstatement precondition all three times, so the only
          thing that changes across the three attempts is the counter.
        test_recipe:
          setup:
            - "Originator 2200001, EMPLOYED, with one CA licence CA-DFPI-70001 expiring
               2026-09-01 (window 2026-08-15, ce_reporting_year 2026, required_ce_hours 8),
               activated at 2026-08-01."
            - "Four CE courses completed 2026-08-01: FEDERAL_LAW 3h, ETHICS 2h,
               NONTRADITIONAL 2h, ELECTIVE 1h = 8 hours, all APPLIED and attributed to 2026,
               so ce_satisfied is true before the first expiry."
