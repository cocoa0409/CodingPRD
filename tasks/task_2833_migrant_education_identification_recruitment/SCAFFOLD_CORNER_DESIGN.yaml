            - call: "GET /mep/eligibility-terms"
              payload: { student_id: "${stu_id}" }
              as: ExchangeLiaison
              captures: { term_id: "$.data[0].id", term_status: "$.data[0].status" }
            - call: "GET /mep/students/${stu_id}"
