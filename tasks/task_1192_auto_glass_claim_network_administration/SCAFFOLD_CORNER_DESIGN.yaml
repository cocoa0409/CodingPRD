      - name: version_increments_on_every_mutation
        claim_type: derived_field_reconciliation
        grounds: ["entities.Claim", "complexity_profile.complexity_layers"]
        distinguishing_aspect: "Claim.version starts at 1 and increments by exactly 1 per mutation: verify (2), supplement (3), verify again (4)."
        test_recipe:
          setup: ["AZ regulation; policyholder + policy; claim created"]
          setup_api_calls:
            - call: "POST /state-regulations"
              payload: { state_code: "AZ", zero_deductible_windshield: false, glass_sales_tax_rate_bp: 560 }
              as: NetworkAdmin
            - call: "POST /policyholders"
              payload: { full_name: "Ver Bump", email: "vb@x.com", phone: "555-7003", state_code: "AZ" }
              as: NetworkAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", policy_number: "PN-VB-1", state_code: "AZ", coverage_type: "COMPREHENSIVE", deductible_cents: 50000, effective_start_date: "2026-01-01", effective_end_date: "2027-01-01" }
              as: NetworkAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", incident_state_code: "AZ", service_zip_code: "85001", part_category: "WINDSHIELD", loss_date: "2026-04-15", description: "vb claim", requires_adas_calibration: false, estimated_repair_cost_cents: 80000 }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/verify-coverage"
              payload: {}
