# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task_0279
# Breadth probe over claim-extraction-guide.md sections. Every active instance
# carries an executable setup_api_calls chain against flat §1.5 endpoints;
# excluded_because stubs point at the §1.8 instance that already covers the corner.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_with_computed_defaults
        claim_type: Creation
        grounds: [entities.Account.fields.status, entities.Account.fields.active_line_count, entities.Account.fields.group_discount_pct]
        distinguishing_aspect: "POST /accounts with all required fields returns 201; status==ACTIVE, active_line_count==0, group_discount_pct==0.00, wallet_credit_cents==0, version==1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { holder_name: "Zoe", holder_email: "zoe@x.com", billing_day_of_month: 15 }
              as: CarrierAgent
              captures: { acc_id: $.data.id }
          assert:
            - "HTTP 201; Account.status == ACTIVE; active_line_count == 0; group_discount_pct == 0.00; wallet_credit_cents == 0; version == 1"
            - "Response envelope has meta.api_request_id and response_type == object"

      - name: create_account_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds: [entities.Account.fields.holder_email, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /accounts omitting holder_email returns 422 ERR_VALIDATION; no account is created."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { holder_name: "NoEmail", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { err: $.data.error_id }
          assert: ["HTTP 422 with error_id == ERR_VALIDATION"]

      - name: get_account_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /accounts/{id} with a non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: CarrierAgent
              captures: { err: $.data.error_id }
          assert: ["HTTP 404 with error_id == ERR_NOT_FOUND"]

      - name: line_id_is_system_minted_input_ignored
        claim_type: System Fields
        grounds: [entities.Line.fields.status, entities.Line.fields.phone_number]
        distinguishing_aspect: "POST /lines does not let the client set status or phone_number; status is forced to PENDING_ACTIVATION and phone_number to null regardless of any client attempt (unknown body keys rejected as ERR_VALIDATION)."
        test_recipe:
          setup: ["An ACTIVE account and an ACTIVE plan exist."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "Sys", holder_email: "sys@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /plans"
              payload: { code: "P-SYS", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "ESIM", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { line_id: $.data.id, st: $.data.status }
          assert:
            - "HTTP 201; Line.${line_id}.status == PENDING_ACTIVATION; Line.${line_id}.phone_number == null"

      - name: plan_code_enum_and_sim_type_enum_rejected_on_invalid
        claim_type: Type Constraints
        grounds: [entities.Line.fields.sim_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /lines with sim_type == 'TRIPLE' (not in {PHYSICAL,ESIM}) returns 422 ERR_VALIDATION."
        test_recipe:
          setup: ["An ACTIVE account and plan exist."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "Enum", holder_email: "enum@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /plans"
              payload: { code: "P-EN", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "TRIPLE", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { err: $.data.error_id }
          assert: ["HTTP 422 with error_id == ERR_VALIDATION"]

      - name: charge_immutable_event_no_version_field
        claim_type: Immutability
        grounds: [entities.Charge.common_fields, entities.Charge.fields.amount_cents]
        distinguishing_aspect: "Charge is an append-only event (common_fields: false): there is no PUT/PATCH/DELETE endpoint for /charges and no version field — only GET listing and single-fetch exist."
        test_recipe:
          setup: ["No charges needed; assert the §1.5 surface shape."]
          setup_api_calls: []
          trigger:
            - call: "GET /charges"
              payload: {}
              as: BillingSystem
          assert:
            - "GET /charges returns 200 with an array (possibly empty); no mutate endpoint for Charge exists in §1.5"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: suspend_already_suspended_line_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Line.ACTIVE_to_SUSPENDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Suspending a line already in SUSPENDED returns 409 ERR_INVALID_STATE; no SIM/add-on side effects fire a second time."
        test_recipe:
          setup: ["A line in SUSPENDED state."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "SS", holder_email: "ss@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /plans"
              payload: { code: "P-SS", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "PHYSICAL", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { line_id: $.data.id }
            - call: "POST /sim-assignments"
              payload: { line_id: "${line_id}", sim_type: "PHYSICAL", iccid: "8901000000000000200" }
              as: CarrierAgent
            - call: "POST /lines/${line_id}/activate"
              payload: {}
              as: CarrierAgent
            - call: "POST /lines/${line_id}/suspend"
              payload: { suspend_reason: "VOLUNTARY" }
              as: CarrierAgent
          trigger:
            - call: "POST /lines/${line_id}/suspend"
              payload: { suspend_reason: "VOLUNTARY" }
              as: CarrierAgent
              captures: { err: $.data.error_id }
          assert: ["HTTP 409 with error_id == ERR_INVALID_STATE; Line.${line_id}.status stays SUSPENDED"]

      - name: cancel_terminal_line_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Line.ACTIVE_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a line already CANCELLED (terminal) returns 409 ERR_INVALID_STATE; no cascade re-runs."
        test_recipe:
          setup: ["A CANCELLED line."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "TT", holder_email: "tt@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingSystem
            - call: "POST /billing-cycles"
              payload: { account_id: "${acc_id}", cycle_start: "2026-06-01T00:00:00Z", cycle_end: "2026-07-01T00:00:00Z" }
              as: BillingSystem
            - call: "POST /plans"
              payload: { code: "P-TT", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "PHYSICAL", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { line_id: $.data.id }
            - call: "POST /sim-assignments"
              payload: { line_id: "${line_id}", sim_type: "PHYSICAL", iccid: "8901000000000000210" }
              as: CarrierAgent
            - call: "POST /lines/${line_id}/activate"
              payload: {}
              as: CarrierAgent
            - call: "POST /lines/${line_id}/cancel"
              payload: {}
              as: Subscriber
              as_user_id: "${acc_id}"
          trigger:
            - call: "POST /lines/${line_id}/cancel"
              payload: {}
              as: Subscriber
              as_user_id: "${acc_id}"
              captures: { err: $.data.error_id }
          assert: ["HTTP 409 with error_id == ERR_INVALID_STATE"]

      - name: cancel_blocked_by_in_progress_port_request
        claim_type: guarded transitions
        grounds: [state_machines.Line.ACTIVE_to_CANCELLED, "errors[ERR_PORT_IN_PROGRESS]"]
        distinguishing_aspect: "Cancelling a line that has a REQUESTED PortRequest returns 409 ERR_PORT_IN_PROGRESS (guard on a sibling PortRequest's state)."
        test_recipe:
          setup: ["An ACTIVE line with a REQUESTED PORT_OUT pending."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "GG", holder_email: "gg@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /plans"
              payload: { code: "P-GG", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "PHYSICAL", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { line_id: $.data.id }
            - call: "POST /sim-assignments"
              payload: { line_id: "${line_id}", sim_type: "PHYSICAL", iccid: "8901000000000000220" }
              as: CarrierAgent
            - call: "POST /lines/${line_id}/activate"
              payload: {}
              as: CarrierAgent
            - call: "POST /port-requests"
              payload: { line_id: "${line_id}", direction: "PORT_OUT", external_number: "12025550133", donor_carrier: "RivalCo", account_pin: "2468" }
              as: Subscriber
              as_user_id: "${acc_id}"
              captures: { pr_id: $.data.id }
          trigger:
            - call: "POST /lines/${line_id}/cancel"
              payload: {}
              as: Subscriber
              as_user_id: "${acc_id}"
              captures: { err: $.data.error_id }
          assert: ["HTTP 409 with error_id == ERR_PORT_IN_PROGRESS"]

      - name: revert_portout_returns_not_revertable
        claim_type: Invalid Transitions
        grounds: [state_machines.PortRequest.COMPLETED_to_REVERTED, "errors[ERR_PORT_NOT_REVERTABLE]"]
        distinguishing_aspect: "Reverting a COMPLETED PORT_OUT returns 409 ERR_PORT_NOT_REVERTABLE — only PORT_IN is revertable."
        test_recipe:
          setup: ["A COMPLETED PORT_OUT on a (now cancelled) line."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "RR", holder_email: "rr@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /plans"
              payload: { code: "P-RR", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "PHYSICAL", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { line_id: $.data.id }
            - call: "POST /sim-assignments"
              payload: { line_id: "${line_id}", sim_type: "PHYSICAL", iccid: "8901000000000000230" }
              as: CarrierAgent
            - call: "POST /lines/${line_id}/activate"
              payload: {}
              as: CarrierAgent
            - call: "POST /port-requests"
              payload: { line_id: "${line_id}", direction: "PORT_OUT", external_number: "12025550144", donor_carrier: "RivalCo", account_pin: "1357" }
              as: Subscriber
              as_user_id: "${acc_id}"
              captures: { pr_id: $.data.id }
            - call: "POST /port-requests/${pr_id}/validate"
              payload: { account_pin: "1357" }
              as: PortingOps
            - call: "POST /port-requests/${pr_id}/complete"
              payload: {}
              as: PortingOps
          trigger:
            - call: "POST /port-requests/${pr_id}/revert"
              payload: {}
              as: PortingOps
              captures: { err: $.data.error_id }
          assert: ["HTTP 409 with error_id == ERR_PORT_NOT_REVERTABLE"]

      - name: validate_port_pin_mismatch_rejects
        claim_type: Side Effect Execution
        grounds: [state_machines.PortRequest.REQUESTED_to_VALIDATED, entities.PortRequest.fields.reject_reason]
        distinguishing_aspect: "validate with a wrong account_pin transitions the PortRequest to REJECTED with reject_reason==PIN_MISMATCH (not VALIDATED)."
        test_recipe:
          setup: ["A REQUESTED PORT_IN whose stored account_pin is 1111."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "PM", holder_email: "pm@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /plans"
              payload: { code: "P-PM", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "PHYSICAL", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { line_id: $.data.id }
            - call: "POST /sim-assignments"
              payload: { line_id: "${line_id}", sim_type: "PHYSICAL", iccid: "8901000000000000240" }
              as: CarrierAgent
            - call: "POST /lines/${line_id}/activate"
              payload: {}
              as: CarrierAgent
            - call: "POST /port-requests"
              payload: { line_id: "${line_id}", direction: "PORT_IN", external_number: "12025550155", donor_carrier: "OtherCo", account_pin: "1111" }
              as: Subscriber
              as_user_id: "${acc_id}"
              captures: { pr_id: $.data.id }
          trigger:
            - call: "POST /port-requests/${pr_id}/validate"
              payload: { account_pin: "2222" }
              as: PortingOps
              captures: { st: $.data.status, rr: $.data.reject_reason }
          assert:
            - "PortRequest.${pr_id}.status == REJECTED; reject_reason == PIN_MISMATCH"

      - name: addon_activate_before_window_start_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.AddOn.SCHEDULED_to_ACTIVE, "errors[ERR_ADDON_WINDOW_NOT_STARTED]"]
        distinguishing_aspect: "Activating a SCHEDULED add-on while current UTC < window_start returns 409 ERR_ADDON_WINDOW_NOT_STARTED."
        test_recipe:
          setup: ["An ACTIVE line with a SCHEDULED INTL_MONTHLY add-on whose window_start is 2026-07-01; clock at 2026-06-10."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "AW", holder_email: "aw@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: BillingSystem
            - call: "POST /plans"
              payload: { code: "P-AW", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "PHYSICAL", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { line_id: $.data.id }
            - call: "POST /sim-assignments"
              payload: { line_id: "${line_id}", sim_type: "PHYSICAL", iccid: "8901000000000000250" }
              as: CarrierAgent
            - call: "POST /lines/${line_id}/activate"
              payload: {}
              as: CarrierAgent
            - call: "POST /addons"
              payload: { line_id: "${line_id}", addon_type: "INTL_MONTHLY", monthly_fee_cents: 3000, window_start: "2026-07-01T00:00:00Z", window_end: "2026-08-01T00:00:00Z" }
              as: Subscriber
              as_user_id: "${acc_id}"
              captures: { addon_id: $.data.id }
          trigger:
            - call: "POST /addons/${addon_id}/activate"
              payload: {}
              as: Subscriber
              as_user_id: "${acc_id}"
              captures: { err: $.data.error_id }
          assert: ["HTTP 409 with error_id == ERR_ADDON_WINDOW_NOT_STARTED"]

  # ===========================================================================
  - section: calculations
    instances:
      - name: eip_schedule_financed_and_monthly_computed
        claim_type: Correct Result
        grounds: [calculations.eip_schedule, entities.InstallmentPlan.fields.financed_cents, entities.InstallmentPlan.fields.monthly_installment_cents]
        distinguishing_aspect: "Creating an EIP (retail 99900, down 9900, term 24) yields financed_cents==90000, monthly_installment_cents==ceil(90000/24)==3750, remaining_balance_cents==90000, installments_paid==0."
        test_recipe:
          setup: ["An ACTIVE line and a device retail 99900, stock 5."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "EC", holder_email: "ec@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /plans"
              payload: { code: "P-EC", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
            - call: "POST /devices"
              payload: { model: "Phone EC", sku: "EC-1", retail_price_cents: 99900, stock_count: 5 }
              as: CarrierAgent
              captures: { dev_id: $.data.id }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "PHYSICAL", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { line_id: $.data.id }
            - call: "POST /sim-assignments"
              payload: { line_id: "${line_id}", sim_type: "PHYSICAL", iccid: "8901000000000000260" }
              as: CarrierAgent
            - call: "POST /lines/${line_id}/activate"
              payload: {}
              as: CarrierAgent
          trigger:
            - call: "POST /installment-plans"
              payload: { line_id: "${line_id}", device_id: "${dev_id}", term_months: 24, down_payment_cents: 9900 }
              as: CarrierAgent
              captures: { eip_id: $.data.id, fin: $.data.financed_cents, mon: $.data.monthly_installment_cents }
          assert:
            - "InstallmentPlan.${eip_id}.financed_cents == 90000"
            - "InstallmentPlan.${eip_id}.monthly_installment_cents == 3750"
            - "InstallmentPlan.${eip_id}.remaining_balance_cents == 90000; installments_paid == 0"

      - name: overage_tier2_straddle_correct_cents
        claim_type: Correct Result
        grounds: [calculations.line_overage, entities.Plan.fields.overage_tier2_rate_milli_cents]
        distinguishing_aspect: "Usage 23000 MB (over 2520, all in tier1) yields overage_cents==2520 — verifies tier1-only path distinct from the §1.8 tier-straddle (28000)."
        test_recipe:
          setup: ["Single ACTIVE line on PLUS; clock 2026-06-15 in 30-day cycle; used 23000 MB DATA."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "OT", holder_email: "ot@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingSystem
            - call: "POST /billing-cycles"
              payload: { account_id: "${acc_id}", cycle_start: "2026-06-01T00:00:00Z", cycle_end: "2026-07-01T00:00:00Z" }
              as: BillingSystem
            - call: "POST /plans"
              payload: { code: "P-OT", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "ESIM", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { line_id: $.data.id }
            - call: "POST /sim-assignments"
              payload: { line_id: "${line_id}", sim_type: "ESIM" }
              as: CarrierAgent
            - call: "POST /lines/${line_id}/activate"
              payload: {}
              as: CarrierAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: BillingSystem
            - call: "POST /usage-records"
              payload: { line_id: "${line_id}", usage_type: "DATA", data_mb: 23000, occurred_at: "2026-06-15T01:00:00Z" }
              as: CarrierAgent
          trigger:
            - call: "GET /lines/${line_id}/usage-summary"
              payload: {}
              as: CarrierAgent
              captures: { ov: $.data.overage_cents }
          assert: ["usage-summary.overage_cents == 2520 (2520 MB at tier1 rate 1c/MB)"]

      - name: usage_summary_data_aggregates_multiple_records
        claim_type: Input Set Filtering
        grounds: [calculations.line_overage, entities.Line.fields.cycle_data_used_mb]
        distinguishing_aspect: "cycle_data_used_mb sums only DATA records inside the open cycle: two DATA records (10000 + 11000) plus one VOICE record yield cycle_data_used_mb==21000 (VOICE ignored)."
        test_recipe:
          setup: ["ACTIVE line on PLUS, clock 2026-06-15 in 30-day cycle."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "AG", holder_email: "ag@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingSystem
            - call: "POST /billing-cycles"
              payload: { account_id: "${acc_id}", cycle_start: "2026-06-01T00:00:00Z", cycle_end: "2026-07-01T00:00:00Z" }
              as: BillingSystem
            - call: "POST /plans"
              payload: { code: "P-AG", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "ESIM", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { line_id: $.data.id }
            - call: "POST /sim-assignments"
              payload: { line_id: "${line_id}", sim_type: "ESIM" }
              as: CarrierAgent
            - call: "POST /lines/${line_id}/activate"
              payload: {}
              as: CarrierAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: BillingSystem
            - call: "POST /usage-records"
              payload: { line_id: "${line_id}", usage_type: "DATA", data_mb: 10000, occurred_at: "2026-06-15T01:00:00Z" }
              as: CarrierAgent
            - call: "POST /usage-records"
              payload: { line_id: "${line_id}", usage_type: "DATA", data_mb: 11000, occurred_at: "2026-06-15T02:00:00Z" }
              as: CarrierAgent
            - call: "POST /usage-records"
              payload: { line_id: "${line_id}", usage_type: "VOICE", data_mb: 0, occurred_at: "2026-06-15T03:00:00Z" }
              as: CarrierAgent
          trigger:
            - call: "GET /lines/${line_id}/usage-summary"
              payload: {}
              as: CarrierAgent
              captures: { used: $.data.cycle_data_used_mb }
          assert:
            - "usage-summary.cycle_data_used_mb == 21000 (10000+11000; VOICE excluded)"
            - "usage-summary.overage_cents == 520 (21000-20480=520 MB at tier1)"

