            - "Application.${app_p_id}.determined_benefit_cents == 1000"
            - "AssistanceCase.${case_p_id}.benefit_amount_cents == 1000"
            - "AssistanceCase.${case_p_id}.benefit_status == PENDING_ISSUANCE"
            - "the second trigger call returns HTTP 422 with data.error_id == ERR_INELIGIBLE_ZERO_BENEFIT"
            - "Application.${app_q_id}.countable_income_cents == 47825"
            - "Application.${app_q_id}.determined_benefit_cents == 0"
            - "Application.${app_q_id}.status == DETERMINED"

