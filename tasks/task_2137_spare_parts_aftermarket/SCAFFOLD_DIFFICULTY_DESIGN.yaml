          assert:
            - "setup consequence: after allocate AllocationRequest.${ar_id}.status == GRANTED, granted_units == 60, priority_score == 50, dealer_installed_units == 0"
            - "setup consequence: after allocate LastTimeBuyCampaign.${c_id}.remaining_qty == 40 and 100 == 40 + 60"
            - "after withdraw AllocationRequest.${ar_id}.status == WITHDRAWN and granted_units == 0"
            - "after withdraw LastTimeBuyCampaign.${c_id}.remaining_qty == 100 and approved_qty == 100, so 100 == 100 + 0"
            - "LastTimeBuyCampaign.${c_id}.status == ALLOCATING (the withdraw does not reopen the campaign)"
            - "Part.${p_id}.lifecycle_state == LTB_OPEN and Part.${p_id}.on_hand_units == 0 — allocation entitlement never touches physical stock"

      - name: dealer_money_conservation_charge_then_restock_credit
        grounds:
          - calculations.return_restocking_fee_and_credit
          - entities.Dealer.fields.outstanding_balance_cents
          - entities.Dealer.fields.lifetime_restocking_fee_cents
          - entities.Dealer.fields.lifetime_rebate_cents
        distinguishing_aspect: |
          Conserved quantity 3 — MONEY, distinct from both units and entitlement. The pinned
          identity outstanding_balance_cents - lifetime_restocking_fee_cents +
          lifetime_rebate_cents returns to the pre-consume value 0 exactly: the dealer is
          charged 12597, credited 9448, and the 3149-cent residue is fully explained by the
          recorded restocking fee.
        test_recipe:
          setup:
            - "one ACTIVE DESIRABLE price rule with base_uplift_pct 0.35, max_uplift_pct 0.60, min_margin_pct 0.20"
            - "a GOLD dealer whose outstanding_balance_cents, lifetime_restocking_fee_cents and lifetime_rebate_cents all start at 0"
            - "part MON-1 with unit_cost_cents 1333 and 20 units received"
            - "one line of qty 7 consumed at 2026-08-01T00:00:00Z for charged_amount_cents 12597"
            - "the logical clock advanced to 2026-09-15T00:00:00Z, so age_days == 45 and the age surcharge tier is 0.10"
            - "an APPROVED-then-RECEIVED RMA for all 7 units with return_reason UNUSED_SURPLUS"
          setup_api_calls:
            - call: "POST /aftermarket/price-rules"
              payload: { criticality_class: "DESIRABLE", base_uplift_pct: 0.35, max_uplift_pct: 0.60, min_margin_pct: 0.20 }
              as: PricingAnalyst
              as_user_id: "pricing-1"
            - call: "POST /aftermarket/dealers"
              payload: { dealer_code: "D-MON", tier: "GOLD", region: "NA", credit_limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { d_id: $.data.id }
            - call: "POST /aftermarket/equipment-models"
              payload: { model_code: "EM-J10", name: "Jetter J10", production_end_date: "2025-01-01T00:00:00Z", support_end_date: "2035-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_id: $.data.id }
            - call: "POST /aftermarket/installed-units"
              payload: { model_id: "${m_id}", dealer_id: "${d_id}", serial_number: "SN-J101", build_revision: 100, commission_date: "2025-06-01T00:00:00Z", region: "NA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { u_id: $.data.id }
            - call: "POST /aftermarket/parts"
              payload: { part_number: "MON-1", description: "Money conservation probe part", unit_cost_cents: 1333, lead_time_days: 30, weight_kg: 2.0 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_id: $.data.id }
            - call: "POST /aftermarket/part-applicabilities"
              payload: { part_id: "${p_id}", model_id: "${m_id}", effective_from_build_revision: 0, qty_per_unit: 1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "POST /aftermarket/replenishment-orders"
              payload: { part_id: "${p_id}", order_type: "STOCK", qty: 20 }
              as: InventoryController
              as_user_id: "ctrl-1"
              captures: { ro_id: $.data.id }
            - call: "POST /aftermarket/replenishment-orders/${ro_id}/approve"
              payload: {}
              as: InventoryController
              as_user_id: "ctrl-1"
            - call: "POST /aftermarket/replenishment-orders/${ro_id}/ship"
              payload: {}
              as: InventoryController
              as_user_id: "ctrl-1"
            - call: "POST /aftermarket/replenishment-orders/${ro_id}/receive"
              payload: {}
              as: InventoryController
              as_user_id: "ctrl-1"
            - call: "POST /aftermarket/work-orders"
              payload: { installed_unit_id: "${u_id}", work_type: "SCHEDULED_MAINTENANCE", downtime_priority: "PLANNED" }
              as: DealerUser
              as_user_id: "${d_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /aftermarket/work-orders/${wo_id}/part-lines"
              payload: { part_id: "${p_id}", qty_requested: 7 }
              as: DealerUser
              as_user_id: "${d_id}"
              captures: { line_id: $.data.id }
            - call: "POST /aftermarket/work-order-part-lines/${line_id}/consume"
              payload: { qty_consumed: 7 }
              as: DealerUser
              as_user_id: "${d_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /aftermarket/return-authorizations"
              payload: { work_order_part_line_id: "${line_id}", qty_returned: 7, return_reason: "UNUSED_SURPLUS" }
              as: DealerUser
              as_user_id: "${d_id}"
              captures: { rma_id: $.data.id }
            - call: "POST /aftermarket/return-authorizations/${rma_id}/approve"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "POST /aftermarket/return-authorizations/${rma_id}/receive"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
          trigger:
            - call: "POST /aftermarket/return-authorizations/${rma_id}/inspect"
              payload: { disposition: "RESTOCK" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
          assert:
            - "setup consequence: WorkOrderPartLine.${line_id}.charged_amount_cents == 12597 and Dealer.${d_id}.outstanding_balance_cents was 12597 before the inspection"
            - "ReturnAuthorization.${rma_id}.age_days == 45"
            - "ReturnAuthorization.${rma_id}.fee_pct == 0.2500"
            - "ReturnAuthorization.${rma_id}.gross_credit_cents == 12597"
            - "ReturnAuthorization.${rma_id}.restocking_fee_cents == 3149"
            - "ReturnAuthorization.${rma_id}.net_before_rebate_cents == 9448"
            - "ReturnAuthorization.${rma_id}.rebate_pct == 0.0000 and loyalty_rebate_cents == 0"
            - "ReturnAuthorization.${rma_id}.final_credit_cents == 9448 and credit_posted_cents == 9448"
            - "Dealer.${d_id}.outstanding_balance_cents == 3149"
            - "Dealer.${d_id}.lifetime_restocking_fee_cents == 3149 and lifetime_rebate_cents == 0"
            - "invariant: 3149 - 3149 + 0 == 0, the pre-consume outstanding_balance_cents"
            - "Dealer.${d_id}.credit_hold == false"
