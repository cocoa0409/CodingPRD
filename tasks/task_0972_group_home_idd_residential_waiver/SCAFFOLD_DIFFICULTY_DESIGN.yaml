  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: bed_assignment_half_open_adjacency_allowed
        grounds:
          - validations[priority=6.1]
          - errors[ERR_BED_OVERLAP]
          - entities.BedAssignment.fields.move_out_date
        distinguishing_aspect: |
          Interval semantics: pure half-open [move_in_date, move_out_date) with NO
          buffer — a successor starting exactly at the predecessor's end date is
          legal adjacency; starting one day earlier intersects. Resource:
          (home_id, bed_label). Endpoint: POST /bed-assignments.
        test_recipe:
          setup:
            - "Home (3 beds); I1, I2, I3 ENROLLED; A1 occupied bed R1-A [2026-06-01, 2026-06-16) and moved out on 2026-06-16; clock 2026-06-01"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /homes", payload: { agency_id: "${ag_id}", name: "Home A", license_number: "LIC-1", certified_bed_count: 3 }, as: AgencyAdmin, captures: { hm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Quinn Qidp", staff_role: "QIDP", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { q_id: $.data.id } }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind One", medicaid_id: "MCD-001", date_of_birth: "1990-01-01", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ind1_id: $.data.id } }
            - { call: "POST /individuals/${ind1_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind Two", medicaid_id: "MCD-002", date_of_birth: "1985-05-05", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ind2_id: $.data.id } }
            - { call: "POST /individuals/${ind2_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind Three", medicaid_id: "MCD-003", date_of_birth: "1988-08-08", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ind3_id: $.data.id } }
            - { call: "POST /individuals/${ind3_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /bed-assignments", payload: { home_id: "${hm_id}", bed_label: "R1-A", individual_id: "${ind1_id}", move_in_date: "2026-06-01" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ba1_id: $.data.id } }
            - { call: "POST /bed-assignments/${ba1_id}/move-in", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /bed-assignments/${ba1_id}/move-out", payload: { move_out_date: "2026-06-16" }, as: QIDP, as_user_id: "${q_id}" }
          trigger:
            - { call: "POST /bed-assignments", payload: { home_id: "${hm_id}", bed_label: "R1-A", individual_id: "${ind2_id}", move_in_date: "2026-06-16" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ba2_id: $.data.id, ba2_st: $.data.status } }
            - { call: "POST /bed-assignments", payload: { home_id: "${hm_id}", bed_label: "R1-A", individual_id: "${ind3_id}", move_in_date: "2026-06-15" }, as: CaseManager, as_user_id: "${cm_id}", captures: { err: $.data.error_id } }
          assert:
            - "adjacent assignment (move_in 2026-06-16 == prior move_out 2026-06-16) is ACCEPTED with status PENDING — half-open intervals touch without intersecting"
            - "overlapping assignment (move_in 2026-06-15, one day inside) is rejected with ERR_BED_OVERLAP"

      - name: shift_rest_buffer_closed_interval
        grounds:
          - validations[priority=6]
          - errors[ERR_SHIFT_OVERLAP]
          - entities.ShiftAssignment.fields.window_end
        distinguishing_aspect: |
          Interval semantics differ from the bed rule: a MANDATORY 8-HOUR REST
          BUFFER applies between consecutive shifts of the same staff member —
          exact adjacency (gap 0) is illegal, and the buffer boundary is
          inclusive (gap >= 8h passes; 7h59m fails). Resource: StaffMember.
          Endpoint: POST /shifts.
        test_recipe:
          setup:
            - "Home ACTIVE; DSP D1 with existing DAY shift 2026-06-02 07:00-15:00; clock 2026-06-01"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /homes", payload: { agency_id: "${ag_id}", name: "Home A", license_number: "LIC-1", certified_bed_count: 2 }, as: AgencyAdmin, captures: { hm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Dee Spone", staff_role: "DSP", certifications: ["MED_CERT", "CPR"], hire_date: "2025-02-01" }, as: AgencyAdmin, captures: { d1_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /shifts", payload: { home_id: "${hm_id}", staff_member_id: "${d1_id}", window_start: "2026-06-02T07:00:00Z", window_end: "2026-06-02T15:00:00Z", shift_type: "DAY" }, as: AgencyAdmin, captures: { sh1_id: $.data.id } }
          trigger:
            - { call: "POST /shifts", payload: { home_id: "${hm_id}", staff_member_id: "${d1_id}", window_start: "2026-06-02T23:00:00Z", window_end: "2026-06-03T07:00:00Z", shift_type: "NIGHT" }, as: AgencyAdmin, captures: { sh2_id: $.data.id, sh2_st: $.data.status } }
            - { call: "POST /shifts", payload: { home_id: "${hm_id}", staff_member_id: "${d1_id}", window_start: "2026-06-03T14:59:00Z", window_end: "2026-06-03T20:00:00Z", shift_type: "DAY" }, as: AgencyAdmin, captures: { err: $.data.error_id } }
          assert:
            - "shift starting exactly 8h after the prior shift's end (15:00 -> 23:00) is ACCEPTED (gap >= 8h boundary is inclusive)"
            - "shift starting 7h59m after the night shift's end (07:00 -> 14:59) is REJECTED with ERR_SHIFT_OVERLAP"
            - "GET /shifts?staff_member_id=${d1_id} returns exactly 2 shifts"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (2 instances, different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: pay_then_void_restores_cash_ledger
        grounds:
          - calculations.recoupment_netting
          - state_machines.BillingClaim.PAID_to_VOIDED
          - entities.ProviderAgency.fields.cash_collected_cents
        distinguishing_aspect: |
          Conserved quantity: agency cash in cents. The forward action
          (post-payment of 30000) and its compensating action (void) must leave
          ProviderAgency.cash_collected_cents exactly at its pre-payment value;
          the voided amount reappears as recoupment_balance_cents (30000), not
          as cash drift.
        test_recipe:
          setup:
            - "Individual ENROLLED, ISP ACTIVE, DAY_PROG authorization ACTIVE (24 units, 1500 cents); two verified 150-minute visits on 2026-06-02 (10 units each); claim generated (20 units, 30000 cents), submitted by bill-1; clock 2026-06-01"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id, cash0: $.data.cash_collected_cents } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Quinn Qidp", staff_role: "QIDP", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { q_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Dee Spone", staff_role: "DSP", certifications: ["MED_CERT", "CPR"], hire_date: "2025-02-01" }, as: AgencyAdmin, captures: { d1_id: $.data.id } }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind One", medicaid_id: "MCD-001", date_of_birth: "1990-01-01", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ind_id: $.data.id } }
            - { call: "POST /individuals/${ind_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}", captures: { ind_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /isps", payload: { individual_id: "${ind_id}", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", goals_summary: "Community integration goals", expected_individual_version: "${ind_v}" }, as: CaseManager, as_user_id: "${cm_id}", captures: { isp_id: $.data.id } }
            - { call: "POST /isps/${isp_id}/submit-review", payload: {}, as: CaseManager, as_user_id: "${cm_id}" }
            - { call: "POST /isps/${isp_id}/approve", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /isps/${isp_id}/activate", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /authorizations", payload: { individual_id: "${ind_id}", isp_id: "${isp_id}", service_code: "DAY_PROG", unit_type: "FIFTEEN_MIN", authorized_units: 24, rate_cents: 1500, span_start: "2026-01-01", span_end: "2026-12-31" }, as: CaseManager, as_user_id: "${cm_id}", captures: { auth_id: $.data.id } }
            - { call: "POST /authorizations/${auth_id}/approve", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /evv-visits", payload: { individual_id: "${ind_id}", authorization_id: "${auth_id}", service_date: "2026-06-02", check_in_at: "2026-06-02T08:00:00Z", check_out_at: "2026-06-02T10:30:00Z", geo_within_radius: true }, as: DSP, as_user_id: "${d1_id}", captures: { v1_id: $.data.id } }
            - { call: "POST /evv-visits", payload: { individual_id: "${ind_id}", authorization_id: "${auth_id}", service_date: "2026-06-02", check_in_at: "2026-06-02T12:00:00Z", check_out_at: "2026-06-02T14:30:00Z", geo_within_radius: true }, as: DSP, as_user_id: "${d1_id}", captures: { v2_id: $.data.id } }
            - { call: "POST /evv-visits/${v1_id}/verify", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /evv-visits/${v2_id}/verify", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /claims", payload: { individual_id: "${ind_id}", service_period_start: "2026-06-02", service_period_end: "2026-06-02" }, as: BillingSpecialist, as_user_id: "bill-1", captures: { claim_id: $.data.id, claim_total: $.data.total_amount_cents } }
            - { call: "POST /claims/${claim_id}/submit", payload: {}, as: BillingSpecialist, as_user_id: "bill-1" }
          trigger:
            - { call: "POST /claims/${claim_id}/post-payment", payload: { paid_amount_cents: 30000 }, as: BillingSpecialist, as_user_id: "bill-2", captures: { net: $.data.posted_net_cents, st_paid: $.data.status } }
            - { call: "POST /claims/${claim_id}/void", payload: {}, as: BillingSpecialist, as_user_id: "bill-1", captures: { st_void: $.data.status } }
            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: Any
              captures: { cash_f: $.data.cash_collected_cents, recbal_f: $.data.recoupment_balance_cents }
          assert:
            - "payment posted posted_net_cents == 30000 (recoupment balance was 0, so recoup == 0)"
            - "after void: agency.cash_collected_cents == 0 — exactly the pre-payment value (conserved cents)"
            - "agency.recoupment_balance_cents == 30000 (the voided net is now owed back, tracked separately)"
            - "claim status == VOIDED"

      - name: verify_then_void_restores_unit_pool
        grounds:
          - calculations.authorization_waterfall_allocation
          - state_machines.BillingClaim.PAID_to_VOIDED
          - entities.ServiceAuthorization.fields.consumed_units
          - entities.EVVVisit.fields.allocated_units_entries
        distinguishing_aspect: |
          Conserved quantity: authorized service UNITS (different from cash
          cents). Verification consumes units across two authorizations by
          waterfall (24 onto A1 exhausting it, 4 spilling to A2); the claim void
          releases every allocation in reverse (LIFO) order, returning each
          authorization's consumed_units to exactly its pre-verify value and
          flipping EXHAUSTED A1 back to ACTIVE.
        test_recipe:
          setup:
            - "Individual ENROLLED, ISP ACTIVE (plan year 2026); A1: DAY_PROG 24 units span 2026-01-01..2026-06-30 ACTIVE; A2: DAY_PROG 24 units span 2026-06-01..2026-12-31 ACTIVE; clock 2026-06-01"
            - "Three 120-minute visits on 2026-06-15 verified (8 units each -> A1 consumed 24, EXHAUSTED); one 60-minute visit on 2026-06-15 verified (4 units -> waterfall spills to A2, consumed 4)"
            - "Claim for 2026-06-15 swept all four visits (A1 line 24 units / 36000 cents, A2 line 4 units / 6000 cents, total 42000), submitted and paid in full"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Quinn Qidp", staff_role: "QIDP", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { q_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Dee Spone", staff_role: "DSP", certifications: ["MED_CERT", "CPR"], hire_date: "2025-02-01" }, as: AgencyAdmin, captures: { d1_id: $.data.id } }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind One", medicaid_id: "MCD-001", date_of_birth: "1990-01-01", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ind_id: $.data.id } }
            - { call: "POST /individuals/${ind_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}", captures: { ind_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /isps", payload: { individual_id: "${ind_id}", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", goals_summary: "Community integration goals", expected_individual_version: "${ind_v}" }, as: CaseManager, as_user_id: "${cm_id}", captures: { isp_id: $.data.id } }
            - { call: "POST /isps/${isp_id}/submit-review", payload: {}, as: CaseManager, as_user_id: "${cm_id}" }
            - { call: "POST /isps/${isp_id}/approve", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /isps/${isp_id}/activate", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /authorizations", payload: { individual_id: "${ind_id}", isp_id: "${isp_id}", service_code: "DAY_PROG", unit_type: "FIFTEEN_MIN", authorized_units: 24, rate_cents: 1500, span_start: "2026-01-01", span_end: "2026-06-30" }, as: CaseManager, as_user_id: "${cm_id}", captures: { a1_id: $.data.id } }
            - { call: "POST /authorizations/${a1_id}/approve", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /authorizations", payload: { individual_id: "${ind_id}", isp_id: "${isp_id}", service_code: "DAY_PROG", unit_type: "FIFTEEN_MIN", authorized_units: 24, rate_cents: 1500, span_start: "2026-06-01", span_end: "2026-12-31" }, as: CaseManager, as_user_id: "${cm_id}", captures: { a2_id: $.data.id } }
            - { call: "POST /authorizations/${a2_id}/approve", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /evv-visits", payload: { individual_id: "${ind_id}", authorization_id: "${a1_id}", service_date: "2026-06-15", check_in_at: "2026-06-15T06:00:00Z", check_out_at: "2026-06-15T08:00:00Z", geo_within_radius: true }, as: DSP, as_user_id: "${d1_id}", captures: { v1_id: $.data.id } }
            - { call: "POST /evv-visits", payload: { individual_id: "${ind_id}", authorization_id: "${a1_id}", service_date: "2026-06-15", check_in_at: "2026-06-15T09:00:00Z", check_out_at: "2026-06-15T11:00:00Z", geo_within_radius: true }, as: DSP, as_user_id: "${d1_id}", captures: { v2_id: $.data.id } }
            - { call: "POST /evv-visits", payload: { individual_id: "${ind_id}", authorization_id: "${a1_id}", service_date: "2026-06-15", check_in_at: "2026-06-15T12:00:00Z", check_out_at: "2026-06-15T14:00:00Z", geo_within_radius: true }, as: DSP, as_user_id: "${d1_id}", captures: { v3_id: $.data.id } }
            - { call: "POST /evv-visits", payload: { individual_id: "${ind_id}", authorization_id: "${a1_id}", service_date: "2026-06-15", check_in_at: "2026-06-15T15:00:00Z", check_out_at: "2026-06-15T16:00:00Z", geo_within_radius: true }, as: DSP, as_user_id: "${d1_id}", captures: { v4_id: $.data.id } }
            - { call: "POST /evv-visits/${v1_id}/verify", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /evv-visits/${v2_id}/verify", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /evv-visits/${v3_id}/verify", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /evv-visits/${v4_id}/verify", payload: {}, as: QIDP, as_user_id: "${q_id}", captures: { v4_alloc: $.data.allocated_units_entries } }
            - { call: "POST /claims", payload: { individual_id: "${ind_id}", service_period_start: "2026-06-15", service_period_end: "2026-06-15" }, as: BillingSpecialist, as_user_id: "bill-1", captures: { claim_id: $.data.id, tu: $.data.total_units, ta: $.data.total_amount_cents } }
            - { call: "POST /claims/${claim_id}/submit", payload: {}, as: BillingSpecialist, as_user_id: "bill-1" }
            - { call: "POST /claims/${claim_id}/post-payment", payload: { paid_amount_cents: 42000 }, as: BillingSpecialist, as_user_id: "bill-2" }
          trigger:
            - { call: "POST /claims/${claim_id}/void", payload: {}, as: BillingSpecialist, as_user_id: "bill-1" }
            - call: "GET /authorizations/${a1_id}"
              payload: {}
              as: Any
              captures: { a1_consumed: $.data.consumed_units, a1_st: $.data.status }
            - call: "GET /authorizations/${a2_id}"
              payload: {}
              as: Any
              captures: { a2_consumed: $.data.consumed_units, a2_st: $.data.status }
            - call: "GET /evv-visits"
              payload: { authorization_id: "${a1_id}", billing_status: "UNBILLED" }
              as: Any
          assert:
            - "before void: A1 was EXHAUSTED at consumed 24; v4's allocated_units_entries shows the spill to A2 (4 units)"
            - "claim totals were total_units == 28 and total_amount_cents == 42000 (A1 line 36000 + A2 line 6000)"
            - "after void: A1.consumed_units == 0 and status == ACTIVE (EXHAUSTED auto-recovered when the release dropped it below 24)"
            - "after void: A2.consumed_units == 0 and status == ACTIVE"
            - "all four visits returned to billing_status == UNBILLED — the unit pool (sum of consumed across both authorizations) is conserved at its pre-verify value"
