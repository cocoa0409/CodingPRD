            - "trigger[1]: HTTP 404, data.error_id == 'ERR_INSTITUTION_NOT_FOUND'"
            - "trigger[2]: HTTP 404, data.error_id == 'ERR_DEPOSITOR_NOT_FOUND'"
            - "trigger[3]: HTTP 404, data.error_id == 'ERR_INSTITUTION_NOT_FOUND' — the nested path parent is resolved before the body"
            - "trigger[4]: HTTP 404, data.error_id == 'ERR_BIDDER_NOT_FOUND'"
            - "trigger[5]: HTTP 404, data.error_id == 'ERR_DISTRIBUTION_NOT_FOUND'"
            - "trigger[6]: 0 rows, total_count == 0 — none of the six refused writes created anything"

      - name: determination_lifecycle_rejects_prepare_and_submit_review_out_of_order
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DETERMINATION_NOT_PREPARED]
          - errors[ERR_DETERMINATION_NOT_PREPARABLE]
          - validations[priority=43]
          - validations[priority=44]
        distinguishing_aspect: "The two lifecycle codes are mirror images across the same cycle: submit-review demands status == PREPARED (so DRAFT and UNDER_REVIEW both give ERR_DETERMINATION_NOT_PREPARED) while prepare demands status IN {DRAFT, REVISION_REQUESTED} (so PREPARED and UNDER_REVIEW both give ERR_DETERMINATION_NOT_PREPARABLE), and REVISION_REQUESTED re-opens prepare without re-opening submit-review."
