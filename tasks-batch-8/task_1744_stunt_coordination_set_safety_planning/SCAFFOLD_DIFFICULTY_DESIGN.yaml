              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq_id: $.data.id, seq_v: $.data.version }
            - call: "POST /api/risk-assessments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", severity_rating: 2, likelihood_rating: 2, expected_sequence_version: "${seq_v}" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { ra_id: $.data.id }
            - call: "POST /api/risk-assessments/${ra_id}/submit"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/risk-assessments/${ra_id}/approve"
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /api/stunt-sequences/${seq_id}/lock-design"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/performers"
              payload: { production_id: "${prod_id}", first_name: "Moe", last_name: "Thi", base_day_rate_cents: 150000, union_status: "NON_UNION" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { perf_id: $.data.id }
            - call: "POST /api/certifications"
              payload: { performer_id: "${perf_id}", discipline: "PYRO", level: "ADVANCED", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StuntCoordinator
