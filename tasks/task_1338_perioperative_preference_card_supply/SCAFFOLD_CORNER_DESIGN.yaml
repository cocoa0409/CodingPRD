            - { call: "POST /perioperative/pick-list-lines/${line_1}/substitute", payload: { substitute_supply_item_id: "${item_edge}" }, as: CartTechnician, captures: { ok_line: "$.data.status" } }
            - { call: "POST /perioperative/pick-list-lines/${line_2}/substitute", payload: { substitute_supply_item_id: "${item_prm}", override_price_threshold: true }, as: CartTechnician, captures: { ok_line2: "$.data.status" } }
          assert:
            - "${err} == ERR_SUBSTITUTE_PRICE_THRESHOLD (http 402) — 2600 > 1.25 x 2000 without override"
            - "exactly-1.25x substitute succeeds without override: ${ok_line} == SUBSTITUTED (2500 <= 2500, boundary inclusive)"
            - "override path succeeds: ${ok_line2} == SUBSTITUTED; TRAY-PRM on_hand 4"

      - name: complete_over_consignment_budget_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_CONSIGNMENT_BUDGET_EXCEEDED]"]
        distinguishing_aspect: "Fiscal guard on completion: consignment charges of 10000c against a 9000c case budget fail with ERR_CONSIGNMENT_BUDGET_EXCEEDED; the rejection is atomic (no usage records, no charges)."
        test_recipe:
          setup: ["consignment case (2x ROD-TI, budget 9000) picked, dispatched, returned"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Budget", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "ROD-TI", name: "Titanium rod", unit_cost_cents: 5000, substitute_group: "ROD", consignment_flag: true, initial_on_hand: 10 }, as: SupplyChainAnalyst, captures: { item_d: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "SPINE" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_d}", quantity: 2, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_id}", scheduled_start: "2026-09-05T08:00:00Z", expected_duration_min: 120, room: "OR-6", consignment_budget_cents: 9000 }, as: SupplyChainAnalyst, captures: { case_id: "$.data.id" } }
            - { call: "POST /perioperative/cases/${case_id}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { pl_id: "$.data.id" } }
            - { call: "GET /perioperative/pick-list-lines?pick_list_id=${pl_id}", as: Any, captures: { line_d: "$.data[0].id" } }
            - { call: "POST /perioperative/pick-lists/${pl_id}/begin-picking", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-list-lines/${line_d}/pick", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-lists/${pl_id}/dispatch", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-lists/${pl_id}/return", payload: { return_entries: [] }, as: CartTechnician }
          trigger:
            - { call: "POST /perioperative/cases/${case_id}/complete", payload: { usage_entries: [ { pick_list_line_id: "${line_d}", qty_used: 2 } ] }, as: CirculatingNurse, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_CONSIGNMENT_BUDGET_EXCEEDED (http 402) — 10000 > 9000"
            - "atomicity: case remains IN_PROGRESS; GET /usage-records?case_id=... returns total_count 0; GET /consignment-charges?case_id=... returns total_count 0"

      - name: endorse_twice_same_officer_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_ENDORSEMENT]", state_machines.ProductRequest.UNDER_REVIEW_to_UNDER_REVIEW]
        distinguishing_aspect: "One endorsement per officer: the second endorse by officer-1 fails ERR_DUPLICATE_ENDORSEMENT and endorsements_count stays 1."
        test_recipe:
          setup: ["product request UNDER_REVIEW (opened by officer-1)"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Endo", specialty: "CARD" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/product-requests", payload: { proposed_item_name: "Valve introducer", proposed_sku: "VALVE-INTRO-1", estimated_unit_cost_cents: 4000, rationale: "better implant tray system" }, as: Surgeon, as_user_id: "${s_id}", captures: { req_id: "$.data.id" } }
            - { call: "POST /perioperative/product-requests/${req_id}/open-review", payload: {}, as: ValueAnalysisOfficer, as_user_id: "officer-1" }
            - { call: "POST /perioperative/product-requests/${req_id}/endorse", payload: {}, as: ValueAnalysisOfficer, as_user_id: "officer-1" }
          trigger:
            - { call: "POST /perioperative/product-requests/${req_id}/endorse", payload: {}, as: ValueAnalysisOfficer, as_user_id: "officer-1", captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_DUPLICATE_ENDORSEMENT; ProductRequest.${req_id}.endorsements_count == 1"

      - name: approve_below_quorum_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_QUORUM_NOT_MET]", state_machines.ProductRequest.UNDER_REVIEW_to_APPROVED]
        distinguishing_aspect: "With only one endorsement (quorum is 2), approval by a non-reviewer officer still fails ERR_QUORUM_NOT_MET."
        test_recipe:
          setup: ["request UNDER_REVIEW by officer-1; one endorsement (officer-1)"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Quo", specialty: "CARD" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/product-requests", payload: { proposed_item_name: "Valve introducer", proposed_sku: "VALVE-INTRO-1", estimated_unit_cost_cents: 4000, rationale: "better implant tray system" }, as: Surgeon, as_user_id: "${s_id}", captures: { req_id: "$.data.id" } }
            - { call: "POST /perioperative/product-requests/${req_id}/open-review", payload: {}, as: ValueAnalysisOfficer, as_user_id: "officer-1" }
            - { call: "POST /perioperative/product-requests/${req_id}/endorse", payload: {}, as: ValueAnalysisOfficer, as_user_id: "officer-1" }
          trigger:
            - { call: "POST /perioperative/product-requests/${req_id}/approve", payload: {}, as: ValueAnalysisOfficer, as_user_id: "officer-2", captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_QUORUM_NOT_MET; request remains UNDER_REVIEW"

      - name: reviewer_cannot_approve_own_review
        claim_type: violation_to_error
        grounds: ["errors[ERR_SOD_REVIEWER_CANNOT_APPROVE]", roles.ValueAnalysisOfficer]
        distinguishing_aspect: "Segregation of duties: with quorum met, the reviewing officer (officer-1) approving their own review fails ERR_SOD_REVIEWER_CANNOT_APPROVE (403)."
        test_recipe:
          setup: ["request UNDER_REVIEW by officer-1; endorsements by officer-1 and officer-2 (quorum met)"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Sod", specialty: "CARD" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/product-requests", payload: { proposed_item_name: "Valve introducer", proposed_sku: "VALVE-INTRO-1", estimated_unit_cost_cents: 4000, rationale: "better implant tray system" }, as: Surgeon, as_user_id: "${s_id}", captures: { req_id: "$.data.id" } }
            - { call: "POST /perioperative/product-requests/${req_id}/open-review", payload: {}, as: ValueAnalysisOfficer, as_user_id: "officer-1" }
            - { call: "POST /perioperative/product-requests/${req_id}/endorse", payload: {}, as: ValueAnalysisOfficer, as_user_id: "officer-1" }
            - { call: "POST /perioperative/product-requests/${req_id}/endorse", payload: {}, as: ValueAnalysisOfficer, as_user_id: "officer-2" }
          trigger:
            - { call: "POST /perioperative/product-requests/${req_id}/approve", payload: {}, as: ValueAnalysisOfficer, as_user_id: "officer-1", captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_SOD_REVIEWER_CANNOT_APPROVE (http 403); request remains UNDER_REVIEW"

      - name: line_add_with_discontinued_item_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_ITEM_NOT_ACTIVE]", "validations[priority=8]"]
        distinguishing_aspect: "After a product request's approval discontinues the replaced item, adding that item to a DRAFT card fails ERR_ITEM_NOT_ACTIVE."
        test_recipe:
          setup:
            - "surgeon S; item SUTURE-KIT ACTIVE; product request with replaces_item_id = SUTURE-KIT approved (SUTURE-KIT now DISCONTINUED); a separate DRAFT card exists"
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Disc", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "SUTURE-KIT", name: "Suture kit", unit_cost_cents: 1000, substitute_group: "SUTURE", initial_on_hand: 50 }, as: SupplyChainAnalyst, captures: { item_b: "$.data.id" } }
            - { call: "POST /perioperative/product-requests", payload: { proposed_item_name: "Barbed suture kit", proposed_sku: "SUTURE-BARB", estimated_unit_cost_cents: 1200, rationale: "knotless closure saves time", replaces_item_id: "${item_b}", substitute_group: "SUTURE" }, as: Surgeon, as_user_id: "${s_id}", captures: { req_id: "$.data.id" } }
            - { call: "POST /perioperative/product-requests/${req_id}/open-review", payload: {}, as: ValueAnalysisOfficer, as_user_id: "officer-1" }
            - { call: "POST /perioperative/product-requests/${req_id}/endorse", payload: {}, as: ValueAnalysisOfficer, as_user_id: "officer-1" }
            - { call: "POST /perioperative/product-requests/${req_id}/endorse", payload: {}, as: ValueAnalysisOfficer, as_user_id: "officer-2" }
            - { call: "POST /perioperative/product-requests/${req_id}/approve", payload: {}, as: ValueAnalysisOfficer, as_user_id: "officer-2" }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
          trigger:
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_b}", quantity: 1, designation: "OPEN" }, as: SupplyChainAnalyst, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_ITEM_NOT_ACTIVE (http 409)"
            - "SupplyItem.${item_b}.status == DISCONTINUED (approval cascade already applied)"

  # ============================================================ endpoints
  - section: endpoints
    instances:
      - name: preference_cards_list_paginates_with_limit_offset
        claim_type: listing
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "Pagination fields interact with filters: limit=2 over 3 matching cards returns total_count 3, has_more true, 2 rows; offset=2 returns the final row with has_more false."
        test_recipe:
          setup: ["surgeon S with three DRAFT cards (procedures P1, P2, P3)"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Page", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "P1" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "P2" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "P3" }, as: SupplyChainAnalyst }
          trigger:
            - { call: "GET /perioperative/preference-cards?surgeon_id=${s_id}&limit=2", as: Any }
            - { call: "GET /perioperative/preference-cards?surgeon_id=${s_id}&limit=2&offset=2", as: Any }
          assert:
            - "page 1: data has exactly 2 rows, total_count == 3, has_more == true, ordered by created_at ASC"
            - "page 2: data has exactly 1 row, total_count == 3, has_more == false"

      - name: pick_list_lines_filtered_list_returns_own_lines_only
        claim_type: standard_crud
        grounds: [entities.PickListLine.fields.pick_list_id]
        distinguishing_aspect: "The pick_list_id filter (FK reverse-reachability) isolates a list's lines: two cases released from the same card, each filtered query returns exactly its own 1 line with matching pick_list_id."
        test_recipe:
          setup: ["1-line published card; two cases each with a released pick list"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Filt", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_a}", quantity: 1, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_id}", scheduled_start: "2026-09-05T08:00:00Z", expected_duration_min: 60, room: "OR-1" }, as: SupplyChainAnalyst, captures: { case_1: "$.data.id" } }
            - { call: "POST /perioperative/cases/${case_1}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { pl_1: "$.data.id" } }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_id}", scheduled_start: "2026-09-05T10:30:00Z", expected_duration_min: 60, room: "OR-2" }, as: SupplyChainAnalyst, captures: { case_2: "$.data.id" } }
            - { call: "POST /perioperative/cases/${case_2}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { pl_2: "$.data.id" } }
          trigger:
            - { call: "GET /perioperative/pick-list-lines?pick_list_id=${pl_1}", as: Any }
          assert:
            - "result: total_count == 1 and the single row's pick_list_id == ${pl_1} (no leakage from ${pl_2})"

      - name: release_creates_snapshot_lines_with_frozen_costs
        claim_type: action_endpoint
        grounds: [state_machines.SurgicalCase.SCHEDULED_to_PICKING_RELEASED, entities.PickListLine.fields.unit_cost_cents]
        distinguishing_aspect: "Release snapshots designation, qty_requested, and unit_cost_cents from the pinned card; a later stock-item price change does NOT alter the released line (frozen snapshot)."
        test_recipe:
          setup: ["1-line card (2x GLOVE-PR at 250c) published; case released"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Snap", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_a}", quantity: 2, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_id}", scheduled_start: "2026-09-05T08:00:00Z", expected_duration_min: 60, room: "OR-1" }, as: SupplyChainAnalyst, captures: { case_id: "$.data.id" } }
            - { call: "POST /perioperative/cases/${case_id}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { pl_id: "$.data.id", pl_card_vn: "$.data.card_version_number" } }
          trigger:
            - { call: "GET /perioperative/pick-list-lines?pick_list_id=${pl_id}", as: Any, captures: { ln_cost: "$.data[0].unit_cost_cents", ln_qty: "$.data[0].qty_requested", ln_des: "$.data[0].designation", ln_status: "$.data[0].status" } }
            - { call: "GET /perioperative/cases/${case_id}", as: Any, captures: { case_std: "$.data.standard_cost_cents", case_status: "$.data.status" } }
          assert:
            - "snapshot line: qty_requested == 2, designation == OPEN, unit_cost_cents == 250, status PENDING (${ln_qty}, ${ln_des}, ${ln_cost}, ${ln_status})"
            - "PickList.card_version_number == 1 (${pl_card_vn})"
            - "SurgicalCase.${case_id}.standard_cost_cents == 500 (${case_std}) and status == PICKING_RELEASED (${case_status})"

  # ============================================================ errors
  - section: errors
    instances:
      - name: request_missing_auth_headers_returns_error_envelope
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Priority 1: a call with no X-User-Role/X-User-ID fails authentication before role, existence, or state checks — even for a nonexistent resource id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /perioperative/surgeons/11111111-1111-1111-1111-111111111111", captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (http 400) — NOT ERR_NOT_FOUND (priority 1 beats priority 4)"
            - "envelope: response_type == error; data.message present"

      - name: capture_captured_charge_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_CHARGE_INVALID_STATE]", state_machines.ConsignmentCharge.PENDING_to_CAPTURED]
        distinguishing_aspect: "capture requires PENDING; capturing an already CAPTURED charge fails ERR_CHARGE_INVALID_STATE (no double-billing)."
        test_recipe:
          setup: ["completed consignment case with one charge; charge already captured once"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Cap", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "ROD-TI", name: "Titanium rod", unit_cost_cents: 5000, substitute_group: "ROD", consignment_flag: true, initial_on_hand: 10 }, as: SupplyChainAnalyst, captures: { item_d: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "SPINE" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_d}", quantity: 1, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_id}", scheduled_start: "2026-09-05T08:00:00Z", expected_duration_min: 120, room: "OR-6" }, as: SupplyChainAnalyst, captures: { case_id: "$.data.id" } }
            - { call: "POST /perioperative/cases/${case_id}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { pl_id: "$.data.id" } }
            - { call: "GET /perioperative/pick-list-lines?pick_list_id=${pl_id}", as: Any, captures: { line_d: "$.data[0].id" } }
            - { call: "POST /perioperative/pick-lists/${pl_id}/begin-picking", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-list-lines/${line_d}/pick", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-lists/${pl_id}/dispatch", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-lists/${pl_id}/return", payload: { return_entries: [] }, as: CartTechnician }
            - { call: "POST /perioperative/cases/${case_id}/complete", payload: { usage_entries: [ { pick_list_line_id: "${line_d}", qty_used: 1 } ] }, as: CirculatingNurse }
            - { call: "GET /perioperative/consignment-charges?case_id=${case_id}", as: Any, captures: { chg_id: "$.data[0].id" } }
            - { call: "POST /perioperative/consignment-charges/${chg_id}/capture", payload: {}, as: MaterialsManager }
          trigger:
            - { call: "POST /perioperative/consignment-charges/${chg_id}/capture", payload: {}, as: MaterialsManager, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_CHARGE_INVALID_STATE; charge remains CAPTURED (single billing event preserved)"

      - name: verify_verified_count_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_COUNT_NOT_RECORDED]", state_machines.ConsignmentCount.RECORDED_to_VERIFIED]
        distinguishing_aspect: "verify requires RECORDED; verifying an already VERIFIED count fails ERR_COUNT_NOT_RECORDED (no double stock adjustment)."
        test_recipe:
          setup: ["consignment item on_hand 8; count 7 recorded and verified (on_hand now 7)"]
          setup_api_calls:
            - { call: "POST /perioperative/supply-items", payload: { sku: "ROD-TI", name: "Titanium rod", unit_cost_cents: 5000, substitute_group: "ROD", consignment_flag: true, initial_on_hand: 8 }, as: SupplyChainAnalyst, captures: { item_d: "$.data.id" } }
            - { call: "POST /perioperative/consignment-counts", payload: { supply_item_id: "${item_d}", counted_qty: 7 }, as: MaterialsManager, captures: { cnt_id: "$.data.id" } }
            - { call: "POST /perioperative/consignment-counts/${cnt_id}/verify", payload: {}, as: MaterialsManager }
          trigger:
            - { call: "POST /perioperative/consignment-counts/${cnt_id}/verify", payload: {}, as: MaterialsManager, captures: { err: "$.data.error_id" } }
            - { call: "GET /perioperative/supply-items/${item_d}", as: Any, captures: { on_hand: "$.data.on_hand_quantity" } }
          assert:
            - "${err} == ERR_COUNT_NOT_RECORDED; on_hand stays 7 (${on_hand}) — the variance was not applied twice"

      - name: endorse_submitted_request_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_REQUEST_NOT_UNDER_REVIEW]", state_machines.ProductRequest.SUBMITTED_to_UNDER_REVIEW]
        distinguishing_aspect: "Endorsement requires UNDER_REVIEW; endorsing a SUBMITTED request fails ERR_REQUEST_NOT_UNDER_REVIEW."
        test_recipe:
          setup: ["product request SUBMITTED, review not opened"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Sub", specialty: "CARD" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/product-requests", payload: { proposed_item_name: "Valve introducer", proposed_sku: "VALVE-INTRO-1", estimated_unit_cost_cents: 4000, rationale: "better implant tray system" }, as: Surgeon, as_user_id: "${s_id}", captures: { req_id: "$.data.id" } }
          trigger:
            - { call: "POST /perioperative/product-requests/${req_id}/endorse", payload: {}, as: ValueAnalysisOfficer, as_user_id: "officer-1", captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_REQUEST_NOT_UNDER_REVIEW; endorsements_count stays 0"

      - name: reject_terminal_request_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_REQUEST_NOT_UNDER_REVIEW]", state_machines.ProductRequest.UNDER_REVIEW_to_REJECTED]
        distinguishing_aspect: "REJECTED is terminal: rejecting an already-rejected request fails ERR_REQUEST_NOT_UNDER_REVIEW."
        test_recipe:
          setup: ["request UNDER_REVIEW then rejected once"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Rej", specialty: "CARD" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/product-requests", payload: { proposed_item_name: "Valve introducer", proposed_sku: "VALVE-INTRO-1", estimated_unit_cost_cents: 4000, rationale: "better implant tray system" }, as: Surgeon, as_user_id: "${s_id}", captures: { req_id: "$.data.id" } }
            - { call: "POST /perioperative/product-requests/${req_id}/open-review", payload: {}, as: ValueAnalysisOfficer, as_user_id: "officer-1" }
            - { call: "POST /perioperative/product-requests/${req_id}/reject", payload: { rejection_reason: "no clinical evidence" }, as: ValueAnalysisOfficer, as_user_id: "officer-2" }
          trigger:
            - { call: "POST /perioperative/product-requests/${req_id}/reject", payload: { rejection_reason: "again" }, as: ValueAnalysisOfficer, as_user_id: "officer-2", captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_REQUEST_NOT_UNDER_REVIEW; rejection_reason remains 'no clinical evidence'"

  # ============================================================ rbac
  - section: rbac
    instances:
      - name: surgeon_cannot_publish_card
        claim_type: violation_to_error
        grounds: [roles.SupplyChainAnalyst.exclusive_operations, "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "Role gate fires before state/existence: Surgeon calling publish — even on a valid DRAFT card — gets ERR_FORBIDDEN_FOR_ROLE (403)."
        test_recipe:
          setup: ["surgeon S with a DRAFT card (1 line)"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Rbac", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_a}", quantity: 1, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v: "$.data.version" } }
          trigger:
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v}" }, as: Surgeon, as_user_id: "${s_id}", captures: { err: "$.data.error_id" } }
          assert:
