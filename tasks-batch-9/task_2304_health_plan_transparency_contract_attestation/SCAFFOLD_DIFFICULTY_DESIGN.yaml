              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
              captures: { c_tpa: "$.data.id" }
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
            - call: "POST /compliance/contracts/${c_tpa}/gag-review"
              payload: { clause_inventory_count: 40, prohibited_clause_count: 0 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /compliance/contracts/${c_tpa}/clear-gag"
              payload: { clearance_note: "Clean." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
