scaffold_corner_design:

  # =========================================================================
  # Entities — creation, retrieval, listing, not-found, required fields, defaults,
  # computed/system fields, type constraints, FK integrity
  # =========================================================================
  - section: entities
    instances:
      - name: create_station_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Station, endpoints]
        distinguishing_aspect: "POST /stations with name+brand returns 201; tax_rate_bp defaults 825, cash_variance_tolerance_cents defaults 200, version==1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /stations"
              payload: { name: "Main St Fuel", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id, trate: $.data.tax_rate_bp, tol: $.data.cash_variance_tolerance_cents, v: $.data.version }
          assert:
            - "HTTP status == 201"
            - "Station.${st}.tax_rate_bp == 825"
            - "Station.${st}.cash_variance_tolerance_cents == 200"
            - "Station.${st}.version == 1"

      - name: get_station_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Station, endpoints]
        distinguishing_aspect: "GET /stations/{id} returns the station previously created with matching name and brand."
        test_recipe:
          setup: ["One station exists."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "Main St Fuel", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
          trigger:
            - call: "GET /stations/${st}"
              payload: {}
              as: StationManager
              captures: { nm: $.data.name }
          assert:
            - "HTTP status == 200"
            - "Station.${st}.name == Main St Fuel"

      - name: list_fuel_grades_paginated_envelope
        claim_type: Listing
        grounds: [entities.FuelGrade, endpoints]
        distinguishing_aspect: "GET /fuel-grades?station_id= returns array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["Station with one fuel grade."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /fuel-grades"
              payload: { station_id: "${st}", code: "REGULAR", octane: 87 }
              as: StationManager
          trigger:
            - call: "GET /fuel-grades"
              payload: { station_id: "${st}" }
              as: StationManager
          assert:
            - "HTTP status == 200"
            - "response_type == array; meta.total_count == 1; has_more == false"

      - name: get_tank_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Tank, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /tanks/{random-uuid} returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /tanks/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: StationManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_pump_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Pump, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /pumps missing required number field returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["Station with a tank."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /fuel-grades"
              payload: { station_id: "${st}", code: "REGULAR", octane: 87 }
              as: StationManager
              captures: { gr: $.data.id }
            - call: "POST /tanks"
              payload: { station_id: "${st}", fuel_grade_id: "${gr}", label: "T1", capacity_gallons: 10000, reorder_point_gallons: 1500 }
              as: StationManager
              captures: { tk: $.data.id }
          trigger:
            - call: "POST /pumps"
              payload: { station_id: "${st}", tank_id: "${tk}" }
              as: StationManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: delivery_invoice_total_is_computed
        claim_type: Computed Fields
        grounds: [entities.Delivery.fields.invoice_total_cents]
        distinguishing_aspect: "POST /deliveries computes invoice_total_cents = round(net_gallons*unit_cost_cents); client cannot set it. 5000*280=1400000."
        test_recipe:
          setup: ["Station with a tank."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /fuel-grades"
              payload: { station_id: "${st}", code: "REGULAR", octane: 87 }
              as: StationManager
              captures: { gr: $.data.id }
            - call: "POST /tanks"
              payload: { station_id: "${st}", fuel_grade_id: "${gr}", label: "T1", capacity_gallons: 10000, reorder_point_gallons: 1500 }
              as: StationManager
              captures: { tk: $.data.id }
          trigger:
            - call: "POST /deliveries"
              payload: { station_id: "${st}", tank_id: "${tk}", vendor_name: "DSD", net_gallons: 5000, unit_cost_cents: 280 }
              as: StationManager
              captures: { inv: $.data.invoice_total_cents }
          assert:
            - "Delivery.invoice_total_cents == 1400000"

      - name: create_fuel_grade_invalid_enum_code_rejected
        claim_type: Type Constraints
        grounds: [entities.FuelGrade.fields.code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /fuel-grades with code not in {REGULAR,MIDGRADE,PREMIUM,DIESEL} returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["One station."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
          trigger:
            - call: "POST /fuel-grades"
              payload: { station_id: "${st}", code: "SUPER_ULTRA", octane: 100 }
              as: StationManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: reprice_records_prior_price_computed_field
        claim_type: Computed Fields
        grounds: [entities.FuelGrade.fields.current_price_cents, entities.FuelGrade.fields.prior_price_cents]
        distinguishing_aspect: "First reprice of a grade (starting current 0) sets current_price_cents=399 and prior_price_cents=0 (the price before the change)."
        test_recipe:
          setup: ["Station with a grade at default current_price_cents 0."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /fuel-grades"
              payload: { station_id: "${st}", code: "REGULAR", octane: 87 }
              as: StationManager
              captures: { gr: $.data.id }
          trigger:
            - call: "POST /fuel-grades/${gr}/reprice"
              payload: { new_price_cents: 399 }
              as: StationManager
              captures: { cur: $.data.current_price_cents, prior: $.data.prior_price_cents }
          assert:
            - "FuelGrade.${gr}.prior_price_cents == 0 (grade started at 0)"
            - "FuelGrade.${gr}.current_price_cents == 399 after the change"

      - name: create_tank_wrong_parent_grade_not_found
        claim_type: Parent Relationships
        grounds: [entities.Tank.fields.fuel_grade_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /tanks with a fuel_grade_id that does not exist returns ERR_NOT_FOUND 404 (FK existence)."
        test_recipe:
          setup: ["One station, no grade."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
          trigger:
            - call: "POST /tanks"
              payload: { station_id: "${st}", fuel_grade_id: "00000000-0000-0000-0000-000000000000", label: "T1", capacity_gallons: 10000, reorder_point_gallons: 1500 }
              as: StationManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: fk_reverse_tanks_filtered_by_grade
        claim_type: Flat with references
        grounds: [entities.Tank.fields.fuel_grade_id, endpoints]
        distinguishing_aspect: "GET /tanks?fuel_grade_id= returns the tanks for that grade (FK reverse-reachability filtered-list form)."
        test_recipe:
          setup: ["Station with a grade and two tanks of that grade."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /fuel-grades"
              payload: { station_id: "${st}", code: "REGULAR", octane: 87 }
              as: StationManager
              captures: { gr: $.data.id }
            - call: "POST /tanks"
              payload: { station_id: "${st}", fuel_grade_id: "${gr}", label: "T1", capacity_gallons: 10000, reorder_point_gallons: 1500 }
              as: StationManager
            - call: "POST /tanks"
              payload: { station_id: "${st}", fuel_grade_id: "${gr}", label: "T2", capacity_gallons: 8000, reorder_point_gallons: 1000 }
              as: StationManager
          trigger:
            - call: "GET /tanks"
              payload: { fuel_grade_id: "${gr}" }
              as: StationManager
          assert:
            - "response_type == array; meta.total_count == 2"

  # =========================================================================
  # State Machines — valid transitions, invalid-from rejection, terminal lockdown,
  # idempotency, initial state
  # =========================================================================
  - section: state_machines
    instances:
      - name: capture_fuel_transaction_valid_authorized_to_captured
        claim_type: Valid Transition
        grounds: [state_machines.FuelTransaction.AUTHORIZED_to_CAPTURED, entities.Pump.fields.status]
        distinguishing_aspect: "POST /fuel-transactions/{id}/capture moves payment_status AUTHORIZED->CAPTURED and pump back to IDLE."
        test_recipe:
          setup: ["An AUTHORIZED fuel transaction on a DISPENSING pump."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /fuel-grades"
              payload: { station_id: "${st}", code: "REGULAR", octane: 87 }
              as: StationManager
              captures: { gr: $.data.id }
            - call: "POST /fuel-grades/${gr}/reprice"
              payload: { new_price_cents: 419 }
              as: StationManager
            - call: "POST /tanks"
              payload: { station_id: "${st}", fuel_grade_id: "${gr}", label: "T1", capacity_gallons: 10000, reorder_point_gallons: 1500 }
              as: StationManager
              captures: { tk: $.data.id, tk_v0: $.data.version }
            - call: "POST /pumps"
              payload: { station_id: "${st}", tank_id: "${tk}", number: 1 }
              as: StationManager
              captures: { pm: $.data.id }
            - call: "POST /deliveries"
              payload: { station_id: "${st}", tank_id: "${tk}", vendor_name: "DSD", net_gallons: 5000, unit_cost_cents: 280 }
              as: StationManager
              captures: { d1: $.data.id }
            - call: "POST /deliveries/${d1}/post"
              payload: { expected_tank_version: "${tk_v0}" }
              as: StationManager
            - call: "POST /shifts"
              payload: { station_id: "${st}", opening_float_cents: 20000 }
              as: CashierAttendant
              as_user_id: "cash1"
              captures: { sh: $.data.id }
            - call: "POST /fuel-transactions"
              payload: { station_id: "${st}", pump_id: "${pm}", shift_id: "${sh}", gallons: 12, tender: "CARD" }
              as: CashierAttendant
              captures: { tx: $.data.id }
          trigger:
            - call: "POST /fuel-transactions/${tx}/capture"
              payload: {}
              as: CashierAttendant
              captures: { ps: $.data.payment_status }
          assert:
            - "FuelTransaction.${tx}.payment_status == CAPTURED"
            - "Pump.${pm}.status == IDLE"

      - name: redeem_carwash_from_redeemed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.CarWashCode.ISSUED_to_REDEEMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second redeem on an already-REDEEMED code returns ERR_INVALID_STATE 409; no side effects."
        test_recipe:
          setup: ["A purchased BASIC car-wash code already REDEEMED."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /_clock/set"
              payload: { station_id: "${st}", to_iso8601: "2026-06-01T00:00:00Z" }
              as: StationManager
            - call: "POST /car-wash-codes"
              payload: { station_id: "${st}", package: "BASIC" }
              as: CashierAttendant
              captures: { cw: $.data.id }
            - call: "POST /car-wash-codes/${cw}/redeem"
              payload: {}
              as: CashierAttendant
          trigger:
            - call: "POST /car-wash-codes/${cw}/redeem"
              payload: {}
              as: CashierAttendant
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: reject_then_post_rejected_delivery_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Delivery.DRAFT_to_REJECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REJECTED is terminal: posting a REJECTED delivery returns ERR_INVALID_STATE 409 and wet stock is untouched."
        test_recipe:
          setup: ["A DRAFT delivery rejected to REJECTED."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /fuel-grades"
              payload: { station_id: "${st}", code: "REGULAR", octane: 87 }
              as: StationManager
              captures: { gr: $.data.id }
            - call: "POST /tanks"
              payload: { station_id: "${st}", fuel_grade_id: "${gr}", label: "T1", capacity_gallons: 10000, reorder_point_gallons: 1500 }
              as: StationManager
              captures: { tk: $.data.id, tk_v0: $.data.version }
            - call: "POST /deliveries"
              payload: { station_id: "${st}", tank_id: "${tk}", vendor_name: "DSD", net_gallons: 5000, unit_cost_cents: 280 }
              as: StationManager
              captures: { d1: $.data.id }
            - call: "POST /deliveries/${d1}/reject"
              payload: {}
              as: StationManager
          trigger:
            - call: "POST /deliveries/${d1}/post"
              payload: { expected_tank_version: "${tk_v0}" }
              as: StationManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "Tank.${tk}.volume_gallons == 0 (unchanged)"

      - name: begin_count_twice_idempotency_rejected
        claim_type: Idempotency
        grounds: [state_machines.Shift.OPEN_to_COUNTING, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second begin-count on a shift already COUNTING returns ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["An OPEN shift moved to COUNTING."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /shifts"
              payload: { station_id: "${st}", opening_float_cents: 20000 }
              as: CashierAttendant
              as_user_id: "cash1"
              captures: { sh: $.data.id }
            - call: "POST /shifts/${sh}/begin-count"
              payload: {}
              as: CashierAttendant
              as_user_id: "cash1"
          trigger:
            - call: "POST /shifts/${sh}/begin-count"
              payload: {}
              as: CashierAttendant
              as_user_id: "cash1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: new_fuel_transaction_initial_states
        claim_type: Initial State
        grounds: [entities.FuelTransaction.fields.payment_status, entities.FuelTransaction.fields.settlement_status]
        distinguishing_aspect: "A freshly authorized fuel transaction starts payment_status=AUTHORIZED and settlement_status=UNSETTLED (both axes at initial)."
        test_recipe:
          setup: ["A station with grade priced, tank with stock, pump, OPEN shift."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /fuel-grades"
              payload: { station_id: "${st}", code: "REGULAR", octane: 87 }
              as: StationManager
              captures: { gr: $.data.id }
            - call: "POST /fuel-grades/${gr}/reprice"
              payload: { new_price_cents: 419 }
              as: StationManager
            - call: "POST /tanks"
              payload: { station_id: "${st}", fuel_grade_id: "${gr}", label: "T1", capacity_gallons: 10000, reorder_point_gallons: 1500 }
              as: StationManager
              captures: { tk: $.data.id, tk_v0: $.data.version }
            - call: "POST /pumps"
              payload: { station_id: "${st}", tank_id: "${tk}", number: 1 }
              as: StationManager
              captures: { pm: $.data.id }
            - call: "POST /deliveries"
              payload: { station_id: "${st}", tank_id: "${tk}", vendor_name: "DSD", net_gallons: 5000, unit_cost_cents: 280 }
              as: StationManager
              captures: { d1: $.data.id }
            - call: "POST /deliveries/${d1}/post"
              payload: { expected_tank_version: "${tk_v0}" }
              as: StationManager
            - call: "POST /shifts"
              payload: { station_id: "${st}", opening_float_cents: 20000 }
              as: CashierAttendant
              as_user_id: "cash1"
              captures: { sh: $.data.id }
          trigger:
            - call: "POST /fuel-transactions"
              payload: { station_id: "${st}", pump_id: "${pm}", shift_id: "${sh}", gallons: 12, tender: "CARD" }
              as: CashierAttendant
              captures: { ps: $.data.payment_status, ss: $.data.settlement_status }
          assert:
            - "FuelTransaction.payment_status == AUTHORIZED"
            - "FuelTransaction.settlement_status == UNSETTLED"
            - "Pump.${pm}.status == DISPENSING"

      - name: reissue_redeem_carwash_cycle_revives_expired
        claim_type: cyclic
        grounds: [state_machines.CarWashCode.EXPIRED_to_ISSUED, state_machines.CarWashCode.ISSUED_to_EXPIRED]
        distinguishing_aspect: "A code expired (redeem past TTL flips it EXPIRED), then reissued returns to ISSUED with a fresh expires_at — ISSUED reachable again (cycle)."
        test_recipe:
          setup: ["A BASIC code issued at 2026-06-01 (TTL 30d -> expires 2026-07-01); clock advanced to 2026-08-01."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /_clock/set"
              payload: { station_id: "${st}", to_iso8601: "2026-06-01T00:00:00Z" }
              as: StationManager
            - call: "POST /car-wash-codes"
              payload: { station_id: "${st}", package: "BASIC" }
              as: CashierAttendant
              captures: { cw: $.data.id }
            - call: "POST /_clock/set"
              payload: { station_id: "${st}", to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationManager
            - call: "POST /car-wash-codes/${cw}/redeem"
              payload: {}
              as: CashierAttendant
              captures: { err: $.data.error_id }
          trigger:
            - call: "POST /car-wash-codes/${cw}/reissue"
              payload: {}
              as: StationManager
              captures: { stt: $.data.status }
          assert:
            - "Redeem past TTL returned ERR_CODE_EXPIRED and flipped status to EXPIRED"
            - "After reissue: CarWashCode.${cw}.status == ISSUED (cycle: ISSUED reachable again)"

      - name: tank_cycle_active_down_active_covered_by_difficulty
        claim_type: cyclic
        grounds: [state_machines.Tank.ACTIVE_to_DOWN, state_machines.Tank.DOWN_to_ACTIVE]
        excluded_because:
          difficulty_instance: non_linear_state_machine / tank_cycle_active_down_active
          rationale: "Tank ACTIVE<->DOWN cycle and pump cascade are fully asserted by the named §1.8 instance."

      - name: shift_parallel_axes_covered_by_difficulty
        claim_type: parallel
        grounds: [state_machines.Shift.OPEN_to_COUNTING, state_machines.Shift.COUNTING_to_CLOSED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / shift_parallel_lifecycle_reconcile_axes
          rationale: "Shift's two independent axes are asserted by the named §1.8 instance."

  # =========================================================================
  # Calculations — correct result, input-set filtering, precision, variant selection
  # =========================================================================
  - section: calculations
    instances:
      - name: store_total_mixed_taxable_sum_then_round
        claim_type: Correct Result
        grounds: [calculations.store_transaction_total, entities.StoreTransaction.fields.tax_cents]
        distinguishing_aspect: "Subtotal 1550 (taxable 1000 + non-taxable 550), tax = round(1000*825/10000)=83, total 1633 — taxable-only base, sum-then-round."
        test_recipe:
          setup: ["OPEN shift; a store sale with one taxable line (500*2=1000) and one non-taxable line (275*2=550)."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /shifts"
              payload: { station_id: "${st}", opening_float_cents: 20000 }
              as: CashierAttendant
              as_user_id: "cash1"
              captures: { sh: $.data.id }
          trigger:
            - call: "POST /store-transactions"
              payload: { station_id: "${st}", shift_id: "${sh}", tender: "CARD", line_items: [ { sku: "A", name: "Taxable", category: "GROCERY", unit_price_cents: 500, qty: 2, taxable: true }, { sku: "B", name: "Exempt", category: "GROCERY", unit_price_cents: 275, qty: 2, taxable: false } ] }
              as: CashierAttendant
              captures: { sub: $.data.subtotal_cents, tax: $.data.tax_cents, tot: $.data.total_cents }
          assert:
            - "StoreTransaction.subtotal_cents == 1550"
            - "StoreTransaction.tax_cents == 83"
            - "StoreTransaction.total_cents == 1633"

      - name: car_wash_price_deluxe_gold_discount
        claim_type: Correct Result
        grounds: [calculations.car_wash_price, entities.CarWashCode.fields.price_cents]
        distinguishing_aspect: "Purchased DELUXE code for a GOLD member: round(1200*(1-0.20))=960."
        test_recipe:
          setup: ["Station with a GOLD loyalty member (seeded via 250000 store sale) and a clock set."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /_clock/set"
              payload: { station_id: "${st}", to_iso8601: "2026-06-01T00:00:00Z" }
              as: StationManager
            - call: "POST /shifts"
              payload: { station_id: "${st}", opening_float_cents: 20000 }
              as: CashierAttendant
              as_user_id: "cash1"
              captures: { sh: $.data.id }
            - call: "POST /loyalty-accounts"
              payload: { station_id: "${st}", phone: "5559000", name: "Gold" }
              as: CashierAttendant
              captures: { la: $.data.id }
            - call: "POST /store-transactions"
              payload: { station_id: "${st}", shift_id: "${sh}", loyalty_account_id: "${la}", tender: "CARD", line_items: [ { sku: "GC", name: "GiftCard", category: "MISC", unit_price_cents: 250000, qty: 1, taxable: false } ] }
              as: CashierAttendant
          trigger:
            - call: "POST /car-wash-codes"
