# =============================================================================
# Task 1888 — Construction Loan Draw Administration — §1.9 Corner Design
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: borrower_creation_and_retrieval
        claim_type: creation
        grounds: [entities.Borrower, "endpoints[POST /borrowers]"]
        distinguishing_aspect: "POST with all required fields returns 201 with input fields echoed plus system id/created_at/updated_at/version == 1; GET returns the same representation."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "GET /borrowers/${b_id}", as: DrawProcessor }
          assert:
            - "create response data.legal_name == 'Acme Builders LLC', entity_type == 'LLC', version == 1"
            - "GET response equals the created representation (id, created_at, updated_at unchanged)"

      - name: loan_creation_seeds_initial_deposit
        claim_type: defaults
        grounds: [entities.Loan.fields.status, entities.InterestReserveEntry, "endpoints[POST /loans]"]
        distinguishing_aspect: "Creating a loan initializes status OPEN, version 1, interest_reserve_balance_cents == interest_reserve_initial_cents, and writes ledger entry_index 1 of type INITIAL_DEPOSIT with amount +200000 and reserve_balance_after_cents 200000."
        test_recipe:
          setup: ["one borrower registered"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 200000, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "GET /loans/${l_id}/interest-ledger", as: LoanServicer }
          assert:
            - "Loan.${l_id}.status == OPEN, version == 1, day_count_convention == 'ACTUAL_360' (default)"
            - "retainage defaults: retainage_pct 10.00, reduced_retainage_pct 5.00, retainage_milestone_pct 50.00, stored_materials_max_pct 75.00"
            - "interest_reserve_balance_cents == 200000"
            - "ledger has exactly one entry: entry_index 1, entry_type INITIAL_DEPOSIT, amount_cents == 200000, reserve_balance_after_cents == 200000"

      - name: loan_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints[GET /loans/{id}]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns 404 with error_id ERR_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /loans/00000000-0000-0000-0000-000000000000", as: LenderAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND and HTTP status 404"

      - name: budget_line_defaults_applied
        claim_type: defaults
        grounds: [entities.BudgetLine.fields.is_contingency, entities.BudgetLine.fields.revised_amount_cents]
        distinguishing_aspect: "Omitting optional is_contingency yields false; revised_amount_cents initializes to original_amount_cents; status ACTIVE; disbursed/retained/approved_unfunded all 0."
        test_recipe:
          setup: ["borrower and loan (commitment 100000000) exist"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
          trigger:
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 40000000 }, as: LenderAdmin, captures: { bl_a: $.data.id } }
          assert:
            - "BudgetLine.${bl_a}: is_contingency == false, status == ACTIVE, revised_amount_cents == 40000000, disbursed_cents == 0, retained_cents == 0, approved_unfunded_cents == 0"
            - "Loan.${l_id}.total_original_budget_cents == 40000000"

      - name: draw_line_item_missing_required_field
        claim_type: required_fields
        grounds: [entities.DrawLineItem.fields.requested_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required requested_cents on POST /draw-line-items yields 400 ERR_INVALID_REQUEST and no line item is created."
        test_recipe:
          setup: ["loan with budget line BL-A; draw D in DRAFT"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 40000000 }, as: LenderAdmin, captures: { bl_a: $.data.id } }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
          trigger:
            - { call: "POST /draw-line-items", payload: { draw_id: "${d_id}", budget_line_id: "${bl_a}", line_type: "WORK_COMPLETED" }, as: Borrower, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (HTTP 400)"

      - name: stored_materials_evidence_required
        claim_type: conditional_validation
        grounds: [entities.DrawLineItem.fields.insurance_certificate_ref, "errors[ERR_STORED_MATERIALS_EVIDENCE_MISSING]"]
        distinguishing_aspect: "line_type STORED_MATERIALS without insurance_certificate_ref (or stored_location / stored_material_invoice_cents) yields 422 ERR_STORED_MATERIALS_EVIDENCE_MISSING — a conditional required-fields rule keyed on line_type."
        test_recipe:
          setup: ["loan with budget line BL-A; draw D in DRAFT"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "MATS", description: "Materials", original_amount_cents: 1000000 }, as: LenderAdmin, captures: { bl_s: $.data.id } }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
          trigger:
            - { call: "POST /draw-line-items", payload: { draw_id: "${d_id}", budget_line_id: "${bl_s}", line_type: "STORED_MATERIALS", requested_cents: 200000, stored_material_invoice_cents: 200000, stored_location: "Bonded warehouse, Lot 9" }, as: Borrower, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STORED_MATERIALS_EVIDENCE_MISSING (HTTP 422; insurance_certificate_ref omitted)"

      - name: stored_fields_forbidden_on_work_line
        claim_type: type_constraints
        grounds: ["errors[ERR_INVALID_REQUEST]", entities.DrawLineItem.fields.line_type]
        distinguishing_aspect: "Passing stored-materials-only fields (insurance_certificate_ref) on a WORK_COMPLETED line is rejected with 400 ERR_INVALID_REQUEST, not silently ignored."
        test_recipe:
          setup: ["loan with budget line BL-A; draw D in DRAFT"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 40000000 }, as: LenderAdmin, captures: { bl_a: $.data.id } }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
          trigger:
            - { call: "POST /draw-line-items", payload: { draw_id: "${d_id}", budget_line_id: "${bl_a}", line_type: "WORK_COMPLETED", requested_cents: 100000, insurance_certificate_ref: "CERT-1" }, as: Borrower, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (HTTP 400)"

      - name: interest_ledger_immutability
        claim_type: immutability
        grounds: [entities.InterestReserveEntry]
        distinguishing_aspect: "InterestReserveEntry has common_fields: false — entries expose id and created_at but no version/updated_at, and the surface offers no update or delete endpoint for them (append-only)."
        test_recipe:
          setup: ["loan created with interest reserve 200000"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 200000, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
          trigger:
            - { call: "GET /loans/${l_id}/interest-ledger", as: LoanServicer }
          assert:
            - "entry has id and created_at but no version or updated_at key"
            - "entry_index values are 1-based and strictly increasing (first entry == 1)"

      - name: draws_list_pagination
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /draws]"]
        distinguishing_aspect: "GET /draws honors limit/offset and returns pagination_fields total_count and has_more per the fixed envelope (limit 1 over 2 rows -> has_more true, total_count 2)."
        test_recipe:
          setup: ["loan with budget line; two draws D1 [2026-03-01,2026-03-31) and D2 [2026-04-01,2026-04-30), both DRAFT"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-04-01", period_end_date: "2026-04-30" }, as: Borrower, as_user_id: "${b_id}" }
          trigger:
            - { call: "GET /draws?loan_id=${l_id}&limit=1&offset=0", as: LenderAdmin }
          assert:
            - "response data array length == 1, total_count == 2, has_more == true"
            - "second page (offset=1) returns the other draw and has_more == false"

  # ---------------------------------------------------------------------------
  # State machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: draw_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.DrawRequest]
        distinguishing_aspect: "A newly created draw starts in DRAFT with draw_number 1 (first draw of the loan) and all computed totals 0."
        test_recipe:
          setup: ["borrower and loan exist"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
          trigger:
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
          assert:
            - "DrawRequest.${d_id}.status == DRAFT, draw_number == 1, requested_total_cents == 0, approved_total_cents == 0"

      - name: draw_submit_without_lines_rejected
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_DRAW_HAS_NO_LINES]", state_machines.DrawRequest.DRAFT_to_SUBMITTED]
        distinguishing_aspect: "Submitting a draw with zero line items fails with 422 ERR_DRAW_HAS_NO_LINES; the draw stays DRAFT."
        test_recipe:
          setup: ["loan exists; draw D created with no line items"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
          trigger:
            - { call: "POST /draws/${d_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DRAW_HAS_NO_LINES; DrawRequest.${d_id}.status remains DRAFT"

      - name: draw_start_review_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.DrawRequest.SUBMITTED_to_UNDER_REVIEW, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "start-review on a DRAFT draw is not in the transition table and fails with 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["loan with budget line; draw D in DRAFT"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
          trigger:
            - { call: "POST /draws/${d_id}/start-review", payload: {}, as: DrawProcessor, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; draw remains DRAFT"

      - name: draw_funded_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.DrawRequest]
        distinguishing_aspect: "FUNDED is terminal: request-revision on a FUNDED draw fails with 409 ERR_INVALID_STATE and records no revision_notes."
        test_recipe:
          setup: ["draw D fully funded (approved 10000000, retainage 500000 at milestone 50.00)"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 40000000 }, as: LenderAdmin, captures: { bl_a: $.data.id } }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
            - { call: "POST /draw-line-items", payload: { draw_id: "${d_id}", budget_line_id: "${bl_a}", line_type: "WORK_COMPLETED", requested_cents: 10000000 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "INVOICE", party_name: "Acme GC", amount_cents: 10000000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_inv: $.data.id } }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "LIEN_WAIVER_CONDITIONAL", party_name: "Acme GC", amount_cents: 10000000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_w: $.data.id } }
            - { call: "POST /draw-documents/${doc_inv}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draw-documents/${doc_w}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draws/${d_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${d_id}/start-review", payload: {}, as: DrawProcessor }
            - { call: "POST /inspections", payload: { loan_id: "${l_id}", draw_id: "${d_id}", scheduled_date: "2026-03-20" }, as: DrawProcessor, captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/complete", payload: { percent_complete_reported: 50.00, completed_date: "2026-03-21" }, as: Inspector }
            - { call: "POST /inspections/${insp_id}/review", payload: { decision: "ACCEPTED" }, as: DrawProcessor }
            - { call: "POST /draws/${d_id}/approve", payload: {}, as: CreditOfficer }
            - { call: "POST /draws/${d_id}/fund", payload: {}, as: LoanServicer }
          trigger:
            - { call: "POST /draws/${d_id}/request-revision", payload: { revision_notes: "too late" }, as: DrawProcessor, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; DrawRequest.${d_id}.status remains FUNDED and revision_notes remains null"

      - name: draw_withdraw_from_under_review_rejected
        claim_type: invalid_transition
        grounds: [state_machines.DrawRequest]
        distinguishing_aspect: "withdraw is declared only from DRAFT, SUBMITTED, REVISION_REQUESTED; from UNDER_REVIEW it fails with 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["draw D in UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 40000000 }, as: LenderAdmin, captures: { bl_a: $.data.id } }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
            - { call: "POST /draw-line-items", payload: { draw_id: "${d_id}", budget_line_id: "${bl_a}", line_type: "WORK_COMPLETED", requested_cents: 100000 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${d_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${d_id}/start-review", payload: {}, as: DrawProcessor }
          trigger:
            - { call: "POST /draws/${d_id}/withdraw", payload: {}, as: Borrower, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; draw remains UNDER_REVIEW"

      - name: document_double_review_rejected
        claim_type: idempotency
        grounds: [state_machines.DrawDocument, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Reviewing an already-VERIFIED document a second time fails with 409 ERR_INVALID_STATE (terminal lockdown); the first review is not silently replayed."
        test_recipe:
          setup: ["draw D in DRAFT with one SUBMITTED invoice document"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 40000000 }, as: LenderAdmin }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "INVOICE", party_name: "Acme GC", amount_cents: 100000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_id: $.data.id } }
            - { call: "POST /draw-documents/${doc_id}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
          trigger:
            - { call: "POST /draw-documents/${doc_id}/review", payload: { decision: "REJECTED", reason: "changed mind" }, as: DrawProcessor, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; DrawDocument.${doc_id}.status remains VERIFIED"

      - name: inspection_complete_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.Inspection.ORDERED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "complete is only valid from ORDERED; a second complete on a COMPLETED inspection fails with 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["loan exists; completion inspection I ORDERED then COMPLETED"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /inspections", payload: { loan_id: "${l_id}", scheduled_date: "2026-06-15" }, as: DrawProcessor, captures: { i_id: $.data.id } }
            - { call: "POST /inspections/${i_id}/complete", payload: { percent_complete_reported: 75.00, completed_date: "2026-06-16" }, as: Inspector }
          trigger:
            - { call: "POST /inspections/${i_id}/complete", payload: { percent_complete_reported: 80.00, completed_date: "2026-06-17" }, as: Inspector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; Inspection.${i_id}.percent_complete_reported remains 75.00"

      - name: reallocation_apply_before_approval_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ReallocationRequest.APPROVED_to_APPLIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "apply is valid only from APPROVED; applying a PENDING reallocation fails with 409 ERR_INVALID_STATE and leaves both lines' revised amounts untouched."
        test_recipe:
          setup: ["loan with lines BL-A 40000000 and BL-B 30000000; reallocation R PENDING (A -> B, 5000000)"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 40000000 }, as: LenderAdmin, captures: { bl_a: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "FRAM", description: "Framing", original_amount_cents: 30000000 }, as: LenderAdmin, captures: { bl_b: $.data.id } }
            - { call: "GET /loans/${l_id}", as: LenderAdmin, captures: { l_v: $.data.version } }
            - { call: "POST /reallocation-requests", payload: { loan_id: "${l_id}", from_budget_line_id: "${bl_a}", to_budget_line_id: "${bl_b}", amount_cents: 5000000, justification: "Shift", expected_loan_version: "${l_v}" }, as: LenderAdmin, captures: { ra_id: $.data.id } }
          trigger:
            - { call: "POST /reallocation-requests/${ra_id}/apply", payload: {}, as: LoanServicer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; BL-A revised_amount_cents remains 40000000, BL-B remains 30000000"

      - name: conversion_declined_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ConversionReview, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DECLINED is terminal: convert on a DECLINED review fails with 409 ERR_INVALID_STATE and the loan stays OPEN."
        test_recipe:
          setup: ["loan OPEN; conversion review CR DECLINED"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /conversion-reviews", payload: { loan_id: "${l_id}" }, as: Borrower, as_user_id: "${b_id}", captures: { cr_id: $.data.id } }
            - { call: "POST /conversion-reviews/${cr_id}/review", payload: { decision: "DECLINED", reason: "Not ready" }, as: CreditOfficer }
          trigger:
            - { call: "POST /conversion-reviews/${cr_id}/convert", payload: { permanent_interest_rate_annual_bps: 650, permanent_term_months: 360 }, as: LoanServicer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; Loan.${l_id}.status remains OPEN"

      - name: mark_installed_transitions
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_LINE_NOT_STORED_MATERIALS]", "errors[ERR_INVALID_STATE]", entities.DrawLineItem.fields.is_installed]
        distinguishing_aspect: "mark-installed enforces three guards in one instance: on a WORK_COMPLETED line -> 422 ERR_LINE_NOT_STORED_MATERIALS; on a STORED_MATERIALS line of an APPROVED draw -> 200 with is_installed true; a repeat mark -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "draw D APPROVED with WORK line on BL-W (requested 100000) and STORED line on BL-S (requested 200000, invoice 200000, evidence present)"
            - "inspection ACCEPTED at 40.00; conditional waiver 300000 and invoice 100000 verified"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "WRK", description: "Work", original_amount_cents: 1000000 }, as: LenderAdmin, captures: { bl_w: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "MATS", description: "Materials", original_amount_cents: 1000000 }, as: LenderAdmin, captures: { bl_s: $.data.id } }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
            - { call: "POST /draw-line-items", payload: { draw_id: "${d_id}", budget_line_id: "${bl_w}", line_type: "WORK_COMPLETED", requested_cents: 100000 }, as: Borrower, as_user_id: "${b_id}", captures: { dli_w: $.data.id } }
            - { call: "POST /draw-line-items", payload: { draw_id: "${d_id}", budget_line_id: "${bl_s}", line_type: "STORED_MATERIALS", requested_cents: 200000, stored_material_invoice_cents: 200000, insurance_certificate_ref: "CERT-9", stored_location: "Lot 9" }, as: Borrower, as_user_id: "${b_id}", captures: { dli_s: $.data.id } }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "INVOICE", party_name: "Acme GC", amount_cents: 100000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_inv: $.data.id } }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "LIEN_WAIVER_CONDITIONAL", party_name: "Acme GC", amount_cents: 300000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_w: $.data.id } }
            - { call: "POST /draw-documents/${doc_inv}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draw-documents/${doc_w}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draws/${d_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${d_id}/start-review", payload: {}, as: DrawProcessor }
            - { call: "POST /inspections", payload: { loan_id: "${l_id}", draw_id: "${d_id}", scheduled_date: "2026-03-20" }, as: DrawProcessor, captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/complete", payload: { percent_complete_reported: 40.00, completed_date: "2026-03-21" }, as: Inspector }
            - { call: "POST /inspections/${insp_id}/review", payload: { decision: "ACCEPTED" }, as: DrawProcessor }
            - { call: "POST /draws/${d_id}/approve", payload: {}, as: CreditOfficer }
          trigger:
            - { call: "POST /draw-line-items/${dli_w}/mark-installed", payload: { installed_date: "2026-04-10" }, as: DrawProcessor, captures: { err: $.data.error_id } }
            - { call: "POST /draw-line-items/${dli_s}/mark-installed", payload: { installed_date: "2026-04-10" }, as: DrawProcessor }
            - { call: "POST /draw-line-items/${dli_s}/mark-installed", payload: { installed_date: "2026-04-11" }, as: DrawProcessor, captures: { err2: $.data.error_id } }
          assert:
            - "WORK line: err == ERR_LINE_NOT_STORED_MATERIALS"
            - "STORED line: DrawLineItem.${dli_s}.is_installed == true and installed_date == '2026-04-10'"
            - "repeat mark: err2 == ERR_INVALID_STATE and installed_date remains '2026-04-10'"

  # ---------------------------------------------------------------------------
  # Calculations
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: waiver_coverage_excludes_unverified
        claim_type: input_set_filtering
        grounds: [calculations.waiver_coverage_requirement, "errors[ERR_LIEN_WAIVER_UNVERIFIED]"]
        distinguishing_aspect: "Only VERIFIED documents count toward waiver coverage: a SUBMITTED (never reviewed) conditional waiver of the full amount still fails approve with ERR_LIEN_WAIVER_UNVERIFIED; verifying it flips the same approve to success."
        test_recipe:
          setup: ["draw D UNDER_REVIEW, line requested 100000, verified invoice 100000, conditional waiver 100000 left SUBMITTED, ACCEPTED in-period inspection 40.00"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 1000000 }, as: LenderAdmin, captures: { bl_a: $.data.id } }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
            - { call: "POST /draw-line-items", payload: { draw_id: "${d_id}", budget_line_id: "${bl_a}", line_type: "WORK_COMPLETED", requested_cents: 100000 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "INVOICE", party_name: "Acme GC", amount_cents: 100000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_inv: $.data.id } }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "LIEN_WAIVER_CONDITIONAL", party_name: "Acme GC", amount_cents: 100000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_w: $.data.id } }
            - { call: "POST /draw-documents/${doc_inv}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draws/${d_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${d_id}/start-review", payload: {}, as: DrawProcessor }
            - { call: "POST /inspections", payload: { loan_id: "${l_id}", draw_id: "${d_id}", scheduled_date: "2026-03-20" }, as: DrawProcessor, captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/complete", payload: { percent_complete_reported: 40.00, completed_date: "2026-03-21" }, as: Inspector }
            - { call: "POST /inspections/${insp_id}/review", payload: { decision: "ACCEPTED" }, as: DrawProcessor }
          trigger:
            - { call: "POST /draws/${d_id}/approve", payload: {}, as: CreditOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /draw-documents/${doc_w}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draws/${d_id}/approve", payload: {}, as: CreditOfficer }
          assert:
            - "first approve: err == ERR_LIEN_WAIVER_UNVERIFIED (SUBMITTED waiver excluded from coverage)"
            - "after verifying the waiver: approve succeeds, DrawRequest.${d_id}.status == APPROVED"

      - name: approved_unfunded_reserved_headroom
        claim_type: derived_field_reconciliation
        grounds: [calculations.draw_line_approval_amount, entities.BudgetLine.fields.approved_unfunded_cents]
        distinguishing_aspect: "An APPROVED-not-funded draw reserves headroom: with BL-A revised 1000000 and draw 1 approved 100000, draw 2's approvable is capped at 900000 (both cost headroom and the 100.00 inspection cap net of the reservation), so requesting 950000 approves exactly 900000."
        test_recipe:
          setup:
            - "loan with BL-A revised 1000000; draw 1 [2026-03-01,2026-03-31) APPROVED 100000 (inspection 50.00, retainage 5%)"
            - "draw 2 [2026-04-01,2026-04-30) with line requested 950000, verified invoice + conditional waiver 950000, inspection ACCEPTED 100.00"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 1000000 }, as: LenderAdmin, captures: { bl_a: $.data.id } }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d1_id: $.data.id } }
            - { call: "POST /draw-line-items", payload: { draw_id: "${d1_id}", budget_line_id: "${bl_a}", line_type: "WORK_COMPLETED", requested_cents: 100000 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draw-documents", payload: { draw_id: "${d1_id}", doc_type: "INVOICE", party_name: "Acme GC", amount_cents: 100000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc1_inv: $.data.id } }
            - { call: "POST /draw-documents", payload: { draw_id: "${d1_id}", doc_type: "LIEN_WAIVER_CONDITIONAL", party_name: "Acme GC", amount_cents: 100000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc1_w: $.data.id } }
            - { call: "POST /draw-documents/${doc1_inv}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draw-documents/${doc1_w}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draws/${d1_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${d1_id}/start-review", payload: {}, as: DrawProcessor }
            - { call: "POST /inspections", payload: { loan_id: "${l_id}", draw_id: "${d1_id}", scheduled_date: "2026-03-19" }, as: DrawProcessor, captures: { insp1_id: $.data.id } }
            - { call: "POST /inspections/${insp1_id}/complete", payload: { percent_complete_reported: 50.00, completed_date: "2026-03-20" }, as: Inspector }
            - { call: "POST /inspections/${insp1_id}/review", payload: { decision: "ACCEPTED" }, as: DrawProcessor }
            - { call: "POST /draws/${d1_id}/approve", payload: {}, as: CreditOfficer }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-04-01", period_end_date: "2026-04-30" }, as: Borrower, as_user_id: "${b_id}", captures: { d2_id: $.data.id } }
            - { call: "POST /draw-line-items", payload: { draw_id: "${d2_id}", budget_line_id: "${bl_a}", line_type: "WORK_COMPLETED", requested_cents: 950000 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draw-documents", payload: { draw_id: "${d2_id}", doc_type: "INVOICE", party_name: "Acme GC", amount_cents: 950000, doc_date: "2026-04-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc2_inv: $.data.id } }
            - { call: "POST /draw-documents", payload: { draw_id: "${d2_id}", doc_type: "LIEN_WAIVER_CONDITIONAL", party_name: "Acme GC", amount_cents: 950000, doc_date: "2026-04-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc2_w: $.data.id } }
            - { call: "POST /draw-documents/${doc2_inv}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draw-documents/${doc2_w}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draws/${d2_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${d2_id}/start-review", payload: {}, as: DrawProcessor }
            - { call: "POST /inspections", payload: { loan_id: "${l_id}", draw_id: "${d2_id}", scheduled_date: "2026-04-19" }, as: DrawProcessor, captures: { insp2_id: $.data.id } }
            - { call: "POST /inspections/${insp2_id}/complete", payload: { percent_complete_reported: 100.00, completed_date: "2026-04-20" }, as: Inspector }
            - { call: "POST /inspections/${insp2_id}/review", payload: { decision: "ACCEPTED" }, as: DrawProcessor }
          trigger:
            - { call: "POST /draws/${d2_id}/approve", payload: {}, as: CreditOfficer }
          assert:
            - "DrawRequest.${d2_id}.approved_total_cents == 900000 (requested 950000 capped by headroom/inspection reservation of 100000)"
            - "BudgetLine.${bl_a}.approved_unfunded_cents == 1000000 (100000 + 900000 reserved across two APPROVED draws)"

      - name: invoice_coverage_excludes_stored_lines
        claim_type: input_set_filtering
        grounds: [calculations.invoice_coverage_requirement]
        excluded_because:
          difficulty_instance: stored_materials_min_of_caps
          rationale: "That §1.8 instance approves a draw whose only line is STORED_MATERIALS with no INVOICE document at all — approve succeeds, proving stored lines are excluded from the invoice-coverage requirement."

  # ---------------------------------------------------------------------------
  # Validations
  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: loan_create_missing_auth_headers
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT]"]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers fails priority-1 with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT before any other check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /loans", payload: { borrower_id: "00000000-0000-0000-0000-000000000000", commitment_amount_cents: 1000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT (HTTP 400); no loan created"

      - name: draw_approve_forbidden_for_borrower
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_FOR_ROLE]", "roles[Borrower]"]
        distinguishing_aspect: "Borrower (approval_chain step 1) calling the CreditOfficer-only approve endpoint fails with 403 ERR_FORBIDDEN_FOR_ROLE even when the draw is approvable."
        test_recipe:
          setup: ["draw D in UNDER_REVIEW (docs and inspection irrelevant — role check fires at priority 2)"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 1000000 }, as: LenderAdmin, captures: { bl_a: $.data.id } }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
            - { call: "POST /draw-line-items", payload: { draw_id: "${d_id}", budget_line_id: "${bl_a}", line_type: "WORK_COMPLETED", requested_cents: 100000 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${d_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${d_id}/start-review", payload: {}, as: DrawProcessor }
          trigger:
            - { call: "POST /draws/${d_id}/approve", payload: {}, as: Borrower, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE (HTTP 403); draw remains UNDER_REVIEW"

      - name: borrower_ownership_mismatch_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN_FOR_ROLE]", "roles[Borrower]"]
        distinguishing_aspect: "entity_backed identity: Borrower B (X-User-ID = B.id) creating a draw on a loan whose borrower_id is A fails with 403 ERR_FORBIDDEN_FOR_ROLE."
        test_recipe:
          setup: ["borrowers A and B; loan L owned by A"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { ba_id: $.data.id } }
            - { call: "POST /borrowers", payload: { legal_name: "Beta Homes Inc", contact_email: "b@beta.example", entity_type: "CORPORATION" }, as: LenderAdmin, captures: { bb_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${ba_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
          trigger:
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${bb_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE (HTTP 403); no draw created on loan ${l_id}"

      - name: duplicate_cost_code_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_COST_CODE]"]
        distinguishing_aspect: "cost_code is unique per loan: the second SITE line on the same loan fails with 409 ERR_DUPLICATE_COST_CODE; the same code on a DIFFERENT loan is allowed."
        test_recipe:
          setup: ["loans L1 and L2 for the same borrower; L1 already has line SITE"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l1_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l2_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l1_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 1000000 }, as: LenderAdmin }
          trigger:
            - { call: "POST /budget-lines", payload: { loan_id: "${l1_id}", cost_code: "SITE", description: "Duplicate", original_amount_cents: 500000 }, as: LenderAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l2_id}", cost_code: "SITE", description: "Fine on another loan", original_amount_cents: 500000 }, as: LenderAdmin }
          assert:
            - "duplicate on L1: err == ERR_DUPLICATE_COST_CODE (HTTP 409)"
            - "same code on L2 succeeds (201)"

      - name: commitment_exceeded_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_COMMITMENT_EXCEEDED]"]
        distinguishing_aspect: "Aggregate fiscal check: each line alone is valid, but the new line pushes the sum of originals (90000000 + 20000000) over commitment 100000000 -> 422 ERR_COMMITMENT_EXCEEDED."
        test_recipe:
          setup: ["loan commitment 100000000 with existing line 90000000"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
