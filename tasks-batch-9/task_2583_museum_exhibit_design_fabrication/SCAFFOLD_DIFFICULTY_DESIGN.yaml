      - name: case_rejection_moves_one_dimension_and_the_freeze_masks_the_other
        grounds:
          - state_machines.ArtifactCase.CONSERVATOR_REVIEW_to_REJECTED
          - state_machines.ArtifactCase.REJECTED_to_CONSERVATOR_REVIEW
          - state_machines.ArtifactCase.mount_status
          - validations.priority_40
          - validations.priority_49
        distinguishing_aspect: |
          The REJECTED exit has a long side-effect list (artifacts released,
          placed_artifact_count to 0, envelope fields nulled, project frozen)
          and mount_status is deliberately NOT in it. The rework edge
          REJECTED -> CONSERVATOR_REVIEW then makes this machine non-linear:
          the case walks backwards and the project un-freezes. The same
          mount-advance request therefore returns TWO different errors either
          side of the resubmission - ERR_PROJECT_FROZEN_CONSERVATION while the
          project is frozen (priority 40 outranks the mount rule at 49), and
          ERR_INVALID_MOUNT_STATE once it is not. An implementation that
          hard-codes one error for this request fails one half of the pair.
