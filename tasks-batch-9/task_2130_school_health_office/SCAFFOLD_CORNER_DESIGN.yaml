            - "With the pointer: ActionPlan.${p1_id}.status == ACTIVE (supersede only fires on approval)"

      - name: error_nurse_not_on_coverage_when_the_block_is_on_another_weekday
        claim_type: violation_to_error
        grounds: ["errors[ERR_NURSE_NOT_ON_COVERAGE]", "validations[priority=19]", "entities.CoverageAssignment.fields.weekday"]
        distinguishing_aspect: "The on-coverage row matches weekday AND minute-of-day: a nurse whose only ACTIVE block is TUE [480, 960) still yields a LIMITED posture at the building but is refused with 409 ERR_NURSE_NOT_ON_COVERAGE when assessing at 09:00 on a Monday."
