            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2326", full_name: "Kai Ode", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/drug-alcohol-tests", payload: { driver_id: "${d_id}", test_type: "RANDOM", substance: "DRUG", collected_at: "2026-07-01T00:00:00Z" }, as: SafetyManager, as_user_id: "sm-1", captures: { t_id: $.data.id } }
          trigger:
