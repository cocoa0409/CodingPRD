    side_effects: []
  - method: POST
    path: "/staging/photo-shoots/{shoot_id}/complete"
    description: "Record the shoot as taken; consumes a package session and may charge an overage."
    roles: [StagingCoordinator]
    code: 200
    input: []
    output: PhotoShoot
    gates: [G1_AUTHENTICATION, G2_AUTHORIZATION, G3_EXISTENCE_AND_SHAPE, G5_GLOBAL_FREEZE, G6_STATE_PRECONDITION, G8_SAFETY_AND_AUTHORITY]
    side_effects: ["PhotoShoot SCHEDULED -> COMPLETED", "Project.photo_sessions_consumed += 1 for non-reshoots", "overage_fee := calculations.photo_overage_fee", "PhotoShoot.version += 1"]
  - method: POST
    path: "/staging/photo-shoots/{shoot_id}/deliver"
    description: "Deliver the images to MLS. Gated on payment for PAY_AT_CLOSING projects only."
    roles: [StagingCoordinator]
    code: 200
    input: []
    output: PhotoShoot
    gates: [G1_AUTHENTICATION, G2_AUTHORIZATION, G3_EXISTENCE_AND_SHAPE, G6_STATE_PRECONDITION, G10_FISCAL]
    side_effects: ["PhotoShoot COMPLETED -> DELIVERED with delivered_at set", "PhotoShoot.version += 1"]
  - method: POST
    path: "/staging/photo-shoots/{shoot_id}/cancel"
    description: "Cancel a scheduled shoot; a cancelled reshoot returns its credit."
    roles: [StagingCoordinator]
    code: 200
    input: []
    output: PhotoShoot
    gates: [G1_AUTHENTICATION, G2_AUTHORIZATION, G3_EXISTENCE_AND_SHAPE, G6_STATE_PRECONDITION]
    side_effects: ["PhotoShoot SCHEDULED -> CANCELLED", "Project.reshoot_credits_remaining += 1 when is_reshoot", "PhotoShoot.version += 1"]
  - method: POST
    path: "/staging/photo-shoots/{shoot_id}/request-reshoot"
    description: "Consume a reshoot credit and create the follow-up shoot."
    roles: [ListingAgent, Seller]
    code: 201
    input: [scheduled_at]
    output: PhotoShoot
    gates: [G1_AUTHENTICATION, G2_AUTHORIZATION, G3_EXISTENCE_AND_SHAPE, G4_PARTY_SCOPE, G5_GLOBAL_FREEZE, G6_STATE_PRECONDITION, G8_SAFETY_AND_AUTHORITY, G9_CONSTRAINT_AND_CAPACITY, G10_FISCAL]
    side_effects: ["the source shoot COMPLETED/DELIVERED -> RESHOOT_REQUESTED", "a new PhotoShoot with is_reshoot true is created in state SCHEDULED", "Project.reshoot_credits_remaining -= 1"]

  # ---------- Invoice ----------
  - method: POST
    path: "/staging/projects/{project_id}/invoices"
    description: |
      Open closeout. On an OCCUPIED_PREP project (workflow_state STAGED) this MATERIALISES
      the DRAFT invoice. On a VACANT_STAGING project the invoice already exists — cascade
      hop 5 of the pickup-complete chain created it — so this call RETURNS THAT SAME
      Invoice row (no second row is ever created) and only advances the project from
      PICKED_UP to CLOSEOUT. Either way the response body is the project's single Invoice.
    roles: [BillingClerk]
    code: 201
    input: []
    output: Invoice
    gates: [G1_AUTHENTICATION, G2_AUTHORIZATION, G3_EXISTENCE_AND_SHAPE, G5_GLOBAL_FREEZE, G6_STATE_PRECONDITION]
    side_effects: ["on the OCCUPIED_PREP arm an Invoice is created in state DRAFT", "on the VACANT_STAGING arm the cascade-materialised DRAFT Invoice is returned unchanged", "line_summary, subtotal, tax_amount and total_due re-derived", "Project PICKED_UP/STAGED -> CLOSEOUT", "Project.version += 1"]
  - method: GET
    path: "/staging/invoices"
    description: "List invoices."
    roles: [PlatformAdmin, BillingClerk, StagingCoordinator, ListingAgent, Seller, BrokerageAdmin]
    code: 200
    input: ["project_id?", "state?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/staging/invoices/{invoice_id}"
    description: "Read one invoice, including line_summary, interest_accrued and total_due."
    roles: [PlatformAdmin, BillingClerk, StagingCoordinator, ListingAgent, Seller, BrokerageAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: "/staging/invoices/{invoice_id}/issue"
    description: "Issue the invoice with a due date."
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    gates: [G1_AUTHENTICATION, G2_AUTHORIZATION, G3_EXISTENCE_AND_SHAPE, G6_STATE_PRECONDITION]
    side_effects: ["Invoice DRAFT -> ISSUED with issued_at and due_date set", "Project.payment_state -> INVOICED", "Invoice.version += 1"]
  - method: POST
    path: "/staging/invoices/{invoice_id}/defer-to-closing"
    description: "PAY_AT_CLOSING only: issue the invoice with NO due date until the listing closes."
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    gates: [G1_AUTHENTICATION, G2_AUTHORIZATION, G3_EXISTENCE_AND_SHAPE, G6_STATE_PRECONDITION]
    side_effects: ["Invoice DRAFT -> DEFERRED_CLOSING with issued_at set and due_date null", "Project.payment_state -> DEFERRED", "Invoice.version += 1"]
  - method: POST
    path: "/staging/invoices/{invoice_id}/escalate"
    description: "Escalate a deferred invoice whose deferral has run out."
    roles: [BillingClerk, PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    gates: [G1_AUTHENTICATION, G2_AUTHORIZATION, G3_EXISTENCE_AND_SHAPE, G6_STATE_PRECONDITION, G10_FISCAL]
    side_effects: ["Invoice DEFERRED_CLOSING -> ESCALATED with CLOSING_ESCALATION_FEE booked", "Project.payment_state -> ESCALATED and fiscal_hold := true", "Invoice.version += 1"]
  - method: POST
    path: "/staging/invoices/{invoice_id}/pay"
    description: "Settle the invoice. amount_paid must equal total_due exactly."
    roles: [BillingClerk, BrokerageAdmin]
    code: 200
    input: [amount_paid]
    output: Invoice
    gates: [G1_AUTHENTICATION, G2_AUTHORIZATION, G3_EXISTENCE_AND_SHAPE, G4_PARTY_SCOPE, G6_STATE_PRECONDITION, G10_FISCAL]
    side_effects: ["Invoice ISSUED/ESCALATED -> PAID with paid_at set", "Project.payment_state -> SETTLED and fiscal_hold := false", "Invoice.version += 1"]
  - method: POST
    path: "/staging/invoices/{invoice_id}/void"
    description: "Write the invoice off; the deposit is forfeited."
    roles: [PlatformAdmin]
    code: 200
    input: [reason]
    output: Invoice
    gates: [G1_AUTHENTICATION, G2_AUTHORIZATION, G3_EXISTENCE_AND_SHAPE, G6_STATE_PRECONDITION, G10_FISCAL]
    side_effects: ["Invoice -> VOID", "Project.payment_state -> WRITTEN_OFF", "Deposit -> FORFEITED with forfeited_amount := held_remaining", "Invoice.version += 1"]

  # ---------- Deposit ----------
  - method: GET
    path: "/staging/deposits"
    description: "List deposits."
    roles: [PlatformAdmin, BillingClerk, StagingCoordinator, ListingAgent, Seller, BrokerageAdmin]
    code: 200
    input: ["project_id?", "invoice_id?", "state?", "limit?", "offset?"]
    output: Deposit[]
    side_effects: []
  - method: GET
    path: "/staging/deposits/{deposit_id}"
    description: "Read one deposit and its five allocation buckets plus held_remaining."
    roles: [PlatformAdmin, BillingClerk, StagingCoordinator, ListingAgent, Seller, BrokerageAdmin]
    code: 200
    input: []
    output: Deposit
    side_effects: []
  - method: POST
    path: "/staging/deposits/{deposit_id}/collect"
    description: "Take the deposit. A BROKERAGE project's 0.00 deposit is collected without hitting the minimum."
    roles: [BillingClerk]
    code: 200
    input: []
    output: Deposit
    gates: [G1_AUTHENTICATION, G2_AUTHORIZATION, G3_EXISTENCE_AND_SHAPE, G6_STATE_PRECONDITION, G10_FISCAL]
    side_effects: ["Deposit REQUIRED -> HELD with held_remaining := amount", "Project.payment_state UNBILLED -> DEPOSIT_HELD", "Deposit.version += 1"]
  - method: POST
    path: "/staging/deposits/{deposit_id}/apply"
    description: "Run the damage -> holdover -> balance waterfall against an invoice."
    roles: [BillingClerk]
    code: 200
    input: [invoice_id]
    output: Deposit
    gates: [G1_AUTHENTICATION, G2_AUTHORIZATION, G3_EXISTENCE_AND_SHAPE, G6_STATE_PRECONDITION]
    side_effects: ["the three buckets advance per calculations.deposit_waterfall", "Deposit -> PARTIALLY_APPLIED or APPLIED", "Deposit.invoice_id set", "Invoice.deposit_applied and total_due recomputed", "Deposit.version += 1"]
  - method: POST
    path: "/staging/deposits/{deposit_id}/refund"
    description: "Return the residue once the invoice is paid."
    roles: [BillingClerk]
    code: 200
    input: []
    output: Deposit
    gates: [G1_AUTHENTICATION, G2_AUTHORIZATION, G3_EXISTENCE_AND_SHAPE, G6_STATE_PRECONDITION, G10_FISCAL]
    side_effects: ["Deposit HELD/PARTIALLY_APPLIED -> REFUNDED with refunded_amount := held_remaining and held_remaining := 0.00", "Deposit.version += 1"]
  - method: POST
    path: "/staging/deposits/{deposit_id}/forfeit"
    description: "Keep the residue when the engagement collapses."
    roles: [PlatformAdmin]
    code: 200
    input: [reason]
    output: Deposit
    gates: [G1_AUTHENTICATION, G2_AUTHORIZATION, G3_EXISTENCE_AND_SHAPE, G6_STATE_PRECONDITION]
    side_effects: ["Deposit HELD/PARTIALLY_APPLIED -> FORFEITED with forfeited_amount := held_remaining and held_remaining := 0.00", "Deposit.version += 1"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  # -- authentication / authorization --
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header absent, or naming a role not declared in §1.7."
  - id: ERR_IDENTITY_REQUIRED
    http: 401
    condition: "X-User-ID absent while X-User-Role is an entity_backed role."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the endpoint's §1.5 roles."
  # -- request shape --
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A body field has the wrong type or falls outside its declared numeric range."
  - id: ERR_MISSING_FIELD
    http: 400
    condition: "A field declared without a trailing `?` in the endpoint's input is absent."
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "An enum-typed body field carries a value outside its declared set."
  # -- not found --
  - id: ERR_BROKERAGE_NOT_FOUND
    http: 404
    condition: "No Brokerage with the supplied id."
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "No Client with the supplied id."
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "No Property with the supplied id."
  - id: ERR_LISTING_NOT_FOUND
    http: 404
    condition: "No Listing with the supplied id."
  - id: ERR_TIER_NOT_FOUND
    http: 404
    condition: "No PackageTier with the supplied id."
  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "No VendorPartner with the supplied id."
  - id: ERR_ITEM_NOT_FOUND
    http: 404
    condition: "No InventoryItem with the supplied id."
  - id: ERR_CONSULTATION_NOT_FOUND
    http: 404
    condition: "No Consultation with the supplied id."
  - id: ERR_SCOPE_ITEM_NOT_FOUND
    http: 404
    condition: "No ScopeItem with the supplied id, or a PullLine.room_label matching no ScopeItem on the project's consultation."
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "No Project with the supplied id."
  - id: ERR_PULL_NOT_FOUND
    http: 404
    condition: "No InventoryPull with the supplied id."
  - id: ERR_PULL_LINE_NOT_FOUND
    http: 404
    condition: "No PullLine with the supplied id."
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "No RentalOrder with the supplied id."
  - id: ERR_INSTALL_NOT_FOUND
    http: 404
    condition: "No Install with the supplied id."
  - id: ERR_VISIT_NOT_FOUND
    http: 404
    condition: "No Visit with the supplied id."
  - id: ERR_LEASE_NOT_FOUND
    http: 404
    condition: "No Lease with the supplied id."
  - id: ERR_EXTENSION_NOT_FOUND
    http: 404
    condition: "No Extension with the supplied id."
  - id: ERR_PICKUP_NOT_FOUND
    http: 404
    condition: "No Pickup with the supplied id."
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "No DamageAssessment with the supplied id."
  - id: ERR_SHOOT_NOT_FOUND
    http: 404
    condition: "No PhotoShoot with the supplied id."
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "No Invoice with the supplied id."
  - id: ERR_DEPOSIT_NOT_FOUND
    http: 404
    condition: "No Deposit with the supplied id."
  # -- party scope --
  - id: ERR_NOT_LISTING_AGENT
    http: 403
    condition: "The acting ListingAgent is not the listing_agent_client_id of the listing being touched."
  - id: ERR_NOT_PROPERTY_OWNER
    http: 403
    condition: "The acting Seller is not the owner_client_id of the property being touched."
  - id: ERR_NOT_PROJECT_PARTY
    http: 403
    condition: "The acting BrokerageAdmin's id is not the project's brokerage_id."
  - id: ERR_NOT_ORDER_VENDOR
    http: 403
    condition: "The acting VendorRep's id is not the rental order's vendor_id."
  # -- global freeze --
  - id: ERR_PROJECT_CLOSED
    http: 409
    condition: "The ancestor Project is in workflow_state CLOSED."
  - id: ERR_LISTING_TERMINATED
    http: 409
    condition: "The ancestor Listing is in listing_state TERMINATED."
  - id: ERR_LISTING_CLOSED
    http: 409
    condition: "The ancestor Listing is in listing_state CLOSED_SOLD and the endpoint writes staging execution state."
  - id: ERR_LISTING_NOT_UNDER_CONTRACT
    http: 409
    condition: "A close or fall-out-of-escrow was attempted on a listing that is not UNDER_CONTRACT."
  # -- state preconditions --
  - id: ERR_CONSULTATION_INVALID_STATE
    http: 409
    condition: "Consultation.state is not a legal from-state for the requested transition, or the consultation is CANCELLED."
  - id: ERR_PROJECT_INVALID_STATE
    http: 409
    condition: "Project.workflow_state is not a legal from-state for the requested transition."
  - id: ERR_PIPELINE_MISMATCH
    http: 409
    condition: "A Pipeline V endpoint was called on an OCCUPIED_PREP project (or the reverse), or a ScopeItem.action is illegal for the consultation's pipeline."
  - id: ERR_PULL_INVALID_STATE
    http: 409
    condition: "InventoryPull.state is not a legal from-state for the requested transition, or an install start was attempted before the pull was COMMITTED."
  - id: ERR_ITEM_INVALID_STATE
    http: 409
    condition: "InventoryItem.status is not a legal from-state for the requested transition."
  - id: ERR_ORDER_INVALID_STATE
    http: 409
    condition: "RentalOrder.state is not a legal from-state for the requested transition."
  - id: ERR_INSTALL_INVALID_STATE
    http: 409
    condition: "Install.state is not a legal from-state for the requested transition."
  - id: ERR_VISIT_INVALID_STATE
    http: 409
    condition: "Visit.state is not a legal from-state for the requested transition."
  - id: ERR_LEASE_INVALID_STATE
    http: 409
    condition: "Lease.state is not a legal from-state for the requested transition."
  - id: ERR_EXTENSION_INVALID_STATE
    http: 409
    condition: "Extension.state is not a legal from-state for the requested transition."
  - id: ERR_PICKUP_INVALID_STATE
    http: 409
    condition: "Pickup.state is not a legal from-state for the requested transition."
  - id: ERR_ASSESSMENT_INVALID_STATE
    http: 409
    condition: "DamageAssessment.state is not a legal from-state, or a pickup completion was attempted with a non-FINAL assessment outstanding."
  - id: ERR_SHOOT_INVALID_STATE
    http: 409
    condition: "PhotoShoot.state is not a legal from-state for the requested transition."
  - id: ERR_INVOICE_INVALID_STATE
    http: 409
    condition: "Invoice.state is not a legal from-state for the requested transition."
  - id: ERR_DEPOSIT_INVALID_STATE
    http: 409
    condition: "Deposit.state is not a legal from-state for the requested transition, or a refund was attempted before the invoice was PAID."
  - id: ERR_EVENT_TOO_EARLY
    http: 422
    condition: "The logical clock has not yet reached the scheduled instant of the event being reported."
  # -- optimistic concurrency --
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version does not equal the stored Project.version."
  - id: ERR_STALE_LEASE_VERSION
    http: 412
    condition: "expected_lease_version does not equal the stored Lease.version."
  - id: ERR_STALE_PICKUP_VERSION
    http: 412
    condition: "expected_pickup_version does not equal the stored Pickup.version."
  # -- safety and authority --
  - id: ERR_SCOPE_NOT_APPROVED
    http: 409
    condition: "A project was created against a consultation that is not in state SCOPE_APPROVED."
  - id: ERR_AUTHORIZATION_CAP_EXCEEDED
    http: 403
    condition: "The acting principal's effective_authorization_cap is below Project.contract_value and no seller consent applies."
  - id: ERR_BROKERAGE_CAP_EXCEEDED
    http: 403
    condition: "Project.contract_value exceeds BROKERAGE_AUTHORIZATION_HARD_CAP."
  - id: ERR_SELLER_CONSENT_REQUIRED
    http: 403
    condition: "A ListingAgent authorized above their own cap while the payer Seller has consent_on_file false."
  - id: ERR_VENDOR_LEAD_TIME_VIOLATION
    http: 422
    condition: "Install.scheduled_at falls before a consumed RentalOrder.earliest_delivery_date."
  - id: ERR_VENDOR_MIN_TERM_VIOLATION
    http: 422
    condition: "Lease.initial_cycles is below a consumed RentalOrder.effective_term_cycles."
  - id: ERR_BELOW_MIN_LEASE_TERM
    http: 422
    condition: "Lease.initial_cycles is below MIN_LEASE_CYCLES."
  - id: ERR_PARTIAL_CYCLE_EXTENSION
    http: 422
    condition: "requested_cycles is zero, negative or not a whole multiple of EXTENSION_INCREMENT_CYCLES."
  - id: ERR_EXTENSION_LIMIT_REACHED
    http: 409
    condition: "Granting the extension would push Lease.extension_cycles above MAX_EXTENSION_CYCLES_TOTAL."
  - id: ERR_INVALID_TIER_CHANGE
    http: 422
    condition: "An upgrade target's tier_rank is not strictly greater, or a downgrade target's is not strictly smaller, than the current tier's."
  - id: ERR_SHOOT_BEFORE_INSTALL
    http: 409
    condition: "A shoot on a VACANT_STAGING project was scheduled or completed before the project's install completed."
  - id: ERR_VISIT_NOT_COMPLETED
    http: 409
    condition: "A shoot on an OCCUPIED_PREP project was completed with no Visit in state COMPLETED."
  - id: ERR_SHOOT_AFTER_DESTAGE
    http: 409
    condition: "A shoot was scheduled or completed on or after the project's de-stage start."
  - id: ERR_RESHOOT_ENTITLEMENT_EXHAUSTED
    http: 409
    condition: "A reshoot was requested with Project.reshoot_credits_remaining at 0."
  # -- constraint and capacity --
  - id: ERR_INSUFFICIENT_INVENTORY
    http: 409
    condition: "An allocation pass filled zero units - no line on the pull could be satisfied from owned stock or a placed vendor order."
  - id: ERR_FILL_RATE_BELOW_MINIMUM
    http: 409
    condition: "A commit was attempted with InventoryPull.fill_rate below PULL_PARTIAL_FILL_MIN_PCT."
  - id: ERR_PULL_RESUBMIT_LIMIT
    http: 409
    condition: "A PARTIAL pull was re-submitted with resubmit_count already at MAX_PULL_RESUBMITS."
  - id: ERR_INSTALL_ATTEMPT_LIMIT
    http: 409
    condition: "A NO_ACCESS install was rescheduled with attempt_count already at MAX_INSTALL_REATTEMPTS."
  - id: ERR_VISIT_ATTEMPT_LIMIT
    http: 409
    condition: "A NO_ACCESS visit was rescheduled with attempt_count already at MAX_VISIT_REATTEMPTS."
  - id: ERR_PICKUP_ATTEMPT_LIMIT
    http: 409
    condition: "A NO_ACCESS or REFUSED pickup was rescheduled with attempt_count already at MAX_PICKUP_REATTEMPTS."
  - id: ERR_APPEAL_LIMIT_REACHED
    http: 409
    condition: "An assessment was disputed with appeal_count already at MAX_DAMAGE_APPEALS."
  - id: ERR_PICKUP_OUTSIDE_WINDOW
    http: 422
    condition: "Pickup.scheduled_at falls outside the closed interval [pickup_window_start, pickup_window_end]."
  - id: ERR_CREW_DOUBLE_BOOKED
    http: 409
    condition: "The proposed install's UTC calendar day already carries CREW_DAY_CAPACITY installs in state SCHEDULED or IN_PROGRESS."
  - id: ERR_SHOOT_TIME_CONFLICT
    http: 409
    condition: "The proposed shoot block overlaps an existing shoot's block plus its trailing buffer on the same property."
  - id: ERR_SERVICE_WINDOW_EXPIRED
    http: 409
    condition: "A visit was scheduled, rescheduled or completed after Project.service_window_end_date."
  - id: ERR_WINDOW_EXTENSION_LIMIT
    http: 409
    condition: "A service-window extension was requested with window_extension_count already at MAX_OCCUPIED_WINDOW_EXTENSIONS."
  - id: ERR_DUPLICATE_ACTIVE_PROJECT
    http: 409
    condition: "Another Project on the same property is in a workflow_state other than CLOSED."
  # -- fiscal --
  - id: ERR_DEPOSIT_NOT_HELD
    http: 402
    condition: "Execution work was requested while the project's Deposit is not in state HELD."
  - id: ERR_DEPOSIT_BELOW_MINIMUM
    http: 422
    condition: "A non-zero Deposit.amount below DEPOSIT_MIN_AMOUNT was presented for collection."
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "amount_paid does not equal Invoice.total_due exactly."
  - id: ERR_INVOICE_ALREADY_PAID
    http: 409
    condition: "A pay, void or escalate was attempted on an invoice already in state PAID."
  - id: ERR_CLOSING_DEFERRAL_EXPIRED
    http: 409
    condition: "A deferred invoice was converted more than CLOSING_DEFERRAL_MAX_DAYS after its issued_at."
  - id: ERR_FISCAL_HOLD
    http: 402
    condition: "A new commitment was requested while Project.fiscal_hold is true."
  - id: ERR_MLS_DELIVERY_PAYMENT_GATE
    http: 402
    condition: "Delivery was requested on a gated shoot whose project's Invoice is not in state PAID."

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: PlatformAdmin
    description: "Operator superuser. Owns the logical clock, configuration entities, damage-appeal adjudication and write-offs."
    identity: "opaque"
    exclusive_operations:
      - "POST /staging/_clock/set_current_utc"
      - "POST /staging/brokerages"
      - "POST /staging/package-tiers"
      - "POST /staging/damage-assessments/{assessment_id}/adjudicate"
      - "POST /staging/invoices/{invoice_id}/void"
      - "POST /staging/deposits/{deposit_id}/forfeit"
    shared_operations:
      - "POST /staging/clients"
      - "POST /staging/properties"
      - "POST /staging/listings and its lifecycle actions"
      - "POST /staging/vendors and PATCH /staging/vendors/{vendor_id}"
      - "POST /staging/inventory-items and its repair/write-off actions"
      - "POST /staging/consultations/{consultation_id}/cancel"
      - "POST /staging/projects/{project_id}/close"
      - "POST /staging/invoices/{invoice_id}/escalate"
      - "every GET"

  - name: StagingCoordinator
    description: "Runs execution: consultations, scope drafting, projects, installs, visits, pickups, shoots and extension application."
    identity: "opaque"
    exclusive_operations:
      - "POST /staging/consultations/{consultation_id}/hold"
      - "POST /staging/consultations/{consultation_id}/scope-items"
      - "POST /staging/consultations/{consultation_id}/submit-scope"
      - "POST /staging/projects"
      - "POST /staging/projects/{project_id}/installs"
      - "POST /staging/projects/{project_id}/visits"
      - "POST /staging/projects/{project_id}/pickups"
      - "POST /staging/projects/{project_id}/photo-shoots"
      - "every install, visit, pickup and photo-shoot lifecycle action except request-reshoot"
      - "POST /staging/extensions/{extension_id}/apply"
    shared_operations:
      - "POST /staging/clients"
      - "POST /staging/properties"
      - "POST /staging/listings"
      - "POST /staging/consultations"
      - "POST /staging/projects/{project_id}/upgrade-package and /downgrade-package"
      - "POST /staging/projects/{project_id}/extend-window"
      - "POST /staging/projects/{project_id}/close"
      - "POST /staging/leases/{lease_id}/mark-term-complete"
      - "POST /staging/leases/{lease_id}/extensions"
      - "every GET except brokerages"

  - name: WarehouseManager
    description: "Owns stock: inventory, pulls, pull lines, rental orders, damage assessment and extension adjudication. SEGREGATION OF DUTIES — may never authorize a project, issue an invoice, or take a payment."
    identity: "opaque"
    exclusive_operations:
      - "POST /staging/projects/{project_id}/pulls"
      - "POST /staging/pulls/{pull_id}/lines, /submit, /commit, /release, /cancel"
      - "POST /staging/rental-orders and /place, /cancel"
      - "POST /staging/pickups/{pickup_id}/damage-assessments"
      - "POST /staging/damage-assessments/{assessment_id}/assess and /finalize"
      - "POST /staging/extensions/{extension_id}/adjudicate"
    shared_operations:
      - "POST /staging/vendors and PATCH /staging/vendors/{vendor_id}"
      - "POST /staging/inventory-items and its repair/write-off actions"
      - "every GET except brokerages, clients, invoices and deposits"

  - name: BillingClerk
    description: "Owns money movement: deposits, invoices, holdover accrual. SEGREGATION OF DUTIES — may never adjudicate damage, run an allocation pass, or authorize a project."
    identity: "opaque"
    exclusive_operations:
      - "POST /staging/projects/{project_id}/invoices"
      - "POST /staging/invoices/{invoice_id}/issue and /defer-to-closing"
      - "POST /staging/deposits/{deposit_id}/collect, /apply, /refund"
      - "POST /staging/leases/{lease_id}/accrue-holdover"
    shared_operations:
      - "POST /staging/invoices/{invoice_id}/escalate and /pay"
      - "POST /staging/leases/{lease_id}/mark-term-complete"
      - "every GET"

  - name: ListingAgent
    description: "The seller's agent. Drives the listing lifecycle, approves scope, authorizes within cap, requests extensions and reshoots, disputes damage."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /staging/listings/{listing_id}/under-contract, /fall-out-of-escrow, /close, /terminate"
    shared_operations:
      - "POST /staging/listings"
      - "POST /staging/consultations"
      - "POST /staging/consultations/{consultation_id}/approve-scope and /reject-scope"
      - "POST /staging/projects/{project_id}/authorize"
      - "POST /staging/projects/{project_id}/upgrade-package, /downgrade-package, /extend-window"
      - "POST /staging/leases/{lease_id}/extensions"
      - "POST /staging/photo-shoots/{shoot_id}/request-reshoot"
      - "POST /staging/damage-assessments/{assessment_id}/dispute"
      - "GETs on properties, listings, consultations, scope items, projects, leases, extensions, shoots, assessments, invoices, deposits"

  - name: Seller
    description: "The homeowner. May approve scope, authorize their own project without cap, record standing consent, request reshoots and dispute damage."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /staging/clients/{client_id}/seller-consent"
    shared_operations:
      - "POST /staging/consultations"
      - "POST /staging/consultations/{consultation_id}/approve-scope and /reject-scope"
      - "POST /staging/projects/{project_id}/authorize"
      - "POST /staging/photo-shoots/{shoot_id}/request-reshoot"
      - "POST /staging/damage-assessments/{assessment_id}/dispute"
      - "GETs on properties, listings, consultations, scope items, projects, leases, shoots, assessments, invoices, deposits"

  - name: BrokerageAdmin
    description: "Brokerage back office. Authorizes and pays BROKERAGE-payer projects on behalf of the firm."
    identity: "entity_backed:Brokerage"
    exclusive_operations: []
    shared_operations:
      - "POST /staging/projects/{project_id}/authorize"
      - "POST /staging/invoices/{invoice_id}/pay"
      - "GETs on brokerages, clients, projects, invoices, deposits"

  - name: VendorRep
    description: "Partner rental house representative. The only role that may confirm one of its own orders."
    identity: "entity_backed:VendorPartner"
    exclusive_operations:
      - "POST /staging/rental-orders/{rental_order_id}/confirm"
    shared_operations:
      - "GETs on vendors and rental orders"

