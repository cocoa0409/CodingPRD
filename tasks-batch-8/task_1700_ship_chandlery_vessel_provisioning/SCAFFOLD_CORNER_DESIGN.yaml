  - section: calculations
    instances:
      - name: cold_surcharge_tier_boundary_exactly_72h
        claim_type: boundary_value
        grounds: [calculations.line_pricing, calculations.cold_chain_hours]
        distinguishing_aspect: "At exactly 72 planned hours the cold rate is the tier-1 rate (5 x 72 = 360 per unit); one hour later (73h) adds the tier-2 rate (360 + 12 = 372). Fixture: 20h stay vs 73h stay on two vessels, 10 units of FISH each @ 2500, duty 0%."
        test_recipe:
          setup:
            - "Agent USD; FISH item base 2500 duty 0; cold lot capacity 10000 received 10000"
            - "Vessel S (short stay): ETA 2026-08-10T08:00:00Z, ETD 2026-08-11T04:00:00Z = exactly 20h => cold/unit 5*20 = 100"
            - "Correction: for the 72h boundary itself, vessel S72: ETA 2026-08-10T08:00:00Z, ETD 2026-08-13T08:00:00Z = exactly 72h => cold/unit 360; vessel S73: ETD 2026-08-13T09:00:00Z = 73h => cold/unit 372"
          setup_api_calls:
            - call: "POST /chandlery/ship-agents"
              payload: { name: "Agent AI", settlement_currency: USD, credit_limit_cents: 5000000, payment_terms_days: 30 }
              as: FinanceController
              captures: { agentI: $.data.id }
            - call: "POST /chandlery/catalog-items"
              payload: { sku: "FISH-C10", name: "Frozen Salmon 1kg", category: PROVISIONS, bonded_eligible: false, requires_cold_chain: true, base_price_cents: 2500, duty_rate_pct: 0 }
