          assert:
            - "${x5_maint_status} == MAINTENANCE and ${x5_sheets} == 6 == 3 pieces * 2 sheets"
            - "HTTP 409 with ${x5_maint_error} == ERR_PRESS_LINE_UNAVAILABLE — the MAINTENANCE line is refused even though it carries DUPLEX and has headroom"
            - "HTTP 422 with ${x5_capability_error} == ERR_PRESS_LINE_CAPABILITY_MISMATCH for the AVAILABLE line without DUPLEX, since the template demands duplex"
            - "HTTP 409 with ${x5_capacity_error} == ERR_PRESS_CAPACITY_EXCEEDED for the capable line whose daily_sheet_capacity 4 cannot absorb 6 sheets (0 + 6 > 4)"
            - "HTTP 409 with ${x5_selector_error} == ERR_NO_ELIGIBLE_PRESS_LINE when press_line_id is omitted and all three lines fail a predicate"
            - "HTTP 201 once PL-X5G exists: ${x5_mode} == SELECTED, ${x5_line} == ${x5_good_line} and ${x5_score} == 840.00 == round_half_up(1000 * 6000 / 10000 + 600 * 4000 / 10000 - 0 * 500, 2)"
            - "The job stays PRESORTED through all four rejections: PrintRun.${x5_run_id} is the only run ever created for it"

