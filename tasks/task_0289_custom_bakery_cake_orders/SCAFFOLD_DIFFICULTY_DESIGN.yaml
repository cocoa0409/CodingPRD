  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: capacity_conserved_under_commit_then_release
        grounds:
          - state_machines.SlotReservation.HELD_to_COMMITTED
          - state_machines.SlotReservation.COMMITTED_to_RELEASED
          - entities.ProductionDay.fields.units_committed
        distinguishing_aspect: |
          Conserved quantity #1 — production capacity: ProductionDay.units_committed MUST equal
          sum(order.units for orders whose SlotReservation.status==COMMITTED on this day). A commit (+units)
          paired with its release (-units) leaves units_committed at its pre-commit value (0), zero drift.
        test_recipe:
          setup:
            - "Approved+paid order committed to a non-peak day (units_committed becomes 2), then the reservation is released"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-06-01T00:00:00Z" }
              as: BakeryManager
            - call: "POST /products"
              payload: { name: "Conserve Cake", base_price_cents: 10000, base_lead_days: 3, tier_levels: 1, allowed_option_codes: [], declared_allergen_codes: ["GLUTEN"] }
