              payload: {}
              as: ProgramAdmin
              captures: { sv0: $.data.version }
            - call: "POST /programs/${prog_id}/sites/${site_id}/drops"
              payload: { participant_id: "${part_id}", access_grant_id: "${grant_id}", material_category_id: "${mat_id}", gross_weight_kg: 99.00, contamination_kg: 0.00, occurred_at: "2026-08-01T10:00:00Z", expected_site_version: "${sv0}" }
              as: Participant
              as_user_id: "${part_id}"
            - call: "GET /programs/${prog_id}/sites/${site_id}"
              payload: {}
              as: ProgramAdmin
              captures: { sv1: $.data.version, posture1: $.data.posture }
            - call: "POST /programs/${prog_id}/sites/${site_id}/drops"
              payload: { participant_id: "${part_id}", access_grant_id: "${grant_id}", material_category_id: "${mat_id}", gross_weight_kg: 1.00, contamination_kg: 0.00, occurred_at: "2026-08-01T11:00:00Z", expected_site_version: "${sv1}" }
              as: Participant
              as_user_id: "${part_id}"
            - call: "GET /programs/${prog_id}/sites/${site_id}"
              payload: {}
              as: ProgramAdmin
              captures: { sv2: $.data.version, posture2: $.data.posture }
          trigger:
