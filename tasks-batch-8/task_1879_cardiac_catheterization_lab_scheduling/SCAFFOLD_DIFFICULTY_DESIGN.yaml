# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — task 1879 cardiac cath lab scheduling
# §1.8 Test Targeting Index: 2 instances per Difficulty Rule (18 total).
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and is replayable from
# empty-DB via its structured setup_api_calls chain.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains: DeviceLot vs RecoveryBed)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: device_availability_scheduling_vs_physical_view
        grounds:
          - calculations.device_availability
          - entities.DeviceLot.fields.available_units
          - entities.DeviceLot.fields.quantity_on_hand
          - entities.DeviceLot.fields.allocated_units
        distinguishing_aspect: |
          Same lot data yields two valid availability numbers on the DeviceLot
          (inventory domain): scheduling_view (available_units = on_hand - allocated)
          == 3 while physical_view (quantity_on_hand) == 5 after reserving 2 of 5.
        test_recipe:
          setup:
            - "DeviceLot L with quantity_on_hand 5, reorder_threshold 2, ownership CONSIGNMENT, expiration 2027-01-01"
            - "An URGENT case C is SCHEDULED (no AUC needed for URGENT)"
            - "DeviceUsage U reserves 2 units of L for C"
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_id: $.data.id }
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
            - call: "POST /cath-lab/device-lots"
              payload: { device_type: STENT_DES, manufacturer: "Acme", model_number: "DS-100", lot_number: "LOT-A", ownership: CONSIGNMENT, quantity_on_hand: 5, reorder_threshold: 2, expiration_date: "2027-01-01T00:00:00Z" }
              as: CathLabTechnologist
              captures: { lot_id: $.data.id }
            - call: "POST /cath-lab/cases/${case_id}/device-usages"
              payload: { lot_id: "${lot_id}", quantity: 2 }
              as: CathLabTechnologist
          trigger:
            - call: "GET /cath-lab/device-lots/${lot_id}"
              as: CathLabTechnologist
          assert:
            - "DeviceLot.${lot_id}.quantity_on_hand == 5 (physical_view: reservation does not consume shelf stock)"
            - "DeviceLot.${lot_id}.allocated_units == 2"
            - "DeviceLot.${lot_id}.available_units == 3 (scheduling_view: 5 - 2)"
            - "DeviceLot.${lot_id}.status == ACTIVE (available 3 >= threshold 2)"

      - name: bed_release_scheduled_vs_actual_variant
        grounds:
          - calculations.bed_release_projection
          - entities.RecoveryBed.fields.window_start
          - entities.RecoveryBed.fields.window_end
          - state_machines.CathCase.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Same bed reservation yields two valid release projections on the
          RecoveryBed (bed domain, distinct from the DeviceLot instance):
          scheduled_variant window_end 2026-08-10T12:00:00Z (from scheduled_end
          10:30 + 90) vs actual_variant window_end 2026-08-10T13:00:00Z after
          the case actually ends at 11:30.
        test_recipe:
          setup:
            - "ELECTIVE PCI case C (no equipment) is AUC-documented and SCHEDULED on room R 09:00-10:30 with bed B RESERVED"
            - "Bed B window is the scheduled variant: [2026-08-10T10:30:00Z, 2026-08-10T12:00:00Z]"
            - "C is fully staffed (SCRUB + CIRCULATOR) and IN_PROGRESS (started at logical 10:00)"
            - "Logical clock stands at 2026-08-10T11:30:00Z"
          setup_api_calls:
            - call: "POST /cath-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: CathLabScheduler
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Order", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys2_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Tech One", staff_role: SCRUB_TECHNOLOGIST }
              as: CathLabScheduler
              captures: { tech1_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Nurse One", staff_role: CIRCULATING_NURSE }
              as: CathLabScheduler
              captures: { nurse1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: ELECTIVE, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /cath-lab/cases/${case_id}/auc-attestation"
              payload: { ordering_physician_id: "${phys2_id}", auc_score: APPROPRIATE, criterion_code: "AUC-45.1", expected_case_version: "${case_v}" }
              as: InterventionalCardiologist
              as_user_id: "${phys2_id}"
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
            - call: "GET /cath-lab/recovery-beds/${bed1_id}"
              as: RecoveryNurseManager
              captures: { bed_window_end_scheduled: $.data.window_end }
            - call: "POST /cath-lab/cases/${case_id}/staff-assignments"
              payload: { staff_id: "${tech1_id}", role_in_case: SCRUB }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/staff-assignments"
              payload: { staff_id: "${nurse1_id}", role_in_case: CIRCULATOR }
              as: CathLabScheduler
            - call: "POST /cath-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T10:00:00Z" }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/start"
              as: InterventionalCardiologist
              as_user_id: "${phys1_id}"
            - call: "POST /cath-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T11:30:00Z" }
              as: CathLabScheduler
          trigger:
            - call: "POST /cath-lab/cases/${case_id}/complete"
              as: InterventionalCardiologist
              as_user_id: "${phys1_id}"
            - call: "GET /cath-lab/recovery-beds/${bed1_id}"
              as: RecoveryNurseManager
          assert:
            - "Before completion: RecoveryBed.${bed1_id}.window_end == 2026-08-10T12:00:00Z (scheduled variant: scheduled_end 10:30 + 90 min)"
            - "After completion: RecoveryBed.${bed1_id}.status == OCCUPIED"
            - "After completion: RecoveryBed.${bed1_id}.window_start == 2026-08-10T11:30:00Z (actual variant: actual_end)"
            - "After completion: RecoveryBed.${bed1_id}.window_end == 2026-08-10T13:00:00Z (actual variant: 11:30 + 90 min)"
            - "CathCase.${case_id}.actual_end == 2026-08-10T11:30:00Z"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (mode (a) tiered/branching vs mode (b) nested rounding)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: estimated_case_window_tiered_setup_and_stemi_branch
        grounds:
          - calculations.estimated_case_window
          - entities.CathCase.fields.scheduled_end
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 3 inputs with non-linear interaction —
          procedure_type base tier, equipment-count tier (0/15/30), and the
          priority branch that zeroes setup for STEMI. PCI with 3 equipment
          needs => 90 + 30 = 120 min; STEMI_PCI with the same 3 needs =>
          75 + 0 = 75 min (branch override, not the 105 a non-STEMI 75-base
          case would get).
        test_recipe:
          setup:
            - "Room R1 and R2 both carry equipment_profile [IVUS, OCT, FFR]; two beds AVAILABLE"
            - "Cardiologists P1 (performing) and P2 (ordering) exist"
            - "Case A: ELECTIVE PCI, equipment_needs [IVUS, OCT, FFR], AUC-documented, scheduled on R1 at 2026-08-10T09:00:00Z"
            - "Case B: STEMI_PCI with priority STEMI, same 3 equipment needs, created with scheduled_start 2026-08-10T09:00:00Z (selector picks R2: R1 has 1 elective victim, R2 has 0)"
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Order", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys2_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [IVUS, OCT, FFR] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 2", equipment_profile: [IVUS, OCT, FFR] }
              as: CathLabScheduler
              captures: { room2_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 2" }
              as: RecoveryNurseManager
              captures: { bed2_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-A", procedure_type: PCI, priority: ELECTIVE, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0, equipment_needs: [IVUS, OCT, FFR] }
              as: CathLabScheduler
              captures: { case_a_id: $.data.id, case_a_v: $.data.version }
            - call: "POST /cath-lab/cases/${case_a_id}/auc-attestation"
              payload: { ordering_physician_id: "${phys2_id}", auc_score: APPROPRIATE, criterion_code: "AUC-45.1", expected_case_version: "${case_a_v}" }
              as: InterventionalCardiologist
              as_user_id: "${phys2_id}"
            - call: "POST /cath-lab/cases/${case_a_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
          trigger:
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-B", procedure_type: STEMI_PCI, priority: STEMI, performing_physician_id: "${phys1_id}", weight_kg: 80, serum_creatinine: 1.2, equipment_needs: [IVUS, OCT, FFR], scheduled_start: "2026-08-10T09:00:00Z" }
              as: CathLabScheduler
              captures: { case_b_id: $.data.id, case_b_lab: $.data.lab_id, case_b_end: $.data.scheduled_end }
            - call: "GET /cath-lab/cases/${case_a_id}"
              as: CathLabScheduler
              captures: { case_a_end: $.data.scheduled_end, case_a_status: $.data.status }
          assert:
            - "CathCase.${case_a_id}.scheduled_end == 2026-08-10T11:00:00Z (PCI base 90 + equipment tier 30)"
            - "CathCase.${case_b_id}.scheduled_end == 2026-08-10T10:15:00Z (STEMI_PCI base 75 + setup forced to 0 by priority branch despite 3 equipment needs)"
            - "CathCase.${case_b_id}.lab_id == ${room2_id} (selector ranks 0-victim room over 1-victim room)"
            - "CathCase.${case_a_id}.status == SCHEDULED (not bumped: STEMI window on R2 does not overlap R1)"

      - name: radiation_report_round_per_record_then_sum
        grounds:
          - calculations.radiation_dose_report
          - entities.CathCase.fields.cumulative_radiation_mgy
          - entities.DoseRecord.fields.record_total_mgy
        distinguishing_aspect: |
          Mode (b) combinatorial: nested rounding where order is pinned —
          each RADIATION record rounds (fluoroscopy + cine) half-up to 2
          decimals BEFORE summation. Two records of 1.005 mGy each yield
          1.01 + 1.01 = 2.02; the forbidden sum-then-round order yields 2.01.
        test_recipe:
          setup:
            - "URGENT case C is SCHEDULED, staffed (SCRUB + CIRCULATOR), and IN_PROGRESS"
            - "Two ACTIVE RADIATION DoseRecords exist on C: (fluoroscopy_mgy 1.005, cine_mgy 0) and (fluoroscopy_mgy 1.005, cine_mgy 0)"
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Tech One", staff_role: SCRUB_TECHNOLOGIST }
              as: CathLabScheduler
              captures: { tech1_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Nurse One", staff_role: CIRCULATING_NURSE }
              as: CathLabScheduler
              captures: { nurse1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_id: $.data.id }
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/staff-assignments"
              payload: { staff_id: "${tech1_id}", role_in_case: SCRUB }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/staff-assignments"
              payload: { staff_id: "${nurse1_id}", role_in_case: CIRCULATOR }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/start"
              as: InterventionalCardiologist
              as_user_id: "${phys1_id}"
          trigger:
            - call: "POST /cath-lab/cases/${case_id}/dose-records"
              payload: { record_type: RADIATION, fluoroscopy_mgy: 1.005, cine_mgy: 0 }
              as: CathLabTechnologist
              captures: { rec1_id: $.data.id, rec1_total: $.data.record_total_mgy }
            - call: "POST /cath-lab/cases/${case_id}/dose-records"
              payload: { record_type: RADIATION, fluoroscopy_mgy: 1.005, cine_mgy: 0 }
              as: CathLabTechnologist
              captures: { rec2_id: $.data.id, rec2_total: $.data.record_total_mgy }
            - call: "GET /cath-lab/cases/${case_id}"
              as: CathLabTechnologist
              captures: { case_rad: $.data.cumulative_radiation_mgy }
          assert:
            - "DoseRecord.${rec1_id}.record_total_mgy == 1.01 (round_half_up(1.005 + 0, 2) per record)"
            - "DoseRecord.${rec2_id}.record_total_mgy == 1.01"
            - "CathCase.${case_id}.cumulative_radiation_mgy == 2.02 (per-record rounding then sum; sum-then-round would give 2.01)"
            - "CathCase.${case_id}.radiation_alert == false (2.02 < 5000.0)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (CathCase cycle vs RegistrySubmission cycle)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: case_bump_reschedule_cycle
        grounds:
          - state_machines.CathCase.SCHEDULED_to_BUMPED
          - state_machines.CathCase.BUMPED_to_SCHEDULED
          - calculations.bump_room_selector
        distinguishing_aspect: |
          CathCase exhibits a true cycle SCHEDULED -> BUMPED -> SCHEDULED
          (bump then reschedule), and bump_count accumulates across the loop —
          structurally distinct from a linear pipeline.
        test_recipe:
          setup:
            - "Room R (only room), beds B1 and B2 AVAILABLE"
            - "ELECTIVE DIAGNOSTIC_CATHETERIZATION case E is AUC-documented and SCHEDULED on R 09:00-09:45 holding B1"
            - "STEMI activation arrives for window starting 2026-08-10T09:15:00Z, bumping E"
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Order", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys2_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 2" }
              as: RecoveryNurseManager
              captures: { bed2_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-E", procedure_type: DIAGNOSTIC_CATHETERIZATION, priority: ELECTIVE, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_e_id: $.data.id, case_e_v: $.data.version }
            - call: "POST /cath-lab/cases/${case_e_id}/auc-attestation"
              payload: { ordering_physician_id: "${phys2_id}", auc_score: APPROPRIATE, criterion_code: "AUC-45.1", expected_case_version: "${case_e_v}" }
              as: InterventionalCardiologist
              as_user_id: "${phys2_id}"
            - call: "POST /cath-lab/cases/${case_e_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-S", procedure_type: STEMI_PCI, priority: STEMI, performing_physician_id: "${phys1_id}", weight_kg: 80, serum_creatinine: 1.1, scheduled_start: "2026-08-10T09:15:00Z" }
              as: CathLabScheduler
              captures: { case_s_id: $.data.id }
          trigger:
            - call: "GET /cath-lab/cases/${case_e_id}"
              as: CathLabScheduler
              captures: { e_status: $.data.status, e_bumps: $.data.bump_count }
            - call: "POST /cath-lab/cases/${case_e_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T13:00:00Z", bed_id: "${bed2_id}" }
              as: CathLabScheduler
              captures: { e_status2: $.data.status }
            - call: "GET /cath-lab/recovery-beds/${bed1_id}"
              as: RecoveryNurseManager
              captures: { bed1_case: $.data.held_case_id }
          assert:
            - "After STEMI: CathCase.${case_e_id}.status == BUMPED and bump_count == 1"
            - "After STEMI: CathCase.${case_e_id}.lab_id == null and scheduled_start == null (window cleared)"
            - "After STEMI: CathCase.${case_s_id}.status == SCHEDULED with lab_id == ${room1_id}"
            - "After STEMI: RecoveryBed.${bed1_id} was freed by the bump cascade and re-reserved by the STEMI bed_selector (held_case_id == ${case_s_id}); the bumped case's reschedule therefore uses explicit bed_id ${bed2_id}"
            - "After reschedule: CathCase.${case_e_id}.status == SCHEDULED (cycle closed), bump_count still == 1"

      - name: registry_submission_revision_cycle
        grounds:
          - state_machines.RegistrySubmission.DRAFT_to_SUBMITTED
          - state_machines.RegistrySubmission.SUBMITTED_to_REJECTED
          - state_machines.RegistrySubmission.REJECTED_to_DRAFT
        distinguishing_aspect: |
          RegistrySubmission exhibits a revision cycle DRAFT -> SUBMITTED ->
          REJECTED -> DRAFT -> SUBMITTED on a different entity than the
          CathCase bump cycle; submitted_at/decided_at clear on the loop-back.
        test_recipe:
          setup:
            - "ELECTIVE PCI case C completed at logical 2026-08-10T11:30:00Z with one ACTIVE RADIATION dose record and AUC documented (completeness 100.0)"
            - "RegistrySubmission X exists for C in DRAFT"
          setup_api_calls:
            - call: "POST /cath-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: CathLabScheduler
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Order", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys2_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Tech One", staff_role: SCRUB_TECHNOLOGIST }
              as: CathLabScheduler
              captures: { tech1_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Nurse One", staff_role: CIRCULATING_NURSE }
              as: CathLabScheduler
              captures: { nurse1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: ELECTIVE, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /cath-lab/cases/${case_id}/auc-attestation"
              payload: { ordering_physician_id: "${phys2_id}", auc_score: APPROPRIATE, criterion_code: "AUC-45.1", expected_case_version: "${case_v}" }
              as: InterventionalCardiologist
              as_user_id: "${phys2_id}"
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/staff-assignments"
              payload: { staff_id: "${tech1_id}", role_in_case: SCRUB }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/staff-assignments"
              payload: { staff_id: "${nurse1_id}", role_in_case: CIRCULATOR }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/start"
              as: InterventionalCardiologist
              as_user_id: "${phys1_id}"
            - call: "POST /cath-lab/cases/${case_id}/dose-records"
              payload: { record_type: RADIATION, fluoroscopy_mgy: 100, cine_mgy: 50 }
              as: CathLabTechnologist
            - call: "POST /cath-lab/cases/${case_id}/complete"
              as: InterventionalCardiologist
              as_user_id: "${phys1_id}"
            - call: "POST /cath-lab/cases/${case_id}/registry-submissions"
              as: RegistryCoordinator
              captures: { sub_id: $.data.id, sub_registry: $.data.registry_name }
          trigger:
            - call: "POST /cath-lab/registry-submissions/${sub_id}/submit"
              as: RegistryCoordinator
              captures: { sub_status1: $.data.status, sub_pct: $.data.completeness_pct }
            - call: "POST /cath-lab/registry-submissions/${sub_id}/record-decision"
              payload: { outcome: REJECTED, rejection_reason: "missing lesion segment" }
              as: RegistryCoordinator
              captures: { sub_status2: $.data.status }
            - call: "POST /cath-lab/registry-submissions/${sub_id}/revise"
              payload: { correction_note: "added lesion segment" }
              as: RegistryCoordinator
              captures: { sub_status3: $.data.status, sub_submitted3: $.data.submitted_at }
            - call: "POST /cath-lab/registry-submissions/${sub_id}/submit"
              as: RegistryCoordinator
              captures: { sub_status4: $.data.status }
          assert:
            - "First submit: status == SUBMITTED, completeness_pct == 100.0"
            - "record-decision REJECTED: status == REJECTED, rejection_reason stored"
            - "revise: status == DRAFT and submitted_at == null and decided_at == null (cycle back)"
            - "Second submit: status == SUBMITTED (cycle DRAFT -> SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED completed)"
            - "RegistrySubmission.${sub_id}.registry_name == NCDR_CATHPCI (PCI procedure_type)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (STEMI bump depth-3 vs completion depth-2, different triggers)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: stemi_bump_cascade_releases_bed_staff_devices
        grounds:
          - state_machines.CathCase.SCHEDULED_to_BUMPED
          - state_machines.RecoveryBed.RESERVED_to_AVAILABLE
          - state_machines.DeviceUsage.RESERVED_to_RELEASED
          - state_machines.StaffAssignment.ASSIGNED_to_RELEASED
          - calculations.device_lot_status
        distinguishing_aspect: |
          Depth-3 chain from the STEMI-activation trigger: STEMI create ->
          victim case SCHEDULED -> BUMPED (link 1) -> the victim's RESERVED
          DeviceUsage -> RELEASED (link 2, caused by the bump, not by the
          STEMI create directly) -> DeviceLot.allocated_units recomputed and
          DeviceLot.status flips DEPLETED -> ACTIVE (link 3, caused by the
          usage release). Parallel links also free the bed and staff.
        test_recipe:
          setup:
            - "Room R only; beds B1, B2 AVAILABLE; lot L qty 2 threshold 1 (ACTIVE)"
            - "ELECTIVE PCI case E AUC-documented, SCHEDULED on R 09:00-10:30 holding B1, staffed with tech T (SCRUB), and holding a RESERVED usage of 2 units of L (L available 0 => DEPLETED)"
            - "STEMI activation for window 09:30 bumps E"
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Order", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys2_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Tech One", staff_role: SCRUB_TECHNOLOGIST }
              as: CathLabScheduler
              captures: { tech1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 2" }
              as: RecoveryNurseManager
              captures: { bed2_id: $.data.id }
            - call: "POST /cath-lab/device-lots"
              payload: { device_type: STENT_DES, manufacturer: "Acme", model_number: "DS-100", lot_number: "LOT-A", ownership: OWNED, quantity_on_hand: 2, reorder_threshold: 1, expiration_date: "2027-01-01T00:00:00Z" }
              as: CathLabTechnologist
              captures: { lot_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-E", procedure_type: PCI, priority: ELECTIVE, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_e_id: $.data.id, case_e_v: $.data.version }
            - call: "POST /cath-lab/cases/${case_e_id}/auc-attestation"
              payload: { ordering_physician_id: "${phys2_id}", auc_score: MAY_BE_APPROPRIATE, criterion_code: "AUC-45.2", expected_case_version: "${case_e_v}" }
              as: InterventionalCardiologist
              as_user_id: "${phys2_id}"
            - call: "POST /cath-lab/cases/${case_e_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_e_id}/staff-assignments"
              payload: { staff_id: "${tech1_id}", role_in_case: SCRUB }
              as: CathLabScheduler
              captures: { asg_id: $.data.id }
            - call: "POST /cath-lab/cases/${case_e_id}/device-usages"
              payload: { lot_id: "${lot_id}", quantity: 2 }
              as: CathLabTechnologist
              captures: { usage_id: $.data.id }
            - call: "GET /cath-lab/device-lots/${lot_id}"
              as: CathLabTechnologist
              captures: { lot_status_pre: $.data.status }
          trigger:
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-S", procedure_type: STEMI_PCI, priority: STEMI, performing_physician_id: "${phys1_id}", weight_kg: 80, serum_creatinine: 1.1, scheduled_start: "2026-08-10T09:30:00Z" }
              as: CathLabScheduler
              captures: { case_s_id: $.data.id, case_s_lab: $.data.lab_id }
            - call: "GET /cath-lab/cases/${case_e_id}"
              as: CathLabScheduler
              captures: { e_status: $.data.status, e_bumps: $.data.bump_count }
            - call: "GET /cath-lab/recovery-beds/${bed1_id}"
              as: RecoveryNurseManager
              captures: { bed1_status: $.data.status, bed1_case: $.data.held_case_id }
            - call: "GET /cath-lab/staff/${tech1_id}/assignments"
              as: CathLabScheduler
              captures: { asg_status: "$.data[0].status" }
            - call: "GET /cath-lab/device-lots/${lot_id}/usages"
              as: CathLabTechnologist
              captures: { usage_status: "$.data[0].status" }
            - call: "GET /cath-lab/device-lots/${lot_id}"
              as: CathLabTechnologist
              captures: { lot_alloc: $.data.allocated_units, lot_status: $.data.status, lot_avail: $.data.available_units }
          assert:
            - "Pre-STEMI: DeviceLot.${lot_id}.status == DEPLETED (available 2-2 == 0)"
            - "CathCase.${case_e_id}.status == BUMPED, bump_count == 1 (link 1)"
            - "RecoveryBed.${bed1_id}.held_case_id == ${case_s_id} and window_start == 2026-08-10T10:45:00Z and window_end == 2026-08-10T12:15:00Z (link 2b: bump freed B1; the STEMI bed_selector then re-reserved the earliest-created AVAILABLE bed with the STEMI window 09:30+75 => [10:45, 12:15))"
            - "StaffAssignment.${asg_id}.status == RELEASED (link 2a)"
            - "DeviceUsage.${usage_id}.status == RELEASED (link 2c)"
            - "DeviceLot.${lot_id}.allocated_units == 0 and available_units == 2 and status == ACTIVE (link 3: recompute caused by the usage release)"
            - "CathCase.${case_s_id}.status == SCHEDULED on lab ${room1_id}"

      - name: completion_cascade_releases_reservation_and_restores_lot_status
        grounds:
          - state_machines.CathCase.IN_PROGRESS_to_COMPLETED
          - state_machines.DeviceUsage.RESERVED_to_RELEASED
          - calculations.device_lot_status
          - state_machines.RecoveryBed.RESERVED_to_OCCUPIED
        distinguishing_aspect: |
          Depth-2+ chain from a different trigger (POST complete, not STEMI
          create): case completion -> still-RESERVED DeviceUsage auto-RELEASED
          (link 1) -> DeviceLot.allocated_units recomputed and status flips
          LOW_STOCK -> ACTIVE (link 2, caused by the release).
        test_recipe:
          setup:
            - "URGENT PCI case C SCHEDULED/staffed/IN_PROGRESS on room R with bed B1"
            - "Lot L qty 4 threshold 3; usage U reserves 3 units for C (available 1 < 3 => LOW_STOCK)"
          setup_api_calls:
            - call: "POST /cath-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: CathLabScheduler
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Tech One", staff_role: SCRUB_TECHNOLOGIST }
              as: CathLabScheduler
              captures: { tech1_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Nurse One", staff_role: CIRCULATING_NURSE }
              as: CathLabScheduler
              captures: { nurse1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/device-lots"
              payload: { device_type: PACEMAKER_LEAD, manufacturer: "Acme", model_number: "PL-7", lot_number: "LOT-L", ownership: CONSIGNMENT, quantity_on_hand: 4, reorder_threshold: 3, expiration_date: "2027-01-01T00:00:00Z" }
              as: CathLabTechnologist
              captures: { lot_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: DEVICE_IMPLANT, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_id: $.data.id }
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/staff-assignments"
              payload: { staff_id: "${tech1_id}", role_in_case: SCRUB }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/staff-assignments"
              payload: { staff_id: "${nurse1_id}", role_in_case: CIRCULATOR }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/start"
              as: InterventionalCardiologist
              as_user_id: "${phys1_id}"
            - call: "POST /cath-lab/cases/${case_id}/device-usages"
              payload: { lot_id: "${lot_id}", quantity: 3 }
              as: CathLabTechnologist
              captures: { usage_id: $.data.id }
            - call: "GET /cath-lab/device-lots/${lot_id}"
              as: CathLabTechnologist
              captures: { lot_status_pre: $.data.status, lot_avail_pre: $.data.available_units }
          trigger:
            - call: "POST /cath-lab/cases/${case_id}/complete"
              as: InterventionalCardiologist
              as_user_id: "${phys1_id}"
            - call: "GET /cath-lab/device-lots/${lot_id}/usages"
              as: CathLabTechnologist
              captures: { usage_status: "$.data[0].status" }
            - call: "GET /cath-lab/device-lots/${lot_id}"
              as: CathLabTechnologist
              captures: { lot_status: $.data.status, lot_alloc: $.data.allocated_units, lot_onhand: $.data.quantity_on_hand }
            - call: "GET /cath-lab/recovery-beds/${bed1_id}"
              as: RecoveryNurseManager
              captures: { bed_status: $.data.status }
          assert:
            - "Pre-completion: DeviceLot.${lot_id}.status == LOW_STOCK (available 4-3 == 1 < threshold 3)"
            - "Post-completion: DeviceUsage.${usage_id}.status == RELEASED (auto-release link 1)"
            - "Post-completion: DeviceLot.${lot_id}.allocated_units == 0, quantity_on_hand == 4 (release does not consume shelf stock), status == ACTIVE (link 2: 4 >= 3)"
            - "RecoveryBed.${bed1_id}.status == OCCUPIED (completion also occupies the bed)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict ((state,business_safety) vs
  # (business_temporal,business_constraint) — different category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: schedule_cancelled_case_with_missing_auc_state_beats_safety
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_CASE_INVALID_STATE]
          - errors[ERR_AUC_REQUIRED]
        distinguishing_aspect: |
          Category pair (state, business_safety): the schedule request fails
          priority-5 state (case CANCELLED) and would also fail priority-6
          safety (ELECTIVE with AUC NOT_DOCUMENTED); the state error
          ERR_CASE_INVALID_STATE must win.
        test_recipe:
          setup:
            - "ELECTIVE case C exists with auc_status == NOT_DOCUMENTED"
            - "C has been cancelled (status CANCELLED)"
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: ELECTIVE, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_id: $.data.id }
            - call: "POST /cath-lab/cases/${case_id}/cancel"
              as: CathLabScheduler
          trigger:
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z" }
              as: CathLabScheduler
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CASE_INVALID_STATE (priority 5 state beats priority 6 business_safety ERR_AUC_REQUIRED)"
            - "CathCase.${case_id}.status remains CANCELLED"

      - name: reserve_expired_lot_with_insufficient_stock_temporal_beats_quota
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_DEVICE_EXPIRED]
          - errors[ERR_INSUFFICIENT_DEVICE_STOCK]
        distinguishing_aspect: |
          Category pair (business_temporal, business_constraint): the reserve
          request fails priority-7 temporal (lot expired) and would also fail
          priority-9 quota (available_units 0 < 1); the temporal error
          ERR_DEVICE_EXPIRED must win — a different category pair than the
          (state, business_safety) instance.
        test_recipe:
          setup:
            - "Lot L qty 1 threshold 0, expiration_date 2026-08-01T00:00:00Z; its single unit is RESERVED (available 0)"
            - "URGENT case C SCHEDULED on room R"
            - "Logical clock at 2026-08-02T00:00:00Z (strictly after expiration_date)"
          setup_api_calls:
            - call: "POST /cath-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CathLabScheduler
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/device-lots"
              payload: { device_type: STENT_BMS, manufacturer: "Acme", model_number: "BS-1", lot_number: "LOT-X", ownership: OWNED, quantity_on_hand: 1, reorder_threshold: 0, expiration_date: "2026-08-01T00:00:00Z" }
              as: CathLabTechnologist
              captures: { lot_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_id: $.data.id }
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/device-usages"
              payload: { lot_id: "${lot_id}", quantity: 1 }
              as: CathLabTechnologist
            - call: "POST /cath-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: CathLabScheduler
          trigger:
            - call: "POST /cath-lab/cases/${case_id}/device-usages"
              payload: { lot_id: "${lot_id}", quantity: 1 }
              as: CathLabTechnologist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DEVICE_EXPIRED (priority 7 business_temporal beats priority 9 quota ERR_INSUFFICIENT_DEVICE_STOCK)"
            - "DeviceLot.${lot_id}.allocated_units remains 1 (no second reservation persisted)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (contrast mL vs device unit count;
  # different metrics on different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: contrast_exactly_at_limit_allowed_above_rejected
        grounds:
          - calculations.contrast_limit_ml
          - calculations.contrast_limit_check
          - errors[ERR_CONTRAST_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Boundary on the contrast-volume metric via POST dose-records:
          projected == contrast_limit_ml (200.0) is ALLOWED (strict > rule);
          projected 200.1 is rejected. Weight 60 kg / creatinine 1.5 pins the
          limit at exactly 200.0 mL.
        test_recipe:
          setup:
            - "URGENT case C (weight_kg 60, serum_creatinine 1.5 => contrast_limit_ml 200.0) is SCHEDULED, staffed, IN_PROGRESS"
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Tech One", staff_role: SCRUB_TECHNOLOGIST }
              as: CathLabScheduler
              captures: { tech1_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Nurse One", staff_role: CIRCULATING_NURSE }
              as: CathLabScheduler
              captures: { nurse1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 60, serum_creatinine: 1.5 }
              as: CathLabScheduler
              captures: { case_id: $.data.id, case_limit: $.data.contrast_limit_ml }
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/staff-assignments"
              payload: { staff_id: "${tech1_id}", role_in_case: SCRUB }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/staff-assignments"
              payload: { staff_id: "${nurse1_id}", role_in_case: CIRCULATOR }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/start"
              as: InterventionalCardiologist
              as_user_id: "${phys1_id}"
          trigger:
            - call: "POST /cath-lab/cases/${case_id}/dose-records"
              payload: { record_type: CONTRAST, contrast_ml: 150 }
              as: CathLabTechnologist
            - call: "POST /cath-lab/cases/${case_id}/dose-records"
              payload: { record_type: CONTRAST, contrast_ml: 50.0 }
              as: CathLabTechnologist
            - call: "POST /cath-lab/cases/${case_id}/dose-records"
              payload: { record_type: CONTRAST, contrast_ml: 0.1 }
              as: CathLabTechnologist
              captures: { err: $.data.error_id }
            - call: "GET /cath-lab/cases/${case_id}"
              as: CathLabTechnologist
              captures: { case_cum: $.data.cumulative_contrast_ml }
          assert:
            - "CathCase.${case_id}.contrast_limit_ml == 200.0 (5.0 * 60 / 1.5, under the 300.0 cap)"
            - "Second record accepted: cumulative_contrast_ml == 200.0 exactly (== limit allowed)"
            - "Third record (0.1 mL) rejected: error_id == ERR_CONTRAST_LIMIT_EXCEEDED (projected 200.1 > 200.0)"
            - "Final cumulative_contrast_ml == 200.0 (rejected record not persisted)"

      - name: device_reserve_exactly_available_succeeds_one_more_fails
        grounds:
          - calculations.device_availability
          - calculations.device_lot_status
          - errors[ERR_INSUFFICIENT_DEVICE_STOCK]
        distinguishing_aspect: |
          Boundary on the integer unit-count metric via POST device-usages
          (different metric and endpoint than the contrast instance):
          quantity == available_units (5 of 5) succeeds (>= rule) and flips
          the lot to DEPLETED; one more unit (1 > 0 available) is rejected.
        test_recipe:
          setup:
            - "Lot L qty 5 threshold 2 (ACTIVE); URGENT case C SCHEDULED on room R with bed B1"
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/device-lots"
              payload: { device_type: STENT_DES, manufacturer: "Acme", model_number: "DS-100", lot_number: "LOT-A", ownership: OWNED, quantity_on_hand: 5, reorder_threshold: 2, expiration_date: "2027-01-01T00:00:00Z" }
              as: CathLabTechnologist
              captures: { lot_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_id: $.data.id }
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
          trigger:
            - call: "POST /cath-lab/cases/${case_id}/device-usages"
              payload: { lot_id: "${lot_id}", quantity: 5 }
              as: CathLabTechnologist
              captures: { usage_id: $.data.id, usage_status: $.data.status }
            - call: "POST /cath-lab/cases/${case_id}/device-usages"
              payload: { lot_id: "${lot_id}", quantity: 1 }
              as: CathLabTechnologist
              captures: { err: $.data.error_id }
            - call: "GET /cath-lab/device-lots/${lot_id}"
              as: CathLabTechnologist
              captures: { lot_status: $.data.status, lot_avail: $.data.available_units }
          assert:
            - "First reserve (5 == available 5) succeeds: DeviceUsage.${usage_id}.status == RESERVED"
            - "Second reserve (1 > available 0) rejected: error_id == ERR_INSUFFICIENT_DEVICE_STOCK"
            - "DeviceLot.${lot_id}.available_units == 0 and status == DEPLETED"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (RegistrySubmission->CathCase vs
  # StaffAssignment->StaffMember — different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: submission_create_requires_case_completed
        grounds:
          - state_machines.RegistrySubmission.DRAFT_to_SUBMITTED
          - validations[priority=5]
          - errors[ERR_CASE_INVALID_STATE]
        distinguishing_aspect: |
          Pair RegistrySubmission -> CathCase: creating the submission is
          gated on the PARENT case's state (COMPLETED). Attempt while the
          case is IN_PROGRESS fails ERR_CASE_INVALID_STATE; after completion
          the same call succeeds with status DRAFT.
        test_recipe:
          setup:
            - "URGENT PCI case C is SCHEDULED, staffed, and IN_PROGRESS (not yet COMPLETED)"
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Tech One", staff_role: SCRUB_TECHNOLOGIST }
              as: CathLabScheduler
              captures: { tech1_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Nurse One", staff_role: CIRCULATING_NURSE }
              as: CathLabScheduler
              captures: { nurse1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_id: $.data.id }
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/staff-assignments"
              payload: { staff_id: "${tech1_id}", role_in_case: SCRUB }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/staff-assignments"
              payload: { staff_id: "${nurse1_id}", role_in_case: CIRCULATOR }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/start"
              as: InterventionalCardiologist
              as_user_id: "${phys1_id}"
          trigger:
            - call: "POST /cath-lab/cases/${case_id}/registry-submissions"
              as: RegistryCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /cath-lab/cases/${case_id}/complete"
              as: InterventionalCardiologist
              as_user_id: "${phys1_id}"
            - call: "POST /cath-lab/cases/${case_id}/registry-submissions"
              as: RegistryCoordinator
              captures: { sub_id: $.data.id, sub_status: $.data.status }
          assert:
            - "While IN_PROGRESS: error_id == ERR_CASE_INVALID_STATE (no submission persisted)"
            - "After complete: submission created with status == DRAFT"
            - "GET /cath-lab/cases/${case_id}/registry-submissions returns exactly 1 submission"

      - name: assignment_requires_staff_active
        grounds:
          - validations[priority=8]
          - errors[ERR_STAFF_INACTIVE]
          - entities.StaffMember.fields.is_active
        distinguishing_aspect: |
          Pair StaffAssignment -> StaffMember (different pair than the
          RegistrySubmission -> CathCase instance): assignment creation is
          gated on the referenced staff member's is_active flag; a
          deactivated technologist cannot be assigned, an active one can.
        test_recipe:
          setup:
            - "URGENT case C SCHEDULED on room R with bed B1"
            - "Technologist T exists and has been deactivated (is_active false, no assignments)"
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Tech One", staff_role: SCRUB_TECHNOLOGIST }
              as: CathLabScheduler
              captures: { tech1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_id: $.data.id }
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
            - call: "PATCH /cath-lab/staff/${tech1_id}"
              payload: { is_active: false }
              as: CathLabScheduler
          trigger:
            - call: "POST /cath-lab/cases/${case_id}/staff-assignments"
              payload: { staff_id: "${tech1_id}", role_in_case: SCRUB }
              as: CathLabScheduler
              captures: { err: $.data.error_id }
            - call: "PATCH /cath-lab/staff/${tech1_id}"
              payload: { is_active: true }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/staff-assignments"
              payload: { staff_id: "${tech1_id}", role_in_case: SCRUB }
              as: CathLabScheduler
              captures: { asg_id: $.data.id, asg_status: $.data.status }
          assert:
            - "While is_active == false: error_id == ERR_STAFF_INACTIVE (no assignment persisted)"
            - "After reactivation: assignment created with status == ASSIGNED"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (room buffer-extended half-open vs
  # staff strict half-open — different interval semantics, different resources)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: room_overlap_turnover_buffer_blocks_but_exact_adjacency_allowed
        grounds:
          - calculations.room_window_conflict
          - errors[ERR_ROOM_WINDOW_CONFLICT]
        distinguishing_aspect: |
          CathLabRoom overlap uses buffer-extended half-open windows
          [start, end + 20): a case starting at 10:40 collides with a
          09:00-10:30 case (10:40 < 10:50 buffered end), but a case starting
          exactly at 10:50 (== end + buffer) is allowed — adjacency is legal
          only AFTER the turnover buffer.
        test_recipe:
          setup:
            - "Room R; beds B1 and B2 AVAILABLE"
            - "URGENT PCI case A (no equipment) SCHEDULED on R 2026-08-10 09:00-10:30 (buffered occupancy until 10:50), holding B1"
            - "URGENT DIAGNOSTIC cases B and C posted"
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 2" }
              as: RecoveryNurseManager
              captures: { bed2_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-A", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_a_id: $.data.id }
            - call: "POST /cath-lab/cases/${case_a_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-B", procedure_type: DIAGNOSTIC_CATHETERIZATION, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_b_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-C", procedure_type: DIAGNOSTIC_CATHETERIZATION, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 65, serum_creatinine: 1.1 }
              as: CathLabScheduler
              captures: { case_c_id: $.data.id }
          trigger:
            - call: "POST /cath-lab/cases/${case_b_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T10:40:00Z", bed_id: "${bed2_id}" }
              as: CathLabScheduler
              captures: { err_b: $.data.error_id }
            - call: "POST /cath-lab/cases/${case_c_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T10:50:00Z", bed_id: "${bed2_id}" }
              as: CathLabScheduler
              captures: { c_status: $.data.status, c_end: $.data.scheduled_end }
          assert:
            - "Case B at 10:40 rejected: error_id == ERR_ROOM_WINDOW_CONFLICT (10:40 < 10:50 buffered end of A)"
            - "Case B remains POSTED"
            - "Case C at exactly 10:50 (== 10:30 + 20 buffer) succeeds: status == SCHEDULED, scheduled_end == 2026-08-10T11:35:00Z (DIAG 45 + 0 setup)"
            - "CathCase.${case_c_id}.lab_id == ${room1_id}"

      - name: staff_overlap_strict_adjacency_allowed_but_true_overlap_blocked
        grounds:
          - calculations.staff_window_conflict
          - errors[ERR_STAFF_WINDOW_CONFLICT]
        distinguishing_aspect: |
          StaffMember overlap uses STRICT half-open windows with NO buffer on
          a different resource than the room instance: adjacency (new_start ==
          committed_end at 10:30) is allowed, but a 1-minute true overlap
          (start 10:29) is rejected — no turnover buffer exists for staff.
        test_recipe:
          setup:
            - "Rooms R1/R2/R3, beds B1/B2/B3; technologist T"
            - "URGENT PCI case A SCHEDULED on R1 09:00-10:30; T assigned SCRUB to A (window [09:00, 10:30))"
            - "URGENT DIAGNOSTIC case D SCHEDULED on R2 starting 10:30 (window [10:30, 11:15))"
            - "URGENT DIAGNOSTIC case E SCHEDULED on R3 starting 10:29 (window [10:29, 11:14))"
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Tech One", staff_role: SCRUB_TECHNOLOGIST }
              as: CathLabScheduler
              captures: { tech1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 2", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room2_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 3", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room3_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 2" }
              as: RecoveryNurseManager
              captures: { bed2_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 3" }
              as: RecoveryNurseManager
              captures: { bed3_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-A", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_a_id: $.data.id }
            - call: "POST /cath-lab/cases/${case_a_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_a_id}/staff-assignments"
              payload: { staff_id: "${tech1_id}", role_in_case: SCRUB }
              as: CathLabScheduler
              captures: { asg_a_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-D", procedure_type: DIAGNOSTIC_CATHETERIZATION, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_d_id: $.data.id }
            - call: "POST /cath-lab/cases/${case_d_id}/schedule"
              payload: { lab_id: "${room2_id}", scheduled_start: "2026-08-10T10:30:00Z", bed_id: "${bed2_id}" }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-E", procedure_type: DIAGNOSTIC_CATHETERIZATION, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_e_id: $.data.id }
            - call: "POST /cath-lab/cases/${case_e_id}/schedule"
              payload: { lab_id: "${room3_id}", scheduled_start: "2026-08-10T10:29:00Z", bed_id: "${bed3_id}" }
              as: CathLabScheduler
          trigger:
            - call: "POST /cath-lab/cases/${case_d_id}/staff-assignments"
              payload: { staff_id: "${tech1_id}", role_in_case: SCRUB }
              as: CathLabScheduler
              captures: { asg_d_id: $.data.id, asg_d_status: $.data.status }
            - call: "POST /cath-lab/cases/${case_e_id}/staff-assignments"
              payload: { staff_id: "${tech1_id}", role_in_case: SCRUB }
              as: CathLabScheduler
              captures: { err_e: $.data.error_id }
          assert:
            - "Adjacency allowed: assigning T to D (start 10:30 == A's end 10:30) succeeds with status ASSIGNED"
            - "True overlap blocked: assigning T to E (start 10:29 < 10:30) fails with error_id == ERR_STAFF_WINDOW_CONFLICT"
            - "GET /cath-lab/staff/${tech1_id}/assignments shows exactly 2 ASSIGNED assignments (A and D)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (device unit accountability vs contrast
  # budget — different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: device_reserve_release_pair_conserves_unit_accountability
        grounds:
          - calculations.device_availability
          - state_machines.DeviceUsage.RESERVED_to_RELEASED
          - entities.DeviceLot.fields.quantity_on_hand
          - entities.DeviceLot.fields.allocated_units
        distinguishing_aspect: |
          Conserved quantity = physical unit accountability
          (quantity_on_hand + allocated_units). A reserve (3) followed by its
          compensating release leaves the sum exactly at its pre-pair value
          (5 + 0 == 5 + 3 - 3 == 5): no drift in either field.
        test_recipe:
          setup:
            - "Lot L qty 5 threshold 2 (ACTIVE); URGENT case C SCHEDULED"
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/device-lots"
              payload: { device_type: ICD_LEAD, manufacturer: "Acme", model_number: "IL-9", lot_number: "LOT-I", ownership: CONSIGNMENT, quantity_on_hand: 5, reorder_threshold: 2, expiration_date: "2027-01-01T00:00:00Z" }
              as: CathLabTechnologist
              captures: { lot_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: DEVICE_IMPLANT, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_id: $.data.id }
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
          trigger:
            - call: "POST /cath-lab/cases/${case_id}/device-usages"
              payload: { lot_id: "${lot_id}", quantity: 3 }
              as: CathLabTechnologist
              captures: { usage_id: $.data.id }
            - call: "GET /cath-lab/device-lots/${lot_id}"
              as: CathLabTechnologist
              captures: { onhand_mid: $.data.quantity_on_hand, alloc_mid: $.data.allocated_units }
            - call: "POST /cath-lab/device-usages/${usage_id}/release"
              as: CathLabTechnologist
            - call: "GET /cath-lab/device-lots/${lot_id}"
              as: CathLabTechnologist
              captures: { onhand_post: $.data.quantity_on_hand, alloc_post: $.data.allocated_units, status_post: $.data.status }
          assert:
            - "After reserve: quantity_on_hand == 5 and allocated_units == 3 (sum 5 conserved — reservation does not touch shelf stock)"
            - "After compensating release: quantity_on_hand == 5 and allocated_units == 0 (sum 5 == pre-pair value, zero drift)"
            - "DeviceLot.${lot_id}.status == ACTIVE (5 >= threshold 2)"
            - "DeviceUsage.${usage_id}.status == RELEASED"

      - name: dose_add_void_pair_conserves_contrast_budget
        grounds:
          - calculations.contrast_limit_check
          - state_machines.DoseRecord.ACTIVE_to_VOIDED
          - entities.CathCase.fields.cumulative_contrast_ml
          - entities.CathCase.fields.contrast_limit_ml
        distinguishing_aspect: |
          Conserved quantity = the case's contrast budget
          (cumulative_contrast_ml + remaining allowance == contrast_limit_ml,
          a volume budget — distinct from the device unit-count invariant).
          Add CONTRAST 70 then void that record: cumulative returns exactly
          to 0.0 and contrast_limit_ml is unchanged (200.0).
        test_recipe:
          setup:
            - "URGENT case C (weight 60, creatinine 1.5 => limit 200.0) SCHEDULED, staffed, IN_PROGRESS"
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Tech One", staff_role: SCRUB_TECHNOLOGIST }
              as: CathLabScheduler
              captures: { tech1_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Nurse One", staff_role: CIRCULATING_NURSE }
              as: CathLabScheduler
              captures: { nurse1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 60, serum_creatinine: 1.5 }
              as: CathLabScheduler
              captures: { case_id: $.data.id }
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/staff-assignments"
              payload: { staff_id: "${tech1_id}", role_in_case: SCRUB }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/staff-assignments"
              payload: { staff_id: "${nurse1_id}", role_in_case: CIRCULATOR }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/start"
              as: InterventionalCardiologist
              as_user_id: "${phys1_id}"
          trigger:
            - call: "POST /cath-lab/cases/${case_id}/dose-records"
              payload: { record_type: CONTRAST, contrast_ml: 70 }
              as: CathLabTechnologist
              captures: { rec_id: $.data.id }
            - call: "GET /cath-lab/cases/${case_id}"
              as: CathLabTechnologist
              captures: { cum_mid: $.data.cumulative_contrast_ml, limit_mid: $.data.contrast_limit_ml }
            - call: "POST /cath-lab/dose-records/${rec_id}/void"
              as: CathLabTechnologist
            - call: "GET /cath-lab/cases/${case_id}"
              as: CathLabTechnologist
              captures: { cum_post: $.data.cumulative_contrast_ml, limit_post: $.data.contrast_limit_ml }
          assert:
            - "After add: cumulative_contrast_ml == 70.0 (budget consumed: 70.0 + 130.0 remaining == 200.0 limit)"
            - "After compensating void: cumulative_contrast_ml == 0.0 (budget fully restored)"
            - "contrast_limit_ml unchanged across the pair: 200.0 before and after"
            - "DoseRecord.${rec_id}.status == VOIDED"
