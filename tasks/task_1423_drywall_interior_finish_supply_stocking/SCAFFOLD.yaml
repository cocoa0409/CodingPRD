    output: Takeoff
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/supply/takeoffs/{id}"
    description: "Fetch a takeoff"
    roles: [EstimatorUser, Foreman, CreditManager, ContractorAdmin]
    code: 200
    input: []
    output: Takeoff
    side_effects: []

  - method: GET
    path: "/supply/takeoffs"
    description: "List takeoffs (filterable by project / status)"
    roles: [EstimatorUser, Foreman, CreditManager, ContractorAdmin]
    code: 200
    input: ["limit?", "offset?", "project_id?", "status?"]
    output: "Takeoff[]"
    side_effects: []

  - method: POST
    path: "/supply/takeoffs/{id}/lines"
    description: "Add a line to a DRAFT takeoff"
    roles: [EstimatorUser]
    code: 201
    input: [product_id, sheet_count]
    output: TakeoffLine
    side_effects: []

  - method: GET
    path: "/supply/takeoff-lines"
    description: "List takeoff lines (filterable by takeoff / product)"
    roles: [EstimatorUser, Foreman, CreditManager, ContractorAdmin]
    code: 200
    input: ["limit?", "offset?", "takeoff_id?", "product_id?", "line_status?"]
    output: "TakeoffLine[]"
    side_effects: []

  - method: GET
    path: "/supply/takeoff-lines/{id}"
    description: "Fetch a single takeoff line"
    roles: [EstimatorUser, Foreman, CreditManager, ContractorAdmin]
    code: 200
    input: []
    output: TakeoffLine
    side_effects: []

  - method: DELETE
    path: "/supply/takeoffs/{id}/lines/{line_id}"
    description: "Soft-cancel a takeoff line (only while takeoff is DRAFT)"
    roles: [EstimatorUser]
    code: 200
    input: []
    output: TakeoffLine
    side_effects: ["line_status=CANCELLED"]

  - method: POST
    path: "/supply/takeoffs/{id}/submit"
    description: "Submit a DRAFT takeoff (computes provisional pricing)"
    roles: [EstimatorUser]
    code: 200
    input: []
    output: Takeoff
    side_effects: ["compute quoted_subtotal_cents, base_sheet_count, billable_sheet_count"]

  - method: POST
    path: "/supply/takeoffs/{id}/lock"
    description: "Lock a SUBMITTED takeoff (computes final pricing); OCC via expected_takeoff_version"
    roles: [EstimatorUser]
    code: 200
    input: [expected_takeoff_version]
    output: Takeoff
    side_effects: ["compute final_subtotal_cents and final_line_cents", "increments Takeoff.version by 1"]

  - method: POST
    path: "/supply/takeoffs/{id}/cancel"
    description: "Cancel a takeoff"
    roles: [EstimatorUser]
    code: 200
    input: []
    output: Takeoff
    side_effects: []

  # --- StockingOrder ---
  - method: POST
    path: "/supply/stocking-orders"
    description: "Create a DRAFT stocking order against a LOCKED takeoff"
    roles: [DispatcherUser]
    code: 201
    input: [project_id, takeoff_id, scheduled_date, shift_window, boom_truck_id]
    output: StockingOrder
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/supply/stocking-orders/{id}"
    description: "Fetch a stocking order"
    roles: [DispatcherUser, Foreman, CreditManager, WarehouseManager, AccountsReceivableUser]
    code: 200
    input: []
    output: StockingOrder
    side_effects: []

  - method: GET
    path: "/supply/stocking-orders"
    description: "List stocking orders (filterable by project / truck / date / takeoff)"
    roles: [DispatcherUser, Foreman, CreditManager, WarehouseManager, AccountsReceivableUser]
    code: 200
    input: ["limit?", "offset?", "project_id?", "boom_truck_id?", "scheduled_date?", "status?", "takeoff_id?"]
    output: "StockingOrder[]"
    side_effects: []

  - method: GET
    path: "/supply/stocking-drops"
    description: "List stocking drops (filterable by product / order)"
    roles: [DispatcherUser, Foreman, WarehouseManager]
    code: 200
    input: ["limit?", "offset?", "stocking_order_id?", "product_id?"]
    output: "StockingDrop[]"
    side_effects: []

  - method: GET
    path: "/supply/stocking-drops/{id}"
    description: "Fetch a single stocking drop"
    roles: [DispatcherUser, Foreman, WarehouseManager]
    code: 200
    input: []
    output: StockingDrop
    side_effects: []

  - method: POST
    path: "/supply/stocking-orders/{id}/drops"
    description: "Add a room-level drop to a DRAFT stocking order"
    roles: [DispatcherUser]
    code: 201
    input: [floor_label, room_label, product_id, bundle_count]
    output: StockingDrop
    side_effects: ["compute sheet_weight_lbs"]

  - method: GET
    path: "/supply/stocking-orders/{id}/drops"
    description: "List drops on an order"
    roles: [DispatcherUser, Foreman, WarehouseManager]
    code: 200
    input: []
    output: "StockingDrop[]"
    side_effects: []

  - method: POST
    path: "/supply/stocking-orders/{id}/schedule"
    description: "Move DRAFT → SCHEDULED; reserves boom-truck slot; computes provisional freight"
    roles: [DispatcherUser]
    code: 200
    input: []
    output: StockingOrder
    side_effects: ["compute freight_charge_cents (provisional)", "reserve (truck, date, shift)"]

  - method: POST
    path: "/supply/stocking-orders/{id}/dispatch"
    description: "Move SCHEDULED → DISPATCHED on the scheduled_date"
    roles: [DispatcherUser]
    code: 200
    input: []
    output: StockingOrder
    side_effects: ["recompute freight_charge_cents (final, with fuel surcharge)"]

  - method: POST
    path: "/supply/stocking-orders/{id}/mark-stocked"
    description: "Move DISPATCHED → STOCKED; auto-issues DrawRequest"
    roles: [Foreman]
    code: 200
    input: []
    output: StockingOrder
    side_effects: ["auto-create DrawRequest (ISSUED)", "Account.ar_outstanding_cents += requested_cents", "if ar > credit_limit → Account → SUSPENDED"]

  - method: POST
    path: "/supply/stocking-orders/{id}/cancel"
    description: "Cancel a DRAFT or SCHEDULED order (releases reservation)"
    roles: [DispatcherUser]
    code: 200
    input: []
    output: StockingOrder
    side_effects: ["release truck reservation if any"]

  # --- DrawRequest / Payment ---
  - method: GET
    path: "/supply/draw-requests/{id}"
    description: "Fetch a draw request"
    roles: [CreditManager, AccountsReceivableUser, EstimatorUser]
    code: 200
    input: []
    output: DrawRequest
    side_effects: []

  - method: GET
    path: "/supply/draw-requests"
    description: "List draw requests (filterable by project / status / order)"
    roles: [CreditManager, AccountsReceivableUser, EstimatorUser]
    code: 200
    input: ["limit?", "offset?", "project_id?", "status?", "stocking_order_id?"]
    output: "DrawRequest[]"
    side_effects: []

  - method: POST
    path: "/supply/draw-requests/{id}/payments"
    description: "Apply a payment to a draw (full or partial)"
    roles: [AccountsReceivableUser]
    code: 201
    input: [amount_cents, method, received_at]
    output: Payment
    side_effects: ["DrawRequest.paid_cents += amount_cents", "DrawRequest.status may advance", "Account.ar_outstanding_cents -= amount_cents"]

  - method: GET
    path: "/supply/draw-requests/{id}/payments"
    description: "List payments applied to a draw"
    roles: [CreditManager, AccountsReceivableUser]
    code: 200
    input: []
    output: "Payment[]"
    side_effects: []

  - method: POST
    path: "/supply/draw-requests/{id}/void"
    description: "Void an unpaid draw"
    roles: [CreditManager]
    code: 200
    input: []
    output: DrawRequest
    side_effects: ["Account.ar_outstanding_cents -= requested_cents"]

  # --- BundleReturn ---
  - method: POST
