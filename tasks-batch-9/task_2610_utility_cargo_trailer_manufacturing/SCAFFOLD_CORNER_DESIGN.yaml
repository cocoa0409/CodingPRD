          - endpoints[GET /trailer-units/{id}/option-installs]
          - endpoints[GET /trailer-units/{id}/jig-reservations]
          - endpoints[GET /trailer-units/{id}/certification-label]
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          The topology is flat, so these sub-resource GETs are reverse-lookup read channels only: each one
          filters by the parent unit_id and each applies its OWN default visibility rule - option installs hide
          REMOVED lines unless asked, reservations expose every status including RELEASED, and labels hide
          VOIDED ones. The removed option must be absent from the default read yet present under
          include_removed, with its money and weight already out of the unit's aggregates.
        test_recipe:
          setup:
            - "Unit SN-000101 LABELED with one PENDING CABINET_PACKAGE line (2 x 45 lb) and one REMOVED REAR_RAMP_GATE line."
            - "The unit has one CONSUMED jig reservation and one ISSUED certification label."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantEngineer
              as_user_id: "pe-1"
            - call: "POST /trailer-models"
              payload: { model_code: "TA-7X14", description: "Tandem 7x14 cargo", axle_count: 2, axle_rating_lbs: 3500, design_braked_axle_count: 1, tire_load_rating_lbs: 1820, frame_design_code: "TA", frame_design_rated_lbs: 7200, coupler_rating_lbs: 7500, overall_width_in: 78.5, nominal_length_mm: 4267, nominal_width_mm: 2134, base_curb_weight_lbs: 1980, base_dealer_price_cents: 489900 }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { model_id: $.data.id }
            - call: "POST /trailer-models/${model_id}/certification-submission"
              payload: { engineering_note: "initial GVWR package" }
              as: PlantEngineer
              as_user_id: "pe-1"
            - call: "POST /trailer-models/${model_id}/certification-decision"
              payload: { decision: "CERTIFIED", decision_note: "capacities verified" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /weld-jigs"
              payload: { jig_code: "JIG-TA-01", frame_design_code: "TA", changeover_buffer_min: 45 }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { jig_id: $.data.id, jig_v0: $.data.version }
            - call: "POST /test-lanes"
              payload: { lane_code: "LANE-01", surface_type: "ASPHALT", max_concurrent_tests: 2 }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { lane_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "DLR-001", name: "Prairie Trailer Sales", labor_rate_cents_per_hour: 9500, floor_plan_limit_cents: 200000000, allocation_quota_per_month: 5 }
              as: SalesAdmin
              as_user_id: "sa-1"
              captures: { dealer_id: $.data.id, dealer_v0: $.data.version }
            - call: "POST /trailer-units"
              payload: { serial_number: "SN-000101", model_id: "${model_id}", planned_start_date: "2026-08-03T07:00:00Z" }
              as: WeldSupervisor
              as_user_id: "ws-1"
              captures: { unit_id: $.data.id }
            - call: "POST /weld-jigs/${jig_id}/jig-reservations"
              payload: { unit_id: "${unit_id}", window_start_at: "2026-08-03T09:00:00Z", window_end_at: "2026-08-03T11:00:00Z", expected_weld_jig_version: "${jig_v0}" }
              as: WeldSupervisor
              as_user_id: "ws-1"
            - call: "POST /trailer-units/${unit_id}/frame-inspections"
              payload: { measured_length_mm: 4267, measured_width_mm: 2134, diagonal_a_mm: 4770, diagonal_b_mm: 4770, critical_weld_defect_count: 0, non_critical_weld_defect_count: 0 }
              as: WeldSupervisor
              as_user_id: "ws-1"
            - call: "POST /trailer-units/${unit_id}/systems-install"
              payload: { stage: "LIGHTING", stop_tail_turn_lamp_count: 2, clearance_lamp_count: 0, side_marker_lamp_count: 2, license_plate_lamp_count: 1, reflex_reflector_count: 4 }
              as: AssemblyTech
              as_user_id: "at-1"
            - call: "POST /trailer-units/${unit_id}/systems-install"
              payload: { stage: "BRAKE_AND_AXLE", installed_braked_axle_count: 1, breakaway_kit_installed: true }
              as: AssemblyTech
              as_user_id: "at-1"
            - call: "POST /trailer-units/${unit_id}/road-tests"
              payload: { lane_id: "${lane_id}", window_start_at: "2026-08-04T10:00:00Z", window_end_at: "2026-08-04T11:00:00Z", protocol_code: "STANDARD_20MI" }
              as: QualityInspector
              as_user_id: "qi-1"
              captures: { road_test_id: $.data.id }
            - call: "POST /road-tests/${road_test_id}/result"
              payload: { brake_stop_distance_ft: 32.5, lighting_check_passed: true, result_notes: "within spec" }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /trailer-units/${unit_id}/option-installs"
              payload: { option_code: "CABINET_PACKAGE", quantity: 2, unit_weight_lbs: 45, unit_price_cents: 34500, labor_hours: 2.0 }
              as: AssemblyTech
              as_user_id: "at-1"
              captures: { opt_a_id: $.data.id }
            - call: "POST /trailer-units/${unit_id}/option-installs"
              payload: { option_code: "REAR_RAMP_GATE", quantity: 1, unit_weight_lbs: 210, unit_price_cents: 89900, labor_hours: 1.5 }
              as: AssemblyTech
              as_user_id: "at-1"
              captures: { opt_b_id: $.data.id }
            - call: "DELETE /option-installs/${opt_b_id}"
              payload: { removal_reason: "dealer dropped the ramp gate" }
              as: AssemblyTech
              as_user_id: "at-1"
            - call: "POST /trailer-units/${unit_id}/certification-label"
              payload: { tire_size_code: "ST205/75R15" }
              as: CertificationOfficer
              as_user_id: "co-2"
              captures: { label_id: $.data.id }
          trigger:
            - call: "GET /trailer-units/${unit_id}/option-installs"
              payload: {}
              as: AssemblyTech
              as_user_id: "at-1"
            - call: "GET /trailer-units/${unit_id}/option-installs"
              payload: { include_removed: true }
              as: AssemblyTech
              as_user_id: "at-1"
            - call: "GET /trailer-units/${unit_id}/jig-reservations"
              payload: {}
              as: WeldSupervisor
              as_user_id: "ws-1"
            - call: "GET /trailer-units/${unit_id}/certification-label"
              payload: {}
              as: SalesAdmin
              as_user_id: "sa-1"
          assert:
            - "The default option-installs read returns exactly 1 row, ${opt_a_id}, status PENDING"
            - "The include_removed read returns exactly 2 rows and contains ${opt_b_id} with status REMOVED"
            - "OptionInstall.${opt_b_id}.total_weight_lbs == 210 and total_price_cents == 89900  # retained on the row"
            - "The jig-reservations read returns exactly 1 row with status CONSUMED and duration_minutes 120"
            - "The certification-label read returns exactly 1 row with status ISSUED and vin 5XYTA2EA0TP000001"
            - "TrailerUnit.${unit_id}.curb_weight_lbs == 2070 and payload_capacity_lbs == 4230  # ramp gate excluded"
            - "TrailerUnit.${unit_id}.build_status == LABELED and released_to_stock_at is null"
