      - name: scoring_run_with_an_earlier_snapshot_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority 14]
          - errors.ERR_SCORING_RUN_SNAPSHOT_REGRESSION
          - endpoints[POST /scoring-runs]
        distinguishing_aspect: |
          The guard is "not earlier than", not "strictly later": rewinding the clock one day makes the
          next run a 409, while re-running at exactly the previous snapshot_utc is accepted and yields
          a second ScoringRun row with the identical snapshot_utc.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; carrier c1 (MEDIUM) with no reports."
            - "One completed ScoringRun run1 with snapshot_utc 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /carriers"
              payload: { dot_number: "1000001", legal_name: "Buckeye Freight LLC", average_power_units: 20, annual_vmt: 1600000 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { c1_id: $.data.id }
            - call: "POST /scoring-runs"
              payload: { note: "Baseline run." }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { run1_id: $.data.id, run1_snapshot: $.data.snapshot_utc }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-31T00:00:00Z" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { rewound: $.data.current_utc, previous: $.data.previous_utc }
            - call: "POST /scoring-runs"
              payload: { note: "Run attempted with a rewound clock." }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { e1: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { restored: $.data.current_utc }
            - call: "POST /scoring-runs"
              payload: { note: "Re-run at the same snapshot." }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { run2_id: $.data.id, run2_snapshot: $.data.snapshot_utc }
          assert:
            - "after trigger[0]: current_utc == 2026-07-31T00:00:00Z and previous_utc == 2026-08-01T00:00:00Z"
            - "trigger[1] -> 409 ERR_SCORING_RUN_SNAPSHOT_REGRESSION"
            - "trigger[3] -> 201; ScoringRun.${run2_id}.snapshot_utc == 2026-08-01T00:00:00Z"
            - "after trigger[3]: ScoringRun.${run1_id}.snapshot_utc == 2026-08-01T00:00:00Z"
            - "after trigger[3]: ScoringRun.${run2_id}.carriers_scored == 1"
            - "after trigger[3]: ScoringRun.${run2_id}.scores_updated == 0"
            - "after trigger[3]: ScoringRun.${run2_id}.challenges_expired == 0"
            - "after trigger[3]: ScoringRun.${run2_id}.coaching_marked_overdue == 0"
            - "after trigger[3]: ScoringRun.${run2_id}.coaching_waived == 0"

      - name: state_gate_outranks_the_filing_window_on_a_withdrawn_challenge
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / state_beats_filing_window_on_withdrawn_challenge_submit"
          rationale: |
            That instance already violates the priority-8 state gate and the priority-12 filing window
            in one call and pins ERR_INVALID_CHALLENGE_STATE as the returned error.

      - name: filing_window_outranks_the_quota_ledger
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / filing_window_beats_quota_on_expired_report_submit"
          rationale: |
            The pair (priority 12 filing window vs priority 34 quota) is exercised there with the quota
            already exhausted, asserting ERR_CHALLENGE_FILING_WINDOW_CLOSED and an unchanged
            challenge_quota_used.

      - name: carrier_scope_outranks_the_challenge_state_gate
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / carrier_scope_beats_state_on_foreign_challenge_submit"
          rationale: |
            The priority-6 scope check versus the priority-8 state check is decided there on a foreign
            carrier's already-resolved challenge, asserting the 403 ERR_CARRIER_SCOPE_VIOLATION.

  - section: endpoints
