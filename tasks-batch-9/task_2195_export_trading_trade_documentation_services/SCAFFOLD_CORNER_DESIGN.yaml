              payload: {}
            - call: "GET /export-control-screenings"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { export_order_id: "${order_id}", limit: 10, offset: 0 }
              captures: { screening_id: "$.data[0].id" }
          trigger:
            - call: "POST /export-control-screenings/${screening_id}/decision"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { license_determination: "NLR", eccn: "3A001", denied_party_hits: 2, notes: "Two denied-party name matches on the consignee" }
          assert:
            - "HTTP 200; data.status == \"BLOCKED\"; data.denied_party_hits == 2; data.cleared_at is null"
            - "GET /export-orders/${order_id} reports fulfillment_status == \"COMPLIANCE_BLOCKED\""
            - "POST /freight-bookings for this order is impossible from COMPLIANCE_BLOCKED: the COMPLIANCE_CLEARED -> BOOKED transition is the only booking entry point"

      - name: corner_clear_with_license_defers_value_charge_until_booking
        claim_type: side_effect_execution
        grounds:
          - state_machines.ExportControlScreening.status.transitions.PENDING_LICENSE_to_CLEARED
          - calculations.license_value_consumption
          - endpoints.POST /export-control-screenings/{screening_id}/licenses
          - endpoints.POST /export-control-screenings/{screening_id}/clear-with-license
        distinguishing_aspect: "Clearing with a licence links export_license_id and clears the order, but the licence ledger is NOT charged yet: consumed_value_usd stays 0.00 and remaining_value_usd stays at the full 50000.00 until a FreightBooking exists (charge_on_booking variant)."
