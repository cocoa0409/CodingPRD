            - "Buyer.${k_buyer_id}.open_claims_count == 1 and status == ACTIVE (threshold 3 not reached)"

      - name: hedge_offset_from_entered_returns_not_confirmed
        claim_type: Precondition Enforcement
        grounds: [state_machines.BoardCrushPosition.CONFIRMED_to_OFFSET, errors.ERR_POSITION_NOT_CONFIRMED]
        distinguishing_aspect: "Offset requires CONFIRMED: calling it on an ENTERED position fails 409 ERR_POSITION_NOT_CONFIRMED; the position stays ENTERED."
