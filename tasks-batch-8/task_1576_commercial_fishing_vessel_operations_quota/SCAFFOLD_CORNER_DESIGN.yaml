      - name: expense_verify_twice_rejected
        claim_type: idempotency
        grounds:
          - state_machines.ExpenseRecord.PENDING_to_VERIFIED
          - errors[ERR_EXPENSE_NOT_PENDING]
        distinguishing_aspect: "Verify is not idempotent: the second verify on a VERIFIED expense is an error, so double-verification cannot double-count."
        test_recipe:
          setup: ["DEPARTED trip with one expense already VERIFIED"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-Z16", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
            - { call: "POST /fishing-trips/${t1}/depart", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/expenses", payload: { category: "FUEL", amount_cents: 120000, incurred_at: "2026-08-10T08:00:00Z" }, as: Captain, as_user_id: "${v1}", captures: { e1: $.data.id } }
            - { call: "POST /expenses/${e1}/verify", as: SettlementClerk }
          trigger:
            - { call: "POST /expenses/${e1}/verify", as: SettlementClerk, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_EXPENSE_NOT_PENDING (http 409); expense stays VERIFIED, counted once"

      - name: appeal_open_violation_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.ComplianceViolation.ADJUDICATED_to_APPEALED
          - errors[ERR_VIOLATION_NOT_ADJUDICATED]
        distinguishing_aspect: "Only an ADJUDICATED violation can be appealed; an OPEN one has nothing to appeal."
        test_recipe:
          setup: ["one OPEN violation"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-Z19", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /violations", payload: { vessel_id: "${v1}", violation_type: "MANUAL_CITATION", details: "logbook" }, as: FisheriesRegulator, captures: { n1: $.data.id } }
          trigger:
            - { call: "POST /violations/${n1}/appeal", as: VesselOwner, as_user_id: "${v1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VIOLATION_NOT_ADJUDICATED (http 409)"

      - name: reverse_unappealed_violation_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.ComplianceViolation.APPEALED_to_REVERSED
          - errors[ERR_VIOLATION_NOT_APPEALED]
        distinguishing_aspect: "Reverse requires APPEALED; reversing straight from ADJUDICATED skips the appeal step and is rejected."
        test_recipe:
          setup: ["one ADJUDICATED violation"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-Z20", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /violations", payload: { vessel_id: "${v1}", violation_type: "MANUAL_CITATION", details: "logbook" }, as: FisheriesRegulator, captures: { n1: $.data.id } }
            - { call: "POST /violations/${n1}/adjudicate", as: FisheriesRegulator }
          trigger:
            - { call: "POST /violations/${n1}/reverse", as: FisheriesRegulator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VIOLATION_NOT_APPEALED (http 409); no points refunded"

  # ------------------------------------- calculations: VMS boundary coverage ---
  - section: calculations
    instances:
      - name: vms_gap_detection_boundary
        claim_type: correct_result
        grounds:
          - calculations.vms_gap_detection
          - entities.VMSPing
        distinguishing_aspect: "Gap threshold is strictly greater-than 120 minutes: trip 1 with exact 120-minute gaps produces no violation; trip 2 with one 121-minute gap produces exactly one OPEN VMS_GAP violation referencing the trip."
        test_recipe:
          setup: ["vessel with vms_unit_id VMS-1; two 6h trips on consecutive days"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-KV", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL", vms_unit_id: "VMS-1" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
