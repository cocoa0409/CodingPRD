            - "ExamAuthorization.${auth_hugo}.status == SCHEDULED"
            - "TestCenter.${tc_salem}.seats_committed == 2"
            - "TestCenter.${tc_salem}.seats_available == 0"

      - name: audit_pool_period_end_exact_match_boundary
        grounds:
          - calculations.cpc_audit_sampling
          - validations[priority=38]
          - errors.ERR_AUDIT_POOL_EMPTY
          - errors.ERR_DUPLICATE_AUDIT_CYCLE
          - state_machines.CPCReport.ACCEPTED_to_UNDER_AUDIT
          - concurrency_rules[cpc-report-create-stale-license]
        distinguishing_aspect: |
          The eligibility predicate is probed one day off the report's period_end and then exactly on it,
          which pins `r.period_end == audit.as_of_period_end` as an EQUALITY rather than the plausible
          `period_end <= as_of_period_end` cutoff. It simultaneously pins the empty-pool fallback as
          "persists nothing": the rejected draw reuses the very same audit_cycle_label as the successful
          one, so a partially-written CPCAudit row would resurface as ERR_DUPLICATE_AUDIT_CYCLE on the
          second attempt. The sample size also sits on its floor: ceil(1 * 0.20) is 1 and MIN_SAMPLE_COUNT
          is 1, so the whole pool is drawn.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default."
            - "Engineer 'Dara Voss' holds an ACTIVE licence issued 2026-01-15, so current_period_end is 2028-01-15T00:00:00Z, pdh_requirement is the 30-hour default and version is 1."
            - "Dara filed one CPCReport for 2026-01-15..2028-01-15 declaring self_certified_pdh 30 with no carryover."
            - "Two PDHRecords back it: 28.0 COURSE hours and 2.0 COURSE hours flagged as ethics, so self_certified_total_pdh is 30.0, ethics_pdh is 2.0 and shortfall_pdh is 0.0."
            - "A reviewer has ACCEPTED the report, so it is the only member of any eligible audit pool and its audit_id is still null."
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dara Voss", email: "dara.voss@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_dara: $.data.id }
            - call: "POST /licenses"
              payload: { engineer_id: "${eng_dara}", license_type: "STANDARD", issued_on: "2026-01-15T00:00:00Z" }
              as: BoardLicensingOfficer
              as_user_id: "LIC-1"
              captures: { lic_dara: $.data.id, lic_dara_ver: $.data.version }
            - call: "POST /cpc-reports"
              payload: { license_id: "${lic_dara}", period_start: "2026-01-15T00:00:00Z", period_end: "2028-01-15T00:00:00Z", self_certified_pdh: 30, carryover_pdh_claimed: 0, expected_license_version: "${lic_dara_ver}" }
              as: Licensee
              as_user_id: "${eng_dara}"
              captures: { rep_dara: $.data.id }
            - call: "POST /cpc-reports/${rep_dara}/pdh-records"
              payload: { activity_type: "COURSE", pdh_hours: 28.0, completed_on: "2027-03-10T00:00:00Z", ethics_flag: false }
              as: Licensee
              as_user_id: "${eng_dara}"
              captures: { pdh_d1: $.data.id }
            - call: "POST /cpc-reports/${rep_dara}/pdh-records"
              payload: { activity_type: "COURSE", pdh_hours: 2.0, completed_on: "2027-04-10T00:00:00Z", ethics_flag: true }
              as: Licensee
              as_user_id: "${eng_dara}"
              captures: { pdh_d2: $.data.id }
            - call: "POST /cpc-reports/${rep_dara}/accept"
              payload: {}
              as: BoardReviewer
              as_user_id: "REV-1"
          trigger:
            - call: "POST /cpc-audits"
              payload: { audit_cycle_label: "2028-BIENNIUM-A", sample_pct: 0.20, as_of_period_end: "2028-01-16T00:00:00Z" }
              as: BoardSecretary
              as_user_id: "SEC-9"
            - call: "POST /cpc-audits"
              payload: { audit_cycle_label: "2028-BIENNIUM-A", sample_pct: 0.20, as_of_period_end: "2028-01-15T00:00:00Z" }
              as: BoardSecretary
              as_user_id: "SEC-9"
              captures: { audit_dara: $.data.id }
          assert:
            - "trigger[0] http_status == 409"
            - "trigger[0] response.error_id == \"ERR_AUDIT_POOL_EMPTY\""
            - "trigger[1] http_status == 201"
            - "trigger[1] response.data.pool_size == 1"
            - "trigger[1] response.data.sampled_count == 1"
            - "trigger[1] response.data.status == \"SAMPLED\""
            - "CPCReport.${rep_dara}.self_certified_total_pdh == 30.0"
            - "CPCReport.${rep_dara}.shortfall_pdh == 0.0"
            - "CPCReport.${rep_dara}.status == UNDER_AUDIT"
            - "CPCReport.${rep_dara}.audit_id == ${audit_dara}"
            - "GET /cpc-audits returns total_count == 1"

  - rule_id: cross_entity_state_dependency
