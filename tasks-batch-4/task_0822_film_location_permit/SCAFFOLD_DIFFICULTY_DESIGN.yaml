          assert:
            - "After resubmit the POLICE DepartmentReview cycles REVISION_REQUESTED -> PENDING: DepartmentReview(${rev_pol_id}).status == PENDING"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: issue_cascade_depth3
        grounds:
          - state_machines.PermitApplication.UNDER_REVIEW_to_ISSUED
          - state_machines.RoadClosureBooking.PENDING_to_CONFIRMED
          - state_machines.RoadClosureBooking.PENDING_to_BLOCKED
          - state_machines.OfficerAssignment.PROPOSED_to_CANCELLED
        distinguishing_aspect: "Depth-3 chain triggered by issue: issue -> B1 PENDING->CONFIRMED (hop1) -> competitor B2 PENDING->BLOCKED (hop2) -> B2's application's PROPOSED OfficerAssignment -> CANCELLED (hop3); each link caused by the previous."
        test_recipe:
          setup:
            - "Two companies pc1/pc2, POLICE(ALL) dept, one officer, one segment seg1; clock 2026-05-01."
            - "app1 (pc1) is issue-ready with booking B1 [08:00,12:00) PENDING on seg1 (estimate 82400 paid, review approved, COI verified)."
            - "app2 (pc2) is UNDER_REVIEW with booking B2 [09:00,11:00) PENDING on seg1 (coexists because creation only blocks against CONFIRMED) and a PROPOSED officer assignment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FilmOfficeCoordinator
            - call: "POST /production-companies"
              payload: { legal_name: "PC One", contact_email: "1@x.test", primary_contact: "A" }
              as: FilmOfficeCoordinator
              captures: { pc1_id: $.data.id }
            - call: "POST /production-companies"
              payload: { legal_name: "PC Two", contact_email: "2@x.test", primary_contact: "B" }
              as: FilmOfficeCoordinator
              captures: { pc2_id: $.data.id }
            - call: "POST /departments"
              payload: { code: "POLICE", name: "Police", trigger_condition: "ALL_APPLICATIONS" }
              as: FilmOfficeCoordinator
              captures: { dept_pol_id: $.data.id }
            - call: "POST /officers"
              payload: { full_name: "Ofc Vega", badge_number: "B-9", rank: "OFFICER", hourly_rate_cents: 8000 }
              as: FilmOfficeCoordinator
              captures: { officer_id: $.data.id }
            - call: "POST /street-segments"
              payload: { segment_code: "MAIN-1", name: "Main 1", length_m: 100 }
              as: FilmOfficeCoordinator
              captures: { seg1_id: $.data.id }
            - call: "POST /applications"
              payload: { production_company_id: "${pc1_id}", title: "A1", synopsis: "x", shoot_start_at: "2026-06-01T06:00:00Z", shoot_end_at: "2026-06-01T20:00:00Z", crew_size: 5, requires_road_closure: true }
              as: ProductionCompany
              as_user_id: "${pc1_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /applications/${app1_id}/location-details"
              payload: { address: "1 Main", geo_zone: "Z7", activity_type: "FILMING", requested_start_at: "2026-06-01T06:00:00Z", requested_end_at: "2026-06-01T20:00:00Z", uses_road_closure: true }
              as: ProductionCompany
              as_user_id: "${pc1_id}"
            - call: "GET /applications/${app1_id}"
              as: ProductionCompany
              as_user_id: "${pc1_id}"
              captures: { v1a: $.data.version }
            - call: "POST /applications/${app1_id}/insurance-certificates"
              payload: { policy_number: "POL-A1", coverage_amount_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z", expected_application_version: "${v1a}" }
              as: ProductionCompany
              as_user_id: "${pc1_id}"
              captures: { coi1_id: $.data.id }
            - call: "POST /insurance-certificates/${coi1_id}/verify"
