  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: ale_annual_average_at_exactly_fifty_is_ale
        grounds:
          - calculations.aggregate_fte_month_and_ale_status
          - entities.ControlledGroup.fields.annual_average_fte
          - entities.MonthlyHeadcount.fields.member_fte
          - entities.ControlledGroup.fields.ale_reason
        distinguishing_aspect: |
          Metric annual_average_fte at ALE_THRESHOLD on
          POST /ale-reporting/controlled-groups/{group_id}/ale-determination: 1200 / 120
          rounds to exactly 10.00 giving member_fte 50.00 and annual_average_fte 50, which
          is ALE because the comparison is >=, while 1199 / 120 rounds to 9.99 giving 49.99,
          a floored monthly 49 and DETERMINED_NON_ALE.
        test_recipe:
          setup:
            - "One FilingSeason 2026 OPEN holding two NOT_DETERMINED groups, each with one ACTIVE member."
            - "Group AT_THRESHOLD's member has twelve PRIOR_YEAR months of full_time_employee_count 40 and part_time_hours_total 1200; group BELOW's member has 40 and 1199."
