        distinguishing_aspect: |
          cost_per_passenger_report composes four operations whose order is not commutative — a
          per-item 1.12 overhead round, a per-cabin ROUND_HALF_UP divide, a pax-weighted re-multiply
          and a final ROUND_HALF_UP divide — and on the pinned 7/23/181 fixture the mandated order
          yields 2029 while collapsing it to round_half_up(428008/211) yields 2028.
