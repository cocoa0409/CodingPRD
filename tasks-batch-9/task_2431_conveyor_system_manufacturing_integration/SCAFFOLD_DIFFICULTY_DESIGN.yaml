              payload: { fabrication_lot_id: "${lot_f}", expected_fabrication_lot_version: "${lot_f_v3}", measured_cph: 1300, defect_count: 1 }
              as: ShopSupervisor
              captures: { fat_3: $.data.id }
          assert:
            - "FabricationLot.${lot_f}.fat_target_cph == 1313"
            - "FatTest.${fat_1}.attempt_no == 1 and FatTest.${fat_1}.result == FAIL and FatTest.${fat_1}.target_cph_at_test == 1313"
            - "FatTest.${fat_2}.attempt_no == 2 and FatTest.${fat_2}.result == FAIL"
            - "FatTest.${fat_3}.attempt_no == 3 and FatTest.${fat_3}.result == FAIL"
            - "FabricationLot.${lot_f}.status == SCRAPPED (attempt 3 routes to SCRAPPED, not FAT_FAILED)"
            - "FabricationLot.${lot_f}.fat_attempt_count == 3"
            - "GET /fabrication-lots/${lot_f}/fat-tests returns total_count == 3"

      - name: change_order_revision_cycle_bounded_at_three_rounds
        grounds:
          - state_machines.ChangeOrder.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.ChangeOrder.REVISION_REQUESTED_to_SUBMITTED
          - entities.ChangeOrder.fields.round_no
          - errors[ERR_CHANGE_ORDER_ROUND_LIMIT]
        distinguishing_aspect: |
          The order loops SUBMITTED -> REVISION_REQUESTED -> SUBMITTED twice, incrementing round_no to 3, and
          the third REQUEST_REVISION is refused with ERR_CHANGE_ORDER_ROUND_LIMIT — the loop has a hard
          termination counter rather than the unbounded back-and-forth a linear machine could not express at all.
        test_recipe:
          setup:
            - "One Project with commercial_status CHANGE_PENDING."
            - "One ChangeOrder in SUBMITTED with round_no 1 and scope_delta_cph 0."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-04", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
