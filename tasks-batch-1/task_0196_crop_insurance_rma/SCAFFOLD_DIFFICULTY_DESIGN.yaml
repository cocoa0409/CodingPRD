            - "Unit.${unit_id}.status == REPORTED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: invariant_premium_ledger_subsidy_plus_producer_equals_total
        grounds:
          - calculations.subsidy_split
          - entities.CoverageElection.fields.subsidy_cents
          - entities.CoverageElection.fields.producer_premium_cents
          - entities.CoverageElection.fields.total_premium_cents
        distinguishing_aspect: |
          Conserved quantity #1 = premium dollars: for any election,
          subsidy_cents + producer_premium_cents == total_premium_cents exactly. With RP
          total=527900 and coverage_level 0.75 (subsidy_factor 0.55):
          subsidy_cents=round(527900*0.55)=290345, producer_premium_cents=237555, and
          290345+237555 == 527900 (no rounding drift).
        test_recipe:
          setup:
            - "OPEN program; RP election aph=180 cov=0.75; one 100-ac share=1 unit (total_premium_cents=527900)"
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "Sales Agent", license_number: "SA-17", role_kind: "SELLING" }
              as: RmaAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /producers"
              payload: { name: "Producer P17", tax_id: "TX-17" }
              as: RmaAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /commodity-programs"
              payload: { crop_code: "CORN", county_code: "19153", crop_year: 2026, projected_price: 4.00, base_premium_rate: 0.085, pp_coverage_factor: 0.60, final_planting_date: "2026-05-31T00:00:00Z", acreage_reporting_deadline: "2026-07-15T00:00:00Z" }
              as: RmaAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /commodity-programs/${prog_id}/open"
              payload: {}
              as: RmaAdmin
            - call: "POST /policies"
              payload: { producer_id: "${prod_id}", agent_id: "${sa_id}", crop_year: 2026 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { policy_id: $.data.id }
            - call: "POST /coverage-elections"
              payload: { policy_id: "${policy_id}", commodity_program_id: "${prog_id}", plan_type: "RP", aph_yield: 180, coverage_level: 0.75 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { elec_id: $.data.id }
          trigger:
            - call: "POST /units"
              payload: { coverage_election_id: "${elec_id}", unit_number: "0001-0001", acres: 100, share: 1 }
              as: Agent
              as_user_id: "${sa_id}"
            - call: "GET /coverage-elections/${elec_id}"
              payload: {}
              as: Agent
              as_user_id: "${sa_id}"
              captures: { tot: $.data.total_premium_cents, sub: $.data.subsidy_cents, prod: $.data.producer_premium_cents }
          assert:
            - "CoverageElection.${elec_id}.total_premium_cents == 527900"
            - "CoverageElection.${elec_id}.subsidy_cents == 290345"
            - "CoverageElection.${elec_id}.producer_premium_cents == 237555"
            - "CoverageElection.${elec_id}.subsidy_cents + CoverageElection.${elec_id}.producer_premium_cents == CoverageElection.${elec_id}.total_premium_cents"

      - name: invariant_insured_acres_amend_then_revert_conserved
        grounds:
          - calculations.total_premium
          - entities.Policy.fields.total_insured_acres
          - state_machines.Unit.PENDING_to_REPORTED
          - concurrency_rules[acreage-report-stale-unit]
        distinguishing_aspect: |
          Conserved quantity #2 = insured acres (different kind than premium dollars):
          Policy.total_insured_acres reflects the unit's currently ACCEPTED acreage
          report. Filing report A (planted 100 -> total_insured_acres=100), then filing a
          superseding report B that re-reports the same 100 acres leaves
          total_insured_acres==100 — the forward amend and its replacement leave the
          conserved acre count unchanged (no double-count when one report supersedes).
        test_recipe:
          setup:
