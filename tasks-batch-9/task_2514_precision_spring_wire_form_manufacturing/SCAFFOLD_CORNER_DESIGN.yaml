- section: errors
  instances:
  - name: design_listing_over_the_page_ceiling_returns_invalid_pagination
    claim_type: violation_to_error
    grounds:
    - errors[ERR_INVALID_PAGINATION]
    - validations[priority 5]
    - response_envelope.pagination_defaults
    distinguishing_aspect: 'limit is bounded by [1, 100]: a request for 101 rows is refused outright rather than
      silently clamped to the 100-row ceiling or to the 10-row default.'
    test_recipe:
      setup:
      - One DRAFT design D1 exists on program PGM-1.
      setup_api_calls:
      - call: POST /customer-programs
        payload:
          program_code: PGM-1
          customer_name: Bramble Industrial Supply
          application_class: INDUSTRIAL
          ppap_level: 1
          committed_pieces: 500000
          minimum_order_quantity: 1000
          required_salt_spray_hours: 96
          biocompatibility_required: false
          min_fatigue_margin: 1.2
          required_ppk: 1.0
          amortization_method: FORECAST_BASIS
        as: ProgramManager
        captures:
          prog_id: $.data.id
          prog_v: $.data.version
      - call: POST /material-specs
        payload:
          spec_code: MS-CRSI-1
          wire_material: CHROME_SILICON_A401
          tensile_grade_mpa: 1900
          shear_modulus_gpa: 79.3
          elastic_modulus_gpa: 203.0
          density_kg_per_m3: 7850
          coating: ZINC_PHOSPHATE
          salt_spray_hours: 96
          biocompatible: false
          cost_per_kg_cents: 850
        as: DesignEngineer
        captures:
          ms_id: $.data.id
      - call: POST /spring-designs
        payload:
          program_id: ${prog_id}
          material_spec_id: ${ms_id}
          part_number: D1
          form_type: COMPRESSION
          end_type: CLOSED_GROUND
          wire_diameter_mm: 2.5
          outer_diameter_mm: 20.0
          free_length_mm: 60.0
          active_coils: 8
          max_working_load_n: 150
          min_working_load_n: 50
          cycle_seconds_per_piece: 1.8
          shot_peening_required: true
        as: DesignEngineer
        as_user_id: de-01
        captures:
          d_id: $.data.id
          d_v: $.data.version
      trigger:
      - call: GET /spring-designs
        payload:
          limit: 101
        as: DesignEngineer
        as_user_id: de-01
      assert:
      - HTTP 400
      - data.error_id == 'ERR_INVALID_PAGINATION'
      - response_type == 'error'
      - a repeat with limit 100 answers HTTP 200 with total_count == 1
  - name: design_create_against_an_unknown_program_is_not_found
    claim_type: violation_to_error
    grounds:
    - errors[ERR_PROGRAM_NOT_FOUND]
    - validations[priority 6]
    - entities.SpringDesign.program_id
    distinguishing_aspect: The body-level program_id foreign key is dereferenced on POST /spring-designs, so a
      well-formed design body naming a program that does not exist answers 404 rather than creating an orphan.
    test_recipe:
      setup:
      - Material MS-CRSI-1 exists; no CustomerProgram row carries the id used below.
      setup_api_calls:
      - call: POST /material-specs
        payload:
