          difficulty_instance: tank_occupation_half_open_interval_with_twelve_hour_cip_buffer
          rationale: "The half-open interval and the twelve-hour buffer are asserted to the second there, at 17:59:59Z versus 18:00:00Z."

  # =========================================================================
  - section: endpoints
    instances:
      - name: tank_create_read_and_filtered_list_round_trip
        claim_type: Standard CRUD
        grounds:
          - endpoints.POST_/tanks
          - endpoints.GET_/tanks/{tankId}
          - endpoints.GET_/tanks
        distinguishing_aspect: "The read surface is the only surface: there is no update and no delete endpoint anywhere in the API, so a created tank must be reachable identically by id and by filtered list, and the tank_type filter must exclude the other vessel."
        test_recipe:
          setup:
            - "Brewery ACTIVE. Two tanks are created: FV-01 (FERMENTER, 30.00 bbl) and BT-01 (BRIGHT_TANK, 20.00 bbl)."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /tanks"
              payload: { code: "FV-01", tank_type: "FERMENTER", capacity_bbl: 30.00 }
              as: CellarOperator
              captures: { fv_id: $.data.id }
            - call: "POST /tanks"
              payload: { code: "BT-01", tank_type: "BRIGHT_TANK", capacity_bbl: 20.00 }
              as: BreweryAdmin
              captures: { bt_id: $.data.id }
          trigger:
            - call: "GET /tanks/${fv_id}"
              payload: {}
              as: CellarOperator
            - call: "GET /tanks?tank_type=FERMENTER&limit=10&offset=0"
              payload: {}
              as: TaproomStaff
          assert:
            - "Both calls return 200"
            - "GET by id: data.id == ${fv_id}, data.code == FV-01, data.tank_type == FERMENTER, data.capacity_bbl == 30.00, data.status == IDLE"
            - "Filtered list: total_count == 1, has_more == false, data[0].id == ${fv_id}"
            - "GET /tanks with no filter returns total_count == 2"
            - "The BRIGHT_TANK ${bt_id} is absent from the FERMENTER-filtered page"

      - name: brewery_read_returns_the_derived_ytd_position_and_franchise_locks
        claim_type: Computed read
        grounds:
          - endpoints.GET_/brewery
          - entities.Brewery.fields.taproom_bbl_ytd
          - entities.Brewery.fields.franchise_locked_state_codes
        distinguishing_aspect: "GET /brewery is pure derivation: taproom_bbl_ytd must pick up the FILED return's 0.012 bbl on top of the zero carry-in, distribution_bbl_ytd must stay 0.000, and franchise_locked_state_codes must list exactly the states holding an ACTIVE appointment - ascending, and WA only."
        test_recipe:
          setup:
            - "Brewery ACTIVE with both carry-ins at 0.000."
            - "One 0.5 bbl keg TAPPED in August with three PINT_16OZ pours; the August METERED_POUR return is FILED (taproom_bbl 0.012)."
            - "A WA WHOLESALER_ONLY license holds one ACTIVE ALL_BRANDS appointment; an ID license holds none."
