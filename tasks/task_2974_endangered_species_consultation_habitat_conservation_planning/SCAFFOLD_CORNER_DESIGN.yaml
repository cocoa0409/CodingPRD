      - name: report_due_date_and_lateness_boundary
        claim_type: precision
        grounds:
          - calculations.monitoring_report_lateness_and_take_ledger
          - constants.REPORT_DUE_DAYS
          - entities.MonitoringReport.fields.due_at
          - entities.MonitoringReport.fields.is_late
        distinguishing_aspect: >-
          due_at is period_end + 45 CALENDAR days and is_late uses a STRICT `>`
          on the calendar date, so a report filed exactly on 2027-05-16 is on
          time while one filed on 2027-08-16 against a due_at of 2027-08-15 is
          late by one day. Half-open adjacency also matters here: the second
          period starts exactly where the first ended and must not be rejected as
          an overlap.
        test_recipe:
          setup:
            - "Canonical fixture through permit issuance (term 2026-10-01..2056-10-01, authorized_take_units 4.00, reinitiation_trigger_units 3.60)."
            - "Clock advanced to 2027-05-16T00:00:00Z for the first report, then to 2027-08-16T00:00:00Z for the second; the permit version is re-read between them because the first report moves the take ledger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
