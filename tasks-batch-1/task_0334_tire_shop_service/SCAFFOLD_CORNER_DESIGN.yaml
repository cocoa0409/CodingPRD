      - name: missing_auth_header_returns_unauthenticated
        claim_type: missing_auth
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no recognized X-User-Role header returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["empty DB"]
