        test_recipe:
          setup: ["Offices A, B with SEVERE agreement; zones ZA, ZB; watch submitted (PENDING_COORDINATION) with the request to B still REQUESTED. The acting forecaster is a JOURNEYMAN of office A."]
          setup_api_calls:
