# ============================================================================
# 1.9 Scaffold Corner Design - breadth coverage index for task 2613
#     (oms-anesthesia-permitting). Depth lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
#     this file walks references/claim-extraction-guide.md section by section
#     against SCAFFOLD.yaml's own 1.1-1.7 surface.
# ============================================================================
scaffold_corner_design:

  # ==========================================================================
  - section: entities
    instances:
      - name: practice_creation_returns_every_declared_field
        claim_type: creation
        grounds:
          - entities.Practice
          - endpoints["POST /practices"]
        distinguishing_aspect: "A 201 response must carry all five input fields, the three computed fields at their declared defaults, and the four common fields with version 1."
        test_recipe:
          setup:
            - "empty database, logical clock set to the mandated startup default"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PracticeAdministrator
          trigger:
            - call: "POST /practices"
              payload: { name: "Northside OMS", state_code: "OH", recovery_bay_count: 3, turnover_buffer_minutes: 20, consignment_credit_limit_cents: 750000 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
          assert:
            - "HTTP 201 with response_type == object and meta.api_request_id present"
            - "data.name == \"Northside OMS\", data.state_code == \"OH\", data.recovery_bay_count == 3, data.turnover_buffer_minutes == 20, data.consignment_credit_limit_cents == 750000"
            - "data.sedation_privilege_state == UNPERMITTED, data.open_adverse_event_count == 0, data.consignment_committed_cents == 0"
            - "data.version == 1 and data.id is a bare UUID with no type prefix"

      - name: practice_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints["GET /practices/{practiceId}"]
        distinguishing_aspect: "The single-resource read returns exactly what creation persisted, with no version bump for a read."
        test_recipe:
          setup:
            - "one practice created with an explicit 20-minute turnover buffer"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Northside OMS", state_code: "OH", recovery_bay_count: 3, turnover_buffer_minutes: 20 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
          trigger:
            - call: "GET /practices/${prac_id}"
              payload: {}
              as: SchedulingCoordinator
          assert:
            - "HTTP 200, data.id == ${prac_id}, data.turnover_buffer_minutes == 20, data.consignment_credit_limit_cents == 500000 (default)"
            - "data.version == 1 - a read never mutates the row"

      - name: surgical_case_listing_filters_and_paginates
        claim_type: listing
        grounds:
          - endpoints["GET /surgical-cases"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "limit/offset paging is layered on top of the practice_id + scheduling_status filters: total_count counts the FILTERED set (3), not the table, and has_more flips on the second page."
        test_recipe:
          setup:
            - "one practice, one surgeon, one patient, three DRAFT LOCAL_ONLY cases"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Northside OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat List", date_of_birth: "1980-03-15T00:00:00Z", asa_class: 2, airway_class: 2, weight_kg: 80 }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "THIRD_MOLAR", planned_start: "2026-09-14T13:00:00Z", planned_end: "2026-09-14T14:00:00Z", total_charge_cents: 50000 }
              as: SchedulingCoordinator
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "IMPLANT", planned_start: "2026-09-15T13:00:00Z", planned_end: "2026-09-15T14:00:00Z", total_charge_cents: 50000 }
              as: SchedulingCoordinator
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "PATHOLOGY", planned_start: "2026-09-16T13:00:00Z", planned_end: "2026-09-16T14:00:00Z", total_charge_cents: 50000 }
              as: SchedulingCoordinator
          trigger:
            - call: "GET /surgical-cases?practice_id=${prac_id}&scheduling_status=DRAFT&limit=2&offset=0"
              payload: {}
              as: SchedulingCoordinator
            - call: "GET /surgical-cases?practice_id=${prac_id}&scheduling_status=DRAFT&limit=2&offset=2"
              payload: {}
              as: SchedulingCoordinator
          assert:
            - "trigger[0]: HTTP 200, response_type == array, 2 rows returned, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "trigger[1]: 1 row returned, total_count == 3, has_more == false, offset == 2"
            - "every returned row has scheduling_status == DRAFT and practice_id == ${prac_id}"

      - name: patient_read_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_RESOURCE_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "A well-formed UUID that resolves to no row is 404 ERR_RESOURCE_NOT_FOUND, distinct from the body-level ERR_REFERENCED_ENTITY_NOT_FOUND."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PracticeAdministrator
          trigger:
            - call: "GET /patients/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with response_type == error and data.error_id == ERR_RESOURCE_NOT_FOUND"

      - name: surgical_case_creation_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=4]
          - endpoints["POST /surgical-cases"]
        distinguishing_aspect: "total_charge_cents has source input with no default, so omitting it is a 400 request error - not a 422 value error and not a silent zero."
        test_recipe:
          setup:
            - "one practice, one surgeon, one patient"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Northside OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Required", date_of_birth: "1980-03-15T00:00:00Z", asa_class: 2, airway_class: 2, weight_kg: 80 }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "THIRD_MOLAR", planned_start: "2026-09-14T13:00:00Z", planned_end: "2026-09-14T14:00:00Z" }
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "no SurgicalCase row is created: GET /surgical-cases?practice_id=${prac_id} returns total_count == 0"

      - name: optional_inputs_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Practice.fields.turnover_buffer_minutes
          - entities.Practice.fields.consignment_credit_limit_cents
          - entities.StaffMember.fields.monitoring_certified
          - entities.Patient.fields.dental_annual_remaining_cents
        distinguishing_aspect: "Four different entities' optional inputs must materialize their declared defaults (15, 500000, false, 150000) rather than null or 0."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PracticeAdministrator
          trigger:
            - call: "POST /practices"
              payload: { name: "Defaults OMS", state_code: "OH", recovery_bay_count: 1 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Mo Monitor", role_type: "ANESTHESIA_MONITOR" }
              as: PracticeAdministrator
              captures: { mon_id: $.data.id }
            - call: "POST /patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Default", date_of_birth: "1980-03-15T00:00:00Z", asa_class: 2, airway_class: 2, weight_kg: 80 }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
          assert:
            - "trigger[0]: data.turnover_buffer_minutes == 15 and data.consignment_credit_limit_cents == 500000"
            - "trigger[1]: data.monitoring_certified == false and data.acls_expires_on == null"
            - "trigger[2]: data.medical_plan_active == false, data.dental_plan_active == false, data.dental_annual_remaining_cents == 150000"

      - name: surgical_case_duration_and_recovery_minutes_are_computed
        claim_type: computed_fields
        grounds:
          - entities.SurgicalCase.fields.duration_minutes
          - entities.SurgicalCase.fields.recovery_minutes_required
          - entities.Patient.fields.age_years
          - calculations.recovery_capacity_projection
        distinguishing_aspect: "duration_minutes and recovery_minutes_required are derived at creation from the planned window and the anesthesia level (90 minutes -> 45 recovery minutes for MODERATE_SEDATION), and Patient.age_years is derived from the logical clock, not supplied."
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z; patient born 1980-03-15 -> 46 whole years"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Computed OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Mo Monitor", role_type: "ANESTHESIA_MONITOR", monitoring_certified: true }
              as: PracticeAdministrator
              captures: { mon_id: $.data.id }
            - call: "POST /patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Computed", date_of_birth: "1980-03-15T00:00:00Z", asa_class: 2, airway_class: 2, weight_kg: 80 }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", monitor_staff_id: "${mon_id}", planned_anesthesia_level: "MODERATE_SEDATION", procedure_category: "PATHOLOGY", planned_start: "2026-09-14T13:00:00Z", planned_end: "2026-09-14T14:30:00Z", total_charge_cents: 120000 }
              as: SchedulingCoordinator
              captures: { case_id: $.data.id }
          assert:
            - "data.duration_minutes == 90 and data.recovery_minutes_required == 45"
            - "data.scheduling_status == DRAFT, data.clearance_status == NOT_EVALUATED, data.referral_coordination_status == NOT_REQUIRED (a PATHOLOGY case with no referring provider), data.block_id == null"
            - "GET /patients/${pat_id} reports age_years == 46 against the 2026-08-01 logical clock"

      - name: staff_member_system_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.StaffMember
          - endpoints["POST /staff-members"]
          - endpoints["GET /staff-members/{staffId}"]
        distinguishing_aspect: "id / created_at / updated_at / version come from the server: version starts at 1 and the id is a bare UUID that the follow-up GET resolves."
        test_recipe:
          setup:
            - "one practice"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "System OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
          trigger:
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON", acls_expires_on: "2027-06-30T00:00:00Z" }
              as: PracticeAdministrator
              captures: { staff_id: $.data.id, staff_v: $.data.version }
          assert:
            - "data.version == 1, data.id is a bare UUID with no prefix, data.created_at and data.updated_at are ISO 8601 UTC with three fractional digits"
            - "GET /staff-members/${staff_id} returns the same id and version ${staff_v}"

      - name: patient_asa_class_out_of_range_rejected
        claim_type: type_constraints
        grounds:
          - errors[ERR_INVALID_FIELD_VALUE]
          - validations[priority=5]
          - entities.Patient.fields.asa_class
          - entities.BlockTime
        distinguishing_aspect: "Range and ordering constraints are 422 ERR_INVALID_FIELD_VALUE, not 400: asa_class 5 is out of its 1..4 range and block_end <= block_start is an inverted interval."
        test_recipe:
          setup:
            - "one practice and one surgeon"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Range OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Range", date_of_birth: "1980-03-15T00:00:00Z", asa_class: 5, airway_class: 2, weight_kg: 80 }
              as: SchedulingCoordinator
              captures: { err1: $.data.error_id }
            - call: "POST /block-times"
              payload: { practice_id: "${prac_id}", surgeon_id: "${surg_id}", room_code: "OR-1", block_start: "2026-09-14T17:00:00Z", block_end: "2026-09-14T13:00:00Z" }
              as: SchedulingCoordinator
              captures: { err2: $.data.error_id }
          assert:
            - "trigger[0]: HTTP 422 with data.error_id == ERR_INVALID_FIELD_VALUE"
            - "trigger[1]: HTTP 422 with data.error_id == ERR_INVALID_FIELD_VALUE"
            - "neither row is persisted"

      - name: emergency_drill_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.EmergencyDrill
          - entities.ImagingStudy
          - endpoints["GET /emergency-drills/{drillId}"]
        distinguishing_aspect: "EmergencyDrill and ImagingStudy declare common_fields false: they expose id and created_at only, no version and no updated_at, and 1.5 declares no update or delete endpoint for either."
        test_recipe:
          setup:
            - "one practice with two staff members and one logged drill"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Immutable OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Mo Monitor", role_type: "ANESTHESIA_MONITOR", monitoring_certified: true }
              as: PracticeAdministrator
              captures: { mon_id: $.data.id }
            - call: "POST /emergency-drills"
              payload: { practice_id: "${prac_id}", drill_type: "AIRWAY_OBSTRUCTION", conducted_at: "2026-07-01T09:00:00Z", participant_staff_ids: ["${surg_id}", "${mon_id}"] }
              as: AnesthesiaCoordinator
              as_user_id: "${mon_id}"
              captures: { drill_id: $.data.id }
          trigger:
            - call: "GET /emergency-drills/${drill_id}"
              payload: {}
              as: PracticeAdministrator
          assert:
            - "HTTP 200 with data.id == ${drill_id} and data.created_at present"
            - "the payload carries NO version and NO updated_at field"
            - "data.deficiency_noted == false (declared default) and data.participant_staff_ids has 2 members"

      - name: imaging_study_with_unknown_patient_rejected
        claim_type: parent_relationships
        grounds:
          - errors[ERR_REFERENCED_ENTITY_NOT_FOUND]
          - validations[priority=6]
          - entities.ImagingStudy.fields.patient_id
        distinguishing_aspect: "A body-level foreign key that resolves to no row is 404 ERR_REFERENCED_ENTITY_NOT_FOUND, keeping it distinguishable from a bad path id (ERR_RESOURCE_NOT_FOUND)."
        test_recipe:
          setup:
            - "empty database except the logical clock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PracticeAdministrator
          trigger:
            - call: "POST /imaging-studies"
              payload: { patient_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", modality: "PANORAMIC", justification_code: "THIRD_MOLAR_ASSESSMENT", acquired_at: "2026-07-20T10:00:00Z", dose_mgy_cm2: 80.0 }
              as: PracticeAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == ERR_REFERENCED_ENTITY_NOT_FOUND"

      - name: flat_topology_cross_practice_reference_rejected
        claim_type: flat
        grounds:
          - complexity_profile.entity_topology
          - errors[ERR_PRACTICE_SCOPE_MISMATCH]
          - validations[priority=7]
        distinguishing_aspect: "In a flat topology every link is a body FK, so scope has to be enforced explicitly: a case whose primary surgeon belongs to a DIFFERENT practice resolves fine as a row (so it is not a 404) and must fail as a 409 scope mismatch."
        test_recipe:
          setup:
            - "two practices; the patient belongs to practice A and the surgeon to practice B"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Practice A", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { pracA_id: $.data.id }
            - call: "POST /practices"
              payload: { name: "Practice B", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { pracB_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${pracB_id}", full_name: "Dr Foreign", role_type: "SURGEON" }
              as: PracticeAdministrator
              captures: { surgB_id: $.data.id }
            - call: "POST /patients"
              payload: { practice_id: "${pracA_id}", full_name: "Pat Scope", date_of_birth: "1980-03-15T00:00:00Z", asa_class: 2, airway_class: 2, weight_kg: 80 }
              as: SchedulingCoordinator
              captures: { patA_id: $.data.id }
          trigger:
            - call: "POST /surgical-cases"
              payload: { practice_id: "${pracA_id}", patient_id: "${patA_id}", primary_surgeon_id: "${surgB_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "THIRD_MOLAR", planned_start: "2026-09-14T13:00:00Z", planned_end: "2026-09-14T14:00:00Z", total_charge_cents: 50000 }
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_PRACTICE_SCOPE_MISMATCH"
            - "GET /surgical-cases?practice_id=${pracA_id} returns total_count == 0"

      - name: permit_inspection_drill_and_staff_reads
        claim_type: retrieval_and_listing
        grounds:
          - endpoints[GET /anesthesia-permits/{permitId}]
          - endpoints[GET /anesthesia-permits]
          - endpoints[GET /facility-inspections/{inspectionId}]
          - endpoints[GET /facility-inspections]
          - endpoints[GET /emergency-drills]
          - endpoints[GET /staff-members]
        distinguishing_aspect: "The compliance-side reads are exercised on their own: each single-row GET echoes the stored row including its computed fields, and each list GET honours its declared filter so a filtered total_count is strictly smaller than the unfiltered one."
        test_recipe:
          setup:
            - "one practice with two staff members, an APPLIED MODERATE_SEDATION permit, two drills and one scheduled inspection"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Compliance Read OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Mo Monitor", role_type: "ANESTHESIA_MONITOR", monitoring_certified: true }
              as: PracticeAdministrator
              captures: { mon_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Rhea Nurse", role_type: "RECOVERY_NURSE" }
              as: PracticeAdministrator
              captures: { nurse_id: $.data.id }
            - call: "POST /anesthesia-permits"
              payload: { practice_id: "${prac_id}", permit_level: "MODERATE_SEDATION", applied_on: "2026-08-25T00:00:00Z" }
              as: PracticeAdministrator
              captures: { perm_id: $.data.id }
            - call: "POST /emergency-drills"
              payload: { practice_id: "${prac_id}", drill_type: "AIRWAY_OBSTRUCTION", conducted_at: "2026-08-20T09:00:00Z", participant_staff_ids: ["${mon_id}", "${nurse_id}"] }
              as: PracticeAdministrator
              captures: { drill1_id: $.data.id }
            - call: "POST /emergency-drills"
