            - call: "POST /episodes/${ep_id}/visits"
              payload: { clinician_id: "${rn_id}", discipline: "RN", scheduled_start: "2026-02-03T09:00:00Z", scheduled_end: "2026-02-03T10:00:00Z" }
              as: Scheduler
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /episodes/${ep_id}/visits"
              payload: { clinician_id: "${rn_id}", discipline: "RN", scheduled_start: "2026-02-03T09:30:00Z", scheduled_end: "2026-02-03T10:30:00Z" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CLINICIAN_DOUBLE_BOOKED"

      - name: companion_shift_30min_travel_buffer_conflict
        grounds:
          - validations[priority=14]
          - entities.CompanionShift.fields.shift_start
          - entities.CompanionShift.fields.shift_end
