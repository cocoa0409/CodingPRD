              payload: { domain_authority: 80, content_originality_pct: 92, broken_link_ratio_bps: 200, brand_safety_flag_count: 0, restricted_vertical_overlap_bps: 0 }
              as: ComplianceAnalyst
              as_user_id: "cmp-001"
          trigger:
            - call: "POST /affiliates/${aff_id}/tax-documents"
              payload: { form_type: "W9", tax_id_last4: "1234", treaty_withholding_bps: 0, expires_on: "2027-12-31T00:00:00Z" }
