  - section: validations
    instances:
      - name: secondary_market_without_locked_base_returns_base_platform_not_qualified
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_BASE_PLATFORM_NOT_QUALIFIED]"]
        distinguishing_aspect: "Adjacent-market licensing (ARCHITECTURAL vs primary CONSUMER_ELECTRONICS) requires a LOCKED base composition; QUALIFIED alone fails, and locking the composition then lets the identical activate succeed."
        test_recipe:
          setup: ["program DESIGN_FROZEN with composition QUALIFIED but not LOCKED; license for ARCHITECTURAL (secondary market), clock in term"]
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Beta Devices", region: "EU" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Falcon", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id } }
            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-002" }, as: ProgramManager }
            - { call: "POST /glass/compositions", payload: { program_id: "${p_id}", composition_code: "GX-200", complexity_multiplier: 1.0 }, as: ProgramManager, captures: { cx_id: $.data.id } }
            - { call: "POST /glass/qual-cycles", payload: { composition_id: "${cx_id}", test_plan_ref: "TP-2" }, as: ProgramManager, captures: { q_id: $.data.id } }
            - { call: "POST /glass/qual-cycles/${q_id}/begin-testing", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/qual-cycles/${q_id}/record-result", payload: { outcome: "PASSED" }, as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/programs/${p_id}/begin-qualification", payload: { design_freeze_date: "2027-03-01T00:00:00Z" }, as: ProgramManager }
            - { call: "POST /glass/programs/${p_id}/freeze-design", as: ProgramManager }
            - { call: "POST /glass/licenses", payload: { device_maker_id: "${m_id}", program_id: "${p_id}", market: "ARCHITECTURAL", effective_date: "2027-01-01T00:00:00Z", expiry_date: "2028-12-31T00:00:00Z" }, as: LegalCounsel, captures: { lic_id: $.data.id } }
            - { call: "POST /glass/_clock/set_current_utc", payload: { to_iso8601: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /glass/licenses/${lic_id}/activate", as: LegalCounsel, captures: { err: $.data.error_id } }
            - { call: "POST /glass/compositions/${cx_id}/lock", as: ProgramManager }
            - { call: "POST /glass/licenses/${lic_id}/activate", as: LegalCounsel, captures: { lic_status: $.data.license_status } }
          assert:
            - "first activate: error_id == ERR_BASE_PLATFORM_NOT_QUALIFIED with http 422 (composition merely QUALIFIED)"
            - "after lock: activate returns 200 with license_status == ACTIVE"
