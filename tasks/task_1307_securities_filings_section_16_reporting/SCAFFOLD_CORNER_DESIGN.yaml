              captures: { t_g: $.data.id }
            - call: "POST /transactions"
              payload: { reporting_person_id: "${p_id}", transaction_date: "2026-08-06", transaction_code: "P", security_type: "COMMON_STOCK", shares: 100, price_per_share: 10.00 }
              as: EquityPlanAdmin
              as_user_id: "epa_1"
              captures: { t_p: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /transactions/${t_g}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /transactions/${t_p}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "GET /filings"
              payload: { reporting_person_id: "${p_id}", form_type: "FORM_4", status: "DRAFT" }
              as: ComplianceOfficer
              captures: { f4: "$.data[0].id" }
            - call: "POST /filings/${f4}/ready"
              payload: {}
              as: FilingCoordinator
              as_user_id: "coord_1"
            - call: "POST /filings/${f4}/submit"
              payload: { edgar_ccc: "CCC12345" }
              as: FilingAgent
              as_user_id: "agent_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /filings/${f4}/record-edgar-result"
              payload: { outcome: "ACCEPTED", accession_number: "0000000001-26-000014" }
              as: FilingAgent
              as_user_id: "agent_1"
            - call: "POST /annual-sweeps"
              payload: { issuer_id: "${i_id}", fiscal_year: 2026 }
              as: ComplianceOfficer
              captures: { sw_id: $.data.id, fy_end: $.data.fy_end_date, fy_start: $.data.fy_start_date }
          trigger:
            - call: "POST /annual-sweeps/${sw_id}/run"
              payload: {}
              as: ComplianceOfficer
              captures: { sw_status: $.data.status, f5_id: "$.data.results[0].form5_filing_id" }
            - call: "GET /filings/${f5_id}"
              as: ComplianceOfficer
              captures: { f5_ddl: $.data.filing_deadline, f5_status: $.data.status, f5_type: $.data.form_type }
            - call: "GET /reporting-persons/${p_id}"
              as: ComplianceOfficer
              captures: { oc: $.data.open_obligation_count }
          assert:
            - "fy_start == \"2026-01-01\" AND fy_end == \"2026-12-31\""
            - "sw_status == COMPLETED"
            - "results has exactly 1 row for P: late_filing_count == 1, unreported_exempt_count == 1, needs_form5 == true, delinquent == true"
            - "f5_type == FORM_5 AND f5_status == DRAFT AND f5_ddl == \"2027-02-14\" (2026-12-31 + 45 calendar days)"
            - "GET /transactions?filing_id=${f5_id} returns the gift transaction (attached by the sweep)"
            - "oc == 2 (DRAFT Form 3 + DRAFT Form 5; the accepted Form 4 no longer counts)"

  # ============================================================ errors
  - section: errors
    instances:
      - name: error_person_not_active_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_PERSON_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: confirm_requires_active_reporting_person
          rationale: "Asserted as the failure path of the named §1.8 instance (cross-entity state gate on confirm)."
      - name: error_agent_not_authorized_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_AGENT_NOT_AUTHORIZED]"]
        excluded_because:
          difficulty_instance: submit_requires_active_agent_authorization
          rationale: "Asserted as the failure path of the named §1.8 instance (revoked authorization blocks submit)."
      - name: error_sod_preparer_submitter_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_SOD_PREPARER_SUBMITTER]"]
        excluded_because:
          difficulty_instance: submit_sod_and_bad_credentials_sod_wins
          rationale: "Asserted as the winning error of the named §1.8 priority-conflict instance."
      - name: error_plan_window_overlap_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_PLAN_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: plan_windows_half_open_overlap
          rationale: "Asserted as the rejection of plan C in the named §1.8 temporal-overlap instance."
      - name: error_blackout_window_overlap_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_BLACKOUT_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: blackout_windows_closed_interval_overlap
          rationale: "Asserted as the rejection of the touching window in the named §1.8 temporal-overlap instance."
      - name: filing_reopen_after_rejection_covered
        claim_type: invalid_transition
        grounds: [state_machines.SecuritiesFiling.REJECTED_to_DRAFT]
        excluded_because:
          difficulty_instance: filing_rejection_revision_loop
          rationale: "The REJECTED -> DRAFT reopen and the re-accept path are asserted inside the named §1.8 cyclic-machine instance."

  # ============================================================ rbac
  - section: rbac
    instances:
      - name: auth_context_missing_headers_returns_400
        claim_type: role_exclusive_denied
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers is rejected with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before role or existence checks."
        test_recipe:
          setup: ["Nothing (empty DB)"]
          setup_api_calls: []
          trigger:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (request sent with both headers stripped)"

      - name: equity_plan_admin_cannot_designate
        claim_type: role_exclusive_denied
        grounds: ["roles[ComplianceOfficer].exclusive_operations", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "EquityPlanAdmin may ingest transactions but cannot drive the designation lifecycle: DESIGNATE as EquityPlanAdmin yields ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["Issuer I; person P in PROPOSED"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Dana Officer", person_cik: "0001000001" }
              as: ComplianceOfficer
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /reporting-persons/${p_id}/transitions"
              payload: { action: "DESIGNATE" }
              as: EquityPlanAdmin
              as_user_id: "epa_1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_ROLE"
            - "person remains PROPOSED"

      - name: insider_cannot_approve_own_plan
        claim_type: role_exclusive_denied
        grounds: ["roles[ComplianceOfficer].exclusive_operations", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "APPROVE is ComplianceOfficer-only: the owning ReportingInsider attempting APPROVE on their own plan gets ERR_FORBIDDEN_ROLE (segregation of adoption and approval)."
        test_recipe:
          setup: ["Issuer I; person P; plan created and submitted for adoption by P"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Dana Owner", person_cik: "0001000002", is_ten_pct_owner: true }
              as: ComplianceOfficer
              captures: { p_id: $.data.id }
            - call: "POST /trading-plans"
              payload: { reporting_person_id: "${p_id}", plan_name: "Plan A", first_trade_date: "2026-11-01", expiration_date: "2027-03-01" }
              as: ReportingInsider
              as_user_id: "${p_id}"
              captures: { pl_id: $.data.id }
            - call: "POST /trading-plans/${pl_id}/transitions"
              payload: { action: "SUBMIT_ADOPTION" }
              as: ReportingInsider
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /trading-plans/${pl_id}/transitions"
              payload: { action: "APPROVE" }
              as: ReportingInsider
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_ROLE"
            - "plan remains PENDING_APPROVAL"

      - name: insider_cannot_create_plan_for_other_person
        claim_type: ownership_scope
        grounds: ["roles[ReportingInsider]", "validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "ReportingInsider identity is entity-backed: X-User-ID of person P1 with a body naming person P2 is rejected with ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["Issuer I; persons P1 and P2 exist"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Dana Owner", person_cik: "0001000002", is_ten_pct_owner: true }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Eve Owner", person_cik: "0001000003", is_ten_pct_owner: true }
              as: ComplianceOfficer
              captures: { p2: $.data.id }
          trigger:
            - call: "POST /trading-plans"
              payload: { reporting_person_id: "${p2}", plan_name: "Plan X", first_trade_date: "2026-11-01", expiration_date: "2027-03-01" }
              as: ReportingInsider
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_ROLE (X-User-ID ${p1} != body reporting_person_id ${p2})"

      - name: filing_agent_cannot_confirm_transaction
        claim_type: role_exclusive_denied
        grounds: ["roles[ComplianceOfficer].exclusive_operations", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "FilingAgent may submit filings but cannot confirm transactions: confirm as FilingAgent yields ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["Issuer I; person P ACTIVE; purchase dated 2026-08-01 ingested"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Dana Officer", person_cik: "0001000001" }
              as: ComplianceOfficer
              captures: { p_id: $.data.id }
            - call: "POST /reporting-persons/${p_id}/transitions"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /transactions"
              payload: { reporting_person_id: "${p_id}", transaction_date: "2026-08-01", transaction_code: "P", security_type: "COMMON_STOCK", shares: 100, price_per_share: 10.00 }
              as: EquityPlanAdmin
              as_user_id: "epa_1"
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /transactions/${t_id}/confirm"
              payload: {}
              as: FilingAgent
              as_user_id: "agent_1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_ROLE"

  # ============================================================ consistency_model
  - section: consistency_model
    instances:
      - name: confirm_response_reflects_computed_state_immediately
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model, calculations.insider_shares_balance]
        distinguishing_aspect: "Immediate consistency: the confirm RESPONSE itself carries status == CONFIRMED, direction == ACQUIRED, and the recomputed shares_owned_after == 100 — no delayed read needed."
        test_recipe:
          setup: ["Issuer I; person P ACTIVE (designated at clock 2026-08-03); purchase 100 @ 10.00 dated 2026-08-03 ingested; clock 2026-08-03"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Dana Officer", person_cik: "0001000001" }
              as: ComplianceOfficer
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /reporting-persons/${p_id}/transitions"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /transactions"
              payload: { reporting_person_id: "${p_id}", transaction_date: "2026-08-03", transaction_code: "P", security_type: "COMMON_STOCK", shares: 100, price_per_share: 10.00 }
              as: EquityPlanAdmin
              as_user_id: "epa_1"
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /transactions/${t_id}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { t_status: $.data.status, t_dir: $.data.direction, t_bal: $.data.shares_owned_after }
          assert:
            - "t_status == CONFIRMED in the confirm response itself"
            - "t_dir == ACQUIRED AND t_bal == 100 in the same response (computed fields visible immediately)"
