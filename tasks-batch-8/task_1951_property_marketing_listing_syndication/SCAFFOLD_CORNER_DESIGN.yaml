            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/x.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
