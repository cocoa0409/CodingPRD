scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — dual_variant_calc (different entity domains: Item vs Inquiry)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: retention_deadline_transit_vs_facility
        grounds:
          - calculations.retention_deadline
          - entities.Item.fields.retention_deadline
        distinguishing_aspect: |
          Same found_at and retention_days produce different deadlines depending
          on the owning program's variant: TRANSIT keeps hour-precise arithmetic
          (2026-08-31T10:30:00Z) while FACILITY discards time-of-day and expires
          at the midnight after the calendar-day count (2026-09-01T00:00:00Z).
        test_recipe:
          setup:
            - "TRANSIT program with active MID/ELECTRONICS policy (retention_days=30, AUCTION) and a secure location"
            - "FACILITY program with identical policy and location"
            - "one MID item per program, both found_at 2026-08-01T10:30:00Z, declared_value_cents 50000"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "MID", retention_days: 30, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc_t: $.data.id }
            - call: "POST /programs"
              payload: { name: "Facility L&F", program_type: "FACILITY", contact_email: "f@city.gov" }
              as: ProgramAdmin
              captures: { pf: $.data.id, pf_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pf}", item_category: "ELECTRONICS", value_tier: "MID", retention_days: 30, disposal_method: "AUCTION", expected_program_version: "${pf_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pf}", name: "Cage F", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc_f: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc_t}", category: "ELECTRONICS", declared_value_cents: 50000, description: "black laptop", found_at: "2026-08-01T10:30:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { item_t: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pf}", storage_location_id: "${loc_f}", category: "ELECTRONICS", declared_value_cents: 50000, description: "black laptop", found_at: "2026-08-01T10:30:00Z", found_location: "City Hall lobby" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { item_f: $.data.id }
          trigger:
            - call: "GET /items/${item_t}"
              as: IntakeOfficer
            - call: "GET /items/${item_f}"
              as: IntakeOfficer
          assert:
            - "Item.${item_t}.retention_deadline == \"2026-08-31T10:30:00Z\" (TRANSIT: found_at + 30*24h, time-of-day preserved)"
            - "Item.${item_f}.retention_deadline == \"2026-09-01T00:00:00Z\" (FACILITY: midnight after 2026-08-01 + 30 calendar days)"
            - "Item.${item_t}.value_tier == MID and Item.${item_f}.value_tier == MID (identical inputs, deadline differs only by program variant)"
      - name: inquiry_sla_transit_vs_facility
        grounds:
          - calculations.inquiry_sla_deadline
          - entities.Inquiry.fields.sla_deadline
        distinguishing_aspect: |
          Same creation instant produces different sla_deadline values per
          resolved program variant: TRANSIT adds 24h (2026-08-02T09:00:00Z),
          FACILITY adds 72h (2026-08-04T09:00:00Z). Entity domain is Inquiry,
          distinct from the Item-domain retention variant.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T09:00:00Z"
            - "TRANSIT program and FACILITY program (no policies needed — inquiries carry program_id directly)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id }
            - call: "POST /programs"
              payload: { name: "Facility L&F", program_type: "FACILITY", contact_email: "f@city.gov" }
              as: ProgramAdmin
              captures: { pf: $.data.id }
          trigger:
            - call: "POST /inquiries"
              payload: { program_id: "${pt}", contact_email: "a@x.com", subject: "lost wallet", message: "brown wallet on route 9" }
              as: PublicUser
              captures: { inq_t: $.data.id }
            - call: "POST /inquiries"
              payload: { program_id: "${pf}", contact_email: "b@x.com", subject: "lost keys", message: "keys at city hall" }
              as: PublicUser
              captures: { inq_f: $.data.id }
          assert:
            - "Inquiry.${inq_t}.sla_deadline == \"2026-08-02T09:00:00Z\" (TRANSIT +24h)"
            - "Inquiry.${inq_f}.sla_deadline == \"2026-08-04T09:00:00Z\" (FACILITY +72h)"
            - "Inquiry.${inq_t}.status == OPEN and Inquiry.${inq_f}.status == OPEN"

  # =========================================================================
  # Rule 2 — combinatorial_formula (modes (a), (b), (c) — all different)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: claim_proof_score_tier_threshold_branch
        grounds:
          - calculations.claim_proof_score
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Mode (a) — weighted sum of 5 proof inputs feeding a tier-conditional
          approval branch: identical proofs (score 70) pass the MID threshold
          (>= 60) but fail the HIGH threshold (>= 80), so the same proof
          combination yields APPROVED on one item and ERR_CLAIM_PROOF_INSUFFICIENT
          on another purely because of the tier branch.
        test_recipe:
          setup:
            - "TRANSIT program with LOW/MID/HIGH ELECTRONICS policies and a secure location"
            - "MID item (50000) and HIGH item (150000), both STORED"
            - "one unverified claimant with one claim per item, proofs serial+photo+receipt+DETAILED (score 70 each)"
            - "both claims UNDER_REVIEW by examiner-1"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "MID", retention_days: 30, disposal_method: "AUCTION", expected_program_version: "${pt_v} + 1" }
              as: ProgramAdmin
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "HIGH", retention_days: 90, disposal_method: "AUCTION", expected_program_version: "${pt_v} + 2" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc_t: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc_t}", category: "ELECTRONICS", declared_value_cents: 50000, description: "mid phone", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { im: $.data.id, im_v: $.data.version }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc_t}", category: "ELECTRONICS", declared_value_cents: 150000, description: "high laptop", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { ih: $.data.id, ih_v: $.data.version }
            - call: "POST /claimants"
              payload: { full_name: "Pat Owner", email: "pat@x.com", phone: "555-1" }
              as: PublicUser
              captures: { c1: $.data.id }
            - call: "POST /claims"
              payload: { item_id: "${im}", claimant_id: "${c1}", proof_serial: true, proof_photo: true, proof_receipt: true, proof_description_detail: "DETAILED", expected_item_version: "${im_v}" }
              as: Claimant
              as_user_id: "${c1}"
              captures: { cm: $.data.id }
            - call: "POST /claims"
              payload: { item_id: "${ih}", claimant_id: "${c1}", proof_serial: true, proof_photo: true, proof_receipt: true, proof_description_detail: "DETAILED", expected_item_version: "${ih_v}" }
              as: Claimant
              as_user_id: "${c1}"
              captures: { ch: $.data.id }
            - call: "POST /claims/${cm}/start-review"
              as: ClaimsExaminer
              as_user_id: "examiner-1"
            - call: "POST /claims/${ch}/start-review"
              as: ClaimsExaminer
              as_user_id: "examiner-1"
          trigger:
            - call: "POST /claims/${cm}/approve"
              as: ClaimsExaminer
              as_user_id: "examiner-1"
            - call: "POST /claims/${ch}/approve"
              as: ClaimsExaminer
              as_user_id: "examiner-1"
              captures: { err_high: $.data.error_id }
          assert:
            - "Claim.${cm}.proof_score == 70 (30 serial + 15 photo + 10 receipt + 15 detail, claimant unverified)"
            - "Claim.${cm}.status == APPROVED (70 >= MID threshold 60)"
            - "Item.${im}.status == RELEASE_PENDING (approve cascade)"
            - "err_high == \"ERR_CLAIM_PROOF_INSUFFICIENT\" (70 < HIGH threshold 80)"
            - "Claim.${ch}.status == UNDER_REVIEW (unchanged after failed approve)"
      - name: lot_minimum_bid_per_item_rounding
        grounds:
          - calculations.lot_minimum_bid
          - entities.LotItem.fields.floor_price_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order pinned: each item floor is rounded
          HALF_UP to whole cents BEFORE summation. Two LOW items at 5005 cents
          give per-item floors of round(500.50) = 501 each, summing to 1002;
          the forbidden sum-then-round order would give round(1001.00) = 1001.
        test_recipe:
          setup:
            - "TRANSIT program, LOW/ELECTRONICS policy (10 days, AUCTION), location, venue, scheduled event"
            - "two LOW items of 5005 cents each, swept into AUCTION_ELIGIBLE at exactly their deadline"
            - "one DRAFT lot"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc_t: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc_t}", category: "ELECTRONICS", declared_value_cents: 5005, description: "charger A", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { i1: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc_t}", category: "ELECTRONICS", declared_value_cents: 5005, description: "charger B", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { i2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /_sweeps/retention"
              as: ProgramAdmin
            - call: "POST /venues"
              payload: { program_id: "${pt}", name: "Depot Hall", address: "1 Depot St", insurance_cap_cents: 100000000 }
              as: ProgramAdmin
              captures: { ven: $.data.id }
            - call: "POST /auction-events"
              payload: { venue_id: "${ven}", program_id: "${pt}", name: "Aug Sale", starts_at: "2026-08-20T10:00:00Z", ends_at: "2026-08-20T12:00:00Z" }
              as: AuctionCoordinator
              as_user_id: "coord-1"
              captures: { ev: $.data.id }
            - call: "POST /auction-lots"
              payload: { event_id: "${ev}", title: "Chargers" }
              as: AuctionCoordinator
              as_user_id: "coord-1"
              captures: { lot: $.data.id, lot_v: $.data.version }
          trigger:
            - call: "POST /auction-lots/${lot}/items"
              payload: { item_id: "${i1}", expected_lot_version: "${lot_v}" }
              as: AuctionCoordinator
              as_user_id: "coord-1"
              captures: { li1_floor: $.data.floor_price_cents }
            - call: "POST /auction-lots/${lot}/items"
              payload: { item_id: "${i2}", expected_lot_version: "${lot_v} + 1" }
              as: AuctionCoordinator
              as_user_id: "coord-1"
          assert:
            - "li1_floor == 501 (round_half_up(5005 * 0.10) = round_half_up(500.50) = 501)"
            - "GET /auction-lots/${lot}.data.minimum_bid_cents == 1002 (per-item rounding then sum; sum-then-round would yield 1001)"
            - "Item.${i1}.status == LOTTED and Item.${i2}.status == LOTTED"
      - name: auction_settlement_pinned_evaluation_order
        grounds:
          - calculations.auction_settlement
          - entities.AuctionEvent.fields.gross_proceeds_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency pinned by evaluation order:
          the commission tier is keyed on GROSS proceeds computed BEFORE any
          commission is deducted. Two lots with hammers 600000 + 500000 give
          gross 1100000 -> 8% tier (not the 10% tier a net-keyed reading would
          pick, nor lot-by-lot tier selection), commissions 48000 + 40000,
          net 1012000.
        test_recipe:
          setup:
            - "TRANSIT program, LOW policy, location, venue (cap 100000000), event window 2026-08-20"
            - "two AUCTION_ELIGIBLE LOW items; two lots, each PUBLISHED with one item, both SOLD (hammers 600000 and 500000, finalized by coord-2 who did not create the lots)"
            - "logical clock advanced past event end"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc_t: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc_t}", category: "ELECTRONICS", declared_value_cents: 9000, description: "item A", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { ia: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc_t}", category: "ELECTRONICS", declared_value_cents: 9000, description: "item B", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { ib: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /_sweeps/retention"
              as: ProgramAdmin
            - call: "POST /venues"
              payload: { program_id: "${pt}", name: "Depot Hall", address: "1 Depot St", insurance_cap_cents: 100000000 }
              as: ProgramAdmin
              captures: { ven: $.data.id }
            - call: "POST /auction-events"
              payload: { venue_id: "${ven}", program_id: "${pt}", name: "Aug Sale", starts_at: "2026-08-20T10:00:00Z", ends_at: "2026-08-20T12:00:00Z" }
              as: AuctionCoordinator
              as_user_id: "coord-1"
              captures: { ev: $.data.id }
            - call: "POST /auction-lots"
              payload: { event_id: "${ev}", title: "Lot A" }
              as: AuctionCoordinator
              as_user_id: "coord-1"
              captures: { lot_a: $.data.id, lot_a_v: $.data.version }
            - call: "POST /auction-lots/${lot_a}/items"
              payload: { item_id: "${ia}", expected_lot_version: "${lot_a_v}" }
              as: AuctionCoordinator
              as_user_id: "coord-1"
            - call: "POST /auction-lots"
              payload: { event_id: "${ev}", title: "Lot B" }
              as: AuctionCoordinator
              as_user_id: "coord-1"
              captures: { lot_b: $.data.id, lot_b_v: $.data.version }
            - call: "POST /auction-lots/${lot_b}/items"
              payload: { item_id: "${ib}", expected_lot_version: "${lot_b_v}" }
              as: AuctionCoordinator
              as_user_id: "coord-1"
            - call: "POST /auction-lots/${lot_a}/publish"
              as: AuctionCoordinator
              as_user_id: "coord-1"
            - call: "POST /auction-lots/${lot_b}/publish"
              as: AuctionCoordinator
              as_user_id: "coord-1"
            - call: "POST /auction-lots/${lot_a}/finalize-sale"
              payload: { hammer_price_cents: 600000 }
              as: AuctionCoordinator
              as_user_id: "coord-2"
            - call: "POST /auction-lots/${lot_b}/finalize-sale"
              payload: { hammer_price_cents: 500000 }
              as: AuctionCoordinator
              as_user_id: "coord-2"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /auction-events/${ev}/settle"
              as: AuctionCoordinator
              as_user_id: "coord-1"
              captures: { ev_gross: $.data.gross_proceeds_cents, ev_comm: $.data.total_commission_cents, ev_net: $.data.net_proceeds_cents }
          assert:
            - "ev_gross == 1100000 (600000 + 500000, computed before any commission)"
            - "ev_comm == 88000 (gross 1100000 lands in the 8% tier; 48000 + 40000 per-lot rounded)"
            - "ev_net == 1012000"
            - "AuctionEvent.${ev}.status == COMPLETED"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (different entities: Claim vs Item)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_info_request_cycle
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.Claim.INFO_REQUESTED_to_SUBMITTED
        distinguishing_aspect: |
          Claim machine is cyclic: UNDER_REVIEW -> INFO_REQUESTED -> SUBMITTED
          loops back to a previously visited state, and the claim can still
          complete the cycle and reach APPROVED afterwards.
        test_recipe:
          setup:
            - "TRANSIT program with LOW policy, location, one LOW item STORED"
            - "claimant with claim (proofs serial+photo, score 45) already UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc_t: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc_t}", category: "ELECTRONICS", declared_value_cents: 5000, description: "earbuds", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { it: $.data.id, it_v: $.data.version }
            - call: "POST /claimants"
              payload: { full_name: "Pat Owner", email: "pat@x.com" }
              as: PublicUser
              captures: { c1: $.data.id }
            - call: "POST /claims"
              payload: { item_id: "${it}", claimant_id: "${c1}", proof_serial: true, proof_photo: true, proof_receipt: false, proof_description_detail: "BRIEF", expected_item_version: "${it_v}" }
              as: Claimant
              as_user_id: "${c1}"
              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/start-review"
              as: ClaimsExaminer
              as_user_id: "examiner-1"
          trigger:
            - call: "POST /claims/${cl}/request-info"
              payload: { info_request_text: "need receipt" }
              as: ClaimsExaminer
              as_user_id: "examiner-1"
            - call: "POST /claims/${cl}/resubmit"
              payload: { proof_serial: true, proof_photo: true, proof_receipt: true, proof_description_detail: "DETAILED" }
              as: Claimant
              as_user_id: "${c1}"
            - call: "POST /claims/${cl}/start-review"
              as: ClaimsExaminer
              as_user_id: "examiner-1"
            - call: "POST /claims/${cl}/approve"
              as: ClaimsExaminer
              as_user_id: "examiner-1"
          assert:
            - "Claim.${cl} visits INFO_REQUESTED then returns to SUBMITTED (cycle), then UNDER_REVIEW, then APPROVED"
            - "Claim.${cl}.proof_score == 70 after resubmit (30+15+10+15)"
            - "Item.${it}.status == RELEASE_PENDING"
      - name: item_le_referral_cycle_return
        grounds:
          - state_machines.Item.LISTED_to_REFERRED_TO_LE
          - state_machines.Item.IN_LE_CUSTODY_to_STORED
        distinguishing_aspect: |
          Item machine branches and loops through law-enforcement custody:
          STORED -> LISTED -> REFERRED_TO_LE -> IN_LE_CUSTODY -> STORED ->
          LISTED again — a revert cycle on the Item entity, structurally
          different from the Claim info-request cycle.
        test_recipe:
          setup:
            - "TRANSIT program with LOW policy, location, one LOW item"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
