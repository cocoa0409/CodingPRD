            - call: POST /pickup-hubs
              payload: { delivery_zone_id: "${dz_hub}", name: "Covering Hub", address: "7 Wide St", slot_capacity_orders: 5, hub_window_start_at: "2026-08-08T16:00:00Z", hub_window_end_at: "2026-08-08T18:00:00Z" }
