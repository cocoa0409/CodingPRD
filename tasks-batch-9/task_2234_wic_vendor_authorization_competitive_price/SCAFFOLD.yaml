# =============================================================================
# §1.0–§1.7 Scaffold — task_2234 WIC Vendor Authorization & Competitive Price
# Management (state WIC vendor unit)
#
# Difficulty band: Expert+ (12 entities, 58 endpoints, 6 state machines,
# 12 calculations, 2 OCC races, 34 validation rows, 46 error codes, 5 roles).
# =============================================================================

scenario: "2234. WIC Vendor Authorization & Competitive Price Management (state WIC vendor unit): vendor peer group assignment by store type and volume, competitive price criteria and maximum allowable reimbursement per item, minimum stock requirement verification at monitoring visits, authorized food list mapping to UPC catalogs with formula restrictions, transaction edit rejections and vendor reimbursement adjustment, high-risk vendor identification and compliance buys, sanction schedule with disqualification and civil money penalty, vendor training requirement and reauthorization cycle"

domain_name: wic-vendor-authorization-price-management
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency

  entity_topology: flat
  # Every entity is a top-level collection linked by explicit foreign keys; no
  # entity is nested in another's URL path. Sub-resource paths appear only for
  # action endpoints (e.g. POST /vendors/{id}/authorize), never for ownership.

  state_machine_shape: cyclic
  # Vendor cycles AUTHORIZED -> REAUTH_PENDING -> AUTHORIZED and
  # AUTHORIZED -> SUSPENDED -> AUTHORIZED; PriceSubmission cycles
  # SUBMITTED -> REJECTED -> SUBMITTED; SanctionCase forks NOTICE_SERVED into
  # {CMP_ELECTED, DISQUALIFICATION_IMPOSED} and joins at CLOSED.

  relationship_patterns:
    - one_to_many          # Vendor -> PriceSubmission / MonitoringVisit / RedemptionClaim / SanctionCase
    - many_to_many         # PriceCeiling is the (PeerGroup x AuthorizedFoodItem x PriceCycle) junction
    - cross_aggregate      # SanctionCase.source_visit_id crosses the monitoring aggregate into the sanction aggregate

  role_model: segregation_of_duties
  # The analyst who creates a ReimbursementAdjustment may not apply it; the
  # investigator who opens a SanctionCase may not impose its disqualification.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# Cross-cutting constants referenced by §1.2 transitions and §1.4 validations.
# Constants that belong to a single formula are declared on that formula in §1.3.
domain_constants:
  MAX_SUBMISSION_REVISIONS: 2          # PriceSubmission REJECTED -> SUBMITTED loop bound
  CURE_PERIOD_DAYS: 30                 # cure window after a failed monitoring visit
  HIGH_RISK_FINDING_THRESHOLD: 2       # uncured findings that warrant a compliance buy
  COMPLIANCE_BUY_LEAD_DAYS: 14         # lead time of a system-created compliance buy
  MONITORING_BLACKOUT_DAYS: 7          # closed symmetric buffer between scheduled visits
  DEFAULT_LOGICAL_CLOCK: "2026-08-01T00:00:00Z"

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------- PeerGroup
  - name: PeerGroup
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Human-readable peer group code, unique across all peer groups regardless of status"
        constraints: "1..32 chars; uniqueness enforced case-sensitively"
      - name: store_type
        type: enum
        source: input
        description: "Store class this peer group covers"
        constraints: "SUPERMARKET | SUPERSTORE | MEDIUM_GROCERY | SMALL_GROCERY | PHARMACY"
      - name: min_monthly_redemption_cents
        type: integer
        source: input
        description: "Inclusive lower bound of the monthly redemption volume band"
        constraints: ">= 0"
      - name: max_monthly_redemption_cents
        type: integer
        source: input
        description: "Inclusive upper bound of the volume band; null means unbounded"
        constraints: "null or >= min_monthly_redemption_cents"
      - name: mar_method
        type: enum
        source: input
        description: "Competitive price criterion used to derive the base price for maximum allowable reimbursement"
        constraints: "PEER_MEDIAN | PEER_PERCENTILE_75 | LOWEST_HALF_AVG"
      - name: competitive_allowance_pct
        type: number
        source: input
        description: "Fractional allowance added to the base price before the statewide cap is applied"
        constraints: "0 <= value <= 0.25"
      - name: min_submissions_for_ceiling
        type: integer
        source: input
        description: "Minimum peer-group submission count required before the peer-group basis may be used"
        default: 3
        constraints: ">= 1"
      - name: min_stock_multiplier
        type: number
        source: input
        description: "Multiplier applied to each FoodCategory.min_stock_units for vendors in this peer group"
        constraints: "0.5 <= value <= 3.0"
      - name: status
        type: enum
        source: system
        description: "ACTIVE peer groups take assignments; RETIRED ones do not"
        default: ACTIVE
        constraints: "ACTIVE | RETIRED"
      - name: member_count
        type: integer
        source: computed
        description: "Denormalized count of member vendors, maintained per calculations.peer_group_member_count"
        default: 0
      - name: retired_at
        type: datetime
        source: system
        description: "Logical clock value when POST /peer-groups/{id}/retire ran; null while ACTIVE"

  # ------------------------------------------------------------- FoodCategory
  - name: FoodCategory
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Authorized-food-list category code, unique across all categories"
      - name: name
        type: string
        source: input
        description: "Display name of the food category"
      - name: is_formula
        type: boolean
        source: input
        description: "True when the category holds infant formula subject to formula restrictions"
      - name: formula_restriction_level
        type: enum
        source: input
        description: "Restriction applied to claim lines in this category"
        constraints: "NONE | CONTRACT_BRAND_ONLY | MEDICAL_DOC_REQUIRED"
      - name: min_stock_units
        type: integer
        source: input
        description: "Baseline minimum stock units required before the peer group multiplier is applied"
        constraints: ">= 0"
      - name: min_variety_count
        type: integer
        source: input
        description: "Minimum distinct varieties that must be stocked in this category"
        constraints: ">= 0"
      - name: max_units_per_transaction
        type: integer
        source: input
        description: "Per-line quantity ceiling used by transaction edit E03"
        constraints: ">= 1"
      - name: stock_required
        type: boolean
        source: input
        description: "True when this category participates in minimum stock verification at monitoring visits"

  # -------------------------------------------------------- AuthorizedFoodItem
  - name: AuthorizedFoodItem
    parent: null
    common_fields: true
    fields:
      - name: food_category_id
        type: string
        source: input
        description: "FK -> FoodCategory.id; the category whose stock and formula rules govern this UPC"
      - name: upc
        type: string
        source: input
        description: "UPC as printed on the package; unique among items with status ACTIVE"
        constraints: "8..14 digits"
      - name: brand
        type: string
        source: input
        description: "Brand label carried on the authorized food list"
      - name: container_size_oz
        type: number
        source: input
        description: "Container size in ounces"
        constraints: "> 0"
      - name: contract_brand
        type: boolean
        source: input
        description: "True when this UPC is the state contract brand for its formula category"
      - name: required_for_authorization
        type: boolean
        source: input
        description: "True when every vendor must carry an ACCEPTED price submission for this item to be authorized"
        default: false
      - name: status
        type: enum
        source: system
        description: "ACTIVE items are claimable; DELISTED items fail transaction edit E01"
        default: ACTIVE
        constraints: "ACTIVE | DELISTED"
      - name: delisted_at
        type: datetime
        source: system
        description: "Logical clock value when the item was delisted; null while ACTIVE"
      - name: delist_reason
        type: string
        source: input
        description: "Free-text reason recorded by POST /authorized-food-items/{id}/delist; null while ACTIVE"

  # ------------------------------------------------------------------- Vendor
  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - name: store_name
        type: string
        source: input
        description: "Retail store name on the WIC vendor application"
      - name: store_type
        type: enum
        source: input
        description: "Store class declared on the application; drives peer group assignment"
        constraints: "SUPERMARKET | SUPERSTORE | MEDIUM_GROCERY | SMALL_GROCERY | PHARMACY"
      - name: reported_monthly_redemption_cents
        type: integer
        source: input
        description: "Self-reported monthly WIC redemption volume used for peer group band matching"
        constraints: ">= 0"
      - name: peer_group_id
        type: string
        source: computed
        description: "FK -> PeerGroup.id; assigned by calculations.peer_group_assignment at submit-application; null before that"
      - name: authorization_status
        type: enum
        source: system
        description: "Vendor lifecycle state (see state_machines.Vendor)"
        default: APPLICANT
        constraints: "APPLICANT | IN_REVIEW | AUTHORIZED | REAUTH_PENDING | SUSPENDED | DENIED | DISQUALIFIED"
      - name: authorized_at
        type: datetime
        source: system
        description: "Logical clock value of the first successful authorize; null before"
      - name: reauthorization_due_at
        type: datetime
        source: computed
        description: "Next reauthorization deadline per calculations.reauthorization_and_training_dates"
      - name: reauth_completed_count
        type: integer
        source: computed
        description: "Number of completed reauthorization cycles"
        default: 0
      - name: training_type
        type: enum
        source: input
        description: "Type of the most recently recorded vendor training"
        constraints: "INITIAL | ANNUAL | CORRECTIVE; null before any training is recorded"
      - name: training_completed_at
        type: datetime
        source: input
        description: "Completion instant of the most recently recorded vendor training"
      - name: training_expires_at
        type: datetime
        source: computed
        description: "training_completed_at plus TRAINING_VALID_MONTHS; training is current iff clock < training_expires_at"
      - name: accepted_submission_count
        type: integer
        source: computed
        description: "Count of the vendor's PriceSubmissions with status ACCEPTED in the current price cycle"
        default: 0
      - name: price_submission_complete
        type: boolean
        source: computed
        description: "True iff the vendor has an ACCEPTED submission in the current price cycle for every ACTIVE item with required_for_authorization true"
        default: false
      - name: open_finding_count
        type: integer
        source: computed
        description: "Count of uncured monitoring findings; drives the compliance-buy threshold"
        default: 0
      - name: cure_deadline_at
        type: datetime
        source: computed
        description: "Deadline to cure the latest failed monitoring visit; null when there is nothing to cure"
      - name: compliance_buy_required
        type: boolean
        source: computed
        description: "True when a compliance buy is warranted for this vendor"
        default: false
      - name: risk_flag
        type: enum
        source: computed
        description: "Reason the vendor is flagged high risk"
        default: NONE
        constraints: "NONE | HIGH_FINDING_COUNT | HIGH_SCORE"
      - name: risk_score
        type: number
        source: computed
        description: "EPOCH variant of calculations.vendor_risk_score, refreshed only by POST /_ops/risk-run"
        default: 0.0
      - name: risk_tier
        type: enum
        source: computed
        description: "Tier derived from the EPOCH risk_score"
        default: LOW
        constraints: "LOW | ELEVATED | HIGH"
      - name: risk_epoch_at
        type: datetime
        source: computed
        description: "Logical clock value of the risk run that produced risk_score; null before the first run"
      - name: reauthorization_hold
        type: boolean
        source: computed
        description: "True while a SCHEDULED COMPLIANCE_BUY visit exists for the vendor; blocks complete-reauthorization"
        default: false
      - name: reauth_blocked_reason
        type: string
        source: computed
        description: "Explanation stamped when reauthorization_hold turns true while the vendor is REAUTH_PENDING; null otherwise"
      - name: authorization_blocked_reason
        type: string
        source: computed
        description: "Explanation stamped when the vendor's assigned peer group is retired while the vendor is IN_REVIEW; null otherwise"
      - name: recoupment_balance_cents
        type: integer
        source: computed
        description: "Sum of recoupment_cents over the vendor's ReimbursementAdjustments with status APPLIED"
        default: 0
      - name: avg_monthly_redemption_cents
        type: integer
        source: computed
        description: "Redemption average per calculations.vendor_avg_monthly_redemption; the CMP base"
        default: 0
      - name: sanction_points
        type: integer
        source: computed
        description: "Cumulative sanction points from the vendor's resolved SanctionCases"
        default: 0
      - name: disqualified_until
        type: datetime
        source: computed
        description: "End of the disqualification period; null unless a disqualification was imposed"
      - name: denial_reason
        type: string
        source: input
        description: "Reason recorded by POST /vendors/{id}/deny; null otherwise"

  # ---------------------------------------------------------------- PriceCycle
  - name: PriceCycle
    parent: null
    common_fields: true
    fields:
      - name: cycle_code
        type: string
        source: input
        description: "Cycle label, unique across all cycles"
      - name: submission_open_at
        type: datetime
        source: input
        description: "Inclusive start of the shelf-price submission window"
      - name: submission_due_at
        type: datetime
        source: input
        description: "Exclusive end of the shelf-price submission window"
        constraints: "> submission_open_at"
      - name: status
        type: enum
        source: system
        description: "Cycle lifecycle state (see state_machines.PriceCycle)"
        default: OPEN
        constraints: "OPEN | CLOSED | PUBLISHED"
      - name: closed_at
        type: datetime
        source: system
        description: "Logical clock value when the cycle was closed; null while OPEN"
      - name: published_at
        type: datetime
        source: system
        description: "Logical clock value when ceilings were published; null before PUBLISHED"
      - name: provisional_ceiling_count
        type: integer
        source: computed
        description: "PriceCeiling rows written with status PROVISIONAL at close"
        default: 0
      - name: published_ceiling_count
        type: integer
        source: computed
        description: "PriceCeiling rows written with status ACTIVE at publish"
        default: 0
      - name: skipped_pair_count
        type: integer
        source: computed
        description: "(peer group, item) pairs with an empty candidate set, for which no ceiling row was written"
        default: 0

  # ------------------------------------------------------------ PriceSubmission
  - name: PriceSubmission
    parent: null
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the vendor reporting the shelf price"
      - name: food_item_id
        type: string
        source: input
        description: "FK -> AuthorizedFoodItem.id; the item priced"
      - name: price_cycle_id
        type: string
        source: input
        description: "FK -> PriceCycle.id; the cycle the submission belongs to"
      - name: shelf_price_cents
        type: integer
        source: input
        description: "Reported shelf price in cents for one container of the item"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Submission review state (see state_machines.PriceSubmission)"
        default: SUBMITTED
        constraints: "SUBMITTED | ACCEPTED | REJECTED | VOIDED"
      - name: review_reason
        type: enum
        source: input
        description: "Reason supplied when a reviewer rejects the submission; null otherwise"
        constraints: "PRICE_IMPLAUSIBLE | MISSING_DOCUMENTATION | ABOVE_STATEWIDE_OUTLIER"
      - name: revision_count
        type: integer
        source: computed
        description: "Number of times the vendor has revised this submission after a rejection"
        default: 0
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the analyst who last reviewed the submission; null before review"
      - name: reviewed_at
        type: datetime
        source: system
        description: "Logical clock value of the last review; null before review"
      - name: voided_reason
        type: enum
        source: computed
        description: "Cascade that voided the submission; null unless status is VOIDED"
        constraints: "ITEM_DELISTED | VENDOR_DISQUALIFIED"

  # -------------------------------------------------------------- PriceCeiling
  - name: PriceCeiling
    parent: null
    common_fields: true
    fields:
      - name: peer_group_id
        type: string
        source: computed
        description: "FK -> PeerGroup.id; the peer group this ceiling applies to"
      - name: food_item_id
        type: string
        source: computed
        description: "FK -> AuthorizedFoodItem.id; the item this ceiling applies to"
      - name: price_cycle_id
        type: string
        source: computed
        description: "FK -> PriceCycle.id; the cycle that produced this ceiling"
      - name: mar_cents
        type: integer
        source: computed
        description: "Maximum allowable reimbursement per container, per calculations.maximum_allowable_reimbursement"
      - name: basis
        type: enum
        source: computed
        description: "Candidate set that produced base_cents"
        constraints: "PEER_GROUP | STATEWIDE_FALLBACK"
      - name: base_cents
        type: number
        source: computed
        description: "Unrounded base price selected by the peer group's mar_method (or the statewide fallback median)"
      - name: cap_cents
        type: number
        source: computed
        description: "Statewide cap: STATEWIDE_CAP_MULTIPLE times the minimum price of the candidate set"
      - name: cap_binding
        type: boolean
        source: computed
        description: "True when cap_cents was lower than the allowance-adjusted base and therefore decided mar_cents"
      - name: peer_submission_count
        type: integer
        source: computed
        description: "Count of qualifying submissions from the peer group itself"
      - name: contributing_submission_count
        type: integer
        source: computed
        description: "Size of the candidate set that produced base_cents (peer set, or statewide set on fallback)"
      - name: status
        type: enum
        source: computed
        description: "PROVISIONAL at cycle close, ACTIVE at publish, SUPERSEDED once replaced or invalidated"
        constraints: "PROVISIONAL | ACTIVE | SUPERSEDED"
      - name: superseded_reason
        type: enum
        source: computed
        description: "Why the ceiling was superseded; null unless status is SUPERSEDED"
        constraints: "PROVISIONAL_REPLACED | ITEM_DELISTED | NEWER_CYCLE_PUBLISHED"
      - name: effective_from
        type: datetime
        source: computed
        description: "Logical clock value at which this ceiling row became effective"

  # ------------------------------------------------------------ MonitoringVisit
  - name: MonitoringVisit
    parent: null
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the vendor being monitored"
      - name: visit_type
        type: enum
        source: input
        description: "Kind of monitoring activity"
        constraints: "ROUTINE | COMPLIANCE_BUY | HIGH_RISK_FOLLOWUP"
      - name: scheduled_for
        type: datetime
        source: input
        description: "Planned visit instant; must not be earlier than the logical clock at creation"
      - name: auto_generated
        type: boolean
        source: system
        description: "True when the visit was created by the compliance-buy cascade rather than by a client call"
        default: false
      - name: status
        type: enum
        source: system
        description: "Visit lifecycle state (see state_machines.MonitoringVisit)"
        default: SCHEDULED
        constraints: "SCHEDULED | PASSED | FAILED | CURED | ESCALATED | CANCELLED"
      - name: conducted_at
        type: datetime
        source: system
        description: "Logical clock value when the visit was conducted; null while SCHEDULED"
      - name: outcome
        type: enum
        source: computed
        description: "Verdict computed at conduct time"
        default: PENDING
        constraints: "PENDING | PASS | FAIL_MISSING_CATEGORY | FAIL_BELOW_MINIMUM | FAIL_PRICE_OVERCHARGE"
      - name: stock_findings
        type: array
        source: computed
        description: "Per-category observation objects {food_category_id, observed_units, observed_variety_count, required_units, verdict}; required_units and verdict are stamped at conduct"
      - name: stock_compliance_pct
        type: number
        source: computed
        description: "Share of stock-required categories that passed, per calculations.minimum_stock_verification"
        default: 0.0
      - name: buy_items
        type: array
        source: input
        description: "Compliance-buy basket objects {upc, quantity, charged_unit_price_cents} supplied at conduct; empty for other visit types"
      - name: overcharge_cents
        type: integer
        source: computed
        description: "Overcharge found in the compliance buy, per calculations.compliance_buy_overcharge"
        default: 0
      - name: cancelled_reason
        type: enum
        source: computed
        description: "Cascade that cancelled the visit; null unless status is CANCELLED"
        constraints: "VENDOR_DISQUALIFIED"

  # ----------------------------------------------------------- RedemptionClaim
  - name: RedemptionClaim
    parent: null
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the vendor claiming reimbursement"
      - name: claim_month
        type: string
        source: input
        description: "Benefit month of the redemptions, formatted YYYY-MM"
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: governing_price_cycle_id
        type: string
        source: computed
        description: "FK -> PriceCycle.id; cycle selected at adjudication per calculations.claim_line_edit_adjudication; null before adjudication"
      - name: line_count
        type: integer
        source: computed
        description: "Number of ClaimLine rows created with the claim"
      - name: submitted_total_cents
        type: integer
        source: computed
        description: "Sum over lines of quantity times charged_unit_price_cents"
      - name: adjudicated_total_cents
        type: integer
        source: computed
        description: "Sum of allowed_cents over lines after edits; null before adjudication"
      - name: net_payable_cents
        type: integer
        source: computed
        description: "adjudicated_total_cents less the recoupment of all APPLIED adjustments; null before adjudication"
      - name: accepted_line_count
        type: integer
        source: computed
        description: "Lines with edit_result ACCEPTED"
        default: 0
      - name: reduced_line_count
        type: integer
        source: computed
        description: "Lines with edit_result ACCEPTED_REDUCED"
        default: 0
      - name: rejected_line_count
        type: integer
        source: computed
        description: "Lines with edit_result REJECTED"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle state (see state_machines.RedemptionClaim)"
        default: SUBMITTED
        constraints: "SUBMITTED | ADJUDICATED | ADJUSTED | PAID"
      - name: adjudicated_at
        type: datetime
        source: system
        description: "Logical clock value of adjudication; null before"
      - name: paid_at
        type: datetime
        source: system
        description: "Logical clock value when the claim was marked paid; null before"

  # ---------------------------------------------------------------- ClaimLine
  - name: ClaimLine
    parent: null
    common_fields: true
    fields:
      - name: redemption_claim_id
        type: string
        source: computed
        description: "FK -> RedemptionClaim.id; the claim this line belongs to"
      - name: line_number
        type: integer
        source: input
        description: "1-based position of the line within the claim payload; unique within the claim"
        constraints: ">= 1"
      - name: upc
        type: string
        source: input
        description: "UPC as scanned at the register; resolved against AuthorizedFoodItem.upc at adjudication"
      - name: food_item_id
        type: string
        source: computed
        description: "FK -> AuthorizedFoodItem.id; resolved from upc at adjudication; null when the UPC does not resolve"
      - name: quantity
        type: integer
        source: input
        description: "Containers redeemed on this line"
      - name: charged_unit_price_cents
        type: integer
        source: input
        description: "Price per container charged by the vendor"
        constraints: ">= 0"
      - name: medical_doc_on_file
        type: boolean
        source: input
        description: "True when medical documentation supports an exempt-formula line"
        default: false
      - name: edit_result
        type: enum
        source: computed
        description: "Transaction edit outcome for this line"
        default: PENDING
        constraints: "PENDING | ACCEPTED | ACCEPTED_REDUCED | REJECTED"
      - name: edit_code
        type: enum
        source: computed
        description: "First failing edit code, or E05 when the line was reduced to the ceiling; null when fully accepted"
        constraints: "E01 | E02 | E03 | E04 | E05"
      - name: applied_mar_cents
        type: integer
        source: computed
        description: "mar_cents of the ACTIVE PriceCeiling used for this line; null when no ceiling was consulted"
      - name: allowed_cents
        type: integer
        source: computed
        description: "Reimbursable amount for the line after edits"
        default: 0
      - name: recouped_cents
        type: integer
        source: computed
        description: "Cumulative recoupment charged to this line by APPLIED adjustments"
        default: 0

  # ------------------------------------------------- ReimbursementAdjustment
  - name: ReimbursementAdjustment
    parent: null
    common_fields: true
    fields:
      - name: redemption_claim_id
        type: string
        source: input
        description: "FK -> RedemptionClaim.id; the adjudicated claim being adjusted"
      - name: reason_code
        type: enum
        source: input
        description: "Why the adjustment was raised"
        constraints: "OVERCHARGE | EDIT_ERROR | COMPLIANCE_BUY_FINDING | CMP_OFFSET"
      - name: recoupment_rate
        type: number
        source: input
        description: "Fraction of each accepted line's allowed_cents to recoup"
        constraints: "0 < value <= 1"
      - name: recoupment_cents
        type: integer
        source: computed
        description: "Total recoupment per calculations.adjustment_proration"
      - name: line_recoupments
        type: array
        source: computed
        description: "Per-line objects {claim_line_id, allowed_cents, recoupment_cents} in ascending line_number order"
      - name: status
        type: enum
        source: system
        description: "Adjustment lifecycle state (see state_machines.ReimbursementAdjustment)"
        default: PENDING
        constraints: "PENDING | APPLIED | REVERSED"
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the staff member who created the adjustment"
      - name: applied_by_user_id
        type: string
        source: system
        description: "X-User-ID of the supervisor who applied the adjustment; null before"
      - name: applied_at
        type: datetime
        source: system
        description: "Logical clock value when the adjustment was applied; null before"
      - name: reversed_at
        type: datetime
        source: system
        description: "Logical clock value when the adjustment was reversed; null before"
      - name: reversal_reason
        type: string
        source: input
        description: "Reason recorded when the adjustment is reversed; null otherwise"

  # -------------------------------------------------------------- SanctionCase
  - name: SanctionCase
    parent: null
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the vendor under sanction"
      - name: source_visit_id
        type: string
        source: input
        description: "FK -> MonitoringVisit.id; the visit that produced the finding; null for cases opened without a visit"
      - name: violation_code
        type: enum
        source: input
        description: "Violation class from the sanction schedule"
        constraints: "CLASS_A | CLASS_B | CLASS_C | CLASS_D"
      - name: narrative
        type: string
        source: input
        description: "Investigator narrative supporting the case"
      - name: base_tier
        type: integer
        source: computed
        description: "Schedule tier for violation_code, per calculations.civil_money_penalty"
        constraints: "1..4"
      - name: case_points
        type: integer
        source: computed
        description: "Sanction points assigned by base_tier"
      - name: cumulative_points_at_open
        type: integer
        source: computed
        description: "Vendor sanction points from prior resolved cases, snapshotted when this case was opened"
      - name: effective_tier
        type: integer
        source: computed
        description: "base_tier plus the escalation step, capped at 4"
        constraints: "1..4"
      - name: disqualification_months
        type: integer
        source: computed
        description: "Disqualification length for effective_tier; 0 means disqualification is unavailable"
      - name: cmp_amount_cents
        type: integer
        source: computed
        description: "Civil money penalty per calculations.civil_money_penalty"
      - name: cmp_permitted
        type: boolean
        source: computed
        description: "False for CLASS_A violations, which may not be settled by civil money penalty"
      - name: cmp_paid_cents
        type: integer
        source: computed
        description: "Civil money penalty received so far"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Case lifecycle state (see state_machines.SanctionCase)"
        default: OPENED
        constraints: "OPENED | NOTICE_SERVED | CMP_ELECTED | DISQUALIFICATION_IMPOSED | CLOSED | DISMISSED"
      - name: resolution
        type: enum
        source: computed
        description: "How the case resolved"
        default: NONE
        constraints: "NONE | CMP | DISQUALIFICATION | DISMISSED"
      - name: opened_by_user_id
        type: string
        source: system
        description: "X-User-ID of the investigator who opened the case, or the literal SYSTEM for cascade-opened cases"
      - name: notice_served_at
        type: datetime
        source: system
        description: "Logical clock value when the sanction notice was served; null before"
      - name: response_due_at
        type: datetime
        source: computed
        description: "notice_served_at plus CMP_ELECTION_DAYS; the vendor's election deadline"
      - name: dismissal_reason
        type: string
        source: input
        description: "Reason recorded when the case is dismissed; null otherwise"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ------------------------------------------------------------------ Vendor
  - entity: Vendor
    initial_state: APPLICANT
    terminal_states: [DENIED, DISQUALIFIED]
    transitions:
      - from: APPLICANT
        to: IN_REVIEW
        trigger: "POST /vendors/{id}/submit-application"
        actor: VendorUnitAnalyst
        preconditions:
          - "authorization_status == APPLICANT"
          - "calculations.peer_group_assignment finds a non-empty candidate set, else ERR_NO_PEER_GROUP_MATCH"
        side_effects:
          - "peer_group_id set to the peer group selected by calculations.peer_group_assignment"
          - "price_submission_complete recomputed (false while no required item has an ACCEPTED submission)"
          - "authorization_blocked_reason set to null"

      - from: IN_REVIEW
        to: AUTHORIZED
        trigger: "POST /vendors/{id}/authorize"
        actor: VendorUnitSupervisor
        preconditions:
          - "authorization_status == IN_REVIEW"
          - "training is current: training_expires_at is not null and clock < training_expires_at, else ERR_VENDOR_TRAINING_EXPIRED"
          - "no SanctionCase for this vendor with status IN {OPENED, NOTICE_SERVED}, else ERR_OPEN_SANCTION_CASE_EXISTS"
          - "PeerGroup(peer_group_id).status == ACTIVE, else ERR_PEER_GROUP_RETIRED"
          - "price_submission_complete == true, else ERR_PRICE_SUBMISSIONS_INCOMPLETE"
        side_effects:
          - "authorized_at set to the logical clock"
          - "reauthorization_due_at set to authorized_at plus REAUTH_CYCLE_MONTHS per calculations.reauthorization_and_training_dates"
          - "PeerGroup(peer_group_id).member_count incremented by 1 per calculations.peer_group_member_count; PeerGroup.version incremented by 1"
          - "avg_monthly_redemption_cents recomputed per calculations.vendor_avg_monthly_redemption"

      - from: IN_REVIEW
        to: DENIED
        trigger: "POST /vendors/{id}/deny"
        actor: VendorUnitSupervisor
        preconditions:
          - "authorization_status IN {IN_REVIEW, REAUTH_PENDING}"
        side_effects:
          - "denial_reason stored from the request body"
          - "every PriceSubmission of this vendor with status IN {SUBMITTED, ACCEPTED} whose PriceCycle.status IN {OPEN, CLOSED} moves to VOIDED with voided_reason VENDOR_DISQUALIFIED"
          - "when the vendor was REAUTH_PENDING, PeerGroup(peer_group_id).member_count decremented by 1 and PeerGroup.version incremented by 1"

      - from: REAUTH_PENDING
        to: DENIED
        trigger: "POST /vendors/{id}/deny"
        actor: VendorUnitSupervisor
        preconditions:
          - "authorization_status IN {IN_REVIEW, REAUTH_PENDING}"
        side_effects:
          - "same side effects as the IN_REVIEW to DENIED transition"

      - from: AUTHORIZED
        to: REAUTH_PENDING
        trigger: "POST /vendors/{id}/start-reauthorization"
        actor: VendorUnitAnalyst
        preconditions:
          - "authorization_status == AUTHORIZED"
          - "clock >= reauthorization_due_at minus REAUTH_WINDOW_DAYS, else ERR_REAUTH_WINDOW_NOT_OPEN"
        side_effects:
          - "accepted_submission_count and price_submission_complete recomputed against the current price cycle"
          - "reauth_blocked_reason set to PENDING_COMPLIANCE_BUY when reauthorization_hold is already true, otherwise null"

      - from: REAUTH_PENDING
        to: AUTHORIZED
        trigger: "POST /vendors/{id}/complete-reauthorization"
        actor: VendorUnitSupervisor
        preconditions:
          - "authorization_status == REAUTH_PENDING"
          - "training is current: clock < training_expires_at, else ERR_VENDOR_TRAINING_EXPIRED"
          - "no SanctionCase for this vendor with status IN {OPENED, NOTICE_SERVED}, else ERR_OPEN_SANCTION_CASE_EXISTS"
          - "reauthorization_hold == false, else ERR_REAUTHORIZATION_HOLD"
          - "PeerGroup(peer_group_id).status == ACTIVE, else ERR_PEER_GROUP_RETIRED"
          - "price_submission_complete == true against the current price cycle, else ERR_PRICE_SUBMISSIONS_INCOMPLETE"
        side_effects:
          - "reauthorization_due_at advanced by REAUTH_CYCLE_MONTHS from its own previous value, not from the logical clock"
          - "reauth_completed_count incremented by 1"
          - "reauth_blocked_reason set to null"
        note: "This closes the Vendor cycle AUTHORIZED -> REAUTH_PENDING -> AUTHORIZED."

      - from: AUTHORIZED
        to: SUSPENDED
        trigger: "system: POST /sanction-cases/{id}/serve-notice on a case whose base_tier == 4"
        actor: system
        preconditions:
          - "authorization_status == AUTHORIZED"
          - "SanctionCase.base_tier == 4"
        side_effects:
          - "PeerGroup.member_count unchanged (SUSPENDED vendors remain peer group members)"

      - from: AUTHORIZED
        to: SUSPENDED
        trigger: "system: POST /_ops/risk-run escalates a FAILED visit whose cure deadline lapsed"
        actor: system
        preconditions:
          - "authorization_status == AUTHORIZED"
          - "a MonitoringVisit with status FAILED exists whose vendor cure_deadline_at is not null and clock > cure_deadline_at"
        side_effects:
          - "the lapsed MonitoringVisit moves to ESCALATED"
          - "a SanctionCase is opened with violation_code CLASS_C, opened_by_user_id SYSTEM and source_visit_id set to the escalated visit"

      - from: SUSPENDED
        to: AUTHORIZED
        trigger: "system: POST /sanction-cases/{id}/dismiss, or POST /monitoring-visits/{id}/conduct on a HIGH_RISK_FOLLOWUP visit whose outcome is PASS"
        actor: system
        preconditions:
          - "authorization_status == SUSPENDED"
          - "no remaining SanctionCase for this vendor with status IN {OPENED, NOTICE_SERVED}"
        side_effects:
          - "risk_flag reset to NONE"

      - from: AUTHORIZED
        to: DISQUALIFIED
        trigger: "POST /sanction-cases/{id}/impose-disqualification"
        actor: VendorUnitSupervisor
        preconditions:
          - "authorization_status IN {AUTHORIZED, REAUTH_PENDING, SUSPENDED}"
          - "SanctionCase.disqualification_months > 0, else ERR_DISQUALIFICATION_NOT_AVAILABLE"
        side_effects:
          - "disqualified_until set to clock plus SanctionCase.disqualification_months calendar months"
          - "sanction_points incremented by SanctionCase.case_points"
          - "PeerGroup(peer_group_id).member_count decremented by 1; PeerGroup.version incremented by 1"
          - "every MonitoringVisit of this vendor with status SCHEDULED moves to CANCELLED with cancelled_reason VENDOR_DISQUALIFIED"
          - "because those visits are cancelled, compliance_buy_required is set to false and reauthorization_hold is recomputed to false"
          - "every PriceSubmission of this vendor with status IN {SUBMITTED, ACCEPTED} whose PriceCycle.status IN {OPEN, CLOSED} moves to VOIDED with voided_reason VENDOR_DISQUALIFIED"

      - from: SUSPENDED
        to: DISQUALIFIED
        trigger: "POST /sanction-cases/{id}/impose-disqualification"
        actor: VendorUnitSupervisor
        preconditions:
          - "authorization_status IN {AUTHORIZED, REAUTH_PENDING, SUSPENDED}"
        side_effects:
          - "same side effects as the AUTHORIZED to DISQUALIFIED transition"

      - from: REAUTH_PENDING
        to: DISQUALIFIED
        trigger: "POST /sanction-cases/{id}/impose-disqualification"
        actor: VendorUnitSupervisor
        preconditions:
          - "authorization_status IN {AUTHORIZED, REAUTH_PENDING, SUSPENDED}"
        side_effects:
          - "same side effects as the AUTHORIZED to DISQUALIFIED transition"

  # -------------------------------------------------------------- PriceCycle
  - entity: PriceCycle
    initial_state: OPEN
    terminal_states: [PUBLISHED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /price-cycles/{id}/close"
        actor: VendorUnitSupervisor
        preconditions:
          - "status == OPEN, else ERR_INVALID_CYCLE_STATE"
        side_effects:
          - "closed_at set to the logical clock"
          - "for every (ACTIVE PeerGroup, ACTIVE AuthorizedFoodItem) pair with a non-empty candidate set, a PriceCeiling row is written with status PROVISIONAL using the PROVISIONAL variant of calculations.maximum_allowable_reimbursement"
          - "provisional_ceiling_count and skipped_pair_count set from that sweep"

      - from: CLOSED
        to: PUBLISHED
        trigger: "POST /price-cycles/{id}/publish-ceilings"
        actor: VendorUnitSupervisor
        preconditions:
          - "status == CLOSED, else ERR_INVALID_CYCLE_STATE"
        side_effects:
          - "published_at set to the logical clock"
          - "every PriceCeiling of this cycle with status PROVISIONAL moves to SUPERSEDED with superseded_reason PROVISIONAL_REPLACED"
          - "for every (ACTIVE PeerGroup, ACTIVE AuthorizedFoodItem) pair with a non-empty candidate set, a PriceCeiling row is written with status ACTIVE using the FINAL variant of calculations.maximum_allowable_reimbursement"
          - "every PriceCeiling from an earlier cycle with status ACTIVE for a (peer group, item) pair published now moves to SUPERSEDED with superseded_reason NEWER_CYCLE_PUBLISHED"
          - "published_ceiling_count and skipped_pair_count set from that sweep"

  # ---------------------------------------------------------- PriceSubmission
  - entity: PriceSubmission
    initial_state: SUBMITTED
    terminal_states: [VOIDED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /price-submissions/{id}/review with decision ACCEPT"
        actor: VendorUnitAnalyst
        preconditions:
          - "status == SUBMITTED, else ERR_INVALID_SUBMISSION_STATE"
        side_effects:
          - "reviewed_by_user_id and reviewed_at stamped"
          - "Vendor(vendor_id).accepted_submission_count and price_submission_complete recomputed"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /price-submissions/{id}/review with decision REJECT"
        actor: VendorUnitAnalyst
        preconditions:
          - "status == SUBMITTED, else ERR_INVALID_SUBMISSION_STATE"
          - "review_reason present in the request body, else ERR_INVALID_REQUEST"
        side_effects:
          - "review_reason stored; reviewed_by_user_id and reviewed_at stamped"
          - "Vendor(vendor_id).accepted_submission_count and price_submission_complete recomputed"

      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /price-submissions/{id}/revise"
        actor: VendorOperator
        preconditions:
          - "status == REJECTED, else ERR_INVALID_SUBMISSION_STATE"
          - "revision_count < MAX_SUBMISSION_REVISIONS, else ERR_REVISION_LIMIT_REACHED"
          - "PriceCycle(price_cycle_id).status == OPEN and submission_open_at <= clock < submission_due_at, else ERR_SUBMISSION_WINDOW_CLOSED"
        side_effects:
          - "shelf_price_cents replaced; revision_count incremented by 1; review_reason, reviewed_by_user_id and reviewed_at reset to null"
        note: "This closes the PriceSubmission cycle SUBMITTED -> REJECTED -> SUBMITTED, bounded by MAX_SUBMISSION_REVISIONS."

      - from: SUBMITTED
        to: VOIDED
        trigger: "system: POST /authorized-food-items/{id}/delist cascade, or vendor DENIED/DISQUALIFIED cascade"
        actor: system
        preconditions:
          - "PriceCycle(price_cycle_id).status IN {OPEN, CLOSED}"
        side_effects:
          - "voided_reason set to ITEM_DELISTED or VENDOR_DISQUALIFIED depending on the originating cascade"
          - "Vendor(vendor_id).accepted_submission_count and price_submission_complete recomputed"

      - from: ACCEPTED
        to: VOIDED
        trigger: "system: POST /authorized-food-items/{id}/delist cascade, or vendor DENIED/DISQUALIFIED cascade"
        actor: system
        preconditions:
          - "PriceCycle(price_cycle_id).status IN {OPEN, CLOSED}"
        side_effects:
          - "voided_reason set; Vendor(vendor_id).accepted_submission_count decremented and price_submission_complete recomputed to false when a required item lost its ACCEPTED submission"

  # --------------------------------------------------------- MonitoringVisit
  - entity: MonitoringVisit
    initial_state: SCHEDULED
    terminal_states: [PASSED, CURED, ESCALATED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /monitoring-visits/{id}/conduct where calculations.minimum_stock_verification yields PASS and calculations.compliance_buy_overcharge yields 0"
        actor: VendorUnitAnalyst
        preconditions:
          - "status == SCHEDULED, else ERR_INVALID_VISIT_STATE"
          - "Vendor(vendor_id).authorization_status IN {AUTHORIZED, REAUTH_PENDING, SUSPENDED}, else ERR_VENDOR_NOT_MONITORABLE"
        side_effects:
          - "conducted_at stamped; outcome PASS; stock_findings verdicts and stock_compliance_pct stamped"
          - "when visit_type == HIGH_RISK_FOLLOWUP: every MonitoringVisit of the same vendor with status FAILED moves to CURED, then Vendor.open_finding_count is reset to 0 and cure_deadline_at to null, then compliance_buy_required is set to false and risk_flag to NONE, then any SCHEDULED COMPLIANCE_BUY visit is left untouched and reauthorization_hold is recomputed"
          - "when the vendor is SUSPENDED and has no SanctionCase in {OPENED, NOTICE_SERVED}, Vendor.authorization_status returns to AUTHORIZED"

      - from: SCHEDULED
        to: FAILED
        trigger: "POST /monitoring-visits/{id}/conduct where the computed outcome is FAIL_MISSING_CATEGORY, FAIL_BELOW_MINIMUM or FAIL_PRICE_OVERCHARGE"
        actor: VendorUnitAnalyst
        preconditions:
          - "status == SCHEDULED, else ERR_INVALID_VISIT_STATE"
          - "Vendor(vendor_id).authorization_status IN {AUTHORIZED, REAUTH_PENDING, SUSPENDED}, else ERR_VENDOR_NOT_MONITORABLE"
        side_effects:
          - "hop 1: conducted_at, outcome, stock_findings verdicts, stock_compliance_pct and overcharge_cents stamped; Vendor.open_finding_count incremented by 1 and Vendor.cure_deadline_at set to clock plus CURE_PERIOD_DAYS"
          - "hop 2: because open_finding_count now reaches HIGH_RISK_FINDING_THRESHOLD, Vendor.compliance_buy_required flips to true and Vendor.risk_flag becomes HIGH_FINDING_COUNT"
          - "hop 3: because compliance_buy_required flipped to true, the system creates a MonitoringVisit for the same vendor with visit_type COMPLIANCE_BUY, status SCHEDULED, auto_generated true and scheduled_for clock plus COMPLIANCE_BUY_LEAD_DAYS (the blackout rule in validations does not apply to system-created visits)"
          - "hop 4: because a SCHEDULED COMPLIANCE_BUY visit now exists, Vendor.reauthorization_hold flips to true, and when the vendor is REAUTH_PENDING its reauth_blocked_reason is set to PENDING_COMPLIANCE_BUY"
        note: "Hops 2 to 4 fire only when the threshold in hop 2 is actually crossed; the first failing visit stops after hop 1."

      - from: FAILED
        to: CURED
        trigger: "system: POST /monitoring-visits/{id}/conduct on a later HIGH_RISK_FOLLOWUP visit of the same vendor whose outcome is PASS"
        actor: system
        preconditions:
          - "status == FAILED"
          - "Vendor.cure_deadline_at is not null and clock <= Vendor.cure_deadline_at"
        side_effects:
          - "Vendor.open_finding_count reset to 0 and cure_deadline_at set to null"

      - from: FAILED
        to: ESCALATED
        trigger: "system: POST /_ops/risk-run when clock > Vendor.cure_deadline_at"
        actor: system
        preconditions:
          - "status == FAILED"
          - "Vendor.cure_deadline_at is not null and clock > Vendor.cure_deadline_at"
        side_effects:
          - "a SanctionCase is opened for the vendor with violation_code CLASS_C, source_visit_id set to this visit and opened_by_user_id SYSTEM"
          - "because a case is now open, Vendor.authorization_status moves AUTHORIZED -> SUSPENDED"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: vendor disqualification cascade"
        actor: system
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "cancelled_reason set to VENDOR_DISQUALIFIED"

  # -------------------------------------------------------- RedemptionClaim
  - entity: RedemptionClaim
    initial_state: SUBMITTED
    terminal_states: [PAID]
    transitions:
      - from: SUBMITTED
        to: ADJUDICATED
        trigger: "POST /redemption-claims/{id}/adjudicate"
        actor: VendorUnitAnalyst
        preconditions:
          - "status == SUBMITTED, else ERR_INVALID_CLAIM_STATE"
          - "a PriceCycle with status PUBLISHED and published_at <= clock exists, else ERR_NO_PUBLISHED_PRICE_CYCLE"
        side_effects:
          - "governing_price_cycle_id, adjudicated_at stamped"
          - "each ClaimLine gets food_item_id, edit_result, edit_code, applied_mar_cents and allowed_cents per calculations.claim_line_edit_adjudication"
          - "adjudicated_total_cents, net_payable_cents, accepted_line_count, reduced_line_count and rejected_line_count set per calculations.claim_adjudicated_totals"

      - from: ADJUDICATED
        to: ADJUSTED
        trigger: "POST /reimbursement-adjustments/{id}/apply"
        actor: VendorUnitSupervisor
        preconditions:
          - "status == ADJUDICATED"
        side_effects:
          - "net_payable_cents reduced by the adjustment's recoupment_cents; each line's recouped_cents increased by its share"
          - "Vendor.recoupment_balance_cents increased by recoupment_cents"

      - from: ADJUSTED
        to: ADJUDICATED
        trigger: "POST /reimbursement-adjustments/{id}/reverse on the only APPLIED adjustment of the claim"
        actor: VendorUnitSupervisor
        preconditions:
          - "status == ADJUSTED"
          - "no other ReimbursementAdjustment of this claim remains in status APPLIED"
        side_effects:
          - "net_payable_cents restored to adjudicated_total_cents; each line's recouped_cents reduced by its share back to 0"
          - "Vendor.recoupment_balance_cents reduced by recoupment_cents"
        note: "Compensating transition; calculations.adjustment_proration pins the invariant that must hold afterwards."

      - from: ADJUDICATED
        to: PAID
        trigger: "POST /redemption-claims/{id}/mark-paid"
        actor: VendorUnitSupervisor
        preconditions:
          - "status IN {ADJUDICATED, ADJUSTED}, else ERR_INVALID_CLAIM_STATE"
        side_effects:
          - "paid_at stamped; further adjustments are refused with ERR_CLAIM_ALREADY_PAID"

      - from: ADJUSTED
        to: PAID
        trigger: "POST /redemption-claims/{id}/mark-paid"
        actor: VendorUnitSupervisor
        preconditions:
          - "status IN {ADJUDICATED, ADJUSTED}"
        side_effects:
          - "paid_at stamped; further adjustments are refused with ERR_CLAIM_ALREADY_PAID"

  # ------------------------------------------------- ReimbursementAdjustment
  - entity: ReimbursementAdjustment
    initial_state: PENDING
    terminal_states: [REVERSED]
    transitions:
      - from: PENDING
        to: APPLIED
        trigger: "POST /reimbursement-adjustments/{id}/apply"
        actor: VendorUnitSupervisor
        preconditions:
          - "status == PENDING, else ERR_INVALID_ADJUSTMENT_STATE"
          - "X-User-ID != created_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "RedemptionClaim.status == ADJUDICATED, else ERR_INVALID_CLAIM_STATE"
          - "recoupment_cents <= RedemptionClaim.net_payable_cents, else ERR_RECOUPMENT_EXCEEDS_PAYABLE"
        side_effects:
          - "applied_by_user_id and applied_at stamped"
          - "RedemptionClaim moves ADJUDICATED -> ADJUSTED with its money side effects"
          - "Vendor.recoupment_balance_cents increased by recoupment_cents"

      - from: APPLIED
        to: REVERSED
        trigger: "POST /reimbursement-adjustments/{id}/reverse"
        actor: VendorUnitSupervisor
        preconditions:
          - "status == APPLIED, else ERR_INVALID_ADJUSTMENT_STATE"
          - "RedemptionClaim.status == ADJUSTED, else ERR_INVALID_CLAIM_STATE"
        side_effects:
          - "reversed_at and reversal_reason stamped"
          - "RedemptionClaim money side effects reversed exactly; RedemptionClaim moves ADJUSTED -> ADJUDICATED when no other adjustment stays APPLIED"
          - "Vendor.recoupment_balance_cents reduced by recoupment_cents"

  # ------------------------------------------------------------ SanctionCase
  - entity: SanctionCase
    initial_state: OPENED
    terminal_states: [CLOSED, DISMISSED]
    transitions:
      - from: OPENED
        to: NOTICE_SERVED
        trigger: "POST /sanction-cases/{id}/serve-notice"
        actor: ComplianceInvestigator
        preconditions:
          - "status == OPENED, else ERR_INVALID_SANCTION_STATE"
        side_effects:
          - "notice_served_at stamped; response_due_at set to notice_served_at plus CMP_ELECTION_DAYS"
          - "when base_tier == 4, Vendor.authorization_status moves AUTHORIZED -> SUSPENDED"

      - from: NOTICE_SERVED
        to: CMP_ELECTED
        trigger: "POST /sanction-cases/{id}/elect-cmp"
        actor: VendorOperator
        preconditions:
          - "status == NOTICE_SERVED, else ERR_INVALID_SANCTION_STATE"
          - "cmp_permitted == true, else ERR_CMP_NOT_PERMITTED"
          - "clock <= response_due_at, else ERR_CMP_ELECTION_WINDOW_EXPIRED"
        side_effects:
          - "resolution set to CMP; Vendor.authorization_status unchanged; PeerGroup.member_count unchanged"
        note: "Fork branch A. Divergent side-effect set from branch B: the vendor keeps operating and owes cmp_amount_cents."

      - from: NOTICE_SERVED
        to: DISQUALIFICATION_IMPOSED
        trigger: "POST /sanction-cases/{id}/impose-disqualification"
        actor: VendorUnitSupervisor
        preconditions:
          - "status == NOTICE_SERVED, else ERR_INVALID_SANCTION_STATE"
          - "X-User-ID != opened_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "violation_code == CLASS_A or clock > response_due_at, else ERR_ELECTION_WINDOW_OPEN"
          - "disqualification_months > 0, else ERR_DISQUALIFICATION_NOT_AVAILABLE"
        side_effects:
          - "resolution set to DISQUALIFICATION; the full Vendor disqualification cascade fires (see state_machines.Vendor AUTHORIZED -> DISQUALIFIED)"
        note: "Fork branch B. Divergent side-effect set from branch A: vendor DISQUALIFIED, member_count decremented, visits cancelled, submissions voided."

      - from: NOTICE_SERVED
        to: DISMISSED
        trigger: "POST /sanction-cases/{id}/dismiss"
        actor: ComplianceInvestigator
        preconditions:
          - "status == NOTICE_SERVED, else ERR_INVALID_SANCTION_STATE"
        side_effects:
          - "resolution set to DISMISSED; dismissal_reason stored; no sanction points are added"
          - "when the vendor is SUSPENDED and no other case of the vendor is in {OPENED, NOTICE_SERVED}, Vendor.authorization_status returns to AUTHORIZED"

      - from: CMP_ELECTED
        to: CLOSED
        trigger: "POST /sanction-cases/{id}/close with cmp_payment_cents"
        actor: VendorUnitSupervisor
        preconditions:
          - "status IN {CMP_ELECTED, DISQUALIFICATION_IMPOSED}, else ERR_INVALID_SANCTION_STATE"
          - "cmp_paid_cents plus cmp_payment_cents >= cmp_amount_cents, else ERR_CMP_UNDERPAID"
        side_effects:
          - "cmp_paid_cents increased by cmp_payment_cents"
          - "Vendor.sanction_points incremented by case_points"
        note: "Join point of the fork; the CMP branch adds sanction points only at close."

      - from: DISQUALIFICATION_IMPOSED
        to: CLOSED
        trigger: "POST /sanction-cases/{id}/close with no cmp_payment_cents"
        actor: VendorUnitSupervisor
        preconditions:
          - "status IN {CMP_ELECTED, DISQUALIFICATION_IMPOSED}"
        side_effects:
          - "no money moves; Vendor.sanction_points already incremented by the disqualification transition and is not incremented again"
        note: "Join point of the fork reached from branch B."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned
# write-write conflict mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: adjustment-create-stale-claim
    parent_entity: RedemptionClaim
    write_endpoint: "POST /reimbursement-adjustments"
    occ_field: "expected_claim_version"
    description: |
      Creating a ReimbursementAdjustment against a RedemptionClaim whose version
      has advanced since the client last observed it is rejected. A claim may
      legitimately carry several adjustments, so a second create is not blocked
      by any state precondition; the stale expected_claim_version is what the
      server rejects, because the recoupment base (net_payable_cents) may
      already have moved.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412

  - rule_id: sanction-open-stale-vendor
    parent_entity: Vendor
    write_endpoint: "POST /sanction-cases"
    occ_field: "expected_vendor_version"
    description: |
      Opening a SanctionCase against a Vendor whose version has advanced since
      the client last observed it is rejected. The vendor's sanction points,
      risk epoch and finding count all feed the tier escalation computed at
      open time, so a case opened from a stale vendor view would be tiered on
      superseded data.
    error_id: ERR_STALE_VENDOR_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: peer_group_assignment
    trigger: "POST /vendors/{id}/submit-application"
    algorithm: selector_policy
    formula: |
      # (a) eligibility filter
      candidates = [pg for pg in PeerGroup
                    if pg.status == 'ACTIVE'
                    and pg.store_type == vendor.store_type
                    and pg.min_monthly_redemption_cents <= vendor.reported_monthly_redemption_cents
                    and (pg.max_monthly_redemption_cents is None
                         or vendor.reported_monthly_redemption_cents <= pg.max_monthly_redemption_cents)]
      # both band bounds are INCLUSIVE; a null max is treated as UNBOUNDED_BAND_SENTINEL_CENTS
      # (b) ranking expression
      band_width(pg) = (pg.max_monthly_redemption_cents
                        if pg.max_monthly_redemption_cents is not None
                        else UNBOUNDED_BAND_SENTINEL_CENTS) - pg.min_monthly_redemption_cents
      sort candidates by (band_width ASC,
                          pg.min_monthly_redemption_cents ASC,
                          pg.created_at ASC)          # (c) tie-breaks, in this order
      # (d) empty-set fallback
      if candidates is empty: reject with ERR_NO_PEER_GROUP_MATCH (422)
      vendor.peer_group_id = candidates[0].id
    input_set: "PeerGroup rows with status == ACTIVE only; RETIRED peer groups never enter the candidate set"
    constants:
      UNBOUNDED_BAND_SENTINEL_CENTS: 1000000000000
    precision: "integer cents; no rounding"
    variants: []

  - name: maximum_allowable_reimbursement
    trigger: "POST /price-cycles/{id}/close (PROVISIONAL variant) and POST /price-cycles/{id}/publish-ceilings (FINAL variant)"
    algorithm: tiered_pricing
    formula: |
      # Evaluated once per (peer_group pg, item it) pair where pg.status == 'ACTIVE'
      # and it.status == 'ACTIVE'. `allowed_statuses` comes from the variant.
      peer_prices = sorted([s.shelf_price_cents for s in PriceSubmission
                            if s.price_cycle_id == cycle.id
                            and s.food_item_id == it.id
                            and s.status in allowed_statuses
                            and Vendor(s.vendor_id).peer_group_id == pg.id
                            and Vendor(s.vendor_id).authorization_status in
                                {'IN_REVIEW','AUTHORIZED','REAUTH_PENDING'}],
                           key=lambda p: (p, submission.created_at))   # ASC, created_at tie-break
      peer_n = len(peer_prices)
      if peer_n == 0:
          skip this pair entirely (no PriceCeiling row); cycle.skipped_pair_count += 1
      if peer_n >= pg.min_submissions_for_ceiling:
          basis = 'PEER_GROUP';        candidate = peer_prices
      else:
          basis = 'STATEWIDE_FALLBACK'
          candidate = sorted(same filter but WITHOUT the peer_group_id restriction,
                             restricted to vendors whose peer group has status ACTIVE)
      if pg.mar_method == 'PEER_MEDIAN':
          base = median(candidate)          # odd n -> middle element;
                                            # even n -> mean of the two middle elements
      elif pg.mar_method == 'PEER_PERCENTILE_75':
          base = candidate[ceil(0.75 * len(candidate)) - 1]     # nearest-rank, 1-indexed
      else:  # 'LOWEST_HALF_AVG'
          k = ceil(len(candidate) / 2)
          base = sum(candidate[0:k]) / k
      # STEP ORDER IS PINNED: allowance first, then the statewide cap, then ONE rounding
      uncapped     = base * (1 + pg.competitive_allowance_pct)
      cap          = STATEWIDE_CAP_MULTIPLE * candidate[0]     # min of the SAME candidate set
      cap_binding  = cap < uncapped
      mar_cents    = round_half_up(min(uncapped, cap))          # single rounding, to whole cents
      peer_submission_count         = peer_n
      contributing_submission_count = len(candidate)
    input_set: |
      PROVISIONAL variant: submissions with status IN {SUBMITTED, ACCEPTED}.
      FINAL variant: submissions with status ACCEPTED only. VOIDED and REJECTED
      submissions never enter either set. In both variants the submitting vendor
      must be IN_REVIEW, AUTHORIZED or REAUTH_PENDING at evaluation time.
    constants:
      STATEWIDE_CAP_MULTIPLE: 1.25
    precision: "base_cents and cap_cents kept unrounded (decimal); mar_cents is a whole-cent integer, round_half_up applied exactly once at the end"
    variants:
      - name: PROVISIONAL
        when: "POST /price-cycles/{id}/close — a preview written with PriceCeiling.status PROVISIONAL"
        difference: "Includes submissions still awaiting review (status SUBMITTED) alongside ACCEPTED ones, so both base and the cap's minimum can differ from the FINAL variant on identical data."
      - name: FINAL
        when: "POST /price-cycles/{id}/publish-ceilings — written with PriceCeiling.status ACTIVE"
        difference: "Counts only ACCEPTED submissions; a submission that was never reviewed drops out, shifting the median and the cap base."

  - name: claim_line_edit_adjudication
    trigger: "POST /redemption-claims/{id}/adjudicate"
    algorithm: chronological
    formula: |
      # governing cycle selection (pinned, deterministic)
      published = [c for c in PriceCycle if c.status == 'PUBLISHED' and c.published_at <= clock]
      if not published: reject with ERR_NO_PUBLISHED_PRICE_CYCLE (409)
      governing = max(published, key=lambda c: (c.published_at, -inverse(c.created_at)))
      # i.e. greatest published_at; ties broken by created_at ASC
      claim.governing_price_cycle_id = governing.id

      # lines are processed in ascending line_number
      for line in sorted(claim.lines, key=lambda l: l.line_number):
          item = AuthorizedFoodItem where upc == line.upc          # unique among ACTIVE items
          line.food_item_id = item.id if item is not None else None
          cat  = FoodCategory(item.food_category_id) if item else None
          ceiling = PriceCeiling where peer_group_id == Vendor(claim.vendor_id).peer_group_id
                                   and food_item_id == item.id
                                   and price_cycle_id == governing.id
                                   and status == 'ACTIVE'
          # EDIT ORDER IS PINNED — the FIRST failing edit decides edit_code
          if item is None or item.status == 'DELISTED':
              line.edit_result, line.edit_code, line.allowed_cents = 'REJECTED', 'E01', 0
          elif cat.is_formula and (
                 (cat.formula_restriction_level == 'CONTRACT_BRAND_ONLY' and not item.contract_brand)
              or (cat.formula_restriction_level == 'MEDICAL_DOC_REQUIRED' and not line.medical_doc_on_file)):
              line.edit_result, line.edit_code, line.allowed_cents = 'REJECTED', 'E02', 0
          elif line.quantity <= 0 or line.quantity > cat.max_units_per_transaction:
              line.edit_result, line.edit_code, line.allowed_cents = 'REJECTED', 'E03', 0
          elif ceiling is None:
              line.edit_result, line.edit_code, line.allowed_cents = 'REJECTED', 'E04', 0
          else:
              line.applied_mar_cents = ceiling.mar_cents
              if line.charged_unit_price_cents > ceiling.mar_cents:
                  line.edit_result, line.edit_code = 'ACCEPTED_REDUCED', 'E05'
                  line.allowed_cents = ceiling.mar_cents * line.quantity
              else:   # equality is ACCEPTED at full price — the boundary is `>`, not `>=`
                  line.edit_result, line.edit_code = 'ACCEPTED', None
                  line.allowed_cents = line.charged_unit_price_cents * line.quantity
    input_set: "All ClaimLine rows of the claim; item resolution uses AuthorizedFoodItem.upc with the item's CURRENT status, not its status during claim_month"
    constants: {}
    precision: "integer cents throughout; no rounding (quantity times unit price is exact)"
    variants: []

  - name: claim_adjudicated_totals
    trigger: "POST /redemption-claims/{id}/adjudicate, after every line has been edited"
    algorithm: aggregation
    formula: |
      submitted_total_cents  = sum(l.quantity * l.charged_unit_price_cents for l in lines)   # set at claim creation
      adjudicated_total_cents = sum(l.allowed_cents for l in lines)
      net_payable_cents       = adjudicated_total_cents
                                - sum(a.recoupment_cents for a in adjustments if a.status == 'APPLIED')
      accepted_line_count = count(l for l in lines if l.edit_result == 'ACCEPTED')
      reduced_line_count  = count(l for l in lines if l.edit_result == 'ACCEPTED_REDUCED')
      rejected_line_count = count(l for l in lines if l.edit_result == 'REJECTED')
    input_set: "Every ClaimLine of the claim, regardless of edit_result; adjustment statuses restricted to APPLIED"
    constants: {}
    precision: "integer cents; no rounding"
    variants: []

  - name: minimum_stock_verification
    trigger: "POST /monitoring-visits/{id}/conduct"
    algorithm: threshold
    formula: |
      required = [c for c in FoodCategory if c.stock_required is True]     # ordered by c.code ASC
      mult     = PeerGroup(Vendor(visit.vendor_id).peer_group_id).min_stock_multiplier
      passing  = 0
      any_missing = False
      for c in required:
          obs = the entry of visit.stock_findings with food_category_id == c.id   # at most one
          required_units = ceil(c.min_stock_units * mult)
          if obs is None:
              verdict = 'MISSING'; any_missing = True
          elif obs.observed_units < required_units:
              verdict = 'BELOW_UNITS'
          elif obs.observed_variety_count < c.min_variety_count:
              verdict = 'BELOW_VARIETY'
          else:
              verdict = 'PASS'; passing += 1
          stamp verdict and required_units on the stock_findings entry (creating a
          MISSING entry with observed_units 0 and observed_variety_count 0 when absent)
      stock_compliance_pct = 100.0 if len(required) == 0
                             else round_half_up(100 * passing / len(required), 1)
      if any_missing:                       outcome = 'FAIL_MISSING_CATEGORY'
      elif passing < len(required):         outcome = 'FAIL_BELOW_MINIMUM'
      elif visit.overcharge_cents > 0:      outcome = 'FAIL_PRICE_OVERCHARGE'
      else:                                 outcome = 'PASS'
    input_set: "FoodCategory rows with stock_required == true (all of them, globally); observations recorded on the visit via POST /monitoring-visits/{id}/observations"
    constants: {}
    precision: "required_units is an integer via ceil; stock_compliance_pct is one decimal place, round_half_up; an empty required set yields exactly 100.0"
    variants: []

  - name: compliance_buy_overcharge
    trigger: "POST /monitoring-visits/{id}/conduct when buy_items is non-empty"
    algorithm: aggregation
    formula: |
      governing = the PriceCycle with status PUBLISHED and greatest published_at <= clock
                  (ties broken by created_at ASC); if none, overcharge_cents = 0
      overcharge_cents = 0
      for b in buy_items (in payload order):
          item    = AuthorizedFoodItem where upc == b.upc
          ceiling = PriceCeiling where peer_group_id == Vendor(visit.vendor_id).peer_group_id
                                   and food_item_id == item.id
                                   and price_cycle_id == governing.id
                                   and status == 'ACTIVE'
          if item is None or ceiling is None: continue      # unpriced items contribute 0
          overcharge_cents += max(0, b.charged_unit_price_cents - ceiling.mar_cents) * b.quantity
    input_set: "buy_items supplied in the conduct payload; only ACTIVE ceilings of the governing published cycle are consulted"
    constants: {}
    precision: "integer cents; no rounding"
    variants: []

  - name: adjustment_proration
    trigger: "POST /reimbursement-adjustments (computes recoupment_cents and line_recoupments)"
    algorithm: waterfall_allocation
    formula: |
      base_lines = [l for l in claim.lines
                    if l.edit_result in {'ACCEPTED', 'ACCEPTED_REDUCED'}]
      sort base_lines by line_number ASC
      # ROUNDING ORDER IS PINNED: round PER LINE first, then sum. The residual
      # difference against round_half_up(total * rate) is NOT redistributed.
      line_recoupments = [{claim_line_id: l.id,
                           allowed_cents: l.allowed_cents,
                           recoupment_cents: round_half_up(l.allowed_cents * rate)}
                          for l in base_lines]
      recoupment_cents = sum(r.recoupment_cents for r in line_recoupments)
      # invariant checked at apply/reverse time:
      #   claim.adjudicated_total_cents
      #     == claim.net_payable_cents
      #        + sum(a.recoupment_cents for a in claim.adjustments if a.status == 'APPLIED')
      #   vendor.recoupment_balance_cents
      #     == sum(a.recoupment_cents for a in vendor's adjustments if a.status == 'APPLIED')
    input_set: "ClaimLine rows with edit_result IN {ACCEPTED, ACCEPTED_REDUCED}; REJECTED lines are excluded and contribute nothing"
    constants: {}
    precision: "each line rounded to whole cents with round_half_up, then summed; summing first and rounding once is explicitly NOT the rule"
    variants: []

  - name: vendor_risk_score
    trigger: "GET /vendors/{id}/risk-profile (ROLLING variant) and POST /_ops/risk-run (EPOCH variant, persisted on Vendor)"
    algorithm: weighted_scoring
    formula: |
      # window_end / status filter come from the variant
      lines   = ClaimLine rows of the vendor's RedemptionClaims whose status IN
                {'ADJUDICATED','ADJUSTED','PAID'} and whose claim.adjudicated_at
                is within (window_start, window_end]
      total_lines = len(lines)
      edit_rejection_rate_pct = 0 if total_lines == 0
                                else 100 * count(l.edit_result == 'REJECTED') / total_lines
      price_excess_pct        = 0 if total_lines == 0
                                else 100 * count(l.edit_code == 'E05') / total_lines
      visits  = MonitoringVisit rows of the vendor with status IN
                {'PASSED','FAILED','CURED','ESCALATED'} and conducted_at within
                (window_start, window_end]
      failed_visit_pct = 0 if len(visits) == 0
                         else 100 * count(v.status IN {'FAILED','ESCALATED'}) / len(visits)
      points = vendor.sanction_points
      raw = (W_EDIT * edit_rejection_rate_pct
             + W_PRICE * price_excess_pct
             + W_VISIT * failed_visit_pct
             + POINT_WEIGHT * min(POINT_CAP, points))
      risk_score = min(100.0, round_half_up(raw, 1))
      risk_tier  = 'HIGH'     if risk_score >= HIGH_TIER_MIN      # >= , not >
                   else 'ELEVATED' if risk_score >= ELEVATED_TIER_MIN
                   else 'LOW'
      window_start = window_end minus RISK_WINDOW_DAYS
    input_set: |
      ROLLING variant: window_end = the logical clock at request time.
      EPOCH variant: window_end = the logical clock at the risk run that last
      touched the vendor (persisted as Vendor.risk_epoch_at); records created
      after that run are invisible to Vendor.risk_score / Vendor.risk_tier until
      the next POST /_ops/risk-run.
    constants:
      W_EDIT: 0.40
      W_PRICE: 0.25
      W_VISIT: 0.20
      POINT_WEIGHT: 15.0
      POINT_CAP: 2
      RISK_WINDOW_DAYS: 180
      ELEVATED_TIER_MIN: 30.0
      HIGH_TIER_MIN: 60.0
    precision: "one decimal place, round_half_up, applied once to the weighted sum; the tier comparison uses >= on the rounded score"
    variants:
      - name: ROLLING
        when: "GET /vendors/{id}/risk-profile with basis omitted or basis=ROLLING"
        difference: "Evaluated live against the logical clock, so a claim adjudicated one second ago is already counted; never persisted."
      - name: EPOCH
        when: "POST /_ops/risk-run writes Vendor.risk_score, risk_tier, risk_epoch_at; GET /vendors/{id}/risk-profile with basis=EPOCH replays that snapshot"
        difference: "Frozen at the last risk run, so the persisted tier — the one that gates compliance-buy eligibility — can lag the ROLLING tier by a whole epoch."

  - name: civil_money_penalty
    trigger: "POST /sanction-cases (computes base_tier, case_points, cumulative_points_at_open, effective_tier, disqualification_months, cmp_amount_cents, cmp_permitted)"
    algorithm: threshold
    formula: |
      # EVALUATION ORDER IS PINNED to break the apparent circularity
      # (tier -> points -> total points -> tier). There is exactly one pass:
      #   1. base_tier  = BASE_TIER_BY_VIOLATION[violation_code]
      #   2. case_points = POINTS_BY_BASE_TIER[base_tier]        # from BASE tier, never effective
      #   3. cumulative_points_at_open = sum(POINTS_BY_BASE_TIER[c.base_tier]
      #        for c in vendor's other SanctionCases
      #        if c.status IN {'CMP_ELECTED','DISQUALIFICATION_IMPOSED','CLOSED'})
      #   4. escalation_step = count(t for t in ESCALATION_THRESHOLDS
      #        if cumulative_points_at_open + case_points >= t)   # >= , not >
      #   5. effective_tier = min(4, base_tier + escalation_step)
      #   6. no re-iteration: case_points is NOT recomputed from effective_tier
      disqualification_months = DISQ_MONTHS_BY_TIER[effective_tier]
      cmp_permitted           = (violation_code != 'CLASS_A')
      cmp_amount_cents = min(CMP_CAP_CENTS,
                             round_half_up(vendor.avg_monthly_redemption_cents
                                           * CMP_MULTIPLIER_BY_TIER[effective_tier]
                                           * CMP_MONTHS_BY_TIER[effective_tier]))
    input_set: "The vendor's other SanctionCases with status IN {CMP_ELECTED, DISQUALIFICATION_IMPOSED, CLOSED}; cases in OPENED, NOTICE_SERVED or DISMISSED contribute zero points"
    constants:
      BASE_TIER_BY_VIOLATION: { CLASS_A: 4, CLASS_B: 3, CLASS_C: 2, CLASS_D: 1 }
      POINTS_BY_BASE_TIER: { 1: 1, 2: 2, 3: 4, 4: 8 }
      ESCALATION_THRESHOLDS: [4, 8]
      DISQ_MONTHS_BY_TIER: { 1: 0, 2: 6, 3: 12, 4: 36 }
      CMP_MULTIPLIER_BY_TIER: { 1: 0.05, 2: 0.10, 3: 0.25, 4: 0.50 }
      CMP_MONTHS_BY_TIER: { 1: 1, 2: 3, 3: 6, 4: 12 }
      CMP_CAP_CENTS: 5625000
      CMP_ELECTION_DAYS: 15
    precision: "whole cents, round_half_up applied once before the cap comparison"
    variants: []

  - name: vendor_avg_monthly_redemption
    trigger: "POST /vendors/{id}/authorize, POST /redemption-claims/{id}/adjudicate, POST /sanction-cases, POST /_ops/risk-run"
    algorithm: aggregation
    formula: |
      months = the AVG_REDEMPTION_MONTHS greatest distinct claim_month values among
               the vendor's RedemptionClaims whose status IN {'ADJUDICATED','ADJUSTED','PAID'}
               (string compare DESC on claim_month)
      claims = those claims whose claim_month is in `months`
      if len(claims) == 0:
          avg_monthly_redemption_cents = vendor.reported_monthly_redemption_cents
      else:
          avg_monthly_redemption_cents = round_half_up(
              sum(c.adjudicated_total_cents for c in claims) / len(months))
    input_set: "RedemptionClaims with status IN {ADJUDICATED, ADJUSTED, PAID}; SUBMITTED claims are excluded and never affect the CMP base"
    constants:
      AVG_REDEMPTION_MONTHS: 6
    precision: "whole cents, round_half_up; divides by the number of distinct months, not the number of claims"
    variants: []

  - name: reauthorization_and_training_dates
    trigger: "POST /vendors/{id}/record-training, POST /vendors/{id}/authorize, POST /vendors/{id}/complete-reauthorization"
    algorithm: interval_merge
    formula: |
      # calendar-month arithmetic: add N months to the same day-of-month, clamping
      # to the last valid day of the target month; time-of-day preserved
      on record-training:  training_expires_at = add_months(training_completed_at, TRAINING_VALID_MONTHS)
      on authorize:        reauthorization_due_at = add_months(authorized_at, REAUTH_CYCLE_MONTHS)
      on complete-reauth:  reauthorization_due_at = add_months(previous reauthorization_due_at,
                                                              REAUTH_CYCLE_MONTHS)
      # start-reauthorization gate (inclusive):
      reauth_window_open  = clock >= reauthorization_due_at - REAUTH_WINDOW_DAYS
      # training currency (strict): current iff clock < training_expires_at
    input_set: "Only the vendor's own training and authorization timestamps; reauthorization anchors on the previous due date so cycles never drift"
    constants:
      TRAINING_VALID_MONTHS: 12
      REAUTH_CYCLE_MONTHS: 36
      REAUTH_WINDOW_DAYS: 90
    precision: "instants stored as ISO 8601 UTC with three fractional digits"
    variants: []

  - name: price_submission_completeness
    trigger: "POST /price-submissions/{id}/review, POST /vendors/{id}/submit-application, POST /vendors/{id}/start-reauthorization, POST /authorized-food-items/{id}/delist, and every vendor authorization decision"
    algorithm: aggregation
    formula: |
      # governing cycle for completeness (deterministic, independent of cycle status):
      candidates = [c for c in PriceCycle
                    if c.status IN {'OPEN','CLOSED','PUBLISHED'}
                    and c.submission_open_at <= clock]
      governing = max(candidates, key=lambda c: (c.submission_open_at, c.created_at))
      required_items = [it for it in AuthorizedFoodItem
                        if it.status == 'ACTIVE' and it.required_for_authorization is True]
      accepted_submission_count = count(s for s in PriceSubmission
                                        if s.vendor_id == vendor.id
                                        and s.price_cycle_id == governing.id
                                        and s.status == 'ACCEPTED')
      price_submission_complete = (
          True if len(candidates) == 0                     # no cycle exists yet: vacuously complete
          else all(exists s in PriceSubmission with s.vendor_id == vendor.id
                   and s.price_cycle_id == governing.id
                   and s.food_item_id == it.id
                   and s.status == 'ACCEPTED'
                   for it in required_items))
      # an empty required_items set also yields True
    input_set: "PriceSubmissions with status ACCEPTED in the governing cycle only; SUBMITTED, REJECTED and VOIDED submissions never count, and items with status DELISTED drop out of required_items"
    constants: {}
    precision: "integer count; the boolean is a strict all-of over the required item set"
    variants: []

  - name: peer_group_member_count
    trigger: "Vendor transitions into or out of {AUTHORIZED, REAUTH_PENDING, SUSPENDED}"
    algorithm: aggregation
    formula: |
      PeerGroup.member_count = count(v for v in Vendor
                                     if v.peer_group_id == pg.id
                                     and v.authorization_status IN
                                         {'AUTHORIZED','REAUTH_PENDING','SUSPENDED'})
      # global invariant, checked after every forward/compensating pair:
      #   sum(pg.member_count for pg in PeerGroup)
      #     == count(v for v in Vendor if v.peer_group_id is not None
      #              and v.authorization_status IN {'AUTHORIZED','REAUTH_PENDING','SUSPENDED'})
    input_set: "Vendors with a non-null peer_group_id; APPLICANT, IN_REVIEW, DENIED and DISQUALIFIED vendors are excluded"
    constants: {}
    precision: "integer count"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority; the first
# failing rule decides the response)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For role VendorOperator, X-User-ID equals the vendor_id of the addressed resource (Vendor, PriceSubmission, RedemptionClaim, ClaimLine, SanctionCase) or of the body's vendor_id"
    error_id: ERR_VENDOR_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all endpoints whose roles include VendorOperator"

  - priority: 4
    category: auth
    check: "visit_type COMPLIANCE_BUY may only be created by ComplianceInvestigator"
    error_id: ERR_FORBIDDEN_VISIT_TYPE
    http_status: 403
    applies_to: "POST /monitoring-visits"

  - priority: 5
    category: existence
    check: "Path resource ids resolve, left to right"
    error_id: ERR_VENDOR_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterised endpoints (the error_id names the first unresolved segment: ERR_PEER_GROUP_NOT_FOUND, ERR_FOOD_CATEGORY_NOT_FOUND, ERR_FOOD_ITEM_NOT_FOUND, ERR_VENDOR_NOT_FOUND, ERR_PRICE_CYCLE_NOT_FOUND, ERR_PRICE_SUBMISSION_NOT_FOUND, ERR_PRICE_CEILING_NOT_FOUND, ERR_VISIT_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_CLAIM_LINE_NOT_FOUND, ERR_ADJUSTMENT_NOT_FOUND, ERR_SANCTION_CASE_NOT_FOUND)"

  - priority: 6
    category: existence
    check: "Body foreign keys resolve, in the field order declared by the endpoint's input list"
    error_id: ERR_FOOD_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "POST /authorized-food-items, POST /price-submissions, POST /monitoring-visits, POST /monitoring-visits/{id}/observations, POST /redemption-claims, POST /reimbursement-adjustments, POST /sanction-cases"

  - priority: 7
    category: business_constraint
    check: "Request shape: required fields present, enums in range, integers non-negative, recoupment_rate in (0,1], competitive_allowance_pct in [0,0.25], claim lines non-empty with unique line_number, limit in [1,100], offset >= 0, claim_month matches YYYY-MM"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 8
    category: business_constraint
    check: "PeerGroup.code is unique across all peer groups"
    error_id: ERR_DUPLICATE_PEER_GROUP_CODE
    http_status: 409
    applies_to: "POST /peer-groups"

  - priority: 9
    category: business_constraint
    check: "FoodCategory.code is unique across all categories"
    error_id: ERR_DUPLICATE_FOOD_CATEGORY_CODE
    http_status: 409
    applies_to: "POST /food-categories"

  - priority: 10
    category: business_constraint
    check: "AuthorizedFoodItem.upc is unique among items with status ACTIVE"
    error_id: ERR_DUPLICATE_UPC
    http_status: 409
    applies_to: "POST /authorized-food-items"

  - priority: 11
    category: business_constraint
    check: "PriceCycle.cycle_code is unique across all cycles"
    error_id: ERR_DUPLICATE_CYCLE_CODE
    http_status: 409
    applies_to: "POST /price-cycles"

  - priority: 12
    category: business_temporal
    check: "submission_open_at < submission_due_at"
    error_id: ERR_INVALID_CYCLE_WINDOW
    http_status: 422
    applies_to: "POST /price-cycles"

  - priority: 13
    category: business_temporal
    check: "The new cycle's HALF-OPEN window [submission_open_at, submission_due_at) must not intersect the half-open window of any existing cycle with status IN {OPEN, CLOSED, PUBLISHED}; a new window starting exactly at an existing window's submission_due_at is allowed"
    error_id: ERR_CYCLE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /price-cycles"

  - priority: 14
    category: state
    check: "expected_claim_version equals RedemptionClaim.version"
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412
    applies_to: "POST /reimbursement-adjustments"

  - priority: 15
    category: state
    check: "expected_vendor_version equals Vendor.version"
    error_id: ERR_STALE_VENDOR_VERSION
    http_status: 412
    applies_to: "POST /sanction-cases"

  - priority: 16
    category: state
    check: "The addressed entity is in a from-state that permits the requested transition (see §1.2)"
    error_id: ERR_INVALID_VENDOR_STATE
    http_status: 409
    applies_to: "all action endpoints (the error_id names the entity: ERR_INVALID_VENDOR_STATE, ERR_INVALID_CYCLE_STATE, ERR_INVALID_SUBMISSION_STATE, ERR_INVALID_VISIT_STATE, ERR_INVALID_CLAIM_STATE, ERR_INVALID_ADJUSTMENT_STATE, ERR_INVALID_SANCTION_STATE)"

  - priority: 17
    category: state
    check: "The referenced RedemptionClaim has left SUBMITTED, i.e. its status IN {ADJUDICATED, ADJUSTED, PAID} — adjudication must have run before any adjustment exists"
    error_id: ERR_CLAIM_NOT_ADJUDICATED
    http_status: 409
    applies_to: "POST /reimbursement-adjustments"

  - priority: 18
    category: state
    check: "The referenced RedemptionClaim has not been marked paid"
    error_id: ERR_CLAIM_ALREADY_PAID
    http_status: 409
    applies_to: "POST /reimbursement-adjustments, POST /reimbursement-adjustments/{id}/apply, POST /reimbursement-adjustments/{id}/reverse"

  - priority: 19
    category: state
    check: "The vendor is monitorable: authorization_status IN {AUTHORIZED, REAUTH_PENDING, SUSPENDED}"
    error_id: ERR_VENDOR_NOT_MONITORABLE
    http_status: 409
    applies_to: "POST /monitoring-visits, POST /monitoring-visits/{id}/conduct, POST /redemption-claims"

  - priority: 20
    category: auth
    check: "Segregation of duties: X-User-ID differs from ReimbursementAdjustment.created_by_user_id when applying, and from SanctionCase.opened_by_user_id when imposing disqualification"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /reimbursement-adjustments/{id}/apply, POST /sanction-cases/{id}/impose-disqualification"

  - priority: 21
    category: business_safety
    check: "Vendor training is current: training_expires_at is not null and clock < training_expires_at"
    error_id: ERR_VENDOR_TRAINING_EXPIRED
    http_status: 409
    applies_to: "POST /vendors/{id}/authorize, POST /vendors/{id}/complete-reauthorization"

  - priority: 22
    category: business_safety
    check: "No SanctionCase of this vendor has status IN {OPENED, NOTICE_SERVED}"
    error_id: ERR_OPEN_SANCTION_CASE_EXISTS
    http_status: 409
    applies_to: "POST /vendors/{id}/authorize, POST /vendors/{id}/complete-reauthorization, POST /sanction-cases"

  - priority: 23
    category: business_safety
    check: "A vendor whose disqualification period has not elapsed (clock < disqualified_until) may not be re-entered into review"
    error_id: ERR_VENDOR_DISQUALIFIED
    http_status: 409
    applies_to: "POST /vendors/{id}/submit-application, POST /price-submissions, POST /redemption-claims"

  - priority: 24
    category: business_safety
    check: "A COMPLIANCE_BUY visit may be scheduled only when compliance_buy_required is true or risk_tier is HIGH"
    error_id: ERR_COMPLIANCE_BUY_NOT_WARRANTED
    http_status: 409
    applies_to: "POST /monitoring-visits"

  - priority: 25
    category: business_safety
    check: "Civil money penalty may not settle a CLASS_A violation (cmp_permitted is false)"
    error_id: ERR_CMP_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /sanction-cases/{id}/elect-cmp"

  - priority: 26
    category: business_temporal
    check: "The CMP election window is still open: clock <= response_due_at"
    error_id: ERR_CMP_ELECTION_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /sanction-cases/{id}/elect-cmp"

  - priority: 27
    category: business_temporal
    check: "Disqualification may be imposed only after the election window closes (clock > response_due_at), unless violation_code is CLASS_A"
    error_id: ERR_ELECTION_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /sanction-cases/{id}/impose-disqualification"

  - priority: 28
    category: business_constraint
    check: "DISQ_MONTHS_BY_TIER[effective_tier] is greater than zero"
    error_id: ERR_DISQUALIFICATION_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /sanction-cases/{id}/impose-disqualification"

  - priority: 29
    category: business_temporal
    check: "scheduled_for is not earlier than the logical clock"
    error_id: ERR_VISIT_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /monitoring-visits"

  - priority: 30
    category: business_temporal
    check: "No other MonitoringVisit of the same vendor with status SCHEDULED lies within the CLOSED symmetric buffer of MONITORING_BLACKOUT_DAYS around scheduled_for: reject when abs(existing.scheduled_for - new.scheduled_for) <= 7 days. System-created compliance-buy visits bypass this rule."
    error_id: ERR_VISIT_BLACKOUT_CONFLICT
    http_status: 409
    applies_to: "POST /monitoring-visits"

  - priority: 31
    category: business_constraint
    check: "At most one observation per (visit, food_category_id) pair"
    error_id: ERR_DUPLICATE_OBSERVATION
    http_status: 409
    applies_to: "POST /monitoring-visits/{id}/observations"

  - priority: 32
    category: business_temporal
    check: "PriceCycle.status == OPEN and submission_open_at <= clock < submission_due_at (half-open window)"
    error_id: ERR_SUBMISSION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /price-submissions, POST /price-submissions/{id}/revise"

  - priority: 33
    category: business_constraint
    check: "No other PriceSubmission exists for the same (vendor_id, food_item_id, price_cycle_id) with status IN {SUBMITTED, ACCEPTED, REJECTED}"
    error_id: ERR_DUPLICATE_PRICE_SUBMISSION
    http_status: 409
    applies_to: "POST /price-submissions"

  - priority: 34
    category: business_constraint
    check: "revision_count < MAX_SUBMISSION_REVISIONS (2)"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /price-submissions/{id}/revise"

  - priority: 35
    category: business_referential
    check: "The vendor's assigned PeerGroup has status ACTIVE"
    error_id: ERR_PEER_GROUP_RETIRED
    http_status: 409
    applies_to: "POST /vendors/{id}/authorize, POST /vendors/{id}/complete-reauthorization"

  - priority: 36
    category: business_referential
    check: "price_submission_complete is true against the current price cycle"
    error_id: ERR_PRICE_SUBMISSIONS_INCOMPLETE
    http_status: 409
    applies_to: "POST /vendors/{id}/authorize, POST /vendors/{id}/complete-reauthorization"

  - priority: 37
    category: business_referential
    check: "calculations.peer_group_assignment yields a non-empty candidate set"
    error_id: ERR_NO_PEER_GROUP_MATCH
    http_status: 422
    applies_to: "POST /vendors/{id}/submit-application"

  - priority: 38
    category: business_referential
    check: "A PriceCycle with status PUBLISHED and published_at <= clock exists"
    error_id: ERR_NO_PUBLISHED_PRICE_CYCLE
    http_status: 409
    applies_to: "POST /redemption-claims/{id}/adjudicate"

  - priority: 39
    category: business_referential
    check: "reauthorization_hold is false"
    error_id: ERR_REAUTHORIZATION_HOLD
    http_status: 409
    applies_to: "POST /vendors/{id}/complete-reauthorization"

  - priority: 40
    category: business_temporal
    check: "clock >= reauthorization_due_at minus REAUTH_WINDOW_DAYS (inclusive)"
    error_id: ERR_REAUTH_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /vendors/{id}/start-reauthorization"

  - priority: 41
    category: business_fiscal
    check: "The adjustment's computed recoupment_cents does not exceed the claim's net_payable_cents (treated as 0 when the claim has not been adjudicated)"
    error_id: ERR_RECOUPMENT_EXCEEDS_PAYABLE
    http_status: 422
    applies_to: "POST /reimbursement-adjustments, POST /reimbursement-adjustments/{id}/apply"

  - priority: 42
    category: business_fiscal
    check: "cmp_paid_cents plus cmp_payment_cents >= cmp_amount_cents when closing from CMP_ELECTED"
    error_id: ERR_CMP_UNDERPAID
    http_status: 409
    applies_to: "POST /sanction-cases/{id}/close"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---------------------------------------------------------------- peer groups
  - method: POST
    path: "/peer-groups"
    description: "Create a vendor peer group with its store type, volume band, competitive price criterion and minimum stock multiplier"
    roles: [VendorUnitSupervisor]
    code: 201
    input: [code, store_type, min_monthly_redemption_cents, max_monthly_redemption_cents, mar_method, competitive_allowance_pct, "min_submissions_for_ceiling?", min_stock_multiplier]
    output: PeerGroup
    side_effects: ["status initialised to ACTIVE", "member_count initialised to 0"]

  - method: GET
    path: "/peer-groups/{id}"
    description: "Read one peer group including its denormalized member_count"
    roles: [VendorUnitAnalyst, VendorUnitSupervisor, ComplianceInvestigator]
    code: 200
    input: []
    output: PeerGroup
    side_effects: []

  - method: GET
    path: "/peer-groups"
    description: "List peer groups with filtering and pagination"
    roles: [VendorUnitAnalyst, VendorUnitSupervisor, ComplianceInvestigator]
    code: 200
    input: ["store_type?", "status?", "limit?", "offset?"]
    output: PeerGroup[]
    side_effects: []

  - method: POST
    path: "/peer-groups/{id}/retire"
    description: "Retire a peer group so it stops taking assignments and blocks authorization of its members under review"
    roles: [VendorUnitSupervisor]
    code: 200
    input: []
    output: PeerGroup
    side_effects:
      - "status set to RETIRED and retired_at stamped"
      - "every Vendor with this peer_group_id and authorization_status IN {IN_REVIEW, REAUTH_PENDING} gets authorization_blocked_reason PEER_GROUP_RETIRED"

  # ------------------------------------------------------------ food catalogue
  - method: POST
    path: "/food-categories"
    description: "Create an authorized food list category with its minimum stock rule, formula restriction and per-transaction quantity ceiling"
    roles: [VendorUnitSupervisor]
    code: 201
    input: [code, name, is_formula, formula_restriction_level, min_stock_units, min_variety_count, max_units_per_transaction, stock_required]
    output: FoodCategory
    side_effects: []

  - method: GET
    path: "/food-categories/{id}"
    description: "Read one food category"
    roles: [VendorUnitAnalyst, VendorUnitSupervisor, ComplianceInvestigator, VendorOperator]
    code: 200
    input: []
    output: FoodCategory
    side_effects: []

  - method: POST
    path: "/authorized-food-items"
    description: "Map a UPC into the authorized food list under a category"
    roles: [VendorUnitSupervisor]
    code: 201
    input: [food_category_id, upc, brand, container_size_oz, contract_brand, "required_for_authorization?"]
    output: AuthorizedFoodItem
    side_effects: ["status initialised to ACTIVE"]

  - method: GET
    path: "/authorized-food-items/{id}"
    description: "Read one authorized food list item"
    roles: [VendorUnitAnalyst, VendorUnitSupervisor, ComplianceInvestigator, VendorOperator]
    code: 200
    input: []
    output: AuthorizedFoodItem
    side_effects: []

  - method: GET
    path: "/authorized-food-items"
    description: "List authorized food list items, filterable by category, UPC and status"
    roles: [VendorUnitAnalyst, VendorUnitSupervisor, ComplianceInvestigator, VendorOperator]
    code: 200
    input: ["food_category_id?", "upc?", "status?", "limit?", "offset?"]
    output: AuthorizedFoodItem[]
    side_effects: []

  - method: POST
    path: "/authorized-food-items/{id}/delist"
    description: "Delist a UPC from the authorized food list, cascading through ceilings, submissions and vendor authorization readiness"
    roles: [VendorUnitSupervisor]
    code: 200
    input: [delist_reason]
    output: AuthorizedFoodItem
    side_effects:
      - "hop 1: status set to DELISTED, delisted_at and delist_reason stamped"
      - "hop 2: because the item is DELISTED, every PriceCeiling for it with status IN {PROVISIONAL, ACTIVE} moves to SUPERSEDED with superseded_reason ITEM_DELISTED"
      - "hop 3: because no ceiling remains as an adjudication basis, every PriceSubmission for the item with status IN {SUBMITTED, ACCEPTED} whose PriceCycle.status IN {OPEN, CLOSED} moves to VOIDED with voided_reason ITEM_DELISTED"
      - "hop 4: because those submissions were voided, each affected Vendor's accepted_submission_count is decremented and price_submission_complete is recomputed (turning false when the delisted item had required_for_authorization true)"

  # --------------------------------------------------------------------- vendors
  - method: POST
    path: "/vendors"
    description: "Record a WIC vendor application"
    roles: [VendorUnitAnalyst]
    code: 201
    input: [store_name, store_type, reported_monthly_redemption_cents]
    output: Vendor
    side_effects: ["authorization_status initialised to APPLICANT", "risk_score 0.0 and risk_tier LOW"]

  - method: GET
    path: "/vendors/{id}"
    description: "Read one vendor with its computed authorization, training, risk and money fields"
    roles: [VendorUnitAnalyst, VendorUnitSupervisor, ComplianceInvestigator, VendorOperator]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: GET
    path: "/vendors"
    description: "List vendors, filterable by peer group, authorization status and risk tier"
    roles: [VendorUnitAnalyst, VendorUnitSupervisor, ComplianceInvestigator]
    code: 200
    input: ["peer_group_id?", "authorization_status?", "risk_tier?", "limit?", "offset?"]
    output: Vendor[]
    side_effects: []

  - method: GET
    path: "/vendors/{id}/risk-profile"
    description: "Computed read of calculations.vendor_risk_score; basis=ROLLING (default) evaluates live against the logical clock, basis=EPOCH replays the last risk run snapshot"
    roles: [VendorUnitAnalyst, VendorUnitSupervisor, ComplianceInvestigator]
    code: 200
    input: ["basis?"]
    output: { vendor_id: string, basis: string, window_start: string, window_end: string, evaluated_line_count: integer, evaluated_visit_count: integer, edit_rejection_rate_pct: number, price_excess_pct: number, failed_visit_pct: number, sanction_points: integer, risk_score: number, risk_tier: string }
    side_effects: []

  - method: POST
    path: "/vendors/{id}/record-training"
    description: "Record completion of a vendor training session and recompute its expiry"
    roles: [VendorUnitAnalyst]
    code: 200
    input: [training_type, completed_at]
    output: Vendor
    side_effects: ["training_type and training_completed_at stored", "training_expires_at set per calculations.reauthorization_and_training_dates"]

  - method: POST
    path: "/vendors/{id}/submit-application"
    description: "Move an application into review and assign its peer group by store type and volume"
    roles: [VendorUnitAnalyst]
    code: 200
    input: []
    output: Vendor
    side_effects: ["authorization_status APPLICANT -> IN_REVIEW", "peer_group_id assigned per calculations.peer_group_assignment", "price_submission_complete recomputed"]

  - method: POST
    path: "/vendors/{id}/authorize"
    description: "Authorize a vendor under review once training, price submissions, peer group and sanction status all clear"
    roles: [VendorUnitSupervisor]
    code: 200
    input: []
    output: Vendor
    side_effects:
      - "authorization_status IN_REVIEW -> AUTHORIZED; authorized_at and reauthorization_due_at stamped"
      - "PeerGroup.member_count incremented by 1 and PeerGroup.version incremented by 1"
      - "avg_monthly_redemption_cents recomputed"

  - method: POST
    path: "/vendors/{id}/deny"
    description: "Deny a vendor under review or under reauthorization"
    roles: [VendorUnitSupervisor]
    code: 200
    input: [denial_reason]
    output: Vendor
    side_effects:
      - "authorization_status -> DENIED and denial_reason stored"
      - "open PriceSubmissions of the vendor move to VOIDED"
      - "when denied from REAUTH_PENDING, PeerGroup.member_count decremented by 1 and PeerGroup.version incremented by 1"

  - method: POST
    path: "/vendors/{id}/start-reauthorization"
    description: "Open the reauthorization cycle for an authorized vendor once the reauthorization window is reached"
    roles: [VendorUnitAnalyst]
    code: 200
    input: []
    output: Vendor
    side_effects: ["authorization_status AUTHORIZED -> REAUTH_PENDING", "accepted_submission_count and price_submission_complete recomputed against the current cycle", "reauth_blocked_reason set when reauthorization_hold is already true"]

  - method: POST
    path: "/vendors/{id}/complete-reauthorization"
    description: "Complete the reauthorization cycle, advancing the due date from its previous value"
    roles: [VendorUnitSupervisor]
    code: 200
    input: []
    output: Vendor
    side_effects: ["authorization_status REAUTH_PENDING -> AUTHORIZED", "reauthorization_due_at advanced by REAUTH_CYCLE_MONTHS from its previous value", "reauth_completed_count incremented by 1"]

  # ---------------------------------------------------------------- price cycles
  - method: POST
    path: "/price-cycles"
    description: "Open a competitive price submission cycle over a half-open window"
    roles: [VendorUnitSupervisor]
    code: 201
    input: [cycle_code, submission_open_at, submission_due_at]
    output: PriceCycle
    side_effects: ["status initialised to OPEN"]

  - method: GET
    path: "/price-cycles/{id}"
    description: "Read one price cycle with its ceiling counters"
    roles: [VendorUnitAnalyst, VendorUnitSupervisor, ComplianceInvestigator, VendorOperator]
    code: 200
    input: []
    output: PriceCycle
    side_effects: []

  - method: POST
    path: "/price-cycles/{id}/close"
    description: "Close the submission window and write PROVISIONAL ceilings from the provisional candidate set"
    roles: [VendorUnitSupervisor]
    code: 200
    input: []
    output: PriceCycle
    side_effects: ["status OPEN -> CLOSED and closed_at stamped", "PROVISIONAL PriceCeiling rows written per the PROVISIONAL variant of calculations.maximum_allowable_reimbursement", "provisional_ceiling_count and skipped_pair_count set"]

  - method: POST
    path: "/price-cycles/{id}/publish-ceilings"
    description: "Publish the maximum allowable reimbursement per item per peer group from the FINAL candidate set"
    roles: [VendorUnitSupervisor]
    code: 200
    input: []
    output: { price_cycle_id: string, status: string, published_ceiling_count: integer, skipped_pair_count: integer, superseded_ceiling_count: integer, published_at: string }
    side_effects:
      - "status CLOSED -> PUBLISHED and published_at stamped"
      - "PROVISIONAL ceilings of this cycle move to SUPERSEDED with superseded_reason PROVISIONAL_REPLACED"
      - "ACTIVE PriceCeiling rows written per the FINAL variant of calculations.maximum_allowable_reimbursement"
      - "ACTIVE ceilings of earlier cycles for the same (peer group, item) pairs move to SUPERSEDED with superseded_reason NEWER_CYCLE_PUBLISHED"

  # ------------------------------------------------------------ price submissions
  - method: POST
    path: "/price-submissions"
    description: "Submit a shelf price for an authorized food list item inside the open cycle window"
    roles: [VendorOperator]
    code: 201
    input: [vendor_id, food_item_id, price_cycle_id, shelf_price_cents]
    output: PriceSubmission
    side_effects: ["status initialised to SUBMITTED", "revision_count initialised to 0"]

  - method: GET
    path: "/price-submissions/{id}"
    description: "Read one shelf price submission"
    roles: [VendorUnitAnalyst, VendorUnitSupervisor, VendorOperator]
    code: 200
    input: []
    output: PriceSubmission
    side_effects: []

  - method: GET
    path: "/price-submissions"
    description: "List shelf price submissions, filterable by vendor, item, cycle and status"
    roles: [VendorUnitAnalyst, VendorUnitSupervisor, VendorOperator]
    code: 200
    input: ["vendor_id?", "food_item_id?", "price_cycle_id?", "status?", "limit?", "offset?"]
    output: PriceSubmission[]
    side_effects: []

  - method: POST
    path: "/price-submissions/{id}/review"
    description: "Accept or reject a shelf price submission against the competitive price criteria"
    roles: [VendorUnitAnalyst]
    code: 200
    input: [decision, "review_reason?"]
    output: PriceSubmission
    side_effects: ["status SUBMITTED -> ACCEPTED or REJECTED", "reviewed_by_user_id and reviewed_at stamped", "Vendor.accepted_submission_count and price_submission_complete recomputed"]

  - method: POST
    path: "/price-submissions/{id}/revise"
    description: "Revise a rejected shelf price submission and put it back into review"
    roles: [VendorOperator]
    code: 200
    input: [shelf_price_cents]
    output: PriceSubmission
    side_effects: ["status REJECTED -> SUBMITTED", "shelf_price_cents replaced and revision_count incremented by 1", "review_reason, reviewed_by_user_id and reviewed_at reset to null"]

  # --------------------------------------------------------------- price ceilings
  - method: GET
    path: "/price-ceilings/{id}"
    description: "Read one maximum allowable reimbursement row with its basis, base, cap and contributing counts"
    roles: [VendorUnitAnalyst, VendorUnitSupervisor, ComplianceInvestigator, VendorOperator]
    code: 200
    input: []
    output: PriceCeiling
    side_effects: []

  - method: GET
    path: "/price-ceilings"
    description: "List maximum allowable reimbursement rows, filterable by peer group, item, cycle and status"
    roles: [VendorUnitAnalyst, VendorUnitSupervisor, ComplianceInvestigator, VendorOperator]
    code: 200
    input: ["peer_group_id?", "food_item_id?", "price_cycle_id?", "status?", "limit?", "offset?"]
    output: PriceCeiling[]
    side_effects: []

  # ------------------------------------------------------------ monitoring visits
  - method: POST
    path: "/monitoring-visits"
    description: "Schedule a routine, compliance-buy or high-risk follow-up monitoring visit"
    roles: [VendorUnitAnalyst, ComplianceInvestigator]
    code: 201
    input: [vendor_id, visit_type, scheduled_for]
    output: MonitoringVisit
    side_effects: ["status initialised to SCHEDULED", "auto_generated false", "when visit_type is COMPLIANCE_BUY, Vendor.reauthorization_hold set to true"]

  - method: GET
    path: "/monitoring-visits/{id}"
    description: "Read one monitoring visit with its stock findings and overcharge"
    roles: [VendorUnitAnalyst, VendorUnitSupervisor, ComplianceInvestigator]
    code: 200
    input: []
    output: MonitoringVisit
    side_effects: []

  - method: GET
    path: "/monitoring-visits"
    description: "List monitoring visits, filterable by vendor, status and visit type"
    roles: [VendorUnitAnalyst, VendorUnitSupervisor, ComplianceInvestigator]
    code: 200
    input: ["vendor_id?", "status?", "visit_type?", "limit?", "offset?"]
    output: MonitoringVisit[]
    side_effects: []

  - method: POST
    path: "/monitoring-visits/{id}/observations"
    description: "Record one minimum stock observation for a food category on a scheduled visit"
    roles: [VendorUnitAnalyst, ComplianceInvestigator]
    code: 200
    input: [food_category_id, observed_units, observed_variety_count]
    output: MonitoringVisit
    side_effects: ["an entry is appended to stock_findings with verdict and required_units still unstamped"]

  - method: POST
    path: "/monitoring-visits/{id}/conduct"
    description: "Conduct the visit: verify minimum stock, price the compliance-buy basket, and branch to PASSED or FAILED with the corresponding cascade"
    roles: [VendorUnitAnalyst, ComplianceInvestigator]
    code: 200
    input: ["buy_items?"]
    output: MonitoringVisit
    side_effects:
      - "conducted_at stamped; stock_findings verdicts, required_units, stock_compliance_pct, overcharge_cents and outcome computed"
      - "PASS branch: status SCHEDULED -> PASSED; a HIGH_RISK_FOLLOWUP pass cures the vendor's FAILED visits and clears open_finding_count, cure_deadline_at, compliance_buy_required and risk_flag"
      - "FAIL branch: status SCHEDULED -> FAILED and the four-hop cascade of state_machines.MonitoringVisit fires"

  # ----------------------------------------------------------- redemption claims
  - method: POST
    path: "/redemption-claims"
    description: "Submit a month of WIC redemption transactions with their scanned lines"
    roles: [VendorOperator]
    code: 201
    input: [vendor_id, claim_month, lines]
    output: RedemptionClaim
    side_effects: ["status initialised to SUBMITTED", "one ClaimLine created per lines entry with edit_result PENDING", "line_count and submitted_total_cents computed"]

  - method: GET
    path: "/redemption-claims/{id}"
    description: "Read one redemption claim with its adjudication totals"
    roles: [VendorUnitAnalyst, VendorUnitSupervisor, VendorOperator]
    code: 200
    input: []
    output: RedemptionClaim
    side_effects: []

  - method: GET
    path: "/redemption-claims"
    description: "List redemption claims, filterable by vendor, status, claim month and governing cycle"
    roles: [VendorUnitAnalyst, VendorUnitSupervisor, VendorOperator]
    code: 200
    input: ["vendor_id?", "status?", "claim_month?", "governing_price_cycle_id?", "limit?", "offset?"]
    output: RedemptionClaim[]
    side_effects: []

  - method: POST
    path: "/redemption-claims/{id}/adjudicate"
    description: "Run the transaction edits against the authorized food list and the published ceilings, rejecting or reducing lines"
    roles: [VendorUnitAnalyst]
    code: 200
    input: []
    output: RedemptionClaim
    side_effects:
      - "status SUBMITTED -> ADJUDICATED; governing_price_cycle_id and adjudicated_at stamped"
      - "each ClaimLine gets food_item_id, edit_result, edit_code, applied_mar_cents and allowed_cents"
      - "adjudicated_total_cents, net_payable_cents and the three line counters computed"
      - "Vendor.avg_monthly_redemption_cents recomputed"

  - method: POST
    path: "/redemption-claims/{id}/mark-paid"
    description: "Mark an adjudicated or adjusted claim as paid, locking it against further adjustments"
    roles: [VendorUnitSupervisor]
    code: 200
    input: []
    output: RedemptionClaim
    side_effects: ["status -> PAID and paid_at stamped"]

  - method: GET
    path: "/claim-lines/{id}"
    description: "Read one claim line with its edit result and reimbursable amount"
    roles: [VendorUnitAnalyst, VendorUnitSupervisor, VendorOperator]
    code: 200
    input: []
    output: ClaimLine
    side_effects: []

  - method: GET
    path: "/claim-lines"
    description: "List claim lines, filterable by claim, resolved item and edit code"
    roles: [VendorUnitAnalyst, VendorUnitSupervisor, VendorOperator]
    code: 200
    input: ["redemption_claim_id?", "food_item_id?", "edit_code?", "limit?", "offset?"]
    output: ClaimLine[]
    side_effects: []

  # ------------------------------------------------------ reimbursement adjustments
  - method: POST
    path: "/reimbursement-adjustments"
    description: "Raise a reimbursement adjustment against an adjudicated claim; the claim's observed version must still be current"
    roles: [VendorUnitAnalyst, VendorUnitSupervisor]
    code: 201
    input: [redemption_claim_id, reason_code, recoupment_rate, expected_claim_version]
    output: ReimbursementAdjustment
    side_effects:
      - "recoupment_cents and line_recoupments computed per calculations.adjustment_proration"
      - "status initialised to PENDING and created_by_user_id stamped from X-User-ID"
      - "increments RedemptionClaim.version by 1"

  - method: GET
    path: "/reimbursement-adjustments/{id}"
    description: "Read one reimbursement adjustment with its per-line proration"
    roles: [VendorUnitAnalyst, VendorUnitSupervisor]
    code: 200
    input: []
    output: ReimbursementAdjustment
    side_effects: []

  - method: GET
    path: "/reimbursement-adjustments"
    description: "List reimbursement adjustments, filterable by claim and status"
    roles: [VendorUnitAnalyst, VendorUnitSupervisor]
    code: 200
    input: ["redemption_claim_id?", "status?", "limit?", "offset?"]
    output: ReimbursementAdjustment[]
    side_effects: []

  - method: POST
    path: "/reimbursement-adjustments/{id}/apply"
    description: "Apply a pending adjustment, recouping from the claim; the applier may not be its creator"
    roles: [VendorUnitSupervisor]
    code: 200
    input: []
    output: ReimbursementAdjustment
    side_effects:
      - "status PENDING -> APPLIED; applied_by_user_id and applied_at stamped"
      - "RedemptionClaim.status ADJUDICATED -> ADJUSTED and net_payable_cents reduced by recoupment_cents"
      - "each affected ClaimLine.recouped_cents increased by its prorated share"
      - "Vendor.recoupment_balance_cents increased by recoupment_cents"

  - method: POST
    path: "/reimbursement-adjustments/{id}/reverse"
    description: "Reverse an applied adjustment, restoring the claim and vendor money fields exactly"
    roles: [VendorUnitSupervisor]
    code: 200
    input: [reversal_reason]
    output: ReimbursementAdjustment
    side_effects:
      - "status APPLIED -> REVERSED; reversed_at and reversal_reason stamped"
      - "RedemptionClaim.net_payable_cents restored and status ADJUSTED -> ADJUDICATED when no other adjustment remains APPLIED"
      - "each affected ClaimLine.recouped_cents reduced by its prorated share"
      - "Vendor.recoupment_balance_cents reduced by recoupment_cents"

  # ------------------------------------------------------------- sanction cases
  - method: POST
    path: "/sanction-cases"
    description: "Open a sanction case under the schedule; the vendor's observed version must still be current"
    roles: [ComplianceInvestigator]
    code: 201
    input: [vendor_id, violation_code, "source_visit_id?", narrative, expected_vendor_version]
    output: SanctionCase
    side_effects:
      - "base_tier, case_points, cumulative_points_at_open, effective_tier, disqualification_months, cmp_amount_cents and cmp_permitted computed per calculations.civil_money_penalty"
      - "status initialised to OPENED and opened_by_user_id stamped from X-User-ID"
      - "increments Vendor.version by 1"

  - method: GET
    path: "/sanction-cases/{id}"
    description: "Read one sanction case with its tier escalation and civil money penalty"
    roles: [VendorUnitAnalyst, VendorUnitSupervisor, ComplianceInvestigator, VendorOperator]
    code: 200
    input: []
    output: SanctionCase
    side_effects: []

  - method: GET
    path: "/sanction-cases"
    description: "List sanction cases, filterable by vendor, source visit and status"
    roles: [VendorUnitAnalyst, VendorUnitSupervisor, ComplianceInvestigator, VendorOperator]
    code: 200
    input: ["vendor_id?", "source_visit_id?", "status?", "limit?", "offset?"]
    output: SanctionCase[]
    side_effects: []

  - method: POST
    path: "/sanction-cases/{id}/serve-notice"
    description: "Serve the sanction notice, starting the vendor's election window"
    roles: [ComplianceInvestigator, VendorUnitSupervisor]
    code: 200
    input: []
    output: SanctionCase
    side_effects: ["status OPENED -> NOTICE_SERVED", "notice_served_at and response_due_at stamped", "a base_tier 4 case suspends an AUTHORIZED vendor"]

  - method: POST
    path: "/sanction-cases/{id}/elect-cmp"
    description: "Vendor elects the civil money penalty in lieu of disqualification (fork branch A)"
    roles: [VendorOperator]
    code: 200
    input: []
    output: SanctionCase
    side_effects: ["status NOTICE_SERVED -> CMP_ELECTED and resolution CMP", "vendor keeps its authorization_status and peer group membership"]

  - method: POST
    path: "/sanction-cases/{id}/impose-disqualification"
    description: "Impose disqualification once the election window has closed (fork branch B); the imposer may not be the case opener"
    roles: [VendorUnitSupervisor, ComplianceInvestigator]
    code: 200
    input: []
    output: SanctionCase
    side_effects:
      - "status NOTICE_SERVED -> DISQUALIFICATION_IMPOSED and resolution DISQUALIFICATION"
      - "Vendor.authorization_status -> DISQUALIFIED with disqualified_until and sanction_points updated"
      - "PeerGroup.member_count decremented by 1 and PeerGroup.version incremented by 1"
      - "SCHEDULED visits CANCELLED and open PriceSubmissions VOIDED"

  - method: POST
    path: "/sanction-cases/{id}/dismiss"
    description: "Dismiss a served sanction case without penalty"
    roles: [ComplianceInvestigator, VendorUnitSupervisor]
    code: 200
    input: [dismissal_reason]
    output: SanctionCase
    side_effects: ["status NOTICE_SERVED -> DISMISSED and resolution DISMISSED", "no sanction points added", "a SUSPENDED vendor with no other open case returns to AUTHORIZED"]

  - method: POST
    path: "/sanction-cases/{id}/close"
    description: "Close the case from either fork branch: with the civil money penalty payment, or after disqualification was imposed"
    roles: [VendorUnitSupervisor]
    code: 200
    input: ["cmp_payment_cents?"]
    output: SanctionCase
    side_effects: ["status -> CLOSED", "from CMP_ELECTED: cmp_paid_cents increased and Vendor.sanction_points incremented by case_points", "from DISQUALIFICATION_IMPOSED: no money moves and sanction_points are not incremented again"]

  # --------------------------------------------------------- test-driving surface
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [SystemOperator]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["all later deadline, window and expiry evaluations use this instant"]

  - method: POST
    path: "/_ops/risk-run"
    description: "Advance the risk epoch: recompute the EPOCH variant of the risk score for every non-terminal vendor, flag high-risk vendors, and escalate failed visits whose cure deadline lapsed"
    roles: [SystemOperator]
    code: 200
    input: []
    output: { epoch_at: string, evaluated_vendor_count: integer, high_risk_vendor_count: integer, escalated_visit_count: integer, opened_sanction_case_count: integer }
    side_effects:
      - "vendors processed in created_at ASC order; each gets risk_score, risk_tier and risk_epoch_at refreshed"
      - "a vendor whose refreshed risk_tier is HIGH gets risk_flag HIGH_SCORE and compliance_buy_required true"
      - "within each vendor, FAILED visits are processed in (scheduled_for ASC, created_at ASC) order; a visit whose vendor cure_deadline_at has lapsed moves to ESCALATED, opens a CLASS_C SanctionCase with opened_by_user_id SYSTEM, and suspends an AUTHORIZED vendor"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not a declared role"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_VENDOR_SCOPE_VIOLATION
    http: 403
    condition: "A VendorOperator addresses a resource belonging to a different vendor"
  - id: ERR_FORBIDDEN_VISIT_TYPE
    http: 403
    condition: "A COMPLIANCE_BUY visit is created by a role other than ComplianceInvestigator"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID created the adjustment being applied, or opened the sanction case whose disqualification is being imposed"
  - id: ERR_PEER_GROUP_NOT_FOUND
    http: 404
    condition: "peer_group_id in a path or body does not resolve"
  - id: ERR_FOOD_CATEGORY_NOT_FOUND
    http: 404
    condition: "food_category_id in a path or body does not resolve"
  - id: ERR_FOOD_ITEM_NOT_FOUND
    http: 404
    condition: "food_item_id in a path or body does not resolve"
  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "vendor_id in a path or body does not resolve"
  - id: ERR_PRICE_CYCLE_NOT_FOUND
    http: 404
    condition: "price_cycle_id in a path or body does not resolve"
  - id: ERR_PRICE_SUBMISSION_NOT_FOUND
    http: 404
    condition: "A price submission id in a path does not resolve"
  - id: ERR_PRICE_CEILING_NOT_FOUND
    http: 404
    condition: "A price ceiling id in a path does not resolve"
  - id: ERR_VISIT_NOT_FOUND
    http: 404
    condition: "A monitoring visit id in a path or source_visit_id does not resolve"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "A redemption claim id in a path or redemption_claim_id does not resolve"
  - id: ERR_CLAIM_LINE_NOT_FOUND
    http: 404
    condition: "A claim line id in a path does not resolve"
  - id: ERR_ADJUSTMENT_NOT_FOUND
    http: 404
    condition: "A reimbursement adjustment id in a path does not resolve"
  - id: ERR_SANCTION_CASE_NOT_FOUND
    http: 404
    condition: "A sanction case id in a path does not resolve"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, unknown enum value, out-of-range number, empty claim lines, duplicate line_number, or pagination parameter outside limits"
  - id: ERR_DUPLICATE_PEER_GROUP_CODE
    http: 409
    condition: "A peer group with the same code already exists"
  - id: ERR_DUPLICATE_FOOD_CATEGORY_CODE
    http: 409
    condition: "A food category with the same code already exists"
  - id: ERR_DUPLICATE_UPC
    http: 409
    condition: "An ACTIVE authorized food item with the same UPC already exists"
  - id: ERR_DUPLICATE_CYCLE_CODE
    http: 409
    condition: "A price cycle with the same cycle_code already exists"
  - id: ERR_INVALID_CYCLE_WINDOW
    http: 422
    condition: "submission_open_at is not strictly before submission_due_at"
  - id: ERR_CYCLE_WINDOW_OVERLAP
    http: 409
    condition: "The new half-open submission window intersects an existing cycle's half-open window"
  - id: ERR_STALE_CLAIM_VERSION
    http: 412
    condition: "expected_claim_version does not equal the claim's current version"
  - id: ERR_STALE_VENDOR_VERSION
    http: 412
    condition: "expected_vendor_version does not equal the vendor's current version"
  - id: ERR_INVALID_VENDOR_STATE
    http: 409
    condition: "The vendor's authorization_status does not permit the requested transition"
  - id: ERR_INVALID_CYCLE_STATE
    http: 409
    condition: "The price cycle's status does not permit close or publish"
  - id: ERR_INVALID_SUBMISSION_STATE
    http: 409
    condition: "The price submission's status does not permit review or revise"
  - id: ERR_INVALID_VISIT_STATE
    http: 409
    condition: "The monitoring visit's status does not permit observations or conduct"
  - id: ERR_INVALID_CLAIM_STATE
    http: 409
    condition: "The claim's status does not permit adjudicate, mark-paid, apply or reverse"
  - id: ERR_INVALID_ADJUSTMENT_STATE
    http: 409
    condition: "The adjustment's status does not permit apply or reverse"
  - id: ERR_INVALID_SANCTION_STATE
    http: 409
    condition: "The sanction case's status does not permit the requested action"
  - id: ERR_CLAIM_NOT_ADJUDICATED
    http: 409
    condition: "An adjustment is raised against a claim that is still SUBMITTED"
  - id: ERR_CLAIM_ALREADY_PAID
    http: 409
    condition: "An adjustment is raised, applied or reversed on a claim that has been marked paid"
  - id: ERR_VENDOR_NOT_MONITORABLE
    http: 409
    condition: "A visit or claim targets a vendor whose authorization_status is not AUTHORIZED, REAUTH_PENDING or SUSPENDED"
  - id: ERR_VENDOR_TRAINING_EXPIRED
    http: 409
    condition: "The vendor has no training on file, or the logical clock has reached training_expires_at"
  - id: ERR_OPEN_SANCTION_CASE_EXISTS
    http: 409
    condition: "The vendor already has a sanction case in OPENED or NOTICE_SERVED"
  - id: ERR_VENDOR_DISQUALIFIED
    http: 409
    condition: "The vendor's disqualification period has not elapsed"
  - id: ERR_COMPLIANCE_BUY_NOT_WARRANTED
    http: 409
    condition: "A compliance buy is scheduled for a vendor that is neither flagged nor in risk tier HIGH"
  - id: ERR_CMP_NOT_PERMITTED
    http: 409
    condition: "Civil money penalty election attempted on a CLASS_A case"
  - id: ERR_CMP_ELECTION_WINDOW_EXPIRED
    http: 409
    condition: "The civil money penalty election arrives after response_due_at"
  - id: ERR_ELECTION_WINDOW_OPEN
    http: 409
    condition: "Disqualification imposed while the election window is still open on a non-CLASS_A case"
  - id: ERR_DISQUALIFICATION_NOT_AVAILABLE
    http: 409
    condition: "The case's effective tier carries a zero-month disqualification"
  - id: ERR_VISIT_DATE_IN_PAST
    http: 422
    condition: "scheduled_for is earlier than the logical clock"
  - id: ERR_VISIT_BLACKOUT_CONFLICT
    http: 409
    condition: "Another SCHEDULED visit of the same vendor lies within the closed 7-day symmetric blackout buffer"
  - id: ERR_DUPLICATE_OBSERVATION
    http: 409
    condition: "A second observation is recorded for the same (visit, food category) pair"
  - id: ERR_SUBMISSION_WINDOW_CLOSED
    http: 409
    condition: "The cycle is not OPEN, or the logical clock is outside the half-open submission window"
  - id: ERR_DUPLICATE_PRICE_SUBMISSION
    http: 409
    condition: "A submission for the same vendor, item and cycle already exists in SUBMITTED, ACCEPTED or REJECTED"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "The submission has already been revised MAX_SUBMISSION_REVISIONS times"
  - id: ERR_PEER_GROUP_RETIRED
    http: 409
    condition: "The vendor's assigned peer group has status RETIRED"
  - id: ERR_PRICE_SUBMISSIONS_INCOMPLETE
    http: 409
    condition: "The vendor lacks an ACCEPTED submission in the current cycle for some ACTIVE item with required_for_authorization true"
  - id: ERR_NO_PEER_GROUP_MATCH
    http: 422
    condition: "No ACTIVE peer group matches the vendor's store type and reported volume"
  - id: ERR_NO_PUBLISHED_PRICE_CYCLE
    http: 409
    condition: "Adjudication is attempted with no published price cycle at or before the logical clock"
  - id: ERR_REAUTHORIZATION_HOLD
    http: 409
    condition: "Reauthorization completion attempted while a scheduled compliance buy is pending"
  - id: ERR_REAUTH_WINDOW_NOT_OPEN
    http: 409
    condition: "Reauthorization started more than REAUTH_WINDOW_DAYS before the due date"
  - id: ERR_RECOUPMENT_EXCEEDS_PAYABLE
    http: 422
    condition: "The computed recoupment exceeds the claim's net payable amount"
  - id: ERR_CMP_UNDERPAID
    http: 409
    condition: "A case is closed from CMP_ELECTED with cumulative payment below cmp_amount_cents"

# =============================================================================
# §1.7 RBAC Matrix (segregation of duties)
# =============================================================================
roles:
  - name: VendorOperator
    description: "The retail vendor itself: reports shelf prices, submits redemption claims and elects the civil money penalty"
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /price-submissions"
      - "POST /price-submissions/{id}/revise"
      - "POST /redemption-claims"
      - "POST /sanction-cases/{id}/elect-cmp"
    shared_operations:
      - "GET /vendors/{id} (own vendor only)"
      - "GET /price-submissions, GET /price-submissions/{id} (own submissions only)"
      - "GET /redemption-claims, GET /redemption-claims/{id}, GET /claim-lines, GET /claim-lines/{id} (own claims only)"
      - "GET /sanction-cases, GET /sanction-cases/{id} (own cases only)"
      - "GET /food-categories/{id}, GET /authorized-food-items, GET /authorized-food-items/{id}, GET /price-cycles/{id}, GET /price-ceilings, GET /price-ceilings/{id}"

  - name: VendorUnitAnalyst
    description: "State WIC vendor unit analyst: intake, training records, price submission review, monitoring visits, claim adjudication"
    identity: opaque
    exclusive_operations:
      - "POST /vendors"
      - "POST /vendors/{id}/record-training"
      - "POST /vendors/{id}/submit-application"
      - "POST /vendors/{id}/start-reauthorization"
      - "POST /price-submissions/{id}/review"
      - "POST /redemption-claims/{id}/adjudicate"
    shared_operations:
      - "POST /monitoring-visits (ROUTINE and HIGH_RISK_FOLLOWUP only)"
      - "POST /monitoring-visits/{id}/observations, POST /monitoring-visits/{id}/conduct"
      - "POST /reimbursement-adjustments"
      - "all GET endpoints except GET /reimbursement-adjustments filtering restrictions"

  - name: VendorUnitSupervisor
    description: "State WIC vendor unit supervisor: configuration, authorization decisions, ceiling publication, money movement, case closure"
    identity: opaque
    exclusive_operations:
      - "POST /peer-groups"
      - "POST /peer-groups/{id}/retire"
      - "POST /food-categories"
      - "POST /authorized-food-items"
      - "POST /authorized-food-items/{id}/delist"
      - "POST /vendors/{id}/authorize"
      - "POST /vendors/{id}/deny"
      - "POST /vendors/{id}/complete-reauthorization"
      - "POST /price-cycles"
      - "POST /price-cycles/{id}/close"
      - "POST /price-cycles/{id}/publish-ceilings"
      - "POST /redemption-claims/{id}/mark-paid"
      - "POST /reimbursement-adjustments/{id}/apply"
      - "POST /reimbursement-adjustments/{id}/reverse"
      - "POST /sanction-cases/{id}/close"
    shared_operations:
      - "POST /reimbursement-adjustments (but may not apply an adjustment it created)"
      - "POST /sanction-cases/{id}/serve-notice, POST /sanction-cases/{id}/impose-disqualification, POST /sanction-cases/{id}/dismiss"
      - "all GET endpoints"

  - name: ComplianceInvestigator
    description: "High-risk vendor compliance investigator: compliance buys and sanction cases"
    identity: opaque
    exclusive_operations:
      - "POST /sanction-cases"
      - "POST /monitoring-visits with visit_type COMPLIANCE_BUY"
    shared_operations:
      - "POST /monitoring-visits, POST /monitoring-visits/{id}/observations, POST /monitoring-visits/{id}/conduct"
      - "POST /sanction-cases/{id}/serve-notice, POST /sanction-cases/{id}/impose-disqualification (never on a case it opened), POST /sanction-cases/{id}/dismiss"
