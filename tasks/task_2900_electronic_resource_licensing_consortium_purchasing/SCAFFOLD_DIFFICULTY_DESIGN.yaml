            - "Subscription.${sub_id}.negotiated_price_cents == 9000000"
      - name: reverting_a_restructure_restores_the_title_count_and_the_price
        grounds:
          - state_machines.RenewalDecision.EXECUTED_to_REVERTED
          - state_machines.RenewalDecision.DECIDED_RESTRUCTURE_to_EXECUTED
          - entities.Subscription.fields.entitled_title_count
          - entities.Subscription.fields.negotiated_price_cents
          - calculations.member_tier_price_cents
