# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml  —  1.8 Test Targeting Index
# task 2834 · Brokered Deposit & Listing Service Funding Compliance
# -----------------------------------------------------------------------------
# 9 rule_id blocks · 22 instances. Every instance grounds in SCAFFOLD.yaml
# 1.1-1.7 only; deleting this file leaves declared behaviour identical.
#
# Shared operator identities used across instances (X-User-ID values):
#   op_admin  SystemAdmin
#   op_desk   FundingDeskOfficer   (preparer of agreements, programs, filings)
#   op_comp   ComplianceReviewer   (approver / determiner)
#   op_alm    TreasuryController   (preparer of limits and contingency plans)
#   op_exam   Examiner             (supervisory authority)
# The segregation-of-duties rule at validations[priority=26] compares X-User-ID,
# so op_desk prepares and op_comp approves throughout.
#
# The logical clock is pinned to its declared default 2026-08-01T00:00:00Z at
# the head of every chain, so no assertion depends on wall-clock time.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: wholesale_ratio_point_in_time_versus_average_daily
        grounds:
          - calculations.wholesale_funding_ratio
          - calculations.wholesale_balance_rollup
          - entities.Institution.fields.wholesale_funding_ratio_bps
          - entities.DepositPlacement.fields.settlement_date
        distinguishing_aspect: |
          The subject is the Institution's funding-risk metric. One brokered
          placement of 2,000,000,000 cents funded on 2026-08-20 against a
          40,000,000,000-cent core book yields wholesale_funding_ratio_bps == 476
          under POINT_IN_TIME but average_daily_ratio_bps == 184 over
          2026-08-01..2026-08-31, because AVERAGE_DAILY time-weights the
          placement over only 12 of the period's 31 days.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Institution ADEQUATELY_CAPITALIZED with core_deposits_cents 40,000,000,000."
            - "One BROKERED DepositPlacement of 2,000,000,000 cents, issue_date 2026-08-20, funding_status ACTIVE, settlement_date null."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /institutions"
              payload: { legal_name: "First Ladder Bank NA", cert_id: "CERT-2834-01", capital_category: "ADEQUATELY_CAPITALIZED", core_deposits_cents: 40000000000, total_liabilities_cents: 50000000000, tier1_capital_cents: 5000000000, liquidity_buffer_cents: 100000000 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /national-rate-caps"
              payload: { tenor_bucket: "DAYS_31_90", published_national_rate_bps: 400, effective_date: "2026-07-01" }
              as: SystemAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Ladder Deposit Brokers LLC", broker_type: "DEPOSIT_BROKER", has_placement_discretion: true, fee_structure: "BASIS_POINT_FEE", fee_bps: 12 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { brk_id: $.data.id }
            - call: "POST /brokers/${brk_id}/agreements"
              payload: { agreement_ref: "AGR-2834-01", fee_structure: "BASIS_POINT_FEE", fee_bps: 12, termination_notice_days: 30, effective_date: "2026-07-01", aml_program_score: 80, financial_condition_score: 75, insurance_coverage_score: 70, recordkeeping_score: 65 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { agr_id: $.data.id }
            - call: "POST /broker-agreements/${agr_id}/diligence-actions"
              payload: { action: "START_DILIGENCE" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /broker-agreements/${agr_id}/diligence-actions"
              payload: { action: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /deposit-programs"
              payload: { institution_id: "${inst_id}", broker_id: "${brk_id}", agreement_id: "${agr_id}", program_name: "90D Brokered CD", funding_channel_claim: "BROKERED", product_type: "TIME_DEPOSIT", tenor_days: 60, offered_rate_bps: 470, early_withdrawal_penalty_days: 90, principal_erosion_allowed: true, pass_through_insurance: false, titling_convention: "DIRECT_TITLED", rollover_enabled: false }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /deposit-classifications"
              payload: { program_id: "${prog_id}", expected_program_version: "${prog_v}", rationale_code: "PLACEMENT_DISCRETION_PRONG" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
              captures: { cls_id: $.data.id }
            - call: "POST /deposit-programs/${prog_id}/state-actions"
              payload: { action: "ATTEST_CLASSIFICATION" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
            - call: "POST /deposit-placements"
              payload: { program_id: "${prog_id}", principal_cents: 2000000000, rate_bps: 470, issue_date: "2026-08-20", tenor_days: 60 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { pl_id: $.data.id }
            - call: "POST /deposit-placements/${pl_id}/funding-actions"
              payload: { action: "ACTIVATE" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
          trigger:
            - call: "GET /institutions/${inst_id}/wholesale-funding-summary"
              as: TreasuryController
              as_user_id: "op_alm"
            - call: "GET /institutions/${inst_id}/wholesale-funding-summary"
              payload: { basis: "AVERAGE_DAILY", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: TreasuryController
              as_user_id: "op_alm"
          assert:
            - "the POINT_IN_TIME response has wholesale_funding_ratio_bps == 476"
            - "the POINT_IN_TIME response has average_daily_ratio_bps == 0 and avg_wholesale_cents == 0 and day_count == 0"
            - "the AVERAGE_DAILY response has day_count == 31"
            - "the AVERAGE_DAILY response has avg_wholesale_cents == 774193548"
            - "the AVERAGE_DAILY response has average_daily_ratio_bps == 184"
            - "both responses have brokered_deposits_cents == 2000000000 and total_deposits_cents == 42000000000"
            - "Institution.${inst_id}.wholesale_funding_ratio_bps == 476 (the persisted field always holds the POINT_IN_TIME variant)"

      - name: early_withdrawal_penalty_contractual_versus_interest_capped
        grounds:
          - calculations.early_withdrawal_penalty
          - calculations.accrued_interest
          - entities.DepositProgram.fields.principal_erosion_allowed
          - state_machines.DepositPlacement.ACTIVE_to_WITHDRAWN_EARLY
        distinguishing_aspect: |
          The subject is settlement accounting on a DepositPlacement, a different
          entity domain from the Institution ratio instance. Two placements with
          byte-identical principal, rate, dates and penalty_days settle
          differently solely because their programs disagree on
          principal_erosion_allowed: net_settlement_cents == 1992273973 under
          CONTRACTUAL_DAYS versus exactly 2000000000 under INTEREST_EARNED_CAP.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Two OPEN_FOR_PLACEMENT programs under the same approved agreement: program A with principal_erosion_allowed true, program B with it false; both early_withdrawal_penalty_days 90."
            - "One ACTIVE placement of 2,000,000,000 cents at 470 bps, issue_date 2026-08-01, tenor_days 90, under each program."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /institutions"
              payload: { legal_name: "First Ladder Bank NA", cert_id: "CERT-2834-02", capital_category: "ADEQUATELY_CAPITALIZED", core_deposits_cents: 40000000000, total_liabilities_cents: 50000000000, tier1_capital_cents: 5000000000, liquidity_buffer_cents: 100000000 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /national-rate-caps"
              payload: { tenor_bucket: "DAYS_31_90", published_national_rate_bps: 400, effective_date: "2026-07-01" }
              as: SystemAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Ladder Deposit Brokers LLC", broker_type: "DEPOSIT_BROKER", has_placement_discretion: true, fee_structure: "FLAT_FEE", fee_flat_cents: 50000 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { brk_id: $.data.id }
            - call: "POST /brokers/${brk_id}/agreements"
              payload: { agreement_ref: "AGR-2834-02", fee_structure: "FLAT_FEE", fee_flat_cents: 50000, termination_notice_days: 30, effective_date: "2026-07-01", aml_program_score: 80, financial_condition_score: 75, insurance_coverage_score: 70, recordkeeping_score: 65 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { agr_id: $.data.id }
            - call: "POST /broker-agreements/${agr_id}/diligence-actions"
              payload: { action: "START_DILIGENCE" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /broker-agreements/${agr_id}/diligence-actions"
              payload: { action: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /deposit-programs"
              payload: { institution_id: "${inst_id}", broker_id: "${brk_id}", agreement_id: "${agr_id}", program_name: "Erosion-Allowed CD", funding_channel_claim: "BROKERED", product_type: "TIME_DEPOSIT", tenor_days: 90, offered_rate_bps: 470, early_withdrawal_penalty_days: 90, principal_erosion_allowed: true, pass_through_insurance: false, titling_convention: "DIRECT_TITLED", rollover_enabled: false }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { prog_a_id: $.data.id, prog_a_v: $.data.version }
            - call: "POST /deposit-classifications"
              payload: { program_id: "${prog_a_id}", expected_program_version: "${prog_a_v}", rationale_code: "PLACEMENT_DISCRETION_PRONG" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /deposit-programs/${prog_a_id}/state-actions"
              payload: { action: "ATTEST_CLASSIFICATION" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
            - call: "POST /deposit-programs"
              payload: { institution_id: "${inst_id}", broker_id: "${brk_id}", agreement_id: "${agr_id}", program_name: "Interest-Capped CD", funding_channel_claim: "BROKERED", product_type: "TIME_DEPOSIT", tenor_days: 90, offered_rate_bps: 470, early_withdrawal_penalty_days: 90, principal_erosion_allowed: false, pass_through_insurance: false, titling_convention: "DIRECT_TITLED", rollover_enabled: false }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { prog_b_id: $.data.id, prog_b_v: $.data.version }
            - call: "POST /deposit-classifications"
              payload: { program_id: "${prog_b_id}", expected_program_version: "${prog_b_v}", rationale_code: "PLACEMENT_DISCRETION_PRONG" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /deposit-programs/${prog_b_id}/state-actions"
              payload: { action: "ATTEST_CLASSIFICATION" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
            - call: "POST /deposit-placements"
              payload: { program_id: "${prog_a_id}", principal_cents: 2000000000, rate_bps: 470, issue_date: "2026-08-01", tenor_days: 90 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { pl_a_id: $.data.id }
            - call: "POST /deposit-placements/${pl_a_id}/funding-actions"
              payload: { action: "ACTIVATE" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
            - call: "POST /deposit-placements"
              payload: { program_id: "${prog_b_id}", principal_cents: 2000000000, rate_bps: 470, issue_date: "2026-08-01", tenor_days: 90 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { pl_b_id: $.data.id }
            - call: "POST /deposit-placements/${pl_b_id}/funding-actions"
              payload: { action: "ACTIVATE" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
          trigger:
            - call: "POST /deposit-placements/${pl_a_id}/funding-actions"
              payload: { action: "EARLY_WITHDRAW", withdrawal_date: "2026-09-30" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
            - call: "POST /deposit-placements/${pl_b_id}/funding-actions"
              payload: { action: "EARLY_WITHDRAW", withdrawal_date: "2026-09-30" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
          assert:
            - "DepositPlacement.${pl_a_id}.accrued_interest_cents == 15452055"
            - "DepositPlacement.${pl_b_id}.accrued_interest_cents == 15452055"
            - "DepositPlacement.${pl_a_id}.early_withdrawal_penalty_cents == 23178082"
            - "DepositPlacement.${pl_b_id}.early_withdrawal_penalty_cents == 15452055"
            - "DepositPlacement.${pl_a_id}.net_settlement_cents == 1992273973"
            - "DepositPlacement.${pl_b_id}.net_settlement_cents == 2000000000"
            - "DepositPlacement.${pl_a_id}.settlement_date == \"2026-09-30\" and DepositPlacement.${pl_b_id}.settlement_date == \"2026-09-30\""
            - "DepositPlacement.${pl_a_id}.funding_status == WITHDRAWN_EARLY and DepositPlacement.${pl_b_id}.funding_status == WITHDRAWN_EARLY"

  - rule_id: combinatorial_formula
    instances:
      - name: effective_rate_cap_nested_max_then_min_clamp
        grounds:
          - calculations.effective_rate_cap
          - calculations.tenor_bucket_assignment
          - calculations.rate_cap_regime_derivation
          - entities.DepositProgram.fields.effective_cap_bps
        distinguishing_aspect: |
          Mode (a): four inputs (published_national_rate_bps, local_prevailing_rate_bps,
          tenor_bucket, rate_cap_regime) interact non-linearly through a pinned
          max()-then-min() nest. On identical rate inputs (national 400, local 450) the
          ceiling is 450 for a NON_MATURITY program, 525 for a DAYS_31_90 program, and
          475 for a DAYS_31_90 program with no local comparison — three different
          answers from one formula.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Institution ADEQUATELY_CAPITALIZED, so rate_cap_regime == CAPPED."
            - "Published NationalRateCap of 400 bps for both NON_MATURITY and DAYS_31_90, effective 2026-07-01."
            - "Three broker-less DepositPrograms: MONEY_MARKET with local 450; TIME_DEPOSIT tenor 60 with local 450; TIME_DEPOSIT tenor 60 with local omitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /institutions"
              payload: { legal_name: "Cap Nest Bank NA", cert_id: "CERT-2834-03", capital_category: "ADEQUATELY_CAPITALIZED", core_deposits_cents: 40000000000, total_liabilities_cents: 50000000000, tier1_capital_cents: 5000000000, liquidity_buffer_cents: 1000000000 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /national-rate-caps"
              payload: { tenor_bucket: "NON_MATURITY", published_national_rate_bps: 400, effective_date: "2026-07-01" }
              as: SystemAdmin
              captures: { cap_nm_id: $.data.id }
            - call: "POST /national-rate-caps"
              payload: { tenor_bucket: "DAYS_31_90", published_national_rate_bps: 400, effective_date: "2026-07-01" }
              as: SystemAdmin
              captures: { cap_mt_id: $.data.id }
          trigger:
            - call: "POST /deposit-programs"
              payload: { institution_id: "${inst_id}", program_name: "Retail MMDA", funding_channel_claim: "CORE", product_type: "MONEY_MARKET", tenor_days: 0, offered_rate_bps: 450, local_prevailing_rate_bps: 450, early_withdrawal_penalty_days: 0, titling_convention: "DIRECT_TITLED" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { prog_nm_id: $.data.id }
            - call: "POST /deposit-programs"
              payload: { institution_id: "${inst_id}", program_name: "60D CD local-compared", funding_channel_claim: "CORE", product_type: "TIME_DEPOSIT", tenor_days: 60, offered_rate_bps: 525, local_prevailing_rate_bps: 450, early_withdrawal_penalty_days: 30, titling_convention: "DIRECT_TITLED" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { prog_mt_id: $.data.id }
            - call: "POST /deposit-programs"
              payload: { institution_id: "${inst_id}", program_name: "60D CD national-only", funding_channel_claim: "CORE", product_type: "TIME_DEPOSIT", tenor_days: 60, offered_rate_bps: 475, early_withdrawal_penalty_days: 30, titling_convention: "DIRECT_TITLED" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { prog_nat_id: $.data.id }
          assert:
            - "DepositProgram.${prog_nm_id}.tenor_bucket == NON_MATURITY"
            - "DepositProgram.${prog_nm_id}.effective_cap_bps == 450"
            - "DepositProgram.${prog_mt_id}.tenor_bucket == DAYS_31_90"
            - "DepositProgram.${prog_mt_id}.effective_cap_bps == 525"
            - "DepositProgram.${prog_nat_id}.effective_cap_bps == 475"
            - "NationalRateCap.${cap_nm_id}.cap_bps == 475 and NationalRateCap.${cap_nm_id}.non_maturity_cap_bps == 450"
            - "NationalRateCap.${cap_mt_id}.cap_bps == 475"
            - "the NON_MATURITY answer is NOT 525: applying min() before max() would return 475, and skipping the clamp entirely would return 525"

      - name: broker_fee_round_per_line_then_sum
        grounds:
          - calculations.broker_fee_settlement
          - entities.BrokerAgreement.fields.accrued_fee_cents
          - entities.DepositPlacement.fields.fee_accrual_cents
          - state_machines.DepositPlacement.PENDING_to_ACTIVE
        distinguishing_aspect: |
          Mode (b): three ACTIVE placements of 150,005,000 cents under a 1 bp
          BASIS_POINT_FEE agreement each round to exactly 15,001 cents from a .5
          remainder, so the pinned round-per-line-then-sum order gives
          accrued_fee_cents == 45003 while the forbidden sum-then-round order gives
          45002 — a one-cent divergence that only the pinned order reproduces.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Institution WELL_CAPITALIZED (rate_cap_regime EXEMPT), so no ceiling gates the placements."
            - "APPROVED BrokerAgreement with fee_structure BASIS_POINT_FEE and fee_bps 1."
            - "Three ACTIVE placements of 150,005,000 cents each under one OPEN_FOR_PLACEMENT program."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /institutions"
              payload: { legal_name: "Half Cent Bank NA", cert_id: "CERT-2834-04", capital_category: "WELL_CAPITALIZED", core_deposits_cents: 40000000000, total_liabilities_cents: 50000000000, tier1_capital_cents: 5000000000, liquidity_buffer_cents: 1000000000 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /brokers"
              payload: { legal_name: "One Bip Brokers LLC", broker_type: "DEPOSIT_BROKER", has_placement_discretion: true, fee_structure: "BASIS_POINT_FEE", fee_bps: 1 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { brk_id: $.data.id }
            - call: "POST /brokers/${brk_id}/agreements"
              payload: { agreement_ref: "AGR-2834-04", fee_structure: "BASIS_POINT_FEE", fee_bps: 1, termination_notice_days: 30, effective_date: "2026-07-01", aml_program_score: 80, financial_condition_score: 75, insurance_coverage_score: 70, recordkeeping_score: 65 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { agr_id: $.data.id }
            - call: "POST /broker-agreements/${agr_id}/diligence-actions"
              payload: { action: "START_DILIGENCE" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /broker-agreements/${agr_id}/diligence-actions"
              payload: { action: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /deposit-programs"
              payload: { institution_id: "${inst_id}", broker_id: "${brk_id}", agreement_id: "${agr_id}", program_name: "Half Cent CD", funding_channel_claim: "BROKERED", product_type: "TIME_DEPOSIT", tenor_days: 60, offered_rate_bps: 470, early_withdrawal_penalty_days: 30, titling_convention: "DIRECT_TITLED" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /deposit-classifications"
              payload: { program_id: "${prog_id}", expected_program_version: "${prog_v}", rationale_code: "PLACEMENT_DISCRETION_PRONG" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /deposit-programs/${prog_id}/state-actions"
              payload: { action: "ATTEST_CLASSIFICATION" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
            - call: "POST /deposit-placements"
              payload: { program_id: "${prog_id}", principal_cents: 150005000, rate_bps: 470, issue_date: "2026-08-01", tenor_days: 60 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { pl_1_id: $.data.id }
            - call: "POST /deposit-placements"
              payload: { program_id: "${prog_id}", principal_cents: 150005000, rate_bps: 470, issue_date: "2026-08-01", tenor_days: 60 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { pl_2_id: $.data.id }
            - call: "POST /deposit-placements"
              payload: { program_id: "${prog_id}", principal_cents: 150005000, rate_bps: 470, issue_date: "2026-08-01", tenor_days: 60 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { pl_3_id: $.data.id }
            - call: "POST /deposit-placements/${pl_1_id}/funding-actions"
              payload: { action: "ACTIVATE" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
            - call: "POST /deposit-placements/${pl_2_id}/funding-actions"
              payload: { action: "ACTIVATE" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
          trigger:
            - call: "POST /deposit-placements/${pl_3_id}/funding-actions"
              payload: { action: "ACTIVATE" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
            - call: "GET /broker-agreements/${agr_id}/fee-summary"
              as: FundingDeskOfficer
              as_user_id: "op_desk"
          assert:
            - "DepositPlacement.${pl_1_id}.fee_accrual_cents == 15001"
            - "DepositPlacement.${pl_2_id}.fee_accrual_cents == 15001"
            - "DepositPlacement.${pl_3_id}.fee_accrual_cents == 15001"
            - "BrokerAgreement.${agr_id}.accrued_fee_cents == 45003"
