  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: fefo_allocation_earliest_expiry_first
        claim_type: correct_result
        grounds: [calculations.lot_allocation_calc]
        distinguishing_aspect: "FEFO waterfall: an order of 4 against lots L2 (expiry 2026-10-09, 3 units) and L1 (expiry 2026-10-14, 10 units) drains the earlier-expiring lot first, then spills 1 unit into L1."
        test_recipe:
          setup: ["account; kit K-FF shelf 60d; lot L1 (manufacture 2026-08-15, expiry 2026-10-14, 10 units) PASSED; lot L2 (manufacture 2026-08-10, expiry 2026-10-09, 3 units) PASSED"]
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab FF", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/reagent-kits"
              payload: { kit_code: "K-FF", run_type: "STD_SHORT", flow_cell_version: "FC_LOW", chemistry_version: "V1", regulatory_clearance: "RUO_ONLY", shelf_life_days: 60, cold_chain_class: "FROZEN_20", price_cents: 5000, samples_per_kit: 16, min_model_generation: 1 }
              as: PlatformAdmin
              captures: { kit: $.data.id }
            - call: "POST /genomics/reagent-lots"
              payload: { kit_id: "${kit}", lot_number: "FF-1", manufacture_date: "2026-08-15T00:00:00Z", quantity_units: 10 }
              as: SupplyPlanner
              captures: { lot1: $.data.id }
            - call: "POST /genomics/reagent-lots"
              payload: { kit_id: "${kit}", lot_number: "FF-2", manufacture_date: "2026-08-10T00:00:00Z", quantity_units: 3 }
              as: SupplyPlanner
              captures: { lot2: $.data.id }
            - call: "POST /genomics/reagent-lots/${lot1}/qc"
              payload: { outcome: "PASSED" }
              as: SupplyPlanner
            - call: "POST /genomics/reagent-lots/${lot2}/qc"
              payload: { outcome: "PASSED" }
              as: SupplyPlanner
            - call: "POST /genomics/reagent-orders"
              payload: { account_id: "${acct}", lines: [{ kit_code: "K-FF", quantity: 4 }] }
              as: LabOperator
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /genomics/reagent-orders/${ord}/advance"
              payload: { action: "SUBMIT" }
              as: LabOperator
              as_user_id: "${acct}"
              captures: { res: $.data.line_reservations }
            - call: "GET /genomics/reagent-lots/${lot2}"
              as: SupplyPlanner
              captures: { res2: $.data.reserved_units }
            - call: "GET /genomics/reagent-lots/${lot1}"
              as: SupplyPlanner
              captures: { res1: $.data.reserved_units }
          assert:
            - "res2 == 3 and res1 == 1 (earliest expiry lot drained first, remainder spills to the later lot)"
            - "res contains exactly two reservations: {lot_id: ${lot2}, quantity: 3} then {lot_id: ${lot1}, quantity: 1}"
      - name: allocation_tie_break_created_at
        claim_type: correct_result
        grounds: [calculations.lot_allocation_calc]
        distinguishing_aspect: "Same-expiry tie-break: two lots with identical expiry dates allocate from the EARLIER created_at lot (never by id); the later lot is untouched."
        test_recipe:
          setup: ["account; kit K-TB; lots A and B with identical manufacture/expiry, both PASSED, A registered before B; order of 2"]
