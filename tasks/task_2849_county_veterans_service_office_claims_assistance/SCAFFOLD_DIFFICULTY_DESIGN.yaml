      - name: discharge_document_resubmission_cycle_recomputes_wartime_days_from_corrected_dates
        grounds:
          - state_machines.DischargeDocument.PENDING_VERIFICATION_to_DISCREPANCY_HELD
          - state_machines.DischargeDocument.DISCREPANCY_HELD_to_PENDING_VERIFICATION
          - state_machines.DischargeDocument.PENDING_VERIFICATION_to_VERIFIED
          - entities.DischargeDocument.fields.resubmission_count
          - calculations.wartime_service_days
          - calculations.eligibility_category_results
        distinguishing_aspect: |
          CYCLIC non-linearity with a path-dependent derived field: PENDING_VERIFICATION is entered twice
          and the second entry carries corrected claimed service dates, so VERIFY on the second pass sets
          Veteran.wartime_service_days to 90 and the screen marks PENSION true, whereas VERIFY on the
          first pass would have set 0 and PENSION false.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "rep_a ACTIVE COUNTY_CVSO."
            - "Veteran vet with household_income_cents 1500000, net_worth_cents 2000000, dependent_count 2, homeless_status NOT_HOMELESS, intake_status INTAKE_STARTED."
            - "DischargeDocument doc first submitted with peacetime dates 1985-01-01..1989-12-31 (wartime overlap 0 days)."
            - "doc held for discrepancy, then resubmitted with corrected dates 2001-09-11..2001-12-09 (exactly 90 wartime days), leaving verification_status PENDING_VERIFICATION and resubmission_count 1."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-061", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
