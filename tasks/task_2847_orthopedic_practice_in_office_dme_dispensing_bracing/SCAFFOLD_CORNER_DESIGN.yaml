          assert:
            - "${err_clinic} == ERR_CLINIC_NOT_FOUND with HTTP 404"
            - "${err_supplier} == ERR_SUPPLIER_NOT_FOUND with HTTP 404"
            - "${err_product} == ERR_PRODUCT_NOT_FOUND with HTTP 404"
            - "${err_par} == ERR_PAR_LEVEL_NOT_FOUND with HTTP 404"
            - "${err_encounter} == ERR_ENCOUNTER_NOT_FOUND with HTTP 404"
            - "${err_fitter} == ERR_FITTER_NOT_FOUND with HTTP 404 (path reading of the error)"
