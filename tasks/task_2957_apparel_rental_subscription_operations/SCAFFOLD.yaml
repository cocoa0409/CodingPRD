    roles: [WarehouseTech, PlatformAdmin]
    code: 201
    input: [reservation_id, direction, planned_ship_date, "carrier_reference?"]
    output: Shipment
    side_effects: ["member_id copied from the reservation", "state CREATED", "cadence collision check against the member's other OUTBOUND legs"]
  - method: GET
    path: "/shipments/{shipment_id}"
    description: "Read one shipment leg"
    roles: [Member, WarehouseTech, InventoryPlanner, PlatformAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: GET
    path: "/shipments"
    description: "List shipment legs, optionally filtered by member, reservation, direction or state"
    roles: [Member, WarehouseTech, InventoryPlanner, PlatformAdmin]
    code: 200
    input: ["member_id?", "reservation_id?", "direction?", "state?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []
  - method: POST
    path: "/shipments/{shipment_id}/dispatch"
    description: "Hand a leg to the carrier"
    roles: [WarehouseTech, PlatformAdmin]
    code: 200
    input: ["carrier_reference?"]
    output: Shipment
    side_effects: ["state CREATED or EXCEPTION -> IN_TRANSIT, dispatched_at stamped", "on an OUTBOUND leg: reservation MATCHED -> SHIPPED and unit RESERVED -> OUT"]
  - method: POST
    path: "/shipments/{shipment_id}/delivery"
    description: "Record delivery of an OUTBOUND leg to the member"
    roles: [WarehouseTech, PlatformAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects: ["state IN_TRANSIT -> DELIVERED, delivered_at stamped", "reservation SHIPPED -> IN_POSSESSION", "member.units_out_count recomputed"]
  - method: POST
    path: "/shipments/{shipment_id}/exception"
    description: "Record a carrier exception on a leg"
    roles: [WarehouseTech, PlatformAdmin]
    code: 200
    input: [exception_reason]
    output: Shipment
    side_effects: ["state IN_TRANSIT -> EXCEPTION, exception_count incremented", "when exception_count reaches SHIPMENT_EXCEPTION_CAP the leg is treated as a loss: an OUTBOUND leg's reservation goes SHIPPED -> WAITLISTED and its unit is retired with reason LOSS; an INBOUND leg's reservation goes RETURN_INITIATED -> CLOSED, stamps revenue_attributed_cents, and its unit is retired with reason LOSS", "no fee is charged to the member on either loss path"]
  - method: POST
    path: "/shipments/{shipment_id}/receipt"
    description: "Warehouse receives an INBOUND leg; opens the reverse-logistics job for the unit"
    roles: [WarehouseTech]
    code: 200
    input: []
    output: Shipment
    side_effects: ["state IN_TRANSIT -> RECEIVED, received_at stamped", "reservation RETURN_INITIATED -> RETURNED, returned_at and rental_days stamped", "calculation late_return_fee sets late_days and late_fee_cents and, when positive, appends a LATE_FEE DEBIT FeeLedgerEntry that may drive the member to DELINQUENT", "unit INBOUND -> PROCESSING and last_returned_at stamped; turns_completed is NOT incremented until restock", "a ReverseLogisticsJob is created in RECEIVED for the unit", "style floor_ready_unit_count, depth_gap_units and replenishment_flag recomputed"]

  # --- reverse logistics ------------------------------------------------------
  - method: GET
    path: "/reverse-logistics-jobs/{job_id}"
    description: "Read one reverse-logistics job"
    roles: [WarehouseTech, ClaimsAdjuster, InventoryPlanner, PlatformAdmin]
    code: 200
    input: []
    output: ReverseLogisticsJob
    side_effects: []
  - method: GET
    path: "/reverse-logistics-jobs"
    description: "List reverse-logistics jobs, optionally filtered by unit, reservation, inspecting technician or state"
    roles: [WarehouseTech, ClaimsAdjuster, InventoryPlanner, PlatformAdmin]
    code: 200
    input: ["rental_unit_id?", "reservation_id?", "inspecting_technician_id?", "state?", "limit?", "offset?"]
    output: ReverseLogisticsJob[]
    side_effects: []
  - method: POST
    path: "/reverse-logistics-jobs/{job_id}/inspections"
    description: "Technician files an inspection on a received unit; sets the required reconditioning legs and opens a damage claim when warranted"
    roles: [WarehouseTech]
    code: 201
    input: [soil_level, damage_severity, condition_grade_after, "biohazard_flag?", "notes?"]
    output: Inspection
    side_effects: ["technician_id taken from X-User-ID, attempt_index assigned", "unit.condition_grade := condition_grade_after", "job RECEIVED or PROCESSING -> INSPECTED, inspecting_technician_id set", "cleaning_required and repair_required derived from soil_level and damage_severity", "unit condition_state moves to NEEDS_CLEANING, NEEDS_REPAIR, QUARANTINED or CONDEMNED; quarantine_hold set when biohazard_flag is true", "job advances in the same request to PROCESSING, READY_FOR_PHOTO or CONDEMNED_HOLD", "a DamageClaim is opened in OPEN when damage_severity != NONE", "calculation member_damage_risk_score refreshes the member's score and band", "on a re-inspection filed from job state PROCESSING the sign-off stamps of every still-demanded leg are cleared back to null while repair_attempts is left untouched"]
  - method: GET
    path: "/inspections/{inspection_id}"
    description: "Read one inspection record"
    roles: [WarehouseTech, ClaimsAdjuster, InventoryPlanner, PlatformAdmin]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: GET
    path: "/inspections"
