              captures: {trid: $.data.id}
            - call: "POST /terminals/${tid}/trains/${trid}/mark_arrived"
              payload: {}
              as: RailCoordinator
            - call: "POST /terminals/${tid}/containers"
              payload: { container_number: "C0000000001", iso_type: "40FT", planned_train_id: "${trid}" }
              as: RailCoordinator
              captures: {c1: $.data.id}
            - call: "POST /terminals/${tid}/containers"
              payload: { container_number: "C0000000002", iso_type: "40FT", planned_train_id: "${trid}" }
              as: RailCoordinator
              captures: {c2: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
