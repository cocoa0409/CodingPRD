    side_effects: []

  # ---- Driver ----
  - method: POST
    path: "/drivers"
    description: "Create a Driver; status initialized AVAILABLE"
    roles: [Broker]
    code: 201
    input: [broker_id, full_name, vehicle_modality, base_county]
