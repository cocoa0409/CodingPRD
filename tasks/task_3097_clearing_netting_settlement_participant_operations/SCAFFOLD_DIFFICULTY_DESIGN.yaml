              captures: { err_pair_a: $.data.error_id }
          assert:
            - "the response status is 409 and the error_id is ERR_WINDOW_ALREADY_NETTED, not ERR_INVALID_STATE"
            - "GET /clearing/trade-submissions/${t_xpa} reports lock_status == OPEN, proving the trade's own state still permits lock-in and only the window pair blocks it"

      - name: corporate_action_apply_requires_window_effective_date
        grounds:
          - state_machines.CorporateAction.ANNOUNCED_to_APPLIED
          - validations[priority=12]
          - entities.CorporateAction.fields.effective_date
          - entities.NetPosition.fields.net_quantity
        distinguishing_aspect: "The entity pair is CorporateAction depending on SettlementWindow and its NetPosition children: applying an action whose effective_date is after a window's settlement_date is rejected, so the cross-entity pair — not the action's own ANNOUNCED state — decides legality."
        test_recipe:
          setup:
