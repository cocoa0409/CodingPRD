              as_user_id: "admin-1"
              captures: { pm: $.data.id }
            - &cvP_mold1
              call: "POST /molds"
              payload: { mold_code: "MLD-CVP-1", product_model_id: "${pm}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 12.000, service_interval_cycles: 10 }
