          assert:
            - "Exactly 72.0h before start falls in the 75% tier (>= boundary): ledger REFUND == 3654 (round_half_up(0.75 * 4872)) and FORFEIT == 1218"
            - "Booking.${bk}.payment_status == REFUND_PARTIAL and status == CANCELLED_CUSTOMER"
            - "No 100% refund: REFUND amount is 3654, not 4872"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: confirm_requires_permit_issued
        grounds:
          - state_machines.Booking.QUOTED_to_CONFIRMED
          - validations[priority=9]
        distinguishing_aspect: |
          Entity pair Booking -> Permit: the booking's QUOTED -> CONFIRMED
          transition is gated on a sibling Permit entity being ISSUED; a DRAFT
          permit blocks with ERR_PERMIT_NOT_ISSUED and the same confirm succeeds
          after the permit is ISSUED — the sibling instances gate BookingAnimal
          on Animal and AddOnRequest on StaffAssignment/Handler.
        test_recipe:
          setup:
            - "Goat fixture QUOTED with deposit paid, on a venue with requires_animal_permit=true; ANIMAL_EXHIBITION permit exists in DRAFT (submittable: event 2026-06-17 is >336h past clock 2026-05-10)"
