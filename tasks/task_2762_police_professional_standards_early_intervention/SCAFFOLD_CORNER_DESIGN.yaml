              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { i1_v1: $.data.version }
            - call: "POST /investigations/${i1_id}/assignments"
              payload: { expected_investigation_version: "${i1_v0}", investigator_officer_id: "${inv_b_id}", assignment_note: "Replay of the version observed before the first assignment." }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { e_stale: "$.data.error_id" }
            - call: "GET /investigations/${i1_id}"
              payload: {}
              as: IACommander
