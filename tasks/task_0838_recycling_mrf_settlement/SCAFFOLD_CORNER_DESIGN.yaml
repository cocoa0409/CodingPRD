# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Recycling MRF & Commodity Settlement — Expert
# Breadth probe over §1.1-§1.7; §1.8 covers the depth probe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: corner_create_municipality_success
        claim_type: Creation
        grounds: [entities.Municipality, endpoints]
        distinguishing_aspect: "POST /mrf/municipalities with all required fields returns 201 with status=ACTIVE, balance_cents=0, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /mrf/municipalities"
              payload: { name: "City A", contact_email: "a@x.gov", revenue_share_pct: 0.55 }
              as: SettlementClerk
              captures: { m_id: $.data.id }
          assert:
            - "response code == 201"
            - "Municipality.${m_id}.status == ACTIVE"
            - "Municipality.${m_id}.balance_cents == 0"
            - "Municipality.${m_id}.version == 1"

      - name: corner_get_municipality_not_found
        claim_type: Not Found
        grounds: [entities.Municipality, "errors[ERR_MUNICIPALITY_NOT_FOUND]"]
        distinguishing_aspect: "GET /mrf/municipalities/{id} with a non-existent UUID returns ERR_MUNICIPALITY_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /mrf/municipalities/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SettlementClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MUNICIPALITY_NOT_FOUND"
            - "http_status == 404"

      - name: corner_create_municipality_missing_required_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Municipality.fields.revenue_share_pct, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required revenue_share_pct on municipality create returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /mrf/municipalities"
              payload: { name: "City A" }
              as: SettlementClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"

      - name: corner_revenue_share_pct_out_of_range_rejected
        claim_type: Type Constraints
        grounds: [entities.Municipality.fields.revenue_share_pct, "validations[priority=10]", "errors[ERR_REVENUE_SHARE_PCT_OUT_OF_RANGE]"]
        distinguishing_aspect: "revenue_share_pct=1.5 (outside [0,1]) is rejected with ERR_REVENUE_SHARE_PCT_OUT_OF_RANGE (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /mrf/municipalities"
              payload: { name: "City A", revenue_share_pct: 1.5 }
              as: SettlementClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REVENUE_SHARE_PCT_OUT_OF_RANGE"
            - "http_status == 422"

      - name: corner_net_tons_computed_from_gross_minus_tare
        claim_type: Computed Fields
        grounds: [entities.InboundLoad.fields.net_tons]
        distinguishing_aspect: "InboundLoad.net_tons is computed = gross_tons - tare_tons (25.5 - 3.5 = 22.0); any client-supplied net_tons is ignored."
        test_recipe:
          setup: ["Municipality and sort line exist."]
          setup_api_calls:
            - call: "POST /mrf/municipalities"
              payload: { name: "City A", revenue_share_pct: 0.50 }
              as: SettlementClerk
              captures: { m_id: $.data.id }
            - call: "POST /mrf/sort-lines"
              payload: { name: "Line 1", rated_tph: 10 }
              as: SortManager
              captures: { sl_id: $.data.id }
          trigger:
            - call: "POST /mrf/inbound-loads"
              payload: { source_municipality_id: "${m_id}", sort_line_id: "${sl_id}", hauler: "H1", gross_tons: 25.5, tare_tons: 3.5 }
              as: ScaleOperator
              captures: { load_id: $.data.id }
          assert:
            - "InboundLoad.${load_id}.net_tons == 22.0"
            - "InboundLoad.${load_id}.status == RECEIVED"

      - name: corner_revenue_posting_is_append_only_no_version
        claim_type: Immutability
        grounds: [entities.RevenueSharePosting]
        distinguishing_aspect: "RevenueSharePosting has common_fields:false — it carries id and created_at but no version field and no update/delete endpoint."
        test_recipe:
          setup: ["A closed load has produced one adjustment posting for a municipality (rebate path)."]
          setup_api_calls:
            - call: "POST /mrf/municipalities"
              payload: { name: "City A", revenue_share_pct: 0.50 }
              as: SettlementClerk
              captures: { m_id: $.data.id }
            - call: "POST /mrf/sort-lines"
              payload: { name: "Line 1", rated_tph: 10 }
              as: SortManager
              captures: { sl_id: $.data.id }
            - call: "POST /mrf/inbound-loads"
              payload: { source_municipality_id: "${m_id}", sort_line_id: "${sl_id}", hauler: "H1", gross_tons: 10, tare_tons: 0 }
              as: ScaleOperator
              captures: { load_id: $.data.id }
            - call: "POST /mrf/inbound-loads/${load_id}/audit"
              payload: { sampled_contamination_pct: 2.0, audited_composition: [ { commodity: "OCC", pct: 99 } ] }
              as: ScaleOperator
            - call: "POST /mrf/inbound-loads/${load_id}/close"
              payload: { residual_tons: 0 }
              as: SortManager
          trigger:
            - call: "GET /mrf/revenue-postings?municipality_id=${m_id}"
              payload: {}
              as: SettlementClerk
          assert:
            - "the returned RevenueSharePosting has no version field"
            - "no POST/PUT/DELETE endpoint for revenue-postings exists in §1.5"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: corner_finalize_statement_not_open_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.MunicipalStatement.OPEN_to_FINALIZED, "errors[ERR_STATEMENT_NOT_OPEN]"]
        distinguishing_aspect: "Finalizing an already-FINALIZED statement returns ERR_STATEMENT_NOT_OPEN (409); no totals recomputed."
        test_recipe:
          setup: ["Municipality with an OPEN statement that has been finalized once."]
          setup_api_calls:
            - call: "POST /mrf/municipalities"
              payload: { name: "City A", revenue_share_pct: 0.50 }
              as: SettlementClerk
              captures: { m_id: $.data.id, m_ver: $.data.version }
            - call: "POST /mrf/municipal-statements"
              payload: { municipality_id: "${m_id}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", expected_municipality_version: "${m_ver}" }
              as: SettlementClerk
              captures: { st_id: $.data.id }
            - call: "POST /mrf/municipal-statements/${st_id}/finalize"
              payload: {}
              as: SettlementClerk
          trigger:
            - call: "POST /mrf/municipal-statements/${st_id}/finalize"
              payload: {}
              as: SettlementClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STATEMENT_NOT_OPEN"
            - "http_status == 409"

      - name: corner_audit_closed_load_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.InboundLoad, "errors[ERR_LOAD_NOT_AUDITABLE]"]
        distinguishing_aspect: "Auditing a CLOSED (terminal) load returns ERR_LOAD_NOT_AUDITABLE (409)."
        test_recipe:
          setup: ["Load audited then closed (terminal)."]
          setup_api_calls:
            - call: "POST /mrf/municipalities"
              payload: { name: "City A", revenue_share_pct: 0.50 }
              as: SettlementClerk
              captures: { m_id: $.data.id }
            - call: "POST /mrf/sort-lines"
              payload: { name: "Line 1", rated_tph: 10 }
              as: SortManager
              captures: { sl_id: $.data.id }
            - call: "POST /mrf/inbound-loads"
              payload: { source_municipality_id: "${m_id}", sort_line_id: "${sl_id}", hauler: "H1", gross_tons: 10, tare_tons: 0 }
              as: ScaleOperator
              captures: { load_id: $.data.id }
            - call: "POST /mrf/inbound-loads/${load_id}/audit"
              payload: { sampled_contamination_pct: 2.0, audited_composition: [ { commodity: "OCC", pct: 99 } ] }
              as: ScaleOperator
            - call: "POST /mrf/inbound-loads/${load_id}/close"
              payload: { residual_tons: 0 }
              as: SortManager
          trigger:
            - call: "POST /mrf/inbound-loads/${load_id}/audit"
              payload: { sampled_contamination_pct: 3.0, audited_composition: [ { commodity: "OCC", pct: 97 } ] }
              as: ScaleOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_LOAD_NOT_AUDITABLE"
            - "http_status == 409"

      - name: corner_publish_index_twice_idempotency_rejected
        claim_type: Idempotency
        grounds: [state_machines.CommodityIndex.DRAFT_to_PUBLISHED, "errors[ERR_INDEX_NOT_DRAFT]"]
        distinguishing_aspect: "Publishing an already-PUBLISHED index returns ERR_INDEX_NOT_DRAFT (409)."
        test_recipe:
          setup: ["An OCC index published once."]
          setup_api_calls:
            - call: "POST /mrf/commodity-indices"
              payload: { commodity: "OCC", price_cents_per_ton: 8000, effective_start: "2026-03-01T00:00:00Z", effective_end: "2026-04-01T00:00:00Z" }
              as: CommodityTrader
              captures: { idx_id: $.data.id }
            - call: "POST /mrf/commodity-indices/${idx_id}/publish"
              payload: {}
              as: CommodityTrader
          trigger:
            - call: "POST /mrf/commodity-indices/${idx_id}/publish"
              payload: {}
              as: CommodityTrader
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INDEX_NOT_DRAFT"
            - "http_status == 409"

      - name: corner_reaudit_blocked_when_bales_exist
        claim_type: Precondition Enforcement
        grounds: [state_machines.InboundLoad.AUDITED_to_PENDING_REAUDIT, "errors[ERR_LOAD_INVALID_STATE]"]
        distinguishing_aspect: "request-reaudit on an AUDITED load that already has a non-VOIDED bale is rejected with ERR_LOAD_INVALID_STATE (409)."
        test_recipe:
          setup: ["Audited load with one OCC bale; PUBLISHED OCC index covers clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: SortManager
            - call: "POST /mrf/municipalities"
              payload: { name: "City A", revenue_share_pct: 0.50 }
              as: SettlementClerk
              captures: { m_id: $.data.id }
            - call: "POST /mrf/commodity-indices"
              payload: { commodity: "OCC", price_cents_per_ton: 8000, effective_start: "2026-03-01T00:00:00Z", effective_end: "2026-04-01T00:00:00Z" }
              as: CommodityTrader
              captures: { idx_id: $.data.id }
            - call: "POST /mrf/commodity-indices/${idx_id}/publish"
              payload: {}
              as: CommodityTrader
            - call: "POST /mrf/sort-lines"
              payload: { name: "Line 1", rated_tph: 10 }
              as: SortManager
              captures: { sl_id: $.data.id }
            - call: "POST /mrf/inbound-loads"
              payload: { source_municipality_id: "${m_id}", sort_line_id: "${sl_id}", hauler: "H1", gross_tons: 12, tare_tons: 2 }
              as: ScaleOperator
              captures: { load_id: $.data.id }
            - call: "POST /mrf/inbound-loads/${load_id}/audit"
              payload: { sampled_contamination_pct: 3.0, audited_composition: [ { commodity: "OCC", pct: 99 } ] }
              as: ScaleOperator
            - call: "POST /mrf/bales"
              payload: { source_load_id: "${load_id}", commodity: "OCC", net_tons: 5, moisture_pct: 0, quality_grade: "A" }
              as: SortManager
              captures: { bale_id: $.data.id }
          trigger:
            - call: "POST /mrf/inbound-loads/${load_id}/request-reaudit"
              payload: { reason: "re-check" }
              as: SortManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_LOAD_INVALID_STATE"
            - "http_status == 409"

      - name: corner_dispute_not_settled_shipment_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.MillShipment.SETTLED_to_DISPUTED, "errors[ERR_SHIPMENT_NOT_SETTLED]"]
        distinguishing_aspect: "Disputing a BUILDING shipment (not SETTLED) returns ERR_SHIPMENT_NOT_SETTLED (409)."
        test_recipe:
          setup: ["A BUILDING shipment."]
          setup_api_calls:
            - call: "POST /mrf/mills"
              payload: { name: "Mill 1", commodity_focus: "OCC", freight_rate_cents_per_ton: 0 }
              as: CommodityTrader
              captures: { mill_id: $.data.id }
            - call: "POST /mrf/mill-shipments"
              payload: { mill_id: "${mill_id}", commodity: "OCC", freight_cost_cents: 0 }
              as: CommodityTrader
              captures: { ship_id: $.data.id }
          trigger:
            - call: "POST /mrf/mill-shipments/${ship_id}/dispute"
              payload: { reason: "x" }
              as: CommodityTrader
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SHIPMENT_NOT_SETTLED"
            - "http_status == 409"

  # ===========================================================================
  - section: calculations
    instances:
      - name: corner_contamination_penalty_tier_value
        claim_type: Correct Result
        grounds: [calculations.contamination_adjustment, entities.InboundLoad.fields.provisional_adjustment_cents]
        distinguishing_aspect: "Penalty branch: net_tons=20, sampled 15.0% -> points_over=3 -> provisional_adjustment_cents = -round(20*3*150) = -9000."
        test_recipe:
          setup: ["Load net_tons=20 in RECEIVED."]
          setup_api_calls:
            - call: "POST /mrf/municipalities"
              payload: { name: "City A", revenue_share_pct: 0.50 }
              as: SettlementClerk
              captures: { m_id: $.data.id }
            - call: "POST /mrf/sort-lines"
              payload: { name: "Line 1", rated_tph: 10 }
              as: SortManager
              captures: { sl_id: $.data.id }
            - call: "POST /mrf/inbound-loads"
              payload: { source_municipality_id: "${m_id}", sort_line_id: "${sl_id}", hauler: "H1", gross_tons: 20, tare_tons: 0 }
              as: ScaleOperator
              captures: { load_id: $.data.id }
          trigger:
            - call: "POST /mrf/inbound-loads/${load_id}/audit"
              payload: { sampled_contamination_pct: 15.0, audited_composition: [ { commodity: "OCC", pct: 85 } ] }
              as: ScaleOperator
              captures: { prov: $.data.provisional_adjustment_cents }
          assert:
            - "InboundLoad.${load_id}.provisional_adjustment_cents == -9000"

      - name: corner_freight_allocation_by_tonnage
        claim_type: Correct Result
        grounds: [calculations.freight_allocation, calculations.mill_shipment_settlement, entities.Bale.fields.freight_share_cents]
        distinguishing_aspect: "Freight 3000 over two bales (2t and 4t of 6t) allocates 1000 and 2000 by tonnage at settle."
        test_recipe:
          setup: ["OCC index 10000 covering clock 03-10. Load net 6 closed; two OCC bales net 2 and net 4 (moisture 0 grade A) staged & shipped in a shipment with freight 3000."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: CommodityTrader
            - call: "POST /mrf/municipalities"
              payload: { name: "City A", revenue_share_pct: 0.50 }
              as: SettlementClerk
              captures: { m_id: $.data.id }
            - call: "POST /mrf/mills"
              payload: { name: "Mill 1", commodity_focus: "OCC", freight_rate_cents_per_ton: 500 }
              as: CommodityTrader
              captures: { mill_id: $.data.id }
            - call: "POST /mrf/commodity-indices"
              payload: { commodity: "OCC", price_cents_per_ton: 10000, effective_start: "2026-03-01T00:00:00Z", effective_end: "2026-04-01T00:00:00Z" }
              as: CommodityTrader
              captures: { idx_id: $.data.id }
            - call: "POST /mrf/commodity-indices/${idx_id}/publish"
              payload: {}
              as: CommodityTrader
            - call: "POST /mrf/sort-lines"
              payload: { name: "Line 1", rated_tph: 10 }
              as: SortManager
              captures: { sl_id: $.data.id }
            - call: "POST /mrf/inbound-loads"
              payload: { source_municipality_id: "${m_id}", sort_line_id: "${sl_id}", hauler: "H1", gross_tons: 6, tare_tons: 0 }
              as: ScaleOperator
              captures: { load_id: $.data.id }
            - call: "POST /mrf/inbound-loads/${load_id}/audit"
              payload: { sampled_contamination_pct: 3.0, audited_composition: [ { commodity: "OCC", pct: 99 } ] }
              as: ScaleOperator
            - call: "POST /mrf/bales"
              payload: { source_load_id: "${load_id}", commodity: "OCC", net_tons: 2, moisture_pct: 0, quality_grade: "A" }
              as: SortManager
              captures: { bale2_id: $.data.id }
            - call: "POST /mrf/bales"
              payload: { source_load_id: "${load_id}", commodity: "OCC", net_tons: 4, moisture_pct: 0, quality_grade: "A" }
              as: SortManager
              captures: { bale4_id: $.data.id }
            - call: "POST /mrf/inbound-loads/${load_id}/close"
              payload: { residual_tons: 0 }
              as: SortManager
            - call: "POST /mrf/mill-shipments"
              payload: { mill_id: "${mill_id}", commodity: "OCC", freight_cost_cents: 3000 }
              as: CommodityTrader
              captures: { ship_id: $.data.id }
            - call: "POST /mrf/mill-shipments/${ship_id}/bales"
              payload: { bale_id: "${bale2_id}" }
              as: CommodityTrader
            - call: "POST /mrf/mill-shipments/${ship_id}/bales"
              payload: { bale_id: "${bale4_id}" }
              as: CommodityTrader
            - call: "POST /mrf/mill-shipments/${ship_id}/ship"
              payload: {}
              as: CommodityTrader
          trigger:
            - call: "POST /mrf/mill-shipments/${ship_id}/settle"
              payload: {}
              as: CommodityTrader
          assert:
            - "Bale.${bale2_id}.freight_share_cents == 1000"
            - "Bale.${bale4_id}.freight_share_cents == 2000"

      - name: corner_sortline_throughput_computed_read
        claim_type: Correct Result
        grounds: [calculations.sortline_throughput, entities.SortLine.fields.throughput_tph]
        distinguishing_aspect: "One CLOSED load of net 22 with 120 downtime minutes on a 480-minute shift -> uptime 6h -> throughput_tph = round(22/6,2) = 3.67."
        test_recipe:
          setup: ["Sort line (shift 480). One downtime [08:00,10:00] (120 min). One load net 22 audited and closed on this line."]
          setup_api_calls:
            - call: "POST /mrf/municipalities"
              payload: { name: "City A", revenue_share_pct: 0.50 }
              as: SettlementClerk
              captures: { m_id: $.data.id }
            - call: "POST /mrf/sort-lines"
              payload: { name: "Line 1", rated_tph: 10, scheduled_shift_minutes: 480 }
              as: SortManager
              captures: { sl_id: $.data.id }
            - call: "POST /mrf/downtime-events"
              payload: { sort_line_id: "${sl_id}", start_at: "2026-03-01T08:00:00Z", end_at: "2026-03-01T10:00:00Z", reason: "jam" }
              as: SortManager
            - call: "POST /mrf/inbound-loads"
              payload: { source_municipality_id: "${m_id}", sort_line_id: "${sl_id}", hauler: "H1", gross_tons: 22, tare_tons: 0 }
              as: ScaleOperator
              captures: { load_id: $.data.id }
            - call: "POST /mrf/inbound-loads/${load_id}/audit"
              payload: { sampled_contamination_pct: 3.0, audited_composition: [ { commodity: "OCC", pct: 99 } ] }
              as: ScaleOperator
            - call: "POST /mrf/inbound-loads/${load_id}/close"
              payload: { residual_tons: 0 }
              as: SortManager
          trigger:
            - call: "GET /mrf/sort-lines/${sl_id}"
              payload: {}
              as: SortManager
              captures: { tp: $.data.throughput_tph }
          assert:
            - "SortLine.${sl_id}.total_processed_tons == 22"
            - "SortLine.${sl_id}.total_downtime_minutes == 120"
            - "SortLine.${sl_id}.throughput_tph == 3.67"

      - name: corner_sortline_throughput_zero_uptime_boundary
        claim_type: Precision
        grounds: [calculations.sortline_throughput, entities.SortLine.fields.throughput_tph, entities.DowntimeEvent.fields.downtime_minutes]
        distinguishing_aspect: "When total_downtime_minutes >= scheduled_shift_minutes (uptime_hours <= 0), throughput_tph is defined as 0 rather than dividing by zero."
        test_recipe:
          setup: ["Sort line shift 480; one downtime [08:00,16:00] = 480 min; one CLOSED load net 22."]
          setup_api_calls:
            - call: "POST /mrf/municipalities"
              payload: { name: "City A", revenue_share_pct: 0.50 }
              as: SettlementClerk
              captures: { m_id: $.data.id }
            - call: "POST /mrf/sort-lines"
              payload: { name: "Line 1", rated_tph: 10, scheduled_shift_minutes: 480 }
              as: SortManager
              captures: { sl_id: $.data.id }
            - call: "POST /mrf/downtime-events"
              payload: { sort_line_id: "${sl_id}", start_at: "2026-03-01T08:00:00Z", end_at: "2026-03-01T16:00:00Z", reason: "outage" }
              as: SortManager
            - call: "POST /mrf/inbound-loads"
              payload: { source_municipality_id: "${m_id}", sort_line_id: "${sl_id}", hauler: "H1", gross_tons: 22, tare_tons: 0 }
              as: ScaleOperator
              captures: { load_id: $.data.id }
            - call: "POST /mrf/inbound-loads/${load_id}/audit"
              payload: { sampled_contamination_pct: 3.0, audited_composition: [ { commodity: "OCC", pct: 99 } ] }
              as: ScaleOperator
            - call: "POST /mrf/inbound-loads/${load_id}/close"
              payload: { residual_tons: 0 }
              as: SortManager
          trigger:
            - call: "GET /mrf/sort-lines/${sl_id}"
              payload: {}
              as: SortManager
              captures: { tp: $.data.throughput_tph }
          assert:
            - "SortLine.${sl_id}.total_downtime_minutes == 480"
            - "SortLine.${sl_id}.throughput_tph == 0"

      - name: corner_statement_totals_penalty_only
        claim_type: Correct Result
        grounds: [calculations.statement_totals, entities.MunicipalStatement.fields.net_payable_cents]
        distinguishing_aspect: "A single PENALTY posting of magnitude 9000 in the period yields total_penalty_cents=9000, total_revenue_share_cents=0, net_payable_cents=-9000."
        test_recipe:
          setup: ["Municipality with one closed load producing a -9000 penalty posting in March; statement period [03-01,04-01) created after capturing current municipality version."]
          setup_api_calls:
            - call: "POST /mrf/municipalities"
              payload: { name: "City A", revenue_share_pct: 0.50 }
              as: SettlementClerk
              captures: { m_id: $.data.id }
            - call: "POST /mrf/sort-lines"
              payload: { name: "Line 1", rated_tph: 10 }
              as: SortManager
              captures: { sl_id: $.data.id }
