            - "data.issued_at == \"2026-09-15T10:00:00Z\" and data.expires_at == \"2026-10-15T10:00:00Z\""
            - "GET /resale-certificates with unit_id=${unit2} shows the LEDGER_BALANCE certificate with ledger_balance_cents == 35000, proration_credit_cents == 0 and projected_payoff_cents == 35000"

      - name: encumbrance_round_trip_and_invoice_at_the_exact_overrun_tolerance
        claim_type: correct_result
        grounds:
          - calculations.encumbrance_conservation_invariant
          - validations[priority 45]
          - state_machines.MaintenanceWorkOrder.transitions.COMPLETED_to_INVOICED.side_effects
        distinguishing_aspect: "INVARIANT E must survive a create-cancel round trip (committed back to 0) and then an invoice at final_cost 1100000 == floor(1000000 * 11 / 10) exactly, which swaps the estimate out of committed_cents into invoiced_cents with no drift; one cent more is ERR_INVOICE_EXCEEDS_TOLERANCE."
        test_recipe:
          setup:
            - "An ACTIVE elevator contract (cap 5000000, cert to 2027-06-30) with operating cash 5000000. Work order A (estimate 400000) is created then cancelled; work order B (estimate 1000000) is created, started on 2026-08-06 and completed."
