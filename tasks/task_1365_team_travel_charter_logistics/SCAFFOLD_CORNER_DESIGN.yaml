              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "PHI", game_tipoff_utc: "2027-04-21T00:00:00Z", return_arrival_utc: "2027-04-22T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/charter-contracts"
              payload: { vendor_code: "VB", base_price_cents: 8000000, fuel_surcharge_cap_cents: 800000, seat_capacity: 30, cargo_capacity_lb: 10000, penalty_bands: [{days_before: 30, penalty_pct: 10}, {days_before: 7, penalty_pct: 50}] }
