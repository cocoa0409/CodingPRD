# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml - task_2980_utility_service_line_warranty_program
#
# Test-targeting index for SKILL.md SS1.8. Every instance grounds in elements
# already declared in SCAFFOLD.yaml SS1.1-SS1.7; deleting this file must leave the
# scaffold's declared behavior identical.
#
# Nine SS0.5 rule_ids x 2 instances = 18 instances.
# Every numeric literal in an `assert:` was computed by executing the relevant
# SS1.3 formula in .scratch/step2/calc3.py and .scratch/step2/calc4.py.
#
# Logical clock: the implementation starts at 2026-08-01T00:00:00Z; every chain
# below re-pins it explicitly with POST /_clock/set_current_utc anyway.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # 1. dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: benefit_provisional_estimate_vs_final_settlement_diverge
        grounds:
          - calculations.dispatch_benefit_settlement
          - calculations.dispatch_benefit_settlement.variants.provisional_estimate
          - calculations.dispatch_benefit_settlement.variants.final_settlement
          - entities.Dispatch.fields.estimated_benefit_cents
          - entities.Dispatch.fields.benefit_paid_cents
          - entities.Enrollment.fields.annual_benefit_reserved_cents
          - state_machines.Dispatch.ACCEPTED_to_COMPLETED
        distinguishing_aspect: |
          The two variants are selected by LIFECYCLE POSITION on the same Dispatch: at creation the
          provisional_estimate variant reserves a rate-card figure of 228000 cents that ignores permit and
          restoration entirely, while at completion the final_settlement variant runs the four-bucket
          waterfall and posts 527000 cents - a 299000-cent divergence, and the reconciliation step proves
          the 228000 reservation never leaks into annual_benefit_used_cents.
        test_recipe:
          setup:
            - "Partner Cascadia Water is ACTIVE with one AVAILABLE product (per_occurrence_cap_cents 800000, annual_cap_cents 1000000, permit_covered true, restoration_covered_scope BASIC_BACKFILL)."
            - "One premises in OR owning WATER_CURB_STOP_TO_HOME, enrolled DIRECT_BILL on 2026-08-05 with prepaid_amount_cents 29988."
            - "The nightly run has activated coverage (coverage_effective_at 2026-09-04T00:00:00.000Z); the clock stands at 2026-09-10T08:00:00.000Z."
            - "Contractor Alder Plumbing (hourly_rate_cents 18000, sla_compliance_pct 92, max_open_dispatches 5, permit_pull_authorized true) is ACTIVE with an unexpired OR licence."
            - "One ROUTINE WATER_SERVICE_LINE claim on the enrollment has been APPROVED in triage; no ledger rows exist yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR", brand_approval_required: true, min_days_between_drops: 21, max_mailings_per_year: 2, rate_filing_required: false, bill_insert_supported: true }
              as: PlatformAdmin
              captures: { partner_id: $.data.id, partner_v1: $.data.version }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Water Line Protect", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 800000, annual_cap_cents: 1000000, permit_covered: true, restoration_covered_scope: "BASIC_BACKFILL", cap_reset_basis: "ENROLLMENT_ANNIVERSARY" }
              as: PlatformAdmin
              captures: { product_id: $.data.id }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Onboarding complete, product filed.", expected_partner_version: "${partner_v1}" }
              as: PlatformAdmin
            - call: "POST /premises"
              payload: { partner_id: "${partner_id}", street_address: "12 Alder St", state_code: "OR", owned_segments: ["WATER_CURB_STOP_TO_HOME"], do_not_mail: false, address_status: "GOOD" }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { premises_id: $.data.id, premises_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /enrollments"
              payload: { premises_id: "${premises_id}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${premises_v1}", prepaid_amount_cents: 29988 }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { enrollment_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /operations/nightly-run"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
            - call: "POST /contractors"
              payload: { name: "Alder Plumbing", state_code: "OR", license_number: "OR-PL-4471", license_expires_on: "2027-12-31", line_types_certified: ["WATER_SERVICE_LINE"], hourly_rate_cents: 18000, sla_compliance_pct: 92, max_open_dispatches: 5, permit_pull_authorized: true }
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { c_a_id: $.data.id }
            - call: "POST /claims"
              payload: { enrollment_id: "${enrollment_id}", line_type: "WATER_SERVICE_LINE", defect_location: "CURB_STOP_TO_METER", urgency: "ROUTINE", incident_description: "Water pooling at the curb stop, no pressure in the house." }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/triage-decision"
              payload: { decision: "APPROVE", coverage_note: "Curb-stop-to-meter leak sits inside the covered segment." }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { claim_v_approved: $.data.version }
          trigger:
            - call: "POST /claims/${claim_id}/dispatches"
              payload: { window_start: "2026-09-10T09:00:00.000Z", expected_claim_version: "${claim_v_approved}", contractor_id: "${c_a_id}" }
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { dispatch_id: $.data.id, estimate_cents: $.data.estimated_benefit_cents, score_std: $.data.selection_score }
            - call: "GET /enrollments/${enrollment_id}"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { reserved_after_dispatch: $.data.annual_benefit_reserved_cents, used_after_dispatch: $.data.annual_benefit_used_cents }
            - call: "POST /dispatches/${dispatch_id}/events"
              payload: { event_type: "ACCEPT" }
              as: NetworkContractor
              as_user_id: "${c_a_id}"
            - call: "POST /dispatches/${dispatch_id}/events"
              payload: { event_type: "COMPLETE", labor_cents: 260000, materials_cents: 175000, permit_number: "OR-PERMIT-3391", permit_fee_cents: 42000, restoration_cents: 90000, restoration_scope: "BASIC_BACKFILL" }
              as: NetworkContractor
              as_user_id: "${c_a_id}"
              captures: { final_paid_cents: $.data.benefit_paid_cents }
          assert:
            - "${estimate_cents} == 228000  # provisional variant: 6 h * 18000 + 120000, no permit or restoration component"
            - "${score_std} == 78.4  # MANUAL dispatch still records the standard-weight score the contractor would have earned"
            - "${reserved_after_dispatch} == 228000"
            - "${used_after_dispatch} == 0  # a reservation is not usage"
            - "${final_paid_cents} == 527000  # final variant: LABOR 260000 + MATERIALS 175000 + PERMIT 42000 + RESTORATION 50000"
            - "${final_paid_cents} - ${estimate_cents} == 299000"
            - "Dispatch.${dispatch_id}.invoice_total_cents == 567000"
            - "Dispatch.${dispatch_id}.customer_responsibility_cents == 40000  # the 40000-cent restoration overage above the BASIC_BACKFILL 50000 allowance"
            - "Dispatch.${dispatch_id}.status == COMPLETED"
            - "Claim.${claim_id}.status == PAID"
            - "Claim.${claim_id}.benefit_paid_cents == 527000"
            - "Enrollment.${enrollment_id}.annual_benefit_reserved_cents == 0  # reconciliation released the 228000 reservation"
            - "Enrollment.${enrollment_id}.annual_benefit_used_cents == 527000"
            - "Enrollment.${enrollment_id}.cap_status == WITHIN_CAP"
            - "GET /ledger-entries?enrollment_id=${enrollment_id}&entry_type=BENEFIT_CHARGE returns total_count == 1 with data[0].amount_cents == 527000 and data[0].ledger_kind == BENEFIT"

      - name: contractor_score_emergency_and_standard_weights_pick_different_winners
        grounds:
          - calculations.contractor_selection_score
          - calculations.contractor_selection_score.variants.same_day_emergency
          - calculations.contractor_selection_score.variants.standard_scheduled
          - entities.Dispatch.fields.selection_score
          - entities.Dispatch.fields.selection_mode
          - entities.Claim.fields.urgency
        distinguishing_aspect: |
          The two variants are selected by REQUEST DATA (Claim.urgency), not by lifecycle position: over one
          two-contractor pool the EMERGENCY weight vector picks Alder Plumbing at 89.9 while the STANDARD
          vector picks Bridgetown Excavation at 83.2, so the same eligible pool yields opposite assignees.
        test_recipe:
          setup:
            - "Partner Cascadia Water ACTIVE with the Water Line Protect product; one OR premises enrolled DIRECT_BILL on 2026-08-05; coverage ACTIVE after the nightly run; clock at 2026-09-10T08:00:00.000Z."
            - "Two eligible OR contractors, both certified WATER_SERVICE_LINE, both permit_pull_authorized, both with open_dispatch_count 0: Alder Plumbing (sla 92, rate 18000, max_open 5) and Bridgetown Excavation (sla 76, rate 6000, max_open 4)."
            - "Two claims on the same enrollment are APPROVED in triage: one EMERGENCY, one ROUTINE. Neither dispatch request names a contractor."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR", brand_approval_required: true, min_days_between_drops: 21, max_mailings_per_year: 2, rate_filing_required: false, bill_insert_supported: true }
              as: PlatformAdmin
              captures: { partner_id: $.data.id, partner_v1: $.data.version }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Water Line Protect", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 800000, annual_cap_cents: 1000000, permit_covered: true, restoration_covered_scope: "BASIC_BACKFILL", cap_reset_basis: "ENROLLMENT_ANNIVERSARY" }
              as: PlatformAdmin
              captures: { product_id: $.data.id }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Onboarding complete, product filed.", expected_partner_version: "${partner_v1}" }
              as: PlatformAdmin
            - call: "POST /premises"
              payload: { partner_id: "${partner_id}", street_address: "12 Alder St", state_code: "OR", owned_segments: ["WATER_CURB_STOP_TO_HOME"], do_not_mail: false, address_status: "GOOD" }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { premises_id: $.data.id, premises_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /enrollments"
              payload: { premises_id: "${premises_id}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${premises_v1}", prepaid_amount_cents: 29988 }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { enrollment_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /operations/nightly-run"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
            - call: "POST /contractors"
              payload: { name: "Alder Plumbing", state_code: "OR", license_number: "OR-PL-4471", license_expires_on: "2027-12-31", line_types_certified: ["WATER_SERVICE_LINE"], hourly_rate_cents: 18000, sla_compliance_pct: 92, max_open_dispatches: 5, permit_pull_authorized: true }
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { c_a_id: $.data.id }
            - call: "POST /contractors"
              payload: { name: "Bridgetown Excavation", state_code: "OR", license_number: "OR-EX-8802", license_expires_on: "2027-12-31", line_types_certified: ["WATER_SERVICE_LINE"], hourly_rate_cents: 6000, sla_compliance_pct: 76, max_open_dispatches: 4, permit_pull_authorized: true }
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { c_b_id: $.data.id }
            - call: "POST /claims"
              payload: { enrollment_id: "${enrollment_id}", line_type: "WATER_SERVICE_LINE", defect_location: "CURB_STOP_TO_METER", urgency: "EMERGENCY", incident_description: "Curb stop blown out, water flooding the basement now." }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { claim_emg_id: $.data.id }
            - call: "POST /claims/${claim_emg_id}/triage-decision"
              payload: { decision: "APPROVE", coverage_note: "Emergency curb-stop failure inside the covered segment." }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { claim_emg_v: $.data.version }
            - call: "POST /claims"
              payload: { enrollment_id: "${enrollment_id}", line_type: "WATER_SERVICE_LINE", defect_location: "METER_TO_HOME", urgency: "ROUTINE", incident_description: "Slow seep on the meter-to-home run, scheduled repair." }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { claim_rtn_id: $.data.id }
            - call: "POST /claims/${claim_rtn_id}/triage-decision"
              payload: { decision: "APPROVE", coverage_note: "Meter-to-home seep inside the covered segment." }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { claim_rtn_v: $.data.version }
          trigger:
            - call: "POST /claims/${claim_emg_id}/dispatches"
              payload: { window_start: "2026-09-10T09:00:00.000Z", expected_claim_version: "${claim_emg_v}" }
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { d_emg_id: $.data.id, d_emg_contractor: $.data.contractor_id, d_emg_score: $.data.selection_score, d_emg_mode: $.data.selection_mode }
            - call: "POST /claims/${claim_rtn_id}/dispatches"
              payload: { window_start: "2026-09-11T09:00:00.000Z", expected_claim_version: "${claim_rtn_v}" }
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { d_rtn_id: $.data.id, d_rtn_contractor: $.data.contractor_id, d_rtn_score: $.data.selection_score }
          assert:
            - "${d_emg_mode} == AUTOMATIC"
            - "${d_emg_contractor} == ${c_a_id}  # EMERGENCY weights 0.70/0.25/0.05"
            - "${d_emg_score} == 89.9  # 0.70*92 + 0.25*100 + 0.05*10"
            - "${d_rtn_contractor} == ${c_b_id}  # STANDARD weights 0.45/0.35/0.20"
            - "${d_rtn_score} == 83.2  # 0.45*76 + 0.35*100 + 0.20*70"
            - "${d_emg_contractor} != ${d_rtn_contractor}"
            - "Dispatch.${d_emg_id}.sla_deadline_at == 2026-09-10T12:00:00.000Z  # EMERGENCY SLA_HOURS 4 from reported_at 2026-09-10T08:00:00.000Z"
            - "Dispatch.${d_rtn_id}.sla_deadline_at == 2026-09-13T08:00:00.000Z  # ROUTINE SLA_HOURS 72 from the same reported_at"
            - "Dispatch.${d_emg_id}.estimated_benefit_cents == 228000  # 6 h * 18000 + 120000"
            - "Dispatch.${d_rtn_id}.estimated_benefit_cents == 156000  # 6 h * 6000 + 120000"
            - "Enrollment.${enrollment_id}.annual_benefit_reserved_cents == 384000"

  # ===========================================================================
  # 2. combinatorial_formula
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: contractor_selection_score_combines_sla_capacity_and_rate
        grounds:
          - calculations.contractor_selection_score
          - calculations.contractor_selection_score.ranking
          - calculations.contractor_selection_score.input_set_filter
          - entities.Contractor.fields.sla_compliance_pct
          - entities.Contractor.fields.max_open_dispatches
          - entities.Contractor.fields.hourly_rate_cents
          - entities.Contractor.fields.open_dispatch_count
        distinguishing_aspect: |
          A SINGLE formula fuses three independent entity inputs - sla_compliance_pct, a floor-derived
          capacity_headroom_pct and a floor-derived rate_score - and the winner is decided by none of them
          alone: Sitka Utility Works leads on sla_compliance_pct (95 vs 70) yet loses 60.25 to 82.5 because
          its rate_score floors to 0 and its headroom is only 50.
        test_recipe:
          setup:
            - "Partner Cascadia Water ACTIVE with the Water Line Protect product (permit_covered true); one OR premises enrolled DIRECT_BILL on 2026-08-05; coverage ACTIVE; clock at 2026-09-10T08:00:00.000Z."
            - "Sitka Utility Works: sla_compliance_pct 95, hourly_rate_cents 25000, max_open_dispatches 2, and exactly one open dispatch, so capacity_headroom_pct = floor(100*(2-1)/2) = 50 and rate_score = max(0, 100 - floor(25000/200)) = 0."
            - "Quarry Trenching: sla_compliance_pct 70, hourly_rate_cents 4000, max_open_dispatches 4, no open dispatches, so capacity_headroom_pct = 100 and rate_score = 80."
            - "A second ROUTINE claim on the same enrollment is APPROVED and awaits an automatic dispatch."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR", brand_approval_required: true, min_days_between_drops: 21, max_mailings_per_year: 2, rate_filing_required: false, bill_insert_supported: true }
              as: PlatformAdmin
              captures: { partner_id: $.data.id, partner_v1: $.data.version }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Water Line Protect", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 800000, annual_cap_cents: 1000000, permit_covered: true, restoration_covered_scope: "BASIC_BACKFILL", cap_reset_basis: "ENROLLMENT_ANNIVERSARY" }
              as: PlatformAdmin
              captures: { product_id: $.data.id }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Onboarding complete, product filed.", expected_partner_version: "${partner_v1}" }
              as: PlatformAdmin
            - call: "POST /premises"
              payload: { partner_id: "${partner_id}", street_address: "12 Alder St", state_code: "OR", owned_segments: ["WATER_CURB_STOP_TO_HOME"], do_not_mail: false, address_status: "GOOD" }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { premises_id: $.data.id, premises_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /enrollments"
              payload: { premises_id: "${premises_id}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${premises_v1}", prepaid_amount_cents: 29988 }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { enrollment_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /operations/nightly-run"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
            - call: "POST /contractors"
              payload: { name: "Sitka Utility Works", state_code: "OR", license_number: "OR-PL-1201", license_expires_on: "2027-12-31", line_types_certified: ["WATER_SERVICE_LINE"], hourly_rate_cents: 25000, sla_compliance_pct: 95, max_open_dispatches: 2, permit_pull_authorized: true }
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { c_p_id: $.data.id }
            - call: "POST /contractors"
              payload: { name: "Quarry Trenching", state_code: "OR", license_number: "OR-EX-1202", license_expires_on: "2027-12-31", line_types_certified: ["WATER_SERVICE_LINE"], hourly_rate_cents: 4000, sla_compliance_pct: 70, max_open_dispatches: 4, permit_pull_authorized: true }
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { c_q_id: $.data.id }
            - call: "POST /claims"
              payload: { enrollment_id: "${enrollment_id}", line_type: "WATER_SERVICE_LINE", defect_location: "CURB_STOP_TO_METER", urgency: "ROUTINE", incident_description: "First leak, curb stop weeping steadily." }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { claim_load_id: $.data.id }
            - call: "POST /claims/${claim_load_id}/triage-decision"
              payload: { decision: "APPROVE", coverage_note: "Covered curb-stop segment." }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { claim_load_v: $.data.version }
            - call: "POST /claims/${claim_load_id}/dispatches"
              payload: { window_start: "2026-09-10T09:00:00.000Z", expected_claim_version: "${claim_load_v}", contractor_id: "${c_p_id}" }
              as: OperationsAdmin
              as_user_id: "ops-001"
            - call: "POST /claims"
              payload: { enrollment_id: "${enrollment_id}", line_type: "WATER_SERVICE_LINE", defect_location: "METER_TO_HOME", urgency: "ROUTINE", incident_description: "Separate seep on the meter-to-home run." }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { claim_pick_id: $.data.id }
            - call: "POST /claims/${claim_pick_id}/triage-decision"
              payload: { decision: "APPROVE", coverage_note: "Covered meter-to-home segment." }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { claim_pick_v: $.data.version }
            - call: "GET /contractors/${c_p_id}"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { c_p_sla: $.data.sla_compliance_pct, c_p_open: $.data.open_dispatch_count, c_p_max: $.data.max_open_dispatches, c_p_rate: $.data.hourly_rate_cents }
          trigger:
            - call: "POST /claims/${claim_pick_id}/dispatches"
              payload: { window_start: "2026-09-11T09:00:00.000Z", expected_claim_version: "${claim_pick_v}" }
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { d_pick_id: $.data.id, d_pick_contractor: $.data.contractor_id, d_pick_score: $.data.selection_score, d_pick_mode: $.data.selection_mode }
          assert:
            - "${c_p_sla} == 95 and ${c_p_open} == 1 and ${c_p_max} == 2 and ${c_p_rate} == 25000  # the loser leads on the single highest-weighted input"
            - "${d_pick_mode} == AUTOMATIC"
            - "${d_pick_contractor} == ${c_q_id}"
            - "${d_pick_score} == 82.5  # 0.45*70 + 0.35*100 + 0.20*80 = 31.5 + 35.0 + 16.0"
            - "${d_pick_contractor} != ${c_p_id}  # Sitka would have scored 0.45*95 + 0.35*50 + 0.20*0 = 60.25"
            - "GET /contractors?state_code=OR&status=ACTIVE returns total_count == 2  # both contractors passed the eligibility filter, so the loss is purely the score"
            - "Dispatch.${d_pick_id}.estimated_benefit_cents == 144000  # 6 h * 4000 + 120000, the winner's own rate card"

      - name: direct_bill_refund_rounds_each_month_before_summing
        grounds:
          - calculations.cancellation_refund_proration
          - calculations.cancellation_refund_proration.pinned_order
          - calculations.cancellation_refund_proration.variants.direct_bill_cash_refund
          - entities.Enrollment.fields.refund_cents
          - entities.Enrollment.fields.cancellation_fee_cents
          - entities.LedgerEntry.fields.entry_type
          - state_machines.Enrollment.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          A MULTI-STEP ROUNDING ORDER decides the answer: rounding each of the four overlapped calendar
          months (2177 + 2499 + 2499 + 1416) before summing yields earned premium 8591 and refund 18897,
          whereas summing the exact fractional parts and rounding once yields 8627 and refund 18861, so a
          36-cent gap falsifies any implementation that reorders the two steps.
        test_recipe:
          setup:
            - "Partner Cascadia Water ACTIVE with the Water Line Protect product (monthly_price_cents 2499)."
            - "One OR premises enrolled DIRECT_BILL on 2026-08-05, so term_start 2026-08-05, term_end 2027-08-05 and prepaid_amount_cents 29988."
            - "The nightly run at 2026-09-10 activated coverage; the clock then stands at 2026-11-18T00:00:00.000Z with billing_status CURRENT and no claims."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR", brand_approval_required: true, min_days_between_drops: 21, max_mailings_per_year: 2, rate_filing_required: false, bill_insert_supported: true }
              as: PlatformAdmin
              captures: { partner_id: $.data.id, partner_v1: $.data.version }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Water Line Protect", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 800000, annual_cap_cents: 1000000, permit_covered: true, restoration_covered_scope: "BASIC_BACKFILL", cap_reset_basis: "ENROLLMENT_ANNIVERSARY" }
              as: PlatformAdmin
              captures: { product_id: $.data.id }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Onboarding complete, product filed.", expected_partner_version: "${partner_v1}" }
              as: PlatformAdmin
            - call: "POST /premises"
              payload: { partner_id: "${partner_id}", street_address: "12 Alder St", state_code: "OR", owned_segments: ["WATER_CURB_STOP_TO_HOME"], do_not_mail: false, address_status: "GOOD" }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { premises_id: $.data.id, premises_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /enrollments"
              payload: { premises_id: "${premises_id}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${premises_v1}", prepaid_amount_cents: 29988 }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { enrollment_id: $.data.id, term_start: $.data.term_start, prepaid: $.data.prepaid_amount_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /operations/nightly-run"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-18T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /enrollments/${enrollment_id}/cancellation"
              payload: { reason: "CUSTOMER_REQUEST", requested_effective_date: "2026-11-18" }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { refund: $.data.refund_cents, fee: $.data.cancellation_fee_cents, credit: $.data.credit_cents }
          assert:
            - "${term_start} == 2026-08-05 and ${prepaid} == 29988"
            - "${fee} == 2500  # elapsed 105 days >= FREE_LOOK_DAYS 30"
            - "${refund} == 18897  # 29988 - earned 8591 - fee 2500; the round-once-at-the-end variant would give 18861"
            - "${credit} == 0  # the bill_insert_credit variant does not apply to DIRECT_BILL"
            - "Enrollment.${enrollment_id}.premium_refunded_cents == 18897"
            - "Enrollment.${enrollment_id}.coverage_status == CANCELLED"
            - "Enrollment.${enrollment_id}.billing_status == REFUND_ISSUED"
            - "Enrollment.${enrollment_id}.cancellation_effective_date == 2026-11-18"
            - "GET /ledger-entries?enrollment_id=${enrollment_id}&entry_type=PRORATION_REFUND returns total_count == 1 with data[0].amount_cents == -18897 and data[0].ledger_kind == CASH"
            - "GET /ledger-entries?enrollment_id=${enrollment_id}&entry_type=CANCELLATION_FEE returns total_count == 1 with data[0].amount_cents == 2500"

  # ===========================================================================
  # 3. non_linear_state_machine
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: claim_denial_appeal_remand_cycle_bounded_by_appeal_limit
        grounds:
          - state_machines.Claim.TRIAGE_to_DENIED
          - state_machines.Claim.DENIED_to_APPEAL_OPEN
          - state_machines.Claim.APPEAL_OPEN_to_DENIED
          - entities.Claim.fields.appeal_count
          - entities.Claim.fields.denied_at
          - validations[priority=20].appeal-limit
          - validations[priority=55].appeal-window-open
          - calculations.claim_eligibility_assessment.constants.MAX_CLAIM_APPEALS
          - errors[ERR_APPEAL_LIMIT_REACHED]
        distinguishing_aspect: |
          A CYCLE, not a branch: DENIED -> APPEAL_OPEN -> DENIED is traversed twice on one claim, each REMAND
          refreshing denied_at so that an appeal filed 43 days after the ORIGINAL denial is still admissible,
          and the loop is terminated by the MAX_CLAIM_APPEALS counter rather than by an absorbing state -
          the claim is still in DENIED when the third appeal is refused.
        test_recipe:
          setup:
            - "Partner Cascadia Water ACTIVE with the Water Line Protect product; one OR premises enrolled DIRECT_BILL on 2026-08-05; the nightly run at 2026-09-10T08:00:00.000Z activated coverage."
            - "One ROUTINE claim with eligibility_assessment ELIGIBLE was DENIED in triage by adjuster adj-001 with denial_reason NOT_COVERED_SEGMENT at 2026-09-10T08:00:00.000Z."
            - "No nightly run occurs after the denial, so the phase-5 denied-claim closure sweep never fires."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR", brand_approval_required: true, min_days_between_drops: 21, max_mailings_per_year: 2, rate_filing_required: false, bill_insert_supported: true }
              as: PlatformAdmin
              captures: { partner_id: $.data.id, partner_v1: $.data.version }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Water Line Protect", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 800000, annual_cap_cents: 1000000, permit_covered: true, restoration_covered_scope: "BASIC_BACKFILL", cap_reset_basis: "ENROLLMENT_ANNIVERSARY" }
              as: PlatformAdmin
              captures: { product_id: $.data.id }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Onboarding complete, product filed.", expected_partner_version: "${partner_v1}" }
              as: PlatformAdmin
            - call: "POST /premises"
              payload: { partner_id: "${partner_id}", street_address: "12 Alder St", state_code: "OR", owned_segments: ["WATER_CURB_STOP_TO_HOME"], do_not_mail: false, address_status: "GOOD" }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { premises_id: $.data.id, premises_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /enrollments"
              payload: { premises_id: "${premises_id}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${premises_v1}", prepaid_amount_cents: 29988 }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { enrollment_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /operations/nightly-run"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
            - call: "POST /claims"
              payload: { enrollment_id: "${enrollment_id}", line_type: "WATER_SERVICE_LINE", defect_location: "CURB_STOP_TO_METER", urgency: "ROUTINE", incident_description: "Curb stop leaking at the sidewalk joint." }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { claim_id: $.data.id, eligibility: $.data.eligibility_assessment }
            - call: "POST /claims/${claim_id}/triage-decision"
              payload: { decision: "DENY", coverage_note: "Adjuster reads the failure as outside the insured segment.", denial_reason: "NOT_COVERED_SEGMENT" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { denied_at_1: $.data.denied_at }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /claims/${claim_id}/appeals"
              payload: { appeal_reason: "The excavation photo shows the break on the house side of the curb stop." }
              as: Policyholder
              as_user_id: "${premises_id}"
              captures: { appeal_count_1: $.data.appeal_count, status_appeal_1: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /claims/${claim_id}/appeal-decision"
              payload: { decision: "REMAND", rationale: "Send it back to triage for a second segment review." }
              as: AppealsOfficer
              as_user_id: "apo-001"
              captures: { status_remand_1: $.data.status, denied_at_2: $.data.denied_at, count_after_remand_1: $.data.appeal_count }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /claims/${claim_id}/appeals"
              payload: { appeal_reason: "Second appeal: the utility's own locate map contradicts the adjuster." }
              as: Policyholder
              as_user_id: "${premises_id}"
              captures: { appeal_count_2: $.data.appeal_count, status_appeal_2: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-12T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /claims/${claim_id}/appeal-decision"
              payload: { decision: "REMAND", rationale: "Denial stands on the current record; back to DENIED." }
              as: AppealsOfficer
              as_user_id: "apo-001"
              captures: { status_remand_2: $.data.status, denied_at_3: $.data.denied_at }
            - call: "POST /claims/${claim_id}/appeals"
              payload: { appeal_reason: "Third appeal attempt." }
              as: Policyholder
              as_user_id: "${premises_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${eligibility} == ELIGIBLE  # the denial is a segment judgement, not an eligibility failure"
            - "${denied_at_1} == 2026-09-10T08:00:00.000Z"
            - "${status_appeal_1} == APPEAL_OPEN and ${appeal_count_1} == 1"
            - "${status_remand_1} == DENIED and ${count_after_remand_1} == 1  # REMAND closes the appeal without consuming another one"
            - "${denied_at_2} == 2026-09-15T00:00:00.000Z  # denied_at refreshed by REMAND, restarting APPEAL_WINDOW_DAYS 30"
            - "${status_appeal_2} == APPEAL_OPEN and ${appeal_count_2} == 2  # admissible on 2026-10-10, 43 days after the original denial but 25 after the remand"
            - "${status_remand_2} == DENIED and ${denied_at_3} == 2026-10-12T00:00:00.000Z"
            - "${err_id} == ERR_APPEAL_LIMIT_REACHED with HTTP 409  # MAX_CLAIM_APPEALS 2 terminates the cycle"
            - "Claim.${claim_id}.status == DENIED  # still in the loop's low state, not an absorbing terminal state"
            - "Claim.${claim_id}.appeal_count == 2"
            - "Claim.${claim_id}.appeal_source == POLICYHOLDER"
            - "Claim.${claim_id}.appeal_decided_by_user_id == apo-001"

      - name: enrollment_coverage_billing_and_cap_dimensions_advance_independently
        grounds:
          - state_machines.Enrollment.parallel_dimensions
          - state_machines.Enrollment.CURRENT_to_PAST_DUE
          - state_machines.Enrollment.ACTIVE_to_SUSPENDED_NONPAY
          - state_machines.Enrollment.SUSPENDED_NONPAY_to_ACTIVE
          - state_machines.Enrollment.PAST_DUE_to_CURRENT
          - entities.Enrollment.fields.coverage_status
          - entities.Enrollment.fields.billing_status
          - entities.Enrollment.fields.cap_status
          - entities.Enrollment.fields.past_due_since
          - calculations.claim_eligibility_assessment.constants.NONPAY_SUSPENSION_DAYS
        distinguishing_aspect: |
          PARALLEL DIMENSIONS on one entity: the billing dimension moves CURRENT -> PAST_DUE with the coverage
          dimension untouched at ACTIVE, the nightly run 30 days later moves only coverage to SUSPENDED_NONPAY
          while billing stays PAST_DUE, one payment moves both back, and the cap dimension stays WITHIN_CAP
          across all four writes - three independent state words, never one combined status field.
        test_recipe:
          setup:
            - "Partner Cascadia Water ACTIVE with the Water Line Protect product; one OR premises enrolled DIRECT_BILL on 2026-08-05."
            - "The nightly run at 2026-09-10T00:00:00.000Z activated coverage: coverage_status ACTIVE, billing_status CURRENT, cap_status WITHIN_CAP."
            - "A MISSED_PAYMENT billing event dated 2026-09-10 has been posted, so billing_status is PAST_DUE with past_due_since 2026-09-10 and coverage is still ACTIVE."
            - "No claim, dispatch or ledger BENEFIT row exists, so the cap dimension has nothing to move it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR", brand_approval_required: true, min_days_between_drops: 21, max_mailings_per_year: 2, rate_filing_required: false, bill_insert_supported: true }
              as: PlatformAdmin
              captures: { partner_id: $.data.id, partner_v1: $.data.version }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Water Line Protect", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 800000, annual_cap_cents: 1000000, permit_covered: true, restoration_covered_scope: "BASIC_BACKFILL", cap_reset_basis: "ENROLLMENT_ANNIVERSARY" }
              as: PlatformAdmin
              captures: { product_id: $.data.id }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Onboarding complete, product filed.", expected_partner_version: "${partner_v1}" }
              as: PlatformAdmin
            - call: "POST /premises"
              payload: { partner_id: "${partner_id}", street_address: "12 Alder St", state_code: "OR", owned_segments: ["WATER_CURB_STOP_TO_HOME"], do_not_mail: false, address_status: "GOOD" }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { premises_id: $.data.id, premises_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /enrollments"
              payload: { premises_id: "${premises_id}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${premises_v1}", prepaid_amount_cents: 29988 }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { enrollment_id: $.data.id, cov_at_create: $.data.coverage_status, bill_at_create: $.data.billing_status, cap_at_create: $.data.cap_status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /operations/nightly-run"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { activated_ids: $.data.activated_enrollment_ids }
            - call: "POST /enrollments/${enrollment_id}/billing-events"
              payload: { event_type: "MISSED_PAYMENT", effective_date: "2026-09-10", memo: "Autopay returned NSF." }
              as: BillingOps
              as_user_id: "bill-001"
              captures: { cov_after_miss: $.data.coverage_status, bill_after_miss: $.data.billing_status, cap_after_miss: $.data.cap_status, past_due_since_1: $.data.past_due_since }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /operations/nightly-run"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { suspended_ids: $.data.suspended_enrollment_ids, lapsed_ids: $.data.lapsed_enrollment_ids }
            - call: "GET /enrollments/${enrollment_id}"
              payload: {}
              as: BillingOps
              as_user_id: "bill-001"
              captures: { cov_after_sweep: $.data.coverage_status, bill_after_sweep: $.data.billing_status, cap_after_sweep: $.data.cap_status }
            - call: "POST /enrollments/${enrollment_id}/billing-events"
              payload: { event_type: "PREMIUM_PAYMENT", effective_date: "2026-10-10", amount_cents: 2499, memo: "Arrears cleared by card." }
              as: BillingOps
              as_user_id: "bill-001"
              captures: { cov_after_pay: $.data.coverage_status, bill_after_pay: $.data.billing_status, cap_after_pay: $.data.cap_status, past_due_since_2: $.data.past_due_since }
          assert:
            - "${cov_at_create} == PENDING_WAITING_PERIOD and ${bill_at_create} == CURRENT and ${cap_at_create} == WITHIN_CAP"
            - "${activated_ids} contains ${enrollment_id}"
            - "${cov_after_miss} == ACTIVE  # the billing event does not touch the coverage dimension"
            - "${bill_after_miss} == PAST_DUE and ${past_due_since_1} == 2026-09-10"
            - "${cap_after_miss} == WITHIN_CAP"
            - "${suspended_ids} contains ${enrollment_id}  # exactly NONPAY_SUSPENSION_DAYS 30 after past_due_since"
            - "${lapsed_ids} does not contain ${enrollment_id}  # NONPAY_LAPSE_DAYS 60 has not elapsed"
            - "${cov_after_sweep} == SUSPENDED_NONPAY"
            - "${bill_after_sweep} == PAST_DUE  # the coverage sweep does not repair the billing dimension"
            - "${cap_after_sweep} == WITHIN_CAP"
            - "${cov_after_pay} == ACTIVE and ${bill_after_pay} == CURRENT  # one payment moves both dimensions"
            - "${past_due_since_2} == null"
            - "${cap_after_pay} == WITHIN_CAP  # the cap dimension never moved across four writes"
            - "Enrollment.${enrollment_id}.annual_benefit_used_cents == 0"
            - "GET /ledger-entries?enrollment_id=${enrollment_id}&ledger_kind=CASH returns total_count == 1 with data[0].entry_type == PREMIUM_PAYMENT and data[0].amount_cents == 2499  # MISSED_PAYMENT wrote no ledger row"

  # ===========================================================================
  # 4. transitive_cascade
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: dispatch_completion_cascades_to_sibling_claim_denial
        grounds:
          - state_machines.Dispatch.ACCEPTED_to_COMPLETED
          - state_machines.Claim.DISPATCHED_to_WORK_COMPLETE
          - state_machines.Claim.WORK_COMPLETE_to_PAID
          - state_machines.Enrollment.WITHIN_CAP_to_ANNUAL_CAP_EXHAUSTED
          - state_machines.Claim.TRIAGE_to_DENIED
          - calculations.dispatch_benefit_settlement
          - calculations.annual_and_occurrence_cap_usage
          - entities.LedgerEntry.fields.entry_type
          - endpoints.POST /dispatches/{dispatchId}/events
        distinguishing_aspect: |
          A FOUR-HOP chain crossing four entity types from ONE contractor event: Dispatch -> Claim (the worked
          claim) -> Enrollment (cap dimension) -> a DIFFERENT sibling Claim that no one touched, ending in an
          automatic DENIED/CAP_EXHAUSTED with triage_decided_by_user_id still null - the cascade, not an
          adjuster, denied it.
        test_recipe:
          setup:
            - "Partner Cascadia Water ACTIVE with product Sewer Guard Basic where per_occurrence_cap_cents == annual_cap_cents == 600000, permit_covered false and restoration_covered_scope NONE, so one occurrence can exhaust the whole year."
            - "One OR premises enrolled DIRECT_BILL on 2026-08-05; the nightly run at 2026-09-10T08:00:00.000Z activated coverage."
            - "Claim A (ROUTINE) is APPROVED and dispatched to Alder Plumbing, which has ACCEPTED the dispatch."
            - "Claim B (ROUTINE, a separate defect on the same enrollment) sits untouched in TRIAGE with eligibility_assessment ELIGIBLE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR", brand_approval_required: true, min_days_between_drops: 21, max_mailings_per_year: 2, rate_filing_required: false, bill_insert_supported: true }
              as: PlatformAdmin
              captures: { partner_id: $.data.id, partner_v1: $.data.version }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Sewer Guard Basic", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 600000, annual_cap_cents: 600000, permit_covered: false, restoration_covered_scope: "NONE", cap_reset_basis: "ENROLLMENT_ANNIVERSARY" }
              as: PlatformAdmin
              captures: { product_id: $.data.id }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Onboarding complete, product filed.", expected_partner_version: "${partner_v1}" }
