            - { call: "GET /terminals/${term}/inventory-summary", as: SupplyPlanner, captures: { res2: $.data.reserved_gal } }
          assert:
            - "weekly_committed_minutes: 0 (min0) -> 330 (min1) -> 0 (min2); forward+compensating pair leaves minutes unchanged"
            - "inventory-summary reserved_gal == 9000 before and after (res0 == res2); the reservation survives the loop"
