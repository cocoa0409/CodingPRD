      - name: c_deactivate_blocked_with_open_return
        claim_type: precondition_enforcement
        grounds: [state_machines.Vendor.ACTIVE_to_DEACTIVATED, "errors[ERR_VENDOR_HAS_OPEN_OBLIGATIONS]"]
        distinguishing_aspect: "Deactivation is gated on derived state: a vendor with a DRAFT return cannot be deactivated."
