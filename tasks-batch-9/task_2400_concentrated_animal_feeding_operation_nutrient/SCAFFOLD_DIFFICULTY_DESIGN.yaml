          trigger:
            - call: "POST /cafo/nutrient-plans/${pl_id}/require-revision"
              payload: {}
              as: StateReviewer
              as_user_id: "reviewer-1"
            - call: "PATCH /cafo/nutrient-plans/${pl_id}"
              payload: { allowed_application_methods: ["INJECTION"], winter_application_allowed: false }
