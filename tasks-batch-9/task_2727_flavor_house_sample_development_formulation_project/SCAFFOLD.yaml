    output: ApplicationTest
    side_effects:
      - "runs calculations.application_panel_score and stores panel_score and verdict_recorded_at"
      - "IN_PROGRESS -> PASSED when panel_score >= 70.00, else IN_PROGRESS -> FAILED"
      - "on PASSED: the brief's CommercializationForecast has technical_factor and weighted_annual_value_cents recomputed by calculations.forecast_value"
      - "on FAILED: LINK 1 the lot's APPROVED Formula -> REWORK_REQUIRED; LINK 2 the brief's ACTIVE CommercializationForecast -> AT_RISK with weighted_annual_value_cents recomputed; fan-out at LINK 1 holds the formula's released lots, cancels its scale-up batches and blocks their shipments"

