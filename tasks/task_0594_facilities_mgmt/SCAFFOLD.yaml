scenario: "Facilities / Integrated Building Management (CBRE style): building/asset & space, work-order & preventive-maintenance, vendor dispatch & SLA, soft-services (janitorial/security) coordination, energy/utility & sustainability, lease/occupancy & chargeback, capital project, KPI dashboard"
domain_name: integrated-facilities-management
api_prefix: "/fm"

complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: hybrid
  state_machine_shape: compound
  # Building.operating_posture is derived from Asset + WorkOrder aggregates and gates
  # every child write; WorkOrder carries two parallel dimensions (status x billing_status);
  # Dispatch, Asset, PMPlan and ChargebackStatement each carry a cycle.

  relationship_patterns:
    - one_to_many          # Building -> Space/Asset/Lease/CapitalProject/UtilityReading
    - many_to_many         # Lease <-> Space through LeaseAllocation
    - cross_aggregate      # WorkOrder -> CapitalProject funding; ChargebackStatement -> WorkOrder

  role_model: segregation_of_duties
  # CapitalProject approval: the FinanceController who proposed a project may not approve it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Building
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Building display name
      - name: code
        type: string
        source: input
        description: Unique building code
        constraints: unique across all Buildings
      - name: gross_area_sqm
        type: number
        source: input
        description: Gross leasable/servicable floor area in square metres, used as denominator for utility pro-rata and occupancy KPI
        constraints: "> 0"
      - name: region
        type: string
        source: input
        description: Region label, informational only
      - name: operating_posture
        type: enum
        source: computed
        description: Derived gate over all child writes; recomputed by calculations.building_operating_posture on every Asset status change, WorkOrder create/close/cancel, and ops-run
        default: OPEN
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: oos_critical_asset_count
        type: integer
        source: computed
        description: Count of Assets in this Building with criticality == CRITICAL and status == OUT_OF_SERVICE
        default: 0
      - name: open_p1_work_order_count
        type: integer
        source: computed
        description: Count of WorkOrders in this Building with priority == P1 and status IN {NEW, DISPATCHED, IN_PROGRESS, PENDING_QA}
        default: 0

  - name: Space
    parent: Building
    common_fields: true
    fields:
      - name: building_id
        type: string
        source: input
        description: FK -> Building.id; the building this space sits in
      - name: space_code
        type: string
        source: input
        description: Space code, unique within its Building
        constraints: unique per building_id
      - name: floor
        type: integer
        source: input
        description: Floor number
      - name: area_sqm
        type: number
        source: input
        description: Rentable area of this space in square metres
        constraints: "> 0"
      - name: space_type
        type: enum
        source: input
        description: Functional type of the space
        constraints: "OFFICE | LAB | RETAIL | COMMON | PLANT"
      - name: cost_center
        type: string
        source: input
        description: Cost centre code used for chargeback reporting
      - name: allocated_share_pct
        type: number
        source: computed
        description: Sum of share_pct over LeaseAllocations on this Space with status == ACTIVE whose [effective_from, effective_to] closed interval covers the current logical clock date
        default: 0
      - name: free_share_pct
        type: number
        source: computed
        description: 100 - allocated_share_pct; conserved-quantity counterpart used by the allocation/release invariant
        default: 100
      - name: occupancy_status
        type: enum
        source: computed
        description: OCCUPIED when allocated_share_pct > 0, else VACANT
        default: VACANT
        constraints: "VACANT | OCCUPIED"

  - name: Asset
    parent: Building
    common_fields: true
    fields:
      - name: building_id
        type: string
        source: input
        description: FK -> Building.id; the building this asset serves
      - name: asset_tag
        type: string
        source: input
        description: Asset tag, unique across all Assets
        constraints: globally unique
      - name: category
        type: enum
        source: input
        description: Asset trade category; a Vendor dispatched against this asset must carry the same trade
        constraints: "HVAC | ELEVATOR | FIRE | ELECTRICAL | PLUMBING"
      - name: criticality
        type: enum
        source: input
        description: Business criticality; CRITICAL assets drive Building FROZEN posture when OUT_OF_SERVICE
        constraints: "CRITICAL | STANDARD | LOW"
      - name: status
        type: enum
        source: computed
        description: Asset lifecycle state, see state_machines.Asset
        default: IN_SERVICE
        constraints: "IN_SERVICE | OUT_OF_SERVICE | RETIRED"
      - name: runtime_hours
        type: number
        source: input
        description: Cumulative runtime hours since last preventive maintenance; reset to 0 when a PREVENTIVE WorkOrder on this asset is CLOSED
        default: 0
      - name: failure_count
        type: integer
        source: computed
        description: Number of times report-failure has been invoked on this asset since the last preventive maintenance reset
        default: 0
      - name: condition_score
        type: number
        source: computed
        description: Derived health score, see calculations.asset_condition_score
        default: 100
      - name: last_pm_at
        type: datetime
        source: computed
        description: Logical-clock timestamp at which the last PREVENTIVE WorkOrder on this asset was CLOSED; null if never
        default: null

  - name: PMPlan
    parent: Asset
    common_fields: true
    fields:
      - name: asset_id
        type: string
        source: input
        description: FK -> Asset.id; the asset this preventive-maintenance plan covers
      - name: interval_days
        type: integer
        source: input
        description: Number of days between preventive maintenance visits
        constraints: ">= 1"
      - name: grace_days
        type: integer
        source: input
        description: Days of grace after next_due_at before the plan is OVERDUE
        constraints: ">= 0"
      - name: next_due_at
        type: datetime
        source: input
        description: Logical-clock timestamp at which the next preventive visit becomes DUE
      - name: status
        type: enum
        source: computed
        description: Plan lifecycle state, see state_machines.PMPlan
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED | RETIRED"
      - name: compliance_state
        type: enum
        source: computed
        description: Derived from the logical clock, see calculations.pm_compliance_state
        default: ON_TIME
        constraints: "ON_TIME | DUE | OVERDUE"

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Vendor company name
      - name: trade
        type: enum
        source: input
        description: The single trade this vendor is certified for
        constraints: "HVAC | ELEVATOR | FIRE | ELECTRICAL | PLUMBING | JANITORIAL | SECURITY"
      - name: hourly_rate
        type: number
        source: input
        description: Contracted labour rate per hour used by calculations.work_order_billable_amount from dispatch onward
        constraints: "> 0"
      - name: sla_response_minutes
        type: integer
        source: input
        description: Minutes from dispatch within which the vendor must accept
        constraints: ">= 1"
      - name: sla_resolve_minutes
        type: integer
        source: input
        description: Minutes from dispatch within which the vendor must complete
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: Vendor eligibility state, driven by strike_count thresholds
        default: ACTIVE
        constraints: "ACTIVE | PROBATION | SUSPENDED"
      - name: strike_count
        type: integer
        source: computed
        description: Incremented by 1 whenever a Dispatch of this vendor completes with sla_response_met == false or sla_resolve_met == false, and by 1 whenever one of its SoftServiceShifts is marked MISSED by ops-run
        default: 0
      - name: performance_score
        type: number
        source: computed
        description: Rolling-window variant of calculations.vendor_performance_score (last 3 COMPLETED dispatches)
        default: 100
      - name: lifetime_performance_score
        type: number
        source: computed
        description: Lifetime variant of calculations.vendor_performance_score (all COMPLETED dispatches)
        default: 100
      - name: completed_dispatch_count
        type: integer
        source: computed
        description: Number of Dispatches of this vendor that have ever reached COMPLETED
        default: 0

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - name: building_id
        type: string
        source: input
        description: FK -> Building.id; the building whose posture gates this order
      - name: asset_id
        type: string
        source: input
        description: FK -> Asset.id; optional, the asset under maintenance; null for SOFT_SERVICE orders
        default: null
      - name: pm_plan_id
        type: string
        source: input
        description: FK -> PMPlan.id; optional, set when the order fulfils a preventive-maintenance plan
        default: null
      - name: funding_project_id
        type: string
        source: input
        description: FK -> CapitalProject.id; optional, the capital project whose budget funds this order
        default: null
      - name: statement_id
        type: string
        source: computed
        description: FK -> ChargebackStatement.id; set when the order is picked up by a statement (billing_status INVOICED), cleared back to null when that statement is VOIDed
        default: null
      - name: wo_type
        type: enum
        source: input
        description: Work order type
        constraints: "CORRECTIVE | PREVENTIVE | SOFT_SERVICE"
      - name: priority
        type: enum
        source: input
        description: Priority band; drives the priority surcharge and the RESTRICTED posture gate
        constraints: "P1 | P2 | P3 | P4"
      - name: chargeable
        type: boolean
        source: input
        description: Whether the order's billable_amount is passed through to tenants via chargeback
        default: true
      - name: estimated_labor_hours
        type: number
        source: input
        description: Estimated labour hours, input to the provisional variant of calculations.work_order_billable_amount
        constraints: ">= 0"
      - name: estimated_parts_cost
        type: number
        source: input
        description: Estimated parts cost, input to the provisional variant of calculations.work_order_billable_amount
        constraints: ">= 0"
      - name: actual_labor_hours
        type: number
        source: computed
        description: Actual labour hours reported at dispatch completion
        default: null
      - name: actual_parts_cost
        type: number
        source: computed
        description: Actual parts cost reported at dispatch completion
        default: null
      - name: estimated_amount
        type: number
        source: computed
        description: Provisional cost, recomputed with the vendor's hourly_rate when a Dispatch is created; the amount held against funding_project.committed_amount
        default: 0
      - name: billable_amount
        type: number
        source: computed
        description: Final settled cost, computed by the final_settlement variant at dispatch completion; null before that
        default: null
      - name: status
        type: enum
        source: computed
        description: Execution dimension, see state_machines.WorkOrder
        default: NEW
        constraints: "NEW | DISPATCHED | IN_PROGRESS | PENDING_QA | CLOSED | CANCELLED"
      - name: billing_status
        type: enum
        source: computed
        description: Billing dimension, evolves independently of status; see state_machines.WorkOrder_billing
        default: PENDING
        constraints: "PENDING | INVOICED | SETTLED_CHARGEBACK | WAIVED"
      - name: failed_qa_count
        type: integer
        source: computed
        description: Number of times QA has returned FAIL on this order; a non-zero value costs the vendor its QA component in vendor_performance_score
        default: 0
      - name: dispatched_at
        type: datetime
        source: computed
        description: Logical-clock timestamp of the most recent Dispatch creation on this order; the reference instant for the after-hours multiplier and both SLA clocks
        default: null
      - name: sla_response_due_at
        type: datetime
        source: computed
        description: dispatched_at + vendor.sla_response_minutes
        default: null
      - name: sla_resolve_due_at
        type: datetime
        source: computed
        description: dispatched_at + vendor.sla_resolve_minutes
        default: null
      - name: sla_state
        type: enum
        source: computed
        description: WITHIN until a breach is observed; RESOLVE_BREACHED dominates RESPONSE_BREACHED
        default: WITHIN
        constraints: "WITHIN | RESPONSE_BREACHED | RESOLVE_BREACHED"
      - name: closed_at
        type: datetime
        source: computed
        description: Logical-clock timestamp at which QA passed and the order reached CLOSED
        default: null

  - name: Dispatch
    parent: WorkOrder
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: FK -> WorkOrder.id; the order being dispatched
      - name: vendor_id
        type: string
        source: input
        description: FK -> Vendor.id; the vendor offered the job
      - name: status
        type: enum
        source: computed
        description: Dispatch lifecycle, see state_machines.Dispatch
        default: OFFERED
        constraints: "OFFERED | ACCEPTED | DECLINED | COMPLETED | CANCELLED"
      - name: dispatched_at
        type: datetime
        source: computed
        description: Logical-clock timestamp at which the dispatch was created
      - name: accepted_at
        type: datetime
        source: computed
        description: Logical-clock timestamp of acceptance
        default: null
      - name: completed_at
        type: datetime
        source: computed
        description: Logical-clock timestamp of completion
        default: null
      - name: response_minutes
        type: integer
        source: computed
        description: Whole minutes between dispatched_at and accepted_at
        default: null
      - name: resolve_minutes
        type: integer
        source: computed
        description: Whole minutes between dispatched_at and completed_at
        default: null
      - name: sla_response_met
        type: boolean
        source: computed
        description: true when accepted_at <= work_order.sla_response_due_at (inclusive boundary)
        default: null
      - name: sla_resolve_met
        type: boolean
        source: computed
        description: true when completed_at <= work_order.sla_resolve_due_at (inclusive boundary)
        default: null
      - name: penalty_pct
        type: number
        source: computed
        description: SLA penalty percentage applied by the final_settlement variant; 0.10 for a response breach plus 0.15 for a resolve breach, capped at 0.25
        default: 0
      - name: actual_labor_hours
        type: number
        source: input
        description: Labour hours reported by the vendor at completion
        default: null
      - name: actual_parts_cost
        type: number
        source: input
        description: Parts cost reported by the vendor at completion
        default: null

  - name: SoftServiceShift
    parent: Building
    common_fields: true
    fields:
      - name: building_id
        type: string
        source: input
        description: FK -> Building.id; building the shift services
      - name: vendor_id
        type: string
        source: input
        description: FK -> Vendor.id; soft-service vendor staffing the shift; trade must be JANITORIAL or SECURITY and match service_type
      - name: zone_space_id
        type: string
        source: input
        description: FK -> Space.id; the space (zone) the shift covers; must belong to building_id
      - name: service_type
        type: enum
        source: input
        description: Soft-service line
        constraints: "JANITORIAL | SECURITY"
      - name: start_at
        type: datetime
        source: input
        description: Shift start; interval semantics are half-open [start_at, end_at) on the vendor resource, so one of the vendor's shifts may start exactly when another of its shifts ends
      - name: end_at
        type: datetime
        source: input
        description: Shift end (exclusive)
        constraints: "> start_at"
      - name: planned_headcount
        type: integer
        source: input
        description: Planned staff on the shift
        constraints: ">= 1"
      - name: actual_headcount
        type: integer
        source: input
        description: Staff actually present, reported at completion
        default: null
      - name: status
        type: enum
        source: computed
        description: Shift lifecycle, see state_machines.SoftServiceShift
        default: SCHEDULED
        constraints: "SCHEDULED | IN_PROGRESS | COMPLETED | MISSED | CANCELLED"

  - name: UtilityReading
    parent: Building
    common_fields: false
    fields:
      - name: building_id
        type: string
        source: input
        description: FK -> Building.id; the metered building
      - name: meter_type
        type: enum
        source: input
        description: Meter the reading came from; only ELECTRIC and GAS feed energy_intensity, all three feed total_utility_cost
        constraints: "ELECTRIC | GAS | WATER"
      - name: period_start
        type: datetime
        source: input
        description: Inclusive start of the metered period
      - name: period_end
        type: datetime
        source: input
        description: Inclusive end of the metered period
        constraints: "> period_start"
      - name: consumption_kwh
        type: number
        source: input
        description: Consumption in kWh-equivalent units
        constraints: ">= 0"
      - name: cost
        type: number
        source: input
        description: Cost of the metered period, pro-rated across leases by allocated area in calculations.chargeback_statement_total
        constraints: ">= 0"

  - name: Lease
    parent: Building
    common_fields: true
    fields:
      - name: building_id
        type: string
        source: input
        description: FK -> Building.id; the building leased from
      - name: tenant_name
        type: string
        source: input
        description: Tenant legal name
      - name: base_rate_per_sqm_month
        type: number
        source: input
        description: Monthly base rent per allocated square metre
        constraints: ">= 0"
      - name: start_date
        type: datetime
        source: input
        description: Lease start (inclusive)
      - name: end_date
        type: datetime
        source: input
        description: Lease end (inclusive); ops-run EXPIREs the lease once the clock passes it
        constraints: "> start_date"
      - name: status
        type: enum
        source: computed
        description: Lease lifecycle, see state_machines.Lease
        default: DRAFT
        constraints: "DRAFT | ACTIVE | EXPIRED"
      - name: allocated_area_sqm
        type: number
        source: computed
        description: Sum over LeaseAllocations of this lease with status == ACTIVE of (space.area_sqm * share_pct / 100), rounded to 2 decimals at the end
        default: 0

  - name: LeaseAllocation
    parent: Lease
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: FK -> Lease.id; the lease taking the space
      - name: space_id
        type: string
        source: input
        description: FK -> Space.id; the space allocated; must belong to the lease's building
      - name: share_pct
        type: number
        source: input
        description: Percentage of the space's area allocated to this lease
        constraints: "> 0 and <= 100"
      - name: effective_from
        type: datetime
        source: input
        description: Inclusive start of the allocation interval; interval semantics are fully closed [effective_from, effective_to], so touching endpoints DO collide
      - name: effective_to
        type: datetime
        source: input
        description: Inclusive end of the allocation interval
        constraints: ">= effective_from"
      - name: status
        type: enum
        source: computed
        description: ACTIVE on create; RELEASED after DELETE (soft release, row retained)
        default: ACTIVE
        constraints: "ACTIVE | RELEASED"

  - name: ChargebackStatement
    parent: Lease
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: FK -> Lease.id; the lease being billed
      - name: period_start
        type: datetime
        source: input
        description: Inclusive first instant of the billed calendar month
      - name: period_end
        type: datetime
        source: input
        description: Inclusive last instant of the billed calendar month; must be the same calendar month as period_start
      - name: base_rent
        type: number
        source: computed
        description: Per-allocation-line rounded base rent, see calculations.chargeback_statement_total
        default: 0
      - name: utility_share
        type: number
        source: computed
        description: Per-allocation-line rounded utility pro-rata, see calculations.chargeback_statement_total
        default: 0
      - name: om_share
        type: number
        source: computed
        description: Per-work-order rounded operations & maintenance pass-through, see calculations.chargeback_statement_total
        default: 0
      - name: total_amount
        type: number
        source: computed
        description: base_rent + utility_share + om_share (sum of already-rounded lines)
        default: 0
      - name: status
        type: enum
        source: computed
        description: Statement lifecycle, see state_machines.ChargebackStatement
        default: DRAFT
        constraints: "DRAFT | ISSUED | DISPUTED | SETTLED | VOID"
      - name: dispute_reason
        type: string
        source: input
        description: Reason supplied by the tenant when disputing
        default: null
      - name: issued_at
        type: datetime
        source: computed
        description: Logical-clock timestamp of the most recent issue transition
        default: null
      - name: settled_at
        type: datetime
        source: computed
        description: Logical-clock timestamp of settlement
        default: null

  - name: CapitalProject
    parent: Building
    common_fields: true
    fields:
      - name: building_id
        type: string
        source: input
        description: FK -> Building.id; the building the project improves
      - name: title
        type: string
        source: input
        description: Project title
      - name: base_cost
        type: number
        source: input
        description: Base construction cost; the SOLE key of the contingency tier lookup
        constraints: "> 0"
      - name: contingency_pct
        type: number
        source: computed
        description: Tier percentage selected from base_cost, see calculations.capital_project_budget
        default: 0
      - name: contingency_amount
        type: number
        source: computed
        description: round(base_cost * contingency_pct, 2)
        default: 0
      - name: budget_amount
        type: number
        source: computed
        description: round(base_cost + contingency_amount, 2)
        default: 0
      - name: committed_amount
        type: number
        source: computed
        description: Sum of estimated_amount over WorkOrders funded by this project whose status IN {NEW, DISPATCHED, IN_PROGRESS, PENDING_QA}
        default: 0
      - name: spent_amount
        type: number
        source: computed
        description: Sum of billable_amount over WorkOrders funded by this project whose status == CLOSED
        default: 0
      - name: remaining_amount
        type: number
        source: computed
        description: budget_amount - committed_amount - spent_amount; the conserved-quantity counterpart of the funding invariant
        default: 0
      - name: status
        type: enum
        source: computed
        description: Project lifecycle, see state_machines.CapitalProject
        default: PROPOSED
        constraints: "PROPOSED | APPROVED | REJECTED | IN_FLIGHT | CLOSED"
      - name: proposed_by_user_id
        type: string
        source: system
        description: X-User-ID of the caller who created the project; the segregation-of-duties check compares the approver against this value
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the FinanceController who approved or rejected the project
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Building
    dimension: operating_posture
    initial_state: OPEN
    terminal_states: []
    note: "Derived posture (compound). Never set by a caller; recomputed by calculations.building_operating_posture after every Asset status change, WorkOrder create/close/cancel and every ops-run."
    transitions:
      - from: OPEN
        to: FROZEN
        trigger: "system recompute after POST /fm/assets/{id}/report-failure on a CRITICAL asset"
        actor: system
        preconditions: ["building.oos_critical_asset_count >= 1 after the asset flips to OUT_OF_SERVICE"]
        side_effects:
          - "every PMPlan whose asset.building_id == this building and whose status == ACTIVE transitions to SUSPENDED"
          - "every SoftServiceShift of this building with status == SCHEDULED transitions to CANCELLED"
      - from: OPEN
        to: RESTRICTED
        trigger: "system recompute after POST /fm/work-orders creates a P1 order"
        actor: system
        preconditions: ["building.oos_critical_asset_count == 0", "building.open_p1_work_order_count >= 2"]
        side_effects: ["no cascade; the posture itself gates subsequent P3/P4 WorkOrder creation"]
      - from: RESTRICTED
        to: OPEN
        trigger: "system recompute after POST /fm/work-orders/{id}/qa (PASS) or POST /fm/work-orders/{id}/cancel drops open_p1_work_order_count below 2"
        actor: system
        preconditions: ["building.oos_critical_asset_count == 0", "building.open_p1_work_order_count <= 1"]
        side_effects: ["no cascade"]
      - from: RESTRICTED
        to: FROZEN
        trigger: "system recompute after POST /fm/assets/{id}/report-failure on a CRITICAL asset"
        actor: system
        preconditions: ["building.oos_critical_asset_count >= 1"]
        side_effects:
          - "every ACTIVE PMPlan of this building's assets transitions to SUSPENDED"
          - "every SCHEDULED SoftServiceShift of this building transitions to CANCELLED"
      - from: FROZEN
        to: OPEN
        trigger: "system recompute after POST /fm/work-orders/{id}/qa (PASS) on the CORRECTIVE order that restores the last OUT_OF_SERVICE critical asset"
        actor: system
        preconditions: ["building.oos_critical_asset_count == 0", "building.open_p1_work_order_count <= 1"]
        side_effects: ["every PMPlan of this building's assets with status == SUSPENDED transitions back to ACTIVE"]
      - from: FROZEN
        to: RESTRICTED
        trigger: "system recompute after POST /fm/work-orders/{id}/qa (PASS) restores the last critical asset while 2 or more P1 orders remain open"
        actor: system
        preconditions: ["building.oos_critical_asset_count == 0", "building.open_p1_work_order_count >= 2"]
        side_effects: ["every SUSPENDED PMPlan of this building's assets transitions back to ACTIVE"]

  - entity: Asset
    dimension: status
    initial_state: IN_SERVICE
    terminal_states: [RETIRED]
    note: "Cyclic: IN_SERVICE -> OUT_OF_SERVICE -> IN_SERVICE."
    transitions:
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "POST /fm/assets/{id}/report-failure"
        actor: FacilityManager
        preconditions: ["asset.status == IN_SERVICE"]
        side_effects:
          - "asset.failure_count += 1"
          - "asset.condition_score recomputed by calculations.asset_condition_score"
          - "building.oos_critical_asset_count recomputed; if the asset is CRITICAL this drives Building posture -> FROZEN, which in turn SUSPENDs the building's ACTIVE PMPlans and CANCELs its SCHEDULED SoftServiceShifts"
      - from: OUT_OF_SERVICE
        to: IN_SERVICE
        trigger: "system, on POST /fm/work-orders/{id}/qa with outcome PASS for a CORRECTIVE order whose asset_id is this asset"
        actor: system
        preconditions: ["asset.status == OUT_OF_SERVICE", "work_order.wo_type == CORRECTIVE"]
        side_effects:
          - "building.oos_critical_asset_count recomputed; posture may leave FROZEN, which reactivates the building's SUSPENDED PMPlans"
      - from: OUT_OF_SERVICE
        to: RETIRED
        trigger: "POST /fm/buildings/{id}/ops-run"
        actor: system
        preconditions: ["asset.status == OUT_OF_SERVICE", "asset.condition_score < 20"]
        side_effects:
          - "every PMPlan of this asset with status IN {ACTIVE, SUSPENDED} transitions to RETIRED"
          - "building.oos_critical_asset_count recomputed (a RETIRED asset no longer counts as OUT_OF_SERVICE), so posture may leave FROZEN"

  - entity: PMPlan
    dimension: status
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    note: "Cyclic: ACTIVE -> SUSPENDED -> ACTIVE, driven purely by the parent Building's posture."
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system, when Building.operating_posture becomes FROZEN"
        actor: system
        preconditions: ["plan.status == ACTIVE", "building.operating_posture == FROZEN"]
        side_effects: ["plan is skipped by ops-run overdue promotion while SUSPENDED"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system, when Building.operating_posture leaves FROZEN"
        actor: system
        preconditions: ["plan.status == SUSPENDED", "building.operating_posture IN {OPEN, RESTRICTED}"]
        side_effects: ["plan re-enters ops-run overdue promotion"]
      - from: ACTIVE
        to: RETIRED
        trigger: "system, when the plan's Asset transitions to RETIRED during POST /fm/buildings/{id}/ops-run"
        actor: system
        preconditions: ["asset.status == RETIRED"]
        side_effects: ["plan never promotes again"]
      - from: SUSPENDED
        to: RETIRED
        trigger: "system, when the plan's Asset transitions to RETIRED during POST /fm/buildings/{id}/ops-run"
        actor: system
        preconditions: ["asset.status == RETIRED"]
        side_effects: ["plan never promotes again"]

  - entity: WorkOrder
    dimension: status
    initial_state: NEW
    terminal_states: [CLOSED, CANCELLED]
    note: "Cyclic: PENDING_QA -> IN_PROGRESS on QA FAIL (rework loop). This dimension advances independently of the billing_status dimension declared below."
    transitions:
      - from: NEW
        to: DISPATCHED
        trigger: "POST /fm/work-orders/{id}/dispatches"
        actor: FacilityManager
        preconditions:
          - "work_order.status == NEW"
          - "payload.expected_work_order_version == work_order.version (OCC, see concurrency_rules.dispatch-create-stale-work-order)"
          - "vendor.status IN {ACTIVE, PROBATION}"
          - "vendor.trade == asset.category when work_order.asset_id is not null"
          - "when work_order.funding_project_id is not null: capital_project.remaining_amount + work_order.estimated_amount >= the recomputed estimated_amount"
        side_effects:
          - "any existing Dispatch of this order with status == OFFERED transitions to CANCELLED (supersede)"
          - "a new Dispatch is created with status OFFERED and dispatched_at = current logical clock"
          - "work_order.dispatched_at, sla_response_due_at = dispatched_at + vendor.sla_response_minutes, sla_resolve_due_at = dispatched_at + vendor.sla_resolve_minutes are stamped"
          - "work_order.estimated_amount recomputed by the provisional_estimate variant using vendor.hourly_rate"
          - "when funding_project_id is not null: capital_project.committed_amount += (new estimated_amount - previous estimated_amount) and remaining_amount recomputed; a project in APPROVED transitions to IN_FLIGHT on its first funded order"
          - "increments WorkOrder.version by 1"
      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /fm/dispatches/{id}/accept"
        actor: VendorTech
        preconditions: ["dispatch.status == OFFERED", "dispatch.vendor_id == X-User-ID"]
        side_effects:
          - "dispatch.status -> ACCEPTED, accepted_at stamped, response_minutes computed"
          - "dispatch.sla_response_met = (accepted_at <= work_order.sla_response_due_at)"
          - "work_order.sla_state -> RESPONSE_BREACHED when sla_response_met == false"
      - from: DISPATCHED
        to: NEW
        trigger: "POST /fm/dispatches/{id}/decline"
        actor: VendorTech
        preconditions: ["dispatch.status == OFFERED", "dispatch.vendor_id == X-User-ID"]
        side_effects:
          - "dispatch.status -> DECLINED"
          - "work_order.dispatched_at, sla_response_due_at, sla_resolve_due_at reset to null"
          - "work_order.estimated_amount recomputed by the provisional_estimate variant using STANDARD_LABOR_RATE (no vendor)"
          - "when funding_project_id is not null: capital_project.committed_amount adjusted by the estimated_amount delta"
      - from: IN_PROGRESS
        to: PENDING_QA
        trigger: "POST /fm/dispatches/{id}/complete"
        actor: VendorTech
        preconditions: ["dispatch.status == ACCEPTED", "dispatch.vendor_id == X-User-ID"]
        side_effects:
          - "dispatch.status -> COMPLETED, completed_at stamped, resolve_minutes computed, sla_resolve_met = (completed_at <= work_order.sla_resolve_due_at)"
          - "work_order.actual_labor_hours / actual_parts_cost copied from the payload; work_order.sla_state -> RESOLVE_BREACHED when sla_resolve_met == false"
          - "dispatch.penalty_pct = min(0.25, 0.10*(not sla_response_met) + 0.15*(not sla_resolve_met))"
          - "work_order.billable_amount computed by the final_settlement variant"
          - "CASCADE L2: when sla_response_met == false OR sla_resolve_met == false, vendor.strike_count += 1"
          - "CASCADE L2: vendor.completed_dispatch_count += 1; vendor.performance_score and lifetime_performance_score recomputed"
          - "CASCADE L3: when the incremented strike_count reaches exactly 2, vendor.status -> PROBATION; when it reaches 3 or more, vendor.status -> SUSPENDED"
          - "CASCADE L4: when the vendor became SUSPENDED, every Dispatch of that vendor with status == OFFERED transitions to CANCELLED and each of those dispatches' WorkOrders reverts DISPATCHED -> NEW (clearing dispatched_at and both SLA due timestamps)"
      - from: PENDING_QA
        to: IN_PROGRESS
        trigger: "POST /fm/work-orders/{id}/qa with outcome == FAIL"
        actor: FacilityManager
        preconditions: ["work_order.status == PENDING_QA"]
        side_effects:
          - "work_order.failed_qa_count += 1"
          - "the COMPLETED Dispatch of this order transitions back to ACCEPTED (rework loop); its completed_at, resolve_minutes, sla_resolve_met and penalty_pct are cleared"
          - "work_order.billable_amount reset to null"
          - "vendor.performance_score and lifetime_performance_score recomputed (the QA component of the reworked dispatch is now 0)"
      - from: PENDING_QA
        to: CLOSED
        trigger: "POST /fm/work-orders/{id}/qa with outcome == PASS"
        actor: FacilityManager
        preconditions: ["work_order.status == PENDING_QA"]
        side_effects:
          - "work_order.closed_at stamped from the logical clock"
          - "work_order.billing_status -> WAIVED when chargeable == false; stays PENDING when chargeable == true"
          - "when wo_type == CORRECTIVE and asset_id is not null and asset.status == OUT_OF_SERVICE: asset.status -> IN_SERVICE"
          - "when wo_type == PREVENTIVE and asset_id is not null: asset.runtime_hours = 0, asset.failure_count = max(0, failure_count - 1), asset.last_pm_at = clock, asset.condition_score recomputed; pm_plan.next_due_at += interval_days when pm_plan_id is set"
          - "building.open_p1_work_order_count and oos_critical_asset_count recomputed -> Building.operating_posture recomputed (may leave FROZEN, which reactivates SUSPENDED PMPlans)"
          - "when funding_project_id is not null: capital_project.committed_amount -= work_order.estimated_amount and spent_amount += work_order.billable_amount; remaining_amount recomputed"
      - from: NEW
        to: CANCELLED
        trigger: "POST /fm/work-orders/{id}/cancel"
        actor: FacilityManager
        preconditions: ["work_order.status == NEW"]
        side_effects:
          - "when funding_project_id is not null: capital_project.committed_amount -= work_order.estimated_amount (compensating release), remaining_amount recomputed, spent_amount unchanged"
          - "building.open_p1_work_order_count recomputed -> posture recomputed"
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /fm/work-orders/{id}/cancel"
        actor: FacilityManager
        preconditions: ["work_order.status == DISPATCHED"]
        side_effects:
          - "the OFFERED Dispatch of this order transitions to CANCELLED"
          - "when funding_project_id is not null: capital_project.committed_amount -= work_order.estimated_amount (compensating release), remaining_amount recomputed"
          - "building.open_p1_work_order_count recomputed -> posture recomputed"

  - entity: WorkOrder
    dimension: billing_status
    initial_state: PENDING
    terminal_states: [SETTLED_CHARGEBACK, WAIVED]
    note: "Parallel dimension on the same row as WorkOrder.status; the two axes advance independently."
    transitions:
      - from: PENDING
        to: INVOICED
        trigger: "POST /fm/leases/{id}/statements picks the order up into a DRAFT statement"
        actor: system
        preconditions: ["work_order.status == CLOSED", "work_order.chargeable == true", "work_order.closed_at within [statement.period_start, statement.period_end]"]
        side_effects: ["work_order.statement_id set to the new statement's id"]
      - from: INVOICED
        to: PENDING
        trigger: "system, when the statement holding this order transitions to VOID (superseded by a newer statement for the same period)"
        actor: system
        preconditions: ["statement.status == DRAFT before the void"]
        side_effects: ["work_order.statement_id cleared to null (compensating; the order becomes collectable by the superseding statement)"]
      - from: INVOICED
        to: SETTLED_CHARGEBACK
        trigger: "POST /fm/statements/{id}/settle"
        actor: system
        preconditions: ["statement.status == ISSUED"]
        side_effects: ["none"]
      - from: PENDING
        to: WAIVED
        trigger: "system, on POST /fm/work-orders/{id}/qa with outcome PASS when work_order.chargeable == false"
        actor: system
        preconditions: ["work_order.chargeable == false"]
        side_effects: ["the order is permanently excluded from every statement's om_share"]

  - entity: Dispatch
    dimension: status
    initial_state: OFFERED
    terminal_states: [DECLINED, CANCELLED]
    note: "Branching from OFFERED with divergent side-effect sets (accept vs decline vs supersede), plus the COMPLETED -> ACCEPTED rework cycle."
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /fm/dispatches/{id}/accept"
        actor: VendorTech
        preconditions: ["dispatch.status == OFFERED", "dispatch.vendor_id == X-User-ID", "work_order.status == DISPATCHED"]
        side_effects: ["work_order.status -> IN_PROGRESS", "sla_response_met evaluated at the inclusive boundary"]
      - from: OFFERED
        to: DECLINED
        trigger: "POST /fm/dispatches/{id}/decline"
        actor: VendorTech
        preconditions: ["dispatch.status == OFFERED", "dispatch.vendor_id == X-User-ID"]
        side_effects: ["work_order.status -> NEW", "work_order SLA timestamps cleared", "vendor.strike_count unchanged (a decline is not a breach)"]
      - from: OFFERED
        to: CANCELLED
        trigger: "system, on a superseding POST /fm/work-orders/{id}/dispatches, on POST /fm/work-orders/{id}/cancel, or on the vendor being SUSPENDED by the completion cascade"
        actor: system
        preconditions: ["dispatch.status == OFFERED"]
        side_effects: ["when the trigger was vendor suspension: work_order.status reverts DISPATCHED -> NEW"]
      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /fm/dispatches/{id}/complete"
        actor: VendorTech
        preconditions: ["dispatch.status == ACCEPTED", "dispatch.vendor_id == X-User-ID"]
        side_effects: ["see WorkOrder IN_PROGRESS -> PENDING_QA for the full 4-level cascade"]
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /fm/work-orders/{id}/cancel"
        actor: FacilityManager
        preconditions: ["work_order.status == DISPATCHED"]
        side_effects: ["none beyond the WorkOrder cancel side-effects"]
        note: "Reachable only when a decline/supersede left an ACCEPTED dispatch on a DISPATCHED order; ordinary ACCEPTED dispatches sit on IN_PROGRESS orders, which cannot be cancelled."
      - from: COMPLETED
        to: ACCEPTED
        trigger: "POST /fm/work-orders/{id}/qa with outcome == FAIL (rework cycle)"
        actor: FacilityManager
        preconditions: ["work_order.status == PENDING_QA", "dispatch.status == COMPLETED"]
        side_effects: ["completed_at, resolve_minutes, sla_resolve_met, penalty_pct cleared", "vendor scores recomputed"]

  - entity: SoftServiceShift
    dimension: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /fm/buildings/{id}/ops-run"
        actor: system
        preconditions: ["shift.start_at <= clock", "clock < shift.end_at"]
        side_effects: ["none"]
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /fm/soft-service-shifts/{id}/complete"
        actor: VendorTech
        preconditions: ["shift.status == SCHEDULED", "shift.vendor_id == X-User-ID"]
        side_effects: ["shift.actual_headcount recorded"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /fm/soft-service-shifts/{id}/complete"
        actor: VendorTech
        preconditions: ["shift.status == IN_PROGRESS", "shift.vendor_id == X-User-ID"]
        side_effects: ["shift.actual_headcount recorded"]
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /fm/buildings/{id}/ops-run"
        actor: system
        preconditions: ["shift.end_at <= clock", "shift.status == SCHEDULED"]
        side_effects:
          - "vendor.strike_count += 1"
          - "when the incremented strike_count reaches exactly 2, vendor.status -> PROBATION; when it reaches 3 or more, vendor.status -> SUSPENDED"
          - "when the vendor became SUSPENDED: every OFFERED Dispatch of that vendor transitions to CANCELLED and its WorkOrder reverts DISPATCHED -> NEW"
      - from: IN_PROGRESS
        to: MISSED
        trigger: "POST /fm/buildings/{id}/ops-run"
        actor: system
        preconditions: ["shift.end_at <= clock", "shift.status == IN_PROGRESS"]
        side_effects: ["vendor.strike_count += 1 and the same PROBATION/SUSPENDED threshold cascade"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system, when Building.operating_posture becomes FROZEN"
        actor: system
        preconditions: ["shift.status == SCHEDULED"]
        side_effects: ["no vendor strike (a posture cancellation is not the vendor's fault)"]

  - entity: Lease
    dimension: status
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /fm/leases/{id}/activate"
        actor: FinanceController
        preconditions: ["lease.status == DRAFT", "lease has at least one LeaseAllocation with status == ACTIVE"]
        side_effects: ["increments Lease.version by 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /fm/buildings/{id}/ops-run"
        actor: system
        preconditions: ["clock > lease.end_date"]
        side_effects: ["every LeaseAllocation of this lease with status == ACTIVE transitions to RELEASED, which raises each affected Space.free_share_pct back by that allocation's share_pct"]

  - entity: ChargebackStatement
    dimension: status
    initial_state: DRAFT
    terminal_states: [SETTLED, VOID]
    note: "Cyclic: ISSUED -> DISPUTED -> ISSUED (re-issue recomputes the totals from current data)."
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /fm/statements/{id}/issue"
        actor: FinanceController
        preconditions: ["statement.status == DRAFT", "lease.status == ACTIVE"]
        side_effects: ["statement.issued_at stamped from the logical clock"]
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /fm/statements/{id}/dispute"
        actor: TenantRep
        preconditions: ["statement.status == ISSUED", "statement.lease_id == X-User-ID"]
        side_effects: ["statement.dispute_reason recorded"]
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /fm/statements/{id}/issue (re-issue)"
        actor: FinanceController
        preconditions: ["statement.status == DISPUTED", "lease.status == ACTIVE"]
        side_effects:
          - "base_rent, utility_share, om_share and total_amount recomputed from current data by calculations.chargeback_statement_total"
          - "statement.issued_at re-stamped; dispute_reason retained"
      - from: ISSUED
        to: SETTLED
        trigger: "POST /fm/statements/{id}/settle"
        actor: FinanceController
        preconditions: ["statement.status == ISSUED"]
        side_effects:
          - "statement.settled_at stamped"
          - "every WorkOrder with statement_id == this statement transitions billing_status INVOICED -> SETTLED_CHARGEBACK"
      - from: DRAFT
        to: VOID
        trigger: "system, on POST /fm/leases/{id}/statements for the same period_start (supersede)"
        actor: system
        preconditions: ["statement.status == DRAFT"]
        side_effects: ["every WorkOrder with statement_id == this statement reverts billing_status INVOICED -> PENDING and clears statement_id (compensating release, so the superseding statement can collect them)"]

  - entity: CapitalProject
    dimension: status
    initial_state: PROPOSED
    terminal_states: [REJECTED, CLOSED]
    note: "Branching fork at PROPOSED: APPROVE and REJECT carry divergent side-effect sets."
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /fm/capital-projects/{id}/approve with decision == APPROVE"
        actor: FinanceController
        preconditions: ["project.status == PROPOSED", "X-User-ID != project.proposed_by_user_id (segregation of duties)"]
        side_effects: ["project.approved_by_user_id set to X-User-ID", "the project's budget becomes drawable by WorkOrders"]
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /fm/capital-projects/{id}/approve with decision == REJECT"
        actor: FinanceController
        preconditions: ["project.status == PROPOSED", "X-User-ID != project.proposed_by_user_id"]
        side_effects: ["project.approved_by_user_id set to X-User-ID", "budget_amount, committed_amount and spent_amount are frozen; the project can never fund a WorkOrder"]
      - from: APPROVED
        to: IN_FLIGHT
        trigger: "system, on POST /fm/work-orders whose funding_project_id is this project"
        actor: system
        preconditions: ["project.status == APPROVED"]
        side_effects: ["project.committed_amount += work_order.estimated_amount; remaining_amount recomputed"]
      - from: IN_FLIGHT
        to: CLOSED
        trigger: "POST /fm/buildings/{id}/ops-run"
        actor: system
        preconditions: ["project.status == IN_FLIGHT", "project.committed_amount == 0", "at least one WorkOrder funded by this project has status == CLOSED"]
        side_effects: ["no further WorkOrder may name this project as funding_project_id"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: dispatch-create-stale-work-order
    parent_entity: WorkOrder
    write_endpoint: "POST /fm/work-orders/{id}/dispatches"
    occ_field: "expected_work_order_version"
    description: |
      Creating a Dispatch against a WorkOrder whose version has advanced since the
      client last observed it is rejected. Dispatch creation legitimately supersedes
      any still-OFFERED dispatch on the order (cancelling it), so a writer holding a
      stale view of the order would silently cancel a dispatch it never saw; the
      stale-version check turns that into a deterministic 412 instead.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: statement-create-stale-lease
    parent_entity: Lease
    write_endpoint: "POST /fm/leases/{id}/statements"
    occ_field: "expected_lease_version"
    description: |
      Creating a ChargebackStatement against a Lease whose version has advanced since
      the client last observed it is rejected. A new statement for a period that already
      has a DRAFT statement legitimately VOIDs that draft and re-collects its WorkOrders,
      so a writer working from a stale view of the lease (its allocations may have moved)
      would void and re-price a draft it never saw; OCC makes the loser fail with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: work_order_billable_amount
    trigger: "provisional_estimate runs on POST /fm/work-orders (create), on POST /fm/work-orders/{id}/dispatches and on POST /fm/dispatches/{id}/decline; final_settlement runs on POST /fm/dispatches/{id}/complete and writes WorkOrder.billable_amount"
    algorithm: tiered_pricing
    formula: |
      # Reference instant R:
      #   - at WorkOrder create   : the logical clock at create time
      #   - at Dispatch create    : dispatch.dispatched_at
      #   - at Dispatch complete  : work_order.dispatched_at  (NOT completed_at)
      # Labour rate LR:
      #   - no vendor yet (WorkOrder create / after decline) : STANDARD_LABOR_RATE
      #   - vendor known (dispatch create / completion)      : vendor.hourly_rate
      after_hours = (hour_utc(R) < 8) or (hour_utc(R) >= 18)
      billed_hours = min(hours, LABOR_CAP_HOURS)
      labor        = billed_hours * LR * (AFTER_HOURS_MULTIPLIER if after_hours else 1.0)
      surcharge    = labor * PRIORITY_SURCHARGE[work_order.priority]
      markup_pct   = 0.15 if parts <= 500 else (0.10 if parts <= 2000 else 0.05)
      parts_billed = parts * (1 + markup_pct)
      gross        = max(MIN_CALLOUT_AMOUNT, labor + surcharge + parts_billed)
      gross        = round(gross, 2)                       # single rounding, at the end
      # provisional_estimate stops here and writes WorkOrder.estimated_amount = gross
      # final_settlement continues:
      penalty      = round(gross * dispatch.penalty_pct, 2)
      billable     = round(gross - penalty, 2)             # -> WorkOrder.billable_amount
    input_set: "hours/parts = (estimated_labor_hours, estimated_parts_cost) for provisional_estimate; (payload actual_labor_hours, actual_parts_cost) for final_settlement. dispatch.penalty_pct = min(0.25, 0.10*(sla_response_met == false) + 0.15*(sla_resolve_met == false))."
    constants:
      STANDARD_LABOR_RATE: 80.00
      AFTER_HOURS_MULTIPLIER: 1.5
      LABOR_CAP_HOURS: 12
      MIN_CALLOUT_AMOUNT: 150.00
      PRIORITY_SURCHARGE: { P1: 0.25, P2: 0.10, P3: 0.0, P4: 0.0 }
      PARTS_MARKUP_TIERS: "parts <= 500 -> 0.15; 500 < parts <= 2000 -> 0.10; parts > 2000 -> 0.05"
      SLA_RESPONSE_PENALTY_PCT: 0.10
      SLA_RESOLVE_PENALTY_PCT: 0.15
      SLA_PENALTY_CAP_PCT: 0.25
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional_estimate
        when: "WorkOrder create, Dispatch create, Dispatch decline — writes WorkOrder.estimated_amount, the amount held against CapitalProject.committed_amount"
        difference: "uses estimated_labor_hours / estimated_parts_cost, never applies an SLA penalty (no SLA outcome exists yet), and uses STANDARD_LABOR_RATE when no vendor is attached"
      - name: final_settlement
        when: "Dispatch complete — writes WorkOrder.billable_amount, the amount that flows into CapitalProject.spent_amount and into a statement's om_share"
        difference: "uses the vendor-reported actual_labor_hours / actual_parts_cost, always uses vendor.hourly_rate, and subtracts the SLA penalty credit; for identical work the two variants therefore disagree whenever actuals differ from estimates or any SLA leg was breached"

  - name: vendor_performance_score
    trigger: "recomputed on POST /fm/dispatches/{id}/complete and on POST /fm/work-orders/{id}/qa (both outcomes); writes Vendor.performance_score (rolling_window) and Vendor.lifetime_performance_score (lifetime)"
    algorithm: weighted_scoring
    formula: |
      D = dispatches of this vendor with status == COMPLETED,
          sorted by completed_at ASC, tie-break created_at ASC
      # rolling_window: take the last ROLLING_WINDOW_N entries of D (most recent by completed_at)
      # lifetime:       take all of D
      N = len(selected)
      if N == 0: score = 100.00
      else:
        response_rate = count(d.sla_response_met == true) / N
        resolve_rate  = count(d.sla_resolve_met  == true) / N
        qa_rate       = count(d.work_order.failed_qa_count == 0) / N
        score = round(100 * (W_RESPONSE*response_rate + W_RESOLVE*resolve_rate + W_QA*qa_rate), 2)
    input_set: "Only Dispatch rows with status == COMPLETED count. A dispatch pushed back to ACCEPTED by a QA FAIL leaves the set entirely until it is completed again; its WorkOrder's failed_qa_count stays incremented, so on re-completion it contributes 0 to qa_rate."
    constants:
      W_RESPONSE: 0.4
      W_RESOLVE: 0.3
      W_QA: 0.3
      ROLLING_WINDOW_N: 3
      PROBATION_STRIKES: 2
      SUSPENSION_STRIKES: 3
    precision: "2 decimal places, round_half_up"
    variants:
      - name: rolling_window
        when: "Vendor.performance_score, the score a facility manager reads to decide dispatch eligibility"
        difference: "considers only the 3 most recent COMPLETED dispatches by completed_at (tie-break created_at ASC), so old failures age out"
      - name: lifetime
        when: "Vendor.lifetime_performance_score, the contract-level score"
        difference: "considers every COMPLETED dispatch ever; with 4+ dispatches and an old breach, lifetime and rolling_window disagree on identical data"

  - name: chargeback_statement_total
    trigger: "POST /fm/leases/{id}/statements (create) and POST /fm/statements/{id}/issue when re-issuing from DISPUTED; writes ChargebackStatement.base_rent / utility_share / om_share / total_amount"
    algorithm: aggregation
    formula: |
      A = LeaseAllocations of the lease with status == ACTIVE whose closed interval
          [effective_from, effective_to] overlaps [period_start, period_end]
          (sorted by created_at ASC — the sum is order-independent but the remainder rule is not)
      # (1) base rent — ROUND PER LINE, THEN SUM (pinned order)
      base_rent = sum over a in A of
                    round(space(a).area_sqm * a.share_pct / 100 * lease.base_rate_per_sqm_month, 2)
      # (2) utility share — ROUND PER LINE, THEN SUM (pinned order)
      U = sum of UtilityReading.cost for readings of lease.building_id whose
          [period_start, period_end] is FULLY CONTAINED in the statement period (inclusive both ends)
      utility_share = sum over a in A of
                    round(U * (space(a).area_sqm * a.share_pct / 100) / building.gross_area_sqm, 2)
      # (3) O&M share — ROUND PER WORK ORDER, THEN SUM (pinned order)
      lease_share = lease.allocated_area_sqm / building.gross_area_sqm
      W = WorkOrders with building_id == lease.building_id, status == CLOSED,
          billing_status == PENDING, chargeable == true,
          closed_at within [period_start, period_end] (inclusive both ends)
      om_share = sum over w in W of round(w.billable_amount * lease_share, 2)
      # (4) total — sum of already-rounded lines; NO further rounding pass
      total_amount = round(base_rent + utility_share + om_share, 2)
    input_set: "Only ACTIVE allocations overlapping the period; only fully-contained utility readings; only CLOSED + PENDING + chargeable work orders closed inside the period. WAIVED, INVOICED and SETTLED_CHARGEBACK orders are never re-collected."
    constants: {}
    precision: "2 decimal places, round_half_up, applied PER LINE before summation — 'sum then round' is explicitly wrong and produces a different total when two lines each carry a repeating fraction"
    variants: []

  - name: capital_project_budget
    trigger: "POST /fm/capital-projects (create); writes contingency_pct, contingency_amount, budget_amount, remaining_amount"
    algorithm: threshold
    formula: |
      # Evaluation order is PINNED. The tier is keyed on base_cost, NOT on budget_amount —
      # although budget_amount depends on the contingency and the contingency looks like a
      # function of the total, the lookup key is always the base cost.
      step 1: contingency_pct    = 0.10 if base_cost <= 100000
                                   else 0.07 if base_cost <= 500000
                                   else 0.05
      step 2: contingency_amount = round(base_cost * contingency_pct, 2)
      step 3: budget_amount      = round(base_cost + contingency_amount, 2)
      step 4: remaining_amount   = round(budget_amount - committed_amount - spent_amount, 2)
    input_set: "base_cost from the create payload; committed_amount and spent_amount start at 0 and are maintained by the WorkOrder lifecycle."
    constants:
      CONTINGENCY_TIERS: "base_cost <= 100000 -> 0.10; 100000 < base_cost <= 500000 -> 0.07; base_cost > 500000 -> 0.05"
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: sla_evaluation
    trigger: "sla_response_due_at / sla_resolve_due_at stamped on POST /fm/work-orders/{id}/dispatches; sla_response_met evaluated on POST /fm/dispatches/{id}/accept; sla_resolve_met and penalty_pct evaluated on POST /fm/dispatches/{id}/complete"
    algorithm: threshold
    formula: |
      sla_response_due_at = dispatch.dispatched_at + vendor.sla_response_minutes minutes
      sla_resolve_due_at  = dispatch.dispatched_at + vendor.sla_resolve_minutes  minutes
      response_minutes = floor((accepted_at  - dispatched_at).total_seconds() / 60)
      resolve_minutes  = floor((completed_at - dispatched_at).total_seconds() / 60)
      sla_response_met = accepted_at  <= sla_response_due_at    # INCLUSIVE: exactly on the deadline is MET
      sla_resolve_met  = completed_at <= sla_resolve_due_at     # INCLUSIVE
      penalty_pct = min(SLA_PENALTY_CAP_PCT,
                        (0.10 if not sla_response_met else 0) + (0.15 if not sla_resolve_met else 0))
      work_order.sla_state = RESOLVE_BREACHED if not sla_resolve_met
                             else RESPONSE_BREACHED if not sla_response_met
                             else WITHIN
    input_set: "Only the current dispatch of the order. A superseded/declined dispatch's timestamps are discarded when the order returns to NEW."
    constants:
      SLA_PENALTY_CAP_PCT: 0.25
    precision: "whole minutes, floor; boundary is inclusive (<=), so accepting at exactly dispatched_at + sla_response_minutes is MET"
    variants: []

  - name: building_operating_posture
    trigger: "recomputed after POST /fm/assets/{id}/report-failure, POST /fm/work-orders, POST /fm/work-orders/{id}/qa, POST /fm/work-orders/{id}/cancel and POST /fm/buildings/{id}/ops-run; writes Building.operating_posture, oos_critical_asset_count, open_p1_work_order_count"
    algorithm: aggregation
    formula: |
      oos_critical_asset_count = count(Asset where building_id == B
                                       and criticality == CRITICAL
                                       and status == OUT_OF_SERVICE)     # RETIRED does not count
      open_p1_work_order_count = count(WorkOrder where building_id == B
                                       and priority == P1
                                       and status IN {NEW, DISPATCHED, IN_PROGRESS, PENDING_QA})
      if   oos_critical_asset_count >= 1 : posture = FROZEN
      elif open_p1_work_order_count >= 2 : posture = RESTRICTED
      else                               : posture = OPEN
    input_set: "All non-RETIRED Assets and all non-terminal WorkOrders of the building. Zero assets and zero work orders (the empty-set case) yield OPEN."
    constants:
      FROZEN_OOS_CRITICAL_THRESHOLD: 1
      RESTRICTED_OPEN_P1_THRESHOLD: 2
    precision: "integer counts; thresholds are >= (exactly 2 open P1 orders is RESTRICTED, 1 is OPEN)"
    variants: []

  - name: pm_compliance_state
    trigger: "recomputed on every read of a PMPlan and on POST /fm/buildings/{id}/ops-run; writes PMPlan.compliance_state"
    algorithm: threshold
    formula: |
      now = logical clock
      grace_end = next_due_at + grace_days days
      if   now <  next_due_at : ON_TIME
      elif now <= grace_end   : DUE          # inclusive on both ends of the grace window
      else                    : OVERDUE
    input_set: "The plan's own next_due_at and grace_days versus the logical clock. Plans with status == RETIRED keep their last computed value and are excluded from ops-run promotion; SUSPENDED plans still compute a compliance_state but are skipped by promotion."
    constants: {}
    precision: "exact timestamp comparison; the boundary instant now == next_due_at is DUE, and now == next_due_at + grace_days is still DUE"
    variants: []

  - name: pm_overdue_promotion
    trigger: "POST /fm/buildings/{id}/ops-run"
    algorithm: chronological
    formula: |
      candidates = PMPlans P where P.asset.building_id == B
                   and P.status == ACTIVE
                   and pm_compliance_state(P) == OVERDUE
                   and no WorkOrder exists with pm_plan_id == P.id and status NOT IN {CLOSED, CANCELLED}
      process candidates in ascending next_due_at, tie-break created_at ASC
      for each: create WorkOrder(building_id = B, asset_id = P.asset_id, pm_plan_id = P.id,
                                 wo_type = PREVENTIVE, priority = P2, chargeable = true,
                                 estimated_labor_hours = PM_DEFAULT_HOURS,
                                 estimated_parts_cost = PM_DEFAULT_PARTS,
                                 status = NEW, funding_project_id = null)
                and run work_order_billable_amount.provisional_estimate on it
    input_set: "Only ACTIVE plans; SUSPENDED (FROZEN building) and RETIRED plans are skipped. A plan that already has an open PREVENTIVE order is skipped, so ops-run is idempotent within an epoch."
    constants:
      PM_DEFAULT_HOURS: 3
      PM_DEFAULT_PARTS: 200.00
    precision: "n/a"
    variants: []

  - name: asset_condition_score
    trigger: "recomputed on POST /fm/assets (create), POST /fm/assets/{id}/report-failure, and on POST /fm/work-orders/{id}/qa with outcome PASS; writes Asset.condition_score"
    algorithm: decay_function
    formula: |
      runtime_decay   = floor(runtime_hours / RUNTIME_DECAY_BLOCK_HOURS) * RUNTIME_DECAY_POINTS
      failure_penalty = failure_count * FAILURE_PENALTY_POINTS
      condition_score = max(0, min(100, 100 - runtime_decay - failure_penalty))
    input_set: "The asset's own runtime_hours and failure_count. A CLOSED PREVENTIVE work order resets runtime_hours to 0 and decrements failure_count by 1 (floored at 0), which restarts the decay curve."
    constants:
      RUNTIME_DECAY_BLOCK_HOURS: 1000
      RUNTIME_DECAY_POINTS: 5
      FAILURE_PENALTY_POINTS: 12
      RETIREMENT_SCORE_THRESHOLD: 20
    precision: "2 decimal places, round_half_up; clamped to [0, 100]"
    variants: []

  - name: building_kpi_dashboard
    trigger: "GET /fm/buildings/{id}/kpi"
    algorithm: aggregation
    formula: |
      # window = [window_start, window_end], inclusive on both ends
      readings = UtilityReadings of B whose [period_start, period_end] is FULLY CONTAINED in the window
      energy_intensity_kwh_per_sqm = round(
          sum(r.consumption_kwh for r in readings if r.meter_type IN {ELECTRIC, GAS})
          / building.gross_area_sqm, 3)
      total_utility_cost = round(sum(r.cost for r in readings), 2)          # all three meter types
      open_work_order_count = count(WorkOrder of B with status IN {NEW, DISPATCHED, IN_PROGRESS, PENDING_QA})
      Dcomp = Dispatches whose work_order.building_id == B and status == COMPLETED
      sla_compliance_pct = 100.00 if len(Dcomp) == 0 else round(
          100 * count(d in Dcomp where d.sla_response_met and d.sla_resolve_met) / len(Dcomp), 2)
      Pact = PMPlans of B's assets with status == ACTIVE
      pm_compliance_pct = 100.00 if len(Pact) == 0 else round(
          100 * count(p in Pact where pm_compliance_state(p) != OVERDUE) / len(Pact), 2)
      occupancy_pct = round(100 * sum(s.area_sqm for s in Spaces of B where s.occupancy_status == OCCUPIED)
                            / building.gross_area_sqm, 2)
      posture = building.operating_posture
    input_set: "Empty-set semantics are pinned: zero COMPLETED dispatches -> sla_compliance_pct = 100.00; zero ACTIVE plans -> pm_compliance_pct = 100.00; zero readings in the window -> energy_intensity 0.0 and total_utility_cost 0.00; zero OCCUPIED spaces -> occupancy_pct 0.00."
    constants: {}
    precision: "energy_intensity 3 decimals; every percentage and cost 2 decimals; round_half_up"
    variants: []

  - name: space_share_conservation
    trigger: "POST /fm/leases/{id}/allocations, DELETE /fm/lease-allocations/{id}, and the ops-run lease-expiry release; writes Space.allocated_share_pct, free_share_pct, occupancy_status and Lease.allocated_area_sqm"
    algorithm: constraint_propagation
    formula: |
      # evaluated as of the current logical clock date D
      covering = LeaseAllocations on the space with status == ACTIVE
                 and effective_from <= D <= effective_to        # closed interval, inclusive
      allocated_share_pct = round(sum(a.share_pct for a in covering), 2)
      free_share_pct      = round(100 - allocated_share_pct, 2)
      occupancy_status    = OCCUPIED if allocated_share_pct > 0 else VACANT
      lease.allocated_area_sqm = round(sum(space(a).area_sqm * a.share_pct / 100
                                           for a in the lease's ACTIVE allocations), 2)
      # INVARIANT: allocated_share_pct + free_share_pct == 100 after every create and every release
    input_set: "Only ACTIVE allocations covering the current clock date. RELEASED allocations are excluded immediately, so a DELETE restores free_share_pct to its pre-create value exactly."
    constants:
      MAX_SPACE_SHARE_PCT: 100
    precision: "2 decimal places, round_half_up"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (evaluated in ascending priority; first failure wins)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "the caller's role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 25
    category: business_constraint
    check: "request body/query shape: all required fields present, enum values legal, numeric constraints honoured (gross_area_sqm > 0, area_sqm > 0, share_pct in (0,100], hourly_rate > 0, base_cost > 0, end_at > start_at, effective_to >= effective_from, period_end > period_start, planned_headcount >= 1, estimated_* >= 0, limit in [1,100], offset >= 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all writes and all list endpoints

  - priority: 30
    category: existence
    check: "every resource named in the path exists, validated left to right"
    error_id: "ERR_BUILDING_NOT_FOUND | ERR_SPACE_NOT_FOUND | ERR_ASSET_NOT_FOUND | ERR_PM_PLAN_NOT_FOUND | ERR_VENDOR_NOT_FOUND | ERR_WORK_ORDER_NOT_FOUND | ERR_DISPATCH_NOT_FOUND | ERR_SHIFT_NOT_FOUND | ERR_LEASE_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_STATEMENT_NOT_FOUND | ERR_PROJECT_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path parameters

  - priority: 35
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row (building_id, asset_id, pm_plan_id, funding_project_id, vendor_id, space_id, zone_space_id)"
    error_id: "ERR_BUILDING_NOT_FOUND | ERR_ASSET_NOT_FOUND | ERR_PM_PLAN_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_VENDOR_NOT_FOUND | ERR_SPACE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /fm/assets, POST /fm/pm-plans, POST /fm/work-orders, POST /fm/work-orders/{id}/dispatches, POST /fm/soft-service-shifts, POST /fm/utility-readings, POST /fm/leases, POST /fm/leases/{id}/allocations, POST /fm/capital-projects"

  - priority: 40
    category: auth
    check: "entity-backed ownership: a VendorTech may only act on a Dispatch/SoftServiceShift whose vendor_id equals X-User-ID; a TenantRep may only act on a ChargebackStatement whose lease_id equals X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /fm/dispatches/{id}/accept, POST /fm/dispatches/{id}/decline, POST /fm/dispatches/{id}/complete, POST /fm/soft-service-shifts/{id}/complete, POST /fm/statements/{id}/dispute"

  - priority: 42
    category: business_safety
    check: "segregation of duties: the FinanceController deciding a CapitalProject must not be the user who proposed it (X-User-ID != project.proposed_by_user_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /fm/capital-projects/{id}/approve"

  - priority: 45
    category: state
    check: "optimistic concurrency: expected_work_order_version == work_order.version / expected_lease_version == lease.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /fm/work-orders/{id}/dispatches, POST /fm/leases/{id}/statements"

  - priority: 50
    category: state
    check: "the target resource is in a state from which this transition is declared in §1.2"
    error_id: "ERR_WORK_ORDER_NOT_OPEN | ERR_DISPATCH_NOT_ACTIONABLE | ERR_SHIFT_NOT_SCHEDULED | ERR_STATEMENT_NOT_ACTIONABLE | ERR_LEASE_NOT_DRAFT | ERR_PROJECT_NOT_PROPOSED | ERR_ASSET_NOT_IN_SERVICE"
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 52
    category: state
    check: "referenced parent entities are in a usable state: the Asset named by a WorkOrder is not RETIRED; the CapitalProject named by funding_project_id is APPROVED or IN_FLIGHT; the Lease a statement is created for is ACTIVE"
    error_id: "ERR_ASSET_RETIRED | ERR_PROJECT_NOT_FUNDABLE | ERR_LEASE_NOT_ACTIVE"
    http_status: 409
    applies_to: "POST /fm/work-orders, POST /fm/leases/{id}/statements, POST /fm/statements/{id}/issue"

  - priority: 55
    category: state
    check: "building posture gate: when Building.operating_posture == FROZEN, POST /fm/work-orders is rejected unless (wo_type == CORRECTIVE and priority == P1), and POST /fm/soft-service-shifts is always rejected; when posture == RESTRICTED, POST /fm/work-orders with priority P3 or P4 is rejected"
    error_id: "ERR_BUILDING_FROZEN | ERR_BUILDING_RESTRICTED"
    http_status: 409
    applies_to: "POST /fm/work-orders, POST /fm/soft-service-shifts"

  - priority: 60
    category: business_safety
    check: "vendor eligibility: the dispatched Vendor.status must be ACTIVE or PROBATION (SUSPENDED is rejected)"
    error_id: ERR_VENDOR_SUSPENDED
    http_status: 409
    applies_to: "POST /fm/work-orders/{id}/dispatches"

  - priority: 62
    category: business_safety
    check: "trade competence: on dispatch, vendor.trade == asset.category when the order names an asset; on shift creation, vendor.trade == service_type"
    error_id: ERR_VENDOR_TRADE_MISMATCH
    http_status: 422
    applies_to: "POST /fm/work-orders/{id}/dispatches, POST /fm/soft-service-shifts"

  - priority: 65
    category: business_referential
    check: "cross-aggregate coherence: pm_plan.asset_id == work_order.asset_id; asset.building_id == work_order.building_id; space.building_id == lease.building_id for an allocation; zone_space.building_id == shift.building_id"
    error_id: "ERR_PM_PLAN_ASSET_MISMATCH | ERR_ASSET_BUILDING_MISMATCH | ERR_SPACE_BUILDING_MISMATCH"
    http_status: 422
    applies_to: "POST /fm/work-orders, POST /fm/leases/{id}/allocations, POST /fm/soft-service-shifts"

  - priority: 70
    category: business_temporal
    check: "SoftServiceShift overlap on the VENDOR resource: a new shift whose half-open interval [start_at, end_at) intersects an existing shift of the SAME vendor_id with status IN {SCHEDULED, IN_PROGRESS} is rejected, regardless of building, zone or service_type (one crew cannot be in two places); touching endpoints (new.start_at == existing.end_at) do NOT collide"
    error_id: ERR_SHIFT_OVERLAP
    http_status: 409
    applies_to: "POST /fm/soft-service-shifts"

  - priority: 72
    category: business_temporal
    check: "statement period: period_start and period_end must be the first and last instant of the same calendar month; a second statement for the same lease and period_start is rejected when an existing statement for that period has status IN {ISSUED, DISPUTED, SETTLED} (a DRAFT one is instead VOIDed and superseded)"
    error_id: "ERR_STATEMENT_PERIOD_INVALID | ERR_STATEMENT_PERIOD_DUPLICATE"
    http_status: "422 | 409"
    applies_to: "POST /fm/leases/{id}/statements"

  - priority: 75
    category: business_constraint
    check: "LeaseAllocation aggregate capacity: for every date in the new allocation's closed interval [effective_from, effective_to], the sum of share_pct over ACTIVE allocations on that Space whose closed intervals cover that date, plus the new share_pct, must not exceed 100 — two allocations may coexist on the same space and dates provided the aggregate fits; a touching endpoint (new.effective_from == existing.effective_to) DOES count as covering the same date"
    error_id: ERR_SPACE_SHARE_EXCEEDED
    http_status: 422
    applies_to: "POST /fm/leases/{id}/allocations"

  - priority: 78
    category: business_constraint
    check: "uniqueness: Building.code globally unique; Asset.asset_tag globally unique; Space.space_code unique within its building"
    error_id: "ERR_DUPLICATE_BUILDING_CODE | ERR_DUPLICATE_ASSET_TAG | ERR_DUPLICATE_SPACE_CODE"
    http_status: 409
    applies_to: "POST /fm/buildings, POST /fm/assets, POST /fm/buildings/{id}/spaces"

  - priority: 80
    category: business_fiscal
    check: "capital funding: when a WorkOrder names funding_project_id, the project's remaining_amount must cover the order's newly computed estimated_amount (on create: remaining_amount >= estimated_amount; on dispatch: remaining_amount + previous estimated_amount >= new estimated_amount)"
    error_id: ERR_PROJECT_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /fm/work-orders, POST /fm/work-orders/{id}/dispatches"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Buildings ----
  - method: POST
    path: "/fm/buildings"
    description: "Create a building. operating_posture starts OPEN."
    roles: [PlatformAdmin, FacilityManager]
    code: 201
    input: [name, code, gross_area_sqm, "region?"]
    output: Building
    side_effects: ["operating_posture initialised to OPEN with both counters at 0"]

  - method: GET
    path: "/fm/buildings/{id}"
    description: "Read a building including its derived posture and counters."
    roles: [PlatformAdmin, FacilityManager, FinanceController, SustainabilityAnalyst, VendorTech, TenantRep]
    code: 200
    input: []
    output: Building
    side_effects: []

  - method: GET
    path: "/fm/buildings/{id}/kpi"
    description: "KPI dashboard for a building over an inclusive window. window_start defaults to 1970-01-01T00:00:00Z and window_end to the current logical clock when omitted."
    roles: [PlatformAdmin, FacilityManager, FinanceController, SustainabilityAnalyst]
    code: 200
    input: ["window_start?", "window_end?"]
    output: "{ posture: string, energy_intensity_kwh_per_sqm: number, total_utility_cost: number, open_work_order_count: integer, sla_compliance_pct: number, pm_compliance_pct: number, occupancy_pct: number }"
    side_effects: ["runs calculations.building_kpi_dashboard; no persisted change"]

  - method: POST
    path: "/fm/buildings/{id}/ops-run"
    description: "Advance the building's operational epoch against the current logical clock: promote OVERDUE PMPlans into PREVENTIVE work orders, move shifts into IN_PROGRESS or MISSED, RETIRE dead assets, EXPIRE lapsed leases, CLOSE finished capital projects, then recompute posture."
    roles: [PlatformAdmin, FacilityManager]
    code: 200
    input: []
    output: "{ posture: string, created_work_order_ids: string[], in_progress_shift_ids: string[], missed_shift_ids: string[], retired_asset_ids: string[], expired_lease_ids: string[], closed_project_ids: string[] }"
    side_effects:
      - "calculations.pm_overdue_promotion creates PREVENTIVE WorkOrders (status NEW, priority P2)"
      - "SoftServiceShifts transition to IN_PROGRESS or MISSED; a MISSED shift strikes its vendor and may SUSPEND it, which cancels that vendor's OFFERED dispatches and reverts their orders to NEW"
      - "OUT_OF_SERVICE assets with condition_score < 20 RETIRE, retiring their PMPlans"
      - "ACTIVE leases past end_date EXPIRE, releasing their allocations"
      - "IN_FLIGHT capital projects with committed_amount == 0 and at least one CLOSED funded order CLOSE"
      - "Building.operating_posture recomputed last"

  # ---- Spaces ----
  - method: POST
    path: "/fm/buildings/{id}/spaces"
    description: "Create a space in a building."
    roles: [PlatformAdmin, FacilityManager]
    code: 201
    input: [space_code, floor, area_sqm, space_type, "cost_center?"]
    output: Space
    side_effects: ["allocated_share_pct = 0, free_share_pct = 100, occupancy_status = VACANT"]

  - method: GET
    path: "/fm/buildings/{id}/spaces"
    description: "List the spaces of a building (reverse-reachability for Space.building_id)."
    roles: [PlatformAdmin, FacilityManager, FinanceController, TenantRep]
    code: 200
    input: ["occupancy_status?", "limit?", "offset?"]
    output: Space[]
    side_effects: []

  - method: GET
    path: "/fm/spaces/{id}"
    description: "Read a space, including its live allocated_share_pct / free_share_pct as of the logical clock."
    roles: [PlatformAdmin, FacilityManager, FinanceController, TenantRep]
    code: 200
    input: []
    output: Space
    side_effects: []

  # ---- Assets ----
  - method: POST
    path: "/fm/assets"
    description: "Register an asset in a building."
    roles: [PlatformAdmin, FacilityManager]
    code: 201
    input: [building_id, asset_tag, category, criticality, "runtime_hours?"]
    output: Asset
    side_effects: ["condition_score computed by calculations.asset_condition_score from runtime_hours (failure_count = 0)"]

  - method: GET
    path: "/fm/assets/{id}"
    description: "Read an asset."
    roles: [PlatformAdmin, FacilityManager, FinanceController, VendorTech]
    code: 200
    input: []
    output: Asset
    side_effects: []

  - method: GET
    path: "/fm/buildings/{id}/assets"
    description: "List the assets of a building (reverse-reachability for Asset.building_id)."
    roles: [PlatformAdmin, FacilityManager, FinanceController]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Asset[]
    side_effects: []

  - method: POST
    path: "/fm/assets/{id}/report-failure"
    description: "Report an asset failure: IN_SERVICE -> OUT_OF_SERVICE. Origin of the depth-3 posture cascade."
    roles: [PlatformAdmin, FacilityManager]
    code: 200
    input: []
    output: Asset
    side_effects:
      - "asset.failure_count += 1; condition_score recomputed"
      - "building.oos_critical_asset_count recomputed; a CRITICAL asset drives posture -> FROZEN"
      - "FROZEN posture SUSPENDs every ACTIVE PMPlan of the building's assets and CANCELs every SCHEDULED SoftServiceShift of the building"

  # ---- Preventive maintenance ----
  - method: POST
    path: "/fm/pm-plans"
    description: "Create a preventive-maintenance plan for an asset."
    roles: [PlatformAdmin, FacilityManager]
    code: 201
    input: [asset_id, interval_days, grace_days, next_due_at]
    output: PMPlan
    side_effects: ["compliance_state computed against the logical clock"]

  - method: GET
    path: "/fm/assets/{id}/pm-plans"
    description: "List an asset's PM plans with freshly computed compliance_state (reverse-reachability for PMPlan.asset_id)."
    roles: [PlatformAdmin, FacilityManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PMPlan[]
    side_effects: ["compliance_state recomputed on read"]

  # ---- Vendors ----
  - method: POST
    path: "/fm/vendors"
    description: "Register a vendor with its contracted rate and SLA windows."
    roles: [PlatformAdmin, FacilityManager]
    code: 201
    input: [name, trade, hourly_rate, sla_response_minutes, sla_resolve_minutes]
    output: Vendor
    side_effects: ["status ACTIVE, strike_count 0, performance_score and lifetime_performance_score 100.00"]

  - method: GET
    path: "/fm/vendors/{id}"
    description: "Read a vendor, including both variants of the performance score."
    roles: [PlatformAdmin, FacilityManager, FinanceController, VendorTech]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  # ---- Work orders ----
  - method: POST
    path: "/fm/work-orders"
    description: "Raise a work order. Gated by the building's posture."
    roles: [PlatformAdmin, FacilityManager]
    code: 201
    input: [building_id, wo_type, priority, estimated_labor_hours, estimated_parts_cost, "asset_id?", "pm_plan_id?", "funding_project_id?", "chargeable?"]
    output: WorkOrder
    side_effects:
      - "estimated_amount computed by work_order_billable_amount.provisional_estimate using STANDARD_LABOR_RATE"
      - "when funding_project_id is set: project.committed_amount += estimated_amount, remaining_amount recomputed, and an APPROVED project transitions to IN_FLIGHT"
      - "building.open_p1_work_order_count recomputed -> posture recomputed"

  - method: GET
    path: "/fm/work-orders/{id}"
    description: "Read a work order (both status dimensions, both cost variants, SLA state, version for OCC)."
    roles: [PlatformAdmin, FacilityManager, FinanceController, VendorTech]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: GET
    path: "/fm/work-orders"
    description: "Filtered list of work orders (reverse-reachability for building_id, asset_id, pm_plan_id, funding_project_id and statement_id)."
    roles: [PlatformAdmin, FacilityManager, FinanceController]
    code: 200
    input: ["building_id?", "asset_id?", "pm_plan_id?", "funding_project_id?", "statement_id?", "status?", "billing_status?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []

  - method: POST
    path: "/fm/work-orders/{id}/dispatches"
    description: "Dispatch a work order to a vendor. OCC-guarded: a stale expected_work_order_version is rejected with 412, because the create legitimately supersedes any still-OFFERED dispatch."
    roles: [PlatformAdmin, FacilityManager]
    code: 201
    input: [vendor_id, expected_work_order_version]
    output: Dispatch
    side_effects:
      - "any OFFERED dispatch of this order is CANCELLED (supersede)"
      - "work_order.status NEW -> DISPATCHED; dispatched_at and both SLA due timestamps stamped"
      - "work_order.estimated_amount recomputed with vendor.hourly_rate; funding project's committed_amount adjusted by the delta"
      - "increments WorkOrder.version by 1"

  - method: POST
    path: "/fm/work-orders/{id}/qa"
    description: "Quality-assure a completed order. outcome PASS closes it; outcome FAIL sends it back to IN_PROGRESS and re-opens the dispatch (rework cycle)."
    roles: [PlatformAdmin, FacilityManager]
    code: 200
    input: [outcome]
    output: WorkOrder
    side_effects:
      - "PASS: closed_at stamped; billing_status -> WAIVED when chargeable == false; CORRECTIVE order restores its OUT_OF_SERVICE asset to IN_SERVICE; PREVENTIVE order resets asset runtime/failure counters and advances pm_plan.next_due_at; funding project's committed_amount released and spent_amount charged; posture recomputed (may leave FROZEN, reactivating SUSPENDED PMPlans)"
      - "FAIL: failed_qa_count += 1; the COMPLETED dispatch returns to ACCEPTED; billable_amount cleared; vendor scores recomputed"

  - method: POST
    path: "/fm/work-orders/{id}/cancel"
    description: "Cancel a NEW or DISPATCHED work order. Compensating action for the capital-funding invariant."
    roles: [PlatformAdmin, FacilityManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects:
      - "any OFFERED/ACCEPTED dispatch of this order is CANCELLED"
      - "funding project's committed_amount -= estimated_amount; spent_amount untouched; remaining_amount restored to its pre-create value"
      - "building.open_p1_work_order_count recomputed -> posture recomputed"

  # ---- Dispatches ----
  - method: GET
    path: "/fm/dispatches/{id}"
    description: "Read a dispatch, including SLA outcome flags and penalty_pct."
    roles: [PlatformAdmin, FacilityManager, FinanceController, VendorTech]
    code: 200
    input: []
    output: Dispatch
    side_effects: []

  - method: GET
    path: "/fm/dispatches"
    description: "Filtered list of dispatches (reverse-reachability for Dispatch.work_order_id and Dispatch.vendor_id)."
    roles: [PlatformAdmin, FacilityManager, FinanceController, VendorTech]
    code: 200
    input: ["work_order_id?", "vendor_id?", "status?", "limit?", "offset?"]
    output: Dispatch[]
    side_effects: []

  - method: POST
    path: "/fm/dispatches/{id}/accept"
    description: "Vendor accepts an OFFERED dispatch. sla_response_met is evaluated at the inclusive deadline."
    roles: [VendorTech]
    code: 200
    input: []
    output: Dispatch
    side_effects: ["dispatch -> ACCEPTED, accepted_at / response_minutes / sla_response_met set", "work_order -> IN_PROGRESS; sla_state -> RESPONSE_BREACHED on a miss"]

  - method: POST
    path: "/fm/dispatches/{id}/decline"
    description: "Vendor declines an OFFERED dispatch; the order returns to NEW and its estimate reverts to the STANDARD_LABOR_RATE basis."
    roles: [VendorTech]
    code: 200
    input: ["reason?"]
    output: Dispatch
    side_effects: ["dispatch -> DECLINED", "work_order -> NEW; dispatched_at and SLA due timestamps cleared; estimated_amount recomputed with STANDARD_LABOR_RATE; funding project's committed_amount adjusted by the delta"]

  - method: POST
    path: "/fm/dispatches/{id}/complete"
    description: "Vendor completes an ACCEPTED dispatch with its actuals. Origin of the depth-4 vendor cascade."
    roles: [VendorTech]
    code: 200
    input: [actual_labor_hours, actual_parts_cost]
    output: Dispatch
    side_effects:
      - "dispatch -> COMPLETED; completed_at, resolve_minutes, sla_resolve_met, penalty_pct set"
      - "work_order -> PENDING_QA; actuals copied; billable_amount computed by work_order_billable_amount.final_settlement"
      - "L2: an SLA miss on either leg strikes the vendor (strike_count += 1); completed_dispatch_count += 1; both performance score variants recomputed"
      - "L3: strike_count == 2 -> vendor PROBATION; strike_count >= 3 -> vendor SUSPENDED"
      - "L4: a SUSPENDED vendor's OFFERED dispatches are CANCELLED and their work orders revert DISPATCHED -> NEW"

  # ---- Soft services ----
  - method: POST
    path: "/fm/soft-service-shifts"
    description: "Schedule a janitorial/security shift on a zone. Half-open [start_at, end_at) overlap semantics on the VENDOR: the same vendor may not hold two intersecting shifts, but touching shifts (end == start) are fine."
    roles: [PlatformAdmin, FacilityManager]
    code: 201
    input: [building_id, vendor_id, zone_space_id, service_type, start_at, end_at, planned_headcount]
    output: SoftServiceShift
    side_effects: ["status SCHEDULED"]

  - method: GET
    path: "/fm/soft-service-shifts/{id}"
    description: "Read a shift."
    roles: [PlatformAdmin, FacilityManager, VendorTech]
    code: 200
    input: []
    output: SoftServiceShift
    side_effects: []

  - method: GET
    path: "/fm/soft-service-shifts"
    description: "Filtered list of shifts (reverse-reachability for building_id, vendor_id and zone_space_id)."
    roles: [PlatformAdmin, FacilityManager, VendorTech]
    code: 200
    input: ["building_id?", "vendor_id?", "zone_space_id?", "status?", "limit?", "offset?"]
    output: SoftServiceShift[]
    side_effects: []

  - method: POST
    path: "/fm/soft-service-shifts/{id}/complete"
    description: "Vendor reports the shift as delivered."
    roles: [VendorTech]
    code: 200
    input: [actual_headcount]
    output: SoftServiceShift
    side_effects: ["status -> COMPLETED; actual_headcount recorded"]

  # ---- Energy / sustainability ----
  - method: POST
    path: "/fm/utility-readings"
    description: "Append an immutable utility meter reading for a building."
    roles: [PlatformAdmin, FacilityManager, SustainabilityAnalyst]
    code: 201
    input: [building_id, meter_type, period_start, period_end, consumption_kwh, cost]
    output: UtilityReading
    side_effects: ["reading becomes eligible for statement utility_share and for the KPI energy figures"]

  - method: GET
    path: "/fm/buildings/{id}/utility-readings"
    description: "List a building's readings (reverse-reachability for UtilityReading.building_id)."
    roles: [PlatformAdmin, FacilityManager, FinanceController, SustainabilityAnalyst]
    code: 200
    input: ["meter_type?", "limit?", "offset?"]
    output: UtilityReading[]
    side_effects: []

  # ---- Leases / occupancy ----
  - method: POST
    path: "/fm/leases"
    description: "Create a lease in DRAFT."
    roles: [PlatformAdmin, FacilityManager, FinanceController]
    code: 201
    input: [building_id, tenant_name, base_rate_per_sqm_month, start_date, end_date]
    output: Lease
    side_effects: ["status DRAFT; allocated_area_sqm 0"]

  - method: GET
    path: "/fm/leases/{id}"
    description: "Read a lease (version is the OCC handle for statement creation)."
    roles: [PlatformAdmin, FacilityManager, FinanceController, TenantRep]
    code: 200
    input: []
    output: Lease
    side_effects: []

  - method: GET
    path: "/fm/buildings/{id}/leases"
    description: "List a building's leases (reverse-reachability for Lease.building_id)."
    roles: [PlatformAdmin, FacilityManager, FinanceController]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Lease[]
    side_effects: []

  - method: POST
    path: "/fm/leases/{id}/activate"
    description: "Activate a DRAFT lease that already holds at least one ACTIVE allocation."
    roles: [PlatformAdmin, FinanceController]
    code: 200
    input: []
    output: Lease
    side_effects: ["status DRAFT -> ACTIVE", "increments Lease.version by 1"]

  - method: POST
    path: "/fm/leases/{id}/allocations"
    description: "Allocate a share of a space to a lease over a fully-closed [effective_from, effective_to] date interval. Forward action of the occupancy-share invariant."
    roles: [PlatformAdmin, FacilityManager, FinanceController]
    code: 201
    input: [space_id, share_pct, effective_from, effective_to]
    output: LeaseAllocation
    side_effects:
      - "space.allocated_share_pct, free_share_pct and occupancy_status recomputed by calculations.space_share_conservation"
      - "lease.allocated_area_sqm recomputed"

  - method: GET
    path: "/fm/lease-allocations/{id}"
    description: "Read one allocation."
    roles: [PlatformAdmin, FacilityManager, FinanceController, TenantRep]
    code: 200
    input: []
    output: LeaseAllocation
    side_effects: []

  - method: GET
    path: "/fm/lease-allocations"
    description: "Filtered list of allocations (reverse-reachability for LeaseAllocation.lease_id and LeaseAllocation.space_id). RELEASED rows are excluded unless status=RELEASED is passed."
    roles: [PlatformAdmin, FacilityManager, FinanceController, TenantRep]
    code: 200
    input: ["lease_id?", "space_id?", "status?", "limit?", "offset?"]
    output: LeaseAllocation[]
    side_effects: []

  - method: DELETE
    path: "/fm/lease-allocations/{id}"
    description: "Release an allocation (soft: the row is retained with status RELEASED). Compensating action of the occupancy-share invariant."
    roles: [PlatformAdmin, FacilityManager, FinanceController]
    code: 200
    input: []
    output: LeaseAllocation
    side_effects:
      - "allocation.status ACTIVE -> RELEASED"
      - "space.allocated_share_pct / free_share_pct / occupancy_status and lease.allocated_area_sqm recomputed — free_share_pct returns exactly to its pre-allocation value"

  # ---- Chargeback ----
  - method: POST
    path: "/fm/leases/{id}/statements"
    description: "Draft a monthly chargeback statement. OCC-guarded on the lease: a stale expected_lease_version is rejected with 412, because the create legitimately VOIDs and supersedes an existing DRAFT statement for the same period."
    roles: [PlatformAdmin, FinanceController]
    code: 201
    input: [period_start, period_end, expected_lease_version]
    output: ChargebackStatement
    side_effects:
      - "an existing DRAFT statement for the same period_start is VOIDed and its INVOICED work orders revert to PENDING with statement_id cleared"
      - "base_rent, utility_share, om_share and total_amount computed by calculations.chargeback_statement_total"
      - "each collected WorkOrder's billing_status PENDING -> INVOICED with statement_id set"
      - "increments Lease.version by 1"

  - method: GET
    path: "/fm/statements/{id}"
    description: "Read a statement."
    roles: [PlatformAdmin, FacilityManager, FinanceController, TenantRep]
    code: 200
    input: []
    output: ChargebackStatement
    side_effects: []

  - method: GET
    path: "/fm/leases/{id}/statements"
    description: "List a lease's statements (reverse-reachability for ChargebackStatement.lease_id)."
    roles: [PlatformAdmin, FacilityManager, FinanceController, TenantRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ChargebackStatement[]
    side_effects: []

  - method: POST
    path: "/fm/statements/{id}/issue"
    description: "Issue a DRAFT statement, or re-issue a DISPUTED one (which recomputes every line from current data)."
    roles: [PlatformAdmin, FinanceController]
    code: 200
    input: []
    output: ChargebackStatement
    side_effects: ["status -> ISSUED, issued_at stamped", "on re-issue from DISPUTED: all four money fields recomputed by calculations.chargeback_statement_total"]

  - method: POST
    path: "/fm/statements/{id}/dispute"
    description: "Tenant disputes an ISSUED statement."
    roles: [TenantRep]
    code: 200
    input: [dispute_reason]
    output: ChargebackStatement
    side_effects: ["status ISSUED -> DISPUTED; dispute_reason recorded"]

  - method: POST
    path: "/fm/statements/{id}/settle"
    description: "Settle an ISSUED statement."
    roles: [PlatformAdmin, FinanceController]
    code: 200
    input: []
    output: ChargebackStatement
    side_effects: ["status -> SETTLED, settled_at stamped", "every WorkOrder carrying this statement_id moves billing_status INVOICED -> SETTLED_CHARGEBACK"]

  # ---- Capital projects ----
  - method: POST
    path: "/fm/capital-projects"
    description: "Propose a capital project. The contingency tier is keyed on base_cost, then the budget is derived."
    roles: [PlatformAdmin, FacilityManager, FinanceController]
    code: 201
    input: [building_id, title, base_cost]
    output: CapitalProject
    side_effects: ["contingency_pct / contingency_amount / budget_amount / remaining_amount computed by calculations.capital_project_budget", "proposed_by_user_id = X-User-ID"]

  - method: GET
    path: "/fm/capital-projects/{id}"
    description: "Read a capital project and its funding ledger."
    roles: [PlatformAdmin, FacilityManager, FinanceController]
    code: 200
    input: []
    output: CapitalProject
    side_effects: []

  - method: GET
    path: "/fm/buildings/{id}/capital-projects"
    description: "List a building's capital projects (reverse-reachability for CapitalProject.building_id)."
    roles: [PlatformAdmin, FacilityManager, FinanceController]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CapitalProject[]
    side_effects: []

  - method: POST
    path: "/fm/capital-projects/{id}/approve"
    description: "Decide a PROPOSED project. Segregation of duties: the decider must not be the proposer."
    roles: [FinanceController]
    code: 200
    input: [decision]
    output: CapitalProject
    side_effects: ["decision APPROVE -> status APPROVED; decision REJECT -> status REJECTED", "approved_by_user_id = X-User-ID"]

  # ---- Test-driving surface ----
  - method: POST
    path: "/fm/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-05-01T00:00:00Z (the fixed startup default); it never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["every subsequent timestamp stamp, SLA evaluation, PM compliance state and allocation-coverage computation reads this clock"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the six declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the caller's role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a VendorTech acts on a Dispatch/SoftServiceShift whose vendor_id != X-User-ID, or a TenantRep acts on a ChargebackStatement whose lease_id != X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the FinanceController deciding a CapitalProject is the same user who proposed it"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, illegal enum value, or a violated numeric/range constraint"
  - id: ERR_BUILDING_NOT_FOUND
    http: 404
    condition: "building_id in path or body does not resolve"
  - id: ERR_SPACE_NOT_FOUND
    http: 404
    condition: "space_id or zone_space_id does not resolve"
  - id: ERR_ASSET_NOT_FOUND
    http: 404
    condition: "asset_id does not resolve"
  - id: ERR_PM_PLAN_NOT_FOUND
    http: 404
    condition: "pm_plan_id does not resolve"
  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "vendor_id does not resolve"
  - id: ERR_WORK_ORDER_NOT_FOUND
    http: 404
    condition: "work_order_id does not resolve"
  - id: ERR_DISPATCH_NOT_FOUND
    http: 404
    condition: "dispatch_id does not resolve"
  - id: ERR_SHIFT_NOT_FOUND
    http: 404
    condition: "shift_id does not resolve"
  - id: ERR_LEASE_NOT_FOUND
    http: 404
    condition: "lease_id does not resolve"
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "allocation_id does not resolve"
  - id: ERR_STATEMENT_NOT_FOUND
    http: 404
    condition: "statement_id does not resolve"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "project_id in path or funding_project_id in body does not resolve"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_work_order_version != work_order.version on dispatch creation, or expected_lease_version != lease.version on statement creation"
  - id: ERR_WORK_ORDER_NOT_OPEN
    http: 409
    condition: "dispatch/qa/cancel attempted from a WorkOrder status that does not declare the transition (e.g. dispatching a CLOSED order, cancelling an IN_PROGRESS order, QA on a NEW order)"
  - id: ERR_DISPATCH_NOT_ACTIONABLE
    http: 409
    condition: "accept/decline on a Dispatch not in OFFERED, or complete on a Dispatch not in ACCEPTED"
  - id: ERR_SHIFT_NOT_SCHEDULED
    http: 409
    condition: "complete on a SoftServiceShift whose status is not SCHEDULED or IN_PROGRESS"
  - id: ERR_STATEMENT_NOT_ACTIONABLE
    http: 409
    condition: "issue on a statement not in {DRAFT, DISPUTED}, dispute on a statement not in ISSUED, or settle on a statement not in ISSUED"
  - id: ERR_LEASE_NOT_DRAFT
    http: 409
    condition: "activate on a Lease whose status is not DRAFT, or activate on a DRAFT lease that holds no ACTIVE allocation"
  - id: ERR_LEASE_NOT_ACTIVE
    http: 409
    condition: "statement creation or issue while the lease is not ACTIVE"
  - id: ERR_PROJECT_NOT_PROPOSED
    http: 409
    condition: "approve on a CapitalProject whose status is not PROPOSED"
  - id: ERR_PROJECT_NOT_FUNDABLE
    http: 409
    condition: "a WorkOrder names a funding_project_id whose project status is not APPROVED or IN_FLIGHT"
  - id: ERR_ASSET_NOT_IN_SERVICE
    http: 409
    condition: "report-failure on an Asset whose status is not IN_SERVICE"
  - id: ERR_ASSET_RETIRED
    http: 409
    condition: "a WorkOrder names an Asset whose status is RETIRED"
  - id: ERR_BUILDING_FROZEN
    http: 409
    condition: "a WorkOrder that is not (CORRECTIVE and P1) is raised, or any SoftServiceShift is scheduled, in a building whose operating_posture is FROZEN"
  - id: ERR_BUILDING_RESTRICTED
    http: 409
    condition: "a P3 or P4 WorkOrder is raised in a building whose operating_posture is RESTRICTED"
  - id: ERR_VENDOR_SUSPENDED
    http: 409
    condition: "a Dispatch is created for a Vendor whose status is SUSPENDED"
  - id: ERR_VENDOR_TRADE_MISMATCH
    http: 422
    condition: "vendor.trade != asset.category on dispatch, or vendor.trade != service_type on shift creation"
  - id: ERR_PM_PLAN_ASSET_MISMATCH
    http: 422
    condition: "a WorkOrder's pm_plan_id belongs to a different asset than its asset_id"
  - id: ERR_ASSET_BUILDING_MISMATCH
    http: 422
    condition: "a WorkOrder's asset_id belongs to a different building than its building_id"
  - id: ERR_SPACE_BUILDING_MISMATCH
    http: 422
    condition: "an allocation's space, or a shift's zone_space, belongs to a different building than the lease/shift"
  - id: ERR_SHIFT_OVERLAP
    http: 409
    condition: "the new shift's half-open [start_at, end_at) interval intersects an existing SCHEDULED/IN_PROGRESS shift of the same vendor_id"
  - id: ERR_STATEMENT_PERIOD_INVALID
    http: 422
    condition: "period_start / period_end are not the first and last instant of one and the same calendar month"
  - id: ERR_STATEMENT_PERIOD_DUPLICATE
    http: 409
    condition: "a statement for the same lease and period_start already exists with status in {ISSUED, DISPUTED, SETTLED}"
  - id: ERR_SPACE_SHARE_EXCEEDED
    http: 422
    condition: "the aggregate ACTIVE share_pct on a space for some date in the requested closed interval would exceed 100"
  - id: ERR_DUPLICATE_BUILDING_CODE
    http: 409
    condition: "Building.code already exists"
  - id: ERR_DUPLICATE_ASSET_TAG
    http: 409
    condition: "Asset.asset_tag already exists"
  - id: ERR_DUPLICATE_SPACE_CODE
    http: 409
    condition: "Space.space_code already exists within the building"
  - id: ERR_PROJECT_BUDGET_EXCEEDED
    http: 402
    condition: "the capital project's remaining_amount cannot cover the work order's newly computed estimated_amount"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator superset: may perform every business operation plus the logical-clock control."
    identity: opaque
    exclusive_operations:
      - "POST /fm/_clock/set_current_utc"
    shared_operations:
      - "every other endpoint except the VendorTech-exclusive and TenantRep-exclusive actions"

  - name: FacilityManager
    description: "Runs the building: assets, spaces, PM plans, work orders, dispatch, QA, soft-service scheduling, ops-run."
    identity: opaque
    exclusive_operations:
      - "POST /fm/assets/{id}/report-failure (shared with PlatformAdmin)"
      - "POST /fm/work-orders/{id}/qa"
      - "POST /fm/work-orders/{id}/dispatches"
      - "POST /fm/soft-service-shifts"
    shared_operations:
      - "POST /fm/buildings, POST /fm/buildings/{id}/spaces, POST /fm/assets, POST /fm/pm-plans, POST /fm/vendors"
      - "POST /fm/work-orders, POST /fm/work-orders/{id}/cancel, POST /fm/buildings/{id}/ops-run"
      - "POST /fm/utility-readings, POST /fm/leases, POST /fm/leases/{id}/allocations, DELETE /fm/lease-allocations/{id}, POST /fm/capital-projects"
      - "all GET endpoints except none"

  - name: VendorTech
    description: "Acts for one Vendor: accepts, declines and completes its own dispatches and completes its own soft-service shifts."
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /fm/dispatches/{id}/accept"
      - "POST /fm/dispatches/{id}/decline"
      - "POST /fm/dispatches/{id}/complete"
      - "POST /fm/soft-service-shifts/{id}/complete"
    shared_operations:
      - "GET /fm/dispatches, GET /fm/dispatches/{id}, GET /fm/work-orders/{id}, GET /fm/assets/{id}, GET /fm/vendors/{id}, GET /fm/soft-service-shifts, GET /fm/soft-service-shifts/{id}, GET /fm/buildings/{id}"

  - name: FinanceController
    description: "Owns leases, chargeback statements and capital-project decisions. Segregation of duties applies to project approval."
    identity: opaque
    exclusive_operations:
      - "POST /fm/capital-projects/{id}/approve"
      - "POST /fm/leases/{id}/activate (shared with PlatformAdmin)"
      - "POST /fm/leases/{id}/statements, POST /fm/statements/{id}/issue, POST /fm/statements/{id}/settle (shared with PlatformAdmin)"
    shared_operations:
      - "POST /fm/leases, POST /fm/leases/{id}/allocations, DELETE /fm/lease-allocations/{id}, POST /fm/capital-projects"
      - "GET endpoints on buildings, spaces, assets, work orders, dispatches, leases, allocations, statements, capital projects, utility readings and the KPI dashboard"

  - name: TenantRep
    description: "Acts for one Lease: reads its own statements and disputes them."
    identity: "entity_backed:Lease"
    exclusive_operations:
      - "POST /fm/statements/{id}/dispute"
    shared_operations:
      - "GET /fm/leases/{id}, GET /fm/leases/{id}/statements, GET /fm/statements/{id}, GET /fm/lease-allocations, GET /fm/lease-allocations/{id}, GET /fm/spaces/{id}, GET /fm/buildings/{id}, GET /fm/buildings/{id}/spaces"

  - name: SustainabilityAnalyst
    description: "Feeds utility meter readings and reads the energy/KPI surface."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /fm/utility-readings, GET /fm/buildings/{id}/utility-readings, GET /fm/buildings/{id}/kpi, GET /fm/buildings/{id}"
