  - name: an_employer_liaison_cannot_create_a_participant
    claim_type: exclusive_operation_denied
    grounds:
    - roles.CaseManager.exclusive_operations
    - errors[ERR_UNAUTHORIZED]
    distinguishing_aspect: The 403 must precede body validation and must leave the collection empty, and the liaison's
      own exclusive operation (creating a partnership) must still work from the same session — proving the denial
      is per-operation, not a blanket lockout.
    test_recipe:
      setup:
      - empty database
