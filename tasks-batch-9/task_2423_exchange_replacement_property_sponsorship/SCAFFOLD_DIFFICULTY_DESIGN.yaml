# =====================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_2423_exchange_replacement_property_sponsorship
# 9 rule_ids x 2 instances = 18 instances. Every `grounds:` ref resolves
# into SCAFFOLD.yaml §1.1–§1.7; every literal in `assert:` was computed
# from the declared formula and its constants before being written here.
# =====================================================================
scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: distribution_provisional_accrual_vs_final_cash_diverge
    grounds:
    - calculations.distribution_distributable
    - calculations.distribution_reserve_replenishment
    - entities.Distribution.fields.provisional_amount_cents
    - entities.Distribution.fields.final_amount_cents
    - entities.Distribution.fields.reconciliation_delta_cents
    - state_machines.Distribution.transitions.DECLARED_to_PAID
    distinguishing_aspect: 'The two variants of distribution_distributable read DIFFERENT INPUT SETS for the same period: PROVISIONAL_ACCRUAL annualises MasterLease rent and LoanFacility interest over 92/365, while FINAL_CASH sums only the RENT_RECEIPT and DEBT_SERVICE ledger entries whose occurred_at falls inside [2026-10-01, 2027-01-01); with rent posted on 2026-12-01 and debt service on 2026-12-15 the two figures differ by exactly -125,137 cents.'
    test_recipe:
      setup:
      - Property P1 (Cypress Logistics Center, TX/INDUSTRIAL) purchased and appraised at 1,200,000,000 cents, annual NOI 97,000,000 cents, acquired on 2026-08-20.
      - DstTrust T1 on P1 with total_units 620, reserve_floor_cents 5,000,000, reserve_target_pct 0.0200.
      - Offering O1 (RULE_506B, unit_price 1,000,000 cents, min 15 units, load 9%, closing costs 35,000,000, reserve funding 2.5%, rescission window 5 days) declared EFFECTIVE, so initial_reserve_cents 30,000,000, target_equity_cents 598,901,099 and sponsor_load_cents 53,901,099 are pinned.
      - LoanFacility L1 720,000,000 cents at 425 bps NON_RECOURSE, FUNDED (LTV 60.0000, DSCR 3.1699).
      - MasterLease M1 term 2026-09-01..2033-08-31, base rent 90,000,000/yr, supplemental rent 1,500,000/yr.
      - Investor A (INDIVIDUAL, SELF_CERT_NET_WORTH) and Investor B (LLC, THIRD_PARTY_LETTER), both accreditation VERIFIED and suitability APPROVED against O1 (caps 359,340,659 and 350,000,000 cents).
      - Subscription A 300 units CLOSED 2026-09-15 (closing_sequence_no 1) and Subscription B 300 units CLOSED 2026-11-20 (closing_sequence_no 2); the second close carries equity_raised to 600,000,000 >= 598,901,099, so DstTrust T1 is OPERATING with units_issued 600, operating_balance_cents 1,098,901 and reserve_balance_cents 30,000,000.
      - Rent posted 2026-12-01 (22,500,000 base + 375,000 supplemental) and debt service paid 2026-12-15 (7,650,000), so operating_balance_cents is 16,323,901 when the clock reaches 2027-01-02.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
        as_user_id: admin-1
      - call: POST /properties
        payload:
          name: Cypress Logistics Center
          state_code: TX
          asset_type: INDUSTRIAL
          purchase_price_cents: 1200000000
          appraised_value_cents: 1200000000
          annual_noi_cents: 97000000
          occupancy_rate: 0.95
          contract_close_deadline: '2026-09-30T23:59:59.999Z'
        as: SponsorPrincipal
        as_user_id: sponsor-1
        captures:
          prop_id: $.data.id
      - call: POST /trusts
        payload:
          property_id: ${prop_id}
          trust_name: DST 2423-A Cypress
          total_units: 620
          reserve_floor_cents: 5000000
          reserve_target_pct: 0.02
        as: Trustee
        as_user_id: trustee-1
        captures:
          trust_id: $.data.id
      - call: POST /offerings
        payload:
          trust_id: ${trust_id}
          exemption_rule: RULE_506B
          unit_price_cents: 1000000
          min_units_per_investor: 15
          load_pct: 0.09
          closing_costs_cents: 35000000
          reserve_funding_pct: 0.025
          rescission_window_days: 5
        as: SponsorPrincipal
        as_user_id: sponsor-1
        captures:
          off_id: $.data.id
      - call: POST /loan-facilities
        payload:
          trust_id: ${trust_id}
          lender_name: Gulf Coast Life
          principal_cents: 720000000
          rate_bps: 425
          recourse_type: NON_RECOURSE
          maturity_on: '2033-08-01'
        as: Trustee
        as_user_id: trustee-1
        captures:
          loan_id: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-20T00:00:00Z'
        as: PlatformAdmin
        as_user_id: admin-1
      - call: POST /properties/${prop_id}/acquire
        payload: {}
        as: SponsorPrincipal
        as_user_id: sponsor-1
      - call: POST /offerings/${off_id}/submit-ppm
        payload:
          ppm_document_reference: PPM-2423-r1
        as: SponsorPrincipal
        as_user_id: sponsor-1
      - call: POST /offerings/${off_id}/declare-effective
