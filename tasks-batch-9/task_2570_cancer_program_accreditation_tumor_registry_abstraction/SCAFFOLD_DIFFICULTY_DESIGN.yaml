              as: QaReviewer
              as_user_id: "${abs_q_id}"
              captures: { audit_3_id: $.data.id }
          assert:
            - "the first third-window attempt returns error_id == ERR_AUDITOR_WINDOW_CAPACITY_EXCEEDED with http status 409"
            - "QaAudit.${audit_1_id}.audit_state == VOIDED after the void call"
            - "the retried third-window request returns http status 201 and QaAudit.${audit_3_id}.audit_state == OPEN"
            - "QaAudit.${audit_3_id}.window_start == 2026-07-31 (inclusive touching of the voided window is no longer counted)"
            - "exactly 2 non-VOIDED QaAudit rows exist for auditor ${abs_q_id} after the retry"
            - "Abstractor.${abs_a_id}.lifetime_discrepancy_points == 0 (no audit was scored)"

  - rule_id: compensating_invariant
    instances:
      - name: workload_ledger_conserved_across_assign_unassign_and_entry_reopen_void
        grounds:
          - calculations.workload_conservation
          - calculations.reportable_case_parity
          - state_machines.TumorCase.ASSIGNED_to_IDENTIFIED
          - state_machines.TumorCase.ASSIGNED_to_VOIDED
          - endpoints[POST /cancer-registry/cases/{caseId}/unassign]
          - endpoints[POST /cancer-registry/casefinding-entries/{entryId}/reopen]
        distinguishing_aspect: |
          Two DIFFERENT compensating paths decrement the same ledger and both must land it back at
          zero: an explicit unassign and an indirect entry reopen that voids an already-ASSIGNED
          case; after the pair, assigned_open_case_count is 0, identified_case_count has dropped to
          1, and the reportable_case_parity invariant still equals the surviving REPORTABLE entry.
        test_recipe:
          setup:
            - "One program, one CTR abstractor, one pathology source, and two REPORTABLE entries E1/E2 whose cases W1/W2 are both assigned to that abstractor (assigned_open_case_count == 2, identified_case_count == 2)."
            - "The clock stays at 2026-08-01T00:00:00Z and both cases were diagnosed 2026-06-02, so neither is overdue and the posture stays OPEN."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Marlowe Cancer Program", coc_program_id: "COC-14567", annual_analytic_caseload: 620, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Dana Whitfield", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_a_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-4301", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-06-02", first_contact_date: "2026-06-09", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_1_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-4302", accession_date: "2026-08-04", primary_site_code: "C34.1", histology_code: "8140/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-06-02", first_contact_date: "2026-06-10", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_2_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_1_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_1_id: $.data.created_case_id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_2_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_2_id: $.data.created_case_id }
            - call: "POST /cancer-registry/cases/${case_1_id}/assign"
              payload: { abstractor_id: "${abs_a_id}" }
              as: RegistryManager
            - call: "POST /cancer-registry/cases/${case_2_id}/assign"
              payload: { abstractor_id: "${abs_a_id}" }
              as: RegistryManager
          trigger:
            - call: "GET /cancer-registry/abstractors/${abs_a_id}"
              payload: {}
              as: RegistryManager
            - call: "POST /cancer-registry/cases/${case_1_id}/unassign"
              payload: { unassign_reason: "reassigning to the breast site team" }
              as: RegistryManager
            - call: "POST /cancer-registry/casefinding-entries/${entry_2_id}/reopen"
              payload: { reopen_reason: "pathology report amended; behavior code under re-review" }
              as: RegistryManager
          assert:
            - "the pre-trigger GET shows Abstractor.${abs_a_id}.assigned_open_case_count == 2"
            - "after the unassign, TumorCase.${case_1_id}.case_state == IDENTIFIED with assigned_abstractor_id == null and Abstractor.${abs_a_id}.assigned_open_case_count == 1"
            - "after the reopen, TumorCase.${case_2_id}.case_state == VOIDED and Abstractor.${abs_a_id}.assigned_open_case_count == 0"
            - "CasefindingEntry.${entry_2_id}.reportability_state == PENDING_REVIEW with created_case_id == null, reopen_count == 1 and decision_reason_code == null"
            - "CancerProgram.${prog_id}.identified_case_count == 1 (only case ${case_1_id} survives)"
            - "CancerProgram.${prog_id}.registry_posture == OPEN and open_critical_deficiency_count == 0"

      - name: discrepancy_points_and_rework_cascade_fully_reversed_by_audit_void
        grounds:
          - calculations.discrepancy_points_conservation
          - calculations.abstractor_quality_score
          - state_machines.QaAudit.CLOSED_FAIL_to_VOIDED
          - endpoints[POST /cancer-registry/qa-audits/{auditId}/void]
          - entities.Abstractor.fields.lifetime_discrepancy_points
        distinguishing_aspect: |
          A single void must reverse FOUR different derived artefacts of one CRITICAL_FAIL score at
          once — lifetime_discrepancy_points 5 -> 0, both quality scores 87.5/97.5 -> 100.0/100.0,
          audit_fail_streak 1 -> 0, and the depth-4 rework cascade (abstraction back to APPROVED,
          case back to COMPLETED with completed_on restored to 2026-08-01, workload ledger back to
          0) — with no residual drift in any of them.
        test_recipe:
          setup:
            - "One program, an authoring CTR abstractor (Dana) and a QA reviewer/auditor (Priya)."
            - "Dana's abstraction was APPROVED on 2026-08-01, so case V is COMPLETED with completed_on 2026-08-01 and Dana's assigned_open_case_count is 0."
            - "Priya then opened a ROUTINE_10PCT audit (window 2026-07-25..2026-08-05) and scored 1 critical discrepancy over 40 audited fields, producing weighted_error_score 5, CRITICAL_FAIL, and the rework cascade."
            - "The clock stays at 2026-08-01T00:00:00Z throughout so no rolling window boundary moves."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Ashfield Cancer Program", coc_program_id: "COC-14568", annual_analytic_caseload: 620, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Dana Whitfield", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_a_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Priya Raman", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_q_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-4401", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-03-02", first_contact_date: "2026-03-09", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_v_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_v_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_v_id: $.data.created_case_id }
            - call: "POST /cancer-registry/cases/${case_v_id}/assign"
              payload: { abstractor_id: "${abs_a_id}" }
              as: RegistryManager
              captures: { case_v_v: $.data.version }
            - call: "POST /cancer-registry/abstractions"
              payload: { case_id: "${case_v_id}", abstractor_id: "${abs_a_id}", expected_case_version: "${case_v_v}", stage_source: "PATHOLOGIC", t_category: "T2", n_category: "N0", m_category: "M0", stage_group: "STAGE_II", first_treatment_date: "2026-03-20", treatment_modalities: ["SURGERY"], diagnostic_confirmation_code: "POSITIVE_HISTOLOGY", outcome_status: "ALIVE_NO_EVIDENCE", last_contact_date: "2026-07-01" }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { abst_v_id: $.data.id }
            - call: "POST /cancer-registry/abstractions/${abst_v_id}/submit-qa"
              payload: {}
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
            - call: "POST /cancer-registry/abstractions/${abst_v_id}/qa-decision"
              payload: { verdict: "APPROVED" }
              as: QaReviewer
              as_user_id: "${abs_q_id}"
            - call: "POST /cancer-registry/qa-audits"
              payload: { abstraction_id: "${abst_v_id}", auditor_id: "${abs_q_id}", audit_type: "ROUTINE_10PCT", window_start: "2026-07-25", window_end: "2026-08-05" }
              as: QaReviewer
              as_user_id: "${abs_q_id}"
              captures: { audit_v_id: $.data.id }
            - call: "POST /cancer-registry/qa-audits/${audit_v_id}/score"
              payload: { audited_field_count: 40, minor_discrepancy_count: 0, major_discrepancy_count: 0, critical_discrepancy_count: 1 }
              as: QaReviewer
              as_user_id: "${abs_q_id}"
          trigger:
            - call: "GET /cancer-registry/abstractors/${abs_a_id}"
              payload: {}
              as: RegistryManager
            - call: "POST /cancer-registry/qa-audits/${audit_v_id}/void"
              payload: { void_reason: "audit was opened against the wrong accession; findings withdrawn" }
              as: RegistryManager
          assert:
            - "the pre-void GET shows Abstractor.${abs_a_id}.lifetime_discrepancy_points == 5, quality_score_rolling_90d == 87.5, quality_score_cumulative == 97.5, audit_fail_streak == 1 and assigned_open_case_count == 1"
            - "the void returns http status 200 and QaAudit.${audit_v_id}.audit_state == VOIDED"
            - "Abstractor.${abs_a_id}.lifetime_discrepancy_points == 0 after the void"
            - "Abstractor.${abs_a_id}.quality_score_rolling_90d == 100.0 and quality_score_cumulative == 100.0"
            - "Abstractor.${abs_a_id}.audit_fail_streak == 0 and employment_status == ACTIVE"
            - "Abstraction.${abst_v_id}.abstraction_state == APPROVED"
            - "TumorCase.${case_v_id}.case_state == COMPLETED with completed_on == 2026-08-01"
            - "Abstractor.${abs_a_id}.assigned_open_case_count == 0"
            - "CancerProgram.${prog_id}.registry_posture == OPEN"
