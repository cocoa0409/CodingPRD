        claim_type: rbac_denial
        grounds:
          - roles[PlatformAdmin]
          - "endpoints:POST /_clock/set_current_utc"
        distinguishing_aspect: "The logical clock is PlatformAdmin-only; QALead receives 403 — time cannot be steered by the role that also files bugs."
        test_recipe:
