            - "CommitteeMember.${mb_r1_id}.current_review_load == 0"
            - "CommitteeMember.${mb_r3_id}.current_review_load == 0"
            - "invariant: the sum of current_review_load over Rui and Nadia is 0, exactly the starting value, and equals the number of ASSIGNED reviews on the abstract (0)"
            - "Abstract.${ab1_id}.status == UNDER_REVIEW"
            - "Abstract.${ab1_id}.submitted_review_count == 1"
            - "Abstract.${ab1_id}.provisional_score == 4.00"
            - "Abstract.${ab1_id}.score_spread == null"

      - name: format_capacity_ledger_is_conserved_across_rescission_and_promotion
        grounds:
          - calculations.format_capacity_waterfall
          - state_machines.Abstract.ACCEPTED_to_SCORED
          - state_machines.Abstract.WAITLISTED_to_ACCEPTED
          - entities.Conference.fields.accepted_oral_count
          - entities.Conference.fields.waitlisted_count
        distinguishing_aspect: |
          A DIFFERENT conserved quantity: accepted_oral_count + waitlisted_count.
          With exactly one oral slot, Ada is ACCEPTED and Ben is WAITLISTED, so the
          sum is 2 with accepted_oral_count 1. Rescinding Ada's decision decrements
          the count to 0 and the very same request promotes Ben back into the freed
          slot, so accepted_oral_count is 1 again and waitlisted_count is 0 - the
          released slot is neither lost nor double-counted, and Ben inherits Ada's
          decided_by_member_id.
