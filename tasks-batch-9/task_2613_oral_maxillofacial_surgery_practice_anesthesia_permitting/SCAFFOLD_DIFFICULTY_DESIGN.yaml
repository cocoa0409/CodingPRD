            - call: "POST /facility-inspections"
              payload: { permit_id: "${perm_id}", scheduled_for: "2026-09-13T09:00:00Z" }
              as: PracticeAdministrator
              captures: { insp2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /facility-inspections/${insp2_id}/result"
              payload: { minor_deficiency_count: 0, major_deficiency_count: 0, critical_deficiency_count: 1 }
              as: PracticeAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T12:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /surgical-cases/${case_id}/pre-anesthesia-evaluations"
              payload: { evaluator_staff_id: "${author_id}", asa_class_recorded: 2, airway_class_recorded: 2, comorbidity_count: 0, expected_case_version: "${case_v}" }
              as: AnesthesiaCoordinator
              as_user_id: "${author_id}"
              captures: { eval_id: $.data.id }
            - call: "POST /pre-anesthesia-evaluations/${eval_id}/sign"
              payload: {}
              as: AnesthesiaCoordinator
              as_user_id: "${author_id}"
            - call: "POST /pre-anesthesia-evaluations/${eval_id}/day-of-verification"
              payload: { intent: "CLEAR", fasting_solids_last_at: "2026-09-14T05:00:00Z", fasting_clears_last_at: "2026-09-14T11:00:00Z", escort_confirmed: true, escort_name: "Ada Escort" }
              as: AnesthesiaCoordinator
              as_user_id: "${verif_id}"
          trigger:
            - call: "POST /surgical-cases/${case_id}/confirm"
              payload: { expected_block_version: "${blk_v}" }
              as: SchedulingCoordinator
            - call: "POST /facility-inspections"
              payload: { permit_id: "${perm_id}", scheduled_for: "2026-09-14T12:15:00Z" }
              as: PracticeAdministrator
              captures: { insp3_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T12:30:00Z" }
