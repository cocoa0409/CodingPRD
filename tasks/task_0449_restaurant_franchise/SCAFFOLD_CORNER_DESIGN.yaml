              as: Franchisor
              captures: { fz_id: $.data.id }
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/territories/${terr_id}/assign"
              payload: { franchisee_id: "${fz_id}" }
              as: Franchisor
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "UA" }
              as: Franchisor
              captures: { unit_a: $.data.id }
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "UB" }
              as: Franchisor
              captures: { unit_b: $.data.id }
            - call: "POST /franchise/vendor-authorizations"
              payload: { unit_id: "${unit_a}", vendor_id: "${vendor_id}", qualifying_purchase_cents: 2000000 }
              as: Franchisor
              captures: { auth_a: $.data.id }
            - call: "POST /franchise/vendor-authorizations"
              payload: { unit_id: "${unit_b}", vendor_id: "${vendor_id}", qualifying_purchase_cents: 500000 }
              as: Franchisor
              captures: { auth_b: $.data.id }
            - call: "POST /franchise/national-accounts"
              payload: { brand_id: "${brand_id}", vendor_id: "${vendor_id}", name: "Q3", rebate_pool_cents: 1000000, min_qualifying_cents: 1000000 }
              as: FinanceClerk
              captures: { na_id: $.data.id }
            - call: "GET /franchise/brands/${brand_id}"
              payload: {}
              as: FinanceClerk
              captures: { brand_v: $.data.version }
          trigger:
            - call: "POST /franchise/national-accounts/${na_id}/distribute"
              payload: { expected_brand_version: "${brand_v}" }
              as: FinanceClerk
          assert:
            - "NationalAccount.${na_id}.status == DISTRIBUTED"
            - "rebate share for VendorAuthorization ${auth_a} == 1000000   # whole pool to the only qualifier"
            - "rebate share for VendorAuthorization ${auth_b} == 0   # excluded, below min_qualifying_cents"

      - name: transfer_fee_floor_applies_for_new_operator
        claim_type: Correct Result
        grounds:
          - calculations.transfer_fee
          - state_machines.FranchiseAgreement.RENEWAL_PENDING_to_TRANSFERRED
          - entities.Franchisee.fields.is_existing_operator
        distinguishing_aspect: |
          With no trailing royalty statements (trailing_basis 0), the percentage component is 0, so the
          FLAT_MIN_CENTS floor 1000000 applies; the buyer being a NEW operator (is_existing_operator=false)
          adds TRAINING_FEE_CENTS 500000 → transfer_fee_cents 1500000.
        test_recipe:
          setup:
            - "Brand; seller franchisee with NO issued royalty statements; EXECUTED agreement term_end 1; brand advanced to period 1; begin-renewal applied (RENEWAL_PENDING); buyer franchisee APPROVED with is_existing_operator=false."
          setup_api_calls:
