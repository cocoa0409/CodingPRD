      - name: preparer_cannot_efile_forbidden_role
        claim_type: rbac_denial
        grounds: ["roles", "validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Segregation of duties: a Preparer attempting POST /tax-returns/{id}/efile (a Taxpayer-exclusive sign operation) is denied with ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["Taxpayer + TaxReturn computed READY; Preparer acts on the same taxpayer's return."]
          setup_api_calls:
