        distinguishing_aspect: "A request without X-User-Role fails priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any role or existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
