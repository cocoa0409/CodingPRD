            - call: "POST /orchestra/concerts"
              payload: { season_id: "${s1}", venue_id: "${v1}", title: "Opening Night", performance_start_utc: "2026-11-05T19:30:00Z", performance_end_utc: "2026-11-05T21:30:00Z", program_minutes: 105 }
              as: ArtisticAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /orchestra/concerts/${c1}/program"
              payload: {}
              as: ArtisticAdmin
            - call: "POST /orchestra/guest-contracts"
              payload: { concert_id: "${c1}", artist_name: "Mira Halvorsen", role_type: "CONDUCTOR", offered_fee_cents: 800000 }
              as: ArtisticAdmin
              captures: { gc1: "$.data.id" }
            - call: "POST /orchestra/guest-contracts/${gc1}/sign"
