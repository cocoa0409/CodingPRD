              captures: { act2: $.data.id }
            - call: "POST /planning/participation-records"
              payload: { activity_id: "${act1}", respondent_ref: "resident-77", demographic_group: "RENTER", census_tract: "06001402100" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { pr1: $.data.id }
          trigger:
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu1}", element_type: "LAND_USE", title: "Land Use Element - second draft", draft_body: "A competing draft.", policy_count: 2 }
              as: PlanningStaff
