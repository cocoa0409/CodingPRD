      - name: guest_capacity_evaluation_order_on_raw_ccc
        grounds:
          - calculations.day_guest_capacity
          - entities.DayPlan.fields.raw_ccc
          - entities.DayPlan.fields.guest_capacity
          - entities.DayPlan.fields.non_season_pool
          - entities.DayPlan.fields.terrain_open_acres
          - entities.Lift.fields.hourly_capacity_pph
        distinguishing_aspect: |
          This is mode (c): a formula whose inputs look mutually dependent - the crowding threshold is a
          function of capacity, and capacity is a function of the crowding factor - so the naive reading
          iterates to a fixed point. The declared step order is normative and single-pass: crowding_density
          is evaluated on raw_ccc (1080 / 40.0 = 27.0 > 25.0 -> factor 0.85 -> guest_capacity 918), never on
          the reduced figure. Re-testing 918 / 40.0 = 22.95 <= 25.0 would revert the factor to 1.00 and
          report guest_capacity 1080, so the single assertion 918-vs-1080 separates the normative single pass
          from the forbidden fixed-point iteration. This is a different mode from the energy-cost instance,
          which fixes a rounding order inside one linear pass rather than an evaluation order between two
          apparently circular steps.
