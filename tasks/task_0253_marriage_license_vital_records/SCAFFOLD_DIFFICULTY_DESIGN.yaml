# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Marriage License & Vital Records — Expert band.
# 9 rules, >=2 instances each, >=18 instances total. Every grounds ref resolves
# into SCAFFOLD.yaml §1.1-§1.7. Every setup_api_calls / trigger call resolves to a
# §1.5 endpoint; every ${var} is bound by an earlier captures: block.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: certified_copy_fee_government_exempt_vs_public
        grounds:
          - calculations.certified_copy_fee_calc
          - entities.CertifiedCopyRequest.fields.requester_kind
          - entities.CertifiedCopyRequest.fields.fee_cents
          - state_machines.CertifiedCopyRequest.PENDING_to_ISSUED
        distinguishing_aspect: |
          Same public (non-confidential) record and identical copies_requested=5 yield
          fee_cents=6300 for a PUBLIC requester but fee_cents=0 for a GOVERNMENT
          requester — the divergence is on the CertifiedCopyRequest domain, distinct
          from the FeeWaiver-domain dual variant below.
        test_recipe:
          setup:
            - "Clock at 2026-01-10T09:00:00Z; two adult applicants; application approved -> ISSUED license."
            - "Clock moved to 2026-01-20T12:00:00Z; officiant return filed and accepted -> a REGISTERED non-confidential MarriageRecord exists."
            - "Two PENDING certified-copy requests on that record: one PUBLIC/5 copies, one GOVERNMENT/5 copies."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-10T09:00:00Z" }
              as: Clerk
            - call: "POST /applicants"
              payload: { full_name: "Ada Stone", date_of_birth: "1990-05-01", prior_marriage_status: "NEVER_MARRIED" }
              as: Clerk
              captures: { appA: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Ben Cole", date_of_birth: "1988-03-14", prior_marriage_status: "NEVER_MARRIED" }
              as: Clerk
              captures: { appB: $.data.id }
            - call: "POST /officiants"
              payload: { full_name: "Rev. Lee", credential_type: "CLERGY", registration_expires_on: "2030-01-01" }
              as: Clerk
              captures: { offc: $.data.id }
            - call: "POST /applications"
              payload: { applicant_a_id: "${appA}", applicant_b_id: "${appB}", ceremony_county: "Kern", is_confidential: false }
              as: Clerk
              captures: { appl: $.data.id }
            - call: "POST /applications/${appl}/submit"
              payload: {}
              as: Clerk
            - call: "POST /applications/${appl}/decide"
              payload: { decision: "APPROVE" }
              as: Clerk
              as_user_id: "clerk-1"
            - call: "GET /applications/${appl}/licenses"
              payload: {}
              as: Clerk
              captures: { lic: "$.data[0].id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-20T12:00:00Z" }
              as: Clerk
            - call: "POST /returns"
              payload: { license_id: "${lic}", officiant_id: "${offc}", ceremony_date: "2026-01-20T12:00:00Z" }
              as: Officiant
              as_user_id: "${offc}"
              captures: { ret: $.data.id }
            - call: "POST /returns/${ret}/accept"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
            - call: "GET /records?return_id=${ret}"
              payload: {}
              as: Clerk
              captures: { rec: "$.data[0].id" }
            - call: "POST /certified-copies"
              payload: { record_id: "${rec}", requester_kind: "PUBLIC", copies_requested: 5 }
              as: Clerk
              captures: { cc_pub: $.data.id }
            - call: "POST /certified-copies"
              payload: { record_id: "${rec}", requester_kind: "GOVERNMENT", copies_requested: 5 }
              as: Clerk
              captures: { cc_gov: $.data.id }
            - call: "GET /records/${rec}"
              payload: {}
              as: Clerk
              captures: { rec_v: $.data.version }
          trigger:
            - call: "POST /certified-copies/${cc_pub}/decide"
              payload: { decision: "ISSUE", expected_record_version: "${rec_v}" }
              as: Clerk
              as_user_id: "clerk-2"
              captures: { pub_fee: $.data.fee_cents }
            - call: "GET /records/${rec}"
              payload: {}
              as: Clerk
              captures: { rec_v2: $.data.version }
            - call: "POST /certified-copies/${cc_gov}/decide"
              payload: { decision: "ISSUE", expected_record_version: "${rec_v2}" }
              as: Clerk
              as_user_id: "clerk-2"
              captures: { gov_fee: $.data.fee_cents }
          assert:
            - "CertifiedCopyRequest.${cc_pub}.fee_cents == 6300"
            - "CertifiedCopyRequest.${cc_gov}.fee_cents == 0"
            - "CertifiedCopyRequest.${cc_pub}.status == ISSUED"
            - "CertifiedCopyRequest.${cc_gov}.status == ISSUED"

      - name: waiver_cap_full_vs_partial_need
        grounds:
          - calculations.waiver_cap_calc
          - entities.FeeWaiver.fields.max_waivable_cents
          - entities.FeeWaiver.fields.declared_monthly_income_cents
          - state_machines.FeeWaiver.REQUESTED_to_GRANTED
        distinguishing_aspect: |
          Same household_size=1 and identical poverty threshold (130000), two GRANTED
          waivers diverge: declared income 50000 (shortfall_ratio 0.6154 >= 0.50) yields
          max_waivable_cents=6000, while income 100000 (ratio 0.2308) yields 3000 — a
          dual variant on the FeeWaiver domain, distinct entity from certified_copy_fee.
        test_recipe:
          setup:
            - "One applicant exists (waiver applicant_id FK)."
            - "Two REQUESTED fee waivers, both household_size=1: one income 50000, one income 100000."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "Cara Vance", date_of_birth: "1992-02-02", prior_marriage_status: "NEVER_MARRIED" }
              as: Clerk
              captures: { wapp: $.data.id }
            - call: "POST /fee-waivers"
              payload: { applicant_id: "${wapp}", declared_monthly_income_cents: 50000, household_size: 1 }
              as: Clerk
              captures: { wv_full: $.data.id }
            - call: "POST /fee-waivers"
              payload: { applicant_id: "${wapp}", declared_monthly_income_cents: 100000, household_size: 1 }
              as: Clerk
              captures: { wv_part: $.data.id }
          trigger:
            - call: "POST /fee-waivers/${wv_full}/decide"
              payload: { decision: "GRANT" }
              as: WaiverOfficer
              as_user_id: "wo-1"
              captures: { full_cap: $.data.max_waivable_cents }
            - call: "POST /fee-waivers/${wv_part}/decide"
              payload: { decision: "GRANT" }
              as: WaiverOfficer
              as_user_id: "wo-1"
              captures: { part_cap: $.data.max_waivable_cents }
          assert:
            - "FeeWaiver.${wv_full}.max_waivable_cents == 6000"
            - "FeeWaiver.${wv_part}.max_waivable_cents == 3000"
            - "FeeWaiver.${wv_full}.status == GRANTED"
            - "FeeWaiver.${wv_part}.status == GRANTED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: certified_copy_fee_tier_surcharge_waiver_mode_a
        grounds:
          - calculations.certified_copy_fee_calc
          - entities.CertifiedCopyRequest.fields.copies_requested
          - entities.CertifiedCopyRequest.fields.fee_waiver_id
          - entities.MarriageRecord.fields.is_confidential
        distinguishing_aspect: |
          Mode (a): >=3 inputs (copies_requested=5, confidential surcharge branch,
          GRANTED waiver remaining cap) combine non-linearly via min/max tiering then a
          conditional flat surcharge then waiver absorption — gross 6300, absorbed 3000,
          fee_cents 3300. This is mode (a) (nested min/max + conditional branches),
          distinct from amendment_fee's mode (b) rounding-order instance.
        test_recipe:
          setup:
            - "A REGISTERED non-confidential record exists; one of its parties has a GRANTED waiver with max_waivable_cents=3000, consumed_cents=0."
            - "A PENDING PUBLIC certified-copy request for 5 copies references that waiver."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-10T09:00:00Z" }
              as: Clerk
            - call: "POST /applicants"
              payload: { full_name: "Dana Reed", date_of_birth: "1991-06-06", prior_marriage_status: "NEVER_MARRIED" }
              as: Clerk
              captures: { pA: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Evan Park", date_of_birth: "1990-07-07", prior_marriage_status: "NEVER_MARRIED" }
              as: Clerk
              captures: { pB: $.data.id }
            - call: "POST /officiants"
              payload: { full_name: "Judge Ortiz", credential_type: "JUDGE", registration_expires_on: "2030-01-01" }
              as: Clerk
              captures: { ofc: $.data.id }
            - call: "POST /applications"
              payload: { applicant_a_id: "${pA}", applicant_b_id: "${pB}", ceremony_county: "Kern", is_confidential: false }
              as: Clerk
              captures: { ap: $.data.id }
            - call: "POST /applications/${ap}/submit"
              payload: {}
              as: Clerk
            - call: "POST /applications/${ap}/decide"
              payload: { decision: "APPROVE" }
              as: Clerk
              as_user_id: "clerk-1"
            - call: "GET /applications/${ap}/licenses"
              payload: {}
              as: Clerk
              captures: { lc: "$.data[0].id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-20T12:00:00Z" }
              as: Clerk
            - call: "POST /returns"
              payload: { license_id: "${lc}", officiant_id: "${ofc}", ceremony_date: "2026-01-20T12:00:00Z" }
              as: Officiant
              as_user_id: "${ofc}"
              captures: { rt: $.data.id }
            - call: "POST /returns/${rt}/accept"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
            - call: "GET /records?return_id=${rt}"
              payload: {}
              as: Clerk
              captures: { rc: "$.data[0].id" }
            - call: "POST /fee-waivers"
              payload: { applicant_id: "${pA}", declared_monthly_income_cents: 100000, household_size: 1 }
              as: Clerk
              captures: { wv: $.data.id }
            - call: "POST /fee-waivers/${wv}/decide"
              payload: { decision: "GRANT" }
              as: WaiverOfficer
              as_user_id: "wo-1"
            - call: "POST /certified-copies"
              payload: { record_id: "${rc}", requester_kind: "PUBLIC", copies_requested: 5, fee_waiver_id: "${wv}" }
              as: Clerk
              captures: { cc: $.data.id }
            - call: "GET /records/${rc}"
              payload: {}
              as: Clerk
              captures: { rcv: $.data.version }
            - call: "GET /fee-waivers/${wv}"
              payload: {}
              as: Clerk
              captures: { wvv: $.data.version }
          trigger:
            - call: "POST /certified-copies/${cc}/decide"
              payload: { decision: "ISSUE", expected_record_version: "${rcv}", expected_waiver_version: "${wvv}" }
              as: Clerk
              as_user_id: "clerk-2"
              captures: { fee: $.data.fee_cents }
          assert:
            - "CertifiedCopyRequest.${cc}.fee_cents == 3300"
            - "FeeWaiver.${wv}.consumed_cents == 3000"
            - "FeeWaiver.${wv}.status == CONSUMED"

      - name: amendment_fee_round_per_component_then_sum_mode_b
        grounds:
          - calculations.amendment_fee_calc
          - entities.AmendmentRequest.fields.resubmit_count
          - entities.AmendmentRequest.fields.amendment_type
          - state_machines.AmendmentRequest.SUBMITTED_to_APPLIED
        distinguishing_aspect: |
          Mode (b): the SUBSTANTIVE amendment applied after one resubmit charges
          base 5000 + round_half_up(5000*0.15)=750 + round_half_up(5000*0.10*1)=500 = 6250,
          where each percentage component is rounded to whole cents BEFORE summing — the
          pinned order. This is mode (b) (rounding-order), distinct from the mode (a)
          certified-copy instance.
        test_recipe:
          setup:
            - "A REGISTERED record exists; a SUBSTANTIVE amendment is SUBMITTED, RETURNED_FOR_INFO, then resubmitted once (resubmit_count=1), back in SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-10T09:00:00Z" }
              as: Clerk
            - call: "POST /applicants"
              payload: { full_name: "Fay Long", date_of_birth: "1989-08-08", prior_marriage_status: "NEVER_MARRIED" }
              as: Clerk
              captures: { qA: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Gus Ray", date_of_birth: "1987-09-09", prior_marriage_status: "NEVER_MARRIED" }
              as: Clerk
              captures: { qB: $.data.id }
            - call: "POST /officiants"
              payload: { full_name: "Rev. Diaz", credential_type: "CLERGY", registration_expires_on: "2030-01-01" }
              as: Clerk
              captures: { qofc: $.data.id }
            - call: "POST /applications"
              payload: { applicant_a_id: "${qA}", applicant_b_id: "${qB}", ceremony_county: "Kern" }
              as: Clerk
              captures: { qap: $.data.id }
            - call: "POST /applications/${qap}/submit"
              payload: {}
              as: Clerk
            - call: "POST /applications/${qap}/decide"
              payload: { decision: "APPROVE" }
              as: Clerk
              as_user_id: "clerk-1"
            - call: "GET /applications/${qap}/licenses"
              payload: {}
              as: Clerk
              captures: { qlc: "$.data[0].id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-20T12:00:00Z" }
              as: Clerk
            - call: "POST /returns"
              payload: { license_id: "${qlc}", officiant_id: "${qofc}", ceremony_date: "2026-01-20T12:00:00Z" }
              as: Officiant
              as_user_id: "${qofc}"
              captures: { qrt: $.data.id }
            - call: "POST /returns/${qrt}/accept"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
            - call: "GET /records?return_id=${qrt}"
              payload: {}
              as: Clerk
              captures: { qrc: "$.data[0].id" }
            - call: "POST /amendments"
              payload: { record_id: "${qrc}", amendment_type: "SUBSTANTIVE", field_path: "spouse_b_name", new_value: "Gustavo Ray" }
              as: Applicant
              as_user_id: "${qA}"
              captures: { am: $.data.id }
            - call: "POST /amendments/${am}/decide"
              payload: { decision: "RETURN" }
              as: Registrar
              as_user_id: "registrar-1"
            - call: "POST /amendments/${am}/resubmit"
              payload: {}
              as: Applicant
              as_user_id: "${qA}"
          trigger:
            - call: "POST /amendments/${am}/decide"
              payload: { decision: "APPLY" }
              as: Registrar
              as_user_id: "registrar-2"
              captures: { am_fee: $.data.id }
            - call: "GET /amendments/${am}"
              payload: {}
              as: Clerk
              captures: { am_rc: $.data.resubmit_count }
          assert:
            - "AmendmentRequest.${am}.resubmit_count == 1"
            - "AmendmentRequest.${am}.status == APPLIED"
            - "FeeLedgerEntry for source_entity=AMENDMENT, source_entity_id=${am} has kind=CHARGE amount_cents=6250"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_branch_approve_vs_deny_divergent_side_effects
        grounds:
          - state_machines.MarriageApplication.UNDER_REVIEW_to_APPROVED
          - state_machines.MarriageApplication.UNDER_REVIEW_to_DENIED
          - entities.MarriageLicense.fields.status
        distinguishing_aspect: |
          The MarriageApplication machine forks UNDER_REVIEW -> {APPROVED, DENIED}:
          APPROVE creates a MarriageLicense and appends a CHARGE; DENY creates no license
          and no ledger row. The branch's two arms have disjoint side-effect sets on the
          MarriageApplication entity, distinct from the AmendmentRequest cycle below.
        test_recipe:
          setup:
            - "Two UNDER_REVIEW applications with eligible adult applicants."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-10T09:00:00Z" }
              as: Clerk
            - call: "POST /applicants"
              payload: { full_name: "Hal Vega", date_of_birth: "1990-01-01", prior_marriage_status: "NEVER_MARRIED" }
              as: Clerk
              captures: { hA: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Ivy Fox", date_of_birth: "1991-02-02", prior_marriage_status: "NEVER_MARRIED" }
              as: Clerk
              captures: { hB: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Jo Nash", date_of_birth: "1992-03-03", prior_marriage_status: "NEVER_MARRIED" }
              as: Clerk
              captures: { hC: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Kim Hale", date_of_birth: "1993-04-04", prior_marriage_status: "NEVER_MARRIED" }
              as: Clerk
              captures: { hD: $.data.id }
            - call: "POST /applications"
              payload: { applicant_a_id: "${hA}", applicant_b_id: "${hB}", ceremony_county: "Kern" }
              as: Clerk
              captures: { ap_ok: $.data.id }
            - call: "POST /applications/${ap_ok}/submit"
              payload: {}
              as: Clerk
            - call: "POST /applications"
              payload: { applicant_a_id: "${hC}", applicant_b_id: "${hD}", ceremony_county: "Kern" }
              as: Clerk
              captures: { ap_dn: $.data.id }
            - call: "POST /applications/${ap_dn}/submit"
              payload: {}
              as: Clerk
          trigger:
            - call: "POST /applications/${ap_ok}/decide"
              payload: { decision: "APPROVE" }
              as: Clerk
              as_user_id: "clerk-1"
            - call: "POST /applications/${ap_dn}/decide"
              payload: { decision: "DENY", denial_reason_code: "ERR_INVALID_REQUEST" }
              as: Clerk
              as_user_id: "clerk-1"
            - call: "GET /applications/${ap_ok}/licenses"
              payload: {}
              as: Clerk
              captures: { ok_lic_count: "$.data[0].id" }
            - call: "GET /applications/${ap_dn}/licenses"
              payload: {}
              as: Clerk
          assert:
            - "MarriageApplication.${ap_ok}.status == APPROVED"
            - "MarriageApplication.${ap_dn}.status == DENIED"
            - "GET /applications/${ap_ok}/licenses returns exactly 1 MarriageLicense"
            - "GET /applications/${ap_dn}/licenses returns exactly 0 MarriageLicense"
            - "MarriageApplication.${ap_dn}.denial_reason_code == ERR_INVALID_REQUEST"

      - name: amendment_cycle_submitted_returned_resubmit_loop
        grounds:
          - state_machines.AmendmentRequest.SUBMITTED_to_RETURNED_FOR_INFO
          - state_machines.AmendmentRequest.RETURNED_FOR_INFO_to_SUBMITTED
          - entities.AmendmentRequest.fields.resubmit_count
        distinguishing_aspect: |
          The AmendmentRequest machine cycles SUBMITTED -> RETURNED_FOR_INFO -> SUBMITTED,
          incrementing resubmit_count each loop — a true cycle on the AmendmentRequest
          entity, distinct from the MarriageApplication branch above.
        test_recipe:
          setup:
            - "A REGISTERED record with a CLERICAL amendment SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-10T09:00:00Z" }
              as: Clerk
            - call: "POST /applicants"
              payload: { full_name: "Lou Beck", date_of_birth: "1990-05-05", prior_marriage_status: "NEVER_MARRIED" }
              as: Clerk
              captures: { yA: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Mia Dunn", date_of_birth: "1991-06-06", prior_marriage_status: "NEVER_MARRIED" }
              as: Clerk
              captures: { yB: $.data.id }
            - call: "POST /officiants"
              payload: { full_name: "Notary Webb", credential_type: "NOTARY", registration_expires_on: "2030-01-01" }
              as: Clerk
              captures: { yofc: $.data.id }
            - call: "POST /applications"
              payload: { applicant_a_id: "${yA}", applicant_b_id: "${yB}", ceremony_county: "Kern" }
              as: Clerk
              captures: { yap: $.data.id }
            - call: "POST /applications/${yap}/submit"
              payload: {}
              as: Clerk
            - call: "POST /applications/${yap}/decide"
              payload: { decision: "APPROVE" }
              as: Clerk
              as_user_id: "clerk-1"
            - call: "GET /applications/${yap}/licenses"
              payload: {}
              as: Clerk
              captures: { ylc: "$.data[0].id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-20T12:00:00Z" }
              as: Clerk
            - call: "POST /returns"
              payload: { license_id: "${ylc}", officiant_id: "${yofc}", ceremony_date: "2026-01-20T12:00:00Z" }
              as: Officiant
              as_user_id: "${yofc}"
              captures: { yrt: $.data.id }
            - call: "POST /returns/${yrt}/accept"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
            - call: "GET /records?return_id=${yrt}"
              payload: {}
              as: Clerk
              captures: { yrc: "$.data[0].id" }
            - call: "POST /amendments"
              payload: { record_id: "${yrc}", amendment_type: "CLERICAL", field_path: "spouse_a_name", new_value: "Louis Beck" }
              as: Applicant
              as_user_id: "${yA}"
              captures: { yam: $.data.id }
          trigger:
            - call: "POST /amendments/${yam}/decide"
              payload: { decision: "RETURN" }
              as: Registrar
              as_user_id: "registrar-1"
            - call: "POST /amendments/${yam}/resubmit"
              payload: {}
              as: Applicant
              as_user_id: "${yA}"
            - call: "POST /amendments/${yam}/decide"
              payload: { decision: "RETURN" }
              as: Registrar
              as_user_id: "registrar-1"
            - call: "POST /amendments/${yam}/resubmit"
              payload: {}
              as: Applicant
              as_user_id: "${yA}"
              captures: { yam_rc: $.data.resubmit_count }
          assert:
            - "AmendmentRequest.${yam}.resubmit_count == 2"
            - "AmendmentRequest.${yam}.status == SUBMITTED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: return_accept_cascade_return_license_record_depth3
        grounds:
          - state_machines.OfficiantReturn.SUBMITTED_to_ACCEPTED
          - state_machines.MarriageLicense.ISSUED_to_USED
          - state_machines.MarriageRecord.initial_state
          - entities.MarriageRecord.fields.status
        distinguishing_aspect: |
          Accepting a return (depth-3 cascade): the accept mutates OfficiantReturn -> ACCEPTED;
          that ACCEPTED state drives MarriageLicense ISSUED -> USED; the USED transition
          itself creates a MarriageRecord (REGISTERED). Each link is caused by the prior
          link, not by the original accept. Triggering transition is OfficiantReturn accept,
          distinct from the license-expire trigger below.
        test_recipe:
          setup:
            - "An ISSUED license with a SUBMITTED, in-window return whose officiant is REGISTERED."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-10T09:00:00Z" }
              as: Clerk
            - call: "POST /applicants"
              payload: { full_name: "Ned Roe", date_of_birth: "1990-01-01", prior_marriage_status: "NEVER_MARRIED" }
              as: Clerk
              captures: { zA: $.data.id }
            - call: "POST /applicants"
