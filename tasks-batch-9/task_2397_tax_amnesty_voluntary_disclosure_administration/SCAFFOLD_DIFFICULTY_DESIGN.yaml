scaffold_difficulty_design:
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: statutory_vs_negotiated_accrual_cutoff_divergence
        grounds:
          - calculations.return_statutory_liability
          - entities.VoluntaryDisclosureAgreement.fields.liability_variant
          - entities.DisclosureReturn.fields.accrual_end_date
          - state_machines.VoluntaryDisclosureAgreement.DRAFTED_to_EXECUTED
        distinguishing_aspect: |
          Two returns carrying byte-identical inputs (SALES_USE, period 2025-01-01..2025-03-31,
          original_due_date 2025-10-27, reported_tax_cents 1000000) land on different penalty
          TIERS because the AMNESTY_STATUTORY variant accrues to window_close_at (400 days late,
          tier 3 at 0.25) while the VDA_NEGOTIATED variant accrues to executed_at (328 days late,
          tier 2 at 0.15); the divergence is a 100000-cent penalty gap and an 18000-cent interest gap.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; one OPEN program with window 2026-09-01 -> 2026-12-01, lookback_months 36, base waivers 1.00 penalty / 0.50 interest"
            - "One SALES_USE term with eligible window [2020-01-01, 2026-07-01) and min_liability_cents 50000"
            - "Taxpayer Northline holds a walk-in agreement (no pre-clearance) executed at 2026-09-15; taxpayer Cedar Point holds a negotiated agreement (accepted pre-clearance) executed at 2026-09-20"
            - "Each agreement carries one DRAFT return with identical tax type, period, original due date and reported tax"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000, installment_max_count: 12 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /amnesty/programs/${prog_id}/tax-type-terms"
              payload: { tax_type: "SALES_USE", eligible_period_start: "2020-01-01", eligible_period_end: "2026-07-01", min_liability_cents: 50000 }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs/${prog_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /amnesty/taxpayers"
              payload: { legal_name: "Northline Supply LLC", taxpayer_type: "BUSINESS", tin_last4: "4417" }
              as: ProgramAdministrator
              captures: { tp_walk_id: $.data.id }
            - call: "POST /amnesty/taxpayers"
              payload: { legal_name: "Cedar Point Fabrication LLC", taxpayer_type: "BUSINESS", tin_last4: "9082" }
              as: ProgramAdministrator
              captures: { tp_neg_id: $.data.id }
            - call: "POST /amnesty/representatives"
              payload: { firm_name: "Halloran Tax Counsel", bar_number: "BAR-55120" }
              as: ProgramAdministrator
              captures: { rep_id: $.data.id }
            - call: "POST /amnesty/pre-clearances"
              payload: { program_id: "${prog_id}", tax_type: "SALES_USE", anonymous_alias: "CLIENT-77", estimated_liability_cents: 1000000, self_reported_under_audit: false, earliest_unfiled_period_start: "2025-01-01" }
              as: Representative
              as_user_id: "${rep_id}"
              captures: { pc_id: $.data.id }
            - call: "POST /amnesty/pre-clearances/${pc_id}/begin-review"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { pc_v2: $.data.version }
            - call: "POST /amnesty/pre-clearances/${pc_id}/offer-terms"
              payload: { expected_pre_clearance_version: "${pc_v2}", offered_lookback_months: 36, offered_penalty_waiver_pct: 1.00, offered_interest_waiver_pct: 0.50 }
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
            - call: "POST /amnesty/pre-clearances/${pc_id}/disclose-identity"
              payload: { taxpayer_id: "${tp_neg_id}" }
              as: Representative
              as_user_id: "${rep_id}"
            - call: "POST /amnesty/pre-clearances/${pc_id}/accept"
              payload: {}
              as: Representative
              as_user_id: "${rep_id}"
            - call: "POST /amnesty/agreements"
              payload: { program_id: "${prog_id}", taxpayer_id: "${tp_walk_id}", tax_types: ["SALES_USE"], lookback_start_date: "2023-09-01", lookback_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { agr_walk_id: $.data.id }
            - call: "POST /amnesty/agreements/${agr_walk_id}/execute"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-beta"
            - call: "POST /amnesty/agreements"
              payload: { program_id: "${prog_id}", taxpayer_id: "${tp_neg_id}", tax_types: ["SALES_USE"], lookback_start_date: "2023-09-01", lookback_end_date: "2026-06-30", pre_clearance_id: "${pc_id}" }
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { agr_neg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/agreements/${agr_neg_id}/execute"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-beta"
            - call: "POST /amnesty/agreements/${agr_walk_id}/returns"
              payload: { tax_type: "SALES_USE", period_start_date: "2025-01-01", period_end_date: "2025-03-31", original_due_date: "2025-10-27", reported_tax_cents: 1000000 }
              as: Taxpayer
              as_user_id: "${tp_walk_id}"
              captures: { ret_walk_id: $.data.id }
            - call: "POST /amnesty/agreements/${agr_neg_id}/returns"
              payload: { tax_type: "SALES_USE", period_start_date: "2025-01-01", period_end_date: "2025-03-31", original_due_date: "2025-10-27", reported_tax_cents: 1000000 }
              as: Taxpayer
              as_user_id: "${tp_neg_id}"
              captures: { ret_neg_id: $.data.id }
          trigger:
            - call: "POST /amnesty/returns/${ret_walk_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_walk_id}"
            - call: "POST /amnesty/returns/${ret_neg_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_neg_id}"
          assert:
            - "DisclosureReturn.${ret_walk_id}.accrual_end_date == \"2026-12-01\""
            - "DisclosureReturn.${ret_walk_id}.days_late == 400"
            - "DisclosureReturn.${ret_walk_id}.penalty_rate_applied == 0.25"
            - "DisclosureReturn.${ret_walk_id}.gross_penalty_cents == 250000"
            - "DisclosureReturn.${ret_walk_id}.gross_interest_cents == 100000"
            - "DisclosureReturn.${ret_walk_id}.waived_penalty_cents == 250000"
            - "DisclosureReturn.${ret_walk_id}.waived_interest_cents == 50000"
            - "DisclosureReturn.${ret_walk_id}.balance_due_cents == 1050000"
            - "DisclosureReturn.${ret_neg_id}.accrual_end_date == \"2026-09-20\""
            - "DisclosureReturn.${ret_neg_id}.days_late == 328"
            - "DisclosureReturn.${ret_neg_id}.penalty_rate_applied == 0.15"
            - "DisclosureReturn.${ret_neg_id}.gross_penalty_cents == 150000"
            - "DisclosureReturn.${ret_neg_id}.gross_interest_cents == 82000"
            - "DisclosureReturn.${ret_neg_id}.waived_interest_cents == 41000"
            - "DisclosureReturn.${ret_neg_id}.balance_due_cents == 1041000"
            - "VoluntaryDisclosureAgreement.${agr_walk_id}.liability_variant == \"AMNESTY_STATUTORY\""
            - "VoluntaryDisclosureAgreement.${agr_walk_id}.gross_liability_cents == 1350000"
            - "VoluntaryDisclosureAgreement.${agr_walk_id}.waived_amount_cents == 300000"
            - "VoluntaryDisclosureAgreement.${agr_neg_id}.liability_variant == \"VDA_NEGOTIATED\""
            - "VoluntaryDisclosureAgreement.${agr_neg_id}.gross_liability_cents == 1232000"
            - "VoluntaryDisclosureAgreement.${agr_neg_id}.waived_amount_cents == 191000"

      - name: historical_vs_program_adjusted_behavior_score_divergence
        grounds:
          - calculations.taxpayer_compliance_behavior_score
          - entities.Taxpayer.fields.compliance_behavior_score
          - entities.Taxpayer.fields.nonfiler_period_count
          - endpoints[GET /amnesty/taxpayers/{id}/compliance-behavior]
        distinguishing_aspect: |
          The SAME taxpayer facts (one OPEN FIELD_AUDIT on CORPORATE_INCOME plus two disclosed
          nonfiler SALES_USE periods) produce historical_score 70 and program_adjusted_score 98
          in ONE response, because PROGRAM_ADJUSTED forgives the two 5-point nonfiler penalties
          and adds the 18-point participation credit while HISTORICAL does neither; the persisted
          Taxpayer.compliance_behavior_score holds the HISTORICAL value 70.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with one SALES_USE term"
            - "Taxpayer Foxglove has one OPEN FIELD_AUDIT case on CORPORATE_INCOME (outside the agreement scope, so it does not block participation)"
            - "Foxglove holds an EXECUTED SALES_USE agreement with two FILED nonfiler returns inside its lookback window"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /amnesty/programs/${prog_id}/tax-type-terms"
              payload: { tax_type: "SALES_USE", eligible_period_start: "2020-01-01", eligible_period_end: "2026-07-01", min_liability_cents: 50000 }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs/${prog_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /amnesty/taxpayers"
              payload: { legal_name: "Foxglove Interiors Inc", taxpayer_type: "BUSINESS", tin_last4: "2231" }
              as: ProgramAdministrator
              captures: { tp_id: $.data.id }
            - call: "POST /amnesty/enforcement-cases"
              payload: { taxpayer_id: "${tp_id}", case_type: "FIELD_AUDIT", tax_type: "CORPORATE_INCOME", opened_at: "2026-04-10" }
              as: ComplianceAuditor
              as_user_id: "auditor-one"
            - call: "POST /amnesty/agreements"
              payload: { program_id: "${prog_id}", taxpayer_id: "${tp_id}", tax_types: ["SALES_USE"], lookback_start_date: "2023-09-01", lookback_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { agr_id: $.data.id }
            - call: "POST /amnesty/agreements/${agr_id}/execute"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-beta"
            - call: "POST /amnesty/agreements/${agr_id}/returns"
              payload: { tax_type: "SALES_USE", period_start_date: "2025-01-01", period_end_date: "2025-03-31", original_due_date: "2025-10-27", reported_tax_cents: 200000, is_nonfiler_period: true }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_a_id: $.data.id }
            - call: "POST /amnesty/agreements/${agr_id}/returns"
              payload: { tax_type: "SALES_USE", period_start_date: "2025-04-01", period_end_date: "2025-06-30", original_due_date: "2025-10-27", reported_tax_cents: 200000, is_nonfiler_period: true }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_b_id: $.data.id }
            - call: "POST /amnesty/returns/${ret_a_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /amnesty/returns/${ret_b_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
          trigger:
            - call: "GET /amnesty/taxpayers/${tp_id}/compliance-behavior"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "auditor-one"
          assert:
            - "response.data.historical_score == 70"
            - "response.data.program_adjusted_score == 98"
            - "response.data.open_case_count == 1"
            - "response.data.nonfiler_period_count == 2"
            - "response.data.forgiven_nonfiler_period_count == 2"
            - "response.data.nonparticipant_flag == false"
            - "response.data.escalation_tier == \"T0\""
            - "Taxpayer.${tp_id}.compliance_behavior_score == 70"
            - "DisclosureReturn.${ret_a_id}.penalty_rate_applied == 0.30"
            - "DisclosureReturn.${ret_a_id}.gross_penalty_cents == 60000"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: post_program_penalty_nested_cap_beats_escalated_rate
        grounds:
          - calculations.post_program_penalty_assessment
          - calculations.taxpayer_escalation_tier_resolution
          - entities.EnforcementAction.fields.assessed_penalty_cents
          - state_machines.AmnestyProgram.OPEN_to_CLOSED
        distinguishing_aspect: |
          Mode (a) nested min/max: an additive rate (TIER_RATE_T2 0.35 + BEHAVIOR_ADJUSTMENT_RATE
          0.05) is multiplied by the 2.00 non-participant multiplier to a raw 320000 cents, then
          clamped by the 50-percent cap (200000) and finally by the 10000-cent floor, so the
          committed assessed_penalty_cents is 200000 — the cap binds and the raw figure is never
          persisted.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with post_program_penalty_multiplier 2.00 and one SALES_USE term"
            - "Taxpayer Harbor Line has one OPEN COLLECTION case on PERSONAL_INCOME (neither criminal nor an audit of the disclosed tax type, so pre-clearance screening passes)"
            - "Harbor Line's identity was disclosed on a pre-clearance that was never accepted; the program is then CLOSED at 2026-12-01, expiring the request and flagging Harbor Line as a non-participant at escalation_tier T2 with behavior score 55"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /amnesty/programs/${prog_id}/tax-type-terms"
              payload: { tax_type: "SALES_USE", eligible_period_start: "2020-01-01", eligible_period_end: "2026-07-01", min_liability_cents: 50000 }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs/${prog_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /amnesty/taxpayers"
              payload: { legal_name: "Harbor Line Trading Co", taxpayer_type: "BUSINESS", tin_last4: "7714" }
              as: ProgramAdministrator
              captures: { tp_id: $.data.id }
            - call: "POST /amnesty/enforcement-cases"
              payload: { taxpayer_id: "${tp_id}", case_type: "COLLECTION", tax_type: "PERSONAL_INCOME", opened_at: "2026-05-04" }
              as: ComplianceAuditor
              as_user_id: "auditor-one"
            - call: "POST /amnesty/representatives"
              payload: { firm_name: "Halloran Tax Counsel", bar_number: "BAR-55120" }
              as: ProgramAdministrator
              captures: { rep_id: $.data.id }
            - call: "POST /amnesty/pre-clearances"
              payload: { program_id: "${prog_id}", tax_type: "SALES_USE", anonymous_alias: "CLIENT-31", estimated_liability_cents: 800000, self_reported_under_audit: false, earliest_unfiled_period_start: "2024-01-01" }
              as: Representative
              as_user_id: "${rep_id}"
              captures: { pc_id: $.data.id }
            - call: "POST /amnesty/pre-clearances/${pc_id}/begin-review"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { pc_v2: $.data.version }
            - call: "POST /amnesty/pre-clearances/${pc_id}/offer-terms"
              payload: { expected_pre_clearance_version: "${pc_v2}", offered_lookback_months: 24, offered_penalty_waiver_pct: 1.00, offered_interest_waiver_pct: 0.50 }
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
            - call: "POST /amnesty/pre-clearances/${pc_id}/disclose-identity"
              payload: { taxpayer_id: "${tp_id}" }
              as: Representative
              as_user_id: "${rep_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs/${prog_id}/close"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "POST /amnesty/enforcement-actions"
              payload: { taxpayer_id: "${tp_id}", program_id: "${prog_id}", action_type: "ASSESSMENT", base_tax_cents: 400000 }
              as: ComplianceAuditor
              as_user_id: "auditor-one"
              captures: { act_id: $.data.id }
          assert:
            - "Taxpayer.${tp_id}.nonparticipant_flag == true"
            - "Taxpayer.${tp_id}.escalation_tier == \"T2\""
            - "Taxpayer.${tp_id}.compliance_behavior_score == 55"
            - "EnforcementAction.${act_id}.escalation_tier_applied == \"T2\""
            - "EnforcementAction.${act_id}.multiplier_applied == 2.00"
            - "EnforcementAction.${act_id}.behavior_adjustment_applied == 0.05"
            - "EnforcementAction.${act_id}.assessed_penalty_cents == 200000"
            - "EnforcementAction.${act_id}.status == \"DRAFT\""
            - "EnforcementAction.${act_id}.origin == \"MANUAL\""
            - "PreClearanceRequest.${pc_id}.status == \"EXPIRED\""

      - name: waiver_rollup_sums_per_return_rounded_components
        grounds:
          - calculations.agreement_waiver_rollup
          - entities.VoluntaryDisclosureAgreement.fields.waived_amount_cents
          - entities.DisclosureReturn.fields.waived_interest_cents
        distinguishing_aspect: |
          Mode (b) sum-of-rounded: two returns each carry gross_interest_cents 6789, so each
          per-return waived_interest_cents rounds 3394.5 half-up to 3395 and the agreement's
          waived_amount_cents is 40736; rounding the summed interest first (13578 * 0.50 = 6789)
          would commit 40735, which is the forbidden alternative.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with base waivers 1.00 penalty / 0.50 interest and one SALES_USE term"
            - "Taxpayer Marrow Grove holds an EXECUTED agreement with two DRAFT returns, each reported_tax_cents 67891 and original_due_date 2025-10-27, on adjacent 2025 quarters"
            - "The first of the two returns is already FILED, so the trigger observes the rollup across both"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /amnesty/programs/${prog_id}/tax-type-terms"
              payload: { tax_type: "SALES_USE", eligible_period_start: "2020-01-01", eligible_period_end: "2026-07-01", min_liability_cents: 50000 }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs/${prog_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /amnesty/taxpayers"
              payload: { legal_name: "Marrow Grove Cabinetry LLC", taxpayer_type: "BUSINESS", tin_last4: "6650" }
              as: ProgramAdministrator
              captures: { tp_id: $.data.id }
            - call: "POST /amnesty/agreements"
              payload: { program_id: "${prog_id}", taxpayer_id: "${tp_id}", tax_types: ["SALES_USE"], lookback_start_date: "2023-09-01", lookback_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { agr_id: $.data.id }
            - call: "POST /amnesty/agreements/${agr_id}/execute"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-beta"
            - call: "POST /amnesty/agreements/${agr_id}/returns"
              payload: { tax_type: "SALES_USE", period_start_date: "2025-01-01", period_end_date: "2025-03-31", original_due_date: "2025-10-27", reported_tax_cents: 67891 }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_a_id: $.data.id }
            - call: "POST /amnesty/agreements/${agr_id}/returns"
              payload: { tax_type: "SALES_USE", period_start_date: "2025-04-01", period_end_date: "2025-06-30", original_due_date: "2025-10-27", reported_tax_cents: 67891 }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_b_id: $.data.id }
            - call: "POST /amnesty/returns/${ret_a_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
          trigger:
            - call: "POST /amnesty/returns/${ret_b_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
          assert:
            - "DisclosureReturn.${ret_a_id}.gross_penalty_cents == 16973"
            - "DisclosureReturn.${ret_a_id}.gross_interest_cents == 6789"
            - "DisclosureReturn.${ret_a_id}.waived_penalty_cents == 16973"
            - "DisclosureReturn.${ret_a_id}.waived_interest_cents == 3395"
            - "DisclosureReturn.${ret_a_id}.payable_interest_cents == 3394"
            - "DisclosureReturn.${ret_a_id}.balance_due_cents == 71285"
            - "DisclosureReturn.${ret_b_id}.waived_interest_cents == 3395"
            - "DisclosureReturn.${ret_b_id}.balance_due_cents == 71285"
            - "VoluntaryDisclosureAgreement.${agr_id}.gross_liability_cents == 183306"
            - "VoluntaryDisclosureAgreement.${agr_id}.haircut_pct == 0.00"
            - "VoluntaryDisclosureAgreement.${agr_id}.waived_amount_cents == 40736"
            - "VoluntaryDisclosureAgreement.${agr_id}.total_due_cents == 142570"

      - name: haircut_resolution_order_revises_previously_filed_returns
        grounds:
          - calculations.agreement_effective_waiver_resolution
          - calculations.agreement_waiver_rollup
          - entities.VoluntaryDisclosureAgreement.fields.haircut_pct
          - entities.DisclosureReturn.fields.waived_penalty_cents
        distinguishing_aspect: |
          Mode (c) order-sensitive composition: the haircut is selected from the PRE-waiver
          aggregate, so filing the third return pushes gross_liability_cents to exactly 5000000,
