# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Search & Rescue / Emergency Volunteer Coordination — Expert
# Breadth probe over §1.1-§1.7 claims not covered by §1.8. Every setup_api_calls
# chain drives empty-DB -> precondition using only §1.5 endpoints.
# =============================================================================
scaffold_corner_design:

  # ==========================================================================
  - section: entities
    instances:
      - name: create_incident_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.Incident.fields.status
          - entities.Incident.fields.total_approved_reimbursement_cents
        distinguishing_aspect: "POST /sar/incidents with required fields -> 201; status=PLANNING, version=1, total_approved_reimbursement_cents=0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /sar/incidents"
              payload: { name: "New Inc", incident_type: "DISASTER", ics_incident_number: "OR-2026-1000" }
              as: Coordinator
              captures: { inc_id: $.data.id, ver: $.data.version, st: $.data.status, led: $.data.total_approved_reimbursement_cents }
          assert:
            - "st == PLANNING"
            - "ver == 1"
            - "led == 0"

      - name: get_incident_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Incident
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /sar/incidents/{unknown uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /sar/incidents/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: create_task_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds:
          - entities.Task.fields.segment_area_sqkm
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /sar/tasks without segment_area_sqkm -> ERR_VALIDATION (422)."
        test_recipe:
          setup: ["An incident exists to reference."]
          setup_api_calls:
            - call: "POST /sar/incidents"
              payload: { name: "Val Inc", incident_type: "URBAN", ics_incident_number: "OR-2026-1001" }
              as: Coordinator
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /sar/tasks"
              payload: { incident_id: "${inc_id}", task_number: "T-1", task_type: "GRID_SEARCH", planned_searcher_hours: 4, planned_start: "2026-05-02T08:00:00Z", planned_end: "2026-05-02T16:00:00Z" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"

      - name: create_member_default_status_active
        claim_type: Defaults
        grounds:
          - entities.Member.fields.status
        distinguishing_aspect: "New Member has status ACTIVE by default (no input for status)."
        test_recipe:
          setup: ["A team exists."]
          setup_api_calls:
            - call: "POST /sar/teams"
              payload: { name: "Def Team", team_type: "GROUND", base_location: "Bend" }
              as: Coordinator
              captures: { team_id: $.data.id }
          trigger:
            - call: "POST /sar/members"
              payload: { team_id: "${team_id}", full_name: "Pat Vol", email: "pat@x.org", member_role: "SEARCHER" }
              as: Coordinator
              captures: { st: $.data.status }
          assert:
            - "st == ACTIVE"

      - name: create_resource_computed_status_and_count
        claim_type: Computed Fields
        grounds:
          - entities.Resource.fields.status
          - entities.Resource.fields.active_assignment_count
        distinguishing_aspect: "New Resource is computed AVAILABLE with active_assignment_count 0 (no input can set them)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /sar/resources"
              payload: { name: "K9 Ranger", resource_type: "K9" }
              as: Coordinator
              captures: { st: $.data.status, cnt: $.data.active_assignment_count }
          assert:
            - "st == AVAILABLE"
            - "cnt == 0"

  # ==========================================================================
  - section: state_machines
    instances:
      - name: resume_task_from_assigned_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Task.SUSPENDED_to_IN_PROGRESS
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "resume is defined only from SUSPENDED; calling it on an ASSIGNED task -> ERR_INVALID_STATE; no side effects."
        test_recipe:
          setup: ["An ASSIGNED task under an ACTIVE incident."]
          setup_api_calls:
            - call: "POST /sar/incidents"
              payload: { name: "Inv Inc", incident_type: "WILDERNESS_SEARCH", ics_incident_number: "OR-2026-1002" }
              as: Coordinator
              captures: { inc_id: $.data.id }
            - call: "POST /sar/incidents/${inc_id}/activate"
              payload: {}
              as: IncidentCommander
            - call: "POST /sar/tasks"
              payload: { incident_id: "${inc_id}", task_number: "T-1", task_type: "GRID_SEARCH", segment_area_sqkm: 5.0, planned_searcher_hours: 4, planned_start: "2026-05-02T08:00:00Z", planned_end: "2026-05-02T16:00:00Z" }
              as: Coordinator
              captures: { task_id: $.data.id }
            - call: "POST /sar/tasks/${task_id}/assign"
              payload: {}
              as: IncidentCommander
          trigger:
            - call: "POST /sar/tasks/${task_id}/resume"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: clue_promote_from_dismissed_terminal_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Clue.LOGGED_to_DISMISSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "DISMISSED is terminal; promoting a DISMISSED clue -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["A clue that has been DISMISSED."]
          setup_api_calls:
            - call: "POST /sar/incidents"
              payload: { name: "Clue Inc", incident_type: "WILDERNESS_SEARCH", ics_incident_number: "OR-2026-1003" }
              as: Coordinator
              captures: { inc_id: $.data.id }
            - call: "POST /sar/clues"
              payload: { incident_id: "${inc_id}", clue_number: "C-1", description: "footprint", found_at: "2026-05-02T09:00:00Z" }
              as: Coordinator
              captures: { clue_id: $.data.id }
            - call: "POST /sar/clues/${clue_id}/dismiss"
              payload: {}
              as: IncidentCommander
          trigger:
            - call: "POST /sar/clues/${clue_id}/promote"
              payload: {}
              as: IncidentCommander
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: clue_dismiss_from_logged_valid_branch
        claim_type: Valid Transition
        grounds:
          - state_machines.Clue.LOGGED_to_DISMISSED
          - entities.Clue.fields.status
        distinguishing_aspect: "Branch fork at LOGGED: dismiss drives LOGGED -> DISMISSED (the other arm of the promote/dismiss fork)."
        test_recipe:
          setup: ["A LOGGED clue."]
          setup_api_calls:
            - call: "POST /sar/incidents"
              payload: { name: "Clue Inc2", incident_type: "WILDERNESS_SEARCH", ics_incident_number: "OR-2026-1004" }
              as: Coordinator
              captures: { inc_id: $.data.id }
            - call: "POST /sar/clues"
              payload: { incident_id: "${inc_id}", clue_number: "C-1", clue_priority: "ROUTINE", description: "candy wrapper", found_at: "2026-05-02T09:00:00Z" }
              as: Coordinator
              captures: { clue_id: $.data.id }
          trigger:
            - call: "POST /sar/clues/${clue_id}/dismiss"
              payload: {}
              as: IncidentCommander
              captures: { st: $.data.status }
          assert:
            - "st == DISMISSED"

      - name: acknowledge_callout_twice_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Callout.REQUESTED_to_ACKNOWLEDGED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Second acknowledge on an already-ACKNOWLEDGED callout -> ERR_INVALID_STATE (not idempotent success)."
        test_recipe:
          setup: ["A callout acknowledged once by its owning member."]
          setup_api_calls:
            - call: "POST /sar/incidents"
              payload: { name: "Ack Inc", incident_type: "URBAN", ics_incident_number: "OR-2026-1005" }
              as: Coordinator
              captures: { inc_id: $.data.id }
            - call: "POST /sar/incidents/${inc_id}/activate"
              payload: {}
              as: IncidentCommander
            - call: "POST /sar/teams"
              payload: { name: "Ack Team", team_type: "GROUND", base_location: "Bend" }
              as: Coordinator
              captures: { team_id: $.data.id }
            - call: "POST /sar/members"
              payload: { team_id: "${team_id}", full_name: "Ann Vol", email: "ann@x.org", member_role: "SEARCHER" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /sar/tasks"
              payload: { incident_id: "${inc_id}", task_number: "T-1", task_type: "GRID_SEARCH", segment_area_sqkm: 5.0, planned_searcher_hours: 4, planned_start: "2026-05-02T08:00:00Z", planned_end: "2026-05-02T16:00:00Z" }
              as: Coordinator
              captures: { task_id: $.data.id }
            - call: "POST /sar/callouts"
              payload: { task_id: "${task_id}", member_id: "${m_id}" }
              as: Coordinator
              captures: { co_id: $.data.id }
            - call: "POST /sar/callouts/${co_id}/acknowledge"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /sar/callouts/${co_id}/acknowledge"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

  # ==========================================================================
  - section: calculations
    instances:
      - name: incident_rollup_empty_set_is_zero
        claim_type: Input Set Filtering
        grounds:
          - calculations.incident_effort_rollup
          - entities.Incident.fields.total_logged_hours
          - entities.Incident.fields.total_mileage_miles
        distinguishing_aspect: "An incident with zero GroundTracks rolls up to total_logged_hours 0 and total_mileage_miles 0 (empty-set boundary)."
        test_recipe:
          setup: ["A fresh incident with no tasks/tracks."]
          setup_api_calls:
            - call: "POST /sar/incidents"
              payload: { name: "Empty Inc", incident_type: "URBAN", ics_incident_number: "OR-2026-1006" }
              as: Coordinator
              captures: { inc_id: $.data.id }
          trigger:
            - call: "GET /sar/incidents/${inc_id}"
              payload: {}
              as: Coordinator
              captures: { hrs: $.data.total_logged_hours, mi: $.data.total_mileage_miles, atc: $.data.active_task_count }
          assert:
            - "hrs == 0"
            - "mi == 0"
            - "atc == 0"

      - name: incident_rollup_recomputes_on_track_add
        claim_type: Correct Result
        grounds:
          - calculations.incident_effort_rollup
          - entities.GroundTrack.fields.duration_min
          - entities.GroundTrack.fields.distance_km
        distinguishing_aspect: "Adding a GroundTrack of 90 min / 30.0 km makes total_logged_hours 1.5 and total_mileage_miles 19 (round_half_up(30*0.621371))."
        test_recipe:
          setup: ["ACTIVE incident with one task and one member; one GroundTrack logged (90 min, 30.0 km)."]
          setup_api_calls:
            - call: "POST /sar/incidents"
              payload: { name: "Roll Inc", incident_type: "WILDERNESS_SEARCH", ics_incident_number: "OR-2026-1007" }
              as: Coordinator
              captures: { inc_id: $.data.id }
            - call: "POST /sar/incidents/${inc_id}/activate"
              payload: {}
              as: IncidentCommander
            - call: "POST /sar/teams"
              payload: { name: "Roll Team", team_type: "GROUND", base_location: "Bend" }
              as: Coordinator
              captures: { team_id: $.data.id }
            - call: "POST /sar/members"
              payload: { team_id: "${team_id}", full_name: "Ray Vol", email: "ray@x.org", member_role: "SEARCHER" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /sar/tasks"
              payload: { incident_id: "${inc_id}", task_number: "T-1", task_type: "GRID_SEARCH", segment_area_sqkm: 5.0, planned_searcher_hours: 4, planned_start: "2026-05-02T08:00:00Z", planned_end: "2026-05-02T16:00:00Z" }
              as: Coordinator
              captures: { task_id: $.data.id }
            - call: "POST /sar/ground-tracks"
              payload: { task_id: "${task_id}", member_id: "${m_id}", recorded_at: "2026-05-02T10:00:00Z", distance_km: 30.0, duration_min: 90, coverage_area_sqkm: 2.0 }
              as: Coordinator
          trigger:
            - call: "GET /sar/incidents/${inc_id}"
              payload: {}
              as: Coordinator
              captures: { hrs: $.data.total_logged_hours, mi: $.data.total_mileage_miles }
          assert:
            - "hrs == 1.5"
            - "mi == 19"

      - name: certification_valid_before_expiry
        claim_type: Constants Applied
        grounds:
          - calculations.cert_currency
          - entities.Certification.fields.status
        distinguishing_aspect: "At clock 2026-05-31T23:59:59Z a cert expiring 2026-06-01T00:00:00Z is still VALID (strictly-before the inclusive >= boundary)."
        test_recipe:
          setup: ["Clock at 2026-05-31T23:59:59Z; a member holds a WFR cert expiring 2026-06-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /sar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-31T23:59:59Z" }
              as: Coordinator
            - call: "POST /sar/teams"
              payload: { name: "Cert Team", team_type: "GROUND", base_location: "Bend" }
              as: Coordinator
              captures: { team_id: $.data.id }
            - call: "POST /sar/members"
              payload: { team_id: "${team_id}", full_name: "Cal Med", email: "cal@x.org", member_role: "SEARCHER" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /sar/certifications"
              payload: { member_id: "${m_id}", cert_type: "WFR", issued_date: "2024-06-01T00:00:00Z", expires_date: "2026-06-01T00:00:00Z" }
              as: Coordinator
              captures: { cert_id: $.data.id }
          trigger:
            - call: "GET /sar/certifications/${cert_id}"
              payload: {}
              as: Coordinator
              captures: { st: $.data.status }
          assert:
            - "st == VALID"

  # ==========================================================================
  - section: validations
    instances:
      - name: callout_create_exceeds_capacity_returns_task_at_capacity
        claim_type: Aggregate validation
        grounds:
          - validations[priority=10]
          - errors[ERR_TASK_AT_CAPACITY]
          - entities.Task.fields.max_responders
        distinguishing_aspect: "A task with max_responders 1 already holding one non-terminal callout rejects a second callout with ERR_TASK_AT_CAPACITY."
        test_recipe:
          setup: ["Task with max_responders 1 and one existing REQUESTED callout."]
          setup_api_calls:
            - call: "POST /sar/incidents"
              payload: { name: "Cap Inc", incident_type: "WILDERNESS_SEARCH", ics_incident_number: "OR-2026-1008" }
              as: Coordinator
              captures: { inc_id: $.data.id }
            - call: "POST /sar/incidents/${inc_id}/activate"
              payload: {}
              as: IncidentCommander
            - call: "POST /sar/teams"
              payload: { name: "Cap Team", team_type: "GROUND", base_location: "Bend" }
              as: Coordinator
              captures: { team_id: $.data.id }
            - call: "POST /sar/members"
              payload: { team_id: "${team_id}", full_name: "Cap A", email: "capa@x.org", member_role: "SEARCHER" }
              as: Coordinator
              captures: { m_a: $.data.id }
            - call: "POST /sar/members"
              payload: { team_id: "${team_id}", full_name: "Cap B", email: "capb@x.org", member_role: "SEARCHER" }
              as: Coordinator
              captures: { m_b: $.data.id }
            - call: "POST /sar/tasks"
              payload: { incident_id: "${inc_id}", task_number: "T-1", task_type: "GRID_SEARCH", segment_area_sqkm: 5.0, planned_searcher_hours: 4, max_responders: 1, planned_start: "2026-05-02T08:00:00Z", planned_end: "2026-05-02T16:00:00Z" }
              as: Coordinator
              captures: { task_id: $.data.id }
            - call: "POST /sar/callouts"
              payload: { task_id: "${task_id}", member_id: "${m_a}" }
              as: Coordinator
          trigger:
            - call: "POST /sar/callouts"
              payload: { task_id: "${task_id}", member_id: "${m_b}" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_TASK_AT_CAPACITY"

      - name: duplicate_claim_same_member_incident_returns_duplicate_claim
        claim_type: Conditional validation
        grounds:
          - validations[priority=10]
          - errors[ERR_DUPLICATE_CLAIM]
        distinguishing_aspect: "A second non-REJECTED claim for the same (member_id, incident_id) -> ERR_DUPLICATE_CLAIM."
        test_recipe:
          setup: ["A member with one existing DRAFT claim on an incident."]
          setup_api_calls:
            - call: "POST /sar/incidents"
              payload: { name: "Dup Inc", incident_type: "URBAN", ics_incident_number: "OR-2026-1009" }
              as: Coordinator
              captures: { inc_id: $.data.id }
            - call: "POST /sar/teams"
              payload: { name: "Dup Team", team_type: "GROUND", base_location: "Bend" }
              as: Coordinator
              captures: { team_id: $.data.id }
            - call: "POST /sar/members"
              payload: { team_id: "${team_id}", full_name: "Dan Vol", email: "dan@x.org", member_role: "SEARCHER" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /sar/reimbursement-claims"
              payload: { member_id: "${m_id}", incident_id: "${inc_id}", declared_mileage_miles: 10 }
              as: Coordinator
          trigger:
            - call: "POST /sar/reimbursement-claims"
              payload: { member_id: "${m_id}", incident_id: "${inc_id}", declared_mileage_miles: 20 }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_CLAIM"

      - name: start_task_without_deployed_responder_returns_error
        claim_type: Violation → Error
        grounds:
          - validations[priority=11]
          - errors[ERR_NO_DEPLOYED_RESPONDERS]
          - state_machines.Task.ASSIGNED_to_IN_PROGRESS
        distinguishing_aspect: "Starting an ASSIGNED task with no DEPLOYED callout -> ERR_NO_DEPLOYED_RESPONDERS."
        test_recipe:
          setup: ["An ASSIGNED task with no callouts."]
          setup_api_calls:
            - call: "POST /sar/incidents"
              payload: { name: "Start Inc", incident_type: "WILDERNESS_SEARCH", ics_incident_number: "OR-2026-1010" }
              as: Coordinator
              captures: { inc_id: $.data.id }
            - call: "POST /sar/incidents/${inc_id}/activate"
              payload: {}
              as: IncidentCommander
            - call: "POST /sar/tasks"
              payload: { incident_id: "${inc_id}", task_number: "T-1", task_type: "GRID_SEARCH", segment_area_sqkm: 5.0, planned_searcher_hours: 4, planned_start: "2026-05-02T08:00:00Z", planned_end: "2026-05-02T16:00:00Z" }
              as: Coordinator
              captures: { task_id: $.data.id }
            - call: "POST /sar/tasks/${task_id}/assign"
              payload: {}
              as: IncidentCommander
          trigger:
            - call: "POST /sar/tasks/${task_id}/start"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NO_DEPLOYED_RESPONDERS"

      - name: close_incident_with_active_task_returns_error
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=10]
          - errors[ERR_INCIDENT_HAS_ACTIVE_TASKS]
          - state_machines.Incident.DEMOBILIZING_to_CLOSED
        distinguishing_aspect: "Closing a DEMOBILIZING incident that still has a DRAFT (active) task -> ERR_INCIDENT_HAS_ACTIVE_TASKS."
        test_recipe:
          setup: ["A DEMOBILIZING incident with one DRAFT task."]
          setup_api_calls:
            - call: "POST /sar/incidents"
              payload: { name: "Close Inc", incident_type: "WILDERNESS_SEARCH", ics_incident_number: "OR-2026-1011" }
              as: Coordinator
              captures: { inc_id: $.data.id }
            - call: "POST /sar/incidents/${inc_id}/activate"
              payload: {}
              as: IncidentCommander
            - call: "POST /sar/tasks"
              payload: { incident_id: "${inc_id}", task_number: "T-1", task_type: "GRID_SEARCH", segment_area_sqkm: 5.0, planned_searcher_hours: 4, planned_start: "2026-05-02T08:00:00Z", planned_end: "2026-05-02T16:00:00Z" }
              as: Coordinator
            - call: "POST /sar/incidents/${inc_id}/demobilize"
              payload: {}
              as: IncidentCommander
          trigger:
            - call: "POST /sar/incidents/${inc_id}/close"
              payload: {}
              as: IncidentCommander
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INCIDENT_HAS_ACTIVE_TASKS"

      - name: standby_with_inactive_team_returns_team_inactive
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=7]
          - errors[ERR_TEAM_INACTIVE]
          - state_machines.Callout.ACKNOWLEDGED_to_STANDBY
        distinguishing_aspect: "Placing a callout on STANDBY when the member's Team is INACTIVE -> ERR_TEAM_INACTIVE."
        test_recipe:
          setup: ["ACKNOWLEDGED callout whose member belongs to a now-INACTIVE team."]
          setup_api_calls:
            - call: "POST /sar/incidents"
              payload: { name: "Team Inc", incident_type: "WILDERNESS_SEARCH", ics_incident_number: "OR-2026-1012" }
              as: Coordinator
              captures: { inc_id: $.data.id }
            - call: "POST /sar/incidents/${inc_id}/activate"
              payload: {}
              as: IncidentCommander
            - call: "POST /sar/teams"
              payload: { name: "Inactive Team", team_type: "GROUND", base_location: "Bend" }
              as: Coordinator
              captures: { team_id: $.data.id }
            - call: "POST /sar/members"
              payload: { team_id: "${team_id}", full_name: "Tim Vol", email: "tim@x.org", member_role: "SEARCHER" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /sar/tasks"
              payload: { incident_id: "${inc_id}", task_number: "T-1", task_type: "GRID_SEARCH", segment_area_sqkm: 5.0, planned_searcher_hours: 4, planned_start: "2026-05-02T08:00:00Z", planned_end: "2026-05-02T16:00:00Z" }
              as: Coordinator
              captures: { task_id: $.data.id }
            - call: "POST /sar/callouts"
              payload: { task_id: "${task_id}", member_id: "${m_id}" }
              as: Coordinator
              captures: { co_id: $.data.id }
            - call: "POST /sar/callouts/${co_id}/acknowledge"
              payload: {}
              as: Member
