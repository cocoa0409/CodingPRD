          assert:
            - "${lapsed} == \"LAPSED\" - currency_expires_at 2026-05-02T00:00:00Z is at or before the clock"
            - "${err} == \"ERR_PILOT_NOT_CERTIFIED\" with HTTP 409, and Waiver.${wid}.status is still \"DRAFT\" with revision_round 0"
            - "SafetyCase.${scid}.review_status is still \"PENDING\" and sail_level == 3 - the rejected submission changed nothing on the child either"
            - "${recertified} == true, so the pilot is CERTIFIED again with currency_expires_at \"2026-08-01T00:00:00Z\""
            - "${waiver_state} == \"SUBMITTED\" - the identical submit now succeeds against an unchanged Waiver row"
            - "the two submissions differ only in Pilot.${pid}.status, and priority 30 (ERR_SAFETY_CASE_MISSING) never fires because the SafetyCase existed all along"

  - rule_id: resource_temporal_overlap
    instances:
      - name: zone_capacity_half_open_windows_touching_authorizations_do_not_collide
        grounds:
          - calculations.zone_slot_occupancy
          - validations.priority_28
          - entities.AirspaceZone.fields.max_concurrent_authorizations
          - entities.AirspaceZone.fields.reserved_slot_count
          - endpoints.POST_/drone-ops/airspace-authorizations/{id}/decide
        distinguishing_aspect: |
          Resource entity: the AirspaceZone, whose occupancy windows are HALF-OPEN
          [window_start, window_end) with no buffer. On a zone with
          max_concurrent_authorizations 1, an authorization for 11:00-13:00 is approvable
          alongside one already holding 09:00-11:00 because the endpoints merely touch, while a
          third for 10:30-12:00 is refused because it strictly overlaps both.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "One COMMERCIAL pilot CERTIFIED at 2026-08-05T00:00:00Z with an ACTIVE indemnified InsurancePolicy of 5000000 cents and one REGISTERED 249 g airframe with max_altitude_ft 900."
            - "One class C zone: class_ceiling_ft 700, requires_authorization true, structure_relief_eligible false, max_concurrent_authorizations 1."
            - "Three REQUESTED authorizations on that zone, all for 400 ft on 2026-08-20: 09:00-11:00, 11:00-13:00 and 10:30-12:00."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Noor Haddad", email: "noor.haddad@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 87 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Corridor 7", serial_number: "SN-SLOT-01", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/insurance-policies"
              payload: { pilot_id: "${pid}", insurer_name: "Skyline Mutual", policy_number: "POL-SLOT-01", coverage_limit_cents: 5000000, deductible_cents: 50000, effective_from: "2026-08-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z", indemnification_clause_accepted: true }
              as: Pilot
              as_user_id: "${pid}"
              captures: { polid: $.data.id }
            - call: "POST /drone-ops/insurance-policies/${polid}/verify"
              payload: { outcome: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-C-SLOT", class_code: "C", class_ceiling_ft: 700, requires_authorization: true, max_concurrent_authorizations: 1, structure_relief_eligible: false }
              as: AirspaceAuthority
              captures: { zid: $.data.id }
            - call: "GET /drone-ops/airspace-zones/${zid}"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { zv1: $.data.version }
            - call: "POST /drone-ops/airspace-authorizations"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", requested_ceiling_ft: 400, window_start: "2026-08-20T09:00:00Z", window_end: "2026-08-20T11:00:00Z", expected_zone_version: "${zv1}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { a1: $.data.id }
            - call: "GET /drone-ops/airspace-zones/${zid}"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { zv2: $.data.version }
            - call: "POST /drone-ops/airspace-authorizations"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", requested_ceiling_ft: 400, window_start: "2026-08-20T11:00:00Z", window_end: "2026-08-20T13:00:00Z", expected_zone_version: "${zv2}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { a2: $.data.id }
            - call: "GET /drone-ops/airspace-zones/${zid}"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { zv3: $.data.version }
            - call: "POST /drone-ops/airspace-authorizations"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", requested_ceiling_ft: 400, window_start: "2026-08-20T10:30:00Z", window_end: "2026-08-20T12:00:00Z", expected_zone_version: "${zv3}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { a3: $.data.id }
          trigger:
            - call: "POST /drone-ops/airspace-authorizations/${a1}/decide"
              payload: { decision: "APPROVE" }
              as: AirspaceAuthority
              as_user_id: "aa-31"
              captures: { s1: $.data.status }
            - call: "POST /drone-ops/airspace-authorizations/${a2}/decide"
              payload: { decision: "APPROVE" }
              as: AirspaceAuthority
              as_user_id: "aa-31"
              captures: { s2: $.data.status }
            - call: "POST /drone-ops/airspace-authorizations/${a3}/decide"
              payload: { decision: "APPROVE" }
              as: AirspaceAuthority
              as_user_id: "aa-31"
              captures: { err3: $.data.error_id }
          assert:
            - "${s1} == \"APPROVED\" with granted_ceiling_ft 400 and AirspaceZone.${zid}.reserved_slot_count == 1"
            - "${s2} == \"APPROVED\" - window_start 11:00 equals the first window's exclusive end, so conflict_count is 0 even though the capacity is only 1 - and reserved_slot_count == 2"
            - "${err3} == \"ERR_ZONE_CAPACITY_EXCEEDED\" with HTTP 409: the 10:30-12:00 request strictly overlaps both approved windows, giving conflict_count 2 which is not < 1"
            - "AirspaceAuthorization.${a3}.status is still \"REQUESTED\" with granted_ceiling_ft null, and reserved_slot_count is still 2"
            - "an implementation using closed intervals (window_end >= candidate.window_start) would wrongly refuse the second authorization"
            - "reserved_slot_count equals the number of APPROVED or ACTIVE authorizations on the zone at every point in this sequence (0, 1, 2, 2)"

      - name: aircraft_turnaround_closed_interval_thirty_minute_gap_collides
        grounds:
          - calculations.aircraft_turnaround_conflict
          - validations.priority_29
          - entities.Flight.fields.planned_start
          - endpoints.POST_/drone-ops/flights
        distinguishing_aspect: |
          A different resource entity - the Aircraft - with the opposite interval semantics:
          CLOSED comparisons plus a symmetric AIRCRAFT_TURNAROUND_MINUTES 30 buffer, so touching
          endpoints DO collide. Against an existing PLANNED flight of 09:00-10:00, a candidate
          starting at 10:30 - exactly one turnaround later - is refused, and one starting at
          10:31 is accepted. The zone instance rejects only strict overlaps with no buffer; this
          one rejects a 30-minute gap.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "One COMMERCIAL pilot CERTIFIED at 2026-08-05T00:00:00Z, one REGISTERED 249 g airframe, one uncontrolled class G zone with class_ceiling_ft 400."
            - "One PLANNED RECREATIONAL flight on that airframe for 2026-08-20T09:00:00Z .. 2026-08-20T10:00:00Z at 380 ft."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Aiko Tanaka", email: "aiko.tanaka@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 83 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Shuttle 2", serial_number: "SN-TURN-01", takeoff_weight_g: 249, max_altitude_ft: 800 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-G-TURN", class_code: "G", class_ceiling_ft: 400, requires_authorization: false, max_concurrent_authorizations: 4 }
              as: AirspaceAuthority
              captures: { zid: $.data.id }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", operation_category: "RECREATIONAL", planned_start: "2026-08-20T09:00:00Z", planned_end: "2026-08-20T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 47.55, launch_longitude: -122.27 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", operation_category: "RECREATIONAL", planned_start: "2026-08-20T10:30:00Z", planned_end: "2026-08-20T11:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 47.55, launch_longitude: -122.27 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { err: $.data.error_id }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", operation_category: "RECREATIONAL", planned_start: "2026-08-20T10:31:00Z", planned_end: "2026-08-20T11:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 47.55, launch_longitude: -122.27 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { f2: $.data.id, f2_state: $.data.status }
          assert:
            - "${err} == \"ERR_AIRCRAFT_SCHEDULE_CONFLICT\" with HTTP 409: padding the 10:30-11:00 candidate gives 10:00-11:30, and the existing flight's planned_end 10:00 >= 10:00 makes the closed comparison collide"
            - "the refused candidate creates no Flight row: the airframe still has exactly one flight, ${f1}, in \"PLANNED\""
            - "${f2_state} == \"PLANNED\" - a 31-minute gap pads to 10:01-11:30 and 10:00 >= 10:01 is false, so there is no conflict"
            - "Flight.${f2}.planned_start == \"2026-08-20T10:31:00Z\" and the airframe now has two PLANNED flights"
            - "an implementation using half-open comparisons, or omitting the buffer, would accept the 10:30 candidate - which is exactly what the zone-capacity instance requires for its own resource"
            - "the buffer is symmetric: a candidate ending at 08:30 would collide with the same existing flight for the same reason"

  - rule_id: compensating_invariant
