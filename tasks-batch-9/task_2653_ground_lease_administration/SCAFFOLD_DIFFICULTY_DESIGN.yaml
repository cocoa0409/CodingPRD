            - "both assessments are HOLDBACK_APPLIED and both inspected_by_user_id == 'am-1'"

  - rule_id: non_linear_state_machine
    instances:
      - name: lease_parallel_axes_tenancy_and_rent_move_independently
        grounds:
          - state_machines.Lease.lease_status
          - state_machines.Lease.rent_status
          - complexity_profile.state_machine_shape
          - entities.Lease.fields.lease_status
          - entities.Lease.fields.rent_status
        distinguishing_aspect: |
          The Lease row carries two independent state dimensions. This walk drives them out of step and
          back: rent_status reaches IN_ARBITRATION while lease_status is still ACTIVE, then a default
          notice moves lease_status to IN_DEFAULT with rent_status untouched, then a lessee cure returns
          lease_status to ACTIVE with rent_status still IN_ARBITRATION, and finally the arbitrator's award
          moves only the rent axis to RESET_APPLIED. Four of the five combined states visited are ones a
          single-axis implementation cannot represent, and the ordering matters: the referral must precede
          the notice because a referral is refused while lease_status is IN_DEFAULT.
        test_recipe:
          setup:
            - "Clock at its 2026-08-01T00:00:00Z default; one lessee; one lease with base rent 10000000 and collar 1000/5000 bps."
            - "A revaluation is opened for valuation_date 2027-06-01 and both appraisals are exchanged at LESSOR 14000000 / LESSEE 10000000."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-46", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/rent-revaluations"
              payload: { valuation_date: "2027-06-01T00:00:00Z" }
              as: LessorAdmin
              captures: { reval_id: $.data.id }
            - call: "POST /portfolio/rent-revaluations/${reval_id}/appraisals"
              payload: { appointed_by: "LESSOR", appraised_annual_rent_cents: 14000000, valuation_method_code: "COMPARABLE_LAND" }
              as: LessorAdmin
              as_user_id: "appraiser-lessor-1"
            - call: "POST /portfolio/rent-revaluations/${reval_id}/appraisals"
              payload: { appointed_by: "LESSEE", appraised_annual_rent_cents: 10000000, valuation_method_code: "INCOME_CAP" }
              as: GroundTenant
              as_user_id: "${lessee_id}"
            - call: "POST /portfolio/rent-revaluations/${reval_id}/exchange"
              payload: {}
              as: LessorAdmin
            - call: "POST /portfolio/leases/${lease_id}/rent-charges"
              payload: { amount_cents: 1000000, memo: "2026 Q2 ground rent" }
              as: LeaseAccountant
          trigger:
            - call: "POST /portfolio/rent-revaluations/${reval_id}/arbitration-referrals"
              payload: { arbitrator_user_id: "arb-neutral-1", hearing_date: "2027-07-01T00:00:00Z" }
              as: LessorAdmin
              captures: { arb_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/default-notices"
              payload: { default_type: "MONETARY_RENT_ARREARS", claimed_amount_cents: 1000000 }
              as: LeaseAccountant
              as_user_id: "acct-1"
              captures: { notice_id: $.data.id }
            - call: "POST /portfolio/default-notices/${notice_id}/lessee-cure"
              payload: { payment_at: "2026-08-02T00:00:00Z", cure_amount_cents: 1000000 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
            - call: "POST /portfolio/arbitrations/${arb_id}/award"
              payload: { independent_annual_rent_cents: 13000000 }
              as: Arbitrator
              as_user_id: "arb-neutral-1"
          assert:
            - "after setup: Lease.${lease_id}.lease_status == ACTIVE and rent_status == REVALUATION_OPEN"
            - "after trigger[0]: lease_status == ACTIVE and rent_status == IN_ARBITRATION (the tenancy axis did not move)"
            - "after trigger[1]: lease_status == IN_DEFAULT and rent_status == IN_ARBITRATION (the rent axis did not move)"
            - "after trigger[2]: lease_status == ACTIVE and rent_status == IN_ARBITRATION and arrears_balance_cents == 0"
            - "after trigger[3]: lease_status == ACTIVE and rent_status == RESET_APPLIED and current_annual_base_rent_cents == 14000000"
            - "DefaultNotice.${notice_id}.status == LESSEE_CURED with cured_by == LESSEE"
            - "RentRevaluation.${reval_id}.status == RESOLVED with resolution_method == ARBITRATION_AWARD"
            - "no call in this walk ever left the lease in a state where both axes moved in the same request except trigger[3]'s rent-axis-only cascade"

      - name: revaluation_round_cycle_reopens_then_refuses_a_third_round
        grounds:
          - state_machines.RentRevaluation.PROPOSALS_EXCHANGED_to_OPEN_FOR_APPRAISALS
          - calculations.revaluation_reset_rent
          - entities.RentRevaluation.fields.round_number
          - entities.AppraisalSubmission.fields.round_number
          - errors.ERR_MAX_ROUNDS_REACHED
        distinguishing_aspect: |
          The revaluation machine is cyclic, not linear: PROPOSALS_EXCHANGED returns to
          OPEN_FOR_APPRAISALS once, resetting the three exchanged figures to null, and the loop is
          bounded by MAX_NEGOTIATION_ROUNDS 2 rather than by reaching a terminal state. Four
          AppraisalSubmission rows end up on one revaluation and the settlement must read only the two
          whose round_number is 2, so a revisit of the same state carries different data and a different
          outcome (12250000, not the round-1 midpoint 12000000).
        test_recipe:
          setup:
            - "Clock at its 2026-08-01T00:00:00Z default; one lease with base rent 10000000 and collar 1000/5000 bps."
            - "A revaluation open for valuation_date 2027-06-01, round 1 exchanged at LESSOR 14000000 / LESSEE 10000000 (divergence 4000 bps)."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-47", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/rent-revaluations"
              payload: { valuation_date: "2027-06-01T00:00:00Z" }
              as: LessorAdmin
              captures: { reval_id: $.data.id }
            - call: "POST /portfolio/rent-revaluations/${reval_id}/appraisals"
              payload: { appointed_by: "LESSOR", appraised_annual_rent_cents: 14000000, valuation_method_code: "COMPARABLE_LAND" }
              as: LessorAdmin
              as_user_id: "appraiser-lessor-1"
            - call: "POST /portfolio/rent-revaluations/${reval_id}/appraisals"
              payload: { appointed_by: "LESSEE", appraised_annual_rent_cents: 10000000, valuation_method_code: "INCOME_CAP" }
              as: GroundTenant
              as_user_id: "${lessee_id}"
            - call: "POST /portfolio/rent-revaluations/${reval_id}/exchange"
              payload: {}
              as: LessorAdmin
          trigger:
            - call: "POST /portfolio/rent-revaluations/${reval_id}/rounds"
              payload: {}
              as: LessorAdmin
            - call: "POST /portfolio/rent-revaluations/${reval_id}/appraisals"
              payload: { appointed_by: "LESSOR", appraised_annual_rent_cents: 13500000, valuation_method_code: "RESIDUAL_LAND" }
              as: LessorAdmin
              as_user_id: "appraiser-lessor-1"
            - call: "POST /portfolio/rent-revaluations/${reval_id}/appraisals"
              payload: { appointed_by: "LESSEE", appraised_annual_rent_cents: 11000000, valuation_method_code: "INCOME_CAP" }
              as: GroundTenant
              as_user_id: "${lessee_id}"
            - call: "POST /portfolio/rent-revaluations/${reval_id}/exchange"
              payload: {}
              as: LessorAdmin
            - call: "POST /portfolio/rent-revaluations/${reval_id}/rounds"
              payload: {}
              as: LessorAdmin
            - call: "POST /portfolio/rent-revaluations/${reval_id}/settle"
              payload: {}
              as: LessorAdmin
          assert:
            - "after setup: RentRevaluation.${reval_id}.status == PROPOSALS_EXCHANGED, round_number == 1, divergence_bps == 4000"
            - "after trigger[0]: status == OPEN_FOR_APPRAISALS, round_number == 2, and lessor_appraised_rent_cents, lessee_appraised_rent_cents and divergence_bps are all null"
            - "after trigger[1] and trigger[2]: GET /portfolio/appraisal-submissions?revaluation_id=${reval_id} returns 4 rows, two with round_number 1 and two with round_number 2"
            - "after trigger[3]: status == PROPOSALS_EXCHANGED, round_number == 2, lessor_appraised_rent_cents == 13500000, lessee_appraised_rent_cents == 11000000, divergence_bps == 2273"
            - "trigger[4] is rejected with ERR_MAX_ROUNDS_REACHED (409) because round_number is not < MAX_NEGOTIATION_ROUNDS; status stays PROPOSALS_EXCHANGED and round_number stays 2"
            - "after trigger[5]: resolved_annual_base_rent_cents == 12250000 (the round-2 midpoint, clamped inside collar [11000000, 15000000]) and never the round-1 midpoint 12000000"
            - "Lease.${lease_id}.current_annual_base_rent_cents == 12250000 and rent_status == RESET_APPLIED"

      - name: default_notice_forks_into_mortgagee_branch_after_lessee_window_lapses
        grounds:
          - state_machines.DefaultNotice
