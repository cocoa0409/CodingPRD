          assert:
            - "${q_base} == 120000 — one line at 120000 x 1.00 age x 1.00 condition"
            - "${q_parts} == 21600 (18% FULL surcharge) and ${q_hist} == 0 with history_load_pct 0.00, sla_breach_count 0 and critical_call_count 0"
            - "${q_sub} == 141600 and ${q_disc} == 7080 (5% for a 100.00 compliance snapshot)"
            - "the collared result: ${q_annual} == 360000 (90% of 400000), ${q_floor} == true and ${q_cap} == false"
            - "${q_index} == 1.00 and ${q_exp} == '2026-09-14T08:00:00Z' (30 days of validity)"
            - "the quote pins one line_items entry for ${e1_id} with age_years 0, age_multiplier 1.00, condition_multiplier 1.00 and line_cents 120000"
            - "RenewalQuote.${q_id}.status == 'ISSUED' with pm_compliance_pct_snapshot 100.00 and compliance_discount_pct 0.05"
            - "ServiceContract.${c_id}.status == 'RENEWAL_QUOTED' and version == 3"

      - name: an_aged_unsupported_fleet_is_held_down_to_the_135_percent_cap
        claim_type: constants_applied
        grounds:
          - calculations.renewal_quote_pricing
          - calculations.equipment_health_score
          - calculations.fleet_renewal_risk
        distinguishing_aspect: "The condition multiplier stacks three separate adders onto the top age tier (1.60 x 1.45) to reach a 312086-cent computed renewal, which the 135% cap of a small 100000-cent term clamps to 135000 — and the floor test still runs first, so floor_applied is false even though the cap fires."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00:00Z; club WEST holds exactly one unit of model TM-500, installed 2016-01-01 (age 10 years → multiplier 1.60) with 5000 usage hours against a 20000-hour service life, so its USAGE_BASED health is 55.00."
            - "The ACTIVE GOLD/FULL contract has annual_base_cents 100000; no service calls and no PM history."
            - "The model's only critical spare has no refurbished stock, so declaring end-of-support obsoletes it and pushes the unit to UNSUPPORTED, where the relaxed 60.00 threshold flips replacement_recommended to true."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Westline Fitness", region_code: "WEST" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-500", category: "TREADMILL", model_year: 2015, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-CP-1", install_date: "2016-01-01", initial_usage_hours: 5000 }, as: ContractAdministrator, captures: { e1_id: "$.data.id", h_before: "$.data.health_score", r_before: "$.data.replacement_recommended" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 100000, initial_parts_allowance_cents: 0, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/parts", payload: { model_id: "${model_id}", part_number: "MOTOR-CTRL-500", category: "ELECTRONIC", unit_price_cents: 90000, is_critical_spare: true, initial_on_hand_qty: 0, initial_refurb_qty: 0 }, as: PartsPlanner, captures: { p1_id: "$.data.id" } }
            - { call: "POST /fleetcare/parts/${p1_id}/declare-end-of-support", as: PartsPlanner, captures: { p_state: "$.data.lifecycle_status" } }
            - { call: "GET /fleetcare/equipment/${e1_id}", as: ContractAdministrator, captures: { sup_after: "$.data.support_status", h_after: "$.data.health_score", r_after: "$.data.replacement_recommended" } }
          trigger:
            - { call: "GET /fleetcare/contracts/${c_id}", as: ContractAdministrator, captures: { occ_ver_c: "$.data.version" } }
            - { call: "POST /fleetcare/contracts/${c_id}/renewal-quotes", payload: { expected_contract_version: "${occ_ver_c}" }, as: ContractAdministrator, captures: { q_id: "$.data.id", q_base: "$.data.quoted_base_cents", q_parts: "$.data.parts_surcharge_cents", q_sub: "$.data.subtotal_cents", q_disc: "$.data.compliance_discount_cents", q_annual: "$.data.quoted_annual_cents", q_floor: "$.data.floor_applied", q_cap: "$.data.cap_applied", q_index: "$.data.fleet_age_index" } }
          assert:
            - "${h_before} == 55.00 (100 - 25 usage - 20 age) and ${r_before} == false against the 40.00 base threshold"
            - "${p_state} == 'OBSOLETE' (no refurbished stock), ${sup_after} == 'UNSUPPORTED', ${h_after} == 55.00 and ${r_after} == true against the relaxed 60.00 threshold"
            - "${q_base} == 278400 — one line at round_half_up(120000 x 1.60 x 1.45) where 1.45 = 1.00 + 0.25 replacement + 0.20 unsupported"
            - "${q_parts} == 50112 (18% of 278400) and ${q_sub} == 328512"
            - "${q_disc} == 16426 (5% of 328512 = 16425.6 rounded half up)"
            - "${q_annual} == 135000 (135% of 100000), ${q_cap} == true and ${q_floor} == false — the computed 312086 never sees the 90000 floor"
            - "${q_index} == 1.60 and the pinned line carries age_years 10, age_multiplier 1.60, condition_multiplier 1.45"
            - "ServiceContract.${c_id}.obsolete_unit_count == 1, replacement_candidate_count == 1 and fleet_renewal_risk == 'HIGH' (ratio 1.0)"

      - name: capacity_gate_admits_the_exact_ceiling_and_refuses_one_minute_more
        claim_type: precision
        grounds:
          - calculations.technician_capacity_invariant
          - validations[priority=45]
          - errors.ERR_TECHNICIAN_CAPACITY_EXCEEDED
        distinguishing_aspect: "A technician capped at 240 minutes accepts two MAJOR dispatches that land exactly on the ceiling and then refuses a 60-minute MINOR one — the gate is inclusive at equality, and the refusal leaves committed_minutes at 240 with the third call still OPEN."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00:00Z; club NORTH, three units e1/e2/e3, ACTIVE GOLD/FULL contract."
            - "T1 is the only eligible technician and is created with max_committed_minutes 240."
            - "The three dispatch windows are spaced an hour apart, so the 45-minute travel buffer never fires and only the capacity gate can refuse."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-CA-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-CA-2", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e2_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-CA-3", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e3_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"], max_committed_minutes: 240 }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", severity: "MAJOR", symptom_code: "BELT_NOISE" }, as: ServiceCoordinator, captures: { call_1: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e2_id}", severity: "MAJOR", symptom_code: "CONSOLE_DIM" }, as: ServiceCoordinator, captures: { call_2: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e3_id}", severity: "MINOR", symptom_code: "CUP_HOLDER_LOOSE" }, as: ServiceCoordinator, captures: { call_3: "$.data.id" } }
          trigger:
            - { call: "POST /fleetcare/service-calls/${call_1}/dispatch", payload: { start_at: "2026-08-15T08:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator }
            - { call: "POST /fleetcare/service-calls/${call_2}/dispatch", payload: { start_at: "2026-08-15T11:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator, captures: { s2: "$.data.status" } }
            - { call: "GET /fleetcare/technicians/${t1_id}", as: ServiceCoordinator, captures: { committed_at_ceiling: "$.data.committed_minutes" } }
            - { call: "POST /fleetcare/service-calls/${call_3}/dispatch", payload: { start_at: "2026-08-15T14:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator, captures: { err_cap: "$.data.error_id" } }
          assert:
            - "${s2} == 'DISPATCHED' — 120 + 120 == 240 lands exactly on max_committed_minutes and is admitted"
            - "${committed_at_ceiling} == 240"
            - "${err_cap} == 'ERR_TECHNICIAN_CAPACITY_EXCEEDED' with HTTP 409 — 240 + 60 would be 300"
            - "Technician.${t1_id}.committed_minutes is still 240 and no third TechnicianAssignment row exists"
            - "ServiceCall.${call_3}.status == 'OPEN' with assigned_technician_id null and dispatched_at null"
            - "Equipment.${e3_id}.lifecycle_status == 'DOWN' (the call creation already took it down; the failed dispatch changes nothing)"

      - name: provisional_and_final_credit_variants_diverge_on_one_event
        claim_type: variant_divergence
        grounds:
          - calculations.downtime_credit.variants
        excluded_because:
          difficulty_instance: downtime_credit_wall_clock_provisional_vs_operating_hours_final
          rationale: "That §1.8 dual_variant_calculation instance already drives one outage across the club's closed overnight window so that provisional_wall_clock and final_operating_hours produce two different numbers on the same row, and it asserts that reconciliation posts the final value while leaving the provisional value intact for audit."

      - name: health_score_variant_is_selected_by_resolved_call_history
        claim_type: variant_selection
        grounds:
          - calculations.equipment_health_score.variants
          - calculations.equipment_health_score.constants.HEALTH_FAILURE_HISTORY_MIN_CALLS
        excluded_because:
          difficulty_instance: equipment_health_usage_based_vs_failure_based_after_third_call
          rationale: "That §1.8 dual_variant_calculation instance already pins the selector at the 3-call boundary, showing the second resolution still scoring USAGE_BASED and the third switching to FAILURE_BASED on the same unit, including the fact that the usage-based branch ignores downtime entirely."

      - name: period_totals_reconcile_against_the_sum_of_rounded_events
        claim_type: reconciliation
        grounds:
          - calculations.credit_reconciliation.precision
          - calculations.downtime_credit.precision
        excluded_because:
          difficulty_instance: credit_reconciliation_rounds_each_event_before_summing
          rationale: "That §1.8 rounding_and_precision instance already proves the batch total equals the sum of individually rounded per-event credits rather than the rounding of a pooled total — a distinct concern from the cap-clipping and input filtering exercised above."

      - name: technician_calendar_buffer_is_symmetric_at_45_minutes
        claim_type: correct_result
        grounds:
          - calculations.technician_calendar_conflict
          - validations[priority=44]
        excluded_because:
          difficulty_instance: technician_calendar_needs_a_full_45_minute_travel_gap
          rationale: "That §1.8 boundary_condition instance already tests the half-open interval plus symmetric buffer at 44 minutes (conflict) and exactly 45 minutes (allowed) on both sides of an existing assignment, and confirms that RELEASED rows stop blocking."

      - name: club_visit_capacity_counts_touching_windows_as_overlapping
        claim_type: correct_result
        grounds:
          - calculations.club_visit_capacity
          - validations[priority=43]
        excluded_because:
          difficulty_instance: club_visit_capacity_treats_touching_windows_as_concurrent
          rationale: "That §1.8 boundary_condition instance already contrasts the CLOSED visit interval against the technician's half-open rule, showing that a visit starting exactly when another ends is refused at max_concurrent_visits 1 while a cancelled visit immediately frees the slot."

  - section: validations
    instances:
      - name: visit_creation_walks_seven_rungs_of_the_validation_ladder
        claim_type: priority_ordering
        grounds:
          - validations[priority=19]
          - validations[priority=22]
          - validations[priority=37]
          - validations[priority=39]
          - validations[priority=40]
          - validations[priority=41]
          - validations[priority=42]
        distinguishing_aspect: "One request shape is repaired one rung at a time while every lower rung stays broken, so each response proves which rule won: body FK resolution (19) beats contract state (22), which beats the club mismatch (37), which beats region (39), skill (40), duty status (41) and finally the window rule (42) — and only the eighth attempt is created."
        test_recipe:
          setup:
            - "Clock 2026-08-15T07:00:00Z. Club A is in region NORTH and owns unit eA; club B is in region SOUTH and owns unit eB."
            - "Contract cA covers club A and is left in DRAFT for the first two attempts, then activated."
            - "Technicians: tSouth (region SOUTH, TREADMILL), tNoSkill (region NORTH, skills [BIKE]), tOff (region NORTH, TREADMILL, switched OFF_DUTY) and tOk (region NORTH, TREADMILL, ON_DUTY)."
            - "Every attempt but the last carries the reversed window 09:30 -> 08:00, so validation 42 stays violated throughout."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T07:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_a: "$.data.id" } }
            - { call: "POST /fleetcare/clubs", payload: { name: "Southgate Fitness", region_code: "SOUTH" }, as: ContractAdministrator, captures: { club_b: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_a}", model_id: "${model_id}", serial_number: "SN-LD-A", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { ea_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_b}", model_id: "${model_id}", serial_number: "SN-LD-B", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { eb_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_a}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { ca_id: "$.data.id" } }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Sol Marin", region_code: "SOUTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t_south: "$.data.id" } }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Bo Iversen", region_code: "NORTH", skill_categories: ["BIKE"] }, as: ContractAdministrator, captures: { t_noskill: "$.data.id" } }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Kit Nolan", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t_off: "$.data.id" } }
            - { call: "POST /fleetcare/technicians/${t_off}/duty-status", payload: { duty_status: "OFF_DUTY" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t_ok: "$.data.id" } }
          trigger:
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "00000000-0000-4000-8000-000000000000", equipment_id: "${eb_id}", window_start: "2026-08-15T09:30:00Z", window_end: "2026-08-15T08:00:00Z", technician_id: "${t_south}" }, as: ServiceCoordinator, captures: { e19: "$.data.error_id" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${ca_id}", equipment_id: "${eb_id}", window_start: "2026-08-15T09:30:00Z", window_end: "2026-08-15T08:00:00Z", technician_id: "${t_south}" }, as: ServiceCoordinator, captures: { e22: "$.data.error_id" } }
            - { call: "POST /fleetcare/contracts/${ca_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${ca_id}", equipment_id: "${eb_id}", window_start: "2026-08-15T09:30:00Z", window_end: "2026-08-15T08:00:00Z", technician_id: "${t_south}" }, as: ServiceCoordinator, captures: { e37: "$.data.error_id" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${ca_id}", equipment_id: "${ea_id}", window_start: "2026-08-15T09:30:00Z", window_end: "2026-08-15T08:00:00Z", technician_id: "${t_south}" }, as: ServiceCoordinator, captures: { e39: "$.data.error_id" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${ca_id}", equipment_id: "${ea_id}", window_start: "2026-08-15T09:30:00Z", window_end: "2026-08-15T08:00:00Z", technician_id: "${t_noskill}" }, as: ServiceCoordinator, captures: { e40: "$.data.error_id" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${ca_id}", equipment_id: "${ea_id}", window_start: "2026-08-15T09:30:00Z", window_end: "2026-08-15T08:00:00Z", technician_id: "${t_off}" }, as: ServiceCoordinator, captures: { e41: "$.data.error_id" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${ca_id}", equipment_id: "${ea_id}", window_start: "2026-08-15T09:30:00Z", window_end: "2026-08-15T08:00:00Z", technician_id: "${t_ok}" }, as: ServiceCoordinator, captures: { e42: "$.data.error_id" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${ca_id}", equipment_id: "${ea_id}", window_start: "2026-08-15T08:00:00Z", window_end: "2026-08-15T09:30:00Z", technician_id: "${t_ok}" }, as: ServiceCoordinator, captures: { v_id: "$.data.id", v_status: "$.data.visit_status", v_minutes: "$.data.planned_minutes" } }
          assert:
            - "${e19} == 'ERR_CONTRACT_NOT_FOUND' with HTTP 404 — the body FK is resolved before any business rule"
            - "${e22} == 'ERR_CONTRACT_NOT_ACTIVE' with HTTP 409 while the contract is still DRAFT"
            - "${e37} == 'ERR_EQUIPMENT_CLUB_MISMATCH' with HTTP 422 — club B's unit under club A's contract"
            - "${e39} == 'ERR_TECHNICIAN_REGION_MISMATCH' with HTTP 422"
            - "${e40} == 'ERR_TECHNICIAN_SKILL_MISMATCH' with HTTP 422 (BIKE skills against a TREADMILL unit)"
            - "${e41} == 'ERR_TECHNICIAN_OFF_DUTY' with HTTP 409"
            - "${e42} == 'ERR_VISIT_WINDOW_INVALID' with HTTP 422 — the last rung, reached only once every technician attribute is clean"
            - "${v_status} == 'SCHEDULED' with HTTP 201 and ${v_minutes} == 90"
            - "no PreventiveVisit row and no TechnicianAssignment row was created by any of the seven rejections; Technician.${t_ok}.committed_minutes == 90 only after the successful call"

