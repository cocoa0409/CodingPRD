            - "HTTP status == 409"
            - "${err} == ERR_DUPLICATE_LISTING_APPLICATION"
            - "CertificationListing.${l2}.status == DRAFT"
            - "CertificationListing.${l2}.submitted_by_user_id is null"

      - name: listing_grant_stamps_listed_on_now_and_expires_on_one_listing_term_later
        claim_type: Side Effect Execution
        grounds:
          - state_machines.CertificationListing["UNDER_REVIEW -> LISTED"].side_effects
          - calculations.certification_posture.constants.LISTING_TERM_DAYS
        distinguishing_aspect: "GRANT must stamp listed_on from the logical clock (not the create time of the row) and expires_on exactly LISTING_TERM_DAYS = 365 days later, and must set decided_by_user_id -- so a grant recorded after a clock advance dates from the advanced clock."
        test_recipe:
          setup:
            - "Model and AGENCY_GAMMA listing created at 2026-08-01T00:00:00Z and acknowledged; the clock is then advanced to 2026-09-15T00:00:00Z before the grant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { model_id: $.data.id }
            - call: "POST /certification-listings"
              payload: { equipment_model_id: "${model_id}", agency_code: "AGENCY_GAMMA", scopes: ["SANITATION", "ELECTRICAL"] }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { listing_id: $.data.id }
            - call: "POST /certification-listings/${listing_id}/submissions"
              payload: {}
              as: ComplianceEngineer
              as_user_id: "ce-1"
            - call: "POST /certification-listings/${listing_id}/agency-decisions"
              payload: { decision: "ACKNOWLEDGE_REVIEW" }
              as: ListingReviewer
              as_user_id: "lr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /certification-listings/${listing_id}/agency-decisions"
              payload: { decision: "GRANT" }
              as: ListingReviewer
              as_user_id: "lr-1"
              captures: { st: $.data.status, listed: $.data.listed_on, exp: $.data.expires_on, decider: $.data.decided_by_user_id }
          assert:
            - "HTTP status == 200"
            - "${st} == LISTED"
            - "${listed} == '2026-09-15T00:00:00Z'"
            - "${exp} == '2027-09-15T00:00:00Z'"
            - "${decider} == 'lr-1'"
            - "EquipmentModel.${model_id}.certification_posture == LISTED"

      - name: grant_on_a_submitted_listing_that_was_never_acknowledged_is_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.CertificationListing
          - validations[priority=16]
          - errors[ERR_LISTING_STATE_INVALID]
        distinguishing_aspect: "GRANT, CONDITIONS and REJECT are only defined out of UNDER_REVIEW, so the review acknowledgement cannot be skipped: a GRANT straight out of SUBMITTED must fail with ERR_LISTING_STATE_INVALID (409) and leave listed_on null, even though the acting reviewer satisfies segregation of duties."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ELECTRIC model with an AGENCY_GAMMA listing in SUBMITTED (submitted by ce-1)."
          setup_api_calls:
