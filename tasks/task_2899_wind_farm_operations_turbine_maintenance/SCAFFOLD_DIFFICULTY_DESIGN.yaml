  - rule_id: non_linear_state_machine
    instances:
      - name: turbine_availability_and_curtailment_dimensions_advance_independently
        grounds:
          - state_machines.Turbine.ONLINE_to_FAULTED
          - state_machines.Turbine.UNCONSTRAINED_to_CURTAILED
          - state_machines.Turbine.FAULTED_to_ONLINE
          - state_machines.Turbine.CURTAILED_to_UNCONSTRAINED
          - entities.Turbine.fields.availability_state
          - entities.Turbine.fields.curtailment_state
          - entities.Turbine.fields.effective_power_limit_kw
        distinguishing_aspect: |
          The turbine carries two orthogonal state dimensions; a transition on one dimension never
          writes the other. A fault takes availability_state ONLINE -> FAULTED while
          curtailment_state stays UNCONSTRAINED, an activation then takes curtailment_state
          UNCONSTRAINED -> CURTAILED while availability_state stays FAULTED, and the subsequent
          remote reset returns only the availability dimension, leaving the turbine ONLINE and
          CURTAILED at once - a combined state no single-dimension machine can represent.
        test_recipe:
          setup:
            - "one farm with one ONLINE, UNCONSTRAINED turbine of a model rated 4200 kW"
            - "one RESETTABLE fault code rule FC-1000 with a 2-per-24h reset quota"
            - "the logical clock reads 2026-06-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Mesa Verde", region_code: "NM-E", grid_operator_code: "ERCOT", landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-01", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t1_id: $.data.id }
            - call: "POST /wind-ops/fault-code-rules"
              payload: { fault_code: "FC-1000", severity_class: "RESETTABLE", max_remote_resets_per_24h: 2, requires_dispatch: false, contractual_exclusion: false }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { fcr_id: $.data.id }
          trigger:
            - call: "POST /wind-ops/turbines/${t1_id}/fault-events"
              payload: { fault_code: "FC-1000", raised_at: "2026-06-01T00:00:00Z" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { fe_id: $.data.id }
            - call: "GET /wind-ops/turbines/${t1_id}"
              payload: {}
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { t1_v: $.data.version }
            - call: "POST /wind-ops/turbines/${t1_id}/curtailment-orders"
              payload: { reason: "NOISE", start_utc: "2026-06-01T00:00:00Z", end_utc: "2026-06-02T00:00:00Z", power_limit_kw: 1000, deemed_kwh_per_hour: 0, expected_turbine_version: "${t1_v}" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { co_id: $.data.id }
            - call: "POST /wind-ops/curtailment-orders/${co_id}/activate"
              payload: {}
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "POST /wind-ops/fault-events/${fe_id}/triage"
              payload: { disposition: "REMOTE_RESET" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "POST /wind-ops/fault-events/${fe_id}/remote-reset"
              payload: { reset_outcome: "SUCCEEDED" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
          assert:
            - "immediately after the fault-events call, Turbine.${t1_id}.availability_state == FAULTED and Turbine.${t1_id}.curtailment_state == UNCONSTRAINED"
            - "immediately after the activate call, Turbine.${t1_id}.availability_state == FAULTED and Turbine.${t1_id}.curtailment_state == CURTAILED"
            - "Turbine.${t1_id}.effective_power_limit_kw == 1000 and active_curtailment_count == 1"
            - "after the remote reset, Turbine.${t1_id}.availability_state == ONLINE while Turbine.${t1_id}.curtailment_state is still CURTAILED"
            - "Turbine.${t1_id}.effective_power_limit_kw is still 1000 after the reset, proving the availability transition wrote nothing on the curtailment dimension"
            - "FaultEvent.${fe_id}.triage_state == CLEARED and Turbine.${t1_id}.counted_downtime_hours_period == 0, because the event was never closed"
      - name: work_order_revision_cycle_terminates_at_three_rounds
        grounds:
          - state_machines.WorkOrder.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.WorkOrder.REVISION_REQUESTED_to_SUBMITTED
          - entities.WorkOrder.fields.revision_round
          - validations[priority=76]
          - errors.ERR_REVISION_LIMIT_EXCEEDED
        distinguishing_aspect: |
          SUBMITTED and REVISION_REQUESTED form a genuine cycle the order can traverse repeatedly,
          and the loop is bounded by a counter rather than by the state pair: the third
          request-revision succeeds and leaves revision_round 3, the fourth is refused with
          ERR_REVISION_LIMIT_EXCEEDED while the order remains SUBMITTED and re-submittable.
        test_recipe:
          setup:
            - "one farm with one ONLINE turbine and one SCHEDULED_SERVICE-eligible turbine is not required; a MAJOR_COMPONENT order is used so no service-due gate applies"
            - "one DRAFT MAJOR_COMPONENT work order on that turbine with estimated_hours 8"
            - "the logical clock reads 2026-06-01T00:00:00Z throughout"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Mesa Verde", region_code: "NM-E", grid_operator_code: "ERCOT", landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-01", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t1_id: $.data.id }
            - call: "POST /wind-ops/work-orders"
              payload: { turbine_id: "${t1_id}", work_type: "MAJOR_COMPONENT", required_certification: "CRANE_BANKSMAN", estimated_hours: 8 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /wind-ops/work-orders/${wo_id}/submit"
              payload: {}
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "POST /wind-ops/work-orders/${wo_id}/request-revision"
              payload: { revision_note: "round 1" }
              as: ReliabilityEngineer
              as_user_id: "rel-1"
            - call: "POST /wind-ops/work-orders/${wo_id}/submit"
              payload: {}
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "POST /wind-ops/work-orders/${wo_id}/request-revision"
              payload: { revision_note: "round 2" }
              as: ReliabilityEngineer
              as_user_id: "rel-1"
            - call: "POST /wind-ops/work-orders/${wo_id}/submit"
              payload: {}
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "POST /wind-ops/work-orders/${wo_id}/request-revision"
              payload: { revision_note: "round 3" }
              as: ReliabilityEngineer
              as_user_id: "rel-1"
            - call: "POST /wind-ops/work-orders/${wo_id}/submit"
              payload: {}
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "POST /wind-ops/work-orders/${wo_id}/request-revision"
              payload: { revision_note: "round 4 must be refused" }
              as: ReliabilityEngineer
              as_user_id: "rel-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "the first three request-revision calls each return HTTP 200 and leave state REVISION_REQUESTED"
            - "WorkOrder.${wo_id}.revision_round == 3 after the third request-revision"
            - "the fourth request-revision returns HTTP 422 with ${err_id} == ERR_REVISION_LIMIT_EXCEEDED"
            - "WorkOrder.${wo_id}.state == SUBMITTED and revision_round == 3 after the refusal"
            - "the order is still schedulable, proving the bound blocks only the revision edge and not the cycle's other edge"
      - name: component_replacement_fork_join_executes_with_divergent_ledger_postings
        grounds:
          - state_machines.ComponentReplacement.PLANNED_to_CRANE_RESERVED
          - state_machines.ComponentReplacement.PLANNED_to_UPTOWER_READY
          - state_machines.ComponentReplacement.CRANE_RESERVED_to_EXECUTED
          - state_machines.ComponentReplacement.UPTOWER_READY_to_EXECUTED
          - entities.ComponentReplacement.fields.execution_path
          - calculations.crane_cost_and_allocation
        distinguishing_aspect: |
          PLANNED forks into two mutually exclusive branches that rejoin at the same EXECUTED
          state with DIFFERENT side-effect sets: the CRANE_LIFT branch posts its waterfall share
