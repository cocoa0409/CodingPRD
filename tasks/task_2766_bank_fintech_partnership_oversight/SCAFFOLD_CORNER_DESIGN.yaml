              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_mkt_posture: $.data.error_id }
            - call: "POST /oversight/ledger-entries"
              payload: { partner_id: "${pa_id}", custody_account_id: "${fbo_a_id}", entry_type: "END_USER_CREDIT", amount_cents: 4000000, effective_at: "2026-08-05T00:00:00Z", expected_custody_account_version: "${fbo_a_v}", memo: "inflow is still permitted at RESTRICTED" }
              as: ProgramOfficer
