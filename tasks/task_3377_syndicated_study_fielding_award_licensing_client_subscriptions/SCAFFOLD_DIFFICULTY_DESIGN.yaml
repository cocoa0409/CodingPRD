              captures: { err2: $.data.error_id }
          assert:
            - "First ingest (study DESIGN_LOCKED, frame OPEN) -> err1 == ERR_STUDY_NOT_FIELDING"
            - "Second ingest (study FIELDING, frame CLOSED) -> err2 == ERR_FRAME_NOT_OPEN"
            - "Both attempts are rejections, not REJECTED-status 201s: quality classification never runs when a state gate fails"

  - rule_id: resource_temporal_overlap
    instances:
      - name: award_license_half_open_interval
        grounds:
          - state_machines.License.QUOTED_to_ACTIVE
          - state_machines.License.ACTIVE_to_EXPIRED
          - errors[ERR_LICENSE_CONFLICT]
        distinguishing_aspect: |
          Resource: an Award's licensing occupation. Semantics: HALF-OPEN [activated_at,
          expires_at) — a second activation while the first is ACTIVE conflicts, but an
          activation whose instant equals the predecessor's expires_at is allowed (and the
          EXPIRE transition itself is allowed at exactly expires_at). The subscription
          instance uses the opposite (closed) semantics on a different resource.
        test_recipe:
          setup:
            - "Published study + award + ClientA; L1 DIGITAL/12mo/1 market QUOTED; L2 same award QUOTED"
          setup_api_calls:
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: StudyAdmin }
            - call: "POST /research/studies"
              payload: { code: "VDS-2026", name: "2026 Vehicle Dependability", industry_code: "AUTO", cycle_year: 2026, min_sample_per_brand: 1, significance_alpha: 0.05, embargo_lift_at: "2026-10-15T00:00:00Z" }
              as: StudyAdmin
              captures: { sid: $.data.id, sv: $.data.version }
            - call: "POST /research/methodology-versions"
              payload: { study_id: "${sid}", change_class: "FULL_COMPARABLE", min_duration_seconds: 180, straightline_min_items: 12, pooled_sd_1000: 60, z_value: 1.96, tie_epsilon: 3, factors: [ { code: "QUAL", name: "Quality & Reliability", weight_bp: 6000, ordinal: 1 }, { code: "FEAT", name: "Features & Controls", weight_bp: 4000, ordinal: 2 } ] }
              as: MethodologyLead
              as_user_id: u_ml_001
              captures: { mv: $.data.id }
            - { call: "POST /research/methodology-versions/${mv}/pin", payload: { expected_study_version: "${sv}" }, as: MethodologyLead, as_user_id: u_ml_001 }
            - call: "POST /research/brands"
              payload: { name: "BrandA", industry_code: "AUTO" }
              as: StudyAdmin
              captures: { ba: $.data.id }
            - call: "POST /research/sample-frames"
              payload: { study_id: "${sid}", brand_id: "${ba}", source_type: "PANEL", target_completes: 3 }
              as: FieldOps
              captures: { fa: $.data.id }
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "FIELDING" }, as: StudyAdmin }
            - call: "POST /research/responses"
              payload: { frame_id: "${fa}", respondent_token: "rt-1", duration_seconds: 300, item_count: 15, distinct_values: 4, factor_scores: [ { factor_code: "QUAL", score: 9 }, { factor_code: "FEAT", score: 8 } ] }
              as: FieldOps
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "FIELDING_CLOSED" }, as: StudyAdmin }
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "SCORING" }, as: StudyAdmin }
            - { call: "POST /research/studies/${sid}/scoring/compute", payload: {}, as: AwardsOfficer, as_user_id: u_ao_001 }
            - { call: "POST /research/studies/${sid}/awards/determine", payload: {}, as: AwardsOfficer, as_user_id: u_ao_001 }
            - call: "GET /research/awards"
              payload: { study_id: "${sid}" }
              as: AwardsOfficer
              captures: { aw: "$.data[0].id" }
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: StudyAdmin }
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "PUBLISHED" }, as: StudyAdmin }
            - call: "POST /research/clients"
              payload: { name: "ClientA", client_type: "BRAND", country: "US", brand_id: "${ba}" }
              as: StudyAdmin
              captures: { cl: $.data.id }
            - call: "POST /research/licenses"
              payload: { award_id: "${aw}", client_id: "${cl}", tier: "DIGITAL", term_months: 12, markets_count: 1 }
              as: LicensingManager
              captures: { l1: $.data.id }
            - call: "POST /research/licenses"
              payload: { award_id: "${aw}", client_id: "${cl}", tier: "NATIONAL", term_months: 12, markets_count: 2 }
              as: LicensingManager
              captures: { l2: $.data.id }
          trigger:
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-10-20T00:00:00Z" }, as: StudyAdmin }
            - { call: "POST /research/licenses/${l1}/state", payload: { to_status: "ACTIVE" }, as: LicensingManager }
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: StudyAdmin }
            - call: "POST /research/licenses/${l2}/state"
              payload: { to_status: "ACTIVE" }
              as: LicensingManager
              captures: { err: $.data.error_id }
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2027-10-20T00:00:00Z" }, as: StudyAdmin }
            - { call: "POST /research/licenses/${l1}/state", payload: { to_status: "EXPIRED" }, as: LicensingManager }
            - { call: "POST /research/licenses/${l2}/state", payload: { to_status: "ACTIVE" }, as: LicensingManager }
            - { call: "GET /research/licenses/${l2}", payload: {}, as: LicensingManager }
          assert:
            - "L1 ACTIVE [2026-10-20, 2027-10-20): L2 activation at 2026-11-01 -> err == ERR_LICENSE_CONFLICT"
            - "L1 EXPIRE at clock == expires_at (2027-10-20T00:00:00Z) succeeds — equality is enough for the half-open end"
            - "L2 activation at exactly L1.expires_at succeeds: status ACTIVE, activated_at == 2027-10-20T00:00:00Z, expires_at == 2028-10-20T00:00:00Z — adjacency is NOT a conflict under half-open semantics"

      - name: subscription_closed_interval_touching_conflicts
        grounds:
          - state_machines.Subscription.TRIAL_to_ACTIVE
          - errors[ERR_SUBSCRIPTION_OVERLAP]
        distinguishing_aspect: |
          Resource: the (client, study) subscription coverage. Semantics: CLOSED interval
          [starts_at, ends_at] — a successor whose starts_at EQUALS the predecessor's
          ends_at still conflicts (adjacency counts), unlike the half-open license rule on
          the award resource. Different interval semantics on a different resource entity.
        test_recipe:
          setup:
            - "Bare study (no methodology needed) and ClientA; S1 covers [2026-10-20, 2027-10-19] and is ACTIVE; S2 [2027-10-19, 2028-10-18] TRIAL; S3 [2027-10-20, 2028-10-19] TRIAL"
          setup_api_calls:
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: StudyAdmin }
            - call: "POST /research/studies"
              payload: { code: "VDS-2026", name: "2026 Vehicle Dependability", industry_code: "AUTO", cycle_year: 2026, min_sample_per_brand: 1, significance_alpha: 0.05, embargo_lift_at: "2026-10-15T00:00:00Z" }
              as: StudyAdmin
              captures: { sid: $.data.id }
            - call: "POST /research/clients"
              payload: { name: "ClientA", client_type: "BRAND", country: "US" }
              as: StudyAdmin
              captures: { cl: $.data.id }
            - call: "POST /research/subscriptions"
              payload: { client_id: "${cl}", study_id: "${sid}", tier: "DIAGNOSTIC", starts_at: "2026-10-20T00:00:00Z", ends_at: "2027-10-19T00:00:00Z" }
              as: ClientUser
              as_user_id: "${cl}"
              captures: { s1: $.data.id }
            - call: "POST /research/subscriptions"
              payload: { client_id: "${cl}", study_id: "${sid}", tier: "DIAGNOSTIC", starts_at: "2027-10-19T00:00:00Z", ends_at: "2028-10-18T00:00:00Z" }
              as: ClientUser
              as_user_id: "${cl}"
              captures: { s2: $.data.id }
            - call: "POST /research/subscriptions"
              payload: { client_id: "${cl}", study_id: "${sid}", tier: "BENCHMARK", starts_at: "2027-10-20T00:00:00Z", ends_at: "2028-10-19T00:00:00Z" }
              as: ClientUser
              as_user_id: "${cl}"
              captures: { s3: $.data.id }
          trigger:
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-10-20T00:00:00Z" }, as: StudyAdmin }
            - { call: "POST /research/subscriptions/${s1}/state", payload: { to_status: "ACTIVE" }, as: ClientUser, as_user_id: "${cl}" }
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2027-10-19T00:00:00Z" }, as: StudyAdmin }
            - call: "POST /research/subscriptions/${s2}/state"
              payload: { to_status: "ACTIVE" }
              as: ClientUser
              as_user_id: "${cl}"
              captures: { err: $.data.error_id }
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2027-10-20T00:00:00Z" }, as: StudyAdmin }
            - { call: "POST /research/subscriptions/${s3}/state", payload: { to_status: "ACTIVE" }, as: ClientUser, as_user_id: "${cl}" }
            - { call: "GET /research/subscriptions", payload: { client_id: "${cl}", study_id: "${sid}" }, as: ClientUser, as_user_id: "${cl}" }
          assert:
            - "S1 activation at its starts_at succeeds (window is inclusive at both ends)"
            - "S2 activation -> err == ERR_SUBSCRIPTION_OVERLAP: S2.starts_at == S1.ends_at still intersects the CLOSED interval"
            - "S3 (starts the day after S1.ends_at) activates to ACTIVE — only one day of separation is required under closed semantics"
            - "S2 remains TRIAL (a failed activation changes nothing)"

  - rule_id: compensating_invariant
    instances:
      - name: close_reopen_cycle_conserves_response_totals
        grounds:
          - state_machines.Study.FIELDING_to_FIELDING_CLOSED
          - state_machines.Study.FIELDING_CLOSED_to_FIELDING
          - calculations.accepted_sample_count
        distinguishing_aspect: |
          Conserved quantity: response COUNT partition. The forward action (fielding close,
          which reclassifies a duplicate) paired with its compensating action (fielding
          reopen) leaves count(ACCEPTED) + count(REJECTED) == total ingested (3) at every
          checkpoint, and reopen never resurrects the swept duplicate. The license instance
          conserves a different quantity type (money and term window).
        test_recipe:
          setup:
            - "Same ingest fixture as the dedupe instances: min_sample 3, BrandA frame with rt-1 twice (10/10 earlier, 2/2 later) and rt-2 once (6/6); sweep leaves 2 ACCEPTED + 1 REJECTED — a shortfall (2 < 3) so reopen is legal"
          setup_api_calls:
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: StudyAdmin }
            - call: "POST /research/studies"
              payload: { code: "VDS-2026", name: "2026 Vehicle Dependability", industry_code: "AUTO", cycle_year: 2026, min_sample_per_brand: 3, significance_alpha: 0.05, embargo_lift_at: "2026-10-15T00:00:00Z" }
              as: StudyAdmin
              captures: { sid: $.data.id, sv: $.data.version }
            - call: "POST /research/methodology-versions"
              payload: { study_id: "${sid}", change_class: "FULL_COMPARABLE", min_duration_seconds: 180, straightline_min_items: 12, pooled_sd_1000: 60, z_value: 1.96, tie_epsilon: 3, factors: [ { code: "QUAL", name: "Quality & Reliability", weight_bp: 6000, ordinal: 1 }, { code: "FEAT", name: "Features & Controls", weight_bp: 4000, ordinal: 2 } ] }
              as: MethodologyLead
              as_user_id: u_ml_001
              captures: { mv: $.data.id }
            - { call: "POST /research/methodology-versions/${mv}/pin", payload: { expected_study_version: "${sv}" }, as: MethodologyLead, as_user_id: u_ml_001 }
            - call: "POST /research/brands"
              payload: { name: "BrandA", industry_code: "AUTO" }
              as: StudyAdmin
              captures: { ba: $.data.id }
            - call: "POST /research/sample-frames"
              payload: { study_id: "${sid}", brand_id: "${ba}", source_type: "PANEL", target_completes: 5 }
              as: FieldOps
              captures: { fa: $.data.id }
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "FIELDING" }, as: StudyAdmin }
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: StudyAdmin }
            - call: "POST /research/responses"
              payload: { frame_id: "${fa}", respondent_token: "rt-1", duration_seconds: 300, item_count: 15, distinct_values: 4, factor_scores: [ { factor_code: "QUAL", score: 10 }, { factor_code: "FEAT", score: 10 } ] }
              as: FieldOps
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T00:00:00Z" }, as: StudyAdmin }
            - call: "POST /research/responses"
              payload: { frame_id: "${fa}", respondent_token: "rt-1", duration_seconds: 300, item_count: 15, distinct_values: 4, factor_scores: [ { factor_code: "QUAL", score: 2 }, { factor_code: "FEAT", score: 2 } ] }
              as: FieldOps
              captures: { r_lost: $.data.id }
            - call: "POST /research/responses"
              payload: { frame_id: "${fa}", respondent_token: "rt-2", duration_seconds: 300, item_count: 15, distinct_values: 4, factor_scores: [ { factor_code: "QUAL", score: 6 }, { factor_code: "FEAT", score: 6 } ] }
              as: FieldOps
          trigger:
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "FIELDING_CLOSED" }, as: StudyAdmin }
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "FIELDING" }, as: StudyAdmin }
            - { call: "GET /research/sample-frames/${fa}/responses", payload: {}, as: FieldOps }
            - { call: "GET /research/sample-frames/${fa}/responses", payload: { quality_status: "ACCEPTED" }, as: FieldOps }
            - { call: "GET /research/sample-frames/${fa}/responses", payload: { quality_status: "REJECTED" }, as: FieldOps }
          assert:
            - "After close+reopen: total responses for the frame == 3, ACCEPTED == 2, REJECTED == 1 — 3 == 2 + 1, identical to the pre-close partition"
            - "The REJECTED row is exactly ${r_lost} (the reopen did not resurrect the swept duplicate) and BrandResult(BrandA).accepted_n is still 2"
            - "Study.status == FIELDING and frame ${fa} is OPEN again — the cycle completed without count drift"

      - name: suspend_reinstate_conserves_term_and_fee
        grounds:
          - state_machines.License.ACTIVE_to_SUSPENDED
          - state_machines.License.SUSPENDED_to_ACTIVE
          - entities.License.fields.expires_at
        distinguishing_aspect: |
          Conserved quantities: money and time. SUSPEND paired with REINSTATE returns the
          license to ACTIVE with fee_final_cents, activated_at and expires_at byte-identical
          — suspension never extends the term and never reprices. Only suspension_count
          changes (0 -> 1). Different conserved quantity from the response-count instance.
        test_recipe:
