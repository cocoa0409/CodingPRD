    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ENTRY_NOT_FOUND, ERR_INVALID_ENTRY_STATE]

  - method: POST
    path: /waste-entries/{id}/void
    purpose: Void a mis-captured loss; drives the depth-4 alert/posture cascade and the SUPERSEDED compensation.
    roles: [ShiftLead]
    input: [void_reason]
    output: WasteEntry
    side_effects: ["state_machines.WasteEntry.RECORDED_to_VOIDED / FLAGGED_to_VOIDED — Shift recompute -> INTENSITY_BREACH alerts AUTO_RESOLVED -> Site.open_alert_count / coaching_posture; predecessor SUPERSEDED -> RECORDED when the voided entry was a correction"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_ENTRY_NOT_FOUND, ERR_INVALID_ENTRY_STATE, ERR_SEGREGATION_OF_DUTIES, ERR_ENTRY_ROUTED_CANNOT_VOID]

  - method: POST
    path: /waste-entries/{id}/corrections
    purpose: Supersede a capture with a corrected one under optimistic concurrency control.
    roles: [ShiftLead]
    input: [expected_entry_version, correction_note, "weight_grams?", "food_type_id?", "loss_reason?", "recipe_id?"]
    output: WasteEntry
    side_effects: ["state_machines.WasteEntry.RECORDED_to_SUPERSEDED / FLAGGED_to_SUPERSEDED; returns the NEWLY created correcting entry (status RECORDED, corrects_entry_id set)"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_ENTRY_NOT_FOUND, ERR_FOOD_TYPE_NOT_FOUND, ERR_RECIPE_NOT_FOUND, ERR_STALE_ENTRY_VERSION, ERR_INVALID_ENTRY_STATE, ERR_INVALID_SHIFT_STATE, ERR_ENTRY_ROUTED_CANNOT_VOID, ERR_ENTRY_ALREADY_CORRECTED, ERR_RECIPE_NOT_PUBLISHED, ERR_LOSS_REASON_STATION_MISMATCH]

  - method: GET
    path: /waste-entries/{id}
    purpose: Read one capture with both valuations and its routed/unrouted split.
    roles: [KitchenStaff, ShiftLead, SiteSustainabilityManager, CorporateSustainabilityLead, PlatformAdmin]
    input: []
    output: WasteEntry
