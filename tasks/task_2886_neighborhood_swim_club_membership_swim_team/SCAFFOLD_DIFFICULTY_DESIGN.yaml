  # ===========================================================================
  # Rule 9 - compensating invariants over different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: guest_pass_conservation_under_visit_void
        grounds:
          - state_machines[GuestVisit].RECORDED_to_VOIDED
          - entities.Household.fields.guest_pass_allotment_granted
          - entities.Household.fields.guest_passes_consumed
          - entities.Household.fields.guest_pass_balance
          - calculations.guest_visit_settlement
          - concurrency_rules[guest-visit-record-stale-household]
          - endpoints[POST /swim-club/guest-visits/{id}/void]
        distinguishing_aspect: |
          The conserved quantity is a NON-MONETARY entitlement count:
          guest_pass_balance + guest_passes_consumed == guest_pass_allotment_granted must hold
          before the visit, after the visit and after the void, while
          guest_pass_allotment_granted itself never moves. The void is a true compensating action:
          it returns exactly visit.passes_used passes and exactly visit.fee_charged_cents of debt,
          so the household ends bit-identical to its pre-visit ledger. The companion instance
          capital_reserve_identity_under_fund_then_cancel conserves a MONETARY two-sided identity
          on a different aggregate, where the append-only side deliberately does NOT return to its
          pre-operation value.
        test_recipe:
          setup:
            - "One FAMILY category with guest_pass_allotment 4."
            - "One OPEN 2027 season with guest_settlement_policy PASS_FIRST."
            - "One household whose single Membership grants exactly 4 passes at creation, then invoiced so access_status is ACTIVE: guest_pass_allotment_granted 4, guest_passes_consumed 0, guest_pass_balance 4, guest_fee_owed_cents 0."
            - "The logical clock sits at 2027-07-20T12:00:00Z, after the visit instant, so the visit is not recorded in the future."
            - "The household's version is read immediately before the write, so the OCC guard carries the live value rather than a guessed one."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-20T12:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "FAMILY", label: "Family", bond_cents: 120000, initiation_fee_cents: 45000, seasonal_dues_cents: 78000, guest_pass_allotment: 4, max_household_size: 6, volunteer_credits_required: 4, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_family_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120, proration_basis: "CALENDAR_DAY", guest_settlement_policy: "PASS_FIRST" }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Alvarez Household", address_line: "14 Poolside Lane", residency: "IN_DISTRICT", member_count: 4, prior_member: false }
              as: MembershipChair
              captures: { h_a_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_a_id}", membership_category_id: "${cat_family_id}", season_id: "${s27_id}", join_date: "2027-07-05", bond_payment_plan: "INSTALLMENTS" }
              as: MembershipChair
              captures: { m_a_id: $.data.id }
            - call: "POST /swim-club/memberships/${m_a_id}/invoice"
              payload: {}
              as: Treasurer
            - call: "GET /swim-club/households/${h_a_id}"
              payload: {}
              as: PoolManager
              captures: { h_v_0: $.data.version, granted_0: $.data.guest_pass_allotment_granted, bal_0: $.data.guest_pass_balance, used_0: $.data.guest_passes_consumed, owed_0: $.data.guest_fee_owed_cents }
          trigger:
            - call: "POST /swim-club/guest-visits"
              payload: { membership_id: "${m_a_id}", sponsor_name: "Rosa Alvarez", guest_count: 6, visit_start_iso: "2027-07-20T11:00:00Z", expected_household_version: "${h_v_0}" }
              as: PoolManager
              captures: { v_id: $.data.id, v_passes: $.data.passes_used, v_fee: $.data.fee_charged_cents, v_weekend: $.data.is_weekend }
            - call: "GET /swim-club/households/${h_a_id}"
              payload: {}
              as: PoolManager
              captures: { h_v_1: $.data.version, granted_1: $.data.guest_pass_allotment_granted, bal_1: $.data.guest_pass_balance, used_1: $.data.guest_passes_consumed, owed_1: $.data.guest_fee_owed_cents }
            - call: "POST /swim-club/guest-visits/${v_id}/void"
              payload: { reason: "Gate double-scanned the same party; duplicate entry removed" }
              as: PoolManager
              captures: { v_status_2: $.data.status, v_voided_at: $.data.voided_at, v_passes_2: $.data.passes_used, v_fee_2: $.data.fee_charged_cents }
            - call: "GET /swim-club/households/${h_a_id}"
              payload: {}
              as: PoolManager
              captures: { h_v_2: $.data.version, granted_2: $.data.guest_pass_allotment_granted, bal_2: $.data.guest_pass_balance, used_2: $.data.guest_passes_consumed, owed_2: $.data.guest_fee_owed_cents }
          assert:
            - "state 0: granted 4, balance 4, consumed 0, guest_fee_owed_cents 0, and the invariant balance + consumed == granted holds (4 + 0 == 4)"
            - "the visit is a Tuesday (2027-07-20), so is_weekend == false and PASS_FIRST charges GUEST_FEE_WEEKDAY_CENTS: passes_used == 4 (min(4, 6)) and fee_charged_cents == 1000 (2 remaining guests * 500)"
            - "state 1: granted 4 (UNCHANGED), balance 0, consumed 4, guest_fee_owed_cents 1000, and the invariant still holds (0 + 4 == 4)"
            - "state 2 (after the void): GuestVisit.${v_id}.status == VOIDED, voided_at == 2027-07-20T12:00:00Z, and passes_used and fee_charged_cents are NOT zeroed on the visit row - they are the compensation amounts"
            - "state 2: granted 4 (still UNCHANGED), balance 4, consumed 0, guest_fee_owed_cents 0, and the invariant holds again (4 + 0 == 4)"
            - "the household ledger is bit-identical to state 0 on all four counters, so the void drifted nothing"
            - "Household.${h_a_id}.version strictly increased at each of the two writes, so the compensation is not implemented as a rollback of history"
            - "the household is once again eligible under priority 80 (guest_fee_owed_cents + party_charges_owed_cents == 0), which a lossy void would have left blocked"

      - name: capital_reserve_identity_under_fund_then_cancel
        grounds:
          - calculations.capital_reserve_position
          - state_machines[CapitalProject].APPROVED_to_FUNDED
          - state_machines[CapitalProject].FUNDED_to_CANCELLED
          - concurrency_rules[capital-project-fund-stale-project]
          - validations[priority=5]
          - endpoints[POST /swim-club/seasons/{id}/reserve-contributions]
          - endpoints[POST /swim-club/capital-projects/{id}/fund]
        distinguishing_aspect: |
          The conserved quantity is a MONETARY TWO-SIDED identity spanning two aggregates:
          season.reserve_unallocated_cents + sum(funded_cents over FUNDED/IN_PROGRESS/COMPLETED
          projects) == season.reserve_contributions_cents. Its character is the opposite of the
          guest-pass invariant: the contributions side is APPEND-ONLY and deliberately does NOT
          move under either the draw or the compensation, so the identity is restored by moving
          money back across the split rather than by restoring every field to its prior value.
          The compensation is also performed by a different role than the draw (BoardPresident
          cancels what the Treasurer funded), which the guest-pass instance does not exercise.
        test_recipe:
          setup:
            - "One OPEN 2027 season whose reserve counters both start at 0."
            - "A single manual reserve contribution of 200000 cents raises BOTH sides of the identity to 200000, giving a reserve position with nothing allocated."
            - "One CapitalProject of kind POOL_RESURFACING with budget_cents 180000, proposed by Treasurer user tr-001 and APPROVED by BoardPresident user bp-001, which satisfies the two-person control at priority 5."
            - "The project's version is read immediately before the draw so the OCC guard expected_capital_project_version carries the live value."
            - "The draw of 150000 is within both fiscal gates: 150000 <= reserve_unallocated_cents 200000 (priority 83) and 0 + 150000 <= budget_cents 180000 (priority 84)."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-06T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120, proration_basis: "CALENDAR_DAY", guest_settlement_policy: "PASS_FIRST" }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/seasons/${s27_id}/reserve-contributions"
              payload: { amount_cents: 200000, note: "Special assessment for the 2028 resurfacing programme" }
              as: Treasurer
              captures: { contrib_0: $.data.reserve_contributions_cents, unalloc_0: $.data.reserve_unallocated_cents }
            - call: "POST /swim-club/capital-projects"
              payload: { funding_season_id: "${s27_id}", project_kind: "POOL_RESURFACING", title: "Main tank plaster and tile", budget_cents: 180000 }
              as: Treasurer
              as_user_id: "tr-001"
              captures: { proj_id: $.data.id, proj_status_0: $.data.status, proj_funded_0: $.data.funded_cents, proj_requested_by: $.data.requested_by_user_id }
            - call: "POST /swim-club/capital-projects/${proj_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: BoardPresident
              as_user_id: "bp-001"
              captures: { proj_status_1: $.data.status, proj_approved_by: $.data.approved_by_user_id }
            - call: "GET /swim-club/capital-projects/${proj_id}"
              payload: {}
              as: Treasurer
              captures: { proj_v_1: $.data.version }
          trigger:
            - call: "POST /swim-club/capital-projects/${proj_id}/fund"
              payload: { draw_amount_cents: 150000, expected_capital_project_version: "${proj_v_1}" }
              as: Treasurer
              as_user_id: "tr-001"
              captures: { proj_status_2: $.data.status, proj_funded_2: $.data.funded_cents }
            - call: "GET /swim-club/seasons/${s27_id}"
              payload: {}
              as: Treasurer
              captures: { contrib_2: $.data.reserve_contributions_cents, unalloc_2: $.data.reserve_unallocated_cents }
            - call: "POST /swim-club/capital-projects/${proj_id}/transitions"
              payload: { to_status: "CANCELLED" }
              as: BoardPresident
              as_user_id: "bp-001"
              captures: { proj_status_3: $.data.status, proj_funded_3: $.data.funded_cents }
            - call: "GET /swim-club/seasons/${s27_id}"
              payload: {}
              as: Treasurer
              captures: { contrib_3: $.data.reserve_contributions_cents, unalloc_3: $.data.reserve_unallocated_cents }
          assert:
            - "state 0: reserve_contributions_cents == 200000, reserve_unallocated_cents == 200000, project funded_cents == 0; identity 200000 + 0 == 200000"
            - "the project is PROPOSED with requested_by_user_id \"tr-001\" and moves to APPROVED with approved_by_user_id \"bp-001\", two different users"
            - "state 2 (after the draw): CapitalProject.${proj_id}.status == FUNDED and funded_cents == 150000"
            - "state 2: reserve_unallocated_cents == 50000 and reserve_contributions_cents == 200000 (UNCHANGED - the append-only side never moves on a draw); identity 50000 + 150000 == 200000"
            - "state 3 (after the cancellation): CapitalProject.${proj_id}.status == CANCELLED and funded_cents == 0"
            - "state 3: reserve_unallocated_cents == 200000 and reserve_contributions_cents == 200000 (still UNCHANGED, not decremented back); identity 200000 + 0 == 200000"
            - "the CANCELLED project contributes nothing to the allocated side, both because its status is outside {FUNDED, IN_PROGRESS, COMPLETED} and because its funded_cents was zeroed - the two exclusions agree, so no double-subtraction occurs"
            - "reserve_contributions_cents was 200000 at all four observations, proving the compensation restored the identity WITHOUT rewinding the append-only counter"
            - "Season.${s27_id}.version and CapitalProject.${proj_id}.version both increased on the draw and again on the cancellation"
