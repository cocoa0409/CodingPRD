# =============================================================================
# Task 1215: Maple Sugarbush & Syrup Production (Vermont sugarhouse)
# Seed tables (scaffold) — §1.0–§1.7. Difficulty: beyond Expert band (§0.4):
# density via dual-variant yield/royalty math, 3+-entity cascade chains,
# priority-pinned validation conflicts, sibling-state-gated transitions,
# exact boundaries (66.0 Brix / 75.0% transmittance / zero-gap windows),
# OCC, and season/weather-window/seasonal-labor time mechanics.
# =============================================================================

scenario: |
  1215. Maple Sugarbush & Syrup Production (Vermont sugarhouse): tap count &
  vacuum line monitoring, sap flow by weather window & collection scheduling,
  sugar content & boil-off yield calculation, grade classification & flavor
  evaluation, bulk drum vs retail packaging, certification (organic) & woods
  audit, lease agreements for tapping others' land, seasonal labor & short
  production window

domain_name: maple-sugarbush-syrup
api_prefix: /sugarhouse

complexity_profile:
  primary_archetype: temporal_windowing        # weather windows + short production season gate all collection
  secondary_archetype: ledger_reconciliation   # provisional (Rule of 86) vs final (Rule of 88.2 / measured) yield & royalty settlement
  complexity_layers:
    - optimistic_concurrency      # OCC on Season.version (window declaration) and Lease.version (amendment)
    - cascading_side_effects      # vacuum reading -> line -> bush -> season aggregates; lease terminate -> bush -> lines -> season
    - dual_variant_calculation    # Rule-of-86 estimate vs Rule-of-88.2 expectation; provisional vs final royalty
    - derived_field_reconciliation # taps_set/taps_live, gallons_remaining, unpackaged_gallons, season aggregates
    - ops_run_checkpoint          # run-sweep closes expired windows, expires leases, releases nothing else
    - rate_threshold_triggers     # vacuum hysteresis, variance auto-hold, freeze-thaw eligibility
    - version_pinning_on_approval # lease taps_snapshot frozen at activation
  entity_topology: flat                       # peer entities with FK references; many-to-many via BatchIntake junction
  state_machine_shape: cyclic                 # Season OPEN<->SUSPENDED, TapLine ACTIVE<->LEAK, SyrupLot GRADED<->HELD, Lease DRAFT<->PENDING_AUDIT
  relationship_patterns: [one_to_many, many_to_many, cross_aggregate]
  role_model: segregation_of_duties           # batch boiler cannot grade its own syrup lot
  consistency_model: immediate                # every side effect visible in the same request's response

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Season
    parent: null
    common_fields: true
    fields:
      - { name: year, type: integer, source: input, description: "Sugar season year (e.g. 2027)" }
      - { name: opens_on, type: string, source: input, description: "First calendar date (YYYY-MM-DD) the season may open" }
      - { name: closes_on, type: string, source: input, description: "Last calendar date (YYYY-MM-DD) of the production window" }
      - { name: planned_taps, type: integer, source: input, description: "Planned tap count for the season (>0)" }
      - { name: status, type: enum, source: system, description: "PLANNED | OPEN | SUSPENDED | CLOSED | RECONCILED" }
      - { name: taps_live, type: integer, source: computed, default: 0, description: "Sum of taps_live over all non-SHUTDOWN Sugarbushes of this season" }
      - { name: total_sap_gallons, type: number, source: computed, default: 0, description: "Sum of gallons_collected over SapRuns of this season with status CONFIRMED" }
      - { name: total_syrup_gallons, type: number, source: computed, default: 0, description: "Sum of measured_syrup_gallons over EvaporatorBatches of this season with status FINISHED" }

  - name: Sugarbush
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id; the season this woods lot is worked in" }
      - { name: name, type: string, source: input, description: "Sugarbush name" }
      - { name: tap_capacity, type: integer, source: input, description: "Maximum taps the lot supports (>0)" }
      - { name: stand_type, type: enum, source: computed, default: "OWNED", description: "OWNED | LEASED — LEASED iff active_lease_id is non-null" }
      - { name: active_lease_id, type: string, source: system, description: "FK -> Lease.id; set at lease activation, never cleared (history preserved); null when owned" , constraints: "nullable" }
      - { name: organic_certified, type: boolean, source: computed, default: false, description: "True iff the latest RECORDED ORGANIC CertAudit (by scheduled_for, tie-break created_at) on this bush has result PASS; false when none" }
      - { name: taps_set, type: integer, source: computed, default: 0, description: "Sum of tap_count over TapLines of this bush with status IN {ACTIVE, LEAK}" }
      - { name: taps_live, type: integer, source: computed, default: 0, description: "Sum of tap_count over TapLines of this bush with status ACTIVE" }
      - { name: status, type: enum, source: system, description: "PREP | TAPPING | LIVE | SHUTDOWN" }

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - { name: sugarbush_id, type: string, source: input, description: "FK -> Sugarbush.id; the parcel being leased" }
      - { name: landowner_name, type: string, source: input, description: "Counterparty landowner name" }
      - { name: royalty_basis, type: enum, source: input, description: "PER_TAP | SHARE_OF_SYRUP" }
      - { name: per_tap_cents, type: integer, source: input, description: "Required iff royalty_basis=PER_TAP (>0); null otherwise", constraints: "nullable" }
      - { name: share_pct, type: number, source: input, description: "Required iff royalty_basis=SHARE_OF_SYRUP (0 < share_pct <= 50); null otherwise", constraints: "nullable" }
      - { name: certified_organic_required, type: boolean, source: input, default: false, description: "When true, activation requires latest ORGANIC audit PASS" }
      - { name: term_start, type: string, source: input, description: "Lease term start date (YYYY-MM-DD)" }
      - { name: term_end, type: string, source: input, description: "Lease term end date (YYYY-MM-DD), after term_start" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_AUDIT | ACTIVE | TERMINATED | EXPIRED" }
      - { name: taps_snapshot, type: integer, source: system, description: "Sugarbush.taps_set frozen at activation (version-pinned at approval); null until ACTIVE", constraints: "nullable" }
      - { name: accrued_royalty_cents, type: integer, source: computed, default: 0, description: "PER_TAP: taps_snapshot * per_tap_cents, set at activation" }
      - { name: accrued_royalty_gallons, type: number, source: computed, default: 0, description: "SHARE_OF_SYRUP provisional accrual: sum of per-batch rounded royalty gallons (see lease_royalty_accrual)" }
      - { name: settled_royalty_gallons, type: number, source: computed, description: "SHARE_OF_SYRUP final settlement computed at season reconcile (single-round); null until RECONCILED", constraints: "nullable" }

  - name: TapLine
    parent: null
    common_fields: true
    fields:
      - { name: sugarbush_id, type: string, source: input, description: "FK -> Sugarbush.id" }
      - { name: line_code, type: string, source: input, description: "Operator line code (e.g. MAIN-North)" }
      - { name: tap_count, type: integer, source: input, description: "Taps on this line (>0)" }
      - { name: vacuum_target_inhg, type: number, source: input, description: "Target vacuum in inches Hg (>0)" }
      - { name: latest_vacuum_inhg, type: number, source: system, description: "Most recent VacuumReading.inhg (by recorded_at, tie-break created_at); null until first reading", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "INSTALLING | ACTIVE | LEAK | PULLED" }

  - name: VacuumReading
    parent: null
    common_fields: false
    fields:
      - { name: tap_line_id, type: string, source: system, description: "FK -> TapLine.id (from path)" }
      - { name: inhg, type: number, source: input, description: "Observed vacuum, inches Hg (>= 0)" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical clock timestamp at recording" }

  - name: WeatherWindow
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: opens_at, type: datetime, source: input, description: "Window open instant (inclusive); half-open interval [opens_at, closes_at)" }
      - { name: closes_at, type: datetime, source: input, description: "Window close instant (exclusive); must be after opens_at" }
      - { name: forecast_min_f, type: number, source: input, description: "Forecast overnight low (F); must be <= 32.0 for freeze-thaw" }
      - { name: forecast_max_f, type: number, source: input, description: "Forecast daytime high (F); must be >= 38.0 for freeze-thaw" }
      - { name: status, type: enum, source: system, description: "FORECAST | OPEN | CLOSED" }

  - name: CrewMember
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id; seasonal labor is hired per season" }
      - { name: name, type: string, source: input, description: "Worker name" }
      - { name: crew_role, type: enum, source: input, description: "TAPPER | BOILER | GRADER" }
      - { name: cert_organic_handler, type: boolean, source: input, default: false, description: "Organic-handler certification" }
      - { name: status, type: enum, source: system, description: "HIRED | ACTIVE | RELEASED" }

  - name: SapRun
    parent: null
    common_fields: true
    fields:
      - { name: sugarbush_id, type: string, source: input, description: "FK -> Sugarbush.id" }
      - { name: weather_window_id, type: string, source: input, description: "FK -> WeatherWindow.id" }
      - { name: collected_by, type: string, source: input, description: "FK -> CrewMember.id; must be an ACTIVE crew member" }
      - { name: gallons_collected, type: number, source: input, description: "Raw sap gallons collected (>0)" }
      - { name: measured_brix, type: number, source: input, description: "Field hydrometer sugar content, 0.5–40.0 °Bx" }
      - { name: collected_at, type: datetime, source: system, description: "Logical clock timestamp at creation" }
      - { name: gallons_remaining, type: number, source: computed, description: "= gallons_collected - sum of gallons_drawn over BatchIntakes of this run whose batch status IN {FILLING, BOILING, FINISHED}" }
      - { name: status, type: enum, source: system, description: "DRAFT | CONFIRMED | VOIDED" }

  - name: EvaporatorBatch
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: boiled_by, type: string, source: input, description: "FK -> CrewMember.id; must be an ACTIVE CrewMember (any crew_role)" }
      - { name: evaporator_capacity_gal, type: integer, source: input, description: "Evaporator pan capacity in gallons (>0)" }
      - { name: sap_gallons_in, type: number, source: computed, default: 0, description: "Sum of gallons_drawn over this batch's BatchIntakes" }
      - { name: input_brix, type: number, source: computed, description: "Deterioration-adjusted volume-weighted brix, computed at start-boil (see weighted_input_brix); null until BOILING", constraints: "nullable" }
      - { name: estimated_syrup_gallons, type: number, source: computed, description: "Rule-of-86 estimate at start-boil; null until BOILING", constraints: "nullable" }
      - { name: expected_syrup_gallons, type: number, source: computed, description: "Rule-of-88.2 expectation at start-boil; null until BOILING", constraints: "nullable" }
      - { name: boil_started_at, type: datetime, source: system, description: "Logical clock at start-boil; null until BOILING", constraints: "nullable" }
      - { name: finished_brix, type: number, source: input, description: "Syrup density at draw-off, supplied at finish; must be >= 66.0" , constraints: "nullable" }
      - { name: measured_syrup_gallons, type: number, source: input, description: "Actual syrup drawn off, supplied at finish (>0)", constraints: "nullable" }
      - { name: yield_variance_pct, type: number, source: computed, description: "round((measured - expected)/expected*100, 2) at finish; null until FINISHED", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "FILLING | BOILING | FINISHED | CANCELLED" }

  - name: BatchIntake
    parent: null
    common_fields: false
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> EvaporatorBatch.id (from path)" }
      - { name: sap_run_id, type: string, source: input, description: "FK -> SapRun.id being drawn from" }
      - { name: gallons_drawn, type: number, source: input, description: "Gallons drawn (>0, <= run.gallons_remaining); server-computed per draw for auto-fill" }
      - { name: draw_sequence, type: integer, source: system, description: "Per-batch monotone draw order assigned at creation" }
      - { name: effective_brix, type: number, source: system, description: "Deterioration-adjusted brix stamped at start-boil; null until batch BOILING", constraints: "nullable" }

  - name: SyrupLot
    parent: null
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> EvaporatorBatch.id; 1:1, created at batch finish" }
      - { name: season_id, type: string, source: system, description: "FK -> Season.id; denormalized from the batch" }
      - { name: measured_gallons, type: number, source: system, description: "Syrup gallons in the lot (= batch.measured_syrup_gallons)" }
      - { name: finished_brix, type: number, source: system, description: "Syrup density (= batch.finished_brix)" }
      - { name: light_transmittance_pct, type: number, source: input, description: "Optical grade reading supplied at grade (0–100)" , constraints: "nullable" }
      - { name: grade, type: enum, source: computed, description: "GOLDEN | AMBER | DARK | VERY_DARK | PROCESSING; null until GRADED", constraints: "nullable" }
      - { name: unpackaged_gallons, type: number, source: computed, description: "= measured_gallons - sum(units_filled * CONTAINER_GALLONS) over PackagingRuns with status FILLED" }
      - { name: quality_hold_auto, type: boolean, source: system, default: false, description: "True when |yield_variance_pct| >= 15.0 forced the lot into HELD at creation" }
      - { name: status, type: enum, source: system, description: "UNGRADED | GRADED | HELD | CONDEMNED | EXHAUSTED" }

  - name: FlavorEvaluation
    parent: null
    common_fields: false
    fields:
      - { name: syrup_lot_id, type: string, source: system, description: "FK -> SyrupLot.id (from path)" }
      - { name: evaluator_id, type: string, source: input, description: "FK -> CrewMember.id; ACTIVE crew with crew_role GRADER; must differ from the lot's batch.boiled_by" }
      - { name: flavor_score, type: integer, source: input, description: "0–100 flavor score; < 70 forces PROCESSING grade" }
      - { name: defect_flags, type: array, source: input, default: [], description: "Off-flavor defect codes (e.g. BUDDY, SOUR); non-empty forces PROCESSING" }
      - { name: evaluated_at, type: datetime, source: system, description: "Logical clock at evaluation" }

  - name: PackagingRun
    parent: null
    common_fields: true
    fields:
      - { name: syrup_lot_id, type: string, source: input, description: "FK -> SyrupLot.id" }
      - { name: container_type, type: enum, source: input, description: "DRUM_55 (55.0 gal) | RETAIL_QUART (0.25 gal) | RETAIL_PINT (0.125 gal)" }
      - { name: units_planned, type: integer, source: input, description: "Containers to fill (>0); no reservation at plan time" }
      - { name: units_filled, type: integer, source: system, description: "Containers actually filled (= units_planned at fill); null until FILLED", constraints: "nullable" }
      - { name: filled_gallons, type: number, source: computed, description: "units_filled * CONTAINER_GALLONS[container_type]; null until FILLED", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "PLANNED | FILLED | CANCELLED" }

  - name: CertAudit
    parent: null
    common_fields: true
    fields:
      - { name: sugarbush_id, type: string, source: system, description: "FK -> Sugarbush.id (from path)" }
      - { name: audit_type, type: enum, source: input, description: "ORGANIC | WOODS" }
      - { name: scheduled_for, type: string, source: input, description: "Audit date (YYYY-MM-DD); must be >= 14 days from any other audit on this bush" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL, supplied at record-result; null until RECORDED", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | RECORDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Season
    initial_state: PLANNED
    terminal_states: [RECONCILED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /sugarhouse/seasons/{id}/open"
        actor: SugarhouseManager
        preconditions:
          - "logical clock date within [opens_on, closes_on] (ERR_OUTSIDE_PRODUCTION_WINDOW)"
          - "no other Season with status OPEN or SUSPENDED (ERR_SEASON_ALREADY_ACTIVE)"
        side_effects: ["increments Season.version by 1"]
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /sugarhouse/seasons/{id}/suspend"
        actor: SugarhouseManager
        preconditions: []
        side_effects: ["blocks SapRun creation and WeatherWindow opening while SUSPENDED", "increments Season.version by 1"]
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /sugarhouse/seasons/{id}/resume"
        actor: SugarhouseManager
        preconditions: ["logical clock date within [opens_on, closes_on] (ERR_OUTSIDE_PRODUCTION_WINDOW)"]
        side_effects: ["increments Season.version by 1"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /sugarhouse/seasons/{id}/close"
        actor: SugarhouseManager
        preconditions:
          - "no EvaporatorBatch of this season with status FILLING or BOILING (ERR_SEASON_HAS_OPEN_BATCHES)"
        side_effects:
          - "HOP1: every CrewMember of this season with status ACTIVE -> RELEASED"
          - "HOP1: every WeatherWindow of this season with status FORECAST or OPEN -> CLOSED"
          - "HOP1: every SapRun of this season with status DRAFT -> VOIDED"
          - "increments Season.version by 1"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /sugarhouse/seasons/{id}/close"
        actor: SugarhouseManager
        preconditions:
          - "no EvaporatorBatch of this season with status FILLING or BOILING (ERR_SEASON_HAS_OPEN_BATCHES)"
        side_effects:
          - "HOP1: every CrewMember of this season with status ACTIVE -> RELEASED"
          - "HOP1: every WeatherWindow of this season with status FORECAST or OPEN -> CLOSED"
          - "HOP1: every SapRun of this season with status DRAFT -> VOIDED"
          - "increments Season.version by 1"
      - from: CLOSED
        to: RECONCILED
        trigger: "POST /sugarhouse/seasons/{id}/reconcile"
        actor: SugarhouseManager
        preconditions:
          - "no SyrupLot of this season with status UNGRADED or HELD (ERR_RECONCILE_BLOCKED)"
          - "no PackagingRun of lots of this season with status PLANNED (ERR_RECONCILE_BLOCKED)"
        side_effects:
          - "runs lease_royalty_accrual final variant: for each Lease with status ACTIVE or TERMINATED or EXPIRED on a Sugarbush of this season and royalty_basis SHARE_OF_SYRUP, sets settled_royalty_gallons"
          - "increments Season.version by 1"

  - entity: Sugarbush
    initial_state: PREP
    terminal_states: [SHUTDOWN]
    transitions:
      - from: PREP
        to: TAPPING
        trigger: "POST /sugarhouse/sugarbushes/{id}/begin-tapping"
        actor: SugarhouseManager
        preconditions:
          - "Season.status == OPEN (ERR_SEASON_NOT_OPEN; ERR_SEASON_SUSPENDED when SUSPENDED)"
          - "if active_lease_id non-null, that Lease.status == ACTIVE (ERR_LEASE_NOT_ACTIVE)"
        side_effects: ["increments Sugarbush.version by 1"]
      - from: TAPPING
        to: LIVE
        trigger: "POST /sugarhouse/sugarbushes/{id}/go-live"
        actor: SugarhouseManager
        preconditions:
          - "at least 1 TapLine of this bush with status != PULLED AND every non-PULLED TapLine has status ACTIVE (ERR_TAP_LINES_NOT_READY)"
          - "if active_lease_id non-null, that Lease.status == ACTIVE (ERR_LEASE_NOT_ACTIVE)"
        side_effects: ["increments Sugarbush.version by 1"]
      - from: LIVE
        to: TAPPING
        trigger: "system (automatic when taps_live recomputes to 0 while LIVE, e.g. leak cascade or line pull)"
        actor: system
        preconditions: ["taps_live == 0"]
        side_effects: ["increments Sugarbush.version by 1", "Season.taps_live recomputed"]
        note: "no automatic re-LIVE: requires explicit go-live after lines recover"
      - from: TAPPING
        to: SHUTDOWN
        trigger: "POST /sugarhouse/sugarbushes/{id}/shutdown"
        actor: SugarhouseManager
        preconditions: []
        side_effects:
          - "HOP1: every TapLine of this bush with status INSTALLING, ACTIVE or LEAK -> PULLED"
          - "HOP2: each line pull recomputes taps_set/taps_live on this bush and Season.taps_live"
          - "increments Sugarbush.version by 1"
      - from: LIVE
        to: SHUTDOWN
        trigger: "POST /sugarhouse/sugarbushes/{id}/shutdown"
        actor: SugarhouseManager
        preconditions: []
        side_effects:
          - "HOP1: every TapLine of this bush with status INSTALLING, ACTIVE or LEAK -> PULLED"
          - "HOP2: each line pull recomputes taps_set/taps_live on this bush and Season.taps_live"
          - "increments Sugarbush.version by 1"
      - from: TAPPING
        to: SHUTDOWN
        trigger: "system (lease terminate / lease expiry cascade from POST /sugarhouse/leases/{id}/terminate or run-sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "HOP1: every TapLine of this bush with status INSTALLING, ACTIVE or LEAK -> PULLED"
          - "HOP2: taps_set/taps_live and Season.taps_live recomputed"
      - from: LIVE
        to: SHUTDOWN
        trigger: "system (lease terminate / lease expiry cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "HOP1: every TapLine of this bush with status INSTALLING, ACTIVE or LEAK -> PULLED"
          - "HOP2: taps_set/taps_live and Season.taps_live recomputed"

  - entity: TapLine
    initial_state: INSTALLING
    terminal_states: [PULLED]
    transitions:
      - from: INSTALLING
        to: ACTIVE
        trigger: "POST /sugarhouse/tap-lines/{id}/activate"
        actor: SugarhouseManager
        preconditions: ["Sugarbush.status IN {TAPPING, LIVE} (ERR_INVALID_STATE)"]
        side_effects: ["recompute Sugarbush.taps_set/taps_live", "recompute Season.taps_live", "increments TapLine.version by 1"]
      - from: ACTIVE
        to: LEAK
        trigger: "system (automatic on POST /sugarhouse/tap-lines/{id}/vacuum-readings when inhg < vacuum_target_inhg - 2.0)"
        actor: system
        preconditions: ["inhg < vacuum_target_inhg - 2.0 (strictly below; exactly at threshold does NOT leak)"]
        side_effects:
          - "HOP1: TapLine.latest_vacuum_inhg updated, status -> LEAK"
          - "HOP2: Sugarbush.taps_set/taps_live recomputed (taps_live drops by this line's tap_count)"
          - "HOP3: if Sugarbush.status == LIVE and taps_live == 0, Sugarbush auto -> TAPPING"
          - "HOP4: Season.taps_live recomputed"
      - from: LEAK
        to: ACTIVE
        trigger: "POST /sugarhouse/tap-lines/{id}/repair"
        actor: SugarhouseManager
        preconditions:
          - "latest VacuumReading (by recorded_at, tie-break created_at).inhg >= vacuum_target_inhg - 0.5 (ERR_VACUUM_STILL_LOW)"
          - "Sugarbush.status IN {TAPPING, LIVE} (ERR_INVALID_STATE)"
        side_effects: ["recompute Sugarbush.taps_set/taps_live", "recompute Season.taps_live", "increments TapLine.version by 1"]
      - from: INSTALLING
        to: PULLED
        trigger: "POST /sugarhouse/tap-lines/{id}/pull or system (bush shutdown / lease terminate cascade)"
        actor: SugarhouseManager
        preconditions: []
        side_effects: ["recompute Sugarbush.taps_set/taps_live", "recompute Season.taps_live"]
      - from: ACTIVE
        to: PULLED
        trigger: "POST /sugarhouse/tap-lines/{id}/pull or system (bush shutdown / lease terminate cascade)"
        actor: SugarhouseManager
        preconditions: []
        side_effects:
          - "recompute Sugarbush.taps_set/taps_live"
          - "if Sugarbush.status == LIVE and taps_live == 0, Sugarbush auto -> TAPPING"
          - "recompute Season.taps_live"
      - from: LEAK
        to: PULLED
        trigger: "POST /sugarhouse/tap-lines/{id}/pull or system (bush shutdown / lease terminate cascade)"
        actor: SugarhouseManager
        preconditions: []
        side_effects: ["recompute Sugarbush.taps_set/taps_live", "recompute Season.taps_live"]

  - entity: WeatherWindow
    initial_state: FORECAST
    terminal_states: [CLOSED]
    transitions:
      - from: FORECAST
        to: OPEN
        trigger: "POST /sugarhouse/weather-windows/{id}/open"
        actor: SugarhouseManager
        preconditions:
          - "Season.status == OPEN (ERR_SEASON_NOT_OPEN / ERR_SEASON_SUSPENDED)"
          - "logical clock within [opens_at, closes_at) (ERR_OUTSIDE_PRODUCTION_WINDOW)"
        side_effects: ["increments WeatherWindow.version by 1"]
      - from: OPEN
        to: CLOSED
        trigger: "system (POST /sugarhouse/seasons/{id}/run-sweep when closes_at <= clock; also Season close cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FORECAST
        to: CLOSED
        trigger: "system (run-sweep when closes_at <= clock — missed window; also Season close cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SapRun
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /sugarhouse/sap-runs/{id}/confirm"
        actor: SugarhouseManager
        preconditions: ["Season.status == OPEN (ERR_SEASON_NOT_OPEN / ERR_SEASON_SUSPENDED)"]
        side_effects: ["Season.total_sap_gallons recomputed (CONFIRMED runs only)", "increments SapRun.version by 1"]
      - from: DRAFT
        to: VOIDED
        trigger: "POST /sugarhouse/sap-runs/{id}/void or system (Season close cascade)"
        actor: SugarhouseManager
        preconditions: []
        side_effects: ["increments SapRun.version by 1"]
      - from: CONFIRMED
        to: VOIDED
        trigger: "POST /sugarhouse/sap-runs/{id}/void"
        actor: SugarhouseManager
        preconditions: ["gallons_remaining == gallons_collected, i.e. no draws by non-CANCELLED batches (ERR_RUN_HAS_DRAWS)"]
        side_effects: ["Season.total_sap_gallons recomputed", "increments SapRun.version by 1"]

  - entity: EvaporatorBatch
    initial_state: FILLING
    terminal_states: [FINISHED, CANCELLED]
    transitions:
      - from: FILLING
        to: BOILING
        trigger: "POST /sugarhouse/batches/{id}/start-boil"
        actor: SugarMaker
        preconditions:
          - "sap_gallons_in > 0 (ERR_BATCH_EMPTY)"
          - "no other EvaporatorBatch of the same Season with status BOILING (ERR_EVAPORATOR_BUSY)"
        side_effects:
          - "boil_started_at = logical clock"
          - "stamps effective_brix on each BatchIntake (deterioration-adjusted)"
          - "computes input_brix, estimated_syrup_gallons (Rule of 86), expected_syrup_gallons (Rule of 88.2)"
          - "increments EvaporatorBatch.version by 1"
      - from: BOILING
        to: FINISHED
        trigger: "POST /sugarhouse/batches/{id}/finish"
        actor: SugarMaker
        preconditions: ["finished_brix >= 66.0 (ERR_BRIX_BELOW_LEGAL)"]
        side_effects:
          - "HOP1: creates SyrupLot (batch_id, season_id, measured_gallons, finished_brix, unpackaged_gallons = measured_gallons); status HELD with quality_hold_auto=true when |yield_variance_pct| >= 15.0, else UNGRADED"
          - "HOP2: Season.total_syrup_gallons recomputed"
          - "HOP2: lease_royalty_accrual provisional variant accrues per-bush royalty gallons onto each SHARE_OF_SYRUP Lease whose bush contributed intakes"
          - "increments EvaporatorBatch.version by 1"
      - from: FILLING
        to: CANCELLED
        trigger: "POST /sugarhouse/batches/{id}/cancel"
        actor: SugarMaker
        preconditions: []
        side_effects:
          - "COMPENSATION: for each BatchIntake of this batch, SapRun.gallons_remaining += gallons_drawn (draws of CANCELLED batches no longer count)"
          - "increments EvaporatorBatch.version by 1"
        note: "BOILING batches cannot be cancelled — the sap is already cooked"

  - entity: SyrupLot
    initial_state: UNGRADED
    terminal_states: [CONDEMNED, EXHAUSTED]
    transitions:
      - from: UNGRADED
        to: GRADED
        trigger: "POST /sugarhouse/syrup-lots/{id}/grade"
        actor: SugarMaker
        preconditions: ["at least 1 FlavorEvaluation exists for this lot (ERR_LOT_NOT_GRADABLE)"]
        side_effects: ["grade computed by grade_classification over light_transmittance_pct + latest FlavorEvaluation", "increments SyrupLot.version by 1"]
      - from: HELD
        to: GRADED
        trigger: "POST /sugarhouse/syrup-lots/{id}/grade"
        actor: SugarMaker
        preconditions: ["at least 1 FlavorEvaluation exists for this lot (ERR_LOT_NOT_GRADABLE)"]
        side_effects: ["grade recomputed from latest FlavorEvaluation", "increments SyrupLot.version by 1"]
      - from: UNGRADED
        to: HELD
        trigger: "POST /sugarhouse/syrup-lots/{id}/hold"
        actor: SugarhouseManager
        preconditions: []
        side_effects: ["increments SyrupLot.version by 1"]
      - from: GRADED
        to: HELD
        trigger: "POST /sugarhouse/syrup-lots/{id}/hold"
        actor: SugarhouseManager
        preconditions: []
        side_effects: ["increments SyrupLot.version by 1"]
      - from: UNGRADED
        to: CONDEMNED
        trigger: "POST /sugarhouse/syrup-lots/{id}/condemn"
        actor: SugarhouseManager
        preconditions: []
        side_effects: ["lot excluded from lease final settlement input set and from packaging", "increments SyrupLot.version by 1"]
      - from: HELD
        to: CONDEMNED
        trigger: "POST /sugarhouse/syrup-lots/{id}/condemn"
        actor: SugarhouseManager
        preconditions: []
        side_effects: ["lot excluded from lease final settlement input set and from packaging", "increments SyrupLot.version by 1"]
      - from: GRADED
        to: EXHAUSTED
        trigger: "system (automatic when unpackaged_gallons reaches exactly 0.00 after a PackagingRun fill)"
        actor: system
        preconditions: ["unpackaged_gallons == 0.00"]
        side_effects: ["increments SyrupLot.version by 1"]

  - entity: PackagingRun
    initial_state: PLANNED
    terminal_states: [FILLED, CANCELLED]
    transitions:
      - from: PLANNED
        to: FILLED
        trigger: "POST /sugarhouse/packaging-runs/{id}/fill"
        actor: SugarhouseManager
        preconditions:
          - "units_planned * CONTAINER_GALLONS[container_type] <= SyrupLot.unpackaged_gallons, re-checked at fill time (ERR_INSUFFICIENT_UNPACKAGED); equality allowed"
          - "SyrupLot.status == GRADED (ERR_LOT_NOT_GRADED)"
        side_effects:
          - "units_filled = units_planned; filled_gallons = units_planned * CONTAINER_GALLONS[container_type]"
          - "SyrupLot.unpackaged_gallons -= filled_gallons; if it reaches exactly 0.00, SyrupLot auto -> EXHAUSTED"
          - "increments PackagingRun.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /sugarhouse/packaging-runs/{id}/cancel"
        actor: SugarhouseManager
        preconditions: []
        side_effects: ["no compensation needed: PLANNED runs hold no reservation", "increments PackagingRun.version by 1"]

  - entity: CrewMember
    initial_state: HIRED
    terminal_states: [RELEASED]
    transitions:
      - from: HIRED
        to: ACTIVE
        trigger: "POST /sugarhouse/crew-members/{id}/activate"
        actor: SugarhouseManager
        preconditions:
          - "Season.status == OPEN (ERR_SEASON_NOT_OPEN / ERR_SEASON_SUSPENDED)"
          - "logical clock date within [Season.opens_on, Season.closes_on] (ERR_OUTSIDE_PRODUCTION_WINDOW)"
        side_effects: ["increments CrewMember.version by 1"]
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /sugarhouse/crew-members/{id}/release or system (Season close cascade)"
        actor: SugarhouseManager
        preconditions: []
        side_effects: ["increments CrewMember.version by 1"]

  - entity: CertAudit
    initial_state: SCHEDULED
    terminal_states: [RECORDED]
    transitions:
      - from: SCHEDULED
        to: RECORDED
        trigger: "POST /sugarhouse/cert-audits/{id}/record-result"
        actor: CertInspector
        preconditions: ["logical clock date >= scheduled_for (ERR_AUDIT_NOT_DUE)"]
        side_effects:
          - "if audit_type == ORGANIC: recompute Sugarbush.organic_certified from the latest RECORDED ORGANIC audit (by scheduled_for, tie-break created_at)"
          - "increments CertAudit.version by 1"

  - entity: Lease
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: DRAFT
        to: PENDING_AUDIT
        trigger: "POST /sugarhouse/leases/{id}/submit-audit"
        actor: SugarhouseManager
        preconditions: []
        side_effects: ["increments Lease.version by 1"]
      - from: PENDING_AUDIT
        to: DRAFT
        trigger: "PATCH /sugarhouse/leases/{id} (amending a PENDING_AUDIT lease sends it back to DRAFT)"
        actor: SugarhouseManager
        preconditions: []
        side_effects: ["increments Lease.version by 1"]
        note: "revision loop: PATCH while PENDING_AUDIT returns the lease to DRAFT for re-submission"
      - from: PENDING_AUDIT
        to: ACTIVE
        trigger: "POST /sugarhouse/leases/{id}/activate"
        actor: SugarhouseManager
        preconditions:
          - "logical clock date within [term_start, term_end] (ERR_OUTSIDE_PRODUCTION_WINDOW)"
          - "Sugarbush.status IN {PREP, TAPPING, LIVE} (ERR_INVALID_STATE)"
          - "if certified_organic_required: the latest ORGANIC CertAudit on the bush (by scheduled_for, tie-break created_at) has status RECORDED and result PASS (ERR_ORGANIC_AUDIT_REQUIRED)"
        side_effects:
          - "taps_snapshot = Sugarbush.taps_set (frozen; later tap changes do not alter it)"
          - "Sugarbush.active_lease_id = this lease id; Sugarbush.stand_type -> LEASED"
          - "if royalty_basis == PER_TAP: accrued_royalty_cents = taps_snapshot * per_tap_cents"
          - "increments Lease.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /sugarhouse/leases/{id}/terminate"
        actor: SugarhouseManager
        preconditions: []
        side_effects:
          - "HOP1: Sugarbush (active_lease_id stays set for history; stand_type stays LEASED) status -> SHUTDOWN when TAPPING or LIVE"
          - "HOP2: bush shutdown cascades every non-PULLED TapLine -> PULLED"
          - "HOP3: each line pull recomputes Sugarbush.taps_set/taps_live and Season.taps_live"
          - "increments Lease.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /sugarhouse/seasons/{id}/run-sweep when term_end < clock date)"
        actor: system
        preconditions: ["clock date > term_end"]
        side_effects:
          - "HOP1: Sugarbush status -> SHUTDOWN when TAPPING or LIVE (active_lease_id retained)"
          - "HOP2: bush shutdown cascades non-PULLED TapLines -> PULLED"
          - "HOP3: taps_set/taps_live and Season.taps_live recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: lease-amend-stale-version
    parent_entity: Lease
    write_endpoint: "PATCH /sugarhouse/leases/{id}"
    occ_field: "expected_lease_version"
    description: |
      Amending a Lease whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer
      has just amended (or submitted) the lease and the current writer's
      view of the terms is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: weather-window-declare-stale-season
    parent_entity: Season
    write_endpoint: "POST /sugarhouse/weather-windows"
    occ_field: "expected_season_version"
    description: |
      Declaring a WeatherWindow against a Season whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just changed the season (opened, suspended,
      or declared a window) and the current writer's plan view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# All arithmetic is decimal; rounding is round_half_up at the stated precision.
# =============================================================================
calculations:
  - name: weighted_input_brix
    trigger: "EvaporatorBatch FILLING -> BOILING (start-boil)"
    algorithm: constraint_propagation
    formula: |
      hours_held_i = hours between SapRun.collected_at and batch.boil_started_at
      deterioration_i = min(MAX_DETERIORATION, DETERIORATION_PER_DAY * floor(hours_held_i / 24))
      effective_brix_i = max(BRIX_FLOOR, SapRun.measured_brix - deterioration_i)   # stamped on BatchIntake.effective_brix
      input_brix = round( SUM(gallons_drawn_i * effective_brix_i) / SUM(gallons_drawn_i), 2 )
      Input set: this batch's BatchIntakes only (batch is FILLING/BOILING, never CANCELLED).
      Downstream calculations consume the STORED (rounded) input_brix.
    constants:
      DETERIORATION_PER_DAY: 0.2
      MAX_DETERIORATION: 1.0
      BRIX_FLOOR: 0.5
    precision: "2 decimal places, round_half_up"

  - name: boil_off_yield
    trigger: "EvaporatorBatch FILLING -> BOILING (start-boil); both variants computed then"
    algorithm: aggregation
    formula: |
      estimated_syrup_gallons = round(sap_gallons_in * input_brix / RULE_86, 2)
      expected_syrup_gallons  = round(sap_gallons_in * input_brix / RULE_88_2, 2)
    input_set: "sap_gallons_in and the stored rounded input_brix of this batch"
    constants:
      RULE_86: 86        # optimistic field estimate convention (no boil loss)
      RULE_88_2: 88.2    # settlement convention accounting for ~2.2% sugar loss in the boil
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional_estimate
        when: "capacity/planning reads and provisional royalty attribution"
        difference: "divides by RULE_86 (86) — yields a HIGHER gallon figure for identical sap input"
      - name: final_expectation
        when: "finish-time yield variance and final settlement basis"
        difference: "divides by RULE_88_2 (88.2) — yields a LOWER gallon figure for identical sap input"

  - name: yield_variance_hold
    trigger: "EvaporatorBatch BOILING -> FINISHED (finish)"
    algorithm: threshold
    formula: |
      yield_variance_pct = round((measured_syrup_gallons - expected_syrup_gallons) / expected_syrup_gallons * 100, 2)
      if abs(yield_variance_pct) >= VARIANCE_HOLD_PCT:
        new SyrupLot enters HELD with quality_hold_auto = true
      else:
        new SyrupLot enters UNGRADED with quality_hold_auto = false
    input_set: "this batch's measured_syrup_gallons and stored expected_syrup_gallons"
    constants:
      VARIANCE_HOLD_PCT: 15.0   # exactly 15.0 triggers the hold (>=, not >)
    precision: "2 decimal places, round_half_up"

  - name: grade_classification
    trigger: "POST /sugarhouse/syrup-lots/{id}/grade"
    algorithm: threshold
    formula: |
      eval = latest FlavorEvaluation of the lot (by evaluated_at, tie-break created_at)
      if eval.defect_flags is non-empty OR eval.flavor_score < FLAVOR_MIN:
        grade = PROCESSING
      elif light_transmittance_pct >= T_GOLDEN: grade = GOLDEN
      elif light_transmittance_pct >= T_AMBER:  grade = AMBER
      elif light_transmittance_pct >= T_DARK:   grade = DARK
      else:                                     grade = VERY_DARK
      Retail eligibility: grade IN {GOLDEN, AMBER} only (used by PackagingRun validation).
    input_set: "the lot's light_transmittance_pct input and its latest FlavorEvaluation"
    constants:
      FLAVOR_MIN: 70
      T_GOLDEN: 75.0   # exactly 75.0 is GOLDEN; 74.9 is AMBER
      T_AMBER: 50.0
      T_DARK: 25.0
    precision: "transmittance compared at 1 decimal place exactly as supplied"

  - name: fifo_sap_allocation
    trigger: "POST /sugarhouse/batches/{id}/auto-fill"
    algorithm: chronological
    formula: |
      candidates = SapRuns where season_id == batch.season_id AND status == CONFIRMED AND gallons_remaining > 0
      order: collected_at ASC, tie-break created_at ASC
      remaining_need = target_gallons
      for run in candidates (in order):
        draw = min(run.gallons_remaining, remaining_need)
        if draw > 0: create BatchIntake(draw); remaining_need -= draw
        stop when remaining_need == 0
      if SUM(candidate gallons_remaining) == 0 BEFORE any draw: reject ERR_NO_SAP_AVAILABLE
      Partial fill is allowed: if total available < target_gallons, draw everything available.
    input_set: "CONFIRMED SapRuns of the batch's Season with gallons_remaining > 0"
    precision: "2 decimal places, round_half_up (per drawn gallon amount)"

  - name: lease_royalty_accrual
    trigger: "PER_TAP: at lease activation. SHARE_OF_SYRUP provisional: at every batch FINISHED where the bush contributed intakes. SHARE_OF_SYRUP final: at Season reconcile."
    algorithm: aggregation
    formula: |
      PER_TAP (both variants identical):
        accrued_royalty_cents = taps_snapshot * per_tap_cents        # snapshot frozen at activation
      SHARE_OF_SYRUP provisional (per-batch, double-rounded):
        attributable_p(batch) = round( SUM_over_intakes_from_bush(gallons_drawn * effective_brix) / RULE_86, 2 )
        royalty_p(batch)      = round( attributable_p(batch) * share_pct / 100, 2 )
        accrued_royalty_gallons = SUM(royalty_p(batch)) over FINISHED batches contributing this bush
      SHARE_OF_SYRUP final (accumulate raw, single round at end):
        attributable_f(batch) = (bush_draw_gallons(batch) / batch.sap_gallons_in) * batch.measured_syrup_gallons
        settled_royalty_gallons = round( share_pct / 100 * SUM(attributable_f(batch)), 2 )
      Final input set EXCLUDES batches whose SyrupLot status is CONDEMNED.
    constants:
      RULE_86: 86
    precision: "2 decimal places, round_half_up; provisional rounds attributable THEN royalty per batch; final rounds once"
    variants:
      - name: provisional_accrual
        when: "during the season, as batches finish"
        difference: "per-batch Rule-of-86 attribution with per-batch double rounding"
      - name: final_settlement
        when: "at Season reconcile (CLOSED -> RECONCILED)"
        difference: "volume-share of measured syrup with a single final rounding; CONDEMNED lots excluded"

  - name: vacuum_leak_trigger
    trigger: "POST /sugarhouse/tap-lines/{id}/vacuum-readings"
    algorithm: threshold
    formula: |
      if TapLine.status == ACTIVE and inhg < vacuum_target_inhg - LEAK_DROP:
        TapLine -> LEAK (cascade per TapLine state machine)
      Repair gate (POST repair): latest reading inhg >= vacuum_target_inhg - REPAIR_HYSTERESIS
    constants:
      LEAK_DROP: 2.0          # inhg EXACTLY equal to target-2.0 does NOT leak (strict <)
      REPAIR_HYSTERESIS: 0.5  # repair allowed at exactly target-0.5 (inclusive >=)
    precision: "1 decimal place comparisons, exact"

  - name: freeze_thaw_eligibility
    trigger: "POST /sugarhouse/weather-windows"
    algorithm: threshold
    formula: |
      eligible = (forecast_min_f <= FREEZE_F) and (forecast_max_f >= THAW_F)
      if not eligible: reject ERR_NO_FREEZE_THAW
    constants:
      FREEZE_F: 32.0   # min of exactly 32.0 qualifies (<=)
      THAW_F: 38.0     # max of exactly 38.0 qualifies (>=)
    precision: "exact decimal comparison"

  - name: taps_rollup
    trigger: "TapLine create/activate/leak/repair/pull and bush shutdown cascades"
    algorithm: aggregation
    formula: |
      Sugarbush.taps_set  = SUM(tap_count) over TapLines of the bush with status IN {ACTIVE, LEAK}
      Sugarbush.taps_live = SUM(tap_count) over TapLines of the bush with status ACTIVE
      Season.taps_live    = SUM(Sugarbush.taps_live) over non-SHUTDOWN Sugarbushes of the season
    input_set: "TapLines filtered by the explicit status sets above (INSTALLING and PULLED never counted)"
    precision: "integer, exact"

  - name: season_aggregates
    trigger: "SapRun confirm/void and batch finish"
    algorithm: aggregation
    formula: |
      Season.total_sap_gallons   = SUM(gallons_collected) over SapRuns of the season with status CONFIRMED
      Season.total_syrup_gallons = SUM(measured_syrup_gallons) over EvaporatorBatches of the season with status FINISHED
    input_set: "explicit status filters as stated (DRAFT and VOIDED runs never counted; FILLING/BOILING/CANCELLED batches never counted)"
    precision: "2 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins when a
# request violates several rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "role permitted for this endpoint; for entity_backed roles, X-User-ID must equal the referenced operator id (collected_by / boiled_by / evaluator_id) when the role is FieldCrew or SugarMaker"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "path ids and body FK references (season_id, sugarbush_id, weather_window_id, collected_by, boiled_by, syrup_lot_id, sap_run_id, evaluator_id) resolve to existing records, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with ids"
  - priority: 4
    category: state
    check: "OCC: expected_lease_version / expected_season_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /sugarhouse/leases/{id}; POST /sugarhouse/weather-windows"
  - priority: 5
    category: state
    check: "state-machine precondition: target resource in a valid from-state (incl. ERR_INVALID_STATE, ERR_SEASON_NOT_OPEN, ERR_SEASON_SUSPENDED, ERR_SUGARBUSH_NOT_LIVE, ERR_WINDOW_NOT_OPEN, ERR_CREW_NOT_ACTIVE, ERR_TAP_LINES_NOT_READY, ERR_VACUUM_STILL_LOW, ERR_BATCH_EMPTY, ERR_EVAPORATOR_BUSY, ERR_LOT_NOT_GRADED, ERR_LOT_NOT_GRADABLE)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition and state-gated endpoints"
  - priority: 6
    category: business_safety
    check: "compliance gates: organic audit required for lease activation; segregation of duties (evaluator != lot's batch.boiled_by); organic lots require certified grader; leased bush operations require ACTIVE lease"
    error_id: "ERR_ORGANIC_AUDIT_REQUIRED | ERR_SEGREGATION_OF_DUTIES | ERR_GRADER_NOT_CERTIFIED | ERR_LEASE_NOT_ACTIVE"
    http_status: 409
    applies_to: "lease activate, flavor evaluations, sugarbush begin-tapping/go-live"
  - priority: 7
    category: business_temporal
    check: "clock-vs-window gates: season open/resume and crew activation within season dates; window open within [opens_at, closes_at); sap collection before closes_at; audit record on/after scheduled_for"
    error_id: "ERR_OUTSIDE_PRODUCTION_WINDOW | ERR_COLLECTED_OUTSIDE_WINDOW | ERR_AUDIT_NOT_DUE"
    http_status: 422
    applies_to: "season open/resume, crew activate, window open, sap-run create, audit record-result"
  - priority: 8
    category: business_constraint
    check: "structural constraints: window overlap, freeze-thaw eligibility, tap capacity, legal brix minimum, retail grade eligibility, audit spacing buffer, one-live-lease per bush, one active season"
    error_id: "ERR_WINDOW_OVERLAP | ERR_NO_FREEZE_THAW | ERR_TAP_CAPACITY_EXCEEDED | ERR_BRIX_BELOW_LEGAL | ERR_GRADE_NOT_RETAIL_ELIGIBLE | ERR_AUDIT_TOO_CLOSE | ERR_LEASE_CONFLICT | ERR_SEASON_ALREADY_ACTIVE"
    http_status: 422
    applies_to: "window create, tap-line create, batch finish, packaging create, audit create, lease create, season open"
  - priority: 9
    category: business_referential
    check: "referential-state blockers: season close with open batches; reconcile with ungraded lots or planned packaging; void of a run with live draws"
    error_id: "ERR_SEASON_HAS_OPEN_BATCHES | ERR_RECONCILE_BLOCKED | ERR_RUN_HAS_DRAWS"
    http_status: 409
    applies_to: "season close/reconcile, sap-run void"
  - priority: 10
    category: business_fiscal
    check: "quantity sufficiency: draw exceeds run remainder; planned/fill gallons exceed lot unpackaged; auto-fill candidate set empty"
    error_id: "ERR_DRAW_EXCEEDS_REMAINING | ERR_INSUFFICIENT_UNPACKAGED | ERR_NO_SAP_AVAILABLE"
    http_status: 422
    applies_to: "batch intakes, auto-fill, packaging create/fill"
  - priority: 11
    category: business_constraint
    check: "malformed/unknown/missing fields, enum and range violations, conditional requiredness (per_tap_cents iff PER_TAP; share_pct iff SHARE_OF_SYRUP), term_end after term_start, closes_at after opens_at"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints with a request body"

# =============================================================================
# §1.5 API Endpoint Table
# CONTAINER_GALLONS = { DRUM_55: 55.0, RETAIL_QUART: 0.25, RETAIL_PINT: 0.125 }
# =============================================================================
endpoints:
  # GLOBAL LIST ORDER: every list endpoint returns rows ordered by created_at ASC
  # (stable chronological order; ties are impossible across distinct mutations of
  # the logical clock in the declared test flows and otherwise unspecified).
  # --- test-driving clock ---
  - method: POST
    path: "/sugarhouse/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-05-01T00:00:00Z and never falls back to wall-clock time."
    roles: [SugarhouseManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["sets logical clock used by all temporal gates and system timestamps"]

  # --- Season ---
  - method: POST
    path: "/sugarhouse/seasons"
    description: "Create a season (status PLANNED)"
    roles: [SugarhouseManager]
    code: 201
    input: [year, opens_on, closes_on, planned_taps]
    output: Season
    side_effects: ["status=PLANNED; aggregates zeroed"]
  - method: GET
    path: "/sugarhouse/seasons/{id}"
    description: "Get a season"
    roles: [SugarhouseManager, FieldCrew, SugarMaker, CertInspector]
    code: 200
    input: []
    output: Season
    side_effects: []
  - method: POST
    path: "/sugarhouse/seasons/{id}/open"
    description: "Open the season (PLANNED -> OPEN)"
    roles: [SugarhouseManager]
    code: 200
    input: []
    output: Season
    side_effects: ["status -> OPEN", "increments Season.version by 1"]
  - method: POST
    path: "/sugarhouse/seasons/{id}/suspend"
    description: "Suspend the season (warm spell)"
    roles: [SugarhouseManager]
    code: 200
    input: []
    output: Season
    side_effects: ["status -> SUSPENDED", "increments Season.version by 1"]
  - method: POST
    path: "/sugarhouse/seasons/{id}/resume"
    description: "Resume a suspended season"
    roles: [SugarhouseManager]
    code: 200
    input: []
    output: Season
    side_effects: ["status -> OPEN", "increments Season.version by 1"]
  - method: POST
    path: "/sugarhouse/seasons/{id}/close"
    description: "Close the season; cascades crew release, window close, DRAFT run void"
    roles: [SugarhouseManager]
    code: 200
    input: []
    output: Season
    side_effects: ["status -> CLOSED", "ACTIVE crew -> RELEASED", "FORECAST/OPEN windows -> CLOSED", "DRAFT sap runs -> VOIDED", "increments Season.version by 1"]
  - method: POST
    path: "/sugarhouse/seasons/{id}/reconcile"
    description: "Reconcile a closed season; final royalty settlement"
    roles: [SugarhouseManager]
    code: 200
    input: []
    output: Season
    side_effects: ["status -> RECONCILED", "sets settled_royalty_gallons on SHARE_OF_SYRUP leases", "increments Season.version by 1"]
  - method: POST
    path: "/sugarhouse/seasons/{id}/run-sweep"
    description: "Ops checkpoint: close expired windows, expire out-of-term leases (with bush shutdown cascade)"
    roles: [SugarhouseManager]
    code: 200
    input: []
    output: Season
    side_effects: ["windows with closes_at <= clock -> CLOSED", "ACTIVE leases with term_end < clock date -> EXPIRED + bush shutdown cascade", "increments Season.version by 1"]

  # --- Sugarbush ---
  - method: POST
    path: "/sugarhouse/sugarbushes"
    description: "Create a sugarbush for a season (status PREP)"
    roles: [SugarhouseManager]
    code: 201
    input: [season_id, name, tap_capacity]
    output: Sugarbush
    side_effects: ["status=PREP; stand_type=OWNED; taps_set=0; taps_live=0"]
  - method: GET
    path: "/sugarhouse/sugarbushes/{id}"
    description: "Get a sugarbush"
    roles: [SugarhouseManager, FieldCrew, SugarMaker, CertInspector]
    code: 200
    input: []
    output: Sugarbush
    side_effects: []
  - method: GET
    path: "/sugarhouse/sugarbushes"
    description: "List sugarbushes"
    roles: [SugarhouseManager, FieldCrew, SugarMaker, CertInspector]
    code: 200
    input: ["season_id?", "active_lease_id?", "status?", "limit?", "offset?"]
    output: Sugarbush[]
    side_effects: []
  - method: POST
    path: "/sugarhouse/sugarbushes/{id}/begin-tapping"
    description: "PREP -> TAPPING"
    roles: [SugarhouseManager]
    code: 200
    input: []
    output: Sugarbush
    side_effects: ["status -> TAPPING", "increments Sugarbush.version by 1"]
  - method: POST
    path: "/sugarhouse/sugarbushes/{id}/go-live"
    description: "TAPPING -> LIVE; requires all non-PULLED lines ACTIVE"
    roles: [SugarhouseManager]
    code: 200
    input: []
    output: Sugarbush
    side_effects: ["status -> LIVE", "increments Sugarbush.version by 1"]
  - method: POST
    path: "/sugarhouse/sugarbushes/{id}/shutdown"
    description: "TAPPING|LIVE -> SHUTDOWN; cascades lines to PULLED"
    roles: [SugarhouseManager]
    code: 200
    input: []
    output: Sugarbush
    side_effects: ["status -> SHUTDOWN", "non-PULLED TapLines -> PULLED", "taps and Season.taps_live recomputed", "increments Sugarbush.version by 1"]

  # --- Lease ---
  - method: POST
    path: "/sugarhouse/leases"
    description: "Create a lease (DRAFT); sugarbush must be PREP or TAPPING (ERR_INVALID_STATE); one lease per bush in {DRAFT, PENDING_AUDIT, ACTIVE}"
    roles: [SugarhouseManager]
    code: 201
    input: [sugarbush_id, landowner_name, royalty_basis, "per_tap_cents?", "share_pct?", "certified_organic_required?", term_start, term_end]
    output: Lease
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/sugarhouse/leases/{id}"
    description: "Get a lease"
    roles: [SugarhouseManager, FieldCrew, SugarMaker, CertInspector]
    code: 200
    input: []
    output: Lease
    side_effects: []
  - method: GET
    path: "/sugarhouse/leases"
    description: "List leases"
    roles: [SugarhouseManager, FieldCrew, SugarMaker, CertInspector]
    code: 200
    input: ["sugarbush_id?", "status?", "limit?", "offset?"]
    output: Lease[]
    side_effects: []
  - method: PATCH
    path: "/sugarhouse/leases/{id}"
    description: "Amend lease terms (DRAFT or PENDING_AUDIT); OCC-guarded; PENDING_AUDIT returns to DRAFT"
    roles: [SugarhouseManager]
    code: 200
    input: [expected_lease_version, "landowner_name?", "royalty_basis?", "per_tap_cents?", "share_pct?", "certified_organic_required?", "term_start?", "term_end?"]
    output: Lease
    side_effects: ["applies amendments", "if PENDING_AUDIT -> DRAFT", "increments Lease.version by 1"]
  - method: POST
    path: "/sugarhouse/leases/{id}/submit-audit"
    description: "DRAFT -> PENDING_AUDIT"
    roles: [SugarhouseManager]
    code: 200
    input: []
    output: Lease
    side_effects: ["status -> PENDING_AUDIT", "increments Lease.version by 1"]
  - method: POST
    path: "/sugarhouse/leases/{id}/activate"
    description: "PENDING_AUDIT -> ACTIVE; freezes taps_snapshot; attaches lease to bush"
    roles: [SugarhouseManager]
    code: 200
    input: []
    output: Lease
    side_effects: ["status -> ACTIVE", "taps_snapshot frozen", "Sugarbush.active_lease_id set, stand_type -> LEASED", "PER_TAP: accrued_royalty_cents set", "increments Lease.version by 1"]
  - method: POST
    path: "/sugarhouse/leases/{id}/terminate"
    description: "ACTIVE -> TERMINATED; cascades bush shutdown and line pulls"
    roles: [SugarhouseManager]
    code: 200
    input: []
    output: Lease
    side_effects: ["status -> TERMINATED", "bush TAPPING/LIVE -> SHUTDOWN", "lines -> PULLED", "taps recomputed", "increments Lease.version by 1"]

  # --- TapLine ---
  - method: POST
    path: "/sugarhouse/tap-lines"
    description: "Create a tap line (INSTALLING) on a TAPPING bush"
    roles: [SugarhouseManager]
    code: 201
    input: [sugarbush_id, line_code, tap_count, vacuum_target_inhg]
    output: TapLine
    side_effects: ["status=INSTALLING; tap capacity checked against non-PULLED lines"]
  - method: GET
    path: "/sugarhouse/tap-lines/{id}"
    description: "Get a tap line"
    roles: [SugarhouseManager, FieldCrew, SugarMaker, CertInspector]
    code: 200
    input: []
    output: TapLine
    side_effects: []
  - method: GET
    path: "/sugarhouse/tap-lines"
    description: "List tap lines"
    roles: [SugarhouseManager, FieldCrew, SugarMaker, CertInspector]
    code: 200
    input: ["sugarbush_id?", "status?", "limit?", "offset?"]
    output: TapLine[]
    side_effects: []
  - method: POST
    path: "/sugarhouse/tap-lines/{id}/activate"
    description: "INSTALLING -> ACTIVE"
    roles: [SugarhouseManager]
    code: 200
    input: []
    output: TapLine
    side_effects: ["status -> ACTIVE", "taps recomputed", "increments TapLine.version by 1"]
  - method: POST
    path: "/sugarhouse/tap-lines/{id}/repair"
    description: "LEAK -> ACTIVE; requires latest reading >= target - 0.5"
    roles: [SugarhouseManager]
    code: 200
    input: []
    output: TapLine
    side_effects: ["status -> ACTIVE", "taps recomputed", "increments TapLine.version by 1"]
  - method: POST
    path: "/sugarhouse/tap-lines/{id}/pull"
    description: "INSTALLING|ACTIVE|LEAK -> PULLED"
    roles: [SugarhouseManager]
    code: 200
    input: []
    output: TapLine
    side_effects: ["status -> PULLED", "taps recomputed; bush auto -> TAPPING if LIVE with 0 live taps"]

  # --- VacuumReading (sub-resource of TapLine) ---
  - method: POST
    path: "/sugarhouse/tap-lines/{id}/vacuum-readings"
    description: "Record a vacuum reading; may trigger LEAK cascade"
    roles: [SugarhouseManager, FieldCrew]
    code: 201
    input: [inhg]
    output: VacuumReading
    side_effects: ["line.latest_vacuum_inhg updated", "if ACTIVE and inhg < target-2.0: line -> LEAK -> taps recompute -> bush auto TAPPING when taps_live hits 0 -> Season.taps_live recompute"]
  - method: GET
    path: "/sugarhouse/tap-lines/{id}/vacuum-readings"
    description: "List vacuum readings of a line"
    roles: [SugarhouseManager, FieldCrew, SugarMaker, CertInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: VacuumReading[]
    side_effects: []

  # --- WeatherWindow ---
  - method: POST
    path: "/sugarhouse/weather-windows"
    description: "Declare a forecast window (OCC on Season.version); half-open overlap check; freeze-thaw eligibility"
    roles: [SugarhouseManager]
    code: 201
    input: [season_id, opens_at, closes_at, forecast_min_f, forecast_max_f, expected_season_version]
    output: WeatherWindow
    side_effects: ["status=FORECAST", "increments Season.version by 1"]
  - method: GET
    path: "/sugarhouse/weather-windows/{id}"
    description: "Get a weather window"
    roles: [SugarhouseManager, FieldCrew, SugarMaker, CertInspector]
    code: 200
    input: []
    output: WeatherWindow
    side_effects: []
  - method: GET
    path: "/sugarhouse/weather-windows"
    description: "List weather windows"
    roles: [SugarhouseManager, FieldCrew, SugarMaker, CertInspector]
    code: 200
    input: ["season_id?", "status?", "limit?", "offset?"]
    output: WeatherWindow[]
    side_effects: []
  - method: POST
    path: "/sugarhouse/weather-windows/{id}/open"
    description: "FORECAST -> OPEN"
    roles: [SugarhouseManager]
    code: 200
    input: []
    output: WeatherWindow
    side_effects: ["status -> OPEN", "increments WeatherWindow.version by 1"]

  # --- CrewMember ---
  - method: POST
    path: "/sugarhouse/crew-members"
    description: "Hire a seasonal crew member (HIRED)"
    roles: [SugarhouseManager]
    code: 201
    input: [season_id, name, crew_role, "cert_organic_handler?"]
    output: CrewMember
    side_effects: ["status=HIRED"]
  - method: GET
    path: "/sugarhouse/crew-members/{id}"
    description: "Get a crew member"
    roles: [SugarhouseManager, FieldCrew, SugarMaker, CertInspector]
    code: 200
    input: []
    output: CrewMember
    side_effects: []
  - method: GET
    path: "/sugarhouse/crew-members"
    description: "List crew members"
    roles: [SugarhouseManager, FieldCrew, SugarMaker, CertInspector]
    code: 200
    input: ["season_id?", "crew_role?", "status?", "limit?", "offset?"]
    output: CrewMember[]
    side_effects: []
  - method: POST
    path: "/sugarhouse/crew-members/{id}/activate"
    description: "HIRED -> ACTIVE; only during the open season window"
    roles: [SugarhouseManager]
    code: 200
    input: []
    output: CrewMember
    side_effects: ["status -> ACTIVE", "increments CrewMember.version by 1"]
  - method: POST
    path: "/sugarhouse/crew-members/{id}/release"
    description: "ACTIVE -> RELEASED"
    roles: [SugarhouseManager]
    code: 200
    input: []
    output: CrewMember
    side_effects: ["status -> RELEASED", "increments CrewMember.version by 1"]

  # --- SapRun ---
  - method: POST
    path: "/sugarhouse/sap-runs"
    description: "Record a sap collection (DRAFT); stamps collected_at from the logical clock"
    roles: [SugarhouseManager, FieldCrew]
    code: 201
    input: [sugarbush_id, weather_window_id, collected_by, gallons_collected, measured_brix]
    output: SapRun
    side_effects: ["status=DRAFT", "collected_at = logical clock", "gallons_remaining = gallons_collected"]
  - method: GET
    path: "/sugarhouse/sap-runs/{id}"
    description: "Get a sap run"
    roles: [SugarhouseManager, FieldCrew, SugarMaker, CertInspector]
    code: 200
    input: []
    output: SapRun
    side_effects: []
  - method: GET
    path: "/sugarhouse/sap-runs"
    description: "List sap runs"
    roles: [SugarhouseManager, FieldCrew, SugarMaker, CertInspector]
    code: 200
    input: ["sugarbush_id?", "weather_window_id?", "collected_by?", "status?", "limit?", "offset?"]
    output: SapRun[]
    side_effects: []
  - method: POST
    path: "/sugarhouse/sap-runs/{id}/confirm"
    description: "DRAFT -> CONFIRMED; makes the run drawable"
    roles: [SugarhouseManager, FieldCrew]
    code: 200
    input: []
    output: SapRun
    side_effects: ["status -> CONFIRMED", "Season.total_sap_gallons recomputed", "increments SapRun.version by 1"]
  - method: POST
    path: "/sugarhouse/sap-runs/{id}/void"
    description: "DRAFT -> VOIDED; CONFIRMED -> VOIDED only when never drawn"
    roles: [SugarhouseManager]
    code: 200
    input: []
    output: SapRun
    side_effects: ["status -> VOIDED", "Season.total_sap_gallons recomputed", "increments SapRun.version by 1"]

  # --- EvaporatorBatch ---
  - method: POST
    path: "/sugarhouse/batches"
    description: "Create an evaporator batch (FILLING)"
    roles: [SugarhouseManager, SugarMaker]
    code: 201
    input: [season_id, boiled_by, evaporator_capacity_gal]
    output: EvaporatorBatch
    side_effects: ["status=FILLING"]
  - method: GET
    path: "/sugarhouse/batches/{id}"
    description: "Get a batch"
    roles: [SugarhouseManager, FieldCrew, SugarMaker, CertInspector]
    code: 200
    input: []
    output: EvaporatorBatch
    side_effects: []
  - method: GET
    path: "/sugarhouse/batches"
    description: "List batches"
    roles: [SugarhouseManager, FieldCrew, SugarMaker, CertInspector]
    code: 200
    input: ["season_id?", "boiled_by?", "status?", "limit?", "offset?"]
    output: EvaporatorBatch[]
    side_effects: []
  - method: POST
    path: "/sugarhouse/batches/{id}/intakes"
    description: "Manual draw from a CONFIRMED sap run into a FILLING batch"
    roles: [SugarhouseManager, SugarMaker]
    code: 201
    input: [sap_run_id, gallons_drawn]
    output: BatchIntake
    side_effects: ["SapRun.gallons_remaining -= gallons_drawn", "batch.sap_gallons_in += gallons_drawn", "draw_sequence assigned"]
  - method: POST
    path: "/sugarhouse/batches/{id}/auto-fill"
    description: "FIFO fill: draws from CONFIRMED runs ordered collected_at ASC, created_at ASC"
    roles: [SugarhouseManager, SugarMaker]
    code: 200
    input: [target_gallons]
    output: EvaporatorBatch
    side_effects: ["creates BatchIntakes per fifo_sap_allocation", "updates gallons_remaining and sap_gallons_in"]
  - method: GET
    path: "/sugarhouse/batches/{id}/intakes"
    description: "List intakes of a batch"
    roles: [SugarhouseManager, FieldCrew, SugarMaker, CertInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: BatchIntake[]
    side_effects: []
  - method: GET
    path: "/sugarhouse/sap-runs/{id}/intakes"
    description: "List intakes drawn from a sap run"
    roles: [SugarhouseManager, FieldCrew, SugarMaker, CertInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: BatchIntake[]
    side_effects: []
  - method: POST
    path: "/sugarhouse/batches/{id}/start-boil"
    description: "FILLING -> BOILING; computes effective brix per intake, input_brix, both yield variants"
    roles: [SugarhouseManager, SugarMaker]
    code: 200
    input: []
    output: EvaporatorBatch
    side_effects: ["status -> BOILING", "boil_started_at stamped", "effective_brix stamped per intake", "input_brix/estimated/expected computed", "increments EvaporatorBatch.version by 1"]
  - method: POST
    path: "/sugarhouse/batches/{id}/finish"
    description: "BOILING -> FINISHED; creates SyrupLot; accrues provisional royalty"
    roles: [SugarhouseManager, SugarMaker]
    code: 200
    input: [finished_brix, measured_syrup_gallons]
    output: EvaporatorBatch
    side_effects: ["status -> FINISHED", "yield_variance_pct computed", "SyrupLot created (HELD if |variance| >= 15.0 else UNGRADED)", "Season.total_syrup_gallons recomputed", "provisional royalty accrual per contributing SHARE lease", "increments EvaporatorBatch.version by 1"]
  - method: POST
    path: "/sugarhouse/batches/{id}/cancel"
    description: "FILLING -> CANCELLED; returns all drawn gallons to their runs"
    roles: [SugarhouseManager, SugarMaker]
    code: 200
    input: []
    output: EvaporatorBatch
    side_effects: ["status -> CANCELLED", "COMPENSATION: gallons_drawn returned to each SapRun.gallons_remaining", "increments EvaporatorBatch.version by 1"]

  # --- SyrupLot ---
  - method: GET
    path: "/sugarhouse/syrup-lots/{id}"
    description: "Get a syrup lot"
    roles: [SugarhouseManager, FieldCrew, SugarMaker, CertInspector]
    code: 200
    input: []
    output: SyrupLot
    side_effects: []
  - method: GET
    path: "/sugarhouse/syrup-lots"
    description: "List syrup lots (batch_id filter returns array of 0 or 1)"
    roles: [SugarhouseManager, FieldCrew, SugarMaker, CertInspector]
    code: 200
    input: ["batch_id?", "season_id?", "status?", "limit?", "offset?"]
    output: SyrupLot[]
    side_effects: []
