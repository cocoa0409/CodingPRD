# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Pet Cremation & Aftercare Provider — grounds resolve into SCAFFOLD.yaml §1.1–§1.7
# 9 rules × ≥2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dual_calc_case_private_vs_communal_charge
        grounds:
          - calculations.case_cremation_charge
          - entities.Case.fields.cremation_charge_cents
          - state_machines.CremationBatch.LOADED_to_FIRING
        distinguishing_aspect: >
          Same pet weight produces a PRIVATE flat-tier charge on a Case vs a COMMUNAL
          weight-proportional allocated share on a Case — the dual variant lives on the
          Case entity domain via two distinct firing paths producing different cents.
        test_recipe:
          setup:
            - "Clock at 2026-03-01T00:00:00Z; one retort (max_load 400)."
            - "One PRIVATE case (DOG, 50 lbs -> MEDIUM, not expedited) staged in its own PRIVATE batch, fired."
            - "Three COMMUNAL cases (weights 3, 4, 20 lbs) staged in one COMMUNAL batch, fired."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CrematoryAdmin
            - call: "POST /retorts"
              payload: { label: "RETORT-1", max_load_lbs: 400 }
              as: CrematoryAdmin
              captures: { retort_id: $.data.id }
            - call: "POST /petowners"
              payload: { full_name: "Owner P", email: "ownerp@x.com", phone: "555-0001" }
              as: CrematoryOperator
              captures: { owner_id: $.data.id }
            # ---- PRIVATE case ----
            - call: "POST /cases"
              payload: { owner_id: "${owner_id}", pet_name: "Rex", species: "DOG", weight_lbs: 50, service_type: "PRIVATE", expedited: false, pickup_kind: "HOME", bill_to: "OWNER" }
              as: CrematoryOperator
              captures: { priv_case_id: $.data.id }
            - call: "POST /cases/${priv_case_id}/transport-legs"
              payload: { origin_kind: "HOME", origin_label: "12 Elm St", driver_name: "Dana" }
              as: CrematoryOperator
              captures: { priv_leg_id: $.data.id }
            - call: "PATCH /transport-legs/${priv_leg_id}"
              payload: { status: "EN_ROUTE" }
              as: CrematoryOperator
            - call: "PATCH /transport-legs/${priv_leg_id}"
              payload: { status: "ARRIVED" }
              as: CrematoryOperator
            - call: "POST /cases/${priv_case_id}/receive"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches"
              payload: { retort_id: "${retort_id}", service_type: "PRIVATE", scheduled_start: "2026-03-01T08:00:00Z", scheduled_end: "2026-03-01T10:00:00Z" }
              as: CrematoryOperator
              captures: { priv_batch_id: $.data.id }
            - call: "POST /batches/${priv_batch_id}/assign-case"
              payload: { case_id: "${priv_case_id}" }
              as: CrematoryOperator
            - call: "POST /batches/${priv_batch_id}/load"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches/${priv_batch_id}/fire"
              payload: {}
              as: CrematoryOperator
            # ---- COMMUNAL cases ----
            - call: "POST /cases"
              payload: { owner_id: "${owner_id}", pet_name: "C1", species: "CAT", weight_lbs: 3, service_type: "COMMUNAL", pickup_kind: "CLINIC", bill_to: "OWNER" }
              as: CrematoryOperator
              captures: { com1_id: $.data.id }
            - call: "POST /cases/${com1_id}/transport-legs"
              payload: { origin_kind: "CLINIC", origin_label: "VetCo", driver_name: "Dana" }
              as: CrematoryOperator
              captures: { com1_leg: $.data.id }
            - call: "PATCH /transport-legs/${com1_leg}"
              payload: { status: "EN_ROUTE" }
              as: CrematoryOperator
            - call: "PATCH /transport-legs/${com1_leg}"
              payload: { status: "ARRIVED" }
              as: CrematoryOperator
            - call: "POST /cases/${com1_id}/receive"
              payload: {}
              as: CrematoryOperator
            - call: "POST /cases"
              payload: { owner_id: "${owner_id}", pet_name: "C2", species: "CAT", weight_lbs: 4, service_type: "COMMUNAL", pickup_kind: "CLINIC", bill_to: "OWNER" }
              as: CrematoryOperator
              captures: { com2_id: $.data.id }
            - call: "POST /cases/${com2_id}/transport-legs"
              payload: { origin_kind: "CLINIC", origin_label: "VetCo", driver_name: "Dana" }
              as: CrematoryOperator
              captures: { com2_leg: $.data.id }
            - call: "PATCH /transport-legs/${com2_leg}"
              payload: { status: "EN_ROUTE" }
              as: CrematoryOperator
            - call: "PATCH /transport-legs/${com2_leg}"
              payload: { status: "ARRIVED" }
              as: CrematoryOperator
            - call: "POST /cases/${com2_id}/receive"
              payload: {}
              as: CrematoryOperator
            - call: "POST /cases"
              payload: { owner_id: "${owner_id}", pet_name: "C3", species: "DOG", weight_lbs: 20, service_type: "COMMUNAL", pickup_kind: "CLINIC", bill_to: "OWNER" }
              as: CrematoryOperator
              captures: { com3_id: $.data.id }
            - call: "POST /cases/${com3_id}/transport-legs"
              payload: { origin_kind: "CLINIC", origin_label: "VetCo", driver_name: "Dana" }
              as: CrematoryOperator
              captures: { com3_leg: $.data.id }
            - call: "PATCH /transport-legs/${com3_leg}"
              payload: { status: "EN_ROUTE" }
              as: CrematoryOperator
            - call: "PATCH /transport-legs/${com3_leg}"
              payload: { status: "ARRIVED" }
              as: CrematoryOperator
            - call: "POST /cases/${com3_id}/receive"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches"
              payload: { retort_id: "${retort_id}", service_type: "COMMUNAL", scheduled_start: "2026-03-01T12:00:00Z", scheduled_end: "2026-03-01T14:00:00Z" }
              as: CrematoryOperator
              captures: { com_batch_id: $.data.id }
            - call: "POST /batches/${com_batch_id}/assign-case"
              payload: { case_id: "${com1_id}" }
              as: CrematoryOperator
            - call: "POST /batches/${com_batch_id}/assign-case"
              payload: { case_id: "${com2_id}" }
              as: CrematoryOperator
            - call: "POST /batches/${com_batch_id}/assign-case"
              payload: { case_id: "${com3_id}" }
              as: CrematoryOperator
            - call: "POST /batches/${com_batch_id}/load"
              payload: {}
              as: CrematoryOperator
          trigger:
            - call: "POST /batches/${com_batch_id}/fire"
              payload: {}
              as: CrematoryOperator
          assert:
            - "Case.${priv_case_id}.cremation_charge_cents == 18000"
            - "Case.${com1_id}.cremation_charge_cents == 3333"
            - "Case.${com2_id}.cremation_charge_cents == 4444"
            - "Case.${com3_id}.cremation_charge_cents == 22223"
            - "Case.${com1_id}.cremation_charge_cents + Case.${com2_id}.cremation_charge_cents + Case.${com3_id}.cremation_charge_cents == 30000"

      - name: dual_calc_clinic_statement_accrual_vs_completion
        grounds:
          - calculations.clinic_statement_balance
          - entities.Clinic.fields.outstanding_balance_cents
          - state_machines.CremationBatch.FIRING_to_COMPLETED
        distinguishing_aspect: >
          On the Clinic entity domain, the same set of clinic-account cases yields a
          larger ACCRUAL statement (received-and-later) than COMPLETION statement
          (cremated-and-later) while one case is fired-but-pre-completion vs completed.
        test_recipe:
          setup:
            - "Clock at 2026-04-01T00:00:00Z; clinic CL-A; one retort."
            - "Case A (clinic-billed, PRIVATE, 50 lbs MEDIUM) fired AND completed (custody_status CREMATED, charge 18000)."
            - "Case B (clinic-billed, PRIVATE, 20 lbs SMALL) fired but NOT completed in its own batch (custody_status STAGED, charge 12000 already set at firing)."
            - "Accrual basis (RECEIVED-and-later, which includes STAGED) recognizes both -> 30000; completion basis (CREMATED-and-later) recognizes only A -> 18000; the bases diverge."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: CrematoryAdmin
            - call: "POST /clinics"
              payload: { name: "CL-A", account_code: "CLA-001" }
              as: CrematoryAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /retorts"
              payload: { label: "RETORT-S", max_load_lbs: 300 }
              as: CrematoryAdmin
              captures: { retort_id: $.data.id }
            - call: "POST /petowners"
              payload: { full_name: "Owner Q", email: "ownerq@x.com", phone: "555-0002" }
              as: CrematoryOperator
              captures: { owner_id: $.data.id }
            # Case A
            - call: "POST /cases"
              payload: { clinic_id: "${clinic_id}", owner_id: "${owner_id}", pet_name: "A", species: "DOG", weight_lbs: 50, service_type: "PRIVATE", pickup_kind: "CLINIC", bill_to: "CLINIC_ACCOUNT" }
              as: CrematoryOperator
              captures: { caseA_id: $.data.id }
            - call: "POST /cases/${caseA_id}/transport-legs"
              payload: { origin_kind: "CLINIC", origin_label: "CL-A", driver_name: "Lee" }
              as: CrematoryOperator
              captures: { legA: $.data.id }
            - call: "PATCH /transport-legs/${legA}"
              payload: { status: "EN_ROUTE" }
              as: CrematoryOperator
            - call: "PATCH /transport-legs/${legA}"
              payload: { status: "ARRIVED" }
              as: CrematoryOperator
            - call: "POST /cases/${caseA_id}/receive"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches"
              payload: { retort_id: "${retort_id}", service_type: "PRIVATE", scheduled_start: "2026-04-01T08:00:00Z", scheduled_end: "2026-04-01T10:00:00Z" }
              as: CrematoryOperator
              captures: { batchA: $.data.id }
            - call: "POST /batches/${batchA}/assign-case"
              payload: { case_id: "${caseA_id}" }
              as: CrematoryOperator
            - call: "POST /batches/${batchA}/load"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches/${batchA}/fire"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches/${batchA}/complete"
              payload: {}
              as: CrematoryOperator
            # Case B
            - call: "POST /cases"
              payload: { clinic_id: "${clinic_id}", owner_id: "${owner_id}", pet_name: "B", species: "CAT", weight_lbs: 20, service_type: "PRIVATE", pickup_kind: "CLINIC", bill_to: "CLINIC_ACCOUNT" }
              as: CrematoryOperator
              captures: { caseB_id: $.data.id }
            - call: "POST /cases/${caseB_id}/transport-legs"
              payload: { origin_kind: "CLINIC", origin_label: "CL-A", driver_name: "Lee" }
              as: CrematoryOperator
              captures: { legB: $.data.id }
            - call: "PATCH /transport-legs/${legB}"
              payload: { status: "EN_ROUTE" }
              as: CrematoryOperator
            - call: "PATCH /transport-legs/${legB}"
              payload: { status: "ARRIVED" }
              as: CrematoryOperator
            - call: "POST /cases/${caseB_id}/receive"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches"
              payload: { retort_id: "${retort_id}", service_type: "PRIVATE", scheduled_start: "2026-04-01T12:00:00Z", scheduled_end: "2026-04-01T14:00:00Z" }
              as: CrematoryOperator
              captures: { batchB: $.data.id }
            - call: "POST /batches/${batchB}/assign-case"
              payload: { case_id: "${caseB_id}" }
              as: CrematoryOperator
            - call: "POST /batches/${batchB}/load"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches/${batchB}/fire"
              payload: {}
              as: CrematoryOperator
          trigger:
            - call: "GET /clinics/${clinic_id}/statement?basis=ACCRUAL"
              payload: {}
              as: CrematoryAdmin
              captures: { accrual_bal: $.data.balance_cents }
            - call: "GET /clinics/${clinic_id}/statement?basis=COMPLETION"
              payload: {}
              as: CrematoryAdmin
              captures: { completion_bal: $.data.balance_cents }
          assert:
            - "accrual_bal == 30000"
            - "completion_bal == 18000"
            - "accrual_bal != completion_bal"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_private_charge_tier_plus_surcharge
        grounds:
          - calculations.case_cremation_charge
          - calculations.weight_tier
          - entities.Case.fields.expedited
        distinguishing_aspect: >
          Mode (a): private charge selects a tiered rate by weight_tier then conditionally
          adds the expedite surcharge — >=3 inputs (weight_lbs, weight_tier mapping,
          expedited flag) with branch-and-tier non-linearity.
        test_recipe:
          setup:
            - "Clock at 2026-03-05T00:00:00Z; retort max_load 400."
            - "PRIVATE case LARGE (120 lbs), expedited=true, staged in own PRIVATE batch, fired."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: CrematoryAdmin
            - call: "POST /retorts"
              payload: { label: "RT-L", max_load_lbs: 400 }
              as: CrematoryAdmin
              captures: { retort_id: $.data.id }
            - call: "POST /petowners"
              payload: { full_name: "Owner L", email: "ownerl@x.com", phone: "555-0003" }
              as: CrematoryOperator
              captures: { owner_id: $.data.id }
            - call: "POST /cases"
              payload: { owner_id: "${owner_id}", pet_name: "Max", species: "DOG", weight_lbs: 120, service_type: "PRIVATE", expedited: true, pickup_kind: "HOME", bill_to: "OWNER" }
              as: CrematoryOperator
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/transport-legs"
              payload: { origin_kind: "HOME", origin_label: "5 Oak", driver_name: "Sam" }
              as: CrematoryOperator
              captures: { leg_id: $.data.id }
            - call: "PATCH /transport-legs/${leg_id}"
              payload: { status: "EN_ROUTE" }
              as: CrematoryOperator
            - call: "PATCH /transport-legs/${leg_id}"
              payload: { status: "ARRIVED" }
              as: CrematoryOperator
            - call: "POST /cases/${case_id}/receive"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches"
              payload: { retort_id: "${retort_id}", service_type: "PRIVATE", scheduled_start: "2026-03-05T08:00:00Z", scheduled_end: "2026-03-05T10:00:00Z" }
              as: CrematoryOperator
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/assign-case"
              payload: { case_id: "${case_id}" }
              as: CrematoryOperator
            - call: "POST /batches/${batch_id}/load"
              payload: {}
              as: CrematoryOperator
          trigger:
            - call: "POST /batches/${batch_id}/fire"
              payload: {}
              as: CrematoryOperator
          assert:
            - "Case.${case_id}.weight_tier == LARGE"
            - "Case.${case_id}.cremation_charge_cents == 31000"

      - name: combinatorial_communal_rounding_order_remainder
        grounds:
          - calculations.case_cremation_charge
          - entities.CremationBatch.fields.communal_firing_total_cents
          - state_machines.CremationBatch.LOADED_to_FIRING
        distinguishing_aspect: >
          Mode (b): communal allocation pins round-per-case-then-sum with the last member
          (created_at ASC) absorbing the remainder; weights 3/4/20 round individually to
          3333/4444/22222 (sum 29999) so the last absorbs +1 to 22223 — divergent from
          sum-then-round.
        test_recipe:
          setup:
            - "Clock at 2026-03-06T00:00:00Z; retort max_load 400; COMMUNAL batch with 3 cases (3,4,20 lbs) in creation order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T00:00:00Z" }
              as: CrematoryAdmin
            - call: "POST /retorts"
              payload: { label: "RT-C", max_load_lbs: 400 }
              as: CrematoryAdmin
              captures: { retort_id: $.data.id }
            - call: "POST /petowners"
              payload: { full_name: "Owner C", email: "ownerc@x.com", phone: "555-0004" }
              as: CrematoryOperator
              captures: { owner_id: $.data.id }
            - call: "POST /cases"
              payload: { owner_id: "${owner_id}", pet_name: "K1", species: "CAT", weight_lbs: 3, service_type: "COMMUNAL", pickup_kind: "CLINIC", bill_to: "OWNER" }
              as: CrematoryOperator
              captures: { k1: $.data.id }
            - call: "POST /cases/${k1}/transport-legs"
              payload: { origin_kind: "CLINIC", origin_label: "V", driver_name: "D" }
              as: CrematoryOperator
              captures: { k1leg: $.data.id }
            - call: "PATCH /transport-legs/${k1leg}"
              payload: { status: "EN_ROUTE" }
              as: CrematoryOperator
            - call: "PATCH /transport-legs/${k1leg}"
              payload: { status: "ARRIVED" }
              as: CrematoryOperator
            - call: "POST /cases/${k1}/receive"
              payload: {}
              as: CrematoryOperator
            - call: "POST /cases"
              payload: { owner_id: "${owner_id}", pet_name: "K2", species: "CAT", weight_lbs: 4, service_type: "COMMUNAL", pickup_kind: "CLINIC", bill_to: "OWNER" }
              as: CrematoryOperator
              captures: { k2: $.data.id }
            - call: "POST /cases/${k2}/transport-legs"
              payload: { origin_kind: "CLINIC", origin_label: "V", driver_name: "D" }
              as: CrematoryOperator
              captures: { k2leg: $.data.id }
            - call: "PATCH /transport-legs/${k2leg}"
              payload: { status: "EN_ROUTE" }
              as: CrematoryOperator
            - call: "PATCH /transport-legs/${k2leg}"
              payload: { status: "ARRIVED" }
              as: CrematoryOperator
            - call: "POST /cases/${k2}/receive"
              payload: {}
              as: CrematoryOperator
            - call: "POST /cases"
              payload: { owner_id: "${owner_id}", pet_name: "K3", species: "DOG", weight_lbs: 20, service_type: "COMMUNAL", pickup_kind: "CLINIC", bill_to: "OWNER" }
              as: CrematoryOperator
              captures: { k3: $.data.id }
            - call: "POST /cases/${k3}/transport-legs"
              payload: { origin_kind: "CLINIC", origin_label: "V", driver_name: "D" }
              as: CrematoryOperator
              captures: { k3leg: $.data.id }
            - call: "PATCH /transport-legs/${k3leg}"
              payload: { status: "EN_ROUTE" }
              as: CrematoryOperator
            - call: "PATCH /transport-legs/${k3leg}"
              payload: { status: "ARRIVED" }
              as: CrematoryOperator
            - call: "POST /cases/${k3}/receive"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches"
              payload: { retort_id: "${retort_id}", service_type: "COMMUNAL", scheduled_start: "2026-03-06T08:00:00Z", scheduled_end: "2026-03-06T10:00:00Z" }
              as: CrematoryOperator
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/assign-case"
              payload: { case_id: "${k1}" }
              as: CrematoryOperator
            - call: "POST /batches/${batch_id}/assign-case"
              payload: { case_id: "${k2}" }
              as: CrematoryOperator
            - call: "POST /batches/${batch_id}/assign-case"
              payload: { case_id: "${k3}" }
              as: CrematoryOperator
            - call: "POST /batches/${batch_id}/load"
              payload: {}
              as: CrematoryOperator
          trigger:
            - call: "POST /batches/${batch_id}/fire"
              payload: {}
              as: CrematoryOperator
          assert:
            - "Case.${k1}.cremation_charge_cents == 3333"
            - "Case.${k2}.cremation_charge_cents == 4444"
            - "Case.${k3}.cremation_charge_cents == 22223"

      - name: combinatorial_invoice_subtotal_then_fee_tier
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.handling_fee_cents
          - entities.Invoice.fields.subtotal_cents
        distinguishing_aspect: >
          Mode (c): invoice total looks circular (total includes fee) but the fee is
          derived from the subtotal tier; evaluation order is pinned subtotal -> fee ->
          total. subtotal 35500 falls in the 20000..50000 mid tier -> fee 1500 -> total 37000.
        test_recipe:
          setup:
            - "Clock at 2026-03-07T00:00:00Z; PRIVATE owner-billed case (MEDIUM, expedited -> charge 23000) CREMATED."
            - "Case has a PAW_PRINT keepsake (4500) and an URN keepsake (8000); subtotal 35500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-07T00:00:00Z" }
              as: CrematoryAdmin
            - call: "POST /retorts"
              payload: { label: "RT-I", max_load_lbs: 300 }
              as: CrematoryAdmin
              captures: { retort_id: $.data.id }
            - call: "POST /petowners"
              payload: { full_name: "Owner I", email: "owneri@x.com", phone: "555-0005" }
              as: CrematoryOperator
              captures: { owner_id: $.data.id }
            - call: "POST /cases"
              payload: { owner_id: "${owner_id}", pet_name: "Bo", species: "DOG", weight_lbs: 50, service_type: "PRIVATE", expedited: true, pickup_kind: "HOME", bill_to: "OWNER" }
              as: CrematoryOperator
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/keepsake-orders"
              payload: { item_type: "PAW_PRINT" }
              as: CrematoryOperator
            - call: "POST /cases/${case_id}/keepsake-orders"
              payload: { item_type: "URN" }
              as: CrematoryOperator
            - call: "POST /cases/${case_id}/transport-legs"
              payload: { origin_kind: "HOME", origin_label: "9 Pine", driver_name: "Sam" }
              as: CrematoryOperator
              captures: { leg_id: $.data.id }
            - call: "PATCH /transport-legs/${leg_id}"
              payload: { status: "EN_ROUTE" }
              as: CrematoryOperator
            - call: "PATCH /transport-legs/${leg_id}"
              payload: { status: "ARRIVED" }
              as: CrematoryOperator
            - call: "POST /cases/${case_id}/receive"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches"
              payload: { retort_id: "${retort_id}", service_type: "PRIVATE", scheduled_start: "2026-03-07T08:00:00Z", scheduled_end: "2026-03-07T10:00:00Z" }
              as: CrematoryOperator
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/assign-case"
              payload: { case_id: "${case_id}" }
              as: CrematoryOperator
            - call: "POST /batches/${batch_id}/load"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches/${batch_id}/fire"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches/${batch_id}/complete"
              payload: {}
              as: CrematoryOperator
            - call: "GET /cases/${case_id}"
              payload: {}
              as: CrematoryAdmin
              captures: { case_v: $.data.version }
